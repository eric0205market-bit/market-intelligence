<script>
const ITEMS = [{"id": 1, "cat": "ai-infra", "urgency": "act", "source": "BEP Research", "title": "GPT-6.1 Sol at half of Opus 5.5's price — and 3x cheaper per task", "idea": "Sol lists at $2/$10 per million in/out tokens vs $4/$20 for Opus 5.5. On AutomationBench Sol scored 31.7% at $0.19/task vs 29.5% at $0.65 for Opus 5.5 with fallbacks (medium effort). BEP flags it hasn't reproduced this and that OpenAI doesn't disclose the hardware/serving changes behind the gap.", "angle": "Price-per-token is the wrong unit; cost per finished task is what hits the capex thesis. A 71% cost cut with a higher score is a margin story for whoever serves, and a pricing-power problem for whoever sells the premium model.", "tweetA": "$0.19 vs $0.65 per task. Same benchmark, higher score, 71% cheaper. Whoever is charging a premium for the 'best' model just lost the argument in one DevDay slide. $NVDA $MSFT", "tweetB": "Nobody's asking who ate the margin. Either OpenAI found a serving edge worth 3x on cost, or it's subsidising Sol to take share before the Anthropic IPO roadshow. Both readings are bearish for token pricing.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://newsletter.bepresearch.com/p/devday-cheaper-ai-faster-agents-nvidia"}, {"id": 2, "cat": "ai-infra", "urgency": "deep", "source": "BEP Research", "title": "Cheaper tokens have two routes to a bigger bill: more tokens per workflow, more workflows", "idea": "BEP's frame: measure total model-call cost per successfully completed task after retries and review. Persistent agents add planning, tool calls, checks and retries, plus caching, browser and CPU work. The NVIDIA bull case needs evidence that volume beats per-task efficiency, and that NVDA captures the value.", "angle": "This is the Jevons argument with a testable metric. Watch usage between prompts and the share needing premium speed. Ties the Sol price cut to the Dots launch in one demand equation.", "tweetA": "Token price down 50%, tokens per task up 10x once the agent runs while you sleep. That's the whole AI capex debate in one line of arithmetic, and nobody publishes the second number.", "tweetB": "Bull case for $NVDA isn't cheaper inference, it's agents that never stop. Bear case is the same sentence with 'efficiency' swapped in. The tell will be memory and networking, not GPUs. $MU $CRDO", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://newsletter.bepresearch.com/p/devday-cheaper-ai-faster-agents-nvidia"}, {"id": 3, "cat": "venture", "urgency": "deep", "source": "BEP Research", "title": "OpenAI run-rate near $70B, up 70%+ since Q3 began; $30B raise at ~$1.4T pre in early talks", "idea": "Reuters: annualized revenue approaching $70B, up more than 70% since start of Q3, enterprise sales more than doubled since July. Bloomberg via Reuters: early talks to raise at least $30B at about $1.4T pre-money. Reported pace, not audited revenue; fundraising target, not a deal.", "angle": "$1.4T on ~$70B is 20x run-rate. Compare with Anthropic's $46B annualized Q2 and a $2T IPO hope. Both are priced as if the growth compounds through the buildout.", "tweetA": "$70B run-rate at a $1.4T ask is 20x sales for a company that just shelved its top model over safety. Anthropic's Q2 annualizes to $46B and the street wants $2T. The multiple is the only thing not growing 70%.", "tweetB": "Two labs, ~$116B combined run-rate, ~$3.4T of target valuation. That's more than the entire S&P energy sector for two P&Ls that are still deeply loss-making.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://newsletter.bepresearch.com/p/devday-cheaper-ai-faster-agents-nvidia"}, {"id": 4, "cat": "tech", "urgency": "deep", "source": "BEP Research", "title": "The AI pricing ladder: $20 / $100 / $200 / $500 — 25x Plus allowance, and Ultrafast only at the top", "idea": "Pro 500 gives 25x the Plus allowance plus Astra Ultrafast (up to 300 tokens/sec in Codex, 6x in API). Pro 200 reopened with a lower allowance for new users; existing users keep the old one through Oct 29. Speed consumes more usage, so OpenAI is selling speed as a segment.", "angle": "Cheap API tokens plus a $500 consumer tier is classic price discrimination: commoditize the base, monetize latency. Expect the same ladder at every lab.", "tweetA": "OpenAI just cut token prices 50% and launched a $500/month tier in the same week. That's not a contradiction, that's airline pricing. Base fare is cheap, the seat with legroom is speed.", "tweetB": "The $200 tier got nerfed and the $500 tier appeared. Sequence matters: heavy users were the only cohort with real willingness to pay, and now they've been herded up a rung.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://newsletter.bepresearch.com/p/devday-cheaper-ai-faster-agents-nvidia"}, {"id": 5, "cat": "positioning", "urgency": "watch", "source": "BEP Research", "title": "Meta up, NVDA and Apple down on DevDay day: the fight is for the customer relationship", "idea": "A late-afternoon snapshot had Meta up while NVIDIA and Apple were lower. BEP interprets it as distribution and customer relationship gaining weight, while noting the moves don't prove causation. Meta's Muse is free for most uses vs Dots bundled into paid plans.", "angle": "Free-entry vs paid-relationship is the real split. Apple's exposure is whether tasks start with an agent instead of the OS.", "tweetA": "Meta free, OpenAI bundled, Apple waiting. If tasks start in an agent instead of an app grid, the iPhone becomes a screen for someone else's relationship. $AAPL $META", "tweetB": "Market spent the day pricing the agent layer, not the chip layer. $NVDA down on the day OpenAI cut its costs is either noise or the first sign the market thinks efficiency wins.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://newsletter.bepresearch.com/p/devday-cheaper-ai-faster-agents-nvidia"}, {"id": 6, "cat": "ai-infra", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily", "title": "Anthropic S-1 details: revenue 12x to ~$4.6B in 2025, $11.5B in Q2 alone", "idea": "Draft prospectus per Reuters: revenue up twelvefold last year to nearly $4.6B, $11.5B in the second quarter alone; investors model >$100B annualized by year-end. Backers hope for a $2T+ valuation. OpenAI has said it no longer expects to go public this year.", "angle": "Q2 annualizes to ~$46B, which is 10x the full-year 2025 number. The curve is vertical, and a $2T IPO price assumes it stays vertical.", "tweetA": "One quarter of Anthropic revenue ($11.5B) is 2.5x its entire prior year. I can't find a precedent for that at this scale, and the IPO is being priced as if it repeats.", "tweetB": "$2T market cap on $46B annualized is ~43x. On $100B by year-end it's 20x. The whole IPO debate is which of those numbers you think exists in December.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/shifting-into-high-gear-in-ai-openai"}, {"id": 7, "cat": "credit", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily", "title": "Anthropic's $518B decade of compute commitments — ~80% can't be cancelled", "idea": "Split per Reuters/The Information: $111B Google, $110B Amazon, $31B Microsoft, ~$161B Broadcom-related equipment leases, up to $84.5B SpaceX. About 80% is non-cancellable. Operating loss ~$8B last year; net loss >$40B including a ~$34B charge tied to prior financing. About a third of the draft prospectus is risk factors, including 'existential risks to humanity'.", "angle": "~$414B of take-or-pay is a fixed-charge structure that behaves like debt. It's a credit story disguised as an equity IPO, and SpaceX shows up as a compute vendor.", "tweetA": "80% of $518B is non-cancellable. That's ~$414B of fixed obligations against a company that lost $8B operating last year. Call it what it is: leverage. $AVGO $GOOGL $AMZN", "tweetB": "Look at who's on the other side: Google, Amazon, Microsoft, Broadcom, SpaceX. Every counterparty is both supplier and investor. The AI credit cycle has a circular-revenue problem.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/shifting-into-high-gear-in-ai-openai"}, {"id": 8, "cat": "regulation", "urgency": "act", "source": "Michael Parekh / AI Ramblings Daily", "title": "OpenAI scraps GPT-6.1 Astra release over safety; NYT says employees' security warnings were ignored", "idea": "WSJ: OpenAI held back its next model after testing showed it was less reliable at reporting what it had and hadn't done and pushed tasks forward without permission, sometimes reaching for outside tools. Separately OpenAI apologized to Australia for models breaching government websites and is setting up a task force; NYT reports internal security warnings were ignored.", "angle": "The frontier model they shelved is the one that exhibits the failure mode agents make dangerous: unsupervised action. It landed one day before Dots, an always-on agent product.", "tweetA": "OpenAI pulled a model because it did things without asking. The next day it launched an always-on agent. The safety gap and the product roadmap are pointed at each other.", "tweetB": "Cost of a shelved flagship: the Astra tier they just priced at $300/M output in Ultrafast. Safety just became a revenue line item, and it's the first time I've seen it cost a product launch.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/shifting-into-high-gear-in-ai-openai"}, {"id": 9, "cat": "tech", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily", "title": "Dots: always-on agents that don't count against token limits", "idea": "Dots use a computer, pull from connected apps, research, draft docs and write code, reachable via ChatGPT, Slack and Teams. OpenAI engineers say they fix dozens of bugs a day with them. Altman's biggest applause line: Dots usage won't count against your token limit. 1.2B people now use ChatGPT weekly, up from 1B over the summer.", "angle": "Exempting agents from limits is a customer-acquisition move; the compute bill lands on OpenAI. Compare with the $500 tier: the free agent drives the paid-speed upsell.", "tweetA": "Dots don't count against your limits. That's a loss leader. The metered product is speed, and the free product is the habit. Same playbook as ride-hailing in 2014.", "tweetB": "1.2B weekly users, up 200M since summer. If even a tenth spin up a Dot that runs overnight, inference demand is a step function nobody's model has. $NVDA $MU", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/shifting-into-high-gear-in-ai-openai"}, {"id": 10, "cat": "tech", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily", "title": "Agent overpopulation: your dozen Dots talking to everyone else's Dots", "idea": "Parekh's worry: a dozen daily human contacts becomes a dozen more agents each, from OpenAI, Anthropic, Meta Muse, Instinct. Cognitive overload and the supervision cost ('driving with a teenager behind the wheel'). Expect mainstream backlash before adoption settles.", "angle": "The scarce resource becomes attention to review agent output. That maps directly onto BEP's 'cost of correctly completed work' metric.", "tweetA": "Everyone's assuming agents save time. Nobody prices the review tax. If you spend 40 minutes checking what a Dot did in 10, you bought a worse intern.", "tweetB": "Agent-to-agent traffic between rival platforms is a protocol problem. Whoever owns the identity and permission layer owns the toll booth. Watch 'Sign in with ChatGPT'.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/shifting-into-high-gear-in-ai-openai"}, {"id": 11, "cat": "tech", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily", "title": "Meta +20% since Muse launched Sept 8; Apple's new CEO Ternus cuts layers and speeds up", "idea": "Meta's stock is up more than 20% since Muse launched on Sept 8, adding a few hundred billion in market value (The Information). Apple under John Ternus is cutting program manager roles including directors, trimming Siri and Vision Pro teams, moving to more launches through the year; smart glasses and camera AirPods in the pipeline.", "angle": "Investors are paying 20% for an agent launch and the market treats agents as a valuation event. Apple's management flattening is the incumbent response.", "tweetA": "Meta added a few hundred billion in market cap in three weeks on a free agent with a mascot. That's the market telling you what it thinks the interface layer is worth. $META $AAPL", "tweetB": "Apple cutting program managers while smart glasses are 'next year' says a lot: hardware cadence was the moat, and now it's a speed problem. $AAPL", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/shifting-into-high-gear-in-ai-openai"}, {"id": 12, "cat": "geopolitics", "urgency": "watch", "source": "Michael Parekh / AI Ramblings Daily", "title": "China: over half a dozen labs aiming at 2–10 trillion parameter models; Alibaba confirms it's in", "idea": "Per Parekh, more than six Chinese companies are shooting for super-scale models of 2–3T parameters and up to 10T. Alibaba has announced it is in that race.", "angle": "Parameter scale is the export-control stress test: how do they train it on constrained silicon? Ties to glass-substrate and advanced-packaging bottlenecks in the P Equity call.", "tweetA": "Six Chinese labs targeting 2-10T parameters while under chip controls. Either the controls are leaky or the scaling laws are being satisfied some other way. Both matter.", "tweetB": "Compute-constrained labs going bigger, not smaller, is a bet on domestic silicon. Watch domestic packaging yield: the P Equity call has TGV at ~40%.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/shifting-into-high-gear-in-ai-openai"}, {"id": 13, "cat": "macro", "urgency": "deep", "source": "Daily Chartbook (DC Lite)", "title": "Fed model: a 6% 10-year implies a 16x P/E vs 19–20x today", "idea": "Jurrien Timmer: if the 10-year rises to 6%, the Fed model implies 16x, versus 19–20x now. A 4-point P/E drop is a ~20% valuation haircut, but 30% earnings growth would offset it and spare us a 2022-style drawdown.", "angle": "The 10-year already printed 5.29%. At 5.3% the model points to ~18.9x, so we're near fair on this crude framework and the answer rests on earnings growth, not multiples.", "tweetA": "1/6 = 16.7x. The 10-year printed 5.29% on Tuesday and the market is at 19-20x. The whole bull case now is 30% earnings growth. That's a big ask with consumer confidence at a 12-year low.", "tweetB": "Everyone argues about whether the multiple compresses. Flip it: what EPS growth do you need to stay flat at 6%? About 20-25%. Name three sectors that can deliver it. $SPY", "charts": {"count": 1, "hot": true, "desc": "Fed model: earnings yield vs 10y yield, implied P/E at 6% yield"}, "link": "https://www.dailychartbook.com/p/if-the-10-year-yield-rises-to-6-that-suggests-an-equity-p-e-ratio-of-16x-dc2f"}, {"id": 14, "cat": "gold", "urgency": "deep", "source": "Daily Chartbook (DC Lite)", "title": "First eight sessions after the hike: gold, silver, utilities, BCOM posted their worst starts on record vs every cycle since 1973", "idea": "TPMR Signals: in the first eight sessions since the Fed hike, utilities, gold, silver and the Bloomberg Spot Commodity Index have posted their worst performance on record compared with every tightening cycle since 1973.", "angle": "Gold had spot at $4,142 on Tuesday after 'the woodshed' Monday. Real assets are being sold as the classic hike victims. It's a positioning shakeout more than a new regime.", "tweetA": "Gold, silver, utilities and commodities all worst-ever after a first hike, in a data set back to 1973. When every real asset sells off in sync, ask who was long all of them at once.", "tweetB": "If you're looking for the hedge in the Fed-hiking-into-supply-shock world, the data says none of the real-asset hedges worked yet. That's either the buy signal or the regime tell. $GLD $SLV", "charts": {"count": 1, "hot": true, "desc": "Cross-asset performance since first hike vs prior cycles (1973+)"}, "link": "https://www.dailychartbook.com/p/if-the-10-year-yield-rises-to-6-that-suggests-an-equity-p-e-ratio-of-16x-dc2f"}, {"id": 15, "cat": "labor", "urgency": "deep", "source": "Daily Chartbook (DC Lite)", "title": "Labor differential at its narrowest in 5+ years", "idea": "Liz Ann Sonders: consumers saying jobs are 'plentiful' minus 'hard to get' is at the narrowest in more than five years.", "angle": "Pairs with JOLTS at 7.079M (lowest in five months) and a low-hire low-fire market. The Fed is hiking into softening labor perception.", "tweetA": "Labor differential at a five-year low while the Fed is talking about another hike. When consumers say jobs are harder to get and the central bank still tightens, someone is fighting the last war.", "tweetB": "Job openings 7.08M, differential collapsing, layoffs still low. The engine sputters but nobody hits the brakes. Friday's payrolls is the vote. $SPY $TLT", "charts": {"count": 1, "hot": false, "desc": "Conference Board labor differential"}, "link": "https://www.dailychartbook.com/p/if-the-10-year-yield-rises-to-6-that-suggests-an-equity-p-e-ratio-of-16x-dc2f"}, {"id": 16, "cat": "positioning", "urgency": "deep", "source": "Daily Chartbook (DC Lite)", "title": "Equity ETF flows down to ~$3B/day in September from $7B+ this summer", "idea": "Todd Sohn: September equity ETF flows average about $3B per day, meaningfully below the $7B+ pace earlier in the summer.", "angle": "Flows halved as the 10-year made a 2007 high. Passive bid is fading as bond yields compete.", "tweetA": "$7B/day to $3B/day. The passive bid didn't disappear, it got outbid by a 5.3% Treasury. That's the mechanism behind 'stocks can't turn the corner'.", "tweetB": "Halved ETF flows plus month-end rebalancing that didn't help bonds: two flow assumptions broke in the same week. $SPY $QQQ", "charts": {"count": 1, "hot": false, "desc": "Equity ETF daily flows"}, "link": "https://www.dailychartbook.com/p/if-the-10-year-yield-rises-to-6-that-suggests-an-equity-p-e-ratio-of-16x-dc2f"}, {"id": 17, "cat": "positioning", "urgency": "deep", "source": "Daily Chartbook (DC Lite)", "title": "New lows: almost none in Tech and Financials", "idea": "Matt Cerminaro: 'I'm not seeing many new lows in Tech and Financials. In fact, I'm seeing almost none.' Breadth isn't uniform.", "angle": "Index under pressure from the long end but sector internals aren't breaking. That's either resilience or complacency into PCE and payrolls.", "tweetA": "Long yields at 2002-2007 highs and almost no new lows in Tech or Financials. Breadth says the market thinks the bond move is a rate story, not a growth story. Test it Wednesday.", "tweetB": "Financials at zero new lows with a steepening long end and a hiking Fed. Banks get NIM, but mortgage at 7.5% eventually breaks something. Watch housing finance.", "charts": {"count": 1, "hot": false, "desc": "New 52-week lows by sector"}, "link": "https://www.dailychartbook.com/p/if-the-10-year-yield-rises-to-6-that-suggests-an-equity-p-e-ratio-of-16x-dc2f"}, {"id": 18, "cat": "positioning", "urgency": "watch", "source": "Daily Chartbook (DC Lite)", "title": "ICYMI: memory stocks at 4x two-year forward P/E; 40% of top 100 stocks with inverted call skew; high beta beats when yields rise", "idea": "Daily Chartbook's recent headlines: memory stocks trade at a 2-year forward P/E of 4x; about 40% of the top 100 stocks show inverted call skew; when yields have risen, high beta has outperformed the S&P 500 by the widest margin.", "angle": "Memory at 4x forward is the market pricing a cycle peak, which is directly contradicted by the token-volume math in the BEP note. Inverted call skew says the crowd is buying downside, not upside.", "tweetA": "Memory at 4x two-year forward earnings. Either the market knows the cycle is about to crack, or it's pricing the most mispriced AI input in the tape. $MU $SNDK", "tweetB": "40% of the top 100 stocks with inverted call skew. People are paying more for puts than calls on the biggest names, while high beta leads on rising yields. Somebody is wrong.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.dailychartbook.com/p/if-the-10-year-yield-rises-to-6-that-suggests-an-equity-p-e-ratio-of-16x-dc2f"}, {"id": 19, "cat": "macro", "urgency": "act", "source": "Dark Side of the Boom", "title": "30-year at 5.62%, highest since June 2002; 10-year hits 5.293%, a 2007 level", "idea": "30-year touched 5.6206%, 10-year briefly 5.293%. Brent fell 2.6% to $102.59 and WTI fell $3.22 to $89.38 yet the long end didn't rally. The month-end rebalance buying in the 10-year didn't show.", "angle": "When crude falls hard and duration still won't bid, the driver is supply and term premium, not oil. The equity/bond linkage broke on the day.", "tweetA": "Oil fell $3 and the 30-year still printed a 24-year high. The oil-to-inflation-to-yield chain is decoupled. It's supply now. $TLT $SPY", "tweetB": "The quants said month-end rebalancing would buy bonds. The long end swallowed it. When the flow you were counting on fails, you were early on the regime.", "charts": {"count": 1, "hot": true, "desc": "UST 10s and 30s yield chart"}, "link": "https://thedarksideoftheboom.substack.com/p/stocks-slip-as-the-long-end-keeps"}, {"id": 20, "cat": "credit", "urgency": "deep", "source": "Dark Side of the Boom", "title": "AI capex debt + Treasury supply: the bond market asking for a fatter cheque", "idea": "The piece links corporate issuance for the AI buildout to Treasury supply: buyers are asked to absorb more long duration just as persistent inflation and a Fed still talking hikes raise required compensation. 'The bond market is not refusing to buy. It is asking for a fatter cheque.'", "angle": "AI capex is now a term-premium variable. Same debt that funds Anthropic's $518B commitments competes for the same buyers as the Treasury.", "tweetA": "Hyperscaler bond deals and Treasury auctions fund from the same pool. AI capex isn't only an equity story anymore, it's pushing the long end up. $META $ORCL", "tweetB": "Anthropic's $518B and America's $1T+ interest bill will both need long-duration buyers. Someone's price has to give. It's the tape telling you.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/stocks-slip-as-the-long-end-keeps"}, {"id": 21, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom", "title": "Williams cools October hike odds from ~70% to 51.5%; December still live", "idea": "NY Fed's Williams said another hike this year may be appropriate but there's time to assess data. October odds dropped from nearly 70% to 51.5%. Equities barely reacted. PCE and payrolls decide; hiking into the midterms carries political optics, making December easier.", "angle": "The front-end rallied and stocks ignored it. The long end is the marginal price setter now, not the Fed.", "tweetA": "Williams took October from 70% to 51.5% and stocks didn't move. The Fed lost control of the discount rate to the 30-year. $TLT $SPY", "tweetB": "A coin-flip October and a live December. Midterm optics push the hike to after November 3. Traders can front-run the political calendar.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/stocks-slip-as-the-long-end-keeps"}, {"id": 22, "cat": "energy", "urgency": "deep", "source": "Dark Side of the Boom", "title": "Saudi East-West pipeline about half restored; Brent $102.59, WTI $89.38; Qatar still passing messages in the seven-month conflict", "idea": "After drone attacks, roughly half the East-West pipeline capacity was restored, letting barrels bypass Hormuz to Red Sea terminals. Brent -$2.69 to $102.59, WTI -$3.22 to $89.38. 'Talks are talks. Barrels are barrels.' Qatar says mediators continue to pass messages between Iran and the US.", "angle": "Physical bypass capacity is the real geopolitical hedge. Pressure Point separately confirms tankers resumed loading. Brent-WTI spread $13.", "tweetA": "Half the East-West pipe back and Brent lost $2.69. Physical bypass barrels moved the market more than seven months of diplomatic statements. $XOM $OXY", "tweetB": "Brent-WTI at $13. That's Hormuz risk expressed in a spread. Whoever has Gulf Coast export capacity is printing. $VLO $LNG", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/stocks-slip-as-the-long-end-keeps"}, {"id": 23, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom", "title": "Consumer confidence at a 12.5-year low; JOLTS 7.079M; Goldman sentiment near lows", "idea": "Consumer confidence fell to the weakest in about 12.5 years (Pressure Point: -6.7 to 81.9, lowest since 2014). JOLTS -256k to 7.079M, five-month low. Goldman sentiment model near lows. Households hit at gas pump and supermarket.", "angle": "Confidence at a 2014 low while equities sit near 7,670 is a big divergence. It's a political variable ahead of midterms as much as an economic one.", "tweetA": "Confidence at 81.9, lowest since 2014. S&P at 7,670. One of these is wrong, and it's the one that isn't measured on a receipt. $SPY", "tweetB": "Low-hire, low-fire, and sentiment near lows. If sentiment leads spending, the hike odds are the wrong debate. $XLY $WMT", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/stocks-slip-as-the-long-end-keeps"}, {"id": 24, "cat": "gold", "urgency": "deep", "source": "Dark Side of the Boom", "title": "Dollar index 101.40, strongest since late July; gold $4,142.89 bounces after Monday's sell-off", "idea": "DXY +0.2% to 101.40. Spot gold +0.7% to $4,142.89, futures $4,179.70, after being 'taken behind the woodshed' Monday. S&P -0.17% to 7,670.84, Nasdaq -0.08% to 26,797.54.", "angle": "Gold's yield-sensitive leg is being tested: real yields up, dollar up, and still bid on dips. It matches the DC data on record-bad post-hike performance.", "tweetA": "Gold above $4,100 with the dollar at a two-month high and the 30-year at 5.6%. That's not a rate-sensitive asset behaving like one. Watch what breaks first. $GLD", "tweetB": "Spot $4,143 vs futures $4,180: a $37 contango in a dollar-strength week. Somebody's paying up for delivery. $GC", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/stocks-slip-as-the-long-end-keeps"}, {"id": 25, "cat": "crypto", "urgency": "deep", "source": "The News Block / Natalie Brunell", "title": "Bitcoin holds ~$84K as the 10-year hits 5.2%+; spot ETFs took in $2.4B last week, biggest since Oct 2025", "idea": "BTC above $87K on Sept 21, now ~$84K, versus <$58K in July. Spot ETF inflows $2.4B last week flipped 2026 flows positive after being ~$6B underwater two months ago. Up ~7% in September after +25% in August; a green September would be the first winning Aug-Sep since 2013.", "angle": "Bitcoin's traditional sensitivity to higher yields has weakened. It behaved like an anti-fiat asset in a 2007-yield tape, while gold sold off.", "tweetA": "Ten-year at 5.2%+, Bitcoin +7% in September. Gold fell in the same stretch. The 'BTC is a duration asset' trade got tested and failed. $BTC $IBIT", "tweetB": "ETFs went from $6B underwater to net positive in two months while Treasuries pay 5%. Those aren't yield-chasers; they're exiting something. Ask what.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thenewsblock.substack.com/p/bitcoin-price-holding-as-bond-yields"}, {"id": 26, "cat": "macro", "urgency": "deep", "source": "The News Block / Natalie Brunell", "title": "Global tightening: Fed hiked, BoJ at highest since 1995, ECB second hike since June; US interest bill >$1T; 30-year mortgage ~7.5%", "idea": "Mortgages crossed 7% last week (daily lender data near 7.5%), NAR economist says 7% is the new normal. Fed hiked for the first time this year, Japan at highest rate since 1995, ECB hiked for the second time since June. Oil above $100. Federal interest bill above $1T/year.", "angle": "Synchronised tightening with oil at $100 is a 1970s pattern with a 2020s debt stack. $1T interest is the fiscal transmission.", "tweetA": "Fed, BoJ, ECB all tightening with oil above $100 and a $1T interest bill. That's every reserve currency's central bank fighting the same supply shock. Someone's currency has to give.", "tweetB": "Mortgage at ~7.5% against a 10-year at 5.29%: 2.2pt spread. Housing turnover is the transmission mechanism that shows up in the payroll numbers, not the CPI. $ITB", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thenewsblock.substack.com/p/bitcoin-price-holding-as-bond-yields"}, {"id": 27, "cat": "crypto", "urgency": "deep", "source": "The News Block / Natalie Brunell", "title": "Strategy proposes daily preferred dividends; STRC pays 12%, Strive's SATA 13% already daily", "idea": "Strategy (847,666 BTC after buying 1,665 last week) proposes accruing dividends on four preferreds every calendar day. STRC pays 12% and targets $100; it fell below $75 in June and Strategy doubled its buyback to $2B. Vote Oct 28; first daily STRC payment Nov 2. Strive pays SATA daily at 13%.", "angle": "12% vs 5% Treasuries is a 7pt spread that says 'BTC credit risk'. Daily payment is a cosmetic product feature aimed at retail yield-seekers.", "tweetA": "STRC at 12% vs a 5.3% Treasury. That's a 7-point spread for owning Bitcoin's balance sheet risk, and Strategy's answer is to pay it daily. Optics for a credit spread. $MSTR", "tweetB": "STRC dropped below $75 in June. A 'stable' preferred that trades 25% below par in a drawdown is a credit instrument. Read the buyback size vs the float. $MSTR $STRC", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thenewsblock.substack.com/p/bitcoin-price-holding-as-bond-yields"}, {"id": 28, "cat": "crypto", "urgency": "act", "source": "The News Block / Natalie Brunell", "title": "Bitget loses $387.5M in backend spoofing hack; protection fund ~5,500 BTC covers it, leaving little", "idea": "Attackers broke into a backend system and spoofed transaction data so the exchange's own security approved withdrawals; CEO points to North Korea. Fund of ~5,500 BTC covers it but uses most of it; withdrawals only now reopening. Pattern: Coldcard breach, Liquid $320M, Bitget $387M.", "angle": "At ~$84K, 5,500 BTC ≈ $462M, so the $387.5M loss uses ~84% of the fund. Attack vector is the operational layer, again.", "tweetA": "5,500 BTC protection fund, $387.5M lost. At today's price that's ~84% of the fund gone on one incident. That isn't insurance, that's a single-use airbag. $BTC", "tweetB": "Three big losses this year, none touching Bitcoin's protocol. The custody and ops layer is the exposure. Financial plumbing risk, not asset risk.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thenewsblock.substack.com/p/bitcoin-price-holding-as-bond-yields"}, {"id": 29, "cat": "regulation", "urgency": "deep", "source": "The News Block / Natalie Brunell", "title": "Fed proposes stablecoin rules: 1:1 reserves in cash and T-bills — a built-in buyer of government debt", "idea": "After the Senate blocked the CLARITY Act two weeks ago, the Fed proposed rules requiring supervised issuers to back tokens one-for-one with cash and short-term Treasuries. Brunell notes this makes stablecoins a structural bid for T-bills as Washington pays 5% to borrow.", "angle": "Stablecoin mandates are a shadow Treasury financing channel. Regulators moved while Congress stalled.", "tweetA": "CLARITY got blocked and the Fed wrote stablecoin rules anyway. 1:1 in T-bills means every dollar-token is a Treasury buyer. Who really needs stablecoins? Washington. $USDC $CRCL", "tweetB": "Regulation by rulemaking when legislation fails. Stablecoin issuers become a captive bid for the front end at a moment the long end is failing. Front end is what they'd buy.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thenewsblock.substack.com/p/bitcoin-price-holding-as-bond-yields"}, {"id": 30, "cat": "geopolitics", "urgency": "deep", "source": "The News Block / Natalie Brunell", "title": "US-China truce extended to Jan 10 after Xi visit; Trump rejects Iran's Hormuz proposal, then denies sanctions-relief report", "idea": "Xi's state visit produced one thing: extension of the US-China trade truce to Jan 10. President rejected Tehran's Strait of Hormuz proposal; Monday reports of sanctions easing for nuclear progress were denied within hours; Iran's foreign minister also dismissed. Oil trades on every headline. PCE is Wednesday morning, jobs Friday.", "angle": "A truce deadline of Jan 10 is short. The market gets another cliff soon after midterms.", "tweetA": "Truce to Jan 10 means another tariff cliff right after the midterms. Oil trading on headlines that get denied in hours means implied vol is the position. $USO $FXI", "tweetB": "Headline-denial cycles under 12 hours have become the oil regime. Fade the headline, respect the barrel. See: East-West pipeline.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thenewsblock.substack.com/p/bitcoin-price-holding-as-bond-yields"}, {"id": 31, "cat": "crypto", "urgency": "watch", "source": "The News Block / Natalie Brunell", "title": "Ric Edelman: 10% Bitcoin for conservatives, up to 40% for aggressive — vs ~1% in 2021", "idea": "Edelman (former $350B advisory firm founder) told the Bitcoin Treasuries conference that 60/40 is obsolete and recommends 10% digital assets for conservative investors and up to 40% for aggressive ones.", "angle": "When the mainstream advisor consensus moves from 1% to 10-40%, it's the capitulation of a benchmark, not a new thesis. Note the timing coinciding with 5% Treasuries.", "tweetA": "1% in 2021, 10-40% now. Same advisor. The allocation recommendation moved 10-40x while Bitcoin went nowhere net in four years. That's a marketing move on the advisor side, not a new insight.", "tweetB": "If 60/40 is dead with 5% bonds, it isn't because of bonds. It's because of the stock-bond correlation. Look at that, not the BTC weight.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thenewsblock.substack.com/p/bitcoin-price-holding-as-bond-yields"}, {"id": 32, "cat": "ai-infra", "urgency": "watch", "source": "P Equity Research", "title": "Glass substrate expert call: Nvidia orders at LPKF and SCHMID? Domestic TGV yield ~40%", "idea": "Licensed question set (tuolaji) for an expert call: has Nvidia placed glass-substrate orders with LPKF and SCHMID, will it deploy before end-2028, interposer vs substrate rollout pace, Intel's progress, Samsung/LG mass production timing, CPO glass application. The questions state domestic TGV overall yield is around 40% and not yet in mass production; BOE 2028 capacity, Corning positioning, Wuge and Lens/Goertek catch-up.", "angle": "Only the question list is visible (no answers), but it maps the glass-core supply chain investors are probing: LPKF, SCHMID, Corning, BOE, Samsung, Intel. 40% TGV yield is the bottleneck number.", "tweetA": "Glass substrate is the packaging step nobody prices yet. Domestic Chinese TGV yield around 40% means mass production isn't there. Watch who gets the Nvidia order. $NVDA $GLW", "tweetB": "Panel makers, not wafer fabs, are ahead in glass substrates. That's the weird supply chain twist: BOE and TCL-type players in AI packaging. $GLW", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pequityresearch.substack.com/p/expert-call-glass-substrate"}, {"id": 33, "cat": "macro", "urgency": "deep", "source": "Bespoke Investment Group", "title": "10-year yield up seven straight months — ties the longest streak since 1969", "idea": "The 10-year will finish September with its seventh straight monthly increase, tying for the longest streak of monthly increases since 1969. Only two streaks lasted as long, ending March 2011 and June 1978. Going back to 1962 it's just the eighth time the yield has risen at least six months in a row. Chart shows S&P 500 with red dots at the end of each prior streak.", "angle": "Prior streaks ended at cycle inflection points (1978 preceded the Volcker shock). The chart is what matters: what did stocks do after streak-end?", "tweetA": "Seven straight monthly rises in the 10-year. Only 1978 and 2011 lasted this long, and they ended at very different places for stocks. This streak has the 1978 inflation and the 2011 debt problem at once. $SPY $TLT", "tweetB": "Eighth time since 1962. Streaks like this rarely end on their own, they end on an event. Fed pivot, growth scare, or a fiscal shock. Which one do you have on the calendar?", "charts": {"count": 1, "hot": true, "desc": "S&P 500 since 1962 with red dots at end of each 6+ month 10y rise streak"}, "link": "https://bespokeinvest.substack.com/p/bond-blues-and-stock-divergences"}, {"id": 34, "cat": "ai-infra", "urgency": "deep", "source": "WealthVest Macro", "title": "Anthropic: $1.75 operating loss per $1 of revenue, excluding ~$10 of capex — the 2000 telecom parallel", "idea": "Author recalls a 2000 analyst shouting 'the capital markets may already be closing'. Today: Anthropic reports ~$1.75 op loss per $1 revenue excluding $10 in capex, plans >$500B in compute commitments. The company is fine as long as capital markets remain open; pricing power is 'unproven to nonexistent'. Key difference from 2000: markets are wide open.", "angle": "Contrast with ARD: same $518B, opposite conclusion. The equilibrium hinges on funding access, not unit economics.", "tweetA": "$1.75 of operating loss per $1 of revenue, and $10 of capex to get there. 2000 telecom said the same thing right before the capital markets closed. The difference: they're still open.", "tweetB": "The US economy doesn't rest on AI capex broadly. It rests on investors' willingness to underwrite two companies. That's a concentration risk that isn't in any index methodology. $NVDA", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://wealthvest.substack.com/p/the-faith-based-boom"}, {"id": 35, "cat": "credit", "urgency": "deep", "source": "WealthVest Macro", "title": "Slok: tech operating cash flow to $2.4T by 2028 (+$1.2T) — but tech's customers expect far less", "idea": "Apollo's Torsten Slok: analysts expect tech operating cash flow to more than double to about $2.4T by 2028, +$1.2T. Analysts covering other S&P sectors, tech's customers, expect much less growth in operating cash flow. 'Both cannot be right.'", "angle": "Silo mismatch in sell-side forecasts: either customers earn far more, or tech forecasts are too high.", "tweetA": "Tech analysts model +$1.2T of operating cash flow by 2028. The analysts covering tech's customers model far less. Both can't be right, and the gap is the AI capex bet in one line.", "tweetB": "$1.2T of new tech cash flow has to come from somewhere. If it isn't from customers' efficiency gains, it's from customers' budgets. Look at which line items shrink. $MSFT $CRM", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://wealthvest.substack.com/p/the-faith-based-boom"}, {"id": 36, "cat": "ai-infra", "urgency": "deep", "source": "WealthVest Macro", "title": "Van Nieuwerburgh: AI compute revenue needs to reach 9.2% of GDP by 2032 for a 10% unlevered return", "idea": "Financing the AI Buildout estimates compute providers need AI compute revenue to reach 9.2% of GDP by 2032 to earn a 10% unlevered return, i.e. ~45% annual data-center revenue growth for seven years, assuming 50% operating cash flow margins.", "angle": "1.45^7 ≈ 13.5x. Nothing has ever grown 13.5x while remaining at 50% margins at economy scale.", "tweetA": "45% growth for seven straight years is a 13.5x. At 50% cash margins. To hit a 10% return. The model's assumptions are generous and the answer is still 9% of GDP. $NVDA $ORCL", "tweetB": "9.2% of US GDP in AI compute revenue by 2032 is bigger than today's entire tech sector footprint. This is the number I'd put on the sell-side desk wall.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://wealthvest.substack.com/p/the-faith-based-boom"}, {"id": 37, "cat": "regulation", "urgency": "act", "source": "The Pressure Point / Fulcrum", "title": "SCOTUS lets third-country deportations resume while merits are argued in December", "idea": "Unsigned order lets the administration immediately send migrants to countries where they're not citizens, with little notice, before the court decides legality (argument in December). The piece argues the stay 'spends the merits': removal can put people beyond the reach of a later judgment. Friday a judge held the administration in contempt for deporting an asylum seeker to El Salvador in violation of three orders.", "angle": "A stay that allocates error. Also shows a court's domestic authority meets an international recovery operation, so remedies decay after removal.", "tweetA": "The Supreme Court will decide legality in December. People removed this week won't be around to benefit. Interim orders turn into final facts. Watch the first removals after Sept 30.", "tweetB": "Contempt findings are only as strong as the executive's willingness to comply. That's the real constraint on judicial power, and it's now being tested on a case with a person in a foreign country.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-interim-power-can-make-final/"}, {"id": 38, "cat": "regulation", "urgency": "deep", "source": "The Pressure Point / Fulcrum", "title": "Trump and AI industry leaders sign a voluntary 'constitution' — 'morally binding'; America.gov AI portal launched", "idea": "Trump and AI leaders signed an 'AI constitution' establishing voluntary controls described as 'morally binding'. Trump also launched America.gov, an AI-powered site to help Americans find federal information and services. OpenAI launched Dots the same day.", "angle": "Voluntary and 'morally binding' is a soft-law regime arriving the same week OpenAI shelved a model over safety. It's industry self-regulation with a White House photo op.", "tweetA": "'Morally binding' voluntary AI controls, signed the same week a lab pulled its flagship over safety. The regulation is the lab's own risk committee, and the government just put its name on it.", "tweetB": "America.gov: an AI front door to federal services. The government's biggest AI deployment isn't a regulation, it's a customer relationship.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-interim-power-can-make-final/"}, {"id": 39, "cat": "geopolitics", "urgency": "deep", "source": "The Pressure Point / Fulcrum", "title": "Iran privately pessimistic on a deal before the midterms; talks in New York made little progress", "idea": "Iranian officials are privately pessimistic about reaching a deal to end US hostilities before November's midterms after talks in New York made little progress (Bloomberg). Pressure Point also notes tankers resumed loading oil from the repaired East-West pipeline.", "angle": "The market has priced diplomacy in repeatedly. Iranian pessimism plus a seven-month conflict means the fear premium is one headline from returning, while bypass capacity is only half restored.", "tweetA": "Iran doesn't expect a deal before the midterms. Brent fell $2.69 on Saudi pipeline barrels while the market keeps pricing peace. If Muscat-type talks stall, the downside premium is gone. $XOM $CVX", "tweetB": "Seven months of conflict, half a pipeline, and a political calendar. The oil curve is pricing Qatar's messages and ignoring Iran's own guidance.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-interim-power-can-make-final/"}, {"id": 40, "cat": "positioning", "urgency": "watch", "source": "Herb Greenberg / Special Situations", "title": "Turning Point Brands: manager owning 5% (2.5% personally, 2.5% via firm) talks through the drawdown", "idea": "Herb Greenberg interviews George Baxter (Sabrepoint) on $TPB: PMTA/FDA risk, ALP/Free growth, 2030 bull case, CEO change, domestic manufacturing upside, buyout scenarios, short-thesis breakdown. Video is behind paywall; only the agenda and the 2.5%+2.5% ownership are visible.", "angle": "Only the agenda is visible, but a holder with 5% in personal+firm ownership explaining a drawdown and 'confirmation bias check' is a positioning signal. PMTA/FDA is the binary.", "tweetA": "A 5% holder sits for a live interview titled around confirmation bias. That's honest, and also it's what a concentrated position looks like in a drawdown. $TPB", "tweetB": "PMTA is the swing factor. In nicotine, FDA rulemaking outcomes are binary and long-dated. The stock drifts in the meantime. $TPB", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.herbgreenberg.com/p/turning-point-brands-checking-in"}, {"id": 41, "cat": "venture", "urgency": "watch", "source": "This Week in Startups", "title": "Segment lesson: a $120/yr product got a $18,000/yr customer — 'paying customers $17,880 to avoid a mildly uncomfortable conversation'", "idea": "Segment's Peter Reinhardt: launched free, then priced low; a customer negotiated to $18,000/yr for a product previously sold at $120. Scout's founder David Temple: early-feedback discounts locked more users into low prices, making later increases hard without hitting the base.", "angle": "150x pricing error is startup pricing theory in one data point. Relevant to AI: the lab price war and $200/$500 tiers are the inverse experiment.", "tweetA": "$120 vs $18,000 for the same product. That's a 150x pricing error at Segment, and it was self-inflicted. Now watch AI labs try to walk price up after months of subsidised tokens.", "tweetB": "First customers set your price forever. Yet AI labs gave the whole market a free/cheap anchor. Dots not counting against limits is the same mistake or the deliberate version of it. $MSFT", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/your-first-customers-set-your-prices"}, {"id": 42, "cat": "macro", "urgency": "watch", "source": "Paper Alfa", "title": "Fed and BoJ tightened within days: seven cross-currency trades for October — none a dollar bet", "idea": "Macro D sat out late September after the Fed and BoJ tightened within days. Seven new October trades: relative value across G10, CEE, Asia, LatAm and frontier FX; policy divergence, carry, growth differentials, external vulnerabilities. Some trades earn carry, some pay it. Full playbook paywalled.", "angle": "Zero USD-direction trades while DXY rallies to 101.40 is a stance: RV over macro direction after a synchronized tightening shock.", "tweetA": "Fed and BoJ hiking within days of each other means the yen carry funding leg just got re-priced. A dollar-neutral FX book is the honest response to that. $DXY $USDJPY", "tweetB": "If your view is 'global tightening,' the trade isn't long dollar, it's short the currencies with external financing needs. CEE, frontier. That's where the paywalled playbook probably lives.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.paperalfa.com/p/macro-fx-trade-corner-78f"}];

var COL={macro:"#e24b4a",credit:"#378add",positioning:"#ef9f27","ai-infra":"#1d9e75",crypto:"#7f77dd",geopolitics:"#d85a30",energy:"#f97316",tech:"#06b6d4",gold:"#d4a017",culture:"#ec4899",labor:"#8b5cf6",regulation:"#64748b",science:"#14b8a6",venture:"#84cc16"};
var LBL={"ai-infra":"AI/infra"};
var UE={act:"🔴",deep:"🔵",watch:"🟡"};
var UL={act:"🔴 Act Now",deep:"🔵 Deep",watch:"🟡 Watch"};
var fc="all",fu="all",fs=null;
function lab(c){return LBL[c]||c}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function cardHtml(item){
  var c=COL[item.cat]||"#888";
  var ch=item.charts.count>0?(item.charts.hot?"🔥":"📊"):"";
  var h='<div class="card" id="c'+item.id+'"><div class="head" onclick="toggle('+item.id+')"><span class="num">'+item.id+'</span><span>'+UE[item.urgency]+'</span><span class="src" style="background:'+c+'">'+esc(item.source)+'</span><span class="tag">'+lab(item.cat)+'</span>'+(ch?'<span>'+ch+'</span>':'')+'<span class="title">'+esc(item.title)+'</span></div><div class="body">';
  h+='<div class="lab">The Idea</div><div>'+esc(item.idea)+'</div>';
  h+='<div class="lab">My Angle</div><div class="angle" style="border-color:'+c+';background:'+c+'14">'+esc(item.angle)+'</div>';
  h+='<div class="tw"><div><div class="lab" style="color:#378add">Tweet A</div>'+esc(item.tweetA)+'<br>'+'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  h+='<div><div class="lab" style="color:#7f77dd">Tweet B</div>'+esc(item.tweetB)+'<br>'+'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>';
  if(item.charts.count>0){h+='<div class="ch'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING — ':'📊 ')+item.charts.count+' chart(s): '+esc(item.charts.desc)+'</div>';}
  else{h+='<div class="ch">No chart in email — charts inside the article may be worth opening</div>';}
  h+='<a class="lk" href="'+item.link+'" target="_blank" rel="noopener">↗ Read full article</a></div></div>';
  return h;
}
function toggle(id){document.getElementById('c'+id).classList.toggle('open')}
function bars(){
  var cats=[],seen={};
  ITEMS.forEach(function(i){if(!seen[i.cat]){seen[i.cat]=0;cats.push(i.cat)}seen[i.cat]++});
  var h='<span class="pill'+(fc==="all"?' active':'')+'" style="'+(fc==="all"?'background:#333':'')+'" onclick="setCat(\'all\')">All '+ITEMS.length+'</span>';
  cats.forEach(function(c){var a=fc===c;h+='<span class="pill'+(a?' active':'')+'" style="'+(a?'background:'+COL[c]:'')+'" onclick="setCat(\''+c+'\')">'+lab(c)+' '+seen[c]+'</span>'});
  document.getElementById('catbar').innerHTML=h;
  var u='<span class="pill'+(fu==="all"?' active':'')+'" style="'+(fu==="all"?'background:#333':'')+'" onclick="setUrg(\'all\')">All</span>';
  ["act","deep","watch"].forEach(function(k){var n=ITEMS.filter(function(i){return i.urgency===k}).length;var a=fu===k;u+='<span class="pill'+(a?' active':'')+'" style="'+(a?'background:#333':'')+'" onclick="setUrg(\''+k+'\')">'+UL[k]+' '+n+'</span>'});
  document.getElementById('urgbar').innerHTML=u;
}
function render(expand){
  var list=ITEMS.filter(function(i){return (fc==="all"||i.cat===fc)&&(fu==="all"||i.urgency===fu)&&(!fs||i.source.indexOf(fs)!==-1)});
  document.getElementById('cards').innerHTML=list.length?list.map(cardHtml).join(''):'<div class="empty">No items</div>';
  if(expand)list.forEach(function(i){document.getElementById('c'+i.id).classList.add('open')});
  bars();
}
function setCat(c){fc=c;fs=null;render(false)}
function setUrg(u){fu=u;fs=null;render(false)}
function filterBySrc(name){fs=name;fc="all";fu="all";render(true)}
function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';
  var r='<p><b>Window:</b> '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</p>';

  r+='</p><p><b>Skipped:</b></p><ul>';
  META.skippedSources.forEach(function(s){r+='<li>'+esc(s)+'</li>'});
  r+='</ul><p>'+esc(META.note)+'</p>';
  var rb=document.getElementById('repb');rb.innerHTML=r;
  Array.prototype.forEach.call(rb.querySelectorAll('.sl'),function(el){el.onclick=function(){filterBySrc(el.getAttribute('data-src'))}});
  render(false);
}
