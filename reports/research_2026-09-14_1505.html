e halt removes a key escape valve for crude. The next 'clean' Fed hiking window after this week is arguably December, since Oct 28 lands right before midterms — implying a shallow cycle, not a full hiking staircase.", "angle": "The dollar-decline consensus trade got run over by an oil shock in a single session — a reminder that de-dollarization narratives are fragile against a hawkish-Fed-plus-energy-shock combo, and the midterm calendar caps how far this hiking cycle can realistically go.", "tweetA": "The dollar funeral got postponed by a pipeline attack. DXY +0.5% in a day. If your de-dollarization thesis can't survive one oil shock, it was a positioning trade, not a structural call.", "tweetB": "The Fed's realistic hiking window closes after this week until December — the Oct 28 meeting sits right before midterms. That's a market pricing 'shallow cycle' language while everyone's headline-reading 'hawkish Fed.'", "charts": {"count": 0, "hot": false, "desc": "No chart in email body; DXY chart likely on the article page."}, "link": "https://thedarksideoftheboom.substack.com/p/fx-daily-the-dollar-funeral-has-been"}, {"id": 9, "cat": "AI/infra", "urgency": "watch", "source": "Dark Side of the Boom (Goldman Sachs)", "title": "Two-thirds of every data center's value flows to Asian equipment makers — and the dividend is spreading beyond exports", "idea": "Goldman Sachs estimates ~2/3 of the value of a data center flows to Asian equipment producers. Tech exports will add 7 percentage points to Taiwan's 2026 GDP growth, and 2-3 points across Korea, Malaysia, Vietnam and Singapore. The dividend is starting to broaden into domestic factory investment, data-center construction, corporate taxes and even household wealth — not just exports.", "angle": "This is the quantified version of 'AI capex is really an Asian industrial policy trade' — Taiwan getting 7pp of GDP from tech exports alone means Taiwan's growth numbers are now a leveraged bet on US hyperscaler capex staying intact.", "tweetA": "Taiwan's 2026 GDP growth gets a 7 percentage point boost from AI-related tech exports alone, per Goldman. That's not a tailwind, that's the growth number. If hyperscaler capex ever cracks, Taiwan's GDP print cracks with it.", "tweetB": "Two-thirds of every dollar spent on a US data center ends up in a factory in Taiwan, Korea, or Malaysia. The AI trade was never really a US domestic story — it's an Asian industrial supply chain story wearing a Nasdaq ticker.", "charts": {"count": 0, "hot": false, "desc": "No embedded chart; Goldman's Asia Economics Analyst likely has the underlying GDP contribution chart."}, "link": "https://thedarksideoftheboom.substack.com/p/asias-ai-dividend-is-spreading-beyond"}, {"id": 10, "cat": "AI/infra", "urgency": "deep", "source": "Exponential View", "title": "A third of corporate AI earnings-call claims now come with a hard number attached", "idea": "Exponential View's proprietary tracking finds companies mentioning AI in earnings calls make an average of 6.8 separate claims, putting numbers on 5.1 of them — and roughly a third directly attribute financial impact to AI implementation. Separately, a study found senior patent lawyers using an AI assistant for three months performed 0.45 standard deviations better than non-using peers; junior lawyers gained the most short-term but showed no lasting average gain.", "angle": "The earnings-call data point is the closest thing to a real-time 'is AI actually showing up in P&Ls' tracker — a third of claims quantified is meaningfully higher bar than the 'AI-washing' era of 2023-24.", "tweetA": "A third of AI claims on earnings calls now come with an actual number attached, not just 'AI-powered.' That's the tell that AI-washing is ending and AI-accounting is beginning — good for calling out the laggards who still can't quantify it.", "tweetB": "Junior lawyers got the biggest short-term boost from AI assistants but showed NO lasting skill gain. Senior lawyers gained less initially cripted narrative ahead of Anthropic's IPO (expected within 7 weeks, targeting a record valuation), timed with Texas pausing data center approvals and a US Census Bureau survey showing only 22% of businesses report using AI at all.", "angle": "If the 22% AI-adoption number is right, it directly contradicts the 'AI is already transforming the economy' framing embedded in most AI-infra valuations — that gap between adoption reality and capex/IPO narrative is the single biggest mispricing risk in the sector right now.", "tweetA": "Only 22% of US businesses report using AI at all, per Census Bureau data. Meanwhile Anthropic is telling investors AI is existentially dangerous AND raising at a record valuation. Pick one story.", "tweetB": "Dario calls for 'pacing the frontier' one week before an IPO roadshow that needs the market to believe frontier AI is unstoppable and civilization-altering. That's not a coincidence, that's positioning.", "charts": {"count": 0, "hot": false, "desc": "No chart; text/opinion piece."}, "link": "https://www.ai-supremacy.com/p/p-doom-ai-supremacy-2026-frontier-slowdown-anthropic"}, {"id": 14, "cat": "culture", "urgency": "deep", "source": "Daily Feather (Danielle DiMartino Booth)", "title": "The $50 hand soap economy: airlines are retrofitting planes for premium seats because that's where the money is", "idea": "American Airlines is raising premium seating from 25% to 40% of its narrow-body fleet, and Southwest is entering the airport lounge business — both chasing high-income spend after CPI showed airline fares up nearly 25% YoY, a key driver of the core CPI upside surprise. Household net worth saw a record $12.8 trillion spike in Q2 2026 per the Fed's Flow of Funds.", "angle": "Airline fares are core CPI's smoking gun for K-shaped inflation — the Fed can't distinguish 'broad inflation' from 'upper-income consumers bidding up scarce premium capacity,' but a rate hike hits the bottom 80% far harder than the segment actually driving the print eview; likely has breadth chart in full note."}, "link": "https://www.earlymorningwithdave.com/p/ai-safety-concerns-set-in-and-the"}, {"id": 16, "cat": "geopolitics", "urgency": "deep", "source": "Dark Side of the Boom (Goldman Sachs survey)", "title": "Goldman's investor survey: markets want a US-China handshake, not a reset — and Chinese equities are already pricing calm", "idea": "Goldman's investor survey (Sept 2-12, ~80% offshore respondents) ahead of Xi's expected US visit finds low expectations for the summit itself but a notably constructive outlook on Chinese equities — trade policy offers the clearest path to a tangible announcement, while tech/national security remain harder constraints. The yuan carries little event premium.", "angle": "The market has already decoupled 'summit outcome' from 'China equity outlook' — meaning a disappointing Trump-Xi meeting might not actually be a Chinese-equity selling catalyst the way headlines will frame it, since removing escalation risk (not deliverables) is what's actually priced.", "tweetA": "Goldman's survey: investors don't expect a US-China 'reset' from Trump-Xi. They expect a handshake. And they're bullish China equities anyway. The market has already priced 'no deal' — so a bad summit headline may not be the selloff catalyst everyone assumes.", "tweetB": "80% of Goldman's survey respondents on the Trump-Xi summit were offshore investors — meaning the people most bullish on Chinese equities right now aren't in China. That's either smart money ahead of the curve, or a crowded trade waiting for a reason to unwind.", "charts": {"count": 0, "hot": false, "desc": "No chart in preview; Goldman survey likely has full breakdown chart in the linked note."}, "link": "https://thedarksideoftheboom.substack.com/p/a-handshake-not-a-reset-what-markets"}, {"id": 17, "cat": "macro", "urgency": "act now", "source": "Kurt Altrichter (RiskSignal)", "title": "Japan holds $1.12 trillion of US debt — more than the UK and China combined — and the BOJ meets a day after the Fed", "idea": "Japan spent roughly $98B defending the yen between late July and late August with little effect; Bessent is now publicly pressuring the BOJ to hike instead. A BOJ hike (priced as near-certain) makes the yen carry trade funding much of the US risk-on rally more expensive to hold, forcing potential unwinds — and Japan is America's largest foreign creditor, holding $1.12T in Treasuries. The Fed decides Wednesday, the BOJ Thursday — 24 hours apart.", "angle": "This is the single cleanest 'two things happening 24 hours apart that nobody's connecting' setup this week: a Fed hike plus a BOJ hike compounds into a double liquidity-drain on the trade that's been propping up US risk assets, and Japan literally holds the largest Treasury stack in the world if it needs dollars.", "tweetA": "Fed hikes Wednesday. BOJ hikes Thursday. Two of the world's largest central banks tighten within 24 hours of each other, directly threatening the yen carry trade that's funded a chunk of this US risk-on rally since 2022. August 2024's BOJ surprise sent the S&P down 3% in one session on far less setup than this.", "tweetB": "Japan holds $1.12 trillion of US Treasuries — more than the UK and China COMBINED. If a BOJ hike makes it cheaper for Japanese money to stay home instead of buying our debt, that's a second, completely separate source of upward pressure on the 10-year, landing the same week as an oil shock and a Fed hike.", "charts": {"count": 0, "hot": true, "desc": "No embedded chart, but the piece includes a detailed EPS/multiple scenario table (base/better/worse case S&P targets: 7,900 / 8,505 / 6,475). 🔥 CHART WORTH SAVING if recreated."}, "link": "https://www.kurtaltrichter.com/p/japan-holds-the-trapdoor-under-this"}, {"id": 18, "cat": "macro", "urgency": "deep", "source": "Peter Boockvar", "title": "A 25bp hike hands upper-income Treasury holders an extra $56 billion a year — the opposite of what you'd want if you're fighting demand-side inflation", "idea": "Boockvar estimates $1 trillion in annualized US federal interest expense, of which domestic holders own ~70% (~$700B), and each 25bp hike adds roughly $56B more into their pockets (on $32T of marketable securities, 70% domestically held). His GenAI capex bar: Street consensus is $800B this year, $1.2T next year. He also reiterates that a full inflation read needs both CPI (2%) and PPI (4%) — calling 2%/4% NOT price stability.", "angle": "This is a clean, quotable rebuttal to 'just hike, inflation is still above target' — a hike mechanically funnels more income to the exact upper-income cohort whose spending is driving the demand-side inflation Boockvar says the Fed is trying to cool.", "tweetA": "A 25bp Fed hike pays US Treasury holders an extra $56 billion a year in interest income. If upper-income spending is what's driving inflation, hiking rates literally hands that cohort more money to spend. The transmission mechanism runs backwards here.", "tweetB": "CPI at 2% while PPI sits at 4% is not 'price stability' — it's a lag. Boockvar's point: judging inflation on CPI alone while ignoring producer prices is how you declare victory over inflation the same month it's about to show back up at the register.", "charts": {"count": 0, "hot": false, "desc": "No chart in email; described a photo of a store sign, not a data chart."}, "link": "https://peterboockvar.substack.com/p/what-will-this-mean-for-capex-spendthe"}, {"id": 19, "cat": "crypto", "urgency": "act now", "source": "Lucky Trader (Morning Minute)", "title": "ETH ETFs pull in $216M while BTC ETFs bleed $13M — same day Clarity Act odds double", "idea": "Clarity Act cloture-vote odds jumped to 31% (more than doubling) after Trump agreed to ethics provisions restricting his and his family's crypto activity — the sticking point since July. Senate votes Tuesday 2:15pm ET; Republicans need 9 Democrats. Separately, ETH ETFs saw $216M of Friday inflows while BTC ETFs saw $13M of outflows — a sharp divergence.", "angle": "If Clarity passes, the piece notes that outcome scenario looks completely unpriced — ETH and revenue-generating protocols like Hyperliquid and Lighter would be the asymmetric winners, and the ETF flow divergence already hints institutional money is quietly rotating that way ahead of the vote.", "tweetA": "BTC ETFs: -$13M Friday. ETH ETFs: +$216M same day. That's not noise, that's institutional money already front-running a Clarity Act outcome that would disproportionately benefit ETH and revenue-generating protocols like Hyperliquid.", "tweetB": "Clarity Act odds just doubled to 31% because Trump agreed to restrict what HIS OWN FAMILY can do in crypto. Let that sink in — the ethics provision that unlocked the bill was aimed at the president who might sign it.", "charts": {"count": 0, "hot": false, "desc": "No charts embedded."}, "link": "https://luckytrader.substack.com/p/clarity-act-odds-soar-as-trump-agrees"}, {"id": 20, "cat": "crypto", "urgency": "watch", "source": "All Star Charts", "title": "BTC and ETH are both sitting directly under their October 2025 VWAP resistance", "idea": "All Star Charts flags BTC ($82K) and ETH ($2,500) both consolidating tightly for three weeks right beneath resistance formed by VWAPs anchored to the October 2025 peaks. A decisive daily close above those levels — not just an intraday poke — is the trigger the author is waiting for before adding aggressive crypto exposure.", "angle": "This gives a precise, falsifiable technical trigger (daily close, not wick) right into a week with a live macro catalyst (FOMC) — clean setup for anyone trading the breakout/breakdown either way.", "tweetA": "BTC $82K, ETH $2,500. Both have been coiling under these exact levels for three weeks. A Fed decision lands in the middle of this range this week — that's about as clean a binary setup as crypto gets right now.", "tweetB": "Everyone wants the crypto breakout to be a vibes story. It's actually a VWAP story — both BTC and ETH are pinned under levels anchored to their October 2025 peaks. Price memory is doing the work here, not sentiment.", "charts": {"count": 1, "hot": false, "desc": "1 chart (BTC/ETH VWAP resistance levels) — worth opening for the visual."}, "link": "https://www.allstarcharts.com/2026-08-25/bitcoin-may-be-right-schedule"}, {"id": 21, "cat": "regulation", "urgency": "act now", "source": "Unchained Crypto", "title": "Trump reported $1.4 billion in crypto income last year — the same week he agreed to ethics limits on it", "idea": "The final Clarity Act text absorbs 126 Democratic-requested changes; Trump agreed to ethics restrictions covering federally elected officials, judges, and spouses (but NOT their children) with state AGs enforcing. Trump reported over $1.4B in crypto income last year. Polymarket puts law-this-year odds at ~32%, up from ~22% pre-text.", "angle": "The carve-out excluding officials' children from the ethics restrictions is the detail every reporter will miss and every crypto-lawyer will notice — it's a structural loophole in the bill's headline achievement.", "tweetA": "Trump made $1.4 BILLION in crypto income last year and just agreed to 'ethics restrictions' on crypto dealings for elected officials. Officials' CHILDREN are explicitly exempted. Read the fine print, not the press release.", "tweetB": "Clarity Act odds went from 22% to 32% on a single ethics concession. That's a 10-point repricing on one carve-out — tells you how much this bill's fate hinges on optics, not the other 126 substantive changes Democrats got.", "charts": {"count": 0, "hot": false, "desc": "No charts; text article with embedded images of market data (not analytical charts)."}, "link": "https://unchainedcrypto.com/lummis-unveils-final-clarity-act-draft-before-tuesdays-cloture-vote-as-trump-accepts-ethics-limits/"}, {"id": 22, "cat": "positioning", "urgency": "act now", "source": "Unchained Crypto", "title": "Metaplanet erases $220M of executive warrant upside after shareholder revolt", "idea": "Metaplanet cut its Series 10 warrant pool 41% (319.5M to 188.2M shares) after weeks of shareholder pressure over dilution, extinguishing over $220M of warrant value and lifting BTC-per-fully-diluted-share ~8.8%. The CEO recused himself from the vote. Metaplanet stock is still down more than 43% this year.", "angle": "This is a real-time case study in what happens when a BTC-treasury company's equity structure gets too dilutive relative to its BTC-per-share thesis — shareholders forced a governance fix, but the stock is still down 43% YTD, meaning the market hasn't forgiven the overhang yet.", "tweetA": "Metaplanet just erased $220M of executive warrant upside after a shareholder revolt over dilution. The stock is still down 43% this year. If you're long a BTC-treasury proxy, dilution risk from management's own comp structure can hurt you more than a BTC drawdown.", "tweetB": "8.8% instant BTC-per-share accretion just from cutting executive warrants 41%. That's the clearest evidence yet that 'BTC treasury company' equity structures have been quietly diluting shareholders in ways the NAV-per-share headline number hides.", "charts": {"count": 0, "hot": false, "desc": "No charts."}, "link": "https://unchainedcrypto.com/metaplanet-cuts-series-10-warrant-pool-by-41-erasing-220-million-in-executive-upside/"}, {"id": 23, "cat": "macro", "urgency": "act now", "source": "Hi Mount Research", "title": "Corporate bond yields just hit their highest level in over 15 years", "idea": "Excluding a brief Oct/Nov 2023 window, corporate bond yields are at their highest level in 15+ years, breaking out after consolidating since summer 2022. Separately, last Thursday saw new 52-week lows outnumber new highs by the widest margin of the year — and the widest since the Liberation Day tariff selloff.", "angle": "Two independent breadth/yield deteriorations (this piece plus Rosenberg's note above) landing the same morning is the kind of convergent signal that's easy to dismiss individually but hard to ignore together — this is what 'the bull case balance has stopped holding' looks like in real data.", "tweetA": "Corporate bond yields just hit a 15-year high. New lows just outnumbered new highs by the widest margin since Liberation Day tariffs. Two separate cracks, same week, same direction. The 'delicate balance still favors bulls' call just expired.", "tweetB": "'For the first time in 40+ years, the path of least resistance for rates is higher, not lower' — that's not a Fed-week take, that's a regime-change take. Worth pricing what a structurally higher-rate decade does to every DCF built since 2010.", "charts": {"count": 0, "hot": false, "desc": "No chart in preview; likely has yield breakout chart and breadth chart on article page."}, "link": "https://himountresearch.substack.com/p/bull-market-behavior-being-tested"}, {"id": 24, "cat": "gold", "urgency": "watch", "source": "Taylor (Tavi) Costa", "title": "Mining stocks have never been cheaper relative to tech on a free-cash-flow-yield basis — despite AI needing every ounce of the metals they produce", "idea": "Tavi Costa's chart deck opens with the claim that miners have never been this cheap relative to tech on an FCF-yield basis, framed against the fact that there is no AI buildout without metals (copper, silver, rare earths, etc. for grids, chips, and data centers).", "angle": "This is the cleanest values-vs-growth pair trade thesis in the deck this week: if AI capex is real and durable, the physical inputs (miners) are mispriced relative to the software/compute layer capturing all the multiple expansion.", "tweetA": "Miners have never been cheaper vs. tech on free cash flow yield. There is no AI buildout without copper, silver, and rare earths. The market is paying a 2026 multiple for the picks-and-shovels business model while pricing the actual picks and shovels like a value trap.", "tweetB": "Everyone's debate is Mag 7 vs. equal-weight. The more mispriced pair might be miners vs. tech on FCF yield — the physical inputs to the AI buildout are trading like a dying industry while the buildout itself accelerates.", "charts": {"count": 1, "hot": true, "desc": "🔥 CHART WORTH SAVING — miners vs. tech FCF yield chart is the deck's lead visual and tells the whole story alone. 30 charts total in the full deck."}, "link": "https://tavicosta.substack.com/p/top-30-macro-charts"}, {"id": 25, "cat": "crypto", "urgency": "watch", "source": "Adler's Crypto Insights", "title": "A quant bottom-calling model is running its 112th weekly update on BULL/BEAR thresholds and open interest", "idea": "Adler's Weekly Engine (v112, rebuilt on a new model) tracks a BULL/BEAR price threshold, exchange/ETF flows, and open interest dynamics to estimate a market-bottom candidate date, distinguishing confirmed data from conditions still being monitored.", "angle": "A systematic, repeatable bottom-calling framework running its 112th iteration is useful less for this week's specific call and more as a barometer — worth tracking whether its 'confirmed' bucket is expanding or shrinking week over week.", "tweetA": "112 weeks running the same bottom-calling model on crypto. Not because it's always right, but because tracking whether its 'confirmed' data bucket grows or shrinks week to week is a decent proxy for how contested the bottom-call actually is right now.", "tweetB": "Open interest dynamics are the one crypto data series everyone name-drops and almost nobody actually reads a full breakdown of. This week's is worth 5 minutes if you're trying to time re-entry into BTC/ETH ahead of FOMC.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — the model likely has BULL/BEAR threshold and OI charts, not included in plaintext preview. Worth opening."}, "link": "https://adlerscryptoinsights.substack.com/p/weekly-engine-112"}, {"id": 26, "cat": "credit", "urgency": "act now", "source": "Phil Dauber (Market Musing)", "title": "The 2Y just hit a fresh 52-week high the same morning equities are down — and it's not a fiscal story", "idea": "Dauber's 2s10s steepener closed at +33bp Friday (exactly his target) and he's rolling the duration short forward another quarter. His decomposition: if this were a fiscal/term-premium story, the long end would lead and the curve would steepen — instead it flattened 6bp on Friday, with ALL of the move coming from the front end, the 4th time in 6 tests. Year-to-date the 2Y is up ~105bp vs. the 10Y's ~70bp, and the term-premium slice at 10 years is 'nearly nothing.'", "angle": "This directly contradicts the dominant 'debasement/fiscal dominance' narrative for why yields are rising — if Dauber's decomposition is right, the move is about the Fed being forced to hike into a supply shock, not about a bond vigilante fiscal revolt, which changes what actually reverses it (a Fed pivot, not a debt-ceiling deal).", "tweetA": "Everyone's blaming the deficit for rising yields. The curve says otherwise: it FLATTENED 6bp Friday, with 100% of the move from the front end, the 4th time in six sessions. That's a Fed-is-hiking story, not a fiscal-panic story. Different trade, different exit.", "tweetB": "ORCL beat and raised Friday, opened up, and closed within 44 cents of the session low — a 10% intraday reversal on its best quarter in years. The buyback plan disclosed Friday got canceled Saturday with zero shares sold. Something broke in that stock that has nothing to do with the actual print.", "charts": {"count": 0, "hot": false, "desc": "No charts; extremely data-dense text (rates levels, curve moves, position book)."}, "link": "https://phildauber.substack.com/p/undefeated"}, {"id": 27, "cat": "geopolitics", "urgency": "deep", "source": "Phil Dauber (Market Musing)", "title": "Trump's Middle East envoy made $107M in 2025 from a crypto venture backed by the UAE president's brother", "idea": "Steve Witkoff — Trump's special agent for the Middle East, currently negotiating with Russia — earned $107M in 2025 from his stake in World Liberty Financial, the Trump-family crypto venture in which Sheikh Tahnoon bin Zayed Al Nahyan (brother of the UAE president) has invested $500M. Trump himself reported $594M+ in 2025 income from the same venture.", "angle": "A Middle East peace negotiator personally profiting nine figures from a crypto venture funded by a Gulf royal family is the kind of conflict-of-interest detail that becomes very relevant the moment any Gulf-brokered deal (Hormuz, Gaza, or otherwise) starts moving markets.", "tweetA": "The US's Middle East envoy made $107M last year from a crypto venture bankrolled by the brother of the UAE's president. He's currently negotiating with Russia. Nobody's pricing this conflict of interest into any Middle East de-escalation trade.", "tweetB": "Trump: $594M. Witkoff: $107M. Same crypto venture. Same UAE royal family backer. If a Gulf-brokered deal ever unlocks the Hormuz oil premium, ask who personally profits from the venture that got funded by the same region first.", "charts": {"count": 0, "hot": false, "desc": "No charts."}, "link": "https://phildauber.substack.com/p/undefeated"}, {"id": 28, "cat": "energy", "urgency": "deep", "source": "Commodity Context", "title": "China cut crude imports by 5.4 million barrels/day — equal to two years of OPEC+ cuts, from one country, in months", "idea": "China's crude import cut (\"the Beijing Swing\") to counterbalance the Hormuz shutdown totaled 5.4 MMbpd, roughly equivalent to the entire OPEC+ 2023-24 collective cut — done unilaterally. Refining runs fell from 15.2 MMbpd (Jan-Feb) to ~12.5 MMbpd (June), the sharpest pullback in China's modern history, exceeding even 2022 COVID-zero lockdowns. Apparent diesel demand fell ~20% even though freight activity (70% of diesel end-use) stayed healthy — a gap the author says is best explained by unobserved strategic inventory drawdowns.", "angle": "If the Beijing Swing is inventory-drawdown-driven rather than genuine demand destruction, it is inherently time-bound — and the piece notes China's crude imports are already starting to recover, meaning the single biggest offset to the Hormuz shock may be expiring just as Fed/BOJ hikes add a second demand-side headwind to oil this week.", "tweetA": "China singlehandedly cut crude imports by 5.4 million barrels a day — roughly equal to two years' worth of OPEC+ cuts, done unilaterally in months. That's the real reason Brent isn't at $150 despite Hormuz being shut. And it's already starting to reverse.", "tweetB": "Diesel demand in China fell ~20% even though freight activity (70% of diesel use) kept humming. Nobody can fully explain the gap except 'they're quietly drawing down inventories.' If true, the Beijing Swing has an expiration date — and oil bulls should be watching Chinese import data more than Hormuz headlines.", "charts": {"count": 0, "hot": false, "desc": "No charts in free preview (paid report); charts likely extensive in the paid version. Worth opening."}, "link": "https://www.commoditycontext.com/p/the-beijing-swing-part-2-refined-products"}];

      '<a class="read-link" href="' + item.link + '" target="_blank">↗ Read full article</a>';

    card.appendChild(header);
    card.appendChild(body);
    container.appendChild(card);
  });
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function filterBySrc(name) {
  activeSrc = name;
  activeCat = 'all';
  activeUrg = 'all';
  document.querySelectorAll('.cat-pill').forEach(function(p) { p.classList.toggle('active', p.dataset.cat === 'all'); });
  document.querySelectorAll('.urg-pill').forEach(function(p) { p.classList.toggle('active', p.dataset.urg === 'all'); });
  renderCards();
  document.querySelectorAll('.card').forEach(function(c) { c.classList.add('open'); });
  window.scrollTo({top: 0, behavior: 'smooth'});
}

document.getElementById('cat-filters').addEventListener('click', function(e) {
  if (!e.target.classList.contains('cat-pill')) return;
  activeSrc = null;
  activeCat = e.target.dataset.cat;
  document.querySelectorAll('.cat-pill').forEach(function(p) { p.classList.toggle('active', p === e.target); });
  renderCards();
});

document.getElementById('urg-filters').addEventListener('click', function(e) {
  if (!e.target.classList.contains('urg-pill')) return;
  activeSrc = null;
  activeUrg = e.target.dataset.urg;
  document.querySelectorAll('.urg-pill').forEach(function(p) { p.classList.toggle('active', p === e.target); });
  renderCards();
});

function renderReport() {
  var html = '';
  html += '<p><strong>Time window:</strong> ' + META.windowStart + ' &ndash; ' + META.windowEnd + '</p>';
  html += '<p>' + META.emailsInWindow + ' emails in window, ' + META.emailsRead + ' read, ' + META.itemsExtracted + ' items extracted.</p>';
  html += '<p><strong>Included sources:</strong></p><ul>';
  META.includedSources.forEach(function(s) {
    html += '<li><button class="src-pill" onclick="filterBySrc(\'' + s.name.replace(/'/g, "\\'") + '\')">' + s.name + '</button> (' + s.count + ')</li>';
  });
  html += '</ul>';
  html += '<p><strong>Skipped sources:</strong></p><ul>';
  META.skippedSources.forEach(function(s) {
    html += '<li>' + s.name + ' &mdash; ' + s.reason + '</li>';
  });
  html += '</ul>';
  document.getElementById('report-body').innerHTML = html;
}

headerSub();
renderCards();
renderReport();
</script>
