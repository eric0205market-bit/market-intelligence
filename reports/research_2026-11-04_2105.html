function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function toggleCard(id){ var c=document.getElementById("card-"+id); if(c) c.classList.toggle("open"); }
function toggleReport(){ document.getElementById("report").classList.toggle("open"); }

function cardHtml(item){
  var col = CATCOL[item.cat] || "#888";
  var h = '<div class="card" id="card-' + item.id + '" data-cat="' + esc(item.cat) + '" data-urg="' + item.urgency + '" data-src="' + esc(item.source) + '">';
  h += '<div class="head" onclick="toggleCard(' + item.id + ')">';
  h += '<span class="num">' + (item.id < 10 ? "0" : "") + item.id + '</span><span>' + URG[item.urgency] + '</span>';
  h += '<span class="badge" style="background:' + col + '">' + esc(item.source.split(" / ")[0].split(" (")[0]) + '</span>';
  h += '<span class="tag">' + esc(item.cat) + '</span>';
  if (item.charts && item.charts.count > 0) h += '<span>' + (item.charts.hot ? "🔥" : "📊") + '</span>';
  h += '<span class="title">' + esc(item.title) + '</span></div>';
  h += '<div class="body">';
  h += '<div class="lbl">The Idea</div><div>' + esc(item.idea) + '</div>';
  h += '<div class="angle" style="border-left-color:' + col + ';background:' + col + '14"><b>MY ANGLE</b> &mdash; ' + esc(item.angle) + '</div>';
  h += '<div class="tweets">';
  h += '<div class="tw"><div class="lbl" style="color:#378add;margin-top:0">TWEET A</div><p>' + esc(item.tweetA) + '</p><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  h += '<div class="tw"><div class="lbl" style="color:#7f77dd;margin-top:0">TWEET B</div><p>' + esc(item.tweetB) + '</p><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
  h += '</div>';
  if (item.charts && item.charts.count > 0) {
    h += '<div class="chart' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '🔥 CHART WORTH SAVING &mdash; ' : '📊 ') + item.charts.count + ' chart(s): ' + esc(item.charts.desc) + '</div>';
  } else {
    h += '<div class="chart">No charts in email &mdash; charts inside article may be worth opening</div>';
  }
  h += '<div class="link" style="margin-top:8px"><a href="' + esc(item.link) + '" target="_blank" rel="noopener">&#8599; Read full article</a></div>';
  h += '</div></div>';
  return h;
}

function visible(item){
  if (state.src !== null) return item.source.indexOf(state.src) !== -1;
  if (state.cat !== "all" && item.cat !== state.cat) return false;
  if (state.urg !== "all" && item.urgency !== state.urg) return false;
  return true;
}

function applyFilters(expand){
  var shown = 0;
  ITEMS.forEach(function(item){
    var c = document.getElementById("card-" + item.id);
    var v = visible(item);
    c.style.display = v ? "" : "none";
    c.classList.remove("open");
    if (v) { shown++; if (expand) c.classList.add("open"); }
  });
  document.getElementById("nothing").style.display = shown ? "none" : "block";
  renderBars();
}

function setCat(c){ state.cat = c; state.src = null; applyFilters(false); }
function setUrg(u){ state.urg = u; state.src = null; applyFilters(false); }
function filterBySrc(name){ state.src = name; state.cat = "all"; state.urg = "all"; applyFilters(true); window.scrollTo(0,0); }

function renderBars(){
  var cats = {}; ITEMS.forEach(function(i){ cats[i.cat] = (cats[i.cat]||0)+1; });
  var h = '<span class="pill' + (state.cat==="all"?' active':'') + '" style="' + (state.cat==="all"?'background:#333':'') + '" onclick="setCat(\'all\')">All ' + ITEMS.length + '</span>';
  Object.keys(cats).sort().forEach(function(k){
    var on = state.cat === k;
    h += '<span class="pill' + (on?' active':'') + '" style="' + (on?'background:'+CATCOL[k]:'') + '" onclick="setCat(this.getAttribute(\'data-k\'))" data-k="' + esc(k) + '">' + esc(k) + ' ' + cats[k] + '</span>';
  });
  document.getElementById("catbar").innerHTML = h;
  var u = ["all","act","deep","watch"], uh = "";
  u.forEach(function(k){
    var n = k==="all" ? ITEMS.length : ITEMS.filter(function(i){return i.urgency===k;}).length;
    var on = state.urg === k;
    uh += '<span class="pill' + (on?' active':'') + '" style="' + (on?'background:#333':'') + '" onclick="setUrg(\'' + k + '\')">' + (k==="all"?"All":URGLBL[k]) + ' ' + n + '</span>';
  });
  document.getElementById("urgbar").innerHTML = uh;
}

function renderReport(){
  var h = '<div class="rh" onclick="toggleReport()">&#9656; Session Report</div><div class="rb">';
  h += '<p><b>Window:</b> ' + esc(META.windowStart) + ' to ' + esc(META.windowEnd) + '. Emails outside this window were not processed.</p>';
  h += '<p><b>Emails in window:</b> ' + META.emailsInWindow + ' &middot; <b>read:</b> ' + META.emailsRead + ' &middot; <b>items extracted:</b> ' + META.itemsExtracted + '</p>';
  h += '<p><b>Included sources</b> (click to filter):<br>';
  META.includedSources.forEach(function(s){
    h += '<span class="src" data-src="' + esc(s.name) + '" onclick="filterBySrc(this.getAttribute(\'data-src\'))">' + esc(s.name) + '</span> (' + s.items + ')<br>';
  });
  h += '</p><p><b>Skipped:</b><br>';
  META.skippedSources.forEach(function(s){ h += esc(s.name) + ' &mdash; ' + esc(s.reason) + '<br>'; });
  h += '</p></div>';
  document.getElementById("report").innerHTML = h;
}

function init(){
  document.getElementById("sub").textContent = META.date + " · " + META.time + " · " + ITEMS.length + " items";
  var h = "";
  ITEMS.forEach(function(item){ h += cardHtml(item); });
  h += '<div class="empty" id="nothing" style="display:none">No items match.</div>';
  document.getElementById("cards").innerHTML = h;
  renderBars();
  renderReport();
}
