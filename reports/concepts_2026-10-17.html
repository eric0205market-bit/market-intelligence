:root {

  --border: #dfe8e3;
  --border-light: #eef3f0;
  --text: #1a1a1a;

  --quote: #047857;
  --yellow: #fff5b3;

  /* insight-type colors */
  --t-thesis: #2563eb;
  --t-prediction: #7c3aed;
  --t-framework: #0891b2;
  --t-data_point: #d97706;
  --t-causal: #be185d;
  --t-contrarian: #dc2626;
  --t-anecdote: #6b7280;
  --t-default: #6b7280;

  /* conviction colors */
  --c-high: #15803d;
  --c-medium: #d97706;
  --c-low: #9ca3af;
  --c-exploratory: #8b5cf6;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;

.container { max-width: 980px; margin: 0 auto; padding: 24px 16px 80px; }

.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

             border: 1px solid var(--border); border-radius: 6px;
             font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
             color: var(--text-2); display: flex; gap: 16px; flex-wrap: wrap; }
.stats-top strong { color: var(--text); font-weight: 600; }

/* CONTROLS (display-only: sort + filter by source) */
.controls { display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
            margin-bottom: 16px; padding: 8px 12px; background: var(--surface);

            font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--text-2); }

.insight.contrarian { border-left-color: var(--t-contrarian); }

.insight-so .lbl { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px;

.quote .vmark.no { color: var(--text-3); }

.chip-ent { background: #eef2ff; color: #3730a3; border-color: #c7d2fe; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {

e from the deal; distillate cracks may stay elevated into 2027.", "quote": null, "locator": "Opening paragraph", "quote_verified": false}, {"claim": "The US administration is attempting to forge a trade bloc to counter Chinese industrial overcapacity, examined by Tom Miller, but the teaser gives no detail on its design or members.", "speaker": "Gavekal Research", "type": "data_point", "entities": ["United States", "China", "Tom Miller"], "conviction": "low", "so_what": "Watch for bloc formation as a new trade-policy vector against China.", "quote": null, "locator": "Opening paragraph", "quote_verified": false}, {"claim": "Washington's latest restrictions on the H-1B visa program, analysed by Udith Sikand, affect Indian tech workers employed in the US, though the paywalled text does not state the effects.", "speaker": "Gavekal Research", "type": "data_point", "entities": ["H-1B", "India", "Udith Sikand"], "conviction": "low", "so_what": "Possible pressure on Indian IT services and US tech labour supply; details paywalled.", "quote": null, "locator": "Opening paragraph", "quote_verified": false}]}], "insight_total": 3, "top_entities": ["Russia", "diesel", "China", "H-1B", "Gavekal Research", "United States"], "source_meta": {"author": "", "word_count": 144, "paywalled": false}}, {"record_id": "788ba553880d9ec8", "source_type": "concepts", "source_name": "ARK Invest Research", "source_url": "https://www.ark-invest.com/articles/analyst-research/bitcoins-post-quantum-solutions", "title": "Bitcoin’s Post-Quantum Solutions", "published_date": "2026-10-14", "language": "en", "processed_at": "2026-10-17T11:14:22Z", "processor": "claude-code-sub-opus", "tags": ["Crypto", "Tech"], "gist": "ARK argues Shor's algorithm threatens the ~35% of bitcoin supply with exposed public keys, that long-range attacks arrive before live-transaction attacks, and that the quantum transition is a governance and fee-market problem where early, slow migration is cheapest.", "themes": [{"theme": "Nature of the quantum threat", "insights": [{"claim": "March 2026 whitepapers from Google Quantum AI and Oratomic/Caltech compressed the resources needed to run Shor's algorithm against ECC-256, shifting the perceived quantum timeline from decades to possibly within a decade.", "speaker": "ARK Invest Research", "type": "data_point", "entities": ["Google Quantum AI", "Oratomic", "Caltech", "Bitcoin"], "conviction": "medium", "so_what": "Quantum risk is becoming a priced governance risk for BTC; watch resource-estimate updates.", "quote": null, "locator": "Introduction", "quote_verified": false}, {"claim": "Roughly 35% of bitcoin supply, about two-thirds of ether and 100% of solana are secured only by elliptic-curve signatures because their public keys are exposed.", "speaker": "ARK Invest Research", "type": "data_point", "entities": ["Bitcoin", "Ethereum", "Solana", "Project Eleven"], "conviction": "medium", "so_what": "Solana carries the greatest relative quantum exposure; BTC's exposure is concentrated in old and reused addresses.", "quote": null, "locator": "Introduction", "quote_verified": false}, {"claim": "Shor's algorithm breaks elliptic-curve signatures, whereas Grover's only halves SHA-256 security, a margin ARK believes bitcoin's design can absorb and one quantum attackers would struggle to exploit against ASIC miners.", "speaker": "ARK Invest Research", "type": "framework", "entities": ["Shor’s algorithm", "Grover’s algorithm", "SHA-256", "ASIC miners"], "conviction": "high", "so_what": "Mining security is not the quantum risk; signatures are.", "quote": "Shor's algorithm is the real long-term threat.", "locator": "What Quantum Can And Cannot Break", "quote_verified": true}, {"claim": "A long-range attack on public keys already on-chain, including about 1.1 million Satoshi-era coins, needs no speed advantage and runs on any fault-tolerant platform, including faster-scaling neutral atoms, so it is likely feasible before a short-range attack that must beat the roughly 10-minute block time.", "speaker": "ARK Invest Research", "type": "causal", "entities": ["Bitcoin", "P2PK", "neutral atoms", "Satoshi-era coins"], "conviction": "high", "so_what": "The first real threat is to dormant exposed coins, a supply-overhang scenario rather than a network collapse.", "quote": null, "locator": "Two Types Of Shor's Attack", "quote_verified": false}, {"claim": "A successful short-range attack that front-runs transactions from the mempool would make spending unsafe and, in ARK's view, could collapse the network.", "speaker": "ARK Invest Research", "type": "prediction", "entities": ["Bitcoin", "mempool"], "conviction": "medium", "so_what": "Tail risk for the asset; timeline depends on superconducting/photonic scaling.", "quote": null, "locator": "Two Types Of Shor's Attack", "quote_verified": false}]}, {"theme": "Protocol solutions menu", "insights": [{"claim": "BIP-360, merged into the BIP repository in February 2026, proposes Pay-to-Merkle-Root outputs that hide public keys at rest, but it neither selects a post-quantum signature scheme nor protects ordinary spends from short-exposure attacks, and is not adopted by Bitcoin Core.", "speaker": "ARK Invest Research", "type": "data_point", "entities": ["BIP-360", "P2MR", "Bitcoin Core"], "conviction": "high", "so_what": "Watch BIP-360 activation steps as the leading indicator of Bitcoin quantum readiness.", "quote": null, "locator": "The Bitcoin Improvement Proposal 360", "quote_verified": false}, {"claim": "Post-quantum signatures are far larger than today's: hash-based SLH-DSA is 8,000-50,000 bytes, lattice ML-DSA about 2.4-4.6 KB and Falcon-512 about 666 bytes (roughly 10x Schnorr), straining block space.", "speaker": "ARK Invest Research", "type": "data_point", "entities": ["SLH-DSA", "ML-DSA", "Falcon", "Schnorr", "NIST"], "conviction": "high", "so_what": "Larger signatures mean higher fees and lower throughput, a structural cost of migration.", "quote": null, "locator": "Hashes / Lattices", "quote_verified": false}, {"claim": "Blockstream's SHRINCS hash-based scheme advertised signatures as small as 324 bytes in December 2025, and a May 2026 opcode sketch modelled a 580-byte compact path.", "speaker": "ARK Invest Research", "type": "data_point", "entities": ["Blockstream Research", "SHRINCS"], "conviction": "low", "so_what": "Signature-size compression could make hash-based migration practical.", "quote": null, "locator": "Hashes", "quote_verified": false}, {"claim": "Isogeny-based signatures are unlikely to deploy near-term because SIDH/SIKE was broken in about an hour on a classical computer in 2022, though SQIsign reached NIST's third round in May 2026.", "speaker": "ARK Invest Research", "type": "data_point", "entities": ["SQIsign", "SIDH", "SIKE", "NIST"], "conviction": "medium", "so_what": "Isogeny cryptography is a high-risk, low-near-term-probability path for Bitcoin.", "quote": null, "locator": "Isogeny", "quote_verified": false}, {"claim": "Hybrid classical-plus-post-quantum schemes are mainstream on the internet, with Cloudflare reporting hybrid TLS traffic rising from under 3% in early 2024 to over 65% of human traffic by April 2026.", "speaker": "ARK Invest Research", "type": "data_point", "entities": ["Cloudflare", "Chrome", "ML-KEM", "X25519"], "conviction": "medium", "so_what": "Evidence that migration at scale is feasible in other systems.", "quote": null, "locator": "Hybrids", "quote_verified": false}, {"claim": "Commit-delay-reveal schemes such as Tadge Dryja's 2025 Lifeboat proposal allow safe migration by soft fork without revealing public keys, but involve long waits and do not protect the ~35% of supply with already-exposed keys.", "speaker": "ARK Invest Research", "type": "data_point", "entities": ["Tadge Dryja", "Lifeboat"], "conviction": "medium", "so_what": "A fallback if quantum arrives before holders migrate.", "quote": null, "locator": "Commit-Delay-Reveal Schemes", "quote_verified": false}]}, {"theme": "Lost coins trilemma", "insights": [{"claim": "About 1.6-1.8 million exposed BTC sit with exchanges and custodians, with Binance about 83-85% exposed and Robinhood 100%, while 8-12% of total supply is largely lost and would remain exposed to quantum theft indefinitely.", "speaker": "ARK Invest Research", "type": "data_point", "entities": ["Binance", "Robinhood", "Bitcoin"], "conviction": "medium", "so_what": "Custodian migration is the near-term lever; lost coins are a standing overhang risk.", "quote": null, "locator": "Lost-Coins Solutions", "quote_verified": false}, {"claim": "Doing nothing violates property rights, freezing lost coins violates immutability, and throttling is a compromise, forming a trilemma that ARK expects to become increasingly contentious in the Bitcoin community.", "speaker": "ARK Invest Research", "type": "framework", "entities": ["Bitcoin", "lost coins"], "conviction": "high", "so_what": "The freeze-versus-bounty governance fight is the key Bitcoin social-consensus risk.", "quote": null, "locator": "The Lost-Coins Trilemma", "quote_verified": false}, {"claim": "Alternatives for stranded coins include metering recovered coins into mining rewards as a second subsidy, Nic Carter's salvage-in-trust, zero-knowledge seed-phrase ownership proofs, and sanctioned white-hat recovery.", "speaker": "ARK Invest Research", "type": "framework", "entities": ["Nic Carter", "zero-knowledge proofs", "BIP-39"], "conviction": "low", "so_what": "None are mature proposals; watch for developer adoption.", "quote": null, "locator": "Alternative Solutions For Unretrievable Coins", "quote_verified": false}]}, {"theme": "Migration economics and action plan", "insights": [{"claim": "Migrating the ~35% of supply exposed to long-range attack would take roughly 141 days and about 20,000 blocks, so late migration becomes a fee-market stampede while early, gradual migration costs little per block.", "speaker": "ARK Invest Research", "type": "causal", "entities": ["Bitcoin", "WickedSmartBitcoin.com"], "conviction": "high", "so_what": "Expect fee spikes if migration is delayed until a credible attack; early commitment lowers cost.", "quote": "The earlier the network commits to a migration path, the lower the toll per block.", "locator": "Block Space Traffic Jam?", "quote_verified": true}, {"claim": "ARK recommends consensus sequencing of a safer output type like P2MR first, then signature scheme selection, block-space accounting review, and an activation plan for legacy coins, while custodians inventory exposure, stop address reuse and preserve ownership records now.", "speaker": "ARK Invest Research", "type": "thesis", "entities": ["P2MR", "custodians", "exchanges"], "conviction": "high", "so_what": "Track custodians' address hygiene and BIP-360 progress.", "quote": null, "locator": "What Requires Consensus", "quote_verified": false}, {"claim": "ARK suggests wallets default new addresses to quantum-safe types, exchanges batch customer migrations, and the protocol discount migration transactions in block-space accounting as SegWit did for witness data.", "speaker": "ARK Invest Research", "type": "framework", "entities": ["SegWit", "wallet providers", "exchanges"], "conviction": "medium", "so_what": "Fee-weight discounts would be a bullish signal for orderly migration.", "quote": null, "locator": "What We Can Do After Activation", "quote_verified": false}, {"claim": "ARK concludes Bitcoin's quantum transition is less a technology question than a governance one.", "speaker": "ARK Invest Research", "type": "thesis", "entities": ["Bitcoin", "ARK Invest"], "conviction": "high", "so_what": "Governance speed, not cryptography, is the variable to watch.", "quote": "Bitcoin's quantum transition is less a question of the technology than the network's governance.", "locator": "Conclusion", "quote_verified": true}]}], "insight_total": 18, "top_entities": ["Bitcoin", "Shor’s algorithm", "BIP-360", "P2MR", "Google Quantum AI", "NIST", "Binance", "Robinhood", b", "Bab al-Mandab"], "conviction": "medium", "so_what": "Red Sea shipping risk has a Somali land-based leg; relevant for freight and insurance.", "quote": null, "locator": "Domestic drivers", "quote_verified": false}]}, {"theme": "Risk of protraction", "insights": [{"claim": "Domestic elites are offering ports, corridors, economic partnerships and bases to foreign powers in exchange for backing, which fuels a feedback loop of external patronage and entrenched division.", "speaker": "Chatham House", "type": "causal", "entities": ["Somalia", "foreign powers"], "conviction": "medium", "so_what": "Expect basing and port concessions as bargaining chips.", "quote": null, "locator": "Domestic drivers", "quote_verified": false}, {"claim": "Political crises reduce security operations against al-Shabaab and ISIS-Somalia, letting them regroup, and the author calls for de-escalation via the African Union and IGAD with an interim governance agreement and a realistic election timetable.", "speaker": "Chatham House", "type": "prediction", "entities": ["al-Shabaab", "ISIS-Somalia", "African Union", "IGAD"], "conviction": "medium", "so_what": "Terror-group resurgence is the likely cost of prolonged infighting.", "quote": null, "locator": "The risks of deepening war", "quote_verified": false}]}], "insight_total": 8, "top_entities": ["Somalia", "Turkey", "UAE", "Hassan Sheikh Mohamud", "al-Shabaab", "Puntland", "Jubaland", "Bab al-Mandab", "Houthis"], "source_meta": {"author": "", "word_count": 1386, "paywalled": false}}, {"record_id": "dc9ed14da7f573e5", "source_type": "concepts", "source_name": "Anthropic Blog", "source_url": "https://www.anthropic.com/news/an-update-on-independent-evaluators", "title": "Anthropic update on independent evaluators", "published_date": "2026-10-15", "language": "en", "processed_at": "2026-10-17T11:13:55Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Society"], "gist": "Anthropic is embedding METR staff with employee-like access, with publication rights it cannot veto, and is building a three-tier evaluator access model with SecureBio, Accenture and Faculty, positioning this as bank-examiner-style oversight that every frontier lab should adopt.", "themes": [{"theme": "Embedded third-party evaluation", "insights": [{"claim": "Anthropic has onboarded six METR employees with company hardware, office space and internal-tool access roughly on par with its own risk-assessment teams, and METR will publish its analysis of Anthropic's risk levels and practices.", "speaker": "@AnthropicAI", "type": "data_point", "entities": ["Anthropic", "METR"], "conviction": "high", "so_what": "Frontier-lab safety oversight is moving from voluntary reports to embedded audit, a precursor to regulatory norms.", "quote": null, "locator": "What we mean by employee-like access", "quote_verified": false}, {"claim": "Anthropic cannot veto METR publications; it can only require redaction in narrow categories such as customer data, privileged information, and model architecture, and METR may publicly say whether it thinks redactions were justified.", "speaker": "@AnthropicAI", "type": "data_point", "entities": ["Anthropic", "METR"], "conviction": "high", "so_what": "Real publication independence makes evaluator findings a credible signal on lab risk posture.", "quote": null, "locator": "What we mean by employee-like access", "quote_verified": false}, {"claim": "Anthropic draws an analogy to bank supervision, where regulators place resident examiners inside the largest banks because firms know more about their own risk than outsiders do.", "speaker": "@AnthropicAI", "type": "framework", "entities": ["Anthropic", "bank supervision"], "conviction": "medium", "so_what": "Suggests the likely regulatory template for frontier AI is resident-examiner supervision of systemically important labs.", "quote": "Although the analogy isn’t exact, bank supervision operates on similar logic.", "locator": "Why we work with independent evaluators", "quote_v // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
