      b.style.borderColor = "#333";
    } else {
      b.style.background = "transparent";
      b.style.borderColor = "#ccc8bf";
      b.style.color = "var(--text-main)";
    }
  });
}

function buildCard(item){
  var card = el("div", "card");
  card.dataset.id = item.id;

  var header = el("div", "card-header");
  header.appendChild(el("span", "card-num", "#" + item.id));

  var uMeta = URGENCY_META[item.urgency];
  header.appendChild(el("span", "chart-flag", uMeta.emoji));

  var badge = el("span", "badge", item.source.split(" / ")[0].split(" (")[0]);
  badge.style.background = CAT_COLORS[item.cat] || "#888";
  header.appendChild(badge);

  header.appendChild(el("span", "tag", item.cat));

  if(item.charts && (item.charts.count > 0 || item.charts.hot)){
    header.appendChild(el("span", "chart-flag", item.charts.hot ? "🔥" : "📊"));
  }

  header.appendChild(el("span", "card-title", item.title));

  header.onclick = function(){
    card.classList.toggle("expanded");
  };
  card.appendChild(header);

  var body = el("div", "card-body");
  body.appendChild(el("div", "section-label", "The Idea"));
  body.appendChild(el("div", "idea-text", item.idea));

  body.appendChild(el("div", "section-label", "My Angle"));
  var angleBox = el("div", "angle-box", item.angle);
  angleBox.style.borderLeftColor = CAT_COLORS[item.cat] || "#999";
  angleBox.style.background = hexToRgba(CAT_COLORS[item.cat] || "#999", 0.06);
  body.appendChild(angleBox);

  var tweetsWrap = el("div", "tweets");

  var tA = el("div", "tweet-box");
  tA.appendChild(el("div", "tlabel-a", "TWEET A"));
  tA.appendChild(el("div", "tweet-text", item.tweetA));
  var btnA = el("button", "copy-btn", "📋 Copy");
  btnA.setAttribute("onclick", "copyTweet(" + item.id + ",'a')");
  tA.appendChild(btnA);
  tweetsWrap.appendChild(tA);

  var tB = el("div", "tweet-box");
  tB.appendChild(el("div", "tlabel-b", "TWEET B"));
  tB.appendChild(el("div", "tweet-text", item.tweetB));
  var btnB = el("button", "copy-btn", "📋 Copy");
  btnB.setAttribute("onclick", "copyTweet(" + item.id + ",'b')");
  tB.appendChild(btnB);
  tweetsWrap.appendChild(tB);

  body.appendChild(tweetsWrap);

  if(item.charts){
    var chartsBox = el("div", "charts-row" + (item.charts.hot ? " hot" : ""),
      (item.charts.count > 0 ? "<strong>" + item.charts.count + " chart(s).</strong> " : "") +
      item.charts.desc + (item.charts.hot ? " 🔥 CHART WORTH SAVING" : "")
    );
    body.appendChild(chartsBox);
  }

  var linkRow = el("div", "link-row", "<a href=\"" + item.link + "\" target=\"_blank\" rel=\"noopener\">↗ Read full article</a>");
  body.appendChild(linkRow);

  card.appendChild(body);
  return card;
}

function hexToRgba(hex, alpha){
  var h = hex.replace("#","");
  var r = parseInt(h.substring(0,2),16);
  var g = parseInt(h.substring(2,4),16);
  var b = parseInt(h.substring(4,6),16);
  return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
}

function render(){
  var wrap = document.getElementById("cardsWrap");
  wrap.innerHTML = "";
  var filtered = ITEMS.filter(function(i){
    if(activeCat !== "all" && i.cat !== activeCat) return false;
    if(activeUrg !== "all" && i.urgency !== activeUrg) return false;
    if(activeSrc && i.source.indexOf(activeSrc) === -1) return false;
    return true;
  });
  document.getElementById("emptyMsg").style.display = filtered.length ? "none" : "block";
  filtered.forEach(function(item){
    var card = buildCard(item);
    if(activeSrc) card.classList.add("expanded");
    wrap.appendChild(card);
  });
  updateFilterStyles();
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function filterBySrc(name){
  activeSrc = name;
  activeCat = "all";
  activeUrg = "all";
  render();
  var reportCard = document.getElementById("reportCard");
  reportCard.classList.add("expanded");
  document.getElementById("reportToggleIcon").textContent = "−";
}

function buildReport(){
  var body = document.getElementById("reportBody");
  var html = "";
  html += "<p><strong>Window:</strong> " + META.windowStart + " → " + META.windowEnd + ". Emails outside this window were not processed.</p>";
  html += "<p><strong>Emails in window:</strong> " + META.emailsInWindow + " &nbsp;|&nbsp; <strong>Emails read:</strong> " + META.emailsRead + " &nbsp;|&nbsp; <strong>Items extracted:</strong> " + META.itemsExtracted + "</p>";
  html += "<div class=\"section-label\">Included Sources</div><ul>";
  META.includedSources.forEach(function(s){
    html += "<li><span class=\"src-link\" onclick=\"filterBySrc('" + s.name.replace(/'/g,"\\'") + "')\">" + s.name + "</span> — " + s.count + " item(s)</li>";
  });
  html += "</ul>";
  if(META.skippedSources.length){
    html += "<div class=\"section-label\">Skipped Sources</div><ul>";
    META.skippedSources.forEach(function(s){
      html += "<li><strong>" + s.name + "</strong> — " + s.reason + "</li>";
    });
    html += "</ul>";
  }
  body.innerHTML = html;
}

document.getElementById("headerMeta").textContent =
  META.date + " · " + META.time + " · " + META.itemsExtracted + " items from " + META.emailsRead + " emails";

document.getElementById("reportHeaderToggle").onclick = function(){
  var rc = document.getElementById("reportCard");
  rc.classList.toggle("expanded");
  document.getElementById("reportToggleIcon").textContent = rc.classList.contains("expanded") ? "−" : "+";
};

buildFilters();
buildReport();
render();
</script>

</body>
</html>
