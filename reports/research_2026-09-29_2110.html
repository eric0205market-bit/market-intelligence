<script>
var ITEMS = [{"id": 1, "cat": "macro", "urgency": "act", "source": "Peter Boockvar / The Boock Report", "title": "Consumer confidence 81.9 vs 88.6, 7 pts below consensus; 1-yr inflation expectations 6.1%", "idea": "Conference Board September index fell to 81.9 from 88.6, seven points under expectations, a level last seen in 2014 (but then it was rising post-GFC). Present Situation -8, Expectations -6. One-year inflation expectations rose to 6.1% from 5.8%. Big-ticket spending intentions (vehicles, homes, appliances) fell.", "angle": "Sentiment collapsing while inflation expectations climb is the stagflation print. Sits on top of a 10y near 5.2% - consumer is being squeezed from both the rate and price side.", "tweetA": "Confidence at 2014 lows. Inflation expectations at 6.1% and rising. That combo is not a soft landing, it is the Fed's worst dataset: no room to ease, no demand to tighten into. $TLT $XLY", "tweetB": "If 1-yr inflation expectations are 6.1% and the 10y is 5.2%, real yield expectations are NEGATIVE on consumer math. Households are pricing a policy error the bond market is pricing as term premium. One of them is wrong.", "charts": {"count": 0, "hot": false, "desc": "No charts in preview - article likely has data tables"}, "link": "https://peterboockvar.substack.com/p/consumer-confidence-sourjob-openings"}, {"id": 2, "cat": "labor", "urgency": "deep", "source": "Peter Boockvar / The Boock Report", "title": "'Jobs plentiful' lowest since 2016 ex-Covid; 'jobs hard to get' rises 1.6 pts to highest since 2016", "idea": "Inside the confidence survey: share saying jobs are plentiful fell to the lowest since 2016 excluding Covid, hard-to-get rose 1.6 pts to the highest since 2016. Those expecting more jobs in 6 months fell to the lowest since April 2025. Income growth expectations weakened. Title also flags job openings slipping.", "angle": "Labor differential is the cleanest recession tell and the Fed is still stuck on inflation. Households are already behaving like the labor market has turned.", "tweetA": "The labor differential just went back to 2016 levels while the Fed still talks inflation. Households see the layoff cycle before the BLS does.", "tweetB": "Everyone is arguing about payrolls. Meanwhile the number of people saying jobs are plentiful is the lowest in a decade ex-Covid. Soft data leads hard data by 2-3 quarters. Watch claims.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://peterboockvar.substack.com/p/consumer-confidence-sourjob-openings"}, {"id": 3, "cat": "culture", "urgency": "watch", "source": "Peter Boockvar / The Boock Report", "title": "Spending intentions shift to 'cheap thrills and necessities'", "idea": "Conference Board: top planned services spend is restaurants/bars/takeout, streaming/internet/mobile, beauty, utilities, healthcare. Hotels for personal travel, movies, airfare, amusement parks all moderated. Household maintenance, financial services, museums/historic sites saw small increases.", "angle": "Consumer trade-down pattern: lipstick-effect categories held, experiential travel cracked. Read across to airlines, theme parks, cinema and streaming.", "tweetA": "Planned spend: streaming up, airfare and amusement parks down. Consumers are cutting the trip, keeping the subscription. Subscription-heavy names quietly win the downturn. $NFLX $DIS $DAL", "tweetB": "When museums and historic sites beat airfare in planned spending, you're watching a consumer rebuild the vacation locally. Regional travel and staycation plays over long-haul.", "charts": {"count": 0, "hot": false, "desc": "n/a"}, "link": "https://peterboockvar.substack.com/p/consumer-confidence-sourjob-openings"}, {"id": 4, "cat": "AI/infra", "urgency": "act", "source": "Exponential View", "title": "Anthropic S-1 leak: $8bn operating loss, $42bn net loss, $518bn compute commitments", "idea": "Reuters obtained Anthropic's S-1. 2025: $8bn operating loss, $42bn net loss (inflated by an accounting charge). Compute commitments $518bn over 7-10 years, about 80% (~$410bn) non-cancellable. At a decent margin that implies roughly $1T of sales over the period. Annualised revenue forecast to exceed $100bn by end-2026; IPO rumoured for November; EV expects profit in 2026.", "angle": "Fixed-cost leverage of this size is the ultimate operating-leverage bet - and a direct read on $NVDA $GOOGL $AMZN backlog quality. Non-cancellable compute is effectively off-balance-sheet debt.", "tweetA": "$410bn of non-cancellable compute is $41-59bn a year of fixed cost. Against a >$100bn run rate. That is not a startup P&L, that is a utility with a growth option. Price it like one and the IPO looks very different.", "tweetB": "Anthropic's S-1 is the first time the market can see the other side of the AI capex trade: what the buyers of $NVDA capacity have to earn to break even. About $1T of revenue over the contract life. Now go check every other lab's number.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening (linked AI Investment Brief)"}, "link": "https://www.exponentialview.co/p/the-first-existential-ipo"}, {"id": 5, "cat": "AI/infra", "urgency": "deep", "source": "This Week in AI", "title": "Sonnet 5.5: same price ($2/$10), ~30% fewer tokens per task, #2 on Artificial Analysis at 56", "idea": "Anthropic released Sonnet 5.5: unchanged price per token ($2 in / $10 out) but ~30% faster output and roughly 30% lower cost per comparable task through lower token usage - at default effort. Artificial Analysis Intelligence Index: 56, #2 overall, two points behind Opus 5.5. Raising the effort setting spends the savings.", "angle": "Price-performance deflation is coming from token efficiency, not price cuts - hyperscaler capacity per query needs less. Useful counterweight to compute-demand extrapolations.", "tweetA": "Nobody cut the price. Sonnet 5.5 just needs 30% fewer tokens for the same job. That is deflation you can't see in the rate card - and it hits compute demand per task, not per token.", "tweetB": "56 vs 58 on the intelligence index at Sonnet pricing. The frontier gap is now two points. Ask what the premium tier is actually selling.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.thisweekinai.ai/p/getting-opus-results-at-sonnet-prices"}, {"id": 6, "cat": "tech", "urgency": "deep", "source": "The Pragmatic Engineer / Gergely Orosz", "title": "Shopify drops React Native a year after declaring victory - Shop app rebuilt native in 12 weeks", "idea": "Shopify's Head of Mobile: 'coding models have gotten dramatically better' so building in Swift and Kotlin no longer carries the old cost. Shop app shipped fully native in 12 weeks; all apps will migrate. Shared cross-platform test suite validates business logic in both languages; Farhan Thawar: 'React, as the shared language, is now replaced by the English language.' RN New Architecture gave only ~10% Android / 3% iOS startup gain.", "angle": "Abstraction layers built to save human engineering time are becoming liabilities when the marginal cost of code goes to zero. Applies to frameworks, low-code, outsourced dev shops.", "tweetA": "A year ago Shopify wrote a victory lap for React Native. Now they rewrote Shop in 12 weeks native. When code is cheap, the abstraction built to save code is pure overhead. Who else is standing on that logic? $SHOP", "tweetB": "The moat in cross-platform frameworks was that humans hate writing everything twice. Agents don't. Watch every dev tool whose pitch is 'write once'.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://newsletter.pragmaticengineer.com/p/shopify-native-mobile"}, {"id": 7, "cat": "labor", "urgency": "watch", "source": "The Pragmatic Engineer / Gergely Orosz", "title": "One engineer now ships iOS + Android; separate platform teams disappear", "idea": "Shopify's mobile head expects LLMs to make it routine for one developer to contribute outside their main expertise - one team, one developer building a feature on both platforms. Agents also port features between Android and iOS and compare implementations for gaps.", "angle": "Specialist-role compression: the platform-specialist premium erodes first. Verification layers (shared test suites) become the scarce skill.", "tweetA": "The iOS engineer vs Android engineer split is ending. Not because one wins, because the agent covers the gap. The scarce skill is now writing the test suite both must pass.", "tweetB": "Labor-market read: platform specialisation was an artifact of the cost of learning a second stack. Cost went to near zero. Job posts by title lag this by a year.", "charts": {"count": 0, "hot": false, "desc": "n/a"}, "link": "https://newsletter.pragmaticengineer.com/p/shopify-native-mobile"}, {"id": 8, "cat": "venture", "urgency": "deep", "source": "a16z", "title": "Who gets paid when AI does the shopping: Amazon's $69bn ad revenue vs $34bn operating income ex-AWS", "idea": "Amazon 2025 advertising revenue $69bn vs $34bn operating income ex-AWS; at ~70% contribution margin, ads contributed more than reported operating income. Alphabet + Meta had nearly $500bn of ad revenue. AI assistants don't need warehouses to squeeze Amazon - they only need to become where you decide what to buy. Amazon banned Muse; Shopify and Instacart welcomed it.", "angle": "Agentic commerce attacks the profit pool, not the logistics. Discovery/ad take-rate is the exposed line item. Sponsored listings need eyeballs.", "tweetA": "Amazon's ad business (~$48bn contribution at 70%) is bigger than everything else ex-AWS earned. Every agent that skips the sponsored listing is aimed at the profit pool, not the parcel. $AMZN", "tweetB": "Shopify leaned in, Amazon blocked, Instacart integrated. Difference is one line: who has an ad business to protect. Rank your e-commerce holdings by ad share of operating income.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.a16z.news/p/who-gets-paid-when-ai-does-the-shopping"}, {"id": 9, "cat": "tech", "urgency": "watch", "source": "a16z", "title": "Headless commerce: Toast for payment + DoorDash Drive for delivery bypasses the marketplace", "idea": "In a16z's dinner example an assistant picks the restaurant, orders via Toast (payments) and DoorDash Drive (delivery). DoorDash still delivers but never shows a sponsored listing. Instacart AI-assistant orders include more items and higher basket value than typical. Domino's held out from aggregators for years before agents put DoorDash on the other side of the negotiation.", "angle": "Unbundling of aggregators into their fulfillment layer - commissions and ads compress even if order volume holds.", "tweetA": "DoorDash can keep delivering the food and still lose the business. The assistant buys the delivery, skips the marketplace and its ad load. $DASH becomes logistics.", "tweetB": "Instacart says assistant orders have bigger baskets. If that holds, agents are a demand gain for the retailer and a take-rate loss for the platform. Which one is in your book?", "charts": {"count": 0, "hot": false, "desc": "n/a"}, "link": "https://www.a16z.news/p/who-gets-paid-when-ai-does-the-shopping"}, {"id": 10, "cat": "venture", "urgency": "watch", "source": "Unshackled Ventures", "title": "Destro AI closes $8.37M seed: an 'OS' orchestrating humanoids, AMRs and forklifts", "idea": "Bonfire and Base10 led. Thesis: warehouse robotics' bottleneck was never hardware but the missing intelligence layer; workers still walk ~15 miles a day. Robot-agnostic orchestration, deployed at Yusen Logistics for real-time task assignment across staff and robots. Built in 4 months; two enterprise pilots two months after the first check.", "angle": "Software-layer-over-heterogeneous-robots pattern; watch fleet-management moats vs OEM vertical stacks.", "tweetA": "The robotics money went to arms and sensors for a decade. The seed round is going to the layer that tells them what to do next. Warehouse OS is the picks-and-shovels of automation.", "tweetB": "8.37M for a company already inside Yusen's transload. Cheap entry into a market where hardware is commoditising. Watch which OEMs acquire orchestration.", "charts": {"count": 0, "hot": false, "desc": "n/a"}, "link": "https://unshackledvc.substack.com/p/he-built-robots-out-of-scrap-metal"}, {"id": 11, "cat": "crypto", "urgency": "act", "source": "Sammy's Snippets / 0xSammy", "title": "Robinhood Chain: ~$46 of app fees for every $1 of chain fees; HOOD Summit starts in hours", "idea": "DeFiLlama: $108k daily chain fees vs $4.9M application fees. 126M transactions Sep 15-28 (~9M/day), transactions >$0.50 gasless. Stock-token volume passed $10bn in 80 days. Weekly DEX volume $9bn (-13%), perps ~$5bn (+25%). Robinhood August: 28.6M funded customers, $384bn platform assets, $335bn equity volume. HOOD Summit Sep 29-30.", "angle": "'Fat apps, thin chain' - value accrues to distribution and apps, not blockspace. Catalysts to watch at the Summit: dividends, voting, indexes, leverage on stock tokens.", "tweetA": "$46 to apps for every $1 to the chain. The L1 fee thesis is dead before the retail chain gets going - distribution is the moat. $HOOD $ETH", "tweetB": "Robinhood has 28.6M funded customers and $384bn on platform. Tokenized stocks with voting and DRIP is not a crypto product, it is a brokerage product with a chain in the back. Summit tonight.", "charts": {"count": 1, "hot": false, "desc": "Several charts inside (DeFiLlama, Robinscan) - worth opening"}, "link": "https://www.0xsammy.com/p/hood-summit-why-i-keep-coming-back"}, {"id": 12, "cat": "crypto", "urgency": "deep", "source": "Sammy's Snippets / 0xSammy", "title": "Stock tokens spread: Ondo on NEAR Intents, STONKEX on Base, Binance reflection tokens; dividends via onchain multiplier", "idea": "Ondo brought an initial 20 assets to near.com/NEAR Intents on Sep 22; STONKEX on Base lets creators launch stock-paired tokens with fees returned to holders in stocks; Binance enabling reflection tokens for stock-paired projects. Robinhood already handles dividends via an onchain multiplier and has discussed one-for-one redemption and voting for eligible holders. AMC CEO publicly clashed with Robinhood's Vlad after tokenized buying moved the AMC price.", "angle": "Tokenized-equity distribution is being commoditised across chains; shareholder rights and issuer conflict are the next frontier.", "tweetA": "The first issuer-vs-tokenizer fight already happened: AMC's CEO vs Robinhood after token demand moved the stock. Wait until voting rights ship.", "tweetB": "Tokenized stocks that pay dividends and can vote are no longer synthetics. They are the same asset in a different wrapper. That is a custody and clearing story.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.0xsammy.com/p/hood-summit-why-i-keep-coming-back"}, {"id": 13, "cat": "science", "urgency": "watch", "source": "Sammy's Snippets / 0xSammy", "title": "Axis Robotics: real-robot task success 22% -> 52% by feeding real attempts back into training; $5-10 compute per task", "idea": "Axis reports success rising from 22% to 52% after adding successful real-world attempts to simulation data - the deployed robot helps produce the data that trains its successor. Specialist tasks reach near-100% in tested settings at $5-10 compute per task, then are chained into longer workflows. Team-reported; compute cost only.", "angle": "Data flywheel from deployed robots; cost per skill is falling to consumer-software levels.", "tweetA": "22% to 52% by training on the robot's own successful attempts. That is the flywheel that made LLMs work, now in atoms. $5-10 of compute per task.", "tweetB": "Compute cost of a reliable skill is single digit dollars. The bottleneck is no longer cost of teaching; it is the number of deployed robots generating data.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.0xsammy.com/p/hood-summit-why-i-keep-coming-back"}, {"id": 14, "cat": "positioning", "urgency": "deep", "source": "Kurt Altrichter / RiskSignal Report", "title": "Equal-weight S&P down 6% since mid-August while the index sits on 7,600; 10y at ~5.2%, highest since 2007", "idea": "S&P closed at 7,683.69. RSP peaked mid-August, is down 6%, and the RSP/SPX ratio broke its trendline. Utilities -8% in three weeks, industrials broke a 5-month uptrend, staples followed. XLU yields 2.99%, XLP 2.67%, 3-month bill 4.24%, 10y ~5.2%. Only 40% of NYSE stocks above the 200-day. Refiners up 60%+ since June. His call: sell utilities/industrials/staples, own mega caps, tech, refiners; watch 7,600.", "angle": "Bond proxies repricing against T-bills: dividend yield below the risk-free rate is the mechanical driver. Also flags refiner crack-spread gap risk.", "tweetA": "T-bills pay 4.24%. XLU yields 2.99%. Bond proxies aren't defensive when cash out-yields them - they're a duration trade. Same setup as 2022. $XLU $XLP", "tweetB": "Equal weight down 6% since August, cap weight at highs. The index is a mega-cap fund with 495 hangers-on. The refiner trade (+60%) is the piece I'd size smaller - crack spreads gap on a weekend headline. $VLO $MPC", "charts": {"count": 1, "hot": true, "desc": "Big RSP vs S&P 500 chart with RSP/SPX ratio panel and breadth panels - CHART WORTH SAVING"}, "link": "https://www.kurtaltrichter.com/p/dividend-stocks-are-getting-killed"}, {"id": 15, "cat": "macro", "urgency": "deep", "source": "James Bulltard", "title": "XLF -10% this month, 59% of names 20%+ below 52-week highs, 'rates move is an all-timer'", "idea": "SPY breaking below the 21 EMA; still above 50-day, key level the 100-day at 753.50. Rates move 'is an all timer' and pressures Trump on Iran - 'we may even be forced to take a bad deal to get this over with.' XLF down almost 10% this month. Don Durrett chart: 59% of stocks are 20%+ off 52-week highs even with the index near highs; even Intel is 20% off. 'Pretty much in a bear market outside a handful of AI names.'", "angle": "Link between rates, Iran negotiation leverage and financials stress. Financials -10% in a month is a credit-market tell.", "tweetA": "59% of stocks are 20%+ below highs and the index is near highs. That's not a rally, that's a five-stock index with a bear market attached.", "tweetB": "XLF -10% in a month is the line to watch. When rates rise this fast, something breaks first at banks holding duration. And apparently it feeds into Iran negotiating posture.", "charts": {"count": 1, "hot": true, "desc": "Don Durrett chart: % of stocks 20%+ off 52-week highs - CHART WORTH SAVING"}, "link": "https://www.jamesbulltard.com/p/92926-recap"}, {"id": 16, "cat": "positioning", "urgency": "deep", "source": "Bespoke Investment Group", "title": "September: average stock, bonds AND gold each down more than 2.5%", "idea": "As September ends, the average stock, bonds and gold all fell more than 2.5% in the month; percentage of S&P 500 stocks above 50- and 200-day averages has plunged. Bespoke teases the five best performing S&P 500 names this month.", "angle": "Everything-sold month: no diversifier worked. Correlation of equity, duration and gold to the rate shock.", "tweetA": "Stocks, bonds and gold all down 2.5%+ in one month. When the hedge basket falls together, the common factor is the discount rate. $GLD $TLT $SPY", "tweetB": "The 60/40 and the gold-as-hedge both failed in September. Dispersion is where the money was: winners exist, but breadth says fewer of them.", "charts": {"count": 1, "hot": false, "desc": "Breadth chart inside (% of S&P above 50/200 DMA) - worth opening"}, "link": "https://bespokeinvest.substack.com/p/waking-up-as-september-ends"}, {"id": 17, "cat": "positioning", "urgency": "deep", "source": "The Dark Side of the Boom", "title": "Goldman PB: gross rising, net pinned near the floor; S&P liquidity cut roughly in half", "idea": "Goldman's prime brokerage view: hedge funds adding exposure without conviction. Selling is heaviest in Health Care and Biotech; Tech still draws selective demand. CTAs spent a month cutting risk and are shifting toward buyers. Corporate buybacks are in blackout until October earnings. Panic is low, sentiment bearish, S&P liquidity roughly halved.", "angle": "Thin liquidity plus a returning bid (CTAs, buybacks) is a squeeze setup; the risk is the air pocket if rates keep rising.", "tweetA": "Gross up, net at the floor: funds are more invested and less convinced. Add half the S&P liquidity and a buyback blackout. Fragile in both directions. $SPY", "tweetB": "Buyback blackout ends with October earnings and CTAs flip to buyers. If rates stabilise, the squeeze is violent. If they don't, liquidity half what it was is the problem.", "charts": {"count": 1, "hot": false, "desc": "Goldman PB charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/goldman-pb-more-exposure-less-conviction"}, {"id": 18, "cat": "AI/infra", "urgency": "deep", "source": "The Dark Side of the Boom", "title": "Korea priced for a memory peak: foreign ownership of KOSPI semis 49.1%, -2.1 SD; 4.7x multiple with forecasts still rising", "idea": "Goldman charts: foreign ownership of KOSPI semiconductors 49.1%, ~2.1 SD below its historical average, while ownership outside Samsung and SK hynix is near normal - the retreat is concentrated in memory. Earnings forecasts keep rising. A 4.7x multiple may be a warning or fuel. HBM may tighten conventional DRAM supply by absorbing wafer capacity through 2027.", "angle": "Classic cycle-peak multiple debate; positioning is already underweight, which is asymmetric if earnings hold.", "tweetA": "4.7x earnings with estimates still rising and foreign ownership 2 SD below normal. The market is pricing the last memory cycle. HBM eating wafer capacity says this one is different. $005930.KS $MU", "tweetB": "Memory looks cheapest right before it gets expensive. The real risk is being underweight when the peak doesn't arrive on schedule.", "charts": {"count": 2, "hot": true, "desc": "Two Goldman charts (foreign ownership KOSPI semis) - CHART WORTH SAVING"}, "link": "https://thedarksideoftheboom.substack.com/p/korea-is-priced-for-a-memory-peak"}, {"id": 19, "cat": "commodities", "urgency": "deep", "source": "Robert Sinn (Substack)", "title": "Friedland: humanity needs to mine as much copper in 18 years as in the last 10,000; one AI data center = 50,000t", "idea": "700Mt of copper mined in history, another 700Mt needed in the next 18 years. Just to maintain 3% GDP growth uses 30Mt/yr, ~4Mt recycled. One large AI data center can use 50,000t - over half the annual output of Hudbay's Copper World. BMO lifted its long-term copper forecast to ~$18,000/t by 2030 (~$8.18/lb) and sees up to 2.5Mt in AI by 2030 (~8% of refined). Chinese inventories at a 20-month low; imports into the US ahead of refined-copper tariffs drain availability elsewhere.", "angle": "Physical bottleneck for AI capex; demand destruction has to balance it. Regional squeeze from tariff stockpiling.", "tweetA": "50,000 tonnes of copper per data center. Copper World would supply half of that in a year - and it doesn't produce until 2030. The AI capex curve has a copper constraint. $FCX $COPX", "tweetB": "$18,000/t by 2030 from BMO is the most bullish Street target. Friedland's line: 'war has already broken out' over supply. Physical copper is a tariff trade and an AI trade at the same time.", "charts": {"count": 2, "hot": false, "desc": "Price-forecast list and critical-minerals diagram - worth opening"}, "link": "https://robertsinn.substack.com/p/robert-friedland-the-ai-supply-chain"}, {"id": 20, "cat": "macro", "urgency": "deep", "source": "Campbell Ramble", "title": "Consilience: AI acceleration + death of globalism + reindustrialisation are one trade; borrowed fixed-rate 125bps below spot to buy land", "idea": "Rebuilding the portfolio from scratch around three themes he argues are the same transformation seen through power: compute/chips/minerals become existential. Buying compute, machines, land and minerals. He took a fixed-rate mortgage 125bps below spot to buy land - 'sometimes the best way to sell bonds is to borrow a lot of money' - while noting the Fed is tightening and 'the capital cycle is immortal'.", "angle": "Real-asset barbell financed with fixed-rate debt; explicit long-inflation, short-duration trade. Confirms the copper/minerals thread.", "tweetA": "Borrowing at a fixed rate 125bps under spot to own land is a short-bond trade with a physical asset attached. 10y at 5.2% and I don't have to look for the trade.", "tweetB": "Compute, chips, minerals, land. All the scarce inputs to machines are physical and national. The portfolio question becomes a supply chain question.", "charts": {"count": 0, "hot": false, "desc": "n/a"}, "link": "https://www.campbellramble.ai/p/consilience-of-curves"}, {"id": 21, "cat": "geopolitics", "urgency": "watch", "source": "Campbell Ramble", "title": "'If an F-35 canopy can take a vacation in Hong Kong, what happens to your tungsten and gallium?'", "idea": "Argument that the post-Cold War Washington Consensus is dead (Eastern Europe, the Gulf, Pacific risk) and the West is only now realising that shipping its industrial and raw-material base to its main competitor for cheaper goods is unwise in an era of machine-decided warfare. Reindustrialisation must go down to extraction and refining of minor minerals.", "angle": "Minor-metals export control risk (tungsten, gallium) in defense supply chains.", "tweetA": "Defense primes can build the airframe. They can't refine the tungsten. The Chinese chokepoint on minor metals is the real F-35 backlog. $LMT", "tweetB": "Reindustrialisation is a refining story, not a fab story. Ex-China gallium and tungsten capacity is where I'd look for mispriced strategic assets.", "charts": {"count": 0, "hot": false, "desc": "n/a"}, "link": "https://www.campbellramble.ai/p/consilience-of-curves"}, {"id": 22, "cat": "regulation", "urgency": "deep", "source": "AI Street / Matt Robinson", "title": "RL trading agents colluded without messaging: +66% profit ($1.48M vs $890k), +81% volatility", "idea": "Wharton/HKUST simulation: two RL traders with an information edge, three groups of rule-based investors. Each AI earned $1.48M per cycle vs $890k in the independent benchmark (+66%) by buying above fundamental value, letting trend followers chase, then selling into the demand; also learned the reverse. First-round volatility +81%. Each pair needed roughly 10-200 billion iterations. BoE's Bailey: agentic trading is 'more talk than actuality' but such systems 'learn to cheat and lie'.", "angle": "Collusion without communication is invisible to current market-abuse frameworks; liability for emergent strategies is unresolved.", "tweetA": "Two agents, no messages, learn to inflate a bubble and sell into trend followers. No intent to prosecute. The regulator's problem is not detection, it's that nobody wrote the manipulation. $SPY", "tweetB": "10 to 200 billion training iterations. That's a weekend of GPU time. The gap between research simulations and live markets is measured in compute, not years.", "charts": {"count": 0, "hot": false, "desc": "n/a"}, "link": "https://www.ai-street.co/p/how-agents-learn-to-manipulate-markets"}, {"id": 23, "cat": "venture", "urgency": "deep", "source": "ARK Invest", "title": "Kalshi notional volume up 15x YoY ($19bn to $294bn through August); share from <10% to >80%", "idea": "ARK is adding Kalshi exposure to ARKK, ARKW, ARKF and the ARK Venture Fund. Through August notional volume rose from $19bn to $294bn, market share from under 10% two years ago to over 80%. ARK sizes the medium-term prediction-market opportunity at $1-5 trillion of annual volume. (Marketing email from a holder.)", "angle": "Prediction markets as a derivatives layer for event risk; concentration at one venue; ARK is the holder promoting it.", "tweetA": "$294bn notional in eight months at one exchange with 80% share. Winner-take-most, in a market that didn't exist as a regulated product two years ago. Also: the holder is the one marketing it. $ARKK", "tweetB": "If the $1-5T ARK number is even half right, the real story is who supplies the hedge counterparties. Event contracts are the next volatility surface.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://research.ark-invest.com/e3t/Ctc/I1+113/c3nSf04/VXdPm44cJRjcW29PQg64LTdggW6R-97G5VxbssN4zFKM63prCCW7Y8-PT6lZ3lgW3kcz2_8sSN8_W50p4HK36ZlPYW7lMddC7V-vQ9W4WVmF13rPdRbW7DJLD38XJ7k_W2ZgMrt9c_22CN1Sh-w_6S8b5W2d0rGn3rDMY7W47kLPd2SwQlXW3tqsYq6Kl91xN104ffK-zvZhN7svKSZLL4hjN67KRQsY5g1cW5cwpyr96vc8CW4RzMwv2Nsh0bN8vsrjlK2FDnW9bbLX_6n0fjWW4K9kKl1J46hxW9fZpPs5PYyz-W7gwjpm4Y5043W4BZyhJ2-J15-W7Ly9lw4D33FCN92WF1mvrKKcW7S3bn34909yxW9cBfVL647lTqW7TvvJk4Dd0VHdlQ6jC04"}, {"id": 24, "cat": "macro", "urgency": "watch", "source": "Danny Dayan / Quant Corner", "title": "USDCAD model called fair value 1.42 vs 1.39 spot - spot converged, profits taken", "idea": "Last edition's model flagged the dollar as cheap, with USDCAD fair value at 1.42 vs 1.39 spot as CAD shorts were being cleaned up. Spot has since converged to the model and he took profits. New edition scans for the best current dislocations (body not in preview).", "angle": "Systematic FX dislocation model has a live hit; worth tracking the next flagged pair.", "tweetA": "Model said USDCAD 1.42 vs 1.39 spot. Spot converged, position closed. Models that call convergence are useful; models that call the next one are worth paying for.", "tweetB": "Dollar cheap on the model while the 10y sits at 5.2% and Fed is tightening. Rate differentials do the convergence work.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://dannydayan.substack.com/p/quant-corner-b6a"}, {"id": 25, "cat": "tech", "urgency": "watch", "source": "McKinsey & Company", "title": "The $2.3 trillion horizon: how AI is rewriting the semiconductor story", "idea": "McKinsey's semiconductor practice (Bill Wiseman, Marc de Jong) argues AI is fuelling unprecedented semiconductor growth while upending long-standing industry dynamics and shifting the sources of value. Headline figure: $2.3 trillion. Also linked: 'Silicon squeeze: AI's impact on the semiconductor industry' and 'Next big shifts in AI workloads and hyperscaler strategies'. Email body is a teaser only.", "angle": "Consultant TAM anchor for semis; useful as a number to argue against.", "tweetA": "McKinsey says $2.3T. The interesting question isn't the number, it's where value migrates - memory, packaging, power - and who in the stack actually keeps margin.", "tweetB": "TAM headlines from consultants tend to arrive late in the cycle. Watch for the next 'silicon squeeze' in packaging and HBM.", "charts": {"count": 0, "hot": false, "desc": "Charts inside article - worth opening"}, "link": "https://email.mckinsey.com/industries/semiconductors/our-insights/the-2-point-3-trillion-dollar-horizon-how-ai-is-rewriting-the-semiconductor-story"}, {"id": 26, "cat": "science", "urgency": "watch", "source": "Binary Breakaway", "title": "Torpedo bats: swing speed adds 1.2 mph of exit velocity per mph vs 0.2 for pitch speed", "idea": "Washington State University study (April 2026): shifting wood to the sweet spot gives identical power potential, but better plate coverage for late swingers; lowered moment of inertia raises swing speed. Every +1 mph swing speed = +1.2 mph exit velocity; every +1 mph pitch speed = +0.2 mph - swing speed is 6x more important. Yankees hit 15 homers in three early games in 2025 with the bats. Wood COR ~0.50; ball loses ~50% of energy in compression.", "angle": "Cultural/technical: a small geometry change in a 150-year-old standard rewrote hitting; a market-efficiency parable.", "tweetA": "One shape change in a bat that hasn't changed since 1859 and you get 15 HR in three games. Swing speed is worth 6x pitch speed. Which of your 'settled' assumptions is a torpedo bat waiting to happen?", "tweetB": "The rule change that mattered was 1859's 2.5-inch cap. Everything since has been optimisation inside it. Regulatory constraints define where innovation lands.", "charts": {"count": 0, "hot": false, "desc": "Diagrams inside - worth opening"}, "link": "https://binarybreakaway.substack.com/p/torpedo-bats-and-the-technology-behind"}];

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });

  ta.value = text;

  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function shown(i){return (fc==='all'||i.cat===fc)&&(fu==='all'||i.urgency===fu)&&(!fs||i.source.indexOf(fs)>-1)}
function bars(){

}
