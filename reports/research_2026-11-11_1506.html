<script>
const ITEMS = [{"id": 1, "cat": "geopolitics", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom (Iran endgame)", "title": "Washington holds the hammer, Tehran holds the clock: 8 months of war, no political settlement", "idea": "Eight months in, US superiority has destroyed targets but not changed the regime's governing apparatus. Innes's asymmetry: Iran doesn't need to win, only to keep enough capability to make a decisive US victory too expensive. Trump has paused new strikes after Qatar talks but kept the naval blockade, and the nuclear-material question remains open.", "angle": "Frames the oil trade as a contest over who can wait longer. With midterms done and fuel prices politically toxic, the clock currently favours Tehran.", "tweetA": "Eight months of bombing and the regime is still at the table. In a war of attrition against a democracy with a fuel-price problem, simply surviving is the leverage. The market is pricing a deal; Tehran is pricing US impatience.", "tweetB": "Military superiority ≠ bargaining power. The US can flatten sites; Iran only has to make every follow-up strike look like it needs another one. That's a stalemate premium, not a peace dividend. $USO $XLE", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/irans-machiavellian-endgame-washington"}, {"id": 2, "cat": "geopolitics", "urgency": "watch", "source": "Stephen Innes / Dark Side of the Boom (Iran endgame)", "title": "IRGC unveils an underground 'missile city' with relocated missile and drone manufacturing", "idea": "The IRGC claims missile and drone production has moved deep underground and can run under sustained bombardment. Innes reads it as aimed at US planners' cost-benefit math rather than as a proven capability: if production can regenerate, every strike campaign implies another one. Scale and survivability are unverified.", "angle": "If the regeneration claim is credible, 'one more strike round ends it' no longer holds, and the tail of a longer war gets fatter even as headline risk fades.", "tweetA": "An underground factory that works is a military problem. One that only convinces you it works is a negotiating asset. Either way, the 'one last strike round' option just got more expensive.", "tweetB": "Deterrence has moved from inventory to production rate. If Iran can rebuild missiles faster than the US can justify politically destroying them, the blockade is the only real lever left, and that is what keeps crude off its lows.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/irans-machiavellian-endgame-washington"}, {"id": 3, "cat": "geopolitics", "urgency": "red", "source": "Stephen Innes / Dark Side of the Boom (Iran endgame)", "title": "Bessent reportedly moved onto a military base after threats attributed to Iran: financial warfare gets personal", "idea": "Per NYT reporting, Treasury Secretary Bessent left his Foggy Bottom residence for a military base after threats attributed to Iran. Iran denies plotting. Innes's point is that the architect of the sanctions campaign is being treated as a combatant, which erases the line between financial and conventional warfare. The risk is that intimidation triggers retaliation rather than leverage.", "angle": "A tail risk the oil market isn't pricing: an attack on a US economic official would reverse the de-escalation narrative overnight. Desalination and Gulf infrastructure remain exposed if fighting resumes.", "tweetA": "The Treasury Secretary living on a military base tells you how Tehran sees sanctions: as a weapon, and the person running them as a target. Crude is trading as if this is winding down. Those two facts don't fit together.", "tweetB": "Underpriced tail: the market is pricing Qatar mediation. One credible plot against a US cabinet official and the 'peace dividend' in crude unwinds in a session. Cheap upside calls on $BNO look like reasonable insurance here.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/irans-machiavellian-endgame-washington"}, {"id": 4, "cat": "culture", "urgency": "deep", "source": "PA - Global Macro / Paper Alfa", "title": "'The courage to do nothing': most macro work happens when nothing is happening", "idea": "Paper Alfa argues the hard part of macro isn't forecasting, it's separating what matters from what's already priced, and keeping risk management from turning emotional. You can read the macro backdrop perfectly and still lose money, or make money for the wrong reasons, and neither result proves much. The conclusion: staying in the game matters more than defending any single idea.", "angle": "Relevant this week: CPI shock, NVDA -31%, and the Anthropic IPO are all pulling traders toward hyperactivity. The real edge may be sitting on your hands.", "tweetA": "This week: a CPI shock, a $1.7T Nvidia drawdown and the largest IPO ever lined up. Every desk is under pressure to 'do something'. The best trade this week might be the one you don't place.", "tweetB": "Being right on macro and making money on macro are only loosely correlated. The gap between them is position sizing and ego. Most blowups come from defending a thesis, not from having the wrong one.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.paperalfa.com/p/the-courage-to-do-nothing"}, {"id": 5, "cat": "geopolitics", "urgency": "deep", "source": "Noah Smith / Noahpinion", "title": "Bearish China, bullish India: India only has to reach upper-middle income, not beat the US", "idea": "Noah sets the two countries different bars. China is judged on whether it can overtake the US and its allies; India only has to escape poverty, and on GDP and HDI it sits where China was in the late 2000s. India has cut extreme poverty while also reducing inequality, which China didn't manage. India grows ~6.5% (Bloomberg sees 8% by 2030), but China was still at that rate in 2014 when it was 40% richer than India is today.", "angle": "Long-duration EM allocation: the India trade is a 10-year catch-up story, not a race against the US. $INDA vs $FXI is a bet on that asymmetry.", "tweetA": "At 6.5% growth India doubles living standards roughly every 11 years. China hit that growth rate in 2014, when it was 40% richer than India is now. India is earlier on the curve than most allocators think. $INDA", "tweetB": "The China debate is whether it can beat the US. The India debate is whether it can become Thailand. The second one is much easier to win, and much easier to underweight because it's boring.", "charts": {"count": 8, "hot": true, "desc": "Extreme poverty in India collapsing over two decades alongside falling inequality; India vs China growth since the pandemic; government investment up 4x"}, "link": "https://www.noahpinion.blog/p/india-is-quietly-doing-great"}, {"id": 6, "cat": "energy", "urgency": "deep", "source": "Noah Smith / Noahpinion", "title": "India's state capex boom: government investment 4x pre-pandemic, highways 5x, rail 8x", "idea": "Government investment has quadrupled since before the pandemic even as debt ratios fell. Highway spending is up 5x in a decade and central rail spending 8x, and India is building its own bullet trains. The Economist adds: deficit cut from 9.2% to ~4.4% of GDP (0.9% ex-interest), rates down 125bp, a labour-code overhaul (29 codes merged into 4), and nuclear power opened to private players.", "angle": "Read-through for cement, steel, rail equipment and grid. Opening nuclear to the private sector is a long-dated option on reactor suppliers.", "tweetA": "India: rail capex up 8x, highways 5x, and nuclear just opened to private capital, all while cutting the deficit from 9.2% to 4.4% of GDP. That's China's 2010s infrastructure playbook without China's debt problem.", "tweetB": "Noah himself is skeptical of the reform story: long-term borrowing rates haven't fallen much, and private capex isn't leading. If the state is doing the heavy lifting, the test is whether private investment follows by 2028.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.noahpinion.blog/p/india-is-quietly-doing-great"}, {"id": 7, "cat": "tech", "urgency": "watch", "source": "Noah Smith / Noahpinion", "title": "India's electronics exports +90% y/y; engineering exports are diversified, not a one-product story", "idea": "August manufacturing output was +9% y/y on cars and electronics, and electronics exports were +90% y/y, much of it US-bound iPhones. Engineering exports are spread out: autos 21.9%, industrial machinery 18%, iron and steel 16.9%, electrical machinery 12.5%. That's very different from Bangladesh's garment-only model, and it's happening while China actively withholds tech and factory know-how.", "angle": "Supply-chain diversion is visible in the data. Indian EMS names and Apple's India assembly base are the beneficiaries. Watch whether FDI turns up in 2027.", "tweetA": "India's electronics exports +90% y/y in August. China has been actively trying to block India's industrialization by withholding equipment and know-how, and it's growing anyway. The US never faced that kind of headwind when it helped build China.", "tweetB": "Bangladesh industrialized on garments. India's engineering exports are 22% autos, 18% machinery, 17% steel, 12.5% electrical. Breadth like that is what lasts after the tariff arbitrage closes.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.noahpinion.blog/p/india-is-quietly-doing-great"}, {"id": 8, "cat": "venture", "urgency": "deep", "source": "The Founders Corner", "title": "1 in 4 VC-backed two-founder teams lose a co-founder within four years, which is exactly the vesting period", "idea": "Carta data (Peter Walker, 13,133 founders, 2015–2024): about 24% of two-founder companies lost a co-founder within 4 years, and nearly 1 in 4 late-2021 founders were gone within 3. The data excludes companies that shut down, so it undercounts. Departures cluster in years 1–3, after launch and before anything works.", "angle": "Founder churn is a quiet signal of venture-ecosystem stress. The 2021 vintage's 3-year attrition hints at how many zombie cap tables VCs are carrying.", "tweetA": "A quarter of VC-backed co-founder teams split within four years, and that's only counting companies that survived. The real number is higher. Your startup's biggest risk may be your co-founder, not your competitor.", "tweetB": "Departures cluster in years 1–3, after launch and before traction. That's also when nobody has the energy to renegotiate the cap table. The 2021 vintage is going to carry a lot of dead equity into its Series B.", "charts": {"count": 2, "hot": false, "desc": "Carta chart of co-founder departures clustering in years one to three"}, "link": "https://www.the-founders-corner.com/p/one-signature-could-save-you-45-of"}, {"id": 9, "cat": "venture", "urgency": "deep", "source": "The Founders Corner", "title": "The cliff math: leave at month 11 and keep 0%, leave at month 13 and keep 18.1%", "idea": "In a 10M-share company split 4.5m/4.5m with a 1m pool and a 4-year vest with a 1-year cliff, a founder who leaves at month 13 keeps 1.22m shares, or 18.1% after cancellation. At month 11 they keep nothing. With no vesting at all, they keep 45%. After a seed and a Series A, that departed founder still owns 11.6% ($5.8m at a $50m post). Snap settled Reggie Brown's handshake claim for $157.5m.", "angle": "Dead equity is a real drag on financeability. Walker argues for 6-year vesting, Jolis for 8, because IPOs take 12–14 years and a 4-year vest ends barely past Series A.", "tweetA": "Two months of tenure separate 0% and 18.1% of the company. The vesting cliff is the most violent single-day ownership change on a cap table, and most founders sign it on a Tuesday without thinking.", "tweetB": "Four-year vesting was designed for a world where companies IPO'd in 5–7 years. Today it's 12–14. A founder who walks at year 3 can still own double digits at IPO. Eight-year vesting sounds extreme until you do that math.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.the-founders-corner.com/p/one-signature-could-save-you-45-of"}, {"id": 10, "cat": "venture", "urgency": "watch", "source": "The Founders Corner", "title": "Equal 50/50 founder splits rose from 31.5% to 45.9% of teams, but equal splits correlate with lower valuations", "idea": "Carta: equal splits among two-founder teams rose from 31.5% (2015) to 45.9% (2024). Hellmann and Wasserman (1,476 founders, 511 ventures) found equal splits linked to lower first-round valuations, especially when agreed quickly. The UK's BVCA model documents no longer treat resignation as 'bad leaving'.", "angle": "A cultural shift toward egalitarian founding, with a measurable valuation cost. Worth tracking as AI-native micro-teams change how founders split equity.", "tweetA": "Half of founding teams now split 50/50, up from under a third a decade ago. The research says quick equal splits go with lower first-round valuations. Founders are optimizing for harmony and VCs are pricing in the risk of a break.", "tweetB": "AI is shrinking founding teams to two people and some agents. That makes the co-founder agreement the most important document in the company, and the one founders spend the least time on.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.the-founders-corner.com/p/one-signature-could-save-you-45-of"}, {"id": 11, "cat": "macro", "urgency": "red", "source": "Stephen Innes / Dark Side of the Boom (FX Daily)", "title": "Waller's 50bp warning + third straight core CPI beat = 2y +20bp, 2s10s 7bp bear-flattening", "idea": "Core CPI +0.3% m/m was the third consecutive upside surprise. The 2y jumped ~20bp and 2s10s bear-flattened ~7bp, the classic restrictive-Fed setup that lifts the dollar and hits procyclical FX (NOK, SEK, AUD underperformed, CHF and JPY also weak). Innes still prefers an every-other-meeting hiking framework and warns against reading Waller's 50bp as a new regime.", "angle": "Dollar long into DXY 102.85–103.00 resistance is the near-term trade, but a 20bp 2y move in one session leaves the hawkish story vulnerable to any PPI miss on Friday.", "tweetA": "The 2y moved 20bp on a 0.1 core beat. That's not repricing data, that's repricing the reaction function. The question for Friday's PPI isn't whether it's hot. It's whether it's hot enough to justify what already happened.", "tweetB": "Bear-flattening is the cleanest FX signal there is: the Fed leaning on demand while paying you more to hold dollars. NOK and SEK took it first. If Waller gets his 50, AUD is next in line. $UUP", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/fx-daily-rate-grenades-all-over-the"}, {"id": 12, "cat": "macro", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom (FX Daily)", "title": "EUR/USD at the 1.1110 50% retracement, and December seasonality is up against relative rates", "idea": "1.1110 is the 50% retracement of the March 25–January 26 rally, a natural spot for shorts to take profit. Innes is trading the 1.1140–1.1200 range and would sell a break of 1.1100. The ECB is expected to hike to 2.75% on December 17, but Europe's fragility (including a national strike in Spain) makes a long ECB cycle less credible than the Fed's.", "angle": "December normally favours the euro on seasonality, but when the Fed is out-hawking the ECB, seasonality loses. The 1.10–1.15 range is likely to break lower.", "tweetA": "Every December someone posts the 'euro seasonality' chart. This year the Fed is the more hawkish central bank and the ECB is the more fragile one. Seasonality is a tiebreaker, not a thesis.", "tweetB": "Two central banks hiking at the same time isn't symmetric. The ECB at 2.75% is near the limit of what Spain and Italy can take; the Fed is debating 50bp. Relative pain thresholds decide EUR/USD, not relative rates.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/fx-daily-rate-grenades-all-over-the"}, {"id": 13, "cat": "credit", "urgency": "watch", "source": "Stephen Innes / Dark Side of the Boom (Goldman funding)", "title": "Goldman: reserves are nearing the steep part of the demand curve just as bill supply and a 2027 debt ceiling hit", "idea": "Goldman's Isabella Rosenberg sees 2026's unusually calm funding conditions heading for a turn. Reserves are approaching the steep part of their demand curve while the Treasury prepares another large round of bill issuance. The Fed may restart bill purchases, but the 2027 debt-ceiling cycle (TGA drawdown, then rebuild) is the kind of reserve drain that has broken repo before. Goldman isn't calling a crisis; its point is that the system has gotten used to a thin cushion.", "angle": "Same setup as September 2019. Watch SOFR–IORB spreads and SRF usage. Leveraged basis trades are the obvious casualty.", "tweetA": "Funding markets are calmest right before they discover reserves aren't ample anymore. Bill issuance going up, a debt-ceiling cycle in 2027, and a Fed that thinks it can fix it with bill purchases. We've seen this movie, in September 2019.", "tweetB": "Everyone is watching the Fed hike. The more dangerous plumbing story is reserves sliding toward scarcity while the Treasury floods the bill market. Rate hikes plus a reserve drain is how you get a repo spike in a year nobody expects one.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening (reserve demand curve)"}, "link": "https://thedarksideoftheboom.substack.com/p/the-next-liquidity-squeeze-is-hiding"}, {"id": 14, "cat": "energy", "urgency": "deep", "source": "Doomberg", "title": "Fervo: $2B+ IPO in May, ~70% below issue by last week, +25% on Q3 earnings", "idea": "Enhanced-geothermal player Fervo, now bringing its first grid-scale plant online in Beaver County, Utah, and targeting >1GW by 2030, went public in May raising over $2B despite a sold-out book and VC backing. A Morpheus Research short report hit in October, the stock closed ~70% below its IPO price last week, then jumped 25%+ on Q3 results. Doomberg asks whether it's the next big thing in clean firm power or an overhyped promotion.", "angle": "Geothermal is the clean firm-power trade that data centres want. If Fervo's execution fails publicly, it could set back financing for the whole category. Binary outcome for the sector.", "tweetA": "Fervo had a sold-out order book and blue-chip VCs, and went public anyway. Five months later it's down ~70% with a short report attached. Firm clean power is the hottest ask in AI infrastructure, and the flagship geothermal name is being priced like a fraud risk.", "tweetB": "Hyperscalers are signing for 24/7 clean power at almost any price. If enhanced geothermal can't execute with that tailwind, the market moves to gas plus CCS and SMRs. Fervo's next two quarters are a referendum on a whole energy category.", "charts": {"count": 1, "hot": false, "desc": "Fervo's IPO round-trip"}, "link": "https://newsletter.doomberg.com/p/cat-scratch-fervo"}, {"id": 15, "cat": "venture", "urgency": "deep", "source": "Doomberg", "title": "IPO quality keeps falling: the share of unprofitable tech IPOs is rising, even with abundant private capital", "idea": "Doomberg cites a University of Florida study of tech IPOs: the share of companies that are profitable at IPO keeps falling. That's even more damning given how much private capital is available, which removes the main reason to go public. So why take on the regulatory, compliance and spotlight risk? Bankers are incentivized to feed the market's appetite for risk.", "angle": "Context for the Anthropic, OpenAI and SpaceX issuance wave: public markets are increasingly where private investors exit, not where companies raise growth capital.", "tweetA": "If private capital is unlimited, the companies choosing to IPO are self-selecting: either they need retail liquidity or insiders want out. 'Why go public now?' is the first due-diligence question on every 2026 listing.", "tweetB": "The UF data shows IPO profitability in long-term decline. Now line up 2026: SpaceX, Anthropic, OpenAI next, all raising tens of billions. When the biggest IPOs in history arrive at the low point of IPO quality, the buyer is the product.", "charts": {"count": 1, "hot": true, "desc": "University of Florida chart: share of unprofitable tech IPOs over time"}, "link": "https://newsletter.doomberg.com/p/cat-scratch-fervo"}, {"id": 16, "cat": "positioning", "urgency": "deep", "source": "Robert Marsh / Big Moves", "title": "Multi-strat gross leverage high + low correlations + record return crowding = a fragile tape", "idea": "Ex-institutional strategist Robert Marsh, citing PivotalPath: gross leverage at ten large multi-strategy managers is elevated and return crowding is at its highs. Positioning follows profits, so crowded returns imply crowded risk without looking at holdings. Low single-stock correlations make books look diversified, which justifies more leverage, until a selloff pushes correlations up and everyone de-grosses into the same names.", "angle": "This is the mechanism behind NVDA -31%. Watch dispersion: a sharp jump in implied correlation is the signal that pod de-grossing has started.", "tweetA": "Low correlation is what lets the pods run high gross. High gross is what makes correlation spike when it breaks. The diversification is real until the moment you need it. Nvidia -31% in five weeks is what the first leg of that looks like.", "tweetB": "Hidden signal: you don't need 13Fs to see crowding. Look at return correlation across multi-strats. It's at a record. Positioning follows P&L, and right now everyone's P&L looks the same.", "charts": {"count": 2, "hot": true, "desc": "PivotalPath: gross leverage of 10 large multi-strat managers; hedge-fund return crowding at highs"}, "link": "https://bigmoves.substack.com/p/big-moves-november-10-2026"}, {"id": 17, "cat": "equities", "urgency": "red", "source": "Robert Marsh / Big Moves", "title": "Take-Two +8.3% on 'unprecedented' GTA VI preorders ahead of Nov 19 launch; Hims -16.6% on its weight-loss reset", "idea": "TTWO rose 8.31% to $224.64 on record GTA VI preorders ahead of the November 19 launch and a reaffirmed bookings outlook. HIMS fell 16.61% to $19.13 after a quarterly loss, margin compression, a sequential subscriber decline and a guidance cut. TREX fell 7.3% after DA Davidson flagged second-half inventory loading. NVDA fell 5.47% to $168.89 on the Huang probe.", "angle": "November 19 is both GTA VI's launch and ANT's first trading day. Retail wallets and attention get tested twice in one day.", "tweetA": "Nov 19: GTA VI launches and Anthropic starts trading. The biggest entertainment launch ever and the biggest IPO ever, on the same day, both competing for the same retail wallet. $TTWO", "tweetB": "Hims -17% on a subscriber decline is the GLP-1 compounding trade running into pricing reality. Telehealth weight loss was a regulatory-arbitrage business, and the arbitrage is closing. $HIMS", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://bigmoves.substack.com/p/big-moves-november-10-2026"}, {"id": 18, "cat": "ai/infra", "urgency": "deep", "source": "ChinaTalk", "title": "US data vendors are selling ~$0.5B of RL environments and data to Chinese labs; ChinaTalk names nine firms", "idea": "Mercor, Surge AI, Turing, AfterQuery, Abundant, Pareto, DeccanAI, Eaglepoint and Invisible all sell to Chinese labs (Alibaba, Tencent, ByteDance, Moonshot, Z.ai). AfterQuery reportedly gets half of its $100M ARR from China; Mercor got 2% of Q2 revenue. Only Scale, micro1 and fleet publicly forgo China business. Chinese labs buy the same environments as Anthropic and OpenAI, so they know they're getting proven data.", "angle": "Export controls cover chips but not post-training data. This is a policy gap BIS can close with an 'is-informed' letter, which is a regulatory risk for Mercor, Surge and Turing valuations.", "tweetA": "We spent three years building an export-control wall around Nvidia chips. Meanwhile ~$500M of American RL training data walked out the side door to Alibaba, Tencent and ByteDance. Post-training is where model gains come from now, and it's mostly unregulated.", "tweetB": "AfterQuery: half of a $100M ARR from Chinese labs. When an American AI vendor's biggest customer concentration is Beijing, it's an export-control issue in waiting. Expect BIS letters before expecting a Mercor IPO.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.chinatalk.media/p/the-us-is-selling-rl-environments"}, {"id": 19, "cat": "ai/infra", "urgency": "deep", "source": "ChinaTalk", "title": "RL piggybacking saves Chinese labs the scarcest resource they have: HBM-bound inference", "idea": "Rollouts take >70% of RL post-training time and are inference, which is memory-bound. Chinese chips are short on HBM more than on raw compute. Buying environments already validated by US labs lets Chinese labs skip rollouts wasted on 'RL slop'. US labs pay 4–5x for exclusivity, but tacit knowledge still leaks; Surge markets its environments as 'built by the same experts behind our frontier-lab work'.", "angle": "Ties export controls to memory, not just GPUs. HBM restrictions are the binding constraint, which supports the scarcity thesis for $MU and SK Hynix.", "tweetA": "The HBM ban works, so China is routing around it with data. Rollouts are more than 70% of RL time and they're memory-bound. Buy a pre-validated environment and you skip the HBM you don't have. The export-control wall is only as strong as its least-covered input.", "tweetB": "US labs pay 4–5x for exclusive environments to stop Chinese labs copying them. That premium is a direct measure of how much post-training recipes are worth, and of how leaky the vendor market is.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.chinatalk.media/p/the-us-is-selling-rl-environments"}, {"id": 20, "cat": "regulation", "urgency": "watch", "source": "ChinaTalk", "title": "Offshore contracting keeps the deals out of view: ByteDance buys data from Singapore and San Jose, contractors don't know the end client", "idea": "RL environments are mostly outside export controls except for Entity-Listed buyers like Zhipu, and an unlisted ex-China affiliate avoids even that. In May 2026 Mercor narrowed its customer policy from an ownership test to a location test. Work runs under client codenames, subcontractors (mostly in India) leak client names on LinkedIn, and some products are reportedly sold at 1,000x their build cost. ChinaTalk proposes BIS dual-use rules and DoW procurement (FAR/DFARS) restrictions.", "angle": "Watch for BIS 'is-informed' letters and DFARS clauses. Either would reprice data-vendor margins and their China revenue.", "tweetA": "Data vendors are reportedly marking up RL environments as much as 1,000x over what Indian subcontractors are paid to build them. That's not a margin, that's an information asymmetry, and it ends the first time the US government asks who the end buyer is.", "tweetB": "Mercor quietly changed its customer test from 'who owns you' to 'where are you'. That one-word change is the whole China loophole: open a desk in Singapore and the data flows.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.chinatalk.media/p/the-us-is-selling-rl-environments"}, {"id": 21, "cat": "ai/infra", "urgency": "watch", "source": "ChinaTalk", "title": "Chinese labs' data purchases are 'nearly entirely' benchmaxxing, driven by internal team competition and stock prices", "idea": "Sources on both sides say Chinese buying is driven by benchmark scores: teams inside labs compete on benchmarks, and listed companies need benchmark wins to support their stock. Vendors package environments per benchmark. That makes the transfer mostly benign today (coding and office tasks), but dangerous once benchmarks start measuring cyber and bio capability.", "angle": "A reason to discount Chinese leaderboard results. Benchmark gains bought from vendors may not show up as real-world capability, which favours usage metrics over benchmarks.", "tweetA": "If Chinese labs buy data specifically to hit benchmarks, then the Chinese-model leaderboard is partly a purchase order. Use revenue and token-usage share as the scoreboard, not MMLU.", "tweetB": "Benchmaxxing is harmless while benchmarks measure slide decks. The moment frontier benchmarks shift to cyber and bio, the same buying behavior becomes a dual-use transfer. Policy needs to follow the benchmarks, not the chips.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.chinatalk.media/p/the-us-is-selling-rl-environments"}, {"id": 22, "cat": "ai/infra", "urgency": "red", "source": "Johannes / Quant Enthusiasts", "title": "Nvidia -31% / -$1.7T from its Oct 6 peak while revenue grows 106%: a textbook multiple-compression event", "idea": "NVDA closed at $168.89 on Nov 10, down ~9.5% over two sessions (-$430B) and ~31% from its peak. Last reported quarter: $96.2B revenue (+106% y/y), data centre $89B (92.5% of revenue), 75% gross margin, Q3 guide $108B ±2%. Drivers: the board's probe into Jensen Huang (Wachtell plus ex-acting US Attorney Joon Kim), a hot CPI (2y +18bp to 4.73%, 10y +12.6bp to 4.99%), and doubts about financing AI capex.", "angle": "Fundamentals are intact and the multiple is breaking. If the Huang probe clears, this looks like a 2022-style multiple reset; if it doesn't, key-person risk at a ~$4T company is untested territory.", "tweetA": "Nvidia lost $1.7T in five weeks, more than Anthropic's entire fully diluted IPO valuation. Revenue +106%, gross margin 75%. Nothing in the P&L moved. The market just decided the discount rate and key-person risk are worth a third of the company. $NVDA", "tweetB": "At a $108B quarterly guide, one point of gross margin is ~$1.08B of gross profit per quarter. That's not what's moving the stock. A 31% drop with no earnings change is pure multiple: the 10y near 5% plus a CEO under investigation.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://youngandcalculated.substack.com/p/why-nvidia-stock-fell-31-the-november"}, {"id": 23, "cat": "ai/infra", "urgency": "deep", "source": "Johannes / Quant Enthusiasts", "title": "CoreWeave: Q3 capex $14.5B ≈ 4x revenue, $46.9B debt, $132.5B backlog, profitability not until 1H28", "idea": "CoreWeave reported $3.66B Q3 revenue (+170%) and a $132.5B backlog, against ~$46.9B of debt and $14.5B of quarterly capex, almost 4x revenue. 2026 capex is guided to $37–39B, with adjusted profitability expected in 1H28. Higher rates hit NVDA twice: through its own valuation multiple, and through customers' financing costs.", "angle": "NVDA's marginal buyer is now credit-funded. Watch CRWV bond spreads as a leading indicator for Nvidia orders.", "tweetA": "CoreWeave's debt is 12.8x its quarterly revenue and capex is 4x it. Strong demand and a fragile balance sheet at the same time. Nvidia's marginal customer is a credit, so watch $CRWV bonds, not $NVDA chips.", "tweetB": "Higher rates hit Nvidia twice: once on the multiple, and once on the neoclouds that borrow at high-single to double digits to buy its GPUs. The 10y at ~5% is a GPU demand variable now.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://youngandcalculated.substack.com/p/why-nvidia-stock-fell-31-the-november"}, {"id": 24, "cat": "geopolitics", "urgency": "watch", "source": "Johannes / Quant Enthusiasts", "title": "Nvidia's China share fell to 34% in 1H26; Huawei is at 28% and climbing", "idea": "IDC (via Reuters): Nvidia's share of China's data-centre AI accelerator market fell to 34% in 1H26, with shipments -44% y/y to ~678k units. Huawei rose to ~28% share. NVDA's Q3 guide already assumes zero China data-centre compute revenue, so the issue is long-term market structure rather than a near-term miss.", "angle": "Each Chinese hyperscaler that rebuilds its software stack around Ascend is a customer Nvidia doesn't win back. CUDA lock-in is weakening in the world's #2 AI market.", "tweetA": "Nvidia 34%, Huawei 28% in Chinese AI accelerators. At the current trajectory they cross within a year. Export controls were meant to slow China down; they also handed Huawei a captive market to build an ecosystem in.", "tweetB": "Nvidia guides zero China data-centre revenue, so the market calls China 'already priced'. What isn't priced: every Chinese lab moving its software stack onto Ascend is a CUDA moat that doesn't come back if controls ease.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://youngandcalculated.substack.com/p/why-nvidia-stock-fell-31-the-november"}, {"id": 25, "cat": "macro", "urgency": "red", "source": "Stephen Innes / Dark Side of the Boom (Authers CPI + Anthropic IPO)", "title": "No 12-month CPI exists, so Authers uses 11-month (3.7%) and 13-month (>4%); median, trimmed-mean and supercore all accelerated", "idea": "October 2025 prices were never collected (shutdown), so there is no official y/y reading. The 11-month change is ~3.7% and the 13-month is >4%. Median CPI, trimmed-mean, food and supercore all accelerated. Barclays' Pooja Sriram sees broad gains (furniture, appliances, TVs, phones, computers, cosmetics, prescriptions) from freight pass-through plus AI-related demand. The 2y had its largest daily jump since Liberation Day (April 2025).", "angle": "Breadth is what changes the Fed's math: lower oil won't fix median CPI. Also, AI-demand-driven goods inflation (phones, computers) is a new channel to watch.", "tweetA": "There's no official y/y CPI this month because the shutdown deleted last October. So try 11 months: 3.7%. Or 13: above 4%. The data gap was supposed to make this print noisy. Instead every measure points the same way.", "tweetB": "Barclays flags phones, computers and TVs accelerating, citing AI-related demand. The AI boom isn't only raising power prices; it's competing with consumers for memory and components. That's an inflation channel the Fed has no model for.", "charts": {"count": 3, "hot": true, "desc": "Authers: 11- and 13-month CPI turning back up in 2026; median/trimmed-mean CPI; supercore and food"}, "link": "https://thedarksideoftheboom.substack.com/p/inflation-bites-back-the-feds-hawkish"}, {"id": 26, "cat": "macro", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom (Authers CPI + Anthropic IPO)", "title": "Rate odds: ~3 more hikes priced, 50bp in December only ~11%; Goldman adds March 2027 for a 4.25–4.50% peak", "idea": "Bloomberg rate probabilities moved from asking whether two more hikes were needed to pricing about three, with a 50bp December hike at ~11%. Logan wants at least two more 25bp hikes. Neither Waller nor Logan dissented for a hike last meeting, which Authers reads as the Fed falling behind. Equities took it well: SPX -0.38%, equal-weight roughly flat.", "angle": "The 2y at 4.73% sits above Goldman's own projected terminal (4.25–4.50%). The front end is pricing more than GS's forecast, which leaves room for a rally if PPI cools.", "tweetA": "The 2y is at 4.73%. Goldman's terminal call, even after adding another hike, is 4.25–4.50%. The front end is already pricing a more hawkish Fed than the most hawkish big-bank forecast. That's where the asymmetry is now.", "tweetB": "SPX -0.38% and equal-weight flat on the worst inflation day in months, with the 2y up the most since Liberation Day. Equities are telling you they can live with a Fed that finally looks serious. Bonds are telling you they don't believe it yet.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/inflation-bites-back-the-feds-hawkish"}, {"id": 27, "cat": "ai/infra", "urgency": "red", "source": "Stephen Innes / Dark Side of the Boom (Authers CPI + Anthropic IPO)", "title": "Anthropic's IPO is a liquidity event for the whole market: up to $90.4B total, $450B in compute commitments through 2030", "idea": "Up to $90.4B combined (IPO plus private placement) at ~$1.4T fully diluted, above SpaceX's $75B in June. Bloomberg Intelligence's Mandeep Singh cites ~$450B of compute commitments through 2030; Chris Hughes sees a path to $2T by 2029. Pitcairn's Sonnenberg warns investors may sell existing holdings to make room; Bob Elliott says ANT's aftermarket will set confidence for the whole AI capex cycle, with OpenAI next.", "angle": "A mega-IPO financed by selling megacaps is a quiet source of supply pressure on index heavyweights into Nov 18–19.", "tweetA": "The Anthropic IPO doesn't add new money to equities. It reallocates it. The $64B has to come from somewhere, and the obvious funding source is the megacaps institutions already own. Watch the AI-heavy indices into Nov 19.", "tweetB": "The IPO price matters less than day 20. Elliott is right: ANT's aftermarket becomes the referendum on whether public markets will keep financing AI capex. OpenAI's bankers will be watching that chart more closely than anyone.", "charts": {"count": 1, "hot": true, "desc": "Bloomberg: Anthropic's pre-IPO revenue growth vs. other mega-cap tech companies' pre-IPO trajectories"}, "link": "https://thedarksideoftheboom.substack.com/p/inflation-bites-back-the-feds-hawkish"}, {"id": 28, "cat": "regulation", "urgency": "watch", "source": "Stephen Innes / Dark Side of the Boom (Authers CPI + Anthropic IPO)", "title": "Strategas' Tzitzouris: tighter data-centre regulation could entrench incumbents with existing capacity", "idea": "If permitting tightens after the midterms, existing powered capacity gains scarcity value and cash-flow visibility for established operators. Leveraged developers and smaller AI companies that depend on fast expansion get squeezed. The winners of the next AI phase may not be the winners of the first.", "angle": "Pair trade: long operational, powered capacity (hyperscalers, built-out REITs) vs. short leveraged greenfield developers. Fits with the Texas moratorium talk in 0xSammy's note.", "tweetA": "A data-centre moratorium is bullish for anyone who already has a data centre. Regulation is the best moat money can't buy, and it's about to be handed to the incumbents for free.", "tweetB": "Phase one of AI rewarded whoever could build fastest. Phase two may reward whoever already built before the permit wall went up. Same theme, opposite factor exposure.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/inflation-bites-back-the-feds-hawkish"}, {"id": 29, "cat": "positioning", "urgency": "red", "source": "SixSigmaCapital / SixSigmaResearch chat", "title": "SixSigma's chat asks: buy or trim the overnight AI/semis bounce? 'Fool me twice' or 'different this time'", "idea": "SixSigmaCapital opened the morning thread noting strong overnight action in the AI complex and semis after CoreWeave's beat (Nasdaq futures +1.9%), asking members whether they're buying or trimming into it, framed as 'fool me twice, shame on me'.", "angle": "Sentiment read: even bulls are framing the bounce as something to sell. That kind of skepticism usually lets bear-market rallies run further than expected.", "tweetA": "Nasdaq futures +1.9% on CoreWeave and the first question in every chat room is 'do I trim?' When the bulls are this suspicious of a bounce, it usually has further to go than they think.", "tweetB": "Same bounce, two readings: if it's CoreWeave-driven, it's a beat on a company whose interest costs exceed operating profit (Rosenberg). If it's positioning, it's pods re-grossing. Know which rally you're buying.", "charts": {"count": 0, "hot": false, "desc": "No charts (chat notification)"}, "link": "https://sixsigmaresearch.com/"}, {"id": 30, "cat": "ai/infra", "urgency": "deep", "source": "0xSammy / Sammy's Snippets", "title": "Eight AI-adjacent IPOs benchmarked: half now trade below their first-day close (Figma +250% on day one, then gave most of it back)", "idea": "0xSammy benchmarked eight recent listings from SpaceX to Cerebras to Figma. Half trade below their first-day close. Hype drives the debut; valuation and execution decide what happens next. Anthropic enters a much less forgiving market than a year ago.", "angle": "Base rate: a coin-flip on holding the first-day close. Better to own the aftermarket dip than the allocation.", "tweetA": "Half of 2025–26's big AI IPOs trade below their first-day close. The IPO pop is a transfer from people who buy at the open to people who were allocated. Base rates say wait 30 days on ANT.", "tweetB": "Figma +250% on day one, then round-tripped. Day-one returns measure how much retail demand was left unfilled, not company quality. The retail slice of the Anthropic deal is double the usual size, so plan accordingly.", "charts": {"count": 1, "hot": true, "desc": "Benchmark of 8 AI/adjacent IPOs: first-day pop vs. current price"}, "link": "https://www.0xsammy.com/p/anthropics-ipo-what-8-ai-listings"}, {"id": 31, "cat": "ai/infra", "urgency": "deep", "source": "0xSammy / Sammy's Snippets", "title": "Anthropic: Q3 revenue +47% q/q but compute and infrastructure cost +78%; $68B annualized; $895B in commitments", "idea": "Annualizing Q3 gives ~$68B in revenue. At $1.2T, $1.5T and $2T the valuation is 17.7x, 22.1x and 29.5x that run rate. Compute cost grew faster than revenue (+78% vs +47%). Disclosed purchase and lease commitments total $895.4B, with ~$69.8B due in the next 12 months, half by 2030 and the rest through 2045. The GAAP loss includes a $2B non-cash charitable charge.", "angle": "The key metric for ANT is the gap between compute-cost growth and revenue growth, i.e. gross-margin direction. A 31-point gap isn't sustainable at scale.", "tweetA": "Anthropic Q3: revenue +47% q/q, compute cost +78% q/q. At $1.4T that's ~20x a $68B run rate. The valuation works if the gap between those two growth rates closes. That's the one line to track on every earnings call.", "tweetB": "$895B in compute and lease commitments against $68B of annualized revenue: 13 years of current revenue already spoken for. Only ~$70B is due in the next 12 months, so it's a long-duration funding problem, not a near-term cash crunch, which is exactly what equity markets are good at financing.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.0xsammy.com/p/anthropics-ipo-what-8-ai-listings"}, {"id": 32, "cat": "energy", "urgency": "deep", "source": "0xSammy / Sammy's Snippets", "title": "Anthropic reportedly paid $3.4B for 1.7GW of Caterpillar gas generators, about $2,000/kW", "idea": "Per FT/Reuters (unconfirmed by the companies), Anthropic took over OnePWR Solutions' commitments for 1.7GW of gas-fired generation, roughly the annual use of ~6M homes. DCD says the Caterpillar units were ordered two years ago and arrive within two. The price is ~$2M/MW. Sammy's read: Anthropic is buying delivery certainty, not just equipment; fuel, permits, cooling and interconnection are still open.", "angle": "Behind-the-meter gas is now the frontier labs' default bridge. Bullish for $CAT and gas midstream, and supportive of Henry Hub demand.", "tweetA": "Riot charges $130/kW/month for powered shell. Anthropic reportedly paid ~$2,000/kW for gas generators. At that rent the gensets pay back in about 15 months. Power isn't a cost center anymore; it's the cheapest part of the moat. $CAT", "tweetB": "An AI lab buying 1.7GW of gas turbines that were ordered two years ago tells you the binding constraint is the equipment queue, not chips. The most valuable thing in AI right now is a delivery slot.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.0xsammy.com/p/anthropics-ipo-what-8-ai-listings"}, {"id": 33, "cat": "crypto", "urgency": "deep", "source": "0xSammy / Sammy's Snippets", "title": "Bitcoin miners become AI landlords: Riot and TeraWulf sign ~$47B of Anthropic leases for 1,311MW", "idea": "Riot's Corsicana lease is 910MW of critical IT and ~$28B over its initial term at $130/kW/month base rent, escalating 3% a year (~$1.42B/yr at full delivery), with Riot expecting a ~99% NOI margin and ~$5.5B of development capex. TeraWulf's Justified campus is 401MW and $19B over 20 years. Google backstops certain Anthropic obligations at TeraWulf, with an option to take equity on default. Meanwhile, Riot sold 20,264 BTC in 9M26, mostly to fund the build.", "angle": "Miners re-rate as data-centre REITs, but tenant concentration (one counterparty) and BTC selling pressure come with it.", "tweetA": "Riot sold 20,264 BTC this year to build a data centre for Anthropic. The 'miners pivot to AI' trade is good for miner equity and a structural seller of bitcoin at the same time. $RIOT $WULF", "tweetB": "TeraWulf: $19B over 20 years for 401MW is ~$197/kW/month on average. Riot starts at $130 rising 3% a year. Same tenant, very different rent. Who has the better contract depends on when each one delivers.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.0xsammy.com/p/anthropics-ipo-what-8-ai-listings"}, {"id": 34, "cat": "regulation", "urgency": "watch", "source": "0xSammy / Sammy's Snippets", "title": "Texas governor-elect Hinojosa calls for a data-centre moratorium; takes office January 19, 2027", "idea": "Per the Texas Tribune, governor-elect Gina Hinojosa wants a pause on data centres until new protections are in place, on top of an existing Abbott-era pause affecting environmental permitting and grid connections. Operational sites gain scarcity value; projects still needing permits or interconnection get harder to deliver even with land and a tenant.", "angle": "ERCOT has been the default AI build state. A moratorium redirects capex to other states and raises the value of energized Texas capacity already in place.", "tweetA": "Texas, the 'build anything' state, now has a governor-elect asking for a data-centre moratorium. If ERCOT closes, every powered megawatt already in Texas gets repriced overnight.", "tweetB": "Contrarian read: a Texas moratorium isn't bearish for AI infrastructure, it's bearish for the backlog. Signed leases that still need interconnects are now permit risk, and some of the $47B miner lease value sits right there.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.0xsammy.com/p/anthropics-ipo-what-8-ai-listings"}, {"id": 35, "cat": "crypto", "urgency": "watch", "source": "0xSammy / Sammy's Snippets", "title": "Financial markets for compute: Injective's GPU rental index, Bittensor subnets at ~$70M annualized revenue", "idea": "Injective launched a Super Intelligence Compute Index on Oct 26 (fixed-weight basket of GPU rental prices, 7-day trailing average). Revenue-generating Bittensor subnets reached ~$70M annualized, up from ~$50M a month earlier (SubConnect). Sammy's caveat: price exposure doesn't reserve a GPU, and decentralized compute doesn't replicate tightly integrated training clusters.", "angle": "Compute is turning into a tradable commodity (see Jump's compute desk). An index with no physical delivery is a hedge for neocloud operators, not for labs.", "tweetA": "Bittensor subnet revenue +40% in a month, to ~$70M annualized. Still a rounding error next to one CoreWeave quarter, but it's the first crypto-AI metric that's real revenue rather than token emissions.", "tweetB": "GPU rental indices are the start of a compute futures curve. Once there's a curve, neocloud lenders can hedge collateral value, and AI credit spreads should tighten. Financial plumbing follows physical scarcity.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.0xsammy.com/p/anthropics-ipo-what-8-ai-listings"}, {"id": 36, "cat": "labor", "urgency": "deep", "source": "Danielle DiMartino Booth / The Daily Feather", "title": "Conagra closes its Macon, MO pot-pie plant: 442 jobs in a town of 5,457 (8% of the population), first opened in 1917", "idea": "Marie Callender's and Banquet pot pies will no longer be made in Missouri. The plant employs 442 of Macon's 5,457 residents, and departures begin January 15, 2027. Food processing in Macon goes back to 1917 (F.M. Stamper, then Banquet, acquired by Conagra in 1980). The same day, PepsiCo said it will cut ~1,000 jobs after North American beverage volume fell 2% in Q3 and food volume was flat.", "angle": "Packaged-food volume declines are the clearest sign of a consumer purchasing-power squeeze. Staples are cutting capacity, not just prices. Bearish for $CAG and $PEP volumes; supports the Fed-overtightening view.", "tweetA": "When a 109-year-old pot-pie plant closes because Americans are buying fewer frozen dinners, it's a purchasing-power story, not a supply-chain one. The cheapest meal in the store is losing volume. $CAG", "tweetB": "CPI says inflation is reaccelerating. Pot-pie and Pepsi volumes say real consumption is shrinking at the low end. That isn't a strong economy that needs hikes; it's a K-shaped one where the bottom half is already in recession.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://dimartinobooth.substack.com/p/the-daily-feather-macon-no-longer"}, {"id": 37, "cat": "ai/infra", "urgency": "red", "source": "Peter Boockvar / The Boock Report", "title": "Boockvar: Anthropic's cap table looks like 1980s Japanese cross-shareholdings", "idea": "Amazon and Google already own large stakes, Google is buying more in the IPO, and suppliers Nvidia, Micron, Broadcom, AMD and TSMC are joining. Everyone in the industry owns everyone else, as in Japan's keiretsu of the 1980s.", "angle": "Circular ownership amplifies correlation: an ANT drawdown marks down its suppliers' books, which also depend on its compute orders. It's reflexivity built into the cap table.", "tweetA": "Nvidia invests $10B in Anthropic, Anthropic spends it on Nvidia-powered compute, and Nvidia books the revenue. Boockvar calls it keiretsu, and he's right. Japan's version ended with the cross-holdings unwinding all at once.", "tweetB": "Cross-shareholdings worked in 1980s Japan until they didn't: when prices fell, everyone's balance sheet fell together, and selling one stake forced selling another. Seven compute vendors in ANT's cap table means seven correlated balance sheets.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://peterboockvar.substack.com/p/japanese-cross-shareholdings-all"}, {"id": 38, "cat": "macro", "urgency": "deep", "source": "Peter Boockvar / The Boock Report", "title": "Mortgage rates down 4 weeks in a row to 7.21%; purchase apps +7.5% w/w; Brainard floats a $1,000-down FHA facility", "idea": "The MBA 30-year average fell to 7.21%, purchase applications rose 7.5% w/w and refis 4.5%. Former Fed Governor Lael Brainard proposed an FHA facility requiring only $1,000 down. Boockvar: 25 years of subsidizing demand (low rates, MBS QE) without adding supply produced the affordability crisis.", "angle": "Housing policy is drifting back toward demand stimulus while the Fed hikes. Builders benefit, prices stay sticky, and shelter inflation lasts longer.", "tweetA": "Mortgage rates at 7.21% with the 10y near 5%: a ~220bp spread. The Fed is hiking, and a former Fed governor wants $1,000-down FHA loans. One arm of policy is trying to cool demand while another is trying to subsidize it.", "tweetB": "$1,000 down. We did this in 2005 and called it innovation. Housing doesn't have a demand problem; it has a supply problem. Every demand subsidy without supply becomes price.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://peterboockvar.substack.com/p/japanese-cross-shareholdings-all"}, {"id": 39, "cat": "ai/infra", "urgency": "deep", "source": "Peter Boockvar / The Boock Report", "title": "CoreWeave bounces off its lowest level since listing at $40 after its call", "idea": "Boockvar flags CoreWeave rebounding from its lowest level since soon after its $40 IPO, citing comments from its earnings call (the details are behind the paywall). The 'Coreweave saves today' headline points to it driving the risk-on pre-market.", "angle": "One neocloud's earnings moving the whole AI complex shows how fragile sentiment is. Single-name dependence is a fragility signal of its own.", "tweetA": "When one neocloud's earnings call can lift the whole Nasdaq pre-market, the AI trade isn't trading on fundamentals. It's trading on whether the most leveraged buyer of GPUs can keep borrowing.", "tweetB": "CoreWeave near its IPO price is the cleanest real-time gauge of AI credit risk in the equity market. If $CRWV breaks $40, it's a credit event wearing an equity costume.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://peterboockvar.substack.com/p/japanese-cross-shareholdings-all"}, {"id": 40, "cat": "credit", "urgency": "red", "source": "David Rosenberg / Early Morning with Dave", "title": "Rosenberg: CoreWeave's interest costs now exceed its operating profit, and the beat doesn't fix that", "idea": "The CoreWeave beat sent investors back into the AI trade, but Rosenberg points out it is borrowing heavily at very high rates to build capacity, and interest expense now exceeds operating profit. A sales beat doesn't change that structure.", "angle": "Interest coverage below 1x at the most important GPU buyer outside the hyperscalers is a credit flag. Watch CRWV bond spreads and any new raises at wider levels.", "tweetA": "Revenue +170%, interest costs bigger than operating profit. In any other sector that's a distressed-credit screen. In AI it's a reason for Nasdaq futures to rally 1.9%. $CRWV", "tweetB": "The AI rally today was triggered by a company with sub-1x interest coverage. The equity market is cheering the growth while the bond market keeps the bill. When those two disagree, credit is usually right.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.earlymorningwithdave.com/p/investors-pile-back-into-the-ai-trade"}, {"id": 41, "cat": "macro", "urgency": "deep", "source": "David Rosenberg / Early Morning with Dave", "title": "Fed hawks go into overdrive on CPI, yet market-based inflation expectations fall to four-month lows", "idea": "Rosenberg's subhead: CPI pushed the Fed hawks into overdrive, but market-based inflation expectations dropped to four-month lows. The bond market is reading hikes as disinflationary while the FOMC reads CPI as persistent.", "angle": "If breakevens fall while the front end rises, real yields are doing the tightening. Bearish gold near term (consistent with Innes), bullish real-yield-sensitive USD.", "tweetA": "The Fed sees inflation everywhere. The inflation-swap market sees it at a four-month low. When the 2y rises and breakevens fall, real rates are doing the hiking for the Fed. That's how you over-tighten.", "tweetB": "Hot CPI, lower breakevens: the market believes the Fed will win, and that's the most bearish possible signal for the economy. Credibility gets bought with growth.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.earlymorningwithdave.com/p/investors-pile-back-into-the-ai-trade"}, {"id": 42, "cat": "labor", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom (Morgan Stanley productivity)", "title": "Morgan Stanley: 83% of the US productivity gain comes from just 12 AI-exposed industries; the other 52 contribute almost nothing", "idea": "Output per employee is rising sharply, but 83% of the improvement is concentrated in twelve high-AI-exposure industries. The other 52 contributed very little, and some went backwards. MS sees genuine efficiency gains and early signs of labour substitution, but no broad-based dividend yet.", "angle": "The 'AI productivity boom' is currently the AI sector measuring itself. If gains don't spread by 2027, the capex return case weakens and labor substitution in the 12 industries becomes the political story.", "tweetA": "83% of US productivity growth comes from 12 industries, the same ones building and selling AI. The AI productivity boom is so far mostly AI companies being productive at selling AI. The other 52 industries are the test.", "tweetB": "Productivity concentrated plus early labor substitution plus a Fed hiking into it equals a K-shaped labor market. Pair this with the Conagra and PepsiCo layoffs and the 'strong economy' looks a lot narrower than the aggregates.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening (productivity by industry)"}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-productivity-boom-has-a-very"}, {"id": 43, "cat": "ai/infra", "urgency": "deep", "source": "0xJeff / No BS POV", "title": "Open-weight models are commoditizing intelligence; US labs must push into verticals to justify 20x+ pricing", "idea": "0xJeff (adapting Topology VC research): Chinese open-weight labs (DeepSeek, Kimi, Qwen, MiniMax) are doing to intelligence what China did to manufacturing, scaling volume and driving down the cost curve. Open models are now 'good enough' for coding, research and email. US labs respond with vertical depth (legal, science, finance) to justify prices 20x+ above open weights. AI spending is up 5x+ y/y.", "angle": "Margin compression risk for horizontal model providers, against their compute commitments. Relevant to the ANT valuation debate: does the 20x premium survive?", "tweetA": "ChinaTalk says Chinese labs buy US RL environments to close the gap. 0xJeff says Chinese open weights are commoditizing intelligence. Put them together: part of the cheap intelligence is built on American post-training data, sold at a markup.", "tweetB": "US frontier models price at 20x+ open weights. That premium is the entire bull case for $1T+ lab valuations. Every month the gap stays the same, the vertical-moat thesis holds. Every month it narrows, the compute commitments get heavier.", "charts": {"count": 2, "hot": false, "desc": "Topology VC: intelligence per dollar, frontier vs. open-weight price gap"}, "link": "https://defi0xjeff.substack.com/p/beginners-guide-to-the-crypto-x-ai"}, {"id": 44, "cat": "crypto", "urgency": "watch", "source": "0xJeff / No BS POV", "title": "The modular 'open AI stack' (model + harness + tools + memory) as the entry point for Crypto x AI", "idea": "Jeff's anatomy: the brain is an open-weight model (DeepSeek v4.1 flash, Kimi K3.1, GLM 5.3 flash), the nervous system is an agent harness (Hermes, OpenClaw), plus tools and persistent memory, and every layer is swappable. The crypto thesis (paywalled) builds on composability: permissionless payments, memory and verification for swappable agents.", "angle": "Agent memory and payment rails (Walrus, stablecoins, x402-style) are where crypto touches the open stack. Watch real usage, not token price.", "tweetA": "When every layer of the AI stack is swappable, value moves to whatever can't be swapped: payments, identity and audit trails. That's the only Crypto x AI thesis that doesn't need token emissions to work.", "tweetB": "Open weights plus open harnesses means agents with no vendor relationship. Agents with no vendor relationship need permissionless money. Stablecoins are the AI distribution story nobody in TradFi is pricing.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://defi0xjeff.substack.com/p/beginners-guide-to-the-crypto-x-ai"}, {"id": 45, "cat": "ai/infra", "urgency": "red", "source": "Morning Minute (Lucky Trader)", "title": "ANT IPO terms: $70–78 range, 825M shares, $64.4B raised, 20% retail allocation, pricing Nov 18, trading Nov 19", "idea": "Valuation is $916B–$1.02T on basic shares and up to $1.405T fully diluted. In September the target was $2T, and WSJ says major investors now see ~$1T after the AI selloff, a ~30% markdown in two months. The book is reported 'covered', not oversubscribed. Hyperliquid's ANT perp trades at ~$1.8T on $100M daily volume and $200M OI. Financials: $33.2B 9M revenue (vs $2.5B a year ago), $1.26B operating loss, $104B net loss mostly from a non-cash convertible charge, $900.9B in commitments ($70.7B due within 12 months).", "angle": "A ~$400B+ gap between onchain perp pricing and the Wall Street book. One of them is wrong by Nov 19. The perp has funding-cost and squeeze risk.", "tweetA": "Wall Street book: ~$1.0–1.4T, 'covered'. Hyperliquid perp: $1.8T. A 30–80% gap on the same company a week before pricing. Either crypto traders know something the bankers don't, or onchain IPO markets are about to get an expensive lesson.", "tweetB": "Valuation went from a $2T ambition in September to $1T on basic shares in November. A 30% markdown before the stock even trades. The selloff priced the IPO before the IPO priced itself.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://luckytrader.substack.com/p/what-anthropics-14-trillion-ipo-means"}, {"id": 46, "cat": "ai/infra", "urgency": "deep", "source": "Morning Minute (Lucky Trader)", "title": "$26B non-voting private placement from 7 compute suppliers at the IPO price, with no lock-up", "idea": "Google and Nvidia ~$10B each, AMD $2.5B, Broadcom, Micron and Microsoft ~$1B each, TSMC $500M, all in non-voting Class N at the IPO price, with no lock-up. Combined with the IPO, Anthropic raises ~$84.6B, mostly for compute. The suppliers get paid back through compute contracts.", "angle": "No lock-up on $26B of vendor stock is a supply overhang. If ANT trades below issue, vendors could sell to protect their balance sheets.", "tweetA": "Suppliers buy $26B of Anthropic stock and Anthropic buys compute from those same suppliers. Vendor financing is back. Last time it was this popular was Lucent and Nortel in 1999.", "tweetB": "$26B of vendor stock with no lock-up is the detail nobody's talking about. IPO buyers face a 180-day lock-up on insiders, but seven of the largest holders can sell on day one. That's an overhang, not a vote of confidence.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://luckytrader.substack.com/p/what-anthropics-14-trillion-ipo-means"}, {"id": 47, "cat": "crypto", "urgency": "red", "source": "Morning Minute (Lucky Trader)", "title": "The SpaceX analog: BTC fell 29% into the June IPO and bottomed a week before it; scaled for ANT, that implies ~-5% more", "idea": "Liquidity-drain thesis: retail IPO allocations pull speculative money from crypto. SpaceX listed June 12; BTC fell 29% into it, effectively bottomed June 5 at $59k (low $58.5k June 30), then rallied 37%. ANT's retail slice is $12.9B vs SpaceX's $22B (~59%), and the $26B vendor placement never touches public liquidity. So: ~5% more downside, to around the 200-week MA, with a bottom in 1–2 days. BTC is at $73.9k; ETF outflows were $95M Tuesday.", "angle": "A tradable setup: scale in near the 200-week MA into Nov 18 and stop below it. A sample size of one is the obvious caveat.", "tweetA": "BTC fell 29% into the SpaceX IPO and bottomed a week before the listing. ANT's retail slice is 59% of SpaceX's. If the pattern rhymes, the bottom is around $70k and it's in this week. The 200-week MA is right there. $BTC", "tweetB": "The 'IPOs drain crypto liquidity' thesis has a sample size of one. But here's what's different: $26B of the ANT deal comes from compute vendors, not retail. The actual retail drain is $12.9B, about the size of a bad BTC ETF month.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://luckytrader.substack.com/p/what-anthropics-14-trillion-ipo-means"}, {"id": 48, "cat": "crypto", "urgency": "red", "source": "Morning Minute (Lucky Trader)", "title": "21 banks (Goldman, Citi, Santander, Deutsche) commit $270M to a US dollar-stablecoin issuer, 'Project Faro'", "idea": "A consortium of 21 banks committed ~$270M to fund five years of operations for a US-incorporated dollar stablecoin issuer known internally as Project Faro, a direct bank-owned competitor to USDT and USDC.", "angle": "Bank-consortium stablecoins have failed before (consortia move slowly). The real threat to Circle is distribution, not product. Watch $CRCL multiple and Coinbase USDC revenue share.", "tweetA": "$270M over five years is ~$54M a year to run a bank-owned stablecoin. Tether earns more than that in a couple of weeks. The banks aren't trying to out-earn stablecoins; they're trying to stop deposits walking out the door. $CRCL", "tweetB": "21 banks needed to agree on one stablecoin. Consortium products are where fintech ideas go to slow down. But if it works, the GENIUS-era moat for Circle disappears overnight, because banks own distribution.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://luckytrader.substack.com/p/what-anthropics-14-trillion-ipo-means"}, {"id": 49, "cat": "regulation", "urgency": "red", "source": "Morning Minute (Lucky Trader)", "title": "CFTC warns Kalshi of possible enforcement over how it notified the agency of new contracts", "idea": "Politico reports dozens of products under review; Kalshi calls it a 'procedural error' affecting a handful. It comes as prediction markets go mainstream and regulated venues like MIAX prepare SEC filings for binary event options.", "angle": "Regulatory risk is shifting prediction-market share toward incumbent exchanges with SEC-regulated wrappers (MIAX, CBOE). Kalshi's self-certification model is under pressure.", "tweetA": "The CFTC is going after Kalshi on process, while MIAX files with the SEC for binary event options. Prediction markets aren't being banned; they're being moved to incumbent exchanges.", "tweetB": "Kalshi's edge was self-certifying contracts faster than regulators could object. The CFTC just priced that speed. Expect fewer novelty contracts and more index-linked binaries from regulated exchanges.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://luckytrader.substack.com/p/what-anthropics-14-trillion-ipo-means"}, {"id": 50, "cat": "tech", "urgency": "watch", "source": "Morning Minute (Lucky Trader)", "title": "Near AI breach via an RCE in the open-source SGLang inference engine exposed 18 agents' chat histories", "idea": "An attacker exploited a remote code execution flaw in SGLang to move through Near AI's infrastructure, exposing names and emails of ~100 users and chat histories from 18 AI agents.", "angle": "Inference engines (SGLang, vLLM) are now critical attack surface. Agent memory leaks are a new breach category. Bullish for AI security vendors.", "tweetA": "The breach didn't go through the model. It went through the inference engine, SGLang, open-source plumbing that half the open-weight ecosystem runs on. Agent memory is the new PII, and it's sitting on the least-audited layer of the stack.", "tweetB": "18 agents' chat histories leaked. Agent logs contain credentials, instructions and decisions. The first big agent breach will look less like a stolen database and more like stolen judgment. $CRWD $PANW", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://luckytrader.substack.com/p/what-anthropics-14-trillion-ipo-means"}, {"id": 51, "cat": "crypto", "urgency": "watch", "source": "Morning Minute (Lucky Trader)", "title": "Trump Media posts $409.7M Q3 profit, all from $496.1M of unrealized crypto/securities gains; Ripple's ex-CTO sold 1,499 of 1,500 BTC", "idea": "TMTG swung from a $238M Q2 loss to a $409.7M Q3 profit on $496.1M of unrealized gains as BTC rose 42% in the quarter. Former Ripple CTO David Schwartz cut holdings from ~26M XRP to 3M, 1,500 BTC to 1, 40,000 ETH to 6, selling into new highs under an agreement with his wife. Also: Grayscale pledged $1M to Zcash nonprofits (ZEC -15% to $983), and Moody's + Chainlink piloted onchain credit ratings.", "angle": "Corporate crypto treasuries turn earnings into a BTC beta. With BTC down ~15% from early October, Q4 prints flip negative.", "tweetA": "Trump Media's $410M Q3 profit was 121% unrealized crypto gains. BTC is down ~15% since then. Treasury companies don't have earnings; they have mark-to-market with a ticker. $DJT", "tweetB": "One of crypto's earliest insiders sold 99.9% of his BTC and ETH into new highs under a pre-agreed rule with his spouse. The best risk-management system in crypto turns out to be a prenup.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://luckytrader.substack.com/p/what-anthropics-14-trillion-ipo-means"}, {"id": 52, "cat": "equities", "urgency": "deep", "source": "The Hermit: Institutional Research", "title": "MIAX: an options exchange with 54% EBITDA margins, $699M cash and no debt; DCF fair value $41.95 (+22%)", "idea": "Miami International is one of six US exchange groups, with 36µs latency and 99.999% uptime on its own tech stack. Q3 adj. EBITDA margin was 54%. Catalysts: an exclusive 10-year Bloomberg index license (B500/B100 Tini futures with zero fees; options in 2027), a ~10% access-fee increase on January 1, 2027, MIAX Sapphire at 12.4% of US floor-traded options, SEC filings for binary event options, and a 10% stake in Rothera (Robinhood/SIG JV that bought LedgerX). Hermit's DCF uses 9.5% WACC and 3% terminal growth.", "angle": "A small-cap way to own exchange operating leverage and the prediction-market wave without Kalshi's regulatory risk.", "tweetA": "A 10% access-fee hike on Jan 1 at an exchange where connectivity can't be unplugged is close to pure margin. At 54% EBITDA margins and ~$6/share of net cash, $MIAX is a toll road that's starting to raise the tolls.", "tweetB": "While the CFTC goes after Kalshi, an SEC-regulated options exchange is filing for binary event options and owns 10% of Robinhood's prediction-market JV. The regulated route into event contracts may be the better trade. $MIAX $HOOD", "charts": {"count": 6, "hot": false, "desc": "Infographic-heavy post: business model, cash machine, DCF and WACC sensitivity table"}, "link": "https://www.hermitresearch.com/p/miax-the-best-business-weve-analyzed-e5e"}, {"id": 53, "cat": "equities", "urgency": "watch", "source": "The Hermit: Institutional Research", "title": "MIAX vs CME: Bloomberg B500 'Tini' futures with zero exchange fees and free data, aimed at retail", "idea": "MIAX launched retail-sized Tini B500 and B100 futures with zero exchange fees and free market data, onboarded NinjaTrader in mid-October, and has more retail brokers going live in Q4. That's a price attack on CME's micro E-mini franchise using a Bloomberg-branded index instead of S&P.", "angle": "Long-dated threat to CME's retail micro franchise and S&P DJI index-licensing fees. Watch for open-interest traction in Q1 2027.", "tweetA": "Zero exchange fees and free data, on a Bloomberg index instead of the S&P. MIAX is going after CME's retail micro-futures franchise on price. Index licensing is the quiet moat being tested here. $CME $SPGI", "tweetB": "Every exchange disruption starts with zero fees and ends with whoever gets the open interest. Watch whether B500 futures get any OI by Q1. If they do, S&P's index-licensing monopoly has its first real competitor.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.hermitresearch.com/p/miax-the-best-business-weve-analyzed-e5e"}, {"id": 54, "cat": "gold", "urgency": "deep", "source": "Alfonso De Pablos / All Star Charts", "title": "Silver fell from ~$120 to $50 and is retesting its 2011 high: the polarity setup", "idea": "After the 2025 precious-metals run, silver dropped from about $120 to $50 (-58%). De Pablos is watching $50, the 2011 high, where old resistance should become support. Step one is for price to stop falling; a rolling-over dollar would be a tailwind.", "angle": "But Innes and Rosenberg argue a hawkish Fed plus falling breakevens are bearish for metals near term. The polarity level is meeting a macro headwind.", "tweetA": "Silver at $50 with gold at $4,050 is a gold/silver ratio near 81. Silver fell 58% while gold held up. If the 2011 high holds as support, the ratio is the trade, not the outright. $SLV $GLD", "tweetB": "Chart says buy the 2011 polarity level. Macro says the Fed is hiking with breakevens at four-month lows, which is the worst setup for non-yielding metals. When technicals and macro disagree this sharply, size small and let price confirm.", "charts": {"count": 1, "hot": false, "desc": "Silver weekly: retest of the 2011 high near $50"}, "link": "https://www.allstarcharts.com/bonanza-is-back"}];
