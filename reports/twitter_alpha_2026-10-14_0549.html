<!DOCTYPE html>
<html lang="en">
<head>

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

-13T22:14:04.000Z", "category": "AI"}, {"author": "aleabitoreddit", "summary": "aleabitoreddit: guesses why Elon has campaigned against memory in recent posts — SK Hynix and Samsung may have raised memory prices too aggressively (chart).", "tweet_url": "https://x.com/aleabitoreddit/status/2110146513766900019", "images": ["https://pbs.twimg.com/media/HUi_ElJbYAASnb4.jpg"], "type": "tweet", "created_at": "2026-10-13T23:11:48.000Z", "category": "tech"}, {"author": "thedefivillain", "summary": "thedefivillain says he is longing more memory stocks via perps on the dip.", "tweet_url": "https://x.com/thedefivillain/status/2110074852774220149", "images": [], "type": "thread", "created_at": "2026-10-13T18:27:02.000Z", "category": "positioning"}, {"author": "munster_gene", "summary": "munster_gene (Deepwater) on the $DRAM sell-off: in AI investing there is weather and climate — 'the weather is stormy, the climate is divine'.", "tweet_url": "https://x.com/munster_gene/status/2110130865443377422", "images": [], "type": "tweet", "created_at": "2026-10-13T22:09:37.000Z", "category": "AI"}, {"author": "RaoulGMI", "summary": "RaoulGMI, replying to AndreasSteno: 'it's just a rotation and there is no stopping this train yet'.", "tweet_url": "https://x.com/RaoulGMI/status/2110087267091964088", "images": [], "type": "tweet", "created_at": "2026-10-13T19:16:22.000Z", "category": "AI"}, {"author": "Chartfest1", "summary": "Chartfest1: Nasdaq breadth significantly worse than NYSE today (a lot of garbage out there for two months), and KOSPI sits right at its 200-day average.", "tweet_url": "https://x.com/Chartfest1/status/2110068234674471174", "images": [], "type": "thread", "created_at": "2026-10-13T18:00:44.000Z", "category": "macro"}, {"author": "jimcramer", "summary": "jimcramer's tape notes: 'Intel turning'; expects Goldman Sachs upgrades and price-target hikes; 'dozens told us to sell Microsoft, now they want in?'; and says the ultra rich are almost always negative yet never 'wrong' in the media's eyes.", "tweet_url": "https://x.com/jimcramer/status/2110127786748706843", "images": [], "type": "tweet", "created_at": "2026-10-13T21:57:23.000Z", "category": "tech"}, {"author": "dgt10011", "summary": "dgt10011 (image): a private company floating revenue 'guidance' to the press about 30 days before its supposed IPO is not a sign of confidence — if the numbers carried the S-1, nobody would need to presell them through the media. 'Plan accordingly.'", "tweet_url": "https://x.com/dgt10011/status/2110106976894271505", "images": ["https://pbs.twimg.com/media/HUibHJHWUAAjCLn.jpg"], "type": "tweet", "created_at": "2026-10-13T20:34:41.000Z", "category": "positioning"}]}, {"cluster": "Character.AI Chapter 11 and the Human Bottleneck on AI", "category": ["AI", "tech"], "items": [{"author": "cryptopunk7213", "summary": "cryptopunk7213 on Character.AI's Chapter 11: it was a product of the $2.7B Google acquisition deal (founders pulled out; Noam Shazeer recently left Google for OpenAI) plus a free-user model that torched capital on inference. He says it is a siloed case, not the start of a bubble pop — demand for animated character AI in media and gaming remains huge, look at China.", "tweet_url": "https://x.com/cryptopunk7213/status/2110205173155107303", "images": ["https://pbs.twimg.com/media/HUj0ay2bEAIUsBp.jpg"], "type": "tweet", "created_at": "2026-10-14T03:04:53.000Z", "category": "AI"}, {"author": "cryptopunk7213", "summary": "cryptopunk7213, quoting an engineering blog saying merged code changes rose from ~2,500/day in May to 30,000+/day in September, bottlenecking human-scale dev infrastructure: humans are increasingly the blocker for AI scale (maths — not enough mathematicians to verify AI solutions, Navier-Stokes still under review; coding review; data-centre build-out), until AI automates those too.", "tweet_url": "https://x.com/cryptopunk7213/status/2110152298852909433", "images": [], "type": "tweet", "created_at": "2026-10-13T23:34:47.000Z", "category": "AI"}]}, {"cluster": "Tokenized Stocks, Token Buybacks and Crypto Capital Pools", "category": ["crypto", "regulation"], "items": [{"author": "Crypto_McKenna", "summary": "Crypto_McKenna, quoting a chart that ends 11 days after the SEC cleared tokenized US stocks to trade on-chain: this is the first glimpse of trillions of tokenized value — 'the real super cycle'.", "tweet_url": "https://x.com/Crypto_McKenna/status/2110062659433386007", "images": [], "type": "tweet", "created_at": "2026-10-13T17:38:35.000Z", "category": "crypto"}, {"author": "Delphi_Digital", "summary": "Delphi Digital clip: Ethena founder @gdog97_ argues tokenized stocks are a regulatory play, not a tech one — crypto enabling permissionless access, and you can build a large business on that regulatory arbitrage.", "tweet_url": "https://x.com/Delphi_Digital/status/2110188845719486737", "images": [], "type": "tweet", "created_at": "2026-10-14T02:00:00.000Z", "category": "regulation"}, {"author": "zeroxkyle", "summary": "zeroxkyle: tokens crossed the chasm from 'why does this need a token' to 'a token supercharges your business'. Hyperliquid proved a token can rival trad-equity valuations; the pendulum has swung SAFT -> SAFE with convert -> a new token<>equity model (Venice, Ethena and others) — 'a liquid funds' dream'. He also advises avoiding 'poisoned' pools (bundled scams, Gen-Z memes) and staying with high-quality allocators (HYPE).", "tweet_url": "https://x.com/zeroxkyle/status/2110202779012919362", "images": [], "type": "tweet", "created_at": "2026-10-14T02:55:22.000Z", "category": "crypto"}, {"author": "Zeneca", "summary": "Zeneca (thread): weighing an unnamed protocol's buyback announcement (image) — bull: 120M MAU, roadmap 4.0 revenue, buybacks incoming; bear: only new revenue funds buybacks. Cautiously optimistic if opportunistic buybacks and staking/lock mechanisms remove supply beyond circular reward-buyback loops.", "tweet_url": "https://x.com/Zeneca/status/2110101196409393561", "images": ["https://pbs.twimg.com/media/HUiV2k8aoAA-aHD.jpg"], "type": "thread", "created_at": "2026-10-13T20:11:43.000Z", "category": "crypto"}, {"author": "brian_armstrong", "summary": "brian_armstrong promotes Coinbase's Earn & Borrow stack on Base — any platform can now offer stablecoin yield and loans against crypto, a concept proven on Coinbase.", "tweet_url": "https://x.com/brian_armstrong/status/2110121697689116752", "images": [], "type": "tweet", "created_at": "2026-10-13T21:33:11.000Z", "category": "crypto"}]}, {"cluster": "Crypto Pullback — ETH ETF Outflows and Unlock Week", "category": ["crypto", "macro"], "items": [{"author": "thedefiedge", "summary": "thedefiedge: spot ETH ETFs have had 10 straight days of outflows (including $201.9M on Oct 6); the steady ETF buyer isn't showing so don't expect a quick rebound — but a good time to go shopping for solid tokens.", "tweet_url": "https://x.com/thedefiedge/status/2110049613205967332", "images": ["https://pbs.twimg.com/media/HUhmnYmX0AEo_6g.png"], "type": "tweet", "created_at": "2026-10-13T16:46:45.000Z", "category": "crypto"}, {"author": "stacy_muur", "summary": "stacy_muur lists this week's biggest unlocks (Tokenomist data): CRO $72M (2.4% of supply), ARB $18M, STRK $15M, DBR $12M (10.2%), YZY $8.4M (9.8%), SEI $3.9M, ZK $2.9M, W $1.5M, XCN $1.4M. Top three are 77% of the total.", "tweet_url": "https://x.com/stacy_muur/status/2110057233602273284", "images": ["https://pbs.twimg.com/media/HUht3wdbUAARvNc.jpg"], "type": "tweet", "created_at": "2026-10-13T17:17:02.000Z", "category": "crypto"}, {"author": "AndreasSteno", "summary": "AndreasSteno, replying to WarrenPies: there is a decent narrative that crypto sees inflows if AI fails — not sensible long-term, but may hold short-term.", "tweet_url": "https://x.com/AndreasSteno/status/2110084826732626250", "images": [], "type": "tweet", "created_at": "2026-10-13T19:06:40.000Z", "category": "crypto"}]}, {"cluster": "Singapore Haze — Air Purifiers Sold Out", "category": ["EM", "society"], "items": [{"author": "arthur0x", "summary": "arthur0x: Dyson is the only air-purifier brand still on sale in Singapore, online and in stores; all Chinese brands are sold out. Credits Singapore for attracting Sir James Dyson; replies say Dyson was able to restock while Chinese brands were not.", "tweet_url": "https://x.com/arthur0x/status/2110223877104357675", "images": ["https://pbs.twimg.com/media/HUkFbXvbAAANcl-.jpg"], "type": "thread", "created_at": "2026-10-14T04:19:13.000Z", "category": "EM"}, {"author": "zeroxkyle", "summary": "zeroxkyle: same story with a Singapore lens — all brands sold out (checked 5), 4-hour polyclinic waits, AQI 230 while CNA says the 'real PSI' is 150; replying to followers he says he is short the Singapore market.", "tweet_url": "https://x.com/zeroxkyle/status/2110213083520213102", "images": [], "type": "thread", "created_at": "2026-10-14T03:36:19.000Z", "category": "EM"}]}], "B_insights": [{"author": "balajis", "summary": "Balaji (long thread, quoting a Mamdani piece) sketches a 'Deng potential' reading of NYC's mayor: he will use leftism to tax and harass tribal enemies until they leave (the Curley Effect), consolidate power, then could pivot to a pragmatic, ruthless statism — possibly allied with a Chinese-style order and even Chinese funding as 'blues need a new patron if they lose DC' (parallels: Carney in Canada, Newsom greeting Xi). Key claims: the 'pied-a-terre' tax and California's billionaire tax exist to drive out opposition donors, creating one-party blue rule; term-limit workarounds (Putin/Medvedev style) are possible; Republicans will do likewise in FL/TX, so Democratic, Republican and Communist one-party states are 'inevitable', with competition shifting between states — his '1000-community' alternative. Highly speculative political opinion.", "tweet_url": "https://x.com/balajis/status/2110061863874732505", "images": [], "type": "thread", "created_at": "2026-10-13T17:35:26.000Z", "category": "society"}, {"author": "ASvanevik", "summary": "ASvanevik, 'K-shaped agency': agency is reflexive — it begets agency, and AI makes it easier for low-agency people to stay passive. Competent people doing the same work at lower effort are at risk; those aiming for 10x quality and speed win. 'Intelligence on tap, dirt cheap' — spend an hour with AI now and see how far it has moved in six months.", "tweet_url": "https://x.com/ASvanevik/status/2110178351696818337", "images": [], "type": "tweet", "created_at": "2026-10-14T01:18:18.000Z", "category": "AI"}, {"author": "nicbstme", "summary": "nicbstme (long): bets AI feeds will be the biggest form factor of 2027 — people know feeds and don't want to learn prompting; personal agents should serve a swipeable feed of things to know and do (reply, book), which also unlocks ads and makes AI free. Blockers: (1) context — few have email/calendar/chat history connected, (2) COGS — small models are getting good enough to refresh feeds cheaply.", "tweet_url": "https://x.com/nicbstme/status/2110211647440925027", "images": [], "type": "tweet", "created_at": "2026-10-14T03:30:37.000Z", "category": "AI"}, {"author": "nicbstme", "summary": "nicbstme argues 'taste is the last moat' is odd — tomorrow's models will have excellent taste plus customer telemetry, and in personalised software taste will be personal too (quoting a post that sees no compelling reason taste is a permanent LLM boundary). Also joked about January 2027, when human-written code is 'too dangerous for production'.", "tweet_url": "https://x.com/nicbstme/status/2110053113659117783", "images": [], "type": "tweet", "created_at": "2026-10-13T17:00:39.000Z", "category": "AI"}, {"author": "RaoulGMI", "summary": "RaoulGMI (thread + new write-up): most crypto goes to zero because of adoption — networks need persistent attention to run the usefulness-pulls-users loop, and few things keep it. His piece covers why most chains die and how to weed out survivors. In a reply: AI/robots create a new economic layer while humans keep consuming human experiences (travel, tours, sports, live entertainment).", "tweet_url": "https://x.com/RaoulGMI/status/2110144574169440390", "images": [], "type": "thread", "created_at": "2026-10-13T23:04:05.000Z", "category": "crypto"}, {"author": "patrick_oshag", "summary": "patrick_oshag clips Nubank's David Vélez: AI let him go from 1 to 20 direct reports and cut management layers from 10 to 5 — fewer layers means less message distortion, supported by a 'company brain' information system. Related clips: the founder's 'visceral' care makes him the right leader regardless of experience; and Jeremy Giffon's view that X is the 'global newspaper' where policy, capital and ventures are shaped — institutions must be 'timeline native'.", "tweet_url": "https://x.com/patrick_oshag/status/2110090753196048463", "images": [], "type": "tweet", "created_at": "2026-10-13T19:30:13.000Z", "category": "AI"}, {"author": "thedefiedge", "summary": "thedefiedge's 10 lessons for surviving the next crypto cycle: focus on 2-3 sectors, watch macro (rates, ETF flows), old bags won't be saved by new narratives, a good product is not a good token (where does the money go?), buybacks mean little against larger unlocks, 'cheap' on 5x revenue can vanish if revenue drops, define the holding horizon, and decide exits before entering.", "tweet_url": "https://x.com/thedefiedge/status/2110162977810735330", "images": [], "type": "tweet", "created_at": "2026-10-14T00:17:13.000Z", "category": "crypto"}, {"author": "santiagoroel", "summary": "santiagoroel (thread): bears feel clever calling the top, but calling 99 bear markets that never came is tolerated if you nail one. He would rather be invested in the bubble, ideally a big one with room to grow — his edge is willingness to hold for a very long time and let the index cover lapses in analysis.", "tweet_url": "https://x.com/santiagoroel/status/2110195739548684768", "images": [], "type": "thread", "created_at": "2026-10-14T02:27:24.000Z", "category": "positioning"}, {"author": "DCinvestor", "summary": "DCinvestor: the internet currently survives on people who knew each other before AI; new entrants will spend months interacting with AIs unknowingly, warping behaviour, and the old model 'will not hold up' under billions of bots. Earlier thread: Ethereum is dual-use technology — open will win like TCP/IP vs AOL; people stay on the 'AOL' they like until they all switch at once.", "tweet_url": "https://x.com/DCinvestor/status/2110174537740607904", "images": [], "type": "thread", "created_at": "2026-10-14T01:03:09.000Z", "category": "society"}, {"author": "udiWertheimer", "summary": "udiWertheimer on Apple: asks whether Apple still has ecosystem lock-in when an agent can port messages, photos, accounts and fake blue bubbles to Android; local agents may do this soon. Also: Apple has the best chips and software but won't sell chips to partners, so it must build niche devices itself (how MacBook Neo came about) or leave A18 potential unused.", "tweet_url": "https://x.com/udiWertheimer/status/2110048470199365984", "images": [], "type": "thread", "created_at": "2026-10-13T16:42:12.000Z", "category": "tech"}, {"author": "munster_gene", "summary": "munster_gene: if Apple gets Siri right, an AI subscription could be a high-margin services line — 100M payers at $20/month is about $24B a year, roughly 6% of revenue, and a low-end scenario. Source: Deepwater's Apple 'Fathom' with Doug Clinton.", "tweet_url": "https://x.com/munster_gene/status/2110080980958798215", "images": [], "type": "tweet", "created_at": "2026-10-13T18:51:23.000Z", "category": "tech"}, {"author": "marcvanderchijs", "summary": "marcvanderchijs says Opus 5.5 handles nearly all his tasks (including legal and building software) without hitting token limits — he no longer needs better models for 99% of tasks, so few will need frontier models; he wonders what that means for Anthropic/OpenAI training vs inference. 96% of Americans don't even pay for AI.", "tweet_url": "https://x.com/marcvanderchijs/status/2110215923613483239", "images": [], "type": "tweet", "created_at": "2026-10-14T03:47:36.000Z", "category": "AI"}, {"author": "RayDalio", "summary": "RayDalio re-promotes his latest article on 'How Countries Go Broke: The Big Cycle': since the June 2025 book the actual numbers and bond market have tracked his template and projections, so he lays out the linkages again.", "tweet_url": "https://x.com/RayDalio/status/2110078439252525300", "images": [], "type": "tweet", "created_at": "2026-10-13T18:41:17.000Z", "category": "macro"}, {"author": "ESYudkowsky", "summary": "ESYudkowsky: Nate Soares is a recommender in the Lightcone Commons funding round closing Oct 23 and could usefully direct an extra $50-150M; Yudkowsky thinks he has ~$10M more room, and puts the first $5M to Lightcone Infrastructure above everything else he would fund. Anti-extinction work remains far less funded than the AI industry; there is a December round planned.", "tweet_url": "https://x.com/ESYudkowsky/status/2110222781526999164", "images": [], "type": "thread", "created_at": "2026-10-14T04:14:51.000Z", "category": "AI"}, {"author": "abcampbell", "summary": "abcampbell: (1) arbitrating the Ed Zitron vs Gavin Baker dispute over AI debt — Baker says an MOU figure is quoted as if it were debt, which the shifting notional shows it isn't, but there is ambiguity about balance-sheet vs off-balance-sheet debt; (2) asks Grok to compare a credit spread with equity vol using a Merton model and to construct an arbitrage for a $1bn fund at 16 vol with this as 20% of risk; (3) 'normalize industrial policy' while noting currency policies are far apart.", "tweet_url": "https://x.com/abcampbell/status/2110173496978612620", "images": [], "type": "thread", "created_at": "2026-10-14T00:59:01.000Z", "category": "macro"}, {"author": "hosseeb", "summary": "hosseeb's finding: measuring minute-by-minute volatility in prediction-market odds, F1 // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
