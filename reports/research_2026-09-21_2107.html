    html += '<button class="pill' + (isActive ? ' active' : '') + '" style="' + (isActive ? 'background:' + color + ';border-color:' + color + ';' : '') + '" onclick="setCat(\'' + cat + '\')">' + cat + ' (' + catCounts[cat] + ')</button>';
  });
  catBar.innerHTML = html;

  var urgCounts = { act: 0, deep: 0, watch: 0 };
  ITEMS.forEach(function(i) { urgCounts[i.urgency]++; });
  var urgBar = document.getElementById('urgBar');
  var uhtml = '<button class="pill' + (activeUrg === 'all' ? ' active' : '') + '" style="' + (activeUrg === 'all' ? 'background:#333;' : '') + '" onclick="setUrg(\'all\')">All</button>';
  ['act', 'deep', 'watch'].forEach(function(u) {
    var isActive = activeUrg === u;
    uhtml += '<button class="pill' + (isActive ? ' active' : '') + '" style="' + (isActive ? 'background:#333;' : '') + '" onclick="setUrg(\'' + u + '\')">' + URG_META[u].emoji + ' ' + URG_META[u].label + ' (' + urgCounts[u] + ')</button>';
  });
  urgBar.innerHTML = uhtml;
}

function renderCard(item) {
  var color = CAT_COLORS[item.cat] || '#888';
  var urg = URG_META[item.urgency];
  var chartEmoji = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');
  var html = '<div class="card" id="card-' + item.id + '">';
  html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
  html += '<span class="idx">' + String(item.id).padStart(2, '0') + '</span>';
  html += '<span>' + urg.emoji + '</span>';
  html += '<span class="badge" style="background:' + color + '">' + item.source + '</span>';
  html += '<span class="tag">' + item.cat + '</span>';
  if (chartEmoji) html += '<span class="chart-emoji">' + chartEmoji + '</span>';
  html += '<span class="title-text">' + item.title + '</span>';
  html += '<span class="chevron">▶</span>';
  html += '</div>';
  html += '<div class="card-body">';
  html += '<div class="section-label">The Idea</div>';
  html += '<div class="idea-text">' + item.idea + '</div>';
  html += '<div class="section-label">My Angle</div>';
  html += '<div class="angle-box" style="border-left:2px solid ' + color + '; background:' + color + '14;">' + item.angle + '</div>';
  html += '<div class="section-label">Tweets</div>';
  html += '<div class="tweets">';
  html += '<div class="tweet-box"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  html += '<div class="tweet-box"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
  html += '</div>';
  html += '<div class="section-label">Charts</div>';
  html += '<div class="chart-box' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '🔥 ' : '') + item.charts.desc + '</div>';
  html += '<div class="link-row"><a href="' + item.link + '" target="_blank">↗ Read full article</a></div>';
  html += '</div>';
  html += '</div>';
  return html;
}

function render(expandMatching) {
  buildFilterBars();
  var filtered = ITEMS.filter(function(i) {
    if (activeSrc && i.source.indexOf(activeSrc) === -1) return false;
    if (activeCat !== 'all' && i.cat !== activeCat) return false;
    if (activeUrg !== 'all' && i.urgency !== activeUrg) return false;
    return true;
  });
  var cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = filtered.map(renderCard).join('');
  document.getElementById('emptyMsg').style.display = filtered.length === 0 ? 'block' : 'none';
  if (expandMatching) {
    filtered.forEach(function(i) {
      var el = document.getElementById('card-' + i.id);
      if (el) el.classList.add('open');
    });
  }
}

function renderReport() {
  var html = '';
  html += '<strong>Window:</strong> ' + META.windowStart + ' → ' + META.windowEnd + '<br>';
  html += '<strong>Emails in window:</strong> ' + META.emailsInWindow + ' &middot; <strong>Read:</strong> ' + META.emailsRead + ' &middot; <strong>Items extracted:</strong> ' + META.itemsExtracted;
  html += '<div class="section-label" style="margin-top:12px;">Included Sources</div>';
  html += '<ul style="padding-left:18px; margin:4px 0;">';
  META.includedSources.forEach(function(s) {
    html += '<li><span class="src-link" onclick="filterBySrc(\'' + s.name.replace(/'/g, "\\'") + '\')">' + s.name + '</span> — ' + s.count + ' item' + (s.count > 1 ? 's' : '') + '</li>';
  });
  html += '</ul>';
  html += '<div class="section-label">Skipped Sources</div>';
  html += '<ul style="padding-left:18px; margin:4px 0;">';
  META.skippedSources.forEach(function(s) {
    html += '<li class="skip-item"><strong>' + s.name + '</strong> — ' + s.reason + '</li>';
  });
  html += '</ul>';
  document.getElementById('reportBody').innerHTML = html;
}

document.getElementById('headerMeta').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items';
render();
renderReport();
</script>
</body>
</html>
