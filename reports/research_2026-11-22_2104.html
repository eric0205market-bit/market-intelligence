var COLORS={macro:"#e24b4a",credit:"#378add",positioning:"#ef9f27","AI/infra":"#1d9e75",crypto:"#7f77dd",geopolitics:"#d85a30",energy:"#f97316",tech:"#06b6d4",gold:"#d4a017",culture:"#ec4899",labor:"#8b5cf6",regulation:"#64748b",science:"#14b8a6",venture:"#84cc16"};
var UEMO={act:"🔴",deep:"🔵",watch:"🟡"};
var state={cat:"all",urg:"all",src:null};
function col(c){return COLORS[c]||"#888";}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function toggle(id){document.getElementById('c'+id).classList.toggle('open');}
function renderBars(){
  var cats={};ITEMS.forEach(function(i){cats[i.cat]=(cats[i.cat]||0)+1;});
  var h='<span class="pill'+(state.cat==="all"?' active':'')+'" style="'+(state.cat==="all"?'background:#333;border-color:#333':'')+'" onclick="setCat(\'all\')">All '+ITEMS.length+'</span>';
  Object.keys(cats).forEach(function(c){var a=state.cat===c;h+='<span class="pill'+(a?' active':'')+'" style="'+(a?'background:'+col(c)+';border-color:'+col(c):'')+'" onclick="setCat(\''+c+'\')">'+esc(c)+' '+cats[c]+'</span>';});
  document.getElementById('catbar').innerHTML=h;
  var u={act:0,deep:0,watch:0};ITEMS.forEach(function(i){u[i.urgency]++;});
  var labels=[["all","All",ITEMS.length],["act","🔴 Act Now",u.act],["deep","🔵 Deep",u.deep],["watch","🟡 Watch",u.watch]];
  var g='';labels.forEach(function(l){var a=state.urg===l[0];g+='<span class="pill'+(a?' active':'')+'" style="'+(a?'background:#555;border-color:#555':'')+'" onclick="setUrg(\''+l[0]+'\')">'+l[1]+' '+l[2]+'</span>';});
  document.getElementById('urgbar').innerHTML=g;
}
function cardHTML(item){
  var c=col(item.cat),ch=item.charts||{count:0};
  var icon=ch.hot?' 🔥':(ch.count>0?' 📊':'');
  var h='<div class="card" id="c'+item.id+'"><div class="hd" onclick="toggle('+item.id+')">';
  h+='<span class="num">#'+item.id+'</span><span>'+UEMO[item.urgency]+'</span><span class="src" style="background:'+c+'">'+esc(item.source)+'</span><span class="cat">'+esc(item.cat)+'</span>'+icon+'<span class="ttl">'+esc(item.title)+'</span></div>';
  h+='<div class="bd"><div class="lbl">the idea</div><div class="idea">'+esc(item.idea)+'</div>';
  h+='<div class="lbl">my angle</div><div class="angle" style="border-color:'+c+';background:'+c+'14">'+esc(item.angle)+'</div>';
  h+='<div class="tw"><div class="twb"><div class="twl" style="color:#378add">TWEET A <button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div><div class="twt">'+esc(item.tweetA)+'</div></div>';
  h+='<div class="twb"><div class="twl" style="color:#7f77dd">TWEET B <button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div><div class="twt">'+esc(item.tweetB)+'</div></div></div>';
  if(ch.count>0||ch.desc){h+='<div class="chart'+(ch.hot?' hot':'')+'">'+(ch.hot?'🔥 CHART WORTH SAVING · ':'📊 ')+ch.count+' chart(s) — '+esc(ch.desc||'')+'</div>';}
  h+='<a class="lnk" href="'+esc(item.link)+'" target="_blank" rel="noopener">↗ Read full article</a></div></div>';
  return h;
}
function renderCards(){
  var list=ITEMS.filter(function(i){
    if(state.src) return i.source.indexOf(state.src)>=0;
    return (state.cat==="all"||i.cat===state.cat)&&(state.urg==="all"||i.urgency===state.urg);});
  document.getElementById('cards').innerHTML=list.length?list.map(cardHTML).join(''):'<div class="empty">No items match.</div>';
  if(state.src){list.forEach(function(i){document.getElementById('c'+i.id).classList.add('open');});}
}
function setCat(c){state.cat=c;state.src=null;renderBars();renderCards();}
function setUrg(u){state.urg=u;state.src=null;renderBars();renderCards();}
function filterBySrc(name){state.src=name;state.cat="all";state.urg="all";renderBars();renderCards();window.scrollTo(0,0);}
function renderReport(){
  var h='<p><b>Window:</b> '+esc(META.windowStart)+' to '+esc(META.windowEnd)+'. Emails outside this window were not processed.</p>';
  h+='<p><b>Totals:</b> '+META.emailsInWindow+' emails in window · '+META.emailsRead+' read · '+META.itemsExtracted+' items extracted</p>';
  h+='<div class="lbl">included sources (click to filter)</div><table>';
  META.includedSources.forEach(function(s,idx){h+='<tr><td><span class="srcl" onclick="filterBySrc(META.includedSources['+idx+'].name)">'+esc(s.name)+'</span></td><td>'+s.items+' items</td></tr>';});
  h+='</table><div class="lbl">skipped</div><table>';
  META.skippedSources.forEach(function(s){h+='<tr><td>'+esc(s.name)+'</td><td>'+esc(s.reason)+'</td></tr>';});
  h+='</table>';if(META.notes)h+='<p style="font-size:12px;color:#777">'+esc(META.notes)+'</p>';
  document.getElementById('repbody').innerHTML=h;
}
function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';
  renderBars();renderCards();renderReport();
}
