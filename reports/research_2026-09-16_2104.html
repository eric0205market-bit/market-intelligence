const META = {
  date: "2026-09-16",
  time: "21:04 CEST",
  windowStart: "2026-09-16 15:04 CEST",
  windowEnd: "2026-09-16 21:04 CEST",
  emailsInWindow: 16,
  emailsRead: 16,
  itemsExtracted: 16,
  includedSources: [
    { name: "Trading Mindset and Data (TMAD)", count: 1 },
    { name: "Ecoinometrics", count: 1 },
    { name: "Peter Boockvar", count: 3 },
    { name: "The Dark Side of the Boom", count: 2 },
    { name: "Citrini Research", count: 2 },
    { name: "AI Street (Matt Robinson)", count: 1 },
    { name: "Bespoke Investment Group", count: 2 },
    { name: "This Week in AI", count: 1 },
    { name: "Robert Sinn", count: 1 },
    { name: "SixSigmaCapital", count: 1 },
    { name: "Young & Calculated", count: 1 }
  ],
  skippedSources: [
    { name: "Macro Mornings", reason: "Pure subscription sales pitch ('3 seats left'), zero analytical content" },
    { name: "SixSigmaCapital (Q&A thread)", reason: "Empty prompt ('anybody have questions'), no content" },
    { name: "McKinsey & Company", reason: "Navigation/marketing email with one generic teaser line, no analysis" }
  ]
};

const CAT_COLORS = {
  macro: "#e24b4a", credit: "#378add", positioning: "#ef9f27", aiinfra: "#1d9e75",
  crypto: "#7f77dd", geopolitics: "#d85a30", energy: "#f97316", tech: "#06b6d4",
  gold: "#d4a017", culture: "#ec4899", labor: "#8b5cf6", regulation: "#64748b",
  science: "#14b8a6", venture: "#84cc16", mining: "#92400e"
};
const CAT_LABELS = {
  macro: "Macro", credit: "Credit", positioning: "Positioning", aiinfra: "AI/Infra",
  crypto: "Crypto", geopolitics: "Geopolitics", energy: "Energy", tech: "Tech",
  gold: "Gold", culture: "Culture", labor: "Labor", regulation: "Regulation",
  science: "Science", venture: "Venture", mining: "Mining"
};
const URG_LABELS = { act: "🔴 Act Now", deep: "🔵 Deep", watch: "🟡 Watch" };
const URG_EMOJI = { act: "🔴", deep: "🔵", watch: "🟡" };

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function hexToRgba(hex, a) {
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return "rgba(" + r + "," + g + "," + b + "," + a + ")";
}

function buildFilters() {
  var catCounts = {};
  ITEMS.forEach(function(i){ catCounts[i.cat] = (catCounts[i.cat]||0) + 1; });
  var catRow = document.getElementById("catFilters");
  var allBtn = '<button class="pill' + (activeCat==="all" ? " active" : "") + '" style="' + (activeCat==="all" ? "background:#333;" : "") + '" onclick="setCat(\'all\')">All <span class="count-tag">' + ITEMS.length + '</span></button>';
  var html = allBtn;
  Object.keys(CAT_LABELS).forEach(function(c){
    if (!catCounts[c]) return;
    var isActive = activeCat === c;
    var style = isActive ? "background:" + CAT_COLORS[c] + ";" : "";
    html += '<button class="pill' + (isActive ? " active" : "") + '" style="' + style + '" onclick="setCat(\'' + c + '\')">' + CAT_LABELS[c] + ' <span class="count-tag">' + catCounts[c] + '</span></button>';
  });
  catRow.innerHTML = html;

  var urgCounts = {};
  ITEMS.forEach(function(i){ urgCounts[i.urgency] = (urgCounts[i.urgency]||0) + 1; });
  var urgRow = document.getElementById("urgFilters");
  var uHtml = '<button class="pill' + (activeUrg==="all" ? " active" : "") + '" style="' + (activeUrg==="all" ? "background:#333;" : "") + '" onclick="setUrg(\'all\')">All <span class="count-tag">' + ITEMS.length + '</span></button>';
  ["act","deep","watch"].forEach(function(u){
    if (!urgCounts[u]) return;
    var isActive = activeUrg === u;
    var style = isActive ? "background:#555;" : "";
    uHtml += '<button class="pill' + (isActive ? " active" : "") + '" style="' + style + '" onclick="setUrg(\'' + u + '\')">' + URG_LABELS[u] + ' <span class="count-tag">' + urgCounts[u] + '</span></button>';
  });
  urgRow.innerHTML = uHtml;
}

function setCat(c) {
  activeCat = c;
  activeSrc = null;
  buildFilters();
  renderCards();
}
function setUrg(u) {
  activeUrg = u;
  activeSrc = null;
  buildFilters();
  renderCards();
}
function filterBySrc(name) {
  activeSrc = name;
  activeCat = "all";
  activeUrg = "all";
  buildFilters();
  renderCards(true);
}

function renderCards(expandMatches) {
  var container = document.getElementById("cards");
  var html = "";
  ITEMS.forEach(function(item, idx) {
    var visible = true;
    if (activeCat !== "all" && item.cat !== activeCat) visible = false;
    if (activeUrg !== "all" && item.urgency !== activeUrg) visible = false;
    if (activeSrc && item.source.indexOf(activeSrc) === -1) visible = false;
    if (!visible) return;

    var color = CAT_COLORS[item.cat] || "#999";
    var chartFlag = "";
    if (item.charts && item.charts.hot) chartFlag = '<span class="chart-flag">🔥</span>';
    else if (item.charts && item.charts.count > 0) chartFlag = '<span class="chart-flag">📊</span>';

    var openClass = (expandMatches && (activeSrc || activeCat !== "all" || activeUrg !== "all")) ? " open" : "";

    html += '<div class="card' + openClass + '" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">' + String(idx+1).padStart(2,'0') + '</span>';
    html += '<span class="urg-emoji">' + URG_EMOJI[item.urgency] + '</span>';
    html += '<span class="src-badge" style="background:' + color + '">' + item.source.split(' / ')[0].split(' (')[0] + '</span>';
    html += '<span class="cat-tag">' + CAT_LABELS[item.cat] + '</span>';
    html += chartFlag;
    html += '<span class="card-title">' + item.title + '</span>';
    html += '<span class="chevron">▾</span>';
    html += '</div>';

    html += '<div class="card-body">';
    html += '<div class="section-label">The Idea</div><div class="idea-text">' + item.idea + '</div>';
    html += '<div class="section-label">My Angle</div><div class="angle-box" style="border-left:2px solid ' + color + '; background:' + hexToRgba(color,0.08) + ';">' + item.angle + '</div>';
    html += '<div class="tweets-row">';
    html += '<div class="tweet-box"><div class="tlabel" style="color:#378add;">TWEET A <button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div><p>' + item.tweetA + '</p></div>';
    html += '<div class="tweet-box"><div class="tlabel" style="color:#7f77dd;">TWEET B <button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div><p>' + item.tweetB + '</p></div>';
    html += '</div>';

    if (item.charts && item.charts.count > 0) {
      html += '<div class="chart-block' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '🔥 ' : '📊 ') + item.charts.count + ' chart(s) — ' + item.charts.desc + '</div>';
    }
    html += '<a class="read-link" style="color:' + color + '" href="' + item.link + '" target="_blank">↗ Read full article</a>';
    html += '</div>'; // card-body
    html += '</div>'; // card
  });
  if (!html) html = '<p style="color:#999;text-align:center;padding:40px 0;">No items match this filter.</p>';
  container.innerHTML = html;
}

function toggleCard(id) {
  var el = document.getElementById('card-' + id);
  if (el) el.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function buildReport() {
  document.getElementById("headerMeta").textContent =
    META.date + " · " + META.time + " · " + META.itemsExtracted + " items from " + META.emailsRead + " emails";

  var body = "";
  body += "<p><strong>Window:</strong> " + META.windowStart + " to " + META.windowEnd + ". Emails outside this window were not processed.</p>";
  body += "<p>Emails in window: " + META.emailsInWindow + " &middot; Read: " + META.emailsRead + " &middot; Items extracted: " + META.itemsExtracted + "</p>";
  body += "<h4>Included Sources</h4>";
  META.includedSources.forEach(function(s) {
    body += '<div class="skip-item"><button class="src-link" onclick="filterBySrc(\'' + s.name.replace(/'/g, "\\'") + '\')">' + s.name + '</button> — ' + s.count + ' item' + (s.count > 1 ? 's' : '') + '</div>';
  });
  body += "<h4>Skipped Sources</h4>";
  META.skippedSources.forEach(function(s) {
    body += '<div class="skip-item">' + s.name + ' — ' + s.reason + '</div>';
  });
  document.getElementById("reportBody").innerHTML = body;
}

document.getElementById("reportHeader").addEventListener("click", function() {
  document.getElementById("reportCard").classList.toggle("open");
  document.getElementById("reportChevron").textContent =
    document.getElementById("reportCard").classList.contains("open") ? "▴" : "▾";
});

buildFilters();
renderCards();
buildReport();
</script>
</body>
</html>
