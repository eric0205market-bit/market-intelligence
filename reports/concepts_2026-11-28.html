em as sticky.", "quote": null, "locator": "The proposed tariffs, released by the Office", "quote_verified": false}]}, {"theme": "Targets, leverage and retaliation", "insights": [{"claim": "The White House sees the new Section 301 tariffs as leverage to extract further trade concessions from China, Vietnam and India; China is the principal target, followed by Vietnam, India and other Asian emerging economies.", "speaker": "Gavekal Research", "type": "thesis", "entities": ["China", "Vietnam", "India", "White House"], "conviction": "medium", "so_what": "Asian EM exporters face renewed tariff/negotiation risk; watch concession headlines from Hanoi and New Delhi.", "quote": null, "locator": "But the White House sees the tariffs as leverage", "quote_verified": false}, {"claim": "Although markets shrugged off the tariff proposal, China and Brazil both raised the prospect of retaliation, so trading partners cannot afford the same tariff fatigue investors show.", "speaker": "Gavekal Research", "type": "contrarian", "entities": ["China", "Brazil", "retaliation"], "conviction": "medium", "so_what": "Retaliation risk is under-priced relative to market complacency.", "quote": null, "locator": "Financial markets may have succumbed", "quote_verified": false}, {"claim": "Washington intends to respect tariff ceilings in bilateral deals, capping the EU's tariff at 15% (with an option to raise to 20%), which should avert a renewed US-EU tariff war.", "speaker": "Gavekal Research", "type": "prediction", "entities": ["European Union", "United States", "tariff ceilings"], "conviction": "medium", "so_what": "Reduces tail risk for EU exporters; the 20% option is the residual risk to watch.", "quote": null, "locator": "Washington intends to respect tariff ceilings", "quote_verified": false}]}], "insight_total": 6, "top_entities": ["Section 301", "USTR", "Goldman Sachs", "China", "Brazil", "Vietnam", "India", "European Union", "Trump"], "source_meta": {"author": "", "word_count": 234, "paywalled": false}}, {"record_id": "f52178d5e3cfc024", "source_type": "concepts", "source_name": "Gavekal Research", "source_url": "https://research.gavekal.com/teaser/why-unwritten-rules-die-hard/", "title": "Why ‘Unwritten Rules’ Die Hard", "published_date": "2026-11-27", "language": "en", "processed_at": "2026-11-28T11:11:33Z", "processor": "claude-code-sub-opus", "tags": ["Geopolitics", "Macro"], "gist": "Gavekal Dragonomics argues the unifying thread of Xi Jinping's recent campaigns is a crackdown on the Communist Party's 'unwritten rules' — informal favor-trading, patronage and bending of directives — via anti-corruption and 'correct view of political performance' campaigns that also centralize authority against lower-level officials. (Teaser excerpt only.)", "themes": [{"theme": "Xi's war on 'unwritten rules'", "insights": [{"claim": "The common theme across Xi Jinping's recent priorities and campaigns is a crackdown on the Communist Party's 'unwritten rules' — informal practices for trading favors, finding political patrons and bending directives from above.", "speaker": "Gavekal Research", "type": "framework", "entities": ["Xi Jinping", "Communist Party of China"], "conviction": "medium", "so_what": "Read Chinese policy campaigns as a governance-discipline project, not isolated measures.", "quote": null, "locator": "The theme that ties together", "quote_verified": false}, {"claim": "Xi has described the Party's unwritten rules as a hidden but pervasive problem, calling them a deep-rooted cancer that corrupts officials and poisons Party culture.", "speaker": "Gavekal Research", "type": "anecdote", "entities": ["Xi Jinping"], "conviction": "high", "so_what": "Signals the crackdown is high priority and likely persistent.", "quote": "invisible yet everywhere… and have become a deep-rooted cancer that corrupts Party members and officials", "locator": "According to Xi, these cynical behaviors", "quote_verified": true}, {"claim": "China's anti-corruption campaign targets accepting banquets and gifts for favors, helping protégés win promotions and improperly intervening in government operations.", "speaker": "Gavekal Research", "type": "data_point", "entities": ["China anti-corruption campaign"], "conviction": "high", "so_what": "Ongoing anti-graft pressure can dampen official consumption and risk-taking by local officials.", "quote": null, "locator": "The anti-corruption campaign targets practices", "quote_verified": false}, {"claim": "A separate 2026 Chinese campaign on 'taking the correct view of political performance' targets officials who climb the hierarchy via self-serving investments in wasteful, leader-impressing projects.", "speaker": "Gavekal Research", "type": "causal", "entities": ["China local governments", "political performance campaign"], "conviction": "medium", "so_what": "Curbing vanity projects implies less local-government-driven investment — a headwind for infrastructure/construction demand.", "quote": null, "locator": "A separate campaign this year", "quote_verified": false}, {"claim": "Both Chinese campaigns aim to centralize decision-making authority by targeting lower-level officials who fail to implement the leadership's instructions.", "speaker": "Gavekal Research", "type": "thesis", "entities": ["Xi Jinping", "China centralization"], "conviction": "medium", "so_what": "More centralized, top-down implementation: policy signals from Beijing should transmit more directly, but local initiative may weaken.", "quote": null, "locator": "And both campaigns aim to centralize", "quote_verified": false}]}], "insight_total": 5, "top_entities": ["Xi Jinping", "Communist Party", "China", "anti-corruption campaign", "local officials"], "source_meta": {"author": "", "word_count": 209, "paywalled": false}}, {"record_id": "fed16a1b47a783ae", "source_type": "concepts", "source_name": "Packy McCormick / Not Boring", "source_url": "https://www.notboring.co/p/weekly-dose-of-optimism-221", "title": "Weekly Dose of Optimism #221", "published_date": "2026-11-27", "language": "en", "processed_at": "2026-11-28T11:11:33Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech", "Energy", "Society"], "gist": "Packy McCormick's Thanksgiving Dose catalogs a week of claimed breakthroughs: Levent Alpöge and an unreleased Claude producing a Lean-verified proof of the (Generalized) Riemann Hypothesis, AI-assisted quantum-gravity work, an FCC authorization for SpaceX's 1M-satellite orbital data-center constellation, Neuralink's pivotal trial, Senate passage of the BAAJA permitting reform, Hadrian's SF factory, and the first patient living a year with a pig kidney.", "themes": [{"theme": "AI-driven mathematics and physics", "insights": [{"claim": "Anthropic mathematician Levent Alpöge released a 17-million-line Lean formal proof of the Riemann Hypothesis and the Generalized Riemann Hypothesis for Dirichlet L-functions, developed over six weeks with an unreleased frontier version of Claude.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Levent Alpöge", "Anthropic", "Claude", "Lean", "Riemann Hypothesis"], "conviction": "high", "so_what": "Frontier labs' AI can now produce verified results on century-old problems — a step-change signal for AI capability valuations.", "quote": null, "locator": "(1) Alpöge & Claude Prove", "quote_verified": false}, {"claim": "Within 24 hours the Lean FRO and Mathlib Initiative certified both the theorem statement and Alpöge's proof as valid after independent formally verified proof checkers ran it.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Lean FRO", "Mathlib"], "conviction": "high", "so_what": "Machine verification lets AI-generated results be trusted at speed — formal verification tools gain strategic importance.", "quote": "We have full confidence that Alpöge's proof of the Riemann Hypothesis is correct.", "locator": "Within 24 hours, on Saturday afternoon", "quote_verified": true}, {"claim": "No human can yet read Alpöge's Riemann proof: there is no natural-language paper, only machine-verified code, which Terence Tao said appears to draw on the full power of the Langlands program and arithmetic geometry.", "speaker": "Packy McCormick", "type": "framework", "entities": ["Terence Tao", "Langlands program", "Lean"], "conviction": "high", "so_what": "'Centaur math' — verification precedes human understanding; a new paradigm for AI-assisted research.", "quote": null, "locator": "There was a bit of controversy", "quote_verified": false}, {"claim": "Steven Strogatz described the Alpöge–Claude collaboration as an AI jockey riding a fast AI horse, which McCormick labels 'Centaur Math.'", "speaker": "Packy McCormick", "type": "framework", "entities": ["Steven Strogatz", "Claude"], "conviction": "medium", "so_what": "Human+AI pairing is the productive unit in frontier research.", "quote": "a very skilled AI jockey riding a very fast AI horse.", "locator": "Steven Strogatz called the duo", "quote_verified": true}, {"claim": "Both Anthropic and OpenAI posted AI-generated proofs of VP ≠ VNP, the algebraic cousin of P vs NP, and McCormick relays rumors the labs may have cracked P vs NP too — which could invalidate much cryptography if P = NP.", "speaker": "Packy McCormick", "type": "prediction", "entities": ["Anthropic", "OpenAI", "VP ≠ VNP", "P vs NP", "cryptography"], "conviction": "exploratory", "so_what": "Rumor-level but tail risk to cryptographic assumptions (crypto assets, security vendors) worth monitoring.", "quote": null, "locator": "Oh, and both Anthropic and OpenAI", "quote_verified": false}, {"claim": "OpenAI's Ven Chandrasekaran proposed an AI-assisted, background-independent quantization of vacuum general relativity in 4D that recovers Bekenstein-Hawking entropy and semiclassical Einstein equations, though it covers only vacuum and still needs peer checking.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Ven Chandrasekaran", "OpenAI", "quantum gravity", "roon"], "conviction": "low", "so_what": "Another datapoint of AI accelerating frontier science; not yet a Theory of Everything.", "quote": null, "locator": "lol. It’s Thanksgiving week", "quote_verified": false}]}, {"theme": "Elonverse: SpaceX, Starmind, Neuralink", "insights": [{"claim": "Elon Musk said every US child will receive two SpaceX shares (one from SpaceX, one from him), plus one more per child per year from him, via Trump Accounts.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Elon Musk", "SpaceX", "Trump Accounts"], "conviction": "high", "so_what": "Broadens retail ownership of SpaceX; Trump Accounts become a distribution channel for private equity.", "quote": null, "locator": "SpaceX and Elon are Giving Every American Kid", "quote_verified": false}, {"claim": "McCormick estimates that with ~6.4B shares controlled by Musk and ~72M US kids, Musk's annual share gifts would transfer more than 10% of his SpaceX ownership to American children within a decade.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Elon Musk", "SpaceX"], "conviction": "medium", "so_what": "Gradual dilution of Musk's personal SpaceX stake via gifting.", "quote": null, "locator": "He currently controls about 6.4 billion shares", "quote_verified": false}, {"claim": "The FCC authorized SpaceX to deploy 1 million satellites for its Starmind orbital data-center constellation — the first US authorization for a constellation of data centers in space.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["FCC", "SpaceX", "Starmind", "orbital data centers"], "conviction": "high", "so_what": "Regulatory green light for space-based compute; execution hinges on building satellites and Starship cadence.", "quote": null, "locator": "FCC Authorizes SpaceX to Deploy 1 Million", "quote_verified": false}, {"claim": "McCormick states Starship became fully reusable last week, which is the launch capability SpaceX needs to send up a million data-center satellites.", "speaker": "Packy McCormick", "type": "causal", "entities": ["Starship", "SpaceX"], "conviction": "medium", "so_what": "Reusable heavy lift is the cost unlock behind orbital compute economics.", "quote": null, "locator": "Now they just have to make a million DC satellites", "quote_verified": false}, {"claim": "The FDA approved Neuralink's LINK study, described as the first US pivotal trial for an implantable brain-computer interface, with ALS patients potentially eligible.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Neuralink", "FDA", "brain-computer interface", "ALS"], "conviction": "high", "so_what": "BCI moves to pivotal-trial stage — commercialization path for neurotech is opening.", "quote": null, "locator": "Neuralink Gets FDA Approval to Launch LINK", "quote_verified": false}]}, {"theme": "Permitting reform and US building", "insights": [{"claim": "The US Senate passed the Bipartisan American Affordability and Jobs Act of 2026 (BAAJA, H.R. 2347) 62–33, streamlining NEPA, Clean Water Act and Endangered Species Act reviews; it now goes to the House.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["US Senate", "BAAJA", "NEPA"], "conviction": "high", "so_what": "If enacted, faster permitting is a tailwind for transmission, nuclear, energy and data-center developers.", "quote": null, "locator": "(2) U.S. Senate Passes Bipartisan Permitting Reform", "quote_verified": false}, {"claim": "BAAJA includes dedicated provisions to accelerate electric transmission lines, nuclear licensing, energy permitting broadly and data-center projects.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["BAAJA", "transmission", "nuclear energy", "data centers"], "conviction": "high", "so_what": "Directly relevant to grid, nuclear and AI-infrastructure equities.", "quote": null, "locator": "It includes dedicated provisions", "quote_verified": false}, {"claim": "McCormick argues scientific and energy breakthroughs are wasted if turning them into physical infrastructure takes a decade, making permitting the binding constraint on progress.", "speaker": "Packy McCormick", "type": "thesis", "entities": ["permitting reform", "infrastructure"], "conviction": "high", "so_what": "Physical deployment speed, not invention, is the bottleneck — favour builders that benefit from reform.", "quote": null, "locator": "We can make all of the breakthroughs we want", "quote_verified": false}, {"claim": "Hadrian, a Not Boring Capital portfolio company, plans to open a 1 million sq ft development factory and engineering campus in San Francisco in January, after raising $1.37B at a $7.87B valuation.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Hadrian", "San Francisco", "Not Boring Capital"], "conviction": "medium", "so_what": "Reshoring/defense-manufacturing startups command large valuations; AI-enabled factories locating near AI talent. (Author has a conflict: portfolio company.)", "quote": null, "locator": "(3) Hadrian is Opening a Factory", "quote_verified": false}, {"claim": "Hadrian pairs humans with AI-enabled software to automate precision-parts manufacturing and capture tribal knowledge from skilled workers.", "speaker": "Packy McCormick", "type": "framework", "entities": ["Hadrian", "AI", "manufacturing"], "conviction": "medium", "so_what": "Human-in-the-loop automation is the model for reindustrialization plays.", "quote": null, "locator": "AI (or SI, whatever) helps them automate", "quote_verified": false}]}, {"theme": "AI x bio and xenotransplantation", "insights": [{"claim": "Capable, founded by Isaak Freeman, emerged from stealth with a vertically integrated, AI-enabled autonomous preclinical lab, starting with peptides and aiming at endurance, longevity, less sleep and stronger bones.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Capable", "Isaak Freeman", "peptides"], "conviction": "exploratory", "so_what": "Early-stage AI x bio; vertical integration (run experiments, generate data) is the thesis — no results yet.", "quote": null, "locator": "(4) Capable Comes Out of Stealth", "quote_verified": false}, {"claim": "Molly Falco became the first person to live a full year off dialysis with a genetically engineered pig kidney from eGenesis carrying 69 edits, transplanted at Massachusetts General Hospital.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["eGenesis", "Mass General Brigham", "xenotransplantation"], "conviction": "high", "so_what": "Xenotransplantation crossing durability milestones de-risks the field.", "quote": null, "locator": "(5) Patient Marks One Year Living With Pig Kidney", "quote_verified": false}, {"claim": "Of six pig-kidney recipients since 2024, three currently have functioning organs; eGenesis will launch formal trials in 33 patients in Q1 next year, and United Therapeutics performed its first pig thymo-kidney transplant and has FDA clearance for a pig heart trial.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["eGenesis", "United Therapeutics", "FDA"], "conviction": "high", "so_what": "United Therapeutics (UTHR) is the listed exposure to xenotransplant progress; competitive field forming.", "quote": null, "locator": "The pig kidney transplants are going to keep going", "quote_verified": false}, {"claim": "More than 500,000 Americans rely on dialysis (five-year mortality ~55%), with over 90,000 on the kidney waitlist and twelve dying daily awaiting a kidney — the addressable need for xenotransplants.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["dialysis", "kidney transplant"], "conviction": "high", "so_what": "Large TAM; successful xenotransplants threaten the dialysis business model long-term.", "quote": null, "locator": "More than 500,000 Americans rely on dialysis", "quote_verified": false}]}], "insight_total": 20, "top_entities": ["Levent Alpöge", "Claude", "Anthropic", "OpenAI", "Lean", "SpaceX", "Starmind", "Neuralink", "BAAJA", "Hadrian", "eGenesis", "United Therapeutics"], "source_meta": {"author": "Packy McCormick", "word_count": 2705, "paywalled": false}}, {"record_id": "2aa8e7336c6c0fe8", "source_type": "concepts", "source_name": "World Economic Forum", "source_url": "https://www.weforum.org/stories/resilience-peace-and-security/space-debris-removal-prevention-strategies", "title": "Space Debris Removal: Prevention & Mitigation Strategies | World Economic Forum", "published_date": "2026-11-25", "language": "en", "processed_at": "2026-11-28T11:11:33Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "Geopolitics"], "gist": "WEF argues orbital sustainability needs both active debris removal (remediation) and reliable post-mission disposal (mitigation); with launches up 254% in 2020–25 and private operators dominating, NASA modeling shows small PMD reliability gains slash collisions, debris could cost the space economy up to $42.3B over a decade, and passive disposal devices (HPS ADEO-N, BULL HORN) are maturing.", "themes": [{"theme": "Orbital congestion scale", "insights": [{"claim": "UNOOSA reports objects launched into space more than tripled from 1,274 in 2020 to 4,510 in 2025, an increase of about 254%.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["UNOOSA", "space debris"], "conviction": "high", "so_what": "Rapid growth in orbital traffic raises the value of debris-mitigation and space-situational-awareness services.", "quote": null, "locator": "The United Nations Office for Outer Space Affairs", "quote_verified": false}, {"claim": "Private satellites represented 88% of launches in 2025, up from 23% in 2010 per the OECD, shifting space activity away from government-led launches.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["OECD", "BryceTech", "commercial satellites"], "conviction": "high", "so_what": "Debris policy will increasingly bind commercial operators — compliance costs fall on private constellations.", "quote": null, "locator": "Commercial actors are equally important", "quote_verified": false}, {"claim": "Under business-as-usual, space debris could impose a hidden tax of up to $42.3 billion on the space economy over the next decade.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["space economy", "space debris"], "conviction": "medium", "so_what": "Quantifies a cost line for operators and insurers — supports demand for disposal tech.", "quote": "space debris could impose a hidden tax of up to $42.3 billion", "locator": "Without high disposal rates", "quote_verified": true}]}, {"theme": "Disposal reliability math", "insights": [{"claim": "NASA Orbital Debris Program Office modeling of three constellations totaling 8,300 spacecraft found 260 catastrophic collisions over 200 years at a 90% post-mission disposal success rate, 90 at 95%, and 34 at 99%.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["NASA Orbital Debris Program Office", "post-mission disposal", "constellations"], "conviction": "high", "so_what": "Collision risk is highly nonlinear in disposal reliability — regulators may push for 99%+ PMD standards.", "quote": null, "locator": "Research from NASA’s Orbital Debris Program Office", "quote_verified": false}, {"claim": "The rise of commercial mega-constellations means even a minor post-mission disposal failure rate can quickly pollute low Earth orbit.", "speaker": "World Economic Forum", "type": "causal", "entities": ["commercial satellite constellations", "low Earth orbit"], "conviction": "high", "so_what": "Mega-constellation operators carry systemic debris risk; watch for disposal-reliability mandates.", "quote": null, "locator": "The urgency of mitigation is driven", "quote_verified": false}]}, {"theme": "Remediation vs mitigation", "insights": [{"claim": "WEF frames space sustainability as two complementary tools: active debris removal (ADR) like roadside assistance for existing hazards, and post-mission disposal (PMD) like seat belts built in from the start.", "speaker": "World Economic Forum", "type": "framework", "entities": ["active debris removal", "post-mission disposal"], "conviction": "medium", "so_what": "Mitigation (built-in disposal) is the scalable market; ADR remains early-stage.", "quote": null, "locator": "Road safety offers a useful analogy", "quote_verified": false}, {"claim": "Active debris removal is attracting significant attention and its technology is advancing, but practical implementation remains in early stages.", "speaker": "World Economic Forum", "type": "thesis", "entities": ["active debris removal"], "conviction": "medium", "so_what": "ADR revenues are still distant — temper expectations for pure-play debris-removal firms.", "quote": null, "locator": "While ADR is attracting significant attention", "quote_verified": false}, {"claim": "Under Article VIII of the Outer Space Treaty, states keep jurisdiction and ownership of registered space objects after they stop operating, so third-party debris removal may need authorization from the owning state — a legal hurdle mitigation avoids.", "speaker": "World Economic Forum", "type": "causal", "entities": ["Outer Space Treaty", "active debris removal"], "conviction": "high", "so_what": "Legal/diplomatic friction structurally slows ADR; favours designing disposal in at launch.", "quote": null, "locator": "Beyond reducing operational and economic risks", "quote_verified": false}]}, {"theme": "Passive disposal technologies", "insights": [{"claim": "Traditional propulsion-based disposal requires reserving propellant and keeping systems working to end of life, while passive methods reduce reliance on propellant and maneuvering and can cut disposal-system mass.", "speaker": "World Economic Forum", "type": "framework", "entities": ["propulsion-based PMD", "passive disposal"], "conviction": "medium", "so_what": "Passive deorbit devices are a lower-cost compliance option — potential niche for component suppliers.", "quote": null, "locator": "Effective mitigation depends on disposal solutions", "quote_verified": false}, {"claim": "HPS's ADEO-N braking sail, deployed by D-Orbit in 2022, uses atmospheric drag to accelerate orbital decay without propulsion, and in 2026 Japanese start-up BULL completed the first in-orbit demonstration of its passive HORN device aboard Japan's H3.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["HPS", "D-Orbit", "BULL", "HORN", "H3"], "conviction": "high", "so_what": "Passive deorbit tech is flight-proven — commercialization phase begins.", "quote": null, "locator": "Recent technological progress demonstrates", "quote_verified": false}]}, {"theme": "Policy and investment levers", "insights": [{"claim": "Japan's SBIR-3 grant program funds a space-debris portfolio spanning remediation and both passive and propulsion-based disposal, illustrating parallel public funding of multiple technologies.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["Japan SBIR-3", "space debris"], "conviction": "medium", "so_what": "Japan is a leading public funder of debris tech — Japanese space startups benefit.", "quote": null, "locator": "Japan’s SBIR-3 Grant Program", "quote_verified": false}, {"claim": "WEF argues that as debris becomes an infrastructure priority, focus should shift from technological progress to routine adoption, with governments using research funding, procurement, shared standards and incentives.", "speaker": "World Economic Forum", "type": "thesis", "entities": ["World Economic Forum", "space policy"], "conviction": "medium", "so_what": "Procurement and standards are the catalysts that turn disposal tech into a recurring market.", "quote": null, "locator": "Align policy, investment and commercial adoption", "quote_verified": false}, {"claim": "Practical debris mitigation reduces collision risk, maneuvering burden and service disruptions for operators, and limits operational and eco // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
