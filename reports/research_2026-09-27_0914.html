  ITEMS.forEach(function(i){ urgs[i.urgency] = (urgs[i.urgency]||0) + 1; });
  var urgBar = document.getElementById('urgBar');
  var uhtml = '<button class="pill' + (activeUrg==="all"?" active":"") + '" style="' + (activeUrg==="all"?"background:#333;":"") + '" onclick="setUrg(\'all\')">All (' + ITEMS.length + ')</button>';
  ['red','deep','watch'].forEach(function(u){
    if (!urgs[u]) return;
    var isActive = activeUrg === u;
    var m = URG_META[u];
    uhtml += '<button class="pill' + (isActive?" active":"") + '" style="' + (isActive?"background:#555;":"") + '" onclick="setUrg(' + jsStr(u) + ')">' + m.emoji + ' ' + m.label + ' (' + urgs[u] + ')</button>';
  });
  urgBar.innerHTML = uhtml;
}

function renderCards(forceOpenAll) {
  var container = document.getElementById('cards');
  var html = '';
  ITEMS.forEach(function(item, idx){
    if (activeCat !== "all" && item.cat !== activeCat) return;
    if (activeUrg !== "all" && item.urgency !== activeUrg) return;
    if (activeSrc && item.source.indexOf(activeSrc) === -1) return;
    var color = CAT_COLORS[item.cat] || "#888";
    var urg = URG_META[item.urgency] || URG_META.deep;
    var chartFlag = item.charts && (item.charts.count > 0 || item.charts.hot) ? '<span class="chart-flag">' + (item.charts.hot ? '🔥' : '📊') + '</span>' : '';
    var openCls = forceOpenAll ? ' open' : '';
    html += '<div class="card' + openCls + '" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">' + String(idx+1).padStart(2,'0') + '</span>';
    html += '<span>' + urg.emoji + '</span>';
    html += '<span class="badge" style="background:' + color + '">' + esc(item.source) + '</span>';
    html += '<span class="cat-tag">' + esc(item.cat) + '</span>';
    html += chartFlag;
    html += '<span class="title-txt">' + esc(item.title) + '</span>';
    html += '</div>';
    html += '<div class="card-body">';
    html += '<div class="section-label">The Idea</div><div class="idea-txt">' + esc(item.idea) + '</div>';
    html += '<div class="section-label">My Angle</div><div class="angle-box" style="border-color:' + color + ';background:' + color + '14;">' + esc(item.angle) + '</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet-box"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + esc(item.tweetA) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet-box"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + esc(item.tweetB) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    if (item.charts && (item.charts.desc || item.charts.count > 0)) {
      html += '<div class="chart-note' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '🔥 CHART WORTH SAVING — ' : '📊 ') + esc(item.charts.desc || '') + '</div>';
    }
    html += '<div class="link-row"><a href="' + item.link + '" target="_blank">↗ Read full article</a></div>';
    html += '</div>';
    html += '</div>';
  });
  container.innerHTML = html || '<p style="color:#888;">No items match this filter.</p>';
}

function renderReport() {
  var body = document.getElementById('reportBody');
  var html = '<p><strong>Window:</strong> ' + META.windowStart + ' to ' + META.windowEnd + '. Emails outside this window were not processed.</p>';
  html += '<p><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp;|&nbsp; <strong>Emails read:</strong> ' + META.emailsRead + ' &nbsp;|&nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</p>';
  html += '<p><strong>Included sources:</strong></p><ul>';
  META.includedSources.forEach(function(s){
    html += '<li><span class="src-link" onclick="filterBySrc(' + jsStr(s.name) + ')">' + esc(s.name) + '</span> — ' + s.count + ' item' + (s.count===1?'':'s') + '</li>';
  });
  html += '</ul>';
  if (META.skippedSources.length) {
    html += '<p><strong>Skipped sources:</strong></p><ul>';
    META.skippedSources.forEach(function(s){
      html += '<li>' + esc(s.name) + ' — ' + esc(s.reason) + '</li>';
    });
    html += '</ul>';
  } else {
    html += '<p><strong>Skipped sources:</strong> none — every email in the window had substantive analytical content.</p>';
  }
  body.innerHTML = html;
}

function render(forceOpenAll) {
  buildFilterBars();
  renderCards(forceOpenAll);
}

document.getElementById('metaLine').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails';
document.getElementById('reportHeader').addEventListener('click', toggleReport);
render();
renderReport();
</script>
</body>
</html>
