<script>
const ITEMS = [{"cat": "energy", "urgency": "now", "source": "Seven c / Seven c Newsletter #191", "title": "Brent $116.72, SPR at 1982 lows, and a Houthi claim on the Hormuz bypass", "idea": "Brent settled at $116.72 Friday (six-month high, $117.42 intraday) on fears of new US strikes on Iran; US pulled staff from several Middle East embassies; the emergency oil reserve is at its lowest since 1982. Saturday the Houthis claimed hits on Aramco's Yanbu site and the East-West pipeline (Saudi unconfirmed). Author flags a Monday gap risk.", "angle": "Yanbu/East-West is the Hormuz workaround. A claim against it removes the reroute narrative while the SPR backstop is thin. Monday open is the trade.", "tweetA": "Yanbu and the East-West pipeline are the Hormuz bypass. If the Houthi claim is even half true, the 'we can reroute' argument just lost its route. SPR at 1982 lows means no backstop either. Monday gap risk is one-sided. $XLE $OIH", "tweetB": "Brent $117, embassies emptying, SPR at 44-year lows. The market spent the week selling AI capex, not the one input that taxes every factory printing a 56 PMI.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-191", "id": 1}, {"cat": "macro", "urgency": "deep", "source": "Seven c / Seven c Newsletter #191", "title": "US flash manufacturing PMI 56.0: 53-month high, prices at fastest since Aug 2022", "idea": "Flash mfg PMI hit 56.0, a 53-month high. Factory hiring is the fastest since March 2012 and selling prices are rising at the fastest pace since August 2022. The 10-year slipped back to ~5% only because tech sold off.", "angle": "Growth hot plus prices hot plus Brent $117 is not a cutting backdrop. FOMC is Wednesday.", "tweetA": "A 56.0 manufacturing PMI, output prices at 2022 highs, Brent at $117. That's not a Fed that cuts, that's a Fed deciding how loudly to say 'hike.' The market gives it 10%. I'd want more than 10%.", "tweetB": "Factory hiring at the fastest pace since 2012 and the 10-year still can't hold below 5%. The bond market isn't pricing a slowdown. It's pricing capex plus a war premium as one inflation impulse.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-191", "id": 2}, {"cat": "macro", "urgency": "deep", "source": "Seven c / Seven c Newsletter #191", "title": "Wednesday stack: FOMC at 18:00 UTC, then Microsoft and Alphabet the same night", "idea": "Next week's setup: Fed decision at 18:00 UTC Wednesday with MSFT and GOOGL reporting that evening. After Meta beat by 13% and fell 7%, the AI trade is being punished for spending even on beats.", "angle": "Single-evening event cluster: rates at ~5% 10y plus two more hyperscaler capex numbers.", "tweetA": "Wednesday night: the Fed decides with the 10-year at 5%, then MSFT and GOOGL print capex. After Meta, the only acceptable guide is 'spend less, grow more.' Hedge the earnings, not the Fed. $MSFT $GOOGL", "tweetB": "A hawkish hold plus a capex raise from either hyperscaler is the worst combination on the board. Meta just showed what that costs: -7% on a 13% beat.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-191", "id": 3}, {"cat": "AI/infra", "urgency": "deep", "source": "Seven c / Seven c Newsletter #191", "title": "Meta beats by 13%, falls 7%; Lam -12%, chips -6.7%, Nasdaq -2.6%", "idea": "Meta EPS $7.40 vs $6.54 expected, stock -7% next day. Lam Research -12%, chip stocks -6.7%, Nasdaq -2.6% (worst day since June). Gold slid toward $4,000 the same day. Author's read: the market cares how much is being spent on AI, not the quarter.", "angle": "Regime shift from rewarding AI revenue to charging for AI capex. Gold falling alongside suggests liquidation, not rotation.", "tweetA": "Meta beats by 13% and loses 7%. Lam loses 12% the same day. The market stopped paying for AI revenue and started invoicing AI capex. That's the regime change, not the print. $META $LRCX", "tweetB": "Gold sliding toward $4,000 the same day chips broke says it was a liquidation day, not a rotation. When everything that worked gets sold together, ask who needed cash.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-191", "id": 4}, {"cat": "crypto", "urgency": "deep", "source": "Seven c / Seven c Newsletter #191", "title": "BTC under $80k, $404M longs flushed in four hours, Hayes: 'I dumped it all'", "idea": "BTC briefly broke below $80k Saturday (low ~$79,280); $404M of longs liquidated in four hours. ETH ~$2,314, SOL ~$100. Spot BTC ETFs bled $773M Thursday and Friday. Arthur Hayes said of his family office's trading book: 'I dumped it all.'", "angle": "Weekday ETF selling plus weekend leverage flush; sentiment tell from a known bull.", "tweetA": "Hayes saying he dumped the whole family-office book is the kind of tell you usually only see in hindsight. $404M of longs gone in four hours on a Saturday, thin liquidity doing what thin liquidity does. $BTC", "tweetB": "$773M out of spot ETFs over two weekdays, $404M of longs wiped over a weekend. Two different crowds leaving the same trade on different days.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-191", "id": 5}, {"cat": "macro", "urgency": "deep", "source": "IT Tech PL / Bitcoin & Crypto Market Report #200", "title": "Michigan sentiment 48.0, 1-yr inflation expectations 4.7%, hike odds slip to 10%", "idea": "10-year fell to 4.999% from 5.098% a week earlier; odds of a hike at the 28 Oct FOMC dropped to 10% from 17%. UMich sentiment fell to 48.0 (five-month low) while 1-year inflation expectations rose to 4.7%. China Q3 GDP printed 4.5%, above forecast.", "angle": "Consumers feel stagflation while manufacturers print a 56 PMI. Hike odds moved on a tech drawdown, not on inflation data.", "tweetA": "Michigan sentiment at 48.0 with 1-year inflation expectations at 4.7%. Consumers feel stagflation, manufacturers print a 56 PMI. One of them is wrong and the Fed meets Wednesday.", "tweetB": "Hike odds fell from 17% to 10% because yields dipped, not because inflation did. The market is treating the equity drawdown as a policy substitute. Fragile.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://ittechpl.substack.com/p/sellers-cashed-out-at-849k-buyers-200", "id": 6}, {"cat": "crypto", "urgency": "deep", "source": "IT Tech PL / Bitcoin & Crypto Market Report #200", "title": "Bitcoin fell 3x as hard as the Nasdaq this week; last week it fell half as hard", "idea": "BTC traded $79,220-$84,898, weekly candle at $80,240 (-2.28%), third red week. Thursday the Philadelphia Semiconductor Index fell ~8% in a session; BTC dropped below $82k. Last week BTC lost half as much as the Nasdaq; this week about three times as much. Author's rule: weekly close below $82,800 starts a correction; it closed $82,116. The low held above the 365-day MA for a third week.", "angle": "BTC as a leveraged tech beta with a time-varying multiplier, not a diversifier.", "tweetA": "Bitcoin fell three times as hard as the Nasdaq this week. Last week, half as hard. That's not an uncorrelated asset, it's a variable-beta one that picks the wrong direction. $BTC $QQQ", "tweetB": "Third red weekly candle, still above the 365-day MA. The $82.8K line that defined the correction fired. The Wednesday question is whether $79.2K is a floor or just the first test.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening (weekly candle, on-chain buyer cost basis)"}, "link": "https://ittechpl.substack.com/p/sellers-cashed-out-at-849k-buyers-200", "id": 7}, {"cat": "crypto", "urgency": "deep", "source": "IT Tech PL / Bitcoin & Crypto Market Report #200", "title": "ETH: zero positive Coinbase-premium hours in two weeks, taker sell-dominant for a 4th week", "idea": "Ethereum Coinbase Premium Gap negative in all 168 hours of the week, second straight week without a positive hour. 90-day taker CVD on ETH futures 'Taker Sell Dominant' for a fourth week. Ether ETFs lost $220.7M, Solana ETFs $17.6M; XRP ETFs took in $4.3M. BTC ETFs: +$411.5M net for the week after a -$635.6M Thursday.", "angle": "US spot demand for ETH is absent across 336 consecutive hours.", "tweetA": "Zero positive Coinbase premium hours in two weeks. American spot buyers have left ETH entirely. Whatever bottom forms, it isn't being built by the people who bought the ETF narrative. $ETH", "tweetB": "ETH ETFs -$220.7M, Solana ETFs -$17.6M, XRP ETFs +$4.3M. The alt-ETF wave was supposed to broaden demand. This week it's a rounding error with the sign flipped.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening (CryptoQuant taker CVD, Coinbase premium)"}, "link": "https://ittechpl.substack.com/p/sellers-cashed-out-at-849k-buyers-200", "id": 8}, {"cat": "crypto", "urgency": "deep", "source": "IT Tech PL / Bitcoin & Crypto Market Report #200", "title": "Vertical SaaS +18% in five days while every crypto sector lagged the S&P", "idea": "On Artemis's five-day sector view every crypto sector finished below the S&P (-0.6%). Crypto Infrastructure -12.4% (worst of 25), DEX & Trading -9.9%, Smart Contract Platforms -9.8%. Bitcoin Miners -4.7% after -19.9% last week. Software led: Vertical SaaS +18.0%, Cybersecurity +13.8%, Enterprise SaaS +10.2%.", "angle": "Software bid while chips and crypto are sold: rotation toward low-capex margin stories.", "tweetA": "Vertical SaaS +18% in five days, chips -8% in a day. Either software is the AI beneficiary after all, or the market just wants anything with margins and no capex. $CRM $NOW", "tweetB": "Bitcoin miners -4.7% after -19.9% the week before. The AI-pivot miners trade as chips, the hash miners as BTC beta. The basket stopped being one trade.", "charts": {"count": 1, "hot": true, "desc": "Artemis five-day sector chart referenced (not visible in plain text) - 🔥 CHART WORTH SAVING if it shows SaaS vs crypto infra"}, "link": "https://ittechpl.substack.com/p/sellers-cashed-out-at-849k-buyers-200", "id": 9}, {"cat": "crypto", "urgency": "watch", "source": "IT Tech PL / Bitcoin & Crypto Market Report #200", "title": "Privacy coins up two weeks running while tokenized gold and mid-cap alts bleed", "idea": "7-day moves: Zcash +5.44%, Monero +4.01% (second straight week); XAUT -3.94%, PAXG -3.77%; Hedera -12.95%, NEAR -11.38%, Aave -10.53%, Avalanche -10.04%. BTC.D slipped 0.05pp to 60.65%, ending a three-week climb; TOTAL $2.66T.", "angle": "Privacy bid in a down tape; tokenized gold behaving as risk collateral.", "tweetA": "Privacy coins up two weeks in a row in a tape where everything else bleeds, and cybersecurity stocks +13.8% in the same five days. Surveillance anxiety is the bid nobody put in the macro model. $ZEC $XMR", "tweetB": "Tokenized gold fell ~3.8% on the week. On-chain gold is trading like a leveraged collateral asset, not a haven: first thing sold when the unwind starts. $XAUT $PAXG", "charts": {"count": 0, "hot": false, "desc": "Heatmap inside - worth opening"}, "link": "https://ittechpl.substack.com/p/sellers-cashed-out-at-849k-buyers-200", "id": 10}, {"cat": "geopolitics", "urgency": "deep", "source": "Joseph Politano / Apricitas Economics", "title": "Canada's non-US exports +40% in 12 months; US share of trade at a 30-year low", "idea": "Share of Canadian trade going to the US is the lowest in 30+ years. Carney's goal to double non-US exports in a decade is already halfway done (+40% in 12 months). But the US is still 8x the size of #2 partner, the EU. Non-US exports to China +52%, EU +42%, others +18%.", "angle": "Decoupling is real and dependency is real; only one makes the headline.", "tweetA": "Carney set a 10-year goal to double non-US exports. A year in, he's up 40% and halfway. The US is still 8x the EU. The decoupling and the dependency are both real, only one trends.", "tweetB": "Tariffs were meant to pull capital into America. A top partner just stood up a Major Projects Office to send oil to Pacific ports instead. A ten-year capex decision made on a trade threat.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening (trade shares, export destinations)"}, "link": "https://www.apricitas.io/p/how-canada-is-decoupling-from-the", "id": 11}, {"cat": "gold", "urgency": "deep", "source": "Joseph Politano / Apricitas Economics", "title": "Canada's #2 export destination is now the UK, because of gold", "idea": "Metal and mineral exports are +125% since 2024 and non-US energy exports +80%. Much of the metals surge is Canadian gold shipped to UK vaults, which now dominates British-Canadian trade flows and lifted the UK past China and the EU as #2 destination. The author says the growth should be partly discounted as price inflation and re-export.", "angle": "Diversification stats flattered by the gold price; relevant with gold sliding toward $4,000 (see Seven c).", "tweetA": "Canada's #2 export destination is now the UK, and it isn't trade, it's gold moving into London vaults. A chunk of 'diversification' is price and re-export. Check the denominator before you tweet the decoupling thesis.", "tweetB": "Canada's tariff hedge is a commodity price. Metals +125%, energy +80% since 2024. If gold keeps sliding toward $4,000 the diversification story loses its best chart.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.apricitas.io/p/how-canada-is-decoupling-from-the", "id": 12}, {"cat": "culture", "urgency": "deep", "source": "Joseph Politano / Apricitas Economics", "title": "Canadian US-travel spend -24%, other overseas +24%; burner phones and AI cut-off war-gaming", "idea": "Canadian personal spending on US visits is down 24% vs 2024 while spending on other overseas destinations is up 24%. Consumer goods imports from the US fell $2B. 46% of Canadians think the worst of the trade war is still to come vs 27% who think it's behind. The author met staffers taking burner phones into the US and firms gaming out being cut off from US AI models.", "angle": "Consumer boycott as reallocation; trust shock reaching tech-stack decisions.", "tweetA": "Canadians cut US travel spend by 24% and sent exactly 24% more elsewhere. That's not a boycott, it's a reallocation. Someone captured it, and they didn't have to lift a finger. $BKNG", "tweetB": "Canadian firms are war-gaming being cut off from US AI models. Sovereign-AI demand isn't only a Gulf story. Every middle power with a Carney is a prospective customer for a non-US stack.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.apricitas.io/p/how-canada-is-decoupling-from-the", "id": 13}, {"cat": "macro", "urgency": "deep", "source": "Joseph Politano / Apricitas Economics", "title": "One tariff announcement, measured: -4pts export expectations, +0.5pt inflation, 25% of firms cut investment", "idea": "The Bank of Canada survey straddled Trump's new $20B tariffs and threat to double auto tariffs in 2027: export growth expectations fell ~4pp, inflation expectations rose 0.5pp, 25% of firms revised down domestic investment. 20%+ of firms are restructuring supply chains; contractors reducing operations outnumber expanding ~2:1. Canadian GDP +1.4% in 2026 after stagnating in 2025.", "angle": "A clean event study of tariff announcement effects.", "tweetA": "One announcement, measured: -4 points on export growth expectations, +0.5 on inflation expectations, 25% of firms cutting domestic investment. Tariffs finally have a clean event study, and it's not a growth impulse.", "tweetB": "Canada's GDP stagnated in 2025 and is +1.4% in 2026. The tariff shock hit manufacturing first and is already rebounding. Shocks fade faster than the policy does, which is how you get complacent right before the next one.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening (BoC survey before/after)"}, "link": "https://www.apricitas.io/p/how-canada-is-decoupling-from-the", "id": 14}, {"cat": "regulation", "urgency": "deep", "source": "Joseph Politano / Apricitas Economics", "title": "If Democrats flip Congress next week, trade becomes the White House's only lever; USMCA review forced", "idea": "Apricitas expects that if Democrats win the House and Senate in next week's midterms, Trump refocuses on trade wars and foreign policy given reduced domestic power. The administration has repeatedly delayed USMCA renegotiation but must address it in its last two years. Trump has already eased Canada tariffs several times for political reasons, most recently agricultural supplies to help Susan Collins.", "angle": "Midterm outcome sets the trade-policy volatility regime for 2027.", "tweetA": "If Congress flips, the executive branch's only unconstrained lever is trade. That makes the USMCA review the 2027 volatility event nobody has on the calendar. $EWC $EWW", "tweetB": "Trump eased Canadian ag tariffs to help one Senate race. Tariff policy is already being run as campaign policy. Price that, not the rhetoric.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.apricitas.io/p/how-canada-is-decoupling-from-the", "id": 15}, {"cat": "geopolitics", "urgency": "watch", "source": "Joseph Politano / Apricitas Economics", "title": "Canada opened a 49k Chinese-EV quota; fewer than 16k slots used", "idea": "Canada suspended its 100% tariff on Chinese EVs in favor of a 49,000-vehicle quota, but fewer than 16,000 slots have been used. A deal earlier this year with China has already recovered some agricultural exports lost to counter-tariffs. Rising energy prices amid the US-Iran war have pushed China to buy Canadian fossil fuels.", "angle": "Mid-powers hedging both ways; quota fill rate is the tell.", "tweetA": "Canada opened a 49k-vehicle door to Chinese EVs and under a third of the slots are used. The wall came down and nobody walked through. Supply-chain trust moves slower than tariff schedules.", "tweetB": "China is buying Canadian energy because the Iran war made its other suppliers expensive. Canadian crude is a beneficiary of Hormuz risk, and Beijing's leverage grows with each pipeline Ottawa fast-tracks.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.apricitas.io/p/how-canada-is-decoupling-from-the", "id": 16}, {"cat": "AI/infra", "urgency": "deep", "source": "Elvis Saravia / NLP Newsletter (Top AI Papers)", "title": "Four Gemini agents beat Minecraft in 27h14m: 2,783 programs, 605 deaths, no human intervention", "idea": "DeepMind placed four Gemini 4 Argon agents in a sandboxed Minecraft world; they wrote 2,783 programs, died 605 times and defeated the Ender Dragon in 27 hours 14 minutes with no human intervention, coordinating via in-game chat and shared memory. A fifth Observer agent monitored for cheating and found none. Limits: single run, Mineflayer exposes hidden state, Easy difficulty, prior game knowledge.", "angle": "Long-horizon coherence over a day-plus is the capability that matters for enterprise workflows.", "tweetA": "605 deaths and 2,783 programs later, four agents finished Minecraft in 27 hours with nobody at the keyboard. The dragon isn't the number. 27 hours of coherent planning is. Most enterprise tasks are shorter than that.", "tweetB": "The caveats are the interesting part: Mineflayer exposes hidden state, Easy difficulty, prior knowledge of the game. 'AI beats a game with a cheat sheet' is also how most enterprise APIs look.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/top-ai-papers-of-the-week-a74", "id": 17}, {"cat": "AI/infra", "urgency": "deep", "source": "Elvis Saravia / NLP Newsletter (Top AI Papers)", "title": "Cache engineering: dropping old tool responses beats summarization, 27.7% cheaper", "idea": "Tsinghua/CUHK let the agent control its active KV cache with drop and repos operations, leaving trajectory text unchanged so nothing is re-prefilled. A rolling drop of old tool responses scores 1.7 points higher and costs 27.7% less than threshold-triggered summarization; AKV serving gives up to 1.2x throughput and 1.5x faster P95. Recursive self-improvement of the cache policy cuts another 7.1%.", "angle": "Agent cost control is moving to the memory layer, below the prompt.", "tweetA": "Long-context agents are a KV-cache I/O bill. Dropping old tool responses is 27.7% cheaper than summarizing them and scores higher. The inference cost curve keeps bending, and not because of new chips. $MU $SK", "tweetB": "Context engineering rewrites history and invalidates the cache. Cache engineering leaves the text alone and edits attention. Jevons has to do a lot of work to keep demand ahead of efficiency gains like this.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/top-ai-papers-of-the-week-a74", "id": 18}, {"cat": "AI/infra", "urgency": "deep", "source": "Elvis Saravia / NLP Newsletter (Top AI Papers)", "title": "A 4B model routes agent decisions: 81-89% cheaper, within 3 points of success", "idea": "JevAgentHarness hands routine multiple-choice agent decisions to a small model and falls back to the LLM when confidence is below a fitted threshold. With fitted thresholds, cascades cut cost 14.2% with no change in any of 500 task outcomes. Delegating without thresholds cost 19.0 points of success. A 4B model trained on post-mistake states made agents 81.1%-89.0% cheaper and up to 2.5x faster within 3 points of success.", "angle": "Frontier-token demand is increasingly about when not to call the big model.", "tweetA": "81-89% cheaper agents with a 4B model making the routine calls and the frontier model only on low confidence. If that holds, frontier-token revenue is the exception path, not the default path.", "tweetB": "The whole trick is the fitted threshold: without it, delegation cost 19 points of success. Everyone wants the cheap model. The moat is knowing when not to trust it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/top-ai-papers-of-the-week-a74", "id": 19}, {"cat": "AI/infra", "urgency": "deep", "source": "Elvis Saravia / NLP Newsletter (Top AI Papers)", "title": "Agent S4: open 27B model beats GPT-5.5 on OSWorld V2 at ~4% of the cost by building its own interfaces", "idea": "Simular's meta-agent evolves interfaces for a computer-use agent. With Qwen3.8-27B it reaches 21.3% on OSWorld V2, 3.8x the fixed-interface baseline, above GPT-5.5 (13.0%) and Claude Opus 4.8 (20.6%) at about 4.3% and 1.5% of their costs. On ScienceBoard success rose from 41.4% to 58.6% with the same model.", "angle": "Interface design as an agent capability erodes closed-model pricing power on computer use.", "tweetA": "An open 27B model beat GPT-5.5 on OSWorld V2 at about 4% of the cost, not by being smarter but by writing its own interfaces. The agent that stops clicking spreadsheet cells one at a time wins.", "tweetB": "Same model, same weights, 41.4% to 58.6% on ScienceBoard. We keep scaling the part that was already expensive and ignoring the harness around it. Open frontier-minus-one keeps compounding.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/top-ai-papers-of-the-week-a74", "id": 20}, {"cat": "AI/infra", "urgency": "deep", "source": "Elvis Saravia / NLP Newsletter (Top AI Papers)", "title": "OO-Harness: inheritance adds 4.96 points over the same code flattened", "idea": "Google Cloud AI Research/UIUC evolve a hierarchy of specialized harness subclasses with a router. With the same Gemini 3.5 Flash executor, AutomationBench rises 61.6% to 77.4%, Workspace-Bench 25.5% to 39.5%, Toolathlon-GYM strict pass 31.2% to 37.5%. Subclassed harnesses beat flat copies by 4.96 points; best-of-K and self-refinement did not reliably help.", "angle": "Structure beats extra inference; scaffolding is where gains are.", "tweetA": "Class inheritance adds 4.96 points over the same code flattened. Software engineering 101 just got an agent-design benchmark, and the scaffold gave 16 points on AutomationBench without touching the model.", "tweetB": "Best-of-K and self-refinement didn't reliably help. Specializing did. Spending more inference isn't the lever, structure is. Marginally bad for the 'just throw more tokens at it' capex thesis.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/top-ai-papers-of-the-week-a74", "id": 21}, {"cat": "AI/infra", "urgency": "deep", "source": "Elvis Saravia / NLP Newsletter (Top AI Papers)", "title": "MemoryTax: memory layers cost more to build than a full-context run; grep over raw history scored 99%", "idea": "On one 419-turn LoCoMo conversation, Mem0 beat full context only with GPT-4o-mini, and building its memory cost more than an entire full-context rollout. With Claude Opus 5.5, the Pi coding agent searching raw history scored 99% for under half the cost of full context. A stronger reader cannot recover what a weaker writer left out.", "angle": "Challenges the memory-as-a-product category.", "tweetA": "Building the memory layer cost more than running the whole conversation in context, and a coding agent grepping raw history scored 99% at under half the price. The agent-memory startup category has a hard question to answer: why not grep?", "tweetB": "Memory has a ceiling set by whoever wrote it. A stronger reader can't recover what a weaker writer dropped. Same as sell-side summaries: lossy compression you can't audit.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/top-ai-papers-of-the-week-a74", "id": 22}, {"cat": "AI/infra", "urgency": "deep", "source": "Elvis Saravia / NLP Newsletter (Top AI Papers)", "title": "Self-evolving agents: plasticity vs forgetting correlate at r = -0.72", "idea": "DeepMind/Mila tested ReasoningBank, GEPA and Meta-Harness on drifting task streams. Higher plasticity consistently came with more forgetting (r = -0.72 across 12 method/scenario pairs). Global edits to shared prompts interfere with unseen tasks; similarity-based memory retrieval still suffers cross-domain collisions.", "angle": "Recursive self-improvement thesis has an unmeasured stability cost.", "tweetA": "r = -0.72 between how much an agent learns and how much it forgets. Self-improving agents inherit the oldest problem in portfolio management: every adaptation overwrites the position you needed last quarter.", "tweetB": "Static benchmarks hide this. If recursive self-improvement is the next leg of the AI thesis, the evidence it generalizes under drift is weaker than the demo reels suggest.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/top-ai-papers-of-the-week-a74", "id": 23}, {"cat": "AI/infra", "urgency": "deep", "source": "Elvis Saravia / NLP Newsletter (Top AI Papers)", "title": "Terminal-RSI: under dense rewards, failed runs captured 50% of the reward", "idea": "Tencent trained terminal agents from Qwen3.8-27B over five stages (SFT on rewritten verified trajectories, then PPO). Four-suite Terminal-Bench average rose from 20.68% to 50.58%, 86.52% on Terminal-Bench 2.1. A reward audit found failed runs collected 50.09% of dense progress reward; separating strict success from partial credit cut that to 28.72%.", "angle": "Reward design flaw with a direct analogy to incentive design.", "tweetA": "Under a dense progress reward, failed runs captured half of all reward. Anyone training agents on partial credit is paying for failure. Same flaw as paying managers on assets gathered.", "tweetB": "Terminal-Bench average from 20.7% to 50.6% in five RL stages from a 27B base. The open-versus-frontier gap on agentic coding looks more like a training-recipe gap than a compute gap.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/top-ai-papers-of-the-week-a74", "id": 24}, {"cat": "science", "urgency": "watch", "source": "Elvis Saravia / NLP Newsletter (Top AI Papers)", "title": "DiscoveryRSI: a 27B model's hypotheses match later-published research 6.3% vs 2.3-2.5% for frontier models", "idea": "Self-improvement over hypothesis trees across four life-science domains lifted automated hypothesis quality from 4.86 to 5.39. The 27B model's hypotheses matched post-cutoff published research 6.3% of the time versus 2.5% for GPT-6 and 2.3% for Claude Opus 5. Expert review rated it above GPT-6 Luna on importance.", "angle": "Specialization beats scale on narrow discovery tasks; biotech pipeline implications.", "tweetA": "A 27B model's hypotheses matched later-published biology 6.3% of the time vs 2.3-2.5% for the frontier models. Specialization via self-improvement beats scale on narrow discovery. Biotech pipelines are becoming an information-retrieval problem.", "tweetB": "6.3% sounds low until you remember it's predicting research that didn't exist at training cutoff. The comparison that matters isn't the hit rate, it's cost per testable hypothesis versus a postdoc.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/top-ai-papers-of-the-week-a74", "id": 25}, {"cat": "science", "urgency": "watch", "source": "Elvis Saravia / NLP Newsletter (Top AI Papers)", "title": "Anthropic/Georgia Tech: many late-layer transcoder features are copies of single MLP neurons", "idea": "Across 13 open-source transcoders, many active late-layer features are close copies of single MLP neurons. These neuron-aligned features are the only ones with a stable link to the MLP; other features vary between training runs and move less from initialization. Authors conclude neurons are a stronger interpretability basis than assumed and non-neuron features need validation.", "angle": "Interpretability methods may be rediscovering neurons; matters for AI safety claims.", "tweetA": "Many 'features' that interpretability transcoders find in late layers are just single MLP neurons wearing a costume. If the explanation tools mostly recover the thing they were built to replace, the safety case that rests on them needs a second look.", "tweetB": "The features that don't match neurons are the ones that vary across training runs. Unstable explanations of a stable model is a strange place to anchor alignment audits.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/top-ai-papers-of-the-week-a74", "id": 26}, {"cat": "tech", "urgency": "watch", "source": "Herb Greenberg / Red Flag Alert", "title": "ASTS: down >50% in six months, still priced as the hottest satcom, flagged for 'acute securities lending stress'", "idea": "Greenberg flags AST SpaceMobile $ASTS at a 52-week low after losing more than half its value in six months, yet on trailing multiples it is priced richer than established satcom peers while its network is far from built out. Fidelity said Friday the stock 'faces acute securities lending stress.' Kerrisdale's 2022 bear thesis preceded a two-thirds drop before the rally. The key data point is behind the paywall.", "angle": "Short squeeze mechanics in both directions; narrative-driven space trade.", "tweetA": "$ASTS is down more than half in six months and still trades richer than satcom peers on trailing numbers. A stock that fell 50% and still looks expensive is telling you the bid was the narrative, not the cash flows.", "tweetB": "Fidelity flagging 'acute securities lending stress' is a different risk than valuation. Borrow stress plus high short interest means the bear case can be right and the trade can still hurt.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.herbgreenberg.com/p/red-flagette-something-investors", "id": 27}, {"cat": "tech", "urgency": "watch", "source": "McKinsey Publishing", "title": "Siemens: AI-native factories that adapt to supply-chain shifts; Körber nearly doubled by moving to a full tech stack", "idea": "Siemens Digital Industries CEO Cedrik Neike envisions AI-native factories that adapt to supply chain shifts and customer demand, with a focus on 'doing fewer things better than anyone else.' Körber moved over ten years from machinery-only to a complete technology stack and reports almost 100% growth. Lloyds (250+ years old) is using AI for customer service and advice.", "angle": "Incumbent industrials narrating the AI/automation pivot; teaser-level, interviews inside.", "tweetA": "Siemens talking about 'AI-native factories' that re-plan around supply-chain shocks, while the US flash PMI prints 56 with prices rising. Adaptive manufacturing is a hedge against exactly this tape. $SIE", "tweetB": "Körber going from machinery to a full tech stack for roughly 100% growth is the playbook every industrial wants to copy: sell the software around the box. The market has been paying that multiple for a year.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://email.mckinsey.com/featured-insights/themes/ceos-share-how-theyre-reinventing-businesses-built-to-last", "id": 28}, {"cat": "culture", "urgency": "watch", "source": "McKinsey Publishing", "title": "AP CEO: preserving editorial independence matters more than preserving any business structure", "idea": "McKinsey interview with Associated Press CEO Daisy Veerasingham on AI, the economics of trusted content, and how a 180-year-old news institution reinvents itself. Teaser only; full interview behind the link.", "angle": "Licensing economics of trusted content as AI training and retrieval input.", "tweetA": "When the AP CEO says independence matters more than any particular business structure, she is telling you the content-licensing deal with AI labs is the new business model. Trusted text is a priced input now.", "tweetB": "A 180-year-old wire service is reinventing itself around AI while every lab needs verified ground truth. The scarce asset in the next phase is provenance, not volume.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://email.mckinsey.com/featured-insights/themes/ceos-share-how-theyre-reinventing-businesses-built-to-last", "id": 29}];
