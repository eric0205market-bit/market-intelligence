const META = {
  date: "2026-09-25",
  time: "03:11 CEST",
  windowStart: "2026-09-24 21:11 CEST",
  windowEnd: "2026-09-25 03:11 CEST",
  emailsInWindow: 15,
  emailsRead: 15,
  itemsExtracted: 18,
  includedSources: [
    { name: "Dark Side of the Boom", count: 5 },
    { name: "Daily Chartbook (DC Lite #690)", count: 4 },
    { name: "Michael Parekh (AI Ramblings Daily #170)", count: 3 },
    { name: "This Week In Startups (TWiST)", count: 2 },
    { name: "HFIR / Jon Costello", count: 1 },
    { name: "The Pressure Point / Fulcrum", count: 1 },
    { name: "This Week In AI (TWiAI)", count: 1 },
    { name: "SixSigmaCapital", count: 1 },
    { name: "Norseman Market Timing", count: 1 }
  ],
  skippedSources: [
    { name: "Prometheus Research", reason: "Chat-thread announcement only — zero analytical content, just a prompt to submit questions." },
    { name: "Danny Dayan", reason: "Video-recording notice only (\"watch now, 72 min\") — no text content to extract." },
    { name: "TheStreet Pro", reason: "Pure promotional invite to follow an author on a paid platform." },
    { name: "Substack live-video notification", reason: "Automated \"live now\" notification, no content." },
    { name: "Norseman Market Timing (portfolio update)", reason: "Portfolio holdings shown only as screenshots, not present in plaintext body." }
  ]
};

const CAT_COLORS = { macro:"#e24b4a", credit:"#378add", positioning:"#ef9f27", "AI/infra":"#1d9e75",
  crypto:"#7f77dd", geopolitics:"#d85a30", energy:"#f97316", tech:"#06b6d4",
  gold:"#d4a017", culture:"#ec4899", labor:"#8b5cf6", regulation:"#64748b",
  science:"#14b8a6", venture:"#84cc16" };

const URG_LABEL = { act: "🔴 Act Now", deep: "🔵 Deep", watch: "🟡 Watch" };
const URG_EMOJI = { act: "🔴", deep: "🔵", watch: "🟡" };

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function catColor(c){ return CAT_COLORS[c] || "#888"; }

function buildFilterBars(){
  const catCounts = {};
  ITEMS.forEach(i => { catCounts[i.cat] = (catCounts[i.cat]||0)+1; });
  const catBar = document.getElementById('catBar');
  let html = '<div class="pill active" data-cat="all" onclick="setCat(\'all\')">All <span class="cnt">' + ITEMS.length + '</span></div>';
  Object.keys(catCounts).sort().forEach(function(c){
    html += '<div class="pill" data-cat="' + c + '" onclick="setCat(\'' + c + '\')" style="border-color:' + catColor(c) + '">' + c + ' <span class="cnt">' + catCounts[c] + '</span></div>';
  });
  catBar.innerHTML = html;

  const urgCounts = {};
  ITEMS.forEach(i => { urgCounts[i.urgency] = (urgCounts[i.urgency]||0)+1; });
  const urgBar = document.getElementById('urgBar');
  let uhtml = '<div class="pill active" data-urg="all" onclick="setUrg(\'all\')">All <span class="cnt">' + ITEMS.length + '</span></div>';
  ['act','deep','watch'].forEach(function(u){
    if(urgCounts[u]){
      uhtml += '<div class="pill" data-urg="' + u + '" onclick="setUrg(\'' + u + '\')">' + URG_LABEL[u] + ' <span class="cnt">' + urgCounts[u] + '</span></div>';
    }
  });
  urgBar.innerHTML = uhtml;
}

function setCat(c){
  activeCat = c; activeSrc = null;
  document.querySelectorAll('#catBar .pill').forEach(function(p){
    const isActive = p.getAttribute('data-cat') === c;
    p.classList.toggle('active', isActive);
    if(isActive && c !== 'all'){ p.style.background = catColor(c); p.style.borderColor = catColor(c); }
    else { p.style.background = '#fff'; }
  });
  document.querySelectorAll('.card').forEach(function(el){ el.classList.remove('open'); });
  renderCards();
}
function setUrg(u){
  activeUrg = u; activeSrc = null;
  document.querySelectorAll('#urgBar .pill').forEach(function(p){
    p.classList.toggle('active', p.getAttribute('data-urg') === u);
  });
  document.querySelectorAll('.card').forEach(function(el){ el.classList.remove('open'); });
  renderCards();
}
function filterBySrc(name){
  activeSrc = name; activeCat = 'all'; activeUrg = 'all';
  document.querySelectorAll('#catBar .pill').forEach(function(p){ p.classList.toggle('active', p.getAttribute('data-cat')==='all'); p.style.background = p.getAttribute('data-cat')==='all' ? '#fff' : '#fff'; });
  document.querySelectorAll('#urgBar .pill').forEach(function(p){ p.classList.toggle('active', p.getAttribute('data-urg')==='all'); });
  renderCards(true);
  window.scrollTo({top:0, behavior:'smooth'});
}

function cardHtml(item, idx, expand){
  const color = catColor(item.cat);
  const chartMark = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');
  let html = '<div class="card' + (expand ? ' open' : '') + '" id="card-' + item.id + '">';
  html += '<div class="card-head" onclick="toggleCard(' + item.id + ')">';
  html += '<span class="idx">' + String(idx+1).padStart(2,'0') + '</span>';
  html += '<span>' + URG_EMOJI[item.urgency] + '</span>';
  html += '<span class="badge" style="background:' + color + '">' + item.source + '</span>';
  html += '<span class="tag">' + item.cat + '</span>';
  if(chartMark) html += '<span class="chartmark">' + chartMark + '</span>';
  html += '<span class="title">' + item.title + '</span>';
  html += '</div>';
  html += '<div class="card-body">';
  html += '<div class="block-label">The Idea</div><div class="idea">' + item.idea + '</div>';
  html += '<div class="block-label">My Angle</div><div class="angle" style="border-left:2px solid ' + color + ';background:' + color + '12">' + item.angle + '</div>';
  html += '<div class="tweets">';
  html += '<div class="tweet"><div class="lbl" style="color:#378add">TWEET A</div><div class="txt">' + item.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  html += '<div class="tweet"><div class="lbl" style="color:#7f77dd">TWEET B</div><div class="txt">' + item.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
  html += '</div>';
  html += '<div class="chartbox' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '🔥 CHART WORTH SAVING — ' : (item.charts.count>0 ? '📊 ' : '')) + item.charts.desc + '</div>';
  html += '<div class="linkrow"><a href="' + item.link + '" target="_blank">↗ Read full article</a></div>';
  html += '</div></div>';
  return html;
}

function renderCards(fromSrc){
  const container = document.getElementById('cards');
  let filtered = ITEMS;
  if(activeSrc){
    filtered = ITEMS.filter(function(i){ return i.source.indexOf(activeSrc) !== -1; });
  } else {
    if(activeCat !== 'all') filtered = filtered.filter(function(i){ return i.cat === activeCat; });
    if(activeUrg !== 'all') filtered = filtered.filter(function(i){ return i.urgency === activeUrg; });
  }
  let html = '';
  filtered.forEach(function(item, idx){
    html += cardHtml(item, idx, !!(fromSrc && activeSrc));
  });
  container.innerHTML = html;
}

function toggleCard(id){
  const el = document.getElementById('card-' + id);
  el.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function buildReport(){
  var el = document.getElementById('reportInner');
  var html = '';
  html += '<p><strong>Window:</strong> ' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</p>';
  html += '<p><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp;|&nbsp; <strong>Emails read:</strong> ' + META.emailsRead + ' &nbsp;|&nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</p>';
  html += '<p><strong>Included sources</strong></p><ul>';
  META.includedSources.forEach(function(s){
    html += '<li><span class="src" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span> — ' + s.count + ' item(s)</li>';
  });
  html += '</ul>';
  html += '<p><strong>Skipped sources</strong></p><ul>';
  META.skippedSources.forEach(function(s){
    html += '<li>' + s.name + ' — ' + s.reason + '</li>';
  });
  html += '</ul>';
  el.innerHTML = html;
}

document.getElementById('metaLine').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items';
buildFilterBars();
renderCards();
buildReport();
</script>
