<script>
const ITEMS = [{"cat": "credit", "urgency": "act", "source": "John Authers / Bloomberg Points of Return", "title": "CoreWeave panic: SVB or New Century? The S&P gave opposite answers (+40% vs -40% over 2 years)", "idea": "Authers lines up CoreWeave's credit freefall against New Century (Apr 2007) and SVB (Mar 2023). After both, the S&P went sideways ~6 months, then diverged: +40% over two years after SVB, -40% after New Century. Treasury yields surged ahead of both. In real time SVB looked scarier (bigger VIX spike, bigger rate-expectation collapse) than subprime did.", "angle": "The whole AI-credit debate reduces to one binary: contained idiosyncratic funding problem, or the first crack in a spread business. Positioning for either needs a rent-price signal, not a stock chart.", "tweetA": "Two analogs for CoreWeave: SVB (S&P +40% in 2 years) and New Century (S&P -40%). Both looked identical in real time. The tell isn't the bond yield, it's GPU rental rates. Until H100/B200 rents roll over, I'm treating this as SVB. $CRWV", "tweetB": "In 2007 the market ignored the canary for 8 months. In 2023 it priced the canary as the whole coal mine. Now we have a canary with a $35B debt stack and a yield that's gapping, in a week when 10yr UST is above 5%. Which mistake do we make this time?", "charts": {"count": 3, "hot": true, "desc": "CoreWeave bond yield vs prior failures; S&P path after New Century vs SVB; VIX/rate expectations 2007 vs 2023 — the S&P overlay is the tweetable one"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-20/coreweave-panic-looks-more-like-2023-than-2007", "id": 1}, {"cat": "credit", "urgency": "act", "source": "John Authers / Bloomberg Points of Return", "title": "CoreWeave's attacked bonds are <$2B of a ~$35B stack, 'structurally subordinated to everything else'", "idea": "Barclays' Ajay Rajadhyaksha: the unsecured bonds under fire are under $2B of ~$35B total debt, so pricing says little about the AI buildout. Equity Armor's Stutland calls profitability at higher rates a 'coin flip'. Rajadhyaksha frames every AI infra firm as a spread business: buy GPUs, rent them, pocket rental yield minus financing cost, which only holds while compute demand exceeds supply.", "angle": "Subordinated slice repricing first is exactly how a stress transmits: marginal funding goes, secured holders feel safe, then collateral values (GPU resale) get tested. Watch GPU rental indices and ABS.", "tweetA": "CoreWeave's stressed paper is ~5% of the debt stack. The other 95% is secured against GPUs. So the real question isn't whether the unsecured bonds are money-good. It's what an H100 is worth in 2028 when the secured lenders go to collect.", "tweetB": "Neocloud economics in one line: borrow at 9-10%, rent a depreciating asset, hope rents stay above the carry. Stick 5.25% 10yr Treasuries under that and the 'spread business' starts to look like a negative-convexity trade. $CRWV $NVDA", "charts": {"count": 1, "hot": false, "desc": "CoreWeave yield chart"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-20/coreweave-panic-looks-more-like-2023-than-2007", "id": 2}, {"cat": "geopolitics", "urgency": "act", "source": "John Authers / Bloomberg Points of Return", "title": "France 10yr at 4.933% (highest since 2002), OAT-Bund spread 148bp vs 58bp in March", "idea": "After a weekend of protest violence, OAT yields hit 4.933%, spread to Bunds +10.3bp to 1.48%, widest since 2012 and 2.5x March's 0.58%. Moody's (two notches above S&P/Fitch) reviews by end of week. Mélenchon, who floated reneging on French debt, has prediction-market odds unchanged from January and the violence may have dented him; a Mélenchon vs Le Pen runoff is the tail.", "angle": "A 90bp spread widening in seven months with a ratings catalyst this week. Euro periphery used to be the stress gauge; core is now. Relevant for European bank/sovereign exposure and EUR.", "tweetA": "French 10yr spread to Bunds: 58bp in March, 148bp today. 90bp in seven months with no default risk 'priced'. If Moody's moves Friday, the one-notch buffer disappears, and Mélenchon is on the ballot in 2027.", "tweetB": "Fifteen years of 'periphery is the risk, core is safe'. Now the core is the one with the ratings review this week and a spread at 2012 highs. The tape stopped accepting the premise. $FXE $EWQ", "charts": {"count": 2, "hot": true, "desc": "French 10yr yield since 2002 and Mélenchon prediction-market odds vs OAT spread"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-20/coreweave-panic-looks-more-like-2023-than-2007", "id": 3}, {"cat": "commodities", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "Copper: US exchange stocks at 15x 2020-24 average while tariffs may never come; Macquarie says $10k or $18k", "idea": "Copper is up ~80% in four years but sideways for months. Pre-tariff stockpiling has US exchange inventories at 15x their 2020-24 average. Macquarie: crash toward $10,000/t if Democrats win midterms and Trump rethinks; $18,000 if tariffs land. BCA thinks the administration is reluctant to tariff because the US can't boost output quickly. Longview: 1.7Mt cumulative deficit through 2028 vs ~1Mt visible inventories. BNEF: 36Mt demand by 2035, possible 9Mt shortfall.", "angle": "A binary policy straddle sitting on a structural deficit. The Comex-LME dislocation is the trade; the midterms are the trigger. Pairs with the AI power/grid theme.", "tweetA": "Copper has a $8,000 range on a political coin flip: $10k if the midterms kill tariffs, $18k if they land. Meanwhile the US is warehousing 15x normal inventory to hedge a policy that may never arrive. That's not a market, that's a lottery ticket with storage costs. $COPX $FCX", "tweetB": "Longview: 1.7Mt supply deficit through 2028 versus 1Mt of total visible inventory. Subtract the US stockpile that's stuck on one exchange and the rest of the world is running on fumes. The tariff story is hiding a physical story.", "charts": {"count": 4, "hot": true, "desc": "Copper 4yr +80%; sideways price action; US exchange stocks 15x average (BCA); BHP production -20% on Chile"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-20/coreweave-panic-looks-more-like-2023-than-2007", "id": 4}, {"cat": "geopolitics", "urgency": "watch", "source": "John Authers / Bloomberg Points of Return", "title": "China 'appears on track to hit GDP target despite fears'; BHP copper output -20% on Chile; Blackstone raises $8.7B transition fund", "idea": "Authers' Points: China on track for its growth target; BHP copper production down a fifth on lower Chilean output; Blackstone closed an $8.7B energy transition fund; Anthropic IPO hopes may be 'eclipsed by the cloud companies' (Parmy Olson); France 'burning' (Lionel Laurent); AI agents in the rat race (Thorbecke).", "angle": "A set of Opinion pointers worth opening: BHP's 20% drop is a rare datapoint for ore-grade decline, the Blackstone raise says LPs still want the transition.", "tweetA": "BHP copper output -20% in a year on Chile grades. We keep modelling mining supply like a software business. It's closer to a depleting annuity, and everyone has been underinvesting for a decade. $BHP $SCCO", "tweetB": "Blackstone just raised $8.7B for energy transition in a week where 10yr yields hit 5%+. Capital that can wait 15 years doesn't care about the front end. That's the divergence between duration buyers and trading desks.", "charts": {"count": 0, "hot": false, "desc": "Charts inside linked articles — worth opening"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-20/coreweave-panic-looks-more-like-2023-than-2007", "id": 5}, {"cat": "culture", "urgency": "watch", "source": "John Authers / Bloomberg Points of Return", "title": "A goal from his own half had a 1% chance of scoring. Do we overrate the spectacular long shot?", "idea": "Authers closes on Brighton's Diego Gomez scoring from his own half (1% xG at the boot), the longest-range Premier League goal since Rooney 2017, and asks whether we overrate spectacular low-probability outcomes relative to systematic ones; Curry is his counter-example of making the long shot routine.", "angle": "Maps to every convex trade vs. process debate: the highlight reel is the 1% event, the P&L is the other 99 touches.", "tweetA": "Gomez's halfway-line goal had a 1% xG. Nobody replays the 99 times it doesn't go in. Same selection effect as every 'I called the top' post.", "tweetB": "Steph Curry made the long shot boring by repeating it. That's the actual edge in markets too: boring convexity, not highlights.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-20/coreweave-panic-looks-more-like-2023-than-2007", "id": 6}, {"cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom (JPM takeaways)", "title": "UST 10yr +50bp in September to 5.25%, gilt 30yr >6%, JGB 10yr >3%, OAT highest since 2002: simultaneous 20-year highs", "idea": "JPM's Jay Barry: 'we've begun to run out of superlatives.' US 10yr closed Sept at 5.25% (a 2002 level), the 30yr gilt broke 6% (first since 1998), the 10yr JGB 3% (first since 1996), French 10yr highest since mid-2002. Barry says the Fed repricing explains nearly all of September's rise and flattening, and 'current pricing does not appear to have overrun fundamentals.'", "angle": "Four markets at 20+ year highs together is a global term premium story, not a local one. JPM's own rates head says it's fair, which means no easy mean reversion.", "tweetA": "UST 10yr 5.25%, gilt 30yr >6%, JGB 10yr >3%, OAT at 2002 highs. All in one month. And JPM's head of rates says it isn't overshooting. If that's fair value, the equity risk premium math from a year ago is dead.", "tweetB": "JGB 10yr above 3% for the first time since 1996 is the one nobody's pricing right. Thirty years of Japanese savers exporting capital. What happens when home pays 3%?", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/global-bond-yields-at-multi-decade", "id": 7}, {"cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom (JPM takeaways)", "title": "Treasury doubles max long-end buyback to $4B per op; JPM says UK and Japan precedents faded and it could raise term premium", "idea": "Treasury will at least double the maximum buyback of long-dated debt from $2B to $4B per operation; some expect long-end auction cuts. Barry: auction-size cuts have only had temporary impact in the UK and Japan, and 'could contribute to higher term premium over time' if Treasury gets more opportunistic and drifts from 'regular and predictable'.", "angle": "The US is now running the UK/Japan playbook. Past experience says it buys weeks. The credibility question is the real term premium driver.", "tweetA": "Treasury is now doing buybacks to cap long yields. The UK and Japan did this. Both are at multi-decade yield highs. Debt managers who stop being boring tend to get paid for it in term premium.", "tweetB": "Buying back $4B of 30yr bonds per op against $1T+ annual net interest cost is a rounding error with a signalling cost. Markets read it as 'they're worried' before they read it as support.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/global-bond-yields-at-multi-decade", "id": 8}, {"cat": "credit", "urgency": "deep", "source": "Dark Side of the Boom (JPM takeaways)", "title": "JPM: net interest could go from $1T to $2.1T by 2035 (~5% GDP); +1pt on yields adds $3.5T of debt", "idea": "Joyce Chang: high Treasury yields could more than double US net interest cost from ~$1T to $2.1T by 2035, nearly 5% of GDP. CRFB: running rates 1pp above projections (10yr average 5.3% vs 4.3%) adds $3.5T beyond baseline. Self-reinforcing loop: higher yields to higher deficits to weaker demand for bonds.", "angle": "At 5.25% the 10yr is already above the 'bad' scenario. That doesn't even include defense, tariffs revenue risk, etc.", "tweetA": "CRFB's stress case is 10yr at 5.3% for a decade. We're at 5.25% today. The 'scenario' is the spot price. Net interest at $2.1T by 2035 is the base case with a haircut.", "tweetB": "$2.1T of interest by 2035 is nearly 5% of GDP. At these yields the fiscal dominance trade (long gold, short long duration) stops being a tail hedge and becomes the base case.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/global-bond-yields-at-multi-decade", "id": 9}, {"cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom (JPM takeaways)", "title": "JPM equity strategy: equity-yield correlation flips around 5-5.5% on the 10yr, and $260B tech issuance only adds 10-15bp", "idea": "Matejka: positive equity-yield correlation can persist ('higher yields and higher equity prices in six months') but 'margin of error is getting smaller'; at 5-5.5% 10yr, correlations are at risk of flipping. Panigirtzoglou: $260B extra tech net bond issuance in 2026 adds only 10-15bp to global aggregate yields.", "angle": "10yr already at 5.25% sits inside the flip band. Key variable is the driver: growth/inflation vs term premium.", "tweetA": "JPM puts the regime-flip band at 5-5.5% on the 10yr, where stocks stop treating yields as a growth signal. We're at 5.25%. We're in the band.", "tweetB": "JPM thinks $260B of tech debt = 10-15bp. If you assume the same issuance goes into the shortest-duration, lowest-quality part of the stack, that's not a yield problem, it's a spread one. Watch CRWV and ORCL, not the 10yr.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/global-bond-yields-at-multi-decade", "id": 10}, {"cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom (JPM takeaways)", "title": "ECB seen hiking to 2.75% then again Q1 2027: 'higher neutral rate on AI-driven productivity gains' + Middle East de-escalation faded", "idea": "JPM's Francis Diamond: euro and sterling front-end sell-off reflects tighter policy expectations, global/technical factors, including higher neutral rate expectations on AI productivity gains, and a bigger energy risk premium as hopes of durable Middle East de-escalation faded amid ongoing US-Iran strikes. JPM forecasts one more ECB hike this year to 2.75% and one in Q1 2027.", "angle": "'AI raises r*' is now a sell-side explanation for curves. It's the opposite of the dovish AI-disinflation narrative.", "tweetA": "The new sell-side rationale for higher yields: AI raises the neutral rate. Funny, because the other story was AI is deflationary. Both can't hold. One of them is going to get repriced.", "tweetB": "ECB hiking in 2026-27 while France spreads blow out. That's a policy mix that is hard to model: tighter money against a fiscal solvency scare. $FXE", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/global-bond-yields-at-multi-decade", "id": 11}, {"cat": "positioning", "urgency": "act", "source": "Dark Side of the Boom (Goldman takeaways)", "title": "Goldman desk: record net selling in tech, protection demand surging, but the pressure point is AI credit, not AI demand", "idea": "Goldman trading floor views: the AI trade moved from 'does it matter' to 'who finances it, at what cost, and who captures value.' Stress concentrated in neoclouds and frontier-lab-linked credit; compute demand still strong. Positioning reset violently: protection bought, HFs cutting risk, technology record net selling, yet the broader market is rotating into quality rather than collapsing.", "angle": "Equity positioning flushed while credit is the transmission. If earnings confirm demand, the equity flush is the setup; if rents fall, credit leads.", "tweetA": "Record net selling in tech, protection bid, hedge funds de-grossing. And Goldman says the AI thesis is intact. That's what a positioning flush looks like: the thesis doesn't break, the funding does.", "tweetB": "A year ago the AI bear case was 'no revenue'. Now it's 'revenue is fine but the borrower can't refinance'. Different disease, different trade: short the financing, not the demand.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/drowning-in-the-market-riptide-goldmans", "id": 12}, {"cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom (Goldman takeaways)", "title": "Pasquariello: market is 'cleaner' not 'safer' after one of the largest institutional tech liquidations in years; leadership may shift into November", "idea": "Goldman's Tony Pasquariello: equities absorbed extraordinary punishment last week; the distinction between a cleaner and a safer market matters. One of the largest institutional tech liquidations in years reset positioning, but 'the numbers beneath the surface' allow a different reading. Earnings, buybacks and long rates decide if the correction is an opportunity; a leadership shift looks possible into November.", "angle": "Big week of earnings; buyback blackout ends is the tailwind to watch. Rotation to quality/value is the consensus, which makes it the crowded counter-trade.", "tweetA": "Cleaner is not safer. Positioning has been reset, but the rate that caused it hasn't. Buybacks come back after earnings; the 10yr doesn't have to.", "tweetB": "Goldman flags a leadership shift into November. If the leaders were AI and the replacement is 'quality', ask what quality looks like at 5.25% on the 10yr. Cash-rich, low capex, low debt. That's a very different index.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-takes-it-on-the-chin", "id": 13}, {"cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ #1245", "title": "GPT-6 'Astra' took ~an octillion FLOPs: 50 million x GPT-1 in 8 years, ~9x per year vs Moore's Law at 1.4x", "idea": "Via NYT/Epoch: GPT-1 (2018) 18 quintillion calcs; GPT-3.5 2.6 septillion; GPT-4 over a million x GPT-1; GPT-6 Astra nearly an octillion. That's ~9x/yr for OpenAI, 4-5x/yr across the frontier. Moore's Law needed 51 years for the same 50M-fold climb; GPT did it in 8. Chips improve only ~1.3x/yr; the rest is buying more of them.", "angle": "Parekh's framing is right: it's a spending curve, not a technology curve. That's the key to the capex and credit story.", "tweetA": "Moore's Law gave you 50 millionfold in 51 years. GPT training compute did it in 8. And chips only improved 1.3x a year. The other 95% of that curve is capex. That's why the credit markets are involved.", "tweetB": "Every 'AI is a bubble' chart plots stock prices. The honest chart is training FLOPs at 9x a year, financed at 5%+ rates. One of those two curves bends.", "charts": {"count": 2, "hot": true, "desc": "Ladder of big numbers GPT-1 to nonillion; Moore's Law vs training compute — the 50M x in 8 yrs vs 51 yrs comparison is the tweetable chart"}, "link": "https://michaelparekh.substack.com/p/ai-ai-loops-101-part-2-from-gpt-1", "id": 14}, {"cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ #1245", "title": "An octillion calcs: 13M years on an iPhone 17 Pro, 64k years on one H100, 8 months on 100k H100s, 4-6 days on a Vera Rubin gigawatt", "idea": "Times/Epoch table: iPhone 13M yrs, PS5 3M, gaming PC 300k, single H100 64k, 100k-H100 cluster ~8 months. A gigawatt holds ~7x that cluster (about 5 weeks); a GW of Vera Rubin racks (~9 zettaflops peak, 3-5x derated) does it in 4-6 days.", "angle": "This is the translation from capex to compute: $50B+ per GW buys a GPT-6 scale training run per week.", "tweetA": "One GW of Vera Rubin does a GPT-6-scale training run in under a week. A year ago that took 100k GPUs eight months. Compute per dollar isn't the story. Compute per megawatt is. $NVDA", "tweetB": "If a gigawatt can repeat a frontier run every 5 days, the limit isn't hardware, it's whether there are 50 more GPT-6s worth training. That's the demand question behind every neocloud's debt.", "charts": {"count": 1, "hot": false, "desc": "Time-to-octillion table by hardware"}, "link": "https://michaelparekh.substack.com/p/ai-ai-loops-101-part-2-from-gpt-1", "id": 15}, {"cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ #1245", "title": "Memory wall: server compute +60,000x since 1996, memory bandwidth +100x, interconnect +30x; SK Hynix sees no balance before 2030", "idea": "Gholami et al.: 1996-2023 peak compute grew ~60,000x vs memory bandwidth ~100x and interconnect ~30x. Training needs ~16 bytes/param (a 1T-param model is 16TB, ~200 H100s of HBM before data). A 128k-token Llama-70B chat holds ~40GB of KV cache. Nvidia's CFO called memory pricing extreme and rising; SK Hynix sees no balance until 2030 at earliest.", "angle": "Memory is the real binding constraint; supports the HBM oligopoly view ($MU, SK Hynix, Samsung) and anything addressing KV cache offload (CXL, optical interconnect).", "tweetA": "Compute up 60,000x since 1996. Memory bandwidth up 100x. A single 128k-token chat on a 70B model holds 40GB of KV cache. Every agent that 'thinks for hours' is a memory purchase order. $MU", "tweetB": "SK Hynix says supply-demand doesn't balance until 2030. Memory has historically been the most cyclical corner of semis. If this cycle isn't one, the multiples you'd pay for it need rewriting.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-ai-loops-101-part-2-from-gpt-1", "id": 16}, {"cat": "energy", "urgency": "deep", "source": "Michael Parekh / AI-RTZ #1245", "title": "Frontier training power doubling annually: 100MW today to 4-16GW by 2030; US AI demand 5GW to 50GW+", "idea": "Epoch: compute 4x/yr, offset by ~2x/yr efficiency gains (hardware 12x/decade, lower precision 8x, longer runs 4x), so power doubles yearly. Largest runs draw >100MW now; Epoch/EPRI see 4-16GW by 2030, equal to NYC. US AI power could go 5GW to 50GW+ (~12% of US electricity). Grok 4 training ~$490M and 150kt CO2; many sites run on gas.", "angle": "Power, not chips, caps scaling; Epoch itself thinks the feasible 2030 run is only ~1/5 of the naive nonillion. Gas turbines, behind-the-meter, nuclear PPAs all in play.", "tweetA": "Frontier training power doubles every year. 100MW now, 4-16GW by 2030. The binding input is a grid interconnect queue, not a TSMC wafer. Own the electrons: $GEV $VST $CEG.", "tweetB": "Epoch's own math says the largest feasible 2030 run is about a fifth of what the labs have pencilled. If power caps scaling, the first thing to compress isn't demand, it's the multiple on capex-sensitive suppliers.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-ai-loops-101-part-2-from-gpt-1", "id": 17}, {"cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ #1245", "title": "One Millennium Prize attempt: 4.9M agent messages over 5 days, ~$15M at list. Thirty of those = Grok 4's training bill", "idea": "Per the Times, OpenAI's agents sent 4.9M messages over five days on a math problem, ~$15M at Astra list pricing. Grok 4 cost ~$490M to train, so ~30 such problems equal it. Inference stacks on top of training (reasoning, agents). Parekh: GW costs $50B+; a GW is the power of ~50M human brains at 20W each; compute commitments: OpenAI $750B, Anthropic $517B.", "angle": "Inference as the larger loop; also a pricing signal: $15M for one problem is the price at which AI labor is competitive with elite human labor only for a few problem types.", "tweetA": "$15M of inference for one math problem. Roughly 30 of those equal the cost to train Grok 4. The training-vs-inference capex split everyone argues about flips the moment agents run for days.", "tweetB": "A gigawatt is 50 million human brains of power. A child learns the physical world on 20 watts. The 10-trillion var state={cat:'All',urg:'All',src:null};

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function toggle(id){document.getElementById('c'+id).classList.toggle('open');}
