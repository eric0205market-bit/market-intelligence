const META = {
  date:"2026-08-31", time:"09:19 CEST",
  windowStart:"2026-08-31 03:14 CEST", windowEnd:"2026-08-31 09:19 CEST",
  emailsInWindow: 10, emailsRead: 9, itemsExtracted: 28,
  includedSources: [
    {name:"The Dark Side of the Boom", count:3},
    {name:"Topdown Charts / Callum Thomas", count:2},
    {name:"Michael Parekh (AI-RTZ)", count:3},

    {name:"AI News roundup (Salazar Slytherin)", count:8},
    {name:"BowtiedBull", count:1}
  ],
  skippedSources: [
    {name:"GitHub notifications — 'Merge to main' run failed (05:49 UTC)", reason:"Automated CI/build notification, not newsletter or analytical content — excluded per routine rules."},
    {name:"SixSigmaCapital — 'Preview of the Week Ahead' (23:03 UTC Aug 30) and all earlier mail", reason:"Outside the 6-hour window — sent before the 01:14 UTC / 03:14 CEST cutoff, not processed."},
    {name:"Topdown Charts AMA reminder text itself", reason:"Live-stream event announcement with no analytical content — the two chart teasers embedded in the same email (items #2, #3) were extracted separately."}
  ]
};

const CAT_COLORS = {
  macro:"var(--macro)", credit:"var(--credit)", positioning:"var(--positioning)",
  "AI/infra":"var(--aiinfra)", crypto:"var(--crypto)", geopolitics:"var(--geopolitics)",
  energy:"var(--energy)", tech:"var(--tech)", gold:"var(--gold)", culture:"var(--culture)",
  labor:"var(--labor)", regulation:"var(--regulation)", science:"var(--science)", venture:"var(--venture)"
};
const URG_META = {
  act:{emoji:"🔴", label:"Act Now"},
  deep:{emoji:"🔵", label:"Deep"},
  watch:{emoji:"🟡", label:"Watch"}
};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function catColor(c){ return CAT_COLORS[c] || "#999"; }

function buildFilters(){
  const catCounts = {};
  ITEMS.forEach(i => catCounts[i.cat] = (catCounts[i.cat]||0)+1);
  const catBar = document.getElementById('catFilters');
  let html = `<div class="pill active" data-catall="1" onclick="setCat('all')">All (${ITEMS.length})</div>`;
  Object.keys(catCounts).sort().forEach(c => {
    html += `<div class="pill" data-cat="${c}" onclick="setCat('${c}')">${c} (${catCounts[c]})</div>`;
  });
  catBar.innerHTML = html;

  const urgCounts = {act:0, deep:0, watch:0};
  ITEMS.forEach(i => urgCounts[i.urgency]++);
  const urgBar = document.getElementById('urgFilters');
  let uhtml = `<div class="pill active" data-urgall="1" onclick="setUrg('all')">All (${ITEMS.length})</div>`;
  Object.keys(URG_META).forEach(u => {
    uhtml += `<div class="pill" data-urg="${u}" onclick="setUrg('${u}')">${URG_META[u].emoji} ${URG_META[u].label} (${urgCounts[u]})</div>`;
  });
  urgBar.innerHTML = uhtml;
}

function setCat(c){
  activeCat = c; activeSrc = null;
  document.querySelectorAll('#catFilters .pill').forEach(p => {
    const isAll = p.hasAttribute('data-catall');
    const match = isAll ? c === 'all' : p.getAttribute('data-cat') === c;
    p.classList.toggle('active', match);
    p.style.background = match && !isAll ? catColor(c) : (match && isAll ? '#333' : '#fff');
    p.style.color = match ? '#fff' : 'var(--text)';
    p.style.borderColor = match ? 'transparent' : 'var(--border)';
  });
  render();
}
function setUrg(u){
  activeUrg = u; activeSrc = null;
  const uColors = {act:'#e24b4a', deep:'#378add', watch:'#b8860b'};
  document.querySelectorAll('#urgFilters .pill').forEach(p => {
    const isAll = p.hasAttribute('data-urgall');
    const match = isAll ? u === 'all' : p.getAttribute('data-urg') === u;
    p.classList.toggle('active', match);
    p.style.background = match ? (isAll ? '#333' : uColors[u]) : '#fff';
    p.style.color = match ? '#fff' : 'var(--text)';
    p.style.borderColor = match ? 'transparent' : 'var(--border)';
  });
  render();
}
function filterBySrc(name){
  activeCat = 'all'; activeUrg = 'all'; activeSrc = name;
  document.querySelectorAll('#catFilters .pill, #urgFilters .pill').forEach(p=>{
    const isAllCat = p.hasAttribute('data-catall');
    const isAllUrg = p.hasAttribute('data-urgall');
    p.classList.toggle('active', isAllCat || isAllUrg);
    p.style.background = (isAllCat || isAllUrg) ? '#333' : '#fff';
    p.style.color = (isAllCat || isAllUrg) ? '#fff' : 'var(--text)';
    p.style.borderColor = (isAllCat || isAllUrg) ? 'transparent' : 'var(--border)';
  });
  render(true);
}

function toggleCard(id){
  const el = document.getElementById('card-'+id);
  el.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function render(expandMatches){
  const container = document.getElementById('cards');
  let html = '';
  let shown = 0;
  ITEMS.forEach(item => {
    let visible = true;
    if(activeSrc){ visible = item.source.indexOf(activeSrc) !== -1; }
    else {
      if(activeCat !== 'all' && item.cat !== activeCat) visible = false;
      if(activeUrg !== 'all' && item.urgency !== activeUrg) visible = false;
    }
    if(!visible) return;
    shown++;
    const col = catColor(item.cat);
    const urg = URG_META[item.urgency];
    const openClass = (activeSrc) ? ' open' : '';
    const chartBadge = item.charts.count > 0 ? (item.charts.hot ? '🔥' : '📊') : '';
    html += `<div class="card${openClass}" id="card-${item.id}">
      <div class="card-head" onclick="toggleCard(${item.id})">
        <span class="idx">${String(item.id).padStart(2,'0')}</span>
        <span>${urg.emoji}</span>
        <span class="badge" style="background:${col}">${item.source.split(' (')[0]}</span>
        <span class="tag">${item.cat}</span>
        ${chartBadge ? `<span>${chartBadge}</span>` : ''}
        <span class="htitle">${item.title}</span>
      </div>
      <div class="card-body">
        <div class="label">The Idea</div>
        <div class="idea">${item.idea}</div>
        <div class="label">My Angle</div>
        <div class="angle" style="border-left:2px solid ${col}; background:${col}14;">${item.angle}</div>
        <div class="label">Tweets</div>
        <div class="tweets">
          <div class="tweet">
            <div class="twlabel" style="color:#378add;">TWEET A</div>
            <div class="txt">${item.tweetA}</div>
            <button class="copy-btn" onclick="copyTweet(${item.id},'a')">📋 Copy</button>
          </div>
          <div class="tweet">
            <div class="twlabel" style="color:#7f77dd;">TWEET B</div>
            <div class="txt">${item.tweetB}</div>
            <button class="copy-btn" onclick="copyTweet(${item.id},'b')">📋 Copy</button>
          </div>
        </div>
        <div class="charts-box${item.charts.hot ? ' hot':''}">
          ${item.charts.count > 0 ? (item.charts.hot ? '🔥 CHART WORTH SAVING — ' : '📊 ') : '— '}${item.charts.desc}
        </div>
        <div class="linkrow"><a href="${item.link}" target="_blank" rel="noopener">↗ Read full article</a></div>
      </div>
    </div>`;
  });
  container.innerHTML = html;
  document.getElementById('noresults').style.display = shown === 0 ? 'block' : 'none';
}

function buildReport(){
  const el = document.getElementById('report');
  let srcRows = META.includedSources.map(s =>
    `<div class="srcline"><span class="name" onclick="filterBySrc('${s.name.replace(/'/g,"\\'")}')">${s.name}</span><span>${s.count} item${s.count>1?'s':''}</span></div>`
  ).join('');
  let skipRows = META.skippedSources.map(s =>
    `<div class="skip"><strong>${s.name}</strong> — ${s.reason}</div>`
  ).join('');
  el.innerHTML = `<details class="report-card">
    <summary>📋 Session Report — ${META.emailsRead} of ${META.emailsInWindow} emails read, ${META.itemsExtracted} items extracted</summary>
    <div style="margin-top:12px; font-size:13px; color:var(--sub);">
      Window: <strong>${META.windowStart}</strong> → <strong>${META.windowEnd}</strong>. Emails outside this window were not processed.
    </div>
    <div class="label" style="margin-top:14px;">Included Sources (click to filter)</div>
    ${srcRows}
    <div class="label" style="margin-top:14px;">Skipped / Excluded</div>
    ${skipRows}
  </details>`;
}

document.getElementById('metaline').textContent =
  `${META.date} · ${META.time} · ${META.itemsExtracted} items from ${META.includedSources.length} sources (${META.emailsRead}/${META.emailsInWindow} emails read)`;

buildFilters();
render();
buildReport();
</script>
</body>
