<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px;
          flex-wrap: wrap; gap: 6px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; white-space: pre-wrap; }
.summary p:last-child { margin-bottom: 0; }

.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px; min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

.theme { padding: 10px 16px 4px; font-size: 12.5px; font-style: italic; color: var(--text-2); }

.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-relayers { margin-top: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }

.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh; box-shadow: 0 8px 40px rgba(0,0,0,.6); }

.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>
</head>

2026-08-29T13:46:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Retirement solutions for small businesses\n\nThis reminds me... I have to correct my CPA regarding the '$500 per year for three years for selecting autoenrollment' tax credit.... the Auto Contribution Arrangement\n\n$72k into a Solo 401k is pretty sweet action though JPMAM https://t.co/NJMOAFlFBh", "tweet_url": "https://x.com/MikeZaccardi/status/2093692899158299089", "images": ["https://pbs.twimg.com/media/HQ5KmMfXYAAxLMY.jpg"], "created_at": "2026-08-29T13:31:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Yo all you W2 workers... be sure to click that 'auto-escalation' button on your 401(k)... makes a big difference JPMAM GTR https://t.co/06KLLbdxti", "tweet_url": "https://x.com/MikeZaccardi/status/2093689124259606861", "images": ["https://pbs.twimg.com/media/HQ5HKdgXYAACLCQ.jpg"], "created_at": "2026-08-29T13:16:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "A 1% rate decline would mean double-digit annual gains across most of fixed income. \n\nThat could never happen, right? JPMAM https://t.co/r2wJaFFrtw", "tweet_url": "https://x.com/MikeZaccardi/status/2093685349297852437", "images": ["https://pbs.twimg.com/media/HQ5DuveWEAABwzs.png"], "created_at": "2026-08-29T13:01:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Federal net debt as a % of GDP was below 40% pre-GFC\n\n101% today... set to tag 120% by 2036 JPMAM https://t.co/pHIFyWZoLf", "tweet_url": "https://x.com/MikeZaccardi/status/2093681573488955659", "images": ["https://pbs.twimg.com/media/HQ5AS_pWsAA91rr.png"], "created_at": "2026-08-29T12:46:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Household debt service ratio remains below pre-pandemic levels JPMAM https://t.co/0hXmU3dYws", "tweet_url": "https://x.com/MikeZaccardi/status/2093677799072539038", "images": ["https://pbs.twimg.com/media/HQ483R0WgAAn9f8.png"], "created_at": "2026-08-29T12:31:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "🐊 Corporate profits soar as labor's share shrinks📈📉 JPMAM \n\n• 15-Year Divergence: Record share of national income flowing to capital over wages\n• Wealth Gap: Capital gains concentrate among top earners, fueling unequal growth https://t.co/w7TYsTRkDi", "tweet_url": "https://x.com/MikeZaccardi/status/2093674024010220013", "images": ["https://pbs.twimg.com/media/HQ45bi7XYAAgT0d.png"], "created_at": "2026-08-29T12:16:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "As we talked about on the pod, the IG credit spread remains historically low... 79bps JPMAM @DustinTerry00 @CurioCapMGMT https://t.co/31s0t5E3j9", "tweet_url": "https://x.com/MikeZaccardi/status/2093668236592074864", "images": ["https://pbs.twimg.com/media/HQ40KpJW0AABAVU.jpg"], "created_at": "2026-08-29T11:53:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "EM trades at a historically low 10.4x P/E $EEM JPMAM https://t.co/jaMIU1DRvg", "tweet_url": "https://x.com/MikeZaccardi/status/2093659478948290759", "images": ["https://pbs.twimg.com/media/HQ4sM6AW8AALBps.png"], "created_at": "2026-08-29T11:18:12.000Z", "relayers": []}]}, {"bank": "Goldman", "theme": "Goldman on refined-products/oil margins and low refinery runs through 2026-27, plus short interest and a payrolls-revision note", "items": [{"author": "MikeZaccardi", "text": "GS: Short interest on the median S&amp;P 500 stock jumped to decade-highs https://t.co/7ra89OBp0v", "tweet_url": "https://x.com/MikeZaccardi/status/2093672011373420995", "images": ["https://pbs.twimg.com/media/HQ43mX6XkAAqx_x.png"], "created_at": "2026-08-29T12:08:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: A Steepening Upward Trend in Refinery Outages May Persistently Increase a Forward-Looking Risk Premium of Product Margins https://t.co/vYvVmOJGWb", "tweet_url": "https://x.com/MikeZaccardi/status/2093670249082106210", "images": ["https://pbs.twimg.com/media/HQ41_0rWIAAiT5s.png"], "created_at": "2026-08-29T12:01:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: We Expect Global Refinery Runs to Remain Low Throughout 2026 and Only Recover to Their Seasonal Norms by 2027H2 https://t.co/hex5VJDMLO", "tweet_url": "https://x.com/MikeZaccardi/status/2093666480139256237", "images": ["https://pbs.twimg.com/media/HQ4ykHRW0AAqDTd.png"], "created_at": "2026-08-29T11:46:01.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Global Exports of Refined Products Declined 6mb/d Year-Over-Year, with the Persian Gulf and Russia Accounting for 75% of This Decline https://t.co/HEhuq7e918", "tweet_url": "https://x.com/MikeZaccardi/status/2093662699489989095", "images": ["https://pbs.twimg.com/media/HQ4vIYKWwAANs66.png"], "created_at": "2026-08-29T11:31:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: We Upgrade Our Diesel and Gasoline Margins Forecasts for 2026Q4 and 2027, and Now Expect US Diesel Margins to Remain Above $60/bbl Through 2027 https://t.co/mwX7hlI1aQ", "tweet_url": "https://x.com/MikeZaccardi/status/2093658924893274544", "images": ["https://pbs.twimg.com/media/HQ4rsp6XwAAiDRK.png"], "created_at": "2026-08-29T11:16:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Global Refined Products Wholesale Prices Increased by Nearly $50 Year-Over-Year, with Diesel Accounting for Nearly 40% of the Post-February Rally https://t.co/3WAZoMFQvl", "tweet_url": "https://x.com/MikeZaccardi/status/2093655149612814473", "images": ["https://pbs.twimg.com/media/HQ4oQ6TX0AA8SrQ.jpg"], "created_at": "2026-08-29T11:01:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: BLS Estimates 79k Downward Revision to Payroll Employment in March 2026\n\n'We think today’s downward revision to payroll growth will be revised up in the final revision' https://t.co/DBd61703eT", "tweet_url": "https://x.com/MikeZaccardi/status/2093409783407677648", "images": ["https://pbs.twimg.com/media/HQ1JGs9W0AEMTNn.png"], "created_at": "2026-08-28T18:46:00.000Z", "relayers": []}]}, {"bank": "Apollo/Slok", "theme": "Apollo's Slok: rising risk that long rates are materially lower six months from now", "items": [{"author": "MikeZaccardi", "text": "The risk is rising that long rates six months from now could be much lower than they are today. $TLT $TYX \n\nTorste at Apollo https://t.co/XarWk4KOko", "tweet_url": "https://x.com/MikeZaccardi/status/2093734423141232824", "images": ["https://pbs.twimg.com/media/HQ5wXLBXkAAPI0V.jpg"], "created_at": "2026-08-29T16:16:00.000Z", "relayers": []}]}]};

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function fmtDate(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return iso;
  return dt.toISOString().replace('T', ' ').replace(/:\d\d\.\d+Z$/, ' UTC');
}

function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderRelayers(relayers) {
  if (!relayers || !relayers.length) return '';
  return `<div class="item-relayers">also carried by: ` +
    relayers.map(r => `@${escapeHtml(r)}`).join(', ') + `</div>`;
}

function renderItem(item) {
  return `
    <div class="item-card">
      <div class="item-head">
        <span class="item-author">@${escapeHtml(item.author)}</span>
        <span class="item-time">${escapeHtml(fmtDate(item.created_at))}</span>
        <a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>
      </div>
      <div class="item-text">${escapeHtml(item.text)}</div>
      ${renderCharts(item.images)}
      ${renderRelayers(item.relayers)}
    </div>`;
}

function renderBankSection(bank, idx) {
  const letter = String.fromCharCode(65 + idx);
  const items = (bank.items || []).map(renderItem).join('') || '<div class="empty">No items.</div>';
  const theme = bank.theme ? `<div class="theme">${escapeHtml(bank.theme)}</div>` : '';
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(bank.bank)}</span>
        <span class="section-count">${(bank.items || []).length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${theme}${items}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${escapeHtml(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function toggleSection(el) { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('lightbox').classList.contains('open')) closeLightbox();
});

function renderStats(d) {
  const s = d.input_stats || {};
  const parts = [];
  parts.push(`total <strong>${s.total_tweets ?? 0}</strong>`);
  parts.push(`considered <strong>${s.considered ?? 0}</strong>`);
  parts.push(`kept <strong>${s.kept ?? 0}</strong>`);
  parts.push(`dropped <strong>${s.dropped ?? 0}</strong>`);
  parts.push(`deduped <strong>${s.deduped ?? 0}</strong>`);
  parts.push(`banks <strong>${(d.banks || []).length}</strong>`);
  return parts.join(' | ');
}

function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = 'collected ' + fmtDate(d.collected_at) + ' · window ' + (d.window_days ?? '?') + 'd';

  const sections = [
    renderSummary(d.summary),
    (d.banks || []).map(renderBankSection).join('') || '<div class="empty">No bank research this cycle.</div>'
  ].join('');

  document.getElementById('app').innerHTML = sections;

  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
