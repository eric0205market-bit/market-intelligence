<!DOCTYPE html>
<html lang="en">
<head>

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

Notable:** **andrewchen**'s long essay asks whether AI agents have network effects (answer: not inherently, but they can be designed in); **Token2049** week in Singapore dominates crypto-Twitter.", "sections": {"A_events": [{"cluster": "Reflection AI's Open-Weight Model Launch — 'Western Open Frontier' Trails Chinese Models", "category": ["AI", "tech"], "items": [{"author": "AnjneyMidha", "summary": "Cheers the Reflection AI launch (Beam: 501B total / 23B active parameters, trained from scratch, full weights due this month) and says the West needs '10x more efforts like this'.", "tweet_url": "https://x.com/AnjneyMidha/status/2107195098547253747", "images": [], "type": "tweet", "category": ["AI"]}, {"author": "dylan522p", "summary": "Enthusiastic one-line congratulation to @reflection_ai on the release.", "tweet_url": "https://x.com/dylan522p/status/2107196981978464694", "images": [], "type": "tweet", "category": ["AI"]}, {"author": "hosseeb", "summary": "Calls the launch a disappointment: the US-made open-weight model is worse than every major Chinese model despite billions raised, and 'advancing the Western open frontier' is like becoming US national Mahjong champion. Argues a fresh pretrain is unlikely to be valuable (Tinker/Nemotron adoption is negligible); better to distill Chinese models and post-train them so Western firms get versions free of sleeper-agent or benchmaxxing risk. In replies he defends comparing against GLM 5.2/5.3 (same architecture, 5.3 clearly stronger).", "tweet_url": "https://x.com/hosseeb/status/2107253501088915934", "images": [], "type": "thread", "category": ["AI"]}, {"author": "cryptopunk7213", "summary": "Agrees it is a 'disappointing launch': once benchmarks are updated to the latest Chinese open models it trails badly. Takeaways: US open-source research is 1-2 years behind China (talent premium), and open source will always trail centralized frontier models ('I hope I'm wrong'). Quotes a bullish take that a US frontier open model would draw every Fortune 500 company wanting to train on proprietary data.", "tweet_url": "https://x.com/cryptopunk7213/status/2107321718779863548", "images": ["https://pbs.twimg.com/media/HT6173pW0AA03yb.jpg"], "type": "tweet", "category": ["AI"]}]}, {"cluster": "Frontier-Lab Economics — Meta/Microsoft Trim Claude, OpenAI $30B Round, Subscription Value", "category": ["AI", "tech"], "items": [{"author": "cryptopunk7213", "summary": "Reports (from an article, with charts) that Meta and Microsoft have each cut Claude usage ~50%: ~30,000 Meta employees now use in-house MetaCode (Meta Claude-user count fell from 60K to 30K per the article); Microsoft routes to open models or cheaper GPT. Notes that last year 2 customers were 27% of Anthropic revenue and both were on track to spend $1B+, so costs must be significant to justify switching even though both clearly benefit from Claude.", "tweet_url": "https://x.com/cryptopunk7213/status/2107261697996054869", "images": ["https://pbs.twimg.com/media/HT5_WMiW8AAI2Pk.jpg", "https://pbs.twimg.com/media/HT5_WMrW4AAZHn4.jpg"], "type": "thread", "category": ["AI", "tech"]}, {"author": "cryptopunk7213", "summary": "On the report that OpenAI is in talks with UAE funds incl. MGX to anchor a $30B round: unlike Anthropic, OpenAI doesn't want to IPO soon — Altman hinted it's easier to govern building superintelligence privately and public shareholders slow you down. Solution: 'raise billions into oblivion and own your land'.", "tweet_url": "https://x.com/cryptopunk7213/status/2107294619826311233", "images": [], "type": "tweet", "category": ["AI"]}, {"author": "dylan522p", "summary": "Says the value difference between Anthropic/OpenAI subscriptions and others is 'insane' — his team tested Meta, Minimax, Kimi, Grok and Cursor plans — and tells a reader to use both. Quotes a thread arguing a plan's worth can only be judged via credits consumed per (model, token type).", "tweet_url": "https://x.com/dylan522p/status/2107259067693748373", "images": [], "type": "thread", "category": ["AI"]}, {"author": "dylan522p", "summary": "Heated exchange with @insane_analyst, who accused him of pumping: he says the OAI-vs-Anthropic subscription analysis took over a month, was retested repeatedly as methodology was refined, and that large variance in results is why it is hard. Says he owns zero public equities and no Anthropic/OpenAI equity.", "tweet_url": "https://x.com/dylan522p/status/2107249593079718288", "images": ["https://pbs.twimg.com/media/HT53bbAbwAABTUI.jpg"], "type": "thread", "category": ["AI"]}, {"author": "dgt10011", "summary": "Quotes a Semafor item that NY Fed officials have been visiting JPMorgan, Wells Fargo, Barclays and Morgan Stanley to review loans to private-credit firms (exposure, risk management, collateral quality). His own comment is a cryptic aside about Anthropic 'running out of time… if only it hadn't paced so much'; the link to the quoted item is unclear.", "tweet_url": "https://x.com/dgt10011/status/2107276777425137936", "images": [], "type": "tweet", "category": ["macro", "AI"]}]}, {"cluster": "Cerebras (CBRS) vs. Jane Street / Ultrafast Inference — Point-by-Point Rebuttal", "category": ["AI", "tech", "positioning"], "items": [{"author": "goodalexander", "summary": "Long, disclosed-short ($CBRS) rebuttal of a bullish article, written so the call can be scored in coming quarters. Key points: SemiAnalysis said Jane Street makes ~$200M, not pays it; OpenAI doesn't buy chips — they're delivered via CBRS cloud on a 3-year lease with CBRS carrying capex (OpenAI only has a '27 purchase option); the article's own math implies 26.7x not 7.5x; 'Ultrafast' was never offered publicly on Cerebras and GPT-6 Astra Ultrafast runs on Blackwell. Competition: Nvidia paid $20B for Groq tech, OpenAI's Broadcom chip guides 1.3GW in '27 and >5GW in '28 (~7x the Cerebras deal), AMD is buying Talaas. Margins are deteriorating, not scarce-looking: core GM 46.5% -> 40.6% -> 38-40% guide, core op margin guided -23% to -25%, Q2 GAAP loss $450.5M; on GPT-OSS 120B Cerebras charges $0.35/$0.75 vs Groq $0.15/$0.60. Anthropic cut its fast-mode premium three times and has 3.5GW TPU capacity from 2027 (5x the CBRS deal). Insiders took $200M out at ~$185-200 at IPO and VCs' cost base is $15-89, so he expects selling; base case is 'a very good dip to buy' even if revenue lands 13x the Street in FY2028.", "tweet_url": "https://x.com/goodalexander/status/2107272193487036553", "images": [], "type": "tweet", "category": ["AI", "positioning"]}, {"author": "cryptopunk7213", "summary": "Reacting to a post on 'high-frequency personal agent wars of 2027': says this is why Jane Street pays $100Ms for milliseconds of latency via specialized AI chips; lightning-fast inference is 'quant trading but for your entire life'.", "tweet_url": "https://x.com/cryptopunk7213/status/2107171131904209349", "images": [], "type": "tweet", "category": ["AI"]}]}, {"cluster": "CFTC Crypto Rulemaking (Reg CTX / Reg CAM) and the Fading Clarity Act", "category": ["regulation", "crypto"], "items": [{"author": "jchervinsky", "summary": "Although the Clarity Act did not pass, there was broad agreement that crypto market structure should be federally regulated; calls the CFTC's proposed opt-in framework for certain exchanges (Reg CTX and Reg CAM, from Chairman Selig) 'a big step'.", "tweet_url": "https://x.com/jchervinsky/status/2107153023076057280", "images": [], "type": "tweet", "category": ["regulation", "crypto"]}, {"author": "Crypto_McKenna", "summary": "Posts only 'Hyperliquid' as a reaction to the CFTC advance notice of proposed rulemaking on Regulation Crypto Asset Transactions and Regulation Crypto Asset Markets — implicitly signaling Hyperliquid as a beneficiary.", "tweet_url": "https://x.com/Crypto_McKenna/status/2107201226781642774", "images": [], "type": "tweet", "category": ["crypto", "regulation"]}, {"author": "Delphi_Digital", "summary": "Hivemind clip: Yan says few were bullish on Clarity passing given political polarization, but friendly SEC guidance arriving soon after let the tokenization wave continue and take off faster than expected.", "tweet_url": "https://x.com/Delphi_Digital/status/2107184048732872724", "images": [], "type": "tweet", "category": ["crypto", "regulation"]}, {"author": "punk6529", "summary": "Excited ('!!!') reaction to a post saying the 'unhosted wallet' rule is dead.", "tweet_url": "https://x.com/punk6529/status/2107247858910941651", "images": [], "type": "tweet", "category": ["regulation", "crypto"]}]}, {"cluster": "ZRO / LayerZero Catalyst Trade — 'Coordinated Shill' Accusations", "category": ["crypto", "positioning"], "items": [{"author": "thedefivillain", "summary": "Responds to the claim ZRO is a coordinated shill (jokingly admits to the 'cabal'): rationale is high mindshare with low FDV relative to attention, a good chart, a laggard that was 'unpumped' vs peers a week earlier, people shill when momentum appears, and two clear catalysts (Atlas + Zero launch) — catalyst trades are often great risk/reward in crypto.", "tweet_url": "https://x.com/thedefivillain/status/2107259641331892726", "images": [], "type": "thread", "category": ["crypto", "positioning"]}, {"author": "Evan_ss6", "summary": "Quoting an update that ZRO's unlock overhang is overstated (Foundation/Labs buybacks plus institutions bought ~20% of supply in 18 months), he says 1-2 good ATLAS venues at launch would 'mega moon' it, awaiting names and the role of Tier-1 TradFi partners; Avi's podcast made him more bullish ('cautiously optimistic'). Replies that it was a textbook technical setup: launch guided for Fall and price broke the prior range on the first day of Fall; notes few posts besides Avi, HSC and ZRO permabulls.", "tweet_url": "https://x.com/Evan_ss6/status/2107251805923037197", "images": ["https://pbs.twimg.com/tweet_video_thumb/HT5-IXsWgAAAc-e.jpg"], "type": "thread", "category": ["crypto", "positioning"]}, {"author": "ercwl", "summary": "In a back-and-forth with @thedefivillain and @saylor on whether STRC would re-peg, clarifies his earlier view (that it couldn't fail to re-peg unless BTC went sub-$60k in a bear market) was controversial given its date. thedefivillain replies that by the old standard it has effectively re-pegged (long was a great trade) but not by today's standard.", "tweet_url": "https://x.com/ercwl/status/2107164410175173074", "images": [], "type": "tweet", "category": ["crypto", "macro"]}]}, {"cluster": "Onchain Capital Formation & RWA — Umia, DAWN USD.Infra, $FT Buybacks", "category": ["crypto", "tech"], "items": [{"author": "0xSammy", "summary": "Umia jumped 21% to a ~$40M market cap after announcing a raise: its public auction closed with $6M from ten funds (Galaxy, DCG, Draper Associates, RenGen, Alpha EV, Maven 11, Eon Capital) and ~700 individuals. The platform lets founders raise and launch tokens with legal structure and treasury built in and uses 'decision markets' so participants decide which major decisions create most value. He is bullish on compliant onchain entities and the 'wisdom of crowds' mechanism and flags the incubated pipeline.", "tweet_url": "https://x.com/0xSammy/status/2107178193291813332", "images": ["https://pbs.twimg.com/media/HT4y2pIXgAEvc4L.jpg"], "type": "thread", "category": ["crypto"]}, {"author": "Crypto_McKenna", "summary": "Extends a 'Starlink is a DePIN company' thesis: token rewards only suit early bootstrapping; better to fund deployments with real-world yield. Arete likes the term 'USD.CapEx' — a yield-bearing stablecoin of a vault managing real infrastructure. DAWN does this with USD.Infra: on-chain credit funds telecom deployments with yield flowing back to holders; 4 deployments executed, 21 in pipeline, each expanding ISP coverage. Calls it 'the future of DePIN/RWA' and praises the transparency dashboard.", "tweet_url": "https://x.com/Crypto_McKenna/status/2107169357654884569", "images": ["https://pbs.twimg.com/media/HT4qCcIaYAED6Zf.jpg", "https://pbs.twimg.com/media/HT4rlf0agAAAjFw.jpg"], "type": "thread", "category": ["crypto"]}, {"author": "AndreCronjeTech", "summary": "Explains how all economic activity touches $FT: exercised-option capital becomes limit buys at withdrawn NAV (~$0.0938, able to absorb 100% of circulating supply with $2M+ of resting liquidity); yield/appreciation from those assets placed at system NAV (~$0.1055); protocol revenue/fees and extra options yield over opex are spot buys. Contrasts two buyback types: released PUT backing capital at NAV vs. revenue at spot.", "tweet_url": "https://x.com/AndreCronjeTech/status/2107260031397761251", "images": ["https://pbs.twimg.com/media/HT59HTzWkAAkTv6.jpg"], "type": "tweet", "category": ["crypto"]}]}, {"cluster": "Iran Squeeze, Houthis and Saudi Security — Middle East Developments", "category": ["geopolitics", "energy"], "items": [{"author": "zriboua", "summary": "Argues Iran's pressure is cascading: with its economy contracting 5.4% and inflation near 70%, its ability to fund, produce and export weapons declines and its regional system weakens, with Yemen and especially Iraq next. Says 'Operation Epic Fury' and 'Economic Outcast' are showing early results.", "tweet_url": "https://x.com/zriboua/status/2107150241770225999", "images": [], "type": "tweet", "category": ["geopolitics"]}, {"author": "zriboua", "summary": "Flags as a 'big development' a breaking report that Türkiye and Pakistan will deploy forces to Saudi Arabia in response to Houthi attacks; follows with a thread-reply arguing Ankara has plenty of reasons to oppose the Houthis (Egypt, Somalia, Saudi, Pakistan ties; Bab al-Mandeb trade routes), a dynamic similar to Hezbollah in Syria and Iraqi militias.", "tweet_url": "https://x.com/zriboua/status/2107239989725839851", "images": [], "type": "tweet", "category": ["geopolitics"]}, {"author": "zriboua", "summary": "On the Kpler/Rory Johnston discussion of why more oil is flowing through Hormuz (Iran may want it that way), quotes the dismissive line tha 2) Engagement — tasks needing trust, identity, discovery or reputation ('10 people in SF to meet', passive-jobseeker matching, trustworthy sellers) benefit from a shared network and system of record; (3) Monetization. Counterpoint: new agent-facing point solutions (an agent-native eBay/LinkedIn) could centralize a layer above agents. His conclusion: agents themselves are likely fragmented, but the real fight is over where network effects live — if horizontal agents keep identity, relationships, private context and reputation proprietary, switching costs rise; if they live in open protocols, vertical agents can thrive.", "tweet_url": "https://x.com/andrewchen/status/2107339817713623253", "images": [], "type": "tweet", "category": ["AI", "tech"]}, {"author": "nicbstme", "summary": "Explains the 'software factory' as treating engineering output like a factory: pre-AI software was craftsmanship, constrained by how much humans could write; autocomplete/Cursor sped up the craftsmen; now agents take features end to end. The end state is a mostly autonomous factory where engineers write specs/markdown and define tests and constraints (verification engineers) while agent swarms watch telemetry, bugs and requests 24/7 — but only if CI/CD, tests, deploys, observability, security, rollback and evals are excellent. Core bet: your product will be only as good as your software factory.", "tweet_url": "https://x.com/nicbstme/status/2107145251433681345", "images": [], "type": "tweet", "category": ["AI", "tech"]}, {"author": "hosseeb", "summary": "Predicts the last .docx will be phased out for Markdown in ~5 years: 'computers are for agents now', token-efficient representations win, 'Python, Markdown and JSON all the way down' — when AI both produces and consumes most documents, its efficiency preferences dominate, and law firms will look very different. Responds to Google making Markdown work natively in Drive/Docs. (0xfoobar echoed the sentiment: 'death to docx'.)", "tweet_url": "h // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
