<script>
const ITEMS=[{"cat": "positioning", "urgency": "deep", "source": "Maverick Equity Research / Mav", "title": "S&P 500 sits near ATH, but 59% of constituents are in a bear market", "idea": "Drawdown dispersion: 82% of S&P members are >10% below their ATH, 59% >20%, 41% >30%, 26% >40%, 17% >50%. So 43% of the index (26%+17%) is 40%+ off highs inside an index printing records.", "angle": "The index level is a cap-weight illusion. This is the breadth argument in its most brutal form, and it supports small/mid and equal-weight rotation ideas.", "tweetA": "The S&P is at highs. 59% of its members are in a 20%+ drawdown. 17% are down more than half. Call it what it is: one bull market for ~10 stocks and a bear market for everyone else.", "tweetB": "If you run an equal-weight book you've been living in a different market than the index tells you. The number to watch isn't the S&P level, it's how long 8 names can carry 59% of the constituents. $SPY $RSP", "charts": {"count": 2, "hot": true, "desc": "Index drawdown dispersion bars by threshold (>10% to >50% below ATH). Rare, very tweetable chart."}, "link": "https://www.maverickequityresearch.com/p/s-and-p-500-bear-market-and-2-markets", "id": 1}, {"cat": "positioning", "urgency": "deep", "source": "Maverick Equity Research / Mav", "title": "Cap-weight vs equal-weight S&P correlation at record lows: two markets", "idea": "63-day correlation between cap-weighted and equal-weighted S&P is 0.64 vs a 0.93 average since 2011, and touched 0.57 three weeks ago (series low since 1995). The 252-day correlation is 0.78, also a record low.", "angle": "Same index, two different return streams. Matters for hedging: index vol products hedge the cap-weight market, not what most stocks do.", "tweetA": "Cap-weight vs equal-weight S&P correlation: 0.93 average, 0.57 at the low. Your index hedge and your actual stock book are now two different bets. $SPX $RSP", "tweetB": "A 0.93 correlation that decays to 0.57 isn't noise, it's the market telling you the factor underneath changed. Everything is AI-beta or not AI-beta. Which side is your hedge on?", "charts": {"count": 1, "hot": false, "desc": "3m and 12m rolling correlation, cap-weight vs equal-weight S&P since 1995."}, "link": "https://www.maverickequityresearch.com/p/s-and-p-500-bear-market-and-2-markets", "id": 2}, {"cat": "AI/infra", "urgency": "deep", "source": "Maverick Equity Research / Mav", "title": "Combined hyperscaler FCF just turned negative: +$70B to -$1.6B in three years", "idea": "Mav shows combined hyperscaler free cash flow flipping from about +$70B to -$1.6B over three years. That excludes the hundreds of billions borrowed and the trillions in off-balance-sheet obligations.", "angle": "Ties directly to the financing-stress narrative into MSFT/GOOGL/AMZN earnings this week. The capex story is now a credit story.", "tweetA": "Hyperscaler FCF: +$70B three years ago, -$1.6B now. And that's before counting the debt raised and the off-balance-sheet leases. Capex isn't funded by cash flow anymore, it's funded by the bond market. $MSFT $GOOGL $AMZN $META", "tweetB": "MSFT, GOOGL and AMZN report this week. I'm not looking at cloud growth first, I'm looking at the cash flow statement. A group that burns cash needs the credit window to stay open.", "charts": {"count": 1, "hot": true, "desc": "Combined hyperscaler FCF series crossing below zero. Chart alone tells the story."}, "link": "https://www.maverickequityresearch.com/p/s-and-p-500-bear-market-and-2-markets", "id": 3}, {"cat": "macro", "urgency": "deep", "source": "Maverick Equity Research / Mav", "title": "US households hold equities at 289% of disposable income, 2x since 2016", "idea": "Household equity + mutual fund holdings as % of DPI: ~40% in 1985, 160% in 2000, 146% in 2007, 190% in 2019, 247% in 2021, 289% in 2026. At 2.89x, a 20% drawdown erases 6.9 months of income, 30% erases 10.4, 40% erases 13.9.", "angle": "Wealth effect now cuts much harder than in 2000 (1.6x) or 2007 (1.46x). The consumer is a leveraged equity position.", "tweetA": "At 2000's peak a 20% equity drop cost households ~3.8 months of income. Today it costs 6.9. The US consumer isn't exposed to the stock market, it IS the stock market. $SPY", "tweetB": "Everyone models the consumer off wages and credit. Household equities are 2.89x disposable income. The next 30% drawdown is a 10-month income hit, and it lands on the top-decile spenders first.", "charts": {"count": 1, "hot": true, "desc": "Household equities/mutual funds as % of DPI since 1985, annotated with 2000/2007/2019/2021/2026."}, "link": "https://www.maverickequityresearch.com/p/s-and-p-500-bear-market-and-2-markets", "id": 4}, {"cat": "tech", "urgency": "deep", "source": "Maverick Equity Research / Mav", "title": "CVE disclosures hit 16,712 in 30 days; AI finding decade-old holes in PHP", "idea": "Rolling 30-day CVE count is 16,712. AI scripts and frontier models are surfacing severe vulnerabilities undiscovered for 10+ years in PHP. Palo Alto estimates a third of vulnerable systems run legacy software that can't be patched.", "angle": "Offense scales with compute, patching doesn't. Second-order: cyber spend, insurance pricing, legacy-system liability.", "tweetA": "16,712 CVEs in 30 days. AI is finding decade-old holes in PHP faster than anyone can patch, and a third of vulnerable systems can't be patched at all. Defense scales with headcount. Offense scales with GPUs. $CRWD $PANW", "tweetB": "Cyber insurers priced risk on human-speed attackers. If a third of the vulnerable estate is unpatchable and discovery is automated, what happens to the loss distribution?", "charts": {"count": 1, "hot": false, "desc": "CVE tracker, rolling 30-day total."}, "link": "https://www.maverickequityresearch.com/p/s-and-p-500-bear-market-and-2-markets", "id": 5}, {"cat": "culture", "urgency": "watch", "source": "Maverick Equity Research / Mav", "title": "Mav tried to rebuild one chart with premium AI models and failed: 'AI slop' vs real work", "idea": "The household-equity/DPI chart took ~10 steps: idea, derive insights, find data, unit-align two series (millions vs billions), ratio, pick period, visualise, annotate, understand context, write. Every premium model Mav pays for failed to do the whole job.", "angle": "A useful data point on where agents still fail: multi-step judgement, unit hygiene, and knowing what the chart means.", "tweetA": "I keep seeing people say AI can replace the analyst. One chart: two series, one in millions, one in billions. The ratio is the easy part. Knowing why the chart matters is the job. That part still isn't automated.", "tweetB": "Test for any 'AI research' product: ask it to find the two datasets, fix the units, choose the window, and tell you what it means. Most stop at step three. $NVDA", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.maverickequityresearch.com/p/s-and-p-500-bear-market-and-2-markets", "id": 6}, {"cat": "venture", "urgency": "deep", "source": "Big Price Moves Explained / Big Moves", "title": "SpaceX negotiating for ~80,000 US cell sites: towers up, carriers down for the second time in two weeks", "idea": "Bloomberg: SpaceX is seeking access to as many as 80,000 US cell sites, roughly half the purpose-built towers in the US. CCI +9.06%, AMT +4.08%, T -7.96%, TMUS about -7.7%. Bernstein estimates a standalone network needs $50B-130B. No signed leases or timelines.", "angle": "The author asks if a second repricing is warranted. Better question: is SpaceX buying a network or building a wholesale threat to extract better terms?", "tweetA": "SpaceX wants 80,000 US cell sites. That's about half the country's purpose-built towers. Towers rally, carriers sell off, and nobody has a signed lease. The market is pricing a $50-130B network on a Bloomberg headline. $CCI $AMT $T $TMUS", "tweetB": "Second SpaceX-telecom repricing in two weeks. The first move was the thesis, the second was the proof of intent. What neither tells you is who funds a $100B+ build while hyperscalers are at negative FCF. $SBAC", "charts": {"count": 0, "hot": false, "desc": "No chart in email; article has sources."}, "link": "https://bigmoves.substack.com/p/big-moves-october-23-2026", "id": 7}, {"cat": "tech", "urgency": "act", "source": "Big Price Moves Explained / Big Moves", "title": "LKQ -22.5%: ERP rollout in Germany wrecks European margins, CEO and Europe head out", "idea": "Prelim Q3: Europe organic revenue -9.8%, Europe EBITDA margin 4.1-5.1% vs 10.0% a year ago, adj EPS $0.47-0.53 vs $0.84. $111M impairments, FY guidance withdrawn. In July management promised 'back to 100% by year-end'; Alvarez & Marsal now brought in, new CEO Dec 15.", "angle": "A software implementation, not demand, sank a 100+ year-old distribution business. Watch Oct 29 call for how much is ERP vs real volume weakness.", "tweetA": "In July LKQ's CEO said Germany would be 'back to 100% by year-end.' Three months later he's gone, guidance is withdrawn, and Europe margins halved. An ERP migration did what a recession couldn't. $LKQ", "tweetB": "Europe EBITDA margin 10.0% to ~4.6%. That's a 540bp swing from one botched ERP cutover. Every CFO about to 'modernise' a core system should read this 8-K. $LKQ $SAP", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-october-23-2026", "id": 8}, {"cat": "labor", "urgency": "deep", "source": "Big Price Moves Explained / Big Moves", "title": "Robert Half +21.7%: Talent Solutions back to growth, led by tech, finance and permanent placement", "idea": "RHI jumped 21.74% to $45.87 as Talent Solutions returned to growth with strength in technology, finance and accounting, and permanent placement, while Protiviti risk/compliance demand firmed. It guided Q4 growth and higher earnings.", "angle": "Permanent placement is a leading indicator: firms hire when they're confident, not when they're patching. This contradicts the pure 'AI kills white-collar hiring' story, at least this quarter.", "tweetA": "Robert Half +22% because permanent placement in tech and finance turned up. Everyone's selling the 'AI ends white-collar jobs' story. The recruiter who actually sees the requisitions says hiring is coming back. $RHI", "tweetB": "Staffing is the cleanest real-time hiring gauge. If perm placement is inflecting while the Fed is on hold with oil at six-month highs, the labor market is not where the pessimists think. $RHI $MAN", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-october-23-2026", "id": 9}, {"cat": "macro", "urgency": "deep", "source": "Big Price Moves Explained / Big Moves", "title": "Globe Life -8%: Medicare supplement claim irregularities and cloudy 2027 guide", "idea": "Piper Sandler downgraded GL after Q3: higher medical-claims severity, continuing Medicare supplement claim irregularities, EBIT shortfall and less favourable 2027 guidance implications. TD Cowen and Evercore cut targets. MetLife fell 4.6% with no company-specific catalyst.", "angle": "Claims severity is the Medicare Advantage/medigap cost story showing up in a life insurer. Insurers selling on a broad Dow day suggests rate/credit worry.", "tweetA": "Globe Life -8% on claims severity in Medicare supplement. MetLife -4.6% with no news at all. When a boring insurer falls on no catalyst, the market is repricing credit marks, not earnings. $GL $MET", "tweetB": "Medical claim severity keeps surprising to the upside. Insurers can reprice annually, but 2027 guidance is where the damage compounds. $GL", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-october-23-2026", "id": 10}, {"cat": "culture", "urgency": "watch", "source": "Big Price Moves Explained / Big Moves", "title": "Deckers -4.9%: HOKA and UGG miss, softer DTC and heavy US footwear promotions; CBRE falls on revenue miss", "idea": "Deckers cut full-year sales outlook as HOKA launches underperformed, UGG missed, and US footwear promotions plus softer direct-to-consumer hit. CBRE -6% on revenue below consensus despite an EPS beat after an Evercore target cut.", "angle": "Premium footwear promotions plus DTC softness is a consumer-bifurcation signal. CBRE revenue miss shows transaction activity not yet back.", "tweetA": "Deckers cut guidance because of US footwear promotions and soft DTC. When even HOKA needs discounting, the 'consumer is fine' story is a top-decile-only story. $DECK $NKE $ONON", "tweetB": "CBRE beat EPS and missed revenue. The earnings quality is cost cuts, the top line is transactions. Commercial real estate recovery still isn't showing up in volume. $CBRE", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-october-23-2026", "id": 11}, {"cat": "geopolitics", "urgency": "deep", "source": "The Pressure Point / Fulcrum (AI analyst)", "title": "Nixon's hierarchy meets diesel: sanctions and tariffs lapse when the domestic cost hits voters", "idea": "First Russian diesel cargo (40,000 t) is heading to New York under the Trump-Putin deal. The administration also waived new Russia sanctions days before they took effect, moved to tap the national diesel reserve, invoked the DPA, and removed 50% tariffs on some Canadian ag/forestry goods. Oil traders expect elevated prices into 2027.", "angle": "The author's framework: 'A sanction is only as durable as the domestic shortage it creates.' Counterparties now know what lever to pull: find the US constituency that needs relief.", "tweetA": "One tanker of Russian diesel to New York. Sanctions waived, reserve tapped, Canadian tariffs lifted, all in one week. Everyone abroad just learned the exchange rate between US commitments and the US gas pump. $CL $HO", "tweetB": "If a sanction lasts only as long as the domestic price it causes, then Russia's best strategy is simple: keep diesel tight until November. Distillate cracks are pricing that. $VLO $MPC", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-a-diesel-spike-outranks/", "id": 12}, {"cat": "macro", "urgency": "deep", "source": "The Pressure Point / Fulcrum (AI analyst)", "title": "Bretton Woods arithmetic: in 1966 $14B of foreign dollar claims faced only $3.2B of free US gold", "idea": "By 1966 foreign central banks held $14B in dollars vs $13.2B US gold, of which only $3.2B was free to cover them. The US held 574M oz (over half of official reserves) after WWII; by 1971 reserves were ~10,000 tonnes, less than half peak. Britain's $3B gold request on Aug 11, 1971 preceded the Aug 15 closing of the gold window. Smithsonian (Dec 1971) devalued the dollar 7.9% and failed in 14 months.", "angle": "The historical template for how a reserve issuer renegotiates when the promise gets expensive. Relevant to de-dollarization and gold debates.", "tweetA": "In 1966, foreign central banks held $14B of dollar claims. Free gold to cover them: $3.2B. That's 23 cents on the dollar, and the world kept pretending for five more years. Ask what 'convertibility' means today for Treasuries. $GLD", "tweetB": "Volcker said when the British asked for their gold, 'the game was indeed over.' The tell wasn't the US balance sheet. It was a founder of the system asking for its collateral. Who's that today?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-a-diesel-spike-outranks/", "id": 13}, {"cat": "geopolitics", "urgency": "watch", "source": "The Pressure Point / Fulcrum (AI analyst)", "title": "UK PM Burnham floats renewed free movement with EU, ruling out Schengen and the euro", "idea": "UK Prime Minister Andy Burnham called for an 'honest discussion' on returning to EU free movement, while ruling out Schengen and the euro. Same email: Israel closes West Bank crossings on election day after two soldiers killed in Hebron; Machado returned to Venezuela after nearly a year.", "angle": "Free movement talk from a UK PM would reshape sterling risk premium, labor supply and UK-EU trade terms. Early signal, no policy yet.", "tweetA": "A UK Prime Minister openly discussing a return to EU free movement is a bigger sterling story than the BoE. Labor supply, services trade, immigration politics all reprice. Still just talk. $GBP $EWU", "tweetB": "Brexit's biggest economic cost was labour supply. If the government is raising the idea, markets should ask who's the constituency pushing it: business, not voters. Watch gilts.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-a-diesel-spike-outranks/", "id": 14}, {"cat": "regulation", "urgency": "watch", "source": "The Pressure Point / Fulcrum (AI analyst)", "title": "DOJ lawsuit seeks to block Alaska Senate results if Republican candidate loses; Brazil runoff and Machado's return", "idea": "AG Todd Blanche defended a DOJ lawsuit seeking to block Alaska's Senate results if the Republican loses. Brazil held a tight Lula vs Bolsonaro runoff on Oct 25. Machado returned to Venezuela.", "angle": "Election-law precedents matter for US political-risk premia into November; Brazil runoff is the BRL/Ibovespa binary.", "tweetA": "A DOJ lawsuit to block Alaska's results if the Republican loses. Election-certification risk used to be a tail. It's now a lawsuit. $SPY", "tweetB": "Brazil's runoff, Netanyahu's election, US midterms: three elections in nine days, each with a commodity or rates angle. $EWZ $BRL", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-a-diesel-spike-outranks/", "id": 15}, {"cat": "macro", "urgency": "act", "source": "Paper Alfa / Attack the Week", "title": "'Thursday's carnage': credit hedge funds hurting, cracks appearing, central bank week ahead", "idea": "Paper Alfa says Thursday's selloff added to an already fragile risk backdrop, with stories circulating of credit hedge funds hurting. 'Every cycle gets to a moment where cracks appear, and actual tightening occurs, not just through rate channels.' The asset allocation model bought bonds last week after four months of silence.", "angle": "The detail to watch is the allocation model buying bonds: a systematic signal flipping while the Fed meets Wednesday.", "tweetA": "Credit hedge funds are hurting, and tightening is arriving through spreads and funding rather than the policy rate. The Fed meeting this week isn't the tightening event. Thursday already was.", "tweetB": "A model that sat out bonds for four months just bought them. I don't need the narrative, I need the signal. Systematic rotation into duration into a central-bank week. $TLT $IEF", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.paperalfa.com/p/attack-the-week-atw-74d", "id": 16}, {"cat": "culture", "urgency": "watch", "source": "Paper Alfa / Attack the Week", "title": "UK government's 'clocks go back' post gets 5,000+ replies, mostly mocking", "idea": "The UK government's X reminder to turn clocks back drew 5,000+ replies: 'You have set the UK back 40 years', 'I'm putting my clocks forward to 2029 when Labour are not in power.' Pure sentiment read on trust in the government.", "angle": "Social-media reply tone as a trust gauge. Same reading as gilt vol: voters and bond holders both distrust the fiscal path.", "tweetA": "The UK government posted a clocks reminder and got 5,000 replies mocking it. Nobody tweets a joke about a government they trust. Gilt market has been saying the same thing with yields. $GBP", "tweetB": "The best sentiment indicator is the reply section when a government posts something boring. The cost of that distrust shows up in the gilt term premium. $GILT", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.paperalfa.com/p/attack-the-week-atw-74d", "id": 17}, {"cat": "energy", "urgency": "deep", "source": "Peter Frankopan", "title": "Pakistan's energy squeeze from the Iran war: nuclear neighbour at the crossroads of Eurasia", "idea": "Frankopan frames Pakistan as exposed on every border: a mutual defence pact with Saudi Arabia, mediation between Washington and Tehran (hosting US-Iran talks), a China-backed Gwadar corridor, last year's war with India and tension with the Taliban. The post examines how the Iran war threatens Pakistan's energy supplies and a fragile economy.", "angle": "Pakistan is the swing state in the Gulf-to-South Asia energy chain. LNG/oil disruption hits an economy with minimal buffers and a nuclear arsenal.", "tweetA": "Pakistan is mediating between Washington and Tehran, has a defence pact with Riyadh, depends on Gulf energy and sits next to India. Close Hormuz and this is the first domino with nukes. $USO", "tweetB": "Everyone prices Hormuz in dollars per barrel. The more interesting price is Pakistan's FX reserves, where a Gulf energy shock turns into an IMF programme and a security problem. Watch PKR and Eurobonds.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://peterfrankopan.substack.com/p/pakistans-energy-dilemma", "id": 18}, {"cat": "geopolitics", "urgency": "act", "source": "Pequity Research", "title": "Netanyahu faces Oct 27 election; reports US and Israel heading to joint military campaign", "idea": "Speedrun: Netanyahu's election is Tuesday Oct 27 and his party isn't polling strongly; reports say the US and Israel are heading toward a joint military campaign against Iran in the coming days. Earlier in the Asia-open note Trump said it is 'decision time' with Tehran.", "angle": "Election-eve escalation optionality overlaps with Fed week. Brent already near a six-month high.", "tweetA": "Netanyahu votes Tuesday, trailing. A joint US-Israel campaign is being reported 'in coming days.' Oil dipped Monday on exactly the day the risk is highest. That's not calm, that's positioning. $USO $XLE", "tweetB": "Thre
