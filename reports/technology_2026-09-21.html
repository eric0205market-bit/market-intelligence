moving toward formalized state-backed AI safety regulation while the US lags, a dynamic with implications for where AI governance standards and compliance burdens will first bind.", "quote": null, "locator": "The US Congress has made little progress", "quote_verified": false}, {"claim": "Chinese state media accused Anthropic CEO Dario Amodei of employing Cold War tactics to 'uphold Washington's monopolistic hegemony in cutting-edge technology.'", "speaker": "Xebec", "type": "data_point", "entities": ["Anthropic", "Dario Amodei", "China"], "conviction": "medium", "so_what": "Shows China is framing Western AI-safety advocacy itself as a geopolitical competitive tool rather than a genuine risk concern, a narrative that could harden US-China AI policy divergence further.", "quote": "uphold Washington’s monopolistic hegemony in cutting-edge technology", "locator": "Chinese state media also accused", "quote_verified": true}]}, {"theme": "Commercial Incentives Undercutting Safety Rhetoric", "insights": [{"claim": "IPO ambitions and fundraising prospects helped sustain the breakneck AI model release cycle, with the race to release new models driven in part by Anthropic's and OpenAI's desire to go public as soon as in the coming months at valuations that could exceed $1 trillion.", "speaker": "Xebec", "type": "causal", "entities": ["Anthropic", "OpenAI"], "conviction": "high", "so_what": "Directly links the pace of frontier model releases to near-term IPO valuation incentives, a structural reason to be skeptical that voluntary industry slowdown calls will translate into actual reduced release cadence.", "quote": null, "locator": "IPO ambitions and fundraising prospects", "quote_verified": false}, {"claim": "Even as OpenAI appeared to embrace industry calls for a slowdown, reports emerged that the company is considering a new funding round that would double its valuation to $1.5 trillion.", "speaker": "Xebec", "type": "contrarian", "entities": ["OpenAI"], "conviction": "high", "so_what": "A concrete, quantified example ($1.5 trillion target valuation) of the gap between OpenAI's public safety rhetoric and its simultaneous commercial fundraising trajectory — a key signal for investors to discount safety-slowdown commitments as not yet reflected in actual capital-raising or growth plans.", "quote": null, "locator": "That new number: $1.5 trillion.", "quote_verified": false}, {"claim": "September 8 marked a turning point when Anthropic researcher Jacob Coxon quit the company, citing fears in a series of posts that AI labs are 'gambling with our lives,' and it was these unexpectedly viral posts from the then relatively unknown 27-year-old that helped upend industry discourse.", "speaker": "Xebec", "type": "anecdote", "entities": ["Anthropic", "Jacob Coxon"], "conviction": "medium", "so_what": "Illustrates how a single individual researcher's viral public dissent, rather than institutional action, was the proximate trigger for the industry's ten-day crisis moment — a reminder of how fragile the AI industry's public narrative control can be.", "quote": "gambling with our lives", "locator": "it took the unexpectedly viral posts", "quote_verified": true}]}, {"theme": "Framing AGI and the Oppenheimer Parallel", "insights": [{"claim": "At the core of the industry debate is the conviction that AI machines can, and even must, build more capable versions of themselves with no human intervention to reach artificial general intelligence (AGI).", "speaker": "Xebec", "type": "framework", "entities": ["OpenAI", "Anthropic"], "conviction": "medium", "so_what": "Identifies recursive self-improvement as the central technical goal driving frontier labs' roadmaps, a framework investors should use to interpret why labs are racing rather than pausing despite stated safety concerns.", "quote": null, "locator": "At the center of the debate", "quote_verified": false}, {"claim": "Some AI safety advocates and researchers say humanity has not grappled so seriously with its own demise since the invention of the nuclear bomb more than 80 years ago, and Sam Altman, asked if he felt like Oppenheimer, said AI's impact 'is going to transform the trajectory of human history over a long period of time.'", "speaker": "Xebec", "type": "thesis", "entities": ["OpenAI", "Sam Altman"], "conviction": "medium", "so_what": "The nuclear-bomb historical analogy, invoked by both outside safety advocates and implicitly endorsed by OpenAI's own CEO, signals how seriously existential-risk framing has entered mainstream industry discourse, which could eventually translate into Manhattan-Project-style government intervention or oversight.", "quote": "is going to transform the trajectory of human history over a long period of time", "locator": "Reflecting on the parallels, he said", "quote_verified": true}]}], "insight_total": 21, "top_entities": ["OpenAI", "Anthropic", "DeepMind", "Microsoft", "xAI", "Sam Altman", "Dario Amodei", "Jensen Huang", "Nvidia", "Mark Zuckerberg", "Mustafa Suleyman", "Donald Trump"], "source_meta": {"author": "Xebec", "word_count": 1290, "paywalled": false}}, {"record_id": "ab65a81468271697", "source_type": "technology", "source_name": "ServeTheHome", "source_url": "https://www.servethehome.com/sth-q3-2026-letter-from-the-editor-a-moving-target/", "title": "STH Q3 2026 Letter from the Editor A Moving Target", "published_date": "2026-09-19", "language": "en", "processed_at": "2026-09-21T18:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI", "Positioning"], "gist": "In this quarterly personal/business update, ServeTheHome editor Patrick Kennedy notes that surging NAND/DRAM prices plus server CPU makers selling out capacity are reshaping what hardware is worth reviewing or buying, and predicts Q4 2026 and the following few quarters will be 'an absolute doozy' as ChatGPT-launch-era AI infrastructure bets finally ship as products.", "themes": [{"theme": "Memory and server-CPU supply squeeze", "insights": [{"claim": "Rising NAND and DRAM pricing, combined with server CPU makers being able to sell essentially all the units they can produce, is making it much harder to justify reviewing or recommending lower-end hardware platforms that would have cost less than half as much a year earlier.", "speaker": "Patrick Kennedy", "type": "causal", "entities": ["NAND", "DRAM", "server CPUs"], "conviction": "high", "so_what": "Signals a genuine component-level supply/demand imbalance (memory pricing plus sold-out server CPU capacity) rather than a one-off anecdote; relevant for tracking margin and allocation dynamics at memory makers (Samsung, SK Hynix, Micron) and CPU vendors (AMD, Intel) feeding AI server demand.", "quote": "current NAND and DRAM pricing, combined with the fact that companies can sell whatever server CPUs they can make right now, means it is getting harder to be excited about platforms that would have cost less than half as much a year ago", "locator": "On that same note, given the cost of NAND and DRAM", "quote_verified": true}, {"claim": "Given current component costs, Kennedy's stance is that a new system purchase in this environment is only justified if it serves a net-new AI workload, otherwise buyers should keep using their existing non-AI systems longer because of rising system prices.", "speaker": "Patrick Kennedy", "type": "thesis", "entities": ["AI workloads", "NAND", "DRAM"], "conviction": "medium", "so_what": "A practitioner-level capex discipline heuristic (only buy new for net-new AI use cases) that mirrors how enterprise buyers may be rationing hardware refresh budgets amid elevated memory and CPU pricing — useful signal for PC/server OEM demand forecasting.", "quote": "if you are going to buy a new system in this environment, it should be for a net-new AI workload", "locator": "On that same note, given the cost of NAND and DRAM", "quote_verified": true}, {"claim": "As a concrete illustration of price inflation, Kennedy cites a system that cost about $500 twelve months earlier now costing around $1,100, which he attributes to it not participating in the current AI hardware ecosystem's rapid pace of improvement.", "speaker": "Patrick Kennedy", "type": "data_point", "entities": ["mini PCs"], "conviction": "medium", "so_what": "A concrete real-world data point (roughly 2.2x price increase in a year for a comparable non-AI system) that quantifies the memory/component price inflation described elsewhere in the piece — a useful anchor for tracking consumer/entry-level system cost trends tied to NAND/DRAM shortages.", "quote": "it is less exciting to review a system that was $500 only twelve months ago, is now $1100, and does not participate in it", "locator": "Another major challenge is that the AI side feels very exciting", "quote_verified": true}]}, {"theme": "AI infrastructure buildout pace and timing", "insights": [{"claim": "Kennedy predicts Q4 2026 will be 'an absolute doozy' for the server/datacenter hardware industry, arguing the market is still a few quarters away from the infrastructure bets made around the ChatGPT launch fully turning into shipped products that people will be discussing.", "speaker": "Patrick Kennedy", "type": "prediction", "entities": ["ChatGPT", "AI infrastructure"], "conviction": "high", "so_what": "Implies the current AI datacenter capex cycle has a multi-quarter lag between initial investment commitments and product shipment/adoption, suggesting the buildout narrative still has meaningful runway ahead rather than being near a peak — relevant for timing AI-infrastructure-exposed equities and capex forecasts.", "quote": "we are still a few quarters away from the bets made at the ChatGPT launch turning into shipped products and folks wanting to talk about them. This is on a path to accelerate and get even more exciting over the next few quarters", "locator": "Also, buckle up for Q4", "quote_verified": true}, {"claim": "New local AI workstation platforms now require 400GbE networking, pushing high-speed optics into what were previously desktop/workstation-class deployments rather than only large datacenter clusters.", "speaker": "Patrick Kennedy", "type": "data_point", "entities": ["400GbE", "optics", "local AI workstations"], "conviction": "medium", "so_what": "A leading indicator that high-bandwidth networking and optics demand is spreading beyond hyperscale datacenters into local/edge AI workstation setups, a potential incremental demand driver for networking/optics suppliers (e.g., Mellanox/NVIDIA networking, optical transceiver makers).", "quote": "local AI now needs 400GbE, and that means more fun with optics", "locator": "We also have several new local AI workstation platforms", "quote_verified": true}, {"claim": "Kennedy describes the current pace of AI hardware releases as feeling like building a PC in the 1990s or early 2000s, but happening faster, with many vendors shipping hardware rapidly and the underlying models and software improving every few weeks.", "speaker": "Patrick Kennedy", "type": "framework", "entities": ["AI hardware vendors"], "conviction": "medium", "so_what": "Frames the current AI hardware cycle as an early-stage, rapid-iteration platform war analogous to the early PC era, implying faster obsolescence cycles and higher innovation velocity that investors should weigh against component-cost-driven hesitancy to upgrade non-AI systems.", "quote": "It feels almost like building a PC in the 1990s or early 2000s again, but at a higher pace", "locator": "Another major challenge is that the AI side feels very exciting", "quote_verified": true}]}, {"theme": "Server CPU launch cycle", "insights": [{"claim": "STH is in the midst of a new server CPU and platform launch cycle, referencing AMD EPYC Turin, NVIDIA Vera, and AMD's Helios reference rack architecture as active coverage areas, with dedicated CPU/server platform testing work (AgentSTH V7/V8) expected to accelerate over the following weeks.", "speaker": "Patrick Kennedy", "type": "data_point", "entities": ["AMD", "EPYC Turin", "NVIDIA", "NVIDIA Vera", "AMD Helios"], "conviction": "low", "so_what": "Flags an active, near-term wave of server CPU/platform launches (AMD and NVIDIA) that datacenter hardware investors should track for benchmark results and design-win commentary as STH's testing output ramps up.", "quote": null, "locator": "AMD EPYC Turin And NVIDIA Vera", "quote_verified": false}]}, {"theme": "Monetizing datacenter/AI analysis for institutional audiences", "insights": [{"claim": "ServeTheHome's analyst arm, the Axautik Group, is being built to produce paid content specifically for financial and executive communities, repackaging STH's hands-on hardware knowledge into monetizable formats distinct from STH's free public content.", "speaker": "Patrick Kennedy", "type": "data_point", "entities": ["Axautik Group", "STH"], "conviction": "medium", "so_what": "Indicates rising demand from financial/institutional audiences for specialized, practitioner-grade datacenter and AI hardware analysis (e.g., a piece on data center CPUs for agentic AI), a signal that independent hardware-testing outlets see a viable paid research business model around AI infrastructure investing.", "quote": "The Axautik Group will produce content designed more for the financial and executive communities.", "locator": "In Q1 2025, we rolled out our new analyst arm", "quote_verified": true}, {"claim": "STH's Substack, launched in August 2024, is now running at over 100,000 views per month and has become an important and growing revenue source, with plans to significantly increase Axautik Group Substack content in 2026.", "speaker": "Patrick Kennedy", "type": "data_point", "entities": ["Substack", "Axautik Group"], "conviction": "medium", "so_what": "A concrete traction metric (100K+ monthly views) for independent, subscription-based AI/datacenter hardware analysis content, useful as a datapoint on reader/investor appetite for niche technical research outside mainstream financial media.", "quote": "It is now running at a clip of over 100K views/ month this quarter, which is not bad.", "locator": "There is a question of whether this will be more of a subscription model", "quote_verified": true}]}], "insight_total": 9, "top_entities": ["AMD", "NVIDIA", "EPYC Turin", "NVIDIA Vera", "AMD Helios", "NAND", "DRAM", "ChatGPT", "Axautik Group", "400GbE"], "source_meta": {"author": "Patrick Kennedy", "word_count": 1777, "paywalled": false}}, {"record_id": "57daa634e0a67d28", "source_type": "technology", "source_name": "Together AI Blog", "source_url": "https://www.together.ai/blog/global-fintech-scales-coding-agent-traffic-with-dedicated-model-inference", "title": "How a global fintech scaled coding agent traffic with Dedicated Model Inference", "published_date": "2026-09-18", "language": "en", "processed_at": "2026-09-21T00:00:00Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech", "Positioning"], "gist": "A global fintech running internal coding agents on GLM-5.2 via Together's self-serve Dedicated Model Inference (DMI) hit a real production incident (near-100% prefill capacity, 1-3 minute queuing, decode throughput collapsing to ~5 tok/s) and fixed it same-day via a config change rather than a redeploy or vendor ticket, illustrating how enterprise AI-infra demand is now driven by decentralized, unpredictable internal coding-agent adoption rather than centrally forecastable traffic.", "themes": [{"theme": "Coding-agent traffic economics", "insights": [{"claim": "The fintech's internal coding-assistant traffic runs at input sequence length p50/p90/p95 of roughly 81K/163K/178K tokens and requests-per-second p50/p90/p95 of only 3/6/7 — a peak-load, low-throughput pattern where concurrency headroom matters far more than raw tokens-per-second.", "speaker": "Ankit Goyal", "type": "data_point", "entities": ["Together AI", "GLM-5.2", "Dedicated Model Inference"], "conviction": "high", "so_what": "Enterprise agentic-coding inference is not a raw-throughput/benchmark game; infra vendors that provision for peak concurrency and long prompts, not TPS averages, will win these workloads over cheaper high-TPS-optimized providers.", "quote": "ISL p50/p90/p95 of roughly 81K/163K/178K tokens and RPS p50/p90/p95 of 3/6/7, a peak-load, relatively-low-TPS pattern where bursts in concurrency matter far more than raw tokens-per-second", "locator": "What the customer required: self-service, observability, concurrency", "quote_verified": true}, {"claim": "The customer's production GLM-5.2 coding-assistant endpoint runs at 256K context across 56 B200 GPUs configured as 14 replicas of 4 B200s each, a topology deliberately chosen to prioritize concurrency headroom over raw throughput.", "speaker": "Ankit Goyal", "type": "data_point", "entities": ["GLM-5.2", "B200 GPUs", "Together AI"], "conviction": "high", "so_what": "Gives a concrete GPU-count benchmark for what it costs (in B200s) to serve a single large enterprise's internal coding-agent traffic at this scale — a useful sizing datapoint for inference-capacity demand models.", "quote": "the production endpoint began running it at 256K context on 56 B200s (14 replicas by 4 B200s)", "locator": "The pivot to GLM 5.2", "quote_verified": true}, {"claim": "The customer evaluated doubling its context window to 1M tokens and deliberately turned it down, choosing to stay at 256K/512K context because the larger context configuration would have reduced the concurrency headroom their peak-load, low-TPS workload actually depends on.", "speaker": "Ankit Goyal", "type": "causal", "entities": ["GLM-5.2", "Together AI"], "conviction": "high", "so_what": "Shows a real customer explicitly trading off a headline capability (1M context) against concurrency/latency reliability — evidence that for production agentic workloads, buyers value stable concurrency over maximal context length, a signal for how model/infra vendors should market capability tiers.", "quote": "doubling context to 1M would have cut the concurrency headroom their peak-load, low-TPS workload actually depends on", "locator": "Fast access to a rich library of models", "quote_verified": true}]}, {"theme": "Infrastructure failure mode and live remediation", "insights": [{"claim": "A replica re-shape of the customer's GLM-5.2 endpoint (same total GPU footprint but a different ratio of replica count to chips per replica) pushed the deployment to near-100% prefill capacity within days, causing requests to queue for one to three minutes and decode throughput to collapse to roughly 5 tokens per second.", "speaker": "Ankit Goyal", "type": "data_point", "entities": ["GLM-5.2", "Together AI", "B200 GPUs"], "conviction": "high", "so_what": "A concrete real-world failure mode for dedicated LLM inference at scale: topology/replica-ratio changes, not just total GPU count, can silently exhaust prefill capacity — a risk factor investors should weigh when assessing inference providers' operational reliability under configuration change.", "quote": "requests queuing one to three minutes and decode throughput collapsing to roughly 5 tokens per second", "locator": "Endpoint configuration through the API, UI, or CLI", "quote_verified": true}, {"claim": "The fix for the prefill-capacity incident was a live configuration change pushed the same day with zero downtime — restoring a tuned cache-session-aware routing policy in place of DMI's default cache-aware-by-hash policy and widening the max-inflight-per-worker threshold — rather than a new deployment or a support ticket to Together.", "speaker": "Ankit Goyal", "type": "framework", "entities": ["Together AI", "Dedicated Model Inference"], "conviction": "high", "so_what": "Demonstrates a tangible operational advantage of self-serve dedicated inference platforms: incident remediation measured in hours via config change versus days/weeks via vendor ticketing — a differentiator investors should look for when comparing inference vendors' enterprise stickiness.", "quote": "It was a live configuration change: restoring the tuned cache-session-aware routing policy in place of DMI's default cache-aware-by-hash policy, and widening the max-inflight-per-worker threshold. All of it was pushed same day with zero downtime.", "locator": "Endpoint configuration through the API, UI, or CLI", "quote_verified": true}, {"claim": "Together's metrics API let the customer's own team trace a single 192-second slow request end-to-end and determine it was not compute-bound but had instead spent nearly its entire duration queued behind a 2.3M-token pending-prefill backlog from other requests, despite its own prompt being only 250K tokens.", "speaker": "Ankit Goyal", "type": "causal", "entities": ["Together AI", "Dedicated Model Inference", "GLM-5.2"], "conviction": "high", "so_what": "Illustrates that at production scale, agentic-coding inference latency problems are dominated by request-queuing/scheduling dynamics, not raw model compute — implying inference vendors' differentiation increasingly lies in scheduler/observability sophistication rather than just GPU throughput.", "quote": "had spent almost the entire span queued behind a 2.3M-token pending-prefill backlog from other requests, not its own 250K-token prompt", "locator": "Metrics API", "quote_verified": true}]}, {"theme": "Self-service infrastructure as the product", "insights": [{"claim": "Before adopting Together's self-serve Dedicated Model Inference platform, every capacity change or new team's endpoint request had to be filed as a ticket to Together and routed through the customer's own platform team, which ended up coordinating capacity on behalf of the entire organization as adoption accelerated.", "speaker": "Ankit Goyal", "type": "anecdote", "entities": ["Together AI", "Dedicated Model Inference"], "conviction": "high", "so_what": "Highlights that ticket-based capacity provisioning becomes an organizational bottleneck once AI-agent adoption scales internally, creating demand for self-service inference control planes as a distinct product category from raw compute supply.", "quote": null, "locator": "Operational control", "quote_verified": false}, {"claim": "On Together's Dedicated Model Inference platform, the customer's engineers can now scale capacity, roll out custom model weights, and run blue/green tests against production traffic entirely in-house, with no ticket filed to Together and no redeployment cycle required.", "speaker": "Ankit Goyal", "type": "thesis", "entities": ["Together AI", "Dedicated Model Inference"], "conviction": "high", "so_what": "Positions self-service operational control (not just GPU access) as the core value proposition Together is selling to enterprise AI-infra buyers — a template other inference vendors will likely need to match to compete for large agentic workloads.", "quote": "Scaling: the customer adjusts capacity directly, no ticket to Together.Custom-weight rollouts: new model versions go live without a redeployment cycle.Blue/green testing: the customer validates changes against production traffic on its own timeline.", "locator": "Results", "quote_verified": true}]}, {"theme": "Model fluidity and vendor lock-in dynamics", "insights": [{"claim": "The customer moved its production coding-assistant workload from GLM 5.1 to GLM 5.2 on the same Together account and endpoint pattern with no contract renegotiation required, alongside separate context-length iterations handled the same way.", "speaker": "Ankit Goyal", "type": "data_point", "entities": ["GLM-5.1", "GLM-5.2", "Together AI"], "conviction": "high", "so_what": "Shows dedicated-inference contracts can be decoupled from a specific model checkpoint, lowering switching friction for customers as new open-source frontier models release — relevant to how sticky (or not) dedicated inference commitments really are for vendors like Together.", "quote": "demonstrated in practice by the move from GLM 5.1 to GLM 5.2 on the same account, plus a live tuning pass on cache and load-balancing parameters done as a config update, not a redeployment", "locator": "What the customer required: self-service, observability, concurrency", "quote_verified": true}]}, {"theme": "Adoption-driven, decentralized demand", "insights": [{"claim": "Inference traffic on the customer's coding-assistant endpoint climbs every time another internal engineering team independently adopts AI coding agents into its workflow, meaning demand growth is driven by dozens of decentralized, uncoordinated adoption decisions rather than a single centrally planned rollout.", "speaker": "Ankit Goyal", "type": "causal", "entities": ["Together AI", "GLM-5.2"], "conviction": "high", "so_what": "A structural reason why enterprise AI-infra demand is inherently hard to forecast: bottom-up, team-by-team agent adoption produces unpredictable bursty load, favoring inference vendors offering elastic self-service scaling over those requiring advance capacity forecasts.", "quote": "You can't forecast a burst that's driven by a hundred different engineering teams independently deciding to lean on their coding agent harder this week.", "locator": "Operational control", "quote_verified": true}, {"claim": "The customer is now scoping a second dedicated endpoint running GLM 5.1 in a new region for a chat-style customer-support NLP workload — structurally different from the original long-horizon agentic coding workload — landing on the same Together infrastructure and provisioning pattern.", "speaker": "Ankit Goyal", "type": "prediction", "entities": ["GLM-5.1", "Together AI", "Dedicated Model Inference"], "conviction": "medium", "so_what": "Signals expansion of a single enterprise customer's dedicated-inference spend beyond its initial use case, a pattern investors should watch as evidence of land-and-expand economics within AI-infra vendors' enterprise accounts.", "quote": "a chat-style customer-support NLP workload rather than long-horizon agentic coding, landing on the same infrastructure and provisioning pattern", "locator": "What's next: a second workload and region", "quote_verified": true}]}, {"theme": "Sales-engineering motion for dedicated inference", "insights": [{"claim": "The commercial relationship began months before the GLM-5.2 production endpoint went live, including an instance where the customer's project lead requested a checkbox-style concurrency test of GLM 5.1 across 8 to 16 B200 GPUs over a weekend, and Together turned the test endpoint around the same day.", "speaker": "Ankit Goyal", "type": "anecdote", "entities": ["Together AI", "GLM-5.1", "B200 GPUs"], "conviction": "medium", "so_what": "Fast, white-glove technical validation turnaround appears to be part of how dedicated-inference vendors win and retain large enterprise accounts, not just price or raw GPU supply — a soft but real competitive moat to track.", "quote": "the customer's project lead asked over a weekend for a checkbox-style concurrency test of GLM 5.1 across 8 to 16 B200s", "locator": "Timeline: from early load tests to a production endpoint at scale", "quote_verified": true}]}], "insight_total": 12, "top_entities": ["Together AI", "GLM-5.2", "GLM-5.1", "Dedicated Model Inference", "B200 GPUs", "Together's Solutions Architecture team"], "source_meta": {"author": "Ankit Goyal", "word_count": 1379, "paywalled": false}}, {"record_id": "87097031d38b535e", "source_type": "technology", "source_name": "Wired", "source_url": "https://www.wired.com/review/thermacell-liv-smart-mosquito-repellent-system-2/", "title": "I’ve Spent Years Fighting Texas Mosquitoes. This Is What Finally Worked", "published_date": "2026-09-20", "language": "en", "processed_at": "2026-09-21T11:10:53Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "Society"], "gist": "Wired's review of Thermacell's LIV 2.0 smart mosquito barrier system shows a $1,746+ perimeter vapor-repellent product that dropped its DIY option in favor of mandatory professional installation, kept // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
