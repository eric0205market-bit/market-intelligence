<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twitter Data Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DATA POINT TAGS */
.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>
</head>

const REPORT_DATA = {"report_type":"TWITTER DATA INTELLIGENCE","collected_at":"2026-10-19T05:21:11Z","date":"2026-10-19 05:47 UTC","input_stats":{"total_tweets":90,"unique_authors":19,"tweets_with_images":44,"after_filter":56},"summary":"56 items from 17 of 19 accounts covering China macro data, AI capex stress, global rates higher-for-longer, and equity futures defying 'Black Monday' fears.\n\n**Key numbers: China Q3 GDP +4.5% (beat est. 4.4%), China Sept oil demand -15.2% YoY, Nasdaq 100 futures +1% overnight (vs Black Monday calls), Japan banks sold -$16B foreign bonds (9th consecutive month), 47 data center projects delayed/canceled in 2026, Taiwan 2026 GDP on track for +10.7%.**\n\nPrimary themes converging this session: AI infrastructure financing stress (yields vs capex viability), global rates regime shift (every forecast revision goes higher), and an EM bifurcation between AI-exposed economies (Taiwan +10.7%) and the rest. Two accounts (JSeyff, EricBalchunas) were posting exclusively off-topic marathon/sports content in this batch.","topics":[{"topic":"Market Data & Volatility","items":[{"author":"KobeissiLetter","description":"US stock market futures opened higher despite Black Monday fears. S&P 500 +0.2%, Nasdaq 100 +0.2%, Dow Jones +0.1%. Energy commodities down: WTI Crude -0.6%, Brent -0.5%, Natural Gas -2.1%.","tweet_url":"https://x.com/KobeissiLetter/status/2111942078930235684","images":[],"data_points":["S&P 500 futures +0.2%","Nasdaq 100 futures +0.2%","Dow Jones futures +0.1%","WTI Crude -0.6%","Brent -0.5%","Natural Gas -2.1%"],"created_at":"2026-10-18T22:06:44.000Z"},{"author":"KobeissiLetter","description":"3 hours into the supposed Black Monday stock market crash, Nasdaq 100 futures are now up nearly +1%. The S&P 500 is set to add +$350 billion in market cap at the open. Chart tracking every time 'Black Monday' has trended on social media since May 2025 - each instance preceded a buying opportunity.","tweet_url":"https://x.com/KobeissiLetter/status/2111982830238453876","images":["https://pbs.twimg.com/media/HU9FMQ1XoAAQmaK.jpg"],"data_points":["Nasdaq 100 futures +1%","S&P 500 adding +$350B market cap at open"],"created_at":"2026-10-19T00:48:40.000Z"},{"author":"KobeissiLetter","description":"Chart showing every time 'Black Monday' trended on social media since May 2025. Calls have repeatedly marked best buying opportunities. Majority of S&P 500 stocks have already experienced a bear market even as index trades near record highs - a largely unprecedented occurrence.","tweet_url":"https://x.com/KobeissiLetter/status/2111891272998797518","images":["https://pbs.twimg.com/media/HU7x6IyXIAA1Z8x.png"],"data_points":["S&P 500 majority of individual stocks in bear market while index at highs"],"created_at":"2026-10-18T18:44:51.000Z"},{"author":"Polymarket","description":"S&P 500 perpetual futures broke above 7,700 as US stock market futures rallied.","tweet_url":"https://x.com/Polymarket/status/2111979043843146099","images":["https://pbs.twimg.com/media/HU9Bv6uXQAAtGP4.jpg"],"data_points":["S&P 500 perps >7,700"],"created_at":"2026-10-19T00:33:37.000Z"},{"author":"kurtsaltrichter","description":"Chart showing VIX at 18, questioning whether a 'Black Monday' crash can occur at this volatility level.","tweet_url":"https://x.com/kurtsaltrichter/status/2112004042448588996","images":["https://pbs.twimg.com/media/HU9Ye6SXUAA1U7J.jpg"],"data_points":["VIX = 18"],"created_at":"2026-10-19T02:12:57.000Z"},{"author":"lisaabramowicz1","description":"Corporate bond yields for lowest-rated companies are now at their highest since 2022, eroding a key source of comfort for equity traders. The solid credit market has been deteriorating for the past few weeks as corporate bond yields creep higher, particularly among weak companies.","tweet_url":"https://x.com/lisaabramowicz1/status/2111954405276659890","images":["https://pbs.twimg.com/media/HU8q0IOXMAA2DaP.jpg"],"data_points":["Lowest-rated bond yields = highest since 2022"],"created_at":"2026-10-18T22:55:43.000Z"},{"author":"MichaelKantro","description":"Chart showing market leadership is more consistently higher-beta during phases where macro, EPS, and expectations all rise together - the new cycle phase we have just passed through.","tweet_url":"https://x.com/MichaelKantro/status/2111915276556251233","images":["https://pbs.twimg.com/media/HU8HwCXWYAAAdo2.jpg"],"data_points":["Higher-beta leadership consistent in macro+EPS+expectations expansion phase"],"created_at":"2026-10-18T20:20:14.000Z"},{"author":"charliebilello","description":"Nearly 1 in 5 American families fell behind on debt payments in 2025, the highest share since 2010. Chart shows growing divergence: stock market boom enriches wealthy Americans while millions struggle to pay bills - two very different economies.","tweet_url":"https://x.com/charliebilello/status/2111875146554167363","images":["https://pbs.twimg.com/media/HU7iP9wWIAAWOER.png"],"data_points":["~20% of families behind on debt (2025)","Highest since 2010"],"created_at":"2026-10-18T17:40:46.000Z"}]},{"topic":"China Economic Data","items":[{"author":"zerohedge","description":"China Q3 GDP data beat: 4.5% Y/Y vs est. 4.4%. September retail sales +1.1% Y/Y (est. 0.5% - big beat). Industrial output +5.5% Y/Y (in-line). Jan-Sept fixed investment -7.2% Y/Y (est. -7.3%).","tweet_url":"https://x.com/zerohedge/status/2112003238551855279","images":[],"data_points":["China Q3 GDP +4.5% YoY (est. +4.4%)","Retail sales +1.1% YoY (est. +0.5%)","Industrial output +5.5% YoY","Fixed investment -7.2% YoY"],"created_at":"2026-10-19T02:09:45.000Z"},{"author":"zerohedge","description":"Chart showing China's soaring exports and imports are driven entirely by price, not volume - volumes are actually collapsing. Headline trade numbers mask deteriorating underlying demand.","tweet_url":"https://x.com/zerohedge/status/2112003953101594853","images":["https://pbs.twimg.com/media/HU9YZSQWoAAKSBz.jpg"],"data_points":["China trade: price-driven, volume collapse"],"created_at":"2026-10-19T02:12:36.000Z"},{"author":"zerohedge","description":"China's September apparent oil demand fell 15.2% year-over-year.","tweet_url":"https://x.com/zerohedge/status/2112011707040338280","images":[],"data_points":["China Sept apparent oil demand -15.2% YoY"],"created_at":"2026-10-19T02:43:24.000Z"},{"author":"C_Barraud","description":"Bloomberg: China's growth rebound topped forecasts, closing in on annual GDP target. Q3 4.5% growth puts annual target within reach. Chart showing growth trajectory.","tweet_url":"https://x.com/C_Barraud/status/2112038966555795477","images":["https://pbs.twimg.com/media/HU935U7WoAE_CnQ.png"],"data_points":["China Q3 GDP +4.5% (beat)","Annual GDP target now within reach"],"created_at":"2026-10-19T04:31:44.000Z"},{"author":"ShanghaiMacro","description":"Key chart: ~40% of China's recent export strength has been driven by the global AI buildout (chips and computers). Any slowdown in AI capex would disproportionately hurt Chinese exports when domestic demand is already in recession. Corollary: bad AI news = higher probability of strong Beijing stimulus response, making Chinese consumer stocks an attractive hedge against AI selloff.","tweet_url":"https://x.com/ShanghaiMacro/status/2112010896650457366","images":[],"data_points":["40% of China export growth driven by AI buildout","AI slowdown = elevated China stimulus probability"],"created_at":"2026-10-19T02:40:11.000Z"}]},{"topic":"Global Rates & Inflation","items":[{"author":"kurtsaltrichter","description":"Chart showing consensus rate forecasts for advanced economies keep being revised higher - every few months. The October forecast sits well above January, April, and July projections. Higher-for-longer is no longer a scenario; it is the baseline that keeps getting revised the same way.","tweet_url":"https://x.com/kurtsaltrichter/status/2112004311718769015","images":["https://pbs.twimg.com/media/HU9YuqrWcAAaxrL.jpg"],"data_points":["Rate forecasts: 4 consecutive upward revisions in 2026"],"created_at":"2026-10-19T02:14:01.000Z"},{"author":"kurtsaltrichter","description":"Chart showing overall CPI ticking back up driven by fuel-sensitive categories (airline fares, delivery services), while grocery prices rise slower than headline. This is a supply-side energy shock concentrated in specific categories, not broad monetary inflation.","tweet_url":"https://x.com/kurtsaltrichter/status/2111959013667537313","images":["https://pbs.twimg.com/media/HU8vh7aWcAAJg6N.jpg"],"data_points":["CPI rising but fuel-concentrated","Airline fares + delivery biggest movers","Grocery prices rising slower than headline"],"created_at":"2026-10-18T23:14:01.000Z"},{"author":"EPBResearch","description":"Chart and historical analysis: When money supply growth is 4-8% AND cyclical payroll growth is 0-2% (current conditions), a 0.5% increase in core inflation has been 2x as common as a 0.5% decrease over the following 12 months.","tweet_url":"https://x.com/EPBResearch/status/2111877926559834462","images":["https://pbs.twimg.com/media/HU7lQW4XcAApR0L.jpg"],"data_points":["Core inflation 2x more likely to rise 0.5% than fall (M2 4-8%, cyclical payrolls 0-2%)"],"created_at":"2026-10-18T17:51:49.000Z"},{"author":"TaviCosta","description":"Last week's inflation data reinforce: likely a decade of sticky inflation. Chart showing inflation persistence. Central banks will eventually cut rates to keep government borrowing costs manageable - that combination has profound implications for hard assets.","tweet_url":"https://x.com/TaviCosta/status/2111940175555375517","images":["https://pbs.twimg.com/media/HU8eZbbbMAAAnMG.jpg"],"data_points":["Sticky inflation likely ~10 years","Rate cuts expected despite inflation (fiscal sustainability)"],"created_at":"2026-10-18T21:59:10.000Z"},{"author":"C_Barraud","description":"IMF: BOJ may need to tighten monetary policy faster if inflation beats forecast.","tweet_url":"https://x.com/C_Barraud/status/2112042839919989142","images":[],"data_points":["IMF: BOJ may need faster tightening if inflation surprises"],"created_at":"2026-10-19T04:47:07.000Z"},{"author":"C_Barraud","description":"BOJ Governor Ueda says underlying inflation is 'quite close' to the 2% price goal.","tweet_url":"https://x.com/C_Barraud/status/2112042645078110252","images":[],"data_points":["BOJ: underlying inflation 'quite close' to 2% target"],"created_at":"2026-10-19T04:46:21.000Z"},{"author":"PeterBerezinBCA","description":"Chart: Adjusted for shifts in utilization rates, total factor productivity (TFP) growth was zero in Q2. AI has not yet produced an economy-wide acceleration in productivity growth.","tweet_url":"https://x.com/PeterBerezinBCA/status/2111867384453804532","images":["https://pbs.twimg.com/media/HU7cMVxXUAAsrbr.jpg"],"data_points":["TFP growth = 0% in Q2 2026 (utilization-adjusted)","No AI productivity boost visible at economy-wide level"],"created_at":"2026-10-18T17:09:55.000Z"}]},{"topic":"Fixed Income & Bond Market","items":[{"author":"KobeissiLetter","description":"Japanese banks sold -$16 billion of foreign bonds in September, their largest monthly sale since February. 9th consecutive monthly sale (longest streak since 2022). YTD 2026 foreign bond sales from Japan = largest for that period since 2005. Japanese banks rotated into domestic JGBs: +$34B in JGBs (2+ year maturity) over the 5 months through August.","tweet_url":"https://x.com/KobeissiLetter/status/2111873182609100843","images":["https://pbs.twimg.com/media/HU1rhTLWQAAw-hg.jpg"],"data_points":["Japan banks: -$16B foreign bonds in Sept","9th consecutive month selling (longest since 2022)","YTD foreign bond sales = largest since 2005","+$34B JGB purchases over 5 months"],"created_at":"2026-10-18T17:32:58.000Z"},{"author":"C_Barraud","description":"Comprehensive AI infrastructure bond market warning: 47 major data center projects delayed/canceled/blocked in 2026. Only 35% of US data center pipeline is credible (Bernstein). $10T+ // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet &#8594;</a>`
    : '';
  const body = item.description || item.text || '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(renderItem).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">&#9658;</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">&#8212;</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">&#9658;</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const topicCount = (d.topics || []).length;
  const itemCount = (d.topics || []).reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`topics <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const topicsBody = (d.topics || []).map(renderTopic).join('')
                  || '<div class="empty">No topics.</div>';
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Topics', topicsBody, (d.topics || []).length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
