<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-07-27T17:21:02Z", "input_stats": {"total_tweets": 216, "unique_authors": 68, "tweets_with_images": 52, "after_noise_filter": 67}, "summary": "**Iran/Oil:** Ceasefire skepticism deepened. **Trump** told @BarakRavid the US is in \"very deep talks\" with Iran but warned of a return to \"very strong military action\" if they fail; satellite imagery from **JavierBlas** showed heavy flaring at Saudi's Abqaiq/Ghawar complex with a pit possibly flooded (cause unknown). **Geiger Capital** flagged the Strategic Petroleum Reserve at its lowest in 40+ years, and traders (**_tolks**, **dampedspring**, **Evan_ss6**) note markets have stopped rallying on \"TACO\" ceasefire headlines the way they used to.\n\n**Fed:** FOMC hike odds sit at 36% into Wednesday — per **Jim Bianco**, only 4 of 135 meetings since 2009 have carried this much uncertainty this close to decision day. **Fullcarry** argues sub-2% 1-year inflation swaps favor a pass.\n\n**Nvidia/OpenAI financing:** Nvidia's $250B guarantee on OpenAI's Ohio data-center debt is drawing real skepticism. **dampedspring** likens Nvidia to AIG (\"the provider of credit protection and off-balance-sheet leverage\"), **nicbstme** argues compute — not model IP — is AI's real moat, and **Jim Cramer** is calling it the \"First National Bank of Nvidia.\"\n\n**AI open-weights week:** China's **Kimi K3** (2.8T MoE, 1M-token context) released fully open. **0xSammy** calls it proof frontier AI is becoming commodity infrastructure; **ASvanevik** says neoclouds like Nebius can now compete directly with Anthropic/OpenAI. Same week, China's CXMT (DRAM maker) IPO'd sharply higher (**pboockvar**) and chip exports have doubled in three years (**cryptopunk7213**).\n\n**Crypto:** **Pentosh1** says Hyperliquid's coming KYC push isn't necessarily bearish long-term despite near-term downside; **alpha_pls** argues BTC likely hasn't bottomed yet (still above realized price, MVRV 1.19, no capitulation event). MSTR/STRC buyback mechanics remain contentious between **dampedspring**, **thedefivillain**, and **fejau_inc**.\n\n**Notable:** Mark Cuban (**theallinpod**) warns AI data centers could become \"pickleball courts\" if efficiency gains outrun utilization growth; **saxena_puru** takes the other side, calling the AI-stock pullback routine and the risk/reward now favorable.", "sections": {"A_events": [{"cluster": "Iran Ceasefire Skepticism & Oil Markets", "category": ["geopolitics", "energy"], "items": [{"author": "JavierBlas", "summary": "President Trump told @BarakRavid: \"We are in very deep talks with Iran. If they don't work out, we will go back to very strong military action.\" On timeline: \"Not much time. Either it goes fast or not at all.\"", "tweet_url": "https://x.com/JavierBlas/status/2081760663198658604", "created_at": "2026-07-27T15:16:34.000Z", "type": "tweet"}, {"author": "Geiger_Capital", "summary": "Notes the US Strategic Petroleum Reserve has been drawn down under both Biden and Trump and now sits at its lowest level in over 40 years, arguing the SPR is being used to mask the market impact of the Iran conflict.", "tweet_url": "https://x.com/Geiger_Capital/status/2081758119177122176", "images": ["https://pbs.twimg.com/media/HOPj-gdXIAAWSbr.jpg"], "created_at": "2026-07-27T15:06:27.000Z", "type": "tweet"}, {"author": "BobEUnlimited", "summary": "De-escalation signs are crushing short-dated oil prices to start the week, but Hormuz transits remain limited, Bab-el-Mandeb is still closed, and Chinese demand is picking back up — a \"long road to normalization,\" not a clean resolution.", "tweet_url": "https://x.com/BobEUnlimited/status/2081696051233186204", "images": ["https://pbs.twimg.com/media/HOOrfnPW8AAU_px.png"], "created_at": "2026-07-27T10:59:49.000Z", "type": "tweet"}, {"author": "_tolks", "summary": "Says markets are no longer buying the \"ceasefire/TACO\" rally pattern — the narrative violation is visible in the charts in real time, with a lot of trapped capital now needing to make decisions as the bounce fails to hold.", "tweet_url": "https://x.com/_tolks/status/2081787204225974412", "images": ["https://pbs.twimg.com/media/HOP-FHyW8AA7MDU.png"], "created_at": "2026-07-27T17:02:01.000Z", "type": "thread"}, {"author": "dampedspring", "summary": "Dry aside: if a weekend TACO (Trump-Always-Chickens-Out-style de-escalation) headline is only good for an oil dip and can't lift equity futures, questions why markets keep reacting to it at all.", "tweet_url": "https://x.com/dampedspring/status/2081750574450589830", "created_at": "2026-07-27T14:36:28.000Z", "type": "thread"}, {"author": "Evan_ss6", "summary": "Jokes that Trump \"ceasefired the ceasefire\" after floating a possible Iran deal again, yet the market still can't bounce.", "tweet_url": "https://x.com/Evan_ss6/status/2081788872682254723", "created_at": "2026-07-27T17:08:39.000Z", "type": "tweet"}]}, {"cluster": "Satellite Watch: Saudi Abqaiq Flaring", "category": ["energy", "geopolitics"], "items": [{"author": "JavierBlas", "summary": "Sentinel-2 satellite imagery shows significant flaring in Saudi Arabia's Eastern Province, including at the Abqaiq processing facility and Ghawar oilfield links. Flaring alone doesn't indicate damage, but a close-up comparison suggests one of the pits holding the key spheroids may have been flooded — cause (fire, preventive spraying, or something else) is unknown.", "tweet_url": "https://x.com/JavierBlas/status/2081737189226958955", "images": ["https://pbs.twimg.com/media/HOPLPUkWQAAtlpc.jpg", "https://pbs.twimg.com/media/HOPMlxXWQAApzsc.jpg", "https://pbs.twimg.com/media/HOPNGkEXYAAzY2B.jpg", "https://pbs.twimg.com/media/HOPO4zQXIAANjAz.jpg", "https://pbs.twimg.com/media/HOPQiz_W0AEqrBC.jpg"], "created_at": "2026-07-27T13:43:17.000Z", "type": "thread"}]}, {"cluster": "Rhine Water Levels Near Historic Lows", "category": ["energy", "macro"], "items": [{"author": "JavierBlas", "summary": "The Rhine's water level at the Kaub chokepoint has fallen to the 2nd-lowest in recent history (behind only October 2018), threatening barge shipping. Post-2018, naval engineers built special ultralow-draft barges for exactly this scenario, and the current drought will test them.", "tweet_url": "https://x.com/JavierBlas/status/2081764519714365707", "images": ["https://pbs.twimg.com/media/HOPphSaXoAAWrKs.jpg"], "urls": ["https://www.bloomberg.com/opinion/articles/2023-07-13/climate-crisis-a-made-in-germany-fix-to-ever-lower-rhine-water-levels"], "created_at": "2026-07-27T15:31:53.000Z", "type": "thread"}]}, {"cluster": "FOMC: Historic Uncertainty Into Wednesday's Decision", "category": ["macro"], "items": [{"author": "biancoresearch", "summary": "Since the 2009 financial-crisis end, the Fed has held 135 FOMC meetings — only 4 (3%) had hike/cut probability sitting between 33-66% this close to the decision. This meeting (the 136th) has hike odds at 36%, and 3 of the 4 prior instances of this level of uncertainty involved financial-stress episodes. Bianco reads this as the end of clear forward guidance, meaning this level of uncertainty into meetings becomes the new normal going forward.", "tweet_url": "https://x.com/biancoresearch/status/2081746048603635822", "images": ["https://pbs.twimg.com/media/HOPYW_HWIAANMSV.png", "https://pbs.twimg.com/media/HOPYMENW4AAdbwf.png"], "created_at": "2026-07-27T14:18:29.000Z", "type": "thread"}, {"author": "Fullcarry", "summary": "With the 1-year inflation swap printing below 2%, argues the Fed should pass on hiking this week — the front end of the curve, not a supply-shock-driven print further out, is what's actually driving the committee.", "tweet_url": "https://x.com/Fullcarry/status/2081743424433393854", "images": ["https://pbs.twimg.com/media/HOPWlxEboAAhWK5.png"], "created_at": "2026-07-27T14:08:03.000Z", "type": "thread"}, {"author": "Evan_ss6", "summary": "Flags a Warsh-led hike as a real possibility this week, posting charts showing markets pricing this as a \"live\" meeting.", "tweet_url": "https://x.com/Evan_ss6/status/2081782723547480065", "images": ["https://pbs.twimg.com/media/HOP6hp2WIAAJ0zO.jpg", "https://pbs.twimg.com/media/HOP6ou-WwAAR4dS.jpg"], "created_at": "2026-07-27T16:44:13.000Z", "type": "thread"}, {"author": "fejau_inc", "summary": "Says the era of the rate decision being fully priced in ahead of the meeting is over — expects genuine two-way volatility around FOMC meetings to be the new norm.", "tweet_url": "https://x.com/fejau_inc/status/2081754070638010839", "images": ["https://pbs.twimg.com/media/HOPgSJ0a8AAbOTS.jpg"], "created_at": "2026-07-27T14:50:22.000Z", "type": "thread"}]}, {"cluster": "Nvidia's $250B OpenAI Guarantee Rattles the Stock", "category": ["ai", "macro", "positioning"], "items": [{"author": "dampedspring", "summary": "Notes the market reaction makes sense: Nvidia guaranteeing $250BN of someone else's (OpenAI's) debt and the stock dropping is a logical response, not a mystery — buybacks are cushioning the move. Separately endorses a widely-shared framing that \"Nvidia is AIG — the provider of credit protection and off-balance-sheet leverage.\"", "tweet_url": "https://x.com/dampedspring/status/2081737209619615767", "created_at": "2026-07-27T13:43:22.000Z", "type": "thread"}, {"author": "jimcramer", "summary": "Repeatedly hammers the theme through the day: dubs it the \"First National Bank of Nvidia,\" says a new \"Nvidia Central Bank\" narrative is now tussling with oil and the Fed for market attention, and argues that absent the financing angle, NVDA would be soaring on fundamentals — the selling is specifically about financing-structure fears echoing 2000.", "tweet_url": "https://x.com/jimcramer/status/2081737560456364258", "created_at": "2026-07-27T13:44:45.000Z", "type": "tweet"}, {"author": "lord_fed", "summary": "Reacting to chatter comparing AI-specialist funds to Archegos, asks the sharper question: what happens if a multi-billion-AUM 'AI specialist' fund is ever forced to de-risk into a crowded exit, especially in an illiquid summer tape.", "tweet_url": "https://x.com/lord_fed/status/2081751954649194704", "created_at": "2026-07-27T14:41:57.000Z", "type": "thread"}]}, {"cluster": "China's Open-Weight AI Push: Kimi K3, CXMT IPO, Chip Exports", "category": ["ai", "tech", "geopolitics"], "items": [{"author": "0xSammy", "summary": "Kimi K3's open weights (2.8T-param MoE, native visual understanding, 1M-token context) are, in his read, proof frontier AI is becoming an open commodity — echoing Jensen Huang's point last week. As frontier intelligence opens up, the capex advantage shifts from training-from-scratch to the infrastructure layer: GPUs, distributed compute, inference, data and agents.", "tweet_url": "https://x.com/0xSammy/status/2081785965408932246", "images": ["https://pbs.twimg.com/media/HOP9TCjXEAAFDgN.jpg"], "created_at": "2026-07-27T16:57:06.000Z", "type": "thread"}, {"author": "ASvanevik", "summary": "Argues the market underrates that neoclouds like Nebius (now a Day-0 Kimi K3 partner via Token Factory) can now compete directly with Anthropic and OpenAI on inference.", "tweet_url": "https://x.com/ASvanevik/status/2081768901965414646", "created_at": "2026-07-27T15:49:18.000Z", "type": "tweet"}, {"author": "cryptopunk7213", "summary": "Recaps China's AI week: Kimi K3 launched at frontier intelligence fully open; CXMT (China's AI-memory maker) IPO'd up ~500%, becoming China's most valuable company at a $500B valuation; and reports surfaced that China developed a key ASML-equivalent component required for AI chipmaking — probably not a coincidence, he notes, that momentum is building on all three fronts simultaneously.", "tweet_url": "https://x.com/cryptopunk7213/status/2081741187858194547", "images": ["https://pbs.twimg.com/media/HOPUlBqXAAAuZJy.jpg"], "created_at": "2026-07-27T13:59:10.000Z", "type": "tweet"}, {"author": "pboockvar", "summary": "Flags CXMT's outsized first-day IPO move — the world's 4th-largest DRAM maker at ~8% market share, with ambitions to grow further.", "tweet_url": "https://x.com/pboockvar/status/2081723117538283782", "images": ["https://pbs.twimg.com/media/HOPECSRXsAAVoYy.png"], "created_at": "2026-07-27T12:47:22.000Z", "type": "tweet"}, {"author": "EMostaque", "summary": "In a compute-scale exchange tied to the Kimi K3 discussion, revises his estimate of the model's training compute up to roughly 2-3e25 FLOPs, saying it looks more active/efficient than he originally thought.", "tweet_url": "https://x.com/EMostaque/status/2081765446903046532", "created_at": "2026-07-27T15:35:34.000Z", "type": "tweet"}]}, {"cluster": "Hyperliquid's KYC Reckoning", "category": ["crypto", "regulation"], "items": [{"author": "Pentosh1", "summary": "Says some form of front-end KYC for $HYPE was always coming given US-securities trading ambitions, especially after Hyperliquid Labs met with the SEC. Near-term volatility will skew to the downside when it lands, but he doesn't think it has to be structurally bearish long-term — revenue could even multiply as institutions gain the ability to touch Hyperliquid for the first time.", "tweet_url": "https://x.com/Pentosh1/status/2081745154369589557", "created_at": "2026-07-27T14:14:56.000Z", "type": "thread"}, {"author": "Crypto_McKenna", "summary": "Reads the same SEC/CFTC meetings as evidence Hyperliquid Labs, HPC and tradexyz are actively building the infrastructure to onboard into the US.", "tweet_url": "https://x.com/Crypto_McKenna/status/2081730105928249706", "created_at": "2026-07-27T13:15:08.000Z", "type": "tweet"}]}], "B_insights": [{"author": "nicbstme", "summary": "Argues compute, not algorithmic breakthroughs, is AI's real moat. Scientific ideas diffuse quickly — papers get published, researchers move, open source catches up — but the ability to run 10x-bigger training runs, collect 10x more RL experience, serve billions of inference tokens, and run thousands of experiments in parallel does not diffuse nearly as fast. Scaling compute requires GPUs, power, substations, networking, cooling, land, permits, and hundreds of billions of dollars — you can't decide to build that overnight. The frontier, in his view, is increasingly about who can compound compute the fastest, not who has one genius idea.", "tweet_url": "https://x.com/nicbstme/status/2081710226655375635", "category": "ai", "created_at": "2026-07-27T11:56:08.000Z", "type": "thread"}, {"author": "Delphi_Digital", "summary": "Two connected threads on AI infrastructure economics. First: self-driving labs (AI models connected directly to lab equipment, with each experiment's results feeding back into the model) split into execution orchestration (turning plans into instrument instructions) and data orchestration (recording and returning results). The execution layer is getting crowded — the five largest hardware players already control 45-60% of lab-automation revenue — but the data layer is stickier: a competitor can copy scheduling software, but not the accumulated depth of experimental history. Second, a companion clip argues frontier labs may open-source models once they've verticalized enough to capture value elsewhere in the stack, rather than purely from the model itself.", "tweet_url": "https://x.com/Delphi_Digital/status/2081741554381885883", "images": ["https://pbs.twimg.com/media/HOPU6T3bIAAHSXX.jpg"], "urls": ["https://members.delphidigital.io/reports/closing-the-loop-the-self-driving-lab-landscape?code=2bfb2fadcce1&utm_source=twitter&utm_medium=social"], "category": "ai", "created_at": "2026-07-27T14:00:38.000Z", "type": "thread"}, {"author": "garrytan", "summary": "Makes the case for open weights as a hedge against value/virtue monoculture: if everyone ends up using the same 'god model,' society's scoring functions collapse into one, and status flattens into a 'permanent underclass' dynamic. His fix is more scoring functions and more tournaments to play, not fewer — competition at the model layer matters for the same reason political and economic pluralism matters.", "tweet_url": "https://x.com/garrytan/status/2081778636064182361", "category": "ai", "created_at": "2026-07-27T16:27:59.000Z", "type": "thread"}, {"author": "RaoulGMI", "summary": "Reflects on getting Bitcoin badly wrong in 2013 — wrote the first macro piece on BTC, bought at $200 right before it crashed, and the actual mistake wasn't the thesis, it was letting noise talk him out of holding through the drawdown. His framework (The Everything Code, The Exponential Age, The Economic Singularity) is why he says he does the same thing every time the market turns depressing: goes back to the thesis and accumulates, since crypto is one of the only secular trends that lets you build wealth against currency debasement.", "tweet_url": "https://x.com/RaoulGMI/status/2081786320150528369", "category": "crypto", "created_at": "2026-07-27T16:58:31.000Z", "type": "thread"}, {"author": "stacy_muur", "summary": "Bullish snapshot on Spark ($SPK): $4.6B TVL, $1.8B active loans, $205.6M annualized fees / $23.7M revenue, market cap just $50.4M (FDV $169.8M) — meaning FDV sits below annual fees, with 21.7% of market cap staked. 90-day TVL grew ~7.2% while Aave V3 and Compound V3 were flat-to-negative, which she credits to DAI-focused stablecoin lending holding up in volatile conditions plus new integrations (DualPool on Uniswap v4, Polymarket Lightning). Watching: DualPool adoption, any governance move to convert protocol earnings into tokenholder value, and institutional flows versus Morpho/Aave.", "tweet_url": "https://x.com/stacy_muur/status/2081727296273268908", "images": ["https://pbs.twimg.com/media/HOPH8XNbkAA1kfv.jpg"], "category": "crypto", "created_at": "2026-07-27T13:03:58.000Z", "type": "tweet"}, {"author": "stacy_muur", "summary": "On why tokenized stocks won't consolidate into one winner: different platforms solve different parts of the stack — Ondo (institutional-grade tokenization/liquidity), xStocks (DeFi-native distribution), Backpack (fast access to new listings on Solana), Robinhood (regulated retail onramp), Dinari (regulated infra for company-issued tokenized shares), and Securitize (tokenization/compliance infra for institutions). Expects a small group of interdependent winners rather than a single juggernaut.", "tweet_url": "https://x.com/stacy_muur/status/2081749957800034588", "images": ["https://pbs.twimg.com/media/HOPcjgXa8AEzchS.png"], "category": "crypto", "created_at": "2026-07-27T14:34:01.000Z", "type": "tweet"}, {"author": "0xSammy", "summary": "Argues physical AI/robotics capital will eventually dwarf what's gone into AI labs. Points to a $12M seed round for onchain robotics play axisrobotics (valuation undisclosed) against Figure AI's last private round at $39B, calling the gap between where robotics capital is actually going and where onchain robotics is valued 'enormous' — ties it to Jensen Huang's recent open-weight-AI comments extending into physical AI too.", "tweet_url": "https://x.com/0xSammy/status/2081717606482870629", "category": "ai", "created_at": "2026-07-27T12:25:28.000Z", "type": "thread"}, {"author": "PeterDiamandis", "summary": "WTF Daily digest: an autonomous AI-driven intrusion hit Hugging Face over a weekend (17,000+ logged actions, privilege escalation, credential theft, lateral movement); when commercial frontier models proved too restrictive for forensic analysis, Hugging Face used its own self-hosted GLM 5.2 instead. Also flags: Elon considering feeding SpaceX's full 20-year engineering history into Grok's next 2T model; Kimi K3's open-source drop; the Treasury Secretary floating China sanctions; Anthropic's $1.5B settlement for pirating 480,000 books (with authors reportedly now embedding prompt-injection attacks in new books to poison future training runs); and Trump waiving lifetime NDAs for UAP witnesses.", "tweet_url": "https://x.com/PeterDiamandis/status/2081781976990683519", "category": "ai", "created_at": "2026-07-27T16:41:15.000Z", "type": "thread"}, {"author": "0xJeff", "summary": "Running an experiment turning an AI agent ('Hermes') into an autonomous oil-trading agent that pays for its own inference out of trading profits — early record is 4 wins, 2 losses (66.7% win rate), and he's sharing the strategy and setups as he goes.", "tweet_url": "https://x.com/0xJeff/status/2081712157675159956", "category": "ai", "created_at": "2026-07-27T12:03:49.000Z", "type": "tweet"}, {"author": "thedefiedge", "summary": "Weekly reads roundup: a trader farmed $250K off a mispriced prediction-market bot; a16z argues TradFi (JPMorgan, BlackRock, Franklin Templeton) wants blockchain's settlement/collateral benefits without the decentralization; Cyber Fund's 'two futures' thesis (cyberslavery vs. cybernetic economy) for where AI pushes capital; a defense of MEV as a competitive, largely neutral-builder auction rather than theft; Bitwise's case that the next bull market is TradFi rails moving on-chain (citing Hyperliquid's trad-asset volume share and Robinhood Chain's $300M in two-week deposits); IOSG's map of the private-AI stack as enterprises grow wary of leaking IP to model APIs; and, reluctantly, a look at Ansem's creator-coin thesis.", "tweet_url": "https://x.com/thedefiedge/status/2081720925205254375", "category": "crypto", "created_at": "2026-07-27T12:38:39.000Z", "type": "thread"}, {"author": "rektmando", "summary": "Daily markets digest: BTC $65,254 (+1%), ETH $1,960 (+4%) leading majors, Fear & Greed at 29, $279M in 24h liquidations, BTC ETFs -$240M / ETH ETFs -$71M outflows; Nasdaq $24,980 (-1%), gold $4,100 (+1%); this week brings the FOMC decision, Big Tech earnings and PCE. Also flags: oil sliding on the US-Iran strike halt (with a tanker reportedly hit by a mine in Hormuz per Iran); Nvidia's $250B OpenAI data-center backstop; SK's $500B+ AI infrastructure tie-up with Nvidia; and Anthropic said to be strongly opposed to open-source AI per Sacks.", "tweet_url": "https://x.com/rektmando/status/2081745093804081539", "images": ["https://pbs.twimg.com/media/HOPXujgbQAA8TaV.jpg"], "category": "macro", "created_at": "2026-07-27T14:14:41.000Z", "type": "thread"}, {"author": "brian_armstrong", "summary": "Coinbase's Base thesis: with only 8B humans but potentially 10x that in transacting AI agents, Coinbase is building the rails for 'agentic finance' (AiFi) onchain. Separately announced Base and Solana assets are now instantly tradeable within seconds of going onchain via Coinbase's new Launches tab, positioned as instant distribution infrastructure for builders and asset issuers.", "tweet_url": "https://x.com/brian_armstrong/status/2081784289893523734", "category": "crypto", "created_at": "2026-07-27T16:50:27.000Z", "type": "tweet"}, {"author": "naval", "summary": "On drones vs. interceptors: calls it an inherently unfavorable matchup for defense, like guns vs. armor — attackers get surprise, gravity and force concentration, and jamming/EMPs can't stop hardened autonomous munitions. Argues this is MAD's logic pushed down to the individual level; locality and cheap passive armor (concrete, nets) help the defender somewhat, but concentrated force can still overwhelm it.", "tweet_url": "https://x.com/naval/status/2081722616776212675", "category": "geopolitics", "created_at": "2026-07-27T12:45:23.000Z", "type": "thread"}, {"author": "GavinSBaker", "summary": "Reacting dryly to a thread on AI power concentration ('kinda funny given the worry Microsoft is about to cut capex'), Baker separately endorses the framing that concentration of AI capability is more dangerous than distribution/diffusion — a data point for the open-vs-closed AI power debate playing out this week.", "tweet_url": "https://x.com/GavinSBaker/status/2081783895507238979", "category": "ai", "created_at": "2026-07-27T16:48:53.000Z", "type": "thread"}, {"author": "andrewchen", "summary": "Notes the trajectory: 2020 had zero $1T companies, 2026 has seven, and by 2030 he expects the first $10T company — Nvidia and Apple as the obvious candidates, asking who else could get there.", "tweet_url": "https://x.com/andrewchen/status/2081609399718875587", "category": "macro", "created_at": "2026-07-27T05:15:29.000Z", "type": "tweet"}, {"author": "hooeem", "summary": "Argues the biggest barrier to non-developers vibe-coding is a knowledge gap — without understanding what's happening, you can't build with taste. Proposes an AI framework that teaches the builder what changed, why, and what could break, while maintaining context across sessions, so users learn by doing even though it costs more tokens upfront.", "tweet_url": "https://x.com/hooeem/status/2081664382543552635", "category": "ai", "created_at": "2026-07-27T08:53:58.000Z", "type": "thread"}, {"author": "Rewkang", "summary": "Argues robots need to be purpose-built for physical AI (sense, react, learn) rather than repurposed industrial hardware, flagging Standard Bots as a company leading that design shift.", "tweet_url": "https://x.com/Rewkang/status/2081744104031998095", "category": "ai", "created_at": "2026-07-27T14:10:45.000Z", "type": "tweet"}, {"author": "krugermacro", "summary": "One-liner riffing on crypto's tendency to financialize anything: \"Einstein: 'Human stupidity is infinite.' Crypto: 'Let's tokenize it.'\"", "tweet_url": "https://x.com/krugermacro/status/2081766461811687771", "category": "crypto", "created_at": "2026-07-27T15:39:36.000Z", "type": "tweet"}, {"author": "hasufl", "summary": "Brief aside tied to a stablecoin-history thread: to understand the future of money, it helps to study the past.", "tweet_url": "https://x.com/hasufl/status/2081668340037112156", "category": "crypto", "created_at": "2026-07-27T09:09:42.000Z", "type": "tweet"}, {"author": "Melt_Dem", "summary": "Brief but pointed endorsement of AI music tool Suno as genuinely impressive.", "tweet_url": "https://x.com/Melt_Dem/status/2081648432712745282", "category": "ai", "created_at": "2026-07-27T07:50:36.000Z", "type": "tweet"}, {"author": "stonecoldpat0", "summary": "Reflecting on how DeFi discourse has changed in five years: less 'missionary, change the world' anti-institutional energy, more practical TradFi-DeFi integration, financial engineering (MEV, DeFi mechanics) and hands-on applications rather than abstract ideology.", "tweet_url": "https://x.com/stonecoldpat0/status/2081758362455457967", "category": "crypto", "created_at": "2026-07-27T15:07:25.000Z", "type": "tweet"}, {"author": "RayDalio", "summary": "Principle-of-the-day: owners' vested interests around meritocratic leadership can conflict with the most 'believable' people in the org, and that tension needs to be worked out deliberately rather than owners simply ceding control.", "tweet_url": "https://x.com/RayDalio/status/2081719223970115637", "category": "society", "created_at": "2026-07-27T12:31:54.000Z", "type": "tweet"}, {"author": "BillAckman", "summary": "Points to Bernard Arnault's public rebuttal of a Le Monde investigation as an example of X shifting the balance of power away from legacy media and back toward individuals.", "tweet_url": "https://x.com/BillAckman/status/2081706238153261278", "category": "society", "created_at": "2026-07-27T11:40:18.000Z", "type": "tweet"}, {"author": "paulg", "summary": "Short aside amplifying a point about earnest young builders standing out quickly, and separately names TJ Rodgers as the founder who's influenced him second-most after Jobs.", "tweet_url": "https://x.com/paulg/status/2081750272490037673", "category": "society", "created_at": "2026-07-27T14:35:16.000Z", "type": "tweet"}], "C_contrarian": [{"author": "alpha_pls", "summary": "Argues BTC probably hasn't bottomed, against the hopeful mood: (1) the drawdown (~50% off highs) is shallow versus 2018 (-84%) and 2022 (-77%); (2) there's been no forced-selling capitulation event this cycle, and those typically precede macro bottoms; (3) BTC hasn't touched realized price (~$52.5K, MVRV 1.19) — every prior bear traded below it; (4) July 2018 and July 2022 were both counter-trend rally months that fully reversed afterward, and this rally is tracking the same pattern; (5) macro looks shakier as the AI trade cools and inflation stays sticky. Says the ETF-era cost basis could make this bear behave differently, but the base case remains more downside, with a 200-week MA DCA approach preferred to bottom-picking.", "tweet_url": "https://x.com/alpha_pls/status/2081770567074537740", "images": ["https://pbs.twimg.com/media/HOPq_usWsAAAsVK.jpg"], "type": "thread"}, {"author": "ZeeContrarian1", "summary": "Notes that in three months, nothing has actually changed in the Strait of Hormuz, yet oil went from $110 to $70 back to $90 — proof that near-term prices are driven by sentiment, not fundamentals, and that any new 'fundamental story' invoked for each move is missing the point. Separately, a longer rant argues technical analysis is functionally a horoscope: markets simply go up over time, so any method studied over a long enough horizon will look validated, but the specific patterns (diamond tops, fractals, gamma squeezes) don't actually predict anything.", "tweet_url": "https://x.com/ZeeContrarian1/status/2081675424354976000", "type": "thread"}, {"author": "theallinpod", "summary": "Mark Cuban warns that a lot of today's AI data centers could end up as 'pickleball courts' if a price-performance curve emerges that minimizes power requirements — comparing it to the dark-fiber glut, where 1GB-to-100GB fiber leaps eventually eliminated the bandwidth shortage everyone assumed was permanent. He's also flagging that Big Tech is layering AI capex borrowing on top of an existing private-credit problem.", "tweet_url": "https://x.com/theallinpod/status/2081775136026296622", "type": "tweet"}, {"author": "sjdedic", "summary": "Bull on gamified-commerce platforms generally (Collector, Beezie) but explicitly bearish on $FWA despite its strong current revenue print. His distinction: FWA gamifies NFTs — a market almost nobody wants anymore — and uses heavy token emissions to manufacture the appearance of demand ('loss to earn'). Compares it unfavorably to gamifying assets people organically want (Pokémon cards, watches, whiskey), arguing the need for token incentives is itself the tell that real demand isn't there. Expects FWA's revenue to fade back toward zero within weeks.", "tweet_url": "https://x.com/sjdedic/status/2081780076924842238", "type": "tweet"}, {"author": "saxena_puru", "summary": "Pushes back on the bearish AI-trade mood: calls the current pullback a routine, healthy exhale after a parabolic move, not a trend change. Leading stocks are approaching key technical levels with favorable risk/reward, and memory/semis supply remains tight with no near-term relief.", "tweet_url": "https://x.com/saxena_puru/status/2081616487152808091", "type": "tweet"}], "D_positioning": [{"author": "Pentosh1", "summary": "Discloses buys at $EWY 155.52, $AAOI $93, $NBIS $166.30 and $SNDK $1,395 after waiting six weeks for the dip — all four are still above his entry despite the recent -30-60% pullback from highs. AAOI and NBIS are longer-term holds; he's already sold the SNDK position (was only playing it for a bounce) and plans to trim EWY within the week. Says his notional exposure isn't outsized, and finds it notable how many flipped bearish only after a -50% move.", "tweet_url": "https://x.com/Pentosh1/status/2081781225493319890", "type": "thread"}, {"author": "cointradernik", "summary": "Reports his long/short strategy up +6.49% month-to-date versus SPY -0.83% (+7.32% alpha with a week left in the month), +22.4% YTD (+14pp excess over SPY), fully deployed since June after live-testing. Separately recaps a crude oil short thesis that played out exactly as expected (capped just below $94, then -12%), and flags BTC now ~180 days since the Feb low without a meaningful breakdown — arguing there's signal in that resilience, with a weekly close above the 90-day realized VWAP as his line for confirming a new bull leg (versus a fakeout like May's).", "tweet_url": "https://x.com/cointradernik/status/2081729210599563761", "images": ["https://pbs.twimg.com/media/HOPH8c2WIAA_iz8.jpg", "https://pbs.twimg.com/media/HOPH-WcWMAAkXTJ.png", "https://pbs.twimg.com/media/HOPID5tWMAAKKuP.png", "https://pbs.twimg.com/media/HOPIAuKXwAACvNa.png"], "type": "tweet"}, {"author": "ColdBloodShill", "summary": "Flags reduced momentum as ETH pushes through recent highs while BTC has already tapped the top of its range — calls the next few days important for which way momentum resolves. Separately, on $SPCX: a tight selling channel that he expects eventually breaks, likely to the downside first (given the trend, with $100 a key level coming into play) before a relief bounce.", "tweet_url": "https://x.com/ColdBloodShill/status/2081770014051299589", "images": ["https://pbs.twimg.com/media/HOPuqlJWwAAd5PS.jpg"], "type": "tweet"}, {"author": "mfigge", "summary": "Maintains his thesis on a specific NFT collection (Bored Ape-adjacent) as oversold and written off, with a short-term 300M market-cap target. Flags the 0.15 level as key support/resistance now validated by multiple retests, and describes an ongoing effort to talk directly with holders. Lists risks (Yuga execution, midterm elections, Clarity Act turbulence, macro) against catalysts (ecosystem growth, Otherside milestones, ApeFest).", "tweet_url": "https://x.com/mfigge/status/2081703658798903581", "images": ["https://pbs.twimg.com/media/HOOtb0zXgAAnyaw.jpg", "https://pbs.twimg.com/media/HOOvBBgXIAAwf4B.jpg", "https://pbs.twimg.com/media/HOOwsKQX0AAu8Pn.jpg", "https://pbs.twimg.com/media/HOOw4GfXcAAW3bD.jpg"], "type": "thread"}, {"author": "DTAPCAP", "summary": "Sees gold starting to take hold as Fed tightening this year looks unlikely given large productivity gains; expects digital-asset infrastructure buildout to continue regardless, with more liquidity accelerating the shift and AI supercharging the transition from old to new.", "tweet_url": "https://x.com/DTAPCAP/status/2081742232248369566", "images": ["https://pbs.twimg.com/media/HOPVhmjWoAAZDWD.jpg"], "type": "tweet"}, {"author": "BobEUnlimited", "summary": "Flags a surge in upward earnings revisions in Europe that he thinks is getting overlooked while everyone focuses on the US earnings season — a potential rotation signal.", "tweet_url": "https://x.com/BobEUnlimited/status/2081759270727496116", "images": ["https://pbs.twimg.com/media/HOPlBngXMAAZzGS.jpg"], "urls": ["https://www.bloomberg.com/news/articles/2026-07-23/jpmorgan-quants-say-strongest-earnings-upgrades-are-in-europe"], "type": "tweet"}, {"author": "thedefivillain", "summary": "Runs a sustained critique of Strategy's (MSTR) STRC buyback: the market barely reacts when Saylor sells MSTR shares instead of BTC directly (he sold $550M of MSTR last week — roughly a third of a year's dividends raised in one week), yet these instruments trade mostly on confidence, so breaking the 'buyback floor' risks spooking the market. He argues BTC treasury companies can work under proper management, but MSTR's sheer size is a separate, additional risk from the DAT model itself; the real lever to pressure Saylor is keeping STRC depegged so he has to keep eroding the bitcoin-per-share ratio defending it.", "tweet_url": "https://x.com/thedefivillain/status/2081719141673624053", "type": "thread"}, {"author": "Bluntz_Capital", "summary": "Notes $PUMP pumped after his earlier flagged setup, wishing more of his calls moved that fast.", "tweet_url": "https://x.com/Bluntz_Capital/status/2081716796755935321", "images": ["https://pbs.twimg.com/media/HOO-ZHNbYAEp-TT.jpg"], "type": "tweet"}, {"author": "fejau_inc", "summary": "Likes the outcome forming with MSTR: Saylor is diluting common-equity holders to fund STRC buybacks and build a USD reserve buffer, while pausing BTC purchases entirely — and BTC is up 10% since he stopped buying, which fejau reads as bullish for bitcoin 'returning to trad // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
