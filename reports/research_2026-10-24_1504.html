<script>
const ITEMS = [{"id": 1, "cat": "venture", "urgency": "deep", "source": "Irrational Analysis / Market Memo", "title": "OpenAI's $1.4T round is getting haggled by the Gulf — and Anthropic's IPO price keeps sliding", "idea": "OpenAI was rushing to close a private round at $1.4T and Middle East investors pushed back on the price. Anthropic's IPO target reportedly went $2T -> $1.6-1.8T -> whisper $1.5T, raising $60-100B. Author finds a $1.5T Anthropic vs $1.25T OpenAI gap (~20%) too narrow given market share, and thinks audited Anthropic S-1 numbers are why OpenAI wants to close first.", "angle": "The marginal buyer of last resort negotiating on price is the first real mark on AI private valuations. S-1 disclosure is the catalyst that turns vibes into comps.", "tweetA": "The Gulf wrote cheques for everything since 2023 and now it's haggling over $1.4T. When the exit-liquidity crowd starts asking for a discount, that's price discovery arriving. $MSFT $NVDA", "tweetB": "An audited Anthropic S-1 lands soon and OpenAI wants its round closed before anyone can put the two side by side. A valuation you close to avoid a comparison is a deadline, not a price.", "charts": {"count": 0, "hot": false, "desc": "Chart-light section; deal numbers in text"}, "link": "https://irrationalanalysis.substack.com/p/market-memo-dancing-in-the-rain"}, {"id": 2, "cat": "venture", "urgency": "deep", "source": "Irrational Analysis / Market Memo", "title": "'Alcoholic ARR': part of frontier-lab revenue is competitors distilling the models", "idea": "Distillation lets a rival copy most of a model's capability for ~$0.5-1B of R&D versus $5-10B to train (author's directional numbers, 'made up but directionally correct'). Author argues a non-trivial share of Anthropic and OpenAI ARR is distillation spend, that Anthropic is backing it out as a 'temporarily 6-8% headwind' in its IPO, and that the revenue migrated to OpenAI.", "angle": "Revenue that funds your own price competition is low quality. Also explains why public models are distilled from larger internal ones that are too big to serve.", "tweetA": "If 6-8% of ARR is rivals buying the model to clone it, the question isn't the haircut. It's what the other ~93% looks like once the clones are good enough to stop buying. $GOOGL $META", "tweetB": "R&D arbitrage: roughly 10x cheaper to distill than to train, on a 1-3 month lag. Frontier pricing power is a melting asset and the IPO prospectus will have to say so.", "charts": {"count": 1, "hot": false, "desc": "Video-game piracy vs distillation comparison table"}, "link": "https://irrationalanalysis.substack.com/p/market-memo-dancing-in-the-rain"}, {"id": 3, "cat": "AI/infra", "urgency": "deep", "source": "Irrational Analysis / Market Memo", "title": "Dot-com detour: Moffett's rebuttal to 'there is no dark GPU'", "idea": "Author leaned on Gavin Baker's point that there is no dark GPU/ASIC, unlike dark fiber in 2000. A Craig Moffett counterargument from a Ben Thompson interview shook that. Added points: ~75% of Anthropic+OpenAI spend is training; if either trains less under financial stress the world gets inference capacity fast; plus Chinese distillation, model obsolescence and a cost-driven demand ceiling.", "angle": "The bust mechanism isn't idle chips today, it's training capex being the discretionary line that funds the cluster build-out.", "tweetA": "Dark fiber was the dot-com tell. The 2026 version isn't idle GPUs, it's what happens to inference supply the day the two biggest buyers stop financing training. Training is the optional 75%. $NVDA $AVGO $ORCL", "tweetB": "Baker says no dark GPUs. Moffett says capacity frees up the moment training stops being financed. Both can be right at once, and the cheap compute lands on everyone who isn't a lab.", "charts": {"count": 1, "hot": false, "desc": "Moffett interview snippet screenshot"}, "link": "https://irrationalanalysis.substack.com/p/market-memo-dancing-in-the-rain"}, {"id": 4, "cat": "AI/infra", "urgency": "deep", "source": "Irrational Analysis / Market Memo", "title": "The $200/month subscriber who complains about limits is your demand curve", "idea": "Author knows many people on the $200 max plan who constantly complain about limits and refuse to spend more, even with business expense accounts. He reads this as extraordinary subsidy, not normal subscription slack-usage economics, while the source of the subsidy tries to IPO and wean users off. Ramp data (biased to VC/startup customers) also flagged as 'circular token spending'.", "angle": "Token demand has a price ceiling well below current subsidized cost. Watch gross margins in the S-1.", "tweetA": "People paying $200 a month and still complaining about limits aren't price-insensitive. They're telling you willingness to pay is below the subsidized price. The IPO prospectus is where that gets tested. $MSFT $AMZN", "tweetB": "Circular financing had its moment. Now there's circular token spending: startups funded by VC burning tokens bought from labs funded by the same VCs. Ramp data skews to exactly that cohort.", "charts": {"count": 1, "hot": false, "desc": "Ramp token-spend chart"}, "link": "https://irrationalanalysis.substack.com/p/market-memo-dancing-in-the-rain"}, {"id": 5, "cat": "science", "urgency": "deep", "source": "Irrational Analysis / Market Memo", "title": "AI proves obscure math theorems in public — author asks what it's worth", "idea": "OpenAI open-sourced a GitHub repo of AI-solved math problems. Author calls out vague claims that it used little compute (an unreleased, too-large-to-serve internal model likely did the work) and notes open-sourcing implies little economic value. Asks plainly whether any recent AI-maths result is economically useful.", "angle": "Capability headlines vs monetization is the gap to watch into the IPOs.", "tweetA": "AI labs are now competing on who solves the most economically useless math problem. Impressive, free on GitHub, and zero ARR. Which breakthrough has a buyer?", "tweetB": "The 'unreleased internal model' did the maths, which means compute spent on proofs is compute not served to paying customers. Capability showcases are a cost line.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://irrationalanalysis.substack.com/p/market-memo-dancing-in-the-rain"}, {"id": 6, "cat": "science", "urgency": "deep", "source": "Irrational Analysis / Market Memo", "title": "AI drug discovery saves 3-4 years but approval still takes ~10", "idea": "Author's critique of the pivot to biology as the next revenue leg: coding growth has tapered, a new monetizable use case is needed within 12-18 months, and drug discovery is among the most regulated, slowest-to-revenue industries. Compression of discovery saves 3-4 years but commercial approval still takes ~10. He warns of 'a very bad time in 2028' without new ARR. Cites Citrini work incl. an analyst testing an AI-discovered antivenom.", "angle": "Timing mismatch between the cash needs of lab capex and pharma revenue cycles.", "tweetA": "AI deletes 3-4 years from discovery. FDA still takes ~10. If pharma is the next revenue leg for the labs, the cash arrives after the debt does. $LLY $XBI", "tweetB": "Coding revenue is flattening, so the pitch moved to biology. That is the industry with the longest sales cycle on earth. A 12-18 month revenue gap does not close with a 10-year approval clock.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://irrationalanalysis.substack.com/p/market-memo-dancing-in-the-rain"}, {"id": 7, "cat": "AI/infra", "urgency": "deep", "source": "Irrational Analysis / Market Memo", "title": "AXTI: the entire optics industry needs 6-inch InP wafers beyond 2027", "idea": "Author calls $AXTI a favorite: the industry needs high-quality 6-inch indium phosphide wafers to function beyond 2027, and a 'panic China export controls' headline would take the stock back to March prices. He plans a deep-dive on why 6-inch InP is so hard, after lunch with the CEO who is passionate about crystallography.", "angle": "Substrate bottleneck under the optics build-out; export-control headline risk is both entry and thesis risk.", "tweetA": "Everyone's hunting the optics winner. The scarcer thing is the substrate: high-quality 6-inch InP. Picks and shovels of the picks and shovels. $AXTI $COHR $LITE", "tweetB": "AXTI is China-exposed on both sides: export-control panic is the entry, but the same headline can be the thesis breaking. Size for the headline arriving first.", "charts": {"count": 1, "hot": false, "desc": "AXTI price chart vs March levels"}, "link": "https://irrationalanalysis.substack.com/p/market-memo-dancing-in-the-rain"}, {"id": 8, "cat": "AI/infra", "urgency": "deep", "source": "Irrational Analysis / Market Memo", "title": "Credo hit on Edgewater note that xAI may go optics for Vera Rubin", "idea": "Credo 'got killed today' on an Edgewater note saying xAI may move to optics for Vera Rubin. Author has heard the chatter for a month, but the objection he hears is that nobody can make 1.6T AEC work at 6 metres, not that xAI needs 10m. He calls the bad news priced in, is tempted to go long and is an 'extreme ultra bull' on Credo SerDes and uVCSEL NPO/CPO in the 6-20m range.", "angle": "Copper vs optics is a reach map (AEC ~6m, uVCSEL ALC 6-20m, then NPO/CPO), not a binary.", "tweetA": "Credo sold off on a note about xAI using optics. The engineering objection is that 1.6T AEC at 6m doesn't work, not that xAI needs 10m. The market priced the reach debate as if it were a customer loss. $CRDO", "tweetB": "Copper vs optics isn't binary, it's a reach map. AEC to ~6m, uVCSEL ALC 6-20m, then NPO/CPO. Whoever owns the middle gap wins whichever way xAI goes. $CRDO $MRVL", "charts": {"count": 1, "hot": false, "desc": "CRDO price chart after the drop"}, "link": "https://irrationalanalysis.substack.com/p/market-memo-dancing-in-the-rain"}, {"id": 9, "cat": "AI/infra", "urgency": "deep", "source": "Irrational Analysis / Market Memo", "title": "AAOI: staged China transceiver ban rumor + AMD starved for high-power lasers", "idea": "Rumor of a soft, staged Chinese transceiver ban by year-end. AMD (plus Ayar Labs and Marvell) is starved for high-power lasers for the 2028 AMD GPU ramp (MI500-class). Author says Coherent 'won't get anything' while AAOI 'might get something'.", "angle": "Second-source dynamics in supply-constrained optics.", "tweetA": "A staged ban on Chinese transceivers plus AMD, Ayar and Marvell all short of high-power lasers for 2028. The trade isn't who makes transceivers, it's who has lasers in volume. $AAOI $AMD $MRVL", "tweetB": "In supply-constrained cycles the second source gets the multiple. Author says Coherent gets nothing and AAOI maybe something. That's a map, not a recommendation.", "charts": {"count": 1, "hot": false, "desc": "AAOI chart"}, "link": "https://irrationalanalysis.substack.com/p/market-memo-dancing-in-the-rain"}, {"id": 10, "cat": "positioning", "urgency": "deep", "source": "Irrational Analysis / Market Memo", "title": "Bloom beat and imploded; SemiAnalysis anti-TSEM note called 'Claude-slop'", "idea": "Bloom reported great earnings and imploded anyway; author stayed out of an earnings YOLO, bought back some at lower levels and sees 160-ish as 'buy and pray'. He also thinks a SemiAnalysis note against Tower (TSEM) is 'mostly wrong Claude-slop' and would take the other side near 130, but is fully de-levered until a clearing event.", "angle": "Good news being sold is the positioning tell; contrarian semis ideas size down while margin is off.", "tweetA": "Great earnings, stock implodes. That is not a fundamentals tape, it's a positioning tape. Good news is the exit. $BE", "tweetB": "Taking the other side of the most-read semis shop is a fine trade only if you size for being early. The author is flat leverage waiting for a clearing event. $TSEM", "charts": {"count": 2, "hot": false, "desc": "BE and TSEM price charts"}, "link": "https://irrationalanalysis.substack.com/p/market-memo-dancing-in-the-rain"}, {"id": 11, "cat": "positioning", "urgency": "deep", "source": "Irrational Analysis / Market Memo", "title": "'70-80% of the way to peak fear' — one more panic, then a clearing event", "idea": "Author says the last few weeks were violent, likely worse before better, and the market is 70-80% of the way to peak fear. He wants one more round of panic and a clearing event; floats the election plus the Anthropic IPO as candidates.", "angle": "A specific framework for the bottom: panic plus a defined clearing event.", "tweetA": "One more panic, then a clearing event. The two candidates on the table: midterms and an Anthropic IPO. The second is the first hard public mark on AI. Bottom or top, it's the event.", "tweetB": "A semis specialist who is de-levered and not buying the dip is what 70-80% of the way to peak fear looks like. Capitulation is when the margin comes back on.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://irrationalanalysis.substack.com/p/market-memo-dancing-in-the-rain"}, {"id": 12, "cat": "culture", "urgency": "watch", "source": "Irrational Analysis / Market Memo", "title": "Net withdrawn $1.07M from a trading account that peaked at $113K deposited", "idea": "Author's trading account net cash flow is -$1.0729M versus a historical max deposit of +$113.13K. He says ~8 years of engineering earnings (salary, bonus, RSU, ESPP, benefits) are meaningfully less than 4 years of 'degen trading'. His long-only book is denominated in 'years I can be unemployed': ~5 years runway at $100K spend, ~8 years excluding 401K.", "angle": "Denominating wealth in runway rather than dollars; survivorship bias in public trader confessions.", "tweetA": "$1.07M net withdrawn from an account that never held more than $113K of deposits, and 4 years of trading out-earned 8 years of engineering. That's a survivorship-bias chart with a brokerage screenshot.", "tweetB": "Wealth in 'years I can be unemployed' beats wealth in dollars. 40-50% more semis drawdown still leaves multi-year runway at $80-100K spend. That's a risk framework, not a P&L.", "charts": {"count": 3, "hot": false, "desc": "Net cash deposited/withdrawn plot"}, "link": "https://irrationalanalysis.substack.com/p/market-memo-dancing-in-the-rain"}, {"id": 13, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / Forex Weekly", "title": "The dollar is trading as a levered bet on US AI capex, not a haven", "idea": "Broad USD direction increasingly tracks how investors mark future US capex, especially AI. The dollar has behaved procyclically and its link to energy has weakened. If recent tech headlines mark the start of a capex slowdown, credit tightens, equities and yields fall together, and USD loses the growth premium doing more work than its safe-haven label.", "angle": "A cross-asset way to hedge an AI capex scare through FX.", "tweetA": "The dollar isn't trading as a haven, it's trading as a levered claim on hyperscaler capex. If guidance slips you don't get the old flight to quality, you get USD down with equities and yields. Check what DXY did on the last two AI selloffs.", "tweetB": "DXY and Nasdaq now own the same assumption: capex today becomes earnings tomorrow. If you're short one on a capex-slowdown thesis, you may already be short the other.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/forex-weekly-ai-bangs-the-currency"}, {"id": 14, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / Forex Weekly", "title": "JPY outperformed G10 on Oct 14 and Oct 22 — the AI-anxiety days", "idea": "Yen outperformed on Oct 14 and 22 when AI capex and earnings anxiety took over, with mixed signals on 15-16 (hot US CPI, rising energy, easing European stress). JPY weakness alongside rising yields is less severe than in the past 6-7 years because BoJ policy (YCC in 2022) is less of a drag. The author argues short EUR/JPY is the cleaner tactical trade ahead of the October 30 BoJ meeting; short USD/JPY is the better hedge for a broad AI growth shock.", "angle": "JPY has been a poor hedge since 2020 because shocks were inflation/policy shocks, not growth shocks. An AI scare is a growth shock.", "tweetA": "The yen hedge got cheaper not because carry improved but because the BoJ stopped standing on its throat via YCC. The 2022 one-way USD/JPY machine is a different regime. Still negative carry, but the asymmetry flipped.", "tweetB": "JPY beat G10 on the two AI-anxiety days, Oct 14 and Oct 22. Two data points isn't a regime, but it's where to check the hedge book. BoJ on Oct 30 is a hurdle, not a catalyst.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/forex-weekly-ai-bangs-the-currency"}, {"id": 15, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / Forex Weekly", "title": "FX is pricing two accidents: US corporate credit and European sovereign credit", "idea": "One tail is a corporate-credit and AI-capex accident centred on the US; the other is a sovereign-credit accident centred on Europe. The yen hedges the first and EUR weakness expresses the second. If the AI wobble proves a short recalibration, sovereign concerns return to the front, hitting EUR while USD and KRW regain support. Baseline: moderating inflation, cooling growth, synchronized G10 policy, softer USD vs carry EM and managed currencies like CNY.", "angle": "Single pair (EUR/JPY) that works in both regimes.", "tweetA": "FX is pricing two accidents at once: US corporate credit and European sovereigns. The yen hedges the first, euro weakness expresses the second. That's a pair trade, not a dollar view: short EUR/JPY.", "tweetB": "Regime switch: AI shock means long yen, no AI shock means sovereign stress returns and Europe breaks first. Short EUR/JPY works either way. I'll be watching which of the two shows up first.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/forex-weekly-ai-bangs-the-currency"}, {"id": 16, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / Forex Weekly", "title": "Terms-of-trade sorting: AUD, CAD, NOK on energy; KRW on AI exports", "idea": "AUD, CAD and NOK topped the G10 table on higher energy prices and favourable policy expectations. NOK/SEK strips out dollar noise and shows the gap between energy exporters and importers. Korea's terms of trade improved through AI demand, keeping KRW resilient while the market debates whether energy and AI capex last.", "angle": "Two commodity-like export stories (oil and chips) in one FX map.", "tweetA": "AUD, CAD and NOK lead G10 on energy while KRW holds on AI exports. Currencies are sorting by who writes the cheque and who cashes it. NOK/SEK is the cleanest read because it strips the dollar.", "tweetB": "Two terms-of-trade winners with different drivers: oil exporters and chip exporters. If oil rallies while AI capex wobbles, the krone and the won decouple. That is a relative-value trade hiding inside a calm tape.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/forex-weekly-ai-bangs-the-currency"}, {"id": 17, "cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom / McElligott (Nomura)", "title": "McElligott calls a 'pause': AI is in a lose-lose reflexivity trap", "idea": "Thursday's midweek AI relief rally flipped into a risk-management event after Meta's spending plans read as a financing burden. Nomura's Charlie McElligott called a 'pause' after a stop-out event: more capex raises funding fears, less capex undermines a priced-in growth story. Peak risk-management unwind may have happened Thursday but a pause isn't a durable turn.", "angle": "A two-sided capex trap is a regime, not a correction.", "tweetA": "More capex raises funding fears. Less capex kills the growth story. When both branches are bad for the same trade you aren't in a correction, you're in a regime. $META $MSFT", "tweetB": "VIX isn't the tell. Down-day vol and factor stop-outs inside crowded AI trades are. 'Interesting valuation' stops mattering and 'survive the drawdown' takes over.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-trade-turns-toxic-charlie"}, {"id": 18, "cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom / McElligott (Nomura)", "title": "Nomura: bonds and short rates still carry huge squeeze potential", "idea": "Nomura positioning work shows bonds and short rates still hold enormous squeeze potential, so the growth-scare trade hasn't run out of fuel. The real signal is the violence inside crowded AI and rate trades, not the VIX.", "angle": "Positioning in duration as the second leg of an AI de-risking.", "tweetA": "While everyone watches Nasdaq, Nomura says bonds and short rates are still the squeeze with fuel. The growth scare trade isn't done. And it collides with Fed hikes: duration rallies only if the data break first. $TLT", "tweetB": "Short-rate squeeze potential plus a hiking Fed (see Ironsides) is the awkward combo. If it squeezes, it's because growth breaks, not because the Fed blinks.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-trade-turns-toxic-charlie"}, {"id": 19, "cat": "macro", "urgency": "deep", "source": "Ironsides Macro / The Stretch Run", "title": "Ironsides: the Fed's pivot, not supply or term premium, lit the 10-year", "idea": "Attribution work says the Fed's hawkish pivot, not Treasury supply, deficits, breakevens or term premium, was the primary catalyst for the rise in 10-year yields. The Fed is using rate hikes to offset structural inflation while leaving balance-sheet posture largely unchanged, which damages housing, raises federal interest expense, and exposes leveraged data-center financing.", "angle": "If the Fed did it, the cure is policy reversal rather than fiscal consolidation.", "tweetA": "Ironsides says the 10-year spike is a Fed story, not a bond-vigilante story. Supply, deficits, breakevens, term premium all ranked below the pivot. If so, the cure is a policy reversal, not fiscal consolidation.", "tweetB": "A Fed hiking against structural inflation while keeping the balance sheet unchanged raises federal interest expense while pretending to fight the deficit. The rate hike is financing the problem it targets. $TLT $IEF", "charts": {"count": 15, "hot": false, "desc": "15 charts/tables, mostly paywalled; summary only in email"}, "link": "https://ironsidesmacro.substack.com/p/the-stretch-run-2018-looms-large"}, {"id": 20, "cat": "macro", "urgency": "deep", "source": "Ironsides Macro / The Stretch Run", "title": "FOMC preview: no October hike, December hike kept alive, 2018 rhyme", "idea": "Ironsides does not expect an October hike because a surprise amid widening AI credit spreads would be unnecessary disruption. They expect the Chairman to preserve expectations for a December hike and further tightening in H1 2027. Two defining policy shocks of 2026: the Iran War and the Fed's pivot toward hikes. Weaker employment or renewed equity/credit stress could stop hikes and improve 2027.", "angle": "Title 'Stretch Run: 2018 Looms Large' — hiking into stress.", "tweetA": "No hike this week, December kept alive, more in H1 2027. Ironsides raises the odds policy has to reverse in 2027. Two outs from the cycle: labor weakens or spreads widen. Both are bad for equities first and good for duration second.", "tweetB": "Strong cloud earnings stabilize AI credit, which preserves the case for a December hike, which hurts AI credit. Good news for AI is bad news for rates is bad news for AI. $MSFT $AMZN $GOOGL", "charts": {"count": 15, "hot": false, "desc": "15 charts paywalled"}, "link": "https://ironsidesmacro.substack.com/p/the-stretch-run-2018-looms-large"}, {"id": 21, "cat": "macro", "urgency": "deep", "source": "Ironsides Macro / The Stretch Run", "title": "Housing is 'ground zero': demand at historic lows while supply deteriorates too", "idea": "Housing demand has fallen to historic lows, builder confidence and single-family construction show supply is also deteriorating. Tightening into this weakness, partly because official rent measures lag current market rents, would deepen the damage to households and the broader economy.", "angle": "Policy steering by lagged rent data; supply and demand both falling.", "tweetA": "Housing demand at historic lows and the Fed tightening against rent data that lags market rents. Driving by the rear-view mirror. $DHI $LEN", "tweetB": "Low demand AND low construction is the part consensus misses. The next recovery hits a supply wall, so the eventual rebound is a price spike, not a volume rebound.", "charts": {"count": 15, "hot": false, "desc": "Housing demand / builder confidence charts paywalled"}, "link": "https://ironsidesmacro.substack.com/p/the-stretch-run-2018-looms-large"}, {"id": 22, "cat": "credit", "urgency": "deep", "source": "Ironsides Macro / The Stretch Run", "title": "'Super Malinvestment': capex-to-cash-flow and credit spreads time the data-center bust", "idea": "Ironsides monitors credit spreads and capex-to-cash-flow ratios as the clearest timing signals for the data-center boom; both flash warnings. Strong cloud-provider earnings may stabilize markets, but highly leveraged structures and uncertain monetization leave room for significant failures even if the technology proves transformative.", "angle": "Two observable metrics instead of vibes.", "tweetA": "Two numbers decide the AI capex bust: credit spreads on data-center debt and capex-to-cash-flow. Both are flashing. Canals and railroads were transformative too, and the equity and bondholders still got wiped.", "tweetB": "Technology can be real and the financing structures can still fail. That's the distinction the AI-bubble debate keeps losing. Watch spreads before you watch earnings. $ORCL $CRWV", "charts": {"count": 15, "hot": false, "desc": "Capex-to-cash-flow and spreads charts paywalled"}, "link": "https://ironsidesmacro.substack.com/p/the-stretch-run-2018-looms-large"}, {"id": 23, "cat": "geopolitics", "urgency": "deep", "source": "Ironsides Macro / The Stretch Run", "title": "France: fiscal problems tied to tax-heavy austerity and a larger state", "idea": "Ironsides says France's fiscal problems can't be separated from lasting damage from tax-heavy austerity and an expanded state role; they are uninterested in European debt and equities while monitoring political change.", "angle": "Matches MacroEdge's note on civil unrest in France.", "tweetA": "Ironsides is avoiding European debt and equities over France. MacroEdge cites civil unrest there. Two unrelated desks, same country, same direction. Meanwhile VGK held up this week, per Helene Meisler. Something has to give. $VGK $FXE", "tweetB": "Austerity that raises taxes and expands the state is the worst mix for growth and for politics. France is the test case for tightening in a K-shaped society.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://ironsidesmacro.substack.com/p/the-stretch-run-2018-looms-large"}, {"id": 24, "cat": "gold", "urgency": "deep", "source": "Ironsides Macro / The Stretch Run", "title": "Gold: structural trade-flow support vs near-term headwinds", "idea": "Shifting trade flows remain supportive of gold over time, but persistent energy costs, renewed tariffs, and evidence that data-center capex has peaked weigh on the near-term outlook.", "angle": "Gold framed as a liquidity-sensitive asset in this regime.", "tweetA": "Ironsides lists data-center capex peaking as a headwind for gold. An odd link. It means gold is trading as a liquidity asset in an AI-driven tape, not a haven. $GLD $GDX", "tweetB": "Gold below 360 on GLD is where Meisler says folks will fuss. Ironsides says near-term headwinds, structural tailwinds. The setup is a test of whether gold can decouple from the capex unwind. $GLD", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://ironsidesmacro.substack.com/p/the-stretch-run-2018-looms-large"}, {"id": 25, "cat": "positioning", "urgency": "deep", "source": "Helene Meisler / Saturday Chart Fest", "title": "SOX: 10,500 spike-low support, 11k is the line to recapture", "idea": "SOX 10,500 is the spike low support; 11k was the breakdown this week and it needs to get back over 11k to be saved. S&P and Nasdaq have no real breaks; IWM holds at 270 (four green days, longest streak since mid-August; 270 and 275 loom). Everything looks bad ex-energy, drugs and staples.", "angle": "Technical levels on the AI-semis complex vs Irrational Analysis' fear gauge.", "tweetA": "SOX: 10,500 is the spike low, 11,000 is the breakdown. Need to retake 11k to be saved. Irrational Analysis says we're 70-80% through peak fear. Same tape, one's a chartist, one's an engineer. $SOX $SMH", "tweetB": "S&P and Nasdaq have no real break, yet everything ex-energy and drugs looks bad. That's the setup for a gap, not a drift. $SPY $QQQ $IWM", "charts": {"count": 30, "hot": true, "desc": "~30 Saturday chart fest: SOX, QQQ, IWM, banks, XLE DSI, PALL, 10-yr yield"}, "link": "https://helenemeisler.substack.com/p/saturday-chart-fest-e79"}, {"id": 26, "cat": "credit", "urgency": "deep", "source": "Helene Meisler / Saturday Chart Fest", "title": "Bank index head-and-shoulders: 162 breaks it, 173 saves it; 10-yr 4.90% is the line for bond bears", "idea": "Bank Index: break 162 and the head-and-shoulders top completes; above 173 it gets saved. 10-year yield: break 4.90% and bond bears might capitulate — 'they're counting on you Chair Warsh!'. XBI needs 142 to hold; GLD 360; Utes now loved; MS Summation Index still rising lethargically.", "angle": "Specific levels tie into Ironsides' housing/credit thesis.", "tweetA": "The 10-year at 4.90% is where bond bears capitulate, and the Chair decides. A Warsh Fed hiking into 4.9% is a bigger test than any CPI print. $TLT $TNX", "tweetB": "Bank index: 162 completes the head-and-shoulders, 173 saves it. With Ironsides arguing the Fed is hiking into housing stress, a 162 break is the credit-cycle confirmation. $KBE $XLF", "charts": {"count": 30, "hot": true, "desc": "Bank index H&S pattern, 10-yr yield chart"}, "link": "https://helenemeisler.substack.com/p/saturday-chart-fest-e79"}, {"id": 27, "cat": "energy", "urgency": "deep", "source": "Helene Meisler / Saturday Chart Fest", "title": "Energy sentiment hit 90 Friday; PGMs at 10; transports ignored the oil run", "idea": "XLE DSI got to 90 on Friday; back under 67 and the oil run is done for now. Transports have had no reaction to the latest run in energy. XME to watch because the DSI on platinum and palladium is now 10. LIT idea failed. URA 'no dust'.", "angle": "Crowded energy vs washed-out metals; Dow Theory non-confirmation.", "tweetA": "Transports haven't reacted to the energy run. Either it's a supply shock that hasn't hit freight demand, or the economy isn't confirming. Dow Theory non-confirmation. $IYT $XLE", "tweetB": "Sentiment: XLE at 90 on Friday, platinum and palladium at 10. A pair for contrarians: fade the crowded energy, watch the hated metals. $PALL $XME", "charts": {"count": 30, "hot": true, "desc": "XLE DSI, XME, PALL, OIH charts"}, "link": "https://helenemeisler.substack.com/p/saturday-chart-fest-e79"}, {"id": 28, "cat": "energy", "urgency": "deep", "source": "Doomberg / Margin Call", "title": "Guyana's GDP went from $5.5B (2020) to $27B (2025), IMF sees +22% more in 2026", "idea": "Guyana's real GDP was $5.5B in 2020; growth of 20%, 63%, 34%, 44% and 19% took it to $27B by end-2025, with the IMF projecting another 22% in 2026. When the Errea Wittu FPSO joins four others and full operations begin in December, output exceeds 1M bpd, roughly one barrel per resident. Zero barrels a decade ago.", "angle": "The fastest oil supply response to $60-80 oil isn't shale; it's offshore FPSOs.", "tweetA": "Guyana: $5.5B GDP in 2020, $27B in 2025, and the IMF says +22% more this year. One barrel per resident per day starting December, up from zero a decade ago. Not shale. FPSOs. $XOM $CVX", "tweetB": "A fivefold GDP in five years is what a resource curse looks like from the other side. The climate crowd's 'one-sided deal' criticism aged badly. Governments watching Guyana will now rewrite their own oil contracts to be friendlier. $XOM", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening (GDP, production)"}, "link": "https://newsletter.doomberg.com/p/margin-call"}, {"id": 29, "cat": "energy", "urgency": "deep", "source": "Doomberg / Margin Call", "title": "Brazil's Equatorial Margin: Petrobras Morpho-1 well and a runoff vote tomorrow", "idea": "Petrobras confirmed hydrocarbons at Morpho-1 (block FZA-M-59, ~9,500 ft water, >100 miles offshore, Amapa) in mid-August, then a second oil-bearing layer by October. Suriname's GranMorgu (Block 58) targets 220,000 bpd by mid-2028. Brazil's presidential runoff is tomorrow. Question: does the Equatorial Atlantic become as consequential as Stabroek?", "angle": "Geological analogy trade plus election risk on a state-controlled operator.", "tweetA": "Guyana to Suriname to Brazil's Equatorial Margin: a ruler line on a map is moving the next oil basin east. Petrobras's second oil-bearing layer in Morpho-1 is the second data point. And Brazil votes in a runoff tomorrow. $PBR", "tweetB": "Guyana's Exxon contract versus Brazil's state-controlled Petrobras operating alone at Morpho-1: same geology, different capital structure. Tomorrow's runoff decides which one Brazil leans toward. $PBR $XOM", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://newsletter.doomberg.com/p/margin-call"}, {"id": 30, "cat": "macro", "urgency": "deep", "source": "MacroEdge / Redeye Macro Note", "title": "'Bailout culture': 2008, 2020, 2023 trained a generation to expect rescue", "idea": "MacroEdge argues post-2008 the masses expect a bailout whenever a mistake is made: GFC (banks), pandemic (large companies first), 2023 (Fed rescuing Silicon Valley investors). The result: asset bubble, record wealth inequality and a nihilistic under-30 segment, ingredients for civil unrest as now seen in France. Calls the AI data-centre build-out 'our version of the Chinese ghost cities'. 'Powell's Valhalla' era from 2023 to end of his term guaranteed fiscal/monetary alignment for equity melt-up.", "angle": "Moral-hazard framework linking inequality, youth nihilism and AI capex.", "tweetA": "2008 saved the banks. 2020 saved the biggest companies first. 2023 saved Silicon Valley's depositors. Each rescue taught the next generation of risk-takers that the downside is socialized. France is the first political dividend.", "tweetB": "Data centers as 'ghost cities': massive capex built on expected demand that has yet to show up. Different continent, same pattern. The question is who gets bailed out when the AI ghost cities go vacant.", "charts": {"count": 2, "hot": false, "desc": "2 UMichigan sentiment charts"}, "link": "https://www.macroedge.world/p/redeye-macro-note-plateau-surfing"}, {"id": 31, "cat": "geopolitics", "urgency": "deep", "source": "MacroEdge / Redeye Macro Note", "title": "Midterms in ~10 days with record-low economic readings; Iran war and 'revenge of the old economy'", "idea": "Just over a week from the midterms the GOP is dealing with record-low economic readings across the board (UMichigan charts). The Iran war and a potential 'revenge of the old economy' (Jeffrey Currie) may set up a major rebirth, but MacroEdge doesn't think this reverses post-2008 trends. Also: demographic collapse in birthrates in West and East Asia; MacroEdge Ozone price rising 11/1.", "angle": "Politics, sentiment and energy-shock cycle stacking up before a clearing event.", "tweetA": "Record-low consumer readings a week and a half before the midterms. Add an Iran-war energy shock and an inflation-fueled melt-up in equities. The voters who don't own assets are about to vote on the people who do.", "tweetB": "Jeffrey Currie's 'revenge of the old economy' is the pairing: energy, metals, industrial capacity are the real constraints while capital markets trade on abstractions. MacroEdge says it still won't reverse the trend. $XLE $XME", "charts": {"count": 2, "hot": false, "desc": "UMichigan sentiment charts"}, "link": "https://www.macroedge.world/p/redeye-macro-note-plateau-surfing"}, {"id": 32, "cat": "culture", "urgency": "watch", "source": "Hard Fork", "title": "'High-ceiling, low-stair' America: asset ownership is the sorting hat", "idea": "Quoting @_The_Prophet__: America rewards exceptional agency but no longer reliably rewards ordinary discipline; the median path (degree, job, home, family) now runs through debt, housing inflation, credential filters and entry-level hostility. Low mobility turns inequality into humiliation, pushing voters toward rent control, tariffs, debt relief, socialism, protectionism or strongmen. The deeper cause is a shift from labor mobility to capital compounding: parental assets set where kids start.", "angle": "Political economy of the K-shape: why capitalism loses 'moral permission'.", "tweetA": "High ceiling, low stairs. The exceptional get 10x and the median gets debt. When the ladder looks fake, voters ask for tariffs, rent control and strongmen. That is already in the 2026 policy mix.", "tweetB": "Asset ownership is the sorting hat: parents' house and stocks decide where kids start. Earnings from top-decile consumer exposure are a bad read on the median consumer.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/understanding-the-k-shaped-economy"}, {"id": 33, "cat": "macro", "urgency": "deep", "source": "Blind Squirrel Macro", "title": "Caterpillar 20x in 20 years was still a rounding error vs big tech", "idea": "Reviewing the hypothetical '2006 for 2026' portfolios: the 'Extrapolation' portfolio owned autos, 2 handset makers and GE (bad), while 'Mosaic' owned 5 industrials still on today's long list, up 4x (Fanuc) to 20x (Caterpillar, flattered by 18 months as an 'AI bottleneck' stock) but 'a rounding error' in attribution vs tech and chips. Today the AI capex, rearmament and re-shoring beneficiaries have already re-rated; shortlist is 9 stocks, 3-4 make the final 20-for-20 portfolio.", "angle": "Industrials compound; they don't transform; valuation gate is critical.", "tweetA": "Caterpillar did 20x in 20 years and was a rounding error next to big tech. Industrials compound, they don't transform. After AI capex, rearmament and re-shoring have all re-rated them, the transformation is already in the multiple. $CAT $GEV", "tweetB": "The 2006 'Extrapolation' portfolio bought the narrative winners: handsets and autos. The 'Mosaic' portfolio bought five names that survived to the 2046 list. Narrative is the trap, structure is the survivor.", "charts": {"count": 2, "hot": false, "desc": "Portfolio comparison tables (2006 for 2026)"}, "link": "https://www.blindsquirrelmacro.com/p/the-factory-comes-with-a-price-tag"}, {"id": 34, "cat": "tech", "urgency": "watch", "source": "Sebastian Raschka / Ahead of AI", "title": "Reasoning model = base LLM + verifiable-reward RL + inference compute (11h free course)", "idea": "Raschka released eight videos (~11 hours) building a reasoning model from scratch on a pre-trained Qwen3 0.6B in PyTorch: verifier on MATH-500, sampling and self-consistency, scoring and self-refinement, GRPO for RLVR, and distillation from DeepSeek R1 outputs. Framing: the reasoning model is the engine, the agent harness is the machinery around it (context management and tools). Notes that most current LLMs are reasoning models with variable effort settings.", "angle": "The scarce input is the verifier/reward domain, not the algorithm — and distillation is a legitimate small-lab path.", "tweetA": "Reasoning = base model + verifier + RL, in 11 hours of free video on a 0.6B Qwen. When the algorithm is public, the scarce input is the verifiable reward domain. Math has one. Most of the economy doesn't.", "tweetB": "The same course teaches distilling a small model from R1 outputs. Irrational Analysis argues that same technique is a chunk of frontier-lab ARR. Education is the demand side of that business.", "charts": {"count": 2, "hot": false, "desc": "Engine/harness analogy diagram; topics overview figure"}, "link": "https://magazine.sebastianraschka.com/p/building-reasoning-models"}, {"id": 35, "cat": "crypto", "urgency": "watch", "source": "Seven c Premium", "title": "'Smart money' top 0.01% DEX wallets' biggest 24h inflow: $17k; token-unlock short playbook", "idea": "Weekly on-chain dashboard: top-0.01% DEX wallets' biggest 24h inflows are $17k (YMB/MrBeast), $8k (PUMP), $5k (NIO), $4k each (Japanese goat coin, Moustache); longer-term adds in TripleT and CARDS. Narratives list: tokenised stocks, AI applications, quantum-resistant. Author also notes markets saw only a Mon/Tue rip after 'black Monday' calls and red end-week with oil pumping, and shares a token-unlock short playbook (bear-market play; alts squeeze).", "angle": "Tiny size of 'smart money' memecoin flows says liquidity is thin; tokenised stocks and quantum-resistant narratives are what's being tracked.", "tweetA": "The top 0.01% of DEX wallets' biggest 24h buy is $17k. That is lunch money, not conviction. Crypto flows are too small to carry a narrative right now. $BTC $SOL", "tweetB": "Token unlocks as a short in a bear market, with a warning that alts squeeze. In a tape where good news is sold, unlock overhang can be the whole move. Narratives to watch: tokenised stocks, quantum-resistant. $ETH", "charts": {"count": 5, "hot": false, "desc": "Stablecoin flows, TVL flows, smart-money tables"}, "link": "https://sevenc.substack.com/p/seven-c-premium-161"}];

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function cardHtml(item){

   +'<div><div class="lbl" style="color:#7f77dd">TWEET B</div>'+esc(item.tweetB)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>'
   +'<div class="chart'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING — ':'')+(item.charts.count>0?item.charts.count+' chart(s): ':'')+esc(item.charts.desc||'Charts inside — worth opening')+'</div>'

}
function toggle(id){document.getElementById('c'+id).classList.toggle('open')}
function visible(i){
  if(state.cat!=="All"&&i.cat!==state.cat)return false;
  if(state.urg!=="All"&&i.urgency!==state.urg)return false;
  if(state.src&&i.source.indexOf(state.src)===-1)return false;

function render(expand){
  var out="";
  ITEMS.forEach(function(i){if(visible(i))out+=cardHtml(i)});

  bars();
}
function bars(){
  var cats={};ITEMS.forEach(function(i){cats[i.cat]=(cats[i.cat]||0)+1});

    h+='<span class="pill'+(on?' active':'')+'" style="'+(on?'background:'+c+';border-color:'+c:'')+'" onclick="setCat(\''+k+'\')">'+k+' '+cats[k]+'</span>';
  });
  document.getElementById('catbar').innerHTML=h;
  var u={act:0,deep:0,watch:0};ITEMS.forEach(function(i){u[i.urgency]++});
  var defs=[["All","All",ITEMS.length],["act","🔴 Act Now",u.act],["deep","🔵 Deep",u.deep],["watch","🟡 Watch",u.watch]];
  var g="";
  defs.forEach(function(d){var on=state.urg===d[0];g+='<span class="pill'+(on?' active':'')+'" style="'+(on?'background:#333;border-color:#333':'')+'" onclick="setUrg(\''+d[0]+'\')">'+d[1]+' '+d[2]+'</span>'});
  document.getElementById('urgbar').innerHTML=g;
}
function setCat(c){state.cat=c;state.src=null;render(false)}
function setUrg(u){state.urg=u;state.src=null;render(false)}
function filterBySrc(name){state.src=name;state.cat="All";state.urg="All";render(true)}
function init(){
  document.getElementById('sub').textContent=META.date+" · "+META.time+" · "+ITEMS.length+" items";
  render(false);
  var r='<p><b>Window:</b> '+esc(META.windowStart)+' to '+esc(META.windowEnd)+'. Emails outside this window were not processed.</p>'
   +'<p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items extracted: '+META.itemsExtracted+'</p><p><b>Included sources</b> (click to filter):</p><ul>';
  META.includedSources.forEach(function(s){r+='<li><span class="sl" onclick="filterBySrc(this.textContent)">'+esc(s.name)+'</span> — '+s.items+' items</li>'});
  r+='</ul><p><b>Skipped:</b></p><ul>';
  META.skippedSources.forEach(function(s){r+='<li>'+esc(s.name)+' — '+esc(s.reason)+'</li>'});
  r+='</ul><p><span class="sl" onclick="state.src=null;render(false)">Clear source filter</span></p>';
  document.getElementById('rb').innerHTML=r;
}
init();
</script>
</body>
</html>
