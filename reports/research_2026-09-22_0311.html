function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function renderCard(item) {

  html += '<span class="badge" style="background:' + color + '">' + item.source + '</span>';

  html += '<div class="link-row"><a href="' + item.link + '" target="_blank">↗ Read full article</a></div>';
  html += '</div>';
  html += '</div>';
  return html;
}

function render(expandMatching) {
  buildFilterBars();
  var filtered = ITEMS.filter(function(i) {
    if (activeSrc && i.source.indexOf(activeSrc) === -1) return false;
    if (activeCat !== 'all' && i.cat !== activeCat) return false;
    if (activeUrg !== 'all' && i.urgency !== activeUrg) return false;
    return true;
  });
  var cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = filtered.map(renderCard).join('');
  document.getElementById('emptyMsg').style.display = filtered.length === 0 ? 'block' : 'none';
  if (expandMatching) {
    filtered.forEach(function(i) {
      var el = document.getElementById('card-' + i.id);
      if (el) el.classList.add('open');
    });
  }
}
