<script>
const ITEMS = [{"id": 1, "cat": "positioning", "urgency": "deep", "source": "Callum Thomas / Topdown Charts", "title": "Households: record equity weight, record tech, record-low defensives, near-record-low bonds and cash", "idea": "US household aggregate equity allocation is at a record high, at record-high valuations. Within equities the average investor is skewed into tech while defensive sector weights sit at record lows. Bonds and cash allocations are near record lows. Thomas calls it a trifecta of extremes: maximum risk, minimum defense.", "angle": "This is the demand-side explanation for why every dip has been bought. If there is no cash and no bonds to sell, the marginal seller in a drawdown is forced, not discretionary.", "tweetA": "Record equity weight. Record tech weight. Record-low defensives. Near-record-low cash and bonds. There is nobody left to buy the dip with, only people who need to decide what to sell first. $QQQ $SPY", "tweetB": "Passive index investors think they own 'the market'. They own a levered bet on 7 stocks plus the hope that rates don't matter. Pair that with a 5.3% 10-year and ask who the marginal buyer is.", "charts": {"count": 3, "hot": true, "desc": "Household equity weighting at record high; sector weights with defensives at record low; bonds+cash allocation near record low"}, "link": "https://www.topdowncharts.pro/p/unsafe-investing"}, {"id": 2, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / BofA", "title": "BofA: an 'AI put' is all that stands between stocks and the bond market", "idea": "With 10-year yields above 5% and MOVE above 100, macro would normally command the tape, but BofA's equity derivatives team says the bar to derail the AI trade is very high because investors keep buying dips on the productivity and earnings promise. BofA cites the 1990s as proof equities can run while long rates and the Fed both tighten. The real risk is an AI stumble, not another leg up in yields.", "angle": "Single-factor market: the whole index now rests on one narrative holding. That is a concentration of risk, not a hedge.", "tweetA": "BofA calls it an 'AI put'. A put has a strike and a premium. What is the strike here, and who is the writer? My guess: the writer is every passive holder of the top 10 names.", "tweetB": "1990s analogy only works if the growth story keeps pace with the cost of capital. 10y at 5.3% means AI capex has to earn a higher hurdle every quarter. $NVDA $MSFT $MOVE", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/bofa-the-ai-put-is-the-only-thing"}, {"id": 3, "cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom / BofA", "title": "Bubble Risk Indicator is climbing in tech and semis, but S&P breadth in bubble territory is far below dotcom", "idea": "BofA's Bubble Risk Indicator is rising in tech and semiconductors, yet the number of S&P stocks in outright bubble territory remains far below dotcom-era breadth. The froth is localized, not market-wide.", "angle": "Localized bubbles are the ones that hurt index investors most when the index itself is cap-weighted into that locale.", "tweetA": "Bubble breadth is low, so 'it's not 1999'. But in 1999 the damage also came from a handful of names carrying the index. Localized froth in a 35%+ index weight is not reassuring.", "tweetB": "Semis in bubble territory while 10y at 5.3%. In 2000 the Fed stopped hiking and the S&P still lost 49%. Breadth tells you where the froth is, not how far it falls. $SOXX", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/bofa-the-ai-put-is-the-only-thing"}, {"id": 4, "cat": "energy", "urgency": "act_now", "source": "Paulo Macro", "title": "Paulo: the SPR 'news failure' and why Hormuz transit counters were chasing a one-off Saudi dump", "idea": "Paulo says the higher Hormuz transits that got crowing this week were a one-time Saudi unload of barrels trapped after Houthis knocked the East-West pipeline to Yanbu out of action; China grabbed every Saudi barrel. Independent trackers saw it weeks ago, and active Persian Gulf tonnage showed Saudis couldn't sustain that loading rate. The narrative pile-on shook specs short positioning, which he'd flagged as outsized versus longs a few weeks earlier.", "angle": "Transit-counter bulls and SPR-release bulls both got a headline; positioning already leaned short, which is how you get a squeeze when the headline fades.", "tweetA": "Hormuz transits 'recovered' because Saudi dumped stranded inventory, not because the pipe reopened. A one-time drawdown is not a run rate. Specs are short into that. $USO $XLE", "tweetB": "Oil is trading headlines while physical flow data says the opposite. WTI sub-$90 on SPR and transit counts, with the Yanbu pipeline still broken and Riyadh refinery smoke on the tape. That is a positioning trade, not a supply trade.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://paulomacro.substack.com/p/sometimes-you-just-have-to-look"}, {"id": 5, "cat": "energy", "urgency": "deep", "source": "Dark Side of the Boom / UBS", "title": "Europe gas storage at 71.5% vs 88% 15-year average; UBS sees 74% at start of winter", "idea": "EU storage ended the week at ~71.5% full against a ~88% 15-year average. UBS (Nayoung Kim) expects ~74% at winter start vs 84% last year and ~90% five-year average, falling toward 25% by season-end. Weekly injections have slowed, Norwegian maintenance is cutting supply, and industry is absorbing more gas.", "angle": "A 16-point gap to the five-year norm means weather becomes a tail risk priced into TTF all winter. Combine with diesel stress and it feeds straight into European CPI and ECB.", "tweetA": "74% vs 90%. That's a 16-point hole Europe starts winter in, and it ends near 25%. Normal winter = expensive. Cold winter = negotiation with the weather. $TTF", "tweetB": "Everyone is watching oil. Europe's inventory cushion is thinner than in 2022. Gas plus diesel plus LNG competition is a macro tax on industrial margins just as the ECB's room to ease is gone.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/europes-gas-clock-is-ticking-and"}, {"id": 6, "cat": "energy", "urgency": "deep", "source": "Dark Side of the Boom / UBS", "title": "Qatar shipped 4 LNG cargoes in September vs ~25 pre-June 2025; JKM premium >$1.50 over TTF", "idea": "Qatar loaded only four cargoes in September versus roughly 25 before June 2025 (average closer to 30), with some buyers facing force majeure into November or early December. Weekly LNG inflows to Asia jumped, with arrivals into Japan and South Korea up more than 30% week on week. JKM trades at over $1.50/MMBtu premium to TTF.", "angle": "Cargoes go where the price is. Europe has to outbid Asia from a position of weakness. This is the real transmission channel from Gulf conflict to European energy inflation.", "tweetA": "4 cargoes vs 25. That's not a supply 'dip', that's a regime. JKM at +$1.50 over TTF means Europe is the one who has to raise the bid. $LNG $TTF", "tweetB": "Qatar down 85% in cargo count while the market debates whether Hormuz 'recovered'. Ask Japan and Korea, whose arrivals just jumped 30% and who won't give them back.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/europes-gas-clock-is-ticking-and"}, {"id": 7, "cat": "culture", "urgency": "watch", "source": "Herb Greenberg", "title": "Rebranding as a red flag: Career Education to Perdoceo, DeVry to Adtalem to Covisata", "idea": "Greenberg's Red Flag report on Perdoceo Education $PRDO (formerly Career Education) frames a pattern: for-profit education names change (Career Ed to Perdoceo, DeVry to Adtalem and now the made-up Covisata $CVSA) and, in his words, new names, same old games. He also did an interview on Turning Point Brands $TPB as the stock continues to slide; he discloses owning $TPB.", "angle": "Name change as a screening signal is cheap to test. Worth a quick factor check on rebrands versus subsequent returns, especially in sectors with regulatory baggage.", "tweetA": "Career Education became Perdoceo. DeVry became Adtalem became Covisata. If a company changes its name more often than its business model, the name is the product. $PRDO $CVSA", "tweetB": "Test I'd love to see: forward 3-year returns for US small caps after a name change in a regulated sector. My bet is that the rebrand is information about management's view of legacy reputation.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.herbgreenberg.com/p/the-wrap-quick-recap-and-heads-up"}, {"id": 8, "cat": "venture", "urgency": "watch", "source": "Tavi Costa", "title": "Costa launches a mining-focused fund: 'miners likely one of the most attractive themes of the next decade'", "idea": "Tavi Costa announced he is launching a mining-focused fund (Azuria Capital, accredited investors only), saying miners are likely one of the most attractive investment themes of the next decade. No data in the note, but a prominent macro voice moving from commentary to a dedicated vehicle is a signal.", "angle": "A known gold/commodities macro voice putting capital behind miners as a standalone fund is a positioning tell, and ties to the debasement and 5%+ yields debate.", "tweetA": "Macro commentators launching single-theme funds is a late-cycle tell or an early-cycle tell, depending on which side of the move you were on. Miners with 5.3% real-ish yields to fight is a conviction trade. $GDX $COPX", "tweetB": "Tavi's call is the 10-year view. The 10-year yield is the 3-month problem. The question for miners is who funds the capex when the cost of capital just touched its 2002 high.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://tavicosta.substack.com/p/personal-update"}, {"id": 9, "cat": "AI/infra", "urgency": "deep", "source": "Elvis Saravia / AI Agents Weekly", "title": "Gemini 4 Argon: 77.9% DeepSWE, 1M output tokens, $2/$10 intro pricing", "idea": "Google DeepMind's Gemini 4 Argon sets SOTA on DeepSWE v1.1 at 77.9%, raises output limit from 64K to 1M tokens, and ranks first on Zapier AutomationBench (51.3%) and 91.7% on LVBench. Internal agents are migrating C/C++ to Rust (up to 800K lines for the Fuchsia Zircon kernel) and rewrote 32K lines of SIMD in libgav1 into a decoder 2.7x faster. Intro price is $2 in / $10 out per million tokens with 95% off cached input, rising to $4/$20.", "angle": "A full 1M-token output trajectory costs about $10 at intro pricing. That is the unit economics of a long-horizon agent run.", "tweetA": "1M output tokens for $10. A multi-hour autonomous coding run now costs less than lunch, and Google is migrating a kernel from C to Rust with it. Do the math on junior engineer hours. $GOOGL", "tweetB": "Rewriting 800K lines of C++ into Rust is a security story: memory-safety debt gets paid by machines. Who sells the exploit-finding side when the patching side is this cheap?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/ai-agents-weekly-gemini-4-argon-openai"}, {"id": 10, "cat": "tech", "urgency": "deep", "source": "Elvis Saravia / AI Agents Weekly", "title": "OpenAI 'dots': always-on agents with their own cloud computer, 4,000+ app plugins, and their own credentials", "idea": "OpenAI launched dots, always-on agents powered by GPT-6 Astra that run on their own cloud computer and browser, connect to 4,000+ apps, learn from feedback and keep working in the background. Specialist dots with their own identity and credentials for defined roles inside organizations are in enterprise pilots, with planned integration with Microsoft Agent 365. Rolling out to Pro and Business Premium in eligible markets.", "angle": "Agents with their own identity and credentials means non-human identities become a first-class enterprise category: IAM, audit, and liability.", "tweetA": "OpenAI is giving agents their own computer, their own identity and their own credentials. That's not a chatbot feature, that's a new employee class that never sleeps. Identity vendors should be paying attention. $OKTA $MSFT", "tweetB": "Dots plus Microsoft Agent 365 means the seat-based SaaS pricing model has a problem: what's the license for a worker that logs in as itself? $CRM $NOW", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/ai-agents-weekly-gemini-4-argon-openai"}, {"id": 11, "cat": "science", "urgency": "deep", "source": "Elvis Saravia / AI Agents Weekly", "title": "Argon finds, validates and patches vulns autonomously; trusted defenders get it without cyber guardrails", "idea": "Gemini 4 Argon can find, validate and patch vulnerabilities on its own and ties for first on CWE-bench v1 at 68%. It rolls out first to trusted cyber defenders through the Fairwind Program without cyber guardrails, while Google monitors chain-of-thought and actions and stops execution when needed.", "angle": "Staged release to defenders first is a new norm: dual-use capability gated by who you are. That is a regulatory template and a competitive moat for incumbents with trust relationships.", "tweetA": "Google is shipping a model that can find and patch vulnerabilities, but only to defenders first, without guardrails, with chain-of-thought monitoring. That's a template for how dual-use AI gets released. Expect regulators to copy it. $GOOGL $CRWD", "tweetB": "68% on CWE-bench. If defenders get the unguardrailed model first, the question is how many weeks the attackers' version lags. Patch cycles are about to be measured in hours.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/ai-agents-weekly-gemini-4-argon-openai"}, {"id": 12, "cat": "macro", "urgency": "act_now", "source": "Macro Mornings", "title": "10-year at 5.30% at September close, highest since April 2002, even with WTI under $90", "idea": "Oil fell and the 10-year kept climbing to 5.29% on Wednesday, the second day in a row it diverged from oil (it had followed oil down for a year). Two weeks earlier the author said that with oil below $100, 8,000+ on the S&P would be his base case. WTI is now below $90 and the 10-year closed September at 5.30%, highest since April 2002. He concludes the condition was met and the outcome refused, so he is redrawing the map.", "angle": "The oil-yields correlation breaking is the story. If oil no longer drives yields, term premium and supply are driving them.", "tweetA": "Oil down, yields up, two days running. The 10-year has stopped listening to oil after a year of following it. Once is noise, twice is a message. Whatever is driving it, it isn't inflation expectations. $TLT $TNX", "tweetB": "Setup: WTI <$90, payrolls +29K, GDPNow falling, and the 10y at its highest since 2002. That is the bond market saying fiscal and term premium, not growth. Stocks are pricing the other regime.", "charts": {"count": 4, "hot": true, "desc": "WTI collapse on G7 SPR news; hiking cycles vs dollar; 10Y vs S&P earnings yield; GDPNow"}, "link": "https://macromornings.substack.com/p/broken-the-link-that-held-markets"}, {"id": 13, "cat": "macro", "urgency": "deep", "source": "Macro Mornings", "title": "Five Fed hiking cycles since 1994, five drawdowns avg -15%; the dollar sets the damage", "idea": "After an average of 330bps of hikes, the S&P had five drawdowns averaging about -15%; we are 25bps into this one. Size of hikes doesn't decide: 1999 (175bps) hurt more than 2004 (425bps). When the dollar rallied the average drawdown was -19%, when it weakened -8.3%. 2022-23: S&P -25.4%, DXY 114.8; 1999-2000: -12%, EUR/USD 1.04 to 0.83. Peak losses in the 2000s came only after the Fed stopped: -49% after May 2000, -57% after June 2006.", "angle": "Dollar direction as the amplifier gives a concrete monitor. Author points to Tokyo (yen) as the swing factor, which links to the carry unwind of Aug 2024.", "tweetA": "Hiking cycles since 1994: 5 drawdowns. The size of the hikes didn't predict the damage; the dollar did. -19% when DXY rallied, -8% when it didn't. We are 25bps in. Watch USD/JPY, not the dot plot. $DXY $USDJPY", "tweetB": "The line that stays with me: peak losses came after the Fed stopped, -49% after May 2000, -57% after June 2006. The market isn't afraid of the hike. It's afraid of the pause that means something broke.", "charts": {"count": 1, "hot": true, "desc": "Chart: S&P drawdown by Fed hiking cycle since 1994 vs dollar move"}, "link": "https://macromornings.substack.com/p/broken-the-link-that-held-markets"}, {"id": 14, "cat": "macro", "urgency": "deep", "source": "Macro Mornings", "title": "10-year yield exceeds S&P earnings yield by 1.47 points, widest since 2002", "idea": "The 10-year yields 1.47 points more than the S&P 500 earnings yield, the widest gap since 2002: $100 buys about $3.80 of earnings in stocks vs $5.29 guaranteed in Treasuries. The last time the spread was positive (2000-2002) the S&P returned about -1% per year for a decade vs ~+6% for US bonds, while DXY peaked near 121 then lost ~40% by 2008. At the other extreme, March 2009 at -7.25 preceded +400% in the S&P to Feb 2020.", "angle": "Equity risk premium at negative levels. Author says there's a way to convert the gap into an index level (chart 8, behind paywall).", "tweetA": "$3.80 of earnings or $5.29 guaranteed. The last time the 10-year paid more than the S&P's earnings yield by this much, stocks returned -1% a year for a decade and bonds +6%. I keep coming back to this chart. $SPY $TLT", "tweetB": "Negative ERP isn't a timing signal, it's a return forecast. The 2000-02 spread implied a lost decade. The only difference now: the earnings are AI earnings, which the market thinks compound. That's the entire debate.", "charts": {"count": 1, "hot": true, "desc": "10Y yield minus S&P earnings yield, widest since 2002"}, "link": "https://macromornings.substack.com/p/broken-the-link-that-held-markets"}, {"id": 15, "cat": "energy", "urgency": "act_now", "source": "Macro Mornings", "title": "G7/IEA release of up to 100M barrels over 4 months is only ~830k b/d, 0.8% of global demand", "idea": "The G7 will release up to 100M barrels of oil and diesel over 4 months via the IEA. WTI fell from about $92.70 to $89.10 (-4%) on the headline. Washington asked for 120M barrels of diesel, more than 40% of EU emergency stock; Paris offered 50M diesel + 50M crude, about 17%. Precedents: June 2011 (60M bbl, Brent -6% then back above $115 in 3 weeks); spring 2022 (240M bbl, WTI printed $122 on June 8).", "angle": "Releases move oil for weeks, not years. The author watches USD/CAD for regime change. Europe pays with thinner diesel stocks going into a gas-tight winter.", "tweetA": "100M barrels over 4 months is 830k b/d, or 0.8% of global demand. Oil fell 4% on that. In 2011 the same trick lasted three weeks. In 2022 the 'largest release ever' and WTI hit $122 anyway. $USO $XLE", "tweetB": "Washington gets the headline before the midterms. Europe gets the bill: 17% of its emergency stock, in the same week its gas storage is 16 points below normal. Connect those two.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://macromornings.substack.com/p/broken-the-link-that-held-markets"}, {"id": 16, "cat": "labor", "urgency": "act_now", "source": "Macro Mornings", "title": "Payrolls +29K vs +90K expected; unemployment 4.2%; wages 3.0% vs core PCE 3.4% means real wages negative", "idea": "Payrolls +29K vs +90K expected; unemployment 4.2%, above the Fed's year-end projection of 4.1%; wages grew 3.0% vs core PCE 3.4%, so real wages just turned negative. Atlanta Fed GDPNow for Q3 fell to 3.7% from 5.0% on Sept 25 and from ~6.2% early August. He compares it with Aug 2, 2024 (+114K vs +175K): S&P -6% and Nasdaq -8% in 3 sessions, Nikkei -12.4% on Aug 5, Fed cut 50bps seven weeks later.", "angle": "Futures cheered a miss because markets priced 71% odds of no October hike. Bad-news-is-good works until yields refuse to fall.", "tweetA": "+29K vs +90K, unemployment 4.2%, and real wages negative. Futures rallied because the miss lowers hike odds. But the 10-year is at 5.3% and isn't falling. That's the stagflation tell. $SPY", "tweetB": "Wages 3.0%, core PCE 3.4%. Real wages negative in an economy the Fed is trying to cool further. Compare Aug 2024: a weaker print and the carry trade unwound in 3 days. Today the 10y didn't rally.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://macromornings.substack.com/p/broken-the-link-that-held-markets"}, {"id": 17, "cat": "geopolitics", "urgency": "act_now", "source": "Dark Side of the Boom / ZeroHedge", "title": "Smoke reported over Aramco's Riyadh refinery (~130k b/d) as Saudis prepare major Houthi offensive", "idea": "Unverified footage on X shows black smoke over Aramco's Riyadh refinery (capacity ~130k b/d); NASA FIRMS shows higher-intensity VIIRS thermal hits. Axios (two US officials): Saudis preparing a major operation against Houthis in coming days targeting coastal areas that give leverage over Bab al-Mandeb, with ground forces loyal to Yemen's government and Saudi air cover. A US official said the US 'is not going to take kinetic action for now.'", "angle": "A second chokepoint (Bab al-Mandeb) joins Hormuz. Saudi Yanbu export route via the Red Sea already compromised by the E-W pipeline hit.", "tweetA": "Smoke over Riyadh refinery on a Saturday, Saudi ground op against the Houthis in days, and oil is below $90 on a reserves release. If the Bab al-Mandeb operation triggers retaliation on Yanbu, that is a different oil market on Monday. $XLE $CVX", "tweetB": "Riyadh's refinery is only 130k b/d, but it is symbolic: the Houthis can reach the capital. Weekend gap risk in crude and the SPR announcement already priced in. Do the math if Muscat falls through.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/via-zerohedge-black-smoke-reported"}, {"id": 18, "cat": "geopolitics", "urgency": "deep", "source": "Dark Side of the Boom / Robert Pape", "title": "Iran's 45-day deadline to the US expired Oct 1; Trump says bombing could resume after the midterms", "idea": "Via Robert Pape: on August 16 Iran's Supreme National Security Council decided that if Washington did not lift its naval blockade of Iranian ports within 45 days, Tehran would retain the option of renewed attacks on US forces; Pape says that clock ran out Oct 1. Trump told TIME last week he may escalate attacks on Iran after the November midterms if no acceptable deal.", "angle": "The political calendar (midterms) becomes the escalation calendar. Oil's pricing for 'no escalation until November' looks like a free option to buy.", "tweetA": "Iran's 45-day clock expired Oct 1. Trump says strikes resume after the midterms if no deal. The market is pricing oil at <$90 as if nothing happens before November 3. That is cheap optionality. $USO $XLE", "tweetB": "The US is not taking kinetic action 'for now' on Yemen. Iran's deadline has passed. Saudi is going in alone. Three actors, three calendars, one chokepoint.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/via-zerohedge-black-smoke-reported"}];

function render(expand){
  var cats={};ITEMS.forEach(function(i){cats[i.cat]=(cats[i.cat]||0)+1});
  var h='<span class="pill" style="'+(fc=="all"?'background:#333;color:#fff;border-color:#333':'')+'" onclick="setC(\'all\')">All '+ITEMS.length+'</span>';
  Object.keys(cats).forEach(function(c){h+='<span class="pill" style="'+(fc==c?'background:'+COL[c]+';color:#fff;border-color:'+COL[c]:'')+'" onclick="setC(\''+c+'\')">'+c+' '+cats[c]+'</span>'});
  document.getElementById('cats').innerHTML=h;
  var u='';[['all','All'],['act_now','🔴 Act Now'],['deep','🔵 Deep'],['watch','🟡 Watch']].forEach(function(p){
    var n=p[0]=='all'?ITEMS.length:ITEMS.filter(function(i){return i.urgency==p[0]}).length;
    u+='<span class="pill" style="'+(fu==p[0]?'background:#333;color:#fff;border-color:#333':'')+'" onclick="setU(\''+p[0]+'\')">'+p[1]+' '+n+'</span>'});
  document.getElementById('urg').innerHTML=u;
  var out='';
  ITEMS.forEach(function(item){
    if(fc!="all"&&item.cat!=fc)return;if(fu!="all"&&item.urgency!=fu)return;if(fs&&item.source.indexOf(fs)<0)return;
    var c=COL[item.cat]||"#888";
    out+='<div class="card'+(expand?' open':'')+'"><div class="hd" onclick="tog(this)"><span class="num">'+String(item.id).padStart(2,'0')+'</span><span>'+UE[item.urgency]+'</span><span class="src" style="background:'+c+'">'+esc(item.source)+'</span><span class="tag">'+item.cat+'</span>'+(item.charts.count?'<span>'+(item.charts.hot?'🔥':'📊')+'</span>':'')+'<span class="ttl">'+esc(item.title)+'</span></div><div class="body">'
    +'<div class="lbl">The Idea</div><div>'+esc(item.idea)+'</div>'
    +'<div class="lbl">My Angle</div><div class="angle" style="border-color:'+c+';background:'+c+'14">'+esc(item.angle)+'</div>'
    +'<div class="tw"><div><div class="lbl" style="color:#378add">TWEET A</div>'+esc(item.tweetA)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>'
    +'<div><div class="lbl" style="color:#7f77dd">TWEET B</div>'+esc(item.tweetB)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>'
    +(item.charts.count?'<div class="chart'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING · ':'')+item.charts.count+' chart(s): '+esc(item.charts.desc||'')+'</div>':'<div class="chart">Charts inside — worth opening</div>')
    +'<p><a href="'+item.link+'" target="_blank">↗ Read full article</a></p></div></div>';
  });
  document.getElementById('list').innerHTML=out;
}
function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+META.itemsExtracted+' items';
  var r='<p>Window: '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</p><p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</p><p><b>Included sources</b> (click to filter):<br>';
  META.includedSources.forEach(function(s){var n=s.replace(/ \(\d+ items\)$/,'');r+='<span class="s" onclick="filterBySrc(\''+n.replace(/'/g,"\\'")+'\')">'+esc(s)+'</span><br>'});
  r+='</p><p><b>Skipped</b>:<br>'+META.skippedSources.map(esc).join('<br>')+'</p>';
  document.getElementById('repb').innerHTML=r;render(false);
}
init();
</script></body></html>
