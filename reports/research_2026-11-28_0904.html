  }
 ],
 "skippedSources": [
  {
   "name": "HFI Research (Wilson): (Public) Memo - Thankful",
   "reason": "Holiday thank-you note to subscribers. No data, thesis or market view beyond 'stay unemotional' and an Alan Watts parable."
  }
 ],
 "notes": "Both Dark Side of the Boom posts are paywalled previews; items are based on the bulleted takeaways plus the intro text. The Unchained episode is a paywalled video; items are based on the show notes."
};
var COLORS={"macro":"#e24b4a","credit":"#378add","positioning":"#ef9f27","AI/infra":"#1d9e75","crypto":"#7f77dd","geopolitics":"#d85a30","energy":"#f97316","tech":"#06b6d4","gold":"#d4a017","culture":"#ec4899","labor":"#8b5cf6","regulation":"#64748b","science":"#14b8a6","venture":"#84cc16"};
var UE={"now":"🔴","deep":"🔵","watch":"🟡"};
var state={cat:"all",urg:"all",src:null};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function col(c){return COLORS[c]||"#888";}
function hexA(h,a){var r=parseInt(h.substr(1,2),16),g=parseInt(h.substr(3,2),16),b=parseInt(h.substr(5,2),16);return "rgba("+r+","+g+","+b+","+a+")";}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function toggleCard(id){var el=document.getElementById(id==='report'?'report':'card-'+id);el.classList.toggle('open');}
function collapseAll(){document.querySelectorAll('#cards .card').forEach(function(c){c.classList.remove('open');});}
function setCat(c){state.cat=c;state.src=null;collapseAll();renderBars();applyFilter();}
function setUrg(u){state.urg=u;state.src=null;collapseAll();renderBars();applyFilter();}
function filterBySrc(name){state.src=name;state.cat="all";state.urg="all";renderBars();
  ITEMS.forEach(function(it){var el=document.getElementById('card-'+it.id);var m=it.source.indexOf(name)!==-1||name.indexOf(it.source)!==-1;el.style.display=m?'':'none';if(m)el.classList.add('open');else el.classList.remove('open');});
  updateEmpty();window.scrollTo(0,0);}
function applyFilter(){ITEMS.forEach(function(it){var el=document.getElementById('card-'+it.id);var ok=(state.cat==="all"||it.cat===state.cat)&&(state.urg==="all"||it.urgency===state.urg);el.style.display=ok?'':'none';});updateEmpty();}
function updateEmpty(){var any=ITEMS.some(function(it){return document.getElementById('card-'+it.id).style.display!=='none';});document.getElementById('empty').style.display=any?'none':'block';}
function renderBars(){
  var cats={};ITEMS.forEach(function(i){cats[i.cat]=(cats[i.cat]||0)+1;});
  var h='<span class="pill'+(state.cat==="all"?' active':'')+'" style="'+(state.cat==="all"?'background:#333':'')+'" onclick="setCat(\'all\')">All '+ITEMS.length+'</span>';
  Object.keys(cats).forEach(function(c){var a=state.cat===c;h+='<span class="pill'+(a?' active':'')+'" style="'+(a?'background:'+col(c):'border-color:'+col(c)+';color:'+col(c))+'" onclick="setCat(\''+c+'\')">'+esc(c)+' '+cats[c]+'</span>';});
  document.getElementById('catbar').innerHTML=h;
  var u={now:0,deep:0,watch:0};ITEMS.forEach(function(i){u[i.urgency]=(u[i.urgency]||0)+1;});
  var labels={all:"All",now:"🔴 Act Now",deep:"🔵 Deep",watch:"🟡 Watch"};
  var g='';["all","now","deep","watch"].forEach(function(k){var a=state.urg===k;var n=k==="all"?ITEMS.length:u[k];g+='<span class="pill'+(a?' active':'')+'" style="'+(a?'background:#333':'')+'" onclick="setUrg(\''+k+'\')">'+labels[k]+' '+n+'</span>';});
  document.getElementById('urgbar').innerHTML=g;
}
function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items · '+META.emailsRead+'/'+META.emailsInWindow+' emails read';
  var html='';
  ITEMS.forEach(function(item){
    var c=col(item.cat);var ch=item.charts||{count:0};
    var icon=ch.hot?' 🔥':(ch.count>0?' 📊':'');
    html+='<div class="card'+(ch.hot?' hot':'')+'" id="card-'+item.id+'">';
    html+='<div class="hdr" onclick="toggleCard('+item.id+')"><span class="num">#'+item.id+'</span><span>'+(UE[item.urgency]||'')+'</span><span class="src" style="background:'+c+'">'+esc(item.source)+'</span><span class="tag">'+esc(item.cat)+'</span>'+(icon?'<span>'+icon+'</span>':'')+'<span class="ttl">'+esc(item.title)+'</span></div>';
    html+='<div class="body"><div class="lbl">the idea</div><div class="idea">'+esc(item.idea)+'</div>';
    html+='<div class="lbl">my angle</div><div class="angle" style="border-color:'+c+';background:'+hexA(c,0.07)+'">'+esc(item.angle)+'</div>';
    html+='<div class="tweets"><div class="tw"><div class="h"><span style="color:#378add">TWEET A</span><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>'+esc(item.tweetA)+'</div>';
    html+='<div class="tw"><div class="h"><span style="color:#7f77dd">TWEET B</span><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>'+esc(item.tweetB)+'</div></div>';
    if(ch.count>0||ch.desc){html+='<div class="chart'+(ch.hot?' hotc':'')+'">'+(ch.hot?'🔥 CHART WORTH SAVING · ':'📊 ')+(ch.count||0)+' image(s) · '+esc(ch.desc)+'</div>';}
    if(item.link)html+='<a class="lnk" href="'+esc(item.link)+'" target="_blank" rel="noopener">↗ Read full article</a>';
    html+='</div></div>';
  });
  document.getElementById('cards').innerHTML=html;
  var r='<div class="lbl">time window</div><div>'+esc(META.windowStart)+' → '+esc(META.windowEnd)+'. Emails outside this window were not processed.</div><div style="color:#888;font-size:12px">'+esc(META.timezoneNote||'')+'</div>';
  r+='<div class="lbl">included sources (click to filter)</div><table>';
  META.includedSources.forEach(function(s){r+='<tr><td><span class="srcname" data-src="'+esc(s.name)+'">'+esc(s.name)+'</span></td><td>'+s.items+' items</td></tr>';});
  r+='</table><div class="lbl">skipped</div><table>';
  META.skippedSources.forEach(function(s){r+='<tr><td>'+esc(s.name)+'</td><td>'+esc(s.reason)+'</td></tr>';});
  r+='</table><div class="lbl">totals</div><div>Emails in window: '+META.emailsInWindow+' · Read: '+META.emailsRead+' · Items: '+META.itemsExtracted+'</div>';
  if(META.notes)r+='<div style="margin-top:6px;color:#666">'+esc(META.notes)+'</div>';
  document.getElementById('reportBody').innerHTML=r;
  document.querySelectorAll('.srcname').forEach(function(el){el.addEventListener('click',function(){filterBySrc(el.getAttribute('data-src'));});});
  renderBars();applyFilter();
}
init();
</script></body></html>
