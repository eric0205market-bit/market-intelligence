const META = {
  date: "2026-08-29",
  time: "03:05 CEST",
  windowStart: "2026-08-28 21:05 CEST",
  windowEnd: "2026-08-29 03:05 CEST",
  emailsInWindow: 11,
  emailsRead: 11,
  itemsExtracted: 17,
  includedSources: [
    { name: "The Dark Side of the Boom", count: 3 },
    { name: "The Pressure Point (Fulcrum / whatsthelatest.ai)", count: 1 },
    { name: "Neil Sethi's Newsletter", count: 2 },
    { name: "The News Block / Coin Stories", count: 2 },
    { name: "Commodity Context (Oil Context Weekly)", count: 2 },
    { name: "Daily Chartbook", count: 5 },
    { name: "Paulo Macro", count: 1 },
    { name: "This Week in AI", count: 1 }
  ],
  skippedSources: [
    { name: "PEquityResearch (Portfolio Update, Aug 17-21)", reason: "Paywalled teaser — email body cut off after the standard risk-disclosure boilerplate and \"Happy Friday!...\", zero sentences of actual portfolio content before the paywall." }
  ]
};

const CATCOLORS = {
  macro:"#e24b4a", credit:"#378add", positioning:"#ef9f27", "AI/infra":"#1d9e75",
  crypto:"#7f77dd", geopolitics:"#d85a30", energy:"#f97316", tech:"#06b6d4",
  gold:"#d4a017", culture:"#ec4899", labor:"#8b5cf6", regulation:"#64748b",
  science:"#14b8a6", venture:"#84cc16", commodities:"#b45309"
};
const URGLABEL = { red:"🔴 Act Now", blue:"🔵 Deep", yellow:"🟡 Watch" };

let catFilter = "all";
let urgFilter = "all";
let srcFilter = null;
let expanded = new Set();

function setMeta(){
  document.getElementById("metaline").textContent =
    META.date + " · " + META.time + " · " + META.itemsExtracted + " items from " + META.emailsRead + " emails";
}

function buildFilterBars(){
  const catCounts = {};
  ITEMS.forEach(i => { catCounts[i.cat] = (catCounts[i.cat]||0) + 1; });
  const catbar = document.getElementById("catbar");
  catbar.innerHTML = "";
  const allBtn = document.createElement("button");
  allBtn.className = "pill" + (catFilter==="all" ? " active" : "");
  allBtn.style.background = catFilter==="all" ? "#333" : "";
  allBtn.textContent = "All (" + ITEMS.length + ")";
  allBtn.onclick = () => { catFilter="all"; srcFilter=null; expanded.clear(); render(); };
  catbar.appendChild(allBtn);
  Object.keys(catCounts).sort().forEach(cat => {
    const b = document.createElement("button");
    const active = catFilter===cat;
    b.className = "pill" + (active?" active":"");
    if(active){ b.style.background = CATCOLORS[cat] || "#666"; }
    b.textContent = cat + " (" + catCounts[cat] + ")";
    b.onclick = () => { catFilter=cat; srcFilter=null; expanded.clear(); render(); };
    catbar.appendChild(b);
  });

  const urgCounts = {red:0, blue:0, yellow:0};
  ITEMS.forEach(i => { urgCounts[i.urgency] = (urgCounts[i.urgency]||0) + 1; });
  const urgbar = document.getElementById("urgbar");
  urgbar.innerHTML = "";
  const allU = document.createElement("button");
  allU.className = "pill" + (urgFilter==="all" ? " active" : "");
  if(urgFilter==="all"){ allU.style.background = "#333"; }
  allU.textContent = "All";
  allU.onclick = () => { urgFilter="all"; srcFilter=null; expanded.clear(); render(); };
  urgbar.appendChild(allU);
  ["red","blue","yellow"].forEach(u => {
    const b = document.createElement("button");
    const active = urgFilter===u;
    b.className = "pill" + (active?" active":"");
    if(active){ b.style.background = u==="red" ? "#e24b4a" : (u==="blue" ? "#378add" : "#ef9f27"); }
    b.textContent = URGLABEL[u] + " (" + urgCounts[u] + ")";
    b.onclick = () => { urgFilter=u; srcFilter=null; expanded.clear(); render(); };
    urgbar.appendChild(b);
  });
}

function toggleCard(id){
  if(expanded.has(id)) expanded.delete(id); else expanded.add(id);
  render();
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function filterBySrc(name){
  srcFilter = name;
  catFilter = "all";
  urgFilter = "all";
  ITEMS.forEach(i => { if(i.source.indexOf(name) !== -1) expanded.add(i.id); });
  render();
  const cardsEl = document.getElementById("cards");
  if(cardsEl) cardsEl.scrollIntoView({behavior:"smooth"});
}

function render(){
  buildFilterBars();
  const cardsEl = document.getElementById("cards");
  cardsEl.innerHTML = "";
  ITEMS.forEach((item, idx) => {
    if(catFilter !== "all" && item.cat !== catFilter) return;
    if(urgFilter !== "all" && item.urgency !== urgFilter) return;
    if(srcFilter && item.source.indexOf(srcFilter) === -1) return;

    const card = document.createElement("div");
    card.className = "card";
    const isOpen = expanded.has(item.id);
    const color = CATCOLORS[item.cat] || "#666";
    const urgEmoji = item.urgency === "red" ? "🔴" : (item.urgency === "blue" ? "🔵" : "🟡");
    const chartMark = item.charts.hot ? "🔥" : (item.charts.count > 0 ? "📊" : "");

    const head = document.createElement("div");
    head.className = "card-head";
    head.onclick = () => toggleCard(item.id);
    head.innerHTML =
      '<span class="idx">' + String(idx+1).padStart(2,"0") + '</span>' +
      '<span>' + urgEmoji + '</span>' +
      '<span class="badge" style="background:' + color + '">' + item.source + '</span>' +
      '<span class="cattag">' + item.cat + '</span>' +
      (chartMark ? '<span class="chartmark">' + chartMark + '</span>' : '') +
      '<span class="card-title">' + item.title + '</span>';
    card.appendChild(head);

    const body = document.createElement("div");
    body.className = "card-body" + (isOpen ? " open" : "");
    const chartsClass = "charts-box" + (item.charts.hot ? " hot" : "");
    body.innerHTML =
      '<div class="label">The Idea</div>' +
      '<div class="idea">' + item.idea + '</div>' +
      '<div class="label">My Angle</div>' +
      '<div class="angle" style="border-left-color:' + color + ';background:' + color + '14;">' + item.angle + '</div>' +
      '<div class="tweets">' +
        '<div class="tweet tweet-a"><div class="tweet-label">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div>' +
          '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>' +
        '<div class="tweet tweet-b"><div class="tweet-label">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div>' +
          '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>' +
      '</div>' +
      '<div class="' + chartsClass + '">' + (item.charts.count>0 ? ('📊 ' + item.charts.count + ' chart(s). ') : '') + item.charts.desc + '</div>' +
      '<a class="link" href="' + item.link + '" target="_blank">↗ Read full article</a>';
    card.appendChild(body);
    cardsEl.appendChild(card);
  });
}

function buildReport(){
  const rb = document.getElementById("reportBody");
  let html = '<p><strong>Window:</strong> ' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</p>';
  html += '<p><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp; <strong>Read:</strong> ' + META.emailsRead + ' &nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</p>';
  html += '<div class="label">Included Sources</div><ul class="rc-list">';
  META.includedSources.forEach(s => {
    html += '<li><span class="rc-src" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span> — ' + s.count + ' item(s)</li>';
  });
  html += '</ul>';
  html += '<div class="label">Skipped Sources</div><ul class="rc-list">';
  META.skippedSources.forEach(s => {
    html += '<li><strong>' + s.name + '</strong> — ' + s.reason + '</li>';
  });
  html += '</ul>';
  rb.innerHTML = html;
}

setMeta();
render();
buildReport();
</script>
</body>
</html>
