mpaign", "construction", "land"], "conviction": "high", "so_what": "If graft risk concentrates in land and construction, then the sectors most exposed to the campaign's chilling effect are property, construction and the materials chain that feeds them.", "quote": "the official misconduct alleged by anti-corruption investigators is often related to projects, especially land and construction deals", "locator": "In that respect, his case is not unique", "quote_verified": true}]}, {"theme": "Contract Scrutiny as an Investment Drag", "insights": [{"claim": "Chinese investigators are now focusing far more on irregularities in government project contracts than in the past, and that heightened scrutiny may be one of the factors dragging down infrastructure and other investment.", "speaker": "Christopher Beddor", "type": "causal", "entities": ["China", "infrastructure", "anti-corruption campaign", "construction"], "conviction": "medium", "so_what": "Offers a non-fiscal explanation for weak Chinese infrastructure spending — stimulus or funding announcements may not revive project starts while local officials fear that signing contracts invites an investigation.", "quote": "a heightened level of scrutiny that may be one of the factors dragging down infrastructure and other investment", "locator": "The stepped-up anti-corruption campaign suggests that investigators", "quote_verified": true}]}], "insight_total": 5, "top_entities": ["China", "Ma Xingrui", "Politburo", "anti-corruption campaign", "infrastructure", "construction", "real-estate", "Xinjiang", "Guangdong", "Christopher Beddor", "Gavekal Dragonomics"], "source_meta": {"author": "", "word_count": 175, "paywalled": false}}, {"record_id": "5bb9314f41de3af1", "source_type": "concepts", "source_name": "Noema Magazine", "source_url": "https://www.noemamag.com/why-is-everyone-in-tech-so-sad", "title": "Why Is Everyone In Tech So Sad? | NOEMA", "published_date": "2026-08-06", "language": "en", "processed_at": "2026-08-08T10:47:22Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI", "Society"], "gist": "An AI operations director argues that AI agents are not primarily an unemployment shock to knowledge work but a belief shock: by executing the work humans used to do, agents strip away the last justification for 'Workism' — the substitution of career for religion — and risk making an entire white-collar class stop believing in its own jobs. The load-bearing, non-obvious claim is that current layoffs are NOT actually driven by realized AI efficiency, and that the real corporate risk is a talent pool that declines to come back once companies try to rehire.", "themes": [{"theme": "Angst Has Shifted From Economic To Existential", "insights": [{"claim": "The current wave of white-collar disillusionment is qualitatively different from prior disruptions (recessions, outsourcing, earlier automation) because the questions workers are asking are existential rather than economic, which means conventional cyclical playbooks for labor-market recovery may not apply.", "speaker": "Aaron Horwath", "type": "thesis", "entities": ["knowledge work", "AI", "labor market", "outsourcing"], "conviction": "high", "so_what": "If the driver is meaning rather than pay, wage increases and re-hiring campaigns will underperform as retention tools — watch for firms whose comp-led retention strategies fail to stem attrition.", "quote": "What’s different about this moment is that the questions are not just economic but existential", "locator": "We are, it’s true, living through a time of disruption", "quote_verified": true}, {"claim": "The cohort most insulated from economic upheaval — highly paid executives and senior professionals with decades of institutional knowledge, who should be best positioned to ride out AI's near-term impacts — are themselves uncertain about their career futures, indicating the doubt is not confined to junior or automatable roles.", "speaker": "Aaron Horwath", "type": "contrarian", "entities": ["executives", "senior professionals", "AI", "knowledge work"], "conviction": "high", "so_what": "Senior-leader disengagement is a leading indicator of execution risk at AI-transforming enterprises; watch unexplained executive departures, not just headcount cuts.", "quote": "It strikes me as significant that the people who are usually the most insulated from economic upheaval, and seem to be well-positioned to ride out AI’s near-term impacts", "locator": "It strikes me as significant that the people", "quote_verified": true}, {"claim": "Disillusionment about knowledge work spreads socially rather than individually — one person voicing it triggers agreement from peers — so the sentiment behaves like a contagion with sharp, nonlinear inflection rather than a gradual drift.", "speaker": "Aaron Horwath", "type": "causal", "entities": ["knowledge workers", "workplace culture"], "conviction": "medium", "so_what": "Morale collapse in knowledge-work organizations should be modeled as a step function, not a slow slide — engagement survey deterioration can go from benign to severe within a single cycle.", "quote": "This disillusionment is infectious. One person speaks of it and others begin nodding: They too have felt it, the drop in motivation, the sense of being distant from their work, the lack of sleep, the concerns about the future.", "locator": "This disillusionment is infectious", "quote_verified": true}, {"claim": "Observable early symptoms of the shift are consumption-side, not employment-side: knowledge workers taking up pottery, painting, crochet and other analog hobbies, and openly fantasizing about 'disappearing,' living on a farm, or going off the grid.", "speaker": "Aaron Horwath", "type": "anecdote", "entities": ["knowledge workers", "analog hobbies", "crafts"], "conviction": "medium", "so_what": "The first tradeable expression of white-collar disenchantment may show up in craft/hobby and rural-lifestyle spend rather than in labor data — a demand tell that leads the employment tell.", "quote": "Among my Knowledge Worker peers, I am hearing this more and more often: people who want to pick up pottery, painting, crochet or other old-timey analog hobbies.", "locator": "Among my Knowledge Worker peers", "quote_verified": true}]}, {"theme": "Workism As A Faith-Based Asset", "insights": [{"claim": "'Workism' — Derek Thompson's 2019 Atlantic framing of high-earning Americans seeking from careers the meaning, community and fulfillment that prior generations got from religion — is the mechanism that keeps talented people showing up to work that has little altruistic upside.", "speaker": "Aaron Horwath", "type": "framework", "entities": ["Derek Thompson", "The Atlantic", "Workism", "knowledge workers"], "conviction": "high", "so_what": "Treat white-collar productivity as partly faith-financed: a firm whose value proposition to staff is meaning rather than cash carries an unpriced liability if that meaning is disproven.", "quote": "The best-educated and highest-earning Americans, who can have whatever they want, have chosen the office for the same reason that devout Christians attend church on Sundays", "locator": "Workism: Praise Thee", "quote_verified": true}, {"claim": "Workism is explicitly framed as a psychological substitute product — manufactured to fill the hole a genuine vocation would otherwise occupy — which makes it a compensating good that fails precisely when the underlying work is exposed as unnecessary.", "speaker": "Aaron Horwath", "type": "framework", "entities": ["Workism", "vocations", "knowledge work"], "conviction": "high", "so_what": "Substitute goods lose demand instantly when the substitution is noticed; corporate 'mission' and 'purpose' programs are the most fragile part of the employee value proposition under AI.", "quote": "That’s the true beauty of Workism: It is manufactured to distract people from the hole in their souls that a vocation would otherwise fill. It is the opiate of commuters in quarter zips.", "locator": "That’s the true beauty of Workism", "quote_verified": true}, {"claim": "Because Workism depends on faith rather than logic, it has a specific structural failure mode: any paradigm shift that lets workers rationally interrogate the value of their output can break it all at once, unlike a gradual erosion of morale.", "speaker": "Aaron Horwath", "type": "causal", "entities": ["Workism", "AI", "knowledge workers"], "conviction": "high", "so_what": "Look for a discrete break, not a gradient — the risk to human-capital-intensive firms is a regime change in belief, timed to visible AI capability jumps.", "quote": "But Workism has a weakness. Like religion, it relies on faith’s triumph over logic.", "locator": "But Workism has a weakness", "quote_verified": true}, {"claim": "Graduates are overwhelmingly channeled into finance, consulting and technology rather than vocations (teaching, nursing, firefighting, trades) that carry intrinsic social payoff, so the most credentialed labor cohort is concentrated in exactly the jobs most exposed to a meaning shock.", "speaker": "Aaron Horwath", "type": "thesis", "entities": ["finance", "consulting", "technology", "graduates", "vocations"], "conviction": "high", "so_what": "Elite-graduate pipelines into finance/consulting/tech are the highest-beta exposure to a Workism unwind — watch recruiting yields and acceptance rates at those employers.", "quote": "Instead, graduates are overwhelmingly taking jobs in finance, consulting or technology.", "locator": "But those aren’t the careers young people", "quote_verified": true}, {"claim": "David Graeber's 'Bullshit Jobs' taxonomy is invoked as an already-existing inventory of the specific white-collar behaviors AI makes indefensible: decks for projects that never launch, features nobody asked for, resting-and-vesting, and promotion-driven development where engineers optimize for what looks good at review time.", "speaker": "Aaron Horwath", "type": "framework", "entities": ["David Graeber", "Bullshit Jobs", "software engineering", "knowledge work"], "conviction": "high", "so_what": "The categories Graeber named are the exact cost lines executives will target first with agents — and the exact roles whose occupants already privately doubt their value.", "quote": "promotion-driven development, where developers ignore what’s good in favor of what appears to be good when they’re up for a promotion", "locator": "In “Bullshit Jobs,” David Graeber cataloged", "quote_verified": true}]}, {"theme": "Agentic Abstraction As The Trigger", "insights": [{"claim": "Knowledge work's last remaining justification was that humans executed it — human thought, collaboration and creativity gave existentially meaningless output its life — and AI agents removing execution removes that final defense.", "speaker": "Aaron Horwath", "type": "causal", "entities": ["AI agents", "knowledge work", "automation"], "conviction": "high", "so_what": "The morale hit from agents is not proportional to jobs lost; it lands even where headcount is unchanged, so 'no layoffs' is not a hedge against the sentiment risk.", "quote": "Knowledge work’s one saving grace, until recently, was that it was still executed by humans. We were needed.", "locator": "Popping The Workism Bubble", "quote_verified": true}, {"claim": "The consensus vision among AI implementers — including the author, who runs AI operations at a creative technology company — is a future where all humans are managers of armies of AI agents, and he flags this as a view worth interrogating rather than accepting.", "speaker": "Aaron Horwath", "type": "thesis", "entities": ["AI agents", "AI operations", "management"], "conviction": "high", "so_what": "A practitioner inside AI rollout publicly doubting the 'everyone becomes an agent manager' consensus is an early crack in the deployment narrative sold to boards.", "quote": "It is common for people responsible for integrating these tools into their organizations, myself included, to describe the future of work as one in which all humans will essentially be managers of armies of AI agents.", "locator": "Now, AI agents are increasingly executing", "quote_verified": true}, {"claim": "Agent usage in practice is escalating well past grunt work — employees under pressure to produce more are using agents to formulate complete business strategies, generate full marketing campaigns, build entire websites and draft strategy for whole divisions.", "speaker": "Aaron Horwath", "type": "data_point", "entities": ["AI agents", "marketing", "corporate strategy", "web development"], "conviction": "high", "so_what": "Agent scope creep into strategy and campaign work means services vendors in those categories face demand substitution sooner than the 'AI does the boring parts' narrative implies.", "quote": "From a single email to an entire corporate strategy, the outputs of individuals, teams and organizations are increasingly generated in an instant by AI.", "locator": "But in many cases, employees under pressure", "quote_verified": true}, {"claim": "Guy Debord's 'Society of the Spectacle' is repurposed as the operating model for modern work: Workism is a microcosm of the spectacle, a system in which appearing busy, important and knowledgeable is as valuable as being those things, and where work need only appear impactful.", "speaker": "Aaron Horwath", "type": "framework", "entities": ["Guy Debord", "Society of the Spectacle", "Workism"], "conviction": "high", "so_what": "A useful lens for reading corporate AI announcements: much of the observable activity is signaling, and signaling budgets can be cut without the underlying business changing.", "quote": "Workism is a microcosm of the larger spectacle: a world where appearing busy, important and uniquely knowledgeable is as valuable as actually being any of those things.", "locator": "Debord’s Spectacle: I Don’t Wanna Do This Anymore", "quote_verified": true}, {"claim": "The core mechanism is that ~30 years of mediation (texting instead of talking, watching travel instead of traveling) has been incremental, and AI is the step that pushes abstraction far enough that the illusion becomes entirely visible to the people inside it.", "speaker": "Aaron Horwath", "type": "causal", "entities": ["AI", "Guy Debord", "knowledge work", "digital mediation"], "conviction": "medium", "so_what": "Frames AI as a disclosure event rather than a productivity event — the risk is that it reveals how much existing output was never load-bearing.", "quote": "with the introduction of AI, it is as if, over the past 30 years, we have been slowly taking steps away from the direct experience of life and work, and AI risks pushing us far enough that the illusion becomes entirely visible", "locator": "And this is where things get particularly interesting", "quote_verified": true}, {"claim": "There is a direct conflict between what makes executives most excited about AI — less collaboration and fewer people — and the survival of the social structures that hold their organizations together, so the feature executives are buying is the same one that degrades the asset.", "speaker": "Aaron Horwath", "type": "contrarian", "entities": ["executives", "AI", "shareholders", "organizational structure"], "conviction": "high", "so_what": "AI-driven margin expansion may be self-limiting: the cost savings and the organizational decay come from the same lever, so early efficiency wins can precede later capability loss.", "quote": "But what makes many executives most excited about AI — less collaboration, fewer people — risks dismantling the structures that hold the very organizations they lead together.", "locator": "Organizations find themselves in a pickle", "quote_verified": true}, {"claim": "Firms will integrate AI regardless of the cultural cost because shareholders want it and near-term efficiency gains are too large to forgo, which makes the resulting organizational damage a near-certainty rather than a choice variable.", "speaker": "Aaron Horwath", "type": "prediction", "entities": ["shareholders", "AI adoption", "executives"], "conviction": "high", "so_what": "Don't underwrite management restraint — assume full AI deployment across white-collar firms and price the second-order human-capital consequences instead.", "quote": "They want to integrate AI into their operations, as do their shareholders. And they will. In the short term, the potential efficiency gains are too good to pass up.", "locator": "Organizations find themselves in a pickle", "quote_verified": true}]}, {"theme": "The Messy Middle As Hidden Productive Capital", "insights": [{"claim": "Retention in knowledge work is driven by colleagues, bosses and the quality of the 'messy middle' experience — not by throughput — so gains in output speed do not convert into gains in talent retention.", "speaker": "Aaron Horwath", "type": "thesis", "entities": ["knowledge workers", "employee retention", "AI"], "conviction": "high", "so_what": "Productivity-per-employee improvements from AI should not be assumed to reduce attrition costs; model retention and efficiency as independent, possibly opposing, lines.", "quote": "Employees overwhelmingly choose to remain or leave their roles because of their colleagues and/or bosses, and the quality of the experience of the messy middle a workplace offers.", "locator": "What’s At Stake: The Value Of The Messy Middle", "quote_verified": true}, {"claim": "Teresa Amabile's decades of Harvard Business School research on creativity (the Intrinsic Motivation Principle) holds that people do their most creative and innovative work when motivated by the work itself, and that political, risk-averse, relentlessly outcome-focused environments kill creativity — making 'messy' collaboration a precondition for valuable output rather than waste.", "speaker": "Aaron Horwath", "type": "data_point", "entities": ["Teresa Amabile", "Harvard Business School", "Intrinsic Motivation Principle", "creativity"], "conviction": "high", "so_what": "Gives an empirical basis for shorting the 'efficiency-maximized org' thesis: firms that strip exploration may see innovation output fall even as unit costs drop.", "quote": "The environments that kill creativity are political, risk-averse and relentlessly outcome-focused. The environments that stimulate it are collaborative, idea-driven and free.", "locator": "Research suggests this group needs that environment", "quote_verified": true}, {"claim": "The knowledge-work labor pool splits into two behaviorally distinct segments — 'outcome-first' workers who treat human needs and emotions as obstacles, and 'experience-first' workers who value collaboration, debate and shared struggle and often maintain artistic practices outside work.", "speaker": "Aaron Horwath", "type": "framework", "entities": ["knowledge workers", "outcome-first workers", "experience-first workers"], "conviction": "medium", "so_what": "A segmentation for reading workforce risk: firms staffed with experience-first creative talent face far higher AI-transition attrition than outcome-first, metrics-driven organizations.", "quote": "In my experience, there are two broad categories of Knowledge Workers. The first are outcome-first workers. Their focus is on the business, on winning, on efficiency.", "locator": "But not everyone feels that way", "quote_verified": true}, {"claim": "Removing the messy middle has an explicitly asymmetric effect across the two worker segments — a victory for outcome-first workers, a foundational loss for experience-first workers — so identical AI policies produce opposite retention outcomes depending on workforce composition.", "speaker": "Aaron Horwath", "type": "framework", "entities": ["outcome-first workers", "experience-first workers", "AI", "organizational change"], "conviction": "high", "so_what": "Diligence question for any AI-transformation story: which segment does this company's competitive advantage actually rest on?", "quote": "For outcome-first people, it is a victory. For experience-first people, it undermines the foundation of work.", "locator": "It’s important to note that the impact", "quote_verified": true}, {"claim": "The sports-officiating analogy (Hawk-Eye in tennis, the NBA challenge system, MLB's automated ball-strike system) is used to argue that technically correct outcomes can be subjectively worse for the product, because human error was part of what made the thing worth watching.", "speaker": "Aaron Horwath", "type": "framework", "entities": ["Chuck Klosterman", "Hawk-Eye", "NBA", "MLB", "tennis", "Bill Simmons"], "conviction": "medium", "so_what": "A transferable heuristic: in experience-goods businesses, accuracy-maximizing automation can destroy the value it was bought to protect — relevant to media, entertainment and creative services.", "quote": "Getting calls right 100% of the time may be objectively better, but it is subjectively less interesting and entertaining.", "locator": "Klosterman argues that bad calls", "quote_verified": true}, {"claim": "The executive vision for AI-armed workforces converts work from an exploratory, learning-based process into assembly-line production — a transformation Debord anticipated in 1967 when he described intellectual professions being subjected to factory-like working conditions.", "speaker": "Aaron Horwath", "type": "causal", "entities": ["Guy Debord", "executives", "LLMs", "AI agents", "knowledge work"], "conviction": "medium", "so_what": "If white-collar work industrializes, expect white-collar labor dynamics (turnover, deskilling, collective friction) to start resembling manufacturing rather than professional services.", "quote": "In their vision for the future, work goes from a messy experience of learning and exploring to something more akin to assembly-line production.", "locator": "Ironically, it’s a growing dream of executives", "quote_verified": true}, {"claim": "Inefficiency in knowledge work is defended as functional rather than merely tolerable — the messy middle is characterized as the condition under which genuinely valuable work gets produced, inverting the standard efficiency case for AI adoption.", "speaker": "Aaron Horwath", "type": "contrarian", "entities": ["knowledge work", "AI", "productivity"], "conviction": "high", "so_what": "The strongest available counter-thesis to AI productivity narratives: efficiency gains may be measured on the wrong output variable entirely.", "quote": "The messy middle, in other words, isn’t inefficient. It’s the condition under which genuinely valuable work gets produced.", "locator": "Research suggests this group needs that environment", "quote_verified": true}]}, {"theme": "Layoffs Are Being Mislabeled As AI", "insights": [{"claim": "An AI operations practitioner asserts flatly that the current corporate layoff wave is not actually caused by AI — AI automation is not yet creating anywhere near the efficiency gains needed to justify hundreds of thousands of job losses — meaning executives are attributing cuts to AI that have other causes.", "speaker": "Aaron Horwath", "type": "contrarian", "entities": ["AI", "layoffs", "executives", "big tech"], "conviction": "high", "so_what": "Discount 'AI-driven efficiency' as an explanation in layoff disclosures; the cuts likely reflect demand or cost-cycle pressure, which means the promised margin durability may not be there.", "quote": "Executives are often claiming these headcount reductions are a result of AI. They aren’t. At the moment, AI automation is not creating anywhere near the increased efficiency necessary to justify hundreds of thousands of lost jobs.", "locator": "As I’m writing this essay, big companies are on a layoff bender", "quote_verified": true}, {"claim": "Layoffs are being announced at scale across big companies concurrently with the AI narrative, creating a credibility gap between stated AI efficiency and demonstrated AI efficiency that will eventually be tested against results.", "speaker": "Aaron Horwath", "type": "prediction", "entities": ["big tech", "layoffs", "AI"], "conviction": "medium", "so_what": "Watch for the reconciliation: firms that cut on an AI story but cannot show the output gains will face either rehiring costs or visible capability degradation.", "quote": "As I’m writing this essay, big companies are on a layoff bender. Thousands of people are being fired all over the place.", "locator": "As I’m writing this essay", "quote_verified": true}]}, {"theme": "The Talent-Doesn't-Return Risk", "insights": [{"claim": "The central novel risk identified is that the historical hire/fire cycle assumed a fresh cohort waiting to be brought back, and this cycle may break — companies could go to replenish headcount and find that talent freed from Workism has moved on to different versions of their lives.", "speaker": "Aaron Horwath", "type": "prediction", "entities": ["labor market", "knowledge workers", "layoffs", "hiring"], "conviction": "medium", "so_what": "The asymmetric risk in AI-era cost cutting is rehiring failure — model a scenario where the option to re-staff has a much higher strike price than history implies.", "quote": "But what if talent stops coming back?", "locator": "We’ve been through waves of hiring and firing", "quote_verified": true}, {"claim": "The switching costs that historically anchored knowledge workers to corporate careers have collapsed: the talent pool increasingly doesn't own homes and doesn't plan on having children, making a pivot away from corporate life easier than at any prior point.", "speaker": "Aaron Horwath", "type": "causal", "entities": ["knowledge workers", "homeownership", "demographics", "labor mobility"], "conviction": "medium", "so_what": "Low household formation and non-ownership are usually read as macro weakness; here they are the mechanism that makes white-collar labor supply unusually flight-prone.", "quote": "The talent pool increasingly doesn’t own homes and doesn’t plan on having kids, so it has perhaps never been easier to make a career pivot toward something that is genuinely satisfying in ways corporate life isn’t.", "locator": "What if their side projects suddenly became profitable?", "quote_verified": true}, {"claim": "The workers most likely to exit are adversely selected from the employer's perspective — the most disillusioned, the most artistically talented or motivated, the most existentially sensitive, and the financially able — leaving behind those who stay by necessity rather than choice.", "speaker": "Aaron Horwath", "type": "thesis", "entities": ["knowledge workers", "talent retention", "creative professionals"], "conviction": "high", "so_what": "Attrition under this regime is quality-weighted, not random: expect measured headcount to hold while creative capability quietly degrades.", "quote": "Some will certainly leave Knowledge Work — the most disillusioned, the most artistically talented or motivated, the most existentially sensitive to a sudden moment of enlightenment, the financially able.", "locator": "Post-Workism: Escaping The Inescapable", "quote_verified": true}, {"claim": "The majority of knowledge workers will remain in place while the humanity of work erodes around them, producing a large population of retained-but-existentially-distraught employees rather than a clean labor exodus.", "speaker": "Aaron Horwath", "type": "prediction", "entities": ["knowledge workers", "employee engagement", "AI"], "conviction": "medium", "so_what": "The dominant scenario isn't mass quitting — it's mass disengagement inside firms, which shows up as declining output quality long before it shows up in turnover metrics.", "quote": "But many more will remain, either by choice or necessity, to face a work experience where the humanity of work is eroding away.", "locator": "Post-Workism: Escaping The Inescapable", "quote_verified": true}, {"claim": "A specific escape channel is flagged as newly viable — side projects becoming profitable — which converts what was previously a hobby into a competing income stream against corporate employment.", "speaker": "Aaron Horwath", "type": "thesis", "entities": ["side projects", "creator economy", "knowledge workers"], "conviction": "low", "so_what": "Platforms that monetize individual creative output are structurally positioned as the competing employer for exactly the talent enterprises most need to keep.", "quote": "What if their side projects suddenly became profitable?", "locator": "What if, when companies go to replenish headcounts", "quote_verified": true}]}, {"theme": "Dissatisfaction Gets Reabsorbed As A Commodity", "insights": [{"claim": "Escape from corporate work is argued to be self-defeating in a specific, mechanical way: leaving to start a YouTube channel or Substack about abandoning your tech career turns the person and their life into a commodity that feeds the same system they left.", "speaker": "Aaron Horwath", "type": "framework", "entities": ["YouTube", "Substack", "creator economy", "Guy Debord"], "conviction": "high", "so_what": "Predicts a durable supply of ex-tech creator content — content platforms benefit from the same white-collar disillusionment that damages the employers.", "quote": "That’s the logic of the spectacle: It reabsorbs even the dissatisfied in order to sustain itself.", "locator": "Post-Workism: Escaping The Inescapable", "quote_verified": true}, {"claim": "Founding a company is presented as an equally captured exit path, because a founder immediately needs to create a spectacle attractive to potential employees — meaning entrepreneurship reproduces rather than resolves the Workism problem.", "speaker": "Aaron Horwath", "type": "contrarian", "entities": ["startups", "founders", "Workism", "recruiting"], "conviction": "medium", "so_what": "Cuts against the assumption that disillusioned corporate talent flows productively into startup formation — the same meaning deficit follows them into the new company.", "quote": "Or it might mean starting a company of your own, thereby suddenly needing to create a spectacle attractive to potential employees.", "locator": "In today’s world, that might mean starting a YouTube channel", "quote_verified": true}, {"claim": "Debord's own biography is offered as the pessimistic base case for anyone betting on escape: he believed exit from the spectacle was impossible, dissolved his own movement rather than see it institutionalized, and drank himself to death in the countryside.", "speaker": "Aaron Horwath", "type": "anecdote", "entities": ["Guy Debord", "Society of the Spectacle"], "conviction": "high", "so_what": "A caution against romanticizing the 'off-grid' narrative as a real alternative economy — the author's own framework says it does not hold.", "quote": "Debord believed escape from the spectacle was impossible. He went on to dissolve his own movement rather than watch it become institutionalized, and then drank himself to death in the countryside.", "locator": "What would Debord say?", "quote_verified": true}, {"claim": "Debord's warning that dissatisfaction becomes a commodity once the economy of abundance can process it is applied directly to the present: anti-work sentiment is itself a monetizable product category rather than a threat to the system.", "speaker": "Aaron Horwath", "type": "framework", "entities": ["Guy Debord", "anti-work sentiment", "media"], "conviction": "high", "so_what": "Treat the volume of anti-work and burnout content as a monetization signal, not a leading indicator of structural labor change.", "quote": "dissatisfaction itself becomes a commodity as soon as the economy of abundance develops the capacity to process that particular raw material", "locator": "Post-Workism: Escaping The Inescapable", "quote_verified": true}]}, {"theme": "Deliberate Under-Automation As A Counter-Strategy", "insights": [{"claim": "The prescribed corporate countermeasure is deliberate under-automation: calling a colleague instead of querying an agent, doing work the old-fashioned meandering way accepting it will be slower, and ruling that certain work is reserved for human hands entirely.", "speaker": "Aaron Horwath", "type": "framework", "entities": ["AI agents", "workplace practice", "automation policy"], "conviction": "medium", "so_what": "A concrete differentiator to watch for: firms that formally designate human-only work categories may retain creative talent competitors lose.", "quote": "Or simply deciding that certain work is best left to human hands entirely.", "locator": "Debord also believed the spectacle could be undermined", "quote_verified": true}, {"claim": "The most powerful recommended intervention is deflationary rather than motivational — reminding colleagues that the work is illusory and not important, on the argument that no one has ever died over a spreadsheet and almost no one will remember the work.", "speaker": "Aaron Horwath", "type": "contrarian", "entities": ["Workism", "management practice", "knowledge workers"], "conviction": "high", "so_what": "Directly contradicts the standard corporate purpose-and-mission retention playbook; if this view spreads, employer branding built on world-changing claims loses potency.", "quote": "No one has ever died over a spreadsheet. The world does not wait with bated breath for product launches. A marketing campaign will not change the world.", "locator": "But perhaps the most powerful action of all", "quote_verified": true}, {"claim": "The author's constructive endpoint is a redirection of the meaning-seeking impulse from careers toward genuine local altruism and community impact, implying the demand for meaning does not disappear — it relocates outside the employer.", "speaker": "Aaron Horwath", "type": "thesis", "entities": ["altruism", "communities", "Workism", "knowledge workers"], "conviction": "medium", "so_what": "Meaning-seeking is a relocating demand, not a vanishing one — expect share of wallet and time to shift toward community, craft and volunteering at the expense of discretionary work hours.", "quote": "perhaps we will be inspired to fill that hole with something real — true altruism, not its artificial Workism substitute — by actually trying to impact real people, in our communities, in real ways", "locator": "And once freed from the false satisfaction", "quote_verified": true}, {"claim": "The framing question the essay leaves open is what happens to a society and its industries if an entire class of workers loses faith in their careers overnight — an explicitly untested, discontinuous scenario rather than a gradual trend forecast.", "speaker": "Aaron Horwath", "type": "thesis", "entities": ["knowledge workers", "AI", "labor market", "society"], "conviction": "exploratory", "so_what": "Treat this as an unpriced tail scenario for human-capital-intensive sectors: no historical analog means no reliable base rate for recovery.", "quote": "And what happens to a society and its industries if an entire class of workers loses faith in their careers overnight?", "locator": "But this sweeping disenchantment begs a fascinating", "quote_verified": true}]}], "insight_total": 38, "top_entities": ["Workism", "knowledge workers", "AI agents", "Guy Debord", "David Graeber", "Derek Thompson", "Teresa Amabile", "Harvard Business School", "executives", "layoffs", "LLMs", "The Atlantic"], "source_meta": {"author": "AARON HORWATH", "word_count": 3929, "paywalled": false}}, {"record_id": "6724a60e9a7b8783", "source_type": "concepts", "source_name": "St. Louis Fed — FRED Blog", "source_url": "https://fredblog.stlouisfed.org/2026/08/what-securities-do-fdic-insured-banks-hold/", "title": "What securities do FDIC-insured banks hold?", "published_date": "2026-08-07", "language": "en", "processed_at": "2026-08-08T10:44:11Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Positioning"], "gist": "Using FDIC quarterly banking profile data on FRED, mortgage-backed securities still dominate FDIC-insured banks' securities portfolios at 60.7% as of Q1 2026, with Treasuries at 33.5%, munis at 5.8% and equities at 0.0%. Since 2008 the mix has rotated out of MBS and into Treasuries and munis, and since 2010 the held-to-maturity share of investment securities has climbed to 39.8% — changes Kansas City Fed researchers attribute to regulation, risk preferences, and a desire to shield mandatory capital levels from market-value swings.", "themes": [{"theme": "Securities mix of FDIC-insured banks", "insights": [{"claim": "As of Q1 2026, mortgage-backed securities account for 60.7% of the securities held by FDIC-insured institutions, followed by U.S. Treasury securities at 33.5%, state and municipal securities at 5.8%, and equity securities at 0.0%.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["FDIC-insured institutions", "mortgage-backed securities", "U.S. Treasury securities", "state and municipal securities", "equity securities"], "conviction": "high", "so_what": "Sets the baseline exposure map for US bank balance sheets: agency MBS spread and duration risk, not corporate credit or equity, is the dominant securities risk in the banking system.", "quote": "Mortgage-backed securities (blue area): bonds backed by pools of home mortgages (60.7%)", "locator": "The asset classes are as follows, in descending order", "quote_verified": true}, {"claim": "Mortgage-backed securities have consistently been the largest single securities holding of FDIC-insured institutions across the entire 1984-Q1 to 2026-Q1 record shown on FRED.", "speaker": "St. Louis Fed — FRED Blog", "type": "thesis", "entities": ["FDIC-insured institutions", "mortgage-backed securities", "FRED"], "conviction": "high", "so_what": "Four decades of persistence means bank demand for agency MBS is structural, not cyclical — a standing bid that policy shocks to the mortgage market transmit straight into bank capital.", "quote": "We can see that mortgage-backed securities consistently represent the lion’s share of assets.", "locator": "We can see that mortgage-backed securities", "quote_verified": true}, {"claim": "Equity securities are effectively absent from FDIC-insured banks' portfolios, rounding to 0.0% of holdings.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["FDIC-insured institutions", "equity securities"], "conviction": "high", "so_what": "Equity drawdowns hit US banks through lending, fees and collateral channels rather than direct portfolio marks — the securities book is a rates story, not an equity story.", "quote": "Equity securities (purple area): shares of ownership in a corporation (0.0%)", "locator": "Equity securities (purple area)", "quote_verified": true}]}, {"theme": "Post-2008 rotation out of MBS", "insights": [{"claim": "Between 2008 and 2026, the MBS share of FDIC-insured banks' securities holdings declined while the shares of US Treasury and state and municipal securities rose.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["FDIC-insured institutions", "mortgage-backed securities", "U.S. Treasury securities", "state and municipal securities"], "conviction": "high", "so_what": "A nearly two-decade rotation makes banks a steadier marginal buyer of Treasuries and munis and a relatively shrinking one for agency MBS — relevant to who absorbs supply in each market.", "quote": "between 2008 and the time of this writing, the share of those securities has decreased while the share of US Treasury and state and municipal securities has increased", "locator": "However, between 2008 and the time of this writing", "quote_verified": true}, {"claim": "Kansas City Fed researchers attribute the post-2008 shift in bank securities composition to changes in the regulatory environment and to evolving preferences for risk.", "speaker": "St. Louis Fed — FRED Blog", "type": "causal", "entities": ["Kansas City Fed", "FDIC-insured institutions", "mortgage-backed securities", "U.S. Treasury securities"], "conviction": "medium", "so_what": "If regulation is a driver, deregulation or changes to liquidity/capital treatment could partially reverse the rotation and revive bank demand for MBS.", "quote": "Researchers at the Kansas City Fed point to changes in the regulatory environment and evolving preferences for risk to explain this changing mix.", "locator": "Researchers at the Kansas City Fed point to", "quote_verified": true}]}, {"theme": "HTM vs AFS accounting shift", "insights": [{"claim": "Bank securities split into trading securities, held for short-term gains and typically a small share of total assets, and investment securities, which are the larger share and are reported on the balance sheet as either held to maturity (HTM) or available for sale (AFS).", "speaker": "St. Louis Fed — FRED Blog", "type": "framework", "entities": ["trading securities", "investment securities", "held to maturity (HTM)", "available for sale (AFS)"], "conviction": "high", "so_what": "The HTM/AFS label determines whether market-value losses flow through capital, so the classification split is the key lens for reading unrealized-loss risk on any bank's book.", "quote": null, "locator": "These assets can also be classified as either trading", "quote_verified": false}, {"claim": "Available-for-sale securities have made up the majority of FDIC-insured banks' investment securities since 1996, but the held-to-maturity share has been rising since 2010 and now stands at 39.8% of all investment assets.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["FDIC-insured institutions", "available for sale (AFS)", "held to maturity (HTM)"], "conviction": "high", "so_what": "Nearly 40% of the investment book sits in HTM, where losses are not marked through capital — a growing gap between reported capital and mark-to-market value that matters in any forced-sale or deposit-run scenario.", "quote": "since 2010, the proportion of investment securities that banks intend to hold until expiration, or maturity, has increased. At the time of this writing, they amount to 39.8% of all investment assets.", "locator": "Since 1996, most of the investment securities", "quote_verified": true}, {"claim": "Kansas City Fed researchers ascribe the rising held-to-maturity share to a bank strategy of better protecting the value of mandatory capital levels against financial risk.", "speaker": "St. Louis Fed — FRED Blog", "type": "causal", "entities": ["Kansas City Fed", "held to maturity (HTM)", "FDIC-insured institutions", "mandatory capital levels"], "conviction": "medium", "so_what": "HTM growth is a deliberate capital-shielding tactic rather than a view on rates — it means reported regulatory capital increasingly understates duration losses embedded in bank securities books.", "quote": "The Kansas City Fed researchers mentioned above ascribe this changing pattern to a strategy to better protect the value of mandatory capital levels against financial risk.", "locator": "The Kansas City Fed researchers mentioned above", "quote_verified": true}]}], "insight_total": 8, "top_entities": ["FDIC-insured institutions", "mortgage-backed securities", "U.S. Treasury securities", "state and municipal securities", "equity securities", "held to maturity (HTM)", "available for sale (AFS)", "Kansas City Fed", "FRED"], "source_meta": {"author": "", "word_count": 566, "paywalled": false}}, {"record_id": "88eaf7da009b5839", "source_type": "concepts", "source_name": "World Economic Forum", "source_url": "https://www.weforum.org/podcasts/radio-davos/episodes/polytunity-geopolitics-cna-corresponent-yuen-yuen-ang/", "title": "From 'polycrisis' to 'polytunity' - the future of geopolitics with Prof Yuen Yuen Ang", "published_date": "2026-08-06", "language": "en", "processed_at": "2026-08-08T10:45:14Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Geopolitics", "Tech", "AI", "Society"], "gist": "Johns Hopkins political economist Yuen Yuen Ang, interviewed at the WEF Annual Meeting of the New Champions in Dalian, argues the 'polycrisis' is really a crisis of Western decline and a 'polytunity' for the global majority, and that China's central problem is an economic paradox: dazzling 0-to-1 tech (AI, quantum, EVs, aeronautics) that creates almost no mass employment, sitting on top of a dead old growth model, which is why domestic consumption stays weak and Chinese output must be exported as a 'China shock'. Her fix is 'humble innovation' - traditional industries, e-commerce, modular manufacturing in Shenzhen - plus a rewiring of local-official incentives that currently reward flying taxis and dancing robots.", "themes": [{"theme": "Polycrisis reframed as polytunity", "insights": [{"claim": "The term 'polycrisis' was popularised by Adam Tooze at the World Economic Forum in 2023 to name an entanglement of global threats, and Yuen Yuen Ang argues it should be flipped to 'polytunity' because a fear-driven frame is paralysing rather than actionable.", "speaker": "Yuen Yuen Ang", "type": "framework", "entities": ["Adam Tooze", "World Economic Forum", "polycrisis", "polytunity"], "conviction": "high", "so_what": "The elite narrative frame is rotating from risk-avoidance to opportunity-seeking; expect Davos-adjacent policy language and allocation to follow that rotation.", "quote": "the idea of a polycrisis is frankly, fear-driven, paralysing", "locator": "the term polycrisis was actually popularised at this very forum", "quote_verified": true}, {"claim": "Periods of systemic breakdown are the only realistic windows for deep structural transformation, because in normal times incumbents keep running business as usual no matter how broken the system is.", "speaker": "Yuen Yuen Ang", "type": "framework", "entities": ["globalization", "climate change", "Western-led global order"], "conviction": "high", "so_what": "Treat the current breakdown as a forcing function: reform windows in trade, industrial policy and institutions open now and close when stability returns.", "quote": "in normal times, we don't like to make big changes. It's hard. It's risky. So we'll continue with business as usual, no matter how broken things are.", "locator": "in normal times, we don't like to make big changes", "quote_verified": true}, {"claim": "Ang contends the polycrisis is primarily a crisis of Western decline, not a global one, because power has already shifted to Africa, Asia and Latin America as well as China, and the 'global majority' now expects to set agendas rather than receive them.", "speaker": "Yuen Yuen Ang", "type": "contrarian", "entities": ["China", "Africa", "Asia", "Latin America", "global majority"], "conviction": "high", "so_what": "Risk-premium narratives built out of Washington and Brussels systematically overstate global fragility and understate emerging-market agency and demand.", "quote": "I think the term polycrisis is more of a polycrisis of Western decline. Not a critique of the West, just a statement of observation.", "locator": "so in many ways, I think the term polycrisis", "quote_verified": true}, {"claim": "Complaining about the polycrisis does not resonate outside the West, because for most of the world today's mix of risk and opportunity is better than anything available in the last century.", "speaker": "Yuen Yuen Ang", "type": "thesis", "entities": ["global majority", "polycrisis"], "conviction": "high", "so_what": "Sentiment gaps between developed-market and emerging-market decision-makers are structural, not cyclical - a reason EM capex intentions can stay firm while DM confidence sags.", "quote": "if you sit here and moan about the polycrisis, it doesn't resonate with the rest of the world", "locator": "And so that's why if you sit here and moan", "quote_verified": true}]}, {"theme": "How globalisation trapped China in cheap goods", "insights": [{"claim": "The globalisation order that let China prosper through export-led manufacturing also trapped it: because consumer-goods manufacturing was so profitable, state pressure to climb the value chain, form joint ventures and do fundamental R&D repeatedly failed.", "speaker": "Yuen Yuen Ang", "type": "causal", "entities": ["China", "joint ventures", "R&D", "export-led manufacturing"], "conviction": "high", "so_what": "Industrial upgrading in China was demand-constrained by profitability, not capability - which is why external shock, not subsidy, was the effective catalyst.", "quote": "Because why would you work, why would you really do the hard thing when you make so much profit from doing consumer manufacturing?", "locator": "despite state efforts to compel, pressure Chinese companies", "quote_verified": true}, {"claim": "The head-on US-China competition that began around 2016 functioned as China's 'polytunity' - the threat that finally justified abandoning shoes, toys and toasters for advanced materials, aeroplanes and quantum computers under the 14th and 15th Five-Year Plans.", "speaker": "Yuen Yuen Ang", "type": "causal", "entities": ["China", "United States", "14th Five-Year Plan", "15th Five-Year Plan", "advanced materials", "quantum computers", "aeroplanes"], "conviction": "high", "so_what": "US pressure accelerated rather than blunted Chinese upgrading; further decoupling should be modelled as an accelerant of Chinese upstream capability, not a brake.", "quote": "given that the state of the world is in disorder, anyway, let's take advantage of that and do the hard thing", "locator": "So in a sense when China and the U.S. had this head-on competition", "quote_verified": true}]}, {"theme": "China's economic paradox and the consumption bottleneck", "insights": [{"claim": "Ang's 'China economic paradox' is that real, impressive high-tech advances coexist with a broad economic slowdown - the country's core problem is neither the growth slowdown alone nor geopolitical tension alone.", "speaker": "Yuen Yuen Ang", "type": "framework", "entities": ["China", "high-tech", "economic slowdown"], "conviction": "high", "so_what": "Do not read Chinese tech breakthroughs as a proxy for Chinese macro strength - the two series can diverge for years.", "quote": "the high-tech advances are real and they are impressive, but they are coexisting with a broad economic slowdown", "locator": "It's in particular what I call China's economic paradox", "quote_verified": true}, {"claim": "Production and consumption are a single system in China: without domestic consumption power, the EVs and advanced materials China builds must be pushed out to Southeast Asia, South Africa and other markets, which is what the world experiences as the 'China shock'.", "speaker": "Yuen Yuen Ang", "type": "causal", "entities": ["China", "EVs", "Southeast Asia", "South Africa", "advanced materials"], "conviction": "high", "so_what": "Weak Chinese retail demand is a direct leading indicator of export volume, global goods deflation and trade-friction risk in EM markets.", "quote": "if you don't have a domestic consumption power, then they have to go out", "locator": "And so China is making these EVs, advanced materials", "quote_verified": true}, {"claim": "Boosting Chinese domestic consumption has stopped being a domestic policy question and become an international one, because it is the only mechanism that keeps Chinese production sustainable without triggering foreign backlash.", "speaker": "Yuen Yuen Ang", "type": "thesis", "entities": ["China", "domestic consumption", "trade"], "conviction": "high", "so_what": "Chinese consumption stimulus is the key variable for global trade-war de-escalation - watch it as a geopolitical, not just cyclical, indicator.", "quote": "boosting Chinese domestic consumption is no longer a domestic issue. It actually is an international issue", "locator": "Then the key to that is consumption", "quote_verified": true}, {"claim": "China's second-highest-ranking official used the Dalian opening plenary to push back on the Western 'China shock 2.0' narrative and recast it as 'China opportunity 2.0', but Ang insists the shock is real and must be acknowledged because other countries legitimately ask what is left for them to make.", "speaker": "Yuen Yuen Ang", "type": "contrarian", "entities": ["China", "Chinese premier", "China shock 2.0", "Dalian"], "conviction": "high", "so_what": "Beijing's official framing understates the trade-conflict risk embedded in its own export surge; expect more tariff and local-content responses abroad.", "quote": "So that is the shock. And the shock is real. It has to be acknowledged.", "locator": "But China is just so good at manufacturing", "quote_verified": true}, {"claim": "Chinese retail sales fell 0.6% last month, the first decline in more than three years, even as eight central government departments announced an acceleration of 'AI plus consumption' development - a gap between policy activity and measured results.", "speaker": "Olivia Siong", "type": "data_point", "entities": ["China", "retail sales", "CCTV", "AI plus consumption"], "conviction": "high", "so_what": "Hard evidence that Chinese consumption stimulus is not yet transmitting - a live short-term risk for consumer-exposed China names and a support for the export-push thesis.", "quote": "retail sales fell by 0.6% and that was for the first time in more than three years", "locator": "but the statistic we saw last year, last month rather", "quote_verified": true}, {"claim": "Consumption policy has an intrinsically slower and less controllable transmission mechanism than investment: a government can pump billions and see a GDP effect, but cannot press a button and get consumption three months later.", "speaker": "Yuen Yuen Ang", "type": "framework", "entities": ["China", "fiscal policy", "GDP", "investment"], "conviction": "high", "so_what": "Explains Beijing's revealed preference for investment stimulus and warns against expecting fast consumption prints after each announced package.", "quote": "It's almost like dealing with AI. You know, you thought you put in all the right inputs, why am I not getting the right outputs, right?", "locator": "Because consumption is slow", "quote_verified": true}, {"claim": "The root cause of persistently weak Chinese consumption is employment structure: the new growth model of AI, quantum, EVs and aeronautics is not mass-employment-producing and may cut jobs in the short term, while the weakened old growth model no longer employs hundreds of millions plus each year's college-graduate cohort.", "speaker": "Yuen Yuen Ang", "type": "causal", "entities": ["China", "AI", "quantum", "EVs", "aeronautics", "employment", "college graduates"], "conviction": "high", "so_what": "The consumption weakness is structural and multi-year, not a confidence blip - underwrite Chinese consumer demand recovery slowly.", "quote": "when I go to one of these impressive automated factories in China, I'm like, wow, this is so sleek. There is nobody in this factory. They're all robots. So where are the jobs?", "locator": "The new growth models impressive advances", "quote_verified": true}, {"claim": "Targeted subsidies such as EV trade-in grants give only temporary demand boosts and cannot fix Chinese consumption, because the true driver is job security - people spend when they have a good job and feel safe in it.", "speaker": "Yuen Yuen Ang", "type": "thesis", "entities": ["China", "EV subsidies", "employment"], "conviction": "high", "so_what": "Fade the consumption impact of each new Chinese subsidy programme; track labour-market and graduate-employment data instead.", "quote": "the fundamental fix of consumption is employment. I have a good job, I feel safe in my job. I feel confident, I spend.", "locator": "The solution will not be a quick fix", "quote_verified": true}]}, {"theme": "Humble innovation vs glamorous innovation", "insights": [{"claim": "Ang argues China is over-allocating to cutting-edge, marketable technologies and under-allocating to traditional industries and applicational innovation such as e-commerce, which are the sectors that actually generate mass employment and are open to people from all walks of life.", "speaker": "Yuen Yuen Ang", "type": "contrarian", "entities": ["China", "e-commerce", "traditional industries", "quantum computing"], "conviction": "high", "so_what": "A policy pivot toward 'boring' sectors would be the real signal that Beijing is serious about consumption - and a rerating catalyst for old-economy Chinese names.", "quote": "too much emphasis is being placed on the cutting-edge technologies right now. They are impressive, they're marketable, and too little emphasis is being placed on everything else", "locator": "So I think that one of the key solutions", "quote_verified": true}, {"claim": "China's most underrated industrial asset is modular manufacturing: a comprehensive, nimble supply chain lets an entrepreneur from Switzerland or Singapore go to Shenzhen, prototype a product and run a small batch quickly and cheaply, replacing the old model of gigantic single-product MNC factories.", "speaker": "Yuen Yuen Ang", "type": "framework", "entities": ["Shenzhen", "China", "modular manufacturing", "MNCs", "Switzerland", "Singapore"], "conviction": "high", "so_what": "Small-batch prototyping capacity is a durable Chinese moat that tariffs do not touch and that reshoring plans rarely replicate - relevant for hardware startup supply chains.", "quote": "an entrepreneur from any part of the world, Switzerland, Singapore, can go to Shenzhen and say, I want to prototype a new product, and can I make a small batch of it?", "locator": "What is modular manufacturing?", "quote_verified": true}, {"claim": "Ang's core distinction is between 'humble innovation' - low barriers to entry, broad participation, easily integrated into daily life - and 'glamorous innovation', which matters only in particular contexts; she says the real solution to Chinese consumption lies in the non-glamorous parts of the economy.", "speaker": " // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
