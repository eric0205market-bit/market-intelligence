const META = {
  date: "2026-09-11",
  time: "09:10 CEST",
  windowStart: "2026-09-11 03:06 CEST",
  windowEnd: "2026-09-11 09:06 CEST",
  emailsInWindow: 13,
  emailsRead: 13,
  itemsExtracted: 15,
  includedSources: [
    { name: "MacroEdge Oil and Gas Research (Don Miami)", count: 2 },
    { name: "Dark Side of the Boom", count: 3 },
    { name: "Tavi Costa", count: 1 },
    { name: "DTI Newsletter (Italian)", count: 1 },
    { name: "Michael Parekh (AI-RTZ #1206)", count: 2 },
    { name: "MacroEdge (Six)", count: 1 },
    { name: "McKinsey Global Institute", count: 3 },
    { name: "HFIR", count: 1 },
    { name: "Tiger Research", count: 1 }
  ],
  skippedSources: [
    { name: "Prometheus Research — subscriber chat / livestream promo (2 messages in window)", reason: "Both messages were solely \"Bob and I will be back tomorrow, drop your questions\" livestream announcements — zero analytical content." }
  ]
};

const CAT_COLORS = {
  macro: "#e24b4a", credit: "#378add", positioning: "#ef9f27", "AI/infra": "#1d9e75",
  crypto: "#7f77dd", geopolitics: "#d85a30", energy: "#f97316", tech: "#06b6d4",
  gold: "#d4a017", culture: "#ec4899", labor: "#8b5cf6", regulation: "#64748b",
  science: "#14b8a6", venture: "#84cc16"
};
const URG_META = {
  act: { label: "🔴 Act Now", key: "act" },
  deep: { label: "🔵 Deep", key: "deep" },
  watch: { label: "🟡 Watch", key: "watch" }
};
const URG_ICON = { act: "🔴", deep: "🔵", watch: "🟡" };

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function catColor(cat) { return CAT_COLORS[cat] || "#888"; }

function buildFilterBars() {
  const catCounts = {};
  ITEMS.forEach(i => { catCounts[i.cat] = (catCounts[i.cat] || 0) + 1; });
  const catBar = document.getElementById("catBar");
  let html = '<button class="pill' + (activeCat === "all" ? " active" : "") + '" style="' + (activeCat === "all" ? "background:#333;" : "") + '" onclick="setCat(\'all\')">All <span class="count">' + ITEMS.length + '</span></button>';
  Object.keys(catCounts).sort().forEach(c => {
    const isActive = activeCat === c;
    html += '<button class="pill' + (isActive ? " active" : "") + '" style="' + (isActive ? ("background:" + catColor(c) + ";") : "") + '" onclick="setCat(\'' + c + '\')">' + c + ' <span class="count">' + catCounts[c] + '</span></button>';
  });
  catBar.innerHTML = html;

  const urgCounts = {};
  ITEMS.forEach(i => { urgCounts[i.urgency] = (urgCounts[i.urgency] || 0) + 1; });
  const urgBar = document.getElementById("urgBar");
  let uhtml = '<button class="pill' + (activeUrg === "all" ? " active" : "") + '" style="' + (activeUrg === "all" ? "background:#333;" : "") + '" onclick="setUrg(\'all\')">All <span class="count">' + ITEMS.length + '</span></button>';
  ["act", "deep", "watch"].forEach(u => {
    if (!urgCounts[u]) return;
    const isActive = activeUrg === u;
    uhtml += '<button class="pill' + (isActive ? " active" : "") + '" style="' + (isActive ? "background:#444;" : "") + '" onclick="setUrg(\'' + u + '\')">' + URG_META[u].label + ' <span class="count">' + urgCounts[u] + '</span></button>';
  });
  urgBar.innerHTML = uhtml;
}

function setCat(c) { activeCat = c; activeSrc = null; renderCards(); buildFilterBars(); }
function setUrg(u) { activeUrg = u; activeSrc = null; renderCards(); buildFilterBars(); }
function filterBySrc(name) {
  activeSrc = name; activeCat = "all"; activeUrg = "all";
  renderCards(true);
  buildFilterBars();
}

function renderCards(expandMatches) {
  const container = document.getElementById("cards");
  let filtered = ITEMS.filter(i => {
    if (activeCat !== "all" && i.cat !== activeCat) return false;
    if (activeUrg !== "all" && i.urgency !== activeUrg) return false;
    if (activeSrc && i.source.indexOf(activeSrc) === -1) return false;
    return true;
  });
  let html = "";
  filtered.forEach(item => {
    const color = catColor(item.cat);
    const chartIco = item.charts.hot ? "🔥" : (item.charts.count > 0 ? "📊" : "");
    const openClass = expandMatches ? " open" : "";
    const hotClass = item.charts.hot ? " hot" : "";
    html += '<div class="card' + hotClass + '" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">' + String(item.id).padStart(2, "0") + '</span>';
    html += '<span class="urg">' + URG_ICON[item.urgency] + '</span>';
    html += '<span class="badge" style="background:' + color + '">' + shortSrc(item.source) + '</span>';
    html += '<span class="cat-tag">' + item.cat + '</span>';
    if (chartIco) html += '<span class="chart-ico">' + chartIco + '</span>';
    html += '<span class="card-title">' + item.title + '</span>';
    html += '</div>';
    html += '<div class="card-body' + (expandMatches ? " open" : "") + '" id="body-' + item.id + '">';
    html += '<div class="block-label">The Idea</div><div class="idea-text">' + item.idea + '</div>';
    html += '<div class="block-label">My Angle</div><div class="angle-box" style="border-left:2px solid ' + color + '; background:' + color + '14;">' + item.angle + '</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet-card"><div class="tweet-label" style="color:#378add;">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet-card"><div class="tweet-label" style="color:#7f77dd;">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    html += '<div class="chart-note' + (item.charts.hot ? " hot" : "") + '">' + (item.charts.count > 0 ? ("📊 " + item.charts.count + " chart(s) — " + item.charts.desc) : ("No charts in preview. " + item.charts.desc)) + '</div>';
    html += '<a class="card-link" style="color:' + color + '" href="' + item.link + '" target="_blank">↗ Read full article</a>';
    html += '</div>';
    html += '</div>';
  });
  container.innerHTML = html || '<p style="color:#888;padding:20px 0;">No items match this filter.</p>';
}

function shortSrc(s) {
  return s.length > 26 ? s.slice(0, 24) + "…" : s;
}

function toggleCard(id) {
  const body = document.getElementById("body-" + id);
  body.classList.toggle("open");
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function buildReport() {
  const el = document.getElementById("reportBody");
  let html = '<div class="report-row"><strong>Window:</strong> ' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</div>';
  html += '<div class="report-row"><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp;·&nbsp; <strong>Read:</strong> ' + META.emailsRead + ' &nbsp;·&nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</div>';
  html += '<div class="report-row" style="margin-top:10px;"><strong>Included sources:</strong></div>';
  META.includedSources.forEach(s => {
    html += '<div class="report-row">— <span class="report-src" onclick="filterBySrc(\'' + s.name.replace(/'/g, "\\'") + '\')">' + s.name + '</span> (' + s.count + ' item' + (s.count > 1 ? 's' : '') + ')</div>';
  });
  html += '<div class="report-row" style="margin-top:10px;"><strong>Skipped sources:</strong></div>';
  META.skippedSources.forEach(s => {
    html += '<div class="report-row">— ' + s.name + ' — <em>' + s.reason + '</em></div>';
  });
  html += '<div class="totals">Total: ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources.</div>';
  el.innerHTML = html;
}

document.getElementById("headerMeta").textContent = META.date + " · " + META.time + " · " + META.itemsExtracted + " items";
buildFilterBars();
renderCards();
buildReport();
</script>
</body>
</html>
