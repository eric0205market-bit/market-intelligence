<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-08-15T17:20:58Z", "input_stats": {"total_tweets": 129, "unique_authors": 60, "tweets_with_images": 33, "after_noise_filter": 58}, "summary": "**Anthropic/Dario AI-safety fallout:** Gavin Baker offers to broker an interview with Dario Amodei after backlash over reported private comments that Anthropic could be \"the only company left\"; Steve Hou publishes a long rebuttal calling the AI-doom discourse self-indulgent and demanding evidence over \"public lecturing.\"\n\n**Hyperliquid gets institutional validation, but the data is mixed:** Paul Tudor Jones adds to Bitcoin and Druckenmiller's Duquesne discloses a new $23M PURR position, even as on-chain data shows HL's RWA users rarely convert to crypto trading and Laura Shin's data-heavy thread argues perps volume is shrinking, not booming, despite the mainstream narrative.\n\n**Macro crosscurrents:** Bob Elliott argues Iran's economy can absorb more pain than assumed in its \"economic war\" with the US; Nic Carter defends JD Vance's dollar-reserve-currency critique as intellectually serious (Triffin Dilemma); Andy Constan says current US fiscal stance is contractionary, not stimulative, since outlay growth trails nominal GDP.\n\n**Positioning highlights:** Leopold Aschenbrenner's Situational Awareness Fund 13F shows extreme concentration in memory and neocloud names ($SNDK+$MU = 55.6% of the book); trader \"Serenity\" reports +2,411% YTD off semiconductor/optical longs; SpotGamma flags SPX call skew at 2-year highs against put skew at 2-year lows.\n\n**Geopolitics:** Zineb Riboua tracks Turkey's expanding influence in Central Asia alongside Morocco intercepting 300 migrants headed for Ceuta and EU funding for Tunisia's coastguard; Geiger Capital contrasts 1990s South Africa with today's Johannesburg power crisis as a decolonization cautionary tale.", "sections": {"A_events": [{"cluster": "Anthropic/Dario — AI Safety PR Fallout", "category": ["AI", "tech"], "items": [{"author": "GavinSBaker", "summary": "Responding to Sholto Douglas's pushback on claims that Dario privately said Anthropic could be \"the only company left,\" Gavin Baker calls the exchange thought-provoking and says he'll respond carefully. In a separate reply he says he's worried the \"negative vision\" of AI is currently winning with unpredictable consequences, and offers to interview Dario Amodei himself at his Tomorrow x Summit conference (where he's also interviewing Jensen Huang), or have Dario interviewed by a trusted investor like altcap.", "tweet_url": "https://x.com/GavinSBaker/status/2088648335490011189", "images": [], "type": "tweet"}, {"author": "stevehou", "summary": "In a long essay quote-tweeting the Baker/Douglas exchange, Steve Hou argues Anthropic's messianic public messaging on existential AI risk creates an inherent tension: if Anthropic is truly far ahead it should be able to unilaterally \"pace the frontier,\" but if the risk is a diffuse prisoner's-dilemma problem, coordinated restraint is nearly impossible once China and other labs are factored in. He says the broader AGI-doom discourse can feel self-indulgent to people outside the SV bubble, noting current frontier models still show brittleness, goal drift, and need heavy supervision on longer-horizon tasks. He concludes that concrete capability demonstrations, not further \"public lecturing,\" would be far more persuasive for coordinating AI safeguards. A companion tweet separately notes AI-generated code remains bloated by default unless developers actively adopt good guidelines — calling this a \"skills issue\" that shouldn't exist if superintelligence is truly near.", "tweet_url": "https://x.com/stevehou/status/2088664733671129382", "images": [], "type": "thread"}, {"author": "cryptopunk7213", "summary": "Pushes back in the same debate, noting Dario and Anthropic's co-founders committed to giving away a chunk of their wealth — cited as evidence against bad-faith framing of Anthropic's motives.", "tweet_url": "https://x.com/cryptopunk7213/status/2088596166145351720", "images": [], "type": "tweet"}, {"author": "alpha_pls", "summary": "Reacting to the same Gavin Baker thread, says he assumes Dario never actually said the \"only company left\" line, calling it a Black Mirror-esque outcome that's provocative bait for AI doomers but ultimately won't happen.", "tweet_url": "https://x.com/alpha_pls/status/2088553229650952606", "images": [], "type": "tweet"}, {"author": "naval", "summary": "One-line philosophical jab landing in the same conversation window about AI control: \"You cannot create God and put him on a leash.\"", "tweet_url": "https://x.com/naval/status/2088550653497053623", "images": [], "type": "tweet"}]}, {"cluster": "Hyperliquid — Institutional Money Piles In, On-Chain Data Complicates the Story", "category": ["crypto", "positioning"], "items": [{"author": "fejau_inc", "summary": "Reports that Paul Tudor Jones is adding to his Bitcoin position while Druckenmiller is buying into Hyperliquid, framed as a bullish weekend headline for crypto macro positioning.", "tweet_url": "https://x.com/fejau_inc/status/2088676201477145026", "images": ["https://pbs.twimg.com/media/HPx379ca0AAnyOB.jpg"], "type": "tweet"}, {"author": "Crypto_McKenna", "summary": "Quote-tweets the detail behind the Druckenmiller headline: Duquesne's family office publicly disclosed a new $23M position in $PURR (HypeStrat) last quarter — giving the macro legend Hyperliquid-native exposure via an equity wrapper at a fund that doesn't hold tokens directly.", "tweet_url": "https://x.com/Crypto_McKenna/status/2088546908642116045", "images": [], "type": "tweet"}, {"author": "Delphi_Digital", "summary": "Shares a Hivemind podcast clip where their analyst Kevin argues Hyperliquid can be a major beneficiary of the AI trade if it builds a robust spot market for AI-related assets, since perps can then be layered on top.", "tweet_url": "https://x.com/Delphi_Digital/status/2088637068972904792", "images": [], "type": "tweet"}, {"author": "0xngmi", "summary": "Complicates the bullish narrative with data: he tested whether Hyperliquid's HIP-3 RWA markets are pulling users from CEXs into full crypto trading. They're not — 80.9% of users whose first trade was an RWA market never trade crypto markets at all and stick purely to RWA, while (per a follow-up reply) retention is actually higher among HL's existing crypto traders than among RWA-first users.", "tweet_url": "https://x.com/0xngmi/status/2088493922691518517", "images": [], "type": "thread"}]}, {"cluster": "Iran Economic War & the Oil Shock That Wasn't", "category": ["macro", "geopolitics", "energy"], "items": [{"author": "BobEUnlimited", "summary": "In a substack-linked analysis, Bob Elliott frames the US-Iran standoff as an economic war where both sides are waiting to see who blinks first. Looking at Iranian data through the lens of historical cases that force policy shifts, he argues conditions aren't as dire as assumed — Iran's economy, being high-volatility by nature given its politics and oil dependence, has more built-in tolerance for pain short-term than a typical Western economy. In replies he adds that IMF data shows both Saudi Arabia and the UAE growing around 3% this year (down from 6% last year) — a slowdown, but far from disaster — and that parallel exchange rates and sovereign liquidity are discussed in more depth in the linked piece.", "tweet_url": "https://x.com/BobEUnlimited/status/2088570299549638989", "images": ["https://pbs.twimg.com/media/HPwW_r5XwAAnEUE.png"], "type": "thread"}, {"author": "JavierBlas", "summary": "Quotes a Foreign Affairs piece noting that, measured against the nightmare scenarios envisioned at the war's outset, oil prices have stayed low and the global economy has avoided the recession past energy shocks typically produced.", "tweet_url": "https://x.com/JavierBlas/status/2088559758382940402", "images": [], "type": "tweet"}]}, {"cluster": "Crypto Market Structure — Perps Growth Story Questioned, On-Chain Data Mixed", "category": ["crypto", "positioning"], "items": [{"author": "laurashin", "summary": "In a 4-part thread, Laura Shin challenges the consensus that perps going mainstream (alongside 24/7 stocks, gold, pre-IPO names) proves crypto markets are maturing. The data says otherwise: centralized perp volume hit a 31-month low, on-chain perps fell 21% in a month, spot volume sits at 2019 levels, and July's tokenized-stock volume surge was mostly driven by one zero-fee promo token. Her conclusion: perps aren't growing, they're taking share of a shrinking pie. She also flags that the dominant venue (implicitly Hyperliquid) looks cheap at 16x trailing revenue on its own dashboard, but that's TTM — on current run-rate it's actually 30x, and 136x fully diluted, per her Bits + Bips premium breakdown. A separate short thread cites technician Katie Stockton's view that Bitcoin's monthly stochastic clearing 20% decisively would be the oversold buy signal she's watching for.", "tweet_url": "https://x.com/laurashin/status/2088650229805658498", "images": [], "type": "thread"}, {"author": "stacy_muur", "summary": "Two data-driven posts: first, a ranking of the top 10 tokenization platforms by RWA value (Securitize $4.98B, Ondo $3.60B, Circle $3.01B, Tether $2.66B, down to STOKR $1.35B), noting Securitize's value is concentrated in just 25 assets (~$199M each) vs. Ondo's broader spread across 441 assets (~$8M each). Second, on Bitcoin's 1+ year HODL wave: currently ~61% of supply hasn't moved in a year, up from ~59% in February but still below last August's ~64% — while Glassnode shows long-term holders sold a net ~212K BTC over the past 30 days, so she stops short of calling 61% an accumulation signal yet.", "tweet_url": "https://x.com/stacy_muur/status/2088599339279233419", "images": ["https://pbs.twimg.com/media/HPwyCAEbcAALQEO.jpg"], "type": "tweet"}]}, {"cluster": "Dollar Reserve Currency Debate — Vance's Triffin Dilemma Take", "category": ["macro", "positioning"], "items": [{"author": "nic_carter", "summary": "Defends JD Vance's controversial comment about ending the dollar's global reserve status as intellectually serious rather than ignorant, pointing to the Triffin Dilemma and dollar \"Dutch disease\" literature (Miran, Pettis, Alden) as established grounding. He argues reserve status has genuinely contributed to deindustrialization and hollowed out the middle America that Vance represents politically — the dollar's strength subsidizes finance/services exports that mainly benefit coastal elites, while the strategic benefits (sanctions leverage, power projection) are fading at the margin. He says he personally leans against Vance on net, but considers dismissing the argument as sophistry. Separately, he opens a new thread arguing dollar-reserve elites tolerated the costs to \"flyover\" America because strategic benefits (sanctions power) were real — but those benefits have largely run out just as flyover America has become politically mobilized, making the conversation timely.", "tweet_url": "https://x.com/nic_carter/status/2088617751736643647", "images": [], "type": "thread"}]}, {"cluster": "South Africa — Post-Colonial Decline", "category": ["EM", "geopolitics", "society"], "items": [{"author": "Geiger_Capital", "summary": "Contrasts 1990 South Africa — then the most advanced nation in Africa, with a vast manufacturing base, developed financial sector, and nuclear weapons program — with its state today, noting the country that performed the world's first heart transplant now can't reliably keep the lights on in its capital. Presented as a cautionary tale about post-colonial institutional decline.", "tweet_url": "https://x.com/Geiger_Capital/status/2088674691388932353", "images": ["https://pbs.twimg.com/media/HPx0TZQXgAAlRi3.jpg"], "type": "tweet"}]}, {"cluster": "Geopolitics — Turkey's Rise, Mediterranean Migration", "category": ["geopolitics", "EM"], "items": [{"author": "zriboua", "summary": "A run of geopolitics notes: flags Turkey's growing influence in Central Asia via a proposed \"Turkic ID\" travel system; pushes back on neo-Ottomanism framing, arguing observers ignore Russian competition and the limits of Arab nationalism (more \"Great Seljuks 2.0\" than Ottoman revival); reports Moroccan authorities intercepted ~300 migrants attempting to cross into Ceuta after social-media posts encouraged the attempt; and cites a report that the EU allocated €20.1M to train Tunisia's coastguard to stem Mediterranean migrant flows. Also notes a Mamdani quote linking NYPD conduct to IDF training amid reactions to a Central Synagogue assault in NYC.", "tweet_url": "https://x.com/zriboua/status/2088658607311098050", "images": ["https://pbs.twimg.com/media/HPxnzDmXIAABo1R.jpg"], "type": "tweet"}]}, {"cluster": "AI Hardware Supply Chain — SemiAnalysis Credibility Dispute", "category": ["tech", "AI", "positioning"], "items": [{"author": "dylan522p", "summary": "Dylan Patel of SemiAnalysis fires back at an apparent accusation of getting semiconductor supply-chain calls wrong or hiding information from hedge funds. He says the sole real caveat was Micron's HBM4 status, which flipped after Nvidia later revised down its HBM pin-speed requirements, letting Micron in and improving yields across all three vendors — something SemiAnalysis says it explained in detail to clients. He maintains SemiAnalysis correctly reported reduced Broadcom volumes for '26/'27 (with reasons given) and separately reported AMD is working with Broadcom on something for the v10 generation, without claiming to know specifics of what AMD is doing — arguing that sitting on known facts without disclosing them to clients would be the actual bad practice.", "tweet_url": "https://x.com/dylan522p/status/2088653662780547546", "images": [], "type": "tweet"}]}], "B_insights": [{"author": "dampedspring", "summary": "Andy Constan argues the current US fiscal stance is not stimulative but mildly contractionary — outlay growth is running below nominal GDP growth, meaning \"the train is in reverse\" despite common assumptions of fiscal stimulus.", "tweet_url": "https://x.com/dampedspring/status/2088625393582354519", "images": [], "type": "thread"}, {"author": "dampedspring", "summary": "Publishes a new piece on his blog titled \"The Circle of Life\" about credit cycles, with a companion post he calls his \"hamburger thesis.\"", "tweet_url": "https://x.com/dampedspring/status/2088597627994546559", "images": ["https://pbs.twimg.com/media/HPwweV6WEAAhfPb.jpg"], "type": "thread"}, {"author": "nicbstme", "summary": "Nicolas Bustamante draws a detailed parallel between San Francisco's crypto-token boom and today's AI-token boom: the same extreme wealth displays, FOMO-driven paranoia about missing generational money, shady deals, insiders profiting outsized amounts, and loyalty evaporating the moment incentives shift. His key distinction: AI is a genuinely extraordinary underlying technology with real economic value and productivity gains, so while the boom feels unhealthy at the edges (much like crypto did), what's being collectively built underneath it is fundamentally sound.", "tweet_url": "https://x.com/nicbstme/status/2088670497932497382", "images": [], "type": "tweet"}, {"author": "santiagoroel", "summary": "Explains his holding company's acquisition philosophy: never do bad deals, and unlike a fund with a deployment clock, they can simply wait. After a year initially focused on crypto-adjacent acquisitions, he broadened the mandate to any durable business, concluding that stablecoins/tokenization are useful but implementing them in acquired businesses didn't unlock as much value as narratives suggested — whereas AI's measured operational impact has been considerably greater.", "tweet_url": "https://x.com/santiagoroel/status/2088650711999353224", "images": [], "type": "tweet"}, {"author": "jonchu", "summary": "On AI coding startups, argues the size of the opportunity was never really underestimated by investors (most work closely with engineers), but the real open question was always defensibility as dev paradigms shift. Notes that Windsurf reportedly took itself off the chessboard (sold) specifically because it didn't want to find out the answer to that defensibility question the hard way.", "tweet_url": "https://x.com/jonchu/status/2088488409480495463", "images": [], "type": "tweet"}, {"author": "hasufl", "summary": "Pushes back on concerns about ETH staking centralization risk, arguing self-custody erosion is already happening regardless of staking caps — asking rhetorically how much ETH is already not self-custodied today and how that number evolves over 10 years even under a hypothetical 5% staking cap.", "tweet_url": "https://x.com/hasufl/status/2088584495037378799", "images": [], "type": "tweet"}, {"author": "saxena_puru", "summary": "Argues volatility is not the same as risk and that long-term CAGR is what matters, quoting Buffett's preference for \"a lumpy 15% to a smooth 12%.\" Notes hyper-growth disruptive companies beat the market long-term precisely because they're volatile — there's no free lunch to get 25-30% CAGR with SPX-like volatility.", "tweet_url": "https://x.com/saxena_puru/status/2088521931926712726", "images": [], "type": "thread"}, {"author": "Chartfest1", "summary": "Helene Meisler's Saturday technical roundup: flags the 10-day moving average of the put/call ratio and notes the Russell 2000 (RUT) closed green for four straight sessions — the longest such streak in six weeks, a modest breadth-improvement signal.", "tweet_url": "https://x.com/Chartfest1/status/2088600062431543550", "images": ["https://pbs.twimg.com/media/HPwyrpaWoAA3weY.png"], "type": "tweet"}, {"author": "lopp", "summary": "Jameson Lopp links a new blog post on quantum-attack game theory for Bitcoin, arguing that while he supports Bitcoin's conservative ethos on protocol changes (e.g., not crashing // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
