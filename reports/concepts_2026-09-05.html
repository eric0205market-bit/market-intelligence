* { box-sizing: border-box; margin: 0; padding: 0; }

67, Israel has constructed more than 160 settlements in the West Bank and East Jerusalem now home to over 700,000 Israelis, according to the Israeli monitoring group Peace Now.", "speaker": "Chatham House", "type": "data_point", "entities": ["Israel", "West Bank", "East Jerusalem", "Peace Now"], "conviction": "high", "so_what": "The scale of settlement population (700,000+) sets the baseline against which any future two-state or land-swap negotiation would have to be measured.", "quote": null, "locator": "'Since Israel captured the West Bank from Jordan in the 1967 war'", "quote_verified": false}, {"claim": "The proposed E1 settlement development would link Jerusalem to Ma'ale Adumim, cutting off the central corridor connecting Ramallah, Bethlehem, and East Jerusalem and effectively bisecting the West Bank, which is why the UK, France, Germany, Italy, and Canada have condemned it.", "speaker": "Chatham House", "type": "causal", "entities": ["E1 settlement", "Ma'ale Adumim", "Jerusalem", "Ramallah", "UK", "France", "Germany", "Italy", "Canada"], "conviction": "high", "so_what": "E1 construction is a concrete trigger point to watch: its advancement would be read internationally as foreclosing West Bank territorial contiguity and could accelerate coordinated Western sanctions or trade responses.", "quote": null, "locator": "'E1 is particularly contentious due to its location'", "quote_verified": false}, {"claim": "Israeli ministers have stated that part of the aim of the current settlement project is to 'bury the idea of a Palestinian state,' indicating settlement policy is explicitly aimed at foreclosing statehood rather than purely security or religious motives.", "speaker": "Chatham House", "type": "contrarian", "entities": ["Israel", "Palestinian state"], "conviction": "high", "so_what": "An explicit stated political goal (rather than security rationale) undercuts arguments that settlement trade restrictions are unfairly targeting security policy, strengthening the e", "type": "contrarian", "entities": ["Labour Friends of Israel", "Israel", "UK-Israel Free Trade Agreement"], "conviction": "medium", "so_what": "The existing legal mechanism to distinguish settlement goods from Israeli goods undercuts the 'de facto boycott' objection, suggesting implementation is more feasible than critics claim for goods (though not services).", "quote": "de facto boycott", "locator": "'Nevertheless, there are concerns that should be taken seriously'", "quote_verified": true}, {"claim": "A ban on services such as banking, insurance, telecommunications, technology, tourism, and consulting tied to settlements would be far harder to regulate than a ban on goods, so the initial UK policy is likely to be limited to goods only.", "speaker": "Chatham House", "type": "prediction", "entities": ["UK", "Israel"], "conviction": "medium", "so_what": "Investors and firms with settlement-linked service exposure (banking, telecom, tech, tourism) face materially lower near-term regulatory risk than goods exporters, since any initial UK ban is expected to exempt services.", "quote": null, "locator": "'It is true that a ban on services'", "quote_verified": false}, {"claim": "Israel is reportedly considering removing British and European officials from the US-led Gaza coordination center in response to a UK settlement ban, and some fear this could prompt economic retaliation from US President Donald Trump.", "speaker": "Chatham House", "type": "data_point", "entities": ["Israel", "UK", "Donald Trump", "Gaza"], "conviction": "medium", "so_what": "A UK settlement ban carries tail risk of US retaliatory trade or diplomatic action under Trump, a factor that could affect UK-US trade relations beyond the Middle East file itself.", "quote": null, "locator": "'Israel is already considering the removal of British and European officials'", "quote_verified": false}]}], "insight_total": 12, "top_entities": ["UK", "Israel", "Andy Burnham", "West Bank", "European Union", "International Court of Justice", "Donald Trump", "Peace Now", "E1 settlement"], "source_meta": {"author": "", "word_count": 1350, "paywalled": false}}, {"record_id": "fb18f509b382bdc2", "source_type": "concepts", "source_name": "Dimensional Fund Advisors", "source_url": "https://www.dimensional.com/us-en/insights/the-power-of-diversification-discipline-and-staying-the-course", "title": "The Power of Diversification, Discipline, and Staying the Course | Dimensional", "published_date": "2026-09-04", "language": "en", "processed_at": "2026-09-05T13:22:00Z", "processor": "claude-code-sub-opus", "tags": ["Positioning"], "gist": "A short Dimensional podcast teaser in which financial advisor Randy Hardy argues long-term investing success depends on disciplined adherence to a diversified philosophy rather than forecasting, with no supporting data or specifics given in the collected text.", "themes": [{"theme": "Discipline over prediction", "insights": [{"claim": "Financial advisor Randy Hardy argues that successful long-term investing depends less on predicting market or economic outcomes and more on maintaining discipline around a clear, consistent investment philosophy.", "speaker": "Randy Hardy", "type": "thesis", "entities": ["Randy Hardy", "Dimensional Fund Advisors"], "conviction": "medium", "so_what": "A reminder to weight process and philosophy adherence over tactical forecasting when evaluating an advisor's or one's own investment approach, though the source text gives no specifics on implementation.", "quote": null, "locator": "podcast episode description, opening", "quote_verified": false}, {"claim": "A simple, diversified investment approach is framed as valuable primarily because it keeps investors focused on long-term goals instead of reacting to short-term market noise.", "speaker": "Randy Hardy", "type": "framework", "entities": ["diversification"], "conviction": "medium", "so_what": "Reinforces staying-the-course diversification as a behavioral discipline tool, not just a risk-management technique, when advising clients through volatile periods.", "quote": "A simple, diversified approach can be powerful precisely because it helps investors remain focused on their long-term goals rather than the noise of the moment.", "locator": "podcast episode description, closing line", "quote_verified": true}]}], "insight_total": 2, "top_entities": ["Randy Hardy", "Dimensional Fund Advisors", "Jake DeKinder"], "source_meta": {"author": "Featuring Jake DeKinder, Head of Client Communications", "word_count": 129, "paywalled": false}}, {"record_id": "2eee01e8634324c6", "source_type": "concepts", "source_name": "Works in Progress", "source_url": "https://worksinprogress.co/issue/all-the-microbes-you-cant-have/", "title": "All the microbes you can’t have - Works in Progress Magazine", "published_date": "2026-09-03", "language": "en", "processed_at": "2026-09-05T13:30:00Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "Society"], "gist": "A 1986 White House decision to regulate engineered microbes under the 1976 Toxic Substances Control Act (TSCA), using a scientifically arbitrary 'cross-genus DNA' trigger, has frozen commercialization of plastic-eating, metal-leaching, and pollution-sensing microbes for forty years; companies that route around TSCA via gene-shuffling or FDA/cosmetic classification have commercialized products, while Brazil and Israel show that fast, workable engineered-organism approval regimes are achievable without US-style paralysis.", "themes": [{"theme": "How TSCA came to govern biology", "insights": [{"claim": "In 1983, biotech company AGS applied to field-test a genetically modified 'ice-minus' microbe (with a single gene deleted) sprayed on crops to prevent frost damage, triggering the first US legal fight over releasing engineered organisms into the environment.", "speaker": "Works in Progress", "type": "anecdote", "entities": ["AGS", "ice-minus microbe"], "conviction": "high", "so_what": "Marks the origin point of the regulatory regime that, per this article, still blocks most engineered-microbe commercialization forty years later.", "quote": null, "locator": "opening paragraph, 'In 1983, a biochemical company called AGS'", "quote_verified": false}, {"claim": "Activist Jeremy Rifkin sued to block AGS's field trials, arguing the NIH had skipped a required Environmental Impact Statement and that the modified microbes could escape and affect rainfall; activists later cut through a fence and uprooted about 2,000 of 2,400 test strawberry plants after AGS won the right to proceed in 1987.", "speaker": "Works in Progress", "type": "anecdote", "entities": ["Jeremy Rifkin", "AGS", "National Institutes of Health"], "conviction": "high", "so_what": "Illustrates how activist legal and direct action, not scientific risk data, was the proximate trigger for the regulatory framework still governing engineered microbes today.", "quote": "possible effects on rainfall", "locator": "'But an activist named Jeremy Rifkin then sued'", "quote_verified": true}, {"claim": "After the Rifkin lawsuit, White House staff, EPA, and USDA lawyers concluded no new law was needed: the 1976 Toxic Substances Control Act (TSCA), written for industrial chemicals, would apply to engineered microbes because genomes are made of chemicals.", "speaker": "Works in Progress", "type": "causal", "entities": ["Toxic Substances Control Act", "EPA", "USDA", "White House"], "conviction": "high", "so_what": "The entire modern US engineered-microbe regulatory bottleneck traces to a single administrative interpretive choice in the 1980s, not a purpose-built biosafety law — meaning it is fixable by an equally administrative decision (an EPA memo) rather than new legislation.", "quote": null, "locator": "'They concluded that no new laws were needed'", "quote_verified": false}, {"claim": "Between 1987 and 2018, researchers filed more than 240 applications to develop TSCA-covered engineered microbes, and only a few were ever approved for widespread use.", "speaker": "Works in Progress", "type": "data_point", "entities": ["Toxic Substances Control Act", "EPA"], "conviction": "high", "so_what": "A sub-single-digit-percent approval rate over three decades is a quantifiable measure of how completely TSCA has frozen this category of biotech commercialization — useful as a baseline for judging any future reform's impact.", "quote": null, "locator": "'The TSCA is a regulatory black hole'", "quote_verified": false}, {"claim": "Under a 1997 EPA rule implementing TSCA, combining DNA from species across different genera automatically triggers full regulatory review, regardless of whether the resulting organism is demonstrably safe.", "speaker": "Works in Progress", "type": "framework", "entities": ["EPA", "Toxic Substances Control Act"], "conviction": "high", "so_what": "The bright-line 'cross-genus' test, not actual risk assessment, is the mechanical gate that determines whether a microbial biotech product can ever reach market in the US.", "quote": null, "locator": "'Under a 1997 EPA rule'", "quote_verified": false}]}, {"theme": "Technologies stuck in the TSCA black hole", "insights": [{"claim": "University of Texas at Austin engineers created FAST-PETase, a computationally-optimized enzyme 98% identical to a naturally evolved PET-plastic-degrading enzyme found near a Japanese recycling plant, that digests PET plastic bottles in under 24 hours versus six weeks for the natural version — but placing the enzyme's gene back into its original host microbe still triggers TSCA and blocks its use.", "speaker": "Works in Progress", "type": "data_point", "entities": ["FAST-PETase", "University of Texas at Austin", "Ideonella sakaiensis", "PET plastic"], "conviction": "high", "so_what": "A dramatically faster (weeks-to-hours) plastics recycling solution already exists technically but is legally blocked from deployment on landfills, representing a concrete, quantifiable opportunity cost of the current regulatory regime.", "quote": null, "locator": "'Engineers at the University of Texas at Austin therefore took'", "quote_verified": false}, {"claim": "Researchers have engineered E. coli that can detect heavy metals in water at very low concentrations — as little as five parts per billion of cadmium, and in a 2010 Chinese study, seven nanomolar mercury (seven times below the EPA's own contamination threshold) — but none of these biosensor strains can be used outside the lab because they contain intergeneric DNA that triggers TSCA.", "speaker": "Works in Progress", "type": "data_point", "entities": ["E. coli", "EPA"], "conviction": "high", "so_what": "Cheap, highly sensitive biosensors that could undercut existing water-testing methods and beat EPA's own detection thresholds are commercially blocked purely on classification grounds, not performance or safety grounds.", "quote": null, "locator": "'Researchers have already created E. coli'", "quote_verified": false}, {"claim": "The US has enough active mines to meet all domestic mineral needs if it could capture 90 percent of the byproduct metals currently discarded during ore purification, but conventional recovery is energy-intensive and chemically toxic, while microbial bioleaching offers a cleaner, self-powering alternative that remains regulatorily constrained.", "speaker": "Works in Progress", "type": "data_point", "entities": ["United States", "bioleaching", "mining"], "conviction": "medium", "so_what": "Bioleaching-enabled byproduct capture is framed as a potential path to US mineral self-sufficiency without new mines, relevant to critical-minerals and reshoring narratives, but is currently bottlenecked by the same TSCA regime.", "quote": null, "locator": "'Mining is another missed opportunity'", "quote_verified": false}, {"claim": "Cornell researchers in a 2021 study identified 89 genes involved in acid production by Gluconobacter oxydans B58 and, by deleting some and overexpressing others, created a variant that ex osquito population reduction), serving as evidence that faster approval need not mean unsafe outcomes.", "quote": null, "locator": "'Brazil approved the first unconstrained, environmental release'", "quote_verified": false}, {"claim": "Israel's approval process for releasing engineered microbes routes applications to a panel of government representatives and academics led by the Ministry of Agriculture, which typically renders a yes/no decision within a few months — in 2017, researchers received approval to release explosive-sensing engineered microbes in the Israeli desert in under a year.", "speaker": "Works in Progress", "type": "data_point", "entities": ["Israel", "Israeli Ministry of Agriculture"], "conviction": "high", "so_what": "Israel's few-months review timeline versus the US's decades-long near-total freeze is a stark comparative benchmark for how much faster engineered-microbe commercialization could move under a differently designed regulatory process.", "quote": null, "locator": "'Israel is even more efficient with its approval process'", "quote_verified": false}, {"claim": "The article concludes the US does not need to adopt a system as permissive as Israel's, but does need regulation that biotechnologists can actually navigate — arguing reform should mean clear data and field-trial standards, not throwing open the door to any engineered microbe.", "speaker": "Works in Progress", "type": "thesis", "entities": ["United States", "EPA"], "conviction": "high", "so_what": "Frames the reform ask as targeted process fixes (clear standards, published criteria, use of accumulated field data) rather than deregulation, which is the more politically viable framing for policymakers to act on.", "quote": "It's why plastic-eating and mine-seeking microbes, for all their promise, have never left the lab.", "locator": "closing paragraph", "quote_verified": true}]}], "insight_total": 28, "top_entities": ["EPA", "Toxic Substances Control Act", "Pivot Bio", "ZBiotics", " // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
