<script>
const ITEMS = [{"id": 1, "cat": "AI/infra", "urgency": "deep", "source": "Dark Side of the Boom", "title": "Hyperscaler capex shows almost no rate sensitivity — financing cost is small vs the earnings it funds", "idea": "Yields have backed up enough to normally crush growth multiples, yet Nasdaq 100 printed a record Friday. Author's claim: hyperscaler spend is 'remarkably insensitive' to rates because financing burden is tiny vs earnings; they are not borrowers waiting for cheaper money. If yields fall, the release valve is the multiple, not capex.", "angle": "Rates transmission to the AI trade is broken at the top of the cap stack — but not for the second-tier builders who actually borrow. Look for where the financing cost is NOT small (neoclouds, power developers, data-center ABS).", "tweetA": "10y at 5.2%+ and the Nasdaq is at a record. Either duration doesn't matter for the five companies that are the index, or it matters a lot for everyone who funds them. I'd rather own the second group's short side than argue with the first.", "tweetB": "The rate-insensitive buyer is the best demand signal in the market: capex doesn't wait for cheaper money. The rate-sensitive part is the chain behind it — leasing, power, credit. That's where a 5% 10y bites first. $NVDA $MSFT $ORCL", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/asia-open-stocks-rise-as-hike-bets"}, {"id": 2, "cat": "labor", "urgency": "deep", "source": "Dark Side of the Boom", "title": "Breakeven payroll growth has collapsed toward zero — 29k print is 'Goldilocks'", "idea": "September payrolls +29k (vs 84k expected per SixSigma), unemployment 4.2%, trend 40-60k/month. Author argues breakeven job growth is near zero as immigration slowed sharply, labor-force growth thinned and boomers keep retiring — so 40-60k is balanced, not weak, versus the old 200k norm.", "angle": "If breakeven is ~0-50k, every legacy payroll-based recession signal (Sahm-style, consensus misses) is miscalibrated. Fed hike odds and a 'weak jobs' narrative can both be wrong at once.", "tweetA": "A 29k payroll print used to be a recession scare. With breakeven near zero it's a labor market in equilibrium. Half the macro models still calibrated to 200k/month are reading noise as signal.", "tweetB": "Immigration slows, boomers retire, breakeven payrolls fall to ~0. That's a supply shock to labor, not a demand shock. It's why the Fed can hike into a 4.2% unemployment rate and nobody blinks. Wage inflation is the thing to watch.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/asia-open-stocks-rise-as-hike-bets"}, {"id": 3, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom", "title": "Front end trades the Fed, long end trades the AI-and-government bill; 10y/30y auctions this week are the test", "idea": "October hike odds pushed below 25% and the risk migrated to December, but Treasuries stay heavy: inflation, energy, government borrowing and AI capital intensity compete for the same pool of money. This week's 10y and 30y auctions are framed as a direct test of whether duration is being paid enough.", "angle": "Curve steepener from the supply side, not the policy side. Weak auction tails = equities lose the 'Goldilocks' leg despite a dovish front end.", "tweetA": "October hike odds under 25%, December still ~85% per SixSigma, and the long end still sells off. The curve is telling you the Fed isn't the marginal problem. Supply is. Watch the auction tails.", "tweetB": "Two markets, two stories: front end prices the Fed pausing, long end prices the AI buildout plus deficits all queueing for the same savings pool. The 30y auction this week is the clearing price for both.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/asia-open-stocks-rise-as-hike-bets"}, {"id": 4, "cat": "energy", "urgency": "deep", "source": "Dark Side of the Boom", "title": "Brent back above $103 after +5% week; Aramco refinery attack and Yemen push; gold worst week since June", "idea": "Brent >$103/bbl despite unchanged OPEC+ quotas, driven by the weekend attack on a Saudi Aramco refinery and a Saudi-backed push in Yemen to retake Houthi-held territory. Gold barely moves after its worst week since June — 'a passenger of the dollar, oil and real-yield complex'.", "angle": "Gold behaving as a real-yield asset, not a geopolitical hedge, while oil carries the geopolitical premium. That's the reverse of the 2022 playbook.", "tweetA": "Aramco refinery hit, Brent $103, and gold just had its worst week since June. The hedge everyone bought for geopolitics is trading as a real-yield instrument. The war premium is in crude, not bullion. $XLE $GLD", "tweetB": "Oil above $103 with OPEC+ unchanged means the move is physical risk, not policy. Saudi refinery attack plus Yemen ground push, in the same week Gulf exports hit 6-month highs. Both can't be the whole story.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/asia-open-stocks-rise-as-hike-bets"}, {"id": 5, "cat": "geopolitics", "urgency": "watch", "source": "Dark Side of the Boom", "title": "Euro fiscal stress is leaking across sovereign curves beyond France; Brazil vote count under way", "idea": "Europe's fiscal stress 'has already started leaking across sovereign curves' — once it moves beyond France it becomes a euro-area risk problem, with a weaker euro handing the dollar another leg. Brazil's presidential vote count is the idiosyncratic risk this morning.", "angle": "Euro weakness + hot US long end + oil is a dollar-up configuration — bad for EM and gold, supportive for the broader dollar complex. Brazil is a binary for BRL/EWZ at the open.", "tweetA": "France was a budget story. If it spreads to a second sovereign it's a euro-area story, and the ECB's reaction function changes. A weaker euro on top of $103 oil is a stagflation import for Europe.", "tweetB": "Brazil counting votes while European sovereign spreads leak and the dollar firms. Not the setup you want for EM at Monday's open. $EWZ $FXE", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/asia-open-stocks-rise-as-hike-bets"}, {"id": 6, "cat": "regulation", "urgency": "deep", "source": "The Pressure Point (Fulcrum)", "title": "Why Treasury picked Macau's tenth-largest bank — the Banco Delta Asia model could return for Russia sanctions", "idea": "Treasury targeted Banco Delta Asia in 2005 (10th largest Macau bank, 8 branches, 150 staff) via Section 311 — North Korea had only ~$25M there, but the damage spread as other banks stopped handling NK business. Officials plan to 'name names' on Russia this month; the question is whether they pick one connected-but-disposable institution. USTR Greer declined to commit to imposing the new measures.", "angle": "If a small bank or shipper gets named, the signal goes to every counterparty in the Russia energy chain — not the entity. Watch compliance behavior at mid-tier Gulf/Asian banks, not the SDN list itself.", "tweetA": "Banco Delta Asia held $25M of North Korean money and froze a whole country's access to dollar plumbing. If Treasury names one mid-sized Russia-linked bank this month, the sanctions aren't aimed at the bank. They're aimed at every bank watching.", "tweetB": "Everyone is modelling Russia sanctions as a volume question. The 2005 playbook says it's a counterparty-fear question. One credible example, and the compliance departments do the rest for free. Diesel cracks would notice first. $VLO", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-the-ideal-target-is-safe-to/"}, {"id": 7, "cat": "energy", "urgency": "deep", "source": "The Pressure Point (Fulcrum)", "title": "G7 agrees 50M-barrel diesel release after US export-ban threat; Trump holds off; Russia extends own diesel ban through October", "idea": "A proposal to release 50M barrels of diesel became a G7 agreement after Washington threatened to restrict US exports; Trump then held off on the ban over fears of knock-on gasoline price rises (refiners could shift mix). Russia extended its own diesel export ban through October. Author: leverage shown, but without a sacrificial target and without loading schedules the agreement fades.", "angle": "Diesel is the scarce molecule. Dates to watch: national release orders and Oct 31 Russia ban decision. Crack spreads are the market's read on whether the 50M barrels are real.", "tweetA": "50 million barrels sounds big until you remember Europe is short diesel and Russia just extended its own export ban. An agreement with no loading schedule is a press release. Watch cracks, not headlines. $VLO $MPC", "tweetB": "Washington threatened a diesel export ban, got an allied release, then backed off because it would've lifted US gasoline. That's the real constraint on US energy leverage: refiners can't produce one product in isolation.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-the-ideal-target-is-safe-to/"}, {"id": 8, "cat": "regulation", "urgency": "deep", "source": "The Pressure Point (Fulcrum)", "title": "Trump names DNI Jay Clayton AI czar to lead 'Super Intelligence Force'; voluntary safety standards signed", "idea": "Trump announced a 'Super Intelligence Force' led by a new AI czar after meetings with AI executives and the signing of voluntary safety standards. The brief flags the open question: does Clayton keep DNI and gain authority over agencies, accord participation, breaches or rulemaking?", "angle": "Whether the czar has rulemaking authority or just convening power determines if this is a market event for AI labs and chip exporters or a photo op. Intel-chief-as-AI-lead frames AI as a security asset.", "tweetA": "The AI czar is the sitting Director of National Intelligence. That tells you how this administration classifies frontier AI: not a technology policy, a national security one. Expect export controls and compute access to move through the intel community.", "tweetB": "Voluntary safety standards, a 'Super Intelligence Force', and a DNI in charge. The thing nobody has answered: does the czar get rulemaking power, or just a podium? That's the difference between a regulatory event and a headline. $NVDA $GOOGL", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-the-ideal-target-is-safe-to/"}, {"id": 9, "cat": "geopolitics", "urgency": "watch", "source": "The Pressure Point (Fulcrum)", "title": "Things happen: Fairford bombers withdrawn after planned terror attack; Russian drone hits Kyiv bridge during Merz visit; Wright on Iran war energy risks", "idea": "US Air Force returned all bombers from RAF Fairford after an investigation into a planned terror attack; a Russian drone struck Kyiv's Northern Bridge as Merz arrived on an unannounced visit; Energy Secretary Wright said Trump understood energy-flow risks before launching the Iran war; CBS poll has Democrats winning the House 229-206.", "angle": "Four unrelated stories, one pattern: security risk at allied infrastructure is rising simultaneously. Political risk premium for the midterms is also building.", "tweetA": "US bombers pulled out of a British base over a plot, a drone hitting a Kyiv bridge during a chancellor's visit, and the Energy Secretary conceding the Iran war's energy risk was known. The risk premium isn't in one place anymore.", "tweetB": "CBS has Democrats at 229-206 for the House if the vote were today. Add a Fed hiking into midterms and $103 oil. Markets haven't priced a divided-government scenario with a hawkish Warsh Fed.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-the-ideal-target-is-safe-to/"}, {"id": 10, "cat": "energy", "urgency": "deep", "source": "Speedrun (P Equity Research)", "title": "Persian Gulf crude exports hit 14M b/d for the first time since the Iran War began — yet Iran says Hormuz stays closed", "idea": "Persian Gulf exports passed 14M b/d last week, up 210%+ from ~4.5M b/d in March; the 4-week average of 14M is a 6-month high. Iran says Hormuz stays closed until the US meets seven conditions under the June Islamabad agreement, and denies offering inspections for sanctions relief. The author notes crude prices as if it is closed while no supply shock is visible.", "angle": "The physical flow data contradicts the political narrative. If barrels are moving, the $103 Brent is a risk premium that decays on a normalized flow — or the data is a lagging indicator of a new closure.", "tweetA": "Gulf exports at 14M b/d, up 210% from March lows. Iran says the strait is closed. Brent at $103 says the market believes Iran. One of these three numbers is wrong and I know which one has the better data.", "tweetB": "Either 14M b/d of barrels are lying or Iran's 'closed' is a negotiating position. If it's the latter, the oil premium is the cheapest short-term fade in the market. If it's not, tanker tracking is the first place it will show. $USO $XLE", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pequityresearch.substack.com/p/speedrun-upcoming-events-this-week-41f"}, {"id": 11, "cat": "macro", "urgency": "deep", "source": "Speedrun (P Equity Research)", "title": "Week ahead: FOMC minutes Wednesday Oct 7, consumer sentiment Friday Oct 9", "idea": "The week's calendar: FOMC minutes on Oct 7 (will they signal another hike in October?) and consumer sentiment Oct 9. Author is skeptical that consumers feel good about the economy.", "angle": "Minutes after a unanimous 12-0 hike and a 4.1% dot — look for how many wanted 50bp or an intermeeting posture. 10y/30y auctions land in the same week.", "tweetA": "Minutes Wednesday, 10y/30y auctions the same week, with a 10y near 5.2%. If the minutes lean hawkish and the auction tails, the equity Goldilocks story gets tested twice in 48 hours.", "tweetB": "Michigan sentiment Friday with oil at $103 and a Fed hiking. Consumers are paying for both. Watch the 5-10 year inflation expectations line, not the headline.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pequityresearch.substack.com/p/speedrun-upcoming-events-this-week-41f"}, {"id": 12, "cat": "macro", "urgency": "deep", "source": "SixSigmaCapital", "title": "Fed hiked 25bp to 3.75-4.00% in a 12-0 vote under Chair Warsh; median dot 4.1% for 2026, 16 of 18 expect another hike", "idea": "First hike since July 2023, unanimous at 12-0 after July's 9-3 split. Warsh: economy strengthened, inflation hasn't slowed, geopolitics intensified; above-target for 5+ years. Dots: 4.1% end-2026 (3.8% prior), 2027 4.1% (3.6%), 2028 3.9%, longer-run 3.2%. 2026 core PCE forecast 3.4%, GDP 2.3%, unemployment 4.1%. The 10y hit its highest level since 2002 this week before falling to ~5.2%.", "angle": "A Fed that hikes into a 29k payroll print and a 5.2% 10y has a different reaction function than the one priced in 2025. Terminal pricing and the long-run dot at 3.2% matter more than the next meeting.", "tweetA": "12-0. Hammack, Kashkari and Logan stopped dissenting because the hike came. Median dot now 4.1% in both 2026 and 2027. The Fed isn't pausing, it's re-anchoring higher. Longer-run at 3.2% is the quiet repricing of neutral.", "tweetB": "The 10y hit its highest since 2002 and the S&P is at 7,722. I keep coming back to this: the last time yields were here, the S&P was at 800.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://sixsigmaresearch.com/p/september-2026-portfolio-update-497"}, {"id": 13, "cat": "macro", "urgency": "deep", "source": "SixSigmaCapital", "title": "BEA methodology change cut core PCE to 3.0% — August beat partly an accounting artifact", "idea": "August core PCE 3.0% y/y vs 3.3% expected, headline 3.4% vs 3.7%. Much of the surprise comes from the BEA's September 30 methodology changes (investment advice, legal services, software prices, applied back to 2021), which also revised July's core PCE down to 3.0% from 3.3%. The Fed's SEP projections pre-date the change. Core CPI is 2.4% y/y; PPI 5.4%.", "angle": "Gap between core CPI at 2.4% and core PCE at 3.0% is unusual — PCE usually runs below. The statistical change is feeding the market's 'pause' narrative while PPI at 5.4% suggests pipeline pressure.", "tweetA": "The cool PCE print that pulled hike odds to 22% is partly the BEA changing how it measures software and legal services. Not inflation falling — a ruler change. The Fed's dots were written before it.", "tweetB": "Core PCE at 3.0% while core CPI is 2.4% and PPI is 5.4%. PCE is usually the lower one. When the Fed's preferred gauge runs above the one households feel, you get a very different reaction function.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://sixsigmaresearch.com/p/september-2026-portfolio-update-497"}, {"id": 14, "cat": "positioning", "urgency": "deep", "source": "SixSigmaCapital", "title": "Indices at all-time highs while only 21-25% of S&P stocks are above their 50-day — bull trap or powerful year-end rally", "idea": "S&P 500 at 7,722.72 (+12.6% YTD) and Nasdaq 27,190.86 (+17% YTD), yet the percentage of S&P stocks above their 50dma is 25% (author cites 21% recently, near April lows). Author's fork: bull trap before a sell-off, or if rates/oil ease even slightly, a powerful rally into year-end. S&P trades 19.8x forward; Nasdaq 23.87x.", "angle": "Narrow-breadth record highs concentrated in a handful of AI-capex names — same story as the rate-insensitivity item. Equal-weight vs cap-weight divergence is the trade.", "tweetA": "New highs in the index, 25% of members above their 50-day. It's 2021 and 1999 rhymes: the index is a handful of balance sheets. <10% breadth readings were buying opportunities; 25% is neither fear nor safety.", "tweetB": "Bull trap or rally into year-end, and the author's own answer is 'depends on oil and rates'. That's the honest answer. Which means the next two auctions and Brent matter more than earnings.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://sixsigmaresearch.com/p/september-2026-portfolio-update-497"}, {"id": 15, "cat": "positioning", "urgency": "deep", "source": "SixSigmaCapital", "title": "Sentiment gauges don't match record highs: NAAIM 77 (from 86), Fear & Greed 31, VIX 15.3, put/call 0.78", "idea": "NAAIM exposure 76.99 from 85.61 last month; CNN Fear & Greed at 31 ('Fear') vs 19 in March; VIX 15.31; put/call 0.78; 10y at 5.28 (+26% YTD); GBP 1.324 (-1.68% YTD). Portfolio is long with decent cash; trading account +71% YTD with DRAM and RKLB double-digit gains in September.", "angle": "Fear reading plus VIX at 15 with record highs: sentiment survey says defensive, options say complacent. The mix is a classic setup for a vol event around auctions/CPI Oct 14.", "tweetA": "VIX 15, Fear & Greed 31, indexes at records. Someone is wrong: surveys say fear, options say calm, price says up. When those three disagree it's usually the options market that gets repriced.", "tweetB": "NAAIM dropped from 86 to 77 while the Nasdaq rose 2% in September. Active managers de-risked into strength. That's fuel, not a warning.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://sixsigmaresearch.com/p/september-2026-portfolio-update-497"}, {"id": 16, "cat": "AI/infra", "urgency": "act", "source": "Big Price Moves Explained", "title": "Toshiba to double data-center HDD capacity by FY2027 — Seagate and Western Digital each fall ~10%", "idea": "Toshiba reportedly will invest ~¥60B ($380M) in the Philippines to double AI data-center HDD capacity by FY2027, with lines producing drives up to 40% denser; aims to lift share from ~10% of capacity to 30%. STX (+240% YTD before) fell 10.2% to $848.99; WDC (+170% YTD) fell 10.2% to $415.29. Data-center storage is 89% of WDC revenue; STX 2026 nearline sold out. Components (media, heads) remain the bottleneck.", "angle": "A $380M announcement erased roughly 10%. The market is repricing the duration of supply discipline, not near-term earnings. Third supplier to the duopoly is the thesis-breaker.", "tweetA": "$380M of Toshiba capex took 10% off Seagate and Western Digital in one session. That's not about next quarter, it's the market pricing the end of duopoly margins. Both were up 170-240% YTD on 'supply stays tight'.", "tweetB": "Who actually benefits if HDD supply loosens? Hyperscalers. The same capex that took STX and WDC down is a cost-per-terabyte win for the people buying the storage. Rotate within the AI chain, don't exit it. $STX $WDC", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-october-2026"}, {"id": 17, "cat": "culture", "urgency": "deep", "source": "Big Price Moves Explained", "title": "Nike guides FY27 revenue down high-single digits; Greater China -26% cc; Dunk revenue cut ~50%; Pace targets $2.5B savings", "idea": "Q1 revenue $11.2B (-5% cc), EPS $0.48 vs $0.43 expected; FY27 adj. EPS $1.15-1.35 vs $1.69 consensus. Greater China -26%, Converse -28%, Nike Direct -9%, Jordan down mid-teens, Sportswear low-double-digit decline; performance +HSD but only ~1/3 of revenue. Shares fell 3.6% to $33.87, down 81% since Dec 2021. DZ Bank cut to Sell, $28 PT; Wells sees EPS cuts ~25%.", "angle": "An 81% drawdown with a China -26% and deliberate wholesale/lifestyle shrinkage: the turnaround is a multi-year restructure, not a cycle. China consumer weakness shows in a global brand.", "tweetA": "Nike: down 81% since 2021, China -26%, Dunk revenue cut in half on purpose. The CEO's turnaround is working on running shoes (a third of revenue) and failing on lifestyle (the other two thirds). $NKE", "tweetB": "Greater China -26% at Nike while Nike-owned stores and partners haven't been refreshed in seven years. Brands that over-distribute in China and then try to pull back lose twice. Consumer-China is still not a trade.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-october-2026"}, {"id": 18, "cat": "culture", "urgency": "watch", "source": "Big Price Moves Explained", "title": "Lamb Weston +5.9% pre-earnings after a ~25% slide on restaurant traffic, potato supply concerns", "idea": "LW rose 5.9% to $43.60 ahead of Oct 6 earnings after falling ~25% since late August on weak restaurant traffic, potato crop concerns and doubts about the earnings recovery. Positioning described as depressed.", "angle": "Fry demand is a clean read-through on restaurant traffic and low-income consumer. Earnings Tuesday is the test.", "tweetA": "Lamb Weston is down 25% since August because people are eating out less, not because potatoes got more expensive. Restaurant traffic is the consumer data point nobody's tracking. $LW $MCD", "tweetB": "Fries as a macro indicator: if Lamb Weston guides down Tuesday, restaurant traffic is rolling over at the same time Fed hikes and oil are hitting lower-income households.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-october-2026"}, {"id": 19, "cat": "gold", "urgency": "watch", "source": "Robert Sinn", "title": "Charts of the Week: 'ugly week' for gold and miners as Treasury yields soar; uranium (Cameco) and junior setups for October", "idea": "Video edition: ugly week for gold and miners, Treasury yields soaring, silver at support; discusses Cameco, Talon Metals, Hercules Metals, Perseverance Metals, Bitterroot, Founders Metals, Gold Fields and Definium. Body is a video link with no text analysis.", "angle": "Gold selling off with real yields confirms the DSotB read that it's a passenger of the real-yield complex. Silver holding support while gold sinks is the relative signal.", "tweetA": "Gold's worst week since June, silver holding support. When silver outperforms in a gold drawdown, it's often the start of a base, not the end. $SLV $GLD $GFI", "tweetB": "Uranium juniors and Cameco in a week where the 10y made 2002 highs. The nuclear trade is holding up against the rates shock, a rate-insensitive one-off or the new regime? $CCJ", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://robertsinn.substack.com/p/the-charts-of-the-week-video-edition"}];
const META = {"date": "2026-10-05", "time": "03:10 CEST", "windowStart": "2026-10-04 21:10 CEST", "windowEnd": "2026-10-05 03:10 CEST", "emailsInWindow": 10, "emailsRead": 8, "itemsExtracted": 19, "includedSources": ["Dark Side of the Boom (5)", "The Pressure Point (Fulcrum) (4)", "Speedrun (P Equity Research) (2)", "SixSigmaCapital (4)", "Big Price Moves Explained (3)", "Robert Sinn (1)"], "skippedSources": ["P Equity Research — '5 Days Left | Discord Access' (promo discount offer)", "TopDown Charts — 'Big Announcement' (promo: Q4 subscription offer)", "SixSigmaCapital — subscriber chat thread (promo/giveaway; points to portfolio update, which was read)", "Seven c Newsletter #188 — read; headings only (link roundups with no body text, e.g. 'Bitcoin or Anthropic IPO?')", "TMAD Weekly (19:09:09Z / 21:09 CEST) — excluded: 2 minutes before cutoff"]};
var COL={macro:'#e24b4a',credit:'#378add',positioning:'#ef9f27','AI/infra':'#1d9e75',crypto:'#7f77dd',geopolitics:'#d85a30',energy:'#f97316',tech:'#06b6d4',gold:'#d4a017',culture:'#ec4899',labor:'#8b5cf6',regulation:'#64748b',science:'#14b8a6',venture:'#84cc16'};
var UE={act:'🔴',deep:'🔵',watch:'🟡'};
var fc='all',fu='all',fs=null;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function pill(label,on,color,fn){return '<span class="pill'+(on?' on':'')+'" style="'+(on?'background:'+color:'')+'" onclick="'+fn+'">'+label+'</span>';}
function bars(){
  var cats=[];ITEMS.forEach(function(i){if(cats.indexOf(i.cat)<0)cats.push(i.cat);});
  var h=pill('All ('+ITEMS.length+')',fc==='all',"#333","setC('all')");
  cats.forEach(function(c){var n=ITEMS.filter(function(i){return i.cat===c}).length;h+=pill(c+' ('+n+')',fc===c,COL[c],"setC('"+c+"')");});
  document.getElementById('cats').innerHTML=h;
  var u=pill('All',fu==='all',"#333","setU('all')");
  [['act','🔴 Act Now'],['deep','🔵 Deep'],['watch','🟡 Watch']].forEach(function(x){var n=ITEMS.filter(function(i){return i.urgency===x[0]}).length;u+=pill(x[1]+' ('+n+')',fu===x[0],"#333","setU('"+x[0]+"')");});
  document.getElementById('urg').innerHTML=u;
}
function setC(c){fc=c;fs=null;render();}
function setU(u){fu=u;fs=null;render();}
function filterBySrc(name){fs=name;fc='all';fu='all';render(true);}
function tog(id){var e=document.getElementById('c'+id);e.className=e.className.indexOf('open')>=0?'card':'card open';}
function render(expand){
  bars();var h='';
  ITEMS.forEach(function(it){
    if(fc!=='all'&&it.cat!==fc)return;if(fu!=='all'&&it.urgency!==fu)return;
    if(fs&&it.source.indexOf(fs)<0)return;
    var col=COL[it.cat]||'#888';
    h+='<div class="card'+(expand&&fs?' open':'')+'" id="c'+it.id+'"><div class="hd" onclick="tog('+it.id+')"><span class="num">#'+it.id+'</span><span>'+UE[it.urgency]+'</span><span class="src" style="background:'+col+'">'+esc(it.source)+'</span><span class="tag">'+it.cat+'</span>'+(it.charts.hot?'<span>🔥</span>':(it.charts.desc?'<span>📊</span>':''))+'<span class="ttl">'+esc(it.title)+'</span></div><div class="body">'
    +'<div class="lbl">The Idea</div><div>'+esc(it.idea)+'</div>'
    +'<div class="lbl">My Angle</div><div class="angle" style="border-color:'+col+';background:'+col+'14">'+esc(it.angle)+'</div>'
    +'<div class="lbl">Tweets</div><div class="tw"><div><b style="color:#378add;font-size:11px">TWEET A</b><br>'+esc(it.tweetA)+'<br><button class="copy-btn" onclick="copyTweet('+it.id+',\'a\')">📋 Copy</button></div>'
    +'<div><b style="color:#7f77dd;font-size:11px">TWEET B</b><br>'+esc(it.tweetB)+'<br><button class="copy-btn" onclick="copyTweet('+it.id+',\'b\')">📋 Copy</button></div></div>'
    +(it.charts.desc?'<div class="chart'+(it.charts.hot?' hot':'')+'">'+(it.charts.hot?'🔥 CHART WORTH SAVING — ':'')+esc(it.charts.desc)+'</div>':'')
    +'<div style="margin-top:10px"><a href="'+it.link+'" target="_blank">↗ Read full article</a></div></div></div>';
  });
  document.getElementById('list').innerHTML=h||'<p>No items.</p>';
}
function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';
  var r='<p><b>Window:</b> '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</p><p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</p><p><b>Included sources</b> (click to filter):<br>';
  META.includedSources.forEach(function(s){var n=s.replace(/ \(\d+\)$/,'');r+='<span class="s" data-n="'+esc(n)+'" onclick="filterBySrc(this.getAttribute(\'data-n\'))">'+esc(s)+'</span><br>';});
  r+='</p><p><b>Skipped:</b><br>'+META.skippedSources.map(esc).join('<br>')+'</p>';
  document.getElementById('rb').innerHTML=r;render();
}
init();
</script></body></html>
