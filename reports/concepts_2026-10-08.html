: false}]}, {"theme": "China's long game", "insights": [{"claim": "Technology contests between great powers are won by diffusion rather than invention, and the US leads at the frontier but has thought less about diffusion.", "speaker": "SIMON CURTIS AND IAN KLAUS", "type": "framework", "entities": ["Jeffrey Ding", "United States", "China"], "conviction": "high", "so_what": "Favor adopters and builders of infrastructure over pure frontier-tech leaders in the long run.", "quote": null, "locator": "Grand Strategy & Scale", "quote_verified": false}, {"claim": "China's Belt and Road, now 13 years old, builds ports, rail, fiber, energy transmission and smart cities to carry resources, goods and influence toward China, and its 15th Five-Year Plan doubles down on state planning for technology, infrastructure and critical supply chains.", "speaker": "SIMON CURTIS AND IAN KLAUS", "type": "data_point", "entities": ["Belt and Road Initiative", "15th Five-Year Plan", "China"], "conviction": "high", "so_what": "Chinese state-directed infrastructure is the structural driver of its supply-chain control.", "quote": null, "locator": "Grand Strategy & Scale", "quote_verified": false}, {"claim": "China has significant control over critical supply chains including processed rare earths, batteries and robotics, and its opening of AI models to international partners worries Silicon Valley's closed-source labs.", "speaker": "SIMON CURTIS AND IAN KLAUS", "type": "data_point", "entities": ["China", "rare earths", "AI models", "Silicon Valley"], "conviction": "medium", "so_what": "Open Chinese AI models could win global adoption and undermine proprietary US models.", "quote": null, "locator": "Grand Strategy & Scale", "quote_verified": false}, {"claim": "Rush Doshi's review of three decades of Chinese documents found a remarkably consistent long-term effort to blunt and eventually displace US dominance, accelerating under Xi.", "speaker": "SIMON CURTIS AND IAN KLAUS", "type": "anecdote", "ent rediction", "entities": ["Strategic Investment Fund"], "conviction": "low", "so_what": "Possible future vehicle for infrastructure financing.", "quote": null, "locator": "In Search Of Time Future", "quote_verified": false}, {"claim": "Gavin Newsom's 'AI New Deal' ideas, including worker safety nets and 'universal basic capital', may signal a post-Trump Democratic direction if he gains the 2028 nomination.", "speaker": "SIMON CURTIS AND IAN KLAUS", "type": "prediction", "entities": ["Gavin Newsom", "AI New Deal", "universal basic capital"], "conviction": "low", "so_what": "AI labor displacement policy is likely a 2028 campaign theme.", "quote": null, "locator": "In Search Of Time Future", "quote_verified": false}, {"claim": "The Lobito Trans-Africa Corridor, a G7 PGII flagship linking Angola's port to Congo and Zambia critical-minerals regions, showed the US copying China's corridor playbook with private finance, before the approach was abandoned under the new administration.", "speaker": "SIMON CURTIS AND IAN KLAUS", "type": "data_point", "entities": ["Lobito Corridor", "PGII", "Angola", "DRC", "Zambia"], "conviction": "medium", "so_what": "US critical-minerals corridor investment has lost policy support.", "quote": null, "locator": "In Search Of Time Future", "quote_verified": false}, {"claim": "Trump treats alliances as zero-sum, which threatens to deny the US the transnational scale needed to compete with China if allies turn away.", "speaker": "SIMON CURTIS AND IAN KLAUS", "type": "causal", "entities": ["Trump administration", "US alliances"], "conviction": "medium", "so_what": "Alliance erosion raises supply-chain and geopolitical risk for US positioning.", "quote": null, "locator": "In Search Of Time Future", "quote_verified": false}]}], "insight_total": 15, "top_entities": ["United States", "China", "Belt and Road Initiative", "Jake Sullivan", "Rush Doshi", "Gavin Newsom", "Lobito Corridor", "abundance agenda"], "source_meta": {"author": "SIMON CURTIS AND IAN s", "entities": ["Federal Reserve"], "conviction": "high", "so_what": "Aggregate investment reaction to Fed moves depends on how many firms are in the sensitive tail at the time.", "quote": null, "locator": "Intro paragraph", "quote_verified": false}]}, {"theme": "Who is sensitive", "insights": [{"claim": "Most variation in firms' sensitivity to rate surprises is within firms over time, so a firm can respond strongly in one quarter and little in the next quarters.", "speaker": "Thomas Drechsel", "type": "causal", "entities": ["US firms"], "conviction": "high", "so_what": "Sensitivity is transient; hard to screen stocks by durable rate sensitivity.", "quote": null, "locator": "Which Firms Respond the Most?", "quote_verified": false}, {"claim": "Small and young firms cut investment the most after a monetary tightening, and firms with shorter debt maturity are also more sensitive.", "speaker": "Thomas Drechsel", "type": "data_point", "entities": ["small firms", "young firms", "debt maturity"], "conviction": "high", "so_what": "Small-cap and young-firm capex is the most exposed to Fed hikes.", "quote": null, "locator": "Which Firms Respond the Most?", "quote_verified": false}, {"claim": "Firms reporting more optimism cut investment less after a rate hike, and perceived discount rates correlate with responsiveness, pointing to behavioral mechanisms; much of the variation stays unexplained.", "speaker": "Thomas Drechsel", "type": "causal", "entities": ["firm expectations"], "conviction": "medium", "so_what": "Expectations and sentiment shape transmission beyond balance-sheet traits.", "quote": null, "locator": "Which Firms Respond the Most?", "quote_verified": false}]}], "insight_total": 6, "top_entities": ["monetary policy", "Federal Reserve", "Compustat", "small firms", "young firms", "New York Fed"], "source_meta": {"author": "Thomas Drechsel", "word_count": 1487, "paywalled": false}}, {"record_id": "5b3c16e93d54958d", "source_type": "concepts", "source_name": "Oxford ines won't necessarily see the most development.", "speaker": "Adric Kam", "type": "causal", "entities": ["data centres", "construction labour"], "conviction": "medium", "so_what": "Construction cost inflation and delays are likely where pipelines concentrate.", "quote": null, "locator": "The infrastructure challenge extends beyond power", "quote_verified": false}, {"claim": "Buildings last decades while servers are replaced far more often, so the current cycle is construction-intensive and over time more investment shifts to technology replacement.", "speaker": "Adric Kam", "type": "framework", "entities": ["data centres", "servers"], "conviction": "medium", "so_what": "Construction demand is front-loaded; long-term capex is not an equal construction pipeline.", "quote": null, "locator": "Headline CAPEX is not the same", "quote_verified": false}]}], "insight_total": 7, "top_entities": ["Australia", "data centres", "Oxford Economics Australia", "AEMO", "electricity infrastructure", "AI"], "source_meta": {"author": "Adric Kam", "word_count": 1115, "paywalled": false}}, {"record_id": "bf985658f326d439", "source_type": "concepts", "source_name": "Oxford Economics", "source_url": "https://www.oxfordeconomics.com/resource/assessing-the-implications-of-inheritance-tax-reforms-in-the-uk/", "title": "Assessing the Implications of Inheritance Tax Reforms in the UK", "published_date": "2026-10-07", "language": "en", "processed_at": "2026-10-08T11:14:40Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Society"], "gist": "Oxford Economics, for Onward, models UK inheritance tax reforms: liabilities hit a record £7.0bn in 2023/24 and reach £12.6bn by 2029/30 with no change; higher nil-rate bands would cut scope sharply at a revenue cost.", "themes": [{"theme": "IHT trajectory and scope", "insights": [{"claim": "UK inheritance tax liabilities reached a record £7.0 billion in 2023/24 and 4.7% of estates paid it, the highest share since the mid-2000s.", "speaker": "Suki Ma ing was oddly progressive: classics took at least half of teaching hours, science was resisted, classroom time was modest, and sports could fill ten to twenty hours a week.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["Eton", "Rugby School", "Thomas Arnold", "Victorian elite"], "conviction": "high", "so_what": "Counterexample to the view that elite success needs STEM-heavy, hours-heavy education.", "quote": null, "locator": "School", "quote_verified": false}, {"claim": "Victorian public schools sent boys to board by about age eight, and student self-government via prefects was designed to teach leadership, helping produce an elite with no strong subnational loyalties.", "speaker": "WorksInProgMag", "type": "causal", "entities": ["public schools", "prefect system"], "conviction": "medium", "so_what": "Early shared peer formation built elite cohesion and loyalty.", "quote": null, "locator": "School", "quote_verified": false}, {"claim": "Eton alone supplied about 30% of nineteenth-century cabinet ministers and 40% of prime ministers.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["Eton College"], "conviction": "high", "so_what": "Illustrates extreme concentration of elite formation in a few institutions.", "quote": null, "locator": "School", "quote_verified": false}, {"claim": "Oxbridge admitted almost every applicant, most students in the early Victorian period took easy 'pass' degrees, and only 8.1% of honors degrees in 1855–60 and 13.7% in 1910–14 went to science students.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["Oxford", "Cambridge", "Benjamin Jowett"], "conviction": "high", "so_what": "Elite formation prioritized moral and social training over technical skill.", "quote": null, "locator": "University", "quote_verified": false}]}, {"theme": "Soft skills and networking as work", "insights": [{"claim": "Elite Victorians spent only about four or five hours a day on clear office work, but balls, dinners and clubs gave access to information on jobs, investments and secret political decisions, effectively fusing personal and professional life.", "speaker": "WorksInProgMag", "type": "thesis", "entities": ["Victorian elite", "the Season", "Leonore Davidoff"], "conviction": "high", "so_what": "Dense in-person networking can be a productive substitute for long working hours.", "quote": "access to a vast information network: information about jobs, investment possibilities, secret political decisions", "locator": "Adulthood", "quote_verified": true}, {"claim": "For about five months a year the elite congregated in Mayfair and Belgravia, within half an hour's walk of one another, in the London Season that coincided with Parliament, mixing political networking with matchmaking.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["London Season", "Mayfair", "Belgravia", "Parliament"], "conviction": "medium", "so_what": "Geographic concentration supports elite coordination.", "quote": null, "locator": "Adulthood", "quote_verified": false}, {"claim": "Society balls functioned as both teenage house party and business networking convention, mixing ages and sexes, which was unlike many segregated events.", "speaker": "WorksInProgMag", "type": "framework", "entities": ["Victorian balls"], "conviction": "low", "so_what": "Social settings that mix generations and functions expand network reach.", "quote": "it was both a teenage house party and a business networking convention", "locator": "Adulthood", "quote_verified": true}]}, {"theme": "Elite as village (Gemeinschaft)", "insights": [{"claim": "The Victorian elite functioned as a little Gemeinschaft, an intimate community bound by shared culture, memory, status competition and love, atop a large Gesellschaft, and this may have outweighed the opportunity cost of low working hours.", "speaker": "WorksInProgMag", "type": "thesis", "entities": ["Ferdinand Tönnies", "Victorian elite"], "conviction": "medium", "so_what": "Cohesive elite communities may produce coordination benefits that don't show in hours worked.", "quote": null, "locator": "Method in their madness?", "quote_verified": false}, {"claim": "Folding landed aristocrats, bourgeois and Nonconformists into one British elite, except for Irish Catholics, avoided the hostile counter-elites that produced the American Civil War and strife in Spain, Italy, France and Germany.", "speaker": "WorksInProgMag", "type": "causal", "entities": ["Britain", "United States", "Germany"], "conviction": "medium", "so_what": "Elite unity is a stability factor for political order.", "quote": null, "locator": "Method in their madness?", "quote_verified": false}, {"claim": "Prestige-based reward let Britain fill unpaid local government roles and Parliament, where candidates bore about £150,000 to £450,000 in election costs in today's money, without difficulty, unlike modern states that struggle to pay public servants competitively.", "speaker": "WorksInProgMag", "type": "contrarian", "entities": ["Parliament", "MPs", "local government"], "conviction": "medium", "so_what": "Status can substitute for pay, but only within a tight community.", "quote": null, "locator": "Method in their madness?", "quote_verified": false}, {"claim": "Tight membership of one community may have reduced divisiveness and brinkmanship because elites could punish defection from norms, as Bagehot suggested English politicians rarely acted against England's interest.", "speaker": "WorksInProgMag", "type": "thesis", "entities": ["Walter Bagehot", "British politicians"], "conviction": "low", "so_what": "Norm enforcement by social ties can lower political polarization.", "quote": null, "locator": "Method in their madness?", "quote_verified": false}]}], "insight_total": 11, "top_entities": ["Victorian Britain", "Eton", "Oxford", "Cambridge", "London Season", "Thomas Arnold", "Walter Bagehot", "Ferdinand Tönnies"], "source_meta": {"author": "WorksInProgMag", "word_count": 5607, "payw // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
