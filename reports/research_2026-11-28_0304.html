<script>
const ITEMS = [{"id": 1, "cat": "energy", "urgency": "deep", "source": "Commodity Context / Rory Johnston", "title": "Brent ran $88 to $98 in three days, and the fuel was short-covering more than headlines", "idea": "Brent finished the week near $95.50 (+$3), but it swung $10/bbl from Tuesday's $88 low to Friday morning's $98 high. Johnston credits the bounce mostly to heavily depressed speculative positioning, which ICE data confirms, rather than news. His read is that positioning risk is 'likely still bullish' even after the squeeze.", "angle": "When a $10 move comes from positioning, the next leg depends on CFTC data, and CFTC is delayed to Monday. Shorts who survived this week still have to cover. It reads as a mechanical setup into December.", "tweetA": "Brent ran $10 in three sessions on a week of 'peace headlines'. That was shorts running for the door, not a fundamental story. The positioning data that would show how many are left is out Monday. $BNO $XLE", "tweetB": "Oil and equities had the same week: a crowded short gets squeezed on thin holiday volume. The difference is that oil still has an Iranian shipping attack every day. Spec-short crude into a live supply war is a strange place to be. $USO", "charts": {"count": 1, "hot": false, "desc": "Free chart: Brent flat price and timespreads for the week. Full positioning deck delayed to Monday."}, "link": "https://www.commoditycontext.com/p/ocw48w26"}, {"id": 2, "cat": "energy", "urgency": "watch", "source": "Commodity Context / Rory Johnston", "title": "Brent prompt spreads more than doubled their backwardation; physical premia flipped positive for the first time this month", "idea": "WTI and Dubai timespreads firmed modestly, but Brent prompt spreads and DFLs more than doubled their backwardation before easing slightly on Friday. The cause is local: outages at a key North Sea field. Physical Brent premia went back above zero for the first time in November.", "angle": "A Brent-specific squeeze widens Brent–WTI and Brent–Dubai and favours US export barrels. Flat price is noise here. The spread structure is where the signal is.", "tweetA": "Most people watch flat price. This week the move was in structure: Brent backwardation doubled while WTI and Dubai barely moved. A North Sea outage is now pricing the global benchmark. That's a Brent–WTI widener, not a macro call.", "tweetB": "Physical Brent premia were negative for most of November, in the middle of a war. They just flipped positive. When paper and physical disagree, physical usually wins.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening (spreads/DFL panels in the paid section)"}, "link": "https://www.commoditycontext.com/p/ocw48w26"}, {"id": 3, "cat": "energy", "urgency": "deep", "source": "Commodity Context / Rory Johnston", "title": "ARA diesel posted its second-largest draw on record; stocks at the lowest seasonal level of the war", "idea": "European ARA hub stocks of diesel and gasoil printed their second-largest weekly draw on record. That leaves the key industrial fuel at its lowest seasonal level since the war began. US stocks also fell, on NGL and SPR draws.", "angle": "Europe goes into winter with diesel tanks at war lows, while NYH diesel cracks just fell $10. One of those two signals is wrong. Diesel is the fuel most exposed to Hormuz disruption.", "tweetA": "Record-scale ARA diesel draw, lowest stocks of the war, and diesel cracks just fell $10/bbl. Either the crack is leading a recovery in exports, or it's about to snap back hard. Winter starts next week.", "tweetB": "The SPR is still being drawn to keep US inventories looking fine. A strategic reserve used as a price tool in year two of a supply war has less room left each month.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.commoditycontext.com/p/ocw48w26"}, {"id": 4, "cat": "energy", "urgency": "deep", "source": "Commodity Context / Rory Johnston", "title": "NYH gasoline crack at $6/bbl, diesel crack down $10 to about $60: too much of one fuel, too little of the other", "idea": "New York Harbor gasoline cracks fell as low as $6/bbl over Brent, and diesel cracks lost another $10 to end around $60. The market is long gasoline and short diesel. Johnston thinks the diesel crack selloff now runs ahead of a slow, volatile recovery in diesel exports.", "angle": "A $54 gap between diesel and gasoline cracks is extreme. Refiners optimise yields toward distillate, which pushes even more gasoline into a glutted market. Refiner margins depend on how heavy the slate is.", "tweetA": "Gasoline cracks at $6. Diesel at $60. Refiners are paid 10x more for the middle of the barrel than the top. Expect distillate-max runs and more surplus gasoline, so a gasoline glut is already baked in for spring. $VLO $PBF", "tweetB": "Diesel cracks just dropped $10 while European diesel stocks hit war lows. Johnston thinks the crack is ahead of the physical. I'd treat that as a dip in the one product the war actually made scarce.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.commoditycontext.com/p/ocw48w26"}, {"id": 5, "cat": "geopolitics", "urgency": "watch", "source": "Commodity Context / Rory Johnston", "title": "OPEC capacity re-estimation talks this weekend as Washington tries to crack the group; about one Iranian shipping attack a day", "idea": "OPEC heads into contentious production-capacity re-estimation talks this weekend, with unity weakened and Washington actively trying to split the group. Meanwhile, roughly one Iranian attack on shipping per day keeps Hormuz flows under pressure.", "angle": "Capacity baselines decide future quotas. If US pressure breaks the re-estimation, the cartel's ability to manage price after the war weakens. That is bearish in the long run, even if the war keeps it bullish now.", "tweetA": "This weekend OPEC decides how much capacity each member is 'allowed' to claim, while the US tries to pull members away. The war is the short-term oil story. Cartel cohesion after the war is the 2027 story.", "tweetB": "One Iranian shipping attack a day has become background noise. Markets price constant risk as zero risk until the day it isn't.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.commoditycontext.com/p/ocw48w26"}, {"id": 6, "cat": "positioning", "urgency": "deep", "source": "The Dark Side of the Boom — The Weekender", "title": "Near-bear-market to best week since April 2025: S&P +19-month-high weekly gain on below-average volume", "idea": "The Nasdaq briefly entered a bear market and turned negative for 2026 on Wednesday. It then rallied into the S&P 500's strongest week in 19 months, with the Nasdaq 100 up another 2.6% on Friday. Turnover was below average all week, and equity funds had their largest outflows in 14 months during the rally.", "angle": "Price up, flows out, volume down: a classic short-covering signature. The test is the first full-participation week (payrolls, Huang testimony, the Dec 9 FOMC).", "tweetA": "Best S&P week in 19 months. Largest equity fund outflows in 14 months. Same week. When the money leaves while the price rises, the shorts did the buying, and they are done buying now.", "tweetB": "Goldman's Panic Index hit a record the Friday before. A week later the S&P had its best week since April 2025. Panic gauges at extremes are contrarian, until they aren't. Thin holiday volume makes this one hard to trust.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/the-weekender-wall-streets-great"}, {"id": 7, "cat": "positioning", "urgency": "watch", "source": "The Dark Side of the Boom — The Weekender", "title": "Wednesday 11:15 ET: the dollar sold off, the yen jumped, and 30 minutes later the Nasdaq ripped 3% in a straight line", "idea": "With the Nasdaq down about 4.7% and through its bear-market line, the dollar dropped suddenly at about 11:15 a.m. NY and the yen jumped. Roughly half an hour later equities rallied about 3% in a straight line, with gold and crypto joining. Theories included the SpaceX orbital data-centre approval and a Burry put sale. Goldman's desk said the only good explanation was supply drying up, and the footprint looks like derivative desks unwinding pre-Thanksgiving hedges.", "angle": "An FX move that comes first and leads equities by 30 minutes looks like a macro or official actor, not stock pickers. Whoever it was, the reflex now exists.", "tweetA": "Dollar down and yen up first, then 30 minutes later a 3% straight-line rip in the Nasdaq. That isn't dip-buyers. Somebody was positioned in FX before equities moved. Worth remembering the timestamp.", "tweetB": "'Nobody left at the sell window' is the best description of Wednesday. A bear-market break doesn't need buyers to reverse. It needs sellers to stop. That's a bounce, not a bottom.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-weekender-wall-streets-great"}, {"id": 8, "cat": "geopolitics", "urgency": "deep", "source": "The Dark Side of the Boom — The Weekender", "title": "Beijing calls in the national team by name at lunch: STAR 50 +15%, ChiNext +11.6%, CSI 300 best day in 2+ years", "idea": "With Chinese stocks at 16-month lows, the State Council issued a rare midday statement naming the national team. Central Huijin was told to provide liquidity guarantees. STAR 50 jumped about 15%, ChiNext 11.6% and CSI 300 nearly 4%, and afternoon turnover more than doubled to RMB1.1T. Margin requirements had already been cut from 100% to 80% the weekend before. Backdrop: consumer loans contracted RMB1.6T in 9M26, more than 3x all of 2025.", "angle": "Consumer credit is shrinking at 3x last year's pace, and the state is now a counterparty to equity selling. That looks like 2015 again: a policy floor without a private bid. Trade the squeeze, not the recovery.", "tweetA": "China's consumer loans shrank RMB1.6T in nine months, 3x all of 2025. Beijing's answer is a 15% one-afternoon rally in STAR 50. The state can buy stocks. It can't make households borrow. $FXI $KWEB", "tweetB": "Timing as policy: a statement at lunch, before the afternoon session, rather than on a weekend. Beijing has learned that a delay lets the market fade the message. Compare 2015, when the national team bought for months and the index still fell 40%.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-weekender-wall-streets-great"}, {"id": 9, "cat": "geopolitics", "urgency": "deep", "source": "The Dark Side of the Boom — The Weekender", "title": "Seoul's market stabilization fund is W10.7T (about $8B), less than 0.3% of Kospi market cap, and the market tested it immediately", "idea": "Three days after Seoul said it would activate its stabilization fund for the first time since Lehman, the Kospi fell another 6.2%. Samsung lost 9.9% and SK Hynix 11.1%. At W10.7T the fund is under 0.3% of market cap, so KDB is asking brokers, banks and insurers how much more they can add.", "angle": "A backstop that looks too small invites selling. Korea is effectively the memory-cycle ETF, so a weak backstop leaves Samsung and Hynix exposed to every AI-credit headline.", "tweetA": "Korea announced its first stabilization fund since Lehman. The size is $8B against a market where Samsung alone moved ~10% in a day. A backstop under 0.3% of market cap tells shorts exactly how much they need to outsize it. $EWY", "tweetB": "SK Hynix -11% in a day while Parekh's memory makers say they're sold out through 2028. Either the market is pricing a capex bust, or Hynix has become the cheapest way to own RAMageddon.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-weekender-wall-streets-great"}, {"id": 10, "cat": "AI/infra", "urgency": "act", "source": "The Dark Side of the Boom — The Weekender", "title": "Anthropic fell below its $83 IPO price; Nvidia CDS hit a record while the stock bounced on Huang's return", "idea": "Tuesday brought another semis drawdown: Anthropic slipped below its $83 IPO price, AI credit spreads kept widening, Nvidia CDS hit a record and S&P threatened a downgrade. That came after the White House reportedly leaned on Nvidia's board to reinstate Jensen Huang, and Trump floated a Huang pardon alongside a new tariff wall.", "angle": "Equity got a political put; credit did not. When the stock rises while CDS widens, the debt holders are pricing something the equity holders aren't.", "tweetA": "Washington can reinstate a CEO. It can't tighten a CDS spread. The Trump put now covers Nvidia equity, and the credit desk is pricing what it doesn't cover. $NVDA", "tweetB": "Anthropic below its IPO price, SpaceX below its IPO price, SK Hynix below its IPO price. 2026's three marquee listings are all underwater. That tells you more about the IPO window for 2027 than any banker deck.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-weekender-wall-streets-great"}, {"id": 11, "cat": "macro", "urgency": "deep", "source": "The Dark Side of the Boom — The Weekender", "title": "Core PCE at a three-year high, GDP revised to 4.3%, and the market still expects a Dec 9 hike", "idea": "Core PCE inflation hit a three-year high, Q3 GDP was revised up to 4.3%, and money markets still give high odds to a hike on December 9. Treasury yields finished the week higher as oil rose and risk sentiment recovered. Gold and the dollar gained; bitcoin fell.", "angle": "The stronger the equity rebound, the less reason the Fed has to blink. The rally lowers the odds of its own rescue.", "tweetA": "GDP at 4.3%, core PCE at a 3-year high, a Fed hike next week. And the market just had its best week in 19 months. The equity rebound is removing the Fed's reason to pause. $TLT", "tweetB": "Gold up, dollar up, BTC down in the same week. If BTC were the 'digital gold' hedge it couldn't diverge from both. In a hiking cycle it's trading like a liquidity asset.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-weekender-wall-streets-great"}, {"id": 12, "cat": "credit", "urgency": "deep", "source": "AI Rapid Fire Daily / Michael Parekh — ARD #216", "title": "Nvidia 5Y CDS at about 147bp, up from about 40bp in June; $118B in customer guarantees, including $105B for one campus", "idea": "S&P put Nvidia's AA on CreditWatch negative, with a one-notch cut likely within 90 days, and cut its governance modifier to neutral. Moody's affirmed Aa1 but moved the outlook to stable. Five-year CDS hit about 147bp intraday, so insuring $10M now costs $147K a year versus $40K. Nvidia's customer guarantees topped $118B at quarter-end, including $105B of credit support for a single data-centre campus. It sold $25B of bonds in June, its first in five years.", "angle": "Nvidia is the AI build-out's banker, and the banker's credit is under review. $105B behind one campus is concentration risk no AA balance sheet usually carries. Every neocloud whose financing depends on Nvidia's backstop is repriced with it.", "tweetA": "$105B of Nvidia credit support behind ONE data-centre campus. That's more than the market cap of most S&P 500 companies, in a guarantee. The 147bp CDS is pricing contingent liabilities, not governance. $NVDA", "tweetB": "Nvidia CDS went from 40bp to 147bp in five months. 147bp is roughly where BBB names trade, on an AA issuer. The ratings haven't caught up with the market, and S&P just said they're about to.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/turning-trends-into-friends-in-ai"}, {"id": 13, "cat": "regulation", "urgency": "watch", "source": "AI Rapid Fire Daily / Michael Parekh — ARD #216", "title": "Congress's 2027 AI agenda: chip export controls in the NDAA, mandatory model audits, and a proposed ban on self-improving AI", "idea": "Lawmakers want to attach China chip export controls to the year-end defense bill (Anthropic supports this). The wider agenda includes mandatory AI model audits, data-centre rules, a proposed ban on AI models that improve themselves, and a bipartisan House safety bill. Senate Democrats are drafting comprehensive legislation for January, some want a dedicated AI committee, and Huang testifies next week. This follows a midterm with voter backlash against AI.", "angle": "A statutory ban on self-improving models would be the first capability-level restriction anywhere. The NDAA rider is the near-term vehicle; everything else is 2027 noise.", "tweetA": "A proposed US ban on 'AI models that improve themselves' is in the 2027 Congressional mix. Every frontier lab is racing toward automated AI research, and Congress wants to make that illegal. Watch how 'improve' gets defined.", "tweetB": "The real AI bill this year is the defense bill. Chip export controls ride the NDAA because nothing else passes. Huang testifies the week after S&P puts Nvidia on watch. Bad timing for the lobby. $NVDA $AMD", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/turning-trends-into-friends-in-ai"}, {"id": 14, "cat": "venture", "urgency": "deep", "source": "AI Rapid Fire Daily / Michael Parekh — ARD #216", "title": "Bankers monetise volatility: IonQ raised $2B at a 15% PREMIUM using warrants; SPACs are back with 9 deals in Oct–Nov", "idea": "With SpaceX, Anthropic and SK Hynix trading below their IPO prices, bankers are reaching for other tools. IonQ raised $2B in mid-October at a 15% premium, with warrants struck at double the pre-offering price. At-the-market sales are no longer stigmatised. Five companies went public via SPAC in October and four so far in November, including Agility Robotics. Private credit is chasing Scandinavian deals.", "angle": "Warrants and SPACs coming back during a drawdown is a late-cycle tell. Issuers are paying in future dilution to avoid pricing today. Count warrant overhang when valuing 2026 issuers.", "tweetA": "IonQ sold stock at a 15% premium, but only by attaching warrants at 2x. That isn't a premium. It's a discount paid in future dilution. When this structure spreads, the issuance cycle is late. $IONQ", "tweetB": "Nine SPAC listings in two months, including a humanoid robot company, while the year's three biggest IPOs trade underwater. 2021 had the same pattern. The market for the cleanest assets shuts first, the wrapper market opens last.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/turning-trends-into-friends-in-ai"}, {"id": 15, "cat": "tech", "urgency": "deep", "source": "AI Rapid Fire Daily / Michael Parekh — ARD #216", "title": "RAMageddon at retail: US smartphone shipments -9% in Q3; Apple share jumps to 57% from 50%; Pixel 11 Pro XL ships with LESS memory for $100 more", "idea": "Counterpoint: US smartphone shipments fell 9% YoY in Q3 as memory costs squeezed Android, and Apple's share rose to 57% from 50%. Google's Pixel 11 Pro XL has 12GB of memory, down from 16GB, at $100 more. The WSJ expects peak discounts of about 30% again, but off higher list prices. Memory makers say they're sold out through 2028.", "angle": "Memory scarcity is a hidden moat for whoever has supply contracts. Apple's procurement scale is now taking share from Android. Memory shrinkflation in consumer devices is effectively an AI tax on consumers.", "tweetA": "Google just shipped a flagship phone with 25% less RAM for $100 more. That's memory inflation hitting consumers. AI data centres outbid your phone, and Apple's supply contracts are winning share. $AAPL $MU", "tweetB": "Apple went from 50% to 57% US share in one quarter, without a breakthrough product. It just had memory when Android didn't. Supply chain is the feature. $AAPL", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/turning-trends-into-friends-in-ai"}, {"id": 16, "cat": "AI/infra", "urgency": "watch", "source": "AI Rapid Fire Daily / Michael Parekh — ARD #216", "title": "Huang reinstated but refuses succession plan: 60+ direct reports, a one-man Nvidia 'by design'", "idea": "After the 11-day firing and rehiring, Huang apologised but restated that he does not believe in a succession plan and will keep running Nvidia with 60+ direct reports. The chairman, Harvey Jones, was one of the original 1993 directors and has only been chair for two weeks. S&P cited board tenure, key-man risk and possible export-control violations. Nvidia added a compliance chief and a national security committee.", "angle": "Key-man risk is now an explicit rating factor for the most important company in AI. Index-weight holders own a company with no succession plan and about 90% of AI chip supply.", "tweetA": "Nvidia supplies about 90% of the world's AI chips, has no succession plan, and its CEO says that's on purpose. S&P just made that a credit factor. Key-man risk is now systemic risk. $NVDA", "tweetB": "Blip 1.0: Altman fired and rehired in 2023. Blip 2.0: Huang, 11 days, with the White House involved. The second one came with a ratings watch and record CDS. Governance has stopped being an ESG footnote in AI.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/turning-trends-into-friends-in-ai"}, {"id": 17, "cat": "positioning", "urgency": "deep", "source": "The Dark Side of the Boom — GS Bobby Molavi", "title": "GS Molavi: 'Make it stop.' Positioning reset done, but the forces that turned rotation into liquidation are still there", "idea": "Molavi describes six weeks in which an orderly rotation out of expensive AI became a liquidation that 'found a new victim every morning': semis, hyperscalers, software, gold, then the wider market. Nvidia beat, compute demand held, and tech earnings forecasts barely moved, but investors stopped paying the old multiples. Credit is still giving a less reassuring read on the AI capex cycle and its financing.", "angle": "This was multiple compression with earnings intact, the opposite of 2000-02. If earnings hold, forward P/Es are now the cheapest since the build-out began, unless the credit market is right about funding.", "tweetA": "Nvidia beat. Compute demand held. Earnings forecasts held. And AI stocks still fell into a bear market. This was a multiple reset, not an earnings reset, and those usually get bought. The one thing that could make this time different is credit. $SMH", "tweetB": "Gold was one of the victims in an AI liquidation. That tells you who owned it: leveraged multi-asset books, not central banks. When forced sellers sell, correlation goes to one, even for the 'hedge'.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — GS flow note likely includes positioning panels"}, "link": "https://thedarksideoftheboom.substack.com/p/goldman-sachs-bobby-molavi-make-it"}, {"id": 18, "cat": "gold", "urgency": "deep", "source": "The Bubble Bubble Report / Jesse Colombo", "title": "Gold's $5,600 Jan peak was a politically driven parabola; the Warsh pick sent gold -9% and silver -26% in a single day", "idea": "Gold peaked at $5,600/oz and silver at $121 in late January 2026 after a parabolic run from fall 2025. On January 30, the day Trump named hawkish Kevin Warsh as Fed chair after months of pushing for a dove, gold fell 9% and silver 26%. A month later the Iran war lifted oil and inflation and turned rate cuts into hikes. Colombo says ten months of correction have erased only the five parabolic months, leaving the 2023–mid-2025 trend intact.", "angle": "Silver's -26% single-day drop is a record for a monetary metal. In a hiking cycle with oil-driven inflation, gold's real-rate headwind remains. The secular bull case needs the Fed to stop, not just a sentiment flip.", "tweetA": "Gold -9% and silver -26% in ONE day because a Fed chair nominee turned out hawkish. That isn't a store of value. It's a leveraged bet on the Fed's reaction function. $GLD $SLV", "tweetB": "A war that lifts oil and inflation was supposed to be gold's best case. Instead it turned the Fed into a hiker and gold fell. The 2026 lesson: the policy response matters more than the crisis.", "charts": {"count": 3, "hot": true, "desc": "Gold multi-year chart (orderly 2023–mid-25 trend, then parabola to $5,600 and full give-back), silver equivalent, and gold since April 2026 showing an accelerating parabolic decline. 🔥 Gold chart is a clean 'symmetry' visual."}, "link": "https://thebubblebubble.substack.com/p/the-precious-metals-plunge-has-become"}, {"id": 19, "cat": "gold", "urgency": "watch", "source": "The Bubble Bubble Report / Jesse Colombo", "title": "Parabolic in reverse: the gold selloff now shows the same acceleration as the January blow-off; social media is calling for $3,400, $3,000, $2,000", "idea": "Colombo argues gold's decline since April 2026 has turned parabolic, with recency bias pulling in speculators who keep lowering their targets: $3,400, $3,000, $2,500, even $2,000. Paper-market shorts have grown large and are exposed to a sharp reversal. He points to the 1970s and 2000s secular bulls, which each had one big correction before resuming.", "angle": "Crowded paper shorts plus accelerating downside forecasts is a short-squeeze setup, the same mechanics that just hit Brent. Watch COT data on Monday for managed money.", "tweetA": "The best tell in gold right now is the downside price targets on social media, which drop every week. Brent showed what a crowded short does this week: +$10 in three days. Gold has the same setup. $GLD", "tweetB": "Mid-1970s: gold fell about 45% from 1974 to 1976, and then went up 8x. Colombo is betting this is that correction. The difference is that in 1976 the Fed wasn't hiking into a war.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thebubblebubble.substack.com/p/the-precious-metals-plunge-has-become"}, {"id": 20, "cat": "energy", "urgency": "deep", "source": "Noahpinion / Alex Shoer (guest)", "title": "Sodium-ion as lithium's 'backstop technology': it caps lithium prices before it wins any market share", "idea": "Shoer applies Nordhaus's 1970s backstop-technology concept: a substitute at a fixed cost caps how expensive a scarce resource can get. From late 2020 to late 2022 lithium rose more than 10x and battery prices went up for the first time in years. A mature sodium industry would have blunted that. Sodium carbonate costs $100–500/t, while lithium carbonate has ranged $6,000–86,000/t since 2020 and jumped about 70% this spring.", "angle": "This puts a ceiling on lithium equities: the more sodium capacity CATL and BYD build, the lower lithium's spike potential. Lithium miners become ordinary commodity producers with a substitute.", "tweetA": "Lithium carbonate: $6K to $86K/t since 2020. Sodium carbonate: $100–500/t. Sodium doesn't need to win share to matter. It only needs to exist at scale to cap every future lithium spike. Bad for the lithium squeeze trade. $ALB $SQM $LIT", "tweetB": "Lithium went up 70% this spring, and CATL is building sodium lines at the same moment. Every lithium rally now funds the technology that limits the next one.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening (battery cost and market-size charts likely in post)"}, "link": "https://www.noahpinion.blog/p/the-coming-age-of-sodium-ion-batteries"}, {"id": 21, "cat": "energy", "urgency": "watch", "source": "Noahpinion / Alex Shoer (guest)", "title": "A 6-7x gap between sodium-ion forecasts: CRU 135 GWh vs Morgan Stanley 830 GWh by 2030", "idea": "CRU forecasts 135 GWh of sodium-ion demand in 2030 and 346 GWh in 2035. Morgan Stanley forecasts 830 GWh by 2030 and 2.4 TWh by 2035, about a fifth of the battery market in 2030 and over a third by 2035. GetFocus measures sodium-ion improving about 57% a year since 2010, the fastest of 30 storage technologies. Global battery demand passed 1 TWh in 2024, and one week of 2024 demand beat all of 2014.", "angle": "When forecasts disagree 6x, the debate is about the slope of the cost curve, not whether the technology works. The 57%/yr improvement rate is the same early signal LFP gave against NMC a decade earlier.", "tweetA": "Sodium-ion in 2030: 135 GWh (CRU) or 830 GWh (Morgan Stanley). A 6x spread between serious forecasters means nobody knows the cost curve. LFP's share forecasts in 2018 were wrong in the same way, on the low side.", "tweetB": "'Size tells you who's winning now. Slope tells you who's winning next.' Sodium-ion is improving 57% a year, the fastest of 30 storage technologies. Worth applying to more than batteries.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.noahpinion.blog/p/the-coming-age-of-sodium-ion-batteries"}, {"id": 22, "cat": "AI/infra", "urgency": "watch", "source": "Noahpinion / Alex Shoer (guest)", "title": "Sodium cells run 3-5C vs LFP's 0.5-1C: a data-centre UPS chemistry; Hithium is already selling Li-Na hybrids for AI DCs", "idea": "Sodium-ion can sustain 3C–5C continuous and peak discharge versus about 0.5–1C for LFP, which suits UPS fast-response backup and spiky AI-chip loads. Hithium markets a lithium-sodium hybrid for AI data centres. China Southern Grid switched on a 200 MW / 400 MWh Li-Na hybrid in Yunnan in May 2025. BYD rates its sodium cell from −30°C to 55°C.", "angle": "AI data centres need power smoothing for GPU load spikes. If sodium wins that niche, it gets a high-margin, price-insensitive first customer, much as data centres gave gas turbines and fuel cells a second life.", "tweetA": "Each GPU training step causes a power spike. LFP discharges at 0.5–1C. Sodium-ion does 3–5C. The first large buyer of sodium batteries may be AI data centres, not cars.", "tweetB": "The AI build-out keeps turning niche energy technologies into growth stories: gas turbines, fuel cells, SMRs, and now high-C-rate sodium cells for UPS. Same pattern: a power-hungry buyer that doesn't care about price.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.noahpinion.blog/p/the-coming-age-of-sodium-ion-batteries"}, {"id": 23, "cat": "tech", "urgency": "deep", "source": "Noahpinion / Alex Shoer (guest)", "title": "Zero-volt shipping: sodium cells use aluminum on both sides, so they can ship fully discharged; no HazMat headache", "idea": "Sodium cells can use aluminum current collectors on both electrodes instead of copper on the anode. Aluminum is cheaper and lighter, and it lets cells ship at zero volts without damage, which lithium-ion can't do safely. For storage projects stuck a year or more in interconnection queues, cells could sit on site without ageing. That changes inventory and logistics economics for HazMat-class cargo.", "angle": "Interconnection queues are the US storage bottleneck. A chemistry that doesn't degrade while waiting reduces the working-capital cost of a stalled pipeline. Removing copper also matters for copper demand forecasts.", "tweetA": "Nobody's pricing this: sodium cells have no copper foil. Every GWh that switches from LFP to sodium takes copper out of battery demand forecasts. $FCX $COPX", "tweetB": "US storage projects sit years in interconnection queues while lithium cells age in the yard. Sodium can ship and wait at zero volts. In a queue-constrained grid, shelf life may be worth more than energy density.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.noahpinion.blog/p/the-coming-age-of-sodium-ion-batteries"}, {"id": 24, "cat": "geopolitics", "urgency": "deep", "source": "Noahpinion / Alex Shoer (guest)", "title": "Sodium escapes lithium, not China: same equipment, same process; Natron and Bedrock are dead, Peak Energy is the lone US bright spot", "idea": "Hithium's sodium cell runs on its existing 1,000Ah lithium-ion platform, and CATL's sodium storage uses the same enclosures, lines and supply chains as its lithium products. Bedrock Materials' founder: 'If you lost it for lithium-ion, you've already lost it for sodium… I would have gone to China the very first day.' Natron failed and Bedrock shut down. Peak Energy shipped grid systems in 2025 and signed 5 GWh with Jupiter Power. Shoer argues the US should bet on solid-state (QuantumScape, Solid Power, Factorial at 300–390 Wh/kg).", "angle": "'Critical-minerals independence via sodium' doesn't hold, because the moat is manufacturing know-how, not the element. US policy money is better aimed at leapfrog chemistries and domestic hard-carbon anodes.", "tweetA": "'If you lost it for lithium-ion, you've already lost it for sodium.' Swapping the element doesn't move the factory. The supply-chain moat was never lithium. It was the production line. $QS", "tweetB": "Natron dead, Bedrock dead, CATL losing money on sodium for years as a hedge. That is what competing with a state-subsidised incumbent looks like. Hard-carbon anode supply is the one piece of the chain still open.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.noahpinion.blog/p/the-coming-age-of-sodium-ion-batteries"}, {"id": 25, "cat": "energy", "urgency": "watch", "source": "Noahpinion / Alex Shoer (guest)", "title": "LFP cells fell from $115 to $84/kWh in three years, so sodium's crossover date keeps slipping (now 2028–29)", "idea": "LFP took over grid storage (about 80% by 2023) and EVs (55%+ by 2025) after being written off. Cells fell from about $115 to $84/kWh between early 2023 and early 2026. Sodium cells currently cost 13–25% more (HiNa: 0.5–0.7 yuan/Wh versus 0.3–0.5 for lithium). The IEA sees sodium up to 20% cheaper at scale, with a crossover around 2028–29. That date keeps moving because LFP keeps getting cheaper. Sodium is about 175 Wh/kg versus LFP's up to 205.", "angle": "The risk to sodium is LFP reaching $50/kWh first. Either way the buyer wins: storage LCOS keeps falling, which is the real tailwind for solar-plus-storage replacing gas peakers.", "tweetA": "LFP cells: $115 to $84/kWh in three years. The 'cheap new chemistry' keeps missing its crossover because the incumbent keeps getting cheaper. Storage buyers benefit either way. Gas peakers don't. $FLNC $TSLA", "tweetB": "Batteries are a two-horse race where both horses push cost down. Sodium at 2028–29 parity, LFP heading toward $50. At $50/kWh, four-hour storage beats almost every peaker in the US. That's the trade, whichever chemistry wins.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.noahpinion.blog/p/the-coming-age-of-sodium-ion-batteries"}, {"id": 26, "cat": "positioning", "urgency": "deep", "source": "Haymaker / Doug Kass", "title": "Tax-loss-selling victims: Haymaker's beaten-down list is working, with PINS leading on the 'Jensen Effect'", "idea": "Haymaker added five more names (plus one more 'pummeled' stock) to its tax-loss-selling-victims (TLSV) list. The original list is off to a decent start, PINS in particular, though Kass admits the bounce was mostly the 'Jensen Effect' from Huang's reinstatement and has faded since Monday. The continued Nov 27 recovery may be seasonal, as tax-loss pressure eases into December, though softness can last into the month.", "angle": "The TLSV trade is a seasonal pattern that works best in years with deep, broad drawdowns, and 2026 qualifies. The risk is that the AI liquidation isn't a tax-loss event, so the January effect may be weaker for AI-linked names.", "tweetA": "Late November, after a near bear market, is when tax-loss sellers finish. Names that are down 50% for no fundamental reason get sold one last time and bounce in January. 2026 has a long list. $PINS", "tweetB": "Even PINS, a social-ads stock, bounced on Jensen Huang's reinstatement. When everything trades on one CEO's job status, the dispersion opportunity arrives once correlation breaks. That's January.", "charts": {"count": 1, "hot": false, "desc": "Table of the original TLSV list with performance since the prior post (in email)"}, "link": "https://haymaker.substack.com/p/friday-pow-cc1"}, {"id": 27, "cat": "gold", "urgency": "watch", "source": "Haymaker / Doug Kass", "title": "Kass: precious metals and other high-value commodities 'taken to the woodshed' — what a difference 11 months makes", "idea": "Kass says precious metals and other high-value commodities have been 'taken to the woodshed and punished mercilessly' and promises to cover them alongside his TLSV equities. That puts metals on a contrarian value desk's buy radar for the first time this cycle.", "angle": "Two contrarians (Kass and Colombo) turned constructive on metals on the same night. That signals the sentiment trough is near, though contrarian consensus is still a kind of consensus.", "tweetA": "Eleven months ago gold was at $5,600 and everyone was a metals bull. Tonight two well-known contrarians independently said 'buy the woodshed'. It's worth noticing when contrarians start to agree. $GLD $GDX", "tweetB": "Tax-loss selling hits commodity miners too. Gold miners down for the year get dumped in December and then bounce in January.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://haymaker.substack.com/p/friday-pow-cc1"}, {"id": 28, "cat": "science", "urgency": "watch", "source": "Goldfinger Capital / Robert Sinn", "title": "Talon's Vault Zone: 9.65m at 35.46% NiEq / 70.91% CuEq — an 'alien' grade intercept in Minnesota", "idea": "Talon Metals (TSX:TLO) reported Tamarack drill hole 25TK0562C at the 778m level: 29.02m at 17.16% NiEq, including 9.65m at 35.46% NiEq (70.91% CuEq). An earlier hole, 25TK0562A, hit 46.43m grading 13.37% Ni, 16.54% Cu, 7.85 g/t Pd, 14.49 g/t Pt and 8.56 g/t Au (27.39% NiEq). Sinn followed up with Chief Exploration Officer Brian Goldner on the Vault Zone (video interview).", "angle": "A massive-sulphide, multi-metal US deposit fits the domestic critical-minerals push. The grades are extreme; the open questions are tonnage and permitting in Minnesota.", "tweetA": "35% nickel-equivalent over 9.65m, in Minnesota. Typical economic nickel sulphide grades are 1–2%. If Vault has tonnage, it's one of the richest Western critical-minerals discoveries of the decade. $TLOFF", "tweetB": "US critical-minerals policy keeps funding refineries abroad. Meanwhile a Minnesota hole hit 14 g/t platinum and 13% nickel. The constraint in America isn't geology. It's permitting.", "charts": {"count": 1, "hot": false, "desc": "Embedded video interview (YouTube) with Brian Goldner; no data charts"}, "link": "https://robertsinn.substack.com/p/talon-metals-chief-exploration-officer"}, {"id": 29, "cat": "regulation", "urgency": "act", "source": "The Pressure Point / Michael McDonough", "title": "Canada's Supreme Court largely upheld Quebec's Bill 21 religious-symbol ban for teachers and police", "idea": "The Supreme Court of Canada left most of Quebec's 2019 secularism law in place, including the bans on religious symbols at work for teachers and police (as 'public employees in positions of authority'). The law uses the notwithstanding clause to override parts of both charters. Fulcrum's analysis: the case is stronger for police, who can compel a stop or search, than for teachers. Rights groups say it targets Muslim women.", "angle": "The ruling strengthens the notwithstanding clause as a policy tool. Other provinces can now use it on contested issues, which raises the political risk premium for anything rights-adjacent in Canadian regulation.", "tweetA": "Canada's top court just confirmed a province can override charter rights with the notwithstanding clause and have it stick. The precedent isn't about religious symbols. It's about how far provincial power goes, from pipelines to language law.", "tweetB": "Fulcrum's test for when the state can restrict dress is 'what can this employee compel?' It's a good test, and it applies just as well to AI agents acting for the state.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-dress-rules-turn-on-who-can/"}, {"id": 30, "cat": "tech", "urgency": "act", "source": "The Pressure Point / Michael McDonough", "title": "OpenAI countersued Apple, alleging theft of trade secrets", "idea": "Per Reuters, OpenAI has countersued Apple, alleging trade-secret theft. That escalates a dispute between two companies whose distribution partnership put ChatGPT inside Siri.", "angle": "If the Apple–OpenAI integration unwinds, iOS distribution is open again for Gemini or Claude. Distribution deals in AI are worth more than model leads.", "tweetA": "OpenAI suing Apple over trade secrets is the end of the 'ChatGPT inside iPhone' era. Someone else gets the 1.5B-device distribution slot. That's the most valuable real estate in consumer AI. $AAPL $GOOGL", "tweetB": "Apple has gained smartphone share on memory procurement while its AI partner sues it. It is winning hardware and losing the AI story. In 2027 one of those has to change.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-dress-rules-turn-on-who-can/"}, {"id": 31, "cat": "geopolitics", "urgency": "act", "source": "The Pressure Point / Michael McDonough", "title": "Hackers breached the US Air Force's Cloud One platform; logistics and personnel data may be exposed", "idea": "Per a Reuters report cited by Fox News, hackers breached the US Air Force's flagship Cloud One computing platform and may have accessed logistics and personnel data.", "angle": "A breach of a flagship DoD cloud after the Zodia custody breach and the Binance hack makes 2026 a record year for high-value intrusions. Cyber budgets in the FY27 NDAA should benefit.", "tweetA": "The Air Force's flagship cloud was breached, and logistics data is the useful prize: where things are and when they move. It lands in the same week Congress writes the defense bill. $CRWD $PANW", "tweetB": "Cloud One was supposed to be the secure consolidation of Air Force IT. Consolidation also means one breach reaches everything. Single points of failure are a policy choice.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-dress-rules-turn-on-who-can/"}, {"id": 32, "cat": "geopolitics", "urgency": "watch", "source": "The Pressure Point / Michael McDonough", "title": "Serbia's student-led protest movement nominated a chemistry professor, Radomir Saicic, for president", "idea": "Serbia's student movement, behind the sustained anti-government protests since the Novi Sad canopy collapse, has nominated Belgrade University chemistry professor Radomir Saicic as its presidential candidate (Al Jazeera).", "angle": "Moving from protest to an electoral vehicle with a technocratic candidate raises the odds of a real Vučić challenge. Watch Serbian CDS and EU accession signals.", "tweetA": "Serbia's protest movement just turned into a presidential campaign with a chemistry professor as candidate. A technocrat outsider against an entrenched incumbent is the classic Balkan playbook. Belgrade's EU and Russia balance is on the ballot.", "tweetB": "A year of student protests in Serbia that markets mostly ignored now has a candidate. Movements that go electoral usually change things. Movements that don't usually fade.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-dress-rules-turn-on-who-can/"}];

    var ch=item.charts.count>0?(item.charts.hot?' 🔥':' 📊'):'';
    h+='<div class="card'+(fSrc?' open':'')+'" id="c'+item.id+'"><div class="hd" onclick="this.parentNode.classList.toggle(\'open\')">';
    h+='<span class="num">#'+item.id+'</span><span>'+UE[item.urgency]+'</span><span class="src" style="background:'+c+'">'+esc(item.source)+'</span><span class="cat">'+esc(item.cat)+'</span>'+ch;
    h+='<span class="ttl">'+esc(item.title)+'</span></div><div class="bd">';
    h+='<div class="lbl">the idea</div><div class="idea">'+esc(item.idea)+'</div>';
    h+='<div class="lbl">my angle</div><div class="angle" style="border-color:'+c+';background:'+c+'14">'+esc(item.angle)+'</div>';
    h+='<div class="tw"><div class="twb"><div class="twl" style="color:#378add">TWEET A <button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>'+esc(item.tweetA)+'</div>';
    h+='<div class="twb"><div class="twl" style="color:#7f77dd">TWEET B <button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>'+esc(item.tweetB)+'</div></div>';
    if(item.charts.count>0||item.charts.desc){h+='<div class="chart'+(item.charts.hot?' hot':'')+'">'+(item.charts.count>0?'📊 '+item.charts.count+' chart(s) — ':'')+esc(item.charts.desc)+'</div>';}
    h+='<a class="lnk" href="'+esc(item.link)+'" target="_blank" rel="noopener">↗ Read full article</a></div></div>';
  });
  document.getElementById('cards').innerHTML=h||'<p style="color:#888">No items match.</p>';
}
function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';
  var r='<p><b>Window:</b> '+esc(META.windowStart)+' → '+esc(META.windowEnd)+'. Emails outside this window were not processed.<br><span style="color:#888">'+esc(META.timezoneNote)+'</span></p>';
  r+='<p><b>Totals:</b> '+META.emailsInWindow+' emails in window · '+META.emailsRead+' read · '+META.itemsExtracted+' items · '+META.includedSources.length+' sources</p>';
  r+='<div class="lbl">included sources (click to filter)</div><table>';
  META.includedSources.forEach(function(s,ix){r+='<tr><td><span class="sl" onclick="filterBySrc(META.includedSources['+ix+'].name)">'+esc(s.name)+'</span></td><td>'+s.items+'</td></tr>';});
  r+='</table><div class="lbl">skipped</div><table>';
  META.skippedSources.forEach(function(s){r+='<tr><td>'+esc(s.name)+'</td><td>'+esc(s.reason)+'</td></tr>';});
  r+='</table><p style="color:#888;font-size:12.5px">'+esc(META.notes)+'</p>';
  document.getElementById('repbd').innerHTML=r;
  render();
}
init();
</script></body></html>
