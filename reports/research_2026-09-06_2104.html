const META = {
  date: "2026-09-06",
  time: "21:04 CEST",
  windowStart: "2026-09-06 15:04 CEST",
  windowEnd: "2026-09-06 21:04 CEST",
  emailsInWindow: 13,
  emailsRead: 13,
  itemsExtracted: 23,
  includedSources: [
    {name:"The Bubble Bubble Report", count:1},
    {name:"Chamath Palihapitiya (All-In)", count:3},
    {name:"Unchained Premium", count:1},
    {name:"paperalfa", count:1},
    {name:"The Market Ear (Zero Hedge)", count:3},
    {name:"Dark Side of the Boom", count:3},
    {name:"Crypto Narratives", count:5},
    {name:"NLP News", count:5},
    {name:"Peter Frankopan", count:2}
  ],
  skippedSources: [
    {name:"Compounding Quality -- \"Building Your Dream Life\"", reason:"pure promotional pitch for a paid deep-dive report on an unnamed stock, no analytical content in the email itself"},
    {name:"Adler's Crypto Insights -- \"Bitcoin Market State Report\"", reason:"launch announcement for a new report series, zero data in the available preview"},
    {name:"Ecoinometrics -- \"Bitcoin Market Monitor\"", reason:"paywalled teaser, only generic newsletter boilerplate visible, no specific claims or numbers in preview"}
  ]
};

const CATS = [
  ["macro","macro","#e24b4a"],["credit","credit","#378add"],["positioning","positioning","#ef9f27"],
  ["aiinfra","AI/infra","#1d9e75"],["crypto","crypto","#7f77dd"],["geopolitics","geopolitics","#d85a30"],
  ["energy","energy","#f97316"],["tech","tech","#06b6d4"],["gold","gold","#d4a017"],["culture","culture","#ec4899"],
  ["labor","labor","#8b5cf6"],["regulation","regulation","#64748b"],["science","science","#14b8a6"],["venture","venture","#84cc16"]
];
const CATCOLOR = {}; CATS.forEach(c=>CATCOLOR[c[0]]=c[2]);
const CATLABEL = {}; CATS.forEach(c=>CATLABEL[c[0]]=c[1]);
const URG = {deep:{label:"🔵 Deep",emoji:"🔵"}, act:{label:"🔴 Act Now",emoji:"🔴"}, watch:{label:"🟡 Watch",emoji:"🟡"}};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function buildFilters(){
  const catCounts = {};
  ITEMS.forEach(i=>{catCounts[i.cat]=(catCounts[i.cat]||0)+1});
  const catBar = document.getElementById('catFilters');
  let html = '<button class="pill active" data-cat="all" style="background:#1a1a1a">All<span class="cnt">'+ITEMS.length+'</span></button>';
  CATS.forEach(function(c){
    if(!catCounts[c[0]]) return;
    html += '<button class="pill" data-cat="'+c[0]+'" style="border-color:'+c[2]+'">'+c[1]+'<span class="cnt">'+catCounts[c[0]]+'</span></button>';
  });
  catBar.innerHTML = html;
  catBar.querySelectorAll('.pill').forEach(function(btn){
    btn.addEventListener('click', function(){
      activeCat = btn.getAttribute('data-cat');
      activeSrc = null;
      render();
    });
  });

  const urgCounts = {};
  ITEMS.forEach(i=>{urgCounts[i.urgency]=(urgCounts[i.urgency]||0)+1});
  const urgBar = document.getElementById('urgFilters');
  let uhtml = '<button class="pill active" data-urg="all" style="background:#1a1a1a">All<span class="cnt">'+ITEMS.length+'</span></button>';
  Object.keys(URG).forEach(function(k){
    if(!urgCounts[k]) return;
    uhtml += '<button class="pill" data-urg="'+k+'">'+URG[k].label+'<span class="cnt">'+urgCounts[k]+'</span></button>';
  });
  urgBar.innerHTML = uhtml;
  urgBar.querySelectorAll('.pill').forEach(function(btn){
    btn.addEventListener('click', function(){
      activeUrg = btn.getAttribute('data-urg');
      activeSrc = null;
      render();
    });
  });
}

function updateFilterStyles(){
  document.querySelectorAll('#catFilters .pill').forEach(function(btn){
    const c = btn.getAttribute('data-cat');
    if(c===activeCat){ btn.classList.add('active'); btn.style.background = c==='all' ? '#1a1a1a' : CATCOLOR[c]; }
    else { btn.classList.remove('active'); btn.style.background = 'transparent'; }
  });
  document.querySelectorAll('#urgFilters .pill').forEach(function(btn){
    const u = btn.getAttribute('data-urg');
    if(u===activeUrg){ btn.classList.add('active'); btn.style.background = '#1a1a1a'; }
    else { btn.classList.remove('active'); btn.style.background = 'transparent'; }
  });
}

function render(){
  updateFilterStyles();
  const cardsEl = document.getElementById('cards');
  const filtered = ITEMS.filter(function(i){
    if(activeCat!=='all' && i.cat!==activeCat) return false;
    if(activeUrg!=='all' && i.urgency!==activeUrg) return false;
    if(activeSrc && i.source.indexOf(activeSrc)===-1) return false;
    return true;
  });
  if(filtered.length===0){
    cardsEl.innerHTML = '<div class="empty">No items match this filter.</div>';
    return;
  }
  let html = '';
  filtered.forEach(function(item, idx){
    const color = CATCOLOR[item.cat];
    const urg = URG[item.urgency];
    const chartFlag = item.charts.hot ? '🔥' : (item.charts.count>0 ? '📊' : '');
    const expand = activeSrc ? 'open' : '';
    html += '<div class="card '+expand+'" data-id="'+item.id+'">';
    html += '<div class="card-head" onclick="toggleCard('+item.id+')">';
    html += '<span class="idx">#'+(idx+1)+'</span>';
    html += '<span class="urg">'+urg.emoji+'</span>';
    html += '<span class="badge" style="background:'+color+'">'+item.source+'</span>';
    html += '<span class="catpill">'+CATLABEL[item.cat]+'</span>';
    if(chartFlag) html += '<span class="chartflag">'+chartFlag+'</span>';
    html += '<span class="title">'+item.title+'</span>';
    html += '</div>';
    html += '<div class="card-body">';
    html += '<div class="section-label">The Idea</div><div class="idea">'+item.idea+'</div>';
    html += '<div class="section-label">My Angle</div><div class="angle" style="border-left:2px solid '+color+';background:'+color+'14">'+item.angle+'</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet"><div class="lbl" style="color:#378add">TWEET A</div><div class="txt">'+item.tweetA+'</div><button class="copy-btn" onclick="copyTweet('+item.id+',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet"><div class="lbl" style="color:#7f77dd">TWEET B</div><div class="txt">'+item.tweetB+'</div><button class="copy-btn" onclick="copyTweet('+item.id+',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    html += '<div class="chartbox'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 ':'')+'Charts: '+item.charts.count+' -- '+item.charts.desc+'</div>';
    html += '<div class="linkrow"><a href="'+item.link+'" target="_blank">↗ Read full article</a></div>';
    html += '</div></div>';
  });
  cardsEl.innerHTML = html;
}

function toggleCard(id){
  const card = document.querySelector('.card[data-id="'+id+'"]');
  if(card) card.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function filterBySrc(name){
  activeSrc = name;
  activeCat = 'all';
  activeUrg = 'all';
  render();
  document.getElementById('cards').scrollIntoView({behavior:'smooth'});
}

function buildReport(){
  document.getElementById('headerMeta').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources';
  let html = '<div style="margin-bottom:10px"><strong>Window:</strong> ' + META.windowStart + ' to ' + META.windowEnd + '. Emails outside this window were not processed.</div>';
  html += '<div style="margin-bottom:10px"><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp; <strong>Emails read:</strong> ' + META.emailsRead + ' &nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</div>';
  html += '<div class="section-label">Included Sources</div><div>';
  META.includedSources.forEach(function(s,idx){
    html += '<span class="srclink" onclick="filterBySrc(\''+s.name.replace(/'/g,"\\'")+'\')">'+s.name+'</span> ('+s.count+')';
    if(idx < META.includedSources.length-1) html += ' &nbsp;·&nbsp; ';
  });
  html += '</div>';
  html += '<div class="section-label" style="margin-top:14px">Skipped Sources</div><div>';
  META.skippedSources.forEach(function(s){
    html += '<div style="margin-bottom:6px"><strong>'+s.name+'</strong> -- '+s.reason+'</div>';
  });
  html += '</div>';
  document.getElementById('reportBody').innerHTML = html;
  document.getElementById('reportHead').addEventListener('click', function(){
    document.getElementById('report').classList.toggle('open');
    document.getElementById('reportToggleIcon').textContent = document.getElementById('report').classList.contains('open') ? '▾' : '▸';
  });
}

buildFilters();
render();
buildReport();
</script>
