<script>
const ITEMS = [{"id": 1, "cat": "AI/infra", "urgency": "deep", "source": "Apollo Daily Spark / Huw van Steenis", "title": "Europe is financing the US AI buildout — $48B of hyperscaler bonds in EUR/GBP/CHF", "idea": "Hyperscalers raised $48B in European-currency bonds YTD (€27B, £13B, CHF7.5B) — more than 3x all of 2025. They are 3% of euro IG issuance, 10% of sterling, 22% of Swiss franc, vs 8% of US IG. They are 7% of euro 10y+ issuance, adding AA- paper to indices that were A/BBB. Forecast to rise another 25% in 2027.", "angle": "US capex funded by foreign duration buyers; the first place crowding-out shows is the long end of non-USD curves. Links to EUR weakness and thin 10y+ supply.", "tweetA": "22% of Swiss franc IG issuance this year is hyperscalers. The AI buildout isn't being funded by US savings alone — it's quietly eating the European long-duration bid. Who's the marginal buyer when it's 30%?", "tweetB": "$48B in EUR/GBP/CHF bonds in nine months vs under $16B for all of 2025. Hyperscalers are now the AA- of the euro 10y+ bucket. If Oracle-style credit gets pushed there next, the spread story changes fast. $ORCL $MSFT", "charts": {"count": 3, "hot": false, "desc": "Three charts: hyperscaler share of IG issuance by currency; 10y+ euro issuance share; sovereign duration shortening (UK)."}, "link": "https://thedarksideoftheboom.substack.com/p/apollo-daily-spark-europe-is-financing"}, {"id": 2, "cat": "macro", "urgency": "deep", "source": "Apollo Daily Spark / Torsten Slok", "title": "AI's rate-insensitive boom = Dutch disease for the US economy", "idea": "Slok argues AI capex is insensitive to rates and drains capital, power and labor from rate-sensitive sectors (housing, autos). The Fed is trapped between AI-driven inflation and weak rate-sensitive sectors, so rates stay higher for longer. Monetary policy can't fix a sectoral imbalance; only more supply of power, chips, infrastructure can.", "angle": "Explains why curve/term premium won't respond to weakness in housing. Pair with Dauber's 14% core capex orders on a 5% cost of capital.", "tweetA": "The Fed has one tool and two economies. Rate-insensitive AI capex on one side, mortgages at 3-year highs on the other. Hikes don't cool the first; they just crush the second. $XHB $NVDA", "tweetB": "Dutch disease usually describes a commodity currency. Now it's a tech capex boom inside the US: power, labor, capital all bid away from housing. The 'fix' is supply — which means grid and chips are the real macro variable, not the FOMC.", "charts": {"count": 1, "hot": false, "desc": "Chart showing core capex vs rate-sensitive sectors divergence."}, "link": "https://thedarksideoftheboom.substack.com/p/apollo-daily-spark-europe-is-financing"}, {"id": 3, "cat": "AI/infra", "urgency": "deep", "source": "Dark Side of the Boom / Rich Privorotsky (GS)", "title": "The Fight for Capital: AI starts crowding everyone else out", "idea": "Goldman's one-delta desk flagged that SpaceX and Broadcom financing landed almost simultaneously: 'the crowding-out effect is potentially immense'. Broadcom, Oracle and SpaceX are pushing tens of billions into SPVs/private credit while public bonds absorb the AI funding wave. First rationing shows up in lower-quality credit, small caps, borrowers needing yesterday's cost of money. The fork: AI becomes self-financing, or the rest of the economy gets squeezed.", "angle": "Direct bridge to Rosenberg's 'cracks in riskiest tranches' and Dimartino's CCC at 1000bp. Same story, three desks.", "tweetA": "CCC spreads at 1000bp while Oracle and Broadcom roll tens of billions through SPVs. That's not a coincidence — that's rationing. The AI trade crowds out the borrower you aren't watching. $HYG $ORCL", "tweetB": "Two outcomes: AI becomes self-financing, or everything else pays for it. Small caps just voted. Watch which one the Russell 2000 prices over the next 3 weeks. $IWM", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/the-fight-for-capital-ai-is-starting"}, {"id": 4, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / Albert Edwards (SocGen)", "title": "AI's miracle has a 1997 problem — input-driven growth and the financing cliff", "idea": "Edwards, who called the East Asian 'miracle' in the 1990s as input accumulation not productivity, applies it to AI: huge capex and valuations, productivity dividend still 'to be believed'. Gross investment looks big but depreciation and rising equipment costs shrink net capacity addition. Endgame is financing: if cash flow doesn't catch capex, lenders decide how much of the miracle survives.", "angle": "Core framework for the AI-credit thesis. 1997 ended with the funder (foreign USD) stepping back, not the technology failing.", "tweetA": "1997 Asia wasn't a technology failure. It was a funding failure. The factories were real. The question for AI isn't 'does it work' — it's 'who rolls the debt in 2028'. $NVDA $ORCL $CRWV", "tweetB": "Depreciation is the part of the capex story nobody tweets. Gross investment up, equipment costs up, net capacity addition much smaller. Count the capex net of depreciation and the miracle gets smaller fast.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/ais-miracle-has-a-1997-problem"}, {"id": 5, "cat": "macro", "urgency": "red", "source": "Market Musings / Phil Dauber", "title": "Thursday 30y auction: indirects took 72.3% at 5.6% — 'the long end found a buyer'", "idea": "10y traded 5.35 in the morning and closed 5.22. Indirects took 72.3% of the 30y; Tuesday's 10y cleared at 5.30 with indirects at 80.3%. Dauber reads it as end users buying the level, ending the momentum argument — not necessarily the top in yields. Wrong if the 30y closes under 5.50.", "angle": "A 5.6% 30y that clears with 72% indirect isn't a funding crisis; it's a repricing with a willing buyer. Fits the Rosenberg 2.54 bid-to-cover read.", "tweetA": "A 30-year Treasury auction at 5.6% and indirects took 72%. People keep calling this a buyers' strike. A buyers' strike doesn't print a 2.54 bid-to-cover. The pain is for equity multiples, not for Treasury demand. $TLT", "tweetB": "Short covering or end-user demand? The table prints the same either way. The tell: the 10y went 5.35 to 5.22 intraday. Higher yields didn't break anything — they found a floor and the Fed hiked into it.", "charts": {"count": 1, "hot": false, "desc": "Auction results table (indirects/directs/dealers) for the 30y."}, "link": "https://phildauber.substack.com/p/cmmonnnn-seven"}, {"id": 6, "cat": "macro", "urgency": "deep", "source": "Market Musings / Phil Dauber", "title": "Oil, Treasuries and S&P at 56-point pairwise correlation — highest in 30+ years (Barclays)", "idea": "Barclays has oil, Treasuries and the S&P moving at a 56 pairwise correlation, highest in 30+ years; inflation is the channel. ISM prices paid 77.9 (top fifth of 75 years). Arkevium's arithmetic: forward EPS +6%, multiple 19x→17x, index ~5% lower. Fed hiked to 3.75–4.00% on Sept 16; 2y at 4.75% is 75bp over the top of the range. CBO: FY26 deficit $1.993T (+12%); at 5% rates the economy needs 6% real growth to hold debt/GDP.", "angle": "Covariance is the point — diversification between bonds and equities is gone because inflation is the single factor. Risk parity is the casualty.", "tweetA": "Oil, bonds, and stocks all moving together at the highest correlation in 30 years. One factor — inflation. If your portfolio's diversification came from bonds, it's a coincidence you're about to lose. $SPY $TLT", "tweetB": "At 5% rates the US needs 6% real growth just to hold the debt ratio. The 2y is already 75bp above the top of the Fed funds range. The market is pricing another hike, not a pause.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://phildauber.substack.com/p/cmmonnnn-seven"}, {"id": 7, "cat": "energy", "urgency": "red", "source": "Market Musings / Phil Dauber", "title": "War premium: blockade stays, Houthis hit Riyadh 3 days, Bab al-Mandeb in play; Brent modal ~$100", "idea": "Brent gave back 1.5% on Trump saying nothing happens before Nov 3 — Dauber thinks that buys a month. Treasury sanctioned 17 more tankers; the Houthis hit Saudi airports a third day. 63% of Gulf oil output shut by Hurricane Isaias; Delta reports first. A record El Niño (3.4C over average, above Nov 2015) adds food price risk into H1 2027. He prefers owning the barrel via options.", "angle": "Strike pause tied to election calendar is a defined-date option. Hurricane plus Red Sea plus blockade = three independent supply shocks.", "tweetA": "The strike pause expires November 3. Hurricane has 63% of the Gulf offline. Houthis are hitting Riyadh. And Brent is down 1.5% on a promise. This is a call-option market, not a futures market. $XLE $USO", "tweetB": "Record El Niño at 3.4C above average, higher than 2015. Wheat, rice, palm oil, cocoa into H1 2027, on top of $100 oil. The energy shock and the food shock are the same trade.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://phildauber.substack.com/p/cmmonnnn-seven"}, {"id": 8, "cat": "positioning", "urgency": "deep", "source": "Market Musings / Phil Dauber", "title": "Call skew at 99.6th percentile vs $166B into cash — and the midterm odds shifting", "idea": "Call skew sits at the 99.6th percentile of its year even as $166B went into cash (most since April 2020). Deutsche counts 21 rallies in 23 midterm windows (median +7%); the two misses, 1978 and 2018, were rate scares. Polymarket has Dems sweeping at 64% (49% in September); BofA says a sweep costs stocks 10%+, gridlock +5%. Pew: Dems +8 on House ballot.", "angle": "Retail is long upside, institutions flee to cash: both extremes at the same time into a rate-scare midterm.", "tweetA": "Call skew at the 99.6th percentile. $166B into cash, the most since April 2020. Both can't be right — one of these crowds is about to be wrong. $SPY $QQQ", "tweetB": "Midterm rallies: 21 of 23 times. The two exceptions (1978, 2018) were both rate scares. Polymarket Democratic sweep went from 49% to 64% in a month; BofA says sweep = -10% for stocks.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://phildauber.substack.com/p/cmmonnnn-seven"}, {"id": 9, "cat": "AI/infra", "urgency": "red", "source": "Market Musings / Phil Dauber", "title": "The market sorted AI by balance sheet: Oracle -5.5%, CoreWeave -7%, Nvidia -2.94%", "idea": "After the FT put OpenAI annualized revenue near $50B vs the ~$70B circulated (Bloomberg: gross vs net; OpenAI targets $70B net by year-end while raising $30B+ at $1.4T), the complex sold by funding source. Debt-funded names fell about twice as hard as the cash-rich chipmaker. Dauber is wrong if Oracle outperforms Nvidia by 5 points through Oct 28.", "angle": "A clean falsifiable pair trade: short debt-funded capex, long net-cash capex.", "tweetA": "ORCL -5.5%, CRWV -7%, NVDA -2.9% on one OpenAI headline. The market isn't discounting AI revenue. It's discounting whose balance sheet funds the build. That's a different trade from three months ago. $ORCL $CRWV $NVDA", "tweetB": "The OpenAI revenue gap is $20B of run rate, gross vs net. That matters less for OpenAI than for its counterparties: Oracle, CoreWeave, Microsoft carry its backlog.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://phildauber.substack.com/p/cmmonnnn-seven"}, {"id": 10, "cat": "tech", "urgency": "red", "source": "Market Musings / Phil Dauber", "title": "SpaceX buys 800 MHz spectrum from Grain (~$8B); AT&T, Verizon, T-Mobile -6% pre-open", "idea": "SpaceX agreed to buy Grain Management's 800 MHz licenses for ~$8B, subject to FCC approval. Carriers down ~6% pre-market. Starlink Mobile has no ground network yet, but the headline risk is permanent, and tower names that rallied on a capex spree SpaceX said it didn't plan in August now look exposed.", "angle": "Mobile carriers priced like utilities are being repriced like disrupted incumbents. Tower REITs are the second-order trade.", "tweetA": "SpaceX spent $8B on spectrum and three carriers lost ~6% of market cap before the open. Starlink has no ground network yet. The market is pricing the option, not the product. $T $VZ $TMUS $AMT", "tweetB": "If SpaceX becomes a carrier, who owns the towers? Tower names rallied in August on the carriers' capex. A reversal of that capex narrative is a different trade than the carrier short. $CCI $AMT", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://phildauber.substack.com/p/cmmonnnn-seven"}, {"id": 11, "cat": "tech", "urgency": "deep", "source": "Market Musings / Phil Dauber", "title": "Apple: iPhone 18 component orders cut at least 15% (Nikkei); top 5 S&P names = bottom 434", "idea": "Nikkei reports iPhone 18 component orders cut ≥15% this month on tepid demand. Dauber notes the top five S&P names equal the bottom 434 combined, so one supplier note moves the index.", "angle": "Concentration math: a 15% order cut at one company is an index-level event.", "tweetA": "Top 5 S&P names = bottom 434. One Nikkei supplier note on iPhone orders, and the index feels it. 'Diversified' index exposure was always five stocks and 495 rounding errors. $AAPL $SPY", "tweetB": "Component orders cut 15% on a product that's still a month from peak build season. Look at the supply chain — Murata, Largan, TSMC — before looking at Apple. $AAPL $TSM", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://phildauber.substack.com/p/cmmonnnn-seven"}, {"id": 12, "cat": "AI/infra", "urgency": "red", "source": "Peter Boockvar / Boockvar Notes", "title": "Big picture: GenAI buildout rests on two companies — OpenAI and Anthropic", "idea": "Regardless of how OpenAI calculates revenue, a massive chunk of the data center buildout depends on two companies, and a large piece of Microsoft, Oracle, Amazon and Google's cloud backlog is those two model makers. Whether the capex is money well spent depends on their profitability.", "angle": "Counterparty concentration: the backlog is not diversified across customers.", "tweetA": "The AI capex stack has two customers. Two. OpenAI and Anthropic anchor the backlog at MSFT, ORCL, AMZN, GOOGL. A $20B ARR haircut at one of them reprices everything upstream. $MSFT $ORCL $AMZN", "tweetB": "Count how much of 'remaining performance obligations' at the hyperscalers is two counterparties. Then ask what happens to RPO if either one raises at a lower valuation.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://peterboockvar.substack.com/p/the-big-picture-point-i-took-awayother"}, {"id": 13, "cat": "macro", "urgency": "deep", "source": "Peter Boockvar / Boockvar Notes", "title": "Container rates ease 2% w/w but Shanghai-NY still >$10,000; sentiment: II bulls 56.9, bears 15.7", "idea": "WCI Shanghai–NY fell 2% w/w, still above $10,000; LA lane -2.7% w/w. Investors Intelligence bull/bear spread still above the extreme read of 40 (bulls 56.9 from 57.7, bears 15.7). AAII bulls +5.7 pts to 40.3, exceeding bears for the first time in a month.", "angle": "Freight at $10k on the transpacific lane is a goods-inflation channel into Q4; sentiment still extreme.", "tweetA": "A Shanghai-to-New York container still costs more than $10,000. Bulls at 56.9 vs bears at 15.7. The cost of moving things is high and the cost of being wrong feels low. Both can't last. $ZIM $SPY", "tweetB": "II bull/bear spread above 40 = extreme. Combined with 99.6th percentile call skew, positioning isn't a risk to the thesis — it is the thesis.", "charts": {"count": 1, "hot": false, "desc": "WCI Shanghai-NY container rate chart."}, "link": "https://peterboockvar.substack.com/p/the-big-picture-point-i-took-awayother"}, {"id": 14, "cat": "credit", "urgency": "red", "source": "David Rosenberg / Rosenberg Research", "title": "Thumb comes off the bond market's Adam's apple: 30y 5.618%, bid-to-cover 2.54", "idea": "The 30y drew 5.618%, matching the when-issued, with bid-to-cover 2.54 vs 12-month average 2.42; directs and indirects took 93% vs 90% average. Same day OpenAI said revenue was ~$20B below what was signalled. The sub-headline: cracks emerging in the riskiest tranches of corporate credit.", "angle": "Stable demand for the 30y plus cracks in CCC: a bifurcated credit market, not a bond market crisis.", "tweetA": "The 30-year cleared at 5.618% with a 2.54 bid-to-cover. The risk-free curve is fine. It's the bottom of the capital structure where cracks appear. Look at CCC, not Treasuries. $HYG $JNK", "tweetB": "Everyone is scared of a bond market buyers' strike. The actual tell: 93% direct+indirect takedown. The marginal stress is in credit, not rates.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.earlymorningwithdave.com/p/the-thumb-comes-off-the-bond-markets"}, {"id": 15, "cat": "credit", "urgency": "red", "source": "Danielle DiMartino Booth / QI Research", "title": "CCC spreads retest 1000bp distressed level; HY spreads bounce off 250bp support", "idea": "US CCC spreads are retesting the 1000bp distressed level this week. Broader HY (BB, B, CCC) spreads have bounced off ~250bp since Oct 2024; the last move was from 260bp (week of Aug 29, Jackson Hole) to just above 300bp. The Mason-jar metaphor: overtightening cracks the glass.", "angle": "Dispersion inside HY: CCC at distress while headline HY is at 300bp. That's the AI-capex rationing channel.", "tweetA": "HY at 300bp looks fine. CCC at 1000bp doesn't. Headline spreads are hiding that the bottom of the credit stack is already being rationed. Overtightening cracks the jar, but it starts with the weakest. $HYG $JNK", "tweetB": "Spreads at 250bp have been support for two years. Jackson Hole to now: +40-50bp. That's the move that matters, not the level.", "charts": {"count": 1, "hot": true, "desc": "Weekly HY OAS with 250bp support line."}, "link": "https://dimartinobooth.substack.com/p/the-daily-feather-thank-you-john"}, {"id": 16, "cat": "macro", "urgency": "deep", "source": "Capital Wars / Investment Clock", "title": "The investment clock: bear flattener of the late-cycle Speculation regime → bull flattener into Turbulence", "idea": "Fixed-income cycle is standard: early-cycle bull steepener (Rebound) has given way to the bear flattener of late-cycle Speculation. If sequential, next is a bullish flattener with long yields falling as the clock moves to Turbulence. Investors discount 6–12 months, so the question is H2 2027.", "angle": "Frames the 5.6% 30y as a late-cycle peak candidate, not a regime change.", "tweetA": "We've had the bear flattener. The cycle template says the next move is the bull flattener — long yields falling — and it arrives with recession pricing, not with relief. Be careful what you hope for at 5.6%. $TLT", "tweetB": "If H2 2027 is the question, today's 5.6% 30y is the price of the pre-Turbulence cycle. Duration is a recession hedge again, but only after the damage shows up in credit.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://capitalwars.substack.com/p/will-2027-prove-a-recession-year"}, {"id": 17, "cat": "positioning", "urgency": "red", "source": "MacroCharts", "title": "S&P 50 days without a 1% decline; 'what if rates go LOWER' is the asymmetric scenario", "idea": "S&P has gone 50 days without a 1% decline. The author argues everyone focused on the risk of rates going higher, ignoring the risk of rates going lower, and is moving the equity portfolio in a clear direction around that scenario, which 'may already be in motion'.", "angle": "50 days with no 1% drop is a vol-compression extreme and a classic setup for mean reversion when the 30y stabilises.", "tweetA": "50 trading days without a 1% down day while the 30y yields 5.6%. The market is priced for no volatility in the one place where volatility is the base case. $SPY $VIX", "tweetB": "The consensus risk is rates higher. The scenario that hurts the crowd is rates lower for the wrong reason — growth scare, credit event. 50 days of calm is how that surprise lands.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.macrocharts.com/p/market-update-and-signals-10926"}, {"id": 18, "cat": "positioning", "urgency": "deep", "source": "SixSigmaResearch / SixSigmaCapital (chat)", "title": "Minimising drawdowns: only 20% of stocks above their 40-day MA; trimming CRWV, exiting CIFR", "idea": "Only 20% of stocks are above their 40-dma. Author exited CIFR at 19, trimmed CRWV at 116/110/101/92, trading around CRDO, parked cash in RSP ~209, trimmed megacaps on crowding, holding 5–10% in SGOV/2y.", "angle": "Breadth: very narrow market + high-capex debt names being sold, as in Dauber's balance-sheet sort.", "tweetA": "20% of stocks above their 40-day average while the index is within a couple of percent of highs. That isn't a bull market. That's five stocks and a prayer. $SPY $RSP", "tweetB": "Practitioner tape: CRWV sold at 116, 110, 101, 92. Someone is already distributing the leveraged AI names into every bounce.", "charts": {"count": 1, "hot": false, "desc": "Chart of rates climbing / megacap crowding referenced by author."}, "link": "https://open.substack.com/pub/sixsigmacapital/p/minimising-drawdowns"}, {"id": 19, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / Forex Daily", "title": "EUR/USD 1.12: Germany upgrades GDP to 1.3% (from 0.5%); IP +2.0% on defence/tech orders", "idea": "EUR/USD fell from ~1.16 to 1.12 on higher global yields, French fiscal anxiety, higher diesel/gas. But Germany's Economy Ministry lifted 2026 GDP to 1.3% (from 0.5%) and 2027 to 1.1% (0.9%); August IP +2.0%. Goldman: EUR responds more to the common component of sovereign spreads than idiosyncratic — contagion matters, France alone doesn't.", "angle": "Bears now need a fresh catalyst; 1.11 is the contagion test.", "tweetA": "EUR/USD -3.5% from 1.16 while Germany just tripled its 2026 growth forecast. That's not a growth scare, it's a funding and energy one. The euro trades the common sovereign factor, not France. $EURUSD", "tweetB": "German GDP 0.5% to 1.3% and IP +2% on defence orders. Europe's fiscal anxiety is ahead of its data. The question is whether 1.11 holds if OAT spreads blow out again.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/forex-daily-euro-finds-a-floor-as"}, {"id": 20, "cat": "geopolitics", "urgency": "deep", "source": "Dark Side of the Boom / Forex Daily", "title": "EU–China: tougher trade mechanism while PBOC denies cheap RMB drives surplus; BIS REER 14.5% below 2022 peak", "idea": "EU Trade Commissioner Sefcovic met Chinese Commerce Minister Wang Wentao as the EU considers a more flexible mechanism to impose import caps/tariffs on Chinese goods. MUFG: BIS real effective RMB is 14.5% below its 2022 peak; IMF estimates undervaluation of 12–20%. Beijing denies currency manipulation. DXY +3.3% from Sept low but dollar only +0.7% vs a broad Asia basket as PBOC fixings favour firmer CNY; EUR/CNY -10% from January high.", "angle": "CNY as shock absorber for Asia while EUR eats it. A second terms-of-trade shock for Europe if talks harden.", "tweetA": "DXY +3.3% from the September low. Dollar vs Asia FX basket: +0.7%. Beijing is quietly absorbing the dollar rally with firmer fixings — and sending the adjustment to the euro. $EURCNY $CNH", "tweetB": "The RMB is 14.5% below its 2022 REER peak. Europe is about to ask Beijing to fix it while its own manufacturers fight margin compression on diesel and gas. That is a very hard negotiation.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/forex-daily-euro-finds-a-floor-as"}, {"id": 21, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / Forex Daily", "title": "Japan: record NISA outflow ~JPY16trn/yr (~$100bn) fights BOJ hikes and returning JGB buyers", "idea": "Foreign investors bought ~JPY3.1trn JGBs in September after three months of selling, with another BOJ hike and better 10y/30y auctions. But Japanese investment trusts bought ~JPY1.36trn of foreign equities in September; JPY~4trn over three months, a record; annualised near JPY16trn (~$100bn). PM Takaichi has talked of retail JGB demand; FinMin Katayama floated making JGBs NISA-eligible.", "angle": "The yen is a flow problem, not a rate-differential one. JGBs in NISA would be a structural yen catalyst.", "tweetA": "BOJ hikes, foreigners buying JGBs again — and the yen still can't rally. $100bn a year of NISA money going into US equities is the reason. Rate differentials set the weather; flows decide who gets wet. $USDJPY", "tweetB": "Policy lever nobody's pricing: JGB eligibility in NISA. It would turn a $100bn annual outflow into a domestic bid. That's a bigger yen event than any BOJ meeting. $JPY", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/forex-daily-euro-finds-a-floor-as"}, {"id": 22, "cat": "AI/infra", "urgency": "red", "source": "AI Supremacy / Michael Spencer", "title": "OpenAI ARR ~$50B vs $70B circulated: FT says investors compared to Anthropic", "idea": "FT: OpenAI annualized revenue late Sept was ~$50B, ~$20B below the $70B circulated. The discrepancy arose from OpenAI investors trying to produce a direct comparison with Anthropic ARR; much enterprise revenue flows through cloud partners (gross vs net). Spencer calls it OpenAI 'caught over-stating'.", "angle": "Gross vs net ARR accounting is the new fight: how revenue via Microsoft/AWS/Google is counted.", "tweetA": "A $20B gap between 'ARR' as marketed and as audited. In a market priced on run-rate extrapolation, the denominator just moved. Next question: how much of everyone's AI revenue is gross, not net? $MSFT $ORCL", "tweetB": "ARR = one month times 12. At a $1.4T valuation, a 28% haircut to the run rate is not a rounding error. It's why Oracle fell more than Nvidia.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.ai-supremacy.com/p/ai-off-the-charts-ii-state-of-ai-2026-chart-summary"}, {"id": 23, "cat": "AI/infra", "urgency": "deep", "source": "AI Supremacy / State of AI 2026 (Air Street)", "title": "Claude led 26% of measured model R&D work in August, up from <1% in February", "idea": "Per Anthropic's internal index cited in the State of AI 2026 report, Claude led 26% of measured model R&D work in August vs under 1% in February; researchers set tasks and supervise. Spencer asks how fast recursive-self-improvement teams will speed new models.", "angle": "A 26x increase in six months — AI-accelerating-AI is now a measured number.", "tweetA": "26% of measured model R&D work done by the model itself in August. February: under 1%. That's the first hard number on recursive improvement and it's a 26x move in six months. $NVDA", "tweetB": "If model R&D is 26% automated, the bottleneck isn't researcher headcount, it's compute and power. That's the sentence that justifies $1T in capex.", "charts": {"count": 1, "hot": false, "desc": "Chart from State of AI 2026: share of model R&D led by Claude."}, "link": "https://www.ai-supremacy.com/p/ai-off-the-charts-ii-state-of-ai-2026-chart-summary"}, {"id": 24, "cat": "AI/infra", "urgency": "deep", "source": "AI Supremacy / State of AI 2026", "title": "OpenAI + Anthropic ARR $105B by late summer vs ~$30B in January; Anthropic IPO and $2T valuation", "idea": "Combined OpenAI and Anthropic ARR reached $105B by late summer, up from ~$30B at the start of 2026 (>3x). Anthropic IPOs in about five days at ~$2T, equal to 78 S&P 500 companies per Burry; New Constructs calls it the 'most ridiculous IPO of 2026'. Claude Haiku 5.5 released ~75% cheaper than Haiku 4.5.", "angle": "Tests whether public markets pay for 3x growth at a $2T valuation. Note the combined metric includes the disputed OpenAI number.", "tweetA": "$30B to $105B combined run-rate in nine months. That's faster than any enterprise software company ever. And one of the two just had a $20B restatement. The IPO is the audit. $MSFT $AMZN $GOOGL", "tweetB": "$2T valuation = 78 S&P 500 companies (Burry). The S-1 will tell us gross vs net ARR, compute cost, and margins. That's the document that resets every AI multiple.", "charts": {"count": 1, "hot": false, "desc": "State of AI 2026: combined ARR growth chart."}, "link": "https://www.ai-supremacy.com/p/ai-off-the-charts-ii-state-of-ai-2026-chart-summary"}, {"id": 25, "cat": "science", "urgency": "watch", "source": "AI Supremacy / State of AI 2026", "title": "Skild S1: robot performs unfamiliar tasks from video demos with no weight updates — 66% vs 9%", "idea": "Skild's S1 performed unfamiliar tasks from video demonstrations without updating weights. With 100,000 hours of pre-training it scored 66% on the company's cumulative per-step success vs 9% for a language-prompted baseline on the same data and compute. Spencer: is physical AI at its GPT-2 moment?", "angle": "In-context learning in robotics is the unlock for general-purpose automation economics.", "tweetA": "66% vs 9% on the same data and compute. In-context learning for robots isn't a demo trick anymore. If this is GPT-2, GPT-3 for humanoids arrives sooner than the capex curve assumes. $TSLA $NVDA", "tweetB": "A robot that learns from a video, without retraining, collapses the deployment cost per task. That's the number to watch for the humanoid TAM, not unit costs.", "charts": {"count": 1, "hot": false, "desc": "Skild S1 vs baseline success chart."}, "link": "https://www.ai-supremacy.com/p/ai-off-the-charts-ii-state-of-ai-2026-chart-summary"}, {"id": 26, "cat": "science", "urgency": "watch", "source": "AI Supremacy / State of AI 2026", "title": "Mathematicians (Tao et al.) urge a break with OpenAI after 722-manuscript GitHub drop", "idea": "On Oct 6 OpenAI published openai/math: 722 manuscripts (372 subject families) on open problems; each paper reportedly used ~3 hours of ChatGPT Pro compute across ~4,000 posed problems. The Association for Human Mathematics Communications (with Terry Tao) urged mathematicians to stop working with OpenAI, citing exaggerated capabilities. Spencer: 'The backlash to AI is only just beginning.'", "angle": "Credibility war between AI labs and academia; potential regulatory/talent frictions.", "tweetA": "OpenAI drops 722 math manuscripts. Tao's community responds by asking colleagues to walk away. 3 hours of compute per paper is cheap if the proofs are right, and very expensive if they aren't. $MSFT", "tweetB": "The scarce resource in AI-for-science isn't compute, it's trust of the domain experts. Losing mathematicians is a much bigger deal than losing a news cycle.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.ai-supremacy.com/p/ai-off-the-charts-ii-state-of-ai-2026-chart-summary"}, {"id": 27, "cat": "venture", "urgency": "watch", "source": "AI Supremacy / State of AI 2026", "title": "Nous Research $90M Series B; Meta Muse 2M DAU (Similarweb) vs 3M weekly (internal)", "idea": "Nous Research (Hermes) raised $90M Series B led by Robot Ventures (Nvidia, USV, Menlo, Samsung, 1789 Capital participating) and launches 'Hermes for Businesses'. Personal-agent funding surge after Meta's Muse: Similarweb says 2M DAU while The Information, citing internal data, had 3M weekly users days earlier. Muse looks far less sticky than 2023 chatbots.", "angle": "Open-source agents + enterprise privacy is the wedge versus the closed labs.", "tweetA": "Meta's Muse: 3M weekly users per internal data, 2M daily per Similarweb. These two numbers can't both be right — and the funding for agent startups is being priced on the bigger one. $META", "tweetB": "Nous raising $90M with Nvidia in the cap table says open-weight agents are now an infrastructure bet, not an ideological one. Who sells the GPUs to every one of them? $NVDA", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.ai-supremacy.com/p/ai-off-the-charts-ii-state-of-ai-2026-chart-summary"}, {"id": 28, "cat": "regulation", "urgency": "watch", "source": "AI Supremacy / State of AI 2026", "title": "Statewide datacenter moratoriums rising; Europe seeks €10B public + €20B private; most European AI funding is US", "idea": "AI is becoming a political issue: significant rise in state-wide datacenter moratoriums, falling AI sentiment among US consumers. A European plan seeks up to €10B public and ≥€20B private funding; Nscale will test 'sovereign compute' in Norway. Most funding for European AI/robotics/datacenters actually comes from the US. Chinese open-weight models gain share as costs fall; HBM costs inflate capex.", "angle": "Local consent is a binding constraint like power. Sovereign compute is a US-financed product.", "tweetA": "AI's binding constraint in 2026 might not be chips or power. It's local consent. State-level datacenter moratoriums are the new zoning. The next 'NIMBY' trade is a trade on compute. $VRT $EQIX", "tweetB": "'Sovereign compute' in Europe is 80% financed by US capital. The sovereignty is in the building permits, not the balance sheet.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.ai-supremacy.com/p/ai-off-the-charts-ii-state-of-ai-2026-chart-summary"}, {"id": 29, "cat": "culture", "urgency": "deep", "source": "Noahpinion / Noah Smith", "title": "Maybe the Rapture is already here: vertical short-form video as 'heavenbanning'", "idea": "Seinfeld finale drew 76M; Game of Thrones <20M. Meme culture has largely vanished; the internet 'carcinized' into vertical short-form video feeds. Chinese study of 1,500+ high-schoolers found short video damaged future time perspective. Myers & Hooper (2026): iPhone access reduced births by 4.5–8.0% at ages 15–19 and 3.2–6.6% at 20–24; Nigeria 3G expansion cut annual birth probability by 7%. Smith ties smartphones to fertility falling below 2.", "angle": "Attention economy → fertility → demographics: a long-run asset-allocation variable. AI-personalised video as the next step.", "tweetA": "iPhone access cut births by 4.5–8% for teenagers. 3G coverage in Nigeria: -7% probability of a birth. The fertility story may be the cheapest-to-measure effect of attention capture. Pension math doesn't price this. $META $TTD", "tweetB": "Mass culture (76M) → meme culture → personalised AI video. The last step removes the shared experience entirely. What do advertisers pay for when no one watches the same thing? $GOOGL $META", "charts": {"count": 3, "hot": false, "desc": "Multiple charts: short-form video share of media time; social media usage."}, "link": "https://www.noahpinion.blog/p/maybe-the-rapture-is-already-here"}, {"id": 30, "cat": "science", "urgency": "watch", "source": "Not Boring / Packy McCormick", "title": "Atomic Machines out of stealth: Matter Compiler; PrimeSwitch PS-150 relay (150A, 50µs) for 800V DC data centers", "idea": "Atomic Machines (CEO Jeff Holden) came out after 6 years with the Matter Compiler: 'builds working micro-machines from code alone'. First product: PrimeSwitch PS-150, a 9.5mm relay carrying 150A that opens in 50µs (~1,000x faster than a contactor) for 800V DC AI data centers. MEMS were a $15.4B market across 31B units in 2024. Investor Cyan Bannister invested after a chart of AI capex inspired 'matter compilers'.", "angle": "Fast DC switching is a bottleneck for 800V architectures; micro-manufacturing without per-product tooling.", "tweetA": "A 9.5mm relay that switches 150A in 50 microseconds, about 1,000x faster than a contactor. 800V DC data centers need this, and no fab can make it today. The AI power stack has a switch problem. $ETN $VRT", "tweetB": "MEMS is a $15.4B market of 31B units, each needing years of process work. A compiler that takes code to hardware compresses that to days. That's a manufacturing curve to watch.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.notboring.co/p/weekly-dose-of-optimism-214"}, {"id": 31, "cat": "geopolitics", "urgency": "deep", "source": "Not Boring / Packy McCormick", "title": "Anduril $3.7B Arsenal-2 shipyard at Sparrows Point; Navy contract up to $2.9B paid on outcomes", "idea": "Anduril will invest $3.7B in Arsenal-2, a 2M sq ft 'software-defined shipyard' at Sparrows Point (Baltimore) making Virginia-class submarine components, 3,100+ permanent jobs. Navy contract worth up to $2.9B, payments tied to production outcomes. Torpedo tubes are already holding up submarines. Maryland production 2030; California facility from 2028.", "angle": "Private capital pre-funding naval capacity; milestone-based pay is a new defence procurement template.", "tweetA": "Anduril commits $3.7B of its own capital and gets paid $2.9B on delivery. Torpedo tubes are the constraint holding up Virginia-class subs. Defence primes just got a competitor that carries the capex. $HII $GD $LMT", "tweetB": "Sparrows Point built ships under Bethlehem Steel. The U.S. can make submarine components, just not enough or on budget. Payment-on-outcome is the contract design to copy.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.notboring.co/p/weekly-dose-of-optimism-214"}, {"id": 32, "cat": "science", "urgency": "watch", "source": "Not Boring / Packy McCormick", "title": "Privo PRV111 chemo patch: complete clearance in 21 of 22 oral-cancer patients, no surgery", "idea": "Phase 2: a cisplatin patch applied directly to non-invasive oral cancer / high-grade lesions cleared 21 of 22 on biopsy; remaining patient improved to low-grade dysplasia. All 22 avoided surgery; no recurrences at 14-month median follow-up; negligible systemic exposure, no serious treatment-related adverse events. Small study.", "angle": "Drug repurposing via delivery form; local delivery = surgery avoidance economics.", "tweetA": "21 of 22 complete clearance with an old drug (cisplatin) in a new delivery form: a patch. The innovation wasn't the molecule. It was avoiding the jaw surgery. Cost curves in oncology might come from delivery, not discovery.", "tweetB": "Phase 2, n=22. The caveats are real. But 14 months with no recurrences and no systemic exposure is the profile that moves into Phase 3 quickly.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.notboring.co/p/weekly-dose-of-optimism-214"}, {"id": 33, "cat": "science", "urgency": "watch", "source": "Not Boring / Packy McCormick", "title": "Biohub + DeepMind/Isomorphic/Meta commit $1.8B for virtual-cell data ($300M from the three)", "idea": "Biohub announced an expanded $1.8B collaboration to build data for predictive cell models. Google DeepMind, Isomorphic Labs and Meta contribute $300M together, joining Biohub, DOE and NIH; total includes compute and existing data. Goal: simulate interventions digitally, test promising ones in the lab.", "angle": "Data, not models, is the bottleneck in bio-AI; shared datasets as public goods.", "tweetA": "$1.8B for data, not models, to build virtual cells. DeepMind, Isomorphic, and Meta are putting in $300M together. The bottleneck in AI bio is measurement, not compute. Who sells the sequencers and perturbation screens? $ILMN $TXG", "tweetB": "Virtual cells let you 'try thousands of interventions at computer speed.' That's the TAM-expander behind AI drug discovery, and it needs billions of cell measurements first.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.notboring.co/p/weekly-dose-of-optimism-214"}, {"id": 34, "cat": "culture", "urgency": "watch", "source": "Not Boring / Packy McCormick", "title": "Nobel 2026: optogenetics (Deisseroth, Hegemann, Nagel), IceCube neutrinos, asymmetric autocatalysis, Anne Carson", "idea": "Medicine: Deisseroth, Hegemann, Nagel for optogenetics (light switches neurons on/off). Physics: Francis Halzen for IceCube and high-energy astrophysical neutrinos. Chemistry: Kagan and Soai for non-linear effects/autocatalysis in asymmetric synthesis. Literature: Anne Carson. Packy also made a short film 'KILO' using Claude/ChatGPT to orchestrate Runway from his Airbound essay.", "angle": "Optogenetics → neurotech and bio-manufacturing options; AI-produced short film from an essay shows content-cost collapse.", "tweetA": "Optogenetics wins the Nobel in the same week an AI orchestrates a short film from a blog post. Both are about control surfaces: switching biology with light, switching production with prompts.", "tweetB": "The 'time from essay to film' went from months to a weekend. Content production costs are heading toward zero faster than distribution economics are adjusting. $RWAY $NFLX", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.notboring.co/p/weekly-dose-of-optimism-214"}, {"id": 35, "cat": "crypto", "urgency": "red", "source": "Unchained / Mando Minutes", "title": "US gov wallet moves 12,267 BTC (~$1.01B) from Bitfinex hack seizure to unlabeled addresses", "idea": "A wallet holding BTC from the 2016 Bitfinex hack sent 12,267 BTC (~$1.01B) to new unlabeled addresses Thursday; outputs already spent. No exchange deposit recorded. Wednesday, government-linked wallets sent ~$119M USDT plus BTC to Coinbase Prime (custody). A March 2025 EO says Strategic Bitcoin Reserve BTC 'shall not be sold'; no confirmation these coins are in the reserve.", "angle": "Supply-overhang rumor mill. Prime custody transfers vs unlabeled addresses.", "tweetA": "12,267 BTC of seized Bitfinex coins moved to wallets nobody labels. Not on an exchange. Not announced. The EO says reserve BTC 'shall not be sold'. Check whether these coins are even in the reserve before you trade the headline. $BTC", "tweetB": "$1B of government BTC moves the day ETF outflows hit -$244M. The market will price the worst case first. The real tell will be Coinbase Prime deposits, not unlabeled wallets. $COIN", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://unchainedcrypto.beehiiv.com/p/government-bitcoin-from-a-2016-hack-is-on-the-move"}, {"id": 36, "cat": "regulation", "urgency": "red", "source": "Unchained", "title": "ESMA: unauthorized stablecoins must be wound down on MiCA platforms within 3 months (Jan 8, 2027)", "idea": "ESMA opinion dated Oct 8: licensed crypto platforms should stop serving non-MiCA-authorized stablecoins (ARTs and EMTs). National regulators should see leftover exposure cleaned up in three months (~Jan 8, 2027). Warnings and acknowledgements are not enough; controls must stop EU clients buying or adding. Only selling, converting, transferring or withdrawing allowed, time-limited.", "angle": "Hard regulatory deadline that picks winners among stablecoins (USDC/EURC vs USDT).", "tweetA": "Europe just set a January 8 deadline for non-MiCA stablecoins. Block new buys. Allow only exits. If you're a stablecoin issuer outside the MiCA regime, you've got three months of EU distribution left. $CRCL $USDT", "tweetB": "The ESMA text doesn't name tokens. It doesn't need to: the only large non-MiCA stablecoin is USDT. A euro-stablecoin land grab is coming. $CRCL", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://unchainedcrypto.beehiiv.com/p/government-bitcoin-from-a-2016-hack-is-on-the-move"}, {"id": 37, "cat": "regulation", "urgency": "deep", "source": "Unchained", "title": "Blumenthal asks Cantor for Tether records: 5% stake from $600M to ~$10B; 84% of 846 wallets USDT-only", "idea": "Sen. Blumenthal sent Cantor Fitzgerald 13 requests (response by Oct 23) on its relationship with Tether. The letter says Cantor's 5% stake grew from $600M to an estimated $10B (ICIJ estimate; Tether hasn't confirmed). Sept 28 minority report on Tether and Iranian shadow banking found 84% of 846 wallets transacted exclusively or nearly exclusively in USDT (preliminary).", "angle": "Political risk on the largest stablecoin via its custodial/ownership ties.", "tweetA": "A 5% stake that grew from $600M to an estimated $10B in two years. Now 13 questions and an Oct 23 deadline. If you wonder why ESMA moved the same week, the timing is not an accident. $CEP", "tweetB": "84% of 846 reviewed wallets transacted only in USDT. Preliminary, but it makes the Iran-sanctions angle a legislative issue in a midterm month. $USDT", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://unchainedcrypto.beehiiv.com/p/government-bitcoin-from-a-2016-hack-is-on-the-move"}, {"id": 38, "cat": "regulation", "urgency": "deep", "source": "Unchained", "title": "NFL to Supreme Court: $1.8B of $3.3B traded on prediction markets one Sunday was NFL", "idea": "NFL brief says sports contracts on prediction markets are gambling, not swaps; backs NJ officials petitioning against the Third Circuit ruling for Kalshi (Dodd-Frank swaps, CFTC exclusive jurisdiction; Sixth and Ninth Circuits disagree). The brief says $1.8B of $3.3B traded on prediction markets on the first NFL Sunday was NFL-linked. Kalshi's response due Nov 9.", "angle": "Circuit split → cert likely; sports = majority of prediction-market volume.", "tweetA": "55% of prediction-market volume on the first NFL Sunday was NFL contracts: $1.8B of $3.3B. The 'information markets' narrative is a sports betting business. The Supreme Court is about to rule on which. $HOOD", "tweetB": "A circuit split on whether sports contracts are swaps. If SCOTUS says gambling, state regulators win and the CFTC route dies. Kalshi's response is due Nov 9.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://unchainedcrypto.beehiiv.com/p/government-bitcoin-from-a-2016-hack-is-on-the-move"}, {"id": 39, "cat": "crypto", "urgency": "deep", "source": "Unchained / Mando Minutes", "title": "Tokenised equities: Securitize 1:1 tokens of 12 US stocks on Solana; Robinhood explores T. Rowe ETF tokens; Citrini basket", "idea": "Securitize launched 1:1-backed tokens of 12 US stocks (Apple, Nvidia, Tesla, Amazon, Microsoft) on Solana settling in USDC, shares not lent out; stock jumped 10%+. Robinhood exploring tokens tied to actively managed ETFs with T. Rowe Price Digital Assets (not for US users). Citrini says agentic finance makes crypto a 'fundamentals trade'; basket led by Derive, Lighter, Ether.fi (10% each), Aave/Ethena 9%, Solana 8%. Orca/Loopscale merged as Formation to run a tokenized stock venue under SEC rules.", "angle": "Financial plumbing: custody, 24/7 settlement, USDC rails. Citrini basket as a positioning signal.", "tweetA": "Tokenised AAPL, NVDA, TSLA settling in USDC on Solana, 1:1 backed, shares not lent. The first real test of 24/7 equity settlement. Watch who gets the fees: the issuer, the chain, or the stablecoin. $SOL $CRCL $HOOD", "tweetB": "Citrini's basket is 10% each in Derive, Lighter and Ether.fi. The 'AI agents on-chain' thesis is turning into an index. When a narrative becomes a basket, it's late or it's early — check the funding rates.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://unchainedcrypto.beehiiv.com/p/government-bitcoin-from-a-2016-hack-is-on-the-move"}, {"id": 40, "cat": "crypto", "urgency": "red", "source": "Lucky Trader / Morning Minute", "title": "Uptober turns red: BTC ETFs -$484.9M Wednesday, October
