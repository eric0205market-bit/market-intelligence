<script>
var ITEMS = [{"id": 1, "cat": "crypto", "urgency": "act", "source": "Lucky Trader / Morning Minute", "title": "Binance hack erased bitcoin ETFs' entire October in one session", "idea": "Attackers drained ~$6.4B from Binance hot wallets in ~20 minutes (4x the $1.5B Bybit record), attributed to North Korea's TraderTraitor. BTC ETFs lost $643M Friday, flipping October from +$127M to -$516M. Entry was Binance's own signing approvals (50 pre-signed authorizations on Ethereum), not a chain flaw.", "angle": "Flow data says the pain is institutional-wrapper, not on-chain. Monday's ETF print is the tell for whether Friday was capitulation or the start.", "tweetA": "One Friday session turned bitcoin ETFs from +$127M to -$516M for October. $6.4B stolen in 20 minutes and the thing that broke wasn't a blockchain, it was an approval workflow. Monday's ETF print decides which story we're in.", "tweetB": "Everyone's asking if BTC holds $77k. Better question: who is the marginal buyer when the largest exchange has to go shopping for $1.3B of coin to refill its own reimbursement pool? That's a forced bid under a market that just lost its month.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/the-binance-hack-leads-to-mass-outflows"}, {"id": 2, "cat": "crypto", "urgency": "act", "source": "Lucky Trader / Morning Minute", "title": "Binance is a forced buyer of ~$1.3B BTC/ETH/BNB while $3.6B has already left", "idea": "Binance set aside $6.34B (about $5B already held in the stolen tokens) but must buy roughly $1.3B of BTC, ETH and BNB on market/OTC to top up the pool. QCP counts $3.64B net outflows since withdrawals reopened. Mando cites Cointelegraph at $5.8B net outflows.", "angle": "Two opposing flows: customer exodus (supply of coin to the market) vs reimbursement buying. Net effect on BNB specifically is the cleanest read.", "tweetA": "Binance has $3.6B of customer outflows on one side and a ~$1.3B shopping list to refill reimbursement on the other. The exchange is simultaneously the largest seller and a forced buyer. $BNB $BTC $ETH", "tweetB": "Compare to FTX: BTC -23% in a week. This time it's -0.2% on the day after a record hack. Either the market is numb, or Binance's own balance sheet is quietly the bid. I don't love that either answer relies on Binance.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/the-binance-hack-leads-to-mass-outflows"}, {"id": 3, "cat": "regulation", "urgency": "deep", "source": "Lucky Trader / Morning Minute", "title": "CFTC's Selig: hack 'proves our exact point' - pitches federal option for offshore venues", "idea": "CFTC Chair Michael Selig said the hack proves unregulated offshore exchanges lack safeguards and floated a 'federal option': offshore venues register with the CFTC and meet US cybersecurity standards. He also stressed the hole came 'from someone's laptop.' FBI and Secret Service both opened probes; Mando notes IRS/FBI/USSS froze funds (CZ thanked them) and 44% of stolen funds are frozen.", "angle": "Regulatory pivot: a hack becomes the argument for onshoring Binance-type venues. Winners: Coinbase/regulated custodians; losers: offshore perp venues.", "tweetA": "The CFTC chair just said a $6.4B hack 'proves our point'. Read that as an invitation: register offshore venues under US cybersecurity rules. Binance's biggest risk isn't the theft, it's becoming the case study for who gets a US license. $COIN", "tweetB": "Interesting detail nobody is leaning on: the breach was a DevOps laptop and pre-signed approvals. That is a SOC 2 problem, not a cryptography problem. Regulators will write rules about key-management hygiene, and the exchanges that already comply get a moat.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/the-binance-hack-leads-to-mass-outflows"}, {"id": 4, "cat": "crypto", "urgency": "deep", "source": "Lucky Trader / Morning Minute", "title": "ETH ETFs: worst month since launch (-$1.61B) and an 11-session losing streak", "idea": "ETH ETFs bled $156M Friday and $1.61B in October, their worst month since launch. Lucky Trader counts an 11-session losing streak; Mando's linked tweet calls it a record 23-day outflow streak. September BTC ETF flows were +$2.65B for contrast.", "angle": "ETH at $2,280 with ETF holders exiting; the narrative leg for ETH institutional demand is the one that's cracking.", "tweetA": "BTC ETFs: -$516M in October. ETH ETFs: -$1.61B, worst month since launch. The institutional bid for ETH didn't fade, it reversed. At $2,280 that's the cleanest relative-value tell in the tape. $ETH", "tweetB": "September +$2.65B of BTC ETF inflow, October -$516M. A $3.2B swing in 30 days isn't retail noise. Somebody with a mandate changed their mind.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/the-binance-hack-leads-to-mass-outflows"}, {"id": 5, "cat": "regulation", "urgency": "watch", "source": "Lucky Trader / Morning Minute", "title": "50 issuers now object to OKX-ICE tokenised shares - only 12 of 62 names left", "idea": "Nvidia, Micron, Nike, Costco and Reddit joined the opt-out list: 50 companies object to tokenized share trading on the OKX/ICE venture, leaving 12 of the 62 originally planned names.", "angle": "Tokenization is hitting the issuer-consent wall. Equities issuers, not regulators, are the gatekeepers of 24/7 stock-on-chain.", "tweetA": "50 of 62 companies have told OKX-ICE they don't want tokenized shares of themselves. Tokenization's bottleneck isn't the chain, it's issuer consent. The 12 holdouts are the whole addressable market now.", "tweetB": "Funny how 'permissionless' finance keeps needing permission from Nvidia's legal department.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/the-binance-hack-leads-to-mass-outflows"}, {"id": 6, "cat": "crypto", "urgency": "deep", "source": "Mando Minutes", "title": "Hack forensics: 44% frozen, 90% replenished, ETH reorg paused THORChain, laundering via Tron", "idea": "Mando's link stack: 44% of stolen Binance funds frozen; Binance says 90% of stolen assets replenished; an Ethereum reorg paused THORChain and slowed the hacker; Chainalysis says laundering is going through Tron; ZachXBT says Binance and Bitget hack funds are commingled; reports blame the CCP as 'real mastermind'. Also: Trezor warned of a hardware implant, Blockaid saw 12 sites hit by frontend attacks, BTCPay warned of wallet drains.", "angle": "Cybersecurity as a first-class crypto risk factor: state actors, hardware supply chain and frontend compromises in one week.", "tweetA": "Same week: $6.4B Binance theft, a Trezor warning about a hardware implant, 12 sites hit by frontend attacks, BTCPay wallet drains. The weakest link in self-custody just moved from the chain to the supply chain.", "tweetB": "An Ethereum reorg slowed a state-backed hacker. Use that sentence next time someone says chain-level interventions are impossible. The credible-neutrality debate just got a data point.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-0edc"}, {"id": 7, "cat": "crypto", "urgency": "deep", "source": "Adler Insight / Weekly Engine", "title": "Uptober failed again: BTC -7.2% (after -3.8% last year); market is calmer than post-FTX", "idea": "October ended lower two years running: BTC -7.2% vs -3.8% a year earlier, after +25% in August and +6.4% in September. Adler notes BTC held near its annual moving average, versus -23% in the week after FTX in Nov 2022. A second framework, 'Bitcoin Market State', is teased for Weekly Engine 119.", "angle": "Seasonality is a broken edge for two years running. The muted reaction to a record hack is the more important datapoint.", "tweetA": "Uptober is now 0-for-2: -3.8% last year, -7.2% this year. The record hack barely moved the annual moving average, FTX cost 23% in a week. Either the market learned, or it's out of buyers AND sellers. $BTC", "tweetB": "Strip out the headline and the surprise is the non-reaction. A $6.4B theft and BTC sits near trend. That is what a mature, low-conviction market looks like, and low conviction usually resolves with a move.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://adlerinsight.substack.com/p/weekly-engine-118-cce"}, {"id": 8, "cat": "positioning", "urgency": "act", "source": "Mando Minutes", "title": "Hedge funds pulling cash from US stocks at an all-time-high pace", "idea": "Mando links a post saying HFs are pulling cash out of US equities at a record pace while Nasdaq prints -3% ($25,440). Fear & Greed 38, BTC dominance 60%.", "angle": "Pairs with Morgan Stanley prime book data cited by Dauber: >8% of gross cut since June, biggest de-grossing since 2017.", "tweetA": "Hedge funds are cutting US equity exposure at the fastest pace on record while the S&P is only 5% off its high. Positioning has already priced a bigger drawdown than the index has delivered.", "tweetB": "When funds de-gross faster than the market falls, the next move belongs to whoever is still long. Watch QQQ short interest this week, not the VIX.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-0edc"}, {"id": 9, "cat": "tech", "urgency": "watch", "source": "Mando Minutes", "title": "Google energy chief: space data centres cost up to 100x Earth; Gallup: 71% oppose a local data centre", "idea": "Two AI-infra reality checks in Mando's tech links: The Information reports a Google energy chief saying orbital data centres cost up to 100x terrestrial; Gallup shows 71% of Americans oppose a data centre in their area. Also OpenAI cut its raise to ~$20B and DeepSeek unveiled an autonomous coding agent.", "angle": "Orbital compute is an 'if launch gets 100x cheaper' bet (see YC RFS); local opposition is the live constraint on the terrestrial buildout, with midterms tomorrow.", "tweetA": "71% of Americans oppose a data centre near them. Google's own energy chief says the orbital alternative costs 100x. The AI buildout is boxed in between NIMBY and physics, and tomorrow is an election.", "tweetB": "Space data centres need Starship at 10,000 launches/year to work on paper. Terrestrial ones need a zoning board. Guess which one the market is pricing as the easier problem.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-0edc"}, {"id": 10, "cat": "geopolitics", "urgency": "act", "source": "Mando Minutes", "title": "Oil -4% to ~$99 on Rubio's 'diplomacy preferred' while Netanyahu presses for a strike", "idea": "Mando's macro stack: oil falls as Rubio says diplomacy with Iran is preferred; Netanyahu reportedly presses Trump to strike Iran; Gulf states brace for harsher retaliation; Ukraine restarts attacks on Russian refineries (third in 3 days); US pushes to restart Russian gas exports to EU; US-Canada trade deal 'close'; PBOC switches to new overnight policy rates; Japan weighs $500B defence plan.", "angle": "Oil near $99-110 is trading a diplomatic probability, not supply. Refinery strikes plus a Gulf retaliation tail argue for the call side.", "tweetA": "Oil -4% on a Rubio quote while Netanyahu is lobbying for a strike and Ukraine hit its third Russian refinery in 3 days. Crude is trading the headline probability of diplomacy, not the barrels.", "tweetB": "Russian gas back to the EU, Ukrainian drones on Russian refineries, Gulf retaliation plans. Three energy policies pointing in three directions in one week. The only consistent trade is long vol on Brent.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-0edc"}, {"id": 11, "cat": "positioning", "urgency": "act", "source": "Phil Dauber / Morning Musings", "title": "Dauber: AI build is a funding story and credit is pricing it - HY at 326bp, Oracle 5y at ~119bp", "idea": "HY printed 326bp on Oct 29 (12bp wider in a session, 1bp through his stress line) on a print that predates Friday's index drop. Alphabet negative FCF, Amazon trailing -$42B, Intel memory-cost guide all in one week; Oracle 5y swap at a record ~119bp; Berkshire (T-bills, no capex) near a five-month high. He puts 60/40 on funding vs positioning noise. Kill line: HY under 320bp with VIX ~18.", "angle": "A falsifiable credit thesis with levels. Compare with Morgan Stanley's de-gross read: same week, two explanations.", "tweetA": "HY at 326bp, Oracle protection at a record 119bp, Alphabet FCF negative, Amazon -$42B trailing. The tell on AI isn't the equity tape, it's who is paying to hedge the borrower. 320bp is the line.", "tweetB": "Berkshire at a 5-month high while Nvidia, AMD and Broadcom buy stock in Meta's $25B raise so Meta can buy their chips. Pick which balance sheet you'd rather own when funding is the constraint.", "charts": {"count": 3, "hot": true, "desc": "Charts inside - worth opening: 10y yield decomposition (real yield vs breakevens), building materials vs CPI, Fed conditions index"}, "link": "https://phildauber.substack.com/p/caught-in-the-riptide-watching-for"}, {"id": 12, "cat": "macro", "urgency": "deep", "source": "Phil Dauber / Morning Musings", "title": "Almost the entire 10y rally since Oct 5 came from real yields; breakevens gave back 1bp", "idea": "The 10y round-tripped the September hike, yet the move is all real yield: the market cut growth expectations and left inflation expectations alone. MUFG puts information-processing equipment adding ~0.18pts to core PCE (series high); NY Fed multivariate core trend turned up in September; Slok's rule-based model needs funds at 6.75% by end-2027 (~275bp of hikes). Wednesday refunding: $628B borrowing estimate, up to $6B buybacks in 10-20y.", "angle": "Growth-scare duration rally with an intact inflation premium. AI capex literally showing up in core PCE is the novel link.", "tweetA": "10y yields fell and 1bp of it was inflation expectations. That's not a deflation scare, it's a growth scare sitting on top of an inflation trend that hasn't turned. AI hardware alone is adding ~0.18 points to core PCE, the most ever in the series.", "tweetB": "Slok's model needs a 6.75% funds rate by 2027 to get CPI to 2%. Nobody believes the Fed does that. Which means the long end is pricing a Fed that blinks, and breakevens aren't buying it.", "charts": {"count": 1, "hot": true, "desc": "Decomposition of the 10y move since the Oct 5 peak: nearly all real yield, flat breakevens"}, "link": "https://phildauber.substack.com/p/caught-in-the-riptide-watching-for"}, {"id": 13, "cat": "macro", "urgency": "act", "source": "Phil Dauber / Morning Musings", "title": "Election: Dems 93% House, 71% Senate; early votes +70% vs 2022 in Wisconsin; Gallup engagement 56% record", "idea": "Kalshi: House 93.2%, Senate 71%; full sweep ~70%. Dauber puts Senate at 75% and sees a 'red riptide' (rural voters ~+20 pts to Dems vs 2024, men +13, registered Dem Hispanics out-voting GOP Hispanics in 17/17 states) plus a 'blue tsunami' (early ballots +70% WI, +43% ME, +31% NC; 51.4M in by Sunday). Generic ballot D+8.9 vs R+2.6 in 2024; Senate math needs 4 net with TX/AK/OH/IA/KS toss-ups in Trump+11-16 states.", "angle": "Correlated polling error is the 25%. First tells: GA/NC/FL counts and TX-15/TX-35 for the Hispanic swing.", "tweetA": "Gallup: 56% of adults giving 'quite a lot' of thought to the election, highest ever measured at this point (54% in 2018, 55% in 2010). Early ballots +70% in Wisconsin vs 2022. The Senate is where the five toss-ups all break the same way, because polling errors are correlated. $SPY", "tweetB": "A Democratic House gives you subpoenas (Oversight list already named), a Hegseth impeachment vote and an Iran war-powers fight. It does not give you a smaller deficit. The long end keeps its term premium whoever wins Tuesday.", "charts": {"count": 1, "hot": false, "desc": "Early-vote and polling tables"}, "link": "https://phildauber.substack.com/p/caught-in-the-riptide-watching-for"}, {"id": 14, "cat": "geopolitics", "urgency": "deep", "source": "Phil Dauber / Morning Musings", "title": "If Dems sweep: Iran strike window shortens before January - why Dauber stays long Brent into the vote", "idea": "Netanyahu pressed Trump Saturday to strike right after the vote; Trump wants talks to run. UAE's Gargash: 'political off-ramp' sought. Dauber's view: a Democratic sweep shortens the window and raises odds of action in the lame duck. Also Hegseth impeachment promised by Massie, Kushner-Gulf money ($2B alleged) as an Oversight file, Russia sanctions/Ukraine aid become possible with a Senate flip. Kill: Brent settling at or under $110 today.", "angle": "Political calendar as an oil option: the January 3 handover as a hard deadline for kinetic action.", "tweetA": "A Congress that can't stop a strike can still make one harder after January 3. That makes the lame duck the highest-probability window for Iran action, and Brent options are priced like it's just a headline.", "tweetB": "Oil -4% on 'diplomacy preferred' with a hard political deadline in 60 days. Cheap optionality is still cheap optionality.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://phildauber.substack.com/p/caught-in-the-riptide-watching-for"}, {"id": 15, "cat": "macro", "urgency": "deep", "source": "Phil Dauber / Morning Musings", "title": "2025 payrolls: first prints added 1.21M jobs; revised data shows 116k for the same twelve months", "idea": "Lighthouse Macro revisions work cited by Dauber: 2025's first prints added 1.21 million jobs, the same twelve months now show 116,000. Friday consensus is +55k vs +29k, unemployment 4.2%. He owns Citi/JPM (reserve cushion vs a 5.3% unemployment scenario) and is short PayPal.", "angle": "If revisions are that large, the 'strong labour market' narrative was mostly first-print artifact.", "tweetA": "First prints said 1.21M jobs in 2025. The revised number for the same twelve months is 116,000. That's a 90% haircut. The 'strong labor market' the Fed hiked against might never have existed.", "tweetB": "Friday's +55k consensus matters less than the revisions to the prior two months. Trust the revision, not the headline.", "charts": {"count": 1, "hot": false, "desc": "Lighthouse Macro revision chart"}, "link": "https://phildauber.substack.com/p/caught-in-the-riptide-watching-for"}, {"id": 16, "cat": "positioning", "urgency": "deep", "source": "Phil Dauber / Morning Musings", "title": "Hedge funds cut >8% of gross since June - biggest de-grossing since at least 2017; record QQQ short base into Apple", "idea": "Morgan Stanley's prime book: >8% of combined long and short positions cut since June. Friday's 7.20% semiconductor day came with HYG down only 0.19%, consistent with a forced flush rather than credit stress. Dauber: if HY comes back under 320bp while QQQ short interest falls, it was a de-gross. Apple and Palantir report tonight.", "angle": "The cleanest counter to his own credit thesis. Apple tonight is the named test.", "tweetA": "SOX -7.2% in a day and HYG -0.19%. If credit were pricing a funding crisis it wouldn't have shrugged. That's a de-gross, and de-grosses end.", "tweetB": "Record QQQ short interest into Apple's print. If Apple holds highs, the capex-light mega-cap becomes the only refuge inside tech and the short base gets squeezed. $AAPL $QQQ", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://phildauber.substack.com/p/caught-in-the-riptide-watching-for"}, {"id": 17, "cat": "geopolitics", "urgency": "deep", "source": "Phil Dauber / Morning Musings", "title": "PBoC opens ~$15B swap facility for brokers after China's worst equity selloff in nearly a decade; Beijing's largest Taiwan live-fire drills", "idea": "PBoC launched a one-year swap facility (~$15B) letting 31 brokers/asset managers swap illiquid assets for liquid ones to buy stocks. Beijing ran its largest live-fire drills around Taiwan after a large US arms package. Mando adds the PBOC moved to new overnight policy rates and the CCP urged a crypto-linked graft crackdown.", "angle": "State-capitalism plumbing: central bank balance sheet used as a stock-market backstop.", "tweetA": "China's worst equity selloff in almost a decade and the PBoC's answer is a $15B swap line so brokers can swap junk for liquidity to buy stocks. The Plunge Protection Team just got a formal product.", "tweetB": "Largest Taiwan live-fire drills yet, the same week as the equity backstop. Domestic stress plus external signalling is a pattern I've seen before.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://phildauber.substack.com/p/caught-in-the-riptide-watching-for"}, {"id": 18, "cat": "venture", "urgency": "watch", "source": "Phil Dauber / Morning Musings", "title": "Nvidia, AMD and Broadcom put $5B into Meta's $25B share sale - vendors funding the customer", "idea": "Per Paul Kedrosky via Dauber: Nvidia, AMD and Broadcom bought $5B of Meta's $25B share sale, in a customer that raised the money partly to buy their chips. Also OpenAI raised <half of $30B at ~$1.25T, WSJ on investors paying up to hedge the AI trade, Arini Capital forced to sell ~$800M of debt on bank margin calls.", "angle": "Circular financing again - the same pattern as the 2000 telecom vendor-finance cycle.", "tweetA": "Nvidia, AMD and Broadcom bought $5B of Meta stock. Meta raised $25B partly to buy their chips. Revenue recognized, equity owned, cash round-tripped. We've seen this movie in 2000 with Lucent.", "tweetB": "Vendor financing is the canary: when suppliers have to fund their customers, end-demand isn't doing the job. $NVDA $AVGO $AMD $META", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://phildauber.substack.com/p/caught-in-the-riptide-watching-for"}, {"id": 19, "cat": "geopolitics", "urgency": "watch", "source": "Phil Dauber / Morning Musings", "title": "400,000 march in France over fuel and living costs; Kherson truce lapse sees cyberattacks on air-raid apps in both Ukraine and Russia", "idea": "Politico: ~400k people marched in France on the second weekend of student-led protests over fuel and living costs, with demonstrations also in Italy and Spain. Euronews: air-raid alert apps in both Russia and Ukraine hit by cyberattacks after the Kherson truce lapsed (Mando also lists Russia public alert apps hacked).", "angle": "Energy-cost populism in Europe plus civil-defence infrastructure as a cyber target.", "tweetA": "400,000 in the streets of France over fuel prices, protests in Italy and Spain. Brent at $99-110 is a political variable in Europe now, not just a P&L line.", "tweetB": "Air-raid alert apps in BOTH Ukraine and Russia got hacked after the truce lapsed. Civil defence software is the new front line.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://phildauber.substack.com/p/caught-in-the-riptide-watching-for"}, {"id": 20, "cat": "credit", "urgency": "deep", "source": "Capital Wars", "title": "Capex of ~$1T this year, $1.75T by 2027 - and a global refinancing wall on top", "idea": "Capital Wars: US hyperscaler capex approaches $1T this year and could reach $1.75T in 2027. Three underappreciated risks: capex booms rarely earn proportionate returns; capital-intensive industries are cyclical; the financing burden presses on liquidity. The author argues the interaction with an unprecedented global debt refinancing cycle is the ultimate constraint (excerpt only; most behind the paywall).", "angle": "Liquidity, not technology, is the binding constraint in historical capex cycles. Pairs with Dauber's credit read.", "tweetA": "$1T of hyperscaler capex this year, $1.75T by 2027, landing on top of a global refinancing wall. History says capex cycles end when financing breaks, not when technology disappoints.", "tweetB": "Every previous capex boom (rail, fibre, shale) ended in overcapacity AND a funding event. Today's buildout is bigger than all three and the debt wall is the same year.", "charts": {"count": 1, "hot": false, "desc": "Charts inside - worth opening (capex projections)"}, "link": "https://capitalwars.substack.com/p/trillions-and-trillions"}, {"id": 21, "cat": "AI/infra", "urgency": "act", "source": "Market Sentiment", "title": "SOX fell eight straight sessions - longest losing streak since 2008; SOXX -17% in October", "idea": "SOX was down 16% MTD at one point. A strong SK Hynix quarter and Anthropic's IPO filing sparked a brief rebound that faded after Intel and Amazon disappointed. Meta has swung 20%+ eight times in the past year. The Market Sentiment portfolio fell 13% in October (slightly better than SOXX), YTD +45.03%.", "angle": "Realised vol at COVID levels for the AI complex. The longest SOX losing streak since 2008 is a sentiment marker.", "tweetA": "SOX: eight straight down days, longest since 2008. Meta has moved 20% or more eight times in twelve months. The AI trade is now a volatility asset, not a quality compounder.", "tweetB": "Portfolio -13% in October and still +45% YTD. That's the real description of this trade: huge drawdown inside a huge year. $SOXX $NVDA", "charts": {"count": 1, "hot": false, "desc": "Portfolio vs SOXX performance chart"}, "link": "https://www.marketsentiment.co/p/ms-portfolio-update-nov26"}, {"id": 22, "cat": "AI/infra", "urgency": "deep", "source": "David Rosenberg / Early Morning with Dave", "title": "Rosenberg: both sides of the AI trade faltering at once - the spenders and the suppliers", "idea": "Spenders were sold for spending too much (hurting FCF); the hyperscalers with the largest 2027 capex increases are the ones underperforming YTD. Suppliers were sold because spending isn't accelerating. 'When stocks on both sides of the same trade fall on opposite news, the problem is the trade itself.' Market pricing a lower return on AI spending.", "angle": "Both buyers and sellers of capex fall = the return on invested capital is repriced, not the volume.", "tweetA": "The spenders sold off because they're spending too much. The suppliers sold off because the spending isn't accelerating. When both sides of one trade drop on opposite news, the trade itself is the problem.", "tweetB": "Rosenberg's point is the cleanest formulation of the AI ROIC debate: the market is telling you the return on spend is lower, not the amount.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.earlymorningwithdave.com/p/bargain-hunters-come-in-to-start"}, {"id": 23, "cat": "macro", "urgency": "deep", "source": "Blind Squirrel Macro", "title": "'Black Monday?' - S&P was only -56bp on the week and 5% off its high", "idea": "Blind Squirrel opens by noting screeching headlines were incompatible with an S&P down only 56bps on the week and ~5% off the all-time high. Weekend flagship covers Anthropic IPO and valuation. BUSHY beta portfolio gave back ground but weathered a tough October. Rest is paywalled.", "angle": "The gap between headline panic and index damage = rotation, not capitulation (matches Authers' equal-weight data).", "tweetA": "Headlines: Black Monday. Reality: S&P -56bps on the week, 5% off the high. The index is a poor description of what just happened inside it.", "tweetB": "Look at what moved: SOX -7% in a day, S&P -0.56% on the week. The damage is concentrated, and concentration is how bubbles deflate quietly.", "charts": {"count": 1, "hot": false, "desc": "BUSHY vs VTTHX performance chart"}, "link": "https://www.blindsquirrelmacro.com/p/black-monday"}, {"id": 24, "cat": "labor", "urgency": "deep", "source": "Danielle DiMartino Booth / Daily Feather", "title": "ECI: Q3 +0.8% q/q, 3.37% y/y - a cycle low vs 5.11% peak", "idea": "Employment Cost Index rose 0.8% q/q (in line, slowest since Q4 2025). Y/Y is 3.37%, a cycle low, continuing the downtrend from 5.11% in Q2 2022. DiMartino Booth frames ECI as a guide to Fed policy, staffing and consumer spending. Opens with the mercury-poisoned hatters etymology of 'mad as a hatter'.", "angle": "Wage growth is not the inflation source - the Fed's hike case rests on AI-hardware goods prices instead.", "tweetA": "Employment costs at 3.37% y/y: a cycle low, 175bp below the 2022 peak. If the Fed hikes, it isn't wages it's responding to.", "tweetB": "Compare ECI 3.37% to Dauber's note that AI hardware adds 0.18 to core PCE. The inflation is in the capex, not the paycheck.", "charts": {"count": 4, "hot": false, "desc": "Quad charts of ECI components"}, "link": "https://dimartinobooth.substack.com/p/the-daily-feather-mad-as-a-hatter"}, {"id": 25, "cat": "culture", "urgency": "watch", "source": "Danielle DiMartino Booth / Daily Feather", "title": "Why 'mad as a hatter': mercury felt-making - and John Wilkes Booth's killer was a hatter", "idea": "From the 1820s, hat makers used liquid mercury to felt fur; poorly ventilated workshops led to mercury poisoning with hallucinations and erratic behaviour. Boston Corbett, the soldier who shot John Wilkes Booth, was a hatter who was later committed to an asylum, escaped and vanished.", "angle": "Occupational toxicology as the origin of an idiom. Useful for a 'hidden costs of industrial processes' thread.", "tweetA": "'Mad as a hatter' is occupational disease: mercury in felt-making. The industrial revolution's externalities were literally in the language long before they were in the accounts.", "tweetB": "The man who shot Lincoln's killer was himself poisoned by his trade. A reminder that every boom has a body count nobody puts in the P&L.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://dimartinobooth.substack.com/p/the-daily-feather-mad-as-a-hatter"}, {"id": 26, "cat": "macro", "urgency": "deep", "source": "Peter Boockvar", "title": "BoJ accelerates ETF sales: 110 years to unwind becomes 43", "idea": "Under the new cadence the BoJ's ETF stock will take 'just' 43 years to sell, versus 110 years previously. Because holdings have gains, surplus is remitted to the government and could be spent in the next Takaichi budget. 10y JGB yield is ~3% vs 0.04% five years ago.", "angle": "Central bank exiting equity ownership by fiscal channel: a stealth funding source for Takaichi.", "tweetA": "The BoJ's ETF book: 110 years to sell becomes 43. Gains get remitted to the Treasury, which Takaichi can spend. Japan found a way to turn QE exit into a fiscal stimulus.", "tweetB": "10y JGB: 0.04% five years ago, ~3% now. The BoJ isn't just exiting, it's being forced out by a bond market that wants to be paid.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://peterboockvar.substack.com/p/only-43-more-yearsdefault-ratesrentsearningspmis"}, {"id": 27, "cat": "credit", "urgency": "deep", "source": "Peter Boockvar", "title": "Fitch private credit default rate 6.3% - highest on record; stress is in industrials, not software", "idea": "Fitch's Q3 private credit TTM default rate rose to 6.3% (6.0% Q2), the highest since tracking began; most 'defaults' are stressed maturity extensions, interest deferrals and PIK. Software only 0.6%; Industrials/Manufacturing and Consumer Products & Services 9.7% each; Healthcare providers 8.7% (from 9.4%).", "angle": "The consensus fear (software, AI disruption) is not where the defaults are.", "tweetA": "Fitch private credit defaults: 6.3%, a record. Software, where everyone's been looking? 0.6%. Industrials and consumer: 9.7%. The private-credit scare is being fought in the wrong sector.", "tweetB": "Most of these 'defaults' are PIK toggles and maturity extensions. A 6.3% rate that nobody calls a default is what extend-and-pretend looks like in the data.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://peterboockvar.substack.com/p/only-43-more-yearsdefault-ratesrentsearningspmis"}, {"id": 28, "cat": "macro", "urgency": "deep", "source": "Peter Boockvar", "title": "Apartment List: US rent growth flips positive y/y for the first time in 3+ years (+0.1%); 32% of properties offering concessions", "idea": "New-lease rents -0.3% m/m in October, +0.1% y/y, first positive in over three years. Vacancy 7.0% (down 0.1) but concessions at 32% of properties, 4pts higher YoY. Sun Belt and Mountain West rebounding, Northeast/Midwest still rising. Boockvar adds renewal rates run 3-4% higher per REITs.", "angle": "Rent flipping y/y positive as the multifamily supply wave ends, which matters for shelter in CPI.", "tweetA": "Rent growth turned positive year-over-year for the first time in 3 years, while 32% of landlords are still offering concessions. The supply wave is ending but the demand side isn't stronger, it's just that no new supply is coming.", "tweetB": "Shelter was the one disinflationary leg left in CPI. If the Sun Belt supply digestion is complete, that leg is gone. $EQR $AVB", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://peterboockvar.substack.com/p/only-43-more-yearsdefault-ratesrentsearningspmis"}, {"id": 29, "cat": "energy", "urgency": "deep", "source": "Dark Side of the Boom", "title": "AI power squeeze: 39GW to 108GW data-centre demand by 2030; MS sees a 70GW gross shortfall through 2028; 500k workers needed", "idea": "Goldman: US data-centre power requirement 39 GW in 2025 to 108 GW in 2030. September had a decade-high 5.6 GW of net additions, mostly solar and batteries; much of the gas capacity arrives 2028-2030. Morgan Stanley: 70 GW gross shortfall through 2028. Goldman: power industry needs 500,000+ extra workers by 2030, plus shortages of turbines, transformers and transmission staff.", "angle": "The mismatch is timing and type (solar/batteries now, gas later) plus labour, not just MW.", "tweetA": "Data-centre power demand: 39 GW (2025) to 108 GW (2030). September added a decade-high 5.6 GW, mostly solar and batteries, while the gas shows up in 2028-2030. The grid is solving a baseload problem with intermittent supply.", "tweetB": "500,000 more workers needed. You can't bid up electricians the way you bid up GPUs. Labor, not capital, is the binding constraint on AI power.", "charts": {"count": 2, "hot": false, "desc": "Charts inside - worth opening (GW demand vs additions)"}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-power-squeeze-wall-street"}, {"id": 30, "cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom", "title": "Equal-weight S&P beat cap-weight by the widest monthly margin since April 2009; Nasdaq P/E 28x to 19x", "idea": "Via Authers: the October equal- vs cap-weight gap is the widest since April 2009. Nasdaq 100 down ~9% from peak while equal-weight keeps advancing. Nasdaq 100 P/E compressed from ~28x to ~19x with earnings up 17% in three months (2x S&P). Alphabet lost >$530B in market cap. Truist: IT sector at 18.2x implies ~6,600 (about 2% below), average pullback implies another ~8%. Risks: model competition, power constraints, another Fed hike.", "angle": "A rotation inside a bull market, not yet a regime change - if QQQ/TLT holds its channel.", "tweetA": "Equal-weight S&P just beat cap-weight by the most since April 2009. Nasdaq P/E went 28x to 19x while earnings rose 17% in three months. The market isn't cutting earnings, it's cutting what it will pay for them.", "tweetB": "The thing to watch isn't the Nasdaq, it's QQQ/TLT. The channel is still intact. If it breaks, rotation becomes regime change. Bonds are the referee here.", "charts": {"count": 3, "hot": true, "desc": "Equal-weight vs cap-weight monthly gap; Nasdaq vs EW divergence; Nasdaq 100 forward P/E; QQQ/TLT channel"}, "link": "https://thedarksideoftheboom.substack.com/p/wall-streets-ai-premium-is-evaporating"}, {"id": 31, "cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom", "title": "Goldman's seven signs: HF net leverage near drawdown-above-20% levels; 80% of S&P stocks rise on down-index days", "idea": "Goldman's Brian Garrett: hedge funds are positioned for a deeper correction than the S&P has delivered (net leverage near levels historically associated with 20%+ drawdowns). Implied correlation near historical lows, 80% of constituents can rise on an index-down day, and bonds are hedging AI weakness again. Defensive equities are expensive; systematic selling remains a near-term obstacle. Post is excerpted.", "angle": "Extreme dispersion + low implied correlation = single-stock risk is high but index-vol is underpriced.", "tweetA": "80% of S&P 500 stocks can rise on a day the index falls. Implied correlation is near its historical low. That's not a bear market, it's a funeral for the cap-weighted index.", "tweetB": "Hedge funds positioned for a 20%+ drawdown that hasn't come. Either they're right and it's coming, or the shorts get squeezed. Both are tradable. $SPY", "charts": {"count": 1, "hot": false, "desc": "Charts inside - worth opening (HF net leverage, implied correlation)"}, "link": "https://thedarksideoftheboom.substack.com/p/wall-streets-ai-unwind-goldman-finds"}, {"id": 32, "cat": "venture", "urgency": "deep", "source": "Noahpinion", "title": "Anthropic would need to be worth $32T by the early 2040s to match Facebook's post-IPO return", "idea": "Noah Smith on the Anthropic IPO ($1.5-2T estimated): a Google-IPO-like 130x would need $200-260T by the late 2040s; Facebook's ~16x needs ~$32T by the early 2040s, six times the most valuable company in 2026. 7% nominal GDP growth only makes the economy 2.75x bigger by 2041. So Anthropic must capture a rising share of value; it's already making an operating profit and gets 3x+ more revenue per compute dollar than a year ago. Gemini 4 Carbon just took the lead on some measures.", "angle": "The IPO math forces a 'moat is intelligence itself' thesis; otherwise the AI-as-solar/airlines outcome.", "tweetA": "Anthropic at $2T needs to hit $32T to match Facebook's post-IPO return. That's six times the largest company on earth today. The math only works if intelligence itself is the moat, which is a very different bet from 'good product'.", "tweetB": "Anthropic earns 3x the revenue per compute dollar vs a year ago and is profitable. That's the only fact that stops this from being an airline. $NVDA $GOOGL", "charts": {"count": 3, "hot": false, "desc": "Charts inside - worth opening (operating profit, revenue per compute dollar, market share)"}, "link": "https://www.noahpinion.blog/p/anthropics-moat-is-claude"}, {"id": 33, "cat": "venture", "urgency": "act", "source": "Michael Parekh / AI Ramblings Daily", "title": "OpenAI raising less than half its target: ~$11B at $1.25T vs $30B at $1.4T; Anthropic Q2 revenue $11.6B vs OpenAI $6.7B", "idea": "WSJ: OpenAI has ~$11B committed at $1.25T. FT: it cut its target by $10B to ~$20B. UAE investors including MGX expected to lead, with Founders Fund, Coatue, Sequoia, a16z and SoftBank. Anthropic more than doubled Q2 revenue to $11.6B with a small operating profit; OpenAI grew ~18% to $6.7B. Anthropic IPO is expected before Thanksgiving.", "angle": "Funding market reading: the #2 is being forced to scale back while the #1 prepares a $1.5-2T listing.", "tweetA": "OpenAI just cut its raise by a third. Anthropic Q2 revenue $11.6B, OpenAI $6.7B. The company that started the race is now raising at a discount to a competitor that's going public before Thanksgiving.", "tweetB": "If your IPO bar is 'sustain a trillion', you don't want to learn the market's price in a flat private round. OpenAI's first mark is no longer the one it wanted.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/coming-for-the-king-in-ai-openai"}, {"id": 34, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily", "title": "SK Hynix: $75B shareholder returns, profit up 7x, HBM sold out through 2029; Samsung says 2027", "idea": "SK Hynix operating profit jumped sevenfold and it committed ~$45B more to shareholders (~$75B total this year). It says it's sold out on HBM and other memory through 2029; Samsung says through 2027, chip profit up 15x but missed estimates, capex +60% and shareholder return plan delayed to end-January, shares -7%. CXMT and YMTC are numbers four and five.", "angle": "Memory is the one AI sub-sector with multi-year visibility and capital return. Samsung's capex surge is the cyclical risk.", "tweetA": "SK Hynix: profit up 7x, $75B returned to shareholders, sold out through 2029. Samsung: profit up 15x, capex +60%, stock -7%. Same market, opposite reaction. The market is paying for discipline, not growth. $000660", "tweetB": "A supplier that's sold out for 3 years is doing buybacks. A supplier raising capex 60% to catch up is being sold. Capital discipline in a shortage is the signal.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/coming-for-the-king-in-ai-openai"}, {"id": 35, "cat": "tech", "urgency": "act", "source": "Michael Parekh / AI Ramblings Daily", "title": "DeepSeek's open-source Super-Agent targets Claude Code; DeepSeek just raised ~$15B", "idea": "DeepSeek released 'Super-Agent', an open-source prototype coding agent that watches developer group chats, spots problems and suggests fixes proactively. It follows a ~$15B raise (one of China's largest rounds) after $7.4B in June, ahead of its own IPO. Parekh notes Alibaba is on track for 5-10 trillion-parameter models.", "angle": "Open-weight, proactive coding agents with $22B of capital: the 'no moat' bear case from Noah's piece, live.", "tweetA": "DeepSeek raised ~$22B in five months and shipped an open-source agent aimed at Claude Code. The 'moat' debate just got a Chinese open-source entrant with a real balance sheet.", "tweetB": "Claude Code is the single product that made Anthropic the front-runner. DeepSeek is going after the one asset that justifies the $2T. That is the pitch for the open-weight YC category, too.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/coming-for-the-king-in-ai-openai"}, {"id": 36, "cat": "tech", "urgency": "watch", "source": "Michael Parekh / AI Ramblings Daily", "title": "Meta built a humanoid prototype ('Max') with China's Fourier in three months; hiring in Shanghai and Shenzhen", "idea": "Per The Information: Meta built the prototype with Fourier in three months and is working on v2, hiring in Shanghai and Shenzhen for mass production, while Washington clamps down on imports of Chinese humanoids. Parekh: China made almost all humanoids shipped worldwide; millions of humanoids unlikely before 2031, 'where self-driving cars were in 2004'.", "angle": "US hyperscalers relying on Chinese supply chains for physical AI, even as the FCC blocks Chinese robots.", "tweetA": "Meta built a humanoid in three months using a Chinese startup, and is hiring in Shenzhen. Washington is banning Chinese humanoid imports at the same time. Policy and corporate strategy are heading in opposite directions.", "tweetB": "China made almost all the humanoids shipped worldwide. The 'Made in America' robot rule needs 65% domestic content. Both of those can't be true on the same timeline.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/coming-for-the-king-in-ai-openai"}, {"id": 37, "cat": "venture", "urgency": "deep", "source": "The Founders Corner", "title": "YC Winter 2027: 'Wall Street for the Physical Buildout' - banks underwrite a robot like a forklift", "idea": "Brad Flora's YC request: the buildout needs financing instruments that don't exist yet - a lender for robots that each earn $500k/year, put options on GPU capacity. YC notes every great buildout (rail, electricity, telecom) created giant financial companies. Overall list: 11 categories, zero consumer, zero crypto; 'AI's biggest bottlenecks are moving beyond the models.'", "angle": "VC's own signal that financing, not models, is the bottleneck; consumer and crypto dropped off the list.", "tweetA": "YC's newest request: financing for the physical AI buildout. 'Banks underwrite a robot like a forklift.' Every previous infrastructure boom created a giant financial company. This one hasn't yet. Who's going to be it?", "tweetB": "No consumer apps. No crypto. Eleven categories about atoms, permits and air-gapped data. YC just told you where AI's bottleneck actually is.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/yc-just-published-its-startup-wishlist"}, {"id": 38, "cat": "AI/infra", "urgency": "deep", "source": "The Founders Corner", "title": "Transformers have 3-year lead times; the grain-oriented steel for cores comes from a single US plant", "idea": "Jared Friedman: the AI data-centre buildout is the largest US capital project in history. Non-obvious bottlenecks: large power transformers (3-year lead), switchgear, breakers and liquid cooling sold out; grain-oriented electrical steel made at one US plant that can't keep up.", "angle": "Specific supply-chain choke points that map to listed equities in electrical equipment.", "tweetA": "Large power transformers: three-year lead time. The electrical steel in their cores comes from one US plant. We're trying to build the largest capex project in history through a single factory. $ETN $GEV $HUBB", "tweetB": "Everyone's long GPUs and power. The scarcest item in the stack is a piece of grain-oriented steel. Boring is where the pricing power is.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/yc-just-published-its-startup-wishlist"}, {"id": 39, "cat": "geopolitics", "urgency": "deep", "source": "The Founders Corner", "title": "Robots Made in America: >65% domestic content (75% by 2029); China made 94% of the world's sintered rare-earth magnets", "idea": "Diana Hu: US installed 38,400 industrial robots in 2025 (+12%), mostly imported. China made 94% of sintered rare-earth magnets in 2024; April 2025 export restrictions forced some automakers to cut output. FCC stopped authorising new connected mobile robot models unless US-made or exempt; rule needs >65% domestic component cost, rising to 75% in 2029. Assembly alone doesn't qualify.", "angle": "Regulatory moat for domestic motors, magnets, gears, sensors. Direct conflict with Meta's China-built humanoid.", "tweetA": "94% of the world's sintered rare-earth magnets are made in China. The FCC now requires >65% domestic component cost for new connected robots, rising to 75% by 2029. Assembly won't clear it. Magnets, gears and encoders will.", "tweetB": "A rule that says 65% domestic parts for robots, from a country whose magnet supply is 6% domestic. Somebody is going to make a lot of money in unglamorous components.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/yc-just-published-its-startup-wishlist"}, {"id": 40, "cat": "labor", "urgency": "watch", "source": "The Founders Corner", "title": "'The $15-an-Hour Expert': AI turns credential-gated work into trained-workforce businesses", "idea": "Brad Flora's contrarian entry: instead of replacing workers, AI that lets capable people without credentials do specialist work (benefits, taxes, insurance claims, medical billing, immigration paperwork). 'The last industrial revolution built a middle class from factory jobs; this one could build it from expert jobs.' The company is the workforce, not the software.", "angle": "A labour-market thesis: credentials as the bottleneck being arbitraged by AI.", "tweetA": "YC's most interesting bet isn't a model. It's AI turning a $15-an-hour worker into a medical-billing specialist. The credential, not the work, was the scarce thing.", "tweetB": "The last revolution built a middle class from factory jobs, YC says this one could do it from 'expert' jobs. That's the optimistic version of the labor displacement story, and it's a services business, not SaaS.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/yc-just-published-its-startup-wishlist"}, {"id": 41, "cat": "tech", "urgency": "watch", "source": "The Founders Corner", "title": "YC: LLMs got worse at writing as they got better at code - and 'Starship at 10,000 launches/year' as a business-model timing bet", "idea": "Jared Friedman: reward signals that make models good at code flatten voice and style; models now sound more robotic than 2024-25 versions. Also Ankit Gupta: SpaceX projects 10,000 Starship launches a year; expendable Starship already close to a reusable Falcon 9 on cost; ask is for businesses that only work if launch is 100x cheaper.", "angle": "Two timing bets: model training priorities (RL on code) and launch cost curves.", "tweetA": "YC thinks LLMs have gotten worse at writing, and the reason is RL on code. Optimising for the thing you can verify flattens the thing you can't.", "tweetB": "10,000 Starship launches a year would reset the cost curve by orders of magnitude. YC is already asking for companies that only exist at that price. Early on purpose.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/yc-just-published-its-startup-wishlist"}, {"id": 42, "cat": "regulation", "urgency": "watch", "source": "The Founders Corner", "title": "'AI for City Hall' and 'Plaid for Government Benefits': permits 10x faster = $16B a year in extra city tax revenue; Medicaid six-month rechecks from 2027", "idea": "Gustaf Alströmer: if every US building permit were approved in 10% of current time, cities would gain $16B/yr in tax revenue; 19,000 cities still mostly do it by hand. Second: a consent-based verification layer for benefits - GAO estimates fraud costs up to half a trillion dollars a year; from 2027 states must re-check millions of Medicaid enrolees every six months.", "angle": "A dated forcing function (Medicaid) plus a large, quantified permit-delay cost.", "tweetA": "10x faster permits would add $16B a year in tax revenue across 19,000 US cities, most of which still process them by hand. That's a government efficiency gain that's mostly a software problem.", "tweetB": "From 2027 states must re-verify millions of Medicaid enrollees every six months. Verified-once, apply-everywhere is a hard legal wedge, not a nice-to-have.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/yc-just-published-its-startup-wishlist"}];

var COL={macro:"#e24b4a",credit:"#378add",positioning:"#ef9f27","AI/infra":"#1d9e75",crypto:"#7f77dd",geopolitics:"#d85a30",energy:"#f97316",tech:"#06b6d4",gold:"#d4a017",culture:"#ec4899",labor:"#8b5cf6",regulation:"#64748b",science:"#14b8a6",venture:"#84cc16"};
var UE={act:"🔴",deep:"🔵",watch:"🟡"};
var fc="all",fu="all",fs=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function toggle(id){document.getElementById('c'+id).classList.toggle('open');}
function setC(c){fc=c;fs=null;collapse();render();}
function setU(u){fu=u;fs=null;collapse();render();}
function filterBySrc(name){fs=name;fc="all";fu="all";render();
  ITEMS.forEach(function(i){var e=document.getElementById('c'+i.id);if(e&&i.source.indexOf(name)!==-1)e.classList.add('open');});window.scrollTo(0,0);}
function collapse(){ITEMS.forEach(function(i){var e=document.getElementById('c'+i.id);if(e)e.classList.remove('open');});}
function pills(){
  var cats={};ITEMS.forEach(function(i){cats[i.cat]=(cats[i.cat]||0)+1;});
  var h='<span class="pill'+(fc==="all"?' on':'')+'" style="'+(fc==="all"?'background:#333':'')+'" onclick="setC(\'all\')">All '+ITEMS.length+'</span>';
  Object.keys(cats).forEach(function(c){var on=fc===c;h+='<span class="pill'+(on?' on':'')+'" style="'+(on?'background:'+COL[c]:'')+'" onclick="setC(\''+c+'\')">'+c+' '+cats[c]+'</span>';});
  document.getElementById('cats').innerHTML=h;
  var u='';[["all","All"],["act","🔴 Act Now"],["deep","🔵 Deep"],["watch","🟡 Watch"]].forEach(function(p){
    var n=p[0]==="all"?ITEMS.length:ITEMS.filter(function(i){return i.urgency===p[0];}).length;
    var on=fu===p[0];u+='<span class="pill'+(on?' on':'')+'" style="'+(on?'background:#333':'')+'" onclick="setU(\''+p[0]+'\')">'+p[1]+' '+n+'</span>';});
  document.getElementById('urg').innerHTML=u;
}
function card(item){
  var c=COL[item.cat]||"#888";
  var h='<div class="card" id="c'+item.id+'"><div class="hd" onclick="toggle('+item.id+')"><span class="num">'+item.id+'</span><span>'+UE[item.urgency]+'</span><span class="src" style="background:'+c+'">'+esc(item.source)+'</span><span class="tag">'+item.cat+'</span>'+(item.charts.hot?'<span>🔥</span>':(item.charts.count?'<span>📊</span>':''))+'<span class="ttl">'+esc(item.title)+'</span></div><div class="bd">';
  h+='<div class="lbl">THE IDEA</div><div>'+esc(item.idea)+'</div>';
  h+='<div class="lbl">MY ANGLE</div><div class="angle" style="border-color:'+c+';background:'+c+'14">'+esc(item.angle)+'</div>';
  h+='<div class="tw"><div><div class="lbl" style="color:#378add">TWEET A</div>'+esc(item.tweetA)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  h+='<div><div class="lbl" style="color:#7f77dd">TWEET B</div>'+esc(item.tweetB)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>';
  if(item.charts.count||item.charts.desc)h+='<div class="chart'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING - ':'📊 ')+esc(item.charts.desc||'Charts inside - worth opening')+'</div>';
  h+='<div style="margin-top:10px"><a href="'+item.link+'" target="_blank">↗ Read full article</a></div></div></div>';
  return h;
}
function render(){
  pills();
  var l=ITEMS.filter(function(i){return (fc==="all"||i.cat===fc)&&(fu==="all"||i.urgency===fu)&&(!fs||i.source.indexOf(fs)!==-1);});
  document.getElementById('list').innerHTML=l.map(card).join('');
}
function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';
  var r='<p>Window: '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</p><p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</p><b>Included sources (click to filter)</b><ul>';
  META.includedSources.forEach(function(s){r+='<li><span class="sl" onclick="filterBySrc(this.getAttribute(\'data-n\'))" data-n="'+esc(s.name)+'">'+esc(s.name)+'</span> - '+s.items+'</li>';});
  r+='</ul><b>Skipped</b><ul>';
  META.skippedSources.forEach(function(s){r+='<li>'+esc(s.name)+': '+esc(s.reason)+'</li>';});
  r+='</ul>';document.getElementById('rb').innerHTML=r;
  render();
}
init();
