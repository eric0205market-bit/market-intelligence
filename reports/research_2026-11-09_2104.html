<script>
const ITEMS = [{"id": 1, "cat": "regulation", "urgency": "deep", "source": "Unchained (Laura Shin)", "title": "401(k) alternatives rule hits OIRA 157 days after comments closed", "idea": "DOL sent the final 401(k) alternatives rule to the White House (logged Nov 5, 'economically significant'). The March 31 proposal gives fiduciaries who weigh six factors (fees, liquidity, valuation...) a judgment 'presumed reasonable' with 'significant deference'. It never names crypto. Sanders/Warren/Scott asked to rescind on June 1.", "angle": "Crypto gets in through a safe-harbor process rule, not a mandate. The flow story is plan-consultant behavior, not the text.", "tweetA": "The 401(k) rule never says 'crypto'. It just tells fiduciaries that if they document six factors, nobody can second-guess them. That's how plan assets learn to say yes without anyone voting for it. $BTC $IBIT", "tweetB": "Everyone's waiting for a headline allocation. The real unlock is litigation risk going to zero for plan sponsors. ERISA lawyers move allocations, not Twitter.", "charts": {"count": 1, "hot": false, "desc": "Unchained market update image (not described in text)"}, "link": "https://unchainedcrypto.beehiiv.com/p/final-401-k-rule-touching-crypto-reaches-white-house"}, {"id": 2, "cat": "regulation", "urgency": "deep", "source": "Unchained (Laura Shin)", "title": "FinCEN scraps the $250 travel-rule proposal; $3,000 stays", "idea": "FinCEN and the Fed withdrew the 2020 plan to cut the international Travel Rule threshold from $3,000 to $250 and to define 'money' as including CVC. They cited the GENIUS Act and new legal frameworks; the 2020 plan drew ~3,000 comments, mostly opposed.", "angle": "Regulatory regime shift from enforcement-by-definition to statute-by-statute. Stablecoin law now sets the template.", "tweetA": "A rule proposed in 2020 to drag every crypto transfer over $250 into the Travel Rule is dead, and the reason cited is a stablecoin statute. Regulation by new law replaced regulation by old definitions. That's a regime change, not a footnote.", "tweetB": "Same week Treasury cuts MEXC off for $16B in illicit flows. Light touch on retail rails, hard cutoff on offshore venues. The perimeter is being redrawn, not loosened.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/final-401-k-rule-touching-crypto-reaches-white-house"}, {"id": 3, "cat": "crypto", "urgency": "act", "source": "Unchained (Laura Shin)", "title": "Binance CFO exits 9 days after a ~$6.3B hot wallet drain", "idea": "Kaiser Ng steps down as Binance CFO to found a tokenization startup (sports properties, GPUs, gold). Justin Yek from Airwallex replaces him. Yi He says it followed a six-month transition plan. It came nine days after attackers drained ~$6.3B from Binance hot wallets. CZ says YZi Labs is keen to back ex-colleagues.", "angle": "Largest-ever exchange loss plus a CFO swap plus country account closures. Counterparty risk is back in the BTC tape.", "tweetA": "$6.3B drained from hot wallets. CFO leaves nine days later 'per a six-month plan'. Maybe. But if you were holding size on the largest venue, the question isn't the plan, it's the proof of reserves.", "tweetB": "Funny detail: the CFO is leaving to tokenize gold, GPUs and basketball teams. The exchange that lost $6.3B is exporting its finance chief to the RWA narrative. $BNB", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/final-401-k-rule-touching-crypto-reaches-white-house"}, {"id": 4, "cat": "crypto", "urgency": "act", "source": "Unchained (Laura Shin)", "title": "Treasury cuts MEXC off ($16B), Binance exits 4 EU countries, GOPAX halts", "idea": "FinCEN order cuts MEXC from the US system over alleged $16B of sanctions evasion/illicit flows 2021-2026 (~$1.5B Russia-linked, ~$1B Iran-linked). Binance closes accounts in France, Spain, Italy, Poland on Dec 31 and adds a fee of max(0.025%, 10 USDC) from Nov 29. GOPAX (Binance holds 67.45% of its operator) halted trading Nov 6.", "angle": "Offshore exchange perimeter is contracting from three directions at once: US sanctions, EU licensing, Korean regulators.", "tweetA": "MEXC cut off, Binance leaving four EU markets, GOPAX withdrawals by email. Three different regulators, same week. Offshore liquidity is being herded onshore. Which venue's order book thins first?", "tweetB": "The Iran link in the MEXC release is the tell. Sanctions enforcement is now the crypto regulator. Watch which stablecoin rails get touched next.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/final-401-k-rule-touching-crypto-reaches-white-house"}, {"id": 5, "cat": "crypto", "urgency": "deep", "source": "Unchained (Laura Shin)", "title": "Chainalysis breach, Keplr/Web3Auth drain, Gnosis Pay data leak", "idea": "Chainalysis says password hashes and live tokens were exposed for all users; KYT and Address Screening return behind IP allowlists while Reactor stays offline. Web3Auth is moving exposed Keplr assets into recovery wallets (~$5.6M). Gnosis Pay disclosed a breach on legacy card systems, retiring them Dec 20.", "angle": "The compliance vendor that tracks hacks got hacked. Key-management and auth middleware are the soft target.", "tweetA": "The company every exchange uses to trace stolen funds had its own users' password hashes and live tokens exposed. Reactor is still offline. Who's tracing the next drain?", "tweetB": "Pattern: Binance hot wallets, Keplr logins, Chainalysis tokens, Gnosis Pay. It's never the chain. It's the login. Cybersecurity budgets in crypto are about to look like banks'.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/final-401-k-rule-touching-crypto-reaches-white-house"}, {"id": 6, "cat": "regulation", "urgency": "watch", "source": "Unchained (Laura Shin)", "title": "Nigeria forces offshore stablecoin issuers to license locally", "idea": "Central Bank of Nigeria requires offshore issuers selling stablecoins locally to incorporate, license and meet capital rules: minimum paid-up capital 10bn naira for naira-referenced issuers. Existing operators have until May 4, 2027.", "angle": "Dollar stablecoins are a monetary-sovereignty issue in the largest African economy. Expect copycats.", "tweetA": "Nigeria wants local capital behind any stablecoin sold in naira-land. 10bn naira minimum. Every EM central bank is reading this as a template for how to tax dollarization without banning it.", "tweetB": "Tether and Circle are growing on EM demand for dollars. The first big EM country to demand local incorporation is a revenue-model question for them, not a compliance one.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/final-401-k-rule-touching-crypto-reaches-white-house"}, {"id": 7, "cat": "crypto", "urgency": "deep", "source": "Unchained (Laura Shin)", "title": "Vitalik: ETH as store of value, not a fee-burn token; Strive prints $509M on BTC marks", "idea": "Vitalik says maximizing ETH's fee burn would cost decentralization and capture resistance, so ETH should aim to be a store of value while keeping EIP-1559. Separately, Strive booked $509M Q3 net income from a $533.7M unrealized BTC gain and holds 43,124 BTC after buying 15,124 in October. WLFI announced a buyback to 'consolidate voting power' without size or timing.", "angle": "ETH narrative drift from 'ultrasound money' to SoV just as BTC treasury accounting inflates earnings.", "tweetA": "Vitalik: ETH should be a store of value, not a burn machine. Ethereum is $2,106 and -6% on the day. The pitch that justified the multiple (burn) is being walked back by the founder while the price is making new lows.", "tweetB": "Strive's $509M 'net income' is $533.7M of unrealized BTC gain. Without it they lost $25M. Accounting marks are the product. What happens to the earnings when BTC is $70K?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/final-401-k-rule-touching-crypto-reaches-white-house"}, {"id": 8, "cat": "positioning", "urgency": "deep", "source": "All Star Charts (Alfonso De Pablos)", "title": "XLK/SPY momentum signals look 'eerily like early 2000'", "idea": "Alfonso De Pablos: exhaustion and initiation readings on the XLK/SPY ratio resemble early 2000, when the dot-com unwind began. Former leaders are completing topping patterns; the question is whether the market can rally without tech leading.", "angle": "Relative momentum on the group that carried the index is the signal, not absolute price. Pair with small/mid leading YTD (Bespoke).", "tweetA": "XLK/SPY momentum just printed the same signature as March 2000. Not the price, the relative momentum. The index has been a single trade for 3 years. What's the second trade it rotates into?", "tweetB": "Counterpoint: early 2000 had a 5% funds rate and no $1T capex cycle underneath. Rotation out of tech is only the same if earnings revisions turn too. Watch NVDA guidance, not the ratio. $XLK $SPY", "charts": {"count": 1, "hot": true, "desc": "XLK/SPY ratio chart with momentum exhaustion/initiation markers vs early 2000"}, "link": "https://www.allstarcharts.com/2026-11-03/growth-era-coming-end"}, {"id": 9, "cat": "crypto", "urgency": "act", "source": "Mando Minutes", "title": "Alts lead the crypto slump: 70% of Binance alts under the 200dma", "idea": "BTC $74,067 (-2%), ETH $2,106 (-6%), SOL $86 (-4%), BTC.D 60.2%, Fear&Greed 30, 24h liquidations $1.127B. BTC ETFs -$412M, ETH ETFs -$93M. 70% of Binance-listed alts are below their 200dma; Hyperliquid whales are piling into BTC shorts; BTC is at the bull-market support band; Bloomberg flags a year-end cascade risk under $80K.", "angle": "Breadth is the story: majors hold relative, alts break. Whale shorts on Hyperliquid mean the squeeze fuel is building.", "tweetA": "70% of Binance alts under the 200dma while BTC.D rises to 60%. The market isn't selling crypto, it's selling everything that isn't BTC. Whales short BTC on Hyperliquid. Who's on the other side?", "tweetB": "Fear & Greed at 30 with $1.1B liquidated is capitulation-lite, not capitulation. ETH ETF outflows of $93M on a -6% day tell me nobody bought the dip yet. $ETH $BTC", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-2-4902"}, {"id": 10, "cat": "regulation", "urgency": "deep", "source": "Mando Minutes", "title": "Voters reject AI data centers in 40 of 41 local measures", "idea": "Mando's AI & Tech list: voters rejected AI data centers in 40 of 41 US local measures; Bloomington votes to ban 'future' AI systems; Sanders pushes a national DC moratorium; the Senate eyes a bill to fast-track DCs and power grids; yet US DC construction is +90% y/y in September.", "angle": "Capex is running at +90% while the ballot box says no 40 of 41 times. The political risk premium on DC land and power is not in the multiples.", "tweetA": "Data center construction +90% y/y. Voters said no in 40 of 41 local votes. One of those is going to give, and it won't be the hyperscaler capex plan. It'll be the permitting map. $VRT $ETN", "tweetB": "Texas voted to pause new data centers, Sanders wants a national moratorium, and the Democrats just took both chambers. I'd want a haircut on any AI-power name whose thesis is greenfield sites in contested counties.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-2-4902"}, {"id": 11, "cat": "AI/infra", "urgency": "act", "source": "Mando Minutes", "title": "Anthropic: IPO roadshow starts this week, $1.5T target, $3.4B for gas generators", "idea": "Mando headline list: Anthropic IPO roadshow to start this week (Unusual Whales), now targeting a $1.5T valuation (FT), and paying $3.4B for gas-fired generators (FT).", "angle": "A $1.5T lab IPO lands into a -5.5% Nasdaq day. Supply of AI equity is about to jump.", "tweetA": "Anthropic roadshow this week at a $1.5T target, in a tape where Nasdaq just had its worst day since Liberation Day. Every dollar going into that book comes from somewhere. Guess where.", "tweetB": "Notice what the $3.4B is for: gas turbines, not GPUs. The binding constraint of the largest private AI lab is electrons. $GEV $VST", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-2-4902"}, {"id": 12, "cat": "AI/infra", "urgency": "deep", "source": "Mando Minutes", "title": "Microsoft unwinds Oracle AI cloud deal; Crusoe dumps Wyoming DC to Google; Terafab eyes 1M wafers/month", "idea": "Mando list: Microsoft is winding down its deal to rent AI cloud capacity from Oracle (Bloomberg); Crusoe sells its troubled Wyoming data-center project to Google; Elon's Terafab targets 1 million wafers a month; SpaceX plans a $24B AI supercomputer at Starbase; Tesla winds down Cybertruck for robotaxis.", "angle": "Capacity is being re-shuffled: weak lessors out, balance-sheet owners in. Funding quality is the filter.", "tweetA": "Microsoft winding down an Oracle capacity deal, Crusoe unloading a site to Google. Compute leases are being repriced by the people with the best balance sheets. $ORCL's backlog quality is now a question.", "tweetB": "1 million wafers a month is roughly TSMC-scale ambition from someone who doesn't own a fab. Either the cost curve for fabs is about to break, or Terafab is the next bubble marker. $TSM", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-2-4902"}, {"id": 13, "cat": "geopolitics", "urgency": "act", "source": "Mando Minutes", "title": "Houthis hit an Aramco tower in Riyadh; Iraq cuts a deal to ship oil past Hormuz; Ukraine hits Russia's #2 refinery", "idea": "Mando macro list: US strikes Iran near Hormuz again, Trump says new attacks unlikely; Houthis strike a Saudi Aramco tower in Riyadh; Iraq strikes a US deal to ship oil past Hormuz; Ukraine strikes Russia's second-largest refinery; UK blames Russia for sabotage across Europe; Rubio says Iran talks not productive; Treasury readies debt buybacks up to $95B.", "angle": "Three separate supply-side hits in one list while crude is -3% on 'deal hopes'. The price is trading headlines, not barrels.", "tweetA": "Houthis hit Aramco in Riyadh, Ukraine hits Russia's #2 refinery, Rubio says Iran talks 'not productive', and crude is -3.4% on 'no new attacks'. Somebody is wrong. $OXY $VLO", "tweetB": "Iraq getting a US deal to ship oil around Hormuz is the quiet one. It's a bypass bet: the market's pricing a closed strait as permanent. Pipeline and port capex follows.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-2-4902"}, {"id": 14, "cat": "macro", "urgency": "deep", "source": "Mando Minutes", "title": "China PPI at post-Covid high; Taiwan curbs short-selling after crash; Treasury buybacks up to $95B", "idea": "From Mando's macro list: China PPI hits its highest since the post-Covid era; Taiwan curbs short-selling after a stock crash; Treasury readies up to $95B of debt buybacks; Paraguay's Senate impeaches the president; Dems plan to block a $1.5T military budget.", "angle": "China's producer deflation ending is a global goods-price story. Taiwan's short ban is the AI-semis stress signal.", "tweetA": "China PPI at a post-Covid high. Taiwan banning short-selling after a crash. Those two lines are the same story: the world's upstream manufacturing hub is repricing at the same time its chip crown jewel is selling off. $TSM $EWT", "tweetB": "Everyone priced China as exporter of deflation. PPI turning is the first crack in that. Pair it with oil, and ex-US goods inflation isn't dead.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-2-4902"}, {"id": 15, "cat": "positioning", "urgency": "deep", "source": "KookLetter", "title": "Nasdaq -5.5% on Thursday; SOX -12%; base rate says buy", "idea": "KookLetter: Nasdaq fell 5.5% Thursday, SOX -12%, Mag7 lost over $1T, Nvidia lost $440B+ and turned negative YTD. Their stat: since 1980, buying the close of a 5%+ Nasdaq dump was higher 60 trading days later 31 of 48 times, median +7.1%; 6 of 7 in the last decade. They sold STRC near $99.73 and bought SPCX at ~$124.50 avg.", "angle": "31/48 is a 65% hit rate, which is thin for the label 'strong dip to buy'. Also what the cause was: policy risk to data centers, not earnings.", "tweetA": "'31 of 48 times higher 60 days later' sounds great until you notice it's 65%, and the failures are the cases where the cause was structural, not a flush. Which one is this?", "tweetB": "Thursday's trigger wasn't earnings, it was a Democratic House raising data-center rules risk. A policy-driven -5.5% is a different animal than a liquidity-driven one. Base rates don't care about the cause. I do.", "charts": {"count": 2, "hot": true, "desc": "Nasdaq selloffs chart (>5% days and subsequent returns), plus SOL/BTC trade setup chart"}, "link": "https://vault.kookletter.com/p/thursday-was-the-worst-day-since-liberation-day-we-bought-it"}, {"id": 16, "cat": "macro", "urgency": "deep", "source": "KookLetter", "title": "Weekly tape: S&P -2.7% to 7,377, oil -13% to $91, BTC ETFs -$1.28B worst since June", "idea": "7-day moves to Nov 8: S&P -2.7% (7,377), Nasdaq -3.4%, NVDA -9.3% in one session; payrolls +165K, unemployment 4.1%; 10-year 4.86%; oil -13% to $91 on US-Iran deal hopes; BTC ~-3% to ~$75.8K; HYPE -13% to ~$77; Treasury orders halt of transfers to/from MEXC.", "angle": "10-year at 4.86% with oil falling is a real-rates squeeze on equity duration.", "tweetA": "10-year at 4.86%. Oil down 13% in a week. Payrolls 165K. Equities still sold off. That's not a growth scare, that's a discount-rate problem hitting the longest-duration asset on the board. $QQQ", "tweetB": "Oil -13% in a week should be a tailwind for inflation prints. If CPI this week still surprises up, the Fed has nowhere to hide.", "charts": {"count": 3, "hot": false, "desc": "7-day change table and market pulse images"}, "link": "https://vault.kookletter.com/p/thursday-was-the-worst-day-since-liberation-day-we-bought-it"}, {"id": 17, "cat": "crypto", "urgency": "deep", "source": "Ecoinometrics", "title": "BTC lowest since August, nearing 200dma; Nasdaq 'loses its favorable growth regime'", "idea": "Ecoinometrics: BTC is back below $75K, its lowest since August and uncomfortably close to its 200-day. Nasdaq's sharp AI selloff and midterm uncertainty add to fragility; ETF outflows continue and the Nasdaq loses its favorable growth regime. Their 'Decision' is paywalled.", "angle": "BTC trading as beta to Nasdaq growth regime again, decoupling thesis is dead for now.", "tweetA": "Bitcoin and the Nasdaq just flipped back to the same regime. If your 'uncorrelated asset' needs the AI trade to hold up, it isn't uncorrelated. It's a 3x-levered duration trade. $BTC", "tweetB": "The 200-day is the only line that matters this week. Hyperliquid whales are short into it. Either we get a squeeze or a clean break with $80K as resistance for months.", "charts": {"count": 1, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://ecoinometrics.substack.com/p/bitcoins-recovery-is-at-risk-as-the"}, {"id": 18, "cat": "science", "urgency": "act", "source": "Import AI (Jack Clark)", "title": "AI proves a 2008 quantum conjecture; Lean accepts the proof on day three", "idea": "Physical Superintelligence says its system, running a non-public Anthropic model, proved the Aaronson-Ambainis conjecture (open since 2008, on when quantum computers can be exponentially faster). The full proof was ready on day 3 of the run, verified by Lean, then improved twice on related problems. Jack Clark calls it a taste of the singularity.", "angle": "Machine-verified math from an unreleased model. 'Remarkable to unremarkable' pace.", "tweetA": "A 17-year-old open problem in quantum complexity was closed in three days by an AI system, and Lean checked every step. The proof doesn't need to be trusted. That's the part that changes how fast science can move.", "tweetB": "Note it used a non-public Anthropic model, in the same week Anthropic starts an IPO roadshow. The product demo for a $1.5T valuation just got a theorem attached.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://importai.substack.com/p/import-ai-480-self-sustaining-space"}, {"id": 19, "cat": "science", "urgency": "watch", "source": "Import AI (Jack Clark)", "title": "A Moon factory for 12-41 MT of launch mass, $1.5-4.2B at Starship list prices", "idea": "A 2016 NASA KSC paper says a self-expanding lunar industry needs only 12 MT (reduced) to 41 MT (baseline, two orders of magnitude bigger industry) delivered. Starship lifts 100 MT to LEO; with orbital refueling Clark estimates $1.5B-$4.2B to land that on the Moon. Six manufacturing generations ending with local chip fabs.", "angle": "The cost of bootstrapping off-Earth industry is now a rounding error next to AI capex: Anthropic just paid $3.4B for generators.", "tweetA": "$1.5-4.2B to land a self-replicating factory seed on the Moon. Anthropic just paid $3.4B for a slot in a generator queue. We're pricing off-Earth industry below a single AI power order. $RKLB $SPCX", "tweetB": "The 2016 paper expected mouse-level robot intelligence by 2030 and human by 2050. We're there now. The binding constraint moved from AI to launch cadence.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://importai.substack.com/p/import-ai-480-self-sustaining-space"}, {"id": 20, "cat": "AI/infra", "urgency": "watch", "source": "Import AI (Jack Clark)", "title": "Core Automation trains a 32B MoE across US and Asia clusters 9,000 miles apart", "idea": "Core Automation (ex-OpenAI/Google founders) trained a ~32B-param, 32x-sparse MoE across 160 B300s in the US and 160 GB300s in Asia, mixed accelerators, syncing every 50 steps with fragment-by-fragment staggered sync. Bottleneck is 'power, grid equipment and land' not chips.", "angle": "Training spread over heterogeneous islands lowers the power-site constraint, which is where the political fight is (see voters 40/41).", "tweetA": "A 32B MoE trained across two continents on different chip generations. If compute islands work, the 1GW single-campus premium goes away. Bad for whoever's rezoning farmland. $NVDA $CRWV", "tweetB": "The sentence to circle: 'bottleneck is power, grid equipment and land'. Same week voters reject data centers 40 of 41. Distributed training is the hedge for the permitting problem.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://importai.substack.com/p/import-ai-480-self-sustaining-space"}, {"id": 21, "cat": "tech", "urgency": "watch", "source": "Import AI (Jack Clark)", "title": "Meta's Tactus glove: the sensor hardware for robot data collection", "idea": "Meta Reality Labs published Tactus, a 1.5mm 3D-knit glove with capacitive fingertip sensors and IMU-fused pose tracking for occlusion-resilient manipulation data. Clark's lens: it's the hardware an autonomous AI might pay humans to wear.", "angle": "Humanoid data collection is moving from teleop and cameras to wearables. Labor-as-data-provider.", "tweetA": "Meta built a glove that records fingertip force and hand pose through occlusion. That's not a consumer product, that's a training-data collection rig. Next gig-economy job: wear the glove, teach the robot.", "tweetB": "Clark's lens (how would an AI use this) is a good filter for every hardware paper. I'd add: which supplier makes the capacitive textile? That's the picks-and-shovels trade.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://importai.substack.com/p/import-ai-480-self-sustaining-space"}, {"id": 22, "cat": "energy", "urgency": "deep", "source": "Exponential View (Azeem Azhar)", "title": "Anthropic pays $3.4B to take over a 1.7GW gas generator order slot", "idea": "Exponential View: Anthropic paid $3.4B to take over a supplier's two-year-old order for 1.7GW of gas generators, the largest known power-equipment purchase by an AI lab.", "angle": "That's about $2B per GW for a place in line, before fuel, grid or interconnect. Queue position is now the asset.", "tweetA": "$3.4B for 1.7GW is $2M per MW just to inherit someone's place in line, before a single turbine is installed. When the buyer pays for the queue slot, the equipment makers have pricing power through 2028. $GEV $CAT", "tweetB": "Anthropic going gas-fired instead of waiting on the grid tells you how long interconnect queues really are. 2,000 GW waiting (a16z) is the other half of this story.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.exponentialview.co/p/monday-data-09-11-2026"}, {"id": 23, "cat": "venture", "urgency": "deep", "source": "Exponential View (Azeem Azhar)", "title": "VC 2026 is two giants: ex-a16z fundraising looks like 2025; ex-SpaceX exits like last year", "idea": "Exponential View data: take a16z out and US VC fundraising looks much like 2025; without SpaceX, 2026 exits are close to 2025's.", "angle": "The venture 'boom' is two data points. Concentration risk at the index level of private markets.", "tweetA": "Strip out a16z and 2026 VC fundraising is a 2025 repeat. Strip out SpaceX and exits are flat. 'Record year' is two names. And one of them just got a $24B supercomputer plan.", "tweetB": "Private markets have the same Mag7 problem public markets have. When SpaceX IPO supply comes, the next tell is whether LPs recycle or sit.", "charts": {"count": 0, "hot": false, "desc": "Charts in the paid library"}, "link": "https://www.exponentialview.co/p/monday-data-09-11-2026"}, {"id": 24, "cat": "AI/infra", "urgency": "deep", "source": "Exponential View (Azeem Azhar)", "title": "Apple's memory inventory up 2.5x y/y", "idea": "Apple's memory inventory grew 2.5x year on year, which Exponential View reads as protection against memory cost increases.", "angle": "Hoarding memory = the hyperscalers' DRAM/HBM squeeze is hitting consumer electronics margins.", "tweetA": "Apple grew its memory inventory 2.5x in a year. When the world's best supply-chain operator stockpiles a component, it's telling you the price curve it sees. $MU $000660.KS", "tweetB": "Goldman's tech desk says memory pricing is 'exceptionally strong'. Apple is front-running that. Who's the marginal DRAM buyer in 2027, and can they afford it?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.exponentialview.co/p/monday-data-09-11-2026"}, {"id": 25, "cat": "labor", "urgency": "deep", "source": "Exponential View (Azeem Azhar)", "title": "AI-exposed workers take about a month longer to find new jobs", "idea": "Workers let go from AI-exposed roles in 2025 took about a month longer than peers in other roles to get re-employed.", "angle": "First hard micro-data that displacement shows up as duration, not headline unemployment. Pair with the Black Swan mortgage chain.", "tweetA": "One extra month of unemployment doesn't sound like much. At scale it's the difference between a 4.1% unemployment rate and a 4.6% one. Duration is where AI displacement hides in the data first.", "tweetB": "Job openings don't fall, rehiring slows. The Fed reads payrolls at 165K as fine. The leading indicator is time-to-rehire, and nobody forecasts it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.exponentialview.co/p/monday-data-09-11-2026"}, {"id": 26, "cat": "AI/infra", "urgency": "act", "source": "SixSigmaResearch (SixSigmaCapital)", "title": "Nvidia board opens independent probe into Jensen Huang's alleged foreign-intelligence link", "idea": "SixSigma: Nvidia's board launched an independent investigation Sunday into whether Huang was the target of a foreign intelligence effort after reports of a relationship with a woman alleged to have passed information to Beijing. Huang admitted an affair to staff. Board says no reason to believe national security or secrets were compromised.", "angle": "Key-person and export-control risk in one headline. The relationship to China-linked buyers (Megaspeed, per Mando: $5B of chips in 2 years) is the real story.", "tweetA": "The affair isn't the risk. A firm linked to the alleged spy bought ~$5B of Nvidia chips in two years. That's an export-control audit, not a HR issue. $NVDA", "tweetB": "NVDA was -9.3% last Thursday, -5% pre-market Monday. The company with the biggest concentration in the S&P just added governance risk to a policy-risk week.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sixsigmaresearch.com/"}, {"id": 27, "cat": "AI/infra", "urgency": "deep", "source": "SixSigmaResearch (SixSigmaCapital)", "title": "Google unveils TPU 8tx and 8i Max", "idea": "Google announced two TPU systems: the TPU 8tx for confidential computing (TPU 8t paired with AMD CPUs) and the 8i Max, with two 8i chips per package to double compute and memory.", "angle": "Custom silicon cadence continues even through the selloff. AMD CPU pairing on a TPU is notable.", "tweetA": "Google's new TPU for confidential computing pairs with AMD CPUs, not its own. Hyperscaler silicon is eating the accelerator but renting the host. $GOOGL $AMD $AVGO", "tweetB": "Two-chips-per-package doubling compute and memory is the packaging story. Advanced packaging capacity is the real constraint, not wafer starts.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sixsigmaresearch.com/"}, {"id": 28, "cat": "AI/infra", "urgency": "deep", "source": "SixSigmaResearch (SixSigmaCapital)", "title": "CoreWeave PT cut to $115 from $160; JPM cuts IREN to $55; Meta's strategy chief goes to Fireworks as CFO", "idea": "SixSigma chat: Wells Fargo cut CoreWeave to $115 from $160 (Overweight); JPMorgan lowered IREN to $55 from $65; CoreWeave signed a multi-year deal with Wayve; Meta CSO Dave Wehner is leaving to become CFO of AI inference startup Fireworks. QXO reported prelim Q3 sales of ~$4.90B (+79% y/y), above $4.83B consensus.", "angle": "Neocloud PTs being cut after a -12% SOX day. Wehner leaving Meta for a Series-stage inference shop is a talent-flow signal.", "tweetA": "Wells cuts CoreWeave PT by 28%, JPM cuts IREN. Same day CoreWeave announces a multi-year Wayve deal. Customers keep signing, analysts cut. That's a financing-cost story, not a demand one. $CRWV $IREN", "tweetB": "Meta's chief strategy officer leaves to be CFO of an inference startup. When senior finance people at megacaps leave for AI-inference companies, they're telling you where they think the margin pool is.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sixsigmaresearch.com/"}, {"id": 29, "cat": "positioning", "urgency": "act", "source": "Bespoke Investment Group", "title": "Russell 1000 lost ~$4.8T of market cap in a month; small and mid caps now lead YTD", "idea": "Bespoke: NVDA is -5% pre-market after Huang's admission while futures are solidly green. After the Big Tech drop, small- and mid-cap ETFs lead YTD; SPY, IWB, QQQ and OEF are all in extreme oversold territory. Russell 1000 collective market cap fell roughly $4.8T in a month; table lists the 20 biggest m/m market-cap losers.", "angle": "$4.8T gone while the VIX is only 21. Mechanical, not panic.", "tweetA": "$4.8T of Russell 1000 market cap erased in a month and the VIX is 21. That's a rotation with a hole in it, not a crash. Small caps are now leading YTD and nobody noticed. $IWM", "tweetB": "Extreme oversold on SPY, QQQ, IWB, OEF at the same time historically gives a bounce within days. The question is what the bounce sells into: the Fed still has a December hike in the pricing.", "charts": {"count": 1, "hot": true, "desc": "Table of the 20 stocks with biggest m/m market cap drops"}, "link": "https://bespokeinvest.substack.com/p/morning-market-note-global-affairs"}, {"id": 30, "cat": "positioning", "urgency": "deep", "source": "Bespoke Investment Group", "title": "Berkshire's 1-month outperformance vs S&P is the widest in 15+ years", "idea": "Bespoke: Berkshire was flat YTD in early October while the S&P was +13%, at peak relative weakness. Since breaking below its 50dma at Q3 end it has rallied ~20% in a down tape, taking the rolling 21-day spread vs the S&P to its widest in more than 15 years, even above the 2025 tariff-lows level.", "angle": "Sentiment at its worst, the pivot arrived with the S&P roll-over. Classic mean reversion in a defensive compounder.", "tweetA": "Berkshire was dead money, the market was at highs, and the 'is Abel up to the job' pieces were everywhere. Then the S&P rolled. Widest 21-day outperformance in 15 years. Sentiment extremes are the signal, not the thesis. $BRK.B", "tweetB": "Berkshire works as a put on the tape. The real question is whether Abel starts deploying cash into a market that just had a 5% Nasdaq day.", "charts": {"count": 1, "hot": true, "desc": "Rolling 21-day performance spread of BRK/B vs S&P 500"}, "link": "https://bespokeinvest.substack.com/p/berkshire-ready-willing-and-abel"}, {"id": 31, "cat": "geopolitics", "urgency": "deep", "source": "ChinaTalk (Jordan Schneider)", "title": "Midterms leave Iran war with 'no theory of victory': two carriers, 15-16 destroyers, a blockade", "idea": "WarTalk: Bryan Clark says two carriers plus 15-16 destroyers enforce the blockade and protect oil flows. Vance reportedly said the war was why they lost. Escalation is off the table; Congress will not pass an NDAA or appropriations while the war continues, so continuing resolutions run through year-end and into next year.", "angle": "Defense budget is hostage to the war. Primes without supplemental dollars face a CR drag; defense-tech consolidation likely.", "tweetA": "No NDAA, no appropriations, continuing resolutions into next year. The Iran blockade is now the reason defense primes can't get new-start programs funded. $LMT $RTX $NOC", "tweetB": "The administration needs a 'fig leaf' off-ramp and Iran has no reason to give one. If the deal is announced it'll be priced as risk-off-over. The more important question is what's in the side letters.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.chinatalk.media/p/wartalk-lame-duck-war-pete-on-notice"}, {"id": 32, "cat": "geopolitics", "urgency": "deep", "source": "ChinaTalk (Jordan Schneider)", "title": "Iran's asks: reparations, nuclear guarantees, and a Qatar-Iran strait consortium", "idea": "Justin McIntosh: Iran would ask for war damages incl. the atomic sites, a security guarantee for civilian nuclear energy, and perhaps a toll or a consortium (Iran + Qatar balancing Saudi + UAE) controlling strait transit with profit-sharing among the four. He cites an economist arguing $150 oil within months could collapse the French economy.", "angle": "A strait consortium means a permanent tollbooth on 20% of world oil. Oil price floor repriced.", "tweetA": "A Hormuz consortium of Iran, Qatar, Saudi, UAE with profit-sharing is OPEC-for-shipping. That's the real long-term bull case for crude, and nobody is pricing it with oil -13% on 'deal hopes'. $XLE", "tweetB": "The detail I'd trade: France's fragility at $150 oil. The weakest large Eurozone economy is the transmission channel. Short OATs vs Bunds if the deal falls apart? $FXE", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.chinatalk.media/p/wartalk-lame-duck-war-pete-on-notice"}, {"id": 33, "cat": "geopolitics", "urgency": "watch", "source": "ChinaTalk (Jordan Schneider)", "title": "Coast Guard cutters and LCS relocated from the Gulf to Singapore; NSA Bahrain is gone", "idea": "Bryan Clark: Coast Guard moved its six fast response cutters to Singapore along with all the littoral combat ships; every ship that was in the Persian Gulf is now operating in the South China Sea. NSA Bahrain, built mostly during OIF, won't be revisited; the US returns to a lighter, sea-based footprint with UAE/Qatar partner facilities. Half of the deployed, underway Navy is in CENTCOM.", "angle": "Force posture shift is a forced experiment: more assets in INDOPACOM for China gray-zone, fewer in the Gulf.", "tweetA": "Every ship that used to sit in the Persian Gulf is now in Singapore. Washington accidentally did the Asia pivot by losing a war-by-attrition in the Gulf. $HII $GD", "tweetB": "Half of the deployed US Navy is in one theater. One Taiwan Strait incident and the whole force posture breaks. That's the tail risk no one is hedging.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.chinatalk.media/p/wartalk-lame-duck-war-pete-on-notice"}, {"id": 34, "cat": "geopolitics", "urgency": "deep", "source": "ChinaTalk (Jordan Schneider)", "title": "What the PLA learns from Iran: resilience baselines and Taiwan", "idea": "Clark: the PLA may ask 'if Iran can put up this fight, what should we expect from Taiwan?' Jordan Schneider counters that resilience is relative to baseline: Iranians have lived through repeated currency/inflation crises; Taiwanese haven't, so the shock of wartime life would be larger. McIntosh adds US bases in Asia would require China to actively target Japan and others.", "angle": "Baseline-shock framing: the societies that have lived crises are harder to coerce. A Taiwan thesis.", "tweetA": "Iran is being read as proof that coercion fails against resilient societies. Schneider's point is the better one: resilience is the change from your baseline. Taiwan has never lived a currency crisis. That's a very different model of deterrence.", "tweetB": "Taiwan just banned short-selling after a stock crash. That's the first stress test of the 'no baseline of shocks' thesis, and the exchange blinked in a week of AI-driven selling alone.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.chinatalk.media/p/wartalk-lame-duck-war-pete-on-notice"}, {"id": 35, "cat": "geopolitics", "urgency": "deep", "source": "ChinaTalk (Jordan Schneider)", "title": "Hegseth impeachment watch, Feinberg's possible exit, and Starshield dependence", "idea": "From the episode description: growing pressure on the Secretary of War, with exit strategies and the 1876 Belknap precedent; reports of Steve Feinberg's possible departure; what a Democratic House means for defense budgets and procurement reform; and whether the defense-tech boom is headed for consolidation. Also: Pentagon dependence on SpaceX's Starshield raises who controls critical military comms and whether Musk would be forced to relinquish operational control.", "angle": "Defense procurement under a split government plus a single-vendor comms dependency. Musk says SpaceX's government revenue will 'shrivel' (Mando).", "tweetA": "The Pentagon depends on one private company's constellation for military comms, and that company's CEO just said government revenue will 'shrivel next year'. Either the dependency is overstated or the SpaceX IPO story is. $SPCX", "tweetB": "Defense-tech's boom was a bet on a friendly Congress. A Democratic House that wants procurement reform is a consolidation catalyst. Anduril is the acquirer, not the target.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.chinatalk.media/p/wartalk-lame-duck-war-pete-on-notice"}, {"id": 36, "cat": "positioning", "urgency": "deep", "source": "The Dark Side Of The Boom (Stephen Innes)", "title": "Goldman: systematic selling vs ~$5B/day of buyback demand", "idea": "Goldman's Ryan Sharkey (Extremes II): systematic strategies are preparing to sell billions more in equity futures just as corporate America exits its earnings blackout with ~$5B/day of potential buyback demand. Semis have had an extraordinary positioning reset, but Mag7 remain crowded, hedge funds are nursing big losses, and Friday's recovery showed little conviction.", "angle": "Mechanical flow vs mechanical flow; CPI this week tips the balance.", "tweetA": "Two mechanical forces meet this week: vol-control funds selling futures vs $5B/day of corporate buyback bids. Neither cares about the Jensen headline. CPI decides which one wins. $SPY", "tweetB": "Hedge funds cut risk but one leverage measure still says they're vulnerable. That's the line I'd watch: gross is lower, net isn't. A second leg down needs forced selling, not discretionary.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/when-the-machines-sell-and-corporate"}, {"id": 37, "cat": "AI/infra", "urgency": "deep", "source": "The Dark Side Of The Boom (Stephen Innes)", "title": "Goldman TMT: semis near worst monthly drawdown ever, yet memory pricing and Q3 earnings are strong", "idea": "Goldman's Peter Callahan: Nasdaq 100 is testing a multi-year trendline; semiconductors suffered one of their worst monthly drawdowns in history; foreign investors are pulling extraordinary amounts from Asia tech. Yet memory pricing remains strong, Q3 earnings comfortably beat, and parts of the semi complex have valuations that would normally attract aggressive buying. Defensive rotation has left PMs with few places to hide.", "angle": "Fundamentals up, prices down: 'how much of the AI cycle has the market decided to write off?'", "tweetA": "Semis in one of their worst months ever, Q3 beats comfortably, and memory pricing is still firm. The price is saying the cycle ends in 2027. The earnings say 2026 was fine. Someone is misreading the second derivative. $SOXX $MU", "tweetB": "Foreign outflows from Asian tech are 'extraordinary'. Taiwan banned shorting. That's what the end of a crowded foreign trade looks like, and it's historically where the bottoms formed. $EWY $EWT", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-last-line-of-defence-goldmans"}, {"id": 38, "cat": "labor", "urgency": "deep", "source": "The Black Swan (Route 2 FI)", "title": "AI -> white-collar income -> mortgage feedback loop: the 'window is closing' thesis", "idea": "Route 2 FI argues AI quietly kills the junior rung (hiring freezes, no replacements, smaller raises), and a 2008-style loop could follow: income loss, missed mortgages, forced sales, falling prices, lower credit, more sales. The twist: central banks may be unable to cut because inflation is still high, so rescue means debt-funded support and a weaker currency.", "angle": "Housing is the transmission channel for AI labor displacement. 'Cut and accept inflation' is the likely policy path.", "tweetA": "The new housing risk isn't subprime, it's prime borrowers in white-collar jobs. 2008 started with bad loans. This one starts with a good loan and a worse job market. Underwriters don't model that. $XHB $ITB", "tweetB": "And the central bank's playbook is gone: cut and you reflate, hold and you foreclose. The market is pricing a December hike. Nobody's pricing the scenario where they have to cut into a 4.9% 10-year. $TLT", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://theblackswans.substack.com/p/the-window-is-closing-ai-jobs-and"}, {"id": 39, "cat": "regulation", "urgency": "deep", "source": "a16z", "title": "US built 2 large nuclear reactors in 20 years; a 550-mile line took 17 years", "idea": "a16z's permitting essay: in two decades America completed two large reactors, seven years late and ~$23B over (peak: 4-5 a year). A 550-mile transmission line took 17 years (2 years construction); a 94% complete WV pipeline sat idle nearly a decade; an Arizona mine that could supply a quarter of US copper demand has been idle since its 1995 discovery. Interconnection queue: 2,000+ GW, nearly twice the existing US fleet, ~5 years average.", "angle": "The AI buildout hits a 2,000 GW queue. Permitting reform is the actual AI trade.", "tweetA": "2,000 GW is waiting in interconnection queues. That's 2x the whole existing US power fleet, stuck for five years each. Meanwhile Anthropic pays $3.4B for a generator slot. Permitting is the AI bottleneck, not GPUs. $GEV $NEE", "tweetB": "America completed two large reactors in 20 years, seven years late and $23B over. At the peak it built 4-5 a year. Any SMR or restart thesis is a bet on regulatory speed, not engineering.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.a16z.news/p/america-can-build-again-heres-how"}, {"id": 40, "cat": "regulation", "urgency": "deep", "source": "a16z", "title": "NEPA: EIS takes ~4 years, costs $6.6M mean; Canada and Australia permit mines 5x faster", "idea": "a16z: in 2024 simple environmental assessments averaged over a year and EISs nearly four years; DOE data pegs mean EIS cost at $6.6M and smaller assessments at $300K. Cape Wind died after 15+ years and $100M+. Canada and Australia permit mines up to 5x faster; Madrid expanded its metro cheaply under EU rules. The Senate's Bipartisan American Affordability and Jobs Act of 2026 would bar injunctions for procedural NEPA errors and add hard deadlines.", "angle": "A concrete bill (Senate 2026) with five asks. Passing probability goes up with a divided Congress, since both parties want it.", "tweetA": "NEPA: no substantive standard, ~4 years per EIS, $6.6M each. The Senate bill bars injunctions for procedural errors. A blue House and red Senate agree on exactly one thing: building. That's the bipartisan AI-power trade. $FLR $PWR", "tweetB": "Cape Wind: 15 years, $100M, zero turbines. The environmental left helped kill wind. Watch whether Dems back this after the midterms, because the power constraint now blocks their own priority too.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.a16z.news/p/america-can-build-again-heres-how"}, {"id": 41, "cat": "geopolitics", "urgency": "watch", "source": "a16z", "title": "US share of global manufacturing: 25% (1997) -> 16% -> 11% by 2030 on current trend; Spain 3,800 km HSR; Taiwan fabs in ~2 years", "idea": "a16z: US manufacturing share was 25% in 1997, 16% today and would hit 11% by 2030 absent intervention. Democracies can build fast: Spain has 3,800+ km of high-speed rail (second only to China) at low unit cost; Taiwan brings cutting-edge fabs online in roughly two years with one-stop administration and land/power/water access. California HSR: $13B spent of a $33B budget; total now estimated $128B.", "angle": "Regime type isn't the variable, procedure is. Taiwan's fab speed is the model.", "tweetA": "Taiwan builds a leading-edge fab in two years. California has spent $13B of a $33B high-speed rail budget with the estimate now at $128B. Same species of democracy. Different incentive on the permit clock. $TSM", "tweetB": "US share of global manufacturing: 25% to 16% to a projected 11% by 2030. If that trend runs, tariffs aren't the lever, permitting is. Ironsides says tariffs are toxic. Maybe we're arguing about the wrong policy.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.a16z.news/p/america-can-build-again-heres-how"}, {"id": 42, "cat": "macro", "urgency": "deep", "source": "Ironsides Macroeconomics (Barry Knapp)", "title": "Election is not a clearing event: tariffs, fiscal deficit and a Fed 'tightening into decelerating earnings'", "idea": "Ironsides (Barry Knapp): tariffs remain politically toxic and unlikely to return to pre-Liberation Day levels; fiscal negotiations threaten a larger deficit; the Fed is tightening into decelerating earnings and AI capex growth; worst of the tariff shock is behind. Cautious, with a plan to deploy above-benchmark cash after a 10-12% correction. Teaser notes the three largest Republican House election losses came in 1932, 1922 and 1890, after the three largest tariff hikes.", "angle": "A rule-based entry: 10-12% drawdown. S&P -2.7% on the week is not there yet.", "tweetA": "Three biggest GOP House losses: 1890, 1922, 1932. Each followed a major tariff hike. The market is only pricing the tariff-reversal as a one-way bet. If history is the gu function copyTweet(itemId, which) {
