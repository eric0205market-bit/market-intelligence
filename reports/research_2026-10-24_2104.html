<script>
const ITEMS = [{"id": 1, "cat": "macro", "urgency": "deep", "source": "Eliant / Eliant's Exploits", "title": "QQQ round-tripped +250bps to -80bps in one week while small caps closed +200bps", "idea": "Headline indices looked calm, but factor volatility ran rampant. Growth/Momentum led Monday, then rotation into Value/low-vol, then small caps surged after the tech unwind and a duration bid. The Q's were up roughly 250bps intraday on the week and finished down just under 80bps.", "angle": "A ~330bps peak-to-close reversal inside the index that is supposed to be the market. Dispersion, not index vol, is where the risk is sitting.", "tweetA": "QQQ round-tripped ~330bps peak-to-close in five sessions and the VIX barely noticed. That's what dispersion looks like at 19 vol: the risk lives in the factor tape and the cap-weighted headline is the last place you see it. $QQQ $IWM", "tweetB": "Small caps +2% in a week the 10-year rallied 9bp. That's a duration trade wearing a breadth costume. It has a shelf life of one hot PCE print on Thursday. $IWM $TLT", "charts": {"count": 4, "hot": false, "desc": "STD channels on SPY/QQQ/IWM/DJIA weekly, factor basket performance charts, Fear-Greed overlay - worth opening"}, "link": "https://www.eliantcapital.com/p/the-week-ahead-102526"}, {"id": 2, "cat": "positioning", "urgency": "deep", "source": "Eliant / Eliant's Exploits", "title": "Extreme Fear with the S&P ~1.7% off its high: breadth reset is the story", "idea": "% of stocks above the 20D rebounded to 49% (neutral) but only 38% sit above the 50D (oversold). Fear-Greed is still firmly in Extreme Fear even though headline indices are near highs. Eliant's read: the 'generals' are now being dragged lower after a broad under-the-hood reset.", "angle": "Sentiment gauges are measuring the median stock, not the index. Gives a framework for why the index feels fine and positioning feels terrible.", "tweetA": "Extreme Fear with the S&P 1.7% below its high close. Either sentiment gauges are broken, or the index is the last thing to learn what the median stock has known for months. 38% above the 50D says it's the second.", "tweetB": "Extreme Fear in the survey, record -$1.03T credit balances in the account. Fear and leverage at the same time is not a contrarian signal. It's a fragile one. Pick which one is lying.", "charts": {"count": 1, "hot": true, "desc": "Fear-Greed index overlaid with S&P history - worth opening"}, "link": "https://www.eliantcapital.com/p/the-week-ahead-102526"}, {"id": 3, "cat": "macro", "urgency": "deep", "source": "Eliant / Eliant's Exploits", "title": "FOMC Wednesday, PCE Thursday, hyperscaler capex all inside 48 hours", "idea": "Busier week ahead: FOMC meeting Wednesday, PCE Thursday (Fed's preferred inflation gauge), plus a plethora of tech/hyperscaler earnings. Eliant frames it against a week where Tech was unwound and duration was bid.", "angle": "One of the densest event clusters of the year lands on a market with funding stress already visible in credit.", "tweetA": "FOMC, core PCE, Q3 GDP and MSFT/GOOGL/META/AMZN capex guides inside 48 hours. If rates and capex both surprise in the same direction, the AI trade and the bond market get one answer at once. $MSFT $GOOGL $AMZN", "tweetB": "The hyperscaler capex print matters less than how it's funded. A raise with FCF intact steadies the AI trade. A raise funded by debt is the Meta week all over again. Read the cash flow statement first.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.eliantcapital.com/p/the-week-ahead-102526"}, {"id": 4, "cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom (Goldman)", "title": "Goldman's Snider: retail steps back, but households are the deeper bid", "idea": "Ben Snider (GS US equity strategist) separates fading retail speculative trading (leveraged Nasdaq ETFs) from the far larger pool of household wealth flowing into US equities. Hedge funds are cutting risk and the corporate buyback bid is weakening, leaving households as the marginal driver. Durability depends on employment, rates and the behaviour of the wealthiest households.", "angle": "Reframes the market's marginal buyer as a labor-market and rates variable. Pair with Dauber's momentum de-grossing and the record negative credit balances.", "tweetA": "Hedge funds de-grossing, corporates pulling back as buyers, retail trading fading. Who's left? Household balance sheets, which are a function of payrolls and the 2-year. The marginal equity bid is now a labor market variable. $SPY", "tweetB": "Goldman says households are the deep bid. Meanwhile retail credit balances hit -$1.03T in August. Fewer new buyers, same leveraged ones. That isn't a durable bid, it's a margin call waiting for a catalyst.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-retail-trader-steps-back-but"}, {"id": 5, "cat": "energy", "urgency": "deep", "source": "Dark Side of the Boom (Goldman)", "title": "Europe enters winter with the lowest gas inventories in 14 years; Goldman says 'not 2022'", "idea": "NW European gas stocks head into the heating season at a 14-year low and Middle East LNG is hostage to Hormuz disruption. Samantha Dart (GS) says the supply shock is similar in scale to Russia's 2022 withdrawal but demand has structurally reset, so the market absorbs it differently, at an economic cost. Meaningful upside risk to winter prices hinges on two unpredictable variables.", "angle": "Henry Hub fell 15.28% to $2.64 this week (Dauber) while Europe faces its tightest stocks in 14 years. The spread between molecules and where they can go is the trade.", "tweetA": "Europe: lowest gas stocks in 14 years. Henry Hub: -15% to $2.64. The US is long molecules with nowhere to send them, Europe is short with a ceiling called demand destruction. That spread is the trade. $LNG $UNG", "tweetB": "Everyone is debating 2022 or not-2022. The better question: how much more demand can Europe destroy before 'resilience' is just deindustrialization with better branding? The reset was paid for in lost output.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/europes-gas-crisis-has-returned-but"}, {"id": 6, "cat": "AI/infra", "urgency": "act", "source": "AI Agents Weekly (Elvis Saravia)", "title": "Kimi K3.1 Pro: 2.8T MoE, within 1 point of Opus 5.5 on Terminal-Bench, weights by Nov 4", "idea": "Moonshot's K3.1 Pro is multimodal MoE (2.8T total, 104B active, 1M context). Terminal-Bench 4.0: 65.7% vs GPT-6 Astra 58.2% and Claude Opus 5.5 66.4%. Hallucination rate fell from 23.4% to 8.3%. Removing cyber data cut exploit-task solve rate from 90.5% to 81.0%. Full weights due November 4.", "angle": "An open-weight model within 1 point of the frontier on agentic coding in 11 days. Directly pressures API pricing and the lab margin story.", "tweetA": "Kimi K3.1 Pro: 2.8T params, 104B active, 65.7% on Terminal-Bench vs Opus 5.5 at 66.4%. Weights drop Nov 4. Every frontier API margin model assumes the open gap is wider than one point. $NVDA $GOOGL $MSFT", "tweetB": "Moonshot stripped cyber data from training and exploit solve rate fell 90.5% to 81.0%. A 9-point haircut on a model whose weights go public in 11 days. Same week AI-found PHP bugs drew millions of exploit attempts. Connect those two.", "charts": {"count": 3, "hot": false, "desc": "Benchmark tables in the Moonshot blog - worth opening"}, "link": "https://nlp.elvissaravia.com/p/ai-agents-weekly-claude-duet-kimi"}, {"id": 7, "cat": "AI/infra", "urgency": "deep", "source": "Elvis Saravia / AI Agents Weekly", "title": "Open-weight wave: MiniMax M3.1 Flash, DeepSeek DeepInfer, Recursive Flint, Mercury 3 diffusion LLM, and 'naive RAG beats agentic memory'", "idea": "Same issue lists MiniMax opening M3.1 Flash weights, Recursive shipping local coding model Flint, DeepSeek open-sourcing DeepInfer, Inception's diffusion LLM Mercury 3, Databricks MemCurrent agent memory, Ramp detailing its Laminar harness, Anthropic previewing Claude Duet and OpenAI coordinating critical PHP fixes. A headline claims naive RAG beats agentic memory. (Email body shows only the top story in full; the rest are headlines.)", "angle": "Open weights plus simple retrieval keep beating complexity. A cost-curve story for inference and for who captures margin.", "tweetA": "In one week: Kimi, MiniMax and DeepSeek ship open weights or inference stacks, a diffusion LLM hits v3, and a headline says naive RAG beats agentic memory. Complexity keeps losing to scale and simple retrieval. The bitter lesson, now for agent architecture.", "tweetB": "Count the labs shipping weights: Moonshot, MiniMax, DeepSeek, Recursive. Count the ones with a path to repaying Nvidia-scale capex: fewer. Open weights at the frontier compress inference pricing before training bills are amortized. $NVDA $MSFT", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/ai-agents-weekly-claude-duet-kimi"}, {"id": 8, "cat": "labor", "urgency": "watch", "source": "McKinsey Classics", "title": "McKinsey Classics: the 'helix' organization, and why AI now forces the reorg", "idea": "The helix splits a matrix into two equal lines: a capability leader (how work gets done, careers, reviews) and a value-creation leader (what work gets done, day-to-day priorities), supported by an internal talent marketplace. The email's second piece says companies are scaling AI rapidly but many see no meaningful results; the winners reorganize people, AI agents and work through four shifts.", "angle": "Org design as the hidden bottleneck of AI adoption. Links to the forward-deployed-engineer boom in Founders Corner.", "tweetA": "McKinsey's 2019 helix is an AI story now. If agents do the 'what' work, the dotted line runs between a human capability owner and a fleet of agents with no career path. Org charts are about to get non-human nodes and no HR system can hold them.", "tweetB": "McKinsey: firms scaling AI fast but not seeing results. Founders Corner: forward-deployed engineer postings up 1,000%. Same fact from two sides. AI adoption without reorg is a capex line with no revenue line, and humans are filling the gap on site. $PLTR", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.mckinsey.com/capabilities/people-and-organization/our-insights/the-helix-organization"}, {"id": 9, "cat": "macro", "urgency": "deep", "source": "Damped Spring", "title": "The Circle of Life: issuance is bearish first, bullish later, and corporates flipped from buyers to issuers", "idea": "Issuers who need cash are price takers: they pay up, a short-term headwind for assets. They then spend (Meta building compute), which stimulates growth and inflation with a lag, and every dollar spent becomes savings that bids assets back up. The author argues corporations have shifted from buying back shares to needing cash in size, the reverse of a few years ago. The loop only works if the investment pays more than the coupon.", "angle": "A clean framework for why AI capex funded by bonds hits assets before it helps them, and what happens if the loop seizes.", "tweetA": "Buybacks were a bid. Hyperscaler bond issuance is supply. Same companies, sign flipped. Meta -9.4% in a week after disclosing ~$825B of commitments isn't a stock story, it's a price taker paying up for cash. $META $ORCL", "tweetB": "The loop only closes if the compute earns more than its coupon. The market is testing that live with HY at 327bp. The weakest link in the AI chain isn't Nvidia. It's the lender.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://dampedspring101.substack.com/p/the-circle-of-life-64e"}, {"id": 10, "cat": "credit", "urgency": "deep", "source": "Damped Spring", "title": "Banks growing assets at nominal GDP, Fed neutral: 'slightly stimulative' and fragile", "idea": "Over the last year banks grew assets roughly in line with nominal GDP, the fastest in a few years, which offsets issuance headwinds. The Fed's balance sheet is neutral. The author notes the Fed could hike or use its balance sheet to compete with issuers but has not, and 'don't hold your breath'. If banks hit limits or lose appetite, the spiral flips down.", "angle": "The no-tightening backdrop for equities depends on banks staying willing. Pair with the TGA/RRP drain in Dauber.", "tweetA": "Bank assets growing at nominal GDP and a neutral Fed is the entire 'no tightening' defense of this equity market. Now add a TGA rebuilt to $952B and reverse repo at $0.2B. If banks blink there is no buffer behind them.", "tweetB": "The Fed can raise rates or sell assets to compete with issuers. Its pivot away from an October hike chose the spiral over the cure. The 30-year noticed: -10bp on the week. The long end is pricing a Fed that won't fight. $TLT", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://dampedspring101.substack.com/p/the-circle-of-life-64e"}, {"id": 11, "cat": "macro", "urgency": "deep", "source": "Capital Wars", "title": "Capital Wars: 'Phase Shift' - global liquidity heading lower, tech is the anomaly", "idea": "Global Liquidity continues lower and the author sees a 'Turbulence' regime near. Bonds and commodities have followed a conventional cycle, equities are the anomaly because tech drove indices twice: P/E expansion, then unusually strong late-cycle AI earnings. Russell 2000 and MSCI EM are called barometers of nervousness, while S&P and Nasdaq haven't decisively cracked. The question: can further tech earnings carry equities as liquidity fades?", "angle": "Liquidity cycle vs earnings cycle: who wins. Cross-reference with this week's Lam/Meta repricing.", "tweetA": "Bonds and commodities have traded the liquidity cycle normally. Only tech didn't. It carried indices twice, on multiple then on AI earnings. A third act needs earnings growth faster than liquidity drains. Lam -12.8% and Meta -9.4% this week was the first audition. $SMH $QQQ", "tweetB": "Capital Wars calls Russell and EM the nervousness barometers. Russell +2% this week. KOSPI broke its 200D. One barometer says calm, one says broken, and only one of them has chips in it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://capitalwars.substack.com/p/phase-shift"}, {"id": 12, "cat": "venture", "urgency": "deep", "source": "The Founders Corner", "title": "Anthropic H1: $80.7B net loss is mostly $72B of mark-to-market on its own convertibles; Q3 revenue alone ($16.8B) exceeds H1 ($16.3B)", "idea": "Draft IPO prospectus (per Reuters): H1 2026 net loss $80.7B vs $13B a year earlier, of which $72B is an accounting charge tied to higher estimated value of convertible notes. H1 revenue $16.3B, compute and infrastructure spend near $9B. Q3 revenue reached $16.8B.", "angle": "Q3 alone is bigger than H1 total: ~$67B annualized if sustained. The loss line is the valuation going up.", "tweetA": "Anthropic: $16.3B revenue in H1, then $16.8B in Q3 alone. One quarter larger than the prior two combined, ~$67B annualized. The $80.7B loss is $72B of marks on its own convertibles. The loss is the valuation rising. Strangest income statement in tech.", "tweetB": "Compute and infrastructure ~$9B against $16.3B of H1 revenue is ~55%. Not a software margin, not an $80B hole either. Read past the net loss to the operating line or you're trading headlines. $AMZN $GOOGL", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/ai-pricing-pages-leave-buyers-guessing"}, {"id": 13, "cat": "venture", "urgency": "deep", "source": "The Founders Corner", "title": "Anthropic Public Benefit Fund: 5% of shares plus 2% more per 50% value increase", "idea": "Anthropic will commit 5% of its shares to a new Public Benefit Fund (subject to stockholder approval); the board can add 2% for each 50% rise in company value above a baseline. The fund can make donations to nonprofits or direct distributions, and its equity is barred from lobbying or political giving. IPO expected in November.", "angle": "A philanthropic ratchet baked into the cap table. IPO modelers need the dilution path.", "tweetA": "Anthropic pledges 5% of its shares to a public benefit fund, plus 2% more for every 50% rise in value. A dilution schedule that scales with success, written into the cap table. First time I've seen the equity itself carry the donation clause.", "tweetB": "The fund's shares are barred from lobbying and political giving. Dauber this week asks who's comfortable with concentrated wealth in politics. One lab's structural answer: encode the constraint in the equity. Will OpenAI or xAI match it?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/ai-pricing-pages-leave-buyers-guessing"}, {"id": 14, "cat": "venture", "urgency": "deep", "source": "The Founders Corner", "title": "Eric Schmidt reportedly holds ~1% of Anthropic, worth ~$20B - implies ~$2T", "idea": "Press reports say Schmidt owns about 1% of Anthropic, roughly $20B ahead of the IPO; Dario Amodei's wife introduced him. His peak Google ownership was 5%. Figures come from press reports.", "angle": "1% = $20B implies a ~$2T valuation. Compare to ~$67B annualized Q3 revenue.", "tweetA": "1% of Anthropic = ~$20B means the market is marking it near $2T pre-IPO. Schmidt peaked at 5% of Google. Early access to the right cap table beats any amount of later analysis.", "tweetB": "$2T on ~$67B of annualized Q3 revenue is ~30x sales. Defensible only if revenue keeps compounding at the rate that got it here. That's the whole bet, in one multiple.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/ai-pricing-pages-leave-buyers-guessing"}, {"id": 15, "cat": "AI/infra", "urgency": "deep", "source": "The Founders Corner", "title": "Nscale and Anthropic near a second $45B compute deal, a month after the first", "idea": "Per Bloomberg, Nscale and Anthropic are close to a second $45B compute deal, a little over a month after their first. Both pursue IPOs; Nscale reportedly faces investor pushback on a proposed $30B valuation. Details could change.", "angle": "$90B of contract backlog to one tenant against a $30B equity ask. Backlog is 3x the equity. Neocloud credit risk.", "tweetA": "Anthropic is signing ~$90B of compute with a neocloud whose own valuation ask is $30B. Backlog 3x the equity, one tenant, debt-financed. That's Dauber's 'who pays, and how much is debt' written into a term sheet. $CRWV $ORCL", "tweetB": "Neocloud math: take-or-pay from a single lab, financed with debt, valued by investors who push back at $30B. Watch high-yield spreads, not GPU prices. HY has sat above 325bp for a week.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/ai-pricing-pages-leave-buyers-guessing"}, {"id": 16, "cat": "AI/infra", "urgency": "deep", "source": "The Founders Corner", "title": "OpenAI models and Codex land on Google Cloud, purchasable against existing GCP commitments", "idea": "OpenAI's frontier models and Codex agent workflows are coming to Google Cloud Model Garden, purchasable through Marketplace, drawing down existing GCP spend commitments. Also reaching Google Antigravity and Gemini Agent. GA planned in coming weeks; Microsoft remains OpenAI's primary cloud partner.", "angle": "Cloud commitments become a currency that buys any model. Hyperscaler exclusivity is dying.", "tweetA": "OpenAI on Google Cloud, bought against existing GCP commits. Hyperscaler 'exclusive' model deals are dead; compute commitments are now a currency that buys any model. Winner is whoever owns the contract, not the model. $GOOGL $MSFT", "tweetB": "Who loses? Any lab relying on a cloud partner's distribution. Marketplaces with drawdown turn model choice into a procurement line, and procurement defaults to the cheapest. Kimi weights on Nov 4 sharpen that.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/ai-pricing-pages-leave-buyers-guessing"}, {"id": 17, "cat": "venture", "urgency": "deep", "source": "The Founders Corner", "title": "Replit makes OpenAI its default model; enterprise went from ~2% to ~15% of revenue", "idea": "Replit switched its default model to OpenAI, citing cost and performance (Amjad Masad at TechCrunch Disrupt). Claude remains selectable and the Anthropic partnership continues. Enterprise went from ~2% of revenue last year to ~15% now; over 50% of revenue is B2B.", "angle": "App-layer companies now arbitrage labs against each other on cost. Churn test for lab revenue.", "tweetA": "Replit: enterprise ~2% to ~15% of revenue in a year, B2B above 50%, default model flipped to OpenAI on cost. Default model is a pricing lever. The app layer is now arbitraging labs against each other.", "tweetB": "A coding-agent app with a growing enterprise mix switches providers on cost. That's the churn test for Anthropic's $16.8B quarter: how much is sticky and how much is a default setting someone can flip?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/ai-pricing-pages-leave-buyers-guessing"}, {"id": 18, "cat": "labor", "urgency": "deep", "source": "The Founders Corner", "title": "Forward-deployed engineer postings up 1,000%+ in 8 months; comp past $300K", "idea": "Lightcast data via Fortune: postings for forward-deployed engineers are up more than 1,000% from January to August 2026; US total comp is pushing past $300K. Enterprise AI companies embed engineers to build the workflows their platforms promise, and some book that work as ARR. Advice: split software from services revenue before applying a software multiple.", "angle": "AI revenue quality: is it software or services? Link to McKinsey's 'adoption without results'.", "tweetA": "Forward-deployed engineer postings up 1,000% in eight months, comp past $300K. When the product needs an engineer embedded at the customer to work, it's a services business with software accounting. Split the ARR before applying a multiple.", "tweetB": "McKinsey says AI adoption isn't producing results. Founders Corner says FDE postings are up 10x. AI product-market fit is being manufactured by humans on site. $PLTR wrote the template; everyone else is copying it with worse margins.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/ai-pricing-pages-leave-buyers-guessing"}, {"id": 19, "cat": "regulation", "urgency": "deep", "source": "The Founders Corner", "title": "Zuckerberg weighed leaving California over Prop 40 billionaire tax; Meta's fix is an 8-year residency pledge and a new share class", "idea": "A Meta SEC filing shows Zuckerberg told a special committee he was considering leaving California ahead of the Prop 40 vote (a one-time billionaire tax). The committee got him to agree to stay in California or wherever Meta is HQ'd for eight years. A new stock class gives him $20B of immediate liquidity to pay the tax; a person familiar says the class totals $150B.", "angle": "Tax policy becoming a governance and control-rights event. Meta also -9.4% this week.", "tweetA": "Zuckerberg told Meta's committee he was considering leaving California over Prop 40's billionaire tax. The fix: an 8-year residency pledge and a new share class with $20B of liquidity to pay it. Tax policy is now a corporate governance event. $META", "tweetB": "A state answers concentrated wealth with a one-time tax and the billionaire answers with a share class. Control rights are being used as tax planning. Expect copycats before the vote.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/ai-pricing-pages-leave-buyers-guessing"}, {"id": 20, "cat": "geopolitics", "urgency": "deep", "source": "The Founders Corner", "title": "Merz tells German business to open data to AI; €850B of planned investment through 2028; Nvidia signs MOU", "idea": "At the Invest in Germany Summit, Chancellor Merz urged firms to open data to AI; the economy ministry signed a memorandum with Nvidia and Nvidia announced planned investments in four German startups. Made for Germany sees €2.9T-€4.1T of investment potential by 2035; members plan more than €850B through 2028.", "angle": "Germany's pivot to state-sponsored industrial AI, in an energy-constrained grid.", "tweetA": "€850B of planned investment through 2028, the chancellor telling firms to feed data to AI, and an Nvidia MOU with the economy ministry. Germany moved from AI skeptic to state-sponsored industrial AI, on a grid heading into its tightest gas winter in 14 years. $NVDA", "tweetB": "Every sovereign AI push ends the same way: an Nvidia ecosystem investment. Chips are the one export that's tariff-proof because it's a dependency, not a product. Watch who's on the cap table of the four startups.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/ai-pricing-pages-leave-buyers-guessing"}, {"id": 21, "cat": "AI/infra", "urgency": "watch", "source": "The Founders Corner", "title": "micro1 commits $1B to buy company data and recruit experts", "idea": "micro1 will spend $1B over twelve months buying data from companies (financed by Citi and Hercules Capital); offers range $100K to $2M+, experts earn $20-$200/hr, referrals pay up to $50K.", "angle": "Data getting a price: a new asset class on balance sheets that doesn't exist yet.", "tweetA": "micro1 is putting $1B into buying company data at $100K-$2M a pop. Data is acquiring a price. If your firm has years of operational exhaust, that's a balance-sheet asset nobody has booked yet.", "tweetB": "Hercules Capital is venture debt. Venture debt funding data purchases to sell to labs is the same borrow-spend-save loop Damped Spring describes, one layer down. Watch the lender.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/ai-pricing-pages-leave-buyers-guessing"}, {"id": 22, "cat": "venture", "urgency": "watch", "source": "The Founders Corner", "title": "AI pricing pages: what does $20 a month actually buy? Plans sell 4x and 15x of an undisclosed base", "idea": "Elena Verna (Lovable growth) reviewed AI pricing pages: many sell tokens and usage multipliers while hiding what one unit is worth. One product's tiers promise 4x and 15x more usage than Plus while the Plus allowance is secret. Verna admits Lovable has the same issue. Advice: put a real task count on each tier.", "angle": "Unit economics still unstable at the consumer layer. Seat pricing died, token pricing hasn't been born.", "tweetA": "AI plans sell '4x' and '15x' more usage than a base allowance they won't publish. You don't hide the base unless you might need to change it. Multiplying an undefined unit is the cleanest sign inference unit economics aren't settled.", "tweetB": "When buyers can't tell what a dollar buys, churn arrives with the first bill shock. The seat model is dead and the token model isn't born. First vendor to price per completed task wins enterprise.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/ai-pricing-pages-leave-buyers-guessing"}, {"id": 23, "cat": "tech", "urgency": "watch", "source": "The Founders Corner", "title": "App Store vs web checkout: Apple's 15% fee keeps $8.49 of $9.99; web keeps $9.33 but break-even is ~9% conversion loss", "idea": "On a $9.99 subscription a small developer keeps $8.49 through Apple's 15% and $9.33 via web checkout with Stripe. The 84-cent gap is erased if about 9% of buyers drop at the web paywall; published tests at the 15% rate came out flat or worse. On Android, link plus Stripe keeps $8.33 vs $8.49 in-app. Heavy inference costs raise the break-even.", "angle": "Apple's lower fee works as lock-in; thin AI-app margins make the toll sting more.", "tweetA": "On a $9.99 sub: Apple at 15% nets $8.49, web checkout $9.33. The 84c gap vanishes if web loses 9% of buyers. Apple cut the toll just enough to keep the lock-in. $AAPL", "tweetB": "Heavy-inference apps have thin margins, so 84 cents is most of the profit. Apple's cut isn't a software tax anymore, it's a tax on the gross profit of AI apps. Services revenue is safest from exactly the developers who need relief most.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/ai-pricing-pages-leave-buyers-guessing"}, {"id": 24, "cat": "culture", "urgency": "watch", "source": "The Founders Corner", "title": "Cal AI: UFC creators drove 'crickets'; one creator went from 10K views to a 7M-view post in month three", "idea": "Cal AI signed UFC creators for audience fit and saw no download spike. Co-founder Jake Castillo picks creators by reading comment sections: 'Views can lie. Followers can lie, but comments cannot.' Revenue per thousand views sets the ceiling on payouts. One flat-rate creator went from 10-12K views per video to a 7M-view post in month three.", "angle": "Distribution is power-law and audience fit predicts little. Choose signals that cost something to fake.", "tweetA": "Cal AI signed the obvious audience, UFC fighters tracking calories, and got crickets. Another creator went 10K views to 7M in month three. Distribution is power-law and fit is a poor predictor. Pay on RPM, not demographics.", "tweetB": "He picks creators by reading comments because comments are expensive to fake. Same logic as this week's tape: credit spreads carried the stress while the VIX fell. The signal that costs something is the one to trust.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/ai-pricing-pages-leave-buyers-guessing"}, {"id": 25, "cat": "labor", "urgency": "watch", "source": "The Founders Corner", "title": "47% of founders pay at least one leader more than themselves; 15 take $0", "idea": "Hampton surveyed 250 founders/CEOs: ~47% pay at least one functional leader more than their own base; 15 take $0 salary. 39% of bootstrapped founders take $500K+ on top of salary, while every venture-backed founder reported $300K or less in extra pay. Kruze 2026 puts median VC-backed CEO salary near $159K.", "angle": "Founder compensation reveals incentive structure: equity-heavy vs cash-extractive.", "tweetA": "47% of founders pay a leader more than themselves. 39% of bootstrapped founders take $500K+ on top of salary while no VC-backed founder took more than $300K extra. Equity is the tell: VC-backed founders are paid in the exit, bootstrapped founders in the cash flow.", "tweetB": "Median VC-backed CEO at $159K vs a forward-deployed engineer at $300K+. The scarce talent now out-earns the person with the equity. Compensation inversion at the top is an early sign of a labor market repricing.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/ai-pricing-pages-leave-buyers-guessing"}, {"id": 26, "cat": "science", "urgency": "watch", "source": "The Founders Corner", "title": "Handwired compiles JavaScript into a neural net with zero training", "idea": "Cheng Lou released Handwired, a toy project turning regular JavaScript into a neural network with no training; outputs match exactly and it runs in the browser. Demos include a small OS built from compiled weights and real-time search across 100k JSON records on WebGPU. Engineers can unfreeze weights and train parts of a UI like any model.", "angle": "If programs compile to weights, the line between software and model is a compiler flag.", "tweetA": "Handwired compiles ordinary JavaScript into a neural net, exact outputs, no training, 100k-record search on WebGPU. If programs compile to weights, the boundary between software and model is a compiler flag, and everything in the GPU stack gains a new customer: regular code.", "tweetB": "Unfreeze the weights and train parts of a UI like a model. Software becomes differentiable. Security teams, post-PHP, should read that as: exploitable logic you can gradient-descend on.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/ai-pricing-pages-leave-buyers-guessing"}, {"id": 27, "cat": "culture", "urgency": "watch", "source": "The Founders Corner", "title": "Tolan raises $30M: 250K active users, 70M conversations, 70% women, 40% parents", "idea": "AI companion app Tolan raised $30M (USV, Khosla), doubling total funding. ARR in double-digit millions, 250,000+ active users, 70M+ conversations in the past year; ~70% of users are women and 40% are parents.", "angle": "AI companions as a utility for time-starved adults, with real subscription revenue.", "tweetA": "70M conversations from 250K users is 280 per user per year, almost one every weekday. 70% women, 40% parents. AI companions aren't a teen fad, they're a utility for time-starved adults.", "tweetB": "Double-digit-million ARR on 250K users is at least $40 per user per year. Companions earn more per head than most consumer social. The attention economy moves from feed to relationship.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/ai-pricing-pages-leave-buyers-guessing"}, {"id": 28, "cat": "regulation", "urgency": "deep", "source": "The Founders Corner", "title": "Amodei answers nine safety criticisms with nine costly decisions, incl. Mythos limited to cyber partners", "idea": "Dario Amodei wrote a ~2,000-word reply to Encode AI's Nathan Calvin, who listed nine Anthropic actions he said undercut safety commitments. Amodei answered with nine commercially costly decisions, including releasing Mythos only to selected cybersecurity partners, and admitted some issues could have been handled better. The IPO is expected in November.", "angle": "Safety commitments becoming risk factors in a prospectus.", "tweetA": "Amodei answered nine safety criticisms with nine costly decisions, e.g. Mythos released only to cybersecurity partners. With the IPO expected in November, safety commitments are no longer ethics, they're S-1 risk factors. Alignment as a covenant.", "tweetB": "Mythos restricted to cyber partners the same week AI-found PHP flaws produced millions of exploit attempts in hours. Restricted release looks less like caution and more like the only hedge. Kimi's open weights on Nov 4 will test it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/ai-pricing-pages-leave-buyers-guessing"}, {"id": 29, "cat": "science", "urgency": "watch", "source": "The Founders Corner", "title": "OpenAI acquires Orchestra Bio: agents to coordinate the 10-15 years between target discovery and approval", "idea": "OpenAI bought Orchestra Bio, a platform where scientists hand monitoring of studies and campaigns to AI agents; team joins Rosalind (OpenAI's life-sciences models). A new medicine takes roughly 10-15 years from target discovery to US approval; OpenAI wants agents to speed coordination between steps.", "angle": "Labs moving into biotech workflow, competing with biotech-AI startups directly.", "tweetA": "OpenAI buys Orchestra Bio to put agents on study coordination. The 10-15 year drug timeline is mostly handoffs, not chemistry. Agents compress handoffs first. That's a nearer-term cost curve than any protein-folding breakthrough.", "tweetB": "Biotech AI founders now compete with OpenAI directly. When the lab buys the workflow layer, the startups with the data are the ones with leverage. Watch which CROs sell data access.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/ai-pricing-pages-leave-buyers-guessing"}, {"id": 30, "cat": "venture", "urgency": "watch", "source": "TWiST Newsletter", "title": "TWiST: fundraising deadlines, reference checks, and Foursquare's exit to Infillion", "idea": "TWiST is cutting T&P posts to two longer pieces per week. This week: Gamma CEO Grant Lee argues for giving your fundraise a deadline so it doesn't linger; Superhuman's Shishir Mehrotra values reference checks over interviews and advises not telling the reference which traits matter. Also: Foursquare was acquired last month by ad tech firm Infillion and co-founder Dennis Crowley reflects; Datarails uses a four-signal attribution model.", "angle": "Small but concrete founder playbooks plus a decade-old consumer app exiting into ad tech.", "tweetA": "Gamma's CEO says set a fundraising deadline. A raise without a clock turns into a second job that eats the product. Time pressure is a negotiating asset for the founder, not just the investor.", "tweetB": "Foursquare ended as an ad-tech acquisition. The check-in app was the data asset all along; the app was the collection mechanism. Same arc as micro1 now paying $1B for company data.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/saturday-update-you-need-fundraising"}, {"id": 31, "cat": "culture", "urgency": "deep", "source": "Phil Dauber / Market Musing", "title": "Dauber: five layers of concentrated power in one individual's hands (orbital launch, Starlink, campaign money, media)", "idea": "Dauber asks readers if they are comfortable with: nearly all US orbital launch capability controlled by one private company run by one man; Starlink as a growing global communications source under the same control (citing the Ukraine 'switch flip'); $500M (known) in campaign contributions; alleged threats in response to investigations; and a reported $1B Skydance transaction touching Paramount/CBS/CNN. He leaves the individual unnamed and says transaction details matter. His answer: no.", "angle": "Opinion and allegation from the author; the structural point is vertical concentration across infrastructure, comms and media.", "tweetA": "Orbital launch, global comms, campaign money, media. Vertical integration used to be a corporate-strategy term. Now it describes one person's reach across layers of national infrastructure that no antitrust framework was built to see.", "tweetB": "Markets price all of this as a growth story. The same week, spectrum plus tower talks knocked ~8% off AT&T and T-Mobile in a day. The question isn't whether private infrastructure has state-level reach. It's whether regulators are the last to price it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://phildauber.substack.com/p/rollerball-redux"}, {"id": 32, "cat": "tech", "urgency": "deep", "source": "Phil Dauber / Market Musing", "title": "SpaceX tower talks: AT&T -7.96%, T-Mobile -7.71%, Crown Castle +9.06% in one session", "idea": "A Bloomberg report that SpaceX is in talks with at least one major tower owner for access to a large network of US cell sites sent AT&T down 7.96% and T-Mobile down 7.71% on Friday while Crown Castle rose 9.06% and American Tower 4.08%. This comes two weeks after SpaceX agreed to buy nationwide 800 MHz spectrum. Verizon reports Monday ($1.27 consensus).", "angle": "A fourth national carrier priced in a single session; landlords win either way.", "tweetA": "A fourth national carrier priced in one session: T -8%, TMUS -7.7%, CCI +9%. Towers collect rent from every carrier, including the new one. Real estate's best trade this week was a landlord, not a data center. $CCI $AMT", "tweetB": "Two weeks ago: nationwide 800 MHz spectrum. This week: tower access talks. Spectrum, sites and satellites assembled in 14 days. Verizon reports Monday. First management answer on how to price a new competitor. $VZ $T $TMUS", "charts": {"count": 1, "hot": false, "desc": "Sector walk charts, real-estate section - worth opening"}, "link": "https://phildauber.substack.com/p/rollerball-redux"}, {"id": 33, "cat": "macro", "urgency": "act", "source": "Phil Dauber / Market Musing", "title": "Brent +6.24% to $116.72, gold -4.14%, 10-year -9bp: war priced in one asset, peace in two", "idea": "Dauber's week in one paragraph: Brent $116.72 (+6.24%), gold -4.14%, VIX 19.45, 10-year 5.00% (-9bp). S&P 7,623.68, down 0.47% on the week (week-high close 7,757.17 Wednesday). He says the bond is the asset that's lying, though he's less sure than he'd like. Iran barred US military vessels from the Gulf, the IRGC said two supertankers hit mines, and the White House invoked the DPA for fuel.", "angle": "Three prices can't all be right. Gold's failure as a war hedge is the tell.", "tweetA": "Brent +6.24%, gold -4.14%, 10-year -9bp in the same week. War in oil, peace in gold and bonds. They can't all be right. Dauber says the bond lies. I'd say gold is the tell: it printed a 52-week low against equities in the middle of a Gulf war. $GLD $USO", "tweetB": "Gold's ratio to the S&P hit a 52-week low in a week of mined supertankers. If gold doesn't work as the war hedge, what is it hedging? A 5.00% 10-year competes for the same safe-haven dollar. Gold is trading as a bond proxy again, not a crisis asset.", "charts": {"count": 2, "hot": true, "desc": "Chart 1: barrel +6.24% vs gold -4.14% bars; Chart 3: gold vs S&P 52-week low"}, "link": "https://phildauber.substack.com/p/rollerball-redux"}, {"id": 34, "cat": "energy", "urgency": "deep", "source": "Phil Dauber / Market Musing", "title": "Brent-WTI blew out to $13.45 from $8.45; Brooks says Brent is pricing 6 mb/d of Gulf output vs a real ~20", "idea": "Brent settled $116.72 after a $117.41 weekly high; WTI +1.83% to $103.27. Brent-WTI went to $13.45 from $8.45: the premium is in waterborne Gulf barrels. Natural gas fell 15.28% to $2.640. Robin Brooks argues Gulf supply has almost fully normalized, front-month Brent prices Gulf output at ~6 mb/d vs a real figure near 20, fair value ~$90 and $125 the ceiling in a hot war. Dec-2027 future hasn't moved. HFI Research counters that ~18 of Hormuz's 21 mb/d is crude and buffers are running out.", "angle": "Two opposing views on the same strait, with a measurable spread and a settle-based kill level ($105 twice, clock to Nov 5).", "tweetA": "Brent-WTI $13.45, up from $8.45 in a week. The premium is in waterborne Gulf barrels, not American ones, and Dec-27 hasn't moved. If Brooks is right on a $90 fair value, that spread is a war premium with an expiry date. $XLE $USO", "tweetB": "HFI: buffers are running out. Brooks: supply has normalized. Same strait, opposite conclusions. Dauber's Brent clock runs to Nov 5 and dies on two settles under $105. Define your kill level before the headline does it for you.", "charts": {"count": 1, "hot": false, "desc": "Brent/WTI commodity charts - worth opening"}, "link": "https://phildauber.substack.com/p/rollerball-redux"}, {"id": 35, "cat": "tech", "urgency": "act", "source": "Phil Dauber / Market Musing", "title": "'Black October': AI-found PHP flaws drew millions of exploit attempts within hours of the Oct 21 patch", "idea": "AI models found exploitable flaws in PHP, patched 21 October. Cloudflare's Matthew Prince said attack attempts went from thousands to millions within hours. Sam Altman said he no longer thinks the industry can patch all bugs; Anthropic's Jason Clinton warned of a 'vulnerability tsunami' for about 18 months. CrowdStrike +13.3% on the week to $257.57; Palo Alto +7.2% on Friday. Jamie Dimon calls cyber 'our biggest risk by far'.", "angle": "Discovery got cheap, patching is still human-speed. Cyber budgets as structural.", "tweetA": "AI found the PHP flaws, patched Oct 21, and attempts went from thousands to millions within hours. Altman: can't patch everything. Clinton: ~18 months of tsunami. Discovery is now cheap and patching is still human speed. That's a structural budget line. $CRWD $PANW", "tweetB": "Dimon: cyber is 'our biggest risk by far.' Cboe and CME were the best financials this week selling resilience. The market is paying for the one thing AI makes scarcer: a system that doesn't break. The first outage at a bank or exchange is the real catalyst.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://phildauber.substack.com/p/rollerball-redux"}, {"id": 36, "cat": "AI/infra", "urgency": "act", "source": "Phil Dauber / Market Musing", "title": "Lam -12.8%, Meta -9.4% after ~$825B of long-dated commitments; AI basket -23.3% from June high", "idea": "Lam Research fell 12.8% on the week to $230.10. Meta fell 9.4% to $642.62 after disclosing ~$825B of long-dated commitments. Dauber: the AI trade's problem isn't demand, it's who pays and how much of the bill is debt. A basket of AI-linked tech stocks is 23.3% below its June high, deeper than July's drawdown, and bond issuance is the fastest-growing source of AI capex funding into 2027. Vistra -7.8% to $140.16.", "angle": "Tool seller and building buyer repriced in 48 hours; AI capex now runs through credit.", "tweetA": "$825B of long-dated commitments is what Meta disclosed. Stock -9.4%. Lam -12.8%. The tool seller and the building buyer repriced inside 48 hours. The question is no longer whether demand is real. It's who finances it, and the answer is the bond market. $META $LRCX", "tweetB": "The AI basket is 23.3% below its June high, deeper than July. Bond issuance is the fastest-growing capex funder into 2027. Equities are already pricing the credit risk. HY at 327bp is the other half of the same trade.", "charts": {"count": 2, "hot": true, "desc": "Chart 4: AI-linked basket -23.3% from June high; Chart 5: bond issuance as fastest-growing AI capex funding source"}, "link": "https://phildauber.substack.com/p/rollerball-redux"}, {"id": 37, "cat": "positioning", "urgency": "deep", "source": "Phil Dauber / Market Musing", "title": "Momentum de-grossing: hedge fund VIP basket -4.18% in a day; prime-book momentum exposure ~25% vs ~60% in spring", "idea": "Goldman's hedge fund VIP basket lost 4.18% in one day, among the largest single-day drops since 2011. High-beta momentum at 489.88 retested its September low and sits below its 50/100/200-day averages (200D at 620.77). Prime-book exposure to medium-term momentum is about 25% of fund equity, down from near 60% in the spring.", "angle": "De-grossing is well along: forced selling from funds is mostly done. What's left is the crowded hedge.", "tweetA": "Hedge fund favorite longs -4.18% in a day. Momentum exposure 60% to 25% of fund equity since spring. The crowded long is mostly gone, so the next leg down isn't forced fund selling. Whoever sells next hasn't sold yet.", "tweetB": "What's left isn't the crowded long. It's the crowded hedge: record short-ETF volume. Everyone is long puts into FOMC. That raises squeeze risk, not lowers it. VIX 19.45 vs Dauber's 22 cut-off.", "charts": {"count": 3, "hot": true, "desc": "Charts 8-10: VIP basket drop, momentum factor vs 200D, prime-book momentum exposure"}, "link": "https://phildauber.substack.com/p/rollerball-redux"}, {"id": 38, "cat": "positioning", "urgency": "deep", "source": "Phil Dauber / Market Musing", "title": "Retail at record -$1.03T credit balances while pros buy record inverse-ETF volume", "idea": "Investor credit balances hit a record negative $1.03 trillion in August (retail margin borrowing at its deepest), while short-ETF volume hit a record high. Dauber: a sharp rally squeezes the second crowd, a sharp drop margin-calls the first. VIX at 19.45 sits 2.55 points under his 22 kill line.", "angle": "Both sides over-positioned in a low-vol tape. Counter to Goldman's 'households are the deep bid'.", "tweetA": "Retail credit balances at -$1.03T. Pros buying record volume in inverse ETFs. Two crowds, opposite bets, one exit. A sharp rally squeezes one, a sharp drop margin-calls the other.", "tweetB": "Retail levered long, institutions hedged short, and the VIX at 19. When both sides are over-positioned and vol is low, the catalyst isn't news. It's the first forced seller. Goldman says households are a deep bid; leverage at the margin disagrees.", "charts": {"count": 2, "hot": true, "desc": "Chart 11: record short-ETF volume; Chart 12: record negative credit balances"}, "link": "https://phildauber.substack.com/p/rollerball-redux"}, {"id": 39, "cat": "macro", "urgency": "deep", "source": "Phil Dauber / Market Musing", "title": "Liquidity has no cushion: TGA rebuilt $122B to $952B in 13 weeks, RRP ~$0.2B, SOFR at IORB, HY +60bp in 4 weeks", "idea": "Per Lighthouse Macro's 'Hiking into a Drain', the Treasury General Account was rebuilt by $122B over 13 weeks to $952B. Reverse repo sits near $0.2B and SOFR is back at the interest rate on reserves. High yield widened about 60bp in four weeks. Bob Sheehan notes crypto feels liquidity first, though Dauber says a soft crypto tape could just be a crowded long unwinding.", "angle": "Funding plumbing with no buffer, just as credit widens. Crypto as liquidity canary or crowded long.", "tweetA": "TGA at $952B, reverse repo at $0.2B, SOFR at IORB. Policy is being set into a drain with no buffer left, and HY is already +60bp in four weeks. Funding markets don't gap slowly. $HYG $SOFR", "tweetB": "Sheehan: crypto feels liquidity first. Dauber: could be a crowded long unwinding. With reverse repo at $0.2B, the first shock hits cash that no longer sits at the Fed. $BTC is a canary only if you believe the first explanation.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://phildauber.substack.com/p/rollerball-redux"}, {"id": 40, "cat": "credit", "urgency": "deep", "source": "Phil Dauber / Market Musing", "title": "HY above 325bp on every dated print (331/329/333/327) while the VIX fell; HYG +0.25% against a 9bp rally", "idea": "High yield printed 331bp (16 Oct), 329, 333 and 327bp (21 Oct, latest dated print); IG at 88bp from ~84. HYG gained only 0.25% in a week the 10-year rallied 9bp, so spread ate the rate move. Dauber: a rally with spreads this wide is a funding story. Knapp's template is 2018, when the Fed kept going and credit broke first. Kill switches: HY 400bp with a rising 10-year.", "angle": "Credit disagrees with equity vol. The tell is HYG's muted response to the rate rally.", "tweetA": "10-year rallied 9bp, HYG gained 0.25%. Spread ate the rate move. HY has sat above 325bp on every print while the VIX dropped. A rally that doesn't lift credit isn't risk-on. $HYG $JNK", "tweetB": "HY 327bp, VIX 19. Equity vol says calm, credit says funding story. In 2018 credit broke first and equities followed by Q4. Dauber's VIX trigger is 22. Mine is whichever of 400bp HY or a rising 10-year gets there first.", "charts": {"count": 2, "hot": true, "desc": "Chart 13: HY above 325bp while VIX fell; Chart 16: spec-grade default rate projections"}, "link": "https://phildauber.substack.com/p/rollerball-redux"}, {"id": 41, "cat": "macro", "urgency": "deep", "source": "Phil Dauber / Market Musing", "title": "Bull flattening: 30y 5.33%, 10y 5.00%, 2y 4.69%; 2s10s +31bp from +35bp; Knapp says Fed pivoted away from an October hike", "idea": "2-year 4.69% (-5bp), 10-year 5.00% (-9bp), 30-year 5.33% (-10bp); 2s10s to +31bp from +35bp, 2s30s +64bp from +69bp. Barry Knapp attributes the long-end rally to the Fed's pivot away from an October hike, with December alive and housing as ground zero. Alternative: haven demand with nowhere else to go. D.R. Horton +5.8% to $147.48. Knapp also flags data-center credit spreads and capex vs cash flow.", "angle": "Bond market choosing growth risk over inflation risk. Housing is the first transmission channel.", "tweetA": "30-year at 5.33% and 10-year at 5.00% rallied twice as much as the 2-year. Bull flattening in a tape worried about a hike says the bond market thinks growth breaks before inflation does. D.R. Horton +5.8% on one rate move. $TLT $DHI", "tweetB": "Builders rallied on a single rate move, and Dauber is short Lennar because a 30-year at 5.33% is still 5.33%. Housing is ground zero per Knapp, and the most rate-sensitive sector gets the first policy-error bill.", "charts": {"count": 2, "hot": true, "desc": "Chart 2: 10y/30y fell twice as far as 2y; curve flattening"}, "link": "https://phildauber.substack.com/p/rollerball-redux"}, {"id": 42, "cat": "positioning", "urgency": "deep", "source": "Phil Dauber / Market Musing", "title": "Sector pair: long energy (XLE 69.33) vs consumer staples (XLP 88.26); staples hit a record Thursday then -1.92% Friday", "idea": "Staples closed at a record Thursday on defensive flows, then dropped 1.92% Friday with Coca-Cola -2.76%. Dauber's pair: producers collect a $116.72 barrel, staples pay it in diesel, resin and freight while volume softens. Wrong if Brent settles under $105 twice or XLP closes above 90 with XLE lower. Risk: Brooks is right and the premium bleeds, which helps staples at the same time. Health care also at record highs (UNH $418.09, Lilly $1,273.46).", "angle": "Energy-vs-staples is a margin trade. Both legs turn together if Brent premium collapses.", "tweetA": "Staples hit a record Thursday on a defensive bid with Brent at $116. Staples pay for crude in diesel, resin and freight. A sector rallying into its own input-cost spike is crowded defense. Energy over staples is a margin trade, not a macro one. $XLE $XLP", "tweetB": "The risk: Brooks is right, Brent bleeds to $90, and energy loses its engine while staples get input relief. Both legs turn at the same time. The pair needs a hard Brent floor: two settles under $105.", "charts": {"count": 1, "hot": false, "desc": "Chart 6: nine of eleven sectors beat the S&P - worth opening"}, "link": "https://phildauber.substack.com/p/rollerball-redux"}, {"id": 43, "cat": "credit", "urgency": "deep", "source": "Phil Dauber / Market Musing", "title": "Own the exchanges, short the lenders: Cboe +8.08%, Nasdaq +9.14%, CME +4.03% vs Ares and Blue Owl lower", "idea": "Cboe $340.42 (+8.08%), Nasdaq Inc +9.14%, CME $305.71 (+4.03%); Ares Capital $18.64 and Blue Owl Capital Corp $10.05 both lower. Exchange volume and vol pay whichever way the tape breaks; BDCs hold floating-rate loans to the companies hurt first by defaults. Ares reports Tuesday: NAV vs $19.35 prior, non-accruals vs 2.4%. Regionals: KRE +3.80% to 72.46 but Dauber is short Huntington and calls the rally fragile into core PCE. Exchanges gained ~6% vs JPM -2.40%, BAC -1.31%.", "angle": "Toll collector vs holder of paper. Ares NAV Tuesday is the test for private credit marks.", "tweetA": "Own the toll collector, short the lender. Cboe +8%, Nasdaq Inc +9%, CME +4% while Ares and Blue Owl slid. Volume pays the exchange whichever way the tape breaks. BDCs hold the floating-rate paper at the companies a default cycle hits first. $CBOE $CME $ARCC", "tweetB": "Spec-grade default rates are projected to rise toward cycle highs and private credit marks are quarterly fiction until the first non-accrual. Ares reports Tuesday vs a $19.35 NAV and 2.4% non-accruals. That is the first audited read on the mid-market book.", "charts": {"count": 2, "hot": false, "desc": "Chart 15: exchanges vs regionals vs money-center spread inside financials"}, "link": "https://phildauber.substack.com/p/rollerball-redux"}, {"id": 44, "cat": "tech", "urgency": "deep", "source": "Phil Dauber / Market Musing", "title": "KOSPI (~5,534) has broken its 200-day (~6,442); SOX -3.21%; Micron still $877.55", "idea": "Korea's KOSPI, the purest listed proxy for the memory/chip cycle, sits near 5,534, below its 200-day average (chart: ~6,442), a ~14% gap. The semiconductor index fell 3.21% to 10,779.46. Micron closed at $877.55. Dauber prefers security over semiconductor capex.", "angle": "The global chip proxy lost trend while a US memory leader holds up; one of them is wrong.", "tweetA": "KOSPI ~5,534 vs a 200-day near 6,442, ~14% under the average. Korea is the cleanest listed proxy for memory and the chip cycle, and it just lost trend while SOX fell 3.21%. When Samsung and Hynix lose trend, HBM pricing power is the next question. $MU $SMH", "tweetB": "Micron at $877 while KOSPI sits 14% under its 200D. One of them is wrong. Meta's capex disclosure hit the tool makers first (Lam -12.8%). If memory is next, the Korean tape already knows.", "charts": {"count": 1, "hot": false, "desc": "Chart 7: KOSPI through its 200-day average"}, "link": "https://phildauber.substack.com/p/rollerball-redux"}, {"id": 45, "cat": "energy", "urgency": "watch", "source": "Phil Dauber / Market Musing", "title": "Short copper: AI capex cuts land on industrial metals first (copper $6.476; Freeport -6.3%)", "idea": "Copper closed at $6.476, down 0.84%; Freeport fell 6.3%; Nucor $258.11; gold's -4.14% hit materials too. Dauber's view: the capex cut in AI lands on industrial metals before it lands anywhere else, so he's short copper through CPER. Dow Inc jumped 9.0% to $32.61.", "angle": "Copper as the first read-through of AI capex cuts; contradicts electrification long theses.", "tweetA": "If AI capex gets cut, the first place it shows up isn't a chip company. It's copper. Grid, data center wiring, power. Freeport -6.3% in a week gold fell 4% says the metal market is already pricing a lower capex slope. $FCX $COPX", "tweetB": "Copper at $6.476 is the electrification trade and the AI-capex trade at the same time. If you're long one theme and short the other, you're hedged by accident. Check the netting. $CPER", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://phildauber.substack.com/p/rollerball-redux"}, {"id": 46, "cat": "positioning", "urgency": "deep", "source": "Phil Dauber / Market Musing", "title": "Dauber's book: 2/3 of units pay only if funding stays stressed; scenario weights 40/25/20/10/5", "idea": "13 live lines, 6.00 units. Credit 42%, energy 21%, long end 17%. Rates plus credit are 4.00 of 6.00 units (67%); the long-end duration short stays blocked for the 25th run for lack of a level target. Scenarios: stagflationary squeeze 40%, orderly normalization 25%, credit break 20%, oil premium bleeds 10%, AI upside 5%. Kill switches: VIX 22 (2.55 away), HY 400bp (73bp away), Brent under $95 ($21.72 away). Watch list: 5-year auction Tuesday ($70B, tail >1bp), Thursday GDP (3.0% vs 2.2% prior), core PCE 3.1%.", "angle": "Useful as a template for how a practitioner sizes scenarios and writes kill levels. Includes a list of dated catalysts.", "tweetA": "A book where two-thirds of risk pays only if funding stays stressed, with a quarter-unit of VIX premium as the only hedge against the switch. Concentration is the position, and every level that kills it is written down in advance. That discipline is rarer than the idea.", "tweetB": "Five scenarios: 40% stagflationary squeeze, only 5% AI upside. The 40% needs HY over 325bp and Brent over $110 to hold at the same time. Wednesday's FOMC and Thursday's PCE are the first real test of whether they do.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://phildauber.substack.com/p/rollerball-redux"}, {"id": 47, "cat": "macro", "urgency": "deep", "source": "Macro Mornings", "title": "S&P PEG ratio at 0.68, the lowest in 30 years - 21% below March 2009", "idea": "PEG (forward P/E divided by expected 5Y earnings growth) is 0.68 vs a 30-year average of 1.35. March 2009, with the S&P down 57%, was 0.86; July 2020 was 2.32 and March 2022 1.95. Growth expectations would need to be cut ~32% to return PEG to 1.0, ~50% to the average. Prior sub-1.0 readings: 2009 +69% in 12 months, Dec 2018 +38%, Oct 2022 +21%. The biggest rebound came with the biggest dollar fall.", "angle": "Cheap on growth only if analyst growth forecasts are right; direction matters since the PEG is falling because growth expectations rise faster than price.", "tweetA": "S&P PEG at 0.68. At the March 2009 bottom, with the index down 57%, it was 0.86. Cheap only if 5Y growth forecasts are real: they'd need a 32% cut to take PEG back to 1.0. Credit is already trading as if someone gets that cut. $SPY", "tweetB": "Three prior sub-1.0 PEG episodes: +69%, +38%, +21% in 12 months. The biggest rally came with the biggest dollar drop (~10%). The DXY is flat at 101.81 in the middle of a Gulf war. If the dollar breaks, the PEG trade gets its trigger.", "charts": {"count": 3, "hot": true, "desc": "Charts: PEG history 30 years; EPS vs P/E decomposition; presidential cycle - worth saving"}, "link": "https://macromornings.substack.com/p/1978-its-happening-again-and-almost"}, {"id": 48, "cat": "macro", "urgency": "deep", "source": "Macro Mornings", "title": "EPS +30% x P/E -13% = +13%: a blue-bar rally. 2018 looked the same and fell 20%", "idea": "S&P 7,822: EPS +30% Y/Y with P/E -13%, which compounds to ~+13%, profit-driven while the market got cheaper. 2018: earnings +23% with P/E -27%, S&P fell 20% in Q4 (10Y peaked 3.24%) until the Fed blinked and 2019 returned +29%. 2022: valuations -35%, S&P -25%, 10Y 1.5% to 4.25%, dollar index +19%, EUR/USD through parity. Same divergence, two endings; the bond market chose both.", "angle": "Valuation compression with rising EPS ends well only if yields fall. Where does 5.00% on the 10-year sit on this map?", "tweetA": "S&P up ~13% is EPS +30% times P/E -13%: all blue bars, none pink. 2018 looked the same (+23% EPS, -27% P/E) and still lost 20% in Q4 until the Fed blinked. The multiplier doesn't decide the ending. The 10-year does.", "tweetB": "2018: 10-year peaked at 3.24% and the Fed blinked. 2022: yields +275bp, bear market. Today the 10-year is at 5.00% with a Fed that just pivoted away from a hike. Where does 5% sit on that map?", "charts": {"count": 1, "hot": true, "desc": "EPS growth vs P/E change decomposition chart with 2018 and 2022 circled"}, "link": "https://macromornings.substack.com/p/1978-its-happening-again-and-almost"}, {"id": 49, "cat": "positioning", "urgency": "deep", "source": "Macro Mornings", "title": "Midterm low: +17% average from Q4 midterm year to Q2 pre-election year, 100% hit rate since 1900", "idea": "Since 1900, from the midterm-year Q4 low through Q2 of the pre-election year, US stocks gained ~17% on average with a 100% hit rate (election Nov 3). Applied to 7,822 that is ~9,150 by mid-2027. Recent windows: 2010 +33%, 2014 +14%, 2018 +25%, 2022 +28%. The two strongest came with a falling dollar; the weakest with a dollar rally. The author flags a Treasury announcement the morning after the election that moved markets in 2023 more than any Fed meeting.", "angle": "Cycle sets direction, dollar sets distance. The post-election Treasury announcement is the hidden catalyst.", "tweetA": "Midterm Q4 low to Q2 of the pre-election year: +17% average, 100% hit rate since 1900. That's a small sample from regimes without a 5% 10-year. The cycle sets the direction. The dollar sets the distance.", "tweetB": "Strongest windows (2010 +33%, 2022 +28%) came with a falling dollar. The weakest (2014 +14%) came with a dollar rally. The midterm trade is a dollar trade in disguise, and the morning after the vote may matter more than the vote.", "charts": {"count": 1, "hot": false, "desc": "Presidential cycle chart - worth opening"}, "link": "https://macromornings.substack.com/p/1978-its-happening-again-and-almost"}, {"id": 50, "cat": "gold", "urgency": "watch", "source": "Macro Mornings", "title": "Teaser: 'Gold is leaving America at a record pace' and an inflation chart that looks like 1978", "idea": "The email's free half hints at what's behind the paywall: a bond market that won't calm down, a corner of credit cracking where AI money is borrowed, a country shipping gold abroad at a pace 'no one alive has seen', and an inflation chart resembling 1978. The author says outcomes in every episode were written by something most equity investors never look at, with a date 10 days away. Detail is in the PRO section (not visible).", "angle": "Paywalled; only the premise is visible. The gold-export claim is worth verifying against COMEX/customs data.", "tweetA": "Gold leaving the US at a record pace while gold falls 4% in a Gulf war. Who exports bullion into a falling price? Either arbitrage between COMEX and London/Shanghai, or foreign custodians repatriating. Both say something about the dollar system, not about gold.", "tweetB": "The 1978 comparison: oil shock, Fed that won't commit, a bond market pricing something else. With Brent at $116, core PCE at 3.1% and a Fed that just stepped back from a hike, the question isn't whether inflation turns. It's who forces the policy response.", "charts": {"count": 1, "hot": false, "desc": "Inflation chart vs 1978 - paywalled, worth opening"}, "link": "https://macromornings.substack.com/p/1978-its-happening-again-and-almost"}];

const COLORS = {"macro": "#e24b4a", "credit": "#378add", "positioning": "#ef9f27", "AI/infra": "#1d9e75", "crypto": "#7f77dd", "geopolitics": "#d85a30", "energy": "#f97316", "tech": "#06b6d4", "gold": "#d4a017", "culture": "#ec4899", "labor": "#8b5cf6", "regulation": "#64748b", "science": "#14b8a6", "venture": "#84cc16"};

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function cardHtml(item){
  var c = COLORS[item.cat];
  var chIcon = item.charts.count>0 ? (item.charts.hot?' 🔥':' 📊') : '';
  var h = '<div class="card" id="c'+item.id+'" data-id="'+item.id+'">';
  h += '<div class="hd" onclick="toggle('+item.id+')"><span class="num">'+String(item.id).padStart(2,'0')+'</span><span>'+UR[item.urgency]+'</span>';
  h += '<span class="badge" style="background:'+c+'">'+esc(item.source)+'</span><span class="tag">'+esc(item.cat)+'</span><span>'+chIcon+'</span>';
  h += '<span class="ttl">'+esc(item.title)+'</span></div>';
  h += '<div class="body"><div class="lbl">The Idea</div><div>'+esc(item.idea)+'</div>';
  h += '<div class="lbl">My Angle</div><div class="angle" style="border-color:'+c+';background:'+c+'14">'+esc(item.angle)+'</div>';
  h += '<div class="tw"><div><div class="lbl" style="color:#378add;margin-top:0">Tweet A</div><p>'+esc(item.tweetA)+'</p><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  h += '<div><div class="lbl" style="color:#7f77dd;margin-top:0">Tweet B</div><p>'+esc(item.tweetB)+'</p><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>';
  if(item.charts.count>0){h += '<div class="ch'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING · ':'📊 ')+item.charts.count+' chart(s): '+esc(item.charts.desc)+'</div>';}
  h += '<a class="lnk" href="'+esc(item.link)+'" target="_blank" rel="noopener">↗ Read full article</a>';
  h += '</div></div>';
  return h;
}
function toggle(id){document.getElementById('c'+id).classList.toggle('open');}
function matches(it){
  if(state.cat!=='all' && it.cat!==state.cat) return false;
  if(state.urg!=='all' && it.urgency!==state.urg) return false;
  if(state.src && it.source.indexOf(state.src)===-1) return false;
  return true;
}
function render(expand){
  var list = ITEMS.filter(matches);
  var h = list.map(cardHtml).join('');
  document.getElementById('cards').innerHTML = h || '<div class="empty">No items</div>';
  if(expand){list.forEach(function(it){document.getElementById('c'+it.id).classList.add('open');});}
  bars();
}
function bars(){
  var cb = '<span class="pill'+(state.cat==='all'?' active':'')+'" style="'+(state.cat==='all'?'background:#333':'')+'" onclick="setCat(\'all\')">All '+ITEMS.length+'</span>';
  CATS.forEach(function(c){
    var n = ITEMS.filter(function(i){return i.cat===c;}).length;
    if(!n) return;
    var a = state.cat===c;
    cb += '<span class="pill'+(a?' active':'')+'" style="'+(a?'background:'+COLORS[c]:'')+'" onclick="setCat(\''+c+'\')">'+c+' '+n+'</span>';
  });
  document.getElementById('catbar').innerHTML = cb;
  var us = [['all','All'],['act','🔴 Act Now'],['deep','🔵 Deep'],['watch','🟡 Watch']];
  var ub = '';
  us.forEach(function(u){
    var n = u[0]==='all' ? ITEMS.length : ITEMS.filter(function(i){return i.urgency===u[0];}).length;
    var a = state.urg===u[0];
    ub += '<span class="pill'+(a?' active':'')+'" style="'+(a?'background:#333':'')+'" onclick="setUrg(\''+u[0]+'\')">'+u[1]+' '+n+'</span>';
  });
  document.getElementById('urgbar').innerHTML = ub;
}
function setCat(c){state.cat=c;state.src=null;render(false);}
function setUrg(u){state.urg=u;state.src=null;render(false);}
function filterBySrc(name){state.src=name;state.cat='all';state.urg='all';render(true);}
function srcClick(i){filterBySrc(META.includedSources[i].name);}
function init(){

  META.includedSources.forEach(function(s,i){r += '<span class="src" onclick="srcClick('+i+')">'+esc(s.name)+'</span> ('+s.count+')<br>';});
  r += '</p><p><b>Skipped:</b><br>';
  META.skippedSources.forEach(function(s){r += esc(s.name)+' — '+esc(s.reason)+'<br>';});
  r += '</p><p><span class="src" onclick="setCat(\'all\')">Reset filters</span></p>';
  document.getElementById('repbody').innerHTML = r;
}
