<script>
const ITEMS = [{"id": 1, "cat": "macro", "urgency": "act", "source": "Daily Chartbook (DC Lite #716)", "title": "Payrolls 165k topped every forecast in the Bloomberg survey — 3m average 137k from 28k in July", "idea": "October payrolls rose 165k, above the highest estimate in the Bloomberg survey. The 3-month average has climbed to 137k from just 28k in July, the strongest since May, and the improvement is described as broadening.", "angle": "Stronger labor data on a day vol was already blowing out means the Fed put is further away, not closer. Feeds the hike-odds narrative.", "tweetA": "28k to 137k on the 3-month average in three months. The Fed that was supposed to be 'looking through' weakness now has to look through strength. Good luck with that while equity vol is screaming.", "tweetB": "Every forecaster in the survey was below 165k. When the whole street is wrong in one direction, it's a positioning story first and a macro story second. Who was short rates into this print?", "charts": {"count": 1, "hot": true, "desc": "Chart of NFP with 3-month moving average rising from 28k (Jul) to 137k — the turn is the story."}, "link": "https://www.dailychartbook.com/p/this-rotation-has-been-going-on-for-a-while-dw2d"}, {"id": 2, "cat": "macro", "urgency": "deep", "source": "Daily Chartbook (DC Lite #716)", "title": "Positive wealth effects added 0.4pp to US GDP — AI drawdown is a consumption risk", "idea": "Goldman estimates the wealth effect from equities has added 0.4 percentage point to US GDP over the past year. A pullback in AI stocks would hit household wealth and spending.", "angle": "The reflexive loop: AI capex props GDP directly and equity wealth props consumption. Both legs break together if AI stocks keep falling.", "tweetA": "0.4pp of GDP is sitting on AI stock prices. That's the part of the AI trade nobody puts in the capex slide: the consumer is long the same basket.", "tweetB": "Everyone argues whether AI capex is sustainable. Fewer ask what happens to the top-decile consumer when the same stocks are down 15%. Wealth effect is a one-way ratchet until it isn't. $SPY", "charts": {"count": 1, "hot": false, "desc": "Goldman chart: contribution of wealth effects to US GDP growth."}, "link": "https://www.dailychartbook.com/p/this-rotation-has-been-going-on-for-a-while-dw2d"}, {"id": 3, "cat": "positioning", "urgency": "act", "source": "Daily Chartbook (DC Lite #716)", "title": "Hedge funds sold AI stocks at the fastest pace in 5+ years — 20-day selling at -3.0 SD", "idea": "Per Goldman, HFs sold AI stocks at the fastest pace in over five years; trailing 20-day HF selling hit a 5-year extreme at -3.0 standard deviations.", "angle": "A -3 SD flow is the kind of reading that marks forced de-grossing or capitulation. Pair with record put volume the same week.", "tweetA": "-3.0 SD of hedge fund selling in AI, 5-year extreme, and the 11M-put record landed the same week. Positioning is washed or the unwind isn't done. I don't have a view on which, and neither does anyone claiming one.", "tweetB": "Funds sold AI at a 5-year-record pace and the stocks still didn't find a bid. Either the buyer is absent or the selling is only part-way through. $NVDA $AVGO", "charts": {"count": 1, "hot": true, "desc": "Goldman chart of HF net selling in AI stocks, 20-day trailing, at -3.0 SD."}, "link": "https://www.dailychartbook.com/p/this-rotation-has-been-going-on-for-a-while-dw2d"}, {"id": 4, "cat": "positioning", "urgency": "deep", "source": "Daily Chartbook (DC Lite #716)", "title": "AI vs non-AI rolling 6-month performance gap is the worst of this 4-year bull market", "idea": "Carson Group: over rolling six-month windows, AI minus non-AI stock performance is now the worst differential of the four-year bull market. The rotation is not a week or two, it has been going on for a while.", "angle": "The index masks the rotation. Equal-weight and non-AI are doing the work while cap-weight AI names drag.", "tweetA": "Worst AI-vs-rest spread of the whole bull market. The index has been telling you 'fine' while the leadership has been quietly handed to everything else.", "tweetB": "If the rotation is six months old, the bounce-the-dip crowd is fading a trend, not a headline. What changes it: earnings, not narrative.", "charts": {"count": 1, "hot": false, "desc": "Rolling 6m AI vs non-AI relative performance at its worst of the bull run."}, "link": "https://www.dailychartbook.com/p/this-rotation-has-been-going-on-for-a-while-dw2d"}, {"id": 5, "cat": "AI/infra", "urgency": "watch", "source": "Daily Chartbook (DC Lite #716)", "title": "KOSPI semi FY3 P/B at ~0.7x — historical low, historically a semi-cycle bottom signal", "idea": "Goldman notes KOSPI semiconductor sector FY3 price/book has fallen to a historic low near 0.7x, a level that has historically marked the bottom of the semi cycle with encouraging forward returns.", "angle": "Memory/HBM names priced for cycle death while the rest of the AI chain still talks supercycle. Cross-check with Topdown's KOSPI crash piece.", "tweetA": "0.7x book on Korean semis. Last time this level showed up was a cycle bottom. Meanwhile HBM is the scarcest component in the AI stack. One of those two is wrong.", "tweetB": "Korea semis at 0.7x P/B while the US debates AI bubble. If AI is a bubble, 0.7x is fair. If not, it's the cheapest piece of the supply chain.", "charts": {"count": 1, "hot": false, "desc": "GS chart: KOSPI semiconductor FY3 P/B at historical low ~0.7x."}, "link": "https://www.dailychartbook.com/p/this-rotation-has-been-going-on-for-a-while-dw2d"}, {"id": 6, "cat": "regulation", "urgency": "act", "source": "The Pressure Point / Michael McDonough (Fulcrum)", "title": "Data-center curbs won 43 of 44 US ballot measures this week", "idea": "In 44 US state and local ballot measures on data-center development, campaigns favoring curbs won 43. Tech has responded with cash and local concessions and by rebranding data centers as 'compute campuses'. Expect slower approvals and higher costs.", "angle": "A 43/44 result is a political regime change for AI infra, not a rounding error. Power, water, and local approval become the binding constraint.", "tweetA": "43 of 44. Voters just priced the externality of AI compute and the answer was 'no'. Rebranding it 'compute campuses' isn't going to win a zoning hearing.", "tweetB": "Capex guidance assumes sites get approved. 43 of 44 says the marginal approval is now a negotiation with a county board. Who has the balance sheet to pay for that? Not the neoclouds. $ORCL $CRWV", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-every-veto-widens-big-cloud-s/"}, {"id": 7, "cat": "AI/infra", "urgency": "deep", "source": "The Pressure Point / Michael McDonough (Fulcrum)", "title": "Every veto widens Big Cloud's moat — approvals favor incumbents with sites, financing, political reach", "idea": "Fulcrum argues slower approvals raise the price of new compute capacity, protecting companies that already have sites, financing and grid agreements. Hyperscalers can absorb concessions, relocate, lease third-party capacity or buy distressed developers; smaller operators face costlier capital. Counter-case: statewide moratoria without grandfathering would strand the biggest pipelines.", "angle": "Approved sites become scarce assets. Look at who owns powered land and who needs a new interconnect to survive.", "tweetA": "The regulation that kills the small developer is the best thing that happened to the hyperscalers. Approved, powered land just became the scarcest asset in AI.", "tweetB": "Two ways this resolves: grandfathering (incumbents win) or hard statewide bans (everyone with a pipeline loses). I'd want to know which before touching any developer credit.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-every-veto-widens-big-cloud-s/"}, {"id": 8, "cat": "geopolitics", "urgency": "act", "source": "The Pressure Point / Michael McDonough (Fulcrum)", "title": "VP Vance joins indirect talks with Iran for a new ceasefire and nuclear negotiations", "idea": "Per Axios via The Pressure Point, VP Vance has joined indirect talks with Iran seeking a new ceasefire and resumption of nuclear talks.", "angle": "Directly relevant to the $20 Brent weekly drop Rory Johnston documents. Market is pricing a deal; Johnston warns status quo is unsustainable.", "tweetA": "Brent just fell $20 in a week and now the VP is personally in the Iran talks. Market is paying for a deal that hasn't been signed. $XLE", "tweetB": "Vance fronting Iran talks the same week as Stephen Miller takes the chief of staff job. Diplomacy and hawkish internal politics running in parallel isn't a calm signal.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-every-veto-widens-big-cloud-s/"}, {"id": 9, "cat": "geopolitics", "urgency": "act", "source": "The Pressure Point / Michael McDonough (Fulcrum)", "title": "Trump names Stephen Miller chief of staff after Susie Wiles departs", "idea": "Stephen Miller named White House chief of staff after Wiles left, which the newsletter reads as moving the administration's policy agenda further right.", "angle": "Policy risk skew after a midterm loss: immigration/trade hawks gain internal control just as Congress flips.", "tweetA": "Midterm wipeout, then the most hawkish staffer in the building gets the keys. Trade and immigration policy just got a more committed gatekeeper and a more hostile House.", "tweetB": "Immigration policy tightening on the back of this: see H-1B threshold bill and DHS grace-period proposal in Unshackled's roundup. Same direction, same week.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-every-veto-widens-big-cloud-s/"}, {"id": 10, "cat": "geopolitics", "urgency": "act", "source": "The Pressure Point / Michael McDonough (Fulcrum)", "title": "House prepares possible Hegseth impeachment vote as GOP turns on him", "idea": "Republican lawmakers are turning against Defense Secretary Hegseth after the midterms; the House is preparing for a potential impeachment vote next week (NY Post via The Pressure Point).", "angle": "Defense leadership uncertainty during live Iran talks. Defense primes rarely price this.", "tweetA": "An impeachment vote on the Defense Secretary next week, while indirect Iran talks are live. $LMT $RTX are not trading like there's a governance question at the top.", "tweetB": "After a 'midterm bloodbath' GOP members are looking for a scapegoat. That's how personnel risk becomes policy risk for defense budgets.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-every-veto-widens-big-cloud-s/"}, {"id": 11, "cat": "tech", "urgency": "watch", "source": "The Pressure Point / Michael McDonough (Fulcrum)", "title": "Former OpenAI employee accused of spying pleads not guilty after bug found in the lab's office", "idea": "A former OpenAI employee accused of spying pleaded not guilty after authorities discovered a listening bug in the AI lab's office (FT).", "angle": "Frontier labs are now physical espionage targets. Pairs with Cotra's point that both OpenAI and Anthropic suffered security breaches.", "tweetA": "A bug in OpenAI's office. Model weights are the most valuable files on earth and the physical perimeter is an office with a lease.", "tweetB": "Security is the unpriced line item in frontier AI. Espionage in the office, breaches online. The cost of protecting the weights is going to show up in margins.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-every-veto-widens-big-cloud-s/"}, {"id": 12, "cat": "macro", "urgency": "deep", "source": "Topdown Charts / Callum Thomas", "title": "Monetary policy pivoted hard in 2026: tailwind at start of year, headwind into 2027", "idea": "Callum Thomas: global monetary policy swung from macro tailwind in early 2026 to headwind heading into the start of 2027, per his Global Economic Pulse Check chart.", "angle": "Fits with the strong payrolls and hike talk. The easing impulse that supported 2025-26 risk assets has flipped sign.", "tweetA": "Global monetary impulse flipped from tailwind to headwind inside twelve months. Risk assets are being asked to digest it with an AI drawdown on top.", "tweetB": "Everyone is debating whether AI is a bubble. Nobody is isolating how much of the bull market was just liquidity impulse. The sign change is the news.", "charts": {"count": 1, "hot": true, "desc": "Global economic pulse check — monetary policy contribution flipping from tailwind to headwind."}, "link": "https://www.topdowncharts.pro/p/5-charts-to-think-about"}, {"id": 13, "cat": "AI/infra", "urgency": "deep", "source": "Topdown Charts / Callum Thomas", "title": "Semis are a boom-bust sector: every bubble was supported by rising earnings (1980s, late 1990s)", "idea": "The semiconductor bull market is supported by rising earnings, but Thomas points out every boom/bubble/bust cycle in the sector was also supported by rising earnings. Deeply cyclical.", "angle": "The anti-bubble defense ('earnings are real') is not discriminating — it was true in 1999 too.", "tweetA": "'But the earnings are real' is the weakest defense of semis. They were real in 1999 too. The question is the second derivative.", "tweetB": "Rising earnings tell you you're in the cycle, not that you're safe from the bust. Semis have never once traded on a stable multiple of a stable number. $SOXX", "charts": {"count": 1, "hot": true, "desc": "Chart of semis vs earnings across 1980s/1990s/now."}, "link": "https://www.topdowncharts.pro/p/5-charts-to-think-about"}, {"id": 14, "cat": "tech", "urgency": "watch", "source": "Topdown Charts / Callum Thomas", "title": "KOSPI crash — are Korean equities cheap yet? Depends on the metric", "idea": "Thomas revisits the KOSPI crash and whether Korean equities are cheap; the answer varies by valuation metric used.", "angle": "Combine with the GS note that KOSPI semis P/B is ~0.7x. Two different valuation lenses on the same market.", "tweetA": "KOSPI crashed and the answer to 'is it cheap?' depends on which ratio you pick. Semis at 0.7x book says yes. Index-level metrics are less generous.", "tweetB": "Korea is the cleanest listed proxy for HBM and memory. If you want the AI-bust trade or the AI-bottom trade, it's expressed here first.", "charts": {"count": 1, "hot": false, "desc": "KOSPI valuation chart."}, "link": "https://www.topdowncharts.pro/p/5-charts-to-think-about"}, {"id": 15, "cat": "macro", "urgency": "deep", "source": "Topdown Charts / Callum Thomas", "title": "LatAm equities cheap vs history and peers: political risk discount or deep value", "idea": "Latin American equities trade cheap vs their own history and vs peers. Thomas frames it as a (geo)political risk discount or deep value opportunity.", "angle": "EM beneficiaries of a commodity and weaker-AI rotation. Nobody owns it.", "tweetA": "LatAm equities: cheap vs history, cheap vs peers, owned by nobody. In a rotation away from AI, where does the money go that isn't the S&P equal-weight?", "tweetB": "'Political risk discount' is what cheap sounds like when the cause is real. The test is whether the discount compresses when US tech stops absorbing all EM flows.", "charts": {"count": 1, "hot": false, "desc": "LatAm vs history/peers valuation chart."}, "link": "https://www.topdowncharts.pro/p/5-charts-to-think-about"}, {"id": 16, "cat": "gold", "urgency": "deep", "source": "Topdown Charts / Callum Thomas", "title": "Bonds are cheap; gold has lost luster as valuation mean reversion sets in", "idea": "Thomas: bonds, everyone's most hated asset, are cheap. Gold has lost some of its luster as valuation mean reversion sets in — gold vs bonds chart.", "angle": "Contrast with Bubble Bubble's 'secular bull is young' read. Same asset, opposite lens.", "tweetA": "Bonds are the cheapest they've looked in years and the most hated. Gold is mean-reverting from the opposite side. That's a relative-value setup, not an opinion on either.", "tweetB": "Gold -30%, bonds 'cheap', and a Fed that might hike. The long-end is the only asset that gets a bid if the AI wealth effect actually unwinds.", "charts": {"count": 1, "hot": false, "desc": "Gold vs bonds relative valuation chart."}, "link": "https://www.topdowncharts.pro/p/5-charts-to-think-about"}, {"id": 17, "cat": "culture", "urgency": "watch", "source": "This Week in AI", "title": "Non-designer, non-musician builds a TV bumper in an afternoon with Claude, ElevenLabs and Seedance", "idea": "This Week in AI describes making the Off Duty jingle and video: Claude planned the beats, built the animatic and provided 'non-stop, mostly helpful' advice, with ElevenLabs for audio and Seedance for video. The in-house designer was 'not entirely impressed'.", "angle": "Anecdotal adoption datapoint for creative-stack replacement: a broadcast-ready brand asset by a non-expert in an afternoon.", "tweetA": "A non-musician and non-designer shipped a branded jingle and bumper in an afternoon. The pro designer was 'not entirely impressed' which is exactly how the disruption starts.", "tweetB": "Cost of a bumper went from a freelancer week to an afternoon of prompts. Multiply by every small media company.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.thisweekinai.ai/p/the-new-off-duty-bumper-brought-to"}, {"id": 18, "cat": "culture", "urgency": "watch", "source": "BowTiedBull", "title": "Spend on experiences young, time-saving middle-aged, anti-aging by 30s — the 5x rule", "idea": "BowTiedBull: front-load international travel/concerts in your 20s; after that, outsource cleaning, laundry, car washes; use roughly a 5x rule (pay $20 to save an hour if you earn $100 after tax). Also HRT, bloodwork, sauna, even sperm freezing.", "angle": "Consumer-spending taxonomy by life stage: where the services economy captures disposable income as time becomes scarcer than money.", "tweetA": "The frugality crowd has the arithmetic wrong: if you earn $100 after tax an hour, a $20 service that frees it is a 5x. Time is the only non-renewable input.", "tweetB": "Time-saving services are where a rising-income, time-poor cohort puts the next dollar. Longevity spending is the same story at the far end of the age curve.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bowtiedbull.io/p/things-that-are-worth-the-money"}, {"id": 19, "cat": "positioning", "urgency": "act", "source": "The Dark Side of the Boom / Stephen Innes", "title": "Record 11.23M put contracts traded Thursday — Cboe record", "idea": "Thursday's 11.23 million put contracts set a Cboe record, dominated by index protection. Investors had dumped protection into Wednesday's post-election relief rally then scrambled for it 24 hours later.", "angle": "The hedge was sold at the low in vol and bought at the high. Textbook pro-cyclical behavior.", "tweetA": "11.23M puts, a Cboe record, a day after the same crowd sold protection into the relief rally. They're not hedging, they're chasing. $SPX $VIX", "tweetB": "Sold puts Wednesday, bought a record Thursday. Whoever sold gamma into that is long a very ugly weekend. Record put volume is usually capitulation or a scramble — it's rarely the start.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/wall-streets-11-million-put-panic"}, {"id": 20, "cat": "positioning", "urgency": "act", "source": "The Dark Side of the Boom / Stephen Innes", "title": "Goldman Vol Panic Index 9.57/10 — largest two-day reversal in its history", "idea": "Goldman's Vol Panic Index surged to 9.57 out of 10, completing the largest two-day reversal in its history. Historically such extremes have preceded respectable medium-term returns, though the near-term window is less predictable.", "angle": "Medium-term bullish, near-term unreadable. The Fed backdrop is the swing factor.", "tweetA": "A 9.57 out of 10 panic reading after the largest two-day reversal on record. Historically a good entry for the next three months and an awful one for the next three days.", "tweetB": "Extremes in panic indicators are right on 3-month horizons and wrong on 3-day ones. Match your position size to the horizon.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/wall-streets-11-million-put-panic"}, {"id": 21, "cat": "positioning", "urgency": "deep", "source": "The Dark Side of the Boom / Stephen Innes", "title": "HF single-stock activity showed no panic — the selloff ran through index hedges, ETF shorts, systematic flows, and retail", "idea": "Goldman Prime Services found no panic in discretionary hedge fund single-stock activity. AI positions have been steadily reduced, but the latest collapse was driven through index hedges, ETF shorts and systematic flows, with retail finally joining the selling.", "angle": "Different mechanism than single-name liquidation: mechanical flows reverse faster than fundamental ones.", "tweetA": "Discretionary funds weren't the ones panicking. Index hedges, ETF shorts and systematic flows did the damage, and retail is now selling. Mechanical selling ends when the mechanics do.", "tweetB": "Retail 'finally joining the selling' is the tell I'd watch. Retail is the last holder in most drawdowns, and when they've gone the marginal seller is gone.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/wall-streets-11-million-put-panic"}, {"id": 22, "cat": "macro", "urgency": "deep", "source": "The Dark Side of the Boom / Stephen Innes", "title": "1998-style recovery vs 2000-style unwind — but the Fed eased in 1998, and strong payrolls point to a hike", "idea": "Rich Privorotsky prefers a 1998-style recovery over a 2000-style unwind. Innes notes the catch: the Fed eased in 1998, whereas November's stronger payrolls reinforce the prospect of another hike.", "angle": "The 1998 analogy breaks on the reaction function. No Fed rescue is the difference between 1998 and 2000.", "tweetA": "1998 bounce needs a 1998 Fed. The Fed in 1998 cut. This one is staring at 165k payrolls and a possible hike. The analog fails on the one variable that matters.", "tweetB": "Pick your year: 1998 had a cutting Fed and a sharp V. 2000 had a Fed that held and a grinding bear. Payrolls just voted for 2000.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/wall-streets-11-million-put-panic"}, {"id": 23, "cat": "AI/infra", "urgency": "deep", "source": "Chipstrat / Austin Lyons", "title": "AMD Q3: revenue +45% y/y to $13.4B, EPS +74% to $2.09; data center now 64% of revenue vs 47% a year ago", "idea": "AMD's largest and most profitable quarter ever. Data center revenue growth has accelerated sequentially every quarter this year and Lisa Su expects acceleration to continue in Q4 as Helios ramps. Gross margin will move with the AI/server mix.", "angle": "Data center mix up 17 points in a year. AMD is now a data-center company that sells PCs.", "tweetA": "AMD data center went from 47% to 64% of revenue in one year. EPS +74%. A company that's 'tiny vs Nvidia' printed a $13.4B quarter. $AMD", "tweetB": "Chart: DC revenue as share of total shows AMD's portfolio flipping in 12 months. The company the multiple was built on isn't the company that's reporting.", "charts": {"count": 3, "hot": true, "desc": "Line charts of AMD data-center revenue and DC share of net revenue (47% to 64%)."}, "link": "https://newsletter.chipstrat.com/p/amd-q3-fy26-annotated"}, {"id": 24, "cat": "AI/infra", "urgency": "deep", "source": "Chipstrat / Austin Lyons", "title": "AI agents are 'the killer app for CPUs in the cloud': 10M+ people activated Meta Muse agents in 6 weeks", "idea": "Lisa Su: cloud providers added significant EPYC capacity for personal and enterprise agents. More than 10 million people activated Meta's Muse agents in the first 6 weeks; agents run continuously and in parallel, adding to accelerator demand and creating a substantial increase in CPU demand. Lyons: 'AI Agents = More CPUs' was his Jan 2025 thesis; Intel is short server CPU capacity.", "angle": "The CPU leg of the AI trade is the underrated part: agents idle on CPU between GPU calls.", "tweetA": "Agents don't run on GPUs alone. Every agent loop is mostly CPU, orchestration, tools, memory. 10M Muse activations in 6 weeks and Intel can't supply enough server CPU. $AMD $INTC", "tweetB": "Everyone is long GPUs. The agent workload is a CPU workload with a GPU kicker. The shortage nobody modeled is x86 server cores.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://newsletter.chipstrat.com/p/amd-q3-fy26-annotated"}, {"id": 25, "cat": "AI/infra", "urgency": "watch", "source": "Chipstrat / Austin Lyons", "title": "Who hosts the XPUs? OpenAI picked Turin EPYC as host CPU; Google uses Axion, AWS uses Graviton", "idea": "OpenAI selected Turin EPYC as host CPUs for its first custom accelerator platforms, and AMD won head-node deployments with several large model developers. But Google hosts TPUs on Axion and AWS hosts Trainium3 on Graviton — so how many XPU sockets are actually open to AMD?", "angle": "Captive CPU hosts are a hyperscaler moat; non-captive labs like OpenAI are the addressable market.", "tweetA": "OpenAI chose AMD Turin to host its own accelerator. Google and AWS host theirs on their own CPUs. AMD's TAM is only the labs that don't make silicon.", "tweetB": "Custom silicon is also custom CPUs. The vertically integrated hyperscalers close the door on x86 hosts; the labs without chips keep it open. $AMD $GOOGL $AMZN", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://newsletter.chipstrat.com/p/amd-q3-fy26-annotated"}, {"id": 26, "cat": "energy", "urgency": "act", "source": "Commodity Context / Rory Johnston", "title": "Brent -$20/bbl in a week, steepest since April, as no pre-midterm strike came and Democrats swept", "idea": "Prompt Brent fell roughly $20, the largest weekly drop since mid-April: weekend hedges unwound when no strikes came, then the Democratic midterm landslide was read as lowering odds of Iran escalation. Johnston's view: the status quo remains unsustainable.", "angle": "The market priced the Iran war's unpopularity as a risk-premium reduction. The physical market hasn't changed.", "tweetA": "$20 off Brent in a week because a war became politically unpopular. Meanwhile every product category in every region is at or below 5-year seasonal lows. Risk premium is gone; the physical tightness isn't. $XLE $BRENT", "tweetB": "The Iran trade is now an election-result trade. If the House can't constrain the war, the premium comes back in a day.", "charts": {"count": 1, "hot": true, "desc": "Free chart in the email: Brent flat price and weekly change."}, "link": "https://www.commoditycontext.com/p/ocw45w26"}, {"id": 27, "cat": "energy", "urgency": "deep", "source": "Commodity Context / Rory Johnston", "title": "Diesel cracks still ~4x normal in the low $80s in NY Harbor — down $30 from September highs", "idea": "Diesel cracks vs Brent bounce around the low-$80s in NYH, ~4x normal but down ~$30/bbl from September. Drivers: Russian diesel export rebound, a fourth top-up to Chinese independent refinery export quotas, and India ratcheting up middle-distillate exports.", "angle": "Three supply responses are all non-OPEC, non-US: Russia, China, India. Diesel relief is coming from the countries least aligned with the West.", "tweetA": "Diesel cracks at ~4x normal. The relief valve is Russia, Chinese teapots and India. The refined-product market is being balanced by the exact exporters sanctions were meant to constrain. $VLO $MPC", "tweetB": "Fourth quota top-up for Chinese independents. That's Beijing deciding how much of the diesel shortage it wants to fix. Market-clearing by policy.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.commoditycontext.com/p/ocw45w26"}, {"id": 28, "cat": "energy", "urgency": "deep", "source": "Commodity Context / Rory Johnston", "title": "Largest spec selling since June: managed money -78M bbl; Brent CFD front curve in contango", "idea": "Hedge funds cut net length by 78 million barrels in a week, the largest speculative selling week since mid-June. Net spec positions are at the bottom of a 3-month range with room below July's low. Backwardation remains but the front weeks of the Brent CFD curve are in contango — the most worrying downside signal. Inventories: large US draw to fresh seasonal lows, small Singapore draw, moderate ARA build from exceptionally low levels.", "angle": "Paper is selling while physical is at 5-year lows. Divergence usually resolves in the physical's favor — unless CFD contango means demand is actually softening.", "tweetA": "Funds sold 78M barrels in a week. Inventories at 5-year seasonal lows everywhere. The only thing that doesn't fit is front Brent CFDs in contango. That's the one to watch.", "tweetB": "Spec selling with short interest still modest means the move isn't a short squeeze setup yet. There's more room down if CFD contango spreads to the futures curve.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.commoditycontext.com/p/ocw45w26"}, {"id": 29, "cat": "credit", "urgency": "deep", "source": "Bespoke Investment Group", "title": "Mega-cap CDS index +1.7% while the ten mega-caps fell 5% on the week", "idea": "Bespoke's new index tracking CDS on ten mega-caps rose only ~1.7% in a week where the stocks fell 5%. TSLA, SpaceX (SPCX), ORCL, AVGO and AMZN saw CDS rise; META, MSFT, AAPL, NVDA and GOOGL saw default risk dip. NVDA fell 11.3% on the week even as its CDS fell.", "angle": "Credit isn't confirming the equity move. The mega-cap CDS market is pricing a valuation problem, not a solvency problem.", "tweetA": "Ten mega-caps -5% on the week; their CDS index +1.7%. NVDA -11.3% with CDS tighter. Credit says it's a multiple problem, not a balance-sheet problem. $NVDA $ORCL", "tweetB": "The names whose default risk rose are the levered ones: ORCL, AVGO, TSLA, AMZN, SpaceX. The AI debt cycle sorts by leverage first. Watch ORCL.", "charts": {"count": 1, "hot": false, "desc": "Chart of mega-cap CDS index vs equities; per-name CDS change bars."}, "link": "https://bespokeinvest.substack.com/p/mega-cap-default-risk-update"}, {"id": 30, "cat": "gold", "urgency": "deep", "source": "The Bubble Bubble Report", "title": "Gold -30% and silver -60% from January peaks mostly erased 3 months of parabolic gains", "idea": "Bubble Bubble: gold's 30% fall and silver's 60% plunge from January peaks only erase the November 2025–January 2026 parabolic run (gold ~$4,500 to $5,600; silver ~$80 to $121). Volume profile shows heavy accumulation at $1,100–$2,100 for gold and $11–$35 for silver, so average cost bases are far below spot. Anchored VWAP is used to estimate the average buyer's P&L.", "angle": "Positioning-by-cost-basis argument: only recent FOMO buyers are underwater. That is exactly the marginal-seller list.", "tweetA": "Gold average cost basis is far below spot; silver's is even lower. The people underwater are the ones who bought $4,500–$5,600 gold and $80–$121 silver. They're also the next sellers. $GLD $SLV", "tweetB": "Volume profile says the support is thin between $2,100 and $4,500 for gold. A thin-volume zone is air. 'Secular bull is young' and 'no support below here' can both be true.", "charts": {"count": 2, "hot": true, "desc": "Volume profile + anchored VWAP charts for gold and silver, showing thin volume above $4,500."}, "link": "https://thebubblebubble.substack.com/p/a-better-way-to-view-the-precious-132"}, {"id": 31, "cat": "AI/infra", "urgency": "act", "source": "Planned Obsolescence / Ajeya Cotra", "title": "METR report: Anthropic capabilities progress ~2x faster in Oct 2025–Oct 2026; 'dramatic acceleration' RSP threshold likely already crossed", "idea": "Anthropic's S-1 says it 'may imminently meet' the RSP threshold of dramatically accelerated progress due to AI. A METR deep-access report found capabilities progress (internal AECI, an Epoch Capabilities Index variant) ran about twice as fast over the last year as the preceding twelve months, with AI automation probably the large majority of the cause. Much supporting evidence is redacted. Cotra calls it the most important AI-risk update in years.", "angle": "An S-1 risk factor and an independent evaluator say the same thing. That is public-market disclosure of recursive improvement.", "tweetA": "Anthropic's own S-1 says it 'may imminently meet' the threshold for AI-accelerated AI progress, and METR says it's already ~2x. This is a securities filing, not a Twitter thread.", "tweetB": "Two years ago this was a LessWrong post. Now it's a risk factor in an IPO document with an independent auditor attached. How do you price that?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.planned-obsolescence.org/p/ai-is-dramatically-accelerating-ai"}, {"id": 32, "cat": "AI/infra", "urgency": "deep", "source": "Planned Obsolescence / Ajeya Cotra", "title": "If AI doubles progress, researchers must be sped up ~4-9x, now maybe ~10x — matches Anthropic staff's ~12x self-reported uplift", "idea": "Cotra's math: compute multipliers must grow ~2-3x faster; with a Cobb-Douglas labor/compute model, labor uplift must be roughly the square, ~4-9x; diminishing returns push today's requirement to ~10x. Anthropic staff self-report ~12x uplift from internal models. If acceleration is smooth, doubling times of 12 months, 6, 3, 6 weeks sum to a singularity within about a year (before hitting software efficiency ceilings).", "angle": "A check on internal consistency: the model's required uplift matches the self-reported uplift.", "tweetA": "Needed researcher uplift to double progress: ~4-9x. Anthropic staff self-report ~12x. The independent math and the anecdotes land in the same place, which is the unsettling part.", "tweetB": "A 10x uplift isn't ten researchers, it's one researcher in a time bubble where ten days pass per day. Hiring can't buy that, at any salary.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.planned-obsolescence.org/p/ai-is-dramatically-accelerating-ai"}, {"id": 33, "cat": "AI/infra", "urgency": "deep", "source": "Planned Obsolescence / Ajeya Cotra", "title": "Industry security 'nowhere near' the bar: OpenAI and Anthropic both had major breaches by amateur groups recently", "idea": "Cotra argues strong weight and algorithmic-secret security is a minimum prerequisite for an intelligence explosion; the old RSP required protection against state-level weight theft at AI R&D-5. She notes both OpenAI and Anthropic recently suffered major breaches by amateur groups, and lists needed measures (universal logging, monitorability measurements, anti-collusion, interpretability, governance for pacing).", "angle": "Security spend becomes a regulatory and competitive cost center. Connects to the OpenAI office bug story.", "tweetA": "Cotra's point: if you're about to have a 10x-uplift feedback loop, the bar is state-level security. Both leading labs just got breached by amateurs.", "tweetB": "The gap between the capability threshold and the security threshold is the real risk factor in the AI S-1s. One is on the calendar; the other isn't.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.planned-obsolescence.org/p/ai-is-dramatically-accelerating-ai"}, {"id": 34, "cat": "venture", "urgency": "deep", "source": "Unshackled Ventures", "title": "Fal raises $1.3B at $16B — valuation doubled from $8B in April; Bessemer leads, Nvidia in", "idea": "Fal, an AI inference platform for image, video and audio models, raised $1.3B led by Bessemer with Nvidia, Sound Ventures and T. Rowe Price. Valuation doubled to $16B from $8B in April. Founders are Turkish immigrants who bet early on video and image generation.", "angle": "Inference-layer winners are getting repriced in six months while the public AI tape sells off.", "tweetA": "Fal doubled its valuation in six months to $16B while public AI stocks fell. Private marks and public tapes are running opposite directions. $NVDA is in the round.", "tweetB": "The inference layer for media models just got a $1.3B check and Nvidia is on the cap table. They're buying demand for their own chips.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unshackledvc.substack.com/p/last-week-in-immigration-venture-386"}, {"id": 35, "cat": "venture", "urgency": "deep", "source": "Unshackled Ventures", "title": "CesiumAstro $730M Series D at $4.5B+; plans a 737-satellite constellation", "idea": "CesiumAstro, which builds communications systems and satellites for space and defense customers, raised a $730M Series D led by Janus Henderson (Insight, Sands, Sumitomo, Toyota's Woven Capital also in). It plans a 737-satellite constellation, Synchronicity. CEO Shey Sabripour moved to the US alone at 16 and spent 24 years at Lockheed.", "angle": "Crossover funds leading space/defense Series D rounds — growth-stage capital is rotating to defense hardware.", "tweetA": "Janus Henderson leading a $730M space-comms round. Crossover capital isn't tourist money. 737 satellites from a 24-year Lockheed veteran is a defense-prime-adjacent bet.", "tweetB": "Space/defense Series D with Toyota's Woven Capital in the stack. Dual-use hardware is where private capital is crowding.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unshackledvc.substack.com/p/last-week-in-immigration-venture-386"}, {"id": 36, "cat": "venture", "urgency": "watch", "source": "Unshackled Ventures", "title": "Traversal: $120M Series B at $1B for AI agents that diagnose production software failures", "idea": "Traversal raised a $120M Series B co-led by Kleiner, Redpoint and Khosla (Sequoia and Battery in), at a $1B valuation, for AI agents that diagnose why production software breaks. Founders left tenure-track posts at Columbia and Cornell Tech.", "angle": "AI SRE/observability agents are a funded category; direct pressure on incumbents like Datadog.", "tweetA": "A $1B valuation for an agent that explains why your software broke. On-call is the first job category where the agent is plainly better than a tired human at 3am. $DDOG", "tweetB": "Two academics left tenure tracks and got a $1B valuation in a couple of years. Academia's brain drain to AI startups hasn't slowed.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unshackledvc.substack.com/p/last-week-in-immigration-venture-386"}, {"id": 37, "cat": "regulation", "urgency": "deep", "source": "Unshackled Ventures", "title": "Bill would raise the H-1B-dependent wage threshold from $60k (fixed since 1998) to ~$145k", "idea": "S. 5638 (Husted) and H.R. 10799 (Grothman) would tie the 'H-1B-dependent' employer wage threshold to the national average wage index, currently ~$145,000, instead of the fixed $60,000 set in 1998. The test runs on headcount ratios, so lean startups can trip it. No vote scheduled.", "angle": "A ratchet in the cost of hiring foreign engineers; startups hit harder than big outsourcers.", "tweetA": "The H-1B wage line has been $60k since 1998. This bill moves it to ~$145k. Early-stage startups with three foreign engineers get classed the same as an outsourcing firm.", "tweetB": "Pair with the Miller appointment. Immigration friction raising the cost of talent while AI labs are in a 10x-uplift race for researchers.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unshackledvc.substack.com/p/last-week-in-immigration-venture-386"}, {"id": 38, "cat": "labor", "urgency": "deep", "source": "Unshackled Ventures", "title": "DHS proposes ending the 60-day grace period after layoffs for H-1B, O-1, L-1, E and TN workers — comments close Nov 10", "idea": "DHS proposes eliminating the up-to-60-day grace period that lets visa holders and families find a new sponsor, change status or leave after a job ends. Comment window closes November 10.", "angle": "Layoffs become immediate status loss. Raises the cost of any workforce change for tech companies with visa-heavy staff.", "tweetA": "No 60-day grace period after a layoff means a pink slip is also an immigration event on day one. Tech layoffs just got a lot more expensive, or a lot more brutal for the people they hit.", "tweetB": "The people most affected are exactly the ones in AI roles. Comments close Nov 10: watch whether the final rule survives the new House.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unshackledvc.substack.com/p/last-week-in-immigration-venture-386"}, {"id": 39, "cat": "venture", "urgency": "deep", "source": "Unshackled Ventures", "title": "455 of America's 775 billion-dollar startups have at least one immigrant founder", "idea": "By one recent count, 455 of 775 US unicorns (about 59%) have at least one immigrant founder, set against policy proposals that tighten the visa pipeline.", "angle": "The policy risk to the venture pipeline is concentrated in the segment generating the majority of unicorn value.", "tweetA": "455 of 775 unicorns have an immigrant founder. That's 59%. Any visa policy is also a venture policy.", "tweetB": "If 59% of unicorns need immigrants and the pipeline gets stricter, the arbitrage is Toronto, London, and Dubai, not Palo Alto.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unshackledvc.substack.com/p/last-week-in-immigration-venture-386"}, {"id": 40, "cat": "venture", "urgency": "watch", "source": "TWiST Newsletter", "title": "Looker's hands-on free trial closed ~75% with near-zero churn — economics hinge on ~$25k ACV", "idea": "Looker closed about 75% of its hands-on trials with almost no churn. The CEO said it needed roughly $25,000 a year per customer to justify embedded technical people in sales and all engineers in support chats; the co-founder ran support calls himself. 'Support is a retention strategy, not a cost center.' Whether to scale this depends on deal size.", "angle": "Implication for AI products: the high-touch onboarding economics work only above a certain ACV. Forward-deployed engineering is the 2026 version.", "tweetA": "Looker: 75% trial close, almost no churn, at ~$25k ACV with engineers embedded in sales. That's the original forward-deployed-engineer model.", "tweetB": "Palantir-style forward deployment works when ACV pays for it. AI vendors with $20/month seats copying it will lose money. Deal size sets the playbook.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/before-you-scale-that-hands-on-trial"}];

var fc='all',fu='all',fs=null;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function card(item,open){
  var c=COL[item.cat]||'#888';
  var h='<div class="card'+(open?' open':'')+'" id="c'+item.id+'"><div class="hd" onclick="toggle('+item.id+')">';

  if(item.charts.count>0)h+='<span>'+(item.charts.hot?'🔥':'📊')+'</span>';
  h+='<span class="ttl">'+esc(item.title)+'</span></div><div class="bd">';
  h+='<div class="lbl">The Idea</div><div>'+esc(item.idea)+'</div>';
  h+='<div class="lbl">My Angle</div><div class="ang" style="border-color:'+c+';background:'+c+'14">'+esc(item.angle)+'</div>';
  h+='<div class="tw"><div><div class="lbl" style="color:#378add">Tweet A</div>'+esc(item.tweetA)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  h+='<div><div class="lbl" style="color:#7f77dd">Tweet B</div>'+esc(item.tweetB)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>';
  if(item.charts.count>0)h+='<div class="ch'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING — ':'📊 ')+item.charts.count+' chart(s): '+esc(item.charts.desc)+'</div>';
  else h+='<div class="ch">No charts in email — article may have some, worth opening</div>';
  h+='<p><a href="'+item.link+'" target="_blank">↗ Read full article</a></p></div></div>';
  return h;
}
function render(openAll){
  var cats={},urg={act:0,deep:0,watch:0};
  ITEMS.forEach(function(i){cats[i.cat]=(cats[i.cat]||0)+1;urg[i.urgency]++;});
  var h='<span class="pill'+(fc==='all'?' on':'')+'" style="'+(fc==='all'?'background:#222':'')+'" onclick="setC(\'all\')">All '+ITEMS.length+'</span>';
  Object.keys(cats).forEach(function(k){var on=fc===k;h+='<span class="pill'+(on?' on':'')+'" style="'+(on?'background:'+COL[k]:'')+'" onclick="setC(\''+k+'\')">'+k+' '+cats[k]+'</span>';});
  document.getElementById('cats').innerHTML=h;
  var u='<span class="pill'+(fu==='all'?' on':'')+'" style="'+(fu==='all'?'background:#222':'')+'" onclick="setU(\'all\')">All</span>';
  [['act','🔴 Act Now'],['deep','🔵 Deep'],['watch','🟡 Watch']].forEach(function(p){var on=fu===p[0];u+='<span class="pill'+(on?' on':'')+'" style="'+(on?'background:#222':'')+'" onclick="setU(\''+p[0]+'\')">'+p[1]+' '+urg[p[0]]+'</span>';});
  document.getElementById('urg').innerHTML=u;
  var out='';
  ITEMS.forEach(function(i){
    if(fc!=='all'&&i.cat!==fc)return;if(fu!=='all'&&i.urgency!==fu)return;
    if(fs!==null&&i.source.indexOf(fs)===-1)return;
    out+=card(i,fs!==null);
  });
  document.getElementById('list').innerHTML=out;
}

  META.includedSources.forEach(function(s,idx){r+='<li><span class="sl" data-i="'+idx+'">'+esc(s.name)+'</span> — '+s.items+'</li>';});
  r+='</ul><p><b>Skipped:</b></p><ul>';
  META.skippedSources.forEach(function(s){r+='<li>'+esc(s.name)+' — '+esc(s.reason)+'</li>';});
  r+='</ul>';
  document.getElementById('repb').innerHTML=r;
  document.querySelectorAll('.sl').forEach(function(e){e.onclick=function(){filterBySrc(META.includedSources[+e.getAttribute('data-i')].name);window.scrollTo(0,0);};});
  render();
}
init();
</script></body></html>
