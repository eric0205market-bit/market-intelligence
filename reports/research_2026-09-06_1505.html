const CAT_COLORS = {
  macro:"#e24b4a", credit:"#378add", positioning:"#ef9f27", "AI/infra":"#1d9e75",
  crypto:"#7f77dd", geopolitics:"#d85a30", energy:"#f97316", tech:"#06b6d4",
  gold:"#d4a017", culture:"#ec4899", labor:"#8b5cf6", regulation:"#64748b",
  science:"#14b8a6", venture:"#84cc16"
};
const URG_META = {
  act:{emoji:"🔴", label:"Act Now"},
  deep:{emoji:"🔵", label:"Deep"},
  watch:{emoji:"🟡", label:"Watch"}
};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function esc(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function toggleCard(id) {
  var body = document.getElementById('body-' + id);
  body.hidden = !body.hidden;
}

function setCat(cat){
  activeCat = cat;
  activeSrc = null;
  render();
}
function setUrg(urg){
  activeUrg = urg;
  activeSrc = null;
  render();
}
function filterBySrc(name){
  activeSrc = name;
  activeCat = "all";
  activeUrg = "all";
  render(true);
}

function buildFilterBars(){
  var cats = {};
  ITEMS.forEach(function(i){ cats[i.cat] = (cats[i.cat]||0) + 1; });
  var catBar = document.getElementById('catBar');
  var html = '<button class="pill" data-kind="cat" data-val="all">All <span class="count">(' + ITEMS.length + ')</span></button>';
  Object.keys(cats).forEach(function(c){
    html += '<button class="pill" data-kind="cat" data-val="' + esc(c) + '">' + esc(c) + ' <span class="count">(' + cats[c] + ')</span></button>';
  });
  catBar.innerHTML = html;

  var urgs = {act:0, deep:0, watch:0};
  ITEMS.forEach(function(i){ urgs[i.urgency] = (urgs[i.urgency]||0) + 1; });
  var urgBar = document.getElementById('urgBar');
  var uHtml = '<button class="pill" data-kind="urg" data-val="all">All <span class="count">(' + ITEMS.length + ')</span></button>';
  ['act','deep','watch'].forEach(function(u){
    uHtml += '<button class="pill" data-kind="urg" data-val="' + u + '">' + URG_META[u].emoji + ' ' + URG_META[u].label + ' <span class="count">(' + (urgs[u]||0) + ')</span></button>';
  });
  urgBar.innerHTML = uHtml;

  catBar.querySelectorAll('.pill').forEach(function(btn){
    btn.addEventListener('click', function(){ setCat(btn.getAttribute('data-val')); });
  });
  urgBar.querySelectorAll('.pill').forEach(function(btn){
    btn.addEventListener('click', function(){ setUrg(btn.getAttribute('data-val')); });
  });
}

function updateFilterActiveStates(){
  document.querySelectorAll('#catBar .pill').forEach(function(btn){
    var val = btn.getAttribute('data-val');
    var isActive = (val === activeCat) || (val === 'all' && activeCat === 'all');
    btn.classList.toggle('active', isActive);
    btn.style.background = isActive && val !== 'all' ? CAT_COLORS[val] : (isActive ? '#1a1a1a' : '');
    btn.style.borderColor = isActive && val !== 'all' ? CAT_COLORS[val] : '';
  });
  document.querySelectorAll('#urgBar .pill').forEach(function(btn){
    var val = btn.getAttribute('data-val');
    var isActive = (val === activeUrg);
    btn.classList.toggle('active', isActive);
    btn.style.background = isActive ? '#1a1a1a' : '';
  });
}

function cardHTML(item, expanded){
  var color = CAT_COLORS[item.cat] || '#888';
  var urg = URG_META[item.urgency];
  var chartMark = item.charts.count > 0 ? (item.charts.hot ? '🔥' : '📊') : '';
  var body = '';
  body += '<div class="label">The Idea</div><div class="idea">' + esc(item.idea) + '</div>';
  body += '<div class="label">My Angle</div><div class="angle">' + esc(item.angle) + '</div>';
  body += '<div class="label">Tweets</div>';
  body += '<div class="tweets">';
  body += '<div class="tweet"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + esc(item.tweetA) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  body += '<div class="tweet"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + esc(item.tweetB) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
  body += '</div>';
  if(item.charts.count > 0 || item.charts.desc){
    body += '<div class="charts-box' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.count > 0 ? item.charts.count + ' chart(s). ' : '') + esc(item.charts.desc) + '</div>';
  }
  body += '<div class="link-row"><a href="' + item.link + '" target="_blank" rel="noopener">↗ Read full article</a></div>';

  return '' +
    '<div class="card" data-id="' + item.id + '">' +
      '<div class="card-header" onclick="toggleCard(' + item.id + ')">' +
        '<span class="idx">' + String(item.id).padStart(2,'0') + '</span>' +
        '<span class="urg">' + urg.emoji + '</span>' +
        '<span class="badge" style="background:' + color + '">' + esc(item.source.split(' / ')[0].split(' — ')[0].split(' (')[0]) + '</span>' +
        '<span class="cattag">' + esc(item.cat) + '</span>' +
        (chartMark ? '<span class="chartmark">' + chartMark + '</span>' : '') +
        '<span class="title">' + esc(item.title) + '</span>' +
      '</div>' +
      '<div class="card-body" id="body-' + item.id + '" hidden>' + body + '</div>' +
    '</div>';
}

function render(forceExpandSrc){
  updateFilterActiveStates();
  var list = ITEMS.filter(function(i){
    if(activeSrc){ return i.source.indexOf(activeSrc) !== -1; }
    var catOk = activeCat === 'all' || i.cat === activeCat;
    var urgOk = activeUrg === 'all' || i.urgency === activeUrg;
    return catOk && urgOk;
  });
  var container = document.getElementById('cards');
  var emptyMsg = document.getElementById('emptyMsg');
  if(list.length === 0){
    container.innerHTML = '';
    emptyMsg.hidden = false;
    return;
  }
  emptyMsg.hidden = true;
  container.innerHTML = list.map(function(i){ return cardHTML(i); }).join('');
  if(forceExpandSrc){
    list.forEach(function(i){
      var b = document.getElementById('body-' + i.id);
      if(b) b.hidden = false;
    });
  }
}

function buildReport(){
  var html = '';
  html += '<p><strong>Time window:</strong> ' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</p>';
  html += '<p><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp;|&nbsp; <strong>Emails read:</strong> ' + META.emailsRead + ' &nbsp;|&nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</p>';
  html += '<h4>Included Sources</h4>';
  META.includedSources.forEach(function(s){
    html += '<div class="srcrow" onclick="filterBySrc(\'' + s.name.replace(/'/g, "\\'") + '\')">' + esc(s.name) + ' — ' + s.count + ' item' + (s.count === 1 ? '' : 's') + '</div>';
  });
  html += '<h4>Skipped Sources</h4>';
  META.skippedSources.forEach(function(s){
    html += '<div class="skiprow">' + esc(s.name) + ' — ' + esc(s.reason) + '</div>';
  });
  html += '<h4>Totals</h4>';
  html += '<p>' + META.emailsInWindow + ' emails in window, ' + META.emailsRead + ' read in full, ' + META.itemsExtracted + ' items extracted across ' + META.includedSources.length + ' sources, 1 source skipped.</p>';
  document.getElementById('reportBody').innerHTML = html;
}

document.getElementById('metaLine').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails';
document.getElementById('reportToggle').addEventListener('click', function(){
  var body = document.getElementById('reportBody');
  body.hidden = !body.hidden;
});

buildFilterBars();
buildReport();
render();
</script>
