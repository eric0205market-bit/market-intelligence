<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-08-24T17:20:58Z", "input_stats": {"total_tweets": 212, "unique_authors": 75, "tweets_with_images": 42, "after_noise_filter": 118}, "summary": "**Iran — \"Economic D-Day\":** Bessent launched Operation Economic Outcast, sanctioning 60+ entities across five sectors (digital assets, tech, gold, aviation, shipping) and warning any nation that \"helps Iran\" gets removed from the USD system. **zriboua** posted the full Treasury transcript; options markets barely blinked (**spotgamma**: only 33bps of 0DTE SPX pricing).\n\n**Treasury/TGA mechanics dominate macro chatter:** **dampedspring** ran a multi-tweet TGA explainer and pushed back on \"irresponsible\" drawdown headlines; **fejau_inc** and **AndreasSteno** flagged the bills→TGA→bond-buyback loop as real liquidity; **elerianm** is the loudest contrarian, warning Treasury price-setting in bond markets is an unhealthy precedent.\n\n**Bitcoin:** **DTAPCAP** called a rare simultaneous break of the 50/100/200-day MAs with the market \"caught short badly\" — greatest pain is a squeeze to 100k. **Matt_Hougan** and **DefiIgnas** back the bottom-is-in thesis; **alpha_pls** notes Strategy bought zero BTC last week yet BTC still had one of its biggest weekly candles since the 2024 election.\n\n**Trade war:** Trump slapped 50% tariffs on Canadian autos/steel starting Jan 2027 (**Geiger_Capital**), drawing confusion from **aleabitoreddit** about why the fight isn't focused on Iran.\n\n**AI/data centers:** **nic_carter** argues the anti-data-center backlash is pure NIMBYism, not substance; **theallinpod** relays David Sacks' detailed prediction of a regulatory-capture path to functionally ban open-source AI.\n\n**Notable:** **ZeeContrarian1** makes a detailed activist-driven turnaround case for $SNAP; **zachxbt** unmasked a French crypto-robbery launderer with a $93K USDT freeze.", "sections": {"A_events": [{"cluster": "Iran — Treasury Launches \"Operation Economic Outcast\"", "category": ["geopolitics", "macro"], "items": [{"author": "zriboua", "summary": "Posted extended excerpts of Bessent's Treasury remarks: the U.S. is launching \"Operation Economic Outcast\" with a \"zero-leakage approach\" — new sectoral sanctions across digital assets, technology, gold, aviation and shipping, plus 60+ entities/individuals/vessels sanctioned by OFAC. Bessent: nations that keep dealing with Iran face isolation from the U.S. dollar system; every branch of Bank Melli must be shuttered. Trump is personally calling world leaders demanding they cut ties with Tehran.", "tweet_url": "https://x.com/zriboua/status/2091938492871794932", "images": [], "type": "thread"}, {"author": "zriboua", "summary": "Follow-up quote from Bessent: \"No nation should expect to enjoy the rewards of our system while helping those who seek to destroy it... The campaign we begin today will gather force with every day that follows.\" Also separately flagged Iran's central bank denying hyperinflation while a Tehran economist says it has already arrived — \"the shelves tell the same story,\" linking an Iran International report.", "tweet_url": "https://x.com/zriboua/status/2091936873627193786", "images": [], "type": "tweet"}, {"author": "Geiger_Capital", "summary": "Headlined the sanctions blast (\"countries who stick with Iran will be isolated\"; money launderers for Iran removed from USD system) and asked, half-jokingly: \"So… buy more Gold and Bitcoin?\"", "tweet_url": "https://x.com/Geiger_Capital/status/2091937948862132329", "images": ["https://pbs.twimg.com/media/HQgOE_TXIAA-M5K.jpg"], "type": "tweet"}, {"author": "AviFelman", "summary": "Responding to the Bessent USD-system threat, argues the administration is facing \"a crisis of legitimacy\" from losing control of both the war and the markets — calls the Iran war and Treasury interventions \"extremely high risk, moderate reward,\" with Bessent positioned as a potential \"sacrificial lamb.\"", "tweet_url": "https://x.com/AviFelman/status/2091938097277616315", "images": [], "type": "tweet"}, {"author": "spotgamma", "summary": "Notes options markets are barely reacting to \"Iran's Economic D-Day\" — SPX 0DTE pricing only 33bps ($25.5) of movement despite the escalation.", "tweet_url": "https://x.com/spotgamma/status/2091876561163067674", "images": [], "type": "tweet"}, {"author": "aleabitoreddit", "summary": "Questioned why the U.S. is opening a trade fight with Canada the same day as the Iran D-Day announcement, speculating the tariff timing may be politically motivated (midterms).", "tweet_url": "https://x.com/aleabitoreddit/status/2091889047325335611", "images": ["https://pbs.twimg.com/media/HQfhzv5b0AAS8zr.jpg", "https://pbs.twimg.com/media/HQfij8BasAAzKon.jpg"], "type": "thread"}, {"author": "JavierBlas", "summary": "Quote-highlighted analysis on the key open question: what happens if Iran concludes its leverage over the Strait of Hormuz is being eroded by U.S. pressure.", "tweet_url": "https://x.com/JavierBlas/status/2091911998367805784", "images": [], "type": "tweet"}]}, {"cluster": "Treasury/Bessent — TGA Drawdown, Bond Buybacks & Yield-Curve Debate", "category": ["macro"], "items": [{"author": "dampedspring", "summary": "Ran a full \"TGA 101\" thread (what the TGA is, why flows between the private sector and Treasury move its level, why Treasury targets a specific level and sometimes misses it, whether debt issuance composition matters, and whether a permanent lower target would move markets) — framed as re-explaining fundamentals he says the market keeps getting wrong. Separately pushed back hard on a CNBC (Liesman) headline implying the TGA is being drawn down, calling it \"irresponsible and stupid\" since the article body doesn't support it, and noted \"the Twitter wave of charlatans and the algos for gold and crypto love this shit.\" Also explained the TGA is large because Treasury funds debt via bills rather than long coupons — shifting toward more coupons and fewer bills would mechanically shrink the TGA's formulaic target.", "tweet_url": "https://x.com/dampedspring/status/2091936240215957668", "images": [], "type": "thread"}, {"author": "fejau_inc", "summary": "Laid out the mechanical loop plainly: Treasury issues bills to fund the TGA, sells down the TGA to buy back bonds, which means issuing even more bills to rebuild the TGA, in a self-reinforcing cycle. Also quote-tweeted a \"scoop\" that Bessent will do \"whatever it takes\" to push the 10-year yield toward 5% by shorting the long end against bond vigilantes — reacted simply: \"Bitcoin / Gold.\"", "tweet_url": "https://x.com/fejau_inc/status/2091907594759856608", "images": [], "type": "tweet"}, {"author": "AndreasSteno", "summary": "Argues using the TGA to fund bond buybacks is a genuine liquidity addition from Bessent — \"turned from a nothing burger to something potentially relevant\" — tying it to the broader pattern of cheap, plentiful leverage being engineered for the Treasury market's marginal (leveraged) buyer base.", "tweet_url": "https://x.com/AndreasSteno/status/2091927958613074087", "images": ["https://pbs.twimg.com/media/HQgFPWYW4AAHSF3.jpg"], "type": "tweet"}, {"author": "alpha_pls", "summary": "\"1 trillion in bond buybacks and you're bearish?\" — reacting to reporting that Bessent could tap near $1T from the TGA to fund buybacks.", "tweet_url": "https://x.com/alpha_pls/status/2091852614304477463", "images": ["https://pbs.twimg.com/media/HQfA3ayWYAADKtp.jpg"], "type": "tweet"}, {"author": "Geiger_Capital", "summary": "\"It's not yield curve control… they're just intervening and taking explicit actions to control the yield curve\" — sarcastic framing of the buyback/TGA actions as de facto YCC, concluding \"you don't own enough hard assets.\"", "tweet_url": "https://x.com/Geiger_Capital/status/2091877923074474421", "images": ["https://pbs.twimg.com/media/HQfX4qMWYAEbSyV.jpg"], "type": "tweet"}, {"author": "elerianm", "summary": "Contrarian pushback on the Treasury's growing role in bond-market price determination: (1) intervention track records are shaky once you move beyond addressing genuine market malfunction, which isn't the case today; (2) it's \"usually not healthy\" when markets consistently dictate extraordinary official interventions rather than the reverse — flags this as a real risk. Discussed the same theme on CNBC's Squawk Box.", "tweet_url": "https://x.com/elerianm/status/2091876866286145987", "images": ["https://pbs.twimg.com/media/HQfW7EdXcAA_-H-.jpg"], "type": "tweet"}, {"author": "rektmando", "summary": "Daily digest flagged supporting context: the Fed now owns 50%+ of 10-15yr Treasuries, only 3% of the S&P 500 out-yields Treasuries, and odds of a rate cut before 2027 have fallen below 13%.", "tweet_url": "https://x.com/rektmando/status/2091875156511875507", "images": ["https://pbs.twimg.com/media/HQfUo0Aa4AAHMzg.jpg"], "type": "tweet"}]}, {"cluster": "Bitcoin Breaks Out — \"The Big Low Is In\"", "category": ["crypto"], "items": [{"author": "DTAPCAP", "summary": "Key technical call: \"extremely momentous\" breakout, with a rare simultaneous break of the 50/100/200-day moving averages in a few days. Market is \"caught short badly.\" Says it's pointless to call day-to-day but \"big low is in\" — the hardest trade is buying here if not already long, since the path of greatest pain is an immediate squeeze back toward 100k.", "tweet_url": "https://x.com/DTAPCAP/status/2091891414988664965", "images": ["https://pbs.twimg.com/media/HQfkJ0qWUAAbH0Z.jpg"], "type": "tweet"}, {"author": "Matt_Hougan", "summary": "Says what makes this rally interesting is that most buyers are playing the multi-year cycle, not a 3-day trade. Separately cites Alex Thorn's data point that Bitcoin reclaiming its 50-week moving average has marked the bottom 11 of the last 13 times, and argues \"history doesn't repeat, but it rhymes\" with the bottom being in.", "tweet_url": "https://x.com/Matt_Hougan/status/2091904210371518648", "images": [], "type": "tweet"}, {"author": "DefiIgnas", "summary": "Bitcoin-to-Nasdaq correlation has sharply dropped to its lowest since 2018 and turned negative, as BTC pumps while the Nasdaq (concentrated AI trade) sells off — argues this strengthens BTC's \"digital gold\" narrative for allocators seeking uncorrelated assets, and could help BTC outperform further if the AI trade deflates.", "tweet_url": "https://x.com/DefiIgnas/status/2091892667609432353", "images": ["https://pbs.twimg.com/media/HQflS46a0AAQ9KF.jpg"], "type": "thread"}, {"author": "alpha_pls", "summary": "Flags a narrative violation: Strategy (Saylor) bought zero BTC over the past week and instead increased its USD reserve by $1.9B, yet BTC still posted one of its biggest weekly candles since the 2024 election week — undercutting the \"no Saylor bid, no rally\" thesis.", "tweet_url": "https://x.com/alpha_pls/status/2091880756725354653", "images": [], "type": "tweet"}, {"author": "cointradernik", "summary": "Trading-desk color on the move: calls the spot bid \"relentless,\" wants to see a weekly close above 83k then a test of the 89k yearly open before late longs pile in for a potential liquidation event.", "tweet_url": "https://x.com/cointradernik/status/2091884297233826033", "images": [], "type": "tweet"}, {"author": "rektmando", "summary": "Daily digest: BTC 77,350 (+2%), best week since March 2023; BTC ETFs +$308M, ETH ETFs +$184M; Fear & Greed at 74; BTC $82,470 reclaim confirms bottom per Galaxy. spotgamma separately flagged record IBIT call volume with call-skew ranking 98/100 (extreme).", "tweet_url": "https://x.com/rektmando/status/2091875156511875507", "images": ["https://pbs.twimg.com/media/HQfUw3yWIAAXA0T.jpg"], "type": "tweet"}]}, {"cluster": "US-Canada Trade War Escalates", "category": ["geopolitics", "macro"], "items": [{"author": "Geiger_Capital", "summary": "Trump announced auto and steel tariffs on Canada rising to 50% starting January 1, 2027, alongside: \"we don't need Canada, they need us.\"", "tweet_url": "https://x.com/Geiger_Capital/status/2091885582687277408", "images": ["https://pbs.twimg.com/media/HQfe2hJWgAIq8Mn.jpg"], "type": "tweet"}, {"author": "aleabitoreddit", "summary": "\"Bro why are we fighting a Trade War with our friendly Golden Retriever named Canada — shouldn't we be focusing on Iran today?\" — flags the escalation as odd timing, and separately notes markets \"don't appreciate uncertainty\" from the dual fronts.", "tweet_url": "https://x.com/aleabitoreddit/status/2091889047325335611", "images": [], "type": "thread"}, {"author": "buccocapital", "summary": "Riffed that it would be \"incredibly Trumpian\" to just take Greenland and Canada and put all the data centers there — surprised he hasn't tweeted it yet.", "tweet_url": "https://x.com/buccocapital/status/2091876351623974949", "images": [], "type": "tweet"}]}, {"cluster": "Data Center Backlash — NIMBYism, Not Substance", "category": ["energy", "society", "ai"], "items": [{"author": "nic_carter", "summary": "Long thread arguing the anti-data-center panic is not driven by careful thinking about AI job loss or safety literature (Dario, Bostrom, Yudkowsky) but by impressionable, reflexive NIMBYism — comparing it to COVID hysteria. Cites polling showing data centers aren't in the top 3 public concerns and that water-usage objections aren't legitimate; argues opposition would apply to any industrial technology, and that data centers in rural areas actually lower average homeowners' property taxes (cites Loudoun County, ~$6k less per household).", "tweet_url": "https://x.com/nic_carter/status/2091852864016564657", "images": ["https://pbs.twimg.com/media/HQfeX0OWQAAexQw.jpg", "https://pbs.twimg.com/media/HQfeZjYWcAAOhwR.jpg"], "type": "thread"}, {"author": "himgajria", "summary": "\"Blaming data centers as an AI user is like blaming slaughterhouses as a non-vegetarian. Your demand feeds their supply\" — a complementary framing to nic_carter's, putting responsibility on AI usage rather than the infrastructure itself.", "tweet_url": "https://x.com/himgajria/status/2091858975381922279", "images": [], "type": "tweet"}]}, {"cluster": "Coinbase Launches Tokenized Stocks on Base", "category": ["crypto", "regulation"], "items": [{"author": "ErikVoorhees", "summary": "\"It is because America is free that we are blocked from financial innovation\" — reacting to Coinbase's tokenized stocks launch on Base being available only to persons outside the U.S.", "tweet_url": "https://x.com/ErikVoorhees/status/2091933490249941284", "images": [], "type": "tweet"}, {"author": "brian_armstrong", "summary": "\"We're making Coinbase the best place to trade every type of asset\" — confirming commodities trading is coming to Coinbase alongside the tokenized-stocks push.", "tweet_url": "https://x.com/brian_armstrong/status/2091925564382708017", "images": [], "type": "tweet"}, {"author": "Matt_Hougan", "summary": "Teased that Bitwise will show what it's building on top of Coinbase's newly launched tokenized stocks \"tomorrow.\"", "tweet_url": "https://x.com/Matt_Hougan/status/2091925178833948756", "images": [], "type": "tweet"}]}], "B_insights": [{"author": "ZeeContrarian1", "summary": "Detailed activist-driven turnaround thesis on $SNAP. Core argument: Evan Spiegel hasn't changed, but the conditions around him have — Specs (AR glasses) was spun into its own subsidiary (Jan 28), activist Adam Katz/Irenic Capital took a stake (Mar 31), Snap cut ~1,000 jobs and $500M+ of annualized costs (Apr 15), and Specs now carries a real $2,195 price tag that forces the AR bet to meet market reality rather than remain a subsidized vision. Q2 showed 19% revenue growth, positive free cash flow, and 971M monthly active users. Base case: Snap doesn't need to become great, just needs to \"stop doing stupid things,\" implying 20-30% upside; in an M&A scenario he thinks 3-4x the current share price wouldn't surprise him, given Katz (capital allocation background) now pushing Spiegel (product visionary) toward discipline.", "tweet_url": "https://x.com/ZeeContrarian1/status/2091909612626755606", "images": ["https://pbs.twimg.com/media/HQf0tCiWkAAO0V_.jpg"], "type": "thread"}, {"author": "thedefivillain", "summary": "Detailed read on Strategy's (MSTR) new \"USD Cash\" mechanism: by capping STRC hard at $100 par via unlimited issuance, the market has an incentive to sell/short near that level, which increases drawdown risk and makes reclaiming par harder. More importantly, keeping STRC below par is effectively forcing Saylor into market-timing behavior for the first time — historically he bought BTC immediately with any cash and was later forced to de-lever at bad prices; now a USD Cash buffer lets him time purchases/sales, which could be better (more conservative) or much worse (buying higher after holding cash too long), depending on discipline.", "tweet_url": "https://x.com/thedefivillain/status/2091866316780994876", "images": [], "type": "thread"}, {"author": "GavinSBaker", "summary": "On an FT report suggesting enterprise customer preference for zero-data-retention (ZDR) model deployments: says he's surprised so many customers are still on ZDR-requiring setups now that Opus 5 is available, framing it as simply reflecting customer preference rather than a concerning signal. Separately flags the more interesting open question as where AI \"teacher models\" (used to train smaller/distilled models) stack up against the frontier today and in coming months.", "tweet_url": "https://x.com/GavinSBaker/status/2091927952615182473", "images": ["https://pbs.twimg.com/media/HQgFYuvWkAAN5JA.jpg"], "type": "tweet"}, {"author": "theallinpod", "summary": "Relayed David Sacks' detailed, step-by-step prediction of how regulatory capture could functionally ban open-source AI without ever naming it a ban: closed labs (Anthropic wants an \"FDA for AI\" but lacks support) instead push a \"FINRA for AI\" self-regulatory body they fund and staff; that body sets pre-release testing standards which get codified into law; then regulators apply those standards \"equally\" to open and closed models — even though open models can't be recalled or monitored once released, which closed labs argue makes them inherently more dangerous. The result: open models can't structurally comply and get gradually shut out of the market.", "tweet_url": "https://x.com/theallinpod/status/2091923804725362902", "images": [], "type": "tweet"}, {"author": "lopp", "summary": "If you only use AI as a chatbot you can get a 100x productivity gain on tedious tasks — but most people don't grasp the next 100x gain coming from orchestrating multiple agents to handle far more complex tasks, which is what has technical audiences excited. Separately reflected that the past month reinforced his belief that \"everything is broken, and yet\" the modern world runs on antifragility — constant breakage offset by constant human repair.", "tweet_url": "https://x.com/lopp/status/2091879463898276242", "images": [], "type": "thread"}, {"author": "DefiIgnas", "summary": "Points out that none of the top crypto trading platforms have tokens, despite generating a combined ~$10M/week in revenue that currently flows entirely to team/equity holders. Speculates teams avoid tokens to dodge revenue-sharing pressure or because tokens attract airdrop farmers who ultimately get farmed themselves — citing BullX (long points campaign, no token ever issued, platform shut down) and Terminal/Padre (acquired by pump.fun, token went to zero before a partial PUMP-token consolation). Still argues a TGE could be lucrative given demonstrated demand (PUMP's own token success), and asks why none of the leaders have done it.", "tweet_url": "https://x.com/DefiIgnas/status/2091877697257668688", "images": ["https://pbs.twimg.com/media/HQfXrhGbAAAjOMS.jpg"], "type": "thread"}, {"author": "RaoulGMI", "summary": "Argues stablecoins' most important use case isn't settlement speed but programmability: an agentic economy of billions of AI agents transacting machine-speed with each other requires software-native money, since agents can't open bank accounts or handle cash. Frames \"software eating money\" (extending Andreessen's thesis) as the crux of his \"Exponential Age\" framework — an entirely new economy being built for machines with its own rails.", "tweet_url": "https://x.com/RaoulGMI/status/2091934785908126092", "images": [], "type": "thread"}, {"author": "stacy_muur", "summary": "After months trying to train AI to write in her exact voice (same syntax, phrasing, formatting) using a large corpus of her own writing, concludes the outcome still \"sucked\" — style can be humanized but the underlying \"core thought\" remains artificial. Argues fully automated content systems aren't yet possible; a human has to remain the source of thought, not just the editor. Cites a study on narration-pattern differences between AI and human fiction writing.", "tweet_url": "https://x.com/stacy_muur/status/2091916450915393688", "images": ["https://pbs.twimg.com/media/HQf67RdaQAAmo-L.jpg"], "type": "thread"}, {"author": "jvisserlabs", "summary": "Frames human time as \"industrial capitalism's operating system,\" now being broken by AI agents operating at machine speed. Argues traditional finance tools (DCF models, terminal value) were built for human-speed decision-making, but Bitcoin is the exception since crypto provides machine-native rails — positioning BTC as a hedge against \"time risk\" in an agent economy.", "tweet_url": "https://x.com/jvisserlabs/status/2091865607599804763", "images": ["https://pbs.twimg.com/media/HQep9JeX0AEG8ha.jpg"], "type": "tweet"}, {"author": "zachxbt", "summary": "Extensive OSINT thread unmasking \"M1llionz\" (Telegram alias RichMilly666), a French cybercriminal allegedly laundering proceeds from two violent home-invasion robberies in April 2026 (~$667K total, victims hospitalized). Traced stolen BTC bridged to Ethereum via Chainflip, then laundered through multiple Kucoin deposit addresses and partly converted to Monero; identified matching withdrawal addresses via timing analysis, achieved a $93K USDT freeze tied directly to the attacks, and cross-referenced Telegram/Snapchat posts and screenshots to confirm wallet control plus real-world aliases and emails. Notes home-invasion cases remain a top priority and that French law enforcement has been cooperative despite inefficient laws.", "tweet_url": "https://x.com/zachxbt/status/2091858017658822969", "images": ["https://pbs.twimg.com/media/HQfBwIZagAA-9Dd.png", "https://pbs.twimg.com/media/HQfBjkwaYAAEJAU.jpg"], "type": "thread"}, {"author": "Swedish_uranium", "summary": "Top picks across uranium/copper/gold/silver (Cameco, NexGen, Copper Giant, Hycroft, Myriad, and others) share one trait: scale. Argues grade alone doesn't build a mine — deposits must be large enough to justify capital and infrastructure, and sufficiently de-risked giant deposits attract serious investors, development partners and acquirers, with early-shareholder returns that can be transformational when a giant deposit succeeds.", "tweet_url": "https://x.com/Swedish_uranium/status/2091937301089657116", "images": [], "type": "tweet"}, {"author": "sjdedic", "summary": "Argues this crypto cycle is structurally different from prior ones: earlier cycles ran on hope and halving narratives, while this one is built on real onchain businesses generating real cashflows — a distinction he says most people still don't grasp.", "tweet_url": "https://x.com/sjdedic/status/2091906046323282298", "images": [], "type": "tweet"}, {"author": "udiWertheimer", "summary": "Points to Xiaomi's AI Cube prototype (1.22 TB/s memory bandwidth, up to 160GB unified memory, running 120B models locally) as evidence consumer AI hardware is advancing fast — pushes back on \"doomer\" claims that personal AI compute will remain too expensive, arguing the market fixes cost/performance over time.", "tweet_url": "https://x.com/udiWertheimer/status/2091902831619879019", "images": [], "type": "tweet"}, {"author": "hooeem", "summary": "Every viral post about Grok's \"grokbot\" AI agent product (priced at $2,200/year) could be replicated with a $10/month subscription in his view — argues the friction/cost gap isn't justified unless it generates more than $2,200 in unique value, and that grokbot's UX edge for agentic workflows doesn't yet close that gap for most users (though power users on tools like Cursor Ultra may be an exception).", "tweet_url": "https://x.com/hooeem/status/2091825798554554485", "images": [], "type": "thread"}, {"author": "garrytan", "summary": "\"Current meta: OpenAI is actually the much more open lab\" — reacting to Sam Altman's comments about merging ChatGPT and Codex into a platform play. Separately argued that even with advancing agentic AI, deterministic infrastructure (databases, APIs, ACLs, SQL) doesn't go away — software companies need to build the AI harness around that infrastructure or risk being subsumed by companies that do.", "tweet_url": "https://x.com/garrytan/status/2091871782794051711", "images": [], "type": "thread"}, {"author": "aleabitoreddit", "summary": "$XPEV carved out its robotics unit and raised over $900M at a $6.3B+ valuation, following Unitree's IPO (now ~$35-36B market cap) and the $NVDA/$AMZN-backed Agility Robotics round at a $2.5B pre-money valuation — flags Agility as arguably further ahead in commercialization than Xpeng, and humanoid/physical-AI funding as clearly accelerating. Separately covered $NVDA's Groq3 LPX chip entering full production with $NBIS (Nebius) as first adopter, citing 3,400 tok/s on Artificial Analysis benchmarks and 4x faster responsiveness than the nearest alternative, tying it back to Nvidia's earlier $2B investment in Nebius for early-adopter access.", "tweet_url": "https://x.com/aleabitoreddit/status/2091851831718879660", "images": ["https://pbs.twimg.com/media/HQfAJs_bEAAKaVt.jpg"], "type": "tweet"}, {"author": "patrick_oshag", "summary": "Relayed Sam Altman's comments on investors: \"the number of investors that actually show up and try to help you is unbelievably small\" — singled out Josh Kushner as the one investor he'd point to as proactively, relentlessly helpful, arguing that kind of support is rare enough that founders notice and value it disproportionately.", "tweet_url": "https://x.com/patrick_oshag/status/2091933309601267886", "images": [], "type": "tweet"}, {"author": "nicbstme", "summary": "On Nvidia's Vera Rubin silicon posting up to 30x more throughput per megawatt and 35x lower token cost than GB300 NVL72 on agentic workloads: argues there's no such thing as a \"good enough\" chip when electricity, land and permits are the real bottlenecks — better chips let providers serve more users on the same infrastructure footprint, directly increasing revenue per unit of scarce power/land.", "tweet_url": "https://x.com/nicbstme/status/2091933600237429112", "images": [], "type": "tweet"}, {"author": "stonecoldpat0", "summary": "After watching recent humanoid robot competitions in China, thinks there's a good probability humanoids get sent to set up Moon/Mars settlements well before humans arrive.", "tweet_url": "https://x.com/stonecoldpat0/status/2091874341848031702", "images": [], "type": "tweet"}, {"author": "Crypto_McKenna", "summary": "Notes the U.S. Strategic Bitcoin Reserve (SBR) narrative — largely off the radar over summer — is resurfacing on timelines. Says he flagged this coming independently before the move, but was wrong about Republicans winning over Democrats to pass the CLARITY Act in time; instead the SEC and CFTC stepped in directly to meet the administration's crypto-capital-of-the-world objective, which combined with Bessent's long-dated Treasury purchases to fuel the rally.", "tweet_url": "https://x.com/Crypto_McKenna/status/2091882277316026427", "images": [], "type": "tweet"}, {"author": "Bluntz_Capital", "summary": "Watching activity on \"Robinhood chain\" reinforces a view that infrastructure plays are outperforming and are structurally easier to pick as winners than memecoins this cycle, since infra requires real building while anyone can spin up a meme — even though a handful of memes will likely still outperform by chance.", "tweet_url": "https://x.com/Bluntz_Capital/status/2091816126946713760", "images": [], "type": "tweet"}, {"author": "naval", "summary": "Argues the political push to enforce equality despite biology and market outcomes claims moral high ground but, because it contradicts biology and markets, ultimately requires censorship and coercion to sustain — which he says makes the project immoral regardless of its stated goal.", "tweet_url": "https://x.com/naval/status/2091826627282075986", "images": [], "type": "tweet"}, {"author": "dgt10011", "summary": "Notes \"DCA\" is usually read as dollar-cost-averaging, but the same acronym works for \"don't chase acceleration\" — different emotional discipline, same practical outcome for position sizing into fast-moving markets.", "tweet_url": "https://x.com/dgt10011/status/2091880173784170541", "images": [], "type": "tweet"}, {"author": "PeterDiamandis", "summary": "Musing on a post-AGI world: if survival is no longer tied to necessary work, purpose (long confused with productivity) will need to be rediscovered — asks what stories a post-AGI civilization will tell about itself, the way Homer's epics or Petrarch's poetry defined earlier eras.", "tweet_url": "https://x.com/PeterDiamandis/status/2091858555020136651", "images": [], "type": "tweet"}, {"author": "RayDalio", "summary": "Describes Elon Musk as a \"Shaper\" archetype who operates fluidly between big-picture vision and granular execution detail — citing Musk walking him through car interface details in the same conversation as plans to send a watering can with a plant to Mars to establish \"first life on Mars\" as an inspirational gesture.", "tweet_url": "https://x.com/RayDalio/status/2091900586371252567", "images": [], "type": "tweet"}, {"author": "punk6529", "summary": "On the question of where humans find meaning once AI removes the necessity of work: predicts the same distribution as today will persist — a minority finding meaning through struggle/work, most through family or consumption, and some remaining unhappy regardless of the macro conditions.", "tweet_url": "https://x.com/punk6529/status/2091867293424775439", "images": [], "type": "tweet"}], "C_contrarian": [{"author": "elerianm", "summary": "Against the crowd cheering Bessent's TGA/buyback liquidity as bullish: warns that drawing the Treasury deeper into bond-market price determination has a shaky historical track record outside genuine market malfunctions, and that it's \"usually not healthy\" when markets consistently dictate extraordinary official interventions rather than the other way around.", "tweet_url": "https://x.com/elerianm/status/2091876866286145987", "images": ["https://pbs.twimg.com/media/HQfW7EdXcAA_-H-.jpg"], "type": "tweet"}, {"author": "Melt_Dem", "summary": "\"Bitcoin and gold rallying in tandem while the AI complex bleeds, everything is fine guys!\" — sarcastically flags the divergence between hard-asset strength and AI/equity weakness as a warning sign rather than confirmation the bull case is intact.", "tweet_url": "https://x.com/Melt_Dem/status/2091909328076767301", "images": [], "type": "tweet"}, {"author": "DCinvestor", "summary": "Departs from the \"Bessent saves the dollar\" framing dominant elsewhere in the feed: says this administration is \"very likely\" going to take actions that \"completely obliterate & destroy the American empire and the petrodollar and USD,\" and that he's made peace with it since it's outside his control — positioning readers to focus on their own hedges rather than policy outcomes.", "tweet_url": "https://x.com/DCinvestor/status/2091879690609025336", "images": [], "type": "tweet"}, {"author": "nic_carter", "summary": "Pushes back directly against the prevailing anti-data-center sentiment circulating broadly on CT and in media coverage, arguing polling shows the public's stated objections (water usage, health fears) don't hold up and aren't actually among people's top concerns.", "tweet_url": "https://x.com/nic_carter/status/2091852864016564657", "images": [], "type": "tweet"}, {"author": "zeroxkyle", "summary": "Against the standard four-year halving-cycle framework still widely used to time crypto: argues the 4-year cycle is over — BTC will still be cyclical (booms/busts like commodities) but altcoins will no longer track BTC and will instead follow HYPE, and markets won't need \"that good\" of BTC conditions to support an alt rally going forward.", "tweet_url": "https://x.com/zeroxkyle/status/2091743985966760320", "images": [], "type": "tweet"}, {"author": "jimcramer", "summary": "Pushes back on the WSJ narrative of a broad market \"party\" rotating out of AI/data-center names: \"where's the party? It's in the drug stocks, the foods, the transports, selected industrials that are non-data center\" — implying the AI trade specifically, not the broader market, is what's under pressure. Separately defended Nvidia against what he called unfairly cynical press coverage ahead of earnings.", "tweet_url": "https://x.com/jimcramer/status/2091877831722651925", "images": [], "type": "tweet"}], "D_positioning": [{"author": "DTAPCAP", "summary": "Technically positioned long BTC on the 50/100/200-day MA breakout, viewing continued squeeze toward 100k as the highest-probability path given how badly the market is caught short.", "tweet_url": "https://x.com/DTAPCAP/status/2091891414988664965", "images": ["https://pbs.twimg.com/media/HQfkJ0qWUAAbH0Z.jpg"], "type": "tweet"}, {"author": "TaikiMaeda2", "summary": "\"Gigalong\" on $ZEC (Zcash) ahead of its ETF launch this week — argues the debasement trade favors hard-money assets broadly, but BTC carries structural headwinds (quantum risk, privacy limitations, Saylor execution risk) that make ZEC the more attractive vehicle for macro heads like Dalio who like the debasement trade but are wary of BTC's specific risks.", "tweet_url": "https://x.com/TaikiMaeda2/status/2091897454082085372", "images": [], "type": "tweet"}, {"author": "ZeeContrarian1", "summary": "Long $SNAP on the activist/turnaround thesis (see Section B) — 20-30% base-case upside from operational discipline, 3-4x in an M&A scenario.", "tweet_url": "https://x.com/ZeeContrarian1/status/2091909612626755606", "images": [], "type": "tweet"}, {"author": "aleabitoreddit", "summary": "Flags $AAOI's decision to avoid long-term supply agreements (unlike $LITE/$COHR, whose LTAs with Nvidia worked out well) to preserve capacity flexibility across customers — expects AAOI to gain more pricing leverage over time given current laser/transceiver shortages. Also flags $NVDA/$NBIS optical/inference infrastructure buildout (Groq3 LPX production ramp) as a positioning angle on the AI infra trade.", "tweet_url": "https://x.com/aleabitoreddit/status/2091935022005776661", "images": [], "type": "tweet"}, {"author": "Swedish_uranium", "summary": "High-conviction long positioning across scale uranium/copper/gold/silver developers and producers: Cameco, NexGen, Copper Giant, Hycroft, Myriad among top picks.", "tweet_url": "https://x.com/Swedish_uranium/status/2091937301089657116", "images": [], "type": "tweet"}, {"author": "buccocapital", "summary": "Notes Shopify and DoorDash have become \"consensus longs\" up 50-60% on the AI-winners thesis, sarcastically welcoming late arrivals to a trade already up ~700% over the past year — flags it may be due for a breather rather than a straight line higher.", "tweet_url": "https://x.com/buccocapital/status/2091895105472905305", "images": ["https://pbs.twimg.com/media/HQfnJ03WwAAfZx6.jpg"], "type": "thread"}, {"author": "rektmando", "summary": "Daily digest flags Wintermute is \"heavily short across the market\" — a positioning signal from a major crypto market maker worth tracking against the bottom-is-in retail/fund narrative.", "tweet_url": "https://x.com/rektmando/status/2091875156511875507", "images": [], "type": "tweet"}, {"author": "Matt_Hougan", "summary": "Bitwise teasing a new product built directly on top of Coinbase's newly launched tokenized stocks on Base, to be revealed \"tomorrow.\"", "tweet_url": "https://x.com/Matt_Hougan/status/2091925178833948756", "images": [], "type": "tweet"}], "E_links": [{"author": "Delphi_Digital", "url": "https://members.delphidigital.io/reports/task-markets?code=52ac1bcfe633&utm_source=twitter&utm_medium=social", "tweet_url": "https://x.com/Delphi_Digital/status/2091903625048330702", "description": "Report on TaskMarket/ERC-8195, an open standard for AI agents outsourcing work to each other with USDC escrow on Base."}, {"author": "Delphi_Digital", "url": "https://www.youtube.com/watch?utm_source=twitter&utm_medium=social&v=jZ9r3_By8BU&feature=youtu.be", "tweet_url": "https://x.com/Delphi_Digital/status/2091863670342975965", "description": "Compound Managing Partner @mhdempsey on why venture firms must continually rebuild their informational edge as AI erodes it."}, {"author": "BobEUnlimited", "url": "https://www.bloomberg.com/news/articles/2026-08-24/hedge-funds-ramp-up-dollar-shorts-ahead-of-bessent-s-fiscal-plan", "tweet_url": "https://x.com/BobEUnlimited/status/2091922251314544742", "description": "Bloomberg: hedge funds ramping up USD short positioning ahead of Bessent's fiscal plan."}, {"author": "elerianm", "url": "https://www.cnbc.com/video/2026/08/24/mohamed-el-erian-on-treasury-debt-buyback-market-pricing-is-leading-the-treasury.html", "tweet_url": "https://x.com/elerianm/status/2091917645540950203", "description": "El-Erian on CNBC Squawk Box discussing Treasury debt buybacks and market pricing leading Treasury actions."}, {"author": "Rewkang", "url": "https://robostrategy.co/news/shareholder-letter-aug-2026", "tweet_url": "https://x.com/Rewkang/status/2091913319766749630", "description": "First RoboStrategy shareholder letter."}, {"author": "reidhoffman", "url": "https://x.com/reidhoffman/status/2091911637460554146", "tweet_url": "https://x.com/reidhoffman/status/2091911637460554146", "description": "Essay on detecting AI-aided essays and whether using AI to write diminishes the value of your ideas."}, {"author": "stacy_muur", "url": "https://arxiv.org/pdf/2604.03136", "tweet_url": "https://x.com/stacy_muur/status/2091916450915393688", "description": "Study on narration patterns of AI vs. human fiction writing."}, {"author": "jvisserlabs", "url": "https://x.com/jvisserlabs/status/2091865607599804763", "tweet_url": "https://x.com/jvisserlabs/status/2091865607599804763", "description": "\"The Silent IPO is over\" — Bitcoin as a hedge against machine-speed time risk."}, {"author": "zriboua", "url": "https://www.iranintl.com/en/202608225522", "tweet_url": "https://x.com/zriboua/status/2091896003594977632", "description": "Iran International: central bank denies hyperinflation while a Tehran economist and empty shelves suggest otherwise."}, {"author": "AviFelman", "url": "https://www.youtube.com/watch?v=xAVzE-OdIeo", "tweet_url": "https://x.com/AviFelman/status/2091921867888021547", "description": "Full interview with Evgeny (Re7Capital) on market-neutral crypto strategies, AI risk to DeFi, and commodities trading."}, {"author": "rektmando", "url": "https://t.co/7EJrnNibAt", "tweet_url": "https://x.com/rektmando/status/2091875156511875507", "description": "Daily crypto/macro/AI news digest newsletter (Yeet)."}]}, "coverage": {"authors_covered": 54, "authors_total": 75, "coverage_pct": 72}};

// ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
