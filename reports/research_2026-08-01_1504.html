const META = {
  date: "2026-08-01",
  time: "15:04 CEST",
  windowStart: "2026-08-01 09:04 CEST",
  windowEnd: "2026-08-01 15:04 CEST",
  emailsInWindow: 11,
  emailsRead: 11,
  itemsExtracted: 21,
  includedSources: [
    "Hardfork (Substack) — 1 item",
    "Salazar Slytherin — AI News — 1 item",
    "Ironsides Macro — 6 items",
    "Irrational Analysis — 3 items",
    "Peter Frankopan — 1 item",
    "Blind Squirrel Macro (arcadianow) — 1 item",
    "Salazar Slytherin — Crypto News — 5 items",
    "SixSigmaCapital — 3 items"
  ],
  skippedSources: [
    "Helene Meisler / Saturday Chart Fest — author traveling, single sentence, zero analytical content this week",
    "Compounding Quality (qualitycompounding) — pure sales funnel for a paid annual plan, never names the actual stock or thesis",
    "SixSigmaCapital subscriber chat thread — duplicate notification linking to the same weekly post already captured as items 19-21, no new content"
  ]
};

const CAT_META = {
  macro: { label: "macro", color: "#e24b4a" },
  credit: { label: "credit", color: "#378add" },
  positioning: { label: "positioning", color: "#ef9f27" },
  aiinfra: { label: "AI/infra", color: "#1d9e75" },
  crypto: { label: "crypto", color: "#7f77dd" },
  geopolitics: { label: "geopolitics", color: "#d85a30" },
  energy: { label: "energy", color: "#f97316" },
  tech: { label: "tech", color: "#06b6d4" },
  gold: { label: "gold", color: "#d4a017" },
  culture: { label: "culture", color: "#ec4899" },
  labor: { label: "labor", color: "#8b5cf6" },
  regulation: { label: "regulation", color: "#64748b" },
  science: { label: "science", color: "#14b8a6" },
  venture: { label: "venture", color: "#84cc16" }
};

const URG_META = {
  act: { label: "🔴 Act Now" },
  deep: { label: "🔵 Deep" },
  watch: { label: "🟡 Watch" }
};

let currentCat = "all";
let currentUrg = "all";
let currentSrc = null;

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function toggleCard(id) {
  var el = document.getElementById('card-' + id);
  el.classList.toggle('open');
}

function urgEmoji(u) {
  if (u === 'act') return '🔴';
  if (u === 'deep') return '🔵';
  return '🟡';
}

function renderCards() {
  var container = document.getElementById('cards');
  var html = '';
  var visibleIndex = 0;
  ITEMS.forEach(function(item, idx) {
    var matchesCat = currentCat === 'all' || item.cat === currentCat;
    var matchesUrg = currentUrg === 'all' || item.urgency === currentUrg;
    var matchesSrc = !currentSrc || item.source.indexOf(currentSrc) !== -1;
    if (!matchesCat || !matchesUrg || !matchesSrc) return;
    visibleIndex++;
    var cm = CAT_META[item.cat] || { label: item.cat, color: '#999' };
    var chartFlag = '';
    if (item.charts.hot) chartFlag = '<span class="chart-flag" title="Chart worth saving">🔥</span>';
    else if (item.charts.count > 0 || item.charts.desc) chartFlag = '<span class="chart-flag" title="Charts inside">📊</span>';
    var openClass = currentSrc ? ' open' : '';
    html += '<div class="card' + openClass + '" id="card-' + item.id + '">';
    html += '  <div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '    <span class="num">' + String(visibleIndex).padStart(2,'0') + '</span>';
    html += '    <span class="urg">' + urgEmoji(item.urgency) + '</span>';
    html += '    <span class="badge" style="background:' + cm.color + '">' + item.source + '</span>';
    html += '    <span class="cat-pill">' + cm.label + '</span>';
    html += chartFlag;
    html += '    <span class="title">' + item.title + '</span>';
    html += '  </div>';
    html += '  <div class="card-body">';
    html += '    <div class="section-label">The Idea</div>';
    html += '    <div class="idea">' + item.idea + '</div>';
    html += '    <div class="section-label">My Angle</div>';
    html += '    <div class="angle" style="border-left-color:' + cm.color + '; background:' + cm.color + '14;">' + item.angle + '</div>';
    html += '    <div class="tweets">';
    html += '      <div class="tweet a"><div class="lbl">TWEET A</div><div class="txt">' + item.tweetA + '</div>';
    html += '        <button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '      <div class="tweet b"><div class="lbl">TWEET B</div><div class="txt">' + item.tweetB + '</div>';
    html += '        <button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '    </div>';
    if (item.charts.count > 0 || item.charts.desc) {
      html += '    <div class="charts-box' + (item.charts.hot ? ' hot' : '') + '">' +
              (item.charts.hot ? '🔥 CHART WORTH SAVING — ' : '📊 ') +
              (item.charts.desc || 'Charts inside the article — worth opening.') + '</div>';
    }
    html += '    <a class="readlink" href="' + item.link + '" target="_blank">↗ Read full article</a>';
    html += '  </div>';
    html += '</div>';
  });
  if (!html) html = '<div style="color:var(--sub);padding:24px 4px;">No items match this filter.</div>';
  container.innerHTML = html;
}

function renderFilters() {
  var catCounts = {};
  var urgCounts = { act: 0, deep: 0, watch: 0 };
  ITEMS.forEach(function(item) {
    catCounts[item.cat] = (catCounts[item.cat] || 0) + 1;
    urgCounts[item.urgency] = (urgCounts[item.urgency] || 0) + 1;
  });

  var catHtml = '<button class="pill all' + (currentCat === 'all' ? ' active' : '') + '" onclick="setCat(\'all\')">All (' + ITEMS.length + ')</button>';
  Object.keys(CAT_META).forEach(function(key) {
    if (!catCounts[key]) return;
    var cm = CAT_META[key];
    var active = currentCat === key;
    catHtml += '<button class="pill' + (active ? ' active' : '') + '" style="' +
      (active ? 'background:' + cm.color + ';' : 'color:' + cm.color + ';border-color:' + cm.color + ';') +
      '" onclick="setCat(\'' + key + '\')">' + cm.label + ' (' + catCounts[key] + ')</button>';
  });
  document.getElementById('catFilters').innerHTML = catHtml;

  var urgOrder = ['act','deep','watch'];
  var urgHtml = '<button class="pill all' + (currentUrg === 'all' ? ' active' : '') + '" onclick="setUrg(\'all\')">All (' + ITEMS.length + ')</button>';
  urgOrder.forEach(function(key) {
    if (!urgCounts[key]) return;
    var active = currentUrg === key;
    var color = key === 'act' ? '#e24b4a' : (key === 'deep' ? '#378add' : '#ef9f27');
    urgHtml += '<button class="pill' + (active ? ' active' : '') + '" style="' +
      (active ? 'background:' + color + ';' : 'color:' + color + ';border-color:' + color + ';') +
      '" onclick="setUrg(\'' + key + '\')">' + URG_META[key].label + ' (' + urgCounts[key] + ')</button>';
  });
  document.getElementById('urgFilters').innerHTML = urgHtml;
}

function setCat(cat) {
  currentCat = cat;
  currentSrc = null;
  renderFilters();
  renderCards();
}
function setUrg(urg) {
  currentUrg = urg;
  currentSrc = null;
  renderFilters();
  renderCards();
}
function filterBySrc(name) {
  currentSrc = name;
  currentCat = 'all';
  currentUrg = 'all';
  renderFilters();
  renderCards();
  document.getElementById('cards').scrollIntoView({ behavior: 'smooth' });
}

function renderMeta() {
  document.getElementById('metaLine').textContent =
    META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails';
}

function renderReport() {
  var html = '';
  html += '<div><strong>Window:</strong> ' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</div>';
  html += '<div class="totals">Emails in window: ' + META.emailsInWindow + ' · Emails read: ' + META.emailsRead + ' · Items extracted: ' + META.itemsExtracted + '</div>';
  html += '<div class="section-label">Included Sources</div>';
  html += '<div class="report-grid">';
  META.includedSources.forEach(function(s) {
    var name = s.split(' — ').slice(0, -1).join(' — ');
    html += '<div class="src-item" onclick="filterBySrc(\'' + name.replace(/'/g, "\\'") + '\')">→ ' + s + '</div>';
  });
  html += '</div>';
  html += '<div class="section-label">Skipped Sources</div>';
  html += '<div class="report-grid">';
  META.skippedSources.forEach(function(s) {
    html += '<div class="skip-item">✕ ' + s + '</div>';
  });
  html += '</div>';
  document.getElementById('reportBody').innerHTML = html;
}

document.getElementById('reportHeader').addEventListener('click', function() {
  var box = document.getElementById('reportBox');
  box.classList.toggle('open');
  document.getElementById('reportToggle').textContent = box.classList.contains('open') ? '▴' : '▾';
});

function init() {
  renderMeta();
  renderFilters();
  renderCards();
  renderReport();
}
init();
</script>
