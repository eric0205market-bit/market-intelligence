<script>
const ITEMS = [{"id": 1, "cat": "macro", "urgency": "act", "source": "John Authers / Bloomberg Points of Return", "title": "Blue wave, no black Wednesday: S&P +1.6% while Democrats sweep Congress", "idea": "Authers notes futures sold off on the ever-more-likely Democratic Senate, then reversed at midnight ET. He draws the 2016 parallel: markets sold off on every Trump-win poll, then S&P rose 1.1% the Wednesday after he won. Same pattern in Brazil a week ago, where Lula's win triggered a selloff, and here the opposite. Bonds and oil fell as the S&P rose.", "angle": "Positioning was braced for the wrong tail. Useful for the 'markets price the scenario, not the outcome' file.", "tweetA": "Futures sold the Senate odds all evening, then ripped the moment the result was certain. 2016 did the same thing in reverse. The tell isn't the outcome, it's that the hedge was already on.", "tweetB": "Brazil last week: Lula wins, market panics. US this week: Democrats sweep, S&P +1.6%. Same 'bad' political outcome, opposite tape. The only variable is what was pre-positioned.", "charts": {"count": 2, "hot": true, "desc": "Stock futures through election night, turning at midnight ET; reversal is the story"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-11-05/markets-seem-to-like-the-new-deadlock"}, {"id": 2, "cat": "macro", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "SocGen: Republican president + Democratic Congress has historically been good for stocks AND bonds", "idea": "Manish Kabra (SocGen) chart shows a Republican president constrained by a Democratic Congress tends to deliver good returns for both stocks and bonds. The surprise Republican tax-cut path is now dead and the veto caps any large fiscal expansion. Authers frames gridlock as a benefit amid fiscal anxiety.", "angle": "Fiscal-dominance fear gets a lower probability. Relevant to term premium and long-end positioning.", "tweetA": "Gridlock is a duration trade nobody had on. Veto blocks big spending, Congress blocks the tax cut, so the supply path for Treasuries just got flatter. I'd rather be asking what the 30y does if the deficit stops growing on autopilot.", "tweetB": "For two years the bear case was Congress rubber-stamping whatever gets sent. That's gone. Stocks and bonds both liked this setup historically, and almost nobody was positioned for it.", "charts": {"count": 1, "hot": true, "desc": "SocGen chart: returns for stocks and bonds under Republican president with Democratic Congress"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-11-05/markets-seem-to-like-the-new-deadlock"}, {"id": 3, "cat": "macro", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "Fed independence off the table: Senate confirms governors, Cook case continues", "idea": "Senate approval of Fed appointments blocks packing the board with presidential loyalists. Authers notes the Cook prosecution effort resumed, though Cook voted last month to hike. Inflation swaps moved immediately, which he reads as hawks liking the result. He also says inflation has now beaten two presidents in a row.", "angle": "Fed-hike path with less political tail risk. Ties to MacroEdge's expected December hike.", "tweetA": "Cook voted to hike and the White House formed a committee to probe her. Now the Senate that confirms replacements flipped. Try packing the Fed with that math.", "tweetB": "Two presidents in a row beaten by inflation. The next one, of either party, inherits a constraint: don't reignite it. That's an input to the terminal rate nobody is modeling.", "charts": {"count": 1, "hot": false, "desc": "Inflation swaps reaction chart"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-11-05/markets-seem-to-like-the-new-deadlock"}, {"id": 4, "cat": "geopolitics", "urgency": "act", "source": "John Authers / Bloomberg Points of Return", "title": "Brazil holds Selic at 13.75% after Lula win; post-election selloff killed the cut", "idea": "Brazil's central bank abandoned a planned cut and held at 13.75% after markets sold off on Lula's return to power. Authers sets it next to the US result as markets reacting to surprises in opposite directions.", "angle": "EM carry with a fiscal-risk premium back. Watch BRL and local curve.", "tweetA": "Brazil at 13.75% and still can't cut. That's the price of a currency that sold off on an election. Carry traders got paid to wait, not to relax.", "tweetB": "Same week: US election drives bonds down in yield, Brazil election drives the central bank to cancel a cut. Fiscal credibility is the whole difference.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-11-05/markets-seem-to-like-the-new-deadlock"}, {"id": 5, "cat": "positioning", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "WashU endowment +37% vs Ivy average more than 15pts lower; MPI says endowments run like trading desks", "idea": "Authers cites WashU at more than 37% for FY2026, beating the average Ivy by over 15 points. Michael Markov (MPI) finds WashU has among the highest volatility of endowments, driven by concentrated private co-investments including AI. His point: risk level, hedging and concentration drive returns more than manager selection, and boards may not understand it. Yale also reported a jump to a record $54.5B.", "angle": "Illiquid AI-private marks are the real endowment risk. Echoes 2008 liquidity squeeze that forced Yale and Harvard to borrow.", "tweetA": "37% at WashU. The Yale model was diversification; this is concentration with a prestige label. Backtest it in a 2008 liquidity squeeze and ask who funds the capital calls.", "tweetB": "Endowments just posted record years on private AI marks while public semis lose half their multiple. Mark-to-model vs mark-to-market. One of them is wrong, and the endowment reports won't tell you which until next fiscal year.", "charts": {"count": 1, "hot": false, "desc": "Factor-mimicking portfolio / volatility comparison across endowments"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-11-05/markets-seem-to-like-the-new-deadlock"}, {"id": 6, "cat": "geopolitics", "urgency": "watch", "source": "John Authers / Bloomberg Points of Return", "title": "Lame duck or mad dog: Foreign Affairs and European diplomats on a defeated Trump", "idea": "Authers flags Foreign Affairs' point that a lame duck can still start a war, and European diplomats briefing he could be 'more mad dog than lame duck'. Trump keeps the veto and executive powers, has no re-election constraint, and his control of the GOP nomination is compromised. Also: 2028 uncertainty up, with AOC-type risk and a messy GOP field (Polymarket market on GOP nominee).", "angle": "Tail risk is shifting from domestic policy to foreign policy. Hormuz, tariffs by executive order.", "tweetA": "Congress is now a constraint on spending, not on war powers or tariffs. Markets rallied on gridlock; the executive branch is the part that's not gridlocked.", "tweetB": "A president with nothing left to lose, an Iran war, and tariff authority. Markets priced the first half of that sentence out. Not the second.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-11-05/markets-seem-to-like-the-new-deadlock"}, {"id": 7, "cat": "AI/infra", "urgency": "act", "source": "John Authers / Bloomberg Points of Return", "title": "AI's politicization ratchets up: hyperscalers rally, semis and neoclouds punished", "idea": "Authers: Democrat Gina Hinojosa won Texas governor, partly on data-center unpopularity, and mayors and governors can limit builds. Presidential veto limits a broad 'AI pause', but the issue is live for 2028. On the day, hyperscalers joined the rally while semiconductor groups and neocloud developers were hit.", "angle": "The market is already splitting the AI trade into capex payers (win) vs capex recipients (lose).", "tweetA": "One election, two AI trades. Payers of capex rallied, receivers sold off. The market just wrote 'slower buildout' into the same stock prices that were 'AI is unstoppable' last week.", "tweetB": "If a ban on new data centers is bullish for Microsoft and bearish for Nvidia, then the whole AI thesis was a spending story and not a revenue story. Everybody saying otherwise should explain the price action.", "charts": {"count": 2, "hot": true, "desc": "Chart pair: hyperscalers vs semis/neoclouds post-election reaction"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-11-05/markets-seem-to-like-the-new-deadlock"}, {"id": 8, "cat": "geopolitics", "urgency": "deep", "source": "Stephen Innes / The Dark Side of the Boom", "title": "Goldman: China AI stocks -55% since July, now 25x forward vs 53x at peak", "idea": "Goldman Asia trading says state-backed buying is accelerating, domestic AI basket multiple fell from about 53x forward to about 25x, and US chip restrictions are pushing Chinese cloud firms to local alternatives. Global active managers have China exposure near five-year lows.", "angle": "Contrarian setup: crowded-out China plus US data-center politics. Pairs with MacroEdge's 'China is the biggest beneficiary' call.", "tweetA": "China AI basket: 53x to 25x, -55%, active managers at 5-year-low exposure, and the state is the marginal buyer. That's what a bottom setup looks like on paper. The question is earnings, not multiples.", "tweetB": "Texas is banning data centers while China has the power and the policy support. The same week, Goldman is pitching China's AI trade as the dip to buy. I'm not saying it works. I'm saying that's the pair.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/beijing-is-buying-the-dip-and-goldman"}, {"id": 9, "cat": "AI/infra", "urgency": "act", "source": "Stephen Innes / The Dark Side of the Boom", "title": "Goldman (Callahan): semis forward P/E 28x to 16x in two months; one of the widest daily Nasdaq/semi gaps in a decade", "idea": "Nasdaq 100 recovered about 400bp from overnight lows, Microsoft hit records and Amazon rose over 8%, while semis fell. Semiconductor forward multiples collapsed from about 28x to 16x, one of the widest discounts to the S&P in fifteen years. The logic: restrictions on new data centers make existing capacity more valuable and reduce capex.", "angle": "Either semis are the best value setup in 15 years or capex peaked. Needs evidence: hyperscaler capex guides, order slippage.", "tweetA": "Semis at 16x forward, down from 28x in eight weeks. Either that's the cheapest the AI supply chain has been in 15 years or the market just called peak capex. I want to see the next hyperscaler capex guide before picking a side.", "tweetB": "Amazon +8%, semis down, same day. The hyperscalers are the customers of the semis. Customers rallying because they might spend less is not a contradiction. It's the whole point.", "charts": {"count": 1, "hot": true, "desc": "Goldman chart: Nasdaq vs semiconductor daily performance gap and semi forward P/E vs S&P"}, "link": "https://thedarksideoftheboom.substack.com/p/the-markets-split-personality-big"}, {"id": 10, "cat": "energy", "urgency": "deep", "source": "Stephen Innes / The Dark Side of the Boom", "title": "Goldman: AI power trade meets the ballot box; Texas, Georgia, Ohio interconnection risk", "idea": "Goldman flags Texas as most immediate: a change of political leadership could delay interconnections and change expectations for wholesale prices and utility investment. Georgia and Ohio are moving toward more scrutiny of large loads. Risk flagged for several power and utility stocks; investors must separate projected demand from deliverable capacity.", "angle": "Power names priced on load growth now carry political duration risk. Vistra, Vertiv and Eaton were hit hardest per TMAD.", "tweetA": "Utilities were priced on a load-growth curve that assumed permits. Texas, Georgia, Ohio all just elected people who campaigned against the load. Demand forecast isn't capacity delivered.", "tweetB": "A data-center pause makes existing interconnect queue positions the scarcest asset in power. If you own a permitted site, today was good. If you own the supply chain for the unpermitted ones, less so.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-power-trade-meets-the-ballot"}, {"id": 11, "cat": "macro", "urgency": "act", "source": "Trading Mindset & Data (TMAD)", "title": "Best S&P day in three months: Dow +3.0%, S&P +1.6%, discretionary +4.3%, call surges across the board", "idea": "Consumer discretionary led at +4.3%, with financials, communications, staples, real estate and healthcare each above +3%. Call open interest surged across strikes and expiries. Levels: SPX resistance 7,724/7,760, support 7,644/7,600; NDX resistance 28,752/29,068, support 28,199/27,961.", "angle": "Breadth plus call chasing is a positioning flag. Useful reference levels for the day.", "tweetA": "Dow +3% on a day S&P gained 1.6%. That's a rotation day dressed as a rally. Calls surging into it means a lot of people got longer into an event that was supposed to be negative.", "tweetB": "Best day in three months, and it was triggered by a result the futures hated. Call volume across the board suggests the chase is on, which is when levels like SPX 7,724 matter.", "charts": {"count": 0, "hot": false, "desc": "Heat maps of strikes/expiries in TMAD app — worth opening"}, "link": "https://www.tmad.news/p/tmad-flow-consumer-staples-and-healthcare"}, {"id": 12, "cat": "energy", "urgency": "act", "source": "Trading Mindset & Data (TMAD)", "title": "Oil -8% on the view that a Democratic Congress ends the Iran war; defense sold on $1.5T budget risk", "idea": "TMAD: oil fell about 8% because traders bet a Democratic Congress will push to end the Iran war, reopening Hormuz shipping. Defense (Lockheed, L3Harris, drones) dropped as the $1.5T defense budget request faces a tougher Congress, though restocking demand remains and LMT is on a bounce watchlist.", "angle": "Oil and defense both priced for peace. HFIR argues this is wrong on Hormuz; defense is the cleaner bounce candidate.", "tweetA": "Oil -8% and defense down on the same thesis: Congress ends the war. Both can't be right. If the war ends, restocking spend stays; if it doesn't, oil bounces. Buy the side of that trade the market's treating as a coin flip.", "tweetB": "$1.5T defense budget request now has to survive a Congress that campaigned on ending a war. I don't think the budget disappears. I think the multiple on it does. $LMT", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.tmad.news/p/tmad-flow-consumer-staples-and-healthcare"}, {"id": 13, "cat": "positioning", "urgency": "act", "source": "Trading Mindset & Data (TMAD)", "title": "Winners of the blue wave: Centene +12.6%, Molina +8.9%, Oscar +8.6%, solar +5.7%, homebuilders +5.4%", "idea": "Managed care led; solar and homebuilders also rallied. Microsoft +6.7% and Amazon +6.1% on slower data-center build thesis. Data center and AI power names (Vistra, Vertiv, Eaton, CoreWeave) hit hardest; AI chips and memory (Nvidia, Micron, SanDisk, Seagate) fell with them. TMAD turns to staples/healthcare long, memory and AI short.", "angle": "A clean map of which stocks trade as a function of Washington. Healthcare policy is the second-biggest mover after AI.", "tweetA": "Centene +12.6%. Solar +5.7%. Homebuilders +5.4%. Microsoft +6.7%. That's the Democratic-Congress basket. Cheaper medical policy risk, cheaper rates, fewer data centers. Check how much of it was just a short squeeze.", "tweetB": "The winners list is a policy map: managed care, solar, housing. The losers list is the entire AI hardware chain. One result, and the AI trade got politically repriced vs. managed care.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.tmad.news/p/tmad-flow-consumer-staples-and-healthcare"}, {"id": 14, "cat": "energy", "urgency": "act", "source": "HFI Research", "title": "HFIR: oil ~18% drawdown in 3 days; the market is wrong that Democrats force Trump to end the war", "idea": "HFIR says he predicted the Democratic sweep but misread the oil implication, and the ~18% drawdown shocked him. His thesis: Iran used Hormuz to raise gasoline and diesel prices and sour voters, and now demands permanent control of the strait. A US retreat would hold the world economically hostage and empower Iran, so a material change in the situation is unlikely. Democratic pressure raises odds of a resolution, but not by much.", "angle": "Contrarian: fade the oil selloff. Ties to TMAD and MacroEdge views on Hormuz.", "tweetA": "18% in three days on the idea that a Democratic House fixes Hormuz. A House can't negotiate with Tehran. It can hold hearings. I'd be asking who in this market thinks Iran gives back the one card it just proved works. $XLE", "tweetB": "Iran's bet was that gasoline prices decide US elections. They just did. Why would Tehran give that up in a deal? That's a pricing question the oil tape isn't asking.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.hfir.com/p/my-thoughts-on-oil-after-the-midterm"}, {"id": 15, "cat": "AI/infra", "urgency": "deep", "source": "MacroEdge Research", "title": "MacroEdge: 'The Electorate Caps the Capex Trade'; all data center bans on the ballot passed", "idea": "MacroEdge's Six: all datacenter bans on the ballot passed, so the marginal driver of growth (datacenter capex) decelerates. With new compute supply throttled, existing supply becomes more valuable, and hyperscalers rallied. Shorting capex beneficiaries after huge drawdowns is ill-advised, but new highs this cycle will be hard.", "angle": "Consensus flipping to 'capex peak' fast. The risk is overextension of the short side.", "tweetA": "Every data center ban on the ballot passed. Capex was the marginal driver of US growth. You can argue about magnitude, but you can't argue the sign changed. The question is whether the semis already priced it.", "tweetB": "Existing compute becomes scarcer, new compute harder to build. That's a case for GPU rental prices rising and for whoever already holds permits. The market is doing the first half of this and ignoring the second.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.macroedge.world/p/strategy-note-the-electorate-caps"}, {"id": 16, "cat": "geopolitics", "urgency": "deep", "source": "MacroEdge Research", "title": "MacroEdge: tariff rollback makes China the biggest beneficiary; 'late phase of China's bust'", "idea": "Six argues Democrats will roll back Trump's trade war as the new Congress takes power, making the counterparties most affected, especially China, the biggest beneficiaries. The newsletter also frames the US shift as part of the 'Project South Africa' thesis about long-term GOP shifts. It describes China's bust as late-phase.", "angle": "Pair with Goldman's China AI dip-buying note. A China upside catalyst from US politics.", "tweetA": "If tariffs get rolled back by a Congress that can't legislate them away over a veto, this is a headline trade rather than a policy trade. China benefits from the headline, not the policy.", "tweetB": "Texas bans data centers. China has power and no election. Tariffs get rolled back. China is the only country in this story with a tailwind from all three.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.macroedge.world/p/strategy-note-the-electorate-caps"}, {"id": 17, "cat": "macro", "urgency": "deep", "source": "MacroEdge Research", "title": "MacroEdge: markets 'dead money in real terms' this year; all eyes on the 200-day; next Fed hike expected in December", "idea": "Don (MacroEdge): the market reaction was technical, off the 200-day moving average. In real terms, markets have been largely dead money this year. As December approaches, the next Fed hike is the expected catalyst. Also doubts the US abandons Hormuz, since it would signal others can dictate terms regionally.", "angle": "A Fed that hikes into a gridlock rally. Conflicts with the 'relief' narrative.", "tweetA": "Equities are a rally into a Fed that is expected to hike in December. Real returns for the year are flat. We're celebrating one number on the roulette wheel. Respect the 200.", "tweetB": "Everybody's trading the election. Nobody's pricing the December hike. Authers says Cook voted for one last month. The relief is political; the discount rate isn't political.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.macroedge.world/p/strategy-note-the-electorate-caps"}, {"id": 18, "cat": "regulation", "urgency": "act", "source": "Michael Parekh / AI Tech Wave (AI-RTZ)", "title": "Texas flipped: ~13GW exposed (GLJ), 12-18 month slip for unpermitted projects; Texas = 41% of 2028 US capacity (SemiAnalysis)", "idea": "Hinojosa beat Abbott, the first Democratic Texas governor since 1990, on an immediate data center moratorium. GLJ: about 13GW of Texas capacity is directly exposed. Projects with power and permits proceed; with power but no state environmental permits slip 12-18 months; with neither move to Louisiana, Oklahoma or nowhere. SemiAnalysis: 41% of new US data center capacity in 2028 is in Texas (Bloomberg says nearly 30%). Axios: nearly two-thirds of 2028 capacity could face delays. Jefferies moves Texas from Tier 3 to Tier 4.", "angle": "Quantifies the supply shock for the 2028 compute curve. Delays more than cancellations.", "tweetA": "13GW of Texas capacity directly exposed, and Texas is 30-41% of 2028 US additions depending on whose number you use. A 12-18 month slip on that isn't a rounding error. It's a 2028 shortage with a bullish price for the GPUs that already exist.", "tweetB": "Everyone is debating if the AI buildout continues. Wrong question. The right one is whose permits are already in hand. Projects with power, permits and steel proceed. The rest is a Louisiana story.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-the-midterms-ai-earthquake-and"}, {"id": 19, "cat": "regulation", "urgency": "act", "source": "Michael Parekh / AI Tech Wave (AI-RTZ)", "title": "41 ballot measures, ~two dozen restricting data centers passed; Ohio 21 measures, 14+ municipalities; Joliet ~80%", "idea": "Out of 41 measures in 10 states, about two dozen restrictive measures passed (WaPo counts at least 29 jurisdictions). Ohio: 21 measures in 18 municipalities, at least 14 passed. Trenton 80-20 against an 18-building AWS campus; Ashville blocked a campus already under construction. Polls: 7 in 10 Americans oppose local data centers, including a majority of Republicans. Local bans rose from about 40 early in the year to over 500 by August. Pro-AI PAC spent $2.54M on Ohio ads without effect.", "angle": "Local zoning is the new binding constraint. Ohio has 125 local moratoriums already.", "tweetA": "Trenton voted 80-20 against an AWS campus. Ashville voted to block one already under construction. Pro-AI PAC spent $2.54M in Ohio and moved nothing. When even sunk costs lose a vote, 'permitted' means less than it did.", "tweetB": "Local bans: ~40 in January, 500+ by August, now winning at the ballot box with 75-80% margins. Underwriting a data center in a township isn't an engineering exercise anymore. It's a campaign.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-the-midterms-ai-earthquake-and"}, {"id": 20, "cat": "regulation", "urgency": "deep", "source": "Michael Parekh / AI Tech Wave (AI-RTZ)", "title": "Crypto and AI's $250M midterm: backed side lost 9 of 12 competitive races; $74.7M on losers vs $28.3M on winners", "idea": "Per Citation Needed: of 12 competitive races called, the side their super PACs backed lost nine. Brown won Ohio Senate despite over $64M of crypto money against him, the most ever against one candidate. a16z founders gave $116M, mostly to Republicans; Brockman and spouse gave $50M, mostly GOP. Safe-race picks went 40 for 40. Republicans who voted in 2025 to pre-empt state AI laws were targeted and lost.", "angle": "Political capital of AI and crypto has a price discovery moment. GENIUS/CLARITY-type crypto legislation faces a different Senate.", "tweetA": "$250M spent. 9 of 12 competitive races lost. 40 for 40 in safe seats, which is the part that gets reported as a win. Crypto's biggest-ever single-candidate spend, $64M against Brown, lost.", "tweetB": "The AI-safety wing and the AI-accelerationist wing both claimed primary wins. In the general, only one of them gained ground. 'Pro data center' is now a liability in a campaign, according to the head of Public First.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-the-midterms-ai-earthquake-and"}, {"id": 21, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI Tech Wave (AI-RTZ)", "title": "SpaceX: 13GW of data center capacity targeted for 2027, ~$50M/MW/yr (4x market), Anthropic 35% of last quarter's revenue", "idea": "Per SemiAnalysis via Parekh: SpaceX raised its 2027 target to about 13GW, with 3.6GW under construction; that's roughly all of Google's data center capacity from 1999-2026 built in a year and a half. SpaceX has sold more than 1GW at near $50M per MW per year, about 4x market rate. Anthropic is 'Customer B', ~35% of SpaceX revenue, up to ~$120B committed through 2029. Musk spent ~$446M on the midterms, with Tesla and SpaceX down ~5% Wednesday. Musk's reply: space data centers look appealing.", "angle": "Scarcity pricing in practice: $50M/MW/yr is the permit premium made visible. Texas ban increases it.", "tweetA": "$50M per megawatt-year, 4x market. That's what a compute shortage looks like when the buyer can't build it. A Texas moratorium doesn't hurt the SpaceX thesis, it justifies the price. Unless Starbase gets permits denied.", "tweetB": "Anthropic is 35% of SpaceX's revenue and has up to $120B committed. A single customer. A single state's politics. Musk spent $446M on an election and lost it, then said space data centers sound good. That's not a joke, it's a hedge.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-the-midterms-ai-earthquake-and"}, {"id": 22, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI Tech Wave (AI-RTZ)", "title": "Stratechery frame: AI's last constraint is political (compute, then memory, then power, then voters)", "idea": "Per Stratechery quoted by Parekh: constraint went compute (ramped), memory (will ramp), power (will be fixed), then political, which may be hardest because it blocks solving the others. Takes: hyperscalers win; neoclouds squeezed between credit and permits; Nvidia short-term loser but efficiency per MW gains; China gains; space data centers look less far-fetched; frontier labs gain from a public pacing the frontier; Apple gains from on-device. Parekh cautions that elections swing, but both parties ran against data centers. Industry adapting: dropping secrecy clauses, rebranding to 'compute campuses'.", "angle": "Framework to hang trades on. Tokens per megawatt is the new unit.", "tweetA": "Compute, then memory, then power, now voters. Every bottleneck in this cycle was supposed to be temporary and then another one showed up. Tokens per megawatt is the only metric that survives all four.", "tweetB": "Citizens opposed the factories moving overseas and had no vote. They have a vote on data centers because it needs permission. The first technology boom where the supply chain ends at a zoning board.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-the-midterms-ai-earthquake-and"}, {"id": 23, "cat": "venture", "urgency": "watch", "source": "TWiST Newsletter", "title": "TWiST roundtable: run AI locally, rent the cloud for spikes; power is already short; 2027 may be the last shot at M&A", "idea": "Takeaways: regardless of data center politics, there isn't enough power for AI compute demand; run most AI on prem and burst to cloud; regulatory review can take up to 18 months so big acquisitions need to be done now; founders now want investors uncapped at a 10-15% discount with no new numbers, which Jason's syndicate won't do. Links: NBC exit poll shows 56% said AI/data centers were major or crucial in their vote.", "angle": "Local inference demand plus Ollama $65M raise (nearing 9M developers) signals an adoption curve.", "tweetA": "Power is short regardless of politics, GPUs scarce, data centers banned. That's the best setup for local inference I've seen. Ollama just raised $65M with nearly 9M developers.", "tweetB": "The M&A window argument is interesting: 18-month regulatory reviews and a 2028 election mean whatever doesn't close in 2027 may not close.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/run-ai-locally-and-rent-the-cloud-b58"}, {"id": 24, "cat": "tech", "urgency": "watch", "source": "TWiST Newsletter", "title": "TWiST links: Marvell to buy Lumentum in $115B deal (headline only); Panthalassa $140M wave-powered compute; Atoms $1.7B; Sequoia restructures", "idea": "Headlines only in the email, not verified by me: Marvell to buy Lumentum ($115B per The Next Web), Panthalassa raises $140M for wave-powered AI compute at sea, Travis Kalanick's Atoms raises $1.7B, Meta launches $115M data center jobs training program, Canva lays off 1,200+, Sequoia 'undoing 20 years of expansion', SEC accredited investor exam, Hyperliquid pre-IPO access, Kalshi perps.", "angle": "Optical and photonics consolidation if real. Check the deal first.", "tweetA": "If Marvell buying Lumentum for $115B is accurate, the optics layer just got priced like a platform. Open the link before trading it.", "tweetB": "Wave-powered compute at sea raised $140M the same week Texas paused data centers. Capital finds the nearest unregulated surface. Next stop: orbit.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/run-ai-locally-and-rent-the-cloud-b58"}, {"id": 25, "cat": "crypto", "urgency": "deep", "source": "Unchained", "title": "Two Prime: private credit seeks distribution onchain; BTC L2 yields (Babylon, Stacks) are VC-funded subsidies", "idea": "Alex Blume (Two Prime) says struggling private credit firms end up seeking onchain distribution, a case of adverse selection, and that Bitcoin L2 yields are VC subsidies. Two Prime gathers wrapped BTC onchain and lends offchain to vetted borrowers; about $4B in Bitcoin-backed loans since 2022. The vault receipt token plugs into Morpho for looping. The SEC innovation exemption leaves much of the value of vaults offshore for now; ICE tokenized equities could change that. Premium content, summary only.", "angle": "Credit plumbing: BTC-collateralized lending now routes through Morpho curation. Adverse selection warning for DeFi credit.", "tweetA": "Two Prime's CEO says the private credit funds coming onchain are the ones struggling offchain. That's a clean adverse-selection warning for anyone chasing vault yields.", "tweetB": "BTC L2 yield is a VC subsidy, per the lender with $4B of BTC-backed loans. When the subsidy stops, the yield goes with it. The 'real yield' in BTC is still the loan book.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/here-s-why-bitcoin-yield-on-l2s-are-drying-up-according-to-two-prime"}, {"id": 26, "cat": "macro", "urgency": "watch", "source": "BowTiedBull", "title": "BowTiedBull: Dems won on war, high oil and middle-class malaise; 'opportunity when people panic'", "idea": "Teaser only: the newsletter says it called a Democratic win on election day because of the war, high oil and general economic malaise for the middle class, and that policies not benefitting the typical person cause voters to punish incumbents. The remainder (AI-trade positioning and AI-generated stock picks) is paywalled.", "angle": "Affordability as the binding political variable. Partial content only.", "tweetA": "Affordability beat ideology this cycle: oil, gasoline, the war. The voters didn't read an AI capex thesis. They read their electric bill.", "tweetB": "The 'AI trade' got repriced by people who've never heard of a GPU, because their power bill went up. That's the whole story.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bowtiedbull.io/p/investing-after-midterms-ai-trade"}];
const META = {"date": "2026-11-05", "time": "09:05 CEST", "windowStart": "2026-11-05 03:05 CEST", "windowEnd": "2026-11-05 09:05 CEST", "emailsInWindow": 11, "emailsRead": 11, "itemsExtracted": 26, "includedSources": ["John Authers / Bloomberg Points of Return (7)", "Stephen Innes / The Dark Side of the Boom (3)", "Trading Mindset & Data (TMAD) (3)", "HFI Research (1)", "MacroEdge Research (3)", "Michael Parekh / AI Tech Wave (AI-RTZ) (5)", "TWiST Newsletter (2)", "Unchained (1)", "BowTiedBull (1)"], "skippedSources": ["None skipped. Notes: BowTiedBull is a paywall teaser (1 item from the visible text); TWiST links are headline-only, flagged as unverified; Unchained is paywalled, summary-only. Charts are not visible in plaintext, so chart counts reflect only what the text references."]};
var COL={macro:"#e24b4a",credit:"#378add",positioning:"#ef9f27","AI/infra":"#1d9e75",crypto:"#7f77dd",geopolitics:"#d85a30",energy:"#f97316",tech:"#06b6d4",gold:"#d4a017",culture:"#ec4899",labor:"#8b5cf6",regulation:"#64748b",science:"#14b8a6",venture:"#84cc16"};
var UE={act:"🔴",deep:"🔵",watch:"🟡"};
var fc="all",fu="all",fs=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function toggle(id){var e=document.getElementById('c'+id);e.className=e.className.indexOf('open')>=0?'card':'card open';}
function setCat(c){fc=c;fs=null;render(false);}
function setUrg(u){fu=u;fs=null;render(false);}
function filterBySrc(name){fs=name;fc="all";fu="all";render(true);}
function pill(label,active,color,fn){return '<span class="pill" style="'+(active?'background:'+color+';border-color:'+color+';color:#fff':'')+'" onclick="'+fn+'">'+label+'</span>';}
function render(expand){
  var cats=[],i;
  for(i=0;i<ITEMS.length;i++){if(cats.indexOf(ITEMS[i].cat)<0)cats.push(ITEMS[i].cat);}
  var h=pill('All ('+ITEMS.length+')',fc==='all','#333',"setCat('all')");
  cats.forEach(function(c){var n=ITEMS.filter(function(x){return x.cat===c}).length;h+=pill(c+' ('+n+')',fc===c,COL[c]||'#333',"setCat('"+c+"')");});
  document.getElementById('cats').innerHTML=h;
  var u='';
  [['all','All'],['act','🔴 Act Now'],['deep','🔵 Deep'],['watch','🟡 Watch']].forEach(function(p){var n=p[0]==='all'?ITEMS.length:ITEMS.filter(function(x){return x.urgency===p[0]}).length;u+=pill(p[1]+' ('+n+')',fu===p[0],'#333',"setUrg('"+p[0]+"')");});
  document.getElementById('urg').innerHTML=u;
  var out='';
  ITEMS.forEach(function(item){
    if(fc!=='all'&&item.cat!==fc)return;
    if(fu!=='all'&&item.urgency!==fu)return;
    if(fs&&item.source.indexOf(fs)<0)return;
    var col=COL[item.cat]||'#333';
    var ch=item.charts.count>0?(item.charts.hot?'🔥':'📊'):'';
    out+='<div class="card'+(expand?' open':'')+'" id="c'+item.id+'"><div class="hd" onclick="toggle('+item.id+')"><span class="num">#'+item.id+'</span><span>'+UE[item.urgency]+'</span><span class="src" style="background:'+col+'">'+esc(item.source)+'</span><span class="tag">'+esc(item.cat)+'</span><span>'+ch+'</span><span class="ttl">'+esc(item.title)+'</span></div><div class="body">'
    +'<div class="lbl">The Idea</div><div>'+esc(item.idea)+'</div>'
    +'<div class="angle" style="border-color:'+col+';background:'+col+'14"><div class="lbl" style="margin-top:0">My Angle</div>'+esc(item.angle)+'</div>'
    +'<div class="tw"><div><div class="lbl" style="color:#378add;margin-top:0">TWEET A</div>'+esc(item.tweetA)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>'
    +'<div><div class="lbl" style="color:#7f77dd;margin-top:0">TWEET B</div>'+esc(item.tweetB)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>'
    +'<div class="chart'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING · ':'')+(item.charts.count>0?item.charts.count+' chart(s): ':'')+esc(item.charts.desc||'No chart noted in text')+'</div>'
    +'<div style="margin-top:8px"><a href="'+item.link+'" target="_blank">↗ Read full article</a></div></div></div>';
  });
  document.getElementById('list').innerHTML=out||'<p>No items.</p>';
}
function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';
  var r='<p>Window: '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.<br>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</p><p><b>Included sources</b> (click to filter):<br>';
  META.includedSources.forEach(function(s){var nm=s.replace(/ \(\d+\)$/,'');r+='<span class="sl" data-n="'+esc(nm)+'" onclick="filterBySrc(this.getAttribute(\'data-n\'))">'+esc(s)+'</span><br>';});
  r+='</p><p><b>Skipped / notes:</b><br>'+META.skippedSources.map(esc).join('<br>')+'</p>';
  document.getElementById('repb').innerHTML=r;
  render(false);
}
init();
