      el.style.borderColor = 'var(--border)';

  ITEMS.forEach(function(item){
    const chartMark = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');
    html += '<div class="card" data-id="' + item.id + '" data-cat="' + item.cat + '" data-urg="' + item.urgency + '" data-src="' + item.source.replace(/"/g,'&quot;') + '">';
    html += '  <div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '    <span class="idx">' + String(item.id).padStart(2,'0') + '</span>';
    html += '    <span class="urg">' + URG_EMOJI[item.urgency] + '</span>';
    html += '    <span class="badge" style="background:var(--' + item.cat + ')">' + item.source + '</span>';
    html += '    <span class="tag">' + CAT_LABEL[item.cat] + '</span>';
    html += chartMark ? '    <span class="chartmark">' + chartMark + '</span>' : '';
    html += '    <span class="card-title">' + item.title + '</span>';
    html += '  </div>';
    html += '  <div class="card-body">';
    html += '    <div class="section"><div class="label">The Idea</div><div class="idea-text">' + item.idea + '</div></div>';
    html += '    <div class="section"><div class="label">My Angle</div><div class="angle-box" style="border-left-color:var(--' + item.cat + ')">' + item.angle + '</div></div>';
    html += '    <div class="tweets">';
    html += '      <div class="tweet a"><div class="twlabel">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '      <div class="tweet b"><div class="twlabel">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '    </div>';
    if(item.charts.count > 0 || item.charts.desc){
      html += '    <div class="chart-box' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.count>0 ? ('📊 ' + item.charts.count + ' chart(s) — ') : '') + item.charts.desc + '</div>';
    }
    html += '    <div class="linkrow"><a href="' + item.link + '" target="_blank">↗ Read full article</a></div>';
    html += '  </div>';
    html += '</div>';
  });
  document.getElementById('cardList').innerHTML = html;
}

function toggleCard(id){
  const card = document.querySelector('.card[data-id="' + id + '"]');
  if(card) card.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function applyFilters(){
  document.querySelectorAll('.card').forEach(function(card){
    const cat = card.getAttribute('data-cat');
    const urg = card.getAttribute('data-urg');
    const src = card.getAttribute('data-src');
    let show = true;
    if(activeCat !== 'all' && cat !== activeCat) show = false;
    if(activeUrg !== 'all' && urg !== activeUrg) show = false;
    if(activeSrc && src.indexOf(activeSrc) === -1) show = false;
    if(show){ card.classList.remove('hidden'); if(activeSrc) card.classList.add('open'); else card.classList.remove('open'); }
    else { card.classList.add('hidden'); }
  });
}

function filterBySrc(name){
  activeCat = 'all';
  activeUrg = 'all';
  activeSrc = name;
  updateActivePills();
  applyFilters();
  window.scrollTo({top: document.getElementById('cardList').offsetTop - 20, behavior:'smooth'});
}

function renderReport(){
  let html = '<div class="section"><div class="label">Time Window</div><div>' + META.windowStart + ' &rarr; ' + META.windowEnd + '</div></div>';
  html += '<div class="section"><div class="label">Totals</div><div>' + META.emailsInWindow + ' emails in window &middot; ' + META.emailsRead + ' read &middot; ' + META.itemsExtracted + ' items extracted</div></div>';
  html += '<div class="section"><div class="label">Included Sources</div><div class="srclist">';
  META.includedSources.forEach(function(s){
    html += '<span class="srcchip" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + ' (' + s.count + ')</span>';
  });
  html += '</div></div>';
  html += '<div class="section"><div class="label">Skipped Sources</div>';
  META.skippedSources.forEach(function(s){
    html += '<div class="skipitem">&mdash; ' + s.name + ': ' + s.reason + '</div>';
  });
  html += '</div>';
  document.getElementById('reportBody').innerHTML = html;
}

document.getElementById('reportToggle').addEventListener('click', function(){
  document.getElementById('reportBox').classList.toggle('open');
});

document.getElementById('metaLine').textContent = META.date + ' &middot; ' + META.time + ' &middot; ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails';
document.getElementById('metaLine').innerHTML = META.date + ' &middot; ' + META.time + ' &middot; ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails (' + META.windowStart.split(' ')[1] + '&ndash;' + META.windowEnd.split(' ')[1] + ' CEST)';

renderFilterBars();
updateActivePills();
renderCards();
renderReport();
</script>
