unication-technology shocks (printing press, newspapers, radio/film, TV, social media) that each fragmented the public sphere and were then re-stabilized by the mature form of the same technology, predicting AI-shaped platforms will build the next framework over a decades-long, likely violent interregnum.", "themes": [{"theme": "Shared fictions as cooperation infrastructure", "insights": [{"claim": "Large-scale human cooperation depends on collective conviction in 'shared fictions' — money, religions, nations — and political crises are best read as the breakdown of those fictions rather than as policy failures.", "speaker": "MACARIO SCHETTINO", "type": "framework", "entities": ["Yuval Noah Harari", "Sapiens"], "conviction": "high", "so_what": "Reframes political risk as belief-system risk: shocks that look economic or electoral may be symptoms of a legitimacy substrate eroding, which mean-reverting macro models will miss.", "quote": "today’s crisis, like others of a similar nature before it, was driven by the breakdown of “shared fictions”", "locator": "At a deeper level, today’s crisis", "quote_verified": true}, {"claim": "Societies specifically organize around 'transcendent beliefs' — faith in something that outlasts individual death — because humans are the only animal that knows it will die and the only one with language complex enough to build permanent collective fictions around that knowledge.", "speaker": "MACARIO SCHETTINO", "type": "framework", "entities": [], "conviction": "high", "so_what": "Supplies the author's core diagnostic: any proposed replacement order that offers no answer to mortality and meaning is structurally unstable regardless of its material performance.", "quote": "We are the only animal that knows it will die, and we are the only animal that has built permanent collective fictions around that knowledge.", "locator": "Societies organize themselves around a specific kind", "quote_verified": true}, {"claim": "The postwar liberal-democratic order is the hardest transcendent frame humans have ever attempted because it offers no comfort — it asks millions of strangers to accept that what unites them is primarily a balance of market prices and votes, with no soul, ancestor or god behind it.", "speaker": "MACARIO SCHETTINO", "type": "contrarian", "entities": [], "conviction": "high", "so_what": "Explains why liberal democracy loses to identity and grievance politics in an attention market: its value proposition is materially strong but emotionally bankrupt, a durable structural disadvantage.", "quote": "It is the hardest transcendent frame humans have ever tried to inhabit, because it offers no comfort.", "locator": "This framework has been brittle from the start", "quote_verified": true}]}, {"theme": "From climate shocks to communication shocks", "insights": [{"claim": "For most of human history the disruptor of belief systems was climate: the end of the last Ice Age produced ancestor worship, the 8.2-ka event produced polytheistic 'small gods' that integrated clans into early cities, and the 4.2-ka event produced moralizing 'Big Gods' that legitimized territorial states and empires.", "speaker": "MACARIO SCHETTINO", "type": "data_point", "entities": ["Younger Dryas", "8.2-ka event", "4.2-ka event", "Near East"], "conviction": "medium", "so_what": "Gives a base-rate framing: belief-system regime changes are rare, exogenously triggered, and each historically enabled a step-change in the scale of cooperation — i.e., in the size of markets.", "quote": "climatic shocks were punctuation marks of cultural evolution that destabilized existing social orders and yielded new transcendent belief systems enabling large-scale cooperation", "locator": "Consider the end of the last Ice Age", "quote_verified": true}, {"claim": "Since the 16th century the engine of belief-system disruption switched from climate to communications technology, because collective fictions are built on language — so every new medium forces a redrawing of the transcendent framework.", "speaker": "MACARIO SCHETTINO", "type": "thesis", "entities": [], "conviction": "high", "so_what": "The central causal claim: media-platform transitions are the leading indicator of political-order transitions, making communications tech a macro variable rather than a sector.", "quote": "Because our collective fictions are built on language, new communications technologies imply the need for new fictions.", "locator": "Again and again, climatic shocks were punctuation marks", "quote_verified": true}, {"claim": "Since the printing press, each successive transcendent framework has recentered on the individual rather than the collective — citizenry, nation, class — a directional drift rather than a random walk.", "speaker": "MACARIO SCHETTINO", "type": "framework", "entities": ["Martin Luther"], "conviction": "medium", "so_what": "Implies the next framework will also be more granular and individualized, not a return to tribal or national aggregates — a bearish read on national-revival political projects.", "quote": null, "locator": "Each new medium has forced a redrawing", "quote_verified": false}, {"claim": "The printing press caused the first communication-driven order change: Luther's 1517 '95 Theses' were translated and mass-reproduced so hundreds of thousands of pamphlets spread across northern Europe within a generation, faster than the Church could respond.", "speaker": "MACARIO SCHETTINO", "type": "data_point", "entities": ["Martin Luther", "95 Theses", "Roman Catholic Church", "Protestant Reformation", "northern Europe"], "conviction": "high", "so_what": "The template for viral-distribution asymmetry: incumbents lose because response latency exceeds diffusion speed — the same mechanism now facing legacy institutions.", "quote": "hundreds of thousands of pamphlets had spread Luther’s arguments across northern Europe faster than the Church could respond", "locator": "In 1517, the printing press changed everything", "quote_verified": true}, {"claim": "Belief-system transitions have historically been catastrophically violent: the religious tensions unleashed by printed Lutheran ideas laid the foundations for the Thirty Years' War, in which roughly a third of Central Europe's population died.", "speaker": "MACARIO SCHETTINO", "type": "data_point", "entities": ["Thirty Years' War", "Central Europe"], "conviction": "high", "so_what": "Sets the tail-risk distribution for the current transition — the author explicitly treats mass violence as within the historical range of outcomes, not an outlier.", "quote": "Roughly a third of the population of Central Europe died in the war.", "locator": "Not only did the disruptive force change", "quote_verified": true}, {"claim": "The 18th-century newspaper-and-coffee-house layer let untrained publics follow arguments in real time, and the 1755 Lisbon earthquake became a public test — divine punishment versus natural disaster — of which transcendent frame would hold, with the Enlightenment emerging as the answer.", "speaker": "MACARIO SCHETTINO", "type": "anecdote", "entities": ["Lisbon earthquake", "Enlightenment", "American Revolution", "French Revolution"], "conviction": "high", "so_what": "Shows how a single salient disaster can act as the forcing event that resolves a contested interpretive regime — worth watching for the modern analogue.", "quote": "the explanations on offer — divine punishment versus natural disaster — became a public test of which transcendent frame would hold", "locator": "The second communication-driven shift", "quote_verified": true}, {"claim": "Radio and film enabled totalitarianism's specific signature — the manufactured national emotion — because mass media made it possible for one voice to reach millions, running from 'The Birth of a Nation' (1915) through Mussolini's and Hitler's radio speeches to Riefenstahl's and Eisenstein's propaganda films.", "speaker": "MACARIO SCHETTINO", "type": "causal", "entities": ["The Birth of a Nation", "Mussolini", "Hitler", "Leni Riefenstahl", "Sergei Eisenstein"], "conviction": "high", "so_what": "Establishes the author's mapping of media architecture to political form — one-to-many centralization yields authoritarianism, which matters for how AI-mediated distribution is regulated.", "quote": "Mass media made it possible for one voice to reach millions, which in turn made possible totalitarianism’s specific signature: the manufactured national emotion.", "locator": "The citizen-centered framework stabilized around 1815", "quote_verified": true}]}, {"theme": "The 2006-2011 rupture of broadcast democracy", "insights": [{"claim": "Postwar liberal democracy was a television format: a person on a screen reached millions with a handful of simple ideas — employment, wages, taxes, the security state — which parties packaged as platforms and sold at elections, producing the citizen as consumer of national policy choices.", "speaker": "MACARIO SCHETTINO", "type": "framework", "entities": [], "conviction": "high", "so_what": "If the party-platform model was a broadcast artifact, its decay is structural and permanent — political forecasting built on party identity and platform coherence is losing predictive power.", "quote": "This was the system of postwar liberal democracy: the citizen as consumer of national policy choices.", "locator": "After the Second World War, television produced", "quote_verified": true}, {"claim": "The postwar system began dissolving in 2006 with modern social media platforms, accelerated in 2007 with the smartphone, and ruptured between 2008 and 2011 with the Great Recession — a specific, datable technological rather than economic origin for the crisis.", "speaker": "MACARIO SCHETTINO", "type": "causal", "entities": ["Great Recession", "smartphone", "social media"], "conviction": "high", "so_what": "Dates the regime break to platform launch, not to the financial crisis; implies fiscal or monetary fixes cannot restore political stability because the transmission channel is attention, not income.", "quote": "That system began to dissolve in 2006 with the launch of the modern social media platforms, accelerated in 2007 with the smartphone and ruptured between 2008 and 2011 with the Great Recession.", "locator": "That system began to dissolve in 2006", "quote_verified": true}, {"claim": "Television concentrated influence among a select few voices while social media re-fragmented it among hundreds of millions, so simple national ideas can no longer hold attention against a feed of identity, grievance, conspiracy and culture war.", "speaker": "MACARIO SCHETTINO", "type": "causal", "entities": ["social media", "television"], "conviction": "high", "so_what": "Attention economics, not ideology, is the binding constraint on governability — a durable headwind for any policy agenda requiring sustained mass consent.", "quote": "The shared room of broadcast television became the shouting market of the social network.", "locator": "Television had concentrated influence", "quote_verified": true}]}, {"theme": "Munich February 2025 as the visible rupture", "insights": [{"claim": "At the Munich Security Conference on Feb. 14, 2025, JD Vance told European leaders their gravest threat came from within — governments distrusting their own people, courts overturning elections, retreating free speech — and said the U.S. could not defend a civilization that no longer recognized itself.", "speaker": "MACARIO SCHETTINO", "type": "anecdote", "entities": ["JD Vance", "Munich Security Conference", "Europe", "United States"], "conviction": "high", "so_what": "The author treats this as the dateable public break in the transatlantic security fiction — a marker for repricing European defense autonomy and alliance-dependent assets.", "quote": "The United States, he said, could not be expected to defend a civilization that no longer recognized itself.", "locator": "That was when, at the Munich Security Conference", "quote_verified": true}, {"claim": "Hours after Vance, Marco Rubio declared the postwar order over and what comes next transactional and multipolar, and Friedrich Merz — days from becoming German chancellor — responded that Europe could no longer count on Washington, with European editorial pages reaching for the word 'betrayal'.", "speaker": "MACARIO SCHETTINO", "type": "data_point", "entities": ["Marco Rubio", "Friedrich Merz", "Washington", "Europe", "Germany"], "conviction": "high", "so_what": "Documents the elite-level consensus break in real time; the transactional/multipolar framing is the operating assumption to price into trade, defense and alliance exposure.", "quote": "The postwar order was over; what came next would be transactional and multipolar.", "locator": "Hours later, Secretary of State Marco Rubio", "quote_verified": true}, {"claim": "The belief Vance broke with was the American-built postwar conception of universal citizenship — that rights precede states, that liberal democracy is the only legitimate political form, and that the West is the community holding those convictions in common — a fiction that let 300 million Americans, half a billion Europeans and billions more cooperate as trading partners and allies.", "speaker": "MACARIO SCHETTINO", "type": "thesis", "entities": ["JD Vance", "United States", "Europe", "the West"], "conviction": "high", "so_what": "Ties the belief system directly to the scale of the trading bloc: if the fiction fails, the cooperation scale it underwrote — global supply chains, alliance security guarantees — contracts with it.", "quote": "It is a transcendent frame in the truest sense: a fiction that lets us cooperate beyond our biological limits.", "locator": "In Munich last year, the transcendent belief", "quote_verified": true}, {"claim": "Munich in February 2025 was the moment the restorationist response stopped being an American domestic matter and became a threat to the architecture of the West itself.", "speaker": "MACARIO SCHETTINO", "type": "thesis", "entities": ["Munich", "the West", "United States"], "conviction": "high", "so_what": "Signals that U.S. domestic populism has become an exportable systemic risk to the international order, not a contained electoral cycle.", "quote": "Munich, in February 2025, was the moment the restorationist response stopped being an American domestic matter and became a threat to the architecture of the West itself.", "locator": "In the 20th century, proponents of restorationism", "quote_verified": true}]}, {"theme": "Two off-ramps: restorationism vs. utopianism", "insights": [{"claim": "Contemporary right-wing populism is structurally restorationist — the same impulse as the ancien régime against the French Revolution, Spanish Carlism and 19th-century clerical-monarchical movements — with MAGA imagining a return to a pre-globalist, more religious, more racially homogeneous nation and European populists from Orbán to Le Pen drawing on related ideas.", "speaker": "MACARIO SCHETTINO", "type": "framework", "entities": ["MAGA", "Viktor Orbán", "Marine Le Pen", "Hungary", "France", "ancien régime"], "conviction": "high", "so_what": "Classifies scattered populist movements as one recurring type with a known historical failure mode, which helps forecast their trajectory rather than treating each as sui generis.", "quote": "Structurally, all are attempts to bring back the god of the tribe.", "locator": "Maybe because of this uncomfortable truth", "quote_verified": true}, {"claim": "The progressive identitarian project that spread through Western universities and institutions over the last decade is a descendant of Jacobinism and Marxism-Leninism — a sacred theory of history, an enlightened vanguard, a project of remaking institutions, and a moral charge against those who resist.", "speaker": "MACARIO SCHETTINO", "type": "contrarian", "entities": ["Jacobinism", "Marxism-Leninism", "Western universities"], "conviction": "high", "so_what": "Symmetric indictment of both political poles as backward-looking; useful for reading institutional culture conflicts as structurally equivalent to populism rather than its antidote.", "quote": "a sacred theory of history (oppression, intersection, liberation), an enlightened vanguard, a project of remaking institutions to align with the theory, and a moral charge against those who resist", "locator": "The second off-ramp is utopian", "quote_verified": true}, {"claim": "In the 20th century restorationism and utopianism — fascism and communism — fought each other for control of states; in the 21st century they fight for control of cultures inside states, so the conflict is no longer over the means of production but over the production of meaning.", "speaker": "MACARIO SCHETTINO", "type": "thesis", "entities": ["fascism", "communism"], "conviction": "high", "so_what": "Predicts that the contested battleground is institutions, media and platforms rather than territory or industry — locating the risk in cultural infrastructure and content governance.", "quote": "The conflict is no longer over the means of production; it is over the production of meaning.", "locator": "In the 20th century, proponents of restorationism", "quote_verified": true}, {"claim": "Both off-ramps are anachronisms that reach for yesterday's gods, and neither can answer the real problem — the absence of a stable transcendent framework for 8.3 billion people networked through algorithms, a frame that does not yet exist.", "speaker": "MACARIO SCHETTINO", "type": "contrarian", "entities": [], "conviction": "high", "so_what": "Implies no currently-available political program resolves the instability, so investors should assume prolonged political volatility regardless of which side wins elections.", "quote": "What neither side will admit is that both off-ramps are anachronisms. Both reach for yesterday’s gods.", "locator": "What neither side will admit", "quote_verified": true}]}, {"theme": "The interregnum: duration and ind frustrating or untenable.", "speaker": "MACARIO SCHETTINO", "type": "prediction", "entities": [], "conviction": "medium", "so_what": "Generational adoption, not policy design, is the resolution mechanism — a reason to weight cohort behavior on platforms over elite discourse when forecasting long-run political norms.", "quote": "people who are growing up inside the new technologies and who will accept as self-evident conditions that we find frustrating or even untenable", "locator": "The new transcendent fiction will likely be assembled", "quote_verified": true}]}, {"theme": "AI as the taming technology and hyper-democracy", "insights": [{"claim": "Every previous communication-driven disruption was eventually tamed by the same technology that caused it — the press that broke Christendom produced the Enlightenment, the revolutionary newspaper matured into the daily companion of stable 1815-1914 citizen-democracy, and interwar propaganda media matured into the calmer broadcast television conversation of the postwar order.", "speaker": "MACARIO SCHETTINO", "type": "framework", "entities": ["printing press", "Enlightenment", "Christendom"], "conviction": "high", "so_what": "The author's most investable pattern: expect the stabilizing solution to come from within the disruptive technology stack, not from regulation that suppresses it.", "quote": "In each case, what initially fragmented the public sphere is what, in its maturer form, eventually rebuilt it.", "locator": "There is a pattern here that may give us a reason for hope", "quote_verified": true}, {"claim": "If the pattern holds, the social media disruption will be resolved not by abandoning social media but by its next iteration as shaped by artificial intelligence — AI could deepen the chaos but is also the most plausible candidate to eventually tame the disorder.", "speaker": "MACARIO SCHETTINO", "type": "prediction", "entities": ["artificial intelligence", "social media"], "conviction": "medium", "so_what": "Frames AI-native social platforms as the structurally important category for the next order — and implies attempts to fix politics by restricting platforms are fighting the wrong battle.", "quote": "The new transcendent framework, whatever its content, will not arrive in spite of these technologies. It will arrive through them.", "locator": "If the pattern holds, the disruption caused by social media", "quote_verified": true}, {"claim": "We are currently in the chaotic phase that corresponds historically to the Wars of Religion or to the demagogue's radio — that is, the destructive early stage of the media cycle, not the stabilizing mature stage.", "speaker": "MACARIO SCHETTINO", "type": "thesis", "entities": ["Wars of Religion"], "conviction": "high", "so_what": "Positions the present at the maximum-turbulence point of the analogy, implying conditions get worse before the maturation phase begins.", "quote": "We are still inside the chaotic phase, the phase that corresponds historically to the Wars of Religion or to the demagogue’s radio.", "locator": "If the pattern holds, the disruption caused by social media", "quote_verified": true}, {"claim": "Social media plus AI open the possibility of hyper-democracy: a platform connecting every person to relevant issues through information, discussion and voting, with AI coordinating inputs from billions of people and translating them into options, goals and strategies to be voted on, shaping policy by influencing Congressional action.", "speaker": "MACARIO SCHETTINO", "type": "prediction", "entities": ["artificial intelligence", "Congress", "social media"], "conviction": "medium", "so_what": "A concrete, buildable product thesis — AI-mediated mass deliberation infrastructure — that would be the civic-tech category to watch if the pattern-based prediction is right.", "quote": "The enormous potential of AI to coordinate inputs from billions of people, then translate them into options, goals and strategies to be voted upon … cannot be overestimated.", "locator": "Social media and AI offer the possibility", "quote_verified": true}, {"claim": "The main risk to a hyper-democratic platform is capture — some group controlling it, exactly as happened with which books could be published, which news reached print and, notoriously, the control of mass media.", "speaker": "MACARIO SCHETTINO", "type": "causal", "entities": ["mass media"], "conviction": "medium", "so_what": "Names platform-control concentration as the central governance risk of the next order, which is where regulatory and political conflict should be expected to concentrate.", "quote": "As always, there is the risk of some group controlling the platform", "locator": "As always, there is the risk", "quote_verified": true}, {"claim": "Across the last 500 years all three communications transformations initially created enormous chaos and expectations of doom yet each ended in a more democratic world — the printing press yielding freedoms of religion, expression and organization; newspapers spreading Liberalism across Europe; mass media enabling Mussolini, Hitler and Stalin but afterward expanding democracy.", "speaker": "MACARIO SCHETTINO", "type": "thesis", "entities": ["printing press", "Mussolini", "Hitler", "Stalin", "Europe"], "conviction": "medium", "so_what": "The bullish long-arc case: extreme near-term political disorder has historically been compatible with an ultimately wider franchise — an argument against permanently derating democratic systems.", "quote": "mass media permitted the ascent of autocrats like Mussolini, Hitler and Stalin, but afterward, expanded democracy", "locator": "Over the last 500 years, three great transformations", "quote_verified": true}]}], "insight_total": 30, "top_entities": ["JD Vance", "Munich Security Conference", "Marco Rubio", "Friedrich Merz", "Yuval Noah Harari", "Martin Luther", "MAGA", "Viktor Orbán", "Marine Le Pen", "social media", "artificial intelligence", "printing press"], "source_meta": {"author": "MACARIO SCHETTINO", "word_count": 2944, "paywalled": false}}, {"record_id": "c34e38aac6466a1a", "source_type": "concepts", "source_name": "NY Fed — Liberty Street Economics", "source_url": "https://libertystreeteconomics.newyorkfed.org/2026/07/stablecoins-and-noncrypto-shocks-a-2026-update/", "title": "Stablecoins and (Non)Crypto Shocks: A 2026 Update - Liberty Street Economics", "published_date": "2026-07-31", "language": "en", "processed_at": "2026-07-31T14:09:10Z", "processor": "claude-code-sub-opus", "tags": ["Crypto", "Macro", "Positioning"], "gist": "U.S. dollar stablecoin market cap has grown 30 percent to about $308 billion since April 2025, alongside the July 2025 GENIUS Act. Using the March 2023 SVB failure as a case study, Fed researchers show that a non-crypto shock permanently rewired USDC's reserve book: the Circle Reserve Fund cut weighted average maturity below the 5th percentile of Treasury-only money funds, pushed repo from zero to over 90 percent (now 69 percent) of net assets with 77 percent of that in FICC-sponsored repo by 2025:Q4, and shifted bank cash to over 90 percent at GSIBs. The net effect is a deliberate swap of interest-rate risk for counterparty risk at one of the largest stablecoin issuers.", "themes": [{"theme": "Post-GENIUS Act stablecoin growth and concentration", "insights": [{"claim": "U.S. dollar stablecoin market capitalization rose by $71 billion, or 30 percent, between April 2025 and mid-2026, reaching roughly $308 billion.", "speaker": "Kenechukwu Anadu, Pablo D. Azar, Sean Baker, Marco Cipriani, Thomas M. Eisenbach, Mattia Landoni, Gabriele La Spada, Marco Machiavelli, and J. Christina Wang", "type": "data_point", "entities": ["stablecoins", "U.S. dollar", "CoinGecko"], "conviction": "high", "so_what": "A $308 billion pool whose reserves sit mostly in T-bills and repo is now a non-trivial marginal buyer of front-end Treasuries; track monthly market cap as a bill-demand and repo-supply indicator.", "quote": "the market capitalization of U.S. dollar stablecoins has increased by $71 billion (30 percent) to about $308 billion recently", "locator": "Recent Growth of Stablecoins", "quote_verified": true}, {"claim": "The growth spurt in dollar stablecoins coincided with the passage of the GENIUS Act in July 2025, which established the first federal regulatory framework for payment stablecoins in the United States.", "speaker": "Kenechukwu Anadu, Pablo D. Azar, Sean Baker, Marco Cipriani, Thomas M. Eisenbach, Mattia Landoni, Gabriele La Spada, Marco Machiavelli, and J. Christina Wang", "type": "causal", "entities": ["GENIUS Act", "stablecoins"], "conviction": "medium", "so_what": "Regulatory legitimation, not crypto price action, appears to be the current growth driver — implying continued issuance even in flat crypto tape, and upside for regulated issuers versus offshore ones.", "quote": "This period coincides with the passage of the GENIUS Act in July 2025, which established the first federal regulatory framework for payment stablecoins.", "locator": "Recent Growth of Stablecoins", "quote_verified": true}, {"claim": "The stablecoin industry remains highly concentrated, with Tether (USDT) and USD Coin (USDC) together accounting for over 80 percent of industry assets.", "speaker": "Kenechukwu Anadu, Pablo D. Azar, Sean Baker, Marco Cipriani, Thomas M. Eisenbach, Mattia Landoni, Gabriele La Spada, Marco Machiavelli, and J. Christina Wang", "type": "data_point", "entities": ["Tether", "USDT", "USDC", "Circle"], "conviction": "high", "so_what": "Duopoly structure means a single issuer's reserve reallocation is macro-relevant for bill and repo markets; idiosyncratic issuer news is effectively systemic news.", "quote": "the two largest issuers, Tether (USDT) and USDC, accounting for over 80 percent of industry assets", "locator": "The stablecoin industry remains highly concentrated", "quote_verified": true}]}, {"theme": "Divergent reserve quality between the two dominant issuers", "insights": [{"claim": "As of December 2025, corporate bonds, gold bars, Bitcoin, secured loans, and 'other investments' made up nearly 24 percent of Tether's attested reserves, whereas USD Coin's attested reserves consist primarily of cash and short-term U.S. government securities.", "speaker": "Kenechukwu Anadu, Pablo D. Azar, Sean Baker, Marco Cipriani, Thomas M. Eisenbach, Mattia Landoni, Gabriele La Spada, Marco Machiavelli, and J. Christina Wang", "type": "data_point", "entities": ["Tether", "USDT", "USDC", "Circle", "Bitcoin", "gold"], "conviction": "high", "so_what": "Nearly a quarter of the largest stablecoin's backing is in credit, commodity, and crypto assets — a mark-to-market gap that converts a risk-asset drawdown into peg risk; monitor attestations as a tail-risk gauge for crypto-market liquidity.", "quote": "corporate bonds, gold bars, Bitcoin, secured loans, and “other investments” accounted for nearly 24 percent of USDT’s attested reserves as of December 2025", "locator": "The reserve composition of these stablecoins differs significantly", "quote_verified": true}, {"claim": "Reserve backing for the largest stablecoins is known only through issuer attestations and voluntary disclosures rather than standardized regulatory reporting, so analysis of stablecoin plumbing depends on data the issuers choose to publish.", "speaker": "Kenechukwu Anadu, Pablo D. Azar, Sean Baker, Marco Cipriani, Thomas M. Eisenbach, Mattia Landoni, Gabriele La Spada, Marco Machiavelli, and J. Christina Wang", "type": "framework", "entities": ["Circle", "Tether", "USDC"], "conviction": "medium", "so_what": "Disclosure quality is itself a differentiator: an issuer whose reserves are visible through an SEC-registered money fund is analyzable, one whose reserves are attested is not — price that opacity premium.", "quote": "Sources: Circle’s voluntary disclosures; authors’ calculations.", "locator": "Sources: Circle’s voluntary disclosures", "quote_verified": true}]}, {"theme": "The SVB shock as a template for non-crypto contagion into stablecoins", "insights": [{"claim": "On March 11, 2023, Circle disclosed that roughly 8 percent of USD Coin's reserves were held at Silicon Valley Bank, which had entered FDIC receivership the day before, and the token's secondary market price then fell considerably below $1.00 with notable net outflows.", "speaker": "Kenechukwu Anadu, Pablo D. Azar, Sean Baker, Marco Cipriani, Thomas M. Eisenbach, Mattia Landoni, Gabriele La Spada, Marco Machiavelli, and J. Christina Wang", "type": "data_point", "entities": ["Circle", "USDC", "Silicon Valley Bank", "FDIC"], "conviction": "high", "so_what": "An 8 percent reserve exposure was enough to break the peg — the depeg threshold is far below full loss, so even modest single-counterparty concentration is tradable event risk.", "quote": "approximately 8 percent of USDC’s reserves were held at SVB, which had been placed into FDIC receivership the previous day.", "locator": "On March 11, 2023, Circle reported", "quote_verified": true}, {"claim": "Shocks originating entirely outside the crypto industry, such as a regional bank failure, can move net flows into stablecoins and permanently reshape the composition of their reserve assets — a channel distinct from the crypto price shocks studied previously.", "speaker": "Kenechukwu Anadu, Pablo D. Azar, Sean Baker, Marco Cipriani, Thomas M. Eisenbach, Mattia Landoni, Gabriele La Spada, Marco Machiavelli, and J. Christina Wang", "type": "framework", "entities": ["stablecoins", "Silicon Valley Bank"], "conviction": "high", "so_what": "Stablecoin risk models keyed only to Bitcoin drawdowns miss the banking-sector transmission channel; add bank-credit stress indicators to any stablecoin exposure monitor.", "quote": "how do non-crypto shocks affect net flows into stablecoins and the composition of their reserve assets?", "locator": "Reserve-Asset Composition and External Shocks", "quote_verified": true}, {"claim": "The Circle Reserve Fund, a money market mutual fund whose shares can be purchased only by Circle, accounted for approximately 86 percent of USD Coin's reserve assets as of March 2026, with the remaining non-fund reserves averaging about 12 percent of total reserves since the start of 2023.", "speaker": "Kenechukwu Anadu, Pablo D. Azar, Sean Baker, Marco Cipriani, Thomas M. Eisenbach, Mattia Landoni, Gabriele La Spada, Marco Machiavelli, and J. Christina Wang", "type": "data_point", "entities": ["Circle Reserve Fund", "Circle", "USDC", "money market mutual fund"], "conviction": "high", "so_what": "Because 86 percent of the reserve sits in a single dedicated MMF with public holdings data, its portfolio filings are a near-real-time window into stablecoin demand for bills and repo.", "quote": "The CRF accounts for approximately 86 percent of USDC’s reserve assets as of March 2026.", "locator": "the composition of the Circle Reserve Fund (CRF)", "quote_verified": true}]}, {"theme": "Duration risk cut: weighted average maturity collapse", "insights": [{"claim": "Before Silicon Valley Bank's collapse the Circle Reserve Fund's weighted average maturity exceeded that of the median U.S. Treasury-only money market fund; afterward it fell below the median and has since remained below the 5th percentile of the Treasury-only fund WAM distribution.", "speaker": "Kenechukwu Anadu, Pablo D. Azar, Sean Baker, Marco Cipriani, Thomas M. Eisenbach, Mattia Landoni, Gabriele La Spada, Marco Machiavelli, and J. Christina Wang", "type": "data_point", "entities": ["Circle Reserve Fund", "Treasury-Only MMF", "Silicon Valley Bank", "iMoneyNet"], "conviction": "high", "so_what": "The largest transparent stablecoin reserve now runs shorter duration than 95 percent of Treasury-only money funds — stablecoin growth therefore buys the very front end, not the belly of the bill curve.", "quote": "Following SVB’s failure, the CRF’s WAM fell below that of the median TO fund and has remained below the 5th percentile of the WAM distribution of TO MMFs.", "locator": "The chart below reports the weighted average maturity", "quote_verified": true}, {"claim": "The maturity shortening at the Circle Reserve Fund has persisted for more than three years after the triggering event, indicating a permanent regime change in reserve management rather than a temporary defensive crouch.", "speaker": "Kenechukwu Anadu, Pablo D. Azar, Sean Baker, Marco Cipriani, Thomas M. Eisenbach, Mattia Landoni, Gabriele La Spada, Marco Machiavelli, and J. Christina Wang", "type": "thesis", "entities": ["Circle Reserve Fund", "Treasury-Only MMF"], "conviction": "high", "so_what": "Do not model stablecoin reserve behavior as mean-reverting after stress; the post-shock configuration is the new baseline, which structurally caps stablecoin demand for longer bills.", "quote": "has remained below the 5th percentile of the WAM distribution of TO MMFs", "locator": "Thus, following SVB’s failure, the CRF reduced", "quote_verified": true}]}, {"theme": "Repo migration and the FICC-sponsored hedge fund channel", "insights": [{"claim": "After Silicon Valley Bank's collapse, the Circle Reserve Fund's repurchase agreement holdings spiked from zero to over 90 percent of net assets and, after retreating, still stand at 69 percent — above the range observed across Treasury-only money market funds.", "speaker": "Kenechukwu Anadu, Pablo D. Azar, Sean Baker, Marco Cipriani, Thomas M. Eisenbach, Mattia Landoni, Gabriele La Spada, Marco Machiavelli, and J. Christina Wang", "type": "data_point", "entities": ["Circle Reserve Fund", "repurchase agreements", "Treasury-Only MMF"], "conviction": "high", "so_what": "Stablecoin reserves have become a large, price-insensitive cash lender in repo; a redemption wave would withdraw repo funding rather than sell bills, making SOFR and repo spreads the transmission channel to watch.", "quote": "the CRF’s holdings of repurchase agreements (repos) spiked from zero to over 90 percent of its net assets. This share has since retreated some but still stands at 69 percent", "locator": "Turning to portfolio composition", "quote_verified": true}, {"claim": "Starting in late 2024 the Circle Reserve Fund rapidly shifted its repo book toward Fixed Income Clearing Corporation-sponsored repo, which reached 77 percent of its repo holdings by 2025:Q4.", "speaker": "Kenechukwu Anadu, Pablo D. Azar, Sean Baker, Marco Cipriani, Thomas M. Eisenbach, Mattia Landoni, Gabriele La Spada, Marco Machiavelli, and J. Christina Wang", "type": "data_point", "entities": ["Circle Reserve Fund", "FICC", "Fixed Income Clearing Corporation", "Crane data"], "conviction": "high", "so_what": "Stablecoin cash is now a significant funding source for the sponsored repo complex; watch FICC sponsored volumes alongside stablecoin market cap as a joint leverage indicator.", "quote": "The share of Fixed Income Clearing Corporation (FICC)-sponsored repos, whose ultimate counterparties are generally entities with a net demand for funding, such as hedge funds, grew rapidly and reached 77 percent by 2025:Q4", "locator": "Examining the CRF’s repo counterparty composition", "quote_verified": true}, {"claim": "The ultimate counterparties of FICC-sponsored repo are generally entities with a net demand for funding, such as hedge funds, meaning stablecoin reserves are indirectly financing leveraged Treasury market participants.", "speaker": "Kenechukwu Anadu, Pablo D. Azar, Sean Baker, Marco Cipriani, Thomas M. Eisenbach, Mattia Landoni, Gabriele La Spada, Marco Machiavelli, and J. Christina Wang", "type": "causal", "entities": ["FICC", "hedge funds", "Circle Reserve Fund", "Treasury market"], "conviction": "medium", "so_what": "This creates a direct crypto-to-basis-trade linkage: a stablecoin redemption run could pull funding from hedge fund Treasury positions, a second-order channel for Treasury market dysfunction.", "quote": "whose ultimate counterparties are generally entities with a net demand for funding, such as hedge funds", "locator": "Examining the CRF’s repo counterparty composition", "quote_verified": true}]}, {"theme": "Bank deposit flight to GSIBs", "insights": [{"claim": "The fraction of USD Coin's reserves held as bank deposits rose briefly after Silicon Valley Bank's failure but has since remained below the levels that prevailed before the failure.", "speaker": "Kenechukwu Anadu, Pablo D. Azar, Sean Baker, Marco Cipriani, Thomas M. Eisenbach, Mattia Landoni, Gabriele La Spada, Marco Machiavelli, and J. Christina Wang", "type": "data_point", "entities": ["USDC", "Circle", "bank deposits", "Silicon Valley Bank"], "conviction": "high", "so_what": "Stablecoin growth converts less of its inflow into bank deposits than it once did, so issuer expansion increasingly bypasses bank balance sheets and lands in market-based funding instead.", "quote": "USDC’s bank deposits rose briefly after SVB’s failure but have since remained below the levels that prevailed before SVB’s failure.", "locator": "Next, we turn to USDC’s reserve assets held outside of the CRF", "quote_verified": true}, {"claim": "USD Coin's cash holdings shifted from a mix of global systemically important banks and non-GSIBs including Silicon Valley Bank and Signature Bank in February 2023 to predominantly GSIBs by April 2023, with Circle reporting in excess of 90 percent of cash held at GSIBs, and that concentration has persisted.", "speaker": "Kenechukwu Anadu, Pablo D. Azar, Sean Baker, Marco Cipriani, Thomas M. Eisenbach, Mattia Landoni, Gabriele La Spada, Marco Machiavelli, and J. Christina Wang", "type": "data_point", "entities": ["USDC", "Circle", "GSIBs", "Silicon Valley Bank", "Signature Bank"], "conviction": "high", "so_what": "Regional banks lost stablecoin deposit franchises permanently within two months; deposit-franchise value from crypto-adjacent flows now accrues almost entirely to the largest banks.", "quote": "with Circle reporting “in excess of 90% of cash” held at GSIBs", "locator": "Also, the types of banks holding USDC’s cash changed markedly", "quote_verified": true}]}, {"theme": "Risk transformation and TradFi interconnectedness", "insights": [{"claim": "The overall effect of the Silicon Valley Bank event was to change the type of risk held by one of the largest stablecoin issuers, moving it away from interest-rate risk and toward counterparty risk rather than reducing risk overall.", "speaker": "Kenechukwu Anadu, Pablo D. Azar, Sean Baker, Marco Cipriani, Thomas M. Eisenbach, Mattia Landoni, Gabriele La Spada, Marco Machiavelli, and J. Christina Wang", "type": "thesis", "entities": ["USDC", "Circle", "Silicon Valley Bank", "Circle Reserve Fund"], "conviction": "high", "so_what": "A reserve book that looks safer on duration metrics is more exposed to counterparty and clearing-node failure; stress-test stablecoins against a repo-counterparty or CCP event, not just a rate shock.", "quote": "the SVB event triggered a change in the type of risk held by one of the largest stablecoin issuers, away from interest-rate risk and toward counterparty risk", "locator": "Summing Up", "quote_verified": true}, {"claim": "These reserve-composition shifts highlight the growing interconnectedness between traditional finance and new, emerging financial technologies, making stablecoins a two-way transmission channel rather than a self-contained crypto phenomenon.", "speaker": "Kenechukwu Anadu, Pablo D. Azar, Sean Baker, Marco Cipriani, Thomas M. Eisenbach, Mattia Landoni, Gabriele La Spada, Marco Machiavelli, and J. Christina Wang", "type": "thesis", "entities": ["stablecoins", "traditional finance", "Federal Reserve Bank of New York"], "conviction": "high", "so_what": "Fed researchers framing stablecoins as systemically interconnected is a leading indicator of tighter reserve-composition rules under the new federal framework — regulatory risk for issuers with non-cash reserves.", "quote": "These changes highlight the growing interconnectedness between tra ome targets of protest and legal action.", "locator": "At the center of AI apocalypticism, Eliezer Yudkowsky warns", "quote_verified": true}]}, {"theme": "The frontier model as a manufactured regulatory category", "insights": [{"claim": "The term 'frontier model' crystallized from a loose descriptor for cutting-edge systems into a formal regulatory category around 2023, when labs and governments began treating certain highly capable systems as requiring special oversight.", "speaker": "Stephanie Wakefield", "type": "framework", "entities": ["frontier model"], "conviction": "high", "so_what": "Capability classifications are constructed, not natural; whoever writes the threshold definition controls which competitors incur oversight cost and which do not.", "quote": "What began as a comparative technical designation now names the leading edge of capability while recoding it as a safety object.", "locator": "Frontier Model Versus Safe Operating Space", "quote_verified": true}, {"claim": "The paper 'Frontier AI Regulation: Managing Emerging Risks to Public Safety' defined frontier AI as highly capable foundation models that could possess dangerous capabilities sufficient to pose severe risks to public safety, and in the same month Anthropic, Google, Microsoft, and OpenAI launched the Frontier Model Forum.", "speaker": "Stephanie Wakefield", "type": "data_point", "entities": ["Frontier Model Forum", "Anthropic", "Google", "Microsoft", "OpenAI"], "conviction": "high", "so_what": "The definitional infrastructure of AI regulation was authored by the four incumbents it governs; expect rules that entrench them.", "quote": "“highly capable foundation models that could possess dangerous capabilities sufficient to pose severe risks to public safety.”", "locator": "In July, the influential paper “Frontier AI Regulation", "quote_verified": true}, {"claim": "The Frontier Model Forum's operative definition of a frontier model is one that outperforms, on conventional benchmarks or hig e image of standing at the edge of Victoria Falls, established the template of a fence placed upstream of a threshold that AI safety now reproduces.", "speaker": "Stephanie Wakefield", "type": "framework", "entities": ["Johan Rockström", "Victoria Falls", "planetary boundaries"], "conviction": "high", "so_what": "The 'safe operating space' logic always fences well short of the actual limit; expect AI capability caps set conservatively below any demonstrated harm level.", "quote": "Comparing humanity’s proximity to Earth-system thresholds to a man standing at the edge of Victoria Falls, Rockström warned in a 2010 TED Talk: “you don’t want to stand there!”", "locator": "At the global scale, Earth system scientist Johan Rockström", "quote_verified": true}, {"claim": "Resilience, developed by ecologist C.S. Holling in the 1970s, originally treated instability, thresholds, and state shifts as endemic to complex adaptive systems, and only later mutated into a governance doctrine of change prevention and permanent control.", "speaker": "Stephanie Wakefield", "type": "framework", "entities": ["C.S. Holling", "resilience", "cybernetics"], "conviction": "high", "so_what": "The intellectual history shows that safety frameworks drift from adaptation toward stasis once money and institutions attach; anticipate the same drift in AI alignment vocabulary.", "quote": "Holling’s concept was not initially a doctrine of change prevention or permanent control.", "locator": "Upstream of safe operating space, the cybernetic concept of resilience", "quote_verified": true}, {"claim": "By the 1990s and 2000s resilience had become the keyword organizing billions of dollars in grants, design projects, and philanthropy, through vehicles including the Rockefeller Foundation's Rebuild by Design and 100 Resilient Cities.", "speaker": "Stephanie Wakefield", "type": "data_point", "entities": ["Rockefeller Foundation", "Rebuild by Design", "100 Resilient Cities"], "conviction": "high", "so_what": "Pr ie Wakefield", "type": "framework", "entities": ["frontier"], "conviction": "high", "so_what": "Core investment thesis: returns concentrate where novelty is generated, and fencing the edge destroys the option value rather than merely delaying it.", "quote": "If thresholds and frontiers are “danger zones,” it is because they are where mutation, acceleration, selection, recombination, and innovation happen.", "locator": "If thresholds and frontiers are “danger zones”", "quote_verified": true}, {"claim": "The American frontier was not outside the state but ahead of it, advancing through federal enablement that Brian Balogh called 'government out of sight' via public land systems, canals, railroads, land grants, army campaigns, schools, and churches.", "speaker": "Stephanie Wakefield", "type": "framework", "entities": ["Brian Balogh", "American frontier"], "conviction": "high", "so_what": "Model for AI industrial policy: heavy state material support (power, compute, land) with light on-the-ground administration, rather than dense permissioning.", "quote": "It was not so much outside the state as it was ahead of it.", "locator": "The American frontier was an advancing edge", "quote_verified": true}, {"claim": "In Frederick Jackson Turner's Frontier Thesis, Eastern governments, coastal elites, statesmen, and religious and educational institutions repeatedly tried to limit, compact, and domesticate the Western frontier and consistently failed against the demands of the frontiersmen.", "speaker": "Stephanie Wakefield", "type": "causal", "entities": ["Frederick Jackson Turner"], "conviction": "high", "so_what": "Historical base rate suggests attempts to administratively contain a frontier lose to demand-side pressure; bet on diffusion outrunning restriction over long horizons.", "quote": "“The jealousy and the fears of the East were powerless in the face of the demands of the frontiersmen.”", "locator": "In the now-famous Frontier Thesis of Frederick Jackson Turner", "quote_verified": true}, {"claim": "Since December 2025 Claude Code has felt to many like first contact with an alien intelligence or a new operating space, and has already produced its own cultural atmosphere and aesthetics.", "speaker": "Stephanie Wakefield", "type": "anecdote", "entities": ["Claude Code", "Anthropic"], "conviction": "medium", "so_what": "Developer-tool adoption is generating native culture, which historically precedes durable platform lock-in; watch whether that culture stays on one vendor.", "quote": "Since December 2025, Claude Code has felt, for many, like first contact, whether with alien intelligence or a new operating space.", "locator": "Since December 2025, Claude Code has felt", "quote_verified": true}, {"claim": "Every technological inflection produces both new modes of perception and conservative reaction, exemplified historically by mobs storming the premiere of L'Age d'Or and the Motion Picture Production Code legislating whole pre-Code film forms out of existence, and today by Anthropic's Fable guardrails going up mid-project and online mobs shaming AI-using artists like Bjork.", "speaker": "Stephanie Wakefield", "type": "causal", "entities": ["Anthropic", "Fable", "Björk", "Motion Picture Production Code", "L’Âge d’Or"], "conviction": "high", "so_what": "Guardrail changes shipped mid-project are a product-reliability risk for anyone building on a single lab's models; the Hays Code precedent shows restriction can eliminate entire form factors permanently.", "quote": "Today we see Anthropic’s Fable guardrails going up mid-project, complete with Claude’s refusal and attendant safety lecture over basic topics such as biology", "locator": "Every major technological inflection produces not only new machines", "quote_verified": true}, {"claim": "Guardrails do not merely slow the emergence of new aesthetic and technical forms; they can preclude those forms entirely, because new forms arise only from direct contact with the new medium.", "speaker": "Stephanie Wakefield", "type": "thesis", "entities": ["guardrails"], "conviction": "high", "so_what": "Argues restriction has non-recoverable costs rather than deferred ones, which raises the strategic value of unrestricted or open-weight model access.", "quote": "Guardrails do not just slow this process down but can preclude it.", "locator": "We inhabit an age saturated with potential", "quote_verified": true}]}, {"theme": "Open experimentation versus closed corporate service: the American stake", "insights": [{"claim": "The decisive open question is whether frontier capability becomes a closed corporate service or a distributed American technical culture capable of producing a 21st-century renaissance.", "speaker": "Stephanie Wakefield", "type": "thesis", "entities": ["frontier capability", "OpenClaw"], "conviction": "high", "so_what": "This is the central bifurcation for AI market structure: oligopoly API rents versus a broad tooling and hardware ecosystem; position differently under each branch.", "quote": "Will frontier capability become a closed corporate service or a distributed American technical culture capable of producing a 21st-century renaissance?", "locator": "The kid in a Nebraska garage tinkering", "quote_verified": true}, {"claim": "The ultimate apocalypse threatening America is not climate crisis or AI-driven extinction but the loss of the frontier, and worse still would be losing it and encountering it again as spectacle performed back at America by a rival.", "speaker": "Stephanie Wakefield", "type": "contrarian", "entities": ["America"], "conviction": "high", "so_what": "Frames self-imposed restriction as the primary geopolitical risk, implying relative advantage shifts to jurisdictions that decline to fence their edge.", "quote": "The ultimate apocalypse that threatens America is not climate crisis or AI-driven extinction but the loss of the frontier.", "locator": "The ultimate apocalypse that threatens America", "quote_verified": true}, {"claim": "The U.S. AI Action Plan's vision of accelerating and preserving the edge while allowing open source freedom to unfurl represents an attempt to hold together national coordination and autonomy, material support and open experimentation, security and freedom.", "speaker": "Stephanie Wakefield", "type": "framework", "entities": ["U.S. AI Action Plan", "open source"], "conviction": "medium", "so_what": "U.S. policy is currently tilted toward acceleration plus open weights; that stance is the key variable for open-model ecosystems and would reprice sharply if it reverses after another breach.", "quote": null, "locator": "AI reopens this polar tension", "quote_verified": false}, {"claim": "The cyberpunk backlash to Anthropic's restricted release of Mythos gave concrete form to a revived American demand for freedom to experiment outside a heavily restricted, micromanaging administrative grid.", "speaker": "Stephanie Wakefield", "type": "data_point", "entities": ["Anthropic", "Mythos"], "conviction": "medium", "so_what": "User backlash against restricted releases is a real commercial signal; restricted launches can cede developer mindshare to less-restricted competitors.", "quote": "The cyberpunk backlash to Anthropic’s restricted release of Mythos gives this tension a concrete form", "locator": "The cyberpunk backlash to Anthropic’s restricted release", "quote_verified": true}, {"claim": "Climate apocalypticism was displaced anxiety about cyberneticization projected onto the biosphere, and AI now redirects that anxiety toward its actual referent, meaning the temptation to impose closure is stronger and its cost far higher than in the 2010s.", "speaker": "Stephanie Wakefield", "type": "causal", "entities": ["Anthropocene", "Singularity"], "conviction": "high", "so_what": "Predicts AI backlash will be more intense than climate backlash was, so budget for a heavier and faster-moving regulatory and cultural fight.", "quote": "The temptation to impose closure is now stronger, and its cost far higher.", "locator": "As the 2010s lost decade recedes", "quote_verified": true}, {"claim": "There is a brief opening, described by Demis Hassabis as a 'precious window,' in which positions scramble before codes solidify and experimentation remains possible before premature guardrails and rigid twentieth-century ideologies of human and machine close the space down.", "speaker": "Stephanie Wakefield", "type": "prediction", "entities": ["Demis Hassabis"], "conviction": "high", "so_what": "Implies a time-limited arbitrage: capability access and permissible experimentation are likely at their most open right now and narrowing.", "quote": "There is a brief opening, a “precious window,” as Demis Hassabis called it, where experimentation is possible, and the future remains undiscovered.", "locator": "At such moments, positions scramble before codes solidify", "quote_verified": true}]}], "insight_total": 32, "top_entities": ["Anthropic", "OpenAI", "Frontier Model Forum", "Claude Code", "Sam Altman", "Eliezer Yudkowsky", "Johan Rockström", "Bruno Latour", "Frederick Jackson Turner", "Demis Hassabis", "U.S. AI Action Plan", "Hugging Face"], "source_meta": {"author": "Stephanie Wakefield", "word_count": 3431, "paywalled": false}}, {"record_id": "1e14e10b400d7ca9", "source_type": "concepts", "source_name": "Peterson Institute (PIIE)", "source_url": "https://www.piie.com/blogs/realtime-economics/2026/optimal-tariffs-are-far-optimal-part-1", "title": "“Optimal tariffs” are far from optimal: Part 1", "published_date": "2026-07-30", "language": "en", "processed_at": "2026-07-31T12:15:00Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Geopolitics"], "gist": "Two PIIE economists dismantle the Trump administration's \"optimal tariff\" justification, arguing US terms of trade have not improved since 2025 and that US consumers and firms bear nearly the full tariff cost. They argue corporate tax reform would raise roughly $4 trillion over 2030-2039 (about twice the Trump tariff regime's projected revenue) while shifting more burden onto foreigners, who own 42 percent of US corporate equity.", "themes": [{"theme": "Why the optimal-tariff argument fails in practice", "insights": [{"claim": "The 'optimal tariff' argument holds that a large country can raise national welfare by using tariffs to cut import demand and expand domestic supply, thereby driving down the world price of its imports and improving its terms of trade — but this theoretical result does not survive contact with the real world.", "speaker": "Kimberly Clausing, Maurice Obstfeld", "type": "framework", "entities": ["Stephen Miran", "Donald Trump"], "conviction": "high", "so_what": "The intellectual foundation for continued US tariff escalation is weaker than officials claim; expect the policy to be defended on political rather than economic grounds and to be vulnerable to reversal.", "quote": "the \"optimal tariff\" maximizes national welfare by enabling large countries to improve their terms of trade", "locator": "Problems with the \"optimal tariff\"", "quote_verified": true}, {"claim": "Not every large country can pursue an optimal-tariff strategy simultaneously: the relative price effects cancel out, leaving only universal distortions and no gains from trade.", "speaker": "Kimberly Clausing, Maurice Obstfeld", "type": "causal", "entities": ["Dani Rodrik"], "conviction": "high", "so_what": "As more countries copy US tariff tactics, the global outcome is pure deadweight loss — a structural drag on world trade volumes rather than a zero-sum transfer.", "quote": "the relative price effects would cancel out, leaving only universal distortions with no gains from trade", "locator": "However, there are multiple serious, even fatal, problems", "quote_verified": true}, {"claim": "Tariff-driven beggar-thy-neighbor dynamics worsened the Great Depression, and preventing a repeat was a crucial motive behind the design of the postwar world trading system.", "speaker": "Kimberly Clausing, Maurice Obstfeld", "type": "causal", "entities": ["Great Depression", "World War II"], "conviction": "high", "so_what": "Historical precedent argues the tail risk from broad tariff escalation is a systemic contraction in trade, not a manageable revenue trade-off.", "quote": "preventing a repeat was a crucial motive behind the design of the world trading system", "locator": "Indeed, the foolishness of these sorts of tariffs", "quote_verified": true}, {"claim": "In the textbook optimal-tariff decomposition, the government revenue effect is generally the largest of the three welfare channels, so moderate and declining US tariff revenue is itself direct evidence that the optimal-tariff case is failing.", "speaker": "Kimberly Clausing, Maurice Obstfeld", "type": "framework", "entities": ["United States"], "conviction": "high", "so_what": "Tariff receipts are the cleanest single indicator to monitor: falling revenue simultaneously undercuts the fiscal and the welfare case for the policy.", "quote": "Because the largest of these effects is generally the government revenue effect, the fact that US tariff revenue has been moderate and declining is another indication of the limits of the optimal tariff argument.", "locator": "6. In the textbook analysis of an optimal tariff", "quote_verified": true}]}, {"theme": "Retaliation and trade diversion erode US terms of trade", "insights": [{"claim": "China successfully pursued tit-for-tat retaliation against US tariffs, including export controls, until the US backed down; Canada, Brazil, and the EU also mounted episodes of retaliation.", "speaker": "Kimberly Clausing, Maurice Obstfeld", "type": "data_point", "entities": ["China", "Canada", "Brazil", "European Union", "United States"], "conviction": "high", "so_what": "Export controls are the demonstrated effective counter-lever; sectors dependent on Chinese-controlled inputs carry asymmetric policy risk.", "quote": "with the notable exception of China, which successfully pursued a tit-for-tat retaliation (including export controls) until the US backed down", "locator": "A possible response would be that the US has not experienced", "quote_verified": true}, {"claim": "Even without explicit retaliation, foreign governments degrade US terms of trade by rearranging trade relationships — the EU struck new trade agreements with India and Mercosur, and Canada has sought to expand trade with China and others in the wake of US trade policy shifts.", "speaker": "Kimberly Clausing, Maurice Obstfeld", "type": "causal", "entities": ["European Union", "India", "Mercosur", "Canada", "China"], "conviction": "high", "so_what": "The durable damage is quiet market-access diversion away from US exporters; watch EU-India and EU-Mercosur implementation as a leading indicator of US export share loss.", "quote": "These sorts of policy changes also drive down demand for US exports, harming the US terms of trade.", "locator": "However, it is not just explicit retaliation", "quote_verified": true}, {"claim": "Export controls or export taxes can worsen a target country's terms of trade by making its import goods more expensive or harder to acquire — a symmetric weapon to tariffs.", "speaker": "Kimberly Clausing, Maurice Obstfeld", "type": "framework", "entities": ["United States", "China"], "conviction": "medium", "so_what": "Terms-of-trade warfare is not limited to import duties; supply-chain chokepoint exposure deserves the same risk weighting as tariff exposure.", "quote": "Export controls or export taxes can also worsen the target countries' terms of trade, by making their import goods more expensive and/or difficult to acquire.", "locator": "3. Export controls or export taxes", "quote_verified": true}]}, {"theme": "The empirical record: no terms-of-trade gain, full domestic pass-through", "insights": [{"claim": "Through the first quarter of 2026, aggregate US terms-of-trade data showed little improvement despite Trump raising tariffs on almost all imports beginning in early 2025.", "speaker": "Kimberly Clausing, Maurice Obstfeld", "type": "data_point", "entities": ["United States", "Donald Trump"], "conviction": "high", "so_what": "The core empirical promise of the tariff program has not materialized after roughly 18 months — a falsification investors can track in published terms-of-trade series.", "quote": "Until the second quarter of 2026, the data indicated little improvement in the aggregate US terms of trade after Trump began his second term in early 2025 and increased tariffs on almost all imports", "locator": "Until the second quarter of 2026, the data indicated", "quote_verified": true}, {"claim": "The very recent US terms-of-trade improvement is more plausibly attributable to wartime disruptions than to tariffs, and far larger terms-of-trade movements occurred in the wake of COVID-19.", "speaker": "Kimberly Clausing, Maurice Obstfeld", "type": "contrarian", "entities": ["United States", "COVID-19"], "conviction": "medium", "so_what": "Do not read the recent print as tariff validation; the confound is a wartime shock, so the improvement should reverse when that disruption fades.", "quote": "the very recent US terms of trade improvement is more plausibly related to wartime disruptions than to tariffs, which have fluctuated considerably", "locator": "Multiple factors besides tariffs", "quote_verified": true}, {"claim": "A preponderance of high-quality research finds US consumers and firms are paying nearly the full cost of US tariffs, meaning America has limited ability to shift net tax burdens onto foreigners through tariffs.", "speaker": "Kimberly Clausing, Maurice Obstfeld", "type": "thesis", "entities": ["United States"], "conviction": "high", "so_what": "Model tariffs as a domestic consumption tax hitting US corporate margins and household real income, not as a foreign-funded revenue windfall.", "quote": "A preponderance of high-quality research studies shows that US consumers and firms are paying nearly the full cost of US tariffs", "locator": "More detailed econometric studies fail to reveal", "quote_verified": true}, {"claim": "More detailed econometric studies fail to reveal any major effect of tariffs on the terms of trade.", "speaker": "Kimberly Clausing, Maurice Obstfeld", "type": "data_point", "entities": ["United States"], "conviction": "high", "so_what": "The pass-through-to-foreigners assumption embedded in official revenue forecasts is not empirically supported, implying downside risk to those forecasts.", "quote": null, "locator": "More detailed econometric studies fail to reveal", "quote_verified": false}]}, {"theme": "Tariff revenue fragility and legal risk", "insights": [{"claim": "US tariff revenues turned negative in June 2026 for the first time, as government refunds of the 'reciprocal' tariffs deemed illegal by the Supreme Court exceeded new tariff collections.", "speaker": "Kimberly Clausing, Maurice Obstfeld", "type": "data_point", "entities": ["Supreme Court", "Donald Trump", "United States"], "conviction": "high", "so_what": "A concrete fiscal hole and a refund windfall for importers — screen for companies with large accrued tariff payments eligible for recovery.", "quote": "Tariff revenues even turned negative in June 2026 for the first time as government refunds of Trump's so-called reciprocal tariffs—deemed illegal by the Supreme Court—exceeded new tariff revenues", "locator": "And revenues from the Trump tariffs are also highly uncertain", "quote_verified": true}, {"claim": "Revenues from the Trump tariffs are highly uncertain because of persistent legal challenges to the tariff regimes.", "speaker": "Kimberly Clausing, Maurice Obstfeld", "type": "prediction", "entities": ["Donald Trump", "United States"], "conviction": "high", "so_what": "Tariff-linked fiscal projections carry unusual variance; litigation outcomes are a discrete catalyst for both the deficit path and importer cash flows.", "quote": null, "locator": "And revenues from the Trump tariffs are also highly uncertain", "quote_verified": false}, {"claim": "Latest estimates imply the Trump tariff regime raises about half (or perhaps less) of the roughly $4 trillion that a package of corporate tax reforms is projected to raise over the coming decade.", "speaker": "Kimberly Clausing, Maurice Obstfeld", "type": "data_point", "entities": ["Budget Lab", "Penn-Wharton Budget Model", "Donald Trump"], "conviction": "high", "so_what": "If the fiscal rationale is the binding constraint, corporate tax increases are the natural substitute — a tail risk for US corporate earnings if tariffs are struck down.", "quote": "The latest estimates of the Trump tariff regime imply revenues of about half that (or perhaps less) over the coming decade", "locator": "Corporate tax reform can also raise a lot of revenue", "quote_verified": true}]}, {"theme": "Corporate tax reform as the superior instrument", "insights": [{"claim": "Foreigners hold 42 percent of US corporate equity (2022 data, direct and indirect holdings), so the corporate income tax shifts tax burden onto foreigners far more effectively than tariffs do.", "speaker": "Kimberly Clausing, Maurice Obstfeld", "type": "data_point", "entities": ["United States", "Rosenthal and Mucciolo"], "conviction": "high", "so_what": "The strongest policy substitute for tariffs falls directly on equity holders — a direct valuation risk to US-listed corporates held by global investors.", "quote": "The corporate income tax can do that very well, since 42 percent of US corporate equity is held by foreigners", "locator": "There are better tax instruments", "quote_verified": true}, {"claim": "The Penn-Wharton Budget Model estimates the Clausing (2026) package of corporate tax reforms would raise $4 trillion over 2030-2039, about 0.9 percent of GDP.", "speaker": "Kimberly Clausing, Maurice Obstfeld", "type": "data_point", "entities": ["Penn-Wharton Budget Model", "Kimberly Clausing"], "conviction": "high", "so_what": "A quantified, scored alternative revenue plan already exists — raising the probability it becomes the policy of a future administration.", "quote": "raises $4 trillion over 2030-2039, or about 0.9 percent of GDP", "locator": "Corporate tax reform can also raise a lot of revenue", "quote_verified": true}, {"claim": "The US corporate tax system contains a large tax preference for foreign income relative to domestic income, so low-tax destinations attract a great deal of the US multinational corporate tax base — making corporate tax reform a better answer to offshoring than tariffs.", "speaker": "Kimberly Clausing, Maurice Obstfeld", "type": "thesis", "entities": ["United States", "Kimberly Clausing"], "conviction": "high", "so_what": "Multinationals with heavy low-tax-jurisdiction income booking face the concentrated downside if this reform path is adopted.", "quote": "The US corporate tax system includes a large tax preference for foreign income relative to domestic income.", "locator": "At the same time, corporate tax reform can be a better response", "quote_verified": true}, {"claim": "Tariffs shift resources toward sectors where the US lacks a comparative advantage while introducing new distortions that hurt consumers.", "speaker": "Kimberly Clausing, Maurice Obstfeld", "type": "causal", "entities": ["United States"], "conviction": "high", "so_what": "Capacity built behind tariff walls in non-comparative-advantage sectors is stranded-asset risk if the tariff regime is unwound by courts or a new administration.", "quote": "tariffs introduce new distortions that hurt consumers and shift resources toward sectors where the US lacks a comparative advantage", "locator": "In contrast, tariffs introduce new distortions", "quote_verified": true}, {"claim": "Corporate taxes are among the most progressive US tax instruments beyond the estate tax, whereas tariffs are regressive, taking more from lower-income households as a share of income than from well-off households.", "speaker": "Kimberly Clausing, Maurice Obstfeld", "type": "thesis", "entities": ["United States"], "conviction": "high", "so_what": "The distributional politics of tariffs are a persistent vulnerability — expect low-income consumer spending pressure and eventual political backlash.", "quote": null, "locator": "A final consideration is having a tax system", "quote_verified": false}, {"claim": "Beyond corporate taxes, individual tax reforms or new instruments such as a carbon tax could replace tariff revenue more efficiently, given that the tariff regime burdens consumers and businesses, generates large distortions, harms international relations, and provides rampant opportunities for corruption and rent-seeking.", "speaker": "Kimberly Clausing, Maurice Obstfeld", "type": "thesis", "entities": ["United States"], "conviction": "medium", "so_what": "Carbon tax optionality re-enters the US fiscal conversation as a tariff replacement — relevant to energy-intensive sectors and carbon-pricing exposure.", "quote": "provides rampant opportunities for corruption and rent-seeking", "locator": "Moreover, corporate taxes are far from the only tax", "quote_verified": true}]}], "insight_total": 20, "top_entities": ["Donald Trump", "Stephen Miran", "Scott Bessent", "China", "EU", "Canada", "Supreme Court", "Penn-Wharton Budget Model", "Budget Lab", "Mercosur", "Kimberly Clausing", "Maurice Obstfeld"], "source_meta": {"author": "Kimberly Clausing,Maurice Obstfeld", "word_count": 1642, "paywalled": false}}, {"record_id": "f6ef37ea6a200223", "source_type": "concepts", "source_name": "St. Louis Fed — FRED Blog", "source_url": "https://fredblog.stlouisfed.org/2026/07/the-oldest-us-data-series-in-fred/", "title": "The oldest US data series in FRED", "published_date": "", "language": "en", "processed_at": "2026-07-31T14:11:53Z", "processor": "claude-code-sub-opus", "tags": ["Macro"], "gist": "The oldest US data series in FRED is federal public expenditures on public works, starting in 1791, while the oldest series overall is UK population data going back to 1086 (the next 41 oldest are also UK). The US series is dominated by the WWI military spending surge, is in unadjusted current prices with no price index old enough to deflate it, and was reconstructed retrospectively in 1920 with loose definitions.", "themes": [{"theme": "Oldest series available in FRED", "insights": [{"claim": "The oldest data series in FRED is population data for the United Kingdom dating back to 1086, and the next 41 oldest series are also from the United Kingdom.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["FRED", "United Kingdom"], "conviction": "high", "so_what": "For anyone needing multi-century macro history, the deepest FRED coverage is UK, not US — start there when building very long-run baselines.", "quote": "the oldest series in FRED is population data for the United Kingdom, dating back to 1086!", "locator": "FRED has not only current data series", "quote_verified": true}, {"claim": "The oldest United States series in FRED is federal public expenditures for public works, with observations going as far back as 1791, and a couple of other public-expenditure categories also start in 1791.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["FRED", "United States", "federal public expenditures", "public works"], "conviction": "high", "so_what": "1791 is the practical floor for US fiscal time series in FRED — anything claiming deeper US history is coming from outside this dataset.", "quote": "Our FRED graph above shows data on federal public expenditures, specifically for public works, that go as far back as 1791.", "locator": "Our FRED graph above shows data", "quote_verified": true}, {"claim": "FRED's full catalog can be re-sorted by observation start date: from the Categories page choose \"All Series,\" then switch \"Sort by Popularity\" to \"Sort by Obs Start\" to surface the longest-history series.", "speaker": "St. Louis Fed — FRED Blog", "type": "framework", "entities": ["FRED"], "conviction": "high", "so_what": "A reusable discovery recipe for finding the longest-running series in any category instead of only the most popular ones.", "quote": "change “Sort by Popularity” on the right side of the listing to “Sort by Obs Start.”", "locator": "How this graph was created", "quote_verified": true}]}, {"theme": "What the 1791+ US expenditure series actually shows", "insights": [{"claim": "The chart of US federal public expenditures since 1791 is visually dominated by the huge increase in military expenditures that came with World War I.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["WWI", "military expenditures", "United States"], "conviction": "high", "so_what": "Wartime spikes swamp everything else in nominal long-run fiscal series — rescale or log-transform before reading peacetime trends.", "quote": "The graph is dominated by the huge increase in military expenditures that came with WWI.", "locator": "The graph is dominated by the huge increase", "quote_verified": true}, {"claim": "A small bump in the US federal expenditure data in 1904 corresponds to the purchase of the Panama Canal and surrounding land: $40 million paid to France and $10 million to Panama.", "speaker": "St. Louis Fed — FRED Blog", "type": "anecdote", "entities": ["Panama Canal", "France", "Panama", "United States"], "conviction": "high", "so_what": "Individual one-off asset purchases are large enough to move the whole series in this era — treat single-year moves as event-driven, not trend.", "quote": "the little bump in 1904 corresponds to the purchase of the Panama Canal and land around it: $40 million to France and $10 million to Panama.", "locator": "For example, the little bump in 1904", "quote_verified": true}]}, {"theme": "Caveats on using very old data", "insights": [{"claim": "The 1791-onward US federal expenditure data are in current prices — prices at the time, not inflation-adjusted — and no price series exists that is old enough to deflate them.", "speaker": "St. Louis Fed — FRED Blog", "type": "causal", "entities": ["FRED", "United States"], "conviction": "high", "so_what": "Real-terms comparisons across this history are impossible within FRED; any nominal-vs-nominal comparison across centuries is misleading.", "quote": "the data are calculated in current prices—that is, prices at the time, which have not been adjusted for inflation. And there’s no price series that is old enough to help reconcile this issue.", "locator": "Note that the data are calculated in current prices", "quote_verified": true}, {"claim": "The oldest US expenditure data were computed retrospectively in 1920, so collection practices were not up to modern standards and some liberties appear to have been taken with the definitions of the data.", "speaker": "St. Louis Fed — FRED Blog", "type": "contrarian", "entities": ["United States", "federal public expenditures"], "conviction": "medium", "so_what": "Treat pre-1920 US fiscal history as a retrospective reconstruction with definitional drift — usable for narrative, weak as a precise quantitative benchmark.", "quote": "the data were computed retrospectively in 1920, which means that the data collection practices used were obviously not up to modern standards. In fact, it seems some liberties were taken with the definitions of the data.", "locator": "Indeed, the data were computed retrospectively", "quote_verified": true}]}], "insight_total": 7, "top_entities": ["FRED", "United Kingdom", "United States", "federal public expenditures", "public works", "WWI", "military expenditures", "Panama Canal", "France", "Panama", "Christian Zimmermann"], "source_meta": {"author": "", "word_count": 300, "paywalled": false}}, {"record_id": "6de261edc51d8e70", "source_type": "concepts", "source_name": "Works in Progress", "source_url": "https://worksinprogress.co/issue/beauty-in-my-backyard/", "title": "Beauty In My Backyard - Works in Progress Magazine", "published_date": "2026-07-29", "language": "en", "processed_at": "2026-07-31T14:12:03Z", "processor": "claude-code-sub-opus", "tags": ["Society", "Macro", "Positioning"], "gist": "Architectural ugliness is not what drives local (NIMBY) opposition to housing — restrictive zoning arrived in the 1890s-1920s, a generation before modernism — but it did create a mass constituency of distant, casually motivated 'NITBYs' who powered the 1960s-70s heritage conservation movement. Because historic stock is concentrated in the most economically valuable city centers, conservation now freezes redevelopment exactly where land is most valuable, pushing density to peripheral sites like La Défense and producing 'L transect' skylines in the New World.", "themes": [{"theme": "NIMBY vs NITBY: a new taxonomy of development opposition", "insights": [{"claim": "Opposition to development splits into two distinct constituencies: 'NIMBYs' who live near a scheme and object on grounds of disruption, green space, services and social exclusivity, and 'NITBYs' ('Not in that backyard') who live nowhere near it and object because they judge it makes the country uglier.", "speaker": "WorksInProgMag", "type": "framework", "entities": ["NIMBY", "NITBY"], "conviction": "high", "so_what": "Political risk models for housing projects should be split by constituency: sweeteners that pacify neighbors (compensation, infrastructure) do nothing against NITBYs, who are only moved by design quality.", "quote": "The first group are often called ‘NIMBYs’, for ‘Not in my backyard’. Let us call the second group ‘NITBYs’, for ‘Not in that backyard’.", "locator": "Western countries used to let landowners build", "quote_verified": true}, {"claim": "Most distant opponents of development are only casually interested and altruistically motivated, asking merely whether a scheme is a cursory objective improvement to its neighborhood — yet this diffuse, low-intensity support aggrega
