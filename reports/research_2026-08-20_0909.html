<script>
(function(){
  const ITEMS = JSON.parse(document.getElementById('items-data').textContent);
  const META = JSON.parse(document.getElementById('meta-data').textContent);

  const CAT_COLORS = {
    macro:"#e24b4a", credit:"#378add", positioning:"#ef9f27", "AI/infra":"#1d9e75",
    crypto:"#7f77dd", geopolitics:"#d85a30", energy:"#f97316", tech:"#06b6d4",
    gold:"#d4a017", culture:"#ec4899", labor:"#8b5cf6", regulation:"#64748b",
    science:"#14b8a6", venture:"#84cc16"
  };
  const URG_EMOJI = { act:"🔴", deep:"🔵", watch:"🟡" };
  const URG_LABEL = { act:"Act Now", deep:"Deep", watch:"Watch" };

  let activeCat = "all";
  let activeUrg = "all";
  let activeSrc = null;

  function catColor(cat){ return CAT_COLORS[cat] || "#8a847d"; }

  function renderHeader(){
    document.getElementById('header-meta').textContent =
      META.date + " · " + META.time + " · " + META.itemsExtracted + " items from " +
      META.includedSources.length + " sources (window: " + META.windowStart + " → " + META.windowEnd + ")";
  }

  function renderFilters(){
    const catCounts = {};
    ITEMS.forEach(i => { catCounts[i.cat] = (catCounts[i.cat]||0)+1; });
    const catWrap = document.getElementById('cat-filters');
    catWrap.innerHTML = "";
    const allPill = document.createElement('div');
    allPill.className = 'pill' + (activeCat === 'all' ? ' active' : '');
    allPill.style.background = activeCat === 'all' ? '#1c1a17' : '';
    allPill.textContent = 'All (' + ITEMS.length + ')';
    allPill.onclick = function(){ activeCat = 'all'; activeSrc = null; renderAll(); };
    catWrap.appendChild(allPill);
    Object.keys(catCounts).sort().forEach(function(cat){
      const p = document.createElement('div');
      p.className = 'pill' + (activeCat === cat ? ' active' : '');
      if(activeCat === cat){ p.style.background = catColor(cat); }
      p.textContent = cat + ' (' + catCounts[cat] + ')';
      p.onclick = function(){ activeCat = cat; activeSrc = null; renderAll(); };
      catWrap.appendChild(p);
    });

    const urgCounts = {};
    ITEMS.forEach(i => { urgCounts[i.urgency] = (urgCounts[i.urgency]||0)+1; });
    const urgWrap = document.getElementById('urg-filters');
    urgWrap.innerHTML = "";
    const allUrg = document.createElement('div');
    allUrg.className = 'pill' + (activeUrg === 'all' ? ' active' : '');
    allUrg.style.background = activeUrg === 'all' ? '#1c1a17' : '';
    allUrg.textContent = 'All (' + ITEMS.length + ')';
    allUrg.onclick = function(){ activeUrg = 'all'; activeSrc = null; renderAll(); };
    urgWrap.appendChild(allUrg);
    ['act','deep','watch'].forEach(function(u){
      if(!urgCounts[u]) return;
      const p = document.createElement('div');
      p.className = 'pill' + (activeUrg === u ? ' active' : '');
      if(activeUrg === u){ p.style.background = (u==='act' ? '#e24b4a' : u==='deep' ? '#378add' : '#ef9f27'); }
      p.textContent = URG_EMOJI[u] + ' ' + URG_LABEL[u] + ' (' + urgCounts[u] + ')';
      p.onclick = function(){ activeUrg = u; activeSrc = null; renderAll(); };
      urgWrap.appendChild(p);
    });
  }

  function renderCards(){
    const container = document.getElementById('cards-container');
    container.innerHTML = "";
    const filtered = ITEMS.filter(function(item){
      if(activeCat !== 'all' && item.cat !== activeCat) return false;
      if(activeUrg !== 'all' && item.urgency !== activeUrg) return false;
      if(activeSrc && item.source.indexOf(activeSrc) === -1) return false;
      return true;
    });

    if(filtered.length === 0){
      container.innerHTML = '<div class="empty-state">No items match this filter.</div>';
      return;
    }

    filtered.forEach(function(item){
      const card = document.createElement('div');
      card.className = 'card';
      if(activeSrc){ card.classList.add('open'); }
      card.id = 'card-' + item.id;

      const chartFlag = item.charts && item.charts.count > 0 ? (item.charts.hot ? '🔥' : '📊') : '';

      const header = document.createElement('div');
      header.className = 'card-header';
      header.innerHTML =
        '<span class="idx">' + String(item.id).padStart(2,'0') + '</span>' +
        '<span class="urg-emoji">' + URG_EMOJI[item.urgency] + '</span>' +
        '<span class="src-badge" style="background:' + catColor(item.cat) + '">' + item.source + '</span>' +
        '<span class="cat-tag">' + item.cat + '</span>' +
        (chartFlag ? '<span class="chart-flag">' + chartFlag + '</span>' : '') +
        '<span class="card-title">' + item.title + '</span>' +
        '<span class="chev">▸</span>';
      header.onclick = function(){ card.classList.toggle('open'); };
      card.appendChild(header);

      const body = document.createElement('div');
      body.className = 'card-body';

      let chartsHtml = '';
      if(item.charts && item.charts.count > 0){
        chartsHtml =
          '<div class="sec-label">Charts</div>' +
          '<div class="chart-box' + (item.charts.hot ? ' hot' : '') + '">' +
          (item.charts.hot ? '🔥 CHART WORTH SAVING — ' : '📊 ') +
          item.charts.desc +
          '</div>';
      }

      body.innerHTML =
        '<div class="sec-label">The Idea</div>' +
        '<div class="idea-text">' + item.idea + '</div>' +
        '<div class="sec-label">My Angle</div>' +
        '<div class="angle-box" style="border-left-color:' + catColor(item.cat) + '">' + item.angle + '</div>' +
        '<div class="sec-label">Tweets</div>' +
        '<div class="tweet-row">' +
          '<div class="tweet-box a">' +
            '<div class="tlabel">TWEET A</div>' +
            '<div class="tweet-text">' + item.tweetA + '</div>' +
            '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button>' +
          '</div>' +
          '<div class="tweet-box b">' +
            '<div class="tlabel">TWEET B</div>' +
            '<div class="tweet-text">' + item.tweetB + '</div>' +
            '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button>' +
          '</div>' +
        '</div>' +
        chartsHtml +
        '<div class="link-row"><a href="' + item.link + '" target="_blank" rel="noopener">↗ Read full article</a></div>';

      card.appendChild(body);
      container.appendChild(card);
    });
  }

  function renderReport(){
    const body = document.getElementById('report-body');
    let html = '';
    html += '<h4>Time Window</h4>';
    html += '<div>' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</div>';
    html += '<h4>Coverage</h4>';
    html += '<div>' + META.emailsInWindow + ' emails in window · ' + META.emailsRead + ' read · ' + META.itemsExtracted + ' items extracted</div>';
    html += '<h4>Included Sources</h4>';
    META.includedSources.forEach(function(s){
      html += '<div class="src-line" data-src="' + s.name.replace(/"/g,'&quot;') + '">' + s.name + ' <span class="count">(' + s.count + ')</span></div>';
    });
    html += '<h4>Skipped Sources</h4>';
    META.skippedSources.forEach(function(s){
      html += '<div>' + s.name + ' — <em>' + s.reason + '</em></div>';
    });
    body.innerHTML = html;

    Array.prototype.forEach.call(body.querySelectorAll('.src-line'), function(el){
      el.onclick = function(){ filterBySrc(el.getAttribute('data-src')); };
    });
  }

  window.filterBySrc = function(name){
    activeCat = 'all';
    activeUrg = 'all';
    activeSrc = name;
    renderAll();
    document.getElementById('cards-container').scrollIntoView({behavior:'smooth', block:'start'});
  };

  window.copyTweet = function(itemId, which){
    const item = ITEMS.find(function(i){ return i.id === itemId; });
    const text = which === 'a' ? item.tweetA : item.tweetB;
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const btn = event.target;
    btn.textContent = '✓ Copied';
    setTimeout(function(){ btn.textContent = '📋 Copy'; }, 1500);
  };

  function renderAll(){
    renderFilters();
    renderCards();
  }

  document.getElementById('report-toggle').onclick = function(){
    document.getElementById('report-card').classList.toggle('open');
  };

  renderHeader();
  renderAll();
  renderReport();
})();
</script>
