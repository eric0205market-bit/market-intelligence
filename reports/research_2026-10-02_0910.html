<script>
const ITEMS = [{"id": 1, "cat": "macro", "urgency": "red", "source": "John Authers / Points of Return (Bloomberg)", "title": "French 10y OAT at 4.92% — 5% would be the first print since 2002, while Bunds rallied", "idea": "Bund rallied Thursday but OATs sold off to 4.92% after the 2027 budget (deficit target 5.0% of GDP from 5.4%, EUR54B effort) was called 'optimistic' by the fiscal watchdog. OAT-Bund spread is 'perilously close' to the 2011 record. Last budget before a spring presidential election where hard left and hard right both have a real shot.", "angle": "The US sold off, then un-sold off, and France kept going. That's idiosyncratic risk, not beta. Watch OAT-Bund and Italy-France spread inversion.", "tweetA": "US yields fell 12bp on Thursday and French yields still rose. When the global bid comes back and your bonds don't follow, that's not a rates story. It's a political risk premium with an election date on it. $EUFN $FXE", "tweetB": "Nobody's asking why Italy under Meloni is the 'pragmatic' one in this crisis. The market is pricing 2027 French politics at a level it hasn't seen since 2002, with the ECB the only buyer that matters.", "charts": {"count": 3, "hot": true, "desc": "OAT-Bund 10y spread vs 2011 record; 10y OAT yield since 2002. 🔥 CHART WORTH SAVING (spread chart)"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-02/soaring-yields-find-europe-s-weak-spot-in-france"}, {"id": 2, "cat": "macro", "urgency": "red", "source": "John Authers / Points of Return (Bloomberg)", "title": "The US bond selloff was a communication error, not an inflation or confidence problem", "idea": "10y was 4.6% before Warsh's July 29 press conference; Fed terminal rate priced at ~4.0%. Peaks this week: 4.86% and 5.25%. Core PCE is 3.0% but trimmed-mean is 2.3% and falling; foreign Treasury holdings barely off peak; term premium barely moved. Thursday futures cut the October-2027 terminal by 21bp and the 10y fell 12bp peak-to-trough on a news-free day. Authers blames Fed/Treasury messaging, including Bessent's 'I am the house now'.", "angle": "If it was communication, it can reverse on communication. But the secular uptrend (demographics, deglobalization) stays. Trade the volatility of the narrative, not the level.", "tweetA": "~100bp of terminal-rate repricing in two months with a trimmed-mean core at 2.3%. Either the Fed lost the plot or the market did. Both are tradable, they just have different stops. $TLT $ZN", "tweetB": "A Treasury Secretary telling traders to bet against him is the most expensive sentence of the quarter. Term premium didn't move, expectations did. That's not a supply problem, that's a credibility problem.", "charts": {"count": 3, "hot": false, "desc": "Terminal rate path, core vs trimmed-mean PCE, Thursday yield drop"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-02/soaring-yields-find-europe-s-weak-spot-in-france"}, {"id": 3, "cat": "macro", "urgency": "deep", "source": "John Authers / Points of Return (Bloomberg)", "title": "European stocks have given up nearly all gains since Trump took office; the euro is weakening", "idea": "Main European bourses sold off Thursday while US equities rallied. With a weaker euro, the continent's equities are back to roughly where they were at inauguration. Authers expects the usual script: ECB caps yields (easier if the French Lagarde leaves early) and politicians muddle through; real risk is a voter in some member state deciding to blow up the model.", "angle": "Europe long thesis from 2025 has fully round-tripped. The question is whether the next leg is ECB put or a political break.", "tweetA": "The 2025 European rotation trade has completely round-tripped in USD terms. A year of 'Europe is back' and the index is flat. Meanwhile the US reloads. $EZU $VGK", "tweetB": "Fiscal policy national, currency common, central bank last-resort. Everyone knows the flaw. What changes is that 2027 is the first election cycle where nobody in the room is afraid of what happens next.", "charts": {"count": 1, "hot": false, "desc": "European equities vs inauguration date"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-02/soaring-yields-find-europe-s-weak-spot-in-france"}, {"id": 4, "cat": "macro", "urgency": "deep", "source": "John Authers / Points of Return (Bloomberg)", "title": "'Take a trip to Tokyo before the carry trade blows up': the peso-yen carry is obvious and painful", "idea": "Authers (writing from Mexico City) notes the peso-yen carry trade is crowded, souvenirs in Tokyo are now cheap in peso terms, and a year ago the reverse was true. Bessent also dared traders to bet against the yen ('I am the house now', Sept 8). Also linked: Javier Blas on why oil is $100 if Trump is winning in Hormuz; Catherine Thorbecke on Chinese AI going rogue; Fed headquarters cost overruns.", "angle": "Carry crowding + a Treasury Secretary on the other side + Hormuz oil at $100 is a classic setup for a yen squeeze.", "tweetA": "The most crowded FX trade of the year has a Treasury Secretary on the other side. Peso carry funded in yen only works until the day the funding currency isn't allowed to weaken. $USDJPY $USDMXN", "tweetB": "Oil at $100 'while winning in Hormuz' is a puzzle worth its own thread. Either the market doesn't believe the win, or what's priced is the logistics, not the war.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-02/soaring-yields-find-europe-s-weak-spot-in-france"}, {"id": 5, "cat": "macro", "urgency": "deep", "source": "The Dark Side of the Boom", "title": "Goldman NFP preview: +80k vs +88k consensus, unemployment to 4.0%, wages +0.2%", "idea": "Goldman's alt indicators averaged +77k in September vs +31k in August; claims ~204k, JOLTS layoff rate 1.0%. August was flattered by 104k from leisure/hospitality and local education. A late Labor Day depresses September prints historically. Wage tracker ~3.5% y/y. Soft headline plus falling unemployment would make October hike pricing ambiguous.", "angle": "The print that matters is U-rate, not payrolls. 80k with 4.0% is hawkish in disguise.", "tweetA": "80k payrolls with unemployment falling to 4.0% is the worst combination for anyone trading the 'soft print rally'. The headline gets the bid, the rate gets the hike. Position for the divergence. $TLT $SPY", "tweetB": "104k of August came from two seasonal-noise categories. Strip it out and the trend is closer to 50k. 'Low hire, low fire' is the new normal and the Fed is now reading claims, not payrolls.", "charts": {"count": 1, "hot": true, "desc": "Goldman alt employment indicators: +77k Sept vs +31k Aug. 🔥 CHART WORTH SAVING"}, "link": "https://thedarksideoftheboom.substack.com/p/goldman-nfp-preview-soft-enough-to"}, {"id": 6, "cat": "positioning", "urgency": "deep", "source": "The Dark Side of the Boom", "title": "Citadel Securities' Rubner: retail cash reloading, CTAs below neutral, buybacks reopen", "idea": "Q3 earnings Super Bowl is the last week of October: ~44% of S&P 500 and 38% of Nasdaq 100 report, ~two-thirds of S&P by end of week, 92% by late November. September cleared leverage, cooled retail cash activity, CTAs sold from heavily long to below neutral. Index is still hiding a weak median stock: mega caps carried Q3. Rubner turning more constructive into Q4.", "angle": "Positioning is clean going into the heaviest reporting week. Mega cap vs equal weight gap is the tell.", "tweetA": "CTAs went from max long to below neutral in one month, retail cash cooled, buyback windows reopen in October. Positioning is the cleanest it's been all year. The only thing missing is a reason to buy. Late October gives them one. $SPY $QQQ", "tweetB": "44% of the S&P reporting in one week. If the average stock struggled in Q3, the reloaded money is buying the same 10 names again. Watch breadth, not the index.", "charts": {"count": 1, "hot": false, "desc": "Earnings calendar density / positioning slides"}, "link": "https://thedarksideoftheboom.substack.com/p/citadel-securities-rubner-sees-retail"}, {"id": 7, "cat": "credit", "urgency": "deep", "source": "The Dark Side of the Boom", "title": "Apollo's Slok: sector-silo forecasts don't add up when stacked, AI circular financing is a 'calculus bug'", "idea": "Wall Street models tech, power, industrials and credit in separate silos; stacked on top of each other, the forecasts are mathematically inconsistent. Capital loops between chipmakers, cloud, model builders and their investors. The structure works while asset prices rise and gets relabeled as leverage when they fall.", "angle": "This is the sell-side consistency check nobody runs. Pair with Parekh's data center bond discount story.", "tweetA": "Every sell-side team has a perfectly coherent model of its own sector. Stack them and the sum of AI capex, power build and credit supply doesn't add up. Someone's forecast is wrong by trillions. $NVDA $ORCL $CRWV", "tweetB": "Circular financing isn't a bug while stocks rise. It's a bug the day one leg stops compounding, and one of them just printed four straight discounted high-yield deals.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/apollo-flags-the-circular-financing"}, {"id": 8, "cat": "AI/infra", "urgency": "red", "source": "Michael Parekh / AI Ramblings Daily", "title": "Anthropic targets IPO before Thanksgiving at $1.8-2T valuation; investor meetings from Oct 14", "idea": "Bloomberg: formal marketing could start the week of Nov 9; investor meetings at SF HQ as early as Oct 14; valuation talk $1.8-2T; aims to match or beat SpaceX's record June IPO. Parekh estimates 2026 revenue above $100B, double in 2027. Headwinds: Oura became the third issuer to pull at the last minute, OpenAI has delayed its own IPO, and Dario's call to pace model development.", "angle": "IPO window is 6-7 weeks away. At $2T it prices ~20x CY26 revenue; the comp set becomes everything.", "tweetA": "Anthropic at $2T on ~$100B of 2026 revenue is 20x sales for a company with 75% gross margins and two profitable quarters. Compare that to what Oura couldn't clear last week. The market has two IPO tapes right now. $AMZN $GOOGL", "tweetB": "Three IPOs pulled in weeks, then a $2T deal scheduled for Nov. Either the window is closing and Anthropic is going through it first, or the largest IPO in history is the one that reopens it.", "charts": {"count": 1, "hot": false, "desc": "Anthropic vs OpenAI revenue comparison (in AI Ramblings web post)"}, "link": "https://michaelparekh.substack.com/p/come-hell-or-high-water-in-ai-anthropic"}, {"id": 9, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily", "title": "SpaceXAI is becoming a mega neocloud: Anthropic has committed ~$85B, Google another big tenant, Microsoft in talks", "idea": "The Information: Musk built capacity for his own apps, then rented much of it ahead of the SpaceX IPO. Anthropic committed ~$85B (about 16% of its reported $517B in compute deals), Google is the other anchor. 420,000 Nvidia GPUs due online in Memphis in November; Colossus II drainage flooding may delay 2-3 weeks. Parekh calls it 'Elon Web Services'.", "angle": "Compute is the new utility. Whoever has powered land and GPUs becomes landlord to the labs.", "tweetA": "$85B from Anthropic to a competitor's data centers. The lab that said 'we're building our own' is renting from the guy building Grok. Compute scarcity beats rivalry every time. $NVDA $TSLA", "tweetB": "Colossus II flooded by a drainage problem: 2-3 weeks of delay on 420k GPUs. The AI buildout's binding constraint is increasingly civil engineering, not silicon.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/come-hell-or-high-water-in-ai-anthropic"}, {"id": 10, "cat": "credit", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily", "title": "All four high-yield data center bond deals since July priced at a discount; banks getting choosier; Oracle force majeure in New Mexico", "idea": "The Information 'Cracks Emerge in AI's Debt-Fueled Data Center Boom': four HY data center deals since July all sold at discount, including one for a Meta-built data center. Some big banks are tightening data-center loan appetite. Oracle sent a force majeure notice on a New Mexico project delayed by power. Parekh: 'come hell or high water, but not at any price'.", "angle": "First hard credit signal. Watch CDS on neocloud issuers and the Meta-linked deal secondary.", "tweetA": "4 for 4. Every high-yield data center deal since July priced at a discount, including one backed by Meta demand. Equity says 'AI is a gold rush'. Credit says 'show me the power contract'. $ORCL $CRWV $META", "tweetB": "Force majeure over power delays is the phrase to watch. Contract language is the canary: the financing assumes grid hookups that don't exist yet.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/come-hell-or-high-water-in-ai-anthropic"}, {"id": 11, "cat": "regulation", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily", "title": "Trump to pick Jay Clayton as AI czar 2.0; voluntary safety standards 'morally binding'", "idea": "CBS: Clayton (ex-SEC chair, ex-SDNY, DNI since July) likely to hold both jobs. David Sacks stepped down earlier this year. Top AI labs signed voluntary safety standards at the White House this week which Trump called 'morally binding'. Parekh: pick ahead of the next Xi meeting, light-touch relative to EU and China.", "angle": "AI policy now sits inside the intelligence apparatus. Export controls and model security become the center of gravity, not antitrust.", "tweetA": "AI czar and the director of national intelligence are going to be the same person. That tells you AI policy is now a national security file first and an economic one second. $NVDA $AMD", "tweetB": "'Morally binding' voluntary standards. The US regulatory model is now a handshake, the EU's is a rulebook, China's is a state-run stack. Pick the one that survives the first major incident.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/come-hell-or-high-water-in-ai-anthropic"}, {"id": 12, "cat": "tech", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily", "title": "Microsoft rebuilds Copilot around agents: 'Autopilot' (cloud Scout), Office inside Copilot; 'OS for work' vs Meta/OpenAI 'OS for life'", "idea": "The Verge: Copilot now has chat, coding and Autopilot tabs, with Word, Excel, PowerPoint editable inside Copilot. Competing agents: Meta Muse (hit #1 on app store), OpenAI Dots, Google Gemini Spark, Grok Bot. Parekh's daily driver is Claude Cowork on Opus 5.5; his top wish is proactivity.", "angle": "Agent war is moving into the workflow layer; distribution (Office seats) vs model quality.", "tweetA": "Microsoft's answer to every agent startup is to put Word, Excel and PowerPoint inside Copilot. It owns the seat, the file and the identity. Everyone else has to win the model and the workflow. $MSFT", "tweetB": "Five major agents launched in weeks and the reviewer's pick is still the one that asks permission and reports back. Proactivity is the unsolved product problem, not intelligence.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/come-hell-or-high-water-in-ai-anthropic"}, {"id": 13, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "Anthropic ends enterprise discount at the cap — the 15% off becomes ~18% more on every overage token", "idea": "The Information: once a customer hits its committed usage cap, Anthropic ends the ~15% discount; AWS, Azure and GCP continue discounts on overage, OpenAI gives the rest of the month plus a month to renegotiate. Parekh's math: $1/$0.85 = ~18% more per token. 100+ firms spent over $10M and 1,000+ spent over $1M with Anthropic in the 12 months to June.", "angle": "Pricing power from scarcity and lead. First sign a frontier lab is behaving like Oracle, not AWS.", "tweetA": "Losing a 15% discount is an 18% price hike. Anthropic is the first cloud-scale vendor that charges you MORE for being a better customer. That only works while you're the best model and compute is scarce. $AMZN $GOOGL", "tweetB": "The hyperscalers trained a generation of buyers to expect elastic discounts. Anthropic is testing how far a product lead can pull them back to audits and true-ups. CodeRabbit already voted with its feet.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-hard-cap-vs-openais"}, {"id": 14, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "OpenAI halves price per token, wins CodeRabbit (tens of millions in spend) from Anthropic; 'share of wallet' clauses can't be verified", "idea": "OpenAI cut new model prices 50% via OpenRouter and Vercel; Altman: 'half the price per token, and even less per task'. CodeRabbit's majority supplier was Anthropic six months ago, now OpenAI. Both labs add 'share of wallet' clauses asking customers to send majority of spend — neither can verify it. Palantir, Nvidia and Booz Allen are reducing or eliminating use of top models over IP concerns.", "angle": "Price umbrella: the higher Anthropic prices, the more room OpenAI has to undercut. Bezos: 'your margin is my opportunity'.", "tweetA": "A lab can't verify 'share of wallet' and the buyer can switch with an API key. The 'moat' in enterprise AI is whichever model is cheapest per task this week. That's a commodity, not a franchise. $MSFT $AMZN", "tweetB": "Palantir, Nvidia and Booz Allen limiting frontier-model usage over IP guarantees. The customers closest to the data are the ones building exit ramps.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-hard-cap-vs-openais"}, {"id": 15, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "Anthropic margin sheet: ~75% gross margin, >$65B annualized revenue by August, $517B in compute commitments", "idea": "Per The Information, Anthropic told a partner gross margin was ~75% on existing models; FT reported >80% before revenue share. Annualized revenue passed $65B in August. Compute deals total $517B over eleven months vs OpenAI's $750B. Two straight quarters of positive adjusted operating income.", "angle": "$517B of commitments against $65B ARR is ~8x. The IPO prospectus will have to explain the coverage ratio.", "tweetA": "$517B of compute commitments against $65B of run-rate revenue. Eight years of current revenue pre-committed. The margin is great. The question is what happens to the take-or-pay if growth slows from 3x to 1.5x. $AMZN $GOOGL", "tweetB": "75% gross margin is a software number on a utility cost base. Whether it holds depends on whether the 'gigawatts coming online next year' arrive cheaper or just more.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-hard-cap-vs-openais"}, {"id": 16, "cat": "tech", "urgency": "watch", "source": "McKinsey / The Weekend Read", "title": "LATAM Airlines: AI and digital rewiring now automates >90% of changes, refunds and check-ins", "idea": "McKinsey case: LATAM, a century-old carrier, worked with McKinsey and QuantumBlack to rebuild around digital and AI, automating more than 90% of changes, refunds and check-ins and raising customer satisfaction.", "angle": "Legacy industry adoption proof point (airlines are a high-contact service). Labor displacement signal for call centers.", "tweetA": "90% of changes, refunds and check-ins automated at a century-old airline. Those were the jobs that used to be a call-center line item. The cost curve moved before the headcount line did. $LTM", "tweetB": "Airlines are the stress test for agentic customer service because every edge case is a delayed flight with an angry passenger. If it works there it works anywhere.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.mckinsey.com/industries/travel/how-we-help-clients/latams-reinvention-at-35000-feet"}, {"id": 17, "cat": "science", "urgency": "watch", "source": "McKinsey / The Weekend Read", "title": "McKinsey: AI can perform 16-22% of US outpatient care today", "idea": "'The AI-powered future of care': AI won't replace clinicians but can improve quality, expand access and reshape the workforce, payments and patient volumes. Estimate: 16-22% of US outpatient care tasks can already be performed by AI.", "angle": "Healthcare is the largest labor pool in the US; this puts a number on automation exposure.", "tweetA": "16-22% of US outpatient care is automatable today, per McKinsey. Healthcare has been the only job engine in the US for two years. What happens to payroll prints when the engine becomes the target? $UNH $HCA", "tweetB": "If AI performs a fifth of outpatient care, who captures the savings: payers, providers, or patients? In US health the answer has never been the patient.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.mckinsey.com/industries/healthcare/our-insights/the-ai-powered-future-of-care"}, {"id": 18, "cat": "culture", "urgency": "watch", "source": "McKinsey / The Weekend Read", "title": "Only 7 of 430 beauty brands founded since 2005 reached $1B in sales", "idea": "McKinsey analysis of 430 beauty brands founded since 2005: only seven generated over $1B in sales last year, and the formula for success changes as brands scale.", "angle": "1.6% hit rate for a breakout consumer category; useful base rate for consumer venture and IPO pipeline (Oura).", "tweetA": "7 out of 430. A 1.6% hit rate for building a billion-dollar beauty brand, in a category with cheap distribution and viral social. Base rates are the part of venture nobody quotes.", "tweetB": "Consumer brand building has a power law with a thinner tail than SaaS. Yet every pitch deck assumes it's the one in 60.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.mckinsey.com/industries/consumer-packaged-goods/our-insights/billion-dollar-beauty-the-odds-of-scaling-a-breakout-brand"}, {"id": 19, "cat": "tech", "urgency": "watch", "source": "McKinsey / The Weekend Read", "title": "Bret Taylor on agents: today's cybersecurity exposure may be short-lived as defenses catch up", "idea": "McKinsey Podcast with OpenAI chair and Sierra cofounder Bret Taylor: more capable agents expose firms to new cyber threats, but today's heightened vulnerability may be temporary; the longer-term upside is world-class knowledge within everyone's reach.", "angle": "Agent security is an emerging spend category; defense follows offense with a lag.", "tweetA": "Bret Taylor: agent vulnerability is a window, not a state. If he's right, the cybersecurity budget line for agent runtime gets built in 2026-27 and then commoditized. $CRWD $PANW", "tweetB": "The people selling the agents telling you the security risk is temporary. Ask who bears the loss during the window.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.mckinsey.com/capabilities/tech-and-ai/our-insights/democratized-superintelligence-is-coming-the-world-needs-to-get-ready"}, {"id": 20, "cat": "macro", "urgency": "watch", "source": "McKinsey / The Weekend Read", "title": "McKinsey Global Economics Intelligence (Aug 2026): US debt at a record, energy-driven inflation limits rate room", "idea": "Executive summary: public debt and the search for growth are exercising policymakers as US debt hits a record high; inflation fueled by energy supply uncertainty limits room for maneuver on interest rates.", "angle": "Confirms Authers' secular-yield view from the consultant side: fiscal plus energy keep the rate floor higher.", "tweetA": "Record debt, energy-driven inflation, and a central bank with no room. McKinsey's August summary reads like the preface to this week's bond market.", "tweetB": "Oil at $100 plus record debt isn't a cycle, it's a regime. The 10y at 4.9% is the market trying to say so.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.mckinsey.com/capabilities/strategy-and-corporate-finance/our-insights/global-economics-intelligence"}];
const META = {"date": "2026-10-02", "time": "09:10 CEST", "windowStart": "2026-10-02 03:10 CEST", "windowEnd": "2026-10-02 09:10 CEST", "emailsInWindow": 8, "emailsRead": 8, "itemsExtracted": 20, "includedSources": [{"name": "John Authers / Points of Return (Bloomberg)", "items": 4}, {"name": "The Dark Side of the Boom", "items": 3}, {"name": "Michael Parekh / AI Ramblings Daily", "items": 5}, {"name": "Michael Parekh / AI-RTZ", "items": 3}, {"name": "McKinsey / The Weekend Read", "items": 5}], "skippedSources": [{"name": "Substack notification (Prometheus Research live video)", "reason": "Automated live-stream notification, title 'Testing!', no content"}], "notes": "Emails read as plain text; chart images not visible in plain text, chart counts for Authers inferred from in-body references. Tweets on McKinsey items are based on teaser text only."};
const CC = {"macro": "#e24b4a", "credit": "#378add", "positioning": "#ef9f27", "AI/infra": "#1d9e75", "crypto": "#7f77dd", "geopolitics": "#d85a30", "energy": "#f97316", "tech": "#06b6d4", "gold": "#d4a017", "culture": "#ec4899", "labor": "#8b5cf6", "regulation": "#64748b", "science": "#14b8a6", "venture": "#84cc16"};
var fc='all',fu='all',fs=null;
var UE={red:'🔴',deep:'🔵',watch:'🟡'};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function toggle(id){document.getElementById('c'+id).classList.toggle('open');}
function collapseAll(){var e=document.querySelectorAll('.card');for(var i=0;i<e.length;i++)e[i].classList.remove('open');}
function setC(c){fc=c;fs=null;collapseAll();render();}
function setU(u){fu=u;fs=null;collapseAll();render();}
function filterBySrc(name){fs=name;fc='all';fu='all';render();var e=document.querySelectorAll('.card');for(var i=0;i<e.length;i++){if(e[i].style.display!=='none')e[i].classList.add('open');}window.scrollTo(0,0);}
function pill(label,on,col,fn){return '<span class="pill'+(on?' on':'')+'" style="'+(on?'background:'+col+';':'')+'" onclick="'+fn+'">'+label+'</span>';}
function render(){
  var cats={};ITEMS.forEach(function(i){cats[i.cat]=(cats[i.cat]||0)+1;});
  var h=pill('All ('+ITEMS.length+')',fc==='all','#333',"setC('all')");
  Object.keys(cats).forEach(function(k){h+=pill(k+' ('+cats[k]+')',fc===k,CC[k]||'#333',"setC('"+k+"')");});
  document.getElementById('cats').innerHTML=h;
  var u={red:0,deep:0,watch:0};ITEMS.forEach(function(i){u[i.urgency]++;});
  document.getElementById('urg').innerHTML=pill('All',fu==='all','#333',"setU('all')")+pill('🔴 Act Now ('+u.red+')',fu==='red','#e24b4a',"setU('red')")+pill('🔵 Deep ('+u.deep+')',fu==='deep','#378add',"setU('deep')")+pill('🟡 Watch ('+u.watch+')',fu==='watch','#d4a017',"setU('watch')");
  var open={};var e=document.querySelectorAll('.card.open');for(var j=0;j<e.length;j++)open[e[j].id]=1;
  var out='';
  ITEMS.forEach(function(item){
    var show=(fc==='all'||item.cat===fc)&&(fu==='all'||item.urgency===fu)&&(!fs||item.source.indexOf(fs)!==-1);
    var col=CC[item.cat]||'#333';
    var ch=item.charts.count>0?(item.charts.hot?' 🔥':' 📊'):'';
    out+='<div class="card'+(open['c'+item.id]?' open':'')+'" id="c'+item.id+'" style="display:'+(show?'block':'none')+'">'
    +'<div class="hd" onclick="toggle('+item.id+')"><span class="num">#'+item.id+'</span><span>'+UE[item.urgency]+'</span><span class="src" style="background:'+col+'">'+esc(item.source)+'</span><span class="tag">'+item.cat+'</span><span>'+ch+'</span><span class="ttl">'+esc(item.title)+'</span></div>'
    +'<div class="body"><div class="lbl">The Idea</div><div>'+esc(item.idea)+'</div>'
    +'<div class="lbl">My Angle</div><div class="angle" style="border-color:'+col+';background:'+col+'14">'+esc(item.angle)+'</div>'
    +'<div class="tw"><div><div class="lbl" style="color:#378add">Tweet A</div>'+esc(item.tweetA)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>'
    +'<div><div class="lbl" style="color:#7f77dd">Tweet B</div>'+esc(item.tweetB)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>'
    +'<div class="chart'+(item.charts.hot?' hot':'')+'">'+(item.charts.count>0?item.charts.count+' chart(s): '+esc(item.charts.desc):'No charts in email.')+'</div>'
    +'<p><a href="'+item.link+'" target="_blank" rel="noopener">↗ Read full article</a></p></div></div>';
  });
  document.getElementById('list').innerHTML=out;
}
function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';
  var r='<p><b>Window:</b> '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</p><p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</p><p><b>Included sources</b> (click to filter):<br>';
  META.includedSources.forEach(function(s){r+='<span class="sl" onclick="filterBySrc(this.getAttribute(\'data-n\'))" data-n="'+esc(s.name)+'">'+esc(s.name)+'</span> ('+s.items+')<br>';});
  r+='</p><p><b>Skipped:</b><br>';
  META.skippedSources.forEach(function(s){r+=esc(s.name)+' — '+esc(s.reason)+'<br>';});
  r+='</p><p>'+esc(META.notes||'')+'</p>';
  document.getElementById('rb').innerHTML=r;
  render();
}
init();
</script></body></html>
