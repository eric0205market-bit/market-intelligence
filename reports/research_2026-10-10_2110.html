<script>
const ITEMS = [{"id": 1, "cat": "macro", "urgency": "deep", "source": "Macro Mornings", "title": "5 of 5 bulls that reached age 4 reached age 5 — and 4 of 5 died of the same thing: the 10Y", "idea": "Current bull is 3.9 yrs, ~+115%; the five that survived this long averaged 7.9 yrs and ~+290%. In 4 of 5 deaths (1974, 1982, 1987, 2002) the 10Y rose 1-3 points in the prior 12-18 months; S&P losses -27%, -33.5%, -49%, -57%. 10Y closed September at 5.30%. 1982 bull added almost 90 pts between year 4 and 5 - best year was its last.", "angle": "Base rates say bulls don't die of age, they die of the discount rate. The 10Y at 5.3% is the variable, not the calendar.", "tweetA": "Everyone is citing 'bulls that reach year 4 always reach year 5.' Nobody cites the cause of death: 4 of 5 ended with the 10Y up 1-3 points. We're at 5.30%. The calendar is the wrong clock. $SPY $TLT", "tweetB": "The 1982 bull made its biggest gain in its final year, then 1987 took 20.5% in one session. If 'best year is the last year' rhymes, the thing to fear is a melt-up funded by cheap-looking earnings yield against a 5.3% risk-free.", "charts": {"count": 4, "hot": true, "desc": "Bull-market lifespan bars + 10Y rise before each top"}, "link": "https://macromornings.substack.com/p/credit-who-is-left-to-buy-us-debt"}, {"id": 2, "cat": "macro", "urgency": "deep", "source": "Macro Mornings", "title": "MSCI World ex-US / S&P 500 ratio broke its 2010 trendline after a 17-year, -76% slide", "idea": "Ratio fell from ~0.23 to ~0.055 over 17 years; now ~0.063 (+15% off low) and through the trendline that capped every rally since 2010. The ratio is 'for all practical purposes an inverted dollar chart': DXY 120->72 in 2002-08, 73->110 in 2011-25, -10.7% in H1 2025 (worst first half since 1973). Return to 0.11 would mean ~75% ex-US outperformance.", "angle": "Relative-value call is really a dollar call. If DXY is firm (see Forex/Gold weekly items) the trendline break may be a head-fake.", "tweetA": "The ex-US/S&P ratio is just the dollar upside down. It broke a 15-year trendline while DXY is bouncing. One of those two signals is wrong. I know which one I'd bet on, and it's not the one with the better story. $EFA $SPY $DXY", "tweetB": "Return to the 2018 level of 0.11 = ~75% ex-US outperformance. That's the whole 'US exceptionalism' trade reversed in one chart. At 0.063 you're paying zero for the option if you think the dollar tops here.", "charts": {"count": 2, "hot": true, "desc": "MSCI World ex-US/S&P 500 ratio with broken trendline"}, "link": "https://macromornings.substack.com/p/credit-who-is-left-to-buy-us-debt"}, {"id": 3, "cat": "gold", "urgency": "deep", "source": "Macro Mornings", "title": "Central banks: 5th straight month of gold buying, ~26t/month 'like a metronome'", "idea": "Aug +39t, Jul +23t, Jun +52t. China +20t in Aug (+80 YTD), record 2,387t, ~9% of FX reserves. Poland +98t YTD, record 648t. Annual tallies: ~314t (2024), ~310t (2025), ~210t in first 8 months of 2026. In 2022 real yields rose ~3.5pts yet gold went $1,800 -> $4,000+.", "angle": "Official buying breaks the real-yield playbook. Sets up the gold-vs-duration question in the Gold Weekly item.", "tweetA": "Real yields up 3.5 points since 2022 and gold still doubled. That's not a macro trade, that's a price-insensitive buyer taking 26 tonnes a month. Every tonne in a vault is a dollar not in Treasuries. $GLD $GDX", "tweetB": "China is at 9% of FX reserves in gold. Say they go to 15%. At current prices that's a bid the CTAs can't see on their trend screens. Who sells into it?", "charts": {"count": 2, "hot": false, "desc": "Central bank monthly gold purchases"}, "link": "https://macromornings.substack.com/p/credit-who-is-left-to-buy-us-debt"}, {"id": 4, "cat": "credit", "urgency": "deep", "source": "Macro Mornings", "title": "'Who is left to buy $40T of US debt?' — the thesis behind the paywall", "idea": "Fed minutes: 19 of 19 voted to hike, split on the reason. Author flags 3 charts (credit, liquidity gauge, a rate spread that last preceded the first 75bp hike since 1994) pointing to a single calendar window ~6 days out. Premise: foreign investors diversifying (chart 2) + central banks buying gold (chart 3) = marginal Treasury buyer question. Answer is behind PRO.", "angle": "Gating the answer is the content-marketing tell, but the set-up question is right: gold buying and ex-US rotation both subtract from UST demand.", "tweetA": "Unanimous hike, split on why. That's the part of the minutes I'd read twice. When a committee agrees on the action but not the reason, the next meeting is a coin flip. $TLT $ZN", "tweetB": "$40T of debt, $1.1T of annual interest (per BMO's Guatieri), and the marginal foreign buyer is buying bullion. The term premium is the shock absorber now. Where does it clear?", "charts": {"count": 7, "hot": false, "desc": "10 charts total; first 3 free (bulls, ex-US ratio, CB gold)"}, "link": "https://macromornings.substack.com/p/credit-who-is-left-to-buy-us-debt"}, {"id": 5, "cat": "macro", "urgency": "deep", "source": "Cubic Analytics / Caleb Franzen", "title": "US M2 growth +5.7% YoY vs Nasdaq +18.5%: 'confirmation, not a signal'", "idea": "One-chart report on M2 YoY vs Nasdaq Composite YoY. Backdrop: Redbook retail sales >= +5.5% YoY every week of 2026, latest +8.6% nominal; ISM mfg/services expanding at accelerating pace; S&P earnings growth accelerating; unemployment lower than a year ago.", "angle": "A bull-case counterweight to the 10Y-kills-bulls items. Note nominal retail +8.6% is inflation-heavy.", "tweetA": "Redbook at +8.6% YoY is the number I'd frame next to M2 at +5.7%. That's nominal, which means real consumption is much less impressive and the 'bull market confirmed' read depends on how hot you think prices are running. $QQQ", "tweetB": "M2 +5.7% with Nasdaq +18.5% means the equity premium over liquidity is ~13 pts. Correlation charts hold until the spread closes, and it closes from the equity side.", "charts": {"count": 1, "hot": true, "desc": "M2 YoY vs Nasdaq Composite YoY overlay"}, "link": "https://cubicanalytics.substack.com/p/the-only-m2-chart-you-need"}, {"id": 6, "cat": "macro", "urgency": "deep", "source": "Ironsides Macro", "title": "'Pushing on a String': further hikes poorly matched to energy/tariff inflation", "idea": "Ironsides argues hikes won't reduce energy- or tariff-driven prices, while higher interest costs worsen federal spending dynamics and strain housing and CRE. Earnings growth is concentrated in tech/AI infrastructure; no evidence of broadening to consumers or other capex. They are keeping cash as the hedge. Report has 13 charts and 2,288 words.", "angle": "Fiscal-dominance read of the hiking cycle; direct counter to the 'Fed pausing' item and to Cubic's bullish M2 read.", "tweetA": "A hike can't fix an oil shock or a tariff. It can only make the $1.1T interest bill bigger. If the Fed's tool worsens the thing causing the inflation, the term premium is the only price that adjusts. $TLT $IWM", "tweetB": "Cash 'as the most attractive hedge' with 10Y at 5.3% isn't defensive, it's a carry trade. The honest question: at what yield does Ironsides' cash stop being a hedge and become the position?", "charts": {"count": 13, "hot": true, "desc": "13 charts/tables inside - worth opening"}, "link": "https://ironsidesmacro.substack.com/p/bad-breadth"}, {"id": 7, "cat": "macro", "urgency": "deep", "source": "Ironsides Macro", "title": "Bad breadth: strong headline earnings concentrated in tech and AI infrastructure", "idea": "Headline S&P earnings growth supports the index, but the gains are narrowly concentrated in technology and AI infrastructure; no evidence of broadening to consumers or other capex. A hawkish Fed still a risk. They are not deploying cash.", "angle": "Pairs with Cembalest/McElligott-type breadth stories on the narrow index.", "tweetA": "Strong earnings, narrow base. When the index growth rate equals the AI capex growth rate, the earnings number isn't a measure of the economy, it's a measure of one budget line. $NVDA $SPY", "tweetB": "Index earnings that depend on a handful of capex budgets are one funding decision from a different print. Who sets those budgets? Four CFOs.", "charts": {"count": 13, "hot": false, "desc": "13 charts in article"}, "link": "https://ironsidesmacro.substack.com/p/bad-breadth"}, {"id": 8, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / BMO (Scott Anderson)", "title": "Fed 'knows when to hold': October 28 shaping up as a pause, not an end", "idea": "Waller sees another ~50bp of tightening by end-2027 if the economy tracks, but without hikes at every meeting; Jefferson and Williams signal similarly. Softer core PCE revisions remove urgency; inflation too sticky for an easy glide path. Guatieri: $2T deficit in a good economy; interest expense ~$1.1T/yr.", "angle": "A pause with a bias is the most dangerous Fed state for the long end because nothing caps the term premium.", "tweetA": "$2T deficit, $1.1T interest, economy fine. And the Fed's reaction function is 'hold, with a bias to hike.' That is not a pause. It's a long-end supply problem with a committee attached. $TLT", "tweetB": "+50bp by 2027 priced as the base case means the market has already been told where the terminal is. What it hasn't been told is who buys the $2T.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/does-the-fomc-know-when-to-hold-em"}, {"id": 9, "cat": "energy", "urgency": "deep", "source": "Dark Side of the Boom / BMO (Art Woo)", "title": "Nat gas calm: TTF $25.42 vs $70 in 2022 despite Qatari LNG damage and Hormuz disruption", "idea": "TTF averaged ~$25.42 in Sept (from ~$11 in Feb); Henry Hub fell below $3 (Sept $2.95 vs $3.61 Feb); AECO ~$1.15 since Feb. US LNG export capacity +20% by end-2027; Canada +15% in H2 2027. EIA sees 2026 US dry gas production +4.6% (Permian associated gas). BMO cut 2027 HH to $3.25. Europe storage below 5-yr average.", "angle": "Segmented energy shock: oil/diesel inflation, gas relief. Infrastructure, not molecules, set the price.", "tweetA": "Qatari LNG damaged, Hormuz disrupted, and Henry Hub is below $3. In 2022 the same headline took TTF to $70. The difference is regas and export capacity, not the geopolitics. The market is pricing the pipes. $UNG $LNG", "tweetB": "Associated gas from Permian means gas supply responds to oil, not gas price. Oil stays high -> gas stays long. The inflation offset is a function of oil drilling. Funny structure.", "charts": {"count": 1, "hot": true, "desc": "TTF/HH/AECO vs 2022"}, "link": "https://thedarksideoftheboom.substack.com/p/natural-gas-relief"}, {"id": 10, "cat": "gold", "urgency": "deep", "source": "Dark Side of the Boom", "title": "Gold Weekly: squeeze setup — CTAs liquidated, skew rising, ETF holders sticky, $4,200 is the line", "idea": "Gold below its 200-day; dollar firm; real yields up sharply. But CTA exposure cut toward prior-reversal levels, downside skew rising, ETF holdings resilient. China reportedly bought 23t in September; global CB demand 750-1,000t/yr. $4,000 support; $4,200 (21-day MA and short-term downtrend) is the psychological line; 'close above $4,220' flips the conversation.", "angle": "Rate-of-change setup: sellers exhausted, hedgers loaded. Contrast with Macro Mornings' CB-buying cadence.", "tweetA": "The sellers have sold. The hedgers have hedged. The owners (ETFs, PBOC) didn't move. Gold doesn't need good news, it needs bad news to stop. $4,200 is the print to watch. $GLD $GC", "tweetB": "CTAs care about a trendline. The PBOC doesn't. That's the whole asymmetry: one of those buyers has a stop. The other has a reserve mandate.", "charts": {"count": 1, "hot": true, "desc": "Gold long-term trendline vs 200-day, CTA positioning"}, "link": "https://thedarksideoftheboom.substack.com/p/gold-weekly-the-dollar-is-still-the"}, {"id": 11, "cat": "gold", "urgency": "deep", "source": "Dark Side of the Boom", "title": "Gold vs bonds: same macro bet (peak real yields) but gold has an extra marginal buyer", "idea": "If you buy Treasuries because real yields are close to peaking, gold benefits from the same reversal plus strategic accumulation by reserve managers. But Treasuries pay carry; gold doesn't. A dollar squeeze hurts gold but Treasuries can rally. Fiscal pressure can keep term premium elevated even if the Fed turns less hawkish.", "angle": "Practical trade framing: duration vs gold for the same macro view.", "tweetA": "Same view, two instruments. Long TLT says 'yields peak.' Long GLD says 'yields peak AND someone else keeps buying.' One pays 5%. The other has a reserve manager. Pick your convexity. $TLT $GLD", "tweetB": "Treasuries pay you to wait, gold doesn't. At 5.3% the cost of waiting in gold is ~5.3%/yr. That's the hurdle, and the CB bid has to beat it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/gold-weekly-the-dollar-is-still-the"}, {"id": 12, "cat": "geopolitics", "urgency": "deep", "source": "Dark Side of the Boom / Goldman (Rikin Shah)", "title": "The Great AI Divide: US gets growth, Europe gets higher rates (r-g framing)", "idea": "Via r-g: strong US nominal growth absorbs higher rates; Europe lacks that cushion. France has elevated debt, persistent deficits, and refinancing ~250bp above its average outstanding rate. Energy pressure and fading fiscal support risk wider sovereign spreads.", "angle": "AI productivity gap as a sovereign credit variable. Pair with OAT-Bund and the ex-US ratio break.", "tweetA": "r minus g. The US has the g from AI capex. France has the r and no g. Refinancing 250bp above the stock average means every maturity is a repricing event. OAT-Bund is the AI trade nobody thought to hedge. $FXE", "tweetB": "If the ex-US/S&P ratio is breaking out on a weaker dollar while France refinances 250bp over its coupon, one of those is mispriced. Probably the equity side.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-great-ai-divide-america-gets"}, {"id": 13, "cat": "crypto", "urgency": "deep", "source": "DeFi0xJeff", "title": "Token2049: 'TradFi2049' — bullish West, bearish East; Chinese OG miners offloading BTC", "idea": "US regulatory clarity pushing institutions in; China maintains blanket ban on decentralized crypto, RWA tokenization offshore is state-controlled, and OG Chinese miners/operators are gradually offloading BTC and majors. Yet author sees notably more Chinese attendees at main events.", "angle": "East selling + West buying = flow pattern to track on the supply side.", "tweetA": "US celebrates clarity and buys. China bans and sells. Same asset, opposite regimes. Watch who the marginal seller is when OG miner supply meets ETF demand. $BTC", "tweetB": "More Chinese people at the conference while Chinese miners offload: the capital is leaving the asset, not the industry. Different trade.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://defi0xjeff.substack.com/p/token2049-is-tradfi2049-with-a-hint"}, {"id": 14, "cat": "crypto", "urgency": "deep", "source": "DeFi0xJeff", "title": "RWA is the #1 topic: tokenized stocks replace T-bills; Hyperliquid and Polymarket as backends", "idea": "Last year it was tokenized T-bills/MMFs, this year tokenized stocks (xStocks, Ondo) integrated into social-trading apps. Hyperliquid as perps backend, Polymarket as prediction-market backend, Derive soon for options. Ondo offers tokenized pre-IPO stock and 'Intelligent Portfolios' in a single token.", "angle": "Financial plumbing: crypto rails become the backend for everyone's front end.", "tweetA": "Last year: tokenized T-bills. This year: tokenized stocks, and Hyperliquid is the perps venue for apps that aren't crypto at all. The frontends are TradFi. The backend is a chain. That's the real 'TradFi2049.' $HYPE $ONDO", "tweetB": "If Polymarket and Hyperliquid are the backends, they capture flow without owning the customer. Where does that margin end up? Most likely not the app.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://defi0xjeff.substack.com/p/token2049-is-tradfi2049-with-a-hint"}, {"id": 15, "cat": "crypto", "urgency": "watch", "source": "DeFi0xJeff", "title": "Agentic payments: BlockRun #1 on x402 volume; ClawRouter pay-per-request on Solana", "idea": "BlockRun leads x402 volume and txn count via 'ClawRouter', an agent-native smart router paying per request on Solana (6.6k GitHub stars). Others: Kite (outcome-paid agents), OpenServ (reasoning layer to make smaller models reliable), Reppo (trust scores/insurance for agent decisions), Dolphin (decentralized inference on idle consumer GPUs).", "angle": "Early data point for agents-as-payers. Pair with Google's agents getting their own email addresses.", "tweetA": "Agents with their own wallet, paying per request over x402. Google just gave each Gemini agent its own Workspace email. One of these ends up being a credit-card substitute for non-humans. $SOL", "tweetB": "Pay-per-request routing is a market for inference. When the router has the volume and the models are commodities, the router sets the price. See the Haiku 5.5 price cuts.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://defi0xjeff.substack.com/p/token2049-is-tradfi2049-with-a-hint"}, {"id": 16, "cat": "crypto", "urgency": "deep", "source": "a16z crypto", "title": "Can AI break cryptography? Boneh/Lazzarin/Thaler: the algorithm doesn't exist to be found", "idea": "Following OpenAI's math results, experts say none addressed cryptography. Thaler: for hard problems we believe no efficient algorithm exists, so smarter AI can't find it. Boneh: AI could cut the 10-year scrutiny period to a month of models trying to break an assumption. Hybrid ECC + lattice handshakes already deployed.", "angle": "FUD debunk with a real nuance: AI threat extends to post-quantum schemes too (Boneh).", "tweetA": "The 'AI breaks Bitcoin' scare assumes an efficient algorithm exists. Cryptographers say the working assumption is it doesn't. The real risk is the one Boneh flags: AI weakening post-quantum schemes we're migrating to. $BTC", "tweetB": "Same models that scare people about crypto can red-team a protocol for a month before it ships. 10 years of scrutiny compressed to one. That's a bullish case for new cryptosystems.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://a16zcrypto.substack.com/p/can-ai-really-break-cryptography"}, {"id": 17, "cat": "tech", "urgency": "deep", "source": "a16z crypto (Jamie Dimon via Founders Corner)", "title": "JPMorgan: cybersecurity risk up 10x after Anthropic's Mythos", "idea": "Per Business Insider (via Founders Corner), Dimon says risks rose tenfold as AI exposes previously unknown vulnerabilities; JPM intensifying hunt for weaknesses. Pairs with a16z crypto's view that AI also lets shops test code pre-ship.", "angle": "Offense/defense asymmetry. The bank's CISO budget is a trade.", "tweetA": "Dimon: cyber risk up 10x after Mythos. a16z crypto: the same models can find the bugs before launch. Both are true, and which wins depends on who runs them first. $CRWD $PANW", "tweetB": "10x risk with unchanged cyber budgets is a margin hit for banks or a revenue line for security vendors. Pick the side that gets paid.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/903-european-seed-funds-how-to-evaluate"}, {"id": 18, "cat": "AI/infra", "urgency": "deep", "source": "AI Agents Weekly / Elvis Saravia", "title": "Claude Haiku 5.5: ~75% cheaper than Haiku 4.5, $0.10/$0.50 per M tokens", "idea": "OSWorld 2.1 offline 72.4% vs 15.7% for Haiku 4.5; Terminal-Bench 4.0 39.2% vs 0.0%; GDPval-AA Elo 1620 vs 735. Pricing $0.10 in/$0.50 out/$0.01 cache reads for prompts up to 100K (~90% of Haiku 4.5 requests). First Haiku with adjustable effort. Sonnet 5.5 cache reads cut $0.20 -> $0.10 (~20% off agentic work).", "angle": "Small-model price floor drops again; subagent economics shift.", "tweetA": "Terminal-Bench from 0.0% to 39.2% in one small-model generation at a quarter of the price. Subagent work just stopped being a cost line. $GOOGL $MSFT $AMZN", "tweetB": "$0.10 per million input tokens. A million-token context costs ten cents. Compare that to an hour of human reading time. That's the number for unit-economics models.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/ai-agents-weekly-claude-haiku-55"}, {"id": 19, "cat": "AI/infra", "urgency": "watch", "source": "AI Agents Weekly / Founders Corner", "title": "Open-weight frontier: Reflection Beam (501B total, 23B active) and Mistral Large 4 (1T params, 4,000 GPUs)", "idea": "Beam activates 23B of 501B params per token, reportedly matches GLM 5.2 using 3-4x less compute, trained on 10,500 GB300s for four weeks; Apache 2.0 later this month. Mistral Large 4 via guardrail endpoint, open weights after safety testing, trained on 4,000 Nvidia GPUs.", "angle": "Sparse MoE efficiency keeps compounding; training clusters are small by hyperscaler standards.", "tweetA": "10,500 GB300s for four weeks produced an Apache-licensed 501B model. Mistral did 1T on 4,000 GPUs. Compute needed per frontier-ish model keeps falling while capex guidance keeps rising. One of those curves is wrong. $NVDA", "tweetB": "23B active of 501B is a 4.6% activation ratio. Inference cost follows active params, not total. That's the open-weight margin attack on closed APIs.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/ai-agents-weekly-claude-haiku-55"}, {"id": 20, "cat": "AI/infra", "urgency": "watch", "source": "AI Agents Weekly", "title": "Agent plumbing: Personal Agent Protocol (Meta+Sierra), OpenAI Decisions API, Devin 'Dreaming', Google Gemini Agent", "idea": "Issue headlines: Meta and Sierra propose Personal Agent Protocol; OpenAI opens Decisions API; Devin gets Memory and Dreaming; Google launches Gemini agent where each agent gets its own Workspace account and audit trail, with Claude models available inside; GPT-6 generates interactive UIs.", "angle": "Standards war for agent identity/permissions; rails matter more than models.", "tweetA": "Meta/Sierra protocol, OpenAI Decisions API, Google agents with their own email accounts. Everyone is building identity and permission rails for agents. The model is the commodity, the audit trail is the product. $GOOGL $META", "tweetB": "Google shipping Claude inside its own agent tells you where it thinks differentiation lives. Not in the weights.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://nlp.elvissaravia.com/p/ai-agents-weekly-claude-haiku-55"}, {"id": 21, "cat": "venture", "urgency": "deep", "source": "The Founders Corner", "title": "VC/funds: Forbion $2.6B biotech, Headline $400M Europe, Manus >$500M round after Meta deal reversal", "idea": "Manus raised >$500M led by Boyu and IDG after Meta deal reversal, plus Manus 2.0 and Cue. Forbion $2.6B biotech, Headline $400M for European founders, Endeavor Catalyst $320M, Linse $150M deep tech, LAUNCHub EUR65M first close, Enable Ventures $50.31M. Directory of 903 European seed funds (287 with direct email).", "angle": "Chinese-origin agent company funded by Chinese VCs after US acquirer walked.", "tweetA": "Meta's deal on Manus reversed, and Boyu and IDG put in $500M+ within weeks. The geopolitics of AI M&A is now a funding event for the other side. $META", "tweetB": "A $2.6B biotech fund and a $400M European fund in the same week. Europe's capital is moving toward deep tech while its sovereign spreads widen. Different clocks.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/903-european-seed-funds-how-to-evaluate"}, {"id": 22, "cat": "AI/infra", "urgency": "watch", "source": "The Founders Corner", "title": "Agent harness: $200 and 6 hours without vs $9 and 20 minutes with", "idea": "Article claims an agent harness (execution loop, tools, memory, state, permissions, completion criteria) matters: one comparison puts a harnessed run at $9/20 minutes vs $200/six hours without. Cites DoorDash, OpenAI repo, Anthropic role design. Also: GTM operations shifting to coding agents + Git; hiring now tests 'first 20% of the problem'.", "angle": "Harness over model: moat location. Anecdotal comparison, treat with caution.", "tweetA": "22x cost and 18x time gap between the same model with and without a harness. If that holds even at 5x, the value capture sits in the scaffolding, not the weights. Look at who sells scaffolding. $NOW $TEAM", "tweetB": "Hiring teams now test the first 20% of a problem because AI does the rest. That's a labor-market sentence: the junior ladder is the 80%.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/903-european-seed-funds-how-to-evaluate"}, {"id": 23, "cat": "culture", "urgency": "watch", "source": "Herb Greenberg", "title": "ChatGPT hallucinated, then self-corrected: Takagi water heaters discontinued by A.O. Smith", "idea": "Greenberg's photo-of-a-nameplate query returned 'discontinued'; Takagi's website showed the product live, AI agreed, then on a deeper search found the SupplyHouse fine print. Phone calls to a supplier and A.O. Smith confirmed the brand is discontinued. AlphaSense showed no filing or press release. A.O. Smith up ~25% since 2019 but rocky for two years.", "angle": "Real-world fact beat both the AI and the company website - and nobody disclosed it. A stock-signal without a press release.", "tweetA": "The AI said 'discontinued.' The company website said 'live.' The AI backed off. A phone call said the AI was right. And AlphaSense had nothing, because no one disclosed it. The edge is still the phone call. $AOS", "tweetB": "A brand wind-down that never hit a filing or release is the kind of detail you only find by being a customer. Channel checks are alive.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.herbgreenberg.com/p/red-flagette-how-ai-beat-me-at-my"}, {"id": 24, "cat": "tech", "urgency": "watch", "source": "McKinsey (Monthly Highlights)", "title": "McKinsey Tech Trends 2026: 14 trends in three buckets", "idea": "Featured story by Chui, Roberts, Catlin on 14 technology trends grouped as the AI revolution, compute/connectivity frontiers, and cutting-edge engineering. Others: configuring operating models for AI value capture, how farmers adapt to tighter economics and changing purchasing behavior, strategy as fast-growing arenas reshape competition. Newsletter is a link digest; no trend-level numbers in the email.", "angle": "Charts/data inside the article - worth opening.", "tweetA": "McKinsey sorts 14 tech trends into AI, compute and connectivity, and engineering. The tell is what's absent from the headline: no category for 'power.' Where does the electricity come from? $VST $CEG", "tweetB": "Farmers adapting to tighter economics and changing purchasing behavior is the sleeper in the digest. Ag inputs are a trade if purchasing behavior is the story.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.mckinsey.com/capabilities/mckinsey-technology/our-insights/the-top-trends-in-tech"}];

var catF='all',urgF='all',srcF=null;

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toggle(id){var e=document.getElementById('c'+id);e.classList.toggle('open');}
function filterBySrc(name){srcF=name;catF='all';urgF='all';render(true);}
function setCat(c){catF=c;srcF=null;render(false);}
function setUrg(u){urgF=u;srcF=null;render(false);}
function render(expand){
  var cats=[];ITEMS.forEach(function(i){if(cats.indexOf(i.cat)<0)cats.push(i.cat);});
  var h='<span class="pill" onclick="setCat(\'all\')" style="'+(catF=='all'?'background:#333;color:#fff':'')+'">All '+ITEMS.length+'</span>';
  cats.forEach(function(c){var n=ITEMS.filter(function(i){return i.cat==c;}).length;var a=catF==c;h+='<span class="pill" onclick="setCat(\''+c+'\')" style="'+(a?'background:'+COL[c]+';border-color:'+COL[c]+';color:#fff':'')+'">'+c+' '+n+'</span>';});
  document.getElementById('cats').innerHTML=h;
  var u='';[['all','All'],['act','🔴 Act Now'],['deep','🔵 Deep'],['watch','🟡 Watch']].forEach(function(p){var n=p[0]=='all'?ITEMS.length:ITEMS.filter(function(i){return i.urgency==p[0];}).length;u+='<span class="pill" onclick="setUrg(\''+p[0]+'\')" style="'+(urgF==p[0]?'background:#333;color:#fff':'')+'">'+p[1]+' '+n+'</span>';});
  document.getElementById('urg').innerHTML=u;
  var out='';
  ITEMS.forEach(function(item){
    if(catF!='all'&&item.cat!=catF)return;if(urgF!='all'&&item.urgency!=urgF)return;if(srcF&&item.source.indexOf(srcF)<0)return;
    var c=COL[item.cat]||'#888';
    out+='<div class="card'+(expand?' open':'')+'" id="c'+item.id+'"><div class="hd" onclick="toggle('+item.id+')"><span class="num">'+item.id+'</span><span>'+UE[item.urgency]+'</span><span class="badge" style="background:'+c+'">'+esc(item.source)+'</span><span class="tag">'+item.cat+'</span>'+(item.charts.hot?'<span>🔥</span>':(item.charts.count?'<span>📊</span>':''))+'<span class="ttl">'+esc(item.title)+'</span></div><div class="body"><div class="lbl">The Idea</div><div>'+esc(item.idea)+'</div><div class="lbl">My Angle</div><div class="angle" style="border-color:'+c+';background:'+c+'14">'+esc(item.angle)+'</div><div class="tw"><div><div class="lbl" style="color:#378add">TWEET A</div>'+esc(item.tweetA)+'<br>'+'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div><div><div class="lbl" style="color:#7f77dd">TWEET B</div>'+esc(item.tweetB)+'<br>'+'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>'+(item.charts.count||item.charts.desc?'<div class="chart'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING · ':'')+item.charts.count+' chart(s): '+esc(item.charts.desc)+'</div>':'')+'<p><a href="'+item.link+'" target="_blank">↗ Read full article</a></p></div></div>';
  });
  document.getElementById('list').innerHTML=out;
}
function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';

  Object.keys(srcs).forEach(function(s){r+='<span class="src" onclick="filterBySrc(this.getAttribute(\'data-s\'))" data-s="'+esc(s)+'">'+esc(s)+'</span> ('+srcs[s]+')<br>';});
  r+='</p><p><b>Skipped:</b><br>'+META.skippedSources.map(esc).join('<br>')+'</p>';
  document.getElementById('repb').innerHTML=r;
  render(false);
}
