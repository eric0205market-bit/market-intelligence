nation and contaminated produce, but the supply chain is so much simpler that you'll find it out quickly and deal with it,", "locator": "Joseph Eisenberg, a professor of epidemiology", "quote_verified": true}, {"claim": "Drought and global warming raise cyclospora risk through a specific mechanism: when the primary water supply becomes constrained, growers must switch to alternative sources with potential contamination points, and contaminated irrigation water is thought to be the most likely vehicle for spreading cyclospora to fresh produce.", "speaker": "Brian Schaneberg", "type": "causal", "entities": ["Brian Schaneberg", "Institute for Food Safety and Health", "Illinois Institute of Technology", "drought", "cyclospora"], "conviction": "high", "so_what": "Water scarcity transmits into recall frequency via irrigation source-switching — a concrete channel by which climate stress becomes a food-company earnings risk.", "quote": "If you're getting into drought season and the water supply is becoming an issue, then you're having to get another source that has potential contamination points,", "locator": "Brian Schaneberg, executive director of the Institute for Food Safety and Health", "quote_verified": true}, {"claim": "Foodborne illness risk is seasonally peaked regardless of this outbreak, because pathogens proliferate in warm temperatures and outdoor food service events provide ideal conditions for microbial growth.", "speaker": "Brian Schaneberg", "type": "framework", "entities": ["Brian Schaneberg", "food safety", "pathogens"], "conviction": "high", "so_what": "Summer is the structurally elevated window for recall events, so clustering of incidents in these months is expected rather than evidence of deteriorating industry standards.", "quote": "This is the time that pathogens like to proliferate.", "locator": "There's always risk with fresh produce", "quote_verified": true}]}], "insight_total": 10, "top_entities": ["cyclospora", "Taylor Farms", "Taylor Fresh Foods", "Taco Bell", "Michigan", "salmonella", "Kali Kniel", "Joseph Eisenberg", "Brian Schaneberg", "Illinois Institute of Technology"], "source_meta": {"author": "Emily Mullin", "word_count": 872, "paywalled": false}}, {"record_id": "d154cdbad73c3577", "source_type": "technology", "source_name": "Wired", "source_url": "https://www.wired.com/story/patagonia-past-season-sale-2026/", "title": "8 Great Deals From Patagonia’s Past-Season Sale", "published_date": "2026-08-12", "language": "en", "processed_at": "2026-08-13T11:29:22Z", "processor": "claude-code-sub-opus", "tags": [], "gist": "An affiliate shopping roundup of Patagonia's annual past-season sale, with discounts up to 40 percent off and one item (the Insulated Fjord Flannel at $99) marked down 50 percent. The only durable signal beyond the price list is the reviewer's positioning claim that the $132 Torrentshell is 95 percent as good as the Arc'teryx Beta SL at less than half the price, and the note that recycled polyester and PFC-free DWR finishes now run through Patagonia's mainstream line.", "themes": [{"theme": "Markdown depth in the annual clearance", "insights": [{"claim": "Patagonia's annual past-season sale is running discounts up to 40 percent off regular price across categories from base layers to duffel bags, with specific markdowns including the Torrentshell 3L rain jacket at $132 ($57 off), the Nano Puff at $160 ($69 off), the R1 Fleece Pullover at $93 ($62 off), and the Black Hole 55L Duffel at $125 ($54 off).", "speaker": "Scott Gilbertson", "type": "data_point", "entities": ["Patagonia", "Torrentshell", "Nano Puff", "R1 Fleece", "Black Hole Duffel"], "conviction": "high", "so_what": "A structured annual clearance at up to 40 percent is how a full-price outdoor brand manages carryover inventory without running perpetual promotions that would erode its price integrity.", "quote": null, "locator": "Patagonia’s annual past-season sale is underway", "quote_verified": false}, {"claim": "The deepest cut in the sale is the Men's Insulated Fjord Flannel Shirt at $99 with $99 off — a full 50 percent markdown, well beyond the advertised 40 percent ceiling.", "speaker": "Scott Gilbertson", "type": "data_point", "entities": ["Patagonia", "Fjällräven"], "conviction": "high", "so_what": "Individual SKUs cut below the headline discount rate signal genuinely stranded inventory in that category rather than a planned promotional tier.", "quote": null, "locator": "Men’s Insulated Fjord Flannel Shirt $99", "quote_verified": false}, {"claim": "Sale availability is constrained by broken assortments rather than curated selection — the reviewer notes discounts vary by size and color and that the Torrentshell's sale colors and sizes are extremely limited.", "speaker": "Scott Gilbertson", "type": "anecdote", "entities": ["Patagonia", "Torrentshell"], "conviction": "high", "so_what": "Fragmented size and color runs indicate true leftover stock, not made-for-outlet production — which is what makes past-season events a real gauge of a brand's sell-through.", "quote": null, "locator": "Some of the discounts vary based on size and color", "quote_verified": false}]}, {"theme": "Value positioning against premium technical brands", "insights": [{"claim": "The three-layer Torrentshell at $132 is characterized as 95 percent as good as the Arc'teryx Beta SL at less than half the price, positioning Patagonia's basic shell as the rational substitute for the premium technical benchmark.", "speaker": "Scott Gilbertson", "type": "thesis", "entities": ["Patagonia", "Torrentshell", "Arc'teryx"], "conviction": "high", "so_what": "Explicit 'good enough at half the price' framing from trusted reviewers is the mechanism by which premium outdoor brands lose the mid-market — a real pressure point on Arc'teryx pricing power.", "quote": "This jacket is 95 percent as good and less than half the price of the Arc'teryx Beta SL everyone seems to love.", "locator": "The Torrentshell is Patagonia's basic, no-nonsense, three-layer rain shell", "quote_verified": true}, {"claim": "The reviewer is willing to recommend products he actively dislikes on utility grounds — he keeps the Houdini in his day-hiking kit because it packs to the size of a tennis ball and blocks wind, while saying it rustles, is not very breathable, and feels like wearing a plastic bag.", "speaker": "Scott Gilbertson", "type": "anecdote", "entities": ["Patagonia", "Houdini"], "conviction": "high", "so_what": "Mixed verdicts inside an affiliate roundup are the credibility mechanism that keeps commerce content converting — the format only works if the negatives survive editing.", "quote": "What I don't like is that it rustles, it's not very breathable, and I feel like I'm wearing a plastic bag when I use it.", "locator": "The Houdini is an extremely useful jacket that I don't love", "quote_verified": true}]}, {"theme": "Recycled materials and durability as the brand asset", "insights": [{"claim": "Recycled inputs and PFC-free finishes now run through Patagonia's mainstream line rather than a specialty range — the Torrentshell uses recycled fabric with a PFC-free DWR finish, Capilene base layers are 100 percent recycled polyester, and the Black Hole duffel and waist pack use 100 percent recycled polyester and ripstop nylon.", "speaker": "Scott Gilbertson", "type": "framework", "entities": ["Patagonia", "Capilene", "Black Hole Duffel", "Torrentshell"], "conviction": "high", "so_what": "PFC-free DWR across a volume line means the reformulation cost is already absorbed here, leaving competitors still using PFAS-based finishes exposed to the coming restrictions.", "quote": null, "locator": "Capilene is spun from 100 percent recycled polyester", "quote_verified": false}, {"claim": "The durability claim is concrete rather than rhetorical: testers have used the 40-liter Black Hole duffel for 15 years without the TPU laminate peeling.", "speaker": "Scott Gilbertson", "type": "data_point", "entities": ["Patagonia", "Bla ies": ["Crunchyroll", "Netflix", "HBO Max", "Hulu"], "conviction": "high", "so_what": "No platform can win the category on catalog alone, which sustains multi-subscription behavior among anime viewers and keeps licensing costs bid up across all four.", "quote": null, "locator": "Note that many of these picks are available in both the original Japanese audio", "quote_verified": false}, {"claim": "Rights are frequently non-exclusive: Jujutsu Kaisen is listed on Crunchyroll, Netflix, and Hulu simultaneously, Frieren on both Crunchyroll and Netflix, while the Studio Ghibli catalog including Spirited Away, Kiki's Delivery Service, and Nausicaä sits on HBO Max and Hulu.", "speaker": "Megan Tomos", "type": "data_point", "entities": ["Jujutsu Kaisen", "Frieren", "Studio Ghibli", "Crunchyroll", "Netflix", "HBO Max", "Hulu"], "conviction": "high", "so_what": "Non-exclusive series licensing alongside a bundled Ghibli film library shows Japanese rights holders keeping leverage rather than selling exclusivity — a structurally better position than Western studios accepted.", "quote": null, "locator": "Watch on CrunchyrollWatch on NetflixWatch on Hulu", "quote_verified": false}, {"claim": "Dual-audio availability is now the norm rather than the exception, with most titles offered in original Japanese with subtitles or with English voice-actor dubs — Fruits Basket illustrating the split, with Hulu carrying only the dub and Crunchyroll carrying both.", "speaker": "Megan Tomos", "type": "framework", "entities": ["Fruits Basket", "Crunchyroll", "Hulu"], "conviction": "high", "so_what": "Localization depth is the removable barrier to Western mainstreaming, and dub rights are a distinguishable asset that can be licensed separately from the original.", "quote": null, "locator": "Hulu has the English dubbed version, and Crunchyroll has both", "quote_verified": false}]}, {"theme": "Cross-border IP pipelines and box office scale", "insights": [{"claim": "Solo Leveling was adapted from a South Korean web novel and webtoon by the Japanese animation studio A-1 Pictures, evidencing a cross-border pipeline in which Korean source IP feeds Japanese production capacity.", "speaker": "Megan Tomos", "type": "data_point", "entities": ["Solo Leveling", "A-1 Pictures", "South Korea", "Crunchyroll"], "conviction": "high", "so_what": "Webtoon platforms are functioning as a proving ground that de-risks anime commissioning — a durable content-sourcing advantage for whoever owns the Korean serialized IP.", "quote": null, "locator": "Adapted from a South Korean web novel and webtoon", "quote_verified": false}, {"claim": "Demon Slayer: Kimetsu no Yaiba is characterized as one of the biggest animation phenomenons of the decade, with movie spinoffs that have broken box office records across four seasons of the series.", "speaker": "Megan Tomos", "type": "data_point", "entities": ["Demon Slayer", "Crunchyroll", "box office"], "conviction": "high", "so_what": "Theatrical anime has become a record-setting box office category, which changes the release economics for the format from streaming-first back toward windowed theatrical.", "quote": null, "locator": "It is also one of the biggest animation phenomenons of the decade", "quote_verified": false}, {"claim": "Prestige hand-drawn animation carries extreme production timelines — Isao Takahata's The Tale of the Princess Kaguya took eight years to make — while Spirited Away in 2003 became the first non-English-language film to win the Academy Award for Best Animated Feature.", "speaker": "Megan Tomos", "type": "data_point", "entities": ["Isao Takahata", "The Tale of the Princess Kaguya", "Spirited Away", "Hayao Miyazaki", "Studio Ghibli"], "conviction": "high", "so_what": "Eight-year hand-drawn production cycles explain why the prestige catalog is small and its library value durable — scarce supply that streaming bidders cannot replicate quickly.", "quote": null, "locator": "Japan’s most famous folklore reimagined in a hand-drawn masterpiece", "quote_verified": false}]}, {"theme": "Converting the resistant audience", "insights": [{"claim": "The stated barrier to anime adoption is an outdated stereotype held by people whose reference point is a few seconds of anime seen in the early 2000s, which the piece counters by arguing Japan has produced emotionally resonant and visually audacious storytelling for half a century that looks nothing like that stereotype.", "speaker": "Megan Tomos", "type": "thesis", "entities": ["anime", "Japan"], "conviction": "high", "so_what": "The remaining growth in the category is conversion of actively resistant viewers, not deeper penetration of existing fans — which is a marketing problem, not a content one.", "quote": null, "locator": "Despite its ferocious popularity, people still tend to swear off anime", "quote_verified": false}, {"claim": "The recommended on-ramp is deliberately structured by commitment level — self-contained films watchable in a single evening before graduating to multi-season series — and every pick is chosen so that no prior knowledge of anime or Japan is required.", "speaker": "Megan Tomos", "type": "framework", "entities": ["anime", "Japan"], "conviction": "high", "so_what": "Low-commitment single films as the acquisition funnel and multi-season series as the retention product is the same ladder streaming services need for the category.", "quote": "The common thread, if you’re keeping score, is that not one of these requires you to know anything about anime, or Japan for that matter, going in.", "locator": "So here’s a case for the uninitiated", "quote_verified": true}]}], "insight_total": 8, "top_entities": ["Crunchyroll", "Netflix", "HBO Max", "Hulu", "Solo Leveling", "A-1 Pictures", "Demon Slayer", "Studio Ghibli", "Hayao Miyazaki", "Spirited Away", "Jujutsu Kaisen"], "source_meta": {"author": "Megan Tomos", "word_count": 1293, "paywalled": false}}, {"record_id": "8908430ccf67316e", "source_type": "technology", "source_name": "Wood rs in Europe and the US are treating them as a new point of strategic vulnerability rather than a commodity component.", "speaker": "Sylvia Leyva Martinez", "type": "thesis", "entities": ["solar inverters", "Europe", "US", "grid stability", "batteries"], "conviction": "high", "so_what": "Inverter vendors now carry political risk premia and discounts that have nothing to do with efficiency or price; underwrite them like network equipment, not like hardware.", "quote": "they are also being treated as a new point of strategic vulnerability", "locator": "Solar demand remains strong, storage is scaling fast", "quote_verified": true}, {"claim": "Inverter policy has moved beyond trade protection into a mix of cybersecurity, industrial strategy and grid risk, meaning tariff-style analysis no longer explains where the rules are heading.", "speaker": "Sylvia Leyva Martinez", "type": "framework", "entities": ["solar inverter markets", "cybersecurity", "industrial policy", "grid risk"], "conviction": "high", "so_what": "Modelling inverter restrictions purely as trade barriers will misprice the tail: security-driven rules can be broader, faster and retroactive in a way tariffs are not.", "quote": "inverter policy is moving beyond trade protection and into a more complicated mix of cybersecurity, industrial strategy, and grid risk", "locator": "Host Sylvia Leyva Martinez is joined by Joe Shangraw", "quote_verified": true}, {"claim": "Solar demand remains strong and storage is scaling fast, which is what makes inverter technology increasingly central to how modern power systems actually function.", "speaker": "Sylvia Leyva Martinez", "type": "causal", "entities": ["solar", "storage", "solar inverters", "power systems"], "conviction": "high", "so_what": "Inverter chokepoints scale with solar-plus-storage growth, so security policy on inverters becomes a systemic constraint rather than a niche one.", "quote": null, "locator": "Solar demand remains strong, storage is scaling fast", "quote_verified": false}]}, {"theme": "EU funding block and vendor dependence", "insights": [{"claim": "Europe's March decision to block public EU funding for projects using Chinese-made inverters matters well beyond the projects it directly touches, because it establishes security-based exclusion as an accepted procurement principle.", "speaker": "Sylvia Leyva Martinez", "type": "thesis", "entities": ["European Union", "Chinese vendors", "solar inverters", "public EU funding"], "conviction": "medium", "so_what": "Read the March rule as a precedent, not a scope: it is the template any wider European restriction would build on.", "quote": "block public EU funding for projects using Chinese-made inverters", "locator": "They unpack why Europe made its March decision", "quote_verified": true}, {"claim": "European dependence on Chinese vendors is deepest in utility-scale string inverters and integrated battery-plus-inverter systems, which makes diversification far harder than simply switching suppliers.", "speaker": "Sylvia Leyva Martinez", "type": "causal", "entities": ["Europe", "Chinese vendors", "utility-scale string inverters", "integrated battery-plus-inverter systems"], "conviction": "high", "so_what": "Integrated battery-plus-inverter is the hardest segment to substitute, so that is where restriction-driven cost inflation and project delay will show up first.", "quote": "especially in utility-scale string inverters and integrated battery-plus-inverter systems, makes any attempt to diversify more complex than simply switching suppliers", "locator": "and why the region's dependence on Chinese vendors", "quote_verified": true}, {"claim": "Whether Europe extends inverter restrictions beyond publicly funded projects to the private market is an open and unresolved decision facing the industry.", "speaker": "Sylvia Leyva Martinez", "type": "prediction", "entities": ["Europe", "European Union", "solar inverters"], "conviction": "exploratory", "so_what": "A private-market extension is the step change that would reprice European exposure for Chinese inverter suppliers; treat it as a live binary risk.", "quote": null, "locator": "The episode also looks ahead to the next set of decisions", "quote_verified": false}]}, {"theme": "FCC Covered List: scope is the variable", "insights": [{"claim": "The FCC's July decision to add foreign power inverters to its Covered List is consequential mainly through how narrowly or broadly the rule ends up being applied, not through the headline listing itself.", "speaker": "Joe Shangraw", "type": "thesis", "entities": ["FCC", "Covered List", "power inverters", "US"], "conviction": "high", "so_what": "Track the FCC's implementing language and enforcement scope, not the announcement, before repricing US-exposed inverter names.", "quote": "the real issue is not just whether the headlines overstated the impact, but how narrowly or broadly the rule will ultimately be applied", "locator": "A large part of the discussion focuses on the FCC's July decision", "quote_verified": true}, {"claim": "The FCC's current Covered List language appears closely tied to communications hardware, especially wireless-enabled devices, which makes the measure far more nuanced than the outright market shutdown some coverage implied.", "speaker": "Joe Shangraw", "type": "contrarian", "entities": ["FCC", "Covered List", "wireless-enabled devices", "power inverters"], "conviction": "medium", "so_what": "Products without wireless communications may sit outside scope — a possible de-rating reversal for names sold off on the headline.", "quote": "the current language appears closely tied to communications hardware, especially wireless-enabled devices, which creates a more nuanced picture than an outright market shutdown", "locator": "Shangraw explains that the current language", "quote_verified": true}, {"claim": "The breadth of the Covered List rule determines not only which new inverter products fall in scope but how developers, manufacturers and asset owners approach software updates, grid-code compliance and long-term procurement risk.", "speaker": "Joe Shangraw", "type": "causal", "entities": ["FCC", "Covered List", "developers", "manufacturers", "asset owners", "grid-code compliance"], "conviction": "high", "so_what": "Second-order effect: even in-scope-exempt fleets face new diligence and update-path costs, compressing developer margins across the board.", "quote": null, "locator": "That distinction matters because it affects not only", "quote_verified": false}]}, {"theme": "Asset-life usability as the new buying test", "insights": [{"claim": "The competitive test for an inverter has shifted from cost competitiveness to whether the device can remain usable, updateable and policy-safe over the full life of the asset.", "speaker": "Sylvia Leyva Martinez", "type": "framework", "entities": ["solar inverters", "developers", "asset owners"], "conviction": "high", "so_what": "Vendors that can guarantee long-horizon software support and policy compliance can defend price; pure low-cost suppliers lose their main advantage.", "quote": "It is whether an inverter can remain usable, updateable, and policy-safe over the life of the asset.", "locator": "The challenge is no longer just cost competitiveness", "quote_verified": true}]}, {"theme": "Localisation race and deployment friction", "insights": [{"claim": "How quickly US and allied manufacturers can localise enough of the inverter supply chain to qualify under tougher domestic-content rules is a key unresolved determinant of where practical bottlenecks emerge.", "speaker": "Sylvia Leyva Martinez", "type": "prediction", "entities": ["US", "domestic-content rules", "inverter supply chain", "manufacturers"], "conviction": "medium", "so_what": "Domestic-content qualification timelines are the gating factor for US solar-plus-storage build rates; slippage means project delay, not just higher cost.", "quote": null, "locator": "how quickly US and allied manuf // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
