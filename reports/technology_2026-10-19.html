ter project by developer Servistar after its planning board criticized missed deadlines and slow development.", "speaker": "Caroline Haskins", "type": "data_point", "entities": ["Westfield", "Servistar", "boston.com"], "conviction": "medium", "so_what": "Local boards are rejecting even large projects, and execution slippage gives them grounds to do so.", "quote": null, "locator": "Westfield, Massachusetts, killed", "quote_verified": false}]}, {"theme": "Data centers as midterm issue", "insights": [{"claim": "Data centers have become the midterm season's biggest issue per the column; a protester interrupted the Maine Senate debate between Susan Collins and Troy Jackson over data center environmental impact, and Collins tried to position herself as the more anti-data center candidate.", "speaker": "Caroline Haskins", "type": "anecdote", "entities": ["Susan Collins", "Troy Jackson", "Power Play"], "conviction": "medium", "so_what": "Candidates in both parties may move to oppose data centers, raising policy risk.", "quote": null, "locator": "Maine's senate race", "quote_verified": false}]}], "insight_total": 15, "top_entities": ["7x24 Exchange International", "AFCOM", "Alex Molnar", "Sabey", "Pew Research", "CoreWeave", "Loudoun County", "Amazon", "Servistar", "Susan Collins"], "source_meta": {"author": "Caroline Haskins", "word_count": 1698, "paywalled": false}}, {"record_id": "9104ae8912bdeb38", "source_type": "technology", "source_name": "Wired", "source_url": "https://www.wired.com/story/magnesium-may-not-reach-your-brain-despite-supplement-label-promises/", "title": "Magnesium May Not Reach Your Brain, Despite Supplement Label Promises", "published_date": "2026-10-18", "language": "en", "processed_at": "2026-10-19T00:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Society"], "gist": "Magnesium supplement claims of targeted delivery to the brain or muscles are not supported: all salts break down in the intestine, absorption falls as dose rises, and the cheap oxide form mostly works as a laxative. Brain-targeting marketing (e.g. magnesium L-threonate) rests on rodent studies and small, often industry-funded human trials that never measured brain magnesium.", "themes": [{"theme": "Absorption limits of magnesium pills", "insights": [{"claim": "The body holds about 25 grams of magnesium, more than half stored in bones, with the rest in cells where it takes part in hundreds of essential reactions; need for the element does not imply that extra intake improves function.", "speaker": "Adam Obr", "type": "data_point", "entities": ["magnesium"], "conviction": "high", "so_what": "The nutritional-necessity argument is the base of supplement marketing but does not support the benefit of extra doses.", "quote": null, "locator": "Most of us probably don't think", "quote_verified": false}, {"claim": "Magnesium absorption falls as dose rises and depends on stomach contents and existing body magnesium, so bigger pills do not deliver proportionally more magnesium.", "speaker": "Adam Obr", "type": "causal", "entities": ["magnesium", "Mg2+"], "conviction": "high", "so_what": "Megadose positioning in supplements is pharmacologically weak, undermining premium high-dose products.", "quote": "the higher the dose, the less magnesium gets absorbed", "locator": "In supplement pills, magnesium isn't just on its own", "quote_verified": true}, {"claim": "Magnesium in pills comes as a salt that must dissolve to release Mg2+, the ionic form the body uses, so dissolution is the gating step for any benefit.", "speaker": "Adam Obr", "type": "framework", "entities": ["magnesium salt", "Mg2+"], "conviction": "high", "so_what": "Product quality should be judged on solubility and bioavailability, not on label claims.", "quote": null, "locator": "In supplement pills", "quote_verified": false}]}, {"theme": "Cheap oxide form is a laxative", "insights": [{"claim": "Magnesium oxide, the basis of the cheapest pills, dissolves poorly and mostly acts as a laxative by drawing water into the intestines to flush out the excess salt.", "speaker": "Adam Obr", "type": "data_point", "entities": ["magnesium oxide"], "conviction": "high", "so_what": "Low-price magnesium products deliver little systemic magnesium, so price-based comparisons mislead consumers.", "quote": null, "locator": "That's all if the supplement dissolves", "quote_verified": false}, {"claim": "Magnesium citrate has shown the highest bioavailability among magnesium compounds in laboratory tests, which is the legitimate quality differentiator versus oxide.", "speaker": "Adam Obr", "type": "data_point", "entities": ["magnesium citrate"], "conviction": "medium", "so_what": "Citrate is the defensible premium form, in contrast to exotic brain-targeted salts.", "quote": null, "locator": "There are other types of magnesium compounds", "quote_verified": false}]}, {"theme": "Brain-targeting claims are marketing", "insights": [{"claim": "Some supplement labels claim a specific chemical blend sends magnesium directly to muscles or the brain, yet all these salts still break down in the intestine, so there is no mechanism for organ targeting.", "speaker": "Adam Obr", "type": "contrarian", "entities": ["magnesium"], "conviction": "high", "so_what": "Targeted-delivery labels are a regulatory and litigation risk for supplement brands that rely on them.", "quote": null, "locator": "Despite the fact that all these salts", "quote_verified": false}, {"claim": "The brain-magnesium marketing rests on a rat study in which magnesium L-threonate raised brain magnesium and improved some learning and memory measures, using long-term doses higher than those in a pill.", "speaker": "Adam Obr", "type": "causal", "entities": ["magnesium L-threonate", "rodents"], "conviction": "high", "so_what": "Rodent-to-human extrapolation at unrealistic doses is the weak link in the premium nootropic magnesium thesis.", "quote": null, "locator": "These claims are often based on experiments using rodents", "quote_verified": false}, {"claim": "Human evidence for brain-focused magnesium is limited to a few small randomized trials of cognition or sleep that tested mixtures, lasted weeks, or measured few outcomes, and many were funded or led by supplement manufacturers.", "speaker": "Adam Obr", "type": "data_point", "entities": ["supplement manufacturers"], "conviction": "high", "so_what": "The industry-funded evidence base is conflicted, so independent replication is the catalyst that could validate or sink the category.", "quote": null, "locator": "There are some human studies", "quote_verified": false}, {"claim": "No human study measured magnesium content in the brain, so the central claim that these supplements raise brain magnesium is untested; the author concludes a brain-focused magnesium supplement is likely just an expensive laxative.", "speaker": "Adam Obr", "type": "thesis", "entities": ["magnesium", "magnesium L-threonate"], "conviction": "medium", "so_what": "Premium-priced brain magnesium products sell a mechanism with no human proof, which suggests vulnerability to price compression or scrutiny.", "quote": "a brain-focused magnesium supplement is still just an expensive laxative", "locator": "Moreover, the studies", "quote_verified": true}]}], "insight_total": 9, "top_entities": ["magnesium", "magnesium oxide", "magnesium citrate", "magnesium L-threonate", "Mg2+", "magnesium salt", "rodents", "supplement manufacturers"], "source_meta": {"author": "Adam Obr", "word_count": 610, "paywalled": false}}, {"record_id": "bdaf33294b9f2b45", "source_type": "technology", "source_name": "Wired", "source_url": "https://www.wired.com/story/climate-change-has-it-in-for-the-worlds-best-surfing/", "title": "Egypt’s Climate-Resilient ‘Super Corals’ Are Starting to Feel the Heat", "published_date": "2026-10-16", "language": "en", "processed_at": "2026-10-19T12:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Society"], "gist": "Egypt's northern Red Sea corals, long seen as a heat-proof refuge, bleached in the 2023-24 heat waves (under 10% of surveyed colonies in the north, about half further south) but recovered 75-88% within a year. Scientists dispute whether the resilience is evolutionary (a warm southern filter) or physical (current-driven vertical mixing), and both agree only emissions cuts, not local conservation, can secure the reefs long-term.", "themes": [{"theme": "Red Sea bleaching and recovery data", "insights": [{"claim": "Egypt's northern Red Sea corals were considered unusually resilient to warming, and some scientists predicted they could become the world's last-remaining corals if oceans keep heating.", "speaker": "Eli Siegel-Bernstein", "type": "prediction", "entities": ["Red Sea", "Mahmoud Hanafy", "Suez Canal University", "HEPCA"], "conviction": "medium", "so_what": "Climate-refuge narratives for reefs underpin conservation funding and blue-economy pitches, and are now being tested.", "quote": null, "locator": "As coral reefs have undergone massive bleaching", "quote_verified": false}, {"claim": "Summer heat waves in 2023 and 2024 strained Red Sea coral ecosystems, and a HEPCA survey found bleaching throughout the Red Sea in 2024: less than a tenth of surveyed colonies in the north were affected, but about half were lost further south.", "speaker": "Eli Siegel-Bernstein", "type": "data_point", "entities": ["HEPCA", "Mahmoud Hanafy", "Red Sea"], "conviction": "high", "so_what": "A north-south gradient in damage means exposure risk for reef-dependent assets such as tourism varies sharply by location.", "quote": null, "locator": "But in the summers of 2023 and 2024", "quote_verified": false}, {"claim": "HEPCA's preliminary estimates a year after the 2024 bleaching event put recovery rates at 75 to 88 percent depending on species and location, far stronger than elsewhere, where many reefs are only beginning to recover if they show any progress at all.", "speaker": "Eli Siegel-Bernstein", "type": "data_point", "entities": ["HEPCA", "Red Sea"], "conviction": "medium", "so_what": "Fast rebound supports the case that Red Sea reefs remain a relative refuge despite bleaching, though the figures are preliminary.", "quote": null, "locator": "There are signs of recovery", "quote_verified": false}, {"claim": "Reefs cover less than 1 percent of the seafloor yet support at least 25 percent of marine species, so reef loss has outsized ecosystem consequences.", "speaker": "Eli Siegel-Bernstein", "type": "data_point", "entities": ["United Nations Environment Program"], "conviction": "high", "so_what": "Concentrated biodiversity value is the basis for the argument that small reef areas deserve disproportionate protection funding.", "quote": null, "locator": "United Nations Environment Program", "quote_verified": false}]}, {"theme": "Why the reefs resisted: evolution vs circulation", "insights": [{"claim": "KAUST ecologist Eslam Osman argues Egyptian corals' heat tolerance stems from evolutionary history: corals entered the Red Sea through the very warm Bab al-Mandab strait, which acted as a natural filter so only heat-tolerant genotypes survived and spread north.", "speaker": "Eslam Osman", "type": "thesis", "entities": ["Eslam Osman", "KAUST", "Bab al-Mandab", "Red Sea"], "conviction": "medium", "so_what": "If tolerance is genetic, it is portable, which supports selective breeding or restoration with Red Sea genotypes elsewhere.", "quote": null, "locator": "Corals are believed to have spread", "quote_verified": false}, {"claim": "Mahmoud Hanafy doubts that evolutionary history is the primary explanation and emphasizes water circulation: changing current directions in the northern Red Sea create vertical mixing that brings cooler deep water to the surface and buffers corals even when air temperatures stay high.", "speaker": "Mahmoud Hanafy", "type": "thesis", "entities": ["Mahmoud Hanafy", "Red Sea"], "conviction": "medium", "so_what": "If protection is physical oceanography rather than biology, // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
