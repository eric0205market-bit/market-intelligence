ater public awareness could support higher defence spending for a two-pronged approach of aid to Ukraine plus tailored infrastructure security, which may be less expensive overall than exclusively rearming national militaries for a future conflict.", "speaker": "Chatham House", "type": "contrarian", "entities": ["Ukraine", "defence spending"], "conviction": "medium", "so_what": "Suggests a spending mix tilted toward infrastructure security and resilience rather than only conventional rearmament.", "quote": "Financially, this might also be less expensive overall than exclusively focusing on rearming national militaries for a future conflict.", "locator": "Increasing public awareness of what is at stake", "quote_verified": true}, {"claim": "Without a forward-looking, unified approach, Europe risks giving Russia, Iran and other aggressors the upper hand in any future conflict escalation; the risks of inaction far outweigh the costs of acting now.", "speaker": "Chatham House", "type": "prediction", "entities": ["Russia", "Iran", "Europe"], "conviction": "high", "so_what": "Author sees escalation risk as asymmetric to Europe's downside absent coordinated action.", "quote": "The risks of inaction far outweigh any costs of acting now.", "locator": "Without a more forward-looking and unified approach", "quote_verified": true}]}], "insight_total": 17, "top_entities": ["Russia", "Iran", "Ukraine", "NATO", "UK Ministry of Defence", "Leipzig Airport", "Germany", "France", "Estonia", "Poland", "YouGov", "Sahaidachnyi Security Center"], "source_meta": {"author": "", "word_count": 1291, "paywalled": false}}, {"record_id": "eb7d3af9948a8771", "source_type": "concepts", "source_name": "ECB Blog", "source_url": "https://www.ecb.europa.eu/press/blog/date/2026/html/ecb.blog20261124~6486644873.en.html", "title": "Looking beyond the baseline: how scenario synthesis helps assess risks", "published_date": "2026-11-24", "language": "en", "processed_at": "2026-11-25T11:10:00Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Energy", "Geopolitics"], "gist": "ECB staff explain 'scenario synthesis', which weights baseline and alternative scenarios to match reference risk measures (market-implied, SPF, QRA). Applied to Middle East conflict scenarios in 2026, markets put more weight on adverse/severe inflation outcomes than forecasters, with relevance shifting around the US–Iran memorandum and renewed July tensions.", "themes": [{"theme": "Why the ECB needs scenarios beyond the baseline", "insights": [{"claim": "The ECB Governing Council does not focus solely on the most likely forecast for inflation and growth; it also assesses risks and uncertainty around the outlook using statistical risk measures, the staff quantitative risk assessment (QRA), and sensitivity and scenario analysis.", "speaker": "European Central Bank", "type": "framework", "entities": ["ECB", "Governing Council", "QRA"], "conviction": "high", "so_what": "ECB policy decisions weigh the risk distribution, not just the point forecast, so risk-assessment shifts can move policy even with an unchanged baseline.", "quote": "When the ECB’s Governing Council makes monetary policy decisions, it does not focus solely on the most likely forecast for inflation and growth.", "locator": "Why are scenarios needed?", "quote_verified": true}, {"claim": "According to the ECB, no single approach captures every aspect of uncertainty; each risk tool offers a different perspective on the risks facing the economy.", "speaker": "European Central Bank", "type": "thesis", "entities": ["ECB"], "conviction": "high", "so_what": "Expect the ECB to triangulate across multiple risk tools rather than anchor on one model.", "quote": "No single approach captures every aspect of uncertainty – each offers a different perspective on the risks facing the economy.", "locator": "To do so, the ECB uses", "quote_verified": true}, {"claim": "Scenario analysis complements statistical risk measures by providing narratives: it explores specific risk events such as an energy shock, geopolitical escalation, trade disruption or tighter financial conditions and illustrates the channels through which they affect inflation and growth.", "speaker": "European Central Bank", "type": "framework", "entities": ["energy shock", "geopolitical escalation", "trade disruption"], "conviction": "high", "so_what": "The ECB's scenario set signals which specific shocks (energy, geopolitics, trade, financial conditions) it considers policy-relevant.", "quote": "Scenarios explore specific risk events such as an energy shock, a geopolitical escalation, a trade disruption or tighter financial conditions", "locator": "Scenario analysis complements the statistical risk", "quote_verified": true}, {"claim": "During structural change or heightened geopolitical stress, risk measures based mainly on past events and data may understate the risks and the range of possible outcomes, which scenarios help address.", "speaker": "European Central Bank", "type": "causal", "entities": ["ECB"], "conviction": "high", "so_what": "In regime shifts, historically calibrated risk bands are likely too narrow; scenario tails deserve more weight.", "quote": "risk measures based mainly on past events and data may understate the risks involved and the range of possible outcomes", "locator": "Second, scenarios help policymakers examine", "quote_verified": true}]}, {"theme": "Lesson from the 2022 energy crisis", "insights": [{"claim": "In March 2022 ECB staff projections, the statistical risk band around the baseline 2022 HICP inflation forecast of 5.1% year-on-year, built on historical model residuals, did not capture the actual outcome of 8.4%.", "speaker": "European Central Bank", "type": "data_point", "entities": ["HICP", "ECB-BASE", "Russia", "Ukraine"], "conviction": "high", "so_what": "Residual-based uncertainty bands materially underestimated the post-invasion inflation surge; treat such bands skeptically in shock periods.", "quote": "did not capture the actual inflation outcome of 8.4% year-on-year", "locator": "A clear example of this", "quote_verified": true}, {"claim": "The adverse and severe scenarios in March 2022, centred around 5.9% and 7.1% HICP inflation respectively, highlighted risks that historical residuals alone missed and brought the risk assessment closer to what ultimately occurred.", "speaker": "European Central Bank", "type": "data_point", "entities": ["HICP"], "conviction": "high", "so_what": "Scenario tails proved a better guide than statistical bands during the energy crisis, supporting their growing role in ECB policy.", "quote": "the adverse and severe scenarios, respectively concentrated around 5.9% and 7.1%, highlighted risks that historical residuals alone would have missed", "locator": "A clear example of this", "quote_verified": true}]}, {"theme": "Scenario synthesis method", "insights": [{"claim": "Reference risk measures such as the Eurosystem QRA, options-implied distributions from financial markets, or professional forecasters' probability assessments show the balance of risks but lack an underlying narrative and do not explain why risk perceptions shift.", "speaker": "European Central Bank", "type": "framework", "entities": ["QRA", "Eurosystem"], "conviction": "high", "so_what": "Market-implied inflation distributions alone don't explain drivers; pairing them with scenarios gives a narrative for repricing.", "quote": "However, they do not come with an underlying narrative; nor do they explain the relative importance of individual risk events or why risk perceptions are shifting.", "locator": "Scenario synthesis: linking narratives and risk measures", "quote_verified": true}, {"claim": "Scenario synthesis combines the baseline outlook with alternative scenarios by assigning each a weight so that the resulting synthetic distribution best matches an overall reference risk measure.", "speaker": "European Central Bank", "type": "framework", "entities": ["scenario synthesis"], "conviction": "high", "so_what": "Gives a quantitative way to map market or survey risk pricing onto named ECB scenarios.", "quote": "It combines the baseline outlook with a set of alternative scenarios in a way that best matches one of these overall reference risk measures.", "locator": "Scenario synthesis provides that missing link.", "quote_verified": true}, {"claim": "Scenario synthesis weights should not be read as probabilities that scenarios will materialise; they indicate how relevant each scenario is for representing the risks in the reference measure, given the other scenarios included.", "speaker": "European Central Bank", "type": "framework", "entities": ["scenario synthesis"], "conviction": "high", "so_what": "Avoid misreading ECB scenario weights as event probabilities in market commentary.", "quote": "Importantly, these weights should not be interpreted as probabilities that the scenarios will materialise.", "locator": "Scenario synthesis provides that missing link.", "quote_verified": true}, {"claim": "The ECB uses scenario synthesis in three ways: assessing scenario relevance against different risk measures, tracking how relevance evolves over time with frequently updated market measures, and checking whether the scenario set covers a broad enough range of risks.", "speaker": "European Central Bank", "type": "framework", "entities": ["ECB", "ECB-BASE"], "conviction": "high", "so_what": "Signals the ECB will increasingly reference market-implied risk shifts when communicating scenario relevance.", "quote": null, "locator": "Applications", "quote_verified": false}]}, {"theme": "Middle East conflict: markets vs forecasters", "insights": [{"claim": "For euro area HICP inflation in Q1 2027, the market-based risk measure in June 2026 was more dispersed than baseline uncertainty, with substantially more probability mass at higher inflation rates.", "speaker": "European Central Bank", "type": "data_point", "entities": ["HICP", "euro area", "Bloomberg"], "conviction": "high", "so_what": "Markets were pricing materially more upside inflation risk than ECB baseline uncertainty implied.", "quote": "The market-based measure is more dispersed, with substantially more probability mass at higher inflation rates.", "locator": "Panel a of Chart 3", "quote_verified": true}, {"claim": "The Survey of Professional Forecasters' Q2 2026 risk measure was close to the ECB baseline, somewhat narrower and peaking at a slightly lower inflation rate than baseline.", "speaker": "European Central Bank", "type": "data_point", "entities": ["Survey of Professional Forecasters", "SPF"], "conviction": "high", "so_what": "A gap between SPF and market inflation risk pricing indicates potential mispricing or a risk premium to monitor.", "quote": "By contrast, the SPF’s measure is close to the baseline, although somewhat narrower and with its peak at a slightly lower inflation rate.", "locator": "Panel a of Chart 3", "quote_verified": true}, {"claim": "Scenario synthesis weights show professional forecasters closest to the baseline, while financial markets placed more weight on the adverse and severe Middle East conflict scenarios from the June 2026 Eurosystem staff projections.", "speaker": "European Central Bank", "type": "data_point", "entities": ["Middle East", "Eurosystem", "SPF"], "conviction": "high", "so_what": "Market inflation pricing was skewed toward adverse geopolitical outcomes relative to forecasters.", "quote": "professional forecasters remain closest to the baseline. Meanwhile, financial markets place more weight on the adverse and severe scenarios.", "locator": "Panel b shows how the scenarios", "quote_verified": true}]}, {"theme": "Shifting market risk perceptions and scenario coverage", "insights": [{"claim": "By 30 June 2026, around the ceasefire and the Memorandum of Understanding agreed between the United States and Iran on 26 June, markets saw lower euro area inflation risks than on 11 June, with the milder scenario becoming more relevant.", "speaker": "European Central Bank", "type": "data_point", "entities": ["United States", "Iran", "Middle East", "euro area"], "conviction": "high", "so_what": "Geopolitical de-escalation quickly compressed market-implied euro area inflation risk.", "quote": "by 30 June, around the announcement of a ceasefire in the Middle East, markets saw lower inflation risks than on 11 June, although uncertainty remained", "locator": "Tracking evolving market-based risk perceptions", "quote_verified": true}, {"claim": "By 23 July 2026, renewed regional tensions heightened energy supply concerns, market-based inflation risks rose again, and the adverse scenario was seen by markets as most relevant.", "speaker": "European Central Bank", "type": "causal", "entities": ["Middle East", "energy supply"], "conviction": "high", "so_what": "Energy-supply fears remain the key transmission channel from Middle East tensions to euro area inflation risk pricing.", "quote": "By 23 July, the geopolitical conflict had intensified further such that the adverse scenario was seen by the markets as most relevant.", "locator": "Panel b shows how the scenarios’ relative relevance", "quote_verified": true}, {"claim": "Synthetic distributions captured market-implied inflation risks reasonably well on both 11 June and 30 June 2026 despite the shift in perceptions, suggesting the ECB scenario set spans the relevant range of risks.", "speaker": "European Central Bank", "type": "data_point", "entities": ["ECB"], "conviction": "medium", "so_what": "ECB scenarios appear to bracket market risk pricing, implying limited unmodelled tail risk as of mid-2026.", "quote": "Despite this shift, the synthetic distributions capture the market-implied risks reasonably well at both dates.", "locator": "Assessing scenario set coverage of market-based risks", "quote_verified": true}, {"claim": "Scenario synthesis does not replace expert judgement, which remains essential for selecting scenarios, building their distributions and choosing the reference risk measure; it provides a transparent framework to monitor risk shifts, assess coverage and communicate uncertainty.", "speaker": "European Central Bank", "type": "thesis", "entities": ["scenario synthesis"], "conviction": "high", "so_what": "Expect ECB communication on uncertainty to lean more on scenario-based framing tied to market and survey measures.", "quote": "Scenario synthesis does not replace expert judgement.", "locator": "Conclusion", "quote_verified": true}]}], "insight_total": 17, "top_entities": ["ECB", "Governing Council", "HICP", "ECB-BASE", "QRA", "Survey of Professional Forecasters", "Middle East", "Iran", "United States", "Eurosystem", "Bloomberg", "euro area"], "source_meta": {"author": "European Central Bank", "word_count": 2386, "paywalled": false}}, {"record_id": "8be89773a1c1d2f0", "source_type": "concepts", "source_name": "Gavekal Research", "source_url": "https://research.gavekal.com/teaser/the-six-trillion-dollar-man/", "title": "The Six Trillion Dollar Man", "published_date": "2026-11-24", "language": "en", "processed_at": "2026-11-25T11:10:00Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Geopolitics", "Energy", "Positioning"], "gist": "Gavekal argues the north star of US policymaking is keeping US equity prices high, citing Trump's 'stocks up, oil down' remark after signing the Iran memorandum of understanding in Versailles, implying US adversaries gain more leverage by hitting the Nasdaq than military assets. Amid market turbulence, the firm falls back on its framework that three prices (energy, 10-year US treasury yields, and the US dollar) determine long-term asset-price direction and relative calls such as growth vs value and EM vs DM.", "themes": [{"theme": "Equity prices as the US policy north star", "insights": [{"claim": "Gavekal argues the north star of US policymaking is first and foremost keeping US equity prices high, a dynamic it says was visible again on Monday (Beat Notz's dictum).", "speaker": "Gavekal Research", "type": "thesis", "entities": ["Beat Notz", "US"], "conviction": "high", "so_what": "Policy responses can be expected to lean toward supporting equity markets when they fall, acting as an implicit backstop.", "quote": "the north star of US policymaking is first and foremost to keep US equity prices high", "locator": "On Monday, we witnessed Beat Notz’s", "quote_verified": true}, {"claim": "After signing the memorandum of understanding with Iran in Versailles in June, President Donald Trump turned to President Emmanuel Macron and said 'stocks up, oil down', which Gavekal reads as a clear signal of market-focused US policy.", "speaker": "Gavekal Research", "type": "anecdote", "entities": ["Donald Trump", "Emmanuel Macron", "Iran", "Versailles"], "conviction": "high", "so_what": "Geopolitical deals are framed by the administration through their impact on equities and oil prices.", "quote": "“stocks up, oil down”", "locator": "On Monday, we witnessed Beat Notz’s", "quote_verified": true}, {"claim": "Gavekal contends that adversaries in a conflict with the US would gain more leverage by causing major Nasdaq losses than by destroying battleships, jet planes or soldiers, because equity losses are far more likely to change US policy.", "speaker": "Gavekal Research", "type": "contrarian", "entities": ["Nasdaq", "US"], "conviction": "medium", "so_what": "US equity markets become a geopolitical pressure point, raising the strategic vulnerability of tech-heavy indices in conflicts.", "quote": "major equity losses being far more likely to affect US policy than the loss of military assets and soldiers", "locator": "On Monday, we witnessed Beat Notz’s", "quote_verified": true}]}, {"theme": "Three-prices framework for asset allocation", "insights": [{"claim": "Gavekal holds that over the long term three prices determine the direction of asset prices: the price of energy, the price of capital (the 10-year US treasury yield) and the price of the US dollar.", "speaker": "Gavekal Research", "type": "framework", "entities": ["10-year US treasuries", "US dollar"], "conviction": "high", "so_what": "Macro allocation calls can be anchored on directional views of oil/energy, long-end yields and the dollar.", "quote": "These three prices are the price of energy, the price of capital (as measured by the yield on 10-year US treasuries) and the price of the US dollar.", "locator": "It is said that there are", "quote_verified": true}, {"claim": "According to Gavekal, investors who broadly get the direction of energy, 10-year treasury yields and the US dollar right can usually call growth versus value, emerging versus developed markets, and bonds versus equities versus commodities.", "speaker": "Gavekal Research", "type": "causal", "entities": ["emerging markets", "developed markets"], "conviction": "high", "so_what": "Relative-value positioning across styles, regions and asset classes flows from the three-price view.", "quote": "Investors who get the direction of these three prices broadly right usually can call the direction of growth versus value, emerging markets versus developed markets", "locator": "It is said that there are", "quote_verified": true}]}], "insight_total": 5, "top_entities": ["Donald Trump", "Emmanuel Macron", "Iran", "Nasdaq", "Beat Notz", "Versailles", "US dollar", "10-year US treasuries"], "source_meta": {"author": "", "word_count": 304, "paywalled": false}}, {"record_id": "3b625a239034f3c8", "source_type": "concepts", "source_name": "NY Fed — Liberty Street Economics", "source_url": "https://libertystreeteconomics.newyorkfed.org/2026/11/as-corporate-bond-markets-grow-is-bank-lending-shrinking/", "title": "As Corporate Bond Markets Grow, Is Bank Lending Shrinking? - Liberty Street Economics", "published_date": "2026-11-24", "language": "en", "processed_at": "2026-11-25T11:10:00Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Positioning"], "gist": "NY Fed researchers decompose growth in corporate bonds-to-GDP across the U.S. and 23 other advanced economies into a shift from bank loans to bonds (composition) versus firms borrowing more overall (credit deepening). U.S. growth since 1996 was mainly credit deepening, the pandemic was a broad borrowing event, and the post-2021 retreat in bonds/GDP is largely a GDP denominator effect rather than a broad return to bank credit.", "themes": [{"theme": "Bond growth: substitution vs. credit deepening", "insights": [{"claim": "Rising corporate bonds-to-GDP is usually read as a shift from bank to market finance, but it can equally reflect firms simply borrowing more overall (credit deepening), so the headline ratio alone does not reveal disintermediation.", "speaker": "Nina Boyarchenko", "type": "framework", "entities": ["corporate bonds", "bank lending"], "conviction": "high", "so_what": "Do not infer bank disintermediation from bond-market growth without decomposing it into composition vs. total-debt changes.", "quote": "This growth is usually read as a shift from bank to market finance. But the ratio of bonds to GDP can rise either because firms take more debt in general, or because firms shift the composition of their debt toward bonds.", "locator": "The size of global corporate bond markets", "quote_verified": true}, {"claim": "If bond markets grow because firms substitute away from banks, bond-market conditions govern a larger share of corporate liabilities and bank lending standards a smaller one; if growth comes from more borrowing of everything, firms are simply more exposed to both channels.", "speaker": "Nina Boyarchenko", "type": "causal", "entities": ["corporate bonds", "bank lending standards"], "conviction": "high", "so_what": "The source of bond growth determines whether credit-spread or bank-standard indicators matter more for corporate financing conditions.", "quote": "If instead bond markets grow because firms borrow more of everything, the balance between the two is unchanged and firms are simply more exposed to both.", "locator": "Why does the distinction between sources", "quote_verified": true}, {"claim": "Credit conditions in the bond market and the bank loan market can be disconnected, which is why the mix of corporate funding sources matters for transmission of financial conditions.", "speaker": "Nina Boyarchenko", "type": "causal", "entities": ["corporate bonds", "bank loans"], "conviction": "medium", "so_what": "Monitor bond and loan conditions separately; a tightening in one may not show up in the other.", "quote": "credit conditions in the two markets can be disconnected", "locator": "Why does the distinction between sources", "quote_verified": true}, {"claim": "The authors decompose changes in bonds/GDP into a composition component (bond share of total nonfinancial corporate debt) and a credit-deepening component (total corporate debt relative to GDP), using a midpoint decomposition so the two sum to the total.", "speaker": "Nina Boyarchenko", "type": "framework", "entities": ["nonfinancial corporate debt"], "conviction": "high", "so_what": "A reusable lens for analysing any country's bond-market growth: separate leverage growth from funding-mix shift.", "quote": null, "locator": "The chart also shows that U.S.", "quote_verified": false}]}, {"theme": "Long-run size of corporate bond markets", "insights": [{"claim": "At end-2024, nonfinancial corporate bonds issued by U.S. firms equalled 29% of U.S. GDP, versus an average of 11% of GDP in other advanced economies.", "speaker": "Nina Boyarchenko", "type": "data_point", "entities": ["U.S.", "corporate bonds"], "conviction": "high", "so_what": "U.S. corporate financing is far more market-based, so bond conditions weigh more heavily on U.S. firms than on peers.", "quote": "As of the end of 2024, nonfinancial corporate bonds issued by U.S. firms accounted for 29 percent of U.S. GDP.", "locator": "The size of global corporate bond markets", "quote_verified": true}, {"claim": "The U.S. corporate bond market grew from 12.2% of GDP in 1950 to a peak of 36.2% in 2020, nearly tripling over seventy years.", "speaker": "Nina Boyarchenko", "type": "data_point", "entities": ["U.S.", "corporate bonds"], "conviction": "high", "so_what": "Structural, multi-decade growth of U.S. corporate bond financing raises the macro relevance of bond-market stress.", "quote": null, "locator": "Starting with the U.S., we see", "quote_verified": false}, {"claim": "In the equal-weighted average of other advanced economies, corporate bonds more than doubled from 5.0% of GDP in 1996 to 12.2% in 2020, a faster growth rate than in the U.S.", "speaker": "Nina Boyarchenko", "type": "data_point", "entities": ["other advanced economies", "corporate bonds"], "conviction": "high", "so_what": "Non-U.S. corporate bond markets are deepening quickly from a low base, increasing bond-market sensitivity abroad.", "quote": null, "locator": "Starting with the U.S., we see", "quote_verified": false}, {"claim": "The 2020 peak in bonds/GDP was boosted by COVID-19-era issuance, but bond markets had been growing steadily for decades before the pandemic.", "speaker": "Nina Boyarchenko", "type": "data_point", "entities": ["COVID-19"], "conviction": "medium", "so_what": "The pandemic spike overstates but does not create the long-run trend toward bond finance.", "quote": null, "locator": "Starting with the U.S., we see", "quote_verified": false}, {"claim": "The larger U.S. bond market reflects structural differences: the U.S. relies heavily on market-based finance while other advanced economies, notably in Europe, have bank-centric financial systems.", "speaker": "Nina Boyarchenko", "type": "thesis", "entities": ["U.S.", "Europe"], "conviction": "high", "so_what": "Expect different transmission of credit shocks in the U.S. (bond-driven) vs. Europe (bank-driven).", "quote": null, "locator": "The chart also shows that U.S.", "quote_verified": false}]}, {"theme": "Pre-pandemic drivers by country (1996-2019)", "insights": [{"claim": "Between 1996 and 2019 U.S. bond market growth was mainly credit deepening: bonds rose 9.2% of GDP, total credit to nonfinancial corporates rose from 41% to 52% of GDP (6.6pp of the growth), while the bond share of corporate debt rose only from 57% to 63%.", "speaker": "Nina Boyarchenko", "type": "data_point", "entities": ["U.S.", "nonfinancial corporations"], "conviction": "high", "so_what": "Recent U.S. bond growth reflects higher corporate leverage, not banks being displaced, so firms are more exposed to both credit channels.", "quote": "most of the growth in the size of the corporate bond market in the U.S. between 1996 and 2019 was due to credit deepening", "locator": "Starting with the U.S. (left-most bar)", "quote_verified": true}, {"claim": "Composition mattered more earlier in the U.S.: between 1980 and 1995, more than 40% of the rise in bonds outstanding (from about 15% to 23.5% of GDP) came from firms shifting from bank loans to market financing.", "speaker": "Nina Boyarchenko", "type": "data_point", "entities": ["U.S.", "bank loans"], "conviction": "high", "so_what": "The U.S. bank-to-bond substitution was largely an earlier-era story; later growth was leverage-driven.", "quote": "Composition played a larger role in that earlier period", "locator": "Starting with the U.S. (left-most bar)", "quote_verified": true}, {"claim": "Across advanced economies pre-pandemic growth mixed composition and credit deepening with large heterogeneity: U.S. and Canada were mostly credit deepening, while New Zealand, Japan and Italy were mostly a shift from bank to market financing.", "speaker": "Nina Boyarchenko", "type": "data_point", "entities": ["Canada", "New Zealand", "Japan", "Italy"], "conviction": "high", "so_what": "In Japan, Italy and New Zealand, bond conditions have genuinely displaced bank standards as a driver of corporate funding.", "quote": null, "locator": "Turning to the rest of the advanced economies", "quote_verified": false}, {"claim": "France and Germany's 1996-2019 bond market growth was roughly half credit deepening and half composition shift, while in the UK credit deepening accounted for about three-fifths.", "speaker": "Nina Boyarchenko", "type": "data_point", "entities": ["France", "Germany", "UK"], "conviction": "medium", "so_what": "Core European markets saw a partial but meaningful move toward bond finance.", "quote": null, "locator": "Turning to the rest of the advanced economies", "quote_verified": false}]}, {"theme": "Pandemic as a borrowing event (2019-2021)", "insights": [{"claim": "Between 2019 and 2021 credit deepened in sixteen of the twenty-four economies studied, making the pandemic primarily a borrowing event despite central bank support aimed at corporate bond markets.", "speaker": "Nina Boyarchenko", "type": "data_point", "entities": ["COVID-19", "central banks"], "conviction": "high", "so_what": "Pandemic-era policy raised overall corporate leverage rather than mainly shifting firms into bonds.", "quote": null, "locator": "Credit Deepened During the Pandemic", "quote_verified": false}, {"claim": "During the pandemic most Eurozone countries saw nonfinancial corporate debt shift toward bonds, whereas in the U.S. and most other advanced economies the bond share fell as loans grew even faster than bonds.", "speaker": "Nina Boyarchenko", "type": "contrarian", "entities": ["Eurozone", "U.S.", "bank loans"], "conviction": "medium", "so_what": "Counter to the narrative of bond-market backstops driving U.S. firms to bonds, U.S. loan growth outpaced bonds in 2019-21.", "quote": "For most of the rest of the advanced economies and for the U.S., instead, the share of bonds in corporate debt declined over the pandemic period, so that loans grew even faster than corporate bonds.", "locator": "Credit Deepened During the Pandemic", "quote_verified": true}]}, {"theme": "Post-2021 retreat is not a return to banks", "insights": [{"claim": "From 2021 to 2024 total nonfinancial corporate credit kept growing in nominal terms in every country studied, but GDP grew faster; U.S. corporate bonds rose from $8.0tn to $8.6tn while GDP rose from $23.7tn to $29.4tn.", "speaker": "Nina Boyarchenko", "type": "data_point", "entities": ["U.S.", "GDP"], "conviction": "high", "so_what": "The fall in bonds/GDP is a denominator effect from strong nominal growth, not deleveraging via bond paydown.", "quote": null, "locator": "We finally turn to the decline", "quote_verified": false}, {"claim": "Bonds relative to GDP fell in seventeen of twenty-four economies after 2021; in the U.S., UK and Spain the reversal of credit deepening explains over four-fifths of the decline, and in the UK and Spain the bond share of corporate debt actually rose.", "speaker": "Nina Boyarchenko", "type": "data_point", "entities": ["U.S.", "UK", "Spain"], "conviction": "high", "so_what": "In these markets reliance on bonds is intact; lower ratios reflect GDP outgrowing debt.", "quote": null, "locator": "The chart shows that, while bond markets", "quote_verified": false}, {"claim": "In Sweden, France and Austria a falling bond share accounted for most of the post-2021 decline in bonds/GDP, i.e., a genuine tilt back toward loans.", "speaker": "Nina Boyarchenko", "type": "data_point", "entities": ["Sweden", "France", "Austria"], "conviction": "medium", "so_what": "These are the economies where bank lending conditions regained relative importance post-pandemic.", "quote": null, "locator": "The chart shows that, while bond markets", "quote_verified": false}, {"claim": "Because the bond share of corporate debt fell in only half the countries, the post-pandemic retreat in bond markets is not a broad-based shift back to bank credit.", "speaker": "Nina Boyarchenko", "type": "thesis", "entities": ["bank credit"], "conviction": "high", "so_what": "Reject the narrative of a generalized re-intermediation by banks after 2021.", "quote": "the post-pandemic retreat does not represent a broad-based shift back to bank credit", "locator": "The chart shows that, while bond markets", "quote_verified": true}]}, {"theme": "Measurement caveats and research agenda", "insights": [{"claim": "Conclusions from national accounts depend on where the nonfinancial corporate boundary is drawn, market vs. face valuation of bonds, and which instruments are included; these choices can change not just the size but the direction of the bond-share trend.", "speaker": "Nina Boyarchenko", "type": "framework", "entities": ["national accounts"], "conviction": "high", "so_what": "Treat aggregate bond-share trends cautiously; firm-level instrument data is more reliable.", "quote": "can each change not just the size but the direction of the trend in the bond share", "locator": "Wrapping Up", "quote_verified": true}, {"claim": "A companion Staff Report combines national accounts with instrument-level data for firms in more than forty countries to show which firms moved toward bonds and how; cross-country differences matter for how credit-boom composition affects the real economy and firms' financing ability.", "speaker": "Nina Boyarchenko", "type": "thesis", "entities": ["Staff Report", "Federal Reserve Bank of New York"], "conviction": "medium", "so_what": "Watch for follow-up NY Fed research linking credit-boom composition to real outcomes.", "quote": null, "locator": "Wrapping Up", "quote_verified": false}]}], "insight_total": 21, "top_entities": ["U.S.", "corporate bonds", "bank loans", "credit deepening", "nonfinancial corporate debt", "COVID-19", "Eurozone", "Japan", "Italy", "France", "Germany", "UK"], "source_meta": {"author": "Nina Boyarchenko", "word_count": 2423, "paywalled": false}}, {"record_id": "09f5aee94e96aaf7", "source_type": "concepts", "source_name": "Oxford Economics", "source_url": "https://www.oxfordeconomics.com/resource/cop31-failed-does-it-matter/", "title": "COP31 failed, does it matter?", "published_date": "2026-11-24", "language": "en", "processed_at": "2026-11-25T11:10:00Z", "processor": "claude-code-sub-opus", "tags": ["Energy", "Geopolitics", "Macro"], "gist": "Oxford Economics argues that COP31 in Antalya collapsing without a cover decision, after the EU, UK, Norway and ~130 others rejected a text that dropped fossil-fuel language in favour of carbon capture, matters ever less: economics now drives renewables and end-use electrification, and around 90 countries have signed the voluntary 35-by-35 electrification pledge anyway. Still, the UN process anchors national plans and private investment, so the EU and China should preserve climate signalling through coalitions such as compliance carbon markets combined with CBAMs, underpinned by standardised data.", "themes": [{"theme": "COP31 collapse: fossil producers vs importers", "insights": [{"claim": "COP31 in Antalya ended without an overarching political agreement (no cover decision), but the authors argue this matters ever less for the energy transition.", "speaker": "Madeleine Henry", "type": "thesis", "entities": ["COP31", "Antalya"], "conviction": "high", "so_what": "A failed COP headline should not be read as a reversal of decarbonisation trends; avoid trading it as a negative signal for transition assets.", "quote": "ended without an overarching political agreement. Does it matter? Thankfully, ever less so.", "locator": "The 31st Conference of the Parties", "quote_verified": true}, {"claim": "Unlike the usual COP script where posturing dissolves into compromise language, COP31 delegates could not bridge the split between large fossil fuel producers such as Saudi Arabia and Russia and large importers such as the EU.", "speaker": "Madeleine Henry", "type": "causal", "entities": ["Saudi Arabia", "Russia", "EU"], "conviction": "high", "so_what": "The producer-importer divide in climate diplomacy has hardened, signalling more fragmented global climate policy rather than converging rules.", "quote": "a text bridging differences between large producers of fossil fuels (e.g., Saudi Arabia, Russia) on the one side, and large fossil fuel importers such as the EU", "locator": "Except, not this time.", "quote_verified": true}, {"claim": "The EU, represented by Ireland's climate minister Darragh O'Brien, refused to endorse a COP31 text stripped of any reference to fossil fuels' role in climate change that instead emphasised carbon capture and storage; the UK, Norway and around 130 other countries followed.", "speaker": "Madeleine Henry", "type": "data_point", "entities": ["EU", "Darragh O’Brien", "UK", "Norway", "carbon capture and storage"], "conviction": "high", "so_what": "A large bloc of importers is unwilling to accept CCS framing as a substitute for fossil-fuel phase-down language, a sign that CCS-centric narratives lack broad diplomatic backing.", "quote": "refused to endorse a text that had been stripped from any reference of the role of fossil fuels in driving climate change", "locator": "Except, not this time.", "quote_verified": true}, {"claim": "Procedural negotiated items were still adopted at COP31 and are unaffected by the failed cover decision, including a three-year extension of the Just Transition Work Programme; countries also announced or reaffirmed commitments under partnerships like the Global Methane Pledge.", "speaker": "Madeleine Henry", "type": "data_point", "entities": ["Just Transition Work Programme", "Global Methane Pledge"], "conviction": "high", "so_what": "Technical UN climate workstreams continue despite political failure, so the institutional machinery is not broken.", "quote": "parties approved a three-year extension of the Just Transition Work Programme", "locator": "Although a political deal wasn't reached", "quote_verified": true}]}, {"theme": "Electrification as the new centre of climate diplomacy", "insights": [{"claim": "Disagreements over the COP31 cover decision included divisions around the '35% by 2035' electrification target announced by the COP President in Bonn the previous June.", "speaker": "Madeleine Henry", "type": "data_point", "entities": ["35 by 35 electrification pledge", "Bonn"], "conviction": "high", "so_what": "The electrification target is now politically contested, which limits its value as a coordinated global policy anchor.", "quote": "including the divisions around the 35% by 2035 electrification target", "locator": "The disagreements over the cover decision", "quote_verified": true}, {"claim": "The electrification target confirmed that electrification had reached the top of climate diplomacy, a significant shift from the early energy transition when almost all attention went to decarbonising power generation.", "speaker": "Madeleine Henry", "type": "framework", "entities": ["electrification"], "conviction": "high", "so_what": "Policy focus is moving from clean generation to electrifying end uses, broadening the transition opportunity set beyond renewables developers to end-use electrification.", "quote": "electrification had reached the top of climate diplomacy, driven by recent technological and political momentum", "locator": "This announcement confirmed that electrification", "quote_verified": true}, {"claim": "Even without a COP cover decision endorsing it, around 90 countries and 180 business and civil society organizations have taken the voluntary 35-by-35 electrification pledge.", "speaker": "Madeleine Henry", "type": "data_point", "entities": ["35 by 35 electrification pledge"], "conviction": "high", "so_what": "Voluntary coalitions are carrying the electrification agenda forward regardless of UN consensus, so demand signals for electrification remain intact.", "quote": "around 90 countries and 180 business and civil society organizations have taken the voluntary 35 by 35 electrification pledge", "locator": "This announcement confirmed that electrification", "quote_verified": true}, {"claim": "A COP agreement is several steps removed from operational electrification decisions like building a grid line or setting an EV sales target, but a political endorsement would have provided momentum to coordinate the decisions needed to speed up electrification.", "speaker": "Madeleine Henry", "type": "causal", "entities": ["electrification", "grid", "EV"], "conviction": "medium", "so_what": "The COP failure modestly slows coordination of grid and EV policy rather than stopping it; expect execution to depend on national decisions.", "quote": "Still, political signals matter and this one would have provided momentum to coordinate decisions needed to speed up electrification.", "locator": "A COP agreement is several steps", "quote_verified": true}]}, {"theme": "Economics, not diplomacy, drives the transition", "insights": [{"claim": "Despite COP31's failure, the transformation of energy systems will continue because economics will drive renewables deployment in power generation worldwide and, with some early-stage support, the electrification of end uses.", "speaker": "Madeleine Henry", "type": "prediction", "entities": ["renewables", "electrification"], "conviction": "high", "so_what": "Renewables and electrification investment theses rest on cost competitiveness, not on UN outcomes; COP headline risk is a weak reason to de-risk those exposures.", "quote": "Economics will drive the deployment of renewables in power generation around the world", "locator": "Despite the failure of COP31", "quote_verified": true}, {"claim": "The COP process has failed before, in Nairobi (2006) and Copenhagen (2009), yet decarbonisation kept advancing; COP21 later delivered the Paris Agreement.", "speaker": "Madeleine Henry", "type": "anecdote", "entities": ["Nairobi", "Copenhagen", "COP21", "Paris Agreement"], "conviction": "high", "so_what": "Historical precedent suggests COP failures are temporary setbacks rather than turning points for the decarbonisation trend.", "quote": "this process has failed before–think 2006 (Nairobi) and 2009 (Copenhagen), but the wheels of decarbonisation kept turning", "locator": "Despite the failure of COP31", "quote_verified": true}, {"claim": "Policy-supported technological development led to a very substantial fall in the price of the components of the so-called electricity tech stack.", "speaker": "Madeleine Henry", "type": "causal", "entities": ["electricity tech stack"], "conviction": "high", "so_what": "Falling component costs are the structural driver making electrification self-sustaining, reducing dependence on diplomatic momentum.", "quote": "policy-supported technological development led to a very substantial fall in the price of the components of the so-called electricity tech stack", "locator": "Despite the failure of COP31", "quote_verified": true}]}, {"theme": "Why the UN process still matters", "insights": [{"claim": "The UN climate process should not be dismissed wholesale: it is a key gauge of global commitment to cooperation and an anchor for national decarbonisation plans and private-sector investment decisions, so flagging global momentum weakens the signal sent downstream.", "speaker": "Madeleine Henry", "type": "contrarian", "entities": ["UN"], "conviction": "medium", "so_what": "Weaker COP signals can erode the policy certainty that underpins private transition capex, raising the risk premium on long-dated climate investments at the margin.", "quote": "Flagging global momentum weakens the signal sent downstream.", "locator": "Still, we should guard against dismissing", "quote_verified": true}, {"claim": "Given the urgency of cutting emissions and adapting to climate change, preserving the signalling effect of climate commitments should be led by proponents of stronger action such as the EU, together with willing partners such as China.", "speaker": "Madeleine Henry", "type": "thesis", "entities": ["EU", "China"], "conviction": "medium", "so_what": "An EU-China axis on climate signalling would be the key leadership structure to watch for the post-COP31 policy path.", "quote": "This should be led by proponents of stronger climate action such as the EU, together with willing partners such as China.", "locator": "Given the urgency of reducing global emissions", "quote_verified": true}]}, {"theme": "Coalitions, carbon markets and CBAMs", "insights": [{"claim": "Coalition-building fora including the EU and China, such as the Open Coalition on Compliance Carbon Markets, have emerged in recent years, and carbon markets combined with CBAMs offer the possibility of a globally significant race to the top on climate action.", "speaker": "Madeleine Henry", "type": "thesis", "entities": ["Open Coalition on Compliance Carbon Markets", "carbon markets", "CBAM", "EU", "China"], "conviction": "medium", "so_what": "Compliance carbon markets linked with border carbon adjustments may become the main channel for global climate policy, making carbon pricing exposure more relevant for trade-exposed industries.", "quote": "Carbon markets combined with CBAMs offer the possibility of a globally significant race to the top on climate action.", "locator": "Several fora including these parties", "quote_verified": true}, {"claim": "Building effective climate coalitions requires standardised data and procedures, so standardisation efforts are incredibly valuable to the energy transition in an increasingly fragmented world.", "speaker": "Madeleine Henry", "type": "framework", "entities": ["carbon markets"], "conviction": "medium", "so_what": "Standardised carbon data and MRV procedures are a precondition for linked carbon markets; providers of that infrastructure benefit from fragmentation-driven coalition building.", "quote": "building successful and effective coalitions requires standardised data and procedures", "locator": "But building successful and effective coalitions", "quote_verified": true}]}], "insight_total": 15, "top_entities": ["COP31", "EU", "Saudi Arabia", "Russia", "China", "Darragh O’Brien", "Global Methane Pledge", "Just Transition Work Programme", "Paris Agreement", "Open Coalition on Compliance Carbon Markets", "CBAM", "carbon capture and storage"], "source_meta": {"author": "Madeleine Henry", "word_count": 845, "paywalled": false}}, {"record_id": "404858cc3a99ac3a", "source_type": "concepts", "source_name": "Peterson Institute (PIIE)", "source_url": "https://www.piie.com/blogs/realtime-economics/2026/policy-driven-trade-imbalances-case-sovereign-wealth-funds", "title": "Policy driven trade imbalances: The case of sovereign wealth funds", "published_date": "2026-11-24", "language": "en", "processed_at": "2026-11-25T11:10:00Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Energy", "Geopolitics"], "gist": "Gagnon and Agrawal (PIIE) argue trade imbalances are policy-driven: each $1 of fiscal balance raises the trade balance ~$0.30, each $1 of official foreign-asset purchases ~$0.50, and together ~$0.80+. Data on 12 major oil exporters show persistent surpluses arise only when governments save oil revenues abroad, mainly via sovereign wealth funds, not automatically from oil exports.", "themes": [{"theme": "Policy drivers of trade balances", "insights": [{"claim": "PIIE research finds that each $1 increase in a country's fiscal balance raises its trade balance by about $0.30.", "speaker": "Joseph E. Gagnon, Nishtha Agrawal", "type": "data_point", "entities": ["PIIE", "fiscal balance", "trade balance"], "conviction": "high", "so_what": "Fiscal consolidation or expansion is a quantifiable lever on external balances; watch budget shifts to forecast current-account moves.", "quote": "each $1 increase in a country's fiscal balance raises its trade balance $0.30", "locator": "Our recent working paper is the", "quote_verified": true}, {"claim": "PIIE research finds that each $1 of official purchases of foreign assets raises a country's trade balance by roughly $0.50.", "speaker": "Joseph E. Gagnon, Nishtha Agrawal", "type": "data_point", "entities": ["PIIE", "official foreign assets", "trade balance"], "conviction": "high", "so_what": "Official reserve/SWF accumulation is a bigger driver of surpluses than fiscal policy alone, so track net official flows as a leading indicator of trade surpluses.", "quote": "each $1 purchase of official foreign assets raises the trade balance $0.50 or so", "locator": "Our recent working paper is the", "quote_verified": true}, {"claim": "Fiscal surpluses and official foreign-asset purchases reinforce each other: a $1 increase in the fiscal balance invested entirely in foreign assets raises the trade balance by $0.80 or more.", "speaker": "Joseph E. Gagnon, Nishtha Agrawal", "type": "framework", "entities": ["fiscal balance", "official foreign assets", "trade balance"], "conviction": "high", "so_what": "Countries that run budget surpluses and park them abroad (e.g., via SWFs) produce the largest, most persistent trade surpluses.", "quote": "a $1 increase in the fiscal balance that is invested entirely in foreign assets raises the trade balance $0.80 or more", "locator": "Our recent working paper is the", "quote_verified": true}, {"claim": "Gagnon and Agrawal's working paper is part of a series of studies arguing that official government policies play an important role in driving global trade imbalances.", "speaker": "Joseph E. Gagnon, Nishtha Agrawal", "type": "thesis", "entities": ["PIIE", "global trade imbalances"], "conviction": "high", "so_what": "Frames global imbalances as policy choices rather than market outcomes, relevant to trade-policy and currency debates.", "quote": null, "locator": "Our recent working paper is the", "quote_verified": false}]}, {"theme": "Oil exporters: surpluses are not automatic", "insights": [{"claim": "Contrary to the widespread belief that major oil exporters automatically run trade surpluses, oil exporters have persistent surpluses only when their governments save oil revenues in foreign assets, mainly through sovereign wealth funds.", "speaker": "Joseph E. Gagnon, Nishtha Agrawal", "type": "contrarian", "entities": ["oil exporters", "sovereign wealth funds", "SWFs"], "conviction": "high", "so_what": "Higher oil prices alone do not guarantee an exporter's external surplus; check whether the government is saving windfalls abroad.", "quote": "oil exporters have persistent surpluses only when their governments save the oil revenues in foreign assets, mainly using sovereign wealth funds (SWFs)", "locator": "In this post, we show", "quote_verified": true}, {"claim": "Net energy exports and net official flows (NOF, official purchases of foreign assets typically conducted by sovereign wealth funds) are only two of many factors influencing an oil exporter's current account.", "speaker": "Joseph E. Gagnon, Nishtha Agrawal", "type": "framework", "entities": ["net official flows", "NOF", "current account", "sovereign wealth funds"], "conviction": "medium", "so_what": "NOF is a key but not sole explanatory variable; combine it with other drivers when modelling exporter balances.", "quote": null, "locator": "Figure 1 displays data for 12", "quote_verified": false}, {"claim": "Among oil exporters with trade balances fluctuating around zero, net official flows also tend to fluctuate around zero and are often strongly correlated with the trade balance; the only exceptions are Angola before 2005 and Kazakhstan before 2010.", "speaker": "Joseph E. Gagnon, Nishtha Agrawal", "type": "data_point", "entities": ["Angola", "Kazakhstan", "net official flows"], "conviction": "high", "so_what": "Exporters that spend rather than save oil revenues domestically recycle them into imports, leaving no structural surplus.", "quote": null, "locator": "Other oil exporters have trade balances", "quote_verified": false}]}, {"theme": "Country evidence on SWFs and surpluses", "insights": [{"claim": "Azerbaijan, Kuwait, Norway, Qatar, Russia and Saudi Arabia are oil exporters with persistent trade surpluses.", "speaker": "Joseph E. Gagnon, Nishtha Agrawal", "type": "data_point", "entities": ["Azerbaijan", "Kuwait", "Norway", "Qatar", "Russia", "Saudi Arabia"], "conviction": "high", "so_what": "These are the oil exporters whose external surpluses feed global capital flows via official asset purchases.", "quote": null, "locator": "Some oil exporters do have persistent", "quote_verified": false}, {"claim": "In Kuwait, Norway and Saudi Arabia, trade surpluses track net official flows very closely, and fiscal balances are closely linked to those official flows.", "speaker": "Joseph E. Gagnon, Nishtha Agrawal", "type": "causal", "entities": ["Kuwait", "Norway", "Saudi Arabia", "net official flows"], "conviction": "high", "so_what": "For these countries, SWF investment pace and fiscal balances are a direct read-through to the trade surplus.", "quote": "In Kuwait, Norway, and Saudi Arabia, the pattern of trade surpluses matches very closely with NOF.", "locator": "Some oil exporters do have persistent", "quote_verified": true}, {"claim": "In Azerbaijan, Qatar and Russia, trade balances are positively correlated with net official flows, but gaps in the correlation indicate other factors also matter.", "speaker": "Joseph E. Gagnon, Nishtha Agrawal", "type": "data_point", "entities": ["Azerbaijan", "Qatar", "Russia", "net official flows"], "conviction": "medium", "so_what": "NOF explains much but not all of these surpluses; other drivers need monitoring.", "quote": null, "locator": "Some oil exporters do have persistent", "quote_verified": false}, {"claim": "Algeria's trade balance is essentially identical to its net official flows, a particularly striking case of policy-driven external balance.", "speaker": "Joseph E. Gagnon, Nishtha Agrawal", "type": "data_point", "entities": ["Algeria", "net official flows"], "conviction": "high", "so_what": "Algeria's external position can be read almost one-for-one from official asset accumulation or drawdown.", "quote": "The case of Algeria is particularly striking, with the trade balance essentially identical to net official flows.", "locator": "Other oil exporters have trade balances", "quote_verified": true}]}, {"theme": "Sample and methodology", "insights": [{"claim": "The PIIE oil-exporter sample covers 12 countries with at least 10 years of data and net energy exports averaging over $10 billion per year and 10 percent of GDP, excluding Iran and the United Arab Emirates over data-quality concerns.", "speaker": "Joseph E. Gagnon, Nishtha Agrawal", "type": "data_point", "entities": ["Iran", "United Arab Emirates", "oil exporters"], "conviction": "medium", "so_what": "Results omit two large exporters, so conclusions about Gulf surpluses exclude the UAE.", "quote": null, "locator": "Notes 2. We include all countries", "quote_verified": false}, {"claim": "Sovereign wealth funds are a common framework for saving natural-resource revenues; all countries in the PIIE oil-exporter sample except the Republic of Congo have resource-based SWFs, and Congo's net official flows mainly reflect official development loans and repayments.", "speaker": "Joseph E. Gagnon, Nishtha Agrawal", "type": "data_point", "entities": ["Republic of Congo", "sovereign wealth funds", "SWFs"], "conviction": "medium", "so_what": "For low-income exporters without SWFs, official flows are driven by development lending rather than saving of oil windfalls.", "quote": null, "locator": "Notes 1. SWFs are a common", "quote_verified": false}]}], "insight_total": 13, "top_entities": ["sovereign wealth funds", "net official flows", "Saudi Arabia", "Norway", "Kuwait", "Algeria", "Qatar", "Russia", "Azerbaijan", "Kazakhstan", "Angola", "PIIE"], "source_meta": {"author": "Joseph E. Gagnon,Nishtha Agrawal", "word_count": 567, "paywalled": false}}]};

};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
