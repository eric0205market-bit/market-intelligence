<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

e).", "tweet_url": "https://x.com/jchervinsky/status/2108853899562225999", "images": [], "type": "thread"}, {"author": "Zeneca", "summary": "Zeneca (pre-launch): ~4 hours out, close to $100M in pre-deposits; recommends feeding the docs to your AI and building a strategy around your bankroll/risk appetite.", "tweet_url": "https://x.com/Zeneca/status/2108862887137825136", "images": [], "type": "tweet"}, {"author": "Zeneca", "summary": "Zeneca (post-launch): if you aren't trading $10M notional you won't get through the queue; he holds a $10M position at 1000x leverage. Also vibecoded a bot expected to get 'dumpstered' by professional MMs.", "tweet_url": "https://x.com/Zeneca/status/2108925546776465884", "images": ["https://pbs.twimg.com/media/HURoldQbIAA3i7C.jpg"], "type": "thread"}, {"author": "Zeneca", "summary": "Zeneca: papertrade paid out over $10M in staking revenue in the first couple of hours (chart attached). Later notes the official token isn't tradeable — you can only get it by losing money on the app — and that anything trading out there is a scam or a meta/beta play.", "tweet_url": "https://x.com/Zeneca/status/2108961487540916396", "images": ["https://pbs.twimg.com/media/HUSIknoaIAAQS2P.jpg"], "type": "tweet"}, {"author": "Zeneca", "summary": "Zeneca posts a chart (image only, no data in text) captioned 'hang it in the Louvre'; in a reply he quips it came 'mere minutes before the pico bottom'.", "tweet_url": "https://x.com/Zeneca/status/2108821586455474637", "images": ["https://pbs.twimg.com/media/HUQKChRbgAALNw-.png"], "type": "thread"}, {"author": "Zeneca", "summary": "Zeneca: further papertrade screenshot ('we're having fun right') — no additional data in the text.", "tweet_url": "https://x.com/Zeneca/status/2108964342964297974", "images": ["https://pbs.twimg.com/media/HUSK0sCakAAsl4L.jpg"], "type": "tweet"}]}, {"cluster": "10/10 One Year On — Liquidation Anniversary, 'Bottom Is In' vs Fear Narrative", "category": ["crypto", "positioning"], "items": [{" erianm: with diesel back in focus (chart of the last year's prices), he describes a growing multi-directional causal loop between geopolitics, domestic politics and economics — high diesel hurt domestic politics, which shaped economic policy and, per yesterday's US-Russia announcements, geopolitical decisions.", "tweet_url": "https://x.com/elerianm/status/2108834341530804266", "images": ["https://pbs.twimg.com/media/HUQVqBqXoAAD_Id.jpg"], "type": "tweet"}, {"author": "AndreasSteno", "summary": "AndreasSteno, reacting to a post (quoted) noting that hours after Treasury lifted sanctions on Russian diesel (300K+ tons now, 500K in November) Ukrainian drones hit the Rostov-on-Don export terminal (~2.5M t/yr) with US diesel already at $6.28/gal, says he can't understand people who celebrate death and destruction because it serves their long-energy view. He pushes back repeatedly in replies that the original author does this.", "tweet_url": "https://x.com/AndreasSteno/status/2108943874756366615", "images": [], "type": "thread"}, {"author": "qthomp", "summary": "qthomp (Hedgeye-style note): Russia, a top-3 oil producer, has seen production and refining capacity plummet from the war, so the commodity supply problem is much bigger than Iran/Hormuz; links earlier research. He also quoted the strike on the NZNP Rostovsky terminal.", "tweet_url": "https://x.com/qthomp/status/2108883805796794734", "images": ["https://pbs.twimg.com/media/HURCpRzWsAALAcC.jpg", "https://pbs.twimg.com/media/HURCpSZW8AAWQQG.jpg"], "type": "thread"}, {"author": "qthomp", "summary": "qthomp, sharing a critique of Trump's diesel move: Putin will lie, and Russia has no spare diesel because output is far below normal due to war disruption. Adds that the two biggest lies in Trump's post are the ones in all caps.", "tweet_url": "https://x.com/qthomp/status/2108886864975315013", "images": ["https://pbs.twimg.com/media/HURFbUiXQAADVPK.jpg"], "type": "tweet"}, {"author": "JavierBlas", "summary": "JavierBlas: podcast with Jake Sullivan and Jon Finer, 'Is China controlling the world's oil market?', covering global oil, Iran, Trump and Beijing's role.", "tweet_url": "https://x.com/JavierBlas/status/2108806568154390982", "images": [], "type": "tweet"}, {"author": "JavierBlas", "summary": "JavierBlas: Hurricane Isaias made landfall near Destin, FL, sparing US refining; main refineries (Mobile, Pascagoula) were >150km away, so fuel and offshore crude output should recover quickly.", "tweet_url": "https://x.com/JavierBlas/status/2108810581943918611", "images": [], "type": "tweet"}]}, {"cluster": "Backpack Equity-vs-Token Structure Debate", "category": ["crypto", "regulation"], "items": [{"author": "Evan_ss6", "summary": "Evan_ss6 dissects Backpack's token/equity structure after a team clarification: staked tokens may convert into up to 20% of equity only if staked 4+ years (min 1 year), unstaked tokens have no claim, the token likely becomes a utility token post-IPO, the equity entity holds 37.5% locked until one year after IPO, another 37.5% unlocks on milestones. At $1.25, token buyers pay ~$4B FDV for an option on equity that investors bought at ~$100M FDV. He criticizes the lack of revenue disclosure and argues 2026 norms (Hyperliquid, Lighter) put all value in the token. Says he holds no position and would pick equity over the token if forced.", "tweet_url": "https://x.com/Evan_ss6/status/2108932928692486239", "images": ["https://pbs.twimg.com/media/HUR2nlrWoAAailO.jpg"], "type": "thread"}, {"author": "Evan_ss6", "summary": "Evan_ss6 to KyleSamani: investors 'got equity' while followers can only buy tokens with worse rights at ~60x the price; buying at different valuations is normal, buying a different instrument without disclosing is not.", "tweet_url": "https://x.com/Evan_ss6/status/2108923608278196580", "images": [], "type": "thread"}, {"author": "Evan_ss6", "summary": "Evan_ss6 asks Austin_Federa whether being an investor close to the team gives him financial/IPO-timing insight ordinary token holders lack — a potential information-asymmetry problem. Related replies note a 'race condition' for anyone with IPO-timing insight.", "tweet_url": "https://x.com/Evan_ss6/status/2108921806124142630", "images": [], "type": "thread"}, {"author": "Evan_ss6", "summary": "Evan_ss6 summary of his stance: he only posted research and asked for clarifications; investors shilling the token should disclose they own equity, since token buyers don't own the same thing.", "tweet_url": "https://x.com/Evan_ss6/status/2108968939527213452", "images": [], "type": "tweet"}]}, {"cluster": "OpenAI / AI IPO Scrutiny — Revenue Quality and Spending Growth", "category": ["AI", "macro"], "items": [{"author": "BobEUnlimited", "summary": "BobEUnlimited's MacroTalk with Aahan: the telling market response to OpenAI news, a Fed tightening cycle that may run longer than planned, and what a bending LLM-revenue S-curve means for macro.", "tweet_url": "https://x.com/BobEUnlimited/status/2108866381122781682", "images": [], "type": "tweet"}, {"author": "BobEUnlimited", "summary": "BobEUnlimited, quoting a list of pre-IPO red flags (refusing to disclose real revenue, leaking inflated numbers, repeated delays, bridge rounds, claiming existential risk for protection): 'maybe it's just that things aren't going that well.' Later adds that ARR is not close to actual revenue.", "tweet_url": "https://x.com/BobEUnlimited/status/2108879484543791386", "images": [], "type": "tweet"}, {"author": "BobEUnlimited", "summary": "BobEUnlimited on CNBC: the market is one big bet on AI premised on parabolic growth, a troubling situation when spending growth looks increasingly linear.", "tweet_url": "https://x.com/BobEUnlimited/status/2108909160842534980", "images": [], "type": "tweet"}, {"author": "dylan522p", "summary": "dylan522p (SemiAnalysis), responding on IPO expectations: he doesn't care about consensus — his job is estimating what actually happens; revenue growth is 4.3x–5x, not 7x, over the next 14 months. Elsewhere clarifies his models show $600–700B (billion, not trillion) and notes a screenshot shows a model is still not frontier.", "tweet_url": "https://x.com/dylan522p/status/2108948086626369842", "images": [], "type": "tweet"}]}, {"cluster": "AI Eats Software and Atoms — Headless SaaS, Open-Source Clones, Machine Compiler", "category": ["AI", "tech"], "items": [{"author": "theallinpod", "summary": "Chamath on All-In: software IP was 'effectively rendered worthless two days ago' — people decompiled Adobe's five core products, distilled and open-sourced them; with services going headless (Salesforce, soon Elon's) and wrapped as agent tools via MCP, the value of software IP no longer exists.", "tweet_url": "https://x.com/theallinpod/status/2108897316086095923", "images": [], "type": "tweet"}, {"author": "dgt10011", "summary": "dgt10011: the multi-manager fund becomes the multi-agent fund — 'the future is Megannum.'", "tweet_url": "https://x.com/dgt10011/status/2108894647347212488", "images": [], "type": "tweet"}, {"author": "cryptopunk7213", "summary": "cryptopunk7213 on Atomic Machines (out of stealth after six years, led by the former head of Amazon Prime): its Matter Compiler builds working micro-machines from code with no per-product tooling or process development; every machine can differ and the system can iterate and improve, bridging models and physical hardware.", "tweet_url": "https://x.com/cryptopunk7213/status/2108958103727460654", "images": [], "type": "tweet"}, {"author": "garrytan", "summary": "garrytan: agents running 16 hours with zero input, auto-improving retrieval/latency evals for GBrain via Capy; one coordinator thread runs the merge queue and only full-CI-green runs land. He still approves plans but rarely needs to intervene because frontier models are strong.", "tweet_url": "https://x.com/garrytan/status/2108952558752686128", "images": ["https://pbs.twimg.com/media/HUSBDNSaUAAcdKN.jpg"], "type": "thread"}, {"author": "hossee ude after earlier burns, as the underlying tech has improved (quoting an API now at 320B tokens/day).", "tweet_url": "https://x.com/zeroxkyle/status/2108866917276795061", "images": ["https://pbs.twimg.com/media/HUQzO-eagAARQHb.png"], "type": "tweet"}, {"author": "sjdedic", "summary": "sjdedic: Collector Crypt joined the five crypto projects with >$1M daily revenue. Compares valuations: Tether $500B, Hype $84B, Circle $22B, Pump $5.5B vs Collector Crypt ~$0.5B FDV; calls the undervaluation 'ridiculous', adding foundation tokens should be excluded from FDV.", "tweet_url": "https://x.com/sjdedic/status/2108908819531039064", "images": [], "type": "thread"}, {"author": "thedefivillain", "summary": "thedefivillain: $AERO holds up well despite altcoin weakness and the launch is a strong catalyst, setting up the textbook 'long into the event, sell the news'; challenged to find a run-up event that didn't become sell-the-news. sjdedic separately is bullish $AERO on the 'best to market' moat.", "tweet_url": "https://x.com/thedefivillain/status/2108860572041372077", "images": ["https://pbs.twimg.com/media/HUQsywUWoAE8X1e.jpg"], "type": "thread"}, {"author": "Zeneca", "summary": "Zeneca: half-joking 'maybe this time is different' on BAT — privacy meta, up-only users, new revenue models, roadmap 4.0 buybacks, a neobank with a 200k card waitlist. Adds past buybacks ($1–2M/month in 2021–22) don't predict the new structure since they just recycled user rewards.", "tweet_url": "https://x.com/Zeneca/status/2108893654710632757", "images": [], "type": "tweet"}]}, {"cluster": "US Treasury May Cut Long-Bond Auctions", "category": ["macro"], "items": [{"author": "fejau_inc", "summary": "fejau_inc reacts 'Yup, it's coming' to Citigroup's view that Bessent is likely to cut long-dated auction sizes and could even cancel 20-year sales (the 'it's a joke' reply refers to a side comment).", "tweet_url": "https://x.com/fejau_inc/status/2108920155048968414", "images": ["https://pbs.twimg.com/media/ // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
