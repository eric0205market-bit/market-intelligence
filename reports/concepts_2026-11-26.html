nce Dividend", "quote_verified": true}]}], "insight_total": 20, "top_entities": ["Africa", "South Africa", "Egypt", "Nigeria", "Sudan", "Kenya", "Somalia", "WASH", "UNICEF", "BCG"], "source_meta": {"author": "https://www.bcg.com/about/people/experts/dean-muruven", "word_count": 1452, "paywalled": false}}, {"record_id": "10677ed224a1e473", "source_type": "concepts", "source_name": "BCG Henderson Institute", "source_url": "https://www.bcg.com/publications/2026/ai-reshaping-corporate-growth-strategy", "title": "How Will AI Shake Up Your Growth Strategy?", "published_date": "2026-11-25", "language": "en", "processed_at": "2026-11-26T11:10:38Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech", "Energy"], "gist": "BCG's study of 3,669 large public companies finds AI-linked growth initiatives more than doubled (4.9% to 12.7%) after GenAI, and proposes a 2x2 of AI disruption risk vs. AI opportunity yielding four growth strategies: catch the wave, reinvent the core, pivot beyond the core, and step up your game. Capability/knowledge-based moats (e.g., CRM/ERP software, BPO) are most exposed, while position-based moats (brands, scarce assets) are more protected.", "themes": [{"theme": "AI-for-growth adoption data", "insights": [{"claim": "BCG's analysis of 3,669 public companies with over $1B revenue found the share mentioning AI in connection with growth initiatives more than doubled from 4.9% (2017–2022) to 12.7% (2023–2025) after generative AI went mainstream.", "speaker": "Justin Manly", "type": "data_point", "entities": ["BCG", "Generative AI"], "conviction": "high", "so_what": "AI-for-growth disclosure is still a minority behavior (~1 in 8 large growers), so early adopters may still be building differentiated advantage.", "quote": "the share of companies mentioning AI in connection with growth initiatives more than doubled from 4.9% before GenAI to 12.7% after", "locator": "We then analyzed their corporate announcements", "quote_verified": true}, {"claim": "Companies that sustained, accelerated, or reignited above-average growth leveraged AI significantly more in the GenAI era than those delivering below-average growth, making AI adoption a marker of growth leadership.", "speaker": "Justin Manly", "type": "causal", "entities": ["Generative AI"], "conviction": "medium", "so_what": "Screen for AI-linked growth initiatives in shareholder communications as a possible leading indicator of sustained outperformance.", "quote": null, "locator": "We then analyzed their corporate announcements", "quote_verified": false}, {"claim": "Among growth outperformers, 90% of semiconductor companies and 75% of software companies discussed AI in relation to growth, while capital goods rose from 2% to 15% and utilities from 1% to 11% between the pre- and post-GenAI periods.", "speaker": "Justin Manly", "type": "data_point", "entities": ["Semiconductors", "Software", "Capital goods", "Utilities"], "conviction": "high", "so_what": "AI-linked growth is spreading from tech into industrials and utilities — the AI build-out narrative is broadening into old-economy sectors.", "quote": "15% of capital goods companies reported AI use in the AI era, up from 2% in the earlier period—as did 11% of utilities, up from 1%", "locator": "Even among outperformers, the level of AI adoption", "quote_verified": true}, {"claim": "Strong growers in sectors with low AI opportunity and low disruption risk are ten times more likely to embrace AI for growth than their underperforming peers in the same sectors.", "speaker": "Justin Manly", "type": "data_point", "entities": ["Consumer staples", "Consumer durables"], "conviction": "medium", "so_what": "Even in 'AI-neutral' sectors, AI adoption separates winners from laggards — useful for relative-value pair ideas within consumer sectors.", "quote": "they are ten times more likely to do so than their underperforming peers in the same sectors—quietly changing the game while rivals sleep", "locator": "It’s early in the AI era", "quote_verified": true}]}, {"theme": "Disruption vs opportunity matrix", "insights": [{"claim": "A company's AI strategic context is set by two axes: whether AI threatens its business model (disruption) and whether it can serve new AI-driven demand or use AI as a growth accelerator (opportunity), yielding four archetypes.", "speaker": "Justin Manly", "type": "framework", "entities": ["BCG"], "conviction": "high", "so_what": "Map portfolio holdings onto the 2x2 to separate AI beneficiaries, self-disruptors, pivot candidates, and AI-neutral operators.", "quote": null, "locator": "Strategic Context Matters", "quote_verified": false}, {"claim": "Business models built on capability-based advantages such as talent and customer insight are more likely to be disrupted by AI than those with position-based advantages such as brand and resource access.", "speaker": "Justin Manly", "type": "causal", "entities": ["Knowledge-based businesses", "Brands"], "conviction": "high", "so_what": "Favor moats rooted in brands and scarce physical assets over knowledge/talent moats when underwriting AI disruption risk.", "quote": "business models that rely on capability-based competitive advantages (for example, talent, customer insight) are more likely to be disrupted by AI than those with position-based advantages (for example, brand, resource access)", "locator": "The degree of AI disruption risk", "quote_verified": true}, {"claim": "Beyond semiconductors, software, and computing hardware, REITs controlling potential data center sites, utilities supplying energy, and telcos providing connectivity benefit from tailwinds of the AI build-out.", "speaker": "Justin Manly", "type": "thesis", "entities": ["REITs", "Utilities", "Telcos", "Semiconductors", "Data centers"], "conviction": "high", "so_what": "Second-order AI build-out plays include land/REITs, power utilities, and telcos, not just chipmakers.", "quote": null, "locator": "Semiconductors, software, and computing hardware clearly benefit", "quote_verified": false}]}, {"theme": "Historical waves of tech demand", "insights": [{"claim": "Past disruptive technologies show demand shifting in stages: in electrification/mass manufacturing, machine tool makers like Brown & Sharpe benefited first, then mass producers like Ford and Heywood-Wakefield, and finally consumer channels like Sears' catalog.", "speaker": "Justin Manly", "type": "framework", "entities": ["Brown & Sharpe", "Ford", "Heywood-Wakefield", "Sears"], "conviction": "medium", "so_what": "Expect AI value capture to rotate over time from infrastructure suppliers toward applications and consumer-facing businesses.", "quote": null, "locator": "If past disruptive technologies are a guide", "quote_verified": false}, {"claim": "Internet-era benefits flowed first to infrastructure (fiber, servers, routers), then e-commerce, and ultimately search, streaming, social networks, and SaaS — implying AI demand will similarly evolve beyond today's build-out into follow-on areas like AI integration services, security, and robotics.", "speaker": "Justin Manly", "type": "prediction", "entities": ["Internet", "SaaS", "Robotics", "AI integration services"], "conviction": "medium", "so_what": "Position for the next leg of AI demand (integration, security, robotics) as infrastructure spend matures.", "quote": "over time, it is expected to drive follow-on demand in areas like AI integration services, security, robotics, and more", "locator": "Similarly, with the advent of the internet", "quote_verified": true}]}, {"theme": "Catch the wave: AI build-out", "insights": [{"claim": "Companies positioned to serve AI build-out demand (construction, data center equipment, semiconductors, energy solutions) should raise growth ambition and ruthlessly prioritize demand pools by size, profitability, and right to win, while hedging to retain attractive non-AI customers.", "speaker": "Justin Manly", "type": "framework", "entities": ["Data centers", "Semiconductors", "Energy solutions", "Construction"], "conviction": "high", "so_what": "Watch whether AI-exposed suppliers are neglecting legacy customers — a concentration risk if AI capex slows.", "quote": null, "locator": "Positioned to benefit from the AI build-out?", "quote_verified": false}, {"claim": "During the dot-com bubble many fiber optic players bet everything on internet demand and, when it burst, found they had lost touch with traditional customers — a warning for AI build-out suppliers today.", "speaker": "Justin Manly", "type": "contrarian", "entities": ["Fiber optics", "Dot-com bubble"], "conviction": "medium", "so_what": "AI infrastructure suppliers with heavy AI revenue concentration carry dot-com-style bust risk; reward those preserving diversified customer bases.", "quote": "don’t put all your eggs in one basket. During the dot-com era, many fiber optic players did just that", "locator": "Importantly, don’t put all your eggs", "quote_verified": true}]}, {"theme": "Reinvent or pivot under disruption", "insights": [{"claim": "Software firms in CRM, ERP, and similar categories whose knowledge-based advantages are vulnerable to AI must self-disrupt and reimagine offerings as AI-first before AI-first upstarts or rivals do.", "speaker": "Justin Manly", "type": "thesis", "entities": ["CRM", "ERP", "Software"], "conviction": "high", "so_what": "Incumbent enterprise software faces existential AI-native competition; assess each vendor's AI-first transition and its talent, compute, and data plans.", "quote": "Could an AI-first upstart eat your lunch? Reinvent the core.", "locator": "Could an AI-first upstart eat your lunch?", "quote_verified": true}, {"claim": "Denial is the critical pitfall for disrupted incumbents: Blockbuster had a strong brand and loyal customers but failed to move decisively into online rentals and lost to Netflix, while Walmart methodically built an online business.", "speaker": "Justin Manly", "type": "anecdote", "entities": ["Blockbuster", "Netflix", "Walmart"], "conviction": "high", "so_what": "Brand loyalty is not a defense against technology disruption; penalize incumbents slow to reinvent.", "quote": "A critical pitfall is denial.", "locator": "A critical pitfall is denial.", "quote_verified": true}, {"claim": "Business process outsourcing companies could be disrupted by agentic AI commoditizing their offerings and may need to pivot beyond the core into adjacent value pools using M&A and partnerships.", "speaker": "Justin Manly", "type": "prediction", "entities": ["Business process outsourcing", "Agentic AI"], "conviction": "medium", "so_what": "BPO is a prime AI-disruption short/watch list; look for credible pivots or M&A as catalysts.", "quote": "Many business process outsourcing companies, for example, could find themselves disrupted by the rise of agentic AI—and need to chart a new course.", "locator": "Does AI threaten to erase your advantage?", "quote_verified": true}, {"claim": "Fujifilm survived digital photography by redeploying its chemicals and advanced materials expertise into health care, cosmetics, and advanced electronics — the model for pivoting when AI commoditizes a core business.", "speaker": "Justin Manly", "type": "anecdote", "entities": ["Fujifilm"], "conviction": "high", "so_what": "When evaluating disrupted firms, focus on which durable capabilities can be redeployed into adjacent markets.", "quote": null, "locator": "Fujifilm’s response to the rise of digital photography", "quote_verified": false}]}, {"theme": "Step up your game: AI as accelerator", "insights": [{"claim": "For sectors like consumer staples and durables where AI is neither a market opportunity nor a threat, the winning approach is to use AI function by function to raise innovation hit rates, go-to-market effectiveness, and order-to-delivery speed, prioritized by ROI.", "speaker": "Justin Manly", "type": "framework", "entities": ["Consumer staples", "Consumer durables"], "conviction": "medium", "so_what": "In AI-neutral sectors, look for firms reinvesting AI-driven gains into advantage rather than superficial adoption.", "quote": null, "locator": "Does AI pose neither a market opportunity nor a threat?", "quote_verified": false}, {"claim": "Domino's won by reorienting its entire go-to-market around digital channels, which now represent more than 85% of its US sales, even though other pizza companies may have launched apps earlier — showing that whole-business reorientation beats 'checking the box' adoption.", "speaker": "Justin Manly", "type": "anecdote", "entities": ["Domino’s"], "conviction": "high", "so_what": "Judge AI adoption by depth of business-model change, not by first-mover tool launches.", "quote": "today, mobile and online represent more than 85% of its US sales", "locator": "Avoid simply “checking the box”", "quote_verified": true}, {"claim": "BCG argues real AI value comes not from broad deployment for everyday tasks but from reshaping end-to-end workflows and inventing new offerings or business models (the deploy, reshape, invent framework).", "speaker": "Justin Manly", "type": "framework", "entities": ["BCG"], "conviction": "medium", "so_what": "Discount companies touting AI tool rollouts; reward evidence of workflow redesign and new AI-enabled revenue lines.", "quote": null, "locator": "BCG highlights three ways organizations embrace AI", "quote_verified": false}]}], "insight_total": 18, "top_entities": ["BCG", "Generative AI", "Semiconductors", "Software", "Utilities", "Blockbuster", "Netflix", "Fujifilm", "Domino’s", "Walmart", "Business process outsourcing", "REITs"], "source_meta": {"author": "https://www.bcg.com/about/people/experts/justin-manly", "word_count": 2159, "paywalled": false}}, {"record_id": "846c7604878b82a6", "source_type": "concepts", "source_name": "BCG Henderson Institute", "source_url": "https://www.bcg.com/publications/2026/cop31-key-takeaways", "title": "Coalitions Deliver Progress at COP31 as Consensus Frays", "published_date": "2026-11-25", "language": "en", "processed_at": "2026-11-26T11:10:31Z", "processor": "claude-code-sub-opus", "tags": ["Energy", "Geopolitics", "Macro", "AI"], "gist": "COP31 in Antalya failed to reach consensus on fossil fuels and finance (the Antalya Pact was rejected by ~90 countries), but voluntary coalitions delivered, notably a 75+ country pledge (incl. China) to lift electricity's share of final energy from 23% to 35% by 2035 backed by $156bn/yr of utility grid, renewables and storage plans. Data-center demand (~945 TWh by 2030) and a $330bn energy-import shock after strikes on Iran sharpen the economic case, and BCG urges businesses to implement now and build policy capabilities ahead of COP32.", "themes": [{"theme": "Formal COP31 negotiations stalled", "insights": [{"claim": "At COP31 in Antalya, Türkiye, negotiators failed to reach consensus on core issues such as fossil fuels and climate finance, and the main political decision, the Antalya Pact, was rejected by around ninety countries.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["COP31", "Antalya Pact", "Türkiye"], "conviction": "high", "so_what": "Multilateral climate policy is fragmenting; do not underwrite transition investments on the assumption of a binding global fossil-fuel phase-down.", "quote": "was rejected by around ninety countries", "locator": "The COP31 climate conference in Antalya", "quote_verified": true}, {"claim": "BCG argues formal negotiations and voluntary coalitions are complementary tracks: coalitions move faster but depend on negotiations to set direction, while a vibrant Action Agenda can help get stalled negotiations back on track.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["Global Climate Action Agenda", "BCG", "Edmond Rhys Jones"], "conviction": "medium", "so_what": "Track coalition-level pledges (sector, utility, country clubs) as the leading indicator of real transition capex rather than headline COP text.", "quote": "Coalitions can move faster, but they depend on the negotiations to set the direction and bring everyone along.", "locator": "The So What", "quote_verified": true}]}, {"theme": "Electrification pledge and grid capex", "insights": [{"claim": "More than 75 countries, including China, backed a voluntary COP31 pledge to raise electricity's share of final energy consumption from 23% today to 35% by 2035, even as negotiators argued over whether the goal should be explicitly tied to clean energy.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["China", "COP31", "electrification"], "conviction": "high", "so_what": "A 12-point rise in electricity's share of final energy in ~9 years implies sustained demand growth for grids, power equipment, and generation regardless of fuel mix.", "quote": "from 23% today to 35% by 2035", "locator": "Meanwhile, electrification showed what coalitions can achieve", "quote_verified": true}, {"claim": "The COP31 electrification pledge was paired with utilities' plans to invest at least $156 billion a year in grids, renewables and storage, showing coalitions can attach financing and infrastructure commitments to high-level targets.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["utilities", "grids", "renewables", "energy storage"], "conviction": "high", "so_what": "$156bn/yr of committed utility capex is a direct demand signal for transmission, transformer, storage and renewables supply chains.", "quote": "at least $156 billion a year in grids, renewables and storage", "locator": "Importantly, COP31 didn't just launch", "quote_verified": true}, {"claim": "COP31's electrification package included nearly $95 million in catalytic finance aiming to mobilize more than $1.2 billion of private investment, plus a new IEA-led mechanism to track progress ahead of COP32.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["IEA", "COP32", "catalytic finance"], "conviction": "medium", "so_what": "Blended-finance leverage of roughly 13x is targeted; an IEA tracking mechanism creates a public scorecard to monitor pledge delivery.", "quote": null, "locator": "Importantly, COP31 didn't just launch", "quote_verified": false}]}, {"theme": "Other coalition outcomes under the GCAA", "insights": [{"claim": "Under the Global Climate Action Agenda at COP31, philanthropies announced $480 million for methane and other super pollutants, regenerative agriculture programs reached 66 million hectares, and the coalition on compliance carbon markets grew to 13 members.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["Global Climate Action Agenda", "methane", "regenerative agriculture", "compliance carbon markets"], "conviction": "high", "so_what": "Methane abatement and compliance carbon-market linkage are where voluntary coalitions are gaining scale; watch for carbon-market interoperability and methane-monitoring demand.", "quote": null, "locator": "New efforts under the GCAA included", "quote_verified": false}, {"claim": "New COP31 initiatives included a Global Zero Waste Alliance and a UNIDO-hosted green industrialization agenda, while Brazil presented the deforestation roadmap called for by 93 countries at COP30.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["UNIDO", "Brazil", "Global Zero Waste Alliance", "COP30"], "conviction": "medium", "so_what": "Green industrialization and deforestation policy are moving via coalitions; relevant for emerging-market industrial and agri/forestry exposures.", "quote": null, "locator": "New efforts under the GCAA included", "quote_verified": false}]}, {"theme": "Energy security and AI power demand", "insights": [{"claim": "According to the IEA, data center electricity consumption is set to more than double to around 945 TWh by 2030, strengthening the economic case for electrification and grid investment.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["IEA", "data centers", "AI"], "conviction": "high", "so_what": "AI/data-center load growth reinforces the grid and generation capex cycle independent of climate politics.", "quote": "Data center electricity consumption is set to more than double to around 945 TWh by 2030", "locator": "It also comes at a time when the energy transition", "quote_verified": true}, {"claim": "Fossil fuel importers paid an estimated gross extra cost of $330 billion for seaborne crude, oil products and LNG in the six months after the strikes on Iran, according to the Centre for Research on Energy and Clean Air, highlighting energy-security exposure as a driver of transition.", "speaker": "BCG Henderson Institute", "type": "causal", "entities": ["Iran", "LNG", "crude oil", "Centre for Research on Energy and Clean Air"], "conviction": "high", "so_what": "Import-dependent economies have a security (not just climate) motive to electrify; supports domestic renewables and grid policy in fuel-importing nations.", "quote": "a gross extra cost of $330 billion", "locator": "Fossil fuel importers are estimated", "quote_verified": true}, {"claim": "2026 is set to be one of the hottest years on record, a strong El Niño could make 2027 hotter still, and the UN says exceeding 1.5°C of warming is now inevitable, shifting focus to limiting overshoot.", "speaker": "BCG Henderson Institute", "type": "prediction", "entities": ["UN", "El Niño"], "conviction": "high", "so_what": "Physical climate risk is rising near term; adaptation, resilience and weather-exposed sectors (agriculture, insurance, utilities) warrant closer scrutiny.", "quote": "it is now inevitable that the world will exceed 1.5°C of global warming", "locator": "COP31’s Summit came during a year", "quote_verified": true}]}, {"theme": "Business playbook to COP32", "insights": [{"claim": "BCG says progress requires strong, coherent carbon pricing aligned with national decarbonization goals, effective concessional finance for emerging nations, and investment in infrastructure such as electricity grids.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": ["carbon pricing", "concessional finance", "emerging markets", "electricity grids"], "conviction": "medium", "so_what": "Carbon-price coherence and concessional finance are the policy gaps to watch; their absence caps emerging-market transition capex.", "quote": null, "locator": "However, the work ahead is significant", "quote_verified": false}, {"claim": "Ahead of COP32 in Addis Ababa, Ethiopia in November 2027, BCG advises businesses to implement COP31 pledges (e.g., contributing to national electrification programs), help shape regulation via coalitions, and engage with the global stocktake.", "speaker": "BCG Henderson Institute", "type": "prediction", "entities": ["COP32", "Ethiopia", "global stocktake"], "conviction": "medium", "so_what": "COP32 is the next catalyst date for climate-policy-sensitive assets; corporate engagement in national electrification programs is the near-term channel.", "quote": null, "locator": "Now What", "quote_verified": false}, {"claim": "BCG argues that amid increased policy volatility and fragmentation, enhanced policy capabilities can be a source of competitive advantage for proactive companies that assess climate risks to operations and invest to reduce vulnerabilities.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": ["BCG", "policy volatility"], "conviction": "medium", "so_what": "Favor companies with strong regulatory/policy engagement and explicit climate-vulnerability planning as fragmentation rises.", "quote": "Enhanced policy capabilities can be a source of competitive advantage for companies who are proactive", "locator": "Businesses should also take a careful look", "quote_verified": true}]}], "insight_total": 13, "top_entities": ["COP31", "Antalya Pact", "Global Climate Action Agenda", "China", "IEA", "electrification", "Iran", "LNG", "COP32", "Brazil", "carbon pricing"], "source_meta": {"author": "", "word_count": 1011, "paywalled": false}}, {"record_id": "f4662c080b10adad", "source_type": "concepts", "source_name": "BCG Henderson Institute", "source_url": "https://www.bcg.com/publications/2026/telco-core-network-as-a-service", "title": "Elevate Telco Cloud Platforms with Core Network as a Service", "published_date": "2026-11-25", "language": "en", "processed_at": "2026-11-26T11:10:38Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "BCG argues telecom operators should industrialize cloud-native core networks via core network as a service (CNaaS) for standardized, low-differentiation functions. An IMS voice case study shows cloud-native cuts launch time ~50% and IMSaaS another ~30%, with IMSaaS TCO ~50% below self-deployed cloud-native at 1M subscribers but only ~10% at 5M, so the model favors smaller operators.", "themes": [{"theme": "CNaaS operating model shift", "insights": [{"claim": "Core network as a service (CNaaS) extends telco cloud-native transformation by industrializing delivery: core network functions move from individually deployed and operated stacks to standardized, shared, managed services, ranging from single functions like IMS to dedicated IoT cores and full mobile cores.", "speaker": "Michael Breitenstein", "type": "thesis", "entities": ["CNaaS", "IMS", "IoT", "telecom operators"], "conviction": "high", "so_what": "Signals a new managed-service layer in telecom core networks; watch vendors and wholesale carriers packaging core functions as shared services.", "quote": "shifting from individually deployed and operated core network functions toward standardized, shared services", "locator": "We now see the first wave of operators exploring", "quote_verified": true}, {"claim": "Under CNaaS, the provider packages common infrastructure and carrier-grade platform capabilities (security, observability, automation, resilience) into a pre-integrated reusable telco cloud, leaving the operator to focus on network integration, service management, regulatory requirements, and migration.", "speaker": "Michael Breitenstein", "type": "framework", "entities": ["CNaaS", "telco cloud"], "conviction": "high", "so_what": "Shifts operator spend from platform engineering and specialist ops toward service-layer work; reduces in-house cloud-native staffing needs.", "quote": null, "locator": "CNaaS Changes the Operating Model", "quote_verified": false}, {"claim": "Sharing infrastructure, platform engineering, and specialist operations across deployments lets operators spread fixed costs and scarce cloud-native telecom expertise, creating a repeatable foundation for deploying standardized services across markets and operators.", "speaker": "Michael Breitenstein", "type": "causal", "entities": ["CNaaS", "telecom operators"], "conviction": "high", "so_what": "Talent scarcity in cloud-native telecom is a structural driver favoring shared providers with scale.", "quote": "spread fixed costs and scarce cloud-native telecom expertise", "locator": "By sharing infrastructure, platform engineering", "quote_verified": true}, {"claim": "Launching a shared CNaaS network function requires upfront agreement between operator and provider on governance (roadmap prioritization, upgrade scheduling, change approval), defined responsibilities, onboarding, incident and release management, and carrier-grade SLAs.", "speaker": "Michael Breitenstein", "type": "framework", "entities": ["CNaaS", "SLAs"], "conviction": "medium", "so_what": "Governance and SLA terms are the friction point in CNaaS deals; contract complexity is an adoption risk to monitor.", "quote": null, "locator": "Successfully launching a shared network function", "quote_verified": false}]}, {"theme": "Where CNaaS fits: attractiveness framework", "insights": [{"claim": "BCG's CNaaS attractiveness framework rates services on two dimensions: degree of standardization and reuse potential, and potential service/market scale relative to the operator's internal capabilities to deploy and operate it independently.", "speaker": "Michael Breitenstein", "type": "framework", "entities": ["BCG", "CNaaS"], "conviction": "high", "so_what": "Use as a screen for which telecom core services are likely to be outsourced versus kept in-house.", "quote": null, "locator": "Determining Where CNaaS Works Best", "quote_verified": false}, {"claim": "CNaaS fits best for standardized, low-differentiation services where service-specific scale or internal capabilities do not justify dedicated platform and operating resources — such as voice, IoT, and roaming, where reliability and compliance matter more than customized features.", "speaker": "Michael Breitenstein", "type": "thesis", "entities": ["CNaaS", "IoT", "roaming", "voice"], "conviction": "high", "so_what": "Commodity telecom functions are the first candidates for outsourcing; differentiated services stay with operators.", "quote": "The strongest CNaaS fit typically arises in settings involving standardized services, limited differentiation", "locator": "The strongest CNaaS fit typically arises", "quote_verified": true}, {"claim": "Some providers that started with MVNO and IoT platforms are now expanding into IMS and 5G standalone packet core networks, showing CNaaS can move from niche functions to broader mobile services.", "speaker": "Michael Breitenstein", "type": "data_point", "entities": ["MVNO", "IoT", "IMS", "5G standalone"], "conviction": "medium", "so_what": "Track MVNO/IoT platform providers moving up-stack into 5G SA core as emerging competitors to traditional network vendors.", "quote": null, "locator": "Some companies that initially focused on mobile virtual network operators", "quote_verified": false}, {"claim": "For small and medium-size operators, next CNaaS candidates include private enterprise networks, IoT and non-terrestrial network (NTN) use cases, roaming enablement, and Network API Gateway-as-a-Service; for large operators, contained use cases whose initial scale or uptake does not yet justify dedicated platforms.", "speaker": "Michael Breitenstein", "type": "prediction", "entities": ["NTN", "IoT", "Network API Gateway", "private enterprise networks"], "conviction": "medium", "so_what": "Satellite/NTN and network-API exposure could be early managed-service markets, even at large operators testing new use cases.", "quote": null, "locator": "Looking forward, this case study offers a path", "quote_verified": false}]}, {"theme": "IMS voice case study: speed", "insights": [{"claim": "IMS, the platform delivering voice over 4G/5G, is a CNaaS sweet spot because it is highly standardized with limited competitive differentiation, so reliability, regulatory compliance, low cost, and operational simplicity are the primary requirements.", "speaker": "Michael Breitenstein", "type": "thesis", "entities": ["IMS", "4G", "5G"], "conviction": "high", "so_what": "Voice core is a commoditized function — expect operators to treat it as a cost line to minimize rather than a differentiator.", "quote": "IMS is a sweet spot for CNaaS", "locator": "IMS Is an Ideal Case Study", "quote_verified": true}, {"claim": "Moving from traditional IMS to operator-deployed cloud-native IMS cuts time to commercial readiness by roughly 50% via shorter design cycles, automated testing, and reusable test environments; IMSaaS removes roughly another 30% of implementation time through standardized designs and reusable integration assets.", "speaker": "Michael Breitenstein", "type": "data_point", "entities": ["IMS", "IMSaaS"], "conviction": "high", "so_what": "Faster launch timelines strengthen the business case for managed voice platforms, especially for new market entries.", "quote": null, "locator": "Following this speedier sourcing and contracting process", "quote_verified": false}, {"claim": "IMSaaS shortens sourcing and contracting because operators buy a pre-integrated managed service from a single accountable provider instead of coordinating IMS software, infrastructure, and integration across multiple vendors.", "speaker": "Michael Breitenstein", "type": "causal", "entities": ["IMSaaS", "IMS"], "conviction": "medium", "so_what": "Single-throat-to-choke procurement threatens multi-vendor integration revenue pools.", "quote": "procure a pre-integrated managed service from a single accountable service provider", "locator": "Time to Commercial Readiness Improves", "quote_verified": true}, {"claim": "Even though standardized IMS software can be provisioned within minutes, operator-specific network integration, testing, and certification still take longer and remain necessary before commercial readiness.", "speaker": "Michael Breitenstein", "type": "contrarian", "entities": ["IMS"], "conviction": "medium", "so_what": "Integration and certification, not software, remain the bottleneck — limits how fast CNaaS can compress launch timelines.", "quote": null, "locator": "Although telcos can provision standardized IMS software within minutes", "quote_verified": false}]}, {"theme": "IMS voice case study: cost and scale", "insights": [{"claim": "Operator-deployed cloud-native IMS significantly lowers TCO versus traditional IMS, which relies on peak-load sizing, large capacity increments, active/standby reserves, and more manual life-cycle operations; the smaller hardware footprint gains value as memory and server costs rise.", "speaker": "Michael Breitenstein", "type": "causal", "entities": ["IMS", "memory", "servers"], "conviction": "high", "so_what": "Rising memory and server prices increase the payoff from cloud-native hardware efficiency in telecom.", "quote": "The smaller hardware footprint becomes increasingly valuable as memory and broader server costs rise.", "locator": "Total Cost of Ownership Declines", "quote_verified": true}, {"claim": "For an operator with 1 million subscribers, IMSaaS annualized five-year TCO per subscriber is about 50% lower than operator-deployed cloud-native IMS and 80% lower than traditional : "Sovereignty and regulation cap CNaaS penetration among large incumbents.", "quote": null, "locator": "Operator-deployed solutions remain attractive", "quote_verified": false}, {"claim": "Emerging commercial offerings and initial deployments show CNaaS extending toward comprehensive turnkey mobile core solutions supporting enhanced mobile broadband, beyond IMS, IoT core, MVNO/MVNE, private networks, NTN, and roaming.", "speaker": "Michael Breitenstein", "type": "prediction", "entities": ["CNaaS", "enhanced mobile broadband", "MVNE", "NTN"], "conviction": "exploratory", "so_what": "If turnkey mobile cores mature, CNaaS could disrupt full core-network vendor relationships, not just niche functions.", "quote": null, "locator": "CNaaS offers operators of all sizes an alternative", "quote_verified": false}, {"claim": "The IMSaaS analysis was informed by data and insights from Orange Wholesale and ng-voice, indicating these firms are active participants in managed cloud-native voice services.", "speaker": "Michael Breitenstein", "type": "anecdote", "entities": ["Orange Wholesale", "ng-voice"], "conviction": "medium", "so_what": "Orange Wholesale and ng-voice are named reference players in the IMSaaS market.", "quote": null, "locator": "BCG would like to thank Orange Wholesale and ng-voice", "quote_verified": false}]}], "insight_total": 19, "top_entities": ["CNaaS", "IMS", "IMSaaS", "IoT", "MVNO", "5G", "NTN", "Orange Wholesale", "ng-voice", "BCG"], "source_meta": {"author": "https://www.bcg.com/about/people/experts/michael-breitenstein", "word_count": 1622, "paywalled": false}}, {"record_id": "8dc3bfd5e5a60c74", "source_type": "concepts", "source_name": "Chatham House", "source_url": "https://www.chathamhouse.org/2026/11/high-spending-low-impact-can-germanys-defence-policy-deliver-strategic-ambition-and-deter", "title": "High spending, low impact: Can Germany’s defence policy deliver on strategic ambition – and deter Russia?", "published_date": "2026-11-25", "language": "en", "processed_at": "2026-11-26T11:10:34Z", "processor": "claude-code-sub-opus", "tags": ["Geopolitics", "Macro", "Society"], "gist": "Chatham House argues Germany's surge toward 3.5% of GDP core defence spending by 2029 risks low impact because its leadership lacks a clear deterrence doctrine, procurement has run ahead of strategy and skewed to traditional platforms over uncrewed/digital systems, and public support is fragile amid Merz's record-low popularity and AfD's rise. It also flags Polish distrust of German security leadership and recommends deterrence training, published procurement priorities and better public messaging.", "themes": [{"theme": "Spending outpacing strategy", "insights": [{"claim": "Germany aims to become Europe's largest land power, with its core defence budget set to rise to 3.5% of GDP by 2029, and has unveiled plans to reform its defence procurement agency.", "speaker": "Chatham House", "type": "data_point", "entities": ["Germany", "Bundeswehr"], "conviction": "high", "so_what": "Sustained multi-year German defence budget growth underpins demand for European land-systems and defence suppliers.", "quote": "Germany has the stated ambition to become the largest land power in Europe, with a core defence budget set to rise to 3.5 per cent of GDP by 2029.", "locator": "The significant increase in German defence spending", "quote_verified": true}, {"claim": "Germany's political and military leadership lacks a full understanding of how German deterrence should work and what future conflict to expect, risking inefficient defence spending, eroding fragile public support for rearmament, and sending confusing signals to industry.", "speaker": "Chatham House", "type": "causal", "entities": ["Germany"], "conviction": "high", "so_what": "Headline German defence budgets may translate into slower or lumpier contract flow than investors expect; watch for procurement execution, not just budget numbers.", "quote": "That risks making the increased defence spending inefficient, undermining fragile public support for rearmament. And it could send confusing signals to industry.", "locator": "In its political and military leadership", "quote_verified": true}, {"claim": "Germany struggles to turn new strategy documents into action partly because some, like the Bundeswehr's 2026 military strategy, were written for the first time, so Germany lacks the established strategy-to-implementation pathways other NATO countries have.", "speaker": "Chatham House", "type": "causal", "entities": ["Bundeswehr", "NATO", "Germany"], "conviction": "medium", "so_what": "Expect a learning curve and implementation lag in German defence programmes relative to allies with mature processes.", "quote": null, "locator": "A clear strategy", "quote_verified": false}, {"claim": "German procurement in some cases ran ahead of strategy, which inhibited procurement reform, sent mixed messages to industry and produced disjointed, traditional contracts, such as post-contract adjustments to a large Boxer armoured vehicle order.", "speaker": "Chatham House", "type": "causal", "entities": ["Boxer", "Germany"], "conviction": "medium", "so_what": "Contract renegotiations and adjustments are a risk for suppliers of large German orders signed before strategy was settled.", "quote": "in some cases procurement has come ahead of the strategy", "locator": "What’s more, in some cases procurement", "quote_verified": true}]}, {"theme": "Legacy kit vs drones and digital", "insights": [{"claim": "German defence orders have skewed toward big traditional platforms such as frigates, helicopters and armoured vehicles, while the Bundeswehr compares poorly within NATO on orders for uncrewed systems and digital support infrastructure.", "speaker": "Chatham House", "type": "data_point", "entities": ["Bundeswehr", "NATO", "uncrewed systems"], "conviction": "high", "so_what": "Germany's underinvestment in uncrewed and digital systems is a gap that future procurement priorities may need to close, a potential catch-up opportunity for drone and defence-tech suppliers.", "quote": "the Bundeswehr compares poorly for orders placed for uncrewed systems and digital support infrastructure", "locator": "Additionally, traditional procurement types", "quote_verified": true}, {"claim": "A simple, affordable procurement fix would be for the German government to publish a disciplined list of procurement priorities so industry can react and compete accordingly.", "speaker": "Chatham House", "type": "thesis", "entities": ["Germany"], "conviction": "medium", "so_what": "If Berlin publishes clear priority lists, defence firms gain visibility to size capacity and bids; watch for such publications as a demand signal.", "quote": "a simple and affordable improvement might be for the German government to be more disciplined in publishing a list of priorities for procurement", "locator": "Procurement reform has been written about widely", "quote_verified": true}]}, {"theme": "Conventional deterrence gap", "insights": [{"claim": "Advanced conventional capabilities such as deep precision strike are taking over parts of the traditionally nuclear deterrence mission, eroding old assumptions about the nuclear-conventional balance.", "speaker": "Chatham House", "type": "framework", "entities": ["deep precision strike"], "conviction": "medium", "so_what": "Deep precision strike capabilities may gain priority in European budgets as they are reframed as deterrence tools, not just defence.", "quote": "Some advanced conventional capabilities, such as deep precision strike, are taking on parts of a traditionally nuclear deterrence mission.", "locator": "Meanwhile, Berlin is struggling", "quote_verified": true}, {"claim": "Post-cold war NATO thinking siloed nuclear and conventional capabilities, so non-nuclear allies like Germany treated their militaries as tools to defend rather than deter, and this weak grasp of what to deter hampers German procurement decisions.", "speaker": "Chatham House", "type": "causal", "entities": ["NATO", "Germany"], "conviction": "high", "so_what": "Doctrine confusion is a root cause of procurement inefficiency; doctrinal clarity would precede a sharper, more coherent German order book.", "quote": "Conventional militaries’ role was traditionally to defend, not deter aggression or fight to win.", "locator": "But NATO thinking since the end of the cold war", "quote_verified": true}, {"claim": "Germany needs to upskill officials and civil servants in deterrence concepts and build leadership consensus on what Russia has learned from the war in Ukraine and the resulting capability gaps; it can copy the UK, which runs regular deterrence training for civil servants, and draw on its strong strategic-studies academic community.", "speaker": "Chatham House", "type": "thesis", "entities": ["Germany", "Russia", "Ukraine", "UK"], "conviction": "medium", "so_what": "Capability-gap assessments based on Russia's Ukraine lessons are likely to shape the next wave of German procurement priorities.", "quote": null, "locator": "Germany now needs to find a way to upskill", "quote_verified": false}]}, {"theme": "Domestic politics and the AfD", "insights": [{"claim": "Chancellor Friedrich Merz's popularity has fallen to the lowest on record for a German chancellor, and the government has struggled to win public support for rearmament and especially for Ukraine.", "speaker": "Chatham House", "type": "data_point", "entities": ["Friedrich Merz", "Ukraine"], "conviction": "high", "so_what": "Weak public backing makes the durability of German rearmament and Ukraine aid a political risk to monitor.", "quote": null, "locator": "Public opinion", "quote_verified": false}, {"claim": "The rise of the far-right AfD, whose supporters largely oppose aid to Ukraine and whose leadership does not see Russia as a threat, would likely seriously challenge EU and NATO security cooperation if the AfD entered government.", "speaker": "Chatham House", "type": "prediction", "entities": ["Alternative für Deutschland", "AfD", "Russia", "EU", "NATO"], "conviction": "medium", "so_what": "AfD electoral gains are a key tail risk for European defence cohesion and Ukraine support; track German state and federal polls.", "quote": "It would likely be a serious challenge to EU and NATO cooperation on European security were the AfD to become a party of government.", "locator": "Falling support for the government", "quote_verified": true}, {"claim": "The German government should build a sustained, coherent narrative on the Russian threat and stop alienating young Germans with mixed messages on forced conscription, instead highlighting the opportunities it creates for them.", "speaker": "Chatham House", "type": "thesis", "entities": ["Germany", "Russia"], "conviction": "medium", "so_what": "Conscription policy is a social flashpoint that could affect support for rearmament among younger voters.", "quote": "rather than scaring them with mixed messages on forced conscription", "locator": "In order to bring its people along", "quote_verified": true}]}, {"theme": "Poland's distrust of German leadership", "insights": [{"claim": "Poland remains uncomfortable with Germany leading European security, especially as AfD support rises; Foreign Minister Radosław Sikorski warned after the AfD's record Saxony-Anhalt result that a rearmed Germany under a far-right, pro-Russian party is dangerous.", "speaker": "Chatham House", "type": "anecdote", "entities": ["Poland", "Radosław Sikorski", "AfD", "Saxony-Anhalt"], "conviction": "high", "so_what": "Intra-European friction may limit how far German-led defence integration can go.", "quote": "‘We remember all too well where a rearmed Germany in the hands of a far-right, pro-Russian party can lead,’", "locator": "Mending fences", "quote_verified": true}, {"claim": "In upcoming Ukraine peace talks, Polish negotiators will closely watch for any German concessions to Russia, given Poland's long criticism of Germany's past prioritisation of business ties with Russia.", "speaker": "Chatham House", "type": "prediction", "entities": ["Poland", "Germany", "Russia", "Ukraine"], "conviction": "medium", "so_what": "Any German softness toward Russia in peace negotiations could fracture the Germany-Poland axis and EU unity.", "quote": null, "locator": "Germany and Poland will both be part", "quote_verified": false}, {"claim": "Germany must prove the Zeitenwende is a sustained long-term change, with its leading role in NATO forward deployment and Baltic and Eastern flank exercises key to rebuilding trust with Poland, which will take time.", "speaker": "Chatham House", "type": "thesis", "entities": ["Zeitenwende", "NATO", "Poland", "Germany"], "conviction": "medium", "so_what": "Sustained German eastern-flank deployments signal durable defence commitment beyond a one-off spending surge.", "quote": "Germany will also have to demonstrate that the ‘ Zeitenwende ’ is a real, long-term, sustained change", "locator": "However, Polish concerns about Russia", "quote_verified": true}]}], "insight_total": 15, "top_entities": ["Germany", "Bundeswehr", "NATO", "Russia", "Ukraine", "Poland", "Friedrich Merz", "AfD", "Radosław Sikorski", "Boxer", "deep precision strike", "Zeitenwende"], "source_meta": {"author": "", "word_count": 1307, "paywalled": false}}, {"record_id": "f14a6f6dfd19f4ca", "source_type": "concepts", "source_name": "DeepMind Blog", "source_url": "https://deepmind.google/blog/interpreting-mass-spectra-with-google-antigravity/", "title": "Identifying Molecules with Mass Spec Skills for Antigravity", "published_date": "2026-11-25", "language": "en", "processed_at": "2026-11-26T11:11:00Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech"], "gist": "Google DeepMind launched Mass Spec Skills for Google Antigravity, an agent that chains open-source mass spectrometry tools and public databases with Gemini reasoning to turn tandem mass spectra into verified molecular structures, attacking the ~95% of spectra that library search leaves unannotated. On a 100-compound benchmark, skills lifted exact-match accuracy from <4% (no tools) to ~97%, let the lightweight Gemini 3.8 Flash match frontier models, and cut tokens per attempt by up to ~4x.", "themes": [{"theme": "Mass spectrometry's annotation bottleneck", "insights": [{"claim": "Even after a decade of expanding reference libraries, spectral library searches annotate only about 5% of measured tandem mass spectra on average (10% for human samples), leaving the rest as the 'dark matter' of mass spectrometry.", "speaker": "DeepMind Blog", "type": "data_point", "entities": ["mass spectrometry", "MS/MS", "metabolomics"], "conviction": "high", "so_what": "A ~90-95% unannotated data pool is the addressable gap for AI-driven metabolomics, drug-discovery and diagnostics tooling.", "quote": "spectral searches annotate on average only about 5% of measured spectra, and 10% for human samples", "locator": "Yet even after a decade of expanding reference libraries", "quote_verified": true}, {"claim": "Many unannotated mass-spec signals come from molecules already listed in public chemical databases but whose reference spectra were never recorded, so identification requires inferring structure directly from fragment ions rather than library matching.", "speaker": "DeepMind Blog", "type": "causal", "entities": ["PubChem", "mass spectrometry"], "conviction": "high", "so_what": "Tools that bridge chemical databases and de novo fragment interpretation unlock value from existing data without new measurements.", "quote": null, "locator": "Many of the molecules producing these unannotated signals", "quote_verified": false}, {"claim": "The expert workflow for identifying molecules from MS/MS spectra (library check, formula determination, candidate retrieval, fragment testing) uses openly available tools but is too slow per spectrum for studies that produce thousands of spectra, so manual analysis cannot keep up.", "speaker": "DeepMind Blog", "type": "causal", "entities": ["MS/MS", "analytical chemistry"], "conviction": "high", "so_what": "Labor-bound, tool-rich expert workflows are prime targets for agentic automation; throughput rather than tool availability is the constraint.", "quote": "manual analysis cannot keep up, leaving most of these signals unannotated", "locator": "The tools for each step exist and are openly available", "quote_verified": true}]}, {"theme": "Agent plus validated tools architecture", "insights": [{"claim": "Google DeepMind's Mass Spec Skills for Google Antigravity pair Gemini's chemical reasoning with the ability to run established mass spectrometry tools and query public chemical databases, producing a proposed structure and an auditable evidence report for chemist review.", "speaker": "DeepMind Blog", "type": "thesis", "entities": ["Google Antigravity", "Gemini", "Mass Spec Skills", "Google Antigravity"], "conviction": "high", "so_what": "Signals Google's strategy of vertical scientific 'skills' plugins on its agent IDE as a wedge into lab and pharma R&D workflows.", "quote": null, "locator": "Today, we are sharing Mass Spec Skills", "quote_verified": false}, {"claim": "DeepMind argues a language model cannot identify molecules from mass spectra on its own because the task requires precise mass calculations, searches across databases of millions of compounds and bond-breaking simulations, so LLM reasoning must be paired with dedicated chemistry tools.", "speaker": "DeepMind Blog", "type": "framework", "entities": ["Gemini", "LLM", "cheminformatics"], "conviction": "high", "so_what": "Supports the thesis that domain tool integration, not raw model scale, is the moat for scientific AI agents.", "quote": "A language model cannot do this on its own, since matching fragments to a structure takes precise mass calculations", "locator": "A language model cannot do this on its own", "quote_verified": true}, {"claim": "The Mass Spec Skills wrap community open-source tools including matchms, GNPS and MoNA library search, SIRIUS fragmentation trees, MAGMa, MetFrag and RDKit, chaining them automatically from a plain-language prompt so non-computational scientists can use them.", "speaker": "DeepMind Blog", "type": "data_point", "entities": ["matchms", "GNPS", "MoNA", "SIRIUS", "MAGMa", "MetFrag", "RDKit", "PubChem"], "conviction": "high", "so_what": "Agent layers commoditize access to open-source scientific software; value accrues to the orchestrator platform rather than the individual tools.", "quote": null, "locator": "Researchers can describe their task and any instrument-specific tolerances", "quote_verified": false}, {"claim": "Spectral coverage scores alone cannot separate isomers: in DeepMind's worked example the true molecule and two rejected non-urea isomers all explained the same 97.7% of summed fragment intensity, and only checking diagnostic neutral losses and bond connectivity, as a chemist would, identified the correct structure.", "speaker": "DeepMind Blog", "type": "framework", "entities": ["MAGMa", "PubChem", "Gemini"], "conviction": "high", "so_what": "Shows where LLM reasoning adds value on top of deterministic scoring tools: tie-breaking via mechanistic chemistry.", "quote": "Spectral coverage measures how much peak intensity a candidate matches by mass alone", "locator": "Spectral coverage measures how much peak intensity", "quote_verified": true}, {"claim": "In an end-to-end negative-mode example with library lookup disabled, the agent filtered 1,761 raw peaks to 19, used SIRIUS to find formula C20H21ClN6O at -1.5 ppm error, scored all 845 PubChem isomers, narrowed to five urea regioisomers and singled out the true molecule (CID 137835447).", "speaker": "DeepMind Blog", "type": "anecdote", "entities": ["SIRIUS", "PubChem", "matchms"], "conviction": "medium", "so_what": "Demonstrates the agent can handle harder negative-ion spectra, where reference libraries are thin, extending addressable data.", "q // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
