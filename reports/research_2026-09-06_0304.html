  html += '</div>';
  html += '<div class="' + chartBoxClass + '">' + chartLabel + item.charts.desc + '</div>';
  html += '<div class="linkrow"><a href="' + item.link + '" target="_blank">↗ Read full article</a></div>';
  html += '</div></div>';
  return html;
}

function render(forceOpenForSrc) {
  buildFilters();
  var filtered = ITEMS.filter(function(i) {
    if (activeSrc && i.source.indexOf(activeSrc) === -1) return false;
    if (!activeSrc && activeCat !== 'all' && i.cat !== activeCat) return false;
    if (!activeSrc && activeUrg !== 'all' && i.urgency !== activeUrg) return false;
    return true;
  });
  var cardsEl = document.getElementById('cards');
  var emptyEl = document.getElementById('emptyState');
  if (filtered.length === 0) {
    cardsEl.innerHTML = '';
    emptyEl.style.display = 'block';
  } else {
    emptyEl.style.display = 'none';
    cardsEl.innerHTML = filtered.map(function(i) { return renderCard(i, activeSrc ? true : false); }).join('');
  }
}

function buildReport() {
  var html = '';
  html += '<p><b>Time window:</b> ' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</p>';
  html += '<p><b>Emails in window:</b> ' + META.emailsInWindow + ' &nbsp;|&nbsp; <b>Emails read:</b> ' + META.emailsRead + ' &nbsp;|&nbsp; <b>Items extracted:</b> ' + META.itemsExtracted + '</p>';
  html += '<p><b>Included sources:</b></p><ul>';
  META.includedSources.forEach(function(s) {
    html += '<li><span class="src-link" onclick="filterBySrc(\'' + s.name + '\')">' + s.name + '</span> — ' + s.count + ' item' + (s.count > 1 ? 's' : '') + '</li>';
  });
  html += '</ul>';
  html += '<p><b>Skipped:</b></p><ul>';
  META.skippedSources.forEach(function(s) {
    html += '<li><b>' + s.name + '</b> — ' + s.reason + '</li>';
  });
  html += '</ul>';
  document.getElementById('reportBody').innerHTML = html;
}

document.getElementById('metaLine').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails';
render();
buildReport();
</script>
