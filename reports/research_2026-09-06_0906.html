const META = {
  date: "2026-09-06",
  time: "09:06 CEST",
  windowStart: "2026-09-06 03:05 CEST",
  windowEnd: "2026-09-06 09:05 CEST",
  emailsInWindow: 8,
  emailsRead: 7,
  itemsExtracted: 16,
  includedSources: [
    { name: "Callum Thomas / Weekly ChartStorm", count: 4 },
    { name: "The Dark Side of the Boom", count: 3 },
    { name: "Michael Parekh / AI-RTZ", count: 4 },
    { name: "Irrational Analysis", count: 3 },
    { name: "Exponential View", count: 2 }
  ],
  skippedSources: [
    { name: "GitHub notifications (CI failure alert)", reason: "Automated build-status notification, not analytical/newsletter content — outside scope of this routine." }
  ]
};

const CAT_COLORS = {
  macro: "#e24b4a", credit: "#378add", positioning: "#ef9f27", aiinfra: "#1d9e75",
  crypto: "#7f77dd", geopolitics: "#d85a30", energy: "#f97316", tech: "#06b6d4",
  gold: "#d4a017", culture: "#ec4899", labor: "#8b5cf6", regulation: "#64748b",
  science: "#14b8a6", venture: "#84cc16"
};
const CAT_LABELS = {
  macro: "macro", credit: "credit", positioning: "positioning", aiinfra: "AI/infra",
  crypto: "crypto", geopolitics: "geopolitics", energy: "energy", tech: "tech",
  gold: "gold", culture: "culture", labor: "labor", regulation: "regulation",
  science: "science", venture: "venture"
};
const URG_LABELS = { act: "🔴 Act Now", deep: "🔵 Deep", watch: "🟡 Watch" };
const URG_EMOJI = { act: "🔴", deep: "🔵", watch: "🟡" };

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function buildFilterBars(){
  const catCounts = {};
  ITEMS.forEach(function(i){ catCounts[i.cat] = (catCounts[i.cat]||0)+1; });
  const catBar = document.getElementById("catBar");
  let html = '<span class="pill' + (activeCat==="all"?" active":"") + '" style="' + (activeCat==="all"?"background:#333;":"") + '" onclick="setCat(\'all\')">All <span class="count">' + ITEMS.length + '</span></span>';
  Object.keys(catCounts).forEach(function(c){
    const isActive = activeCat === c;
    const style = isActive ? ("background:" + CAT_COLORS[c] + ";") : "";
    html += '<span class="pill' + (isActive?" active":"") + '" style="' + style + '" onclick="setCat(\'' + c + '\')">' + esc(CAT_LABELS[c]) + ' <span class="count">' + catCounts[c] + '</span></span>';
  });
  catBar.innerHTML = html;

  const urgCounts = {};
  ITEMS.forEach(function(i){ urgCounts[i.urgency] = (urgCounts[i.urgency]||0)+1; });
  const urgBar = document.getElementById("urgBar");
  let uhtml = '<span class="pill' + (activeUrg==="all"?" active":"") + '" style="' + (activeUrg==="all"?"background:#333;":"") + '" onclick="setUrg(\'all\')">All <span class="count">' + ITEMS.length + '</span></span>';
  ["act","deep","watch"].forEach(function(u){
    if(!urgCounts[u]) return;
    const isActive = activeUrg === u;
    const style = isActive ? "background:#333;" : "";
    uhtml += '<span class="pill' + (isActive?" active":"") + '" style="' + style + '" onclick="setUrg(\'' + u + '\')">' + URG_LABELS[u] + ' <span class="count">' + urgCounts[u] + '</span></span>';
  });
  urgBar.innerHTML = uhtml;
}

function setCat(c){ activeCat = c; activeSrc = null; renderCards(); buildFilterBars(); }
function setUrg(u){ activeUrg = u; activeSrc = null; renderCards(); buildFilterBars(); }
function filterBySrc(name){
  activeSrc = name; activeCat = "all"; activeUrg = "all";
  buildFilterBars();
  renderCards();
}

function cardHtml(item){
  const color = CAT_COLORS[item.cat];
  const chartFlag = item.charts && item.charts.count > 0 ? (item.charts.hot ? "🔥" : "📊") : "";
  let html = '<div class="card" id="card-' + item.id + '">';
  html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
  html += '<span class="idx">#' + item.id + '</span>';
  html += '<span class="urg">' + URG_EMOJI[item.urgency] + '</span>';
  html += '<span class="src-badge" style="background:' + color + '">' + esc(item.source) + '</span>';
  html += '<span class="cat-tag">' + esc(CAT_LABELS[item.cat]) + '</span>';
  if(chartFlag) html += '<span class="chart-flag">' + chartFlag + '</span>';
  html += '<span class="card-title">' + esc(item.title) + '</span>';
  html += '</div>';
  html += '<div class="card-body" id="body-' + item.id + '">';
  html += '<div class="section-label">The Idea</div><div class="idea-text">' + esc(item.idea) + '</div>';
  html += '<div class="section-label">My Angle</div><div class="angle-box" style="border-left-color:' + color + ';background:' + color + '14;">' + esc(item.angle) + '</div>';
  html += '<div class="tweets">';
  html += '<div class="tweet"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + esc(item.tweetA) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  html += '<div class="tweet"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + esc(item.tweetB) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
  html += '</div>';
  if(item.charts){
    html += '<div class="charts-box' + (item.charts.hot ? " hot" : "") + '">📊 ' + item.charts.count + ' chart(s) — ' + esc(item.charts.desc) + '</div>';
  }
  html += '<div class="link-row"><a href="' + item.link + '" target="_blank" rel="noopener">↗ Read full article</a></div>';
  html += '</div></div>';
  return html;
}

function renderCards(){
  const container = document.getElementById("cards");
  let list = ITEMS.slice();
  if(activeSrc){
    list = list.filter(function(i){ return i.source.indexOf(activeSrc) !== -1; });
  } else {
    if(activeCat !== "all") list = list.filter(function(i){ return i.cat === activeCat; });
    if(activeUrg !== "all") list = list.filter(function(i){ return i.urgency === activeUrg; });
  }
  if(list.length === 0){
    container.innerHTML = '<div class="empty-state">No items match this filter.</div>';
    return;
  }
  container.innerHTML = list.map(cardHtml).join("");
  if(activeSrc){
    list.forEach(function(i){
      const body = document.getElementById("body-" + i.id);
      if(body) body.classList.add("open");
    });
  }
}

function toggleCard(id){
  const body = document.getElementById("body-" + id);
  if(body) body.classList.toggle("open");
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function buildReport(){
  let html = '<h4>Time Window</h4>';
  html += '<div>' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</div>';
  html += '<h4>Totals</h4>';
  html += '<div>' + META.emailsInWindow + ' emails in window · ' + META.emailsRead + ' read · ' + META.itemsExtracted + ' items extracted</div>';
  html += '<h4>Included Sources</h4>';
  META.includedSources.forEach(function(s){
    html += '<div><span class="src-link" onclick="filterBySrc(\'' + s.name.replace(/'/g, "\\'") + '\')">' + esc(s.name) + '</span> — ' + s.count + ' item(s)</div>';
  });
  html += '<h4>Skipped Sources</h4>';
  META.skippedSources.forEach(function(s){
    html += '<div>' + esc(s.name) + ' — ' + esc(s.reason) + '</div>';
  });
  document.getElementById("reportBody").innerHTML = html;
}

document.getElementById("reportHead").addEventListener("click", function(){
  const body = document.getElementById("reportBody");
  const icon = document.getElementById("reportToggleIcon");
  body.classList.toggle("open");
  icon.textContent = body.classList.contains("open") ? "▴" : "▾";
});

document.getElementById("metaLine").textContent =
  META.date + " · " + META.time + " · " + META.itemsExtracted + " items from " + META.emailsRead + " emails";

buildFilterBars();
renderCards();
buildReport();
</script>
