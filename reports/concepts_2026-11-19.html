* { box-sizing: border-box; margin: 0; padding: 0; }

 releases solvency and reserve capital, transfers asset and market risk, and steers cash and earnings across the group", "locator": "Internal and External Reinsurance.", "quote_verified": true}]}, {"theme": "CFO agenda and valuation link", "insights": [{"claim": "Insurers that can convert capital strength into cash, growth, and distributions and show how will be rewarded, while those that cannot will face valuation pressure, making capital management a strategic rather than technical priority.", "speaker": "Anastasios Panagiotou", "type": "prediction", "entities": ["CFOs", "insurers"], "conviction": "high", "so_what": "Expect re-rating divergence between insurers with credible capital-to-cash equity stories and those without.", "quote": "Insurers that can convert capital strength into cash, growth, and distributions—and can show how—will be rewarded", "locator": "A Strategic Agenda for CFOs", "quote_verified": true}, {"claim": "CFOs should ask five questions: how they compare to peers on capital generation, cash conversion, capital productivity, and distributions; how much capital is truly deployable; where capital creates most value; whether full optimization potential is used; and where the next euro of capital should go.", "speaker": "Anastasios Panagiotou", "type": "framework", "entities": ["CFOs"], "conviction": "medium", "so_what": "Mirror these five questions in investor engagement with insurer management.", "quote": null, "locator": "Here are five questions CFOs should ask", "quote_verified": false}, {"claim": "Benefits of capital management take time to materialize because assessing opportunities, prioritizing, and implementing solutions follow building the capability, so insurers that delay will lag.", "speaker": "Anastasios Panagiotou", "type": "thesis", "entities": ["insurers"], "conviction": "medium", "so_what": "Capital-optimization programs announced now likely pay off over multi-year horizons; set expectations accordingly.", "quote": null, "locator": "The progression of capital management", "quote_verified": false}]}], "insight_total": 22, "top_entities": ["European insurers", "Solvency II", "CFOs", "reinsurance", "strategic asset allocation", "ALM", "AI", "BCG", "UK", "Netherlands"], "source_meta": {"author": "https://www.bcg.com/about/people/experts/anastasios-panagiotou", "word_count": 2455, "paywalled": false}}, {"record_id": "282a44e555466fcf", "source_type": "concepts", "source_name": "BCG Henderson Institute", "source_url": "https://www.bcg.com/publications/2026/countries-strengthen-energy-security", "title": "Today’s Threats Demand a Holistic Approach to Energy Security", "published_date": "2026-11-18", "language": "en", "processed_at": "2026-11-19T11:11:47Z", "processor": "claude-code-sub-opus", "tags": ["Energy", "Geopolitics", "Macro"], "gist": "BCG (Maurice Berns) argues the Hormuz-driven crisis, the largest oil supply disruption on record (~15 mb/d with no bypass), shows energy security must be a whole-system resilience effort rather than fuel procurement. It proposes five linked elements (domestic resources, asset resilience, cross-border partnerships, supply chain resilience, homefront preparation), stressing converging dependencies like Japan's 95% Middle East crude reliance and China's ~90% rare earth refining share, and says governments must set priorities and decide who pays while private capital delivers.", "themes": [{"theme": "Hormuz shock scale and damage", "insights": [{"claim": "BCG estimates the Middle East conflict has caused the largest oil supply disruption on record, with about 15 million barrels per day of oil and products (roughly 15% of global consumption) having no alternative route around the Strait of Hormuz.", "speaker": "Maurice Berns", "type": "data_point", "entities": ["Strait of Hormuz", "Middle East"], "conviction": "high", "so_what": "A structural, not transient, supply gap supports elevated crude/product prices and tanker/route premia while Hormuz is impaired.", "quote": "Some 15 million barrels of oil and petroleum products per day, equivalent to roughly 15% of global consumption, have no alternative route around the Strait of Hormuz.", "locator": "The world is facing an energy crisis", "quote_verified": true}, {"claim": "India has lost more than 40% of its crude flows in the Hormuz crisis, and its state oil companies are absorbing losses of more than $100 million per day to shield consumers.", "speaker": "Maurice Berns", "type": "data_point", "entities": ["India"], "conviction": "high", "so_what": "Watch Indian state oil marketers' balance sheets and fiscal support; consumer price shielding transfers losses onto SOEs and the sovereign.", "quote": "India has lost more than 40% of its crude flows, with state oil companies absorbing losses of more than $100 million per day to shield consumers.", "locator": "The world is facing an energy crisis", "quote_verified": true}, {"claim": "Qatar's Ras Laffan has lost 17% of its LNG export capacity, with rebuilding expected to take three to five years, implying a multi-year LNG supply deficit independent of how quickly the conflict ends.", "speaker": "Maurice Berns", "type": "data_point", "entities": ["Qatar", "Ras Laffan", "liquefied natural gas"], "conviction": "high", "so_what": "Multi-year LNG tightness supports non-Gulf LNG suppliers and long-term contract pricing; damage outlasts any ceasefire.", "quote": "Qatar’s Ras Laffan has lost 17% of its liquefied natural gas export capacity, with rebuilding expected to take three to five years.", "locator": "The world is facing an energy crisis", "quote_verified": true}, {"claim": "The crisis is drawing down already strained buffers, including the US Strategic Petroleum Reserve, global oil inventories and European natural gas storage, so the damage to the energy system would take years to repair even if the conflict ended immediately.", "speaker": "Maurice Berns", "type": "prediction", "entities": ["Strategic Petroleum Reserve", "US", "Europe"], "conviction": "high", "so_what": "Inventory and reserve refill demand will act as a floor under prices after the crisis; expect restocking bids.", "quote": "Even if the crisis ended today, the damage to the global energy system would take years to repair.", "locator": "The world is facing an energy crisis", "quote_verified": true}, {"claim": "In a single week in March 2026, Iranian missiles and drones struck energy infrastructure across four Gulf producers: a drone hit a major Saudi refinery, two of Kuwait's three refineries caught fire, and the UAE's largest gas plant shut down entirely.", "speaker": "Maurice Berns", "type": "anecdote", "entities": ["Iran", "Saudi Arabia", "Kuwait", "UAE"], "conviction": "high", "so_what": "Gulf refining and gas processing capacity is a live target set; product cracks and regional refining margins carry attack risk.", "quote": null, "locator": "In the Middle East, during a single week in March 2026", "quote_verified": false}]}, {"theme": "Deliberate attacks on energy assets", "insights": [{"claim": "Reported physical security incidents affecting the North American grid rose from roughly 2,800 in 2023 to more than 3,500 in 2025.", "speaker": "Maurice Berns", "type": "data_point", "entities": ["North America"], "conviction": "high", "so_what": "Rising grid-attack frequency supports spending on substation security, spare transformers and grid hardening vendors.", "quote": null, "locator": "In North America, reported physical security incidents", "quote_verified": false}, {"claim": "Since three of four Nord Stream pipelines were destroyed in 2022, more than 10 other undersea cables and pipelines have been damaged across the Baltic Sea, and malware disrupted remote monitoring of 5,800 German wind turbines at the start of Russia's invasion of Ukraine.", "speaker": "Maurice Berns", "type": "data_point", "entities": ["Nord Stream", "Baltic Sea", "Germany", "Russia", "Ukraine"], "conviction": "high", "so_what": "Subsea infrastructure and renewable fleet control systems are proven targets; demand for subsea surveillance, repair vessels and OT cybersecurity.", "quote": null, "locator": "In Europe, three of the four Nord Stream pipelines", "quote_verified": false}, {"claim": "Cyber attacks on energy infrastructure have risen sharply since Russia's invasion of Ukraine; per Dragos, the number of industrial ransomware groups rose almost 50% from 2024 to 2025, and in July 2026 an Iran-linked cyber attack reportedly shut a small UK power station for four days.", "speaker": "Maurice Berns", "type": "data_point", "entities": ["Dragos", "Iran", "UK", "Russia"], "conviction": "high", "so_what": "OT/industrial cybersecurity is a growing, underreported threat surface — a secular tailwind for industrial cyber vendors.", "quote": "the number of ransomware groups increasing almost 50% from 2024 to 2025 and affecting thousands of organizations", "locator": "Cyber threats add another dimension", "quote_verified": true}, {"claim": "Because attackers, targets and exploited vulnerabilities cannot be predicted, BCG argues energy security must be embedded across the whole system and built before it is needed, rather than designed around a single anticipated threat.", "speaker": "Maurice Berns", "type": "thesis", "entities": ["energy security"], "conviction": "high", "so_what": "Favors broad, system-wide resilience spending over point solutions — a durable multi-asset capex theme.", "quote": null, "locator": "Although these incidents vary in scale", "quote_verified": false}]}, {"theme": "Five-element resilience framework", "insights": [{"claim": "BCG proposes a five-element framework for holistic energy security: domestic resources, asset resilience, cross-border collaboration, supply chain resilience and homefront preparation, which must be assessed together because strength in one cannot fully compensate for weakness in another.", "speaker": "Maurice Berns", "type": "framework", "entities": ["BCG"], "conviction": "high", "so_what": "Use the five elements as a checklist to score country energy-security exposure and the likely direction of policy spending.", "quote": "Strength in one area cannot fully compensate for weakness in another.", "locator": "The Five Elements of Holistic Energy Security", "quote_verified": true}, {"claim": "Hidden single points of failure make systems that look resilient in aggregate vulnerable, e.g., renewables reliant on components made predominantly in one country, critical knowledge held by few specialists, or the subsea export cable of an offshore wind farm and the transformer linking a solar farm to the grid.", "speaker": "Maurice Berns", "type": "framework", "entities": ["offshore wind", "solar"], "conviction": "high", "so_what": "Diligence renewable assets for chokepoint components (export cables, transformers) whose loss idles the whole asset.", "quote": "what looks resilient at the aggregate level can become vulnerable when dependencies converge on a common point of failure", "locator": "Vulnerabilities can be hidden within an energy system", "quote_verified": true}, {"claim": "The five elements involve tradeoffs and interact; for example, a country like Japan with strong infrastructure repair capabilities may choose to invest less in asset hardening, so no country is likely to fully optimize all five.", "speaker": "Maurice Berns", "type": "framework", "entities": ["Japan"], "conviction": "medium", "so_what": "Policy spending will be selective and country-specific; expect different national mixes of hardening, reserves and repair capacity.", "quote": null, "locator": "Each element involves tradeoffs across risk", "quote_verified": false}, {"claim": "BCG situates energy services as one critical function within a whole-of-nation defense framework built on national orchestration, critical functions and societal resilience, alongside industrial base, public health, food and water, financial services, police, army and transport.", "speaker": "Maurice Berns", "type": "framework", "entities": ["BCG"], "conviction": "medium", "so_what": "Energy security is increasingly framed as national defense, which can unlock defense-style budgets and procurement for energy assets.", "quote": null, "locator": "The Value of a Whole-of-Nation Strategy", "quote_verified": false}]}, {"theme": "Domestic supply and dependence shifts", "insights": [{"claim": "Roughly 60% of OECD countries import more than half of their energy, and economic strength buys market access but cannot remove supply chain vulnerabilities.", "speaker": "Maurice Berns", "type": "data_point", "entities": ["OECD"], "conviction": "high", "so_what": "Most developed economies remain structurally exposed; supports policy pushes for domestic generation.", "quote": null, "locator": "OECD net importers illustrate the challenge", "quote_verified": false}, {"claim": "Low-carbon sources are breaking the link between domestic production and fossil geology, as Iceland (geothermal) and France (nuclear) show, and wind and solar are especially attractive to fossil-poor countries because they are less constrained by geology.", "speaker": "Maurice Berns", "type": "causal", "entities": ["Iceland", "France", "nuclear", "geothermal", "wind", "solar"], "conviction": "medium", "so_what": "Energy security becomes an additional (non-climate) driver for nuclear and renewables buildout in import-dependent countries.", "quote": null, "locator": "Historically, domestic energy production has largely been determined", "quote_verified": false}, {"claim": "Producing more energy domestically can swap one dependency for another, because generating equipment may rely on imported components, critical minerals or foreign manufacturing capacity, and self-sufficiency often comes at a cost premium.", "speaker": "Maurice Berns", "type": "causal", "entities": ["critical minerals"], "conviction": "high", "so_what": "Renewables-led independence shifts risk from fuel to equipment supply chains; domestic manufacturing incentives likely follow.", "quote": "Reducing one external dependency can therefore create or increase another.", "locator": "But producing more energy domestically", "quote_verified": true}, {"claim": "Energy independence takes 10 to 20 years of sustained investment and policy; the US moved from net importer to net exporter over roughly four decades on the back of shale, and Israel cut import dependence by developing offshore gas.", "speaker": "Maurice Berns", "type": "data_point", "entities": ["US", "Israel", "shale"], "conviction": "medium", "so_what": "Independence plays are long-duration; near-term crises are bridged by reserves and partnerships, not new domestic supply.", "quote": null, "locator": "Increasing energy independence can require sustained investment", "quote_verified": false}, {"claim": "Since the early 2010s, the Netherlands curtailed domestic gas production, Germany phased out nuclear power and the UK constrained oil and gas exploration, decisions BCG says raised external dependence and exposure when conditions change.", "speaker": "Maurice Berns", "type": "contrarian", "entities": ["Netherlands", "Germany", "UK", "nuclear"], "conviction": "medium", "so_what": "Implies political pressure to revisit these choices (North Sea licensing, gas fields, nuclear) as security priorities rise.", "quote": null, "locator": "Countries can also move in the opposite direction", "quote_verified": false}]}, {"theme": "Concentration and chokepoint risk", "insights": [{"claim": "BCG's analysis of three large countries with similar numbers of power stations found that those with more capacity concentrated in their largest plants are far more vulnerable; in one scenario just ten successful attacks could take nearly a third of generating capacity offline.", "speaker": "Maurice Berns", "type": "data_point", "entities": ["BCG"], "conviction": "high", "so_what": "Concentrated grids face higher attack risk, supporting distributed generation, storage and redundancy investments.", "quote": "In one scenario, just ten successful attacks could take nearly a third of generating capacity offline.", "locator": "Our analysis of three large countries", "quote_verified": true}, {"claim": "Distributed generation is not automatically safer: wind farms still have single points of vulnerability in export cables and transformers, while a single large power station can sometimes be easier to defend with anti-drone mesh or missile-intercepting batteries.", "speaker": "Maurice Berns", "type": "contrarian", "entities": ["wind farms", "transformers"], "conviction": "medium", "so_what": "Air defense and physical protection for large plants is an emerging spend category; don't assume distributed equals resilient.", "quote": null, "locator": "Power station size is one factor", "quote_verified": false}, {"claim": "Japan sources about 95% of its crude oil from four Middle Eastern countries, so supplier diversity offers little protection because all those barrels share a dependency on the Strait of Hormuz.", "speaker": "Maurice Berns", "type": "data_point", "entities": ["Japan", "Strait of Hormuz", "Middle East"], "conviction": "high", "so_what": "Japan is acutely exposed to Hormuz; watch its reserve releases and pivot to non-Gulf suppliers.", "quote": "The critical test, therefore, is whether different suppliers and supply routes would remain viable under the same disruption.", "locator": "In Japan, for example, 95% of its crude oil", "quote_verified": true}, {"claim": "Saudi Arabia's East-West Pipeline (Petroline) and the UAE's Habshan pipeline were rapidly used to bypass Hormuz, but their limited capacity cannot fully replace Hormuz shipments; secondary chokepoints like the Lombok Strait can be circumvented at added cost and transit time.", "speaker": "Maurice Berns", "type": "data_point", "entities": ["Saudi Arabia", "East-West Pipeline", "Petroline", "UAE", "Habshan", "Lombok Strait"], "conviction": "high", "so_what": "Bypass pipelines give Saudi and UAE exporters relative advantage but cap total relief; longer routes raise freight and working-capital needs.", "quote": null, "locator": "The appropriate action depends on whether alternatives exist", "quote_verified": false}, {"claim": "China leads the solar supply chain from polysilicon to cells, panels, inverters and batteries and controls about 90% of global rare earth refining capacity, so countries cutting fossil imports can remain exposed to concentrated technology supply chains, though component shortages bite more slowly than fuel disruptions.", "speaker": "Maurice Berns", "type": "causal", "entities": ["China", "rare earth minerals", "solar", "batteries"], "conviction": "high", "so_what": "Supports non-Chinese rare earth refining and solar/battery manufacturing; component risk plays out over buildout and maintenance timelines.", "quote": "China also controls about 90% of the world’s capacity to refine rare earth minerals.", "locator": "Supply chain vulnerabilities also extend beyond", "quote_verified": true}, {"claim": "Germany's pivot from Russian gas toward Norway traded cost and supplier diversification for trust, redundancy and security, showing that few energy partnerships optimize across all dimensions at once.", "speaker": "Maurice Berns", "type": "framework", "entities": ["Germany", "Norway", "Russia"], "conviction": "medium", "so_what": "Trusted suppliers like Norway can command a security premium; partner reliability under stress is being priced.", "quote": "Germany effectively traded cost and supplier diversification for trust, redundancy, and greater security.", "locator": "Germany’s pivot away from Russian gas", "quote_verified": true}]}, {"theme": "Reserves, workforce and preparedness", "insights": [{"claim": "IEA members must hold oil stocks equal to at least 90 days of net imports, and countries are extending stockpiling to other commodities and components, e.g., Japan expanding naphtha and diesel reserves, a shift from just-in-time to just-in-case.", "speaker": "Maurice Berns", "type": "data_point", "entities": ["IEA", "Japan", "naphtha", "diesel"], "conviction": "high", "so_what": "Structural stockpiling demand for products and components adds incremental demand and storage needs beyond crude.", "quote": "reflecting a shift from just-in-time supply chains toward just-in-case preparedness", "locator": "IEA members are required to maintain oil stocks", "quote_verified": true}, {"claim": "Some capabilities cannot be built quickly after a disruption — establishing capacity such as refining defense-specific fuels can take two to three years — so capital deployed after the fact cannot buy immediate options.", "speaker": "Maurice Berns", "type": "causal", "entities": ["defense-specific fuels"], "conviction": "high", "so_what": "Pre-crisis capacity owners (specialty refiners, repair contractors) hold scarcity value during disruptions.", "quote": "Waiting for a disruption to expose a missing capability can therefore leave a country with few immediate options, regardless of how much capital it is prepared to deploy after the fact.", "locator": "Good preparation also means building the capabilities", "quote_verified": true}, {"claim": "Workforce depth is a hidden vulnerability: the US energy workforce grew roughly 20% to 30% over two decades while the UK's moved in the opposite direction, and critical capabilities may rest on few certified specialists or an aging workforce.", "speaker": "Maurice Berns", "type": "data_point", "entities": ["US", "UK"], "conviction": "medium", "so_what": "Skilled-labor scarcity can bottleneck restoration and buildout; watch apprenticeship funding and labor costs in UK energy.", "quote": null, "locator": "Preparation also applies to personnel", "quote_verified": false}, {"claim": "Like the 1973 and 1979 oil shocks that created the IEA, a crude spot market, fuel efficiency standards and strategic reserves, BCG expects today's crisis to require broader institutionalized preparedness spanning fuels, electricity, components, infrastructure and supply chains across borders.", "speaker": "Maurice Berns", "type": "prediction", "entities": ["IEA"], "conviction": "medium", "so_what": "Anticipate new multilateral mechanisms (component reserves, joint stockpiles) as a policy outcome of this crisis.", "quote": null, "locator": "The experience following the oil shocks of the 1970s", "quote_verified": false}]}, {"theme": "Who pays and private value pools", "insights": [{"claim": "Governments cannot deliver holistic energy security through public budgets alone and can use grants, incentives, regulatory minimums and vendor prequalification to make redundancy investments such as storage, electrification and decentralized grids commercially attractive.", "speaker": "Maurice Berns", "type": "thesis", "entities": ["storage", "electrification", "decentralized grids"], "conviction": "high", "so_what": "Expect subsidy and mandate support for storage and grid resilience assets; position capital ahead of incentive programs.", "quote": null, "locator": "Mobilize private-sector investment", "quote_verified": false}, {"claim": "BCG identifies new private-sector value pools from energy security: public procurement contracts, security-as-a-service that monetizes standby or backup capacity, and markets for resilient infrastructure such as underground substations, standardized replacement parts and undersea pipelines.", "speaker": "Maurice Berns", "type": "prediction", "entities": ["Security-as-a-service", "underground substations"], "conviction": "medium", "so_what": "Look for companies positioned as preferred executors of energy security contracts, and for capacity-payment-style revenue for backup assets.", "quote": null, "locator": "Implications for the Private Sector", "quote_verified": false}, {"claim": "In 2025 the UK's Ofgem approved £28 billion of gas and electricity network investment, part of a planned £90 billion through 2031 funded via customer bills, dwarfing the government's £1.3 billion per year taxpayer-funded home energy efficiency program.", "speaker": "Maurice Berns", "type": "data_point", "entities": ["Ofgem", "UK"], "conviction": "high", "so_what": "UK network owners have a large regulated capex pipeline, but bill pressure raises political/regulatory risk on allowed returns.", "quote": null, "locator": "The Question of Affordability", "quote_verified": false}, {"claim": "Household electricity prices rose an average of 36% across the EU and 26% in the US between 2019 and 2024, so added security costs land on already stretched ratepayers and the question of who pays should be an explicit choice.", "speaker": "Maurice Berns", "type": "data_point", "entities": ["EU", "US"], "conviction": "high", "so_what": "Affordability constraints may cap how much resilience cost regulators pass through; watch for burden-shifting to taxpayers or shareholders.", "quote": "The question of who pays should be an intentional choice, rather than a consequence of whichever intervention is cheapest, easiest, or quickest to implement.", "locator": "The Question of Affordability", "quote_verified": true}]}], "insight_total": 32, "top_entities": ["Strait of Hormuz", "Japan", "China", "India", "Qatar", "Germany", "UK", "IEA", "Saudi Arabia", "Ofgem", "Dragos", "Iran"], "source_meta": {"author": "https://www.bcg.com/about/people/experts/maurice-berns", "word_count": 4563, "paywalled": false}}, {"record_id": "e798bed85fe3378a", "source_type": "concepts", "source_name": "Bessemer Venture Partners", "source_url": "https://www.bvp.com/news/boltz-building-towards-programmable-molecular-design", "title": "Boltz: building towards programmable molecular design", "published_date": "2026-11-18", "language": "en", "processed_at": "2026-11-19T11:12:00Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech"], "gist": "Bessemer Venture Partners leads a $110M Series A in Boltz, the MIT-spun, London-based lab whose open-source biomolecular models (5M+ downloads, 100,000+ scientists, AlphaFold3-level performance) are becoming a design platform deployed at Pfizer, Takeda, GSK and BMS. The thesis: like Cursor/Claude Code for software, AI will move preclinical screening and design from benchtop to computer, with BoltzMol-1 cutting hit costs to as low as $10,000.", "themes": [{"theme": "Boltz Series A and open-source traction", "insights": [{"claim": "Bessemer Venture Partners is leading a $110M Series A in Boltz, a London-based AI research lab building foundation models for biomolecular modeling and small-molecule and protein design.", "speaker": "Bessemer Venture Partners", "type": "data_point", "entities": ["Bessemer Venture Partners", "Boltz"], "conviction": "high", "so_what": "A $110M Series A signals investors are paying up for foundation-model labs in biology; a pricing marker for AI-bio rounds.", "quote": "Bessemer is excited to announce that we’re leading their $110M Series A", "locator": "Boltz is driving this paradigm shift", "quote_verified": true}, {"claim": "Boltz's open-source models, developed out of MIT CSAIL and Jameel Clinic in Regina Barzilay's lab, match closed-source counterparts like AlphaFold3 and are used by more than 100,000 scientists across thousands of biotechs, labs and top-20 pharma companies.", "speaker": "Bessemer Venture Partners", "type": "data_point", "entities": ["Boltz", "MIT CSAIL", "Jameel Clinic", "AlphaFold3", "Regina Barzilay"], "conviction": "high", "so_what": "Open-source parity with AlphaFold3 erodes closed-model moats in structure prediction; value shifts to platform, workflow and services.", "quote": "Matching the performance of their closed-source counterparts like AlphaFold3", "locator": "Two years ago, a small team", "quote_verified": true}, {"claim": "Boltz's open-source models have over 5 million downloads, and every Boltz partnership to date began as inbound interest from computational chemists and biologists, an open-source-led, bottoms-up go-to-market.", "speaker": "Bessemer Venture Partners", "type": "data_point", "entities": ["Boltz"], "conviction": "high", "so_what": "Bottoms-up adoption by practitioners inside pharma is a low-CAC distribution engine; watch conversion of open-source users to paid API/hosted usage.", "quote": "every partnership Boltz has established to date began as inbound interest from computational chemists and biologists", "locator": "What stood out to us", "quote_verified": true}, {"claim": "Boltz's team created several widely used models: CEO Gabriele Corso built DiffDock (molecular docking as a generative problem), CTO Jeremy Wohlwend led Boltz-1 for structure prediction, Saro Passaro built Boltz-2 for joint structure and affinity co-folding, and Hannes Stärk led BoltzGen for generative protein design.", "speaker": "Bessemer Venture Partners", "type": "anecdote", "entities": ["Gabriele Corso", "Jeremy Wohlwend", "Saro Passaro", "Hannes Stärk", "DiffDock", "Boltz-1", "Boltz-2", "BoltzGen"], "conviction": "high", "so_what": "Bessemer is underwriting the team that built the field's reference models, a talent-concentration bet typical of foundation-model investing.", "quote": null, "locator": "The team setting the standard", "quote_verified": false}]}, {"theme": "Product velocity and cost compression", "insights": [{"claim": "Boltz's small-molecule design model BoltzMol-1, launched in June, cuts the time to a validated hit from months to weeks and the cost from hundreds of thousands of dollars to as low as $10,000.", "speaker": "Bessemer Venture Partners", "type": "data_point", "entities": ["BoltzMol-1", "Boltz"], "conviction": "high", "so_what": "An order-of-magnitude drop in hit-finding cost compresses preclinical budgets and threatens wet-lab-heavy hit-discovery CROs.", "quote": "cuts the time to a validated hit from months to weeks and cost from hundreds of thousands of dollars to as low as $10,000", "locator": "Since launching in January", "quote_verified": true}, {"claim": "Boltz's protein // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
