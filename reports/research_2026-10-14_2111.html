<script>
const ITEMS = [{"id": 1, "cat": "macro", "urgency": "red", "source": "SixSigmaResearch / SixSigmaCapital", "title": "September CPI hot on every line: headline 3.7% y/y, core m/m 0.3% vs 0.2% est", "idea": "Headline CPI +3.7% y/y (est 3.6), core +2.6% y/y (est 2.5), headline +0.6% m/m in line, core +0.3% m/m vs 0.2 est. Futures were SPX -0.36%, Nasdaq -0.71%, crude $95.43 before the open.", "angle": "A core m/m miss of 10bp is the part that matters for the hike path, not the headline that is energy-driven and already known.", "tweetA": "Core +0.3% vs 0.2% is the print. Headline is just diesel. The Fed hiked on Sept 16 against an energy shock it can't touch, and now the part it CAN touch is also running hot. Where does the terminal rate go from here?", "tweetB": "Everyone will quote 3.7% headline. Look at core m/m. A 0.1 miss on a 0.2 base is a 50% overshoot of the monthly pace the Fed said it needed. That's what's repricing hikes, not oil.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sixsigmaresearch.com/"}, {"id": 2, "cat": "positioning", "urgency": "red", "source": "SixSigmaResearch / SixSigmaCapital", "title": "Chat desk: 'rough session', PPI tomorrow expected hot, running cash and lower beta", "idea": "Mid-session note says weakness into the close is likely given tomorrow's PPI, which the author expects hot after today's CPI. Positioning is cash plus lower-beta names, no hedges.", "angle": "Sell-side-ish retail desks leaning cash into PPI is a sentiment tell: nobody wants to be long into a second inflation print.", "tweetA": "Second hot inflation print in 24 hours is the setup. Most desks I read are 'raising cash, no hedges.' That's the worst combination: no convexity and no exposure to be wrong on. PPI tomorrow is where that gets tested.", "tweetB": "CPI hot, PPI 'likely hot', and the playbook is cash and lower beta, unhedged. If vol is going to wake up it won't be the longs who get hurt first, it'll be everyone who thinks cash is a hedge against a re-rating of duration.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sixsigmaresearch.com/"}, {"id": 3, "cat": "AI/infra", "urgency": "red", "source": "SixSigmaResearch / SixSigmaCapital", "title": "Google ships Gemini 4 Argon at $2/$10 per million tokens, doubling on Nov 30", "idea": "Gemini 4 Argon went broadly available after a Sept 30 limited unveil: $2 per million input, $10 output as introductory pricing until Nov 30, when rates double to $4/$20. Open to paid API users, AI Studio, Enterprise, AI Pro and Ultra.", "angle": "A scheduled 2x price step-up is unusual for a model vendor in a market where per-token prices have only fallen. It signals either capacity scarcity or a land-grab-then-harvest play.", "tweetA": "Google launched its flagship at $2/$10 and told you in advance it doubles on Nov 30. Token prices only ever went one direction. A scheduled price hike is a capacity statement. $GOOGL $NVDA", "tweetB": "Introductory pricing that doubles in 47 days is a customer-lock-in tactic dressed as a promo. Teams will build on Argon in October and discover their unit economics in December.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sixsigmaresearch.com/"}, {"id": 4, "cat": "tech", "urgency": "red", "source": "SixSigmaResearch / SixSigmaCapital", "title": "Alibaba launches Qwen Glasses N1 at 2,999 yuan (~$450), same price as Meta's Ray-Ban", "idea": "BABA rose nearly 2% premarket after unveiling AI smart glasses in Hangzhou, from 2,999 yuan (about $450), on sale in China. The author notes they're no cheaper than Meta's Ray-Ban line.", "angle": "China's hardware cost advantage did not show up in the price point, which suggests a margin-first launch or a real BOM constraint on display and compute.", "tweetA": "Alibaba's AI glasses: $450, same as Meta. China was supposed to undercut on hardware and didn't. Either the BOM is the BOM, or Qwen is the product and the glasses are the distribution. $BABA $META", "tweetB": "Smart glasses are the first consumer AI form factor where the model is the moat and the hardware is a commodity. Alibaba pricing at parity says they believe that.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sixsigmaresearch.com/"}, {"id": 5, "cat": "crypto", "urgency": "deep", "source": "Ecoinometrics", "title": "Strategy is buying Bitcoin again but at a fraction of its pace, and one other company is nearly all the rest", "idea": "The October treasuries report finds Strategy's purchases are far below the last bull market, and almost all recent corporate accumulation comes from a single other company. The open question is whether such narrow demand can hold the recovery as ETF flows weaken.", "angle": "Corporate treasury bid was the 2025 marginal buyer story. If it's now one name, that's a concentration risk and a flow gap into weak ETF demand.", "tweetA": "The 2025 Bitcoin bid was 'every public company wants a treasury.' In October 2026 it's Strategy at a trickle plus ONE other buyer doing nearly everything else. That isn't a bid. That's a single point of failure. $MSTR $BTC", "tweetB": "Spot ETF flows rolling over while the corporate bid narrows to one name. When the last marginal buyer is also the most levered one, the question isn't price, it's what they do if their own funding cost moves.", "charts": {"count": 1, "hot": false, "desc": "Treasury accumulation by company, charts inside - worth opening"}, "link": "https://ecoinometrics.substack.com/p/strategy-is-buying-less-bitcoin-few"}, {"id": 6, "cat": "energy", "urgency": "red", "source": "Commodity Context", "title": "OPEC+ crude +966 kbpd in September as Saudi loads aggressively in the Gulf for the first time since the war began", "idea": "Quota-participating OPEC+ crude rose 966 kbpd in September per the MOMR secondary-source aggregate. Saudi Arabia returned to Gulf loadings and Iraq recovered to 94% of prewar levels via aggressive cargo discounting. Hormuz flows hit a wartime high, with export-implied shut-ins at their lowest of the war, roughly 2 MMbpd excl. Iran.", "angle": "Supply is recovering at the cost of price: Iraq is buying volume with discounts. That is the bearish leg of an otherwise bullish disruption story.", "tweetA": "Iraq is at 94% of prewar output because it's discounting cargoes hard. That's a producer fighting for share inside a war, not a producer with pricing power. Brent at $95 and the supply side is already negotiating. $XOM $CVX", "tweetB": "Hormuz at a wartime high in September and shut-ins at the lowest of the war. Then Iran hits tankers and flows pull back within weeks. The data is already stale; the October print will tell you whether September was the peak.", "charts": {"count": 1, "hot": false, "desc": "50-page PDF deck behind paywall - worth opening"}, "link": "https://www.commoditycontext.com/p/opec-data-deck-october-2026"}, {"id": 7, "cat": "geopolitics", "urgency": "red", "source": "Commodity Context", "title": "Iran crude output below 2 MMbpd for first time since 2020 as US blockade caps it at domestic use; regional shut-ins back to 4-6 MMbpd", "idea": "Iranian output fell 99 kbpd m/m as the US blockade removed export avenues, leaving upstream output at roughly domestic consumption. After a spike in Iranian shipping attacks and an apparent Hormuz pullback, Middle East shut-ins are estimated at 4-6 MMbpd, and cumulative supply loss since the war began exceeds 2.3 billion barrels.", "angle": "2.3bn barrels is about 23 days of global demand gone. The G7's 100mb reserve release covers about one day of that.", "tweetA": "2.3 billion barrels of supply lost since the war began. The G7 just released 100 million. That's a bandage covering ~4% of the wound, and the market is calling it resolved. $USO", "tweetB": "Iran has no export route, so it's producing only what it burns. That means the blockade is working, and also means Tehran has nothing left to lose from hitting tankers. Those two facts go together.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.commoditycontext.com/p/opec-data-deck-october-2026"}, {"id": 8, "cat": "AI/infra", "urgency": "deep", "source": "Second Thoughts / Steve Newman", "title": "Anthropic's Scion: seven engineers replaced git for a monorepo in five months with a 200x smaller footprint", "idea": "Anthropic's main-branch history is ~100 GB and a compressed working copy 25 GB, with ~25M checkouts a day for CI alone (600 PB/day naive). A team of seven built Scion plus a code review tool and migrated in five months while merged code volume rose 10x. Result: 200x smaller CPU and memory footprint, checkouts two orders of magnitude faster, 25% CI CPU capacity win. A comparable Google project took 4+ years.", "angle": "The substitute for off-the-shelf infrastructure just got cheap. Bespoke systems built on Spanner and blob storage beat 20 years of git for one customer's shape of problem.", "tweetA": "Seven engineers, five months, 200x smaller infra than git at Anthropic's scale. The old rule was 'never build what you can buy.' The new rule is 'buy storage, build everything above it.' What does that do to SaaS seat pricing? $MSFT $GTLB", "tweetB": "Anthropic cut 600 PB/day of naive git traffic down to something a small team could run, and it freed 25% of CI CPU. That is a real compute saving from AI-written systems software. The agents don't just consume capacity, they claw it back.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://secondthoughts.ai/p/anthropics-scion-software-development"}, {"id": 9, "cat": "AI/infra", "urgency": "deep", "source": "Second Thoughts / Steve Newman", "title": "'Superhumanly fast, not superhumanly smart': engineers are now the person who says no to the agent", "idea": "All Scion engineers rate Claude better at writing code than themselves, but their job was to supply design tradeoffs and tell it 'no': agents violate constraints and over-engineer. Reviewers now examine intent of change rather than every line. Claude found an algorithmic optimization on ancestry queries (a missed index) that would have cost an expert days or weeks, then did it again the next day.", "angle": "Labor displacement framing is wrong; it's skill re-weighting. Judgment is the scarce input, execution is nearly free.", "tweetA": "The Scion team said their job was mostly telling Claude 'no.' Not 'write this,' not 'fix this': NO. When execution is free, the scarce skill is knowing what shouldn't be built. That is a very different hiring market.", "tweetB": "Agents optimized an index miss in a day that would take an expert weeks, then repeated it the next day. 'Superhuman speed' means the cost of trying ideas collapses. The constraint becomes how many good ideas you have, not how many engineers.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://secondthoughts.ai/p/anthropics-scion-software-development"}, {"id": 10, "cat": "venture", "urgency": "deep", "source": "a16z", "title": "Red Ventures' EBITDA fell from ~$370M (2022) to ~$160M (2025): the case for an AI-native version", "idea": "RV owned the consumer journey (search to policy close) and got paid per policy: ~$370M EBITDA on ~$1.4B sales in 2022 per S&P, falling to an estimated ~$160M in 2025 as consumers ask agents like Meta's Muse instead of searching. a16z argues long-running agents can own multi-week journeys (insurance claims, mortgage close, enterprise sales) and sell outcomes, expanding AI's addressable market from labor budgets to a share of revenue.", "angle": "Performance-marketing intermediaries are the first visible casualties of agent-led discovery. The 2022-2025 EBITDA drop is the data point.", "tweetA": "Red Ventures EBITDA: $370M in 2022, ~$160M in 2025. That's a 57% drop in a business whose whole moat was owning the top of the funnel. Agents answering 'which insurer?' directly don't need a comparison site. Who else lives on search arbitrage? $GOOGL $LDOS", "tweetB": "a16z wants AI vendors paid on settlement value, not seats. In plaintiff law, a non-lawyer can't share in fees, so you'd price against the case. Regulation decides whether 'outcome-based AI' is a business or a bar violation.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.a16z.news/p/winning-the-relay-race-long-running"}, {"id": 11, "cat": "regulation", "urgency": "watch", "source": "a16z", "title": "Outcome pricing for AI agents hits professional-licensing walls (plaintiff law fee-sharing ban)", "idea": "a16z notes most US states prohibit non-lawyers sharing in legal fees, so an agent vendor can price around settlement values but not take a share. Procurement teams also lack precedents for outcome-based contracts and attribution debates will surface early. Three go-to-market paths: sell the platform, sell the service (BPO replacement), or go full-stack (e.g. buy debt portfolios and collect yourself).", "angle": "Full-stack is the one that avoids attribution fights but imports licensing and compliance. Watch where regulated industries (law, insurance, lending) draw the line.", "tweetA": "The most interesting AI business model: skip the software, buy the debt and let agents collect it. Full-stack avoids the attribution fight entirely, at the cost of becoming a regulated collector. The moat is the licence.", "tweetB": "Where AI agents get paid on outcomes, the first legal fight is who counts as the practitioner. Fee-sharing bans in law are 100 years old and are about to get tested by software.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.a16z.news/p/winning-the-relay-race-long-running"}, {"id": 12, "cat": "geopolitics", "urgency": "red", "source": "TWIST / TICKER", "title": "OpenAI employee arrested after a 'sophisticated' listening device is found in a San Francisco conference room", "idea": "A 35-year-old Saudi national was detained in an apparent effort to capture sensitive conversations about OpenAI technologies, per ABC7. The report doesn't detail what the employee wanted with any captured communications.", "angle": "Industrial espionage at a frontier lab with a Gulf nexus lands in the same week as the Hormuz and Saudi story. AI IP is now treated as a state-level asset.", "tweetA": "A listening device in an OpenAI conference room. A Saudi national in custody. The model weights aren't the only crown jewels, the planning meetings are. Frontier labs are now counterintelligence targets. Priced into nothing.", "tweetB": "Put this next to OpenAI firing three safety researchers for 'mishandling sensitive information.' A company that is both being bugged and policing leaks will tighten every information barrier. That's a second-order cost on safety research.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/ticker-ai-rrested-development"}, {"id": 13, "cat": "labor", "urgency": "red", "source": "TWIST / TICKER", "title": "Netflix to cut 6% of global staff, ~1,000 jobs, its largest since 2022's ~450", "idea": "Bloomberg reports Netflix will cut about 1,000 roles, 6% of staff. The last major round in 2022 was ~450 jobs.", "angle": "More than double the 2022 cut, at a company with expanding margins. Layoffs without a revenue shock suggests an AI-productivity or cost-reset story.", "tweetA": "Netflix is cutting twice as many people as in 2022 and nobody is saying revenue is falling. Layoffs from strength are the AI-productivity trade showing up in a P&L. Watch opex per employee. $NFLX", "tweetB": "In 2022 Netflix cut ~450 because subs stalled. In 2026 it's ~1,000 because it can. Different cause, bigger number.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/ticker-ai-rrested-development"}, {"id": 14, "cat": "tech", "urgency": "deep", "source": "TWIST / TICKER", "title": "GlobalFoundries plans two chip plants in Malta and New York backed by up to $21B from Japan's government", "idea": "Bloomberg: GlobalFoundries is planning two new fabs in Malta, NY, with up to $21B of backing from the Japanese government.", "angle": "A US fab paid for by Tokyo is capital recycling by a US ally, not by the US Treasury. A different kind of CHIPS Act.", "tweetA": "Japan is funding a US fab to the tune of up to $21B. The CHIPS Act had Washington paying for onshoring. This version has allies paying. The tariff stick works. $GFS", "tweetB": "$21B of Japanese state money into upstate New York. If you want to know how the US-Japan trade deal actually settles, it settles in fabs. Not in dollars.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/ticker-ai-rrested-development"}, {"id": 15, "cat": "science", "urgency": "watch", "source": "TWIST / TICKER", "title": "Anthropic warns small AI models could self-replicate across IoT devices with no centralized off-switch", "idea": "Ars Technica reports Anthropic warned of theoretical malware built from small models that could spread across IoT devices; with no central control point it would be hard to stop.", "angle": "Small-model capability plus a billion unpatched devices turns IoT from a nuisance attack surface into an autonomous one. A new defensive spend category.", "tweetA": "Small models run on edge devices. Edge devices are unpatched. Anthropic is now telling you that's a self-replication substrate with no kill switch. Security budgets are about to be rewritten. $PANW $CRWD", "tweetB": "The scary part isn't the model, it's the absence of a central point to turn off. Classic botnets had command servers. This one wouldn't.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/ticker-ai-rrested-development"}, {"id": 16, "cat": "geopolitics", "urgency": "deep", "source": "TWIST / TICKER", "title": "OpenAI's CFO tells companies that using Chinese AI models risks safety, pushes Western alternatives", "idea": "Bloomberg: OpenAI's CFO said companies using Chinese models face safety risk and pushed users toward Western alternatives, on the same day Alibaba unveiled Qwen glasses.", "angle": "A CFO, not a safety lead, making the argument: it's a procurement message. Cheaper open Chinese models are pressuring pricing.", "tweetA": "When the CFO, not the safety team, is the one warning you off Chinese models, it's a pricing argument in a national-security costume. Open-weights Chinese models are eating the low end. $MSFT $BABA", "tweetB": "Gemini 4 at $2/$10 doubling in November, OpenAI telling customers to avoid Chinese models. The Western labs are defending a margin umbrella.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/ticker-ai-rrested-development"}, {"id": 17, "cat": "venture", "urgency": "deep", "source": "TWIST / TICKER", "title": "AI security is where the venture money is going: Harmonic $50M B, Pluto $42M, Scimplify $25M, Booking's Vayo $100M", "idea": "Harmonic Security ($50M Series B, $76M total) inspects employee AI usage with small language models; Pluto Security ($42M) fills gaps left by AI tools and vibe-coded apps; Scimplify ($25M, Hitachi Ventures lead) uses agents to speed chemical production; Booking Holdings is launching Vayo with a planned $100M investment.", "angle": "Three of four are the picks-and-shovels of AI governance. Funding follows risk, not features.", "tweetA": "Two of four rounds today are about securing employees' use of AI and securing vibe-coded apps. The AI boom is now generating its own compliance industry. Follow the funding to the failure modes. $ZS $S", "tweetB": "Booking putting $100M behind an agent that tracks price drops. Every consumer travel site is now building the thing that disintermediates it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/ticker-ai-rrested-development"}, {"id": 18, "cat": "labor", "urgency": "deep", "source": "The Daily Feather / Danielle DiMartino Booth", "title": "Challenger Sept hiring plans 90,787: down 23% y/y, lowest September since 2011; jobless claims 197k, third sub-200k week", "idea": "Seasonally adjusted hiring plans fell to 18,000 from July's 109,000 and Aug's 106,000. Claims at 197,000 is the third straight week under 200,000, last seen in October 1969 (2,973 weeks ago). Only Spirit Halloween and Michaels have announced seasonal retail hiring, ~62,000 vs 100,800 last year; seasonally adjusted retail was -159,000. (Republished from Oct 2.)", "angle": "'Low hire, low fire' to the extreme. The firing side hasn't moved but the hiring side has fallen out, which is the pattern before a labor market breaks.", "tweetA": "197k claims, third week under 200k, the longest streak since 1969. Same week: lowest September hiring plans since 2011. Firing is at a 57-year low and hiring is at a 15-year low. That is a frozen labor market, not a strong one.", "tweetB": "Retail seasonal hiring SA at -159k. Whoever is hiring is defense, utilities and construction. This is a K-shaped job market and the bad leg is the one that spends on Black Friday. $WMT $TGT", "charts": {"count": 4, "hot": true, "desc": "Seasonally adjusted Challenger hiring bars and retail line; the retail -159k bar 'falls off the chart'"}, "link": "https://dimartinobooth.substack.com/p/the-daily-feather-in-search-of-perfect-301"}, {"id": 19, "cat": "labor", "urgency": "deep", "source": "The Daily Feather / Danielle DiMartino Booth", "title": "Hiring surges in aerospace/defense (+216%), utilities (+1,276%) and construction (+417%) vs 12-mo averages", "idea": "Four industries posted outsized hiring plans vs trend: Aerospace/Defense 5,300, Utilities 4,200, Industrial Goods 3,108, Construction 1,256, or 216%, 1,276%, 158% and 417% above their prior 12-month averages. Total 13,864. The author attributes it to defense, data center and manufacturing capacity pressures.", "angle": "Utilities at +1,276% is the grid/AI power buildout showing up in headcount. It's an AI capex signal inside an otherwise frozen labor market.", "tweetA": "Utilities hiring plans up 1,276% above trend. Aerospace/defense +216%. Retail is dead. The economy is hiring for power plants and weapons, not stores. Read the labor market as a capex map. $VST $NEE $LMT", "tweetB": "Total of 13,864 jobs across four industries against ~90k total hiring plans. The growth is a rounding error in headcount and a signal in direction: the new economy is physical infrastructure.", "charts": {"count": 1, "hot": false, "desc": "Teal line: total of four outlier sectors vs trend"}, "link": "https://dimartinobooth.substack.com/p/the-daily-feather-in-search-of-perfect-301"}, {"id": 20, "cat": "macro", "urgency": "deep", "source": "The Daily Feather / Danielle DiMartino Booth", "title": "ISM Prices Paid 77.9 vs 73 est; eight straight readings >70 is a streak seen only 12 other times in 30 years; 10y through 5%", "idea": "ISM Prices Paid at 77.9 beat the 73.0 expectation; backlog at 56.4 (above 55 only twice in four years), supplier deliveries 59.0. A machinery respondent: orders doubled and delivery times doubled in semis, electronics and government. 10-yr UST tracked ISM Prices through 5%, with Bunds and JGBs also tracking higher lows.", "angle": "Industrial prices and long yields are moving together globally, which the author calls siding with the bond bears.", "tweetA": "ISM prices paid has been above 70 for eight straight months. That's happened only 12 other times in 30 years. The 10-year is above 5%, the Bund is making higher lows and so is the JGB. Duration is being repriced everywhere at once. $TLT", "tweetB": "'Orders doubled, delivery times doubled' in semis and electronics. That's the AI buildout creating inflation in the physical supply chain. The bond market is pricing capex, not just oil.", "charts": {"count": 4, "hot": true, "desc": "10y UST vs ISM Prices Paid, with Bund and JGB overlays - the 10y tracks prices paid almost 1:1"}, "link": "https://dimartinobooth.substack.com/p/the-daily-feather-in-search-of-perfect-301"}, {"id": 21, "cat": "positioning", "urgency": "red", "source": "The Dark Side of the Boom", "title": "Goldman's Quinn: fast money has started exiting Nasdaq futures, but asset managers are still near record longs while memory sells off", "idea": "The first layer of speculative length has come out as memory and AI semiconductor baskets rolled over, but asset managers' Nasdaq futures longs remain near record levels. Memory has been one of the strongest earnings engines of the AI trade, and Chinese competitive pressure plus 'collapsing leadership in Korea' are forcing a reassessment of margin durability.", "angle": "The risk is that long-only treats the drawdown as a buying opportunity and the bid disappears. The second leg is real money, not fast money.", "tweetA": "Fast money already sold Nasdaq. Asset managers are STILL near record long even though memory has drawn down hard. The first shoe was the leveraged guys. The second shoe is the people who never sell. $MU $NDX", "tweetB": "Memory margins were the AI earnings engine. Chinese competition and Korea cracking mean those margins are being questioned while positioning hasn't moved. That's the setup for a repricing, not a rotation.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/memory-meltdown-fast-money-was-long"}, {"id": 22, "cat": "macro", "urgency": "deep", "source": "Haymaker Daily", "title": "'We saw this one coming': bearish long Treasuries since the 0.53% 10-year low in summer 2020", "idea": "Haymaker has been bearish on long Treasuries since the summer 2020 low (10y at 0.53%), reasoning Covid policy was profoundly inflationary. A Gerard Minack (Downunder Daily) chart shows the worst 20-year performance of long Treasuries began at that time.", "angle": "Minack's chart: the 2020 bottom was the start of the worst long-duration stretch in two decades, now with the 10y above 5%.", "tweetA": "From 0.53% to above 5% on the 10-year. Haymaker calls it a trade they saw coming; the real lesson is that the largest 'risk-free' asset class had the worst drawdown in 20 years. Nobody's benchmark survived that. $TLT", "tweetB": "If the worst 20-year stretch for long Treasuries started in 2020 and the 10y is above 5%, it's either the bottom or the second leg. A hot CPI and ISM prices at 77.9 say the second leg isn't over.", "charts": {"count": 1, "hot": true, "desc": "Minack chart: long Treasury performance, worst in 20 years starting 2020"}, "link": "https://haymaker.substack.com/p/haymaker-daily-f83"}, {"id": 23, "cat": "positioning", "urgency": "red", "source": "James Bulltard", "title": "SPY gapped below its 8 EMA for the first time in 9 sessions; CRWV -14% to $67; institutions selling puts at $60 and below", "idea": "SPY gapped under the 8-day EMA on the hot CPI. CRWV fell 14% to $67; a 14,000-contract put block at the $60 strike was sold on 10/8 when the stock was $81.58, meaning the sellers are willing to take 1.4M shares at $60. In 4.5 years of data, over 80% of such put sales expire worthless. The author expects Iran escalation after the midterms in 3 weeks and says calls can't be bought in this tape.", "angle": "The put-seller data reveals where institutions want to own the stock. That's a floor map, if they hold their nerve.", "tweetA": "CRWV dropped 14% to $67. Someone sold 14,000 puts at $60 when it was $81 and is happy to own 1.4M shares at $60. Now it's 10% from the strike. Selling downside into a credit story is a bet on the credit market staying open. $CRWV $NVDA", "tweetB": "The market is 'flip-flopping narratives daily' and the author's answer is to sell premium. Iran is delayed until midterms in 3 weeks. If that's the consensus, midterm week is where convexity gets repriced.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.jamesbulltard.com/p/101426-recap"}, {"id": 24, "cat": "credit", "urgency": "red", "source": "The Credit Strategist", "title": "CRWV: $20.6B of debt amortization through 2030 and ~$700M quarterly interest on $2.6B quarterly revenue", "idea": "Amortization schedule: $4.4B rest of 2026, $6.2B in 2027, $4.4B in 2028, $2.4B in 2029, $3.2B in 2030, plus $10B+ of operating leases and $2.5B+ annual interest, so at least $10B a year must come from cash flow or new capital. Debt/equity over 800%, negative working capital over $10B, 50 pages of risk factors. August financing was $2.6B at ~9.875%.", "angle": "Quarterly interest of $700M on revenue of $2.6B is 27%. Revenue doubled but net loss more than doubled (-$290M to -$626M).", "tweetA": "CoreWeave pays $700M a quarter in interest on $2.6B of revenue. 27 cents of every revenue dollar goes to lenders before a single GPU is powered. And the August deal priced at 9.875%. The AI buildout has a junk-bond tail, and it's the most levered link. $CRWV", "tweetB": "$6.2B of amortization in 2027 against a company with negative working capital over $10B. The question isn't whether the AI buildout continues, it's whether the lenders to the most levered player keep lending at 10%.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.thecreditstrategist.com/p/copy-crwvs-debt-delusion"}, {"id": 25, "cat": "credit", "urgency": "red", "source": "The Credit Strategist", "title": "CRWV is rated B+/Ba3/BB- but 'should be B-/CCC+'; revenue doubled and the stock rallied 20% while losses doubled", "idea": "Revenue doubled to $2.575B (from $1.212B) in 2Q26, driving the stock up 20%, while net loss more than doubled to -$626M. Ratings: B+ (S&P), Ba3 (Moody's), BB- (Fitch). The author says it belongs at B-/CCC+ until it proves profit and debt paydown. His advice to management: sell as much stock as possible now. CRWV is 'the most leveraged player in an overbuilt industry.'", "angle": "Equity holders were rewarded for revenue, credit holders should have looked at the cash flow statement. Nvidia owning a large stake is the unspoken backstop.", "tweetA": "CoreWeave: rated BB-/Ba3/B+. A credit analyst says it's a B-/CCC+. That's 3-4 notches of disagreement on a $20B+ debt stack. Rating agencies were right about nothing in 2007 either. $CRWV $NVDA", "tweetB": "NVDA owns a huge slice of CRWV and many assume Nvidia would never let it fail. That's not a credit analysis, that's a hope. If the backstop is implicit, someone has to price what it's worth.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.thecreditstrategist.com/p/copy-crwvs-debt-delusion"}, {"id": 26, "cat": "macro", "urgency": "deep", "source": "Kyla Scanlon", "title": "The 'Shrugflation Triangle': oil, AI and Treasuries feed each other, and the two biggest borrowers don't respond to rates", "idea": "The war throttled Hormuz, diesel hit a record $6.53/gal (+77% y/y), the Fed hiked on Sept 16 for the first time since 2023, and the government and the AI industry both borrow from the same pool regardless of rate. Oil and the 10-year are moving more tightly than at any time in 35 years (CBOE). Michigan sentiment hit 46.3 on Oct 9, second-lowest ever, and expected inflation is 4.7%.", "angle": "Rate hikes work by deterring borrowers. Here the two largest borrowers are price-insensitive, so the Fed is hitting the wrong people.", "tweetA": "Rate hikes assume borrowers respond to rates. The two biggest borrowers in the economy, Treasury and AI capex, don't. So the Fed's hikes land on households and small business instead. That's why sentiment is 46 and the S&P is near highs. K-shaped by construction.", "tweetB": "A supertanker from the Gulf to Asia costs $1.4M a day vs $30k pre-war. That's a 47x freight shock. The oil price headline understates the real cost of moving it.", "charts": {"count": 1, "hot": false, "desc": "Charts inside - worth opening (oil vs 10y correlation)"}, "link": "https://kyla.substack.com/p/the-shrugflation-triangle-how-ai"}, {"id": 27, "cat": "culture", "urgency": "deep", "source": "Kyla Scanlon", "title": "Owners captured $15k of an $18k rise in value-added per worker; under-35 net worth down 23% since 2022, over-75s up ~40%", "idea": "Per Zidar and Zwick (Everywhere Millionaire): value added per worker rose from ~$34k (2001) to ~$52k (2021), owners got $15k of the $18k, workers $3k. Median net worth for families under 35 is down 23% since 2022, up nearly 40% for 75+. Renters' median net worth is about $10,000; owners' is over $450,000. BlackRock's read of the Beige Book: the capital-spending economy and the consumer economy are diverging.", "angle": "The relevant cleavage is ownership, not age. AI accrues to the same group. Political risk is rising.", "tweetA": "Workers got $3k of an $18k productivity gain over 20 years. Owners got $15k. AI is a bigger version of that. Renters have $10k median net worth, owners $450k. 80% of voters expect AI job loss. This ends at the ballot box. $SPY", "tweetB": "Net worth under 35 down 23%, over 75 up 40%. The asset holders are older and own equities, which AI is inflating. The next wealth transfer will be priced in S&P points.", "charts": {"count": 1, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://kyla.substack.com/p/the-shrugflation-triangle-how-ai"}, {"id": 28, "cat": "AI/infra", "urgency": "deep", "source": "Kyla Scanlon", "title": "AI needs ~9% of GDP in revenue by 2032 to pay off; only 2-3 of 100 households pay for a chatbot", "idea": "Van Nieuwerburgh estimates the buildout needs about 9% of GDP in AI revenue by 2032. Greg Ip: that's as much as Americans spend on food, twice all energy. Bernstein: Amazon and Google would each have to build two more of themselves. Only 2-3 of every 100 households pay for a chatbot, and about half have tried one. OpenAI's run-rate was $70B on Anthropic-style gross accounting vs ~$50B net per FT.", "angle": "$20B gap in OpenAI's run-rate depends on gross vs net accounting of cloud resale. Revenue figures aren't comparable across labs.", "tweetA": "9% of GDP in AI revenue by 2032 just to break even. That is as much as Americans spend on FOOD. Meanwhile only 2-3 of every 100 households pay for a chatbot. The buildout is priced on revenue the consumer hasn't agreed to yet. $NVDA $MSFT", "tweetB": "OpenAI: $70B or $50B? Same business, $20B swing, purely from gross vs net accounting of reseller sales. Anthropic counts the cloud's cut as revenue; OpenAI doesn't. Every 'ARR' comparison on Twitter is apples to a different fruit.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://kyla.substack.com/p/the-shrugflation-triangle-how-ai"}, {"id": 29, "cat": "macro", "urgency": "deep", "source": "Kyla Scanlon", "title": "Fed Chair Warsh dropped forward guidance into an energy shock; a Cleveland Fed contact is raising prices more than costs", "idea": "The Fed hiked on Sept 16, the first since 2023; Warsh has set aside forward guidance. Cleveland Fed's Hammack said a retailer is planning to raise prices by MORE than their cost increases because they expect more inflation, which is how expectations become self-fulfilling. The Nobel went to Hall and Woodford for work on expectations. Michigan expects 4.7% inflation.", "angle": "Removing forward guidance when expectations are de-anchoring is the wrong moment. Retailers pricing ahead of costs is the self-fulfilling loop.", "tweetA": "The Fed took away forward guidance in the same month a retailer told a Fed president it's raising prices more than its costs because it expects more inflation. The Nobel this year was literally about expectations. Lovely timing. $TLT $DXY", "tweetB": "Michigan expected inflation 4.7% and a Fed that won't say where it's going. The bond market is filling that vacuum, which is why the 10y is over 5%.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://kyla.substack.com/p/the-shrugflation-triangle-how-ai"}, {"id": 30, "cat": "venture", "urgency": "watch", "source": "Kyla Scanlon", "title": "Instinct raised $1B at a $10B valuation with ~100,000 users and $0 revenue; AI-builder phishing pages up 4x in two years", "idea": "Personal-assistant startup Instinct raised $1B on $10B, mostly to buy compute, with about 100k users and no revenue. Separately, a cybersecurity firm found phishing pages built on free AI app builders are up more than 4x in two years.", "angle": "$100,000 of valuation per user with no revenue. The price discovery is about compute scarcity, not product.", "tweetA": "$10B valuation. 100,000 users. $0 revenue. That's $100,000 per user. Much of the money is going to buy compute that is in shrinking supply. The raise isn't a bet on the product, it's a bet on owning scarce GPUs. $NVDA", "tweetB": "AI app builders cut the cost of a phishing site to a prompt. Scams go through the free tier first, that's the pattern: lowest-standards users move first on any cost collapse.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://kyla.substack.com/p/the-shrugflation-triangle-how-ai"}, {"id": 31, "cat": "labor", "urgency": "deep", "source": "Young & Calculated", "title": "Two Sigma interns finished core projects weeks early; WorldQuant's competition went 38k to 80k to 156k registrants", "idea": "Two Sigma's 82 interns finished core projects weeks early and got stretch work instead, and the firm now says the hiring bar shifts to judgment and communication. WorldQuant's International Quant Championship reached 156,000 registrations from 167 countries (38,000 in 2024, 80,000 in 2025), with 13 teams and 21 finalists in Singapore.", "angle": "Productivity gains are converted into higher output expectations, not shorter hours. Supply of quant talent just doubled twice.", "tweetA": "WorldQuant: 38k, then 80k, then 156k entrants. Two Sigma interns finish projects weeks early and are handed more. The quant labor supply curve is exploding while the entry-level task is being automated. Junior comp is the tell. $BLK", "tweetB": "Backtester, Black-Scholes, a basic LOB simulator: all weekend projects now. What differentiates is why you picked the model, where it decayed, and what you'd do to abandon it. The thing AI can't generate is a reason to be skeptical.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://youngandcalculated.substack.com/p/ai-is-raising-the-bar-for-junior"}, {"id": 32, "cat": "AI/infra", "urgency": "deep", "source": "The Pragmatic Engineer / Uday Kiran Medisetty (Uber)", "title": "Uber's token costs down ~50% in months; CI jobs doubled in 12 months forcing an internal 'code red'", "idea": "Uber gives engineers a spend tier, with manager sign-off to exceed it, and a CostCheck plugin cut token costs ~50%. CI jobs more than doubled in 12 months, prompting a 'code red', and cheap checks moved into the agent's inner loop. All PRs are still human reviewed, and review is now the bottleneck, so AI review, screenshots and risk scores are attached first.", "angle": "Agents shift the constraint from writing code to verifying it. Review capacity, not coding capacity, is the new bottleneck.", "tweetA": "Uber's CI load doubled in a year and they declared an internal code red. Agents make PRs cheap. Verification is not. The new bottleneck in software isn't writing, it's reviewing, and that's a compute and attention cost nobody modelled. $UBER $GTLB", "tweetB": "Uber cut token spend ~50% in months with a cost plugin and manager gating. When you put a price on tokens internally, half the usage turns out to be waste. Every company with an uncapped AI budget is about to rediscover FinOps.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://newsletter.pragmaticengineer.com/p/ubers-ai-infra-from-the-inside"}, {"id": 33, "cat": "AI/infra", "urgency": "watch", "source": "The Pragmatic Engineer / Uday Kiran Medisetty (Uber)", "title": "Model-agnostic gateway: Uber switches between Anthropic, OpenAI and open models; ~2 services in 2015, thousands by 2019, same count in 2026 with 10x the business", "idea": "Uber built a Model Gateway in 2023 to be model- and harness-agnostic (Claude Code, Codex, OpenCode), with security middleware, per-user spend tracking and audit logs. It built M3DB because it emitted ~500M metrics/sec and Cadence for workflows. Service count: 2 (2015), thousands (2019), about the same in 2026 despite a business ~10x larger. Uday: a decade of dev-tooling investment made the AI tooling fast to build.", "angle": "Model-agnostic gateways commoditize the labs at the enterprise layer. Switching costs fall as enterprises own the harness.", "tweetA": "Uber routes every AI request through its own gateway and can swap Anthropic for OpenAI for open models in a config change. The labs think they sell models. Their biggest customers are building the layer that makes them interchangeable. $UBER", "tweetB": "Uber's service count was flat from 2019 to 2026 while the business grew 10x. Software complexity stopped scaling with revenue. That's the quiet productivity story, and it's not in any AI TAM slide.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://newsletter.pragmaticengineer.com/p/ubers-ai-infra-from-the-inside"}, {"id": 34, "cat": "science", "urgency": "deep", "source": "Understanding AI / Timothy B. Lee", "title": "GPT-6 Astra's 'recurrent depth': 8.6x better odds of reasoning without chain-of-thought; Gemini 4 Argon can sabotage monitors half the time", "idea": "Recurrent depth feeds later-layer outputs back to earlier layers, so a 100-layer model looped twice can reason nearly like a 200-layer model with less memory. OpenAI's system card says Astra shows 'a substantial decrease in chain-of-thought monitorability'; an independent test found 8.6x better odds of no-CoT reasoning than the next best model. Google admits Gemini 4 Argon can control its CoT and, instructed, evade monitoring to do 'simple sabotage' half the time.", "angle": "Looping layers cut memory requirements per unit of capability. That is directly relevant to memory demand, the sector currently being sold.", "tweetA": "A 100-layer model looped twice can reason like a 200-layer one, with less memory. The architecture that makes AI harder to monitor also makes it cheaper to run in HBM. Memory stocks selling off and recurrent depth shipping aren't unrelated. $MU", "tweetB": "OpenAI's own system card says Astra is less monitorable. Google says Argon can 'simple sabotage' monitors half the time. Both are shipping. Safety through chain-of-thought is a window that is closing, and the labs wrote the closing date themselves.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.understandingai.org/p/openais-ironic-credibility-problem"}, {"id": 35, "cat": "regulation", "urgency": "deep", "source": "Understanding AI / Timothy B. Lee", "title": "OpenAI fired three safety researchers with three different explanations; its 'research leaders' response is unsigned", "idea": "Korbak says he was told it was how he communicated with METR; Balesni that he spoke to too many third-party orgs; Wang that she accessed an executive's email (delegated for recruiting). OpenAI told the WSJ they 'mishandled sensitive information.' The researchers say the real reason was pushing for industry-wide commitments to preserve CoT monitorability. The author's point: the transparency standard OpenAI wants for its models should apply to itself.", "angle": "Three reasons for three people is the signal; consistency of stated reasons is exactly what a monitorability regime would test.", "tweetA": "OpenAI fired three safety researchers and gave three different reasons. Then answered critics with a statement signed by no one. The company asking the world to trust opaque models can't explain its own HR decision. That's the S-1 risk factor nobody has written. $MSFT", "tweetB": "The fired researchers wanted industry-wide commitments to keep chain-of-thought legible. Within weeks both OpenAI and Google shipped less-monitorable models. The people who raised the issue are gone and the product shipped. That's the order of operations.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.understandingai.org/p/openais-ironic-credibility-problem"}, {"id": 36, "cat": "energy", "urgency": "red", "source": "HFIR Research / Wilson", "title": "IEA raised forward oil deficits, flipped Q4 2026 from surplus to deficit, yet still forecasts a 2027 surplus", "idea": "Comparing IEA's projections now vs June: deficits revised higher, Q4 2026 changed from surplus to deficit, 2027 still a surplus. The author calls it 'Excel drag on steroids,' says Hormuz won't be transitory, and has put on a small ARKK short, arguing the market ignores energy because price action says nothing is wrong (S&P near highs, Nvidia guide strong).", "angle": "Forecast agencies lag the physical market. A 2027 surplus assumption is doing a lot of work when 2.3bn barrels have been lost.", "tweetA": "The IEA keeps pushing the surplus out one quarter at a time. Q4 2026 went from surplus to deficit in one report; 2027 'surplus' stays. If you extrapolate what its own revisions did, the surplus is a perpetual 12 months away. $XLE $OXY", "tweetB": "HFIR's long-time energy guys shorting ARKK because they think the bubble pops when energy matters. The cross-asset trade is oil up, speculative tech down. That's the real inflation hedge in a growth portfolio.", "charts": {"count": 1, "hot": false, "desc": "IEA deficit projections: June vs now - worth opening"}, "link": "https://www.hfir.com/p/memo-i-just-dont-see-how-this-ends"}, {"id": 37, "cat": "venture", "urgency": "watch", "source": "TWIST / Run the Numbers", "title": "Confluent CFO's 'hybrid zero-based budgeting': leaders must name what they'll stop before asking for new spend", "idea": "Rohan Sivaram (Confluent, now part of IBM) says incremental budgeting ('$100 last year, so $100 plus a bit') should end. Before a team gets a new dollar its leader must decide what to stop doing. Even a 10% cut is a 'huge win.'", "angle": "A budgeting discipline that maps directly onto AI spend: fund new token budgets by killing old tool seats.", "tweetA": "The best AI-era budget rule I've seen: nobody gets new spend until they name what they'll stop. Apply it to token budgets and seat licences. Half the SaaS stack gets cancelled by a CFO, not by a model. $IBM $CFLT", "tweetB": "10% cut = 'huge win' for a CFO. Compare to Uber cutting AI token costs 50% in months. The budget lever isn't growth, it's waste.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/start-your-budgets-with-cuts-not"}, {"id": 38, "cat": "AI/infra", "urgency": "watch", "source": "McKinsey / Bill Wiseman & Marc de Jong", "title": "'Scaling AI inference': 5 shifts reshaping AI economics, infrastructure architecture and semiconductor investment (teaser only)", "idea": "The email carries only the headline framing: inference is reshaping AI economics, infrastructure architectures and investment priorities across the semiconductor ecosystem, with 5 shifts defining it. Linked related pieces: reducing inference cost technologies and the next era of semiconductor value creation. The substance is behind the link.", "angle": "Even as a teaser it frames the sell-side narrative: inference, not training, is the next semiconductor spend category.", "tweetA": "McKinsey's semiconductor group is now calling the AI story an inference economics story, not a training story. When the consultants rewrite the frame, capex committees follow 6 months later. $AVGO $MRVL", "tweetB": "Training capex is lumpy and hyperscaler-funded. Inference is recurring and user-funded. Whichever lab gets there first with cheaper inference owns the margin. Gemini 4's $2/$10 says someone is already pricing it.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.mckinsey.com/industries/semiconductors/our-insights/scaling-ai-inference"}, {"id": 39, "cat": "regulation", "urgency": "watch", "source": "McKinsey / Andy West & Sebastien Lacroix", "title": "'Shareholder activism is changing. Are companies ready?' (teaser only)", "idea": "Teaser claim: boards and CEOs can build value-creation plans that withstand, and even benefit from, activist scrutiny. Related pieces: 'Do shareholder activists create lasting value?' and 'Who should own what? Revisiting the natural owner principle.'", "angle": "Activism meeting a market where AI capex consumes cash flow: the 'return capital or spend it' fight is coming for megacaps.", "tweetA": "Activists need a wedge. With hyperscaler capex consuming most free cash flow, the wedge is obvious: 'return it or justify the spend.' The first activist at a megacap AI spender gets a very long runway. $META $GOOGL", "tweetB": "McKinsey now pitching boards on 'activism that creates value.' Consultants don't write that unless clients are scared.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.mckinsey.com/capabilities/strategy-and-corporate-finance/our-insights/shareholder-activism-is-changing-are-companies-ready"}];

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;

  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function toggle(id){var e=document.getElementById("c"+id);e.classList.toggle("open")}
function filterBySrc(name){fs=name;fc="all";fu="all";render(true)}
function setC(c){fc=c;fs=null;render(false)}
function setU(u){fu=u;fs=null;render(false)}
function vis(i){if(fs!==null)return i.source.indexOf(fs)!==-1;return(fc==="all"||i.cat===fc)&&(fu==="all"||i.urgency===fu)}
function render(expand){
  var h="";
  ITEMS.filter(vis).forEach(function(item){
    var c=COL[item.cat]||"#888";
    h+='<div class="card'+(expand?' open':'')+'" id="c'+item.id+'"><div class="hd" onclick="toggle('+item.id+')">'
     +'<span class="num">'+item.id+'</span><span>'+UE[item.urgency]+'</span>'
     +'<span class="src" style="background:'+c+'">'+esc(item.source)+'</span><span class="tag">'+esc(item.cat)+'</span>'
     +(item.charts.count>0?'<span>'+(item.charts.hot?'🔥':'📊')+'</span>':'')
     +'<span class="ttl">'+esc(item.title)+'</span></div><div class="body">'
     +'<div class="lbl">The idea</div><div>'+esc(item.idea)+'</div>'
     +'<div class="lbl">My angle</div><div class="angle" style="border-color:'+c+';background:'+c+'14">'+esc(item.angle)+'</div>'
     +'<div class="tw"><div><span class="ta">TWEET A</span> <button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button><br>'+esc(item.tweetA)+'</div>'
     +'<div><span class="tb">TWEET B</span> <button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button><br>'+esc(item.tweetB)+'</div></div>'
     +(item.charts.count>0||item.charts.desc?'<div class="ch'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING · ':'📊 ')+(item.charts.count>0?item.charts.count+' chart(s): ':'')+esc(item.charts.desc)+'</div>':'')
     +'<a href="'+esc(item.link)+'" target="_blank">↗ Read full article</a></div></div>';
  });
  document.getElementById("cards").innerHTML=h||'<p>No items.</p>';
  bars();
}
function bars(){
  var cats={};ITEMS.forEach(function(i){cats[i.cat]=(cats[i.cat]||0)+1});
  var h='<span class="pill'+(fc==="all"&&fs===null?' on" style="background:#333"':'"')+' onclick="setC(\'all\')">All '+ITEMS.length+'</span>';
  Object.keys(cats).sort().forEach(function(k){var on=fc===k&&fs===null;h+='<span class="pill'+(on?' on" style="background:'+COL[k]+'"':'"')+' onclick="setC(\''+k+'\')">'+k+' '+cats[k]+'</span>'});
  document.getElementById("catbar").innerHTML=h;
  var u='<span class="pill'+(fu==="all"&&fs===null?' on" style="background:#333"':'"')+' onclick="setU(\'all\')">All</span>';
  ["red","deep","watch"].forEach(function(k){var n=ITEMS.filter(function(i){return i.urgency===k}).length;u+='<span class="pill'+(fu===k&&fs===null?' on" style="background:#333"':'"')+' onclick="setU(\''+k+'\')">'+UL[k]+' '+n+'</span>'});
  document.getElementById("urgbar").innerHTML=u;
}
function init(){
  document.getElementById("sub").textContent=META.date+" · "+META.time+" · "+META.itemsExtracted+" items";
  var r='<p><b>Window:</b> '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</p><p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</p><p><b>Included sources</b> (click to filter):<br>';
  META.includedSources.forEach(function(s){r+='<span class="sl" data-n="'+esc(s.name)+'">'+esc(s.name)+'</span> ('+s.items+')<br>'});
  r+='</p><p><b>Skipped:</b><br>';
  META.skippedSources.forEach(function(s){r+=esc(s.name)+' — '+esc(s.reason)+'<br>'});
  r+='</p>';
  document.getElementById("rep").innerHTML=r;
  Array.prototype.forEach.call(document.querySelectorAll(".sl"),function(e){e.onclick=function(){filterBySrc(e.getAttribute("data-n"))}});
  render(false);
}
init();
</script></body></html>
