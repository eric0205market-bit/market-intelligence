<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-08-25T17:20:59Z", "input_stats": {"total_tweets": 241, "unique_authors": 84, "tweets_with_images": 53, "after_noise_filter": 118}, "summary": "**Druckenmiller/Bessent:** Stan Druckenmiller's WSJ op-ed slamming Treasury Secretary Bessent's bond-market buybacks blew up for a second reason — it was flagged as AI-written by Pangram, sparking a fight over whether AI-generated opinion writing is legitimate (**hosseeb**, **thedefivillain**, **nic_carter** vs. **santiagoroel**, **AviFelman**).\n\n**Iran/Hormuz:** Oil fell ~3% as **JavierBlas** tracked tankers moving again through Gulf ports and an Iran-Oman framework for a temporary Hormuz corridor, even as the US expanded sanctions and **zriboua** argued Iran is \"weak, getting weaker.\"\n\n**Anthropic:** WSJ reporting that Anthropic will tell investors it sees **$30T** in potential revenue drew immediate pushback — **BobEUnlimited** called it \"pure bullshit\" (that's ~100% of US GDP), while **mhonkasalo** and **stevehou** flagged the broader wealth-concentration implication for public markets.\n\n**Crypto:** BTC broke $80K for the first time in 113 days with **jvisserlabs** flagging a rare 200-day MA slope reversal and **cointradernik** mapping a path to 83–88K before Q4 continuation. Robinhood Chain tokens (PONS, HOOKR, DELTA, Cashcat) kept ripping on tokenized-equity growth (**0xSammy**, **Bluntz_Capital**, **Delphi_Digital**).\n\n**AI/Tech:** OpenAI's first custom inference chip, Jalapeño, reportedly beat Nvidia Blackwell out of the gate (**dylan522p**), and Chinese humanoid robots broke the sub-9-second 100m barrier again (**cryptopunk7213**).\n\n**Notable:** **AnjneyMidha** says he and colleagues got early access to two unreleased frontier models for security evaluations and are in DC today \"to discuss the implications\" — no further detail given.", "sections": {"A_events": [{"cluster": "Druckenmiller vs. Bessent — and the AI-Authorship Storm That Followed", "category": ["macro", "AI"], "items": [{"author": "hosseeb", "summary": "Flagged that Stan Druckenmiller's WSJ op-ed attacking Treasury Secretary Bessent's use of bond buybacks to suppress yields (\"Markets aggregate information no committee can replicate\") reads as clearly AI-generated, and asked whether this is the new normal for bylined opinion writing or a special case for famous people. Followed up defending AI-detector Pangram's near-zero false-positive rate per a University of Chicago study, arguing there's \"0 chance\" it misread a 1,300-word op-ed.", "tweet_url": "https://x.com/hosseeb/status/2092139986317672556", "type": "thread", "images": ["https://pbs.twimg.com/media/HQjEJlQa8AATEf8.jpg"]}, {"author": "thedefivillain", "summary": "Called the op-ed \"S-tier AI slop\" and mocked specific lines (\"the market's verdict was swift and correct\"), arguing real analytical writing shouldn't be identifiable as AI in the first sentence.", "tweet_url": "https://x.com/thedefivillain/status/2092178314408394941", "type": "tweet"}, {"author": "nic_carter", "summary": "Blunter take: \"full AI written — we can safely disregard. even if he's talking sense, he can try again and write it by hand.\"", "tweet_url": "https://x.com/nic_carter/status/2092251708315373668", "type": "tweet"}, {"author": "santiagoroel", "summary": "Pushed back: if the writing or product is good, provenance shouldn't matter — what matters is whether the reader finds value. Argued the downstream effect is more people publishing and attention getting harder to capture. In a separate thread, distinguished whether AI did the *thinking* vs. just formatting existing reasoning, and argued craftsmanship is a function of taste, not time spent.", "tweet_url": "https://x.com/santiagoroel/status/2092231904695099803", "type": "thread"}, {"author": "AviFelman", "summary": "Offered the more nuanced middle position: the real question isn't whether AI wrote the words but whether AI came up with the *reasoning*. Feeding a model your own pre-formed argument (with your data and prior learnings) is different from asking it to invent the argument — the latter, he thinks, produces shallow reasoning that only looks rigorous.", "tweet_url": "https://x.com/AviFelman/status/2092252805767606500", "type": "thread"}, {"author": "0xfoobar", "summary": "Sided with the skeptics on mechanism: \"writing is thinking\" — LLMs are fluent enough to produce a plausible high-level idea, but skip the low-level friction where a human writer discovers the nuances that should actually change their argument.", "tweet_url": "https://x.com/0xfoobar/status/2092267507407069307", "type": "tweet"}, {"author": "ASvanevik", "summary": "Theorized the likely supply chain behind it: \"Person hires PR firm. PR firm hires ghostwriter. Ghostwriter uses AI.\"", "tweet_url": "https://x.com/ASvanevik/status/2092248893572686088", "type": "tweet"}]}, {"cluster": "Iran–Hormuz: Sanctions Expand as Oil Slips and a De-escalation Framework Emerges", "category": ["energy", "geopolitics", "macro"], "items": [{"author": "JavierBlas", "summary": "Reported a joint Iran-Oman statement describing a \"phased framework\" for the Strait of Hormuz, including a temporary joint shipping corridor, information exchange and traffic management. Separately posted Sentinel-2 satellite imagery (Aug 24) showing tankers moving again through Iraqi, Saudi and Kuwaiti Gulf ports, and flagged Shell CEO Wael Sawan's comment that global energy markets have been \"incredibly resilient\" through the US-Iran discontinuities.", "tweet_url": "https://x.com/JavierBlas/status/2092284150736699710", "type": "thread", "images": ["https://pbs.twimg.com/media/HQlYy6XWcAA9Yks.jpg", "https://pbs.twimg.com/media/HQlYy6NXUAAgBqW.jpg"]}, {"author": "elerianm", "summary": "Morning brief led with oil down ~3% (easing pressure on the US 10-year, -3bps) alongside Druckenmiller's op-ed and China's counter-threat over new US secondary sanctions targeting Iranian trade/financial flows.", "tweet_url": "https://x.com/elerianm/status/2092198034989883596", "type": "tweet", "images": ["https://pbs.twimg.com/media/HQj621PWUAEzGdo.png"]}, {"author": "zriboua", "summary": "Argued Iran is \"weak, getting weaker,\" losing key regional allies (citing Iraq), and separately noted \"China has absolutely nothing to worry about\" re: the new sanctions — read as sarcasm given China's public threat to retaliate.", "tweet_url": "https://x.com/zriboua/status/2092231700780560729", "type": "tweet"}, {"author": "rektmando", "summary": "Daily digest logged: oil tanker attacked in the Strait of Hormuz, US won't rule out a further strike on Iran, and the US has now seized ~$1B in crypto from Iran since May, alongside expanded sanctions on Iranian gold/crypto flows.", "tweet_url": "https://x.com/rektmando/status/2092210987625816288", "type": "tweet", "images": ["https://pbs.twimg.com/media/HQkGLP2aUAAYYmy.jpg"]}]}, {"cluster": "Anthropic's $30T Revenue Claim Draws Immediate Pushback", "category": ["AI", "macro"], "items": [{"author": "buccocapital", "summary": "Flagged the WSJ report that Anthropic will tell investors it sees over $30 trillion in potential revenue.", "tweet_url": "https://x.com/buccocapital/status/2092287131859267788", "type": "tweet", "images": ["https://pbs.twimg.com/media/HQlMDm3XcAAF0BP.jpg"]}, {"author": "BobEUnlimited", "summary": "Called the figure \"pure bullshit\" — $30T is roughly 100% of current US GDP or 20% of current global GDP — and, when asked if that's plausible for a single company, said no.", "tweet_url": "https://x.com/BobEUnlimited/status/2092284675108577688", "type": "tweet"}, {"author": "stevehou", "summary": "Same skepticism from a different angle: \"so why stop at 30T?\" — i.e. that the entire US economy would be the implied ceiling.", "tweet_url": "https://x.com/stevehou/status/2092295726818631750", "type": "tweet"}, {"author": "mhonkasalo", "summary": "Drew the broader implication: index funds can't make the average investor rich if they stop capturing economic growth — 20 years ago the $3–5T of value created by today's largest private AI companies would mostly have accrued in public markets. \"Real tragedy, most people don't even know.\"", "tweet_url": "https://x.com/mhonkasalo/status/2092242871390752917", "type": "tweet"}, {"author": "citrini", "summary": "Dry one-liner riffing on the same news cycle: “Claude, criticize the Secretary of the Treasury. Make no mistakes.”", "tweet_url": "https://x.com/citrini/status/2092172862018683147", "type": "tweet"}]}, {"cluster": "Robinhood Chain — Tokenized Equities and Infra Tokens Keep Ripping", "category": ["crypto", "positioning"], "items": [{"author": "0xSammy", "summary": "Robinhood Chain is now adding ~6,000 new tokenized-equity holders per day (109K wallets total). Separately flagged a \"little birdie\" tip that $PONS is about to leg up again as transaction volume picks back up, with ~80% of protocol revenue routed into buybacks/burns.", "tweet_url": "https://x.com/0xSammy/status/2092235920573403371", "type": "thread", "images": ["https://pbs.twimg.com/media/HQkcA4TXcAAk5J4.jpg"]}, {"author": "Bluntz_Capital", "summary": "Noted the three main RH-chain infra plays — $HOOKR, $DELTA, $PONS — up 130%, 100% and 36% respectively, arguing being early to a new chain at the start of a bull run is being underestimated.", "tweet_url": "https://x.com/Bluntz_Capital/status/2092123249580917052", "type": "thread", "images": ["https://pbs.twimg.com/media/HQi2rADaEAAzuqE.png"]}, {"author": "laurashin", "summary": "Reported dYdX Labs launched Arcus, a platform offering leveraged tokens tied to stocks and crypto assets on Robinhood Chain.", "tweet_url": "https://x.com/laurashin/status/2092281007819133031", "type": "tweet"}, {"author": "Matt_Hougan", "summary": "Bitwise launched Automated Token Portfolios (ATPs) — institutionally designed, rules-based model portfolios for tokenized stocks that investors hold in their own wallet/custody rather than a fund, built on Coinbase Tokenized Stocks and implemented by Glider on Base. Framed the pitch as inverting the usual question: why should investors give up custody at all?", "tweet_url": "https://x.com/Matt_Hougan/status/2092243513157226859", "type": "thread"}, {"author": "Delphi_Digital", "summary": "Argued the tokenized-stock race may be won on distribution rather than issuance: Binance's bStocks launched after specialist issuers (June 11) yet did $1.8B in volume within 24 days, rising to $14.7B in July and reaching 28% share among the three largest issuers by month-end — attracting traders and liquidity may matter more than the wrapper itself. Separate podcast clip: slower RH-chain listings may be intentional to avoid speculation feeding on itself.", "tweet_url": "https://x.com/Delphi_Digital/status/2092250541145587815", "type": "thread", "images": ["https://pbs.twimg.com/media/HQkqw7TawAA5Rqe.png"]}]}, {"cluster": "BTC Breaks $80K — First Time in 113 Days", "category": ["crypto", "positioning"], "items": [{"author": "jvisserlabs", "summary": "BTC had its largest weekly sigma move in a decade last week while breaking above the 200-day moving average; on Aug 21 the 200-day MA slope turned positive for the first time in 279 days. Historically, every time the 200-day slope flipped positive after being negative for 100+ days, the low made during the preceding decline was never broken again.", "tweet_url": "https://x.com/jvisserlabs/status/2092200578830975347", "type": "tweet", "images": ["https://pbs.twimg.com/media/HQj8H5oWIAA6JF6.png"]}, {"author": "cointradernik", "summary": "Reads price action as longs closing overnight and shorts now opening into the lows; sees a path back above 79.3 clearing 81 and the first daily close above the ATH AVWAP since cycle top. No obvious \"buyable dip\" to force sideliners in — expects a possible 15% shakeout in the 83–88K range (especially if alts get frothy) before chop, consolidation, and bull continuation in Q4.", "tweet_url": "https://x.com/cointradernik/status/2092251353921847660", "type": "thread", "images": ["https://pbs.twimg.com/media/HQkuCQfXIAAFCjZ.jpg"]}, {"author": "rektmando", "summary": "Daily digest: BTC 80,580 (+4%), SOL leading majors (+8%), BTC ETF inflows +$338M, ETH ETF +$116M, ~$215B rotated into alts over 3 days per CryptoQuant, Strive bought $81.5M more BTC.", "tweet_url": "https://x.com/rektmando/status/2092210987625816288", "type": "tweet", "images": ["https://pbs.twimg.com/media/HQkGLP2aUAAYYmy.jpg"]}, {"author": "ZeeContrarian1", "summary": "Complementary equities angle: $NVDA fell 7 straight sessions into Wednesday's earnings (first time since 2022) while the Nasdaq was down 6 of 7 — a much lower bar ($210 vs $240) sets up a good rally setup into and through earnings week.", "tweet_url": "https://x.com/ZeeContrarian1/status/2092135237635502176", "type": "tweet"}, {"author": "saxena_puru", "summary": "Complementary take: AI stocks are \"coiled springs\" after near-term consolidation, expecting a multi-month rally — every AI-adoption metric is accelerating and the recent rout looks like a technical unwind, not the end of the story.", "tweet_url": "https://x.com/saxena_puru/status/2092135372088287510", "type": "tweet"}]}, {"cluster": "OpenAI's Jalapeño Inference Chip Reportedly Beats Nvidia Blackwell", "category": ["AI", "tech"], "items": [{"author": "dylan522p", "summary": "SemiAnalysis got early access to dissect OpenAI's self-designed inference ASIC, Jalapeño. Unusually for a first-generation chip, it's reportedly beating Nvidia Blackwell — and even Rubin — on TCO and throughput-per-MW.", "tweet_url": "https://x.com/dylan522p/status/2092258594628706778", "type": "tweet"}, {"author": "cryptopunk7213", "summary": "OpenAI went from chip design to production in ~9 months versus the typical 1–2 years, using its own internal models to help design the chip and plan production — unprecedented turnaround. The chip works across multiple model architectures (not just GPT), which could open a hardware-sales revenue line if OpenAI chooses to sell it externally.", "tweet_url": "https://x.com/cryptopunk7213/status/2092286257611133024", "type": "tweet", "images": ["https://pbs.twimg.com/media/HQlLQqFXgAA96rc.jpg"]}]}, {"cluster": "Chinese Humanoid Robots Break the 100m Sprint Record — Again", "category": ["AI", "tech"], "items": [{"author": "cryptopunk7213", "summary": "A humanoid robot broke Usain Bolt's 100m equivalent mark again, this time going sub-9 seconds — down from 21 seconds just a year ago. Cited as a signal of how fast Chinese humanoid-robotics progress is compounding.", "tweet_url": "https://x.com/cryptopunk7213/status/2092256656612524374", "type": "tweet"}]}], "B_insights": [{"author": "0xJeff", "summary": "Long thread on x402 micropayment economics: transaction volume hit 1–1.5M/day for the first time ever (~2x June/July volume), but average transaction size fell to $0.023–$0.031. Third-party facilitators (Coinbase CDP on Base, PayAI on Solana) charge $0.001/settlement, which after a math correction works out to 3.2–4.3% of average transaction value — a real tax on micro-transaction merchants. Batching (live since May, batches 1,000s of txns into one settlement) could cut that by 90–99%, but he can't figure out why almost no one uses it — unclear if it's tooling support, counterparty risk, or accounting complexity.", "tweet_url": "https://x.com/0xJeff/status/2092240591442808913", "type": "thread", "images": ["https://pbs.twimg.com/media/HQkgUBKaQAAKLcf.png"]}, {"author": "ZeeContrarian1", "summary": "After the Nasdaq/Nvidia selloff, argues low realized volatility plus very negative positioning/sentiment is exactly the setup for cheap short-dated call \"lottery tickets\" — not a core strategy, but asymmetric enough that one big winner pays for the rest; best opened at the end of a bearish session to capture overnight moves.", "tweet_url": "https://x.com/ZeeContrarian1/status/2092197669452038223", "type": "thread", "images": ["https://pbs.twimg.com/media/HQj6sPsWIAAKj2f.jpg"]}, {"author": "DefiIgnas", "summary": "$BP (Backpack) is a fundamentally strong bet — RWA/tokenization exposure, new-CEX narrative, no team token allocation, 62% staked, token-to-equity conversion — but trades only ~$2M/month and the chart shows it: a reminder that liquidity matters as much as the fundamentals story.", "tweet_url": "https://x.com/DefiIgnas/status/2092243756875387195", "type": "tweet", "images": ["https://pbs.twimg.com/media/HQkktp0XIAA58um.jpg"]}, {"author": "DefiIgnas", "summary": "Compared perp-DEX open interest per active user: Variational does $1.43B OI / 13K daily actives = $108K/user; Hyperliquid $13.29B / ~101K = $132K/user; Lighter $1.12B / ~21K = ~$53K/user (implying smaller accounts or less leverage). Also noted Variational carries 31% of its OI in tradfi markets (equities, gold, indexes) versus Hyperliquid's HIP-3 tradfi OI at ~28% of its total — a close comparison he reads as bullish for Variational's Q4 TGE.", "tweet_url": "https://x.com/DefiIgnas/status/2092287728981336086", "type": "thread"}, {"author": "jvisserlabs", "summary": "Argues the debate over where the 10-year Treasury yield \"should\" be is really the same debate as AI infrastructure ROIC: during the life of a 10-year bond, humanoids and AI agents working 24/7 could make machine-time economic output normal, while government debt was underwritten assuming human-time constraints. The real question is whether machine-time ROIC can outrun human-time financing costs — his hedge of choice is BTC.", "tweet_url": "https://x.com/jvisserlabs/status/2092293278771106197", "type": "tweet", "images": ["https://pbs.twimg.com/media/HQlPUOiW8AA2ssG.jpg"]}, {"author": "patrick_oshag", "summary": "Podcast with Neil Movva (ex-Nvidia, now running Sail Research, which builds inference infrastructure to make agent tokens cheaper): key claim is that today's AI infrastructure spending differs from the dot-com buildout because token consumption isn't speculative — people buy inference because it's immediately useful, they don't hoard it. Even the 2023–24 Hopper supply crunch was training-driven (speculative); inference spend, by contrast, \"monotonically increases.\"", "tweet_url": "https://x.com/patrick_oshag/status/2092257332231057806", "type": "thread", "images": ["https://pbs.twimg.com/media/HQkXrukWcAEFvo3.jpg"]}, {"author": "elerianm", "summary": "Rounded out the day's macro data: Germany's upwardly revised Q2 GDP extends a nine-month streak of firmer growth, complemented by an August IFO confidence beat. On the softer side, US July new home sales fell on elevated mortgage rates and Conference Board Consumer Confidence missed, dropping to 89.2, raising the stakes for the upcoming UMich survey.", "tweet_url": "https://x.com/elerianm/status/2092256937924546865", "type": "tweet"}, {"author": "MelMattison1", "summary": "Cutting spend and raising taxes aren't the same as reducing the deficit — doing both at once would crush economic activity and the stock market, crippling tax receipts the way the '22 bear market did, offsetting the intended debt reduction. His conclusion: there's no simple fiscal fix; inflation and a weaker dollar are the only realistic way out.", "tweet_url": "https://x.com/MelMattison1/status/2092237232622928339", "type": "tweet", "images": ["https://pbs.twimg.com/media/HQkeq2zW4AE_gja.jpg"]}, {"author": "dgt10011", "summary": "The #1 macro-noob mistake is treating the carry trade as being about income (spread differential) when it's actually about duration (the collateral multiplier) — and MMT's original sin is assuming entry and exit costs are symmetric.", "tweet_url": "https://x.com/dgt10011/status/2092236339605283153", "type": "tweet"}, {"author": "nic_carter", "summary": "Defended AI datacenter buildout against critics on both flanks: the left dismisses it as anti-climate, but the right has spent decades demanding exactly this — a domestic, high-energy, productive industry reversing offshoring — and is now \"pissing its pants\" over NIMBY objections. Separately dismissed a Fed governor's statement as \"full AI written\" and therefore safe to disregard regardless of its content.", "tweet_url": "https://x.com/nic_carter/status/2092247897446244356", "type": "thread"}, {"author": "himgajria", "summary": "Framing for this cycle: with prediction markets, perps, ICOs and RWAs all being legitimized, don't ask what dumb money (retail) will buy — ask what smart money (tradfi) is going to buy instead.", "tweet_url": "https://x.com/himgajria/status/2092137657463869801", "type": "tweet"}, {"author": "Rewkang", "summary": "RoboStrategy's first shareholder letter argues robotics won't get a single \"ChatGPT moment\" the way chatbots did — the adoption curve sits somewhere between AI chatbots and autonomous vehicles. Physical AI capability is already good for many use cases, but the bottleneck is shifting: intelligence won't be the constraint by next year, the actual supply of robots will be.", "tweet_url": "https://x.com/Rewkang/status/2092237850834342072", "type": "tweet"}, {"author": "AnjneyMidha", "summary": "Said he and colleagues were given early access to two unreleased frontier AI models for security evaluations a few months ago, and that despite having had early access to nearly every SOTA model over the last five years, \"these were different\" — he's in DC today \"to discuss the implications,\" without elaborating further.", "tweet_url": "https://x.com/AnjneyMidha/status/2092249392610717997", "type": "thread", "images": ["https://pbs.twimg.com/media/HQkpu_fWsAAiQbh.jpg"]}, {"author": "hooeem / garrytan", "summary": "Two AI-tooling notes: hooeem posted a full workflow for building a reusable \"YouTube Clipper\" skill in the Hermes desktop app (auto yt-dlp download, FFmpeg frame-accurate cut, Whisper transcription, then researcher/writer sub-agents produce quotes and an X caption). Garry Tan separately argued the productivity unlock right now is \"cross-harness memory maxxing\" — sharing a persistent memory/context layer across Claude Code, Grok, Codex, etc. rather than re-explaining context to each tool.", "tweet_url": "https://x.com/hooeem/status/2092174022070936051", "type": "thread"}, {"author": "ASvanevik / udiWertheimer", "summary": "Local-inference hardware chatter: Apple's M5 Ultra was unveiled with 1.2TB/s memory bandwidth. Separately, on choosing a Mac for local LLMs, udiWertheimer argued a 32GB Mac Mini is riskier than it looks since that memory is shared with the OS (unlike a dedicated 32GB 5090) — recommending 48GB M5 Pro as the realistic minimum if you want headroom for long context windows.", "tweet_url": "https://x.com/ASvanevik/status/2092250126844842234", "type": "tweet", "images": ["https://pbs.twimg.com/media/HQkqZhRaQAAayPl.jpg"]}, {"author": "Fiskantes", "summary": "Flagged ETH's recent outperformance-vs-majors narrative reversing (chart), and separately mused that nobody's talking about NFTs or DePIN anymore — asking, half-rhetorically, whether both categories are just dead as narratives this cycle.", "tweet_url": "https://x.com/Fiskantes/status/2092178662535684132", "type": "thread", "images": ["https://pbs.twimg.com/media/HQjpCtoXQAAVA5Z.jpg"]}, {"author": "novogratz", "summary": "Galaxy launched GalaxyOne Crypto Portfolio Line of Credit — borrow against combined BTC/ETH/SOL holdings without selling, part of Galaxy's push to unify crypto, stocks and cash management in one platform.", "tweet_url": "https://x.com/novogratz/status/2092248675120513395", "type": "thread"}, {"author": "lopp", "summary": "Suggested X's Safety team should proactively identify users showing signs of \"AI psychosis\" (arguing with Grok as if it's human) and route them to mental-health resources — framed pointedly, arguing trolling a machine that has no feelings is itself a symptom.", "tweet_url": "https://x.com/lopp/status/2092223824133517784", "type": "thread"}, {"author": "mrjasonchoi", "summary": "Speculated declining birth rates may be partly reflexive/mimetic: after two generations of low birth rates, choosing to have kids starts to look like the unusual life choice rather than the default — a social-trend observation with obvious long-run demographic/market implications.", "tweet_url": "https://x.com/mrjasonchoi/status/2092174784742469954", "type": "thread"}, {"author": "jimcramer", "summary": "Building a list of questions for Nvidia's earnings call after seven straight down sessions (\"NOT coming in hot\"). Separately flagged a \"new pattern\" in AI-adjacent names: companies that can deal directly with state/local governments are thriving while neoclouds lacking that clout or balance sheet got crushed. Also noted back-to-back disappointing prints from Dick's Sporting Goods and Foot Locker.", "tweet_url": "https://x.com/jimcramer/status/2092158279803617362", "type": "tweet"}], "C_contrarian": [{"author": "CryptoKoryo", "summary": "Pushes back on the crypto-bull-market narrative despite the rally: exploits, halted/rollbacked chains, governance takeovers and oracle manipulations remain endemic to crypto's tech stack, which he reads as evidence the space isn't fundamentally ready for a bull market. Views the current rally mainly as macro traders rotating into risk-on exposure via ETF inflows — a relief bounce, not a crypto-native regime change.", "tweet_url": "https://x.com/CryptoKoryo/status/2092222284727562367", "type": "tweet"}, {"author": "thedefivillain", "summary": "Bear case on $ZEC: upside looks \"giga capped\" versus the previous local top, which was set in a high-energy pump context (volume and mindshare saturation) that isn't repeating this time — taken in reply to another trader shorting ZEC into the Grayscale ZEC ETF debut. Separately took a contrarian read on Saylor's shift from largest BTC buyer to largest seller: BTC only made ~3% new lows on the news, suggesting the market had already priced it in rather than being surprised each time it's rediscovered.", "tweet_url": "https://x.com/thedefivillain/status/2092243202048733328", "type": "thread"}, {"author": "DCinvestor", "summary": "Skeptical of the AI-token bet as an economic strategy: betting that generating enough AI tokens leads to AGI which then reverses US relative decline is \"a bold gamble\" he expects history to judge harshly, while China builds and exports real things and the US's global goodwill/reserve-currency status erodes. Wants exposure to both sides — forced to be long AI while also wanting a hedge outside the system that doesn't depend on the US government \"getting its shit together.\"", "tweet_url": "https://x.com/DCinvestor/status/2092185102142804231", "type": "thread"}, {"author": "mhonkasalo", "summary": "Endorsed a narrow view of crypto value accrual: \"there is no more crypto\" in the broad sense — only a handful of tokens ($HYPE, $VVV, $CARDS, ETH) plus Zcash/Bitcoin actually drive value to holders; \"everything else is a popcorn trade.\" Separately warned teams that turned off buybacks in the bear market (because they \"weren't working\") not to turn them back on now, at the top.", "tweet_url": "https://x.com/mhonkasalo/status/2092169106468360464", "type": "tweet"}, {"author": "zeroxkyle", "summary": "On Singapore's cash-incentive birth-rate policy: cited the Chinese saying \"wealth doesn't last three generations,\" arguing the policy reflects third-generation leadership out of touch with the founding generation's example, and that data broadly show monetary incentives don't move birth rates.", "tweet_url": "https://x.com/zeroxkyle/status/2092139550676279626", "type": "thread"}], "D_positioning": [{"author": "AviFelman", "summary": "Multiple positioning notes: signed up for memecoin app @fomo for the first time since 2024, explicitly \"expecting this to be the top of the market\"; separately signed up for @pear_protocol (pairs trading, integrated with Lighter) to bet on continued separation of good projects from bad; holds $ARKG at ~11% of total portfolio and won't sell until he sees the full timeline play out; and flagged the Zcash ETF ($ZCSH) has traded only ~$8.5M in volume so far — 90% less than the largest SOL ETF's first day — as a sign \"mainstreet\" isn't especially interested in privacy.", "tweet_url": "https://x.com/AviFelman/status/2092248012152098973", "type": "thread"}, {"author": "ZeeContrarian1", "summary": "Current two largest positions are $IONS and $SNAP, together ~40% of portfolio, out of a closely-tracked list of ~15 names he rotates between based on which is the \"hot hand.\" $WGS was ~40% of the book three months ago before a 100%+ run brought the allocation down; $ZIM has also come down in size (not conviction) — still thinks it may be the best value in the market.", "tweet_url": "https://x.com/ZeeContrarian1/status/2092247687437471774", "type": "thread", "images": ["https://pbs.twimg.com/media/HQkoLlhWoAAod2x.jpg"]}, {"author": "Geiger_Capital", "summary": "Put on a new trade, details posted only to his Substack chat (not disclosed on X).", "tweet_url": "https://x.com/Geiger_Capital/status/2092262252627845531", "type": "tweet", "images": ["https://pbs.twimg.com/media/HQk1bUrXQAAu9dT.jpg"]}, {"author": "cointradernik", "summary": "BTC levels: needs to hold above 79.3 to clear 81 and print the first daily close above the ATH AVWAP since cycle top; sees a possible 83–88K shakeout zone (~15%) before Q4 bull continuation, contingent on alts not getting too frothy near-term.", "tweet_url": "https://x.com/cointradernik/status/2092251353921847660", "type": "tweet", "images": ["https://pbs.twimg.com/media/HQkuCQfXIAAFCjZ.jpg"]}, {"author": "alpha_pls", "summary": "Flagged price targets of $ZEC 800 and $HYPE 80 as \"smart consensus\" positioning (vs. general retail consensus), framing the two as his preferred bear-market survivors this cycle, following prior cycles' LINK (2019) and SOL (2022).", "tweet_url": "https://x.com/alpha_pls/status/2092234604727931325", "type": "tweet"}, {"author": "Pentosh1", "summary": "$PURR up 10%+ on good volume, trading at 1.17x mNAV; expecting a large $HYPE TWAP buy tonight following a similar 12–14M TWAP from Purr, with aqav2 going live this week adding $500–600K/day in new revenue from USDC yield.", "tweet_url": "https://x.com/Pentosh1/status/2092260795329753289", "type": "tweet", "images": ["https://pbs.twimg.com/media/HQkzjxwaYAAkrrf.jpg"]}, {"author": "DefiIgnas", "summary": "Bullish on Variational's TGE, expected Q4 — \"perfect timing as the market is rebounding\" — and expects the airdrop to surprise traders on size.", "tweet_url": "https://x.com/DefiIgnas/status/2092287728981336086", "type": "tweet"}, {"author": "AndreCronjeTech", "summary": "ftUSD yield has been stable at 9–10% over 3 months; a new stable-invariant version will allow looping, which at current lend rates would add roughly +9% per loop. Also running a 100 BTC, 10x total-return-swap long position at 0.69% funding with no ADL risk.", "tweet_url": "https://x.com/AndreCronjeTech/status/2092206695678124092", "type": "tweet", "images": ["https://pbs.twimg.com/media/HQkBdMHW8AAuu7d.jpg"]}, {"author": "DCinvestor", "summary": "Betting Fed governor Warsh won't raise rates before the midterms — says Trump \"would go absolutely ape shit\" if he did.", "tweet_url": "https://x.com/DCinvestor/status/2092164327927320945", "type": "tweet"}, {"author": "thedefivillain", "summary": "Chart call: AI stocks (using $MU as the proxy) may have just put in a higher low.", "tweet_url": "https://x.com/thedefivillain/status/2092190689392021844", "type": "tweet", "images": ["https://pbs.twimg.com/media/HQjzr2qXMAAhuli.jpg"]}, {"author": "DTAPCAP", "summary": "Bullish on ETH here: \"too cheap given dramatic developments over the past 18 months,\" framing it as the base layer/money rails for agentic finance going forward.", "tweet_url": "https://x.com/DTAPCAP/status/2092268818139607356", "type": "tweet", "images": ["https://pbs.twimg.com/media/HQk7ZioXYAA9Vvg.jpg"]}, {"author": "aleabitoreddit", "summary": "On $SIVE's recent weakness: attributes most of the drop to Bootstrap Europe converting and selling 7% of shares outstanding into the Swedish market (~July 3 to ~Aug 18), compounded by the broader AI-sector selloff, inaccurate CPO-delay reports, and short sellers piling in on timing. With that overhang (plus the final 1.659M warrants from two weeks ago) now largely exhausted, expects the stock to normalize on the next catalyst (e.g. earnings).", "tweet_url": "https://x.com/aleabitoreddit/status/2092226228942241975", "type": "tweet", "images": ["https://pbs.twimg.com/media/HQkT5VcbYAA69HJ.jpg"]}, {"author": "Crypto_McKenna", "summary": "Maple Finance is one of the few DeFi protocols whose 2026 revenue is clearly exceeding 2025: cumulative revenue was $6.85M in August 2025 vs. $12.23M today, implying a 12-month ARR of $20.94M. Market cap / ARR puts $SYRUP at a 9.35x multiple, which he reads as cheap relative to DeFi peers that haven't yet exceeded their 2025 revenue.", "tweet_url": "https://x.com/Crypto_McKenna/status/2092290919269839303", "type": "tweet", "images": ["https://pbs.twimg.com/media/HQlOQ-eagAAyfbY.jpg"]}], "E_links": [{"author": "Delphi_Digital", "summary": "Free consulting report on the tokenized-stock distribution race (Binance bStocks vs. specialist issuers).", "tweet_url": "https://x.com/Delphi_Digital/status/2092250541145587815", "type": "tweet"}, {"author": "patrick_oshag", "summary": "Podcast: Neil Movva (Sail Research, ex-Nvidia) on inference economics, chip pricing, and the AI infra buildout vs. dot-com comparison.", "tweet_url": "https://x.com/patrick_oshag/status/2092226959711334544", "type": "tweet"}, {"author": "AviFelman", "summary": "Podcast: Evgeny Gaevoy (7RE) on delta-neutral / market-neutral trading, building a billion-dollar fund, and his time at UBS.", "tweet_url": "https://x.com/AviFelman/status/2092275936871723227", "type": "tweet"}, {"author": "Delphi_Digital", "summary": "Podc ": "https://x.com/Swedish_uranium/status/2092288889092276487", "type": "tweet"}]}, "coverage": {"authors_covered": 56, "authors_total": 84, "coverage_pct": 67}};

// ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
