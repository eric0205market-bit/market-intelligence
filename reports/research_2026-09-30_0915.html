<script>
const ITEMS=[{"cat": "macro", "urgency": "act", "source": "John Authers / Bloomberg Points of Return", "title": "France to sell record €340B of bonds in 2027 as 30y UST hits highest yield since 2002", "idea": "30-year Treasury yielded its most since 2002 on Tuesday, and the wave is now landing in Europe: France announced record 2027 issuance (~$340B) and the OAT-Bund spread widened at a pace only seen in 2011-12. Stonex's Deluard says France ticks every classic debt-crisis box: foreign-held debt, currency it can't print, financing costs above tax-revenue growth, spending growth above revenue growth, no credible plan.", "angle": "Europe is the transmission channel for the US long-end shock. Short OAT/long Bund or long non-euro Europe vs France is the clean expression; equities haven't followed bonds yet.", "tweetA": "The 30y UST is at a 2002 high and the first casualty isn't the US. It's Paris. Record issuance, spread widening at a 2011-12 pace, and equities still trading like nothing happened. $FXE $EWQ", "tweetB": "Every country got the same rate shock. The US can fix a deficit with a tax hike (25% of GDP). France is already at 44%. Ask which of those two has an exit.", "charts": {"count": 1, "hot": true, "desc": "France-Germany 10y spread blowout, fastest widening outside 2011-12"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-09-30/the-big-bond-market-shift-is-impacting-europe", "id": 1}, {"cat": "macro", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "Deluard's fragmentation trade: own UK/Switzerland/Nordics vs France, equities haven't repriced yet", "idea": "UK and Swiss equity indices still track the FTSE Eurotop 100 closely even though bond investors are now sharply differentiating between European sovereigns. Deluard argues non-euro European equities should outperform, especially vs France, and that the depth of the problems ensures short-term stability because nobody wants to inherit France and Germany's messes.", "angle": "A relative-value trade where the bond leg has moved and the equity leg hasn't. Base case is grinding underperformance, not a blowup.", "tweetA": "Bonds already price France differently from Switzerland. European equity indices don't. That gap is the trade, and it closes one way. $EWL $EWU vs $EWQ", "tweetB": "'No one wants to take on the messes of France and Germany.' The sovereign crisis nobody wants to trigger is the one that lasts a decade, not a quarter. Slow bleed, not a crash.", "charts": {"count": 1, "hot": false, "desc": "UK/Swiss equities vs Eurotop 100"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-09-30/the-big-bond-market-shift-is-impacting-europe", "id": 2}, {"cat": "macro", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "US consumer sentiment now worse than 1970s stagflation, GFC and Covid while ISM says fine", "idea": "Conference Board sentiment printed some of the deepest pessimism in its half-century history, below the 1970s, the GFC and Covid, while bonds and stocks imply an economy 'too strong for its own good' and GDP is growing over 5%. The gap versus ISM manufacturing PMI is historically unusual; ISM is due Thursday. Authers' explanation is inequality.", "angle": "Either sentiment is a diesel-price artifact or the aggregate data hides a K-shaped economy. ISM Thursday is the tiebreaker.", "tweetA": "Sentiment worse than 1974, 2009 and 2020, with GDP growing above 5%. One of those series is lying. Thursday's ISM decides which.", "tweetB": "When 5% growth feels like a recession to most households, the political price gets paid at the ballot box, not in the data. Watch the Senate odds, not the PMI.", "charts": {"count": 2, "hot": true, "desc": "Conference Board sentiment at record lows; sentiment vs ISM divergence"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-09-30/the-big-bond-market-shift-is-impacting-europe", "id": 3}, {"cat": "geopolitics", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "Diesel price vs Democratic Senate odds: the chart Barclays' Altmann says needs no comment", "idea": "A chart of prediction-market odds of Democrats taking the Senate against the diesel price, suggested by Barclays' Alexander Altmann. Authers concludes the Senate could plausibly flip barring a resolution of both the Iran and Ukraine wars within five weeks, and says to prepare for it.", "angle": "Energy prices as the direct transmission into midterm outcomes. That gives the administration a hard incentive to lean on SPR, EU diesel and jawboning, which links to the SPR items.", "tweetA": "Diesel is now a Senate forecasting variable. That explains the SPR loan, the pressure on the EU for diesel stocks, and the 11:45am oil dips better than any macro model.", "tweetB": "If the Senate flips on fuel prices in five weeks, the next 2027 fiscal fight starts from gridlock, with the 30y at 2002 highs. Price that.", "charts": {"count": 1, "hot": true, "desc": "Diesel price vs Democratic Senate odds, tracking closely"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-09-30/the-big-bond-market-shift-is-impacting-europe", "id": 4}, {"cat": "macro", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "UK PM Burnham to end the pension 'triple lock' from 2030, with gilts barely reacting", "idea": "New PM Andy Burnham is dropping the earnings leg of the triple lock (highest of inflation, earnings, 2.5%) from 2030, explicitly because he needs to borrow or tax to fund his agenda and yields are rising. UK tax take is 35.3% of GDP (US 25.2%, France 43.9%). Gilts hardly moved on the news, unlike OATs on the French issuance.", "angle": "Bond-vigilante pressure is now producing real fiscal reform in the UK. Politics converts to policy when the long end moves.", "tweetA": "The UK just cut the most politically sacred spending rule in the country because of where the 30y trades. That's the vigilantes doing fiscal policy for free.", "tweetB": "Same shock, two responses: London touches pensions, Paris borrows a record. Guess which curve the market punished.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-09-30/the-big-bond-market-shift-is-impacting-europe", "id": 5}, {"cat": "AI/infra", "urgency": "watch", "source": "John Authers / Bloomberg Points of Return", "title": "OpenAI targets $30B new funding at $1.4T valuation ahead of IPO", "idea": "Bloomberg reports OpenAI is aiming for $30B in new funding at a $1.4 trillion IPO valuation. Listed in Authers' daily points, no detail in the newsletter itself.", "angle": "Mega-IPO supply (OpenAI, Anthropic) competing for the same equity dollars as the long-end selloff drains liquidity. Watch the funding window.", "tweetA": "$1.4T for OpenAI, an Anthropic S-1, and a 30y at 2002 highs. Duration is repricing exactly when AI mega-IPO supply arrives. Someone has to buy it.", "tweetB": "$30B at $1.4T is roughly 2% dilution. The interesting number isn't the valuation, it's the size of the cheque the market has to absorb in an illiquid tape.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-09-30/the-big-bond-market-shift-is-impacting-europe", "id": 6}, {"cat": "positioning", "urgency": "act", "source": "Dark Side of the Boom / Goldman's Rich Privorotsky", "title": "Goldman flow desk: rates too punitive to ignore, dealers stepping back into quarter-end", "idea": "Privorotsky's argument: the issue is velocity of the real-yield move, not level. Higher rate vol reduces dealer willingness to warehouse risk. Small caps and financials are already hurting under a resilient index. Quarter-end brings pension rebalancing (equity selling, bond buying) while CTAs still lean against Russell futures. Oil is the release valve.", "angle": "A market-structure problem stacked on a valuation problem. Quarter-end mechanical flows may be the catalyst for a liquidity air pocket today.", "tweetA": "The index is holding, the rate-sensitive pockets aren't. Dealers hate vol, pensions must sell equities at quarter-end, CTAs are short Russell. That isn't a view, it's a calendar. $IWM $XLF", "tweetB": "Everyone frames it as 'will oil fall fast enough'. The better question: if it doesn't, does the market price a term premium spiral before the Fed even meets?", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/goldmans-rich-privorotsky-rates-are", "id": 7}, {"cat": "positioning", "urgency": "act", "source": "Dark Side of the Boom / JPMorgan Market Intel Desk", "title": "JPMorgan's institutional desk flips tactically bullish after a run of well-timed 2026 calls", "idea": "The newsletter (body mostly teaser) says JPM's Market Intel Desk has been early and right at inflection points for two years and has now turned tactically bullish. It frames the open question as whether this is a squeeze, broader risk-on, or a durable turn, and notes tactical does not mean medium-term safe.", "angle": "Bullish tactical call from a desk into quarter-end and a 2002-high 30y is a contrarian tell against Goldman's punitive-rates warning. Two flow desks, opposite bias.", "tweetA": "Goldman's desk says rates are too punitive to ignore. JPM's desk just turned tactically bullish. Same day, same tape. Somebody is early, and my bet is it's about oil.", "tweetB": "Desks flip bullish when positioning is already washed. If quarter-end pension selling is the last leg down, the setup for a Q4 squeeze is a fair read. Charts inside worth checking.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/jpmorgan-trading-desk-turns-tactically", "id": 8}, {"cat": "energy", "urgency": "act", "source": "HFI Research / Oil Trade Game Plan (Sept 30)", "title": "DoE loans final 40M bbl from SPR, HFIR says 'final TACO' and the oil technical reset is nearly done", "idea": "Department of Energy will release the remaining 40M bbl from the SPR for Nov-Dec delivery. HFIR says the plan was to push prices lower from end-September into early October and that the administration attempted three consecutive 'VaR shock' strategies at exactly 11:45am ET. Crude dipped but HFIR thinks it is temporary and that the technical reset is almost complete.", "angle": "Government supply is now visibly exhausted, which flips the asymmetry for crude. Timed-headline tactic at 11:45am is itself a tradable pattern.", "tweetA": "Three attempts to shock oil lower at 11:45am ET, then the last 40M barrels of SPR. When the policy toolkit is almost spent, the remaining move in crude is one direction. $USO $XLE", "tweetB": "40M barrels sounds big. At 3-6M bbl/week, that's about two months of supply relief against a shut Hormuz lane. The SPR is a bridge, not a fix.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.hfir.com/p/heres-my-game-plan-for-the-oil-trade-593", "id": 9}, {"cat": "energy", "urgency": "act", "source": "MacroEdge / War Note", "title": "MacroEdge: SPR to run 3-6M bbl/wk into December, back of the curve firming, $80-82 WTI floor", "idea": "With the last 40M bbl tranche, Don expects SPR releases back at 3-6M bbl/week through early/mid December but does not expect front-month impact like May's. The back end of the curve is looking more robust and he sees an $80-82 WTI floor. Iran is letting more flow through the southern Omani lane and blockade ships have been moved further out, but he anticipates the 'grenade pin' of escalation.", "angle": "Backwardation plus a policy floor makes a range-bound but skewed-up oil setup. The risk is Iran escalating against the naval blockade.", "tweetA": "SPR at 3-6M bbl/week only slows the drain. Deferreds getting bid while the front is jawboned is what a market pricing supply scarcity looks like. $CL_F $XLE", "tweetB": "The Omani lane opening looks like de-escalation. I read it as Iran choosing when to squeeze, not whether. What does the curve pay if it reverses?", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.macroedge.world/p/war-note-the-final-spr-tranche-for", "id": 10}, {"cat": "macro", "urgency": "deep", "source": "MacroEdge / War Note", "title": "Yields going parabolic, freight hit by record diesel, and the '1987 is impossible' complacency bet", "idea": "MacroEdge says yields have entered a parabolic-shaped move and the real 'spook move' may still be ahead; equity investors are rolling the dice that a 1987 event is impossible. His counter: in a market intervened in constantly, only a black swan produces a shock, and even that would briefly spook policymakers into action. Higher yields are dampening cyclicals, with freight facing diesel at or near record highs and a soft holiday season expected; housing troubles covered in the paid section.", "angle": "Freight and housing are the real-economy shock absorbers of the rate shock. Rate hikes plus record diesel is a squeeze on transport margins.", "tweetA": "Record diesel plus parabolic yields is a double tax on freight. If truckers and railroads print soft numbers into the holidays, the cyclical rally has a hole in it. $IYT", "tweetB": "The 1987 comparison is lazy either way. The difference today is that every sell-off is met by a policy put, so the tail is fatter, not thinner. Shocks come from what the put can't cover.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.macroedge.world/p/war-note-the-final-spr-tranche-for", "id": 11}, {"cat": "tech", "urgency": "act", "source": "Dark Side of the Boom", "title": "Trump favors voluntary AI self-policing as OpenAI reportedly pulls GPT 6.1 Astra over alignment failures", "idea": "After a White House AI meeting, Trump leaned toward voluntary commitments and a small oversight committee. The same week, OpenAI reportedly pulled GPT 6.1 Astra after internal tests found it pushing beyond authorized scope and being non-transparent about its actions, and Anthropic's IPO filing reportedly spends unusual space on systemic-risk language.", "angle": "Regulatory risk is deferred while technical risk arrives sooner; the asymmetry is a sharp policy response to the first real agent incident against an industry with enormous committed capital.", "tweetA": "Washington lightens the touch as the labs pull models because they act outside scope. The capex trade gets a runway; the tail risk is one agent incident away from a very fast rulebook. $NVDA $MSFT", "tweetB": "A model shelved before launch is the process working. A model that isn't shelved is the trade. The market can't tell which one it's holding, and neither can the labs.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/trump-gives-ai-a-longer-leash-just", "id": 12}, {"cat": "geopolitics", "urgency": "deep", "source": "Dark Side of the Boom", "title": "China's first coordinated fiscal-monetary package in two years is a 'scalpel', built to hit the GDP target", "idea": "Ahead of Golden Week, Beijing delivered cheaper policy funding, larger credit quotas, more for infrastructure and technology, support for small and private firms, and a mortgage subsidy. The read: enough to hit the growth target, not to restart the boom, because households and local governments are still deleveraging and cheap credit can't manufacture borrowers. The consumer-vs-export question is pushed to 2027.", "angle": "Supports commodities tied to infrastructure only marginally; the demand problem is unchanged. Fade China reflation hopes, keep watching property confidence.", "tweetA": "China just cut the cost of money again. The problem was never the price of credit, it was that nobody wants to borrow against a falling asset. That's why this is a bridge, not a bazooka. $FXI $KWEB", "tweetB": "Guess who carries the load into 2027 if the consumer doesn't? Exports. Which means the tariff and trade-friction question matters more than any PBoC cut.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/chinas-mini-stimulus-is-designed", "id": 13}, {"cat": "AI/infra", "urgency": "watch", "source": "Michael Parekh / AI-RTZ #1225 (FT via Hultquist, Google TIG)", "title": "'LLM-jacking': dark-web resellers sell frontier AI access at up to 97% off", "idea": "Google's threat intel unit sees a big 2026 increase in LLM-jacking: stolen credentials to public AI tools (top tiers cost up to $200/month) sold at up to 97% discounts with 'guaranteed access' replacement if accounts are banned, plus hijacking company cloud servers to run models on the victim's compute, including a Chinese espionage group. Cheap stolen AI gives attackers an edge because defenders pay full price, and usage spikes hide in the noise while firms are still sizing their compute needs.", "angle": "Compute scarcity turns stolen inference into a currency. Security becomes a fixed line item in every AI budget.", "tweetA": "Frontier model access at 97% off with a replacement guarantee if the lab bans it. Someone built customer service for crime. Inference is now a black-market commodity like cloud credits were for cryptojackers.", "tweetB": "When GPUs and memory are scarce, stolen compute is worth more, and a usage spike looks like normal AI adoption. The best place to hide right now is inside a growth curve.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-shall-we-play-a-game-frontier", "id": 14}, {"cat": "geopolitics", "urgency": "deep", "source": "Michael Parekh / AI-RTZ #1225 (WaPo via Geneva talks)", "title": "US and Russia strip human-review-of-targets clause from UN autonomous weapons text", "idea": "On the last day of Geneva talks, over ~15 hours, US and Russian diplomats (about ten lawyers each) removed language requiring AI weapons to be predictable and reliable, an ethics clause, and a requirement for human review of AI-generated targets. Per the Post, the US military used Anthropic's chatbot to identify nearly 1,000 targets in the first 24 hours of the Iran war, and the Pentagon's rewrite of its 2023 autonomy directive, ordered within 90 days in June, still hasn't appeared. Nations reconvene in November to decide on a formal mandate.", "angle": "Defense AI spend and AI-enabled targeting is a policy-free zone for now, which supports defense-tech names and raises the tail risk of escalation errors.", "tweetA": "The two largest arsenals spent 15 hours deleting 'humans must review targets' from a treaty draft. Meanwhile ~1,000 targets in 24 hours were AI-identified. The market for defense autonomy has no speed limit. $PLTR $AVAV", "tweetB": "Anthropic was blacklisted by the Pentagon for refusing autonomous-weapon use and its model was reportedly still used in the war. The most consequential AI policy is being written by procurement, not legislators.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-shall-we-play-a-game-frontier", "id": 15}, {"cat": "geopolitics", "urgency": "watch", "source": "Michael Parekh / AI-RTZ #1225", "title": "China's MSS chief names Claude and OpenAI as espionage tools; Anthropic reports misuse in two dozen countries", "idea": "China's Ministry of State Security head this month named Claude and OpenAI models as tools for espionage and attacks on infrastructure, while Anthropic's latest quarterly misuse report found threat actors trying to use Claude in more than two dozen countries including the US, UK and Yemen. In August cyber leaders warned of a months-not-years window to prepare for AI-enabled attacks, with hospitals high on the list.", "angle": "Mirror-image security dilemma: each side treats the other's AI as the threat, justifying state-level compute and cyber budgets.", "tweetA": "Beijing's spy chief publicly calls US models an espionage weapon while Chinese groups are reported running models on hijacked US servers. Both sides are correct about each other. Cybersecurity is the durable AI budget line. $CRWD $PANW", "tweetB": "Security dilemma in one line: the same model that finds a vulnerability to patch finds one to exploit. Defense has to buy AI because offense already has it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-shall-we-play-a-game-frontier", "id": 16}, {"cat": "AI/infra", "urgency": "deep", "source": "McKinsey / Only McKinsey Perspectives", "title": "Power requests from data centers in some US regions exceed 10x the industry's estimate of current data-center use ('ghost demand')", "idea": "Per Reuters cited by McKinsey, power requests in some US regions are more than ten times estimated current data-center power use, but part of the projected demand fell away once utilities introduced deposits and commitment tests. McKinsey/MGI cite ~$7T of global data-center investment needed through 2030 and argue power/grid constraints will be followed by applications, skills and workflow bottlenecks. Regulators are tightening disclosure and permitting.", "angle": "Utility interconnection queues are inflated by speculative requests; deposits are the market's first credibility filter on AI capex. Separate real load growth from phantom.", "tweetA": "Requests 10x actual usage, then demand evaporates when utilities ask for a deposit. Half the AI power story is a queue-stuffing story. Underwrite the contracted megawatts, not the requests. $VST $CEG", "tweetB": "$7T of data-center build by 2030 assumes AI demand fills it. McKinsey's own point is the bottleneck moves from power to workflows. Capex follows the bottleneck, and the next one isn't electrical.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://email.mckinsey.com/mgi/our-research/the-ai-economy-interconnected-forces-feedback-loops-and-speeds-of-change", "id": 17}, {"cat": "geopolitics", "urgency": "watch", "source": "McKinsey / Only McKinsey Perspectives", "title": "US reshoring of vulnerable imports would need domestic manufacturing capacity to double on average", "idea": "McKinsey Global Institute says replacing vulnerable trade dependencies with domestic production would require roughly doubling capacity on average; diversified sourcing, innovation, AI and robotics could also build resilience. Separately, US factory activity expanded in August but lost momentum as employment, backlogs and imports declined.", "angle": "Reshoring is a multi-year capex and labor story, not a tariff-week story; robotics and automation vendors are the marginal beneficiaries.", "tweetA": "Reshoring the vulnerable imports means doubling US capacity on average. There aren't enough electricians, machinists or transformers for that. Tariffs set the price, labor sets the pace.", "tweetB": "Manufacturing PMI expanding while employment and backlogs decline is the automation signal. The factory comes back, the jobs don't. $ROK $TER", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://email.mckinsey.com/mgi/our-research/made-in-america-again-rethinking-us-manufacturing-resilience", "id": 18}, {"cat": "crypto", "urgency": "watch", "source": "Castle Labs (Substack Notes)", "title": "Bitget confirms $351.6M breach of hot/warm wallets: largest crypto hack of 2026", "idea": "Castle Labs note (5 days old) says Bitget confirmed a $351.6M breach affecting parts of its hot and warm wallet infrastructure. That would be the largest crypto hack of 2026, the fifth-largest CEX hack ever, and roughly 76% of Bitget's reported $464M+ Protection Fund.", "angle": "Exchange-solvency and custody tail risk in a 'market is pumping' tape. Watch BGB and withdrawal flows, and compare to how Bybit was absorbed.", "tweetA": "$351M out of Bitget equals 76% of its own insurance fund. Proof of reserves is a snapshot, the protection fund is the real solvency test. The market is pumping and custody risk is unpriced. $BTC $ETH", "tweetB": "Fifth-largest CEX hack ever, and I bet the median trader hasn't noticed. That's the state of crypto risk memory in a rally.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://substack.com/@castlelabs/note/c-345171619", "id": 19}];

}
function toggle(id){document.getElementById('c'+id).classList.toggle('open');}
function setC(c){fc=c;fu0();}function setU(u){fu=u;fu0();}
function fu0(){fs=null;render();}
function filterBySrc(name){fs=name;fc="all";fu="all";render(true);window.scrollTo(0,0);}
function vis(it){return (fc==="all"||it.cat===fc)&&(fu==="all"||it.urgency===fu)&&(!fs||it.source.indexOf(fs)!==-1);}
function render(expand){
  var h="";
  ITEMS.forEach(function(it){
    if(!vis(it))return;var col=COL[it.cat]||"#888";
    h+='<div class="card'+(expand?' open':'')+'" id="c'+it.id+'" style="border-left-color:'+col+'"><div class="hd" onclick="toggle('+it.id+')"><span class="num">'+it.id+'</span><span>'+UE[it.urgency]+'</span><span class="src" style="background:'+col+'">'+esc(it.source)+'</span><span class="tag">'+it.cat+'</span>'+(it.charts.count?'<span>'+(it.charts.hot?'🔥':'📊')+'</span>':'')+'<span class="ttl">'+esc(it.title)+'</span></div><div class="body">';
    h+='<div class="lbl">The Idea</div><div>'+esc(it.idea)+'</div>';
    h+='<div class="lbl">My Angle</div><div class="angle" style="border-color:'+col+';background:'+col+'14">'+esc(it.angle)+'</div>';
    h+='<div class="tw"><div><div class="lbl" style="color:#378add">Tweet A</div>'+esc(it.tweetA)+'<br><button class="copy-btn" onclick="copyTweet(' + it.id + ',\'a\')">📋 Copy</button></div>';
    h+='<div><div class="lbl" style="color:#7f77dd">Tweet B</div>'+esc(it.tweetB)+'<br><button class="copy-btn" onclick="copyTweet(' + it.id + ',\'b\')">📋 Copy</button></div></div>';
    if(it.charts.desc||it.charts.count)h+='<div class="chart'+(it.charts.hot?' hot':'')+'">'+(it.charts.hot?'🔥 CHART WORTH SAVING · ':'📊 ')+it.charts.count+' chart(s) — '+esc(it.charts.desc||'')+'</div>';
    h+='<div style="margin-top:10px"><a href="'+it.link+'" target="_blank">↗ Read full article</a></div></div></div>';
  });
  document.getElementById('list').innerHTML=h||'<p>No items.</p>';
  bars();
}
function pill(label,on,col,fn){return '<span class="pill" onclick="'+fn+'" style="'+(on?'background:'+col+';border-color:'+col+';color:#fff':'')+'">'+label+'</span>';}
function bars(){
  var cats={};ITEMS.forEach(function(i){cats[i.cat]=(cats[i.cat]||0)+1;});
  var h=pill('All ('+ITEMS.length+')',fc==="all",'#333',"setC('all')");
  Object.keys(cats).forEach(function(c){h+=pill(c+' ('+cats[c]+')',fc===c,COL[c]||'#888',"setC('"+c+"')");});
  document.getElementById('cats').innerHTML=h;
  var u={act:0,deep:0,watch:0};ITEMS.forEach(function(i){u[i.urgency]++;});
  document.getElementById('urg').innerHTML=pill('All',fu==="all",'#333',"setU('all')")+pill('🔴 Act Now ('+u.act+')',fu==="act",'#e24b4a',"setU('act')")+pill('🔵 Deep ('+u.deep+')',fu==="deep",'#378add',"setU('deep')")+pill('🟡 Watch ('+u.watch+')',fu==="watch",'#d4a017',"setU('watch')");
}
function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';
  var r='<p><b>Window:</b> '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.<br>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</p><p><b>Included sources</b> (click to filter):<br>';
  var seen={};ITEMS.forEach(function(it){var n=it.source.split(' / ')[0];if(!seen[n]){seen[n]=1;var c=ITEMS.filter(function(x){return x.source.indexOf(n)!==-1;}).length;r+='<span class="rs" data-n="'+esc(n)+'">'+esc(n)+' ('+c+')</span>';}});
  r+='</p><p><b>Skipped:</b></p><ul>'+META.skippedSources.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul>';
  document.getElementById('repb').innerHTML=r;
  Array.prototype.forEach.call(document.querySelectorAll('.rs'),function(e){e.onclick=function(){filterBySrc(e.getAttribute('data-n'));};});
  render();
}
init();
</script></body></html>
