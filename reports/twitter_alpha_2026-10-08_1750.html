<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-10-08T17:24:00Z", "input_stats": {"total_tweets": 235, "unique_authors": 76, "tweets_with_images": 61, "after_noise_filter": 90}, "summary": "**AI vs cryptography:** The day's dominant theme is a scare that AI math progress (OpenAI's math release, claimed Millennium-problem advances) could break public-key cryptography. **nic_carter** and **nicbstme** (citing Zerocash co-creator Matthew Green) say a classical or quantum break is plausible and chains must become crypto-agile; **hosseeb** proposes a chain-level 'recovery mode'; **mert**, **alpha_pls**, **lopp** and **udiWertheimer** call it a scripted FUD wave. BTC sits near **$82K** with BTC ETFs at **-$485M**.\n\n**Iran/Oil:** Trump says the US won't attack Iran before the **Nov 3** midterms; **JavierBlas** offers three readings (talks, distraction, jawboning) while **_tolks** notes reports of large strikes after the midterms keep a floor under oil. Spot oil is still **above $120** (BobEUnlimited) and Gulf–Far East freight tops **$1.4M/day**.\n\n**Rates:** The 30Y hit a **24-year high** (rektmando digest); **Fullcarry** saw 5s dumped for the long end (5s30s **7bp** flatter) into a well-received auction, and **Waller** flagged more hikes. CPI is next week; **biancoresearch** keeps pushing bonds.\n\n**AI trade:** FT says OpenAI's annualized revenue is ~**$50B**, **$20B below** signalled levels, and OpenAI perps fell. **BobEUnlimited** notes the $70B claims were unsourced. Counterweight: TSMC revenue **+51% y/y** (**munster_gene**). AI-related stocks are now **~49–51%** of the S&P (biancoresearch, JPM basket).\n\n**Equities/Crypto positioning:** Russell sits at its 200DMA, AAII bulls outnumber bears for the first time since 9/2, and **cointradernik** has long Russell and sees a bear-trap setup in BTC around **80–83K**. **Citrini's** first crypto basket was 'insta-faded' (goodalexander); **_tolks** treats it as a counter-signal.\n\n**Notable:** **jvisserlabs** lays out a 10-part Stripe 'Bankpocalypse' thesis (net revenue +41%, billing +71%) that AI doesn't have to fail for legacy financials to reprice. Coinbase's Singapore trading contest peaked near **250K** viewers; **intern** won $150K.", "sections": {"A_events": [{"cluster": "AI vs Cryptography — Is Public-Key Crypto Breakable?", "category": ["crypto", "AI"], "description": "Trigger: OpenAI's math release and claims that LLMs are making progress on Millennium Prize problems (quoted by garrytan); Matthew Green (Zerocash co-creator) reportedly said 'I think we might lose public key cryptography'.", "items": [{"author": "nic_carter", "summary": "Defends the alarm against a survey that downplayed the risk: it predates the claimed Navier-Stokes solution, OpenAI's dump of ~100 solved math problems, oratomic's published result sharply cutting the qubits needed to break ECDLP, a Google quantum paper, a new US government quantum-preparedness deadline and new deadlines from Google, Microsoft and Cloudflare. Across the thread with the others: 'years of math progress just happened in a couple weeks' and a classical break of the elliptic-curve hidden-period problem 'is not out of the question', even before quantum. Argues a smart attacker would drain an exchange cold wallet and pass it off as a phishing hack, so ROI exists. Internet traffic is already mostly post-quantum, digital assets are not.", "tweet_url": "https://x.com/nic_carter/status/2108231655164940795", "images": [], "type": "tweet", "created_at": "2026-10-08T16:22:50.000Z", "tweet_urls": ["https://x.com/nic_carter/status/2108231655164940795", "https://x.com/nic_carter/status/2108177058656559525", "https://x.com/nic_carter/status/2108162106092618155", "https://x.com/nic_carter/status/2108167038854152650", "https://x.com/nic_carter/status/2108165029526639073", "https://x.com/nic_carter/status/2108232068568399882", "https://x.com/nic_carter/status/2108232265377497530", "https://x.com/nic_carter/status/2108177940991340889"]}, {"author": "nic_carter", "summary": "Framing: 'Cryptography is not over. The internet is not over. Blockchains are not over. We're just entering the danger zone.' Major public-key implementations will fall, 'quantumly or classically, maybe soon'; blockchains must be rebuilt around crypto-agility instead of assuming functions last decades, and he is politely asking Bitcoin developers to adopt that posture.", "tweet_url": "https://x.com/nic_carter/status/2108179032294494275", "images": [], "type": "thread", "created_at": "2026-10-08T12:53:44.000Z"}, {"author": "nicbstme", "summary": "Calls it 'inevitable': if AI keeps improving at math it could find a shortcut for factoring, a new attack on elliptic curves, or a way around encryption's assumptions, and every major lab will race for it for commercial and national-security reasons. Notes Matthew Green is a Johns Hopkins cryptographer and Zerocash co-creator, so the warning carries weight. Separately argues AI-superhuman math/physics will accelerate error-corrected quantum computing, so people who bet careers on quantum 'will look very smart'.", "tweet_url": "https://x.com/nicbstme/status/2108173057810403787", "images": [], "type": "tweet", "created_at": "2026-10-08T12:29:59.000Z", "tweet_urls": ["https://x.com/nicbstme/status/2108173057810403787", "https://x.com/nicbstme/status/2108175102344855705", "https://x.com/nicbstme/status/2108179320325750910"]}, {"author": "hosseeb", "summary": "Argues that hiding coins in a bunker won't save a blockchain given AI risk to fundamental cryptography; proposes every chain implement a 'cryptographic recovery mode' (details in linked post).", "tweet_url": "https://x.com/hosseeb/status/2108234053023645777", "images": [], "type": "tweet", "created_at": "2026-10-08T16:32:21.000Z"}, {"author": "0xQuit", "summary": "Technical clarification in replies: an address is revealed on-chain (and derived from the public key), but the full public key isn't exposed until you transact or sign a message — relevant to which coins are exposed to a key-recovery attack.", "tweet_url": "https://x.com/0xQuit/status/2108072098585526761", "images": [], "type": "thread", "created_at": "2026-10-08T05:48:49.000Z"}, {"author": "mert", "summary": "Pushes back hard on a Zcash-doomsday post: it assumes several giant cryptographic advances overnight, attackers targeting only ZEC with unbounded compute, and core devs doing nothing; says the scenario is 'highly hypothetical but entirely soluble' and nobody would fix it faster than Zcash. Challenges the OP to name the specific cryptographic principles used.", "tweet_url": "https://x.com/mert/status/2108233251575963665", "images": [], "type": "thread", "created_at": "2026-10-08T16:29:10.000Z"}, {"author": "Evan_ss6", "summary": "Jabs at the counter-argument 'if that happened the whole world would break, not just coins' as a particularly terrible case for holding coins (reply to @mert).", "tweet_url": "https://x.com/Evan_ss6/status/2108207346367570150", "images": [], "type": "thread", "created_at": "2026-10-08T14:46:14.000Z"}, {"author": "Melt_Dem", "summary": "Not endorsing rotating assets, but says watching the frontier closely matters for anyone who self-custodies or holds any crypto; even a doomerish headline is net positive if it makes the industry take this tail risk seriously.", "tweet_url": "https://x.com/Melt_Dem/status/2108184919587619286", "images": [], "type": "thread", "created_at": "2026-10-08T13:17:07.000Z"}]}, {"cluster": "Crypto Reaction to the Crypto-Break Scare — FUD Scripts, Bunker Mode, Dip-Buyers", "category": ["crypto", "positioning"], "description": "Market and social response. Per rektmando's digest: Drake urged crypto 'bunker mode' on the AI threat and Vitalik backed the call to protect funds; BTC ~$82.3K (-1%), BTC ETFs -$485M, ETH ETFs -$161M.", "items": [{"author": "alpha_pls", "summary": "Lays out the FUD script: it lands when coins already wanted to roll over, so the chart gets blamed; the most potent FUD is unverifiable (no one can prove or rule out AI breaking elliptic curves); worst-case engagement farming follows, sensible takes arrive over days, price ends where it was going and only the high-blasters capitulate. Counter: the same maths secures banking, messaging and HTTPS, and if a break were imminent the best-informed would be in emergency mode — they aren't. Risk not zero, but the reaction follows a script.", "tweet_url": "https://x.com/alpha_pls/status/2108190396421468239", "images": [], "type": "tweet", "created_at": "2026-10-08T13:38:53.000Z"}, {"author": "udiWertheimer", "summary": "Calls the campaign a 'funded, rehearsed, self-interested attempt to cause maximum panic' (aimed at 'justin' — apparently Justin Drake) and says the real bearish signal is crypto's lack of optimists vs AI. Practical advice: use trustworthy custodians or active-management services for self-custody and let experts be the line of defence until things clear; 'becoming a UTXO expert ain't it'. Concedes he isn't denying the core point.", "tweet_url": "https://x.com/udiWertheimer/status/2108166586401964213", "images": [], "type": "thread", "created_at": "2026-10-08T12:04:16.000Z"}, {"author": "lopp", "summary": "Quote-replies to a 'just don't hold crypto' post: holding Bitcoin long-term isn't easy, which is why success pays well. Also: narratives for moon or crash always change and have always been wrong; many 'buttcoiners' are ex-Bitcoiners who talked themselves into doom — 'if Bitcoin is antifragile it will rise to meet any threat'; and attacks are growing across the tech stack and social-engineering stack.", "tweet_url": "https://x.com/lopp/status/2108223297616068642", "images": [], "type": "tweet", "created_at": "2026-10-08T15:49:37.000Z", "tweet_urls": ["https://x.com/lopp/status/2108223297616068642", "https://x.com/lopp/status/2108205906001305761", "https://x.com/lopp/status/2108186962586960269", "https://x.com/lopp/status/2108223722599616614"]}, {"author": "DCinvestor", "summary": "'Feels like everyone is overreacting and is panicked — bullish.'", "tweet_url": "https://x.com/DCinvestor/status/2108107113562353809", "images": [], "type": "tweet", "created_at": "2026-10-08T08:07:57.000Z"}, {"author": "thedefivillain", "summary": "Mocks the panic: 'cryptography is broken, does it mean my artificial inu memecoin tokens go to zero?'", "tweet_url": "https://x.com/thedefivillain/status/2108159546938085421", "images": [], "type": "tweet", "created_at": "2026-10-08T11:36:18.000Z"}, {"author": "punk6529", "summary": "Joking reply to a post saying nobody can break cryptography and labs/governments wouldn't expose a 'nuclear weapon' for a small hack: 'What if Dario is just running a long misdirection to steal our JPGs?'", "tweet_url": "https://x.com/punk6529/status/2108235355795189903", "images": [], "type": "tweet", "created_at": "2026-10-08T16:37:32.000Z"}, {"author": "santiagoroel", "summary": "Recorded a podcast 'on a good day for it' given concerns on public-key hardness, with a primer link.", "tweet_url": "https://x.com/santiagoroel/status/2108128802971017507", "images": [], "type": "thread", "created_at": "2026-10-08T09:34:08.000Z"}, {"author": "marcvanderchijs", "summary": "One-liner: 'AI agents will hack the banks, good luck going after them.'", "tweet_url": "https://x.com/marcvanderchijs/status/2108105789374357663", "images": [], "type": "tweet", "created_at": "2026-10-08T08:02:41.000Z"}]}, {"cluster": "OpenAI Revenue Miss — ARR ~$50B vs ~$70B Signalled", "category": ["AI", "tech", "macro"], "description": "FT reported OpenAI annualized revenue about $20B below expectations; OpenAI perpetual futures slid on Liquid.", "items": [{"author": "Geiger_Capital", "summary": "Posts the headline: OpenAI annualized revenue near $50B, $20B less than previously signaled — 'it's over'. A second post links it to the rush of AI IPOs ('why they're all racing to IPO… the bubble may have just popped').", "tweet_url": "https:/  said the US will not attack Iran 'at any time prior' to the Nov 3 midterms. Yesterday afternoon's report (cited by _tolks) said large Iran strikes would follow after the midterms.", "items": [{"author": "JavierBlas", "summary": "Offers three readings: (a) talks are ongoing and Trump is reassuring Tehran, (b) a distraction before an attack, (c) fresh oil-market jawboning. In a reply he speculates the pledge would only make sense if US intelligence concluded Iran plans to strike just before the election, in which case the US would pre-empt.", "tweet_url": "https://x.com/JavierBlas/status/2108232108057772078", "images": ["https://pbs.twimg.com/media/HUHxYMLX0AADGpb.png"], "type": "thread", "created_at": "2026-10-08T16:24:38.000Z"}, {"author": "lord_fed", "summary": "Sarcastic repost of the pledge: 'that's kind of him'.", "tweet_url": "https://x.com/lord_fed/status/2108230808687247749", "images": [], "type": "tweet", "created_at": "2026-10-08T16:19:28.000Z"}, {"author": "MelMattison1", "summary": "Thesis that Trump is acting tough to keep donors from pulling back before the election, then 'will fold' after the midterms (link to a related post).", "tweet_url": "https://x.com/MelMattison1/status/2108239245437735315", "images": [], "type": "tweet", "created_at": "2026-10-08T16:52:59.000Z"}, {"author": "_tolks", "summary": "Asks how oil, diesel, yields and the dollar are supposed to fall after reports of re-engagement/large strikes after the midterms: there is a clear floor under the assets the market doesn't want higher, though that date can become 'sell the news'.", "tweet_url": "https://x.com/_tolks/status/2108175206866948219", "images": [], "type": "thread", "created_at": "2026-10-08T12:38:31.000Z", "tweet_urls": ["https://x.com/_tolks/status/2108175206866948219", "https://x.com/_tolks/status/2108187831390912597"]}, {"author": "BobEUnlimited", "summary": "Spot oil still above $120/bbl; crack spreads still near highs.", "tweet_url": "https://x.com/BobEUnlimited/status/2108184420368720340", "images": ["https://pbs.twimg.com/media/HUHGjrBWcAAZBuX.jpg"], "type": "tweet", "created_at": "2026-10-08T13:15:08.000Z", "tweet_urls": ["https://x.com/BobEUnlimited/status/2108184420368720340", "https://x.com/BobEUnlimited/status/2108214635841085640"]}, {"author": "JavierBlas", "summary": "Chart of the day: Persian Gulf–Far East oil freight now above $1.4M per day, forcing another y-axis update; other routes also up. Links his Sept Bloomberg Opinion column.", "tweet_url": "https://x.com/JavierBlas/status/2108236167317717241", "images": ["https://pbs.twimg.com/media/HUH1OhbXAAAPztD.png"], "type": "tweet", "created_at": "2026-10-08T16:40:46.000Z"}, {"author": "Geiger_Capital", "summary": "Tape summary: oil spiking, yields climbing, stocks falling, crypto melting.", "tweet_url": "https://x.com/Geiger_Capital/status/2108181584473887044", "images": ["https://pbs.twimg.com/media/HUHD-mHXAAAnju-.jpg"], "type": "tweet", "created_at": "2026-10-08T13:03:52.000Z"}]}, {"cluster": "UK Fuel-Price Transparency Plan (Burnham)", "category": ["energy", "macro"], "description": "UK PM Andy Burnham's response to rising fuel costs: drivers can see forecourt prices on Google Maps.", "items": [{"author": "JavierBlas", "summary": "Hopes online price disclosure works better than in Chile, where an AEA study found transparency facilitated price coordination — stations matched rivals' higher prices rather than undercutting.", "tweet_url": "https://x.com/JavierBlas/status/2108194344843047256", "images": [], "type": "thread", "created_at": "2026-10-08T13:54:34.000Z", "tweet_urls": ["https://x.com/JavierBlas/status/2108194344843047256", "https://x.com/JavierBlas/status/2108220615148847470"]}, {"author": "lord_fed", "summary": "Dismissive: the announcement reads like AI writing, anyone could already do this, and asks how much of the pump price is tax.", "tweet_url": "https://x.com/lord_fed/status/2108119754397327534", "images": [], "type": "thread", "created_at": "2026-10-08T08:58:11.000Z"}]}, {"cluster": "Treasuries — 30Y at Multi-Decade High, Curve Flattens Into Auctions", "category": ["macro"], "description": "Per rektmando's digest: 30Y yield hit a 24-year high, the 10Y auction drew strong demand, and most Fed officials expect another hike this year. CPI is due next week.", "items": [{"author": "Fullcarry", "summary": "Before the auction: concession was 'definitely enough' for a good 30Y auction; 5.7% 30s should find buyers. Later: aggressive dumping of 5s to buy the long end, 5s30s 7bp flatter since overnight highs; front end has a good carry profile that makes the long end look rich, and seems to be bottoming — but CPI next week can upend it. Also 'duration dump is coming from inside the House'.", "tweet_url": "https://x.com/Fullcarry/status/2108167529822581217", "images": [], "type": "thread", "created_at": "2026-10-08T12:08:01.000Z", "tweet_urls": ["https://x.com/Fullcarry/status/2108167529822581217", "https://x.com/Fullcarry/status/2108207349768872443", "https://x.com/Fullcarry/status/2108239587080282542"]}, {"author": "qthomp", "summary": "Quotes Waller anticipating additional hikes with some flexibility on timing (not necessarily consecutive meetings) and quips that Bessent and Warsh are sending out the 'plunge protection team' again.", "tweet_url": "https://x.com/qthomp/status/2108202492769054740", "images": ["https://pbs.twimg.com/tweet_video_thumb/HUHW_PyWYAA9_SQ.jpg"], "type": "tweet", "created_at": "2026-10-08T14:26:57.000Z"}, {"author": "elerianm", "summary": "Flags an FT piece on the growing risks of repeated US interventions to sway market pricing.", "tweet_url": "https://x.com/elerianm/status/2108223221774651768", "images": ["https://pbs.twimg.com/media/HUHp1zEaAAAK4ps.jpg"], "type": "tweet", "created_at": "2026-10-08T15:49:19.000Z"}, {"author": "AndreasSteno", "summary": "Quote-posts a chart of crowd-out: 'Don't tell me interest rates aren't restrictive already.'", "tweet_url": "https://x.com/AndreasSteno/status/2108188726010749337", "images": [], "type": "tweet", "created_at": "2026-10-08T13:32:15.000Z"}, {"author": "_tolks", "summary": "'The funniest and most painful outcome imaginable is yields and stocks both topping at the same time.'", "tweet_url": "https://x.com/_tolks/status/2108245061922071024", "images": [], "type": "tweet", "created_at": "2026-10-08T17:16:06.000Z"}, {"author": "biancoresearch", "summary": "Pushes the bond case: yields were below where the economy said they should be for years; no longer. Cites a cover image he shared as the signal.", "tweet_url": "https://x.com/biancoresearch/status/2108224136585871690", "images": ["https://pbs.twimg.com/media/HUHqUfyWIAAJ6GB.png"], "type": "tweet", "created_at": "2026-10-08T15:52:57.000Z"}]}, {"cluster": "AI Concentration — AI Names ~49–55% of the S&P", "category": ["AI", "macro", "tech"], "description": "Context: JPM basket of 41 AI-related stocks is 49% of the S&P 500 and about two-thirds of its YTD market-cap change.", "items": [{"author": "biancoresearch", "summary": "If SpaceX (SPCX) were in the S&P, AI-related stocks would be 51% of the index; adding Anthropic and OpenAI in 2027 takes it to ~55%. The last time one theme exceeded 50% was railroads in the 19th century — it took 30 years and created the Gilded Age. In replies he defends counting Google/Microsoft/Meta despite non-AI businesses.", "tweet_url": "https://x.com/biancoresearch/status/2108168186315047185", "images": ["https://pbs.twimg.com/media/HUHIGrQWUAAkFag.png"], "type": "thread", "created_at": "2026-10-08T12:10:38.000Z"}, {"author": "michaelbatnick", "summary": "The top 5 S&P stocks equal the bottom 434 by market cap (vs bottom 282 in July 2018), which is why many breadth indicators look extreme. By trailing net income the top 5 equal the bottom 436, so less insane 'maybe'.", "tweet_url": "https://x.com/michaelbatnick/status/2108232094258512061", "images": ["https://pbs.twimg.com/media/HUHxb4GWwAAgnKl.jpg", "https://pbs.twimg.com/media/HUHyGeLWQAAuifd.jpg"], "type": "thread", "created_at": "2026-10-08T16:24:34.000Z"}, {"author": "abcampbell", "summary": "Quotes a report that Ray Dalio calls AI a 'classic bubble' nearing a bursting point due to rising rates and the need to turn wealth into cash, quipping that equity folks should watch out given Dalio's bond commentary.", "tweet_url": "https://x.com/abcampbell/status/2108208326156648915", "images": [], "type": "tweet", "created_at": "2026-10-08T14:50:08.000Z"}, {"author": "jimcramer", "summary": "Frames oil and rates as 'convenient excuses' to say data-center spend is peaking and sell semis; also asks whether Nvidia can shrug off 'alleged disappointments' (Samsung, TSMC, an Australian IPO).", "tweet_url": "https://x.com/jimcramer/status/2108117577092465099", "images": [], "type": "tweet", "created_at": "2026-10-08T08:49:31.000Z", "tweet_urls": ["https://x.com/jimcramer/status/2108117577092465099", "https://x.com/jimcramer/status/2108117208992039018", "https://x.com/jimcramer/status/2108207307729649775"]}]}, {"cluster": "Citrini's First Crypto Basket — Instantly Faded?", "category": ["crypto", "positioning"], "description": "Citrini published its first-ever crypto basket today ('Breaking the Wall').", "items": [{"author": "Geiger_Capital", "summary": "Mock-incredulous: 'You're bearish? Citrini just dropped their first ever crypto basket.' Links the Substack post.", "tweet_url": "https://x.com/Geiger_Capital/status/2108209075854954803", "images": ["https://pbs.twimg.com/media/HUHc-2HXYAEmw1F.jpg"], "type": "thread", "created_at": "2026-10-08T14:53:06.000Z"}, {"author": "goodalexander", "summary": "Four-line macro read: math acceleration keeps worsening crypto-security fears; rates spiralling plus an Iran oil shock make a Democratic sweep more likely (foreshadowing a reversal of regulatory protection); it's the 10/10 anniversary; and the Citrini 'low-cap hard shill basket' was 'insta-faded' (chart).", "tweet_url": "https://x.com/goodalexander/status/2108230297947115766", "images": ["https://pbs.twimg.com/media/HUHvawvaoAAEQ4R.png"], "type": "tweet", "created_at": "2026-10-08T16:17:26.000Z"}, {"author": "_tolks", "summary": "Says 'the most bullish thing imaginable' has hit the tape (apparently the Citrini basket) and, replying to others, that 'their backtesting hit rate for inverse/counter trades is unreal'; agrees a fakeout into a reversal blow-off 'makes a ton of sense'.", "tweet_url": "https://x.com/_tolks/status/2108187831390912597", "images": [], "type": "thread", "created_at": "2026-10-08T13:28:41.000Z"}, {"author": "sjdedic", "summary": "Quotes Citrini's note that Aerodrome (AERO) is the best higher-beta play on tokenized stocks: it does most equities volume on Base and merges with Velodrome on Oct 21 to launch on Robinhood Chain and Ethereum mainnet; Citrini thinks the expansion isn't priced in. 'Told you.'", "tweet_url": "https://x.com/sjdedic/status/2108204443233649049", "images": ["https://pbs.twimg.com/media/HUHYxGNWAAAvRpU.jpg"], "type": "tweet", "created_at": "2026-10-08T14:34:42.000Z"}]}, {"cluster": "Korean Bank Cyberattack Traced to One AI-Assisted Attacker", "category": ["AI", "geopolitics", "tech"], "description": "CrowdStrike report: last week's attack on South Korea's biggest banks may be the work of one person using an open-source AI pentest tool (ARTEX) with Chinese and other models.", "items": [{"author": "cryptopunk7213", "summary": "Describes a person in Guangdong with no coding skills who hacked Korea's biggest banks with Grok 4.7, Chinese open-source models and Claude Code; 'we have not yet fathomed the power the average person with an idea can wield' — and the defensive upside of the same tooling.", "tweet_url": "https://x.com/cryptopunk7213/status/2108193601591316901", "images": [], "type": "tweet", "created_at": "2026-10-08T13:51:37.000Z"}]}, {"cluster": "Bitget Hack Funds vs NEAR Intents", "category": ["crypto", "regulation"], "description": "Laura Shin shares excerpts of an interview with NEAR Intents GM Alex Shevchenko.", "items": [{"author": "laurashin", "summary": "Shevchenko says over $50M tied to the Bitget hack tried to pass through NEAR Intents but only about $166K (<0.5%) got through; ~$500K was frozen mid-execution pending a compliance-council decision and ~99% was kept outside the protocol. He wants zero but calls it strong evidence of the system's detection.", "tweet_url": "https://x.com/laurashin/status/2108243896199422398", "images": [], "type": "thread", "created_at": "2026-10-08T17:11:28.000Z"}, {"author": "laurashin", "summary": "Same interview: argues a system 'without boundaries' can't protect value and crypto without value can't become the economic backbone; ownership must be protected with consequences for theft.", "tweet_url": "https://x.com/laurashin/status/2108231191828832592", "images": [], "type": "thread", "created_at": "2026-10-08T16:20:59.000Z"}]}, {"cluster": "Risk-Off Session — Russell at 200DMA, Weak Breadth, Sentiment Turns Bullish", "category": ["macro", "positioning"], "description": "Equities sold on oil, rates and data-center-spend worries; Nasdaq -0.2% per rektmando's morning digest.", "items": [{"author": "Chartfest1", "summary": "Russell 2000 is at its 200-day; 'remember all that broadening-out talk in early August? Neither do they.' Also: last time Nasdaq had more new highs than new lows was 8/27; AAII bulls exceeded bears for the first time since 9/2.", "tweet_url": "https://x.com/Chartfest1/status/2108176413354594433", "images": [], "type": "tweet", "created_at": "2026-10-08T12:43:19.000Z", "tweet_urls": ["https://x.com/Chartfest1/status/2108176413354594433", "https://x.com/Chartfest1/status/2108183263885877436", "https://x.com/Chartfest1/status/2108146528741454109"]}, {"author": "jimcramer", "summary": "Morning read: a big oil gain plus worries about higher rates and data-center spend add up to a session seemingly 'destined to be ugly'; later calls it 'an inauspicious day'.", "tweet_url": "https://x.com/jimcramer/status/2108117208992039018", "images": [], "type": "tweet", "created_at": "2026-10-08T08:48:04.000Z", "tweet_urls": ["https://x.com/jimcramer/status/2108117208992039018", "https://x.com/jimcramer/status/2108134291708248465", "https://x.com/jimcramer/status/2108137251670540430"]}, {"author": "Geiger_Capital", "summary": "Suggests today is a good day to read an item on what history says about Q4 of a midterm year (second half specifically).", "tweet_url": "https://x.com/Geiger_Capital/status/2108194312840499255", "images": [], "type": "tweet", "created_at": "2026-10-08T13:54:27.000Z"}, {"author": "Geiger_Capital", "summary": "Brazil EWZ +13% today to a new six-year high; 2026 YTD EWZ +35% vs SPY +13% — 'they're calling it the Golden Age of LatAm'.", "tweet_url": "https://x.com/Geiger_Capital/status/2108229309374845132", "images": [], "type": "tweet", "created_at": "2026-10-08T16:13:31.000Z"}]}, {"cluster": "Coinbase Champions Trading Competition", "category": ["crypto", "society"], "description": "In-person trading contest streamed from Singapore during TOKEN2049; winner got $150K.", "items": [{"author": "arthur0x", "summary": "Notes 163K people watching a Coinbase-organised livestream (peak ~250K): 'trading is the new e-sport'. During the event reports @blknoiz06 leading with a leveraged ETH short and @intern with a leveraged BTC long.", "tweet_url": "https://x.com/arthur0x/status/2108187240182780047", "images": [], "type": "thread", "created_at": "2026-10-08T13:26:20.000Z", "tweet_urls": ["https://x.com/arthur0x/status/2108187240182780047", "https://x.com/arthur0x/status/2108192639929786538"]}, {"author": "brian_armstrong", "summary": "Announces @intern as the Coinbase Champion, taking home $150,000.", "tweet_url": "https://x.com/brian_armstrong/status/2108205416224338341", "images": [], "type": "tweet", "created_at": "2026-10-08T14:38:34.000Z"}]}], "B_insights": [{"author": "jvisserlabs", "summary": "Long thread (Stripe 'Bankpocalypse'): Stripe told investors it believes 'the singularity' began Jan 1, 2026 — its top AI companies grew revenue 120% in 2025 and 175% so far in 2026. H1-2026: net revenue +41%, FCF +43%, billing +71%, 100K+ active loans (+49%), Connect activations more than doubled, Link 300M+ users; 10+ products expected to each pass $100M net revenue. 2025 volume $1.9T (+34%); 88% of the Forbes AI 50 build on Stripe; revenue share from AI and crypto firms more than doubled. Atlas has incorporated 100K businesses (>25% of Delaware incorporations), and 20% of Atlas startups reached first payment within 30 days in 2025 vs 8% in 2020. Acquisitions (Metronome, OpenRouter announced, Bridge, Privy) build rails for machine payments, agentic checkout and stablecoins. Thesis: Stripe competes for the service layers around banking (payments, lending, treasury); AI-native competition compresses multiples of legacy, headcount-heavy businesses before earnings fall. 'The next banking crisis may not begin with credit losses… AI doesn't need to fail for the Legacy Bubble to burst. It only needs to succeed.' Full detail in his Sunday weekly video.", "tweet_url": "https://x.com/jvisserlabs/status/2108216658372207060", "images": ["https://pbs.twimg.com/media/HUHhGa_XUAAcpc4.jpg"], "type": "thread", "created_at": "2026-10-08T15:23:14.000Z"}, {"author": "RaoulGMI", "summary": "Presents his book framework ('The Everything Code', out Nov 3, pre-order push): GDP can only grow via population, productivity and debt; too few workers and too much debt leave debasement as the only way to carry debt, hence everything feels more expensive. AI and robots add workers that don't age and get cheaper, which changes the equation — but they move faster than society, politics or economics can adapt, creating an 'Economic Singularity' and a short window to position.", "tweet_url": "https://x.com/RaoulGMI/status/2108121578982555927", "images": [], "type": "thread", "created_at": "2026-10-08T09:05:26.000Z"}, {"author": "dgt10011", "summary": "Calls a 0-word essay. Also: a Superintelligence Force chaired by the DNI has 120 days to report on AI risk; hyperscaler AI capex doubling to ~$1T this year ($2T next year, $4T in 2028 if trend holds); memory chips already able to run the equivalent of 8B human workers in agents; Tesla's Optimus factory targets 10M robots/year.", "tweet_url": "https://x.com/PeterDiamandis/status/2108238873939554486", "images": [], "type": "thread", "created_at": "2026-10-08T16:51:31.000Z"}, {"author": "theallinpod", "summary": "Jason Calacanis on the White House Super Intelligence Summit: the next step is including the bottom half of the 'K-shaped recovery' — teachers, trades, plumbers — because ordinary Americans remain frightened of AI and job loss; wants the president to push companies to show AI lowering the cost of education, housing and healthcare, none of which was addressed.", "tweet_url": "https://x.com/theallinpod/status/2108200797867524321", "images": [], "type": "tweet", "created_at": "2026-10-08T14:20:13.000Z"}, {"author": "AnjneyMidha", "summary": "Disappointed in Microsoft's 'bad behaviour' — says they pay lip service to American innovation but actions don't match, calls for 'a leadership reset' with more to share soon. Reacts to VP Vance announcing suspension of the PERM green-card program for Microsoft pending an investigation. Separately backs Arena's $200M Series B at $3.1B and its new Alignment Index on measuring AI safety.", "tweet_url": "https://x.com/AnjneyMidha/status/2108240756825788826", "images": [], "type": "tweet", "created_at": "2026-10-08T16:59:00.000Z", "tweet_urls": ["https://x.com/AnjneyMidha/status/2108240756825788826", "https://x.com/AnjneyMidha/status/2108232992640389468"]}, {"author": "andrewchen", "summary": "Flags a company that went from $0 to $60M in three months and will hit a $100M run-rate this month, selling frontier data to AI labs — 'fastest growing company I've ever seen'; data is becoming a first-class input alongside compute and algorithms." // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
