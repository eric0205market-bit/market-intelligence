<script>
function chip(label, active, onclick, color){
  const b = document.createElement('button');
  b.className = 'pill' + (active ? ' active' : '');
  b.textContent = label;
  if(active && color){ b.style.background = color; }
  b.onclick = onclick;
  return b;
}

let catFilter = 'all';
let urgFilter = 'all';
let srcFilter = null;

function catCounts(){
  const m = {};
  ITEMS.forEach(i => m[i.cat] = (m[i.cat]||0)+1);
  return m;
}
function urgCounts(){
  const m = {act_now:0, deep:0, watch:0};
  ITEMS.forEach(i => m[i.urgency] = (m[i.urgency]||0)+1);
  return m;
}

function renderFilters(){
  const cc = catCounts();
  const cwrap = document.getElementById('catFilters');
  cwrap.innerHTML = '';
  cwrap.appendChild(chip('All (' + ITEMS.length + ')', catFilter==='all', () => { catFilter='all'; srcFilter=null; render(); }, '#444'));
  Object.keys(CATLABELS).forEach(key => {
    if(!cc[key]) return;
    cwrap.appendChild(chip(CATLABELS[key] + ' (' + cc[key] + ')', catFilter===key, () => { catFilter=key; srcFilter=null; render(); }, CATCOLORS[key]));
  });

  const uc = urgCounts();
  const uwrap = document.getElementById('urgFilters');
  uwrap.innerHTML = '';
  uwrap.appendChild(chip('All (' + ITEMS.length + ')', urgFilter==='all', () => { urgFilter='all'; srcFilter=null; render(); }, '#444'));
  ['act_now','deep','watch'].forEach(key => {
    if(!uc[key]) return;
    uwrap.appendChild(chip(URGLABELS[key] + ' (' + uc[key] + ')', urgFilter===key, () => { urgFilter=key; srcFilter=null; render(); }, '#444'));
  });
}

function cardHtml(item){
  const color = CATCOLORS[item.cat];
  const chartMark = item.charts.count > 0 ? (item.charts.hot ? '🔥' : '📊') : '';
  let html = '';
  html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
  html += '<span class="idx">#' + String(item.id).padStart(2,'0') + '</span>';
  html += '<span>' + URGEMOJI[item.urgency] + '</span>';
  html += '<span class="badge" style="background:' + color + '">' + item.source.split('(')[0].trim() + '</span>';
  html += '<span class="tag">' + CATLABELS[item.cat] + '</span>';
  if(chartMark) html += '<span class="chartmark">' + chartMark + '</span>';
  html += '<span class="title">' + item.title + '</span>';
  html += '</div>';

  html += '<div class="card-body">';
  html += '<div class="block-label">The Idea</div><div class="idea">' + item.idea + '</div>';
  html += '<div class="block-label">My Angle</div><div class="angle" style="border-color:' + color + ';background:' + color + '14;">' + item.angle + '</div>';
  html += '<div class="tweets">';
  html += '<div class="tweet"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  html += '<div class="tweet"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
  html += '</div>';
  if(item.charts.desc){
    html += '<div class="chart-box' + (item.charts.hot? '' : ' plain') + '">' + (item.charts.count>0 ? item.charts.count + ' chart(s) — ' : '') + item.charts.desc + '</div>';
  }
  html += '<div class="link-row"><a href="' + item.link + '" target="_blank" rel="noopener">↗ Read full article</a></div>';
  html += '</div>';
  return html;
}

let openCards = {};

function render(){
  renderFilters();
  const wrap = document.getElementById('cards');
  wrap.innerHTML = '';
  const filtered = ITEMS.filter(i => {
    if(catFilter !== 'all' && i.cat !== catFilter) return false;
    if(urgFilter !== 'all' && i.urgency !== urgFilter) return false;
    if(srcFilter && i.source.indexOf(srcFilter) === -1) return false;
    return true;
  });
  filtered.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card' + (openCards[item.id] ? ' open' : '');
    card.id = 'card-' + item.id;
    card.innerHTML = cardHtml(item);
    wrap.appendChild(card);
  });
  document.getElementById('metaLine').textContent =
    META.date + ' · ' + META.time + ' · ' + filtered.length + ' of ' + ITEMS.length + ' items';
}

function toggleCard(id){
  openCards[id] = !openCards[id];
  const card = document.getElementById('card-' + id);
  if(card) card.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function filterBySrc(name){
  srcFilter = name;
  catFilter = 'all';
  urgFilter = 'all';
  render();
  ITEMS.forEach(i => { if(i.source.indexOf(name) !== -1) openCards[i.id] = true; });
  render();
  document.getElementById('cards').scrollIntoView({behavior:'smooth'});
}

function renderReport(){
  let html = '';
  html += '<p><b>Time window:</b> ' + META.windowStart + ' to ' + META.windowEnd + ' — emails outside this window were not processed.</p>';
  html += '<p><b>Emails in window:</b> ' + META.emailsInWindow + ' &nbsp;·&nbsp; <b>Emails read:</b> ' + META.emailsRead + ' &nbsp;·&nbsp; <b>Items extracted:</b> ' + META.itemsExtracted + '</p>';
  html += '<p><b>Included sources:</b></p><ul>';
  META.includedSources.forEach(s => {
    html += '<li><span class="src-link" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span> — ' + s.count + ' item(s)</li>';
  });
  html += '</ul>';
  html += '<p><b>Skipped sources:</b></p><ul>';
  if (META.skippedSources.length === 0) {
    html += '<li>None — all emails within the 6-hour window were substantive and included.</li>';
  }
  META.skippedSources.forEach(s => {
    html += '<li>' + s.name + ' — ' + s.reason + '</li>';
  });
  html += '</ul>';
  document.getElementById('reportBody').innerHTML = html;
}

render();
renderReport();
</script>
