<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DATA POINT TAGS */
.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>

<script>
const REPORT_DATA = {"report_type": "TWITTER BANK RESEARCH", "freshness_gate": "FRESHNESS GATE PASSED.", "collected_at": "2026-10-26T18:24:01Z", "window_days": 4, "input_stats": {"total_tweets": 120, "considered": 120, "kept": 36, "dropped": 84, "deduped": 0}, "summary": "Recurring themes: AI capex and AI-driven inflation (Goldman Hatzius, Morgan Stanley), falling risk appetite and hedge-fund/CTA derisking (Goldman, BofA, Deutsche), and earnings/valuation charts ahead of mega-cap reports and Wednesday FOMC.\nPer-bank counts: Goldman 20, BofA 7, Yardeni 4, Morgan Stanley 3, JPM 2, Apollo/Slok 1, Barclays 1, Citadel 1, Citi 1, Deutsche 1.\n36 research items kept from 120 considered; no duplicates found.", "by_bank_counts": {"Goldman": 20, "BofA": 7, "Yardeni": 4, "Morgan Stanley": 3, "JPM": 2, "Apollo/Slok": 1, "Barclays": 1, "Citadel": 1, "Citi": 1, "Deutsche": 1}, "banks": [{"bank": "Goldman", "theme": "Goldman — Hatzius on AI capex and AI-linked core PCE, risk appetite, positioning, valuations and EPS charts", "items": [{"author": "MikeZaccardi", "text": "GS: AI-related inflation pushing US core PCE up 0.5pt... most of any region\n\n'Higher Memory Prices Are Starting to Spill into Consumer Electronics More Broadly' https://t.co/ofvqySxo1G", "tweet_url": "https://x.com/MikeZaccardi/status/2114752694602617257", "images": ["https://pbs.twimg.com/media/HVkcXpzXQAA6Xqs.png"], "created_at": "2026-10-26T16:15:07.000Z", "relayers": []}, {"author": "neilsethinew", "text": "As this post was very popular this weekend, thought I would give more detail from the Week Ahead (it's in there each week):\n\nGoldman’s Risk Appetite Indicator* fell for a fourth week now down to -0.5, the least since April 2025, from 0.8 four weeks ago. The momentum index fell to -0.9, also the least since April 2025.\n\nThis week’s decline was led by drops in equities and credit.\n\n*\"Goldman Sachs Risk Appetite Indicator (RAI) aims to track the level of global market risk appetite and risk aversion based on various market variables. A sharp rise in the index can send a warning signal that investors have more risk appetite and are potentially exposed to a correction if consensus views are tested. Similarly, a sharp decline indicates a reduction in risk appetite, and at extreme levels it can indicate that markets may have overshot. RAI signals are most powerful when the level of risk appetite is very low below -1.5, with levels closer to -2.0 giving the clearest signal over longer time horizons, as at such levels the asymmetry of subsequent medium term equity return becomes very positively skewed. RAI momentum is designed to track short term shifts of market risk appetite, and subcomponents of the RAI.”\n\nhttps://t.co/JtkVfJS6l3", "tweet_url": "https://x.com/neilsethinew/status/2114711144283996424", "images": ["https://pbs.twimg.com/media/HVj1IEEWwAArGMm.png"], "created_at": "2026-10-26T13:30:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "That didn’t take long. When Meta Platforms ($META) unveiled its new non-voting Class C shares alongside earnings last week, I noted that its filing showed management’s long-range plan needing to raise “hundreds of billions of dollars” beginning as early as this fall. The filing also said the company “expects to conduct offerings of Class C common stock from time to time.”\n\nOn Monday it got started. Meta is seeking to raise as much as $95 billion by selling common and preferred stock, per Bloomberg. About $35 billion is being offered now, roughly $22.5 billion in Class A common and the rest in mandatory convertible preferred. The remaining roughly $60 billion will come through an at-the-market program in the new Class C shares, which the Financial Times says is expected to begin in the first quarter of 2027. \n\nNvidia ($NVDA), Advanced Micro Devices ($AMD) and Broadcom ($AVGO), all Meta chip suppliers, have agreed to buy up to $5 billion of the common as cornerstone investors. Morgan Stanley and Goldman Sachs are leading the deal.\n\nIf fully executed, Meta’s raise would top Alphabet’s $90 billion June offering, which lead bookrunner JPMorgan called the “largest multi-tranche equity transaction in history,” per the FT. At about $654 a share, the full $95 billion is roughly 5.7% of Meta’s market value.\n\nThe timing fits what Meta’s special committee flagged in the filing: it wanted to front-run potential equity offerings from Alphabet ($GOOGL), SpaceX ($SPCX), Anthropic and OpenAI. Alphabet has raised once already, SpaceX completed the biggest-ever IPO in June, and Anthropic is expected to list before year-end, per the FT.\n\nOne wrinkle: because the Class C shares won’t exist until January, this first tranche is voting Class A stock. According to Claude, the $22.5 billion of Class A trims CEO Mark Zuckerberg’s voting control voting control only modestly, to about 60.2% from 60.6%, before any conversion of the preferred. The $60 billion ATM goes into the non-voting shares, so it won’t dilute his control at all.\n\nIt appears this was priced in by the market with Meta shares little changed as of 8:30am ET.\n\nhttps://t.co/9E4ZTAtYEK\n\nhttps://t.co/GIWcOuF8DV\n\nhttps://t.co/iClOcRAb5j", "tweet_url": "https://x.com/neilsethinew/status/2114698067794346240", "images": ["https://pbs.twimg.com/media/HVjqZUfWkAA33pJ.jpg"], "created_at": "2026-10-26T12:38:03.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Value in control vs growth GS https://t.co/G6XWsyynm1", "tweet_url": "https://x.com/MikeZaccardi/status/2114691262078984677", "images": ["https://pbs.twimg.com/media/HVjkfz3XQAAggDW.png"], "created_at": "2026-10-26T12:11:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Cyclicas vs Defensives keep rolling over https://t.co/6ohPNd7N2T", "tweet_url": "https://x.com/MikeZaccardi/status/2114688745760784671", "images": ["https://pbs.twimg.com/media/HVjiNVPW8AA9jg3.png"], "created_at": "2026-10-26T12:01:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BofA saw significant selling from the systematic community last week and sees CTAs now into a sell cycle.\n\n\"CTA equity positioning continues to narrow following another difficult week for technology shares. Price trends are projected to weaken across most equity markets next week. Higher realized volatility could also reduce position sizes where CTAs remain long. S&P 500 futures are now the only equity market in this report with consensus long positioning across model speeds and risk tolerances, but that exposure is increasingly at risk, with the first sell trigger only 0.5% below current levels.\"\n\nAs they noted, the sell trigger for the S&P 500 now sits just around −0.5% away (from ~−1.1% last week), and it’s now the only equity market in BofA’s report where CTAs are still long across all model speeds. \n\nThe Nasdaq-100’s sell trigger is even closer at ~−0.2% (from ~−0.9%). For the Russell 2000 they see the next sell trigger at ~−3.0% (from essentially at its trigger last week) along with a buy trigger at +2.4%.\n\nGlobally they see selling in all scenarios for the upcoming week:\n\n−$79B of selling in a “down” market (defined as the 2.5th percentile price path or ~−2.9%, different than Goldman who uses −4.5%; from −$81B last week), with CTAs selling ~$50B, vol control ~$20B and risk parity ~$9B\n\n−$48B of selling in a flat market (from −$10B last week) as selling from CTAs (~$38B) and vol control (~$17B) more than offsets ~$7B of buying from risk parity\n\n−$1B of selling in an “up” market (defined as the 97.5th percentile price path or ~+3.5%, similar to Goldman; from −$3B last week) as ~$21B of vol-control selling offsets buying from CTAs (~$14B) and risk parity (~$6B).", "tweet_url": "https://x.com/neilsethinew/status/2114688512268108257", "images": ["https://pbs.twimg.com/media/HVhhcB_WgAAFb68.jpg"], "created_at": "2026-10-26T12:00:04.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "The global P/E continues to contract GS\n\n$ACWI 16.1x NTM\n13.8x out 2 years https://t.co/be6q8bTmMb", "tweet_url": "https://x.com/MikeZaccardi/status/2114687487297585427", "images": ["https://pbs.twimg.com/media/HVjhEFeXMAAaKwt.png"], "created_at": "2026-10-26T11:56:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Our Risk Appetite Indicator fell sharply to -0.5, its lowest level since Liberation Day https://t.co/ccjupC3QQw", "tweet_url": "https://x.com/MikeZaccardi/status/2114686229056717099", "images": ["https://pbs.twimg.com/media/HVjf615XAAAv09B.png"], "created_at": "2026-10-26T11:51:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS Hatzius: While labor markets look solid overall, AI's impact is spreading beyond tech. \n\nIn US non-manufacturing firms, higher AI adoption now correlates with lower employment growth and higher unemployment. 📉🤖 https://t.co/ocCarqUiKw", "tweet_url": "https://x.com/MikeZaccardi/status/2114684341393424787", "images": ["https://pbs.twimg.com/media/HVjeM-rXYAAliZ1.png"], "created_at": "2026-10-26T11:43:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS Hatzius: AI hyperscaler investment growth set to peak in the coming weeks https://t.co/Wl27Gm0lMF", "tweet_url": "https://x.com/MikeZaccardi/status/2114682969801552073", "images": ["https://pbs.twimg.com/media/HVjc9I-XQAAd84A.png"], "created_at": "2026-10-26T11:38:03.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "No data today, but Durable Goods, Case-Shiller, Conference Board tomorrow ahead of Weds FOMC GS https://t.co/EaqHyiUpkJ", "tweet_url": "https://x.com/MikeZaccardi/status/2114682454334205987", "images": ["https://pbs.twimg.com/media/HVjcfH0W8AAdpdY.png"], "created_at": "2026-10-26T11:36:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS Hatzius: \"Global Growth Looks Remarkably Unremarkable\" https://t.co/dr4Y2SnMXL", "tweet_url": "https://x.com/MikeZaccardi/status/2114681824735633671", "images": ["https://pbs.twimg.com/media/HVjb6fmWoAA789L.png"], "created_at": "2026-10-26T11:33:30.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: A sharp hedge fund derisking [last] week and an ongoing increase in equity supply underscore the importance of household demand for US equities. \n\nWhile very recent increases in retail trading activity and leveraged ETF flows have signaled an ongoing “buy the dip” mentality, retail trading volumes in US equities have declined by 20% since the summer and 45% since late 2025.", "tweet_url": "https://x.com/neilsethinew/status/2114678426108055633", "images": ["https://pbs.twimg.com/media/HVhe5S6XUAAStsV.png"], "created_at": "2026-10-26T11:20:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: We Expect the Impact of AI Demand on Year-over-Year Core PCE Inflation—Both the Genuine Effects and the Effects of Mismeasurement—to Peak at the End of 2026 and Decline Sharply in 2027 https://t.co/208G17waGT", "tweet_url": "https://x.com/MikeZaccardi/status/2114512073157648425", "images": ["https://pbs.twimg.com/media/HVhBhpfWIAAkRwE.png"], "created_at": "2026-10-26T00:18:58.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: We estimate that the effects of tariffs, the war, and just the mismeasured part of AI price pressures account for all of core PCE inflation’s current 1.1pp overshoot of the 2% target. https://t.co/dyK5NPBEJj", "tweet_url": "https://x.com/MikeZaccardi/status/2114511723734487326", "images": ["https://pbs.twimg.com/media/HVhBNOQWgAAzFjq.png"], "created_at": "2026-10-26T00:17:35.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: Our 2027 S&P 500 EPS forecast is similar to the current bottom-up consensus estimate, implying that the recent trend of large upward revisions to analyst estimates is likely behind us. \n\nThe distribution of potential earnings outcomes is wider in 2028, by which time we think the boost to growth from AI investment spending will have completely faded. \n\nOur base case is for another year // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
