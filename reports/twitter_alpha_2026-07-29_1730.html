<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-07-29T17:20:56Z", "input_stats": {"total_tweets": 187, "unique_authors": 68, "tweets_with_images": 47, "after_noise_filter": 95}, "summary": "**FOMC Day:** The Fed held rates. Hike odds sat far below the ~60% threshold that has preceded every prior hike since 1994, per **biancoresearch**, who also noted formal Fed forward guidance ended with Warsh. **EconguyRosie** and **ZeeContrarian1** argued hiking was never realistic given disinflating core services and Warsh's own dovish history; **lord_fed** floated that Trump's pre-market Iran comments were timed to soften markets ahead of the decision.\n\n**Iran/Hormuz:** **JavierBlas** showed oil, adjusted for inflation, is still far below 2008 Hormuz-crisis levels even as Iran halts ships and rejects an Oman-brokered joint-control plan for the strait (via **rektmando**'s roundup); US/Saudi struck Iran-backed sites in Iraq.\n\n**Memory/Semis crash:** SK Hynix earnings confusion (**jimcramer**) triggered a KOSPI plunge of 44% in 40 days / -$2T market cap (**TKL_Adam**), even as **saxena_puru** and **buccocapital** bought the dip and **BobEUnlimited** warned the bounce is short-covering, not resilience.\n\n**AI/Compute:** **nicbstme**, building on Dwarkesh, argued compute could get *more* expensive even as intelligence gets cheaper — a power-law dynamic favoring only the best-funded labs; **dylan522p** and **nicbstme** both declined to sign the AI-slowdown petition, calling it unenforceable given the multi-country prisoner's dilemma.\n\n**Chips/CHIPS Act:** US Gov to take a 1% stake in **$GFS** plus $300M for CPO R&D — **aleabitoreddit** flags read-through to **$SIVE**/**$LITE** as the only named laser suppliers in GlobalFoundries' materials.\n\n**Notable:** **RaoulGMI** says you need 11%+ returns just to keep pace with liquidity growth + inflation (debasement vs. inflation); **0xJeff**'s State of Onchain AI report finds stablecoins/RWAs accrue value to institutions while onchain AI still accrues to retail.", "sections": {"A_events": [{"cluster": "FOMC Day — Fed Holds, Forward Guidance Debate", "category": ["macro", "positioning"], "items": [{"author": "biancoresearch", "summary": "Jim Bianco notes the Fed has never delivered a hike (since 1994 by fed funds futures, since 2008 by swaps) when market-implied odds were below 60% — directly relevant given today's meeting. Separately, he lays out that formal Fed \"forward guidance\" ended with Warsh starting the June meeting, a shift he welcomes after long criticizing guidance as breeding moral hazard and over-speculation. In a third thread he flags core PCE running 80bps above April 2025 levels, arguing the post-COVID inflation regime is structurally higher (avg/std-dev \"step-functioned\" up), and pushes back on the idea the Fed should avoid hiking just to protect a S&P up only 8.5% YTD when $MTUM is up 15%.", "tweet_url": "https://x.com/biancoresearch/status/2082512636663521531", "images": ["https://pbs.twimg.com/media/HOaRSVqXoAAZHdE.png"], "type": "tweet"}, {"author": "Geiger_Capital", "summary": "Puts ~25% odds on an actual hike today, calling it a policy mistake but noting the Truth Social fallout would be \"incredible\"; separately jokes the market goes to zero if MSFT/META miss earnings the same day.", "tweet_url": "https://x.com/Geiger_Capital/status/2082506897362395615", "images": ["https://pbs.twimg.com/media/HOaM6D7W8AAUvMZ.jpg"], "type": "tweet"}, {"author": "Crypto_McKenna", "summary": "Predicts the Fed holds and delivers a hawkish tone on inflation rather than an aggressive hike, since a hiking cycle would hit AI capex — the market's main growth vector; expects a \"nothing burger\" until September, and separately notes forward guidance is effectively dead given how uncertain odds remain this close to a meeting.", "tweet_url": "https://x.com/Crypto_McKenna/status/2082496703542985048", "type": "tweet"}, {"author": "dgt10011", "summary": "Jeff Park calls it the most exciting FOMC day he can remember: \"volatility is vitality.\"", "tweet_url": "https://x.com/dgt10011/status/2082491655861461072", "type": "tweet"}, {"author": "lord_fed", "summary": "Floats (tongue-in-cheek) that Trump's pre-market comments about hitting Iran hard were timed to knock the market down so the Fed couldn't justify a hike, and that the tone could still shift the presser and future hike chatter.", "tweet_url": "https://x.com/lord_fed/status/2082465497119957415", "type": "tweet"}, {"author": "_tolks", "summary": "Trading around the FOMC/Iran/earnings confluence: bought SOXL and TQQQ calls for forced short covering, still short a chunk of coins plus AAPL shorts/puts and IWM puts, betting on a \"bottom on momentum/semis/QQQ, top on coins & AAPL\" parlay.", "tweet_url": "https://x.com/_tolks/status/2082499864210907534", "images": ["https://pbs.twimg.com/media/HOaPFejXIAAAQtQ.png", "https://pbs.twimg.com/media/HOaPGaxWwAAefvI.png"], "type": "thread"}]}, {"cluster": "Iran-Hormuz — Oil Escalation, Moderate Prices", "category": ["energy", "geopolitics"], "items": [{"author": "JavierBlas", "summary": "Argues Iran's attempt to impose economic pain on Trump by threatening the Strait of Hormuz hasn't worked: oil prices, adjusted for inflation, remain moderate versus 2008's Hormuz crisis (European gasoil hit an inflation-adjusted >$2,000/ton in July 2008 vs. ~$1,300 today). Separately reports CENTCOM says it has assisted 500 million barrels of crude transiting Hormuz since early May — roughly 5.6 million barrels/day.", "tweet_url": "https://x.com/JavierBlas/status/2082498171502989740", "images": ["https://pbs.twimg.com/media/HOaEW7YWcAAVyVJ.png"], "type": "thread"}, {"author": "rektmando", "summary": "Daily headline roundup flags fresh Hormuz escalation: Iran halts three ships in the strait, rejects an Oman-brokered joint-control plan, and is set to receive ~400 Chinese air-defense launchers; also notes US/Saudi strikes on Iran-backed sites in Iraq and a drone strike on a Permian refinery.", "tweet_url": "https://x.com/rektmando/status/2082448154923073851", "images": ["https://pbs.twimg.com/media/HOZXIFqbYAAWggE.jpg"], "type": "tweet"}, {"author": "elerianm", "summary": "Notes the volatility spike this year extends well beyond oil into government bond yields — the UK's 10-year gilt yield has swung between 4.23% and 5.17% this year, a high-beta economy example of broader benchmark instability.", "tweet_url": "https://x.com/elerianm/status/2082512551640785044", "images": ["https://pbs.twimg.com/media/HOaSII0WAAADYK-.jpg", "https://pbs.twimg.com/media/HOaSIIvWoAADHKu.jpg"], "type": "tweet"}]}, {"cluster": "SK Hynix Shock → Korea Market Meltdown, Memory Whipsaw", "category": ["tech", "EM", "macro"], "items": [{"author": "jimcramer", "summary": "Says the SK Hynix earnings call \"has something for bears and bulls\" — demand and capacity additions both framed as great, yet the stock and coverage are all over the place; separately blames a wave of leveraged 2x single-stock funds unwinding for erratic moves across Bloom, Intel and disk-drive names, and calls it a day traders \"will rue letting into our markets.\"", "tweet_url": "https://x.com/jimcramer/status/2082389691932803515", "type": "tweet"}, {"author": "TKL_Adam", "summary": "Kobeissi Letter frames South Korea's KOSPI collapse as historic: the index went from barely top-15 globally to 6th largest ($5T) in months, then erased nearly half its market cap in 40 days, prompting an emergency regulator meeting.", "tweet_url": "https://x.com/TKL_Adam/status/2082473948252447167", "type": "tweet"}, {"author": "mrjasonchoi", "summary": "Notes South Korea's finance ministry is keeping its 24-hour stock market monitoring system running through the turmoil.", "tweet_url": "https://x.com/mrjasonchoi/status/2082494653811896675", "type": "tweet"}, {"author": "ColdBloodShill", "summary": "Observes memory stocks are trading like meme coins — down 50% in a month with tradfi-trader memes everywhere — and calls it a potential strong inflection point.", "tweet_url": "https://x.com/ColdBloodShill/status/2082409074331717994", "type": "tweet"}, {"author": "jvisserlabs", "summary": "Flags that most momentum charts circulating aren't sector-neutralized; the MS Sector-Neutral Momentum Factor is down another 2%+ today, closing out what he calls a speed-crash month for momentum.", "tweet_url": "https://x.com/jvisserlabs/status/2082481145275376121", "images": ["https://pbs.twimg.com/media/HOZ08iiXcAAmPx1.jpg"], "type": "tweet"}, {"author": "BobEUnlimited", "summary": "Argues the recent bounce in AI/semi names is short-covering flow, not evidence the market can withstand a real reversal of the AI/semi mania — a resilience narrative he thinks is misread.", "tweet_url": "https://x.com/BobEUnlimited/status/2082414467241947404", "images": ["https://pbs.twimg.com/media/HOY43XdWoAAEM84.jpg"], "type": "tweet"}]}, {"cluster": "GlobalFoundries — US Takes 1% Stake, CPO/CHIPS Act Read-Through", "category": ["tech", "regulation"], "items": [{"author": "aleabitoreddit", "summary": "US government to take a 1% stake in $GFS plus up to $300M to accelerate domestic CPO (co-packaged optics)/silicon-photonics R&D by 2-3 years under the CHIPS Act. Serenity flags this as a strong read-through for $SIVE and $LITE — the only two public laser suppliers named in GlobalFoundries' presentation slides, with Sivers' laser arrays recently referenced in GF's SCALE design for CPO — and is surprised GFS is still trading down on the news, drawing a parallel to the earlier $INTC foundry stake playbook.", "tweet_url": "https://x.com/aleabitoreddit/status/2082513405219631384", "images": ["https://pbs.twimg.com/media/HOaNvsEaoAADH4n.jpg", "https://pbs.twimg.com/media/HOaRjZMb0AAmHlS.jpg", "https://pbs.twimg.com/media/HOaSKY7bgAAOvCx.jpg"], "type": "thread"}]}, {"cluster": "AI Safety Petition — Slowdown Push Gets Mixed Reception", "category": ["AI", "regulation"], "items": [{"author": "dylan522p", "summary": "Dylan Patel (SemiAnalysis) calls slowing down AI wishful thinking — \"the genie is out of the bottle\" — arguing the most important competition in history won't pause voluntarily, most lab employees haven't signed, and the letter ignores China's role entirely.", "tweet_url": "https://x.com/dylan522p/status/2082321388736581641", "type": "thread"}, {"author": "nicbstme", "summary": "Complementary but more sympathetic take: says he knows many signatories and understands the intent, but sees it as an unenforceable prisoner's dilemma — hundreds of billions of dollars, multiple countries and national-security stakes mean one defector unravels it. Still, he reads the sheer number of frontier-lab signatories as a signal that people closest to the technology are increasingly worried.", "tweet_url": "https://x.com/nicbstme/status/2082414439085621596", "type": "tweet"}, {"author": "Crypto_McKenna", "summary": "Argues Anthropic and OpenAI will delay their IPOs to next year or beyond — if public today, both would see heavy volatility and markdowns pressured by open-source Chinese models, which he frames as net positive for market liquidity.", "tweet_url": "https://x.com/Crypto_McKenna/status/2082497943819669510", "type": "tweet"}]}, {"cluster": "Robotics Onshoring — Standard Bots Documentary", "category": ["tech", "AI"], "items": [{"author": "Delphi_Digital", "summary": "Releases its first Delphi Media short film, an inside look at Standard Bots and how the company is scaling industrial robot production in the US.", "tweet_url": "https://x.com/Delphi_Digital/status/2082473757193478455", "type": "tweet"}, {"author": "Rewkang", "summary": "Frames Standard Bots as the only company designing and producing industrial robots at scale in the US after production moved overseas, calling the film a deep dive on how industrial robot design is evolving for an AI-native world.", "tweet_url": "https://x.com/Rewkang/status/2082475840953041067", "type": "tweet"}, {"author": "theallinpod", "summary": "\"The Robot Episode\" gathers four robotics leaders (ANYbotics, 1X, Boston Dynamics, Agility Robotics) covering the $1/hour robo-worker thesis, China's robotics threat, robo-dogs vs. humanoids, Neo shipping in 2026 as an open platform, Boston Dynamics' Spot as the most-deployed robot on Earth, and why humanoids may finally work after 100 years of false starts.", "tweet_url": "https://x.com/theallinpod/status/2082449550883668021", "type": "tweet"}]}], "B_insights": [{"author": "nicbstme", "summary": "Building on Dwarkesh's contrarian argument: the consensus view that AI gets cheaper every year (better chips, better algorithms, competition) may invert in the near term. If frontier models become economically useful faster than GPUs can be manufactured, compute stops being priced at cost-to-produce and starts being priced at what it can earn — meaning intelligence could get cheaper while the hardware producing it gets dramatically more expensive. He sees this creating a steep power law where only the best-funded labs can keep bidding up GPU prices, squeezing everyone else into small, cheap, low-pricing-power models.", "tweet_url": "https://x.com/nicbstme/status/2082513925950595449", "type": "tweet"}, {"author": "elerianm", "summary": "Points to the WSJ front page on a firm-specific funding issue as symptomatic of a broader two-sided dynamic: rising bond-market funding needs (driven by tech capex and government deficits) colliding with high rates shaped by a mismatch between sources and uses of loanable funds — referencing his own March FT op-ed on the theme.", "tweet_url": "https://x.com/elerianm/status/2082509615141359949", "images": ["https://pbs.twimg.com/media/HOaPbpNWEAA48GT.jpg"], "type": "tweet"}, {"author": "dampedspring", "summary": "Andy Constan tells SteveMiran he agrees on more than he disagrees — particularly on private-sector funding needs — but adds that an overhang from a duration-bloated Fed balance sheet, plus the Bessent // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
