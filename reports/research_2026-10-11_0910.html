<style>body{font-family:-apple-system,Segoe UI,sans-serif;background:#fff;color:#222;max-width:900px;margin:0 auto;padding:16px}

<script>
const ITEMS = [{"id": 1, "cat": "energy", "urgency": "deep", "source": "The Dark Side of the Boom", "title": "Brent carries a $22/bbl risk premium — Vitol says the Gulf must move 10-14 mb/d just to stay balanced through winter", "idea": "Vitol CEO Russell Hardy: roughly 10-14 mb/d must keep flowing out of the Gulf simply to balance the winter because Western inventories are nearly spent. Goldman rebuilt its Brent model because missing barrels sit outside OECD data, and even after adjusting for depleted stocks it still sees ~$22/bbl of risk premium, one of its most extreme readings.", "angle": "Premium is not fear, it is the price of zero buffer. Any disruption now hits a market with no cushion, so convexity is to the upside. Check refiners/tankers vs producers.", "tweetA": "A $22 risk premium isn't a fear gauge anymore, it's the price of an empty tank. Stocks were the shock absorber for the Gulf shock, and the absorber is gone. Next outage doesn't get averaged out, it gets repriced. $XLE $VLO", "tweetB": "Goldman had to rebuild its Brent model because the barrels went missing outside the OECD data everyone watches. If your oil framework still keys off OECD stocks, you're hedging the wrong inventory.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/nothing-left-to-drain-the-22-oil"}, {"id": 2, "cat": "positioning", "urgency": "deep", "source": "The Dark Side of the Boom", "title": "Hedge fund net exposure at the 1st percentile while S&P sits near records — Goldman's Wilson says don't fight narrow AI", "idea": "Hedge fund net exposure has collapsed to the 1st percentile even as the S&P 500 trades near highs. Goldman's Mark Wilson argues against fighting narrowness given how lightly positioned funds are. The year-end rally depends on AI spend holding, energy stabilising and no bond inflation scare.", "angle": "Underpositioned tape plus narrow leadership = squeeze fuel, but all on a single factor. Lightly positioned funds mean the downside risk is the AI-capex narrative, not forced selling.", "tweetA": "Hedge fund net exposure: 1st percentile. S&P: near record. Either the smartest money is wrong, or the index is being held up by a handful of names it can't afford to lose. Both can be true at once.", "tweetB": "When positioning is at the floor, the market doesn't need good news, it needs less bad news. That's why 'don't fight the tape' works right up to the one print that breaks the narrow leadership.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/ghosts-in-the-machine-goldmans-mark"}, {"id": 3, "cat": "macro", "urgency": "deep", "source": "The Dark Side of the Boom", "title": "Ten companies deliver 68% of S&P 500 earnings growth this quarter — Micron and Nvidia alone are about a third", "idea": "Just ten companies are expected to deliver 68% of S&P 500 earnings growth this quarter, with Micron and Nvidia contributing roughly one-third. AI is also squeezing global capital: governments compete with tech giants for funding, pushing real yields higher.", "angle": "Index earnings are effectively a memory and GPU call option. Memory is cyclical; the market is paying a secular multiple for a cyclical earnings contribution.", "tweetA": "68% of S&P earnings growth from ten companies. A third of it from Micron and Nvidia. That isn't a market, that's a two-stock earnings revision cycle with 498 passengers. $NVDA $MU", "tweetB": "Governments and hyperscalers are now bidding for the same pool of capital. Real yields are the clearing price. AI isn't just a growth story, it's a funding-competition story.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/ghosts-in-the-machine-goldmans-mark"}, {"id": 4, "cat": "macro", "urgency": "deep", "source": "The Dark Side of the Boom", "title": "Europe at 13x earnings with improving breadth — but sovereign stress and expensive energy cap the case", "idea": "Europe trades at about 13x earnings with improving profits and healthier breadth, per the Goldman note. Obstacles: sovereign stress, expensive energy and tighter financial conditions.", "angle": "Cheap vs the US, but the discount has a reason: energy and sovereign spreads. Selective exposure to exporters and energy-independent names.", "tweetA": "Europe at 13x with improving breadth looks like the obvious rotation. Then look at the 10-year OAT at 4.75% and the energy bill. Cheap for a reason is still cheap, but it's not free.", "tweetB": "US earnings concentrated in ten names, Europe broadening at 13x. The diversification trade exists, the question is whether bond markets let it work.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/ghosts-in-the-machine-goldmans-mark"}, {"id": 5, "cat": "credit", "urgency": "deep", "source": "The Dark Side of the Boom", "title": "France: 10y at 4.75% vs nominal growth of 2.7% — Citadel sees a slow-burn debt trap, not a crisis", "idea": "Citadel Securities' Frank Flight: French spread widening is comparable to prior sovereign/tightening episodes but milder than the pandemic or the euro crisis, and spreads are unlikely to return to the old range. 10y at 4.75% against projected nominal growth of 2.7%; France must tighten the primary balance by ~2.8pp of GDP by 2032 just to stabilise debt.", "angle": "r-g is positive by ~2pp. That's the arithmetic of a trap. Expect OAT-Bund to carry a permanent premium, and political headline risk around the next budget.", "tweetA": "4.75% to borrow, 2.7% nominal growth. That 2-point gap compounds every year. France doesn't need a crisis to be in trouble, it just needs the status quo.", "tweetB": "Le Pen's €140B plan: investors are buying the headline, not the arithmetic. Conflicting pension promises, questionable savings. Spread tightening on that is a trade, not a thesis.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/citadel-frank-flight-france-a-matter"}, {"id": 6, "cat": "geopolitics", "urgency": "deep", "source": "The Dark Side of the Boom", "title": "Le Pen's €140B fiscal rescue plan 'sounds better than it looks'", "idea": "Citadel's read: the plan is substantial in ambition but rests on questionable savings assumptions and conflicting pension promises, with a hard political path. Markets are rewarding the headline.", "angle": "Political-risk premium in French assets is now tied to a specific fiscal program that doesn't add up. Watch for a gap between rhetoric and OAT pricing.", "tweetA": "€140B sounds like a plan. The savings assumptions say otherwise. Markets rally on the number, then the arithmetic arrives.", "tweetB": "Pension promises that contradict the savings plan is the tell. A fiscal rescue that needs a political coalition nobody has isn't a rescue, it's a campaign slide.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/citadel-frank-flight-france-a-matter"}, {"id": 7, "cat": "AI/infra", "urgency": "deep", "source": "AI-RTZ / Michael Parekh (via SemiAnalysis)", "title": "SemiAnalysis: Anthropic subscriptions offer ~5x the API-equivalent value of OpenAI's mid-tier; subscriptions are ~10% of revenue but >40% of inference compute", "idea": "At $200, Anthropic buys ~$2,485 of Fable 5.1 at API prices vs ~$2,897 of GPT-6 Astra at OpenAI, roughly even. At mid-tier Opus 5.5 gives ~5x the value of GPT-6.1 Sol. For Anthropic, subscriptions are ~10% of revenue but can use over 40% of inference compute, cutting blended revenue per MW by ~$36M.", "angle": "Revenue per megawatt becomes the metric for the IPO. Subsidised tokens are tokens not sold at API prices when compute is scarce.", "tweetA": "Subscriptions: 10% of Anthropic revenue, 40%+ of inference compute. Every $200 plan is a compute allocation decision disguised as a price. Revenue per MW will be in the S-1 questions.", "tweetB": "Wrappers pay retail for the models; model owners set the terms. Anthropic offers 9x the limits of Cursor/Devin and likely still has higher margin. That's the moat in one line.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropic-vs-openai-the-subscription"}, {"id": 8, "cat": "AI/infra", "urgency": "deep", "source": "AI-RTZ / Michael Parekh (via SemiAnalysis)", "title": "OpenAI halved the tokens in its $200 plan and added a $500 tier — Existing subscribers grandfathered until Oct 29", "idea": "OpenAI halved tokens per model tier on Pro, added a $500 'Ultrafast' tier that offers only ~21% more Astra usage than the old $200 plan. Its $100/$200/$500 plans now all give identical tokens per dollar. Its adjusted gross margin fell to 33% last year as model-running costs quadrupled.", "angle": "Subscription cut = margin repair ahead of an IPO, hidden by Dev Day news. 33% gross margin vs Anthropic >80% pre-partner share per FT is the whole valuation gap.", "tweetA": "OpenAI cut the $200 plan in half and nobody noticed because Dev Day was the same week. 33% gross margin last year with run costs 4x. This isn't pricing strategy, it's triage.", "tweetB": "33% vs 80%+ gross margin. Same industry, same customers. When the S-1s land, that's the chart. $MSFT $AMZN $GOOGL", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropic-vs-openai-the-subscription"}, {"id": 9, "cat": "AI/infra", "urgency": "watch", "source": "AI-RTZ / Michael Parekh (via SemiAnalysis)", "title": "Anthropic IPO eyed for mid-November at $1.8-2T; $517B compute deals in 11 months vs OpenAI ~$750B through 2030", "idea": "Anthropic aims to list as soon as mid-November before Thanksgiving, valuation pegged $1.8-2T, two profitable quarters and >80% gross margins before partner revenue share per FT. OpenAI stays private this year. Labs also silently A/B test limits (~20% lower on some accounts).", "angle": "IPO supply: a $2T listing is a liquidity event for the entire AI complex. Watch hyperscaler stakes ($AMZN $GOOGL) and index inclusion mechanics.", "tweetA": "A $2T IPO before Thanksgiving. Whoever has to fund it sells something else. Watch what gets sold to make room.", "tweetB": "$517B of compute commitments in 11 months against two profitable quarters. The bet is that demand grows into the commitment. The IPO lets retail underwrite that.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropic-vs-openai-the-subscription"}, {"id": 10, "cat": "science", "urgency": "deep", "source": "Exponential View / Azeem Azhar", "title": "Math 2.0: OpenAI repo of hundreds of manuscripts and proofs; Fields medallist says PhD students in 'total panic'", "idea": "Problems that stumped human minds for decades fell to an afternoon of compute. Tao says Math 1.0 prized being first to solve; Math 2.0 must value exposition and community. Duminil-Copin says his students are in 'a state of total panic'. An 'Association for Human Mathematics' urges mathematicians to stop working with OpenAI.", "angle": "Open problems organise training and funding in academia. Remove the scarcity and the institution shifts. Same pattern as any skilled-labor commodity shock.", "tweetA": "An open problem used to organise a decade of training, hiring and funding. When it falls in an afternoon, you don't just lose the answer, you lose the scaffolding. Math is the first field to find out.", "tweetB": "Condorcet bet knowledge and its diffusion would move together. AI proofs without explanations break that. More answers, less understanding is a real risk for anyone relying on the output.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.exponentialview.co/p/ev-605"}, {"id": 11, "cat": "crypto", "urgency": "deep", "source": "Exponential View / Azeem Azhar", "title": "Justin Drake: AI could undermine digital signatures before quantum computers do — 'bunker mode' for crypto", "idea": "Drake urges the industry to prepare for 'bunker mode', warning AI may break the signatures that authorise transactions before quantum does. Meltem Demirors calls it a 'sobering moment'.", "angle": "Pairs with After Hour's note on quantum fears driving liquidations. The threat model for BTC/ETH keys is shifting from hardware to software.", "tweetA": "Everyone priced quantum as a 2035 hardware problem. Drake's point is that AI may get to the signatures first. That's a different timeline and a different risk model for $BTC $ETH.", "tweetB": "Quantum-resistant coins held up last week while everything else liquidated. The market is already sorting assets by signature risk. Watch which L1s publish migration plans.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.exponentialview.co/p/ev-605"}, {"id": 12, "cat": "AI/infra", "urgency": "deep", "source": "Exponential View / Azeem Azhar", "title": "AI revenues at $276bn annualized — EV's updated accounting; plus what a persistent personal AI agent costs", "idea": "EV's AI Investment Brief puts AI revenues at $276bn annualized and examines the cost of running a persistent personal assistant. Also covers high-bandwidth flash, a memory design that could help AI chips do more work. State of AI Report 2026 (Benaich) is out.", "angle": "$276B revenue vs ~$1T committed capex frames the payback gap. High-bandwidth flash is a memory-hierarchy angle for $MU/$SNDK.", "tweetA": "$276B annualised AI revenue. Capex commitments run into the trillions. Payback needs a ~4-5x revenue step-up, and the buyers are budgeting tokens now, not maxing them.", "tweetB": "High-bandwidth flash is a quiet one. If it lets chips do more with cheaper memory, the HBM scarcity premium has a competitor. $MU $SNDK", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.exponentialview.co/p/ev-605"}, {"id": 13, "cat": "energy", "urgency": "deep", "source": "Exponential View / Azeem Azhar", "title": "Pakistan's rooftop solar as a Hormuz hedge — EV target pulled forward: 30% of new vehicle sales electric by 2030", "idea": "Pakistan's rooftop solar buildout cushioned imported-fuel shocks after Hormuz closed. Higher petrol prices may bring forward the 30% EV share target. Jan Rosenow warns grid fixed costs shift to households without panels. Also: 85% of US grid-queue capacity is solar, wind or storage.", "angle": "Oil importers in the developing world are electrifying on price signal, not policy. Structural demand destruction for oil at the margin.", "tweetA": "Pakistan didn't wait for a climate treaty. $22 of oil risk premium did the policy work. Importers are electrifying on price, and that demand doesn't come back.", "tweetB": "The catch: grid fixed costs don't disappear when the rich install panels. The cheap option for some becomes a higher bill for others. Utility death spiral, Karachi edition.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.exponentialview.co/p/ev-605"}, {"id": 14, "cat": "tech", "urgency": "deep", "source": "Exponential View / Azeem Azhar", "title": "WEF/EV Next-Generation Computing Framework: sovereignty needs a stress test, and quantum adds to electricity demand", "idea": "A country can own data centres and still depend on foreign suppliers for maintenance or licensing. Recommend stress-testing autonomy in crisis. Quantum depends on conventional computing, likely adding to power demand. Solve electricity/data/skills constraints before spending more on compute.", "angle": "'Sovereign AI' spend is a stranded-asset risk if supply-chain agency is not real.", "tweetA": "Own the data centre, rent the chips, license the software. That's not sovereignty, that's a lease with a flag on it.", "tweetB": "Constraint first, compute second. If power, data or skills are binding, the marginal GPU is worth less. Check where utilities are the bottleneck.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.exponentialview.co/p/ev-605"}, {"id": 15, "cat": "science", "urgency": "watch", "source": "Exponential View / Azeem Azhar", "title": "Short morsels: retired EV batteries retain 84.5% median capacity; 160 China drug programs cleared for trials; AI builds materials atom by atom", "idea": "Review of 157 studies: of 10,000+ retired cells, median remaining capacity is 84.5%. Samuel Hume counts 160 new drug programs cleared for human trials in China this year. A semi-autonomous AI system builds materials atom by atom. Permafrost blankets in the Arctic. AI flagged cancer risk signals years early in 54,000+ women. Grace Shao on why personal agents lag in China (superapps).", "angle": "Second-life batteries compress grid-storage cost. China biotech trial count is a pipeline signal.", "tweetA": "84.5% median capacity left in retired cells. 'End of life' for an EV battery is the start of a cheaper grid-storage supply chain.", "tweetB": "160 new Chinese drug programs cleared for human trials this year. The biotech pipeline story and the licensing deals follow from that number.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.exponentialview.co/p/ev-605"}, {"id": 16, "cat": "crypto", "urgency": "deep", "source": "The After Hour / defi0xjeff", "title": "Quantum fear plus weak macro triggers large crypto liquidation — quantum-resistant coins the exception; Citrini 15-token basket", "idea": "Last week's quantum fears plus weak macro drove large liquidations and retracement across assets, except quantum-resistant coins. Citrini Research published an extensive crypto report listing a 15-token basket as infrastructure for a new financial system. Email preview only; body is truncated after section 1.", "angle": "The market is already pricing signature risk as a factor. The Citrini basket is a tradeable list to cross-check against signature-migration plans.", "tweetA": "Quantum scare, bad macro, big liquidation, and quantum-resistant coins didn't blink. That's a factor, not a narrative.", "tweetB": "Citrini's 15-token basket as 'infra for the new financial system'. Baskets get crowded fast. The question is which names survive a signature-risk screen.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://defi0xjeff.substack.com/p/the-after-hour-ep76-quantumtumtum"}];
const META = {"date": "2026-10-11", "time": "09:10 CEST", "windowStart": "2026-10-11 03:10 CEST", "windowEnd": "2026-10-11 09:10 CEST", "emailsInWindow": 6, "emailsRead": 6, "itemsExtracted": 16, "includedSources": ["The Dark Side of the Boom (6)", "AI-RTZ / Michael Parekh (via SemiAnalysis) (3)", "Exponential View / Azeem Azhar (6)", "The After Hour / defi0xjeff (1)"], "skippedSources": ["None skipped. After Hour EP.76 body was truncated in the email (preview only), extracted what was available."]};
const CC = {"macro": "#e24b4a", "credit": "#378add", "positioning": "#ef9f27", "AI/infra": "#1d9e75", "crypto": "#7f77dd", "geopolitics": "#d85a30", "energy": "#f97316", "tech": "#06b6d4", "gold": "#d4a017", "culture": "#ec4899", "labor": "#8b5cf6", "regulation": "#64748b", "science": "#14b8a6", "venture": "#84cc16"};
var curCat='All',curUrg='All';
var UE={act:'🔴',deep:'🔵',watch:'🟡'};
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function tog(id){var e=document.getElementById('c'+id);e.classList.toggle('open');}
function render(srcF){
  var h='';
  ITEMS.forEach(function(item){
    var show=(curCat==='All'||item.cat===curCat)&&(curUrg==='All'||item.urgency===curUrg)&&(!srcF||item.source.indexOf(srcF)>=0);
    if(!show)return;
    var col=CC[item.cat]||'#888';
    h+='<div class="card'+(srcF?' open':'')+'" id="c'+item.id+'"><div class="hd" onclick="tog('+item.id+')"><span class="num">'+item.id+'</span><span>'+UE[item.urgency]+'</span><span class="src" style="background:'+col+'">'+esc(item.source)+'</span><span class="tag">'+item.cat+'</span>'+(item.charts.count?(item.charts.hot?'🔥':'📊'):'')+'<span class="ti">'+esc(item.title)+'</span></div><div class="bd">';
    h+='<div class="lb">The Idea</div><div>'+esc(item.idea)+'</div>';
    h+='<div class="lb">My Angle</div><div class="ang" style="border-color:'+col+';background:'+col+'14">'+esc(item.angle)+'</div>';
    h+='<div class="tw"><div><div class="lb" style="color:#378add">TWEET A</div>'+esc(item.tweetA)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    h+='<div><div class="lb" style="color:#7f77dd">TWEET B</div>'+esc(item.tweetB)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>';
    h+='<div class="ch'+(item.charts.hot?' hot':'')+'">'+(item.charts.count?item.charts.count+' chart(s): '+esc(item.charts.desc):'No chart in email \u2014 charts inside, worth opening')+'</div>';
    h+='<p><a href="'+item.link+'" target="_blank">↗ Read full article</a></p></div></div>';
  });
  document.getElementById('list').innerHTML=h;
}
function pills(){
  var cats=['All'],cnt={};ITEMS.forEach(function(i){cnt[i.cat]=(cnt[i.cat]||0)+1;if(cats.indexOf(i.cat)<0)cats.push(i.cat);});
  var h='';cats.forEach(function(c){var n=c==='All'?ITEMS.length:cnt[c];var on=c===curCat;var col=CC[c]||'#333';
    h+='<span class="pill" style="'+(on?'background:'+col+';color:#fff;border-color:'+col:'')+'" onclick="setCat(\''+c+'\')">'+c+' '+n+'</span>';});
  document.getElementById('cf').innerHTML=h;
  var us=[['All','All'],['act','🔴 Act Now'],['deep','🔵 Deep'],['watch','🟡 Watch']];h='';
  us.forEach(function(u){var n=u[0]==='All'?ITEMS.length:ITEMS.filter(function(i){return i.urgency===u[0];}).length;var on=u[0]===curUrg;
    h+='<span class="pill" style="'+(on?'background:#333;color:#fff;border-color:#333':'')+'" onclick="setUrg(\''+u[0]+'\')">'+u[1]+' '+n+'</span>';});
  document.getElementById('uf').innerHTML=h;
}
function setCat(c){curCat=c;pills();render();}
function setUrg(u){curUrg=u;pills();render();}
function filterBySrc(name){curCat='All';curUrg='All';pills();render(name);}
function init(){
  document.getElementById('sub').textContent=META.date+' \u00B7 '+META.time+' \u00B7 '+ITEMS.length+' items';
  var r='<p>Window: '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</p><p>Emails in window: '+META.emailsInWindow+' \u00B7 read: '+META.emailsRead+' \u00B7 items: '+META.itemsExtracted+'</p><b>Included sources</b><ul>';
  var seen={};ITEMS.forEach(function(i){seen[i.source]=(seen[i.source]||0)+1;});
  Object.keys(seen).forEach(function(s){r+='<li><span class="s" onclick="filterBySrc(this.getAttribute(\'data-s\'))" data-s="'+esc(s)+'">'+esc(s)+'</span> ('+seen[s]+')</li>';});
  r+='</ul><b>Skipped</b><ul>'+META.skippedSources.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul>';
  document.getElementById('rb').innerHTML=r;
  pills();render();
}
init();
</script></body></html>
