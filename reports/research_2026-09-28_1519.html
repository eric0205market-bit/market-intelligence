  idea:`Gen Digital fell 6.3% after the FT reported talks to acquire GoDaddy — a "transformational" deal versus the smaller tuck-ins the market expected. StoneX flags the financing problem directly: Gen's existing $8B net debt plus GoDaddy's $3.8B means a deal likely needs a meaningful equity component, and RBC cut its price target to $26 from $30 on the shift away from Gen's "accelerating growth" story toward integration risk.`,
  angle:`A case study in the market punishing a company for even discussing a large debt-funded deal before terms are known — a useful signal for how leverage-sensitive risk appetite has become as rates rise.`,
  tweetA:`Gen Digital dropped 6% on a REPORT of a possible GoDaddy deal — no terms, no confirmation, just the combined $11.8B debt load spooking the market. In this rate environment, "M&A talks" alone is enough to get punished if leverage is involved. $GEN`,
  tweetB:`RBC's target cut here is the tell: they didn't downgrade the fundamentals, they downgraded the STORY — from "accelerating growth compounder" to "integration risk with debt." That reclassification is happening across a lot of names right now as rates bite.`,
  charts:{count:0,hot:false,desc:``},
  link:`https://bigmoves.substack.com/p/big-moves-september-26-2026` },

{ id:17, cat:"macro", urgency:"act", source:`J.P. Morgan / Dark Side of the Boom™`,
  title:`5-year Treasury bid-to-cover just hit 2.21 — weakest since December 2018`,
  idea:`Last week's 5-year Treasury auction saw its bid-to-cover ratio fall to 2.21 — the weakest since December 2018 — after an upside PMI surprise had already pushed front-end rates sharply higher. The weak demand pushed the 5-year yield up nearly 17bp to its highest level since 2007.`,
  angle:`A 2.21 bid-to-cover is the kind of number that used to move markets on its own; right now it's getting buried under Iran/oil headlines — exactly the setup where a real funding-stress signal goes unpriced until it isn't.`,
  tweetA:`5-year Treasury bid-to-cover just hit 2.21 — the weakest since December 2018. That's Treasury market plumbing stress, and it's getting almost no attention because oil headlines are eating the news cycle. $TLT $IEF`,
  tweetB:`17bp move in the 5-year off one weak auction. If you're still modeling Fed policy purely off dot plots and CPI prints, you're missing where the actual price discovery is happening right now — it's in auction demand, not FOMC statements.`,
  charts:{count:0,hot:false,desc:``},
  link:`https://thedarksideoftheboom.substack.com/p/jp-morgan-one-economy-two-markets` },

{ id:18, cat:"macro", urgency:"deep", source:`J.P. Morgan / Dark Side of the Boom™`,
  title:`France now trades wider than Italy, Spain AND Greece — a genuine role reversal in eurozone risk`,
  idea:`The French-German 10Y OAT-Bund spread widened to ~111bp, its highest since the early 2010s eurozone debt crisis — while Italy, Spain and Greece, the old "PIGS," are now trading with LOWER risk premiums than France. This is a genuine role reversal in eurozone credit risk perception.`,
  angle:`France going from core to periphery in relative terms is a much bigger structural story than most US-focused desks are giving credit for — it changes the entire "flight to quality within Europe" playbook.`,
  tweetA:`France now trades wider than Italy, Spain AND Greece. Read that again. The countries that defined the eurozone debt crisis a decade ago are now the "safe" trade relative to France. That's not a headline, that's a regime change in European credit. $EWQ $EWI`,
  tweetB:`111bp OAT-Bund spread, matching levels last seen in the 2011-12 crisis. Nobody's positioned for "France is now the periphery" because it's never been true before. It is now.`,
  charts:{count:1,hot:true,desc:`🔥 CHART WORTH SAVING — French-German 10Y spread, 2006-2026, spiking to ~111bp, highest since the early 2010s crisis`},
  link:`https://thedarksideoftheboom.substack.com/p/jp-morgan-one-economy-two-markets` },

  idea:`JPM's chart shows the MOVE index (bond vol) breaking above 100 in early 2026 while the VIX (equity vol) has stayed contained in the 15-25 range throughout — one of the largest bond/equity volatility divergences on record. A single-session 14bp move in the 10-year (the largest since Liberation Day tariffs) produced less than a 1% S&P move.`,

{ id:20, cat:"credit", urgency:"deep", source:`Peter Boockvar`,
  title:`3% money from 2021 is refinancing at 8% today — that's a mechanical earnings hit, not a sentiment problem`,
  idea:`Boockvar's framing: rates being "back to normal" is true only if you ignore that it follows 15 years of abnormal near-zero rates — meaning anyone who financed at 2021-era 3% and must refinance this year or next (commercial real estate, SPAC/LBO vintage 2021 debt) is staring at 8% money. He notes this is a rate-of-change problem, not just a level problem.`,
  angle:`The refi wall math is simple and brutal: every dollar of 2021-vintage debt coming due in 2026-27 refinances at roughly 2.5-3x the original cost — a mechanical cash-flow hit independent of anything happening in the broader economy.`,
  tweetA:`Boockvar's point is simple math that keeps getting missed: 3% money from 2021 refinancing at 8% today isn't "rates normalizing," it's a 2.5-3x increase in debt service cost for anyone whose loan comes due. That's a mechanical earnings hit, not a sentiment problem. $IWM`,
  tweetB:`The household version of this same story: people aren't refusing to move because they love their houses, they're refusing to give up a 3-4% mortgage for a 7%+ one. That's the labor-mobility drag hiding inside "rates are just normal now."`,
  charts:{count:0,hot:false,desc:``},
  link:`https://peterboockvar.substack.com/p/a-few-important-things-of-note-267` },

{ id:22, cat:"geopolitics", urgency:"deep", source:`Danielle DiMartino Booth / QI Research`,
  title:`Gasoline price expectations went from 0.2 cents to 29.7 cents/gallon in seven months`,
  idea:`UMich's final September data shows the Median Year-Ahead Expected Change in Gasoline Prices jumped from 19.8 to 29.7 cents/gallon in the month — and compares to just 0.2 cents back in February, a roughly 150x increase in fuel-specific inflation expectations coinciding with the Iran war's 7th month.`,
  angle:`This is a leading indicator worth tracking separately from headline inflation expectations — the fastest-moving, most war-sensitive component, blowing out well ahead of any CPI print capturing it.`,
  tweetA:`UMich gasoline price expectations: 0.2 cents in February, 29.7 cents now. That's a ~150x move in seven months, happening entirely underneath the headline inflation-expectations number that gets all the attention. CPI hasn't caught up yet. $USO`,
  tweetB:`DiMartino Booth's 1984 framing is the uncomfortable part: a 7-month "war" with no clear resolution mechanism is functioning almost exactly like Orwell's perpetual-conflict device — a policy justification that never has to actually end to keep working.`,
  charts:{count:0,hot:false,desc:``},
  link:`https://dimartinobooth.substack.com/p/the-daily-feather-2026-or-1984` },

{ id:23, cat:"regulation", urgency:"deep", source:`AI Snake Oil (Arvind Narayanan & Sayash Kapoor)`,
  title:`AI experts' p(doom): 3% median. Superforecasters': 0.38%. That's a 100x+ gap among people paid to be calibrated`,
  idea:`AI Snake Oil's core data point from the Existential Risk Persuasion Tournament: AI experts' median p(doom)-by-2100 was 3% (75th percentile 12%), while superforecasters' median was just 0.38% (75th percentile only 1%) — meaning the 75th-percentile AI-expert estimate is over 100x the 25th-percentile superforecaster estimate, from people who spent months trying to persuade each other.`,
  angle:`This is the cleanest evidence that "expert AI risk estimates" function as an identity/tribe signal rather than a forecast — useful ammunition next time a p(doom) number gets cited as a calibrated probability.`,
  tweetA:`AI experts say 3% chance of AI extinction by 2100 (up to 12% at the 75th percentile). Superforecasters, whose entire job is calibration, say 0.38% (capped at 1%). That's a 100x+ gap between two groups of credentialed people who spent months arguing with each other. Neither number is a fact.`,
  tweetB:`If a fund manager gave you a return forecast with a 100x range between base case and bear case, you'd fire them. That's exactly the spread on AI x-risk estimates, and policymakers are citing single-point versions of it as settled science.`,
  charts:{count:0,hot:false,desc:``},
  link:`https://www.normaltech.ai/p/p-doom` },

{ id:24, cat:"culture", urgency:"watch", source:`AI Snake Oil (Arvind Narayanan & Sayash Kapoor)`,
  title:`A former FTC chair called a 15% chance of extinction "techno-optimist"`,
  idea:`Former FTC Chair Lina Khan described her own AI views as "techno-optimistic" with a stated p(doom) of 15% — a number the piece notes left AI safety experts bewildered, since a 15% chance of human extinction is an extraordinarily high number to describe as optimism.`,
  angle:`A one-line illustration of the broader p(doom) critique: without training in how to interpret small/large probabilities, people anchor on the label ("optimist" vs "doomer") rather than the actual number.`,
  tweetA:`A former FTC chair called herself an AI "techno-optimist" with a 15% p(doom). Fifteen percent chance of extinction is the optimist case. That's not a data point about AI risk — it's a data point about how broken the p(doom) vocabulary has become.`,
  tweetB:`The p(doom) number was supposed to make the debate more precise. Instead policymakers use "15%" and "optimist" in the same sentence with a straight face. The quantification didn't clarify anything, it just gave people a number to misuse with confidence.`,
  charts:{count:0,hot:false,desc:``},
  link:`https://www.normaltech.ai/p/p-doom` },

{ id:27, cat:"regulation", urgency:"act", source:`Lucky Trader / Morning Minute`,

  idea:`The SEC's Division of Corporation Finance updated its crypto FAQ Friday: on a functional network, announcing a token buyback no longer counts as a promise of "essential managerial efforts" under Howey. A securities lawyer called it a rule that "goes further than I expected." The caveat: pitching a buyback as a yield/return source BEFORE a network is functional can still trigger securities law.`,
  angle:`A genuine regulatory unlock for an entire category of tokens (DefiLlama tracks 20+ live buyback programs) that had been operating in a legal gray zone all year — the functional-network distinction is now the key structural test.`,
  tweetA:`SEC just said: ship a working product, then buy back your token, and that's not a security-triggering promise anymore. Every protocol running a live buyback — HYPE, PUMP, ENA, AAVE — just got regulatory cover for the model they'd already built in a gray zone. $HYPE $ENA`,
  tweetB:`The real signal isn't the buyback ruling itself, it's its shape: functional-network-first is now the explicit legal test. That's the SEC quietly telling every pre-launch token project exactly how to structure its roadmap to avoid securities status.`,
  charts:{count:0,hot:false,desc:``},
  link:`https://luckytrader.substack.com/p/sec-clears-token-buybacks-for-crypto` },

{ id:29, cat:"crypto", urgency:"watch", source:`Lucky Trader / Morning Minute`,
  title:`Vitalik: Ethereum "won't really be a blockchain anymore" by 2030`,
  idea:`Vitalik Buterin laid out Ethereum's roadmap to 2030: it "won't really be a blockchain anymore" in the traditional sense — instead of every node redoing identical computation, most work moves off-chain and gets verified with zero-knowledge cryptographic proofs. He flagged next year's Hegota upgrade as likely the last "normal" fork, targeting 4-8 second slots and 8-32 second finality.`,
  angle:`If ETH's core value prop shifts from "redundant on-chain computation" to "verified off-chain computation," that changes what an ETH validator or L1 gas fee actually represents economically.`,
  tweetA:`Vitalik just said Ethereum "won't really be a blockchain anymore" by 2030 — most computation moves off-chain, verified by ZK proofs instead of redundant execution. If the base layer's job changes that fundamentally, does the current ETH fee/burn model even still make sense in five years? $ETH`,
  tweetB:`Every L2 scaling debate for three years has assumed the L1 stays the "ground truth" settlement layer doing real computation. Vitalik's own roadmap says that job goes away. Worth asking what accrues value to ETH itself once the chain is mostly a verification machine.`,
  charts:{count:0,hot:false,desc:``},
  link:`https://luckytrader.substack.com/p/sec-clears-token-buybacks-for-crypto` },

{ id:31, cat:"crypto", urgency:"act", source:`Unchained (Laura Shin)`,
  title:`Bitget's $388M hack was a signing-chain compromise, not a stolen key — and THORChain won't help`,
  idea:`GoPlus's forensic read on Bitget's $388M hack: attackers didn't get private keys, they compromised the backend wallet system's transaction-signing trust chain, spoofing transaction data to trigger the exchange's own authorization process — draining funds over roughly 2h25m. THORChain flatly refused Bitget's request to block the hacker's wallets, citing its no-censorship design, even though its own May exploit attackers were never blacklisted either.`,
  angle:`A signing-chain compromise is a scarier exploit class for institutional custody than a key leak — it means proper key management alone doesn't stop this attack vector, and THORChain's refusal shows the limits of relying on protocol-level intervention as a backstop.`,
  tweetA:`Bitget's $388M hack wasn't a stolen private key — it was a spoofed authorization on the transaction-signing chain itself. That's a scarier exploit class than a key leak, because good custody hygiene alone doesn't stop it. $BTC`,
  tweetB:`THORChain just told Bitget no, twice, on principle. "Permissionless and doesn't censor by design" sounds great until it's your $388M being laundered through the protocol that refuses to lift a finger.`,
  charts:{count:0,hot:false,desc:``},
  link:`https://unchainedcrypto.beehiiv.com/p/bitget-starts-unlocking-the-vault-one-coin-at-a-time` },

  tweetB:`Xenobots (frog-cell robots) and anthrobots (human tracheal-cell robots) both display behaviors nobody programmed and nobody can fully explain from their components. That gap between "what we built" and "what it does" is exactly the gap AI alignment people worry about, and biology got there first.`,

  idea:`Vik's Newsletter's structural analysis of personal AI agent compute: Muse's VM allocation (2 vCPU, 8GB RAM, 100GB SSD) implies that on a 256-core CPU server with typical oversubscription (4x CPU sharing, 1.75x multithreading benefit), CPU math alone supports 896 resident VMs — but if server RAM caps at 1.5TB, only 192 VMs actually fit at 8GB each. RAM, not CPU core count, is the true bottleneck.`,
  angle:`This directly challenges the INTC/AMD/ARM >25% MTD rally thesis built on "personal agents = explosive CPU demand" — if memory is the actual constraint, the beneficiaries are memory suppliers and RAM-minimizing architectures, not raw CPU core count sellers.`,
  tweetA:`INTC, AMD and ARM are all up 25%+ this month on the "personal AI agents need CPUs" story. The actual math: a 256-core server could theoretically host 896 agent VMs by CPU count, but only 192 fit once you account for RAM. The real bottleneck — and the real beneficiary — might be memory, not cores.`,
  tweetB:`Nobody's asking the follow-up question on the CPU-demand-from-agents thesis: is Muse deploying "shared CPU, resident RAM" or "on-demand, spun-down-when-idle" VMs? That single architecture choice changes implied chip demand by roughly 4-5x. The stocks rallied before anyone answered it.`,
  charts:{count:1,hot:false,desc:`Data-flow diagram: personal-agent VM CPU/RAM/GPU resource allocation`},
  link:`https://www.viksnewsletter.com/p/how-many-cpus-do-personal-ai-assistants` },

const CAT_LABELS = {
  macro:"Macro", credit:"Credit", positioning:"Positioning", "ai-infra":"AI/Infra",
  crypto:"Crypto", geopolitics:"Geopolitics", energy:"Energy", tech:"Tech",
  gold:"Gold", culture:"Culture", labor:"Labor", regulation:"Regulation",

};
const URG_LABELS = { act:"🔴 Act Now", deep:"🔵 Deep", watch:"🟡 Watch" };
const URG_EMOJI = { act:"🔴", deep:"🔵", watch:"🟡" };

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function catColor(cat){
  return getComputedStyle(document.documentElement).getPropertyValue("--" + cat).trim();
}

function buildFilters(){
  const catCounts = {};
  ITEMS.forEach(function(i){ catCounts[i.cat] = (catCounts[i.cat]||0) + 1; });
  const catBar = document.getElementById("catFilters");
  let html = '<button class="pill" data-kind="cat" data-val="all" onclick="setCatFilter(\'all\')">All <span class="count">(' + ITEMS.length + ')</span></button>';
  Object.keys(CAT_LABELS).forEach(function(c){
    if(!catCounts[c]) return;
    html += '<button class="pill" data-kind="cat" data-val="' + c + '" onclick="setCatFilter(\'' + c + '\')">' + CAT_LABELS[c] + ' <span class="count">(' + catCounts[c] + ')</span></button>';
  });
  catBar.innerHTML = html;

  const urgCounts = {};
  ITEMS.forEach(function(i){ urgCounts[i.urgency] = (urgCounts[i.urgency]||0) + 1; });
  const urgBar = document.getElementById("urgFilters");
  let uhtml = '<button class="pill" data-kind="urg" data-val="all" onclick="setUrgFilter(\'all\')">All <span class="count">(' + ITEMS.length + ')</span></button>';
  ["act","deep","watch"].forEach(function(u){
    if(!urgCounts[u]) return;
    uhtml += '<button class="pill" data-kind="urg" data-val="' + u + '" onclick="setUrgFilter(\'' + u + '\')">' + URG_LABELS[u] + ' <span class="count">(' + urgCounts[u] + ')</span></button>';
  });
  urgBar.innerHTML = uhtml;
  paintFilterStates();
}

function paintFilterStates(){
  document.querySelectorAll('.pill[data-kind="cat"]').forEach(function(btn){
    const v = btn.getAttribute("data-val");
    if(v === activeCat){
      btn.classList.add("active");
      btn.style.background = v === "all" ? "#333" : catColor(v);
      btn.style.borderColor = v === "all" ? "#333" : catColor(v);
    } else {
      btn.classList.remove("active");
      btn.style.background = "transparent";
      btn.style.borderColor = "";
      btn.style.color = "var(--text)";
    }
  });
  document.querySelectorAll('.pill[data-kind="urg"]').forEach(function(btn){
    const v = btn.getAttribute("data-val");
    if(v === activeUrg){
      btn.classList.add("active");
      btn.style.background = "#333";
      btn.style.borderColor = "#333";
    } else {
      btn.classList.remove("active");
      btn.style.background = "transparent";
      btn.style.borderColor = "";
      btn.style.color = "var(--text)";
    }
  });
}

function setCatFilter(c){
  activeCat = c;
  activeSrc = null;
  renderCards();
  paintFilterStates();
}
function setUrgFilter(u){
  activeUrg = u;
  activeSrc = null;
  renderCards();
  paintFilterStates();
}
function filterBySrc(name){
  activeCat = "all";
  activeUrg = "all";
  activeSrc = name;
  renderCards();
  paintFilterStates();
  document.querySelectorAll(".card").forEach(function(el){
    if(el.dataset.match === "1") el.classList.add("open");
  });
}

function renderCards(){
  const wrap = document.getElementById("cards");
  let html = "";
  ITEMS.forEach(function(item){
    let show = true;
    if(activeCat !== "all" && item.cat !== activeCat) show = false;
    if(activeUrg !== "all" && item.urgency !== activeUrg) show = false;
    if(activeSrc && item.source.indexOf(activeSrc) === -1) show = false;
    if(!show) return;
    const color = catColor(item.cat);
    const chartFlag = item.charts.hot ? "🔥" : (item.charts.count > 0 ? "📊" : "");
    html += '<div class="card" data-match="1" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">#' + item.id + '</span>';
    html += '<span class="urg">' + URG_EMOJI[item.urgency] + '</span>';
    html += '<span class="badge" style="background:' + color + '">' + item.source.split(" / ")[0].split(" (")[0] + '</span>';
    html += '<span class="cat-tag">' + CAT_LABELS[item.cat] + '</span>';
    if(chartFlag) html += '<span class="chart-flag">' + chartFlag + '</span>';
    html += '<span class="title">' + item.title + '</span>';
    html += '</div>';
    html += '<div class="card-body">';
    html += '<div class="section-label">The Idea</div><div class="idea-text">' + item.idea + '</div>';
    html += '<div class="section-label">My Angle</div><div class="angle-box" style="border-color:' + color + ';color:' + color + '">' + item.angle + '</div>';
    html += '<div class="section-label">Tweets</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet-box"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet-box"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    if(item.charts.count > 0 || item.charts.desc){
      html += '<div class="chart-box' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.desc || "Charts inside") + '</div>';
    }
    html += '<a class="read-link" href="' + item.link + '" target="_blank">↗ Read full article</a>';
    html += '</div></div>';
  });
  if(!html) html = '<div style="padding:30px;text-align:center;color:var(--text-dim);">No items match this filter.</div>';
  wrap.innerHTML = html;
}

function toggleCard(id){
  const el = document.getElementById("card-" + id);
  if(el) el.classList.toggle("open");
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function buildReport(){
  document.getElementById("metaLine").textContent =
    META.date + " · " + META.time + " · " + META.itemsExtracted + " items from " + META.emailsRead + " emails";

  let html = "<h4>Time Window</h4>";
  html += "<div>" + META.windowStart + " → " + META.windowEnd + ". Emails outside this window were not processed.</div>";

  html += "<h4>Totals</h4>";
  html += "<div>" + META.emailsInWindow + " emails in window · " + META.emailsRead + " read · " + META.itemsExtracted + " items extracted · " + META.skippedSources.length + " sources skipped</div>";

  html += "<h4>Included Sources (click to filter)</h4>";
  META.includedSources.forEach(function(s){
    html += '<div class="src-row" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + ' — ' + s.count + ' item' + (s.count>1?'s':'') + (s.note ? ' <span style="opacity:0.6">(' + s.note + ')</span>' : '') + '</div>';
  });

  html += "<h4>Skipped Sources</h4>";
  META.skippedSources.forEach(function(s){
    html += '<div>' + s.name + ' — <span style="opacity:0.75">' + s.reason + '</span></div>';
  });

  document.getElementById("reportBody").innerHTML = html;
}

document.getElementById("reportToggle").addEventListener("click", function(){
  const body = document.getElementById("reportBody");
  body.classList.toggle("open");
  this.textContent = (body.classList.contains("open") ? "▾" : "▸") + " Session Report";
});

buildFilters();
renderCards();
buildReport();
</script>
</body>
</html>
