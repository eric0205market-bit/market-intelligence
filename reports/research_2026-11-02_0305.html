<script>
const ITEMS = [{"id": 1, "cat": "AI/infra", "urgency": "act", "source": "Stephen Innes / Dark Side of the Boom", "title": "The market stopped paying for the word 'AI' — it wants the earnings", "idea": "NDX -3.5% Friday, SOX -7.2%, Intel one of its ugliest days ever. Core ad/retail/consumer franchises sit under ~$750B of AI spend and are losing momentum, so the debate moved from AI demand to AI returns. Rising correlations plus heavier put demand mean the complex traded as one factor again.", "angle": "The funding-source argument is the new bear case: capex was 'self-funding' only while the core businesses accelerated. Watch semis for a higher low before touching the hyperscalers.", "tweetA": "$750B of AI capex is sitting on top of ad and retail franchises that just decelerated. Demand for AI was never the question. Who pays for it at this multiple is. Friday was a funding-source repricing, not a sentiment wobble. $NVDA $GOOGL $AMZN", "tweetB": "One-day SOX -7.2% with Azure +48% and AWS +39% in the same week. Demand is fine. The market is now underwriting the depreciation schedule. If the S-curve of returns lags the capex curve by even a year, the multiple has nowhere to hide.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/daily-boom-ai-cracks-oil-blinks-gold"}, {"id": 2, "cat": "macro", "urgency": "act", "source": "Stephen Innes / Dark Side of the Boom", "title": "China's 'National Team' regroups: PBoC/CSRC meet Monday on buyback relending", "idea": "PBoC, NFRA, CSRC and big banks meet Monday to improve the relending facility for share buybacks and stake increases. CSI 300 fell 8.5% in October, a record 12 straight weekly declines, and sits in a bear market (>20% off June high). China stocks just had their worst month in over a decade; official PMIs are back in contraction.", "angle": "Beijing is leaning against the same AI unwind hitting the US. A state bid can force shorts to cover but cannot fix earnings or household demand.", "tweetA": "12 straight weekly losses on the CSI 300 and the answer is a Monday meeting about buyback relending. When the plunge team calls an emergency session before the open, being short into it is a trade with a known counterparty. $FXI $KWEB", "tweetB": "Everyone is debating whether the AI unwind is a US problem. Chinese stocks just had their worst month in a decade while Beijing buys the ETFs. This is a global repricing of AI financing, and the state bid is the tell for how bad it got.", "charts": {"count": 1, "hot": false, "desc": "Goldman national-team ETF subscription chart inside the linked piece"}, "link": "https://thedarksideoftheboom.substack.com/p/chinas-plunge-protection-team-regroups"}, {"id": 3, "cat": "macro", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom", "title": "Goldman: RMB170B into 'national team' ETFs in two weeks — after RMB935B went out in January", "idea": "Goldman counts ~RMB170B net inflows to the ten national-team ETFs over two weeks, a statistical buy signal and near a 3-year monthly high. January alone saw ~RMB935B of outflows. Meanwhile hedge fund China exposure is near 1-year lows and southbound sold ~$2.2B of HK stocks in a week. STAR Composite reversed from -4.5% to +3.7% Friday.", "angle": "The state is running a two-sided cycle: sell the froth, buy the crash. Private capital is leaving. Valuation work is secondary to flow work here.", "tweetA": "The Chinese state sold ~RMB935B of ETFs in January and is buying RMB170B back in late October. That's not a market, that's a thermostat. Hedge funds are at one-year lows in China while the STAR index swung 8 points intraday. $KWEB", "tweetB": "Intraday reversal from -4.5% to +3.7% on STAR is not price discovery. Ask who the price-insensitive buyer is, and what happens to the bid when the relending money runs out. Beijing can buy a floor; it can't buy a bull market.", "charts": {"count": 2, "hot": true, "desc": "Goldman chart: national-team ETF subscriptions vs CSI 300; monthly flows 3-yr extreme"}, "link": "https://thedarksideoftheboom.substack.com/p/chinas-plunge-protection-team-regroups"}, {"id": 4, "cat": "energy", "urgency": "act", "source": "Stephen Innes / Dark Side of the Boom", "title": "Brent slips under $112 on diplomacy — but products still price war", "idea": "Brent below $112, WTI near $102 after reports Trump prefers more time for talks before deciding on strikes post-midterms. Gulf crude exports are largely back to pre-war, but diesel stays tight in the US and Europe and refining margins carry a war premium. A vessel was reportedly struck in Hormuz over the weekend after Friday's LNG tanker attack; ships still run dark.", "angle": "Flat price is rolling over on headlines, not fundamentals. The inflation signal lives in the product complex. Risk comes out slowly and goes back in violently.", "tweetA": "Brent just under $112 and everybody wants to call the top. Crude exports have recovered; diesel hasn't. The pain moved downstream to refiners and the inflation print. Fade the headline, respect the crack. $VLO $MPC", "tweetB": "A tanker got hit over the weekend and oil still fell on 'diplomacy'. That's the market pricing a delay, not a resolution. Midterms are Tuesday. If strikes resume after, the premium that took two weeks to leave returns in two days.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/daily-boom-ai-cracks-oil-blinks-gold"}, {"id": 5, "cat": "gold", "urgency": "act", "source": "Stephen Innes / Dark Side of the Boom", "title": "Gold bounces to ~$3,900 after a -3.7% day — but it's trading like a liquidity asset", "idea": "Bullion near $3,900 after Friday's 3.7% drop, the lowest close in over a year. In October real yields eased, equities fell, geopolitics stayed hot and the dollar wasn't a headwind — yet gold fell. Then it started trading with the Nasdaq. First real test is $4,082; oil is the gatekeeper via the inflation channel.", "angle": "The hedge function failed in the exact environment it's supposed to work. If NDX falls and gold holds, the correlation is breaking in the right direction.", "tweetA": "Gold fell with real yields down, equities down, geopolitics up and no dollar headwind. Every textbook driver said up. When your hedge correlates with your longs, it is not a hedge, it's the ATM. $GLD $GDX", "tweetB": "$4,082 is the line. Below it, gold is repairing a margin-call. Above it, Friday was a clearing event. Central banks don't rescue leveraged longs on the first bounce — they nibble. Watch whether the bid shows up on NDX down days.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/daily-boom-ai-cracks-oil-blinks-gold"}, {"id": 6, "cat": "macro", "urgency": "act", "source": "Stephen Innes / Dark Side of the Boom (Bloomberg-sourced)", "title": "Treasury refunding Wednesday: biggest guidance rewrite since early 2024?", "idea": "Dealers expect the 'at least the next several quarters' coupon-size language to soften (Barclays: 'the coming quarters'). Citi sees cuts to 20y/30y auction sizes starting this month. 30y still above 5.30%. Refunding sizes unchanged would be $58B 3y (Nov 9), $42B 10y (Nov 10), $25B 30y (Nov 12). UBS sees no actual change until May; JPM expects unchanged through next August.", "angle": "Debt management as shadow policy: Bessent has tripled 10-30y buybacks to $6B per operation and is asking dealers about 'structural changes in investor demand'. A soft-language change gives him optionality without reversing a promise.", "tweetA": "Citi thinks Treasury cuts 20y/30y supply as soon as Wednesday. 30y is above 5.30%. JPM calls it Treasury's 'discomfort with the level of yields'. The curve is now a policy variable.", "tweetB": "The deficit is ~$2T a year. Cutting long-bond supply doesn't lower borrowing, it moves it to bills. Record $839B bill auction last week. You can't issue your way out of a deficit — you can only choose where the refinancing risk lives. $TLT $TBT", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-braces-for-bessents-next"}, {"id": 7, "cat": "credit", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom", "title": "Bills are 22% of Treasury debt — above TBAC's 20% guide — and weekly auctions top half a trillion", "idea": "Bills at ~22% of debt outstanding versus the 20% average suggested by TBAC. The US now auctions >$500B per week; last week was a record $839B. Stablecoin T-bill demand has not arrived at advertised scale and appetite may be getting less elastic. Nobody knows the saturation point because no one has financed deficits this size with this investor base.", "angle": "Duration risk swaps for rollover risk. The weak link is the money-market-fund and stablecoin bid. Also an easy bridge to crypto/stablecoin narrative.", "tweetA": "Treasury is financing a $2T deficit on a funding mix that gets rolled every few months. 22% bills vs a 20% guide. That is not a duration decision, it is a bet that the MMF bid never blinks. $SGOV", "tweetB": "The stablecoin-as-T-bill-buyer story assumed scale that hasn't shown up. If Wednesday leans harder on bills, the marginal buyer is carrying the entire weight of the US deficit. Name the buyer or admit the plan is a hope.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-braces-for-bessents-next"}, {"id": 8, "cat": "regulation", "urgency": "deep", "source": "Fulcrum (Michael McDonough) / The Pressure Point", "title": "Judge bars DOJ from threatening election officials; DOJ sought to void ballots of 20,000+ California voters", "idea": "Judge Trina Thompson barred DOJ from threatening election officials with prosecution over ballots tied to suspected noncitizens, days before the midterms; the administration appealed. DOJ also issued grand-jury subpoenas to California officials and asked courts to set aside ballots tied to 20,000+ voters (judge: could 'wreak havoc'). A new Arizona probe targets three Democratic-aligned registration groups four days out.", "angle": "The 2000 Florida recount lesson: scope selection becomes the case. Selective remedy invites a motive question. Election-night process risk is itself a market variable.", "tweetA": "DOJ asked a court to void ballots tied to 20,000+ California voters one week before an election. A judge says it could wreak havoc. Markets are pricing midterms as a policy event. They aren't pricing process risk.", "tweetB": "The Florida 2000 margin was 537 votes and the loser's 'four counties' strategy cost him the moral case. Selectivity always becomes the story. Watch for delayed counting and certification in Nov 3-10 as the tail risk nobody hedges.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-four-counties-shrank-the/"}, {"id": 9, "cat": "geopolitics", "urgency": "deep", "source": "Fulcrum (Michael McDonough) / The Pressure Point", "title": "Trump vows vetoes if GOP loses both chambers; court tosses Alaska ballot-preservation suit", "idea": "Trump said he'd veto Democratic legislation if Republicans lose both House and Senate. A federal judge dismissed the administration's suit to separate and preserve certain ballots in Alaska's Senate race. Per P Equity Research, Democrats are favored to win both chambers.", "angle": "Divided government means policy gridlock: tariff and fiscal levers move to executive action only. That's a vol input for Treasury supply and trade.", "tweetA": "If Democrats take both chambers and Trump vetoes everything, the only policy left is executive action. Tariffs, sanctions, Treasury refunding. Markets that price 'gridlock = calm' are mispricing where the discretion lives.", "tweetB": "Alaska suit dismissed, California subpoenas, Arizona probe. Three different legal fronts, one pattern: the fight is moving from the ballot box to the process. That is the more investable story for the next two weeks.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-four-counties-shrank-the/"}, {"id": 10, "cat": "crypto", "urgency": "act", "source": "Fulcrum (Michael McDonough) / The Pressure Point", "title": "Binance users pulled $3.64B after reopening from a $6.3B hack the FBI links to North Korea", "idea": "Binance customers withdrew $3.64B after the exchange returned online following a $6.3B hack the FBI attributes to North Korea. (Via The Pressure Point 'Things happen' roundup, citing SCMP.)", "angle": "A $6.3B hack would be the largest in crypto history by a wide margin. Withdrawals equal ~58% of the stolen amount in one reopening day: a run-on-the-exchange stress test. Also a state-actor funding story.", "tweetA": "$3.64B left Binance on reopening day. That's 58 cents of withdrawals for every dollar stolen. The hack is the headline. The run is the signal. $BTC $BNB", "tweetB": "North Korea reportedly took $6.3B. At that size it's not crime, it's a sovereign balance-sheet line item. Crypto's real risk isn't regulation. It's that custody is still a geopolitical attack surface.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-four-counties-shrank-the/"}, {"id": 11, "cat": "geopolitics", "urgency": "watch", "source": "Fulcrum (Michael McDonough) / The Pressure Point", "title": "Longest truce of the Ukraine war — Kherson — set to expire with no extension announced", "idea": "The longest truce of the Ukraine war, in the Kherson region, was set to expire after neither Russia nor Ukraine announced an extension (SCMP via Pressure Point).", "angle": "Quiet escalation risk while attention is on Iran and the midterms.", "tweetA": "The longest truce of the war is expiring in Kherson and nobody announced an extension. Everyone's watching Hormuz and the ballot box. Quiet fronts reopen when the headlines are elsewhere. $EWP", "tweetB": "A war that has a 'longest truce' record is a war with a template for pauses. What matters is whether this expires silently. Watch European gas and defense names, not the ceasefire headlines.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-four-counties-shrank-the/"}, {"id": 12, "cat": "geopolitics", "urgency": "act", "source": "P Equity Research / Speedrun", "title": "Iran offers a 48-hour Hormuz reopening plan; Netanyahu pushes Trump to resume strikes post-midterms", "idea": "Iran has offered a 48-hour Hormuz reopening plan. Netanyahu is pressing Trump to resume attacks right after the midterms. Author doubts the talks make progress.", "angle": "Two competing clocks: Iran's 48-hour offer and the post-election strike window. Oil is pricing the first and ignoring the second.", "tweetA": "Iran offers 48 hours to reopen Hormuz. Netanyahu wants strikes the day after the election. Oil can't price both. Whichever clock Trump picks decides if Brent is $95 or $130. $USO $XLE", "tweetB": "A 48-hour reopening offer from the party that closed the strait is a bargaining chip, not a de-escalation. The tell is tanker insurance, not the headline. Look at war-risk premiums, not Brent.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pequityresearch.substack.com/p/speedrun-upcoming-events-this-week-c0f"}, {"id": 13, "cat": "tech", "urgency": "act", "source": "P Equity Research / Speedrun", "title": "AI infra earnings gauntlet: AAPL, PLTR, AMD, SMCI, ANET, QCOM, COHR, ARM, LITE, IREN", "idea": "Mon: Apple, Palantir, Fabrinet, ON, Tower. Tue: AMD, SuperMicro, Navitas, Arista, Astera Labs. Wed: Qualcomm, Coherent, Arm, GlobalFoundries. Thu: Applied Opto, IREN, Lumentum.", "angle": "After SOX -7.2% in a day, this is the week where networking, optics and AI-server prints decide whether Friday was a clearing event. Optics (COHR, LITE, AAOI, FN) is the most levered pocket.", "tweetA": "After a -7.2% SOX day, we get Arista, Astera, Coherent, Lumentum and SMCI in four sessions. Optics and networking are the high-beta way to ask: is AI capex intact? Position sizes should assume gaps. $ANET $COHR $LITE", "tweetB": "Hyperscalers said capex stays high ($220B at Amazon). Now suppliers have to confirm it. Watch SMCI margins and Astera Labs guidance — they're the read-through on the 2027 spending plans Lam already hedged on.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pequityresearch.substack.com/p/speedrun-upcoming-events-this-week-c0f"}, {"id": 14, "cat": "labor", "urgency": "watch", "source": "P Equity Research / Speedrun", "title": "October NFP consensus: +65K, unemployment 4.2% (Nov 6)", "idea": "Friday Nov 6 jobs report: non-farm payrolls estimate 65K, unemployment rate 4.2%.", "angle": "With the Fed in hiking mode (70% odds of a December hike per CME), a +65K print is the 'low breakeven' world: payroll trend and hike odds decouple. Watch wages.", "tweetA": "65K payrolls consensus with a Fed that's hiking. That's the weirdest policy mix I've seen in my career. The question isn't the print; it's whether 65K is now a strong number because of labor supply.", "tweetB": "Fed statement upgraded growth to 'strong pace' and said job gains 'kept pace with the workforce'. Translation: breakeven is tiny. A 65K print isn't weak. It's the new full employment. Price accordingly.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pequityresearch.substack.com/p/speedrun-upcoming-events-this-week-c0f"}, {"id": 15, "cat": "positioning", "urgency": "deep", "source": "Cubic Analytics", "title": "Nasdaq-100: the 18th drawdown of -10% or more in 13 years — and the 'hidden in plain sight' signal", "idea": "In the author's 13-year career: 17 NDX falls >10%, 7 >15%, 5 >20%, yet NDX is +734% ($100K to $834K). Friday made it the 18th >10% decline. Author says base case is the drawdown worsens, and a basic signal just flashed that 'no one is talking about' (paywalled).", "angle": "Frequency framing: a 10% drawdown happens ~1.4x a year. The point isn't to buy; it's that the sizing, not the timing, is the edge.", "tweetA": "NDX has had 18 drawdowns of 10%+ in 13 years and still returned 734%. Both sides of that sentence are true. The part people miss: the frequency means a 10% drop isn't a regime change. It's the price of admission. $QQQ", "tweetB": "17 drops of 10%, 7 of 15%, 5 of 20% — and a base case that this one gets worse. The question isn't 'is this a bear market'. It's whether you survived the 5 deepest ones with your position size intact. $QQQ $NDX", "charts": {"count": 1, "hot": false, "desc": "Likely NDX drawdown/signal charts — worth opening"}, "link": "https://cubicanalytics.substack.com/p/its-hidden-in-plain-sight"}, {"id": 16, "cat": "macro", "urgency": "deep", "source": "SixSigmaCapital / SixSigmaResearch", "title": "Oct: Nasdaq -5.3%, SOXX -17%; Meta FCF turns negative for the first time", "idea": "October: Dow +1.7%, S&P -0.9%, Nasdaq Comp -5.3%, SOXX -17%. Meta's FCF turned negative for the first time on record capex. Alphabet missed and fell 12.6% despite Google Cloud revenue >2x. Amazon missed, guided below, held 2026 capex ~$220B (AWS +39%). Azure +48%. SK Hynix 80% operating margin. Intel's weak guide triggered Friday's AI-wide selloff (SOXX -8.2%).", "angle": "The market punishes cash burn, not demand. Memory (80% op margin) vs hyperscaler FCF is a transfer-of-profit story: the suppliers are capturing the economics.", "tweetA": "SK Hynix at an 80% operating margin. Meta FCF negative for the first time ever. Same week. The AI trade isn't broken, it's bifurcated: the people selling picks are printing money, the people buying them are burning it. $MU $META", "tweetB": "Alphabet: Cloud revenue more than doubled, stock fell 12.6%. If doubling revenue gets you sold, the market isn't asking about growth anymore. It's asking about free cash flow. Capex is the new SG&A.", "charts": {"count": 2, "hot": false, "desc": "Sector performance charts (3-mo and YTD) in the email"}, "link": "https://sixsigmaresearch.com/p/october-2026-portfolio-update-443"}, {"id": 17, "cat": "macro", "urgency": "deep", "source": "SixSigmaCapital / SixSigmaResearch", "title": "Fed hiked in September, holds at 3.75–4.00%; 70% odds of a December hike. Warsh 'unwilling and unable' to call conditions tight", "idea": "FOMC Oct 27-28 held 3.75–4.00% after September's hike; vote 10-2 with Cook and Hammack dissenting for a hike. Warsh: financial conditions tightened but he's 'unwilling and unable to call them tight'. Statement upgraded activity to 'strong pace'. Q3 GDP 3.4% annualised; Sept CPI 3.7% y/y (core 2.6%), PPI 6.3% y/y vs 5.5% exp, core PCE 3.1%. 10y fell from 5.29% to 4.93% in October. From 2027 one FOMC meeting a year will be strategy-only.", "angle": "Fed hiking into an energy shock with the 10y *falling* 36bp is the market telling the Fed the hike is the end. The PPI 6.3% vs 5.5% is a pipeline pass-through risk.", "tweetA": "Fed hiked, held with two dissenters wanting more, and the 10y *dropped* 36bp in October. Either bonds think the Fed is done hiking or they think the economy is about to break. PPI at 6.3% says it's neither. $TLT", "tweetB": "Warsh won't give forward guidance, announces a strategy-only meeting from 2027, and says conditions are 'not tight'. A Fed chair that refuses to guide, in a hiking cycle, with PPI +1.3% m/m. Vol sellers should read that twice. $VIX", "charts": {"count": 2, "hot": false, "desc": "CPI and PPI trend charts in the email"}, "link": "https://sixsigmaresearch.com/p/october-2026-portfolio-update-443"}, {"id": 18, "cat": "geopolitics", "urgency": "act", "source": "SixSigmaCapital / SixSigmaResearch", "title": "Brazil's EWZ fell ~20% in one session after the presidential runoff", "idea": "EWZ dropped nearly 20% in a single session after Brazil's presidential runoff (one line in the October recap).", "angle": "A ~20% one-day drop in a country ETF is a regime-change repricing — rare for an EM large cap. Worth reading the runoff result and BRL.", "tweetA": "EWZ -20% in one day. Everyone was watching the AI trade and Hormuz. A G20 economy just repriced overnight and it barely made the macro newsletters. $EWZ $BRL", "tweetB": "A 20% single-session drop in a liquid country ETF is a flag on the whole EM complex. If it's capital-controls or fiscal risk, the contagion goes to Mexico and Colombia first. Check the local-currency bond curve.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sixsigmaresearch.com/p/october-2026-portfolio-update-443"}, {"id": 19, "cat": "positioning", "urgency": "deep", "source": "SixSigmaCapital / SixSigmaResearch", "title": "Breadth recovered from 21% to ~60% above the 50-DMA while semis crashed — rotation, not risk-off", "idea": "Percent of S&P stocks above the 50-day moved from 21% to ~61.6% in October as SOXX fell 17%. VIX 19.42, put/call 0.90, NAAIM 76.84 (from 85.6), CNN Fear & Greed 26. Author sees capital leaving the crowded AI trade for the broader market. S&P at 23.55x trailing / 19.25x forward; Nasdaq Comp 29.9x / 21.4x.", "angle": "Equal-weight outperformance during an NDX correction is a rotation signal. VIX at 19 with a 3.5% NDX drop looks muted — hedges may be priced cheaper than the move.", "tweetA": "NDX -3.5% in a day, VIX 19, and breadth at 60%. This isn't a de-risking. It's a rotation out of semis into everything else. The index is down, the median stock is up. $RSP $QQQ", "tweetB": "VIX 19 after the worst NDX day in months is the surprising number. Dealers aren't scared. Maybe the correlation spike is concentrated in AI. If the median stock isn't selling, the pain is limited to ~25% of index weight. $SPY", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sixsigmaresearch.com/p/october-2026-portfolio-update-443"}, {"id": 20, "cat": "positioning", "urgency": "watch", "source": "SixSigmaCapital / SixSigmaResearch", "title": "A portfolio manager's October: sold NOW (+63%) and INTC before both fell 30%+; cash now 15%", "idea": "Author exited ServiceNow at +63% and Intel before each fell >30%, closed Cipher Mining at $19 (now ~$7), Credo $229, Qualcomm $179; trimmed SK Hynix and Eli Lilly. Portfolio still fell ~8% in October after hitting ATH early in month. Trading account +57% YTD from +91% high. Portfolio TWR +443% since 2023 vs S&P +108%.", "angle": "Process lesson: de-risk before earnings into stretched AI, not after. Also the S&P -9% March / Nasdaq -13% drawdown + 30% rebound shows regime frequency.", "tweetA": "Sold NOW at +63% before it fell 30%. Sold Intel before it fell 30%. Portfolio still down 8% for the month. De-risking early doesn't save you from a 17% semis drawdown, it just keeps you in the game. $NOW $INTC", "tweetB": "Cipher Mining sold at $19, now $7. That is a -63% move in a few weeks in an 'AI power' name. The crowded AI-infra trade is giving back the entire summer. The question is which pieces re-rate first.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sixsigmaresearch.com/p/october-2026-portfolio-update-443"}, {"id": 21, "cat": "gold", "urgency": "watch", "source": "Robert Sinn / Charts of the Week", "title": "Gold 'could be in for a surprising upside reversal before year end'; junior miners face tax-loss 'silly season'", "idea": "Robert Sinn's weekly: macro-driven, high-correlation environment; metals pressured by Middle East escalation fears and record oil; he sees gold potentially reversing sharply higher before year end, and a target-rich environment in junior miners from Nov–Dec tax-loss selling. (Only the intro was in the email; the charts and junior-miner commentary are behind the link.)", "angle": "A contrarian gold view right after a -3.7% day. Seasonality angle on juniors: tax-loss selling creates entry points in Nov-Dec.", "tweetA": "Gold just had its worst close in a year and the sentiment is capitulation. Tax-loss season in juniors runs Nov-Dec. The setup is forced sellers meeting a cheaper starting point. I'm watching GDXJ names on any washout. $GDXJ $GLD", "tweetB": "Two things move juniors in November: tax-loss selling and the gold tape. Both are bad right now. That's usually the setup, not the signal. Wait for gold to hold $4,082 before sizing. $GDX", "charts": {"count": 1, "hot": false, "desc": "Weekly macro/metals charts — worth opening"}, "link": "https://robertsinn.substack.com/p/the-charts-of-the-week-1112026-macro"}];

var COLORS={macro:"#e24b4a",credit:"#378add",positioning:"#ef9f27","AI/infra":"#1d9e75",crypto:"#7f77dd",geopolitics:"#d85a30",energy:"#f97316",tech:"#06b6d4",gold:"#d4a017",culture:"#ec4899",labor:"#8b5cf6",regulation:"#64748b",science:"#14b8a6",venture:"#84cc16"};
var UE={act:"🔴",deep:"🔵",watch:"🟡"};
var fc="All",fu="All",fs=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function pill(label,active,color,fn){var b=document.createElement('button');b.className='pill';b.textContent=label;if(active){b.style.background=color;b.style.borderColor=color;b.style.color='#fff';}b.onclick=fn;return b;}
function bars(){
  var cb=document.getElementById('catbar');cb.innerHTML='';
  var cats=[];ITEMS.forEach(function(i){if(cats.indexOf(i.cat)<0)cats.push(i.cat);});
  cb.appendChild(pill('All ('+ITEMS.length+')',fc==='All',"#333",function(){fc='All';fs=null;render();}));
  cats.forEach(function(c){var n=ITEMS.filter(function(i){return i.cat===c;}).length;cb.appendChild(pill(c+' ('+n+')',fc===c,COLORS[c]||"#555",function(){fc=c;fs=null;render();}));});
  var ub=document.getElementById('urgbar');ub.innerHTML='';
  [["All","All"],["act","🔴 Act Now"],["deep","🔵 Deep"],["watch","🟡 Watch"]].forEach(function(u){
    var n=u[0]==='All'?ITEMS.length:ITEMS.filter(function(i){return i.urgency===u[0];}).length;
    ub.appendChild(pill(u[1]+' ('+n+')',fu===u[0],"#333",function(){fu=u[0];fs=null;render();}));});
}
function init(){

    var show=(fc==='All'||item.cat===fc)&&(fu==='All'||item.urgency===fu)&&(!fs||item.source.indexOf(fs)>=0);
    if(!show)return;
    var chs=item.charts.count>0?(item.charts.hot?' 🔥':' 📊'):'';
    h+='<div class="card'+(fs?' open':'')+'" id="card'+item.id+'"><div class="hd" onclick="this.parentNode.classList.toggle(\'open\')">'

     +'<div class="bd"><div class="lbl">The Idea</div><div>'+esc(item.idea)+'</div>'
     +'<div class="lbl">My Angle</div><div class="angle" style="border-color:'+col+';background:'+col+'14">'+esc(item.angle)+'</div>'
     +'<div class="tw"><div><div class="lbl" style="color:#378add">Tweet A</div>'+esc(item.tweetA)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>'
     +'<div><div class="lbl" style="color:#7f77dd">Tweet B</div>'+esc(item.tweetB)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>'
     +(item.charts.count>0?'<div class="chart'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING — ':'📊 ')+item.charts.count+' chart(s): '+esc(item.charts.desc)+'</div>':'<div class="chart">No charts in email body.</div>')
     +'<div style="margin-top:8px"><a href="'+esc(item.link)+'" target="_blank">↗ Read full article</a></div></div></div>';
  });
  document.getElementById('cards').innerHTML=h||'<p>No items match.</p>';
}
function filterBySrc(name){fs=name;fc='All';fu='All';render(true);}
function report(){
  var h='<p><b>Window:</b> '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</p>'
   +'<p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items extracted: '+META.itemsExtracted+'</p><b>Included sources</b><ul>';
  META.includedSources.forEach(function(s){h+='<li><span class="sl" data-src="'+esc(s.name)+'">'+esc(s.name)+'</span> — '+s.items+' items</li>';});
  h+='</ul><b>Skipped</b><ul>';
  META.skippedSources.forEach(function(s){h+='<li>'+esc(s.name)+' — '+esc(s.reason)+'</li>';});
  h+='</ul>';
  var c=document.getElementById('repc');c.innerHTML=h;
  Array.prototype.forEach.call(c.querySelectorAll('.sl'),function(e){e.onclick=function(){filterBySrc(e.getAttribute('data-src'));};});
}
function render(){bars();init();}
