  Object.keys(cats).sort().forEach(function(c){var on=catF===c;h+='<span class="pill'+(on?' on':'')+'" style="'+(on?'background:'+COLORS[c]:'')+'" onclick="setCat(\''+c+'\')">'+c+' '+cats[c]+'</span>';});
  document.getElementById('catbar').innerHTML=h;
  var u={act:0,deep:0,watch:0};ITEMS.forEach(function(i){u[i.urgency]++;});
  var defs=[['all','All',ITEMS.length],['act','🔴 Act Now',u.act],['deep','🔵 Deep',u.deep],['watch','🟡 Watch',u.watch]];
  var h2='';defs.forEach(function(d){var on=urgF===d[0];h2+='<span class="pill'+(on?' on':'')+'" style="'+(on?'background:#333':'')+'" onclick="setUrg(\''+d[0]+'\')">'+d[1]+' '+d[2]+'</span>';});
  document.getElementById('urgbar').innerHTML=h2;
}
function setCat(c){catF=c;srcF=null;render(false);}
function setUrg(u){urgF=u;srcF=null;render(false);}
function filterBySrc(name){srcF=name;catF='all';urgF='all';render(true);window.scrollTo(0,0);}
function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+META.itemsExtracted+' items';
  var r='<p><b>Window:</b> '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</p>';
  r+='<p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items extracted: '+META.itemsExtracted+'</p><p><b>Included sources</b> (click to filter):<br>';
  META.includedSources.forEach(function(s){r+='<span class="src" data-n="'+esc(s.name)+'">'+esc(s.name)+'</span> ('+s.items+')<br>';});
  r+='</p><p><b>Skipped:</b><br>';
  META.skippedSources.forEach(function(s){r+=esc(s.name)+' — '+esc(s.reason)+'<br>';});
  r+='</p>';
  document.getElementById('rb').innerHTML=r;
  var els=document.querySelectorAll('.src');
  for(var k=0;k<els.length;k++){els[k].onclick=function(){filterBySrc(this.getAttribute('data-n'));};}
  render(false);
}
init();
</script></body></html>
