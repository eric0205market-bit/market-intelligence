  body += '<div class="section-label">My Angle</div><div class="angle-box" style="border-left-color:' + color + '; background: ' + color + '12;">' + esc(item.angle) + '</div>';
  body += '<div class="tweets">';
  body += '<div class="tweet-box"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + esc(item.tweetA) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  body += '<div class="tweet-box"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + esc(item.tweetB) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
  body += '</div>';
  body += '<div class="section-label">Charts</div>';
  body += '<div class="chart-box' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '🔥 CHART WORTH SAVING — ' : '') + esc(item.charts.desc || (item.charts.count + ' chart(s)')) + '</div>';
  body += '<div class="link-row"><a href="' + item.link + '" target="_blank" rel="noopener">↗ Read full article</a></div>';

  return '' +
    '<div class="card" data-id="' + item.id + '" data-cat="' + item.cat + '" data-urg="' + item.urgency + '" data-src="' + esc(item.source) + '">' +
      '<div class="card-header" onclick="toggleCard(' + item.id + ')">' +
        '<span class="idx">' + String(index+1).padStart(2,'0') + '</span>' +
        '<span class="urg">' + URG_EMOJI[item.urgency] + '</span>' +
        '<span class="badge-src" style="background:' + color + ';">' + esc(item.source.split(' / ')[0].split(' (')[0]) + '</span>' +
        '<span class="badge-cat">' + esc(item.cat) + '</span>' +
        (chartFlag ? '<span class="chart-flag">' + chartFlag + '</span>' : '') +
        '<span class="card-title">' + esc(item.title) + '</span>' +
        '<span class="chevron">▾</span>' +
      '</div>' +
      '<div class="card-body">' + body + '</div>' +
    '</div>';
}

function toggleCard(id) {
  const card = document.querySelector('.card[data-id="' + id + '"]');
  if (card) card.classList.toggle('open');
}

function render() {
  const wrap = document.getElementById('cards');
  wrap.innerHTML = ITEMS.map(cardHtml).join('');
  applyFilters();
}

function applyFilters() {
  let visibleCount = 0;
  document.querySelectorAll('.card').forEach(card => {
    const cat = card.getAttribute('data-cat');
    const urg = card.getAttribute('data-urg');
    const src = card.getAttribute('data-src');
    let show = true;
    if (activeSrc) {
      show = src.toLowerCase().indexOf(activeSrc.toLowerCase()) !== -1;
    } else {
      if (activeCat !== 'all' && cat !== activeCat) show = false;
      if (activeUrg !== 'all' && urg !== activeUrg) show = false;
    }
    if (show) {
      card.classList.remove('hidden');
      visibleCount++;
      if (activeSrc) card.classList.add('open');
    } else {
      card.classList.add('hidden');
    }
  });
  document.getElementById('emptyMsg').style.display = visibleCount === 0 ? 'block' : 'none';
}

function filterBySrc(name) {
  activeSrc = name;
  activeCat = 'all';
  activeUrg = 'all';
  refreshFilterStyles();
  applyFilters();
  window.scrollTo({ top: document.getElementById('cards').offsetTop - 20, behavior: 'smooth' });
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function buildReport() {
  const body = document.getElementById('reportBody');
  let html = '';
  html += '<div>Window: <strong>' + META.windowStart + '</strong> to <strong>' + META.windowEnd + '</strong>. Emails outside this window were not processed.</div>';
  html += '<div style="margin-top:6px;">Emails in window: ' + META.emailsInWindow + ' &nbsp;•&nbsp; Emails read: ' + META.emailsRead + ' &nbsp;•&nbsp; Items extracted: ' + META.itemsExtracted + '</div>';
  html += '<h4>Included Sources</h4><ul>';
  META.includedSources.forEach(s => {
    html += '<li><span class="src-link" onclick="filterBySrc(' + "'" + esc(s.name).replace(/'/g, "\\'") + "'" + ')">' + esc(s.name) + '</span> — ' + s.count + ' item' + (s.count===1?'':'s') + '</li>';
  });
  html += '</ul>';
  html += '<h4>Skipped Sources</h4><ul>';
  META.skippedSources.forEach(s => {
    html += '<li><strong>' + esc(s.name) + '</strong> — ' + esc(s.reason) + '</li>';
  });
  html += '</ul>';
  body.innerHTML = html;
}

function init() {
  document.getElementById('headerMeta').textContent = META.date + '  ·  ' + META.time + '  ·  ' + META.itemsExtracted + ' items';
  buildFilters();
  render();
  buildReport();
}

init();
</script>
</body>
</html>
