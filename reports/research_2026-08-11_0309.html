let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;
const openCards = new Set();

function catColor(cat) { return CAT_COLORS[cat] || "#8a8478"; }

function buildFilters() {
  const cats = {};
  ITEMS.forEach(i => { cats[i.cat] = (cats[i.cat] || 0) + 1; });
  const catWrap = document.getElementById('catFilters');
  let html = '<button class="pill' + (activeCat === 'all' ? ' active' : '') + '" style="' + (activeCat === 'all' ? 'background:#1c1a17;' : '') + '" onclick="setCat(\'all\')">All (' + ITEMS.length + ')</button>';
  Object.keys(cats).sort().forEach(c => {
    const isActive = activeCat === c;
    const color = catColor(c);
    html += '<button class="pill' + (isActive ? ' active' : '') + '" style="' + (isActive ? 'background:' + color + ';border-color:' + color + ';' : 'color:' + color + ';border-color:' + color + '55;') + '" onclick="setCat(\'' + c + '\')">' + c + ' (' + cats[c] + ')</button>';
  });
  catWrap.innerHTML = html;

  const urgs = {};
  ITEMS.forEach(i => { urgs[i.urgency] = (urgs[i.urgency] || 0) + 1; });
  const urgWrap = document.getElementById('urgFilters');
  let uhtml = '<button class="pill' + (activeUrg === 'all' ? ' active' : '') + '" style="' + (activeUrg === 'all' ? 'background:#1c1a17;' : '') + '" onclick="setUrg(\'all\')">All (' + ITEMS.length + ')</button>';
  ['act now', 'deep', 'watch'].forEach(u => {
    if (!urgs[u]) return;
    const isActive = activeUrg === u;
    uhtml += '<button class="pill' + (isActive ? ' active' : '') + '" style="' + (isActive ? 'background:#1c1a17;' : '') + '" onclick="setUrg(\'' + u + '\')">' + URG_META[u].emoji + ' ' + URG_META[u].label + ' (' + urgs[u] + ')</button>';
  });
  urgWrap.innerHTML = uhtml;
}

function setCat(c) { activeCat = c; activeSrc = null; render(); }
function setUrg(u) { activeUrg = u; activeSrc = null; render(); }

function filterBySrc(name) {
  activeSrc = name;
  activeCat = 'all';
  activeUrg = 'all';
  render();
  ITEMS.forEach(i => { if (i.source.indexOf(name) !== -1) openCards.add(i.id); });
  renderCards();
}

function toggleCard(id) {
  if (openCards.has(id)) openCards.delete(id); else openCards.add(id);
  renderCards();
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function renderCards() {
  buildFilters();
  let filtered = ITEMS.filter(i => {
    if (activeSrc && i.source.indexOf(activeSrc) === -1) return false;
    if (activeCat !== 'all' && i.cat !== activeCat) return false;
    if (activeUrg !== 'all' && i.urgency !== activeUrg) return false;
    return true;
  });

  const wrap = document.getElementById('cardsWrap');
  if (filtered.length === 0) {
    wrap.innerHTML = '<div class="empty-state">No items match this filter.</div>';
    return;
  }

  let html = '';
  filtered.forEach((item, idx) => {
    const color = catColor(item.cat);
    const isOpen = openCards.has(item.id);
    const urg = URG_META[item.urgency] || { emoji: '', label: item.urgency };
    const chartFlag = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');
    html += '<div class="card' + (isOpen ? ' open' : '') + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">' + String(idx + 1).padStart(2, '0') + '</span>';
    html += '<span class="urg">' + urg.emoji + '</span>';
    html += '<span class="badge" style="background:' + color + '">' + item.source.split(' / ')[0].split(' (')[0] + '</span>';
    html += '<span class="cattag">' + item.cat + '</span>';
    if (chartFlag) html += '<span class="chart-flag">' + chartFlag + '</span>';
    html += '<span class="card-title">' + item.title + '</span>';
    html += '<span class="chevron">▶</span>';
    html += '</div>';

    html += '<div class="card-body">';
    html += '<div class="section-label">The Idea</div>';
    html += '<div class="idea-text">' + item.idea + '</div>';
    html += '<div class="section-label">My Angle</div>';
    html += '<div class="angle-box" style="border-left:2px solid ' + color + ';background:' + color + '14;">' + item.angle + '</div>';
    html += '<div class="section-label">Tweets</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet-box"><div class="tweet-label" style="color:#378add;">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet-box"><div class="tweet-label" style="color:#7f77dd;">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';

    if (item.charts.count > 0 || item.charts.desc) {
      html += '<div class="chart-box' + (item.charts.hot ? ' hot' : '') + '">';
      html += (item.charts.hot ? '🔥 CHART WORTH SAVING — ' : (item.charts.count > 0 ? '📊 ' + item.charts.count + ' chart(s) — ' : ''));
      html += (item.charts.desc || 'Charts inside — worth opening');
      html += '</div>';
    }

    html += '<div class="link-row"><a href="' + item.link + '" target="_blank">↗ Read full article</a></div>';
    html += '</div>';
    html += '</div>';
  });
  wrap.innerHTML = html;
}

function renderReport() {
  const wrap = document.getElementById('reportBody');
  let html = '<div class="totals-line"><strong>Window:</strong> ' + META.windowStart + ' → ' + META.windowEnd + '</div>';
  html += '<div class="totals-line"><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp;|&nbsp; <strong>Emails read:</strong> ' + META.emailsRead + ' &nbsp;|&nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</div>';
  html += '<h4>Included Sources</h4><ul>';
  META.includedSources.forEach(s => {
    html += '<li><button class="src-link" onclick="filterBySrc(\'' + s.name.replace(/'/g, "\\'") + '\')">' + s.name + '</button> — ' + s.count + ' item(s)</li>';
  });
  html += '</ul>';
  html += '<h4>Skipped Sources</h4><ul>';
  META.skippedSources.forEach(s => {
    html += '<li><strong>' + s.name + '</strong> — ' + s.reason + '</li>';
  });
  html += '</ul>';
  wrap.innerHTML = html;
}

function render() {
  document.getElementById('headerMeta').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources';
