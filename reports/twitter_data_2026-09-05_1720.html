<title>Twitter Data Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>

const REPORT_DATA = {"report_type": "TWITTER DATA INTELLIGENCE", "date": "2026-09-05 17:20 UTC", "collected_at": "2026-09-05T17:20:53Z", "input_stats": {"total_tweets": 82, "unique_authors": 21, "tweets_with_images": 32, "after_filter": 64}, "summary": "48 items across 9 topics from 17 active data accounts. Top themes: Iran-US oil war shock with diesel at record $5.85/gal and oil approaching $100; Treasury market stress with Big Tech bond issuance surging 60% YoY to $320B; August jobs report beat driven by FIFA World Cup temp hiring (59K food services jobs). Key numbers: PCE 3.7%, BTC ETF inflows $987M/week, money market funds record $8T, hedge funds hold $2.6T Treasuries (9% of market), BTC-Gold correlation at +0.50 near pandemic high, European financials at all-time high.\n\nCritical geopolitical event: US military struck 3 Iranian crude oil carriers in Strait of Hormuz. Markets closed Monday (Labor Day) \u2014 all data current as of Friday close. ECB rate decision and US/China CPI data are key events for the week ahead.", "topics": [{"topic": "Energy, Oil & Geopolitics", "items": [{"author": "KobeissiLetter", "description": "BREAKING: US Military struck 3 Iranian crude oil carriers in Strait of Hormuz after Iran launched ballistic missiles toward 2 US Navy warships. CENTCOM: \"We will not hesitate to defend American forces, and if necessary, destroy Iran's limited and exposed oil fleet.\"", "tweet_url": "https://x.com/KobeissiLetter/status/2096234037094269139", "images": [], "data_points": ["3 Iranian tankers struck", "2 US Navy warships targeted by Iran", "Strait of Hormuz"], "created_at": "2026-09-05T13:48:35.000Z"}, {"author": "zerohedge", "description": "Iran tanker strike details: 2 tankers hit near Jask (1 empty, 1 carrying oil), 1 hit at Kharg. Crew evacuated in lifeboats and reached shore safely.", "tweet_url": "https://x.com/zerohedge/status/2096265346931929521", "images": [], "data_points": ["2 tankers hit at Jask (1 empty, 1 with oil)", "1 tanker at Kharg", "Crew safely evacuated"], "created_at": "2026-09-05T15:53:00.000Z"}, {"author": "kurtsaltrichter", "description": "Diesel just hit a record $5.85/gallon, up 56% since the war started. US exporting a record 1.77M barrels/day. Refineries going dark \u2014 Russian plants down from drone strikes, Middle East plants damaged, California lost 17% of refining capacity. A supply shock, not structural inflation.", "tweet_url": "https://x.com/kurtsaltrichter/status/2096283728779595940", "images": ["https://pbs.twimg.com/media/HRd-8VaXoAYq0TB.jpg"], "data_points": ["Diesel $5.85/gal record", "+56% since war started", "US exports 1.77M bbl/day record", "CA lost 17% refining capacity"], "created_at": "2026-09-05T17:06:02.000Z"}, {"author": "RealVision", "description": "Oil back toward $100. Yields at multi-decade highs. Dollar at its lowest since May. Bitcoin through $80K again. Key question: does the Fed hike into a war-driven oil shock? Markets closed Monday (Labor Day).", "tweet_url": "https://x.com/RealVision/status/2096245871423668532", "images": [], "data_points": ["Oil ~$100", "Dollar lowest since May", "BTC >$80K", "Yields at multi-decade highs"], "created_at": "2026-09-05T14:35:36.000Z"}, {"author": "C_Barraud", "description": "Trump calls Iran conflict 'Small Potatoes,' plays down war escalation (Bloomberg).", "tweet_url": "https://x.com/C_Barraud/status/2096173734700679545", "images": [], "data_points": ["Trump downplaying Iran conflict"], "created_at": "2026-09-05T09:48:58.000Z"}]}, {"topic": "Rates & Treasury Market", "items": [{"author": "KobeissiLetter", "description": "AI debt boom driving Treasury yields higher: Big Tech bond issuance (including SPVs) expected to surge to record $320B this year, +$120B YoY (+60%). As % of Treasury issuance, rises to record ~70% \u2014 more than double the 30% in 2025 and 9x 2024 levels. Big Tech now competing with US government for long-term debt buyers.", "tweet_url": "https://x.com/KobeissiLetter/status/2096286487230685349", "images": ["https://pbs.twimg.com/media/HRdj3nmXcAQ7efk.jpg"], "data_points": ["Big Tech bond issuance $320B expected", "+$120B YoY (+60%)", "~70% of Treasury issuance", "was 30% in 2025, 9x vs 2024"], "created_at": "2026-09-05T17:17:00.000Z"}, {"author": "KobeissiLetter", "description": "Hedge funds may be bigger Treasury risk than China: HFs hold ~$2.6T Treasuries (9% of outstanding), gross exposure $4T. China down to ~2%, lowest since 2001 (was 14% in 2013). HF repo cash borrowing surged to ~$3T, more than doubling since early 2023.", "tweet_url": "https://x.com/KobeissiLetter/status/2096253148436263163", "images": ["https://pbs.twimg.com/media/HRdjBVSX0AYsRrv.jpg"], "data_points": ["HF Treasury holdings $2.6T (9% of market)", "HF gross exposure $4T", "China Treasury share ~2% (was 14% in 2013)", "HF repo borrowing ~$3T"], "created_at": "2026-09-05T15:04:31.000Z"}, {"author": "kurtsaltrichter", "description": "Federal interest payments hit $1.2T/year \u2014 now exceeding the entire military budget. Up from ~$350B a decade ago. Every dollar of old debt rolls over at higher rates, feeding itself into higher yields.", "tweet_url": "https://x.com/kurtsaltrichter/status/2096226095569752260", "images": ["https://pbs.twimg.com/media/HRdKhpOXkAEeCdh.jpg"], "data_points": ["Federal interest payments $1.2T/year", "vs $350B a decade ago", "Exceeds military budget"], "created_at": "2026-09-05T13:17:01.000Z"}, {"author": "C_Barraud", "description": "Treasury sell-off piles pressure on weakest US borrowers (FT). High-yield issuers and floating-rate debt holders most exposed as long yields push to multi-decade highs.", "tweet_url": "https://x.com/C_Barraud/status/2096234760607588432", "images": ["https://pbs.twimg.com/media/HRdSZggboAA0iJv.png"], "data_points": ["Treasury sell-off hitting weakest borrowers", "Yields at multi-decade highs"], "created_at": "2026-09-05T13:51:27.000Z"}, {"author": "RyanDetrick", "description": "Apollo chart (via Ritholtz): At start of year, consensus expected only Fed cuts in 2026. The opposite has happened \u2014 hikes are now expected. Chart shows the dramatic flip in Fed rate expectations over the year.", "tweet_url": "https://x.com/RyanDetrick/status/2096273426184880197", "images": ["https://pbs.twimg.com/media/HRd1kirWsAEfdU3.jpg"], "data_points": ["Fed rate expectations flipped: cuts to hikes", "Dramatic shift from January 2026 consensus"], "created_at": "2026-09-05T16:25:06.000Z"}, {"author": "ARKInvest", "description": "Fed Chairman Kevin Warsh focused on headline PCE inflation at 3.7% in his Jackson Hole speech.", "tweet_url": "https://x.com/ARKInvest/status/2096265095042990372", "images": [], "data_points": ["Headline PCE 3.7%", "Fed Chair Warsh at Jackson Hole"], "created_at": "2026-09-05T15:52:00.000Z"}, {"author": "C_Barraud", "description": "Fed's Hammack says 'it's time to act to bring down inflation' (Bloomberg).", "tweet_url": "https://x.com/C_Barraud/status/2096189064303071374", "images": [], "data_points": ["Fed Hammack: time to act on inflation"], "created_at": "2026-09-05T10:49:52.000Z"}]}, {"topic": "Labor Market & Economic Data", "items": [{"author": "EPBResearch", "description": "The most important part of the August employment report: ongoing upturn in cyclical payrolls. Chart shows cyclical employment sequence improving, a key leading indicator.", "tweet_url": "https://x.com/EPBResearch/status/2096280573832523804", "images": ["https://pbs.twimg.com/media/HRd8Ee0X0AEMMTH.jpg"], "data_points": ["Cyclical payrolls turning up", "Key signal from Aug employment report"], "created_at": "2026-09-05T16:53:30.000Z"}, {"author": "kurtsaltrichter", "description": "The 162,000 August jobs came mostly from waiters, bartenders, and a soccer tournament. Food services added 59,000 \u2014 nearly 5x the 12-month average \u2014 from FIFA World Cup temp hiring. Information, finance, and government all shed jobs. Strip out the World Cup and labor market is cooling.", "tweet_url": "https://x.com/kurtsaltrichter/status/2096274160125169742", "images": ["https://pbs.twimg.com/media/HRd2PYqWcAYMq4b.jpg"], "data_points": ["Aug NFP +162K total", "Food services +59K (5x 12-month avg)", "FIFA World Cup temp hiring", "Info/finance/govt shed jobs"], "created_at": "2026-09-05T16:28:01.000Z"}, {"author": "PeterBerezinBCA", "description": "Jobs report overstates labor strength but underlying growth has picked up. Private-sector payroll growth averaged 75K in 3 months to August. Ex-healthcare and education, the 3-month average climbed to 48K.", "tweet_url": "https://x.com/PeterBerezinBCA/status/2096253703053275481", "images": ["https://pbs.twimg.com/media/HRdjoPxWwAoaAwO.jpg"], "data_points": ["Private payrolls 3M avg: 75K", "Ex-healthcare/education 3M avg: 48K"], "created_at": "2026-09-05T15:06:43.000Z"}, {"author": "C_Barraud", "description": "Charting the Global Economy: US job growth exceeds projections (Bloomberg). Multiple charts showing payroll data breadth and global context.", "tweet_url": "https://x.com/C_Barraud/status/2096184956359757975", "images": ["https://pbs.twimg.com/media/HRck_Y1XsAAX34x.png", "https://pbs.twimg.com/media/HRclCjDWAAIwxe3.png", "https://pbs.twimg.com/media/HRclGOEawAA8DLu.png"], "data_points": ["US payrolls beat projections", "Global economic chart compilation w36 2026"], "created_at": "2026-09-05T10:33:33.000Z"}, {"author": "EPBResearch", "description": "Employee compensation is now just 60% of total personal income, down from 72% in the 1960s. Economy becoming less dependent on employment income.", "tweet_url": "https://x.com/EPBResearch/status/2096247831698751891", "images": [], "data_points": ["Employee comp = 60% of personal income", "Down from 72% in 1960s"], "created_at": "2026-09-05T14:43:24.000Z"}, {"author": "sentimentrader", "description": "Favorable technical setup in the S&P 500 heading into September \u2014 historically the only month with both negative average AND negative median returns. Weight of Evidence: Selective, risk-aware.", "tweet_url": "https://x.com/sentimentrader/status/2096191625877946824", "images": ["https://pbs.twimg.com/media/HRXFP4kacAAmCc1.png"], "data_points": ["September: only month with negative avg AND median returns", "S&P technical setup favorable", "Weight of Evidence: Selective/risk-aware"], "created_at": "2026-09-05T11:00:03.000Z"}]}, {"topic": "Fund Flows & Market Positioning", "items": [{"author": "kurtsaltrichter", "description": "Money market funds just hit a record $8 trillion. Investors added $935B to cash in 2025, on track for ~$500B more in 2026. When the Fed cuts and 4% fades, even a slice rotating to stocks/bonds is a powerful bid under every dip.", "tweet_url": "https://x.com/kurtsaltrichter/status/2096238175224050118", "images": ["https://pbs.twimg.com/media/HRdVgxIWgAI9ny1.jpg"], "data_points": ["Money market funds record $8T", "+$935B added in 2025", "~$500B pace in 2026", "Current yield ~4%"], "created_at": "2026-09-05T14:05:01.000Z"}, {"author": "EricBalchunas", "description": "SEC enforcement action against ISS (Institutional Shareholder Services), which controls ~50% of proxy voting outsource market and is known for pushing ESG. ISS refused to comply with a subpoena and hand over documents.", "tweet_url": "https://x.com/EricBalchunas/status/2096261916477775961", "images": ["https://pbs.twimg.com/media/HRdrGcVW0AI-aQp.jpg", "https://pbs.twimg.com/media/HRdr-A8asAAuku0.jpg"], "data_points": ["SEC enforcement vs ISS", "ISS controls ~50% of proxy voting market", "ISS refused subpoena compliance"], "created_at": "2026-09-05T15:39:22.000Z"}, {"author": "EricBalchunas", "description": "TikTok/ByteDance ETFs filed: Leverage Shares filing 1X Short ByteDance Daily ETF, 2X Long ByteDance Daily ETF, 2X Short ByteDance Daily ETF \u2014 all effective Nov 18, 2026. ProShares also has 2x ByteDance filing.", "tweet_url": "https://x.com/EricBalchunas/status/2096274579429687763", "images": [], "data_points": ["ByteDance 1x short, 2x long, 2x short ETFs filed", " function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'"'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }
function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}
function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}
function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}
function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}
function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = item.description || item.text || '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderCharts(item.images)}
    </div>`;
}
function renderTopic(topic, idx) {
  const items = (topic.items || []).map(renderItem).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}
function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}
function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}
function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}
function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const topicCount = (d.topics || []).length;
  const itemCount = (d.topics || []).reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`topics <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}
let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const topicsBody = (d.topics || []).map(renderTopic).join('')
                  || '<div class="empty">No topics.</div>';
  const linksBody = (d.links || []).map(renderLink).join('');
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Topics', topicsBody, (d.topics || []).length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');
  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');
  document.getElementById('stats').innerHTML = renderStats(d);
}
renderReport(REPORT_DATA);
