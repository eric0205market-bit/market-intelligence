g.", "quote": null, "locator": "The Next Five Years Will See Meaningfully Slower Growth", "quote_verified": false}, {"claim": "Transaction-related payments revenue will keep growing 6% annually through 2030 on digital adoption and inflation, but non-transaction revenue (the larger pool) will slow to 5% growth as the boost from higher interest rates fades.", "speaker": "https://www.bcg.com/about/people/experts/inderpreet-batra", "type": "causal", "entities": ["Payments industry", "Interest rates"], "conviction": "high", "so_what": "Rate-sensitive deposit/float income was propping up payments revenue growth; as that tailwind normalizes, the larger revenue pool decelerates first.", "quote": null, "locator": "Transaction-related revenues will grow by 6% annually", "quote_verified": false}]}, {"theme": "Regional divergence in payments growth", "insights": [{"claim": "North America remains the largest payments revenue pool at $842 billion in 2025 and will keep growing at roughly 5% annually, in line with the global average rather than leading it.", "speaker": "https://www.bcg.com/about/people/experts/inderpreet-batra", "type": "data_point", "entities": ["North America"], "conviction": "medium", "so_what": "Scale leadership no longer implies growth leadership; incremental payments growth is shifting to smaller, faster-growing regions.", "quote": null, "locator": "North America is by far the largest revenue pool", "quote_verified": false}, {"claim": "In Asia-Pacific ($515 billion revenue pool), payments revenue growth will trail transaction volume growth because lower-monetizing rails like India's UPI are gaining share over higher-margin credit card volume.", "speaker": "https://www.bcg.com/about/people/experts/inderpreet-batra", "type": "causal", "entities": ["Asia-Pacific", "India", "UPI"], "conviction": "medium", "so_what": "Volume growth headlines in APAC payments overstate monetization; investors should track revenue-per-transaction, not just transaction counts.", "quote": null, "locator": "India illustrates this dynamic", "quote_verified": false}, {"claim": "Latin America ($200 billion, growing 7% to ~$300 billion by 2030) and the Middle East and Africa ($98 billion, growing 8% to ~$150 billion) will be the fastest-growing payments regions, driven by instant-payment rail scaling (Brazil, Argentina) and cash-to-digital migration respectively.", "speaker": "https://www.bcg.com/about/people/experts/inderpreet-batra", "type": "prediction", "entities": ["Latin America", "Middle East and Africa", "Brazil", "Argentina"], "conviction": "medium", "so_what": "These smaller, higher-growth regions are where payments providers can still find above-average organic growth as mature markets decelerate.", "quote": null, "locator": "Latin America and the Middle East and Africa are smaller but will grow fastest", "quote_verified": false}]}, {"theme": "Digital assets and tokenization reshaping settlement", "insights": [{"claim": "As of mid-2026, crypto market cap stood at roughly $2.3 trillion, with stablecoins at $260 billion and tokenized real-world assets on public chains at $38 billion, and tokenized assets could reach 9%-16% of global investable assets by 2035 under a high-growth scenario.", "speaker": "https://www.bcg.com/about/people/experts/inderpreet-batra", "type": "data_point", "entities": ["Stablecoins", "Tokenized real-world assets", "Crypto market"], "conviction": "medium", "so_what": "Even the smaller tokenized-RWA segment is already large enough to be reshaping issuance, custody, servicing, and settlement infrastructure ahead of any mass-adoption scenario.", "quote": null, "locator": "The Scale of the Opportunity", "quote_verified": false}, {"claim": "Stablecoins are still used primarily for crypto trading today, but adoption is spreading into real-economy payments where legacy rails are expensive or slow — cross-border business payments, treasury transfers, platform payouts, remittances, FX settlement, and tokenized fund operations.", "speaker": "https://www.bcg.com/about/people/experts/inderpreet-batra", "type": "thesis", "entities": ["Stablecoins", "Cross-border payments"], "conviction": "medium", "so_what": "Watch cross-border B2B and treasury flows as the next stablecoin adoption front, ahead of consumer payments.", "quote": null, "locator": "Today, the primary use for stablecoins is in crypto trading", "quote_verified": false}, {"claim": "J.P. Morgan, Citi, HSBC, and DBS have tested or launched tokenized deposits for corporate clients to keep funds on-balance-sheet within existing regulation, but the product won't create scalable value until it can move between banks, and cross-bank interoperability is still at an early piloting stage.", "speaker": "https://www.bcg.com/about/people/experts/inderpreet-batra", "type": "data_point", "entities": ["J.P. Morgan", "Citi", "HSBC", "DBS", "Tokenized deposits"], "conviction": "medium", "so_what": "Tokenized-deposit initiatives are more defensive positioning than a near-term revenue driver until interoperability is solved.", "quote": null, "locator": "The Bank's Strategic Advantage", "quote_verified": false}, {"claim": "If digital assets capture a larger share of cross-border payments and cash management, banks risk losing float income, deposits, and fee revenue from some of their highest-margin transaction flows, even though BCG's own view (from its Future of Digital Assets report) is that legacy and tokenized rails will coexist for years rather than one fully displacing the other.", "speaker": "https://www.bcg.com/about/people/experts/inderpreet-batra", "type": "thesis", "entities": ["Banks", "Stablecoins", "Tokenized deposits"], "conviction": "medium", "so_what": "Coexistence doesn't mean today's incumbent revenue shares hold — banks that don't secure wallets/custody/on-off-ramp capability risk disintermediation even in a coexistence scenario.", "quote": "That doesn’t mean that today’s market positions will hold.", "locator": "But that doesn't mean that today's market positions will hold", "quote_verified": true}]}, {"theme": "Public markets are repricing payments business models", "insights": [{"claim": "Buy-now-pay-later providers, digital-assets companies, and card issuers have outperformed the S&P 500 in recent years, while acquirers and processors have posted negative returns and networks have lagged the broader market.", "speaker": "https://www.bcg.com/about/people/experts/inderpreet-batra", "type": "data_point", "entities": ["BNPL", "Card issuers", "Acquirers", "Payment networks", "S&P 500"], "conviction": "high", "so_what": "The payments sell-off is not uniform — capital is rotating away from commoditized processing/acquiring toward issuing and digital-asset-adjacent models with clearer product differentiation.", "quote": null, "locator": "Public Equity Markets Are Reordering the Sector", "quote_verified": false}, {"claim": "Investors are no longer rewarding scale on its own; they favor 'share takers' over 'share donors' with product advantage and operating leverage, and even a small number of consistent share gainers have faced valuation overhangs over the past 12-24 months.", "speaker": "https://www.bcg.com/about/people/experts/inderpreet-batra", "type": "contrarian", "entities": ["Payments sector"], "conviction": "medium", "so_what": "Growth and share gains alone no longer guarantee multiple support — screen for durable product moats, not just market-share trajectory, when evaluating payments equities.", "quote": null, "locator": "They pay close attention to share takers versus share donors", "quote_verified": false}]}, {"theme": "Structural pressure on core payments business models", "insights": [{"claim": "Acquiring remains burdened by excess capacity and legacy infrastructure, while in issuing, growth is concentrating among the largest scaled providers (who can invest in rewards, data, and new monetization) and fast-growing fintechs, with the strongest fintechs in commercial cards and B2B payments becoming acquisition targets for larger incumbents.", "speaker": "https://www.bcg.com/about/people/experts/inderpreet-batra", "type": "thesis", "entities": ["Acquirers", "Card issuers", "Fintechs", "B2B payments"], "conviction": "medium", "so_what": "Expect continued consolidation as incumbents acquire share-gaining fintechs in commercial cards/B2B rather than build in-house.", "quote": null, "locator": "Competition is intensifying in core businesses", "quote_verified": false}, {"claim": "AI is raising the payments industry's performance bar by lowering the cost to serve clients, manage risk, and handle exceptions, while agentic commerce could reshape the entire online transaction journey from discovery and authentication through payment choice.", "speaker": "https://www.bcg.com/about/people/experts/inderpreet-batra", "type": "prediction", "entities": ["AI", "Agentic commerce"], "conviction": "medium", "so_what": "Agentic commerce is a potential structural disruptor to merchant/consumer payment-choice economics, not just a cost-efficiency tool — worth tracking who controls the agent-driven checkout layer.", "quote": null, "locator": "AI is raising the performance bar", "quote_verified": false}]}, {"theme": "Payments sovereignty and geopolitical fragmentation", "insights": [{"claim": "By June 2026, 137 countries had 24-7 instant payment access, with massive scale already reached: Brazil's Pix processed nearly 80 billion transactions in 2025, India's UPI processed 23.2 billion transactions in May 2026 alone, Colombia's Bre-B handled over 670 million transactions in its first six months, and 36 African instant payment systems across 31 countries processed 64 billion transactions worth nearly $2 trillion in 2024.", "speaker": "https://www.bcg.com/about/people/experts/inderpreet-batra", "type": "data_point", "entities": ["Pix", "UPI", "Bre-B", "Brazil", "India", "Colombia", "Africa"], "conviction": "high", "so_what": "Domestic instant-payment rails have already reached scale sufficient to structurally erode card-network transaction volumes in these markets.", "quote": null, "locator": "As of June 2026, individuals and businesses in 137 countries", "quote_verified": false}, {"claim": "Governments are actively building cross-border interoperability among domestic rails — Poland's Blik has entered Romania and Slovakia, Brazil has expanded Pix across its border with Argentina, and the BIS-led Project Nexus aims to connect Asian instant-payment systems covering 1.7 billion people — while the EU has extended interchange fee caps and forced Apple to open tap-to-pay to competing wallets.", "speaker": "https://www.bcg.com/about/people/experts/inderpreet-batra", "type": "data_point", "entities": ["Blik", "Pix", "Project Nexus", "BIS", "Apple", "European Union"], "conviction": "medium", "so_what": "Regulatory moves (interchange caps, forced wallet access) are actively compressing the fee economics that global card networks and Apple's payments ecosystem have historically captured.", "quote": null, "locator": "Interoperability", "quote_verified": false}, {"claim": "BRICS Pay aims to link members' payment rails directly, bypassing SWIFT and dollar settlement, with a business-to-business rollout targeted for the second half of 2026, while mBridge already settles cross-border transactions in central bank digital currencies among China, Hong Kong, Thailand, the UAE, and Saudi Arabia — though neither system is close to rivaling SWIFT's reach and BRICS members haven't uniformly committed.", "speaker": "https://www.bcg.com/about/people/experts/inderpreet-batra", "type": "prediction", "entities": ["BRICS Pay", "mBridge", "SWIFT", "China", "Saudi Arabia", "UAE"], "conviction": "low", "so_what": "De-dollarization payment infrastructure is now an explicit design goal rather than a side effect, worth monitoring even though it's not yet a near-term threat to SWIFT's dominance.", "quote": "sovereignty and de-dollarization are now explicit design goals rather than side effects", "locator": "A more overtly geopolitical version of this dynamic is emerging in BRICS countries", "quote_verified": true}, {"claim": "Europe and China are pursuing divergent tokenized-money strategies — the EU approved opening negotiations on digital euro legislation in July 2026 (explicitly framed by the ECB as protection against non-European card schemes and dollar stablecoins) alongside a bank consortium building the euro-stablecoin Qivalis, while China bans dollar-linked stablecoins, has let banks pay interest on digital yuan wallets since January 2026, and has grown its CIPS messaging system as a SWIFT alternative for trade with sanctioned or sanctions-wary counterparties.", "speaker": "https://www.bcg.com/about/people/experts/inderpreet-batra", "type": "data_point", "entities": ["European Central Bank", "Digital euro", "Qivalis", "China", "Digital yuan", "CIPS"], "conviction": "medium", "so_what": "Regional monetary blocs are building parallel, non-dollar settlement rails as explicit sovereignty policy — a multi-year theme for currency/settlement infrastructure investors to track, not a near-term dollar-displacement event.", "quote": null, "locator": "Tokenized Money", "quote_verified": false}]}], "insight_total": 18, "top_entities": ["Payments industry", "Stablecoins", "BRICS Pay", "mBridge", "Pix", "UPI", "Digital euro", "China", "Tokenized deposits", "J.P. Morgan", "S&P 500", "North America"], "source_meta": {"author": "https://www.bcg.com/about/people/experts/inderpreet-batra", "word_count": 2625, "paywalled": false}}, {"record_id": "4b1b424fc32de48a", "source_type": "concepts", "source_name": "Bessemer Venture Partners", "source_url": "https://www.bvp.com/news/5-75-billion-to-back-the-founders-building-what-s-next", "title": "$5.75 billion to back the founders building what’s next", "published_date": "", "language": "en", "processed_at": "2026-09-24T11:16:05Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI", "Positioning"], "gist": "Bessemer Venture Partners raised $5.75 billion in a single close ($1.75B for seed/early-stage, $4B for growth) to keep backing AI-native founders across the full stack, and explicitly maps its new bets (DriveNets, fal, Fireworks, ClickHouse, EliseAI, Waymo, Saronic) onto pattern-recognition carried over from past investments (Mellanox, Twilio/Auth0, Toast/ServiceTitan/Procore, Rocket Lab).", "themes": [{"theme": "Fund size and capital split", "insights": [{"claim": "Bessemer raised $5.75 billion in new capital in a single close, split into $1.75 billion for seed and early-stage investing and $4 billion for growth investing.", "speaker": "Bessemer Venture Partners", "type": "data_point", "entities": ["Bessemer Venture Partners"], "conviction": "high", "so_what": "A dedicated $4B growth pool signals BVP will compete more aggressively for late-stage and pre-IPO AI rounds, adding a well-capitalized bidder to that market.", "quote": "we're announcing $5.75 billion in new capital to continue that work amidst this AI era: $1.75 billion for seed and early-stage investing and $4 billion for growth, raised in a single close.", "locator": "Today, we're announcing $5.75 billion", "quote_verified": true}, {"claim": "Roughly 70 percent of Bessemer's investments are made at the early stage, meaning the firm's deal volume still skews heavily seed/early despite the large growth fund.", "speaker": "Bessemer Venture Partners", "type": "data_point", "entities": ["Bessemer Venture Partners"], "conviction": "high", "so_what": "The $4B growth pool likely funds fewer, larger, more concentrated bets rather than broad-based late-stage deployment, so watch for outsized checks in a small number of AI winners.", "quote": "Roughly 70 percent of our investments are made at the early stage.", "locator": "Roughly 70 percent of our investments", "quote_verified": true}]}, {"theme": "Growth strategy repositioning", "insights": [{"claim": "Bessemer's growth investing has evolved from simply doubling down on its own early-stage winners into a standalone engine with a dedicated team that leads concentrated growth bets in top companies regardless of whether they started in Bessemer's portfolio.", "speaker": "Bessemer Venture Partners", "type": "thesis", "entities": ["Bessemer Venture Partners"], "conviction": "high", "so_what": "BVP is now an active outside bidder for growth-stage AI deals it did not originate, expanding the competitive set founders and co-investors should expect at late-stage AI financings.", "quote": null, "locator": "Our growth strategy began as doubling down", "quote_verified": false}]}, {"theme": "AI portfolio scale since 2022", "insights": [{"claim": "Since 2022, Bessemer has backed more than 260 AI-native companies and invested over $3 billion across the full AI stack, spanning compute and infrastructure, foundation models, developer platforms, and AI applications/agents.", "speaker": "Bessemer Venture Partners", "type": "data_point", "entities": ["Bessemer Venture Partners"], "conviction": "high", "so_what": "Gives a concrete benchmark (260+ companies, $3B+) for BVP's AI deployment pace since the post-ChatGPT inflection, useful for comparing against peer VC AI exposure.", "quote": "Since 2022, we've backed 260+ AI-native companies – investing more than $3 billion across the full stack", "locator": "Since 2022, we've backed 260+", "quote_verified": true}]}, {"theme": "AI as economy-wide paradigm shift", "insights": [{"claim": "Bessemer frames AI as creating value faster than any prior technology paradigm shift and as having already become the central nervous system across every sector of the economy, justifying capital deployment across the entire AI stack rather than a single layer.", "speaker": "Bessemer Venture Partners", "type": "thesis", "entities": ["AI"], "conviction": "high", "so_what": "Supports a thesis that AI investment broadens beyond compute/infrastructure into every vertical, arguing against a narrowing of AI capital to infra-only plays.", "quote": "AI is creating more value, faster than any previous paradigm shift, and has quickly established itself as the central nervous system across every sector of the economy.", "locator": "There's no question that the moment", "quote_verified": true}]}, {"theme": "Pattern recognition reused across tech cycles", "insights": [{"claim": "Bessemer's networking-fabric investment in Mellanox (whose technology now connects GPU clusters powering modern AI) directly informed its later investment in DriveNets, and its earlier API-platform lessons from Twilio and Auth0 led it to back fal, Fireworks, and ClickHouse as infrastructure 'picks and shovels' of the AI build-out.", "speaker": "Bessemer Venture Partners", "type": "framework", "entities": ["Mellanox", "DriveNets", "Twilio", "Auth0", "fal", "Fireworks", "ClickHouse"], "conviction": "high", "so_what": "Bessemer explicitly reuses prior infrastructure and API-platform pattern recognition to source new AI infra bets, a repeatable signal for predicting its next networking/dev-platform investments.", "quote": "Twilio and Auth0 taught us what turns an API into a platform; that's why we backed fal, Fireworks and ClickHouse as the picks and shovels of the AI build-out.", "locator": "We backed Mellanox, whose networking fabric", "quote_verified": true}, {"claim": "Board experience at vertical SaaS leaders Toast, ServiceTitan, and Procore taught Bessemer where traditional software hits its ceiling, and that same pattern recognition led it to back EliseAI, EvenUp, and Legora as AI-native products breaking through where legacy vertical software stalled.", "speaker": "Bessemer Venture Partners", "type": "framework", "entities": ["Toast", "ServiceTitan", "Procore", "EliseAI", "EvenUp", "Legora"], "conviction": "high", "so_what": "Signals BVP is actively hunting for AI-native disruptors of legacy vertical SaaS incumbents in its own past portfolio (e.g., healthcare, legal, insurance ops), a sourcing pattern investors can track for future deal flow.", "quote": null, "locator": "Years on the boards of Toast, ServiceTitan", "quote_verified": false}, {"claim": "Bessemer's deep-tech/hardware underwriting experience from Rocket Lab, where capital intensity and regulatory timelines had to be solved simultaneously, gave it the conviction to back Waymo and Saronic in defense tech and physical AI.", "speaker": "Bessemer Venture Partners", "type": "framework", "entities": ["Rocket Lab", "Waymo", "Saronic"], "conviction": "high", "so_what": "Marks defense tech and physical AI/robotics as a deliberate expansion category for BVP built on hardware-underwriting muscle, a category worth watching for its next moves.", "quote": null, "locator": "investments in deep tech and hardware like Rocket Lab", "quote_verified": false}]}], "insight_total": 8, "top_entities": ["Bessemer Venture Partners", "Anthropic", "Waymo", "ClickHouse", "Fireworks", "Mellanox", "DriveNets", "Rocket Lab", "Saronic", "Toast", "EliseAI", "fal"], "source_meta": {"author": "", "word_count": 636, "paywalled": false}}, {"record_id": "618630364de2d820", "source_type": "concepts", "source_name": "Dimensional Fund Advisors", "source_url": "https://www.dimensional.com/us-en/insights/qa-with-climate-scientist-david-victor-part-2-ai-data-centers-and-resources", "title": "Q&A with Climate Scientist David Victor, Part 2: AI Data Centers and Resources | Dimensional", "published_date": "2026-09-22", "language": "en", "processed_at": "2026-09-24T11:16:12Z", "processor": "claude-code-sub-opus", "tags": ["Energy", "AI", "Tech", "Geopolitics", "Macro"], "gist": "Climate scientist David Victor argues AI data centers are approaching 5% of US power demand and are defaulting to natural gas because speed, not cleanliness, wins the 'first to power' race, while speculative grid interconnection requests, hyped small modular reactor deals, and water-scarcity fears are largely distractions from the real story: a US-China gap in power access that is turning electricity into a strategic asset for the AI race.", "themes": [{"theme": "Data center power demand and the gas default", "insights": [{"claim": "Data centers are racing on a 'first to power' business model, choosing natural gas as their default power source because it is the cheapest and fastest option in most of the US, not because it is cleanest.", "speaker": "David Victor", "type": "framework", "entities": ["Data centers", "Natural gas", "AI"], "conviction": "high", "so_what": "Expect continued gas demand growth and gas turbine capex tied to data center buildout, favoring gas infrastructure and equipment names over a pure renewables-led power story in the near term.", "quote": "these companies are in an arms race with each other to get their AI into a variety of applications", "locator": "An interesting feature is that data centers want power fast", "quote_verified": true}, {"claim": "US data center electricity demand is approaching 5% of total US power demand and rising very steeply.", "speaker": "David Victor", "type": "data_point", "entities": ["Data centers", "US power grid"], "conviction": "high", "so_what": "Quantifies the scale of the AI-driven load addition for utility capacity planning and power-demand forecasting models.", "quote": "it's approaching 5% of total power demand and rising very steeply", "locator": "Data centers are certainly a big source of growth", "quote_verified": true}, {"claim": "Victor pushes back on the narrative that data centers are driving the entirety of US emissions growth, calling it 'hyperventilation' since data centers account for roughly 4-5% of total US emissions, comparable to the airline industry.", "speaker": "David Victor", "type": "contrarian", "entities": ["Data centers", "US emissions", "Airlines"], "conviction": "high", "so_what": "Investors modeling ESG/carbon risk should size the data center emissions contribution against a like-for-like sector (airlines) rather than treating it as the dominant driver of the 2025 US emissions uptick.", "quote": "the idea that data centers will cause all the growth in emissions is, to me, a degree of hyperventilation", "locator": "Is the increase in energy demand from data centers high enough", "quote_verified": true}]}, {"theme": "Small modular reactors: hype outrunning delivery", "insights": [{"claim": "Numerous data center companies have signed MOUs for small modular reactor (SMR) nuclear power, but Victor characterizes these deals as 'just press releases' with no operating projects yet, because data centers cannot wait for first-of-a-kind energy projects.", "speaker": "David Victor", "type": "contrarian", "entities": ["Small modular reactors", "Nuclear", "Data centers"], "conviction": "high", "so_what": "Temper near-term SMR-driven demand theses for nuclear equipment and uranium; the MOU pipeline is not yet a revenue or construction pipeline.", "quote": "We've seen a number of data center companies sign memorandums of understanding for small modular reactors—these would be novel nuclear energy supply projects. But so far those are just press releases.", "locator": "We've seen a number of data center companies sign memorandums of understanding", "quote_verified": true}, {"claim": "Once SMRs become truly available and reliable with known costs, Victor expects data centers to become eager buyers of that power.", "speaker": "David Victor", "type": "prediction", "entities": ["Small modular reactors", "Nuclear", "Data centers"], "conviction": "medium", "so_what": "The catalyst to watch for real SMR procurement is cost certainty plus proven reliability, not MOU announcements; that milestone, not press releases, should trigger re-rating of SMR-linked equities.", "quote": null, "locator": "When small reactors become truly available and reliable", "quote_verified": false}]}, {"theme": "Grid planning breakdown and interconnection reform", "insights": [{"claim": "Almost all data center interconnection requests filed with grid operators are speculative and may never materialize into actual power draw, making grid capacity planning extremely difficult compared to five years ago.", "speaker": "David Victor", "type": "causal", "entities": ["Grid operators", "Data centers", "Interconnection queue"], "conviction": "high", "so_what": "Utility and grid capex plans built on current interconnection queues likely overstate real future load; watch for queue reforms (filing fees, escrow requirements) as a leading indicator of which projects are real.", "quote": "almost all interconnection requests are totally speculative, and they may or may not end up needing the power they had requested", "locator": "Can you expand on how it has started to transform the grid?", "quote_verified": true}, {"claim": "Reforms such as higher filing fees and escrow requirements to screen speculative interconnection requests are underway across the grid but are taking time to implement.", "speaker": "David Victor", "type": "data_point", "entities": ["Grid operators", "Interconnection queue"], "conviction": "medium", "so_what": "Track state/regional grid-reform timelines as a gating factor for how fast data center power capacity can actually be brought online.", "quote": null, "locator": "Those reforms are underway in many parts of the grid", "quote_verified": false}, {"claim": "If large loads like data centers become responsive to grid conditions, they could lower overall electricity costs by amortizing the grid's fixed capital cost over much higher throughput, but Victor notes this 'hope and promise' has not yet materialized because it requires a highly responsive grid that does not yet exist.", "speaker": "David Victor", "type": "framework", "entities": ["Grid", "Electricity prices", "Data centers"], "conviction": "medium", "so_what": "A bull case for falling electricity prices exists but is conditional on demand-response infrastructure and utility rate design catching up; not yet investable as a realized trend.", "quote": "these new power loads are taking a very expensive capital asset, which is the grid, and amortizing that asset over a much larger throughput of electricity", "locator": "In theory, data centers could be a boon to political forces", "quote_verified": true}, {"claim": "Who pays for new grid infrastructure driven by data center interconnection is a live political question, arriving at a time when US electricity prices are already broadly rising and affordability is a top political concern.", "speaker": "David Victor", "type": "thesis", "entities": ["Electricity prices", "Grid infrastructure", "US politics"], "conviction": "high", "so_what": "Electricity affordability is becoming a political flashpoint; expect rate-case and regulatory friction risk for utilities serving large data center loads.", "quote": null, "locator": "A key political question is who is going to pay for this grid infrastructure", "quote_verified": false}]}, {"theme": "Demand flexibility and the US-China power gap", "insights": [{"claim": "Data centers are sorting compute workloads into high-priority (immediate, like an on-demand AI image request) and low-priority (deferrable over a day or more) categories to shift load away from grid peak periods.", "speaker": "David Victor", "type": "framework", "entities": ["Data centers", "AI compute", "Grid"], "conviction": "high", "so_what": "Data center demand may be more flexible than headline capacity numbers suggest, potentially reducing the need for new peaker-plant capacity if load-shifting scales.", "quote": null, "locator": "Data centers want to figure out which compute requirements", "quote_verified": false}, {"claim": "AI companies are now pushing for other grid loads, including power-hungry industrial loads, to become more responsive as well, spreading demand-flexibility pressure beyond the data center sector itself.", "speaker": "David Victor", "type": "causal", "entities": ["Industrial loads", "AI", "Grid"], "conviction": "medium", "so_what": "Demand-response technology and services providers could see a broader addressable market as AI-driven pressure extends flexibility requirements into heavy industry.", "quote": null, "locator": "we are starting to see more pressure from AI companies", "quote_verified": false}, {"claim": "US AI compute is largely power-constrained, while new AI-related loads in China face far fewer problems accessing power, making power access a strategic asset in the AI competition between the two countries.", "speaker": "David Victor", "type": "thesis", "entities": ["China", "United States", "AI", "Power grid"], "conviction": "high", "so_what": "US grid build-out speed is a national AI-competitiveness variable versus China; slow US interconnection and permitting timelines are a tangible risk factor for the pace of US AI infrastructure scaling.", "quote": "new AI-related loads in China seem to be having many fewer problems getting access to power. Up to a point, access to power has become a strategic asset for the AI revolution.", "locator": "most AI-related compute loads are in the United States", "quote_verified": true}]}, {"theme": "Water usage: overstated risk", "insights": [{"claim": "Victor sees no significant water consumption issue from data centers because new large facilities typically use closed-loop cooling systems that continuously recirculate water rather than open-loop evaporative systems that consume it.", "speaker": "David Victor", "type": "contrarian", "entities": ["Data centers", "Water usage"], "conviction": "high", "so_what": "Investors should discount water-scarcity as a material ESG or cost risk factor for modern data center builds; it is not the constraint the headlines suggest.", "quote": "the big new data centers are typically closed-loop systems that continuously recirculate the water in various ways, use the heat for various purposes, and do not consume significant amounts of water", "locator": "Water is one of those topics that once it's in the news", "quote_verified": true}, {"claim": "79% of water drawn from the Colorado River goes to agriculture, which is priced below residential and industrial rates, meaning any future water-pricing reform would primarily hit agriculture, not data centers.", "speaker": "David Victor", "type": "data_point", "entities": ["Colorado River", "Agriculture", "Water pricing"], "conviction": "high", "so_what": "Regulatory or ESG focus on data center water use is largely misplaced; agricultural water pricing reform, not data center restrictions, is the more consequential policy lever to watch in Western water markets.", "quote": "79% of the water drawn from the Colorado River goes to agriculture", "locator": "Interestingly, water pricing and water allocation in the US", "quote_verified": true}]}, {"theme": "AI's dual-use energy trajectory", "insights": [{"claim": "It remains an open question whether AI will ultimately favor renewable energy or fossil fuels, since the same AI capabilities that enable running complex, renewables-heavy low-emission grids also make it easier to run complex refineries and find and produce oil and coal.", "speaker": "David Victor", "type": "thesis", "entities": ["AI", "Renewable energy", "Fossil fuels", "Oil", "Coal"], "conviction": "medium", "so_what": "Do not treat AI as a one-directional clean-energy tailwind; it is a dual-use efficiency technology that also boosts fossil fuel extraction and refining, so hedge exposure across both clean and fossil energy sub-sectors rather than assuming AI purely benefits decarbonization plays.", "quote": "There is a great race underway in which clean has a slight advantage, but it's not clear how that's going to play out.", "locator": "It is still an open question as to whether AI", "quote_verified": true}]}], "insight_total": 15, "top_entities": ["David Victor", "Data centers", "AI", "Natural gas", "US power grid", "Small modular reactors", "China", "Colorado River", "Electricity prices", "Nuclear", "Renewable energy"], "source_meta": {"author": "Dimensional Fund Advisors", "word_count": 3121, "paywalled": false}}, {"record_id": "327d10ab55c51e2f", "source_type": "concepts", "source_name": "Gavekal Research", "source_url": "https://research.gavekal.com/teaser/the-four-costs-that-matter/", "title": "The Four Costs That Matter", "published_date": "2026-09-23", "language": "en", "processed_at": "2026-09-24T00:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Positioning"], "gist": "Gave revisits a four-cost framework (capital, labor, energy, government) for comparing major economies, noting the US cost of capital currently runs roughly 350-400bp above China's.", "themes": [{"theme": "Four-cost comparative framework", "insights": [{"claim": "Gavekal periodically re-applies a four-cost framework from Louis-Vincent Gave and Charles Gave's 2013 book Too Different For Comfort — comparing the cost of capital, cost of labor, cost of energy and cost of government across major economies — while acknowledging the exercise is often subjective.", "speaker": "Louis-Vincent Gave", "type": "framework", "entities": ["Gavekal Research", "China", "United States"], "conviction": "medium", "so_what": "Investors comparing country allocations can use this four-lever framework (capital, labor, energy, government cost) as a structured lens, though the authors flag it as inherently subjective rather than precise.", "quote": "In 2013, in a book entitled Too Different For Comfort, Charles and I attempted to look at the major economies through the prism of four important costs: the cost of capital, the cost of labor, the cost of energy and the cost of government.", "locator": "In 2013, in a book entitled Too Different For Comfort", "quote_verified": true}, {"claim": "Of the four costs, cost of capital is the easiest to compare across countries because it can be read directly off short rates, long rates and the shape of yield curves.", "speaker": "Louis-Vincent Gave", "type": "framework", "entities": ["China", "United States"], "conviction": "medium", "so_what": "Yield-curve comparisons remain the most tractable cross-country signal in this framework, useful as a quick relative-value check versus the harder-to-quantify labor, energy and government cost components.", "quote": "Comparing and contrasting the cost of capital between different countries is undeniably the easiest task of the four.", "locator": "Comparing and contrasting the cost of capital between different countries", "quote_verified": true}, {"claim": "As of September 2026, the cost of capital in the US is roughly 350-400 basis points more expensive than in China.", "speaker": "Louis-Vincent Gave", "type": "data_point", "entities": ["United States", "China"], "conviction": "high", "so_what": "A ~350-400bp US-China cost-of-capital gap underscores a persistent funding-cost advantage for China, relevant to relative equity/credit valuation and carry-trade positioning between the two economies.", "quote": "For example, today, the cost of capital in the US is roughly 350bp to 400bp more expensive than it is in China.", "locator": "For example, today, the cost of capital", "quote_verified": true}]}], "insight_total": 3, "top_entities": ["Gavekal Research", "Louis-Vincent Gave", "Charles Gave", "United States", "China"], "source_meta": {"author": "", "word_count": 164, "paywalled": false}}, {"record_id": "875d1c7027b79f39", "source_type": "concepts", "source_name": "Gavekal Research", "source_url": "https://research.gavekal.com/teaser/the-export-wave-is-cresting/", "title": "The Export Wave Is Cresting", "published_date": "2026-09-23", "language": "en", "processed_at": "2026-09-24T00:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "AI", "Tech"], "gist": "China's extraordinary export boom is leveling off, with headline YoY growth stuck around 24-27% (USD terms) for three months; memory chips are now the key swing factor, and Gavekal expects total 2027 export growth to converge toward the non-AI
