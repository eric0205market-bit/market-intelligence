6 People Survey"], "conviction": "high", "so_what": "Employee sentiment toward GenAI in knowledge-work firms is strongly positive, lowering change-management friction for enterprise rollouts.", "quote": null, "locator": "Experimentation spread quickly. By early 2026", "quote_verified": false}, {"claim": "Nearly 100% of BCG's 33,000-plus employees voluntarily reached level 1 of the tool-agnostic AI Fluency Ladder within four months, and more than 20% completed the highly technical level 4 certification.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["AI Fluency Ladder", "BCG"], "conviction": "high", "so_what": "Mass upskilling is achievable quickly in professional-services firms; a meaningful technical tier (20%+) can form inside non-engineering organizations.", "quote": "To leaders’ surprise, nearly 100% of employees voluntarily achieved level 1 after four months", "locator": "The Fluency Ladder therefore measures technical", "quote_verified": true}, {"claim": "BCG U productized the internal AI Fluency Ladder for clients, and it quickly became one of its most in-demand programs — internal AI transformation is being monetized as a consulting offering.", "speaker": "BCG Henderson Institute", "type": "anecdote", "entities": ["BCG U", "AI Fluency Ladder"], "conviction": "medium", "so_what": "Consultancies are turning their own AI adoption into sellable products, signaling strong enterprise demand for AI training services.", "quote": null, "locator": "The Fluency Ladder therefore measures technical", "quote_verified": false}, {"claim": "Peer demonstration is more persuasive than formal training for AI adoption: seeing a respected colleague do something remarkable with AI drives uptake.", "speaker": "BCG Henderson Institute", "type": "causal", "entities": ["Alicia Pittman", "BCG"], "conviction": "medium", "so_what": "Enterprise AI rollouts should invest in champion networks and peer learning, not just top-down training.", "quote": "“When a colleague sees someone they respect do something remarkable with AI, it’s more persuasive than any training program you can run,” said Alicia Pittman", "locator": "Peer learning became part of the model.", "quote_verified": true}]}, {"theme": "Deploy-Reshape-Invent framework and the 10-20-70 rule", "insights": [{"claim": "BCG frames AI transformation as Deploy (widespread use plus fluency and safeguards), Reshape (redesign workflows, knowledge, organization) and Invent (new outcomes and client value), with the three run in parallel rather than in sequence.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["Deploy, Reshape, and Invent", "BCG"], "conviction": "high", "so_what": "Companies that treat AI as a sequential rollout (pilot then scale then innovate) may lag those pursuing all three tracks simultaneously.", "quote": "The three have developed in parallel rather than in sequence, informing one another.", "locator": "Much of the journey has followed a framework", "quote_verified": true}, {"claim": "BCG's 10-20-70 principle allocates 10% of AI transformation effort to algorithms, 20% to technology and data, and 70% to people, processes, and ways of working.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["10-20-70 principle", "BCG"], "conviction": "high", "so_what": "The binding constraint on enterprise AI value is organizational change, not model capability — favoring change-management and services spend over pure tech spend.", "quote": "But the bulk of the transformation—70%—is about people, processes, and ways of working.", "locator": "These questions are already reshaping BCG’s knowledge", "quote_verified": true}, {"claim": "BCG plans to invest more than $3 billion in AI over the next three years.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["BCG"], "conviction": "high", "so_what": "Top consultancies are committing multi-billion budgets to AI, intensifying competition in AI-enabled professional services.", "quote": "BCG plans to invest more than $3 billion in AI over the next three years.", "locator": "From the beginning, BCG invested in its people", "quote_verified": true}, {"claim": "BCG's CEO argues AI transformation will be as much a change-management effort as a technology one and must be owned at the top.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": ["Christoph Schweizer", "BCG"], "conviction": "high", "so_what": "CEO-level ownership is a prerequisite signal when evaluating whether a company's AI program will create value.", "quote": "“It will be as much a change management effort as a tech one. It has to be owned at the top.”", "locator": "Some of these transformation decisions are familiar", "quote_verified": true}]}, {"theme": "Proprietary context as the moat as models commoditize", "insights": [{"claim": "As foundation models become widely available, the model itself will not be a lasting source of advantage; differentiation shifts to proprietary knowledge, client context, and accumulated experience.", "speaker": "BCG Henderson Institute", "type": "contrarian", "entities": ["foundation models", "BCG"], "conviction": "high", "so_what": "Value accrues to owners of proprietary data and domain context rather than to model access alone — a bearish signal for undifferentiated model-wrapper businesses and bullish for incumbents with deep proprietary data.", "quote": "As foundation models become more widely available, BCG does not expect the model itself to be the lasting source of advantage.", "locator": "As foundation models become more widely available", "quote_verified": true}, {"claim": "BCG built a 'context layer' of persistent case context and practice-level knowledge graphs that grounds AI in a specific client and case.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["BCG", "knowledge graphs"], "conviction": "medium", "so_what": "Context engineering (knowledge graphs, persistent shared context) is becoming core enterprise AI infrastructure.", "quote": null, "locator": "BCG has built a context layer", "quote_verified": false}, {"claim": "BCG first built its own technology to connect AI models with internal data because no external solution fit, then abandoned those bespoke programs once superior external tools caught up.", "speaker": "BCG Henderson Institute", "type": "anecdote", "entities": ["BCG"], "conviction": "medium", "so_what": "Early build-vs-buy decisions in AI infrastructure depreciate fast; flexibility to switch to external tooling is a capability in itself, and vendors catching up commoditize in-house builds.", "quote": "In a market moving this quickly, the ability to adapt matters as much as getting the initial choice right.", "locator": "It is critical for that foundation", "quote_verified": true}, {"claim": "Assets from the first wave of BCG's program converting methodologies and proprietary data into reusable AI workflows were used in more than 1,500 cases and proposals within the first few months.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["BCG", "Applied AI Marketplace"], "conviction": "high", "so_what": "Centralized reusable AI assets can scale fast inside decentralized organizations when backed by common architecture.", "quote": null, "locator": "This is increasingly happening at scale.", "quote_verified": false}]}, {"theme": "AI-native teams and the limits of the productivity story", "insights": [{"claim": "AI-native case teams work from a shared case knowledge base of documents, meeting notes and transcripts, so context no longer passes manually between people; consultants use AI for a first pass and project leaders orchestrate people and AI as one team.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["BCG", "AI-native case teams"], "conviction": "medium", "so_what": "The consulting team pyramid is being restructured — less junior first-pass work, more orchestration and client time — with implications for leverage models and hiring.", "quote": null, "locator": "An AI-native case team works with", "quote_verified": false}, {"claim": "Faster AI output creates more review work for senior team members, and faster analysis does not let clients make decisions or absorb organizational change at the same pace.", "speaker": "BCG Henderson Institute", "type": "contrarian", "entities": ["BCG"], "conviction": "high", "so_what": "Productivity gains from AI are bottlenecked by human review capacity and client absorption speed, so headline speedups overstate realized throughput.", "quote": "But more output can create more review work for senior team members, and faster analysis does not mean that a client can make decisions or absorb organizational change at the same pace.", "locator": "Early experience has also revealed the", "quote_verified": true}, {"claim": "Within three months nearly 1,000 BCG managers completed AI-first team bootcamps, with AI norms set at kickoff and regular retrospectives built into team rhythm.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["BCG"], "conviction": "medium", "so_what": "Operating-rhythm changes, not just tools, are being institutionalized at scale.", "quote": null, "locator": "New team rhythms support that shift", "quote_verified": false}, {"claim": "As agents do more work, organizations face a second-order challenge of deciding who owns agents, who keeps them current, and who is accountable for their output; at BCG domain experts increasingly own AI workflows while engineering builds and runs the technology.", "speaker": "BCG Henderson Institute", "type": "causal", "entities": ["BCG"], "conviction": "medium", "so_what": "Agent governance and ownership is an emerging organizational design problem — and a services opportunity.", "quote": "This emerging approach creates a second-order challenge: as agents do more, organizations have to decide who owns them, who keeps them current, and who is accountable for their output.", "locator": "This emerging approach creates a second-order", "quote_verified": true}]}, {"theme": "Agents in practice and changed delivery economics", "insights": [{"claim": "BCG's Operating Model Agent, combining AI with BCG methodologies and proprietary data for organization design, delivered cycle-time improvements of two to three times for some work in internal assessments, with expert review retained.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["Operating Model Agent", "BCG"], "conviction": "medium", "so_what": "Domain-specific agents yield 2–3x speedups on parts of knowledge work, not wholesale replacement.", "quote": "Internal assessments have found cycle-time improvements of two to three times for some of the work, with expert review and judgment retained.", "locator": "One example is BCG’s Operating Model Agent", "quote_verified": true}, {"claim": "BCG's cost diagnostic agent takes a company name and a question and within an hour returns peer benchmarks, the client's P&L mapped to BCG's cost taxonomy, savings sized by category, and a list of relevant BCG experts.", "speaker": "BCG Henderson Institute", "type": "anecdote", "entities": ["BCG", "cost diagnostic agent"], "conviction": "medium", "so_what": "Diagnostic work that once took consulting teams days is collapsing to an hour, compressing the value of the early phase of engagements.", "quote": null, "locator": "Another example is a cost diagnostic", "quote_verified": false}, {"claim": "AI could let large ERP or system migrations be done with roughly 20 people instead of 100 and in 5 years instead of 10, making previously uneconomic transformations feasible.", "speaker": "BCG Henderson Institute", "type": "prediction", "entities": ["Nicolas De Bellefonds", "BCG", "ERP"], "conviction": "exploratory", "so_what": "If realized, AI compresses headcount-heavy systems-integration economics — a threat to labor-intensive IT services models and a potential demand expander for transformations.", "quote": "“What if I can do this not with 100 people but with 20, and not in 10 years but in 5?”", "locator": "In ERP or other large system", "quote_verified": true}, {"claim": "BCG X's Deep Customer Engagement AI combines agentic AI, data, technology and operating-model change into a technology-enabled solution for managing customer relationships, illustrating consultancies moving into productized AI.", "speaker": "BCG Henderson Institute", "type": "anecdote", "entities": ["BCG X", "Deep Customer Engagement AI"], "conviction": "medium", "so_what": "Strategy consultancies are shifting toward product and build revenue, competing more directly with software and IT-services vendors.", "quote": null, "locator": "One example is Deep Customer Engagement", "quote_verified": false}, {"claim": "BCG says it enlists top AI frontier labs, hyperscalers and other tech players as needed, positioning itself as integrator of strategy, expertise, technology build and execution.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": ["BCG", "hyperscalers"], "conviction": "low", "so_what": "Consultancies position as orchestration layer between frontier labs/hyperscalers and enterprises.", "quote": null, "locator": "This is where BCG’s combination", "quote_verified": false}]}, {"theme": "Market-wide AI value gap", "insights": [{"claim": "BCG's 2026 Applied AI Index found only 7.5% of companies are 'future-built', generating sustained value and competitive advantage from AI.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["Applied AI Index", "BCG"], "conviction": "high", "so_what": "The vast majority of firms are not yet extracting durable value from AI — a large gap between leaders and laggards that should widen dispersion of outcomes.", "quote": "Its 2026 Applied AI Index found that only 7.5% of companies are future-built", "locator": "BCG’s own research illustrates why", "quote_verified": true}, {"claim": "A BCG study of CEOs found high performers were roughly seven times as likely as others to redesign workflows and reshape the business end-to-end with AI.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["BCG"], "conviction": "high", "so_what": "Workflow redesign, not tool deployment, is the differentiator between AI winners and laggards.", "quote": null, "locator": "BCG’s own research illustrates why", "quote_verified": false}, {"claim": "As agents take on more work, human ownership, review and judgment become more important, not less.", "speaker": "BCG Henderson Institute", "type": "contrarian", "entities": ["BCG"], "conviction": "medium", "so_what": "Human accountability layers remain a durable cost and design requirement in agentic deployments, tempering full-automation assumptions.", "quote": "As agents take on more work, human ownership, review, and judgment become more important, not less.", "locator": "A Living Transformation", "quote_verified": true}]}], "insight_total": 25, "top_entities": ["BCG", "Christoph Schweizer", "BCG X", "AI Fluency Ladder", "Operating Model Agent", "Applied AI Index", "10-20-70 principle", "foundation models", "Nicolas De Bellefonds", "Alicia Pittman", "Applied AI Marketplace"], "source_meta": {"author": "", "word_count": 2916, "paywalled": false}}, {"record_id": "21605a236d2888fe", "source_type": "concepts", "source_name": "BCG Henderson Institute", "source_url": "https://www.bcg.com/publications/2026/luxury-brands-customers-feel-known", "title": "The Luxury of Being Known", "published_date": "2026-11-11", "language": "en", "processed_at": "2026-11-12T11:09:30Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Society"], "gist": "BCG's 2026 Experiential Luxury Survey (436 qualified respondents across North America, Europe and Asia) finds luxury brands lose value when customer knowledge fails to travel between visits, channels and service: 34% of returning clients are treated as new, ers say their profile with the brand does not carry from one location to another", "locator": "Recognition and personalization: Customers should not", "quote_verified": true}, {"claim": "BCG recommends luxury brands track customer recognition as a formal business metric alongside conversion and satisfaction.", "speaker": "Vanessa Lyon", "type": "framework", "entities": ["BCG"], "conviction": "medium", "so_what": "A new KPI could become a lens for evaluating luxury operators' execution quality.", "quote": "Brands should consider tracking recognition as a formal business metric alongside conversion and satisfaction.", "locator": "Customers rank a portable profile across", "quote_verified": true}]}, {"theme": "Physical store remains the core channel", "insights": [{"claim": "87% of luxury customers shop mostly in-store or split shopping equally between stores and online, so the physical store remains central to luxury.", "speaker": "Vanessa Lyon", "type": "data_point", "entities": ["BCG"], "conviction": "high", "so_what": "Contrarian to digital-first narratives: luxury store networks remain strategic assets rather than stranded costs.", "quote": "87% of luxury customers shop mostly in-store or split their shopping equally between stores and online channels", "locator": "The disconnect matters because the physical", "quote_verified": true}, {"claim": "Digital adoption is not a reason for luxury brands to pull investment away from physical stores; they should double down on associate quality, environment and the sense of being known.", "speaker": "Vanessa Lyon", "type": "contrarian", "entities": ["BCG"], "conviction": "high", "so_what": "Supports continued capex in flagship retail and associate training among luxury houses.", "quote": "Digital adoption is not a reason to pull investments away from the physical experience.", "locator": "Keep the store at the center", "quote_verified": true}, {"claim": "The luxury problem is not the store but the relationship: weakness lies less in what associates deliver in the moment than in what the brand enables them to remember between interactions.", "speaker": "Vanessa Lyon", "type": "thesis", "entities": ["BCG"], "conviction": "high", "so_what": "Reframes luxury underperformance as an information-infrastructure problem rather than a channel or staffing problem.", "quote": "The store isn’t the problem luxury brands need to solve. The relationship is.", "locator": "The Relationship Is the Advantage", "quote_verified": true}]}, {"theme": "Shifting luxury customer base", "insights": [{"claim": "Luxury brands face a customer base that is broader, less loyal and increasingly influenced by AI and social networks, as wealth shifts to a new generation of affluent consumers.", "speaker": "Vanessa Lyon", "type": "thesis", "entities": ["AI"], "conviction": "high", "so_what": "Generational wealth transfer erodes legacy loyalty, raising customer-acquisition and retention costs for incumbent luxury houses.", "quote": "Luxury brands face a customer base that is broader, less loyal, and increasingly influenced by AI and social networks.", "locator": "The Old Luxury Relationship Model Is", "quote_verified": true}, {"claim": "Loyalty in luxury is becoming more conditional: even highly valuable customers spread spending across multiple brands, raising the premium on recognition and a trusted human relationship.", "speaker": "Vanessa Lyon", "type": "causal", "entities": [], "conviction": "medium", "so_what": "Share-of-wallet competition among top clients intensifies; brands with superior clienteling should gain share.", "quote": null, "locator": "Wealth is shifting to a new generation", "quote_verified": false}, {"claim": "AI is becoming an important gateway to luxury discovery and consideration, and purchases are increasingly shaped by family members, peers and creators rather than only the individual buyer.", "speaker": "Vanessa Lyon", "type": "prediction", "entities": ["AI"], "conviction": "medium", "so_what": "Luxury marketing must adapt to AI-mediated search and household/creator influence; relationship models built around single buyers become obsolete.", "quote": "AI is becoming an important gateway to discovery and consideration", "locator": "Wealth is shifting to a new generation", "quote_verified": true}, {"claim": "Many luxury brands ask associates to deliver relationship-based service on transaction-based infrastructure, and training cannot compensate for fragmented information and disconnected systems.", "speaker": "Vanessa Lyon", "type": "causal", "entities": [], "conviction": "high", "so_what": "Points to IT/data integration spending (unified profiles, inventory visibility) as the binding constraint on luxury service quality.", "quote": "Many luxury brands are asking associates to deliver relationship-based service with transaction-based infrastructure.", "locator": "Wealth is shifting to a new generation", "quote_verified": true}, {"claim": "All four luxury continuity failures (recognition, after-sales, follow-up, technology) share one root cause: brands lack the organizational memory to carry customer knowledge from one interaction to the next.", "speaker": "Vanessa Lyon", "type": "framework", "entities": ["BCG"], "conviction": "high", "so_what": "A single fix (unified customer record) addresses multiple failure points, making it the highest-leverage investment.", "quote": "luxury brands too often lack the organizational memory to carry customer knowledge, context, and care from one interaction to the next", "locator": "The disconnect matters because the physical", "quote_verified": true}]}, {"theme": "After-sales and post-purchase neglect", "insights": [{"claim": "96% of luxury customers say a poor after-sales experience would reduce their loyalty, spending or future purchases.", "speaker": "Vanessa Lyon", "type": "data_point", "entities": ["BCG"], "conviction": "high", "so_what": "After-sales service is a high-sensitivity driver of lifetime value in luxury und 8% goes into residual waste, and about 5% is reported as illegally exported.", "speaker": "Patrick Herhold", "type": "data_point", "entities": ["Europe", "e-waste"], "conviction": "medium", "so_what": "Scrap-metal routing destroys critical-mineral value; formal recovery operators with better processing stand to gain share as regulation tightens.", "quote": "an estimated 13% of European e-waste is absorbed by scrap metal channels that recover bulk steel but lose refrigerants, plastics, and critical minerals", "locator": "Instead, the problem is often one", "quote_verified": true}, {"claim": "Recyclers are paid by tonnage processed, which rewards recovering bulk metal over critical minerals even though critical minerals hold 75% of the material value in e-waste.", "speaker": "Patrick Herhold", "type": "causal", "entities": ["recyclers", "critical minerals", "e-waste"], "conviction": "high", "so_what": "Misaligned recycler incentives are a structural barrier; business models that pay for value recovered rather than tonnage could unlock trapped mineral value.", "quote": "recyclers are paid by tonnage processed; this rewards recovery of bulk metal over that of the critical minerals", "locator": "There are trade-offs, however", "quote_verified": true}]}, {"theme": "Value hierarchy: keep products whole before recycling", "insights": [{"claim": "Circular value follows a hierarchy — preserving product life through design; then reuse, resale, repair, refurbishment and product-as-a-service; then component harvesting, remanufacturing and finally recycling — and higher tiers capture far more value.", "speaker": "Patrick Herhold", "type": "framework", "entities": ["product-as-a-service"], "conviction": "high", "so_what": "Recycling is the lowest-value exit; companies and investors should prioritize life-extension and resale models over pure material recovery.", "quote": "Circular value has a hierarchy: preserving product life through design", "locator": "Circular value has a rks against circularity.", "speaker": "Patrick Herhold", "type": "causal", "entities": [], "conviction": "medium", "so_what": "Unit-volume incentive structures must be redesigned before circular models can scale inside incumbents.", "quote": "payments are frequently made by units shipped, so a product kept in use is one not sold", "locator": "There are trade-offs, however", "quote_verified": true}]}, {"theme": "Sector-specific circular plays", "insights": [{"claim": "Circularity priorities differ by sector: mechanical engineering should retain installed-base value via repair, refurbishment and remanufacturing; construction value sits in renovation/retrofit and higher-quality recycling of concrete, steel, aluminum, glass, wood and plastics.", "speaker": "Patrick Herhold", "type": "framework", "entities": ["mechanical engineering", "construction"], "conviction": "medium", "so_what": "Aftermarket service revenue on installed bases and retrofit activity are the near-term circular profit pools in industrials and building.", "quote": null, "locator": "Circularity’s starting points also differ by sector", "quote_verified": false}, {"claim": "In mobility the incremental opportunity is component remanufacturing and battery and material recovery (repair is already an established aftermarket); in energy it is life extension, component reuse and second-life batteries; in textiles it is resale, rental, repair and ultimately fiber-to-fiber recycling.", "speaker": "Patrick Herhold", "type": "framework", "entities": ["mobility", "energy", "textiles", "second-life batteries"], "conviction": "medium", "so_what": "Battery recovery and second-life batteries emerge as cross-sector opportunities spanning mobility and energy.", "quote": "the incremental opportunity lies in component remanufacturing and battery and material recovery", "locator": "In the mobility sector, auto repair", "quote_verified": true}]}, {"theme": "Germany circular economy sizing (BCG-BDI)", "insights": [{"claim": "B n": "high", "so_what": "The crisis widened gaps across the entire distribution, not just at one tail.", "quote": "the share of net wealth owned by the wealthiest households (top 10%) increased from 50.8% to 52.6%, while the share of the poorer half dropped from 6.0% to 5.4%", "locator": "More precisely, the share of net", "quote_verified": true}, {"claim": "The 2010-2014 rise in euro area wealth inequality was not driven by the poor becoming poorer or the rich richer in isolation, but by congruent movements across all parts of the distribution at different magnitudes.", "speaker": "Danilo Bianco, Jiri Slacalek and Oreste Tristani", "type": "framework", "entities": ["euro area"], "conviction": "medium", "so_what": "Single-tail narratives (e.g. 'the rich got richer') misdescribe the episode; distributional analysis needs percentile-share metrics, not just Gini.", "quote": "the increase in inequality was not driven by either the poor becoming poorer or the rich richer", "locator": "Building on this general observation, the", "quote_verified": true}, {"claim": "Post-2014 decline in inequality was uneven: the bottom 50% recovered to 6.2% of wealth in 2023 (above 6.0% in 2010), yet the top 10% share remained at 51.8%, a full point above 2010, and P90/P50 stayed at 5 from 2014 to 2023.", "speaker": "Danilo Bianco, Jiri Slacalek and Oreste Tristani", "type": "data_point", "entities": ["euro area", "top 10%", "bottom 50%", "P90/P50"], "conviction": "high", "so_what": "Headline Gini normalization masks a persistent gain in top-decile concentration; the 'middle' lost relative ground.", "quote": "relative gains at the bottom of the net wealth distribution were not accompanied by losses at the top", "locator": "The decrease in inequality recorded by", "quote_verified": true}, {"claim": "The Gini coefficient cannot distinguish whether higher inequality comes from concentration at the top or reduced prosperity of the middle class, so percentile-based indicators (P90/P50, top-10% s enter construction.", "speaker": "Gavekal Research", "type": "causal", "entities": ["US midterm elections", "data centers"], "conviction": "high", "so_what": "Siting/permitting risk for new US data center capacity rose post-election; capex timelines face local political friction.", "quote": "The US midterm elections have strengthened political support for restrictions on data center construction.", "locator": "The US midterm elections have strengthened", "quote_verified": true}, {"claim": "Gavekal is internally debating whether US data center construction restrictions will merely slow the AI investment boom or halt it entirely, and models both scenarios across the AI supply chain.", "speaker": "Gavekal Research", "type": "framework", "entities": ["Gavekal", "AI investment boom"], "conviction": "exploratory", "so_what": "The bear case for AI capex is now a live house debate, not a tail risk; positioning should consider a halt scenario.", "quote": "whether these will merely slow the artificial intelligence investment boom or bring it to a halt", "locator": "The question, now being debated within", "quote_verified": true}, {"claim": "The impact of data center restrictions would propagate across the AI supply chain, from semiconductor companies and data center operators to frontier AI labs.", "speaker": "Gavekal Research", "type": "framework", "entities": ["semiconductor companies", "data center operators", "frontier AI labs"], "conviction": "medium", "so_what": "Exposure to construction restrictions is not limited to data center REITs/operators; chipmakers and AI labs sit downstream of the same bottleneck.", "quote": "from semiconductor companies and data center operators to frontier AI labs", "locator": "This piece explores both scenarios", "quote_verified": true}]}, {"theme": "Federal backstop: Trump veto protects AI boom", "insights": [{"claim": "Federal legislation is not the main risk to the US AI buildout; the threat comes from restrictions below the federal level.", "speaker": "Gavekal Research", "type": "contrarian", "entities": ["Federal legislation"], "conviction": "high", "so_what": "Monitor state and local zoning/moratorium actions rather than Congress for AI capex risk.", "quote": "Federal legislation is not the concern.", "locator": "Federal legislation is not the concern", "quote_verified": true}, {"claim": "President Donald Trump has reiterated his support for the AI industry since the midterm election and is likely to veto any bills that undermine the AI boom.", "speaker": "Gavekal Research", "type": "prediction", "entities": ["Donald Trump", "AI industry"], "conviction": "high", "so_what": "A presidential veto acts as a ceiling on federal anti-AI legislative risk through the remainder of the term.", "quote": "is therefore likely to veto any bills that undermine the boom", "locator": "President Donald Trump has reiterated", "quote_verified": true}]}, {"theme": "Permitting reform as upside catalyst for power and AI capex", "insights": [{"claim": "The next big change to US federal legislation could be positive for AI capital spending rather than negative.", "speaker": "Gavekal Research", "type": "contrarian", "entities": ["AI capital spending"], "conviction": "medium", "so_what": "Post-election federal policy skew is net supportive for AI capex despite local headwinds.", "quote": "the next big change to federal legislation could be positive for AI capital spending", "locator": "In fact, the next big change", "quote_verified": true}, {"claim": "The lame-duck Congress appears to be moving toward passing permitting reform via the Bipartisan American Affordability And Jobs Act.", "speaker": "Gavekal Research", "type": "prediction", "entities": ["Bipartisan American Affordability And Jobs Act", "Congress"], "conviction": "medium", "so_what": "A near-term legislative catalyst in the lame-duck window; watch passage odds for power/grid infrastructure names.", "quote": "permitting reform through the Bipartisan American Affordability And Jobs Act during the lame-duck session", "locator": "The current Congress appears to be", "quote_verified": true}, {"claim": "If passed, the Bipartisan American Affordability And Jobs Act should shorten approval times for new power infrastructure projects and make existing infrastructure more efficient, removing one potential constraint on future data center growth.", "speaker": "Gavekal Research", "type": "causal", "entities": ["Bipartisan American Affordability And Jobs Act", "power infrastructure", "data centers"], "conviction": "medium", "so_what": "Power availability is a binding constraint on data center growth; permitting reform loosens it, benefiting utilities, grid equipment and data center developers.", "quote": "removing one potential constraint on future data center growth", "locator": "If passed, this should shorten", "quote_verified": true}]}], "insight_total": 8, "top_entities": ["Donald Trump", "Bipartisan American Affordability And Jobs Act", "Gavekal", "Congress", "data center", "semiconductor companies", "frontier AI labs", "permitting reform"], "source_meta": {"author": "", "word_count": 198, "paywalled": false}}, {"record_id": "fda2cd0cf81766fa", "source_type": "concepts", "source_name": "Hussman Funds Commentary", "source_url": "https://www.hussmanfunds.com/comment/mc261110/", "title": "The Free Money Bubble - Hussman Funds", "published_date": "2026-11-10", "language": "en", "processed_at": "2026-11-12T11:10:26Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "AI", "Positioning", "Society"], "gist": "John P. Hussman argues the U.S. equity bubble, sustained for over a decade by three forms of 'free money' (Fed zero-rate base money peaking at 36% of GDP, pandemic deficits, and frantic AI capex), faces ~55-70% full-cycle downside with MarketCap/GVA at ~4.3 vs a 1.1 median. He contends economy-wide corporate profits since 2022 depend on AI investment and deficits, and that AI's labor-displacing logic implies disappointing profits or taxation of dominance rents, while his fund tactically tilts constructive with a safety net and sees Treasury yields as adequate.", "themes": [{"theme": "Bubble call and downside targets", "insights": [{"claim": "John Hussman views the U.S. equity market as a speculative bubble in its late (possibly already rolled-over) stage that will ultimately lose perhaps 70% from current levels.", "speaker": "John P. Hussman", "type": "prediction", "entities": ["S&P 500", "U.S. equity market"], "conviction": "high", "so_what": "A top-tier valuation bear sees 50-70% full-cycle downside; long-only equity exposure carries severe asymmetric risk.", "quote": "I absolutely believe that the U.S. equity market is in a speculative bubble that will end in tears, ultimately losing perhaps 70% from current levels.", "locator": "I should begin this comment", "quote_verified": true}, {"claim": "Hussman's preferred valuation measure (MarketCap/GVA), best correlated with subsequent 10-12 year S&P 500 total returns, peaked around 4.3 in early October 2026 versus a historical median of about 1.1.", "speaker": "John P. Hussman", "type": "data_point", "entities": ["MarketCap/GVA", "S&P 500"], "conviction": "high", "so_what": "Valuations sit roughly 4x the historical norm, implying very low expected 10-12 year equity returns.", "quote": "The peak in early October was about 4.3. The historical median is about 1.1.", "locator": "Valuation review", "quote_verified": true}, {"claim": "There is a potential downside gap of about 70% between the current S&P 500 level and the level consistent with historically normal ~10% annual expected returns.", "speaker": "John P. Hussman", "type": "data_point", "entities": ["S&P 500"], "conviction": "high", "so_what": "Restoring run-of-the-mill 10% forward returns would require a ~70% price decline.", "quote": "there’s a potential downside gap of about 70% between the current level of the S&P 500", "locator": "For any given set of", "quote_verified": true}, {"claim": "Even granting permanently higher profit margins via a margin-adjusted measure (GVA_PE10, a MarketCap/GVA version of Shiller's CAPE), the current reading is over 25 vs a norm under 11 for 10% returns, implying a narrower baseline risk of a ~55% loss over the cycle.", "speaker": "John P. Hussman", "type": "framework", "entities": ["GVA_PE10", "Robert Shiller", "CAPE", "S&P 500"], "conviction": "high", "so_what": "The bearish conclusion survives a generous margin assumption: the floor estimate of cycle downside is still ~55%.", "quote": "The current level is over 25, while the historical norm associated with subsequent 10% annual S&P 500 returns is less than 11.", "locator": "One can make the long-term", "quote_verified": true}, {"claim": "The greatest current investment risk is confusing how long a bubble has persisted with proof that no bubble exists.", "speaker": "John P. Hussman", "type": "contrarian", "entities": ["bubble"], "conviction": "high", "so_what": "Duration of a rally is not evidence of sound valuation; complacency from 'so far, so good' is the key behavioral trap.", "quote": "The greatest investment risk at the moment is the inclination to confuse the length of time a bubble has persisted with proof that a bubble does not exist.", "locator": "The free-money bubble", "quote_verified": true}, {"claim": "Valuations are highly relevant for 10+ year returns but nearly irrelevant for short-term returns, which depend only on collective investor psychology regardless of truth.", "speaker": "John P. Hussman", "type": "framework", "entities": ["valuations", "investor psychology"], "conviction": "high", "so_what": "Don't use valuation as a timing tool; pair long-horizon valuation views with short-horizon behavior/sentiment measures.", "quote": "valuations are often a nearly irrelevant consideration where short-term returns are involved", "locator": "While I’m convinced that these extremes", "quote_verified": true}]}, {"theme": "Three pillars of 'free money'", "insights": [{"claim": "The decade-plus speculative episode rests on three 'free money' pillars: zero rates and Fed easing, multi-trillion pandemic deficits, and an unmitigated surge in AI capacity investment — none clearly tied to reliable future cash flows except those generated by the spending itself.", "speaker": "John P. Hussman", "type": "thesis", "entities": ["Federal Reserve", "AI", "pandemic deficits"], "conviction": "high", "so_what": "If any pillar weakens (deficit restraint, AI capex slowdown), the profit and valuation support erodes.", "quote": "none of this money is clearly attached to reliable future cash flows, except the cash flows generated by the spending itself", "locator": "Returning to the financial markets", "quote_verified": true}, {"claim": "Under Bernanke the Fed pushed zero-interest Fed liabilities from 6% of GDP in 2008 to 25% by the end of his term; with Yellen and Powell, base money peaked at an unprecedented 36% of GDP in early 2022.", "speaker": "John P. Hussman", "type": "data_point", "entities": ["Ben Bernanke", "Janet Yellen", "Jerome Powell", "Federal Reserve"], "conviction": "high", "so_what": "Quantifies the monetary leg of the bubble and frames QE as the origin of valuation extremes.", "quote": "peaked at a recklessly unprecedented 36% of GDP in early 2022", "locator": "The first was deranged monetary policy", "quote_verified": true}, {"claim": "Hussman's liquidity preference curve links T-bill yields to base money/GDP: ~6% of GDP is associated with 4-6% T-bill rates, above 10% with 0-2%, and above 14% with zero yields.", "speaker": "John P. Hussman", "type": "framework", "entities": ["Federal Reserve", "T-bill"], "conviction": "medium", "so_what": "Short rates are a function of the quantity of zero-interest liabilities outstanding; useful to map balance-sheet changes to rate regimes.", "quote": "a level historically associated with T-bill rates of roughly 4-6%", "locator": "The first was deranged monetary policy", "quote_verified": true}, {"claim": "QE created a 'hot potato' effect: zero-interest cash must be held by someone at all times, and each holder's attempt to get rid of it drove U.S. equity valuations beyond the 1929 and 2000 extremes.", "speaker": "John P. Hussman", "type": "causal", "entities": ["Federal Reserve", "QE"], "conviction": "high", "so_what": "Liquidity-driven valuation inflation is a holder-reaching-for-yield dynamic, not fundamental improvement.", "quote": "Nobody wanted the stuff, and the attempt of every successive holder to get rid of it drove U.S. equity valuations beyond even the 1929 and 2000 extremes.", "locator": "The Fed created these zero-interest", "quote_verified": true}, {"claim": "By the sector-balance accounting identity, massive combined government and household deficits must show up as an equivalent corporate surplus, so record pandemic deficits directly (PPP) and indirectly (household saving drawdown) subsidized corporate profits.", "speaker": "John P. Hussman", "type": "causal", "entities": ["PPP", "corporate profits", "government deficits"], "conviction": "high", "so_what": "Record margins are a mirror image of record government/household deficits, not a sustainable structural shift.", "quote": "This isn’t a theory, but an accounting identity.", "locator": "The second phase of the bubble", "quote_verified": true}, {"claim": "The 10% of U.S. households that own about 87% of corporate equities are the ultimate beneficiaries of corporate-sector surpluses.", "speaker": "John P. Hussman", "type": "data_point", "entities": ["U.S. households", "corporate equities"], "conviction": "medium", "so_what": "Corporate surpluses funded by deficits concentrate wealth, with distributional and political implications for tax policy.", "quote": null, "locator": "The second phase of the bubble", "quote_verified": false}, {"claim": "Record corporate surpluses persist because government spending bridges the gap between a declining wage share of GDP and households' continuing spending needs; the foreign sector currently runs a moderate surplus, making the domestic corporate vs government/household imbalance even larger.", "speaker": "John P. Hussman", "type": "causal", "entities": ["government spending", "wages and salaries"], "conviction": "high", "so_what": "Fiscal consolidation would directly hit corporate profits.", "quote": null, "locator": "The central observation is that", "quote_verified": false}]}, {"theme": "AI capex as the profit engine", "insights": [{"claim": "Because the IT investment surge has not been funded by worsening household/government deficits and corporate free cash flow has not surged, corporate profits must have exploded to the same extent as investment — so the profit surge since 2022 is directly dependent on the AI investment boom.", "speaker": "John P. Hussman", "type": "causal", "entities": ["AI", "corporate profits", "free cash flow"], "conviction": "high", "so_what": "An AI capex slowdown would mechanically compress economy-wide corporate profits, not just AI vendors' revenues.", "quote": "the abrupt surge in economy-wide corporate profits we’ve seen since 2022 is directly linked to, and dependent on, the surge in AI investment", "locator": "The third and most recent extension", "quote_verified": true}, {"claim": "Historically, bubbles accompany investment booms and new-era thinking that devolve into malinvestment, 'swarm like' competition and speculative collapse, with most benefits of new technology going to consumers as consumer surplus rather than sustained profits.", "speaker": "John P. Hussman", "type": "framework", "entities": ["AI", "Schumpeter"], "conviction": "high", "so_what": "Expect AI to be transformative for users but disappointing for investor profits; overbuilt capacity is the likely legacy.", "quote": "New technologies usually produce victors, but they also tend to leave a wasteland of overbuilt capacity.", "locator": "Across history, the recurring pattern", "quote_verified": true}, {"claim": "AI's core value proposition driving the buildout is labor disruption, but with wage share already at a record low, reduced labor income means people can't afford AI-produced output unless prices fall as much as wages — again restraining profits.", "speaker": "John P. Hussman", "type": "causal", "entities": ["AI", "labor market"], "conviction": "medium", "so_what": "The AI profit thesis contains an internal demand contradiction absent larger fiscal deficits.", "quote": null, "locator": "The incidence of costs is also uncertain", "quote_verified": false}, {"claim": "Corporations can only benefit on balance from labor-saving AI if government deficits expand further or if firms keep plowing profits into new net investment (making profits non-distributable); Hussman expects neither path to be sustained, so either profits disappoint or tax policy targets dominance rents.", "speaker": "John P. Hussman", "type": "prediction", "entities": ["AI", "government deficits", "tax system"], "conviction": "medium", "so_what": "Watch fiscal trajectory and tax policy toward mega-caps as key risks to AI-era margins.", "quote": "either the profits will be disappointing, or the dominance rents of mega-corporations will be properly treated by the tax system", "locator": "In equilibrium, then, the only way", "quote_verified": true}, {"claim": "Hyperscaler profitability resembles natural monopoly (declining marginal costs, scale economies), but when investors throw money at a new technology the result is duplicative, dangerously unproductive investment — as in the tech bubble, the mortgage bubble and now AI.", "speaker": "John P. Hussman", "type": "contrarian", "entities": ["hyperscalers", "natural monopoly", "AI"], "conviction": "high", "so_what": "Natural-monopoly economics normally protect incumbents, but capital flooding in removes that moat and invites overinvestment.", "quote": "we get the other extreme of duplicative and dangerously unproductive investment (as we saw in the tech bubble, then the mortgage bubble, and now in the AI space)", "locator": "Unlike the sort of ‘top hat and cane’", "quote_verified": true}, {"claim": "Current profit margins increasingly reflect dominance rents from private capture of network effects and publicly created content, including uncompensated materials used to train AI models.", "speaker": "John P. Hussman", "type": "thesis", "entities": ["AI models", "dominance rents"], "conviction": "medium", "so_what": "Regulatory/IP and tax risk to AI economics: compensation for training data could erode margins.", "quote": "Much of the potential profit of AI models, in particular, relies on exploiting the creativity and intellectual property of others, without providing any compensation.", "locator": "When we talk about profit margins", "quote_verified": true}, {"claim": "It is easy to mistake money being spent for wealth being created; sustainable prosperity requires activity that generates sufficient future wages and income, not just spending.", "speaker": "John P. Hussman", "type": "framework", "entities": ["AI", "free money"], "conviction": "high", "so_what": "Distinguish GDP/profit boosts from capex spending vs durable income generation when assessing the AI boom.", "quote": "It’s easy to mistake the sound of money being spent with the sound of wealth being created.", "locator": "Returning to the financial markets", "quote_verified": true}]}, {"theme": "Portfolio construction and alternatives", "insights": [{"claim": "A useful alternative asset need not be exotic; its value comes from low correlation with risks already dominating the portfolio, improving return/risk even if its standalone return is low.", "speaker": "John P. Hussman", "type": "framework", "entities": ["alternative assets", "portfolio"], "conviction": "high", "so_what": "Evaluate diversifiers by interaction with the portfolio, not by backward-looking standalone performance.", "quote": null, "locator": "The essential feature of a useful alternative", "quote_verified": false}, {"claim": "Many investment approaches, even 'conservative' or 'target date' strategies, load on the same narrow set of technology and AI risks that dominate the market, providing little true diversification.", "speaker": "John P. Hussman", "type": "contrarian", "entities": ["target date", "AI", "technology"], "conviction": "high", "so_what": "Concentration risk is hidden across supposedly diversified products; check factor overlap.", "quote": null, "locator": "The size of the departure from", "quote_verified": false}, {"claim": "Hussman claims that in portfolio optimizations over the past 1, 3, 5, 7 and 10 years, the lowest-risk allocation matching a 60/40 S&P 500/cash portfolio's return typically directs 33-42% to the Hussman discipline and the rest to the S&P 500.", "speaker": "John P. Hussman", "type": "data_point", "entities": ["S&P 500", "Hussman"], "conviction": "medium", "so_what": "Self-reported (promotional) evidence that a negative-beta hedged strategy can replace cash/bond sleeves.", "quote": "typically directs between 33-42% to our discipline, and the remainder to the S&P 500", "locator": "You can see real-world examples", "quote_verified": true}, {"claim": "Mean-variance math says investors should take an active position in any asset with an expected 'edge' above what its market sensitivity implies, even if its beta is negative and the market is rising — except for portfolios at 100% market exposure.", "speaker": "John P. Hussman", "type": "framework", "entities": ["beta", "portfolio optimization"], "conviction": "medium", "so_what": "Negative-beta strategies can belong in portfolios during bull markets if they carry positive alpha.", "quote": null, "locator": "This is true not only for", "quote_verified": false}]}, {"theme": "Hussman's tactical stance and nonduality shift", "insights": [{"claim": "Since the 'roses and garbage' insight earlier in 2026, Hussman's discipline has had a locally constructive tilt about 20% of the time, performing well since early May even as the S&P 500 rose and average beta was negative.", "speaker": "John P. Hussman", "type": "data_point", "entities": ["S&P 500", "Hussman"], "conviction": "medium", "so_what": "Even a permabear-reputation manager is now taking periodic constructive tilts based on market internals and sentiment.", "quote": "we’ve had a locally constructive tilt about 20% of the time", "locator": "Yet since our “roses and garbage”", "quote_verified": true}, {"claim": "Hussman says he discovered his firm had been vastly underexploiting its September 2024 hedging implementation, and a February 2026 'nonduality' insight (that they had been discriminating against the bubble) now allows shorter-horizon constructive tilts with a safety net while maintaining 50-70% full-cycle downside views.", "speaker": "John P. Hussman", "type": "anecdote", "entities": ["Thich Nhat Hanh", "Hussman"], "conviction": "medium", "so_what": "Signals a behavioral shift: willingness to participate in bubble advances tactically, reducing pure-bear positioning.", "quote": "we’re fully comfortable talking about potential 50-70% full-cycle downside risk, yet equally comfortable with shorter-horizon investment positions that periodically tilt constructive", "locator": "At the same time, our February insight", "quote_verified": true}]}, {"theme": "Bonds and precious metals positioning", "insights": [{"claim": "Hussman considers Treasury yields finally adequate though not aggressively compelling, and prefers to use clear bond-market weakness to moderately extend duration.", "speaker": "John P. Hussman", "type": "thesis", "entities": ["Treasury", "10-year Treasury yield"], "conviction": "medium", "so_what": "Buy-the-dip on Treasuries: add duration on yield spikes rather than chasing.", "quote": "we consider Treasury yields to be finally adequate, though not aggressively compelling", "locator": "In the bond market", "quote_verified": true}, {"claim": "Despite volatili // YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',

  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
