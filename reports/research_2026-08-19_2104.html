const CAT_COLORS = {
  macro:"#e24b4a", credit:"#378add", positioning:"#ef9f27", "AI/infra":"#1d9e75", crypto:"#7f77dd",
  geopolitics:"#d85a30", energy:"#f97316", tech:"#06b6d4", gold:"#d4a017", culture:"#ec4899",
  labor:"#8b5cf6", regulation:"#64748b", science:"#14b8a6", venture:"#84cc16", commodities:"#92400e"
};
const URG_LABEL = { act:"🔴 Act Now", deep:"🔵 Deep", watch:"🟡 Watch" };
const URG_EMOJI = { act:"🔴", deep:"🔵", watch:"🟡" };

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function buildFilterBars(){
  const catCounts = {};
  ITEMS.forEach(i => catCounts[i.cat] = (catCounts[i.cat]||0)+1);
  const catBar = document.getElementById('catBar');
  let html = '<button class="pill active" data-cat="all" onclick="setCat(\'all\')">All (' + ITEMS.length + ')</button>';
  Object.keys(catCounts).sort().forEach(function(c){
    html += '<button class="pill" data-cat="' + c + '" style="--c:' + CAT_COLORS[c] + '" onclick="setCat(\'' + c + '\')">' + c + ' (' + catCounts[c] + ')</button>';
  });
  catBar.innerHTML = html;

  const urgCounts = {};
  ITEMS.forEach(i => urgCounts[i.urgency] = (urgCounts[i.urgency]||0)+1);
  const urgBar = document.getElementById('urgBar');
  let uhtml = '<button class="pill active" data-urg="all" onclick="setUrg(\'all\')">All (' + ITEMS.length + ')</button>';
  ['act','deep','watch'].forEach(function(u){
    if(urgCounts[u]) uhtml += '<button class="pill" data-urg="' + u + '" onclick="setUrg(\'' + u + '\')">' + URG_LABEL[u] + ' (' + urgCounts[u] + ')</button>';
  });
  urgBar.innerHTML = uhtml;
}

function setCat(c){
  activeCat = c; activeSrc = null;
  document.querySelectorAll('#catBar .pill').forEach(function(p){
    const isActive = p.getAttribute('data-cat') === c;
    p.classList.toggle('active', isActive);
    p.style.background = isActive && c !== 'all' ? CAT_COLORS[c] : (isActive ? '#1a1a1a' : 'transparent');
    p.style.borderColor = isActive ? 'transparent' : '#e5e2db';
  });
  render();
}
function setUrg(u){
  activeUrg = u; activeSrc = null;
  document.querySelectorAll('#urgBar .pill').forEach(function(p){
    const isActive = p.getAttribute('data-urg') === u;
    p.classList.toggle('active', isActive);
    p.style.background = isActive ? '#1a1a1a' : 'transparent';
  });
  render();
}
function filterBySrc(name){
  activeSrc = name;
  render();
  document.querySelectorAll('.card').forEach(function(card){
    const item = ITEMS.find(function(i){ return i.id === parseInt(card.getAttribute('data-id'),10); });
    if(item && item.source.indexOf(name) !== -1){
      document.getElementById('body-' + item.id).classList.add('open');
    }
  });
}

function buildCards(){
  const container = document.getElementById('cards');
  let html = '';
  ITEMS.forEach(function(item){
    const c = CAT_COLORS[item.cat] || '#888';
    const chartMark = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');
    html += '<div class="card show" data-id="' + item.id + '">';
    html += '<div class="card-head" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">' + String(item.id).padStart(2,'0') + '</span>';
    html += '<span class="urg">' + URG_EMOJI[item.urgency] + '</span>';
    html += '<span class="src-badge" style="background:' + c + '">' + item.source + '</span>';
    html += '<span class="cat-pill">' + item.cat + '</span>';
    if(chartMark) html += '<span class="chart-mark">' + chartMark + '</span>';
    html += '<span class="card-title">' + item.title + '</span>';
    html += '</div>';
    html += '<div class="card-body" id="body-' + item.id + '">';
    html += '<div class="section-label">The Idea</div><div class="idea-text">' + item.idea + '</div>';
    html += '<div class="section-label">My Angle</div><div class="angle-box" style="border-left:2px solid ' + c + '; background:' + c + '14;">' + item.angle + '</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + escapeHtml(item.tweetA) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + escapeHtml(item.tweetB) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    html += '<div class="chart-box' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.count > 0 ? '📊 ' + item.charts.count + ' chart(s) — ' + item.charts.desc : item.charts.desc) + (item.charts.hot ? ' — 🔥 CHART WORTH SAVING' : '') + '</div>';
    html += '<div class="linkline"><a href="' + item.link + '" target="_blank">↗ Read full article</a></div>';
    html += '</div></div>';
  });
  container.innerHTML = html;
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toggleCard(id){
  const body = document.getElementById('body-' + id);
  body.classList.toggle('open');
}

function render(){
  document.querySelectorAll('.card').forEach(function(card){
    const id = parseInt(card.getAttribute('data-id'),10);
    const item = ITEMS.find(function(i){ return i.id === id; });
    let show = true;
    if(activeCat !== 'all' && item.cat !== activeCat) show = false;
    if(activeUrg !== 'all' && item.urgency !== activeUrg) show = false;
    if(activeSrc && item.source.indexOf(activeSrc) === -1) show = false;
    card.classList.toggle('show', show);
    if(!show || (activeCat === 'all' && activeUrg === 'all' && !activeSrc)){
      // collapse when switching filters, except keep source-filtered ones open (handled in filterBySrc)
    }
    if(activeCat !== 'all' || activeUrg !== 'all') {
      document.getElementById('body-' + id).classList.remove('open');
    }
  });
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function buildReport(){
  var body = document.getElementById('reportBody');
  var html = '<div><strong>Window:</strong> ' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</div>';
  html += '<div style="margin-top:8px;"><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp; <strong>Emails read:</strong> ' + META.emailsRead + ' &nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</div>';
  html += '<div class="section-label" style="margin-top:14px;">Included Sources</div>';
  META.includedSources.forEach(function(s){
    html += '<div><span class="srcname" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span> — ' + s.count + ' item' + (s.count>1?'s':'') + '</div>';
  });
  html += '<div class="section-label" style="margin-top:14px;">Skipped Sources</div>';
  META.skippedSources.forEach(function(s){
    html += '<div class="skip-item">' + s.name + ' — ' + s.reason + '</div>';
  });
  body.innerHTML = html;
}

document.getElementById('headerMeta').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources';
document.getElementById('reportToggle').addEventListener('click', function(){
  document.getElementById('reportBody').classList.toggle('open');
  document.getElementById('reportChevron').textContent = document.getElementById('reportBody').classList.contains('open') ? '▾' : '▸';
});

buildFilterBars();
buildCards();
buildReport();
</script>
