<title>Concepts — Knowledge</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #f6faf8;
  --surface: #ffffff;
  --border: #dfe8e3;
  --border-light: #eef3f0;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #059669;          /* green — KNOWLEDGE track accent (matches YouTube) */
  --accent-soft: #e9f7f1;
  --quote: #047857;
  --yellow: #fff5b3;

  /* insight-type colors */
  --t-thesis: #2563eb;
  --t-prediction: #7c3aed;
  --t-framework: #0891b2;
  --t-data_point: #d97706;
  --t-causal: #be185d;
  --t-contrarian: #dc2626;
  --t-anecdote: #6b7280;
  --t-default: #6b7280;

  /* conviction colors */
  --c-high: #15803d;
  --c-medium: #d97706;
  --c-low: #9ca3af;
  --c-exploratory: #8b5cf6;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 980px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 12px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.title .icon { margin-right: 6px; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* STATS BAR */
.stats-top { margin-bottom: 16px; padding: 8px 12px; background: var(--surface);
             border: 1px solid var(--border); border-radius: 6px;
             font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
             color: var(--text-2); display: flex; gap: 16px; flex-wrap: wrap; }
.stats-top strong { color: var(--text); font-weight: 600; }

/* CONTROLS (display-only: sort + filter by source) */
.controls { display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
            margin-bottom: 16px; padding: 8px 12px; background: var(--surface);
            border: 1px solid var(--border); border-radius: 6px;
            font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--text-2); }
.controls label { display: inline-flex; align-items: center; gap: 6px; }
.controls select { font-family: inherit; font-size: 11.5px; color: var(--text);
                   background: var(--bg); border: 1px solid var(--border);
                   border-radius: 4px; padding: 3px 6px; cursor: pointer; }
.controls .ctl-btns { display: inline-flex; gap: 6px; margin-left: auto; }
.controls button { font-family: inherit; font-size: 11.5px; color: var(--text);
                   background: var(--bg); border: 1px solid var(--border);
                   border-radius: 4px; padding: 3px 10px; cursor: pointer; }
.controls button:hover { border-color: var(--accent); color: var(--accent); }

/* SOURCE GROUP (collapsible) */
.group { margin-bottom: 4px; }
.group-head { display: flex; align-items: center; gap: 10px; margin: 18px 0 8px;
              padding-bottom: 5px; border-bottom: 2px solid var(--accent);
              cursor: pointer; user-select: none; }
.group:first-child .group-head { margin-top: 4px; }
.group-name { font-weight: 700; font-size: 14px; color: var(--accent); }
.group-meta { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.group-arrow { margin-left: auto; font-size: 11px; color: var(--text-3);
               transition: transform .15s; }
.group.collapsed .group-arrow { transform: rotate(-90deg); }
.group.collapsed .group-body { display: none; }

/* SOURCE CARD (one per article/record) */
.source { background: var(--surface); border: 1px solid var(--border);
          border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.source-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
               background: var(--accent-soft); cursor: pointer; user-select: none; }
.source-head:hover { filter: brightness(0.98); }
.source-meta-left { flex: 1; min-width: 0; }
.source-name { font-weight: 700; color: var(--accent); font-size: 13px; }
a.source-name { text-decoration: none; }
a.source-name:hover { text-decoration: underline; }
.source-title { font-weight: 600; font-size: 14.5px; margin-top: 2px; line-height: 1.4; }
.source-sub { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px;
              color: var(--text-3); margin-top: 3px; }
.source-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                color: var(--text-3); white-space: nowrap; }
.source-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.source.open .source-arrow { transform: rotate(90deg); }
.source-body { display: none; padding: 6px 0; }
.source.open .source-body { display: block; }

.gist { font-size: 13.5px; line-height: 1.6; color: var(--text); padding: 12px 16px 4px;
        font-style: italic; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 16px 10px; }

/* THEME */
.theme { padding: 10px 16px 4px; border-top: 1px solid var(--border-light); }
.theme:first-child { border-top: none; }
.theme-title { font-weight: 600; font-size: 13.5px; color: var(--text-2);
               text-transform: uppercase; letter-spacing: .03em; margin-bottom: 8px;
               font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; }

/* INSIGHT */
.insight { border-left: 3px solid var(--border); background: #fafafa;
           border-radius: 4px; padding: 9px 11px; margin-bottom: 8px; }
.insight.causal { border-left-color: var(--t-causal); }
.insight.contrarian { border-left-color: var(--t-contrarian); }
.insight-claim { font-size: 13.5px; line-height: 1.55; font-weight: 500; }
.insight-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px;
                flex-wrap: wrap; font-size: 11px; }
.insight-so { font-size: 12.5px; color: var(--text-2); margin-top: 6px; line-height: 1.5; }
.insight-so .lbl { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px;
                   text-transform: uppercase; letter-spacing: .06em; color: var(--text-3);
                   margin-right: 5px; }
.quote { border-left: 3px solid var(--quote); background: var(--accent-soft);
         padding: 6px 10px; margin-top: 6px; font-size: 12.5px; line-height: 1.5;
         color: var(--quote); border-radius: 0 4px 4px 0; }
.quote .vmark { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px;
                color: var(--c-high); margin-left: 6px; }
.quote .vmark.no { color: var(--text-3); }
/* INSIGHT META CHIPS — YouTube-aligned: type/conviction tinted, speaker w/ icon,
   entities as indigo chips in the meta row (display only). */
.chip { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px;
        padding: 2px 8px; border-radius: 20px; border: 1px solid var(--border);
        background: #eef1f8; color: var(--text-2); white-space: nowrap; }
.chip-spk { color: #475569; background: #f1f5f9; border-color: #dbe2ea; }
.chip-ent { background: #eef2ff; color: #3730a3; border-color: #c7d2fe; }

/* PILLS — per-card topic tags keep the KNOWLEDGE green accent */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.pill.tag { background: var(--accent); }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}

const REPORT_DATA = {"date": "2026-10-13", "generated_at": "2026-10-13T11:14:43.000Z", "stats": {"cards": 5, "insights": 45, "sources": 4, "quote_verified_pct": 100}, "cards": [{"record_id": "0ccfd0dbe92c5021", "source_type": "concepts", "source_name": "a16z Blog", "source_url": "https://a16z.com/welcome-col-jeffrey-glover-and-greg-barbaccia/", "title": "Welcome Col. Jeffrey Glover and Greg Barbaccia | Andreessen Horowitz", "published_date": "2026-10-12", "language": "en", "processed_at": "2026-10-13T11:14:42Z", "processor": "claude-code-sub-opus", "tags": ["Geopolitics", "Tech"], "gist": "a16z adds Col. Jeffrey Glover (Arizona DPS director) and Greg Barbaccia (ex-US Federal CIO, ex-Palantir) as advisors to its American Dynamism and Growth practices, a staffing signal of the firm's push into public-safety, govtech, cyber and defense. Light announcement with no financial data.", "themes": [{"theme": "Government-savvy advisor bench", "insights": [{"claim": "a16z added Col. Jeffrey Glover, Director of the Arizona Department of Public Safety, as an advisor to its American Dynamism and Growth practices to guide founders building for public safety and law enforcement.", "speaker": "David Ulevitch, David George", "type": "data_point", "entities": ["a16z", "American Dynamism", "Jeffrey Glover", "Arizona Department of Public Safety"], "conviction": "high", "so_what": "Signals a16z is actively sourcing public-safety technology deals; watch for portfolio announcements in law-enforcement tech.", "quote": null, "locator": "Col. Jeffrey Glover", "quote_verified": false}, {"claim": "Greg Barbaccia, most recently U.S. Federal Chief Information Officer and a decade-plus Palantir veteran, joins a16z as an advisor across government technology, cybersecurity, defense, intelligence and digital services.", "speaker": "David Ulevitch, David George", "type": "data_point", "entities": ["Greg Barbaccia", "Palantir", "a16z", "General Services Administration"], "conviction": "high", "so_what": "A former federal CIO plus Palantir alumnus indicates a16z is positioning for govtech/defense procurement access; relevant to defense-tech and cyber startup pipelines.", "quote": null, "locator": "Greg Barbaccia", "quote_verified": false}, {"claim": "a16z frames capital as only part of what startups need: founders also need leaders who understand how institutions operate, where change gets stuck, and how to turn new technology into lasting national capability.", "speaker": "David Ulevitch, David George", "type": "thesis", "entities": ["a16z", "American Dynamism"], "conviction": "medium", "so_what": "Venture differentiation in govtech/defense is being built on access and operator networks rather than money alone.", "quote": "But capital is only part of what new companies need to win.", "locator": "America's future depends", "quote_verified": true}, {"claim": "a16z's American Dynamism advisor network now includes General Bryan Fenton as Special Advisor and Anne Neuberger as General Partner and Head of Global Affairs, and the firm says the group will keep growing.", "speaker": "David Ulevitch, David George", "type": "data_point", "entities": ["Bryan Fenton", "Anne Neuberger", "a16z", "American Dynamism"], "conviction": "medium", "so_what": "Expect further senior government/defense hires; a sustained build-out suggests a durable investment focus on national-security tech.", "quote": null, "locator": "A coalition of incredible leaders", "quote_verified": false}]}, {"theme": "American Dynamism thesis", "insights": [{"claim": "a16z argues that modernizing the institutions responsible for US security, resilience and prosperity is a prerequisite for America's future, and its American Dynamism practice backs founders building companies to meet those needs at scale.", "speaker": "David Ulevitch, David George", "type": "thesis", "entities": ["a16z", "American Dynamism"], "conviction": "medium", "so_what": "Frames security, resilience and public-sector modernization as a multi-year venture theme.", "quote": null, "locator": "America's future depends", "quote_verified": false}]}], "insight_total": 5, "top_entities": ["a16z", "American Dynamism", "Jeffrey Glover", "Greg Barbaccia", "Palantir", "Arizona Department of Public Safety", "Bryan Fenton", "Anne Neuberger"], "source_meta": {"author": "David Ulevitch, David George", "word_count": 1745, "paywalled": false}}, {"record_id": "b9e1cac8172870b4", "source_type": "concepts", "source_name": "a16z Crypto", "source_url": "https://a16zcrypto.com/posts/article/rethinking-kyc", "title": "Rethinking KYC", "published_date": "2026-10-12", "language": "en", "processed_at": "2026-10-13T11:14:42Z", "processor": "claude-code-sub-opus", "tags": ["Crypto", "AI", "Positioning"], "gist": "a16z Crypto argues KYC is not the blocker to institutions onchain: BSA obligations attach to an institution's own customers, not the settlement network, and reusable credentials, ZK proofs, KYW/KYA/KYT tooling and token-level controls can cut redundant checks. Extends to Know Your Agent for AI agent payments.", "themes": [{"theme": "Legal baseline: who must be identified", "insights": [{"claim": "A bank's BSA customer-identification obligations apply to the customers who open accounts with it, not to every participant in the underlying settlement infrastructure, so settling on a permissionless chain or trading against a liquidity pool does not make counterparties the bank's customers.", "speaker": "Maggie Hsu", "type": "thesis", "entities": ["BSA", "Treasury", "DeFi", "banks"], "conviction": "high", "so_what": "Removes a key perceived legal barrier to TradFi institutions using public blockchains; supports tokenization adoption.", "quote": null, "locator": "The starting point is understanding", "quote_verified": false}, {"claim": "The GENIUS Act places AML and sanctions obligations on the permitted stablecoin issuer, the identifiable application-layer entity, rather than on the permissionless networks its stablecoins circulate on.", "speaker": "Maggie Hsu", "type": "data_point", "entities": ["GENIUS Act", "stablecoin"], "conviction": "high", "so_what": "Congress has already endorsed issuer-level, not network-level, compliance allocation; supportive for stablecoin issuers on public chains.", "quote": null, "locator": "The good news is that new, affirmative legislation", "quote_verified": false}, {"claim": "No new US legislation is needed to enable crypto-native KYC; existing law can be adapted through interpretive guidance, rulemaking, or innovation exemptions.", "speaker": "Maggie Hsu", "type": "thesis", "entities": ["FinCEN", "Treasury", "GENIUS Act"], "conviction": "high", "so_what": "Regulatory change can come fast via agency guidance; watch FinCEN/banking-agency FAQs and exemptions.", "quote": null, "locator": "The good news is that new, affirmative legislation", "quote_verified": false}, {"claim": "FinCEN's April 2026 proposal named machine learning, GenAI, digital identity, blockchain analytics and APIs as innovative AML/CFT approaches and said institutions that responsibly experiment will not incur additional supervisory risk solely for using them.", "speaker": "Maggie Hsu", "type": "data_point", "entities": ["FinCEN", "GenAI", "blockchain analytics"], "conviction": "high", "so_what": "Regulatory tailwind for compliance-tech and onchain analytics vendors.", "quote": "institutions that “responsibly experiment with innovative technologies in their AML/CFT programs will not incur any additional risk", "locator": "In its April 2026 proposal", "quote_verified": true}, {"claim": "September 2026 interagency FAQs expressly recognize that qualifying verifiable digital credentials can be used within a bank's Customer Identification Program, though they do not approve every decentralized identifier or credential design.", "speaker": "Maggie Hsu", "type": "data_point", "entities": ["verifiable credentials", "CIP", "interagency FAQs"], "conviction": "high", "so_what": "First formal opening for verifiable credentials in bank KYC; beneficiaries are credential issuers and wallet-identity providers with compliant designs.", "quote": null, "locator": "Verifiable credentials could support or replace", "quote_verified": false}]}, {"theme": "Redundant KYC and the reuse problem", "insights": [{"claim": "Institutions do not want to avoid KYC but to avoid redundant KYC, which is costly for platforms, adds user friction and is increasingly unreliable as deepfake tools proliferate.", "speaker": "Maggie Hsu", "type": "thesis", "entities": ["deepfakes", "KYC"], "conviction": "high", "so_what": "Reusable KYC is a cost-saving wedge; deepfakes erode the value of repeated document/selfie checks.", "quote": "Institutions do not want to avoid KYC; they want to avoid redundant KYC.", "locator": "Reusability and the ecosystem of trust", "quote_verified": true}, {"claim": "SWIFT's KYC Registry, launched in 2014, spans nearly 8,000 institutions across 200+ countries and works because relationships are institution-to-institution with known counterparties; crypto has no equivalent centralized registry.", "speaker": "Maggie Hsu", "type": "data_point", "entities": ["SWIFT", "KYC Registry"], "conviction": "high", "so_what": "Shows reusable KYC scales when counterparties are known; the crypto equivalent is an open commercial opportunity.", "quote": null, "locator": "A useful analog in traditional financial markets", "quote_verified": false}, {"claim": "Centralized identity PII stores act as honeypots for criminals, and a mobile ID discloses full name, address, date of birth and photo in one disclosure, which is why privacy advocates urge alternatives to repeated government-ID submission.", "speaker": "Maggie Hsu", "type": "causal", "entities": ["PII", "Coin Center", "mobile ID"], "conviction": "medium", "so_what": "Privacy-preserving verification (selective disclosure, ZK) has a security as well as a compliance case.", "quote": null, "locator": "Repeated verification can mean sharing", "quote_verified": false}, {"claim": "Large KYC providers can build single-sign-on-style trust networks, with basic verification costing roughly $1 to $2 charged to the originating platform and secondary platforms needing only partial KYC such as a liveness check; examples include Sumsub ID, World ID, MoonPay and Stripe via Privy.", "speaker": "Maggie Hsu", "type": "data_point", "entities": ["Sumsub", "World ID", "MoonPay", "Stripe", "Privy"], "conviction": "medium", "so_what": "Unit economics of reusable KYC are cheap; incumbents with large verified user bases hold the distribution advantage.", "quote": null, "locator": "Outsourcing versus reliance", "quote_verified": false}, {"claim": "Access to pools of pre-verified users (whitelisted liquidity) is a form of compliance distribution, not a legal requirement, and an institution's own obligations are the same in a gated or permissionless pool.", "speaker": "Maggie Hsu", "type": "contrarian", "entities": ["whitelisted liquidity", "SEC"], "conviction": "high", "so_what": "Against the common view that institutions must use permissioned venues; permissionless DeFi access may be legally viable.", "quote": null, "locator": "This is known as “whitelisted liquidity.”", "quote_verified": false}, {"claim": "Issuers are seeking introductions to global exchanges to leverage their compliance frameworks, but the commercial structure for such distribution is still being developed.", "speaker": "Maggie Hsu", "type": "anecdote", "entities": ["exchanges", "issuers", "tokenized securities"], "conviction": "low", "so_what": "Partnering with compliant exchanges is the simplest near-term route to customers; commercial terms are not yet settled.", "quote": null, "locator": "This is known as “whitelisted liquidity.”", "quote_verified": false}]}, {"theme": "Reliance vs outsourcing and legal frictions", "insights": [{"claim": "Under BSA customer-identification rules, reliance is a legal safe harbor applying only when relying on another regulated financial institution; using non-qualifying vendors such as identity-verification firms or credit bureaus is outsourcing, leaving the institution fully responsible for CIP.", "speaker": "Maggie Hsu", "type": "framework", "entities": ["BSA", "CIP", "FATF"], "conviction": "high", "so_what": "Reusable-KYC products that lack a regulated-institution issuer do not shift liability; diligence the legal basis before relying on them.", "quote": null, "locator": "Institutions can use outside providers", "quote_verified": false}, {"claim": "FATF's third-party reliance conditions (third party regulated and supervised, immediate access to underlying KYC data, relying institution retains liability) conflict with the privacy-preserving design of most onchain KYC, since PII must be producible on demand.", "speaker": "Maggie Hsu", "type": "causal", "entities": ["FATF", "zero-knowledge proofs"], "conviction": "high", "so_what": "Structural tension between privacy tech and AML rules; solutions will need a trusted source of record somewhere.", "quote": null, "locator": "This doesn’t always neatly map to crypto.", "quote_verified": false}, {"claim": "Many crypto platforms, even registered money services businesses or state-chartered trust companies, are not regulated institutions for purposes of the federal AML/CIP reliance rule and so cannot be counterparties to formal reliance, though this is evolving as more crypto firms become licensed.", "speaker": "Maggie Hsu", "type": "data_point", "entities": ["money services businesses", "trust companies"], "conviction": "medium", "so_what": "Licensing status determines whether crypto firms can supply KYC others may legally rely on.", "quote": null, "locator": "Separately, many crypto platforms", "quote_verified": false}, {"claim": "The US Travel Rule applies to transfers above roughly $3,000 between financial institutions and VASPs but does not require data to go to self-hosted wallets, so institutions need not lose sleep over Travel Ru // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
