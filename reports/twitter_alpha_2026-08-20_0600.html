<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-08-20T05:20:58Z", "input_stats": {"total_tweets": 257, "unique_authors": 75, "tweets_with_images": 47, "after_noise_filter": 81}, "summary": "**Crypto:** ETH surged +18-20% in what several accounts called the largest short-liquidation event in crypto history; **ColdBloodShill**, **AltcoinPsycho**, and **Crypto_McKenna** flagged historic squeeze/momentum signals, while **DCinvestor** argued Tom Lee's long-mocked ETH DAT strategy is being vindicated. BTC also broke its 6-month range the same day US debt hit $40T (**marcvanderchijs**).\n\n**Hyperliquid / regulation:** Trump signaled the CFTC/SEC (new chair **Selig**) will bring Hyperliquid into the US \"in a legal fashion\" — a wave of reactions from **Crypto_McKenna**, **arthur0x**, **jchervinsky** and others, plus **brian_armstrong** pushing the Clarity Act; **Bluntz_Capital** and **MoonOverlord** stayed bullish on $HYPE through the KYC controversy.\n\n**Macro:** US national debt hit $40T the same day Treasury doubled long-end bond buybacks; **RaoulGMI** (\"The Bessent Put\") called it the Treasury usurping the Fed's yield-defense role as part of a \"grand bargain\" also involving yen intervention and new dollar swap lines, while **dampedspring** flagged that the move bypassed the normal TBAC process, calling it \"100% political.\" **pboockvar** called for an ag bull market, favoring fertilizer stocks.\n\n**Geopolitics:** Trump threatened \"TREMENDOUS\" economic consequences on anyone aiding Iran (**JavierBlas**) alongside reports of a new US military oil-shipping corridor through Hormuz (**zriboua**) — but **_tolks** argued the tough rhetoric actually signals de-escalation ahead of the midterms, not rising military risk.\n\n**Notable:** Moderna/Merck's Phase 3 mRNA cancer-prevention trial sent $MRNA up 212% after hours, drawing AI-in-pharma commentary from **cryptopunk7213** and **rektmando**; Stripe acquired OpenRouter. **Bill Ackman** disclosed his daughter Lucy's near-fatal February brain hemorrhage and a ~$400M Pershing Square Inc. share gift launching the Ackman Oxman Institute for brain research.\n\n**Contrarian:** **Fiskantes** and **DonAlt** warned against chasing the squeeze-driven euphoria, and **DefiIgnas** noted ETH is still down 24% over five years despite the day's rally.", "sections": {"A_events": [{"cluster": "Historic Crypto Short Squeeze — ETH +18-20%, Largest Liquidation Event in Crypto History", "category": ["crypto", "positioning"], "items": [{"author": "ColdBloodShill", "summary": "Across three tweets calls the move technically significant: highest 4h RSI on ETH since the top of the last bull run ~15 months ago, first time 3D momentum has crossed above the 50 level in 10 months, and first green momentum candles in ~3 months. Argues spot holdings on a momentum-cross are historically outrageously successful and that 'the meat of the move' hasn't even started yet — urges followers not to feel FOMO but to be ready for the cross.", "tweet_url": "https://x.com/ColdBloodShill/status/2090242080094253098", "images": ["https://pbs.twimg.com/media/HQIHMjqXQAExo5Y.jpg", "https://pbs.twimg.com/media/HQH9cCdWkAAjoMb.jpg", "https://pbs.twimg.com/media/HQH9yMUWoAAaYeR.jpg", "https://pbs.twimg.com/media/HQHS2y5WMAATGDV.jpg"], "type": "tweet"}, {"author": "AltcoinPsycho", "summary": "Calls the day's action the single largest liquidation event of short sellers in crypto history, saying it's hard to imagine the bottom isn't in for the stronger pairs.", "tweet_url": "https://x.com/AltcoinPsycho/status/2090157076529942977", "images": [], "type": "thread"}, {"author": "Crypto_McKenna", "summary": "Flags the largest Bitcoin short squeeze since 2021 with a chart, and separately reacts giddily to the broader rally ('swing for the home run', 'more aligned now than I have ever been').", "tweet_url": "https://x.com/Crypto_McKenna/status/2090128430914560281", "images": ["https://pbs.twimg.com/media/HQGgn26bIAAe9TP.jpg"], "type": "tweet"}, {"author": "cointradernik", "summary": "Posts ETH +18% on the day, quoting his own earlier call that acceptance above ~$2k would send it much higher.", "tweet_url": "https://x.com/cointradernik/status/2090205758268887082", "images": ["https://pbs.twimg.com/tweet_video_thumb/HQHnDkDXMAAjAnM.jpg"], "type": "tweet"}, {"author": "DCinvestor", "summary": "Runs a multi-tweet victory-lap reaction to the rally: '20% daily move on ETH?!?' incredulity; notes ETH added ~$45B market cap in 24h (more than 2x Hyperliquid's cap, nearly all of Solana's); and argues Tom Lee's ETH DAT (Bitmine) strategy of buying through the bear — mocked for months — is being vindicated as he 'probably helped put in the bottom,' predicting he'll be back on CNBC touting the long-term ETH arc once profitable.", "tweet_url": "https://x.com/DCinvestor/status/2090205593474883832", "images": [], "type": "thread"}, {"author": "Bluntz_Capital", "summary": "Reacts to the short liquidation wave ('had no idea how many people were short crypto') and to the return of big green candles after a long chop, plus a wry aside on whether AI played any role in the same-day Moderna cancer news.", "tweet_url": "https://x.com/Bluntz_Capital/status/2090185829302079973", "images": ["https://pbs.twimg.com/media/HQHU5PUbYAA5XB0.png"], "type": "tweet"}, {"author": "Evan_ss6", "summary": "Jokes that he 'FUD'd ETH yesterday so you guys could have this +20% daily,' a running bit about reverse-manifesting pumps.", "tweet_url": "https://x.com/Evan_ss6/status/2090197651715195201", "images": ["https://pbs.twimg.com/tweet_video_thumb/HQHlFxNXcAAFI1y.jpg"], "type": "thread"}, {"author": "fejau_inc", "summary": "Calls it a 'classic iconic big macro day,' and in a reply pushes back on someone dismissing the range breakout as 'nothing new,' noting he trades a different time horizon.", "tweet_url": "https://x.com/fejau_inc/status/2090301269143642477", "images": [], "type": "tweet"}, {"author": "CryptoCred", "summary": "Self-deprecating admission that despite the historic volatility, he wasn't long the BTC breakout, didn't catch the HYPE news, and doesn't even have tactical dry powder ready — setting up his separate psychology thread (see Insights).", "tweet_url": "https://x.com/CryptoCred/status/2090209604332327087", "images": [], "type": "thread"}]}, {"cluster": "Hyperliquid Comes to the US — SEC/CFTC Regulatory Legitimization & Clarity Act Push", "category": ["crypto", "regulation", "policy"], "items": [{"author": "Crypto_McKenna", "summary": "Reacts to the Trump/SEC news that Hyperliquid is being brought into the US, predicting US access will 'without a doubt' require KYC/AML; debates whether US persons get a separate orderbook or are simply restricted to KYC'd counterparties within a shared book. Separately voices confidence that new SEC Chairman Selig will 'lead the true frontier of on-chain markets' with pro-innovation policy.", "tweet_url": "https://x.com/Crypto_McKenna/status/2090158200222003565", "images": [], "type": "tweet"}, {"author": "rektmando", "summary": "Flags a Trump statement that the CFTC is working to bring Hyperliquid into the US 'in a legal fashion,' calling it potentially 'pretty big' — a possible regulatory legitimization catalyst for HYPE.", "tweet_url": "https://x.com/rektmando/status/2090156361413747082", "images": [], "type": "tweet"}, {"author": "alpha_pls", "summary": "Short reaction: 'Hyperliquid is coming to the USA,' quote-tweeting the Trump/SEC Chair news.", "tweet_url": "https://x.com/alpha_pls/status/2090167145648845264", "images": [], "type": "tweet"}, {"author": "arthur0x", "summary": "One-word quote-tweet reaction ('Hyperliquid') to the same news.", "tweet_url": "https://x.com/arthur0x/status/2090163396876628343", "images": [], "type": "tweet"}, {"author": "hosseeb", "summary": "Jokes 'Pouring one out for @KyleSamani' quoting the Hyperliquid US-onboarding news — a jab implying Multicoin/Samani missed out on the trade.", "tweet_url": "https://x.com/hosseeb/status/2090206727316844726", "images": [], "type": "tweet"}, {"author": "jchervinsky", "summary": "Reacts 'Hyperliquid is coming to America' to the same news, and in a separate reply insists the broader shift underway is best described as 'onchain finance,' not just an HL story.", "tweet_url": "https://x.com/jchervinsky/status/2090159049861984500", "images": [], "type": "tweet"}, {"author": "ASvanevik", "summary": "One-line reaction ('Hyperliquid.') to the SEC Chair news.", "tweet_url": "https://x.com/ASvanevik/status/2090225922335261020", "images": [], "type": "tweet"}, {"author": "brian_armstrong", "summary": "Posts that Trump's message today made clear the Administration is committed to passing the Clarity Act, says SEC Chair Atkins and CFTC Chair Selig are aligned and Congress has set a date, notes 67M Americans own crypto, and urges people to contact lawmakers to push the Senate to pass it.", "tweet_url": "https://x.com/brian_armstrong/status/2090253129837170899", "images": [], "type": "tweet"}, {"author": "MoonOverlord", "summary": "Posts a chart reacting to the claim that the KYC/TradeXYZ controversy will mark the bottom for $HYPE, then tells one follower they'll keep missing moves and another they can still buy back in 'before triple digits' — signaling a continued bullish view on further HYPE upside.", "tweet_url": "https://x.com/MoonOverlord/status/2090238494735990844", "images": ["https://pbs.twimg.com/media/HQIE0GXXsAALP5M.jpg"], "type": "thread"}]}, {"cluster": "Iran — US Military Pressure, Hormuz Oil Corridor & New Sanctions Threat", "category": ["geopolitics", "macro", "energy"], "items": [{"author": "zriboua", "summary": "Responding to a CNN claim that Iran is regaining control of the Strait of Hormuz, argues the opposite in a 3-point thread: Trump's focus is the nuclear program, but degrading IRGC ballistic-missile capability disarms Iran's delivery system; the US is blocking China from pushing Saudi/UAE oil trade into yuan; and weakening the IRGC lets the US hand regional security to allies, a model used in Syria and reportedly under discussion for Iraq.", "tweet_url": "https://x.com/zriboua/status/2090197122423394455", "images": [], "type": "thread"}, {"author": "zriboua", "summary": "Flags that with the US now receiving ~50% of Venezuela's oil production, China loses discounted-oil access from both Venezuela and Iran simultaneously.", "tweet_url": "https://x.com/zriboua/status/2090205767643136342", "images": [], "type": "tweet"}, {"author": "zriboua", "summary": "Highlights an Axios report that the US military has quietly established a Strait of Hormuz shipping corridor handling roughly 10 million barrels of oil per day.", "tweet_url": "https://x.com/zriboua/status/2090193914737090741", "images": [], "type": "tweet"}, {"author": "JavierBlas", "summary": "Reports Trump threatening any country that provides Iran financial help with 'TREMENDOUS Economic consequences,' specifically naming oil smuggling, swap lines, cash transfers, and ship registries as targets.", "tweet_url": "https://x.com/JavierBlas/status/2090218945974329519", "images": ["https://pbs.twimg.com/media/HQHzCsCWcAA4nZ2.jpg"], "type": "tweet"}, {"author": "lord_fed", "summary": "Reposts the Trump headline announcing the 'most crushing Iran economic operation.'", "tweet_url": "https://x.com/lord_fed/status/2090212461920002146", "images": ["https://pbs.twimg.com/tweet_video_thumb/HQHtJ5YWkAAwrjA.jpg"], "type": "tweet"}]}, {"cluster": "Stripe Acquires OpenRouter", "category": ["tech", "AI", "crypto"], "items": [{"author": "cryptopunk7213", "summary": "Praises OpenRouter founder Alex Atallah as a 'master at building aggregated platforms with the best user design' (citing his OpenSea track record), and argues the Stripe deal makes sense because tokens are effectively 'money for AI models' and owning that neutral plumbing matters strategically.", "tweet_url": "https://x.com/cryptopunk7213/status/2090137596135420199", "images": [], "type": "tweet"}, {"author": "AnjneyMidha", "summary": "Posts congratulatory replies on the OpenRouter deal ('you were an incredible leader on this project,' 'may the compute be with you'), signaling a16z-adjacent approval of the acquisition.", "tweet_url": "https://x.com/AnjneyMidha/status/2090180077766291623", "images": [], "type": "tweet"}, {"author": "jvisserlabs", "summary": "Frames the Stripe/OpenRouter acquisition alongside same-day Yen intervention and the Treasury buyback news as a single signal of how the financial system's guardrails are being rebuilt at the intersection of AI and crypto, contrasting 'the old system vs the new system' and urging readers to be ready.", "tweet_url": "https://x.com/jvisserlabs/status/2090153124220502034", "images": [], "type": "tweet"}]}, {"cluster": "Moderna/Merck Phase 3 mRNA Cancer Vaccine — AI-Accelerated Personalized Medicine", "category": ["society", "tech", "AI"], "items": [{"author": "cryptopunk7213", "summary": "Calls it a 'legendary day,' noting that within roughly a year AI has been used to design a personalized cancer treatment for a dog and now to support the first-ever successful Phase 3 trial for a personalized mRNA cancer vaccine — arguing AI-accelerated personalized medicine 'hasn't even started yet' and is already bearing fruit, attaching the $MRK/$MRNA stock-move screenshot.", "tweet_url": "https://x.com/cryptopunk7213/status/2090239318581244090", "images": ["https://pbs.twimg.com/media/HQIFkHTWUAAYA4N.jpg", "https://pbs.twimg.com/media/HQIFkHZWoAADNh7.jpg"], "type": "tweet"}, {"author": "Bluntz_Capital", "summary": "Wry aside asking whether AI actually played any part in 'Moderna curing cancer,' skeptical of the AI-narrative framing.", "tweet_url": "https://x.com/Bluntz_Capital/status/2090192266598179009", "images": [], "type": "tweet"}, {"author": "stevehou", "summary": "Jokingly asks if it's 'bearish' that Moderna cured cancer without using AI, then clarifies seriously: it's an mRNA cancer-prevention result, not a cure, and the discovery almost certainly involved AI somewhere in the R&D pipeline.", "tweet_url": "https://x.com/stevehou/status/2090281859863200073", "images": [], "type": "thread"}, {"author": "rektmando", "summary": "Reacting to news that $MRNA extended gains to +212% after hours (adding over $50B in market cap) on positive Phase 3 results for a first-of-kind mRNA cancer-prevention treatment, predicts 'AI meets pharma gonna see insane gains.'", "tweet_url": "https://x.com/rektmando/status/2090234291183640931", "images": [], "type": "tweet"}]}, {"cluster": "Bill Ackman Discloses Daughter Lucy's Brain Injury and Launches the Ackman Oxman Institute (AOI)", "category": ["society", "positioning"], "items": [{"author": "BillAckman", "summary": "In an extremely long, deeply personal thread, Ackman recounts his 26-year-old daughter Lucy's massive brain hemorrhage in February, her emergency hemicraniectomy at Mount Sinai roughly 19+ hours after onset (well past the standard 5-hour window), and her six-month recovery from coma to partial mobility and cognition (still unable to see or speak fully). He announces the launch of the Ackman Oxman Institute (AOI), a patient-centric, commercially-minded, non-academic brain research/rehab/longevity institute being built on a 3.4-acre West Side Manhattan campus (a 400,000 sq ft biotech building plus an adjoining SNL studio building and a vacant lot, totaling up to ~680,000 sq ft). He discloses a public SEC filing showing a ~$400 million gift of 10,000,000 Pershing Square Inc. (PS) shares from him and Neri Oxman to fund the AOI, with a further large non-PS gift to follow, and names a board including Dean Kamen, Regeneron CEO George Yancopoulos, Nobel laureate James Rothman, and Mount Sinai's Chris Kellner. He is recruiting a CEO (to be named by October) plus Chief Scientific/AI/Technology/Operating/Financial officers.", "tweet_url": "https://x.com/BillAckman/status/2090190151083532583", "images": [], "type": "thread"}]}, {"cluster": "Iran / Strait of Hormuz — US Military Oil Corridor & Regional Drawdown", "category": ["geopolitics", "energy", "macro", "EM"], "items": [{"author": "zriboua", "summary": "Responding to a CNN claim that Iran is regaining control of the Strait of Hormuz (framed sarcastically as \"Iran is winning\"), zriboua argues the opposite in a 3-point thread: (1) Trump's focus is the nuclear program, but degrading IRGC ballistic-missile capability also matters since it disarms Iran's delivery system; (2) the US is blocking China from using proximity to Iran to push Saudi/UAE oil trade into yuan; (3) weakening the IRGC lets the US hand regional security to allies — a model already used in Syria and reportedly under discussion for Iraq, since the US can't indefinitely police a region while the IRGC keeps funding proxy militias.", "tweet_url": "https://x.com/zriboua/status/2090197122423394455", "images": [], "type": "thread"}, {"author": "zriboua", "summary": "Flags that with the US now receiving ~50% of Venezuela's oil production, China loses its discounted-oil access from both Venezuela and Iran simultaneously — a strategic squeeze on Beijing's energy sourcing.", "tweet_url": "https://x.com/zriboua/status/2090205767643136342", "images": [], "type": "tweet"}, {"author": "zriboua", "summary": "Highlights an Axios report that the US military has quietly established a Strait of Hormuz shipping corridor handling roughly 10 million barrels of oil per day.", "tweet_url": "https://x.com/zriboua/status/2090193914737090741", "images": [], "type": "tweet"}]}, {"cluster": "China Economic Slowdown — Industrial Output & Retail Sales Miss", "category": ["macro", "EM"], "items": [{"author": "zriboua", "summary": "Shares a Reuters report that China's industrial output and retail sales slowed in July as extreme weather and weak domestic demand pressured policymakers toward more stimulus, following Q2 growth cooling to a 3.5-year low, underscoring China's continued export dependence amid US tariffs and Middle East conflict headwinds.", "tweet_url": "https://x.com/zriboua/status/2090168736598708449", "images": [], "type": "tweet"}]}, {"cluster": "US Debt Hits $40 Trillion — Treasury Doubles Long-End Buybacks (\"The Bessent Put\")", "category": ["macro", "positioning"], "items": [{"author": "TruthGundlach", "summary": "Notes the US national debt officially surpassed $40 trillion, and that the same day the Treasury announced a doubling of its periodic long-term bond purchases (buybacks).", "tweet_url": "https://x.com/TruthGundlach/status/2090175123110363538", "images": [], "type": "tweet"}, {"author": "RaoulGMI", "summary": "In \"The Bessent Put,\" argues the Treasury doubling long-end buybacks the day after the 30-year yield hit a 19-year high (5.33%) is a landmark signal: for the first time the fiscal authority, not the Fed, stepped in to defend the long end, effectively capping the range. Mechanically, buybacks pull old illiquid bonds off dealer balance sheets and fund the purchase via bills, raising the collateral value of Treasuries system-wide (a de facto liquidity easing) — enabled by a quiet QRA language change two weeks ago. He ties this to the recent joint yen intervention (stopping Japan from being a forced Treasury seller) and new dollar swap lines across Asia/the Gulf (keeping regional dollar debt rolling, benefiting China), arguing a weaker dollar is the lever to bring Japan and eventually China back as long-end buyers. He expects curve steepening next from Fed's Warsh as the other half of a \"grand bargain,\" with the whole apparatus ultimately financing both the aging-population entitlement burden and the AI/robot capex buildout — his \"Everything Code\"/economic-singularity thesis.", "tweet_url": "https://x.com/RaoulGMI/status/2090300651540779446", "images": [], "type": "thread"}, {"author": "pboockvar", "summary": "Reacting to the same buyback news, says Bessent is hoping for the favorable outcome (\"door #1\") but is giving up access to low-cost debt to do it; separately explains the mechanism — Treasury sells fresh short-term bills to raise the cash used to buy back longer-dated bonds.", "tweet_url": "https://x.com/pboockvar/status/2090172351107215774", "images": [], "type": "thread"}, {"author": "marcvanderchijs", "summary": "Notes Bitcoin broke out of its 6-month range the same day the national debt hit $40T (gold also rallying), crossing its 200-day moving average — which he calls the first sign of a new crypto bull market; says his own exposure is mostly indirect via $MSTR, $IBIT, $GLXY.", "tweet_url": "https://x.com/marcvanderchijs/status/2090265873676476551", "images": [], "type": "thread"}]}, {"cluster": "Moderna mRNA Cancer-Prevention Breakthrough — AI/Pharma Reaction", "category": ["tech", "AI", "positioning"], "items": [{"author": "stevehou", "summary": "Jokingly asks if it's \"bearish\" that Moderna cured cancer without using AI, then clarifies seriously: Moderna didn't actually find a \"cure for cancer\" (it's an mRNA cancer-prevention result), and the discovery almost certainly involved AI somewhere in the R&D pipeline even without a generative-AI angle.", "tweet_url": "https://x.com/stevehou/status/2090281859863200073", "images": [], "type": "thread"}, {"author": "rektmando", "summary": "Reacting to news that $MRNA extended gains to +212% after hours (adding over $50B in market cap) on positive Phase 3 results for a first-of-kind mRNA cancer-prevention treatment, predicts \"AI meets pharma gonna see insane gains.\"", "tweet_url": "https://x.com/rektmando/status/2090234291183640931", "images": [], "type": "tweet"}]}, {"cluster": "Hyperliquid ($HYPE) — Bottom Call & US Regulatory Access", "category": ["crypto", "regulation", "positioning"], "items": [{"author": "MoonOverlord", "summary": "Posts a chart reacting to the claim that the KYC/TradeXYZ controversy will mark the bottom for $HYPE, then tells one follower they'll keep missing moves and another that they can still buy back in \"before triple digits\" — signaling a continued bullish view on further HYPE upside.", "tweet_url": "https://x.com/MoonOverlord/status/2090238494735990844", "images": ["https://pbs.twimg.com/media/HQIE0GXXsAALP5M.jpg"], "type": "thread"}, {"author": "rektmando", "summary": "Flags a Trump statement that the CFTC is working to bring Hyperliquid into the US \"in a legal fashion,\" calling it potentially \"pretty big\" — a possible regulatory legitimization catalyst for HYPE.", "tweet_url": "https://x.com/rektmando/status/2090156361413747082", "images": [], "type": "tweet"}]}], "B_insights": [{"author": "dampedspring", "summary": "Andy Constan posts a 'Labels 101' explainer distinguishing Fed/Treasury tools by mechanism: QE (Fed buys long assets, raises reserves, cuts private-sector duration) vs YCC (similar, but only buys at the cap) vs a Fed Twist (buys duration/sells short bonds, reserve-neutral) vs Treasury issuance/buyback changes (also a twist on private-sector duration) vs repo backstops like BTFP (raises reserves, slows forced liquidation without forcing demand) vs regulatory changes (affect demand but not reserves/duration directly). He argues reserve levels barely matter under zero-reserve-requirement regimes while duration held by the private sector meaningfully drives financial conditions. In a same-day reaction he flags that the newly-announced Treasury buyback change bypassed the normal TBAC/QRA process (which met just 15 days prior), calling it '100% political,' and in a long reply thread fields follow-up questions on bill issuance, rate bands, and reserve-neutral twists.", "tweet_url": "https://x.com/dampedspring/status/2090200606329692198", "images": ["https://pbs.twimg.com/media/HQHmBI9WUAAILIC.jpg"], "type": "thread"}, {"author": "CryptoCred", "summary": "Long thread cataloguing the bad impulses traders have when they're on the wrong side of a big move — revenge shorting, oversizing to 'time-travel' back to a missed entry, TA cope demanding a retest, all-or-nothing exposure, decision paralysis, and overtrading the 5-minute chart. His prescribed reset: step away from the charts, then ask what signal is firing, what type of bet it is (mean reversion/trend/momentum/etc.), where the thesis is wrong, and whether size matches the current volatility. He discloses he'll try to scale into spot BTC under $70k, accepting he'll lose money and 'look silly' if price retraces the breakout below 66-67k.", "tweet_url": "https://x.com/CryptoCred/status/2090201763987279967", "images": ["https://pbs.twimg.com/media/HQHmTT2W0AAJuup.jpg"], "type": "thread"}, {"author": "DCinvestor", "summary": "Argues crypto narratives have evolved cycle over cycle — BTC-as-SoV, then programmable ETH/ICOs, then early DeFi/NFTs, then memecoins — and that this cycle's narrative, the entire financial system moving onchain to settle 24/7 across borders, could produce a far bigger move than most (repeatedly wiped-out) participants can imagine. Separately argues equity-market froth, the highest in nearly three decades, could easily spill into crypto once conditions turn, especially if the Fed/Treasury lean into money printing.", "tweet_url": "https://x.com/DCinvestor/status/2090303886670377122", "images": [], "type": "tweet"}, {"author": "Delphi_Digital", "summary": "Quotes their analyst Kevin arguing crypto is 'rewarding active traders again' — buy-and-hold in the majors has largely played itself out short-term, while pockets of real alpha now sit in small and mid caps for traders 'in the trenches.'", "tweet_url": "https://x.com/Delphi_Digital/status/2090142218518503426", "images": [], "type": "tweet"}, {"author": "ASvanevik", "summary": "Flags an unsolved market-structure gap: tokenized stocks currently exist as fragmented, low-liquidity instruments spread across multiple issuers and chains (e.g., five different SpaceX tokens across seven chains), and asks who is building a 'tokenized stock abstraction' layer to let users simply buy exposure without picking the specific wrapper/chain.", "tweet_url": "https://x.com/ASvanevik/status/2090270785411940812", "images": [], "type": "tweet"}, {"author": "cryptopunk7213", "summary": "On Jeff Dean's new AI research lab: says Dean combines 'delusional ambition' (automating all research with AI) with proven execution, noting he's personally responsible for an estimated $100Bs of Google's market cap.", "tweet_url": "https://x.com/cryptopunk7213/status/2090284158236996065", "images": [], "type": "tweet"}, {"author": "Geiger_Capital", "summary": "Quotes Stanley Druckenmiller stating entitlement cuts are unavoidable — 'cut them now or cut them later, and later will be more painful' — posted alongside news that US national debt hit $40 trillion.", "tweet_url": "https://x.com/Geiger_Capital/status/2090210719417475481", "images": [], "type": "tweet"}, {"author": "0xngmi", "summary": "DefiLlama's founder clarifies their 'holders revenue' metric definition — money distributed directly to token holders via dividends or buybacks — framing it as the on-chain equivalent of a TradFi direct-yield calculation.", "tweet_url": "https://x.com/0xngmi/status/2090130016839364683", "images": [], "type": "tweet"}, {"author": "himgajria", "summary": "Argues capital currently in AI should rotate into crypto rather than equities broadly ('If you're in AI, pivot to crypto'; in a separate reply: 'Crypto yes, equities no').", "tweet_url": "https://x.com/himgajria/status/2090178050529059020", "images": [], "type": "tweet"}, {"author": "0xQuit", "summary": "Announces Season 2 of his FWAPHouse vault (own product): Season 1 traditional exits are disabled in favor of a reconciliation/migration contract; S1 actually returned ~2% (~80% APY) though lagging reward settlement made NAV misleadingly show losses for early depositors. S2 fixes this by using epoch-based entries (new deposits admitted only after pending rewards settle), starting with 6-hour epochs that lengthen as the pool grows, so performance should be visible from day one rather than appearing as losses during immaturity.", "tweet_url": "https://x.com/0xQuit/status/2090258177984258522", "images": [], "type": "thread"}, {"author": "ZeeContrarian1", "summary": "Detailed long-form thesis for initiating a 3% position in $SNAP at $5.15/share. Core argument: Snap has ~971M monthly / ~493M daily users but is valued at only ~$9B, versus ~$241/DAU for Reddit and ~$393/DAU for Meta vs. ~$18/DAU for Snap — it doesn't need to match their monetization, just get less bad at it. Q2 2026 results show revenue +19% YoY to $1.6B, DAUs +5%, free cash flow up to $121M from $24M, and narrowing net loss. Argues AI lowers engineering/advertising/personalization costs disproportionately for smaller players like Snap, closing the monetization gap with much larger operating leverage. Also expects the $2,195 AR Specs glasses to flop commercially, which he views as a positive catalyst if it forces management to refocus capital on the core ad/subscription business. Notes Irenic Capital's March 2026 ~2.5% stake (7-8% of their $2.5B fund) and $35B valuation thesis, and that Snap already cut ~16% of headcount and spun off Specs as a separate subsidiary — concluding the stock could double from here.", "tweet_url": "https://x.com/ZeeContrarian1/status/2090129122294931579", "images": ["https://pbs.twimg.com/media/HQGhW0zWQAA7PtY.jpg", "https://pbs.twimg.com/media/HQGhXbFXYAAt2R9.jpg"], "type": "thread"}, {"author": "RaoulGMI", "summary": "Argues Anthropic's revenue run rate is the fastest revenue ramp ever recorded — a \"double exponential\" that he frames as Reed's Law showing up in actual revenue for the first time ever. Underneath it, he sees a Jevons paradox: token volumes keep exploding as more people adopt AI even as per-token cost implodes, making intelligence cheaper the more it's used. He predicts this dynamic is just starting and will eventually put intelligence into every device (fridges, watches, etc.), scaling at every level simultaneously.", "tweet_url": "https://x.com/RaoulGMI/status/2090243084852318406", "images": [], "type": "thread"}, {"author": "RaoulGMI", "summary": "Reflects on what stays valuable in an \"Economic Singularity\" where AI automates most work, using chess as evidence: no human has beaten a computer at chess in 35 years, yet the chess industry (and human competition around it) has never been bigger and is worth billions — because people want to watch flawed humans compete, the same reason robots will never play football. Plugs his broader \"Everything Code\"/Economic Singularity frameworks.", "tweet_url": "https://x.com/RaoulGMI/status/2090136597719060790", "images": [], "type": "thread"}, {"author": "nic_carter", "summary": "On the Flock license-plate-reader controversy, argues the left opposes it reflexively because it's pro-police tooling, while the right fears anarcho-tyrannical misuse (letting real crime slide while targeting political opponents) — and concedes the right's concern isn't unreasonable, but says the fix is holding police departments accountable, not attacking the technology itself.", "tweet_url": "https://x.com/nic_carter/status/2090232585389748363", "images": [], "type": "thread"}, {"author": "nic_carter", "summary": "Pushes back on generic AI-datacenter complaints (water/noise/emissions) by satirizing the \"old good, new bad\" framing, and separately argues AI datacenters produce a genuinely new, valuable commodity — intelligence — whose cost per unit is undergoing hyperdeflation, urging critics to be honest about the units they're comparing.", "tweet_url": "https://x.com/nic_carter/status/2090215636387734009", "images": [], "type": "thread"}, {"author": "PeterDiamandis", "summary": "Long promotional/profile thread announcing the judging panel for the $2M Build-with-Gemini XPRIZE (26k competitors over 90 days, real-revenue businesses only). Profiles include Palmer Luckey (sold Oculus to Facebook for $2B at 21; Anduril made $2.2B revenue last year plus a $20B Army agreement), Cathie Wood (ARK's $26B fund; cites ARK research showing AI inference costs fell over 99% in twelve months), Logan Kilpatrick (ex-NASA/Apple/OpenAI, now runs Google AI Studio/Gemini API), Anousheh Ansari, and Mark Pincus. Winners announced Sept 25 in LA, $2M across 25 winners with a $500K grand prize.", "tweet_url": "https://x.com/PeterDiamandis/status/2090167677658779846", "images": ["https://pbs.twimg.com/media/HQHD-kSaYAADF92.jpg", "https://pbs.twimg.com/media/HQHEC76bYAALZOO.jpg", "https://pbs.twimg.com/media/HQHEBF3aYAAueal.jpg", "https://pbs.twimg.com/media/HQHEGS_a4AAlVKo.jpg", "https://pbs.twimg.com/media/HQHEEldagAADlnw.jpg"], "type": "thread"}, {"author": "RayDalio", "summary": "\"Principle of the day\": argues evolutionary/self-correcting cycles apply to people, countries, companies and economies alike — oversupply leads to falling prices, business failures and capacity reduction until supply matches demand, then the cycle reverses; similarly, economies that turn bad enough force political/policy change or replacement of those running them.", "tweet_url": "https://x.com/RayDalio/status/2090182018940518700", "images": ["https://pbs.twimg.com/media/HQGeiHZW8AAG_8P.jpg"], "type": "tweet"}, {"author": "novogratz", "summary": "Recapping a Wyoming Blockchain Symposium panel with Scaramucci and Denelle Dixon, argues tokenization and stablecoins will give billions of people worldwide greater access to US markets and the dollar, and that US policymakers should seize the moment to cement America's global financial leadership.", "tweet_url": "https://x.com/novogratz/status/2090176365664358831", "images": ["https://pbs.twimg.com/media/HQHMUOlW0AAJKB0.jpg"], "type": "tweet"}, {"author": "naval", "summary": "Predicts all UI will eventually converge to chat and gestures as input, chat and video as output.", "tweet_url": "https://x.com/naval/status/2090217457202163972", "images": [], "type": "tweet"}, {"author": "nicbstme", "summary": "Responding to news that Microsoft's MAI-Image-2.5-Pro debuted #1 on the Artificial Analysis image-editing leaderboard, says it's now the best model for image editing — noting that previously you needed a full app like Photoshop (which he personally struggled with) but now a single prompt does the edit; also finds it useful for generating images to understand documents, codebases, and product specs.", "tweet_url": "https://x.com/nicbstme/status/2090282814185107932", "images": [], "type": "tweet"}, {"author": "thedefivillain", "summary": "Questions data showing what's being called the largest short-liquidation day of the cycle, saying the figure doesn't add up; a reply thread clarifies the data source as Velo.", "tweet_url": "https://x.com/thedefivillain/status/2090120095116759539", "images": ["https://pbs.twimg.com/media/HQGYpsUXUAApG0q.jpg"], "type": "thread"}, {"author": "paulg", "summary": "Argues that decreasing the price of something people can buy is identical to increasing their wealth, pushing back on a commenter who seemingly didn't grasp that equivalence.", "tweet_url": "https://x.com/paulg/status/2090178946520543496", "images": [], "type": "thread"}, {"author": "stevehou", "summary": "Jokes that by transitivity, since the Fed takes its signal from markets and markets take instruction from the Treasury, the Fed effectively takes its signal from the Treasury — a wry take on the tension between the new Fed chair's push for market independence and the Treasury's drive to lower long-term yields.", "tweet_url": "https://x.com/stevehou/status/2090245598612017601", "images": [], "type": "tweet"}, {"author": "stevehou", "summary": "Shares a YTD performance chart in reply to @eliant_capital, saying his own profile is \"not quite as good\" but similar.", "tweet_url": "https://x.com/stevehou/status/2090256229096436158", "images": ["https://pbs.twimg.com/media/HQImPIXW0AAYQE8.jpg"], "type": "thread"}, {"author": "Matt_Hougan", "summary": "Reacting to data showing over $300M of volume across Bitwise crypto ETFs in a single day (BITB ~$156M, BSOL ~$58M, BHYP ~$45M, ETHW ~$35M, XRP ~$20M), calls it \"beautiful.\"", "tweet_url": "https://x.com/Matt_Hougan/status/2090220824154231209", "images": [], "type": "tweet"}, {"author": "sama", "summary": "Announces \"we support business privacy!\" with a link, appearing to reference a new privacy-related policy or feature for OpenAI/ChatGPT business users.", "tweet_url": "https://x.com/sama/status/2090163991234453611", "images": [], "type": "tweet"}], "C_contrarian": [{"author": "Fiskantes", "summary": "Pushes back on the euphoric 'we are so back' reaction to the liquidation-driven rally: argues liquidation cascades typically overshoot then retrace, so if this were bearish news you'd buy dips from forced sellers — by the same logic you should consider selling into forced buyers now. Also notes that historically, Trump-driven market catalysts have consistently proven overblown and normalized within days. Says he's playing it tactically — small size, trimming some longs to rebuy lower, hedging with a bit of ETH short exposure rather than repositioning the whole book. (Against: That the ETH/BTC short-squeeze rally is the start of a durable new leg up that should be chased)", "tweet_url": "https://x.com/Fiskantes/status/2090198173570465843", "images": ["https://pbs.twimg.com/media/HQHU5PUbYAA5XB0.png"]}, {"author": "_tolks", "summary": "Responding to Trump's 'most crushing economic operation' rhetoric on Iran, argues it's actually further signaling of a desire to de-escalate (to support lower oil, DXY, and yields into the midterms) rather than genuine escalation — 'crushing economic operation' language has been applied to Iran for decades and reads tough while conveniently shelving kinetic options, letting the administration claim a 'wild success' while bowing out. (Against: That fresh Trump rhetoric on Iran signals real, escalating geopolitical/military risk)", "tweet_url": "https://x.com/ // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
