Hendrix", "type": "causal", "entities": ["Mark Carney", "Donald Trump", "Canada"], "conviction": "high", "so_what": "The political constraint runs through Canadian public opinion, so even a US climbdown would face a lag before technical cooperation resumes — a durable friction premium on bilateral files.", "quote": "Prime Minister Mark Carney, the target of sharp criticism from Trump, already cannot go to the Canadian public to promote the virtues of data sharing and comonitoring under these circumstances", "locator": "In fact, tariffs would only poison the goodwill", "quote_verified": true}, {"claim": "Four paths exist — restoring status quo coinvestment in fire detection, emergency response coordination and prepositioned aerial suppression; joint investment in adaptation and resilience; joint climate mitigation; or escalation — and only the escalation path both fails to address the fires and destroys the mutual aid that reduces costs.", "speaker": "Cullen S. Hendrix", "type": "framework", "entities": ["Canada", "United States", "aerial fire suppression", "adaptation"], "conviction": "high", "so_what": "The three constructive paths all imply procurement spend on detection systems, aerial tankers, and resilience infrastructure — the concrete beneficiary set if policy turns cooperative.", "quote": "There are no silver bullets; however, the US and Canada can collaborate to put shock absorbers in place and address underlying causes.", "locator": "What would help—and what it would require", "quote_verified": true}]}], "insight_total": 17, "top_entities": ["Canada", "US", "Donald Trump", "Mark Carney", "Indonesia", "ASEAN", "Rhine", "palm oil", "Section 301", "climate change", "boreal forest", "Great Lakes"], "source_meta": {"author": "Cullen S. Hendrix", "word_count": 1430, "paywalled": false}}, {"record_id": "ecb1e22055044381", "source_type": "concepts", "source_name": "Peterson Institute (PIIE)", "source_url": "https://www.piie.com/blogs/realtime-economics/2026/how-trumps-next-tariffs-could-drive-companies-back-china", "title": "How Trump's next tariffs could drive companies back to China", "published_date": "2026-08-10", "language": "en", "processed_at": "2026-08-11T12:21:00Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Geopolitics", "Tech", "Positioning"], "gist": "US import sourcing responds to tariff DIFFERENTIALS between countries, not to tariff levels: a 20% China-only smartphone tariff in 2025 moved two-thirds of US smartphone imports to India within months, while equally high tariffs on Chinese and Indian clothing moved nothing. With the Supreme Court's February 2026 strike-down flattening tariffs across countries and a US-China Board of Trade contemplating lower tariffs on $30 billion of 'nonsensitive' Chinese goods, the next Section 301 round on 16 economies could invert the incentive and pull supply chains back into China.", "themes": [{"theme": "Tariff differentials, not levels", "insights": [{"claim": "The variable that determines whether supply chains leave or return to China is the product-level tariff differential between China and alternative source countries, not the absolute height of US tariffs on China.", "speaker": "Chad P. Bown", "type": "framework", "entities": ["China", "India", "United States", "supply chains", "tariffs"], "conviction": "high", "so_what": "Track product-level China-vs-alternative tariff gaps rather than headline China tariff rates when forecasting reshoring/friendshoring winners; a rising China tariff with a rising Vietnam tariff is a non-event.", "quote": "In the absence of a substantial tariff gap, China is often too competitive on cost for sourcing companies in America to ignore.", "locator": "For the supply chain implications resulting from", "quote_verified": true}, {"claim": "Imports of a product from a single country can rise even as US tariffs on that product rise overall, provided competing supplier countries are hit harder — a pattern documented in historical trade war episodes.", "speaker": "Chad P. Bown", "type": "contrarian", "entities": ["China", "United States", "How to Win a Trade War"], "conviction": "high", "so_what": "Rising tariffs on China are not automatically bearish for China-sourced import volumes; relative treatment can dominate and wrong-foot consensus reshoring trades.", "quote": "What mattered was that other countries all got hit with something worse.", "locator": "It is not unprecedented that US imports", "quote_verified": true}, {"claim": "Competitive dynamics can force a firm to source from China against its own risk-management preference: if rivals all buy from China and tariffs on alternative countries stay too high, staying in business requires matching them.", "speaker": "Chad P. Bown", "type": "causal", "entities": ["Jamieson Greer", "China", "US importers"], "conviction": "medium", "so_what": "Corporate 'China+1' commitments are fragile to cost pressure; expect de-risking narratives in earnings calls to quietly reverse if the tariff gap closes.", "quote": null, "locator": "Even though a company may understand Greer's warning", "quote_verified": false}]}, {"theme": "Smartphone shift to India", "insights": [{"claim": "Under IEEPA, a 20 percent tariff on all Chinese products took effect March 4, 2025, hitting smartphones for the first time — they had been exempted from the 2018-19 trade war.", "speaker": "Chad P. Bown", "type": "data_point", "entities": ["IEEPA", "smartphones", "China", "Trump"], "conviction": "high", "so_what": "Establishes the exact policy shock date for event studies on handset supply chains and Apple gross margin commentary.", "quote": null, "locator": "Less than seven weeks after retaking office", "quote_verified": false}, {"claim": "Smartphones accounted for nearly 10 percent of total US imports from China in 2024, and Apple supplied more than half of US consumer smartphone purchases, peaking near two-thirds in Q4 2024 and Q4 2025 per Counterpoint Research.", "speaker": "Chad P. Bown", "type": "data_point", "entities": ["Apple", "Counterpoint Research", "China", "smartphones"], "conviction": "high", "so_what": "Sizes the exposure: one product category and effectively one company dominate the most-watched US-China tariff line.", "quote": null, "locator": "Smartphones were economically important", "quote_verified": false}, {"claim": "US smartphone import sourcing flipped from over 90 percent China as late as October 2024 (India just 6 percent) to nearly two-thirds from India by May 2025.", "speaker": "Chad P. Bown", "type": "data_point", "entities": ["India", "China", "Apple", "smartphones"], "conviction": "high", "so_what": "Demonstrates supply chains can re-route within roughly six months when the tariff gap is wide enough — reshoring timelines assumed to take years are too pessimistic.", "quote": "By May 2025, nearly two-thirds of US smartphone imports were arriving from India, up from only 6 percent as late as October of 2024.", "locator": "The size and the speed of the economic adjustment", "quote_verified": true}, {"claim": "The speed of the 2025 relocation depended on logistics and regulatory workarounds, not just factory capacity: Apple chartered six cargo planes in March 2025 to fly roughly 1.5 million iPhones (about $2 billion) from India to the US and got Chennai airport customs clearance cut to six hours from 30.", "speaker": "Chad P. Bown", "type": "anecdote", "entities": ["Apple", "Foxconn", "Wistron", "Chennai airport", "India", "Reuters"], "conviction": "high", "so_what": "Air-freight and customs throughput are the binding constraints in a tariff scramble — watch freight rates and port/airport clearance times as early indicators of a sourcing shift.", "quote": "to six hours down from 30 hours.", "locator": "Such a quick shift required more than the capacity", "quote_verified": true}, {"claim": "India's iPhone assembly base was not built in response to tariffs; Foxconn and Wistron had already created the alternative supply chain, with the 2022 Shanghai lockdown pushing Apple to accelerate it.", "speaker": "Chad P. Bown", "type": "causal", "entities": ["Apple", "Foxconn", "Wistron", "India", "Shanghai", "Patrick McGee"], "conviction": "high", "so_what": "Fast tariff-driven relocation is only possible where latent capacity already exists — categories without a pre-built alternative will not replicate the iPhone playbook.", "quote": null, "locator": "Apple responded to Trump's early 2025 tariffs", "quote_verified": false}, {"claim": "The India relocation was not one-way: US smartphone imports from China suddenly and temporarily rose from September 2025 despite the 20 percent tariff, because Indian quality and delivery problems ahead of the iPhone 17 launch forced Apple to shift orders back to Foxconn in China.", "speaker": "Chad P. Bown", "type": "data_point", "entities": ["Apple", "iPhone 17", "Foxconn", "China", "India"], "conviction": "high", "so_what": "Execution risk in alternative geographies can override a 20-point tariff penalty around product launches — a recurring seasonal reversal risk for India-sourcing narratives.", "quote": "In the run-up to the iPhone 17 launch in September 2025, product quality and delivery schedules were disappointing, forcing Apple to shift some orders bound for India back to Foxconn in China", "locator": "US smartphone imports from China did suddenly", "quote_verified": true}]}, {"theme": "Clothing counterexample", "insights": [{"claim": "Clothing tariffs on China rose by more than smartphone tariffs did in 2025, yet US clothing imports did not switch to India, because Trump's Liberation Day and August actions did not exempt Indian clothing.", "speaker": "Chad P. Bown", "type": "causal", "entities": ["clothing", "China", "India", "Liberation Day tariffs"], "conviction": "high", "so_what": "A clean natural experiment showing that raising China tariffs alone does not shift sourcing — a warning against modeling reshoring off China-tariff levels.", "quote": null, "locator": "Trump's 2025 tariff actions on clothing", "quote_verified": false}, {"claim": "By October 2025 US tariffs on clothing from India exceeded those on clothing from China, and by end-2025 the China-versus-Vietnam and China-versus-Bangladesh tariff differential was basically unchanged from pre-Trump 2.0 levels.", "speaker": "Chad P. Bown", "type": "data_point", "entities": ["India", "Vietnam", "Bangladesh", "China", "clothing"], "conviction": "high", "so_what": "Apparel sourcing incentives were effectively untouched by two years of tariff drama — discount claims that Vietnam/Bangladesh apparel gained structural share from tariffs.", "quote": "For clothing, there was little new tariff incentive in 2025 to move a supply chain out of China to these alternative destinations.", "locator": "By October 2025, US tariffs on clothing", "quote_verified": true}]}, {"theme": "Post-SCOTUS flat tariff regime", "insights": [{"claim": "The Supreme Court struck down the country-specific IEEPA tariffs in February 2026, erasing both the China-over-India smartphone gap and the India-over-China clothing gap.", "speaker": "Chad P. Bown", "type": "data_point", "entities": ["Supreme Court", "IEEPA", "China", "India"], "conviction": "high", "so_what": "The legal foundation of country-discriminatory tariffs is gone; new tariff architecture must be built on Section 122/301, which shapes how discriminatory it can be.", "quote": null, "locator": "In February 2026, the Supreme Court struck down", "quote_verified": false}, {"claim": "After the February 2026 ruling the US moved to a relatively flat cross-country tariff structure: temporary 10 percent duties under Section 122 of the Trade Act of 1974, replaced in July by 10.0-12.5 percent Section 301 forced-labor tariffs on America's top 60 trading partners, again exempting smartphones including from China.", "speaker": "Chad P. Bown", "type": "data_point", "entities": ["Section 122", "Section 301", "Trade Act of 1974", "smartphones", "China"], "conviction": "high", "so_what": "Smartphones are now tariff-exempt from every origin including China — removing the entire economic rationale for India assembly on tariff grounds.", "quote": null, "locator": "Since then, the US has applied a relatively flat", "quote_verified": false}, {"claim": "Sourcing has stabilized rather than reversed so far: between March and June 2026 nearly 60 percent of US smartphone imports still came from India, a larger share than in the four months before the Court's decision, and clothing sourcing showed little change.", "speaker": "Chad P. Bown", "type": "data_point", "entities": ["India", "China", "smartphones", "clothing"], "conviction": "high", "so_what": "Supply chains exhibit hysteresis — once relocated they do not snap back immediately, giving a lag between policy change and trade-flow reversal that can be traded.", "quote": null, "locator": "US import sourcing for smartphones and clothing has stabilized", "quote_verified": false}]}, {"theme": "Board of Trade and the reversal risk", "insights": [{"claim": "A US-China Board of Trade agreed by Trump and Xi Jinping at their May summit in Beijing contemplates $30 billion of US imports of 'nonsensitive' Chinese products, with USTR running a public comment process to build the list and stating it would be willing to lower tariffs on those goods.", "speaker": "Chad P. Bown", "type": "data_point", "entities": ["Board of Trade", "Xi Jinping", "Trump", "USTR", "China"], "conviction": "high", "so_what": "The $30 billion nonsensitive list is a concrete, comment-period-visible catalyst: companies in those product lines get a China cost advantage over other origins.", "quote": null, "locator": "For certain nonsensitive products, increasing US imports", "quote_verified": false}, {"claim": "Cutting tariffs on Chinese 'nonsensitive' goods while leaving them on the same goods from other countries would directly incentivize companies to switch sourcing back to China — and USTR's Greer stayed noncommittal when pressed on whether Chinese goods could enter at a lower rate than identical goods from elsewhere.", "speaker": "Chad P. Bown", "type": "thesis", "entities": ["Jamieson Greer", "USTR", "China", "Board of Trade"], "conviction": "high", "so_what": "The administration's own trade deal contradicts its de-risking rhetoric; a negative China tariff differential is a live policy possibility, not a tail scenario.", "quote": "the same goods coming in from other countries.", "locator": "When pressed, Greer also remained noncommittal", "quote_verified": true}, {"claim": "China's government stated in July 2026 that the Trump administration committed to keeping any new US tariffs on China — inclusive of the 12.5 percent July forced-labor Section 301 tariff — at or below 20 percent.", "speaker": "Chad P. Bown", "type": "data_point", "entities": ["China", "Section 301", "Trump administration"], "conviction": "medium", "so_what": "A stated 20 percent ceiling on China tariffs caps how wide the upcoming Section 301 excess-capacity differential can get, tilting the odds toward sourcing returning to China.", "quote": null, "locator": "In July 2026, the Chinese government stated", "quote_verified": false}, {"claim": "A new tariff round is expected on 16 economies including China and India following Section 301 investigations into excess capacity, and its outcome determines whether supply chains keep leaving China or return.", "speaker": "Chad P. Bown", "type": "prediction", "entities": ["Section 301", "China", "India", "16 economies"], "conviction": "high", "so_what": "The completion date and product-line detail of the excess-capacity Section 301 findings is the single most tradeable upcoming trade-policy event for supply chain positioning.", "quote": null, "locator": "Why Trump's next tariff moves could change the dynamics", "quote_verified": false}, {"claim": "If the new tariffs prove more legally durable than the IEEPA measures the Supreme Court struck down, the resulting reduction in policy uncertainty could itself push companies to increase sourcing from China.", "speaker": "Chad P. Bown", "type": "causal", "entities": ["Supreme Court", "IEEPA", "Section 301", "China"], "conviction": "medium", "so_what": "Legal durability is an underrated second-order channel: a stable tariff regime lowers the option value of geographic diversification, favoring the lowest-cost producer.", "quote": null, "locator": "If the new tariffs prove more legally durable", "quote_verified": false}, {"claim": "US Trade Representative Jamieson Greer publicly warned in a July New York Times interview that companies which already moved sourcing out of China would be making a mistake to move it back, framing China reliance as high-risk.", "speaker": "Chad P. Bown", "type": "thesis", "entities": ["Jamieson Greer", "USTR", "New York Times", "China"], "conviction": "high", "so_what": "Official rhetoric and official tariff design are pointing in opposite directions — the gap is where policy surprise, and mispricing, lives.", "quote": "They understand the high-risk nature of being super-reliant on China.", "locator": "Convincing companies to source from outside of China", "quote_verified": true}]}], "insight_total": 20, "top_entities": ["China", "India", "Apple", "Jamieson Greer", "Foxconn", "Supreme Court", "Section 301", "IEEPA", "Board of Trade", "Trump", "smartphones", "clothing"], "source_meta": {"author": "Chad P. Bown", "word_count": 1745, "paywalled": false}}, {"record_id": "79b601918d32ede4", "source_type": "concepts", "source_name": "Sequoia Arc", "source_url": "https://sequoiacap.com/article/partnering-with-corma-closing-the-defensive-cybersecurity-gap/", "title": "Partnering with Corma: Closing the Defensive Cybersecurity Gap", "published_date": "2026-08-10", "language": "en", "processed_at": "2026-08-11T12:20:03Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "Sequoia is leading the seed round of Corma, a startup training a defense-specific foundation model because logs/telemetry data and open-ended anomaly hunting are out of distribution for general-purpose frontier models, while agentic AI (including Anthropic's Mythos discovering zero-days) has made offense cheap and scalable. The core empirical hook: in Corma's red/blue simulations a defender model failed to find a backdoor 78% of the time even when it was an identical copy of the model that planted it, implying attackers structurally win at equal model quality.", "themes": [{"theme": "Offense-defense asymmetry", "insights": [{"claim": "In red/blue team simulations run by the cybersecurity startup Corma, where an attacker plants a hidden backdoor and a defender hunts for it, the defender failed 78% of the time even when the defender was an identical copy of the model that planted the backdoor.", "speaker": "Sequoia Arc", "type": "data_point", "entities": ["Corma", "red team", "blue team", "foundation models", "cybersecurity"], "conviction": "high", "so_what": "The single hardest number in the piece: it argues that simply pointing the same frontier model at defense does not close the gap, so incumbent SOC vendors bolting a general LLM onto their product are structurally disadvantaged versus defense-trained models.", "quote": "The defender failed to find the backdoor 78% of the time, even when the defender was an identical copy of the very same model that planted it.", "locator": "Corma has illustrated this", "quote_verified": true}, {"claim": "Holding model quality constant, attackers structurally retain the advantage in cybersecurity, so the only counter to improving offensive scaling laws is building better scaling laws specifically for defense.", "speaker": "Sequoia Arc", "type": "thesis", "entities": ["cybersecurity", "scaling laws", "AI"], "conviction": "high", "so_what": "Frames security spend as a permanent AI-capex race rather than a one-time upgrade cycle, supporting a structurally rising security budget line for enterprises.", "quote": "The only answer to scaling laws on offense is better scaling laws on defense.", "locator": "Holding model quality constant", "quote_verified": true}, {"claim": "Anthropic's Mythos-class models can discover and exploit zero-day vulnerabilities, and an explosion in reported CVEs has followed the arrival of agentic AI and these models.", "speaker": "Sequoia Arc", "type": "data_point", "entities": ["Anthropic", "Mythos", "CVEs", "zero-day vulnerabilities"], "conviction": "medium", "so_what": "CVE disclosure volume is a tradable leading indicator of patch-management and vulnerability-management demand; watch it as the tape for this whole category.", "quote": "Anthropic’s Mythos can discover and exploit zero-day vulnerabilities.", "locator": "Cyberattacks are about technical exploitation", "quote_verified": true}]}, {"theme": "Why defense is out of distribution", "insights": [{"claim": "Defensive security data lives in logs, events, traces and telemetry, a modality that barely appears in LLM pretraining corpora, and defense requires open-ended anomaly hunting across vast normal-looking activity rather than the goal-directed reasoning that offense uses.", "speaker": "Sequoia Arc", "type": "framework", "entities": ["LLMs", "telemetry", "logs", "cybersecurity", "pretraining"], "conviction": "high", "so_what": "A clean mental model for which AI verticals resist general-model commoditization: the ones whose data modality is absent from web-scale pretraining and whose task is open-ended search rather than objective-directed.", "quote": "In short, defense is out of distribution for general-purpose frontier models: neither the data nor the intuition it requires is well-represented in training.", "locator": "The relevant data lives in logs, events", "quote_verified": true}, {"claim": "Frontier labs racing toward AGI will not detour to overhaul their training pipelines for defensive cybersecurity, leaving the capability gap open for a specialist to fill.", "speaker": "Sequoia Arc", "type": "contrarian", "entities": ["frontier labs", "AGI", "Corma", "cybersecurity"], "conviction": "medium", "so_what": "This is the load-bearing assumption of the investment; if a major lab does ship a defense-tuned model, the specialist's moat collapses, so treat lab roadmaps as the key falsification signal.", "quote": "In the race toward AGI, we cannot expect the frontier labs to take the detour of overhauling their training pipelines for defensive cybersecurity.", "locator": "In the race toward AGI", "quote_verified": true}]}, {"theme": "Self-play as the training path", "insights": [{"claim": "Cybersecurity is framed as a two-player, zero-sum game with a clean reward signal (breached or not) and an unlimited supply of games, making it the same paradigm in which reinforcement learning and self-play previously produced superhuman results in Go and chess.", "speaker": "Sequoia Arc", "type": "framework", "entities": ["reinforcement learning", "self-play", "Go", "chess", "Corma"], "conviction": "high", "so_what": "A screening test for where RL will actually deliver superhuman AI products: verifiable reward plus unlimited simulated environments, which points to security, trading and formal verification over open-ended knowledge work.", "quote": "Cybersecurity, like Go or chess, is a two-player, zero-sum game with a clean reward (were you breached or not?) and an endless supply of games to play.", "locator": "Corma founder and CEO Alon Pluda", "quote_verified": true}, {"claim": "Corma trains via large-scale reinforcement learning inside simulated cybersecurity environments that replicate real enterprise networks including their tools, telemetry and noise, and claims the resulting model outperforms general-purpose foundation models at much lower per-token inference cost.", "speaker": "Sequoia Arc", "type": "thesis", "entities": ["Corma", "reinforcement learning", "enterprise networks", "foundation models", "inference cost"], "conviction": "medium", "so_what": "Simulated enterprise environments become the scarce asset in vertical AI; whoever owns a high-fidelity environment generator owns the RL data flywheel, a pattern worth scanning for in other verticals.", "quote": "large-scale reinforcement learning across cybersecurity environments that replicate real enterprise networks, with all their tools, telemetry and noise", "locator": "Corma pushes this further", "quote_verified": true}]}, {"theme": "Owned weights as the moat", "insights": [{"claim": "A vertically integrated, sovereign-AI security vendor that owns its own model weights escapes the cybersecurity-usage restrictions that closed model labs impose on their APIs, and avoids the always-on inference bills that continuous monitoring generates.", "speaker": "Sequoia Arc", "type": "thesis", "entities": ["Corma", "closed model labs", "sovereign AI", "model weights", "inference cost"], "conviction": "high", "so_what": "Closed labs' acceptable-use policies on security tooling are an underappreciated structural subsidy to open-weight and self-trained vendors; check any AI security vendor's dependency on a third-party API before underwriting its margins.", "quote": "Owning the model weights matters (they aren’t subject to restrictions on cybersecurity-related usage set by the closed model labs).", "locator": "In the cat-and-mouse game of cybersecurity", "quote_verified": true}]}, {"theme": "Agentic security workforce traction", "insights": [{"claim": "Corma's model is productized as an agentic \"Security Workforce\" filling roles across security operations, identity management, cloud and network security, and is already deployed at Fortune 500 companies and large enterprises in healthcare, finance, critical infrastructure and retail.", "speaker": "Sequoia Arc", "type": "data_point", "entities": ["Corma", "Fortune 500", "security operations", "identity management", "cloud security"], "conviction": "medium", "so_what": "The pricing unit is a security headcount replacement rather than seats or data volume, which threatens the per-GB ingestion model that SIEM and MDR vendors monetize.", "quote": "They are on the job at Fortune 500 companies and large enterprises across healthcare, finance, critical infrastructure, retail and more.", "locator": "deployed and productized as an agentic Security Workforce", "quote_verified": true}, {"claim": "In one customer deployment, the agent uncovered, contained and remediated an active attacker campaign within its first hour on the job that the customer's own security team had missed for 52 days.", "speaker": "Sequoia Arc", "type": "anecdote", "entities": ["Corma", "dwell time", "incident response", "CISOs"], "conviction": "medium", "so_what": "Attacker dwell time is the metric this category will be sold on; if agents compress 52 days to one hour at scale, cyber insurance loss assumptions and MDR retainer pricing both need repricing.", "quote": "within its first hour on the job, Corma uncovered, contained and remediated an active attacker campaign inside a customer’s network that their security team had missed for 52 days", "locator": "In another instance, within its first hour", "quote_verified": true}]}], "insight_total": 10, "top_entities": ["Corma", "Alon Pluda", "Anthropic", "Mythos", "reinforcement learning", "foundation models", "cybersecurity", "CVEs", "Fortune 500", "frontier labs", "telemetry", "zero-day vulnerabilities"], "source_meta": {"author": "", "word_count": 874, "paywalled": false}}, {"record_id": "b5e27b7e7e424969", "source_type": "concepts", "source_name": "SF Fed Economic Letters", "source_url": "https://www.frbsf.org/research-and-insights/publications/economic-letter/2026/08/financial-markets-oil-prices-and-supply-side-risks/", "title": "Financial Markets, Oil Prices, and Supply-Side Risks - San Francisco Fed", "published_date": "2026-08-10", "language": "en", "processed_at": "2026-08-11T12:20:06Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Energy", "Geopol // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
