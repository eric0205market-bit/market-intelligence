<script>
const ITEMS = [{"id": 1, "cat": "crypto", "urgency": "now", "source": "The News Block / Natalie Brunell", "title": "Binance drained for $6.3B in ~20 minutes — through its own withdrawal system, not stolen keys", "idea": "FBI attributes the record hack to North Korea's TraderTraitor (same group as the $1.5B Bybit hack). Binance says it may have started with a DevOps engineer's compromised laptop; no private keys appear to have leaked — attackers got inside the system that sends withdrawals and used Binance's own infrastructure to approve the theft. ~$3B frozen, mostly by Tether and Circle; 95% of losses already replaced from Binance's own money; net customer outflow $4.7B (~3% of assets).", "angle": "The attack surface was workflow, not cryptography. That is the same lesson as Bybit, and custody/ops risk is now a repeatable, state-sponsored cost of holding assets on exchanges.", "tweetA": "Binance lost $6.3B without a single private key leaking. The attacker just walked into the approval workflow. Cold storage was never the weak link; the DevOps laptop was. Everyone auditing keys is auditing the wrong thing. $COIN", "tweetB": "Tether and Circle froze ~$3B of a North Korean heist within days. The 'permissionless' stablecoins turned out to be the best compliance tool crypto has. Hold that thought next time someone sells you censorship resistance on USDT.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thenewsblock.substack.com/p/news-block-the-biggest-hack-ever"}, {"id": 2, "cat": "crypto", "urgency": "now", "source": "The News Block / Natalie Brunell", "title": "Bitcoin only dipped below $77K through the biggest hack ever — and Strategy keeps buying", "idea": "BTC slipped only a little under $77,000 despite the record theft. Strategy added 811 BTC (~$65.5M) in a Monday filing, bringing holdings to 849,327 BTC — over 4% of all coins that will ever exist — and holds ~$4.9B cash reserve, said to cover 3+ years of dividends and interest.", "angle": "Price absorbed a $6.3B hack with a ~3% move, while Strategy's buying ($65M) is tiny relative to the flow. The marginal buyer is no longer Strategy.", "tweetA": "Biggest crypto theft ever, BTC -3%. Strategy bought $65M of coins against $643M of ETF outflows in one day. Whoever is absorbing the difference isn't Saylor, and I want to know who.", "tweetB": "849,327 BTC is >4% of the max supply held by one company with a $4.9B cash buffer. A dividend-funded treasury only works if the equity premium holds. Friday: stock -8% on its best quarter ever. Watch the premium, not the coin count. $MSTR", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thenewsblock.substack.com/p/news-block-the-biggest-hack-ever"}, {"id": 3, "cat": "crypto", "urgency": "deep", "source": "The News Block / Natalie Brunell", "title": "Strategy posts ~$21B quarterly operating profit — all of it mark-to-market on Bitcoin", "idea": "Nearly $21B record operating profit, >5x a year earlier, almost all from accounting rules counting unrealized BTC gains as income. Stock still fell ~8% Friday on a day when Nasdaq lost almost 3% and S&P almost 2%. Preferred (STRC) now pays daily dividends.", "angle": "Fair-value accounting turns the earnings print into a levered BTC chart. A $21B 'profit' that the stock ignores shows who is pricing this: BTC beta, not EPS.", "tweetA": "$21B operating profit and the stock fell 8%. That's what an earnings print looks like when it is a Bitcoin chart with a transfer agent. $MSTR trades as a levered BTC option, so stop reading the P&L.", "tweetB": "Quarter of unrealized gains = $21B. Quarter of unrealized losses = the mirror image. Same accounting, same company, symmetric headline. Daily preferred dividends mean the cash obligation is real even when the profit isn't.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thenewsblock.substack.com/p/news-block-the-biggest-hack-ever"}, {"id": 4, "cat": "crypto", "urgency": "deep", "source": "The News Block / Natalie Brunell", "title": "Bitwise: $1.6M BTC by 2036 is the BASE case — bear case ~$130K", "idea": "Base case implies ~34%/yr for a decade vs <7%/yr for US stocks in the Wall Street forecasts Bitwise reviewed. Assumes the store-of-value market grows to ~$110T by 2036 with BTC capturing a quarter. Bull $3.7M, bear ~$130K — barely above the prior all-time high a decade out.", "angle": "The asymmetry framing: the bear case is a flat decade. Brunell/Alden's line that $130K in 2036 'may as well be $0' is the real tell on how holders think about risk.", "tweetA": "Bitwise's bear case for Bitcoin in 2036 is ~$130K. Its base case is $1.6M. When the downside scenario is 'roughly flat for ten years' and the upside is 12x, either the model is wrong or 'bear' doesn't mean what it does for equities.", "tweetB": "$110T store-of-value market x 25% share = $1.6M. Gold is the other 75% in that model. So the Bitcoin base case is a bet that gold is permanently capped. I'd rather underwrite that than the 34% CAGR. $GLD $IBIT", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thenewsblock.substack.com/p/news-block-the-biggest-hack-ever"}, {"id": 5, "cat": "crypto", "urgency": "now", "source": "Unchained", "title": "FBI named North Korea two days after the Binance hack — and published 628 wallet addresses", "idea": "FBI alert dated Oct 31 attributes the theft to TraderTraitor (attack ~Oct 29). Named in 2 days vs 5 days for the $1.5B Bybit hack. Published list: 608 Ethereum, 19 Bitcoin, 1 Solana address; exchanges, DeFi platforms and RPC providers asked to refuse transactions touching them. Chainalysis: >$500M moved through 1,000+ TRON addresses, laundering now shifting to Solana.", "angle": "Attribution latency is collapsing (5 days to 2) while laundering is chain-hopping in real time — the chokepoint is stablecoin issuers and RPC providers, not exchanges.", "tweetA": "FBI went from 5 days to 2 days to name the hackers. Laundering already hopped from Ethereum to TRON to Solana. The cat-and-mouse is now measured in hours, and the only real choke points are Tether, Circle and node operators.", "tweetB": "Asking RPC node operators to refuse transactions is a policy shift hiding in a wallet list. Once infrastructure providers are expected to filter, 'neutral pipes' is dead as a legal position. Someone should price compliance cost into DeFi front-ends. $COIN", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-finds-its-footing-as-binance-opens-back-up"}, {"id": 6, "cat": "crypto", "urgency": "now", "source": "Unchained", "title": "Binance reopens: $4.65B out, $1.01B in; net 2.1% of $171B — CZ: '98% choose to stay'", "idea": "Net outflow ~$3.64B by 15:30 UTC Sunday (2.1% of $171B user assets). All 15 first-phase networks live by 12:36 UTC. 95% of impacted amount covered (up from 90%); remaining 5% is illiquid tokens. Updated proof-of-reserves due Monday. Spot BTC ETFs lost $643.3M Friday (IBIT $233.7M, FBTC $201.0M).", "angle": "A bank-run test passed: 2% left. The more relevant flow is ETF redemptions, which were 6x larger in dollar terms in a single session than Strategy's weekly buy.", "tweetA": "Binance had a real-time bank run test: 2.1% net outflow after a $6.3B hole. Exchanges with insured backstops hold up. The unanswered question is who covers the next one when it's not the biggest exchange on earth.", "tweetB": "One Friday session: $643M out of spot BTC ETFs. Binance's Sunday net outflow was $3.64B but over a bank-run-style reopening. The persistent bleed is in the wrapper products. Watch IBIT and FBTC flows this week. $IBIT $FBTC", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-finds-its-footing-as-binance-opens-back-up"}, {"id": 7, "cat": "crypto", "urgency": "watch", "source": "Unchained", "title": "Chainalysis discloses an 'agentic' attacker inside its systems", "idea": "Chainalysis says it detected 'an external actor using offensive agentic techniques' in October; reached user IDs, names, emails and role labels. No evidence yet of access to investigation graphs, cases, passwords, MFA secrets. Says it's unrelated to Binance and now uses LLMs in a platform-wide security review. Also: BTCPay Server told merchants to shut instances (versions <2.4.2) after hot-wallet sweeps; ~12 DeFi front-ends redirected via Name.com.", "angle": "AI-driven intrusion is moving from hypothetical to disclosed. The firm that traces stolen crypto was itself breached — and Brunell separately warns AI is making attacks cheaper.", "tweetA": "The company everyone calls to trace stolen crypto was itself breached by an attacker using 'offensive agentic techniques.' Defenders now disclose the AI-attack category in a press release. That's the pattern change to watch.", "tweetB": "Three infrastructure incidents in one daily digest: Chainalysis intrusion, BTCPay admin takeover, Name.com DNS hijack. None was a protocol bug. The pattern is the supply chain of crypto, not the chains.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-finds-its-footing-as-binance-opens-back-up"}, {"id": 8, "cat": "regulation", "urgency": "watch", "source": "Unchained", "title": "Nvidia, Costco, Nike among 50 issuers opting out of ICE/OKX tokenized-stock venue", "idea": "50 objectors to tokenized trading of their shares, 12 added since the Oct 28 notice. Co-chair Cuomo says opt-outs didn't surprise him. Separately, Canton Strategic Holdings plans to tokenize its own Nasdaq shares under the SEC's new exemption — issuer-sponsored tokens skip the 30-day objection window.", "angle": "Issuer veto is the real gating item for tokenized equities; the exemption design favors issuer-sponsored tokens.", "tweetA": "Nvidia, Costco and Nike all opted out of tokenized trading of their own stock. The SEC built an exemption where the issuer holds the veto. Tokenization of large caps will be issuer-led or it won't happen.", "tweetB": "Third-party tokenization hit a wall at 50 objectors in a week. The fast lane is issuer-sponsored tokens that skip the 30-day notice. Expect small caps to tokenize first and for the wrong reasons. $COIN $ICE", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-finds-its-footing-as-binance-opens-back-up"}, {"id": 9, "cat": "geopolitics", "urgency": "now", "source": "Unchained", "title": "Netanyahu reportedly pressing Trump to strike Iran right after Tuesday's midterms; Brent at $108.46", "idea": "Axios (via Unchained): Netanyahu pressed Trump to strike Iran immediately after the midterms; Rubio says no decision has been made. Brent was $108.46, ~4% below Friday's close. Also: KuCoin pulled all products from Russia and Belarus users immediately.", "angle": "Oil dropped 4% on diplomacy headlines while the same news cycle carries a post-election strike request. Event-risk is asymmetric into Wednesday.", "tweetA": "Oil is down 4% on Iran 'progress' while Axios says Netanyahu wants strikes the day after the midterms. The market is pricing the diplomatic leg of a story whose next scheduled catalyst is Wednesday. $XLE $USO", "tweetB": "Brent $108 and the S&P is still within 3.1% of its high. The two prices can't both be right if there's a strike. Cheapest hedge on the board is whatever is short oil volatility in your book.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-finds-its-footing-as-binance-opens-back-up"}, {"id": 10, "cat": "crypto", "urgency": "deep", "source": "Ecoinometrics", "title": "Bitcoin's recovery 'is running out of support': October ETF flows negative, inflation rising", "idea": "BTC ended October below $80K, retreating toward the level it traded at right after breaking above the 200-day MA in August. The Binance hack dominated headlines but the piece asks how much of the weakness is actually attributable to it. Free section: ETF flows turned negative and inflation moved higher; selling is 'modest' and price still above the 200DMA. Paid decision hidden.", "angle": "Hack vs macro attribution matters: if flows and inflation drove the leg, the 'buy the hack dip' trade has no catalyst.", "tweetA": "Everyone blames Binance for BTC under $80K. October ETF outflows and re-accelerating inflation were already doing the work. If it's macro, the hack wasn't the dip you can buy. $BTC $IBIT", "tweetB": "BTC sits right on the 200DMA it reclaimed in August, with flows negative and CPI-sensitive rates rising. That's the line. Below it there's not much structural bid I can find.", "charts": {"count": 1, "hot": false, "desc": "Likely ETF-flow and 200DMA charts inside — worth opening"}, "link": "https://ecoinometrics.substack.com/p/bitcoins-recovery-is-running-out"}, {"id": 11, "cat": "crypto", "urgency": "deep", "source": "KookLetter", "title": "ICE (NYSE owner) takes a stake in Trade[XYZ] to bring Hyperliquid perps onshore; $HYPE +15% to ~$88", "idea": "ICE announced a stake in Trade[XYZ], bringing Hyperliquid-linked perps to the US. $HYPE rose ~15% to ~$88 while BTC slipped ~3% to ~$78K. Kinetiq's HYPE-powered L2 'Elysium' goes live Nov 9. Papertrade cooled to ~$27M TVL. Unchained's recommended reading: 'Who profits when Hyperliquid hits the US?'", "angle": "TradFi plumbing paying for an onchain venue's liquidity — the first time the NYSE parent has chosen a DeFi perps venue over building one.", "tweetA": "ICE owns the NYSE. It just took a stake to bring Hyperliquid perps to US customers. In a week where Binance lost $6.3B, the one asset that ripped is the onchain venue with transparent books. $HYPE", "tweetB": "While BTC fell 3%, $HYPE rose 15% on a TradFi partnership. The market is rewarding 'regulated rails to onchain liquidity' over 'trust us' exchanges. That's the cleanest read-through from the Binance mess.", "charts": {"count": 1, "hot": true, "desc": "Weekly 7-day change table (BTC, HYPE, equities) — worth saving"}, "link": "https://vault.kookletter.com/p/the-ai-trade-is-unwinding-and-the-nyse-just-bet-on-hyperliquid"}, {"id": 12, "cat": "crypto", "urgency": "watch", "source": "KookLetter", "title": "HIP-4 outcome markets: ~2K daily traders vs ~80K on Hyperliquid main, >$100M volume, no token yet", "idea": "Outcome markets are 85-95% of HIP-4 volume with a $1M rewards program (~$414K paid). Crowd is thin: ~2K traders/day vs ~80K on the main exchange. Newsletter's play: make-don't-take, quote both sides near 50¢, short-dated markets, small size, for a possible future season or Outcome token.", "angle": "Prediction-market volume on a perps venue with no token is the classic pre-airdrop pattern — and it's Polymarket's competition inside a trading app.", "tweetA": "HIP-4 has done >$100M volume with ~2K daily traders. That's $50K+ per trader per day of notional on a venue with no token yet. Someone is farming, someone is warehousing the risk, and prediction markets just became a feature of the perps app.", "tweetB": "Polymarket is reviewing dozens of fresh wallets that bet on Israel's election; Hyperliquid has outcome markets with 2K users. The two ends of the same market structure: regulatory scrutiny at one, near-zero attention at the other.", "charts": {"count": 1, "hot": false, "desc": "HIP-4 volume/traders chart inside"}, "link": "https://vault.kookletter.com/p/the-ai-trade-is-unwinding-and-the-nyse-just-bet-on-hyperliquid"}, {"id": 13, "cat": "macro", "urgency": "now", "source": "KookLetter", "title": "The AI trade is unwinding: Nasdaq 100 -9.1% from Oct 6 high, semis -27% from June, S&P only -3.1%", "idea": "Nasdaq 100 -6.7% in October (worst month since Mar 2025). Semis -15.4% in October, 27% below June high. From highs: Oracle -50%, Broadcom -32%, Google -30.5%, Meta -21%, Nvidia -14.5%. S&P 500 only -3.1% off highs. The author calls it money leaving AI, not a crash. Fed held at 3.75-4.00% with two dissents for a hike; 10Y 4.93%; oil $104.", "angle": "Rotation, not liquidation: the index drawdown is a fraction of the single-name pain because equal-weight and defensives absorbed the flows.", "tweetA": "S&P 500 is 3% off its high. Oracle is 50% off. Broadcom 32%. Semis 27%. The drawdown is hiding because the other stocks are carrying the cap-weighted index.", "tweetB": "Fed held with two dissents FOR A HIKE, 10Y at 4.93%, oil at $104 — and the market sold the asset class that needs cheap capital most. That's not a mystery. It's duration.", "charts": {"count": 3, "hot": true, "desc": "AI stocks off highs bar chart; capex vs FCF chart — worth saving"}, "link": "https://vault.kookletter.com/p/the-ai-trade-is-unwinding-and-the-nyse-just-bet-on-hyperliquid"}, {"id": 14, "cat": "macro", "urgency": "now", "source": "KookLetter", "title": "Google, Meta and Amazon all went free-cash-flow negative this quarter", "idea": "Capex is eating cash flow at the three hyperscalers. Author pairs this with a Fed leaning toward hikes and oil above $100 as the reason 'the market stopped paying for AI promises.' GOOGL dropped 12.6% on the week; author sold Dec $260 puts at $3.45 (effective entry $256.55).", "angle": "FCF negative at three of the biggest cash machines on earth is the signal; the financing question now moves from equity to debt.", "tweetA": "Three of the most profitable companies ever built just went free-cash-flow negative in the same quarter. That's what $700B+ of annual AI capex does to even Google's cash flow. Dividends and buybacks are now funded by debt or lower capex. Pick one.", "tweetB": "Selling a put 'to get paid to wait' on a stock that fell 12.6% in a week on negative FCF is a bet that capex is a moat. It might be. But that's not a margin of safety; it's a conviction trade. $GOOGL $META $AMZN", "charts": {"count": 1, "hot": true, "desc": "Capex vs FCF chart — worth saving"}, "link": "https://vault.kookletter.com/p/the-ai-trade-is-unwinding-and-the-nyse-just-bet-on-hyperliquid"}, {"id": 15, "cat": "positioning", "urgency": "watch", "source": "KookLetter", "title": "BTC/QQQ ratio holds above 108 — the line it reclaimed in August", "idea": "BTC fell ~7% in October, 'right with the Nasdaq.' Ratio chart: BTC/QQQ above 108 as the key level; author sees the monthly chart as the most bullish setup and plans to rotate some into big tech near ratio highs later in the cycle. Free META long setup: entry 614.99, TP 779.82/961.63, stop 500.23.", "angle": "A ratio trade expresses BTC relative to risk assets, stripping out the Nasdaq drawdown. Useful when the macro driver is rates.", "tweetA": "BTC is holding the BTC/QQQ ratio while Nasdaq-100 is down 9%. The 'it trades like a tech stock' argument is true on direction and false on relative strength. The ratio is the only chart I'd frame the BTC thesis with right now.", "tweetB": "Bitcoin fell ~7% in October with the Nasdaq. Equal-weight S&P rose ~5%. If BTC is a high-beta tech proxy, a hawkish Fed hurts it twice. The ratio is the signal.", "charts": {"count": 1, "hot": false, "desc": "BTC/QQQ chart inside"}, "link": "https://vault.kookletter.com/p/the-ai-trade-is-unwinding-and-the-nyse-just-bet-on-hyperliquid"}, {"id": 16, "cat": "macro", "urgency": "deep", "source": "Bespoke Investment Group", "title": "October: equal-weight S&P beat cap-weight by ~6 points — best month since April 2009", "idea": "QQQ -6.66%, SPY -0.9%, RSP (equal-weight) +5%, DIA +1.7%. Nine of eleven sectors up; four up >9% (Staples, Energy, Health Care, Utilities). The two that fell — Tech and Comm Services, nearly 50% of the S&P — fell >8%. Bespoke's morning note adds: second-best EW-vs-CW month since 1990 behind April 2009, and such wide spreads are becoming frequent.", "angle": "Concentration risk realized. When two sectors are half the index, a rotation of this size is mechanically invisible in the headline.", "tweetA": "Equal-weight beat cap-weight by ~6 points in one month. The only bigger gap since 1990 was April 2009, and that came out of a crash. This time the index barely dipped. I can't pattern-match that.", "tweetB": "Tech + Comm Services = ~50% of the S&P and fell more than 8%. The cap-weighted index lost 0.9%. The other half of the market made 9%+ in four sectors. If you were 'diversified' via SPY, you were levered to two sectors. $SPY $RSP", "charts": {"count": 1, "hot": true, "desc": "ETF performance matrix (Oct and YTD) — worth saving"}, "link": "https://bespokeinvest.substack.com/p/october-asset-class-performance-matrix"}, {"id": 17, "cat": "macro", "urgency": "deep", "source": "Bespoke Investment Group", "title": "TLT +5% in October — only the 3rd time since 2002 after a >5% prior-month loss", "idea": "Long Treasuries caught a bid: TLT up more than 5% after falling more than 5% the prior month — the 3rd time since inception in 2002. Meanwhile, the 10-year yield is down a basis point Monday as Treasuries continue last month's gains.", "angle": "Contradiction with the equity hike pricing: bonds rallied (growth scare, flight to safety) while the Fed leans hawkish.", "tweetA": "TLT rallied 5%+ after a 5%+ fall. That has happened 3 times in 24 years. Bond market is pricing growth fear; Fed (two dissents for hikes) is pricing inflation. One of them will be wrong by December. $TLT", "tweetB": "10-year at 4.93% after a 5% TLT rally means the pre-rally level was higher still. The yield is the thing I'd watch into the Fed's next meeting, not the stock tape.", "charts": {"count": 1, "hot": false, "desc": "TLT monthly return chart inside"}, "link": "https://bespokeinvest.substack.com/p/october-asset-class-performance-matrix"}, {"id": 18, "cat": "energy", "urgency": "deep", "source": "Bespoke Investment Group", "title": "October commodity split: oil +15.9% (USO) while gold, silver, nat gas and ag all fell >4%", "idea": "USO +15.9% in October; DBA (ag), UNG, GLD and SLV each fell more than 4%. Emerging markets (EEM) fell 8.6% vs EAFE -0.5%. Morning note: WTI back below $100 on reports of progress in US-Iran talks.", "angle": "Oil up 16% while gold falls: the geopolitical premium is being paid in energy only, and gold is trading real yields/dollar instead.", "tweetA": "Oil +16% in October. Gold -4%+. A war-driven oil rally with gold down means the market sees supply shock, not currency debasement. Different hedge. $GLD $USO", "tweetB": "EEM -8.6%, EAFE -0.5%, oil +15.9%. Importers hurt, EAFE spared. Whoever buys EM into an oil spike is making an energy-import bet by accident.", "charts": {"count": 1, "hot": false, "desc": "Oct and YTD matrix"}, "link": "https://bespokeinvest.substack.com/p/october-asset-class-performance-matrix"}, {"id": 19, "cat": "macro", "urgency": "now", "source": "Bespoke Investment Group", "title": "Monday morning: WTI back below $100 on Iran-talks reports — 'Groundhog Day'", "idea": "Futures indicated slightly higher (S&P +0.35%, Nasdaq +0.60%) after a third weekly loss. Asia mixed: Nikkei -0.3%; Korea +2.2%, India +1.7%, onshore China +1.1% despite weak or decelerating PMIs. Europe outperformed the US and Asia last week; Eurozone PMIs beat. Apple and Palantir earnings after the close; Election Day tomorrow.", "angle": "The 'progress in talks' bid in oil has been a repeating pattern; the author flags it as Groundhog Day.", "tweetA": "'Progress in US-Iran talks' has now moved oil three times in the same direction without a signed document. It's a vol-selling pattern until it isn't. WTI sub-$100 is a headline price.", "tweetB": "Asia up >1% on weaker PMIs, Europe PMIs beat and the market barely moved. The thing moving everything is the oil headline. Positioning is the signal, not data.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://bespokeinvest.substack.com/p/turning-the-page-morning-market-note"}, {"id": 20, "cat": "positioning", "urgency": "deep", "source": "Hi Mount Research", "title": "Breadth: 45 straight days of new lows outnumbering new highs — longest since late 2022", "idea": "Index trend components positive, breadth components weak for ~2 months. In October >10% of ACWI indexes made new 12-month lows. Share of S&P stocks with 50DMA above 200DMA is receding, reversing 2026's gains. Sector trends muddled; short-term green sectors are small ones. Systematic portfolios still hold stocks but relative trends favor commodities.", "angle": "Index at highs on bad breadth is the classic late-stage pattern; 'surprises skew to the downside' is the author's tell.", "tweetA": "45 consecutive days of new lows > new highs. Longest streak since late 2022. The index is still sitting 3% off highs. Both statements are true and only one of them leads.", "tweetB": "Systematic allocators still hold stocks but relative trends favor commodities. That is how a regime change starts: quietly, in the rank-ordering, before the index confirms. $SPY $DBC", "charts": {"count": 1, "hot": false, "desc": "Breadth charts inside"}, "link": "https://himountresearch.substack.com/p/index-up-trends-holding-on-for-dear"}, {"id": 21, "cat": "macro", "urgency": "deep", "source": "James Bulltard", "title": "SPY reclaiming the 100-day on the eve of midterms; QQQ 3 closes below it, 9 of the last 12 sessions", "idea": "SPY needs a close over 759.58 to start building over the 100DMA. QQQ's 8 and 21-day MAs slope down. Author's view: caution, not reckless leverage on high-beta. Open book +7% on the day with WYNN and MGM up >10% in a week while Nasdaq sold; had closed an INTC 60/80 call spread for 95% gain and deployed into casinos trading below asset value (MGM <$30 after a failed $48.50 buyout).", "angle": "Concrete rotation example: buying 'ugly value with catalyst' as consensus long-AI unwound.", "tweetA": "While QQQ spent 9 of 12 sessions below its 100-day, WYNN and MGM rallied >10% in a week. Bought in size when 'everyone was long AI.' The best hedge for a crowded tech trade was a boring asset play. $WYNN $MGM", "tweetB": "MGM at <$30 after a failed $48.50 buyout and WYNN below asset value. That's a takeout-floor trade. Casinos are the one sector with a visible private-market bid that doesn't depend on rates.", "charts": {"count": 1, "hot": false, "desc": "SPY and QQQ vs 100DMA charts"}, "link": "https://www.jamesbulltard.com/p/11226-recap-50a"}, {"id": 22, "cat": "regulation", "urgency": "now", "source": "James Bulltard", "title": "Democratic platform on data centers: 'the entire market at the moment' faces a block on new construction", "idea": "Key midterm risk the author flags: if Democrats win, what happens to the data-center trade — 'which is the entire market at the moment' — given their platform includes blocking construction of new ones. Also: Trump bombing Iran again could spike oil. 'Nobody has any clue what happens this week.'", "angle": "Policy risk to the AI capex cycle is explicit; compare with Goldman's view that restrictions are likelier at state level.", "tweetA": "The market is now explicitly worried that a midterm outcome could block new data centers. Every AI capex model assumes the next 100 GW. Almost none of them put a probability on 'permitting gets harder.' $NVDA $VST", "tweetB": "A year ago, data centers were a bipartisan growth story. Now 57% of data-center political ads are negative. The trade changed on political economy, not on tokens. Position size accordingly.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.jamesbulltard.com/p/11226-recap-50a"}, {"id": 23, "cat": "regulation", "urgency": "now", "source": "Dark Side of the Boom (Goldman Sachs election tracker)", "title": "Goldman: a Democratic House is increasingly likely, but the Senate is less certain than prediction markets suggest", "idea": "Takeaways: winning an election is not the same as acquiring power to change economic policy — presidential veto, Senate rules and fiscal deadlines constrain what can pass. Biggest fiscal surprises likely in 2027 funding/debt-ceiling fights. Wall Street may overestimate near-term threat to AI infrastructure (restrictions likelier at state level) while underestimating tariff persistence — Goldman expects US effective tariff rates to rise after the election.", "angle": "Tariffs up, data-center curbs at state level: the market's likely mispricing is that policy moves in the opposite direction of the consensus.", "tweetA": "Goldman's election note: tariffs go UP after the midterms, data-center curbs are a state-level story, and the Senate is less certain than Polymarket. The consensus trade (Dem win = tariff relief + AI risk) may be backwards.", "tweetB": "A divided Congress doesn't change policy; a debt-ceiling standoff in 2027 does. Treasury funding risk is a 2027 event that nobody is hedging in November 2026. $TLT", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/the-midterm-reckoning-goldman-maps"}, {"id": 24, "cat": "regulation", "urgency": "deep", "source": "Exponential View", "title": "Only 3% of political ads mentioning data centers in October supported them; 57% opposed", "idea": "Of political ads mentioning data centers in October, 3% were supportive, 57% opposed, the rest neutral. Related data in the same issue: Census survey on AI use says 24.6% of firms use 'Super Intelligence' (up from 17.3% in Nov 2025) — though the survey's examples include voice recognition.", "angle": "Local political economy is turning against the buildout at the exact moment hyperscaler FCF goes negative.", "tweetA": "3% of political ads on data centers are positive. 57% are negative. Hyperscalers need to build gigawatts. Voters are being told it raises their power bill. That's the actual constraint, and it's not chips.", "tweetB": "The AI capex cycle needs three permits: power, water, and a vote. The vote is losing 57 to 3. $VST $CEG", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.exponentialview.co/p/political-ads-turn-against-data-centers"}, {"id": 25, "cat": "tech", "urgency": "deep", "source": "Exponential View", "title": "Census: 24.6% of US firms use AI in early October, up from 17.3% in late November 2025", "idea": "The Census Bureau business survey now asks firms if they use 'Super Intelligence', with examples including voice recognition — a definition broad enough to inflate adoption. Even so, 7.3 points in ~11 months.", "angle": "Official adoption number at a quarter of firms; the definitional looseness is itself a signal about how AI is being measured.", "tweetA": "Census AI adoption: 24.6% of firms, up 7 points in 11 months. The definition includes voice recognition. That's both the bull case (everyone uses it) and the bear case (nobody agrees what 'it' is).", "tweetB": "17.3% to 24.6% in 11 months is ~2.3 points per quarter. At that slope, half of US firms are 'AI users' in 2028 — on a definition that includes call-center voice menus.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.exponentialview.co/p/political-ads-turn-against-data-centers"}, {"id": 26, "cat": "geopolitics", "urgency": "deep", "source": "Exponential View", "title": "US holds 72% of the world's AI compute; China 10%", "idea": "Compute share concentration: US 72%, China 10%. Same issue notes semiconductor parts were almost half of South Korea's October exports.", "angle": "Compute is more concentrated than oil ever was; Korea's export mix shows how much of the upstream is a single-country, single-product bet.", "tweetA": "72% of global AI compute is in the US. 10% is in China. Meanwhile half of South Korea's exports are chips. The AI trade is one-and-a-half countries wide.", "tweetB": "No other strategic commodity has ever had a 72/10 split with the rival. That's why export controls matter more than tariffs, and why Korea's memory names trade like a sovereign macro bet.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.exponentialview.co/p/political-ads-turn-against-data-centers"}, {"id": 27, "cat": "energy", "urgency": "deep", "source": "Exponential View", "title": "World Bank: global oil supply to fall 5.2% this year — biggest drop in 40+ years outside 2020", "idea": "A 5.2% decline in global oil supply for 2026, the largest in more than four decades excluding the 2020 recession. Context: Brent ~$108, oil +15.9% in October (USO).", "angle": "Supply loss of that size is the Iran/Hormuz story in a single number; demand destruction is the only equilibrating mechanism.", "tweetA": "World Bank: global oil supply -5.2% this year. Only 2020 was worse in 40 years. And the S&P is within 3% of its high. Either demand destruction is coming or crude has a lot more to run. $XLE", "tweetB": "A 5.2% supply drop with Brent at $108 means price is not yet pricing the shortfall, only the risk premium. That's how you get $150 in a hurry. Hedge the left tail of oil, not the right.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.exponentialview.co/p/political-ads-turn-against-data-centers"}, {"id": 28, "cat": "labor", "urgency": "watch", "source": "Exponential View", "title": "Only 29% of US workers are engaged — lowest since 2011; French 35-hour week study: output -1%, TFP +2%", "idea": "Gallup-style engagement is 29%, the lowest since 2011. A study of 58,000+ French firms, 1994-2001: cutting the workweek from 39 to 35 hours reduced output only ~1% while TFP rose 2%.", "angle": "If disengagement and AI both rise, labor productivity data will mislead; shorter weeks as an AI dividend is a live policy idea.", "tweetA": "29% of US workers are engaged, lowest since 2011. The French 35-hour week cost 1% of output and added 2% of TFP. Companies buying AI to cut headcount may be solving the wrong productivity problem.", "tweetB": "If AI delivers a productivity dividend, the labor-market form it takes (layoffs vs shorter weeks) is a political choice. The French data suggest the shorter-week option is cheaper than people think.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.exponentialview.co/p/political-ads-turn-against-data-centers"}, {"id": 29, "cat": "science", "urgency": "watch", "source": "Exponential View", "title": "17% of September biology preprints acknowledged using an LLM — vs 19% citing specialized tools like AlphaFold", "idea": "At least 17% of bio preprints in September acknowledged LLM use, close to the 19% that cited specialized tools such as AlphaFold. General-purpose LLMs are already used about as much as the dedicated bio-AI stack.", "angle": "General models are crowding specialized scientific software; relevant for biotech tooling valuations.", "tweetA": "17% of biology preprints now acknowledge an LLM. 19% cite AlphaFold-class tools. The generalist model is nearly as embedded in the workflow as the purpose-built one. Specialist bio-AI tool vendors have a pricing problem.", "tweetB": "Preprints that acknowledge LLM use are the lower bound. The real share is higher. Peer review and reproducibility rules haven't caught up.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.exponentialview.co/p/political-ads-turn-against-data-centers"}, {"id": 30, "cat": "credit", "urgency": "deep", "source": "The Credit Strategist", "title": "Private equity faces a $300B maturity wall in 2028-29 — a third of it software loans, a quarter CCC+ or lower", "idea": "$140B due 2028, $160B due 2029. Software loans are about one-third (WSJ), exposed to AI disruption, weak covenants, no hard collateral, and prices paid with pandemic-era debt. ~25% of the 2028/29 maturities are rated CCC+ or lower. BofA forecasts defaults doubling to 4% next year. Over $3T of private companies are waiting for buyers. CCC yields 18% (US) and 21% (Europe) vs 15% and 16% at the start of the year.", "angle": "Software is both the AI-victim sector and the biggest private-credit collateral pool; the two risks stack.", "tweetA": "$300B of PE debt matures in 2028-29. A third is software loans, the sector AI is eating. A quarter is CCC+ or lower. Those borrowers can't refi at 18% CCC yields without a restructuring. Default rate of 4% sounds low; the denominator is what's scary.", "tweetB": "CCC yields went from 15% to 18% in US and 16% to 21% in Europe this year. Every 100bp is a covenant. The pressure point isn't public high yield, it's private credit marks that haven't moved yet.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.thecreditstrategist.com/p/zombie-apocalypse"}, {"id": 31, "cat": "credit", "urgency": "now", "source": "The Credit Strategist", "title": "$22B Arini Capital down 26% YTD, sold >$800M of debt to meet margin calls", "idea": "Arini, run by a 36-year-old, held concentrated distressed positions (Optimum Communications, Virgin Media, Brightspeed, Multi-Color, Aston Martin, Cornerstone Building Brands). Main fund -26% YTD; it reportedly sold >$800M of holdings to meet margin calls. Author claims multiple multistrategy pods hit loss limits. Also: LMEs like Optimum's strip collateral and push bonds down.", "angle": "Levered illiquid distressed credit is the weak link; first casualty named. Spillover into LME risk for other CCC borrowers.", "tweetA": "A $22B credit fund down 26% selling $800M of bonds to meet margin calls. Distressed credit with leverage is a liquidity mismatch, and Arini is the first name. When one hits the margin wall, the rest of the CCC book is the collateral. $HYG $JNK", "tweetB": "LMEs in which borrowers move assets away from creditors are repricing every CCC bond's covenant package at once. Optimum's bonds fell; lenders will assume everyone does it. That's a repricing of recovery, not default.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.thecreditstrategist.com/p/zombie-apocalypse"}, {"id": 32, "cat": "macro", "urgency": "deep", "source": "The Credit Strategist (citing Rosenberg)", "title": "Real GDP growth 2.2% vs 4.8% in 1999 — and non-tech capex -0.7% vs +6.7% then", "idea": "Rosenberg at Grant's conference: growth is far slower than during the Internet bubble despite similar tech spending; virtually all of the 2.2% real GDP growth derives from record tech spending. Non-tech capex is falling at -0.7% annualized vs +6.7% in 1999. Long-end real yield ~3% vs S&P dividend real yield 2.5% implies an equity risk premium of about -0.5%. Q3 GDP +3.8% was nearly half inventory restocking.", "angle": "A full-market version of the AI-concentration argument: the economy is a tech capex trade, financed by debt, in a higher real-yield regime.", "tweetA": "Non-tech capex is -0.7% annualized. In 1999 it was +6.7%. The AI boom isn't the economy broadening, it's the economy narrowing. 2.2% real GDP growth is almost all one spending category. $SPY", "tweetB": "3% long real yield vs 2.5% real dividend yield on the S&P gives you a -0.5% equity risk premium. Pay a premium to own equities when Treasuries pay more. Either rates fall, or earnings hold, or the multiple does. Pick two.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.thecreditstrategist.com/p/zombie-apocalypse"}, {"id": 33, "cat": "macro", "urgency": "deep", "source": "The Credit Strategist", "title": "Thesis: the Fed resumes hikes in December; debt, not wars, is the structural inflation driver", "idea": "Author expects the Fed to resume rate hikes in December, says real rates remain negative, financial conditions loose, and that the recent Treasury yield drop reflects safety-seeking before midterms. Apollo's Slok says inflation stopped falling and is rising. Argues that even if the Iran/Ukraine wars ended, rising public and private debt keeps inflation structurally elevated. Expects Democrats to win both houses.", "angle": "A cleanly contrarian rate call: higher for longer is structural, and the bond rally is a flight to safety rather than a pivot signal.", "tweetA": "The case that rates go HIGHER: debt grows regardless of the Iran/Ukraine wars. End the wars tomorrow and CPI wiggles, then gravity reasserts. The bond rally is flight-to-quality. Not a pivot. $TLT", "tweetB": "Two Fed dissents for a hike. Warsh at the helm calling capex 'broadening'. A December hike isn't a tail risk anymore. It's the distribution's mean. Position the curve before the post-election vol.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.thecreditstrategist.com/p/zombie-apocalypse"}, {"id": 34, "cat": "macro", "urgency": "deep", "source": "Ironsides Macroeconomics (Barry Knapp)", "title": "Warsh says growth and capex are broadening — Ironsides disagrees: 'Broadening, or Breaking?'", "idea": "Summary: strong headline growth but little evidence that consumption, capital spending or earnings are broadening enough to sustain a secular boom. The AI investment cycle is moving from peak capex growth toward monetization, with tighter financing and uneven productivity gains. Fed's hawkish pivot raised the cost of capital; earnings momentum is slowing; 'we do not yet see sufficient price adjustment or policy relief to call a buying opportunity.' Modestly cautious. The full note is outside the paywall.", "angle": "Direct rebuttal of the Chair's read; frames the AI cycle as moving from capex growth to monetization risk.", "tweetA": "The Fed Chair says GDP and capex are 'broadening.' The data says 2.2% growth, almost all tech, non-tech capex shrinking, and Q3 headline inflated by inventories. If the Fed is pivoting on a broadening that isn't there, it is an own goal. $SPY", "tweetB": "Peak capex growth to monetization is the phase that breaks the weakest balance sheets. Hyperscalers are FCF negative; the CCC software borrowers are the other side of the same trade.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://ironsidesmacro.substack.com/p/monday-morning-briefer-brief-fd0"}, {"id": 35, "cat": "AI/infra", "urgency": "deep", "source": "PEquity Research (expert call)", "title": "1.6T optics: ~100M units in 2027, but 3nm DSPs and CW/EML lasers stay short", "idea": "Former top-semiconductor engineer: 1.6T demand ~100M units in 2027. Advanced-node (3nm) DSPs, continuous-wave lasers and EML lasers remain in short supply, so even though 1.6T surpasses 800G around 2028, deliverable supply may fall short of demand. Bottlenecks concentrated upstream: advanced-node DSP capacity, indium phosphide wafers, SOI wafers, 1.6T lasers. Standard module assembly isn't a constraint. InnoLight leads capacity; Eoptolink leads yields.", "angle": "The constraint is in InP and DSP wafers, not the module assemblers — where the value accrues in a shortage.", "tweetA": "100M 1.6T optical units in 2027 and the binding constraints are indium phosphide wafers, 3nm DSPs and CW lasers. Not assembly. Not Chinese module makers. The shortage sits where nobody can quickly build capacity. $COHR $LITE $AAOI", "tweetB": "InnoLight leads capacity, Eoptolink leads yields. Chinese laser suppliers are strong at 70-100mW CW and weak at high-power CW and single-lane 200G EML. That's the supply chain divide.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://pequityresearch.substack.com/p/expert-call-optical-interconnects"}, {"id": 36, "cat": "AI/infra", "urgency": "deep", "source": "PEquity Research (expert call)", "title": "Co-packaged optics: 70-75% switch assembly yield, >30% cost premium — Nvidia's 2027 Spectrum target looks hard", "idea": "CPO adoption faces economic barriers beyond reliability: 70-75% assembly yield for complete switches and a cost disadvantage of >30% vs white-box alternatives. The expert thinks the 2027 Spectrum shipment target is difficult. Near-packaged optics (NPO) is expected to keep growing through at least 2030, with dollar shipments comparable to pluggables. For Rubin Ultra, there is a meaningful chance initial scale-up uses 3.2T NPO, even if a CPO version appears in late 2027.", "angle": "Cloud providers want to decouple optics from chips; that favors NPO and pluggables over full CPO near term.", "tweetA": "A 70-75% switch assembly yield and a 30%+ cost premium. That is why co-packaged optics isn't replacing pluggables on schedule. NPO may be the bridge, with Rubin Ultra initial scale-up on 3.2T NPO. Pluggable optics have longer legs than the narrative. $NVDA $LITE", "tweetB": "Hyperscalers want to buy optics separately from silicon. CPO locks the two together. The market is pricing the technology, not the procurement politics.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://pequityresearch.substack.com/p/expert-call-optical-interconnects"}, {"id": 37, "cat": "AI/infra", "urgency": "watch", "source": "PEquity Research (expert call)", "title": "Power budget reshapes optical design: 22W to 16W per 1.6T module; transmit-only DSP is 65-70% of the die", "idea": "Cutting 1.6T module power from 22W to 16W eases thermals and advanced-node wafer consumption simultaneously. A transmit-only DSP reduces die size to 65-70% of the full-featured version. Standard module assembly and near-term packaging capacity aren't expected to be constrained.", "angle": "Design is migrating toward power-per-bit optimization because the data-center power envelope, not silicon area, is the scarce input.", "tweetA": "Watts are now the design currency in optics. 22W to 16W per 1.6T module, and a transmit-only DSP at 65-70% of the die. Power is the budget everyone's design is being negotiated around. $AVGO $MRVL", "tweetB": "A 27% power reduction per module at tens of millions of modules is a gigawatt-class swing. Optical power engineering is the quiet cousin of the 800V DC story in the data-center power chain.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://pequityresearch.substack.com/p/expert-call-optical-interconnects"}, {"id": 38, "cat": "geopolitics", "urgency": "now", "source": "ChinaTalk — WarTalk (Michael Kofman)", "title": "US throttled Starshield in Ukraine to ~100 mph; mid-strike drones and jet-powered interceptors affected", "idea": "Kofman: Starshield (government-contract service paid by Germany and Poland for Ukraine) was throttled to ~100 mph, initially half that; unstable between 80 and 100. Hits 'mid-strike' drones operating 50-300 km deep (light Hornets/Darts ~10kg payload; heavy FP-2 with hundreds of kg), forcing speed caps of ~160 km/h (unstable as low as 130) — slow enough to be shot down, and below the flight envelope for some heavy drones. Also affects Ukraine's jet-powered interceptors against Russian Geran-4/5, which fly at 6-8km altitude, several hundred km/h. WSJ reporting: Musk may have pitched the throttle; the context is Trump's pressure on Zelensky over refinery strikes.", "angle": "Single-supplier dependency on a private constellation turned into a coercion lever; reason unknown, 'what do we want' unclear to Ukraine.", "tweetA": "The US throttled the satellite link that Ukraine's long-range drones depend on, and nobody — including Ukrainians — can say what Washington wants in return. That is what single-vendor dependency looks like when the vendor is a political actor. $SPCX", "tweetB": "SpaceX's IPO story is global market share. A government-coercion episode in the war's most visible drone theater gives every defense ministry a reason to build a Starlink competitor. Monopoly pricing power has an expiry date. $SPCX $RKLB", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.chinatalk.media/p/wartalk-kofman-on-starlink-what-ukraine"}, {"id": 39, "cat": "geopolitics", "urgency": "deep", "source": "ChinaTalk — WarTalk (Michael Kofman)", "title": "Russia's Geran-4/5 jet drones are cruise missiles at 6-8 km altitude — F-16s are an unsustainable counter", "idea": "Geran-4 and -5 jet-powered strike drones come in at roughly 6-8 km altitude and several hundred km/h. Their altitude and speed price out traditional interceptor drones; Ukraine has mostly relied on F-16s and traditional air defense, which isn't sustainable, so it has been scaling jet-powered interceptors. Episode also covers: why buying drones is meaningless without drone platoons/companies, why 'no one owns the night anymore' and the U.S. military has no culture of decoys, wet-gap crossings, and what Congress should push (force design, airbase hardening).", "angle": "Cost-exchange problem at altitude: expensive jets vs cheap drones; the solution is a new interceptor class.", "tweetA": "Russia's jet drones fly 6-8 km up at several hundred km/h. That prices out cheap interceptors and forces Ukraine to burn F-16 sorties against what are effectively cruise missiles. The cost-exchange problem in air defense is now a manufacturing race between jet-engine interceptors. $AVAV $KTOS", "tweetB": "Kofman's line that 'buying drones means nothing without drone platoons' is the procurement lesson for every Western army. Drones are a doctrine and a labor problem, not a hardware problem.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.chinatalk.media/p/wartalk-kofman-on-starlink-what-ukraine"}, {"id": 40, "cat": "geopolitics", "urgency": "watch", "source": "Import AI (Jack Clark)", "title": "DIA: China went from 22 launches in 2016 to 93 in 2025; Russia exploring nuclear detonation in space", "idea": "DIA 'Challenges to Security in Space' (100+ pages): China more than tripled annual launches (22 in 2016, 93 in 2025) and treats space as an offensive domain; may field space-based directed-energy systems by the late 2020s. Russia: Peresvet laser to dazzle satellites, co-orbital ASAT (Burevestnik), Cosmos 2542/2543 stalking a US satellite, and nuclear detonation experiments in space that could hit satellites in LEO/MEO/GEO. Author links this to space-based data centers becoming strategic.", "angle": "A hard dataset on the militarization of orbit, just as commercial plans for space compute are being floated.", "tweetA": "China launched 93 times in 2025 vs 22 in 2016. The DIA says Russia is experimenting with nuclear detonation in space. The people proposing orbital data centers are not discussing the threat model. $SPCX $RKLB", "tweetB": "Every satellite-based asset class (comms, GPS timing, data centers in orbit) shares the same attack surface: one EMP in MEO. Insurance markets haven't priced it. Neither have SpaceX investors.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://importai.substack.com/p/import-ai-479-spacewar-low-latency"}, {"id": 41, "cat": "AI/infra", "urgency": "deep", "source": "Import AI (Jack Clark)", "title": "Realtime-Bench: best model passes 36% of live tasks vs 70-80% when the clock is paused", "idea": "50 interactive tasks (30 web, 20 games) testing temporal state awareness, adaptive deliberation and time-aware action. Under wall-clock conditions, GPT-6 Astra (high) scored the best at 36%. With a paused clock, high-reasoning models reach ~70% or even 80%. Authors from UT Austin, Ohio State, UIUC, NVIDIA, Northwestern, Steadyworks.", "angle": "Latency is a capability, not just a cost — reasoning that doesn't know it's racing the clock fails in markets, auctions and ticketing.", "tweetA": "Best frontier model: 36% on live tasks. Pause the clock and it gets 70-80%. The gap between 'can solve' and 'can solve in time' is the quiet barrier to AI agents in auctions, trading and anything with a deadline.", "tweetB": "36% when the market doesn't wait. Low-latency inference is an architecture problem that favors specialized silicon, not bigger models. Quietly bullish for inference chips. $GOOGL $NVDA", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://importai.substack.com/p/import-ai-479-spacewar-low-latency"}, {"id": 42, "cat": "tech", "urgency": "watch", "source": "Import AI (Jack Clark)", "title": "Google DeepMind Genie 4: real-time world model with native audio and Gemini 3.8 Flash as in-loop agent", "idea": "Genie 4: natural-language real-time modification, better physics and human simulation, first real-time world model with native audio, and Gemini 3.8 Flash embedded as a guiding agent for multi-step events. Research preview for trusted testers; Ultra subscribers later. Still janky (robotic voices, dreamlike inconsistency). Also in the issue: Metis's neuro-symbolic 'Age of Reasoning' proposal (explicit epistemic state, claim provenance, auditable reasoning).", "angle": "World models + embedded planner agents = synthetic environments for training and entertainment.", "tweetA": "Genie 4 now generates audio natively and has Gemini 3.8 Flash as a planner inside the simulation. The interesting use isn't games. It's synthetic training environments for robots and agents that don't need real-world data. $GOOGL", "tweetB": "Metis's pitch: don't let model-generated content into 'accepted epistemic state' without warrant. A provenance layer for reasoning. If it works, that's the product regulated industries have been waiting for.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://importai.substack.com/p/import-ai-479-spacewar-low-latency"}, {"id": 43, "cat": "venture", "urgency": "deep", "source": "a16z (Alex Rampell / Sarah Wang series)", "title": "How AI applications earn their premium: operate the workflow better, rent context, prove then price", "idea": "Three rules. Case: Repsol's legal team blind-tested Harvey vs Copilot vs internal 'Lexia': 8-week pilot, 50 lawyers, 12 jurisdictions; Harvey won, 96% adoption, 4-6 hours saved per week. August 2026 survey of 100 enterprise LLM decision-makers: 94% expect LLM spending to rise, 37% expect it to at least double. Clay's pricing: separate Data Credits and Actions, pass through token costs for reasoning models with zero markup. One professional-services buyer: if a direct prompt to a frontier model beats the vendor tool, no platform premium.", "angle": "Build-vs-buy is the single most important determinant of application-layer margins as models improve.", "tweetA": "37% of enterprise LLM buyers plan to at least DOUBLE spend in a year. Yet buyers also say: if a direct prompt beats the vendor tool, no premium. Spend grows; the share going to apps is the open question. $MSFT $CRM", "tweetB": "Clay passes token costs through at zero markup for reasoning models. When fixed pricing overcharges simple tasks and bankrupts complex ones, the answer is usage-plus-orchestration. Expect 'seat-based AI' to be the first SaaS model to break.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.a16z.news/p/how-ai-applications-earn-their-premium"}, {"id": 44, "cat": "venture", "urgency": "watch", "source": "a16z", "title": "Context as a product: vendor with benchmarks across ~3,000 companies exploring an MCP server", "idea": "Example of 'make context cheaper to rent than to rebuild': a vertical software company holding years of proprietary pricing benchmarks across roughly 3,000 companies is exploring exposing them via an MCP server so AI systems can query directly. The vendor collects, validates and maintains once and spreads cost across customers. Decagon/Notion case: build vs buy, Notion chose external; up to 34% better ticket resolution time.", "angle": "MCP turns proprietary datasets into pay-per-query APIs for agents — the business model for data owners in the agent era.", "tweetA": "Proprietary data across 3,000 companies behind an MCP server. That's a subscription that sells to agents instead of analysts. The moat isn't the model, it's who has permissioned, normalized, current data. $SPGI $MCO $FDS", "tweetB": "If agents query MCP servers and not websites, pricing shifts from seats to calls. Data vendors with clean schemas win; those whose value was a UI lose. That's a repricing of the financial data complex.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.a16z.news/p/how-ai-applications-earn-their-premium"}, {"id": 45, "cat": "tech", "urgency": "deep", "source": "Young & Calculated", "title": "Half-cent ticks are live in the most liquid US stocks — queue position and spread capture change", "idea": "Under amended Reg NMS, NMS stocks priced above $1 with a time-weighted average quoted spread of 1.5 cents or less can quote at $0.005 increments. Effects: tighter quoted spreads, liquidity fragmenting across more price levels, weaker value of queue position (stepping ahead costs half a cent), lower gross spread capture for market makers, and adverse selection mattering more (a half-cent win vs a 2-cent move against you).", "angle": "Micro-structure change that affects HFT economics, retail execution and measurement of liquidity.", "tweetA": "US equities can now quote in half-cent increments for the most liquid names. That cuts spread for retail and cuts the cushion for market makers. In a market whose depth looks thin on down days, who exactly benefits? $CBOE $VIRT", "tweetB": "Queue position was an asset. At a half cent the cost of stepping ahead halves. Expect a shake-out among passive market makers whose edge was sitting at the front of a 1-cent queue.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://youngandcalculated.substack.com/p/the-half-cent-tick-just-changed-how"}, {"id": 46, "cat": "positioning", "urgency": "deep", "source": "Martin Bradstreet", "title": "Oracle at $13M per MW per year vs neocloud valuations underwritten at $30-50M — someone is wrong", "idea": "Oracle's OpenAI contracts lock compute at ~$13M/MW/yr (Ellison's bet). NBIS and SpaceX bulls underwrite at least $30M/MW/yr (some at $50M; $NBIS targets >$700; Maguire model: SpaceX renting two AWS's of compute by end-2027 at $40M/MW). Author: if OpenAI fails, cheap compute floods the market and sets a price ceiling near Oracle's contracted rate, which makes SpaceX/neocloud valuations look bearish — and Oracle positioned well because it can rent to Anthropic, Google or others. Anthropic reportedly pays $30M/MW to SpaceX for H100s.", "angle": "A concrete $/MW/yr arbitrage between contract prices — a framework for valuing compute stocks.", "tweetA": "Oracle contracts compute at $13M/MW/yr. The NBIS/SpaceX bulls underwrite $30-50M. Both can't be the clearing price. If OpenAI falters, Oracle's cheap capacity floods the market and sets the ceiling. $ORCL $NBIS", "tweetB": "Everyone is buying neoclouds on the premise that compute scarcity persists. The cleanest bear case is that Oracle's contracted price is the market's long-run price. A 2.3x-4x gap is the margin of safety, or the trap.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://martinbradstreet.substack.com/p/october-performance"}, {"id": 47, "cat": "AI/infra", "urgency": "deep", "source": "Martin Bradstreet", "title": "Korean memory: SK Hynix and Samsung expected to return full market cap in operating income within 3 years", "idea": "Author: Korean memory is the best spot in the AI trade because of the rapid payback — companies should return their entire market caps in operating income within 3 years with visibility; thereafter, tangible equity supports price/book. 'CXMT can't just add EUV capacity at zero ROI.' Prefers Samsung Preferred (management aware of the gap with common; high dividend) slightly over Hynix; would hold 2:1 Samsung/Hynix absent taxes. Hynix peak was 1,099 (thousand KRW) in March, trough ~807. Semis ETF -14.21% in October, NVDA ~10% drawdown.", "angle": "A valuation anchor (payback period in market caps) for the one corner of AI that has pricing power now.", "tweetA": "Korean memory makers could earn their entire market cap in operating income in under three years. The market gave Hynix a 27% haircut from the March peak anyway. Payback speed like that is unheard of in semis at record earnings. SK Hynix, Samsung Pref", "tweetB": "Preferred shares with the same rights as common and a discount, plus management openly saying they'd close the gap. That's a free option on a re-rating. Samsung Pref over Hynix at 2:1 if you ignore taxes.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://martinbradstreet.substack.com/p/october-performance"}, {"id": 48, "cat": "positioning", "urgency": "deep", "source": "Martin Bradstreet", "title": "Cybersecurity bubble: CrowdStrike >50x revenue with 26% growth vs Biodesix ~2x revenue with >80% gross margin", "idea": "Author shorting the cyber re-rating: CRWD at 50x+ revenue, 75% gross margin, 26% growth; Biodesix just over 2x revenue, >80% GM, >35% historical growth, consensus >23% next quarter. At 6x revenue he'd buy CRWD. Argues frontier labs and hyperscalers will capture much of the economics as things get more secure, not less. Price implies >100% growth for two years (~12.5x EOY 2028 revenue). 'Selling begets selling': -30 to -50% is not hard.", "angle": "Valuation gap between narrative sectors (cyber) and boring growth (diagnostics) with the same growth profile.", "tweetA": "CrowdStrike at 50x revenue with 26% growth. A diagnostics name at 2x revenue with 80%+ margins and 23%+ growth. One of them has a story. The other has a P&L. $CRWD $BDSX", "tweetB": "The cyber thesis requires >100% growth for two years to justify the price, and the frontier labs are building security into code review. Chainalysis just disclosed an agentic attacker. The threat is real; the multiple is the problem.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://martinbradstreet.substack.com/p/october-performance"}, {"id": 49, "cat": "positioning", "urgency": "deep", "source": "Martin Bradstreet", "title": "Recessionary-defensive housing and aggregates worked: manufactured housing (SKY, CVCO), RKT, VMC/MLM", "idea": "Thesis built in October: if the AI trade blows up, rate cuts come, everyone is broke and low-income housing gets support. Bought Champion Homes (SKY), Cavco (CVCO), Rocket (RKT); RKT and CVCO beat hard — though some Cavco enthusiasm is from building manufactured housing on-site at data centers ('the whole market is one trade'). Aggregates (VMC/MLM) are defensive because local supply lets them pass on diesel and cost increases: aggregates are a small share of build cost, rocks are heavy, only a few suppliers per area.", "angle": "Hyper-local pricing power in a commodity: aggregates as inflation pass-through with slow annual margin creep.", "tweetA": "Aggregates companies told investors 'we will simply pass through any cost increase.' Rocks are heavy and cheap. Transport is the moat. Local monopoly in a commodity business is the most boring pricing power in the market and the one that wins in inflation. $VMC $MLM", "tweetB": "Manufactured housing is being built at data-center sites. The AI buildout reaches even the defensive trades. Diversification is harder than it looks when 'defensive' names get demand from the same capex cycle.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://martinbradstreet.substack.com/p/october-performance"}, {"id": 50, "cat": "tech", "urgency": "deep", "source": "Martin Bradstreet", "title": "Google search grew 'just' 12% — but cloud grew 103% and query volume is at an all-time high", "idea": "Author sold off by Q3 print: Search +12% triggered a big selloff; he thinks it's an overreaction with Cloud +103% acceleration. Management says query growth is at an all-time high (likely includes multi-query Gemini AI Mode), analogizing to Meta's Instagram Stories monetization lag. Notes ChatGPT's ad-search numbers aren't 'crash hot.' Also: Reddit bought at ~$107, nuked to $89 on Friday; held.", "angle": "Cloud acceleration to 100%+ and search deceleration to 12% is a business-mix shift priced as a search problem.", "tweetA": "Google Cloud grew 103%. Search grew 12%. The stock fell on the 12. When the growth engine is the part nobody is paying attention to, the headline metric is a distraction. $GOOGL", "tweetB": "Query volume at all-time highs and 12% search revenue growth means monetization per query is falling as AI mode shifts the mix. That's the real bear case. Wait for the ad load to follow, as it did with Stories. $GOOGL $META", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://martinbradstreet.substack.com/p/october-performance"}, {"id": 51, "cat": "positioning", "urgency": "watch", "source": "Martin Bradstreet", "title": "The sell-the-top puzzle: selling Hynix at the March peak and rebuying at the bottom beats holding — but needs perfect timing", "idea": "NAV $1.722M (down from $1.835M), October -6.16%, YTD +66.76% (L/S +86.05%, L/O +43.18%). Hynix peaked at KRW 1,099 (thousand) and troughed ~807; selling the top and rebuying at 900 would still be nearly perfect timing, but taxes (CA, short-term vs LTCG at 15%) and deferral make holding rational. Went into Iran 'round 1' with 11.6% NAV in Hynix. Added crypto shorts (COIN, IBIT, ETHA) after the Binance hack and rolled gains into 2027.", "angle": "Tax-aware decision frame on volatility: drawdown control vs after-tax compounding.", "tweetA": "Selling the peak and rebuying near the trough beats holding. But with tax drag and deferral, rebuying at 900 only puts you at roughly break-even. After-tax, 'volatility control' is an option you pay for in the tax code.", "tweetB": "Added COIN, IBIT and ETHA shorts right after the Binance hack and rolled gains to 2027. A hack is a news event; the persistent trade was withdrawals slowing into year-end. Different time horizons.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://martinbradstreet.substack.com/p/october-performance"}, {"id": 52, "cat": "positioning", "urgency": "watch", "source": "Haymaker", "title": "AstraZeneca +15% in six weeks from a $161 entry at ~15x forward earnings", "idea": "Haymaker bought AZN on 9/18 at ~$161 (15x forward), now ~$186. Thesis: global oncology platform at a discount to US peers, pipeline generating approvals faster than the market credits, low-double-digit earnings growth. Triple-name update plus a reader poll ('practice run' for Voting Day).", "angle": "European pharma at a discount to US peers working as a defensive rotation.", "tweetA": "AZN +15% in six weeks at ~15x forward earnings. In a month where the S&P lost 1% and the Nasdaq lost 7%, a European pharma at 15x was a decent place to hide. Health Care +9% in October. $AZN $XLV", "tweetB": "Healthcare was one of four sectors up >9% in October. Quality pharma outside the US at 15x. The unloved sector was the best hedge.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://haymaker.substack.com/p/portfolio-update-455"}, {"id": 53, "cat": "energy", "urgency": "watch", "source": "McKinsey (Wärtsilä CEO Håkan Agnevall interview)", "title": "Wärtsilä CEO: industrial leaders scale to meet surging data-center power demand", "idea": "Email content is a teaser: industrial leaders can turn disruption into growth by sharpening focus, scaling to meet surging data-center power demand, and using AI and continuous improvement. 'Also consider' links in the same email: 'The shift to 800-volt DC at data centers: Implications for providers' and 'The $7 trillion data center build-out: How industrials can capture their share.'", "angle": "Engine/power-equipment makers are being re-rated as data-center power suppliers; 800V DC and $7T are McKinsey frames worth opening.", "tweetA": "Wärtsilä builds ship engines. Its CEO is now talking about data-center power. When marine engine makers pitch behind-the-meter generation, grid interconnect queues are the bottleneck, not demand. $WRT1V", "tweetB": "McKinsey's headline number is a $7 trillion data-center buildout. Even a third of that on power and cooling is a bigger industrial capex cycle than anything in the last 20 years.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.mckinsey.com/industries/industrials/our-insights/wartsila-ceo-hakan-agnevall-focus-flexibility-and-the-next-wave-of-growth"}, {"id": 54, "cat": "credit", "urgency": "watch", "source": "McKinsey (Risk & Resilience)", "title": "Banking on AI: distressed credit management shifts from AI assistance to AI orchestration", "idea": "Email is a teaser: banks increasingly deploy AI in distressed credit management, but few have adjusted operating models to deliver distinctive customer experiences and optimize financial outcomes and recovery costs. Related links: agentic AI in financial-crime prevention and in transaction monitoring.", "angle": "Rising defaults would test whether AI-run collections actually improve recoveries.", "tweetA": "Banks are automating distressed-credit workflows just as CCC yields hit 18%. The first real test of AI-run collections arrives with the 2028-29 maturity wall. Recovery rates will tell us if the models help or merely scale the process. $JPM", "tweetB": "Agentic AI in transaction monitoring and financial-crime prevention is the compliance twin of this. Chainalysis got breached by an agentic attacker; the defender-attacker race has the same structure.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.mckinsey.com/capabilities/risk-and-resilience/our-insights/banking-on-ai-how-a-new-operating-model-can-transform-distressed-credit-management"}, {"id": 55, "cat": "culture", "urgency": "watch", "source": "Transformer / New York Magazine", "title": "The AI Power List: 26 people whose influence outstrips their fame; average age 36", "idea": "Transformer and New York magazine list 26 people shaping AI, drawn from 50+ interviews. Themes: private companies with the might of small nation-states self-govern; a few dozen employees on the brink of becoming centimillionaires choosing which causes and candidates to fund; 'a legacy tech CEO can have less sway over what Altman thinks than a 26-year-old with a podcast'; overwhelmingly male; interconnected through shared offices, homes and funding. Names include Logan Graham, Sneha Revanur, Dean Ball, Amy Kremer, Misha Laskin, Nathaniel Moran, Beth Barnes, Karol Hausman.", "angle": "The power map of AI is small and young: a political-donor class in formation days before the midterms.", "tweetA": "26 people on the AI power list, average age 36. A few dozen employees about to become centimillionaires, deciding which candidates to fund. The next big political donor class is being minted in San Francisco. Midterms are tomorrow. 2028 is the real target.", "tweetB": "'A 26-year-old with a podcast has more influence on Altman than a legacy tech CEO.' Narrative power now compounds faster than capital. Essays move markets — ask anyone who traded the last three AI posts.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.transformernews.ai/p/ai-power-list-new-york-magazine"}];

  h+='<div class="bd"><div class="lbl">The Idea</div><div>'+esc(item.idea)+'</div>';
  h+='<div class="lbl">My Angle</div><div class="angle" style="border-color:'+c+';background:'+c+'14">'+esc(item.angle)+'</div>';
  h+='<div class="tw"><div><div class="lbl" style="color:#378add">Tweet A</div><p>'+esc(item.tweetA)+'</p><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  h+='<div><div class="lbl" style="color:#7f77dd">Tweet B</div><p>'+esc(item.tweetB)+'</p><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>';
  h+='<div class="chart'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING — ':'📊 ')+(item.charts.count?item.charts.count+' chart(s): ':'')+esc(item.charts.desc)+'</div>';
  h+='<a class="lk" target="_blank" href="'+esc(item.link)+'">↗ Read full article</a></div></div>';
  return h;
}
function apply(collapse){
  var n=0;
  ITEMS.forEach(function(it){
    var e=document.getElementById('c'+it.id);
    var ok=(fc==='All'||it.cat===fc)&&(fu==='All'||it.urgency===fu)&&(!fs||it.source.indexOf(fs)>=0);
    e.style.display=ok?'':'none';
    if(collapse)e.classList.remove('open');
    if(ok&&fs)e.classList.add('open');
    if(ok)n++;
  });
}
function bars(){
  var cats={};ITEMS.forEach(function(i){cats[i.cat]=(cats[i.cat]||0)+1});
  var h='<span class="pill'+(fc==='All'?' on':'')+'" style="'+(fc==='All'?'background:#333':'')+'" onclick="setC(\'All\')">All '+ITEMS.length+'</span>';
  Object.keys(cats).sort().forEach(function(k){var on=fc===k;h+='<span class="pill'+(on?' on':'')+'" style="'+(on?'background:'+COL[k]:'')+'" onclick="setC(this.getAttribute(\'data-k\'))" data-k="'+esc(k)+'">'+esc(k)+' '+cats[k]+'</span>'});
  document.getElementById('catbar').innerHTML=h;
  var u={now:0,deep:0,watch:0};ITEMS.forEach(function(i){u[i.urgency]++});
  var g='<span class="pill'+(fu==='All'?' on':'')+'" style="'+(fu==='All'?'background:#333':'')+'" onclick="setU(\'All\')">All</span>';
  ['now','deep','watch'].forEach(function(k){var on=fu===k;g+='<span class="pill'+(on?' on':'')+'" style="'+(on?'background:#333':'')+'" onclick="setU(\''+k+'\')">'+UL[k]+' '+u[k]+'</span>'});
  document.getElementById('urgbar').innerHTML=g;
}
function setC(k){fc=k;fs=null;bars();apply(true)}
function setU(k){fu=k;fs=null;bars();apply(true)}
function filterBySrc(name){fs=name;fc='All';fu='All';bars();apply(true)}
function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';
  document.getElementById('cards').innerHTML=ITEMS.map(card).join('');
  bars();
  var r='<p><b>Window:</b> '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</p>';
  r+='<p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items extracted: '+META.itemsExtracted+'</p><p><b>Included sources</b> (click to filter):</p><ul>';
  META.includedSources.forEach(function(s){r+='<li><span class="srcl" data-s="'+esc(s.name)+'" onclick="filterBySrc(this.getAttribute(\'data-s\'))">'+esc(s.name)+'</span> — '+s.items+'</li>'});
  r+='</ul><p><b>Skipped:</b></p><ul>';
  META.skippedSources.forEach(function(s){r+='<li>'+esc(s.source)+' — '+esc(s.reason)+'</li>'});
  r+='</ul><p><span class="srcl" onclick="setC(\'All\')">Reset filters</span></p>';
  document.getElementById('repbd').innerHTML=r;
}
init();
</script></body></html>
