    { name: "DeFi0xJeff (The After Hour)", count: 2 }
  ],
  skippedSources: []
};

const CAT_COLORS = {
  "macro": "#e24b4a", "credit": "#378add", "positioning": "#ef9f27", "AI/infra": "#1d9e75",
  "crypto": "#7f77dd", "geopolitics": "#d85a30", "energy": "#f97316", "tech": "#06b6d4",
  "gold": "#d4a017", "culture": "#ec4899", "labor": "#8b5cf6", "regulation": "#64748b",
  "science": "#14b8a6", "venture": "#84cc16", "commodities": "#b45309"
};
const URG_META = {
  "act": { label: "🔴 Act Now", key: "act" },
  "deep": { label: "🔵 Deep", key: "deep" },
  "watch": { label: "🟡 Watch", key: "watch" }
};
const URG_EMOJI = { act: "🔴", deep: "🔵", watch: "🟡" };

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function buildFilters(){
  const catCounts = {};
  ITEMS.forEach(function(i){ catCounts[i.cat] = (catCounts[i.cat]||0)+1; });
  const catWrap = document.getElementById("catFilters");
  let html = '<button class="pill active" data-cat="all" onclick="setCat(\'all\')">All <span class="count">' + ITEMS.length + '</span></button>';
  Object.keys(catCounts).sort().forEach(function(c){
    html += '<button class="pill" data-cat="' + c + '" onclick="setCat(\'' + c + '\')">' + escapeHtml(c) + ' <span class="count">' + catCounts[c] + '</span></button>';
  });
  catWrap.innerHTML = html;

  const urgCounts = { act:0, deep:0, watch:0 };
  ITEMS.forEach(function(i){ urgCounts[i.urgency] = (urgCounts[i.urgency]||0)+1; });
  const urgWrap = document.getElementById("urgFilters");
  let uhtml = '<button class="pill active" data-urg="all" onclick="setUrg(\'all\')">All <span class="count">' + ITEMS.length + '</span></button>';
  ["act","deep","watch"].forEach(function(k){
    uhtml += '<button class="pill" data-urg="' + k + '" onclick="setUrg(\'' + k + '\')">' + URG_META[k].label + ' <span class="count">' + urgCounts[k] + '</span></button>';
  });
  urgWrap.innerHTML = uhtml;
}

function paintFilterActive(){
  document.querySelectorAll('#catFilters .pill').forEach(function(btn){
    const c = btn.getAttribute('data-cat');
    if(c === activeCat){
      btn.classList.add('active');
      btn.style.background = c === 'all' ? '#333' : CAT_COLORS[c];
      btn.style.borderColor = 'transparent';
      btn.style.color = '#fff';
    } else {
      btn.classList.remove('active');
      btn.style.background = 'transparent';
      btn.style.borderColor = '#ccc7bf';
      btn.style.color = 'var(--text)';
    }
  });
  document.querySelectorAll('#urgFilters .pill').forEach(function(btn){
    const u = btn.getAttribute('data-urg');
    if(u === activeUrg){
      btn.classList.add('active');
      btn.style.background = '#333';
      btn.style.borderColor = 'transparent';
      btn.style.color = '#fff';
    } else {
      btn.classList.remove('active');
      btn.style.background = 'transparent';
      btn.style.borderColor = '#ccc7bf';
      btn.style.color = 'var(--text)';
    }
  });
}

function setCat(c){
  activeCat = c;
  activeSrc = null;
  render();
}
function setUrg(u){
  activeUrg = u;
  activeSrc = null;
  render();
}
function filterBySrc(name){
  activeSrc = name;
  activeCat = "all";
  activeUrg = "all";
  render();
  paintFilterActive();
}

function cardHtml(item, forceOpen){
  const color = CAT_COLORS[item.cat] || "#888";
  let chartIcon = "";
  if(item.charts.hot) chartIcon = '<span class="charticon">🔥</span>';
  else if(item.charts.count > 0 || item.charts.desc) chartIcon = '<span class="charticon">📊</span>';

  let chartBlock = "";
  if(item.charts.desc){
    chartBlock = '<div class="chart-box' + (item.charts.hot ? ' hot' : '') + '">' + escapeHtml(item.charts.desc) + '</div>';
  }

  return '' +
  '<div class="card' + (forceOpen ? ' open' : '') + '" id="card-' + item.id + '">' +
    '<div class="card-header" onclick="toggleCard(' + item.id + ')">' +
      '<span class="idx">' + String(item.id).padStart(2,'0') + '</span>' +
      '<span class="urg">' + URG_EMOJI[item.urgency] + '</span>' +
      '<span class="badge" style="background:' + color + '">' + escapeHtml(item.source) + '</span>' +
      '<span class="cattag">' + escapeHtml(item.cat) + '</span>' +
      chartIcon +
      '<span class="title-text">' + escapeHtml(item.title) + '</span>' +
    '</div>' +
    '<div class="card-body">' +
      '<div class="block-label">The Idea</div>' +
      '<div class="idea-text">' + escapeHtml(item.idea) + '</div>' +
      '<div class="block-label">My Angle</div>' +
      '<div class="angle-box" style="border-left-color:' + color + ';background:' + color + '0d;">' + escapeHtml(item.angle) + '</div>' +
      '<div class="block-label">Tweets</div>' +
      '<div class="tweets">' +
        '<div class="tweet-card">' +
          '<div class="tweet-label a">TWEET A</div>' +
          '<div class="tweet-text">' + escapeHtml(item.tweetA) + '</div>' +
          '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button>' +
        '</div>' +
        '<div class="tweet-card">' +
          '<div class="tweet-label b">TWEET B</div>' +
          '<div class="tweet-text">' + escapeHtml(item.tweetB) + '</div>' +
          '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button>' +
        '</div>' +
      '</div>' +
      chartBlock +
      '<div class="link-row"><a href="' + item.link + '" target="_blank" rel="noopener">↗ Read full article</a></div>' +
    '</div>' +
  '</div>';
}

function render(){
  const wrap = document.getElementById("cards");
  let list = ITEMS;
  if(activeSrc){
    list = list.filter(function(i){ return i.source.indexOf(activeSrc) !== -1; });
  } else {
    if(activeCat !== "all") list = list.filter(function(i){ return i.cat === activeCat; });
    if(activeUrg !== "all") list = list.filter(function(i){ return i.urgency === activeUrg; });
  }
  if(list.length === 0){
    wrap.innerHTML = '<div class="empty-note">No items match this filter.</div>';
    return;
  }
  wrap.innerHTML = list.map(function(item){ return cardHtml(item, !!activeSrc); }).join("");
}

function toggleCard(id){
  const el = document.getElementById('card-' + id);
  if(el) el.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function toggleReport(){
  document.getElementById('reportCard').classList.toggle('open');
  document.getElementById('reportChevron').textContent = document.getElementById('reportCard').classList.contains('open') ? '▾' : '▸';
}

function buildReport(){
  let html = '<h4>Time Window</h4>';
  html += '<div>' + META.windowStart + ' &rarr; ' + META.windowEnd + '</div>';
  html += '<div style="margin-top:4px;color:var(--text-soft);">Emails in window: ' + META.emailsInWindow + ' &nbsp;|&nbsp; Emails read: ' + META.emailsRead + ' &nbsp;|&nbsp; Items extracted: ' + META.itemsExtracted + '</div>';
  html += '<h4>Included Sources</h4>';
  html += '<div>' + META.includedSources.map(function(s){
    return '<span class="src-item" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + escapeHtml(s.name) + '</span> (' + s.count + ')';
  }).join('<br>') + '</div>';
  html += '<h4>Skipped Sources</h4>';
  if(META.skippedSources.length === 0){
    html += '<div style="color:var(--text-soft);">None — every email in the window contained substantive content.</div>';
  } else {
    html += '<div>' + META.skippedSources.map(function(s){ return escapeHtml(s.name) + ' — ' + escapeHtml(s.reason); }).join('<br>') + '</div>';
  }
  document.getElementById('reportBody').innerHTML = html;
}

function init(){
  document.getElementById('headerMeta').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources';
  buildFilters();
  paintFilterActive();
  render();
  buildReport();
}
init();
</script>
</body>
</html>
