, Florens Odendahl, and Giulia Sestieri", "type": "data_point", "entities": ["OIS rates", "ECB communication"], "conviction": "high", "so_what": "The finding that speeches dominate at longer maturities means fixed-income desks pricing longer-dated euro rates should treat ECB speech calendars as a primary input, not a secondary one, for long-end rate expectations.", "quote": "At longer maturities, inter-meeting communication events become more influential, with cumulative effects up to twice as large as those of formal policy announcements.", "locator": "Overall, in terms of cumulative effects", "quote_verified": true}]}, {"theme": "Case studies of individual speeches moving markets", "insights": [{"claim": "Jean-Claude Trichet's November 2005 Frankfurt speech, in which he said the ECB 'will remove some of the accommodation' in policy, sharply moved the one-year OIS rate and signaled the ECB's first rate hike in five years, delivered the following month.", "speaker": "Klodiana Istrefi, Florens Odendahl, and Giulia Sestieri", "type": "anecdote", "entities": ["Jean-Claude Trichet", "OIS 1Y"], "conviction": "high", "so_what": "This is a concrete historical case of a single unscheduled speech correctly pre-signaling a rate hike a month before the formal decision, validating that ECB speech language is a leading indicator worth trading on.", "quote": "We will remove some of the accommodation which is in the present monetary policy stance", "locator": "First, during Jean-Claude Trichet’s speech", "quote_verified": true}, {"claim": "Mario Draghi's June 2019 Sintra speech, warning that 'additional stimulus will be required' absent an inflation improvement, sharply lowered the one-year OIS rate and preceded a September 2019 deposit rate cut to -0.50% and the restart of net asset purchases.", "speaker": "Klodiana Istrefi, Florens Odendahl, and Giulia Sestieri", "type": "anecdote", "entities": ["Mario Draghi", "Sintra", "asset purchase programme"], "conviction": "high", "so_what": "A second concrete case shows the same speech-to-policy-action pattern for an easing cycle, reinforcing the leading-indicator value of ECB Forum speeches specifically as a venue to watch for policy pivots.", "quote": "In the absence of improvement, such that the sustained return of inflation to our aim is threatened, additional stimulus will be required", "locator": "Second, during Mario Draghi’s speech", "quote_verified": true}, {"claim": "Christine Lagarde's November 2021 Frankfurt speech, stating conditions for a rate hike were 'very unlikely' to be met in 2022 and warning against premature tightening, lowered the one-year OIS rate and the euro.", "speaker": "Klodiana Istrefi, Florens Odendahl, and Giulia Sestieri", "type": "anecdote", "entities": ["Christine Lagarde", "OIS 1Y", "EUR/USD"], "conviction": "high", "so_what": "A third case extends the pattern to FX markets, showing speech-driven repricing isn't limited to rates but also moves the euro directly, relevant to FX desks tracking ECB rhetoric alongside rates traders.", "quote": "the conditions to raise rates are very unlikely to be satisfied next year", "locator": "Third, during Christine Lagarde’s speech", "quote_verified": true}]}, {"theme": "Speeches pre-signal the direction of the next decision, asymmetrically", "insights": [{"claim": "In the weeks before a Governing Council meeting, speeches shift OIS rates in the same direction as the eventual decision: before rate hikes, speeches push rates up; before rate cuts, they push rates down, but less strongly.", "speaker": "Klodiana Istrefi, Florens Odendahl, and Giulia Sestieri", "type": "causal", "entities": ["OIS rates", "Governing Council"], "conviction": "high", "so_what": "This gives traders a directional pre-meeting signal to watch for, and the built-in asymmetry (stronger signaling before hikes) means a lack of vocal pre-signaling ahead of a meeting is itself weak evidence against an imminent hike.", "quote": "Before rate hikes, speeches and interviews push rates upwards. Before rate cuts, they push rates downwards, albeit more modestly.", "locator": "In fact, in the weeks before", "quote_verified": true}, {"claim": "The asymmetry between stronger pre-hike and weaker pre-cut signaling suggests Governing Council members increase the strength of their communication more ahead of monetary tightening (signaling inflation vigilance) than ahead of easing.", "speaker": "Klodiana Istrefi, Florens Odendahl, and Giulia Sestieri", "type": "causal", "entities": ["Governing Council", "monetary policy communication"], "conviction": "medium", "so_what": "This implies ECB communication strategy itself is asymmetric by design (louder on hawkishness than dovishness), a behavioral pattern that should be priced into how much weight markets give to ambiguous or muted pre-meeting rhetoric.", "quote": "This asymmetry suggests that Governing Council members increase the strength of their communication more ahead of monetary policy tightening—signalling vigilance on inflation—than ahead of monetary policy easing.", "locator": "This asymmetry suggests", "quote_verified": true}]}, {"theme": "Which speakers move markets the most", "insights": [{"claim": "The average impact on the two-year OIS rate from 1999-2024 was 5.13 basis points for formal policy announcements, versus 2.56 bps for ECB President speeches, 2.14 bps for Executive Board member speeches, 2.42 bps for the four largest national central bank governors, and 2.62 bps for interviews across these policymakers — making the ECB President the most impactful inter-meeting speaker, closely followed by the national central bank governors.", "speaker": "Klodiana Istrefi, Florens Odendahl, and Giulia Sestieri", "type": "data_point", "entities": ["ECB President", "national central banks", "Executive Board"], "conviction": "high", "so_what": "That national central bank governors (Bundesbank, Banque de France, Banco de España, Banca d'Italia) rank nearly as impactful as the ECB President is a specific, actionable finding for market-communication monitoring teams who might otherwise track only the ECB President and Executive Board.", "quote": "the ECB President has the largest impact on average, followed closely by the President and Governors of the four NCBs and then the ECB Executive Board members", "locator": "Therefore, of the inter-meeting speakers", "quote_verified": true}]}, {"theme": "Better estimates of monetary policy's real-economy effects", "insights": [{"claim": "Using a Bayesian vector autoregression model, estimates of monetary policy's effect on unemployment and inflation based on inter-meeting communication surprises were more statistically precise (tighter confidence bands) than estimates based on formal policy announcements alone, where the unemployment response was statistically insignificant.", "speaker": "Klodiana Istrefi, Florens Odendahl, and Giulia Sestieri", "type": "data_point", "entities": ["Bayesian VAR", "unemployment", "HICP inflation"], "conviction": "high", "so_what": "This means economists estimating the real-economy impact of ECB policy using only scheduled-announcement data are working with weaker, statistically insignificant unemployment estimates, and should incorporate inter-meeting communication surprises to get reliable results.", "quote": "the unemployment response is statistically insignificant... the effects are clearer and more significant when using information from inter-meeting communication events", "locator": "When we base the information in the model", "quote_verified": true}]}], "insight_total": 12, "top_entities": ["European Central Bank", "EA-CED", "Governing Council", "Jean-Claude Trichet", "Mario Draghi", "Christine Lagarde", "OIS rates", "Euro Stoxx 50"], "source_meta": {"author": "European Central Bank", "word_count": 3094, "paywalled": false}}, {"record_id": "e6246524f0fff2f7", "source_type": "concepts", "source_name": "Gavekal Research", "source_url": "https://research.gavekal.com/teaser/another-blow-for-bonds/", "title": "Another Blow For Bonds?", "published_date": "2026-09-24", "language": "en", "processed_at": "2026-09-25T00:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Macro"], "gist": "A paywalled teaser notes the 10-year US Treasury yield jumped 18bp to 5.11% (its highest since the 2007 credit crunch) on strong PMI data and rebounding oil prices, and flags a tightening US labor market as a further potential upward force on yields and inflation.", "themes": [{"theme": "Treasury yields breaking through key levels", "insights": [{"claim": "The 10-year US Treasury yield jumped 18 basis points in a single session, breaking through 5% to hit 5.11%, its highest level since the credit crunch began in July 2007.", "speaker": "Tan Kai Xian", "type": "data_point", "entities": ["10-year Treasury yield", "US bond market"], "conviction": "high", "so_what": "A break above 5% to a post-2007 high on the 10-year is a significant technical and psychological level for rate-sensitive positioning (duration, equities, mortgages), and the move was driven by data surprises rather than a Fed announcement, making it a market-driven rather than policy-driven repricing to track.", "quote": "the 10-year US treasury yield jumped 18bp Wednesday, breaking through the 5% level to hit 5.11%, its highest since the outbreak of the credit crunch in July 2007", "locator": "Propelled by much stronger-than-expected PMI readings", "quote_verified": true}, {"claim": "The yield jump was driven by much stronger-than-expected PMI readings and a rebound in oil prices, occurring while the Federal Reserve is on a tightening track and inflation pressure remains persistent.", "speaker": "Tan Kai Xian", "type": "causal", "entities": ["PMI", "oil prices", "Federal Reserve"], "conviction": "medium", "so_what": "Strong PMI plus rebounding oil simultaneously pushing yields up signals markets are pricing both stronger growth and renewed inflation risk together, a combination that argues against assuming disinflation is now a settled trend.", "quote": "Propelled by much stronger-than-expected PMI readings and a rebound in the price of oil... few market participants would dismiss the possibility of a further near-term rise in yields.", "locator": "Propelled by much stronger-than-expected PMI readings", "quote_verified": true}]}, {"theme": "A tightening labor market as a further upside risk to yields", "insights": [{"claim": "US nonfarm payrolls jumped by a surprisingly strong 162,000 in August, though the three-month moving average of payroll growth stood at 71,000, comfortably within the estimated breakeven range of 15,000-87,000 needed to keep the unemployment rate stable.", "speaker": "Tan Kai Xian", "type": "data_point", "entities": ["US labor market", "nonfarm payrolls"], "conviction": "medium", "so_what": "The gap between the strong single-month print (162,000) and the calmer three-month trend (71,000) means the labor market is not yet clearly overheating on trend data alone, so a single strong payrolls report shouldn't be read in isolation as confirming a tightening cycle.", "quote": "payrolls jumped by a surprisingly strong 162,000 in August... The three-month moving average of payrolls growth is at 71,000, comfortably within its currently estimated breakeven range of 15,000-87,000", "locator": "The US labor market has been largely quiescent", "quote_verified": true}, {"claim": "The author flags growing signs the US labor market may be set to tighten, which would push both wage growth and inflation higher, as a further force that could add upward pressure on Treasury yields beyond the PMI and oil-driven move.", "speaker": "Tan Kai Xian", "type": "prediction", "entities": ["US labor market", "wage growth", "inflation"], "conviction": "low", "so_what": "If the labor market tightening thesis plays out, it would compound the already-rising-yield narrative, reinforcing a case for continued bond-market caution rather than expecting a near-term yield peak.", "quote": "there is another force that may emerge to exert upward pressure on yields: there are growing signs that the US labor market may be set to tighten, pushing both wage growth and inflation higher", "locator": "In addition, there is another force", "quote_verified": true}]}], "insight_total": 4, "top_entities": ["10-year Treasury yield", "US labor market", "Federal Reserve", "PMI", "oil prices"], "source_meta": {"author": "", "word_count": 200, "paywalled": false}}, {"record_id": "7821c18222c26c34", "source_type": "concepts", "source_name": "Glencore investor reports", "source_url": "https://www.glencore.com/media-and-insights/news/expected-asx-secondary-listing-date", "title": "Expected ASX secondary listing date", "published_date": "2026-09-24", "language": "en", "processed_at": "2026-09-25T00:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Positioning"], "gist": "Glencore announced it has satisfied all ASX requirements for a Foreign Exempt Listing, with CHESS Depositary Interests (ASX:GLC) set to begin trading on 14 October 2026, giving Australian holders a local mechanism to trade Glencore shares via CDIs managed by Computershare.", "themes": [{"theme": "Secondary listing mechanics and timing", "insights": [{"claim": "Glencore's CHESS Depositary Interests (CDIs), each representing a beneficial interest in one Glencore ordinary share, are expected to begin trading on the ASX under ticker GLC on Wednesday, 14 October 2026, after Glencore satisfied all substantive ASX Foreign Exempt Listing requirements.", "speaker": "Glencore investor reports", "type": "data_point", "entities": ["Glencore", "ASX", "CHESS Depositary Interests"], "conviction": "high", "so_what": "A confirmed 14 October 2026 start date gives Australian-based investors and index funds a firm event date to prepare for adding Glencore exposure via a local, AUD-denominated listing rather than only through UK or other primary-market shares.", "quote": "The expected first day of trading for Glencore’s CHESS Depositary Interests (CDIs) (ASX:GLC) will be on Wednesday, 14 October 2026.", "locator": "Glencore has been notified by the Australian Securities Exchange", "quote_verified": true}, {"claim": "Holders of Glencore ordinary shares can request conversion into CDIs by contacting Glencore's share registries in Jersey or South Africa, with conversions subject to standard market operations and, for South African holders, compliance with Exchange Control Regulations.", "speaker": "Glencore investor reports", "type": "data_point", "entities": ["Glencore", "Computershare", "CDI conversion"], "conviction": "high", "so_what": "The added South African exchange-control compliance step is a friction point specific to that shareholder base that could slow conversion volumes from South Africa relative to UK-based holders around the listing date.", "quote": "conversions subject to market standard operations and, from South Africa, subject also to compliance with Exchange Control Regulations", "locator": "Holders of Glencore ordinary shares", "quote_verified": true}]}, {"theme": "Company scale as context for the listing", "insights": [{"claim": "Glencore describes itself as one of the world's largest diversified natural resource companies, producing and marketing more than 60 commodities with over 140,000 employees and contractors across more than 30 countries.", "speaker": "Glencore investor reports", "type": "data_point", "entities": ["Glencore"], "conviction": "medium", "so_what": "This scale context (60+ commodities, 140,000+ employees, 30+ countries) is the backdrop against which the ASX secondary listing should be read as a distribution/access expansion for an already-major global commodities trader, not a capital-raising event.", "quote": "Glencore is one of the world’s largest global diversified natural resource companies and a major producer and marketer of more than 60 commodities.", "locator": "Notes for Editors", "quote_verified": true}]}], "insight_total": 3, "top_entities": ["Glencore", "ASX", "CHESS Depositary Interests", "Computershare"], "source_meta": {"author": "", "word_count": 624, "paywalled": false}}, {"record_id": "a879d2f6e6c93b1c", "source_type": "concepts", "source_name": "Oxford Economics", "source_url": "https://www.oxfordeconomics.com/resource/made-in-europe-relies-on-maintaining-production-links-with-the-uk/", "title": "Made in Europe relies on maintaining production links with the UK", "published_date": "2026-09-23", "language": "en", "processed_at": "2026-09-25T00:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Geopolitics"], "gist": "Oxford Economics warns the EU's proposed Made in Europe / Industrial Accelerator Act, which sets origin and low-carbon requirements for sectors like automotive and clean technology, risks disrupting deep post-Brexit UK-EU production links — quantifying UK automotive exports to the EU at €20 billion in 2024, supporting €5.6 billion in EU supplier spending, ~58,000 jobs, and €1.6 billion in tax revenue.", "themes": [{"theme": "UK-EU production links persist despite Brexit", "insights": [{"claim": "Parts, machinery, and services produced in the EU enter UK production facilities whose output then returns to EU customers, and Brexit changed the trading framework but did not remove these underlying production links.", "speaker": "Stephen Foreman", "type": "thesis", "entities": ["UK-EU trade", "manufacturing supply chains"], "conviction": "high", "so_what": "This establishes that UK-EU manufacturing interdependence remains structurally intact post-Brexit, meaning EU policy that reduces UK production demand has a direct, quantifiable feedback effect on EU suppliers, not just a UK-side cost.", "quote": "Brexit changed the trading framework, but it did not remove these production links. A decision that reduces demand for UK production risks also reducing orders for its EU suppliers.", "locator": "Parts, machinery, and services produced", "quote_verified": true}]}, {"theme": "Scale of the automotive sector's cross-border links", "insights": [{"claim": "In 2024, around €20 billion of UK automotive production was exported to the EU, associated with an estimated €5.6 billion of spending on EU-produced goods and services, supporting approximately 58,000 jobs and €1.6 billion in tax revenues, with links extending into wholesale/retail, transport, professional services, real estate, and utilities.", "speaker": "Stephen Foreman", "type": "data_point", "entities": ["UK automotive sector", "SMMT", "EU supply chains"], "conviction": "high", "so_what": "This gives a concrete magnitude — 58,000 EU jobs and €1.6B in EU tax revenue — tied to UK automotive export demand, a quantifiable exposure for EU policymakers and investors to weigh against any Made in Europe restriction that reduces UK-sourced automotive output.", "quote": "around €20 billion of UK automotive production was exported to the EU. That output was associated with an estimated €5.6 billion of spending on EU-produced goods and services, supporting an approximately 58,000 jobs and €1.6 billion in tax revenues", "locator": "Our analysis for SMMT puts a scale", "quote_verified": true}, {"claim": "The cited figures are estimates of existing economic activity potentially exposed to policy change, not a forecast of actual losses, derived by tracing purchases through EU supply chains and worker wage spending using Oxford Economics' Business Economic Impact Calculator.", "speaker": "Stephen Foreman", "type": "framework", "entities": ["Business Economic Impact Calculator"], "conviction": "medium", "so_what": "This methodological caveat matters for interpreting the headline figures correctly: the 58,000-jobs/€1.6B numbers represent exposure, not a predicted outcome, so they shouldn't be read as a guaranteed loss forecast if the Industrial Accelerator Act proceeds.", "quote": "These are estimates of existing economic activity potentially exposed, not a forecast of losses.", "locator": "These are estimates of existing economic", "quote_verified": true}]}, {"theme": "The Industrial Accelerator Act's origin rules as the policy risk", "insights": [{"claim": "The European Commission's proposed Industrial Accelerator Act would use public purchasing and support to favor cleaner, more resilient production, with different low-carbon or origin requirements for steel, cement, aluminium, clean technologies (batteries, solar, wind, heat pumps), and electric vehicles and their components.", "speaker": "Stephen Foreman", "type": "data_point", "entities": ["Industrial Accelerator Act", "European Commission"], "conviction": "high", "so_what": "The sector-specific and varying nature of the proposed origin rules means the policy's impact on UK-linked production will differ materially by sector, so companies in steel, EVs, and clean-tech supply chains need sector-specific rather than blanket assessments of their exposure.", "quote": "The European Commission’s proposed Industrial Accelerator Act would use public purchasing and support to encourage cleaner, more resilient production. It proposes different low-carbon or origin requirements for steel, cement, and aluminium", "locator": "The European Commission’s proposed Industrial", "quote_verified": true}, {"claim": "Under the Commission's March draft, most UK content would generally count as equivalent to EU origin, but stricter conditions have been identified specifically for electric and hybrid vehicles, and the legislation remains under negotiation.", "speaker": "Stephen Foreman", "type": "data_point", "entities": ["Industrial Accelerator Act", "electric vehicles"], "conviction": "medium", "so_what": "EV and hybrid vehicle supply chains face a materially different (stricter) origin-rule risk than most other UK-linked sectors under the current draft, making automotive EV suppliers the segment most exposed to unfavorable rule changes as negotiations continue.", "quote": "Under the Commission’s March draft, most UK content would generally count as equivalent to EU origin. The European Commission has identified stricter conditions for electric and hybrid vehicles, however, and the legislation remains under negotiation.", "locator": "Under the Commission’s March draft", "quote_verified": true}]}], "insight_total": 5, "top_entities": ["Industrial Accelerator Act", "European Commission", "UK automotive sector", "SMMT", "UK-EU trade"], "source_meta": {"author": "Suki Masana", "word_count": 392, "paywalled": false}}, {"record_id": "f9fa339bd4c9cc45", "source_type": "concepts", "source_name": "Oxford Economics", "source_url": "https://www.oxfordeconomics.com/resource/oxford-economics-launches-askoe-business-foresight/", "title": "Oxford Economics launches AskOE Business Foresight", "published_date": "2026-09-24", "language": "en", "processed_at": "2026-09-25T00:00:00Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Macro"], "gist": "Oxford Economics launched AskOE Business Foresight, a conversational AI agent that links its proprietary economic indicators and forecasting methods directly to a client company's revenue drivers, extending its AskOE AI product suite (launched 2024) beyond general-purpose LLM tools by keeping model assumptions and data sources documented and traceable.", "themes": [{"theme": "Product mechanics and differentiation", "insights": [{"claim": "AskOE Business Foresight identifies the markets and economic indicators most closely linked to a company's historical performance, combines them into a tailored demand signal, and tests different forecasting approaches to find the method that best fits the business, all through a conversational interface requiring no specialist modeling skills.", "speaker": "Sally Li", "type": "data_point", "entities": ["AskOE Business Foresight", "Oxford Economics"], "conviction": "medium", "so_what": "A no-code, conversational forecasting tool that ties company revenue to macro indicators lowers the skill barrier for corporate finance and strategy teams to run scenario analysis in-house rather than commissioning bespoke economic consulting engagements.", "quote": "Business Foresight identifies the markets and economic indicators most closely linked to a company’s historical performance. It combines these drivers into a tailored demand signal before testing different forecasting approaches", "locator": "Purpose-built by Oxford Economics’ economists", "quote_verified": true}, {"claim": "Unlike general-purpose LLM tools, Business Foresight draws on Oxford Economics' proprietary economic intelligence and economist-developed mapping logic and forecasting approaches, with key assumptions, indicators, and model choices documented for user visibility.", "speaker": "Sally Li", "type": "contrarian", "entities": ["AskOE Business Foresight", "large language models"], "conviction": "medium", "so_what": "The explicit positioning against 'general-purpose LLM tools' signals Oxford Economics is betting that proprietary data plus documented methodology, not raw model capability, is the differentiator that will win enterprise forecasting business against generic AI copilots.", "quote": "Unlike general-purpose LLM tools, Business Foresight draws on Oxford Economics’ proprietary economic intelligence and uses mapping logic and forecasting approaches developed by its economists.", "locator": "Unlike general-purpose LLM tools", "quote_verified": true}]}, {"theme": "Part of a broader AI product strategy", "insights": [{"claim": "Business Foresight is the latest addition to a growing AI suite Oxford Economics has built since launching AskOE in 2024, which also includes the AskOE Executive Lens agent and Model Context Protocol (MCP) integrations letting clients bring Oxford Economics' intelligence into their existing AI workflows.", "speaker": "Sally Li", "type": "data_point", "entities": ["AskOE", "Oxford Economics", "Model Context Protocol"], "conviction": "medium", "so_what": "Adoption of MCP integrations shows a traditional economic-research firm actively plugging its proprietary data into the broader AI-agent ecosystem rather than building only a closed standalone product, a distribution strategy other data/analytics vendors may need to match.", "quote": "This includes purpose-built AI agents such as AskOEAI Executive Lens, as well as Model Context Protocol (MCP) integrations that enable clients to bring Oxford Economics’ intelligence into the AI tools and workflows they already use.", "locator": "Business Foresight is the latest addition", "quote_verified": true}, {"claim": "Oxford Economics frames its AI strategy as unlocking more value from decades of accumulated proprietary economic intelligence and expertise, rather than simply using AI to deliver existing information faster.", "speaker": "Sally Li", "type": "thesis", "entities": ["Oxford Economics", "AI strategy"], "conviction": "medium", "so_what": "This articulates a monetization thesis for incumbent data/research firms facing AI disruption: proprietary datasets and domain expertise built over decades become the defensible moat that AI wrapping alone can package into new, sellable products.", "quote": "The opportunity for us is not simply to use AI to deliver information faster. It is to use technology to unlock more value from the economic intelligence and expertise we have built over decades.", "locator": "The opportunity for us is not simply", "quote_verified": true}]}], "insight_total": 4, "top_entities": ["Oxford Economics", "AskOE Business Foresight", "Model Context Protocol", "AskOE Executive Lens"], "source_meta": {"author": "Sally Li", "word_count": 611, "paywalled": false}}, {"record_id": "a488c76f83acbef8", "source_type": "concepts", "source_name": "St. Louis Fed — FRED Blog", "source_url": "https://fredblog.stlouisfed.org/2026/09/estimating-the-risk-of-recession-in-the-us/", "title": "Estimating the risk of recession in the US", "published_date": "", "language": "en", "processed_at": "2026-09-25T00:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Macro"], "gist": "FRED added a new monthly US recession-probability dataset from RecessionRisk.com (Furno and Giannone), which combines the manufacturing PMI and the ECB's Composite Indicator of Systemic Stress; the August 2026 reading was just 0.08%, and while spikes broadly track actual NBER recessions, some past spikes (October 1998, March 2023) did not turn into recessions.", "themes": [{"theme": "The new dataset and its current reading", "insights": [{"claim": "FRED added a monthly probability-of-US-recession dataset from RecessionRisk.com, developed by economists Francesco Furno and Domenico Giannone, with the August 2026 reading at just 0.08%, available on the first business day after the reference month closes.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["RecessionRisk.com", "recession probability", "FRED"], "conviction": "high", "so_what": "A 0.08% recession probability for August 2026 is an extremely low reading, and the near-real-time monthly availability (first business day after month-end) makes this a fast, freely available macro indicator worth tracking as a low-lag substitute for slower-moving recession signals.", "quote": "The latest data, for August 2026, show that probability was 0.08%.", "locator": "The takeaway", "quote_verified": true}]}, {"theme": "Methodology: combining growth and financial-stress signals", "insights": [{"claim": "The recession probability is calculated from a statistical model combining two indicators: the ISM Purchasing Managers' Index (PMI) for manufacturing, and the ECB's Composite Indicator of Systemic Stress (CISS), which tracks stress across bond, equity, money, foreign exchange, and financial intermediary markets.", "speaker": "St. Louis Fed — FRED Blog", "type": "framework", "entities": ["PMI", "Composite Indicator of Systemic Stress", "European Central Bank"], "conviction": "high", "so_what": "A two-input model (one real-economy survey, one cross-market financial-stress index) gives a simple, replicable framework for anyone wanting to build their own quick recession-risk gauge rather than relying on more opaque proprietary models.", "quote": "The probability estimates are calculated using a statistical model that combines two indicators. The first measures broad economic conditions, and the second measures financial market stress", "locator": "The methodology", "quote_verified": true}]}, {"theme": "Track record: good overlap with NBER dating, but false positives exist", "insights": [{"claim": "The timing of spikes in the RecessionRisk.com probability estimate broadly coincides with NBER-dated turning points into actual recessions, but several past spikes — such as around October 1998 and March 2023 — did not develop into actual recessions.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["NBER", "recession probability"], "conviction": "medium", "so_what": "The documented false-positive history (1998, 2023) is an important caveat: a future spike in this indicator should be treated as a raised-risk signal to monitor, not a confirmed recession call, given its track record of occasional false alarms.", "quote": "several probability spikes, such as the ones around October 1998 and March 2023, did not develop into actual recessions", "locator": "The overlap between the RecessionRisk.com data", "quote_verified": true}]}], "insight_total": 3, "top_entities": ["RecessionRisk.com", "FRED", "NBER", "PMI", "Composite Indicator of Systemic Stress"], "source_meta": {"author": "", "word_count": 345, "paywalled": false}}, {"record_id": "ff019e8c19e24b05", "source_type": "concepts", "source_name": "Works in Progress", "source_url": "https://worksinprogress.co/issue/weapons-of-mass-decentralization/", "title": "Weapons of mass decentralization - Works in Progress Magazine", "published_date": "2026-09-23", "language": "en", "processed_at": "2026-09-25T00:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Geopolitics", "Tech"], "gist": "An essay argues the Bronze Age collapse's lasting empire-vacuum was caused by iron replacing scarce, elite-controlled bronze with a locally-minable metal that 'democratized violence,' destabilizing imperial power for centuries, and draws a direct modern parallel to how cheap drones (up to 80% of Russia-Ukraine casualties) and AI are similarly redistributing (and, for AI providers, potentially re-concentrating) the technological balance of power.", "themes": [{"theme": "The puzzle: why no empire replaced the Bronze Age great powers", "insights": [{"claim": "After the Bronze Age collapse around 1200 BC destroyed the Hittite, Mycenaean, and weakened Egyptian and Assyrian/Babylonian empires, the real mystery is not why they fell but why nothing like them re-emerged for centuries, since catastrophes like droughts or invasions typically cause upheaval without permanently preventing empire reconsolidation.", "speaker": "Works in Progress", "type": "thesis", "entities": ["Bronze Age collapse", "Hittite Empire", "Egypt"], "conviction": "high", "so_what": "Reframing the puzzle from 'why did empires fall' to 'why didn't new ones rise' shifts the analytical focus toward structural, durable constraints on power concentration rather than one-off catastrophic events — a framework relevant whenever assessing whether a current power vacuum will refill quickly or persist.", "quote": "The question is not why the Bronze Age empires fell, but why, after they fell, nothing like them returned for centuries.", "locator": "The usual explanation points to a series", "quote_verified": true}, {"claim": "The average length of royal reigns across Assyria, Babylon, and Athens fell 29% after iron's adoption compared with before, and Babylon saw nearly twice as many kings in the following centuries, evidence of rising political instability.", "speaker": "Works in Progress", "type": "data_point", "entities": ["Assyria", "Babylon", "Athens", "iron"], "conviction": "medium", "so_what": "A 29% drop in average reign length is a concrete, comparable metric of destabilization following a military-technology shift, a benchmark for gauging how disruptive a similarly democratizing technology could be to today's power structures.", "quote": "The average length of reigns across the sample of Assyria, Babylon, and Athens taken together falls 29 percent, and Babylon sees almost twice the number of kings in the centuries after iron adoption.", "locator": "Ancient records allow us to build timelines", "quote_verified": true}]}, {"theme": "Bronze concentrated military power in the hands of empires", "insights": [{"claim": "Bronze required tin, which was extremely scarce and had to travel thousands of miles from a handful of deposits (Afghanistan, France, Iberia, Cornwall), meaning large, complex empires could secure supply chains and stockpiles far more reliably than smaller polities, giving elites a durable military advantage.", "speaker": "Works in Progress", "type": "causal", "entities": ["bronze", "tin", "Bronze Age empires"], "conviction": "high", "so_what": "This establishes the general mechanism — concentrated control of a scarce input to a decisive military technology entrenches power in whoever can secure that supply chain — a pattern the essay later maps onto chip/compute control in AI.", "quote": "elites had a major advantage in accessing the tools of violence. While smaller city-states could also get their hands on bronze, larger and more complex empires could do so more reliably.", "locator": "This had a profound political consequence", "quote_verified": true}]}, {"theme": "Iron democratized violence by being locally abundant", "insights": [{"claim": "Iron is the fourth most abundant element in Earth's crust and its ores (goethite, limonite, hematite) are visually identifiable on the surface, so peripheral communities could smelt weapons locally using bloomery furnaces, without depending on empire-controlled long-distance trade networks the way bronze required.", "speaker": "Works in Progress", "type": "causal", "entities": ["iron", "bloomery"], "conviction": "high", "so_what": "Local availability breaking a supply-chain chokepoint is the specific mechanism that erodes centralized power, a transferable test for evaluating whether any new technology (weapons, energy, computing) will centralize or decentralize power based on whether its key input remains scarce and controllable.", "quote": "Since iron could be smelted locally, previously peripheral communities could arm themselves with weapons that were, for practical purposes, comparable to the weapons of the elite in the empire’s core. In contrast to bronze, iron democratized violence.", "locator": "This new technology had momentous political", "quote_verified": true}, {"claim": "Iron is not actually a superior weapons material to bronze (good bronze is harder, more predictable, and easier to recycle due to its lower melting point) — iron's dominance came purely from its abundance and accessibility, not from being a better weapon.", "speaker": "Works in Progress", "type": "contrarian", "entities": ["iron", "bronze"], "conviction": "high", "so_what": "This is a counterintuitive but important distinction: the technology that reshapes a power balance need not be technically superior, only more accessible, a lens relevant to assessing which emerging technologies (not necessarily the most 'advanced') are most likely to disrupt existing power concentrations.", "quote": "Iron is different: it is not a better material than bronze. Good bronze is both harder than iron and more predictable.", "locator": "The advantage of the previous technological leap", "quote_verified": true}, {"claim": "Ancient writers directly linked iron to warfare and suffering: Hesiod called the Iron Age a time of endless toil and pain, Herodotus called iron 'the woe lying upon woe,' and the Philistines reportedly tried to restrict access to smiths, fearing others could easily make iron weapons.", "speaker": "Works in Progress", "type": "data_point", "entities": ["Hesiod", "Herodotus", "Philistines", "iron"], "conviction": "medium", "so_what": "Contemporary attempts to restrict smith access (the Philistine case) show elites recognized and tried to resist the democratizing threat of iron in real time, a historical precedent for how incumbent powers may similarly try (and fail) to gatekeep access to today's decentralizing technologies.", "quote": "The Hebrew Bible records that the Philistines attempted to limit access to smiths as they were worried others could easily make iron weapons.", "locator": "The effects of iron were so stark", "quote_verified": true}]}, {"theme": "Archaeological evidence of rising violence after iron", "insights": [{"claim": "Skeletal remains from the Middle East show more signs of weapon-inflicted violence in the Late Bronze Age and Iron Age than in the Middle Bronze Age before iron's invention, and a battle-database study found a sharp rise in the number of battles in the century after regions adopted iron compared with the century before.", "speaker": "Works in Progress", "type": "data_point", "entities": ["Iron Age", "skeletal trauma studies"], "conviction": "medium", "so_what": "Independent physical (skeletal) and documentary (battle-count) evidence both pointing to increased violence after iron's adoption strengthens the causal claim that technological democratization of weapons access directly increases the frequency of conflict, not just its distribution.", "quote": "Compared with the Middle Bronze Age, before the invention of iron, skeletons from the Late Bronze Age and Iron Age show more signs of violence.", "locator": "The archaeological record allows us to compare", "quote_verified": true}]}, {"theme": "The pattern repeats: gunpowder, nuclear weapons, drones, and AI", "insights": [{"claim": "History shows a recurring cycle of centralizing and decentralizing military technologies: castles let barons resist kings until gunpowder made walls obsolete, firearms initially strengthened states while scarce but then decentralized power once cheap in the 19th-20th centuries, and nuclear weapons can act as an equalizer for a small state that achieves nuclear status.", "speaker": "Works in Progress", "type": "framework", "entities": ["gunpowder", "nuclear weapons", "castles"], "conviction": "high", "so_what": "This framework — a technology's political effect depends on whether it changes the offense-defense balance or changes who has access to the weapon — gives a reusable analytical lens for judging the geopolitical impact of any emerging military technology.", "quote": "Some technologies, like castles, change the offense-defense bias—whether it is easier to attack or defend. Others, like iron, change who has access to weaponry.", "locator": "History has seen the ebb and flow", "quote_verified": true}, {"claim": "Drones are reportedly responsible for up to 80% of recent casualties in the Russia-Ukraine war as of 2026, with a drone costing just a few hundred dollars able to threaten a tank, artillery gun, or command post worth many times more, lowering war's cost of entry for small groups.", "speaker": "Works in Progress", "type": "data_point", "entities": ["drones", "Russia-Ukraine war"], "conviction": "high", "so_what": "An 80%-of-casualties figure and a cost-asymmetry where a few-hundred-dollar weapon can destroy multi-million-dollar hardware is direct evidence that the iron-style democratization-of-violence pattern is playing out live in the largest current conventional war, relevant to defense procurement and military-strategy decisions today.", "quote": "drones... are reportedly responsible for up to 80 percent of recent casualties in that conflict as of 2026. A drone costing just a few hundred dollars can threaten a tank, artillery gun, or command post worth many times more.", "locator": "A clear modern-day parallel is drones", "quote_verified": true}, {"claim": "AI presents an ambiguous parallel to iron: access is decentralized in that many individuals can use it (potentially to destructive effect), but AI providers retain the capacity to concentrate power because they can cut off access, centralizing control in the companies that own the models, similar to Bronze Age kings controlling tin stockpiles.", "speaker": "Works in Progress", "type": "contrarian", "entities": ["AI", "AI providers"], "conviction": "medium", "so_what": "This flags a live, unresolved policy question: whether AI ultimately decentralizes power (like iron) or re-concentrates it in a handful of model-owning companies (like Bronze Age tin control) depends on decisions about access and export control being made right now, making this a framework investors and policymakers should apply directly to current AI-governance debates.", "quote": "AI providers have the capacity to concentrate power. Access can be cut off, centralizing the use of AI in the hands of the companies that own it... similar to the advantage enjoyed by Bronze Age kings who controlled stores of tin.", "locator": "Another parallel can perhaps be seen in AI", "quote_verified": true}]}], "insight_total": 10, "top_entities": ["Bronze Age collapse", "iron", "bronze", "Hittite Empire", "Egypt", "drones", "AI", "Russia-Ukraine war"], "source_meta": {"author": "WorksInProgMag", "word_count": 3474, "paywalled": false}}, {"record_id": "f307196c2428394a", "source_type": "concepts", "source_name": "World Gold Council", "source_url": "https://www.gold.org/goldhub/gold-focus/2026/09/you-asked-we-answered-ai-boom-and-gold", "title": "You asked, we answered: The AI boom and gold", "published_date": "", "language": "en", "processed_at": "2026-09-25T00:00:00Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Positioning"], "gist": "The World Gold Council finds the AI boom has not yet visibly increased gold demand (industrial/technology demand was flat at 323t in 2025) because rising AI-chip demand is offset by cost-driven thrifting and miniaturization, but flags co-packaged optics as an emerging AI-data-center technology that could become a new, meaningful source of gold demand, while high-end and safety-critical chips remain effectively gold-irreplaceable.", "themes": [{"theme": "Gold in electronics: scale and unique properties", "insights": [{"claim": "Industrial demand for gold in electronics, dentistry and other areas totaled 323 tonnes in 2025, virtually unchanged from 2024, with the electronics sector alone consuming approximately 80% of all gold used in industrial applications.", "speaker": "Louise Street and Trevor Keel", "type": "data_point", "entities": ["gold demand", "electronics"], "conviction": "high", "so_what": "The 323t/flat-year-over-year figure is the baseline against which any future AI-driven gold demand shift should be measured, and the 80% electronics concentration means AI-sector chip trends are effectively the single biggest swing factor in industrial gold demand.", "quote": "In 2025, industrial demand for gold used in electronics, dentistry and other areas totalled 323t, virtually unchanged from 2024.", "locator": "Gold is used for much more than", "quote_verified": true}, {"claim": "Gold's electronics use took off in the 1960s-70s with the rise of semiconductors because it uniquely combines excellent electrical conductivity, corrosion/oxidation resistance, and the ability to be formed into extremely thin wires, films, and coatings without losing performance.", "speaker": "Louise Street and Trevor Keel", "type": "framework", "entities": ["gold", "semiconductors"], "conviction": "high", "so_what": "This combination of properties explains why gold has resisted full substitution for over half a century, a relevant baseline for judging how durable gold's role will remain even as manufacturers push cost-driven thrifting.", "quote": "Engineers recognised that gold possessed a unique combination of properties that no other material could match: an excellent conductor of electricity and highly resistant to corrosion and oxidation", "locator": "As the chart below illustrates", "quote_verified": true}]}, {"theme": "The AI boom's ambiguous, offsetting effect on gold demand", "insights": [{"claim": "Despite rapid growth in demand for AI chips, 2025 technology gold demand stayed flat at 323t, because high gold prices push manufacturers to reduce or eliminate gold use and miniaturization means smaller chips need less or no gold, roughly offsetting the demand boost from AI chip growth.", "speaker": "Louise Street and Trevor Keel", "type": "causal", "entities": ["AI chips", "gold thrifting", "miniaturization"], "conviction": "high", "so_what": "This directly counters a naive 'AI boom = more gold demand' assumption; investors basing a gold-demand thesis on AI chip growth alone are missing the offsetting cost-thrifting and miniaturization forces that have kept demand flat so far.", "quote": "We view the current demand situation in the electronics sector very much as a tug-of-war, with cost pressures and technical advances on one side and AI demand on the other. At the moment, the two sides appear evenly matched.", "locator": "Has the AI boom fuelled demand for gold?", "quote_verified": true}, {"claim": "Most 'easy' gold-thrifting (thinning bonding wires and coatings) already happened years ago, meaning most coatings and wires are already at or near their technical minimum thickness, limiting how much further thrifting can reduce gold use per device going forward.", "speaker": "Louise Street and Trevor Keel", "type": "data_point", "entities": ["gold thrifting"], "conviction": "medium", "so_what": "If thrifting has largely run its course, the offsetting downward force on gold demand may weaken over time, which could tilt the AI-chip-demand versus thrifting 'tug-of-war' toward net demand growth in future years even without new use cases.", "quote": "“easy” gold-thrifting happened many years ago, meaning that most coatings and wires are already at – or very close to – their technical minimum thickness", "locator": "Is gold replaceable in the AI/electronics", "quote_verified": true}]}, {"theme": "Co-packaged optics as an emerging new source of gold demand", "insights": [{"claim": "Co-packaged optics (CPO), which closely integrates optical communication components with the processor to boost bandwidth and reduce data-transmission bottlenecks for next-generation AI data centers, uses gold in optical/photonic components and high-frequency chip electrodes, and major players including Nvidia are investing heavily in its development despite CPO being at an early adoption stage.", "speaker": "Louise Street and Trevor Keel", "type": "data_point", "entities": ["co-packaged optics", "Nvidia", "AI data centers"], "conviction": "medium", "so_what": "CPO is flagged as a specific, named emerging technology that could become a new structural source of gold demand if it scales across hyperscale AI infrastructure, giving gold investors a concrete technology trend to monitor for adoption signals (e.g. Nvidia's CPO roadmap) as a demand catalyst.", "quote": "If the technology achieves widespread deployment across hyperscale AI infrastructure it could represent a small but potentially meaningful new source of demand for gold within the sector.", "locator": "An emerging area that could support", "quote_verified": true}]}, {"theme": "Gold remains hard to replace in high-end, safety-critical uses", "insights": [{"claim": "While manufacturers continue to minimize or remove gold in lower-end applications, the World Gold Council believes high-end and safety-critical devices will continue to require gold because manufacturers of complex, costly AI chips prioritize longevity and reliability, which almost always involves gold.", "speaker": "Louise Street and Trevor Keel", "type": "thesis", "entities": ["gold", "high-end chips", "AI applications"], "conviction": "medium", "so_wha // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
