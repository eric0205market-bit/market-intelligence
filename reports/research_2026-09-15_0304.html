ent model from the sprawling pass-through pod shops it's compared to.", "angle": "This is an allocator-positioning signal — capital that chased 'star manager' platform spinouts over the last 3-5 years is being tested in real time, which matters for prime brokerage flows and possible year-end redemption/deleveraging risk.", "tweetA": "Freestone Grove -5.3% YTD. Holocene -5% YTD. These are the flagship Citadel cubs that raised billions on 15%+ track records. The Tiger Cub era took a decade to show cracks. The Citadel/Millennium cub era is showing them in year three.", "tweetB": "Woodline runs $25bn with about 100 people — no pass-through fee sprawl, no bloated pod structure. Meanwhile the funds that copied the Citadel/Millennium model most literally are the ones bleeding this year. Maybe the lesson isn't 'spin out from the platform,' it's 'don't rebuild the platform.'", "charts": {"count": 0, "hot": false, "desc": "Chart inside comparing major Citadel/Millennium cub launches by AUM and founding year — worth opening."}, "link": "https://rupakghose.substack.com/p/the-citadel-and-millennium-cubs"}, {"id": 3, "cat": "energy", "urgency": "watch", "source": "McKinsey", "title": "A quiet $95bn electrification market nobody's pricing", "idea": "McKinsey pegs the power conversion market — inverters, converters, transformers, the hardware layer that actually delivers electrification — at roughly a $95 billion value pool by 2030, driven by decarbonization and rising data-center power demand.", "angle": "This sits directly adjacent to the AI power buildout story everyone already trades (GPUs, grid, utilities) — power conversion/electronics suppliers are a less crowded way to play the same electrification capex wave.", "tweetA": "McKinsey just put a number on the unsexy part of electrification: power conversion hardware is a $95B market by 2030. Everyone's trading the GPUs. Almost nobody's trading the transformers and inverters that have to exist for the GPUs to get power at all.", "tweetB": "The AI power story gets told through NVDA and utility stocks. The power conversion layer — literally the boxes between the grid and the rack — is a $95B TAM sitting in McKinsey's own numbers, mostly untraded.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening for the market sizing breakdown."}, "link": "https://www.mckinsey.com/industries/industrials/our-insights/the-power-conversion-market-decarbonization-and-growth-opportunities"}, {"id": 4, "cat": "positioning", "urgency": "act now", "source": "Bespoke Investment Group", "title": "Today was the widest software-vs-semis divergence in 25 years of trading", "idea": "After Anthropic and OpenAI both called for slowing AI development pace over the weekend, the semis ETF (SOXX) fell over 5% today while the software ETF (IGV) rose over 5% — a spread Bespoke says has never happened once in the 25-year trading history of both ETFs. Days where IGV beat SOXX by 5+ points on an up/down split were essentially nonexistent before 2026 and are now recurring.", "angle": "This is the market voting in real time on who eats an AI capex pause versus who benefits from it — genuinely unprecedented by Bespoke's own 25-year dataset, and it's becoming a repeatable pattern, not a one-off.", "tweetA": "IGV beat SOXX by the widest single-day margin in 25 years of both ETFs trading — because two AI labs said 'maybe slow down' over a weekend. That's not a rotation, that's the market repricing who survives a capex pause versus who needs it to never stop.", "tweetB": "This exact pattern — software ripping, semis getting crushed — didn't exist before 2026. Now it's recurring every time AI capex gets questioned. The market has quietly built a working hedge for 'AI slowdown,' and it's called long software, short semis.", "charts": {"count": 1, "hot": true, "desc": "Table of every historical day IGV outperformed SOXX by 5+ points — shows the pattern only exists post-2026."}, "link": "https://bespokeinvest.substack.com/p/software-surges-into-dreamforce"}, {"id": 5, "cat": "positioning", "urgency": "deep", "source": "The Market Ear (Goldman Sachs)", "title": "Hedge funds just rebuilt tech longs right into a volatility trap", "idea": "GS prime brokerage shows hedge funds bought US TMT in 10 of the last 11 sessions — the fastest 2-week pace of long buying since June 2025, 97th percentile over a 5-year lookback. Meanwhile the 200-day vol of GS's TMT Momentum Winners-vs-Losers basket sits near 76, versus just 13 for the SPX — tech price action is running roughly 6x more violent than the index.", "angle": "Freshly rebuilt, narrative-levered longs are exactly the positioning that gets flushed hardest on AI/Iran headline risk — this is the mechanical explanation for why today's Anthropic/OpenAI-driven selloff hit tech so disproportionately.", "tweetA": "HFs piled into tech longs at a 97th-percentile pace over the last two weeks — the fastest since June '25. Then Anthropic and OpenAI said 'maybe slow down' and the whole book got tested in one session. This is what a crowded trade looks like right before it gets crowded out.", "tweetB": "Tech dispersion (200-day vol of 76) is now roughly 6x SPX vol (13). That gap is the real risk metric right now, not the index level. When everyone owns the same freshly rebuilt longs and dispersion is this wide, one headline does the work of a macro shock.", "charts": {"count": 2, "hot": false, "desc": "GS/Bloomberg charts on TMT positioning pace and winner/loser dispersion — worth opening."}, "link": "https://www.zerohedge.com/the-market-ear/hedge-funds-just-piled-back-tech-now-nasdaq-floor-breaking"}, {"id": 6, "cat": "positioning", "urgency": "deep", "source": "The Market Ear (Goldman Sachs)", "title": "Short-term and long-term momentum just had a historic divorce", "idea": "GS's 3-month momentum basket was up 5% on the day while its 12-month momentum basket was down 6.7% — the largest one-day underperformance of long-term versus short-term momentum in five years.", "angle": "This is a quant-factor blowup signal, not a fundamental one — systematic strategies built on 12-month lookbacks are getting mechanically run over, which typically forces deleveraging regardless of anyone's actual view on AI or oil.", "tweetA": "GS's 12-month momentum basket underperformed its 3-month basket by the widest margin in 5 years — in one day. That's not investors changing their minds about AI. That's systematic money getting mechanically stopped out.", "tweetB": "Forget the narrative for a second: when 12-month momentum craters against 3-month momentum this violently, the next leg is usually forced deleveraging, not more thinking. Watch CTA/vol-target flows this week, not headlines.", "charts": {"count": 1, "hot": false, "desc": "GS chart of 3-month vs 12-month momentum basket performance — worth opening."}, "link": "https://www.zerohedge.com/the-market-ear/hedge-funds-just-piled-back-tech-now-nasdaq-floor-breaking"}, {"id": 7, "cat": "positioning", "urgency": "deep", "source": "The Market Ear (Goldman Sachs / Deutsche Bank)", "title": "CTAs sold $16bn last week — the model says $19.5bn more is coming", "idea": "Goldman's CTA model estimates trend-followers sold $16bn of global equities last week, cutting net positioning to $123bn (75th percentile over the past year), and projects another ~$19.5bn of selling this week at current price/vol levels. Separately, roughly 40% of S&P 500 companies enter buyback blackout this week, pulling one of the market's steadiest demand sources right as systematic supply increases.", "angle": "Two structural flow headwinds are stacking in the same week — mechanical CTA selling plus the buyback blackout — independent of any AI or oil narrative, exactly the technical setup that turns a normal dip into an air pocket.", "tweetA": "$16bn of CTA selling last week. Another $19.5bn modeled for this week. Layer on 40% of the S&P entering buyback blackout at the same time. Nobody has to be bearish on AI for this market to have a rough week — the flows alone do it.", "tweetB": "The bull case has been 'buybacks always show up.' This week roughly 4 in 10 S&P names literally can't buy. That's the quiet part of every September selloff nobody prices until it's already happening.", "charts": {"count": 1, "hot": false, "desc": "GS/DB chart on CTA positioning and projected flows — worth opening."}, "link": "https://www.zerohedge.com/the-market-ear/little-lower-could-become-lot-lower"}, {"id": 8, "cat": "credit", "urgency": "deep", "source": "The Market Ear (JPMorgan)", "title": "AI capex is now a bond market story, and the math is enormous", "idea": "JPM estimates ~$5.5tn of AI/data-center investment from 2026-2030, with only ~$1tn coming from organic hyperscaler cash generation. The rest: roughly $2.1tn through high-grade bonds, with the remainder funded via equity, structured markets, leveraged finance and alternative capital. Yet hyperscaler gross leverage is only ~1.6x — about half the broader IG universe — and actually fell quarter-over-quarter even as debt rose 92% YoY.", "angle": "The 'AI bubble' debate keeps happening in equity-multiple terms, but the real capacity constraint is whether the credit market can absorb $2tn+ of new high-grade hyperscaler paper over four years — that's the number to watch, not NVDA's P/E.", "tweetA": "$5.5 trillion of AI capex needed through 2030. Only $1 trillion comes from cash flow. $2.1 trillion has to come from high-grade bonds. The AI trade isn't just an equity story anymore — it's whether the IG bond market can absorb $2tn of hyperscaler paper without spreads blowing out.", "tweetB": "Hyperscaler leverage is 1.6x, about half the IG universe average, and debt is up 92% YoY. That's the setup for 'best credit in the market' right up until it's also the most crowded trade in the market. Worth pricing MSFT/META/GOOG credit against this math, not just their equity multiples.", "charts": {"count": 1, "hot": true, "desc": "JPM chart breaking down the $5.5tn AI capex funding stack by source — the single number worth a standalone save."}, "link": "https://www.zerohedge.com/the-market-ear/ais-55-trillion-funding-boom-colliding-5-treasuries"}, {"id": 9, "cat": "macro", "urgency": "watch", "source": "The Market Ear (Deutsche Bank / ECB research)", "title": "This summer's drought is next year's inflation print", "idea": "DB estimates a one-standard-deviation decline in soil moisture raises euro-area food prices roughly 0.5% after an 18-24 month lag. ECB's own work attributes about 0.7ppt of food inflation and 0.3ppt of headline inflation to the 2022 heatwave, materializing a full year later. Extreme heat also hits the power grid directly — cooling demand peaks exactly as drought cuts hydro output and warm rivers constrain nuclear cooling, pushing gas back in as the swing fuel.", "angle": "Climate-driven inflation runs on an 18-24 month lag most macro models don't price — this year's drought/heat data is a leading indicator for 2027-2028 European inflation prints and gas demand, not a today story.", "tweetA": "A drought today shows up as food inflation in 18-24 months, per DB's own model — the 2022 heatwave added 0.7ppt to food inflation a full year later. If you're modeling ECB terminal rate for 2027, you need this summer's soil-moisture data, not next month's CPI print.", "tweetB": "Extreme heat doesn't just raise cooling demand — it cuts hydro output and constrains nuclear cooling at the exact same moment, forcing gas back in as the swing fuel. Climate volatility is becoming a structural natural gas demand floor, not just a summer spike.", "charts": {"count": 1, "hot": false, "desc": "LSEG Workspace chart on weather-driven power system stress — worth opening."}, "link": "https://www.zerohedge.com/the-market-ear/too-cold-or-too-hot-europes-energy-crisis-now-year-round"}, {"id": 10, "cat": "macro", "urgency": "act now", "source": "The Dark Side of the Boom", "title": "The market just drew a line between who writes the AI cheques and who cashes them", "idea": "Nasdaq futures cratered after the Anthropic/OpenAI 'pace the frontier' weekend comments collided with a fresh oil shock (Saudi's East-West pipeline halt pushed Brent near $105, the 10-year briefly topped 5%). Semis fell nearly 6% at the lows while hyperscalers themselves outperformed — the market rewarding the AI capex payers over the AI capex supply chain, one of the sharpest software/hyperscaler-over-semis rotations on record (the same divergence Bespoke flagged independently today).", "angle": "The 'cheque writers vs. cheque cashers' framing is the cleanest lens on today's rotation, and it extends Bespoke's IGV/SOXX data point with the macro backdrop (oil + rates) that made it worse.", "tweetA": "Hyperscalers outperformed today. Their own supply chain (semis, optical, data-center hardware) got crushed. The market isn't derisking AI — it's derisking the companies most levered to capex continuing exactly as fast as it has been. Different trade entirely.", "tweetB": "10yr brushed 5%, Brent neared $105, and AI labs said 'slow down' — all in one session. None of these three things alone would move markets 4%+. Stacked together on a Monday before FOMC, they did. Correlation risk is the actual story here, not any single headline.", "charts": {"count": 0, "hot": false, "desc": "Narrative wrap, no embedded chart — worth opening for the full sector breakdown."}, "link": "https://thedarksideoftheboom.substack.com/p/market-wrap-ai-hits-the-brakes"}, {"id": 11, "cat": "AI/infra", "urgency": "deep", "source": "SemiAnalysis", "title": "Nvidia's own GTC slide undersold Rubin's real advantage by more than 2x", "idea": "Jensen's GTC 2026 slide claimed Rubin NVL72 delivers 3x performance/MW over Blackwell. SemiAnalysis's real-world AgentX benchmark, run on early pre-release software, already shows up to 7x better token throughput per megawatt, and models $159.5bn in annual revenue per GW for Rubin versus $114.9bn for the best GB300 config (39% more revenue, 42% more profit — ~$44.6bn/GW in extra modeled profit). SemiAnalysis notes Jensen did the identical undersell at GTC 2024: claimed 30x versus Hopper, measured 98x.", "angle": "If the pattern holds — Nvidia underselling its own roadmap by 2-3x at every GTC — this week's 'peak AI capex' fear is being priced against numbers that are structurally stale; the per-GW profit math argues for fighting harder over power allocation, not pausing.", "tweetA": "Jensen said Rubin does 3x performance/MW over Blackwell at GTC. SemiAnalysis's actual benchmarks show 7x, on pre-release software. He did the identical undersell at GTC 2024 — claimed 30x Hopper, real number was 98x. If this pattern holds, the 'AI capex is topping' debate is being had with 2-3x stale numbers.", "tweetB": "$44.6 billion of extra annual profit per gigawatt, Rubin vs. GB300. That's not a chip upgrade cycle — that's a reason to fight harder for power allocation, not slow down capex. The binding constraint was never chip supply. SemiAnalysis's own numbers say it's megawatts.", "charts": {"count": 1, "hot": true, "desc": "Extensive TCO/throughput-per-MW charts comparing Rubin, GB300, and MI355X across multiple engines — the profit-per-GW chart alone is a standalone tweet."}, "link": "https://newsletter.semianalysis.com/p/vera-rubin-nvl72-agentic-inference"}, {"id": 12, "cat": "positioning", "urgency": "deep", "source": "LordFed", "title": "Everyone was positioned for bad CPI. It came in hot. Nothing happened.", "idea": "Going into CPI, GS prime data showed investors adding shorts in macro products while simultaneously buying individual TMT names — a split, defensive stance. CPI printed hot, yet equities rallied and vol/skew got crushed, because too much of the market had already de-risked ahead of the number.", "angle": "A positioning read, not a fundamentals read, on why bad macro data keeps failing to break the market — the market didn't shrug off inflation, it had already paid for the insurance, which matters for how much further protection is worth buying into FOMC.", "tweetA": "Hot CPI. Vol got crushed, not bought. That's not the market shrugging off inflation — that's the market having already paid for the insurance. When everyone's already hedged for the bad outcome, the bad outcome doesn't sell off anything twice.", "tweetB": "The tell was in Goldman's prime book before CPI even printed: shorts going on in macro products, longs going on in single-name TMT. That's a market betting the macro print hurts indices, not stock-pickers' longs. It played out exactly that way.", "charts": {"count": 0, "hot": false, "desc": "No embedded chart; GS prime positioning data described in text."}, "link": "https://www.lordfed.co.uk/p/the-market-got-cheaper-while-you"}, {"id": 13, "cat": "geopolitics", "urgency": "act now", "source": "The Pressure Point (Fulcrum)", "title": "Iran isn't trying to close Hormuz anymore — it's disabling the exits around it", "idea": "Saudi Arabia's East-West pipeline, the main Hormuz bypass, has been shut since September 11 with no reopening timeline given — an uncertain reopening that functions as a de facto risk-off signal for insurers and schedulers even without a permanent closure. Simultaneously, Houthi forces have advanced toward Bab el-Mandeb, the other end of that bypass route. The US has narrowed tanker escort protection to just two specific daily windows through Hormuz, leaving the rest of the export chain — pipelines, terminals, pumping stations — unprotected.", "angle": "The framing shift — from 'will Hormuz close' to 'can any bypass survive' — is sharper than headline Brent moves; the explicit Sept 15 watch-list (pipeline reopening date, escort windows, Iran-Gulf talks) gives a concrete near-term catalyst calendar.", "tweetA": "Everyone's been asking 'will Iran close Hormuz.' Wrong question. They're disabling the bypass routes built specifically because Hormuz might close — the Saudi pipeline (no reopening date given) and now Bab el-Mandeb. A tanker can reroute. A pipeline can't.", "tweetB": "The US now only escorts Hormuz tankers during two specific windows a day. That protects the ships in the strait. It protects nothing between the Saudi oil fields and the Red Sea coast. The market is pricing a strait risk. The actual exposure is a network risk.", "charts": {"count": 0, "hot": false, "desc": "No charts in email — text-based geopolitical brief with a concrete near-term watch list."}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-the-bypass-is-now-the/"}, {"id": 14, "cat": "energy", "urgency": "act now", "source": "The Dark Side of the Boom", "title": "The Brent-WTI spread is the cleanest read on where the oil scarcity actually sits", "idea": "Crude gave back part of its move late Monday after Trump said Russia and Ukraine had agreed to avoid striking each other's energy infrastructure — but the widening Brent premium over WTI shows the international physical market, not the US-centric WTI benchmark, is carrying the real scarcity pressure. That means this is a global Gulf/Red Sea supply problem, not a US inventory story.", "angle": "Ties directly to the Pressure Point piece above (same event, different lens) — the Brent-WTI spread is a tradeable, real-time gauge of how much of the current oil risk premium is genuinely about the Hormuz/Red Sea network versus generic macro noise.", "tweetA": "Brent-WTI spread is blowing out, which is the market's way of saying: this is not a US supply story. WTI barely notices Hormuz. Brent is pricing almost nothing else right now. If you want a real-time gauge on the Gulf crisis, stop watching Brent alone and start watching the spread.", "tweetB": "One Trump headline about Russia-Ukraine energy targets clawed back part of today's oil spike. The Hormuz/Red Sea network risk did not move an inch. Two totally different risk premia are stacked in the same barrel right now, and only one of them just got resolved.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening for the Brent-WTI spread chart."}, "link": "https://thedarksideoftheboom.substack.com/p/oils-risk-premium-is-moving-beyond"}, {"id": 15, "cat": "macro", "urgency": "watch", "source": "Cameron Dawson (NewEdge Wealth) via Daily Chartbook", "title": "Financial conditions have nowhere to go but tighter into the Fed hike", "idea": "With the Fed reportedly on the verge of a hike, financial conditions are starting from an 'ultra-loose, ultra-easy' baseline, per Cameron Dawson — meaning there's little room left except to tighten from here.", "angle": "This is the macro backdrop that makes the CTA-selling, momentum-blowup, and AI-selloff items above all rhyme — conditions have been loose for so long that the marginal move, whatever triggers it, only has one direction left to go.", "tweetA": "Financial conditions are 'ultra-loose, ultra-easy' walking into a Fed hike, per Cameron Dawson. That's the setup where every other story this week — CTA selling, momentum blowups, AI derating — rhymes. There's no offsetting easy-conditions tailwind left to catch the market.", "tweetB": "Nobody's pricing conditions actually tightening this week — they're pricing an oil shock and an AI wobble as isolated events. They're not isolated. They're both landing on a financial-conditions backdrop that has zero slack left.", "charts": {"count": 1, "hot": true, "desc": "Financial conditions index chart — clean visual of the 'ultra-loose' starting point."}, "link": "https://www.dailychartbook.com/p/the-recent-pace-of-long-buying-in-us-tmt-is-the-largest-since-jun-25"}, {"id": 16, "cat": "energy", "urgency": "watch", "source": "Mandy Xu (Cboe) via Daily Chartbook", "title": "Oil is back near March highs. Oil vol isn't even close.", "idea": "Mandy Xu (Cboe) notes oil prices have surged back near their March/April highs, but the OVX (oil volatility index) is trading at just half the level it hit in March — a real divergence between spot price and options-implied fear.", "angle": "Directly contradicts the 'market is panicking about oil' narrative running through the other geopolitics/energy items — options markets aren't yet pricing the Hormuz-bypass escalation as seriously as the news flow suggests, which reads as either cheap convexity or a signal OVX is about to catch up violently.", "tweetA": "Oil is back at March highs. Oil vol is at half of March levels. Either the options market knows something the pipeline attacks don't, or OVX is about to catch up violently. Cheap convexity on an actual live supply-chain war is not a normal setup.", "tweetB": "Every energy newsletter this week is describing a supply-chain war spreading past Hormuz into pipelines and Bab el-Mandeb. The options market is pricing half the fear it priced in March for the same spot price. That gap doesn't usually stay open long.", "charts": {"count": 1, "hot": true, "desc": "Oil price vs. OVX chart — the price/vol divergence is visually obvious and worth saving."}, "link": "https://www.dailychartbook.com/p/the-recent-pace-of-long-buying-in-us-tmt-is-the-largest-since-jun-25"}, {"id": 17, "cat": "positioning", "urgency": "deep", "source": "Robbie Stankard (Goldman Sachs) via Daily Chartbook", "title": "A second data trail confirms it: fastest TMT long-buying pace in 15 months", "idea": "Same underlying GS prime data as the MarketEar item above, sourced independently via Daily Chartbook: hedge funds net bought US TMT (Info Tech + Comm Svcs) in 10 of the last 11 sessions, the largest 2-week pace of long buying since June 2025, 97th percentile on a 5-year lookback.", "angle": "Two independent newsletters citing the same GS desk data point within hours of each other is itself a signal — this stat is about to become consensus knowledge, which usually means the crowding risk, not the buying opportunity, is the more actionable read from here.", "tweetA": "This stat — HFs buying TMT at a 97th-percentile pace — is now in two separate newsletters in the same six hours. When a positioning extreme goes from 'desk data' to 'everyone's talking about it' this fast, the trade is closer to its end than its start.", "tweetB": "97th percentile of 5-year HF long-buying pace in TMT, in the same week AI labs said 'slow down' and oil spiked. Max crowding plus max headline risk is exactly how you get a violent one-day unwind, not a slow bleed.", "charts": {"count": 1, "hot": false, "desc": "GS chart on TMT long-buying pace — same underlying data as the MarketEar chart, different framing."}, "link": "https://www.dailychartbook.com/p/the-recent-pace-of-long-buying-in-us-tmt-is-the-largest-since-jun-25"}, {"id": 18, "cat": "macro", "urgency": "watch", "source": "Andrew Thrasher (Thrasher Analytics) via Daily Chartbook", "title": "The market's breadth cushion is basically gone", "idea": "The 90-day advance-decline line sits at just 252 — barely positive — meaning it wouldn't take much Mag 7 selling to pull the entire index down, per Andrew Thrasher.", "angle": "This is the structural vulnerability underneath every story in this window — with breadth this thin, the AI selloff, oil shock, and CTA-selling stories don't need to compound each other to hurt the index; any one landing on the Mag 7 alone does the job.", "tweetA": "90-day advance-decline line: 252. Barely positive. That means the index has almost no breadth cushion left — if the Mag 7 sneeze on an AI slowdown headline, there's nothing underneath to absorb it. This is the chart that explains why today felt disorderly.", "tweetB": "Forget bull/bear breadth debates. At an AD line this thin, the only question that matters is Mag 7 direction. Everything else — CTA flows, oil, CPI surprises — is noise layered on top of a market that is structurally one trade wide.", "charts": {"count": 1, "hot": true, "desc": "90-day advance-decline line chart — the thin-breadth story in one image."}, "link": "https://www.dailychartbook.com/p/the-recent-pace-of-long-buying-in-us-tmt-is-the-largest-since-jun-25"}, {"id": 19, "cat": "tech", "urgency": "watch", "source": "@warrenpies via Daily Chartbook", "title": "The AI productivity effect is already visible in software headcount economics", "idea": "S&P 1500 software revenue-per-employee has 'gone parabolic,' per Warren Pies — cited as the clearest real-economy evidence yet that AI is boosting productivity rather than just being a capex story.", "angle": "This directly counters this week's 'AI is overhyped/slowing' narrative with a hard operating metric — if revenue-per-employee is genuinely inflecting at the S&P 1500 level, that's a much harder data point to dismiss than sentiment about pacing frontier models.", "tweetA": "S&P 1500 software revenue-per-employee going parabolic is a far better 'AI is real' data point than any capex chart, because it's showing up in operating leverage, not spending. Bears arguing 'no ROI yet' now have to explain this chart away.", "tweetB": "Two contradictory AI stories are running simultaneously this week: labs saying 'slow down for safety' and software companies quietly generating record revenue per head. Only one of those is showing up in the actual income statement.", "charts": {"count": 1, "hot": false, "desc": "S&P 1500 software revenue-per-employee chart — worth opening."}, "link": "https://www.dailychartbook.com/p/the-recent-pace-of-long-buying-in-us-tmt-is-the-largest-since-jun-25"}];
const META = {"date": "2026-09-15", "time": "03:04 CEST", "windowStart": "2026-09-14 21:04 CEST", "windowEnd": "2026-09-15 03:04 CEST", "emailsInWindow": 14, "emailsRead": 14, "itemsExtracted": 19, "includedSources": [{"name": "Haymaker (Daniel Bustamante)", "count": 1}, {"name": "Rupak Ghose", "count": 1}, {"name": "McKinsey", "count": 1}, {"name": "Bespoke Investment Group", "count": 1}, {"name": "The Market Ear (Goldman Sachs)", "count": 2}, {"name": "The Market Ear (Goldman Sachs / Deutsche Bank)", "count": 1}, {"name": "The Market Ear (JPMorgan)", "count": 1}, {"name": "The Market Ear (Deutsche Bank / ECB research)", "count": 1}, {"name": "The Dark Side of the Boom", "count": 2}, {"name": "SemiAnalysis", "count": 1}, {"name": "LordFed", "count": 1}, {"name": "The Pressure Point (Fulcrum)", "count": 1}, {"name": "Cameron Dawson (NewEdge Wealth) via Daily Chartbook", "count": 1}, {"name": "Mandy Xu (Cboe) via Daily Chartbook", "count": 1}, {"name": "Robbie Stankard (Goldman Sachs) via Daily Chartbook", "count": 1}, {"name": "Andrew Thrasher (Thrasher Analytics) via Daily Chartbook", "count": 1}, {"name": "@warrenpies via Daily Chartbook", "count": 1}], "skippedSources": [{"name": "Norseman Market Timing (Portfolio Updates)", "reason": "Body was entirely screenshot-based portfolio holdings with zero descriptive text in the plaintext version — no extractable analytical content"}, {"name": "Substack live-video notice (Maggie Lake)", "reason": "Pure event notification — 'live now' announcement with zero sentences of content"}, {"name": "Tavi Costa (subscriber chat)", "reason": "Logistics-only chat post announcing a monthly Q&A call time — no analytical content"}]};
const CAT_COLORS = {"macro": "#e24b4a", "credit": "#378add", "positioning": "#ef9f27", "AI/infra": "#1d9e75", "crypto": "#7f77dd", "geopolitics": "#d85a30", "energy": "#f97316", "tech": "#06b6d4", "gold": "#d4a017", "culture": "#ec4899", "labor": "#8b5cf6", "regulation": "#64748b", "science": "#14b8a6", "venture": "#84cc16"};

let activeCat = 'all';
let activeUrg = 'all';
let activeSrc = null;

const urgencyEmoji = { "act now": "🔴", "deep": "🔵", "watch": "🟡" };

function headerSub() {
  document.getElementById('header-sub').textContent =
    META.date + ' \u00b7 ' + META.time + ' \u00b7 ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources';
}

function matchesFilters(item) {
  if (activeCat !== 'all' && item.cat !== activeCat) return false;
  if (activeUrg !== 'all' && item.urgency !== activeUrg) return false;
  if (activeSrc && item.source.indexOf(activeSrc) === -1) return false;
  return true;
}

function renderCards() {
  const container = document.getElementById('cards');
  container.innerHTML = '';
  ITEMS.forEach(function(item) {
    if (!matchesFilters(item)) return;
    const color = CAT_COLORS[item.cat] || '#999';
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + item.id;
    card.style.setProperty('--cat-color', color);

    const chartFlag = item.charts && (item.charts.count > 0 || item.charts.hot) ? '<span class="chart-flag">' + (item.charts.hot ? '🔥' : '📊') + '</span>' : '';

    const header = document.createElement('div');
    header.className = 'card-header';
    header.setAttribute('tabindex', '0');
    header.setAttribute('role', 'button');
    header.innerHTML =
      '<span class="idx">' + String(item.id).padStart(2, '0') + '</span>' +
      '<span>' + (urgencyEmoji[item.urgency] || '') + '</span>' +
      '<span class="badge" style="background:' + color + '">' + item.source + '</span>' +
      '<span class="cat-tag">' + item.cat + '</span>' +
      chartFlag +
      '<span class="title-text">' + item.title + '</span>';
    header.addEventListener('click', function() {
      card.classList.toggle('open');
    });
    header.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.classList.toggle('open'); }
    });

    const body = document.createElement('div');
    body.className = 'card-body';

    let chartsHtml = '';
    if (item.charts) {
      const hotClass = item.charts.hot ? ' hot' : '';
      const chartLabel = item.charts.hot ? '🔥 CHART WORTH SAVING' : (item.charts.count > 0 ? '📊 ' + item.charts.count + ' chart(s)' : '📊 No chart in email');
      chartsHtml = '<div class="chart-block' + hotClass + '"><strong>' + chartLabel + '</strong><br>' + item.charts.desc + '</div>';
    }

    body.innerHTML =
      '<div class="section-label">The Idea</div>' +
      '<div class="idea-text">' + item.idea + '</div>' +
      '<div class="section-label">My Angle</div>' +
      '<div class="angle-box">' + item.angle + '</div>' +
      '<div class="tweets">' +
        '<div class="tweet-box"><span class="tweet-label-a">TWEET A</span><div class="tweet-text">' + item.tweetA + '</div>' +
          '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>' +
        '<div class="tweet-box"><span class="tweet-label-b">TWEET B</span><div class="tweet-text">' + item.tweetB + '</div>' +
          '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>' +
      '</div>' +
      chartsHtml +
      '<a class="read-link" href="' + item.link + '" target="_blank">\u2197 Read full article</a>';

    card.appendChild(header);
    card.appendChild(body);
    container.appendChild(card);
  });
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '\u2713 Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function filterBySrc(name) {
  activeSrc = name;
  activeCat = 'all';
  activeUrg = 'all';
  document.querySelectorAll('.cat-pill').forEach(function(p) { p.classList.toggle('active', p.dataset.cat === 'all'); });
  document.querySelectorAll('.urg-pill').forEach(function(p) { p.classList.toggle('active', p.dataset.urg === 'all'); });
  renderCards();
  document.querySelectorAll('.card').forEach(function(c) { c.classList.add('open'); });
  window.scrollTo({top: 0, behavior: 'smooth'});
}

document.getElementById('cat-filters').addEventListener('click', function(e) {
  if (!e.target.classList.contains('cat-pill')) return;
  activeSrc = null;
  activeCat = e.target.dataset.cat;
  document.querySelectorAll('.cat-pill').forEach(function(p) { p.classList.toggle('active', p === e.target); });
  renderCards();
});

document.getElementById('urg-filters').addEventListener('click', function(e) {
  if (!e.target.classList.contains('urg-pill')) return;
  activeSrc = null;
  activeUrg = e.target.dataset.urg;
  document.querySelectorAll('.urg-pill').forEach(function(p) { p.classList.toggle('active', p === e.target); });
  renderCards();
});

function renderReport() {
  var html = '';
  html += '<p><strong>Time window:</strong> ' + META.windowStart + ' \u2013 ' + META.windowEnd + '</p>';
  html += '<p>' + META.emailsInWindow + ' emails in window, ' + META.emailsRead + ' read, ' + META.itemsExtracted + ' items extracted.</p>';
  html += '<p><strong>Included sources:</strong></p><ul>';
  META.includedSources.forEach(function(s) {
    html += '<li><button class="src-pill" onclick="filterBySrc(\'' + s.name.replace(/'/g, "\\'") + '\')">' + s.name + '</button> (' + s.count + ')</li>';
  });
  html += '</ul>';
  html += '<p><strong>Skipped sources:</strong></p><ul>';
  META.skippedSources.forEach(function(s) {
    html += '<li>' + s.name + ' \u2014 ' + s.reason + '</li>';
  });
  html += '</ul>';
  document.getElementById('report-body').innerHTML = html;
}

headerSub();
renderCards();
renderReport();
</script>
