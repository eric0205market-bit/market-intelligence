<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-08-11T05:23:22Z", "input_stats": {"total_tweets": 209, "unique_authors": 71, "tweets_with_images": 39, "after_noise_filter": 68}, "summary": "**Robotics bull run in focus:** Unitree's Shanghai IPO drew reported oversubscription of 5,526x-8,000x from retail (**Bluntz_Capital**, **aleabitoreddit**), while **aleabitoreddit** flagged Riot Platforms' $9.1B Anthropic colo deal (possible $16.1B/20yr extension) and an expanded AMD option; the All-In Podcast's guests (Boston Dynamics, ANYbotics CEOs) said Chinese humanoid robots should be barred from the US on data-security grounds.\n\n**Bitcoin bottom debate:** **alpha_pls** listed signals already firing (miner capitulation, difficulty -18.5%, sub-200W MA) with two still missing; **Evan_ss6** countered that consensus ($45-60k) could be wrong and the real bottom is $12k; **DonAlt**, **MoonOverlord** and **krugermacro** all flagged Saylor/Strategy's continued BTC selling as bearish for MSTR/STRC.\n\n**AI economics:** **cryptopunk7213** mapped Google's Anthropic stake (14-17%, from $300M/2023 to a reported $350B valuation in 2026) alongside Meta's open-weight Muse models and Intel's raise upsized to $20B against $100B+ demand; **RaoulGMI** argued Anthropic's revenue growth is now outpacing Metcalfe's Law; **elerianm** and **munster_gene** both flagged that AI capex scale ($500B+ benchmarks) is still underappreciated by markets.\n\n**Crypto/DeFi:** **0xQuit** and **CirrusNFT** covered the FWAPHouse launch (pooled NFT/ETH recycler on FWA, ~75% APY target); **Delphi_Digital** detailed Hyperliquid's HYPE buyback expansion via HIP-3/HIP-4; **sjdedic** and **Bluntz_Capital** both cited Whatnot's new $545M raise at a $20B valuation as validation for onchain/gamified-commerce theses.\n\n**Macro:** **dampedspring** pushed back on the popular read that Treasury's QRA language change signals fewer coupon auctions, warning of DXY downside if issuance really is cut; **MelMattison1** expects Wednesday's CPI to shock yields lower and frames gold as signaling fiscal dominance; **dgt10011** outlined the ingredients needed to time a financial crisis, warning about warehousing risk.\n\n**Notable:** Anthropic's unreleased Claude model made progress on the Riemann hypothesis, drawing reactions from **Crypto_McKenna**, **nic_carter** and **cryptopunk7213**; Anthropic's new invisible text watermarking drew a workaround pitch from **paulg** and an explainer from **hosseeb**.", "sections": {"A_events": [{"cluster": "Robotics Bull Run — Unitree IPO Oversubscribed, Anthropic Datacenter Deals Land", "category": ["tech", "AI", "positioning"], "items": [{"author": "Geiger_Capital", "summary": "Flagged that \"no one is ready for the Robotics bull run,\" sharing a chart as the thesis kicks off a wave of similar reactions across the day.", "tweet_url": "https://x.com/Geiger_Capital/status/2086971866304987148", "images": ["https://pbs.twimg.com/media/HPZp2icWkAAouIn.jpg"], "type": "tweet"}, {"author": "Bluntz_Capital", "summary": "Reacting to news that Unitree's Shanghai IPO was 5,526x oversubscribed by retail, calls it confirmation the robotics bull run \"is going to be glorious.\"", "tweet_url": "https://x.com/Bluntz_Capital/status/2086965264500031559", "type": "tweet"}, {"author": "aleabitoreddit", "summary": "Reports Riot Platforms' $9.1B deal with Anthropic (possible extension to $16.1B over 20 years targeting Dec 2027 for the first 96MW) plus AMD exercising an option to expand its existing Riot deal (full 50MW by May 2027); estimates ~$455M in contracted annual revenue and flags 2028's bitcoin halving as a second catalyst for dual-exposure miners like IREN. Explicitly discloses no personal RIOT position.", "tweet_url": "https://x.com/aleabitoreddit/status/2086988264448409739", "images": ["https://pbs.twimg.com/media/HPZ4w07awAAFTPQ.jpg", "https://pbs.twimg.com/media/HPZ4w1AbEAAJTnW.jpg", "https://pbs.twimg.com/media/HPZ4w09aUAAW uit/0xOnward may be building a follow-up that pairs a \"zombie cryptopunk\" NFT with 400+ pooled ETH inside FWA within the coming week; discloses holding 80% of the FWA tokens farmed so far.", "tweet_url": "https://x.com/CirrusNFT/status/2087019222081917311", "images": ["https://pbs.twimg.com/media/HPaUhMdaYAAq9A9.png"], "type": "thread"}]}, {"cluster": "Bitcoin Bottom Debate — Cycle Signals vs. Saylor Selloff", "category": ["crypto", "positioning"], "items": [{"author": "alpha_pls", "summary": "Lists bottom signals already triggered: DAT unwind, no CME basis trade left, miner capitulation (difficulty down 18.5%, largest since the 2021 China mining ban), Saylor forced to sell BTC as STRC depegs, price below the 200-week MA, 17% below the prior cycle ATH, and weekly RSI oversold with a higher low. Says a final capitulation-volume event and a revisit of the ~$54k realized price are still missing — \"we are close.\"", "tweet_url": "https://x.com/alpha_pls/status/2086911921115070768", "type": "tweet"}, {"author": "Evan_ss6", "summary": "Pushes back on the widespread CT consensus that BTC bottoms between $45-60k, arguing \"imagine if CT is wrong again\" and the real bottom is $12k — the scenario where the 4-year cycle inverts, topping in Q4 and grinding down for three years. Says he'd short gold in that world.", "tweet_url": "https://x.com/Evan_ss6/status/2086957705546117140", "images": ["https://pbs.twimg.com/media/HPZc-ToW8AAceqD.jpg"], "type": "thread"}, {"author": "DonAlt", "summary": "Responding to news Strategy sold another 1,690 BTC (down to 840,447 held), says \"Saylor buys the top sells the bottom\" and mocks holders who still defend him.", "tweet_url": "https://x.com/DonAlt/status/2086957186664849700", "type": "tweet"}, {"author": "MoonOverlord", "summary": "Complementary jab at the same news: Saylor \"blasted the hell out of bitcoin\" buying near the $127k top and is now selling near $65k.", "tweet_url": "https://x.com/MoonOverlord/status/2086935963108819176", "type": "tweet"}, {"author": "krugermacro", "summary": "Offers a more analytical read of the same selling: Saylor is deleveraging marginally to prop STRC back toward par, with the intent to relever in Q4 if the 4-year cycle thesis plays out.", "tweet_url": "https://x.com/krugermacro/status/2086879186413887934", "type": "tweet"}, {"author": "jvisserlabs", "summary": "Separately (via a quoted thread) flagged BTC's 200-day moving average as the level to watch — a break above it, in his view, opens the floodgates for the next leg of the debt-driven bitcoin wave, offering a bullish counterweight to the bottom-signal chasing above.", "tweet_url": "https://x.com/jvisserlabs/status/2086877586320154658", "type": "tweet"}]}, {"cluster": "Anthropic's Claude Advances on the Riemann Hypothesis", "category": ["AI"], "items": [{"author": "Crypto_McKenna", "summary": "Reacting to Anthropic's announcement that an unreleased Claude research model raised the lower bound on the fraction of Riemann zeta zeros satisfying the hypothesis, declares \"we sit upon the event horizon of the Singularity\" — while arguing pure math still needs human-verifiable proofs and predicting labs will eventually run humanoids 24/7 to test hypotheses experimentally.", "tweet_url": "https://x.com/Crypto_McKenna/status/2086969397273628776", "type": "thread"}, {"author": "nic_carter", "summary": "Shares an image reacting to the same news with \"this is how cutting edge mathematical research works now\" — a wry nod to AI now contributing to frontier pure-math problems.", "tweet_url": "https://x.com/nic_carter/status/2086876945422164471", "images": ["https://pbs.twimg.com/media/HPYTbj9WUAAPc4N.jpg"], "type": "tweet"}, {"author": "cryptopunk7213", "summary": "More skeptical take on the same story, asking Anthropic pointedly whether they told the model to \"find a solution by any means necessary.\"", "tweet_url": "https://x.com/cryptopunk7213/status/2086873374102319582", "type": "tweet"}]}, {"cluster": "Claude's New Invisible Watermarking Sparks a Workaround Pitch", "category": ["AI", "tech"], "items": [{"author": "hosseeb", "summary": "Notes Anthropic will embed invisible watermarks in all Claude-generated text that travel with copy-pasted content and can persist through some editing; shares a Scott Aaronson talk explaining how LLM text watermarking algorithms work, and predicts the feature will \"catch the stupid/lazy\" since no watermark survives a full rewrite.", "tweet_url": "https://x.com/hosseeb/status/2086955680704147522", "type": "thread"}, {"author": "paulg", "summary": "Responding to the same news, floats a startup idea: a tool that rephrases AI output to preserve meaning while stripping watermarks, calling it a good \"beachhead\" product that inserts itself into the flow of people's AI use before expanding into other capabilities.", "tweet_url": "https://x.com/paulg/status/2086924675163345285", "type": "thread"}]}, {"cluster": "AI Capex Scale Still Underappreciated", "category": ["AI", "macro"], "items": [{"author": "elerianm", "summary": "Asks whether $500 billion will become the new benchmark figure in AI infrastructure spend, noting the numbers in the space keep reaching \"once unthinkable\" levels.", "tweet_url": "https://x.com/elerianm/status/2086923880992575894", "images": ["https://pbs.twimg.com/media/HPY924ZXwAE1haa.jpg"], "type": "tweet"}, {"author": "munster_gene", "summary": "Points to a CNBC segment arguing tech investors are still not appreciating how early markets are in the AI buildout cycle.", "tweet_url": "https://x.com/munster_gene/status/2086935183920435237", "urls": ["https://www.cnbc.com/video/2026/08/10/deepwaters-gene-munster-tech-investors-not-appreciating-how-early-we-are-into-ai-buildout.html"], "type": "tweet"}]}, {"cluster": "Bernie Sanders' AI Pause Letter Draws Pushback", "category": ["AI", "regulation"], "items": [{"author": "garrytan", "summary": "Reacting to news that Bernie Sanders sent letters to Sam Altman, Dario Amodei and Mark Zuckerberg urging an immediate pause on AI development (warning the Senate will act otherwise), sardonically asks \"are they going to send this to China too?\"", "tweet_url": "https://x.com/garrytan/status/2087015462014197906", "type": "tweet"}]}, {"cluster": "Whatnot's $20B Raise Validates \"Gamified Commerce\" Thesis", "category": ["tech", "positioning"], "items": [{"author": "sjdedic", "summary": "Whatnot closed a $545M round at a $20B valuation — almost double the $11.5B mark from last October — citing 650,000 new weekly users, GMV already ahead of all of 2025's $8B, and buyers more than doubling YoY. Argues onchain collectibles platforms are betting on making the same massive market \"10x better\" right as it enters hypergrowth, calling it \"decacorn potential.\"", "tweet_url": "https://x.com/sjdedic/status/2086897197111488672", "images": ["https://pbs.twimg.com/media/HPYl8JzXsAAFnFB.jpg"], "type": "thread"}, {"author": "Bluntz_Capital", "summary": "Draws the same parallel independently: the 2021 NFT boom was \"the internet stocks of 2000\" — frothy with a few survivors — and what's happening now with gamified commerce (citing Whatnot scaling to $20B) plus onchain platforms building the next layer is the part that actually sticks, the use case the market thought it was buying in 2021.", "tweet_url": "https://x.com/Bluntz_Capital/status/2086907203529867388", "type": "tweet"}]}, {"cluster": "Treasury QRA Language Change & Yen Intervention — Macro Read", "category": ["macro"], "items": [{"author": "dampedspring", "summary": "Argues the Treasury is choosing to protect the long-term bond market (suppress rates) over defending the currency, a tradeoff he described over a year ago; without addressing root debt problems, he says the U.S. can't protect both money forms indefinitely, citing Japan as the template. Explicitly disagrees with the popular read that the recent QRA language change signals falling coupon auctions ahead — calls that a \"wild goose chase\" pushed by those wanting to pump gold and stocks, since aggregate issuance has almost no room to fall. Warns that if coupon auctions really are cut in November or during 2027, it signals capitulation on the dollar and could send DXY into the 80s.", "tweet_url": "https://x.com/dampedspring/status/2086934499015713129", "images": ["https://pbs.twimg.com/media/HPZH3QOXQAAqdlK.jpg", "https://pbs.twimg.com/media/HPZH3QPXIAA5n3E.jpg"], "type": "thread"}]}, {"cluster": "Singapore Lifts 2026 Growth Forecast on AI-Driven Chip Demand", "category": ["macro", "EM"], "items": [{"author": "zeroxkyle", "summary": "Reacting (with the Singaporean national anthem's lyrics) to news that Singapore raised its 2026 GDP growth estimate to 4.5-5.5% from 2-4%, on the back of accelerating global AI capex boosting the electronics and precision-engineering clusters, particularly AI-related semiconductor demand.", "tweet_url": "https://x.com/zeroxkyle/status/2087022947395645466", "type": "tweet"}]}], "B_insights": [{"author": "RaoulGMI", "summary": "Traces today's affordability squeeze — expensive housing, stalled retirements — back to WW2-era demographics: the baby boomer generation was the largest cohort in history, and their retirement now collides with a shrinking workforce, stalling GDP growth and forcing governments to borrow and print more. His \"Everything Code\" framework maps demographics -> debt -> currency debasement as the structural reason retirement plans built on old assumptions no longer hold.", "tweet_url": "https://x.com/RaoulGMI/status/2086879605160399255", "type": "thread"}, {"author": "RaoulGMI", "summary": "Argues AI will be smarter than all of us within the next year, citing Anthropic's revenue as the fastest-growing line of any company in history — scaling \"beyond Metcalfe's Law into Reed's Law.\" Frames this as evidence the Exponential Age is bending into what he calls the \"Economic Singularity,\" where intelligence compounds and capital reallocates faster than humans can // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
