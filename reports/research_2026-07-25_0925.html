const META = {
  date: "2026-07-25",
  time: "09:25 CEST",
  windowStart: "2026-07-25 03:04 CEST",
  windowEnd: "2026-07-25 09:04 CEST",
  emailsInWindow: 6,
  emailsRead: 6,
  itemsExtracted: 21,
  includedSources: [
    { name: "The Dark Side of the Boom", emails: 2, items: 4 },
    { name: "Michael Parekh (AI-RTZ)", emails: 1, items: 4 },
    { name: "PEquityResearch", emails: 1, items: 4 },
    { name: "Princeton Chen (Daily News Wall)", emails: 1, items: 9 }
  ],
  skippedSources: [
    { name: "Norseman Market Timing", reason: "Portfolio update delivered as screenshots — plaintext body contains only generic boilerplate describing the two funds' structure, no extractable data or thesis." }
  ]
};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function catColor(cat){ return CATCOLORS[cat] || "#888"; }
function urgEmoji(u){ return u === "act" ? "🔴" : (u === "watch" ? "🟡" : "🔵"); }
function urgLabel(u){ return u === "act" ? "Act Now" : (u === "watch" ? "Watch" : "Deep"); }

function buildFilterBars(){
  const cats = {};
  ITEMS.forEach(i => { cats[i.cat] = (cats[i.cat]||0) + 1; });
  const catBar = document.getElementById("catBar");
  let html = '<button class="pill' + (activeCat==="all"?" active":"") + '" style="' + (activeCat==="all"?"background:#333;":"") + '" onclick="setCat(\'all\')">All (' + ITEMS.length + ')</button>';
  Object.keys(cats).sort().forEach(c => {
    const on = activeCat === c;
    html += '<button class="pill' + (on?" active":"") + '" style="' + (on?"background:"+catColor(c)+";":"") + '" onclick="setCat(\'' + c + '\')">' + c + ' (' + cats[c] + ')</button>';
  });
  catBar.innerHTML = html;

  const urgs = { act:0, deep:0, watch:0 };
  ITEMS.forEach(i => { urgs[i.urgency] = (urgs[i.urgency]||0) + 1; });
  const urgBar = document.getElementById("urgBar");
  let uhtml = '<button class="pill' + (activeUrg==="all"?" active":"") + '" style="' + (activeUrg==="all"?"background:#333;":"") + '" onclick="setUrg(\'all\')">All (' + ITEMS.length + ')</button>';
  uhtml += '<button class="pill' + (activeUrg==="act"?" active":"") + '" style="' + (activeUrg==="act"?"background:#e24b4a;":"") + '" onclick="setUrg(\'act\')">🔴 Act Now (' + urgs.act + ')</button>';
  uhtml += '<button class="pill' + (activeUrg==="deep"?" active":"") + '" style="' + (activeUrg==="deep"?"background:#378add;":"") + '" onclick="setUrg(\'deep\')">🔵 Deep (' + urgs.deep + ')</button>';
  uhtml += '<button class="pill' + (activeUrg==="watch"?" active":"") + '" style="' + (activeUrg==="watch"?"background:#ef9f27;":"") + '" onclick="setUrg(\'watch\')">🟡 Watch (' + urgs.watch + ')</button>';
  urgBar.innerHTML = uhtml;
}

function setCat(c){ activeCat = c; activeSrc = null; render(); }
function setUrg(u){ activeUrg = u; activeSrc = null; render(); }
function filterBySrc(name){
  activeSrc = name;
  activeCat = "all";
  activeUrg = "all";
  render(true);
}

function render(expandMatched){
  buildFilterBars();
  const cards = document.getElementById("cards");
  let html = "";
  ITEMS.forEach(item => {
    let visible = true;
    if(activeCat !== "all" && item.cat !== activeCat) visible = false;
    if(activeUrg !== "all" && item.urgency !== activeUrg) visible = false;
    if(activeSrc && item.source.indexOf(activeSrc) === -1) visible = false;
    if(!visible) return;
    const cc = catColor(item.cat);
    const openClass = (activeSrc && expandMatched) ? " open" : "";
    html += '<div class="card' + openClass + '" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">' + String(item.id).padStart(2,'0') + '</span>';
    html += '<span class="urg">' + urgEmoji(item.urgency) + '</span>';
    html += '<span class="badge" style="background:' + cc + '">' + item.source + '</span>';
    html += '<span class="cattag">' + item.cat + '</span>';
    if(item.charts.count > 0 || item.charts.hot || item.charts.desc) html += '<span class="chartflag">' + (item.charts.hot ? '🔥' : '📊') + '</span>';
    html += '<span class="title">' + item.title + '</span>';
    html += '<span class="chev">▸</span>';
    html += '</div>';
    html += '<div class="card-body">';
    html += '<div class="section-label">The Idea</div><div class="idea">' + item.idea + '</div>';
    html += '<div class="section-label">My Angle</div><div class="angle" style="--catcolor:' + cc + '">' + item.angle + '</div>';
    html += '<div class="section-label">Tweets</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet"><div class="tweet-head"><span class="tweet-label a">TWEET A</span><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div><div class="tweet-text">' + item.tweetA + '</div></div>';
    html += '<div class="tweet"><div class="tweet-head"><span class="tweet-label b">TWEET B</span><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div><div class="tweet-text">' + item.tweetB + '</div></div>';
    html += '</div>';
    if(item.charts.desc){
      html += '<div class="charts-row' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '🔥 CHART WORTH SAVING — ' : '📊 ') + item.charts.desc + '</div>';
    }
    html += '<div class="link-row"><a href="' + item.link + '" target="_blank">↗ Read full article</a></div>';
    html += '</div></div>';
  });
  if(html === "") html = '<div style="color:#999; padding:20px; text-align:center;">No items match this filter.</div>';
  cards.innerHTML = html;
  buildReport();
}

function toggleCard(id){
  document.getElementById('card-' + id).classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function buildReport(){
  const body = document.getElementById("reportBody");
  let html = "";
  html += '<p><strong>Window:</strong> ' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</p>';
  html += '<p><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp;|&nbsp; <strong>Emails read:</strong> ' + META.emailsRead + ' &nbsp;|&nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</p>';
  html += '<h4>Included Sources</h4><ul>';
  META.includedSources.forEach(s => {
    html += '<li><span class="src-item" onclick="filterBySrc(\'' + s.name.replace(/'/g, "\\'") + '\')">' + s.name + '</span> — ' + s.emails + ' email(s), ' + s.items + ' item(s)</li>';
  });
  html += '</ul>';
  html += '<h4>Skipped Sources</h4><ul>';
  META.skippedSources.forEach(s => {
    html += '<li class="skip-item">' + s.name + ' — ' + s.reason + '</li>';
  });
  html += '</ul>';
  body.innerHTML = html;
}

document.getElementById("metaLine").textContent = META.date + " · " + META.time + " · " + META.itemsExtracted + " items";
render();
</script>
