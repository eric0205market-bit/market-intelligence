  html += '<div class="tweets">';
  html += '<div class="tweet-box"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + esc(item.tweetA) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  html += '<div class="tweet-box"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + esc(item.tweetB) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
  html += '</div>';

  if(item.charts){
    html += '<div class="chart-box' + (item.charts.hot ? ' hot' : '') + '">';
    html += (item.charts.hot ? '🔥 CHART WORTH SAVING — ' : '📊 ') + esc(item.charts.desc || '');
    html += '</div>';
  }

  html += '<div class="link-row"><a href="' + esc(item.link) + '" target="_blank" rel="noopener">↗ Read full article</a></div>';
  html += '</div></div>';
  return html;
}

function renderCards(){
  var container = document.getElementById('cards');
  var filtered = ITEMS.filter(function(i){
    if(activeSrc){ return i.source.indexOf(activeSrc) !== -1; }
    var catOk = activeCat === "all" || i.cat === activeCat;
    var urgOk = activeUrg === "all" || i.urgency === activeUrg;
    return catOk && urgOk;
  });
  container.innerHTML = filtered.map(cardHtml).join('');
  if(activeSrc){
    filtered.forEach(function(i){
      var el = document.getElementById('card-' + i.id);
      if(el) el.classList.add('open');
    });
  }
}

function renderReport(){
  document.getElementById('headerMeta').textContent =
    META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails';

  var html = '';
  html += '<p><strong>Window:</strong> ' + esc(META.windowStart) + ' → ' + esc(META.windowEnd) + '. Emails outside this window were not processed.</p>';
  html += '<p><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp;|&nbsp; <strong>Emails read:</strong> ' + META.emailsRead + ' &nbsp;|&nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</p>';

  html += '<h4>Included Sources</h4><p>';
  html += META.includedSources.map(function(s){
    return '<span class="src-link" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + esc(s.name) + '</span> (' + s.count + ')';
  }).join(' &nbsp;·&nbsp; ');
  html += '</p>';

  html += '<h4>Skipped Sources</h4><p>' + (META.skippedSources.length ? META.skippedSources.map(function(s){ return esc(s.name) + ' — ' + esc(s.reason); }).join('; ') : 'None — every email in the window contained substantive content and was included.') + '</p>';

  document.getElementById('reportBody').innerHTML = html;
}

function init(){
  renderReport();
  renderFilters();
  renderCards();
}
init();
</script>
</body>
</html>
