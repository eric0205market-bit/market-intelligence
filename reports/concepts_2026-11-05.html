nd $100 billion.", "speaker": "Aswath Damodaran", "type": "data_point", "entities": ["Anthropic"], "conviction": "medium", "so_what": "Anchor for IPO pricing debates; his value sits near the low end of offering estimates.", "quote": null, "locator": "The IPO Valuation", "quote_verified": false}, {"claim": "The single most critical and fragile input is target revenue of about $1 trillion in ten years; if it fails, lower growth would push down margins, create idle compute and raise failure risk, so errors in other inputs would compound in the same direction.", "speaker": "Aswath Damodaran", "type": "causal", "entities": ["Anthropic", "Amazon", "Walmart"], "conviction": "high", "so_what": "Revenue trajectory, not discount rate, is what to debate and monitor.", "quote": "it is my estimate of the target revenues for Anthropic", "locator": "Value Drivers", "quote_verified": true}, {"claim": "Founder-controlled governance (public benefit corporation plus voting-share structure) is a red flag because setbacks require outsiders who can push management to change course.", "speaker": "Aswath Damodaran", "type": "thesis", "entities": ["Anthropic", "public benefit corporation"], "conviction": "medium", "so_what": "Governance discount risk for the IPO.", "quote": null, "locator": "Value Drivers", "quote_verified": false}, {"claim": "He assumes a 32.5% target operating margin before the regulatory haircut and argues AI will not fully commoditize because stickiness, such as Claude agents combined with client data, can preserve pricing power.", "speaker": "Aswath Damodaran", "type": "thesis", "entities": ["Anthropic", "Claude"], "conviction": "medium", "so_what": "Moat thesis rests on workflow/data lock-in rather than model quality alone.", "quote": null, "locator": "Value Drivers", "quote_verified": false}, {"claim": "Data-center build-out is getting harder as local communities push back and politicians find opposing it a net vote winner, threatening the smooth compute expansion in his story.", "speaker": "Aswath Damodaran", "type": "causal", "entities": ["Anthropic", "data centers"], "conviction": "medium", "so_what": "Local opposition is a physical constraint on AI revenue growth.", "quote": null, "locator": "Value Drivers", "quote_verified": false}, {"claim": "He values Anthropic's contractual compute commitments at just over $450B (PV about $373B), against outside estimates of $400-800B, with only about $70B due next year and $76B the year after versus a $114B cash balance expected to exceed $200B post-IPO.", "speaker": "Aswath Damodaran", "type": "data_point", "entities": ["Anthropic"], "conviction": "medium", "so_what": "Near-term default risk is low; disclosure of commitment timing remains a gap.", "quote": null, "locator": "The IPO Valuation / The Cost of Debt", "quote_verified": false}, {"claim": "He builds in a 10% failure risk separately from the cost of capital, estimating a BB+ rating, and says a reader worried about default should move failure risk, not the discount rate; jamming it into cost of capital would require roughly 11%.", "speaker": "Aswath Damodaran", "type": "framework", "entities": ["Anthropic", "CoreWeave"], "conviction": "high", "so_what": "Separate going-concern discount rate from failure probability.", "quote": null, "locator": "The Cost of Debt", "quote_verified": false}, {"claim": "Regulatory risk worries him most as a place he could be wrong, since one election could bring onerous AI rules that cut revenue and profits rather than a small slice of operating profit.", "speaker": "Aswath Damodaran", "type": "thesis", "entities": ["Anthropic", "AI regulation"], "conviction": "medium", "so_what": "Political event risk for AI valuations.", "quote": null, "locator": "Value Drivers", "quote_verified": false}, {"claim": "Crowd inputs in his shared sheet put the average Anthropic value nearer $1 trillion than $1.5 trillion, with more respondents saying he overvalued, and the top stated reason (excluding 'worth nothing') was a cost of capital that is too low.", "speaker": "Aswath Damodaran", "type": "data_point", "entities": ["Anthropic"], "conviction": "medium", "so_what": "Sentiment check: consensus skeptical of his number.", "quote": null, "locator": "Keeping the feedback loop open", "quote_verified": false}]}, {"theme": "Cost of capital is bounded by reality", "insights": [{"claim": "The average US equity return was 8.74% (2001-25), 11.92% (1976-2025) and 10.13% (1928-2025), and the premium over 10-year Treasuries was 5.5-5.75%, implying about 10.4-10.65% cost of equity at a 4.9% T-bond on October 26, 2026.", "speaker": "Aswath Damodaran", "type": "data_point", "entities": ["US equities", "10-year Treasury"], "conviction": "high", "so_what": "Historical ceiling for cost of equity assumptions.", "quote": null, "locator": "a. History", "quote_verified": false}, {"claim": "The market-implied expected return on US equities at the start of October 2026 was 8.99%, model-agnostic, and has not exceeded 10% since 1994.", "speaker": "Aswath Damodaran", "type": "data_point", "entities": ["S&P 500", "US equities"], "conviction": "high", "so_what": "Claiming 12-15% for a typical firm is not possible in this market.", "quote": "borders on the delusional", "locator": "b. Market-Implied", "quote_verified": true}, {"claim": "A 15% cost of equity with ~5% nominal growth and ~20% ROE implies a P/E of about 7.5 versus an actual forward P/E near 20, so insisting on a 15% cost of equity is inconsistent with accepting current valuations.", "speaker": "Aswath Damodaran", "type": "causal", "entities": ["US equities", "P/E ratio"], "conviction": "high", "so_what": "Use multiples as a consistency test for discount rates.", "quote": null, "locator": "c. A Pricing Perspective", "quote_verified": false}, {"claim": "In technology, 80% of firms have costs of equity between 9.88% and 14.49% and costs of capital between 9.02% and 12.27%, so the range of reasonable discount rates is narrow.", "speaker": "Aswath Damodaran", "type": "data_point", "entities": ["technology sector"], "conviction": "medium", "so_what": "Don't over-engineer the discount rate; it won't move value much.", "quote": null, "locator": "Cost of Capital - The Cross Section", "quote_verified": false}, {"claim": "Cost of capital should rise by differential inflation plus country risk premium for other currencies: about +4.26% for India (median Indian company ~12.05% in rupees) and a median Swiss company around 5.85%.", "speaker": "Aswath Damodaran", "type": "data_point", "entities": ["India", "Switzerland"], "conviction": "medium", "so_what": "Currency and country adjustments for non-US valuations.", "quote": null, "locator": "Cost of Capital - The Cross Section", "quote_verified": false}, {"claim": "Pushing Anthropic to a 90th-percentile tech cost of capital of 12% requires setting failure risk to 0% and changing the rate over time as the company scales.", "speaker": "Aswath Damodaran", "type": "framework", "entities": ["Anthropic"], "conviction": "medium", "so_what": "Avoid double-counting failure risk.", "quote": null, "locator": "Cost of Capital - The Cross Section", "quote_verified": false}]}, {"theme": "Hurdle-rate delusions of professional investors", "insights": [{"claim": "VC and PE target returns of 20-50% are fiction: Cambridge Associates data show actual VC and PE returns lag public equity indices over long periods and are far below stated targets.", "speaker": "Aswath Damodaran", "type": "contrarian", "entities": ["venture capital", "private equity", "Cambridge Associates"], "conviction": "high", "so_what": "Discount manager return pitches; compare with index returns.", "quote": null, "locator": "Professional Investors", "quote_verified": false}, {"claim": "Promising excessive target returns pushes active investors to chase ten- or hundred-baggers and overreach on risk, and the inflated targets feed back into how much founders must give up for capital.", "speaker": "Aswath Damodaran", "type": "causal", "entities": ["venture capital", "private equity"], "conviction": "medium", "so_what": "Return promises distort behavior and terms.", "quote": null, "locator": "Professional Investors", "quote_verified": false}, {"claim": "Corporate hurdle rates are often set 2-3% above market-justified levels; this leads managers to inflate cash-flow forecasts, which pushes hurdle rates higher in turn, until both become fictional.", "speaker": "Aswath Damodaran", "type": "causal", "entities": ["CFOs", "hurdle rates"], "conviction": "medium", "so_what": "Overstated hurdle rates cause underinvestment as companies mature.", "quote": null, "locator": "Publicly Traded Companies", "quote_verified": false}, {"claim": "In 2025 fewer than 30% of public companies earned returns on equity or capital above their costs, and fewer than 20% beat their hurdle rates by more than 5%, even using his low cost of capital.", "speaker": "Aswath Damodaran", "type": "data_point", "entities": ["public companies"], "conviction": "medium", "so_what": "Most companies don't earn their cost of capital.", "quote": null, "locator": "Publicly Traded Companies", "quote_verified": false}, {"claim": "At a 20% cost of equity no S&P 500 company would appear undervalued, and unrealistically high hurdle rates push individuals toward scams and private-company owners toward selling too cheaply via build-up cost-of-capital methods with thinly sourced premiums.", "speaker": "Aswath Damodaran", "type": "causal", "entities": ["S&P 500", "private company appraisers"], "conviction": "medium", "so_what": "Beware unrealistic required returns.", "quote": null, "locator": "Individual Investors and Privately owned businesses", "quote_verified": false}]}, {"theme": "Dealing with uncertainty", "insights": [{"claim": "Investors can respond to uncertainty by ignoring it, avoiding it, demanding a margin of safety (which trades off type 1 and type 2 errors) or using diversification and the law of large numbers to hold riskier stocks in small positions.", "speaker": "Aswath Damodaran", "type": "framework", "entities": ["margin of safety", "diversification"], "conviction": "medium", "so_what": "Position sizing, not paralysis, is his answer to valuation uncertainty; he would not put a $1M portfolio entirely in Anthropic.", "quote": null, "locator": "Investment Followthrough", "quote_verified": false}]}], "insight_total": 21, "top_entities": ["Anthropic", "Damodaran", "CoreWeave", "cost of capital", "S&P 500", "venture capital", "private equity", "Cambridge Associates", "Amazon", "Netflix"], "source_meta": {"author": "Aswath Damodaran", "word_count": 7939, "paywalled": false}}, {"record_id": "0b4e1e49fe375deb", "source_type": "concepts", "source_name": "BCG Henderson Institute", "source_url": "https://www.bcg.com/publications/2026/trust-matters-year-end-sales-events", "title": "BCG Year-End Sales Events Consumer Study 2026: For Year-End Sales Events, Trust Is the New Currency", "published_date": "2026-11-04", "language": "en", "processed_at": "2026-11-05T11:14:14Z", "processor": "claude-code-sub-opus", "tags": ["Society", "AI"], "gist": "BCG's sixth annual survey of 10,220 consumers shows year-end sales events have plateaued at near-saturated awareness, trust in advertised prices is only 54%, and GenAI (56% expected use) is replacing social media as the shopper's verification tool, so proof beats persuasion.", "themes": [{"theme": "Plateauing sales events", "insights": [{"claim": "Black Friday awareness is 95% and shopping intent among those aware rose only two points to 81%, half of last year's four-point rise, so growth from the event calendar is plateauing.", "speaker": "BCG", "type": "data_point", "entities": ["Black Friday", "BCG"], "conviction": "high", "so_what": "Retail event-driven volume growth is limited; competition shifts to share.", "quote": null, "locator": "Relevance of Year-End Sales Events Is Plateauing", "quote_verified": false}, {"claim": "62% of shoppers begin deal searches in October or early November, only about a third wait until days before or the event day, and 76% of planners hold back purchases at least sometimes, pulling spend toward a season rather than a day.", "speaker": "BCG", "type": "data_point", "entities": ["Black Friday", "retailers"], "conviction": "medium", "so_what": "Front-load promotions into October; watch margin dilution from longer promotional periods.", "quote": null, "locator": "Relevance of Year-End Sales Events Is Plateauing", "quote_verified": false}, {"claim": "Gifting is the main reason to shop (63%), with essentials taking the largest budget share and clothing, electronics and beauty the top three categories; plans barely changed from 2025.", "speaker": "BCG", "type": "data_point", "entities": ["BCG"], "conviction": "medium", "so_what": "Stable category mix implies no demand surprise.", "quote": null, "locator": "Relevance of Year-End Sales Events Is Plateauing", "quote_verified": false}]}, {"theme": "Trust deficit in discounts", "insights": [{"claim": "Only 54% of consumers trust advertised prices at year-end events; trust is about two-thirds in the US but only about a third in Denmark, the Czech Republic and Germany.", "speaker": "BCG", "type": "data_point", "entities": ["US consumers", "Germany", "Denmark", "Czech Republic"], "conviction": "high", "so_what": "European promotions face more skepticism than US ones.", "quote": null, "locator": "When Shoppers Doubt the Discount", "quote_verified": false}, {"claim": "Net trust drivers: retailer reputation and money-back/free-returns each 65%, verified reviews 59%, clear regular-vs-discount price comparison 58%; whereas real-time scarcity messages score 8%, AI review summaries 4% and influencer recommendations 3%.", "speaker": "BCG", "type": "data_point", "entities": ["BCG", "influencers"], "conviction": "high", "so_what": "Credibility signals outperform persuasion tactics; reallocate marketing spend.", "quote": "Real-time scarcity messages scored 8%", "locator": "When Shoppers Doubt the Discount", "quote_verified": true}, {"claim": "22% of shoppers planning to spend less believe deals are available all the time, and the minimum discount expected from a good deal eased two points to about 30%, so belief in the markdown matters more than its size.", "speaker": "BCG", "type": "data_point", "entities": ["BCG"], "conviction": "medium", "so_what": "Deeper discounts are commoditized; credibility isn't.", "quote": null, "locator": "When Shoppers Doubt the Discount", "quote_verified": false}]}, {"theme": "GenAI replaces social as shopping tool", "insights": [{"claim": "56% of consumers expect to use GenAI for year-end shopping (up eight points), led by Gen Z at 66% and millennials at 62%; 86% find it useful, 83% say it helps find better deals and 78% say it raises purchase completion.", "speaker": "BCG", "type": "data_point", "entities": ["GenAI", "Gen Z"], "conviction": "high", "so_what": "AI assistants are becoming a gatekeeper for retail discovery and conversion.", "quote": null, "locator": "GenAI Becomes Shoppers' Companion", "quote_verified": false}, {"claim": "Social media as shopping inspiration fell nine points to 46% and declined in every market while GenAI as inspiration rose four points to 11% in every market.", "speaker": "BCG", "type": "data_point", "entities": ["social media", "GenAI"], "conviction": "high", "so_what": "Ad budgets will migrate from social/influencer to AI-mediated discovery.", "quote": null, "locator": "GenAI Becomes Shoppers' Companion", "quote_verified": false}, {"claim": "Consumers trust GenAI most for comparing prices across retailers (39%) and product features (37%), and trust assistant recommendations that allow independent verification (33%) and visible price history (31%) more than the assistant's track record (21%); transactional tasks like checkout are still developing.", "speaker": "BCG", "type": "data_point", "entities": ["GenAI", "retailers"], "conviction": "medium", "so_what": "Agentic checkout is not yet trusted; comparison is the use case.", "quote": null, "locator": "GenAI Becomes Shoppers' Companion", "quote_verified": false}, {"claim": "Retailers should structure product, price and promotion data for AI to surface, audit how AI compares their brand, and agree platform terms before pay-to-play becomes the norm, while requesting a verified review after every purchase.", "speaker": "BCG", "type": "thesis", "entities": ["retailers", "GenAI"], "conviction": "medium", "so_what": "Emerging 'AI-engine optimization' spend and platform fees for retail.", "quote": null, "locator": "What Retailers Can Do", "quote_verified": false}]}], "insight_total": 10, "top_entities": ["Black Friday", "GenAI", "BCG", "retailers", "Gen Z", "social media", "influencers", "Singles' Day"], "source_meta": {"author": "https://www.bcg.com/about/people/experts/jessica-distler", "word_count": 1857, "paywalled": false}}, {"record_id": "4d2a852c649adc78", "source_type": "concepts", "source_name": "Bessemer Venture Partners", "source_url": "https://www.bvp.com/news/investing-in-fal-the-generative-media-company", "title": "Investing in fal: the generative media company", "published_date": "2026-11-03", "language": "en", "processed_at": "2026-11-05T11:14:14Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech"], "gist": "Bessemer leads fal's Series F, arguing generative media is one of AI's largest markets, needs different infrastructure from LLMs, and that fal has moved from inference to full stack and post-trained models (H3 Max, Flux 3 Max).", "themes": [{"theme": "Generative media market", "insights": [{"claim": "Generative media is becoming one of AI's largest markets as production costs collapse and volume explodes, with real-time ad creatives, interactive video, product imagery, game assets, music, avatars and video editing each a fast-growing AI market that barely existed two years ago.", "speaker": "Bessemer Venture Partners", "type": "thesis", "entities": ["generative media", "fal"], "conviction": "medium", "so_what": "Image/video generation APIs are a distinct AI infrastructure category.", "quote": null, "locator": "Opening", "quote_verified": false}, {"claim": "Image and video models refine a whole frame over many passes rather than producing tokens one at a time, so memory, compute and latency need different handling and LLM serving stacks do not carry over.", "speaker": "Bessemer Venture Partners", "type": "framework", "entities": ["fal", "LLMs", "image models", "video models"], "conviction": "high", "so_what": "Specialized inference infrastructure is defensible versus general LLM serving.", "quote": null, "locator": "Media is a different infrastructure problem", "quote_verified": false}, {"claim": "fal is a two-sided ecosystem where developers access thousands of models through one API and labs use it for distribution and serverless infrastructure; Adobe, Canva, Shopify, World Labs and Amazon have moved production volume to it.", "speaker": "Bessemer Venture Partners", "type": "data_point", "entities": ["fal", "Adobe", "Canva", "Shopify", "World Labs", "Amazon"], "conviction": "medium", "so_what": "Marketplace/distribution position with large enterprise customers.", "quote": null, "locator": "Media is a different infrastructure problem", "quote_verified": false}]}, {"theme": "fal's move up the stack", "insights": [{"claim": "In two years fal has gone from inference engine to full stack: workflow tools, a multi-model API, custom infrastructure for enterprises' own weights, and post-trained model development alongside labs.", "speaker": "Bessemer Venture Partners", "type": "thesis", "entities": ["fal"], "conviction": "medium", "so_what": "Vertical integration increases moat and margins.", "quote": null, "locator": "The most impressive thing", "quote_verified": false}, {"claim": "In August fal Research released H3 Max, a post-trained version of MiniMax H3 co-designed with its serving path, which topped all major arenas and leaderboards; last week it partnered with Black Forest Labs on Flux 3 Max and enterprises can commission exclusive post-trained models.", "speaker": "Bessemer Venture Partners", "type": "data_point", "entities": ["fal Research", "MiniMax", "Black Forest Labs", "H3 Max", "Flux 3 Max"], "conviction": "medium", "so_what": "Infrastructure providers are becoming model improvers, a shift in value capture.", "quote": null, "locator": "The most impressive thing", "quote_verified": false}, {"claim": "Bessemer has backed fal in every round since its Series B two years ago and now leads the Series F.", "speaker": "Bessemer Venture Partners", "type": "data_point", "entities": ["Bessemer Venture Partners", "fal"], "conviction": "high", "so_what": "Signals continued late-stage funding appetite for AI infrastructure.", "quote": null, "locator": "Opening", "quote_verified": false}]}], "insight_total": 6, "top_entities": ["fal", "Bessemer Venture Partners", "MiniMax", "Black Forest Labs", "Adobe", "Canva", "Shopify", "Amazon"], "source_meta": {"author": "", "word_count": 1133, "paywalled": false}}, {"record_id": "d173093cbbc1909c", "source_type": "concepts", "source_name": "ECB Blog", "source_url": "https://www.ecb.europa.eu/press/blog/date/2026/html/ecb.blog20261104~78299c3eaf.en.html", "title": "A warning from Europe's hot summer", "published_date": "2026-11-04", "language": "en", "processed_at": "2026-11-05T11:14:14Z", "processor": "claude-code-sub-opus", "tags": ["Energy", "Macro", "Geopolitics"], "gist": "ECB President Lagarde says Europe's record-hot summer had limited near-term economic impact but warns of rising scarring costs, an insurance gap, and heat-driven strain on power systems, urging climate insurance, grid/storage investment and easier behind-the-meter connections.", "themes": [{"theme": "Economic costs of heat and drought", "insights": [{"claim": "Europe saw over 30,000 excess deaths in this summer's heatwaves and 400,000 hectares burned in Spain and France, while drought lowered the Rhine and Danube and disrupted shipping and nuclear cooling.", "speaker": "Christine Lagarde", "type": "data_point", "entities": ["Europe", "Rhine", "Danube"], "conviction": "high", "so_what": "Physical climate shocks hit logistics and power supply.", "quote": null, "locator": "Opening", "quote_verified": false}, {"claim": "ECB staff estimate this summer's extreme weather had only a small, temporary effect on euro area activity, with Germany's Rhine impact expected to reverse, Italy hit by heat and drought, and France and Spain wildfire effects concentrated in agriculture, forestry and tourism.", "speaker": "Christine Lagarde", "type": "data_point", "entities": ["ECB", "euro area", "Germany", "Italy", "France", "Spain"], "conviction": "high", "so_what": "No major growth downgrade from the summer itself.", "quote": null, "locator": "The costs go beyond the immediate damage", "quote_verified": false}, {"claim": "Regional activity is on average 1.5% lower two years after a heatwave and 3% lower four years after a drought, and the arid summer could push food inflation higher in the coming year.", "speaker": "Christine Lagarde", "type": "data_point", "entities": ["euro area", "food inflation"], "conviction": "high", "so_what": "Scarring effects and food-price risk matter for inflation outlooks.", "quote": null, "locator": "The costs go beyond the immediate damage", "quote_verified": false}, {"claim": "Nearly three quarters of euro area businesses depend heavily on at least one service provided by nature (water most exposed), and nearly 12% of euro area output is exposed to risks from insufficient flood protection.", "speaker": "Christine Lagarde", "type": "data_point", "entities": ["euro area businesses"], "conviction": "medium", "so_what": "Broad physical-risk exposure.", "quote": null, "locator": "The costs go beyond the immediate damage", "quote_verified": false}, {"claim": "Only a quarter of catastrophe losses in Europe have historically b // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
