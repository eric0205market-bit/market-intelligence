<script>
const ITEMS = [{"id": 1, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / Bond Market Weekly (Goldman rates, George Cole)", "title": "Bond selloff turns reflexive: higher yields are now tightening conditions enough to cap themselves", "idea": "Goldman rates frames the week as the market sketching boundary conditions for the global selloff. Softer US labour data, wider credit spreads and a more patient Fed are leaning against higher yields. The shift is from a plain inflation selloff to a reflexive one. Duration has found footing but vol won't fade until yields set a cleaner peak.", "angle": "Reflexivity is the trade: the level of yields that breaks credit is the new ceiling. Watch HY spreads as the tell for where long-end buyers return.", "tweetA": "Credit spreads widening is the long end's best friend right now. Every bp wider in HY is a bp the 10y doesn't have to go up. The Fed isn't the cap on yields - the credit market is. $TLT $HYG", "tweetB": "Either this is the top in yields, or it's just a ledge. The difference is whether payrolls revisions keep coming. One soft print can't tell you which. I'm sizing duration as if I don't know.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/bond-market-weekly-the-selloff-is"}, {"id": 2, "cat": "geopolitics", "urgency": "deep", "source": "Dark Side of the Boom / Bond Market Weekly (Goldman rates, George Cole)", "title": "France is now the brake on Bund yields: Europe replaces the US as the pressure point", "idea": "The note argues Europe is becoming the more important pressure point in global rates, with French sovereign stress acting as a brake on how far Bunds can sell off. Gilts have quietly benefited from the shift. Higher core yields are being capped by periphery-style stress at the core.", "angle": "If OAT spreads cap Bunds, the ECB's reaction function is being set by Paris, not Frankfurt. That's a new dynamic for EUR and European banks.", "tweetA": "The Bund can't sell off because France is the one who breaks. When the core's own spread to Germany sets the ceiling on German yields, you don't have a bond market, you have a political risk gauge. $FXE", "tweetB": "Funny: the same French fiscal stress that caps Bunds also pushes money into dollars first, not gold. Europe's problem shows up in EURUSD before anywhere else. Check where the stress actually lands.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/bond-market-weekly-the-selloff-is"}, {"id": 3, "cat": "macro", "urgency": "watch", "source": "Dark Side of the Boom / Bond Market Weekly (Goldman rates, George Cole)", "title": "JGBs are a different story: domestic supply and QT point to tighter spreads over time", "idea": "While Gilts benefit and Bunds are capped, JGBs remain on a separate path. Domestic supply and BoJ QT pressures are pointing toward wider yields relative to peers over time. The note treats Japan as the idiosyncratic leg of the global selloff.", "angle": "Japan's QT plus supply is the slow-burn risk that doesn't get capped by credit. Worth tracking life-insurer demand and BoJ buying pace.", "tweetA": "Everyone is debating whether the US long end found a floor. Meanwhile Japan is the one place where supply and QT are a one-way street. The cap on global yields has a hole in it, and it's in Tokyo. $EWJ", "tweetB": "Three bond markets, three different reasons for the same yield move: US (inflation), Europe (fiscal), Japan (supply/QT). Calling it one global selloff is lazy. The hedges are different too.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/bond-market-weekly-the-selloff-is"}, {"id": 4, "cat": "gold", "urgency": "deep", "source": "Dark Side of the Boom / Gold Market Weekly", "title": "Gold gets a friendlier Fed and still can't hold $4,200: that failure is the signal", "idea": "Payrolls softened sharply, unemployment ticked up, prior months were revised down and the market stripped most October hike risk. Gold pushed back above $4,200 and then the long end turned heavy again and the rally fell apart. Tactical call stays bearish: sell recoveries, with $4,250 as the first repair level and $4,000 where the author stops chasing weakness.", "angle": "When good news can't lift an asset, the positioning is the story. Gold is trading real yields and the dollar, not the Fed path.", "tweetA": "Gold got the dovish payrolls, the hike risk repricing, and a pop through $4,200. It gave all of it back. When bullish news fails to stick, the next move is rarely up. $GLD $GC_F", "tweetB": "Strategic book says own gold. Tactical book says sell the bounce. The author runs both and says they don't have to agree every week. Most people force one view and get chopped. Two clocks, two sizes.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/gold-market-weekly-the-dollar-and"}, {"id": 5, "cat": "gold", "urgency": "watch", "source": "Dark Side of the Boom / Gold Market Weekly", "title": "Bank of Korea returns to physical gold after 13 years, and can pay in won", "idea": "The BoK is preparing to buy about one tonne of domestically produced gold, its first physical purchase in thirteen years. It already holds just over 100 tonnes, a small share of total reserves. The purchase can be made in won, so it adds gold without first creating dollar demand. The author reads it as a reserve-structure signal, not a price-day signal.", "angle": "Buying in local currency is the quiet innovation: reserve diversification that doesn't touch the dollar bid. Watch whether other mid-sized CBs copy the won-for-domestic-gold template.", "tweetA": "One tonne is nothing. Doing it in won is everything. A central bank adding gold without first buying dollars is de-dollarization without the headline. Watch who copies the template. $GLD $GDX", "tweetB": "Hedge funds trade gold on real yields. Reserve managers trade it on allocation and entry price. Gold near $4,000 is where the second group starts caring. Korea waiting 13 years and moving now is a data point on that clock.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/gold-market-weekly-the-dollar-and"}, {"id": 6, "cat": "energy", "urgency": "deep", "source": "Dark Side of the Boom / Gold Market Weekly", "title": "$100+ Brent keeps the inflation channel open and the long end heavy: oil is the gold desk's boss", "idea": "The author argues Brent above $100 isn't background for gold: it keeps inflation risk warm, props the dollar and stops the long end relaxing. A few hours of cheaper crude can produce a bounce, but a real change needs bond markets to believe inflation is losing force. The Fed moving the next possible hike from October toward December doesn't settle things further out the curve.", "angle": "Oil is the common factor tying the bond, gold and dollar notes together this week. Cheap crude is the precondition for every bull case in duration and bullion.", "tweetA": "Brent at $100 is why a soft jobs report didn't relieve the long end. Labour data loosens the front end. Energy keeps the back end tight. The curve is being pulled in two directions by two different shocks. $USO $TLT", "tweetB": "Count how many assets this week are explained by one variable: crude. Gold failed, the long end stayed heavy, the dollar held. If Muscat-style de-escalation lands, the whole complex flips at once. Positioned for that?", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/gold-market-weekly-the-dollar-and"}, {"id": 7, "cat": "energy", "urgency": "deep", "source": "McKinsey / Chart of the Week (Tiago Devesa, Mekala Krishnan, Humayun Tai)", "title": "Hormuz 2026: 14% of global oil and gas supply disrupted at peak - 2x the 1970s shocks, 6x Ukraine 2022", "idea": "At its peak the Strait closure disrupted 14% of global oil and gas supply, more than double the relative size of the 1970s oil shocks and over six times the peak impact of the 2022 Ukraine war. The system proved more resilient than feared thanks to inventories, bypass pipelines and other shock absorbers built after past crises. Those buffers have limits: inventories are thinning and pipelines have been exposed.", "angle": "The shock absorbers were built for the last war. Thinning inventories plus exposed bypass pipes means the next disruption hits a weaker system. Worth tracking SPR and commercial stock draws.", "tweetA": "14% of global oil and gas supply. Twice the 1970s. And the system absorbed it. That should scare you more than reassure you, because the buffers it used are now depleted. The next shock meets an emptier tank.", "tweetB": "Compare: 1973 gave us stagflation with a far smaller disruption. 2026 gave us a bigger one and a soft-landing debate. Either the world got structurally less oil-intensive, or the bill hasn't arrived yet. I lean toward the second.", "charts": {"count": 1, "hot": true, "desc": "Featured chart: size of major energy supply disruptions as share of global supply - 2026 Hormuz (14%) vs 1970s shocks vs 2022 Ukraine. Instantly tweetable bar comparison."}, "link": "https://www.mckinsey.com/mgi/our-research/Aftershocks-Energy-security-beyond-the-Strait-of-Hormuz-crisis"}, {"id": 8, "cat": "geopolitics", "urgency": "deep", "source": "The Pressure Point / Fulcrum (whatsthelatest.ai)", "title": "ICE now requires lights and sirens on vehicle stops, alongside a 5,000-person hiring drive", "idea": "Internal guidance reported by CNN requires ICE vehicles used for stops to carry lights and sirens, and permits stops only after specified courses. It lands alongside a plan for 5,000 new hires. Fulcrum argues ICE is becoming a national street-policing force before it has built the training, supervision and public accounting that make such power governable. One investigation described arrests taking as little as 90 seconds.", "angle": "A rapid-hiring plus tactical-expansion story is a labor-capacity and political-risk story into the midterms. Training throughput is the binding constraint, not funding.", "tweetA": "Add 5,000 officers to an agency that just got authority for vehicle stops. Police departments spend careers learning how badly pursuit, firearms and frightened drivers interact. The training pipeline is the real constraint here, not the budget.", "tweetB": "Midterms are close, vulnerable Republicans are already feeling pressure over the crackdown. A faster, louder, more visible ICE is the opposite of a quiet pivot. Political risk is being scaled up at the same time as headcount.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-sirens-came-before-safeguards/"}, {"id": 9, "cat": "regulation", "urgency": "deep", "source": "The Pressure Point / Fulcrum (whatsthelatest.ai)", "title": "Accountability by salvage: Good family sues, three deaths in 24 hours, SCOTUS takes mandatory detention", "idea": "Renee Good, a US citizen killed by an ICE agent in Minneapolis last winter, now has a family lawsuit against the federal government. Separate reporting grouped three deaths in Maine, Georgia and Florida within 24 hours, though causation isn't established. A Texas man shot by ICE had a bullet removed from his back and is charged with assaulting an officer. The Supreme Court agreed this week to hear the mandatory detention policy.", "angle": "Litigation timelines (docket disclosures, video preservation) are the next catalysts. Courts, not Congress, are setting the limits.", "tweetA": "Congress argues about whom ICE can detain. Courts are being asked about how. The first docket disclosures in the Good case will tell you more about the agency's controls than any policy memo. Watch the video-preservation orders.", "tweetB": "The SCOTUS detention case and the use-of-force suits are the same question from two directions: how much coercive power runs without external review. One gets argued in a courtroom, the other in the street.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-sirens-came-before-safeguards/"}, {"id": 10, "cat": "macro", "urgency": "deep", "source": "The Pressure Point / Fulcrum (whatsthelatest.ai) (Things Happen)", "title": "$90 Medicare premium rebates for 20.8M Americans: roughly $1.9B of pre-midterm stimulus", "idea": "CMS says the administration plans $90 Medicare premium rebates for 20.8 million eligible Americans. That's about $1.9B in direct transfers to a high-turnout voting bloc.", "angle": "Small in macro terms, large in electoral terms. A pattern of targeted transfers into the midterms is worth tracking against the fiscal-supply narrative in the bond notes.", "tweetA": "20.8M seniors times $90 is $1.9B. Rounding error for the Treasury, a rifle shot at the highest-turnout voters in the country. Fiscal policy in an election year is just messaging with a CUSIP.", "tweetB": "Bond market is pricing heavy supply and a patient Fed. Add targeted checks into the midterms and the term premium has another reason to stay sticky. Small numbers, repeated, add up. $TLT", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-sirens-came-before-safeguards/"}, {"id": 11, "cat": "geopolitics", "urgency": "watch", "source": "The Pressure Point / Fulcrum (whatsthelatest.ai) (Things Happen / On the board)", "title": "FlyDubai co-pilot alleged axe attack on captain labelled terrorism by UAE; Fairford suspect bailed", "idea": "The UAE called a FlyDubai co-pilot's alleged axe attack on the captain a terrorist act, deepening regional travel disruption. Separately, the sixth suspect in the Fairford case, a dual UK-Iranian national, was released on bail.", "angle": "Regional aviation security and the Fairford thread both feed the Middle East risk premium. Gulf carriers are a hub-and-spoke chokepoint in the same region as Hormuz.", "tweetA": "Gulf aviation is already operating around a closed strait and disrupted airspace. Now a cockpit security incident. Dubai's value is being a safe connector. Every incident erodes the premium it charges for that.", "tweetB": "Fairford suspects out on bail while Hormuz is a 14% supply shock. Security risk in the Gulf and UK-Iran legal tangles are two ends of the same escalation ladder. Worth keeping on one screen.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-sirens-came-before-safeguards/"}, {"id": 12, "cat": "geopolitics", "urgency": "watch", "source": "The Pressure Point / Fulcrum (whatsthelatest.ai) (Things Happen)", "title": "French police clash with students as education-system protests grow", "idea": "French police clashed with students as demonstrations demanding improvements to the education system grew.", "angle": "A second source of French street pressure on top of fiscal stress. Domestic instability in the core is what makes the OAT-Bund spread a political variable.", "tweetA": "France: sovereign spreads widening, students in the street. When the fiscal and social stories overlap, the bond market stops treating it as noise. The OAT spread is the poll.", "tweetB": "Cutting spending to calm the bond market and funding schools to calm the street can't both be done. That's the French trilemma in one sentence. Which constraint breaks first?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-sirens-came-before-safeguards/"}, {"id": 13, "cat": "regulation", "urgency": "watch", "source": "The Pressure Point / Fulcrum (whatsthelatest.ai) (Things Happen)", "title": "Tennessee corrections chief resigns after failed lethal injection left Christa Pike on a ventilator", "idea": "Tennessee corrections commissioner Frank Strada will resign after the state's failed lethal injection of Christa Pike left her hospitalized on a ventilator.", "angle": "Execution-protocol failures tend to produce moratoria and litigation waves. Supply of drugs and procedural scrutiny are the levers.", "tweetA": "A failed execution that ends with the prisoner on a ventilator is a procurement failure as much as a moral one. Untested protocols, thin drug supply, no external review. The same pattern as every other 'rushed capacity' story this week.", "tweetB": "Notice the pattern in today's feed: ICE hiring faster than training, an execution carried out with a protocol that failed. State capacity outrunning state competence is the through-line.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-sirens-came-before-safeguards/"}];
const META = {"date": "2026-10-04", "time": "03:15 CEST", "windowStart": "2026-10-03 21:10 CEST", "windowEnd": "2026-10-04 03:10 CEST", "emailsInWindow": 4, "emailsRead": 4, "itemsExtracted": 13, "includedSources": ["Dark Side of the Boom - Bond Market Weekly (3 items)", "Dark Side of the Boom - Gold Market Weekly (3 items)", "McKinsey Chart of the Week (1 item)", "The Pressure Point / Fulcrum (6 items)"], "skippedSources": ["McKinsey Chart of the Week: McKinsey Live event promo and last-week chart teaser (promotional, no analysis)"]};
var COL={macro:'#e24b4a',credit:'#378add',positioning:'#ef9f27','AI/infra':'#1d9e75',crypto:'#7f77dd',geopolitics:'#d85a30',energy:'#f97316',tech:'#06b6d4',gold:'#d4a017',culture:'#ec4899',labor:'#8b5cf6',regulation:'#64748b',science:'#14b8a6',venture:'#84cc16'};

    +'<div class="lbl">Tweets</div><div class="tw"><div><b style="color:#378add;font-size:11px">TWEET A</b><div>'+esc(it.tweetA)+'</div><button class="copy-btn" onclick="copyTweet(' + it.id + ',\'a\')">📋 Copy</button></div>'
    +'<div><b style="color:#7f77dd;font-size:11px">TWEET B</b><div>'+esc(it.tweetB)+'</div><button class="copy-btn" onclick="copyTweet(' + it.id + ',\'b\')">📋 Copy</button></div></div>'
    +'<div class="chart'+(it.charts.hot?' hot':'')+'">'+(it.charts.hot?'🔥 CHART WORTH SAVING - ':'')+(it.charts.count>0?it.charts.count+' chart(s): ':'')+esc(it.charts.desc||'No charts')+'</div>'
    +'<div style="margin-top:8px"><a href="'+it.link+'" target="_blank">↗ Read full article</a></div></div></div>';
  });

}

}
