const ITEMS = [{"cat": "geopolitics", "urgency": "act", "source": "HFIR / Wilson (Public Memo)", "title": "The whole Iran war in one chart: Hormuz flows up = US winning, flows down = Iran winning", "idea": "Wilson reduces the US-Iran conflict to a single gauge: oil flows out of the Strait of Hormuz (HormuzStraitTracker). Iran has escalated tanker attacks daily and flows have fallen materially. Trump has said repeatedly there is no deal he would sign, and Iran's 7 conditions, which the US won't accept, remain its starting position. Wilson reads the drop in flows as Iran winning.", "angle": "A single flows gauge gives a clean daily read on oil risk and is better than following headlines. Use it as the trigger for adding to or trimming Brent exposure.", "tweetA": "Stop reading Iran headlines. Watch one number: barrels leaving Hormuz. It's falling while the market priced oil as if peace were already signed. That gap is the trade.", "tweetB": "Diplomacy has a headline problem and a physics problem. The headlines say 'final confrontation phase'. The physics say tanker loadings are dropping every day. When the two disagree, I go with the physics.", "charts": {"count": 1, "hot": true, "desc": "HormuzStraitTracker.com chart of oil flows out of the Strait of Hormuz, now falling as Iran escalates tanker attacks. Wilson's 'one chart that explains the war'."}, "link": "https://www.hfir.com/p/public-memo-let-the-bloodbath-continue", "id": 1}, {"cat": "geopolitics", "urgency": "deep", "source": "HFIR / Wilson (Public Memo)", "title": "Game theory of the pretext: Iran is baiting Trump into firing first while equities bleed", "idea": "Wilson argues both sides now want the other to be seen as the aggressor. Iran says the US broke the June MOU. Iran faces winter shortages of necessities, and the FT reports US morale and battle readiness are being tested. Wilson's thesis is that Iran will force the issue, for example by running its own tankers through the blockade. Trump would then have to escalate and sink the market further, or accept Iran's terms and be humiliated. He also suggests the post-midterm sell-off was pinned on the Democrats and on Nvidia so that an Iran-driven drawdown can share the blame.", "angle": "Falling equities raise Trump's cost of escalating, which strengthens Iran's position. Oil volatility looks underpriced against a binary outcome.", "tweetA": "Iran's timing isn't random. It's pressing while the S&P has gone from +12% YTD to flat. Every red day raises the US cost of escalating. They're negotiating against your 401(k).", "tweetB": "Both sides need the other to fire first. Iran has a winter shortage clock and the US has a morale clock. Whoever's clock runs out first decides the oil price. I wouldn't be short vol into that.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.hfir.com/p/public-memo-let-the-bloodbath-continue", "id": 2}, {"cat": "energy", "urgency": "deep", "source": "HFIR / Wilson (Public Memo)", "title": "1973 analog: stocks didn't bottom until months AFTER the embargo ended; world has lost ~3bn bbl of inventory", "idea": "Wilson's historical analog is the 1973-74 OPEC embargo. The broad equity sell-off only began months after the embargo was lifted in March 1974. Today the world has lost close to ~3 billion barrels of oil inventory and SPRs are drained everywhere. If Iran keeps control of Hormuz, a tight market persists even after a resolution, which means sticky inflation, tight policy and compressing risk assets.", "angle": "A peace deal isn't the all-clear. The inventory deficit takes years to rebuild, which supports a long-dated crude curve and argues against chasing a relief rally in long-duration assets.", "tweetA": "~3bn barrels of global inventory gone. That's roughly a month of world demand, and it has to be bought back at any price. Even a peace deal starts with a restocking bid.", "tweetB": "In 1973-74 the embargo ended in March and stocks kept falling for months afterward. If you're waiting for an Iran deal to buy the dip, the history says the dip comes after the deal.", "charts": {"count": 1, "hot": false, "desc": "Historical chart of the 1973-74 OPEC embargo against equities, with a note that the embargo was lifted after March 1974. Charts inside, worth opening."}, "link": "https://www.hfir.com/p/public-memo-let-the-bloodbath-continue", "id": 3}, {"cat": "positioning", "urgency": "act", "source": "HFIR / Wilson (Public Memo)", "title": "Trade log: ARKK put spread +400% closed, 80% rotated into BNO Dec $60 calls on a WTI hammer candle", "idea": "Wilson closed his ARKK Mar-2027 $60/$50 put spread at $2.50. He paid $0.50, the max payout is $10, and the first tranche was closed at $1.50. He still holds the $55/$45 Mar-2027 put spread. He moved 80% of the proceeds into BNO Dec 18 $60 calls at $2.65. His reasoning: Brent held support, WTI printed a rare hammer candle during the sell-off, and oil-on-water is falling while Persian Gulf loadings are 'set to fall off a cliff'. His test for keeping a winner: 'would I buy more today at $2.50? No.'", "angle": "The trade rotates from short tech beta into long crude convexity. The discipline point is useful content: short winners decay asymmetrically. He also said ARKK at $60 would put the spread at only ~$4.25-4.50.", "tweetA": "The ARKK put spread went from $0.50 to $2.50 with a $10 max. That's a 5x, but it has captured only ~21% of the max payout. Selling it anyway is the right call. The rest of the payoff needs a crash, while the BNO calls only need a bounce.", "tweetB": "Same day, same tape: the S&P is the most oversold since 2015 and WTI prints a hammer. Oil is starting to trade on Hormuz again instead of as a risk asset. That decoupling is what I'm watching.", "charts": {"count": 2, "hot": true, "desc": "Brent holding technical support, and WTI breaking below critical support then reversing into a hammer candle during the equity bloodbath."}, "link": "https://www.hfir.com/p/public-memo-let-the-bloodbath-continue", "id": 4}, {"cat": "macro", "urgency": "deep", "source": "HFIR / Wilson (Public Memo)", "title": "Tech at 30x FCF doesn't survive rates heading to high single digits: '1970s all over again'", "idea": "Wilson says tight oil means elevated inflation and tight monetary policy, with rates that 'could be headed into the high single digits'. Tech stocks at 30x free cash flow can't hold in that regime. He calls the May-October equity rally 'pure nonsense', and the S&P has gone from +12% YTD to roughly flat in a month.", "angle": "This is the bear case for multiple compression: an energy supply shock passing through into term premium. Compare it with Capital Flows' note from earlier tonight that bonds aren't confirming the AI repricing.", "tweetA": "30x FCF is a 3.3% FCF yield. Wilson's case has rates heading toward high single digits. Equities paying ~400bp less than cash isn't a valuation, it's a donation.", "tweetB": "The consensus says the sell-off is about AI. The 1970s bear says it's about oil. If he's right, the Fed can't cut you out of it, because the problem is a missing barrel, not a missing rate cut.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.hfir.com/p/public-memo-let-the-bloodbath-continue", "id": 5}, {"cat": "energy", "urgency": "watch", "source": "HFIR / Wilson (Public Memo)", "title": "Ship-to-ship transfers are the last valve: hit the STS hubs and ballast capacity falls off a cliff", "idea": "Ship-to-ship transfer volumes haven't collapsed yet even as direct Hormuz flows drop. Wilson warns that escalatory attacks on STS hubs would make ballast capacity 'fall off a cliff'. He expects the temporary oversupply to flip quickly into undersupply as Gulf loadings fall.", "angle": "Track STS hub activity (Fujairah, Khor Fakkan) as the next trigger. Tanker rates and shipping equities would react first.", "tweetA": "Everyone watches Hormuz transits. The hidden valve is ship-to-ship transfers, which have barely moved yet. If Iran hits those hubs, the 'oversupply' story is gone within a week. Tanker rates would tell you first.", "tweetB": "I'm watching the gap between what's loaded and what's on the water. Oil-on-water is already falling. Once that inventory lands and isn't replaced, the glut narrative runs out of barrels.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.hfir.com/p/public-memo-let-the-bloodbath-continue", "id": 6}, {"cat": "culture", "urgency": "deep", "source": "HFIR / Wilson (Public Memo)", "title": "'You only have yourselves to blame!': the post-midterm sell-off as a political blame-shift", "idea": "Wilson notes that Trump, who often praised high stock prices, posted 'You only have yourselves to blame!' on Truth Social the day after the midterms, when the sell-off began. Wilson calls the Anthropic IPO 'a massive transfer of wealth'. His view is that pinning the sell-off on the Democrats and on Nvidia's scandal sets up a narrative where an Iran-war drawdown is blamed on the AI bubble instead.", "angle": "The incentive behind the 'Trump put' has flipped after the midterms. The administration may now accept a falling market as long as someone else gets the blame.", "tweetA": "For years the market priced a 'Trump put' because he treated the S&P as his scorecard. After the midterms it's 'you only have yourselves to blame'. When the scorekeeper changes teams, the put is gone.", "tweetB": "Same IPO, opposite verdicts. Parekh: 'kudos, one of the most unique IPOs'. HFIR: 'a massive transfer of wealth'. Day two gave back most of the pop. The tape is siding with the cynic so far. $ANT", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.hfir.com/p/public-memo-let-the-bloodbath-continue", "id": 7}, {"cat": "regulation", "urgency": "act", "source": "The Dark Side of the Boom", "title": "SEC reportedly examining Nvidia accounting; stock already down more than a third", "idea": "Reuters reports the SEC is examining potential accounting issues at Nvidia. The specific matters are unknown and an inquiry isn't evidence of wrongdoing. It lands on top of Jensen Huang's departure and a widening scandal that has already cut the shares by more than a third. The author's point: Nvidia sits where chips, cloud, data-center construction and AI capex financing meet, so a crisis of confidence won't stay confined to one ticker.", "angle": "An accounting probe at the central counterparty of AI capex raises the risk premium across the whole supply chain, and the neoclouds and AI credit are the weakest links.", "tweetA": "Nvidia just guided $130B for next quarter, and the SEC is looking at its books in the same week. The market can live with a slowdown. It can't price a number it doesn't trust. $NVDA", "tweetB": "Nobody's asking this yet: if $NVDA's accounting gets questioned, what happens to every neocloud that used Nvidia's backing as collateral? Watch the second-order credit, not the stock.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/nvidias-house-of-cards-when-the-ai", "id": 8}, {"cat": "regulation", "urgency": "deep", "source": "The Dark Side of the Boom", "title": "Singapore was $10.2B, or 22% of Nvidia's $46.7B quarter, then the geography reporting changed", "idea": "Nvidia previously disclosed that $10.2B of $46.7B quarterly revenue (nearly 22%) was billed through Singapore, which it described as an invoicing hub for products shipped elsewhere. It then changed geographic reporting to customer headquarters instead of billing location. That nothing proves improper accounting, but it now sits next to the Megaspeed export-control probe.", "angle": "Changing how revenue is reported by geography after a concentration flag is exactly what investigators look at. Read it together with Parekh's Malaysia route (~$12B of Megaspeed-linked chips).", "tweetA": "22% of one Nvidia quarter was billed through a city of 6 million. Then the reporting switched to 'customer HQ'. That doesn't make it fraud, but it's the first question every regulator will ask. $NVDA", "tweetB": "Connect the dots: $10.2B a quarter billed via Singapore, ~$12B of chips tied to Megaspeed going to China, and remote access legal until Monday. The question isn't whether chips reached China, it's which of the three routes they took.", "charts": {"count": 0, "hot": false, "desc": "Charts inside, worth opening."}, "link": "https://thedarksideoftheboom.substack.com/p/nvidias-house-of-cards-when-the-ai", "id": 9}, {"cat": "regulation", "urgency": "watch", "source": "The Dark Side of the Boom", "title": "Nvidia's legal stack: DOJ criminal, CA AG subpoena, Hugging Face antitrust, and reportedly no D&O insurance", "idea": "Commerce opened its Megaspeed investigation in 2024 and requested Nvidia's sales records in May 2025. DOJ has since taken over the criminal case. California's AG has issued a subpoena, and there is an antitrust review of the $12.9B Hugging Face deal. Nvidia has history here: a 2002 SEC inquiry led to restatements for FY2000-2002, and a 2022 crypto-mining disclosure case settled for $5.5M. It also reportedly has no directors-and-officers insurance.", "angle": "Having no D&O coverage means any securities settlement is paid directly from shareholder cash. That's a small tail risk, but a real one.", "tweetA": "Count the agencies: SEC, DOJ, Commerce, the California AG and antitrust reviewers. One company, five regulators, no CEO and reportedly no D&O insurance. This is what it looks like when a monopoly runs out of political cover. $NVDA", "tweetB": "Nvidia has been here before: a 2002 SEC inquiry led to three years of restatements. The difference is that in 2002 it was a $5B company. Now the entire AI capex cycle rests on its numbers.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/nvidias-house-of-cards-when-the-ai", "id": 10}, {"cat": "labor", "urgency": "deep", "source": "TWiST / Jason Calacanis", "title": "Always approve the $200/month AI plan for a $75K-$125K employee", "idea": "Jason Calacanis's rule: whenever an employee asks to upgrade from the $20 AI plan to the $100 or $200 tier, the answer is yes. For someone earning $75K-$125K, a significant efficiency gain pays for the tool immediately. The episode also argues the real shift from casual user to AI-first worker comes when you connect the models to all your other apps instead of using them as 'Google 2.0'.", "angle": "Seat upgrades to premium AI tiers are an underappreciated driver of enterprise AI revenue, and the ROI math backs it up.", "tweetA": "$200/month is $2,400 a year. On a $100K salary, it pays for itself if it saves about 1 hour a week. Most people using it seriously save that before lunch on Monday. The $20 plan is the expensive one.", "tweetB": "The SaaS upsell has flipped. Employees are begging managers for the $200 tier, not the other way round. When users pull pricing up, the 'AI revenue is a bubble' crowd is looking at the wrong demand curve.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/pay-for-the-bigger-ai-plan-twist-617", "id": 11}, {"cat": "tech", "urgency": "watch", "source": "TWiST / Jason Calacanis", "title": "Agents auditing your message history found 'every leak in our game'", "idea": "Calacanis had his Grok bots go through his entire iMessage history with his Athena executive assistants. The bots pulled out best practices and found where he was losing time and hotel points: 'It found every leak in our game.' Another host dictated a post idea to a Plaud note-taker while driving, then had Grok and Claude working on it before he sat down at a computer.", "angle": "A new category of agent work is appearing: mining personal and operational exhaust (messages, voice notes) for process improvements. It's an adoption signal for agentic tools tied into personal data.", "tweetA": "The next consulting firm is an agent reading your iMessage history. Calacanis's bots audited years of chats with his assistants and found the leaks. That's a $500/hour ops review for the cost of a subscription.", "tweetB": "Everyone debates AI writing code. The quieter shift is AI reading your exhaust: texts, voice notes, email threads. Whoever owns the connectors to personal data owns the next moat.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/pay-for-the-bigger-ai-plan-twist-617", "id": 12}, {"cat": "regulation", "urgency": "watch", "source": "TWiST / Jason Calacanis", "title": "Robotaxis: one fatal accident, even if it isn't the robot's fault, could set the industry back years", "idea": "TWiST's founder takeaway: in regulated markets, go slow. A single fatal accident, even one the robotaxi didn't cause, could be weaponized to set the whole industry back by years. Parekh's ARD #209 and #211 the same week covered 'Waymo getting pulled over' and robotaxis dropping Uber.", "angle": "The asymmetric tail risk for AV names is driven by regulation, not technology. Scale is the risk factor.", "tweetA": "Robotaxi math nobody models: miles grow exponentially, so the odds of a headline fatality do too. The winner isn't whoever scales fastest. It's whoever survives the first bad day.", "tweetB": "'Slow and steady' advice from a VC podcast is a tell. When the most aggressive investors start preaching caution, they've seen the regulatory risk up close. $TSLA $GOOGL $UBER", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/pay-for-the-bigger-ai-plan-twist-617", "id": 13}, {"cat": "positioning", "urgency": "act", "source": "The Dark Side of the Boom (GS Brian Garrett)", "title": "Goldman's Garrett on Dec 2018: 'Absolutely zero idea' why it was falling. The same ingredients are back", "idea": "In a special pre-weekend Weekend Prep note, GS derivatives trader Brian Garrett recalls client calls on Dec 24, 2018, when the S&P was collapsing toward its Christmas Eve low. He told clients he had 'absolutely zero idea' why. The ingredients then were a hawkish Fed, broken technicals, surging vol and systematic supply. All four are present again.", "angle": "The 2018 low came from capitulation plus a Fed pivot (Powell's January 2019 shift). The question now is what forces this Fed to turn. Note Pasquariello's earlier piece in the same feed: 'Is the Fed About to Get Properly Rough?'", "tweetA": "Dec 2018 ended because Powell blinked within 10 days. In Nov 2026 the Fed is threatening to tighten into an oil shock. Same chart, but the exit door is locked.", "tweetB": "When a Goldman derivatives trader says the honest answer in 2018 was 'absolutely zero idea', the lesson is that flow-driven bottoms don't need a reason. They need sellers to run out. Watch CTA exposure, not the news.", "charts": {"count": 0, "hot": false, "desc": "Charts inside, worth opening (paywalled note)."}, "link": "https://thedarksideoftheboom.substack.com/p/goldman-sachs-brian-garrett-the-2018", "id": 14}, {"cat": "credit", "urgency": "deep", "source": "The Dark Side of the Boom (GS Brian Garrett)", "title": "Tech has already taken a 2018-sized hit; credit and the front end have barely moved", "idea": "Per the Garrett note, technology has already absorbed much of the damage it took in the 2018 correction, but credit markets and the front end of the rates curve 'have barely begun to respond'. Vol markets signal extreme stress, yet there's no broader credit shock. That leaves open whether the equity correction has further to run.", "angle": "This divergence is the key signal. If credit stays calm, equities are a buy. If spreads catch down, there's a second leg. Watch HY spreads and 2-year yields.", "tweetA": "Either credit is about to catch down to equities, or equities are about to snap back to credit. VIX screams stress and HY shrugs. I don't know which side breaks, but I'd rather own the cheap hedge: credit protection.", "tweetB": "The front end barely moving is the tell. If the market really feared a growth scare, 2-year yields would be collapsing. It's pricing a hawkish Fed and an equity de-rating together, which is the 1970s mix, not 2018.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/goldman-sachs-brian-garrett-the-2018", "id": 15}, {"cat": "positioning", "urgency": "watch", "source": "The Dark Side of the Boom (GS Brian Garrett)", "title": "The first rebound bets are appearing, but structured with 'more caution than conviction'", "idea": "Beneath the liquidation, Garrett sees the first signs of investors positioning for a rebound. The strategies being used, likely defined-risk upside such as call spreads rather than outright length, show far more caution than conviction.", "angle": "Cautious upside structures in a 4-sigma oversold tape set up a squeeze if the lows hold, because underexposed dip buyers would have to chase.", "tweetA": "The rebound bets are coming in as hedged lottery tickets, not outright length. That's how bottoms start: everyone wants upside nobody is willing to own outright.", "tweetB": "Most oversold S&P since 2015, and dip buyers are using call spreads. When the bulls are this timid, the pain trade is up. I'd fade the cautious, not the bears.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/goldman-sachs-brian-garrett-the-2018", "id": 16}, {"cat": "venture", "urgency": "act", "source": "Michael Parekh / AI-RTZ #1277", "title": "Anthropic IPO: $83 vs a $70-78 range, $1.76T fully diluted, $119.5B raised, the biggest IPO ever", "idea": "Anthropic priced at $83, above its $70-78 range, and upsized to ~980M shares. 'ANT' opened at $111.50, hit ~$115 (+39%) and closed at $97.17 (+17%), a $1.76T fully diluted value. The greenshoe took the raise to $93.5B, or $119.5B including a $26B private placement, beating SpaceX's June IPO. It got there via a Pentagon dispute and nearly $900B of compute contracts. Day two gave back most of the pop as the AI sell-off spread from Asia. Parekh: 'Pepsi became Coke' on enterprise and coding.", "angle": "With two mega-IPOs (SpaceX, Anthropic) absorbing ~$200B+ of supply in 6 months, it's an equity-supply story as much as an AI story. Parekh expects the window to stay shut until OpenAI next year.", "tweetA": "$119.5B raised in one IPO. That's capital pulled out of every other AI name in a single week, and the S&P went from +12% to flat. Supply matters. $ANT", "tweetB": "$900B in compute contracts against a $1.76T valuation. Anthropic's market cap is barely 2x what it owes for compute. Bulls call that conviction. I call it the most leveraged bet on scaling laws ever listed.", "charts": {"count": 0, "hot": false, "desc": "Charts inside, worth opening."}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-ipo-aloft-nvidia-reigns", "id": 17}, {"cat": "AI/infra", "urgency": "act", "source": "Michael Parekh / AI-RTZ #1277", "title": "Nvidia without Jensen: $115.8B (+103%), $130B guide ex-China, $2.5T cloud backlog", "idea": "Q3 revenue was $115.8B (+103%), data center $107.6B (+110%), gross margin ~75%. The Q4 guide is $130B with nothing from China, where licensed shipments have stopped. Vera Rubin did nearly $20B in its first quarter of shipments. Interim CEO Colette Kress raised FY2028 growth to ~75% and put the cloud backlog at $2.5T. The board said Jensen won't return, and support for neoclouds will now be 'disciplined and selective' (WSJ).", "angle": "The fundamentals are excellent but the stock is down more than a third. The 'disciplined and selective' line on neoclouds matters most: it removes the financing backstop for $CRWV-style borrowers.", "tweetA": "$NVDA grew 103% and guided $130B with zero China, and the stock is down a third. The market isn't selling the numbers. It's selling the end of the 'Jensen put' that funded every neocloud.", "tweetB": "The most important words ", "id": 19}, {"cat": "AI/infra", "urgency": "watch", "source": "Michael Parekh / AI-RTZ #1277", "title": "TSMC steps into the vacuum: a $500M startup arm plus up to $500M each for Anthropic and OpenAI", "idea": "TSMC is setting up a $500M investment arm to back chip startups and, for the first time, its own suppliers. The same board meeting approved up to $500M each for Anthropic (at its IPO price) and OpenAI, plus ~$40.9B of new capital appropriations. Together with its 2021 fund that's up to $1.7B. Kevin Zhang called the lab stakes a 'reinforcing loop'. Parekh frames TSMC as the 'Fed of AI' on the supply side, opening a new window as the demand-side 'central bank' (Nvidia) loses its chair.", "angle": "It's small, at ~4% of same-day capex, but it's a behavior change: TSMC is moving up the stack into the labs. Vendor-financing loops are migrating from Nvidia to the foundry.", "tweetA": "TSMC never bought stakes two layers up the stack. It just approved $1B for Anthropic and OpenAI the same week Nvidia said it would be 'selective'. The AI vendor-financing baton just changed hands. $TSM", "tweetB": "$1B into AI labs against $40.9B of capex is ~2.4%. Tiny. But when the most conservative company in semis starts buying its customers' customers, it's telling you demand needs support.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-ipo-aloft-nvidia-reigns", "id": 20}, {"cat": "venture", "urgency": "deep", "source": "Michael Parekh / AI-RTZ #1277", "title": "The 'Jensen put' in numbers: $530B of off-balance-sheet guarantees, 27% of global VC deal value", "idea": "Nvidia did ~$140B of deals and guarantees in just two months this year (The Information) and disclosed $530B of gross off-balance-sheet guarantees as of Q2 (SemiAnalysis). The FT counts more than 120 investments this year. Nvidia did a record 129 venture deals, 27% of global VC deal value, and UBS estimates a pullback could take $50B+ out of the market. Parekh: 'the new central bank chair is a CFO', which amounts to a tightening of AI credit even if no one calls it that.", "angle": "This is AI quantitative tightening. If Nvidia stops writing checks, late-stage AI rounds and neocloud debt lose their anchor investor. Watch private marks and venture debt.", "tweetA": "$530B of off-balance-sheet guarantees is more than Nvidia's entire annualized revenue at the $130B guide (~$520B). The industry's biggest lender is now run by its CFO. That's AI quantitative tightening.", "tweetB": "One company was 27% of global VC deal value. Take it out and UBS sees $50B+ vanish. The VC market didn't have a funding boom, it had a customer-acquisition program.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-ipo-aloft-nvidia-reigns", "id": 21}, {"cat": "AI/infra", "urgency": "watch", "source": "Michael Parekh / AI-RTZ #1277", "title": "'Vulnageddon' and 'Handoverism': new labels for AI-driven vulnerability anxiety and agent ownership", "idea": "Parekh flags two themes. 'Vulnageddon': AI is accelerating the discovery of software vulnerabilities, which feeds social and governance anxiety (ARD #209 also tied AI to the recent outages). 'Handoverism': handing work over to agents, with Sunday's Part 2 asking who owns the agents in an economy of billions of AIs working for billions of people.", "angle": "Both are early narrative markers. Vulnageddon supports cyber spend ($CRWD, $PANW). Handoverism raises the question of who captures agent economics: model labs, platforms or users.", "tweetA": "AI finds bugs faster than humans can patch them. Call it Vulnageddon. Cyber budgets are about to stop being discretionary. $CRWD $PANW $ZS", "tweetB": "The real AI question for 2027 isn't 'how smart'. It's who owns the agent working for you: you, Apple, Google or the lab? Whoever answers that owns the next distribution layer.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-ipo-aloft-nvidia-reigns", "id": 22}];
