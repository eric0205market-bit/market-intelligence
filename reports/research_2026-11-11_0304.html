<script>
const ITEMS = [{"cat": "macro", "urgency": "red", "source": "Craig Shapiro / The Alethea Narrative", "title": "The Fed now treats AI capex as part of the inflation problem, not something to protect", "idea": "Core CPI printed 0.296% unrounded, the second straight 0.3%, on the same morning Waller said a 50bp December hike 'should be considered' at ~0.3% core. Waller also said lower oil shouldn't count as relief because energy may now pass through to core, and that the AI buildout is pushing tech goods prices higher. 2y +19bp to 4.75%, 2y real yield 2.52% (cycle high, ~40bp above pre-election), while long-run inflation expectations fell.", "angle": "Long-dated breakevens falling while real yields rise means the bond market rewards a Fed willing to hike. That's a bear-flattener with a credibility bid. Long-duration growth and gold are the losers, not the index.", "tweetA": "A Fed governor just named AI capex as an inflation input. For three years the trade was 'AI is disinflationary, so the Fed has your back.' The Fed just said the opposite out loud. $NVDA $QQQ", "tweetB": "2y real yield at 2.52%, the cycle high. Breakevens down. S&P barely off its pre-election level. One of these markets is wrong, and it isn't the one with the coupons.", "charts": {"count": 0, "hot": false, "desc": "No charts in email. Charts likely inside: worth opening"}, "link": "https://thealetheanarrative.substack.com/p/the-put-is-gone", "id": 1}, {"cat": "regulation", "urgency": "watch", "source": "Craig Shapiro / The Alethea Narrative", "title": "Governors-elect in TX, GA and OH ran on data-center moratoriums. Texas is ~30% of 2028 US capacity", "idea": "The Democratic sweep reached state level: governors-elect in Texas, Georgia and Ohio campaigned on moratoriums, pauses or strict conditions for new data-center construction. Texas alone is projected to hold nearly 30% of US data-center capacity by 2028. Shapiro calls it one of three surprises that removed the props under the AI trade.", "angle": "Permitting risk at state level is a 2028+ capacity problem, which makes existing powered shells scarcer. Long incumbents with operating MW and power contracts; short greenfield-dependent developers.", "tweetA": "If ~30% of 2028 US data-center capacity sits in a state whose incoming governor ran on a moratorium, the scarce asset is no longer GPUs. It's an energized, permitted building that already exists.", "tweetB": "Data-center politics just went from county zoning boards to the governor's mansion in TX, GA and OH. Watch where the 2027 site announcements go next: my guess is Arizona, the Mountain West and offshore.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thealetheanarrative.substack.com/p/the-put-is-gone", "id": 2}, {"cat": "positioning", "urgency": "deep", "source": "Craig Shapiro / The Alethea Narrative", "title": "The index can stay calm while AI suppliers fall 10%. Here's the checklist for when it can't", "idea": "VIX is ~20 and still below VIX3M; the S&P is barely below pre-election. Strong payrolls, 4.1% unemployment and holding credit argue against an index-wide break, and money is rotating into banks, healthcare and platforms. Escalation triggers: VIX above VIX3M or through 22, credit widening alongside rates, Fed Chair Warsh endorsing 50bp, USD/JPY through 160, and Nvidia's earnings reaction. 'The Fed put is gone for this cycle.'", "angle": "A clean pairs setup: short NDX/long SPX or short AI dependents vs banks until the triggers hit. USD/JPY 160 is the cross-asset tripwire to watch, because it brings intervention and carry-unwind risk.", "tweetA": "Five tripwires for this turning into a real selloff: VIX > VIX3M, VIX > 22, credit widening with rates, Warsh backing 50bp, USD/JPY > 160. None has fired yet. That's why the index looks fine while your AI book doesn't.", "tweetB": "Hikes into a strong economy compress multiples, not earnings. That's a relative-value tape, not a crash tape: short duration-heavy growth, long banks. Bears selling the index are fighting the wrong war. $KRE $QQQ", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thealetheanarrative.substack.com/p/the-put-is-gone", "id": 3}, {"cat": "culture", "urgency": "deep", "source": "Tim Pierotti / WealthVest Macro", "title": "Hubris as a bubble indicator: from Global Crossing to Hovnanian to Jensen", "idea": "Pierotti was in the room when Global Crossing's CEO mocked a skeptical hedge fund analyst in 1999 (bankrupt soon after), and when Ara Hovnanian belittled Ivy Zelman's 2007 housing warning (stock then fell 95%+). He reads the Huang affair, allegedly with someone tied to a firm suspected of smuggling embargoed chips, and his willingness to be photographed with her, as the same 'untouchable' psychology. Add Musk's failed cybercab and DOGE predictions, and his claim that AI makes saving unnecessary.", "angle": "Behavioral tells (CEOs mocking skeptics, governance laxity) tend to cluster near tops. It's not a timing signal, but it does argue for cutting gross exposure and tightening stops on key-person-heavy names.", "tweetA": "Two times I've seen a CEO laugh at the bear in the room: Global Crossing in '99 and Hovnanian in '07. Hubris isn't a valuation metric, but it has a perfect record of showing up at the top.", "tweetB": "Key-person risk used to be a footnote in the 10-K. Now one CEO's personal life can take $1.2T off a market cap in 10 sessions. Price that premium into every founder-led megacap. $NVDA $TSLA", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://wealthvest.substack.com/p/the-age-of-hubris-and-delusion", "id": 4}, {"cat": "positioning", "urgency": "deep", "source": "Tim Pierotti / WealthVest Macro", "title": "Sponsors own the banks' fee pool, so sell-side models plug in any TAM a 'rockstar' CEO names", "idea": "Pierotti argues that non-bank sponsors (PE and VC, which own much of the AI universe) have unprecedented leverage over investment banks, so analysts avoid upsetting them. If Musk says SpaceX's annual TAM is just shy of US GDP, 'plug that into the model.' Institutions discount it, but most retail investors treat bank DCFs and price targets as real forecasts. He says the sycophancy now exceeds the Meeker/Grubman era.", "angle": "As AI IPOs come (Anthropic, SpaceX), sell-side initiation targets carry even less information than usual. Retail ETF inflows chasing those targets could be the marginal buyer at the top.", "tweetA": "A TAM roughly equal to US GDP, for a single company, typed into a DCF with a straight face. That's not research. It's a fee-pool invoice.", "tweetB": "The 2000 analyst scandal was banks pleasing issuers. The 2026 version is banks pleasing the sponsors who own the issuers and control the deal flow. Same conflict, one layer removed, and harder to regulate.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://wealthvest.substack.com/p/the-age-of-hubris-and-delusion", "id": 5}, {"cat": "ai/infra", "urgency": "red", "source": "Bespoke Investment Group", "title": "NVDA -18.5% in 5 days, the biggest 5-day drop since Oct 2022, and heading for $160 support", "idea": "NVDA has lost close to 30% since an all-time high just over a month ago and is near its 52-week low. Its 5-day decline of 18.5% is the largest since October 2022. Since spring 2023, only the 2025 tariff tantrum produced a deeper drawdown. Bespoke flags ~$160, the top of the late-2024/early-2025 range, as support over the last 12-18 months.", "angle": "~30% drawdowns in NVDA have historically been buyable, but this one carries governance and export-control risk that the tariff tantrum didn't. The level to watch is $160 into earnings.", "tweetA": "NVDA's fastest 5-day drop since the 2022 bear-market low, and the cause isn't demand. It's the CEO. Demand problems take quarters to fix; governance problems get fixed by a board in a weekend. Which one do you think it is? $NVDA", "tweetB": "$160 on NVDA was the ceiling in early 2025 and has been the floor ever since. If a key-person scandal breaks that level, the chart says it was never really about the scandal.", "charts": {"count": 1, "hot": true, "desc": "Log-scale NVDA since the 2022 bear-market bottom, with the $160 support band and drawdown history: 🔥 CHART WORTH SAVING"}, "link": "https://bespokeinvest.substack.com/p/nvdas-woes-push-it-toward-52-week", "id": 6}, {"cat": "positioning", "urgency": "deep", "source": "Bespoke Investment Group", "title": "NVDA has decoupled from the SOX, its own index: SOX +7% on a day NVDA fell 4%", "idea": "NVDA is the largest SOX component, yet on Monday the SOX rallied close to 7% while NVDA fell more than 4%. Today the SOX fell 1.2% while NVDA fell 5%+. NVDA has underperformed the SOX by more than 12 points since Election Day, and there were three other one-week periods in the past year with even wider underperformance. Bespoke's point is that lower correlation is a cushion: this week could have been much worse.", "angle": "Semis dispersion is now a tradable factor: long SOX ex-NVDA (memory, semicap, networking) vs NVDA. It also says the market is isolating idiosyncratic risk rather than de-rating AI.", "tweetA": "The SOX up 7% on a day its biggest component fell 4%. That isn't an AI selloff. It's the market writing a single-name governance discount on one stock. $SMH $NVDA", "tweetB": "Correlation is the hidden hedge. If NVDA still traded like the SOX, this week would have been an AI crash headline. Instead it's a rotation inside the sector. Watch whether $MU and $AMAT keep catching that money.", "charts": {"count": 1, "hot": false, "desc": "NVDA vs SOX relative performance chart"}, "link": "https://bespokeinvest.substack.com/p/nvdas-woes-push-it-toward-52-week", "id": 7}, {"cat": "macro", "urgency": "red", "source": "Stephen Innes / Dark Side of the Boom (Fed)", "title": "Size of the next hike vs length of the cycle: the distinction the bond market just ignored", "idea": "Waller said December remains his preference even on a soft print and that 50bp is on the table if inflation surprised to the upside (it did: headline +0.4%, core +0.3%). He also said communicated tightening needn't come at consecutive meetings, closer to an every-other-meeting path. 2y jumped toward 4.73%, its biggest daily rise since April 2025, and a poorly received 10y auction cleared above 5%. Logan backs at least two more 25bp hikes, possibly sooner.", "angle": "If 50bp-then-pause becomes the base case, the front end has overshot and 2s are a buy on the back of the move. If Logan's 'faster' framing wins, the 10y through 5% becomes the equity problem.", "tweetA": "Faster isn't the same as further. '50 and pause' gets you to the same terminal rate as two 25s with an extra meeting off. The 2y just priced the scary version of both. $TLT $ZT", "tweetB": "10y auction clearing above 5%, on a day Brent broke $90. Real money doesn't want duration even with oil falling. That's a term-premium story, not an inflation story.", "charts": {"count": 0, "hot": false, "desc": "Charts inside: worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/did-the-fed-just-put-a-50-basis-point", "id": 8}, {"cat": "energy", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom (Fed)", "title": "Brent below $90 for the first time since August while bonds ignore it, and EU gas storage sits at 72% vs 89% normal", "idea": "Brent briefly broke $90 on US-Iran negotiation optimism after Trump said further strikes were unnecessary; Brent and WTI are below their 100- and 200-day moving averages. The weakness is physical, not just paper: Brent's prompt spread is at its weakest since late August, diesel cracks have fallen sharply, and US gasoline is below $4. The risk: European gas inventories are ~72% full vs a 5-year seasonal average of 89%.", "angle": "Oil weakness is disinflation the Fed explicitly says it won't count yet, so it's a lagging tailwind for bonds in Q1. The EU gas gap is the asymmetric winter tail: long TTF calls are cheap convexity.", "tweetA": "Brent below $90, diesel cracks collapsing, gasoline under $4. And the Fed's message is 'we're not counting it.' Fine, but CPI will, starting in about 6 weeks. $USO $TLT", "tweetB": "Everyone's watching oil fall. Nobody's watching European gas storage: 72% full vs an 89% seasonal norm, going into winter. A cold January turns an energy disinflation story into an energy shock again.", "charts": {"count": 0, "hot": false, "desc": "Charts inside: worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/did-the-fed-just-put-a-50-basis-point", "id": 9}, {"cat": "positioning", "urgency": "red", "source": "Stephen Innes / Dark Side of the Boom (Fed)", "title": "Monday was a vol-crush squeeze; Tuesday hedge funds were 10% better for sale, with $31B of CTA supply ahead", "idea": "Nomura's McElligott called Monday's rally an extraordinary vol crush driven by dealer hedging and short covering. On Tuesday, Goldman's desk had hedge funds ~10% better for sale and long-onlys trimming tech. The Nasdaq 100 rallied into its 200-day on Monday and failed there. Goldman estimates CTAs could sell ~$31B of S&P futures over the next week regardless of direction. Since the election, NDX is -2%, the Russell is flat and the Dow is modestly up.", "angle": "Mechanical supply plus a rejection at the 200-day argues for fading rallies in NDX this week. Buy only after CTA selling exhausts and vol sellers return.", "tweetA": "Monday: short covering and dealer gamma. Tuesday: real holders selling into it. The tell was NDX tagging its 200-day and rolling over. Mechanical rallies don't survive contact with fundamental sellers. $QQQ", "tweetB": "$31B of CTA S&P supply over the next week, 'regardless of direction.' Meanwhile retail ETFs took in $12B a day buying the dip. Watch which flow blinks first.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/did-the-fed-just-put-a-50-basis-point", "id": 10}, {"cat": "ai/infra", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom (Fed)", "title": "NVDA: ~7% of S&P weight, ~25% of S&P return variance, and $1.2T lost in 10 sessions", "idea": "Nvidia has lost close to $2T from its highs, including ~$1.2T over the past ten sessions, amid reports of FBI interest and possible congressional subpoenas over Jensen Huang's relationship (the foreign-intelligence allegations are unproven). Nvidia is estimated to contribute ~25% of S&P 500 return variance on ~7% of index weight. Neoclouds and optical networking were again among the worst performers.", "angle": "A 3.5x variance-to-weight ratio means index vol is effectively NVDA vol. SPX hedges should be cheaper as NVDA single-stock puts plus long equal-weight.", "tweetA": "NVDA is 7% of the S&P and 25% of its variance. Your 'diversified' index fund is a leveraged bet on one CEO's legal team. $SPY $RSP", "tweetB": "$1.2T in 10 sessions is more than the entire market cap of all but a handful of companies on earth. It evaporated on a governance story, not an earnings miss. That's what a crowded, key-person premium looks like when it unwinds.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/did-the-fed-just-put-a-50-basis-point", "id": 11}, {"cat": "credit", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom (Fed)", "title": "Credit draws the line: hyperscalers can absorb higher rates, neoclouds can't", "idea": "HY tech spreads widened, chipmaker credit stayed under pressure, and data-center CDS eased only modestly. CoreWeave spreads tightened but stayed above 1,000bp. Innes frames it as balance-sheet strength vs financing dependency: hyperscalers have cash flows, while suppliers and financiers of the buildout don't share that protection. 'The bond market wants to know what the debt costs and when the cash arrives.'", "angle": "This is the cleanest way to express AI-financing skepticism without fighting AI demand: long hyperscaler IG, short neocloud HY / CDS protection on the leveraged builders.", "tweetA": "Same AI demand, two balance sheets. Microsoft funds data centers from cash flow; CoreWeave funds them at 1,000bp+ over Treasuries. When rates rise, one of those business models gets repriced and the other doesn't notice. $MSFT $CRWV", "tweetB": "The equity market argues about AI revenue in 2030. The credit market asks one question: can you refinance in 2027 at these rates? Credit always answers first.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/did-the-fed-just-put-a-50-basis-point", "id": 12}, {"cat": "gold", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom (Fed)", "title": "Gold back toward $4,000 as the dollar-and-real-rates link snaps back", "idea": "The dollar surged toward one-month highs, near the top of its 21-month range, as front-end yields exploded. Gold was knocked below $4,100 toward $4,000. The recent inverse correlation with oil gave no protection, and the equity selloff didn't help either. 'When the Fed repricing becomes violent enough, the old dollar-and-rates relationship can reassert itself in a hurry.'", "angle": "Pair this with Alethea's note that gold now trades on real yields: with the 2y real at 2.52%, gold has lost its macro bid in the short run. $4,000 is the line for adding back.", "tweetA": "Gold spent a year ignoring real yields. One violent front-end repricing and the 2010s correlation is back. $4,000 is where we find out if the central-bank bid is still there. $GLD", "tweetB": "Gold down on a hot CPI print. If gold can't rally on inflation, it's trading as a real-rate asset again, and the Fed just told you real rates are going up.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/did-the-fed-just-put-a-50-basis-point", "id": 13}, {"cat": "crypto", "urgency": "red", "source": "Stephen Innes / Dark Side of the Boom (Fed)", "title": "Bitcoin below $75,000, three-month lows, as the dollar rips", "idea": "Bitcoin slid beneath $75,000 to three-month lows alongside gold's drop, as the dollar moved toward the top of its 21-month range and 2y yields posted their biggest jump since April 2025.", "angle": "BTC is trading as a liquidity/real-rate asset, not a debasement hedge. A dollar breakout above the 21-month range is the risk for the next leg down.", "tweetA": "BTC and gold fell together on a hot CPI print. So much for inflation hedges. Both are trading the Fed's reaction function, not inflation itself. $BTC $IBIT", "tweetB": "BTC at 3-month lows while banks pour $270M into a stablecoin venture. Wall Street is buying the rails and selling the asset.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/did-the-fed-just-put-a-50-basis-point", "id": 14}, {"cat": "venture", "urgency": "watch", "source": "Stephen Innes / Dark Side of the Boom (Fed)", "title": "Anthropic reportedly prepping a Nasdaq listing at ~$1.4T, down from talk near $2T", "idea": "Anthropic is reportedly preparing a Nasdaq IPO at a valuation around $1.4T, below earlier figures approaching $2T. Innes' angle: data-center construction limits make existing capacity more valuable. That favors compute owners over AI labs that must rent it, so Anthropic has an incentive to raise while investors still pay a trillion-dollar multiple.", "angle": "A 30% valuation cut before listing is a price-discovery signal for private AI marks (OpenAI, xAI). If rental scarcity grows, labs' gross margins get squeezed by the neoclouds and hyperscalers that own capacity.", "tweetA": "Anthropic's reported IPO valuation went from ~$2T to ~$1.4T before a single share traded. That's a $600B markdown in private-market talk alone. Every VC holding AI paper at the last round should be doing the math.", "tweetB": "Moratoriums flip the AI value chain: when you can't build new capacity, the landlord beats the tenant. Labs rent compute. The owners of the buildings and power contracts get the scarcity rent.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/did-the-fed-just-put-a-50-basis-point", "id": 15}, {"cat": "credit", "urgency": "red", "source": "Stephen Innes / Dark Side of the Boom (CoreWeave)", "title": "CoreWeave's Q4 interest bill is $1.05-1.15B, about 1.4x adjusted operating income", "idea": "CoreWeave guided Q4 interest of $1.05-1.15B, up from $846M in Q3 and ~$388M a year ago: a ~$4.4B annualized run rate. Even if Q4 operating income hits the upgraded guide, interest is ~1.4x adjusted operating income. Debt rose from $35.1B to $46.9B in one quarter (+$11.8B, about $128M per day), while revenue rose by just over $1B. A 10% after-hours pop to $54 mostly faded.", "angle": "When interest exceeds operating income, the equity is an option on refinancing terms. The trade is the capital structure, not the stock: equity holders are subordinated to a 15%-yielding bond stack.", "tweetA": "CoreWeave added $128 million of debt every day last quarter, weekends included. Revenue rose about $11M a day. The demand is real. The question is who it's real for: shareholders or bondholders. $CRWV", "tweetB": "Interest expense at 1.4x operating income isn't a growth company. It's a utility with a junk balance sheet and no rate base. The beat was real; the after-hours pop fading was the market reading the footnotes.", "charts": {"count": 0, "hot": false, "desc": "Charts inside: worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/coreweave-the-ai-boom-is-alive-and", "id": 16}, {"cat": "ai/infra", "urgency": "watch", "source": "Stephen Innes / Dark Side of the Boom (CoreWeave)", "title": "Only 37% of CoreWeave's contracted power is live: 1.7GW active vs 4.6GW contracted", "idea": "Backlog reached $132.5B, up from $104.2B in June and ~2.4x a year ago, so demand isn't evaporating. But only ~1.7GW of 4.6GW contracted power is active (37%, down from 41% last quarter). The year-end active target is just over 1.85GW. More than 1.3GW of contracted capacity sits outside the US (India, Indonesia, Spain), a partial hedge against US data-center politics.", "angle": "The falling active-to-contracted ratio is the KPI to track: contracts are compounding faster than energization. Power gear and grid-interconnect suppliers are the bottleneck winners. $GEV $ETN $VRT", "tweetA": "CoreWeave signs contracts faster than it can energize them: 4.6GW contracted, 1.7GW live, and that ratio got worse this quarter. The bottleneck isn't GPUs or demand. It's transformers and interconnects.", "tweetB": "1.3GW of CoreWeave's pipeline is now in India, Indonesia and Spain. US state politics is quietly pushing AI capacity offshore. Watch where the next neocloud contracts get signed.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/coreweave-the-ai-boom-is-alive-and", "id": 17}, {"cat": "credit", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom (CoreWeave)", "title": "$9B in customer prepayments: a lifeline, or AI money going in a circle?", "idea": "CoreWeave expects ~$9B of customer prepayments and deposits over the next three months. Innes notes that a prepayment from Microsoft or Alphabet is fresh capital, while one from an AI lab that must raise money itself just moves cash around the same ecosystem. Street estimates of incremental financing to execute the backlog run $22.9B (with 20% prepayments), $36.7B (without) and up to $76B (conservative). 2031 bonds yield above 15%, and CDS traded above 1,100bp pre-print.", "angle": "The prepayment counterparty mix is the single most important disclosure in the next 10-Q. A $22.9B-to-$76B range means the equity is mostly a financing-assumption bet.", "tweetA": "Financing need to execute CoreWeave's backlog: $22.9B, $36.7B or $76B, depending on who you ask. When the range is 3x wide, you're not valuing a business. You're valuing a capital-markets assumption. $CRWV", "tweetB": "Lab raises from investors → lab prepays neocloud → neocloud buys GPUs → GPU maker invests in lab. Count how many times the same dollar shows up as 'revenue' in that loop.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/coreweave-the-ai-boom-is-alive-and", "id": 18}, {"cat": "ai/infra", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom (CoreWeave)", "title": "CoreWeave operating engine: revenue +168%, 62% EBITDA margin, and a $7.5B quarterly cash hole", "idea": "Q3 revenue rose 168% y/y to $3.66B; adjusted EBITDA was $2.26B (62% margin) and adjusted operating income of $379M beat by 50%+. FY revenue guidance rose to $13.0-13.3B, with a $20-21B annualized exit rate. But capex hit $14.5B (~8x y/y), and cash PP&E spend of $9.44B against ~$2B operating cash flow left a ~$7.5B quarterly gap ($17.9B over nine months). $10.6B of debt is due within 12 months vs $4.1B unrestricted cash; including $18.7B of leases, fixed obligations reach ~$65.6B. Payables fell ~$1.5B.", "angle": "Read the CoreWeave print as evidence that AI compute pricing is holding, which is bullish for upstream GPUs, memory and optics, even while the CRWV capital structure stays a short.", "tweetA": "62% EBITDA margins and a $7.5B cash burn in the same quarter. Both are true. EBITDA tells you GPU rental pricing is holding up; the cash flow statement tells you who's paying for the GPUs.", "tweetB": "Read past the CoreWeave headline: GPU rental pricing is strong enough to lift margins a quarter early. That's the best demand datapoint the AI complex has had in weeks, and it came from the most-shorted name in the space. $NVDA $MU", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/coreweave-the-ai-boom-is-alive-and", "id": 19}, {"cat": "venture", "urgency": "deep", "source": "TWiST Newsletter", "title": "Cloudflare's rule: no team may more than double its headcount in 12 months", "idea": "Cloudflare CEO Matthew Prince (Logan Bartlett Show, 2023) enforces a hard cap: neither the company nor any single team may more than double headcount within 12 months. The reason: once new hires outnumber veterans, culture is set by 'majority vote' and drifts unpredictably. Prince says the rule is hard for founders to hold, but 'every time we broke the rule it caused a problem.'", "angle": "A useful diligence screen for hypergrowth AI startups and neoclouds: teams growing more than 2x a year are an execution-risk flag. It's also a reminder that AI-native firms can scale revenue without breaking the cap.", "tweetA": "Cloudflare's rule: no team more than doubles in a year, because culture is a majority vote and new hires win it. AI startups going 10 to 200 people in 12 months should take note.", "tweetB": "In the AI era, the interesting version of Prince's rule is reversed: revenue can now grow 10x while headcount grows 1.5x. The companies that never need to break the 2x cap are the ones to own.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/cap-headcount-growth-at-2x-per-year", "id": 20}, {"cat": "crypto", "urgency": "watch", "source": "Michael McDonough / The Pressure Point", "title": "Banks are buying options on competing blockchain rails, not choosing one", "idea": "Citi, Goldman and Deutsche committed ~$270M to bank-backed stablecoin venture Project Faro, and the same day Alta raised a $47.5M Series A for a privacy- and compliance-focused institutional chain. Separately, NYSE picked Avalanche ledger tech for tokenized-stock settlement, Fidelity Digital Assets calls Solana a major venue for on-chain finance, and PNC expanded USDC corporate payments with Coinbase. The thesis: stakes buy access, information and pricing leverage without migrating core ledgers. The signal to watch is exclusive, production-scale contracts.", "angle": "There's no single institutional-chain winner yet. Infrastructure that is neutral across rails (custody, compliance tooling, USDC issuer economics) captures value regardless. $COIN $CRCL", "tweetA": "Citi, Goldman, Deutsche: $270M into one stablecoin venture. NYSE: Avalanche. PNC: USDC on Coinbase. Fidelity: Solana. Wall Street isn't picking a chain. It's buying a call option on all of them to keep fees down. $AVAX $SOL", "tweetB": "The tell for when tokenization gets real isn't another funding round. It's the first exclusivity clause: one asset class, one rail, everything else wound down. Until then, it's banks paying for leverage over vendors.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-every-rail-is-a-bargaining-chip/", "id": 21}, {"cat": "regulation", "urgency": "deep", "source": "Michael McDonough / The Pressure Point", "title": "UK FCA restricts six firms over anti-money-laundering controls", "idea": "The FCA restricted six firms over concerns about their AML policies, controls and procedures. McDonough's point: regulators can restrict activity over required controls regardless of a network's speed, and different jurisdictions may reach different conclusions about the same architecture. That makes a single global commitment to one rail especially risky and favors designs where regulated institutions enforce identity and transaction controls.", "angle": "This supports permissioned, compliance-native chains and bank-issued tokens over pure public-rail exposure for institutional flows. It's a headwind for public-chain TPS narratives in regulated finance.", "tweetA": "Six UK firms restricted over AML controls. In regulated finance, the winning blockchain won't be the fastest one. It'll be the one a compliance officer can switch off.", "tweetB": "Jurisdictional fragmentation is the real moat in tokenization: if London and Washington disagree on the same architecture, banks need several rails by law. Multi-chain is a compliance requirement, not a hedge.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-every-rail-is-a-bargaining-chip/", "id": 22}, {"cat": "geopolitics", "urgency": "red", "source": "Michael McDonough / The Pressure Point", "title": "Senior US Army soldier arrested in the UK on suspicion of helping Russian intelligence; Nvidia hires an ex-prosecutor for its Huang probe", "idea": "British police arrested a senior US Army soldier on suspicion of assisting Russian intelligence, according to UK authorities and FBI Director Kash Patel. In the same roundup, Nvidia hired a former acting US attorney to investigate intelligence agencies' belief that Jensen Huang had a relationship with a suspected Chinese spy.", "angle": "Counter-intelligence headlines in defense and AI supply chains raise the odds of tighter export controls and security-clearance requirements on chip and AI personnel. That's a tail risk for China-exposed semis.", "tweetA": "Two counter-intelligence stories in one news cycle: a US soldier arrested in Britain for Russia, and Nvidia hiring a prosecutor over its CEO and a suspected Chinese spy. The national-security state is now inside the AI trade.", "tweetB": "Nvidia hiring a former US attorney means the board expects subpoenas. Export-control hawks in the new Congress just got their best case study ever. Price more risk into $NVDA's China exposure, not less.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-every-rail-is-a-bargaining-chip/", "id": 23}, {"cat": "geopolitics", "urgency": "deep", "source": "Michael McDonough / The Pressure Point", "title": "Post-midterm leadership: GOP picks Jim Jordan after losing the House, Thune survives a revolt, Sanders won't back Schumer", "idea": "House Republicans elected Jim Jordan as leader after losing control of the chamber. Senate Republicans re-elected John Thune despite a late challenge from the right led by Ron Johnson. Bernie Sanders said he won't support Chuck Schumer for Senate majority leader in the next Congress, which points to a left-flank fight over who leads the new majority.", "angle": "A Democratic House plus a fractious Senate majority means gridlock on fiscal policy but more aggressive oversight: subpoenas (Nvidia), credit-card rate caps, and data-center scrutiny.", "tweetA": "Jordan as minority leader is a confrontation choice, not a comeback one. Expect a 2027 House defined by oversight hearings against oversight hearings. That means headline vol for the sectors in the crosshairs: AI, banks, pharma.", "tweetB": "Sanders refusing to back Schumer is the under-covered story. If the progressive wing sets the new majority's agenda, card-rate caps and data-center moratoriums stop being fringe positions. $COF $SYF", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-every-rail-is-a-bargaining-chip/", "id": 24}, {"cat": "credit", "urgency": "watch", "source": "Michael McDonough / The Pressure Point", "title": "US credit card balances +$22B (+1.7%) in Q3 as Democrats push interest-rate caps", "idea": "US credit card balances rose $22B, or 1.7%, in the third quarter, while some Democratic lawmakers pressed to cap card interest rates. That arrives just after a midterm sweep that gives them the House.", "angle": "A rate cap is the biggest regulatory tail risk for card-heavy lenders. Even if it doesn't pass, headline risk now has a congressional majority behind it.", "tweetA": "Card balances +$22B in a quarter, with 2y yields at 4.75% and the Fed debating 50bp. And the new House majority's answer is a rate cap. That's a margin squeeze for card issuers from both directions. $COF $SYF $AXP", "tweetB": "A rate cap sounds pro-consumer until you model it: lenders cut limits for subprime borrowers first. The second-order effect is a credit crunch at the bottom of the K, right when the Fed is hiking.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-every-rail-is-a-bargaining-chip/", "id": 25}, {"cat": "tech", "urgency": "watch", "source": "Michael McDonough / The Pressure Point", "title": "Oura acquires Counsel Health, a medical AI chatbot startup", "idea": "Oura agreed to acquire Counsel Health, a medical AI chatbot startup, announcing the deal alongside quarterly earnings.", "angle": "Wearables are moving from data collection to AI-mediated care advice. Wearable-plus-LLM triage puts pressure on telehealth (HIMS, TDOC) and raises regulatory questions about AI medical advice.", "tweetA": "Oura buying a medical AI chatbot is the wearable industry admitting the ring isn't the product. The product is a doctor-shaped interface on top of your biometrics.", "tweetB": "Whoever owns 24/7 biometric data plus a medical LLM owns triage, the front door of healthcare. Telehealth companies should be more worried about a ring company than about each other. $TDOC $HIMS", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-every-rail-is-a-bargaining-chip/", "id": 26}, {"cat": "macro", "urgency": "red", "source": "Daily Chartbook (DC Lite #718)", "title": "October CPI: hot on every exclusion you try", "idea": "Konczal (via DC): 'Food and energy came in hot. But if you exclude that, goods came in hot. But if you exclude that, shelter came in hot. But if you exclude that, the rest of core non-housing services came in hot. If you exclude that, then, well, there's nothing left.'", "angle": "Broad-based heat across goods, shelter and supercore is what justifies Waller's 50bp talk. It also undercuts the 'oil will do the Fed's work' argument from Innes.", "tweetA": "Strip out food, energy, goods, shelter and supercore, and you're left with nothing. When every exclusion is still hot, this isn't a shock. It's the trend. $TLT", "tweetB": "Innes says falling oil will do the Fed's work. Konczal's breakdown says goods, shelter and supercore were all hot without oil. One of those views needs to be wrong by December.", "charts": {"count": 1, "hot": true, "desc": "Konczal CPI component breakdown chart: 🔥 CHART WORTH SAVING"}, "link": "https://www.dailychartbook.com/p/we-may-be-getting-closer-to-the-turn-0732", "id": 27}, {"cat": "labor", "urgency": "deep", "source": "Daily Chartbook (DC Lite #718)", "title": "Zandi: AI has net-created 786k of 4.1M jobs since ChatGPT, nearly a third of last year's gains", "idea": "Mark Zandi estimates that since ChatGPT launched four years ago, the economy has added 4.1M jobs, of which AI is responsible for 786,000 net of substitution, nearly one-fifth. Over the past year, AI contributed 284,000 of 943,000 jobs, nearly a third.", "angle": "This links back to the Fed item: if AI capex is ~30% of job growth and pushing tech goods prices up, AI is pro-cyclical and inflationary in the near term. That explains Waller's stance.", "tweetA": "AI drove nearly a third of US job creation last year, per Zandi, mostly through building it. Data centers, power, construction. A moratorium on data centers is now a labor-market policy.", "tweetB": "Funny how the 'AI will kill jobs' story flipped. 284k of the last 943k jobs came from AI. If capex slows on rate hikes and moratoriums, that third of job growth goes away first. Labor is now levered to the capex cycle.", "charts": {"count": 1, "hot": false, "desc": "Zandi chart of AI-attributed job creation"}, "link": "https://www.dailychartbook.com/p/we-may-be-getting-closer-to-the-turn-0732", "id": 28}, {"cat": "positioning", "urgency": "watch", "source": "Daily Chartbook (DC Lite #718)", "title": "SG cross-asset momentum: risk-off for a 10th week, one short of the 2022 record", "idea": "SocGen's XMOMO is at 36%, cautious for a 10th straight week. Only the 2022 Fed hiking cycle produced a longer risk-off signal, at 11 weeks. Kabra: 'Risk-off is getting old... We may be getting closer to the turn.'", "angle": "Contrarian setup: long risk-off streaks usually end with a sharp reversal. But the only longer streak happened during a hiking cycle, and we may be entering one now. Wait for the signal to flip.", "tweetA": "The only longer risk-off streak in SocGen's momentum model was 2022, and that was a Fed hiking cycle. Week 11 would tie it, as Waller floats 50bp. 'Closer to the turn' depends on which turn.", "tweetB": "10 weeks of risk-off signal, record retail dip-buying, and a STAX at 4-year highs. Systematic money is out; retail is all in. That's a positioning gap, and it closes one way or the other.", "charts": {"count": 1, "hot": false, "desc": "SG XMOMO cross-asset momentum indicator history"}, "link": "https://www.dailychartbook.com/p/we-may-be-getting-closer-to-the-turn-0732", "id": 29}, {"cat": "positioning", "urgency": "deep", "source": "Daily Chartbook (DC Lite #718)", "title": "Schwab Trading Activity Index hits a 4-year high as retail bought the semis dip", "idea": "Schwab's STAX rose to a fresh 4-year high in October as clients bought the tech dip, semiconductors in particular.", "angle": "Retail is long semis into a governance-driven NVDA drawdown and a hawkish Fed. That's fuel for capitulation if $160 breaks.", "tweetA": "Schwab clients bought the semis dip hard enough to push STAX to a 4-year high. Then NVDA fell 18.5% in 5 days. Retail is now the bagholder of the Jensen discount. $NVDA $SOXL", "tweetB": "The last time retail engagement peaked like this was late 2021, right before a Fed hiking cycle. Sound familiar?", "charts": {"count": 1, "hot": false, "desc": "Schwab STAX history"}, "link": "https://www.dailychartbook.com/p/we-may-be-getting-closer-to-the-turn-0732", "id": 30}, {"cat": "positioning", "urgency": "deep", "source": "Daily Chartbook (DC Lite #718)", "title": "ETF investors put in ~$12B a day over 5 days, and the top 17 ETFs by inflow were all equity", "idea": "Balchunas: ETF investors 'DEVOURED' the dip, with ~$12B/day of flows over the past 5 days, and the top 17 ETFs by flow were all equity (he's not sure he's ever seen that). 'Vanguardians and degens are very different people playing very different games but they agree on one thing: you buy the dip.'", "angle": "Passive inflows at this pace are the structural bid offsetting CTA supply. But if they're concentrated in cap-weighted funds, they're buying more NVDA at 25% of variance.", "tweetA": "$12B a day into ETFs and every one of the top 17 is equity. Retail is the most reliable buyer on Wall Street, and it's running into $31B of CTA supply this week. $VOO $SPY", "tweetB": "Dip-buying at $12B/day works until the dip is caused by the Fed instead of a headline. In 2022, retail bought every dip of the hiking cycle and still lost 25%.", "charts": {"count": 1, "hot": false, "desc": "Balchunas ETF flow leaderboard"}, "link": "https://www.dailychartbook.com/p/we-may-be-getting-closer-to-the-turn-0732", "id": 31}];
