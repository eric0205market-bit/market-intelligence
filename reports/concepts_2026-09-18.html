cal feedback rather than marketing.", "speaker": "Amanda Amos & Andrew Montgomery", "type": "anecdote", "entities": ["Dr. Max Goldstein", "Dr. Max's"], "conviction": "medium", "so_what": "Founder-embedded distribution (a practicing physician's own patient base) is a repeatable origination pattern worth screening for in consumer health deals.", "quote": "Born out of organic demand from over 30,000 patient visits, Dr. Max spent 5 years prototyping products in his kitchen before commercializing his modern apothecary.", "locator": "Born out of organic demand from over 30,000 patient visits", "quote_verified": true}]}, {"theme": "Clean-label consumer demand and exit comps", "insights": [{"claim": "The natural personal-care exit opportunity is anchored by comparables the investors cite directly: Burt's Bees sold for $925m in 2007, Coterie reportedly sold for over $1b, and Eucerin plus Aquaphor generate roughly €1.5b in annual revenue.", "speaker": "Amanda Amos & Andrew Montgomery", "type": "data_point", "entities": ["Burt's Bees", "Coterie", "Eucerin", "Aquaphor", "natural personal care"], "conviction": "high", "so_what": "Gives a concrete TAM and exit-value frame for the clean personal-care category; strategics (Clorox-type acquirers and Beiersdorf-scale incumbents) remain the likely liquidity path.", "quote": "Burt’s Bees (sold for $925m in 2007), Coterie (sold for a reported $1b+) and Eucerin + Aquafor generating €1.5b revenue annually, establish the economic opportunity.", "locator": "We believe their organic traction is setting the foundation", "quote_verified": true}, {"claim": "Parents are increasingly acting as amateur toxicologists — parsing ingredient labels and Yuka scores — creating structural demand for clean-ingredient products that simply work.", "speaker": "Amanda Amos & Andrew Montgomery", "type": "causal", "entities": ["Yuka", "parents", "clean-label consumer goods"], "conviction": "high", "so_what": "Ingredient-transparency apps are shifting consumer behavior at point of purchase; legacy personal-care incumbents with complex formulations face share loss to clean-label challengers.", "quote": "In an era where parents are expected to be amateur toxicologists, navigating complicated ingredient labels and judging Yuka scores in their diaper caddies", "locator": "In an era where parents are expected to be amateur toxicologists", "quote_verified": true}, {"claim": "Baby care is one of the highest-consideration purchases for families, so a trusted first product can be expanded into a lifetime family-care platform with unusually high loyalty.", "speaker": "Amanda Amos & Andrew Montgomery", "type": "thesis", "entities": ["Dr. Max's", "baby care", "family care"], "conviction": "high", "so_what": "The upside case rests on category expansion beyond baby care — watch for line extensions as the proof point that justifies a generational-brand valuation.", "quote": "In consumer, few are more loyal than a parent who has found the “thing” that finally works.", "locator": "Baby care is one of the highest consideration purchases", "quote_verified": true}]}], "insight_total": 7, "top_entities": ["Dr. Max's", "Dr. Max Goldstein", "Collab Fund", "Erewhon", "Burt's Bees", "Coterie", "Eucerin", "Aquaphor", "Yuka", "EWG", "National Eczema Association", "baby care"], "source_meta": {"author": "Amanda Amos & Andrew Montgomery", "word_count": 326, "paywalled": false}}, {"record_id": "6d6e5c082d1fc339", "source_type": "concepts", "source_name": "Oxford Economics", "source_url": "https://www.oxfordeconomics.com/resource/the-worlds-top-10-cities-by-economic-strength-in-2026/", "title": "The world’s top 10 cities by economic strength in 2026", "published_date": "2026-09-17", "language": "en", "processed_at": "2026-09-18T11:09:42Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "AI", "Tech", "Geopolitics", "Energy"], "gist": "Oxford Economics' 2026 Global Cities Index scores 1,000 cities on a six-measure Economics composite (GDP size, GDP growth, stability, GDP per capita, employment growth, diversity), and finds nine of the top 10 economic cities are American, with New York first on a metro economy nearly double Tokyo's or LA's. Beneath the incumbents, AI- and trade-driven mid-sized cities — Hsinchu, Kuala Lumpur, Shenzhen, Bengaluru, Ho Chi Minh City, Riyadh, Port Said and Suez — are closing the gap fastest.", "themes": [{"theme": "Composite scoring methodology", "insights": [{"claim": "Oxford Economics' Global Cities Index ranks the 1,000 largest cities across five categories — Economics, Human Capital, Quality of Life, Environment and Governance — with the Economics score itself built from six measures: GDP size, GDP growth, economic stability, GDP per capita, employment growth, and economic diversity.", "speaker": "Sally Li", "type": "framework", "entities": ["Oxford Economics", "Global Cities Index"], "conviction": "high", "so_what": "A reusable screen for site selection, municipal credit and regional allocation: it separates cities that are merely big from those that are big, stable and broadly prosperous.", "quote": "GDP size, GDP growth, economic stability, GDP per capita, employment growth, and economic diversity", "locator": "Economics sits at the heart of", "quote_verified": true}, {"claim": "Single-metric city rankings mislead because a city can be fast-growing but volatile, or enormous but stagnant — only a composite identifies which cities are best placed to stay economically vital over the long term.", "speaker": "Sally Li", "type": "framework", "entities": ["Oxford Economics", "Global Cities Index"], "conviction": "high", "so_what": "Warns against headline-GDP or headline-growth screens when underwriting long-duration urban exposure such as real estate or infrastructure.", "quote": "A city can be fast-growing but volatile, or enormous but stagnant.", "locator": "This composite approach matters because", "quote_verified": true}, {"claim": "Economic staying power comes from two opposite directions at once: the largest metros defend position through scale, stability and compounding agglomeration effects, while smaller fast-growing cities close the gap riding demographic and sectoral tailwinds.", "speaker": "Sally Li", "type": "framework", "entities": ["Oxford Economics", "Global Cities Index"], "conviction": "high", "so_what": "Supports a barbell in urban exposure — core mega-metros for stability plus a selective sleeve of high-growth mid-sized cities — rather than a single-tier bet.", "quote": "opportunity isn’t confined to any one tier or type of city, but knowing how to capitalise on it is what will decide who’s still climbing next year", "locator": "Scale, speed, and staying power", "quote_verified": true}, {"claim": "Large incumbent cities repeat at the top of rankings year after year because their sheer scale means even small percentage gains translate into large absolute increases, even though their GDP growth rates are more modest than smaller emerging cities'.", "speaker": "Sally Li", "type": "causal", "entities": ["New York", "London", "Global Cities Index"], "conviction": "high", "so_what": "Explains why absolute-dollar opportunity and percentage-growth opportunity point to entirely different city lists — pick the metric that matches the strategy.", "quote": null, "locator": "While these cities differ in their specific strengths", "quote_verified": false}, {"claim": "The virtuous cycle behind dominant city economies runs: productive sectors generate high incomes per person, which attract productive workers, who in turn contribute to the economy.", "speaker": "Sally Li", "type": "causal", "entities": ["New York", "London", "Los Angeles"], "conviction": "high", "so_what": "Identifies talent inflow as the leading indicator to watch for whether a top-tier city is holding or losing its economic moat.", "quote": "productive sectors that generate high incomes per person, which in turn attract productive workers, who contribute to the economy, creating a virtuous cycle", "locator": "While these cities differ in their specific strengths", "quote_verified": true}]}, {"theme": "US dominance of the Economics table", "insights": [{"claim": "Nine of the ten top-ranked cities by Economics score are in the United States — New York, Los Angeles, San Jose, Seattle, San Francisco, Dallas, Washington DC, Boston and Houston — with London the only non-US entrant, at seventh.", "speaker": "Sally Li", "type": "data_point", "entities": ["New York", "Los Angeles", "San Jose", "Seattle", "San Francisco", "Dallas", "London", "Washington DC", "Boston", "Houston"], "conviction": "high", "so_what": "An argument for US-centric urban and metro-level exposure; non-US city allocations rest on categories other than raw economic strength.", "quote": "Nine of our top 10 cities by Economics rankings are in the US, with London the sole non-US city to break into the group.", "locator": "And New York is far from alone at the top", "quote_verified": true}, {"claim": "New York holds the world's biggest metro economy at nearly double the size of the next-largest cities, Tokyo and Los Angeles, and combines it with remarkably stable long-term GDP dynamics.", "speaker": "Sally Li", "type": "data_point", "entities": ["New York", "Tokyo", "Los Angeles"], "conviction": "high", "so_what": "Quantifies the gap incumbents would have to close and underpins New York's status as the default core urban allocation.", "quote": "nearly double that of the next-largest cities, Tokyo and Los Angeles", "locator": "New York takes top spot", "quote_verified": true}, {"claim": "New York's economic diversity score is lower than peers' because of the outsized role of its finance sector, yet Oxford Economics still expects it to remain a top-scoring city for years to come.", "speaker": "Sally Li", "type": "thesis", "entities": ["New York", "financial services"], "conviction": "high", "so_what": "Flags concentration risk: a severe financial-sector shock is the single identified channel that could dent New York's ranking.", "quote": null, "locator": "New York takes top spot", "quote_verified": false}, {"claim": "San Jose ranks third on Economics and records the highest GDP per person of all 1,000 cities in the index, driven by a dense concentration of tech heavyweights including Apple's headquarters.", "speaker": "Sally Li", "type": "data_point", "entities": ["San Jose", "Apple", "technology sector"], "conviction": "high", "so_what": "Confirms tech-cluster rents accrue to a very narrow geography — relevant for Bay Area property, wage and local tax-base exposure.", "quote": null, "locator": "And New York is far from alone at the top", "quote_verified": false}, {"claim": "Los Angeles takes second place on a broad economic base spanning entertainment, tech and aerospace that has driven high GDP per person — economic breadth, not a single sector, is its ranking driver.", "speaker": "Sally Li", "type": "data_point", "entities": ["Los Angeles", "entertainment", "aerospace", "technology sector"], "conviction": "high", "so_what": "Sector-diversified metros can rank near the top without a single dominant industry, a useful contrast to San Jose's concentration.", "quote": null, "locator": "And New York is far from alone at the top", "quote_verified": false}]}, {"theme": "US vs Europe: different sources of advantage", "insights": [{"claim": "The US accounts for 30 of the top 100 cities in the index, and its dominance comes from Economics and Human Capital scores, whereas European cities' elevated positions come from Quality of Life, Environmental and Governance categories.", "speaker": "Sally Li", "type": "framework", "entities": ["United States", "Europe", "Global Cities Index"], "conviction": "high", "so_what": "Europe's city ranking strength is amenity-led rather than growth-led — a caution for anyone reading headline European city rankings as a growth signal.", "quote": "In the US, it is strong scores across the Economics and Human Capital categories that drive their elevated position. In Europe, however, it is outperformance across the Quality of Life, Environmental, and Governance categories.", "locator": "As is immediately visible, cities across North America", "quote_verified": true}, {"claim": "London is the fourth-biggest city economy in the world by GDP and Europe's premier economic powerhouse, backed by a long track record of stable growth, while Paris ranks fifth-biggest by GDP on a service-oriented economy but places only 13th on Economics.", "speaker": "Sally Li", "type": "data_point", "entities": ["London", "Paris", "Dublin", "Europe"], "conviction": "high", "so_what": "Size and score diverge in Europe — Paris's GDP scale does not buy a top-10 Economics ranking, so scale alone is not the European investment case.", "quote": null, "locator": "Over in Europe, London remains", "quote_verified": false}, {"claim": "Dublin's third-highest GDP per capita in the world is inflated by large multinationals booking operations there and should be interpreted with caution, though its underlying indicators — robust employment growth across tech, finance and pharmaceuticals — remain strong.", "speaker": "Sally Li", "type": "contrarian", "entities": ["Dublin", "Ireland", "pharmaceuticals", "technology sector", "financial services"], "conviction": "high", "so_what": "Discount headline Irish per-capita GDP in any city comparison and use employment growth instead; multinational accounting distortion is the known artefact.", "quote": "this figure is being inflated by the presence of large multinationals whose operations are located there", "locator": "Dublin’s position needs to be interpreted", "quote_verified": true}]}, {"theme": "AI as the Asian growth engine", "insights": [{"claim": "Hsinchu, 70 km southwest of Taipei, is showing the most significant AI-related growth of any Asian city and is one of Asia's fastest-growing cities by GDP, powered by rising demand for AI-linked chip exports.", "speaker": "Sally Li", "type": "data_point", "entities": ["Hsinchu", "Taipei", "Taiwan", "semiconductors", "AI"], "conviction": "high", "so_what": "Names the single geography most levered to AI chip demand — a real-economy read-through for Taiwan semiconductor supply-chain exposure and a concentration risk if AI capex slows.", "quote": "powered by rising demand for AI-linked chip exports", "locator": "The global AI boom is playing a huge part", "quote_verified": true}, {"claim": "Kuala Lumpur is closing in on a top-50 index spot as Malaysia's leading digital hub, hosting roughly half the country's data centres and drawing multibillion-dollar investments from Google and Amazon Web Services.", "speaker": "Sally Li", "type": "data_point", "entities": ["Kuala Lumpur", "Malaysia", "Google", "Amazon Web Services", "data centres"], "conviction": "high", "so_what": "Concrete evidence of hyperscaler capex landing in Southeast Asia — watch Malaysian power, land and construction beneficiaries of data-centre buildout.", "quote": null, "locator": "The global AI boom is playing a huge part", "quote_verified": false}, {"claim": "Shenzhen remains mainland China's top-ranked city in the index, home to Huawei and Tencent plus a dense cluster of robotics and AI businesses.", "speaker": "Sally Li", "type": "data_point", "entities": ["Shenzhen", "China", "Huawei", "Tencent", "robotics", "AI"], "conviction": "high", "so_what": "Identifies where China's AI and robotics economic activity is concentrated for anyone mapping mainland tech exposure.", "quote": null, "locator": "The global AI boom is playing a huge part", "quote_verified": false}, {"claim": "Bengaluru has been expanding at breakneck speed on the back of its IT sector and is now poised to move into more advanced fields because of AI.", "speaker": "Sally Li", "type": "prediction", "entities": ["Bengaluru", "India", "IT services", "AI"], "conviction": "medium", "so_what": "An implied upgrade path for Indian IT from services delivery toward higher-value AI work — a thesis to test against Indian IT services earnings mix.", "quote": null, "locator": "Looking just a bit further down the rankings", "quote_verified": false}, {"claim": "The AI boom driving city growth is described as relatively concentrated rather than broadly distributed, with a handful of named hubs capturing it.", "speaker": "Sally Li", "type": "thesis", "entities": ["AI", "Hsinchu", "Kuala Lumpur", "Shenzhen"], "conviction": "medium", "so_what": "Argues against diffuse AI-driven regional plays; the economic gains cluster in a short list of cities, so exposure should be targeted.", "quote": "Although the AI boom is relatively concentrated, economic growth is not only centred in Asia.", "locator": "Although the AI boom is relatively concentrated", "quote_verified": true}, {"claim": "Ho Chi Minh City has leveraged rising trade activity, higher-value manufacturing and an expanding private sector into GDP growth that places it in the top 5% of the index on that metric.", "speaker": "Sally Li", "type": "data_point", "entities": ["Ho Chi Minh City", "Vietnam", "manufacturing", "trade"], "conviction": "high", "so_what": "Quantifies Vietnam's manufacturing-shift dividend at city level — supportive of Vietnam trade, industrial property and logistics exposure.", "quote": null, "locator": "Looking just a bit further down the rankings", "quote_verified": false}]}, {"theme": "Africa and Latin America risers", "insights": [{"claim": "Egypt's Port Said and Suez record the second- and third-fastest GDP growth rates in the entire 1,000-city index, both benefiting from their location along the Suez Canal corridor, while Cairo remains Egypt's main economic pillar on the strength of its information and communications sector.", "speaker": "Sally Li", "type": "data_point", "entities": ["Port Said", "Suez", "Cairo", "Egypt", "Suez Canal"], "conviction": "high", "so_what": "Ties two of the world's fastest-growing city economies directly to Suez Canal throughput — Red Sea shipping disruption is therefore a direct macro risk to Egypt's fastest-growing metros.", "quote": null, "locator": "Although the AI boom is relatively concentrated", "quote_verified": false}, {"claim": "Dakar and Nairobi face a wave of young workers entering the labour market at the same time as their economies diversify, and are positioned to expand for years if they can harness this demographic dividend.", "speaker": "Sally Li", "type": "thesis", "entities": ["Dakar", "Senegal", "Nairobi", "Kenya"], "conviction": "medium", "so_what": "A conditional, not assured, growth case for African frontier cities — the demographic dividend must be absorbed by jobs to convert into economic growth.", "quote": null, "locator": "Elsewhere, cities such as Dakar in Senegal", "quote_verified": false}, {"claim": "Lima is the top-ranking South American city on Economics but only at 183rd place, and on rapid 20-year population growth plus a deepening skills base is forecast to significantly outpace regional peers on both GDP and income growth over the next decade.", "speaker": "Sally Li", "type": "prediction", "entities": ["Lima", "Peru", "South America"], "conviction": "medium", "so_what": "Shows how far South America sits from the global economic frontier — even its best city ranks 183rd — while flagging Lima as the region's relative-growth pick.", "quote": null, "locator": "Latin America also has several strong performers", "quote_verified": false}]}, {"theme": "Gulf diversification away from oil", "insights": [{"claim": "Riyadh already ranks 18th in the Economics category on large GDP size and fast employment growth, and Oxford Economics expects it to become both a megacity and an urban economic powerhouse by 2050 as Saudi Arabia moves away from oil.", "speaker": "Sally Li", "type": "prediction", "entities": ["Riyadh", "Saudi Arabia", "oil"], "conviction": "high", "so_what": "A multi-decade construction, services and consumption growth story; Riyadh at 18th already outranks every South American and most Asian cities on Economics.", "quote": null, "locator": "Yet no list of emerging entrants", "quote_verified": false}, {"claim": "Abu Dhabi is recording rapid growth as it diversifies beyond oil into finance, culture and advanced manufacturing, while Dubai's expanding financial services sector is propelling it toward becoming the world's 60th-largest city economy by 2050 — and rather than competing, the two emirates increasingly complement one another.", "speaker": "Sally Li", "type": "thesis", "entities": ["Abu Dhabi", "Dubai", "UAE", "financial services", "advanced manufacturing"], "conviction": "medium", "so_what": "Reframes the standard Abu Dhabi-versus-Dubai rivalry narrative as complementarity, and puts a dated marker (60th-largest by 2050) on Dubai's financial-sector build-out.", "quote": "Rather than competing, the two emirates increasingly complement one another’s strengths.", "locator": "Yet no list of emerging entrants", "quote_verified": true}]}], "insight_total": 24, "top_entities": ["New York", "London", "San Jose", "Los Angeles", "Dublin", "Hsinchu", "Kuala Lumpur", "Shenzhen", "Bengaluru", "Riyadh", "Dubai", "Oxford Economics Global Cities Index"], "source_meta": {"author": "Sally Li", "word_count": 1592, "paywalled": false}}, {"record_id": "ec0d0832778dc6b9", "source_type": "concepts", "source_name": "Works in Progress", "source_url": "https://worksinprogress.co/issue/why-arab-armies-dont-win-wars/", "title": "Why Arab armies don't win wars - Works in Progress Magazine", "published_date": "2026-09-17", "language": "en", "processed_at": "2026-09-18T11:09:58Z", "processor": "claude-code-sub-opus", "tags": ["Geopolitics", "Society"], "gist": "Reviewing Kenneth Pollack's Armies of Sand, the piece argues that the repeated battlefield underperformance of Arab militaries — despite advantages in men and materiel — is not explained by Soviet doctrine or politicization, but by deep cultural patterns (deference to authority, in-group loyalty, honor/shame) transmitted through rote-memorization education and reproduced in civilian bureaucracies. The same traits that produced the 1967 collapse and Saddam's failed Iran offensive are held to obstruct present-day social and economic reform across the region.", "themes": [{"theme": "Materiel advantage does not predict outcomes", "insights": [{"claim": "Arab militaries have repeatedly lost wars while enjoying numerical advantages in troops, tanks and aircraft, meaning order-of-battle counts are a poor predictor of regional military outcomes.", "speaker": "Works in Progress", "type": "thesis", "entities": ["Egypt", "Syria", "Jordan", "Iraq", "Israel", "Kenneth Pollack"], "conviction": "high", "so_what": "When pricing escalation risk in the Middle East, weight force-employment quality over headline hardware inventories; conventional Arab-state coalitions have historically under-delivered relative to their paper strength.", "quote": "the coalition of Arab states lose 70,000 square kilometers of territory, despite fielding many more troops, tanks, and aircraft than their Israeli opponents", "locator": "Nasser’s commanders hadn’t been entirely honest", "quote_verified": true}, {"claim": "In the opening hours of the Six-Day War on 5 June 1967, Israel destroyed 298 of Egypt's 420 combat aircraft on the tarmac, and the Arab coalition ultimately lost 70,000 square kilometers of territory.", "speaker": "Works in Progress", "type": "data_point", "entities": ["Egypt", "Israel", "Six-Day War", "Nasser"], "conviction": "high", "so_what": "A concrete base rate for how fast a regional air campaign can decide a conflict — relevant to how quickly oil and shipping risk premia can be priced in or out.", "quote": null, "locator": "In the early hours of 5th June 1967", "quote_verified": false}, {"claim": "The pattern of underperformance is not specific to fighting Israel: Gaddafi's Libya lost repeatedly to poverty-stricken Chad, and Saddam Hussein's offensive against Iran is characterized as one of the most pathetic military offensives of the past century.", "speaker": "Works in Progress", "type": "causal", "entities": ["Libya", "Gaddafi", "Chad", "Saddam Hussein", "Iraq", "Iran", "Kenneth Pollack"], "conviction": "high", "so_what": "Rules out 'Israeli exceptionalism' as the explanation, so the weakness should be assumed to persist in any conventional conflict these states enter, not just Arab-Israeli ones.", "quote": "one of the most pathetic military offensives of the past century", "locator": "In Armies of Sand, former CIA analyst Kenneth Pollack", "quote_verified": true}]}, {"theme": "Why the standard explanations fail", "insights": [{"claim": "The Soviet-doctrine explanation for Arab military failure is rebutted by the fact that Cuba and North Korea also relied on Soviet doctrine and performed creditably in their twentieth-century engagements.", "speaker": "Works in Progress", "type": "contrarian", "entities": ["Cuba", "North Korea", "Soviet doctrine", "Kenneth Pollack"], "conviction": "high", "so_what": "Analysts using 'they trained Soviet-style' as shorthand for military weakness are applying a variable that does not travel; discount that heuristic when assessing any client military.", "quote": null, "locator": "Pollack finds these explanations lacking", "quote_verified": false}, {"claim": "Politicization of the officer corps also fails as an explanation because Egyptian military performance remained as dismal as ever after substantial depoliticization in the 1970s.", "speaker": "Works in Progress", "type": "contrarian", "entities": ["Egypt", "Kenneth Pollack"], "conviction": "high", "so_what": "Implies institutional reform of a defense ministry alone will not raise combat effectiveness — so defense spending and restructuring headlines should not be read as capability gains.", "quote": null, "locator": "Pollack finds these explanations lacking", "quote_verified": false}, {"claim": "Coup-proofing produces extreme institutional // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
