<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-11-27T06:21:25Z", "input_stats": {"total_tweets": 189, "unique_authors": 64, "tweets_with_images": 40, "after_noise_filter": 87}, "summary": "**Jensen is back, the AI trade round-tripped, and the alpha set is debating the low:** **aleabitoreddit** relays Allianz calling the sell-off \"an unwind of crowded positions, not a fundamental break\" (US high-yield lost <1% on the week) and is directionally bullish into 2027; **saxena_puru** lists a full capitulation checklist (VIX >40, L/S net leverage at 2022/2025 lows, CTAs max short) and is \"positioned for a multi-month rally\"; **AndreasSteno** counters that stocks only rally on closed-market days and sees \"not many signs of a true bottom.\" **PeterDiamandis** anchors the fundamentals: $NVDA printed **$115.8B** in a quarter, +103% YoY, 93% data center.\n\n**Musk's SpaceX giveaway becomes the holiday's main story:** two $SPCX shares per American child, now expanded to one more share every year (**AndrewCurran_**). **beaniemaxi** sizes it at ~1% of shares outstanding and says tokenization would be the efficient rail; **BillAckman** amplifies the compounding math (17 shares at 18, **$6.7M** at 65 at 15%/yr); **AviFelman** calls direct transfers \"the easiest form of philanthropy\" versus the barons' libraries and universities.\n\n**AI capability shock spills into cryptography:** **AndrewCurran_** catalogs the rumor mill (factoring in P at OpenAI/Anthropic, P=BQP, ECC broken, Ring-LWE not quantum-safe, \"just rumours\"), Scott Aaronson now says a P≠NP proof is \"not far,\" and **ercwl** is running a live bet to push Bitcoin devs toward post-quantum safety. Curran also details why Anthropic's **AL4** automation number (<1% in Feb, 26% in Aug) still hasn't been published. **EMostaque** ships a Lean proof deriving QM and SR from the dot product with help from GPT 6.2 Astra and Gemini Neon; **cryptopunk7213** says Gemini 4 Neon cements Google as a top-3 lab.\n\n**Oil snapped back to $96.57** on a Houthi strike on a Saudi refinery and Iranian mine strikes in Hormuz (**Swedish_uranium**), with core PCE at 3.3% keeping a Fed hike in play; **VKMacro** endorses the view that spot oil is a backward-looking read on Hormuz exits, and **fejau_inc** says you cannot have an AI-buildout slowdown and surging bond yields at the same time: \"pick one.\"\n\n**Crypto:** **thedefiedge** says $10k of BTC bought at the Oct-2025 top is worth ~$4,900; his five bottom signals split (coins-in-profit bullish, realized price **$53.3K** vs spot $61.2K and record **$5.4B** November ETF outflows bearish), so buy slowly but don't call the bottom. **krugermacro** says the 50-week-MA reclaim template is invalidated for the first time ever. **Crypto_McKenna**: there will never be a Hyperliquid Season 3 airdrop.\n\n**Supply chain and trade ideas:** **aleabitoreddit**'s Yuanjie channel check has InP substrate prices up several % in Q4 and $NVDA sourcing 300-400mW external lasers for NPO because $LITE is capacity-constrained; **SemiAnalysis_** shows Trainium3 at **2.28x** better perf/$ than GB300 NVL72; **zeroxkyle** floats long $GOOG / short Anthropic; **Swedish_uranium** lays out the 100x math on HydroGraph graphene; **beaniemaxi** wants to lever long housing while \"everyone is sure I'm wrong.\"\n\n**Notable:** **novogratz** calls the bipartisan permanent ban on Chinese cars \"embarrassing\"; **Zeneca** sunsets ZenAcademy after 5 years; **MelMattison1** demands pardons for SBF and Ryan Salame after the FTX documentary; the NYT's guide to AI-doom talk at Thanksgiving gets mocked by **Fiskantes** while **cryptopunk7213** reports everyone over 50 at his table blames AI for the cyber outages.", "sections": {"A_events": [{"cluster": "Jensen Reinstated, AI Trade Round-Trips: Positioning Unwind or Fundamental Break?", "category": ["macro", "ai", "positioning"], "description": "With US cash markets closed for Thanksgiving, the question of the day is whether last week's wipeout and Jensen Huang's return mark a tradable low. Allianz (via aleabitoreddit) and Saxena say positioning unwind and capitulation; Steno is the holdout on bottom-calling. Complementary views, not a direct clash: Saxena argues from positioning data, Steno from price behavior.", "items": [{"author": "aleabitoreddit", "summary": "Relays an Allianz note: the sell-off \"has so far looked more like an unwind of crowded positions than a fundamental break in the AI investment case.\" Three catalysts, the $NVDA CEO change, US congressional measures and international restrictions on Nvidia chip access, triggered a disproportionate reaction. Retail-favorite names ($NBIS, $SIVE, $ASTS, $IREN, $HOOD) and crowded hedge-fund positions were hit hardest, while US high-yield lost under 1% on the week, pointing to contained credit stress. Allianz says the concerns (monetization, politics, growth peaking) are legitimate but overdone: \"the AI trade is cheap again,\" and the next test is whether weakness spreads to credit, capex and the broader economy. Serenity's own read: negative signals from Asian neoclouds and individual suppliers are real but shouldn't be extrapolated to the whole trade; industry executives still describe compute-to-networking demand as insatiable, so directionally bullish into 2027 after the valuation reset. In a follow-up he unpacks the Asian neocloud situation: Malaysia/Thailand operators had ByteDance and Tencent deals cancelled under US export controls and will reroute capacity to US buyers. Many call that compute flooding, but $CRWV cites 10x demand over supply into 2027 and some trackers show pricing still rising. Paused financing for those neoclouds means less future competition (good for $NBIS) even if some semi supply chains see softer GPU/DRAM spot prices; he expects bifurcated supply chains and shifted order timing rather than lower aggregate demand, with well-capitalized neoclouds backed by hyperscaler counterparties winning long-run and macro risks (hikes, financing) hitting the sector hardest.", "tweet_url": "https://x.com/aleabitoreddit/status/2126164719522426935", "images": ["https://pbs.twimg.com/media/HYGkr6VbUAA7QjL.jpg", "https://pbs.twimg.com/media/HYGksHtbcAAsiAx.jpg", "https://pbs.twimg.com/media/HYGksSibsAAlLkB.jpg", "https://pbs.twimg.com/media/HYGq92obcAEjXal.jpg", "https://pbs.twimg.com/media/HYGr_C2b0AEwtDi.jpg"], "type": "thread", "created_at": "2026-11-27T04:02:26.000Z"}, {"author": "saxena_puru", "summary": "Lists the signs of a major market low: epic degrossing by hedge funds, VIX recently above 40, long/short net leverage at the 2022 and 2025 lows, CTAs max short, a put/call ratio spike, extreme fear, and a successful test of Friday's low. \"We're positioned for a multi-month rally,\" with a rally into Q1 the likely scenario. Separately posts a Goldman chart showing fundamental L/S leverage at prior bear-market lows, noting gross leverage also declined. One caveat in replies: \"Jensen is back, some neoclouds are vulnerable.\"", "tweet_url": "https://x.com/saxena_puru/status/2126147159896764695", "images": ["https://pbs.twimg.com/media/HYGF5O8awAAyPdG.jpg"], "type": "thread", "created_at": "2026-11-27T02:52:39.000Z"}, {"author": "AndreasSteno", "summary": "Reacting to tokenized stocks on Liquid rallying on Thanksgiving (S&P +0.57%, Nasdaq 100 +0.48%, AI infrastructure leading) while cash markets were closed: \"a bit interesting how we have seen this pattern a few days in closed markets... not many signs of a true bottom yet on open market days.\"", "tweet_url": "https://x.com/AndreasSteno/status/2126027676058071362", "images": [], "type": "tweet", "created_at": "2026-11-26T18:57:52.000Z"}, {"author": "PeterDiamandis", "summary": "$NVDA reported $115.8B in quarterly revenue, up 103% YoY, with roughly 93% from Data Center, a three-month figure that exceeds the annual GDP of most countries. Working through replies: compute demand is still growing massively; the real test is productivity (more output per hour is real growth); the number to watch is how fast enterprise and sovereign buyers grow relative to the big clouds; energy remains the great bottleneck, hence his bullishness on solar, storage and fusion; pauses will come but demand for cheaper, smarter compute won't pause with them, and \"the buildout has many years left to run.\"", "tweet_url": "https://x.com/PeterDiamandis/status/2126059509445476534", "images": [], "type": "thread", "created_at": "2026-11-26T21:04:21.000Z"}, {"author": "munster_gene", "summary": "Amid all the $NVDA drama, \"the simple fact that no competitor can touch their chips remains underappreciated by many investors,\" pointing to the WSJ's top story on a game-changing move that gave America the edge over China in AI.", "tweet_url": "https://x.com/munster_gene/status/2126019926527738199", "images": [], "type": "tweet", "created_at": "2026-11-26T18:27:04.000Z"}, {"author": "Fiskantes", "summary": "Quoting a public statement that disavowed a fake letter urging Nvidia's board to reinstate Jensen (the author said they are grief-stricken he is gone but fully back the board and Colette): \"this reminds me of a boardgame I played as a kid... snakes and ladders.\"", "tweet_url": "https://x.com/Fiskantes/status/2126122652180054035", "images": [], "type": "tweet", "created_at": "2026-11-27T01:15:16.000Z"}, {"author": "Evan_ss6", "summary": "Gallows-humor positioning take on the semis complex: \"one -34% day for semis to end this nonsense,\" adding it would have to happen in a single session to wipe out $SOXL.", "tweet_url": "https://x.com/Evan_ss6/status/2126118080636207411", "images": [], "type": "thread", "created_at": "2026-11-27T00:57:06.000Z"}, {"author": "TMTLongShort", "summary": "Reacts to the quip that Spotify Wrapped will read \"you spent 764 hours listening to bullish AI infrastructure podcasts just to underperform consumer staples.\" Separately endorses the view that professional economists who haven't spent the year obsessing over AI's impact on supply and demand by vertical are in a \"broken profession.\"", "tweet_url": "https://x.com/TMTLongShort/status/2126106776760111347", "images": [], "type": "tweet", "created_at": "2026-11-27T00:12:11.000Z"}]}, {"cluster": "Musk's SpaceX Share Giveaway to Every American Child: 'Universal Basic Assets'", "category": ["society", "tech"], "description": "Musk pledged two $SPCX shares to every child in America (one from the company, one personally), then expanded it to an additional share every year. The alpha set debated mechanics, dilution, compounding and whether it counts as philanthropy.", "items": [{"author": "AndrewCurran_", "summary": "Flags that the donation plan \"has been significantly expanded once again\": Musk now says he will donate another share of SpaceX to all kids in America every year. Posts screenshots of the exchange.", "tweet_url": "https://x.com/AndrewCurran_/status/2126071615012376892", "images": ["https://pbs.twimg.com/media/HYFS3fLaoAERH7J.jpg", "https://pbs.twimg.com/media/HYFcSNYbEAAZ0O8.jpg", "https://pbs.twimg.com/media/HYFc_p2bwAAFwQp.jpg"], "type": "thread", "created_at": "2026-11-26T21:52:28.000Z"}, {"author": "beaniemaxi", "summary": "Calls it an interesting airdrop concept at roughly 1% of outstanding shares if every one of the 73 million US children claims; argues it would be far more efficient to do it via tokenized shares so anyone can claim without a brokerage account, which most children lack. On dilution: at least half of it isn't dilutive because those shares are already issued to Elon.", "tweet_url": "https://x.com/beaniemaxi/status/2126109295112769969", "images": [], "type": "thread", "created_at": "2026-11-27T00:22:11.000Z"}, {"author": "BillAckman", "summary": "\"The power of compounding.\" Amplifies a parent's math: a two-year-old gets two shares now plus one a year, 17 shares by age 18; assuming SpaceX grows 15% annually, that is roughly $820k by age 50 and $6.7M by 65, \"a game changer for America's youth.\"", "tweet_url": "https://x.com/BillAckman/status/2126117840579150014", "images": [], "type": "tweet", "created_at": "2026-11-27T00:56:09.000Z"}, {"author": "AviFelman", "summary": "Responding to the celebration of scaling philanthropy: the great barons understood that giving money directly to the masses is appeasement, not cultural support; libraries, universities and public works were the historical focus, putting company builders' minds to work on what society actually needed. He doesn't mean to denigrate Elon's move (\"good to have people invested in American enterprise\") but calls it \"the easiest form of philanthropy\" and hopes today's philanthropists take the history to heart.", "tweet_url": "https://x.com/AviFelman/status/2126010083868098721", "images": [], "type": "thread", "created_at": "2026-11-26T17:47:58.000Z"}, {"author": "EMostaque", "summary": "\"Elon doing universal basic assets all by himself.\"", "tweet_url": "https://x.com/EMostaque/status/2126066590156239190", "images": [], "type": "tweet", "created_at": "2026-11-26T21:32:30.000Z"}, {"author": "jonchu", "summary": "Shares the framing that the Left wanted wealth redistribution and Musk gave $18B of SpaceX directly to every child, only to be told \"not like that\": \"this basically sums up everything wrong with government.\" Separately raises the mechanics: wouldn't SpaceX need to create a lot of shares via a many-for-one split, and what would the repercussions be?", "tweet_url": "https://x.com/jonchu/status/2126136492477264160", "images": [], "type": "tweet", "created_at": "2026-11-27T02:10:16.000Z"}]}, {"cluster": "AI vs Cryptography: 'Factoring in P', ECC Broken, P≠NP 'Not Far', Bitcoin PQC Push", "category": ["ai", "crypto", "tech"], "description": "A week of AI-driven math results has spilled into cryptography rumors. Nothing is confirmed, but Bitcoin post-quantum advocates are pressing their case and quantum firms have switched sides in the doom debate.", "items": [{"author": "AndrewCurran_", "summary": "Lists the current rumors for the record: factoring in P at OpenAI and Anthropic, P=BQP proven, ECC broken, Ring-LWE not quantum-resistant. Stresses these are \"just rumours\" and that \"there have never been as many math rumors as there are right now, I can't even keep up.\" In a separate thread he claims credit for \"hyperstitioning\" Navier-Stokes: an earlier post of his caused OpenAI to start working on it \"by their own admission.\"", "tweet_url": "https://x.com/AndrewCurran_/status/2126075530785276195", "images": [], "type": "thread", "created_at": "2026-11-26T22:08:01.000Z"}, {"author": "AndrewCurran_", "summary": "Update from Scott Aaronson, who has made the shift from VP ≠ VNP that Curran predicted: \"I now feel in my bones, for the first time ever, that a proof of P ≠ NP is not far.\"", "tweet_url": "https://x.com/AndrewCurran_/status/2126169342907949059", "images": ["https://pbs.twimg.com/media/HYGrv9hbkAALKgo.jpg"], "type": "tweet", "created_at": "2026-11-27T04:20:48.000Z"}, {"author": "ercwl", "summary": "Confirms he is actively working on Bitcoin devs over post-quantum safety: tracks a live bet with jamesob on tungsten.bet and hopes the chart plus his findings will eventually sway him into conceding that PQC-safety is a reasonable cautionary route for BTC, \"as I've done for years.\" Names nic_carter his \"champion\" on the matter.", "tweet_url": "https://x.com/ercwl/status/2126110016306610619", "images": ["https://pbs.twimg.com/media/HYF1yhaW8AAGAW7.jpg"], "type": "thread", "created_at": "2026-11-27T00:25:03.000Z"}, {"author": "SoskaKyle", "summary": "\"The funniest part of the AI complexity-theory stuff is watching the quantum companies pivot from their normal 24/7 dooming of crypto to instead stand up against the AI doomers because it's the wrong kind of doom.\" Points to a Q-Labs explainer on the rumor that an AI lab can break RSA, and maybe elliptic curves, without a quantum computer.", "tweet_url": "https://x.com/SoskaKyle/status/2126132870351892974", "images": [], "type": "tweet", "created_at": "2026-11-27T01:55:52.000Z"}]}, {"cluster": "AI Capability Shock: Gemini Neon, Opus 5.6, GPT-6.2 Astra, and the Wait for Anthropic's AL4 Number", "category": ["ai", "tech"], "description": "New frontier models are producing formal math and physics results, and the discourse is pulling 2027 recursive-self-improvement timelines forward. Google is widely seen as back in the top three.", "items": [{"author": "AndrewCurran_", "summary": "Three weeks after Anthropic co-founder Sam McCandlish's post on the METR acceleration report, Curran is waiting for Anthropic's own report and specifically its AL4 number. AL4 (Automation Level 4) means a human picks the task, Claude handles it end-to-end, and the human reviews and deploys; it is the last step before AL5, where the model chooses and deploys its own work and the only speed limit is compute. Anthropic's AL4 was under 1% in February and 26% by August, with nothing published since. McCandlish said METR redactions were because \"the unredacted information would allow others to speed up their research,\" and Curran suspects the same logic is delaying this report: a very high AL4 would shock competitors into pursuing RSI even harder. With 2027 widely predicted for full RSI and some expecting ASI shortly after, he argues it is past time to \"reveal the current shape of the invisible frontier.\" If it doesn't drop in the next few hours, he expects next week at the earliest; everyone involved is \"sworn to secrecy.\"", "tweet_url": "https://x.com/AndrewCurran_/status/2126052956038652365", "images": ["https://pbs.twimg.com/media/HYFB5Zha4AAXL0B.jpg"], "type": "thread", "created_at": "2026-11-26T20:38:19.000Z"}, {"author": "cryptopunk7213", "summary": "Gemini 4 Neon is \"undeniably a fantastic model\" that cements Google as a top-3 lab. In hindsight Google's early bets were prescient: Jeff Dean's decision to build TPUs ten years ago gives sovereignty from constrained Nvidia supply, and Demis's obsession with ML for games defined modern RL environments. He admits he thought Google had blown it this year after Anthropic and OpenAI ran away with it, but the new 0-to-1 pre-training architecture behind Carbon, Hydrogen and now Neon has been outstanding, and the lab is now producing research breakthroughs in math, quantum and bio weekly: \"Google really caught up just before the RSI loop kicked in.\"", "tweet_url": "https://x.com/cryptopunk7213/status/2126043294182396359", "images": [], "type": "tweet", "created_at": "2026-11-26T19:59:55.000Z"}, {"author": "cryptopunk7213", "summary": "Context on why an OpenAI physicist's new paper matters: having \"taken down mathematics\" this week, AI's next target is physics, starting with gravity. Gravity at atomic scale and at cosmological scale have never been linked; the proposal for a quantum theory of vacuum gravity in 4D came after GPT 6 Astra burned 400M tokens on it. He stresses this is NOT easy to prove and could come up empty, but if mathematics is any guide \"the next 6-12 months will yield some of the craziest discoveries yet.\"", "tweet_url": "https://x.com/cryptopunk7213/status/2126020200390611177", "images": [], "type": "tweet", "created_at": "2026-11-26T18:28:09.000Z"}, {"author": "AnjneyMidha", "summary": "\"Kudos to the Gemini Neon team. They have begun to take RL seriously, and it shows.\"", "tweet_url": "https://x.com/AnjneyMidha/status/2126183455587479964", "images": [], "type": "tweet", "created_at": "2026-11-27T05:16:53.000Z"}, {"author": "EMostaque", "summary": "Releases a Lean-formalized proof claiming that from a single axiom (the dot product) and a single method (the axiomatic method), every axiom of quantum mechanics, special relativity \"and more\" is forced in four pages: \"the entire construction is determined and forced with no choices,\" unlike constructive physics proofs that cannot be formalized. He also publishes the full Lean proof of his earlier chirality paper, which he says shows chirality plus consistent quantum theory forces the Standard Model, with \"more to come on how much of physics is forced, we were just bad at math.\" Credits GPT 6.2 Astra and Gemini Neon for finishing, formalizing and performing the final collapses over the last few days after a year of his own core work, and notes a Gemini Neon swarm beat GPT 6.2 Ultra on a Lean-formalized optimization problem. Both GitHub repos linked.", "tweet_url": "https://x.com/EMostaque/status/2126045673581957242", "images": ["https://pbs.twimg.com/media/HYE7v2-XEAET6uN.jpg", "https://pbs.twimg.com/media/HYE7wO_XgAA1z9i.jpg", "https://pbs.twimg.com/media/HYE7w1JWgAAeMZu.png", "https://pbs.twimg.com/media/HYE7xPAWYAAqsFq.png"], "type": "thread", "created_at": "2026-11-26T20:09:23.000Z"}, {"author": "0xSammy", "summary": "\"Mark your calendars for July 2027.\" Shares a video slide deck generated by Opus 5.6 on the scale and speed of AI acceleration over the next 6-12 months, calling it well worth watching: \"AI is the worst it'll ever be in history, might as well embrace it.\"", "tweet_url": "https://x.com/0xSammy/status/2126134035470545325", "images": ["https://pbs.twimg.com/media/HYGLourWoAAS-vR.jpg"], "type": "tweet", "created_at": "2026-11-27T02:00:30.000Z"}, {"author": "paulg", "summary": "\"Whether AIs 'really' think or not, assume when making predictions about the future that they do, because they'll have all the effects they'd have if they really did.\"", "tweet_url": "https://x.com/paulg/status/2126066121333715109", "images": [], "type": "tweet", "created_at": "2026-11-26T21:30:38.000Z"}]}, {"cluster": "Oil Snaps Back to $96.57 on Houthi Refinery Strike and Hormuz Mines; Fed Hike Risk Builds", "category": ["energy", "macro", "geopolitics"], "description": "Brent reversed from below $90 to $96.57 in holiday-thinned trade after fresh Houthi and Iranian attacks. With core PCE at 3.3%, the macro crowd is debating whether a hiking Fed is a policy error and whether the 'AI slowdown plus surging yields' bear case is internally consistent.", "items": [{"author": "Swedish_uranium", "summary": "Daily Metals Pulse: Brent started the week below $90 and settled Thanksgiving at $96.57 after the Houthis said they struck a Saudi refinery and Iran reported mine strikes on ships in the Strait of Hormuz; the extent of supply disruption is uncertain, but with US core PCE already at 3.3% a sustained crude rise gives the Fed another reason to stay tight. Silver traded $41.54/oz, holding above $41 after slipping from $41.88 in Asia; gold eased 0.4% to $3,567. Copper briefly reclaimed $12,000/t on the LME ($12,089) after Washington's tariff proposal clarified that duties on 14 trading partners would replace rather than stack on the July rates. With US equities closed, Toronto's Global X Uranium Index ETF was up 3.8% at C$35.00; Platts resumes U3O8 assessments Monday. For Friday's shortened session (1pm ET close) his first look is the two-year Treasury yield: if it climbs and silver still clears $42, that says more about buying interest than a holiday-volume breakout.", "tweet_url": "https://x.com/Swedish_uranium/status/2126060729065177140", "images": [], "type": "tweet", "created_at": "2026-11-26T21:09:12.000Z"}, {"author": "VKMacro", "summary": "Endorses Rory Johnston's point that spot oil is a completely unreliable signal of future oil right now: it looks backward and only tells you Hormuz exits were strong one to two months ago; today they have weakened, so the question is why that should continue.", "tweet_url": "https://x.com/VKMacro/status/2126010080688816157", "images": [], "type": "tweet", "created_at": "2026-11-26T17:47:57.000Z"}, {"author": "fejau_inc", "summary": "Pushes back on a bear scenario that bundles contradictory outcomes: \"You don't get an AI buildout slowdown and a surging bond yield at the same time. Pick one.\" A hiking cycle, higher inflation and higher bond yields are orthogonal to an AI buildout slowdown and a recession or depression, and further rate hikes would probably keep oil capped too.", "tweet_url": "https://x.com/fejau_inc/status/2126161996819370481", "images": [], "type": "thread", "created_at": "2026-11-27T03:51:36.000Z"}, {"author": "Delphi_Digital", "summary": "Head of Markets Jason (3xliquidated) on the biggest risk to markets now: \"The growth outlook is slowing clearly everywhere... having a Fed hike into that has clearly historically been a policy-related error.\" The new Hivemind episode also covers why markets are falling despite Jensen's return, the most short gamma since 2019, crypto breaking from Bitcoin beta, Bitcoin's miner and quantum problem, and whether Thanksgiving is the bottom.", "tweet_url": "https://x.com/Delphi_Digital/status/2126069889656082435", "images": [], "type": "tweet", "created_at": "2026-11-26T21:45:36.000Z"}, {"author": "AndrewCurran_", "summary": "Posts screenshots from Bank of England Governor Andrew Bailey's Q&A with reporters tonight and from his opening statement.", "tweet_url": "https://x.com/AndrewCurran_/status/2126104931946156270", "images": ["https://pbs.twimg.com/media/HYFxKyvbIAAq_vh.jpg", "https://pbs.twimg.com/media/HYFyvlCbUAAdb32.jpg"], "type": "thread", "created_at": "2026-11-27T00:04:51.000Z"}]}, {"cluster": "Semis Supply Chain Checks: InP Lasers for NVDA's NPO, Trainium3 vs GB300, China's HBM Push", "category": ["tech", "ai"], "description": "Ground-level datapoints on the AI hardware chain: optical laser pricing and capacity from a Chinese supplier, Amazon's custom silicon posting a big perf-per-dollar win, and a chart suggesting China is closing on Korea in HBM.", "items": [{"author": "aleabitoreddit", "summary": "Industry channel check with Yuanjie Semiconductor: it is not supplying Eoptolink because its own CW laser capacity can't meet demand (positive for merchant laser players). On $AXTI and InP substrates: prices were flat in Q3 2026 but rose several percentage points in Q4; primary suppliers are Tongmei (AXT subsidiary), Xiandao and Yunnan Germanium, and roughly 80% of Sumitomo's capacity is already locked up by InnoLight. Prices are expected to hold through March 2027 with April uncertain (mildly negative for memory-like 80%+ gross margins, still 60%+). Its 300-400mW lasers will go primarily to $NVDA as external laser sources for its NPO architecture; Yuanjie says it will be a core NPO supplier because $LITE is capacity-constrained and shifting toward CPO, a bullish read for other merchant laser players too. MOCVD lead times are stable at about 12 months ($AIXA unchanged). CW lasers are 80% of revenue (60% 70mW, 33-34% 100mW). DSP shortages have not yet been built into their models (\"$AAOI is not alone here\"), and 1.6T transceivers will use two 100mW lasers rather than four 70mW.", "tweet_url": "https://x.com/aleabitoreddit/status/2126189347481538755", "images": ["https://pbs.twimg.com/media/HYG9Ds3aAAARX78.jpg"], "type": "tweet", "created_at": "2026-11-27T05:40:17.000Z"}, {"author": "SemiAnalysis_", "summary": "ALERT: Amazon's Trainium3 UltraServer submission to the InferenceX Agentic Inference Benchmark (GLM-5.3) demonstrated 2.28x better performance per dollar than Nvidia's GB300 NVL72. Clarifies the generational mapping in replies: Trainium3 is the equivalent of Blackwell Ultra, and Trainium4 maps to Vera Rubin; Trainium4 will be benchmarked soon on AgentX. Also announces Silicon Supply at 8am EST.", "tweet_url": "https://x.com/SemiAnalysis_/status/2126055958962921712", "images": [], "type": "thread", "created_at": "2026-11-26T20:50:15.000Z"}, {"author": "ASvanevik", "summary": "\"China flipping Korea on HBM soon?\" Shares a chart of high-bandwidth-memory market share trends.", "tweet_url": "https://x.com/ASvanevik/status/2126188443818668283", "images": ["https://pbs.twimg.com/media/HYG9HgbbYAAMME3.jpg"], "type": "tweet", "created_at": "2026-11-27T05:36:42.000Z"}]}, {"cluster": "Policy Own-Goals: Permanent Chinese Car Ban, NYC Hotel Squeeze", "category": ["regulation", "geopolitics", "society"], "description": "Two policy stories drew sharp reactions: a bipartisan deal to permanently ban Chinese cars from the US, and New York's hotel-price complaints after years of supply-restricting rules.", "items": [{"author": "novogratz", "summary": "On the bipartisan deal to permanently ban Chinese cars: \"This is embarrassing! We are supposed to be a land of capitalists! Like the kid who is losing and then takes his ball home. We need fair trade, not no trade.\"", "tweet_url": "https://x.com/novogratz/status/2126044212093128720", "images": [], "type": "tweet", "created_at": "2026-11-26T20:03:34.000Z"}, {"author": "BillAckman", "summary": "\"So true.\" Endorses the argument that New York Democrats banned Airbnbs, converted hotels into migrant shelters, banned new hotel construction in 2021 and banned subcontracting for hotel workers in 2025, and are now complaining that hotels are too expensive \"with absolutely zero thought as to why.\"", "tweet_url": "https://x.com/BillAckman/status/2126103330980090047", "images": [], "type": "tweet", "created_at": "2026-11-26T23:58:29.000Z"}, {"author": "nic_carter", "summary": "Same thrust, in reply to a complaint about NYC hotel prices: migrants \"need 20% of NYC's hotel stock paid for by taxpayers and Airbnbs need to be inexplicably banned too.\"", "tweet_url": "https://x.com/nic_carter/status/2126140396736802858", "images": [], "type": "tweet", "created_at": "2026-11-27T02:25:47.000Z"}, {"author": "Galois_Capital", "summary": "On the report that ICE detained a Princeton student whose family has been wanted in China for financial fraud since 2017 after a denied asylum claim: proposes sending such scammers back to China in exchange for Neville Roy Singham.", "tweet_url": "https://x.com/Galois_Capital/status/2126173518580871193", "images": [], "type": "tweet", "created_at": "2026-11-27T04:37:23.000Z"}]}, {"cluster": "AI Doom at the Thanksgiving Table", "category": ["society", "ai"], "description": "The NYT published a guide to talking to family about AI doom over Thanksgiving. The alpha set mocked it, worried about it, and reported back from dinner.", "items": [{"author": "cryptopunk7213", "summary": "Thanksgiving observations featuring AI: every trivia quiz was generated by GPT 6.2 Astra (heavy on Harry Potter lore); everyone over 50 is worried about the cyber outages and believes AI hacks are behind them; kids are playing AI music off Spotify; everyone is happy Jensen is back regardless of political beliefs; Gen Z graduates are struggling to get jobs and being rejected by companies' AI agents; and nobody has a clue how fast models are improving yet feels a deep unease with doomer headlines.", "tweet_url": "https://x.com/cryptopunk7213/status/2126185221246591137", "images": [], "type": "tweet", "created_at": "2026-11-27T05:23:54.000Z"}, {"author": "nic_carter", "summary": "Shares the NYT's guide to \"how to talk to your family about AI doom this Thanksgiving\" (\"yes, this is real\"), with a screenshot of the more remarkable passages.", "tweet_url": "https://x.com/nic_carter/status/2126137412300472593", "images": ["https://pbs.twimg.com/media/HYGOtVlWgAAaeL5.jpg"], "type": "tweet", "created_at": "2026-11-27T02:13:55.000Z"}, {"author": "Fiskantes", "summary": "Response to the same NYT guide: \"PSA: AI is not real and can't hurt you if you turn off your computer...\"", "tweet_url": "https://x.com/Fiskantes/status/2126139628155785329", "images": [], "type": "tweet", "created_at": "2026-11-27T02:22:43.000Z"}, {"author": "marcvanderchijs", "summary": "Replying under his own alarmed post on AI: \"We should immediately stop. But that's impossible.\" Asked what is at stake: \"Possibly no life at all. I am writing this because I am extremely worried.\" Proposed fixes from commenters are \"interesting but likely impossible to implement.\"", "tweet_url": "https://x.com/marcvanderchijs/status/2126077280707571808", "images": [], "type": "thread", "created_at": "2026-11-26T22:14:58.000Z"}, {"author": "DonAlt", "summary": "The more he goes online the more depressed he gets: doom and gloom everywhere, and the status quo is \"bad for humanity.\" Expects it to turn: people abused how easy it is to make money with negativity, the media market is now saturated with it, and saturation makes negativity less profitable, so being positive becomes the more lucrative play.", "tweet_url": "https://x.com/DonAlt/status/2126054121870643609", "images": [], "type": "thread", "created_at": "2026-11-26T20:42:57.000Z"}]}, {"cluster": "FTX Documentary Reopens the SBF Sentencing Debate", "category": ["crypto", "society"], "description": "A new FTX documentary has crypto veterans relitigating who paid for the collapse.", "items": [{"author": "MelMattison1", "summary": "After finishing the FTX documentary (\"the FTX Telemundo novela\"), argues the wealthy 20- and 30-somethings who cooperated faced little real exposure and \"sold Sam down the river.\" Contrasts the outcomes: SBF got 25 years and Ryan Salame 90 months while the cooperating insiders are already out, including Caroline Ellison after 14 months and now \"making millions again.\" Calls for Trump to pardon SBF and Salame before the end of his term (#freeSam), and frames the disparity in explicitly racial and gender terms.", "tweet_url": "https://x.com/MelMattison1/status/2126037879390638524", "images": ["https://pbs.twimg.com/media/HYE0K-MXMAA_ziM.jpg", "https://pbs.twimg.com/media/HYE2XXcXAAAFJbm.jpg", "https://pbs.twimg.com/media/HYE4wJAX0AEeWiX.jpg"], "type": "thread", "created_at": "2026-11-26T19:38:24.000Z"}, {"author": "fejau_inc", "summary": "Shares an X article without comment (image), then in replies: \"I lived through FTX, I'll never forgive EA cultism.\" \"Lesson in there.\"", "tweet_url": "https://x.com/fejau_inc/status/2126089087748919517", "images": ["https://pbs.twimg.com/media/HYFiv4IXIAAKxj0.jpg"], "type": "thread", "created_at": "2026-11-26T23:01:54.000Z"}]}, {"cluster": "NFT and Crypto-Community Wind-Down: ZenAcademy Sunsets, 'Punks to Zero', Sahil Files Fallout", "category": ["crypto"], "description": "The speculative corner of crypto keeps shrinking: a five-year education community closes, and a prominent NFT veteran reiterates that even blue chips go to zero.", "items": [{"author": "Zeneca", "summary": "After more than five years, is sunsetting ZenAcademy and The 333 Club. The project educated tens of thousands on NFTs, crypto and later AI, worked with governments and universities, ran coaching for ~100 people and over 1,000 hours of 1:1 calls; his newsletter is now free again and he is taking time to think about what's next. Follow-up: shouts out community manager hey_jija as available for hire in crypto or AI.", "tweet_url": "https://x.com/Zeneca/status/2126117705803776052", "images": [], "type": "tweet", "created_at": "2026-11-27T00:55:37.000Z"}, {"author": "beaniemaxi", "summary": "\"If you think that CryptoPunks will hold its current value in the face of absolute decimation in the rest of the NFT market you're crazy.\" It all inevitably goes to zero, but like the dotcom bubble it takes time, with plenty of dead-cat bounces. On the Sahil Files doxxing site: he doesn't hate anybody, but a bunch of KOLs named there \"ruined crypto\" and several have acknowledged the conversations as real (Ansem denied his); he doesn't see the speculative part of the industry coming back any time soon, though tokenization trends around stablecoins will continue.", "tweet_url": "https://x.com/beaniemaxi/status/2126075457795678254", "images": [], "type": "tweet", "created_at": "2026-11-26T22:07:44.000Z"}]}], "B_insights": [{"author": "amitisinvesting", "summary": "A 10,000-character retrospective arguing 2026 was the hardest year to navigate equities in four years because, unlike 2023-2025 when everything rose and fell together, it was a year of sector rotation and long/short pair trades. January required being long oil and metals (gold and silver broke a 15-year base; the Venezuela operation made oil the trade of the year) and then selling the blow-off top or eating a 40% drawdown. The late-February war took the S&P to 6200 and growth stocks down 30-40%; the March-June rally after the first ceasefire was the most aggressive leveraged move in a decade but only in high-beta 'bottleneck' semis and space names ($RKLB, $RDW, $ASTS), while software ($PLTR, $SHOP, $MSFT, $IGV -30%) fell 50-60% on the 'Anthropic kills software' narrative. July revealed why: Leopold's long-semis/short-software trade had been copied and over-levered; his fund blew up but survived, Citadel bought the wreckage, AI names fell 50-60%. August bounced but memory and neocloud momentum faded and space names fell 70% as $SPCX marked the top; late August brought software and hyperscalers back ($META's Muse, $MSFT FCF-positive guide, $AMZN record margins, $AAPL as defensive). October hit new ATHs ($NBIS $250, $NVDA $240) until $CRWV's unsecured debt blew out to 15% yields despite $130B+ backlog, datacenter-delay and credit headlines piled up and the 10-year hit 5.4%. November's midterms, expected to be a clearing event, instead priced a buildout slowdown and a potential 2027 capex-growth peak; Jensen's ouster over the Chinese-spy reports round-tripped the AI trade, hot inflation prints raised hike odds, and last Friday the Nasdaq fell 5.5% in a day with $7.4T of market cap gone in a week. KOSPI round-tripped a +100% move; $MU fell another 25% after already being down 30%; $NOW went $80 to $150 and back on one earnings; $META went $520 to $780 then diluted and crashed; $NVDA traded to 8x forward earnings; BTC pumped 60K to 85K then fell back below 60K with tech. His conclusion: volatility won't end, but being net long exceptional compounders in the most important technology revolution ever, while trimming euphoria and buying despair, beats most strategies, and everyone should have some empathy because this year was genuinely hard.", "tweet_url": "https://x.com/amitisinvesting/status/2126159378336325829", "images": [], "type": "thread", "created_at": "2026-11-27T03:41:12.000Z", "category": "macro"}, {"author": "thedefiedge", "summary": "$10,000 of Bitcoin bought at the October 2025 top is worth about $4,900 today. Good news: this is the zone where the last three bottoms formed; bad news: there may be one more 13% drop first. Five signals: (1) Coins in profit, bullish: on Nov 20 only ~43% of BTC was above its cost basis, lower than right after the 2022 bottom, and in the ~150 days this has been under 45%, BTC was higher a year later every time. (2) Realized price, bearish: the average holder's cost is ~$53.3K vs BTC ~$61.2K, and at the last three bottoms price fell to realized price or below; not yet. (3) Long-term holders selling at a loss (about 36% below cost on Nov 20), bearish for now; he wants losses to shrink while price holds. (4) ETF flows, bearish and 'the big one': ~$5.4B pulled from US spot ETFs in November, already the worst month since launch. (5) Miners just starting to hurt: cost to mine ~$75K vs $61K spot, hashrate down ~7% YoY and the Hash Ribbon just flipped (last flip late Nov 2025, miner recovery took ~3 months and was the real buy signal), though he trusts it less now because miners are redeploying power to AI data centers. Verdict: a good area to start buying slowly but not a confirmed bottom; before sizing up he wants BTC to hold $55-60K, LTH losses to shrink, ETF inflows to return and miners to recover.", "tweet_url": "https://x.com/thedefiedge/status/2126149374233424220", "images": ["https://pbs.twimg.com/media/HYGZlq0aIAA-4I5.jpg"], "type": "tweet", "created_at": "2026-11-27T03:01:27.000Z", "category": "crypto"}, {"author": "Delphi_Digital", "summary": "Kevin Costa argues the AI winners won't just be the frontier labs: \"I actually think there's abundance of opportunity, yet no one wants you to think that, because that's sort of the strategic move... // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
