<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Institutional Research</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #7c3aed;          /* purple — institutional report accent */
  --accent-soft: #f3eefc;
  --divergence: #d94052;      /* divergence red */
  --consensus: #15803d;       /* consensus green */
  --yellow: #fff5b3;

  /* category colors (institutional schema: rates, growth, fx, equities,
     credit, crypto, energy, commodities, geopolitics, ai_tech, em) */
  --cat-rates: #2563eb;
  --cat-growth: #d97706;
  --cat-fx: #0891b2;
  --cat-equities: #15803d;
  --cat-credit: #be185d;
  --cat-crypto: #8b5cf6;
  --cat-energy: #dc2626;
  --cat-commodities: #ea580c;
  --cat-geopolitics: #b91c1c;
  --cat-ai_tech: #4f46e5;
  --cat-em: #059669;
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 980px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 12px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* STATS BAR (top: period + coverage) */
.stats-top { margin-bottom: 16px; padding: 8px 12px; background: var(--surface);
             border: 1px solid var(--border); border-radius: 6px;
             font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
             color: var(--text-2); display: flex; gap: 16px; flex-wrap: wrap; }
.stats-top strong { color: var(--text); font-weight: 600; }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 10px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* THEME CARD (Section A) */
.theme { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.theme:last-child { border-bottom: none; }
.theme-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
              flex-wrap: wrap; }
.theme-title { font-weight: 600; font-size: 14.5px; }
.theme-stance { display: grid; grid-template-columns: 1fr; gap: 6px; margin-bottom: 10px; }
@media (min-width: 720px) { .theme-stance { grid-template-columns: 1fr 1fr; } }
.theme-line { font-size: 13px; padding: 8px 10px; border-radius: 4px;
              border-left: 3px solid var(--border); background: #fafafa; line-height: 1.5; }
.theme-line.consensus { border-left-color: var(--consensus); background: #f0f9f3; }
.theme-line.divergence { border-left-color: var(--divergence); background: #fdf6f7; }
.theme-line .lbl { font-family: 'IBM Plex Mono', monospace; font-size: 10px;
                   text-transform: uppercase; letter-spacing: .06em;
                   color: var(--text-3); display: block; margin-bottom: 2px; }
.theme-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
               border-left: 2px solid var(--border-light); }
.theme-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-source { font-weight: 600; color: var(--accent); }
a.item-source { text-decoration: none; }
a.item-source:hover { text-decoration: underline; }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-title { font-weight: 600; font-size: 14px; margin: 4px 0 6px; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DEEP READS (Section C) — purple left border to mark flagship long-form */
.section-deepreads .item-card { border-left: 4px solid var(--accent); background: var(--accent-soft); }

/* HOUSE VIEWS — compact one-line-per-source list */
.hv-row { display: flex; gap: 10px; align-items: baseline;
          padding: 6px 16px; border-bottom: 1px solid var(--border-light);
          font-size: 13px; }
.hv-row:last-child { border-bottom: none; }
.hv-name { font-weight: 600; color: var(--accent); min-width: 180px;
           text-decoration: none; }
.hv-name:hover { text-decoration: underline; }
.hv-stance { color: var(--text); flex: 1; }

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 110px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .hv-row { flex-direction: column; gap: 2px; }
  .hv-name { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "INSTITUTIONAL RESEARCH", "collected_at": "2026-11-01T03:01:47.000Z", "period": {"lookback_days": 10, "from": "2026-10-22", "to": "2026-11-01"}, "input_stats": {"total_articles": 401, "sources_present": 51, "after_filter": 180}, "summary": "**Rates / Fed:** The Fed held at **3.75–4.00%** on Oct 28 (**10-2**, two dissents for a hike) under Chair **Warsh**, with a December hike the base case (**PIMCO**, **Vanguard**, **Standard Chartered**; market ~**70–76%**). Sharpest split is the path after December: **BCA** sees **25bp per quarter** until inflation or conditions stop it, **Vanguard** and **UBS** say pricing (**3 more hikes in 12m**) is too hawkish, and **PIMCO** sees one more hike in early 2027 then an extended hold.\n\n**Bonds / Credit:** Yields are the story — **10y UST ~4.95–5%** (peaked **5.3%** Oct 5, per Amundi). Houses agree higher yields restore income and the hedge (**PIMCO**, **Vanguard**, **UBS**), but diverge on risk: **PIMCO** expects **credit decompression** (CCC, leveraged AI borrowers underperform) while **BNP** goes **OW high yield / EM debt** and **UW sovereigns/IG**; **Oxford** says term premia stay high as bond-stock correlation turned positive.\n\n**Equities / AI trade:** Consensus is that Q3 earnings are strong (**S&P +26% y/y**, per BNP) but the AI trade is being re-priced on capex funding (**Nasdaq −2.6%, SOX −6.7%** on Oct 22; Meta −7%). **UBS** keeps a constructive 6–12m S&P view and says diversify beyond tech; **Standard Chartered** trims equities to Core and **BCA MacroQuant** goes slight UW equities / OW bonds and cash; **PIMCO** argues AI is crowding out rate-sensitive parts of the economy.\n\n**Oil / Inflation:** **Brent $113–117** (UBS, Citi $115) on the US-Iran conflict; **World Bank** sees Brent avg **$91 in 2026**, **$79 in 2027**. **Goldman** says the premium is precautionary buying and hedging, not lost supply (Gulf refined exports only ~**40%** of 2025 levels). Metals split: **Goldman** sees copper **+10% by end-2027** and gold higher, while **BCA** is **very negative copper** and negative gold.\n\n**Europe / UK / Japan:** ECB held depo at **2.50%**, euro HICP **3.8%** in Sept; **France OAT-Bund 156bp** (from 90bp). **Oxford** says no ECB bond buying even at **300bp** spreads; **BCA** books profits on short OATs and buys French equities tactically. BoE hawks (**Pill**, **Greene**) argue energy second-round effects need prompt action; **BCA** warns UK hike pricing becomes a GBP headwind in 12m.\n\n**Geopolitics / Midterms:** **RBC** sees US escalation vs Iran as increasingly likely (Houthis have joined); **UBS** notes Iran–Saudi talks via Pakistan/Turkey. **Oxford** and **Standard Chartered** expect a Democratic House and Senate on Nov 3, while **BNP** says midterm history alone is no reason to reposition.\n\n**Crypto:** **Binance lost ~$6.4B** (largest theft ever; **Chainalysis** attributes it to North Korea's TraderTraitor, ~$2.8B frozen). **Galaxy** says the **bear market ended in June** and to add BTC (**$81k**, −35% from Oct-2025 high), while **CoinShares** sees defensive positioning after a dip below **$77k**; ICE/NYSE parent is bringing Hyperliquid-based markets into a regulated US framework.", "sections": {"A_debates": [{"theme": "Rates & Central Banks: Fed", "category": ["rates"], "consensus": "The Fed held at 3.75–4.00% on 28 Oct, the first meeting after September's 25bp hike, and the street broadly expects another 25bp hike in December: PIMCO, Vanguard and Standard Chartered all call it, while CoinShares cites ~76% market odds (down from 85%) and Standard Chartered ~70%. Warsh framed the hold as giving September's tightening time to work ('the medicine is starting to work', per PIMCO), with two FOMC dissenters favoring an immediate hike (Yardeni).", "divergence": "The split is about how much comes after December. BCA's Ryan Swift expects a 'go-slow' cycle of 25bp per quarter until falling inflation or tighter financial conditions stop it, i.e. several more hikes. PIMCO sees December plus perhaps one more in early 2027, then an extended hold, and calls it a 'recalibration', not a prolonged cycle. Vanguard agrees on December but expects less tightening than markets price because tariff effects roll off by April–May 2027 (core PCE ~2.5% by late spring) and oil's contribution stays limited. UBS argues pricing of three more 25bp hikes over 12 months is too hawkish and that measured tightening should not derail markets. Oxford Economics is at the hawkish end, expecting major central banks to keep tightening despite higher bond yields. Standard Chartered expects both the Fed and BoJ to hike in December.", "items": [{"source": "pimco", "name": "PIMCO", "thesis": "Fed held 3.75–4.0% with a clear tightening bias; PIMCO expects another 25bp hike in December and a risk of one more in early 2027, then an extended hold. Spreads for CCC and parts of the AI value chain have widened, giving the Fed room to wait.", "url": "https://www.pimco.com/us/en/insights/fed-pauses-as-rate-recalibration-continues", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "Preview (22 Oct): hold with tightening bias; December hike most likely; market priced ~80% hold. Three tells: how Warsh frames the hold, whether the majority still sees September as risk management, number of hike dissents.", "url": "https://www.pimco.com/us/en/insights/october-fed-meeting-preview-a-pause-is-still-a-recalibration", "images": []}, {"source": "vanguard", "name": "Vanguard", "thesis": "Vanguard shares the market's December hike view but expects less tightening than priced; shock-driven inflation (tariffs, energy, AI demand) moderates by H2 2027. Oil has been ~$100 for much of the year.", "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/inflation-remains-front-center-as-fed-holds.html", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "BCA: Fed will hike 25bp per quarter until falling inflation or tighter financial conditions stop it (full text paywalled).", "url": "https://www.bcaresearch.com/reports/go-slow-fed-tightening-cycle-28-10-2026/227339", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "UBS: market pricing (three more 25bp hikes in 12m) too hawkish; S&P 500 to keep rising over 6–12m as the Fed tightens modestly; 10y UST just above 5%.", "url": "https://www.ubs.com/us/en/wealth-management/insights/investment-research/insights-display-adp/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-28102026.html?caasID=CAAS-ActivityStream", "images": []}, {"source": "yardeni_research", "name": "Yardeni Research", "thesis": "Yardeni: FOMC voted 10-2 to hold, two dissenters wanted +25bp; Warsh sounded hawkish on growth/inflation but argued September's hike already tightened conditions and productivity allows expansion without overheating.", "url": "https://yardeni.com/research/quicktakes/2026/10/29/us-economy-continues-to-roar-while-the-fed-waits-for-more", "images": []}, {"source": "peterson_institute", "name": "Peterson Institute (PIIE)", "thesis": "Furman (PIIE) argues the Fed is off its own reaction function and should explain why (blog; body not fully captured).", "url": "https://www.piie.com/blogs/realtime-economics/2026/fed-its-own-reaction-function-it-should-tell-us-why", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Standard Chartered: ~70% odds of December Fed hike; US Q3 GDP +3.4% annualised, core PCE (Sept) 3.1% y/y; 10y 4.94%, 2y 4.60%; DXY range 101.50–103.00.", "url": "https://www.sc.com/sg/market-outlook/daily-navigator-30-10-2026/?mvog=1", "images": []}]}, {"theme": "Global Central Banks, Europe & France", "category": ["rates", "fx"], "consensus": "Central banks outside the US are leaning hawkish on energy-driven inflation: the ECB held its deposit rate at 2.50% warning of energy risks (Standard Chartered), euro-area HICP hit 3.8% in September from 3.2% (Gavekal), the BoE's Pill backs Bank Rate at 4%, and Oxford expects major central banks to keep tightening. Everyone agrees French fiscal stress is the main European wild card (OAT-Bund 156bp vs 90bp in early September, per Gavekal).", "divergence": "On France, Oxford Economics expects spreads could exceed its 200bp baseline peak, even reach 300bp, ahead of April's presidential election without an outright debt crisis and without ECB bond purchases unless financial stability is at risk. Gavekal's Gemehl frames it as whether the ECB can keep hiking despite fragmentation risk (can, but not necessarily will). BCA says vigilantes got ahead of themselves: it books profits on short OATs, eyes a new opening in early 2027 as election risk resurfaces and tactically buys cheap French equities. On rate paths, markets price two more ECB hikes by H1 2027 while Standard Chartered expects one by year-end then a pause; Lagarde will step down 7 Feb 2027. In the UK, BoE speakers Greene and Taylor stress second-round risk from energy, while BCA warns market hike pricing is a GBP headwind within 12 months. In China, Gavekal says the PBOC's switch to the overnight reverse repo is not a stealth cut.", "items": [{"source": "gavekal", "name": "Gavekal Research", "thesis": "Gavekal: euro HICP 3.8% y/y; OAT-Bund spread 156bp vs 90bp in early September; ECB can still hike but fragmentation stress complicates it.", "url": "https://research.gavekal.com/teaser/the-french-effect-on-ecb-policy/", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "Oxford: French spreads could rise well above its 200bp baseline peak (even 300bp) before April's election; ECB support unlikely absent a financial-stability event.", "url": "https://www.oxfordeconomics.com/resource/frances-fiscal-crisis-is-unlikely-to-prompt-ecb-action/", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "BCA: books profits on short OATs, eyes an opportunity in early 2027; buys French equities tactically on depressed valuations.", "url": "https://www.bcaresearch.com/reports/have-we-seen-le-peak-yet-french-yields-30-10-2026/227369", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "Oxford: higher bond yields won't deter central banks from hiking; fiscal worries erode inflation-fighting credibility, so premia won't make them dovish; large-scale intervention unlikely absent stability problems.", "url": "https://www.oxfordeconomics.com/resource/how-will-central-banks-react-to-higher-bond-yields/", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "BoE's Pill explains support for raising Bank Rate to 4%: prompt, decisive action keeps Middle East inflation from embedding (speech dated 3 Sep).", "url": "https://www.bankofengland.co.uk/speech/2026/september/remarks-at-the-edinburgh-chamber-of-commerce", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "BoE's Greene challenges the view that labour-market slack will contain wages and second-round effects from the energy shock (20 Oct).", "url": "https://www.bankofengland.co.uk/speech/2026/october/megan-greene-speech-at-lse-economics-society-london", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "BCA: GBP carry attractive but aggressive hike pricing becomes a headwind within 12 months.", "url": "https://www.bcaresearch.com/reports/gbp-chartpack-carry-cushion-masks-structural-cracks-29-10-2026/227352", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Gavekal: PBOC moved its policy rate to the overnight reverse repo (reportedly 15bp below 7-day); not a stealth cut, bond yields kept low and stable.", "url": "https://research.gavekal.com/teaser/switching-the-policy-rate/", "images": []}]}, {"theme": "Equities & the AI Trade", "category": ["equities", "ai_tech"], "consensus": "Earnings are strong but the market now demands proof that AI capex converts to cash flow. BNP shows S&P 500 Q3 profits +26% y/y and Europe +40%, yet beats are only ~2% vs a typical 3–4%, with Nasdaq 100 surprises −3% and EM tech −8%. UBS recorded a −2.6% Nasdaq day (steepest since 5 June), SOX −6.7%, Meta −7%; Goldman's desks and Amundi describe investors cutting crowded AI exposure and rotating to dividend payers.", "divergence": "UBS stays constructive (S&P higher over 6–12 months, AI demand 'robust', but warns of mid-cycle capex indigestion and advises building resilience beyond tech). BNP keeps a moderate overweight global equities (US, Japan, EM; financials, healthcare) and notes consensus Nasdaq 100 2027 EPS growth of 35%. Standard Chartered moves the other way, trimming equities to Core on event risk and high earnings expectations (still preferring US and Asia ex-Japan, upgrading India to OW). BCA's MacroQuant is slight underweight equities with overweight bonds and cash. PIMCO's angle is macro: the >$1tn AI capex boom is reallocating rather than expanding activity because hyperscalers are insensitive to rates while housing, small firms and leveraged borrowers bear the cost. Deutsche's CIOs argue the productivity dividend is still to come.", "items": [{"source": "ubs", "name": "UBS", "thesis": "UBS (23 Oct): Nasdaq −2.6%, SOX −6.7% to lowest since July, Meta −7% on capex; equal-weight S&P +0.8%; Brent +4% to $113; 10y UST −17bp to 4.95%. View unchanged: robust earnings support equities.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-23102026.html", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "UBS (30 Oct): tech-led selloff over capex funding; Nasdaq futures −2%; Brent ~$117. 'Rising risk of mid-cycle capex indigestion'; build resilient portfolio beyond tech.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-30102026.html", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "thesis": "BNP: S&P Q3 EPS +26% y/y, Europe +40%, but beat only 2% (Nasdaq 100 −3%, EM tech −8%); consensus Nasdaq 100 2027 EPS growth 35%, EM tech 39%.", "url": "https://www.bnpparibas-am.com/en-us/front-of-mind/view-from-the-markets-the-earnings-season-has-been-good-but-is-it-good-enough/", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Goldman's Privorotsky: the 'long AI, short everything else' trade is unwinding; investors want evidence capex turns into revenue; 'seismic shift' from savings glut to spending glut plus high energy lowers risk appetite.", "url": "https://www.goldmansachs.com/insights/the-markets/why-investors-are-reducing-ai-exposure", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Goldman derivatives desk: put buying has risen and call activity waned as investors separate AI winners and losers; S&P options were implying a 60–65 basis point move into the Fed.", "url": "https://www.goldmansachs.com/insights/the-markets/bullish-options-trades-trades-slow-amid-ai-uncertainty", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "PIMCO: AI capex >$1tn is reallocating, not expanding, activity; hyperscalers shrug off higher rates while housing, small firms and leveraged borrowers absorb the cost.", "url": "https://www.pimco.com/us/en/insights/is-ai-crowding-out-the-rest-of-the-economy", "images": []}, {"source": "amundi", "name": "Amundi", "thesis": "Amundi: confidence in AI weakened, MSCI World Tech gave back prior month's gain; rotation into dividend payers.", "url": "https://research-center.amundi.com/article/dividends-shine-tech-cools", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Standard Chartered: trims equities to Core, balanced stance vs bonds; keeps US and AxJ, upgrades India to OW; OW gold and EM USD bonds.", "url": "https://www.sc.com/sg/market-outlook/global-market-outlook-30-10-2026/?mvog=1", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "BCA MacroQuant: slight underweight equities, overweight bonds and cash; bullish USD, negative gold, very negative copper, neutral oil.", "url": "https://www.bcaresearch.com/reports/macroquant-model-update-show-me-money-30-10-2026/227363", "images": []}, {"source": "deutsche_bank", "name": "Deutsche Bank Wealth Mgmt", "thesis": "Deutsche: AI is capital-deepening first (chips, infrastructure, utilities, hyperscalers); productivity benefits broaden to services, healthcare, financials, industrials over time.", "url": "https://wealth.db.com/en/insights/investing-insights/investing-themes/ai-and-economic-growth-waiting-for-the-productivity-dividend.html", "images": []}]}, {"theme": "Bonds, Credit & Housing", "category": ["rates", "credit"], "consensus": "After the 2026 yield reset (10y UST ~4.95–5%; 5.3% peak on 5 Oct per Amundi), most houses say bonds again offer income and a hedge: PIMCO notes duration diversified during the tech selloff, Vanguard says the case for fixed income has strengthened, UBS publishes 'the case for bonds beyond peak yields'. Mortgage rates near 7.5% (PIMCO/MBA) are hammering housing; Goldman sees 2027 existing home sales at 3.9m and prices +0.8%.", "divergence": "Dispersion is by quality and duration. PIMCO expects 'credit decompression': CCC borrowers, fiscally weak sovereigns and leveraged AI issuers underperform as AI debt supply competes for capital. BNP is moderately underweight sovereigns and IG but overweight shorter-duration high yield and EM debt for carry. Standard Chartered is OW EM USD bonds (corporates over sovereigns, 3–7 year duration) and favours TIPS, AAA CLOs and US HY, having closed its opportunistic US 10y long. Oxford's view is structural: term premia are back to mid-2000s levels because bond-stock correlation turned positive in Q3 2023, so bonds hedge less and premia stay high, even for inflation-linked. Barclays' rates desk adds that energy pass-through to inflation swaps is non-linear (one-year swap sensitivity ~3x at the 75th–90th percentile of energy prices).", "items": [{"source": "pimco", "name": "PIMCO", "thesis": "PIMCO credit: higher yields restore income and hedge role, but credit decompression should deepen; housing faces prolonged adjustment, not a crisis.", "url": "https://www.pimco.com/us/en/insights/the-credit-market-lens-the-other-side-of-higher-yields", "images": []}, {"source": "vanguard", "name": "Vanguard", "thesis": "Vanguard Q4 active fixed income: case for fixed income has strengthened; higher yields materially improve prospective returns.", "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/active-fixed-income-perspectives-q4-2026-looking-through-fog.html", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "Oxford: more than half of the rise in advanced-economy yields since 2020 is term premium; premia are at mid-2000s levels and likely to stay high.", "url": "https://www.oxfordeconomics.com/resource/why-bond-yields-and-term-premia-are-likely-to-remain-high/", "images": []}, {"source": "barclays", "name": "Barclays", "thesis": "Barclays rates trading: repeated energy shocks may justify an inflation risk premium; pass-through is non-linear.", "url": "https://www.ib.barclays/content/barclaysmicrosites/ibpublic/en/our-insights/repricing-inflation-risk-in-an-era-of-repeated-energy-supply-shocks.html", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "PIMCO: 30y mortgage rate 7.5% (MBA); Trump housing order could raise rates if applied to refinancings; 1pt lower mortgage rate ≈ a 10% house-price cut for payments.", "url": "https://www.pimco.com/us/en/insights/policy-options-are-available-now-to-lower-us-mortgage-rates", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Goldman: 2027 existing home sales 3.9m (vs 4.0m 2026, 26% below 2019); home prices +0.8% (after +1.1%); rebound in H2 2027 if mortgage rates fall.", "url": "https://www.goldmansachs.com/insights/articles/the-outlook-for-us-housing-in-2027-amid-rising-mortgage-rates", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "thesis": "BNP multi-asset: moderate UW sovereigns and IG, moderate OW HY and EM debt; caution on duration.", "url": "https://www.bnpparibas-am.com/en-us/portfolio-perspectives/multi-asset-investment-views-will-of-the-people/", "images": []}]}, {"theme": "Energy, Commodities & Inflation", "category": ["energy", "commodities"], "consensus": "Oil is elevated on the US-Iran conflict: Citi cites Brent $115, UBS $113 (23 Oct) and ~$117 (30 Oct). Houses agree inventories are depleted and risk is skewed up: World Bank sees energy +32% in 2026 and total commodities +23%, and Citi flags a 'Super El Niño' lifting food prices toward year-end.", "divergence": "On drivers, Goldman's Struyven argues Middle East flows have rebounded and the premium reflects precautionary physical buying and portfolio hedging (stocks and bonds are unusually oil-sensitive), with Gulf refined product exports only ~40% of 2025 levels. World Bank sees mean reversion (Brent $91 average 2026, $79 in 2027, assuming no major escalation), while Vanguard has oil near $100 for most of the year with limited ongoing inflation contribution. On metals, Goldman expects copper +10% by end-2027 and gold higher on central-bank demand; Standard Chartered stays OW gold; BCA's MacroQuant is very negative copper and negative gold and bullish USD. Wood Mackenzie flags European gas shortage risk this winter.", "items": [{"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Goldman oil podcast: precautionary buying and hedging keep prices high despite recovered flows; Gulf refined exports ~40% of 2025; copper +10% by end-2027; gold may climb.", "url": "https://www.goldmansachs.com/insights/goldman-sachs-exchanges/why-oil-prices-are-surging-despite-recovering-supply", "images": []}, {"source": "world_bank", "name": "World Bank", "thesis": "World Bank CMO: commodities +23% in 2026, energy +32%, food +18% over 2026–27; Brent avg $91 (2026) and $79 (2027).", "url": "https://www.worldbank.org/en/news/press-release/2026/10/28/commodity-markets-outlook-october-2026", "images": []}, {"source": "bridgewater", "name": "Bridgewater", "thesis": "Bridgewater hosts Dan Yergin: calls the Iran war 'the mother of all supply shocks'; energy security and AI power demand reshape markets.", "url": "https://www.bridgewater.com/research-and-insights/pulitzer-prize-winner-dan-yergin-on-how-the-iran-war-is-reshaping-the-energy-map-and-the-race-to-power-ai", "images": []}, {"source": "citi_gps", "name": "Citi", "thesis": "Citi: record 'Super El Niño' to affect sugar, cocoa, coffee, palm oil; food inflation uptick late 2026, effects into early 2027.", "url": "https://www.citigroup.com/global/insights/e91-el-nino-rising-tides-and-prices", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "thesis": "Wood Mackenzie: winter 2026-27 gas outlook flags growing threat of European shortages.", "url": "https://www.woodmac.com/news/opinion/need-to-know-gas-in-winter-2026-27/", "images": []}]}, {"theme": "Geopolitics & US Midterms", "category": ["geopolitics", "equities"], "consensus": "Nov 3 midterms are a central event: Oxford says Democrats are now favoured to win both House and Senate (higher gasoline prices raising sweep odds), and Standard Chartered expects the same. Houses agree the Iran conflict is not resolved by election-season pressure.", "divergence": "RBC is the most alarmed: US military escalation vs Iran looks increasingly likely, the Houthis have entered the war, and the open question is a final strike versus a broader operation, with Democratic control sharpening fights over war funding. UBS sees a thaw signal: Iran–Saudi talks mediated by Pakistan and Turkey nudged oil lower (26 Oct). Gavekal notes Zelenskyy said Ukraine would accept a ceasefire along current lines of control. On market impact, RBC advises preparing for all outcomes, BNP says midterm history gives little reason to reposition and expects no change in Middle East course, Amundi flags fiscal gridlock, and Oxford says data-centre regulation is on the ballot.", "items": [{"source": "rbc", "name": "RBC Capital Markets", "thesis": "RBC: US escalation vs Iran increasingly likely; Houthis in the war; size of Democratic win shapes Republican defections on war funding.", "url": "https://www.rbccm.com/en/insights/2026/10/margins-matter-in-us-midterm-elections", "images": []}, {"source": "rbc", "name": "RBC Capital Markets", "thesis": "RBC midterm musings: be prepared for all outcomes; equity implications per historical playbook; 3Q26 reporting 'lackluster', strength in healthcare flows.", "url": "https://www.rbccm.com/en/insights/2026/10/midterm-musings", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "Oxford: Democrats now favoured for both House and Senate; higher US gas prices raise sweep odds.", "url": "https://www.oxfordeconomics.com/resource/us-higher-gas-prices-boost-odds-of-a-democratic-sweep/", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "UBS: Iran–Saudi talks (Pakistan/Turkey mediating) lifted sentiment; Lula's fourth term; France ratings agency inaction.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/market-insights/paul-donovan/2026/optimism-of-a-sort.html", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Gavekal (Gave): Anthropic IPO week of 16 Nov, Iran–Saudi–Turkey–Pakistan talks, Ukraine open to ceasefire on current lines, China 'not really' cutting.", "url": "https://research.gavekal.com/teaser/one-thing-after-another/", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "Oxford: a Democratic sweep would raise odds of federal legislation making data centres contribute more to grid costs.", "url": "https://www.oxfordeconomics.com/resource/us-data-centers-are-on-the-ballot/", "images": []}]}, {"theme": "Crypto", "category": ["crypto"], "consensus": "Bitcoin is resilient but range-bound around $77–84k; the shared backdrop is a hawkish Fed hold and equity volatility (CoinShares), and the record Binance theft (~$6.4B per Chainalysis, $6.3B per Galaxy) dominates security headlines, with Chainalysis tying it to North Korea's TraderTraitor.", "divergence": "Galaxy's Alex Thorn (note dated 22 Oct) says the bear market ended in June and to add and hold BTC: 200-week MA held, sellers (basis traders, macro tourists) cut ETF/futures exposure by over half, BTC needs +53% to retake its all-time high. CoinShares is more cautious: investors are positioned defensively, leverage premiums have shrunk, BTC dipped below $77k and recovery is selective rather than euphoric. On structure, CoinShares says stablecoins now move bank and exchange earnings, and the ICE/NYSE parent's regulated Hyperliquid deal is read by Galaxy and CoinShares as TradFi integration.", "items": [{"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "Galaxy: 'We believe the bottom is in'; BTC $81,391 on 22 Oct, −35% from Oct-2025 high, +39% from 30 Jun low; 200-week MA held.", "url": "https://www.galaxy.com/insights/research/why-now-bitcoin-buy-hold-2026", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "CoinShares: BTC consolidated, brief dip below $77k; defensive positioning, shrunken leverage premium; Warsh less hawkish than feared.", "url": "https://coinshares.com/insights/research-data/market-update-30-10-2026/", "images": []}, {"source": "chainalysis", "name": "Chainalysis", "thesis": "Chainalysis: ~$6.4B stolen from Binance hot wallets on 29 Oct; attributed to TraderTraitor; ~$2.8B frozen; commingled with last month's Bitget theft.", "url": "https://www.chainalysis.com/blog/binance-exploit-latest-findings-and-response/", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "Galaxy: Binance loses $6.3B, the largest robbery in history.", "url": "https://www.galaxy.com/insights/research/here-we-go-again-binance-loses-6-3b-in-largest-robbery-in-history", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "Galaxy weekly brief: Binance hack; Hyperliquid on Wall Street; prediction markets' Brazil 'miss'.", "url": "https://www.galaxy.com/insights/research/binance-hack-hyperliquid-perps-brazil-prediction-markets", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "CoinShares equities: Dec FOMC hike odds 76% (from 85%); ICE agreement for Hyperliquid-based markets in a regulated US framework.", "url": "https://coinshares.com/insights/research-data/equities-update-30-10-2026/", "images": []}]}, {"theme": "Growth & EM", "category": ["growth", "em"], "consensus": "Growth is resilient: Citi forecasts global GDP of 2.7% in 2026 and 2.8% in 2027 despite the Iran conflict, with US strength; US Q3 GDP printed +3.4% annualised (Standard Chartered) and BofA Institute card spending was +6.2% y/y in September.", "divergence": "Views differ on EM and China. Citi sees Asian strength offset by weaker Middle East and Africa; Oxford says the GCC rebound has stalled; Gavekal says China's 2026 target is in the bag but momentum is weak heading into 2027; BCA expects only top-tier Chinese housing to bottom late next year while the rest stays oversupplied, and calls Indonesia a value trap. BNP is constructive on EM debt, Standard Chartered upgrades India to OW, and UBS flagged an almost 20% Brazil market drop after Lula's win.", "items": [{"source": "citi_gps", "name": "Citi", "thesis": "Citi: global growth 2.7% (2026), 2.8% (2027); Brent $115; inflation risks lead to a more hawkish stance across central banks.", "url": "https://www.citigroup.com/global/insights/the-global-economys-tenuous-balance-resilience-amid-uncertainty", "images": []}, {"source": "bofa", "name": "Bank of America Institute", "thesis": "BofA Institute: card nditions stop it. MacroQuant: slight UW equities, OW bonds and cash, bullish USD, negative gold, very negative copper, neutral oil.", "category": ["rates", "equities", "commodities"], "url": "https://www.bcaresearch.com/reports/macroquant-model-update-show-me-money-30-10-2026/227363", "images": []}, {"source": "bca_research", "name": "BCA Research", "call": "France: take profits on short OATs (look again early 2027); tactically buy French equities.", "category": ["rates", "equities"], "url": "https://www.bcaresearch.com/reports/have-we-seen-le-peak-yet-french-yields-30-10-2026/227369", "images": []}, {"source": "bca_research", "name": "BCA Research", "call": "Canada: bonds have room to outperform as the economy limits how far BoC can hike.", "category": ["rates"], "url": "https://www.bcaresearch.com/reports/canadian-bonds-have-room-outperform-29-10-2026/227346", "images": []}, {"source": "ubs", "name": "UBS", "call": "Market pricing of three more Fed hikes in 12m is too hawkish; S&P 500 higher over 6–12m; diversify beyond tech; constructive on equities, fixed income and gold.", "category": ["rates", "equities"], "url": "https://www.ubs.com/us/en/wealth-management/insights/investment-research/insights-display-adp/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-28102026.html?caasID=CAAS-ActivityStream", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "call": "Trim equities to Core (balanced vs bonds); prefer US and Asia ex-Japan; upgrade India to Overweight; OW gold and EM USD bonds (corporates over sovereigns, 3–7y duration); ideas: TIPS, AAA CLOs, US HY, US healthcare.", "category": ["equities", "credit", "commodities"], "url": "https://www.sc.com/sg/market-outlook/global-market-outlook-30-10-2026/?mvog=1", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "call": "DXY range 101.50–103.00; EUR/USD 1.1164 support / 1.1199 resistance; USD/JPY 157.50–158.00; ECB one hike ates squeeze the rest of the economy."}, {"source": "pimco", "name": "PIMCO", "thesis": "", "url": "https://www.pimco.com/us/en/insights/fed-pauses-as-rate-recalibration-continues", "images": [], "title": "Fed Pauses as Rate Recalibration Continues", "summary": "Fed held at 3.75–4.0% after September's hike with a clear tightening bias. PIMCO expects a December hike and risk of one more in early 2027 followed by an extended hold. Warsh's reasoning: allow time to assess September's hike and tighter financial conditions; a majority believes 'the medicine is starting to work'. Longer Treasury yields have risen, CCC and AI-value-chain spreads widened, which gives the Fed room to wait."}, {"source": "citi_gps", "name": "Citi", "thesis": "", "url": "https://www.citigroup.com/global/insights/the-global-economys-tenuous-balance-resilience-amid-uncertainty", "images": [], "title": "The Global Economy’s Tenuous Balance: Resilience Amid Uncertainty", "summary": "Citi's Nathan Sheets team: GDP growth 2.7% in 2026 and 2.8% in 2027, slightly stronger than last month, with developed markets (US) better and EM slightly softer (Asia strength offset by Middle East and Africa). The US-Iran conflict has pushed Brent to $115; inflation risks have intensified, prompting many central banks to turn more hawkish. AI remains a major growth driver but financial excesses, weakening political support and cyber risks threaten the investment boom's sustainability; French fiscal worries add to sovereign debt pressure."}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "", "url": "https://www.oxfordeconomics.com/resource/why-bond-yields-and-term-premia-are-likely-to-remain-high/", "images": [], "title": "Why bond yields and term premia are likely to remain high", "summary": "Oxford decomposes the 10-year yield into expected policy rates and term premium: since 2020 more than half the rise in advanced-economy yields is term premium, now back at mid-2000s levels. Bond-stock correlations were negative for most of the century, turned positive in Q3 2023 and have risen steeply, making bonds a worse equity hedge as in the 1980s–90s, so investors demand more compensation, now also on inflation-indexed bonds. Oxford expects this and a higher premium to persist given more frequent supply shocks and more hawkish central banks."}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "", "url": "https://www.galaxy.com/insights/research/why-now-bitcoin-buy-hold-2026", "images": [], "title": "Why Now Is the Time to Add and Hold BTC", "summary": "Galaxy's Alex Thorn (22 Oct): BTC at $81,391, −35% from its Oct-2025 high and +39% from the 30 June 2026 low. Thesis: the bear market ended in June, accumulation phase; the 200-week MA held, the 50-week has been regained for five weeks, and at day 916 of the halving cycle BTC is past the window where every prior cycle bottomed. Forced sellers have gone (basis traders and macro tourists cut ETF/futures exposure by more than half), equities are near records while BTC needs +53% to retake its high, and the debasement case has strengthened."}, {"source": "chainalysis", "name": "Chainalysis", "thesis": "", "url": "https://www.chainalysis.com/blog/binance-exploit-latest-findings-and-response/", "images": [], "title": "Binance Hack: Tracing the $6.4 Billion Theft to North Korea", "summary": "Funds began leaving Binance hot wallets across multiple blockchains around 4:20pm ET on 29 Oct; about $6.4B was taken, the largest theft in crypto history. Chainalysis attributes it to TraderTraitor (DPRK) and says proceeds commingled with last month's Bitget theft. Freezes began by 5:14pm ET; about $2.8B frozen. The attacker swapped $325M of stablecoins into $285M of ETH over about 20 minutes to stay ahead of freezes, and laundering shows automation (thousands of transactions, addresses first receiving exactly 1 TRX)."}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "", "url": "https://www.goldmansachs.com/insights/goldman-sachs-exchanges/why-oil-prices-are-surging-despite-recovering-supply", "images": [], "title": "Why Oil Prices Are Surging Despite Recovering Supply", "summary": "Goldman's Daan Struyven: Middle East crude flows have rebounded but prices stay high and rising because of precautionary physical buying and portfolio hedging (stocks and bonds unusually sensitive to oil). Persian Gulf refined product exports are only ~40% of 2025 average levels amid refinery damage and underinvestment. Copper expected +10% by end-2027; gold may climb on central-bank demand."}, {"source": "bridgewater", "name": "Bridgewater", "thesis": "", "url": "https://www.bridgewater.com/research-and-insights/pulitzer-prize-winner-dan-yergin-on-how-the-iran-war-is-reshaping-the-energy-map-and-the-race-to-power-ai", "images": [], "title": "Dan Yergin on how the Iran war is reshaping the energy map", "summary": "Bridgewater podcast with S&P Global's Daniel Yergin: calls the situation 'the mother of all supply shocks'; covers how producers respond, the global push for energy security, modern mercantilism, the race to power the AI build-out, and the political debate over AI energy use (guest views not Bridgewater's)."}, {"source": "world_bank", "name": "World Bank", "thesis": "", "url": "https://www.worldbank.org/en/news/press-release/2026/10/28/commodity-markets-outlook-october-2026", "images": [], "title": "Commodity Markets Outlook (October 2026)", "summary": "World Bank: commodity prices +23% in 2026 then −7% in 2027; energy +32% in 2026, reversing three years of declines; Brent $91 average in 2026 ($69 in 2025), $79 in 2027; food prices +10% in 2026 and +7% in 2027 as conflict disrupts grain shipments and El Niño threatens harvests. Oil stocks are depleted so the world is more exposed; forecasts assume no major escalation."}], "D_charts": [{"source": "pimco", "name": "PIMCO", "url": "https://www.pimco.com/us/en/insights/is-ai-crowding-out-the-rest-of-the-economy", "chart": "PIMCO stern Hemisphere focus); no market calls.", "category": "geopolitics", "url": "https://www.cfr.org/programs/the-future-of-american-strategy"}]}, "coverage": {"sources_covered": 43, "sources_total": 51, "coverage_pct": 84}};

// ---------- helpers ----------
const CAT_VARS = {
  rates: 'var(--cat-rates)',
  growth: 'var(--cat-growth)',
  fx: 'var(--cat-fx)',
  equities: 'var(--cat-equities)',
  credit: 'var(--cat-credit)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  commodities: 'var(--cat-commodities)',
  geopolitics: 'var(--cat-geopolitics)',
  ai_tech: 'var(--cat-ai_tech)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }
function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}
function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}
function pills(cats) {
  if (!cats) return '';
  if (Array.isArray(cats)) return cats.map(pill).join(' ');
  return pill(cats);
}
function externalLink(url, label) {
  if (!url) return '';
  return `<a class="item-link" href="${escapeAttr(url)}" target="_blank" rel="noopener">${label || 'link →'}</a>`;
}
function nameLink(url, name) {
  if (!name) return '';
  if (!url) return `<span class="item-source">${escapeHtml(name)}</span>`;
  return `<a class="item-source" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderThemeItem(it) {
  return `
    <div class="theme-item">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.thesis || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderTheme(theme) {
  const items = (theme.items || []).map(renderThemeItem).join('');
  return `
    <div class="theme">
      <div class="theme-head">
        ${pills(theme.category)}
        <div class="theme-title">${escapeHtml(theme.theme || '')}</div>
      </div>
      <div class="theme-stance">
        ${theme.consensus ? `<div class="theme-line consensus"><span class="lbl">Consensus</span>${renderBold(theme.consensus)}</div>` : ''}
        ${theme.divergence ? `<div class="theme-line divergence"><span class="lbl">Divergence</span>${renderBold(theme.divergence)}</div>` : ''}
      </div>
      ${items ? `<div class="theme-items">${items}</div>` : ''}
    </div>`;
}

function renderCall(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${pills(it.category)}
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.call || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderDeepRead(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url, 'read →')}
      </div>
      ${it.title ? `<div class="item-title">${escapeHtml(it.title)}</div>` : ''}
      <div class="item-text">${renderBold(it.summary || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderChart(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.chart || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderHouseView(hv) {
  const name = hv.name || hv.source || '';
  const nameHtml = hv.url
    ? `<a class="hv-name" href="${escapeAttr(hv.url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`
    : `<span class="hv-name">${escapeHtml(name)}</span>`;
  return `
    <div class="hv-row">
      ${nameHtml}
      <span class="hv-stance">${renderBold(hv.stance || '')}</span>
    </div>`;
}

function renderSection(letter, name, items, render, extraClass) {
  if (!items || !items.length) return '';
  const body = items.map(render).join('');
  const cls = 'section' + (extraClass ? (' ' + extraClass) : '');
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderTopStats(d) {
  const parts = [];
  const p = d.period || {};
  const is = d.input_stats || {};
  const cv = d.coverage || {};
  if (p.from && p.to)
    parts.push(`period <strong>${escapeHtml(p.from)} → ${escapeHtml(p.to)}</strong>`);
  else if (p.lookback_days != null)
    parts.push(`lookback <strong>${p.lookback_days}d</strong>`);
  if (is.total_articles != null) parts.push(`articles <strong>${is.total_articles}</strong>`);
  if (is.sources_present != null) parts.push(`sources <strong>${is.sources_present}</strong>`);
  if (is.after_filter != null) parts.push(`after filter <strong>${is.after_filter}</strong>`);
  if (cv.coverage_pct != null) {
    const pct = (cv.coverage_pct <= 1 ? cv.coverage_pct * 100 : cv.coverage_pct);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  } else if (cv.sources_covered != null && cv.sources_total != null) {
    parts.push(`coverage <strong>${cv.sources_covered}/${cv.sources_total}</strong>`);
  }
  return parts.join(' | ');
}

function reportDate(d) {
  if (d.period && d.period.to) return d.period.to;
  if (d.collected_at) return String(d.collected_at).slice(0, 10);
  return '';
}

// ---------- interactions ----------
function toggleSection(headEl) { headEl.parentElement.classList.toggle('open'); }
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('lightbox').classList.contains('open')) {
    closeLightbox();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = reportDate(d);
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  const s = d.sections || {};
  const out = [
    renderSummary(d.summary),
    renderSection('A.', 'Debates — Consensus vs Divergence', s.A_debates,    renderTheme),
    renderSection('B.', 'Key Calls & Positioning',           s.B_calls,      renderCall),
    renderSection('C.', 'Notable Deep Reads',                s.C_deep_reads, renderDeepRead,
                  'section-deepreads'),
    renderSection('D.', 'Charts & Data',                     s.D_charts,     renderChart),
    renderSection('E.', 'House Views',                       s.house_views,  renderHouseView),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = out || '<div class="empty">No report data.</div>';

  // Auto-open Summary's section view: first two sections open by default.
  document.querySelectorAll('.section').forEach((sec, i) => {
    if (i < 2) sec.classList.add('open');
  });
}

renderReport(REPORT_DATA);
</script>
