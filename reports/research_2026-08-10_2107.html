let activeCat = "All";
let activeUrg = "All";
let activeSrc = null;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function buildMeta() {
  document.getElementById('metaLine').textContent =
    META.date + " · " + META.time + " · " + META.itemsExtracted + " items from " + META.includedSources.length + " sources";
}

function buildFilterBars() {
  const catCounts = {};
  ITEMS.forEach(i => catCounts[i.cat] = (catCounts[i.cat]||0)+1);
  const catBar = document.getElementById('catBar');
  let html = '<button class="pill active" data-cat="All" onclick="setCat(\'All\')">All (' + ITEMS.length + ')</button>';
  Object.keys(catCounts).sort().forEach(c => {
    html += '<button class="pill" data-cat="' + esc(c) + '" style="--pc:' + CATCOLORS[c] + '" onclick="setCat(\'' + c.replace(/'/g,"\\'") + '\')">' + esc(c) + ' (' + catCounts[c] + ')</button>';
  });
  catBar.innerHTML = html;

  const urgCounts = { act:0, deep:0, watch:0 };
  ITEMS.forEach(i => urgCounts[i.urgency]++);
  const urgBar = document.getElementById('urgBar');
  let uhtml = '<button class="pill active" data-urg="All" onclick="setUrg(\'All\')">All (' + ITEMS.length + ')</button>';
  ['act','deep','watch'].forEach(u => {
    uhtml += '<button class="pill" data-urg="' + u + '" onclick="setUrg(\'' + u + '\')">' + URG_LABEL[u] + ' (' + urgCounts[u] + ')</button>';
  });
  urgBar.innerHTML = uhtml;
}

function setCat(c) {
  activeCat = c;
  activeSrc = null;
  document.querySelectorAll('#catBar .pill').forEach(b => {
    const isActive = b.getAttribute('data-cat') === c;
    b.classList.toggle('active', isActive);
    b.style.background = isActive ? (c === 'All' ? '#444' : CATCOLORS[c]) : 'transparent';
    b.style.color = isActive ? '#fff' : '#444';
    b.style.borderColor = isActive ? 'transparent' : '#ccc5b8';
  });
  render();
}

function setUrg(u) {
  activeUrg = u;
  activeSrc = null;
  document.querySelectorAll('#urgBar .pill').forEach(b => {
    const isActive = b.getAttribute('data-urg') === u;
    b.classList.toggle('active', isActive);
    b.style.background = isActive ? '#444' : 'transparent';
    b.style.color = isActive ? '#fff' : '#444';
    b.style.borderColor = isActive ? 'transparent' : '#ccc5b8';
  });
  render();
}

function filterBySrc(name) {
  activeSrc = name;
  activeCat = "All";
  activeUrg = "All";
  document.querySelectorAll('#catBar .pill').forEach(b => {
    const isActive = b.getAttribute('data-cat') === 'All';
    b.classList.toggle('active', isActive);
    b.style.background = isActive ? '#444' : 'transparent';
    b.style.color = isActive ? '#fff' : '#444';
    b.style.borderColor = isActive ? 'transparent' : '#ccc5b8';
  });
  document.querySelectorAll('#urgBar .pill').forEach(b => {
    const isActive = b.getAttribute('data-urg') === 'All';
    b.classList.toggle('active', isActive);
    b.style.background = isActive ? '#444' : 'transparent';
    b.style.color = isActive ? '#fff' : '#444';
    b.style.borderColor = isActive ? 'transparent' : '#ccc5b8';
  });
  render();
  const cardsEl = document.getElementById('cards');
  if (cardsEl) cardsEl.scrollIntoView({behavior:'smooth', block:'start'});
}

function toggleCard(id) {
  const el = document.getElementById('card-' + id);
  if (el) el.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function render() {
  const cardsEl = document.getElementById('cards');
  const emptyEl = document.getElementById('emptyState');
  let filtered = ITEMS.filter(i => {
    if (activeSrc && i.source.indexOf(activeSrc) === -1) return false;
    if (activeCat !== "All" && i.cat !== activeCat) return false;
    if (activeUrg !== "All" && i.urgency !== activeUrg) return false;
    return true;
  });

  if (filtered.length === 0) {
    cardsEl.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  let html = '';
  filtered.forEach(item => {
    const color = CATCOLORS[item.cat] || '#999';
    const chartFlag = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');
    html += '<div class="card" id="card-' + item.id + '" style="--catcolor:' + color + '">';
    html += '  <div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '    <span class="idx">#' + item.id + '</span>';
    html += '    <span class="urg">' + URG_EMOJI[item.urgency] + '</span>';
    html += '    <span class="badge" style="background:' + color + '">' + esc(item.source) + '</span>';
    html += '    <span class="cattag">' + esc(item.cat) + '</span>';
    if (chartFlag) html += '    <span class="chartflag">' + chartFlag + '</span>';
    html += '    <span class="title">' + esc(item.title) + '</span>';
    html += '  </div>';
    html += '  <div class="card-body">';
    html += '    <div class="seclabel">The Idea</div>';
    html += '    <div class="idea">' + esc(item.idea) + '</div>';
    html += '    <div class="seclabel">My Angle</div>';
    html += '    <div class="angle">' + esc(item.angle) + '</div>';
    html += '    <div class="seclabel">Tweets</div>';
    html += '    <div class="tweets">';
    html += '      <div class="tweetbox a"><div class="tweetlabel">TWEET A</div><div class="tweettext">' + esc(item.tweetA) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '      <div class="tweetbox b"><div class="tweetlabel">TWEET B</div><div class="tweettext">' + esc(item.tweetB) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '    </div>';
    if (item.charts.count > 0 || item.charts.desc) {
      html += '    <div class="chartbox' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '🔥 ' : '📊 ') + esc(item.charts.desc) + '</div>';
    }
    html += '    <div class="linkrow"><a href="' + item.link + '" target="_blank">↗ Read full article</a></div>';
    html += '  </div>';
    html += '</div>';
  });
  cardsEl.innerHTML = html;
}

function buildReport() {
  let html = '<h4>Time Window</h4>';
  html += '<div>' + META.windowStart + ' &rarr; ' + META.windowEnd + '. Emails outside this window were not processed.</div>';
  html += '<h4>Totals</h4>';
  html += '<div>' + META.emailsInWindow + ' emails in window &middot; ' + META.emailsRead + ' read via get_thread &middot; ' + META.itemsExtracted + ' items extracted from ' + META.includedSources.length + ' sources.</div>';
  html += '<h4>Included Sources</h4>';
  html += '<div>';
  META.includedSources.forEach((s, idx) => {
    html += '<span class="srcname" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + esc(s.name) + '</span> (' + s.count + ')';
    if (idx < META.includedSources.length - 1) html += ' &middot; ';
  });
  html += '</div>';
  html += '<h4>Skipped Sources</h4><div>';
  META.skippedSources.forEach(s => {
    html += '<div>&mdash; <strong>' + esc(s.name) + '</strong>: ' + esc(s.reason) + '</div>';
  });
  html += '</div>';
  document.getElementById('reportBody').innerHTML = html;
}

buildMeta();
buildFilterBars();
render();
buildReport();
</script>
</body>
</html>
