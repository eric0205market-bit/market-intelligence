 (manufacturing, decoration, distribution), relevant for assessing employment sensitivity to corporate marketing budget cycles.", "quote": "This economic activity supported the employment of 11.9 million jobs and supported a $141 billion contribution to global tax revenues.", "locator": "This economic activity supported the employment of", "quote_verified": true}, {"claim": "The branded merchandise industry contributed $141 billion to global tax revenues in 2025.", "speaker": "Suki Masana", "type": "data_point", "entities": ["PPAI"], "conviction": "high", "so_what": "Gives policymakers and industry advocates a quantified fiscal-contribution figure to use in lobbying or tax-policy discussions around the sector.", "quote": "supported a $141 billion contribution to global tax revenues", "locator": "This economic activity supported the employment of", "quote_verified": true}]}, {"theme": "Industry structure and study access", "insights": [{"claim": "The branded merchandise industry is framed as a globally integrated value chain linking manufacturers, suppliers, decorators, distributors, retailers, e-commerce platforms, agencies, and activation partners.", "speaker": "Suki Masana", "type": "framework", "entities": ["PPAI"], "conviction": "medium", "so_what": "Useful map of the sector's structure for identifying which sub-segments (e.g., decorators vs. e-commerce platforms) capture the most value or are most exposed to margin compression.", "quote": "The branded merchandise industry operates on a truly global scale, connecting manufacturers, suppliers, decorators, distributors, retailers, e-commerce platforms, agencies, and activation partners to enable the production, decoration, and delivery of branded merchandise products to businesses and consumers worldwide.", "locator": "The branded merchandise industry operates on a truly global scale", "quote_verified": true}, {"claim": "The full white paper and detailed country-level results from this economic impact study are only available to PPAI members, limiting independent verification of the methodology behind the headline figures.", "speaker": "Suki Masana", "type": "data_point", "entities": ["PPAI", "Oxford Economics"], "conviction": "medium", "so_what": "Investors or analysts citing these figures should note the underlying data and methodology are gated, warranting caution before treating the $472B/11.9M/$141B numbers as fully auditable.", "quote": "Follow the link to the study’s microsite for the study’s white paper (available to PPAI members), detailed global results, and country-level results.", "locator": "Follow the link to the study", "quote_verified": true}]}], "insight_total": 5, "top_entities": ["PPAI", "Oxford Economics"], "source_meta": {"author": "Suki Masana", "word_count": 353, "paywalled": false}}, {"record_id": "f8731daf958976b4", "source_type": "concepts", "source_name": "Oxford Economics", "source_url": "https://www.oxfordeconomics.com/resource/pam-private-markets-leaders-forum-2026/", "title": "PAM Private Markets Leaders Forum 2026", "published_date": "2026-09-09", "language": "en", "processed_at": "2026-09-10T10:46:08Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Geopolitics", "AI", "Positioning"], "gist": "A promotional Oxford Economics event/landing page for the PAM Private Markets Leaders Forum 2026, bundling teasers for four of its reports: a widening US budget deficit in 2026 driven by tariffs and tax cuts, AI-driven sticky inflation delaying Fed rate cuts to December, a one-year check-in on its 'world of self-interest' policy thesis, and an assessment of how the US-Israel-Iran conflict has and hasn't changed the geopolitical narrative.", "themes": [{"theme": "US fiscal and monetary outlook", "insights": [{"claim": "Oxford Economics expects the improvement in the US budget deficit to fade as 2026 progresses, with tariff policies and tax cuts widening the deficit and raising concerns about future revenue growth.", "speaker": "Duncan Campbell", "type": "prediction", "entities": ["US budget deficit", "tariffs", "tax cuts"], "conviction": "medium", "so_what": "A re-widening deficit narrative into 2026 argues for watching Treasury issuance and rate-sensitive assets as fiscal concerns resurface after a period of improvement.", "quote": "The budget deficit is set to widen in 2026, influenced by tariff policies and tax cuts, raising concerns about future revenue growth.", "locator": "Improvement in the US deficit will fade as 2026 unfolds", "quote_verified": true}, {"claim": "Oxford Economics attributes sticky US inflation to an AI-driven economic boom, and now expects the Federal Reserve to hold rates for longer with the next rate cut pushed to December.", "speaker": "Duncan Campbell", "type": "prediction", "entities": ["Federal Reserve", "AI", "US inflation"], "conviction": "high", "so_what": "A delayed Fed cut tied to AI-fueled growth suggests investors should reprice rate-cut-timing bets and watch AI capex/spending data as a driver of the inflation path.", "quote": "A firmer economy and stickier inflation will keep the Federal Reserve on a prolonged hold – we now expect the next rate cut in December,…", "locator": "AI boom will keep US inflation sticky", "quote_verified": true}]}, {"theme": "Geopolitics and global policy shifts", "insights": [{"claim": "One year after introducing its 'world of self-interest' thesis, Oxford Economics is reassessing how global economic policy, trade, and markets have evolved under that framework and what it implies going forward.", "speaker": "Duncan Campbell", "type": "framework", "entities": ["global trade policy"], "conviction": "medium", "so_what": "Signals an ongoing analytical framework treating nationalist/self-interested policymaking as a persistent, multi-year macro regime rather than a one-off shock, worth tracking across trade and market outcomes.", "quote": "A year after our “world of self-interest” thesis, we examine how global economic policy, trade, and markets have evolved and what comes next.", "locator": "How self-Interest is reshaping global economic policy: One year on", "quote_verified": true}, {"claim": "Oxford Economics views the US-Israel war with Iran as reinforcing its existing long-standing geopolitical narrative, while still altering some specific elements of that narrative.", "speaker": "Duncan Campbell", "type": "thesis", "entities": ["Iran", "Israel", "United States", "Middle East"], "conviction": "medium", "so_what": "Suggests the firm's base-case geopolitical risk framework remains largely intact post-conflict, implying limited need for wholesale repositioning but attention to the specific chapters that did change.", "quote": "The US-Israel war with Iran reinforces a long-standing narrative but rewrites a few key chapters.", "locator": "What the Middle East conflict has changed, and what it hasn’t", "quote_verified": true}]}], "insight_total": 4, "top_entities": ["Federal Reserve", "AI", "US budget deficit", "tariffs", "Iran", "Israel", "Middle East"], "source_meta": {"author": "Duncan Campbell", "word_count": 213, "paywalled": false}}, {"record_id": "297e4b61d72ab282", "source_type": "concepts", "source_name": "World Economic Forum", "source_url": "https://www.weforum.org/stories/economic-growth/baseball-players-labor-share-of-income-work-inequality/", "title": "What a game can tell us about a troubling economic trend", "published_date": "2026-09-08", "language": "en", "processed_at": "2026-09-10T10:46:08Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "AI", "Society"], "gist": "Even Major League Baseball players, one of the most unionized and 'AI-proof' workforces in the world, have seen their share of league revenue decline since the early 2000s, illustrating a broader global trend of labour's falling share of economic output that the Bank for International Settlements warns AI could push as low as 20% in coming decades.", "themes": [{"theme": "Global labour share decline", "insights": [{"claim": "The Bank for International Settlements has projected that labour's global share of income could fall as low as 20% in the coming decades, with artificial intelligence accelerating the decline.", "speaker": "World Economic Forum", "type": "prediction", "entities": ["Bank for International Settlements", "AI"], "conviction": "medium", "so_what": "A BIS forecast of a structurally shrinking labour share versus capital/owner share implies durable margin and capital-income tailwinds for owners of productive assets relative to wage earners, reinforcing overweight-capital, underweight-labour positioning theses.", "quote": "it could fall as low as 20% in the next few decades, with artificial intelligence speeding the decline.", "locator": "Labour's global share of income", "quote_verified": true}, {"claim": "Labour's share of global economic output has been slipping since the start of the 21st century, and while economists debate the exact causes, there is broad consensus it matters because it signals rising inequality.", "speaker": "World Economic Forum", "type": "thesis", "entities": [], "conviction": "high", "so_what": "Widespread expert agreement that a falling labour share is a real, consequential inequality indicator (not just a statistical artifact) supports policy and market narratives around redistribution, wage-growth stagnation, and populist political risk.", "quote": "Economists debate exactly why it’s happening and to what extent, but most agree that it matters.", "locator": "Labour's global share of income", "quote_verified": true}, {"claim": "Major League Baseball players are a highly unionized, relatively automation-resistant ('AI-proof') labour force, yet they still could not buck the global decline in labour's share of income, suggesting the trend is structural rather than confined to jobs vulnerable to automation.", "speaker": "World Economic Forum", "type": "contrarian", "entities": ["MLB players' union"], "conviction": "medium", "so_what": "If even strongly unionized, automation-resistant labour can't hold its income share, investors should not assume AI-safe or heavily unionized sectors will be immune to the broader wage-share compression theme when modeling labour cost and margin trends.", "quote": null, "locator": "Players in baseball's premier professional league", "quote_verified": false}]}, {"theme": "MLB labor economics and the salary-cap standoff", "insights": [{"claim": "In 1883, the average American professional baseball player earned about $2,000 a year (roughly $66,000 in today's dollars), and needed off-season jobs like factory work to make ends meet, until the players' union secured its first collective bargaining agreement in 1968, which raised minimum pay and paved the way for free agency.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["MLB"], "conviction": "high", "so_what": "Shows how collective bargaining historically converted a low-pay, side-hustle-dependent labour pool into a high-earning one via structural changes (free agency) rather than incremental wage demands — a template for how labour can capture more of surplus value when it gains bargaining leverage.", "quote": "equivalent to roughly $66,000 today", "locator": "Karl Marx might have been a baseball fan", "quote_verified": true}, {"claim": "The average MLB salary has risen to $5.3 million this year, but an academic study found players' share of overall league income began declining in the early 2000s and the slump appears to be continuing despite rising nominal pay.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["MLB"], "conviction": "high", "so_what": "Illustrates that rising absolute compensation can mask a falling share of the value being created — a distinction investors should apply when assessing whether wage growth in any sector is actually keeping pace with revenue/profit growth.", "quote": null, "locator": "The average salary for Major League Baseball players this year", "quote_verified": false}, {"claim": "MLB team owners are proposing a salary cap ahead of a December labor-deal deadline, risking a work stoppage; economics professor Michael Haupert argues the cap would not just constrain top salaries but squeeze compensation at every level of the pay scale.", "speaker": "World Economic Forum", "type": "thesis", "entities": ["MLB", "Michael Haupert"], "conviction": "medium", "so_what": "A December deadline with real work-stoppage risk is a concrete, dated catalyst for MLB-adjacent businesses (media rights, sponsorships, the publicly traded Atlanta Braves) — investors should track negotiation progress into year-end.", "quote": "not just squeeze the highest salaries, it will squeeze all the way down", "locator": "That's still probably fallen behind the pace of league proceeds", "quote_verified": true}, {"claim": "Despite a wide pay gap between the league minimum ($780,000) and the top salary this year ($61.9 million), rank-and-file players and superstars are reported to be equally opposed to a salary cap.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["MLB"], "conviction": "medium", "so_what": "Unified opposition across the pay spectrum strengthens the union's negotiating leverage against owners, making a prolonged dispute or work stoppage more likely than if lower-paid members were more willing to compromise.", "quote": null, "locator": "Members at the bottom of the pay scale", "quote_verified": false}, {"claim": "Player compensation is increasingly shaped by granular, quantified performance metrics — such as launch angle and pitch spin rate, plus a proprietary statistic designed to detect the earliest signs of skill decline — that directly affect market value, paralleling how AI-powered workplace monitoring ('bossware') is increasingly tracking white-collar employees.", "speaker": "World Economic Forum", "type": "causal", "entities": ["MLB", "AI"], "conviction": "medium", "so_what": "Signals that granular performance-tracking technology used in sports analytics is a preview of AI-driven surveillance/evaluation tools spreading into mainstream white-collar workplaces, with implications for both HR-tech vendors and worker bargaining power.", "quote": null, "locator": "Office workers fret about having more of their day tracked by AI-powered", "quote_verified": false}]}, {"theme": "Franchise valuations and ownership opacity", "insights": [{"claim": "The Atlanta Braves are the only MLB team required to disclose extensive financial information because they are publicly traded, and their stock has recently seen elevated short interest amid investor skepticism about the outcome of the new labour deal.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["Atlanta Braves"], "conviction": "medium", "so_what": "The Braves' public listing makes it a rare direct market proxy for MLB labor-negotiation risk; rising short interest is a live, trackable signal of investor sentiment on the salary-cap dispute and potential work stoppage.", "quote": "the public has been shorting those shares lately, or betting against them, amid scepticism about a new labour deal", "locator": "Only one club, the Atlanta Braves", "quote_verified": true}, {"claim": "Ancillary team revenue such as real estate development near ballparks (e.g., the Atlanta Braves' residential building and hotel named after Hank Aaron) raises an unresolved question of whether players are entitled to a share of that income, which Haupert calls 'a legitimate question.'", "speaker": "World Economic Forum", "type": "framework", "entities": ["Atlanta Braves", "Michael Haupert"], "conviction": "low", "so_what": "Ancillary/real-estate revenue streams sit outside traditional baseball-related-revenue definitions used in labor deals, making them a plausible future flashpoint in collective bargaining as owners diversify income beyond ticket and media sales.", "quote": "It's a legitimate question", "locator": "Real estate near a ballpark can earn income for a team", "quote_verified": true}, {"claim": "The Los Angeles Angels were sold for a record $4 billion, up from $183 million when they were sold in 2003 — roughly a 22x increase in franchise value over 23 years, far outpacing growth in player pay share.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["Los Angeles Angels"], "conviction": "high", "so_what": "Franchise valuations compounding at a much faster rate than players' share of league revenue is direct quantitative evidence that capital (team ownership) is capturing a growing share of the value created relative to labour.", "quote": "a league record $4 billion", "locator": "The Los Angeles Angels were sold last week", "quote_verified": true}, {"claim": "The Angels' payroll of $179 million is far below the largest MLB payrolls, which exceed $300 million, yet it is not clear that bigger payrolls provide a decisive competitive advantage, undercutting owners' argument that a salary cap is needed for competitive balance.", "speaker": "World Economic Forum", "type": "contrarian", "entities": ["Los Angeles Angels"], "conviction": "medium", "so_what": "Weakens the owners' stated rationale for a salary cap, suggesting the real driver of the cap push is capturing a larger share of league revenue rather than competitive parity — useful framing for assessing negotiation motives and likely outcomes.", "quote": "far below the largest at well over $300 million", "locator": "The Angels have a middling payroll", "quote_verified": true}]}, {"theme": "Historical wage suppression in baseball", "insights": [{"claim": "Some of the highest-performing baseball talent in history was systematically underpaid because team owners colluded to exclude black players from the major leagues via the segregated 'Negro Leagues' until 1947.", "speaker": "World Economic Forum", "type": "causal", "entities": ["Negro Leagues"], "conviction": "high", "so_what": "A historical case study showing that engineered labor-market segmentation, not just lack of skill or bargaining power, can suppress even top-tier compensation — a cautionary precedent when evaluating claims that wage gaps reflect merit alone.", "quote": "Some of the highest-performing employees in history were underpaid because owners could collude to marginalize black baseball talent until 1947.", "locator": "Another connection between ballplayers and the broader workforce", "quote_verified": true}, {"claim": "Before free agency, MLB owners colluded to restrict players to a single employer, arguing that allowing players to freely change teams would ruin the game — a restriction later broken by the 1968 collective bargaining agreement.", "speaker": "World Economic Forum", "type": "causal", "entities": ["MLB"], "conviction": "high", "so_what": "Demonstrates that employer-side collusion to limit worker mobility was a deliberate wage-suppression mechanism, historically justified with competitive/quality arguments similar to those now used to justify the proposed salary cap.", "quote": null, "locator": "The lack of free agency in the old days", "quote_verified": false}]}, {"theme": "Public framing of labor disputes", "insights": [{"claim": "After a 1981 work stoppage, MLB ran a 'blow the whistle on the players' fan campaign at the first game back, but a broadcaster noted fans couldn't similarly whistle at the owners because they weren't present, exposing an asymmetry in how labor disputes get publicly framed against workers rather than owners.", "speaker": "World Economic Forum", "type": "anecdote", "entities": ["Pete Rose"], "conviction": "medium", "so_what": "A recurring PR pattern — labor disputes get framed as player/worker greed while owners remain comparatively shielded from public blame — is a useful lens for interpreting media narratives around the looming December MLB negotiation and work-stoppage risk.", "quote": "You can’t very well whistle on the owners, they’re not here.", "locator": "After a work stoppage erased part of the 1981 season", "quote_verified": true}, {"claim": "According to Haupert, most workers don't think about their compensation in terms of a target percentage of total revenue, instead prioritizing the freedom to leave one job for a better one — a framing gap that may help explain why labour's declining income share persists without organized resistance.", "speaker": "World Economic Forum", "type": "framework", "entities": ["Michael Haupert"], "conviction": "medium", "so_what": "If workers don't benchmark pay against revenue share, erosion in labour's share can continue largely unchallenged; making that metric more visible (as this article attempts) could itself become a catalyst for renewed wage-share demands or policy attention.", "quote": "I don’t think the average worker really goes into things thinking, 'I should have X-percent of the total revenue'", "locator": "That's a potential misread of human nature by Marx", "quote_verified": true}]}], "insight_total": 16, "top_entities": ["MLB", "Bank for International Settlements", "Atlanta Braves", "Los Angeles Angels", "Michael Haupert", "AI", "Negro Leagues", "Pete Rose"], "source_meta": {"author": "", "word_count": 1845, "paywalled": false}}, {"record_id": "6004b289c49bb527", "source_type": "concepts", "source_name": "World Economic Forum", "source_url": "https://www.weforum.org/stories/artificial-intelligence/agentic-ai-human-machine-cognition/", "title": "How AI-era disinformation targets both human and machine cognition", "published_date": "2026-09-08", "language": "en", "processed_at": "2026-09-10T10:46:08Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Society", "Geopolitics", "Positioning"], "gist": "Agentic AI and coordinated 'AI swarms' are expanding disinformation from targeting human belief to also poisoning machine cognition (training data, model outputs), creating corporate risks like deepfake-driven stock manipulation and demanding new defenses such as sovereign models and mechanistic interpretability.", "themes": [{"theme": "Scale of synthetic content flooding the information ecosystem", "insights": [{"claim": "An estimated 50% of newly published articles are now AI-generated, and synthetic content appears on up to 74% of new webpages, blurring the line between human- and machine-generated content.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["generative AI", "large language models"], "conviction": "high", "so_what": "Business intelligence and analytics inputs sourced from the open web are increasingly synthetic, degrading signal quality for research and due diligence that relies on scraped content.", "quote": "An estimated 50% of newly published articles are now AI-generated, while synthetic content appears on up to 74% of new webpages.", "locator": "Since 2022, generative AI, particularly large language models", "quote_verified": true}, {"claim": "Low-cost, multi-modal LLMs have lowered the barrier to entry for malicious actors, enabling text, audio and video disinformation at scale, and recent deepfakes are now convincing enough to be exploited for political and financial gain (unlike easily-spotted early deepfakes).", "speaker": "World Economic Forum", "type": "causal", "entities": ["large language models", "deepfakes"], "conviction": "high", "so_what": "Falling cost of convincing synthetic media raises the base rate of fraud and market-manipulation attempts that security and compliance teams must screen for.", "quote": "Low-cost, multi-modal LLMs have lowered the barrier to entry for malicious actors, enabling text, audio and video disinformation at scale.", "locator": "Influence operations have long used disinformation, evolving as technology has", "quote_verified": true}]}, {"theme": "Agentic AI and AI swarms as disinformation infrastructure", "insights": [{"claim": "An estimated 28.6 million AI agents were in use across enterprises in 2025, a figure projected to exceed 2 billion by 2030, indicating explosive growth of autonomous systems that operate with limited human oversight.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["agentic AI"], "conviction": "high", "so_what": "The scale-up of enterprise AI agents (28.6M to 2B+ in five years) implies a rapidly expanding attack surface for coordinated misuse, relevant to cybersecurity and AI-governance vendors.", "quote": "An estimated 28.6 million agents were in use across enterprises in 2025, and this is projected to exceed 2 billion by 2030.", "locator": "Agentic AI adds complexity to this threat landscape", "quote_verified": true}, {"claim": "When specialized AI agents operate in coordinated networks or 'swarms,' they can amplify disinformation through greater autonomy, sophistication, scale and speed than rule-bound bots, enabling adaptive end-to-end influence operations once a goal is set with little human oversight.", "speaker": "World Economic Forum", "type": "framework", "entities": ["agentic AI", "AI swarms"], "conviction": "medium", "so_what": "AI swarms represent a qualitatively new disinformation vector distinct from legacy bot networks; detection systems built for rule-bound bots may not catch adaptive swarm behavior.", "quote": "Unlike rule-bound bots, agentic AI may enable adaptive, end-to-end influence operations with little human oversight once a goal is set.", "locator": "The risk compounds when specialized AI agents operate in coordinated networks", "quote_verified": true}, {"claim": "In a USC study using a simulated social media environment, 500 AI agents independently coordinated to promote a political candidate, demonstrating that agent-driven influence campaigns are already technically feasible, not merely hypothetical.", "speaker": "World Economic Forum", "type": "anecdote", "entities": ["USC"], "conviction": "high", "so_what": "Empirical proof-of-concept for autonomous coordinated influence operations should accelerate demand for AI-driven detection tools and inform regulatory timelines.", "quote": "In a simulated social media environment created as part of a recent USC study, 500 AI agents independently coordinated to promote a political candidate.", "locator": "This risk is not hypothetical", "quote_verified": true}, {"claim": "Agent-driven disinformation campaigns used against businesses or public figures could inflict reputational damage within days, even though trust takes years to build.", "speaker": "World Economic Forum", "type": "prediction", "entities": ["agentic AI"], "conviction": "medium", "so_what": "The asymmetry between rapid reputational destruction and slow trust-building argues for investing in real-time brand-monitoring and rapid-response crisis capabilities rather than relying on legacy PR response times.", "quote": "such agent-driven campaigns could inflict reputational damage within days where trust takes years to build.", "locator": "This risk is not hypothetical", "quote_verified": true}]}, {"theme": "Corporate and market risk from disinformation", "insights": [{"claim": "Companies face exposure through supply chains and market manipulation via coordinated disinformation targeting stock-sensitive news or deepfakes impersonating executives, and this risk should be on every board's radar.", "speaker": "World Economic Forum", "type": "thesis", "entities": ["deepfakes"], "conviction": "high", "so_what": "Boards and risk committees should treat deepfake-driven market manipulation as an enterprise risk category alongside cyber and supply-chain risk, prompting demand for executive-impersonation detection and verification protocols.", "quote": "Companies face exposure through supply chains and market manipulation via coordinated disinformation on stock-sensitive news or deepfakes impersonating executives. This should be on every board's radar.", "locator": "Companies face exposure through supply chains", "quote_verified": true}, {"claim": "Malicious actors' motives split between extortion/fraud and subversion (exploiting political and social vulnerabilities to undermine established authority), with subversion sitting at the heart of the emerging practice of 'cognitive warfare' that targets how people and institutions make sense of reality and decisions.", "speaker": "World Economic Forum", "type": "framework", "entities": [], "conviction": "medium", "so_what": "Distinguishing financially-motivated disinformation from subversion-motivated cognitive warfare helps risk teams prioritize different defenses (fraud controls vs. narrative/decision-integrity monitoring).", "quote": "Where disinformation manipulates the narrative, cognitive warfare seeks to influence how people, companies, institutions and societies make sense of reality and make decisions.", "locator": "Motives vary", "quote_verified": true}]}, {"theme": "Machine cognition as an attack surface", "insights": [{"claim": "Cognitive warfare in the AI era can target machine cognition directly, not just human belief, via data poisoning of the systems that increasingly perceive, infer and reason.", "speaker": "World Economic Forum", "type": "thesis", "entities": ["large language models"], "conviction": "high", "so_what": "AI models themselves become a target class requiring security investment (data provenance, poisoning defenses), not just an amplification tool for attacking humans.", "quote": "cognitive warfare can also target machine cognition – processes in artificial systems resembling human perception, inference and reasoning.", "locator": "And in the AI era", "quote_verified": true}, {"claim": "'LLM grooming' — planting deceptive content across the open web so it enters training data and skews model outputs — is a known attack technique, and one study found just 250 poisoned documents are enough to embed a hidden vulnerability into an LLM.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["large language models"], "conviction": "high", "so_what": "A surprisingly low poisoning threshold (250 documents) means training-data curation and provenance verification are cheap-to-attack, high-value defense priorities for any org fine-tuning or deploying LLMs.", "quote": "one study showing that 250 poisoned documents are enough to embed a hidden vulnerability into an LLM.", "locator": "LLM grooming can plant deceptive content", "quote_verified": true}, {"claim": "As human-generated data grows scarce and models increasingly train on synthetic data, this risks self-reinforcing errors and biases, a phenomenon known as 'model collapse,' and AI swarms could fill data voids early with synthetic content to distort public perception before credible information exists.", "speaker": "World Economic Forum", "type": "causal", "entities": ["model collapse"], "conviction": "medium", "so_what": "Model collapse and data-void exploitation are structural risks to AI training pipelines that argue for sourcing verified/proprietary data rather than open-web scrapes as synthetic content share rises.", "quote": "As human-generated data grows scarce, models increasingly train on synthetic data, risking self-reinforcing errors and biases. This phenomenon is known as model collapse.", "locator": "Even without deliberate manipulation", "quote_verified": true}, {"claim": "Evidence suggests AI interactions can shift beliefs across contested societal issues, making AI models themselves high-value targets whose compromise risks contaminating both machine and human cognition and the judgement underlying public- and private-sector decisions.", "speaker": "World Economic Forum", "type": "thesis", "entities": [], "conviction": "medium", "so_what": "If AI outputs measurably move human opinion, model integrity becomes a systemic input to decision-making across sectors, elevating AI trust/safety as a governance and investment priority.", "quote": "Evidence suggests AI interactions can shift beliefs across contested societal issues. AI models thus present high-value targets.", "locator": "Even without deliberate manipulation", "quote_verified": true}]}, {"theme": "Building cognitive security and resilience", "insights": [{"claim": "Regulation needs to address the systemic incentives that favour disinformation, including its lower production cost relative to truthful content and digital platforms' tendency to prioritize engagement over accuracy.", "speaker": "World Economic Forum", "type": "framework", "entities": [], "conviction": "medium", "so_what": "Policy interventions that target platform incentive structures (engagement-optimized ranking) rather than only content takedown may be more durable levers against disinformation economics.", "quote": "regulation must address accountability and alter the systemic incentives that favour disinformation, such as its lower production cost relative to truthful content as well as the tendency of digital platforms to prioritise engagement over accuracy.", "locator": "On the human side, individual, institutional and societal resilience", "quote_verified": true}, {"claim": "Sovereign or in-house models trained on trusted, verified datasets reduce exposure to data poisoning and model collapse, and progress in mechanistic interpretability — understanding models' inner workings — would enable better tracing and auditing of AI behaviour.", "speaker": "World Economic Forum", "type": "framework", "entities": ["mechanistic interpretability"], "conviction": "medium", "so_what": "Investment thesis angle: demand for sovereign/proprietary LLM infrastructure and interpretability tooling is likely to grow as organizations seek to de-risk data-poisoning exposure.", "quote": "Sovereign or in-house models trained on trusted, verified datasets reduce exposure to data poisoning and model collapse.", "locator": "As AI systems become part of global cognitive infrastructure", "quote_verified": true}, {"claim": "Defensive AI agents could detect disinformation by identifying coordination patterns unlikely to be human, and could monitor brand reputation to flag defamation campaigns before they gain traction; cross-platform monitoring also shows promise in predicting how false narratives spread.", "speaker": "World Economic Forum", "type": "framework", "entities": ["agentic AI"], "conviction": "medium", "so_what": "Points to an emerging market for AI-vs-AI defensive tooling — coordination-pattern detection and cross-platform narrative monitoring — as a countermeasure category to agentic disinformation.", "quote": "defensive AI agents could detect disinformation by identifying coordination patterns that are unlikely to be human. They could also monitor brand reputation to flag defamation campaigns before they gain traction.", "locator": "Cross-platform monitoring shows promise", "quote_verified": true}]}, {"theme": "Erosion of societal trust (epistemic crisis)", "insights": [{"claim": "AI swarms exploit a deepening 'epistemic crisis' in which traditional intermediaries such as science, media and government agencies have seen their authority decline with the rise of the internet and social media, weakening collective trust and leaving societies more susceptible to disinformation.", "speaker": "World Economic Forum", "type": "causal", "entities": [], "conviction": "medium", "so_what": "Declining institutional trust is a pre-existing structural vulnerability that agentic disinformation exploits, meaning technical fixes alone (detection tools) are insufficient without institutional trust-rebuilding.", "quote": "AI swarms meet fertile ground amid what some call a deepening epistemic crisis due to the erosion of society's ability to agree on fundamental facts.", "locator": "AI swarms meet fertile ground", "quote_verified": true}]}], "insight_total": 16, "top_entities": ["agentic AI", "AI swarms", "large language models", "deepfakes", "USC", "generative AI", "model collapse", "mechanistic interpretability"], "source_meta": {"author": "", "word_count": 1401, "paywalled": false}}, {"record_id": "a712226873dc2139", "source_type": "concepts", "source_name": "World Economic Forum", "source_url": "https://www.weforum.org/stories/artificial-intelligence/how-ai-is-rewriting-the-decisions-that-leaders-need-to-make/", "title": "How AI is rewriting the decisions that leaders need to make", "published_date": "2026-09-07", "language": "en", "processed_at": "2026-09-10T10:46:08Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Positioning", "Society"], "gist": "As AI moves upstream from making decisions to framing the problems behind them, two compounding risks emerge — frame compression (less internal debate as coherent frames become nearly free to generate) and frame convergence (organizations using similar foundation models developing correlated blind spots) — making 'who controls the frame' the new core job of leadership rather than a governance afterthought.", "themes": [{"theme": "AI adoption and the upstream shift", "insights": [{"claim": "AI deployment among organizations jumped to 88% in 2025 from 55% in 2023, and generative AI deployment specifically surged from 33% to 71% in a single year.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["Artificial Intelligence", "Generative AI"], "conviction": "high", "so_what": "Enterprise AI adoption for basic use cases is already near-saturation, so the next competitive edge shifts to how firms use AI in framing and strategy work rather than whether they've adopted it at all.", "quote": "In 2025, 88% of organizations deployed AI in at least one business function, up from 55% in 2023. Generative AI deployment surged from 33% to 71% in a single year.", "locator": "The rapid deployment of AI is driven", "quote_verified": true}, {"claim": "The largest efficiency gains from AI are realized not at the moment of final decision but further upstream, in gathering information, developing insights, and identifying opportunities.", "speaker": "World Economic Forum", "type": "thesis", "entities": ["Artificial Intelligence"], "conviction": "high", "so_what": "Tools and vendors focused narrowly on 'decision support' may be underpricing the larger value pool sitting in upstream insight-generation and opportunity-framing AI tools.", "quote": "The greatest efficiency gains are rarely realised at the moment a decision is made. They arise further upstream, in the cognitive work of gathering information, developing insights and identifying opportunities.", "locator": "The rapid deployment of AI is driven", "quote_verified": true}]}, {"theme": "Frame compression inside organizations", "insights": [{"claim": "By making the generation of a coherent strategic frame almost costless while leaving its critical evaluation just as effortful as before, AI changes the incentive structure of deliberation so organizations have less reason to question assumptions or explore alternative frames.", "speaker": "World Economic Forum", "type": "framework", "entities": ["Artificial Intelligence"], "conviction": "high", "so_what": "AI-heavy organizations may look faster and more decisive while quietly becoming less strategically diverse internally — a brittleness risk to probe in due diligence on 'AI-transformed' companies.", "quote": "By making coherent frames almost costless to generate while leaving their critical evaluation just as demanding, AI changes the incentive structure of deliberation.", "locator": "Frame compression operates within organizations", "quote_verified": true}, {"claim": "In a market-entry scenario, AI can analyze trends, competitors, internal capabilities and customer demand and surface a small number of strategic directions within minutes, so by the time leadership convenes, the discussion has already shifted from defining the opportunity to merely evaluating pre-narrowed options.", "speaker": "World Economic Forum", "type": "anecdote", "entities": ["Artificial Intelligence"], "conviction": "medium", "so_what": "Leadership teams risk anchoring on AI's first framing of a market opportunity rather than generating genuinely novel strategic options — a concrete governance gap for boards to test.", "quote": "Within minutes, AI identifies promising opportunities, synthesises relevant evidence and highlights a small number of strategic directions.", "locator": "Consider a business entering a new market", "quote_verified": true}]}, {"theme": "Frame convergence as systemic risk", "insights": [{"claim": "Because many organizations run different datasets through similar foundation models and framing logics, they can end up producing remarkably similar assumptions, which correlates their errors and makes entire industries more vulnerable to shared shocks.", "speaker": "World Economic Forum", "type": "causal", "entities": ["Foundation models", "Artificial Intelligence"], "conviction": "medium", "so_what": "This is a systemic-risk thesis: correlated AI-driven blind spots across an industry are a new source of correlated tail risk that investors should factor into sector-wide stress scenarios, distinct from firm-specific risk.", "quote": "Different datasets processed through similar framing logics can still produce remarkably similar assumptions. The risk is that organizations develop similar blind spots. Errors, then, become correlated rather than independent and entire industries can become more vulnerable to shocks.", "locator": "Frame convergence, meanwhile, emerges", "quote_verified": true}]}, {"theme": "The human-in-the-loop illusion", "insights": [{"claim": "Keeping a 'human in the loop' is a weaker governance control than commonly assumed, because humans can remain in the approval step reviewing AI's outputs while having no influence over the earlier framing step that determined which options exist at all.", "speaker": "World Economic Forum", "type": "contrarian", "entities": ["Artificial Intelligence"], "conviction": "high", "so_what": "Investors evaluating a company's AI-governance claims should ask specifically whether human oversight covers problem-framing, not just final approval — approval-only oversight is easy to overstate as a safeguard.", "quote": "They may remain in the approval loop while quietly disappearing from the framing loop.", "locator": "The familiar governance solution", "quote_verified": true}, {"claim": "A human reviewer can rigorously stress-test three AI-generated options without ever questioning whether those were the right three options to consider in the first place, making apparent human oversight amount to little more than choosing from a predefined menu.", "speaker": "World Economic Forum", "type": "contrarian", "entities": ["Artificial Intelligence"], "conviction": "medium", "so_what": "A useful diagnostic for assessing whether a firm's 'human oversight' of AI is substantive or cosmetic: check whether reviewers ever challenge the option set itself, not just the options presented.", "quote": "a human can rigorously stress-test three possibilities and never ask whether those were the right three to consider in the first place.", "locator": "The familiar governance solution", "quote_verified": true}, {"claim": "Better prompting does not solve the framing problem because prompts only refine a search within an already-chosen frame rather than interrogate whether that frame itself is the right one, and even if future models can propose genuinely different frames, organizations may still favour the efficiency of the first plausible framing over exploring alternatives.", "speaker": "World Economic Forum", "type": "contrarian", "entities": ["Artificial Intelligence"], "conviction": "medium", "so_what": "Discounts the common assumption that 'prompt engineering' or better AI tooling alone fixes strategic blind spots — the fix has to be organizational and human, not just technical.", "quote": "Prompts refine a search within a frame, but they rarely question whether the frame itself is appropriate.", "locator": "Better prompting does not fundamentally resolve this problem", "quote_verified": true}]}, {"theme": "Leadership's new mandate: owning the frame", "insights": [{"claim": "Pablo Picasso's decades-old remark that computers 'can only give you answers' captured a world where humans framed problems and machines only solved them — a boundary the article argues AI is now blurring by shaping the frames themselves, not just producing the answers within them.", "speaker": "World Economic Forum", "type": "anecdote", "entities": ["Pablo Picasso", "Artificial Intelligence"], "conviction": "medium", "so_what": "Reframes the AI risk conversation away from 'will AI give wrong answers' toward 'who controls the questions AI is asked' — a distinct and less-monitored risk category for AI governance.", "quote": "computers are useless. They can only give you answers.", "locator": "More than 50 years ago, Pablo Picasso remarked", "quote_verified": true}, {"claim": "Leaders are increasingly differentiated by the frames they compose rather than by the decisions they make with AI, since the greatest strategic value comes from recognizing possibilities no one else has imagined.", "speaker": "World Economic Forum", "type": "thesis", "entities": ["Artificial Intelligence"], "conviction": "high", "so_what": "Suggests evaluating executive talent and leadership teams on their capacity for original problem-framing, not just on decision speed or AI-tool fluency.", "quote": "leaders are increasingly distinguished as much by the frames they compose as by the decisions they make with AI.", "locator": "More than 50 years ago, Pablo Picasso remarked", "quote_verified": true}, {"claim": "The article prescribes four concrete leadership practices to protect strategic framing from AI narrowing: questioning the problem before seeking answers, creating time to explore alternative frames, rewarding genuine challenge, and treating the first plausible AI-generated frame as a hypothesis rather than a conclusion.", "speaker": "World Economic Forum", "type": "framework", "entities": ["Artificial Intelligence"], "conviction": "medium", "so_what": "An actionable checklist investors and boards can use to assess whether portfolio-company leadership is actively governing AI's role in framing, versus passively accepting its first output.", "quote": "questioning the problem before seeking answers, creating time to explore alternative frames, rewarding genuine challenge and resisting premature closure by treating the first plausible frame as a hypothesis rather than a conclusion.", "locator": "leadership teams need to create the conditions", "quote_verified": true}, {"claim": "Organizations that lose control of their strategic framing to AI gradually lose the capacity to define their own strategic agenda, which the article frames as a matter of organizational sovereignty, not just performance.", "speaker": "World Economic Forum", "type": "thesis", "entities": ["Artificial Intelligence"], "conviction": "high", "so_what": "Elevates 'who controls the frame' to a top-table strategic risk comparable to data or model governance, with implications for how boards should scope AI oversight mandates.", "quote": "Those that lose control of their framing gradually lose the capacity to define their own strategic agenda", "locator": "As such, leadership teams need to create the conditions", "quote_verified": true}]}], "insight_total": 12, "top_entities": ["Artificial Intelligence", "Generative AI", "Foundation models", "Pablo Picasso", "World Economic Forum"], "source_meta": {"author": "", "word_count": 1257, "paywalled": false}}, {"record_id": "3eaa04128c08a5ae", "source_type": "concepts", "source_name": "World Gold Council", "source_url": "https://www.gold.org/goldhub/research/gold-market-commentary-august-2026", "title": "Gold Market Commentary: Paved with good interventions", "published_date": "2026-09-09", "language": "en", "processed_at": "2026-09-10T10:46:08Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Positioning", "Geopolitics"], "gist": "August 2026 saw gold surge 13.3% to $4,563/oz on ETF and CTA momentum buying, while WGC argues US Treasury bond buybacks - widely read as financial repression to cap yields - reinforce gold's appeal unless paired with a credible deficit-reduction plan, since historically gold performs far better when intervention looks confidence-eroding rather than credible.", "themes": [{"theme": "August's record-setting gold rally", "insights": [{"claim": "Gold rose 13.3% in August 2026 to close at $4,563/oz, the third-strongest monthly return in a quarter century, just behind December 2025's 14% gain.", "speaker": "@goldcouncil", "type": "data_point", "entities": ["Gold"], "conviction": "high", "so_what": "A move of this magnitude in one month signals a regime shift in gold demand drivers worth tracking for continuation or mean-reversion.", "quote": "It was the third highest monthly return in a quarter century, narrowly short of the 14% observed in December 2025", "locator": "A bumper August", "quote_verified": true}, {"claim": "WGC's Gold Return Attribution Model (GRAM) shows the August rally was primarily driven by momentum factors led by ETF buying and by a weaker US dollar (opportunity-cost FX), with rising implied volatility reflecting strong call-option buying rather than risk aversion.", "speaker": "@goldcouncil", "type": "framework", "entities": ["Gold", "US dollar"], "conviction": "high", "so_what": "Momentum/flow-driven rallies (vs. fundamentals-driven) can reverse faster, so positioning data matters more than usual for timing gold exposure.", "quote": null, "locator": "According to our Gold Return Attribution Model (GRAM)", "quote_verified": false}, {"claim": "August gold ETF inflows were broad-based: Europe led with $7.9bn (54 tonnes), narrowly ahead of North America's $7.8bn (53 tonnes), while Asian gold ETFs added $2bn (13 tonnes).", "speaker": "@goldcouncil", "type": "data_point", "entities": ["Gold ETFs"], "conviction": "high", "so_what": "Geographically synchronized inflows suggest a global, not regional, shift toward gold allocation rather than a single-market anomaly.", "quote": null, "locator": "ETF flows were strong in August", "quote_verified": false}, {"claim": "On COMEX, net managed-money gold longs rose 97 tonnes ($13bn) in August, while the 'other reportable' category (likely Commodity Trading Advisor/CTA activity) rose even more, by 115 tonnes ($17bn), suggesting systematic trend-following flows outpaced traditional speculative positioning.", "speaker": "@goldcouncil", "type": "data_point", "entities": ["COMEX"], "conviction": "medium", "so_what": "CTA-led buying is typically momentum-driven and can unwind quickly if trend signals flip, adding downside tail risk after a sharp rally.", "quote": null, "locator": "COMEX net managed money positions", "quote_verified": false}, {"claim": "Despite the August surge, gold's year-to-date USD return through August 31, 2026 is only 4.5%, with the all-time record high of $5,405/oz set earlier on January 29, 2026 - meaning much of 2026 was a drawdown that August's rally only partially reversed.", "speaker": "@goldcouncil", "type": "data_point", "entities": ["Gold"], "conviction": "high", "so_what": "The gap between the January 2026 high and current levels shows gold is still recovering lost ground, not making fresh highs, despite headline-grabbing monthly performance.", "quote": null, "locator": "Table 1: Gold prices rebounded across the board in August", "quote_verified": false}]}, {"theme": "Treasury buybacks read as financial repression", "insights": [{"claim": "The US Treasury frames its expanded bond buyback program (which begins increasing on September 9, 2026) as a liquidity measure, but some market participants, including Citadel Securities, characterize it instead as financial repression aimed at suppressing bond yields.", "speaker": "@goldcouncil", "type": "thesis", "entities": ["US Treasury"], "conviction": "medium", "so_what": "If markets increasingly read Treasury buybacks as yield suppression rather than liquidity management, real assets like gold stand to benefit from the resulting credibility discount on US fiscal policy.", "quote": "But some are seeing them more as financial repression: an attempt to stop yields rising", "locator": "Paved with good interventions", "quote_verified": true}, {"claim": "Investor Stanley Druckenmiller publicly criticized the Treasury's intervention as a credibility-costing mistake, a rebuke WGC frames as reflecting wider investor frustration that the US administration is applying superficial fixes rather than addressing the underlying deficit problem.", "speaker": "@goldcouncil", "type": "contrarian", "entities": ["Stanley Druckenmiller", "US Treasury"], "conviction": "medium", "so_what": "Prominent macro investors publicly disputing the credibility of fiscal/monetary intervention is itself a signal worth tracking, as it can shift broader market narrative toward gold as a hedge.", "quote": "a US administration unwilling to apply more than ‘sticking plasters’ to a much more serious problem.", "locator": "Intervention chatter did not start with the buyback announcement", "quote_verified": true}, {"claim": "The intervention narrative predates the buyback announcement: it began roughly two weeks earlier when the Treasury unusually assisted Japan during Japan's own currency intervention in early August, a move that coincided with hawkish Fed minutes and with US federal debt crossing the $40 trillion threshold.", "speaker": "@goldcouncil", "type": "causal", "entities": ["US Treasury", "Japan", "Fed"], "conviction": "medium", "so_what": "A pattern of ad hoc, cross-border currency/yield intervention rather than a single isolated policy move suggests a broader shift toward interventionist tools that markets may increasingly price as structural, not one-off.", "quote": null, "locator": "Intervention chatter did not start with the buyback announcement", "quote_verified": false}, {"claim": "WGC's core thesis is that real assets like gold will keep benefiting from investor concern over growing US deficits and debt until policymakers produce a credible plan to address them - the form intervention takes matters less than whether markets perceive it as credible or desperate.", "speaker": "@goldcouncil", "type": "thesis", "entities": ["Gold", "US Treasury"], "conviction": "high", "so_what": "Absent a credible deficit-reduction plan, gold's multi-year bull narrative (fiscal/currency debasement hedge) stays intact regardless of which specific intervention tool (buybacks, Fed action, FX intervention) is used.", "quote": "Real assets like gold will likely continue to benefit, reflecting investor concerns over growing deficits and debt, until a credible plan to deal with them is formulated.", "locator": "Paved with good interventions", "quote_verified": true}]}, {"theme": "Credible vs. confidence-eroding intervention framework", "insights": [{"claim": "WGC built a historical framework distinguishing two intervention archetypes since 2000: a 'credible' intervention where the term premium compresses while real yields and the dollar stay roughly flat, versus a 'confidence-eroding' intervention where nominal yields stay pinned but the term premium rises and real yields and the dollar fall by up to three standard deviations.", "speaker": "@goldcouncil", "type": "framework", "entities": ["Gold"], "conviction": "medium", "so_what": "This framework gives investors a way to classify future intervention episodes in real time by watching term premium, real yields and the dollar jointly, rather than reacting to headlines alone.", "quote": null, "locator": "Theme one: Credible intervention", "quote_verified": false}, {"claim": "Of 1,443 weeks of data since 2000, only 30 weeks fit the 'credible intervention' pattern and just 20 fit the 'confidence-eroding intervention' pattern, meaning both scenarios are historically rare and the resulting analysis is only suggestive, not statistically robust.", "speaker": "@goldcouncil", "type": "data_point", "entities": ["Gold"], "conviction": "low", "so_what": "The small sample size means conclusions about gold's behavior under intervention should be treated as a working hypothesis, not a reliable base rate for trading decisions.", "quote": "of 1,443 weeks since 2000, only 30 fit the credible theme and 20 the confidence-eroding one", "locator": "Results", "quote_verified": true}, {"claim": "Historically, gold performs far better during weeks resembling a confidence-eroding intervention than a credible one, since falling real yields and a weaker dollar are gold's typical short-run return drivers - reinforcing gold's role as a hedge specifically against policy actions that erode fiscal/currency credibility.", "speaker": "@goldcouncil", "type": "causal", "entities": ["Gold", "US dollar"], "conviction": "medium", "so_what": "Investors should watch whether future intervention episodes trend toward the 'credible' or 'confidence-eroding' pattern, since that distinction - more than the intervention itself - determines gold's near-term reaction.", "quote": "gold fares far better under a confidence-eroding intervention than a credible one", "locator": "Results", "quote_verified": true}, {"claim": "A successful-looking, credible intervention (term premium compression alone, with yields and dollar flat) is not sufficient to hurt gold's excess returns, because mechanical yield-curve-control success doesn't resolve the underlying deficit problem and can even create moral hazard that worsens it later.", "speaker": "@goldcouncil", "type": "contrarian", "entities": ["Gold"], "conviction": "medium", "so_what": "Investors shouldn't assume a 'successful' yield-capping intervention is automatically bearish for gold - the deeper fiscal problem persisting keeps gold's structural bid intact even in the credible-intervention scenario.", "quote": "A compressing term premium on its own is insufficient to dent gold’s excess returns", "locator": "Results", "quote_verified": true}, {"claim": "A notable exception in the historical data: the two weakest gold returns within the 'credible intervention' sample (May 2014 and July 2015) both coincided with the US fiscal deficit having fallen to roughly 2.5% of GDP from about 4% eighteen months earlier, suggesting the real near-term risk to gold is yield-capping paired with genuine fiscal restraint, not yield-capping alone.", "speaker": "@goldcouncil", "type": "causal", "entities": ["Gold", "US Treasury"], "conviction": "exploratory", "so_what": "Watch US deficit-as-%-of-GDP trends alongside any yield-capping intervention - genuine fiscal tightening combined with yield control is the specific combination that could actually threaten gold's bull case, even though the author calls this a remote risk based on only two data points.", "quote": "the two weakest returns in the credible theme sample – May 2014 and July 2015 – coincided with a US deficit that had fallen to around 2.5% of GDP from 4% eighteen months earlier", "locator": "Results", "quote_verified": true}]}, {"theme": "Fed rate path and the 'hikes are bad for gold' rule", "insights": [{"claim": "Market pricing for a September 2026 Fed hike has swung sharply: initially supported by solid economic data and inflation fears in June, it faded on softer data, then revived on the continuing US-Iran conflict and Fed Chair Warsh's hawkish comments around the Jackson Hole Symposium.", "speaker": "@goldcouncil", "type": "data_point", "entities": ["Fed", "Warsh", "US-Iran conflict"], "conviction": "medium", "so_what": "Rate-hike odds are currently being driven more by geopolitical escalation (US-Iran) and Fed leadership rhetoric than by underlying economic data, making the hike outcome unusually sensitive to headline risk.", "quote": null, "locator": "While the preceding analysis is focused on the US", "quote_verified": false}, {"claim": "WGC challenges the simple heuristic that Fed hikes are automatically bad for gold: if a September hike restores policy credibility and flattens the yield curve, that specific scenario could confound the standard rule, since what matters is what the yield move signals about credibility, not the yield move itself.", "speaker": "@goldcouncil", "type": "contrarian", "entities": ["Fed", "Gold", "Warsh"], "conviction": "exploratory", "so_what": "Investors defaulting to 'Fed hike = sell gold' could be wrong-footed if a hike is read as a credibility-restoring move rather than a tightening shock - watch curve shape and credibility signaling, not just the hike decision itself.", "quote": "it is not the yield move itself but what it embeds that matters", "locator": "While the preceding analysis is focused on the US", "quote_verified": true}]}, {"theme": "Global yield and debt contagion risk", "insights": [{"claim": "Rising long-term government bond yields amid high debt burdens are a global phenomenon, not just a US one - 30-year yields have marched higher across the US, Japan, UK and France - so a targeted fix in one country (such as US Treasury intervention) risks displacing the pressure elsewhere as capital flows seek a new home.", "speaker": "@goldcouncil", "type": "causal", "entities": ["US Treasury", "Japan"], "conviction": "medium", "so_what": "Because sovereign yield/debt pressure is a global whack-a-mole problem, gold's appeal as a cross-border hedge against fiscal credibility risk isn't limited to US-specific developments - watch UK, Japan and France bond markets too.", "quote": "Like a game of whack-a-mole, a temporary solution here could worsen the problem elsewhere as investor flows look for a home.", "locator": "While the preceding analysis is focused on the US", "quote_verified": true}]}], "insight_total": 17, "top_entities": ["Gold", "US Treasury", "Fed", "Stanley Druckenmiller", "Warsh", "US dollar", "COMEX", "World Gold Council", "Japan", "US-Iran conflict"], "source_meta": {"author": "@goldcouncil", "word_count": 2466, "paywalled": false}}, {"record // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
