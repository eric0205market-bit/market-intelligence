function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

const URG_LABELS = { act:"🔴 Act Now", deep:"🔵 Deep", watch:"🟡 Watch" };
const URG_EMOJI = { act:"🔴", deep:"🔵", watch:"🟡" };

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function catColor(c){
  const map = {macro:"macro",credit:"credit",positioning:"positioning","AI/infra":"ai",crypto:"crypto",
    geopolitics:"geo",energy:"energy",tech:"tech",gold:"gold",culture:"culture",labor:"labor",
    regulation:"regulation",science:"science",venture:"venture"};
  return getComputedStyle(document.documentElement).getPropertyValue("--" + map[c]).trim();
}

function buildFilters(){
  const catCounts = {};
  ITEMS.forEach(i => catCounts[i.cat] = (catCounts[i.cat]||0)+1);
  const catBar = document.getElementById("catFilters");
  let html = '<button class="pill active" data-cat="all" onclick="setCat(\'all\')" style="border-color:#333;">All (' + ITEMS.length + ')</button>';
  Object.keys(catCounts).forEach(c => {
    html += '<button class="pill" data-cat="' + c + '" onclick="setCat(\'' + c + '\')">' + c + ' (' + catCounts[c] + ')</button>';
  });
  catBar.innerHTML = html;

  const urgCounts = {};
  ITEMS.forEach(i => urgCounts[i.urgency] = (urgCounts[i.urgency]||0)+1);
  const urgBar = document.getElementById("urgFilters");
  let uhtml = '<button class="pill active" data-urg="all" onclick="setUrg(\'all\')" style="border-color:#333;">All (' + ITEMS.length + ')</button>';
  ["act","deep","watch"].forEach(u => {
    if(urgCounts[u]) uhtml += '<button class="pill" data-urg="' + u + '" onclick="setUrg(\'' + u + '\')">' + URG_LABELS[u] + ' (' + urgCounts[u] + ')</button>';
  });
  urgBar.innerHTML = uhtml;
}

function setCat(c){ activeCat = c; activeSrc = null; refreshFilterStyles(); render(); }
function setUrg(u){ activeUrg = u; activeSrc = null; refreshFilterStyles(); render(); }

function refreshFilterStyles(){
  document.querySelectorAll("#catFilters .pill").forEach(el => {
    const c = el.getAttribute("data-cat");
    if(c === activeCat){ el.classList.add("active"); el.style.background = c==="all" ? "#333" : catColor(c); el.style.borderColor = c==="all" ? "#333" : catColor(c); }
    else { el.classList.remove("active"); el.style.background = "#fff"; el.style.borderColor = "#e5e2dd"; el.style.color = "#1a1a1a"; }
  });
  document.querySelectorAll("#urgFilters .pill").forEach(el => {
    const u = el.getAttribute("data-urg");
    if(u === activeUrg){ el.classList.add("active"); el.style.background = "#333"; el.style.borderColor = "#333"; }
    else { el.classList.remove("active"); el.style.background = "#fff"; el.style.borderColor = "#e5e2dd"; el.style.color = "#1a1a1a"; }
  });
}

function filterBySrc(name){
  activeCat = "all"; activeUrg = "all"; activeSrc = name;
  refreshFilterStyles();
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

function render(){
  const container = document.getElementById("cards");
  const filtered = ITEMS.filter(i => {
    if(activeCat !== "all" && i.cat !== activeCat) return false;
    if(activeUrg !== "all" && i.urgency !== activeUrg) return false;
    if(activeSrc && i.source.indexOf(activeSrc) === -1) return false;
    return true;
  });
  document.getElementById("emptyNote").style.display = filtered.length ? "none" : "block";

  let html = "";
  ITEMS.forEach(item => {
    const show = filtered.indexOf(item) !== -1;
    const shouldOpen = activeSrc && show;
    html += '<div class="card' + (shouldOpen ? ' open' : '') + (show ? '' : ' hidden') + '" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="num">#' + String(item.id).padStart(2,"0") + '</span>';
    html += '<span>' + URG_EMOJI[item.urgency] + '</span>';
    html += '<span class="badge" style="background:' + catColor(item.cat) + '">' + esc(item.source) + '</span>';
    html += '<span class="cattag">' + item.cat + '</span>';
    if(item.charts.count > 0 || item.charts.hot) html += '<span class="charticon">' + (item.charts.hot ? "🔥" : "📊") + '</span>';
    html += '<span class="htitle">' + esc(item.title) + '</span>';
    html += '</div>';
    html += '<div class="card-body">';
    html += '<div class="section-label">The Idea</div><div class="idea">' + esc(item.idea) + '</div>';
    html += '<div class="section-label">My Angle</div><div class="angle" style="border-color:' + catColor(item.cat) + '; background:' + catColor(item.cat) + '12;">' + esc(item.angle) + '</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet a"><div class="tlabel">TWEET A</div><p>' + esc(item.tweetA) + '</p><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet b"><div class="tlabel">TWEET B</div><p>' + esc(item.tweetB) + '</p><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    html += '<div class="charts-box' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.count > 0 ? ('📊 ' + item.charts.count + ' chart' + (item.charts.count>1?'s':'') + ' — ') : '') + esc(item.charts.desc) + '</div>';
    html += '<a class="link" href="' + item.link + '" target="_blank">↗ Read full article</a>';
    html += '</div></div>';
  });
  container.innerHTML = html;
}

function toggleCard(id){
  const el = document.getElementById("card-" + id);
  if(el) el.classList.toggle("open");
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function buildReport(){
  document.getElementById("metaline").textContent =
    META.date + " · " + META.time + " · " + META.itemsExtracted + " items from " + META.emailsRead + " emails";
  let html = "";
  html += "Window: <b>" + META.windowStart + "</b> to <b>" + META.windowEnd + "</b> (last 6 hours). Emails outside this window were not processed.<br>";
  html += "Emails in window: " + META.emailsInWindow + " · Emails read: " + META.emailsRead + " · Items extracted: " + META.itemsExtracted;
  html += "<b>Included sources</b>";
  html += META.includedSources.map(function(s){
    return '<div><span class="srcname" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + esc(s.name) + '</span> — ' + s.count + ' item' + (s.count>1?'s':'') + '</div>';
  }).join("");
  html += "<b>Skipped sources</b>";
  html += (META.skippedSources.length ? META.skippedSources.map(function(s){ return '<div>' + esc(s.name) + ' — ' + esc(s.reason) + '</div>'; }).join("") : '<div>None — every email in the window had extractable content.</div>');
  document.getElementById("reportBody").innerHTML = html;
}

buildFilters();
refreshFilterStyles();
render();
