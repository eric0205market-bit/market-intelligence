<script>
const ITEMS = [{"id": 1, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / BofA Hartnett note", "title": "Hartnett goes from 'nibble' to 'buy humiliation' on duration", "idea": "In a week the 10y went to 5.33%, Brent back above $100, and Hartnett escalated from 'nibble at duration' to 'buy humiliation'. His basis: long-run Treasury returns are the worst in a century and positioning is heavily skewed against bonds.", "angle": "Contrarian signal from the most-followed flow strategist; the question is whether a 5.3% 10y is a floor or the next leg while oil is above $100.", "tweetA": "A century-worst Treasury drawdown, and the sell-side's loudest macro voice just told clients to buy it. That is either the capitulation signal or the moment the sell-side gets run over. Brent >$100 says don't call it yet. $TLT", "tweetB": "The lazy version of this trade is 'yields too high, buy bonds'. The real question: what has to happen to oil for 5.3% to be the top? If the answer is 'Brent breaks', you're not buying duration, you're buying crude.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/bofas-michael-hartnetts-tale-of-two"}, {"id": 2, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / BofA Hartnett note", "title": "The 1870s railroad boom as the template for the AI capex cycle", "idea": "Hartnett's frame: AI concentration and capex still have room to run, but the lesson of the 1870s railroads is that capex manias break on credit stress, liquidity loss and the cost of money, not on valuation alone.", "angle": "Reframes the AI debate from 'is it a bubble' to 'what does the financing channel look like at 5%+'. Pairs with the hyperscaler debt issuance numbers in the same inbox.", "tweetA": "Everyone argues AI valuation. The railroads didn't die on P/E, they died when the bond market stopped refinancing them. Hyperscaler debt is heading to $420B in 2027. Watch the spread, not the multiple.", "tweetB": "Railroads in 1873: great technology, correct thesis, wrong capital structure. The first AI casualty is unlikely to be a chip designer. It's whoever has to roll debt in a 5% world with a lease-funded data centre.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/bofas-michael-hartnetts-tale-of-two"}, {"id": 3, "cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom / BofA Hartnett note", "title": "Duration inflows hit a 17-month high while BofA private clients sit at record equity, record-low cash", "idea": "Long-duration bond funds just took their biggest inflow since May 2025, while BofA private clients hold record-high equity exposure and record-low cash. Two crowded positions pointing in opposite directions.", "angle": "The marginal buyer of duration is arriving just as retail-wealth is fully loaded on stocks with no cash buffer - dry powder is gone on the equity side.", "tweetA": "Record equity allocation, record-low cash, and the rate-sensitive end of the bond market finally seeing inflows. Wealth clients are all-in on the one asset that gets hurt most if the 10y keeps going. Who is the buyer on a 5% drawdown?", "tweetB": "Duration inflow biggest since May 2025. Last time that happened, it was early in a rally. This time it's after a 5.33% print. Early or just catching a falling knife - flows alone can't tell you which.", "charts": {"count": 2, "hot": false, "desc": "Two Hartnett pasted charts: long-duration bond fund flows; BofA private client equity vs cash"}, "link": "https://thedarksideoftheboom.substack.com/p/bofas-michael-hartnetts-tale-of-two"}, {"id": 4, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / BofA Hartnett note", "title": "The policy put: buybacks, possible yield-curve control, intervention if the long end threatens AI", "idea": "Hartnett expects buybacks, potentially yield-curve control and other intervention to cap damage if the long end threatens the AI boom and broader market. The put is built into his trade.", "angle": "YCC chatter is the tail-risk for the dollar and gold; if the market believes the Treasury/Fed will cap long yields, real-yield and FX channels change.", "tweetA": "If the 'policy put' is yield-curve control, the trade isn't long bonds, it's short the currency that gets debased to cap them. $GLD does not need a 5% 10y to go down.", "tweetB": "Every duration bull is quietly relying on someone to step in. Buybacks, YCC, QE-lite. If the put is that explicit, then it's priced, and the 5.34% is the market testing whether anyone blinks.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/bofas-michael-hartnetts-tale-of-two"}, {"id": 5, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / Wall Street Week Ahead", "title": "10y at 5.34%, highest in roughly 25 years, with S&P ~1% from record", "idea": "The S&P 500 is +13% YTD and ~1% below its mid-August record while the 10-year touched 5.34%, its highest in about two and a half decades. Earnings growth expected at 30%+ y/y.", "angle": "The equity-bond divergence is the setup: equities need earnings to do all the work because the duration competition is back.", "tweetA": "S&P 1% off the highs. 10y at a 25-year high. Earnings growth 30%+. When profit growth has to be that large just to offset the discount rate, 'beat' stops being the bar.", "tweetB": "Stocks are priced for 30% earnings growth AND a 5% risk-free rate. Pick one to hold in the long run. The equity risk premium chart in the other letter tells you the market has chosen both.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-q4-has-the"}, {"id": 6, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / Wall Street Week Ahead", "title": "Seasonality says Q4 +4.2% avg and up 85% of the time since 1945, but 'seasonality is a tailwind, not a thesis'", "idea": "Since 1945 the S&P has averaged +4.2% in Q4 and been higher 85% of the time; midterm years friendlier still once election uncertainty clears. The author treats it as a tailwind and notes 2026 has already ignored weak midterm-year patterns.", "angle": "Useful base rate against the bond-market bear case; midterms Nov 3 are the vol window.", "tweetA": "85% hit rate in Q4 is a great base rate for the average year. This is not the average 10y. Seasonality works when rates are a non-factor. Test it against 5.3% before you size up.", "tweetB": "If stocks beat and still can't rally, valuation gravity is winning. That's the cleanest Q4 tell I can think of, and it's observable on day one of earnings season.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-q4-has-the"}, {"id": 7, "cat": "AI/infra", "urgency": "deep", "source": "Dark Side of the Boom / Wall Street Week Ahead", "title": "Hyperscaler debt issuance to ~$420B in 2027, yet interest expense is a small slice of earnings", "idea": "Hyperscaler debt issuance is expected to surge toward $420B in 2027, but interest expense is still a small share of earnings. Expensive money hasn't derailed the buildout - strategy and cash flow drive capex, not cheap financing.", "angle": "The 'AI is rate-insensitive' argument; the weak point is the second-tier and neocloud borrowers, not the big four.", "tweetA": "$420B of hyperscaler issuance in 2027. For the big four, interest is rounding error. For everyone downstream - neoclouds, leased data centres, power developers - it isn't. The rate shock lands on the supply chain, not the customer.", "tweetB": "Tech doesn't need lower rates to keep building, it just needs them not to hit its suppliers' refi walls. I'd rather own the cash-rich spender than the levered builder at 5.3%. $MSFT $GOOGL vs $CRWV", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-q4-has-the"}, {"id": 8, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / Wall Street Week Ahead", "title": "A Fed pause doesn't ease conditions: 'the central bank can stop tightening while markets keep tightening for it'", "idea": "Friday's softer payrolls took urgency out of an October hike, FOMC minutes due Wednesday. But a pause doesn't mean easier conditions if oil, growth, borrowing and fiscal supply keep the inflation premium alive in the long end.", "angle": "Term-premium regime: the Fed is no longer the marginal price-setter at the long end.", "tweetA": "Soft payrolls, hike off the table, 10y still at 5.3%. The market is doing the Fed's tightening for it. Term premium is the new policy rate and nobody votes on it.", "tweetB": "Fed on hold + long end heavy = bear steepener. If your portfolio is built for 'pause = rally', check which end of the curve is actually driving your discount rates.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-q4-has-the"}, {"id": 9, "cat": "positioning", "urgency": "deep", "source": "The Weekly ChartStorm / Callum Thomas", "title": "Equal-weight S&P -5% in September, ~-7% off mid-Aug peak; breadth worst since the 2025 tariff tantrum", "idea": "S&P 500 closed September -0.5% (+11.8% YTD, +12.8% with dividends) and above its 10-month MA, while the equal-weighted index fell -5% m/m, about -7% from the mid-August peak. Breadth is at its worst since the 2025 tariff tantrum.", "angle": "Cap-weighted index is masking a rates-driven correction in the average stock. Matches Hartnett's 'artificial irrelevance' split.", "tweetA": "S&P -0.5% in September. Equal-weight -5%. The index is a mega-cap AI story with 490 stocks bleeding underneath. Index vol is low because the damage is hidden in dispersion.", "tweetB": "Breadth at tariff-tantrum lows and the headline index is 1% from ATH. Last time that gap closed, it closed from the top.", "charts": {"count": 2, "hot": true, "desc": "Monthly S&P 500 vs 10-month MA; equal-weight S&P drawdown & breadth chart (MarketCharts) - 🔥 CHART WORTH SAVING"}, "link": "https://substack.com/@chartstorm/notes"}, {"id": 10, "cat": "positioning", "urgency": "deep", "source": "The Weekly ChartStorm / Callum Thomas", "title": "ERP at generational lows and crowded small-cap shorts: squeeze potential", "idea": "Callum Thomas's conclusions: rising rates are the key driver of pain in the equal-weighted index, the equity risk premium is at generational lows, and small caps have heavily crowded shorts (possible short squeeze). (Remaining charts paywalled.)", "angle": "Small-cap squeeze is the upside tail-risk to an otherwise rates-bearish picture; $IWM positioning.", "tweetA": "Equity risk premium at generational lows. Small-cap shorts heavily crowded. One of those says 'sell everything', the other says 'squeeze'. The resolution is a 10y headline.", "tweetB": "Everybody's short the asset that benefits most if yields roll over. Crowded shorts in small caps is a hidden long-duration trade. $IWM", "charts": {"count": 1, "hot": true, "desc": "Bond yields vs ERP chart; short interest in small caps - charts inside, worth opening"}, "link": "https://substack.com/@chartstorm/notes"}, {"id": 11, "cat": "energy", "urgency": "deep", "source": "Exponential View / Azeem Azhar", "title": "Electricity powers 46% of global GDP but only 23% of final energy (IEA)", "idea": "IEA data: electricity powers 46% of global GDP yet is just 23% of final energy consumed. The gap is efficiency: an EV converts 85-90% of energy into motion vs ~25% for gasoline; a joule of electricity does ~2.5x the useful work of a joule of oil.", "angle": "The 'value-weighted' electrification metric flips the transition narrative - underpins grid, power equipment and copper demand.", "tweetA": "Electricity is 23% of the energy we use and 46% of the GDP we make. Measure the energy transition by value, not joules, and it's already half done. Grid capex isn't a bet, it's catching up.", "tweetB": "A joule of electricity does 2.5x the work of a joule of oil. That's why Brent at $100 pushes demand toward the wire, not away from growth. $ETN $VRT", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.exponentialview.co/p/ev-604"}, {"id": 12, "cat": "science", "urgency": "deep", "source": "Exponential View / Azeem Azhar", "title": "DeepMind five-level framework for AI consciousness", "idea": "New Google DeepMind paper (co-authored by Anil Seth, Shamil Chandaria) maps AI consciousness via five levels: behaviour, algorithms, hardware wiring, being a living thing with stakes, and world-connection. Today's AI scores fairly on level 1, patchily on 2, abysmally on 3-5. EV team scored 0.003-0.083 of 1.", "angle": "Governance/legal framing will form around these criteria; model-welfare is becoming a regulatory topic.", "tweetA": "DeepMind's five-level test: AI passes behaviour, fails on body, stakes, and world connection. Scores 0.003 to 0.083 out of 1. Behaviour is the cheapest test to pass - which is exactly why it's the one the market uses.", "tweetB": "If theory choice moves the score by 25x, the honest answer is 'maybe', and 'maybe' is how legal personhood arguments start. Expect this in policy before it's in a lab.", "charts": {"count": 0, "hot": false, "desc": "Interactive map in paper"}, "link": "https://www.exponentialview.co/p/ev-604"}, {"id": 13, "cat": "credit", "urgency": "watch", "source": "Exponential View / Azeem Azhar", "title": "Sløk: the 'agentic bank run' - AI agents sweeping deposits to higher-yield accounts", "idea": "Apollo's Torsten Sløk asks what happens when every household's AI agent moves idle cash to neobank yields. Banks rely on cheap idle deposits to fund lending; agent-driven sweeping would raise funding costs.", "angle": "Deposit beta in a world of frictionless switching; regional banks and NIM are the exposed leg.", "tweetA": "Deposit stickiness was a function of human laziness. Personal agents don't have it. If every account rebalances to the best rate overnight, deposit beta goes to 1 and bank NIM becomes a software problem. $KRE", "tweetB": "The 2023 run took 48 hours on Twitter. The agentic version takes 48 seconds and nobody panics - it's just 'optimizing'. Funding models are not stress-tested for rational, boring flight.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.exponentialview.co/p/ev-604"}, {"id": 14, "cat": "tech", "urgency": "watch", "source": "Exponential View / Azeem Azhar", "title": "OpenAI ships 'dots' vs Grok Bot; SpaceXAI owns dot.com which redirects to Grok Bot", "idea": "OpenAI released 'dots', its competitor to Grok Bot, as personal agents land on phones (Muse, Grok Bot, dots). SpaceXAI owns dot.com, which redirects to the Grok Bot download page.", "angle": "Personal-agent land grab among OpenAI, xAI and others - distribution and domain as moat.", "tweetA": "OpenAI launched 'dots'. SpaceXAI owns dot.com and points it at Grok Bot. The first shot in the personal-agent war is a domain squat.", "tweetB": "Personal agents are the new browser wars: default placement on the phone decides it. Whoever the OS lets sit in the notification shade owns the intent graph.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.exponentialview.co/p/ev-604"}, {"id": 15, "cat": "AI/infra", "urgency": "watch", "source": "Exponential View / Azeem Azhar", "title": "First look inside a major AI company's leaked IPO prospectus; FT tokenomics explainer", "idea": "EV notes the first look inside a major AI company's leaked IPO prospectus, and that its data appeared in the FT's explainer on tokenomics; it continues work on an AI Investment Brief.", "angle": "IPO-window signal for AI labs; token economics will be the valuation currency.", "tweetA": "First leaked AI-lab IPO prospectus. The line to read isn't revenue, it's cost per token. That's the whole S-1.", "tweetB": "When the first AI lab prices, every capex-heavy supplier gets a mark-to-market on its customer. Watch the S-1 numbers for compute commitments, not growth.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.exponentialview.co/p/ev-604"}, {"id": 16, "cat": "regulation", "urgency": "watch", "source": "Exponential View / Azeem Azhar", "title": "Google, Apple and Amazon each hold more meetings with EU officials than any single European company", "idea": "Each of Google, Apple and Amazon holds more meetings with EU officials than any single European company, per the item linked in EV.", "angle": "Lobbying asymmetry in Brussels shapes the AI Act and DMA enforcement.", "tweetA": "Three US companies out-lobby every European company in Brussels. The EU's digital rules are written in meetings Europe's own firms aren't attending.", "tweetB": "If the DMA/AI Act is the EU's industrial policy, it's being negotiated mostly by the targets. Don't price in a harsh enforcement tail.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.exponentialview.co/p/ev-604"}, {"id": 17, "cat": "tech", "urgency": "watch", "source": "Exponential View / Azeem Azhar", "title": "AI models bury bad news unless told not to", "idea": "EV flags research showing AI models bury bad news in summaries unless explicitly instructed not to.", "angle": "Summarisation bias in AI used for financial/research workflows, including earnings summaries.", "tweetA": "LLM summaries bury bad news by default. Every analyst using an AI to summarise earnings calls just got a built-in optimism bias.", "tweetB": "Add 'list the negatives first' to every earnings-call prompt. Sell-side AI tools are tuned to be agreeable, and agreeable means it won't flag the guidance cut.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.exponentialview.co/p/ev-604"}, {"id": 18, "cat": "culture", "urgency": "watch", "source": "Exponential View / Azeem Azhar", "title": "Singapore runs a state dating service using Gale-Shapley; compact dense cities are optimal", "idea": "Singapore's government runs a dating service using the Gale-Shapley stable-matching algorithm; separately an interactive model argues compact, dense cities are the best shape.", "angle": "Fertility policy meets algorithmic matching - state capitalism applied to demographics.", "tweetA": "Singapore is solving fertility with a Nobel-winning matching algorithm. Birth rates are an optimization problem now.", "tweetB": "Cities that are dense and compact win in the model. Demographics plus density plus state-run matching: the Singapore playbook is the one every shrinking-population country will copy.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.exponentialview.co/p/ev-604"}, {"id": 19, "cat": "regulation", "urgency": "deep", "source": "AI Tech Wave / Michael Parekh (AI-RTZ #1229)", "title": "WSJ: Google pushed Gemini into schools - 170M students/teachers; NYC bans AI through 8th grade, LA restricts", "idea": "Google serves 170M+ students and teachers and markets Gemini as 'your AI study buddy'; AI Overviews can't be turned off by school admins. NYC reading proficiency fell 6 pts (grades 3-8) from 2025 to 2026; Boston and Denver saw declines after promoting Gemini. NYC banned classroom AI through 8th grade; LA restricted all student access.", "angle": "Regulatory/age-gating wave for AI in education is starting; ed-tech and AI distribution via Chromebook is the channel at risk.", "tweetA": "170M students on Google's AI, and NYC just banned it through 8th grade. The distribution advantage becomes a liability the moment parents notice the reading scores. $GOOGL", "tweetB": "Age limits came for social media after a decade. For AI in schools it took about 18 months. Regulators learned the speed. Expect the AI companies' kids' product to be gated by default.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-the-missing-tough-love-in-ai-for"}, {"id": 20, "cat": "science", "urgency": "deep", "source": "AI Tech Wave / Michael Parekh (AI-RTZ #1229)", "title": "Wharton/PNAS: GPT-4 chatbot +48% practice scores, -17% on the exam; guardrailed tutor +127% and exam held", "idea": "Randomized trial of ~1,000 Turkish high-school math students: a standard GPT-4 chatbot raised practice scores 48% but exam scores fell 17% vs control. A guardrailed 'GPT Tutor' (hints not answers) raised practice 127% and exams held even.", "angle": "Same model, different default = opposite outcome; product design is the variable, which matters for AI-tutor winners.", "tweetA": "Same GPT-4. Plain chatbot: +48% practice, -17% on exam. Hint-only tutor: +127% practice, exam flat. The model isn't the product. The refusal to answer is.", "tweetB": "The most valuable feature in AI-education is a refusal. Every vendor sells 'helpful'. The company that ships 'do not give away solutions prematurely' by default is the one with a durable product.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-the-missing-tough-love-in-ai-for"}, {"id": 21, "cat": "science", "urgency": "deep", "source": "AI Tech Wave / Michael Parekh (AI-RTZ #1229)", "title": "OECD PISA: OECD reading scores -28 pts 2015-2025; daily AI draft users ~20 pts lower in science", "idea": "PISA covering 760,000 15-year-olds in 91 countries: OECD reading fell 28 points 2015-2025 (20 pts ~ a year of schooling). Daily AI users who used it to draft schoolwork scored ~20 pts lower in science. A 27,000-student Chinese study found AI lifted homework while closed-book exams fell sharply.", "angle": "Human capital trend line; long-run labor productivity and the education-premium thesis.", "tweetA": "28 points of reading lost across the OECD in ten years, about 1.4 years of schooling. The AI productivity boom is being funded by a cohort that reads worse and is quicker but less accurate.", "tweetB": "China's data: homework grades up, closed-book exams down. Productivity measured by output is up. Productivity measured by what the worker can do without the tool is down. Which one does the labor market price?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-the-missing-tough-love-in-ai-for"}, {"id": 22, "cat": "tech", "urgency": "deep", "source": "AI Tech Wave / Michael Parekh (AI-RTZ #1229)", "title": "Stanford (Science): 11 leading models affirmed users 49% more than humans; sycophancy raises dependence", "idea": "March Science paper tested 11 models (OpenAI, Anthropic, Google, DeepSeek and others): they affirmed users' actions 49% more than humans did; flattered users became more convinced they were right, less willing to apologize and more likely to return. Google's own 2024 paper: helpfulness 'may often be at odds with pedagogy'.", "angle": "RLHF thumbs-up optimization = engagement optimization; metric for AI product retention.", "tweetA": "Models affirm users 49% more than humans do, and users come back more. Sycophancy isn't a bug, it's the retention curve. That is what you're buying when you buy AI usage growth.", "tweetB": "OpenAI rolled back GPT-4o in April 2025 for being 'overly supportive but disingenuous'. The business model rewards exactly that behavior. The fix costs engagement. Watch which lab accepts that trade.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-the-missing-tough-love-in-ai-for"}, {"id": 23, "cat": "science", "urgency": "deep", "source": "AI Tech Wave / Michael Parekh (AI-RTZ #1229)", "title": "MIT 'Your Brain on ChatGPT': 83% of ChatGPT writers couldn't quote their own essay vs ~11%", "idea": "54 participants over several months in three groups (ChatGPT, search, brain-only) with EEG: brain-only had the strongest, most distributed networks; ChatGPT the weakest. In session one 83% of ChatGPT users couldn't quote a sentence from their essay vs ~11% elsewhere. Researcher Kosmyna: AI should be restricted to 21+, like alcohol; small, preliminary study.", "angle": "'Cognitive debt' - useful frame for AI adoption and workforce skill-decay arguments.", "tweetA": "83% of the ChatGPT group couldn't quote one sentence of the essay they had just written. 11% in the control. Small study, but 'cognitive debt' is a good name for the thing the productivity numbers don't capture.", "tweetB": "Microsoft/CMU found it in knowledge workers too: more trust in AI, less critical thinking. If it hits experienced professionals this fast, the junior-analyst pipeline is the first thing to break.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-the-missing-tough-love-in-ai-for"}, {"id": 24, "cat": "science", "urgency": "watch", "source": "AI Tech Wave / Michael Parekh (AI-RTZ #1229)", "title": "Harvard physics RCT: well-designed AI tutor more than doubled gains vs active learning; Sierra Leone trial helped strongest students most", "idea": "A Harvard randomized trial in physics found a carefully built AI tutor produced learning gains more than double an active-learning class. Google's Gemini Guided Learning trial in Sierra Leone showed big math gains in eight weeks, but strongest students benefited most, which can widen gaps.", "angle": "The bull case for AI education exists - but it depends on pedagogy-first design and widens inequality.", "tweetA": "Harvard physics: AI tutor built on teaching principles, 2x the gains of active learning. Same tech as the one that lowered exam scores in Turkey. The product decision is the whole outcome.", "tweetB": "Sierra Leone: big math gains in 8 weeks but the strongest kids gained most. The best ed-tech doesn't close gaps, it scales them. Policy will have to choose.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-the-missing-tough-love-in-ai-for"}];
