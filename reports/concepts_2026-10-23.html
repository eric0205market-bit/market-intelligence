  --border: #dfe8e3;
  --border-light: #eef3f0;

  --t-thesis: #2563eb;
  --t-prediction: #7c3aed;
  --t-framework: #0891b2;
  --t-data_point: #d97706;
  --t-causal: #be185d;
  --t-contrarian: #dc2626;
  --t-anecdote: #6b7280;
  --t-default: #6b7280;

  /* conviction colors */
  --c-high: #15803d;
  --c-medium: #d97706;
  --c-low: #9ca3af;
  --c-exploratory: #8b5cf6;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 980px; margin: 0 auto; padding: 24px 16px 80px; }

             color: var(--text-2); display: flex; gap: 16px; flex-wrap: wrap; }

            margin-bottom: 16px; padding: 8px 12px; background: var(--surface);

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }

anually in decades-old desktop software.", "speaker": "Bessemer Venture Partners", "type": "data_point", "entities": ["Mach9", "Bessemer Venture Partners", "LiDAR"], "conviction": "high", "so_what": "A funded AI-native entrant is targeting a manual step upstream of all US infrastructure projects.", "quote": null, "locator": "Mach9 is automating this work", "quote_verified": false}, {"claim": "The US infrastructure buildout (aging roads and bridges, data-centre power and water strain, grid hardening, broadband) is outpacing the supply of drafters and engineers who turn field survey data into design-ready deliverables.", "speaker": "Bessemer Venture Partners", "type": "causal", "entities": ["civil engineering", "data centers", "grid", "infrastructure"], "conviction": "medium", "so_what": "Labor scarcity in survey drafting is a hidden throttle on infrastructure project throughput.", "quote": null, "locator": "A buildout that outpaces its workforce", "quote_verified": false}, {"claim": "Sensor capture has become cheaper and faster but extraction has not kept up, so drafter hours cap how much infrastructure gets mapped, designed and maintained.", "speaker": "Bessemer Venture Partners", "type": "causal", "entities": ["LiDAR", "surveying"], "conviction": "medium", "so_what": "The scarce step is extraction labor, which is exactly what AI substitutes.", "quote": null, "locator": "While capture has gotten cheaper and faster", "quote_verified": false}]}, {"theme": "Vertical AI business model", "insights": [{"claim": "Mach9 prices per mile of road or acre surveyed, so it earns from the project (labor) budget rather than the IT budget, which Bessemer sees as far larger and aligned with how engineering firms bill clients.", "speaker": "Bessemer Venture Partners", "type": "framework", "entities": ["Mach9", "vertical AI"], "conviction": "high", "so_what": "Usage-based pricing against labor spend is a template for judging vertical AI revenue ceilings.", "quote": null, "locator": "Ma ce_meta": {"author": "", "word_count": 1064, "paywalled": false}}, {"record_id": "533d7f46c7dcb81b", "source_type": "concepts", "source_name": "Chatham House", "source_url": "https://www.chathamhouse.org/2026/10/why-has-egypts-president-sisi-said-he-will-step-down-2030", "title": "Why has Egypt’s President Sisi said he will step down in 2030?", "published_date": "2026-10-22", "language": "en", "processed_at": "2026-10-23T11:15:41Z", "processor": "claude-code-sub-opus", "tags": ["Geopolitics", "Macro"], "gist": "Chatham House argues Sisi's pledge to step down in 2030, paired with a military-academy succession pipeline, is driven by an unsustainable debt-financed economy and a state-preservation vision, and will likely produce military guardianship rather than civilian rule.", "themes": [{"theme": "Egypt's economic strain", "insights": [{"claim": "Debt servicing is 63.9% of planned expenditure in Egypt's current budget, up from 43% in 2014, and interest payments as a share of GDP exceed combined allocations for education, healthcare, wages and subsidies.", "speaker": "Chatham House", "type": "data_point", "entities": ["Egypt", "Egyptian budget"], "conviction": "high", "so_what": "Fiscal space is nearly exhausted, raising restructuring and IMF-dependence risk for Egyptian assets.", "quote": null, "locator": "Economic troubles", "quote_verified": false}, {"claim": "Egypt's external debt rose from $46.1B (16.4% of GDP) in 2014 to $164.8B (38.9% of GDP) by end-Q1 2026, while the pound weakened from 7.14 to about 53.8 per dollar.", "speaker": "Chatham House", "type": "data_point", "entities": ["Egypt", "Egyptian pound", "external debt"], "conviction": "high", "so_what": "Persistent depreciation and rising external debt keep EGP and sovereign credit under pressure.", "quote": null, "locator": "Egypt’s external debt rose", "quote_verified": false}, {"claim": "Urban inflation reached 13.9% in September 2026 and is expected to rise further, with the national poverty rate at 35.7% in 2023.", "speaker": "Chatham House", "type": "data_point", "entities": ["Egypt", "inflation", "poverty"], "conviction": "high", "so_what": "Rising living costs raise the odds of social unrest that the regime fears.", "quote": null, "locator": "Urban inflation has risen", "quote_verified": false}]}, {"theme": "Sisi's exit logic", "insights": [{"claim": "Chatham House attributes Sisi's decision to two factors: an unsustainable debt-financed, military-dominated economic model that threatens regime stability, and his view of the 2011 uprising as 'the death certificate of the Egyptian state' requiring a managed transition.", "speaker": "Chatham House", "type": "causal", "entities": ["Sisi", "Egypt", "Egyptian military"], "conviction": "medium", "so_what": "Regime-preservation logic, not reform conviction, explains the timing; watch for reversal if conditions worsen.", "quote": null, "locator": "Two factors likely lie behind this surprise decision", "quote_verified": false}, {"claim": "Sisi said no further constitutional amendments will extend his rule, and his term, extended from four to six years by the 2019 referendum, ends in 2030; he would be the first Egyptian president to leave without dying, prison or a popular uprising.", "speaker": "Chatham House", "type": "data_point", "entities": ["Sisi", "Egypt", "2019 constitutional amendments"], "conviction": "high", "so_what": "A peaceful exit would be an unprecedented change in Egyptian political risk.", "quote": null, "locator": "If Sisi follows through", "quote_verified": false}, {"claim": "Sisi may reverse course: patronage-system beneficiaries may push him to stay, and escalating regional involvement, such as seeking parliamentary authorization to deploy troops to defend Saudi Arabia against Houthi attacks, or worsening unrest could convince him that staying best guarantees stability.", "speaker": "Chatham House", "type": "prediction", "entities": ["Sisi", "Saudi Arabia", "Houthis"], "conviction": "medium", "so_ d outcomes raise EU-budget and fiscal-policy risk premia for France.", "quote": null, "locator": "France’s political centre no longer holds", "quote_verified": false}, {"claim": "Le Pen has said she would not fear a confrontation with Brussels over the EU budget if elected, and the AfD wants an end to Ukraine support and normalized Russian gas trade, so fragmentation in Paris and Berlin would weaken European defence and competitiveness.", "speaker": "Chatham House", "type": "prediction", "entities": ["Le Pen", "AfD", "EU", "Ukraine", "Russia"], "conviction": "medium", "so_what": "A populist presidency in France would test EU fiscal rules and Ukraine support.", "quote": null, "locator": "Le Pen has confirmed that she wouldn’t fear a confrontation", "quote_verified": false}]}, {"theme": "Europe's weakening social contract", "insights": [{"claim": "The AfD, which won 20.8% in the 2025 federal election, now polls at roughly 28–30%, driven by industrial-model erosion from energy costs, restricted export markets and Chinese competition.", "speaker": "Chatham House", "type": "data_point", "entities": ["AfD", "Germany", "China"], "conviction": "high", "so_what": "German political risk is rising as the industrial model deteriorates.", "quote": null, "locator": "The far-right Alternative for Germany", "quote_verified": false}, {"claim": "Europe's postwar bargain of rising prosperity and a better life for children has weakened just as AI threatens professions young people trained for, fuelling social demotion and political anger toward established parties.", "speaker": "Chatham House", "type": "thesis", "entities": ["Europe", "AI", "young people"], "conviction": "medium", "so_what": "AI-driven job anxiety is an underpriced political driver of populist support.", "quote": null, "locator": "Europe’s weakening social contract", "quote_verified": false}, {"claim": "Gabriel Attal proposed allowing temporary social-media restrictions during riots, and Italy's defence minister called ull, "locator": "Solomon’s speech came after", "quote_verified": false}, {"claim": "The US and China dominate up to 90% of compute, so middle powers cannot compete on AI capex and must choose between aligning, hedging, specializing in supply chain footholds, or coordinating.", "speaker": "Chatham House", "type": "data_point", "entities": ["United States", "China", "compute", "middle powers"], "conviction": "high", "so_what": "Compute concentration frames why sovereign-AI strategies depend on coordination.", "quote": null, "locator": "The US and China dominate up to 90 per cent of compute", "quote_verified": false}, {"claim": "Chatham House argues middle-power status is itself forged through coordination, citing Cohere and Aleph Alpha forming a 'transatlantic sovereign AI solution' and Canada and Germany committing £300M to a non-profit AI safety start-up.", "speaker": "Chatham House", "type": "thesis", "entities": ["Cohere", "Aleph Alpha", "Canada", "Germany"], "conviction": "medium", "so_what": "Cross-border sovereign AI tie-ups are an emerging structure to watch among non-US labs.", "quote": null, "locator": "Welcome to the club", "quote_verified": false}, {"claim": "Canada has called for a Technology Stability Board modelled on the post-crash Financial Stability Board, and the UK could use its G20 presidency to design such an arrangement enabling mandatory testing and serious-incident information sharing.", "speaker": "Chatham House", "type": "prediction", "entities": ["Canada", "Financial Stability Board", "G20", "United Kingdom"], "conviction": "medium", "so_what": "An FSB-style AI body would be a new global regulatory layer affecting frontier labs.", "quote": null, "locator": "Using the G20 to design an FSB-style arrangement", "quote_verified": false}]}, {"theme": "Dependence and access risk", "insights": [{"claim": "Middle powers worry their access to American proprietary models such as Claude or GPT-5 is not guaranteed, and some fear dependence on Chinese op // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
