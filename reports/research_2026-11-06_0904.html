<script>
const ITEMS = [{"id": 1, "cat": "geopolitics", "urgency": "deep", "source": "Noah Smith / Noahpinion", "title": "Biggest midterm wave since 1974/76 — and both of those years ended in a GOP comeback", "idea": "Noah Smith: Dems just had the largest midterm wave in half a century, bigger than Obama 2010 or Trump 2018. His historical flag: the last comparable wipeouts were 1974 and 1976, which were followed by the Reagan-era right turn, not Democratic dominance. Dems control Congress but Trump vetoes most legislation, so the wave is a mandate to block, not to build.", "angle": "Gridlock regime = fiscal and regulatory drift, not policy shocks. Markets get oversight and subpoenas instead of legislation.", "tweetA": "Everyone is pricing the blue wave as a regime change. 1974 and 1976 were bigger waves and the next decade belonged to the other side. A wave measures anger at the incumbent, not demand for a platform.", "tweetB": "Divided government with a veto pen is the most boring macro regime there is: no tax bill, no budget deal, no entitlement reform. The only live variable is who controls the subpoena calendar. Price the deficit as unmanaged.", "charts": {"count": 2, "hot": true, "desc": "Chart of midterm seat swings by year: 1974/76 stand out as the only comparable wipeouts. 🔥 CHART WORTH SAVING"}, "link": "https://www.noahpinion.blog/p/for-the-democrats-now-comes-the-hard"}, {"id": 2, "cat": "geopolitics", "urgency": "deep", "source": "Noah Smith / Noahpinion", "title": "Center-left won the wave: Blue Dogs nearly doubled (+14), California billionaire tax failed and a ban on such taxes passed", "idea": "Moderates drove the win: Blue Dog Coalition added at least 14 members, nearly doubling. California's billionaire tax lost, and voters approved a competing proposition forbidding such taxes in future. Sanders-endorsed candidates underperformed and trans-sports positions still poll conservative.", "angle": "Wealth-tax risk for tech founders and CA-domiciled holders just got structurally reduced; progressive tax agenda has less runway into 2028.", "tweetA": "California voters didn't just reject a billionaire tax, they passed a ban on ever trying one. That's not a miss, that's a constitutional door shut. Wealth-tax tail risk for CA-domiciled founders just repriced.", "tweetB": "Blue Dog caucus nearly doubled while the left lost primaries-to-general fights. If you were hedging a 2028 progressive tax agenda, the market's first real vote says you were hedging the wrong faction.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.noahpinion.blog/p/for-the-democrats-now-comes-the-hard"}, {"id": 3, "cat": "regulation", "urgency": "deep", "source": "Noah Smith / Noahpinion", "title": "Dem oversight agenda targets Trump family crypto dealings (Witkoff) and mineral deals", "idea": "Incoming committee chairs: Blumenthal's Permanent Subcommittee on Investigations plans to probe Trump real estate and 'crypto dealings with special envoy Steve Witkoff'; Huffman wants the Trump family's role in mineral deals and the ballroom construction; Garcia lists five Oversight priorities including family business dealings.", "angle": "Subpoena power aimed at crypto and critical-minerals deals = headline risk for the policy-linked parts of both trades.", "tweetA": "Subpoena power points at two places I care about: Trump-family crypto exposure and critical-minerals deals. Policy-adjacent names in both sectors now carry an oversight discount that wasn't in last week's price.", "tweetB": "Critical minerals trades were built on the premise that Washington would keep writing checks. Now the House committee that will read those contracts line by line has a different owner. $MP $USAR", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.noahpinion.blog/p/for-the-democrats-now-comes-the-hard"}, {"id": 4, "cat": "macro", "urgency": "deep", "source": "Noah Smith / Noahpinion", "title": "Dems' sandbox policy: sunset pass-through tax cuts, AI labor shields, social wealth funds", "idea": "Smith argues Dems should workshop two things while out of the presidency: deficit reduction (sunset Trump's pass-through business cuts) and AI labor protections — flexible welfare, employment incentives, social wealth funds. Test what polls, then fold the popular ones into the 2028 platform.", "angle": "The 2028 policy menu is being drafted now: AI-displacement insurance and capital-ownership schemes are the likely centerpieces.", "tweetA": "Social wealth funds as the Democratic answer to AI displacement. If that's the 2028 platform, the debate stops being 'will AI take jobs' and becomes 'who owns the equity.' That's a different asset-allocation conversation.", "tweetB": "Notice what's missing: an actual debt plan. The party that just won on cost of living is workshopping AI safety nets while the interest bill compounds. Term premium doesn't read platforms.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.noahpinion.blog/p/for-the-democrats-now-comes-the-hard"}, {"id": 5, "cat": "culture", "urgency": "watch", "source": "Noah Smith / Noahpinion", "title": "Liberal nationalism as the missing ideology of the post-woke left", "idea": "Smith says the Resistance is 'headless' since the woke wave receded; three factions compete (leftists, Warrenites, Abundance) and each has fatal flaws. His pick: FDR-style liberal nationalism — pluralism plus shared civic religion — and Abundance as the policy engine (housing, energy, permitting reform bill moving in Congress).", "angle": "A bipartisan permitting reform bill plus an Abundance wing = slow-burn tailwind for grid, transmission and housing build-out.", "tweetA": "Abundance won't win the party, but it keeps winning the policy: permitting reform is moving with bipartisan votes. The grid trade gets its catalyst from the one faction that isn't trying to win elections.", "tweetB": "The Warrenite target is wrong: voters don't mind billionaires, they mind Musk's politics. Americans tolerated the rockets and EVs. Culture, not wealth, is the political attack surface for tech.", "charts": {"count": 3, "hot": false, "desc": "Charts on faction polling and trans-sports opinion — worth opening"}, "link": "https://www.noahpinion.blog/p/for-the-democrats-now-comes-the-hard"}, {"id": 6, "cat": "positioning", "urgency": "act", "source": "Stephen Innes / Dark Side of the Boom", "title": "Tech hedge funds gave back all 2026: +24% in Jun/Jul to flat, -4.1% in one day", "idea": "Goldman Prime: tech HFs fell from ~24% YTD in June–July to roughly flat, including a -4.1% Thursday. Nasdaq 100 had its worst day since March 2020 and semis dropped more than 12%. Central question from Callahan: how much AI capex slowdown is priced?", "angle": "Crowded-long unwind signature — four months of alpha gone in one session means gross was high and exits were narrow.", "tweetA": "Tech hedge funds went from +24% to flat in one week. Four months of alpha in a single session. That's not a thesis breaking, that's a crowded elevator with one door.", "tweetB": "Semis -12%, NDX worst day since March 2020, and the question on the desk is still 'how much is priced.' If you have to ask, the answer is not yet. $SMH $NVDA $SOXX", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-great-round-tripfour-months-of"}, {"id": 7, "cat": "positioning", "urgency": "act", "source": "Stephen Innes / Dark Side of the Boom", "title": "Client inquiries 10/10, high-touch trading 5/10; retail liquidating, CTAs next", "idea": "Goldman's Asia floor: inquiries at ten out of ten, actual high-touch flow about five. Vanda sees a surge in retail liquidation in tech; institutional buy interest 'conspicuously thin'. CTA thresholds are giving way, adding systematic selling.", "angle": "The gap between interest and execution is the tell: no bid yet, and systematic supply still ahead.", "tweetA": "Phones ringing at 10/10, orders at 5/10. That gap is what a bottom is NOT. Retail is selling, CTAs are about to, and the buyers want to be asked twice.", "tweetB": "Who is the marginal buyer of $400B of AI equity when retail sells, HFs de-gross and CTAs flip? Corporate buybacks, and those depend on the capex budget the market is questioning.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-great-round-tripfour-months-of"}, {"id": 8, "cat": "macro", "urgency": "act", "source": "James / Checkonchain", "title": "NDX -7.3% in 48 hours after an initial election rally; case for a capital-rotation event", "idea": "Checkonchain: markets rallied on the Dem sweep, then reversed sharply; Nasdaq-100 fell 7.3% over two days. His thesis: polarized politics means the pendulum swings faster, and assets that were heavily favored (the AI trade) now face political scrutiny if data-center build-out is slowed. Covers BTC, gold, equities in the premium video.", "angle": "Politics as a factor now: AI capex has a new, non-economic risk premium.", "tweetA": "Election night: rally. 48 hours later: Nasdaq -7.3%. The market didn't price the Dem win, it priced what a Dem Congress does to data-center permitting. Politics is now a factor in the AI trade.", "tweetB": "Capital rotation after a clean election result is classic. The question is where it goes: gold fell too, so it's not defensive rotation. It's cash. $QQQ $GLD", "charts": {"count": 0, "hot": false, "desc": "Premium video/charts behind paywall — worth opening"}, "link": "https://newsletter.checkonchain.com/p/election-slam"}, {"id": 9, "cat": "gold", "urgency": "act", "source": "Stephen Innes / Dark Side of the Boom", "title": "Goldman cuts gold: end-2026 $4,650→$4,150, end-2027 $5,400→$4,800", "idea": "Goldman (Thomas/Struyven) cut year-end 2026 gold by $500 to $4,150 and end-2027 by $600 to $4,800. Central-bank buying was ~85t/month recently, assumed 60t/month through 2027, but a hawkish Fed changes the economics of carrying gold. Easing expected H2 2027.", "angle": "Sell-side 'catching down' to the tape: gold ignored weak yields and a soft dollar for weeks.", "tweetA": "Goldman cut gold $500 and still calls it a bull market. Central banks buy 60 tonnes a month for 14 more months and the forecast still falls — because the marginal price is set by the leveraged longs, not the vaults.", "tweetB": "Gold stopped responding to lower yields and dollar weakness weeks ago. A forecast cut isn't news; it's the sell-side acknowledging a tape that already moved. The real signal is it traded as a source of cash in a tech liquidation. $GLD $GDX", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/goldman-cuts-its-gold-forecast-the"}, {"id": 10, "cat": "gold", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom", "title": "Goldman's 2022 analogy: higher rates beat official-sector demand; crowded call options amplified the correction", "idea": "Goldman compares now to 2022: rates overwhelmed supportive central-bank demand, and call-option positioning amplified the drop as it had the rally. Next 3–6 months difficult for tactical longs; picture improves once the Fed eases in H2 2027.", "angle": "'Good asset, bad trade' distinction; options crowding is the amplifier.", "tweetA": "2022 playbook for gold: central banks kept buying and the price still fell 20%+ because real rates won. Calls amplified the rally, now they amplify the exit. Good asset, bad trade is a real category.", "tweetB": "If the Fed is hiking in December as MacroEdge fears, Goldman's H2 2027 easing call is a 12-month air pocket for gold. Positioning, not demand, writes that chapter.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/goldman-cuts-its-gold-forecast-the"}, {"id": 11, "cat": "energy", "urgency": "act", "source": "Stephen Innes / Dark Side of the Boom", "title": "Iran says five ships hit mines in 24h; two tankers on fire east of Hormuz", "idea": "Iranian state media claims five vessels hit naval mines in the past 24h, including two burning tankers east of the Strait. Innes argues the market had priced de-escalation too early; physical disruption vs political restraint after the midterms creates two-way risk.", "angle": "War-premium removal looks premature; crude's pullback rested on a political story, not a physical one.", "tweetA": "Oil sold off because Washington 'can't sustain the war.' Meanwhile five ships hit mines in a day. Pricing the committee meeting before the explosion is how you get run over. $USO $XLE", "tweetB": "A war meant to force regime change in Iran delivered regime change in the US Congress. Tehran noticed. The reflexive question: does Iran now have less reason to negotiate? That's bullish crude, not bearish.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/oil-market-daily-hormuz-is-still"}, {"id": 12, "cat": "geopolitics", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom", "title": "Two clocks: military vs political — 'the physical market trades the explosion, the macro market trades the committee meeting'", "idea": "Innes frames the White House as caught between a military clock (limited strikes on Iran's southern coast, attacks on shipping) and a political clock (fiscal deadlines, oversight, voter fatigue over gas prices). Crude can rally on Hormuz headlines while equities/rates price eventual restraint.", "angle": "Cross-asset divergence: crude on geography, rates and equities on politics. Expect incoherent tape.", "tweetA": "Crude trades Hormuz geography, rates trade Washington politics. Two time horizons, one war. When they disagree the curve is where you see it. Watch front spreads vs the 10-year.", "tweetB": "Funding deadlines are the war's real off-switch. Congress doesn't need to vote on Iran, it only needs to not vote on the supplemental. Appropriations calendar is an oil catalyst.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/oil-market-daily-hormuz-is-still"}, {"id": 13, "cat": "geopolitics", "urgency": "deep", "source": "MacroEdge Research", "title": "42 of 43 local data-center bans passed on election night", "idea": "MacroEdge: 'a historic AI and data center bloodbath' coincided with 42 of 43 data-center ban measures passing. Author, who lived in Abilene during Stargate permitting, says secret permitting and lobbyists lecturing residents about duty with few long-term jobs drove anger over power costs and water.", "angle": "Social license is now the binding constraint on AI infrastructure, ahead of chips and power.", "tweetA": "42 of 43. Data-center bans passed at a rate no ballot measure gets in a normal year. The binding constraint on AI capex just became the zoning board, not TSMC. $VRT $ETN $VST", "tweetB": "Abilene was Stargate's flagship. The people who watched it get built in secret are the ones voting the bans. The cheapest lesson in infrastructure: permit in daylight or lose the referendum.", "charts": {"count": 2, "hot": false, "desc": "Charts on AIS AI ETF structure and Korea retail — worth opening"}, "link": "https://www.macroedge.world/p/midweek-macro-note-election-recap"}, {"id": 14, "cat": "positioning", "urgency": "act", "source": "MacroEdge Research", "title": "Korea halted -9%, one of the largest single-day vol moves on record; hedges were pulled the day before", "idea": "MacroEdge's 'necksnap': one of the largest single-day volatility moves on record, Korea halted down 9%. Many pulled hedges the day before. Author says don't chase bounces; wait for moving averages to catch up, and flags December FOMC, when 'the Fed needs to hike', as the next volatility node.", "angle": "Hike risk in December is a call that isn't in sell-side base cases. Korea retail blowup is the EM leg.", "tweetA": "Korea halted -9% and the hedges were pulled a day earlier. That's the whole story of this cycle in one line: everyone is long convexity until they need it. $EWY", "tweetB": "A Fed hike in December. Read that again. Not a cut being priced out, a hike. If that's even a 30% tail, the AI multiple has an entirely different denominator.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.macroedge.world/p/midweek-macro-note-election-recap"}, {"id": 15, "cat": "geopolitics", "urgency": "deep", "source": "MacroEdge Research", "title": "Dems largest House margin since 1990, 56 Senate seats; Texas flipped state House and all 17 state-level races", "idea": "Results per MacroEdge: House largest Dem margin since 1990; Senate at 56 (55 officially, Mississippi likely recount); Arizona gives Democrats a state trifecta for the first time in 60 years; Texas Dems took all 17 state-level races and flipped the state House. A second Railroad Commission seat could flip in 2028.", "angle": "Texas oil regulation could shift left by 2028 — a regime change for the Permian's light-touch policy.", "tweetA": "Texas Railroad Commission is the most important oil regulator in the US. One more seat flipping in 2028 and the Wild West era of flaring and permits ends. Not in anyone's Permian model. $FANG $EOG", "tweetB": "Colorado in the 2010s is the template: an influx of coastal migrants flips the state in a decade. Texas is on that path with 4x the oil. Migration is a commodity-policy variable.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.macroedge.world/p/midweek-macro-note-election-recap"}, {"id": 16, "cat": "macro", "urgency": "deep", "source": "MacroEdge Research", "title": "'Illusion of abundance': groceries +20% YoY, the shift to the 'old world economy' under scarcity", "idea": "MacroEdge says the midterms were a rejection, not a mandate; voters facing groceries up 20% YoY, war, and workforce replacement. The author argues the US is moving toward an 'old world economy' of scarcity, not abundance, and that this vote doesn't change prices vs a year or six years ago.", "angle": "Affordability as the dominant political variable; real prices vs index levels.", "tweetA": "Groceries +20% YoY. Every economist calls it a rounding error until the median voter flips the Senate. Affordability is a lagging indicator for CPI and a leading one for ballots.", "tweetB": "The author checks what things cost vs six years ago before reading index levels. Try it on your own portfolio: nominal gains in the S&P vs real gains in groceries. The gap is the political story.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.macroedge.world/p/midweek-macro-note-election-recap"}, {"id": 17, "cat": "tech", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "SpaceX picks Qualcomm for a nationwide 5G network: tens of thousands of cell sites from 2027", "idea": "SpaceX will build a conventional terrestrial 5G network with Qualcomm (Dragonwing chips and radio/baseband software), covering tens of thousands of sites, deployment from 2027. US wireless market ~$235B (MoffettNathanson). SpaceX CFO says it aims to be a major US carrier; Starlink has 11,000+ satellites and ~13.5M subs (DB est.).", "angle": "Starlink pivot from rooftop-dish small cells to towers: satellites can't serve indoor/urban coverage.", "tweetA": "SpaceX just admitted the satellites can't cover your living room. A Qualcomm-built tower network is the tell. $QCOM $T $VZ $TMUS", "tweetB": "$235B wireless market, three carriers that all refused Elon network access. His reply is to build a fourth. The telcos' real risk isn't Starlink; it's a competitor with no legacy capex.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-elons-can-you-hear-me-now-wireless"}, {"id": 18, "cat": "tech", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "Spectrum stack: $17B + $2.6B + ~$8B; build cost estimates range from $80B to $500B", "idea": "SpaceX bought EchoStar's AWS-4/H-block ($17B, 50 MHz S-band), AWS-3 unpaired ($2.6B), and up to 14 MHz of 800 MHz from Grain (~$8B). Cost to build: Mobile Experts ≥$100B, TD Cowen >$80B, Verizon's CEO $300–500B over 4–6 years; Big 3 spent ~$650B capex in the decade to 2023.", "angle": "Wide estimate range = the debate is about whether SpaceX builds or negotiates. New Street: wholesale deal is cheaper.", "tweetA": "Cost to build a US carrier: $80B (TD Cowen) to $500B (Verizon's CEO). Neither number includes the thing that actually matters: whether the customer pays. Spectrum is the cheap part.", "tweetB": "Axios's question was whether the network is a plan or a ruse to get carriers to the table. Three carriers already said no. The leverage play fails if no one believes the build.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-elons-can-you-hear-me-now-wireless"}, {"id": 19, "cat": "geopolitics", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "Musk spent ~$446M on midterms and lost almost everywhere, including Texas; FCC exposure in a new Washington", "idea": "Parekh: Musk spent ~$446M on the midterms and lost nearly everywhere, including Texas, home of SpaceX, Tesla and Terafab. SpaceX needs FCC approval for Grain spectrum, may pursue Boost, wants more satellite-to-phone spectrum. Congress can't control FCC directly but can hold hearings and demand documents. Amazon–Globalstar ($11.6B, April) and Apple's ~20% stake form a rival axis.", "angle": "Regulatory risk premium on the SpaceX IPO story; Boost deal needs AT&T/T-Mobile consent.", "tweetA": "$446M spent, lost almost everywhere including his own home state. Musk's political capital is the one asset on SpaceX's balance sheet that just marked down. FCC approval timelines now run through a hostile Congress.", "tweetB": "Amazon+Apple+Globalstar vs SpaceX vs the carrier JV. Direct-to-device is turning into three-way trench warfare and the spectrum owner wins. $AMZN $AAPL $ASTS", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-elons-can-you-hear-me-now-wireless"}, {"id": 20, "cat": "macro", "urgency": "deep", "source": "Natalie Brunell / Coin Stories (The News Block)", "title": "Jordi Visser: S&P 500's era of dominance ends because companies grow without going public", "idea": "Visser (per Brunell): the S&P's best era may be behind it, not because innovation slows but because more businesses can scale privately; tokenization could change how people invest. Also: Microsoft's leaner workforce, AI leading to higher corporate and lower worker taxes, Eli Lilly possibly the world's most valuable company. Nasdaq fell 5%+ and S&P 4%+ Thursday.", "angle": "Public-market index share shrinking is a structural argument for tokenized private equity.", "tweetA": "If the best companies stay private, the index you own is a leftover pool. S&P 500 as survivorship-biased remainder. Tokenized access to private equity is the arbitrage. $HOOD $COIN", "tweetB": "Visser's tax line: AI means higher taxes on corporates and lower on workers. If labor's share of taxable base shrinks, someone has to fill the hole. Capital gets the bill.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thenewsblock.substack.com/p/stock-market-crash-is-something-bigger"}, {"id": 21, "cat": "macro", "urgency": "deep", "source": "Natalie Brunell / Coin Stories (The News Block)", "title": "Darius Dale (42 Macro): cycle peak late 2027/early 2028, then a historic bear; data-center opposition could force earnings cuts", "idea": "Dale remains bullish for 3–12 months but sees a peak in late 2027 or early 2028, followed by a potentially historic bear market. Near-term risk: political opposition to AI data centers forcing Wall Street to lower earnings expectations. Recorded before the midterms; Thursday's selloff played out part of the thesis.", "angle": "A bull-until-2027 view that already sees data-center politics as the trigger — the thesis is moving faster than expected.", "tweetA": "Dale recorded this before the election: data-center opposition forces earnings cuts. Thursday it showed up in prices. His timeline was late 2027. The catalyst just arrived early.", "tweetB": "Bullish for 12 months, historic bear after. The hard part is that the first drawdown tells you nothing about which one you're in. Nasdaq -5% in a day looks identical either way.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thenewsblock.substack.com/p/stock-market-crash-is-something-bigger"}, {"id": 22, "cat": "crypto", "urgency": "deep", "source": "Natalie Brunell / Coin Stories (The News Block)", "title": "Lyn Alden: $1M BTC by 2030 needs an early fiscal crisis; 'treasury dilution' framework; Bitwise $1.6M by 2036, bear $130k", "idea": "Alden's treasury dilution: 5% Treasury yield vs 6% money-supply growth is a loss. Her base case is ~$1M BTC; reaching it by 2030 rather than 2036 requires a fiscal crisis sooner than she expects. Bitwise's 10-year forecast: $1.6M by 2036, bear case $130k, which both agree would mean something went badly wrong.", "angle": "A framework to explain why safe assets underperform money growth — fits gold and BTC alike.", "tweetA": "5% yield, 6% money growth. Your 'risk-free' asset is losing 1% a year to the denominator. That's the whole case for hard assets in one inequality, and it's why gold falling doesn't kill it. $BTC", "tweetB": "Bitwise bear case: $130k in 2036. Lyn says that would mean something went terribly wrong. When the floor of a forecast range is above today's price, the range is describing hope, not risk.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thenewsblock.substack.com/p/stock-market-crash-is-something-bigger"}, {"id": 23, "cat": "crypto", "urgency": "watch", "source": "Natalie Brunell / Coin Stories (The News Block)", "title": "Jordi Visser's tokenization thesis and the Bitcoin quantum debate", "idea": "Visser believes tokenization could fundamentally change investing and wealth building; he is frustrated with the Bitcoin–quantum computing debate. Also running his own business with AI agents.", "angle": "Tokenization narrative gets traction when public equities underperform private growth.", "tweetA": "Visser runs his own business with AI agents and thinks tokenization rewrites investing. One of those is already done. I'd watch the second one when private marks start to lag public prices.", "tweetB": "The quantum argument is the cleanest FUD-or-fatal debate in crypto: nobody can falsify it until it's too late. Risk-managed answer: size it like a tail, not a thesis. $BTC", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thenewsblock.substack.com/p/stock-market-crash-is-something-bigger"}, {"id": 24, "cat": "science", "urgency": "deep", "source": "SixSigmaCapital / SixSigmaResearch", "title": "TransMedics Q3: record $203M revenue (+41%), full-year guide raised to $764–774M; liver +39%, heart +26%, lung -25%", "idea": "Revenue exceeded $200M for the first time: $203.0M, +41.1% YoY (+34.6% organic). Liver $150.4M (+39%), heart $38.6M (+26%), lung $3.1M (-25%), despite a 6% decline in US deceased donor volume. Guide raised from $737–757M to $764–774M. TransMedics owns 22 aircraft and flew ~86% of NOP air missions on its own fleet.", "angle": "Share gain in a shrinking donor pool; vertically integrated logistics is the moat.", "tweetA": "Revenue +41% in a quarter where US deceased donor volume fell 6%. That's share gain in a shrinking pool — and it owns 22 aircraft to enforce it. $TMDX", "tweetB": "Lung revenue -25% while liver +39%. A fleet and a service model can't fix a product that isn't winning. The next leg isn't transplants, it's whether new indications open the lung market.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sixsigmaresearch.com/p/transmedics-group-inc-earnings-update-23d"}, {"id": 25, "cat": "science", "urgency": "deep", "source": "SixSigmaCapital / SixSigmaResearch", "title": "CHOPS as FDA-approved control arm: 2,000–5,000 incremental US heart/lung cases a year, trials from Q1 2027", "idea": "FDA approved TransMedics' own cold-preservation system CHOPS as the control arm for ENHANCE Heart Part B (~600 pts: 400 OCS/200 CHOPS) and DENOVO Lung (~450). Targets DBD hearts (~2,200 transplants in 2025) and ~3,500 lung transplants a year, most with no machine perfusion. Management sees 2,000–5,000 incremental cases; Q4 guide assumes zero trial revenue. CHOPS 510(k) decision targeted H2 2027.", "angle": "Both trial arms use its own devices: 'two shots on goal' and a lower-priced option.", "tweetA": "Smart trial design: make your own cheaper device the control arm. TransMedics wins either arm and gets a low-price SKU. Both arms of a pivotal trial are revenue.", "tweetB": "2,000–5,000 incremental cases a year on a base that was ~$760M of revenue. The Q1 2027 catalyst is priced as optionality; the IRB timelines are the actual gating item.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sixsigmaresearch.com/p/transmedics-group-inc-earnings-update-23d"}, {"id": 26, "cat": "science", "urgency": "watch", "source": "SixSigmaCapital / SixSigmaResearch", "title": "TransMedics' balance sheet: $351.5M HQ finance lease, OCF $77.8M vs $158.3M, adj. opex +47%", "idea": "Margin and cash flow are deteriorating even as revenue grows: adj. operating expenses +47% to $89.8M (R&D +91%), 9M operating cash flow $77.8M vs $158.3M a year ago, net income -30% YoY to $17.1M. Cash $493M vs $460M of 1.5% converts due 2028 plus $55M term loan, plus a $351.5M finance lease for the new Somerville HQ and $200–240M buildout capex through 2030.", "angle": "Growth at the cost of cash conversion; 2028 convert is the watch-date.", "tweetA": "Revenue +41%, net income -30%, operating cash flow halved. Funding a $350M headquarters lease and kidney, next-gen OCS, two trials simultaneously. The growth story is real. The balance sheet is the bet. $TMDX", "tweetB": "Cash $493M vs converts and loan of $515M. They're running at net-zero. One slip in the trials and the 2028 maturity wall becomes the story.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sixsigmaresearch.com/p/transmedics-group-inc-earnings-update-23d"}, {"id": 27, "cat": "science", "urgency": "watch", "source": "SixSigmaCapital / SixSigmaResearch", "title": "Kidney: ~21,000 US transplants a year, ~9,000 more kidneys go unused; CMS OPO rule and HHS plan target +2,000/yr", "idea": "OCS Kidney first-in-human H2 2027. About 21,000 deceased-donor kidneys are transplanted in the US each year, with ~9,000 unused in part due to prolonged ischemic time. HHS Kidney Care National Plan (October) targets ~2,000 more transplants a year; CMS final OPO rule (Oct 30) keeps performance tiers and lets OPOs hold multiple service areas.", "angle": "30% of recovered kidneys discarded is a logistics problem a machine and a plane can fix.", "tweetA": "9,000 kidneys a year are thrown away in the US, with 21,000 transplanted. A third of the supply, lost to clock time. That isn't biology, it's logistics. $TMDX", "tweetB": "The policy side is aligned too: HHS wants +2,000 kidney transplants a year and CMS keeps outcome-tier OPO scoring. Rare case where the regulator, the payer and the device company point the same way.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sixsigmaresearch.com/p/transmedics-group-inc-earnings-update-23d"}];

var catF='all',urgF='all',srcF=null;

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toggle(id){var e=document.getElementById('c'+id);e.classList.toggle('open');}
function setCat(c){catF=c;srcF=null;collapse();init();}
function setUrg(u){urgF=u;srcF=null;collapse();init();}
function filterBySrc(name){srcF=name;catF='all';urgF='all';init();var cs=document.querySelectorAll('.card');for(var i=0;i<cs.length;i++)cs[i].classList.add('open');}
function collapse(){var cs=document.querySelectorAll('.card');for(var i=0;i<cs.length;i++)cs[i].classList.remove('open');}
function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';

  var h='<span class="pill" onclick="setCat(\'all\')" style="'+(catF==='all'?'background:#333;color:#fff;border-color:#333':'')+'">All '+ITEMS.length+'</span>';

  document.getElementById('cats').innerHTML=h;
  var uc={act:0,deep:0,watch:0};ITEMS.forEach(function(i){uc[i.urgency]++;});
  var u=[['all','All'],['act','🔴 Act Now'],['deep','🔵 Deep'],['watch','🟡 Watch']];
  document.getElementById('urg').innerHTML=u.map(function(x){var n=x[0]==='all'?ITEMS.length:uc[x[0]];return '<span class="pill" onclick="setUrg(\''+x[0]+'\')" style="'+(urgF===x[0]?'background:#333;color:#fff;border-color:#333':'')+'">'+x[1]+' '+n+'</span>';}).join('');
  var out='';
  ITEMS.forEach(function(item){

    var c=COL[item.cat];

    out+='<div class="card" id="c'+item.id+'"><div class="hd" onclick="toggle('+item.id+')"><span class="num">'+item.id+'</span><span>'+UE[item.urgency]+'</span><span class="src" style="background:'+c+'">'+esc(item.source)+'</span><span class="tag">'+item.cat+'</span>'+(item.charts.desc?(item.charts.hot?'<span>🔥</span>':'<span>📊</span>'):'')+'<span class="ttl">'+esc(item.title)+'</span></div>'
    +'<div class="bd"><div class="lbl">THE IDEA</div><div>'+esc(item.idea)+'</div><div class="lbl">MY ANGLE</div><div class="angle" style="border-color:'+c+';background:'+c+'14">'+esc(item.angle)+'</div>'
    +'<div class="tw"><div><div class="lbl" style="color:#378add">TWEET A</div>'+esc(item.tweetA)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>'
    +'<div><div class="lbl" style="color:#7f77dd">TWEET B</div>'+esc(item.tweetB)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>'
    +ch+'<div style="margin-top:8px"><a href="'+item.link+'" target="_blank">↗ Read full article</a></div></div></div>';
  });
  document.getElementById('list').innerHTML=out;
  var names={};ITEMS.forEach(function(i){names[i.source]=1;});
  var r='<p>Window: '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</p><p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</p><p><b>Included sources</b> (click to filter):<br>';
  r+=Object.keys(names).map(function(n){var cnt=ITEMS.filter(function(i){return i.source===n;}).length;return '<span class="sl" onclick="filterBySrc(\''+n.replace(/'/g,"\\'")+'\')">'+esc(n)+'</span> ('+cnt+')';}).join('<br>')+'</p>';
  r+='<p><b>Skipped:</b><br>'+META.skippedSources.map(esc).join('<br>')+'</p>';
  document.getElementById('repb').innerHTML=r;
}
init();
