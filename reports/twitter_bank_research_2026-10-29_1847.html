<!DOCTYPE html>
<html lang="en">
<head>

<title>Twitter Bank Research</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DATA POINT TAGS */
.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "TWITTER BANK RESEARCH", "freshness_gate": "FRESHNESS GATE PASSED. (collected_at 2026-10-29T18:24:19+00:00, 0.4h old)", "collected_at": "2026-10-29T18:24:19Z", "window_days": 4, "input_stats": {"total_tweets": 120, "considered": 120, "kept": 17, "dropped": 103, "deduped": 0}, "summary": "Recurring themes: Fed hike path (BofA shifts to Dec/Mar hikes, Goldman expects Dec hike with possible March), Q3/Q4 GDP tracking (Goldman, Morgan Stanley), AI compute and moat commentary (Citadel, Apollo), equity positioning ahead of megacap earnings.\nPer-bank counts: BofA 5, Goldman 5, Apollo/Slok 2, Citadel 2, JPM 1, Morgan Stanley 1, SocGen 1.\n17 items kept from 120 tweets in the 4-day window; no duplicates found.", "by_bank_counts": {"BofA": 5, "Goldman": 5, "Apollo/Slok": 2, "Citadel": 2, "JPM": 1, "Morgan Stanley": 1, "SocGen": 1}, "banks": [{"bank": "BofA", "theme": "BofA — Fed call shifts to Dec/Mar hikes; Lagarde exit; tech P/E; Microsoft Azure results", "items": [{"author": "neilsethinew", "text": "After months of speculation that she would leave before her eight-year term ends in October 2027, European Central Bank President Christine Lagarde announced today that she will step down on February 7, 2027, just hours ahead of the Governing Council’s latest rate decision, according to Bloomberg. Hers is the third of the six Executive Board seats set to turn over by May.\n\nLagarde becomes only the second president in the ECB’s 28-year history to leave early, after Wim Duisenberg, whose shortened stint had been agreed in advance to break a France-Germany deadlock before the bank’s launch.\n\nLagarde, 70, told fellow policymakers she wanted “greater freedom to express her views” because she could not stay neutral on developments in France ahead of its April presidential election, the Financial Times reported. She has ruled out running herself and has been in talks to chair the World Economic Forum. In a video message, she said she leaves with “a sense of good work done, and an ECB that is fit for the future,” per Bloomberg.\n\nThree of the six Executive Board seats — the presidency, the chief economist and the markets portfolio — turn over by May. Isabel Schnabel is leaving a year early to join the International Monetary Fund and Philip Lane’s term expires in May, so governments will likely try to settle all three in one deal, with EU summits in November and December, per Bloomberg.\n\nFor the presidency, Spain is backing Pablo Hernández de Cos, general manager of the Bank for International Settlements and former Bank of Spain governor, while the Dutch government is backing former Dutch central bank chief Klaas Knot, the FT reported. Economists surveyed by Bloomberg in October see De Cos as the favorite. Knot built a reputation as a hawk during the eurozone debt crisis but has since softened into a pragmatist seen as responsive to bond-market stress, according to The Wall Street Journal, which also noted that an outsider can’t be ruled out given Lagarde herself was a last-minute pick in a 2019 package deal.\n\nThe timing also lets President Emmanuel Macron help pick Lagarde’s successor before his final term ends, with far-right candidate Marine Le Pen leading French polls, which risks accusations of political encroachment on the ECB’s independence, Bloomberg added. Banque de France’s governor also left early, with Macron naming his chief of staff, Emmanuel Moulin, to the post.\n\nThe news barely moved markets following the announcement. The euro was down 0.1% against the dollar at $1.114, per the FT, while the 10-year German Bund yield was 1 basis point lower at 3.36% and the French-German 10-year spread held at 154 basis points, according to Bloomberg. That spread recently hit its widest since 2011, and French long-term borrowing costs topped 5% last week for the first time since 2002 per the FT. Berenberg chief economist Holger Schmieding told the FT the departure doesn’t change the outlook for ECB policy or for how the bank handles French risks.", "tweet_url": "https://x.com/neilsethinew/status/2115784583866143062", "images": ["https://pbs.twimg.com/media/HVzGmRzW4AAoKAu.jpg"], "created_at": "2026-10-29T12:35:28.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "BofA: Change in Fed call: hikes in Dec ’26 and Mar ’27...  By going slower, the Fed risks having to hike more.\n\nMarkets are pricing in over an 80% chance of hikes in Dec ’26 and Mar ’27 https://t.co/fkZ7ltmX4A", "tweet_url": "https://x.com/MikeZaccardi/status/2115770246875189344", "images": ["https://pbs.twimg.com/media/HVy50_WWQAABvmJ.png"], "created_at": "2026-10-29T11:38:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Tech no longer boasts a premium P/E @soberlook https://t.co/EGLX7QmA3x\n\nBut is that bullish? $XLK https://t.co/kTpILwFmpl", "tweet_url": "https://x.com/MikeZaccardi/status/2115767731219751394", "images": ["https://pbs.twimg.com/media/HVy3ijcXwAAiYW_.jpg"], "created_at": "2026-10-29T11:28:30.000Z", "relayers": []}, {"author": "neilsethinew", "text": "I mentioned the October rate hike call from BofA was curious.  So where did they pivot to?\n\nBofA’s Bhave (senior US Economist) called it “a not-so-hawkish hold.” Warsh pointed to tighter financial conditions as a sign the September hike is working and wouldn’t lean into a December move, which BofA calls dovish since markets are pricing one.\n\nBofA’s rates strategist Mark Cabana says the bond market didn’t see Warsh as credible on inflation:\n\n▪ From the start of the press conference, the 2-year yield fell 6 bp and the 30-year rose 4 bp. That steepening was bigger than BofA’s 5–7 bp ballpark and not far from July’s 12.5 bp\n▪ The dollar fell 0.2%–0.3%, about half its July drop\n▪ December hike pricing slipped to 21 bp from 23 bp\n\nBofA now expects hikes in December and March, with its 4.25%–4.50% terminal rate unchanged. It warns the long end will “continue to haunt” the Fed until it gets more serious on inflation, and says the move raises the odds Treasury trims long-end auction sizes at the Nov. 4 refunding.", "tweet_url": "https://x.com/neilsethinew/status/2115755523396042807", "images": ["https://pbs.twimg.com/media/HVw4KvPXsAAZhLe.jpg"], "created_at": "2026-10-29T10:40:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Microsoft shares up around 2% after beating across the board and keeping cash flow in positive territory. \n\nFor the first time we also got Azure in dollars: $33.2B, up 48%, now its largest product line. That's vs. a 44%-45% company guide, ~45% consensus and a ~47% buy-side whisper (per MarketWatch), and up from 42% in the June quarter on the new, narrower definition.  \n\n▪️ Revenue $92.3B (+19%) vs. $90.7B est. (per TipRanks), $1.3B above the top of its own guide \n▪️ Adj. EPS $4.89 vs. $4.73 \n▪️ Microsoft Cloud $63.9B, growth accelerating to 30%; Microsoft 365 cloud $27.8B vs. $27.4B est. \n▪️ Operating margin 49.8%, up ~0.9 pt, even as gross margin slipped ~1.3 pts with depreciation up 44%; opex grew just 6% \n▪️ CapEx incl. finance leases $45.2B (+30%), ~$5B under StreetAccount's $50.7B, partly a shift away from leases; cash CapEx $39.4B, double a year ago \n▪️ Free cash flow $18.6B (−27%), still positive, while Alphabet burned $9B+ and Meta turned negative last week for the first time \n▪️ Commercial backlog $677B (+73% y/y) but flat vs. $678B in June \n▪️ Devices & Consumer $15.5B (−3%) but ahead of $15.05B est.; Windows OEM −22% on higher memory and storage costs (CNBC)  \n\nSo Azure supplied ~74% of the $14.6B revenue increase and is now 36% of sales vs. 29% a year ago. Ex-Azure, Microsoft grew ~7%.", "tweet_url": "https://x.com/neilsethinew/status/2115565291493068995", "images": ["https://pbs.twimg.com/media/HVv_SgRXMAA5CCU.jpg"], "created_at": "2026-10-28T22:04:05.000Z", "relayers": []}]}, {"bank": "Goldman", "theme": "Goldman — Q4 and Q3 GDP tracking, Fed hike path, FOMC recap, futures positioning", "items": [{"author": "neilsethinew", "text": "Goldman starts Q4 GDP tracking at +1.8%. https://t.co/inSsb5aTJY", "tweet_url": "https://x.com/neilsethinew/status/2115833321326297199", "images": ["https://pbs.twimg.com/media/HVzzJQNWwAAogzf.png"], "created_at": "2026-10-29T15:49:08.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman says they \"continue to expect a second and final hike in December. A third hike in March is also possible if inflation comes in higher than we expect.\" https://t.co/UCZon9aG0H", "tweet_url": "https://x.com/neilsethinew/status/2115775788310237534", "images": ["https://pbs.twimg.com/media/HVy-3aeXAAA3LQd.png"], "created_at": "2026-10-29T12:00:31.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: We Forecast Q3 GDP Growth of 3.3% Annualized, 0.1pp Above Consensus and in Line with GDPNow https://t.co/7VDHOvY7iG", "tweet_url": "https://x.com/MikeZaccardi/status/2115771505464299634", "images": ["https://pbs.twimg.com/media/HVy6-PVXsAEevJ9.png"], "created_at": "2026-10-29T11:43:30.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"Length remains elevated heading into more megacap tech results, and if Amazon, Microsoft, and Alphabet 'fail to impress, meaningful futures selling could ensue.\"\n\nRobert Quinn, GS via @neilsethinew https://t.co/44Lsm7m7B3", "tweet_url": "https://x.com/dailychartbook/status/2115730497363992875", "images": ["https://pbs.twimg.com/media/HVyVrRCXYAA6D3h.png"], "created_at": "2026-10-29T09:00:33.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS... October FOMC Recap: Sticking to an Every-Other-Meeting Pace.. Cook and Hammack Dissent Preferring a 25bp Hike... a summary https://t.co/zAA3OnoKg5", "tweet_url": "https://x.com/MikeZaccardi/status/2115585957508350035", "images": ["https://pbs.twimg.com/media/HVwSN6VW4AAMEGm.png"], "created_at": "2026-10-28T23:26:12.000Z", "relayers": []}]}, {"bank": "Apollo/Slok", "theme": "Apollo — AI-era moat framework; core PCE split between supply and demand", "items": [{"author": "MikeZaccardi", "text": "What makes an AI-era moat? Ask... \n1. Data: Do they own proprietary data?\n2. Workflow: Is it embedded in daily habits?\n3. Pricing Power: Can they raise prices without churn?\n\nA real moat always shows up in the numbers: retention, margins, and pricing power. T at Apollo https://t.co/h0yN2EfIaV", "tweet_url": "https://x.com/MikeZaccardi/status/2115758322737467415", "images": ["https://pbs.twimg.com/media/HVyu-60X0AAUipr.jpg"], "created_at": "2026-10-29T10:51:07.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"Data from the San Francisco Fed shows that core PCE inflation at 3% is split evenly between supply and demand ... That matters for the Fed, because interest rates can cool demand-driven inflation but do little about supply shocks.\"\n\n-Torsten Slok, Apollo https://t.co/CaGSbLjKr2", "tweet_url": "https://x.com/dailychartbook/status/2115690955781157219", "images": ["https://pbs.twimg.com/media/HVxxtmSW8AAktur.png"], "created_at": "2026-10-29T06:23:26.000Z", "relayers": []}]}, {"bank": "Citadel", "theme": "Citadel — GPU rental rates and open-weight model token share", "items": [{"author": "dailychartbook", "text": "\"GPU rental rates suggest that available compute capacity remains scarce: H100 rentals are up approximately 14% over six months and 7% over the last 30 days, while B200 rentals have risen 27.5% over six months, implying robust demand for compute.\"\n\n-Frank Flight, Citadel https://t.co/cM0LwHbW9E", "tweet_url": "https://x.com/dailychartbook/status/2115783259581817133", "images": ["https://pbs.twimg.com/media/HVzFqWAXUAEj594.jpg"], "created_at": "2026-10-29T12:30:13.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"Open-weight models now account for around 65-70% of smart routing token volume, potentially putting pressure on excess rents at the frontier as cheaper models become 'good enough' for a growing range of enterprise tasks\"\n\n-Frank Flight, Citadel https://t.co/hxKA3fX5PO", "tweet_url": "https://x.com/dailychartbook/status/2115775802075664839", "images": ["https://pbs.twimg.com/media/HVy-4S1WwAAdySE.jpg"], "created_at": "2026-10-29T12:00:35.000Z", "relayers": []}]}, {"bank": "JPM", "theme": "JPMorgan — 10yr yield vs equity multiple under above-trend EPS growth", "items": [{"author": "neilsethinew", "text": "From the @dailychartbook nightly email comes a JPMorgan chart via the great @LJKawa, with the accompanying note arguing that with above-trend EPS growth (~15% y/y), \"10yr yields can continue to rise to ~5% before the equity multiple starts to de-rate,\" and if strong growth projections are realized, equities \"should be able to withstand a 10yr yield level closer to ~5.5-6.0%.\"  \n\n2026 looks like it will easily land on the \"hyper-growth\" curve (>20% EPS growth), currently estimated at +32.8% per FactSet.  \n\nBut 2027 EPS growth is a different story currently estimated at +16% per FactSet. That puts it on the above-trend curve, where the note puts de-rating at ~5%. With the 10-yr at 5.04%, on 2027 earnings we're already at the edge of the tolerance, not 50-100 bp away from it.  \n\nThe bigger takeaway from JPM's chart though might be that at 5%, dropping one growth regime costs ~4 turns of P/E (about -17%), while another 100 bp within a regime costs just ~0.5 turn (my read of their curves). That argues for watching the E, not the yield.  \n\nBut does the multiple already discount it? FactSet's forward P/E is 18.7x, below its 5- and 10-yr averages, so it looks priced for above-trend, not hyper, growth.", "tweet_url": "https://x.com/neilsethinew/status/2115750490495410249", "images": ["https://pbs.twimg.com/media/HVxBskqWYAAQcXo.jpg"], "created_at": "2026-10-29T10:20:00.000Z", "relayers": []}]}, {"bank": "Morgan Stanley", "theme": "Morgan Stanley — Q3 GDP build, consumption-led", "items": [{"author": "neilsethinew", "text": "Morgan Stanley's US economists see a Q3 strong advance print this morning, tracking 3.1%, but say \"the main story\" is consumption, which they have growing 3.7% along with business investment. Trade and inventories are expected to be offsetting outliers in either direction.\n\nTheir Q3 build, contributions to growth in percentage points (Q2 in parentheses): \n▪️ Consumer spending +2.5 (+2.5) \n▪️ Business investment +1.5 (+1.3), growing 10.2% with equipment up 15% \n▪️ Inventories +1.7 (−0.5) \n▪️ Government +0.3 (0.0) \n▪️ Residential −0.2 (+0.1) \n▪️ Net exports −2.9 (−1.1), as imports \"offset part of the contribution from AI capital spending\"  \n\nThe caveat: MS says some of the consumer strength \"may be more statistical than real.\" Leftover seasonal patterns push inflation higher in the first quarter, which depresses real spending early in the year and flatters it later.  Their 3.7% Q3 after 3.8% in Q2 still works out to only 2.6% year over year, \"solid, but not exceptionally strong.\"", "tweet_url": "https://x.com/neilsethinew/status/2115765589780348952", "images": ["https://pbs.twimg.com/media/HVw6FTzW4AACjS7.jpg"], "created_at": "2026-10-29T11:20:00.000Z", "relayers": []}]}, {"bank": "SocGen", "theme": "SocGen — S&P single-stock pair correlations", "items": [{"author": "dailychartbook", "text": "\"There are 124,750 possible pairs of companies within the S&amp;P, and at present 40% are negatively correlated. That's a lot\"\n\nSocGen via @johnauthers https://t.co/r0JHEiWePZ", "tweet_url": "https://x.com/dailychartbook/status/2115738093252682153", "images": ["https://pbs.twimg.com/media/HVycladXwAELaFL.png"], "created_at": "2026-10-29T09:30:44.000Z", "relayers": []}]}]};

function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
