const META = {
  date: "2026-08-23",
  time: "15:06 CEST",
  windowStart: "2026-08-23 09:06 CEST",
  windowEnd: "2026-08-23 15:06 CEST",
  emailsInWindow: 13,
  emailsRead: 13,
  itemsExtracted: 19,
  includedSources: [
    { name: "Unchained (Arthur Hayes / Erik Voorhees)", count: 2 },
    { name: "Compounding Quality", count: 1 },
    { name: "MktContext", count: 1 },

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

const URG_META = {
  act: { emoji: "🔴", label: "Act Now" },
  deep: { emoji: "🔵", label: "Deep" },
  watch: { emoji: "🟡", label: "Watch" }
};

function buildFilterBars() {
  const catCounts = {};
  ITEMS.forEach(i => catCounts[i.cat] = (catCounts[i.cat] || 0) + 1);
  const catBar = document.getElementById("catBar");
  catBar.innerHTML = "";
  const allPill = el("div", "pill active", `All (${ITEMS.length})`);
  allPill.dataset.cat = "all";
  allPill.onclick = () => setCat("all");
  catBar.appendChild(allPill);
  Object.keys(catCounts).sort().forEach(cat => {
    const p = el("div", "pill", `${cat} (${catCounts[cat]})`);
    p.dataset.cat = cat;
    p.style.borderColor = CATCOLORS[cat] || "#999";
    p.onclick = () => setCat(cat);
    catBar.appendChild(p);
  });

  const urgCounts = {};
  ITEMS.forEach(i => urgCounts[i.urgency] = (urgCounts[i.urgency] || 0) + 1);
  const urgBar = document.getElementById("urgBar");
  urgBar.innerHTML = "";
  const allUrg = el("div", "pill active", `All (${ITEMS.length})`);
  allUrg.dataset.urg = "all";
  allUrg.onclick = () => setUrg("all");
  urgBar.appendChild(allUrg);
  ["act", "deep", "watch"].forEach(u => {
    if (!urgCounts[u]) return;
    const p = el("div", "pill", `${URG_META[u].emoji} ${URG_META[u].label} (${urgCounts[u]})`);
    p.dataset.urg = u;
    p.onclick = () => setUrg(u);
    urgBar.appendChild(p);
  });
}

function setCat(cat) {
  activeCat = cat;
  activeSrc = null;
  document.querySelectorAll("#catBar .pill").forEach(p => {
    const isActive = p.dataset.cat === cat;
    p.classList.toggle("active", isActive);
    if (isActive && cat !== "all") {
      p.style.background = CATCOLORS[cat] || "#666";
      p.style.color = "#fff";
    } else if (cat === "all" && isActive) {
      p.style.background = "#1a1a1a";
      p.style.color = "#fff";
    } else {
      p.style.background = "#fff";
      p.style.color = "#444";
    }
  });
  collapseAll();
  render();
}

function setUrg(u) {
  activeUrg = u;
  activeSrc = null;
  document.querySelectorAll("#urgBar .pill").forEach(p => {
    const isActive = p.dataset.urg === u;
    p.classList.toggle("active", isActive);
    p.style.background = isActive ? "#1a1a1a" : "#fff";
    p.style.color = isActive ? "#fff" : "#444";
  });
  collapseAll();
  render();
}

function collapseAll() {
  document.querySelectorAll(".card").forEach(c => c.classList.remove("open"));
}

function filterBySrc(name) {
  activeSrc = name;
  activeCat = "all";
  activeUrg = "all";
  document.querySelectorAll("#catBar .pill").forEach(p => {
    p.classList.toggle("active", p.dataset.cat === "all");
    p.style.background = p.dataset.cat === "all" ? "#1a1a1a" : "#fff";
    p.style.color = p.dataset.cat === "all" ? "#fff" : "#444";
  });
  document.querySelectorAll("#urgBar .pill").forEach(p => {
    p.classList.toggle("active", p.dataset.urg === "all");
    p.style.background = p.dataset.urg === "all" ? "#1a1a1a" : "#fff";
    p.style.color = p.dataset.urg === "all" ? "#fff" : "#444";
  });
  render();
  document.querySelectorAll(".card").forEach(c => {
    const id = parseInt(c.dataset.id, 10);
    const item = ITEMS.find(i => i.id === id);
    if (item && item.source.indexOf(name) !== -1) c.classList.add("open");
  });
  document.getElementById("cards").scrollIntoView({ behavior: "smooth" });
}

function toggleCard(id) {
  const card = document.querySelector('.card[data-id="' + id + '"]');
  if (card) card.classList.toggle("open");
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function render() {
  const container = document.getElementById("cards");
  container.innerHTML = "";
  let shown = 0;
  ITEMS.forEach(item => {
    const matchesCat = activeCat === "all" || item.cat === activeCat;
    const matchesUrg = activeUrg === "all" || item.urgency === activeUrg;
    const matchesSrc = !activeSrc || item.source.indexOf(activeSrc) !== -1;
    if (!matchesCat || !matchesUrg || !matchesSrc) return;
    shown++;
    const color = CATCOLORS[item.cat] || "#888";
    const card = el("div", "card");
    card.dataset.id = item.id;

    const header = el("div", "card-header");
    header.innerHTML =
      '<span class="idx">#' + item.id + '</span>' +
      '<span class="urg">' + URG_META[item.urgency].emoji + '</span>' +
      '<span class="src-badge" style="background:' + color + '">' + item.source + '</span>' +
      '<span class="cat-tag">' + item.cat + '</span>' +
      (item.charts.count > 0 || item.charts.desc ? '<span class="chart-flag">' + (item.charts.hot ? '🔥' : '📊') + '</span>' : '') +
      '<span class="title">' + item.title + '</span>';
    header.onclick = () => toggleCard(item.id);
    card.appendChild(header);

    const body = el("div", "card-body");

    body.appendChild(el("div", "label", "The Idea"));
    body.appendChild(el("div", "idea-text", item.idea));

    body.appendChild(el("div", "label", "My Angle"));
    const angleBox = el("div", "angle-box", item.angle);
    angleBox.style.borderLeftColor = color;
    angleBox.style.background = color + "14";
    body.appendChild(angleBox);

    const tweetsWrap = el("div", "tweets");

    const boxA = el("div", "tweet-box");
    boxA.innerHTML =
      '<div class="tweet-label-a">TWEET A</div>' +
      '<div class="tweet-text">' + item.tweetA + '</div>' +
      '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button>';
    tweetsWrap.appendChild(boxA);

    const boxB = el("div", "tweet-box");
    boxB.innerHTML =
      '<div class="tweet-label-b">TWEET B</div>' +
      '<div class="tweet-text">' + item.tweetB + '</div>' +
      '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button>';
    tweetsWrap.appendChild(boxB);

    body.appendChild(tweetsWrap);

    if (item.charts.count > 0 || item.charts.desc) {
      const chartsLine = el("div", "charts-line" + (item.charts.hot ? " hot" : ""), "Charts");
      body.appendChild(chartsLine);
      const ph = el("div", "chart-placeholder" + (item.charts.hot ? " hot" : ""), item.charts.desc || "Chart(s) referenced in article");
      body.appendChild(ph);
    }

    const linkLine = el("div", "link-line", '<a href="' + item.link + '" target="_blank">↗ Read full article</a>');
    body.appendChild(linkLine);

    card.appendChild(body);
    container.appendChild(card);
  });
  document.getElementById("emptyMsg").style.display = shown === 0 ? "block" : "none";
}

function buildReport() {
  const body = document.getElementById("reportBody");
  let html = '';
  html += '<h4>Time Window</h4>';
  html += '<div>' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</div>';
  html += '<h4>Coverage</h4>';
  html += '<div>' + META.emailsInWindow + ' emails in window · ' + META.emailsRead + ' read · ' + META.itemsExtracted + ' items extracted</div>';
  html += '<h4>Included Sources</h4>';
  META.includedSources.forEach(s => {
    html += '<div><span class="src-link" onclick="filterBySrc(\'' + s.name.replace(/'/g, "\\'") + '\')">' + s.name + '</span> — ' + s.count + ' item' + (s.count === 1 ? '' : 's') + '</div>';
  });
  html += '<h4>Skipped Sources</h4>';
  if (META.skippedSources.length === 0) {
    html += '<div>None — every email in the window was processed.</div>';
  } else {
    META.skippedSources.forEach(s => {
      html += '<div>' + s.name + ' — ' + s.reason + '</div>';
    });
  }
  body.innerHTML = html;

  document.getElementById("metaLine").textContent =
    META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources (window: ' + META.windowStart.split(' ')[1] + '–' + META.windowEnd.split(' ')[1] + ')';
}

document.getElementById("reportToggle").onclick = () => {
  const card = document.getElementById("reportCard");
  card.classList.toggle("open");
  document.getElementById("reportCaret").textContent = card.classList.contains("open") ? "▴" : "▾";
};

buildFilterBars();
buildReport();
render();
</script>
</body>
