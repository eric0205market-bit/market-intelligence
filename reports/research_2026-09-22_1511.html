const META = {
  date: "2026-09-22",
  time: "15:11 CEST",
  windowStart: "2026-09-22 09:11 CEST",
  windowEnd: "2026-09-22 15:11 CEST",
  emailsInWindow: 28,
  emailsRead: 28,
  itemsExtracted: 42,
  includedSources: [
    {name:"BowTiedBull", count:2},
    {name:"Dark Side of the Boom", count:5},
    {name:"Trading Mindset and Data (TMAD)", count:1},
    {name:"Hardfork (newsletter)", count:1},

    {name:"AI Supremacy (Michael Spencer)", count:2},

    {name:"MacroCharts", count:1},

  ],
  skippedSources: [

};

const CAT_COLORS = {
  "macro":"#e24b4a","credit":"#378add","positioning":"#ef9f27","AI/infra":"#1d9e75",
  "crypto":"#7f77dd","geopolitics":"#d85a30","energy":"#f97316","tech":"#06b6d4",
  "gold":"#d4a017","culture":"#ec4899","labor":"#8b5cf6","regulation":"#64748b",
  "science":"#14b8a6","venture":"#84cc16","commodities":"#a8763e"
};
const URG_LABEL = { act:"🔴 Act Now", deep:"🔵 Deep", watch:"🟡 Watch" };
const URG_EMOJI = { act:"🔴", deep:"🔵", watch:"🟡" };

let catFilter = "all";
let urgFilter = "all";
let srcFilter = null;

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function buildFilterBars(){
  const catCounts = {};
  ITEMS.forEach(i => { catCounts[i.cat] = (catCounts[i.cat]||0) + 1; });
  const catBar = document.getElementById("catFilterBar");
  let catHtml = '<button class="pill' + (catFilter==="all"?" active":"") + '" style="' + (catFilter==="all"?"background:#333;":"") + '" onclick="setCatFilter(\'all\')">All (' + ITEMS.length + ')</button>';
  Object.keys(catCounts).sort().forEach(function(cat){
    const color = CAT_COLORS[cat] || "#888";
    const active = catFilter === cat;
    catHtml += '<button class="pill' + (active?" active":"") + '" style="' + (active ? "background:" + color + ";border-color:" + color + ";" : "") + '" onclick="setCatFilter(\'' + cat + '\')">' + esc(cat) + ' (' + catCounts[cat] + ')</button>';
  });
  catBar.innerHTML = catHtml;

  const urgCounts = {act:0, deep:0, watch:0};
  ITEMS.forEach(i => { urgCounts[i.urgency] = (urgCounts[i.urgency]||0) + 1; });
  const urgBar = document.getElementById("urgFilterBar");
  let urgHtml = '<button class="pill' + (urgFilter==="all"?" active":"") + '" style="' + (urgFilter==="all"?"background:#333;":"") + '" onclick="setUrgFilter(\'all\')">All (' + ITEMS.length + ')</button>';
  Object.keys(URG_LABEL).forEach(function(u){
    const active = urgFilter === u;
    const color = u === "act" ? "#e24b4a" : (u === "deep" ? "#378add" : "#ef9f27");
    urgHtml += '<button class="pill' + (active?" active":"") + '" style="' + (active ? "background:" + color + ";border-color:" + color + ";" : "") + '" onclick="setUrgFilter(\'' + u + '\')">' + URG_LABEL[u] + ' (' + urgCounts[u] + ')</button>';
  });
  urgBar.innerHTML = urgHtml;
}

function setCatFilter(cat){
  catFilter = cat;
  srcFilter = null;
  renderCards();
  buildFilterBars();
}
function setUrgFilter(urg){
  urgFilter = urg;
  srcFilter = null;
  renderCards();
  buildFilterBars();
}
function filterBySrc(name){
  srcFilter = name;
  catFilter = "all";
  urgFilter = "all";
  renderCards();
  buildFilterBars();
  document.getElementById("cardsWrap").scrollIntoView({behavior:"smooth"});
}

function cardHtml(item, idx, forceExpand){
  const color = CAT_COLORS[item.cat] || "#888";
  let chartIcon = "";
  if(item.charts && item.charts.hot){ chartIcon = '<span class="charticon">🔥</span>'; }
  else if(item.charts && item.charts.count > 0){ chartIcon = '<span class="charticon">📊</span>'; }

  let chartsBoxClass = "charts-box" + (item.charts && item.charts.hot ? " hot" : "");
  let chartsLabel = (item.charts && item.charts.hot) ? "🔥 CHART WORTH SAVING — " : "📊 Charts — ";
  let chartsDesc = item.charts ? item.charts.desc : "";

  let html = '<div class="card' + (forceExpand ? " expanded" : "") + '" id="card-' + item.id + '">';
  html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
  html += '<span class="idx">' + String(idx+1).padStart(2,"0") + '</span>';
  html += '<span class="urgency">' + URG_EMOJI[item.urgency] + '</span>';
  html += '<span class="badge" style="background:' + color + '">' + esc(item.source) + '</span>';
  html += '<span class="cattag">' + esc(item.cat) + '</span>';
  html += chartIcon;
  html += '<span class="title">' + esc(item.title) + '</span>';
  html += '</div>';
  html += '<div class="card-body">';
  html += '<div class="section-label">The Idea</div><div class="idea">' + esc(item.idea) + '</div>';
  html += '<div class="section-label">My Angle</div><div class="angle" style="border-left-color:' + color + ';background:' + color + '12;">' + esc(item.angle) + '</div>';
  html += '<div class="tweets">';
  html += '<div class="tweet"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + esc(item.tweetA) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  html += '<div class="tweet"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + esc(item.tweetB) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
  html += '</div>';
  if(item.charts){
    html += '<div class="' + chartsBoxClass + '">' + chartsLabel + esc(chartsDesc) + '</div>';
  }
  html += '<a class="readlink" href="' + item.link + '" target="_blank" rel="noopener">↗ Read full article</a>';
  html += '</div></div>';
  return html;
}

function toggleCard(id){
  const el = document.getElementById("card-" + id);
  if(el){ el.classList.toggle("expanded"); }
}

function renderCards(){
  const wrap = document.getElementById("cardsWrap");
  let filtered = ITEMS.filter(function(i){
    if(catFilter !== "all" && i.cat !== catFilter) return false;
    if(urgFilter !== "all" && i.urgency !== urgFilter) return false;
    if(srcFilter && i.source.indexOf(srcFilter) === -1) return false;
    return true;
  });
  if(filtered.length === 0){
    wrap.innerHTML = '<div class="empty-msg">No items match this filter.</div>';
    return;
  }
  let html = "";
  filtered.forEach(function(item, idx){
    html += cardHtml(item, idx, !!srcFilter);
  });
  wrap.innerHTML = html;
}

function buildReport(){
  const el = document.getElementById("reportBody");
  let html = '<div><strong>Time window:</strong> ' + META.windowStart + ' &rarr; ' + META.windowEnd + '</div>';
  html += '<div style="margin-top:6px;"><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp;|&nbsp; <strong>Emails read:</strong> ' + META.emailsRead + ' &nbsp;|&nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</div>';
  html += '<div class="section-label" style="margin-top:14px;">Included Sources</div>';
  html += '<div class="srclist">';
  META.includedSources.forEach(function(s){
    html += '<div style="margin:4px 0;"><span onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + esc(s.name) + '</span> — ' + s.count + ' item' + (s.count===1?"":"s") + '</div>';
  });
  html += '</div>';
  html += '<div class="section-label" style="margin-top:14px;">Skipped Sources</div>';
  META.skippedSources.forEach(function(s){
    html += '<div style="margin:4px 0;">' + esc(s.name) + ' — <span style="color:var(--sub);">' + esc(s.reason) + '</span></div>';
  });
  el.innerHTML = html;
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function init(){
  document.getElementById("headerMeta").textContent = META.date + " · " + META.time + " · " + ITEMS.length + " items";
  buildFilterBars();
  renderCards();
  buildReport();
}
init();
</script>
