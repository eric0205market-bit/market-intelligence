<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-10-13T05:21:10Z", "input_stats": {"total_tweets": 247, "unique_authors": 71, "tweets_with_images": 38, "after_noise_filter": 81}, "summary": "**Korea / Semis:** KOSPI opened ugly and is **-35% from highs** (@Geiger_Capital); SMH had **five straight down days** (@Chartfest1). @aleabitoreddit blames a Bloomberg spin of Broadcom CEO Hock Tan's 'gamblers' remark (really a defense of OpenAI's fundamentals) and argues memory/optics demand is locked in through 2029–31; @MelMattison1 says the won, not AI fears, drove Korea and calls **EWY $160** attractive. @dylan522p: SemiAnalysis hired Korea analysts after the SK Hynix 2Q26 miss (OP W60.4tn, **8% below consensus**).\n\n**AI / Meta Muse Wonder:** Meta's new frontier model family drew praise from @hosseeb ('Meta is in second place'), @cryptopunk7213 and @munster_gene; **META +4% while Nasdaq -2%**. Munster argues personalized-agent lock-in boxes out Apple's Siri and smooths AI's move to paid usage.\n\n**Macro:** All eyes on **Wednesday CPI**: @spotgamma has SPX options pricing **~0.9%**, **7,700** pivot, VIX1D near record lows. Gold **$4,165.80** (-0.6%) and silver **$60.14** (-0.9%) slipped on dollar and oil (@Swedish_uranium); @_tolks flags DXY and oil as the best charts. @abcampbell: Goldman sees oil either **$50 or $150**.\n\n**Crypto:** Alt weakness and cabal-pump fallout (@_tolks short; @fejau_inc short); **Blur frontend shuts Nov 12** and @0xQuit/@mfigge urge revoking approvals on upgradable contracts; **Ledger supply chain compromised in Europe** (@punk6529, @stacy_muur); @Matt_Hougan bullish on NEAR (post-quantum keys live since July 20).\n\n**Notable:** @lopp rebuts 'ETF removes custody risk'; @garrytan tells founders to fund via profit not Series A; @zeroxkyle and @Evan_ss6 debate CT culture and whether the original crypto thesis 'played out'.", "sections": {"A_events": [{"cluster": "Meta Muse Wonder Launch — Frontier Model, META +4% While Nasdaq -2%", "category": ["AI", "tech"], "items": [{"author": "hosseeb", "summary": "Reacting to Meta's launch of the Muse Wonder model family: 'Suddenly Meta is in second place' on the leaderboard. Credits Zuckerberg and Alexandr Wang as believers from the beginning, calls the benchmarks super impressive, but notes there is no API pricing yet — it is only available inside Muse Code. Separately (later) he adds that LLMs had already killed TTS, STT and OCR by December when Opus 4.5 came out, pushing back on the idea that LLMs killed a given set of startups.", "tweet_url": "https://x.com/hosseeb/status/2109704603864572120", "images": ["https://pbs.twimg.com/media/HUc4CDebUAAcxTu.jpg"], "type": "tweet", "created_at": "2026-10-12T17:55:48.000Z"}, {"author": "cryptopunk7213", "summary": "Says Zuck's game 'needs to be studied': Meta was the biggest disappointment 1.5 years ago and now has a frontier model that (per his claim) beats Opus 5.5, Fable and Astra. The model is built for agentic work and for Muse, the personal agent. Highlights 'active memory' and 'active focus' as features that make it know the user better than any other model, and notes Muse re-reads everything overnight. Speculates about a Fable-size model post-trained on your whole social history and friendships.", "tweet_url": "https://x.com/cryptopunk7213/status/2109809556243288531", "images": ["https://pbs.twimg.com/media/HUeMjPraQAA8avo.jpg", "https://pbs.twimg.com/media/HUeMjRPbwAAe0rI.jpg"], "type": "tweet", "created_at": "2026-10-13T00:52:51.000Z"}, {"author": "munster_gene", "summary": "Two takes from Fathom's Apple episode. (1) Apple's AI risk is not the iPhone losing out but being boxed out of the services upside: if users lock into META Muse or SpaceX/xAI's Grokbot first, wiring their lives and workflows in and paying $20+/month, Siri will struggle to win them back. (2) Once people use personalized bots (Muse, Grok Bot, Dot) going back is painful, so the shift from AI's subsidy phase to paying phase should be smooth — 'just look at Search.' He ties this to META up 4% today while Nasdaq fell 2% on the Muse Wonder bot, which Meta will charge $20 or $100 a month for.", "tweet_url": ["https://x.com/munster_gene/status/2109712604302033153", "https://x.com/munster_gene/status/2109716546453205120"], "images": [], "type": "thread", "created_at": "2026-10-12T18:27:36.000Z"}, {"author": "mrjasonchoi", "summary": "Joked two years ago that AI accurately judging a BJJ match would equal AGI; now Zuckerberg is using Muse to train MMA (quoting the Cheeky Pint episode with Zuckerberg and Alexandr Wang on how frontier models are built).", "tweet_url": "https://x.com/mrjasonchoi/status/2109849250305917117", "images": [], "type": "tweet", "created_at": "2026-10-13T03:30:35.000Z"}, {"author": "Geiger_Capital", "summary": "Sarcastic model-name pile-up: 'Have you tried Claude Opus 5.5? Sonnet 5.5? Fable 5.1? Muse Wonder? Muse Wonder Full? GPT-6 Astra? GPT-6.1 Sol? Grok 4.7? Gemini 4 Argon?' — a comment on release-cadence fatigue.", "tweet_url": "https://x.com/Geiger_Capital/status/2109787265111363854", "images": ["https://pbs.twimg.com/media/HUdw6MuWIAAfM0L.jpg"], "type": "tweet", "created_at": "2026-10-12T23:24:16.000Z"}, {"author": "udiWertheimer", "summary": "Quote-tweet to Alexandr Wang ('sir i tried to warn') on a post saying training Astra on Blender use is a marketing coup — visually more impressive than benchmarks or coding agents even though unnecessary for 99.999% of people.", "tweet_url": "https://x.com/udiWertheimer/status/2109734022679347325", "images": [], "type": "tweet", "created_at": "2026-10-12T19:52:42.000Z"}]}, {"cluster": "Korea Equity Rout — KOSPI Open, SK Hynix/Samsung Crash and the AVGO 'Gamblers' Comment", "category": ["tech", "macro", "EM"], "items": [{"author": "aleabitoreddit", "summary": "Laments the Korean market crash in $SKHY/Samsung and blames Broadcom CEO Hock Tan's remarks as spun by Bloomberg: the framing was that AVGO's CEO called AI investors gamblers and said enterprise AI isn't delivering ROI. After reading further, he says the actual quote was that the market misread OpenAI because its fundamentals are strong, and that investors selling on one short-term data point are no different from casino gamblers — i.e. pushback on negative OpenAI-revenue readings, not an attack on AI investing. Calls the Bloomberg spin garbage. Three images attached (screenshots of the coverage).", "tweet_url": "https://x.com/aleabitoreddit/status/2109852646484201736", "images": ["https://pbs.twimg.com/media/HUezzMeaYAAKmMS.jpg", "https://pbs.twimg.com/media/HUe8Gela4AAl3UT.jpg", "https://pbs.twimg.com/media/HUe8SGtaEAA7tW8.jpg"], "type": "tweet", "created_at": "2026-10-13T03:44:04.000Z"}, {"author": "Geiger_Capital", "summary": "Chart of the South Korean stock market: down -35% from the highs — 'No, this isn't a crypto meme coin.'", "tweet_url": "https://x.com/Geiger_Capital/status/2109816409630933498", "images": ["https://pbs.twimg.com/media/HUeS1_pXsAADmd_.jpg"], "type": "tweet", "created_at": "2026-10-13T01:20:05.000Z"}, {"author": "dgt10011", "summary": "'That's an ugly Kospi open' (with a Korean-language joke about graduating from stocks and enrolling in bitcoin).", "tweet_url": "https://x.com/dgt10011/status/2109808222429134906", "images": [], "type": "tweet", "created_at": "2026-10-13T00:47:33.000Z"}, {"author": "MelMattison1", "summary": "Counter-read: Korea has been weak because of the currency move, not AI fears. USD may have just put in a short-term double bottom against the won; says $EWY at $160 looks good to him (chart attached).", "tweet_url": "https://x.com/MelMattison1/status/2109862822670712953", "images": ["https://pbs.twimg.com/media/HUe9DnMXgAAvwuq.jpg"], "type": "tweet", "created_at": "2026-10-13T04:24:30.000Z"}, {"author": "zeroxkyle", "summary": "Chart post with 'give the koreans a break…' on the sell-off.", "tweet_url": "https://x.com/zeroxkyle/status/2109811497170080150", "images": [], "type": "tweet", "created_at": "2026-10-13T01:00:33.000Z"}, {"author": "dylan522p", "summary": "On the SK Hynix 2Q26 miss (KIS analyst Minsook Chae previewed OP at W60.4tn, 8% below W65tn consensus): says Chae is the better analyst because she called the Hynix miss and has now joined SemiAnalysis. Follow-up: 'We were wrong so we hired her and a few others. We have 5 people in Korea. Will take down TrendForce and other research houses there.'", "tweet_url": ["https://x.com/dylan522p/status/2109683297777533406", "https://x.com/dylan522p/status/2109826089942212613"], "images": [], "type": "tweet", "created_at": "2026-10-12T16:31:08.000Z"}]}, {"cluster": "Semis Under Pressure — Five Down Days in SMH, Rotation to 'Safety' Names", "category": ["tech", "positioning"], "items": [{"author": "Chartfest1", "summary": "Five straight down days in SMH and 'no one likes the semis anymore.' Separately notes exactly one stock made a new high while he was away — TEVA, not a tech name — and that the long new-low list will produce many 4Q tax-loss-selling candidates.", "tweet_url": "https://x.com/Chartfest1/status/2109736815225647170", "images": [], "type": "tweet", "created_at": "2026-10-12T20:03:48.000Z"}, {"author": "dampedspring", "summary": "Asks why $CBRS is down 21% from its IPO price (aleabitoreddit separately flags OpenAI's contractual backlog with CBRS, MSFT, ORCL as a risk he has been raising).", "tweet_url": "https://x.com/dampedspring/status/2109751259075158275", "images": [], "type": "tweet", "created_at": "2026-10-12T21:01:12.000Z"}, {"author": "AndreasSteno", "summary": "Quips 'a bubble in bubble calling?' on the past five days of Bloomberg headlines — a nod to the media-driven AI-bubble narrative behind the semis sell-off.", "tweet_url": "https://x.com/AndreasSteno/status/2109734788924162483", "images": [], "type": "tweet", "created_at": "2026-10-12T19:55:45.000Z"}]}, {"cluster": "Blur Frontend Shutdown (Nov 12) — Upgradable Contracts and Open Approvals", "category": ["crypto", "regulation"], "items": [{"author": "0xQuit", "summary": "After Blur announced its frontend will be deprecated on November 12, 2026 (protocol stays on-chain; $BLUR keeps control of the fee switch), 0xQuit warns holders to revoke approvals now. He found no exploits in current Blur contracts, but they are upgradable and could turn malicious at any time; eight figures of NFTs are currently approved to them and safety hinges on the opsec of a team that appears to be disbanding. Cites last month's Magic Eden contract exploit, where he helped rescue a good portion of the funds. Elsewhere he notes Blur never turned on fees, 'which means they just killed NFTs for the love of the game' (while acknowledging the Blast launch and airdrop paid off), and that the Blur team promised him an API since day one but is shutting down without launching one.", "tweet_url": "https://x.com/0xQuit/status/2109741427408453921", "images": ["https://pbs.twimg.com/tweet_video_thumb/HUdPt9nbcAAsGdM.jpg"], "type": "thread", "created_at": "2026-10-12T20:22:08.000Z"}, {"author": "mfigge", "summary": "Amplifies the revoke-approvals warning because of Blur's upgradable contracts; separately points holders with active Blend loans backed by BAYC, MAYC, BAKC or Otherdeeds to GrailsOTC, which is working with Gondi on refinancing and migration ahead of the shutdown.", "tweet_url": ["https://x.com/mfigge/status/2109746828086546564", "https://x.com/mfigge/status/2109791263788761475"], "images": [], "type": "tweet", "created_at": "2026-10-12T20:43:35.000Z"}, {"author": "CirrusNFT", "summary": "Recalls beta testing a Blur-branded version of an Axiom/Photon-style trading terminal about a year ago with Pacman — felt like he was about to do to trading terminals what he did to OpenSea — strange that it never launched. Earlier quipped that the announcement and charts are a good reason to be back on Maplestory.", "tweet_url": "https://x.com/CirrusNFT/status/2109786351055122772", "images": [], "type": "tweet", "created_at": "2026-10-12T23:20:38.000Z"}]}, {"cluster": "Ledger Supply-Chain Compromise in Europe and the AI-Exploit Debate", "category": ["crypto"], "items": [{"author": "stacy_muur", "summary": "First reacts to the confirmed compromise of Ledger's supply chain in Europe (a buyer opened a second device from a different Mediamarkt store on video and found tampering): 'Buy from the official store → data leaked. Buy from an official reseller → funds drained. Where are we supposed to store crypto now?' Later, replying to Avalanche's Emin Gün Sirer (AI will exploit bugs in wallets, libraries and system code to steal billions long before ECDSA breaks): such attacks already happen without AI (Kelp DAO, Ledger Connect Kit, Drift) via social engineering or infrastructure failures, and AI should be put to work on defense too.", "tweet_url": ["https://x.com/stacy_muur/status/2109693078340800763", "https://x.com/stacy_muur/status/2109873936553152694"], "images": [], "type": "tweet", "created_at": "2026-10-12T17:10:00.000Z"}, {"author": "punk6529", "summary": "Reacts 'FFS' to the Ledger supply-chain compromise report, which called for an immediate product recall. Separately predicts AI agents will solve crypto's usability problem next year.", "tweet_url": "https://x.com/punk6529/status/2109717761114927484", "images": [], "type": "tweet", "created_at": "2026-10-12T18:48:05.000Z"}, {"author": "stonecoldpat0", "summary": "On AI finding bugs: it creates a dilemma for bug-bounty programs — rewards must both attract researchers and favor honest disclosure over exploitation, and pointing agents at code changes the incentive for real laborious human work; unclear how bounties should adjust. Also compares the pitch for hardware-wallet replacement to the 2015 'ice age is over' campaign claiming multisig would end the need for hardware wallets.", "tweet_url": ["https://x.com/stonecoldpat0/status/2109828158686216543", "https://x.com/stonecoldpat0/status/2109832527313764850", "https://x.com/stonecoldpat0/status/2109848089767071941"], "images": [], "type": "tweet", "created_at": "2026-10-13T02:06:46.000Z"}]}, {"cluster": "Crypto Tape — Alt Bleed, 'Cabal' Pump Fallout and BTC Dominance", "category": ["crypto", "positioning"], "items": [{"author": "_tolks", "summary": "Over the weekend: says he shorted across the board after catching up, citing a prominent account's bullishness as confidence; argues 'onchain died' and degens pivoted to bundled perps on the lowest-market-cap scam coins (calls out W, TIA, STRK pumps on an illiquid Sunday: 'can we wait until BTC is 100k+ to do things this silly?'). He is positioned for the alt complex to get 'decimated before things start going up again'. Notes two of the best charts across the investable universe are DXY and oil, with BTC dominance a third — all '#notgreat'. Points to two Fridays ago, when 14 straight red 15-min candles printed while equities made new highs, as a tell that a highly motivated seller wanted out. Also posts a chart pair asking what's next on a key level (~750) where 'sellers have infinite tokens' and breaches close back below.", "tweet_url": ["https://x.com/_tolks/status/2109693516926611770", "https://x.com/_tolks/status/2109694201273192471", "https://x.com/_tolks/status/2109723337429565927", "https://x.com/_tolks/status/2109753007147544993", "https://x.com/_tolks/status/2109763546825572420"], "images": ["https://pbs.twimg.com/media/HUci7DcWgAE5ucV.jpg", "https://pbs.twimg.com/media/HUc-HDRXIAAk4wC.jpg", "https://pbs.twimg.com/media/HUdAf82XsAAjwY7.jpg"], "type": "thread", "created_at": "2026-10-12T17:11:45.000Z"}, {"author": "Evan_ss6", "summary": "Goodnight post with AI-quant charts: a key level 'prob holds 2nd time, breaks 3rd/4th time, after CPI', but Asia looks like 'the logical opposite of a honeypot'. To a perps trader he adds that perp shorts 'gotta cover, range lows logical spot'. Earlier jokes that only people with $10M+ in perps profits should weigh in on his timeline.", "tweet_url": "https://x.com/Evan_ss6/status/2109810613798969844", "images": ["https://pbs.twimg.com/media/HUeM5qUXAAAe43d.jpg", "https://pbs.twimg.com/media/HUeQ4XfWUAAcqHM.jpg"], "type": "tweet", "created_at": "2026-10-13T00:57:03.000Z"}, {"author": "fejau_inc", "summary": "Says plainly he is short right now and will flip opinions without notice if that changes. Elsewhere: 'The industry you grew up in no longer exists' (reacting to $400M of crypto at a private pump.fun party) and that he doesn't think the whole space is uninvestable.", "tweet_url": "https://x.com/fejau_inc/status/2109791439278465391", "images": [], "type": "tweet", "created_at": "2026-10-12T23:40:51.000Z"}, {"author": "DonAlt", "summary": "Dismissive of memecoin launchers complaining about red candles ('If you didn't wanna see red candles maybe you shouldn't have launched a shitcoin'), and notes his paid content would only return if free for those with less.", "tweet_url": "https://x.com/DonAlt/status/2109839095400898820", "images": [], "type": "tweet", "created_at": "2026-10-13T02:50:13.000Z"}, {"author": "zeroxkyle", "summary": "Claims the highest-signal voices on the cycle, and bitcoin in particular, are Chinese and HK funds who actually create the bottom — quoting a 'Are we bottomed? — Higher.' exchange.", "tweet_url": "https://x.com/zeroxkyle/status/2109824850135245268", "images": [], "type": "tweet", "created_at": "2026-10-13T01:53:37.000Z"}]}, {"cluster": "Oct 14 CPI Setup — Options Pricing, Metals Pressured by Dollar and Oil", "category": ["macro", "energy"], "items": [{"author": "spotgamma", "summary": "CPI lands Wednesday 8:30am ET; SPX options price a ~0.9% move through Wednesday expiration. Positive dealer gamma could keep volatility quiet with 7,700 the key risk pivot. VIX 1-Day is just off all-time lows as short-dated vol died; 5-day forward SPY returns from similar VIX1D lows skew mildly negative ('nothing really happens'), but he expects CPI to cause something (chart attached).", "tweet_url": ["https://x.com/spotgamma/status/2109768737070919856", "https://x.com/spotgamma/status/2109789176954597621"], "images": ["https://pbs.twimg.com/media/HUd5pRtW0AAe_z9.jpg"], "type": "tweet", "created_at": "2026-10-12T22:10:39.000Z"}, {"author": "Swedish_uranium", "summary": "Oct 12 daily metals pulse: firmer dollar and rising oil pressured precious metals. COMEX gold settled $4,165.80/oz (-0.6%); NY silver ~$60.14/oz (-0.9%) as energy-inflation concerns weigh; focus on whether they find support before Wednesday's CPI, then PPI and retail sales Thursday. US copper inventories ~1.1 million tonnes after tariff-premium inflows. Urenco USA's sixth new enrichment cascade is in production; the eight-cascade expansion is 75% complete, last due spring 2027.", "tweet_url": "https://x.com/Swedish_uranium/status/2109746501081497717", "images": [], "type": "tweet", "created_at": "2026-10-12T20:42:17.000Z"}, {"author": "qthomp", "summary": "Says two prediction-market outcomes (shown in attached charts) are 'too cheap' with 2+ weeks to the FOMC.", "tweet_url": "https://x.com/qthomp/status/2109711011242561538", "images": ["https://pbs.twimg.com/media/HUcyhZEWoAAWglG.png", "https://pbs.twimg.com/media/HUcyro4X0AAtwdT.png"], "type": "tweet", "created_at": "2026-10-12T18:21:16.000Z"}, {"author": "Delphi_Digital", "summary": "Delphi's market strategist Scott Freeman argues a less transparent Fed could keep the stock rally going: before 1994 the Fed was opaque, since then there has been an era of transparency in which people front-run announcements, and 'you can make an argument that Warsh is probably in the former camp now.'", "tweet_url": "https://x.com/Delphi_Digital/status/2109750961342132242", "images": [], "type": "tweet", "created_at": "2026-10-12T21:00:01.000Z"}, {"author": "MelMattison1", "summary": "/NQ checking back to levels last seen a couple weeks ago with buyers stepping in; his guess is a shakeout ahead of earnings and CPI that will look like a buying opportunity by end of week (chart attached).", "tweet_url": "https://x.com/MelMattison1/status/2109857322264834518", "images": ["https://pbs.twimg.com/media/HUe4DYbXAAANTR3.jpg"], "type": "tweet", "created_at": "2026-10-13T04:02:39.000Z"}]}, {"cluster": "Iran — Goldman 'Oil $50 or $150' and US Strategic Asphyxiation", "category": ["energy", "geopolitics"], "items": [{"author": "abcampbell", "summary": "Highlights Goldman's oil view framed as a binary — oil will be either $50 or $150 — with a chart deck in the thread (tagged #iran).", "tweet_url": "https://x.com/abcampbell/status/2109705166631141865", "images": [], "type": "tweet", "created_at": "2026-10-12T17:58:02.000Z"}, {"author": "zriboua", "summary": "Her latest piece, 'Strategic Asphyxiation: The U.S. Approach to Iran', lays out a four-part pressure strategy: economic constriction (oil exports, trade, sanctions evasion), network disruption (IRGC finance, procurement, shipping), industrial degradation (strikes on missile and drone production) and regional attrition (weakening proxies in Iraq, Yemen, Lebanon). Argues sustained pressure eventually forces Tehran to choose between revolutionary ambitions and an unbearable cost.", "tweet_url": "https://x.com/zriboua/status/2109770636218261895", "images": [], "type": "tweet", "created_at": "2026-10-12T22:18:11.000Z"}]}, {"cluster": "Startup Funding Debate — Profitability vs. the Series A/B Crunch, Pro Rata", "category": ["tech", "positioning"], "items": [{"author": "garrytan", "summary": "Responding to a thread on how Series A/B is the hardest round for vertical AI SaaS companies, tells founders to be profitable and run with maximal agentic loops: $10M of annual profit reinvested is 'like an annual Series A with no dilution' and 'nobody is coming to save you.' Later endorses pro rata as powerful for investors (replying to a post on his first fund returning 55x, with Coinbase pro rata mattering).", "tweet_url": ["https://x.com/garrytan/status/2109748677464277437", "https://x.com/garrytan/status/2109847735449047295"], "images": [], "type": "tweet", "created_at": "2026-10-12T20:50:56.000Z"}, {"author": "EMostaque", "summary": "Tempted to run a bonded curve for the next round — price SAFEs along a curve so each purchase moves the price up for the next buyer, with no pro rata needed. Also says models going via code to compile as they scale makes no sense, and 'just-in-time software' will be wild as models etch to silicon and run 100x faster.", "tweet_url": "https://x.com/EMostaque/status/2109789779973787916", "images": [], "type": "tweet", "created_at": "2026-10-12T23:34:16.000Z"}, {"author": "jonchu", "summary": "Replying to a16z's Adam Gartenberg: if the funding conditions are as described, 'nobody is investing'.", "tweet_url": "https://x.com/jonchu/status/2109823288130379881", "images": [], "type": "tweet", "created_at": "2026-10-13T01:47:25.000Z"}, {"author": "andrewchen", "summary": "a16z speedrun SR008 applications are open through Nov 1, 2026 (residency Feb 1–Apr 16, 2027, new SF office): up to $1M investment plus $10M+ credits, exec network and talent pool.", "tweet_url": ["https://x.com/andrewchen/status/2109688038599299501", "https://x.com/andrewchen/status/2109729825237966924"], "images": ["https://pbs.twimg.com/media/HUcgwi1asAASlX0.jpg"], "type": "tweet", "created_at": "2026-10-12T16:49:59.000Z"}, {"author": "buccocapital", "summary": "Reaction to Airtable laying off a large part of its team in favor of 'small teams ship more and better' — one-line 'Get bent'.", "tweet_url": "https://x.com/buccocapital/status/2109739320869347685", "images": [], "type": "tweet", "created_at": "2026-10-12T20:13:45.000Z"}]}], "B_insights": [{"author": "aleabitoreddit", "summary": "Long market-structure thread on AI supply chains after the sell-off. Memory: demand visibility at MU/Samsung/SK Hynix extends into 2030–31; Samsung reportedly has LTAs on ~70% of capacity into 2031, likely with SK Hynix-style price floors; consensus is the 2027 shortage is worse than 2026 and SNDK gross margins could exceed 80%. Near-term IV collapsed across EWY/DRAM/MU, nuking call holders, but a sustained crash looks hard with 5-year LTAs and floors. Optics: LITE sold out into 2029 and negotiating 2030; Greensboro 2028 expansion (~$5B of UHP laser revenue) is largely allocated to NVDA (50%+); bottlenecks run from DSPs/TIAs/photodiodes to InP/SOI substrates, which benefits smaller players like AAOI, SIVE, MTSI. He thought LITE overvalued at $100B+ relative to smaller optical names and positioned accordingly. Leaders look happy: NVDA ~70% forward revenue growth FY2028, Broadcom ~100% Y/Y 2027/28 (both supply-constrained), Marvell guiding FY2031 to $70–90B vs $46B projected. Not all supply-chain names benefit equally: HBM, laser, CPU, MLCC are 'printing money', test names less so. Capex-heavy IREN ($25–30B for 2027) fell despite its Anthropic deal and he thinks financing (half through a $6B ATM) is under-appreciated, hoping NBIS-style rerating follows once capex/ATM windows pass. Rotation into CRWD/PLTR looks 'clown level' vs undervalued AI supply names; FT piece renewed worries on frontier-lab commitments but OpenAI just raised ~$122B. TLDR: memory has the best risk-adjusted return, optical supercycle 2027–28 (CPO/NPO) will look absurd relative to smaller-supplier capacity, and markets sell baskets together, creating mispricings. In the follow-up he rebuts the China-oversupply narrative: Chinese pluggable makers like Innolight remain bottlenecked at 70–100mW, UHP lasers needed for CPO are far from scalable in China, suppliers are raising ASPs, and AAOI/Lumentum CEOs say they see no China impact.", "tweet_url": "https://x.com/aleabitoreddit/status/2109789664622322081", "images": [], "type": "thread", "created_at": "2026-10-12T23:33:48.000Z", "category": "tech"}, {"author": "Evan_ss6", "summary": "Thread reacting to a viral post that the crypto world people grew up in is mostly gone: the new generation sees it as a video game where the goal is maximum money and clout, whereas the older generation, while also money-motivated, cared about decentralized finance. He argues one can say crypto is dead or that it has played out — when he got involved it was 1000x+ asymmetric if right; BTC became a global store of value and Ethereum/DeFi rearchitected finance, 'albeit in less than ideal ways'.", "tweet_url": "https://x.com/Evan_ss6/status/2109831375306068083", "images": [], "type": "thread", "created_at": "2026-10-13T02:19:33.000Z", "category": "crypto"}, {"author": "zeroxkyle", "summary": "Critique of CT culture: a majority has drifted into reactivity over constructiveness and pure cynicism, normalizing the low-trust, nihilistic environment it criticizes. Unhinged personas work for engagement but 'literally work badly' everywhere else; he says he went through that phase, found it made him more cynical without making him sharper, and recommends being a perpetual optimist. Chart attached.", "tweet_url": "https://x.com/zeroxkyle/status/2109814973488869498", "images": ["https://pbs.twimg.com/media/HUePs32bMAAoibr.png"], "type": "tweet", "created_at": "2026-10-13T01:14:22.000Z", "category": "society"}, {"author": "lopp", "summary": "Argues against 'just switch to an ETF so you can't lose your BTC': no loss can be solved by handing bitcoin to a third party, who inherits every self-custody risk plus more; bankruptcy-remote segregation is useless if the asset is lost. Notes ETFs haven't existed long enough for a catastrophe, nearly all use the same custodian (concentrated vs distributed risk), custodian insurance covers only a tiny share of AUM (Grok summary attached), and points to disputed 'never lost coins' claims in Coinbase hack cover-up allegations. Says many people just aren't willing to put in effort for robust self-custody, which Casa services reduce.", "tweet_url": ["https://x.com/lopp/status/2109693633959961037", "https://x.com/lopp/status/2109714647381389559"], "images": ["https://pbs.twimg.com/tweet_video_thumb/HUc8xs6XQAAIY1W.jpg", "https://pbs.twimg.com/media/HUc12rQWQAAO2jI.png"], "type": "thread", "created_at": "2026-10-12T17:12:13.000Z", "category": "crypto"}, {"author": "Matt_Hougan", "summary": "Bullish on NEAR: 'Many projects get less interesting the deeper you dig; NEAR is the opposite.' Cites Illia on NEAR having post-quantum account keys on mainnet since July 20, and agrees with the framing that Bitwise's base-case target implies ~40x by 2030 from ~$5 — still less than Ethereum is worth today — 'No, it is not absurd.' (Bitwise-affiliated.)", "tweet_url": ["https://x.com/Matt_Hougan/status/2109696644635931028", "https://x.com/Matt_Hougan/status/2109757689995862056"], "images": [], "type": "tweet", "created_at": "2026-10-12T17:24:11.000Z", "category": "crypto"}, {"author": "0xJeff", "summary": "Lists 'inference teams worth watching this cycle' in onchain/decentralized AI inference: actual computer (SN95), antseed, blockrun, chutes (SN64), darkbloom, dolphin ai, engy (SN53), gm (SN28), morpheus, orbio, surplus intelligence, usepod, venice ai, warden/holo. Quoted data: 5x growth in tokens/day over 3 months; Surplus from 10B in August to 200B/day in October; Engy back near ATH (30B+/day); AntSeed 2x in a few days. Also clarifies the figures are sourced from projects' own sites.", "tweet_url": "https://x.com/0xJeff/status/2109859047466029281", "images": [], "type": "tweet", "created_at": "2026-10-13T04:09:30.000Z", "category": "AI"}, {"author": "sjdedic", "summary": "Asks why almost nobody discusses Arcium despite hype for privacy and AI: sits at the intersection of encrypted finance and confidential AI, two multi-trillion markets, yet trades 'like nobody knows it exists'.", "tweet_url": "https://x.com/sjdedic/status/2109720484887588966", "images": [], "type": "tweet", "created_at": "2026-10-12T18:58:54.000Z", "category": "crypto"}, {"author": "Zeneca", "summary": "Bullish on $BAT: old coins returning, roadmap 4.0 planning token buybacks, new revenue streams, rising privacy mindshare, 200k+ on the card waitlist, embracing AI. In replies he says buyback mechanics aren't fully known; he expects funding from card, wallet/swap revenue, bull case being a share of other revenue plus converting 100M+ MAUs into the new products. Image attached.", "tweet_url": "https://x.com/Zeneca/status/2109858062714745103", "images": ["https://pbs.twimg.com/media/HUfEw88bwAAPAPi.jpg"], "type": "tweet", "created_at": "2026-10-13T04:05:36.000Z", "category": "crypto"}, {"author": "ASvanevik", "summary": "'The most surprising thing about AI is how little people use it' — intelligence is dirt cheap, yet very few have agents working for them constantly. Also: Nansen 2 is being rebuilt from scratch with user testing and open to all users in late November.", "tweet_url": ["https://x.com/ASvanevik/status/2109809161039204836", "https://x.com/ASvanevik/status/2109864806144712840"], "images": [], "type": "tweet", "created_at": "2026-10-13T00:51:17.000Z", "category": "AI"}, {"author": "nicbstme", "summary": "Human coding is now more dangerous than agentic coding, similar to self-driving cars being safer than humans — 'act accordingly'. Elsewhere: dislikes multi-persona agents (should be one intelligent agent) and says email parsing is a job for agents, not humans.", "tweet_url": "https://x.com/nicbstme/status/2109792840461263258", "images": [], "type": "tweet", "created_at": "2026-10-12T23:46:25.000Z", "category": "AI"}, {"author": "nic_carter", "summary": "On the AI-attitudes divide, quoting Karpathy: three groups are mutually unintelligible — 'AI is scary good, we must pace', 'it's vastly boosting my productivity', and 'it can't count the Rs in strawberry'. Separately argues (on Medicaid-funded IHSS and CDPAP programs in CA/NYC) that some welfare-like spending is deliberate rather than fraud: covert welfare under the Medicaid banner that the Fed must fund >50% of, which can grow without limit.", "tweet_url": ["https://x.com/nic_carter/status/2109779997179420930", "https://x.com/nic_carter/status/2109780630565224945"], "images": [], "type": "tweet", "created_at": "2026-10-12T22:55:23.000Z", "category": "society"}, {"author": "balajis", "summary": "Institutions often want chain of custody, and in a low-trust, high-AI society bitcoin movement can be watched onchain 'like a flight tracker'. Also suggests AI can turn books into interactive video games.", "tweet_url": ["https://x.com/balajis/status/2109711096479412471", "https://x.com/balajis/status/2109719227460690319"], "images": [], "type": "tweet", "created_at": "2026-10-12T18:21:36.000Z", "category": "crypto"}, {"author": "udiWertheimer", "summary": "Defends building Half-Life Alyx on Vision Pro (Glovebox 0.1.5: better visuals, faster start, fewer bugs) with AI: not his expertise, couldn't have done it or handled the bug reports and updates himself; free, and requires owning the game. Welcomes the unified X Subscription (Grok, Cursor and X Premium plans) as 'generally an improvement', saying Premium+ features fold into Premium.", "tweet_url": "https://x.com/udiWertheimer/status/2109753115096334497", "images": [], "type": "thread", "created_at": "2026-10-12T21:08:34.000Z", "category": "AI"}, {"author": "PeterDiamandis", "summary": "The FDA approved 45 novel drugs in the first nine months of 2026 vs 32 in the same period of 2025 (+41%), expecting the number to keep rising. Also argues 'Universal High Income' should be reframed as Universal Purchasing Power or Universal Abundance Access, and discusses OpenAI's math progress on Fox Business.", "tweet_url": "https://x.com/PeterDiamandis/status/2109725904054210607", "images": [], "type": "tweet", "created_at": "2026-10-12T19:20:26.000Z", "category": "society"}, {"author": "theallinpod", "summary": "All-In Summit: Martin Shkreli says quantum is a one-trick business he is betting against and AI won't cure a disease for at least a decade, while demand for intelligence is infinite and AI will start companies itself. Jason Calacanis: coders now review only 10–15% of AI-written code, soon none — the craft is shifting to constructing problem sets for AI.", "tweet_url": ["https://x.com/theallinpod/status/2109690007095005670", "https://x.com/theallinpod/status/2109697236900966865"], "images": [], "type": "tweet", "created_at": "2026-10-12T16:57:48.000Z", "category": "AI"}, {"author": "zriboua", "summary": "Essay on Third-Worldism and Islamism in the West: reading global conflict through domination/oppression categories pushes Jews and Israel into the 'dominant' bucket, feeding rising antisemitism.", "tweet_url": "https://x.com/zriboua/status/2109745615865282834", "images": [], "type": "tweet", "created_at": "2026-10-12T20:38:46.000Z", "category": "geopolitics"}, {"author": "MelMattison1", "summary": "Opinion posts: argues native-born workers' wish to curb visas for Indian workers is understandable ('home-country bias'), and mentions a Girard-based reading of public executions as American society turns post-Christian. Flags a WSJ headline that could be about China, US, Japan or Europe as signs of convergence.", "tweet_url": ["https://x.com/MelMattison1/status/2109838748448174097", "https://x.com/MelMattison1/status/2109809171604398104"], "images": [], "type": "tweet", "created_at": "2026-10-13T02:48:51.000Z", "category": "society"}, {"author": "Chartfest1", "summary": "With so many stocks on the new-low list, expects a long list of tax-loss-selling candidates in 4Q.", "tweet_url": "https://x.com/Chartfest1/status/2109690404455235878", "images": [], "type": "tweet", "created_at": "2026-10-12T16:59:23.000Z", "category": "positioning"}, {"author": "BillAckman", "summary": "Pledges a $20M challenge grant (matched by a $20M endowment) for Burke Rehabilitation to fund brain-injury recovery, after a family experience.", "tweet_url": "https://x.com/BillAckman/status/2109710213058105554", "images": [], "type": "tweet", "created_at": "2026-10-12T18:18:05.000Z", "category": "society"}, {"author": "garry // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
