<!DOCTYPE html>

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-08-27T05:20:56Z", "input_stats": {"total_tweets": 223, "unique_authors": 74, "tweets_with_images": 34, "after_noise_filter": 96}, "summary": "**NVDA earnings:** Nvidia crossed $1B/day in revenue and delivered a double beat, but the real story was FY2028 guidance of ~70% revenue growth vs. Street's 44% (**munster_gene**, **saxena_puru**). **aleabitoreddit**'s TLDR flagged commitments jumping from $119B to $279B (mostly memory procurement) and hyperscaler capex projections rising to $1.3T for 2027. **Jim Cramer** called it \"Operation Grand Slam\" alongside CRM/Anthropic; Jensen told the call \"we've already achieved AGI\" for many tasks (**dgt10011**).\n\n**Iran/energy:** **Geiger_Capital** flagged the Strategic Petroleum Reserve below 300M barrels, the lowest in 40+ years, while **dgt10011** noted the US is reviving a Civil War-era prize court to claim Iranian oil. **zriboua** pushed back on \"Iran is winning\" narratives, citing fuel/food panic-buying as evidence sanctions are biting.\n\n**Macro:** **Swedish_uranium**'s daily pulse showed hot PCE data failing to dent gold, silver, copper and uranium into Friday's Warsh Jackson Hole speech. **dampedspring** argued NGDP growth can't support current SPX earnings assumptions even with fully-funded AI capex (\"not enough pie\"), and separately debunked the popular \"$10T debt wall\" figure — real 12-month Treasury issuance was $32T due to bill rolling.\n\n**Crypto:** **DCinvestor** framed the Ethereum Foundation's reduced influence as a healthy \"cathedral to bazaar\" shift, pointing to Revolut's EURR stablecoin launch on Ethereum as validation. Robinhood-chain memecoins (cashcat, pons) kept ripping per **Bluntz_Capital** and **ColdBloodShill**, while **MoonOverlord** cashed out $2.5M from a Hyperliquid-ecosystem token, calling further exposure \"batshit insane.\"\n\n**AI infrastructure:** Nvidia is reportedly buying Hugging Face for $12.9B — ~80x ARR (**cryptopunk7213**) — as part of a broader push into open-source model hosting alongside Nemotron and a $9B Poolside investment. **sama** and **AnjneyMidha** both flagged Hugging Face's technical report on its recent AI-agent security incident.\n\n**Notable:** A Core Lightning critical vulnerability prompted node-shutdown warnings (**fejau_inc**, **lopp**); a viral post accusing NYC Mayor Mamdani of opposing a Hindu MSG gathering drew reactions from **zriboua** and **AviFelman**.", "sections": {"A_events": [{"cluster": "NVDA Earnings — Double Beat, 70% FY28 Guide Reignites AI Trade", "category": ["tech", "AI", "macro"], "items": [{"author": "Geiger_Capital", "summary": "Ran a live sequence through Nvidia's report: braced for a \"market goes to zero\" miss, then called it a \"NVIDIA DOUBLE BEAT,\" flagged revenue crossing $1B/day for the first time ever, and highlighted the CFO's guide for ~70% revenue growth in fiscal 2028.", "tweet_url": "https://x.com/Geiger_Capital/status/2092713961443516794", "images": ["https://pbs.twimg.com/media/HQrQQfMWwAA7P9R.jpg", "https://pbs.twimg.com/media/HQraZThWkAAYVfB.jpg"], "type": "tweet"}, {"author": "aleabitoreddit", "summary": "Posted a detailed earnings TLDR — revenue $96.22B vs. ~$92.17B consensus, adj. EPS $2.22 beat, DC revenue $89.0B, hyperscaler revenue up to $48.71B from $43.05B — then argued the real news was buried in the call: a supply-constrained 70% FY28 growth guide (vs. 43.9% expected), cloud backlog above $2T, and commitments jumping from $119B to $279B (mostly memory procurement). Framed most remaining alpha as being in the supply chain (CPO, memory, 800V) rather than NVDA stock itself.", "tweet_url": "https://x.com/aleabitoreddit/status/2092718416683819292", "images": ["https://pbs.twimg.com/media/HQrXKEIaEAAbYR4.jpg", "https://pbs.twimg.com/media/HQrcY3Vb0AALadR.jpg"], "type": "thread"}, {"author": "munster_gene", "summary": "Called out the 70%-vs-44%-expected FY28 revenue guide as the headline, and separately explained a reporting nuance: Nvidia appears to have reclassified SPCX revenue from its ACIE segment into Hyperscalers, which — adjusted back — would put ACIE growth at 160% y/y vs. Street's 130%, with hyperscaler growth still roughly matching consensus.", "tweet_url": "https://x.com/munster_gene/status/2092719913047609736", "images": [], "type": "tweet"}, {"author": "saxena_puru", "summary": "Called the FY28 guide \"significantly above Wall Street consensus,\" saying it should reignite the AI trade broadly, and flagged a potential Q4–Q1 rally across leading AI stocks.", "tweet_url": "https://x.com/saxena_puru/status/2092833766930862273", "images": [], "type": "thread"}, {"author": "jimcramer", "summary": "Dubbed the night \"Operation Grand Slam\" (Crowdstrike, Salesforce, Nvidia, plus Anthropic), and dismissed selling pressure tied to Nvidia not passing on the full DRAM cost increase as \"picayune\" — a 2% gross-margin hit he sees as immaterial to the growth story.", "tweet_url": "https://x.com/jimcramer/status/2092727511864033395", "images": [], "type": "tweet"}, {"author": "dgt10011", "summary": "Quoted Jensen Huang from the earnings call: \"in a lot of ways and for many tasks, we could say that we've already achieved AGI.\"", "tweet_url": "https://x.com/dgt10011/status/2092736765110915266", "images": [], "type": "tweet"}, {"author": "Chartfest1", "summary": "Noted SPX has closed in a tight ~40-point range for five straight sessions (7641–7677) heading into the print — a market coiled and waiting.", "tweet_url": "https://x.com/Chartfest1/status/2092719809532166427", "images": [], "type": "tweet"}]}, {"cluster": "Iran/Hormuz — SPR at 40-Year Low, Sanctions Pressure Narrative", "category": ["energy", "geopolitics"], "items": [{"author": "Geiger_Capital", "summary": "Flagged that the Strategic Petroleum Reserve — drained under Biden and further under Trump to mask war-with-Iran impact — is now below 300M barrels, nearing the operational minimum and the lowest level in 40+ years.", "tweet_url": "https://x.com/Geiger_Capital/status/2092653940181520402", "images": ["https://pbs.twimg.com/media/HQqZqwuWQAAIxAY.jpg"], "type": "thread"}, {"author": "dgt10011", "summary": "Flagged a Bloomberg report that the US aims to revive a Civil War-era prize court to legally claim Iranian oil, joking \"time to be King of the Pirates.\"", "tweet_url": "https://x.com/dgt10011/status/2092693211848282525", "images": ["https://pbs.twimg.com/media/HQq9YtqXAAAOF5X.jpg"], "type": "tweet"}, {"author": "zriboua", "summary": "Pushed back on the \"Iran is winning, sanctions don't work\" narrative by quoting a report that Iranians are rushing to buy fuel and food amid fears of tightening sanctions — reading it as evidence of real economic pressure, not strategic failure. Complementary framing, not a direct disagreement, with Geiger_Capital's SPR point.", "tweet_url": "https://x.com/zriboua/status/2092745295125774343", "images": [], "type": "tweet"}]}, {"cluster": "Macro — Jackson Hole Setup, Metals Resilience, Debt-Wall Myth", "category": ["macro"], "items": [{"author": "Swedish_uranium", "summary": "Daily metals pulse: hot US data (core/headline PCE +0.2% MoM, 3.7%/3.3% YoY, durable goods +1.1%) gave Fed hawks ammunition, but the 10Y yield eased to ~4.65% and hard assets rebounded anyway, with Warsh's Friday Jackson Hole speech now the key catalyst. Uranium broke through $90/lb (6-month high) on a new $2.2B Army microreactor program; LME copper sits 1.3% off record highs; silver led the Asian rebound to ~$69.28; gold rebounded 0.8% to ~$4,630 despite hawkish data. Framed the market's refusal to sell metals on textbook bearish inputs (high yields, firm dollar, hike odds) as the day's real signal.", "tweet_url": "https://x.com/Swedish_uranium/status/2092844243769250095", "images": [], "type": "tweet"}, {"author": "dampedspring", "summary": "Argued against the AI-melt-up bull case on NGDP grounds: even with full AI capex funded and spent, he sees no NGDP growth scenario consistent with current SPX earnings expectations or with the real wage growth needed to support both AI and non-AI consumption. Framed it as \"not enough pie\" rather than outright bearish — winners can still win big, just not everyone, and not in total versus what's priced.", "tweet_url": "https://x.com/dampedspring/status/2092732844304904322", "images": [], "type": "thread"}, {"author": "dampedspring", "summary": "Debunked the popular \"$10T debt wall\" framing: total US bill/note/bond auctions over the trailing 12 months were actually $32T, not $10T, because T-bills roll multiple times a year. Concluded there's \"some roll risk\" but not a reason for alarm since maturities have to go somewhere.", "tweet_url": "https://x.com/dampedspring/status/2092671640547078363", "images": [], "type": "thread"}, {"author": "spotgamma", "summary": "Noted lots of positive gamma support today for SPX and aggregate single stocks — a dealer-positioning read suggesting dip-buying support into the NVDA/Jackson Hole event risk.", "tweet_url": "https://x.com/spotgamma/status/2092670910071251341", "images": [], "type": "thread"}]}, {"cluster": "Ethereum — EF \"Cathedral to Bazaar,\" Institutional Stablecoin Adoption", "category": ["crypto"], "items": [{"author": "DCinvestor", "summary": "Framed the Ethereum Foundation's graceful wind-down of preeminence as a key inflection point for ETH — not because the EF was bad, but because its dominance drove a theory-heavy R&D monoculture. Called the current shift real decentralization: Ethereum is \"officially exiting the cathedral and entering the bazaar,\" which he expects to be the most exciting epoch in the chain's history.", "tweet_url": "https://x.com/DCinvestor/status/2092809341304967351", "images": [], "type": "tweet"}, {"author": "DCinvestor", "summary": "Pointed to Revolut (80M-customer European fintech, comparable to Robinhood/Venmo) launching its EURR euro stablecoin on Ethereum as proof of his settlement-layer thesis, adding BlackRock and Robinhood are building there too.", "tweet_url": "https://x.com/DCinvestor/status/2092813045974331750", "images": [], "type": "thread"}, {"author": "DCinvestor", "summary": "Said the gap between popular narrative and Ethereum fundamentals feels like 2019/2020 — a lot has structurally changed over the past year that the market is still sleeping on.", "tweet_url": "https://x.com/DCinvestor/status/2092782154770198923", "images": [], "type": "tweet"}, {"author": "DCinvestor", "summary": "Called NFTs \"so back, soon\" after a collection sold out in 5 minutes for 865 ETH (~$2.1M), and separately pitched OpenSea on building a clean, price-free \"gallery\" mode to let collectors showcase pieces — arguing it's a low-effort, high-engagement product other collapsing gallery sites have vacated.", "tweet_url": "https://x.com/DCinvestor/status/2092817975414038817", "images": ["https://pbs.twimg.com/tweet_video_thumb/HQsyOdbbwAADvYl.jpg"], "type": "thread"}]}, {"cluster": "Robinhood Chain — Memecoin Mania (cashcat, pons, Pump)", "category": ["crypto", "positioning"], "items": [{"author": "Bluntz_Capital", "summary": "Called cashcat's new all-time high (~$240M mcap, the largest on Robinhood chain) a leading indicator that \"floors on everything else run too,\" then flagged it stalling post-ATH and likely needing to reaccumulate before continuing. Also called pons' breakout toward a $100M mcap target (52% RH-chain market share) and said $Pump looks like one of the strongest multi-month uptrends among >$1B coins, since it never had a bull run after launching near the last cycle top. Separately praised the FOMO app for frictionless cross-chain onboarding.", "tweet_url": "https://x.com/Bluntz_Capital/status/2092736863966798280", "images": ["https://pbs.twimg.com/media/HQrlE6QaUAA5xBK.png", "https://pbs.twimg.com/media/HQtGoEEbUAAoxfz.png", "https://pbs.twimg.com/media/HQs0mPjbgAAsm0e.png", "https://pbs.twimg.com/media/HQsSHWcaMAA8JBm.jpg"], "type": "thread"}, {"author": "ColdBloodShill", "summary": "Called cashcat \"leading the way for RH again... MONSTER\" as it made new highs.", "tweet_url": "https://x.com/ColdBloodShill/status/2092734115497775120", "images": ["https://pbs.twimg.com/media/HQrii-VWcAE09Ed.jpg"], "type": "tweet"}, {"author": "MoonOverlord", "summary": "Was skeptical of an Ansem-linked wrapper token's momentum, noting its real market cap is closer to 40% of the stated figure since Ansem holds a large share of supply — while acknowledging his follower-growth pace is unprecedented.", "tweet_url": "https://x.com/MoonOverlord/status/2092802548747124963", "images": [], "type": "thread"}]}, {"cluster": "Nvidia Buys Hugging Face — $12.9B AI Infrastructure Land Grab", "category": ["AI", "tech"], "items": [{"author": "cryptopunk7213", "summary": "Reported Nvidia is buying Hugging Face for $12.9B — roughly 80x its ~$150M ARR — framing it as Jensen's push to win open-source AI, on top of billions into Nemotron and a $9B Poolside investment last week. Reads it as Nvidia positioning itself as both a model lab and a cloud provider.", "tweet_url": "https://x.com/cryptopunk7213/status/2092814208681365599", "images": ["https://pbs.twimg.com/media/HQsrbilXYAAapge.jpg", "https://pbs.twimg.com/media/HQsrbimWsAA4N41.jpg"], "type": "tweet"}, {"author": "AnjneyMidha", "summary": "Reacted to Hugging Face's technical report on its recent AI-agent security incident, using an AI-generated illustration to describe self-replicating breach behavior across sealed agent instances — said \"for many reasons, we should be concerned.\" sama separately called the report \"a good report about a bad thing.\"", "tweet_url": "https://x.com/AnjneyMidha/status/2092764047427182595", "images": ["https://pbs.twimg.com/media/HQr8yx1bsAAjP96.jpg"], "type": "tweet"}]}, {"cluster": "Mamdani MSG Controversy — Hindu Community Reactions", "category": ["society", "geopolitics"], "items": [{"author": "zriboua", "summary": "Labeled the dynamic behind a viral accusation that NYC Mayor Mamdani opposed a Hindu gathering at Madison Square Garden as \"Third Worldism.\"", "tweet_url": "https://x.com/zriboua/status/2092806778786374080", "images": [], "type": "tweet"}, {"author": "AviFelman", "summary": "Reacted with a self-deprecating joke about being \"Hinjew\" (Hindu-Jewish) and getting hit from both angles by the controversy.", "tweet_url": "https://x.com/AviFelman/status/2092826250737782921", "images": [], "type": "tweet"}, {"author": "BillAckman", "summary": "Replied directly to Mamdani with a conciliatory note hoping for more common ground, complimenting his handling of the (tennis) Open — a notably softer tone than the broader online reaction.", "tweet_url": "https://x.com/BillAckman/status/2092717676456026119", "images": [], "type": "tweet"}]}, {"cluster": "Bitcoin/Lightning Security — Core Lightning Critical Vulnerability", "category": ["crypto", "regulation"], "items": [{"author": "fejau_inc", "summary": "Reacted to an urgent alert about a critical vulnerability in Core Lightning, joking that \"bitcoin maxis are really going through it these days.\"", "tweet_url": "https://x.com/fejau_inc/status/2092741896074645654", "images": [], "type": "tweet"}, {"author": "lopp", "summary": "Said it's \"a really bad month to be running always-online cryptocurrency wallet infrastructure,\" and in a separate exchange advised against cloud-based 2FA backups, citing past incidents where attackers accessed Authy backups.", "tweet_url": "https://x.com/lopp/status/2092697266616225833", "images": [], "type": "tweet"}]}], "B_insights": [{"author": "aleabitoreddit", "summary": "Pitched ESMT (3006), a $2.5B fabless company with PSMC wafer allocation focused on DDR2, as an underfollowed play on the legacy DRAM price-hike cycle. Net income progressed from ~$16M (Jan) to $109.5M (July), which annualized implies $1.31B net profit at a 1.9x run-rate P/E — a trajectory he compares to SanDisk's earlier price-hike inflection. Balance sh // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
