{id:21, cat:"regulation", urgency:"deep", source:"ChinaTalk",
 title:"The One AI-Bio Policy Both the US and China Might Actually Agree On",
 idea:"Altman, Amodei and Hassabis co-signed a June letter arguing nucleic acid synthesis providers should be required to screen DNA/RNA orders before fulfilling them — a chokepoint between AI-designed pathogens and physical bioweapons. China controls ~34% of global DNA synthesis capacity; firms representing 80% of global capacity already screen voluntarily. The UK's Centre for Long-Term Resilience found every £1 spent on screening returns £3.50 in averted losses, and COVID cost the US economy ~$26B/day at its peak.",
 angle:"This is a rare case of a US-China AI-safety measure that requires no mutual verification and imposes cost on neither side's AI labs — \"demonstrated cooperation\" rather than \"contingent cooperation\" — making it one of the few plausible items for actual bilateral progress at the upcoming AI talks.",
 tweetA:"$26B a day is what COVID cost the US economy at its peak. Nucleic acid synthesis screening costs almost nothing and both the US and China already have 80% voluntary compliance. This is the rare AI-safety measure where the math isn't even close, and it might actually happen because neither side has to trust the other to enforce it.",
 tweetB:"Altman, Amodei and Hassabis agreeing on anything is itself the story. The reason they agree here: it's a supply-chain fix, not a model-level restriction, so it costs the labs nothing. That's the template for what US-China AI cooperation can actually look like — narrow, physical, unilaterally verifiable.",
 charts:{count:0, hot:false, desc:""},
 link:"https://www.chinatalk.media/p/us-china-biorisk-cooperation-yes"},

{id:22, cat:"labor", urgency:"watch", source:"Danielle DiMartino Booth / QI Research",

 idea:"A 25-year-old Lake Placid pizzeria owner is offering $19-20/hour and still can't find delivery drivers, forcing him onto DoorDash. NFIB's latest survey backs this up directly: \"no one wants to work... zero applications in thirty years of business\" (Tennessee services firm), and a Virginia firm says it could double or triple revenue if it could just find accountants.",

 tweetB:"$19-20/hour, zero applicants, thirty years in business, first time this has happened. That's not a wage problem, that's a labor supply problem NFIB keeps flagging that never makes it into the AI-jobs discourse.",

{id:29, cat:"credit", urgency:"act", source:"Dark Side of the Boom",
 title:"Beijing's Biggest Bank Recap in Two Decades Doesn't Fix the Actual Problem",
 idea:"Beijing is injecting 360 billion yuan (~$56B) into eight major banks and insurers — its largest financial-sector recapitalization in almost two decades. New bank lending contracted by more than 340 billion yuan in July, and China's credit impulse has fallen to its weakest level since the Lehman crisis. The report's framing: this recapitalizes the supply side of credit but does nothing for the harder problem — private-sector willingness to borrow.",
 angle:"Watch M1 and the credit impulse, not the headline injection size, for the real signal — recapitalizing banks that face weak loan demand is necessary but not sufficient, and the market shouldn't read this as 2009-style stimulus.",
 tweetA:"$56B into eight banks sounds like stimulus. It's not — new lending contracted by more than 340bn yuan in July and the credit impulse is at its weakest since Lehman. You can recapitalize the banks all day; you can't force borrowers to want a loan.",
 tweetB:"Everyone will read this as \"China stimulus is back.\" The actual signal to watch is M1 and the credit impulse over the next two prints — until those turn, this is balance-sheet reinforcement, not reflation.",
 charts:{count:0, hot:false, desc:""},

{id:31, cat:"credit", urgency:"deep", source:"Paper Alfa",
 title:"The Fed Is Searching for an Interest Rate That Doesn't Exist",
 idea:"Paper Alfa's thesis: AI financing has shifted from being funded by hyperscaler cash flow to a full capital-markets story — corporate bonds, private credit, project finance, data-center leases — against returns that remain deeply uncertain. Rates look too high for the legacy economy (refinancing debt taken on when money was free) but potentially still too low for the AI capex boom that's now propping up long-end yields. Supply-side inflation makes any single Fed rate response wrong for one side or the other.",
 angle:"This is the cleanest single articulation in the whole window of why the Fed is stuck — it directly explains the Amazon debut sterling bond deal and the broader long-end pressure everyone's puzzling over.",
 tweetA:"One interest rate has to serve a legacy economy drowning in refinancing at higher rates and an AI capex boom that might need rates even lower than they are to pencil out. Those two economies can't share a policy rate cleanly, and the Fed has no tool for that split.",
 tweetB:"AI capex used to be funded out of hyperscaler free cash flow. It's becoming a credit story — bonds, private credit, data center leases — against returns nobody can underwrite with confidence. That's the same sentence people used to describe subprime CDOs, just with GPUs instead of houses.",
 charts:{count:0, hot:false, desc:""},
 link:"https://www.paperalfa.com/p/the-wrong-interest-rate-for-everyone"},

let activeSrc = null;
let openCards = {};

function toggleCard(id){
  openCards[id] = !openCards[id];
  render();
}

function setCat(c){ activeCat = c; activeSrc = null; render(); }
function setUrg(u){ activeUrg = u; activeSrc = null; render(); }

function filterBySrc(name){
  activeSrc = name;
  activeCat = "all";
  activeUrg = "all";
  openCards = {};
  ITEMS.forEach(function(it){
    if(it.source.indexOf(name) !== -1){ openCards[it.id] = true; }
  });
  render();
  var cardsEl = document.getElementById('cards');
  if(cardsEl) cardsEl.scrollIntoView({behavior:'smooth', block:'start'});
}

function buildCatBar(){
  var counts = {};
  ITEMS.forEach(function(it){ counts[it.cat] = (counts[it.cat]||0)+1; });
  var cats = Object.keys(CAT_COLORS).filter(function(c){ return counts[c]; });
  var html = '<button class="pill' + (activeCat==="all"?" active":"") + '" style="' + (activeCat==="all"?"background:#333;border-color:#333;":"") + '" onclick="setCat(\'all\')">All (' + ITEMS.length + ')</button>';
  cats.forEach(function(c){
    var isActive = activeCat === c;
    var style = isActive ? ('background:'+CAT_COLORS[c]+';border-color:'+CAT_COLORS[c]+';') : '';
    html += '<button class="pill' + (isActive?" active":"") + '" style="' + style + '" onclick="setCat(\'' + c + '\')">' + esc(c) + ' (' + counts[c] + ')</button>';
  });
  document.getElementById('catBar').innerHTML = html;
}

function buildUrgBar(){
  var counts = {act:0, deep:0, watch:0};
  ITEMS.forEach(function(it){ counts[it.urgency]++; });
  var html = '<button class="pill' + (activeUrg==="all"?" active":"") + '" style="' + (activeUrg==="all"?"background:#333;border-color:#333;":"") + '" onclick="setUrg(\'all\')">All (' + ITEMS.length + ')</button>';
  ['act','deep','watch'].forEach(function(u){
    var m = URG_META[u];
    var isActive = activeUrg === u;
    var style = isActive ? ('background:'+m.color+';border-color:'+m.color+';') : '';
    html += '<button class="pill' + (isActive?" active":"") + '" style="' + style + '" onclick="setUrg(\'' + u + '\')">' + m.emoji + ' ' + m.label + ' (' + counts[u] + ')</button>';
  });
  document.getElementById('urgBar').innerHTML = html;
}

function cardHtml(item, idx){
  var color = CAT_COLORS[item.cat] || "#888";
  var urg = URG_META[item.urgency];
  var isOpen = !!openCards[item.id];
  var chartMark = "";
  if(item.charts.hot) chartMark = '<span class="chartmark">🔥</span>';
  else if(item.charts.count > 0) chartMark = '<span class="chartmark">📊</span>';
  var head = '<div class="card-head" onclick="toggleCard(' + item.id + ')">'
    + '<span class="idx">' + String(idx+1).padStart(2,'0') + '</span>'
    + '<span class="urg">' + urg.emoji + '</span>'
    + '<span class="badge" style="background:' + color + '">' + esc(item.source) + '</span>'
    + '<span class="tag">' + esc(item.cat) + '</span>'
    + chartMark
    + '<span class="card-title">' + esc(item.title) + '</span>'
    + '</div>';
  var body = '';
  if(isOpen){
    var chartBoxClass = "chartbox" + (item.charts.hot ? " hot" : "");
    var chartLabel = item.charts.hot ? "🔥 CHART WORTH SAVING — " : (item.charts.count>0 ? "📊 " : "No embedded chart — ");
    body = '<div class="card-body open">'
      + '<div class="section-label">The Idea</div>'
      + '<div class="idea">' + esc(item.idea) + '</div>'
      + '<div class="section-label">My Angle</div>'
      + '<div class="angle" style="border-left:3px solid ' + color + ';background:' + color + '14;color:' + color + '">' + esc(item.angle) + '</div>'
      + '<div class="tweets">'
        + '<div class="tweet"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + esc(item.tweetA) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>'
        + '<div class="tweet"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + esc(item.tweetB) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>'
      + '</div>'
      + '<div class="' + chartBoxClass + '">' + chartLabel + esc(item.charts.desc || "No chart in this email.") + '</div>'
      + '<div class="linkrow"><a href="' + esc(item.link) + '" target="_blank">↗ Read full article</a></div>'
      + '</div>';
  }
  return '<div class="card">' + head + body + '</div>';
}

function render(){
  buildCatBar();
  buildUrgBar();
  var filtered = ITEMS.filter(function(it){
    if(activeSrc && it.source.indexOf(activeSrc) === -1) return false;
    if(activeCat !== "all" && it.cat !== activeCat) return false;
    if(activeUrg !== "all" && it.urgency !== activeUrg) return false;
    return true;
  });
  var html = filtered.map(function(it){ return cardHtml(it, ITEMS.indexOf(it)); }).join('');
  if(filtered.length === 0){ html = '<div class="empty-msg">No items match this filter.</div>'; }
  document.getElementById('cards').innerHTML = html;
  document.getElementById('metaLine').textContent = META.date + " · " + META.time + " · " + META.itemsExtracted + " items from " + META.emailsRead + " emails";
}

function buildReport(){
  var html = '<h4>Time Window</h4>'
    + '<div>' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</div>'
    + '<div style="margin-top:4px;color:#888">' + META.emailsInWindow + ' emails in window, ' + META.emailsRead + ' read, ' + META.itemsExtracted + ' items extracted.</div>'
    + '<h4>Included Sources</h4>';
  META.includedSources.forEach(function(s){
    html += '<div class="srcrow" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + esc(s.name) + ' — ' + s.count + ' item' + (s.count>1?'s':'') + '</div>';
  });
  html += '<h4>Skipped Sources</h4>';
  META.skippedSources.forEach(function(s){
    html += '<div class="skiprow">' + esc(s.name) + ' — ' + esc(s.reason) + '</div>';
  });
  document.getElementById('reportBody').innerHTML = html;
}

document.getElementById('reportToggle').addEventListener('click', function(){
  var body = document.getElementById('reportBody');
  var chev = document.getElementById('reportChevron');
  body.classList.toggle('open');
  chev.textContent = body.classList.contains('open') ? '▴' : '▾';
});

buildReport();
render();
</script>
