<!DOCTYPE html>
<html lang="en">

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

ormuz — Oil Pressure and Midterm Timing", "category": ["geopolitics", "energy", "macro"], "items": [{"author": "Geiger_Capital", "summary": "Argues Iran holds a geopolitical advantage until midterms (5 weeks out) because yields are directly correlated with energy prices and the war's continuation — hitting US markets is Iran's most effective pressure point on the Trump administration.", "tweet_url": "https://x.com/Geiger_Capital/status/2102796582458360153", "images": [], "type": "tweet"}, {"author": "JavierBlas", "summary": "Reported Iranian President Pezeshkian telling the UN General Assembly that Tehran cannot allow a free Strait of Hormuz while the country remains under sanctions — a direct escalation signal on the oil chokepoint.", "tweet_url": "https://x.com/JavierBlas/status/2102766492274012432", "images": [], "type": "tweet"}, {"author": "goodalexander", "summary": "Contrarian angle: argues rates are high partly because AI hasn't loosened the labor market, AI-augmented warfare failed to produce a decisive military outcome in Iran, and AI hasn't made anything cheaper yet — sarcastically concludes \"the solution is, of course, more AI.\" Separately flagged a bullish setup in decimated travel/tourism names once there's any sign of peace, citing real-time translation and Starlink connectivity as tailwinds.", "tweet_url": "https://x.com/goodalexander/status/2102798720756507018", "images": [], "type": "tweet"}]}, {"cluster": "Crypto — Alt OI Wipeout and Rotation Debate", "category": ["crypto", "positioning"], "items": [{"author": "cointradernik", "summary": "Reported all of the week's open interest gone in two 15-minute candles, calling it likely \"the best we're getting\" this leg down — expects maybe one more wick but not much further downside on alts before a move higher. Also promoted his Macro Market Model service, claiming BTC is up 38% since it called a transition to \"Goldilocks\" conditions on August 1.", "tweet_url": "https://x.com/cointradernik/status/2102792117403729991", "images": ["https://pbs.twimg.com/media/HS6upuhW4AARxKz.jpg"], "type": "thread"}, {"author": "alpha_pls", "summary": "Flagged long-end bond selling plus elevated alt open interest as reasons for short-term caution — advises trimming leverage now, but still expects dips to be bought through year-end since early-cycle dips are historically the best ones.", "tweet_url": "https://x.com/alpha_pls/status/2102771785825476645", "images": ["https://pbs.twimg.com/media/HS6LyzaX0AAQoi1.png", "https://pbs.twimg.com/media/HS6LyzWWgAAxUlC.jpg"], "type": "tweet"}, {"author": "MoonOverlord", "summary": "Observes that \"revenue meta\" coins are underowned because capital keeps flowing into lower-quality speculative names instead — Hyperliquid and Lighter have made new all-time highs for a month straight with little attention.", "tweet_url": "https://x.com/MoonOverlord/status/2102758498358419741", "images": [], "type": "thread"}, {"author": "zeroxkyle", "summary": "Complementary view: singled out a trader (\"Evan\") as one of the few posting genuinely new trade ideas this cycle — specifically USDE and LIT — calling it \"real alpha generation.\" Also noted this looks like the closest Saylor/Strategy has come to a real survival test this cycle.", "tweet_url": "https://x.com/zeroxkyle/status/2102621150081871996", "images": [], "type": "thread"}]}, {"cluster": "Kalshi Wash-Trading Allegations — WSJ Pushback", "category": ["regulation", "crypto"], "items": [{"author": "AviFelman", "summary": "Long thread disputing a WSJ hit piece alleging Kalshi wash trading based on a chart of uniform $5,500-sized trades. Argues it makes little sense for Kalshi to suddenly start wash trading mid-August after posting large real volumes, and that the uniform trade-size pattern looks more like a market maker doing something unusual (or possibly wash trading by a participant, not Kalshi itself) — genuine wash traders vary order sizes to avoid detection, a lesson from crypto exchanges like " productivity thesis as the offsetting force.", "tweet_url": "https://x.com/RaoulGMI/status/2102704285905502616", "images": [], "type": "thread"}, {"author": "EMostaque", "summary": "Claims his \"Zenith\" open adaptive-intelligence system takes DeepSeek V4.1 Flash — the cheapest open model from a frontier lab — and pushes it past GPT-5.6 Sol on the hardest long-range reasoning tasks. Points to a Bespoke Labs blog post on the \"Autoresearch exam\" benchmark showing minimal performance difference versus standard harnesses, framing this as evidence that a reliable, cheaper open frontier is now within reach for everyone.", "tweet_url": "https://x.com/EMostaque/status/2102807579655090388", "images": ["https://pbs.twimg.com/media/HS6upuhW4AARxKz.jpg", "https://pbs.twimg.com/media/HS6upuhXoAAIIRt.jpg"], "type": "thread"}, {"author": "aleabitoreddit", "summary": "Two related posts on Korean/Asian optical-supply-chain names riding the AI buildout. First: has quietly entered positions in tiny Korean suppliers ($30-250M market cap range) feeding memory, test, and machine tooling to Micron, SK Hynix, Samsung and others, declining to name most publicly given illiquidity, but citing $40M→$400M-type payoffs as worth the risk; has already published on $INTC, $ARM, $MU, $SIVE, $AAOI, $AXTI, $NBIS, plus newer names $ESMT (legacy memory) and $CCXI (humanoids). Second: an update on $LITE/Win Semi ($SIVE) — Lumentum told Stifel at ECOC 2026 that Nvidia Spectrum-6 CPO/UHP demand increased materially and NPO demand now exceeds CPO with multi-wavelength lasers lifting ASPs; Digitimes separately reported Win Semi expanding CW laser capacity with meaningful revenue only arriving 2027-2028, sourcing InP substrates from Tier-1 suppliers and DUV tools from ASML.", "tweet_url": "https://x.com/aleabitoreddit/status/2102763548715753927", "images": ["https://pbs.twimg.com/media/HS5_KSIbwAEXMCN.jpg", "https://pbs.twimg.com/media/HS6BvM8bkAAfY7a.jpg", "https://pbs.twimg.com/media/HS6CFGibcAEj-8R.jpg"], "type": "thread"}, {"author": "hooeem", "summary": "Lays out a workflow for using AI in trading that isn't \"ask the model what to buy\": use it to identify profitable onchain wallets, track those wallets over time, cross-reference the resulting signals against trending categories/narratives, then run a separate deep-research pass on any coin of interest for catalysts — only buying when the coin shows relative strength on a red BTC day, has upcoming catalysts, smart-money wallets accumulating, and passes the research screen.", "tweet_url": "https://x.com/hooeem/status/2102802047338766704", "images": [], "type": "thread"}, {"author": "sjdedic", "summary": "Documents a rapid succession of record onchain trading-card sales: Collector Crypt broke the onchain record with a $600K Charizard sale, then topped it with a $64K Lugia and another record Charizard at $825K — before Beezie broke both the onchain and world record with a $1M sale of a 1999 1st-edition Charizard (settled on Base). Argues this validates the long-standing bull case that onchain TCG marketplaces are structurally superior to eBay/Goldin (transparent, low-fee, instant settlement), with the earlier \"gacha\" mechanics having simply been the on-ramp to attract collectors who are now discovering the venues themselves.", "tweet_url": "https://x.com/sjdedic/status/2102786738045309004", "images": ["https://pbs.twimg.com/media/HS6ZYPYWYAAgZDm.jpg", "https://pbs.twimg.com/media/HS6ZYPLW8AAlzYt.jpg", "https://pbs.twimg.com/media/HS6ZYPXWwAACIxg.jpg", "https://pbs.twimg.com/media/HS6ZYPXX0AAIozp.jpg"], "type": "thread"}, {"author": "thedefiedge", "summary": "Separate 1,966-character framework on position sizing: decide your max acceptable loss first (e.g. 2% of a $50K portfolio = $1,000), size the position off your stop distance ($1,000 ÷ 40% stop = $2,500 position), scale in gradually rather than deploying full size immediately, and stress-test whether you could hold through a 20% drawdown or two quiet months osure back on Hyperliquid.", "tweet_url": "https://x.com/Delphi_Digital/status/2102792720112628215", "images": [], "type": "tweet"}, {"author": "mrjasonchoi", "summary": "Reports getting scam texts almost immediately after signing up for the AI app Instinct — the first time from a US number despite being based outside the US — responding to another user's claim that Instinct leaked someone else's private data to them. Read alongside hosseeb's post below, this is a live data-handling/privacy concern around a fast-growing consumer AI agent product.", "tweet_url": "https://x.com/mrjasonchoi/status/2102761761879531612", "images": [], "type": "tweet"}, {"author": "hosseeb", "summary": "In the same Instinct discussion, argues the real fix is running your own agent stack (recommends \"Hermes Agent\") on a self-controlled cloud box rather than trusting a company-run agent for free — warns that once a vendor needs to monetize and doesn't, inference costs get squeezed and the agent gets quietly nerfed, forcing users to rebuild their setup elsewhere.", "tweet_url": "https://x.com/hosseeb/status/2102759851881300102", "images": [], "type": "thread"}, {"author": "DCinvestor", "summary": "Long thread on console gaming economics: argues the industry needs rationalization since the player base isn't growing while too many expensive games ship every year, and spiraling next-gen hardware costs (likely $1K+ for Sony/Microsoft's next consoles) could make things materially worse. Nintendo is the only maker credibly working around this with lower-spec, portable-first hardware. Predicts Xbox or PlayStation could effectively die next generation if makers don't commit several more years to existing hardware instead of forcing a costly upgrade cycle on a tapped-out consumer; also dismisses cloud gaming demand as overstated given latency/fidelity tradeoffs versus local hardware.", "tweet_url": "https://x.com/DCinvestor/status/2102648900356300926", "images": [], "type": "thread"}, {"author": "spotgamma", "summary": "SPX 3-month skew made a sharp turn as oil prices came down — call skew lifted toward 1-year highs while put skew dropped to 1-year lows, a positioning signal spotgamma reads as the options market leaning toward a year-end rally.", "tweet_url": "https://x.com/spotgamma/status/2102718865398722704", "images": ["https://pbs.twimg.com/media/HS5bhSYWwAEcLOU.jpg"], "type": "tweet"}, {"author": "munster_gene", "summary": "Previews Meta Connect keynote (Zuckerberg speaking that night): the two announcements that matter are a Muse-on-smartglasses demo and the release of Muse Glimmer, Meta's on-device model. Muse's early buzz has already pushed $META shares up 20% over two weeks, with Alexandr Wang (Meta's Chief AI Officer) saying usage is running \"well ahead of internal projections\" and framing it as the biggest consumer AI launch since ChatGPT — heavier US download volume than Threads, WhatsApp and Facebook combined. Will be watching for hard data points on Muse adoption and whether momentum transfers to wearables, plus a first look at the Phoenix MR glasses (still far from impactful).", "tweet_url": "https://x.com/munster_gene/status/2102714606648992226", "images": [], "type": "thread"}, {"author": "zeroxkyle", "summary": "Longer-horizon thesis on education: argues degree inflation already made trade schools more valuable, and the Palantir high-school-to-internship pipeline plus a16z's newly announced Horowitz Andreessen Academy point toward companies rebuilding apprenticeship models directly around themselves — eventually adding housing, effectively reinventing a company-town structure. Frames it as a symptom of a broader \"K-shaped\" world, genuinely unsure if the trend is good or bad.", "tweet_url": "https://x.com/zeroxkyle/status/2102629954047676875", "images": [], "type": "thread"}, {"author": "Fiskantes", "summary": "Recounts a summer job ~16 years ago covertly tracking IKEA shoppers' demographics and in-store behavior for product-placement op // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
