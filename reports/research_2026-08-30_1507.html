    { name: "arcadianow@substack.com — \"Pod: Bankers and Bots\"", reason: "Podcast link only ('Listen now, 21 mins'), zero sentences of content in the email body." },
    { name: "adlerscryptoinsights@substack.com — \"Weekly Engine 111\"", reason: "Gated preview states topics (Warsh rhetoric, BTC spot demand) but delivers no actual data or claims." },
    { name: "notifications@github.com — CI failure notice", reason: "Automated workflow notification, not editorial content." }
  ]
};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function catColor(c){ return CATCOLORS[c] || "#888"; }

function buildFilters(){
  const catCounts = {};
  ITEMS.forEach(i => catCounts[i.cat] = (catCounts[i.cat]||0)+1);
  const catBar = document.getElementById('catFilter');
  let html = '<button class="pill' + (activeCat==='all'?' active':'') + '" style="' + (activeCat==='all'?'background:#333':'') + '" onclick="setCat(\'all\')">All (' + ITEMS.length + ')</button>';
  Object.keys(catCounts).sort().forEach(function(c){
    const on = activeCat === c;
    html += '<button class="pill' + (on?' active':'') + '" style="' + (on?('background:'+catColor(c)):'') + '" onclick="setCat(\'' + c + '\')">' + c + ' (' + catCounts[c] + ')</button>';
  });
  catBar.innerHTML = html;

  const urgCounts = { act: 0, deep: 0, watch: 0 };
  ITEMS.forEach(i => urgCounts[i.urgency]++);
  const urgBar = document.getElementById('urgFilter');
  let uhtml = '<button class="pill' + (activeUrg==='all'?' active':'') + '" style="' + (activeUrg==='all'?'background:#333':'') + '" onclick="setUrg(\'all\')">All</button>';
  uhtml += '<button class="pill' + (activeUrg==='act'?' active':'') + '" style="' + (activeUrg==='act'?'background:#e24b4a':'') + '" onclick="setUrg(\'act\')">🔴 Act Now (' + urgCounts.act + ')</button>';
  uhtml += '<button class="pill' + (activeUrg==='deep'?' active':'') + '" style="' + (activeUrg==='deep'?'background:#378add':'') + '" onclick="setUrg(\'deep\')">🔵 Deep (' + urgCounts.deep + ')</button>';
  uhtml += '<button class="pill' + (activeUrg==='watch'?' active':'') + '" style="' + (activeUrg==='watch'?'background:#ef9f27':'') + '" onclick="setUrg(\'watch\')">🟡 Watch (' + urgCounts.watch + ')</button>';
  urgBar.innerHTML = uhtml;
}

function setCat(c){ activeCat = c; activeSrc = null; buildFilters(); renderCards(); }
function setUrg(u){ activeUrg = u; activeSrc = null; buildFilters(); renderCards(); }
function filterBySrc(name){
  activeSrc = name; activeCat = "all"; activeUrg = "all";
  buildFilters(); renderCards(true);
}

function urgEmoji(u){ return u === 'act' ? '🔴' : (u === 'watch' ? '🟡' : '🔵'); }

function renderCards(expandAll){
  const container = document.getElementById('cards');
  let list = ITEMS.filter(function(i){
    if (activeSrc && i.source.indexOf(activeSrc) === -1) return false;
    if (activeCat !== 'all' && i.cat !== activeCat) return false;
    if (activeUrg !== 'all' && i.urgency !== activeUrg) return false;
    return true;
  });
  if (list.length === 0){
    container.innerHTML = '<div class="empty">No items match this filter.</div>';
    return;
  }
  let html = '';
  list.forEach(function(item){
    const chartMark = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');
    const openClass = expandAll ? ' open' : '';
    html += '<div class="card' + openClass + '" id="card-' + item.id + '">';
    html += '  <div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '    <span class="idx">' + String(item.id).padStart(2,'0') + '</span>';
    html += '    <span class="urg">' + urgEmoji(item.urgency) + '</span>';
    html += '    <span class="badge" style="background:' + catColor(item.cat) + '">' + item.source + '</span>';
    html += '    <span class="catpill">' + item.cat + '</span>';
    if (chartMark) html += '    <span class="chartmark">' + chartMark + '</span>';
    html += '    <span class="title">' + item.title + '</span>';
    html += '    <span class="chev">▶</span>';
    html += '  </div>';
    html += '  <div class="card-body">';
    html += '    <div class="label">The Idea</div><div class="idea">' + item.idea + '</div>';
    html += '    <div class="label">My Angle</div><div class="angle" style="border-left:2px solid ' + catColor(item.cat) + ';background:' + catColor(item.cat) + '14">' + item.angle + '</div>';
    html += '    <div class="tweets">';
    html += '      <div class="tweet"><div class="tweet-label" style="color:#378add">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '      <div class="tweet"><div class="tweet-label" style="color:#7f77dd">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '    </div>';
    html += '    <div class="chartbox' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.count > 0 ? ('📊 ' + item.charts.count + ' chart(s). ') : '') + item.charts.desc + '</div>';
    html += '    <div class="linkrow"><a href="' + item.link + '" target="_blank" rel="noopener">↗ Read full article</a></div>';
    html += '  </div>';
    html += '</div>';
  });
  container.innerHTML = html;
}

function toggleCard(id){
  const el = document.getElementById('card-' + id);
  if (el) el.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function buildReport(){
  let html = '<div><strong>Window:</strong> ' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</div>';
  html += '<div style="margin-top:8px"><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp; <strong>Read:</strong> ' + META.emailsRead + ' &nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</div>';
  html += '<div class="label" style="margin-top:14px">Included Sources (click to filter)</div>';
  html += '<table>';
  META.includedSources.forEach(function(s){
    html += '<tr><td><span class="src" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span></td><td>' + s.count + ' item(s)</td></tr>';
  });
  html += '</table>';
  html += '<div class="label" style="margin-top:14px">Skipped Sources</div>';
  html += '<table>';
  META.skippedSources.forEach(function(s){
    html += '<tr><td>' + s.name + '</td><td>' + s.reason + '</td></tr>';
  });
  html += '</table>';
  document.getElementById('reportInner').innerHTML = html;
}

document.getElementById('metaLine').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources';
buildFilters();
renderCards();
buildReport();
</script>
