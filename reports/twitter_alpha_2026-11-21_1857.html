<!DOCTYPE html>
<html lang="en">
<head>

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-11-21T13:38:22Z", "input_stats": {"total_tweets": 188, "unique_authors": 63, "tweets_with_images": 38, "after_noise_filter": 99}, "summary": "**Nvidia/Jensen:** Day two of the Jensen Huang ouster. **paulg** has never seen tech more unanimous that the board blundered; **PalmerLuckey** offers to bet any amount the interim CEO underperforms the founder. **cryptopunk7213** reads **Bessent**'s 180° on China chip sales as gutting the stated rationale for removing him; **DCinvestor** calls the takedown \"scripted\". **0xSammy** keeps pressing the PwC audit question (customer-HQ revenue geography in the Q3 10-Q, ASC 460 guarantees).\n\n**Markets:** \"Worst tech drawdown since 2003\" (**WazzCrypto**). **dampedspring** declares the year-end rally dead, no capital gains to defer and no performance to crystallize, and says he is \"not really short anymore\". **Chartfest1**: Nasdaq down-volume share highest since **9/2022**, Naz stocks making new lows. **fejau_inc**: a **2018/2022 hybrid**, no V-bottom without intervention. **BobEUnlimited** walks through correction-to-bear mechanics on MacroTalk.\n\n**Crypto:** BTC printed **$55k**, a new cycle low (**Geiger_Capital**), with **$2.3–2.7B** liquidated in 24h and all post-election gains (**-$2.3T**) gone (**TKL_Adam**). Kraken CAD pairs flash-crashed; **beaniemaxi** says CEXs exist to exploit exactly this. **cointradernik**'s systematic BTC model flipped long (**+29% YTD** vs **-32.7%** BTC). **DCinvestor**: ETH bottom likely in since summer, BTC's is now or still ahead. **zeroxkyle** lists four mounting BTC headwinds and asks whether this is the first failed cycle (**alpha_pls**).\n\n**AI:** An Anthropic mathematician claims a Claude-discovered Lean proof of the **Riemann Hypothesis**; **SemiAnalysis_** costs it at **$44k** in output tokens and **~$1.17M** all-in, more than the Clay prize. **balajis**: \"proven, but not yet understood.\" New models: **Gemini 4 Neon** (**gregisenberg**, sponsored), **Inkling 2 Mini** at 26B params (**udiWertheimer**), a GPT-6.2 robotics jump (**AndrewCurran_**), and AI R&D time horizons doubling every **3.6 months** (**cryptopunk7213**).\n\n**Security:** The FBI's **NCIC** warrant/background-check database was breached and the **Algonquin Dam** hacked (**AndrewCurran_**); **lopp** warns threat actors love holidays; **zachxbt** names a US-based Google Ads phishing actor.\n\n**Notable debate:** **AndreasSteno** says AI is underhyped and models will sell at a margin to compute; **0x_Kun** argues AI's success destroys the value of its own inputs and the equity case is \"too basic\". **saxena_puru** flags the disconnect: GPU rental prices still rising and AWS AI revenue over **$25B**, while the stocks crater. Also: Netflix's FTX series **\"The Altruists\"** draws fire from **Fiskantes**, **VitalikButerin** and **mhonkasalo** for casting CZ as the villain.", "sections": {"A_events": [{"cluster": "Nvidia Board vs. Jensen — Tech Unanimous, Bessent Reverses on China Chips", "category": ["tech", "AI", "geopolitics"], "description": "Day-two reactions to the Nvidia board's removal of Jensen Huang, as Treasury Secretary Bessent walks back the China-chip line that underpinned the case against him.", "items": [{"author": "paulg", "summary": "Says he has never known the tech world to be more unanimous about anything: everyone in tech thinks the board made a huge mistake, \"except the board. But they are not in tech.\" Asked what the board was optimizing for, he answers: \"Page views.\"", "tweet_url": "https://x.com/paulg/status/2124041291046785484", "images": [], "type": "thread", "created_at": "2026-11-21T07:24:41.000Z"}, {"author": "PalmerLuckey", "summary": "Offers to bet any amount of money that Nvidia's interim CEO will not outperform the genius founder who built the company from nothing to $5T. \"Happy to make any wager you propose!\"", "tweet_url": "https://x.com/PalmerLuckey/status/2124016206201983166", "images": [], "type": "tweet", "created_at": "2026-11-21T05:45:00.000Z"}, {"author": "cryptopunk7213", "summary": "Quoting a clip of Bessent declaring that he, not Commerce, owns China trade policy and that he no longer thinks blacklisting China is wise (\"we don't want to decouple\"): so is Jensen cleared? The US government has done a complete 180° on banning Nvidia chip sales to China, on the logic that it is better to have China rely on the US than build its own. That was Jensen's entire argument, which makes the reasoning for removing him \"very weak\".", "tweet_url": "https://x.com/cryptopunk7213/status/2123954631550410898", "images": [], "type": "tweet", "created_at": "2026-11-21T01:40:19.000Z"}, {"author": "DCinvestor", "summary": "The Jensen takedown \"feels so scripted\", as if someone wanted a pound of flesh from the market and needed to move a few trillion in value to get it, very much in the pattern of the past two years. The most expected reversal, if one were to occur, would be Trump quasi-ending the Iran war within a week to pump markets.", "tweet_url": "https://x.com/DCinvestor/status/2124015501362016418", "images": [], "type": "tweet", "created_at": "2026-11-21T05:42:12.000Z"}, {"author": "0x_Kun", "summary": "Replying to paulg: consider the board's view too, \"albeit stupid\". However it went down, they probably know that if they bring him back now the whole board gets fired.", "tweet_url": "https://x.com/0x_Kun/status/2124068725485928878", "images": [], "type": "tweet", "created_at": "2026-11-21T09:13:42.000Z"}, {"author": "0xSammy", "summary": "Continues pressing the PwC audit question. Cites Nvidia's Q3 FY2026 10-Q, Note 13 (Segment Information, p.22), which switched geographic revenue reporting to customer-headquarters location. The methodology change was disclosed, so on its own it is not evidence of improper reporting, but a customer's HQ says little about onward diversion or ultimate end users, and with Megaspeed already under investigation and blocked by Nvidia before the audit sign-off, he asks what PwC knew and assessed. On guarantees: a full backstop is not an immediate P&L charge, but where ASC 460's recognition rules apply a fair-value liability is recognized even if payout is not probable, and he asks which disclosure says Nvidia could not estimate the value and therefore only disclosed. Concedes statistical sampling never covers 100% of a population; the question is whether PwC sufficiently challenged management's assumptions. Quips that if anyone could bring down the largest accounting firm it is the largest multi-trillion-dollar AI lab, recalling that a lot of Arthur Andersen staff landed at EY after its collapse.", "tweet_url": "https://x.com/0xSammy/status/2123941218182983782", "images": [], "type": "thread", "created_at": "2026-11-21T00:47:01.000Z"}]}, {"cluster": "Worst Tech Drawdown Since 2003 — Dead Santa, Bear-Market Mechanics", "category": ["macro", "positioning"], "description": "Equities extend the slide. Alpha accounts debate whether the correction turns into a bear market and why the usual year-end support is missing.", "items": [{"author": "dampedspring", "summary": "Declares the year-end rally dead, and not the \"narrow traders almanac nonsense\" but on his own framework. Rallies into year-end come from two factors: (1) investors not selling stocks, especially winners, to avoid realizing 2026 capital gains, which is dead because diversified portfolios now carry lots of losses and only modest gains; (2) in years when PMs are doing well, pressure to pump into year-end to crystallize performance-based pay or at least retain AUM, with underperformers chasing the strongest names to catch up, which is dead because no one has strong performance to crystallize. \"Dead Santa.\" In replies he adds that he is \"not really short anymore\" and rates his conviction \"medium\".", "tweet_url": "https://x.com/dampedspring/status/2124098978547470730", "images": ["https://pbs.twimg.com/tweet_video_thumb/HXpQwt2XkAA1xRI.jpg"], "type": "thread", "created_at": "2026-11-21T11:13:54.000Z", "tweet_urls": ["https://x.com/dampedspring/status/2124098978547470730", "https://x.com/dampedspring/status/2124099217933090898"]}, {"author": "WazzCrypto", "summary": "Quoting a chart labelling this the worst tech drawdown since 2003: the \"traders are the new celebrities\" narrative arrived right at the top, and the market immediately \"gigatopped\" into the biggest drawdown in 20+ years. \"Can't make this shit up.\"", "tweet_url": "https://x.com/WazzCrypto/status/2124131378883109325", "images": [], "type": "tweet", "created_at": "2026-11-21T13:22:39.000Z"}, {"author": "Chartfest1", "summary": "Nasdaq down-volume as a share of total volume hit its highest since September 2022. Her chart (ten years of data, reposted with corrected dates after a follower caught an error) marks the 85% line: readings above 85% were common before the ChatGPT release but had not occurred once since, until now. \"Putting things in perspective.\"", "tweet_url": "https://x.com/Chartfest1/status/2124112909215425023", "images": ["https://pbs.twimg.com/media/HXpdbhZWAAAm3VC.png", "https://pbs.twimg.com/media/HXpgK8UW0AAkL5J.png"], "type": "thread", "created_at": "2026-11-21T12:09:16.000Z"}, {"author": "Chartfest1", "summary": "Chart of Nasdaq stocks making new lows. Separately endorses an analog a follower posted: \"I hate analogs but this is a good one.\"", "tweet_url": "https://x.com/Chartfest1/status/2124133290244247883", "images": ["https://pbs.twimg.com/media/HXpv-EiWAAAP3Hw.png"], "type": "tweet", "created_at": "2026-11-21T13:30:15.000Z"}, {"author": "BobEUnlimited", "summary": "If you woke up asking what to watch to know whether this correction turns into a bear market, this week's MacroTalk with AahanPrometheus walks through \"the mechanics of what is likely coming ahead\", with a chart and a timestamped link to where the conversation starts. Recorded Friday noon, \"so no real change in views\". Jokes that \"DCF is dead... all vibes these days.\" Separately polls followers on what S&P 500 level the Fed put is struck at.", "tweet_url": "https://x.com/BobEUnlimited/status/2124106549090001000", "images": ["https://pbs.twimg.com/media/HXpfs74XQAASGED.png"], "type": "thread", "created_at": "2026-11-21T11:43:59.000Z", "tweet_urls": ["https://x.com/BobEUnlimited/status/2124106549090001000", "https://x.com/BobEUnlimited/status/2124128167547822103"]}, {"author": "fejau_inc", "summary": "Agreeing with a thesis that markets cannot V-bottom without some form of intervention (2009 Fed, 2012 Draghi, 2018 Fed, 2020 Fed, 2025 \"Tariff Taco\", 2026 war-taco speculation) while 2022 was a grinding bottom with none: his working framework is a 2018-like setup but with a much more long-winded, painful bleed and elevated inflation like 2022, a \"2018/2022 hybrid\". Says he has made this case on every roundup episode for over a month.", "tweet_url": "https://x.com/fejau_inc/status/2123980289999503529", "images": [], "type": "thread", "created_at": "2026-11-21T03:22:17.000Z"}, {"author": "biancoresearch", "summary": "Year-to-date price returns across assets, chart (plus an animated version in a follow-up).", "tweet_url": "https://x.com/biancoresearch/status/2123968585517379669", "images": ["https://pbs.twimg.com/media/HXnaKQHWkAA7Y04.png"], "type": "thread", "created_at": "2026-11-21T02:35:46.000Z", "tweet_urls": ["https://x.com/biancoresearch/status/2123968585517379669", "https://x.com/biancoresearch/status/2123968998346035503"]}, {"author": "0x_Kun", "summary": "On what is driving the selloff: if it were only stocks that would be one thing, but gold, BTC, commodities and stocks are all falling together. Floats an \"option 3\" beyond the two explanations being debated: credit destruction via rate hikes, while record AI investment sucks liquidity out of a market already suffering from higher rates and not enough demand.", "tweet_url": "https://x.com/0x_Kun/status/2124004257192149364", "images": [], "type": "tweet", "created_at": "2026-11-21T04:57:31.000Z"}, {"author": "arthur0x", "summary": "Gallows humor: on the bright side we no longer have to worry as much about a K-shaped society. Follow-up question: what if they fall another 80% in the next 12 months?", "tweet_url": "https://x.com/arthur0x/status/2123993689215390189", "images": [], "type": "thread", "created_at": "2026-11-21T04:15:32.000Z"}, {"author": "ASvanevik", "summary": "\"AI economy went from K-shaped to L-shaped.\" Replying to arthur0x: \"L-shaped only from here.\"", "tweet_url": "https://x.com/ASvanevik/status/2124040760517669108", "images": [], "type": "thread", "created_at": "2026-11-21T07:22:34.000Z", "tweet_urls": ["https://x.com/ASvanevik/status/2124040760517669108", "https://x.com/ASvanevik/status/2124040522566369329"]}]}, {"cluster": "Capitulation Sentiment Check", "category": ["positioning", "crypto"], "description": "Mood markers from alpha accounts: the memes and one-liners that read as capitulation signals on a Saturday morning after a cycle low.", "items": [{"author": "AviFelman", "summary": "\"Mother has capitulated\", with screenshot.", "tweet_url": "https://x.com/AviFelman/status/2123956647819202879", "images": ["https://pbs.twimg.com/media/HXnPULPWQAAk2qm.jpg"], "type": "tweet", "created_at": "2026-11-21T01:48:20.000Z"}, {"author": "Melt_Dem", "summary": "\"Me, looking at my brokerage account\", meme.", "tweet_url": "https://x.com/Melt_Dem/status/2124031289351151898", "images": ["https://pbs.twimg.com/media/HXoTM5-W8AATJW_.jpg"], "type": "tweet", "created_at": "2026-11-21T06:44:56.000Z"}, {"author": "Zeneca", "summary": "\"gm how we all feeling today\", reaction gif.", "tweet_url": "https://x.com/Zeneca/status/2124069586287128885", "images": ["https://pbs.twimg.com/tweet_video_thumb/HXo2Bh6bgAAomKk.jpg"], "type": "tweet", "created_at": "2026-11-21T09:17:07.000Z"}, {"author": "stevehou", "summary": "Asked ChatGPT for inspirational posters based on recent news; shares three AI-generated posters mocking the week.", "tweet_url": "https://x.com/stevehou/status/2124111939580379431", "images": ["https://pbs.twimg.com/media/HXpcjOdXEAALxgN.jpg", "https://pbs.twimg.com/media/HXpc4tZXoAAw3VJ.jpg", "https://pbs.twimg.com/media/HXpc5IdW4AA8qaI.jpg"], "type": "thread", "created_at": "2026-11-21T12:05:25.000Z"}, {"author": "0xJeff", "summary": "\"Market down bad. You've tried all the strategies... except one: praying.\" Organizing a temple visit during Binance Blockchain Week in Bangkok to get the market back up.", "tweet_url": "https://x.com/0xJeff/status/2124126228802318581", "images": ["https://pbs.twimg.com/media/HXppUTQbkAApomj.png"], "type": "thread", "created_at": "2026-11-21T13:02:11.000Z"}, {"author": "Fiskantes", "summary": "Still coming to grips with crypto no longer being the most entertaining industry. In markets like this he used to tell himself crypto at least had more fun than anyone, but for a year or two it has been left in the dust by Dario, Sam Altman, Jensen, Musk, Trump and AI memes. Who is left to meme about: \"washed Saylor and his boomer AI clips, or CZ for the hundredth time?\"", "tweet_url": "https://x.com/Fiskantes/status/2124133819238244725", "images": ["https://pbs.twimg.com/media/HXpwcCtXsAA45zH.jpg"], "type": "tweet", "created_at": "2026-11-21T13:32:21.000Z"}]}, {"cluster": "Bitcoin $55k Cycle Low — $2.3–2.7B Liquidated, Kraken CAD Flash Crash", "category": ["crypto", "positioning"], "description": "BTC broke to its lowest since September 2024 overnight as the equity/gold liquidity crunch spread to crypto; a localized CAD-pair crash on Kraken added to the damage.", "items": [{"author": "Geiger_Capital", "summary": "Bitcoin \"dropping like a rock\", now at $55,000, a new cycle low. Chart.", "tweet_url": "https://x.com/Geiger_Capital/status/2123993245059535261", "images": ["https://pbs.twimg.com/media/HXnwmWyXQAAPHfA.jpg"], "type": "tweet", "created_at": "2026-11-21T04:13:46.000Z"}, {"author": "TKL_Adam", "summary": "The sentiment-induced liquidity crunch seen in stocks and gold during the day spread to crypto overnight: $2.3B in levered positions liquidated in 24 hours, the 13th-largest liquidation event in history. All crypto gains since Trump won the 2024 election are gone, a total of -$2.3T. Liquidity crunches like these are when 24/7 markets get dangerous; per the linked article, liquidity must be restored before markets can bottom.", "tweet_url": "https://x.com/TKL_Adam/status/2123989916983959814", "images": ["https://pbs.twimg.com/media/HXntBB8XkAAf9zm.jpg"], "type": "tweet", "created_at": "2026-11-21T04:00:32.000Z"}, {"author": "Fiskantes", "summary": "Quoting a report of $2.7B liquidated in 24 hours (the 11th-largest event ever) as Bitcoin hit its lowest since September 2024: \"The real cuck simulator, and we didn't even have to wait 13 years.\"", "tweet_url": "https://x.com/Fiskantes/status/2124132905299636360", "images": [], "type": "tweet", "created_at": "2026-11-21T13:28:43.000Z"}, {"author": "beaniemaxi", "summary": "Reacting to Kraken's statement that CAD pairs saw heavy selling from around 20:00 UTC on Nov 20 that pushed prices well below other markets, with every order processed correctly, no breach found and executed trades standing: \"Crypto isn't a serious industry.\" Centralized exchanges are only good for exploiting situations like this, which happen far too often; with hardly any liquidity left, anyone with even a little margin will be hunted down and liquidated in these mini flash crashes.", "tweet_url": "https://x.com/beaniemaxi/status/2124134124193460516", "images": [], "type": "tweet", "created_at": "2026-11-21T13:33:34.000Z"}, {"author": "WazzCrypto", "summary": "Puts the open question to Kraken support: who was selling the CAD pairs so heavily to cause this?", "tweet_url": "https://x.com/WazzCrypto/status/2124110364044403021", "images": [], "type": "tweet", "created_at": "2026-11-21T11:59:09.000Z"}, {"author": "cointradernik", "summary": "BTC is \"going for 17 today\" unless it rips to 62.6k, an \"unprecedented streak\"; notes that just this week infinite highs were left unswept on the way down (chart). Later: can't remember the last time Bitcoin spent more than five minutes above the daily open.", "tweet_url": "https://x.com/cointradernik/status/2124106821312950445", "images": ["https://pbs.twimg.com/media/HXpXzzcWUAA7yrz.jpg"], "type": "thread", "created_at": "2026-11-21T11:45:04.000Z", "tweet_urls": ["https://x.com/cointradernik/status/2124106821312950445", "https://x.com/cointradernik/status/2124129733180899801"]}, {"author": "DCinvestor", "summary": "Fun fact: the last BTC bear-market low came on exactly this date four years ago, November 21, 2022.", "tweet_url": "https://x.com/DCinvestor/status/2124012940311617577", "images": [], "type": "tweet", "created_at": "2026-11-21T05:32:01.000Z"}]}, {"cluster": "Riemann Hypothesis Claimed via Claude — $1M+ in Tokens for a $1M Prize", "category": ["AI", "tech"], "description": "Anthropic mathematician Levent Alpöge claims a Claude-discovered Lean proof of the Riemann Hypothesis. Experts are still verifying; alpha accounts react to the cost, the meaning and the fallout for mathematicians.", "items": [{"author": "SemiAnalysis_", "summary": "Alpöge of Anthropic claims he used Claude to discover a proof of the Riemann Hypothesis, arguably the most significant open problem in mathematics; experts are still verifying the released Lean proof but it \"seems very likely correct\". SemiAnalysis costs it out. Two artifacts: an unreleased 250k+ page \"book\" that Alpöge calls slop, and a 17.4M-line Lean proof now under discussion. Using 1,946 tokens per page from his prior arXiv TeX sources implies ~487M output tokens for the book; a random 1.5% sample of the Lean at 35 tokens per line implies ~610M more. At Fable 5.2's $40 per million output tokens that is $44k in output alone, and ~$125k all-in using their AgentX dataset for the token mix. Then they apply the overhead seen in Anthropic's August partial result (31M tokens used vs ~3.3M in released artifacts, i.e. ~89% thinking-and-retry overhead; that result proved 67.2% of nontrivial zeros lie on the critical line, today's claim covers all of them), lifting the estimate to ~$1.17M, more than the Clay Mathematics Institute's $1M prize. Caveat: the workload shape is unknown; weeks of human-in-the-loop work may have been a small fraction of total cost, or the asynchronous agentic runs that produced the proof may be most of it.", "tweet_url": "https://x.com/SemiAnalysis_/status/2124006824525299715", "images": ["https://pbs.twimg.com/media/HXn88xAWkAAx4Wt.jpg", "https://pbs.twimg.com/media/HXn88wWXwAAFJEF.jpg", "https://pbs.twimg.com/media/HXn88ygWUAABpM1.jpg", "https://pbs.twimg.com/media/HXn88w_XsAEBWGa.jpg", "https://pbs.twimg.com/media/HXn88zjXIAAZm41.jpg", "https://pbs.twimg.com/media/HXn88w8WYAAWq6E.jpg", "https://pbs.twimg.com/media/HXn88xOWkAAFFI9.jpg", "https://pbs.twimg.com/media/HXn88xBXgAAVo0_.jpg"], "type": "thread", "created_at": "2026-11-21T05:07:43.000Z"}, {"author": "balajis", "summary": "\"Incredible that this actually happened, seven years later. We are in a completely new world.\" Reports the Lean proof seems to hold up: \"The Riemann hypothesis is proven, but not yet understood.\" His takeaway: the smarter you are, the smarter the AI is, \"amplified intelligence, more than purely artificial intelligence.\" Posted while quoting an old challenge to anyone who wants to ban lying online: write a function that returns whether a statement is true, starting with the Riemann Hypothesis.", "tweet_url": "https://x.com/balajis/status/2124099490110193793", "images": ["https://pbs.twimg.com/media/HXpQ-f4XMAAZNtU.jpg"], "type": "thread", "created_at": "2026-11-21T11:15:56.000Z"}, {"author": "nicbstme", "summary": "\"It's absolutely amazing and yet my level of surprise is 0. Anything verifiable will be one-shotted.\"", "tweet_url": "https://x.com/nicbstme/status/2124023302125756570", "images": [], "type": "tweet", "created_at": "2026-11-21T06:13:12.000Z"}, {"author": "AndrewCurran_", "summary": "Shares Scott Aaronson's new blog post with a screenshot, presumably his take on the proof claim.", "tweet_url": "https://x.com/AndrewCurran_/status/2123995991523442761", "images": ["https://pbs.twimg.com/media/HXnzGLXbwAAf-Bx.jpg"], "type": "thread", "created_at": "2026-11-21T04:24:40.000Z"}, {"author": "zeroxkyle", "summary": "Everyone clowns the people hating on data centres, but he is not surprised the average person hates AI given that so far it has produced massive cyberattacks on core critical infrastructure, \"ruined the livelihoods of math professionals (every academic I know is crying about the latest proof)\", and caused layoffs or executives saying they want layoffs.", "tweet_url": "https://x.com/zeroxkyle/status/2124068554974847299", "images": [], "type": "tweet", "created_at": "2026-11-21T09:13:01.000Z"}]}, {"cluster": "FBI NCIC Breach and Algonquin Dam Hack — Holiday Threat Season", "category": ["tech", "geopolitics", "society"], "description": "Two critical-infrastructure intrusions reported overnight, with security accounts warning the holiday window is prime time for attackers.", "items": [{"author": "AndrewCurran_", "summary": "The FBI has been hacked: the National Crime Information Center, the database used for warrants and background checks, was breached, with no agency statement yet on what data was accessed (CNN). Separately, the Algonquin Dam on the Fox River was hit by a cyberattack (CBS Chicago); he notes the gates are remotely controlled.", "tweet_url": "https://x.com/AndrewCurran_/status/2123983987370528782", "images": ["https://pbs.twimg.com/media/HXnoLeBbcAA7uMn.jpg"], "type": "thread", "created_at": "2026-11-21T03:36:58.000Z"}, {"author": "lopp", "summary": "Cybersecurity defenders dread the holidays because that is when threat actors love to strike. \"Stay frosty!\"", "tweet_url": "https://x.com/lopp/status/2124127956398428469", "images": [], "type": "tweet", "created_at": "2026-11-21T13:09:03.000Z"}, {"author": "zachxbt", "summary": "Identifies the operator of Google Ads phishing scams who once hit a $55M drainer \"lick\" as a US-based threat actor from The Com using the alias \"Single\"; the accounts have since been deactivated. Screenshots.", "tweet_url": "https://x.com/zachxbt/status/2124000968656515308", "images": ["https://pbs.twimg.com/media/HXoELSoakAIjScI.jpg", "https://pbs.twimg.com/media/HXoELSqbAAEeNj7.jpg", "https://pbs.twimg.com/media/HXoGO9taIAA6GQF.jpg", "https://pbs.twimg.com/media/HXoGO9vaQAAGzSM.jpg"], "type": "thread", "created_at": "2026-11-21T04:44:27.000Z"}]}, {"cluster": "Netflix's 'The Altruists' — FTX Saga Rewritten, CZ Cast as Villain", "category": ["crypto", "society"], "description": "Netflix's eight-episode FTX series lands and crypto insiders object to its framing of SBF and Caroline Ellison as groomed by CZ.", "items": [{"author": "Fiskantes", "summary": "Deadpan sarcasm at the show's accuracy: quoting criticism that Netflix makes SBF and Caroline look pressured and groomed by CZ, he says he \"was there\" (the tall Asian guy in the denim jacket in the background) and \"that's literally what happened\", including Caroline in a goth dress and CZ saying \"No Bueno\". On the line \"you don't need to invent a villain when the story already has one\": unless the villain gave you a lot of money and you fund a show to rehab his reputation with the mainstream.", "tweet_url": "https://x.com/Fiskantes/status/2123943585909559491", "images": [], "type": "thread", "created_at": "2026-11-21T00:56:26.000Z", "tweet_urls": ["https://x.com/Fiskantes/status/2123943585909559491", "https://x.com/Fiskantes/status/2124055576225501540"]}, {"author": "VitalikButerin", "summary": "To CZ: the show \"foreign-ized\" his accent about 3x more than Vitalik remembers him speaking, and leans on the \"only reason to go to foreign countries is to be sketchy\" meme. \"I think we're far enough from woke that it's ok to start using the word 'racist' again?\"", "tweet_url": "https://x.com/VitalikButerin/status/2123942992981672129", "images": [], "type": "tweet", "created_at": "2026-11-21T00:54:05.000Z"}, {"author": "mhonkasalo", "summary": "Funniest part so far: SBF portrayed as absolutely horrified at the idea of frontrunning customers, \"literally in shock at even the mention\". Screenshot.", "tweet_url": "https://x.com/mhonkasalo/status/2124086176462033298", "images": ["https://pbs.twimg.com/media/HXpFHmxXcAE9_c3.jpg"], "type": "tweet", "created_at": "2026-11-21T10:23:02.000Z"}, {"author": "balajis", "summary": "Someone should use a video model to tell the real story of what happened; no need to be bottlenecked on Hollywood anymore. Calls the Netflix version \"completely fake\" and suggests the same treatment for a realistic short film on the story of OpenAI.", "tweet_url": "https://x.com/balajis/status/2124110461398605963", "images": [], "type": "thread", "created_at": "2026-11-21T11:59:32.000Z"}, {"author": "hosseeb", "summary": "Context: a 14-year-old's interview with SBF (was FTX worth it, his p(doom), why only $500M into Anthropic, whether he'd flip a 51/49 coin for his freedom, FTX almost becoming a political prediction market) was overshadowed by Haseeb's own viral clip. He DMed the teen, who was disappointed but gracious and intends to keep at it. \"I default respect any young person entering the arena.\"", "tweet_url": "https://x.com/hosseeb/status/2123989175926194233", "images": ["https://pbs.twimg.com/media/HXns5NtaAAAFzmX.png"], "type": "tweet", "created_at": "2026-11-21T03:57:36.000Z"}]}, {"cluster": "New Model Drops — Inkling 2 Mini, GPT-6.2 Robotics, AI R&D Time Horizons", "category": ["AI", "tech"], "description": "A dense week of releases and research: a 26B-parameter laptop model, a robotics capability jump at OpenAI, and new data on how fast agents' task horizons are growing.", "items": [{"author": "udiWertheimer", "summary": "Thinking Machines' Inkling 2 Mini is a 26B-parameter looped transformer (after complaints that Inkling 2 Small at 594B was too big), small enough to run on a laptop and scoring 20.1 on the AA Index. Udi's framing: it runs on a $1,000 laptop and is 50% smarter than GPT-4o, \"the model that Michael Saylor used to invent $STRC and lose $15 billion dollars\".", "tweet_url": "https://x.com/udiWertheimer/status/2123972765858279547", "images": [], "type": "thread", "created_at": "2026-11-21T02:52:23.000Z"}, {"author": "AndrewCurran_", "summary": "GPT-6.2's robotics results show the same unusual and unexpected jump in capabilities that Anthropic observed in Fable 5.2; the improvement was significant enough that OpenAI restructured its dedicated robotics team.", "tweet_url": "https://x.com/AndrewCurran_/status/2123957498638147680", "images": ["https://pbs.twimg.com/media/HXnQFufb0AAAj9X.jpg"], "type": "tweet", "created_at": "2026-11-21T01:51:43.000Z"}, {"author": "cryptopunk7213", "summary": "Summarizes a new research update on AI R&D-relevant capabilities: long-time-horizon capability is doubling every 3.6 months, \"astoundingly quick\"; on trend, agents solve 200+ hour tasks by July 2027, which happens to be when the AI 2027 authors predict AIs smarter than expert human AI researchers; the bottleneck is now too few expert humans to benchmark agents against; agents are getting good at designing their own low-level evals but remain bad at complex research taste.", "tweet_url": "https://x.com/cryptopunk7213/status/2123983465376833793", "images": ["https://pbs.twimg.com/media/HXnntKTWQAA4lkF.jpg", "https://pbs.twimg.com/media/HXnntKZWYAApNWR.jpg"], "type": "tweet", "created_at": "2026-11-21T03:34:54.000Z"}, {"author": "PeterDiamandis", "summary": "Teases Ray Kurzweil's next book (cover image). Separately: the best way to get the general population to trust AI is to solve the problems that affect them daily, prices, diseases, the environment; \"the opportunities for the industry are endless\".", "tweet_url": "https://x.com/PeterDiamandis/status/2124011891576234107", "images": ["https://pbs.twimg.com/media/HXoBjzWa8AALSO-.jpg"], "type": "thread", "created_at": "2026-11-21T05:27:51.000Z", "tweet_urls": ["https://x.com/PeterDiamandis/status/2124011891576234107", "https://x.com/PeterDiamandis/status/2124118297159291342"]}]}, {"cluster": "Anthropic IPO Aftermath — Tokenized ANT, Underwriter Economics, Listings Compared", "category": ["tech", "crypto", "positioning"], "description": "The week's mega-listing keeps generating commentary on who made money, how tokenized versions traded, and what the post-listing path tends to look like.", "items": [{"author": "theallinpod", "summary": "New episode E298: Anthropic IPO, market tanking, Nvidia in crisis.", "tweet_url": "https://x.com/theallinpod/status/2123978132550025252", "images": [], "type": "thread", "created_at": "2026-11-21T03:13:43.000Z"}, {"author": "dampedspring", "summary": "In a reply thread about a recent mega-IPO's lead underwriter (context points to the Anthropic deal): the bank was paid half a billion dollars to make the deal work, and having personally managed the greenshoe and aftermarket trading on scores of deals, he says the lead-underwriter position makes trading that exposure \"as easy as shooting fish in a barrel\". Only crappy deals that never lift above the issue price are tricky and put the underwriter at risk.", "tweet_url": "https://x.com/dampedspring/status/2123940657857261974", "images": [], "type": "thread", "created_at": "2026-11-21T00:44:48.000Z"}, {"author": "WazzCrypto", "summary": "Defends putting \"the two biggest listings ever\" side by side: his point is the post-listing \"scam pump\" followed by a slow bleed into unlocks. Concedes sentiment is heavily different now with the AI trade mostly unwinding, so it could behave very differently.", "tweet_url": "https://x.com/WazzCrypto/status/2124122207768973551", "images": [], "type": "thread", "created_at": "2026-11-21T12:46:13.000Z"}, {"author": "laurashin", "summary": "Tokenized stocks on Base launched outside the US ahead of the SEC's innovation exemption; Jesse Pollak now says the plan is to bring them to the US with voting rights and dividends (interview link).", "tweet_url": "https://x.com/laurashin/status/2124118238355444073", "images": [], "type": "tweet", "created_at": "2026-11-21T12:30:26.000Z"}]}], "B_insights": [{"author": "0x_Kun", "summary": "A multi-part argument that the AI equity case is \"too basic\". If AI can cure cancer, why can't it work out how to do the same thing with a hundredth of the resources? Frontier labs have every incentive to fix their cost structure first and will probably solve that before cancer or quantum, so if you believe the rapid-AGI story, no input into AI is \"cheap\": its success destroys the value of its own inputs, compressing both demand and supply, and lowers barriers to entry at the frontier. Framework: X is value created, Y is an asset's ability to capture a share of X; the internet and crypto being big never guaranteed investors made money. Usage is not shareholder value: many non-paying users, competition compressing margins, VC billions funding non-performing companies that create artificial chip demand, higher rates for longer. Not a monopoly even with an edge now; OpenAI went from leader to second in two years as talent moved. Warns against a 50% portfolio bet and against \"dragging people in\", since it's easy to talk long term and hard to live it. \"I would fire an analyst for this reasoning quality.\" In replies: AI-driven deflation can't work in a debt-based credit system, since debt gets more expensive in real terms and wages fall with prices, so governments will print even more to maintain inflation, which is why he stays long-term bullish on hard assets.", "tweet_url": "https://x.com/0x_Kun/status/2124018455925887188", "images": [], "type": "thread", "created_at": "2026-11-21T05:53:56.000Z", "tweet_urls": ["https://x.com/0x_Kun/status/2124018455925887188", "https://x.com/0x_Kun/status/2124116299240641014", "https://x.com/0x_Kun/status/2124012437330678265", "https://x.com/0x_Kun/status/2124017438522229071"]}, {"author": "0x_Kun", "summary": "On volatility and asymmetry. Most people \"invest\" knowing they can't handle volatility, like choosing boxing knowing you can't take a punch; panicking in a drawdown you could have defined as normal in advance is absurd. Volatility is only risk if you have to sell, which means over-investing or leverage; it is also \"the vitality of markets\". Always start from the view that you could be wrong: position so that being wrong doesn't take you out while being right does extraordinarily well; that asymmetry is the foundation of investing. \"Too volatile\" is one of the worst ways to judge an asset: people said it about Bitcoin while NVDA dropped 50% in a week and gold's volatility now exceeds what goldbugs mocked Bitcoin for; a bond isn't a better asset because it moves less. Never all in one thing, never money you need short term; \"people need to hedge against self stupidity, especially when they can afford to\".", "tweet_url": "https://x.com/0x_Kun/status/2123964462701085115", "images": [], "type": "thread", "created_at": "2026-11-21T02:19:23.000Z", "tweet_urls": ["https://x.com/0x_Kun/status/2123964462701085115", "https://x.com/0x_Kun/status/2123961709564154128", "https://x.com/0x_Kun/status/2124008964086222952", "https://x.com/0x_Kun/status/2124009462021435608"]}, {"author": "0x_Kun", "summary": "Replying to a viral lament (\"why did no one in my entire bloodline lock in and make millions\"): this misunderstands wealth, which is a process, not an outcome. Many people's ancestors made generational wealth and then lost it; the belief that wealth simply stays once made is exactly why heirs lose it and their kids repeat the complaint. Most people don't know their family history; trace both parents' lines and you'll find landlords and speculators who made and lost it in the same generation. To break the cycle, first admit you are more like your parents than you care to admit and understand them; those convinced they are different usually repeat the same mistake.", "tweet_url": "https://x.com/0x_Kun/status/2124006626374115793", "images": [], "type": "thread", "created_at": "2026-11-21T05:06:56.000Z"}, {"author": "gregisenberg", "summary": "Five days with early access to Gemini 4 Neon (disclosed: Google sponsored the episode). Ten uses: /swarm with a researcher, designer and engineers pointed at a niche app and left to run overnight; physics good enough to mock up hardware or a small game before spending a dollar; messy invoices into a financial model, \"like a CFO on call\"; paste a local business's website and have it build a calculator or new homepage, a cash-flow idea; mini games or 3D customizers behind an email box as lead magnets; every customer call from last quarter into AI Studio (about a million tokens of context that \"stays sharp\") to find what you promised and never shipped; best model he's tried for lead routing, CRM cleanup and invoice reconciliation; Orchestrator mode in Antigravity where Neon thinks and the cheaper Hydrogen types; thinking set to high in Antigravity scored three times higher on a coding test; a good writer once told to drop em dashes, but brief by default. TLDR: very good and far cheaper, so run more projects and more agents.", "tweet_url": "https://x.com/gregisenberg/status/2123943441017028866", "images": [], "type": "thread", "created_at": "2026-11-21T00:55:51.000Z"}, {"author": "theallinpod", "summary": "David Friedberg: restricting open-source AI is a path to tyranny. Open source must be allowed and encouraged to proliferate because any group with power over what people see, do and access, and over the weights on \"facts of history\", \"proven science\" and \"the truth\", becomes tyrannical even without intending to, because it believes it is right and acts on it. Regulate, litigate and criminally penalize the outputs people produce with software, but restricting, labelling or controlling the software itself creates a regulated monopoly for closed-source products that, aligned with government agencies, gives those agencies and corporations power over individuals and leaves no business operating freely. \"None of us should want that. I don't care what your political affiliation is.\"", "tweet_url": "https://x.com/theallinpod/status/2123994998156722681", "images": [], "type": "tweet", "created_at": "2026-11-21T04:20:44.000Z"}, {"author": "thedefiedge", "summary": "Weekly top-7 reads, framed by one number: ETH and SOL have lost about $440B since the October 2025 top, roughly 650 years of Hyperliquid revenue, so revenue can't fill the hole. (1) Theia on why crypto feels so bad: fundamentals fine, but falling majors wiped out more wealth than years of revenue can replace; the way out is more revenue tokens like HYPE or a recovery in the majors. (2) Four Pillars tracked every CEX and DEX listing of tokenized Anthropic: DEXs did 4.2x the CEX spot volume but the total was tiny next to Nasdaq, so tokenized stocks still have a liquidity problem. (3) A year of order-book data shows Hyperliquid's long-tail liquidity edge slipping against Binance, traced to rules that favor the biggest makers. (4) Castle Labs: the top 10 protocols earned 47% of revenue but delivered 73% of tokenholder returns, a framework for real token value vs vanity revenue. (5) A guide to LPing on Metric, a DEX where LP positions follow price. (6) Stoic looked at 18 similar S&P selloffs: 9 saw a deeper correction after the first bounce, worth reading before sizing into the first relief rally. (7) When Lighter paused withdrawals this week, users could still withdraw straight from its Ethereum contract.", "tweet_url": "https://x.com/thedefiedge/status/2123947710042780067", "images": [], "type": "thread", "created_at": "2026-11-21T01:12:49.000Z"}, {"author": "saxena_puru", "summary": "GPU rental prices are still rising (chart): a \"serious disconnect between AI fundamentals and stocks\". Pairs it with Amazon CEO Andy Jassy on CNBC (Nov 17): AI revenue at AWS is over $25B and growing 440 times faster than AWS did, \"very early innings\", ROI on AI capex \"very compelling\", with strong visibility into demand.", "tweet_url": "https://x.com/saxena_puru/status/2123983191048613991", "images": ["https://pbs.twimg.com/media/HXnnUbmboAAgLyC.jpg"], "type": "thread", "created_at": "2026-11-21T03:33:49.000Z", "tweet_urls": ["https://x.com/saxena_puru/status/2123983191048613991", "https://x.com/saxena_puru/status/2124113942490567010"]}, {"author": "VKMacro", "summary": "Nuance on the GPU-rental-price debate: the rising prices being referenced are spot-market prices, and most hyperscalers don't sell into spot, asking instead for medium-term contracts. The spot market is a small fraction of the overall rental market and is dominated by neoclouds.", "tweet_url": "https://x.com/VKMacro/status/2124058787795583364", "images": [], "type": "tweet", "created_at": "2026-11-21T08:34:12.000Z"}, {"author": "stacy_muur", "summary": "On BarterLend, a fixed-rate RWA lending market launching on Monad: a tough market, since Monad already has four established lending protocols with ~$467M in active loans, mostly variable-rate, so Barter would be up against Aave, Euler and Morpho. Her path to winning: don't compete in general-purpose lending but become the term-funding venue for a few large borrowing strategies, via maturity-matched financing, concentrated liquidity, distribution through strategy operators and predictable repayments. One of the few protocols she wants to see succeed.", "tweet_url": "https://x.com/stacy_muur/status/2124113345699873112", "images": [], "type": "tweet", "created_at": "2026-11-21T12:11:00.000Z"}, {"author": "stacy_muur", "summary": "A reminder for emerging teams on when paid ads are burning money: judging by ROAS alone; ignoring falling CTR while conversions hold; not investigating high CTR with fewer conversions; overlooking rising CPMs with flat CTR; running ads as CTR and conversion decline; rarely testing new creative; ignoring frequency and creative fatigue; reacting to a single bad day; not comparing 7-day vs 30-day trends; waiting for ROAS to drop before investigating. Often paid ads aren't efficient at all, so benchmark CAC by channel; they are the most-used channel at $50M+ ARR because those teams can afford it.", "tweet_url": "https://x.com/stacy_muur/status/2124057232375792021", "images": ["https://pbs.twimg.com/media/HXoqy-6aoAAktmW.jpg"], "type": "tweet", "created_at": "2026-11-21T08:28:01.000Z"}, {"author": "izebel_eth", "summary": "Perps are a much better instrument than either prediction markets or memecoins, both for liquidity and expected-value reasons and because they can be viewed as markets rather than gambling. Kalshi tries to dress this up with \"corporate hedges\", but the correct, liquid price of BTC, the S&P 500 or gold is an actual public good. Expects regulators to come after perps anyway even though they shouldn't.", "tweet_url": "https://x.com/izebel_eth/status/2123951007608803697", "images": [], "type": "thread", "created_at": "2026-11-21T01:25:55.000Z"}, {"author": "marcvanderchijs", "summary": "What would you do if you knew AI would take control in 12 months and life as we know it might end? He wrote a novel about it, \"The Notice Period\" (with AI's help), published on Amazon as ebook and paperback and, since Amazon wouldn't allow a zero price, free on the Internet Archive. The aim is to make people think about how they would change their behaviour knowing life was over in a year.", "tweet_url": "https://x.com/marcvanderchijs/status/2124067986260811808", "images": [], "type": "thread", "created_at": "2026-11-21T09:10:45.000Z"}], "C_contrarian": [{"author": "AndreasSteno", "summary": "CONTRARIAN to the week's mood: \"the hardest message to get across right now is that AI is actually underhyped.\" Most people, including many who work in AI, seem to want it to fail, perhaps human nature given implications that are enormous, largely unknown and unsettling. On margins: \"there is plenty for everyone\", a large bid for the frontier from everything competitive; models will be sold at a margin to the price of compute, \"not that difficult\", just as commodities sell at a margin to input costs. DISAGREES with 0x_Kun (Section B), who argues efficiency gains make AI's inputs uninvestable.", "tweet_url": "https://x.com/AndreasSteno/status/2124080341694476744", "images": [], "type": "thread", "created_at": "2026-11-21T09:59:51.000Z"}, {"author": "beaniemaxi", "summary": "CONTRARIAN on ETH: when you think things can't get worse, remember Ethereum is still valued at $200B. He called it overvalued at $300B and says it is still \"ridiculously overvalued\".", "tweet_url": "https://x.com/beaniemaxi/status/2123993707489702133", "images": [], "type": "thread", "created_at": "2026-11-21T04:15:36.000Z"}, {"author": "alpha_pls", "summary": "MINORITY VIEW on the cycle: quoting news that Bitcoin Core patched an AI-found bug that could stall nodes, he notes early Bitcoin was defined by \"what if there is a bug and it goes to zero\" FUD until enough time passed; we have been dragged back into that phase, and only time overcomes it. His map: 2027 is 2019, maybe another scare in 2028, new highs late 2028/29. But if quantum isn't convincingly addressed next year, the odds are much higher that this is Bitcoin's first failed cycle.", "tweet_url": "https://x.com/alpha_pls/status/2124045436763660440", "images": [], "type": "tweet", "created_at": "2026-11-21T07:41:09.000Z"}, {"author": "zeroxkyle", "summary": "CONTRARIAN on BTC as digital gold: the headwinds keep mounting. (1) Digital-asset treasuries unwinding; (2) former miners turned AI neoclouds (Mara etc.) selling BTC off their balance sheets; (3) Saylor overhang via STRC mechanics and future financing issues; (4) quantum fears, with already-rich whales asking why take the risk. These dilute the digital-gold narrative and slow flows; any sane investor waits for the dust to settle. Options and perp flows outweighing spot buying signal that no one believes as they used to; as ownership falls BTC becomes less a store of value and more a commodity-like index of volatility rather than something that goes \"up over time\". Natural consequence: the broader crypto market de-correlates from BTC. Posted agreeing with a take that BTC's grip on altcoins is weakening (Hyperliquid and Venice both >100% YTD) and that this is a good thing.", "tweet_url": "https://x.com/zeroxkyle/status/2124133667962552627", "images": [], "type": "tweet", "created_at": "2026-11-21T13:31:45.000Z"}], "D_positioning": [{"author": "DCinvestor", "summary": "Going out on a limb: some stuff \"absolutely looks oversold\". Wishes he hadn't already spent all his money on tokens, because \"some people are going to make an absolute killing buying this weekend\". A perfectly valid strategy: close your eyes and buy over the next 2-3 weeks, then log off for two months and play video games with family. Cycle view he laid out months ago: if this rhymes with prior cycles, the ETH bottom is already in from the summer, while the BTC bottom is only now here or still to come. Only two kinds of crypto Thanksgivings exist, euphoric and extremely depressed; guess which is on the menu.", "tweet_url": "https://x.com/DCinvestor/status/2123981169889104213", "images": [], "type": "thread", "created_at": "2026-11-21T03:25:47.000Z", "tweet_urls": ["https://x.com/DCinvestor/status/2123981169889104213", "https://x.com/DCinvestor/status/2123984921949782310", "https://x.com/DCinvestor/status/2124032213494960572", "https://x.com/DCinvestor/status/2124034837728440830", "https://x.com/DCinvestor/status/2124009011410534684"]}, {"author": "cointradernik", "summary": "His fully systematic BTC strategy flipped long today after being flat since Nov 5 (only one day of exposure since Oct 29, so it dodged most of the drop, unlike his discretionary spot position). Explicitly not a bottom call: \"it can flip back to flat tomorrow\". Track record: +29% YTD vs -32.7% for BTC. Going live on RR Pro this week.", "tweet_url": "https://x.com/cointradernik/status/2124081244296097993", "images": [], "type": "thread", "created_at": "2026-11-21T10:03:26.000Z"}, {"author": "dampedspring", "summary": "Fund update: +8.5% in excess of cash this year against a 10% return / 10% vol target, with the first ten months run well below risk target, \"not the greatest year but pretty good as designed\". Negatively correlated to beta, so combined alpha/beta is 800bp ahead of SPY. Also: \"not really short anymore\", conviction medium.", "tweet_url": "https://x.com/dampedspring/status/2124094968838914252", "images": [], "type": "thread", "created_at": "2026-11-21T10:57:59.000Z", "tweet_urls": ["https://x.com/dampedspring/status/2124094968838914252", "https://x.com/dampedspring/status/2124098978547470730"]}, {"author": "zeroxkyle", "summary": "Genuinely no clue what to buy in equities: the MAGS are now industrial companies with zero FCF and billions sunk into hard infrastructure; AI stocks are cyclical and need time to bottom, and buying what is coming off the highs fastest is rarely best. Financials? Gold? S&P and log off? Says now is the time to figure out what to buy, with the holiday coming in a few months. After trying this about 20 times, this spot \"genuinely feels the worst it's ever been\"; previous attempts used a small part of his portfolio, now he is doing the work to allocate his main portfolio into a basket of equities. Never uses leverage: \"that's how I've survived for 5 years\".", "tweet_url": "https://x.com/zeroxkyle/status/2123950343486931253", "images": ["https://pbs.twimg.com/media/HXoyzWya8AEpvaj.jpg"], "type": "thread", "created_at": "2026-11-21T01:23:17.000Z", "tweet_urls": ["https://x.com/zeroxkyle/status/2123950343486931253", "https://x.com/zeroxkyle/status/2123977517384298498"]}, {"author": "zeroxkyle", "summary": "Quoting field notes that management teams across memory, optics, neoclouds, semis, semicap and substrates are frustrated and confused by their stock prices but still \"very, very bullish\" on 2027 capex: he needs someone to tell him when these guys give up, \"then we can do MOALs\" (mother-of-all-longs).", "tweet_url": "https://x.com/zeroxkyle/status/2124119422252224663", "images": [], "type": "tweet", "created_at": "2026-11-21T12:35:09.000Z"}, {"author": "sjdedic", "summary": "\"The only job right now is to survive.\" No hero trades, no leverage, no proving anything to anyone; just make sure you're still in the game when it turns. \"Staying = winning.\" Clarifies he is not saying it has turned yet.", "tweet_url": "https://x.com/sjdedic/status/2124085627423780864", "images": [], "type": "thread", "created_at": "2026-11-21T10:20:51.000Z"}, {"author": "zeroxkyle", "summary": "Complementary to sjdedic: in light of current conditions, a reminder from an eGirl Capital essay: \"A real tangible edge that you can manufacture for yourself and use to win is simply just not dying... Just don't die. And if you survive, you'll have no choice but to make it.\"", "tweet_url": "https://x.com/zeroxkyle/status/2124066872685678735", "images": ["https://pbs.twimg.com/media/HXozQgKbAAAU8Hj.png"], "type": "tweet", "created_at": "2026-11-21T09:06:20.000Z"}, {"author": "ASvanevik", "summary": "Finds it amusing that mzeller is \"crushing it\" shorting AAVE; Nansen screenshots of the position.", "tweet_url": "https://x.com/ASvanevik/status/2124040289627333037", "images": ["https://pbs.twimg.com/media/HXobYnBasAAZ_BB.jpg", "https://pbs.twimg.com/media/HXobYnDaAAAL4XK.jpg"], "type": "thread", "created_at": "2026-11-21T07:20:42.000Z"}, {"author": "Evan_ss6", "summary": "\"Bid the Sunday gap down.\" Self-described approach to this tape: \"That's why I don't trade, I fade.\"", "tweet_url": "https://x.com/Evan_ss6/status/2123999835724427430", "images": [], "type": "thread", "created_at": "2026-11-21T04:39:57.000Z", "tweet_urls": ["https://x.com/Evan_ss6/status/2123999835724427430", "https://x.com/Evan_ss6/status/2123995453750653056"]}, {"author": "udiWertheimer", "summary": "Asked what he would buy: $AAPL and $ANT, \"but not yet lol\".", "tweet_url": "https://x.com/udiWertheimer/status/2123968980150866060", "images": [], "type": "tweet", "created_at": "2026-11-21T02:37:20.000Z"}], "E_links": [{"author": "Chartfest1", "url": "https://helenemeisler.substack.com/p/saturday-chart-fest-655", "tweet_url": "https://x.com/Chartfest1/status/2124099561270710446", "note": "Helene Meisler's Saturday Chart Fest #655"}, {"author": "BobEUnlimited", "url": "https://youtu.be/WbQoMMoZW7A", "tweet_url": "https://x.com/BobEUnlimited/status/2124106549090001000", "note": "MacroTalk with Bob Elliott and AahanPrometheus: mechanics of a correction turning into a bear market (chart discussion at t=2146s)"}, {"author": "AndrewCurran_", "url": "https://www.cnn.com/2026/11/20/politics/fbi-hacked-again-target-crime-database", "tweet_url": "https://x.com/AndrewCurran_/status/2123983987370528782", "note": "CNN: FBI hacked again, National Crime Information Center breached"}, {"author": "AndrewCurran_", "url": "https://www.cbsnews.com/chicago/news/algonquin-dam-fox-river-cyberattack/", "tweet_url": "https://x.com/AndrewCurran_/status/2123983987370528782", "note": "CBS Chicago: cyberattack on the Algonquin Dam on the Fox River"}, {"author": "AndrewCurran_", "url": "https://scottaaronson.blog/?p=10344", "tweet_url": "https://x.com/AndrewCurran_/status/2123995991523442761", "note": "Scott Aaronson blog post shared amid the Riemann Hypothesis proof claim"}, {"author": "dampedspring", "url": "http://x.com/i/article/2085326286600232960", "tweet_url": "https://x.com/dampedspring/status/2124107065744298217", "note": "Totem Macro (Whitney) explainer, originally published July 7, 2026; dampedspring: 'extremely strong views, worth reading this weekend'"}, {"author": "TKL_Adam", "url": "https://x.com/i/article/2123757028350791680", "tweet_url": "https://x.com/TKL_Adam/status/2123989916983959814", "note": "The Kobeissi Letter article: liquidity must be restored for markets to bottom"}, {"author": "VKMacro", "url": "https://x.com/i/article/2123849094036881408", "tweet_url": "https://x.com/VKMacro/status/2124038204252999762", "note": "Stripe agentic commerce data release ahead of the holiday season; VKMacro: 'pretty cool'"}, {"author": "udiWertheimer", "url": "https://thinkingmachines.ai/news/inkling-2-mini/", "tweet_url": "https://x.com/udiWertheimer/status/2123972765858279547", "note": "Thinking Machines: Inkling 2 Mini, 26B-parameter looped transformer, 20.1 on AA Index"}, {"author": "gregisenberg", "url": "http://youtube.com/watch?v=tCY7zMknCJQ", "tweet_url": "https://x.com/gregisenberg/status/2123943441017028866", "note": "Startup Ideas Podcast episode on Gemini 4 Neon (Google-sponsored)"}, {"author": "laurashin", "url": "https://youtu.be/AzSxV1_VqqI", "tweet_url": "https://x.com/laurashin/status/2124118238355444073", "note": "Laura Shin interview with Jesse Pollak on tokenized stocks on Base coming to the US"}, {"author": "theallinpod", "url": "https://x.com/theallinpod/status/2123907992043057594", "tweet_url": "https://x.com/theallinpod/status/2123978132550025252", "note": "All-In Podcast E298: Anthropic IPO, market tanking, Nvidia in crisis"}, {"author": "thedefiedge", "url": "https://thedefiedge.com/join/", "tweet_url": "https://x.com/thedefiedge/status/2123947710042780067", "note": "The DeFi Edge weekly newsletter (source of the top-7 reads thread)"}, {"author": "marcvanderchijs", "url": "https://archive.org/details/the-notice-period", "tweet_url": "https://x.com/marcvanderchijs/status/2124067986260811808", "note": "'The Notice Period', AI-takeover novel, free ebook on the Internet Archive (also on Amazon: https://a.co/d/07CC05mw)"}, {"author": "zeroxkyle", "url": "https://www.egirlcapital.com/writings/dE4AzaSbREOMppMqRmFpuA", "tweet_url": "https://x.com/zeroxkyle/status/2124066872685678735", "note": "eGirl Capital essay: 'just don't die' as a manufacturable edge"}]}, "coverage": {"authors_covered": 49, "authors_total": 63, "coverage_pct": 78}};

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
