<script>
const ITEMS = [{"id": 1, "cat": "labor", "urgency": "act", "source": "Peter Boockvar / The Boock Report", "title": "ADP +90k vs 75k est — but 55k of it is health/education", "idea": "ADP private payrolls +90k (est. 75k, Aug 36k). Education/health +55k, leisure/hospitality +22k, manufacturing +17k, construction +15k (AI data centers helping both). Financial services -16k, professional/business services -11k, trade/transport/utilities flat. Stayers pay +3.0% y/o/y, changers +4.8%.", "angle": "The white-collar categories (finance, prof services) are the ones shrinking while data-center-adjacent blue collar grows — that is an AI labor-mix signal, not just a headline beat.", "tweetA": "Strip healthcare and leisure out of that 90k and you have ~13k. Finance and prof services are already negative while construction gets bailed out by data center builds. This is a labor market being reshaped by capex, not lifted by demand.", "tweetB": "Job changers get 4.8%, stayers 3%. That 180bp gap is the price of leaving — and the only sectors where people can leave for more are the ones building power and compute. Wage inflation is a sector story, not a macro one.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://peterboockvar.substack.com/p/good-jobs-number-but-still-from-same"}, {"id": 2, "cat": "labor", "urgency": "deep", "source": "Peter Boockvar / The Boock Report", "title": "Who is hiring: healthcare, data centers, upper-income leisure", "idea": "Boockvar's bottom line: gains are driven by healthcare, data centers and travel/restaurants/leisure 'benefiting from upper income spend'. Wages for both stayers and changers at least keep pace with inflation.", "angle": "Consistent with K-shaped spending: the jobs follow top-decile wallets and the capex cycle. Pairs with consumer confidence at 2014 lows.", "tweetA": "Consumer confidence at the lowest since 2014, and the marginal job is a waiter serving the top decile. Both statements are true at once. That's the K.", "tweetB": "Three engines of US payroll growth: aging (healthcare), AI capex (data centers), and rich people (leisure). None of them respond to a Fed hike the way housing does.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://peterboockvar.substack.com/p/good-jobs-number-but-still-from-same"}, {"id": 3, "cat": "macro", "urgency": "act", "source": "Peter Boockvar / The Boock Report", "title": "Williams takes an October hike off the table — 2y -6bp", "idea": "NY Fed's Williams: 'no need for urgency… time to gather more information', but one more hike 'may be appropriate late this year'. 2y yield fell 6bp on it. Boockvar: no hike at Oct 28 absent data surprises, especially pre-midterms; December more likely. He argues the market (yields) is doing the Fed's work and Warsh wants to let the market express itself.", "angle": "The Fed has become a two-meeting-ahead hostage to the long end: 30y at 2001/2002 highs while the front end is soothed. Curve steepening is the expression.", "tweetA": "The Fed's reaction function in one sentence: let the 30y do the tightening, keep the front end calm. Term premium is the policy tool now. Positioning for a bear steepener is the trade, not a Fed pivot.", "tweetB": "Williams: 'no urgency.' Also Williams: another hike late this year. The 2y bought the first half and ignored the second. That's a market that wants the dovish read badly.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://peterboockvar.substack.com/p/john-williams-calms-move-in-short"}, {"id": 4, "cat": "macro", "urgency": "deep", "source": "Peter Boockvar / The Boock Report", "title": "30y mortgage 7.3%: purchase apps -14% y/y, refis -56% y/y", "idea": "MBA 30y rate 7.3% vs 7.12% prior week and 6.79% a month ago. Purchase apps -4.3% w/w, -14% y/o/y. Refis down 6th straight week, -8.7% w/w, -56% y/o/y.", "angle": "A 51bp mortgage-rate rise in one month while Mando notes home prices are rising at the fastest pace in over a year — supply lock-in, not affordability, is setting prices.", "tweetA": "Mortgage rates up 51bp in a month, purchase apps -14% y/y, and home prices are accelerating anyway. That's not demand, that's a frozen supply chain of sellers.", "tweetB": "Six straight weeks of refi declines and -56% y/y. Every mortgage originator's earnings model is being re-underwritten in real time. And FICO just lost its pricing moat on top of it.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://peterboockvar.substack.com/p/john-williams-calms-move-in-short"}, {"id": 5, "cat": "macro", "urgency": "deep", "source": "Peter Boockvar / The Boock Report", "title": "CarMax: used unit comps +13% on price competitiveness, ASP +6.3%", "idea": "CarMax call: used unit comps +13% 'driven largely by improved price competitiveness', yet average selling price still +6.3% y/y. Stock +~5%. New CEO self-help.", "angle": "Volume up double digits with prices up 6% in the most rate-sensitive retail category, during a consumer-confidence collapse.", "tweetA": "Used unit comps +13% with ASP +6%. Rate-sensitive, confidence at 2014 lows, and someone is still writing the check. Follow the credit, not the survey.", "tweetB": "CarMax grew units by cutting prices — and still ended with higher ASP. Mix shift toward pricier used cars means the buyer at the margin is older, wealthier or leveraged. Which one?", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://peterboockvar.substack.com/p/john-williams-calms-move-in-short"}, {"id": 6, "cat": "energy", "urgency": "act", "source": "David Rosenberg / Early Morning with Dave", "title": "Saudi East-West pipeline is loading again: 12.5M bbl on 9 tankers since Sunday", "idea": "Nine tankers on the Red Sea coast have loaded ~12.5M barrels of crude since Sunday from the Saudi East-West pipeline, shut earlier this month after an attack. Rosenberg's headline: Gulf oil exports returning toward pre-war levels.", "angle": "Supply-side relief is arriving via the bypass route, not Hormuz. Doesn't resolve refined-product tightness (see Goldman).", "tweetA": "12.5M barrels in three days through a pipeline that was offline earlier this month. The 'Hormuz premium' is being arbitraged away by steel in the ground. WTI already back near $91-92.", "tweetB": "Everyone sold crude on the Red Sea headline. The barrels are coming out — the diesel isn't. Watch cracks, not Brent.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://www.earlymorningwithdave.com/p/some-good-news-coming-from-gulf-region"}, {"id": 7, "cat": "positioning", "urgency": "act", "source": "David Rosenberg / Early Morning with Dave", "title": "Bond bearishness and positioning at extremes — 'begging for a classic squeeze'", "idea": "Rosenberg's subhead: bearish bond sentiment and positioning have reached extremes and are 'begging for a classic short squeeze'. (Only the intro was visible in the email body; full article behind link.) Context from other sources: 30y at highest since 2001/02, 10y mid-5%.", "angle": "Contrarian counter to the 'term premium is the policy' view. Squeeze risk rises exactly when a Fed hike is taken off the table.", "tweetA": "Everyone is short duration, the 30y is at a 25-year high, and the Fed just told you October is off. That's the setup for the ugliest bond rally of the year. Not a call — a positioning observation.", "tweetB": "Term premium bull markets end when the last bear capitulates. Positioning at extremes + Williams + oil rolling over. The squeeze doesn't need a reason, it needs a trigger. $TLT", "charts": {"count": 0, "hot": false, "desc": "Full article likely has positioning charts — worth opening"}, "link": "https://www.earlymorningwithdave.com/p/some-good-news-coming-from-gulf-region"}, {"id": 8, "cat": "energy", "urgency": "deep", "source": "Dark Side of the Boom (Goldman notes)", "title": "Goldman: barrels are back via adaptation, but the fuel squeeze isn't over", "idea": "Goldman (Yulia Zhestkova Grigsby): Persian Gulf exports recovered through improvised routing; diesel, gasoline and jet exports remain severely constrained, so crude recovery gives no immediate relief. Goldman's estimated 'dark flows' are central to the recovery math, so shipping-data revisions are the test. Lower Brent forecasts depend on sustained flows; depleted stocks and infrastructure risk explain why buyers still pay for protection.", "angle": "Crude vs products decoupling: refiners and product cracks are the trade, and the estimate that 'barrels are back' rests on unobservable dark flows.", "tweetA": "Goldman's bull case for lower Brent rests on flows it estimates it can't see. If dark-flow revisions go the wrong way, the 'barrels are back' story unwinds fast. Texas just declared a disaster over diesel prices. Products are the tell.", "tweetB": "Crude got the headline, products have the problem. Diesel, gasoline and jet exports still constrained while WTI drifts to $91. Refining margins tell you which market is lying.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/goldmans-oil-map-the-barrels-are"}, {"id": 9, "cat": "geopolitics", "urgency": "deep", "source": "Dark Side of the Boom (Goldman notes)", "title": "Goldman midterms: Dem House >90%, Senate >60% — the Senate trade is 'far from done'", "idea": "Goldman's relaunched US Election Monitor (Phillips, Duggirala) shows prediction markets pricing a Democratic House majority above 90% and Senate control above 60% — market prices Goldman collected, not a proprietary forecast. Gasoline prices feed a political environment constraining the administration's legislative agenda. Senate is vulnerable to small polling errors moving several races together.", "angle": "Prediction markets are the price. Watch Kalshi ($40B valuation talks) and Polymarket as the pricing venue — and the Comer probe on their integrity.", "tweetA": "A 90%+ House price isn't a forecast, it's a crowd's confidence — and Goldman is careful to say so. Senate at 60% with correlated polling error is the real trade. Gas prices are doing the campaigning.", "tweetB": "Prediction markets now price the midterms, get regulated by Congress, and raise $1B at $40B. The thing being priced and the venue pricing it are converging.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/goldmans-midterm-map-the-house-looks"}, {"id": 10, "cat": "macro", "urgency": "act", "source": "TMAD / Trading Mindset and Data", "title": "Consumer confidence collapses to 81.9 from 88.6 — lowest since 2014", "idea": "Conference Board consumer confidence 81.9 (Aug 88.6), lowest since 2014 and well below expectations. PCE due today (spending expected +0.7-0.8%), jobs Friday. Fed dilemma: weak confidence vs inflation still too high.", "angle": "Confidence vs spending divergence again. Hard data holding (ADP, retail sales) while survey data at decade lows — which one blinks?", "tweetA": "Confidence: lowest since 2014. ADP: beat. Spending forecast: +0.7-0.8%. One of these is going to be wrong by Friday, and the Fed is choosing which to believe.", "tweetB": "2014 lows in confidence with 10y at 5.5% and gas prices up. This is the first stagflation-flavored confidence print in a decade. Does the equity market care? So far, no.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://www.tmad.news/p/tmad-update-consumer-confidents-lowest"}, {"id": 11, "cat": "credit", "urgency": "act", "source": "TMAD / Trading Mindset and Data", "title": "10y mid-5%, 30y highest since 2002 — 'the bigger elephant than Iran'", "idea": "TMAD: Iran is the headline, Treasuries are the bigger issue. 10y around the mid-5% area, 30y recently at the highest since 2002 (Mando says since 2001). WTI drifting toward $92. SPX breaking down a cluster of supports.", "angle": "Long-end selloff continuing even as oil falls — this is not an oil story. It's supply, term premium and fiscal.", "tweetA": "Oil down toward $92 and long yields still at 25-year highs. If bonds don't rally when oil falls, the driver isn't oil. Deficits, term premium, and a Fed that won't own duration.", "tweetB": "30y at levels not seen since before the iPhone existed, and SPX is breaking supports. The 5% 'risk-free' rate is finally competing with the ERP conversation.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://www.tmad.news/p/tmad-update-consumer-confidents-lowest"}, {"id": 12, "cat": "macro", "urgency": "deep", "source": "TMAD / Trading Mindset and Data", "title": "TMAD: few great setups, breaking supports, MU earnings, ALAB/ASML/SDGR", "idea": "Author notes few new trades taken because markets aren't offering clean entries; SPX breaking down a cluster of supports; PCE today, jobs Friday; tickers flagged include $ALAB, $ASML, $SDGR and Micron earnings.", "angle": "Discipline as an edge: cash and patience while supports break. Micron as the AI memory read-through.", "tweetA": "'There are not many great setups' is the most honest line in market commentary this week. When supports cluster-break, cash is a position.", "tweetB": "Micron reports into a market where consumer confidence is at 2014 lows and the 30y at 2002 highs. HBM demand vs discount-rate math — who wins?", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://www.tmad.news/p/tmad-update-consumer-confidents-lowest"}, {"id": 13, "cat": "macro", "urgency": "act", "source": "Mando Minutes", "title": "Fed: Williams cools Oct hike odds, Barr signals more hikes (odds ~50%)", "idea": "Mando: Fed Oct hike odds drop on Williams' comment; separately Fed's Barr signals more rate hikes with odds falling to 50%. US 30y at highest since 2001; US job openings lowest since March; consumer confidence lowest since 2014.", "angle": "Two Fed governors, two messages, 50% odds: the committee is split and the market is trading Williams.", "tweetA": "Williams says no urgency, Barr says more hikes, and the market prices 50/50. The dot plot is a poll, and the poll is tied.", "tweetB": "Job openings at the lowest since March, confidence at 2014 lows, 30y at 25-year highs. The Fed is hiking into a demand slowdown against a supply-driven term premium. Bold.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-492f"}, {"id": 14, "cat": "positioning", "urgency": "deep", "source": "Mando Minutes", "title": "Only 25% of S&P 500 stocks above 50-DMA; Nasdaq 26,800", "idea": "Mando cites Kobeissi: only 25% of S&P 500 stocks trade above their 50-day moving average. Nasdaq ~26,800 flat, Gold ~$4,200.", "angle": "Narrow breadth under a flat index — again the index is being held up by a handful of mega-caps while the median stock is below trend.", "tweetA": "25% of the S&P above its 50-DMA with the index flat. The median stock is already in a correction; the cap-weighted tape just hasn't noticed.", "tweetB": "Breadth like this at Nasdaq 26,800 says the index is the AI trade and everything else is a rate trade. Rates are at 25-year highs.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-492f"}, {"id": 15, "cat": "geopolitics", "urgency": "act", "source": "Mando Minutes", "title": "Iran: talks fail, nuclear talks only after Hormuz resolved; US closing last major Iraq base", "idea": "Mando: US-Iran talks fail to make progress; Iran says nuclear talks only after Hormuz is resolved; MidEast oil exports hit highest since the Iran war (FT); US is closing its last major military base in Iraq; Texas declares disaster over soaring diesel prices.", "angle": "Diplomatic deadlock + rising physical exports = market prices supply relief while the political risk stays. Base closure adds a footprint drawdown.", "tweetA": "Talks fail, nuclear talks conditional on Hormuz, US leaves its last big Iraq base — and oil is falling. The market is pricing logistics, not geopolitics.", "tweetB": "Iran sequences Hormuz before nuclear. The US leaves Iraq. Who exactly is guaranteeing the tanker lanes in Q4?", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-492f"}, {"id": 16, "cat": "geopolitics", "urgency": "deep", "source": "Mando Minutes", "title": "Trump mulls big Russia sanctions relief; Putin, Lavrov harden line", "idea": "Mando: Trump mulls sanctions relief for Russia (prisoners; risk of allies' and hawks' wrath, per ZeroHedge) while Putin and Lavrov harden Russia's line on Ukraine. Also: UK PM Burnham to consider rejoining the EU.", "angle": "Sanctions relief with a hardening counterpart = negotiation from weakness. Energy-market implication if Russian barrels re-enter.", "tweetA": "Sanctions relief on the table the same week Moscow hardens its line. That's not a deal, that's a discount. Watch European gas.", "tweetB": "UK PM Burnham considering rejoining the EU. In 2016 that was unthinkable, in 2026 it's a headline in a daily crypto newsletter. Politics repricing faster than markets.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-492f"}, {"id": 17, "cat": "geopolitics", "urgency": "deep", "source": "Mando Minutes", "title": "China's huge stimulus push falls flat with markets; Hegseth cuts general/admiral posts 20%", "idea": "Mando: China's huge stimulus push falls flat with markets (Barraud); Hegseth to cut General and Admiral posts by 20%; Treasury to auto-enroll millions in 'Trump Accounts'; Rice +71% YTD, rubber +40%.", "angle": "China stimulus failing to lift markets echoes Logan Wright's thesis (ChinaTalk) that the constraint is financial-system capacity, not policy volume. Rice/rubber = Asian commodity inflation.", "tweetA": "Stimulus that markets ignore is a policy that's out of ammunition. Logan Wright was on ChinaTalk today: the constraint isn't willingness, it's the financial plumbing.", "tweetB": "Rice +71% YTD, rubber +40%. Nobody's talking about the food and industrial input inflation coming out of Asia while every desk stares at the Fed.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-492f"}, {"id": 18, "cat": "crypto", "urgency": "deep", "source": "Mando Minutes", "title": "BTC ETF inflow streak hits 9 days; sovereign funds reportedly swap gold for BTC; Tether mints $495M XAUt", "idea": "Mando: BTC ETF inflow streak 9 days (+$66M Tuesday); BTC coin-denominated OI lowest since March; Schwab says BTC's era of 70% crashes is over; sovereign funds reportedly swapping gold for BTC; Tether minted $495M of XAUt; Fear & Greed 72; BTC $83.8k, dominance 58.6%.", "angle": "Gold and BTC are both getting bid by sovereign-type buyers; Tether's XAUt mint is the private version. Low OI + inflows = spot-led rally.", "tweetA": "A 9-day ETF streak with coin-denominated open interest at a March low. This isn't leverage, it's spot. Different market than the one that crashed.", "tweetB": "Sovereigns swapping gold for BTC while Tether mints $495M of tokenized gold. Two monetary-alternative trades, same buyer base. Gold $4,200, BTC $84k.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-492f"}, {"id": 19, "cat": "crypto", "urgency": "act", "source": "Mando Minutes", "title": "Bitget hack fallout: attackers route via CoW and Chainflip; Bitget 'not very optimistic' on recovery", "idea": "Mando: Hackers route Bitget funds via CoW, Chainflip; Bitget 'not very optimistic' on recovering funds; Zcash devs release Udon; Aztec relaunches zk.money.", "angle": "Cross-chain swap venues and privacy pools as laundering rails — regulatory heat on THORChain-type infrastructure.", "tweetA": "$387.5M out of Bitget, laundered through CoW and Chainflip, then into Zcash's shielded pool. Every privacy rail just became a compliance question.", "tweetB": "The Bitget attacker moving $3.9M into Zcash's private pool while ZEC trades at $1,424. Privacy is a bid whether or not you like the use case.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-492f"}, {"id": 20, "cat": "regulation", "urgency": "deep", "source": "Mando Minutes", "title": "Illinois advances first crypto tax; ECB tests AI-powered digital euro payments", "idea": "Mando: Illinois advances first crypto tax (draft rule for a digital assets tax); ECB wants to test AI-powered digital euro payments; first euro-hedged Bitcoin ETP live in Europe; UK's Smarter Web to issue first BTC-backed prefs; Judge orders NY to scrap second-home tax rollout.", "angle": "State-level crypto taxation is a new front; ECB pairing CBDC with AI agents connects to Robinhood agent trading and Uncover Alpha's agent economy.", "tweetA": "A state-level tax on digital assets, a digital euro tested with AI payments, and a US brokerage giving AI agents trading accounts. Payments plumbing is being rewritten around agents.", "tweetB": "Illinois taxing crypto directly is the first blue-state test case. Watch for wallet migration and a tax-competition race between states.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-492f"}, {"id": 21, "cat": "AI/infra", "urgency": "act", "source": "Mando Minutes", "title": "AI: Trump signs White House accord with top AI labs; Jay Clayton floated as AI czar; BoE warns of sharper AI market correction", "idea": "Mando: Trump signs a White House accord with top AI labs; Trump floats Jay Clayton as AI czar; US won't cooperate closely with China on AI; BoE warns of a sharper AI market correction; Tesla secures $30B credit for AI and robotaxis; Zuck sells $21.4M META, first sale in a year; Google paying ~100 publishers for AI Overviews.", "angle": "Governance (accord, czar) + central bank warning + insider selling — three risk signals in a day for the AI trade.", "tweetA": "The BoE warns of a sharper AI correction the same day Tesla locks $30B of credit for AI and the White House signs an accord with the labs. Everyone is stacking the chips and the guardrails at once.", "tweetB": "Zuckerberg sells for the first time in a year the week Meta's agent tops app stores. A $21.4M sale is a rounding error — but the timing gets noticed.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-492f"}, {"id": 22, "cat": "AI/infra", "urgency": "deep", "source": "Mando Minutes", "title": "Altman: no OpenAI IPO until AI stops going rogue; OpenAI halves usage on $200 sub; sued by non-profits over Hugging Face hack", "idea": "Mando (linking Gizmodo, CNBC): Altman says no OpenAI IPO until the AI stops going rogue; OpenAI halves usage on its $200 subscription; OpenAI sued by non-profits over a Hugging Face cyberattack; OpenAI in talks to raise $30B at $1.4T.", "angle": "Capacity rationing on the top tier while raising at $1.4T — compute scarcity shows up in product limits before it shows up in margins.", "tweetA": "A $200 tier that just got halved and a $1.4T valuation. Either compute is truly scarce or the unit economics of heavy users are worse than the market assumes. Both are bullish for $NVDA and bearish for the narrative.", "tweetB": "'No IPO until the AI stops going rogue' is the most honest S-1 risk factor ever said out loud.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-492f"}, {"id": 23, "cat": "science", "urgency": "watch", "source": "Mando Minutes", "title": "Anthropic says it found a Crispr-like system", "idea": "Wired via Mando: Anthropic says it discovered a Crispr-like system — 'now what?'. (Headline only in email.)", "angle": "AI-driven discovery in biotech crossing from tool to inventor; IP and regulatory frameworks aren't ready.", "tweetA": "An AI lab claiming discovery of a Crispr-like system. If it holds up, the moat in biotech shifts from the wet lab to the compute budget.", "tweetB": "Who owns the patent when the model made the discovery? That question just became commercial.", "charts": {"count": 0, "hot": false, "desc": "Article link in email — worth opening"}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-492f"}, {"id": 24, "cat": "crypto", "urgency": "act", "source": "Lucky Trader / Morning Minute", "title": "Robinhood at HOOD Summit: US perps, 24/7 stocks incl. weekends, AI trading agents", "idea": "Robinhood: BTC/ETH perps up to 10x (others 3x) via Robinhood Derivatives/Bitstamp; weekend stock trading via Bruce ATS; agents that trade using OpenAI/Anthropic models with own accounts; 150,000+ agent accounts already; 'Loops' standing instructions; earning rkets: KYC'd and under subpoena. Onchain perps: anonymous and about to be. The regulatory perimeter is moving to the last permissionless venue that matters.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://unchainedcrypto.beehiiv.com/p/comer-s-insider-trading-probe-reaches-hyperliquid"}, {"id": 28, "cat": "crypto", "urgency": "act", "source": "Unchained (Laura Shin)", "title": "Bitget: $387.5M hack, then impostors targeted the CEO; Kalshi ends volume rewards; Balancer winds down", "idea": "Bitget CEO Gracy Chen says scammers posing as an investment firm ran a multi-role social-engineering 'team' on her days after the hack; DPRK attribution walked back to 'preliminary indicators'. Kalshi's Volume Incentive Program now ends no earlier than Oct 13, 2026 vs Oct 1, 2027 after allegations that exactly $5,500 trades were ~half of ether-perp volume. Balancer shuts down: ~16 cents per BAL from a ~$9.96M treasury, withdrawals-only Oct 30.", "angle": "Three different failure modes in one issue: security, market integrity, protocol death. Balancer's wind-down is a DeFi blue-chip liquidating for pennies.", "tweetA": "Balancer, a DeFi blue chip, is liquidating at 16 cents per token. Bitget lost $387M. Kalshi killed its volume rewards after wash-trade claims. Every category of crypto risk showed up on the same Wednesday.", "tweetB": "The hackers went after the CEO of the victim exchange within four days of the theft, with a staged team. The attack surface isn't the smart contract anymore.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://unchainedcrypto.beehiiv.com/p/comer-s-insider-trading-probe-reaches-hyperliquid"}, {"id": 29, "cat": "crypto", "urgency": "deep", "source": "Unchained (Laura Shin)", "title": "Standard Chartered puts ENA at $2 by 2028 (7x); Aztec revives zk.money with $2,500 cap", "idea": "StanChart forecast ide — worth opening"}, "link": "https://www.cryptointegrat.com/p/crypto-news-september-30-2026"}, {"id": 34, "cat": "AI/infra", "urgency": "act", "source": "Salazar / AI News (CryptoIntegrat)", "title": "OpenAI: GPT-6.1 Sol near-Astra intelligence at 1/5 the price; Ultrafast 300 tok/s; Dots always-on agents", "idea": "OpenAI introduced GPT-6.1 Sol: near Astra intelligence at one fifth the price with a 95% cache-read discount; Ultrafast tier up to 8x faster token generation (300 tok/s) in Codex, 6x in API; Dots always-on agents with their own cloud computer; Codex Cloud; Decisions API (GPT-6 Luna); ChatGPT Space.", "angle": "Price/performance step-down of ~5x within a release cycle plus a speed premium tier: the cost curve is still falling, and latency becomes a priced product.", "tweetA": "Same intelligence at one fifth the price, 300 tokens a second, and a 95% discount on cache reads. Every agent business model I've seen priced against last quarter's costs is wrong.", "tweetB": "An 'Ultrafast' tier with a premium price. Speed is now a separate SKU from intelligence. Cerebras and Groq-type inference just got a clearer TAM.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://www.cryptointegrat.com/p/ai-news-september-30-2026"}, {"id": 35, "cat": "venture", "urgency": "act", "source": "Salazar / AI News (CryptoIntegrat)", "title": "OpenAI raising another $30B at ~$1.4T; Jeff Park: Anthropic shouldn't IPO yet", "idea": "OpenAI reportedly raising $30B at ~$1.4T. Jeff Park argues Anthropic should not IPO yet, because gains already went to ~300 private investors. InstaCloud raised $8M seed for agent-native serverless cloud aimed at replacing AWS/GCP/Azure; Multicoin invested in Grass (DePIN selling pretraining data).", "angle": "Private-market valuation absorbing what used to be public IPO gains — the public gets the exit liquidity. $1.4T is larger than most S&P megacaps.", "tweetA": "$1.4T private valuation and Altman says no IPO. When the gains are already captured by 300 private holders, an IPO is a distribution event. Public markets should ask who they're buying from.", "tweetB": "An $8M seed to replace AWS, GCP and Azure. Either it's the most ambitious pitch of the year or the next Fastly. The 'agent-native cloud' idea deserves attention.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://www.cryptointegrat.com/p/ai-news-september-30-2026"}, {"id": 36, "cat": "AI/infra", "urgency": "deep", "source": "Salazar / AI News (CryptoIntegrat)", "title": "Agent products flood: OpenClaw Enterprise, Meta Muse for SMB, Perplexity Automations, Wajo Fo 71%", "idea": "OpenClaw Foundation (Red Hat, Nvidia, OpenAI) open-sourcing OpenClaw Enterprise, a free control plane for persistent agents. Meta launched Muse for Small Business. Perplexity Computer launched Automations with Slack/Gmail/Outlook/Linear triggers. Wajo's Fo places calls, sends emails and pays with single-use cards, completing 71% of setback-heavy tasks unaided.", "angle": "Agent infrastructure is standardizing (control plane, triggers, single-use cards) — the payment layer for agents is arriving.", "tweetA": "A control plane for persistent agents backed by Red Hat, Nvidia and OpenAI is the Kubernetes moment for agents. Free, open, and everyone's on it.", "tweetB": "71% task completion on deliberately obstacle-laden tests, with single-use cards for payment. That's the payment rail Visa and Mastercard are going to fight over.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://www.cryptointegrat.com/p/ai-news-september-30-2026"}, {"id": 37, "cat": "credit", "urgency": "act", "source": "Big Moves / Big Price Moves Explained", "title": "FICO -26.5% as FHFA puts VantageScore on the same GSE pricing grid", "idea": "FHFA's Pulte: Fannie/Freddie will use one mortgage-score pricing grid, VantageScore joins the FICO Classic grid, removing the 20-point VantageScore adjustment. FICO -26.5% to $617.87 (already -55% from high). TransUnion extended 99-cent VantageScore 4.0 pricing through 2028 versus ~$10 for FICO. Jefferies: adjusted EBITDA could fall almost 20% under broad adoption. FICO mortgage-origination revenue +97% while score volume grew low-single-digits — i.e. price, not volume, drove the growth.", "angle": "A regulator repricing a private toll road in a single announcement — the same risk model as Amazon ads under agent-driven commerce.", "tweetA": "FICO's mortgage revenue rose 97% on low-single-digit volume growth. That is a price story. A regulator just removed the price protection. -27% is the start of the arithmetic, not the end.", "tweetB": "$10 vs 99 cents. A 90% price gap for a near-substitute, and a regulator that just leveled the grid. Monopoly pricing power lasts exactly as long as someone in Washington is willing to protect it. $FICO $TRU", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening (FICO trendline)"}, "link": "https://bigmoves.substack.com/p/big-moves-september-29-2026"}, {"id": 38, "cat": "macro", "urgency": "deep", "source": "Big Moves / Big Price Moves Explained", "title": "Carnival: record $8.44B revenue, 2027 already ~half booked at record price and occupancy", "idea": "Carnival Q3: revenue $8.44B record, net income $1.92B, net yields +2.4% cc, cost ex-fuel per ALBD +1.8% (both >1pt better than June). Raised FY adjusted net income outlook by >$150M despite ~$150M higher fuel. 2027 ~half booked at record occupancy/pricing; capacity flat next 12 months; deposits $7.6B (+7%). S&P restored investment grade; redeemed $500M of 7% notes. Stock +13.4%.", "angle": "Consumer at 2014 confidence lows, gas prices high, and the cruise line raises guidance on record forward pricing — the K-shape is real; the top-half spends on experiences.", "tweetA": "Confidence at the lowest since 2014 and Carnival's 2027 is half sold at record prices with flat capacity. The consumer isn't weak, the consumer is bifurcated.", "tweetB": "Cruise is relative value against land vacations when gas is expensive: bundled price, fixed budget. And a 7% note refinanced with cash as S&P restores IG. $CCL is a credit story wearing a vacation costume.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://bigmoves.substack.com/p/big-moves-september-29-2026"}, {"id": 39, "cat": "regulation", "urgency": "deep", "source": "Big Moves / Big Price Moves Explained", "title": "Brazil bans online betting/iGaming; Flutter halts Brazil; DKNG -7.4%", "idea": "Brazil's provisional executive order banned online sports betting and iGaming; Flutter halted Brazilian operations (prolonged shutdown ~$70M 2026 revenue, ~$20M EBITDA). DraftKings, with no Brazil exposure, fell 7.4% on read-through regulatory risk. Warby Parker rose on Meta smart-glasses attention despite no news.", "angle": "Regulatory contagion trades: a single-country ban repricing a global category.", "tweetA": "Brazil bans it, Flutter halts, and DraftKings — no Brazilian exposure — drops 7%. Markets price regulatory risk as correlated across jurisdictions.", "tweetB": "Warby Parker up on Meta's smart glasses with no news. Attention proxies for hardware distribution partners: an 'Intelligent Wear' launch with Samsung and Google is the real catalyst.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://bigmoves.substack.com/p/big-moves-september-29-2026"}, {"id": 40, "cat": "macro", "urgency": "deep", "source": "Big Moves / Big Price Moves Explained", "title": "CarMax EPS +81% ($1.16 vs $0.73 est.); CAF income +32%; buybacks resume", "idea": "CarMax: revenue +19.5% to $7.9B; retail used units +13.8%, wholesale +15.9%; diluted EPS $1.16 vs $0.73 est.; CarMax Auto Finance income +32.1% on lower loan-loss provision and loan-sale gains; modest buybacks resume in Q3. Stock +4.7%.", "angle": "Lower loan-loss provisions in a 5%+ 10y world = credit quality in subprime-ish auto still holding. A key lead indicator for consumer credit.", "tweetA": "EPS beat by 53% with lower loan-loss provisions in auto finance. If the consumer credit cycle were cracking, this is where it would show up first.", "tweetB": "CAF income +32% on a lower provision and loan-sale gains. Gain-on-sale is a margin that disappears when securitization spreads widen. Watch ABS spreads.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://bigmoves.substack.com/p/big-moves-september-29-2026"}, {"id": 41, "cat": "AI/infra", "urgency": "deep", "source": "a16z / State of Markets", "title": "a16z: tech is ~76% of S&P 500 earnings growth in 2026 — 'the everything cycle'", "idea": "a16z State of Markets II (1H'26): tech contributes ~76% of S&P 500 earnings growth in 2026 (as of late August). Tech has replaced durable goods as the cycle driver; 'you can't really call tech just a sector anymore.'", "angle": "Index concentration is now an earnings concentration: a tech capex slowdown is an index earnings recession.", "tweetA": "76% of S&P earnings growth from one sector. That's not diversification, it's a single trade with 500 tickers.", "tweetB": "Durable goods defined old cycles. Compute defines this one. The Fed's rate hikes hit housing and autos, which are now small; they don't hit the sector that owns the cycle.", "charts": {"count": 1, "hot": true, "desc": "100+ charts inside; tech share of S&P earnings growth chart is the tweetable one"}, "link": "https://www.a16z.news/p/state-of-markets-ii"}, {"id": 42, "cat": "AI/infra", "urgency": "deep", "source": "a16z / State of Markets", "title": "a16z: A100 rental prices at or above start of year — GPU obsolescence 'greatly exaggerated'", "idea": "Per a16z, GPU rental rates aren't decaying as bears expected: even A100s price at or above where they began the year; demand for compute still outpaces supply; cheaper intelligence is accruing value across chips and models. Hyperscaler FCF → semi FCF, increasingly funded by debt.", "angle": "Directly challenges the depreciation-life debate (3-4 yr bears vs 6-yr hyperscaler schedules). If rental rates hold, residual values support debt financing.", "tweetA": "A 2020-vintage A100 renting for as much as it did in January. The depreciation bear case has a data problem. The financing bear case (debt-funded capex) doesn't.", "tweetB": "If old GPUs hold rental price, the collateral behind GPU-backed credit is better than models assume. Alternatively, supply is so tight that nothing clears. Both point to the same trade until supply catches up.", "charts": {"count": 1, "hot": true, "desc": "GPU rental-rate chart (A100) — 🔥 CHART WORTH SAVING"}, "link": "https://www.a16z.news/p/state-of-markets-ii"}, {"id": 43, "cat": "AI/infra", "urgency": "deep", "source": "a16z / State of Markets", "title": "a16z: 30% of S&P companies cite AI impact, only ~2% track a metric; ~2% of US households pay for AI", "idea": "30% of S&P 500 companies report some 'quantifiable impact' of AI, but only ~2% report any tracked metric; agentic use is a tiny share of users; as of April barely ~2% of US households paid for AI. a16z's read: adoption is broad but shallow.", "angle": "Depth-of-adoption gap is the bull and bear case: enormous headroom, but ROI evidence is mostly qualitative.", "tweetA": "28-point gap between companies saying AI matters and those measuring it. Either measurement is lagging or the impact is narrative. Pricing assumes the first.", "tweetB": "2% of households pay for AI while Meta's Muse hits 2.5M downloads in 13 days. Consumer penetration hasn't inflected yet — it might in weeks.", "charts": {"count": 1, "hot": false, "desc": "Adoption charts inside — worth opening"}, "link": "https://www.a16z.news/p/state-of-markets-ii"}, {"id": 44, "cat": "tech", "urgency": "deep", "source": "a16z / State of Markets", "title": "Software: ~75% profitable but only ~30% growing 20%+ — 'SaaS prove-it, not -pocalypse'", "idea": "a16z: after ZIRP, ~75% of public software cos are profitable but only ~30% grow 20%+ (inverted from 2022). Fast growers still trade at historical-average multiples; there are simply fewer, so the sector re-rated. AI is a factor but not the only one.", "angle": "The software sell-off is a growth-mix repricing, not an AI kill shot — which tempers the Uncover Alpha agent-risk thesis to the ad/friction layers only.", "tweetA": "Software went from mostly-unprofitable-high-growth to mostly-profitable-low-growth in four years. Multiples followed growth, not AI. Don't confuse the two.", "tweetB": "The market kept paying up for the 30% still growing 20%+. Dispersion inside software is the alpha, and the sector ETF is the wrong instrument.", "charts": {"count": 1, "hot": false, "desc": "Software profitability vs growth chart inside — worth opening"}, "link": "https://www.a16z.news/p/state-of-markets-ii"}, {"id": 45, "cat": "tech", "urgency": "deep", "source": "Uncover Alpha", "title": "Meta Muse: 2.5M North America downloads in 13 days, #1 on both app stores", "idea": "Meta launched Muse Sep 8: sends emails, books travel, buys things, lowers bills; 2.5M NA downloads in 13 days and #1 on App Store/Google Play since. Runs each agent on its own cloud VM with a second 'Sentinel' agent approving outbound actions. Microsoft Autopilot revamp, OpenAI Dots, Instinct also launching.", "angle": "Consumer adoption of agents happening faster than anyone modeled. Amazon blocked Muse on Sep 21.", "tweetA": "2.5 million downloads in 13 days and #1 on both stores. The agent era isn't waiting for the enterprise pilots to finish. Amazon blocked Muse. Guess which side wins that.", "tweetB": "Muse uses a second 'Sentinel' agent to approve anything leaving the VM. The first serious consumer agent shipped with an internal compliance officer. Interesting design pattern.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://www.uncoveralpha.com/p/the-agent-economy-whos-most-at-risk"}, {"id": 46, "cat": "regulation", "urgency": "act", "source": "Uncover Alpha", "title": "Ninth Circuit vacates Amazon's injunction vs Perplexity: the user-directed agent 'is the user'", "idea": "Aug 4, 2026: Ninth Circuit vacated Amazon's injunction against Perplexity, holding Amazon unlikely to win CFAA claims because a user-directed agent means the user is accessing the servers. ToS/contract claims survive. Amazon has blocked 47 AI bots and Muse.", "angle": "Removes the cheapest legal weapon (CFAA 'you're hacking us') against browsing agents — computer-use agents can't be blocked by law, only by tech.", "tweetA": "'The agent is the user.' One sentence that reprices every aggregator's terms of service. Amazon's remaining defenses are contract law and CAPTCHAs.", "tweetB": "Walls work when you're indispensable. Amazon's wall around $60B of on-site search ads is now a technical arms race, not a legal one. $AMZN", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://www.uncoveralpha.com/p/the-agent-economy-whos-most-at-risk"}, {"id": 47, "cat": "venture", "urgency": "deep", "source": "Uncover Alpha", "title": "Instinct: 40% of users share their credit card after 3 weeks; $1B of transactions; 80% retention", "idea": "Instinct CEO (Invest Like the Best): after 3 weeks 40% of users share their credit card with the agent; sharing one sensitive datum → 80% retention; $1B transaction value flowing, 50% travel; soft-launched in August. Adobe: AI-referred traffic to retailers +138% y/y (+1,324% since Oct 2024), converting 54% better; travel AI traffic +194%.", "angle": "Trust is the gating variable, and it's being crossed at scale faster than expected. Consumer agent commerce is already a real GMV.", "tweetA": "40% hand over the credit card in three weeks. 80% retention once they share one sensitive detail. Trust, once given, is stickier than any feature.", "tweetB": "$1B of transaction value in 8 weeks on a soft launch, half of it travel. Booking's CFO says LLM referral is under 1% of room nights. Somebody's number is going to move.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://www.uncoveralpha.com/p/the-agent-economy-whos-most-at-risk"}, {"id": 48, "cat": "AI/infra", "urgency": "deep", "source": "Uncover Alpha", "title": "Agents vs the ad stack: DoorDash/Uber Eats/Instacart >$4B ads; Amazon $68.6B ads (~$60B on-site); Tripadvisor Hotels -23%", "idea": "Ads are ~100% gross margin at aggregators: DoorDash+Uber Eats+Instacart >$4B annualized; Uber >$2B run rate; Instacart ad/other $958M in 2024 (~30% of revenue); Amazon ad revenue $68.6B in 2025, ~$60B on-site search. Agents rank on price/availability/quality, no slot purchase. Tripadvisor Hotels revenue -23% to $117.9M in Q2, guiding -20 to -23% in Q3. Booking marketing 4.7% of gross bookings (vs 4.6%), marketing +11% vs bookings +9%. Rates 34 public companies 1-5 on agent risk.", "angle": "The ad-supported margin structure of every aggregator is a bet on human eyeballs — agents don't look at ads. Tripadvisor is the live case study.", "tweetA": "$60B of Amazon's ad revenue is a human typing into a search box. An agent doesn't type. Tripadvisor's -23% is what the first stage looks like, and that's before agents. $AMZN $TRIP $BKNG", "tweetB": "The agent-risk ranking is a layers question: how much of the profit is friction, attention and comparison vs fulfillment? Booking's Genius members at high-50s % of room nights is the moat that survives — at the cost of margin.", "charts": {"count": 0, "hot": false, "desc": "Company risk ranking table inside — worth opening"}, "link": "https://www.uncoveralpha.com/p/the-agent-economy-whos-most-at-risk"}, {"id": 49, "cat": "culture", "urgency": "deep", "source": "Uncover Alpha", "title": "Subscription 'friction economy': people guess $86/month, actual $219; agents don't get bored", "idea": "C+R Research: average guess of monthly subscription spend $86 vs itemized $219. West Monroe: 89% underestimate, 66% off by >$200. Self Financial 2026: 59.9% have at least one unused paid sub, avg 2.6. FTC click-to-cancel vacated July 8, 2025; rulemaking restarted Jan 30, 2026. Author: the friction moat survived regulation only to be killed by technology. Baymard: 70.22% cart abandonment, ~$260B recoverable orders; 48% cite unexpected costs.", "angle": "Breakage revenue is close to pure margin; an agent that cancels for you at 9pm removes it. Second-order: zero switching cost forces price competition in insurance, banks, telecom.", "tweetA": "$133 a month of subscription spend that people don't know they have. That's the gap agents will close, and it's nearly 100% margin for whoever collects it.", "tweetB": "The FTC couldn't kill the cancellation maze. A patient agent will. Regulation lost to a product update.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://www.uncoveralpha.com/p/the-agent-economy-whos-most-at-risk"}, {"id": 50, "cat": "macro", "urgency": "act", "source": "ChinaTalk (Jordan Schneider, Logan Wright, Brad Setser)", "title": "Logan Wright: China likely in negative growth in Q2/Q3; property was 20-25% of GDP, construction -80%", "idea": "Rhodium's Logan Wright (Broken China): started year forecasting 1-2.5% growth, now trending well below, likely negative Q2/Q3 as investment contracts. China added a third of global GDP to bank assets in 8 years post-GFC. Property peak 20-25% of GDP; construction -80%, sales -60%. Fiscal deficit ~9.5% of GDP (~$2T). US has out-grown China over five years.", "angle": "Domestic slump and export surplus are 'the same phenomenon': overcapacity shipped abroad at falling prices = deflation exported.", "tweetA": "Property was a quarter of GDP; construction -80%, sales -60%; nothing replaced it. That's a Japan-1990s outcome in slow motion, but with a $2T fiscal deficit and a manufacturing sector that has to sell abroad.", "tweetB": "'Your economy isn't growing, so the marginal buyer for everything you build is outside China.' If Wright is right, China's industrial policy is a claim on other countries' demand. Trade policy is the response.", "charts": {"count": 0, "hot": false, "desc": "Charts likely inside — worth opening"}, "link": "https://www.chinatalk.media/p/logan-wright-on-broken-china"}, {"id": 51, "cat": "credit", "urgency": "deep", "source": "ChinaTalk (Jordan Schneider, Logan Wright, Brad Setser)", "title": "China's credit-risk migration: P2P 2018 → small banks 2019 → trusts 2020 → developers 2021 → mortgages 2022 → LGFVs 2023", "idea": "Wright's framework: credit risk migrated from the periphery to the center each year; the 'bank run' wasn't at a bank — homebuyers wanted their pre-sold properties built. Aftermath of a financial crisis without the crisis: impaired policy tools, persistent deflation, default pressure, reliance on external demand. Closest analogy: Japan mid-1990s. Path to crisis is 'reform', not an external shock.", "angle": "A slow-motion crisis with no catharsis — 'decay' rather than 'collapse'. Impaired transmission means more stimulus buys less.", "tweetA": "Six years, six sectors, each defaulting one year after the last. That's not a series of accidents, it's a fault line migrating toward the center of the system.", "tweetB": "'The path to crisis is reform.' The Chinese leadership is choosing decay over catharsis. Investors should price decay: low growth, low returns, low volatility.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://www.chinatalk.media/p/logan-wright-on-broken-china"}, {"id": 52, "cat": "labor", "urgency": "watch", "source": "ChinaTalk (Jordan Schneider, Logan Wright, Brad Setser)", "title": "China: 12-13 million graduates a year and a jobs crisis Beijing can't easily fix", "idea": "ChinaTalk/Wright: the jobs crisis facing 12-13M graduates per year and ideological, fiscal and strategic constraints; Wright argues there is no longer systemic economic rivalry with China, only military and industrial-resilience rivalry; new industrial sectors (EVs, AI, robotics) can't replace property/investment growth.", "angle": "Underemployed graduates is the political variable to watch; Unitree's $50B IPO shows where capital flows.", "tweetA": "12-13 million graduates a year into an economy where property was a quarter of GDP. That's the demographic time bomb no stimulus package addresses.", "tweetB": "Wright: no more 'systemic economic rivalry', only military and industrial resilience. That reframes tariffs from a growth fight to a supply-chain-security one.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://www.chinatalk.media/p/logan-wright-on-broken-china"}, {"id": 53, "cat": "geopolitics", "urgency": "deep", "source": "ChinaTalk (Jordan Schneider, Logan Wright, Brad Setser)", "title": "Xi's rebuttal: capturing 'commanding heights' vs GDP — Wright's answer on minerals processing and cheap power", "idea": "Schneider steelmans Xi: build everything the world needs; ghost cities don't matter. Wright: the limit is that marginal demand is outside China. He concedes GDP misses industrial clustering: minerals processing dominance came from cheap credit, SOE producers tolerating losses, and subsidized power — 'aluminum is basically congealed energy'.", "angle": "Aluminum as congealed energy is a clean framework: cheap subsidized power is the hidden export.", "tweetA": "'Aluminum is basically congealed energy.' China exports subsidized electricity in the form of metal. Same with solar panels and batteries.", "tweetB": "The steelman: national power isn't measured by GDP. The rebuttal: it is when you can't afford the fiscal deficit that funds it. Both true.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://www.chinatalk.media/p/logan-wright-on-broken-china"}, {"id": 54, "cat": "AI/infra", "urgency": "deep", "source": "AI Supremacy / Dermot McGrath (ZenGen Labs)", "title": "Unitree IPO'd on Shanghai in Aug 2026 at $50B; humanoid G1 $15k, R1 $5,900", "idea": "AI Supremacy/ZenGen: Unitree listed on the Shanghai exchange Aug 2026 at $50B valuation; G1 launched at ¥99,000 (~$15k), R1 $5,900 (July 2025); >5,000 humanoids shipped in 2025; humanoid revenue ~3/4 research and education, ~9% industrial (first 9 months 2025); most humanoids still rely on remote control per TMTPost. Morgan Stanley: 1B+ humanoids by 2050.", "angle": "A $50B valuation on a business that's mostly research labs and performances — a pricing of the option, not the revenue.", "tweetA": "$50B for a company whose humanoid revenue is 3/4 universities and labs and 9% industrial. That's an option on the future priced like a franchise.", "tweetB": "A humanoid at $5,900 is a used-car price. Boston Dynamics' Spot sold at $74,500 in 2020. Cost curve, not capability, is the disruption.", "charts": {"count": 0, "hot": false, "desc": "Long report; charts inside — worth opening"}, "link": "https://www.ai-supremacy.com/p/the-state-of-chinese-physical-ai-2026"}, {"id": 55, "cat": "tech", "urgency": "deep", "source": "AI Supremacy / Dermot McGrath (ZenGen Labs)", "title": "China's robotics supply chain: 295,000 industrial robots installed in 2024 (> rest of world); UBTech servo cost $3 vs $50-100", "idea": "China installed 295,000 industrial robots in 2024, more than the rest of the world combined; Chinese brands >50% of domestic market by 2025 (Estun #1) vs 72% foreign in 2014. UBTech built servos for ~¥20 (~$3) vs $50-100 for Japanese/Swiss parts. Leaderdrive harmonic reducers, Leadshine servo drives, magnets from Dongguan Juxin — SMEs in Jiangsu/Zhejiang/Shanghai supply Unitree.", "angle": "Robotics as a supply-chain story: component cost 10-30x lower. The Western moat is software, not hardware.", "tweetA": "A $3 servo where the competition pays $50-100. That's why China ships more humanoids than the rest of the world combined. It's not the AI, it's the BOM.", "tweetB": "72% foreign robot share in 2014, under 50% by 2025. Made in China 2025 got a lot of headlines for failing and then it quietly succeeded in robots.", "charts": {"count": 0, "hot": false, "desc": "Long report; charts inside — worth opening"}, "link": "https://www.ai-supremacy.com/p/the-state-of-chinese-physical-ai-2026"}, {"id": 56, "cat": "venture", "urgency": "watch", "source": "The Founders Corner", "title": "DocSend/HBS: seed closers contacted 77 investors and held 40 meetings vs non-closers 70 and 15", "idea": "Closers: 77 investors contacted, 40 meetings. Non-closers: 70 contacted, 15 meetings — ~10% more outreach, nearly 3x meetings. The differentiator is list quality, not volume. Funnel math: 40 emails → ~1-2 first meetings; 300 emails → 9-15 first meetings, 2-3 second, ~1-2 term sheets.", "angle": "Fundraising is a targeting problem, not a pitching problem — cheque size is the first filter (SBXi $10k-100k vs 2048 Ventures $500k-3M).", "tweetA": "Same volume of outreach (77 vs 70), 2.7x the meetings. Conversion is a function of who's on the list. Every VC pipeline is a funnel with a filter.", "tweetB": "Kima Ventures does 100+ deals a year with decisions in a week; LvlUp did 92 pre-seed deals. Fast-no investors give founders the most valuable early feedback.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://www.the-founders-corner.com/p/the-505-investors-that-can-change"}, {"id": 57, "cat": "venture", "urgency": "deep", "source": "The Founders Corner", "title": "PitchBook Q2 2026: Europe deal value +25% to €2.5M, pre-money -5.4% to €7.5M; US deal size -13.5%, valuations +45%", "idea": "PitchBook Q2 2026 European VC Valuations Report: median European deal value +25% y/y to €2.5M while median pre-money valuation -5.4% to €7.5M. US deal sizes -13.5% and valuations +45%. Cap ranges: Bay Area pre-seed $8-15M/seed $15-25M; London $4-9M/$9-19M; Continental Europe $3-7M/$7-14M. UK largest European market in 2025 at $14B (+22%), Atomico.", "angle": "Transatlantic valuation gap widening — European founders raise more at lower prices, US founders raise less at higher prices. Arbitrage for cross-Atlantic investors.", "tweetA": "Europe: raising more money at lower prices. US: raising less at higher prices. A Bay Area seed cap is roughly double Berlin's for the same traction. Where you raise is a pricing decision.", "tweetB": "US valuations +45% with deal sizes -13.5% is AI-scarcity pricing: fewer rounds, higher marks. Europe doesn't have the same bid for anything with a model attached.", "charts": {"count": 0, "hot": false, "desc": "No chart images in email text; charts inside — worth opening"}, "link": "https://www.the-founders-corner.com/p/the-505-investors-that-can-change"}];

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

  h+='<div class="lbl">The Idea</div><div>'+esc(item.idea)+'</div>';
  h+='<div class="lbl">My Angle</div><div class="angle" style="border-color:'+c+';background:'+c+'14">'+esc(item.angle)+'</div>';
  h+='<div class="tw"><div><div class="lbl" style="color:#378add">TWEET A</div>'+esc(item.tweetA)+'<br>'+'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  h+='<div><div class="lbl" style="color:#7f77dd">TWEET B</div>'+esc(item.tweetB)+'<br>'+'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>';
  h+='<div class="chart'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING — ':'')+(item.charts.count?item.charts.count+' chart(s): ':'')+esc(item.charts.desc)+'</div>';

function render(){

    if(curCat!=='All'&&it.cat!==curCat)return;

  var u={act:0,deep:0,watch:0};ITEMS.forEach(function(i){u[i.urgency]++;});
  var lab=[['All','All '+ITEMS.length],['act','🔴 Act Now '+u.act],['deep','🔵 Deep '+u.deep],['watch','🟡 Watch '+u.watch]];
  document.getElementById('urgbar').innerHTML=lab.map(function(l){var a=curUrg===l[0];return '<span class="pill'+(a?' active':'')+'" style="'+(a?'background:#333':'')+'" onclick="setUrg(\''+l[0]+'\')">'+l[1]+'</span>';}).join('');
}

function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';
  var r='<p>Window: '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.<br>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</p><b>Included sources</b><ul>';
  META.includedSources.forEach(function(s){r+='<li><span class="srcl" data-s="'+esc(s.name)+'">'+esc(s.name)+'</span> — '+s.items+' items</li>';});
  r+='</ul><b>Skipped sources</b><ul>';
  META.skippedSources.forEach(function(s){r+='<li>'+esc(s.name)+' — '+esc(s.reason)+'</li>';});
  r+='</ul>';
  var rb=document.getElementById('repbody');rb.innerHTML=r;
  Array.prototype.forEach.call(rb.querySelectorAll('.srcl'),function(e){e.onclick=function(){filterBySrc(e.getAttribute('data-s'));};});
  bars();render();
}
init();
</script></body></html>
