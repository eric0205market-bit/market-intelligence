<script>
const ITEMS = [{"cat": "credit", "urgency": "deep", "source": "Dark Side of the Boom / Goldman Sachs Research (Mueller-Glissmann)", "title": "10y UST at 5.3% vs a 250-year average of 4.7% — and the optimal bond allocation was ~0% for five years", "idea": "Goldman's asset-allocation head notes the 10y yield (5.3%) now sits above its 250-year average (4.7%). Over the last five years the optimal bond weight was close to 0% (one of the worst rolling 5y returns in a century), while post-WWII the average optimal weight was 40%. Near term he still prefers equities because earnings growth is a buffer; bonds are a long-horizon call.", "angle": "The 60/40 debate is back on, but the horizon split is the whole trade: tactically still equities, strategically duration. Good content frame for 'when does a 5.3% 10y become a buy'.", "tweetA": "10y at 5.3% is 60bps above its 250-year average. Optimal bond weight over the last 5 years: ~0%. Since WWII: 40%. The question isn't 'bonds or stocks' - it's whether you get paid for the next 5 months or the next 5 years.", "tweetB": "Everyone is calling the top in yields off valuation. Goldman's own framing says the near-term case is still equities because earnings are the buffer. So the real risk to bonds is a Q3 earnings miss, not an inflation print. $TLT $SPY", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/are-bonds-becoming-a-better-investment", "id": 1}, {"cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / Goldman Sachs Research (Mueller-Glissmann)", "title": "Equity-bond correlation is positive; the hedge toolkit is TIPS, CTAs and low-vol factors", "idea": "Stocks and bonds have been rising and falling together because energy volatility and hawkish central banks push yields up while weighing on equities. Goldman says correlation turns negative only if inflation normalizes or tightening hits growth sentiment. Their decade mantra: exposure to innovation, inflation protection, better risk mitigation - TIPS after a big rise in real yields, CTAs for crisis/inflation hedge, low-vol/high-div factors because they are negatively correlated with tech.", "angle": "The hedge is the factor that's anti-tech, not duration. Useful for a covariance-focused post: low-vol is a tech hedge in this regime.", "tweetA": "Positive stock-bond correlation means your 'hedge' is the same trade. Goldman's workaround: low-vol and high-dividend factors, because they're negatively correlated with tech. In an AI-led tape that's the real diversifier, not 10-year duration.", "tweetB": "Count how many of your hedges lose money when oil spikes. Duration does. Stocks do. CTAs and TIPS don't. That's the entire argument for owning them in this regime. $TIP", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/are-bonds-becoming-a-better-investment", "id": 2}, {"cat": "credit", "urgency": "deep", "source": "Dark Side of the Boom / Goldman Sachs Research (Mueller-Glissmann)", "title": "French/Italian spreads create a 'double whammy' for Europe — and a bid for Bunds, Treasuries and gilts", "idea": "Mueller-Glissmann says OAT/BTP vs Bund spread widening plus FX volatility is a 'double whammy' for European fixed-income investors, but it creates safe-haven demand for Treasuries, Bunds and gilts. He also flags the 'relative risk' of bonds remains elevated from Middle East tensions and inflation uncertainty.", "angle": "Europe sovereign stress is simultaneously the reason EUR is weak and the reason core duration might hold. Link to the FX piece below.", "tweetA": "French stress used to push every yield higher together. Now it's creating a Bund bid. The periphery widening is turning Germany into the safe asset again - which tells you how this ends if Paris keeps slipping. $EWQ", "tweetB": "Own French bonds, you lose on spread and on the euro. Own Bunds, you win on both. Same continent, opposite trade. This is what a fiscal credit event looks like before it's called one.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/are-bonds-becoming-a-better-investment", "id": 3}, {"cat": "credit", "urgency": "deep", "source": "Dark Side of the Boom / Goldman Global Rates Trader (Marshall)", "title": "Goldman: the forced sellers in the bond selloff are mostly done", "idea": "Per Goldman's William Marshall: mortgage convexity selling has largely washed through, asset managers carry less duration, and evidence of a foreign Treasury 'buyers' strike' is thin. Europe is shifting to a safe-haven bid for Bunds. Energy is the principal spoiler; another leg higher in yields now needs a fresh macro shock rather than a replay of the technical unwind.", "angle": "Positioning-led exhaustion call. Pair with Meisler's 5.20% 10y line in the sand.", "tweetA": "Mortgage convexity done. Asset-manager duration cut. No foreign buyers' strike. If those are the mechanical sellers, the next leg higher in yields needs an actual shock - and the only candidate on the board is oil. $TLT $USO", "tweetB": "Goldman says the selloff is running out of forced sellers. Meisler says get the 10y under 5.20% and the chart changes. Two very different methods, same level. Worth watching if 5.20% is where the bid shows up.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-bond-selloff-is-running-out-of", "id": 4}, {"cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / Forex Weekly", "title": "The dollar finally has a relative-policy story: Fed slower than priced, rest of world more dovish", "idea": "DXY pushes toward highs not because the Fed turned hawkish: front-end US rates rallied after Fed speakers signalled a slower hiking pace than priced, but expectations abroad moved even more dovish. Oil is higher, US equities are outperforming, and European sovereign stress is tightening conditions there faster. Author: FX 'moved from synchronized repricing to divergence'.", "angle": "Dollar bid from relative dovishness elsewhere, not Fed hawkishness - a different risk profile for gold and EM.", "tweetA": "Dollar is rallying while US front-end rates fall. That's not a Fed trade, it's a 'who can afford higher rates' trade. The market stopped asking who's most hawkish and started asking who cracks first. $DXY $UUP", "tweetB": "When everyone hikes the same hill, the FX landscape doesn't change. It's the divergence that moves currencies. Europe is the one that can't carry the hill. Watch 1.1100 EURUSD.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/forex-weekly-the-dollar-finally-gets", "id": 5}, {"cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / Forex Weekly", "title": "Credit tightening is worse than rate hikes for the euro: growth drag without the carry", "idea": "The mechanism: higher policy rates hurt growth but support the currency through carry. Sovereign spread widening (OAT-Bund) tightens financial conditions without that carry, so markets take ECB hikes out of the curve. 'Europe still pays for tightening, but the euro stops getting paid for carrying it.' Even energy relief isn't clean euro-positive: it could let markets price out ECB tightening faster than Fed.", "angle": "A clean framework: spread-driven tightening is FX-negative, policy-driven tightening is FX-positive.", "tweetA": "Rate hikes: growth hit, currency gets carry. Spread widening: growth hit, no carry. France is giving the euro the second kind. Lower oil might even make it worse - ECB hikes get priced out first.", "tweetB": "Good news doesn't always pay the currency you expect. Cheaper energy helps Europe's growth but lets the market price out ECB tightening before Fed's. Which central bank stops first matters more than the macro.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/forex-weekly-the-dollar-finally-gets", "id": 6}, {"cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / Forex Weekly", "title": "JPY: valuation is compelling, flow catalyst absent — EUR/JPY is the cleaner expression", "idea": "JPY trades sideways-to-weaker as yields rise and energy stays expensive. No evidence yet that unhedged Japanese investors are cutting foreign-asset demand. For sustained JPY upside: US yields fall, BOJ delivers consecutive hikes, or repatriation. Author prefers short EUR/JPY: cheaper funding leg, European fiscal stress, higher energy hurts Europe more. Sterling: Oct 28 Budget puts the UK back under scrutiny.", "angle": "Relative expression over outright USDJPY. Flag Oct 28 UK budget as a date.", "tweetA": "Everyone's waiting on the great Japanese repatriation. It hasn't shown up. If you want the yen thesis without the timing risk, the cross is the cleaner way: EUR/JPY shorts get paid by Europe's fiscal story while you wait.", "tweetB": "GBP is the 'less troubled' side only because the fiscal spotlight moved to Paris. Oct 28 puts it back on London. That's a date, not a view.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/forex-weekly-the-dollar-finally-gets", "id": 7}, {"cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / Forex Weekly", "title": "Not a squeeze: MXN hit hard, BRL held, CNY fix is the brake on a dollar acceleration", "idea": "Author argues this isn't a funding-squeeze: bond vol is up sharply but equity vol is subdued, carry has bent but not broken, MXN is weaker while BRL held up on better domestic politics/fiscal expectations. Strong PBOC fixes after the holiday suggest Beijing prefers a stable-to-stronger CNY, anchoring Asia.", "angle": "EM dispersion is the signal; a CNY fix as the real dollar cap.", "tweetA": "MXN down hard, BRL firm. In a funding squeeze they fall together. They didn't, so it's discrimination, not liquidation. Add strong CNY fixes and the dollar has a tailwind but no clear runway.", "tweetB": "The most important FX price right now isn't DXY - it's the PBOC fix. A weaker renminbi turns a normal dollar rally into a self-reinforcing one. Beijing is choosing not to.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/forex-weekly-the-dollar-finally-gets", "id": 8}, {"cat": "energy", "urgency": "act", "source": "Dark Side of the Boom", "title": "Isaias: 830k without power, offshore shut-ins, but Pascagoula and the major refineries were spared", "idea": "Cat 2 Isaias made landfall near Destin (105 mph). ~430k customers out in Florida, 300k Alabama, 106k Georgia. A slight eastward track wobble spared Chevron's Pascagoula refinery. Offshore Gulf output was shut in ahead of the storm. The focus now is how fast platforms are inspected and production restarts - supply loss vs refining loss.", "angle": "Crude/offshore vs product-cracks split: refinery avoidance takes some storm premium out of products first.", "tweetA": "Offshore barrels lost for a few days is a supply story. Refinery outage is a price-spike story. Isaias hit the first and missed the second, which is why the storm premium fades by Monday unless platform inspections drag. $XOM $CVX $VLO", "tweetB": "830k without power in FL/AL/GA is a grid-hardening data point more than an oil one. Every storm that misses refineries but hits the wires makes the case for utilities capex. $NEE $SO", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/hurricane-isaias-batters-gulf-coast", "id": 9}, {"cat": "positioning", "urgency": "watch", "source": "Helene Meisler / Saturday Chart Fest", "title": "Meisler: 'broadening out' collapsed 2 months ago; IGV is outperforming SOX; 10y needs to get under 5.20%", "idea": "Chart-by-chart notes: RSP is nearly the only chart making a higher high than Tuesday; SOX can't get over 13k and looks tired; IGV is outperforming SOX ('is software eating the world again?'); IWM 275 key; XLU up 4% with heavy volume on the turn; GLD needs to reclaim 390; ITB hasn't rallied with bonds (troubling); URA 'hanging by a thread'; LIT 'on my radar'; KWEB 'from bu hao to hao?'; McClellan Summation Index may be turning up for the first time in 2 months; 10y stuck for two weeks, below 5.20% changes the chart.", "angle": "Software vs semis rotation and a possible breadth turn. Open the article for all ~30 charts.", "tweetA": "SOX can't clear 13k while IGV is outrunning it. If software is outperforming semis in the middle of the AI capex story, the market is quietly rotating from picks-and-shovels to the application layer. $IGV $SOXX", "tweetB": "ITB didn't rally when bonds did. Homebuilders are the only asset telling you the 10y bounce isn't a relief trade - it's a pause. 5.20% decides which.", "charts": {"count": 30, "hot": true, "desc": "~30 sector/index charts incl. IGV vs SOX, GLD 390, 10y 5.20%, McClellan Summation Index, Citi Panic/Euphoria"}, "link": "https://helenemeisler.substack.com/p/saturday-chart-fest-399", "id": 10}, {"cat": "positioning", "urgency": "watch", "source": "Helene Meisler / Saturday Chart Fest", "title": "Defensive and off-consensus sectors waking up: utilities +4%, KWEB, LIT, URA fragile", "idea": "Meisler notes XLU rallied ~4% since she left with notable volume on the turn, KWEB may be moving 'from bu hao to hao' (bad to good), LIT is 'sorta interesting', URA is 'hanging by a thread', MOO shows the top when equity folks loved ag. XLE vs OIH: OIH underperforming.", "angle": "Contrarian bucket: China internet, lithium, utilities. Nuclear (URA) weakest link.", "tweetA": "Utilities up 4% on volume, KWEB turning, lithium on the radar. These are the sectors nobody owned going into October. When breadth 'collapsed', they were the ones left standing. $XLU $KWEB $LIT", "tweetB": "URA 'hanging by a thread' while every hyperscaler is signing nuclear PPAs. Either the chart breaks or it's the best entry of the cycle. I don't see a middle outcome.", "charts": {"count": 0, "hot": false, "desc": "Sector charts: XLU, KWEB, LIT, URA, MOO"}, "link": "https://helenemeisler.substack.com/p/saturday-chart-fest-399", "id": 11}, {"cat": "venture", "urgency": "deep", "source": "Hermit Research / Pick of the Week #46 ($TSSI)", "title": "Dell's AI rack integrator hides a 3-5% margin procurement business inside revenue", "idea": "TSS Inc ($TSSI) integrates CPUs, GPUs, liquid cooling, switches and power into racks and modular data centers; Dell is ~99% of the customer concentration. Procurement is a pass-through with an ~8-11% reported gross margin, ~5.5-6% on GMV, and only ~3-5% after factoring fees. 2025 procurement GMV was $279m; factoring fees $1.21m in H1 2026 vs $2.33m in H1 2025. Customers have up to 80 days to pay; TSSI sells invoices non-recourse within 2-3 days.", "angle": "AI-rack accounting optics: revenue falling because net vs gross reporting, not demand. Small-cap picks-and-shovels with net cash.", "tweetA": "Revenue down, business up. TSSI books procurement gross when it configures, net when it drops ship. The headline margin is a function of accounting, and factoring fees halved YoY ($2.33m to $1.21m). Look at the mix, not the top line. $TSSI $DELL", "tweetB": "99% customer concentration is a risk for anyone who reads the 10-K. It's also a free option on how much of Dell's AI server backlog gets integrated before the shelf. $DELL", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.hermitresearch.com/p/tssi-mechanics-of-dells-ai-rack-margins", "id": 12}, {"cat": "AI/infra", "urgency": "deep", "source": "Uncover Alpha", "title": "The 'best model wins' era is over: six index points separate Opus 5 from free open-weight models", "idea": "Artificial Analysis Intelligence Index: Fable 5.1 at 66, Opus 5 at 63, Muse Spark 1.3 / GPT-5.6 Sol / Grok 4.6 at 61, open-weight Kimi K3 and GLM 5.3 at 60. Muse Spark 1.3 costs ~$0.55 per index task vs $3.69 for Fable 5.1 (6.7x cheaper, 5 points behind). GDPval: GPT-4o 13.7% -> GPT-5-high 40.6% -> Opus 4.1 49% -> one tracker now 87.9%. Author: value is leaking from the model layer to hyperscalers and apps.", "angle": "The thesis for rotating from 'model' exposure to 'compute + application'. Maps to IGV vs SOX note above.", "tweetA": "6 index points and a 6.7x price gap. If you're a buyer, that's not a close call. The frontier lab margin story depends on customers paying for the last 5 points - and the customer service desk doesn't. $MSFT $GOOGL", "tweetB": "GDPval went from 13.7% to 87.9% in about 18 months. At that point 'which model' is the wrong question and 'what context does it have access to' is the only one.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening (Ramp AI Index token spend vs volume)"}, "link": "https://www.uncoveralpha.com/p/the-end-of-best-ai-model-wins-era", "id": 13}, {"cat": "AI/infra", "urgency": "deep", "source": "Uncover Alpha", "title": "Open-weight models carry 56% of Vercel gateway tokens but only 14% of spend", "idea": "Open-weight models handled 56% of tokens through Vercel's AI Gateway in August (7% in Dec 2025), peaking at 78.4% on Sept 18 vs 29% in June. Yet they account for only ~14% of estimated spend; closed-weight tokens cost ~7.8x more. Enterprises average 5+ models; F5 says 7 models and 52% chain them. Ramp shows open-source under 5% of business spend - author says spend is the wrong lens.", "angle": "Volume vs dollars: the revenue shows up at the hyperscaler, not the lab.", "tweetA": "Open-weight: 56% of tokens, 14% of spend. Anyone looking at lab revenue to size the AI market is measuring the toll collected by the least-used lane. $AMZN $MSFT", "tweetB": "Ramp says open source is <5% of spend. Vercel says 56% of tokens. Both can be true and that's the point: the price of a token fell so far that the biggest volume is invisible in dollar data.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening (Vercel token share, Ramp token price index)"}, "link": "https://www.uncoveralpha.com/p/the-end-of-best-ai-model-wins-era", "id": 14}, {"cat": "AI/infra", "urgency": "deep", "source": "Uncover Alpha", "title": "Ramp: token volume up 7x, token spend up 5.5x and falling since July; effective price down 41%", "idea": "From Jan-Sep token volume across 70,000+ US businesses grew ~7x indexed while spend grew ~5.5x, peaked in July and has fallen since. AI spend dropped 5.2% in one week as volume hit a record; average effective price fell from $1.15/M (March) to $0.68/M (Sept). Top 1% of spenders: median per-employee spend fell 9.7% in a month. OpenAI and Anthropic cut prices on the same day (Sept 22); OpenAI's headline output price is down two-thirds in ~10 weeks.", "angle": "First clean evidence of price elasticity not saving revenue: volume up, dollars down.", "tweetA": "Tokens +50% since July. Spend down. That's a price war showing up in the data, and the people paying the most per employee cut the most. A 41% price drop in six months is a commodity curve, not a software one.", "tweetB": "OpenAI cut its headline output price by two-thirds in ten weeks and the lab margins are 70-80%. Both can't hold. Either volume 3x's or the margin story gets repriced before the IPOs. $MSFT", "charts": {"count": 1, "hot": true, "desc": "Ramp chart: token volume vs token spend, indexed Jan-Sep"}, "link": "https://www.uncoveralpha.com/p/the-end-of-best-ai-model-wins-era", "id": 15}, {"cat": "AI/infra", "urgency": "deep", "source": "Uncover Alpha", "title": "AlphaSense burns 35T tokens a year; routing beats frontier models and context is the bottleneck", "idea": "AlphaSense consumes ~35 trillion tokens/year - ~35x the 1T threshold that only ~375 Google Cloud customers crossed. Routing + post-training delivered ~3x better quality at lower cost than frontier models on an unoptimized system; per-question routing lifted answer quality up to 2.8x. Models are diverging, not converging, by task. Their SVP: 'The bottleneck is context.'", "angle": "Value accrues to whoever owns context and routing. Supports data-owner / vertical application theses.", "tweetA": "35 trillion tokens a year and the conclusion from the biggest enterprise token buyer is that no single model wins. Models are diverging. That makes the router the product.", "tweetB": "The constraint isn't intelligence anymore, it's context: permissions, proprietary data, workflow position. Which is another way of saying incumbents with data have the moat, not the labs. $FDS $SPGI", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.uncoveralpha.com/p/the-end-of-best-ai-model-wins-era", "id": 16}, {"cat": "tech", "urgency": "deep", "source": "Uncover Alpha", "title": "Meta's Muse hit 5M US downloads in 22 days (ChatGPT 56, Grok 103, Claude 492)", "idea": "Muse launched Sept 8; Sensor Tower: 5M US downloads in 22 days vs ChatGPT 56, Grok 103, Claude 492 days. >3M weekly prompters, >1M daily, ~2.5M DAU per alt data. Model underneath (Muse Spark 1.3) scores 61 vs Fable 5.1's 66. Harness: dedicated Linux VM per user, separate 'Sentinel' agent approving actions, integrations with Stripe Link / Shop Pay, WhatsApp distribution. Meta gave Muse up to 50% of its house ad impressions in two weeks. Free tier of 100M tokens/week ~ $155 of API value.", "angle": "Distribution beats benchmark. Meta gives ~$155/user/week of compute for free; does ad ARPU cover that?", "tweetA": "Muse is not the best model and has the fastest consumer AI ramp ever: 5M in 22 days vs 492 days for Claude. Distribution to 3.56B people is worth more than six points on a leaderboard. $META", "tweetB": "Meta handed each free user ~$155/week in API value, and half its house ads. Fast adoption bought with a margin that has to show up somewhere. The question is which line item. $META", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening (Sensor Tower download race)"}, "link": "https://www.uncoveralpha.com/p/the-end-of-best-ai-model-wins-era", "id": 17}, {"cat": "AI/infra", "urgency": "deep", "source": "Uncover Alpha", "title": "Why cheap tokens are a gift to hyperscalers: Kimi K3 needs 1,390GB of the 1,440GB in a DGX B200", "idea": "Kimi K3 (~2.78T params) at 4-bit needs ~1,390GB, 96.5% of an 8-GPU DGX B200's 1,440GB, before KV cache. Cheaper tokens don't mean cheaper compute. Hyperscalers sell open-weight tokens to thousands of customers with no leverage while selling compute to OpenAI/Anthropic who buy GW at a time. H100: $5-7/hr on-demand vs ~$2.60 one-year neocloud. Microsoft commercial RPO +84% to $678B but +25% ex-OpenAI. Baseten-type inference gross margins ~10% -> ~60% in 2026.", "angle": "Margin migrates from model labs to the infrastructure and inference layer.", "tweetA": "A 2.78T-parameter open model needs 96.5% of a DGX B200's memory just for weights. 'Cheap token' is a lab-margin story, not a GPU story. Inference providers went from ~10% to ~60% gross margin this year. $NVDA $CRWV", "tweetB": "Microsoft RPO +84% to $678B. Ex-OpenAI: +25%. One customer is carrying most of the growth, and the open-weight shift is sending the rest of the demand somewhere else. Read that as concentration risk and a diversification bid in one. $MSFT", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.uncoveralpha.com/p/the-end-of-best-ai-model-wins-era", "id": 18}, {"cat": "venture", "urgency": "deep", "source": "Uncover Alpha", "title": "AI app margins flipped by post-training open models: Cursor -23% to positive, Harvey -50% to positive", "idea": "AI-native gross margin averaged 52% (ICONIQ, Jan 2026) vs 41% in 2024, 20-30pts below SaaS. Cursor was -23% in Jan and turned positive by April via Composer on Kimi K2.5. Harvey fell from ~50% to -50% as usage rose 20x, then recovered after a Kimi K3-based model in August. Decagon routes 80% of queries to its own models. Fin (ex-Intercom): Apex model, 1/5 ": "https://www.uncoveralpha.com/p/the-end-of-best-ai-model-wins-era", "id": 20}, {"cat": "crypto", "urgency": "watch", "source": "Seven c Premium #159", "title": "'Alt OI close to or above BTC OI' preceded this week's volatility", "idea": "Teaser section: a year ago was 10/10 (the 2025 liquidation); this past week volatile. Author's rule: 'this usually happens when alt open interest gets close to or above BTC OI.' Newsletter body is largely paywalled (smart money DEX holdings, token unlocks, narratives, yields, prediction markets), using ChainEDGE, DeFiLlama, TokenUnlocks.", "angle": "Leverage-composition indicator: alt OI/BTC OI ratio as a fragility gauge.", "tweetA": "Alt open interest approaching BTC open interest is a better fragility gauge than funding. A week of volatility is what you get when the tail is wagging the dog. $BTC $ETH", "tweetB": "One year since 10/10. Same pattern: alt leverage builds, BTC absorbs the shock. I'd rather track the OI ratio than any narrative this week.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sevenc.substack.com/p/seven-c-premium-159", "id": 21}];
