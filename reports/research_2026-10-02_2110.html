<script>
var COLORS={macro:'#e24b4a',credit:'#378add',positioning:'#ef9f27','AI/infra':'#1d9e75',crypto:'#7f77dd',geopolitics:'#d85a30',energy:'#f97316',tech:'#06b6d4',gold:'#d4a017',culture:'#ec4899',labor:'#8b5cf6',regulation:'#64748b',science:'#14b8a6',venture:'#84cc16'};
var UEMO={act:'🔴',deep:'🔵',watch:'🟡'};
var ULAB={act:'🔴 Act Now',deep:'🔵 Deep',watch:'🟡 Watch'};
var state={cat:'all',urg:'all',src:null};
var openIds={};

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function tint(hex){return hex+'14';}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function visible(it){
  if(state.cat!=='all' && it.cat!==state.cat) return false;
  if(state.urg!=='all' && it.urgency!==state.urg) return false;
  if(state.src && it.source.indexOf(state.src)===-1) return false;
  return true;
}

function buildFilters(){
  var cats={};ITEMS.forEach(function(i){cats[i.cat]=(cats[i.cat]||0)+1;});
  var h='<span class="pill'+(state.cat==='all'?' on':'')+'" style="'+(state.cat==='all'?'background:#222':'')+'" onclick="setCat(\'all\')">All '+ITEMS.length+'</span>';
  Object.keys(cats).forEach(function(c){
    var on=state.cat===c, col=COLORS[c]||'#888';
    h+='<span class="pill'+(on?' on':'')+'" style="'+(on?'background:'+col:'')+'" onclick="setCat(\''+c+'\')">'+esc(c)+' '+cats[c]+'</span>';
  });
  document.getElementById('cats').innerHTML=h;
  var u={act:0,deep:0,watch:0};ITEMS.forEach(function(i){u[i.urgency]++;});
  var g='<span class="pill'+(state.urg==='all'?' on':'')+'" style="'+(state.urg==='all'?'background:#222':'')+'" onclick="setUrg(\'all\')">All</span>';
  ['act','deep','watch'].forEach(function(k){
    var on=state.urg===k;
    g+='<span class="pill'+(on?' on':'')+'" style="'+(on?'background:#222':'')+'" onclick="setUrg(\''+k+'\')">'+ULAB[k]+' '+u[k]+'</span>';
  });
  document.getElementById('urgs').innerHTML=g;
}

function cardHtml(it){
  var col=COLORS[it.cat]||'#888';
  var open=openIds[it.id]?' open':'';
  var ch=it.charts||{count:0,hot:false,desc:''};
  var mark=ch.hot?' 🔥':(ch.count>0?' 📊':'');
  var h='<div class="card'+open+'" id="c'+it.id+'">';
  h+='<div class="head" onclick="toggle('+it.id+')"><span class="num">'+it.id+'</span><span>'+UEMO[it.urgency]+'</span>';
  h+='<span class="badge" style="background:'+col+'">'+esc(it.source)+'</span><span class="tag">'+esc(it.cat)+'</span><span>'+mark+'</span>';
  h+='<span class="title">'+esc(it.title)+'</span></div>';
  h+='<div class="body"><div class="lab">The Idea</div><div>'+esc(it.idea)+'</div>';
  h+='<div class="angle" style="border-color:'+col+';background:'+tint(col)+'"><b style="font-style:normal">My Angle:</b> '+esc(it.angle)+'</div>';
  h+='<div class="tweets">';
  h+='<div class="tw"><span class="t" style="color:#378add">TWEET A</span>'+'<button class="copy-btn" onclick="copyTweet(' + it.id + ',\'a\')">📋 Copy</button>'+'<div>'+esc(it.tweetA)+'</div></div>';
  h+='<div class="tw"><span class="t" style="color:#7f77dd">TWEET B</span>'+'<button class="copy-btn" onclick="copyTweet(' + it.id + ',\'b\')">📋 Copy</button>'+'<div>'+esc(it.tweetB)+'</div></div>';
  h+='</div>';
  if(ch.count>0 || ch.desc){
    h+='<div class="chart'+(ch.hot?' hot':'')+'">'+(ch.count>0?'📊 '+ch.count+' chart(s): ':'')+esc(ch.desc)+'</div>';
  }
  h+='<div style="margin-top:10px"><a href="'+esc(it.link)+'" target="_blank" rel="noopener">↗ Read full article</a></div>';
  h+='</div></div>';
  return h;
}

function render(){
  var h='';var n=0;
  ITEMS.forEach(function(it){if(visible(it)){h+=cardHtml(it);n++;}});
  document.getElementById('cards').innerHTML=h||'<p class="small">No items match.</p>';
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+n+' of '+ITEMS.length+' items';
  buildFilters();
}

function toggle(id){
  openIds[id]=!openIds[id];
  var el=document.getElementById('c'+id);
  if(el) el.classList.toggle('open',!!openIds[id]);
}
function setCat(c){state.cat=c;state.src=null;openIds={};render();}
function setUrg(u){state.urg=u;state.src=null;openIds={};render();}
function filterBySrc(name){
  state.cat='all';state.urg='all';state.src=name;openIds={};
  ITEMS.forEach(function(it){if(it.source.indexOf(name)!==-1) openIds[it.id]=true;});
  render();
  window.scrollTo(0,0);
}
function toggleRep(){document.getElementById('rep').classList.toggle('open');}

function buildReport(){
  var h='<p><b>Window:</b> '+esc(META.windowStart)+' to '+esc(META.windowEnd)+'. Emails outside this window were not processed.</p>';
  h+='<p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items extracted: '+META.itemsExtracted+'</p>';
  h+='<p><b>Included sources</b> (click to filter)</p><ul>';
  META.includedSources.forEach(function(s,i){
    h+='<li><span class="src" data-i="'+i+'" onclick="filterBySrc(META.includedSources['+i+'].name)">'+esc(s.name)+'</span> — '+s.items+' item(s)</li>';
  });
  h+='</ul><p><b>Skipped</b></p><ul>';
  META.skippedSources.forEach(function(s){h+='<li>'+esc(s.name)+' — '+esc(s.reason)+'</li>';});
  h+='</ul>';
  document.getElementById('rep').innerHTML=h;
}

function init(){buildReport();render();}
init();
</script>
