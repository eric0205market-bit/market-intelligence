e clearest public-equity winners of AI power demand.", "quote": "Independent power producers (IPPs) have been the top performers, with a median ten-year annualized TSR of 23%", "locator": "Market Performance Within the Energy Sector", "quote_verified": true}, {"claim": "E&P companies trailed the energy sector with an 8% median 10-year annualized TSR, roughly one-third of IPPs, even though crude prices nearly doubled over the period.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["E&P companies", "Crude oil"], "conviction": "high", "so_what": "Commodity upside did not accrue to E&P shareholders.", "quote": "E&P companies’ market performance was subpar even though crude oil prices nearly doubled during this period", "locator": "Market Performance Within the Energy Sector", "quote_verified": true}, {"claim": "Higher crude prices lifted E&P earnings but did not translate into shareholder returns because of declining valuation multiples and equity dilution from M&A.", "speaker": "BCG Henderson Institute", "type": "causal", "entities": ["E&P companies"], "conviction": "high", "so_what": "Dilutive M&A and multiple compression can neutralize commodity tailwinds; watch share-count growth in E&P consolidation.", "quote": "the increase did not translate into higher shareholder returns because of declining valuation multiples and equity dilution resulting from M&A activity", "locator": "Market Performance Within the Energy Sector", "quote_verified": true}, {"claim": "Downstream O&G delivered a median 10-year annualized TSR of 16%, attributed to prolonged elevated refining margins and divesting peripheral businesses with proceeds returned to shareholders.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["Downstream O&G", "Refiners"], "conviction": "high", "so_what": "Focus plus cash return outperformed growth-at-any-price in O&G.", "quote": "Not far behind IPPs were downstream O&G companies, with a median ten-year annualized ic regions can spill over to the wider euro area economy through labour, product and financial market linkages, affecting activity, inflation and financial stability; spillovers are larger when the affected sectors or regions are central to economic activity.", "speaker": "European Central Bank", "type": "causal", "entities": ["euro area"], "conviction": "high", "so_what": "Regional climate events in economically central areas should be treated as potential aggregate macro shocks rather than local noise.", "quote": null, "locator": "While the effects of climate-related shocks", "quote_verified": false}, {"claim": "The costs of inaction on climate risks are higher than the costs of transitioning, and inaction can further exacerbate inequalities.", "speaker": "European Central Bank", "type": "thesis", "entities": ["ECB"], "conviction": "high", "so_what": "The ECB frames transition costs as the cheaper path, supporting continued policy push rather than delay.", "quote": "the costs of inaction in the face of climate risks are higher than the costs of transitioning and can further exacerbate inequalities", "locator": "It is also important to recall", "quote_verified": true}]}, {"theme": "Regional concentration and coal-region dynamics", "insights": [{"claim": "Phasing out coal in a mining-dependent region can hit many firms and workers simultaneously, and lost local jobs then weaken businesses, services and housing markets, creating cumulative effects that hinder adaptation.", "speaker": "European Central Bank", "type": "causal", "entities": ["coal"], "conviction": "medium", "so_what": "Undiversified carbon-dependent regions are where transition shocks become self-reinforcing local downturns with credit-quality implications.", "quote": null, "locator": "To illustrate this, think of", "quote_verified": false}, {"claim": "After a transition shock, regions heavily reliant on energy-intensive industries may see lower labour demand and weaker investment, raising credit risk and loan defaults.", "speaker": "European Central Bank", "type": "causal", "entities": ["energy-intensive industries"], "conviction": "medium", "so_what": "Bank loan books concentrated in energy-intensive regions face elevated transition-driven default risk.", "quote": "regions that rely heavily on energy-intensive industries could experience lower labour demand and weaker investment", "locator": "Moreover, after a transition shock", "quote_verified": true}, {"claim": "Some asymmetric effects may fade as households, firms and regions adapt, but without adequate policy support and investment some workers, sectors and regions may face persistent challenges.", "speaker": "European Central Bank", "type": "prediction", "entities": [], "conviction": "medium", "so_what": "Persistent regional scarring is the scenario most likely to matter for monetary policy and credit risk.", "quote": null, "locator": "While some asymmetric effects may fade", "quote_verified": false}]}, {"theme": "Food and energy prices, inflation expectations and wages", "insights": [{"claim": "Food and energy prices play an important role in shaping inflation expectations, so climate- or policy-driven increases in them matter for monetary policy beyond their direct CPI weight.", "speaker": "European Central Bank", "type": "causal", "entities": ["ECB", "food prices", "energy prices"], "conviction": "high", "so_what": "Climate-driven food/energy spikes risk de-anchoring expectations, making the ECB less willing to look through them.", "quote": "Food and energy prices play an important role in shaping inflation expectations.", "locator": "Food and energy prices play", "quote_verified": true}, {"claim": "Droughts can drive up food prices, which hit low-income households harder because they spend a larger share of income on essentials; persistent price increases may raise their credit risk and cut their other spending.", "speaker": "European Central Bank", "type": "causal", "entities": ["food prices"], "convic sses"], "conviction": "high", "so_what": "Roughly 6 in 10 small employers are using or about to use AI, so AI diffusion is already mainstream in the small-business segment, not confined to large corporates.", "quote": "46 percent of firms with at least one employee stated that their business or employees were using AI tools, with another 15 percent planning to adopt them in the next twelve months", "locator": "In the SBCS report on findings", "quote_verified": true}, {"claim": "Among small-business AI users, 63% say AI is somewhat or very important to production and 51% have partially or fully integrated AI into business processes.", "speaker": "Will Aarons", "type": "data_point", "entities": ["Small Business Credit Survey"], "conviction": "high", "so_what": "Adoption is moving beyond experimentation toward operational integration for about half of users.", "quote": "among AI users, 63 percent said that AI was somewhat or very important to production and 51 percent had integrated AI partially or fully", "locator": "In the SBCS report on findings", "quote_verified": true}, {"claim": "Small businesses may lack staff, expertise and resources to deploy AI, but may face fewer coordination challenges than large firms when integrating it; the concurrent surge in business startups alongside AI adoption hints AI may be a positive force for small firms.", "speaker": "Will Aarons", "type": "thesis", "entities": ["US small businesses", "business startups"], "conviction": "exploratory", "so_what": "Small firms could be relative beneficiaries of AI because of low integration friction, supporting the startup-formation boom.", "quote": "the concurrent surge in national business startups with the growing adoption of AI suggests that these tools may be a positive force for small businesses", "locator": "AI Use by Large and Small Businesses", "quote_verified": true}]}, {"theme": "AI users expect more hiring, not less", "insights": [{"claim": "There is little consensus on AI's employme // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
