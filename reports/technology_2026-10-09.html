e_verified": false}, {"claim": "The MacBook Air M5 at $1,099 was its lowest price since June, and the reviewer notes that laptop prices have gone up considerably over the past year.", "speaker": "Louryn Strampe", "type": "data_point", "entities": ["MacBook Air", "Luke Larsen"], "conviction": "medium", "so_what": "Even the discounted price sits above last year's, consistent with broad hardware price inflation.", "quote": null, "locator": null, "quote_verified": false}]}, {"theme": "Price inflation and supply signals", "insights": [{"claim": "Amazon raised prices on most Kindle models; the base Kindle that used to dip below $100 at sale events is now $104 on sale, and the Colorsoft base model rose to $290 from $250 at the end of August.", "speaker": "Louryn Strampe", "type": "data_point", "entities": ["Amazon", "Kindle", "Kindle Colorsoft"], "conviction": "high", "so_what": "Amazon's e-reader pricing floor has structurally shifted up.", "quote": null, "locator": null, "quote_verified": false}, {"claim": "The Mac Mini has been sold out for most of the year due to rapid escalation of interest in using it as a local, agentic AI machine; the new M6 model is faster and more expensive.", "speaker": "Louryn Strampe", "type": "causal", "entities": ["Mac Mini", "Apple", "Luke Larsen"], "conviction": "medium", "so_what": "Agentic-AI demand is showing up as consumer hardware scarcity.", "quote": "The Mac Mini has been sold out for the majority of this year due to the rapid escalation of interest in using them as local, agentic AI machines.", "locator": "A Rare Mac Mini Discount", "quote_verified": true}, {"claim": "The 11-inch iPad on Amazon is described as one of the only iPad deals that survived Apple's price hikes earlier this year.", "speaker": "Louryn Strampe", "type": "data_point", "entities": ["iPad", "Apple", "Amazon"], "conviction": "medium", "so_what": "Apple raised iPad pricing in 2026, limiting promotional room.", "quote": null, "locator": null, "quote_verified": false}]}, {"theme": "Model-refresh clearance", "insights": [{"claim": "Older models were discounted as successors launched: Bose QuietComfort Headphones (1st Gen) at $169 (53% off) as Bose phases them out, Sonos Beam Gen 2 at $359 after the Beam Ultra, and Sony WH-1000XM5 at $198 (about 50% off).", "speaker": "Louryn Strampe", "type": "data_point", "entities": ["Bose", "Sonos", "Sony", "QuietComfort Headphones", "WH-1000XM5"], "conviction": "medium", "so_what": "Prior-generation audio gear is the main source of deep discounts as vendors refresh lineups.", "quote": null, "locator": null, "quote_verified": false}]}], "insight_total": 6, "top_entities": ["Amazon", "MacBook Air", "AirPods Pro 3", "Kindle Colorsoft", "Mac Mini", "Apple", "Sonos", "Bose", "Sony", "Shark"], "source_meta": {"author": "Louryn Strampe", "word_count": 6584, "paywalled": false}}, {"record_id": "c92b9bc9c8a478f1", "source_type": "technology", "source_name": "Wired", "source_url": "https://www.wired.com/story/the-man-behind-a-west-bank-telegram-channel-trying-to-keep-palestinian-drivers-safe/", "title": "The Man Behind a West Bank Telegram Channel Trying to Keep Palestinian Drivers Safe", "published_date": "2026-10-08", "language": "en", "processed_at": "2026-10-09T11:05:15Z", "processor": "claude-code-sub-opus", "tags": ["Society", "Tech", "Geopolitics"], "gist": "Anas Hattab's volunteer-run 'Road Conditions' Telegram group, with nearly 350,000 followers, has become the de facto real-time checkpoint-status utility for Palestinians in the West Bank because mainstream navigation apps ignore 942 barriers. WIRED's reporting used its data to show checkpoint delays up over 50 percent since October 2023, while the operation depends on unpaid moderators and one exhausted founder.", "themes": [{"theme": "Navigation apps fail Palestinian drivers", "insights": [{"claim": "Major navigation apps such as Google Maps do not mark the 942 checkpoints, gates and other barriers fragmenting the West Bank and default to algorithmically fastest routes that often run through settlements and Israeli-controlled areas.", "speaker": "Lama Rabah", "type": "data_point", "entities": ["Google Maps", "West Bank"], "conviction": "high", "so_what": "Mainstream mapping products have a structural blind spot in contested territories, leaving room for local data utilities.", "quote": null, "locator": null, "quote_verified": false}, {"claim": "Israel restricts or bars Palestinian vehicles from many main West Bank arteries while Israeli vehicles pass freely, so a Palestinian driver following app directions risks arrest, fines or being shot.", "speaker": "Lama Rabah", "type": "causal", "entities": ["Israel", "West Bank", "Google Maps"], "conviction": "high", "so_what": "The failure is a safety issue, not just a convenience gap, which raises the value of verified local data.", "quote": null, "locator": null, "quote_verified": false}, {"claim": "Trips that used to take Hattab one hour from Tulkarm to Ramallah now often take two to three hours or far longer because of military checkpoints.", "speaker": "Lama Rabah", "type": "anecdote", "entities": ["Anas Hattab", "Tulkarm", "Ramallah"], "conviction": "high", "so_what": "Illustrates the daily cost of the checkpoint regime on mobility.", "quote": null, "locator": null, "quote_verified": false}]}, {"theme": "Road Conditions as crowdsourced utility", "insights": [{"claim": "Hattab launched the Telegram group 'Road Conditions' in 2019 so Palestinians could share checkpoint delays, closures and settler or military presence; membership came as a trickle at first and a flood once checkpoints multiplied in 2022.", "speaker": "Lama Rabah", "type": "anecdote", "entities": ["Anas Hattab", "Road Conditions", "Telegram"], "conviction": "high", "so_what": "A simple chat group scaled into critical infrastructure because it filled an information void.", "quote": null, "locator": null, "quote_verified": false}, {"claim": "Nearly 350,000 people follow the group, local radio stations build their hourly road segments from its dispatches, and a routing system used by West Bank companies plus a new local app ingest its data.", "speaker": "Lama Rabah", "type": "data_point", "entities": ["Road Conditions", "Telegram"], "conviction": "high", "so_what": "Downstream products depend on a single volunteer-run data source, which is both a moat and a fragility.", "quote": null, "locator": null, "quote_verified": false}, {"claim": "To keep reports reliable, Hattab closed the public chat and recruited active contributors as moderators; more than a dozen volunteers verify each report by asking people on the ground, cross-checking local pages or driving the roads themselves before anything is posted.", "speaker": "Lama Rabah", "type": "framework", "entities": ["Road Conditions", "Anas Hattab"], "conviction": "high", "so_what": "Human verification plus restricted posting is the quality mechanism for crowdsourced real-time data.", "quote": null, "locator": null, "quote_verified": false}, {"claim": "Status in the feed changes within minutes ('clear', 'open' and 'closed' can all be true within the same hour), and user spikes of thousands at a time during city lockdowns generate thousands of questions a day for the founder.", "speaker": "Lama Rabah", "type": "data_point", "entities": ["Anas Hattab"], "conviction": "medium", "so_what": "Real-time accuracy requirements make this a labor-intensive service that is hard to automate.", "quote": "\"Ten minutes is a long time,\"", "locator": "Dozens of commuters would ask", "quote_verified": true}, {"claim": "Hattab's odometer went from 70,000 to 274,000 kilometers in four years inside a territory about 130 kilometers across, and he spent six months driving without a destination to learn every checkpoint name and bypass route.", "speaker": "Lama Rabah", "type": "anecdote", "entities": ["Anas Hattab", "West Bank"], "conviction": "high", "so_what": "Ground-truth knowledge, not technology, is the scarce input in this system.", "quote": null, "locator": null, "quote_verified": false}]}, {"theme": "Checkpoint delays quantified", "insights": [{"claim": "An investigation published in September with the Palestine Reporting Lab, Arab Reporters for Investigative Journalism and Lighthouse Reports found checkpoint delays up more than 50 percent since October 7, 2023.", "speaker": "Lama Rabah", "type": "data_point", "entities": ["Palestine Reporting Lab", "Arab Reporters for Investigative Journalism", "Lighthouse Reports"], "conviction": "high", "so_what": "Provides a quantified baseline for the deterioration of West Bank mobility.", "quote": null, "locator": null, "quote_verified": false}, {"claim": "The average West Bank commuter now loses about 77 hours a year on roundabout routes to avoid checkpoints, and formerly 10-minute drives between towns have become hour-long trips.", "speaker": "Lama Rabah", "type": "data_point", "entities": ["West Bank"], "conviction": "high", "so_what": "Time lost translates into an economic drag on the territory.", "quote": null, "locator": null, "quote_verified": false}, {"claim": "No official data exists on checkpoint delays, so WIRED's team built its database by scraping updates that originated in Hattab's Road Conditions group.", "speaker": "Lama Rabah", "type": "causal", "entities": ["WIRED", "Road Conditions"], "conviction": "high", "so_what": "Crowdsourced channels can be the only available dataset in opaque conflict settings.", "quote": null, "locator": null, "quote_verified": false}]}, {"theme": "Military and settler risk", "insights": [{"claim": "After October 2023 a soldier near Qalqilya took Hattab's phone, scrolled through about 20,000 photos he had received, and ordered him to delete everything; he deleted thousands before being released, and now avoids showing military jeeps or any soldier in posts.", "speaker": "Lama Rabah", "type": "anecdote", "entities": ["Anas Hattab", "Qalqilya"], "conviction": "high", "so_what": "Operators of such channels face device searches and self-censor, which limits the information they can publish.", "quote": null, "locator": null, "quote_verified": false}, {"claim": "Settlers in nearly 150 official settlements and 185 new outposts established since 2023 have become a daily threat; the Colonization and Wall Resistance Commission documented nearly 5,443 settler attacks in 2025 and about 4,766 in the first eight months of 2026.", "speaker": "Lama Rabah", "type": "data_point", "entities": ["Colonization and Wall Resistance Commission"], "conviction": "medium", "so_what": "Settler violence is running at a pace similar to or above 2025 levels, raising demand for real-time warnings.", "quote": null, "locator": null, "quote_verified": false}, {"claim": "Hattab can predict follow-on closures across a whole corridor when a major junction shuts, 'like dominoes'.", "speaker": "Lama Rabah", "type": "framework", "entities": ["Anas Hattab"], "conviction": "medium", "so_what": "Experience-based pattern recognition adds predictive value beyond raw reporting.", "quote": null, "locator": null, "quote_verified": false}]}, {"theme": "Fragile economics and ecosystem", "insights": [{"claim": "Hattab runs the operation with no institutional support and two young children, cannot pay his moderators beyond thanks, and believes the operation should be ten times its size.", "speaker": "Lama Rabah", "type": "thesis", "entities": ["Anas Hattab", "Road Conditions"], "conviction": "high", "so_what": "A critical public utility runs on unpaid labor, a sustainability and key-person risk.", "quote": null, "locator": null, "quote_verified": false}, {"claim": "Computer engineers Musab Nuirat and Ahmed Gharib launched the app A Ween Rayeh in 2025, a real-time traffic heat map; by Nuirat's count it was the seventh local attempt at a West Bank navigation system, and like nearly all the others it relied on Hattab's data.", "speaker": "Lama Rabah", "type": "data_point", "entities": ["A Ween Rayeh", "Musab Nuirat", "Ahmed Gharib", "Anas Hattab"], "conviction": "high", "so_what": "Local app builders have repeatedly failed to build their own data layer, so the Telegram feed is the de facto platform.", "quote": null, "locator": null, "quote_verified": false}, {"claim": "Hattab quit his newspaper job for a construction-equipment sales role so that he would drive a different road every day, saying his point 'is not sales' but Road Conditions.", "speaker": "Lama Rabah", "type": "anecdote", "entities": ["Anas Hattab"], "conviction": "high", "so_what": "The founder organizes his livelihood around data collection.", "quote": null, "locator": null, "quote_verified": false}]}], "insight_total": 17, "top_entities": ["Anas Hattab", "Road Conditions", "Telegram", "West Bank", "Google Maps", "A Ween Rayeh", "Tulkarm", "Ramallah", "Palestine Reporting Lab"], "source_meta": {"author": "Lama Rabah", "word_count": 1916, "paywalled": false}}, {"record_id": "ce3fd424cf6e095f", "source_type": "technology", "source_name": "Wired", "source_url": "https://www.wired.com/story/shark-prime-day-vacuum-deals-10-07-2026/", "title": "Last Call for Prime Day Deals on Two Shark Vacuums I Love", "published_date": "2026-10-07", "language": "en", "processed_at": "2026-10-09T11:05:15Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "WIRED's Nena Farrell recommends two Shark vacuum deals on the last day of Amazon's Prime Big Deal Days: the PowerDetect cordless stick at $300 and the PowerDetect UV Reveal robot at $750 (42% off). This is an affiliate-style deal post.", "themes": [{"theme": "Shark vacuum deals", "insights": [{"claim": "The Shark PowerDetect UV Reveal robot vacuum fell to $750 from $1,300 (42% off) and uses a UV light to spot stains and go back to clean them; the author calls it the best robot vacuum she has tried and notes this is the lowest price typically seen.", "speaker": "Nena Farrell", "type": "data_point", "entities": ["Shark PowerDetect UV Reveal", "Nena Farrell", "Amazon torage cost driver.", "quote": null, "locator": "China leads the world on grid-scale storage costs", "quote_verified": false}, {"claim": "Japan, Australia and the Philippines will keep a storage cost premium because of import duties, high installation costs and domestic manufacturing policies.", "speaker": "Wood Mackenzie", "type": "prediction", "entities": ["Japan", "Australia", "Philippines"], "conviction": "medium", "so_what": "Trade and local-content policy preserve higher storage costs in some APAC markets.", "quote": null, "locator": "Competitive Chinese supply is expected", "quote_verified": false}, {"claim": "Asia Pacific solar in the highest-cost market is more than 200% above the lowest in 2026, a gap expected to widen to 250% by 2030, while onshore wind costs vary more than six-fold across the region.", "speaker": "Wood Mackenzie", "type": "data_point", "entities": ["Asia Pacific", "solar"], "conviction": "medium", "so_what": "Regional cost dispersion implies uneven transition economics within APAC.", "quote": null, "locator": "Utility-scale solar PV remains the most cost-competitive", "quote_verified": false}]}, {"theme": "Europe, North America and Latin America", "insights": [{"claim": "Europe's turnkey battery capex rose about 2%, the first increase in three years, as cell prices rebounded about 10% from their 2025 low, with capex forecast to fall 12% by 2031 before lithium prices roughly double in 2029.", "speaker": "Wood Mackenzie", "type": "data_point", "entities": ["Europe", "lithium"], "conviction": "high", "so_what": "Battery cost declines may stall as lithium rebounds from oversupply.", "quote": null, "locator": "Battery storage turnkey capex rose about 2%", "quote_verified": false}, {"claim": "Europe has the highest fossil-fuel generation costs of any modeled region, with levelized carbon costs projected to surpass fuel costs by 2030.", "speaker": "Wood Mackenzie", "type": "prediction", "entities": ["Europe"], "conviction": "medium", "so_what": "Carbon pricing will become the largest cost component of fossil power in Europe.", "quote": null, "locator": "Europe carries the highest fossil-fuel generation costs", "quote_verified": false}, {"claim": "North American solar faces tariffs, anti-dumping duties and Section 232 restrictions, with module prices rising about 5% annually through 2030 for utility-scale, and 6% in 2027 and 14% in 2028 for residential and commercial.", "speaker": "Wood Mackenzie", "type": "data_point", "entities": ["Section 232", "North America", "168 GW"], "conviction": "high", "so_what": "US trade policy is raising solar costs, particularly for distributed generation, while safe-harboured capacity cushions utility-scale.", "quote": null, "locator": "Near-term solar costs are under pressure", "quote_verified": false}, {"claim": "US gas generation investment is entering a supply deficit cycle through the late 2030s driven by data centre load growth, keeping thermal capital costs elevated, while storage tax credits partly offset FEOC restrictions until a cost spike after ITC phase-out from 2038.", "speaker": "Wood Mackenzie", "type": "prediction", "entities": ["data centre", "FEOC", "ITC"], "conviction": "medium", "so_what": "Data center demand is tightening gas supply chains and raising the relative appeal of storage and renewables.", "quote": null, "locator": "Tax credits continue to provide a competitive advantage for storage", "quote_verified": false}, {"claim": "Latin America's single-axis solar is the cheapest source in 2026, with costs falling 38% by 2060, and onshore wind LCOE is forecast to fall nearly 21% by 2030 from US$73/MWh to US$58/MWh as Chinese OEMs intensify competition.", "speaker": "Wood Mackenzie", "type": "data_point", "entities": ["Brazil", "Chile", "Mexico", "Chinese OEM"], "conviction": "high", "so_what": "Chinese turbine OEM expansion is lowering wind costs in emerging markets.", "quote": null, "locator": "Solar PV with single-axis tracking remains the lowest-cost   thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',

};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
