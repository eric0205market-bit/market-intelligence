const META = {"date": "2026-10-29", "time": "15:18 CEST", "windowStart": "2026-10-29 09:18 CEST", "windowEnd": "2026-10-29 15:18 CEST", "emailsInWindow": 25, "emailsRead": 25, "itemsExtracted": 60, "includedSources": [{"name": "Azeem Azhar / Exponential View", "items": 1}, {"name": "SixSigmaCapital", "items": 4}, {"name": "Tiger Research", "items": 2}, {"name": "Peter Boockvar / Boock Report", "items": 4}, {"name": "Dark Side of the Boom", "items": 4}, {"name": "Lucky Trader / Morning Minute", "items": 7}, {"name": "Unchained", "items": 4}, {"name": "Mando Minutes", "items": 5}, {"name": "The Market House / Dale Pinkert", "items": 4}, {"name": "David Rosenberg / Early Morning with Dave", "items": 1}, {"name": "Macro Charts", "items": 1}, {"name": "ChinaTalk / Irene Zhang x Xianyu", "items": 6}, {"name": "Noah Smith / Noahpinion", "items": 3}, {"name": "Big Price Moves Explained", "items": 6}, {"name": "Michael Spencer / AI Supremacy", "items": 2}, {"name": "Adler Insight", "items": 1}, {"name": "Chris Tottman / The Founders Corner", "items": 1}, {"name": "Hard Fork", "items": 1}, {"name": "Michael Parekh / AI Ramblings Daily", "items": 3}], "skippedSources": [{"name": "Cubic Analytics (Want The Invite?)", "reason": "Pure promotion: livestream invite + 50% discount code"}, {"name": "Finom Group (Market Mania #28)", "reason": "Link-only promo/teaser, no analytical sentences"}, {"name": "SixSigmaCapital (Position Exit)", "reason": "Teaser only ('+160%'); ticker and rationale behind paywall/portfolio channel"}]};
var COLORS={macro:"#e24b4a",credit:"#378add",positioning:"#ef9f27","AI/infra":"#1d9e75",crypto:"#7f77dd",geopolitics:"#d85a30",energy:"#f97316",tech:"#06b6d4",gold:"#d4a017",culture:"#ec4899",labor:"#8b5cf6",regulation:"#64748b",science:"#14b8a6",venture:"#84cc16"};
var UE={red:"🔴",deep:"🔵",watch:"🟡"};
var fc="all",fu="all",fs=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function vis(it){return (fc==="all"||it.cat===fc)&&(fu==="all"||it.urgency===fu)&&(!fs||it.source.indexOf(fs)>=0);}
function pill(label,on,color,fn){var b=document.createElement("span");b.className="pill"+(on?" on":"");b.textContent=label;if(on)b.style.background=b.style.borderColor=color||"#555";b.onclick=fn;return b;}
function bars(){
  var cb=document.getElementById("catbar");cb.innerHTML="";
  cb.appendChild(pill("All "+ITEMS.length,fc==="all"&&!fs,"#555",function(){fc="all";fs=null;render();}));
  Object.keys(COLORS).forEach(function(c){var n=ITEMS.filter(function(i){return i.cat===c;}).length;if(!n)return;
    cb.appendChild(pill(c+" "+n,fc===c,COLORS[c],function(){fc=c;fs=null;render();}));});
  var ub=document.getElementById("urgbar");ub.innerHTML="";
  [["all","All"],["red","🔴 Act Now"],["deep","🔵 Deep"],["watch","🟡 Watch"]].forEach(function(u){
    var n=u[0]==="all"?ITEMS.length:ITEMS.filter(function(i){return i.urgency===u[0];}).length;
    ub.appendChild(pill(u[1]+" "+n,fu===u[0],"#555",function(){fu=u[0];fs=null;render();}));});
}
function card(it){
  var col=COLORS[it.cat]||"#555",ch=it.charts||{};
  var h='<div class="card" id="c'+it.id+'"><div class="hd" onclick="this.parentNode.classList.toggle(\'open\')">'
   +'<span class="num">'+it.id+'</span><span>'+UE[it.urgency]+'</span><span class="src" style="background:'+col+'">'+esc(it.source)+'</span>'
   +'<span class="cat">'+esc(it.cat)+'</span>'+(ch.hot?'<span>🔥</span>':(ch.count?'<span>📊</span>':''))
   +'<span class="ttl">'+esc(it.title)+'</span></div><div class="bd">'
   +'<div class="lbl">The Idea</div><div>'+esc(it.idea)+'</div>'
   +'<div class="lbl">My Angle</div><div class="angle" style="border-color:'+col+';background:'+col+'14">'+esc(it.angle)+'</div>'
   +'<div class="tw"><div><div class="lbl" style="color:#378add">Tweet A</div><p>'+esc(it.tweetA)+'</p>'
   +'<button class="copy-btn" onclick="copyTweet(' + it.id + ',\'a\')">📋 Copy</button></div>'
   +'<div><div class="lbl" style="color:#7f77dd">Tweet B</div><p>'+esc(it.tweetB)+'</p>'
   +'<button class="copy-btn" onclick="copyTweet(' + it.id + ',\'b\')">📋 Copy</button></div></div>'
   +'<div class="chart'+(ch.hot?' hot':'')+'">'+(ch.hot?'🔥 CHART WORTH SAVING — ':'📊 ')+(ch.desc?esc(ch.desc):'No chart in email; article may have charts — worth opening')+(ch.count?' ('+ch.count+')':'')+'</div>'
   +'<a class="lnk" href="'+esc(it.link)+'" target="_blank" rel="noopener">↗ Read full article</a></div></div>';
  return h;
}
function render(){
  bars();
  var shown=ITEMS.filter(vis);
  document.getElementById("cards").innerHTML=shown.map(card).join("")||"<p>No items.</p>";
  if(fs){shown.forEach(function(it){document.getElementById("c"+it.id).classList.add("open");});}
}
function filterBySrc(name){fs=name;fc="all";fu="all";render();window.scrollTo(0,0);}
function init(){
  document.getElementById("sub").textContent=META.date+" · "+META.time+" · "+ITEMS.length+" items";
  var r='<p>Window: '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</p>'
   +'<p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items extracted: '+META.itemsExtracted+'</p><p><b>Included sources</b> (click to filter):<br>';
  META.includedSources.forEach(function(s,i){r+='<span class="sl" data-i="'+i+'">'+esc(s.name)+' ('+s.items+')</span>';});
  r+='</p><p><b>Skipped</b>:</p><ul>';
  META.skippedSources.forEach(function(s){r+='<li>'+esc(s.name)+' — '+esc(s.reason)+'</li>';});
  r+='</ul>';
  document.getElementById("rb").innerHTML=r;
  Array.prototype.forEach.call(document.querySelectorAll(".sl"),function(e){e.onclick=function(){filterBySrc(META.includedSources[+e.getAttribute("data-i")].name);};});
  render();
}
init();
