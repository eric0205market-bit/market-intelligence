s": [{"claim": "ULA said its Vulcan return-to-flight mission experienced low booster performance just after liftoff, causing stage separation at too low an altitude and velocity to reach orbit, while the Centaur V upper stage and solid rocket boosters performed nominally.", "speaker": "Eric Berger", "type": "data_point", "entities": ["United Launch Alliance", "Vulcan", "Centaur V"], "conviction": "high", "so_what": "Core-stage issue isolates the problem to the booster/BE-4 system.", "quote": "the launch vehicle experienced low booster performance, resulting in stage separation occurring when the vehicle was low in altitude and below minimal velocity to reach orbit", "locator": null, "quote_verified": true}, {"claim": "According to preliminary data cited by two independent sources, the Vulcan problem is believed to originate on the launch vehicle side, possibly systems feeding methane and liquid oxygen, rather than in the BE-4 engines.", "speaker": "Eric Berger", "type": "thesis", "entities": ["Vulcan", "BE-4", "United Launch Alliance", "Blue Origin"], "conviction": "low", "so_what": "If confirmed, Blue Origin's engine program is less exposed; the author stresses no definitive conclusions yet.", "quote": null, "locator": "However, according to preliminary data, two", "quote_verified": false}, {"claim": "Engineers are examining whether one BE-4 engine dropped thrust shortly after liftoff and never recovered; tracking video appeared to show one engine dimmer than the other after booster jettison, and asymmetric shutdown may explain attitude motion near stage separation.", "speaker": "Eric Berger", "type": "data_point", "entities": ["BE-4", "United Launch Alliance", "Vulcan"], "conviction": "low", "so_what": "Watch the FAA-overseen investigation outcome for root cause attribution.", "quote": null, "locator": "ULA engineers are looking at the", "quote_verified": false}, {"claim": "Two sources describe the ULA/Blue Origin investigation, overseen by the FAA, as incredibly ied valve passed qualification and is being rolled out fleet-wide, targeting return to flight as early as January.", "speaker": "Eric Berger", "type": "data_point", "entities": ["Blue Origin", "New Glenn", "BE-4"], "conviction": "high", "so_what": "Track whether New Glenn's January target holds.", "quote": "Our modified valve has already been incorporated into engines slated for upcoming flights", "locator": null, "quote_verified": true}, {"claim": "If the Vulcan failure is ultimately traced to the BE-4 engine, it would delay New Glenn's return to flight, a setback for both Blue Origin and NASA, which relies on New Glenn for much of its Artemis Program and Moon Base heavy lifting.", "speaker": "Eric Berger", "type": "causal", "entities": ["BE-4", "New Glenn", "Blue Origin", "NASA", "Artemis"], "conviction": "medium", "so_what": "Root-cause attribution is the key binary for Blue Origin and Artemis timelines.", "quote": null, "locator": "If Vulcan’s failure were ultimately due", "quote_verified": false}]}], "insight_total": 9, "top_entities": ["United Launch Alliance", "Vulcan", "BE-4", "Blue Origin", "New Glenn", "Centaur V", "Amazon Leo", "US Space Force", "NASA", "Federal Aviation Administration"], "source_meta": {"author": "Eric Berger", "word_count": 755, "paywalled": false}}, {"record_id": "0ec5d8d088084a4d", "source_type": "technology", "source_name": "SemiWiki", "source_url": "https://semiwiki.com/forum/threads/26247", "title": "Stand with Jensen Site", "published_date": "2026-11-17", "language": "en", "processed_at": "2026-11-19T11:07:52Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI", "Positioning", "Society"], "gist": "SemiWiki's Daniel Nenni shares the 'Stand with Jensen' petition site, which asks Nvidia's board to reinstate Jensen Huang as CEO after his November 12, 2026 resignation pending an independent investigation, and to explain its decision; the site claimed ~194,000 self-reported, unverified signatures as of November 17.", "themes": idia's board to take three actions: reinstate Huang while an independent investigation establishes the facts, guarantee an independent inquiry with a fair hearing and disclosed scope and timeline, and provide a timely public explanation of the evidence and how employee and shareholder interests were weighed.", "speaker": "Daniel Nenni", "type": "framework", "entities": ["NVIDIA Board", "Jensen Huang"], "conviction": "high", "so_what": "These are the concrete asks to track against board communications; any concession signals the board's position is softening.", "quote": null, "locator": "We ask the Board to take", "quote_verified": false}, {"claim": "The petition argues that suspicion or association alone is not a sufficient basis for ending Jensen Huang's leadership of Nvidia and that the inquiry must establish facts rather than justify an outcome already imposed.", "speaker": "Daniel Nenni", "type": "thesis", "entities": ["Jensen Huang", "NVIDIA"], "conviction": "high", "so_what": "Frames the governance dispute as process legitimacy, which shapes how institutional holders may vote or engage.", "quote": "Suspicion or association alone is not a sufficient basis for ending Jensen's leadership.", "locator": "Our understanding is that an outside", "quote_verified": true}, {"claim": "Signers of the Stand with Jensen letter describe themselves as current and former Nvidia employees, partners, shareholders and supporters, and credit Huang with betting the company on ideas most of the industry dismissed.", "speaker": "Daniel Nenni", "type": "anecdote", "entities": ["NVIDIA", "Jensen Huang"], "conviction": "medium", "so_what": "Signals potential internal morale and talent-retention risk if employees strongly identify with the departed founder.", "quote": null, "locator": "For thirty-three years, Jensen poured", "quote_verified": false}]}, {"theme": "Campaign credibility and scale", "insights": [{"claim": "As of November 17, 2026 the Stand with Jensen site displayed roughly 194,000 signatures, a campaign-reported count whose signer affiliations are self-reported and unverified.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["Stand with Jensen"], "conviction": "medium", "so_what": "Signature counts gauge public sentiment but are unverified; treat as a soft indicator of pressure on the board.", "quote": "As of November 17, the site displayed roughly 194,000 signatures.", "locator": "As of November 17, the site", "quote_verified": true}, {"claim": "The Stand with Jensen campaign says it is volunteer-run and not affiliated with or endorsed by Nvidia or Huang, while the Wall Street Journal reported that an Nvidia employee built the site using Replit.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["Stand with Jensen", "Wall Street Journal", "Replit", "NVIDIA"], "conviction": "medium", "so_what": "Employee involvement suggests internal dissent with the board's decision, a cultural risk to monitor.", "quote": "The Wall Street Journal reported that an Nvidia employee built the site using Replit.", "locator": "The campaign describes itself as volunteer-run", "quote_verified": true}]}], "insight_total": 8, "top_entities": ["NVIDIA", "Jensen Huang", "Stand with Jensen", "Replit", "Wall Street Journal", "Board"], "source_meta": {"author": "Daniel Nenni", "word_count": 620, "paywalled": false}}, {"record_id": "1fe8a2c653a41a3a", "source_type": "technology", "source_name": "NVIDIA Developer Blog", "source_url": "https://developer.nvidia.com/blog/tackling-gpu-bottlenecks-in-plane-wave-dft-with-k-point-batching-and-mixed-precision/", "title": "Tackling GPU Bottlenecks in Plane-Wave DFT with K-Point Batching and Mixed Precision | NVIDIA Technical Blog", "published_date": "2026-11-18", "language": "en", "processed_at": "2026-11-19T11:06:28Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI", "Energy"], "gist": "NVIDIA introduces Daviator, a batched k-point/spin GPU kernel library for VASP's Davidson eigensolver, plus a mixed-precision (FP32 with FP64 islands) layer; together they claim up to 22x faster and 60-75% cheaper (~$5-6M saved) generation of an OMat24-scale DFT dataset for MLIP training versus CPU, with the cheapest option on RTX PRO 6000. The piece frames FP64-stagnant GPU roadmaps as forcing HPC codes toward mixed precision.", "themes": [{"theme": "DFT data demand for MLIP training", "insights": [{"claim": "Training a next-generation machine learning interatomic potential (MLIP) requires tens to hundreds of millions of density functional theory (DFT) calculations of energies, forces, and stresses.", "speaker": "Erica Tsai", "type": "thesis", "entities": ["MLIP", "DFT"], "conviction": "high", "so_what": "AI-for-materials creates a massive, recurring HPC compute demand for ground-truth data generation.", "quote": null, "locator": "Training a next-generation machine learning interatomic potential", "quote_verified": false}, {"claim": "Plane-wave DFT, with VASP as its dominant implementation, is described as the gold standard for generating MLIP training data and is ubiquitous at national labs and research institutions.", "speaker": "Erica Tsai", "type": "thesis", "entities": ["VASP", "DFT"], "conviction": "high", "so_what": "Accelerating VASP specifically captures the bulk of materials-science DFT compute spend.", "quote": null, "locator": "Plane-wave DFT, with VASP as its", "quote_verified": false}, {"claim": "The Open Materials 2024 (OMat24) dataset contains over 100 million VASP data points from AIMD, rattled-relax, and rattled static calculations for MLIP training and validation.", "speaker": "Erica Tsai", "type": "data_point", "entities": ["OMat24", "VASP"], "conviction": "high", "so_what": "Sizes the benchmark workload NVIDIA uses to argue GPU economics for scientific AI data generation.", "quote": null, "locator": "The Open Materials 2024 (OMat24) inorganic", "quote_verified": false}]}, {"theme": "Small-system GPU bottleneck and Daviator batching", "insights": [{"claim": "VASP's OpenACC GPU port processes k-points sequentially, so for small systems with dense k-point grids kernel launch overhead dominates and a single-atom iron system with 752 k-points ran 8x slower on GPU than on CPU.", "speaker": "Erica Tsai", "type": "data_point", "entities": ["VASP", "OpenACC"], "conviction": "high", "so_what": "Shows that prior GPU ports left a large slice of DFT workloads better served by CPUs, a gap NVIDIA now targets.", "quote": null, "locator": "Each k-point solve is largely independent", "quote_verified": false}, {"claim": "Daviator is an NVIDIA GPU kernel library that replaces sequential per-k-point processing with batched FFTs, GEMMs, and custom kernels in a batched Davidson eigensolver, raising SM occupancy from a fraction of capacity to near saturation while VASP keeps ownership of the SCF loop, mixing, symmetry, and I/O.", "speaker": "Erica Tsai", "type": "causal", "entities": ["Daviator", "NVIDIA", "VASP"], "conviction": "high", "so_what": "Software batching unlocks GPU utilization on workloads previously CPU-bound, expanding addressable GPU demand in HPC.", "quote": null, "locator": "Daviator is a library of GPU", "quote_verified": false}, {"claim": "Daviator-enabled VASP delivers over 2x speed-up vs CPU on a single iron atom, a 22x Davidson speedup on LiFePO4 with r2SCAN, and more than 85% lower execution time on a 64-atom Bi-doped GaAs system, improving on prior state of the art at all system sizes.", "speaker": "Erica Tsai", "type": "data_point", "entities": ["Daviator", "VASP", "LiFePO4", "r2SCAN"], "conviction": "high", "so_what": "Removes the need to route jobs between CPU and GPU by size, simplifying full migration of DFT fleets to GPUs.", "quote": null, "locator": "Daviator overcomes the OpenACC port’s limitations", "quote_verified": false}, {"claim": "VASP with Daviator is currently limited to single-node execution, with multi-node support, non-collinear spin (vasp_ncl) and gamma-only (vasp_gam) coverage expected later.", "speaker": "Erica Tsai", "type": "prediction", "entities": ["Daviator", "VASP"], "conviction": "medium", "so_what": "Adoption limits for large-scale runs; watch for multi-node release as a trigger for broader uptake.", "quote": null, "locator": "For now, VASP with Daviator is", "quote_verified": false}, {"claim": "Daviator and its mixed-precision option are distributed through the NVIDIA ALCHEMI VASP microservice, require a VASP user license, and work with existing VASP inputs by setting LDAVIATOR=True in the INCAR.", "speaker": "Erica Tsai", "type": "framework", "entities": ["NVIDIA ALCHEMI", "Daviator", "VASP"], "conviction": "high", "so_what": "NVIDIA is packaging scientific software as microservices, tying ecosystem lock-in to its GPU platform.", "quote": null, "locator": "Hardware requirements and availability", "quote_verified": false}]}, {"theme": "FP64 stagnation and mixed-precision strategy", "insights": [{"claim": "FP64 throughput has held flat across NVIDIA Hopper, Blackwell, and Rubin data center GPUs while FP32 throughput keeps rising, and workstation GPUs like the RTX PRO 6000 have a 64:1 FP32:FP64 ratio.", "speaker": "Erica Tsai", "type": "data_point", "entities": ["Hopper", "Blackwell", "Rubin", "RTX PRO 6000", "NVIDIA"], "conviction": "high", "so_what": "Signals NVIDIA's roadmap deprioritizes FP64; HPC customers must adopt mixed precision or see stagnating effective throughput.", "quote": null, "locator": "Additionally, plane-wave DFT traditionally runs in FP64", "quote_verified": false}, {"claim": "AI workloads are driving GPU hardware toward lower-precision data types, so the fraction of peak GPU throughput available to FP64-only HPC codes is stagnating.", "speaker": "Erica Tsai", "type": "causal", "entities": ["AI", "HPC"], "conviction": "high", "so_what": "Second-order effect of AI capex: traditional scientific computing must rewrite software to ride AI-optimized silicon.", "quote": null, "locator": "Additionally, plane-wave DFT traditionally runs in FP64", "quote_verified": false}, {"claim": "Mixed-precision failures can be insidious: soft failures such as energy drift, incorrect convergence, or diverging MD trajectories can appear valid on casual inspection, so precision boundaries must be measured per kernel.", "speaker": "Erica Tsai", "type": "thesis", "entities": ["mixed precision"], "conviction": "high", "so_what": "Validation tooling is a real barrier to mixed-precision adoption in scientific codes.", "quote": "Soft failures are not: energy drift, incorrect convergence, diverging MD trajectories that appear valid on casual inspection.", "locator": "Additionally, the failures can be insidious", "quote_verified": true}, {"claim": "NVIDIA proposes a precision-requirements workflow using a generic floating-point type with configurable mantissa and exponent bits, screening each kernel by lowering bits until results fail, with instrumentation possible at library (cuBLAS emulated GEMMs), language (NVIDIA CCCL type), or compiler (Verificarlo VPREC, CPU-only) levels.", "speaker": "Erica Tsai", "type": "framework", "entities": ["cuBLAS", "NVIDIA CCCL", "Verificarlo"], "conviction": "high", "so_what": "A generalizable playbook for porting other HPC codes to lower precision, expanding the market for FP32-heavy GPUs.", "quote": null, "locator": "The code instrumentation can be performed", "quote_verified": false}, {"claim": "In the mixed-precision Davidson solver, FFTs, Hamiltonian application, and orbital updates run in FP32 while the subspace eigenproblem, tall-skinny GEMMs, energies, and convergence measures stay in FP64, and a split-k algorithm breaks tall-skinny GEMMs into FP32 chunks with a final FP64 accumulation.", "speaker": "Erica Tsai", "type": "framework", "entities": ["Davidson", "GEMM"], "conviction": "high", "so_what": "Illustrates the 'FP64 island' pattern that lets FP64-weak GPUs serve scientific workloads.", "quote": null, "locator": "Following this workflow, the original analysis", "quote_verified": false}, {"claim": "On H100 and H200, where FP64 Tensor Cores match FP32 throughput, mixed precision gives only marginal end-to-end gains, whereas on the RTX PRO 6000 the FP32 Davidson solver runs 3x-7x faster for roughly 2x end-to-end acceleration.", "speaker": "Erica Tsai", "type": "data_point", "entities": ["H100", "H200", "RTX PRO 6000"], "conviction": "high", "so_what": "Mixed precision shifts the cost-optimal hardware for HPC toward cheaper inference/workstation-class GPUs.", "quote": null, "locator": "On H100 and H200, where FP64", "quote_verified": false}, {"claim": "On GaAsBi-64, FP32 gives a 2x speed-up at EDIFF = 10-5 eV and a combined FP32-then-FP64 run is 1.5x faster than pure FP64 at EDIFF = 10^-8 eV, since FP32 alone cannot converge below its noise floor.", "speaker": "Erica Tsai", "type": "data_point", "entities": ["GaAsBi-64", "VASP"], "conviction": "high", "so_what": "Hybrid precision preserves accuracy while capturing speed, reducing scientific objections to adoption.", "quote": null, "locator": "The mixed-precision Davidson implementation converges", "quote_verified": false}]}, {"theme": "Economics of OMat24-scale dataset generation", "insights": [{"claim": "Projected over an OMat24-scale workload on the same number of cloud instances, VASP + Daviator is up to 22x faster than VASP on CPU nodes and up to 7x faster than VASP on GPU without Daviator, with the ALCHEMI microservice adding a further 3-5x throughput when batching eight small systems per GPU.", "speaker": "Erica Tsai", "type": "data_point", "entities": ["Daviator", "VASP", "OMat24", "NVIDIA ALCHEMI"], "conviction": "medium", "so_what": "Projections from 13 benchmarked inputs; directionally strong case for GPU migration of DFT farms.", "quote": null, "locator": "On the same number of cloud instances", "quote_verified": false}, {"claim": "Using a geometric mean of AWS, Azure, CoreWeave and Google on-demand prices, existing VASP OpenACC GPU support on datacenter GPUs is more expensive than CPU, but Daviator cuts cost to roughly 35% of CPU on H100/H200 and B200, and about 25% of CPU on RTX PRO 6000 with FP32.", "speaker": "Erica Tsai", "type": "data_point", "entities": ["AWS", "Azure", "CoreWeave", "Google", "H100", "B200", "RTX PRO 6000"], "conviction": "medium", "so_what": "Cheapest scientific compute lands on RTX PRO 6000 rather than flagship datacenter GPUs, relevant to cloud SKU mix and pricing.", "quote": null, "locator": "To estimate the price of the data set", "quote_verified": false}, {"claim": "NVIDIA claims that for standard DFT GPUs are now the clear choice for VASP, with VASP + Daviator delivering 60-75% cost savings over CPU, or roughly $5-6M USD for an OMat24-sized dataset.", "speaker": "Erica Tsai", "type": "thesis", "entities": ["VASP", "Daviator", "OMat24"], "conviction": "high", "so_what": "Pressure on CPU-based HPC procurement at labs and research institutions; tailwind for GPU cloud demand in scientific AI.", "quote": "For standard DFT, GPUs are now the clear choice for VASP.", "locator": "What’s next for GPU-native DFT", "quote_verified": true}, {"claim": "Daviator's speedups make meta-GGA functionals like R2SCAN viable for production, potentially bringing higher-accuracy DFT within reach for battery, catalyst, and defect datasets.", "speaker": "Erica Tsai", "type": "prediction", "entities": ["R²SCAN", "LiFePO₄", "Daviator"], "conviction": "medium", "so_what": "Higher-fidelity datasets could improve AI materials models for batteries and catalysts, an energy-transition adjacency.", "quote": null, "locator": "For teams running RTX PRO 6000", "quote_verified": false}]}], "insight_total": 19, "top_entities": ["Daviator", "VASP", "NVIDIA ALCHEMI", "OMat24", "RTX PRO 6000", "H100", "B200", "Blackwell", "Rubin", "OpenACC", "MLIP", "cuBLAS"], "source_meta": {"author": "Erica Tsai", "word_count": 3279, "paywalled": false}}, {"record_id": "24e843e375a77283", "source_type": "technology", "source_name": "Apple ML Research", "source_url": "https://machinelearning.apple.com/research/split-scale-latent-3d", "title": "Split-and-Scale Latent 3D Representations", "published_date": "", "language": "en", "processed_at": "2026-11-19T11:05:38Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech"], "gist": "Apple researchers introduce split-and-scale, which applies a single pretrained 3D tokenizer to progressively smaller sub-regions of a scene at inference, boosting latent capacity and detail without costly training-time scaling. It matches much larger models that exceed single-GPU memory and supports a competitive autoregressive 3D generator. (Raw has no published_date; text says published November 2026.)", "themes": [{"theme": "Latent capacity bottleneck in 3D models", "insights": [{"claim": "Current latent 3D representations struggle to capture fine details of complex objects because they are fundamentally limited by the capacity of their latents.", "speaker": "Apple ML Research", "type": "thesis", "entities": ["latent 3D representations", "3D generative models"], "conviction": "high", "so_what": "Detail fidelity is a key gap for 3D generative AI; methods that lift it without bigger models matter for on-device and content-creation use.", "quote": "fundamentally limited by the capacity of their latents", "locator": "Latent 3D representations have significantly expanded", "quote_verified": true}, {"claim": "Scaling latent capacity at training time for 3D representations is computationally expensive and often infeasible under GPU memory limits, while naively adding more latents at inference fails to use the added capacity effectively.", "speaker": "Apple ML Research", "type": "causal", "entities": ["GPU memory", "3D tokenizer"], "conviction": "high", "so_what": "Training-time scaling of 3D models hits memory walls, favoring inference-time techniques over brute-force compute.", "quote": "naively increasing the number of latents at inference fails to make effective use of the added capacity", "locator": "Latent 3D representations have significantly expanded", "quote_verified": true}]}, {"theme": "Split-and-scale inference-time scaling", "insights": [{"claim": "Apple researchers propose split-and-scale, a method that expands latent capacity of 3D representations at inference time while keeping training cost tractable.", "speaker": "Apple ML Research", "type": "thesis", "entities": ["Apple", "split-and-scale"], "conviction": "high", "so_what": "Another instance of the inference-time-scaling trend moving from LLMs into 3D vision, shifting cost from training to inference.", "quote": "effectively expands latent capacity at inference while keeping training cost tractable", "locator": "In this paper, we address", "quote_verified": true}, {"claim": "Because 3D scenes are represented as continuous functions of 3D coordinates, a single pretrained tokenizer can be applied at inference to arbitrarily small sub-regions of a scene, giving each region the same latent capacity over a smaller spatial extent and thus far higher detail.", "speaker": "Apple ML Research", "type": "framework", "entities": ["pretrained tokenizer", "split-and-scale"], "conviction": "high", "so_what": "Reusing one pretrained tokenizer across sub-regions lets detail scale with inference compute rather than model size.", "quote": "a single pretrained tokenizer can be applied at inference to arbitrarily small sub-regions of a scene", "locator": "Our key observation is that", "quote_verified": true}]}, {"theme": "Results versus larger models", "insights": [{"claim": "Split-and-scale inference-time scaling achieves 3D reconstruction quality competitive with much larger models that exceed single-GPU memory limits, per extensive ablations on compute, memory, latent capacity and reconstruction quality trade-offs.", "speaker": "Apple ML Research", "type": "data_point", "entities": ["split-and-scale", "single-GPU"], "conviction": "medium", "so_what": "Suggests high-fidelity 3D can be obtained with smaller, memory-bounded models, relevant to cost-efficient and on-device deployment.", "quote": "achieves quality competitive with much larger models that exceed single-GPU memory limits", "locator": "We validate this insight by", "quote_verified": true}, {"claim": "Split-and-scale supports high-quality generative modeling: an autoregressive 3D generator trained on it performs competitively with state-of-the-art baselines.", "speaker": "Apple ML Research", "type": "data_point", "entities": ["autoregressive 3D generator", "split-and-scale"], "conviction": "medium", "so_what": "Indicates the technique is usable for 3D content generation, not just reconstruction; watch for adoption in Apple spatial/3D products.", "quote": "training an autoregressive 3D generator that performs competitively with state-of-the-art baselines", "locator": "We validate this insight by", "quote_verified": true}, {"claim": "The split-and-scale paper, by Dorian Chan, Muhammed Kocabas, Xiaoming Zhao, Oncel Tuzel and Jen-Hao Rick Chang, is a NeurIPS computer vision paper published November 2026, continuing Apple's line of 3D generative work.", "speaker": "Apple ML Research", "type": "anecdote", "entities": ["Apple", "NeurIPS", "Oncel Tuzel", "Jen-Hao Rick Chang"], "conviction": "high", "so_what": "Apple keeps publishing 3D generative research at top venues, signaling ongoing investment in spatial computing capabilities.", "quote": null, "locator": "research area Computer Visionconference NeurIPS", "quote_verified": false}]}], "insight_total": 7, "top_entities": ["split-and-scale", "NeurIPS", "Oncel Tuzel", "Jen-Hao Rick Chang", "Dorian Chan", "pretrained tokenizer", "autoregressive 3D generator", "latent 3D representations", "single-GPU"], "source_meta": {"author": "Apple ML Research", "word_count": 384, "paywalled": false}}, {"record_id": "25c117aa91614399", "source_type": "technology", "source_name": "Ars Technica", "source_url": "https://arstechnica.com/gaming/2026/11/civilization-studio-firaxis-  (69.1% to 56.8%) while PennyLane and Classiq gain, IBM leading cloud access, hybrid workflows now mainstream (52.9%), and Claude Code the top AI coding assistant (71.6%) among quantum developers who verify AI outputs heavily.", "themes": [{"theme": "SDK and cloud platform share shifts", "insights": [{"claim": "In the 2026 Unitary Foundation Quantum Open Source Survey, Qiskit remained the leading full-stack SDK at 56.8% active usage but fell from 69.1% in 2025, while PennyLane rose from 30.8% to 34.3%.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Qiskit", "PennyLane", "IBM", "Unitary Foundation"], "conviction": "high", "so_what": "IBM's software moat is eroding at the margin; Xanadu's PennyLane is the gaining challenger.", "quote": null, "locator": "Full-Stack SDKs & Simulators", "quote_verified": false}, {"claim": "Classiq shows strong momentum among quantum developers: Classiq Library has 21.4% SDK usage with 23.4% planning to adopt it next year, Classiq holds 22.8% of quantum cloud service usage (second to IBM) with 25.7% next-year intent, and Classiq Library ties for the top applications tool at 23.2%.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Classiq", "Classiq Library"], "conviction": "high", "so_what": "Classiq is emerging as a platform-agnostic software layer with broad mindshare; relevant to private valuation and partnership watch.", "quote": null, "locator": "Full-Stack SDKs & Simulators", "quote_verified": false}, {"claim": "IBM Quantum Platform leads quantum cloud access at 54.9% active usage and 33.4% next-year intent, ahead of Classiq (22.8%), Amazon Braket (17.9%), qBraid (17.0%) and Azure Quantum (9.6%).", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["IBM Quantum Platform", "IBM", "Amazon Braket", "qBraid", "Azure Quantum", "Classiq"], "conviction": "high", "so_what": "Hyperscaler quantum clouds (AWS, Microsoft) trail IBM materially in developer usage.", "quote": null, "locator": "Quantum Cloud Services", "quote_verified": false}, {"claim": "Classiq Library (24.9%) and NVIDIA CUDA-Q Algorithms (21.2%) recorded the highest planned adoption rates among quantum application tools for 2027.", "speaker": "Mohamed Abdel-Kareem", "type": "prediction", "entities": ["Classiq", "NVIDIA", "CUDA-Q"], "conviction": "medium", "so_what": "NVIDIA's software ecosystem is penetrating quantum application development, reinforcing its role as the classical side of hybrid quantum.", "quote": null, "locator": "Applications & Tools", "quote_verified": false}]}, {"theme": "Quantum error correction tooling", "insights": [{"claim": "35.2% of surveyed quantum practitioners use QEC tools, led by Qiskit (51.7%), PennyLane (30.0%), Stim (29.8%), NVIDIA CUDA-Q QEC (20.8%), PyMatching (15.8%) and Riverlane Deltakit (13.5%).", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Qiskit", "PennyLane", "Stim", "NVIDIA CUDA-Q QEC", "PyMatching", "Riverlane Deltakit", "Riverlane"], "conviction": "high", "so_what": "QEC tooling is a nascent but real market segment where NVIDIA and Riverlane are gaining footholds.", "quote": null, "locator": "Quantum Error Correction", "quote_verified": false}, {"claim": "Among non-users of QEC tools (n = 1,043), 22.8% cite cost and 19.0% cite missing tool implementations as barriers.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["quantum error correction"], "conviction": "high", "so_what": "Missing implementations suggest whitespace for QEC software vendors.", "quote": null, "locator": "Quantum Error Correction", "quote_verified": false}, {"claim": "Quantum error correction ranks as the second research priority (44.4%) behind algorithm development (54.3%) and ahead of application development (42.6%).", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["quantum error correction"], "conviction": "high", "so_what": "Practitioner focus is shifting toward fault tolerance, aligning with vendor logical-qubit roadmaps.", "quote": null, "locator": "AI Verification & Research Priorities", "quote_verified": false}]}, {"theme": "AI coding assistants in quantum development", "insights": [{"claim": "Among quantum developers using AI coding assistants, Anthropic Claude Code leads at 71.6% usage, followed by OpenAI Codex (41.8%), Google Gemini (39.4%), Microsoft Copilot (16.6%) and Cursor (11.3%).", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Anthropic", "Claude Code", "OpenAI Codex", "Google Gemini", "Microsoft Copilot", "Cursor"], "conviction": "high", "so_what": "A niche but technically demanding developer cohort strongly prefers Anthropic's coding agent, a datapoint on AI coding tool competition.", "quote": null, "locator": "AI Coding Assistants", "quote_verified": false}, {"claim": "77.8% of surveyed quantum practitioners use AI tools for quantum workflows, mainly for debugging/optimization (77.0%) and learning SDKs (76.4%).", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["AI coding assistants"], "conviction": "high", "so_what": "AI assistants are lowering the onboarding cost for quantum SDKs, which may accelerate developer base growth.", "quote": null, "locator": "AI Coding Assistants", "quote_verified": false}, {"claim": "Quantum practitioners rate AI productivity gains at 3.1 out of 4.0 but have lower confidence in AI code accuracy (2.5) and conceptual explanations (2.6), so 42.9% always and 38.7% mostly verify AI outputs, chiefly via manual review (78.3%) and automated tests (54.2%) rather than formal verification (17.5%).", "speaker": "Mohamed Abdel-Kareem", "type": "causal", "entities": ["AI coding assistants"], "conviction": "high", "so_what": "Trust gap in AI-generated quantum code creates demand for verification and testing tooling.", "quote": null, "locator": "AI Verification & Research Priorities", "quote_verified": false}]}, {"theme": "Hybrid HPC workflows and bottlenecks", "insights": [{"claim": "52.9% of surveyed quantum practitioners ran hybrid quantum-classical workflows in the past year, using CPU simulators (80.2%), GPU-accelerated simulators (56.4%), QPU execution with classical pre/post-processing (46.8%), iterative loops (36.7%) and real-time feedback pipelines (21.3%).", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["hybrid quantum-classical", "GPU"], "conviction": "high", "so_what": "Hybrid is now the majority workflow, supporting GPU and HPC vendors' quantum strategies.", "quote": null, "locator": "Hybrid Quantum-Classical & HPC Execution", "quote_verified": false}, {"claim": "Among the 36.8% of quantum practitioners using HPC tools, NVIDIA CUDA (24.1%) and Slurm (17.0%) are most common, while top scaling bottlenecks are limited QPU access (54.4%), compute cost (41.8%), constrained GPU/HPC availability (37.0%) and quantum-classical integration friction (25.4%).", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["NVIDIA CUDA", "NVIDIA", "Slurm"], "conviction": "high", "so_what": "QPU access scarcity is the top constraint, implying latent demand for on-prem and cloud QPU capacity.", "quote": null, "locator": "Hybrid Quantum-Classical & HPC Execution", "quote_verified": false}]}, {"theme": "Developer workforce and languages", "insights": [{"claim": "Quantum survey respondents are mostly researchers (49.4%) and software developers (34.2%); 46.6% work in quantum as a primary paid job and 56.2% have two or fewer years of professional quantum experience.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["quantum workforce"], "conviction": "high", "so_what": "A young, fast-growing workforce; talent depth remains thin.", "quote": null, "locator": "Workforce Composition & Languages", "quote_verified": false}, {"claim": "Participation in the 2026 quantum open source survey was led by the United States (17.7%), India (15.7%), Israel (15.5%), Canada (7.7%), the United Kingdom ( tial feature-store attempts, and a ranking service at 100K rps. Booking.com is now building agentic-AI foundations (memory, agent serving, access control) and unifying its ML platforms under a single orchestration layer.", "themes": [{"theme": "Experimentation as operating culture", "insights": [{"claim": "Booking.com subjects every visitor to 1,000+ concurrent experiments and has run more than 150,000 experiments, with a success rate below 25%.", "speaker": "Jabez Eliezer Manuel", "type": "data_point", "entities": ["Booking.com", "A/B testing"], "conviction": "high", "so_what": "A sub-25% hit rate at massive scale shows experimentation velocity, not idea quality, is the moat in consumer internet optimization.", "quote": "most of our experiments fail, our success rate is just less than 25%. The goal isn't to get it right, but it is to learn fast.", "locator": "The World in 2005", "quote_verified": true}, {"claim": "Booking.com credits universal experimentation with eliminating HIPPO-driven (highest-paid person's opinion) decisions and creating a culture of humility where debates are settled by tests.", "speaker": "Jabez Eliezer Manuel", "type": "framework", "entities": ["Booking.com"], "conviction": "high", "so_what": "Organizational decision culture is a durable competitive advantage that is hard for rivals to copy.", "quote": null, "locator": "It's my way of hinting to", "quote_verified": false}, {"claim": "Booking.com uses interleaving (team-draft merging of results from multiple ranking models shown to all users) to pre-select ranking models, achieving roughly a 10x speed-up in variant testing versus A/B tests, then confirms the winner with a proper A/B test.", "speaker": "Jabez Eliezer Manuel", "type": "framework", "entities": ["Booking.com", "interleaving", "A/B testing"], "conviction": "high", "so_what": "Interleaving lets search/ranking teams iterate models far faster with less traffic, a tactic relevant to any marketplace ranking business.", "quote": "we can run more variants that was like 10 times speed-up than what we are used to with A/B testing", "locator": "Those results were coming from merged", "quote_verified": true}]}, {"theme": "MySQL at scale on commodity hardware", "insights": [{"claim": "Booking.com grew from a single MySQL master with four replicas in 2005 to roughly 7,000 MySQL instances, managed via single-writer topologies, intermediate masters to limit cross-datacenter replication, and the Orchestrator replication tool.", "speaker": "Jabez Eliezer Manuel", "type": "data_point", "entities": ["Booking.com", "MySQL", "Orchestrator"], "conviction": "high", "so_what": "Shows open-source relational databases can scale to hyperscale fleets with automation instead of paid proprietary databases.", "quote": null, "locator": "Experiments needed data, and that's where", "quote_verified": false}, {"claim": "Booking.com keeps MySQL databases small (2TB soft limit, 10TB hard limit) so they fit on local fast storage of commodity server blades, achieving point queries under 350 microseconds and effectively using MySQL as a cache with no separate cache layer.", "speaker": "Jabez Eliezer Manuel", "type": "causal", "entities": ["Booking.com", "MySQL"], "conviction": "high", "so_what": "Small-shard design lowers cost (avoiding iSCSI storage), speeds backups and failovers, and reduces need for caching vendors.", "quote": "We were effectively using MySQL as a cache.", "locator": "There are a few things that", "quote_verified": true}, {"claim": "Booking.com rebuilds its MySQL fleet every 60 days, which means an automated provisioning action occurs roughly every three minutes.", "speaker": "Jabez Eliezer Manuel", "type": "data_point", "entities": ["Booking.com", "MySQL"], "conviction": "high", "so_what": "Fleet-wide automation is a prerequisite for operating databases at this scale; signals demand for database automation tooling.", "quote": null, "locator": "On the left, orange is the", "quote_verified": false}, {"claim": "Booking.com chose to contribute upstream to MySQL rather than fork it, and says GTID-based replication exists because Booking.com proposed it.", "speaker": "Jabez Eliezer Manuel", "type": "anecdote", "entities": ["Booking.com", "MySQL", "GTID"], "conviction": "high", "so_what": "Large users shaping open-source roadmaps reduces their maintenance burden versus carrying private forks.", "quote": null, "locator": "It also provided several side benefits.", "quote_verified": false}]}, {"theme": "Hadoop exit and cloud migration", "insights": [{"claim": "Booking.com identified Hadoop's limitations in 2018 but only put it into maintenance mode in 2022 and sunset it about three years later, due to hundreds of petabytes of data, about 190,000 Hadoop tables, 7,000+ workflows and hundreds of teams.", "speaker": "Jabez Eliezer Manuel", "type": "data_point", "entities": ["Booking.com", "Hadoop"], "conviction": "high", "so_what": "Legacy on-prem big-data estates take many years to unwind, a long tail that sustains cloud migration services demand.", "quote": null, "locator": "2011, we introduced Hadoop. 2018, we", "quote_verified": false}, {"claim": "Booking.com's on-prem Hadoop suffered from shared mono-version environments, no GPU support, cross-datacenter sync headaches, near-max capacity at peaks, noisy neighbors, and above all no data discovery or ownership.", "speaker": "Jabez Eliezer Manuel", "type": "causal", "entities": ["Booking.com", "Hadoop", "GPU"], "conviction": "high", "so_what": "Lack of GPU support in legacy data platforms is a driver pushing enterprises to cloud for ML.", "quote": null, "locator": "That worked for us in most", "quote_verified": false}, {"claim": "A 2018 attempt to move Booking.com to a cloud provider was shelved (attributed to either cost or a strategy shift), and a later pilot of another cloud did not achieve full migration until leadership mandated an all-in move with no plan B in 2023, after which everything migrated within 1.5 years.", "speaker": "Jabez Eliezer Manuel", "type": "causal", "entities": ["Booking.com"], "conviction": "high", "so_what": "Executive commitment, not technology, was the binding constraint on cloud migration; watch for top-down mandates as a migration catalyst.", "quote": "In 2023, leadership actually made the call, and they said, guys, we're going to do it all in, no plan B.", "locator": "We were trying to fix that", "quote_verified": true}, {"claim": "When Booking.com mapped all tables and workflows into a dependency graph and checked usage, 92% of workflows failed a 'someone cares' test and were deleted rather than migrated.", "speaker": "Jabez Eliezer Manuel", "type": "data_point", "entities": ["Booking.com"], "conviction": "high", "so_what": "Most legacy data pipelines are dead weight; migration cost estimates based on full inventories overstate real work.", "quote": "The best architectural tool is Delete key.", "locator": "Then we tried to trim it", "quote_verified": true}, {"claim": "Booking.com's migration playbook was: map every table and dependency into a graph, trim by usage and lineage, prioritize survivors by graph centrality and impact, migrate in batches, and run a unified command center replacing spreadsheets and tribal knowledge.", "speaker": "Jabez Eliezer Manuel", "type": "framework", "entities": ["Booking.com"], "conviction": "high", "so_what": "A reusable template for large data migrations; supports demand for lineage and data catalog tooling.", "quote": null, "locator": "If you look back, one key", "quote_verified": false}, {"claim": "Booking.com's retrospective advice is to catalog every asset, establish business and technical ownership, build quality gates before sharing data, and track lineage end-to-end.", "speaker": "Jabez Eliezer Manuel", "type": "thesis", "entities": ["Booking.com", "data catalog"], "conviction": "high", "so_what": "Data governance and lineage are positioned as preventive must-haves, a tailwind for data governance vendors.", "quote": null, "locator": "If you look back, one key", "quote_verified": false}]}, {"theme": "Model serving at 400B predictions per day", "insights": [{"claim": "Before 2015, Booking.com faked real-time ML predictions by precomputing predictions over all combinations of input features (e.g., device and country) and storing the results as MySQL lookup tables.", "speaker": "Jabez Eliezer Manuel", "type": "anecdote", "entities": ["Booking.com", "MySQL"], "conviction": "high", "so_what": "Illustrates how early ML was constrained by serving infrastructure, the gap later filled by model-serving platforms.", "quote": null, "locator": "This is how we faked it.", "quote_verified": false}, {"claim": "A 2015 hackathon Scala model-serving service at Booking.com evolved into a platform supporting 12+ model formats across shared, dedicated and batch clusters behind a custom proxy, able to call externally hosted models such as SageMaker.", "speaker": "Jabez Eliezer Manuel", "type": "data_point", "entities": ["Booking.com", "Scala", "SageMaker"], "conviction": "high", "so_what": "Large platforms build in-house serving but still integrate hyperscaler ML services like SageMaker, a hybrid pattern.", "quote": null, "locator": "Over a period of time, this", "quote_verified": false}, {"claim": "Two years before the talk, Booking.com's model-serving platform hosted 480+ models and served 400 billion predictions per day at under 20 milliseconds average latency.", "speaker": "Jabez Eliezer Manuel", "type": "data_point", "entities": ["Booking.com"], "conviction": "high", "so_what": "Benchmark for classical ML inference scale at a top online travel agency, separate from LLM inference demand.", "quote": "It has 480-plus models. It can do 400 billion predictions per day. All of those predictions within less than 20 milliseconds on an average.", "locator": "Machine learning scientists upload the model", "quote_verified": true}]}, {"theme": "Feature store remains unsolved", "insights": [{"claim": "In 2015 about 80% of Booking.com data scientists' time was spent on data preparation, with feature duplication across teams and training/inference skew as the main pain points.", "speaker": "Jabez Eliezer Manuel", "type": "data_point", "entities": ["Booking.com", "feature engineering"], "conviction": "high", "so_what": "Data preparation burden justifies spending on feature stores and data tooling.", "quote": null, "locator": "Second problem that we started solving", "quote_verified": false}, {"claim": "Booking.com's second feature-platform attempt used shared user 'timelines' in HDFS and Cassandra with on-the-fly feature computation, but it failed because scientists were unfamiliar with writing features in Java and fetching Cassandra timelines took more than 90 milliseconds.", "speaker": "Jabez Eliezer Manuel", "type": "causal", "entities": ["Booking.com", "Cassandra", "HDFS", "Spark"], "conviction": "high", "so_what": "On-the-fly feature computation is too slow for latency-sensitive serving; precomputed lookups win.", "quote": null, "locator": "We had a wrapper, which had", "quote_verified": false}, {"claim": "After three attempts, Booking.com settled on a feature store focused only on storage and serving (ingesting precomputed data-lake and real-time Kafka features into an online store with simple lookups), and still runs three systems for precomputed and real-time features with no unified answer.", "speaker": "Jabez Eliezer Manuel", "type": "contrarian", "entities": ["Booking.com", "Kafka", "feature store"], "conviction": "high", "so_what": "Even sophisticated ML shops have not solved feature engineering; the feature-store category remains fragmented and open.", "quote": "It's a multidimensional problem, and we don't have an answer.", "locator": "If it was pre-computed, ok, we'll", "quote_verified": true}]}, {"theme": "Ranking and personalization engineering", "insights": [{"claim": "Booking.com's attempt around 2016 to replace its handcrafted hotel ranking formula with machine learning failed for about 1.5 years, largely because Spark ran out of memory on the data volume, until approximations allowed an ML model to win an experiment.", "speaker": "Jabez Eliezer Manuel", "type": "anecdote", "entities": ["Booking.com", "Spark"], "conviction": "high", "so_what": "Handcrafted heuristics can be hard to beat; ML replacement timelines in production are often longer than expected.", "quote": "The handcrafted formula was undefeatable.", "locator": "Availability of the hotel. The average", "quote_verified": true}, {"claim": "Personalizing Booking.com's ranking required moving scoring out of a 24-shard scatter-gather availability engine into a separate service, multiplying request volume 24x behind the fanout under tight latency budgets.", "speaker": "Jabez Eliezer Manuel", "type": "causal", "entities": ["Booking.com"], "conviction": "high", "so_what": "Personalization imposes large infrastructure multipliers, raising compute costs for marketplaces.", "quote": null, "locator": "That's what we wanted to do.", "quote_verified": false}, {"claim": "As of 2024, Booking.com's ranking service handled 100,000 requests per second with p99.9 latency of 100 milliseconds and averages of 40-50 milliseconds.", "speaker": "Jabez Eliezer Manuel", "type": "data_point", "entities": ["Booking.com"], "conviction": "high", "so_what": "Shows the scale of real-time personalized ranking in online travel.", "quote": null, "locator": "That's what we wanted to do.", "quote_verified": false}, {"claim": "Booking.com frames ranking as a three-way optimization between traveler choice and value, partner exposure and growth, and business efficiency and revenue.", "speaker": "Jabez Eliezer Manuel", "type": "framework", "entities": ["Booking.com"], "conviction": "high", "so_what": "Marketplace ranking trade-offs directly affect take rates and partner relations.", "quote": null, "locator": "Let's jump into ranking platform. Ranking", "quote_verified": false}]}, {"theme": "GenAI and agentic platform roadmap", "insights": [{"claim": "Booking.com runs five ML platforms (GenAI, content intelligence, ranking, recommendations with 40-50 use cases, and value intelligence for promotions), with the GenAI platform providing guardrails, evaluation, orchestration and PII masking for trip planning, smart filters, review summaries, property Q&A and booking support.", "speaker": "Jabez Eliezer Manuel", "type": "data_point", "entities": ["Booking.com", "GenAI"], "conviction": "high", "so_what": "Online travel agencies are deploying GenAI across the funnel including customer support, which may reduce support costs.", "quote": null, "locator": "Now in that third layer, we", "quote_verified": false}, {"claim": "Since 2025, Booking.com has been building agentic-system foundations including episodic, semantic and procedural memory, agent serving, agent access and delegation controls, and agent-to-agent communication.", "speaker": "Jabez Eliezer Manuel", "type": "prediction", "entities": ["Booking.com", "agentic AI"], "conviction": "medium", "so_what": "Large consumer platforms are investing in agent infrastructure, signaling agentic commerce in travel is a strategic priority.", "quote": null, "locator": "What's Brewing?", "quote_verified": false}, {"claim": "Booking.com is unifying its ML platforms under a single orchestration layer to pre-empt fragmentation, enable cross-domain customer experiences, and centralize AI governance, security and quality.", "speaker": "Jabez Eliezer Manuel", "type": "thesis", "entities": ["Booking.com"], "conviction": "medium", "so_what": "Platform consolidation for agentic AI suggests demand for centralized AI governance tooling.", "quote": "we foresee a possible fragmentation and we wanted to avoid it earlier", "locator": "What's Brewing?", "quote_verified": true}]}], "insight_total": 26, "top_entities": ["Booking.com", "MySQL", "Hadoop", "Orchestrator", "Spark", "Cassandra", "Kafka", "SageMaker", "Scala", "H2O", "GenAI", "Price ociety"], "gist": "As Voyager 1 reached one light-day from Earth on November 18, historian Glen Swanson shared rediscovered details of the Golden Record: blueprints confirm operating instructions were repeated inside the protective cover, and NASA ordered 10 extra copies whose locations he verified. The findings come from a book with design director Jon Lomberg due from the University of Chicago Press in August 2027.", "themes": [{"theme": "Voyager milestones", "insights": [{"claim": "Voyager 1, launched in 1977 and in interstellar space since 2012, reached one light-day from Earth on November 18 and is still communicating with Earth.", "speaker": "Robert Pearlman", "type": "data_point", "entities": ["Voyager 1"], "conviction": "high", "so_what": "Long-lived NASA mission milestone ahead of the 50th launch anniversaries.", "quote": null, "locator": "Meanwhile, the Voyagers continue to travel", "quote_verified": false}, {"claim": "Voyager 2 is about 16 billion miles (25.9 billion kilometers) from Earth.", "speaker": "Robert Pearlman", "type": "data_point", "entities": ["Voyager 2"], "conviction": "high", "so_what": "Context for the scale of deep-space communication.", "quote": null, "locator": "Within the immense scale of the", "quote_verified": false}]}, {"theme": "Golden Record hardware rediscoveries", "insights": [{"claim": "Glen Swanson found in original blueprints that the Golden Record's designers repeated the playing instructions on the inside of its protective cover, because the outer inscriptions would eventually erode from dust.", "speaker": "Robert Pearlman", "type": "data_point", "entities": ["Glen Swanson", "Voyager Golden Record"], "conviction": "high", "so_what": "Illustrates redundancy-by-design thinking for long-duration engineering.", "quote": "“Even small amounts of dust are eventually going to wear down the inscriptions to the point perhaps where they are not going to be readable.”", "locator": null, "quote_verified": true}, {"claim": "Swanson's re ils for historic space artifacts.", "quote": null, "locator": "In the process of his research,", "quote_verified": false}, {"claim": "Due to rights issues and material challenges, no complete Golden Record versions have ever been offered for sale, and Elon Musk's 2024 claim 'I have one' is believed to refer to a replica.", "speaker": "Robert Pearlman", "type": "data_point", "entities": ["Elon Musk", "Voyager Golden Record"], "conviction": "medium", "so_what": "No legitimate market for original records exists.", "quote": null, "locator": "Due to rights issues and material", "quote_verified": false}]}], "insight_total": 8, "top_entities": ["Voyager 1", "Voyager 2", "Golden Record", "Glen Swanson", "Jon Lomberg", "NASA", "Jet Propulsion Laboratory", "University of Chicago Press", "Elon Musk"], "source_meta": {"author": "Robert Pearlman", "word_count": 1534, "paywalled": false}}, {"record_id": "4e14e2514caa45cc", "source_type": "technology", "source_name": "Benchmark Minerals", "source_url": "https://source.benchmarkminerals.com/article/data-centre-build-out-keeps-us-copper-orders-flowing-as-tariff-call-hangs-in-the-balance", "title": "Data centres sustain US copper demand amid tariff decision wait", "published_date": "2026-11-17", "language": "en", "processed_at": "2026-11-19T11:05:43Z", "processor": "claude-code-sub-opus", "tags": ["Energy", "AI", "Tech"], "gist": "Delegates at the American Copper Council Fall Meeting (Miami, 10–13 Nov) reported that the US data centre build-out is keeping copper demand hot, with wire, cable and tube makers citing record orders, even as the market awaits Washington's refined copper tariff decision. Because copper is only 0.5–1% of data centre capex, developers are price-insensitive and over-order to secure supply.", "themes": [{"theme": "Data centre-driven copper demand", "insights": [{"claim": "US wire and cable producers and tube manufacturers reported record orders at the American Copper Council Fall Meeting in November 2026, driven by the US data centre build-out.", "speaker": "Michael Finch, Benjamin Roche", "type": "data_point", "entities": ["American Copper Council", "wire and cable producers", "tube manufacturers", "data centres", "copper"], "conviction": "high", "so_what": "Semi-fabricator order books are a leading read on US copper demand; record orders point to sustained physical tightness tied to AI/data centre capex.", "quote": null, "locator": "Wire and cable producers and tube", "quote_verified": false}, {"claim": "Copper accounts for only about 0.5–1% of data centre capex, so developers are insensitive to elevated copper prices and order freely to secure enough material.", "speaker": "Michael Finch, Benjamin Roche", "type": "causal", "entities": ["copper", "data centres"], "conviction": "high", "so_what": "Price-inelastic demand from data centres means high copper prices may not destroy demand in this segment; watch data centre capex as a copper demand driver.", "quote": "Copper makes up only 0.5–1% of data centre capex", "locator": "Wire and cable producers and tube", "quote_verified": true}, {"claim": "Data centre developers prioritise on-time delivery over material efficiency, accepting leftover copper cable on reels after construction, which inflates effective copper consumption.", "speaker": "one US wire and cable producer (via Benchmark)", "type": "anecdote", "entities": ["data centres", "wire and cable producers"], "conviction": "medium", "so_what": "Over-ordering and wastage add a buffer layer of demand that could reverse if build-out slows, creating destocking risk.", "quote": "“They just don’t care how much is left on reels after construction has finished, what they care about is delivering on time,”", "locator": "“They just don’t care how much", "quote_verified": true}]}, {"theme": "Tariff uncertainty", "insights": [{"claim": "The US copper market is awaiting a Washington decision on refined copper tariffs, yet data centre demand has kept US copper demand running hot despite that uncertainty.", "speaker": "Michael Finch, Benjamin Roche", "type": "thesis", "entities": ["refined copper", "tariffs", "Washington"], "conviction": "medium", "so_what": "A tariff decision on refined copper is a key pending catalyst for US premiums and import flows.", "quote": null, "locator": "The race to build data centres", "quote_verified": false}]}], "insight_total": 4, "top_entities": ["copper", "data centres", "American Copper Council", "refined copper", "tariffs", "wire and cable", "tube manufacturers", "Washington"], "source_meta": {"author": "Michael Finch, Benjamin Roche", "word_count": 141, "paywalled": false}}, {"record_id": "5257196f9cf31e98", "source_type": "technology", "source_name": "Semiconductor Engineering", "source_url": "https://semiengineering.com/can-ai-agents-really-shift-chip-design-left/", "title": "Can AI Agents Really Shift Chip Design Left?", "published_date": "2026-11-18", "language": "en", "processed_at": "2026-11-19T11:06:11Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "Roundtable (Synopsys, Hiveware, Silvaco, Axiomise) on agentic AI in chip design: agents are proliferating per tool/flow step into a hierarchical 'onion of agents', but no one yet knows how to orchestrate them coherently, token costs may favor big companies, and the decisive bottleneck is siloed proprietary design data and decades of uncodified engineering expertise.", "themes": [{"theme": "Agent orchestration as the next EDA methodology", "insights": [{"claim": "Axiomise CEO Ashish Darbari argues that combining AI agents across the chip flow will become a new industry methodology direction comparable to UVM, but that nobody today really knows how that combination will work.", "speaker": "Ed Sperling", "type": "prediction", "entities": ["Axiomise", "Ashish Darbari", "UVM", "agentic AI"], "conviction": "medium", "so_what": "Watch for a standard/methodology for multi-agent EDA flows; whoever defines it (vendor or consortium) gains lock-in.", "quote": "I don’t get a sense that anybody really knows today how this combination is going to work.", "locator": "SE: If AI agents are modifying code", "quote_verified": true}, {"claim": "Synopsys' Frank Schirrmeister describes agentic chip design as an 'onion of agents': each sub-flow (virtual prototyping, formal, simulation, emulation, prototyping) gets its own localized agent, then orchestrating agents sit on top and connect to the front end.", "speaker": "Ed Sperling", "type": "framework", "entities": ["Synopsys", "Frank Schirrmeister", "formal", "simulation", "emulation", "virtual prototyping"], "conviction": "high", "so_what": "Value accrues to whoever owns the orchestration layer on top of point-tool agents, favoring broad-portfolio EDA vendors.", "quote": "This is an onion of agents, with more and more layers on top.", "locator": "Schirrmeister: You have lifecycle, manufacturing", "quote_verified": true}, {"claim": "According to Schirrmeister, EDA vendors all claim 'Level 5' agentic autonomy, which is true only within the scope of each tool's narrow operating domain rather than end-to-end.", "speaker": "Ed Sperling", "type": "contrarian", "entities": ["EDA vendors", "Synopsys"], "conviction": "medium", "so_what": "Discount vendor 'Level 5' autonomy marketing; ask about cross-domain orchestration, not single-tool autonomy.", "quote": "EDA vendors are all saying we have Level 5 stuff, and there’s truth to that within the scope of the operating domain.", "locator": "Schirrmeister: You have lifecycle, manufacturing", "quote_verified": true}, {"claim": "Silvaco's Jack Berg says the industry will build and iteratively improve agents at each level with a Level 5 agent orchestrating the whole, which he sees as the only way for agents to replace large groups of engineers doing grunt work.", "speaker": "Ed Sperling", "type": "prediction", "entities": ["Silvaco", "Jack Berg"], "conviction": "high", "so_what": "Signals an expected labor-substitution story for
