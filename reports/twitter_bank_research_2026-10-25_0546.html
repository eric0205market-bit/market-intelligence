<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DATA POINT TAGS */
.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>

<script>
const REPORT_DATA = {"report_type": "TWITTER BANK RESEARCH", "freshness_gate": "FRESHNESS GATE PASSED.", "collected_at": "2026-10-24T19:40:45Z", "window_days": 4, "input_stats": {"total_tweets": 120, "considered": 120, "kept": 33, "dropped": 87, "deduped": 0}, "summary": "Goldman dominates the window (17 items): household equity ownership, retail trading and hedge fund de-risking charts.\nJPMAM long-term return assumptions (7 items) cover equities, IG credit, Treasurys, nominal GDP and AI job displacement.\nBofA Hartnett (4): tactical risk-off until mid-Nov, AI hyperscaler credit spreads; Nomura and Morgan Stanley add one item each.\nRecurring theme: hedge fund de-risking and risk appetite this week, alongside AI-investment and valuation charts.\nCounts: Goldman 17, JPM 7, BofA 4, Yardeni 2, Apollo/Slok 1, Morgan Stanley 1, Nomura 1, UBS 1.", "by_bank_counts": {"Goldman": 17, "JPM": 7, "BofA": 4, "Yardeni": 2, "Apollo/Slok": 1, "Morgan Stanley": 1, "Nomura": 1, "UBS": 1}, "banks": [{"bank": "Goldman", "theme": "Household equity ownership, retail activity and hedge fund de-risking; US business surveys", "items": [{"author": "MikeZaccardi", "text": "GS: P/E ratios have risen alongside household equity allocations\n\nRebalancing is not an American virtue https://t.co/8guvkIAn83", "tweet_url": "https://x.com/MikeZaccardi/status/2113999705772318724", "images": ["https://pbs.twimg.com/media/HVZvh6NWoAA04P4.png"], "created_at": "2026-10-24T14:23:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "The country needs more financial advisors... Wealth management assets over time.... GS https://t.co/sfAx7TVyMi", "tweet_url": "https://x.com/MikeZaccardi/status/2113997943954981108", "images": ["https://pbs.twimg.com/media/HVZt7Y5XQAA2u4o.png"], "created_at": "2026-10-24T14:16:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Consumers are angry, but they apparently love stocks... record-high equity allocation among households GS https://t.co/epbrDLHqCz", "tweet_url": "https://x.com/MikeZaccardi/status/2113992155635069286", "images": ["https://pbs.twimg.com/media/HVZoqdQXsAAq6ZI.png"], "created_at": "2026-10-24T13:53:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Corporations are not buying much stock anymore, but households are GS https://t.co/4XIdbN1f9H", "tweet_url": "https://x.com/MikeZaccardi/status/2113990394014790031", "images": ["https://pbs.twimg.com/media/HVZnD6iWUAAcDQx.jpg"], "created_at": "2026-10-24T13:46:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: While retail trading activity has slowed this year, total household demand for US equities has remained strong. \n\nFederal Reserve data show that households bought $840 billion of US equities in H1 2026. https://t.co/Qy7OTcLGBE", "tweet_url": "https://x.com/MikeZaccardi/status/2113984605959111007", "images": ["https://pbs.twimg.com/media/HVZhzADX0AA1YzU.jpg"], "created_at": "2026-10-24T13:23:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Households are the largest owners of US equities... and an increasing share https://t.co/BteBSKIBPP", "tweet_url": "https://x.com/MikeZaccardi/status/2113980831131681248", "images": ["https://pbs.twimg.com/media/HVZeXRQXIAAhZ_x.jpg"], "created_at": "2026-10-24T13:08:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Only $12 trillion of the $65 trillion of household equity ownership is higher-risk self-directed https://t.co/6BP85PFAUs", "tweet_url": "https://x.com/MikeZaccardi/status/2113977056283316656", "images": ["https://pbs.twimg.com/media/HVZa7jOW0AAO9QP.jpg"], "created_at": "2026-10-24T12:53:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Speculative trading is in check... well below year-ago levels and the Jan 2000 &amp; Feb 2021 generational climaxes https://t.co/41yY6cqGhe", "tweet_url": "https://x.com/MikeZaccardi/status/2113973281569021953", "images": ["https://pbs.twimg.com/media/HVZXf1EW8AAeBh8.jpg"], "created_at": "2026-10-24T12:38:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: The GS Risk Appetite Indicator saw one of its largest drops on record, now at its lowest level since April of last year.\n\nChoppy week overall as we saw a true episode of capitulation and de-grossing on Thursday due to AI financing worries and geopolitical escalation. This led to a notable lack of participation during Friday’s session … -21% vs 5d avg and -33% vs 100d avg – a demonstration of investor fatigue and defensive posturing.", "tweet_url": "https://x.com/neilsethinew/status/2113971270307992029", "images": ["https://pbs.twimg.com/media/HVXDhOfXMAA4oy9.jpg"], "created_at": "2026-10-24T12:30:01.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Weak consumer sentiment and rising energy prices likely explain most of this year’s decline in retail trading activity.\n\nInteresting connection &amp; conclusion https://t.co/CX2Uc8CiiQ", "tweet_url": "https://x.com/MikeZaccardi/status/2113969506271850855", "images": ["https://pbs.twimg.com/media/HVZUEGCW0AAlqkv.png"], "created_at": "2026-10-24T12:23:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Retail trading volume is down YoY, but leveraged ETF slinging and prediction market betting rates are up big\n\nETFs include $TQQQ, $SOXL, $QLD, $SSO, $SPXL, $TECL, $UPRO, $MUU, $TSLL, and $NVDL https://t.co/ulw3yRJnXe", "tweet_url": "https://x.com/MikeZaccardi/status/2113965731100438673", "images": ["https://pbs.twimg.com/media/HVZQoXSWcAA4LEo.png"], "created_at": "2026-10-24T12:08:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Things just got more extreme this week with Goldman seeing hedge fund gross leverage increasing to the 64th 1-year percentile while net leverage fell further (can't get any lower than the 0 five-year percentile though) meaning an even higher net short position.\n\nUnsurprisingly then the long/short ratio remained at the 0 percentile over the 1, 3, and 5-year lookbacks.  Just liberation day has been lower.", "tweet_url": "https://x.com/neilsethinew/status/2113963724650258796", "images": ["https://pbs.twimg.com/media/HVXC4EGXIAAsTJg.png"], "created_at": "2026-10-24T12:00:02.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Retail trading volume is down sharply from a year ago https://t.co/7UoQGHlOuQ", "tweet_url": "https://x.com/MikeZaccardi/status/2113961957703164093", "images": ["https://pbs.twimg.com/media/HVZNMsEWQAANkay.png"], "created_at": "2026-10-24T11:53:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Sharp HF derisking drove this week's equity rotations. \n\nOur HF VIP L/S basket fell 4% on Thursday—a drop rivaled only twice in 10 years: DeepSeek Monday (Jan '25) and the COVID crash (Mar '20). https://t.co/WmzGeUBbSL", "tweet_url": "https://x.com/MikeZaccardi/status/2113957869502554348", "images": ["https://pbs.twimg.com/media/HVZJevjXkAA2otp.png"], "created_at": "2026-10-24T11:36:46.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: Rotations in the equity market this week reflected a sharp hedge fund derisking. \n\nOn Thursday our Hedge Fund VIP long/short basket pair fell by 4%, a decline only rivaled during the past decade on DeepSeek Monday in January 2025 and during the COVID sell-off in March 2020. \n\nLikewise, GS Prime Services data show a large decline in gross leverage that has contributed to an unusually challenging environment for hedge fund returns. Following the unwind of the last two weeks, they estimate that fundamental hedge fund net leverage registers close to 5-year lows while gross leverage remains well above historical averages.", "tweet_url": "https://x.com/neilsethinew/status/2113948631019516411", "images": ["https://pbs.twimg.com/media/HVW7WRbXIAAtjhj.png"], "created_at": "2026-10-24T11:00:03.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Early US Business Surveys Showed Mixed Signals for Manufacturing and Mixed-to-Negative Signals for Services Activity in October https://t.co/SbAAHfaIWr", "tweet_url": "https://x.com/MikeZaccardi/status/2113700986761957463", "images": ["https://pbs.twimg.com/media/HVVf2NNXIAIB76R.png"], "created_at": "2026-10-23T18:36:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Manufacturing output prices in the US rose by 7.1pt to 66.1 in October, reaching a post-pandemic high. https://t.co/g9Qsy6kpyw", "tweet_url": "https://x.com/MikeZaccardi/status/2113698495274057876", "images": ["https://pbs.twimg.com/media/HVVdlLhXoAAmglP.png"], "created_at": "2026-10-23T18:26:06.000Z", "relayers": []}]}, {"bank": "JPM", "theme": "JPMAM long-term capital market assumptions — returns, risks, AI displacement", "items": [{"author": "MikeZaccardi", "text": "JPMAM sees global stocks (pick your poison) returning 7-8% on average annually over the next 10-15 years https://t.co/Gv7j6yC34Z", "tweet_url": "https://x.com/MikeZaccardi/status/2114016818129997863", "images": ["https://pbs.twimg.com/media/HVZ_F_-WkAA8o0G.png"], "created_at": "2026-10-24T15:31:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "JPMAM sees 6%-plus returns in US IG credit (including a 0.3% default haircut) https://t.co/oHuY4CtrPv", "tweet_url": "https://x.com/MikeZaccardi/status/2114013043046719805", "images": ["https://pbs.twimg.com/media/HVZ7qRKWQAAD29t.png"], "created_at": "2026-10-24T15:16:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "JPMAM sees US Treasurys as quite cheap in an expensive world https://t.co/yhitZN6xLV", "tweet_url": "https://x.com/MikeZaccardi/status/2114011030267253058", "images": ["https://pbs.twimg.com/media/HVZ51GQWsAAG4Va.png"], "created_at": "2026-10-24T15:08:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "JPMAM: Business &amp; Finance jobs have extremely high AI-displacement risk https://t.co/gXk5sa6EH3", "tweet_url": "https://x.com/MikeZaccardi/status/2114007255183921165", "images": ["https://pbs.twimg.com/media/HVZ2ZXLW4AANYr7 // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
