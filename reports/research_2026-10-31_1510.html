<script>
const ITEMS = [{"id": 1, "cat": "positioning", "urgency": "deep", "source": "Redeye Macro Note / MacroEdge", "title": "Intel's record one-day loss is what a 'plateau' looks like at the end", "idea": "Author calls the current regime 'surfing the plateau': distributive ranges typically last 3-6 months and SMH's is nearing expiry. Intel just had its largest single-day loss on record, Nvidia lost its lower support trend, and AAPL's weekly shows a divergence as the anti-AI safe haven. Expects 'wicked snap-style' two-way moves rather than a straight liquidation.", "angle": "Reflexive two-way tape = options-rich, direction-poor. Intel as proof that plateaus resolve downward for the weakest balance sheet first.", "tweetA": "Intel -28.6% is the headline. The tell is that nothing else had to break for it to happen. Plateaus don't end with the index; they end one earnings print at a time, weakest balance sheet first. Who's next on the calendar? $INTC $SMH", "tweetB": "If the AI trade is a 3-6 month plateau, we're at month 5. Meanwhile AAPL is being used as the anti-AI hedge, which means the hedge is crowded too. Where do people hide when the hiding place is the trade? $AAPL $NVDA", "charts": {"count": 3, "hot": false, "desc": "Weekly AAPL divergence chart, Wilshire 5000, Tom Lee ETF barometer"}, "link": "https://www.macroedge.world/p/redeye-macro-note-situational-awareness"}, {"id": 2, "cat": "culture", "urgency": "watch", "source": "Redeye Macro Note / MacroEdge", "title": "Sentiment tell: AI stock chatter on 10-12 consecutive flights", "idea": "Author has overheard AI-equity conversations on every one of his last 10-12 flights, which he calls unprecedented, while household equity exposure sits at an all-time high. He pairs it with YouTube 'panic' videos as a contrarian gauge and notes no 8-10% 'BMR' downside move has happened yet.", "angle": "Anecdotal, but the same sort of tell as taxi-driver stock tips. Pair with household allocation ATH for a positioning thesis.", "tweetA": "Household equity allocation at record, strangers on planes debating $NVDA, and the index is still only ~10% off the high. The bubble indicator I trust least is the one everyone is quoting: price. I trust the one nobody can chart: who's talking.", "tweetB": "Test for a top: would your Uber driver have an opinion on the Anthropic S-1? Mine does. That isn't a signal to sell, but it is a signal that nobody new is left to convince.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.macroedge.world/p/redeye-macro-note-situational-awareness"}, {"id": 3, "cat": "geopolitics", "urgency": "deep", "source": "Redeye Macro Note / MacroEdge", "title": "The post-midterm Iran escalation scenario: a defeated president lashes out", "idea": "Author fears a Trump defeated on Tuesday could 'lash out' at Iran after ~8 months of conflict and a restructured military top brass, and calls the 'mediator' headlines effective market-manipulation tools. Europe is entering winter undersupplied on onshore gas inventories, which is worse if the winter is cold.", "angle": "Matches the WSJ line (cited by David Lin) that Trump told Gulf allies to prep a short intense campaign after the midterms. Gas storage + Hormuz = Europe tail.", "tweetA": "Everyone is positioning for the midterm result. Almost nobody is positioning for what the administration does on Wednesday. Brent at $117 already assumes a deal that every headline says is a bluff. $BZ $TTF", "tweetB": "Europe goes into winter short gas inventory with Hormuz open to tanker attacks. If the post-election plan is 'brief, intense campaign', the TTF curve is the cheapest hedge in the world right now.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.macroedge.world/p/redeye-macro-note-situational-awareness"}, {"id": 4, "cat": "regulation", "urgency": "watch", "source": "Redeye Macro Note / MacroEdge", "title": "SEC to scrutinise AI firms' offering decks for risk transparency", "idea": "Mentioned in passing: the SEC announced it will take a closer look at AI firms' offering documents to make sure risks are properly disclosed. It lands in the same week the Anthropic S-1 (90+ pages of risk factors) is being picked apart.", "angle": "A regulator entering the AI-IPO pipeline just before ANT and OpenAI listings is a timeline risk for the supply wave.", "tweetA": "The SEC says it will review how AI companies describe risk in offering decks. The first test case is a prospectus with 90 pages of risk factors, some of them about p(doom). Disclosure isn't the bottleneck; absorbing $100B of supply is.", "tweetB": "Add 'SEC comment letters' to the list of things that can move the Anthropic IPO date, next to Nasdaq float and Nvidia's rumored 10% anchor order.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.macroedge.world/p/redeye-macro-note-situational-awareness"}, {"id": 5, "cat": "macro", "urgency": "deep", "source": "FX Weekly / Dark Side of the Boom", "title": "The Dollar isn't getting its safe-haven bid because the stress is American", "idea": "USD went nowhere in October despite firm US nominal growth, higher energy and softer equities. Argument: the trouble is in US tech itself, the pillar of US exceptionalism, so the greenback can't be the shelter. 'If the source of the smoke is in your own house, you are not always the first place people run.'", "angle": "Gold -3.3% and DXY +0.16% on the worst tech day in months fits: the 'shelter' reflex is being replaced by margin-call liquidation.", "tweetA": "A tech wobble used to mean long USD. This time DXY +0.16% on the month. When the epicenter is your own megacap complex, the dollar stops being the hedge and starts being the exposure. $DXY $QQQ", "tweetB": "Dollar down, gold down, equities down, 10y down. That isn't a risk-off, it's a de-grossing. The question is what gets bid when the funding currency can't be sold.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/fx-weekly-ai-meets-election-risk"}, {"id": 6, "cat": "macro", "urgency": "deep", "source": "FX Weekly / Dark Side of the Boom", "title": "Yen as the AI-volatility hedge; GPIF reallocation is the slow fuse", "idea": "BoJ is in a regular tightening rhythm, policy still below neutral. Hardest evidence needed: GPIF allocation data (earliest formal change spring 2027, but it can move within bands). Author notes stronger negative JPY-equity correlation as AI vol rises, so JPY works as an equity hedge beyond BoJ.", "angle": "JPY long as an AI-unwind hedge that also carries a policy-normalisation leg. Watch quarterly GPIF flow data, not press conferences.", "tweetA": "The JPY now trades as an AI hedge. Add a BoJ that keeps hiking and a GPIF whose 'ultra-low-yield' allocation framework is obsolete, and you have two legs for the same trade. Only one of them needs equities to fall. $USDJPY", "tweetB": "Everyone is long the Nasdaq, short the yen's carry. If GPIF trims unhedged foreign assets by even a fraction, that's a bid for the currency with no earnings call to hide behind.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/fx-weekly-ai-meets-election-risk"}, {"id": 7, "cat": "macro", "urgency": "deep", "source": "FX Weekly / Dark Side of the Boom", "title": "AUD/NZD: terms of trade beating the rate spread, oil is the key", "idea": "After RBNZ's surprise October hold, AUD/NZD keeps grinding higher even as the rate differential compressed (market still prices more RBNZ hikes). Elevated energy favours Australia and hurts New Zealand; the author says a reversal lower depends on oil. NZ election and a possible dual-mandate revival are secondary and mildly NZD-negative.", "angle": "Clean example of a cross trading oil, not rates. Same oil binary as the Iran story.", "tweetA": "AUD/NZD is a Brent proxy dressed up as a rates trade. The differential says NZD; the oil tape says AUD; with Brent at $117 the tape is winning. Hedge it with the Iran headline you already own.", "tweetB": "RBNZ hikes in December and March are priced, yet the cross doesn't care. When a currency pair ignores the central bank, ask who the real central bank is. Today it's Hormuz.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/fx-weekly-ai-meets-election-risk"}, {"id": 8, "cat": "AI/infra", "urgency": "deep", "source": "Blind Squirrel Macro / Arcadia", "title": "Pascal's wager for AI: at $1.5T you need only a 1.25% chance at $120T", "idea": "Sand Hill's line 'the average of zero and infinity is infinity' meets the corollary: buy one share. With a $1.5T IPO ticket and a $120T outcome (about a year of global GDP), the payoff is 80:1, so refusing to buy means your odds are longer than 1.25% (60:1 at $2T). Anthropic's S-1 cites $40T of knowledge-work wages; $2T equals 0.5% of that pool, twice Nvidia needs 2.2%, the 'digital god' case needs a third.", "angle": "Great framework for sizing the ANT IPO: express the price as an implied share of the global wage pool.", "tweetA": "Anthropic at $2T = 0.5% of global white-collar wages. At twice Nvidia = 2.2%. The 'god' case = a third of the wage pool going to one company. The debate isn't whether AI is big, it's whether wages become a single company's revenue line. $ANT", "tweetB": "Pascal never had to wonder which god. OpenAI, Google and xAI each sell a ticket to their own deity. The 80:1 payoff is real only if you're confident the winner takes it all, and Chinese open-weights say it won't.", "charts": {"count": 1, "hot": false, "desc": "Table of implied wage-pool share at various ANT valuations (summary conclusion table)"}, "link": "https://www.blindsquirrelmacro.com/p/the-average-of-zero-and-infinity"}, {"id": 9, "cat": "positioning", "urgency": "deep", "source": "Blind Squirrel Macro / Arcadia", "title": "'Nobody owns it': the Anthropic IPO as a career-risk trade", "idea": "Author's thesis: valuation work is probably irrelevant, the IPO needs to happen. ANT has almost no conventional institutional holders, Nvidia is rumored to want 10% of the deal, and the nightmare for benchmarked managers is a $2T listing squeezing to $4T on a tiny float while they're at zero weight. SpaceX comp: ~2.5M call contracts, $37B notional, strikes out to Jan 2029; ANT options chain expected by Christmas.", "angle": "Playbook: stag or watch, then use convex upside as 'schmuck insurance'. Tweet the benchmark-risk angle.", "tweetA": "Every PM knows losing 50% in a must-own stock is a 'market event' and underperforming by 30% is a career event. That asymmetry is the whole bid for ANT. The fundamentals discussion comes after the float discussion. $ANT $SPCX", "tweetB": "SpaceX already shows how it ends for the small float: 2.5M call contracts, $37B notional. An ANT chain by Christmas means the first real price discovery will be in options, not shares.", "charts": {"count": 2, "hot": false, "desc": "OptionStrat payoff table; valuation scenario summary"}, "link": "https://www.blindsquirrelmacro.com/p/the-average-of-zero-and-infinity"}, {"id": 10, "cat": "culture", "urgency": "watch", "source": "Hardfork", "title": "Craft as an economic moat: the curator mindset", "idea": "Using a Tucci in Italy scene, a Rome restaurateur says 'I am a curator, a host... it's all of it together that makes a real experience'. Author argues the best restaurants, retailers and services win by caring about the whole experience, something customers can sense.", "angle": "Anti-commoditisation thesis: in a world where AI makes output abundant, experience-level care is the scarce part.", "tweetA": "If AI makes the product free, the edge moves to the person who curates the whole experience. A Roman restaurateur understood that long before $MSFT put it in a deck.", "tweetB": "The luxury sector prices 'pride in the product' at a 50%+ gross margin. In an AI economy, that is the one margin nobody can automate.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/love-soul-and-care-the-essence-of"}, {"id": 11, "cat": "energy", "urgency": "deep", "source": "Doomberg", "title": "Venezuela: politics outranks geology in oil's hierarchy of constraints", "idea": "2021: Orinoco heavy output fell 25% because lighter diluent had to go to struggling refineries. Dec 2025: US Navy blockade, Russian naphtha tankers; Jan 2026: Maduro captured. Output has since risen to 1.25M bpd from an 830k bpd low in December. Doomberg frames it as evidence for the shifting molecular definition of oil and for the Western Hemisphere's hydrocarbon potential.", "angle": "Western Hemisphere supply as the offset for Hormuz. Also a diluent (naphtha) angle.", "tweetA": "Venezuela went from 830k to 1.25M bpd in a few months with no new geology, just different politics. It's the cleanest case study I know for 'oil is a political constraint, not a geological one'. $CVX", "tweetB": "With Brent at $117, the market is begging for barrels. The 400k bpd that came back from Caracas is the largest un-hyped supply response of the war.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://newsletter.doomberg.com/p/gating-functions"}, {"id": 12, "cat": "macro", "urgency": "deep", "source": "Ironsides Macro", "title": "Warsh's 'broadening' claim vs. the data: Broadening, or Breaking?", "idea": "Ironsides disagrees with Fed Chair Warsh that GDP and capex are broadening: consumption is cooling and capex is concentrated in tech. Calls the Fed's September hike unsupported by the preceding inflation trend and a 'policy mistake' that tightened conditions into a vulnerable labour market. Flags the 2018 policy-error analogy and doesn't expect midterms to deliver a clearing rally.", "angle": "Counter-narrative to the hike-in-December consensus (85% per FedWatch).", "tweetA": "3.4% GDP, a Fed that hiked in September and still has an 85% shot in December. Ironsides says the hike lacked inflation support. If they're right, the cost of capital is the AI trade's real catalyst, not earnings. $TLT", "tweetB": "2018 rhymes: hawkish pivot, tech first to crack, midterm hope. The difference is the funding source. In 2018 it was buybacks; in 2026 it's hyperscaler debt.", "charts": {"count": 0, "hot": false, "desc": "16 charts in full article (Charts inside, worth opening)"}, "link": "https://ironsidesmacro.substack.com/p/broadening-or-breaking"}, {"id": 13, "cat": "AI/infra", "urgency": "deep", "source": "Ironsides Macro", "title": "Hyperscaler capex growth has peaked: 'Another Great Leap Forward'", "idea": "Ironsides says hyperscaler investment has passed peak capex growth and entered a monetisation phase, with equity and credit markets pressing management to restrain spending. Productivity gains show up in tech and fast followers but employment and margin data don't show diffusion. Slower consumption could weaken the cash flows that fund the boom.", "angle": "Second-derivative call: capex growth peaking is bearish for suppliers even if capex stays high. Pair with Alphabet's $51.4B quarter.", "tweetA": "Capex doesn't need to fall for the supply chain to suffer, it only needs to stop accelerating. Alphabet printed $51.4B in a quarter and was punished for it. That's the market telling you the second derivative has turned. $NVDA $AVGO", "tweetB": "Great Leap Forward is a harsh label, but the parallel works: output targets set by the plan, not by demand. Hyperscaler capex plans total hundreds of billions; the customer is another hyperscaler.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://ironsidesmacro.substack.com/p/broadening-or-breaking"}, {"id": 14, "cat": "positioning", "urgency": "deep", "source": "Helene Meisler", "title": "Metals sentiment is at capitulation levels: GLD DSI 13, PALL DSI 9", "idea": "Meisler notes single- and sub-15 DSI readings across metals (copper excepted): GLD DSI at 13, PALL at 9. Her read: 'oversold' inside a market with 'Either/Or' behaviour. Also flags XLP unloved and XLV as the 'new place for love' but Friday closed on the lows.", "angle": "Contrarian signal on gold after the one-year-low $3,898.90 settlement.", "tweetA": "Gold bulls at 13% on DSI, palladium at 9%. This is as bearish as the retail crowd gets, one day after gold printed a one-year low. I've never been able to fade this crowd. Today I'd try. $GLD $PALL", "tweetB": "Silver below $50 for the first time since November, gold at a one-year low, and sentiment at single digits. The margin-call story explains the move. It doesn't explain the next one.", "charts": {"count": 2, "hot": true, "desc": "DSI charts across metals ETFs (GLD, PALL, XME). 🔥 CHART WORTH SAVING"}, "link": "https://helenemeisler.substack.com/p/saturday-chart-fest-c0a"}, {"id": 15, "cat": "positioning", "urgency": "deep", "source": "Helene Meisler", "title": "QQQ: head-and-shoulders completed, highest volume since June, 'outside month'", "idea": "The H&S top she drew in QQQ last week 'came to fruition'; Nasdaq printed an outside month (typically read as bearish). QQQ's Friday volume was the highest since early June. IWM must hold 270, SOX was 'saved by July's low', QQQJ didn't break, and VGK needs to clear 88. 10-year yield: barely breaking the trendline.", "angle": "Technical map into the Monday open, paired with MacroEdge's 'plateau' view.", "tweetA": "Nasdaq outside month, QQQ H&S completed, volume at the highest since June. SOX is held up only by the July low. Three weeks of drops with the structure intact is a different regime than a dip. $QQQ $SOX", "tweetB": "The tell from Meisler isn't the pattern, it's the conversation: 'now that the folks I love to fade see it'. When the contrarians flip, I look for the next narrative to be wrong, not the tape.", "charts": {"count": 3, "hot": true, "desc": "QQQ H&S + volume; SOX vs July low; Citi Panic/Euphoria. 🔥 CHART WORTH SAVING"}, "link": "https://helenemeisler.substack.com/p/saturday-chart-fest-c0a"}, {"id": 16, "cat": "venture", "urgency": "watch", "source": "The Founders Corner", "title": "AI at a fixed capability level gets 10x cheaper about every year", "idea": "Steve Krouse charted prices for fixed scores on four benchmarks and found 10x drops every 0.8-1.3 years, ~1.0 on average, matching Altman's Feb 2025 claim. The older the level, the flatter the decline: o3-mini's level is only 11x cheaper after 1.7 years. GPT-6.1 Terra launched at half of GPT-5.6 Terra's API price: $1 input / $5 output per million.", "angle": "Cost curve vs. revenue: if capability prices fall 10x a year, revenue growth must be 10x just to stand still in dollars.", "tweetA": "Same capability gets 10x cheaper every year, and the leading labs need 10x revenue growth just to stay flat. That is the treadmill behind the $417B of compute commitments. $ANT", "tweetB": "Token prices are falling while GPU rental rates are rising (David Woo's point). Margin squeeze is not a bug, it's the shape of this cost curve.", "charts": {"count": 1, "hot": false, "desc": "Krouse price-vs-capability chart (worth opening)"}, "link": "https://www.the-founders-corner.com/p/anthropic-ipo-meta-95b-raise-openai-valuation"}, {"id": 17, "cat": "AI/infra", "urgency": "deep", "source": "The Founders Corner", "title": "Meta's $95B equity raise, with Nvidia, AMD and Broadcom as potential buyers", "idea": "Meta will raise $35B in underwritten equity then $60B through an ATM; Nvidia, AMD and Broadcom expressed interest in buying up to $5B of shares. Stock fell 1.6% in the morning. Same issue: OpenAI is raising up to $30B at $1.25T pre-money with UAE investors and Coatue, called a bridge to an IPO.", "angle": "Circularity: suppliers recycling revenue into customer equity. Pair with the Nvidia 10% ANT rumor.", "tweetA": "Meta sells $95B of stock to fund AI infrastructure, and its suppliers are volunteering to buy $5B each. The people selling the shovels are funding the person buying the shovels. That's vendor financing with a ticker. $META $NVDA $AMD $AVGO", "tweetB": "Meta: $95B equity. SpaceX: $40B GPU debt. Anthropic: $100B IPO. OpenAI: $30B bridge. Four of the biggest financings of the cycle in one fortnight. Who's left on the buy side?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/anthropic-ipo-meta-95b-raise-openai-valuation"}, {"id": 18, "cat": "credit", "urgency": "deep", "source": "The Founders Corner", "title": "SpaceX's $40B GPU debt close; Musk: 200+ neoclouds will fail", "idea": "SpaceX signed a binding ~$40B commitment with an Apollo-managed entity to buy GPUs arriving 1H27. Musk says debt markets have largely shut to companies without substantial revenue outside AI data centers and predicts most of 200+ neoclouds will fail or consolidate. Counterexample: General Compute raised $100M at $800M (up from $60M in May) on a $100M ARR deal, running on Cerebras, SambaNova and Positron chips.", "angle": "Credit rationing selects for the biggest balance sheets. Pair with CoreWeave bonds at ~15%.", "tweetA": "Musk says the debt market is closed to anyone without non-AI revenue, then closes $40B of GPU debt for himself. The credit window isn't shut, it's narrowed to those with a balance sheet that can underwrite it. $CRWV", "tweetB": "General Compute went from a $60M to an $800M valuation in five months on non-Nvidia chips. The bear case for $NVDA isn't demand, it's that inference gets done elsewhere for less.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/anthropic-ipo-meta-95b-raise-openai-valuation"}, {"id": 19, "cat": "venture", "urgency": "deep", "source": "The Founders Corner", "title": "Anthropic S-1 oddities: Amazon's $97.9B note stake, 7 cofounders hold 50.1% voting", "idea": "Anthropic filed Oct 26 for Nasdaq (ANT), reporting $4.6B of 2025 revenue and a $42B net loss. Amazon's convertible notes ($6.2B principal) were valued at $97.9B on June 30 and can convert into up to 1.84B shares, capped at 12%. No VC firm reaches 5% and Menlo has ~1.5%. Seven cofounders hold 50.1% voting control through Founders LLC and each can name 10 ranked, secret successors.", "angle": "Governance + cap table: Amazon is the big winner; VCs are tiny. A very non-standard control structure for a $2T listing.", "tweetA": "$6.2B of convertible notes marked at $97.9B. Amazon's Anthropic bet is the best-performing venture investment in history and it sits on a 12% cap. No VC is above 5%. This is the most corporate cap table of any frontier lab. $AMZN $ANT", "tweetB": "Seven people control the vote and each names ten secret successors. In a $2T IPO, that's a succession plan that investors aren't allowed to read.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/anthropic-ipo-meta-95b-raise-openai-valuation"}, {"id": 20, "cat": "AI/infra", "urgency": "watch", "source": "The Founders Corner", "title": "GLM-5.3 completes 3 of 13 multistage cyberattacks; GPT-6 Astra 9 of 10", "idea": "Z.AI's open-weight GLM-5.3 finished 3 of 13 attack simulations at least once, the strongest result Irregular has seen from an openly available model. OpenAI's GPT-6 Astra completed 9 of 10 scenarios in a separate (not identical) test. Also: GPT-6.1 Terra's low-effort error rate on hard prompts fell from 53.6% to 16.7%.", "angle": "The offensive-capability gap between closed and open weights is the metric to watch; it tells us when export-control logic breaks.", "tweetA": "Open-weight Chinese model: 3 of 13. Closed US model: 9 of 10. The gap is big today and it's one year from small, if the 10x/yr cost curve holds. Export controls are a depreciating asset.", "tweetB": "A 53.6% to 16.7% error cut at half the price in a single release. Agents don't need to be perfect, they need to be cheap and wrong rarely enough. That threshold just moved.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/anthropic-ipo-meta-95b-raise-openai-valuation"}, {"id": 21, "cat": "science", "urgency": "watch", "source": "The Founders Corner", "title": "Anthropic's first drug programs came from a one-person biotech", "idea": "Anthropic disclosed on Oct 27 that it bought Mithril Medicine in July. Founder Cody Tranbarger was the only full-time employee, using part-time consultants and 11 outside labs, with Claude helping manage experiments. Mithril's rare muscular dystrophy programs became Anthropic's first internal drug programs.", "angle": "One person plus outside labs plus an AI manager = a drug pipeline. Biotech unit economics are changing.", "tweetA": "A one-employee biotech with 11 outsourced labs, run with Claude, was good enough for a frontier lab to buy. If the pipeline can be run by one person, the next question is what a 'biotech' is worth.", "tweetB": "The first drug programs at Anthropic weren't built in-house; they were acquired. That's the AI-lab strategy at $2T: buy the vertical, own the data.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/anthropic-ipo-meta-95b-raise-openai-valuation"}, {"id": 22, "cat": "labor", "urgency": "deep", "source": "The Founders Corner", "title": "The $8.02 agent workday and a 5-person team replaced by $200/month", "idea": "A four-model setup (Fable 5.1 plans, Sonnet 5.5 executes, Opus 5.5 grades) cut a modeled agent workday from $90.75 to $8.02 under a $15 cap. Another piece: one founder runs eight Claude Code systems on Max 20x for $200/month to cover work of five developers whose median salary alone costs $679,900. A PostHog engineer's agents load a skill in 78% of 578 chats.", "angle": "Labor arbitrage numbers: $200/mo vs $679,900/yr. Modelled, not observed - note that.", "tweetA": "$200 a month vs $679,900 a year. Even if it's 10% true, the labor-cost side of the equation reprices white-collar wages, which is exactly the $40T pool Anthropic's S-1 describes. $MSFT $ANT", "tweetB": "The routing trick (cheap model executes, expensive model plans and grades) cut cost 91%. The moat isn't the model, it's the orchestration.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/anthropic-ipo-meta-95b-raise-openai-valuation"}, {"id": 23, "cat": "macro", "urgency": "act", "source": "David Lin Report", "title": "Alphabet -12.6%, Intel -28.6%, ServiceNow -27%: the capex bill arrives", "idea": "Alphabet fell 12.6% (~$500B lost), worst day ever, as capex more than doubled to $51.4B and FCF hit -$9.07B despite cloud +103%. Intel fell 28.6%, its worst day since 1974 (about $140B lost), on Q4 guidance of $15-16B vs ~$17B expected. ServiceNow -27% on soft backlog. Amazon: -$42.4B trailing FCF with $220B capex. Microsoft: Azure +48%, FCF +$18.6B and a $25B bond on ~$115B orders. Seven companies lost ~$1.3T in two days.", "angle": "Dispersion call: the market is separating the funded from the financed. Microsoft vs everyone else.", "tweetA": "Cloud revenue +103% and the stock lost $500B. The market has stopped paying for growth and started paying for free cash flow. Microsoft got $115B of orders for a $25B bond; Amazon prints -$42B FCF. Know which side of that you're on. $GOOGL $AMZN $MSFT", "tweetB": "Seven stocks, $1.3T erased in two days. In 2000 the damage was slow and the earnings were fake. This time the earnings are real, the cash flow isn't. Different bubble, same arithmetic.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/a-nightmare-on-wall-street"}, {"id": 24, "cat": "AI/infra", "urgency": "deep", "source": "David Lin Report", "title": "Anthropic S-1: $16.3B H1 revenue, $417B of compute commitments against $131.7B liquid", "idea": "H1 revenue about $16.3B vs $1.2B a year earlier; operating loss ~$693M; net loss $80.7B, mostly a $72.4B non-cash charge. Liquid assets $131.7B against ~$417B of minimum compute payments plus $125-150B not yet final. David Woo, using leaked figures, says growth slowed from ~300% in Q2 to ~45% in Q3, that Ramp shows zero growth in AI token spend in Aug/Sept, and he expects ~$100B raised at $1.4T or lower.", "angle": "Cross-reference with Founders Corner's $4.6B 2025 revenue. Commitments 3x liquid assets is the number to tweet.", "tweetA": "$417B of committed compute against $131.7B in cash and securities. Operating loss of $693M. The business is fine; the obligations are the story. Dario said it himself: be off by a year and you go bankrupt. $ANT", "tweetB": "Growth from ~300% to ~45% in one quarter, and Ramp showing flat token spend. If those leaks are right, the $2T talk is a price for 2028 revenue that has to arrive in 2027.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/a-nightmare-on-wall-street"}, {"id": 25, "cat": "crypto", "urgency": "act", "source": "David Lin Report", "title": "Binance's $6.3B hack: largest crypto theft on record; BTC at $76,400", "idea": "Binance disclosed a preliminary $6.3B loss, ~$3B frozen, final loss unknown. Bitcoin fell to ~$76,400, a six-week low. Bitcoin weekly -4.3%.", "angle": "Exchange-counterparty risk returns exactly when margin calls are forcing de-grossing elsewhere.", "tweetA": "$6.3B stolen from the largest exchange, ~$3B frozen, and BTC is down only 4.3% on the week. Either the market doesn't believe the number or doesn't care about custody. Both are bad outcomes. $BTC $BNB", "tweetB": "Self-custody and ETFs don't have a Binance problem. The next flow story is who gets the outflows: Coinbase, ETF wrappers, or nobody.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/a-nightmare-on-wall-street"}, {"id": 26, "cat": "gold", "urgency": "act", "source": "David Lin Report", "title": "Gold -3.3% to $3,898.90 (one-year low) and silver below $50", "idea": "Gold futures fell 3.3% to $3,898.90, a one-year low; silver -5.9% to $49.28, below $50 for the first time since November 2025. Vermeulen says gold has been in a bear market since June and sees $3,120 if $4,000 isn't regained. Woo says the fall was hedge funds raising cash for margin calls and wants to buy gold against a basket of EUR/USD/JPY for 2027. Grandich is nearly all-in on gold and miners (gold +131% since 2022 vs the 10y -9%).", "angle": "Three different gold calls in one email: bear (Vermeulen), buy vs currencies (Woo), all-in (Grandich). Direction at $4,000 matters.", "tweetA": "Gold at $3,898.90 and the 10-year at 4.91% falling. That's not a rate story, it's a liquidity story: they sold what they could sell. Woo says buy gold vs the basket for 2027. I'd want to see $4,000 recaptured first. $GLD $SLV", "tweetB": "Three experts, three gold calls: $3,120 / buy vs a basket / 'all-in'. Pick the level where the margin-call selling ends and trade that. That's the only line that isn't opinion. $GDX", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/a-nightmare-on-wall-street"}, {"id": 27, "cat": "macro", "urgency": "deep", "source": "David Lin Report", "title": "Fed holds 10-2 with two dissents for a hike; December hike at 85%", "idea": "Fed held at 3.75-4% in a 10-2 vote, with Cook and Hammack dissenting in favor of a hike. Warsh upgraded the economy to 'strong' and said financial conditions tightened (the policy 'is working'). September PCE +0.5% m/m, 3.6% y/y, core 3.1%. Q3 GDP 3.4%. 10y fell to ~4.91% (a 7-week low, -30bp in October). FedWatch gave 85% to a December hike. Hoenig says policy is too easy and a December hike is 'almost a must'.", "angle": "Hawkish Fed + falling 10y = curve flattening because of the tech unwind. Mixed signals across sources on 10y level (above 5% vs 4.91%).", "tweetA": "Two dissents, both for a hike, in a Fed that says tighter credit spreads show policy is 'working'. The chair is counting AI-sector pain as a feature. That's the first time I've heard it said out loud. $TLT $SPY", "tweetB": "Hoenig: real rates near zero, inflation near 4%, $2T annual borrowing. His warning is that the long end is the tightening. Funny, because the 10-year just fell 30bp in the month the AI trade broke.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/a-nightmare-on-wall-street"}, {"id": 28, "cat": "labor", "urgency": "deep", "source": "David Lin Report / Eric Basmajian", "title": "Weak hiring, few layoffs: youth unemployment 7% to over 10%", "idea": "Basmajian: continued claims per initial claim at 8.7 weeks, higher than 88% of readings since 1967. Youth unemployment rose from 7% to over 10% while over-25 rose by less than a point; junior repetitive roles are being automated first. Non-residential construction (mostly data centers) added 100k+ jobs; only residential (-1% y/y) to watch. He estimates 80-85% of AI productivity gains go to corporate profits; real wage growth ~1% vs 2-2.5% expected.", "angle": "Two-speed labor: construction boom for AI vs. no entry-level hiring.", "tweetA": "Continued claims per initial claim are higher than 88% of all readings since 1967, including recessions. It's not layoffs, it's that nobody is hiring the 22-year-old. The AI jobs story is a first-job story. $XLY", "tweetB": "Data-center construction added 100k+ jobs in a year while the entry-level unemployment rate went from 7% to 10%. The AI economy builds buildings and doesn't hire graduates.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/a-nightmare-on-wall-street"}, {"id": 29, "cat": "macro", "urgency": "deep", "source": "David Lin Report / Redfin (Fairweather)", "title": "Mortgage rates are high because the AI boom is eating the capital", "idea": "Redfin's Fairweather: September home sales hit the lowest level since 2014; at a 7% mortgage there's a ~$20,000 gap between income and what the typical home needs. She argues AI explains high mortgage rates: investors prefer corporate bonds and data centers over mortgages. SF homes sold at 113% of asking (record) while Seattle lags with Amazon hiring frozen and Microsoft buying out 60,000 employees.", "angle": "Direct crowding-out evidence: AI capex cost transmitted to consumers via mortgage spreads.", "tweetA": "Housing is paying for the AI buildout. Mortgage rates are high because the marginal dollar is in hyperscaler bonds, not MBS. The 30-year fixed is the AI trade's hidden tax on 130M households. $ITB $XHB", "tweetB": "San Francisco at 113% of asking, Seattle stuck with Microsoft buying out 60,000 jobs. One metro is AI wealth, the other is AI's cost line. K-shaped housing is a geography.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/a-nightmare-on-wall-street"}, {"id": 30, "cat": "credit", "urgency": "deep", "source": "David Lin Report / Trajan (Busch) + David Woo", "title": "CoreWeave debt at ~15%: ~500bp over the CCC curve", "idea": "Busch: CoreWeave bonds trade near 15%, 'equity-like returns with equity-like risk', roughly 500bp above the triple-C curve. Woo adds another $500B of AI bonds are due to come in 2027. Busch likes 3-5 year Treasuries and says 60/40 works again at multi-decade high yields; a 30-year has duration of 20-25.", "angle": "Credit leads equity. The spread to CCC says default risk is priced above junk.", "tweetA": "CoreWeave debt trades 500bp wide of CCC. When the AI trade's credit is priced worse than distressed junk and the equity multiple is still sky-high, one of them is wrong. $CRWV", "tweetB": "$500B of AI bonds are queued for 2027, and the market already prices the weakest name above CCC. Supply is the ultimate stress test, not earnings.", "charts": {"count": 1, "hot": false, "desc": "Busch chart of CoreWeave yield vs CCC curve"}, "link": "https://davidlinreport.substack.com/p/a-nightmare-on-wall-street"}, {"id": 31, "cat": "geopolitics", "urgency": "act", "source": "David Lin Report", "title": "Brent $117.64 on a Hormuz tanker attack, with talk of a strike within 1-2 weeks", "idea": "Brent Dec settled +2.4% at $117.64, highest close since Apr 29; WTI +2.1% to $104.12. Brent +13.6% and WTI +15.2% in October. WSJ: Vance wrote to Iran's Rezaei to revive talks; WSJ also: Trump told Gulf allies to prepare for a brief, intense campaign after the midterms. David Woo says the odds of military action against Iran within 1-2 weeks are over 50% and unpriced, and that Israel's chief of staff blocked a strike last weekend.", "angle": "Binary: deal headline vs strike. Oil +13.6% in a month where equities fell.", "tweetA": "Brent at $117.64 after a tanker attack, the highest since April. WSJ says Vance is writing letters; WSJ also says the Gulf is being told to expect a campaign after the midterms. Same newspaper, same week. $USO $XLE", "tweetB": "Woo gives 50% on action within two weeks. Brent already +13.6% this month. Under a strike, the number isn't 130, it's the insurance premium on Hormuz.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/a-nightmare-on-wall-street"}, {"id": 32, "cat": "macro", "urgency": "deep", "source": "David Lin Report / Peter Grandich", "title": "Passive flows are the last support; 10y at 5.5-6% in 2027", "idea": "Grandich: a shrinking group of stocks carried the S&P since summer; several hundred members are down 20%+. Hedge funds turned very short while the public bought tech funds. If passive flows turn negative, the decline could be worse than 1929, though 'not happening yet'. He expects the 10y at 5.5-6% in 2027, fertilizer disruptions causing food shortages in 2027, and Democrats retaking at least the House to stall war funding.", "angle": "Narrow-breadth line: several hundred S&P members 20%+ off highs, while the index sits near highs.", "tweetA": "Hundreds of S&P stocks are 20%+ off their highs. The index holds because of a few names and passive flows. If passive stops being a net buyer, nothing else is. That's the only risk that matters in this market. $SPY", "tweetB": "Fertilizer shortage in 2027 is a quiet one: Hormuz moves urea and ammonia too. Food-price inflation lags energy by 6-12 months.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://davidlinreport.substack.com/p/a-nightmare-on-wall-street"}, {"id": 33, "cat": "positioning", "urgency": "deep", "source": "David Lin Report / Chris Vermeulen", "title": "Semis OBV breakdown and 'record' tech selling by hedge funds", "idea": "Vermeulen: semiconductors' on-balance-volume broke down then retested the breakdown, a pattern that can precede a big unwind. He cites Goldman reporting record hedge-fund tech selling in October. Money is leaving tech but not stocks (staples, utilities, health care, REITs rose). The Nasdaq 100 is ~10% off its high; margin is at record levels. He expects a gap down at Monday's open and a possible capitulation low.", "angle": "Rotation not liquidation: the reason the panic indicator hasn't spiked. Useful contrast with Grandich's more apocalyptic view.", "tweetA": "Hedge funds sold record tech in October, margin debt is at a record, and the panic gauge is quiet because the money moved to staples and utilities. That's the 'orderly' version. The disorderly one needs forced sellers, and margin debt is where they live. $SMH", "tweetB": "Same weekend, two verdicts: Vermeulen sees a probable bounce, Grandich sees 1929. The difference is whether passive flows stay positive.", "charts": {"count": 1, "hot": false, "desc": "Semis OBV breakdown-and-retest chart"}, "link": "https://davidlinreport.substack.com/p/a-nightmare-on-wall-street"}, {"id": 34, "cat": "credit", "urgency": "watch", "source": "Dark Side of the Boom", "title": "Barclays: AI credit default trade has arrived (snippet only)", "idea": "Email body contains only a link; the preview line says AI credit risk is repricing far faster than the broader investment-grade market. Title: 'The AI Credit Default Trade Has Arrived: Barclays Maps the Next Fault Lines in Wall Street's Financing Boom'. Content must be read on the web.", "angle": "Matches CoreWeave 15% and Meta/SpaceX financing: AI-specific CDS may be the cleanest hedge.", "tweetA": "AI credit is repricing faster than IG. Barclays is mapping where the defaults land. The AI-specific CDS basis is the best leading indicator we have, and the equity market isn't watching it. $CRWV $ORCL", "tweetB": "IG is flat, AI issuers are wider. If 'quality' bonds from hyperscalers start trading like single-Bs, the whole financing model changes. Look at Meta's $95B equity raise as the first answer.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-credit-default-trade-has-arrived"}];

var COL = {"macro": "#e24b4a", "credit": "#378add", "positioning": "#ef9f27", "AI/infra": "#1d9e75", "crypto": "#7f77dd", "geopolitics": "#d85a30", "energy": "#f97316", "tech": "#06b6d4", "gold": "#d4a017", "culture": "#ec4899", "labor": "#8b5cf6", "regulation": "#64748b", "science": "#14b8a6", "venture": "#84cc16"};

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function toggle(id){var e=document.getElementById('c'+id);e.classList.toggle('open');}
function filterBySrc(name){fs=name;fc='all';fu='all';render(true);}
function setC(c){fc=c;fs=null;render(false);}
function setU(u){fu=u;fs=null;render(false);}
function pills(){
  var h='';var all=['all'].concat(CATS.filter(function(c){return ITEMS.some(function(i){return i.cat===c;});}));

    h+='<span class="pill" onclick="setC(\''+c+'\')" style="'+(on?'background:'+colr+';border-color:'+colr+';color:#fff':'')+'">'+c+' '+n+'</span>';});

    h+='<div><b style="color:#7f77dd">TWEET B</b><div>'+esc(item.tweetB)+'</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>';
    h+='<div class="ch'+(item.charts.hot?' hot':'')+'">'+(item.charts.count?(item.charts.hot?'🔥 CHART WORTH SAVING · ':'📊 ')+item.charts.count+' chart(s): '+esc(item.charts.desc):'No charts in email · '+(item.charts.desc?esc(item.charts.desc):'article may have charts inside — worth opening'))+'</div>';
    h+='<div style="margin-top:8px"><a href="'+item.link+'" target="_blank">↗ Read full article</a></div></div></div>';
  });
  document.getElementById('list').innerHTML=h||'<p>No items.</p>';
}
function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';
  var r='<p>Window: '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.<br>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</p><b>Included sources</b> (click to filter)<ul>';
  META.includedSources.forEach(function(s){r+='<li><span class="sl" data-s="'+esc(s.name)+'">'+esc(s.name)+'</span> — '+s.items+'</li>';});
  r+='</ul><b>Skipped</b><ul>';META.skippedSources.forEach(function(s){r+='<li>'+esc(s.name)+': '+esc(s.reason)+'</li>';});
  r+='</ul><p>'+esc(META.notes)+'</p>';
  document.getElementById('repb').innerHTML=r;
  Array.prototype.forEach.call(document.querySelectorAll('.sl'),function(e){e.onclick=function(){filterBySrc(e.getAttribute('data-s'));};});
  render(false);
}
init();
</script></body></html>
