<title>Twitter Bank Research</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DATA POINT TAGS */
.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>

<script>
const REPORT_DATA = {"report_type": "TWITTER BANK RESEARCH", "freshness_gate": "OK    data/twitter/latest/tweets_bank_research.json: collected_at 2026-11-16T06:23:30+00:00 (0.4h old), non-empty\nFRESHNESS GATE PASSED.", "collected_at": "2026-11-16T06:23:30Z", "window_days": 4, "input_stats": {"total_tweets": 120, "considered": 120, "kept": 42, "dropped": 78, "deduped": 0}, "summary": "Goldman dominates with its 2027 equity outlook: 16% SPX return forecast, earnings growth halving from 36% to 11%, a global valuation reset led by tech de-rating, and record-low US Info Tech long/short ratio.\n\nInflation/Fed thread across banks: BofA supercore at 5.45% annualized, Goldman commodity boost of ~0.5pp to core PCE, HSBC on 75bp of hikes priced.\n\nPositioning & flows: BofA Hartnett record 2026 inflows to global equities, Deutsche positioning at 26th percentile, Barclays tactically bullish, Nomura down-day vol twice up-day vol.\n\nConsumer: JPMAM income-bracket spending and gas-price charts, BofA Institute card spending +5.8% YoY in October.\n\nCounts: Goldman 20, JPM 9, BofA 7, Yardeni 3, Apollo/Slok 2, HSBC 2, Barclays 1, Deutsche 1, Nomura 1, UBS 1 — 42 unique items.", "by_bank_counts": {"Goldman": 20, "JPM": 9, "BofA": 7, "Yardeni": 3, "Apollo/Slok": 2, "HSBC": 2, "Barclays": 1, "Deutsche": 1, "Nomura": 1, "UBS": 1}, "banks": [{"bank": "Goldman", "theme": "2027 Equity Outlook — earnings deceleration, valuation reset, tech de-rating & net selling, core PCE commodity boost", "items": [{"author": "MikeZaccardi", "text": "Goldman sees US real GDP growth of 2.4% in 2027, with 1.4% headline CPI (2.2% core PCE)\n\n10yr yield declining to 4.4% out 12 months https://t.co/FSezwVo8HV", "tweet_url": "https://x.com/MikeZaccardi/status/2121979788302680348", "images": ["https://pbs.twimg.com/media/HXLJX3qXIAExhsY.png"], "created_at": "2026-11-15T14:53:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Despite fading since 2025, US equities look attractive.. ROE is rising relative to global peers even as valuations have squeezed. \n\nMeanwhile, we remain underweight Europe.. stickier valuations, debt risks, and a heavy political calendar outweigh the boost from cheaper oil. https://t.co/hTIht9z0HY", "tweet_url": "https://x.com/MikeZaccardi/status/2121951602462392782", "images": ["https://pbs.twimg.com/media/HXKvvOLWEAEwd6y.jpg"], "created_at": "2026-11-15T13:01:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Cyclicals have plunged vs. Defensives. \n\nIs that bearish for 2027? https://t.co/cZF6psXeBT", "tweet_url": "https://x.com/MikeZaccardi/status/2121947827592994916", "images": ["https://pbs.twimg.com/media/HXKsTgAW8AA4iPx.png"], "created_at": "2026-11-15T12:46:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Both Software and, particularly, Tech hardware have seen their premium valuations erode https://t.co/n6p7ZhVG78", "tweet_url": "https://x.com/MikeZaccardi/status/2121944053734343076", "images": ["https://pbs.twimg.com/media/HXKo3xlW8AECKK3.jpg"], "created_at": "2026-11-15T12:31:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Tech (ex-DM) remains quite low-levered \n\nTrue, the biggest companies have turned cash flow negative, but overall balance sheet measures such as net debt/equity remain healthy. https://t.co/7M5e7kJDot", "tweet_url": "https://x.com/MikeZaccardi/status/2121940277568958601", "images": ["https://pbs.twimg.com/media/HXKlcD8WQAAZpcp.png"], "created_at": "2026-11-15T12:16:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "While Goldman says hedge funds aren't chasing upside, at least via options, what they have been betting on is lower volatility.  Goldman says hedge funds showed \"more confidence in 'vol lower' than ... in 'spot higher,'\" and VIX puts have traded more volume over the last 10 sessions than at any point in 2026.", "tweet_url": "https://x.com/neilsethinew/status/2121936260251939073", "images": ["https://pbs.twimg.com/media/HXIcb7lWkAA-m25.png"], "created_at": "2026-11-15T12:00:02.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Global Tech now trades at just a 14.1x forward P/E https://t.co/lIwgC4CiZS", "tweet_url": "https://x.com/MikeZaccardi/status/2121936197509402789", "images": ["https://pbs.twimg.com/media/HXKhuj6WoAArAC2.jpg"], "created_at": "2026-11-15T11:59:47.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Christophe Barraud (@C_Barraud) led his Top 10 Macro/Financial Charts of the Week with ZeroHedge’s “Bank of Nvidia” chart, which links to a detailed piece on the state of the Nvidia investing flywheel now that Jensen Huang is out and CFO Colette Kress is running Nvidia as interim CEO (while keeping the CFO job).\n\nZH’s argument: per the WSJ, Reuters and The Information, Kress was the one executive who kept asking what Nvidia’s guarantees were actually worth and, in at least one case, pushed back on how big they got.\n\nThat one case was the OpenAI Ohio backstop, which she cut from a reported $250B to the $105B that was eventually filed. ZH says that’s probably good for $NVDA shareholders but bad for the long list of AI companies counting on Nvidia’s balance sheet to fund 2027. Their bottom line: the circular AI funding machine “just lost its accelerator.”\n\nSome numbers:\n\n▪️ Nvidia’s 10-Q for the quarter ended Jul 26 showed $530.5B of commitments and guarantees, including $108.5B of guarantees and $36B of agreements to buy back capacity from AI cloud providers.\n\n▪️ The next leg was supposed to be a $500B GPU financing platform that Huang launched in August with Apollo, BlackRock, Blackstone, Brookfield, Goldman and KKR. The aim was to turn AI chips into collateral that lenders could fund, with Nvidia pledging to backstop up to 25% ($125B). Bloomberg reports it hasn’t closed a single deal in three months, partly because lenders want more than 25%, and Broadcom has been offering far more: it backstopped $30B of a $35B Anthropic TPU deal (86%) and $43B of a second $63B deal (about 68%). If Nvidia wouldn’t offer more under Huang, it seems unlikely it will under Kress.\n\n▪️ Existing deals should survive, though. Goldman’s James Schneider expects every announced commitment to be honored. The next round of deals is what gets harder, he says.\n\nThe fallout from an Nvidia pullback in financing:\n\n▪️ UBS’s Tim Arcuri estimates Nvidia generates about $50 - 60B of free cash flow a quarter, much of it recycled back into the AI ecosystem. For scale, the 10-Q IOUs alone already equal roughly 9-11 quarters of that FCF.\n\n▪️ Investment-grade corporate spreads are just 0.89%, near the tightest since at least 2013, while the ICE BofA CCC & Lower spread hit 13.56% on Oct 23, its widest since summer 2020 and above even the 2022 peak. Most of Nvidia’s borrowers sit somewhere between those two extremes, and Nvidia’s guarantee is what turns debt backed by a cash-burning AI lab or a junk-rated neocloud into an investment-grade loan. Take it away and some deals just get more expensive, while others may not get done at all. CoreWeave fell 11% on news of Huang’s exit on the same day it was marketing a $4B+ investment-grade loan where Nvidia is presumably the guarantor.\n\nWe probably won’t learn much from Nvidia’s Q3 earnings call on Tuesday (Nov 17). Kress has been in the job less than a week, and a CFO-turned-interim-CEO with a board search underway has every reason to say “existing commitments will be honored” and nothing more.\n\nThe more useful read will come from the Q3 10-Q, which updates the footnotes behind that $530.5B for the quarter ended in late October. According to the WSJ, that’s the stretch when Nvidia was already pulling back. In late August it paused some of its credit-support deals with cloud providers (guarantees given in exchange for a cut of their revenue) and started requiring executive-team and board sign-off on each one. By October, the WSJ reports, it had begun turning off the tap. If guarantees and cloud buy-back commitments flattened or fell from July’s $108.5B and $36B, the “Bank of Nvidia” was already cutting back even before Huang left.", "tweet_url": "https://x.com/neilsethinew/status/2121928706520387700", "images": ["https://pbs.twimg.com/media/HXIPJRKXMAA2seA.jpg"], "created_at": "2026-11-15T11:30:01.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Value has sharply outperformed Growth across all regions\n\nBut.. value is no longer as cheap, while Growth is no longer as expensive https://t.co/6ZXiru53VN", "tweet_url": "https://x.com/MikeZaccardi/status/2121626963546611744", "images": ["https://pbs.twimg.com/media/HXGIewzXEAAV3Ml.png"], "created_at": "2026-11-14T15:31:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: Although core inflation forecasts (including our own) should already incorporate the delayed passthrough of upstream price changes, consensus forecasts have historically been somewhat conservative in incorporating these shocks. \n\n...Applying the historical response of monthly inflation surprises to realized price increases since the start of the Iran War implies that inflation could surprise consensus expectations to the upside by a cumulative 0.1-0.2pp over the next 9 months (right chart, Exhibit 6), some of which may be realized via an upward surprise from a “January effect” at the start of the year.\n\n...If realized, such surprises could prompt modest further tightening from major central banks in early 2027.", "tweet_url": "https://x.com/neilsethinew/status/2121626712391749911", "images": ["https://pbs.twimg.com/media/HXFwWHuXEAAShwn.png"], "created_at": "2026-11-14T15:30:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: As hyperscaler capex growth slows into 2027, the AI \"picks &amp; shovels\" trade faces a reality check 📉\n\n• IT earnings growth: ~90% (2026) → 45% (2027)\n• Comm Services: 34% → -5%\n• Rising depreciation &amp; interest costs\n\nFading earnings boost from AI capex https://t.co/aRvhQJBTgW", "tweet_url": "https://x.com/MikeZaccardi/status/2121623188001952149", "images": ["https://pbs.twimg.com/media/HXGFDBDWAAAVNvM.png"], "created_at": "2026-11-14T15:16:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: We estimate that higher commodity prices are currently boosting year-over-year core PCE inflation by about 0.5pp, with 90% of the effect driven by higher crude prices and wider refined product spreads (Exhibit 2). \n\nIn our framework, commodity price increases typically complete their passthrough to consumer prices over 6-12 months, which implies that past commodity price increases will continue to boost core inflation by 3bp per month through 2027Q1 and 1-2bp per month in 2027Q2-Q3. \n\nTaken together, we estimate that roughly two-thirds of the cumulative passthrough to core PCE prices is now behind us and that the impact on year-over-year core PCE inflation should peak at 0.6pp in early 2027 before the initial oil price spike drops out of the year-over-year calculation.", "tweet_url": "https://x.com/neilsethinew/status/2121619172635693088", "images": ["https://pbs.twimg.com/media/HXDX4AYWgAAIzsA.png"], "created_at": "2026-11-14T15:00:03.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Earnings growth poised to more than halve across major markets in 2027... SPX from 36% to 11%\n\n'We expect a slowing in nominal GDP growth rates in 2027 as the AI investment boom peaks' https://t.co/7IGhpaRIq0", "tweet_url": "https://x.com/MikeZaccardi/status/2121615638787444914", "images": ["https://pbs.twimg.com/media/HXF-LlCWMAAqts1.png"], "created_at": "2026-11-14T14:46:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS 2027 Equity Outlook 📈 ... 16% SPX return in 27\n\n• Recent AI-driven selloffs have already priced in slower growth\n• Rotations pushed up Defensive &amp; Value valuations\n• Positive equity returns ahead, but with higher volatility\n• Scarcity will put a premium on durable growth https://t.co/KidpZmZXnS", "tweet_url": "https://x.com/MikeZaccardi/status/2121611863850995787", "images": ["https://pbs.twimg.com/media/HXF6v2fXMAAu4jS.jpg"], "created_at": "2026-11-14T14:31:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Global equity valuations have reset across the board, driven largely by a tech de-rating in the US and North Asia. 📉\n\n• US P/E moderated from ~100th percentile to 18.5x\n• Asia &amp; EM trade well below historical averages\n• Overall P/E &amp; PEG ratios sit near 35-year norms (GS) https://t.co/frqRqFSeUU", "tweet_url": "https://x.com/MikeZaccardi/status/2121608088868274571", "images": ["https://pbs.twimg.com/media/HXF3UHUWIAAfNg_.png"], "created_at": "2026-11-14T14:16:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Epic upward EPS revisions in 2026... but will that continue through next year? GS https://t.co/7vgQM9eMed", "tweet_url": "https://x.com/MikeZaccardi/status/2121601042542461228", "images": ["https://pbs.twimg.com/media/HXFw5-EWIAExbKu.png"], "created_at": "2026-11-14T13:48:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Strong breadth... GS: Most equity markets have generated similar returns in the past 12 months\n\nThis reverses the trend that had dominated post financial crisis through to 2025, when the US consistently outperformed other regions https://t.co/0rWd3zrNVm", "tweet_url": "https://x.com/MikeZaccardi/status/2121598438735307120", "images": ["https://pbs.twimg.com/media/HXFuiZDW0AEWh9u.png"], "created_at": "2026-11-14T13:37:39.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: Info Tech was by far the most $ net sold global (and US) sector again this week – US Info Tech long/short ratio now stands at 1.5 (vs. YTD peak of 2.14 seen in early June), the lowest level on our record (since 2016). https://t.co/8dQcIZ3pOG", "tweet_url": "https://x.com/neilsethinew/status/2121596512484679803", "images": ["https://pbs.twimg.com/media/HXDevypWIAAvmxZ.p mg.com/media/HXLrP1LWQAEMhDz.png"], "created_at": "2026-11-15T17:21:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Gas price set to decline further... could drop below 2022 levels later this month. I added to the orange line based on futures. \n\nOriginal chart from JPMAM https://t.co/Utis7FK5Cq", "tweet_url": "https://x.com/MikeZaccardi/status/2122012000427340101", "images": ["https://pbs.twimg.com/media/HXLmq28WgAAOhkR.png"], "created_at": "2026-11-15T17:01:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "We are now in the heart of the holiday shopping season... the 20% of income earners do 38% of the spending JPMAM https://t.co/JlroAxekTZ", "tweet_url": "https://x.com/MikeZaccardi/status/2122006966889259205", "images": ["https://pbs.twimg.com/media/HXLiF4nWEAAPmm4.png"], "created_at": "2026-11-15T16:41:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "As the effective tariff rate declines, you'd think that would help the YoY inflation comp as time goes on...\n\n30.0% on April 8, 2025\n15.9% on Feb 20, 2026\n10.6% on Sept 30, 2026 JPMAM https://t.co/nFjGcEgW9z", "tweet_url": "https://x.com/MikeZaccardi/status/2122001934315917416", "images": ["https://pbs.twimg.com/media/HXLdg6-XQAAl7Ox.jpg"], "created_at": "2026-11-15T16:21:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "As midterm years go, 2026 has been a rather tame one...\n\nSPX +11.54% total return through last week, with just a 9% max drawdown JPMAM https://t.co/6N1BIEtuFP", "tweet_url": "https://x.com/MikeZaccardi/status/2121996901268509136", "images": ["https://pbs.twimg.com/media/HXLY78tXoAAtG3l.jpg"], "created_at": "2026-11-15T16:01:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Only 1 of the 10 largest US companies in 2005 is in today's big 10 JPMAM https://t.co/4AMzi7yNSB", "tweet_url": "https://x.com/MikeZaccardi/status/2121991869244514450", "images": ["https://pbs.twimg.com/media/HXLUXDBWkAAo9r5.jpg"], "created_at": "2026-11-15T15:41:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BofA’s Hartnett (Flow Show) says 2026 is a record year for inflows to global equities ($1.4 trillion annualized), US stocks ($656 billion), investment-grade bonds ($463 billion), tech funds ($222 billion) and Korean stocks ($78 billion). Last week alone though Wednesday, $98.3 billion went into global stock funds, the most since June.\n\nHe says the inflows “remain impressively supportive of stock markets but also show while there are lots of investors emotionally bearish right now, very few are ‘physically’ bearish, i.e. short/underweight.”\n\nOther gauges show the same split:\n▪ Saying: 51.4% of individual investors are bearish in the AAII survey, vs. a 31.5% long-run average.\n▪ Doing: the NAAIM index of active managers’ stock exposure is at 72.9 and hasn’t dipped below 60 all year. At the April 2025 low it hit 35.2.\n▪ Doing: fund managers held just 3.9% in cash in BofA’s October survey, below the 4.0% level that triggers BofA’s contrarian “sell” signal.\n▪ Doing: JPMorgan sees retail buying in equity ETF purchases, which accelerated to $30 billion on Monday from $20 billion last week (via Christophe Barraud’s Friday Brief).", "tweet_url": "https://x.com/neilsethinew/status/2121604061996970302", "images": ["https://pbs.twimg.com/media/HXDgXJeW4AA5H8s.jpg"], "created_at": "2026-11-14T14:00:00.000Z", "relayers": []}]}, {"bank": "BofA", "theme": "Hartnett Flow Show record equity inflows, Tech buybacks, card spending, supercore inflation", "items": [{"author": "neilsethinew", "text": "Even as the hyperscalers dial back buybacks to fund AI spending, BofA’s data shows Tech buybacks shooting higher.\n\n▪️ Tech’s rolling 12-week corporate client buybacks climbed to $5.6B by the end of October from $3.2B at the start of the month, lifting it from 4th place among sectors in September to 2nd.\n▪️ That puts Tech just behind Financials ($7.2B), which had led it by roughly 5x in early September, by our calculations.\n▪️ Overall 4-week average buybacks swung to +84% YoY from -41% in mid-September.\n\nWorth noting: Alphabet and Meta are classified as Communication Services and Amazon as Consumer Discretionary, so most of the hyperscaler pullback wouldn’t show up in BofA’s Tech numbers. Microsoft is the main exception. The surge looks broader-based across Tech.", "tweet_url": "https://x.com/neilsethinew/status/2121989099707846799", "images": ["https://pbs.twimg.com/media/HXIc--SXQAAfAkh.jpg"], "created_at": "2026-11-15T15:30:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BofA’s Hartnett (Flow Show) asks “why save?” and “why short?”\n\nWhy save when US household equity wealth is down about $3 trillion in the past month but still up about $9 trillion this year and $19 trillion since the January 2025 inauguration. He says it’s “hard to get a recession when consumption 70% of GDP & K-shape rich feeling so flush.” The Fed’s own data put households’ stock holdings at $74.0 trillion at the end of June, up $18.8 trillion from the end of 2024.\n\nWhy short when this past week Taiwan announced a $15 billion fund to support its stocks, which are up 50% this year but 13% off their highs, while authorities in Korea and China made more “Price Keeping Operation” moves. That “keeps Asia retail bid for tech.” With global policymakers seeing stock markets as “too big to fail,” he says that’s “why no one short stocks.”", "tweet_url": "https://x.com/neilsethinew/status/2121981556591865869", "images": ["https://pbs.twimg.com/media/HXIcIhYXwAA5RxZ.jpg"], "created_at": "2026-11-15T15:00:02.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Bank of America Institute: total aggregated credit and debit card spending per household rose 5.8% year-over-year (YoY) in October, moderating from 6.2% in September. Spending excluding gasoline also eased to 4.6% YoY in October from 5.1% the prior month.   \n\nDespite the moderation, YoY spending growth remains close to the very strong rates seen since spring of 2026. Moreover, seasonally-adjusted total card spending rose 0.1% month-over-month (MoM), with or without gas, suggesting momentum remains positive (Exhibit 1).", "tweet_url": "https://x.com/neilsethinew/status/2121974001849507931", "images": ["https://pbs.twimg.com/media/HXIeIapXwAAn15d.jpg"], "created_at": "2026-11-15T14:30:01.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Christophe Barraud (@C_Barraud) led his Top 10 Macro/Financial Charts of the Week with ZeroHedge’s “Bank of Nvidia” chart, which links to a detailed piece on the state of the Nvidia investing flywheel now that Jensen Huang is out and CFO Colette Kress is running Nvidia as interim CEO (while keeping the CFO job).\n\nZH’s argument: per the WSJ, Reuters and The Information, Kress was the one executive who kept asking what Nvidia’s guarantees were actually worth and, in at least one case, pushed back on how big they got.\n\nThat one case was the OpenAI Ohio backstop, which she cut from a reported $250B to the $105B that was eventually filed. ZH says that’s probably good for $NVDA shareholders but bad for the long list of AI companies counting on Nvidia’s balance sheet to fund 2027. Their bottom line: the circular AI funding machine “just lost its accelerator.”\n\nSome numbers:\n\n▪️ Nvidia’s 10-Q for the quarter ended Jul 26 showed $530.5B of commitments and guarantees, including $108.5B of guarantees and $36B of agreements to buy back capacity from AI cloud providers.\n\n▪️ The next leg was supposed to be a $500B GPU financing platform that Huang launched in August with Apollo, BlackRock, Blackstone, Brookfield, Goldman and KKR. The aim was to turn AI chips into collateral that lenders could fund, with Nvidia pledging to backstop up to 25% ($125B). Bloomberg reports it hasn’t closed a single deal in three months, partly because lenders want more than 25%, and Broadcom has been offering far more: it backstopped $30B of a $35B Anthropic TPU deal (86%) and $43B of a second $63B deal (about 68%). If Nvidia wouldn’t offer more under Huang, it seems unlikely it will under Kress.\n\n▪️ Existing deals should survive, though. Goldman’s James Schneider expects every announced commitment to be honored. The next round of deals is what gets harder, he says.\n\nThe fallout from an Nvidia pullback in financing:\n\n▪️ UBS’s Tim Arcuri estimates Nvidia generates about $50 - 60B of free cash flow a quarter, much of it recycled back into the AI ecosystem. For scale, the 10-Q IOUs alone already equal roughly 9-11 quarters of that FCF.\n\n▪️ Investment-grade corporate spreads are just 0.89%, near the tightest since at least 2013, while the ICE BofA CCC & Lower spread hit 13.56% on Oct 23, its widest since summer 2020 and above even the 2022 peak. Most of Nvidia’s borrowers sit somewhere between those two extremes, and Nvidia’s guarantee is what turns debt backed by a cash-burning AI lab or a junk-rated neocloud into an investment-grade loan. Take it away and some deals just get more expensive, while others may not get done at all. CoreWeave fell 11% on news of Huang’s exit on the same day it was marketing a $4B+ investment-grade loan where Nvidia is presumably the guarantor.\n\nWe probably won’t learn much from Nvidia’s Q3 earnings call on Tuesday (Nov 17). Kress has been in the job less than a week, and a CFO-turned-interim-CEO with a board search underway has every reason to say “existing commitments will be honored” and nothing more.\n\nThe more useful read will come from the Q3 10-Q, which updates the footnotes behind that $530.5B for the quarter ended in late October. According to the WSJ, that’s the stretch when Nvidia was already pulling back. In late August it paused some of its credit-support deals with cloud providers (guarantees given in exchange for a cut of their revenue) and started requiring executive-team and board sign-off on each one. By October, the WSJ reports, it had begun turning off the tap. If guarantees and cloud buy-back commitments flattened or fell from July’s $108.5B and $36B, the “Bank of Nvidia” was already cutting back even before Huang left.", "tweet_url": "https://x.com/neilsethinew/status/2121928706520387700", "images": ["https://pbs.twimg.com/media/HXIPJRKXMAA2seA.jpg"], "created_at": "2026-11-15T11:30:01.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BofA: The October hold is increasingly looking like a mistake.\n\n▪ Supercore (core services excluding rent and owners’ equivalent rent) is running at a 5.45% annualized pace over three months, up from 1.01% in July and the fastest since April 2024, by our calculation.\n▪ Core services are running at a 4.22% three-month annualized pace, the fastest since November 2024, and core CPI overall at 3.75%, the fastest since April 2024.\n▪ Core goods are running at 2.09% annualized, down from September’s 2.24%, which was the fastest since September 2025 due to the 1.22% drop in used cars in October, but core goods excluding used cars rose 0.39%.", "tweet_url": "https://x.com/neilsethinew/status/2121611613442588841", "images": ["https://pbs.twimg.com/media/HXDfqN8XYAAbNDb.jpg"], "created_at": "2026-11-14T14:30:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Global equity valuations have reset across the board, driven largely by a tech de-rating in the US and North Asia. 📉\n\n• US P/E moderated from ~100th percentile to 18.5x\n• Asia &amp; EM trade well below historical averages\n• Overall P/E &amp; PEG ratios sit near 35-year norms (GS) https://t.co/frqRqFSeUU", "tweet_url": "https://x.com/MikeZaccardi/status/2121608088868274571", "images": ["https://pbs.twimg.com/media/HXF3UHUWIAAfNg_.png"], "created_at": "2026-11-14T14:16:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BofA’s Hartnett (Flow Show) says 2026 is a record year for inflows to global equities ($1.4 trillion annualized), US stocks ($656 billion), investment-grade bonds ($463 billion), tech funds ($222 billion) and Korean stocks ($78 billion). Last week alone though Wednesday, $98.3 billion went into global stock funds, the most since June.\n\nHe says the inflows “remain impressively supportive of stock markets but also show while there are lots of investors emotionally bearish right now, very few are ‘physically’ bearish, i.e. short/underweight.”\n\nOther gauges show the same split:\n▪ Saying: 51.4% of individual investors are bearish in the AAII survey, vs. a 31.5% long-run average.\n▪ Doing: the NAAIM index of active managers’ stock exposure is at 72.9 and hasn’t dipped below 60 all year. At the April 2025 low it hit 35.2.\n▪ Doing: fund managers held just 3.9% in cash in BofA’s October survey, below the 4.0% level that triggers BofA’s contrarian “sell” signal.\n▪ Doing: JPMorgan sees retail buying in equity ETF purchases, which accelerated to $30 billion on Monday from $20 billion last week (via Christophe Barraud’s Friday Brief).", "tweet_url": "https://x.com/neilsethinew/status/2121604061996970302", "images": ["https://pbs.twimg.com/media/HXDgXJeW4AA5H8s.jpg"], "created_at": "2026-11-14T14:00:00.000Z", "relayers": []}]}, {"bank": "Yardeni", "theme": "Consumer Staples P/E highest since 1999; Nvidia leadership change", "items": [{"author": "neilsethinew", "text": "Yardeni: Charlie Munger famously warned that there are three ways smart men can go broke: \"Liquor, ladies, and leverage.\" NVIDIA co-founder and now former CEO Jensen Huang has run into trouble with the second of Munger's three L's. He won't go broke, but he is out of a good job.\n\nHuang's departure rattled the AI trade, with NVIDIA shares plunging 4.3%, sending its forward P/E to 11.7 (charts). We promised you buying opportunities after the midterm elections. There were a bunch last Thursday and a few more [this week].\n\nOur base case is that NVIDIA's financing strategy remains intact. Colette Kress, NVIDIA's longtime CFO and newly appointed interim CEO, has worked closely with Huang since 2013 and helped oversee the company's strategic investments and financing arrangements. During NVIDIA's August 26 earnings call, she defended these investments against accusations of circular financing, stating, \"We recognize the scale of this support, and we know some will call it circular financing. We see it differently.\" She argued that these investments would generate attractive returns while strengthening NVIDIA's AI ecosystem, suggesting continuity under her leadership. We don't expect political constraints to meaningfully increase as a result of the controversy. Nor do we expect another trade conflict with China to erupt.\n\nEven if some of the constraints intensify, they would likely turn existing speed bumps into bigger speed bumps rather than roadblocks to the AI investment boom. AI remains the latest evolution in the Digital Revolution that began with IBM's mainframes, and we expect the investment boom to continue without Huang (chart). We therefore view any resulting selloff as another buying opportunity for the AI trade.", "tweet_url": "https://x.com/neilsethinew/status/2121966451145748643", "images": ["https://pbs.twimg.com/media/HXIVKS_XIAA5gb1.png"], "created_at": "2026-11-15T14:00:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Here's that long-term Consumer Staples P/E ratio... highest since 1999 (above 24x as of Friday's close) @yardeni https://t.co/BClBDJNZGY", "tweet_url": "https://x.com/MikeZaccardi/status/2121710012091265525", "images": ["https://pbs.twimg.com/media/HXHUAv9XoAA6hwT.jpg"], "created_at": "2026-11-14T21:01:01.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Consumer Staples P/E has soared to 24.2x... that's the highest since 1999 @yardeni https://t.co/pO6hueSJgX", "tweet_url": "https://x.com/MikeZaccardi/status/2121619414655062094", "images": ["https://pbs.twimg.com/media/HXGBnTeXEAAoifW.png"], "created_at": "2026-11-14T15:01:00.000Z", "relayers": []}]}, {"bank": "Apollo/Slok", "theme": "AI-driven business formation and star // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
