<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Institutional Research</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #7c3aed;          /* purple — institutional report accent */
  --accent-soft: #f3eefc;
  --divergence: #d94052;      /* divergence red */
  --consensus: #15803d;       /* consensus green */
  --yellow: #fff5b3;

  /* category colors (institutional schema: rates, growth, fx, equities,
     credit, crypto, energy, commodities, geopolitics, ai_tech, em) */
  --cat-rates: #2563eb;
  --cat-growth: #d97706;
  --cat-fx: #0891b2;
  --cat-equities: #15803d;
  --cat-credit: #be185d;
  --cat-crypto: #8b5cf6;
  --cat-energy: #dc2626;
  --cat-commodities: #ea580c;
  --cat-geopolitics: #b91c1c;
  --cat-ai_tech: #4f46e5;
  --cat-em: #059669;
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 980px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 12px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* STATS BAR (top: period + coverage) */
.stats-top { margin-bottom: 16px; padding: 8px 12px; background: var(--surface);
             border: 1px solid var(--border); border-radius: 6px;
             font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
             color: var(--text-2); display: flex; gap: 16px; flex-wrap: wrap; }
.stats-top strong { color: var(--text); font-weight: 600; }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 10px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* THEME CARD (Section A) */
.theme { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.theme:last-child { border-bottom: none; }
.theme-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
              flex-wrap: wrap; }
.theme-title { font-weight: 600; font-size: 14.5px; }
.theme-stance { display: grid; grid-template-columns: 1fr; gap: 6px; margin-bottom: 10px; }
@media (min-width: 720px) { .theme-stance { grid-template-columns: 1fr 1fr; } }
.theme-line { font-size: 13px; padding: 8px 10px; border-radius: 4px;
              border-left: 3px solid var(--border); background: #fafafa; line-height: 1.5; }
.theme-line.consensus { border-left-color: var(--consensus); background: #f0f9f3; }
.theme-line.divergence { border-left-color: var(--divergence); background: #fdf6f7; }
.theme-line .lbl { font-family: 'IBM Plex Mono', monospace; font-size: 10px;
                   text-transform: uppercase; letter-spacing: .06em;
                   color: var(--text-3); display: block; margin-bottom: 2px; }
.theme-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
               border-left: 2px solid var(--border-light); }
.theme-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-source { font-weight: 600; color: var(--accent); }
a.item-source { text-decoration: none; }
a.item-source:hover { text-decoration: underline; }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-title { font-weight: 600; font-size: 14px; margin: 4px 0 6px; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DEEP READS (Section C) — purple left border to mark flagship long-form */
.section-deepreads .item-card { border-left: 4px solid var(--accent); background: var(--accent-soft); }

/* HOUSE VIEWS — compact one-line-per-source list */
.hv-row { display: flex; gap: 10px; align-items: baseline;
          padding: 6px 16px; border-bottom: 1px solid var(--border-light);
          font-size: 13px; }
.hv-row:last-child { border-bottom: none; }
.hv-name { font-weight: 600; color: var(--accent); min-width: 180px;
           text-decoration: none; }
.hv-name:hover { text-decoration: underline; }
.hv-stance { color: var(--text); flex: 1; }

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 110px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .hv-row { flex-direction: column; gap: 2px; }
  .hv-name { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "INSTITUTIONAL RESEARCH", "collected_at": "2026-08-09T06:59:05.000Z", "period": {"lookback_days": 10, "from": "2026-07-30", "to": "2026-08-08"}, "input_stats": {"total_articles": 394, "sources_present": 56, "after_filter": 185}, "summary": "**Rates / Fed:** Every major central bank held in late July (Fed **9-3** with three hawkish dissents under new Chair **Kevin Warsh**; BoE at **3.75%**; BoJ **8-1**), but September splits the street four ways: **JPMorgan** and **Capital Economics** call a **25bp hike** 'more likely than not,' **WisdomTree** warns the bond market could force Warsh's hand, while **Goldman Sachs'** Ashok Varadhan explicitly expects **no hike** ('counter-consensus'), **UBS** calls the ~34bp priced by markets 'too aggressive,' and **Amundi** is most dovish (hold to **Q2 2027**). The July payrolls miss (**-23k** vs **+80k** expected) cut hike odds from ~60% toward 40-45% within days.\n\n**Oil / Iran:** Consensus (**Standard Chartered**, **Wood Mackenzie**) sees the Hormuz conflict as contained, rangebound **$70-90/bbl**. Sharpest split: **RBC's** Helima Croft is explicitly more skeptical than peers, warning depleted inventory buffers mean 'we are reaching the limits of the safeguards in the system,' while **Goldman's** Ashok Varadhan expects oil 'well below **$70**, maybe even lower' — nearly opposite reads on the same conflict.\n\n**Gold / Dollar:** Broad bullishness on gold (**UBS** targets **$5,000/oz** by H1 2027) sits alongside a deeper structural debate: **Gavekal** argues the dollar's reserve-currency monopoly is fragmenting (bullish gold, 'very bullish' Hong Kong, bearish long bonds), while **BCA's** Arthur Budaghyan agrees the dollar turns structurally pro-cyclical and weaker — but breaks from consensus by explicitly forecasting **EM equities will NOT rally** despite that weakness. **PIMCO's** credit desk separately finds no evidence of a 'Sell America' trade in corporate bond flows.\n\n**US Equities / AI:** Record earnings beats (80-85% beat rates) support broad constructiveness (**Standard Chartered**, **UBS**, **Barclays**), but **Citi GPS** flags the S&P 500's AI 'Growth cluster' at **55%** of the index as a structural risk, and **Bridgewater's** Karen Karniol-Tambour warns investors are 'overweight US equities and underweight real assets' with AI still in its 'buildout,' not 'adoption,' phase. **Goldman** is bullish and cautious on the same market at once, raising its TOPIX target to **4,500** while calling Japan positioning 'vulnerable to a major correction.'\n\n**Credit:** **KKR** argues tight HY spreads (96th percentile) are misleading once adjusted for record-low duration (74th percentile) — a bullish quality read. **PIMCO** is split internally: its Income Fund cut corporate credit to a near all-time low citing GFC-era-style securitization risk, while its own multi-sector desk calls ~7% yields an attractive entry. **Goldman's** credit strategists warn ~**$500bn** of AI debt issued YTD could outstrip IG-market capacity even as GoldenTree's Steven Tananbaum says he is 'not concerned about access to capital.'\n\n**Crypto:** **Galaxy Digital** targets Bitcoin at **$250,000** by year-end 2027 and cut CLARITY Act odds to **30%**; **CoinShares**, citing Polymarket, pegs the same odds at just **14%** and expects Bitcoin range-bound toward **$80,000** rather than breaking out — a real regulatory-odds and price-path gap between the two leading crypto-research houses in the same week.\n\n**China / Trade:** **Peterson Institute** finds US consumers bear roughly **90%** of the tariff burden and that tariffs have rerouted, not reduced, Chinese-origin value-added in US imports. **BNP Paribas** stays explicitly Negative on China equities pending 'concrete stimulus,' while **Amundi** notes Beijing is already signaling more proactive support — a live disagreement on how much credit incremental Chinese easing deserves.", "sections": {"A_debates": [{"theme": "Rates & Central Banks", "category": ["rates"], "consensus": "Every major central bank held its policy rate in late July: the Fed at 3.50-3.75% (a 9-3 vote under new Chair Kevin Warsh, with Logan, Hammack and Kashkari dissenting for a hike -- the most FOMC dissents in a decade), the BoE at 3.75%, and the BoJ at 1% (8-1). Franklin Templeton/Western Asset, UBS and Standard Chartered all frame a 2026 hold as the base case, with UBS explicitly calling the roughly 34bp of tightening priced by markets 'too aggressive' and Standard Chartered expecting the Fed to hold through 2026 before cutting in H1 2027.", "divergence": "The September decision splits the street four ways. JPMorgan flipped to explicitly call a 25bp hike, arguing July's hold 'lowered the bar'; Capital Economics calls a hike 'more likely than not' on sticky inflation and strong demand; and WisdomTree warns the bond-market selloff (10-year near 4.80%, 30-year above 5.25%, its highest since 2007) could effectively force Warsh's hand absent clearer disinflation. Against that, Goldman Sachs' Ashok Varadhan explicitly says he does not expect a hike and calls his own view 'counter-consensus'; UBS, PIMCO and Amundi all keep a hold-or-cut base case, with Amundi the most dovish of all (hold until Q2 2027, calling Warsh's hawkishness 'stronger in rhetoric than in action') and PIMCO leaning toward yields ending lower than the market expects. Delphi Digital says outright it would 'fade' the hike narrative. KKR sits in between: its fair-value model implies 75-100bp of eventual hikes but keeps a 'long hold' near-term baseline. The July payrolls miss (-23k vs. +80k expected, prior months revised down a combined -103k) cut September hike odds from the high-50s/60% range toward roughly 40-45% within days, per CoinShares -- a reminder of how fast this narrative is moving.", "items": [{"source": "jpmorgan", "name": "JPMorgan", "thesis": "Now expects a 25bp Fed hike at the September FOMC, reversing a prior hold-bias; frames July's hold as having 'lowered the bar' for a subsequent hike.", "url": "https://www.jpmorgan.com/insights/markets-and-economy/economy/september-2026-rate-hike-now-expected-amid-energy-shocks", "images": []}, {"source": "capital_economics", "name": "Capital Economics", "thesis": "Argues Chair Warsh's 'play the ball, not the referee' framing of rising yields is misplaced since the Fed sets short rates itself; despite critiquing his communication, house call is a September hike is 'more likely than not.'", "url": "https://www.capitaleconomics.com/blog/warsh-shows-why-quality-trumps-quantity-central-bank-communications", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Co-head of Global Banking & Markets Ashok Varadhan explicitly does not expect a Fed hike in H2 2026, calling the view 'a little bit counter-consensus' versus market pricing.", "url": "https://www.goldmansachs.com/insights/the-markets/why-us-stocks-may-grind-higher", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "Base case is the Fed holds through year-end; explicitly argues the ~34bp of tightening priced by markets is 'too aggressive.'", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-07082026.html", "images": []}, {"source": "amundi", "name": "Amundi", "thesis": "Most dovish house view reviewed: expects the Fed on hold until Q2 2027 before resuming cuts; Warsh's hawkishness is 'stronger in rhetoric than in action.'", "url": "https://research-center.amundi.com/article/fed-hold-markets-action", "images": []}, {"source": "wisdomtree", "name": "WisdomTree", "thesis": "Warns the post-FOMC selloff (10yr near 4.80%, 20/30yr both above 5.25%) could force Warsh into a September 16 hike absent clearer cooling in jobs/CPI data before then.", "url": "https://www.wisdomtree.com/us/insights/blog/is-the-bond-market-putting-warsh-in-a-corner", "images": []}, {"source": "delphi_digital", "name": "Delphi Digital", "thesis": "Stays 'risk-on' on improving leading growth/inflation indicators and explicitly says it 'would fade' the consensus expectation that Warsh gets pressured into a September hike.", "url": "https://members.delphidigital.io/feed/leading-indicators-improved-in-august-still-risk-on", "images": []}, {"source": "kkr", "name": "KKR", "thesis": "Fed-funds fair-value model now points to the low-to-mid 4% range for late 2026/early 2027 (implying 75-100bp of hikes), yet keeps a 'long hold' near-term baseline.", "url": "https://www.kkr.com/insights/flash-macro-fomc-update-july-2026", "images": []}]}, {"theme": "Oil, Iran Conflict & Energy Markets", "category": ["energy", "geopolitics", "commodities"], "consensus": "Most houses treat the Iran/Strait-of-Hormuz conflict as contained rather than escalating: Standard Chartered's rangebound $70-90/bbl call rests on a reported Oman-brokered deal to reopen Hormuz shipping, and Wood Mackenzie's mid-year metals review cut its aluminium deficit forecast from an initial 2.5-3 million tonnes to about 900,000 tonnes, calling the conflict's economic damage 'more contained than expected.'", "divergence": "RBC's chief commodities strategist Helima Croft is explicitly 'more skeptical than other analysts' of a quick resolution, warning of market 'optimism bias': Middle East crude fetched roughly $175/bbl in Asia in March versus ~$120 on Brent paper markets, over 100 million barrels left the Strait after a mid-June US-brokered MoU (buying only about a month of extra cover), and with Cushing SPR near multi-decade lows, 'we are reaching the limits of the safeguards in the system.' Goldman Sachs' Ashok Varadhan takes the opposite, more bearish view, expecting oil to 'settle back down well below $70 a barrel, maybe even lower' by year-end. Price action itself has whipsawed within days -- UBS logged Brent falling 5.3% below $80 on Hormuz-reopening hopes, then rising 3.8% back above $83 on renewed Hormuz concerns -- and OPEC+ is only gradually unwinding voluntary cuts (+188kb/d for September), not moving decisively toward either scarcity or oversupply.", "items": [{"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Oil expected to stay rangebound $70-90/bbl even after briefly topping $90 on Middle East escalation; reports of an Oman-Iran deal to reopen Hormuz shipping reinforce the view and support gold as a 'core allocation.'", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-7-8-2026/?mvog=1", "images": []}, {"source": "rbc", "name": "RBC Capital Markets", "thesis": "Chief global commodities strategist Helima Croft says she has been 'more skeptical than other analysts' the Iran war would end quickly; flags a large physical/paper price disconnect and near-exhausted inventory buffers as upside price risks the market is underpricing.", "url": "https://www.rbccm.com/en/insights/2026/08/there-is-a-new-focus-on-resilience", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Ashok Varadhan expects oil to settle 'well below $70 a barrel, maybe even lower' later in the year, making him 'very constructive on front-end yields.'", "url": "https://www.goldmansachs.com/insights/the-markets/why-us-stocks-may-grind-higher", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "thesis": "Cut its aluminium supply-deficit forecast to ~900,000 tonnes (from an initial 2.5-3 million tonnes) after the Middle East conflict; copper still expected to move into surplus in 2026 with tariff-related US inflows supporting prices.", "url": "https://www.woodmac.com/press-releases/metals-sector-weathers-middle-east-shock-as-aluminium-deficit-cut-to-1-million-tonnes-but-copper-surplus-signals-fragile-stability/", "images": []}, {"source": "opec", "name": "OPEC", "thesis": "Seven participating OPEC+ countries agreed a further 188 thousand b/d production increase for September 2026, continuing a gradual unwind of voluntary cuts while reaffirming compensation for overproduction since January 2024.", "url": "https://www.opec.org/pr-detail/1854611-2-august-2026.html", "images": []}, {"source": "invesco", "name": "Invesco", "thesis": "SteelPath team argues midstream energy infrastructure is structurally de-linked from oil price (~75% of midstream market cap derives fees from natural gas); estimates close to 1 billion barrels of global oil reserves drawn down since the Hormuz conflict began.", "url": "https://www.invesco.com/us/en/insights/what-lng-data-centers-and-power-demand-mean-for-midstream-ener.html", "images": []}]}, {"theme": "US Dollar, Gold & Reserve-Currency Structure", "category": ["fx", "commodities"], "consensus": "Gold is broadly favored across the street -- UBS, Standard Chartered, Schroders and Gavekal are all constructively positioned -- on continued central-bank buying (UBS cites 289 tonnes bought in Q2 alone, with 750-1,000 tonnes expected for the full year).", "divergence": "Houses disagree sharply on how far to press gold and dollar-decline convictions. UBS is most aggressively bullish, targeting $5,000/oz by H1 2027 on a Fed hold-then-ease path and dollar softness; Standard Chartered, despite keeping a bullish $4,600/oz 12-month target, actually downgraded gold to a reduced 'Core' portfolio weight, arguing elevated real yields cap the pace of near-term gains. Gavekal goes furthest structurally, arguing the dollar's post-1971 reserve-currency monopoly is fragmenting -- the renminbi capturing goods-trade settlement, gold reclaiming the store-of-value role (~1,000 tons/year of central-bank buying since 2022) -- and is 'very bullish' Hong Kong assets as the settlement 'sluice' between the dollar, renminbi and gold systems, while turning structurally bearish long-dated Treasuries. BCA's Arthur Budaghyan agrees the dollar faces structural decline (turning pro-cyclical as balance-of-payments flows replace rate differentials as the key FX driver) but breaks from the standard playbook by explicitly forecasting EM equities will NOT rally despite that weakness. PIMCO's credit desk pushes back on the 'Sell America' narrative entirely, finding foreign net purchases of US corporate bonds at a record pace (+32% y/y through May) even as Japanese investors have specifically turned net sellers of long-dated Treasuries now that currency-hedged JGB yields compete favorably.", "items": [{"source": "ubs", "name": "UBS", "thesis": "Gold above $4,250/oz, forecast to reach $5,000/oz in H1 2027 on Fed hold-then-ease, dollar softness and central-bank buying; recommends a mid-single-digit portfolio allocation.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-06082026.html", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Reduced gold to a 'Core' (lower) portfolio weight even while keeping a bullish $4,600/oz 12-month target, expecting only a shallow rebound given elevated real yields.", "url": "https://www.sc.com/sg/market-outlook/global-market-outlook-31-7-2026/?mvog=1&source=podcast", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Argues the dollar's reserve-currency monopoly is fragmenting across three functions (medium of exchange, store of value, unit of account); structurally bearish long-dated Treasuries and the dollar's store-of-value role, bullish gold, 'very bullish' Hong Kong assets.", "url": "https://research.gavekal.com/article/a-shifting-global-currency-landscape/", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "Structural regime-shift call: the dollar becomes pro-cyclical and depreciates as the FX driver shifts from rate differentials to balance-of-payments flows -- but explicitly forecasts EM equities will NOT rally despite USD weakness.", "url": "https://www.bcaresearch.com/marketing/webcasts/get-out-of-the-dollar-g-o-d/222826", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "Finds little evidence of a 'Sell America' trade: cumulative net foreign purchases of US corporate bonds hit $216bn through May 2026 (32% above any comparable year to date since the GFC), though Japanese investors have turned net sellers of long-dated Treasuries.", "url": "https://www.pimco.com/us/en/insights/the-credit-market-lens-still-buying-america", "images": []}]}, {"theme": "US Equities, AI Capex & Positioning", "category": ["equities", "ai_tech"], "consensus": "Earnings have been exceptionally strong -- BNP counts S&P 500 Q2 profits up 26-30% y/y with beats well above typical 3-4% margins, and UBS/Standard Chartered both cite roughly 80-85% beat rates versus 67-73% historical norms -- and most houses (UBS, Standard Chartered, Franklin Templeton, Barclays) remain constructive on US equities into year-end.", "divergence": "The split is over how much strength is already priced and how concentrated the risk has become. Citi GPS flags the S&P 500's AI-driven 'Growth cluster' at 55% of the index (from under 20% three decades ago), structurally raising index volatility, and recommends diversifying into small/mid-caps; Schroders is similarly cautious, citing valuations near the top of their 20-year range and stagflation risk, recommending diversification away from the 'Magnificent Seven' into defensive hedges (healthcare, staples, energy, gold). Bridgewater's Karen Karniol-Tambour goes further, warning 'most investors are overweight US equities and underweight real assets' and arguing the AI trade still reflects the 'buildout' phase, not the 'adoption' phase markets will eventually have to price. Against that caution, Barclays' Venu Krishna has repeatedly raised an above-consensus S&P 500 target after being pilloried for an initial bullish call made mid-selloff, and Franklin Templeton's year-end S&P 500 target of 7400-7800 rests on 15%+ EPS growth. Goldman Sachs is bullish and cautious on the same market at once in Japan: it raised its 12-month TOPIX target to 4,500 on earnings/AI/governance strength while warning current investor positioning (foreign holdings +20% vs. 2024, hedge funds in the 98th-99th percentile of Japan exposure) looks 'more vulnerable to a major correction' than before 2024's 24% drawdown.", "items": [{"source": "citi_gps", "name": "Citi GPS", "thesis": "S&P 500's AI-influenced 'Growth cluster' has grown to 55% of the index, structurally raising volatility/AI-sensitivity; recommends small/mid-caps for less concentrated macro exposure.", "url": "https://www.citigroup.com/global/insights/markets-edition-ais-subtle-impact-on-the-equity-market", "images": []}, {"source": "schroders", "name": "Schroders", "thesis": "Flags valuations near the top of their 20-year range and stagflation risk; recommends diversifying beyond the Magnificent Seven toward quality/value and defensive hedges (healthcare, staples, energy, gold).", "url": "https://www.schroders.com/en/global/individual/insights/a-mid-year-review-of-the-equity-market/", "images": []}, {"source": "bridgewater", "name": "Bridgewater Associates", "thesis": "Karen Karniol-Tambour warns most investors are overweight US equities/underweight real assets; the AI capex boom still reflects the 'buildout' phase of the trade, not the subsequent 'adoption' phase.", "url": "https://www.bridgewater.com/research-and-insights/karen-karniol-tambour-on-investing-in-a-more-fragmented-world", "images": []}, {"source": "barclays", "name": "Barclays", "thesis": "Venu Krishna has repeatedly raised his S&P 500 target (earnings growth 'well above 20%') after an initial contrarian bullish call mid-selloff drew significant pushback.", "url": "https://www.ib.barclays/content/barclaysmicrosites/ibpublic/en/our-insights/barclays-brief/us-equities-beyond-the-pullback.html", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Raised its 12-month TOPIX target to 4,500 (from 4,400) on earnings/AI/governance grounds, while separately warning Japan investor positioning (foreign holdings +20% vs. 2024; hedge funds in the 98th-99th percentile of exposure) looks vulnerable to a sharp correction.", "url": "https://www.goldmansachs.com/insights/articles/are-japanese-stocks-at-risk-of-falling-as-the-yen-surges", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "thesis": "Year-end S&P 500 target range of 7400-7800 built on 15%+ y/y EPS growth (2026 consensus EPS $353.93, +20% y/y); US 2026 GDP forecast of 2.5% versus the Fed's 2.2% and Street consensus of ~2%.", "url": "https://www.franklintempleton.com/articles/series/from-the-market-desk", "images": []}]}, {"theme": "Credit Markets & AI Financing", "category": ["credit", "ai_tech"], "consensus": "Credit fundamentals are widely described as resilient -- KKR documents US high yield reaching a record ~57% BB-rated composition and first-lien secured bonds at an all-time-high 33% of the market -- even as headline spreads sit near multi-year tights.", "divergence": "The disagreement is over whether tight spreads mean credit is overpriced. KKR argues the tight-spread read is misleading once adjusted for near-record-low duration (~3 years): spread-per-unit-of-duration sits only at the 74th percentile since the GFC, not the headline 96th, an implicitly bullish quality-driven read. PIMCO is split within itself: Group CIO Dan Ivascyn has cut the Income Fund's corporate-credit exposure to near an all-time low and warns of a 'more defensive mindset [not seen] since the global financial crisis' given aggressive securitization-based financial engineering, while PIMCO's own multi-sector credit desk (Sonali Pier) frames current ~7% multi-sector yields as an attractive entry point without sacrificing quality. The AI-financing question splits Goldman Sachs internally too: its credit strategists flag that ~$500bn of AI-related debt issued YTD 2026 (hyperscalers only ~40% of that) risks outstripping what the investment-grade market can absorb without breaching concentration limits, while GoldenTree's Steven Tananbaum, in a GS-hosted interview, says he is 'not concerned about access to capital' for the AI buildout -- a debate about pricing, not availability. Apollo frames the AI financing gap as now 'a market-capacity problem' for public markets, arguing private investment-grade credit will be essential to closing it.", "items": [{"source": "kkr", "name": "KKR", "thesis": "US HY at a record ~57% BB-rated; spread-per-unit-of-duration only at the 74th percentile since the GFC despite headline spreads at the 96th -- an implicitly bullish, quality-improving read.", "url": "https://www.kkr.com/insights/high-yield-second-act", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "Group CIO Dan Ivascyn has cut Income Fund corporate-credit exposure to near an all-time low, citing a 'more defensive mindset for the first time since the global financial crisis' amid aggressive securitization-based financial engineering.", "url": "https://www.pimco.com/us/en/insights/income-fund-update-where-income-meets-resilience", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "Portfolio manager Sonali Pier says multi-sector credit portfolios yield near 7% without needing to sacrifice liquidity or quality; favors moving up in quality and diversifying globally.", "url": "https://www.pimco.com/us/en/resources/video-library/media/finding-relative-value-in-todays-credit-markets", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Credit strategists estimate ~$500bn of AI-related debt issued YTD 2026 (hyperscalers only ~40% of that); flags a gap between how much hyperscalers can issue while staying investment-grade and how much the IG market can absorb.", "url": "https://www.goldmansachs.com/insights/goldman-sachs-exchanges/how-ai-debt-is-reshaping-the-credit-market", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "GoldenTree CIO Steven Tananbaum (in a GS interview) says he is not concerned about access to capital for the AI buildout, framing the debate as about pricing of risk rather than availability of financing.", "url": "https://www.goldmansachs.com/insights/goldman-sachs-exchanges/goldentrees-steven-tananbaum-the-evolution-of-credit-investing", "images": []}, {"source": "apollo_slok", "name": "Apollo / Torsten Slok", "thesis": "Argues financing the AI buildout has become 'a market-capacity problem' for public markets; private investment-grade credit will be essential to closing the AI funding gap.", "url": "https://www.apolloacademy.com/2026-midyear-credit-outlook-adoption-financing-and-investing-in-the-age-of-ai/?partnerref=homepagecarousel", "images": []}]}, {"theme": "Crypto & Digital Assets", "category": ["crypto"], "consensus": "Both major crypto research houses agree institutional infrastructure adoption is accelerating structurally -- CoinShares' 'Hybrid Finance' data shows RWA deposits across DeFi more than tripling year-over-year to $7.4bn even as total DeFi deposits fell ~15%, and Galaxy's Q4 2025 leverage report found CeFi lending books (Coinbase, Tether) absorbed the largest-ever crypto liquidation event in October 2025 with zero contagion, unlike 2022's opaque blowups.", "divergence": "The two houses diverge sharply on near-term price and regulatory odds. Galaxy's flagship 2026 outlook targets Bitcoin at $250,000 by year-end 2027 and has cut its odds of CLARITY Act passage in 2026 to 30% (from a coin-flip in June); CoinShares, citing Polymarket, pegs CLARITY odds even lower at just 14% the same week, and expects Bitcoin to stay range-bound toward $80,000 over the next 2-3 months rather than break out, arguing a durable move to $100,000 needs clearer labor-market deterioration and Fed dovishness neither currently sees as imminent. The two houses' own equity baskets even moved in opposite directions the same week -- Galaxy frames Bitcoin as decoupling positively from AI-equity turbulence (BTC +7% in July, its second-best month) while CoinShares' own Blockchain Equities Index actually underperformed Bitcoin (-0.8% vs. BTC +4.1% for the week of August 7) -- underscoring that 'crypto' and 'crypto-adjacent equities' are not currently moving together.", "items": [{"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "Flagship 2026 outlook: Bitcoin to $250k by year-end 2027; cut CLARITY Act 2026 passage odds to 30% (from a coin-flip in June) without denting its bitcoin conviction.", "url": "https://www.galaxy.com/insights/research/predictions-2026-crypto-bitcoin-defi", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "James Butterfill argues Bitcoin's cycle lows are 'probably now behind us' but expects range-bound trading toward $80,000 over 2-3 months; pegs CLARITY Act 2026 odds at just 14% (Polymarket).", "url": "https://coinshares.com/insights/research-data/market-update-07-08-2026/", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "RWA deposits across DeFi lending/trading more than tripled YoY to $7.4bn even as total DeFi deposits fell ~15%; RWA spot DEX volume rose ~220% YoY -- validating tokenization as structural, not cyclical.", "url": "https://coinshares.com/insights/research-data/token-terminal-hybrid-finance-q2-report/", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "CeFi lending books (Coinbase, Tether) absorbed the largest-ever crypto liquidation event (Oct 2025) with zero realized contagion, a stark contrast to 2022's opaque-lending blowups (Genesis, BlockFi, Celsius).", "url": "https://www.galaxy.com/insights/research/state-of-crypto-leverage-q4-2025", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "CEO Jean-Marie Mognetti argues crypto-native venues without a durable moat are being wound down as institutions absorb blockchain infrastructure (JPMorgan Kinexys >$4tn processed; BlackRock's tokenized Treasury fund >$2.5bn AUM).", "url": "https://coinshares.com/insights/the-node/jean-marie-mognetti-output-31-07-26/", "images": []}]}, {"theme": "China, Trade & Decoupling", "category": ["em", "geopolitics", "growth"], "consensus": "Across independent research (Peterson Institute) and market houses (Gavekal, Franklin Templeton), there is broad agreement that US tariffs have rerouted rather than reduced US dependence on Chinese-origin goods: PIIE finds China's share of US imports fell 7 percentage points from 2017-2024 but China's value-added share of those imports fell only 2 percentage points, with Taiwan, Vietnam and Mexico the main beneficiaries of rerouting.", "divergence": "Houses disagree on who bears the tariff cost and on China's own trajectory. PIIE's Clausing and Obstfeld cite multiple 2026 studies putting the US share of the tariff burden at roughly 90%, directly rejecting the Miran/Bessent 'optimal tariff' framing used to justify the policy, and note tariff revenue turned negative in June 2026 for the first time as court-ordered refunds exceeded collections. On China's domestic economy, Franklin Templeton's China consumer analyst found pockets of resilience even as Q2 GDP growth slowed to 4.3%, the weakest since Q4 2022; Peterson Institute separately documents China's property bust -- not industrial subsidies -- as the primary driver of its current-account surplus rising from 0.7% to 3.7% of GDP since 2019, arguing a bigger fiscal (not tariff) response is the right fix. BNP Paribas remains explicitly Negative on China equities pending 'concrete stimulus,' while Amundi notes Beijing is already signaling more proactive (if not major) countercyclical support -- a live disagreement on how much credit to give incremental Chinese easing.", "items": [{"source": "peterson_institute", "name": "Peterson Institute for International Economics", "thesis": "Multiple 2026 studies put the US share of the tariff burden at roughly 90%; tariff revenue turned negative in June 2026 as court-ordered refunds exceeded new collections, undercutting the 'optimal tariff' theory used to justify the policy.", "url": "https://www.piie.com/blogs/realtime-economics/2026/who-pays-tariffs-insights-recent-research", "images": []}, {"source": "peterson_institute", "name": "Peterson Institute for International Economics", "thesis": "China's share of bilateral US imports fell 7pp (2017-24) but China's value-added share of US imports fell only 2pp, showing supply-chain rerouting (Taiwan +4.1pp, Vietnam +3.7pp, Mexico +2.3pp) rather than true decoupling.", "url": "https://www.piie.com/publications/policy-briefs/2026/made-china-global-supply-chains-and-limits-us-decoupling", "images": []}, {"source": "peterson_institute", "name": "Peterson Institute for International Economics", "thesis": "China's current account surplus rose from 0.7% to 3.7% of GDP since 2019, driven mainly by the post-2021 property bust (household investment fell 4.1pp of GDP) rather than industrial subsidies alone; argues a larger, better-targeted fiscal expansion is the more direct fix than tariffs.", "url": "https://www.piie.com/blogs/realtime-economics/2026/chinas-property-bust-spilling-across-its-borders", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas", "thesis": "Asset-class matrix runs Negative on China equities (awaiting concrete stimulus) while Positive on US and Eurozone equities, UK gilts, and USD/EUR high yield.", "url": "https://viewpoint.bnpparibas-am.com/monthly-market-views-equity-earnings-boost-and-asias-move-away-from-oil/", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "thesis": "China's Q2 2026 GDP growth came in at 4.3%, the weakest since Q4 2022, with soft domestic consumption the key drag, though channel checks found pockets of resilience among larger consumer operators.", "url": "https://www.franklintempleton.com/articles/2026/equity/emerging-markets-insights-opportunities-in-chinas-consumer-market", "images": []}]}, {"theme": "Geopolitics, Sanctions & AI Infrastructure Siting", "category": ["geopolitics", "ai_tech"], "consensus": "There is little disagreement that Middle East conflict spillover and AI-datacenter geopolitics are both intensifying: Brookings and Carnegie both document direct attacks on AI/logistics infrastructure this year (a March Iranian drone strike damaging AWS data centers in Bahrain; an alleged Iranian drone strike on Egypt's Damietta Port, described as the first foreign attack on Egypt since 1973), and Goldman Sachs estimates rising geopolitical fragmentation has already cut about 1% cumulatively from global GDP (1.9% in EM versus 0.8% in DM).", "divergence": "The clearest divergence is over sanctions effectiveness versus enforcement effort. Brookings documents the EU (671 tankers sanctioned, up from 25 in July 2024) and UK (621, up from 17) dramatically outpacing the US (zero new shadow-fleet sanctions since the Biden administration) on Russia shadow-fleet enforcement, yet finds the shadow fleet's share of Baltic-port oil exports still grew from ~25% to ~70% in 2025 -- evidence that even aggressive EU/UK enforcement has had limited real-world bite, with Brookings estimating the US would need to sanction ~518 more tankers just to match EU/UK coverage. On AI-model geopolitics, Brookings' Kyle Chan and Galaxy Digital, writing independently the same week, both concluded Moonshot AI's open-weight Kimi K3 delivers roughly 90% of frontier US model capability at a fraction of the cost -- an unusual cross-house convergence that cuts directly against the 'durable US AI moat' assumption embedded in mega-cap AI valuations, even as a late-July industry open letter (Nvidia, Microsoft, eventually Google/OpenAI) argued for keeping Chinese open-weight models available in the US market against Anthropic's counter-push for mandatory safety testing of all frontier models.", "items": [{"source": "brookings", "name": "Brookings Institution", "thesis": "EU has sanctioned 671 shadow-fleet vessels (up from 25 in July 2024) and the UK 621 (up from 17), versus zero new US sanctions since the Biden administration; shadow fleet's share of Baltic oil exports still rose from ~25% to ~70% in 2025 despite this.", "url": "https://www.brookings.edu/articles/an-update-on-europes-russia-sanctions/", "images": []}, {"source": "brookings", "name": "Brookings Institution", "thesis": "Kyle Chan explains why Moonshot AI's Kimi K3 alarmed Washington: Chinese open-weight models now deliver roughly 90% of frontier US capability at a fraction of the cost, undercutting closed-lab subscription economics.", "url": "https://www.brookings.edu/articles/why-washington-fears-chinas-open-source-ai/", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "Independently concludes Kimi K3 (2.8T params) ranks 4th on the Intelligence Index -- above Anthropic's Opus 4.8 -- while costing under a third as much to run; frames the late-July open-weights letter (Nvidia, Microsoft, Google, OpenAI) versus Anthropic's safety-testing counter-position as reflecting each signer's commercial interest.", "url": "https://www.galaxy.com/insights/research/open-letters-open-weights-openly-divided-ai-giants-stake-out-positions", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Estimates rising geopolitical fragmentation has cut about 1% cumulatively from global GDP over the past decade (1.9% in EM vs 0.8% in DM); a risk-event shock as large as the Iran war is estimated to subtract only 0.3pp from H1 2026 global growth, fading within two years.", "url": "https://www.goldmansachs.com/insights/articles/how-do-geopolitical-alliances-affect-economic-growth", "images": []}, {"source": "brookings", "name": "Brookings Institution", "thesis": "Following the March AWS-Bahrain drone strike, scopes a nine-month project on frontier AI data-center siting risk, weighing US grid/permitting constraints against Gulf states' sovereign-wealth-funded capacity and the resulting IP-theft, jurisdictional and physical-vulnerability exposure.", "url": "https://www.brookings.edu/articles/the-national-security-implications-of-building-frontier-ai-data-centers-overseas/", "images": []}, {"source": "carnegie", "name": "Carnegie Endowment for International Peace", "thesis": "An alleged Iranian drone strike on Egypt's Damietta Port -- the first foreign attack on Egypt since 1973 -- is read as an attempt to drag Cairo into the wider Iran war, threatening a hub central to Egypt's Mediterranean trade and Suez Canal revenues.", "url": "https://carnegieendowment.org/emissary/2026/08/egypt-drone-attack-port-damietta-iran-war", "images": []}]}], "B_calls": [{"source": "ubs", "name": "UBS", "call": "Gold price target $5,000/oz by H1 2027; recommends a mid-single-digit portfolio allocation to gold.", "category": ["commodities"], "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-06082026.html", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "call": "OW global equities (US, Asia ex-Japan; upgrade US financials); raise bonds to Core with OW EM USD bonds; gold reduced to Core weight but $4,600/oz 12-month target retained; oil rangebound $70-90/bbl.", "category": ["equities", "rates", "commodities"], "url": "https://www.sc.com/sg/market-outlook/global-market-outlook-31-7-2026/?mvog=1&source=podcast", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "call": "Raised 12-month TOPIX target to 4,500 (from 4,400; spot 3,960 on Aug 3) on earnings/AI/governance strength and a structurally weaker yen.", "category": ["equities", "fx"], "url": "https://www.goldmansachs.com/insights/articles/are-japanese-stocks-at-risk-of-falling-as-the-yen-surges", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "call": "Year-end 2026 S&P 500 target range of 7400-7800 on 15%+ EPS growth; 10-year Treasury expected 4.25%-4.75%.", "category": ["equities", "rates"], "url": "https://www.franklintempleton.com/articles/series/from-the-market-desk", "images": []}, {"source": "barclays", "name": "Barclays", "call": "Venu Krishna raised his S&P 500 price target again at end-June 2026 (earnings growth 'well above 20%'), having first set a target >15% above spot during the March Iran-war selloff.", "category": ["equities"], "url": "https://www.ib.barclays/content/barclaysmicrosites/ibpublic/en/our-insights/barclays-brief/us-equities-beyond-the-pullback.html", "images": []}, {"source": "kkr", "name": "KKR", "call": "10-year Treasury targets 4.75% (2026) / 4.25% (2027); S&P 500 +17% 2026 EPS growth forecast.", "category": ["rates", "equities"], "url": "https://www.kkr.com/insights/flash-macro-fomc-update-july-2026", "images": []}, {"source": "jpmorgan", "name": "JPMorgan", "call": "25bp Fed rate HIKE now expected at the September FOMC meeting, reversing a prior hold-bias.", "category": ["rates"], "url": "https://www.jpmorgan.com/insights/markets-and-economy/economy/september-2026-rate-hike-now-expected-amid-energy-shocks", "images": []}, {"source": "amundi", "name": "Amundi", "call": "Expects the Fed on hold until Q2 2027 before resuming cuts -- the most dovish house view among sources reviewed.", "category": ["rates"], "url": "https://research-center.amundi.com/article/fed-hold-markets-action", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "call": "Ashok Varadhan: no Fed hike expected in H2 2026 (counter-consensus); oil to settle well below $70/bbl by year-end; stays invested in US equities and AI leadership.", "category": ["rates", "energy", "equities"], "url": "https://www.goldmansachs.com/insights/the-markets/why-us-stocks-may-grind-higher", "images": []}, {"source": "bca_research", "name": "BCA Research", "call": "Structural regime-shift: USD turns pro-cyclical and depreciates; explicitly forecasts EM equities will NOT rally despite USD weakness, contrary to the standard playbook.", "category": ["fx", "em"], "url": "https://www.bcaresearch.com/marketing/webcasts/get-out-of-the-dollar-g-o-d/222826", "images": []}, {"source": "wisdomtree", "name": "WisdomTree", "call": "Asia defense spending set to rise from ~$700bn (2026) to $1.0-1.2tn by 2030; overweight thesis via WDAF fund across Japan/Korea/Taiwan/India defense supply chains.", "category": ["geopolitics", "equities"], "url": "https://www.wisdomtree.com/us/insights/blog/asia-s-defense-spending-surge", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "call": "Flagship 2026 forecast: BTC to $250k by year-end 2027; crypto-backed loans to clear $90bn; US spot crypto ETF inflows to exceed $50bn (from $23bn in 2025); a major wirehouse to add BTC to model portfolios at 1-2% strategic weight.", "category": ["crypto"], "url": "https://www.galaxy.com/insights/research/predictions-2026-crypto-bitcoin-defi", "images": []}, {"source": "coinshares", "name": "CoinShares", "call": "BTC cycle lows are in; expects range-bound trading toward $80k over the next 2-3 months, needing clearer labor deterioration and Fed dovishness to reach $100k.", "category": ["crypto"], "url": "https://coinshares.com/insights/research-data/market-update-07-08-2026/", "images": []}, {"source": "kkr", "name": "KKR", "call": "Structural overweight/reallocation into high yield versus leveraged loans; US HY yield ~7.3%, EU ~5.5% + ~150bp hedged carry, versus ~8.1% on loans.", "category": ["credit"], "url": "https://www.kkr.com/insights/high-yield-second-act", "images": []}, {"source": "citi_gps", "name": "Citi GPS", "call": "Diversify large-cap S&P 500 exposure (55% AI-growth-cluster weight) into small- and mid-cap equities for less AI-concentrated, more macro-sensitive exposure.", "category": ["equities"], "url": "https://www.citigroup.com/global/insights/markets-edition-ais-subtle-impact-on-the-equity-market", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "call": "Structurally bearish long-dated US Treasuries and the dollar's store-of-value role; bullish gold; 'very bullish' Hong Kong assets as the settlement sluice between USD, RMB and gold.", "category": ["fx", "commodities"], "url": "https://research.gavekal.com/article/a-shifting-global-currency-landscape/", "images": []}, {"source": "vanguard", "name": "Vanguard", "call": "Maintains a positive long-term view on private equity, forecasting a meaningful return premium for global buyout PE over public equities, citing unicorn value growth from $800bn (2016) to $8.6tn (2026).", "category": ["equities"], "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/why-more-growth-happens-before-the-ipo.html", "images": []}, {"source": "pimco", "name": "PIMCO", "call": "Fed to hold rates through year-end but leans toward rates ending lower than market pricing; underweight corporate credit, overweight agency MBS/securitized credit and higher-quality EM sovereign (Mexico, South Africa, Brazil).", "category": ["rates", "credit"], "url": "https://www.pimco.com/us/en/insights/income-fund-update-where-income-meets-resilience", "images": []}], "C_deep_reads": [{"source": "ecb", "name": "European Central Bank", "title": "The cost of not knowing: how uncertainty weighs on the euro area economy", "summary": "This flagship ECB Economic Bulletin article reviews how economic uncertainty (distinct from risk or confidence) has weighed on euro-area activity, drawing on text-based (EPU), survey-based, financial-market-based (VSTOXX, CISS) and model-based (Jurado et al.) uncertainty proxies. A one-standard-deviation EPU shock is estimated to cut euro-area real GDP by around 1% at the trough before a gradual recovery over roughly seven quarters, with business investment contracting by about 2%. Uncertainty shocks are estimated to explain around 12% of the short-run forecast error variance in euro-area real GDP growth; COVID-19 stands out as the single largest uncertainty shock on record, larger even than the 2008-09 GFC, and trade-policy uncertainty remains elevated alongside geopolitical risk gauges even as short-term financial-stress measures have normalized.", "url": "https://www.ecb.europa.eu/press/economic-bulletin/articles/2026/html/ecb.ebart202605_01~712f201ac1.en.html", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "title": "A Shifting Global Currency Landscape", "summary": "Gave and Metivet argue the dollar's post-1971 monopoly on all three reserve-currency functions is fragmenting: the renminbi is capturing goods-trade settlement, the dollar retains the financial/unit-of-account rails, and the store-of-value function is reverting to gold (~1,000 tons/year of central-bank buying since 2022). They cite GCC states investing an estimated $66bn into AI infrastructure over the past year despite running current-account deficits, Tether's $115-125bn Treasury holdings rivaling Saudi Arabia's official reserves, four US hyperscalers projecting ~$725bn of 2026 capex (nearly double all of OPEC's expected oil-export revenue), and Hong Kong dollar deposits growing ~12% in 2025 with the HKMA buying ~$17bn to defend the peg ceiling. Conclusion: bearish long-dated bonds and the dollar's store-of-value role, bullish gold, and 'very bullish' Hong Kong assets as the toll-collecting sluice between the dollar, renminbi and gold systems.", "url": "https://research.gavekal.com/article/a-shifting-global-currency-landscape/", "images": []}, {"source": "kkr", "name": "KKR", "title": "High Yield's Second Act: What AI Revealed About Credit Quality", "summary": "KKR argues US/European high yield is entering a 'second act' as structural quality improves: US HY is a record ~57% BB-rated (EU ~68%), the US BB cohort grew from $1.19tn to $1.25tn between January and May 2026 while the CCC bucket shrank from $213bn to $193bn, software exposure is only ~3% of HY versus over 20% of direct lending, and first-lien secured bonds sit at an all-time-high 33% of the market. Duration sits near a 15-year low (~3 years vs a ~4-year long-run average), so while headline spreads look tight (96th percentile since the GFC), spread-per-unit-of-duration is only at the 74th percentile. US HY issuance is up more than 20% YTD to $189bn, with BB paper a record 39% of YTD issuance; current yields are ~7.3% (US) and ~5.5% (EU, plus ~150bp FX-hedged carry), versus ~8.1% on US leveraged loans -- a premium KKR attributes to loan-market risk, not better fundamentals.", "url": "https://www.kkr.com/insights/high-yield-second-act", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "title": "Now for the hard part -- H2 2026 Global Market Outlook", "summary": "SC's H2 2026 outlook stays constructive on risky assets: keeps global equities Overweight (US and Asia ex-Japan; upgrades US financials to Overweight on higher NIMs and M&A/IPO activity), raises bonds to a Core holding (preferring EM USD bonds and short 3-5yr duration) as the US 10-year real yield nears 2.5% -- a potential path to the highest real yields since 2008. Gold is reduced to Core (from a higher weight) despite staying bullish in absolute terms with a $4,600/oz 12-month target; oil is expected to stay rangebound $70-90/bbl. Scenario weights: soft landing 45% (down from 60%), 'no landing' upside 30% (up from 20%), downside 25% (including 10% recession odds and 15% odds of a stagflation scenario with oil above $100/bbl). Base case: Fed holds for the rest of 2026, the ECB delivers another 'insurance' hike in H2 2026, and the BoJ hikes once more.", "url": "https://www.sc.com/sg/market-outlook/global-market-outlook-31-7-2026/?mvog=1&source=podcast", "images": []}, {"source": "pimco", "name": "PIMCO", "title": "Old-Fashioned Bond Math for a New-Fashioned Fed", "summary": "PIMCO's Marc Seidner and Pramol Dhawan argue bond-equity diversification isn't broken despite 2022's positive-correlation 'muscle memory': with the 10-year Treasury around 4.5%-4.6%, a decline to about 2.5% would produce roughly 10%-20% price appreciation, a real ballast against equity drawdowns. TIPS real yields are now 2.3% versus -1.2% in 2022. They credit new Fed Chair Warsh with a 'Warsh Dividend' for re-anchoring inflation credibility by dismantling forward-guidance/dot-plot machinery, but warn this could raise term premium and volatility, noting the market is separately 'debating whether the Federal Reserve raises rates 25 basis points by the end of this year.' PIMCO argues rebalancing into fixed income (risk parity) rather than the roughly 80%-95% equity allocations typical of many advisor portfolios is prudent, given growing S&P concentration in a handful of mega-caps.", "url": "https://www.pimco.com/us/en/insights/podcasts/accrued-interest/old-fashioned-bond-math-for-a-new-fashioned-fed", "images": []}, {"source": "bridgewater", "name": "Bridgewater Associates", "title": "Karen Karniol-Tambour on Investing in a More Fragmented World", "summary": "Bridgewater Co-CIO Karen Karniol-Tambour argues 'modern mercantilism' -- every country spending to close its vulnerabilities -- is a structural, not cyclical, inflationary force. She warns most investors are overweight US equities and underweight real assets, leaving them poorly positioned for the environment ahead, and that the AI capex boom driving US growth today still reflects markets pricing the 'buildout' phase rather than the subsequent 'adoption' phase. She also flags growing geographic fragmentation as industrial policy builds distinct national champions, warranting exposure across regions rather than concentration in any single market.", "url": "https://www.bridgewater.com/research-and-insights/karen-karniol-tambour-on-investing-in-a-more-fragmented-world", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "title": "The Model is not the Moat", "summary": "Franklin Templeton argues AI model commoditization won't hurt AI economics because enterprises pay for completed, trustworthy outcomes (the 'harness' -- infrastructure, workflow, governance, proprietary context) rather than tokens; falling token prices should expand consumption faster than prices fall (Jevons Paradox), so infrastructure/distribution/governance layers capture durable value rather than raw model access. The piece argues the strongest position belongs to companies orchestrating multiple models rather than depending on a single provider, warning the weakest position is an undifferentiated model or thin application with no proprietary data or workflow ownership.", "url": "https://www.franklintempleton.com/articles/2026/equity/the-model-is-not-the-moat", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "title": "26 Cryptocurrency, Bitcoin, and DeFi Predictions for 2026", "summary": "Galaxy's flagship 2026 outlook predicts Bitcoin hits $250k by year-end 2027; crypto-backed loans outstanding clear $90 billion; US spot crypto ETF net inflows exceed $50 billion (vs. $23bn in 2025); a major wirehouse adds BTC to standard model portfolios at a 1-2% strategic weight; DEXs capture over 25% of spot trading volume (from ~15-17% today); privacy-token market cap exceeds $100bn (from $63bn); and 15+ crypto companies IPO or uplist in the US. A retrospective on 2025 predictions shows Galaxy's $150k-185k BTC price target missed (BTC peaked at $126,080 before round-tripping to the low-$90,000s), while its GENIUS Act stablecoin-legislation call and $1bn+ DeFi 'dividend era' buyback prediction were correct.", "url": "https://www.galaxy.com/insights/research/predictions-2026-crypto-bitcoin-defi", "images": []}], "D_charts": [{"source": "world_bank", "name": "World Bank", "chart": "Charts the private sector's share of China's 100 largest listed companies and urbanization trends: 4.7 billion people (58% of global population) now live in urban areas, projected to cross 70% by 2050; slum dwellers rose from ~840 million (2018) to over 1 billion (2022).", "url": "https://blogs.worldbank.org/en/opendata/the-world-is-urbanizing-fast---the-window-to-get-it-right-is-nar", "images": ["https://s7d1.scene7.com/is/image/wbcollab/Screenshot-2026-08-06-180512?qlt=90&fmt=webp&resMode=sharp2", "https://s7d1.scene7.com/is/image/wbcollab/Screenshot-2026-08-06-180555?qlt=90&fmt=webp&resMode=sharp2"]}, {"source": "man_group", "name": "Man Group", "chart": "Figures showing unencumbered cash balances in a 1:1 S&P 500/SG Trend portable-alpha structure falling to just 7% in October 2008 and again in March 2020, illustrating why 30-40%+ cash buffers are needed to avoid forced beta-selling in a drawdown.", "url": "https://www.man.com/insights/portable-alpha-ask-the-hard-questions", "images": ["https://www.man.com/sites/default/files/uploads/content/research/Figure%201-FINAL-Portable%20alpha%20unencumbered%20cash%20balance.png", "https://www.man.com/sites/default/files/uploads/content/research/Figure%204-FINAL-three%20year%20rolling-hardquestions.png"]}, {"source": "coinshares", "name": "CoinShares", "chart": "Charts showing RWA (real-world-asset) deposits across DeFi lending/trading platforms more than tripling from $2.3bn to $7.4bn between Q2'25 and Q2'26, plus breakdowns of RWA collateral by chain and product yield.", "url": "https://coinshares.com/insights/research-data/token-terminal-hybrid-finance-q2-report/", "images": ["https://a.storyblok.com/f/176807/1600x1200/b5ac201c99/rwa-deposits.png/m/", "https://a.storyblok.com/f/176807/1600x1200/1bd095e86d/yield-bearing-stablecoins-and-tokenized-treasuries-dominate-rwa-deposits.png/m/"]}, {"source": "brookings", "name": "Brookings Institution", "chart": "Figures showing EU/UK shadow-fleet sanction counts rising from near-zero to 671/621 vessels respectively since July 2024, alongside the shadow fleet's share of Baltic-port oil exports still climbing from ~25% to ~70% in 2025 despite that enforcement.", "url": "https://www.brookings.edu/articles/an-update-on-europes-russia-sanctions/", "images": ["https://www.brookings.edu/wp-content/uploads/2026/08/Figure-1.jpg?resize=1500,1032", "https://www.brookings.edu/wp-content/uploads/2026/08/Figure-2.jpg?resize=1500,1034", "https://www.brookings.edu/wp-content/uploads/2026/08/Figure-3.jpg?resize=1500,1125"]}, {"source": "carnegie", "name": "Carnegie Endowment for International Peace", "chart": "Chart illustrating the gap between India's official urbanization rate (31.2%, 2011 census) and its actual DEGURBA-methodology urbanization (near 63%), underpinning the case for a much larger municipal-infrastructure investment gap than official data implies.", "url": "https://carnegieendowment.org/research/2026/07/india-city-population-growth-urban-demographic-dividend", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "chart": "Chart showing only 14.9 GW of Southeast Asia's targeted 53 GW gas-fired power pipeline reaching commercial operation by 2030, with the widest shortfall in Vietnam (3.7 GW delivered vs. a 29.4 GW target).", "url": "https://www.woodmac.com/press-releases/southeast-asia-to-deliver-less-than-one-third-of-planned-gas-power-capacity-by-2030/", "images": ["https://www.woodmac.com/contentassets/8a0eadbb90da46a1bf813148f04d8491/blobid0.png"]}, {"source": "schroders", "name": "Schroders", "chart": "Eight charts tracking hyperscaler AI capex estimates continuing to be revised higher through 2026, with planned capex in some cases now exceeding operating cash flow.", "url": "https://www.schroders.com/en-us/us/individual/insights/august-2026-early-signs-of-ai-return-on-investment-/", "images": ["https://mybrand.schroders.com/transform/94b4c70d-3f40-44e4-907e-75be049a029e/618203_SC_WEBCHARTS_chart-01?quality=85", "https://mybrand.schroders.com/transform/42f11b55-26b5-4285-8bbf-56ff44e49510/618203_SC_WEBCHARTS_chart-02?quality=85"]}, {"source": "franklin_templeton", "name": "Franklin Templeton", "chart": "Charts showing the ~50bp rise in the 10-year Treasury yield since the start of 2026 is a real-yield story (approaching 2.5%) rather than an inflation story, with the real-yield/S&P-dividend-yield spread now at its widest since the early 2000s.", "url": "https://www.franklintempleton.com/articles/2026/fixed-income/bonds-are-back-the-real-yield-reset", "images": ["https://franklintempletonprod.widen.net/content/pmetsxy3kr/webp/US-real-yield-8-26-ex1.png", "https://franklintempletonprod.widen.net/content/jityvthfzu/webp/US-real-yield-8-26-ex2.png"]}, {"source": "peterson_institute", "name": "Peterson Institute for International Economics", "chart": "Chart accompanying the tariff-incidence review showing the estimated split of who bears the cost of 2025-26 US tariffs, supporting the finding that US buyers, not foreign exporters, absorb roughly 90% of the burden.", "url": "https://www.piie.com/blogs/realtime-economics/2026/who-pays-tariffs-insights-recent-research", "images": ["https://www.piie.com/sites/default/files/inline-images/2026-08-03-clausingoptimal2-figure.png"]}, {"source": "federal_reserve", "name": "Federal Reserve", "chart": "Figures comparing standard all-bank stress-test capital-ratio paths against a regional-bank-specific model, showing the standard model likely overestimates regional-bank (vs. large-bank) capital losses under the 2024 severely-adverse scenario by nearly 1 percentage point.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/examining-the-sensitivity-of-regional-banks-to-macroeconomic-shocks-20260804.html", "images": ["https://www.federalreserve.gov/econres/notes/feds-notes/figure1-4097.png", "https://www.federalreserve.gov/econres/notes/feds-notes/figure2-4097.png"]}], "house_views": [{"source": "ecb", "name": "European Central Bank", "stance": "Holds steady amid an energy shock judged smaller than 2022's; inflation expectations remain broadly anchored, though fiscal room to cushion a further shock is now more limited than in 2022.", "category": "central_bank", "url": "https://www.ecb.europa.eu/press/economic-bulletin/articles/2026/html/ecb.ebart202605_01~712f201ac1.en.html"}, {"source": "federal_reserve", "name": "Federal Reserve", "stance": "Research staff focused on financial-stability plumbing rather than policy signals this period: found standard stress-test models likely overstate regional-bank capital losses, and that banks charge Business Development Companies a ~1.1pp funding premium reflecting bargaining power more than credit risk.", "category": "central_bank", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/examining-the-sensitivity-of-regional-banks-to-macroeconomic-shocks-20260804.html"}, {"source": "boe", "name": "Bank of England", "stance": "Held Bank Rate at 3.75%; expects a temporary, energy-driven rise in inflation later in 2026 but views it as transitory.", "category": "central_bank", "url": "https://www.bankofengland.co.uk/monetary-policy/the-interest-rate-bank-rate"}, {"source": "goldman_sachs", "name": "Goldman Sachs", "stance": "House view splits by desk: Ashok Varadhan explicitly rejects a H2 2026 hike and expects oil below $70; credit strategists warn hyperscaler AI-debt supply may outstrip IG-market capacity; equity research raised its TOPIX target to 4,500 while flagging Japan positioning risk.", "category": "bank_bulge", "url": "https://www.goldmansachs.com/insights/the-markets/why-us-stocks-may-grind-higher"}, {"source": "jpmorgan", "name": "JPMorgan", "stance": "Reversed to explicitly call a 25bp September Fed hike as energy shocks keep inflation elevated; advises clients to proactively de-risk balance sheets while staying invested in AI and geographic-diversification themes.", "category": "bank_bulge", "url": "https://www.jpmorgan.com/insights/markets-and-economy/economy/september-2026-rate-hike-now-expected-amid-energy-shocks"}, {"source": "ubs", "name": "UBS", "stance": "Base case is a Fed hold through year-end (calls the market's ~34bp of priced tightening 'too aggressive'); gold target raised to $5,000/oz by H1 2027.", "category": "bank_bulge", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/d // ---------- helpers ----------
const CAT_VARS = {
  rates: 'var(--cat-rates)',
  growth: 'var(--cat-growth)',
  fx: 'var(--cat-fx)',
  equities: 'var(--cat-equities)',
  credit: 'var(--cat-credit)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  commodities: 'var(--cat-commodities)',
  geopolitics: 'var(--cat-geopolitics)',
  ai_tech: 'var(--cat-ai_tech)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }
function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}
function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}
function pills(cats) {
  if (!cats) return '';
  if (Array.isArray(cats)) return cats.map(pill).join(' ');
  return pill(cats);
}
function externalLink(url, label) {
  if (!url) return '';
  return `<a class="item-link" href="${escapeAttr(url)}" target="_blank" rel="noopener">${label || 'link →'}</a>`;
}
function nameLink(url, name) {
  if (!name) return '';
  if (!url) return `<span class="item-source">${escapeHtml(name)}</span>`;
  return `<a class="item-source" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderThemeItem(it) {
  return `
    <div class="theme-item">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.thesis || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderTheme(theme) {
  const items = (theme.items || []).map(renderThemeItem).join('');
  return `
    <div class="theme">
      <div class="theme-head">
        ${pills(theme.category)}
        <div class="theme-title">${escapeHtml(theme.theme || '')}</div>
      </div>
      <div class="theme-stance">
        ${theme.consensus ? `<div class="theme-line consensus"><span class="lbl">Consensus</span>${renderBold(theme.consensus)}</div>` : ''}
        ${theme.divergence ? `<div class="theme-line divergence"><span class="lbl">Divergence</span>${renderBold(theme.divergence)}</div>` : ''}
      </div>
      ${items ? `<div class="theme-items">${items}</div>` : ''}
    </div>`;
}

function renderCall(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${pills(it.category)}
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.call || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderDeepRead(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url, 'read →')}
      </div>
      ${it.title ? `<div class="item-title">${escapeHtml(it.title)}</div>` : ''}
      <div class="item-text">${renderBold(it.summary || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderChart(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.chart || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderHouseView(hv) {
  const name = hv.name || hv.source || '';
  const nameHtml = hv.url
    ? `<a class="hv-name" href="${escapeAttr(hv.url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`
    : `<span class="hv-name">${escapeHtml(name)}</span>`;
  return `
    <div class="hv-row">
      ${nameHtml}
      <span class="hv-stance">${renderBold(hv.stance || '')}</span>
    </div>`;
}

function renderSection(letter, name, items, render, extraClass) {
  if (!items || !items.length) return '';
  const body = items.map(render).join('');
  const cls = 'section' + (extraClass ? (' ' + extraClass) : '');
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderTopStats(d) {
  const parts = [];
  const p = d.period || {};
  const is = d.input_stats || {};
  const cv = d.coverage || {};
  if (p.from && p.to)
    parts.push(`period <strong>${escapeHtml(p.from)} → ${escapeHtml(p.to)}</strong>`);
  else if (p.lookback_days != null)
    parts.push(`lookback <strong>${p.lookback_days}d</strong>`);
  if (is.total_articles != null) parts.push(`articles <strong>${is.total_articles}</strong>`);
  if (is.sources_present != null) parts.push(`sources <strong>${is.sources_present}</strong>`);
  if (is.after_filter != null) parts.push(`after filter <strong>${is.after_filter}</strong>`);
  if (cv.coverage_pct != null) {
    const pct = (cv.coverage_pct <= 1 ? cv.coverage_pct * 100 : cv.coverage_pct);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  } else if (cv.sources_covered != null && cv.sources_total != null) {
    parts.push(`coverage <strong>${cv.sources_covered}/${cv.sources_total}</strong>`);
  }
  return parts.join(' | ');
}

function reportDate(d) {
  if (d.period && d.period.to) return d.period.to;
  if (d.collected_at) return String(d.collected_at).slice(0, 10);
  return '';
}

// ---------- interactions ----------
function toggleSection(headEl) { headEl.parentElement.classList.toggle('open'); }
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('lightbox').classList.contains('open')) {
    closeLightbox();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = reportDate(d);
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  const s = d.sections || {};
  const out = [
    renderSummary(d.summary),
    renderSection('A.', 'Debates — Consensus vs Divergence', s.A_debates,    renderTheme),
    renderSection('B.', 'Key Calls & Positioning',           s.B_calls,      renderCall),
    renderSection('C.', 'Notable Deep Reads',                s.C_deep_reads, renderDeepRead,
                  'section-deepreads'),
    renderSection('D.', 'Charts & Data',                     s.D_charts,     renderChart),
    renderSection('E.', 'House Views',                       s.house_views,  renderHouseView),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = out || '<div class="empty">No report data.</div>';

  // Auto-open Summary's section view: first two sections open by default.
  document.querySelectorAll('.section').forEach((sec, i) => {
    if (i < 2) sec.classList.add('open');
  });
}

renderReport(REPORT_DATA);
</script>
