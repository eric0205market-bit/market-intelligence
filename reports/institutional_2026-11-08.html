<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Institutional Research</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #7c3aed;          /* purple — institutional report accent */
  --accent-soft: #f3eefc;
  --divergence: #d94052;      /* divergence red */
  --consensus: #15803d;       /* consensus green */
  --yellow: #fff5b3;

  /* category colors (institutional schema: rates, growth, fx, equities,
     credit, crypto, energy, commodities, geopolitics, ai_tech, em) */
  --cat-rates: #2563eb;
  --cat-growth: #d97706;
  --cat-fx: #0891b2;
  --cat-equities: #15803d;
  --cat-credit: #be185d;
  --cat-crypto: #8b5cf6;
  --cat-energy: #dc2626;
  --cat-commodities: #ea580c;
  --cat-geopolitics: #b91c1c;
  --cat-ai_tech: #4f46e5;
  --cat-em: #059669;
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 980px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 12px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* STATS BAR (top: period + coverage) */
.stats-top { margin-bottom: 16px; padding: 8px 12px; background: var(--surface);
             border: 1px solid var(--border); border-radius: 6px;
             font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
             color: var(--text-2); display: flex; gap: 16px; flex-wrap: wrap; }
.stats-top strong { color: var(--text); font-weight: 600; }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 10px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* THEME CARD (Section A) */
.theme { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.theme:last-child { border-bottom: none; }
.theme-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
              flex-wrap: wrap; }
.theme-title { font-weight: 600; font-size: 14.5px; }
.theme-stance { display: grid; grid-template-columns: 1fr; gap: 6px; margin-bottom: 10px; }
@media (min-width: 720px) { .theme-stance { grid-template-columns: 1fr 1fr; } }
.theme-line { font-size: 13px; padding: 8px 10px; border-radius: 4px;
              border-left: 3px solid var(--border); background: #fafafa; line-height: 1.5; }
.theme-line.consensus { border-left-color: var(--consensus); background: #f0f9f3; }
.theme-line.divergence { border-left-color: var(--divergence); background: #fdf6f7; }
.theme-line .lbl { font-family: 'IBM Plex Mono', monospace; font-size: 10px;
                   text-transform: uppercase; letter-spacing: .06em;
                   color: var(--text-3); display: block; margin-bottom: 2px; }
.theme-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
               border-left: 2px solid var(--border-light); }
.theme-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-source { font-weight: 600; color: var(--accent); }
a.item-source { text-decoration: none; }
a.item-source:hover { text-decoration: underline; }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-title { font-weight: 600; font-size: 14px; margin: 4px 0 6px; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DEEP READS (Section C) — purple left border to mark flagship long-form */
.section-deepreads .item-card { border-left: 4px solid var(--accent); background: var(--accent-soft); }

/* HOUSE VIEWS — compact one-line-per-source list */
.hv-row { display: flex; gap: 10px; align-items: baseline;
          padding: 6px 16px; border-bottom: 1px solid var(--border-light);
          font-size: 13px; }
.hv-row:last-child { border-bottom: none; }
.hv-name { font-weight: 600; color: var(--accent); min-width: 180px;
           text-decoration: none; }
.hv-name:hover { text-decoration: underline; }
.hv-stance { color: var(--text); flex: 1; }

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 110px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .hv-row { flex-direction: column; gap: 2px; }
  .hv-name { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "INSTITUTIONAL RESEARCH", "collected_at": "2026-11-08T03:01:55.000Z", "period": {"lookback_days": 10, "from": "2026-10-29", "to": "2026-11-07"}, "input_stats": {"total_articles": 395, "sources_present": 50, "after_filter": 150}, "summary": "**Rates / Fed:** Consensus is a hawkish regime: the Fed held at **3.75-4.00%** (10-2, two votes for a hike) with a December hike priced near **66%**, and the BoE hiked to **4%**. Sharpest split: **Vanguard** expects less tightening than priced after December, while **Standard Chartered** sees **two more Fed hikes by H1 2027**.\n\n**US Politics:** Democrats swept both chambers (**Senate 54-44**, **House 228-139** per Deutsche; PIMCO sees a 1974-style **13-point** national win); consensus is gridlock with Trump keeping the veto. **BNP Paribas** says midterm statistics are a 'parlour game', whereas **Standard Chartered** and **Gavekal** see the result as curbing Trump on Iran.\n\n**AI / Tech:** The S&P fell **4.4%**, Nasdaq 100 **6.4%** and semis **12.3%** on Nov 5 on data-center regulation and capex-financing fears. **UBS** (capex **$1.4tn in 2027**), **Invesco**, **Citi** and **Yardeni** (S&P **7,900**) say buy or hold; **RBC** stays on the sidelines in Tech and **Amundi** and **BCA's Peloso** favor rotation.\n\n**Oil / Iran:** Brent swung from **~$118** to **~$95-100** on diplomacy hopes. **Standard Chartered** sees **$80** in 6-12 months; **UBS** warns depleted inventories and finished SPR releases keep oil elevated, and **RBC** flagged escalation risk.\n\n**Bonds / Duration:** The 10y is ~**4.84%** after touching **5%** in September. **PIMCO** urges locking in yield and buying duration, **Standard Chartered** caps duration at **3-7 years**, and **Brookings' Brooks** argues Treasuries' convenience yield is eroding.\n\n**Europe:** **BCA** is split internally: Berezin says **'sell Europe'** on rallies, Peloso favors European equities; **Franklin Templeton** sees a re-rate while **Gavekal** and **BNY** are wary of France (spread **140bp**).\n\n**Crypto:** Bitcoin fell **~5%** with Nasdaq (**>$1bn** liquidated) as the **Binance $6.3bn hack** (North Korea-linked) hit sentiment; **CoinShares** says the CLARITY Act matters less, while **Galaxy** flags pro-crypto election losses.", "sections": {"A_debates": [{"theme": "US midterms & policy", "category": ["geopolitics", "equities"], "consensus": "Every house reads the result as a Democratic sweep (Deutsche Bank: Senate 54-44, House 228-139; PIMCO: Democrats won the national vote by ~13 points, 'more 1974 than 2006') that produces gridlock rather than a policy reversal. Trump keeps the veto, tariffs and foreign-policy authority (Gavekal's 'Mr. Veto', Amundi, UBS, Franklin Templeton, BNP Paribas), less fiscal stimulus is likely but deficits and Treasury supply do not shrink, and the real policy risk to markets is at the state level on data centers. UBS notes the S&P 500 gained an average 15.5% in the six months after the previous 14 midterms; Franklin Templeton counts +14.5% over 12 months in all nine midterms 1990-2022.", "divergence": "They split on how much it matters. BNP Paribas (Daniel Morris) calls midterm return statistics a 'parlour game' with little practical value: divided government only trims legislation, and growth, rates and inflation dominate. BCA's Matt Gertken said before the vote that 'Iran, not the Senate, poses the real risk', while Standard Chartered argues the opposite, that the result itself curbs Trump's ability to prolong the Iran conflict, lowers oil and inflation expectations and slows AI data-center supply of bonds. Gavekal's Louis-Vincent Gave goes furthest, saying Trump's Iran war 'ended up triggering regime change across the US'. On AI, PIMCO says the 45+ data-center restriction ballot measures it tracked all passed and several new governors ran on statewide moratoria; UBS says broad federal limits would face legislative and presidential constraints and that state action redistributes rather than derails the build-out.", "items": [{"source": "pimco", "name": "PIMCO", "thesis": "Libby Cantrill: Democrats won the House (on track for +40-45 seats, ~260 total) and the Senate (+7, possibly 56-44), plus a majority of governorships (~28 of 50). Drivers were affordability ('gas, groceries, housing, healthcare') and presidential overreach. She expects 2027 to bring 'good government' and executive-constraint efforts. The biggest risk to the AI trade is state-level: 45+ data-center ballot initiatives passed and several new governors (Texas, Georgia, Ohio, Iowa) ran on moratoria.", "url": "https://www.pimco.com/us/en/insights/with-echoes-of-1974-a-decisive-victory-for-the-democratic-party", "images": []}, {"source": "deutsche_bank", "name": "Deutsche Bank WM", "thesis": "CIO Americas memo: Senate 54-44 (+7: TX, OH, NC, SC, KS, IA, ME), House 228-139 (+25), short of a veto-proof majority. Overnight equity sell-off turned into a relief rally with dispersion (industrials lagged on AI-infrastructure regulation fears, consumer discretionary led). Focus shifts to government funding, fiscal talks and the debt ceiling.", "url": "https://wealth.db.com/en/insights/investing-insights/investing-themes/us-midterm-elections-2026-riding-the-blue-wave.html", "images": []}, {"source": "amundi", "name": "Amundi", "thesis": "'Not a game changer': more oversight and gridlock but not a policy reversal. Relief rather than risk-on (bonds rally, USD weaker, gold/silver up, oil down). Favors intermediate US maturities and diversification into non-US and non-tech equities; AI, data centers and defence face the policy risk, though the themes remain intact.", "url": "https://research-center.amundi.com/article/what-democratic-sweep-means-markets", "images": []}, {"source": "ubs", "name": "UBS CIO", "thesis": "Wednesday: S&P +1.6%, Nasdaq +1.4%, US 10y -8bp from pre-election, DXY -0.5%, Brent -8.2% to ~$95 on US-Iran diplomacy hopes. Election removes uncertainty; debt ceiling and funding fights could lift bond volatility; Trump retains tariff, foreign-policy and regulatory authority.", "url": "https://www.ubs.com/us/en/wealth-management/insights/investment-research/insights-display-adp/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-05112026.html?caasID=CAAS-ActivityStream", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "thesis": "Daniel Morris: polls were right and if anything understated Democrats. Washington matters only marginally to the economy except under unified control; stays constructive on equities with medium-term gains but above-average volatility; the tech sell-off is a continuation of what began in late June.", "url": "https://www.bnpparibas-am.com/en-us/front-of-mind/view-from-the-markets-financial-implications-of-the-us-midterm-elections/", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "thesis": "'Bluer than blue': affordability stays the central issue through 2028; gridlock is not fiscal discipline; Texas and Georgia governors' stance on data centers is the notable AI risk.", "url": "https://www.franklintempleton.com/articles/en/2026/11/quick-thoughts-bluer-than-blue-investment-implications", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Will Denyer: Democrats hold both chambers but lack two-thirds to override vetoes; legislative gridlock in 2027-28, but the lame-duck session and non-legislative areas (foreign policy, Treasury financing) can still move. Teaser only.", "url": "https://research.gavekal.com/teaser/a-blue-congress-mr-veto-and-a-treasury-twist/", "images": []}]}, {"theme": "Rates & Central Banks", "category": ["rates"], "consensus": "Central banks are in a tightening or on-hold-with-hawkish-bias regime driven by the Iran-war energy shock. The Fed held at 3.75-4.00% on Oct 28 by 10-2 (BNP Paribas: both dissenters wanted a 25bp hike) under Chair Warsh, who said conditions are not tight and inflation is 'too high' (Amundi). Markets price a December hike at roughly 66% (Standard Chartered, Nov 6; down from 80% a week earlier; CoinShares had 76% on Oct 30). The BoE hiked to 4.00% on Nov 5, the ECB held with September inflation at 3.8%, the BoJ held at 1.25% in a 'hawkish pause' and Oxford Economics expects hikes in December and April to 1.75%. October payrolls came in at +165k (Goldman's Hatzius: trend back above 100k, unemployment 4.1-4.2%, claims at a 57-year low).", "divergence": "How much further the Fed goes is contested. Vanguard agrees with a December hike but expects less tightening than markets price afterwards because tariff effects roll off by April-May 2027 and shock-driven inflation moderates by H2 2027, letting the Fed stay patient. Standard Chartered expects two more Fed hikes by H1 2027 on sticky inflation and a robust economy, and BNP Paribas notes markets already price two more hikes over 12 months. Amundi thinks the Fed is 'buying time' and left the door open to December without guidance, while Goldman's Hatzius describes a stable, full-employment labor market with subdued wage growth and low inflation, which does not read as an overheating case. In the UK, Oxford Economics calls December a coin flip, with a peak of 4.25% and upside risk; the MPC speeches differ in emphasis, with Pill arguing for prompt, decisive hikes to stop energy inflation becoming embedded and Greene challenging the idea that labor-market slack will contain second-round wage effects.", "items": [{"source": "vanguard", "name": "Vanguard", "thesis": "Josh Hirt: Fed held 3.75-4% on Oct 28; Vanguard shares the market's view of a second 2026 hike in December but expects less tightening after that. Core inflation is inflated by tariffs, energy and AI-related demand; tariff effects roll off by April-May 2027, taking core PCE toward ~2.5% by late spring. Oil around $100 takes longer to fade.", "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/inflation-remains-front-center-as-fed-holds.html", "images": []}, {"source": "amundi", "name": "Amundi", "thesis": "Fed, ECB and BoJ all held in October. Warsh was categorical that conditions are not tight and inflation is too high; Amundi sees a December hike as live. AI capex may be adding to near-term inflation while promising long-run productivity.", "url": "https://research-center.amundi.com/article/central-banks-action-through-inaction", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "thesis": "Fed 10-2 hold at 3.75-4% with two votes for a 25bp rise; US Q3 GDP +3.4% annualized vs 3.2% expected; ECB on hold, September inflation 3.8% (three-year high), eurozone Q3 GDP +0.4% q/q; BoJ unchanged at 1.25%.", "url": "https://www.bnpparibas-am.com/en-us/front-of-mind/take-two-central-banks-on-hold/", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "BoE raised Bank Rate 25bp to 4%; messaging more hawkish; December is a coin flip with oil and gas decisive; forecast peak 4.25% with risks to the upside.", "url": "https://www.oxfordeconomics.com/resource/uk-hawkish-monetary-policy-committee-puts-a-december-hike-on-the-table/", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "BoJ kept 1.25% in a hawkish pause, saying underlying inflation has reached 2%; Oxford forecasts hikes in December and April to a 1.75% terminal rate.", "url": "https://www.oxfordeconomics.com/resource/bank-of-japan-will-continue-rate-hikes-to-keep-inflation-at-the-target/", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Jan Hatzius on CNBC after the +165k October payrolls: solid report, underlying job growth likely above 100k, unemployment stable at 4.1-4.2% (full employment), consistent with subdued wage growth and low inflation; layoffs very low.", "url": "https://www.goldmansachs.com/insights/videos/cnbc-jan-hatzius-us-jobs-report-and-economic-outlook", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Still expects two more Fed hikes by H1 2027; prefers the 3-7 year part of the DM curve and BBB-to-BB corporates; modestly weaker USD over 6-12 months via ex-US allocation.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-6-11-2026/?mvog=1", "images": []}, {"source": "boe", "name": "Bank of England (Huw Pill)", "thesis": "Explains support for raising Bank Rate to 4%: clear, prompt and decisive action to keep Middle East-driven inflation from becoming embedded. Dated 3 Sep 2026.", "url": "https://www.bankofengland.co.uk/speech/2026/september/remarks-at-the-edinburgh-chamber-of-commerce", "images": []}, {"source": "boe", "name": "Bank of England (Megan Greene)", "thesis": "Challenges the argument that labor-market slack will limit wage pressure and second-round effects from the energy shock. Speech of 20 Oct 2026.", "url": "https://www.bankofengland.co.uk/speech/2026/october/megan-greene-speech-at-lse-economics-society-london", "images": []}, {"source": "ecb", "name": "ECB / Banque de France research", "thesis": "Research Bulletin no. 148 (2 Nov): central banks can still control inflation under high public debt, but higher debt raises the level of interest rates consistent with price stability.", "url": "https://www.ecb.europa.eu/press/research-publications/resbull/2026/html/ecb.rb261102~023f804e59.en.html", "images": []}]}, {"theme": "AI & Tech sell-off", "category": ["ai_tech", "equities"], "consensus": "Almost everyone sees a de-risking, not the end of the AI cycle. On Thursday Nov 5 the S&P 500 fell 4.4% (worst day since April 2025, per Yardeni), the Nasdaq 100 6.4% and the Philadelphia Semiconductor index 12.3% (UBS; ~38% drawdown since June), with the VIX up more than 65% intraday and 430 of 503 S&P stocks lower (Franklin Templeton). Cloud growth is still accelerating (UBS: Google Cloud +103% y/y, Azure +48%, Oracle +62%), and the trigger was a mix of capex financing worries (Alphabet and Meta posted negative Q3 free cash flow) and the election's implications for data-center permitting, power and water.", "divergence": "The disagreement is about what to do. UBS calls the sell-off overdone, forecasts AI capex of $1.0tn in 2026, $1.4tn in 2027 and $1.5tn in 2028, and notes proposed US capacity of ~400GW against its ~90GW-by-2030 assumption, while still warning of 'mid-cycle capex indigestion' as financing shifts to debt, leases and supplier financing. Invesco's Brian Levitt says the build was 'due for a reset' but demand for compute keeps growing; Citi's Dirk Willer recommends buying the dip, with a fall in oil as the trigger for rotation; BCA's Marko Papic says the supercycle has room to run and that falling token prices reflect an LLM price war that is feeding data-center profitability, so the tactical swing factor is whether Trump capitulates on Iran; and Yardeni calls it a speed bump and keeps a 7,900 S&P year-end target. On the other side, RBC stays on the sidelines in Tech after its mid-October downgrade (OW Health Care, newly constructive on small caps), Amundi and BCA's Jeremie Peloso argue for rotation to non-US and defensive equities, Standard Chartered trims global equities to Core but adds a tactical US IT idea, and JPMorgan frames the blue wave as potentially favoring hyperscalers that can self-fund. Gavekal's Tan Kai Xian, despite Nvidia -14.5%, Meta -17.1% and Alphabet -20.4% since early October, makes a case for more mega-cap outperformance.", "items": [{"source": "ubs", "name": "UBS CIO", "thesis": "Nov 6 daily: Nasdaq 100 -6.4%, S&P -4.4%, SOX -12.3%; Nikkei and Kospi -6%, Taiwan -4.5%. Sees de-risking not a change in fundamentals; sees upside in broad equity indices over 6-12 months; leaders vs laggards will be set by power access, permitting, financing and execution.", "url": "https://www.ubs.com/us/en/wealth-management/insights/investment-research/insights-display-adp/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-06112026.html?caasID=CAAS-ActivityStream", "images": []}, {"source": "ubs", "name": "UBS CIO", "thesis": "Nov 2 daily: Alphabet kept $195-205bn 2026 capex but posted negative FCF and signaled higher 2027 spend (shares -13%); Meta lifted its 2026 capex floor to $135-145bn (-7%); Microsoft trimmed 2026 capex to $170bn from $175bn. Cloud growth acceleration supports monetization.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-02112026.html", "images": []}, {"source": "invesco", "name": "Invesco", "thesis": "Brian Levitt: 'A reset is not the end of the AI story'. Nasdaq -5% and SOX nearly -11% intraday on Nov 5; some of the semiconductor ecosystem extended too far for near-term demand; 41 data-center-related ballot measures across 10 states, voters backing restrictions.", "url": "https://www.invesco.com/us/en/insights/reset-not-end-artificial-intelligence-story.html", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "Marko Papic (Nov 3): October was bad for equities, great for oil; supercycle not ending; bullish tactical view that oil falls imminently, forcing a short squeeze that lifts equities, with the swing factor Trump capitulating on Iran.", "url": "https://www.bcaresearch.com/reports/capitulation-you-stocks-or-trump-iran-03-11-2026/227405", "images": []}, {"source": "citi_gps", "name": "Citi", "thesis": "Markets Edition podcast (Willer, Saunders): cautious on signals but open to the AI bubble not having peaked; recommended strategy is buy the dip, with a drop in oil triggering a big sector rotation.", "url": "https://www.citigroup.com/global/insights/markets-edition-halloween-pullback-tactical-or-something-more-sinister", "images": []}, {"source": "yardeni_research", "name": "Yardeni Research", "thesis": "Earnings-led bull market; valuations falling as earnings soar; sticks with 7,900 S&P year-end target; AI backlash a speed bump. S&P -2.7% and Nasdaq -4.9% on the week, fourth straight weekly loss.", "url": "https://yardeni.com/research/quicktakes/2026/11/07/us-markets-call-s-p-500-valuation-dives-as-earnings-soar", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "thesis": "Nasdaq -5.5% into correction territory, Dow -1,800+ points, VIX biggest one-day jump in over two years; crowded AI trades offsides; market still up ~9% YTD; AppLovin +30% on earnings shows dispersion.", "url": "https://www.franklintempleton.com/articles/en/2026/11/when-the-index-falls-4-the-real-story-is-underneath", "images": []}, {"source": "rbc", "name": "RBC Capital Markets", "thesis": "Stays on the sidelines in Tech after mid-October downgrade; reiterates OW Health Care; turns constructive on small caps vs large caps.", "url": "https://www.rbccm.com/en/insights/2026/11/still-on-the-sidelines-with-tech", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Since early Oct Nvidia -14.5%, Meta -17.1%, Alphabet -20.4%; cap-weighted S&P underperformed equal-weight by 6pp since end-September; argues there are solid reasons the mega-cap era is not ending. Teaser only.", "url": "https://research.gavekal.com/teaser/the-case-for-more-mega-cap-outperformance/", "images": []}, {"source": "jpmorgan", "name": "J.P. Morgan", "thesis": "'The blue wave is changing the AI trade': potential scrutiny around new data centers could give hyperscalers an edge as investors reprice regulatory risk. Teaser only.", "url": "https://www.jpmorgan.com/insights/markets-and-economy/top-market-takeaways/tmt-the-blue-wave-is-changing-the-ai-trade", "images": []}]}, {"theme": "Energy, Iran & Commodities", "category": ["energy", "commodities", "geopolitics"], "consensus": "The US-Iran war remains the dominant energy driver and inventories are depleted. Brent hit ~$118 on Oct 30 (UBS), fell 8% to ~$95 after the election on diplomacy hopes (Qatar mediation), then bounced to ~$100 and ~$98 by Nov 6. The World Bank notes oil inventories fell ~2.4 mb/d between March and September, European diesel's premium to Brent averaged a record ~$91/bbl in September, and its October CMO has metals +28% and precious metals up nearly 40% in 2026. UBS has gold near $4,070/oz. OPEC+'s seven voluntary-cut countries held December output and meet again Nov 29.", "divergence": "The question is whether the risk premium fades. Standard Chartered says the Democratic win curbs Trump's war powers and expects oil to ease toward $80/bbl over 6-12 months; BCA's Papic expects oil to fall imminently; Citi's Willer links the equity rotation to falling oil. UBS is more cautious: global inventories have fallen sharply, pledged strategic reserve releases are largely complete, freight is at records and Chinese imports are recovering, so undersupply can keep prices elevated, and a renewed strike remains possible. RBC's pre-election note (Oct 30) went further, saying US escalation looked increasingly likely and could be either a final strike before withdrawal or a regime-change operation, with Houthi entry widening the conflict. Wood Mackenzie adds a structural counterpoint: demand peaks in 2032 and ~20% of global refining capacity faces closure risk.", "items": [{"source": "world_bank", "name": "World Bank", "thesis": "Brent above $115 in late October then ~$95 in early November; oil inventories down ~2.4 mb/d Mar-Sep; global output -9 mb/d y/y in Q2 and -7 mb/d in Q3 (mostly Saudi Arabia and Iraq); record European diesel premium; refinery damage delaying product exports.", "url": "https://blogs.worldbank.org/en/opendata/depleted-inventories-leave-oil-markets-exposed-to-further-supply", "images": []}, {"source": "world_bank", "name": "World Bank", "thesis": "Commodity Markets Outlook in eight charts: metals and minerals +28% in 2026, precious metals nearly +40%; risks tilted to the upside (prolonged Middle East hostilities, El Niño, Black Sea disruptions).", "url": "https://blogs.worldbank.org/en/developmenttalk/the-commodity-markets-outlook-in-eight-charts4", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Oil -12% in a week; geopolitical premium to fade, oil to ease toward $80/bbl over 6-12 months; oil-driven disinflation lets central banks be less aggressive.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-6-11-2026/?mvog=1", "images": []}, {"source": "rbc", "name": "RBC Capital Markets", "thesis": "Oct 30: US military escalation against Iran increasingly likely; Houthi entry widens the war; Democratic control would intensify efforts to control war funding via defense legislation.", "url": "https://www.rbccm.com/en/insights/2026/10/margins-matter-in-us-midterm-elections", "images": []}, {"source": "bridgewater", "name": "Bridgewater", "thesis": "Dan Yergin podcast: the Iran war as 'the mother of all supply shocks', energy security reshaping markets, and the race to power AI. Highlights only.", "url": "https://www.bridgewater.com/research-and-insights/pulitzer-prize-winner-dan-yergin-on-how-the-iran-war-is-reshaping-the-energy-map-and-the-race-to-power-ai", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "thesis": "Refined product demand 105 mb/d rising to 108 mb/d by 2032 then declining; ~20% of global refining capacity on a 'downward escalator' with closure risk.", "url": "https://www.woodmac.com/press-releases/one-in-five-refineries-at-closure-risk-as-global-oil-demand-peaks-in-2032/", "images": []}]}, {"theme": "Bonds, Duration & US Fiscal", "category": ["rates", "credit"], "consensus": "Yields are high and the structure of the Treasury market has changed. The 10-year touched 5% in September for the first time since 2007 on a closing basis (Apollo), mostly real yield (+72bp of the +83bp YTD move), and was ~4.84% on Nov 6 (UBS). The 30-year mortgage rate was 7.5% in October (PIMCO). Houses generally see income value in bonds but prefer the belly of the curve.", "divergence": "PIMCO's Dan Ivascyn is the most constructive: now is a time to lock in yields, he is more constructive on US duration and sees attractive opportunities outside the US with better fiscal conditions. Standard Chartered limits duration to 3-7 years and prefers BBB-to-BB credit as AI-related bond supply eases; Amundi favors intermediate US maturities; UBS's Leslie Falconio says September's yield spike was growth-driven and October's reversal is 'a bit overdone', with credit spreads widening on issuance digestion and slower-growth fears she does not share. Gavekal's Gave says yields have likely risen enough to start buying Treasuries in the short term, but the structural worry is elsewhere: France ('uninvestible' for many) with BNY showing OAT-Bund spreads at 140bp, the widest since 2012, and Le Pen the poll favorite for April 2027. Brookings' Robin Brooks goes the other way structurally: Treasuries' convenience yield is eroding, implying higher borrowing costs and potentially a weaker dollar.", "items": [{"source": "pimco", "name": "PIMCO", "thesis": "Dan Ivascyn: 'a very exciting time for income generation'; lock in yields; more constructive on US rates and on non-US opportunities; a flexible high-quality strategy over 3-5 years is 'highly likely to earn that yield'.", "url": "https://www.pimco.com/us/en/resources/video-library/media/a-higher-starting-point", "images": []}, {"source": "apollo_slok", "name": "Apollo Academy", "thesis": "Real Estate in a 5% World: 10y above 5% in Sept; 83bp YTD rise to Sept 15 (TIPS +72bp, breakevens +13bp); NCREIF cap-rate spread to the 10y ~0.6pt vs 2.96pt 2001-19 average; real estate spread to Treasuries below Baa spread in 16 of 17 quarters; selective opportunities only where income pays for the extra risk.", "url": "https://www.apolloacademy.com/real-estate-in-a-5-world/", "images": []}, {"source": "ubs", "name": "UBS (Leslie Falconio)", "thesis": "Treasury reversal in October is overdone; real yields and term premium fell; spreads widening on issuance and slower-growth fears; dispersion in lower credit quality; Fed still expected to hike by year-end.", "url": "https://www.ubs.com/us/en/wealth-management/insights/ubs-studios/2026/bond-market-reversal.html", "images": []}, {"source": "bny", "name": "BNY Investments", "thesis": "France: OAT-Bund spread 140bp, highest since 2012; Le Pen leads polls for April 2027; default risk very low, spreads could still widen further.", "url": "https://www.bny.com/investments/us/en/individual/articles/markets-and-economy/le-deluge-on-the-brink-of-a-french-fiscal-crisis.html", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Louis-Vincent Gave: yields have most likely risen enough to buy Treasuries short term; France is 'uninvestible' for many PMs, with ECB and European insurers likely left holding the bag. Teaser only.", "url": "https://research.gavekal.com/teaser/a-silver-lining-or-a-shovel/", "images": []}, {"source": "brookings", "name": "Brookings", "thesis": "Robin Brooks: the US Treasury convenience yield has been eroding for a decade; markets now charge a risk premium vs the rest of the G10, implying higher borrowing costs and potentially a weaker dollar.", "url": "https://www.brookings.edu/articles/is-the-us-exorbitant-privilege-eroding/", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "Policy options to lower mortgage rates (30-year at 7.5% in October); warns Trump's housing executive order could raise rates if applied to refinancings; wants changes limited to new purchases.", "url": "https://www.pimco.com/us/en/insights/policy-options-are-available-now-to-lower-us-mortgage-rates", "images": []}]}, {"theme": "Europe & UK", "category": ["equities", "growth"], "consensus": "Europe is no longer priced as a basket case, but the quality of its recovery is disputed. Europe held up relative to the US in the AI sell-off, with eurozone equities broadly in line with US and global markets YTD. Eurozone Q3 growth slowed to 0.4% q/q and the ECB warns energy will lift inflation and cut growth (BNP Paribas).", "divergence": "BCA is publicly split on the same continent. Chief economist Peter Berezin's 'Europe is Doomed' says structural problems (productivity, demographics, welfare state) are deep and unlikely to be fixed before a crisis, so investors should 'sell Europe' on rallies. Equity strategist Jeremie Peloso says 'European equities ain't so bad after all': falling energy prices and cracks in the AI boom favor rotating from US into cheaper European stocks, with defensives. Franklin Templeton argues for a 'resilience re-rate' (FTSE All-Share +13.4% vs MSCI EMU +12.2% YTD), and Deutsche Bank's survey of 1,200 non-European executives finds over a third rank Europe the world's most attractive region for their business. Gavekal's Gave and BNY are far more negative on France.", "items": [{"source": "bca_research", "name": "BCA Research", "thesis": "Peter Berezin: Europe faces deep structural problems; dismantling large parts of the welfare state may be needed but is unlikely before a major crisis; 'sell Europe' on rallies.", "url": "https://www.bcaresearch.com/reports/europe-doomed-05-11-2026/227449", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "Jeremie Peloso: Europe was shunned while AI could do no wrong; that trade looks tired; favors rotating from US to European equities, defensives lead; Europe can win the relative race even if both fall.", "url": "https://www.bcaresearch.com/reports/european-equities-aint-so-bad-after-all-06-11-2026/227462", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "thesis": "'Europe's Resilience Re-Rate': Europe better prepared for the energy shock; FTSE All-Share +13.4% vs MSCI EMU +12.2% YTD.", "url": "https://www.franklintempleton.com/articles/en/2026/11/europes-resilience-re-rate", "images": []}, {"source": "deutsche_bank", "name": "Deutsche Bank", "thesis": "Global Sentiment Survey on Europe 2026 (1,200 executives in 13 non-European markets): >1/3 rank Europe the most attractive region; 45% of those already invested rank it first choice.", "url": "https://flow.db.com/Topics/macro-and-markets/europe-gets-the-thumbs-up-from-global-investors", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "thesis": "Monthly Market Views: tech divide, rising bond yields and China's industrial renaissance; government bond market now driven by price-sensitive buyers; markets price two more Fed hikes over 12 months.", "url": "https://www.bnpparibas-am.com/en-us/portfolio-perspectives/monthly-market-views-the-tech-divide-rising-bond-yields-and-chinas-industrial-renaissance/", "images": []}]}, {"theme": "Crypto & Digital Assets", "category": ["crypto"], "consensus": "Crypto traded as a high-beta tech proxy this week. Bitcoin fell just over 5% on Nov 5 with more than $1bn of leveraged liquidations and miners repositioned as AI/data-center plays hit hardest (CoinShares); it had hovered around $77k in late October. The Binance hack, roughly $6.3-6.4bn drained across ~10 chains on Oct 29-30 and attributed to North Korea's TraderTraitor (Galaxy, Chainalysis), with ~$2.5-3bn frozen, is described as the largest theft ever.", "divergence": "On the election's crypto impact the shops differ in tone. Galaxy's Alex Thorn highlights the loss of crypto-friendly legislators (Husted lost to Sherrod Brown despite ~$40m of crypto PAC spending for him; Steil and others lost) and the landscape shift for crypto and AI. CoinShares says the CLARITY Act now faces a harder path but matters less because GENIUS is law and the SEC/CFTC provide pathways, so the election is about the pace of reform, not Bitcoin's medium-term direction. Delphi Digital's headline argues a 'broken Congress' is bullish for crypto (podcast; body not summarized).", "items": [{"source": "galaxy_digital", "name": "Galaxy Research", "thesis": "Binance lost ~$6.3bn across 10 blockchains; attacker used EIP-7702 on a hot wallet with 50 pre-signed authorizations; attributed to Lazarus-linked TraderTraitor; even after ~$2.5-3bn in freezes it is the biggest heist ever.", "url": "https://www.galaxy.com/insights/research/here-we-go-again-binance-loses-6-3b-in-largest-robbery-in-history", "images": []}, {"source": "chainalysis", "name": "Chainalysis", "thesis": "Funds began leaving Binance hot wallets ~4:20pm ET Oct 29; ~$6.4bn of unauthorized transfers; tracing links the theft to North Korea. Chainalysis separately disclosed its own security incident, with products restored Nov 7.", "url": "https://www.chainalysis.com/blog/binance-exploit-latest-findings-and-response/", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Research", "thesis": "Democrats flipped 7 Senate seats, ~35 House seats, 5 governorships; notable pro-crypto losses incl. Husted (OH), Steil (WI); House Financial Services chair French Hill's race too close to call.", "url": "https://www.galaxy.com/insights/research/democratic-midterm-wins-crypto-ai-policy", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "Nov 6 update: BTC -5% with Nasdaq -5.5%, >$1bn liquidations; election matters for pace of reform; CLARITY Act harder but less critical.", "url": "https://coinshares.com/insights/research-data/market-update-06-11-2026/", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Research", "thesis": "Kazakhstan allocates $100m to crypto funds as long-term money accumulates.", "url": "https://www.galaxy.com/insights/research/kazakhstan-crypto-funds-bitcoin-etfs", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "Tokenised stocks were worth $3.91bn on 30 Sep 2026, +842% y/y; tokenised commodities +267%, funds +97%.", "url": "https://coinshares.com/insights/research-data/token-terminal-hybrid-finance-q3-report/", "images": []}]}], "B_calls": [{"source": "ubs", "name": "UBS CIO", "call": "Sees potential for gains in broad equity indices over 6-12 months and calls the AI-led sell-off overdone; AI capex forecast $1.0tn (2026), $1.4tn (2027), $1.5tn (2028); advises resilience via exposure beyond tech and diversification.", "category": ["equities", "ai_tech"], "url": "https://www.ubs.com/us/en/wealth-management/insights/investment-research/insights-display-adp/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-06112026.html?caasID=CAAS-ActivityStream", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "call": "Global equities trimmed to Core (Neutral stocks/bonds), OW gold, OW US and Asia ex-Japan equities, India upgraded to OW; OW EM USD bonds (corporates over sovereigns, 3-7yr duration). After the election: tactical US IT exposure as VIX tops 25; belly of DM curve; BBB-BB corporates; modestly weaker USD over 6-12 months; oil toward $80; equities 8-10% annual returns in mid-cycle; AUD/USD forecasts 0.72 (3M) and 0.74 (12M).", "category": ["equities", "rates", "fx"], "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-6-11-2026/?mvog=1", "images": []}, {"source": "yardeni_research", "name": "Yardeni Research", "call": "Keeps S&P 500 year-end target at 7,900; views AI backlash as a speed bump and the post-election sell-off as a buying opportunity.", "category": ["equities"], "url": "https://yardeni.com/research/quicktakes/2026/11/07/us-markets-call-s-p-500-valuation-dives-as-earnings-soar", "images": []}, {"source": "bca_research", "name": "BCA Research", "call": "Berezin: 'sell Europe' on rallies. Peloso: rotate from US to European equities, favor defensives. Papic: bullish tactically, expects oil to fall and equities to squeeze higher.", "category": ["equities", "geopolitics"], "url": "https://www.bcaresearch.com/reports/europe-doomed-05-11-2026/227449", "images": []}, {"source": "rbc", "name": "RBC Capital Markets", "call": "Market weight/sidelines on Tech following mid-October downgrade; overweight Health Care; turns constructive on Small Caps vs Large Caps.", "category": ["equities"], "url": "https://www.rbccm.com/en/insights/2026/11/still-on-the-sidelines-with-tech", "images": []}, {"source": "pimco", "name": "PIMCO", "call": "Constructive on US rates and non-US duration; recommends locking in yield with a high-quality flexible approach over 3-5 years.", "category": ["rates"], "url": "https://www.pimco.com/us/en/resources/video-library/media/a-higher-starting-point", "images": []}, {"source": "amundi", "name": "Amundi", "call": "Favors intermediate US Treasury maturities; diversify into non-US and non-tech equities after the election.", "category": ["rates", "equities"], "url": "https://research-center.amundi.com/article/what-democratic-sweep-means-markets", "images": []}, {"source": "vanguard", "name": "Vanguard", "call": "Expects a second Fed hike in December but less tightening than markets price; core PCE near 2.5% by late spring 2027 as tariff effects roll off.", "category": ["rates"], "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/inflation-remains-front-center-as-fed-holds.html", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "call": "BoE Bank Rate peaks at 4.25% (December hike a coin flip); BoJ hikes in December and April to 1.75%.", "category": ["rates"], "url": "https://www.oxfordeconomics.com/resource/uk-hawkish-monetary-policy-committee-puts-a-december-hike-on-the-table/", "images": []}, {"source": "citi_gps", "name": "Citi", "call": "Buy the dip in equities; global GDP 2.7% in 2026 and 2.8% in 2027; a drop in oil would trigger a big sector rotation.", "category": ["equities", "growth"], "url": "https://www.citigroup.com/global/insights/markets-edition-halloween-pullback-tactical-or-something-more-sinister", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "call": "US housing 2027: existing home sales 3.9m (vs 4.0m in 2026), home prices +0.8% Dec/Dec after +1.1% in 2026; mortgage rates expected to decline next year, rebounding e": "PIMCO", "title": "With Echoes of 1974, a Decisive Victory for the Democratic Party", "summary": "Libby Cantrill argues the result looks like 1974 rather than the 2006 wave that the generic ballot (+9 D) and enthusiasm gap (+10) implied: Democrats won nationally by ~13 points. Issues were affordability and presidential overreach (65% of Texas voters said Trump went too far on immigration). Democrats look set for +40-45 House seats (~260 total, largest since 2008), +7 Senate seats (56-44 if Mississippi and Alaska fall) and ~28 governorships. Candidate quality and local platforms mattered, and Trump's endorsements (e.g., Paxton in Texas) may have hurt. The key market takeaway: the risk to the AI trade comes from states, not Washington, with all 45+ data-center restriction ballot initiatives passing and several new governors ready to push moratoria; expects 2027 to focus on good-government reforms and constraining the executive.", "url": "https://www.pimco.com/us/en/insights/with-echoes-of-1974-a-decisive-victory-for-the-democratic-party", "images": []}, {"source": "ubs", "name": "UBS CIO", "title": "Chip rout tests AI investment case (Nov 6) and Tech sell-off highlights scrutiny of AI spending (Nov 2)", "summary": "UBS lays out the bull case for the AI cycle after the worst session since April 2025: cloud growth accelerating (Google Cloud +103%, Azure +48%, Oracle +62%), compute costs under 60% of a leading lab's revenue, but a shift in funding from hyperscaler cash flow to debt, equity, leases and supplier financing and 'mid-cycle capex indigestion' risk. Signposts for a real downturn: slowing AI revenue growth, weakening cloud utilization, algorithmic efficiency collapsing compute needs, or tighter financial conditions. State-level opposition may delay, relocate or raise costs of data centers but proposed capacity (~400GW) far exceeds UBS's 90GW assumption.", "url": "https://www.ubs.com/us/en/wealth-management/insights/investment-research/insights-display-adp/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-06112026.html?caasID=CAAS-ActivityStream", "images": []}, {"source": "citi_gps", "name": "Citi Research (Nathan Sheets)", "title": "The Global Economy's Tenuous Balance: Resilience Amid Uncertainty", "summary": "Global growth forecast 2.7% for 2026 and 2.8% for 2027, slightly stronger than last month's forecast, led by the US; Brent near $115 as the US-Iran conflict pushed energy and inflation risks higher, prompting more hawkish central banks; AI remains a major growth driver (strong manufacturing PMIs in Taiwan and Korea) but financial excesses, weakening political support and cyber risks threaten sustainability; French fiscal worries add to sovereign debt pressure.", "url": "https://www.citigroup.com/global/insights/the-global-economys-tenuous-balance-resilience-amid-uncertainty", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "title": "Transitioning to mid-cycle - Global Market Outlook (30 Oct)", "summary": "Trims equities to Core (quant model score at levels associated with flat-to-modestly-negative returns), US and Asia ex-Japan preferred, India upgraded to OW, OW gold (EM central bank demand offsets higher yields), OW EM USD bonds with 3-7 year duration limit. Warns that higher yields may bite as debt-financed capex rises as a share of AI spending, raising the risk of an expectations reset rather than a recession; expects Fed hikes not to be overly restrictive.", "url": "https://www.sc.com/sg/market-outlook/global-market-outlook-30-10-2026/?mvog=1", "images": []}, {"source": "pimco", "name": "PIMCO", "title": "Macro Signposts: Campaign Spending - The Hidden Boost Behind U.S. Consumer Resilience", "summary": "Record midterm spending added roughly 50bp to real consumption growth through the first three quarters of 2026 (political spending counts toward PCE), and OBBBA retroactive deductions added ~$160bn to household cash. These offset 40% highe // ---------- helpers ----------
const CAT_VARS = {
  rates: 'var(--cat-rates)',
  growth: 'var(--cat-growth)',
  fx: 'var(--cat-fx)',
  equities: 'var(--cat-equities)',
  credit: 'var(--cat-credit)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  commodities: 'var(--cat-commodities)',
  geopolitics: 'var(--cat-geopolitics)',
  ai_tech: 'var(--cat-ai_tech)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }
function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}
function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}
function pills(cats) {
  if (!cats) return '';
  if (Array.isArray(cats)) return cats.map(pill).join(' ');
  return pill(cats);
}
function externalLink(url, label) {
  if (!url) return '';
  return `<a class="item-link" href="${escapeAttr(url)}" target="_blank" rel="noopener">${label || 'link →'}</a>`;
}
function nameLink(url, name) {
  if (!name) return '';
  if (!url) return `<span class="item-source">${escapeHtml(name)}</span>`;
  return `<a class="item-source" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderThemeItem(it) {
  return `
    <div class="theme-item">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.thesis || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderTheme(theme) {
  const items = (theme.items || []).map(renderThemeItem).join('');
  return `
    <div class="theme">
      <div class="theme-head">
        ${pills(theme.category)}
        <div class="theme-title">${escapeHtml(theme.theme || '')}</div>
      </div>
      <div class="theme-stance">
        ${theme.consensus ? `<div class="theme-line consensus"><span class="lbl">Consensus</span>${renderBold(theme.consensus)}</div>` : ''}
        ${theme.divergence ? `<div class="theme-line divergence"><span class="lbl">Divergence</span>${renderBold(theme.divergence)}</div>` : ''}
      </div>
      ${items ? `<div class="theme-items">${items}</div>` : ''}
    </div>`;
}

function renderCall(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${pills(it.category)}
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.call || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderDeepRead(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url, 'read →')}
      </div>
      ${it.title ? `<div class="item-title">${escapeHtml(it.title)}</div>` : ''}
      <div class="item-text">${renderBold(it.summary || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderChart(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.chart || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderHouseView(hv) {
  const name = hv.name || hv.source || '';
  const nameHtml = hv.url
    ? `<a class="hv-name" href="${escapeAttr(hv.url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`
    : `<span class="hv-name">${escapeHtml(name)}</span>`;
  return `
    <div class="hv-row">
      ${nameHtml}
      <span class="hv-stance">${renderBold(hv.stance || '')}</span>
    </div>`;
}

function renderSection(letter, name, items, render, extraClass) {
  if (!items || !items.length) return '';
  const body = items.map(render).join('');
  const cls = 'section' + (extraClass ? (' ' + extraClass) : '');
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderTopStats(d) {
  const parts = [];
  const p = d.period || {};
  const is = d.input_stats || {};
  const cv = d.coverage || {};
  if (p.from && p.to)
    parts.push(`period <strong>${escapeHtml(p.from)} → ${escapeHtml(p.to)}</strong>`);
  else if (p.lookback_days != null)
    parts.push(`lookback <strong>${p.lookback_days}d</strong>`);
  if (is.total_articles != null) parts.push(`articles <strong>${is.total_articles}</strong>`);
  if (is.sources_present != null) parts.push(`sources <strong>${is.sources_present}</strong>`);
  if (is.after_filter != null) parts.push(`after filter <strong>${is.after_filter}</strong>`);
  if (cv.coverage_pct != null) {
    const pct = (cv.coverage_pct <= 1 ? cv.coverage_pct * 100 : cv.coverage_pct);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  } else if (cv.sources_covered != null && cv.sources_total != null) {
    parts.push(`coverage <strong>${cv.sources_covered}/${cv.sources_total}</strong>`);
  }
  return parts.join(' | ');
}

function reportDate(d) {
  if (d.period && d.period.to) return d.period.to;
  if (d.collected_at) return String(d.collected_at).slice(0, 10);
  return '';
}

// ---------- interactions ----------
function toggleSection(headEl) { headEl.parentElement.classList.toggle('open'); }
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('lightbox').classList.contains('open')) {
    closeLightbox();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = reportDate(d);
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  const s = d.sections || {};
  const out = [
    renderSummary(d.summary),
    renderSection('A.', 'Debates — Consensus vs Divergence', s.A_debates,    renderTheme),
    renderSection('B.', 'Key Calls & Positioning',           s.B_calls,      renderCall),
    renderSection('C.', 'Notable Deep Reads',                s.C_deep_reads, renderDeepRead,
                  'section-deepreads'),
    renderSection('D.', 'Charts & Data',                     s.D_charts,     renderChart),
    renderSection('E.', 'House Views',                       s.house_views,  renderHouseView),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = out || '<div class="empty">No report data.</div>';

  // Auto-open Summary's section view: first two sections open by default.
  document.querySelectorAll('.section').forEach((sec, i) => {
    if (i < 2) sec.classList.add('open');
  });
}

renderReport(REPORT_DATA);
</script>
