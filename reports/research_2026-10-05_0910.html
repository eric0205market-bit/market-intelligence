<script>
const ITEMS = [{"cat": "macro", "urgency": "act", "source": "Authers / Bloomberg Points of Return", "title": "The 10-year is 'trading like a meme stock' — closed at 5.29% after a weak NFP", "idea": "Authers: the 10y ended the week +6bp, closing at 5.29%, even though payrolls missed and Fed deputies Jefferson and Williams coordinated dovish guidance on Friday. An investment banker's line: the most liquid long-term security on the planet is 'trading like a meme stock'. Futures still price a 4.75% funds rate a year out.", "angle": "Bad news plus dovish Fed was not bought: that is a term-premium / supply story, not a policy-path story. Relevant for any duration or long-bond trade.", "tweetA": "Weak jobs, dovish Fed speakers, and the 10y still sold off to 5.29%. When bad news can't rally bonds, the Fed isn't the marginal price setter anymore. Supply is.", "tweetB": "Which part of the curve does Warsh actually control? Front end priced 4.75% a year out, long end ignoring every dovish headline. That gap is the whole Q4 story.", "charts": {"count": 2, "hot": true, "desc": "Chart of 10y over the week with ISM and NFP marks; chart of futures-implied Fed path."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-05/tech-can-t-shield-stocks-from-the-bond-rout-forever", "id": 1}, {"cat": "labor", "urgency": "deep", "source": "Authers / Bloomberg Points of Return", "title": "Wage growth below inflation for a sixth straight month — and the Fed is still talking 4 more hikes", "idea": "Average hourly earnings growth is in marked decline and likely to print below headline CPI (due Oct 14) for the sixth successive month. Authers argues affordability is a growing problem and the economy may not withstand 'another four rate hikes after all'.", "angle": "Real wage squeeze plus a hiking Fed plus a +$100 Brent is a consumer-stress setup that equity breadth is already pricing.", "tweetA": "Real wages negative six months running while the curve prices 4.75% funds. Someone has to give, and it won't be the bond market.", "tweetB": "Everyone argues about whether inflation is sticky. Nobody asks who is still paying for it. Wages below CPI for six months is the answer, and it shows up in the 51% of stocks already down 20%.", "charts": {"count": 1, "hot": false, "desc": "Chart of AHE growth vs CPI."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-05/tech-can-t-shield-stocks-from-the-bond-rout-forever", "id": 2}, {"cat": "macro", "urgency": "deep", "source": "Authers / Bloomberg Points of Return", "title": "Bessent: 'I can't control the bond market' — Treasury's August buyback push failed", "idea": "Treasury kept volatility capped after Liberation Day until the Iran attack, increased repurchases in August, and yields still rose. Bessent now admits 'I can't control the bond market'. Authers adds that volatility tightens financial conditions by making bonds harder to use as collateral, and the lid on vol 'appears to have come off'.", "angle": "The put on yields is gone. Relevant to MOVE, repo collateral, and quasi-YCC odds.", "tweetA": "The market tested the Treasury put and it expired worthless. 'I can't control the bond market' is the most important Bessent quote of the year.", "tweetB": "Higher MOVE = tighter collateral = tighter policy without a single hike. Authers buried the plumbing point. That's how a bond selloff becomes an equity problem.", "charts": {"count": 2, "hot": false, "desc": "Chart of bond volatility with Treasury buyback intervention marked."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-05/tech-can-t-shield-stocks-from-the-bond-rout-forever", "id": 3}, {"cat": "energy", "urgency": "deep", "source": "Authers / Bloomberg Points of Return", "title": "Brent >$100 vs a $88 200-DMA; gasoline +54%, diesel +84% since the war began", "idea": "Brent sits far above its 200-day average of $88. Diesel has spent 229 days above its 200DMA, the second-longest streak since the pandemic. Hybrids' share of US sales peaked at 17.1% in May from 13.9% in February, and Oxford Economics expects ~200k hybrids a month to hold.", "angle": "Product cracks matter more than crude: diesel +84% is the freight and industrial input cost. Hybrids, not EVs, are the demand-destruction substitute.", "tweetA": "Diesel +84% since the war started and 229 days above its 200DMA. Crude gets the headlines, but the real inflation is in the product tank.", "tweetB": "Gas at +54% and the beneficiary is hybrids at 17% share, not EVs. The market is pricing 'EV recovery'. The data says 'Toyota'.", "charts": {"count": 3, "hot": true, "desc": "Chart of diesel vs 200DMA streak; Oxford Economics chart of hybrid share peaking at 17.1%."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-05/tech-can-t-shield-stocks-from-the-bond-rout-forever", "id": 4}, {"cat": "energy", "urgency": "watch", "source": "Authers / Bloomberg Points of Return", "title": "BNEF cuts US EV share 2030 forecast to 17% — from 48% in 2024", "idea": "BloombergNEF's 2030 US EV share is now 17% vs 27% last year and 48% in 2024. Meanwhile Tesla and Rivian sales rose despite tax-credit removal, and China, the leading EV exporter, sees the oil shock as an energy-security win; Gavekal's Kroeber questions whether a closed ecosystem can win without federal support.", "angle": "Policy withdrawal is handing the integrated EV supply chain to China; oil spikes accelerate it.", "tweetA": "BNEF EV share for 2030: 48% (2024 view) → 27% → 17%. That's the cost of policy whiplash, and China is collecting it.", "tweetB": "US oil shock, US policy removed, Chinese EV exports up. The war is a Chinese industrial policy tailwind. Nobody puts that in the Iran scenario tree.", "charts": {"count": 2, "hot": false, "desc": "Chart of Tesla share price drag since Dec; Chinese EV exports."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-05/tech-can-t-shield-stocks-from-the-bond-rout-forever", "id": 5}, {"cat": "macro", "urgency": "deep", "source": "Authers / Bloomberg Points of Return", "title": "Payrolls revised down 60k over two months — and a 2006 quote says nothing has changed", "idea": "Authers quotes Tchir: billions move on a number 'that even the people looking at the number don't believe'. He found an almost identical 2006 Barclays quote comparing payrolls to roulette. Warsh has a data task force on which numbers the Fed should heed.", "angle": "Data-quality risk: policy rates being set on a series with revisions larger than the print.", "tweetA": "Revisions bigger than the number itself, and the Fed has a 'data task force' to find something better. When the central bank is looking for new gauges, the old ones are already dead.", "tweetB": "20 years ago a strategist wrote that payrolls were a roulette wheel and the BLS was the croupier. Same joke, bigger notional. Real-time private employment data is a tradable edge now.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-05/tech-can-t-shield-stocks-from-the-bond-rout-forever", "id": 6}, {"cat": "geopolitics", "urgency": "act", "source": "Authers / Bloomberg Points of Return", "title": "Flavio Bolsonaro at 84% on Polymarket as Brazil votes — 'appears to have won big'", "idea": "Authers notes Flavio Bolsonaro was heading for a decisive first-round win, with Polymarket at 84% at time of writing, and promises analysis once the dust settles.", "angle": "Brazil political regime change: BRL, local curve, EWZ. Compare against the EM carry unwind in the same window.", "tweetA": "Polymarket had Bolsonaro at 84% before the count finished. Prediction markets are now the first draft of the election result, and the BRL curve is the second.", "tweetB": "Brazil flips right in the same month EM carry (MXN, ZAR) gave back most of its year. Brazil is the only EM story with a political catalyst against the funding squeeze.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-05/tech-can-t-shield-stocks-from-the-bond-rout-forever", "id": 7}, {"cat": "geopolitics", "urgency": "act", "source": "Tavi Costa", "title": "Brazil: Game On — stocks rose ~19x last bull cycle", "idea": "Costa: Brazilian stocks rose nearly 19-fold during the last major bull cycle, much of it under Lula. He sees another commodity boom with a more supportive political backdrop. Opening chart illustrates the previous cycle; he includes macro charts for conviction.", "angle": "Direct read-through of the election result into a commodity-cycle trade; EWZ, Vale, Petrobras.", "tweetA": "19x. That's what Brazil did in the last commodity supercycle. Now add a market-friendly government and a $100 Brent. I don't need the 19x to rhyme, just 10% of it.", "tweetB": "The sequence matters: commodity boom first, politics second last time. This time politics moved first. That's the part the 19x chart doesn't show.", "charts": {"count": 2, "hot": true, "desc": "Opening chart of Brazilian equities' ~19x last bull cycle; macro charts inside."}, "link": "https://tavicosta.substack.com/p/brazil-game-on", "id": 8}, {"cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom / Morgan Stanley (Mike Wilson)", "title": "51% of the Russell 3000 has already had a 20% drawdown since June", "idea": "Wilson: while the S&P is near highs, 51% of Russell 3000 stocks have suffered a 20% drawdown since June. Bond vol (MOVE) is the referee: calm = breadth repairs, elevated = index comes down. Break in breadth began after Jackson Hole on a hawkish Fed repricing, not oil. Prefers large-cap quality and EPS revisions; next AI trade shifts from enablers to adopters.", "angle": "Half the market is already in a bear market; index-level hedges are pricing the wrong thing.", "tweetA": "51% of Russell 3000 names down 20%+ since June. The S&P is at the highs. One of those two numbers is lying about what the market is.", "tweetB": "Wilson's 'AI adopters' call is the interesting bit: enablers got the capex, adopters get the margin. The trade flips when the enablers' multiple stops compensating for 5% yields.", "charts": {"count": 1, "hot": false, "desc": "Breadth chart: Russell 3000 drawdown share vs S&P."}, "link": "https://thedarksideoftheboom.substack.com/p/morgan-stanleys-mike-wilson-bond", "id": 9}, {"cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / Morgan Stanley (Nick Savone)", "title": "Brent–10y correlation at +60%: oil is now the transmission channel", "idea": "Savone: Brent's correlation with the US 10-year is about +60%, so every oil spike hits yields first, then equities via the discount rate. S&P forward EPS is up 38% in a year, with multiples compressing; French spreads are near euro-crisis levels; hedge funds are reluctant to add risk; agentic AI splits beneficiaries and disruption losers.", "angle": "Oil-up = yields-up = equities-down is a regime, not a coincidence. Trade oil shocks via rates first.", "tweetA": "Brent/10y correlation +60%. That's a stagflation regime fingerprint: oil is moving the discount rate, not just the P&L.", "tweetB": "S&P forward EPS +38% and multiples still compressing. Earnings are outrunning the discount rate. The risk is not earnings, it's the day EPS growth decelerates before yields do.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/morgan-stanleys-nick-savone-earnings", "id": 10}, {"cat": "credit", "urgency": "watch", "source": "Dark Side of the Boom / Morgan Stanley (Nick Savone)", "title": "French spreads back near euro-crisis levels; ECB has 'little room for error'", "idea": "Savone: French spreads are back near levels last seen in the euro crisis, with inflation and fiscal pressure leaving the ECB little room. Pasquariello (GS) separately says Europe has a harder path with sovereign stress in the background.", "angle": "Two banks flagging French sovereign stress in one morning. OAT/Bund and EU banks.", "tweetA": "French spreads near euro-crisis levels and the ECB has little room for error. Last time that mix ended with a bailout.", "tweetB": "Rates up in the US, spreads up in France, dollar index breaking out. Europe is where the global bond rout turns into a funding event.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/morgan-stanleys-nick-savone-earnings", "id": 11}, {"cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom / Goldman (Tony Pasquariello)", "title": "Can mega-cap tech stay duration-resistant? Momentum crushed in Jul–Aug, ripped in Sept", "idea": "Pasquariello: global rates are melting higher led by the US and Japan at the long end; equal-weight and small caps are losing ground while mega-cap tech holds on earnings, cash flow and buybacks. Momentum was smashed in July and August then ripped back in September. Asia is underowned, Japan a top equity story; Q4 starts with buybacks reopening.", "angle": "Mega-cap tech = the duration hedge nobody labels as such. The factor whipsaw is the tradable vol.", "tweetA": "The biggest US tech names are behaving as if the duration shock belongs to someone else. Fine, until buybacks and earnings stop outrunning a 5.3% hurdle.", "tweetB": "Momentum got smashed in July–August then ripped in September. That's not a factor, that's a gamma trade. And Japan is still the most underowned equity story.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/goldmans-tony-pasquariello-can-mega", "id": 12}, {"cat": "positioning", "urgency": "act", "source": "Dark Side of the Boom / Goldman (Cullen Morgan)", "title": "Non-dealers dumped ~$68B of S&P futures in six weeks while the VIX sleeps", "idea": "Cullen Morgan (GS): hedge fund gross leverage is high but net exposure is back near Liberation Day lows; Monetary Policy Optimism factor near record lows; non-dealers sold ~$68B of S&P futures in six weeks; sentiment gauge printed five straight negatives; yet VIX is subdued, while rates and credit flash stress. Tech is the only sector with real buying.", "angle": "Classic pain-trade setup into earnings: underexposed funds plus cheap convexity.", "tweetA": "$68B of S&P futures sold in six weeks, five straight negative sentiment prints, VIX asleep. Positioning says fear. Pricing says nothing. One of them is wrong, and the cheap one is the option.", "tweetB": "Gross high, net low, conviction gone. That's funds hedged with shorts rather than cash. If macro eases even slightly, the covering is the rally.", "charts": {"count": 1, "hot": false, "desc": "Chart of net vs gross leverage and CTA/non-dealer futures flows."}, "link": "https://thedarksideoftheboom.substack.com/p/goldmans-cullen-morgan-hedge-funds", "id": 13}, {"cat": "crypto", "urgency": "watch", "source": "Check On Chain", "title": "Bitcoin stair-stepping higher with no dips — STH behavior is the tell", "idea": "Checkonchain: the bear-market recovery isn't offering sidelined investors dips. When a correction comes, those who panic-buy near highs will become panic-sellers at the local low; Short-Term Holder profit-taking and futures leverage analysis set up a structural roadmap to the next ATH. Full analysis is paywalled.", "angle": "Positioning risk in BTC: late-chasing STH cohort. Compare with equity funds being underexposed.", "tweetA": "BTC is stair-stepping and the sidelined money is being forced in. That's the setup for the first real flush: STH cohorts always sell the first dip.", "tweetB": "Equities: funds de-grossing, $68B of S&P futures sold. BTC: no dips, STH chasing. Two risk assets, opposite positioning, same bond yield.", "charts": {"count": 1, "hot": false, "desc": "Charts inside (STH profit-taking, futures leverage) — worth opening."}, "link": "https://newsletter.checkonchain.com/p/still-stair-stepping-higher", "id": 14}, {"cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "OpenAI built an app store with no cash register — $149B of commissioned billings is the toll", "idea": "Parekh: ChatGPT (1.2B weekly users) now suggests apps in-conversation, has 'Sign in with ChatGPT' (16 launch partners), an enterprise marketplace with 30+ partners and 4,000+ apps for its Dots agents. No billing or revenue-share layer. Apple says the App Store ecosystem facilitated $1.4T in 2025; the $149B of digital goods billed through the store at 15–30% pays the toll.", "angle": "The fight is over payments/identity: who owns the agent checkout. Apple, GOOGL, OpenAI, Meta.", "tweetA": "OpenAI shipped discovery, identity, and distribution. Not billing. The $149B Apple tollbooth is the only part of the store that makes money, and it's the one thing they skipped.", "tweetB": "1.2B weekly users and no way to take a cut. Either the cut is coming (and Apple's 15–30% is the ceiling) or the fee comes out of ads. The first AI platform to ship checkout wins the bundle.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — AI Tech Value Stack chart worth opening."}, "link": "https://michaelparekh.substack.com/p/ai-ai-agents-at-the-app-store-gates", "id": 15}, {"cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "Instinct raised $1B at $10B; 40% of users handed it a credit card in 3 weeks", "idea": "Instinct, a personal agent with no app, raised $1B at a $10B valuation; over 40% of users handed it a credit card within three weeks. Meta's Muse hit #1 on the App Store and takes a small fee on completed transactions (not ads); Amazon blocked Muse from its site while Shopify signed on to agentic checkout; Grok Bot passed 400k weekly users in a month.", "angle": "Trust ramp: 40% card attach in 3 weeks is the adoption inflection. Agentic commerce is transaction take-rate, not ad rate.", "tweetA": "40% of Instinct's users gave an agent their credit card within three weeks. App stores took a decade to get that kind of trust. That's the adoption curve to watch.", "tweetB": "Amazon blocks Muse, Shopify opens checkout. An agent that shops for you skips the sponsored listings that fund Amazon's ads. The incentive map writes itself: $AMZN vs $SHOP.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-ai-agents-at-the-app-store-gates", "id": 16}, {"cat": "AI/infra", "urgency": "watch", "source": "Michael Parekh / AI-RTZ", "title": "Cloudflare: agent and bot traffic already exceeds human traffic", "idea": "Parekh cites Cloudflare: agent and bot traffic already exceeds human traffic and is headed to many times more. App stores, browsers and sites were built for h2h; the a2a layer needs its own versions. Part 2 tomorrow is the agent-to-agent web.", "angle": "Infra and monetization shift: who pays for agent traffic? CDN, bot management, identity.", "tweetA": "Cloudflare says agent traffic already exceeds human traffic. The web's economic model, ads priced on human attention, is being crawled by buyers who don't have any.", "tweetB": "If agents out-visit humans, 'traffic' stops meaning anything and 'paid access' becomes the product. $NET is selling the toll booth.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-ai-agents-at-the-app-store-gates", "id": 17}, {"cat": "tech", "urgency": "watch", "source": "Michael Parekh / AI-RTZ", "title": "Chesky: 'It's really up to Apple or Google, or somebody, to build a new platform'", "idea": "Airbnb's CEO told TechCrunch that agents need their own operating system; booking via Meta's Muse and Instinct 'does not work very well'. Airbnb runs over $100B annually through its platform and keeps AI search inside its own app. Apple Pay reportedly earns ~0.15% of each US credit card transaction from issuers; Microsoft pitches Copilot as the 'OS for work' on over a billion PCs.", "angle": "Agents need an OS: reason OpenAI is building a phone. Applications vs platforms, again.", "tweetA": "Airbnb's CEO says agents can't book an Airbnb properly today. Wall Street prices the agent economy as if it already works.", "tweetB": "Apple earns ~0.15% on every US card transaction through Apple Pay. In an agent world that toll moves to whoever owns the identity. That's why OpenAI wants a phone.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-ai-agents-at-the-app-store-gates", "id": 18}, {"cat": "geopolitics", "urgency": "deep", "source": "Don / MacroEdge", "title": "Escalation call: Saudi–Houthi conflict, B-1s pulled from UK, Iran 'can't weather the blockade' into Dec/Jan", "idea": "Don: with claims that Hormuz flows are normalizing at pre-war levels and the US withdrawing B-1 bombers from forward-UK deployments, he expects escalation led by non-US countries, particularly Saudi Arabia vs Ansarallah (Houthis) in Yemen. He doubts Iran can weather the blockade without major political upheaval by December/January and expects Middle East escalation in 30–60 days.", "angle": "Single-author view, contrarian to 'Hormuz normalizing'. Saudi–Houthi is an unpriced red-sea/energy tail.", "tweetA": "Hormuz 'normalizing' while the US pulls B-1s from forward bases. Either the conflict is de-escalating, or the escalation is being outsourced to the region. The market is pricing the first.", "tweetB": "Brent at $100 with a 200DMA at $88 doesn't price a Saudi–Houthi war. The tail is in the Yemen leg, not Iran.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.macroedge.world/p/weekly-macro-note-the-do-not-disturb", "id": 19}, {"cat": "energy", "urgency": "deep", "source": "Don / MacroEdge", "title": "WTI base building in the $80–82 range; SPR releases re-accelerating 3–5mmb; front-end technicals decisive next 2 weeks", "idea": "Don: war is inflationary and WTI is solidifying a higher base at $80–82; next two weeks matter for front-month as the back of the curve tightens; watch gasoil/ULS /www.macroedge.world/p/weekly-macro-note-the-do-not-disturb", "id": 21}, {"cat": "positioning", "urgency": "watch", "source": "Don / MacroEdge", "title": "Midterms 'Do Not Disturb': Kalshi shows GOP in damage-control mode; policy band-aids for a month", "idea": "Don: with midterms just over a month away and Kalshi House odds poor for the in-party, the next month brings policy interventions and short-term bandaids; consumer economy reliant on stocks rising; a few equities do the lifting. He expects 'an 87-style event' snap hasn't yet been heard under the surface.", "angle": "Election-driven intervention window for oil, rates, SPR. Time horizon until the first week of November.", "tweetA": "A month to midterms and the in-party's odds are bad: expect SPR, buybacks, and tariff exemptions timed for the polls. Trade the intervention, not the narrative.", "tweetB": "'87-style event' needs a snap that hasn't been heard. Bonds are at 5.29%, 51% of stocks are down 20%. How many cracks does the index need?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.macroedge.world/p/weekly-macro-note-the-do-not-disturb", "id": 22}, {"cat": "credit", "urgency": "act", "source": "Blind Squirrel Macro", "title": "EM carry unwound in September: CEW gave back 50% of its year, TEI -9%", "idea": "Blind Squirrel: US Treasury yields at two-decade highs and French OAT stress have dominated headlines; EM local bonds got less attention. MXN and ZAR gave back most of their year; WisdomTree EM Currency (CEW) lost 50% of its year-to-date gain in September; Templeton EM Income (TEI) NAV TR was +11% at end of August, then -9% in price in September. Past carry shocks (2023, Liberation Week, start of Iran War) bounced.", "angle": "Carry-trade unwind in EM FX: MXN, ZAR; USD index breakout. Test of dollar strength.", "tweetA": "CEW gave back 50% of its year in one month. JPY-funded MXN and ZAR carry unwound while headlines were on French OATs. The EM unwind went unnoticed, and that's function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
