<title>Twitter Bank Research</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DATA POINT TAGS */
.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "TWITTER BANK RESEARCH", "freshness_gate": "FRESHNESS GATE PASSED.", "collected_at": "2026-11-04T06:24:15Z", "window_days": 4, "input_stats": {"total_tweets": 120, "considered": 120, "kept": 33, "dropped": 87, "deduped": 0}, "summary": "Themes: US midterm-election scenarios (Goldman, JPM, Yardeni); AI capex/hyperscaler debt and AI-buildout growth (Goldman, JPM, Yardeni); sentiment and positioning indicators (Goldman, Deutsche, Morgan Stanley); US labor/GDP data (JOLTS, payroll and GDP forecasts).\nCounts: Goldman 18, BofA 3, JPM 3, Yardeni 3, Apollo/Slok 2, Deutsche 2, Barclays 1, Citi 1, Morgan Stanley 1.", "by_bank_counts": {"Goldman": 18, "BofA": 3, "JPM": 3, "Yardeni": 3, "Apollo/Slok": 2, "Deutsche": 2, "Barclays": 1, "Citi": 1, "Morgan Stanley": 1}, "banks": [{"bank": "Goldman", "theme": "Goldman — election scenarios, GDP/payroll forecasts, AI capex & hyperscaler debt, sentiment indicators", "items": [{"author": "neilsethinew", "text": "Excluding mega-cap tech “other income,” Goldman has Q3 S&P 500 EPS growth tracking at 33% y/y (above FactSet’s 30.2%, which uses GAAP results for Alphabet, Amazon and Meta), matching Q2 as the strongest quarter in recent decades outside of post-recession recoveries. \n\nBut that ends the acceleration of the past few quarters, and growth for the median stock has slowed to 12% from 14% in Q2 (versus a 10-year median of 8%).", "tweet_url": "https://x.com/neilsethinew/status/2117702099941134780", "images": ["https://pbs.twimg.com/media/HWN7pI0XkAEulzz.jpg"], "created_at": "2026-11-03T19:35:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Consensus capex estimates on AI/Cloud players... should grow to ~$1.74 trillion by 2030 at a 31% 2025-2030 CAGR https://t.co/39oGxG40YN", "tweet_url": "https://x.com/MikeZaccardi/status/2117691079575097508", "images": ["https://pbs.twimg.com/media/HWOM0JTXgAAu_ZQ.png"], "created_at": "2026-11-03T18:51:12.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman’s Risk Appetite Indicator* which made a lot of headlines the prior week falling to the least since April 2025 rebounded to −0.3 from −0.5, snapping a four-week losing streak, and the momentum index edged up to −0.8 from −0.9.\n\nUnder the hood, credit remains the weak spot. Its sub-component bounced to −2.0, but the prior week it fell to about −3, well below its April 2025 low (around −1.8) and the lowest since at least the start of 2025 (where the chart begins). Equities recovered to around flat (−0.1). \n\nGoldman’s asset allocation team adds that cross-asset sentiment and positioning “are back to more neutral levels,” and its equity tail-risk model “still points to a less negative asymmetry… but with worsening signal from the business cycle and sentiment.”\n\n*\"Goldman Sachs Risk Appetite Indicator (RAI) aims to track the level of global market risk appetite and risk aversion based on various market variables. A sharp rise in the index can send a warning signal that investors have more risk appetite and are potentially exposed to a correction if consensus views are tested. Similarly, a sharp decline indicates a reduction in risk appetite, and at extreme levels it can indicate that markets may have overshot. RAI signals are most powerful when the level of risk appetite is very low below -1.5, with levels closer to -2.0 giving the clearest signal over longer time horizons, as at such levels the asymmetry of subsequent medium term equity return becomes very positively skewed. RAI momentum is designed to track short term shifts of market risk appetite, and subcomponents of the RAI.”", "tweet_url": "https://x.com/neilsethinew/status/2117670561165758886", "images": ["https://pbs.twimg.com/media/HWN6JtnXEAAS3-e.jpg"], "created_at": "2026-11-03T17:29:40.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: Prediction markets imply Democrats have an over 65% chance to win the Senate majority, though the recent history of Senate polling suggests a closer contest. \n\nIn races back to 2002, Senate candidates in competitive races who led in polls by 2.5pp or less ultimately won their races only 60% of the time. Polling errors have also become more polarized in recent midterm Senate elections with Republicans outperforming their final preelection polling margins in Republican-leaning states and Democrats outperforming in Democratic-leaning states (Exhibit 5). \n\nThis presents a potential challenge for Democrats, as winning a majority requires winning in states that that President Trump won by 11-16pp 2024 (Some combination of Alaska, Ohio, Texas or possibly Iowa or Kansas). \n\nSince 2002, the Republican Senate candidate has outperformed final preelection polling in such Republican-leaning states by an average of 3pp. Among Republican-held seats shown in Exhibit 4, the Democratic lead is larger than this only in North Carolina.", "tweet_url": "https://x.com/neilsethinew/status/2117649314302304430", "images": ["https://pbs.twimg.com/media/HWNm1AzWgAEGF_k.png"], "created_at": "2026-11-03T16:05:15.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Goldman's Election Night Cheat Sheet https://t.co/CNVhiPNhuY", "tweet_url": "https://x.com/MikeZaccardi/status/2117640392585711754", "images": ["https://pbs.twimg.com/media/HWNetm5XwAAfGP2.jpg", "https://pbs.twimg.com/media/HWNetxRXkAAmqxI.jpg"], "created_at": "2026-11-03T15:29:48.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman (Callahan): While not overly surprising, interesting in the context of 30+ years of data:\n\nS&amp;P 500 low vol index has been the most negatively correlated to Nasdaq since the summer on record. https://t.co/BrFOnZsnMD", "tweet_url": "https://x.com/neilsethinew/status/2117619658631082000", "images": ["https://pbs.twimg.com/media/HWNL22AXQAASDWi.png"], "created_at": "2026-11-03T14:07:24.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Implications of a Dem sweep (GS): \n• Debt Limit: Spending &amp; health benefit battles will force compromise\n• Spending: Minor boost (~0.25% of GDP)\n• Tariffs: Dem rollbacks outweighed by Trump hikes (+2pp net)\n• AI: Shift from data center debate to basic federal regulation https://t.co/A9ldrSTJ9g", "tweet_url": "https://x.com/MikeZaccardi/status/2117599802544308529", "images": ["https://pbs.twimg.com/media/HWM5zH0WQAAfpBq.png"], "created_at": "2026-11-03T12:48:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: We expect a 75k increase in nonfarm payrolls in October (vs. 65k consensus).\nOur forecast reflects a solid signal from alternative employment data.\nWe expect the unemployment rate to stay at 4.2%\nWe forecast a 0.3% increase in average hourly earnings in October https://t.co/MkC1BSdnA3", "tweet_url": "https://x.com/MikeZaccardi/status/2117599173356720624", "images": ["https://pbs.twimg.com/media/HWM5OgOXgAATB5X.png"], "created_at": "2026-11-03T12:46:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Eyes on 2027 GDP growth forecasts... 2.2% for US, 2.7% global (GS) https://t.co/SpGezuFvU1", "tweet_url": "https://x.com/MikeZaccardi/status/2117598544089477537", "images": ["https://pbs.twimg.com/media/HWM4p4mX0AA78Bz.jpg"], "created_at": "2026-11-03T12:43:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: We raise our 1Q27 European natural gas price (TTF) forecast to 74 EUR/MWh (from 44) and the 2027 average to 51 EUR/MWh (from 32)\n\nRisks to our 2027 price forecasts remain skewed to the upside. https://t.co/b2ak1Zccdu", "tweet_url": "https://x.com/MikeZaccardi/status/2117597914914496873", "images": ["https://pbs.twimg.com/media/HWM4FRnXQAAspSO.png"], "created_at": "2026-11-03T12:41:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS Social Media Economic Sentiment Index has improved only slightly https://t.co/YjYo69TQki", "tweet_url": "https://x.com/MikeZaccardi/status/2117597285559189814", "images": ["https://pbs.twimg.com/media/HWM3gpkXcAAzjtR.png"], "created_at": "2026-11-03T12:38:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS Wage Tracker: Just +3.0% YoY https://t.co/b4XlDAfuAN", "tweet_url": "https://x.com/MikeZaccardi/status/2117596658108154044", "images": ["https://pbs.twimg.com/media/HWM28CBWUAAEdhW.png"], "created_at": "2026-11-03T12:36:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Our Q4 GDP forecast stands at +1.8% https://t.co/owbOeu25vl", "tweet_url": "https://x.com/MikeZaccardi/status/2117596027721027927", "images": ["https://pbs.twimg.com/media/HWM2XaqWkAAN-6O.png"], "created_at": "2026-11-03T12:33:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: AI off-balance-sheet obligations... For the hyperscalers, we track $1.7 trillion in lease commitments, 75% of which have not yet commenced. https://t.co/IZyF661mEI", "tweet_url": "https://x.com/MikeZaccardi/status/2117595398202073512", "images": ["https://pbs.twimg.com/media/HWM1yyfXMAAcn1c.png"], "created_at": "2026-11-03T12:31:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Multiple hyperscaler debt deals in recent days have pushed supply above our full-year 2026 forecast of $250 billion https://t.co/zhDHqihR3N", "tweet_url": "https://x.com/MikeZaccardi/status/2117594769689887107", "images": ["https://pbs.twimg.com/media/HWM1OLnWsAA_Xp5.png"], "created_at": "2026-11-03T12:28:30.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman’s US Equity Sentiment Indicator* turned positive at 0.19 (from −0.23 the prior week), its first positive reading since August 28th, ending a run of eight negative weeks. The current reading is associated with a 1-month average return of around 0.8% since 2009, with a positive rate around 57%.\n\n*The indicator combines “six weekly and three monthly indicators that span [across the more than 80% of the US equity market that is owned by institutional, retail and foreign investors]. Readings of +1.0 or higher have historically signaled stretched equity positioning. Readings of -1.0 or lower have signaled very light positioning and have historically been a statistically significant signal for subsequent S&P 500 performance”.", "tweet_url": "https://x.com/neilsethinew/status/2117577529485603092", "images": ["https://pbs.twimg.com/media/HWKycsOXkAElU5y.jpg"], "created_at": "2026-11-03T11:20:00.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"Safe is expensive\"\n\nBrian Garrett, Goldman Sachs via @BlakeMillardCFA https://t.co/H7Wo90kp0G", "tweet_url": "https://x.com/dailychartbook/status/2117572409393889355", "images": ["https://pbs.twimg.com/media/HWMg4qnWQAAPnWd.png"], "created_at": "2026-11-03T10:59:39.000Z", "relayers": []}, {"author": "dailychartbook", "text": "Goldman's Risk Appetite Indicator entered the week more than 2 SD below its average.\n\nvia Robbie Stankard, GS https://t.co/UHS9AcZD4Z", "tweet_url": "https://x.com/dailychartbook/status/2117549932953444533", "images": ["https://pbs.twimg.com/media/HWMMcTqXwAAQXrt.jpg"], "created_at": "2026-11-03T09:30:20.000Z", "relayers": []}]}, {"bank": "BofA", "theme": "BofA — JOLTS, Russell 1000 Value vs Growth spread, BOJ inflation", "items": [{"author": "neilsethinew", "text": "September JOLTS strong across the board: openings rise the most since May, hires up the most since March, quits the most since May 2023, and layoffs the least since March 2025.\n\n▪️ Openings: up 333,000 to 7.52 million, the highest since May, beating the 7.10 million consensus by more than 400,000 (August revised up 111,000). There were 1.06 openings per unemployed worker, above 1.0 for a sixth straight month.\n▪️ Hires: up 131,000 to 5.40 million, the highest since March, with the hires rate at 3.4%. Hires minus separations, an employment proxy, was 83,000, against a 29,000 gain in September payrolls.\n▪️ Quits: up 321,000, the most since May 2023, to 3.37 million, the highest since March 2025, and the quits rate rose to 2.1% from 1.9%. Accommodation and food services accounted for 197,000 of it; excluding that though industry quits still rose 124,000 the most since March 2025\n▪️ Layoffs: down 127,000 to 1.64 million, the lowest since March 2025, with the rate at 1.0%. The catch: August was revised up 127,000, turning its reported decline into a 66,000 increase.\n\nRevisions also undid two of last month’s stories. The August drop in openings at the smallest firms shrank to 152,000 from 335,000, and August private-sector hires now show a 76,000 gain rather than a decline.\n\nFits Fed Chair Warsh’s “quite positive” read on employment. It also gives the hawks more firepower although a lot more data before the December 8-9 meeting.", "tweet_url": "https://x.com/neilsethinew/status/2117647334523687369", "images": ["https://pbs.twimg.com/media/HWNebgVXMAACxie.jpg"], "created_at": "2026-11-03T15:57:23.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BofA noted Russell 1000 Value beat Growth by 10ppt in October, the widest spread since February 2001. \n\nI don't have access to that data but using the ETFs it was +4.3% vs −6.1%, and July’s +8.6ppt gap was similarly the largest since Feb 2001. https://t.co/eV9P7i6dmi", "tweet_url": "https://x.com/neilsethinew/status/2117633397560627609", "images": ["https://pbs.twimg.com/media/HWMvQ34WIAE5Y_x.jpg"], "created_at": "2026-11-03T15:02:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "It sort of passed under the radar, but last week after 13 years the Bank of Japan says underlying inflation has finally reached its 2% target, the goal it set in January 2013 and once expected to hit in about two years. Still, the BOJ held at 1.25% on an 8-1 vote, with only hawk Takata dissenting for a hike, and Governor Ueda kept December firmly in play.\n\nThe new Outlook Report leans hawkish:\n▪️ Core CPI forecast (ex-fresh food) for fiscal 2027 raised to 2.6% from 2.4%; fiscal 2026 unchanged at 2.5%\n▪️ Ex-fresh food and energy peaks at 2.7% in fiscal 2027\n▪️ Risks to prices judged skewed to the upside\n▪️ Growth stuck around 0.7% a year\n▪️ ETF sales nearly triple to about ¥860 billion a year, cutting the unwind to 43 years from 110+\n\nThe hold was even as the BOJ is still deeply accommodative. At 1.25%, the policy rate is about -1.35% in real terms against Tokyo’s 2.6% core reading.\n\n Bloomberg Economics sees hikes in December, March and July to 2%, the top of ING’s 1.75% to 2.00% neutral range. Even then, the real rate would be about -0.6% against the board’s own fiscal 2027 forecast.\n\nFor the yen, the Fed-BOJ gap is roughly half its mid-2024 level, yet the yen is only about 3% off its weakest levels. If both the Fed and the BOJ hike in December, the gap doesn’t narrow, which fits ING’s call for a 155 to 160 range.", "tweet_url": "https://x.com/neilsethinew/status/2117564947416912136", "images": ["https://pbs.twimg.com/media/HWK27wVWYAEJmRE.jpg"], "created_at": "2026-11-03T10:30:00.000Z", "relayers": []}]}, {"bank": "JPM", "theme": "JPMorgan — midterm scenario analysis and AI-buildout growth", "items": [{"author": "neilsethinew", "text": "Also from @C_Barraud's Tuesday Brief via ZH is JPM's scenario analysis. \n\nBlue Wave (Dem House / Dem Senate), 66% odds: S&P 500 ranges from down 0.25% to up 0.50%. The feared AI sell-off on regulation is likely limited because Trump won’t sign bills restricting AI and Dems lack a veto-proof majority. JPM sees any dip as a buying opportunity for AI bulls, with the main risk being de-grossing within the AI theme. There’s also “investigation risk” for Trump-linked donors, including megacap tech. Long-end yields are seen slightly lower on reduced deficit spending.\n\nSplit Congress (Dem House / GOP Senate), 26% odds: S&P 500 up 0.50% to 1.00%. Dems control government finances, so JPM expects deficit spending to come down. Impeachment risk is effectively gone, but investigation risk remains. Gridlock points to 2027 budget fights, though shutdowns have had limited economic and market impact. Long-end yields could decline.\n\nRed Wave (GOP House / GOP Senate), 7% odds: S&P 500 up 1.00% to 1.25%. The status quo holds with no new regulatory risks. This outcome may embolden Trump to stay the course in Iran until there’s a US-friendly deal or Iranian capitulation. Long-end yields move higher on continued elevated deficit spending.\n\nThe Other Split (GOP House / Dem Senate), 1% odds: S&P 500 up 0.25% to 0.75%. Dems don’t control financing, but a split Congress still means budget fights and possible shutdowns. Investigation risk remains because the Senate has similar powers, while impeachment can only start in the House. JPM makes no call on long-end yields.\n\nThe most likely outcome is also the weakest one for stocks. Even so, JPM’s worst case across all four scenarios is only a 0.25% decline", "tweet_url": "https://x.com/neilsethinew/status/2117608228221555185", "images": ["https://pbs.twimg.com/media/HWNAg3tW4AArtQW.png"], "created_at": "2026-11-03T13:21:59.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"For now, economic growth continues to be all about the AI buildout\"\n\n-JPMorgan AM https://t.co/YuMIqLzKAt", "tweet_url": "https://x.com/dailychartbook/status/2117594506086261160", "images": ["https://pbs.twimg.com/media/HWM0-zWWwAAm8XX.jpg"], "created_at": "2026-11-03T12:27:27.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"The S&amp;P 500 is more likely to rise following this week’s midterms, according to a scenario analysis by JPMorgan’s Market Intelligence desk.\"\n\n@NKniazhevich https://t.co/scOTWG4Nid", "tweet_url": "https://x.com/dailychartbook/status/2117580089625907540", "images": ["https://pbs.twimg.com/media/HWMn3sEWEAAqSsq.png"], "created_at": "2026-11-03T11:30:10.000Z", "relayers": []}]}, {"bank": "Yardeni", "theme": "Yardeni — blue-wave stock scenario, AI-related bond credit spreads", "items": [{"author": "MikeZaccardi", "text": "A Democratic sweep could be ‘a cold shower for stocks,’ but if so, buy the dip – @Yar // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
