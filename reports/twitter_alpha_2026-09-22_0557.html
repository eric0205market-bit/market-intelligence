<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-09-22T05:46:10Z", "input_stats": {"total_tweets": 249, "unique_authors": 74, "tweets_with_images": 51, "after_noise_filter": 78}, "summary": "**Meta/Muse dominates the tape:** Meta's Muse agent launch triggered an agentic-commerce war — Amazon blocked Muse from its platform while Shopify partnered with it for agentic checkout, and traders read Amazon's ban as a tell on who it fears. META stock ripped **+11%**, options call volume hit **1.8mm contracts** (most since Oct '22), and **@dampedspring** has 2.25% of his US equity book in it. **@nic_carter** and **@nicbstme** both argue pure aggregators (Kayak, Expedia, Zillow, Yelp) are structurally exposed to agent disintermediation.\n\n**AI capability shock:** OpenAI's internal model reportedly solved Navier-Stokes and 100+ open math problems, drawing \"feels like AGI\" reactions from **@Crypto_McKenna** and **@EMostaque**, while **@nic_carter** offered a contrarian jobs take — bureaucratic rubber-stamping, not capability limits, will create the real friction.\n\n**Crypto melt-up with warning lights:** BTC sits at the first resistance **@DonAlt** deems serious since $60k; **@DefiIgnas** sees a path to **$126k** ATH as OG-whale selling overhang clears; but **@_tolks** and **@cointradernik** flag OI ripping from $60B to $70B in four days and are rotating perp gains into spot.\n\n**Geopolitics as market lever:** Treasury's Bessent threatened to shut down all Iranian airlines globally on Sept 23; **@DCinvestor** reads dollar-system weaponization as bullish for crypto settlement rails, while **@zriboua** remains skeptical de-dollarization ever survives contact with reality.\n\n**Cracks beneath the euphoria:** **@pboockvar** flagged the worst market breadth in nearly 100 years even as SPY nears highs; SoftBank's SB Energy delayed its $50B+ IPO on investor pushback, and **@Melt_Dem** notes GPU cluster deals getting cancelled by offtakers — early signs of AI-capex financing stress.\n\n**Positioning:** **@RaoulGMI**'s 43-position portfolio is +96% average (67% win rate) after buying June's ETH/SOL/SUI dip; other named longs include **TAO** (@Zeneca), **NEAR** (@rektmando), **NBIS $400 target** (@thedefivillain), **ZEC** (@ViktorDefi, @_tolks), and an INTC/DOCN inference pair trade (@zeroxkyle).", "sections": {"A_events": [{"cluster": "Meta Muse vs. Amazon — Agentic Commerce War", "category": ["tech", "AI", "positioning"], "items": [{"author": "jonchu", "summary": "Quote-tweeting a take on Amazon banning Muse from its platform, jonchu flags it as revealing commentary on who Amazon actually considers a competitive threat.", "tweet_url": "https://x.com/jonchu/status/2102086388971692092", "images": [], "type": "tweet"}, {"author": "nicbstme", "summary": "Long thread applying Ben Thompson's Aggregation Theory to Amazon blocking Muse: platforms want to own the customer relationship, not become interchangeable suppliers behind someone else's agent interface. Uses groceries as an example — if Instacart embraces agents while Amazon blocks them, demand routes to Instacart. Concludes this is \"the defining tension of the agent economy: aggregators realizing they are now being aggregated,\" and that very few companies can actually become the aggregation layer.", "tweet_url": "https://x.com/nicbstme/status/2102090993919287468", "images": [], "type": "thread"}, {"author": "cryptopunk7213", "summary": "Quote-tweeting Shopify's announcement of agentic checkout with Shop Pay for Muse, argues Shopify and Tobi Lütke are positioning correctly for an agent-dominated world — capturing more revenue and a front-row seat to e-commerce's future — versus Amazon's defensive ban.", "tweet_url": "https://x.com/cryptopunk7213/status/2102138394273014162", "images": ["https://pbs.twimg.com/media/HSxLufBbMAAqrIs.jpg"], "type": "tweet"}, {"author": "cryptopunk7213", "summary": "First-person anecdote: asked Muse to handle a 7-hour flight delay, and within 5 minutes it filed for compensation, got a $250 Delta credit, rebooked a new flight, and even handled the support email itself. Calls it proof the agentic-commerce thesis is real, not hype, despite previously disliking Meta's AI products.", "tweet_url": "https://x.com/cryptopunk7213/status/2102179999122153690", "images": ["https://pbs.twimg.com/media/HSxxjqpaMAAgDIF.jpg", "https://pbs.twimg.com/media/HSxxjqrbIAA3S_q.jpg", "https://pbs.twimg.com/media/HSxxjqtacAAsoFs.jpg"], "type": "tweet"}, {"author": "nicbstme", "summary": "Notes Muse successfully bought Play-Doh on Amazon despite the ban, and argues detecting AI-agent traffic (datacenter IPs, near-identical browser fingerprints, consistent browsing patterns) is doable but imperfect — and ultimately moot, because if Amazon blocks the agent it will simply route to Shopify instead.", "tweet_url": "https://x.com/nicbstme/status/2102261687357493317", "images": ["https://pbs.twimg.com/media/HSy73JjbEAAqXAU.jpg"], "type": "tweet"}, {"author": "nic_carter", "summary": "Long thread arguing personal AI agents make undifferentiated aggregators/marketplaces structurally short-able: Kayak, Expedia, TripAdvisor, StubHub, Yelp, Resy, OpenTable, Zillow, Indeed, LendingTree and affiliate-shopping tools are all exposed once agents can compare and book directly with suppliers. Carves out exceptions — Uber, DoorDash, Airbnb (proprietary supply/market organization) and dating apps (can't be reduced to agent-matching) — as less vulnerable.", "tweet_url": "https://x.com/nic_carter/status/2102165520795521511", "images": [], "type": "thread"}]}, {"cluster": "META Stock Rally & Options Positioning", "category": ["tech", "AI", "positioning"], "items": [{"author": "spotgamma", "summary": "META options call volume hit 1.8mm contracts, the most since October 2022 — an extreme positioning signal following the Muse-driven rally.", "tweet_url": "https://x.com/spotgamma/status/2102197900696801659", "images": ["https://pbs.twimg.com/media/HSyB2TAWoAACeD0.jpg"], "type": "tweet"}, {"author": "dampedspring", "summary": "Discloses 2.25% of his US equity allocation is in META, calling it \"a massive win.\"", "tweet_url": "https://x.com/dampedspring/status/2102215128083300773", "images": [], "type": "tweet"}, {"author": "munster_gene", "summary": "META closed +11% on the day. Argues the market only just \"gets\" how good Muse is after six months of anticipation, and predicts the same re-rating dynamic is coming next for AAPL (Duo demand, new personalized Siri), TSLA (FSD, Cybercab, Optimus) and SPCX (orbital data centers), in that order.", "tweet_url": "https://x.com/munster_gene/status/2102126579744727468", "images": [], "type": "tweet"}, {"author": "aleabitoreddit", "summary": "Ties Meta Muse's compute demand directly to AMD/INTC/ARM CPU orders plus memory and networking components (NICs, SSDs, DRAM) needed for the browser/VM infrastructure behind long-form agent tasks; also flags Intel's CEO saying CPU demand only supports 50% of customer need. Curious whether AWS or Nebius hosts any of Meta's Muse workload.", "tweet_url": "https://x.com/aleabitoreddit/status/2102247915251224980", "images": ["https://pbs.twimg.com/media/HSyvNLbbgAAdpR_.jpg", "https://pbs.twimg.com/media/HSyvNLga0AAL-tz.jpg", "https://pbs.twimg.com/media/HSyvNLgaIAAufbg.jpg"], "type": "tweet"}, {"author": "buccocapital", "summary": "Mocks a skeptic who called a $1,000 META price target absurd, signaling continued bullishness on the stock post-Muse.", "tweet_url": "https://x.com/buccocapital/status/2102182213945090097", "images": ["https://pbs.twimg.com/media/HSxzhzyWYAEM0ri.png"], "type": "tweet"}]}, {"cluster": "OpenAI Claims Navier-Stokes + 100 Math Problems Solved", "category": ["AI", "tech"], "items": [{"author": "Crypto_McKenna", "summary": "Quote-tweeting the viral claim that OpenAI's internal model resolved the Navier-Stokes Millennium Prize problem plus 100+ other long-standing open math problems, calling it something that \"feels like AGI\" and worth expanding the frontier of science for.", "tweet_url": "https://x.com/Crypto_McKenna/status/2102143110369386828", "images": [], "type": "tweet"}, {"author": "EMostaque", "summary": "Responding to OpenAI's announcement of a mathematician advisory group to responsibly communicate these results, argues no AI lab will reasonably slow down until it has a model that can solve 100 long-standing open math problems.", "tweet_url": "https://x.com/EMostaque/status/2102156576647700974", "images": ["https://pbs.twimg.com/media/HSxb7q7W0AAnxFa.png"], "type": "tweet"}, {"author": "aleabitoreddit", "summary": "Frames the news as evidence of a civilization-level \"modern agricultural revolution\" moment for AI, questioning how anyone can be bearish this early in the singularity before physical AI is even mass-deployed.", "tweet_url": "https://x.com/aleabitoreddit/status/2102114073836228810", "images": ["https://pbs.twimg.com/media/HSw1mxCawAANwFL.jpg"], "type": "tweet"}, {"author": "nic_carter", "summary": "Contrarian pushback: argues AI will not actually destroy jobs, because governments will mandate that every consequential AI query be rubber-stamped by a human, which will create millions of new bureaucratic \"bullshit jobs\" instead of eliminating employment.", "tweet_url": "https://x.com/nic_carter/status/2102200693499326568", "images": [], "type": "tweet"}, {"author": "himgajria", "summary": "Sarcastic dig at crypto commentators dismissing AI's productivity impact despite the math-solving news, quoting the line \"the government told me economic productivity is still at 1.4% though.\"", "tweet_url": "https://x.com/himgajria/status/2102144102305567101", "images": ["https://pbs.twimg.com/media/HSxQ6uUb0AA91Jw.jpg"], "type": "tweet"}]}, {"cluster": "Iran Airline Shutdown & Dollar System as Geopolitical Weapon", "category": ["geopolitics", "macro", "crypto"], "items": [{"author": "DCinvestor", "summary": "Quote-tweeting Bessent's threat to \"shut down\" all Iranian airlines worldwide from Sept 23 (cutting off fuel, landing services, ticket sales), argues that using dollar-system removal as a geopolitical cudgel accelerates the case for crypto-based settlement as an alternative rail, and that most investors remain under-allocated to that thesis.", "tweet_url": "https://x.com/DCinvestor/status/2102208617487511928", "images": [], "type": "tweet"}, {"author": "zriboua", "summary": "Dryly labels the same Bessent Iranian-airline sanctions announcement \"Operation Implosion.\"", "tweet_url": "https://x.com/zriboua/status/2102100633251663977", "images": [], "type": "tweet"}, {"author": "DCinvestor", "summary": "Separate long thread criticizing US Middle East strategy: argues Russia-Ukraine already proved drones are a potent asymmetric threat, that Iran likely has Chinese-backed drone tech, and that the US nonetheless launched a war against Iran and watched Middle East bases and allied infrastructure get hit (including a Houthi strike on Riyadh airport) — calling continued prosecution of the conflict \"unfathomable levels of malfeasance.\"", "tweet_url": "https://x.com/DCinvestor/status/2102252699756736706", "images": [], "type": "thread"}, {"author": "zriboua", "summary": "In a related but skeptical vein on the broader de-dollarization narrative, quote-tweets data showing USD still dominates 89.2% of global FX trades versus 8.5% for the yuan, arguing every de-dollarization argument eventually collides with reality and loses — a complementary but more cautious view than DCinvestor's crypto-settlement thesis.", "tweet_url": "https://x.com/zriboua/status/2102090362558750802", "images": ["https://pbs.twimg.com/media/HSwgC2FX0AEaW19.jpg"], "type": "tweet"}]}, {"cluster": "Crypto Melt-Up: BTC Near ATH, Overheated Leverage Warnings", "category": ["crypto", "positioning"], "items": [{"author": "DonAlt", "summary": "Thread declaring BTC is finally at the only resistance level serious enough to threaten a new ATH; says he's not cha le/status/2102172535358103580", "images": [], "type": "thread"}, {"author": "buccocapital", "summary": "Argues it will be hard for OpenAI to fight a two-front war in both enterprise and consumer simultaneously, noting very few companies in history have pulled that off well.", "tweet_url": "https://x.com/buccocapital/status/2102110448879284569", "images": [], "type": "tweet"}, {"author": "karpathy", "summary": "Frames a small, fast, low-latency model release as sitting on an under-invested point of the LLM Pareto-optimal curve — a segment (single-token, low-latency, \"good enough\" intelligence) that was neglected during the industry's race toward maximum intelligence.", "tweet_url": "https://x.com/karpathy/status/2102124533729955960", "images": [], "type": "tweet"}, {"author": "garrytan", "summary": "Responding to a report that VCs are already feeding pitch-meeting notes (via Granola) into a loosely-prompted Claude to evaluate founders mid-pitch, defends Cluely's \"realtime thought helper / semi-adversarial assistant\" concept as still a good idea — flagging that AI-vs-AI dynamics are already entering VC diligence itself.", "tweet_url": "https://x.com/garrytan/status/2102233173833007536", "images": [], "type": "tweet"}, {"author": "VitalikButerin", "summary": "Welcomes a new decentralization-focused prediction-market contender launching on Ethereum L1, implicitly critiquing existing prediction markets as insufficiently decentralized and too \"corposlop.\"", "tweet_url": "https://x.com/VitalikButerin/status/2102143283493507554", "images": [], "type": "tweet"}, {"author": "theallinpod", "summary": "All-In Summit clip with Naveen Rao covering why AI compute is extremely inefficient (the brain runs on ~20 watts vs. a data center needing a city's worth of power), why AI is about to run into power constraints, and an argument that computer architecture has been \"built wrong\" since 1945 — framing the energy bottleneck as the real gating factor for AI progress, not chips. // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
