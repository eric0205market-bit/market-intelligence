rgency": "deep", "source": "MacroEdge Oil and Gas Research", "title": "Crack spreads are ripping while WTI sits flat — you're watching the wrong number", "idea": "Gasoline and diesel crack spreads are 'absolutely ripping higher' even as front-month WTI stays flat. The author argues WTI is the wrong price to watch for gauging Hormuz-closure impact — the real stress is showing up in refined-product margins, not crude.", "angle": "A hidden-signal setup: traders anchored on headline crude are missing the actual tightness, which refiners are capturing directly in their margins.", "tweetA": "Everyone's staring at WTI to gauge Hormuz stress. WTI is flat. Crack spreads are ripping. That's the tell — it's a PRODUCT shortage, not a crude shortage. Refiners are pocketing the spread while crude bulls wonder why oil 'isn't reacting.' $VLO $MPC", "tweetB": "The market is pricing Hormuz risk in the wrong instrument. If you're trading front-month WTI on this, you're trading the least informative number on the board. The diesel/gasoline spread IS the Hormuz trade right now.", "charts": {"count": 2, "hot": true, "desc": "🔥 CHART WORTH SAVING — two embedded charts (source: ekwufinance) showing diesel refining margins ripping higher despite flat WTI."}, "link": "https://macroedgeenergy.substack.com/p/oil-and-gas-research-weekly-energy-197"}, {"id": 5, "cat": "geopolitics", "urgency": "deep", "source": "MacroEdge Oil and Gas Research", "title": "Venezuela production ≈ North Dakota — the headline is a distraction from Bakken's decline", "idea": "Despite the excitement over the Venezuela deal, Venezuelan production is roughly on par with North Dakota and about half of New Mexico's output — not a game-changer for near-term supply. The bigger story the author flags: US Tier 1/2 shale inventory is deteriorating, with Bakken seeing mid-single-digit percentage declines year after year.", "angle": "The Venezuela headline is being used to distract from a much larger structural problem: Washington is opening new barrels because domestic shale quality is running out, not because Venezuela changes the supply picture.", "tweetA": "Venezuela production ≈ North Dakota, about half of New Mexico. That's the headline everyone's excited about. Meanwhile Bakken Tier 1 inventory is declining mid-single digits a year, every year. The Venezuela deal is a distraction from a much bigger problem: the US is running out of good shale.", "tweetB": "Why open Venezuela now? Because Washington can see the shale decline curve and doesn't like it. This isn't a bullish oil story, it's a 'we need barrels from anywhere' story — which is itself bearish for the multi-year US supply outlook.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening (Bakken decline curve referenced)."}, "link": "https://macroedgeenergy.substack.com/p/oil-and-gas-research-weekly-energy-197"}, {"id": 6, "cat": "macro", "urgency": "watch", "source": "MacroEdge Oil and Gas Research", "title": "Commodities are starting to look like late 2021 — right before the inflation surge", "idea": "The author flags that commodities broadly (including and excluding energy) are 'starting to have a late 2021 look to them,' with food staples, softs, and energy all broadly underpriced if the Hormuz situation doesn't resolve — and notes the Fed 'has underpriced supply shocks going into the new year.'", "angle": "A pattern-recognition call worth tracking into year-end: a stagflationary tail risk building quietly under an equity market pricing 'no landing.'", "tweetA": "'Commodities on the aggregate are starting to have a late 2021 look to them.' That was six months before CPI hit 9%. If this pattern rhymes, the Fed — and the equity market pricing 'no landing' — are both about to be surprised in the same direction.", "tweetB": "Food staples, softs, and energy are all flagged as broadly underpriced if Hormuz doesn't resolve. Stack that against a Fed that's 'underpriced supply shocks going into the new year,' and you have the setup for a second inflation scare nobody's positioned for.", "charts": {"count": 0, "hot": false, "desc": "No chart specifically for this point, but inventory/technicals charts are elsewhere in the note."}, "link": "https://macroedgeenergy.substack.com/p/oil-and-gas-research-weekly-energy-197"}, {"id": 7, "cat": "tech", "urgency": "deep", "source": "Michael Parekh / AI-RTZ #1194", "title": "A robot beat Usain Bolt at 100m, then crashed into the wall", "idea": "China's Tiangong Ultra ran 100m in 8.64 seconds (42 kph) at Beijing's humanoid robot games, faster than Usain Bolt's 9.58s record — but it couldn't slow down and smashed into the finish-line wall, took nearly a full second to react to the starting gun, and needed 50+ steps versus Bolt's 41. Meanwhile the tasks that matter commercially — plugging in a cable, picking up trash, tweezer tasks — are the ones robots struggle with, and many 'autonomous' dexterity demos were secretly teleoperated.", "angle": "The market is pricing headline speed records while the actual commercial bottleneck — dexterity and autonomy — remains unsolved; a clean gap between spectacle and revenue.", "tweetA": "A robot beat Usain Bolt at 100m and then couldn't stop — smashed into the wall. It also needed a full second just to react to the starting gun. The task that would actually make money (plugging in a cable, unsupervised) is the one it can't do. Moravec's paradox is still undefeated in 2026.", "tweetB": "Half these 'autonomous' dexterity demos in Beijing were teleoperated — humans driving the hands. If the sprint record needs no human but the useful tasks need a human in the loop, you've learned exactly which part of humanoid robotics is real revenue today, and it isn't the one going viral.", "charts": {"count": 0, "hot": false, "desc": "No chart in this email; article links to Reuters/Wired coverage with video of the race."}, "link": "https://michaelparekh.substack.com/p/ai-physical-ai-arrives-with-china"}, {"id": 8, "cat": "venture", "urgency": "deep", "source": "Michael Parekh / AI-RTZ #1194", "title": "AgiBot overtook Unitree as #1 humanoid vendor the same week Unitree IPO'd at $51B", "idea": "Global humanoid shipments hit ~19,100 units in H1 2026, up 272% YoY, with China shipping 97% of them. AgiBot overtook Unitree as the top vendor — 8,400 units, 44% share, up 562% YoY — versus Unitree's 5,900 units (31% share), even as Unitree just completed a Shanghai IPO oversubscribed 5,500x at a $51B first-day valuation that has since fallen back sharply.", "angle": "Public markets anointed a 'winner' via IPO hype in the exact window the actual unit-share leader changed hands — a textbook case of chasing yesterday's narrative.", "tweetA": "Unitree IPO'd at $51B, 5,500x oversubscribed. In the same six months, AgiBot quietly took the #1 humanoid shipment spot away from it — 8,400 units vs 5,900, +562% YoY. The public market bought the brand just as the market-share leader changed.", "tweetB": "272% YoY growth in humanoid shipments sounds explosive until you see the base: 19,100 units, globally, for an entire industry. That's smaller than a single mid-size factory's weekly output. This is still a rounding error dressed up as a megatrend.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening (Smart Analytics Global H1 vendor share table referenced)."}, "link": "https://michaelparekh.substack.com/p/ai-physical-ai-arrives-with-china"}, {"id": 9, "cat": "science", "urgency": "deep", "source": "Michael Parekh / AI-RTZ #1194", "title": "Goldman expected 15-20% annual cost declines for humanoids — they got 40% in a year", "idea": "Goldman Sachs' China industrial-tech team sizes the humanoid market at $38B by 2035 on ~1.4 million units shipped, but the standout datapoint is cost: manufacturing costs fell roughly 40% in a single year to $30,000-$150,000 per unit, mostly on Chinese supply chains — versus Goldman's own expectation of 15-20% annual declines. The team wrote 'AI progress surprised us the most.'", "angle": "If Goldman's own analysts underestimated the cost curve on the cheap side, their $38B-by-2035 market size — built on the slower assumption — is more likely too conservative than too aggressive.", "tweetA": "Goldman expected 15-20% annual cost declines for humanoid robots. They got 40% — in one year. Their own $38B-by-2035 market estimate is built on the SLOWER number. When your own analysts get the cost curve wrong on the cheap side, the market-size number is stale before the report ships.", "tweetB": "$30-150K per humanoid unit now, down 40% YoY on Chinese supply chains. That's the same cost-curve shape lithium-ion batteries and solar went through right before adoption inflected. The 2040s timeline the bears are using may be pricing in the wrong decade's cost curve.", "charts": {"count": 0, "hot": false, "desc": "No chart in email; cost curve referenced from Goldman research."}, "link": "https://michaelparekh.substack.com/p/ai-physical-ai-arrives-with-china"}, {"id": 10, "cat": "regulation", "urgency": "watch", "source": "Michael Parekh / AI-RTZ #1194", "title": "FCC blocks foreign humanoid robot imports, colliding with a supply chain that lives in China", "idea": "The FCC blocked imports of foreign-made humanoid and quadruped robots on national-security grounds, even as the entire commercial robot supply chain — like phones before it — lives in Asia, and Chinese manufacturers currently dominate cost and iteration speed.", "angle": "This extends the chip-tariff playbook to robotics; it slows the US buildout precisely while China compounds its manufacturing lead — a self-inflicted handicap in a race the US says it wants to win.", "tweetA": "FCC just blocked foreign humanoid/quadruped robot imports on national security grounds. Fine in principle — except the entire robot supply chain lives in China, same as phones did in 2015. You can't reshore a supply chain by executive fiat faster than China can compound its manufacturing lead.", "tweetB": "Tariffs on chips, now import bans on robots. Every move to 'protect' US robotics from China also cuts US robotics startups off from the cheapest, fastest-iterating hardware source. Protectionism here isn't obviously pro-American-robotics — it might just be pro-Chinese-monopoly.", "charts": {"count": 0, "hot": false, "desc": "No chart; referenced via linked article."}, "link": "https://michaelparekh.substack.com/p/ai-physical-ai-arrives-with-china"}, {"id": 11, "cat": "culture", "urgency": "watch", "source": "Michael Parekh / AI-RTZ #1194", "title": "Asia is 70-80% pro-robot, the US is 30-40% — a 40-point adoption-speed gap", "idea": "Public sentiment toward robots and AI broadly runs 70-80% favorable across Asia versus just 30-40% in the US and Europe — a sentiment gap the author frames as a 'quiet, compounding advantage' for adoption speed on the other side of the Pacific.", "angle": "Sentiment drives adoption speed, which drives real-world data collection, which drives capability improvement — a flywheel disadvantage for the US that no chip export control addresses.", "tweetA": "70-80% of Asia is pro-robot. 30-40% of the US is. That 40-point sentiment gap is worth more to China's robotics lead over the next decade than any chip export control the US imposes. You can't legislate your way out of a population that doesn't want the product.", "tweetB": "Sentiment isn't a soft metric here — it's an adoption-speed multiplier. Faster adoption means more real-world data, more iteration, better robots, faster. The US-China AI race gets framed as compute vs compute. The sentiment gap might matter more.", "charts": {"count": 0, "hot": false, "desc": "No chart in email."}, "link": "https://michaelparekh.substack.com/p/ai-physical-ai-arrives-with-china"}, {"id": 12, "cat": "macro", "urgency": "watch", "source": "Michael Parekh / AI-RTZ #1194", "title": "Unitree priced at $51B, Morgan Stanley says adoption stays slow until the mid-2030s", "idea": "Morgan Stanley projects a $5 trillion humanoid market by 2050 with ~1 billion units, 90% industrial/commercial, and adoption 'relatively slow until the mid-2030s' — with 302 million units in China vs 78 million in the US. The author argues the market is pricing 2040s-level valuations (Unitree's $51B day-one, Musk's $10T Optimus talk) onto a 2026 product that 'cannot yet plug in a cable by itself.'", "angle": "A clean valuation-vs-timeline mismatch — good framework for fading humanoid-adjacent equity enthusiasm short-term while staying long the multi-decade thesis.", "tweetA": "Unitree priced at $51B day one. Optimus talked up to $10T. Morgan Stanley's own research says adoption stays slow until the MID-2030s. Someone's timeline is wrong, and it's probably not the analysts who modeled 90% industrial use and a 2050 horizon.", "tweetB": "Do the math: Morgan Stanley says ~1 billion humanoids by 2050, 90% industrial. That's a 24-year runway being priced into valuations today as if it's a 4-year runway. This is the dot-com telecom buildout mistake again — the thesis is right, the timing in the price is wrong.", "charts": {"count": 0, "hot": false, "desc": "No chart in email; Morgan Stanley/Goldman estimates cited in text."}, "link": "https://michaelparekh.substack.com/p/ai-physical-ai-arrives-with-china"}, {"id": 13, "cat": "science", "urgency": "deep", "source": "Exponential View #599 (Azeem Azhar)", "title": "Toby Ord: recursive self-improvement has a physics speed limit", "idea": "Philosopher Toby Ord argues unbounded recursive self-improvement (RSI) is gated by 'generation time' — the full research-to-training-to-deployment loop — which can't shrink to zero because real-world constraints (experiments, training runs, chip fabrication) and then physics itself (speed of light, the Bekenstein bound on information density, Landauer's energy tax on computation) impose hard floors.", "angle": "A rigorous counter to 'fast takeoff' narratives on both the doom and hype sides — useful to push back on anyone assuming compounding intelligence growth without bound.", "tweetA": "Recursive self-improvement has a speed limit, and it's not a policy choice — it's the speed of light, the Bekenstein bound, and Landauer's energy tax on computation. The 'intelligence explosion in months' crowd needs to argue with physics, not with skeptics.", "tweetB": "Generation time — the full loop of an AI helping design its successor — can't hit zero because chips still take months to fab and training runs still take weeks to run. Fast takeoff requires collapsing THAT loop to near-instant. Nobody's roadmap does that, they just assume it.", "charts": {"count": 0, "hot": false, "desc": "No chart; links to Ord's full paper and an interactive plain-English version for premium subscribers."}, "link": "https://www.exponentialview.co/p/ev-599"}, {"id": 14, "cat": "AI/infra", "urgency": "deep", "source": "Exponential View #599", "title": "Open-weight token share at Vercel hits 62%, up from 28% two months ago", "idea": "Open-weight models' share of production tokens at Vercel hit a single-day record of 62%, up from 28% just two months earlier. Some Western firms are moving workloads onto Chinese open weights — Thomson Reuters built its first in-house model on a Qwen base specifically to cut costs.", "angle": "This directly threatens the 'closed frontier labs capture all the value' thesis — if enterprises are routing the majority of production tokens to open weights within two months, closed-lab pricing power on commodity tasks is eroding faster than most models assume.", "tweetA": "Open-weight share of production tokens at Vercel: 28% two months ago, 62% now. That's not a gradual shift, that's a phase change. If enterprises are majority-open-weight on production traffic already, the 'closed labs capture all the AI value' thesis needs a rewrite.", "tweetB": "Thomson Reuters just built its own in-house model on top of Qwen — a Chinese open-weight base — to cut costs. That's a Western blue-chip choosing Chinese open infrastructure over closed US frontier labs on pure economics. Nobody's pricing that irony into AI-lab valuations.", "charts": {"count": 0, "hot": false, "desc": "No chart in email; linked Vercel data referenced."}, "link": "https://www.exponentialview.co/p/ev-599"}, {"id": 15, "cat": "AI/infra", "urgency": "deep", "source": "Exponential View #599", "title": "Bridgewater beat every frontier model at 1/14th the inference cost", "idea": "Bridgewater, working with Thinking Machines, fine-tuned an open Qwen model on expert-labeled data and beat every frontier model it tested on its internal information-filtering tasks — roughly 30% fewer errors than the best closed model, at one-fourteenth the inference cost.", "angle": "Clear evidence that task-specific fine-tuning of small open models beats paying for frontier-model API calls on narrow enterprise tasks — a direct headwind to 'just use the biggest model' AI capex assumptions.", "tweetA": "Bridgewater fine-tuned a small open model, beat every frontier closed model on their actual task, and did it at 1/14th the inference cost. Not close — BEAT them, with 30% fewer errors. If a hedge fund can do this quietly, how many enterprise AI budgets are overpaying for capability they don't need?", "tweetB": "1/14th the cost, fewer errors than the frontier model. That ratio is the whole bear case for 'every enterprise workload eventually needs frontier-model tokens.' Most workloads don't need general intelligence — they need a narrow task done cheaply and well.", "charts": {"count": 0, "hot": false, "desc": "No chart in email."}, "link": "https://www.exponentialview.co/p/ev-599"}, {"id": 16, "cat": "AI/infra", "urgency": "deep", "source": "Exponential View #599", "title": "OpenAI's Jalapeño chip, designed by AI, beats Nvidia 1.5-1.9x on tokens per megawatt", "idea": "OpenAI's new 'Jalapeño' chip was designed with heavy AI assistance — its own models wrote kernels and cut roughly 10% off a major compute block — going from first hire to tape-out in ~16 months, and it beats comparable Nvidia silicon by 1.5-1.9x on tokens per megawatt at peak throughput.", "angle": "Recursive self-improvement showing up concretely in silicon design speed, and a direct competitive threat to Nvidia's moat — 16 months to beat Nvidia on a real efficiency metric is far faster than a historical ASIC design cycle.", "tweetA": "OpenAI's own models helped design the chip that now beats Nvidia 1.5-1.9x on tokens per megawatt. 16 months from first hire to tape-out. That's not a subsidized vanity chip project — that's AI compressing its own hardware design cycle in a way that directly threatens $NVDA's silicon moat.", "tweetB": "Forget AGI debates for a second: an AI model helped design a chip that's meaningfully more power-efficient than Nvidia's best. If that compounds even linearly across future chip generations, the compute cost curve for AI just got a second derivative nobody priced in.", "charts": {"count": 0, "hot": false, "desc": "No chart in email."}, "link": "https://www.exponentialview.co/p/ev-599"}, {"id": 17, "cat": "labor", "urgency": "watch", "source": "Exponential View #599 (morsel)", "title": "Meta considered cutting some teams by up to 60% to go 'AI native'", "idea": "Meta reportedly considered shrinking some teams by up to 60% in a push to become 'AI native' — a specific, aggressive number on how far at least one hyperscaler is willing to restructure headcount around AI-driven productivity assumptions.", "angle": "If a rumor at this magnitude is circulating at a company Meta's size, AI-driven labor restructuring at large tech employers may be underpriced in both equity margin narratives and macro tech-employment data.", "tweetA": "Meta considered cutting SOME teams by up to 60% to go 'AI native.' Not 10%, not 15% — 60%. If that's the number being floated internally at a company this size, tech payrolls have a lot more room to fall before AI-driven margin expansion shows up fully in the numbers.", "tweetB": "60% team cuts framed as 'AI native' transformation is really just: AI let us realize we were overstaffed by more than we admitted. Watch tech-sector labor data over the next two quarters — this is the kind of number that shows up in NFP revisions, not headlines.", "charts": {"count": 0, "hot": false, "desc": "No chart; one-line morsel item with linked source."}, "link": "https://www.exponentialview.co/p/ev-599"}, {"id": 18, "cat": "culture", "urgency": "watch", "source": "Exponential View #599 (morsel)", "title": "University of Chicago bans classroom tech, goes back to paper over 'AI-learning crisis'", "idea": "The University of Chicago's Social Sciences Core is going back to paper, banning most classroom technology to deal with what the author calls an AI-learning crisis.", "angle": "A leading US research university making a hard institutional reversal on classroom tech signals AI-assisted cheating/dependency has crossed a threshold serious enough to force policy change — worth watching for second-order effects on ed-tech narratives.", "tweetA": "University of Chicago is banning laptops and going back to paper in its Social Sciences Core. That's not a nostalgic gesture — that's an elite university admitting AI broke their ability to assess whether students actually learned anything. Ed-tech bulls should be paying attention.", "tweetB": "The AI story in education was supposed to be 'personalized tutors for everyone.' The actual first-order effect at a top university: ban the technology, go back to pen and paper. The gap between the AI-in-education pitch deck and the reality just got a very public data point.", "charts": {"count": 0, "hot": false, "desc": "No chart; one-line morsel item with linked source."}, "link": "https://www.exponentialview.co/p/ev-599"}, {"id": 19, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / Michael Hartnett (BofA)", "title": "Hartnett: AI builders keep losing to AI adopters until global 30yr yields break below 5%", "idea": "BofA's Michael Hartnett argues AI spenders/builders will keep underperforming AI adopters until global 30-year government bond yields fall below 5%. Fed Chair Warsh's hawkish Jackson Hole tone only partially met Hartnett's test — it flattened the curve and strengthened the dollar, but didn't deliver the broader decline in long yields or risk appetite.", "angle": "A precise, falsifiable macro level (30yr under 5%) to watch for a rotation back into AI capex/builder names — cleaner than vague 'rate cut' framing.", "tweetA": "Hartnett's line in the sand for AI-builder outperformance to resume: global 30yr yields below 5%. Not the Fed funds rate, not CPI — the 30yr. Warsh got half the job done at Jackson Hole (curve flattened, dollar up) and stopped there. Until that yield breaks, don't fight the adopters-over-builders trade.", "tweetB": "Bonds trade information, equities trade ideas — and right now bonds are telling equities to stay away from AI capex names until long yields actually fall. The AI trade isn't waiting on earnings or the Fed's next meeting. It's waiting on the 30yr.", "charts": {"count": 0, "hot": false, "desc": "No chart in email; Flow Show commentary summarized in text."}, "link": "https://thedarksideoftheboom.substack.com/p/bonds-boss-the-bubble-the-two-events"}, {"id": 20, "cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom / Michael Hartnett (BofA)", "title": "Consensus positioning needs four separate 'no's to all hold at once", "idea": "Current positioning is extremely bullish and built on four simultaneous assumptions: no landing, no Fed hike, no AI capex cut, and no Democratic sweep in the midterms — with gold and commodities as Hartnett's preferred hedge against the policy response required to sustain that consensus.", "angle": "Four independent conditions all need to hold true at once for current positioning to be validated — that's a parlay, not a base case, and any single leg breaking is a real dislocation.", "tweetA": "Current positioning needs FOUR things to all be true at once: no landing, no hike, no AI capex cut, no Dem sweep. That's not a forecast, that's a parlay. Hartnett's hedge of choice if any leg breaks: gold and commodities, not bonds.", "tweetB": "Ask which of the four 'no's is most fragile: no landing survives soft data, no hike is already being tested by Warsh, no AI capex cut is a 2027 question, no Dem sweep is a coin flip in November. The market's long every leg of a four-way parlay and calling it a base case.", "charts": {"count": 0, "hot": false, "desc": "No chart in email."}, "link": "https://thedarksideoftheboom.substack.com/p/bonds-boss-the-bubble-the-two-events"}, {"id": 21, "cat": "geopolitics", "urgency": "watch", "source": "Dark Side of the Boom / Michael Hartnett (BofA)", "title": "Two dated catalysts contrarians are watching: Iran capitulation or the midterms", "idea": "Contrarians are specifically watching two potential turning points that could challenge peak-earnings consensus: Iran capitulation followed by a decisive decline in oil, or the outcome of the US midterm elections.", "angle": "These are genuinely binary, datable catalysts rather than vague 'risk-off eventually' hand-waving — worth calendaring both as real event risk.", "tweetA": "Two dated catalysts that could actually break the 'everything's fine' consensus: Iran capitulates and oil breaks lower, or midterms don't go the way the market's priced. Both are binary, both are dated, and the market is positioned like neither happens.", "tweetB": "Notice what's NOT on the contrarian watchlist: a Fed policy error, a growth scare, an AI capex pullback. The bears' best hope right now is politics and geopolitics breaking the trade, not fundamentals. That says more about how weak the bear case actually is.", "charts": {"count": 0, "hot": false, "desc": "No chart in email."}, "link": "https://thedarksideoftheboom.substack.com/p/bonds-boss-the-bubble-the-two-events"}]</script>
<script id="meta-json" type="application/json">{"date": "2026-08-30", "time": "09:07 CEST", "windowStart": "2026-08-30 03:07 CEST", "windowEnd": "2026-08-30 09:07 CEST", "emailsInWindow": 5, "emailsRead": 5, "itemsExtracted": 21, "includedSources": [{"name": "The After Hour / defi0xjeff", "count": 2}, {"name": "MacroEdge Oil and Gas Research", "count": 4}, {"name": "Michael Parekh / AI-RTZ", "count": 6}, {"name": "Exponential View", "count": 6}, {"name": "Dark Side of the Boom (Hartnett/BofA)", "count": 3}], "skippedSources": []}</script>

<script>
const ITEMS = JSON.parse(document.getElementById('items-json').textContent);
const META = JSON.parse(document.getElementById('meta-json').textContent);

const CAT_COLORS = {"macro": "#e24b4a", "credit": "#378add", "positioning": "#ef9f27", "AI/infra": "#1d9e75", "crypto": "#7f77dd", "geopolitics": "#d85a30", "energy": "#f97316", "tech": "#06b6d4", "gold": "#d4a017", "culture": "#ec4899", "labor": "#8b5cf6", "regulation": "#64748b", "science": "#14b8a6", "venture": "#84cc16"};

const URGENCY_LABEL = { act: '🔴 Act Now', deep: '🔵 Deep', watch: '🟡 Watch' };
const URGENCY_EMOJI = { act: '🔴', deep: '🔵', watch: '🟡' };

let activeCat = 'all';
let activeUrg = 'all';
let activeSrc = null;

function slug(c) { return c.replace('/', '-'); }

function buildFilterBars() {
  const catCounts = {};
  ITEMS.forEach(i => catCounts[i.cat] = (catCounts[i.cat]||0)+1);
  const cats = Object.keys(catCounts);

  const catBar = document.getElementById('catFilterBar');
  let catHtml = `<button class="pill active" data-cat="all" onclick="setCatFilter('all')">All <span class="count">${ITEMS.length}</span></button>`;
  cats.forEach(c => {
    catHtml += `<button class="pill" data-cat="${c}" onclick="setCatFilter('${c}')" style="border-color:${CAT_COLORS[c]||'#888'}">${c} <span class="count">${catCounts[c]}</span></button>`;
  });
  catBar.innerHTML = catHtml;

  const urgCounts = { act: 0, deep: 0, watch: 0 };
  ITEMS.forEach(i => urgCounts[i.urgency] = (urgCounts[i.urgency]||0)+1);
  const urgBar = document.getElementById('urgFilterBar');
  let urgHtml = `<button class="pill active" data-urg="all" onclick="setUrgFilter('all')">All <span class="count">${ITEMS.length}</span></button>`;
  ['act','deep','watch'].forEach(u => {
    urgHtml += `<button class="pill" data-urg="${u}" onclick="setUrgFilter('${u}')">${URGENCY_LABEL[u]} <span class="count">${urgCounts[u]||0}</span></button>`;
  });
  urgBar.innerHTML = urgHtml;
}

function updatePillStates() {
  document.querySelectorAll('#catFilterBar .pill').forEach(p => {
    const c = p.getAttribute('data-cat');
    if (c === activeCat) {
      p.classList.add('active');
      p.style.background = c === 'all' ? '#1a1a1a' : (CAT_COLORS[c]||'#888');
    } else {
      p.classList.remove('active');
      p.style.background = 'transparent';
    }
  });
  document.querySelectorAll('#urgFilterBar .pill').forEach(p => {
    const u = p.getAttribute('data-urg');
    if (u === activeUrg) {
      p.classList.add('active');
      p.style.background = '#1a1a1a';
    } else {
      p.classList.remove('active');
      p.style.background = 'transparent';
    }
  });
}

function setCatFilter(c) {
  activeCat = c; activeSrc = null;
  updatePillStates();
  renderCards();
}
function setUrgFilter(u) {
  activeUrg = u; activeSrc = null;
  updatePillStates();
  renderCards();
}
function filterBySrc(name) {
  activeCat = 'all'; activeUrg = 'all'; activeSrc = name;
  updatePillStates();
  renderCards(true);
}

function cardHtml(item) {
  const catClass = 'cat-' + slug(item.cat);
  const borderClass = 'border-' + slug(item.cat);
  const chartFlag = item.charts && item.charts.count > 0 ? '📊' : '';
  const hotFlag = item.charts && item.charts.hot ? '🔥' : '';
  let chartsInner = '';
  if (item.charts && (item.charts.count > 0 || item.charts.desc)) {
    chartsInner = `<div class="chart-block">
      <div class="section-label">Charts</div>
      <div class="chart-placeholder${item.charts.hot ? ' hot' : ''}">${item.charts.hot ? '🔥 CHART WORTH SAVING — ' : ''}${item.charts.count} chart(s). ${item.charts.desc || ''}</div>
    </div>`;
  }
  return `
  <div class="card" data-cat="${item.cat}" data-urg="${item.urgency}" data-src="${item.source}" id="card-${item.id}">
    <div class="card-header" onclick="toggleCard(${item.id})">
      <span class="idx">${String(item.id).padStart(2,'0')}</span>
      <span class="urg">${URGENCY_EMOJI[item.urgency]||''}</span>
      <span class="badge ${catClass}">${item.source}</span>
      <span class="cattag">${item.cat}</span>
      <span class="chartmark">${hotFlag}${chartFlag}</span>
      <span class="htitle">${item.title}</span>
      <span class="chev">▸</span>
    </div>
    <div class="card-body">
      <div class="section-label">The Idea</div>
      <div class="idea-text">${item.idea}</div>
      <div class="section-label">My Angle</div>
      <div class="angle-box ${borderClass}">${item.angle}</div>
      <div class="tweets">
        <div class="tweet a">
          <div class="tweet-label">TWEET A</div>
          <div class="tweet-text">${item.tweetA}</div>
          <button class="copy-btn" onclick="copyTweet(${item.id},'a')">📋 Copy</button>
        </div>
        <div class="tweet b">
          <div class="tweet-label">TWEET B</div>
          <div class="tweet-text">${item.tweetB}</div>
          <button class="copy-btn" onclick="copyTweet(${item.id},'b')">📋 Copy</button>
        </div>
      </div>
      ${chartsInner}
      <div class="linkline"><a href="${item.link}" target="_blank">↗ Read full article</a></div>
    </div>
  </div>`;
}

function renderCards(expandMatches) {
  const wrap = document.getElementById('cardsWrap');
  let filtered = ITEMS;
  if (activeSrc) {
    filtered = ITEMS.filter(i => i.source.indexOf(activeSrc) !== -1);
  } else {
    if (activeCat !== 'all') filtered = filtered.filter(i => i.cat === activeCat);
    if (activeUrg !== 'all') filtered = filtered.filter(i => i.urgency === activeUrg);
  }
  wrap.innerHTML = filtered.map(cardHtml).join('');
  if (expandMatches) {
    filtered.forEach(i => document.getElementById('card-'+i.id).classList.add('open'));
  }
}

function toggleCard(id) {
  const el = document.getElementById('card-'+id);
  el.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function toggleReport() {
  document.getElementById('reportCard').classList.toggle('open');
  document.getElementById('reportChev').textContent = document.getElementById('reportCard').classList.contains('open') ? '▾' : '▸';
}

function buildReport() {
  const el = document.getElementById('reportDetail');
  let html = `<p><strong>Window:</strong> ${META.windowStart} to ${META.windowEnd}</p>`;
  html += `<p><strong>Emails in window:</strong> ${META.emailsInWindow} &nbsp; <strong>Emails read:</strong> ${META.emailsRead} &nbsp; <strong>Items extracted:</strong> ${META.itemsExtracted}</p>`;
  html += `<div class="section-label">Included Sources</div><ul class="src-list">`;
  META.includedSources.forEach(s => {
    html += `<li><span class="srcname" onclick="filterBySrc('${s.name.replace(/'/g, "\\'")}')">${s.name}</span> — ${s.count} item(s)</li>`;
  });
  html += `</ul>`;
  if (META.skippedSources && META.skippedSources.length > 0) {
    html += `<div class="section-label">Skipped Sources</div><ul class="src-list">`;
    META.skippedSources.forEach(s => {
      html += `<li>${s.name || s} ${s.reason ? '— ' + s.reason : ''}</li>`;
    });
    html += `</ul>`;
  } else {
    html += `<div class="section-label">Skipped Sources</div><p>None — every email inside the strict 6-hour window was fully read and processed. 38 additional threads existed further back in the inbox but fell outside the time window and were not opened.</p>`;
  }
  el.innerHTML = html;
}

document.getElementById('headerMeta').textContent = `${META.date} · ${META.time} · ${META.itemsExtracted} items from ${META.includedSources.length} sources`;

buildFilterBars();
renderCards();
buildReport();
</script>
