    { name: "James Bulltard", emails: 1, items: 1 },
    { name: "Transformer News", emails: 1, items: 1 },
    { name: "Understanding AI", emails: 1, items: 1 },
    { name: "Peter Frankopan", emails: 1, items: 1 },
    { name: "The Credit Strategist", emails: 1, items: 1 },
    { name: "Kyla Scanlon", emails: 1, items: 2 },
    { name: "P Equity Research / Tema ETFs", emails: 1, items: 2 },
    { name: "The Bubble Bubble", emails: 1, items: 1 },
    { name: "Bankless", emails: 1, items: 1 },
    { name: "Robert Sinn / Goldfinger Capital", emails: 1, items: 1 },
    { name: "McKinsey Quarterly", emails: 1, items: 1 }
  ],
  skippedSources: [
    { name: "Hermit Research", reason: "Self-promotional track-record announcement, no analytical content" },
    { name: "SixSigmaCapital", reason: "Subscriber chat message restating already-covered PPI data plus a generic prompt, no original content" },
    { name: "Substack (no-reply)", reason: "Automated cross-publication recommendation digest, no content" },
    { name: "Zineb Riboua / Beyond the Ideological", reason: "Newsletter restructuring announcement, no analytical content" }
  ]
};

const CAT_COLORS = { macro:"#e24b4a", credit:"#378add", positioning:"#ef9f27", ai:"#1d9e75", crypto:"#7f77dd",
  geopolitics:"#d85a30", energy:"#f97316", tech:"#06b6d4", gold:"#d4a017", culture:"#ec4899",
  labor:"#8b5cf6", regulation:"#64748b", science:"#14b8a6", venture:"#84cc16" };
const CAT_LABELS = { macro:"Macro", credit:"Credit", positioning:"Positioning", ai:"AI/Infra", crypto:"Crypto",
  geopolitics:"Geopolitics", energy:"Energy", tech:"Tech", gold:"Gold", culture:"Culture",
  labor:"Labor", regulation:"Regulation", science:"Science", venture:"Venture" };
const URG_LABELS = { act:"🔴 Act Now", deep:"🔵 Deep", watch:"🟡 Watch" };
const URG_EMOJI = { act:"🔴", deep:"🔵", watch:"🟡" };

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function toggleCard(id) {
  var el = document.getElementById('card-' + id);
  el.classList.toggle('open');
}

function setCat(cat) {
  activeCat = cat;
  activeSrc = null;
  render();
}
function setUrg(urg) {
  activeUrg = urg;
  activeSrc = null;
  render();
}
function filterBySrc(name) {
  activeSrc = name;
  activeCat = "all";
  activeUrg = "all";
  render(true);
}

function toggleReport() {
  document.getElementById('reportCard').classList.toggle('open');
  document.getElementById('reportChev').textContent = document.getElementById('reportCard').classList.contains('open') ? '▴' : '▾';
}

function buildFilters() {
  var catCounts = {};
  var urgCounts = {};
  ITEMS.forEach(function(i) {
    catCounts[i.cat] = (catCounts[i.cat] || 0) + 1;
    urgCounts[i.urgency] = (urgCounts[i.urgency] || 0) + 1;
  });

  var catRow = document.getElementById('catFilters');
  var catHtml = '<span class="pill' + (activeCat === 'all' ? ' active' : '') + '" style="' + (activeCat === 'all' ? 'background:#333;' : '') + '" onclick="setCat(\'all\')">All <span class="count">' + ITEMS.length + '</span></span>';
  Object.keys(CAT_LABELS).forEach(function(cat) {
    if (!catCounts[cat]) return;
    var isActive = activeCat === cat;
    catHtml += '<span class="pill' + (isActive ? ' active' : '') + '" style="' + (isActive ? 'background:' + CAT_COLORS[cat] + ';' : 'color:' + CAT_COLORS[cat] + ';border-color:' + CAT_COLORS[cat] + '55;') + '" onclick="setCat(\'' + cat + '\')">' + CAT_LABELS[cat] + ' <span class="count">' + catCounts[cat] + '</span></span>';
  });
  catRow.innerHTML = catHtml;

  var urgRow = document.getElementById('urgFilters');
  var urgHtml = '<span class="pill' + (activeUrg === 'all' ? ' active' : '') + '" style="' + (activeUrg === 'all' ? 'background:#333;' : '') + '" onclick="setUrg(\'all\')">All <span class="count">' + ITEMS.length + '</span></span>';
  Object.keys(URG_LABELS).forEach(function(urg) {
    if (!urgCounts[urg]) return;
    var isActive = activeUrg === urg;
    urgHtml += '<span class="pill' + (isActive ? ' active' : '') + '" style="' + (isActive ? 'background:#555;' : '') + '" onclick="setUrg(\'' + urg + '\')">' + URG_LABELS[urg] + ' <span class="count">' + urgCounts[urg] + '</span></span>';
  });
  urgRow.innerHTML = urgHtml;
}

function buildReport() {
  var html = '';
  html += '<div><strong>Time window:</strong> ' + META.windowStart + ' &rarr; ' + META.windowEnd + ' (last 6 hours, hard boundary)</div>';
  html += '<div style="margin-top:4px;"><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp; <strong>Emails read:</strong> ' + META.emailsRead + ' &nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</div>';
  html += '<div class="section-label" style="margin-top:14px;">Included Sources</div>';
  html += '<table>';
  META.includedSources.forEach(function(s) {
    html += '<tr><td><span class="srcname" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span></td><td style="text-align:right;color:#6b6b6b;">' + s.emails + ' email' + (s.emails > 1 ? 's' : '') + ' &middot; ' + s.items + ' item' + (s.items > 1 ? 's' : '') + '</td></tr>';
  });
  html += '</table>';
  html += '<div class="section-label" style="margin-top:14px;">Skipped Sources</div>';
  html += '<div style="color:#6b6b6b;">None. Every email in the window had extractable content.</div>';
  document.getElementById('reportBody').innerHTML = html;
}

function render(expandMatching) {
  buildFilters();
  var container = document.getElementById('cards');
  var filtered = ITEMS.filter(function(i) {
    if (activeSrc) return i.source.indexOf(activeSrc) !== -1;
    if (activeCat !== 'all' && i.cat !== activeCat) return false;
    if (activeUrg !== 'all' && i.urgency !== activeUrg) return false;
    return true;
  });

  var html = '';
  filtered.forEach(function(item) {
    var color = CAT_COLORS[item.cat];
    var chartMark = '';
    if (item.charts.hot) chartMark = '<span class="chartmark">🔥</span>';
    else if (item.charts.count > 0) chartMark = '<span class="chartmark">📊</span>';

    html += '<div class="card' + (expandMatching && activeSrc ? ' open' : '') + '" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">#' + item.id + '</span>';
    html += '<span class="urg">' + URG_EMOJI[item.urgency] + '</span>';
    html += '<span class="badge" style="background:' + color + ';">' + item.source.split(' / ')[0] + '</span>';
    html += '<span class="catpill">' + CAT_LABELS[item.cat] + '</span>';
    html += chartMark;
    html += '<span class="card-title">' + item.title + '</span>';
    html += '</div>';

    html += '<div class="card-body">';
    html += '<div class="section-label">The Idea</div>';
    html += '<div class="idea-text">' + item.idea + '</div>';
    html += '<div class="angle-box" style="border-color:' + color + ';background:' + color + '14;">' + item.angle + '</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet-box"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet-box"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    if (item.charts.count > 0) {
      html += '<div class="chart-block' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '🔥 CHART WORTH SAVING &mdash; ' : '📊 ') + item.charts.desc + '</div>';
    }
    html += '<div class="link-row"><a href="' + item.link + '" target="_blank">&#8599; Read full article</a></div>';
    html += '</div>';
    html += '</div>';
  });
  container.innerHTML = html;
}

document.getElementById('headerMeta').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails';
document.getElementById('reportToggle').onclick = toggleReport;
buildReport();
render();
</script>
