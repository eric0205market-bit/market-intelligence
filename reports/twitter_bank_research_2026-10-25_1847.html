<title>Twitter Bank Research</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DATA POINT TAGS */
.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>

const REPORT_DATA = {"report_type": "TWITTER BANK RESEARCH", "collected_at": "2026-10-25T18:23:44Z", "window_days": 4, "freshness_gate": "FRESHNESS GATE PASSED.", "input_stats": {"total_tweets": 120, "considered": 120, "kept": 54, "dropped": 66, "deduped": 0}, "summary": "Goldman charts dominate (equity EPS/P/E and household ownership), alongside JPMAM 10–15yr return assumptions.\nBofA/Nomura items center on positioning: Hartnett calls, CTA bond short covering, AI vs ex-AI stocks.\nYardeni and Deutsche: S&P 500 de-rating and midterm seasonality.\nCounts: Goldman 24, JPM 12, BofA 6, Yardeni 4, Deutsche 2, Nomura 2, Apollo/Slok 1, Citi 1, HSBC 1, Jefferies 1, Morgan Stanley 1, UBS 1.", "by_bank_counts": {"Goldman": 24, "JPM": 12, "BofA": 6, "Yardeni": 4, "Deutsche": 2, "Nomura": 2, "Apollo/Slok": 1, "Citi": 1, "HSBC": 1, "Jefferies": 1, "Morgan Stanley": 1, "UBS": 1}, "banks": [{"bank": "Goldman", "theme": "Goldman charts — S&P 500/Nasdaq EPS and P/E, 8000 YE target, household equity ownership and flows", "items": [{"author": "neilsethinew", "text": "Goldman: Our 2027 S&P 500 EPS forecast is similar to the current bottom-up consensus estimate, implying that the recent trend of large upward revisions to analyst estimates is likely behind us. \n\nThe distribution of potential earnings outcomes is wider in 2028, by which time we think the boost to growth from AI investment spending will have completely faded. \n\nOur base case is for another year of healthy earnings growth in 2028, although our estimates are 7% below the bottom-up consensus forecast.", "tweet_url": "https://x.com/neilsethinew/status/2114401607144124763", "images": ["https://pbs.twimg.com/media/HVerw2VXoAAdjdd.jpg"], "created_at": "2026-10-25T17:00:01.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Average stock volatility has retreated from the summer GS $VIXEQ https://t.co/ndfebpZpac", "tweet_url": "https://x.com/MikeZaccardi/status/2114371656269369816", "images": ["https://pbs.twimg.com/media/HVfB0StWsAAQoj_.png"], "created_at": "2026-10-25T15:01:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Is this as good as it gets? Nasdaq 100 EPS growth seen at 44% this year, 26% in 2027 GS https://t.co/iVzYjcFze4", "tweet_url": "https://x.com/MikeZaccardi/status/2114364106325029218", "images": ["https://pbs.twimg.com/media/HVe681PWgAA-PO4.png"], "created_at": "2026-10-25T14:31:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "And that low positioning is likely part of what is keeping the VIX relatively contained according to Goldman even as \"SPX skew went turbo bid\".\n\n\"our flows reflected less of a reach for downside protection which we attribute to historically low net exposure.\" https://t.co/eEPpm7aGBM", "tweet_url": "https://x.com/neilsethinew/status/2114356304940781789", "images": ["https://pbs.twimg.com/media/HVb-amAX0AA7Ji1.jpg"], "created_at": "2026-10-25T14:00:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Nasdaq 100 P/E is now below that of the Russell 2000... that's a new one.. (both near 22x) GS https://t.co/qwgYM63Sc4", "tweet_url": "https://x.com/MikeZaccardi/status/2114350768643768693", "images": ["https://pbs.twimg.com/media/HVeu0esWkAAv-hg.jpg"], "created_at": "2026-10-25T13:38:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "The S&amp;P 500 P/E ratio fell last week, but the SPX EW P/E rose to 16x GS https://t.co/kb4eQphPW6", "tweet_url": "https://x.com/MikeZaccardi/status/2114348000965243073", "images": ["https://pbs.twimg.com/media/HVesTYiWUAAfdR-.png"], "created_at": "2026-10-25T13:27:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: S&amp;P 500 breadth has bounced from multi-decade lows https://t.co/vIytBzqMaS", "tweet_url": "https://x.com/MikeZaccardi/status/2114346993480822811", "images": ["https://pbs.twimg.com/media/HVerYvuW0AAKX5J.png"], "created_at": "2026-10-25T13:23:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Energy stocks up a whopping 54% YTD, with oil +122%\nBitcoin, bonds, bullion weakest so far in 2026 (GS) https://t.co/qXFbxZUYJC", "tweet_url": "https://x.com/MikeZaccardi/status/2114345987107860931", "images": ["https://pbs.twimg.com/media/HVeqeJnWsAETE6g.jpg"], "created_at": "2026-10-25T13:19:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "The S&amp;P 500's 19x P/E multiple is slightly below the 10yr average\n\nBut Staples haven't been this expensive in more than a decade GS... S&amp;P 500 sector valuations... https://t.co/ptgBzV1T8m", "tweet_url": "https://x.com/MikeZaccardi/status/2114343974047551870", "images": ["https://pbs.twimg.com/media/HVeoo-wWMAAaLQA.png"], "created_at": "2026-10-25T13:11:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "2% to 2.5% US real GDP growth expected in 2026 and the out year... remember that a chunk of the AI buildout stems from imports GS https://t.co/MaRHMTPI31", "tweet_url": "https://x.com/MikeZaccardi/status/2114339444090196156", "images": ["https://pbs.twimg.com/media/HVekhUQXcAACcSn.png"], "created_at": "2026-10-25T12:53:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "The stock market suggests just 1.9% US real GDP growth right now GS https://t.co/KEvTHYAWAx", "tweet_url": "https://x.com/MikeZaccardi/status/2114333908170948681", "images": ["https://pbs.twimg.com/media/HVeffDgWAAAzWfW.png"], "created_at": "2026-10-25T12:31:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Bonds have garnered the flows in the last 12 months GS https://t.co/heUpZv3r8x", "tweet_url": "https://x.com/MikeZaccardi/status/2114326449297461393", "images": ["https://pbs.twimg.com/media/HVeYs6DWQAAVjTo.png"], "created_at": "2026-10-25T12:01:22.000Z", "relayers": []}, {"author": "neilsethinew", "text": "And McElligott notes the selling in AI names has reversed what we had seen for much of this year when up day realized volatility exceeded down.\n\nZH: \"That is most acute in the AI-heavy Nasdaq and semis, where October down-day realized vol is now running nearly double up-day vol: 25.1 vs 13.5 for the NDX, and 44.2 vs 25.6 for SMH. The NDX up/down ratio of 0.5 is the 16th lowest since 1986.\"\n\nThat leads to the Nomura seeing the same thing as Goldman according to McElligott: \"'THE' incremental leveraged Equities $ is no longer 'Long-Short Eq HFs' running high Nets, but instead, 'Multi-Strat Market-Neutral' running low / no Net, i.e. for every long $ there is a short $, as an substantial reason IMHO as to why 'Corr 1' moves in Equities have become ever-increasingly rare, and require a true 'Macro Tail Shock'\".\n\nOr as ZH puts it: \"Which is why the index looked fine while the pods looked like a crime scene. Nothing says 'healthy market' like front-month VIX futures barely above 19 on the day hedge funds had their worst session in 15 years (per Goldman's VIP basket).\"", "tweet_url": "https://x.com/neilsethinew/status/2114326114545836339", "images": ["https://pbs.twimg.com/media/HVaoMAXWIAASKja.jpg"], "created_at": "2026-10-25T12:00:02.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Goldman expects 11% SPX EPS growth in CY 2027, with the index holding at a 19x P/E... 14% upside in the next 12 months https://t.co/Hl2wciZbXh", "tweet_url": "https://x.com/MikeZaccardi/status/2114318808089284612", "images": ["https://pbs.twimg.com/media/HVeRwIbWUAA-4ik.png"], "created_at": "2026-10-25T11:31:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Goldman sticks with a YE 8000 SPX target https://t.co/SzuLbpN2VA", "tweet_url": "https://x.com/MikeZaccardi/status/2114312634375835927", "images": ["https://pbs.twimg.com/media/HVeMIw4WMAANjn7.png"], "created_at": "2026-10-25T11:06:28.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: P/E ratios have risen alongside household equity allocations\n\nRebalancing is not an American virtue https://t.co/8guvkIAn83", "tweet_url": "https://x.com/MikeZaccardi/status/2113999705772318724", "images": ["https://pbs.twimg.com/ rm outlook for all alternative assets\n\n-Economic Nationalism, Technology Adoption, Capital Rewiring https://t.co/OOEORqY2u9", "tweet_url": "https://x.com/MikeZaccardi/status/2114324345627582588", "images": ["https://pbs.twimg.com/media/HVeWyZmXYAEU9cX.jpg"], "created_at": "2026-10-25T11:53:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "JPMAM: AI electricity demand is projected to grow significantly through 2030 $XLU \n\nif only AI stock returns looked so tidy https://t.co/ItVpbEeqGt", "tweet_url": "https://x.com/MikeZaccardi/status/2114320569214669201", "images": ["https://pbs.twimg.com/media/HVeTWptXYAAAVri.png"], "created_at": "2026-10-25T11:38:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "JPMAM: A balanced portfolio earns a respectable return over the next 10 to 15 years\n~6% in high-quality bonds\n~7.5% in global stocks\n\nThe 60/40 looks like a great choice! https://t.co/EylEEvPTU9", "tweet_url": "https://x.com/MikeZaccardi/status/2114316794873663986", "images": ["https://pbs.twimg.com/media/HVeP687WAAETD3M.png"], "created_at": "2026-10-25T11:23:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "JPMAM sees global stocks (pick your poison) returning 7-8% on average annually over the next 10-15 years https://t.co/Gv7j6yC34Z", "tweet_url": "https://x.com/MikeZaccardi/status/2114016818129997863", "images": ["https://pbs.twimg.com/media/HVZ_F_-WkAA8o0G.png"], "created_at": "2026-10-24T15:31:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "JPMAM sees 6%-plus returns in US IG credit (including a 0.3% default haircut) https://t.co/oHuY4CtrPv", "tweet_url": "https://x.com/MikeZaccardi/status/2114013043046719805", "images": ["https://pbs.twimg.com/media/HVZ7qRKWQAAD29t.png"], "created_at": "2026-10-24T15:16:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "JPMAM sees US Treasurys as quite cheap in an expensive world https://t.co/yhitZN6xLV", "tweet_url": "https://x.com/MikeZaccardi/status/211401103 "], "created_at": "2026-10-25T15:16:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Lots of 2018 macro parallels... how about a technical parallel? \n\nSPX: 4Q18 trade war = 4Q26 oil war?.. Ciana BofA https://t.co/0vPUbJcFMv", "tweet_url": "https://x.com/MikeZaccardi/status/2114367882566000858", "images": ["https://pbs.twimg.com/media/HVe-Ym0W8AA4j0j.jpg"], "created_at": "2026-10-25T14:46:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Margin debt has turned down from extreme levels and was near past late-cycle extremes\n\nPrior YoY peaks of 80% in March 2000, 63% in June 2007, and 72% in April 2021 preceded equity declines later in 2000, 2008, and 2022 -Ciana BofA https://t.co/hAFgUONvtp", "tweet_url": "https://x.com/MikeZaccardi/status/2114360331564634336", "images": ["https://pbs.twimg.com/media/HVe3hHDW8AARIU8.jpg"], "created_at": "2026-10-25T14:16:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "For now, Hartnett reiterates his call to “sell hubris, buy humiliation,” and is adding to “peak yield” plays: small caps, REITs, utilities and consumer discretionary.\n\nInvestors are doing the opposite. In the week through Wednesday:\n\n▪ Consumer funds saw outflows of$2.1B, the 2nd-largest on record and the largest since Feb 2014\n▪ Utilities shed $1.6B, also the 2nd-largest on record and the largest since Mar 2015\n▪ US small-cap funds -$7.5N\n▪ Tech funds though added $18.8B, the largest inflow since July\n\nHarnett calls the utility and discretionary outflows “capitulatory.” He also notes small and mid-caps are holding key levels, which “says macro fine, Oct risk-off just tech de-rating in tightening cycle.”", "tweet_url": "https://x.com/neilsethinew/status/2114341207727837232", "images": ["https://pbs.twimg.com/media/HVaqRxgWYAAaNLj.jpg"], "created_at": "2026-10-25T13:00:01.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BofA says that CTAs have covered most of their bond shorts:\n\n\"CTA short covering spread through the belly and long end of the US Treasury curve this week as yields declined alongside equities, contributing to a broader de-grossing of CTA positions across asset classes. TY [10-year] and longer-dated futures crossed all of our risk management thresholds, but some 2yr and 5yr shorts appear to remain and could still be in the process of covering. \n\n\"Given the front end’s lower volatility, the front end shorts were likely larger at their peak than the long-end positions already unwound. Despite the covering, Treasury futures trends remain at maximum negative levels across lookbacks, suggesting CTAs are still far from turning long.\"", "tweet_url": "https://x.com/neilsethinew/status/2114333659511873553", "images": ["https://pbs.twimg.com/media/HVb8wMzWgAAlN_c.jpg"], "created_at": "2026-10-25T12:30:01.000Z", "relayers": []}, {"author": "neilsethinew", "text": "With the action this week, which Nomura's McElligott said resulted in a \"traumatic risk-management unwind\" that saw 124 pair trades stop out on the firm's Long/Short monitor including 47 greater than three standard deviations, 26 greater than four and 6 greater than five.  \n\nAs ZH notes \"a 5-sigma move is supposed to happen roughly once every few thousand years in a normal distribution.\"\n\nMcElligott: To me, a lot of this \"Stop-Out / Capitulation\" is about Crowding in what had been an unusual year of widespread \"High Sharpe Winners\" as the \"Gifts That Kept Giving\" in both -Carry and -Trend....but now, particularly with the abject \"Performance Pain\" now occuring late in the year during Q4... Traders are now simply forced or incentivized to \"Survive Drawdowns\" and avoid having their Capital culled ahead of the new year PNL turn...so it's \"De-risking and Shut-It-Down\" -mode even if some juicy looking trades are there.\n\nZH: as McElligott shows, the \"Reversing\" flag is now lit up across nearly every asset class on Nomura's trend monitor: Treasuries across the curve, EUR rates, JGBs, SOFR futures, the S&P, the Nasdaq 100, copper, cocoa, sugar and half the G10 FX board.\n\nhttps://t.co/WTe249s7D3", "tweet_url": "https://x.com/neilsethinew/status/2113993664150270085", "images": ["https://pbs.twimg.com/media/HVZbbGMXoAEBaGS.jpg"], "created_at": "2026-10-24T13:59:00.000Z", "relayers": []}]}, {"bank": "Yardeni", "theme": "Yardeni — S&P 500 target/caution note, P/E de-rating, Tech P/E history, AI investment", "items": [{"author": "neilsethinew", "text": "Yardeni: On September 15, we advised investors to proceed with caution. We pushed out our 8,400 S&P 500 target from year-end 2026 to mid-2027 and set 7,900 as our new year-end target. On October 14, we reiterated our caution. Sure enough, the stock market has been turbulent since mid-September, with AI-related stocks falling sharply.\n\nWe are seeing some buying opportunities, but better ones are likely after the November 3 midterm elections. Our main concern is a likely escalation of the Middle East war. That could push oil prices above their $120 peak earlier this year.\n\nBreadth remains on the weak side. Only 37.8% of S&P 500 companies are outperforming the index on a y/y basis (chart).", "tweet_url": "https://x.com/neilsethinew/status/2114351018783948947", "images": ["https://pbs.twimg.com/media/HVerJjVX0AAboml.png"], "created_at": "2026-10-25T13:39:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "The S&amp;P 500 P/E ratio has fallen to 18.4x... down from 23.2x at the peak a year ago... a 20% de-rating\n\nA valuation bear market. @Yardeni https://t.co/U0zeHbt8mE", "tweet_url": "https://x.com/MikeZaccardi/status/2114341458031325406", "images": ["https://pbs.twimg.com/media/HVemWe6WoAEDhrY.jpg"], "created_at": "2026-10-25T13:01:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "From @Yardeni: The Tech sector traded with a low-teens P/E from 2011 to 2014... pretty wild\n\n(Some folks asked for a longer-term view of the Tech P/E) https://t.co/q8YPzNLvKT", "tweet_url": "https://x.com/MikeZaccardi/status/2114067722547900434", "images": ["https://pbs.twimg.com/media/HVatY_6XoAAm4_t.jpg"], "created_at": "2026-10-24T18:53:17.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Ed Yardeni sees AI investment continuing but tempered by market concerns which has seen the Mag-7 underperform the \"other 493\" by almost four percent through Thursday's close:\n\nWe view market-driven tightening access to capital as healthy for the AI boom, resulting in more efficient capital allocation and reducing over-investment risks. Importantly, we expect the key players to retain financing access. The five major hyperscalers (Amazon, Alphabet, Meta, Microsoft, and Oracle) alone are projected to spend almost $780 billion in 2026. Over each of the following four years, from 2027 through 2030, that figure is expected to exceed $1 trillion annually. Their strong cash flows, balance sheets, and market access should allow them to continue investing in AI.", "tweet_url": "https://x.com/neilsethinew/status/2113986368565063944", "images": ["https://pbs.twimg.com/media/HVXLGGnWkAA7Azz.png"], "created_at": "2026-10-24T13:30:00.000Z", "relayers": []}]}, {"bank": "Deutsche", "theme": "Deutsche Bank — midterm-election seasonality and House seat history", "items": [{"author": "MikeZaccardi", "text": "DB: Regardless of the midterms' outcome, the S&amp;P 500 has a pronounced bullish trend leading into and in the 2 months after the election https://t.co/7EQcjbxzA5", "tweet_url": "https://x.com/MikeZaccardi/status/2114340451100594428", "images": ["https://pbs.twimg.com/media/HVelb6FWgAA12TW.jpg"], "created_at": "2026-10-25T12:57:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "DB: Penultimate weekend before the election... GOP set to lose ~40 House seats if history is any guide https://t.co/sytZbYd933", "tweet_url": "https://x.com/MikeZaccardi/status/2114338563563135086", "images": ["https://pbs.twimg.com/media/HVejuCGXYAA7l-I.jpg"], "created_at": "2026-10-25T12:49:30.000Z", "relayers": []}]}, {"bank": "Nomura", "theme": "Nomura (McElligott) — AI-name selling reversal and risk-management unwind", "items": [{"author": "neilsethinew", "text": "And McElligott notes the selling in AI names has reversed what we had seen for much of this year when up day realized volatility exceeded down.\n\nZH: \"That is most acute in the AI-heavy Nasdaq and semis, where October down-day realized vol is now running nearly double up-day vol: 25.1 vs 13.5 for the NDX, and 44.2 vs 25.6 for SMH. The NDX up/down ratio of 0.5 is the 16th lowest since 1986.\"\n\nThat leads to the Nomura seeing the same thing as Goldman according to McElligott: \"'THE' incremental leveraged Equities $ is no longer 'Long-Short Eq HFs' running high Nets, but instead, 'Multi-Strat Market-Neutral' running low / no Net, i.e. for every long $ there is a short $, as an substantial reason IMHO as to why 'Corr 1' moves in Equities have become ever-increasingly rare, and require a true 'Macro Tail Shock'\".\n\nOr as ZH puts it: \"Which is why the index looked fine while the pods looked like a crime scene. Nothing says 'healthy market' like front-month VIX futures barely above 19 on the day hedge funds had their worst session in 15 years (per Goldman's VIP basket).\"", "tweet_url": "https://x.com/neilsethinew/status/2114326114545836339", "images": ["https://pbs.twimg.com/media/HVaoMAXWIAASKja.jpg"], "created_at": "2026-10-25T12:00:02.000Z", "relayers": []}, {"author": "neilsethinew", "text": "With the action this week, which Nomura's McElligott said resulted in a \"traumatic risk-management unwind\" that saw 124 pair trades stop out on the firm's Long/Short monitor including 47 greater than three standard deviations, 26 greater than four and 6 greater than five.  \n\nAs ZH notes \"a 5-sigma move is supposed to happen roughly once every few thousand years in a normal distribution.\"\n\nMcElligott: To me, a lot of this \"Stop-Out / Capitulation\" is about Crowding in what had been an unusual year of widespread \"High Sharpe Winners\" as the \"Gifts That Kept Giving\" in both -Carry and -Trend....but now, particularly with the abject \"Performance Pain\" now occuring late in the year during Q4... Traders are now simply forced or incentivized to \"Survive Drawdowns\" and avoid having their Capital culled ahead of the new year PNL turn...so it's \"De-risking and Shut-It-Down\" -mode even if some juicy looking trades are there.\n\nZH: as McElligott shows, the \"Reversing\" flag is now lit up across nearly every asset class on Nomura's trend monitor: Treasuries across the curve, EUR rates, JGBs, SOFR futures, the S&P, the Nasdaq 100, copper, cocoa, sugar and half the G10 FX board.\n\nhttps://t.co/WTe249s7D3", "tweet_url": "https://x.com/neilsethinew/status/2113993664150270085", "images": ["https://pbs.twimg.com/media/HVZbbGMXoAEBaGS.jpg"], "created_at": "2026-10-24T13:59:00.000Z", "relayers": []}]}, {"bank": "Apollo/Slok", "theme": "Japan corporate profits chart", "items": [{"author": "MikeZaccardi", "text": "Japan corporate profits are soaring $EWJ $DXJ ... after renewed shareholder activism in the Land of the Rising Sun\nT at Apollo https://t.co/9EkAfNRSTo", "tweet_url": "https://x.com/MikeZaccardi/status/2114308852476748156", "images": ["https://pbs.twimg.com/media/HVeIsmsW4AA7umq.jpg"], "created_at": "2026-10-25T10:51:27.000Z", "relayers": []}]}, {"bank": "Citi", "theme": "Citi economic surprise index", "items": [{"author": "neilsethinew", "text": "Citi economic surprise index eased back to 44.4 from 46.1, still much closer to the highs of the year than the lows. https://t.co/ZaPbvYtZfV", "tweet_url": "https://x.com/neilsethinew/status/2114416703895683128", "images": ["https://pbs.twimg.com/media/HVetI8CWwAAKBJw.jpg"], "created_at": "2026-10-25T18:00:00.000Z", "relayers": []}]}, {"bank": "HSBC", "theme": "HSBC chart of the week — bonds as AI hedge", "items": [{"author": "MikeZaccardi", "text": "HSBC: Chart of the week – Bonds hedging again?\n\n\"For those worried about the AI boom turning to bust, last week’s market action offered a taster of how things could unfold.\" https://t.co/82GsXpv2Db", "tweet_url": "https://x.com/MikeZaccardi/status/2114345232015704410", "images": ["https://pbs.twimg.com/media/HVepyNQXoAABUV7.jpg"], "created_at": "2026-10-25T13:16:00.000Z", "relayers": []}]}, {"bank": "Jefferies", "theme": "Jefferies — gold bullish view (MarketWatch)", "items": [{"author": "neilsethinew", "text": "Despite the weakness in gold, still lots of fans.\n\nMarketWatch: U.S. investment bank Jefferies is bullish on gold after its correction back towards $4000, identifying “an attractive risk reward opportunity.” \n\nThey note that the relationship between gold and some traditional macro drivers appears to be breaking down. For instance, the jump in U.S real yields (nominal bond yields minus inflation) and a stronger dollar, which are typically bearish for gold, wasn't the case in late summer this year.\n\n[Neil: There does seem to be some indication since mid-July of a breakdown in the relationship with the 10-year yield, but the dollar not so much (chart).] \n\nJefferies stresses demand from central banks, especially China’s which bought 23 metric tons last month, remains robust. Meanwhile, the speculative positioning of trend-following or systematic funds has been reduced to historical lows. These CTAs cut long positions in gold to the bottom end of the range. They now show a $10 billion net short exposure.\n\nJefferies’ conclusion: “fast money has been selling while structural buyers have continued accumulating.” If the market’s current narrative -- that U.S. Treasury yields have peaked -- holds true, then Jefferies reckons this will attract buyers, rendering gold susceptible to a short squeeze.", "tweet_url": "https://x.com/neilsethinew/status/2114084515786444836", "images": ["https://pbs.twimg.com/media/HVaicc-WIAAANou.jpg"], "created_at": "2026-10-24T20:00:01.000Z", "relayers": []}]}, {"bank": "Morgan Stanley", "theme": "Morgan Stanley AI basket vs Treasury yields (BBG)", "items": [{"author": "neilsethinew", "text": "BBG: In contrast with July when Treasury yields climbed despite a drop in Morgan Stanley's AI basket, Treasuries resumed their more normal safe haven role in October. https://t.co/gmgedlczvo", "tweet_url": "https://x.com/neilsethinew/status/2113978819241472227", "images": ["https://pbs.twimg.com/media/HVZTeqsXUAAihp5.png"], "created_at": "2026-10-24T13:00:00.000Z", "relayers": []}]}, {"bank": "UBS", "theme": "UBS — year-end rally odds (MarketWatch)", "items": [{"author": "neilsethinew", "text": "MarketWatch: The chances of a stock-market rally into the year end are rising, according to UBS, and they suggest a trade for investors to make.\n\nIn a note published Monday, the Swiss bank says: \"From late October on, we see rising odds of a more correlated rally in equities if 1) rates/ oil pressures abate, 2) U.S. midterm election risks do not realize, 3) AI narratives/demand are supportive, 4) earnings beats provide a tailwind, and 5) corporate buyback activity and announcements pick up.\" [Um, yeah?]\n\nThe biggest risk, judging by how options traders are pricing likely moves in the S&P 500 (SPX), is around the midterm election, as UBS's chart shows.\n\nBut the S&P 500 has historically rallied an average of 6% from the end of September to the end of December in midterm election years, and an average of 14% from end September to end March, according to UBS.\n\n\"We see rising odds of a broadening in the equity market rally if the above catalysts turn out largely positive. Rising equity markets associated with rising correlations has historically resulted in stronger returns,\" they say.\n\nUBS says the trade to make is to buy out of the money (OTM) call options on the S&P 500. OTM call options have a strike price above the current S&P 500 level and are bullish bet on the index that have greater risk and potentially greater reward.", "tweet_url": "https://x.com/neilsethinew/status/2114160841549398396", "images": ["https://pbs.twimg.com/media/HVcCFLEXAAAebyV.png"], "created_at": "2026-10-25T01:03:18.000Z", "relayers": []}]}]};

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
