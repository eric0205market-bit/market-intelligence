<script>
const ITEMS = [{"cat": "crypto", "urgency": "deep", "source": "Trading Mindset & Data (TMAD)", "title": "Citi flips its BTC call: $113k target (from $82k), ETH $3,028, ~$5B institutional inflows", "idea": "Citigroup raised its 12-month BTC target to $113,000 from $82,000 and ETH to $3,028 from $2,240 on Oct 1 — the first upward revision after a year of cuts. Drivers cited: ~$5B gradual institutional inflows, weaker dollar, Treasury buybacks, ETF demand returning. TMAD adds $IBIT $48 as a pin level in positive GEX, $50-55 above it, and says 'out of the crypto bear market' with midterms ~3 weeks away.", "angle": "A sell-side desk reversing after a year of cuts is a sentiment marker, not a signal. The 'weaker dollar' leg sits awkwardly against a 10Y at 5.3%.", "tweetA": "Citi took 12 months of BTC cuts and reversed on a $5B inflow estimate. That's less than one bad IBIT week. The call tells you where sell-side positioning was, not where the price goes. $IBIT $BTC", "tweetB": "Citi's bull case needs a weaker dollar and Treasury buybacks. The 10Y is sitting at 5.3%. Pick one: BTC as a liquidity trade, or BTC as a duration trade. They're not the same position. $BTC $ETH", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.tmad.news/p/tmad-weekly-bitcoin-upgrade-and-market", "id": 1}, {"cat": "macro", "urgency": "deep", "source": "Trading Mindset & Data (TMAD)", "title": "Higher-for-longer is splitting the tape: profitable mega-caps and energy hold, unprofitable growth, small caps, REITs, utilities struggle", "idea": "TMAD frames the market as pricing higher-for-longer rates: flows concentrate in profitable, FCF-rich mega-caps (Mag 7, large tech) plus energy, while unprofitable growth, leveraged small caps, real estate and utilities lag. SPX levels: resistance 7,820/7,850, support 7,768/7,760. They hold MSFT/AMZN for swings, NVDA with tighter stop, and warn to trim speculative names (ONDS, RCAT, PUSA); financials start earnings this week.", "angle": "The market is now a quality/balance-sheet screen, not a beta trade. It lines up with Eliant's weak breadth numbers and Seven c's 42% concentration.", "tweetA": "Market at all-time highs, 28% of stocks above their 50DMA. That isn't a bull market, that's ten companies and a yield curve. The question is what the other 490 know. $SPY $RSP", "tweetB": "Unprofitable growth gets crushed when the discount rate goes up. Not a new idea. The new part is that the 10Y is at 5.3% and index is at a record. Something in that pair has to give by the guide season. $IWM $QQQ", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.tmad.news/p/tmad-weekly-bitcoin-upgrade-and-market", "id": 2}, {"cat": "macro", "urgency": "deep", "source": "Seven c Newsletter #189", "title": "Fed minutes: most officials still see another 2026 hike; some think rates are barely restrictive; markets price ~85% pause odds", "idea": "Per Seven c's roundup: Fed minutes show most officials still see another hike in 2026, several think policy is barely restrictive, yet markets price ~85% odds of a pause this month. 1-year inflation expectations hit 3.9%, highest since 2023. The author's summary: 'Prices up, jobs soft — the mix the Fed hates most.'", "angle": "Market (85% pause) vs. committee (hike is base case) is a big gap going into Wednesday's CPI. Any print at the 0.6% MoM estimate forces a repricing.", "tweetA": "85% pause priced. Most of the committee on record seeing another hike. That's not a forecast gap, that's a CPI-day trade. Wednesday decides which of them is wrong. $TLT $DXY", "tweetB": "1y inflation expectations at 3.9% with a funds rate some officials call 'barely restrictive.' If that's neutral, what exactly is 5.3% on the 10Y doing? $TNX", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-189", "id": 3}, {"cat": "labor", "urgency": "deep", "source": "Seven c Newsletter #189", "title": "US payrolls revised down in 16 of the last 20 months: -793k cumulative; apply average revision to Sept's +29k and it turns negative", "idea": "Seven c: jobs have been revised down in 16 of the last 20 months for a cumulative -793k. Apply the average revision to September's +29k print and it goes negative. Canada shed 68k jobs in September, unemployment 6.5%.", "angle": "Two Fed-relevant facts in one: the labor market is weaker than headlines, and the data the Fed is reacting to is systematically too strong on first print.", "tweetA": "Down-revised 16 of 20 months. At some point that's not noise, that's a bias in the first print. The Fed is hiking against a data series that keeps getting restated lower. $SPY $TLT", "tweetB": "Take +29k, subtract the average revision, and you're negative. The Fed is debating a hike while payrolls are arguably contracting. Canada just lost 68k in a month. Don't tell me it's not global. $CAD", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-189", "id": 4}, {"cat": "credit", "urgency": "deep", "source": "Seven c Newsletter #189", "title": "CCC junk spreads blew out to 12% while indices make new highs", "idea": "Seven c lists CCC junk bond spreads at 12% in the same roundup where S&P hit all-time highs. Context: 10Y near 5.3%, 1-year inflation expectations 3.9%.", "angle": "CCC at 12% with SPX at ATH is the bottom of the capital structure telling you what the top won't. Watch for HY/CCC vs. equity divergence into earnings.", "tweetA": "CCC spreads at 12%. S&P at a record. One of these is lying and it's usually not credit. $HYG $JNK", "tweetB": "Higher for longer doesn't hit the Mag 7. It hits the CCC refinancing wall. 12% spreads is the market pricing who doesn't make it. $HYG", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-189", "id": 5}, {"cat": "energy", "urgency": "deep", "source": "Seven c Newsletter #189", "title": "Shipping one barrel West Africa to China costs ~$27 vs ~$6.50 pre-war; Aramco says global reserves dangerously low, two years to rebuild", "idea": "Seven c: Gulf crude exports are back above 14m b/d (~80% of pre-war), but freight for a West Africa-to-China barrel is ~$27, up from ~$6.50. Aramco says global reserves are dangerously low and need two years to rebuild. Brent is back above $100.", "angle": "Freight at 4x is a hidden inflation channel that never shows up in the Brent headline. Reserve rebuild is a two-year bid under crude even if flows normalize.", "tweetA": "Oil flows are back to 80% of pre-war. Freight is 4x. That's the gap between the Brent print and what refiners actually pay. And Aramco says it takes two years to refill. $XOM $VLO", "tweetB": "Reserves 'dangerously low,' two years to rebuild. Nobody models SPR and commercial restock as a demand source. If Hormuz fully normalizes tomorrow, the bid doesn't leave. $USO $CVX", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-189", "id": 6}, {"cat": "geopolitics", "urgency": "deep", "source": "Seven c Newsletter #189", "title": "Brent >$100, then Trump rules out striking Iran before Nov 3 midterms; US lifts Russian diesel sanctions until April 2027", "idea": "Seven c: Brent went back above $100 before Trump ruled out hitting Iran before the Nov 3 midterms. The US lifted sanctions on Russian diesel until April 2027 — Zelensky called it a 'birthday present for Putin.' Houthi missiles shut Riyadh airport, at least 12 dead.", "angle": "Energy policy is being set by the electoral calendar. The Russian diesel waiver through April 2027 is a long-dated signal that the US expects tight distillates well past the midterms.", "tweetA": "No strikes on Iran before Nov 3. Sanctions waiver on Russian diesel to April 2027. Read together: Washington is managing a gasoline price through an election, not an oil market. What happens on Nov 4? $USO", "tweetB": "A diesel waiver that runs 18 months past the midterms isn't a midterm gimmick. It's an admission that distillate supply doesn't fix itself by then. $HO $VLO", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-189", "id": 7}, {"cat": "positioning", "urgency": "deep", "source": "Seven c Newsletter #189", "title": "'Everyone is on the same side of the boat': AI basket +58% YTD vs S&P ex-AI +5%; hedge fund Mag 7 net exposure record 22%; retail 71.8% in stocks", "idea": "Seven c data: 'AI winners' basket +58% this year, S&P ex-AI +5%. Ten AI giants are 42% of the US market. Hedge fund net Mag 7 exposure is a record 22%. Retail allocation to stocks is 71.8%, highest since 2017.", "angle": "Three independent positioning gauges (HF, retail, index weight) at records at the same time. Fragile to any AI revenue disappointment.", "tweetA": "Ex-AI the S&P is up 5% this year. That's a 5% market with a 58% basket on top of it. Hedge funds at record Mag 7, retail at 72% equities. Who is left to buy? $SPY $NVDA", "tweetB": "42% of the US market in ten stocks. In 2000 the top ten was about 25%. We aren't 'near' the 2000 concentration, we're through it. $QQQ $SPY", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-189", "id": 8}, {"cat": "AI/infra", "urgency": "act", "source": "Seven c Newsletter #189", "title": "OpenAI run-rate reportedly $20B below expectations; Oracle and Nvidia sold off", "idea": "Seven c reports OpenAI's revenue run-rate came in about $20B below expectations, with Oracle and Nvidia selling off on the news. Same roundup: US chip imports hit a record $15.4B in August, +185% YoY.", "angle": "OpenAI is the anchor tenant of the Oracle/Nvidia/neocloud complex. A $20B shortfall against plan is a direct hit to the capex financing chain.", "tweetA": "OpenAI $20B short of its run-rate plan and the sell-off was in $ORCL and $NVDA, not in $MSFT. The market knows whose capex is underwritten by that revenue line.", "tweetB": "US chip imports +185% YoY to $15.4B in one month while the biggest customer misses its revenue plan. Supply is compounding. Demand is a spreadsheet. $NVDA $TSM", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-189", "id": 9}, {"cat": "tech", "urgency": "deep", "source": "Seven c Newsletter #189", "title": "SpaceX buys spectrum to become a mobile carrier; AT&T, Verizon, T-Mobile get hit", "idea": "Seven c: SpaceX bought spectrum to become a mobile carrier, and AT&T, Verizon and T-Mobile sold off on the news.", "angle": "Starlink direct-to-cell moves from supplement to competitor. Terrestrial towers (INWIT take-private chatter in Pressure Point) are the other side of the same trade.", "tweetA": "SpaceX buys spectrum and three carriers get 'smoked.' Now go look at tower companies being taken private in Europe this week. The market is repricing who owns the last mile. $T $VZ $TMUS", "tweetB": "Satellite operator buys spectrum, incumbents drop. The incumbents' moat was spectrum scarcity. That was a license, not a technology. $T $VZ", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-189", "id": 10}, {"cat": "crypto", "urgency": "deep", "source": "Seven c Newsletter #189", "title": "SEC approves first 3x leveraged BTC and ETH ETFs, same week as the $19B 10/10 liquidation anniversary", "idea": "Seven c: SEC approved the first 3x leveraged BTC and ETH ETFs; Thailand's BTC and ETH ETFs go live Oct 16; the US government moved $1B+ of seized Bitfinex BTC. The author notes the 3x approval lands the week of the anniversary of the $19B 10/10 liquidation.", "angle": "Leveraged ETFs with daily rebalancing add pro-cyclical flow at the worst moment in a drawdown. Government wallet movement adds a supply overhang narrative.", "tweetA": "3x BTC ETFs approved one year after $19B got liquidated in a day. Daily-rebalanced leverage buys high and sells low by design. The next flush has a new accelerant. $BTC $ETH", "tweetB": "US government moves $1B+ of Bitfinex BTC the same week as the leveraged ETF approval. Pair that with Citi's $5B inflow estimate and the arithmetic of net new demand gets thin. $BTC", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-189", "id": 11}, {"cat": "culture", "urgency": "watch", "source": "Paper Alfa / Attack the Week", "title": "Retirement as 'ikigai' problem: retire from the career, not from life", "idea": "Paper Alfa's Sunday note questions retirement itself: a former boss, a year out, regrets winding down without a plan; the author's father has been retired two decades yet stays busy. The argument is that purposelessness, not money, is the real retirement risk. Also announces an updated US regime model and asset allocation on pa-globalmacro.com.", "angle": "Aging demographics plus a purpose gap point to longer working lives, which has labor supply and consumer-spend implications.", "tweetA": "Everyone models retirement as a number. Nobody models it as a purpose gap. If the next cohort keeps working into their 70s by choice, the labor force and annuity math both change.", "tweetB": "A trader who retired and 'regrets it after a year' is a data point on how much of professional identity is the job. The silver economy might skew to part-time consulting, not leisure spend.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.paperalfa.com/p/attack-the-week-atw-3ba", "id": 12}, {"cat": "positioning", "urgency": "watch", "source": "Cubic Analytics", "title": "Cubic Analytics: 'I found the risk' — a bullish analyst says one unnamed risk could hit as soon as this week", "idea": "Cubic's author, who says he usually reaches bullish conclusions on US equities, writes that one risk worries him that 'no one else is talking about,' could start impacting markets as soon as this week, and advises either reducing exposure or preparing to buy the dip. The risk itself is behind the paywall in this email.", "angle": "A habitually bullish analyst turning cautious is itself a sentiment signal. Candidates this week: CPI Wednesday, bank earnings, 10Y near 5.3%.", "tweetA": "When a perma-bull titles a note 'I found the risk' and won't say what it is, you learn nothing about the risk and everything about how crowded the long is. CPI is Wednesday. $SPY", "tweetB": "The best part of this email is the instruction to either cut exposure or buy the panic. That's a hedge on being wrong, in writing. I'd rather know what the risk is. $SPX", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://cubicanalytics.substack.com/p/i-found-the-risk", "id": 13}, {"cat": "AI/infra", "urgency": "watch", "source": "Pequity Research (Expert Call)", "title": "HBF has four competing architectures — and today there's essentially no measured data, only simulation", "idea": "Expert call question list: the options are HBF-only, HBF+HBM shared, HBM with HBF as cache, and a disaggregated design. SanDisk/Hynix vs Kioxia/Samsung approaches differ. Q9 states the premise that there is practically no measured data, only simulation, and market sizing assumes bandwidth, latency and power. Q6 asks why HBF can't replace HBM in training; Q7 frames inference (weights plus large KV cache) as the opportunity.", "angle": "A memory tier being sized on simulations is a classic early-cycle setup. Inference-only and training-excluded is the cap on the TAM story.", "tweetA": "High Bandwidth Flash: four candidate architectures, no silicon measurements, TAM from simulations. Real signal is which vendor gets in the first accelerator sample. Until then it's a narrative. $SNDK $MU", "tweetB": "HBF can't replace HBM in training. It can sit next to it for KV cache in inference. That's the whole bull case: terabytes of cheap capacity at slower speed. Cheap capacity is what NAND vendors sell. $SNDK $WDC", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pequityresearch.substack.com/p/expert-call-hbf-architecture-applications", "id": 14}, {"cat": "AI/infra", "urgency": "watch", "source": "Pequity Research (Expert Call)", "title": "HBF at the edge: SanDisk eyes phones, cars, robotics; Meta Muse named in the HBF consortium", "idea": "The expert-call questions (Q17-Q22) ask when edge/open-model inference becomes realistic, laptop vs phone first, SanDisk's longer-term HBF targets in phones, cars and robotics, and name Meta Muse as a member of the HBF consortium. Also asks whether HBF needs an HBM-style packaging ecosystem and how optical interconnect interacts with the roadmap.", "angle": "Edge inference pushes memory demand into consumer devices, a different supply chain than HBM and datacenter DRAM.", "tweetA": "Memory wall solutions: faster interconnect (optical) or bigger local memory (HBF). The edge story only works with the second. Watch which one the hyperscalers fund. $SNDK $LITE", "tweetB": "If HBF lands in phones and robots, flash vendors become AI beneficiaries without selling a single datacenter GPU part. That's a very different multiple. $SNDK $WDC", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pequityresearch.substack.com/p/expert-call-hbf-architecture-applications", "id": 15}, {"cat": "AI/infra", "urgency": "deep", "source": "Irrational Analysis", "title": "3D XPoint died 'too early and too late' — and AI KV cache/persistence is the use case it never had", "idea": "Irrational Analysis: 3DXP gave 2-5x (sometimes 10x) over NAND NVMe SSDs but hundreds of x on random latency; it stalled at 4 layers while NAND went 48-128 -> 200-300+. It lost on cost vs NAND and on interface (NVMe/PCIe, Ice Lake delays) vs DRAM. Persistence — keeping KV cache or weights through power cycles — matters in AI in a way it never did for databases. Author calls HBF 'pathetic in comparison.'", "angle": "DRAM and NAND both at extreme prices reopens the economics of the middle tier. The post is a thesis that persistent byte-addressable memory may be revived.", "tweetA": "3D XPoint stalled at 4 layers while NAND went to 300. That's a 75x layer gap. The tech didn't fail on physics, it failed on timing. DRAM allocation pain is the cheapest R&D grant it'll ever get. $MU $INTC", "tweetB": "Imagine rebooting an inference server and the KV cache is still there. That's what persistence buys. Optane died waiting for a workload that needed it. $MU $NVDA", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://irrationalanalysis.substack.com/p/the-tragedy-of-3d-xpoint-aka-intel", "id": 16}, {"cat": "AI/infra", "urgency": "deep", "source": "Irrational Analysis", "title": "China is picking up phase-change memory where Intel and Micron quit: Alibaba + Demingli on the OCP agenda", "idea": "Irrational Analysis noticed while building an OCP 2026 schedule that byte-addressable persistent PCM talks are on the agenda — an Alibaba partnership with Demingli. 'The Chinese are picking up where Intel and Micron gave up.' Author looks forward to the OCP presentation.", "angle": "Another memory tech path where China fills a gap Western vendors abandoned, while DRAM allocation is the Western pain point.", "tweetA": "Intel and Micron killed 3D XPoint. Alibaba and Demingli show up at OCP with phase-change memory. Memory shortage plus an abandoned architecture is exactly where China routes around export controls. $MU $INTC", "tweetB": "DRAM allocation is the hyperscaler bottleneck. A Chinese PCM product doesn't need to beat DRAM, it needs to be available. Availability beats performance in a shortage. $MU $INTC", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://irrationalanalysis.substack.com/p/the-tragedy-of-3d-xpoint-aka-intel", "id": 17}, {"cat": "AI/infra", "urgency": "watch", "source": "Irrational Analysis", "title": "Could Terafab/SpaceX license 3D XPoint from Intel? A 'degen hero' scenario for persistent memory", "idea": "Author argues Micron won't revive 3DXP (DRAM prices high, trauma), Intel is too busy (EMIB-T packaging, 18AP, 14A activity, product business 'going to the moon' on agentic CPU revival) and CEO Lip-Bu Tan is conservative. That leaves Terafab/SpaceX licensing it and scaling beyond 4 layers; author does not think Terafab could compete in DRAM against SK, Samsung and Micron.", "angle": "A speculative, but concrete path for new memory entrants. Also an unusually bullish read on Intel's product business via agentic CPU demand.", "tweetA": "Intel isn't going to bet on Optane again. Micron prints money on DRAM and won't cannibalize it. The only people who'd restart 3D XPoint are the ones with no DRAM business to protect. $INTC $MU", "tweetB": "'Agentic CPU revival' is an interesting phrase. If agents run on CPUs plus memory, Intel's product line is a beneficiary of the AI buildout no one is modelling. $INTC", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://irrationalanalysis.substack.com/p/the-tragedy-of-3d-xpoint-aka-intel", "id": 18}, {"cat": "AI/infra", "urgency": "deep", "source": "Irrational Analysis", "title": "Micron bought Intel's 49% of the Lehi fab, then sold it to TI in 2021 within three months of listing it", "idea": "Irrational Analysis timeline: in July 2018 Intel and Micron split 3DXP development; three months later Micron bought out Intel's half of the Lehi, Utah fab; X100 SSD launched in 2019 on PCIe gen3 (8 microseconds); in March 2021 Micron announced it would sell the fab and Texas Instruments bought it in three months, re-tooling for analog. Micron's earnings calls went from hype in 2019 to 'continuing underutilization' to silence.", "angle": "A case study in how fab capacity gets recycled across memory and analog cycles, relevant to today's shortage.", "tweetA": "Micron sold a memory fab to TI in 2021 for pennies and re-tooled it for analog. Today DRAM is in shortage. Nobody gets that fab back. Capacity decisions made at the bottom define pricing for years. $MU $TXN", "tweetB": "Micron's earnings calls went from 'hype' to 'underutilization' to silence on 3D XPoint over six quarters. That's how you can tell a program is dead before it's announced. $MU", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://irrationalanalysis.substack.com/p/the-tragedy-of-3d-xpoint-aka-intel", "id": 19}, {"cat": "macro", "urgency": "deep", "source": "Eliant's Exploits", "title": "10Y stalls near 5.3%, S&P prints new ATH (+110bps on week), small caps -90bps; CPI/PPI midweek decide hike vs pause", "idea": "Eliant: the bond selloff paused with the 10Y stalled near 5.3%; rotation followed as two negative AI headlines unwound tech. SPX best index of the week (+~110bps, new ATH), small caps worst (-~90bps) after a midweek rebound. CPI and PPI midweek, retail sales, and Warsh speaking will shape the Fed's hike-or-pause decision.", "angle": "A 10Y at 5.3% is the real top-of-funnel variable. Equity ATHs on a stalled yield, not a falling one.", "tweetA": "10Y flat at 5.3% and the S&P makes a record. Stocks aren't pricing lower yields, they're pricing no more increases. That's a thinner thing to be long. CPI Wednesday. $SPY $TNX", "tweetB": "Warsh speaks the day after PPI. First real test of how the new Fed chair reads a 0.6% MoM print. $DXY $TLT", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.eliantcapital.com/p/the-week-ahead-101126", "id": 20}, {"cat": "positioning", "urgency": "deep", "source": "Eliant's Exploits", "title": "Breadth is oversold at index highs: only 38% of stocks above 20DMA, 28% above 50DMA; value and low-vol led, growth/momentum lagged", "idea": "Eliant: last week low-volatility and value were the best factors, growth/momentum the worst. % of stocks above 20D bounced to ~38%, above 50D just 28% — oversold, though not at Liberation Day extremes. Fear-Greed moved from Fear back to Neutral as SPX and Nasdaq made new highs. Eliant says his tactical book is +209.61% since June 2023 vs Nasdaq 100 +113.9% and SPX +87.8%.", "angle": "Index at ATH with 72% of stocks below their 50DMA is a classic divergence. Factor rotation into low-vol is defensive.", "tweetA": "72% of stocks below their 50-day. Index at a record. The last time breadth looked this bad at highs was... pick your year. Low-vol and value led last week. Smart money is already rotating. $SPY $RSP", "tweetB": "Growth and momentum the worst factors, index at ATH. The index is being held up by a handful of names while the factor that made the last two years is rolling over. $MTUM $USMV", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.eliantcapital.com/p/the-week-ahead-101126", "id": 21}, {"cat": "positioning", "urgency": "watch", "source": "Eliant's Exploits", "title": "YTD best baskets: Agentic Economy, Mission-Critical Security Stack, AI Medicine; worst: Gaming & Media, Global Marketplace, Make Housing Great Again", "idea": "Eliant lists best YTD thematic baskets: Agentic Economy, Mission Critical Security Stack, AI Medicine Stack, Rebuilding U.S. Industrial Sovereignty, Industrial and Auto Analog Recovery. Worst: Gaming & Media, The Global Marketplace, Make Housing Great Again.", "angle": "Winners are AI-adjacent and security; losers are rate-sensitive housing and consumer-discretionary attention. Confirms the rates + AI barbell.", "tweetA": "Best baskets: agentic, security, AI medicine, industrial reshoring. Worst: housing, gaming/media, marketplaces. That's a 5.3% 10Y and an AI capex cycle in one list. $CRWD $PLTR", "tweetB": "'Make Housing Great Again' is the worst basket of the year. Policy rhetoric isn't a hedge against a 5%+ mortgage rate. $ITB $XHB", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.eliantcapital.com/p/the-week-ahead-101126", "id": 22}, {"cat": "macro", "urgency": "watch", "source": "Dark Side of the Boom", "title": "Hartnett: 'Bonds end bubbles, and the Fed may have to hike to save the market' (body paywalled)", "idea": "Only the title and one-line preview are visible: 'Almost everything came back to the same variable: the price of money.' The headline thesis attributed to Michael Hartnett: bond yields are what end bubbles, and the Fed might need to hike to protect markets.", "angle": "Fits the week's theme: 10Y near 5.3%, record concentration, record HF Mag 7 exposure.", "tweetA": "Hartnett's line, bonds end bubbles. Equity at a record, 10Y at 5.3%, 10 stocks at 42% of the market. The 2000 rhyme isn't the stocks, it's the yield. $SPY $TLT", "tweetB": "'Fed may have to hike to save the market' is a weird sentence. Hikes save markets from inflation, not from valuations. Unless he means credit. CCC at 12%. $HYG", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/michael-hartnett-bonds-end-bubbles", "id": 23}, {"cat": "tech", "urgency": "deep", "source": "McKinsey & Company", "title": "Time-to-exploit for critical vulnerabilities has collapsed from ~3 weeks to hours in the frontier-AI era", "idea": "McKinsey: active exploitation of critical vulnerabilities can now be a matter of hours, down from roughly three weeks as recently as last year. Attackers move at machine speed while organizations make decisions at committee speed. The argument is for a new operating model and committed executive leadership.", "angle": "Collapse in patch window is the demand driver for automated defense. Matches Eliant's #2 basket (Mission Critical Security Stack).", "tweetA": "Three weeks to hours. The patch cycle that enterprise security was built around is now obsolete. Companies that can't automate remediation aren't behind, they're uninsurable. $CRWD $PANW $ZS", "tweetB": "Attackers at machine speed, orgs at committee speed. The product that closes that gap isn't a scanner, it's a decision-maker you let act without a human. Who's willing to sign that off? $CRWD", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://email.mckinsey.com/capabilities/risk-and-resilience/our-insights/the-speed-problem-how-frontier-ai-exposes-weakness-in-enterprise-cybersecurity", "id": 24}, {"cat": "tech", "urgency": "watch", "source": "McKinsey & Company", "title": "Quantum ('the biggest cyberthreat in history is already a reality') and securing the agentic enterprise as a provider opportunity", "idea": "McKinsey's cyber bundle: quantum advances will add pressure on cybersecurity teams; securing the agentic enterprise creates opportunities for providers; HackerOne's CEO says teams must shift from finding vulnerabilities to reducing exposure; healthcare provider cyberattacks and outages at an all-time high; a Technology Trends Outlook 2026 webinar on Oct 15.", "angle": "Post-quantum migration plus agent identity are two multi-year security spend lines. Healthcare outages at record is a real-economy symptom.", "tweetA": "'Harvest now, decrypt later' means quantum risk is already on the balance sheet. Nobody is paying for crypto-agility yet. When does the first regulator mandate it? $IBM $PANW", "tweetB": "Agents need identities, permissions and kill-switches. Securing the agentic enterprise is the next security category, same way cloud created the last one. $OKTA $CRWD", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://email.mckinsey.com/capabilities/risk-and-resilience/our-insights/the-speed-problem-how-frontier-ai-exposes-weakness-in-enterprise-cybersecurity", "id": 25}, {"cat": "geopolitics", "urgency": "act", "source": "Pequity Research (Speedrun)", "title": "Hormuz: US reportedly accepts some of Iran's 7 conditions to reopen the Strait; Tehran calls response 'insufficient'", "idea": "Pequity's Sunday speedrun: the US has reportedly accepted some of the 7 conditions Iran raised for reopening the Strait of Hormuz, but Tehran considers Washington's redited retroactively", "idea": "The Pressure Point: Roosevelt's 1937 bill did not cause the 'switch in time' — Roberts voted in West Coast Hotel v. Parrish before the bill was announced — yet later New Deal-friendly rulings created a durable myth that pressure works. The bill sat in Senate Judiciary for 165 days and failed. Fulcrum's point: institutional pressure gets credited whatever the institution does next.", "angle": "Pressure campaigns benefit from timing ambiguity. Applies to the Fed (Cook), the Supreme Court term and the ICC.", "tweetA": "Roberts voted before the bill existed. Court-packing still gets credited as a success. If the Fed cuts or doesn't after the Lisa Cook probe, it will be read as pressure either way. Causality is the least relevant variable in politics. $TLT", "tweetB": "The bill died in 165 days of Senate delay and the legend survived. The pressure outlives the instrument. Markets price perceived Fed independence, not legal independence. $DXY $GLD", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-the-myth-finished-the-failed/", "id": 28}, {"cat": "regulation", "urgency": "deep", "source": "The Pressure Point (Fulcrum)", "title": "US sanctions the International Criminal Court itself; the lever is private compliance — banks, vendors, staff", "idea": "The Pressure Point: the US sanctioned the ICC as an institution this week, escalating beyond individual judges and prosecutors. The ICC rejected it, but the real effect runs through banks, vendors and staff deciding whether contact is worth the exposure. Watch for the first bank, contractor or provider to restrict dealings.", "angle": "Sanctions as a payments-plumbing tool against an international institution. Precedent for how financial infrastructure becomes a political instrument — a de-dollarization argument.", "tweetA": "Sanctioning an international court through bank compliance departments, not diplomats. Every central bank watching that is quietly pricing the value of a payments rail that Washington doesn't control. $GLD $BTC", "tweetB": "The weapon isn't the sanction, it's the vendor who decides not to renew the contract. Over-compliance is the enforcement mechanism. First bank to blink will be the tell.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-the-myth-finished-the-failed/", "id": 29}, {"cat": "regulation", "urgency": "deep", "source": "The Pressure Point (Fulcrum)", "title": "New investigation of Fed's Lisa Cook; FTC preparing investigative demands to frontier AI labs; AI task force under Jay Clayton", "idea": "The Pressure Point: the administration ordered a new investigation of Fed official Lisa Cook this week. Separately, a new AI task force concentrates policy coordination under Jay Clayton, and the FTC is preparing investigative demands to frontier AI companies (per Semafor).", "angle": "Fed independence risk (Cook) and AI regulatory risk (FTC demands) both arrive while the Fed is deciding between hiking and pausing.", "tweetA": "New Cook investigation, a Warsh speech, a CPI print and a possible hike all land in the same 72 hours. If you wonder why term premium is rising, it isn't just inflation. $TLT $TNX", "tweetB": "FTC investigative demands to frontier labs mean a document request is coming to the companies whose revenue run-rates are already under scrutiny. Disclosure risk is the new catalyst. $MSFT $GOOGL", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-the-myth-finished-the-failed/", "id": 30}, {"cat": "geopolitics", "urgency": "act", "source": "The Pressure Point (Fulcrum)", "title": "Second Houthi strike in two days hits Riyadh's international airport — passenger-hall fire and injuries", "idea": "The Pressure Point: a second Houthi strike in two days hit Riyadh's international airport, causing ost of capital goes. $AMT", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-the-myth-finished-the-failed/", "id": 34}, {"cat": "macro", "urgency": "deep", "source": "Danny Dayan", "title": "Earnings guide is the whole game: 'will companies confirm very elevated forward earnings as cost of capital rises?'", "idea": "Danny Dayan's week ahead: stocks took another leg higher as bonds moved sideways; stocks should beat lofty expectations again, but it is all about the guide. Data: Tue NFIB, ADP weekly, existing home sales; Wed CPI; Thu PPI, retail sales, Empire, Philly Fed; Fri NY Fed services, import/export prices, industrial production. Bond markets are closed Monday.", "angle": "Forward earnings estimates have to survive a higher discount rate. Beat-and-guide-down is the main risk for the first big bank prints.", "tweetA": "Everyone beats the number. The question is whether anyone raises the guide with the 10Y at 5.3%. If the guides are flat, the multiple has to carry the weight. $JPM $GS", "tweetB": "Bond market is closed Monday, so the first rates tell on Tuesday is a full session of catch-up. Stock moves on a closed bond market are the least informative of the month.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://dannydayan.substack.com/p/the-guide", "id": 35}, {"cat": "macro", "urgency": "deep", "source": "Danny Dayan", "title": "A meltdown in European government bonds: Dayan's 'Nationalism' deep-dive on how it might manifest", "idea": "Dayan notes he wrote a thought piece in last week's deep-dive note, 'Nationalism,' on how a meltdown in European govies could manifest, with 'big potential implications.' The body is behind the paywall.", "angle": "European long-end stress is a separate rates channel from the US 10Y. Italy (INWIT take-private) and France are the usual stress points.", "tweetA": "European govies are the other half of the global duration story. If a me   document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';
  render(true);
  var h='<p><b>Window:</b> '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</p><p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</p><div class="lbl">Included sources</div><ul>';
  var seen={};ITEMS.forEach(function(i){seen[i.source]=(seen[i.source]||0)+1;});
  Object.keys(seen).forEach(function(s){h+='<li><span class="sl" data-s="'+esc(s)+'" onclick="filterBySrc(this.getAttribute(\'data-s\'))">'+esc(s)+'</span> ('+seen[s]+')</li>';});
  h+='</ul><div class="lbl">Skipped / notes</div><ul>'+META.skippedSources.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul>';
  document.getElementById('rb').innerHTML=h;
}
init();
</script></body></html>
