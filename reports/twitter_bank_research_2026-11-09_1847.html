const REPORT_DATA = {"report_type": "TWITTER BANK RESEARCH", "freshness_gate": "FRESHNESS GATE PASSED.", "collected_at": "2026-11-09T18:24:33Z", "window_days": 4, "input_stats": {"total_tweets": 120, "considered": 120, "kept": 40, "dropped": 80, "deduped": 0}, "summary": "Recurring themes: post-midterm equity rout and positioning washout (CTA/systematic selling, negative SPX gamma, record put volume); AI/semis drawdown and valuation charts; US data surprises running high ahead of CPI.\nGoldman dominates with CPI/PCE forecasts, flow and risk-appetite charts; BofA/Hartnett cover positioning and FMS conviction.\nYardeni, Deutsche and BNP supply valuation and drawdown history charts; UBS Intraday Recovery Score stays bearish.\nCounts: Goldman 15, BofA 6, Yardeni 5, Deutsche 4, Citi 3, JPM 3, Apollo/Slok 2, UBS 2, BNP 1, HSBC 1, Jefferies 1, Morgan Stanley 1, Nomura 1.", "by_bank_counts": {"Goldman": 15, "BofA": 6, "Yardeni": 5, "Deutsche": 4, "Citi": 3, "JPM": 3, "Apollo/Slok": 2, "UBS": 2, "BNP": 1, "HSBC": 1, "Jefferies": 1, "Morgan Stanley": 1, "Nomura": 1}, "banks": [{"bank": "Goldman", "theme": "Goldman — CTA/ETF positioning, risk appetite, put demand, CPI/PCE forecasts and AI-spend charts", "items": [{"author": "neilsethinew", "text": "Goldman: levered/inverse ETF AUM just under $140B, down $55B over the past 20 days, and gross exposure down $135B over the same stretch, which should mean less forced buying and selling on big index moves. https://t.co/4FsAR8qs53", "tweet_url": "https://x.com/neilsethinew/status/2119802188285288606", "images": ["https://pbs.twimg.com/media/HWsFSPWXcAAsxu2.jpg"], "created_at": "2026-11-09T14:40:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Europe was up last week, Japan 7.5%... USA in the middle https://t.co/7WsIAItmke", "tweet_url": "https://x.com/MikeZaccardi/status/2119798666282013085", "images": ["https://pbs.twimg.com/media/HWsJp3CXIAAY-R0.png"], "created_at": "2026-11-09T14:26:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "CPI health insurance set to print -2.5% m/m (GS)\n\nyeah.. that 15% jump in 2027 premiums is probably fake... https://t.co/jwB1YGN3RG", "tweet_url": "https://x.com/MikeZaccardi/status/2119797408649355589", "images": ["https://pbs.twimg.com/media/HWsIgnNXAAAPasq.png"], "created_at": "2026-11-09T14:21:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman also sees CTAs selling SPX this week as its base case:\n\nIt expects CTAs to sell $28B of S&P futures over the next week and $45B over the next month in its baseline scenario, “which would take the position to overall net short.”\n\nGoldman’s futures desk says CTA signals are now negative in around 60% of global equity markets at the short- and medium-term horizons, including the S&P 500, where the levels are around 7,685 and 7,550.\n\nThe S&P 500 closed Friday at 7,376.86, below both levels and its 100-DMA (7,619), though Thursday’s low (7,350.35) held just above the 200-DMA (7,325), which the index hasn’t closed below since April 7th.", "tweet_url": "https://x.com/neilsethinew/status/2119797155053339077", "images": ["https://pbs.twimg.com/media/HWsEMJfWAAAXA4E.png"], "created_at": "2026-11-09T14:20:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: We Expect a 0.16% Increase in Core CPI in October\n\nOur CPI Forecast Translates to a Larger Core PCE Increase of +0.23% in October https://t.co/Ea5FX9byXc", "tweet_url": "https://x.com/MikeZaccardi/status/2119794022822654242", "images": ["https://pbs.twimg.com/media/HWsFbjoXEAATv6r.png"], "created_at": "2026-11-09T14:07:33.000Z", "relayers": []}, {"author": "neilsethinew", "text": "After bouncing back last week, Goldman’s Risk Appetite Indicator* fell back to −0.7 from −0.3 the prior week, and the momentum index fell to −1.2 from −0.8, both their lowest since April 2025. Still far from the -1.5 to -2.0 area under which \"signals are most powerful\"\n\nBy component, credit remains the weakest (−2.2), followed by equity volatility (−1.1) and equities (−0.6), while bonds (0.8) and FX & gold (0.5) are still positive.\n\n*”Goldman Sachs Risk Appetite Indicator (RAI) aims to track the level of global market risk appetite and risk aversion based on various market variables. A sharp rise in the index can send a warning signal that investors have more risk appetite and are potentially exposed to a correction if consensus views are tested. Similarly, a sharp decline indicates a reduction in risk appetite, and at extreme levels it can indicate that markets may have overshot. RAI signals are most powerful when the level of risk appetite is very low below -1.5, with levels closer to -2.0 giving the clearest signal over longer time horizons, as at such levels the asymmetry of subsequent medium term equity return becomes very positively skewed. RAI momentum is designed to track short term shifts of market risk appetite, and subcomponents of the RAI.”", "tweet_url": "https://x.com/neilsethinew/status/2119777031605063960", "images": ["https://pbs.twimg.com/media/HWpvFl5WgAAC_sk.jpg"], "created_at": "2026-11-09T13:00:02.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: history is “somewhat encouraging once panic reaches these extremes.” \n\nAfter the prior 15 panic signals above 9.5, the S&P 500 gained an average 4.6% over the next three months (higher 80% of the time) and 9.0% over six months (73%), although “the immediate path has been much less reliable, particularly while still in price discovery mode.”", "tweet_url": "https://x.com/neilsethinew/status/2119771988939899165", "images": ["https://pbs.twimg.com/media/HWpsvBjW8AAuC2j.jpg"], "created_at": "2026-11-09T12:40:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "USA does the AI-spending heavy lifting GS ... Europe, not so much https://t.co/QKo7n1jyNm", "tweet_url": "https://x.com/MikeZaccardi/status/2119769737756328311", "images": ["https://pbs.twimg.com/media/HWrvWAhXUAAZIrq.png"], "created_at": "2026-11-09T12:31:03.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Bowman, Goolsbee, Barkin on the tape today. Waller tomorrow before CPI\n\nThe Logan, Schmid, Bowman, Paulson, Bowman (third time) GS https://t.co/TAfvb5QM5u", "tweet_url": "https://x.com/MikeZaccardi/status/2119767838072115667", "images": ["https://pbs.twimg.com/media/HWrtnaNXYAA8pj2.png"], "created_at": "2026-11-09T12:23:30.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"Global music industry revenues are expected to reach approximately $200 billion annually by 2035 ... Goldman Sachs Research expects revenues to increase at a compound rate of 5.8% per year between 2025-2035.\"\n\n-Goldman Sachs https://t.co/Efrn6SF4kj", "tweet_url": "https://x.com/dailychartbook/status/2119762037882445861", "images": ["https://pbs.twimg.com/media/HWroVyDWUAA8100.png"], "created_at": "2026-11-09T12:00:27.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Goldman’s estimate of underlying trend job growth rose to 124,000... the highest in almost 2 years https://t.co/Cs0zQIZwJu", "tweet_url": "https://x.com/MikeZaccardi/status/2119756583441748228", "images": ["https://pbs.twimg.com/media/HWrjYVQXsAAUgZd.png"], "created_at": "2026-11-09T11:38:47.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Bloomberg has a detailed reconstruction of how Thursday’s post-midterm rout snowballed. Retail sold first, institutions piled on, then the mechanical sellers took over, and almost no one stepped in on the other side.\n\nThe end result: the Nasdaq 100 fell 6.4%, its worst day since March 2020, leaving it nearly 15% below its October 6 record. The S&P 500 lost 4.4%, its worst day since April 2025. Bloomberg puts the US market value erased at $3.7 trillion.\n\nThe sequence:\n▪️ Retail moved first. Net single-stock selling ranked behind only two days, both in March 2020 (Vanda Research), and JPMorgan put it at more than three standard deviations from normal.\n▪️ Hedge funds and long-only managers followed, locking in gains from a strong year (Jefferies’ Mohit Kumar) and being caught offsides after taking off risk Wednesday (Goldman).\n▪️ No buyers emerged. Vanda’s Viraj Patel said these are flows “we rarely see outside periods of genuine market stress.”\n▪️ Then the machines. Nomura’s Charlie McElligott estimated options dealers were adding about $7 billion of selling for every 1% drop. He estimated vol-control funds needed to sell about $61 billion, with $25 billion more still left over from Wednesday (up volatility is just as bad as down volatility for that group), and leveraged ETFs another $47 billion. Trend-following CTAs sold about $13 billion of S&P 500 and Nasdaq futures, taking their exposure near the lowest in Vanda’s data.\n\nWhat makes this particularly unusual is how calm things were beforehand:\n▪️ The VIX started Thursday at 16.6, below its one-year average, and closed at 28.2, up 70%. Since 1990, only two VIX spikes started from a lower level and went further: February 5, 2018 (the “Volmageddon” short-volatility blowup, when the VIX jumped 116%) and December 18, 2024 (the hawkish Fed cut, up 74%).\n▪️Positioning was already defensive going in. Hedge fund shorts were near a five-year high in late October, and net leverage was at a three-year low (although beta-adjusted it was more around average levels).\n▪️ The damage was narrow but deep. Memory, optical networking, data-center and AI-chip baskets fell 12% to 15%, five- to six-standard-deviation moves, while the S&P 500 excluding AI names fell 2.3%.\n▪️ Goldman Sachs’ memory basket is now 51% below its June 22 peak. That’s deeper than its 44% drawdown in April 2025, which took 14 months to recover. It’s also the first of nine drawdowns since 2022 that hasn’t been bought, now 136 days in.\n\n▪️For the bears: Bloomberg counts 48 times since 1980 that the S&P 500 fell 2% or more the day after gaining 1.5%, almost all inside bear markets or crises. Only four came this close to a record high. Two recovered within 50 sessions, and the other two were in 1987.\n▪️ For the bulls: Both VIX analogs ended with new S&P 500 highs, but on very different timelines. After December 2024, the next record close came about five weeks later, on January 23, 2025. After February 2018, it took about six and a half months, until August 24, 2018, with a retest along the way.\n\nNow with CTAs and vol-control having dramatically lowered exposure, Bloomberg says the forced sellers look mostly spent. That’s the usual setup for a bounce they say.\n\nFriday’s bounce was a start but not a convincing one. The Nasdaq rose 1.1% and the S&P 500 0.3%, both well off their highs. Decliners outnumbered advancers in the S&P 500 by about 5 to 3. A hot jobs report (165,000 versus 65,000 expected) also kept a December rate hike in play.", "tweet_url": "https://x.com/neilsethinew/status/2119731725924221176", "images": ["https://pbs.twimg.com/media/HWpdBs2WEAAuFSC.jpg"], "created_at": "2026-11-09T10:00:00.000Z", "relayers": []}, {"author": "eliant_capital", "text": "Goldman Sachs’ High Beta Momentum Pair has now suffered a staggering 50% drawdown, the worst in the 15-year history of the dataset, surpassing even the '21–'22 collapse https://t.co/qLSZhdB4ec", "tweet_url": "https://x.com/eliant_capital/status/2119558894271734095", "images": ["https://pbs.twimg.com/media/HWovdF2XAAAZ3aV.jpg"], "created_at": "2026-11-08T22:33:14.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: From a flow perspective, the demand for protection Thursday was astounding. Over 11mm puts traded, the largest put volume day on record, surpassing the previous high in Apr ’25. https://t.co/Vlvd3S9Geq", "tweet_url": "https://x.com/neilsethinew/status/2119437285712367830", "images": ["https://pbs.twimg.com/media/HWkhffXWUAAqMKP.jpg"], "created_at": "2026-11-08T14:30:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Morgan Stanley’s Mike Wilson (Strategy Data Pack, Friday) says the S&P 500 “catching down” to weaker breadth “is likely the final stage of this correction,\" after he rightly called a continuation of the pullback in semi's in the event of a big Democratic victory.\n\nBut he isn’t calling the bottom yet: “We are getting close, but would like to see… further confirmation from our sentiment indicator.” His year-end target stays 8,000.\n\nHere's what’s happened to the three “clearing events” he laid out last weekend:\n\n▪️ Midterms: Democrats took both chambers, with at least 54 Senate seats. Wilson had said a 52-48 Senate was priced in but 55-45 wasn’t, and that a bigger margin could fuel pushback on data centers, so he nailed that.\n▪️ AI and semis: Thursday was the S&P’s worst day since April 2025 (−4.4%) and the Nasdaq-100’s worst since March 2020 (−6.4%). The SOX fell about 12% on weak chip guidance and fears of data-center rules after the election. That left it down about 19% from October 26, when Wilson called for another 10% to 15% drop into mid-November, another hit.\n▪️ Liquidity, the one he ranks most important, hasn’t cleared. He says Fed Chair Warsh acknowledged financial conditions are doing some of the Fed’s tightening but wouldn’t call them “tight,” so the bar for a dovish pivot “remains high.” Then Friday’s payrolls (+165,000 vs. ~65,000 expected) pushed December hike odds to about 78%.\n\nThe math from Friday’s close of 7,376.86 (−5.7% from the record, −2.7% on the week):\n▪️ 7,100 to 7,200 is another 2.4% to 3.8% down.\n▪️ 8,000 is +8.4% from here. His 12-month base case is 8,300 (+12.5%), with a 5,900 bear case and 9,400 bull case.\n\nOn the catch-down, as he also indicated was likely, the average stock is holding up better than the index:\n▪️ Thursday, the equal-weight S&P fell 2.9% vs. 4.4% for the cap-weighted index.\n▪️ In October, equal-weight beat cap-weight by 5.9 points, the second-widest monthly gap since 2003.\n▪️ Wilson notes median Russell 3000 earnings growth is running 14%, the strongest in four years.\n\nHis sentiment indicator was at −0.75 as of Thursday. That compares with roughly −1.45 at the Iran-war low earlier this year and about −2.1 on Liberation Day.", "tweet_url": "https://x.com/neilsethinew/status/2119429736703123757", "images": ["https://pbs.twimg.com/media/HWkjKlgXoAAg0wQ.jpg"], "created_at": "2026-11-08T14:00:00.000Z", "relayers": []}]}, {"bank": "BofA", "theme": "BofA — systematic positioning, SPX hedger gamma, Hartnett FMS, 1-month performance heat map", "items": [{"author": "MikeZaccardi", "text": "Bloomberg: Nvidia faces an unprecedented crisis as its board launches an independent probe into whether a foreign intelligence agency targeted CEO Jensen Huang. $NVDA\n\nThe investigation comes amidst rising US scrutiny over Nvidia's ties to Singapore-based Megaspeed. https://t.co/NkokqzJdgT", "tweet_url": "https://x.com/MikeZaccardi/status/2119780309675770101", "images": ["https://pbs.twimg.com/media/HWr49QlXkAEFsRu.png"], "created_at": "2026-11-09T13:13:04.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BofA estimates global systematic positioning fell to ~$225B, its lowest since April, from ~$290B last week and ~$365B a month ago, as the volatility spike also forced vol control funds to de-risk. \n\nIn terms of CTAs, BofA no longer lists a sell trigger for the S&P 500 (from ~−0.1% last week), as Thursday’s post-election reversal likely took CTAs’ remaining US equity longs to flat. No triggers were listed for the Nasdaq-100 either, while the Russell 2000’s buy trigger is now +5.4% away (from +1.8%).\n\nPositively, though, BofA is not looking for more selling from the systematic community in their base case with vol-control reloading offsetting more CTA selling:\n\n• They see roughly no net change in a flat market (from −$15B of selling last week), as vol control adding ~$12B about offsets CTA selling of about $13B.\n\n• +$11B of buying in an “up” market (BofA’s high-percentile path, roughly +4.1% for S&P 500 futures over five days this week; from +$37B last week), as CTA buying (~$16B) outweighs risk-parity selling (~$7B).\n\n• −$37B of selling in a “down” market (BofA’s low-percentile path, roughly −5.2% for S&P futures this week; from −$63B last week), almost all from CTAs (~$34B), with Europe and Asia leading. That’s the smallest down-market estimate in eight weeks, though, showing the impact of the cleaner positioning.", "tweet_url": "https://x.com/neilsethinew/status/2119761935914917971", "images": ["https://pbs.twimg.com/media/HWpuKS_XcAAXoCg.jpg"], "created_at": "2026-11-09T12:00:03.000Z", "relayers": []}, {"author": "neilsethinew", "text": "The Day Ahead - A quiet start to the week\n\nIn US economic data, Monday brings us final September wholesale inventories and the NY Fed’s October Survey of Consumer Expectations.\n\nFed speakers include Fed Vice Chair for Supervision Bowman, Chicago Fed President Goolsbee (2027 voter) and Richmond Fed President Barkin (2027 voter).\n\nNon-Bill (>1yr in maturity) US Treasury auctions bring us a $58B 3-year note sale at 1:00pm ET.\n\nSeven S&P 500 components report, none of them with market caps over $100B:\n-Before the open: KKR ($KKR), Constellation Energy ($CEG), Ferguson ($FERG) and NRG Energy ($NRG).\n-After the close: Occidental Petroleum ($OXY) and Take-Two ($TTWO).\n-Time not announced: Skydance ($SKYD).\n-Outside the S&P 500 we’ll hear from Orix ($IX), Credicorp ($BAP), Rocket Lab ($RKLB) and AST SpaceMobile ($ASTS).\n\nEx-US highlights China’s October CPI and PPI and the BoJ’s Summary of Opinions from its October meeting (both Sunday evening ET), followed Monday morning by Japan’s September leading index, Germany’s September trade balance, Taiwan’s October exports and Mexico’s October CPI. \n\nThe Eurogroup and ECOFIN meetings in Brussels could bring a recommendation on successors to ECB President Lagarde and board member Schnabel. G7 foreign ministers meet in France through Tuesday, and the BoE’s Bailey and the ECB’s Cipollone speak.", "tweet_url": "https://x.com/neilsethinew/status/2119746840266453023", "images": ["https://pbs.twimg.com/media/HWpUYMRWwAAJmHd.jpg"], "created_at": "2026-11-09T11:00:04.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BofA says SPX hedger gamma fell precipitously last week and turned negative, ending Thursday at −$4.9B, its lowest reading of the past year and down from $7.1B a week earlier. BofA had flagged this possibility last week.\n\nThursday’s profile shows gamma negative across the whole range BofA charts (6,600–8,100), so market makers amplify moves in either direction, and there’s no nearby level where that flips back.", "tweet_url": "https://x.com/neilsethinew/status/2119739276896153601", "images": ["https://pbs.twimg.com/media/HWpupKdWwAAQ5j1.jpg"], "created_at": "2026-11-09T10:30:01.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "This is the 1-month performance heat map... some pretty ugly AI returns since Oct 8... throw a dart, and land on a -20% \n\nBut many consumer, cyclical, value, and defensive plays boast big green @finviz_com https://t.co/LjXBQXBo5N", "tweet_url": "https://x.com/MikeZaccardi/status/2119535794297753908", "images": ["https://pbs.twimg.com/media/HWoakp5WYAICdog.jpg"], "created_at": "2026-11-08T21:01:27.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Hartnett says now Wall Street’s “last bull conviction standing” is expectations of a “boom,” which were the highest in BofA’s fund manager survey since February 2022. \n\nHe lays out three 2027 scenarios, “bubble, breadth, bust”:\n\n▪ Case for Bubble: “AI = railroads.” Add a US government backstop of AI, since higher stocks and bonds are how the US wins the AI war with China, plus Gen Z and Gen X’s “structural buy-the-dip ethos.” He says investor conviction in Bubble “has peaked,” with 50% of investors in BofA’s October survey predicting “no landing.”\n▪ Case for Breadth: consensus forecasts a 40bp drop in Treasury yields and 15% S&P 500 earnings growth in ‘27, and “Goldilocks unlocks value” in small and mid-caps and the S&P 500 excluding AI. He says investor optimism in this scenario is “still high,” with 40% predicting a “soft landing.”\n▪ Case for Bust: bonds and voters end booms and bubbles, and tighter credit means no AI boom. He sees downward revisions coming to ‘27 forecasts of 5% US nominal GDP and 45% global tech earnings growth (after 94% in ‘26). He says fear of a Bust is “too low,” with just 6% predicting a “hard landing.” In his words, “all the incoming FAQs are ‘should I add risk now?’ not ‘is this the big top?’”\n\nHis call in the meantime: “sell oil, buy bonds, wait for lower oil prices & yields before adding risk bigtime.” WTI closed Friday at $90.83 and the 10-year Treasury yield at 4.86%. That compares with the $80 and 4.5% he says would end his risk-off stance.", "tweet_url": "https://x.com/neilsethinew/status/2119452385823060173", "images": ["https://pbs.twimg.com/media/HWkivmDWsAA7YP9.jpg"], "created_at": "2026-11-08T15:30:00.000Z", "relayers": []}]}, {"bank": "Yardeni", "theme": "Yardeni — valuation charts (semis P/E, ex-US P/E, Mag 7) and post-midterm buying-opportunity view", "items": [{"author": "MikeZaccardi", "text": "Citi Eco Surprise Index... highest since August 2023 @yardeni https://t.co/qDCqhJPQSh", "tweet_url": "https://x.com/MikeZaccardi/status/2119827858864386294", "images": ["https://pbs.twimg.com/media/HWskNFLW4AApoZH.jpg"], "created_at": "2026-11-09T16:22:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Ed Yardeni isn't calling a bottom, but he says “we anticipated buying opportunities after the midterm elections, and Thursday’s selloff delivered some,” and he’s sticking with his 7,900 year-end target (about 7% above Friday’s close): “This remains an earnings-led bull market… We still view the AI backlash as another speed bump, not a roadblock.” \n\nHe also notes the Nasdaq’s close below its 200-DMA isn’t new, as it rebounded sharply after liberation day and again after the Iran war started, “quickly resuming its uptrend both times.", "tweet_url": "https://x.com/neilsethinew/status/2119751856414949666", "images": ["https://pbs.twimg.com/media/HWprRhCXIAAjVkv.jpg"], "created_at": "2026-11-09T11:20:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Semiconductors' P/E lowest since March 2020... although its post-GFC range was in the mid-teens @Yardeni https://t.co/JjxrjJO1zL", "tweet_url": "https://x.com/MikeZaccardi/status/2119448861357777166", "images": ["https://pbs.twimg.com/media/HWnLghuXcAEyNG1.jpg"], "created_at": "2026-11-08T15:16:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "US stocks' valuation gets a lot of attention, but ex-US is now just 12.0x ... very low, historically @yardeni https://t.co/KNzSNJcaBh", "tweet_url": "https://x.com/MikeZaccardi/status/2119443828310430007", "images": ["https://pbs.twimg.com/media/HWnG7i6XQAAB7c7.jpg"], "created_at": "2026-11-08T14:56:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Mag 7/Mega-Cap 8 ... slice it how you want.. cheapest in 8 years @yardeni https://t.co/LfUHOr4dTO", "tweet_url": "https://x.com/MikeZaccardi/status/2119440053399097432", "images": ["https://pbs.twimg.com/media/HWnDf1BXgAABBEb.jpg"], "created_at": "2026-11-08T14:41:00.000Z", "relayers": []}]}, {"bank": "Deutsche", "theme": "Deutsche Bank — tech overweight, tech valuations vs dot-com, S&P drawdown history", "items": [{"author": "LanceRoberts", "text": "MCG &amp; Tech relative performance slipped just below its long-run trend channel. It has rebounded sharply from around this level five times since 2024. The odds favor an overweight in Technology, but risk management still applies.\n@ISABELNET_SA @DeutscheBank https://t.co/naclIhs5aW", "tweet_url": "https://x.com/LanceRoberts/status/2119757328685609092", "images": ["https://pbs.twimg.com/media/HWrj3WNXwAAjRSS.jpg"], "created_at": "2026-11-09T11:41:45.000Z", "relayers": []}, {"author": "neilsethinew", "text": "DB: We remain overweight Tech. We upgraded Tech last week after the unwind in relative performance and positioning had made the risk-reward favorable. With the plunge this week, the risk-reward is now even more favorable.\n\nTech performance relative to the rest of the S&P 500 has now broken a little below its long-run trend channel, like overshoots seen around the start of the Iran war and Liberation Day. \n\nWhile attention has focused on the blue sweep in the mid-terms as the driver of the selloff, the incremental news from Tuesday was quite modest. Opposition to data centers was already widely acknowledged as a large bipartisan issue even before the elections, suggesting the selloff this week was largely driven by a forced positioning unwind.\n\nhttps://t.co/JZ7uYgS6TW", "tweet_url": "https://x.com/neilsethinew/status/2119756889659744642", "images": ["https://pbs.twimg.com/media/HWpL2TLXoAANhuO.jpg"], "created_at": "2026-11-09T11:40:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "DB: Unlike the dot-com bubble, tech valuations are far from stretched https://t.co/GO4zMbMkO6", "tweet_url": "https://x.com/MikeZaccardi/status/2119435020397957362", "images": ["https://pbs.twimg.com/media/HWm-63CXwAAqQBD.png"], "created_at": "2026-11-08T14:21:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "DB: S&amp;P 500 drawdowns over time, with shaded recessions showing select episodes when the index fell over 20% without coinciding with a recession\n\n'lengthy periods of stability can often lay the foundations for the next crisis' https://t.co/A6uNtjzLzW", "tweet_url": "https://x.com/MikeZaccardi/status/2119432503605764413", "images": ["https://pbs.twimg.com/media/HWm8oXpXAAAmWkS.jpg"], "created_at": "2026-11-08T14:11:00.000Z", "relayers": []}]}, {"bank": "Citi", "theme": "Citi — US economic surprise index at highs; strategists cut US, upgrade Europe", "items": [{"author": "MikeZaccardi", "text": "Citi Eco Surprise Index... highest since August 2023 @yardeni https://t.co/qDCqhJPQSh", "tweet_url": "https://x.com/MikeZaccardi/status/2119827858864386294", "images": ["https://pbs.twimg.com/media/HWskNFLW4AApoZH.jpg"], "created_at": "2026-11-09T16:22:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Citi strategists cut US stocks, upgrade Europe after AI turmoil https://t.co/d9Vq2tguED", "tweet_url": "https://x.com/MikeZaccardi/status/2119778533392154769", "images": ["https://pbs.twimg.com/media/HWr3V-SWoAEyyOw.png"], "created_at": "2026-11-09T13:06:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "With the data continuing to come in better than expected, the Citi US Economic Surprise Index jumped to 69.8 on Friday, its highest since August 2023, up from 52.4 a week earlier. https://t.co/BPgImFVMFI", "tweet_url": "https://x.com/neilsethinew/status/2119475032292302918", "images": ["https://pbs.twimg.com/media/HWkk5D2WIAAfFRN.jpg"], "created_at": "2026-11-08T17:00:00.000Z", "relayers": []}]}, {"bank": "JPM", "theme": "JPM — Lakos-Bujas bounce view, long-term staying-invested chart, post-midterm rout reconstruction", "items": [{"author": "MikeZaccardi", "text": "Volatile lately... good reminder that it's all about staying invested. \n\nMissing just the 10 best days can really hurt long-term performance! JPM GTR https://t.co/7Zxx5aUHV3", "tweet_url": "https://x.com/MikeZaccardi/status/2119842958874677584", "images": ["https://pbs.twimg.com/media/HWsx8AOXsAAA7U5.jpg"], "created_at": "2026-11-09T17:22:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "MarketWatch: JPM's Dubravko Lakos-Bujas was another arguing for a bounce:\n\n\"If we were heading into end-cycle dynamics, with significant downward revisions to 2027 earnings, the capitulation process would certainly have further room to run. However, we see this more as an intra-cycle reset and another deleveraging event in the AI supercycle.\"\n\n“There are increasing signs of investor capitulation after the largest unwind of Long Momentum against the market in about 40 years,” said the team led by Dubravko Lakos-Bujas. Deleveraging metrics are back to “Liberation Day” levels, and investor sentiment has swung from bullish in June to bearish, they said.\n\nOne metric he is watching is the Invesco $QQQ Trust Series 14-day relative strength index, a momentum gauge, which fell below 30 and into oversold territory last week.\n\n\"In each of the nine prior instances that this occurred over the past three years, QQQs rallied around 4% on average over the next five trading days,\" said Lakos-Bujas.", "tweet_url": "https://x.com/neilsethinew/status/2119824152039190668", "images": ["https://pbs.twimg.com/media/HWsRwCuXcAAfbDn.png"], "created_at": "2026-11-09T16:07:16.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Bloomberg has a detailed reconstruction of how Thursday’s post-midterm rout snowballed. Retail sold first, institutions piled on, then the mechanical sellers took over, and almost no one stepped in on the other side.\n\nThe end result: the Nasdaq 100 fell 6.4%, its worst day since March 2020, leaving it nearly 15% below its October 6 record. The S&P 500 lost 4.4%, its worst day since April 2025. Bloomberg puts the US market value erased at $3.7 trillion.\n\nThe sequence:\n▪️ Retail moved first. Net single-stock selling ranked behind only two days, both in March 2020 (Vanda Research), and JPMorgan put it at more than three standard deviations from normal.\n▪️ Hedge funds and long-only managers followed, locking in gains from a strong year (Jefferies’ Mohit Kumar) and being caught offsides after taking off risk Wednesday (Goldman).\n▪️ No buyers emerged. Vanda’s Viraj Patel said these are flows “we rarely see outside periods of genuine market stress.”\n▪️ Then the machines. Nomura’s Charlie McElligott estimated options dealers were adding about $7 billion of selling for every 1% drop. He estimated vol-control funds needed to sell about $61 billion, with $25 billion more still left over from Wednesday (up volatility is just as bad as down volatility for that group), and leveraged ETFs another $47 billion. Trend-following CTAs sold about $13 billion of S&P 500 and Nasdaq futures, taking their exposure near the lowest in Vanda’s data.\n\nWhat makes this particularly unusual is how calm things were beforehand:\n▪️ The VIX started Thursday at 16.6, below its one-year average, and closed at 28.2, up 70%. Since 1990, only two VIX spikes started from a lower level and went further: February 5, 2018 (the “Volmageddon” short-volatility blowup, when the VIX jumped 116%) and December 18, 2024 (the hawkish Fed cut, up 74%).\n▪️Positioning was already defensive going in. Hedge fund shorts were near a five-year high in late October, and net leverage was at a three-year low (although beta-adjusted it was more around average levels).\n▪️ The damage was narrow but deep. Memory, optical networking, data-center and AI-chip baskets fell 12% to 15%, five- to six-standard-deviation moves, while the S&P 500 excluding AI names fell 2.3%.\n▪️ Goldman Sachs’ memory basket is now 51% below its June 22 peak. That’s deeper than its 44% drawdown in April 2025, which took 14 months to recover. It’s also the first of nine drawdowns since 2022 that hasn’t been bought, now 136 days in.\n\n▪️For the bears: Bloomberg counts 48 times since 1980 that the S&P 500 fell 2% or more the day after gaining 1.5%, almost all inside bear markets or crises. Only four came this close to a record high. Two recovered within 50 sessions, and the other two were in 1987.\n▪️ For the bulls: Both VIX analogs ended with new S&P 500 highs, but on very different timelines. After December 2024, the next record close came about five weeks later, on January 23, 2025. After February 2018, it took about six and a half months, until August 24, 2018, with a retest along the way.\n\nNow with CTAs and vol-control having dramatically lowered exposure, Bloomberg says the forced sellers look mostly spent. That’s the usual setup for a bounce they say.\n\nFriday’s bounce was a start but not a convincing one. The Nasdaq rose 1.1% and the S&P 500 0.3%, both well off their highs. Decliners outnumbered advancers in the S&P 500 by about 5 to 3. A hot jobs report (165,000 versus 65,000 expected) also kept a December rate hike in play.", "tweet_url": "https://x.com/neilsethinew/status/2119731725924221176", "images": ["https://pbs.twimg.com/media/HWpdBs2WEAAuFSC.jpg"], "created_at": "2026-11-09T10:00:00.000Z", "relayers": []}]}, {"bank": "Apollo/Slok", "theme": "Apollo/Slok — price discovery and US market cap charts", "items": [{"author": "MikeZaccardi", "text": "T at Apollo: Something is broken in price discovery when companies with negative earnings keep outperforming companies with positive earnings https://t.co/W5uwWkCAQc", "tweet_url": "https://x.com/MikeZaccardi/status/2119766579701281106", "images": ["https://pbs.twimg.com/media/HWrseLAWMAANh2R.jpg"], "created_at": "2026-11-09T12:18:30.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"Despite the turbulence [last] week, the total market cap of the US stock market is still up $5 trillion since the beginning of the year\"\n\n-Torsten Slok, Apollo https://t.co/K4huHQoYEL", "tweet_url": "https://x.com/dailychartbook/status/2119711123108716566", "images": ["https://pbs.twimg.com/media/HWq6CKGXYAAhmRd.jpg"], "created_at": "2026-11-09T08:38:08.000Z", "relayers": []}]}, {"bank": "UBS", "theme": "UBS — Intraday Recovery Score remains bearish", "items": [{"author": "MikeZaccardi", "text": "UBS’s Intraday Recovery Score remained bearish, suggesting that investors continue to sell into rallies rather than buy dips. \n@soberlook https://t.co/EGLX7QmA3x https://t.co/C53wY6dueE", "tweet_url": "https://x.com/MikeZaccardi/status/2119763434728243374", "images": ["https://pbs.twimg.com/media/HWrpnFWWUAA70E8.jpg"], "created_at": "2026-11-09T12:06:00.000Z", "relayers": []}, {"author": "LanceRoberts", "text": "The @thedailyshot calculation of UBS’s Intraday Rec pril 2025, which took 14 months to recover. It’s also the first of nine drawdowns since 2022 that hasn’t been bought, now 136 days in.\n\n▪️For the bears: Bloomberg counts 48 times since 1980 that the S&P 500 fell 2% or more the day after gaining 1.5%, almost all inside bear markets or crises. Only four came this close to a record high. Two recovered within 50 sessions, and the other two were in 1987.\n▪️ For the bulls: Both VIX analogs ended with new S&P 500 highs, but on very different timelines. After December 2024, the next record close came about five weeks later, on January 23, 2025. After February 2018, it took about six and a half months, until August 24, 2018, with a retest along the way.\n\nNow with CTAs and vol-control having dramatically lowered exposure, Bloomberg says the forced sellers look mostly spent. That’s the usual setup for a bounce they say.\n\nFriday’s bounce was a start but not a convincing one. The Nasdaq rose 1.1% and the S&P 500 0.3%, both well off their highs. Decliners outnumbered advancers in the S&P 500 by about 5 to 3. A hot jobs report (165,000 versus 65,000 expected) also kept a December rate hike in play.", "tweet_url": "https://x.com/neilsethinew/status/2119731725924221176", "images": ["https://pbs.twimg.com/media/HWpdBs2WEAAuFSC.jpg"], "created_at": "2026-11-09T10:00:00.000Z", "relayers": []}]}, {"bank": "Morgan Stanley", "theme": "Morgan Stanley — Wilson on S&P catching down to breadth", "items": [{"author": "neilsethinew", "text": "Morgan Stanley’s Mike Wilson (Strategy Data Pack, Friday) says the S&P 500 “catching down” to weaker breadth “is likely the final stage of this correction,\" after he rightly called a continuation of the pullback in semi's in the event of a big Democratic victory.\n\nBut he isn’t calling the bottom yet: “We are getting close, but would like to see… further confirmation from our sentiment indicator.” His year-end target stays 8,000.\n\nHere's what’s happened to the three “clearing events” he laid out // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
