  time: "21:11 CEST",
  windowStart: "2026-08-07 15:06 CEST",

function catColor(c){ return CATCOLORS[c] || "#999"; }

function buildFilters(){
  const catCounts = {};
  ITEMS.forEach(i => catCounts[i.cat] = (catCounts[i.cat]||0)+1);
  const catBar = document.getElementById("catBar");
  let html = '<button class="pill active" data-cat="all" onclick="setCatFilter(\'all\')">All <span class="count">' + ITEMS.length + '</span></button>';
  Object.keys(catCounts).sort().forEach(function(c){
    html += '<button class="pill" data-cat="' + c + '" style="--pc:' + catColor(c) + '" onclick="setCatFilter(\'' + c + '\')">' + c + ' <span class="count">' + catCounts[c] + '</span></button>';
  });
  catBar.innerHTML = html;

  const urgCounts = {red:0, deep:0, watch:0};
  ITEMS.forEach(i => urgCounts[i.urgency]++);
  const urgBar = document.getElementById("urgBar");
  let uhtml = '<button class="pill active" data-urg="all" onclick="setUrgFilter(\'all\')">All <span class="count">' + ITEMS.length + '</span></button>';
  ["red","deep","watch"].forEach(function(u){
    uhtml += '<button class="pill" data-urg="' + u + '" onclick="setUrgFilter(\'' + u + '\')">' + URGLABEL[u] + ' <span class="count">' + urgCounts[u] + '</span></button>';
  });
  urgBar.innerHTML = uhtml;
}

let currentCat = "all";
let currentUrg = "all";
let currentSrc = null;

function setCatFilter(c){
  currentCat = c; currentSrc = null;
  document.querySelectorAll('#catBar .pill').forEach(function(p){
    const isActive = p.getAttribute('data-cat') === c;
    p.classList.toggle('active', isActive);
    p.style.background = isActive && c !== 'all' ? catColor(c) : (isActive ? '#1f1d1b' : 'transparent');
    p.style.borderColor = isActive ? 'transparent' : '';
  });
  renderCards();
}
function setUrgFilter(u){
  currentUrg = u; currentSrc = null;
  document.querySelectorAll('#urgBar .pill').forEach(function(p){
    const isActive = p.getAttribute('data-urg') === u;
    p.classList.toggle('active', isActive);
    p.style.background = isActive ? '#1f1d1b' : 'transparent';
  });
  renderCards();
}
function filterBySrc(name){
  currentSrc = name; currentCat = "all"; currentUrg = "all";
  document.querySelectorAll('#catBar .pill, #urgBar .pill').forEach(function(p){
    p.classList.remove('active'); p.style.background='transparent';
  });
  document.querySelector('#catBar .pill[data-cat="all"]').classList.add('active');
  document.querySelector('#urgBar .pill[data-urg="all"]').classList.add('active');
  renderCards();
  var el = document.getElementById('cards');
  if(el) el.scrollIntoView({behavior:'smooth'});
}

function renderCards(){
  const container = document.getElementById("cards");
  container.innerHTML = "";
  ITEMS.forEach(function(item){
    let visible = true;
    if(currentCat !== "all" && item.cat !== currentCat) visible = false;
    if(currentUrg !== "all" && item.urgency !== currentUrg) visible = false;
    if(currentSrc && item.source.indexOf(currentSrc) === -1) visible = false;

    const card = document.createElement("div");
    card.className = "card" + (visible ? "" : " hidden");
    card.id = "card-" + item.id;

    const chartFlag = item.charts.hot ? "🔥" : (item.charts.count > 0 || item.charts.desc ? "📊" : "");

    let headHtml = '<div class="card-head" onclick="toggleCard(' + item.id + ')">';
    headHtml += '<span class="idx">#' + item.id + '</span>';
    headHtml += '<span class="urg">' + URGEMOJI[item.urgency] + '</span>';
    headHtml += '<span class="badge" style="background:' + catColor(item.cat) + '">' + item.source + '</span>';
    headHtml += '<span class="cattag">' + item.cat + '</span>';
    if(chartFlag) headHtml += '<span class="chartflag">' + chartFlag + '</span>';
    headHtml += '<span class="title">' + item.title + '</span>';
    headHtml += '</div>';

    let bodyHtml = '<div class="card-body' + (currentSrc ? ' open' : '') + '" id="body-' + item.id + '">';
    bodyHtml += '<div class="section-label">The Idea</div>';
    bodyHtml += '<div class="idea-text">' + item.idea + '</div>';
    bodyHtml += '<div class="section-label">My Angle</div>';
    bodyHtml += '<div class="angle-box" style="--cat-color:' + catColor(item.cat) + '">' + item.angle + '</div>';
    bodyHtml += '<div class="section-label">Tweets</div>';
    bodyHtml += '<div class="tweets">';
    bodyHtml += '<div class="tweet-card"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    if(item.tweetB){
      bodyHtml += '<div class="tweet-card"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    }
    bodyHtml += '</div>';
    if(item.charts.desc){
      bodyHtml += '<div class="chart-box' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '🔥 CHART WORTH SAVING -- ' : '📊 ') + item.charts.desc + '</div>';
    }
    bodyHtml += '<div class="link-row"><a href="' + item.link + '" target="_blank" rel="noopener">↗ Read full article</a></div>';
    bodyHtml += '</div>';

    card.innerHTML = headHtml + bodyHtml;
    container.appendChild(card);
  });
}

function toggleCard(id){
  const body = document.getElementById("body-" + id);
  body.classList.toggle("open");
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function buildReport(){
  document.getElementById("metaLine").textContent =
    META.date + "  |  " + META.time + "  |  " + META.itemsExtracted + " items from " + META.includedSources.length + " sources";

  let html = "<h4>Time Window</h4>";
  html += "<div>" + META.windowStart + " &rarr; " + META.windowEnd + " (strict 6-hour lookback)</div>";
  html += "<div>Emails in window: " + META.emailsInWindow + " &nbsp;|&nbsp; Emails read: " + META.emailsRead + " &nbsp;|&nbsp; Items extracted: " + META.itemsExtracted + "</div>";

  html += "<h4>Included Sources</h4>";
  META.includedSources.forEach(function(s){
    html += '<div class="src-line"><span class="src-link" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span> -- ' + s.count + ' item' + (s.count>1?'s':'') + '</div>';
  });

  html += "<h4>Skipped Sources</h4>";
  META.skippedSources.forEach(function(s){
    html += '<div class="src-line">' + s.name + ' -- ' + s.reason + '</div>';
  });

  document.getElementById("reportBody").innerHTML = html;
}

document.getElementById("reportToggle").addEventListener("click", function(){
  document.getElementById("reportBody").classList.toggle("open");
});

buildFilters();
renderCards();
buildReport();
</script>
