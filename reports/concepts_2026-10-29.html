emes": [{"theme": "2027 China demand and export fragility", "insights": [{"claim": "China's 2026 growth target is essentially achieved despite a series of shocks and surprises, but policymakers cannot be complacent about 2027.", "speaker": "Gavekal Research", "type": "thesis", "entities": ["China"], "conviction": "high", "so_what": "The 2026 target is no longer a constraint; the market focus shifts to what 2027 support looks like.", "quote": null, "locator": "China's growth target for 2026", "quote_verified": false}, {"claim": "Chinese domestic demand has little momentum, with both consumption and investment weak, so growth depends on policy support rather than organic momentum.", "speaker": "Gavekal Research", "type": "thesis", "entities": ["China"], "conviction": "high", "so_what": "Absent policy help, domestic demand will not carry growth at current rates; watch consumption and investment data for confirmation.", "quote": "There is little momentum in domestic demand, with weakness in both consumption and investment", "locator": "China's growth target for 2026", "quote_verified": true}, {"claim": "The sustainability of China's current export boom is uncertain, adding to the risk that organic growth is insufficient to hold current growth rates in 2027.", "speaker": "Gavekal Research", "type": "thesis", "entities": ["China"], "conviction": "medium", "so_what": "Export strength is a fragile pillar; a fade would raise the odds and size of required stimulus.", "quote": null, "locator": "China's growth target for 2026", "quote_verified": false}, {"claim": "Because organic development is probably not enough to sustain current growth rates, the Chinese government will face more pressure in 2027 to deliver policy support.", "speaker": "Gavekal Research", "type": "causal", "entities": ["China"], "conviction": "medium", "so_what": "Expect incremental policy announcements next year; position for policy-driven rather than demand-driven upside.", "quote": null, "locator": "China's growth target for 2026", "quote_verified": false}]}, {"theme": "Policy response within self-imposed limits", "insights": [{"claim": "The central 2027 question for China is how policymakers boost growth while staying within their many self-imposed strictures.", "speaker": "Gavekal Research", "type": "framework", "entities": ["China"], "conviction": "high", "so_what": "Constraints, not will, define the policy reaction function; track which constraints bend first.", "quote": "how policymakers find ways to boost growth while staying within their many self-imposed strictures", "locator": "China's growth target for 2026", "quote_verified": true}, {"claim": "China will not deliver the hoped-for major stimulus plan that decisively boosts market and household confidence in 2027, but the government should still come up with some new measures.", "speaker": "Gavekal Research", "type": "prediction", "entities": ["China"], "conviction": "medium", "so_what": "Fade expectations of a bazooka stimulus while expecting smaller targeted measures; a contrarian stance vs. stimulus hopes.", "quote": "The outcome will not be the hoped-for major stimulus plan", "locator": "China's growth target for 2026", "quote_verified": true}]}, {"theme": "Growth target as macro anchor", "insights": [{"claim": "The annual GDP growth target sets the basic framework for Chinese macro policy.", "speaker": "Gavekal Research", "type": "framework", "entities": ["GDP growth target"], "conviction": "high", "so_what": "The target announced for 2027 is the key signal for the scale of policy support.", "quote": "The basic framework for macro policy will be set by the annual GDP growth target.", "locator": "The basic framework for macro policy", "quote_verified": true}, {"claim": "China lowered its GDP growth target from 5% in 2025 to a range of 4.5-5% for 2026, officially to focus more on structural reforms.", "speaker": "Gavekal Research", "type": "data_point", "entities": ["China", "GDP growth target"], "conviction": "high", "so_what": "The lower, ranged target shows tolerance for slower growth in exchange for reform emphasis.", "quote": null, "locator": "That target was lowered from 5%", "quote_verified": false}, {"claim": "Consensus expects further slowdown in China in 2027, with the IMF forecasting just 4.0% GDP growth.", "speaker": "Gavekal Research", "type": "data_point", "entities": ["IMF", "China"], "conviction": "high", "so_what": "Consensus sits below the 2026 target range, so a 2027 target at or above 4.5% would beat consensus.", "quote": "with the IMF calling for just 4.0% GDP growth", "locator": "Consensus forecasts currently expect", "quote_verified": true}, {"claim": "Lowering China's annual growth target to match slowdown expectations would make it harder to achieve other targets for sustained growth over the decade to 2035, which discourages cutting the 2027 target.", "speaker": "Gavekal Research", "type": "causal", "entities": ["China", "GDP growth target"], "conviction": "medium", "so_what": "Expect a 2027 target kept relatively high to protect the 2035 trajectory, which implies ongoing pressure for support.", "quote": null, "locator": "But lowering the annual growth target", "quote_verified": false}]}], "insight_total": 10, "top_entities": ["China", "IMF", "GDP growth target", "Gavekal Dragonomics", "Wei He", "2035"], "source_meta": {"author": "", "word_count": 264, "paywalled": false}}, {"record_id": "1a666f936f4319df", "source_type": "concepts", "source_name": "Noema Magazine", "source_url": "https://www.noemamag.com/turbulent-times-call-for-experimental-law", "title": "Turbulent Times Call For Experimental Law | NOEMA", "published_date": "2026-10-27", "language": "en", "processed_at": "2026-10-29T11:15:51Z", "processor": "claude-code-sub-opus", "tags": ["Geopolitics", "Tech", "AI", "Society", "Macro"], "gist": "Noema argues fast-moving climate, biotech and AI risks are making law itself provisional, with time-limited, bounded and evaluated experimental clauses (Experimentierklauseln) spreading from Munich and Hamburg to Singapore, China and India. The EU AI Act's sandbox mandate has stalled (deadline pushed from August 2026 to August 2027) over risk aversion and fear of regulatory capture, while Germany's Federal Proving Act passed the Bundestag in June.", "themes": [{"theme": "Law as experiment", "insights": [{"claim": "Accelerating climate change, biological threats and AI are outrunning treaties, public-health responses and regulators, undermining not just the rule of law but the traditional nature of law as slow, backward-looking and stable.", "speaker": "JOE MATHEWS", "type": "thesis", "entities": ["AI", "Oliver Wendell Holmes"], "conviction": "high", "so_what": "Slow rule-making cycles are a structural liability in fast-moving sectors; expect regulatory regimes to become provisional.", "quote": null, "locator": "No question may be more essential", "quote_verified": false}, {"claim": "Experimental clauses (Experimentierklauseln) make parts of laws flexible, often for set periods, so rules can be adapted in real time to changing threats, climate or technology.", "speaker": "JOE MATHEWS", "type": "framework", "entities": ["Experimentierklauseln", "Munich"], "conviction": "high", "so_what": "Time-limited legal carve-outs are becoming a core tool for deploying new technology legally.", "quote": "Experimental clauses allow for real-time adaptation in response to changing threats, climate or technology.", "locator": "The emerging answer is experimental law", "quote_verified": true}, {"claim": "Germany's 2024 economics-ministry guide to experimental clauses is 34 pages but has three rules: every clause needs an expiration date, a clear geographical or sectoral boundary, and rigorous evaluation.", "speaker": "JOE MATHEWS", "type": "framework", "entities": ["German Federal Ministry for Economic Affairs and Climate Action"], "conviction": "high", "so_what": "Sunset, scope and evaluation requirements are the template that makes regulatory experiments politically acceptable.", "quote": "All experimental clauses must have an expiration date, a clear geographical or sectoral boundary, and rigorous evaluation.", "locator": "Over the last decade", "quote_verified": true}, {"claim": "Extreme uncertainty is reframed as an ally: since regulator, regulated and public all know almost nothing about the future, lawmaking becomes a never-ending collaborative search where implementation precedes policy design.", "speaker": "JOE MATHEWS", "type": "contrarian", "entities": ["Munich"], "conviction": "medium", "so_what": "Incumbents with closer access to regulators can shape rules as co-designers rather than lobbyists.", "quote": null, "locator": "These shifts point toward", "quote_verified": false}, {"claim": "Resilience is redefined as deliberately induced, controlled institutional fragility: organizations designed to show strain immediately so they can be reconfigured before failure becomes catastrophic, rather than buffered against known risks.", "speaker": "JOE MATHEWS", "type": "thesis", "entities": [], "conviction": "medium", "so_what": "Favors institutions and firms with fast feedback loops over those with large static buffers.", "quote": null, "locator": "Such collaboration turns lawmaking", "quote_verified": false}]}, {"theme": "Contracts and agencies go fluid", "insights": [{"claim": "Private contracts are shifting from specifying fixed deliverables and payments to establishing collaboration processes, e.g. Agile vendor contracts with test phases, iterative feedback and benchmarks, and biotech relational contracts with shared lab notes.", "speaker": "JOE MATHEWS", "type": "data_point", "entities": ["Agile contracts", "relational contract"], "conviction": "medium", "so_what": "Fixed-price, fixed-scope contracting is losing ground in innovation-heavy sectors, changing vendor risk allocation.", "quote": null, "locator": "Contracts, once used to protect", "quote_verified": false}, {"claim": "Tech procurement increasingly uses Dynamic Service Level Agreements and cloud Data Processing Agreements that update automatically, and in some cases AI agents write contracts in code instead of English.", "speaker": "JOE MATHEWS", "type": "data_point", "entities": ["Dynamic Service Level Agreements", "Data Processing Agreements", "AI"], "conviction": "medium", "so_what": "Contract logic is being automated, so legal-ops and compliance tooling are plausible beneficiaries.", "quote": "Put simply, some contracts now write themselves.", "locator": "Modern tech procurement", "quote_verified": true}, {"claim": "Regulatory agencies in advanced economies are moving from slow formal rulemaking to continuously edited guidance such as advisories, memos, letters and protocols.", "speaker": "JOE MATHEWS", "type": "causal", "entities": [], "conviction": "medium", "so_what": "Soft-law guidance can change faster than statute, raising regulatory-change risk for operators.", "quote": null, "locator": "Similarly, regulatory agencies", "quote_verified": false}]}, {"theme": "Climate and local experimentalism", "insights": [{"claim": "Sabel and Victor argue that decades of top-down climate diplomacy from Kyoto to Paris failed because inflexible global treaties are outdated at signing and ignore local variation in climate impacts; the viable path is local and sectoral experimentalism that is both top-down and bottom-up.", "speaker": "JOE MATHEWS", "type": "thesis", "entities": ["Charles F. Sabel", "David G. Victor", "Kyoto Protocol", "Paris Agreement"], "conviction": "high", "so_what": "Climate policy exposure may shift from treaty-driven to city- and sector-level pilots.", "quote": "Climate treaties are outdated the moment they are signed, because the climate is changing too quickly.", "locator": "In the 2022 book", "quote_verified": true}, {"claim": "Experimental law first emerged in 1950s West Germany, where Länder used trial clauses under the 1949 Basic Law to break legacy rules on welfare, housing and administration without setting precedents; the first clauses let schools test pedagogies and grading.", "speaker": "JOE MATHEWS", "type": "anecdote", "entities": ["West Germany", "Basic Law"], "conviction": "high", "so_what": "Experimental law has a long institutional lineage, so it is not a passing fad.", "quote": null, "locator": "Experimental law first emerged", "quote_verified": false}, {"claim": "Experimental-law adoption is strongest in metro regions of advanced economies with histories of collaborative regulation, notably Singapore and larger German cities.", "speaker": "JOE MATHEWS", "type": "thesis", "entities": ["Singapore", "Germany"], "conviction": "medium", "so_what": "Such jurisdictions are likeliest first movers for regulatory sandboxes in new technologies.", "quote": null, "locator": "This local experimentalist mindset", "quote_verified": false}]}, {"theme": "German and Munich pilots", "insights": [{"claim": "Hamburg used experimental clauses to deviate from the federal Air Traffic Act for 18 months, creating a 30-square-kilometer U-Space Sandbox over the Port of Hamburg with Droniq and DFS to test drones carrying hospital tissue samples; results feed Germany's draft federal U-Space Act.", "speaker": "JOE MATHEWS", "type": "data_point", "entities": ["Hamburg", "U-Space Sandbox", "Droniq", "DFS Deutsche Flugsicheruntegration", "U-Space Act"], "conviction": "high", "so_what": "A pilot-to-statute path for drones is being written in Germany, a template for other regulated tech.", "quote": null, "locator": "Ask the federal ministry staff", "quote_verified": false}, {"claim": "A Munich self-organized housing syndicate used experimental clauses to deviate from building codes at Goerzerstrasse 128: a wood and corrugated-iron shed flat for 14 people costing over 3 million euros, with rent around 460 euros per person versus 1,700 euros for a one-bedroom in Munich.", "speaker": "JOE MATHEWS", "type": "data_point", "entities": ["Goerzerstrasse 128", "Munich"], "conviction": "high", "so_what": "Code deviations can cut housing cost sharply, which supports lighter-touch building regulation.", "quote": null, "locator": "In Munich, I spent an evening", "quote_verified": false}, {"claim": "The Munich house helped inspire a national experimental clause, the Construction Turbo (Section 246e of the Federal Building Code), allowing municipalities to bypass planning standards until the end of 2030; experimental law does not cure NIMBYism.", "speaker": "JOE MATHEWS", "type": "causal", "entities": ["Construction Turbo", "Federal Building Code"], "conviction": "medium", "so_what": "Planning-rule relaxation through 2030 may expand housing supply, with neighbor opposition as the main friction.", "quote": "Experimental law offers no cure for NIMBYism, at least not yet.", "locator": "Gorzer 128 and other experiments", "quote_verified": true}, {"claim": "Labeling a street closure a temporary science-led Reallabor let politicians deflect resident complaints with 'it's just an experiment, let's wait for the data'; after six months on Kolumbusstraße, 66% of residents supported making the changes permanent.", "speaker": "JOE MATHEWS", "type": "causal", "entities": ["Kolumbusstraße", "Oliver May-Beckmann", "MCube", "Technical University of Munich"], "conviction": "medium", "so_what": "Framing policy as an experiment lowers political cost and builds evidence for permanent change.", "quote": null, "locator": "Oliver May-Beckmann", "quote_verified": false}, {"claim": "In an MCube test, 10 Nymphenburg families gave up private cars for 18 months to share five electric cars; people with a nearby shared car paid significantly more for regular access than for one-off use, whereas 20 years of free-floating car-sharing by German automakers only added cars to the street. MCube is now working with BMW and Sixt to spread the model.", "speaker": "JOE MATHEWS", "type": "data_point", "entities": ["MCube", "Nymphenburg", "BMW", "Sixt", "Mercedes"], "conviction": "medium", "so_what": "Closed-group subscription car-sharing may be a more monetizable and emissions-reducing model than free-floating schemes.", "quote": null, "locator": "MCube also used an experimental clause", "quote_verified": false}, {"claim": "Munich's MINGA project will run driverless buses without fixed schedule or route for two years under experimental clauses from 2021 amendments to the Road Traffic Act, with 13 million euros of government funding, MAN-built buses and TUM software, before evaluation.", "speaker": "JOE MATHEWS", "type": "data_point", "entities": ["MINGA", "MAN", "Road Traffic Act", "Munich"], "conviction": "medium", "so_what": "European autonomous transit is advancing through publicly funded, time-limited pilots rather than broad commercial permission.", "quote": null, "locator": "Take MINGA", "quote_verified": false}, {"claim": "Experimental clauses enable systems integration across autonomous driving, city development, climate and energy, which is nearly impossible in conventional governance where programs are added sequentially one by one.", "speaker": "JOE MATHEWS", "type": "thesis", "entities": ["Oliver May-Beckmann"], "conviction": "medium", "so_what": "Winners in mobility may be integrators of whole systems rather than vehicle makers alone.", "quote": "It’s crucial in Europe that mobility innovation isn’t just about a new car; it’s about a system.", "locator": "Experimental clauses, at their best", "quote_verified": true}]}, {"theme": "Asian and global sandboxes", "insights": [{"claim": "Singapore, the leader in temporary regulations, has built a financial powerhouse on banking and fintech experiments and now lets low- to medium-risk AI medical software be used in public hospitals before registration, with an accelerated path to permanent approval if it performs well for 12 months under clinician oversight.", "speaker": "JOE MATHEWS", "type": "data_point", "entities": ["Singapore", "Health Sciences Authority", "AI"], "conviction": "high", "so_what": "Singapore offers a fast, conditional route to market for AI health products that Europe lacks.", "quote": null, "locator": "If democracy doesn’t have to be part", "quote_verified": false}, {"claim": "China uses legislatively authorized experimental zones to deviate from national law; Shenzhen's 2025-2026 decision on intelligent connected vehicles lets fully driverless commercial taxis bypass national safety standards.", "speaker": "JOE MATHEWS", "type": "data_point", "entities": ["China", "Shenzhen", "Yueduan Wang", "Experimentalist Constitutions"], "conviction": "high", "so_what": "Chinese cities can commercialize robotaxis ahead of national rules, an advantage for Chinese autonomy players.", "quote": null, "locator": "In his 2024 book", "quote_verified": false}, {"claim": "India embeds regulatory sandbox clauses in legislation: the 2023 Telecommunication Act created a live test environment exempt from licensing fees for 6G, and GIFT City in Gujarat lets fintech startups temporarily bypass corporate governance, liquidity, capital and reporting rules via an interoperable sandbox.", "speaker": "JOE MATHEWS", "type": "data_point", "entities": ["India", "Telecommunication Act", "GIFT City", "Gujarat"], "conviction": "medium", "so_what": "GIFT City is a regulatory-arbitrage venue for hybrid fintech products.", "quote": null, "locator": "India has embedded", "quote_verified": false}, {"claim": "Other examples include Barcelona's 22@ district for drones, Welsh 'Sunshine Tariffs' for renewables, a South Korean hydrogen mobility exemption in Gyeongsangbuk-do, and Japan's Future Design movement.", "speaker": "JOE MATHEWS", "type": "data_point", "entities": ["Barcelona", "South Korea", "Japan"], "conviction": "low", "so_what": "Experimental regimes are spreading across energy, transport and urban policy globally.", "quote": null, "locator": "The desire to experiment with law", "quote_verified": false}]}, {"theme": "AI regulation stuck on caution", "insights": [{"claim": "The EU AI Act's Article 57 required each member state to set up at least one national AI regulatory sandbox by August 2026, but about a dozen states including Germany and France could not agree on the responsible authority, so the deadline was pushed to August 2027 via the AI Omnibus, and few expect it to be met.", "speaker": "JOE MATHEWS", "type": "data_point", "entities": ["AI Act", "AI Omnibus", "Germany", "France"], "conviction": "high", "so_what": "EU AI compliance timelines are slipping; sandbox benefits for EU AI developers are unlikely before 2027.", "quote": null, "locator": "In 2024, the EU embraced", "quote_verified": false}, {"claim": "Because the AI Act does not require real-world experimental deployment, national AI sandboxes are limited to theoretical or legal assessments, and without experimenting with AI in the real world one cannot create experimental law for it, leaving AI developing largely beyond regulation.", "speaker": "JOE MATHEWS", "type": "causal", "entities": ["AI Act", "AI"], "conviction": "medium", "so_what": "Paper sandboxes provide little regulatory certainty, so real AI deployment may proceed outside effective oversight.", "quote": "The paradox is that fear of applying experimental law to AI has left AI running free, well beyond law and regulation.", "locator": "Notably, the AI Act", "quote_verified": true}, {"claim": "appliedAI's Till Klein says existing AI sandboxes carry too many restrictions and must be precise, a sniper rifle not a shotgun, while colleague Demian Niemeyer attributes the choke point to a risk-averse 'Bismarck mindset' among German-trained lawyers.", "speaker": "JOE MATHEWS", "type": "contrarian", "entities": ["Till Klein", "Demian Niemeyer", "appliedAI"], "conviction": "medium", "so_what": "The bottleneck for European AI experimentation is legal culture as much as statute.", "quote": "a sandbox is more like a sniper rifle than a shotgun; your experiment has to be precise for it to be meaningful.", "locator": "In Munich, Till Klein", "quote_verified": true}]}, {"theme": "Capture risk and the Federal Proving Act", "insights": [{"claim": "Fear of regulatory capture is a second brake: Social Democrats, left groups and some scholars argue broad experimental authorization could become a backdoor lobbying channel for Big Tech seeking exemptions from labor, safety and privacy laws, mostly over AI, which delayed Germany's sandbox act in 2024 and 2025.", "speaker": "JOE MATHEWS", "type": "causal", "entities": ["Social Democrats", "Big Tech", "Reallabore-Gesetz"], "conviction": "high", "so_what": "Political backlash over capture could limit how far sandboxes help large technology firms.", "quote": null, "locator": "In 2024 and 2025", "quote_verified": false}, {"claim": "Germany's Bundeserprobungsgesetz (Federal Proving Act) passed the Bundestag in late June with mandatory continuous evaluation, transparent reporting of results, and an innovation portal for broad stakeholder co-creation; the Bundesrat was due to enact it in September, and its practical effect remains uncertain.", "speaker": "JOE MATHEWS", "type": "data_point", "entities": ["Bundeserprobungsgesetz", "Bundestag", "Bundesrat", "Regulatory Sandboxes Innovation Portal"], "conviction": "medium", "so_what": "Germany is building a general framework for regulatory sandboxes, a possible template for EU peers.", "quote": null, "locator": "The legislation, renamed", "quote_verified": false}]}], "insight_total": 27, "top_entities": ["Munich", "Experimentierklauseln", "Germany", "Singapore", "AI Act", "MCube", "Hamburg", "China", "India", "Oliver May-Beckmann", "Charles F. Sabel", "Bundeserprobungsgesetz"], "source_meta": {"author": "JOE MATHEWS", "word_count": 3626, "paywalled": false}}, {"record_id": "1bf2e81ce99b7f48", "source_type": "concepts", "source_name": "Oxford Economics", "source_url": "https://www.oxfordeconomics.com/resource/why-bond-yields-and-term-premia-are-likely-to-remain-high/", "title": "Why bond yields and term premia are likely to remain high", "published_date": "2026-10-28", "language": "en", "processed_at": "2026-10-29T11:15:39Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Positioning"], "gist": "Oxford Economics finds more than half of the rise in advanced-economy bond yields since 2020 came from the term premium, now back at mid-2000s levels, driven by bond-stock correlations that turned positive in Q3 2023. It expects both to stay high amid more frequent supply shocks and more hawkish central banks.", "themes": [{"theme": "Yield decomposition and term premium", "insights": [{"claim": "A 10-year government bond yield can be split into the expected path of safe short-term rates plus a broadly defined term premium that compensates investors for the risks of holding the bond.", "speaker": "Sally Li", "type": "framework", "entities": ["term premium"], "conviction": "high", "so_what": "Use the rates-path vs term-premium split to judge whether a yield move reflects policy expectations or a risk-compensation repricing.", "quote": null, "locator": "first paragraph", "quote_verified": false}, {"claim": "Since 2020, more than half of the rise in advanced-economy government bond yields has come from the term premium rather than from expected short-term rates.", "speaker": "Sally Li", "type": "data_point", "entities": ["advanced-economy government bond yields", "term premium"], "conviction": "high", "so_what": "The yield surge is mostly a risk-compensation story, so rate-cut expectations alone will not bring yields back down.", "quote": "Since 2020, more than half of the increase in advanced-economy government bond yields came from the term premium.", "locator": "first paragraph", "quote_verified": true}, {"claim": "Term premia are back at mid-2000s levels: high relative to the last 10 years but still low in a broader historical context.", "speaker": "Sally Li", "type": "data_point", "entities": ["term premium"], "conviction": "medium", "so_what": "Implies there is room for term premia to rise further before reaching long-run historical norms.", "quote": "Term premia are now back to their mid-2000s levels", "locator": "What you will learn", "quote_verified": true}]}, {"theme": "Bond-stock correlation as term premium driver", "insights": [{"claim": "Across major advanced economies, bond-stock correlations were negative for most of this century, turned positive again in Q3 2023, and have risen steeply since.", "speaker": "Sally Li", "type": "data_point", "entities": ["bond-stock correlations", "Q3 2023"], "conviction": "high", "so_what": "The regime in which bonds reliably offset equity drawdowns has ended, which breaks the assumptions behind classic 60/40 portfolios.", "quote": null, "locator": "What you will learn", "quote_verified": false}, {"claim": "The strength of bond-stock co-movement is an important driver of the term premium: when bonds are a worse hedge against stock returns, investors demand more compensation to hold them.", "speaker": "Sally Li", "type": "causal", "entities": ["term premium", "bond-stock correlations"], "conviction": "high", "so_what": "Track the bond-stock correlation as a leading input for term-premium and long-duration pricing.", "quote": null, "locator": "We find that an important driver", "quote_verified": false}, {"claim": "A positive bond-stock correlation resembles the 1980s and 1990s, and this time the higher term premium is required also on inflation-indexed bonds.", "speaker": "Sally Li", "type": "thesis", "entities": ["inflation-indexed bonds"], "conviction": "medium", "so_what": "Inflation-linked bonds are no longer a clean refuge from the higher-premium regime.", "quote": null, "locator": "This means bonds are a worse hedge", "quote_verified": false}]}, {"theme": "Regime shift: supply shocks and hawkish central banks", "insights": [{"claim": "Oxford Economics expects the bond-stock correlation and bond term premia to stay high because advanced economies have entered an era of more frequent supply shocks and more hawkish central banks.", "speaker": "Sally Li", "type": "prediction", "entities": ["bond-stock correlations", "term premium"], "conviction": "medium", "so_what": "Position for structurally higher long-end yields rather than a reversion to the post-2010 low-premium regime.", "quote": "We think the bond-stock correlation and bond term premia will remain high", "locator": "What you will learn", "quote_verified": true}, {"claim": "More frequent supply shocks and more hawkish central banks are the underlying causes behind persistently positive bond-stock correlations and elevated term premia.", "speaker": "Sally Li", "type": "causal", "entities": ["central banks"], "conviction": "medium", "so_what": "Supply-shock news (for example energy disruptions) is likely to hit bonds and equities together, reducing diversification benefits.", "quote": null, "locator": "What you will learn", "quote_verified": false}]}], "insight_total": 8, "top_entities": ["term premium", "bond-stock correlations", "advanced-economy government bond yields", "inflation-indexed bonds", "central banks", "Q3 2023"], "source_meta": {"author": "Sally Li", "word_count": 411, "paywalled": false}}, {"record_id": "9442e871b9aee264", "source_type": "concepts", "source_name": "Oxford Economics", "source_url": "https://www.oxfordeconomics.com/resource/how-the-world-bank-supports-projects-with-global-benefits/", "title": "How the World Bank supports projects with global benefits", "published_date": "2026-10-28", "language": "en", "processed_at": "2026-10-29T12:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Society"], "gist": "An Oxford Economics assessment, commissioned by Germany's BMZ and implemented by GIZ, finds the World Bank's Framework for Financial Incentives (FFI) is showing encouraging early progress: 33 of 48 applications approved across five funding rounds, mostly climate-related. The main weakness is timing, since many applications arrived with projects already well advanced, limiting the framework's ability to shape cross-border benefits.", "themes": [{"theme": "FFI mechanism and uptake", "insights": [{"claim": "The World Bank's Framework for Financial Incentives makes IBRD-financed projects with cross-border benefits cheaper to fund by offering additional borrowing capacity, longer repayment periods and financial support that reduces borrowing costs.", "speaker": "Sally Li", "type": "framework", "entities": ["World Bank", "Framework for Financial Incentives", "IBRD"], "conviction": "high", "so_what": "Global public goods financing is being pushed through concessional sweeteners on existing sovereign lending, a channel to monitor for climate and biodiversity project flow.", "quote": null, "locator": "The FFI helps countries invest in projects", "quote_verified": false}, {"claim": "Across its first five funding rounds the World Bank's incentive framework received 48 applications and approved 33, a roughly 69% approval rate, with projects spanning all seven World Bank regions.", "speaker": "Sally Li", "type": "data_point", "entities": ["World Bank", "FFI"], "conviction": "high", "so_what": "Broad regional coverage and a high approval rate suggest real demand and scalable pipeline for global-benefit lending.", "quote": "the framework received 48 applications and approved 33, covering all seven World Bank regions", "locator": "Across its first five funding rounds", "quote_verified": true}, {"claim": "Climate change was the most commonly addressed global challenge among applications to the World Bank's incentive framework, ahead of other challenges such as biodiversity loss.", "speaker": "Sally Li", "type": "data_point", "entities": ["climate change", "biodiversity loss", "FFI"], "conviction": "high", "so_what": "Climate remains the dominant category in multilateral global-public-goods finance, shaping where project demand and contractor opportunity concentrate.", "quote": "Climate change was the most commonly addressed challenge.", "locator": "Across its first five funding rounds", "quote_verified": true}]}, {"theme": "Early evidence of targeting and effect", "insights": [{"claim": "Approved projects scored higher on expected cross-border benefits than rejected ones, which the assessment reads as evidence that World Bank incentive support is reaching projects with greater potential global benefit.", "speaker": "Sally Li", "type": "data_point", "entities": ["World Bank", "FFI"], "conviction": "medium", "so_what": "Selection appears to discriminate on global benefit, supporting the credibility of the incentive design, though scores are the framework's own measure.", "quote": "Approved projects generally scored more highly on expected cross-border benefits than rejected projects", "locator": "Across its first five funding rounds", "quote_verified": true}, {"claim": "Project teams and technical experts report that the incentives eased funding constraints, increased project scale and supported more ambitious designs for World Bank-financed projects.", "speaker": "Sally Li", "type": "causal", "entities": ["World Bank", "FFI"], "conviction": "medium", "so_what": "Suggests the subsidy has additionality on scale and ambition, but evidence is self-reported feedback from consultations rather than counterfactual measurement.", "quote": null, "locator": "Feedback from project teams and technical experts", "quote_verified": false}, {"claim": "The incentive framework has changed behaviour beyond funding: teams consider cross-border benefits more systematically and it has opened discussions with borrowing countries about investments whose wider value might otherwise get less attention.", "speaker": "Sally Li", "type": "causal", "entities": ["World Bank", "borrowing countries", "FFI"], "conviction": "medium", "so_what": "Agenda-setting with borrowers is a second-order benefit that could shift the pipeline of future sovereign borrowing toward global-benefit projects.", "quote": null, "locator": "The framework has also encouraged teams", "quote_verified": false}]}, {"theme": "Late engagement and measurement gaps", "insights": [{"claim": "Many initial applications to the World Bank incentive framework involved projects already well advanced in planning, which limits how much the incentive can strengthen their cross-border benefits from the outset.", "speaker": "Sally Li", "type": "thesis", "entities": ["World Bank", "FFI"], "conviction": "high", "so_what": "The incentive risks subsidising projects that would have proceeded anyway, a key additionality weakness to watch as the programme scales.", "quote": "Many initial applications involved projects already well advanced in planning", "locator": "The findings also highlight opportunities", "quote_verified": true}, {"claim": "The assessment recommends earlier engagement with project teams, better tools for measuring cross-border benefits and clearer assessments of financing needs so that World Bank incentives can be targeted more effectively.", "speaker": "Sally Li", "type": "prediction", "entities": ["World Bank", "FFI", "GIZ", "BMZ"], "conviction": "medium", "so_what": "Expect framework refinements around benefit measurement and financing-need assessment, which would raise the bar for future applications.", "quote": "Earlier engagement, better tools for measuring these benefits and clearer assessments of financing needs could help target incentives more effectively.", "locator": "Earlier engagement, better tools", "quote_verified": true}]}], "insight_total": 8, "top_entities": ["World Bank", "Framework for Financial Incentives", "FFI", "IBRD", "BMZ", "GIZ", "Oxford Economics", "climate change", "biodiversity loss"], "source_meta": {"author": "Sally Li", "word_count": 796, "paywalled": false}}, {"record_id": "fffb943503a03266", "source_type": "concepts", "source_name": "central banks", "source_url": "https://www.oxfordeconomics.com/resource/how-will-central-banks-react-to-higher-bond-yields/", "title": "How will central banks react to higher bond yields?", "published_date": "2026-10-28", "language": "en", "processed_at": "2026-10-29T11:16:13Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Positioning"], "gist": "Oxford Economics argues the surge in government bond yields, driven by higher policy-rate expectations (inflation worries, resilient business investment) and higher term premia (fiscal and debt-issuance worries), will not stop central banks from hiking further in coming months. Large-scale direct intervention in bond markets is seen as unlikely unless financial stability is threatened.", "themes": [{"theme": "Central banks keep hiking", "insights": [{"claim": "Oxford Economics expects major central banks to keep raising policy rates in the coming months despite the recent surge in government bond yields and the resulting higher financing costs for households and businesses.", "speaker": "Sally Li", "type": "prediction", "entities": ["central banks", "central banks"], "conviction": "high", "so_what": "Do not price a central-bank pivot or bailout from rising yields alone; the base case is further tightening.", "quote": "We expect major central banks will continue to tighten in coming months.", "locator": "The recent surge in government bond yields", "quote_verified": true}, {"claim": "Higher bond yields are not expected to deter central banks from tightening, even as they spill over into higher borrowing costs for households and businesses.", "speaker": "Sally Li", "type": "thesis", "entities": ["central banks", "bond yields"], "conviction": "high", "so_what": "Rising market borrowing costs are not a dovish signal on their own; the 'central bank put' on yields is weak here.", "quote": "is unlikely to deter central banks from raising policy rates further", "locator": "The recent surge in government bond yields", "quote_verified": true}]}, {"theme": "Yield rise driven by policy expectations", "insights": [{"claim": "Part of the rise in government bond yields reflects higher market expectations for policy rates, driven by inflation worries and by growth, especially business investment, proving more resilient than expected.", "speaker": "Sally Li", "type": "causal", "entities": ["bond yields", "business investment", "inflation"], "conviction": "high", "so_what": "Inflation and resilient capex are driving both yields and policy; watch investment and inflation data as the common drivers.", "quote": null, "locator": "The rise in bond yields partly reflects", "quote_verified": false}, {"claim": "The same factors that pushed up market policy-rate expectations (inflation worries and resilient growth) will also keep prompting central banks to hike, so yields and policy rates are being pushed the same way.", "speaker": "Sally Li", "type": "causal", "entities": ["central banks", "policy rates"], "conviction": "medium", "so_what": "Front-end and long-end repricing share a cause, so a growth or inflation downside surprise would hit both.", "quote": null, "locator": "These same factors also will continue", "quote_verified": false}]}, {"theme": "Term premia and fiscal credibility", "insights": [{"claim": "The rise in yields also reflects higher term or risk premia, attributed partly to worries over unsustainable long-term fiscal trends and higher public debt issuance.", "speaker": "Sally Li", "type": "causal", "entities": ["term premia", "public debt", "bond yields"], "conviction": "high", "so_what": "Supply and fiscal-sustainability concerns, not only the policy path, are lifting long-end yields; watch issuance and fiscal news.", "quote": null, "locator": "The rise in yields also reflects", "quote_verified": false}, {"claim": "Higher term premia may dent growth but probably will not make central banks more dovish, because fiscal worries also tend to erode the credibility of central banks' long-term commitment to low inflation.", "speaker": "Sally Li", "type": "contrarian", "entities": ["term premia", "central banks", "public debt"], "conviction": "medium", "so_what": "Contrary to the idea that fiscal-driven yield spikes force central banks to ease, fiscal stress here pushes them to stay hawkish to defend credibility.", "quote": "This rise in premia may dent growth, but it probably won’t make central banks more dovish.", "locator": "The rise in yields also reflects", "quote_verified": true}]}, {"theme": "Limits to central bank intervention", "insights": [{"claim": "Central banks have made some modest direct responses to high bond yields, but large-scale direct intervention in bond markets is unlikely unless high yields cause financial stability problems.", "speaker": "Sally Li", "type": "prediction", "entities": ["central banks", "bond markets", "financial stability"], "conviction": "medium", "so_what": "Intervention is conditional on a financial-stability trigger; monitor stress indicators as the signal for a policy-response regime change.", "quote": "large-scale direct central bank intervention in bond markets is unlikely unless high bond yields cause financial stability problems", "locator": "High bond yields have prompted some modest", "quote_verified": true}]}], "insight_total": 7, "top_entities": ["central banks", "bond yields", "policy rates", "term premia", "inflation", "business investment", "public debt", "financial stability"], "source_meta": {"author": "Sally Li", "word_count": 392, "paywalled": false}}, {"record_id": "9e48afab5a6eef25", "source_type": "concepts", "source_name": "Peterson Institute (PIIE)", "source_url": "https://www.piie.com/blogs/realtime-economics/2026/fed-its-own-reaction-function-it-should-tell-us-why", "title": "The Fed Is Off Its Own Reaction Function. It Should Tell Us Why.", "published_date": "2026-10-27", "language": "en", "processed_at": "2026-10-29T11:16:54Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Positioning", "Geopolitics"], "gist": "Jason Furman shows the Fed's dots work as a Taylor-rule reaction function to its own forecast revisions (R-squared 0.77), but that the Fed is now 1.15 points below it (1.85 implied vs 0.7 delivered on the end-2026 rate, to 4.1 percent) after core PCE projection rose from 2.5 to 3.4 percent. He argues the gap may reflect wisdom, since tariff and Iran-conflict inflation is transitory and trimmed-mean/median measures are falling, and urges the Fed to publish rule readings and explain deviations.", "themes": [{"theme": "Dots as a reaction function", "insights": [{"claim": "The Fed's rate projections are poor predictions of its own policy path: of 51 sets of projections since 2012 scored against the set a year later, rates ended higher than projected 15 times and lower 21 times, with the rest mostly zero-rate years.", "speaker": "Jason Furman", "type": "data_point", "entities": ["Federal Open Market Committee", "Summary of Economic Projections"], "conviction": "high", "so_what": "Do not trade the dots as a plan; treat them as conditional on data.", "quote": null, "locator": "The Fed's Economic Projections as a Reaction Function", "quote_verified": false}, {"claim": "The dots should be read as a conditional reaction function, not a plan: the Fed says how much it expects to move rates but will adjust if inflation or unemployment depart from its forecast.", "speaker": "Jason Furman", "type": "framework", "entities": ["Federal Open Market Committee", "Summary of Economic Projections"], "conviction": "high", "so_what": "Rate-path surprises are mostly forecast-error pass-through, so trade the data surprise, not the dot.", "quote": "the projections not as a plan for its actions but as setting out a reaction function", "locator": null, "quote_verified": true}, {"claim": "Large historical misses were consistent with a Taylor rule on the Fed's own forecast revisions: in December 2018 the Fed projected two hikes for 2019 but cut three times (a swing of about 1.25 points), matching a rule-implied 0.6 + 0.4 + 0.3 = 1.3 points once core PCE came in 0.4 lower, unemployment 0.1 higher and neutral estimates fell.", "speaker": "Jason Furman", "type": "data_point", "entities": ["Taylor rule", "core PCE"], "conviction": "high", "so_what": "Past dovish pivots were rule-consistent, not discretionary.", "quote": null, "locator": "Take two examples", "quote_verified": false}, {"claim": "In 2022 the Fed raised rates by 4.25 points against a December 2021 plan of 0.75; about 3 of the 3.5-point overage is explained by the Taylor rule applied to core PCE coming in at 4.8 percent rather than the forecast 2.7.", "speaker": "Jason Furman", "type": "data_point", "entities": ["Taylor rule", "core PCE"], "conviction": "high", "so_what": "The 2022 hiking shock was largely the reaction function operating on an inflation miss.", "quote": null, "locator": "In December 2021", "quote_verified": false}, {"claim": "A Taylor rule in changes applied to the Fed's own forecast revisions explains about 77 percent of the variation in how the Fed moves its year-end rate projection, with a typical miss of 0.66 points versus 1.22 for assuming no change; free-fit weights are 1.57 on inflation and 0.99 on unemployment, close to Taylor's 1.5 and 1.", "speaker": "Jason Furman", "type": "data_point", "entities": ["Taylor rule", "Federal Open Market Committee"], "conviction": "high", "so_what": "Gives a quantitative tool to estimate where the Fed should move given data surprises.", "quote": null, "locator": "Figure 1", "quote_verified": false}, {"claim": "The committee reacts to its inflation forecast rather than trailing twelve-month inflation: a rule in changes run on realized data explains nothing (R-squared 0.00) over 2012-26, while the forecast-revision version explains 0.77.", "speaker": "Jason Furman", "type": "causal", "entities": ["Federal Open Market Committee", "Summary of Economic Projections"], "conviction": "medium", "so_what": "Forward inflation expectations in the SEP, not trailing prints, drive Fed moves.", "quote": null, "locator": "Finally, the weights (Table A3)", "quote_verified": false}]}, {"theme": "Fed far below its reaction function now", "insights": [{"claim": "Since December 2025 the Fed's forecasts have shifted by enough that its own reaction function calls for raising the end-2026 funds rate path by 1.85 points to about 5.25 percent, yet it raised it only 0.7 to 4.1 percent, a shortfall of 1.15 points.", "speaker": "Jason Furman", "type": "data_point", "entities": ["Federal Open Market Committee", "federal funds rate"], "conviction": "high", "so_what": "Market pricing near 4.1 percent sits well below what a rules-based Fed would deliver, a tail risk for hawkish repricing.", "quote": null, "locator": "The Federal Funds Rate Is Currently Well Below", "quote_verified": false}, {"claim": "The Fed's core PCE inflation projection for 2026 rose from 2.5 percent in December 2025 to 3.4 percent in September 2026, which alone would justify a 1.35 point hike under a Taylor rule, versus a 0.25 point hike delivered and about 0.5 points priced by the market for 2026.", "speaker": "Jason Furman", "type": "data_point", "entities": ["core PCE", "Taylor rule"], "conviction": "high", "so_what": "Inflation surprise is the main source of the policy gap.", "quote": null, "locator": "The bigger, and less pleasant, surprise", "quote_verified": false}, {"claim": "The Fed's unemployment projection for end-2026 fell from 4.4 percent to 4.1 percent, enough under a Taylor reaction function to eliminate the 25 basis point cut planned in December 2025.", "speaker": "Jason Furman", "type": "data_point", "entities": ["Federal Open Market Committee"], "conviction": "high", "so_what": "Labor-market strength removes the easing case.", "quote": null, "locator": "The Federal Funds Rate Is Currently Well Below", "quote_verified": false}, {"claim": "The current dovish deviation from the reaction function ranks among the most extreme on record: of 37 comparable twelve-month readings since 2012, only five were more dovish and all five came in the past three years.", "speaker": "Jason Furman", "type": "data_point", "entities": ["Federal Open Market Committee"], "conviction": "high", "so_what": "The Fed has been persistently looser than its rule for three years, which is a regime feature.", "quote": null, "locator": "only five have been more dovish", "quote_verified": false}, {"claim": "The shortfall is not tied to the current Chair: anchoring on the March 2026 projections, the last under Powell, the rule implies a 1.45 point increase since March against 0.7 delivered, a 0.75 point gap; earlier rounds since September 2023 imply on average a rate about 1.3 points above the Fed's current 4.1 percent.", "speaker": "Jason Furman", "type": "data_point", "entities": ["Kevin Warsh", "Powell"], "conviction": "medium", "so_what": "The dovish gap persists across leadership, so it is not a Warsh-specific story.", "quote": null, "locator": "This is not just about the current Chair", "quote_verified": false}]}, {"theme": "Folly or wisdom: transitory inflation", "insights": [{"claim": "The case that the Fed is wise to deviate is that part of the inflation comes from tariffs and the Iran conflict, which raise the price level once and then stop adding to inflation, so the Fed should not react to them as it would not react to a VAT increase.", "speaker": "Jason Furman", "type": "thesis", "entities": ["tariffs", "Iran", "value-added tax"], "conviction": "medium", "so_what": "Tariff pass-through is a one-time level shift, supporting a patient Fed if it holds.", "quote": null, "locator": "Another interpretation is that the Fed is wiser than the formula", "quote_verified": false}, {"claim": "To justify switching from a planned 25 basis point cut to the 50 basis points of hikes priced by the market, the Fed's inputs would need to be unemployment of 4.2 percent and core PCE inflation of about 2.7 percent, roughly half a point below a reasonable current forecast of about 3.2 percent that could be attributed to transitory factors.", "speaker": "Jason Furman", "type": "data_point", "entities": ["core PCE", "Federal Open Market Committee"], "conviction": "medium", "so_what": "The Fed is implicitly discounting about 0.5 points of inflation as transitory; failure of that bet means more hikes.", "quote": null, "locator": "Quantification can shed some light", "quote_verified": false}, {"claim": "Core PCE inflation has diverged from underlying measures: from July 2025 to July 2026 core PCE rose from 2.8 to 3.0 percent while the Dallas Fed trimmed mean fell from 2.8 to 2.3 and the Cleveland Fed median from 3.5 to 2.7; treating the gap as noise puts the Fed roughly on its reaction function.", "speaker": "Jason Furman", "type": "data_point", "entities": ["Dallas Fed", "Cleveland Fed", "core PCE"], "conviction": "medium", "so_what": "Trimmed-mean and median trends are the evidence for the Fed's looking-through story.", "quote": null, "locator": "Table A4", "quote_verified": false}, {"claim": "With the trimmed-mean adjustment the rule's implied 1.85 point increase becomes 0.9, and with the median adjustment 0.6, against the 0.7 the Fed actually did, so the apparent policy gap depends heavily on which inflation measure is used.", "speaker": "Jason Furman", "type": "data_point", "entities": ["trimmed mean", "Taylor rule"], "conviction": "medium", "so_what": "Whether the Fed is off course hinges on choice of core versus trimmed or median inflation.", "quote": null, "locator": "Table A4", "quote_verified": false}, {"claim": "Furman began the exercise believing the Fed was well off base but after quantifying it ended up more sympathetic to its approach.", "speaker": "Jason Furman", "type": "contrarian", "entities": ["Federal Open Market Committee"], "conviction": "medium", "so_what": "A prominent critic-leaning economist sees the Fed's looseness as defensible.", "quote": "I confess, I began this exercise thinking the Fed was way off base", "locator": null, "quote_verified": true}]}, {"theme": "Taylor rules in levels", "insights": [{"claim": "Level-based Taylor-type rules have placed the funds rate below the rule at most meetings since 2012, by 1.3 to 2.7 points on average depending mainly on the neutral rate used, so persistent apparent dovishness against levels rules is normal for the period.", "speaker": "Jason Furman", "type": "data_point", "entities": ["Taylor rule", "Laubach–Williams", "Holston"], "conviction": "high", "so_what": "A level gap alone is not a signal; the claim concerns the Fed's own reaction function.", "quote": null, "locator": "Table A2", "quote_verified": false}, {"claim": "Today's funds rate gap to the Taylor (1993) rule of 1.5 points is only at the 38th percentile of meetings since 1990, about as far below the rule as is normal.", "speaker": "Jason Furman", "type": "data_point", "entities": ["Taylor rule"], "conviction": "medium", "so_what": "Rules in levels do not flag the Fed as unusually loose now.", "quote": null, "locator": "By any of these level measures", "quote_verified": false}, {"claim": "Inertial and first-difference rules track the funds rate closely (mean gaps -0.1 and -0.3 points) only by construction, since they start from the current rate, so they describe persistence rather than where the rate should be.", "speaker": "Jason Furman", "type": "framework", "entities": ["Federal Reserve Board"], "conviction": "medium", "so_what": "Good fit of inertial rules is uninformative for judging policy stance.", "quote": null, "locator": "Table A2", "quote_verified": false}, {"claim": "Giving unemployment the balanced-approach weight of 2 instead of 1 fits the Fed's moves worse on every sample (R-squared 0.71 versus 0.77).", "speaker": "Jason Furman", "type": "data_point", "entities": ["Taylor rule"], "conviction": "medium", "so_what": "The Fed's revealed reaction is closer to Taylor 1993 than the balanced-approach rule.", "quote": null, "locator": "Table A1", "quote_verified": false}, {"claim": "Realized-data rules fail because 2012-26 policy was driven by levels: liftoff on a schedule in 2015-18, catch-up of more than four points in 2022-23 while trailing core inflation was already falling, then normalization from a restrictive level.", "speaker": "Jason Furman", "type": "causal", "entities": ["Federal Reserve Board"], "conviction": "medium", "so_what": "Backward-looking inflation rules misread Fed behavior in catch-up periods.", "quote": null, "locator": "The same rule in changes run on the realized data", "quote_verified": false}]}, {"theme": "Fed communication reform", "insights": [{"claim": "Furman wants the Fed to publish the Taylor rule recommendation at every rate-setting meeting rather than only twice a year in the Monetary Policy Report, ideally picking one main reference rule.", "speaker": "Jason Furman", "type": "thesis", "entities": ["Federal Reserve", "Monetary Policy Report"], "conviction": "high", "so_what": "Possible policy change that would make deviations from rule more visible to markets.", "quote": "I would like to see the Fed publish the Taylor rule recommendation at every one of its rate-setting meetings", "locator": null, "quote_verified": true}, {"claim": "A reaction function expressed as a path plus an explanation of how it will adjust with inflation and unemployment surprises is preferable, though it risks perpetuating and compounding errors over time.", "speaker": "Jason Furman", "type": "framework", "entities": ["Federal Open Market Committee"], "conviction": "medium", "so_what": "Path-plus-adjustment communication is better but not error-free.", "quote": null, "locator": "The Bottom Line", "quote_verified": false}, {"claim": "The Fed should explicitly say it is discounting about half a point of the inflation forecast error as transitory and will make up for it with further hikes if wrong, because policymakers and staff know more than the formula and should convey it.", "speaker": "Jason Furman", "type": "prediction", "entities": ["Federal Open Market Com // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
