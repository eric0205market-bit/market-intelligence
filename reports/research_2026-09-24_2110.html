    "idea": "Flash US Composite PMI hit 58.4 (fastest pace in 5+ years), Services 58.7 / Manufacturing 57.0, with input costs and selling prices also jumping \u2014 a stagflationary mix. Separately, GOOGL fell ~5% over two sessions as Meta's Muse gained consumer traction, prompting DeepMind's chief to say Gemini 4 will now launch earlier than year-end.",
    "angle": "A 5-year-high PMI with rising input costs is the same 'growth is fine, inflation isn't dead' story driving the bond selloff in half of today's other items \u2014 and now it's forcing Google's hand on its own product roadmap via competitive panic, not internal readiness.",
    "tweetA": "Flash PMI just hit a 5-year high with input costs rising right alongside it. That's not a soft-landing print, that's a 'growth is fine but inflation isn't done' print \u2014 exactly the combination that's blowing out term premium in bonds elsewhere today.",
    "tweetB": "Google didn't move up the Gemini 4 timeline because the model was ready early. It moved because Meta's Muse app started eating into GOOGL's stock price. When a roadmap decision gets driven by a 5% two-day stock drop instead of engineering readiness, that's competitive panic, not strategy.",

const META = {
  "date": "2026-09-24",
  "time": "21:10 CEST",
  "windowStart": "2026-09-24 15:10 CEST",
  "windowEnd": "2026-09-24 21:10 CEST",
  "emailsInWindow": 28,
  "emailsRead": 27,
  "itemsExtracted": 33,
  "includedSources": [
    "This Week in AI (twiai) - 1",
    "This Week in Startups (twistartups) - 1",
    "Peter Boockvar - 2",
    "Unchained Crypto - 1",
    "McKinsey - 2",
    "The Dark Side of the Boom - 3",
    "Pragmatic Engineer (The Pulse) - 1",
    "blocmates - 3",
    "BEP Research - 1",
    "AI Supremacy - 1",
    "Epoch AI - 1",

  ],

    "Norseman Market Timing x2 (pure trade-execution alerts, zero analytical content)",
    "Capital Flows Research (paywall teaser, zero sentences of actual data/thesis given)"
  ]
};
const CAT_COLORS = {"macro": "#e24b4a", "credit": "#378add", "positioning": "#ef9f27", "AI/infra": "#1d9e75", "crypto": "#7f77dd", "geopolitics": "#d85a30", "energy": "#f97316", "tech": "#06b6d4", "gold": "#d4a017", "culture": "#ec4899", "labor": "#8b5cf6", "regulation": "#64748b", "science": "#14b8a6", "venture": "#84cc16"};
const URGENCY_LABELS = { act: "🔴 Act Now", deep: "🔵 Deep", watch: "🟡 Watch" };
const URGENCY_EMOJI = { act: "🔴", deep: "🔵", watch: "🟡" };

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;
let expanded = {};

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  var btn = event.target;
  var original = btn.textContent;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = original; }, 1500);
}

function toggleCard(id) {
  expanded[id] = !expanded[id];
  render();
}

function setCatFilter(cat) {
  activeCat = cat;
  activeSrc = null;
  render();
}
function setUrgFilter(urg) {
  activeUrg = urg;
  activeSrc = null;
  render();
}
function filterBySrc(name) {
  activeSrc = name;
  activeCat = "all";
  activeUrg = "all";
  expanded = {};
  ITEMS.forEach(function(i) {
    if (i.source.indexOf(name) !== -1) expanded[i.id] = true;
  });
  render();
  var list = document.getElementById('cardList');
  if (list) list.scrollIntoView({behavior: 'smooth', block: 'start'});
}

function buildFilters() {
  var catCounts = {};
  var urgCounts = {};
  ITEMS.forEach(function(i) {
    catCounts[i.cat] = (catCounts[i.cat] || 0) + 1;
    urgCounts[i.urgency] = (urgCounts[i.urgency] || 0) + 1;
  });

  var catHtml = '<button class="pill' + (activeCat === 'all' ? ' active' : '') + '"' +
    (activeCat === 'all' ? ' style="background:#1a1a1a;border-color:#1a1a1a;"' : '') +
    ' onclick="setCatFilter(\'all\')">All (' + ITEMS.length + ')</button>';
  Object.keys(catCounts).sort().forEach(function(cat) {
    var color = CAT_COLORS[cat] || '#888';
    var isActive = activeCat === cat;
    catHtml += '<button class="pill' + (isActive ? ' active' : '') + '"' +
      (isActive ? ' style="background:' + color + ';border-color:' + color + ';"' : '') +
      ' onclick="setCatFilter(\'' + cat + '\')">' + escHtml(cat) + ' (' + catCounts[cat] + ')</button>';
  });
  document.getElementById('catFilters').innerHTML = catHtml;

  var urgOrder = ['act', 'deep', 'watch'];
  var urgHtml = '<button class="pill' + (activeUrg === 'all' ? ' active' : '') + '"' +
    (activeUrg === 'all' ? ' style="background:#1a1a1a;border-color:#1a1a1a;"' : '') +
    ' onclick="setUrgFilter(\'all\')">All (' + ITEMS.length + ')</button>';
  urgOrder.forEach(function(u) {
    if (!urgCounts[u]) return;
    var isActive = activeUrg === u;
    urgHtml += '<button class="pill' + (isActive ? ' active' : '') + '"' +
      (isActive ? ' style="background:#1a1a1a;border-color:#1a1a1a;"' : '') +
      ' onclick="setUrgFilter(\'' + u + '\')">' + URGENCY_LABELS[u] + ' (' + urgCounts[u] + ')</button>';
  });
  document.getElementById('urgFilters').innerHTML = urgHtml;
}

function cardHtml(item) {
  var isOpen = !!expanded[item.id];
  var color = CAT_COLORS[item.cat] || '#888';
  var chartFlag = '';
  if (item.charts && item.charts.hot) chartFlag = '<span class="chart-flag">🔥</span>';
  else if (item.charts && item.charts.count > 0) chartFlag = '<span class="chart-flag">📊</span>';

  var header = '<div class="card-header" onclick="toggleCard(' + item.id + ')">' +
    '<span class="idx">' + String(item.id).padStart(2, '0') + '</span>' +
    '<span class="urg">' + URGENCY_EMOJI[item.urgency] + '</span>' +
    '<span class="src-badge" style="background:' + color + '">' + escHtml(item.source) + '</span>' +
    '<span class="cat-tag">' + escHtml(item.cat) + '</span>' +
    chartFlag +
    '<span class="card-title">' + escHtml(item.title) + '</span>' +
    '</div>';

  var body = '';
  if (isOpen) {
    body += '<div class="card-body">';
    body += '<div class="section-label">The Idea</div><div class="idea-text">' + escHtml(item.idea) + '</div>';
    body += '<div class="section-label">My Angle</div><div class="angle-box" style="border-left:2px solid ' + color + '; background:' + color + '14;">' + escHtml(item.angle) + '</div>';
    body += '<div class="tweets">';
    body += '<div class="tweet-box"><div class="tweet-label" style="color:#378add;">TWEET A</div><div class="tweet-text">' + escHtml(item.tweetA) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    body += '<div class="tweet-box"><div class="tweet-label" style="color:#7f77dd;">TWEET B</div><div class="tweet-text">' + escHtml(item.tweetB) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    body += '</div>';
    if (item.charts && (item.charts.count > 0 || item.charts.desc)) {
      body += '<div class="chart-box' + (item.charts.hot ? ' hot' : '') + '">' + escHtml(item.charts.desc || 'Charts inside — worth opening') + '</div>';
    }
    body += '<a class="read-link" href="' + item.link + '" target="_blank" rel="noopener">↗ Read full article</a>';
    body += '</div>';
  }
  return '<div class="card">' + header + body + '</div>';
}

function render() {
  buildFilters();
  var filtered = ITEMS.filter(function(i) {
    if (activeSrc && i.source.indexOf(activeSrc) === -1) return false;
    if (!activeSrc && activeCat !== 'all' && i.cat !== activeCat) return false;
    if (!activeSrc && activeUrg !== 'all' && i.urgency !== activeUrg) return false;
    return true;
  });
  var list = document.getElementById('cardList');
  var empty = document.getElementById('emptyState');
  if (filtered.length === 0) {
    list.innerHTML = '';
    empty.hidden = false;
  } else {
    empty.hidden = true;
    list.innerHTML = filtered.map(cardHtml).join('');
  }
}

function buildReport() {
  var html = '<b>Window:</b> ' + META.windowStart + ' to ' + META.windowEnd + '. Emails outside this window were not processed.<br>';
  html += '<b>Emails in window:</b> ' + META.emailsInWindow + ' &nbsp; <b>Emails read:</b> ' + META.emailsRead + ' &nbsp; <b>Items extracted:</b> ' + META.itemsExtracted + '<br><br>';
  html += '<b>Included sources:</b><br>';
  META.includedSources.forEach(function(s) {
    var name = s.replace(/\s*-\s*\d+$/, '');
    html += '<span class="src-link" onclick="filterBySrc(\'' + name.replace(/'/g, "\\'") + '\')">' + escHtml(s) + '</span><br>';
  });
  html += '<br><b>Skipped sources:</b><br>';
  META.skippedSources.forEach(function(s) {
    html += escHtml(s) + '<br>';
  });
  document.getElementById('reportBody').innerHTML = html;
}

document.getElementById('headerMeta').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources';
document.getElementById('reportToggle').addEventListener('click', function() {
  var body = document.getElementById('reportBody');
  var chev = document.getElementById('reportChevron');
  body.hidden = !body.hidden;
  chev.textContent = body.hidden ? '▾' : '▴';
});

buildReport();
render();
</script>
