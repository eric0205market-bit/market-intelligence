const ITEMS = [{"id": 1, "cat": "macro", "urgency": "deep", "source": "The Bubble Bubble Report / Bubble Bubble", "title": "CPI 3.7%, PPI 6.3% — the biggest wholesale print since Dec 2022, with the Fed at 3.75–4.00%", "idea": "September CPI printed 3.7% vs 3.6% expected (3.4% in August), driven by energy from the US-Iran war, now in its eighth month. PPI came in at 6.3% vs 5.9% expected, after 5.6% in August — the largest since December 2022. Markets price an 82.8% chance the Fed holds at the Oct 28 FOMC; the Fed is described as more worried about inflation than labor.", "angle": "Policy rate ~3.9% vs CPI 3.7% and PPI 6.3% is a negative-to-flat real rate with a war-driven supply shock. That's the setup where 'hold' is itself easy policy.", "tweetA": "Fed funds 3.75-4.00. PPI 6.3%. A Fed that 'holds' here isn't neutral — it's running real rates near zero into an energy shock. Everyone is debating hike or no hike; the better question is why it's already this loose.", "tweetB": "Wholesale inflation at 6.3% is a margin story before it's a CPI story. Producers eat it or pass it on. Earnings season starts this week — watch who says 'pricing power' and who quietly says 'mix'.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thebubblebubble.substack.com/p/a-precious-metals-and-miners-update-6e6"}, {"id": 2, "cat": "gold", "urgency": "deep", "source": "The Bubble Bubble Report / Bubble Bubble", "title": "Gold shrugged off hot CPI and PPI because the dollar blinked", "idea": "Precious metals sold off after CPI/PPI, then rebounded late in the week as the US Dollar Index pulled back. DXY has been in a rising channel for a year, touching the upper and lower trendlines twice each; the latest attempt to break above failed and it fell back inside. The author's theory: another failed breakout means a bigger dollar pullback and a solid metals rebound.", "angle": "Gold held despite two hot prints and a 5%+ 10y — that is a tell that the metal is trading the dollar and fiscal story, not just real yields.", "tweetA": "Gold rebounded in a week with hot CPI, hot PPI and 10y yields touching 5.3%. If the metal can't be sold on that tape, what exactly is the bear case? A dollar channel failure is the only one left.", "tweetB": "Four touches, one channel, one year of DXY. Failed breakout last week. Either the channel holds and gold re-rates, or it breaks and I'm wrong about everything FX-related. Rare clean binary.", "charts": {"count": 0, "hot": false, "desc": "DXY one-year rising channel chart — worth opening"}, "link": "https://thebubblebubble.substack.com/p/a-precious-metals-and-miners-update-6e6"}, {"id": 3, "cat": "macro", "urgency": "deep", "source": "Seven c Newsletter / Seven c", "title": "Hot data, 10y from 5.33% to 5.09% — stocks are the bond market's pressure valve", "idea": "Core PPI +0.7% m/m vs +0.3% forecast; PPI +1.3% in a single month; retail sales +0.8% vs +0.3%. The 10y spiked to ~5.33% after CPI, then fell to ~5.09% as tech sold off. Fed's Collins: another hike likely before year-end; Goolsbee: more months like this 'unacceptable'.", "angle": "The mechanism: yields only came down because equities broke. That's a loop where bond relief requires equity pain — a very different regime from 2023-24.", "tweetA": "10y fell 24bps in a few sessions and it wasn't a dovish Fed. It was Nasdaq's worst week in 18 months. The bond market just told you what it needs to rally: your stocks to fall.", "tweetB": "Collins says another hike before year-end. Futures say Fed holds on Oct 28. Both can be true only if the November/December meetings carry the risk. Where is the vol priced — October or December?", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-190"}, {"id": 4, "cat": "credit", "urgency": "deep", "source": "Seven c Newsletter / Seven c", "title": "US deficit $1.99T, interest bill $1.36T — 18% of spending just to roll the debt", "idea": "FY2026 deficit $1.99T, the biggest in five years. Interest cost is a record $1.36T (+12% y/y), outlays a record $7.4T vs receipts $5.4T. (Note: The Pressure Point cites net interest of $1.05T — different definition, gross vs net.)", "angle": "Interest is now ~18% of outlays and 25% of receipts ($1.36T / $5.4T). That's the number that makes 'hold rates high' a fiscal event, not just a monetary one.", "tweetA": "$1.36T interest on $5.4T of revenue. A quarter of every tax dollar goes to bondholders before a single missile, pension or road. 'Higher for longer' has a budget line now.", "tweetB": "Two sources, two interest numbers: $1.36T gross vs $1.05T net. The $310B gap is intragovernmental holdings. Use whichever fits your narrative — but know which one you're quoting.", "charts": {"count": 0, "hot": false, "desc": "Deficit/interest chart likely in the article"}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-190"}, {"id": 5, "cat": "crypto", "urgency": "deep", "source": "Seven c Newsletter / Seven c", "title": "Banks down six weeks straight — and bolting on crypto rails anyway", "idea": "US bank stocks logged six straight weekly losses, longest since 2008, blamed on sticky inflation, higher-for-longer and AI/deposit disruption. Meanwhile Schwab opened BTC and ETH trading to all clients, Visa Direct put USDC funding into live production, and the BIS said stablecoins now compete directly with bank deposits.", "angle": "Incumbents are not fighting stablecoins, they're distributing them. Deposit-franchise erosion plus distribution by the incumbent is the endgame for payment rails.", "tweetA": "Banks: -6 weeks, worst streak since 2008. Schwab: BTC/ETH for everyone. Visa: USDC funding live. The BIS says stablecoins compete with deposits. The deposit moat is being sold by the people standing on it.", "tweetB": "Nobody is asking who pays for the deposit outflow. If stablecoin balances are backed by T-bills while 10y yields are 5%+, issuers are quietly becoming the marginal Treasury buyer. $CRCL $SCHW $V", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-190"}, {"id": 6, "cat": "AI/infra", "urgency": "deep", "source": "Seven c Newsletter / Seven c", "title": "Anthropic: Q3 revenue $16.8B, +45% q/q — while the IPO filing warns of 'existential risks'", "idea": "Anthropic told investors Q3 revenue hit $16.8B, up 45% from Q2. The same company's IPO filing warns AI could pose existential risks to humanity. Nasdaq 100 had its worst week in 18 months while this was disclosed.", "angle": "$16.8B a quarter is a ~$67B annualized run rate, +45% q/q compounds to ~4.4x in a year. Market is selling the AI complex on financing while the labs' revenue is accelerating.", "tweetA": "$16.8B in one quarter, +45% q/q. Nasdaq has its worst week in 18 months on the same news cycle. Either revenue is the wrong thing to watch, or the sell-off is about who pays for the compute, not who uses it.", "tweetB": "+45% q/q compounds to roughly 4.4x a year. If even half of that repeats, the question stops being 'is AI real' and becomes 'who can fund the capex fast enough to serve it'.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://sevenc.substack.com/p/seven-c-newsletter-190"}, {"id": 7, "cat": "energy", "urgency": "deep", "source": "MacroEdge Oil & Gas / MacroEdge", "title": "The back of the oil curve re-rated: CLZ2027 above $80, summer above $90", "idea": "The author highlights that the back end of the Brent/WTI curves has pushed Dec-2027 WTI well above $80/bbl and summer prices above $90 — which he reads as validation of a 'higher for longer' re-rating and a new floor. Demand destruction isn't visible; governments keep subsidizing demand, and consumers conditioned to higher prices can create a structural higher base. The SPR is being run toward Congressionally mandated minimums, with a fuel emergency declaration seen as eventual.", "angle": "The back-end bid is the signal: spot spikes are noise, but 2027 at $80+ means the market is pricing a regime, which flows into E&P capital allocation and inflation expectations.", "tweetA": "Spot oil is a headline. Dec-2027 WTI above $80 is a regime. When the back of the curve moves, it's not fear — it's capex and inflation expectations resetting. $XLE $OXY", "tweetB": "SPR heading to statutory minimums while the President 'retains nuclear options' means the policy put under oil is running out of strikes. What's the next lever after the last barrel is gone?", "charts": {"count": 0, "hot": true, "desc": "'Chart of the day' on Caracas/Venezuela headwinds plus curve charts — 🔥 CHART WORTH SAVING"}, "link": "https://macroedgeenergy.substack.com/p/oil-and-gas-research-weekly-energy-4b7"}, {"id": 8, "cat": "geopolitics", "urgency": "act", "source": "MacroEdge Oil & Gas / MacroEdge", "title": "Iran now 'effectively controls' both Hormuz and Bab-el-Mandeb — attacks at highest since March", "idea": "Strait attacks hit their highest level since March this week; IRGC forces/proxies are now targeting tugs and other civilian ships. The author says Iran effectively controls both Hormuz and Bab-el-Mandeb, giving extensive control over global oil/products. Lavrov visits GCC countries and Iran this week; the author floats a non-zero chance of Egypt deploying troops to Saudi, and expects IRGC attacks to peak for maximum US midterm impact.", "angle": "Two chokepoints plus a Russian diplomatic visit is a different risk than a single-strait closure. The midterm timing claim is speculative but worth tracking.", "tweetA": "Hormuz and Bab-el-Mandeb are both contested at once. Insurance, rerouting and tanker rates price the first; nobody has a model for the second. Lavrov is touring the Gulf this week. Watch freight before you watch Brent.", "tweetB": "Midterms on Nov 3. An adversary that reads US gasoline at $4.33 as a political lever has every incentive to peak attacks in the last two weeks. That's the geopolitical calendar the oil curve is quietly pricing.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://macroedgeenergy.substack.com/p/oil-and-gas-research-weekly-energy-4b7"}, {"id": 9, "cat": "energy", "urgency": "deep", "source": "MacroEdge Oil & Gas / MacroEdge", "title": "Tier-1 shale inventory is a few years deep — 'don't blow through reserves'", "idea": "The author warns that policymakers are complacent in the shale era: ramping drilling to bring down prices would burn through Tier-1 inventory in basins (Bakken, Eagle Ford) that already have only a few years left. Comparison to the 1970s re-rating is made explicitly.", "angle": "The shale 'swing producer' assumption is the hidden leg of every oil bear case; if inventory is the constraint, supply response is weaker than curves assume.", "tweetA": "The oil bear case assumes shale answers every price spike. Tier-1 inventory in the Bakken and Eagle Ford is measured in years, not decades. Drilling harder at $100 just moves the cliff closer.", "tweetB": "1970s: policymakers assumed supply would respond. Today's version: shale will respond. Same complacency, different geology.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://macroedgeenergy.substack.com/p/oil-and-gas-research-weekly-energy-4b7"}, {"id": 10, "cat": "positioning", "urgency": "deep", "source": "Paulo Macro / Paulo", "title": "Oil positioning: traders are resisting the rally — a recommit could push prices much higher", "idea": "The author notes that positioning data keep showing traders resisting capitulation into the oil rally, and if they recommit to longs, prices could move 'substantially higher'. He also flags developments over the past week that suggest a possible regime shift in crude as geopolitical risks expand. The email preview shows only the setup; positioning detail is in the article.", "angle": "Under-positioned into a physical squeeze with $100+ Brent is the asymmetry. The article has charts on CFTC/physical markets.", "tweetA": "Brent ~$110 and positioning still isn't chasing. That's the unusual part. A rally nobody owns has the fuel for a second leg.", "tweetB": "When a market makes new highs and speculators are still hedged, the next move isn't about conviction — it's about forced covering. Watch the roll yields before the headlines.", "charts": {"count": 0, "hot": false, "desc": "Positioning/physical charts inside — worth opening"}, "link": "https://paulomacro.substack.com/p/a-regime-change-in-oil"}, {"id": 11, "cat": "macro", "urgency": "deep", "source": "Tavi Costa / Crescat", "title": "'A decade of sticky inflation' — and central banks forced to cut anyway", "idea": "Costa's thesis: last week's inflation data reinforce that sticky inflation could last a decade, yet central banks will eventually have to cut rates to keep government borrowing costs manageable. The combination, he argues, has profound implications for hard assets. (Preview only; full report behind the link.)", "angle": "This is fiscal dominance in one sentence. Real yields negative by design is the bull case for hard assets, regardless of what the Fed says in October.", "tweetA": "Inflation 3.7%, interest bill $1.36T, 10y above 5%. Tavi's call: central banks cut anyway because they must. That's not a policy choice, that's arithmetic. $GLD $GDX", "tweetB": "The market debates hike vs hold. Costa is pointing at the endgame: cut into inflation to protect the Treasury. If he's right, the October dots matter far less than the 2027 deficit.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://tavicosta.substack.com/p/a-decade-of-sticky-inflation"}, {"id": 12, "cat": "credit", "urgency": "act", "source": "The Pressure Point / Fulcrum", "title": "'America exports the first margin call' — the safe-haven issuer weakens, the borrowers break", "idea": "With a $1.992T deficit, debt above $40T and a 10y that spent time above 5%, the thesis is that the next dollar-debt crisis hits foreign dollar borrowers first. High yields raise their cost while each flight to safety pulls capital back to the dollar. The peso fell in the latest flight to quality. Fed research this week studies persistence of the safe-haven property of government bonds amid inflation pressure.", "angle": "The inversion: a weak issuer doesn't weaken the currency in a panic, it strengthens it. EM FX is where stress shows first.", "tweetA": "The US can deteriorate for years while its borrowers abroad run out of dollars in months. The peso sold off in a flight to quality while US fiscal fears were the cause. Safe-haven status is relative, not absolute.", "tweetB": "1975-82: Latin American bank debt grew 20.4% a year, $75B to $315B. Then Volcker. The 2026 version is not syndicated loans, it's dollar corporate and sovereign debt in places with a 5% risk-free rate above it.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-the-safest-asset-exports-panic/"}, {"id": 13, "cat": "credit", "urgency": "deep", "source": "The Pressure Point / Fulcrum", "title": "1982 playbook: refinancing, not stock of debt, set the timing", "idea": "Latin American external debt rose from $75B in 1975 to more than $315B in 1983, roughly half the region's GDP; growth 20.4% a year in bank debt 1975-82. Volcker's tightening, falling commodity prices and Mexico's August 1982 moratorium converted a slow deterioration into an immediate cash demand when banks stopped rolling loans. The author notes today's stress would appear in currencies, corporate credit and public finances rather than one bank rollover.", "angle": "Short maturities + dollar liabilities + a risk-free rate reset higher is the same pattern. Watch maturities and issuance terms, not headline debt.", "tweetA": "The 1982 crisis didn't start when debt got too big. It started when banks stopped rolling it. Watch the next EM dollar issuance for shorter tenors and bigger concessions — that's the first hard evidence.", "tweetB": "Mexico borrowed in dollars against oil revenue. Oil fell, the loans stayed. 2026 flips the commodity but not the structure: who is short dollars, and who has no printing press for them?", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-the-safest-asset-exports-panic/"}, {"id": 14, "cat": "positioning", "urgency": "act", "source": "The Pressure Point / Fulcrum", "title": "The tell: 10y yield rising while risk assets fall means the safe asset itself is in question", "idea": "The author's watchlist for the week: (1) peso and liquid EM FX at the first open — a further decline alongside Treasury buying confirms fiscal fear reinforcing dollar demand; (2) whether the 10y rises while risk assets fall, which would signal investors questioning the safe asset; (3) sovereign issuance terms — shorter maturities, postponed dollar issuance or large concessions.", "angle": "A clean three-signal dashboard for the week: EM FX, 10y vs equities correlation, sovereign deal terms.", "tweetA": "One chart decides whether this is a dollar story or a Treasury story: 10y yield vs Nasdaq. Yield down with stocks down is fine. Yield up with stocks down is the market repricing the safe asset. Last week was the first. Monday's the test.", "tweetB": "Everyone has the 5% on their screens. Nobody has the correlation. If bonds and equities sell off together on a down-tape day, the 'Treasuries are the haven' trade has a hole in it.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-the-safest-asset-exports-panic/"}, {"id": 15, "cat": "geopolitics", "urgency": "act", "source": "The Pressure Point / Fulcrum", "title": "France: 1,800+ arrests as cost-of-living and schools protests turn violent", "idea": "French police arrested at least 1,800 people after nationwide cost-of-living and schools protests turned violent with looting; Macron planned an emergency meeting and national address. Dark Side of the Boom also cites French unrest as a background bid for havens, and TMAD notes protests spreading across Europe and the US ahead of midterms.", "angle": "Three separate newsletters describe the same social-stress backdrop. French spreads and the franc/Bund are the transmission.", "tweetA": "1,800 arrests in one night in France, an emergency address from Macron, and OAT spreads that already carry a political premium. Euro risk this week is not just about the ECB.", "tweetB": "US protests ahead of the midterms, France in the streets, Europe spreading. The market prices rates and AI. Social stress is the third variable nobody has a factor for.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-the-safest-asset-exports-panic/"}, {"id": 16, "cat": "credit", "urgency": "deep", "source": "The Pressure Point / Fulcrum", "title": "Partners Group uses restrictive covenants to wall off €6B of 2028 refinancing from distressed funds", "idea": "Partners Group is using restrictive loan covenants to deter distressed-debt funds from three portfolio companies facing repayments in 2028, while extending unitranche to Delabo Group.", "angle": "Private-credit managers are building defensive moats against the very buyers who show up in a downturn. That is a signal that they expect a downturn.", "tweetA": "Private credit is writing covenants whose job is to keep distressed buyers out. That is not what confidence looks like. It's pre-emptive protection for a 2028 wall.", "tweetB": "Distressed funds exist to buy the stress. When managers contractually block them, the loss recognition just moves later, and larger.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-the-safest-asset-exports-panic/"}, {"id": 17, "cat": "geopolitics", "urgency": "deep", "source": "The Pressure Point / Fulcrum", "title": "Russian diesel deal, St Petersburg's largest-ever drone attack, and Starlink throttling", "idea": "Trump aides gave conflicting rationales for a Russian diesel deal facing bipartisan criticism, with oil exports continuing to finance Russia. St Petersburg suffered its largest Ukrainian drone attack with smoke at an oil terminal. Bessent criticized Zelensky over claims the US throttled Ukraine's military Starlink access.", "angle": "US fuel prices are pulling US policy toward Russia while Ukraine hits Russian energy infrastructure. Diesel is the bridge.", "tweetA": "The US wants cheaper diesel, Ukraine is bombing Russian oil terminals, and Washington is negotiating a diesel deal with Moscow. Energy policy is now foreign policy by invoice.", "tweetB": "Starlink throttling plus a Russian diesel deal in the same week. Whatever the intent, the market will read it as the US prioritizing the pump price over the front line.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-the-safest-asset-exports-panic/"}, {"id": 18, "cat": "AI/infra", "urgency": "act", "source": "Dark Side of the Boom", "title": "'Will growth take care of the financing?' — credit spreads, not yields, are the AI risk", "idea": "70+ S&P 500 companies report this week including Tesla and Meta. Semiconductors posted their longest losing streak since 2008, the Nasdaq shed ~5%, S&P is barely off highs. Argument: equities can live with expensive money, but widening credit spreads in the sectors funding AI compute and infrastructure are a different animal — 'a world of difference between expensive money and reluctant money'.", "angle": "Treasury yields raise the hurdle; credit spreads decide if the borrower can clear it. The AI financing chain (neoclouds, data-center ABS) is where to look.", "tweetA": "Semis: longest losing streak since 2008. Nasdaq: -5%. S&P: still near highs. The tell isn't equities, it's HY and data-center credit. Equity can price expensive money. It can't price reluctant money. $META $CRWV", "tweetB": "Earnings this week answer 'is AI demand real'. The credit market asks 'who funds the next $100B'. Those are different questions with different answers, and only one is cheap to ignore.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/asia-open-the-tape-finds-a-stabilizer"}, {"id": 19, "cat": "positioning", "urgency": "act", "source": "Dark Side of the Boom", "title": "The pain trade — long AI, short bonds — broke last week because both legs shared one driver", "idea": "For months, AI capex supported growth, growth kept inflation sticky, and sticky inflation kept yields high — so long AI / short bonds worked as one trade. Last week AI stumbled, bonds rallied and the trade behaved like a trapdoor. Monday's bounce reads as short covering and position repair rather than conviction; the Fed shifted from 'October live' to 'probably not'.", "angle": "A positioning trade with a single hidden factor. When the factor flips, both legs lose at once.", "tweetA": "Long AI / short bonds was never two trades. It was one trade on 'growth outruns everything'. Last week it paid out the wrong way on both legs. How many portfolios call that diversification?", "tweetB": "Short covering on a Monday open is not conviction. Look for the first day semis rise on rising volume AND credit spreads tighten. Until then it's a bounce.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/asia-open-the-tape-finds-a-stabilizer"}, {"id": 20, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom", "title": "FX safe-haven relationships being 'rearranged, not abandoned'", "idea": "The dollar is mixed against majors rather than dominant. Lower Treasury yields help the yen, the franc remains a defensive beneficiary, and the dollar is more sensitive to the US exceptionalism trade. Unrest in France and European tension keep a background bid under havens. Brent eased toward the low $108s, vs ~$110 Friday close cited elsewhere.", "angle": "If AI wobbles, the dollar no longer wins automatically — it is the same exceptionalism trade as US tech.", "tweetA": "The dollar was a haven AND a long-AI proxy. Those are now in conflict. Last week: yen, franc up, USD mixed. The next risk-off may not be a dollar rally.", "tweetB": "One more place where the AI trade is leaking: FX. If USD behaves like a tech stock, who is the haven? CHF and JPY are small buckets for this much capital.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/asia-open-the-tape-finds-a-stabilizer"}, {"id": 21, "cat": "macro", "urgency": "watch", "source": "Speedrun / Pequity Research", "title": "Iran: 'no nuclear weapons, open to talks' — and lawmakers say they need them", "idea": "Mixed Iran signals over the weekend: Iran claims no nuclear weapons and openness to talks, while lawmakers say Iran needs nuclear weapons. Iran reportedly made an offer on re-opening the Strait of Hormuz, but US acceptance looks unlikely. Gas prices remain elevated and Strait traffic is described as non-existent.", "angle": "The offer exists but is unlikely accepted — that's an oil optionality that is both bullish (no deal) and a source of downside gap risk (a deal).", "tweetA": "A Hormuz offer on the table that the US is expected to reject. That's two-sided gap risk in crude: the base case is no deal, but a surprise yes takes $15 off Brent in a session.", "tweetB": "Iranian lawmakers calling for nuclear weapons while the foreign ministry says it has none. That's not confusion, it's a negotiating structure. Price accordingly.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://pequityresearch.substack.com/p/speedrun-upcoming-events-this-week-85f"}, {"id": 22, "cat": "tech", "urgency": "watch", "source": "Speedrun / Pequity Research", "title": "Earnings week: $META, $LRCX, $TXN Wednesday; $NOK, $BE, $MXL, $WDC Thursday", "idea": "This week's AI-heavy calendar: Tuesday $SPCX; Wednesday $META, $LRCX, $TXN; Thursday $NOK, $BE, $MXL, $WDC. No significant economic report outside Friday jobless claims.", "angle": "LRCX (equipment), WDC (storage), BE (power) and MXL (interconnect) cover the whole AI supply chain on one calendar. TXN is the analog read.", "tweetA": "Meta and LRCX on the same night: one tells you how much capex continues, the other tells you who gets it. Then BE, WDC, MXL a day later. The AI-supply-chain read is Wednesday-Thursday.", "tweetB": "A light macro calendar means earnings drive the tape. After semis' worst streak since 2008, the bar is lower, but credit is the swing factor.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://pequityresearch.substack.com/p/speedrun-upcoming-events-this-week-85f"}, {"id": 23, "cat": "positioning", "urgency": "watch", "source": "TMAD Weekly / Trading Mindset and Data", "title": "'Mega caps in fear mode' — market headed to the 100DMA", "idea": "The author sees the market heading toward the 100-day moving average amid protests in the US ahead of midterms and unrest in Europe, expects further weakness, and added a FEAR indicator alongside the FOMO indicator on his scanner (tickers include $MSFT, $GOOGL, $BABA). Detailed levels are paywalled.", "angle": "Mega-cap fear lists are a contrarian input only if credit confirms; the thin preview only supports the political/technical framing.", "tweetA": "Mega caps showing up on a FEAR scanner is where bounces start — if credit cooperates. Otherwise it's just a 100DMA test.", "tweetB": "Political division, protests in the US and Europe, midterms Nov 3. The market treats it as noise until it isn't. How do you hedge a variable with no ticker?", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.tmad.news/p/tmad-weekly-mega-caps-in-fear-mode"}];

var COL={macro:'#e24b4a',credit:'#378add',positioning:'#ef9f27','AI/infra':'#1d9e75',crypto:'#7f77dd',geopolitics:'#d85a30',energy:'#f97316',tech:'#06b6d4',gold:'#d4a017',culture:'#ec4899',labor:'#8b5cf6',regulation:'#64748b',science:'#14b8a6',venture:'#84cc16'};
var UE={act:'🔴',deep:'🔵',watch:'🟡'},UN={act:'🔴 Act Now',deep:'🔵 Deep',watch:'🟡 Watch'};
var fc='all',fu='all',fs=null;
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pills(){
  var cs={};ITEMS.forEach(function(i){cs[i.cat]=(cs[i.cat]||0)+1;});
  var h='<span class="pill'+(fc==='all'?' on':'')+'" style="'+(fc==='all'?'background:#333':'')+'" onclick="setC(\'all\')">All '+ITEMS.length+'</span>';
  Object.keys(cs).forEach(function(c){var on=fc===c;h+='<span class="pill'+(on?' on':'')+'" style="'+(on?'background:'+COL[c]:'')+'" onclick="setC(\''+c+'\')">'+c+' '+cs[c]+'</span>';});
  document.getElementById('cats').innerHTML=h;
  var us={act:0,deep:0,watch:0};ITEMS.forEach(function(i){us[i.urgency]++;});
  h='<span class="pill'+(fu==='all'?' on':'')+'" style="'+(fu==='all'?'background:#333':'')+'" onclick="setU(\'all\')">All</span>';
  ['act','deep','watch'].forEach(function(u){h+='<span class="pill'+(fu===u?' on':'')+'" style="'+(fu===u?'background:#333':'')+'" onclick="setU(\''+u+'\')">'+UN[u]+' '+us[u]+'</span>';});
  document.getElementById('urg').innerHTML=h;
}
function card(item){
  var c=COL[item.cat]||'#888';
  var h='<div class="card" id="c'+item.id+'"><div class="hd" onclick="this.parentNode.classList.toggle(\'open\')"><span class="num">'+item.id+'</span><span>'+UE[item.urgency]+'</span><span class="badge" style="background:'+c+'">'+esc(item.source)+'</span><span class="tag">'+esc(item.cat)+'</span>'+(item.charts.hot?'<span>🔥</span>':(item.charts.count?'<span>📊</span>':''))+'<span class="ttl">'+esc(item.title)+'</span></div><div class="body">';
  h+='<div class="lbl">The Idea</div><div>'+esc(item.idea)+'</div>';
  h+='<div class="lbl">My Angle</div><div class="angle" style="border-color:'+c+';background:'+c+'14">'+esc(item.angle)+'</div>';
  h+='<div class="tw"><div><div class="lbl" style="color:#378add">Tweet A</div>'+esc(item.tweetA)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  h+='<div><div class="lbl" style="color:#7f77dd">Tweet B</div>'+esc(item.tweetB)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>';
  h+='<div class="chart'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING — ':'📊 ')+esc(item.charts.desc||'No chart in email')+'</div>';
  h+='<div style="margin-top:8px"><a href="'+item.link+'" target="_blank" rel="noopener">↗ Read full article</a></div></div></div>';
  return h;
}
function render(){
  var h='';ITEMS.forEach(function(i){
    if(fc!=='all'&&i.cat!==fc)return;if(fu!=='all'&&i.urgency!==fu)return;
    if(fs&&i.source.indexOf(fs)<0)return;h+=card(i);});
  document.getElementById('cards').innerHTML=h;pills();
  if(fs){document.querySelectorAll('.card').forEach(function(e){e.classList.add('open');});}
}
function setC(c){fc=c;fs=null;render();}
function setU(u){fu=u;fs=null;render();}
function filterBySrc(name){fs=name;fc='all';fu='all';render();}
function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';
  var r='<p><b>Window:</b> '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</p><p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</p><p><b>Included:</b></p><ul>';
  META.includedSources.forEach(function(s){r+='<li><span class="src" data-n="'+esc(s.name)+'">'+esc(s.name)+'</span> — '+s.items+'</li>';});
  r+='</ul><p><b>Skipped:</b></p><ul>';
  META.skippedSources.forEach(function(s){r+='<li>'+esc(s.name)+' — '+esc(s.reason)+'</li>';});
  r+='</ul><p><span class="src" data-n="">Clear source filter</span></p>';
  document.getElementById('repin').innerHTML=r;
  document.getElementById('repin').addEventListener('click',function(e){var n=e.target.getAttribute&&e.target.getAttribute('data-n');if(n===null)return;if(n==='')setC('all');else filterBySrc(n);});
  render();
}
init();
