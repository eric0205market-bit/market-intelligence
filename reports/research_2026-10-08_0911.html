<script>
const ITEMS = [{"id": 1, "cat": "positioning", "urgency": "act", "source": "Goldman (Shawn Tuteja) via Dark Side of the Boom (Substack)", "title": "Goldman's derivatives desk: 'The AI trade worked too well' — the cheap-optionality window has closed", "idea": "Two months ago Goldman's derivatives desk saw light AI positioning and cheap upside optionality. That asymmetry is gone: mega-caps still carry the index while the rest of the market diverges, and higher yields are changing where investors hide. Goldman now prefers broader upside over the same AI leaders; breadth is the tell.", "angle": "Positioning has flipped from under-owned to crowded in ~8 weeks. Pairs with Authers' point that AI is >50% of S&P EPS growth, so breadth is the only real hedge.", "tweetA": "The AI trade was an options-pricing story before it was an earnings story. Cheap upside was the whole edge. Two months later Goldman's own desk says the edge is gone. What do you own when the free optionality is already in the price? $NVDA $SPY", "tweetB": "If breadth has to show up for the rally to keep running, the test isn't another NVDA beat. It's whether equal-weight stops lagging with the 10Y near 5.3%. I'd watch $RSP/$SPY before I watch any single print.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/goldmans-shawn-tuteja-the-ai-trade"}, {"id": 2, "cat": "AI/infra", "urgency": "act", "source": "Samsung earnings via Dark Side of the Boom (Substack)", "title": "Samsung prints 107.4tn won operating profit (~$80B, ~9x y/y) and the stock barely moves", "idea": "Q3 operating profit hit a record Won107.4tn on Won195tn sales, up almost ninefold. Shares are still 20-25% below the June peak despite more than doubling YTD. Standard DRAM contract prices are forecast +10-20% q/q in Q4. The debate has moved from the quarter to its shelf life.", "angle": "Classic 'good news is priced' tell for the memory complex. Matters for $MU, SK Hynix, and the whole AI-capex supply chain: the burden of proof is now duration, not demand.", "tweetA": "$80B of operating profit in ONE quarter and the stock is 20%+ below its June high. That's a market saying 'we believe the numbers, we don't believe the duration.' Memory has never once been priced on the plateau. $MU", "tweetB": "Samsung's quarterly op profit is now roughly the annual net income of a large-cap bank. A cyclical doing that with a flat reaction function is either the best entry of the cycle or the most honest top signal I've seen. I don't think the market can tell yet.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/samsungs-80-billion-quarter-is-no"}, {"id": 3, "cat": "AI/infra", "urgency": "deep", "source": "Samsung earnings via Dark Side of the Boom (Substack)", "title": "Memory is going from spot-driven cycle to long-term contracts at rising prices", "idea": "A growing share of memory supply is locked into longer-term agreements with AI customers, with new contracts reportedly priced above existing ones. Thesis: peak may not need to be higher if the plateau lasts longer, making memory look more like an AI-buildout toll booth. HBM4 progress is also closing Samsung's gap to SK Hynix.", "angle": "If contracts replace spot as the pricing mechanism, memory multiples have to be re-rated or the contracts are the thing that breaks. Worth checking which one the market is assuming.", "tweetA": "Memory used to be the one chip business where you could short the top by watching spot. If hyperscalers are signing multi-year contracts at HIGHER prices, you've replaced a spot commodity with a take-or-pay. The multiple question is entirely about counterparty risk now. $MU $000660.KS", "tweetB": "Take-or-pay contracts work great until the buyer's financing changes. The same hyperscalers signing memory contracts are the ones issuing record debt to fund capex. Memory's 'toll booth' is only as good as the road's funding. Who's underwriting the road?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/samsungs-80-billion-quarter-is-no"}, {"id": 4, "cat": "AI/infra", "urgency": "deep", "source": "Samsung earnings via Dark Side of the Boom (Substack)", "title": "Samsung is running two economic cycles under one roof: chips +, phones/appliances losing >1tn won", "idea": "Analysts estimate smartphone and home-appliance businesses lost more than Won1tn combined operating profit last quarter as component inflation hits finished goods. The won also appreciated more than 14% vs USD in the quarter, the biggest quarterly gain since the late 1990s, and Samsung still posted a record.", "angle": "Memory inflation is a tax on every device maker. Second-order read-through to Apple, Xiaomi and PC OEM margins; and a 14% FX move masked by a chip windfall.", "tweetA": "The memory boom has a victim and it's inside the same company. Samsung's own phone and appliance divisions lost 1tn+ won because of Samsung's own chip prices. If it can't pass costs through, who can? Watch $AAPL and PC OEM gross margin guides.", "tweetB": "Won +14% in a quarter, best since the late 1990s, and Samsung STILL printed a record. Strip the FX and the chip engine is even stronger. Now ask what happens to Korea's earnings when the won move reverses.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/samsungs-80-billion-quarter-is-no"}, {"id": 5, "cat": "positioning", "urgency": "act", "source": "Goldman flow work via Dark Side of the Boom (Substack)", "title": "Kospi's buyer of last resort — Samsung's own buyback — has rolled off", "idea": "Since Korean retail abandoned the Kospi after the mid-summer drop, the real marginal buyer was the companies themselves. Goldman maps how fast Samsung and SK Hynix burned through repurchase programs. Thursday stacks Samsung prelims, a semiconductor ETF rebalance, options expiry and the first full session in roughly two months without Samsung bidding its own stock. Foreign selling has not stopped.", "angle": "Good case study in a corporate bid masquerading as a market floor. Same pattern to watch in US mega-cap buyback blackout windows during earnings.", "tweetA": "For two months the Kospi's biggest buyer was Samsung buying Samsung. Today is the first session without it, on earnings, ETF rebalance AND options expiry. That's not a stress test, that's a controlled demolition of the corporate bid. $EWY", "tweetB": "Buyback-supported floors always look like fundamentals until the program ends. Same question for US mega-caps in blackout season: how much of the 'resilience' is the issuer on the bid?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/when-samsung-stops-buying-the-kospi"}, {"id": 6, "cat": "macro", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "Q2 S&P earnings +33% y/y; Deutsche sees Q3 at +34% vs consensus +27%", "idea": "Q2 hit record 33% y/y earnings growth, unprecedented outside recoveries from outright declines. Deutsche's Bankim Chadha sees Q3 at 34% versus 27% consensus, so another above-average beat quarter. AI infrastructure beneficiaries account for over 50% of S&P 500 EPS growth, alongside hyperscaler capex growth of 116%. Big banks open the season Tuesday.", "angle": "The bull case in one paragraph: yields up, stocks fine because earnings are real. But if half of EPS growth is one capex cycle, the beat has to come from the same place.", "tweetA": "S&P earnings +33% y/y with the 10Y at 5.3% and the market is fine. Half of that growth is AI infrastructure and hyperscaler capex is +116%. The index isn't pricing earnings. It's pricing one capex budget. $SPY", "tweetB": "Consensus 27%, Deutsche 34%. The beat is already the base case. When 'beat' is the base case, the setup for a miss gets asymmetric. I'd rather own the dispersion than the index into banks on Tuesday.", "charts": {"count": 3, "hot": true, "desc": "Rolling annual change in trailing-12M EPS plus quarter-vs-year-ago growth: current boom unlike anything outside post-crash rebounds. BCA chart of TTM EPS by sector shows how much is AI, especially outside US."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-08/spectacular-earnings-growth-may-not-be-enough-to-keep-the-stock-rally-going"}, {"id": 7, "cat": "macro", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "US corporate profit share of GDP is above 1929 on NIPA; long-term EPS expectations are a contrarian signal", "idea": "SocGen: no long-term earnings forecasts exist for 150 STOXX 600 names, and across the STOXX 600, high long-term EPS growth expectations precede negative 12-month returns while low expectations precede strong ones. Authers notes margins were mean-reverting through the 20th century but have only risen this century; NIPA profits' share of the economy exceeds the eve of the 1929 crash, and is likely higher now given the lag.", "angle": "The mean-reversion question for margins is the single largest assumption in every equity multiple. Labor-share politics into midterms is the mechanism.", "tweetA": "Profit share of GDP is above 1929 on NIPA data. For a century, margins were a textbook mean-reverting series. Since 2000 they only go up. Either the regime changed (AI, scale, labor weakness) or the next recession does the mean-reversion in one move.", "tweetB": "SocGen found high long-term EPS growth expectations in Europe predict NEGATIVE 12M returns. Everyone is extrapolating AI profits into the 2030s. The signal says the crowd is usually most confident right before it's wrong.", "charts": {"count": 2, "hot": true, "desc": "NIPA corporate profits as share of GDP vs 1929 peak; profit margin series rising through the century. Worth saving."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-08/spectacular-earnings-growth-may-not-be-enough-to-keep-the-stock-rally-going"}, {"id": 8, "cat": "macro", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "Consumer paradox: sentiment at 12-year low, retail sales up, 20% of households do 40% of spending", "idea": "Conference Board confidence hit a 12-year low, NY Fed 1-year inflation expectations hit 3.9% (three-year high), diesel and gasoline are up at least 50% this year and the 30-year mortgage is 7.38%. Retail sales still posted their biggest jump since March. Oxford's Pearce: about 40% of spending comes from 20% of households and sentiment is population-weighted not spending-weighted. Atlanta Fed: bottom-quartile wage growth has lagged top-quartile for almost two years.", "angle": "The sentiment/spend gap is a weighting artifact. K-shape narrowing (per BofA) is the risk: energy costs could reverse it and feed food inflation.", "tweetA": "Consumer confidence at a 12-year low and retail sales at their best in 6 months. Both are true because 20% of households do 40% of the spending and sentiment polls count heads, not dollars. The market is trading the top quintile's wallet. $XRT $XLY", "tweetB": "Bottom-quartile wage growth has trailed the top for nearly two years. That is historically unusual. Add diesel +50% and a 7.4% mortgage into midterms and you don't need a recession for affordability to become the only issue. It's already one.", "charts": {"count": 6, "hot": false, "desc": "NY Fed inflation expectations, retail sales, BofA K-shape spending gap, staples vs discretionary, Atlanta Fed wage tracker by quartile."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-08/spectacular-earnings-growth-may-not-be-enough-to-keep-the-stock-rally-going"}, {"id": 9, "cat": "macro", "urgency": "act", "source": "John Authers / Bloomberg Points of Return", "title": "FOMC minutes: unanimous hike in September, 'not restrictive or only mildly restrictive', 96.4% odds of one more", "idea": "The September minutes show hawkish unity. A number of participants wanted a higher path based on modal outlooks, not risk management; several saw policy as not restrictive or only mildly so; most saw another hike appropriate by year-end. Oxford's word-diffusion index shows risks skewed to inflation more than any time since 2008, even though inflation is far below 2022. 10Y hit 5.36% intraday, settled 5.28%. French bonds gave back nearly all of the week's gains; oil shipping costs hit new highs on Hormuz snarls.", "angle": "Modal-outlook language is the key change: this isn't insurance hikes, it's the base case. Cross-check with French OAT stress and ECB.", "tweetA": "Fed minutes: hikes are now the MODAL outlook, not risk management. 96% priced for one more and a handful of participants think policy is barely restrictive. With the 10Y at 5.3% that tells you which side of the curve is getting the next repricing. $TLT", "tweetB": "The Fed is hiking into a 7.4% mortgage rate, soft payrolls and a French bond market that gave back its entire week. Hawkish unity at the Fed plus fragmentation in Europe is not a stable pair. Somebody's curve breaks first.", "charts": {"count": 4, "hot": false, "desc": "Oxford Economics FOMC minutes diffusion index (inflation vs employment risk skew), NY Fed inflation expectations."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-08/spectacular-earnings-growth-may-not-be-enough-to-keep-the-stock-rally-going"}, {"id": 10, "cat": "energy", "urgency": "act", "source": "HFIR / Oil Market Articles", "title": "'It's Here': Iran hits stationary tankers near Qatar and Fujairah for the first time", "idea": "Stationary tankers had not been attacked since the war began. Iran has now hit two: one near Qatar, one near the Fujairah ship-to-ship hub, with a large oil spill reported. The Oman Lane now carries about 14 million b/d of crude and product, so disruption hits physical balances immediately. If inefficient shuttle tankers redeploy elsewhere, tanker rates fall and crude gets more room to rally. HFIR's subscribers in the shuttle trade call the current situation completely unsustainable.", "angle": "Fujairah is a card you can only play once. Combine with Authers' note on record oil shipping costs and MacroEdge's October escalation thesis.", "tweetA": "First attack on a STATIONARY tanker since the Iran war began. 14M b/d now routes through the Oman Lane. The market treated the shuttle trade as the workaround. Hit Fujairah and the workaround becomes the target. $XOM $CVX $FRO", "tweetB": "Counterintuitive: if the shuttle trade breaks, tanker rates FALL as ships idle or redeploy, while crude loses its transport cushion. Freight and flat price decouple. Long physical optionality, not freight. $STNG", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.hfir.com/p/its-here"}, {"id": 11, "cat": "geopolitics", "urgency": "act", "source": "MacroEdge (Strategy Note)", "title": "MacroEdge: 'final interventions' in oil and gas over the next two weeks, then escalation; Iran signalling Strait closure despite blockade", "idea": "MacroEdge expects the last Trump administration interventions in oil and gas markets within two weeks, followed by escalation on both sides. Iran is showing signs it will try to close the Strait again with the blockade still in place; Trump pulled back briefly, which the author calls short-term noise. Thesis: patience through October.", "angle": "Policy-put framing for oil: if the final intervention fails, what is the next tool? SPR, jawboning, or direct military action. Cross-check with HFIR.", "tweetA": "If MacroEdge is right that the White House has about two weeks of oil interventions left, the question isn't price today. It's what the administration reaches for when SPR, jawboning and the blockade have all been used. That's the tail the options market isn't pricing. $USO $XLE", "tweetB": "A blockade and a Strait closure attempt running at the same time means both sides are escalating against each other's supply lines. Patience in October is a view that the pain trade is up.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.macroedge.world/p/strategy-note-the-final-interventions"}, {"id": 12, "cat": "macro", "urgency": "deep", "source": "MacroEdge (Portfolio Strategy, Six)", "title": "'Yield of Dreams': diesel ATH, 7.5% mortgage and a Fed hiking into weak payrolls drive a global bond selloff", "idea": "The real economy is absorbing three costs at once: diesel at all-time nominal highs in September, a roughly 7.5% 30-year mortgage with median home price to household income near record, and a Fed hiking into weak payroll growth. The author calls it a perfect storm driving a global bond selloff as real rates tighten.", "angle": "Real rates tightening globally while oil spikes is a stagflation-lite setup. Bessent's actions are flagged as a theme; full report is behind a paywall.", "tweetA": "Diesel at an all-time nominal high, a 7.5% mortgage and a Fed that is HIKING. That isn't a soft landing. It's the economy absorbing three taxes at once while the bond market reprices all of them. The part nobody models: what that does to the freight cycle. $IYT", "tweetB": "Global bond selloff plus central bank hiking plus an energy shock. The last time all three lined up the policy response was 'whatever it takes' in the other direction. This time the Fed is the one tightening.", "charts": {"count": 0, "hot": false, "desc": "Full Portfolio Strategy is paywalled - worth opening."}, "link": "https://www.macroedge.world/p/strategy-note-the-final-interventions"}, {"id": 13, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI: Reflections", "title": "Reflection ships Beam: US open-weight model at 3-4x less compute, Nvidia-backed at $25B pre-money", "idea": "Reflection's first open-weight model, Beam, is comparable to Z.ai's GLM-5.2 and approaching Alibaba's Qwen3.8-Max, and per its CEO needs three to four times less compute to reason than comparable open models. Nvidia has invested about $2B at $25B pre-money. Reflection has locked a $6.3B deal for GB300s in SpaceX's Colossus 2 through 2029 and a $1B deal with Nebius. Target: sovereign AI buyers who can't use Chinese models; early fans include hedge funds, and a sovereign AI factory test with Shinsegae.", "angle": "Open-weight US lab funded by the chip vendor, renting compute from the rocket company. The circularity is the story; the real product is the 'AI factory'.", "tweetA": "Nvidia invests $2B in Reflection, Reflection rents $6.3B of GB300s in a SpaceX data center. Follow the money in a circle and you get an 'open' model. The chip vendor is creating its own demand AND its own sovereign customers. $NVDA", "tweetB": "3-4x less inference compute at roughly GLM-5.2 level means the cost curve is falling faster than frontier capability. If sovereign buyers choose 'good enough, owned' over 'best, rented', the closed labs' moat is the top 10% of tasks only.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-nvidias-open-source-ai-factory"}, {"id": 14, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI: Reflections", "title": "Nvidia's six open-source levers: fund, convene, lobby, ally, own the shelf, build (~$20B in weeks for Hugging Face and Poolside)", "idea": "Parekh counts six levers: funding (Reflection, Thinking Machines, Mistral), convening (Nemotron Coalition), lobbying (July open-weight statement), alliances (Open Secure AI Alliance), owning the shelf (roughly $13B Hugging Face purchase) and building (billions a year on Nemotron plus a $6B Poolside license and acqui-hire). That is about $20B in recent weeks on Hugging Face and Poolside alone.", "angle": "Nvidia is vertically integrating into software distribution the way it did into networking. Open models are CUDA's new apps.", "tweetA": "Nvidia just spent ~$20B in weeks on Hugging Face and Poolside. Not on chips. On the distribution shelf and the talent for FREE models. When a company with 70%+ margins buys the free software ecosystem, the free part isn't free. $NVDA", "tweetB": "Parekh's framing: open models run on Nvidia hardware, hedge against Anthropic/OpenAI, and extend US stack geopolitically. I'd add a fourth: owning Hugging Face means owning the telemetry on which models developers actually use. That's a demand-forecasting data set no chip company ever had.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-nvidias-open-source-ai-factory"}, {"id": 15, "cat": "geopolitics", "urgency": "deep", "source": "Michael Parekh / AI: Reflections", "title": "China's open-weight lead by size: Kimi K3 2.8T, Qwen3.8-Max 2.4T, Alibaba planning 5-10T; largest US open models are under 1T", "idea": "Moonshot's Kimi K3 shipped at 2.8T parameters, Alibaba previewed Qwen3.8-Max at 2.4T and is planning 5-10T 'super-scale' open models. The largest American open models, Thinking Machines' Inkling and Nvidia's Nemotron 3 Ultra, are under a trillion. In enterprise API spending Chinese open models remain a small share, and banks and the Pentagon balk at them over security.", "angle": "Size isn't capability but it's intent, and it's China shipping scale in public. The US response is financed by Nvidia, not by policy.", "tweetA": "China's biggest open models are 2.4-2.8T parameters. America's biggest open models are under 1T. And the US response is a chip company writing checks, not a national strategy. If this is a race, one side is funding it from a vendor's balance sheet.", "tweetB": "Banks and the Pentagon won't touch Chinese models, which is the only reason enterprise API share stays small. That's a regulatory moat, not a quality moat. Remove the security constraint and what's the spread?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-nvidias-open-source-ai-factory"}, {"id": 16, "cat": "gold", "urgency": "deep", "source": "Jeffrey Gundlach via Robert Sinn", "title": "Gundlach: 'I'll buy gold with both hands' below $3,800; central bank gold share of reserves 20% to ~30%, why not 50%", "idea": "Gundlach said gold goes up in every scenario discussed. Central banks once held 70% of reserves in gold, fell to 20% and are back near 30%; he sees no reason it won't reach 50%. He says gold is now a legitimate asset class and he would buy aggressively anywhere below $3,800. He wants a 6% handle on the 30-year before buying Treasuries and expects government 'shenanigans' (a bigger Operation Twist) near that level.", "angle": "Floor level and a buy trigger in one note; combine with 30-year at ~6% as the intervention line. Check the current price relative to $3,800 before using.", "tweetA": "Gundlach's gold line: he'll buy 'with both hands' below $3,800. Central bank gold share of reserves is back to ~30% from 20%, and he sees 50% as plausible. 20 points of reserve reallocation is a multi-year bid that doesn't care about spot. $GLD", "tweetB": "Gundlach wants 6% on the 30-year to buy Treasuries and expects yield suppression above that. If the 30Y is the line and the 10Y is already 5.3%, how far is 'close'? Financial repression is a trade with a visible trigger.", "charts": {"count": 2, "hot": false, "desc": "Weekly gold chart and 30-year Treasury yield chart in the post."}, "link": "https://robertsinn.substack.com/p/gundlach-i-will-buy-gold-with-both"}, {"id": 17, "cat": "positioning", "urgency": "deep", "source": "Jeffrey Gundlach via Robert Sinn", "title": "Gundlach on AI: 'get me as far away as I can from the blast radius' - passive flows concentrate retirement savings into mega-caps", "idea": "Gundlach says passive flows are increasingly funnelled into the AI trade, with mega-cap tech hoovering up passive retirement savings. Sinn argues most investors don't appreciate the concentration risk in basic US equity indices and that the Treasury has no good way to handle rising interest expense, implying extraordinary Fed-Treasury measures.", "angle": "Passive concentration as a systemic risk, not a stock call. Pairs directly with Goldman 'AI worked too well' and Authers' >50% of EPS growth.", "tweetA": "Passive money doesn't have a view on AI. It has a rule: buy more of whatever got bigger. Gundlach is saying the retirement system is now an AI position by construction. The blast radius isn't the stocks, it's every 401(k).", "tweetB": "Goldman says the AI trade got crowded, Authers says AI is >50% of S&P EPS growth, Gundlach wants distance from the blast radius. Three independent sources, one risk: the index is the trade. $QQQ", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://robertsinn.substack.com/p/gundlach-i-will-buy-gold-with-both"}, {"id": 18, "cat": "crypto", "urgency": "watch", "source": "Check On Chain (James Check / Nik Bhatia, The Bitcoin Layer)", "title": "BTC: 'spot-driven recovery' discussion with Nik Bhatia on market structure, liquidity and bond-market stress", "idea": "Monthly session covering Bitcoin market structure (price action, onchain data, investor behaviour), market cycles and psychology, global liquidity (rates and the US bond market), and Europe/dollar/sovereign bond markets and a potential policy response. Preview frames the recovery as spot-driven and asks what signals mark a turn in liquidity. Full video and summary are premium.", "angle": "Spot-driven (not leverage-driven) recovery is a healthier structure; the liquidity turn is the risk. Email body is mostly agenda: open the post for charts.", "tweetA": "A spot-driven BTC recovery with the 10Y at 5.3% and French bonds wobbling. Spot-led is the healthier tape, but it's also the one that needs liquidity to keep cooperating. Which is the one thing the bond market is currently taking away. $BTC", "tweetB": "Everyone watches ETF flows. The cleaner liquidity signal is the dollar-and-Europe corner Check and Bhatia flag: if sovereign stress forces a policy response, BTC trades the response, not the stress.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening (premium video)."}, "link": "https://newsletter.checkonchain.com/p/onchain-and-macro-update-market-structure"}];
const META = {"date": "2026-10-08", "time": "09:11 CEST", "windowStart": "2026-10-08 03:11 CEST", "windowEnd": "2026-10-08 09:11 CEST", "emailsInWindow": 10, "emailsRead": 9, "itemsExtracted": 18, "includedSources": [["Dark Side of the Boom", 5], ["John Authers", 4], ["HFIR", 1], ["MacroEdge", 2], ["Michael Parekh", 3], ["Robert Sinn (Gundlach)", 2], ["Check On Chain", 1]], "skippedSources": [["GitHub Actions: Collect Twitter run failed", "Automated notification"]]};
var COL={macro:"#e24b4a",credit:"#378add",positioning:"#ef9f27","AI/infra":"#1d9e75",crypto:"#7f77dd",geopolitics:"#d85a30",energy:"#f97316",tech:"#06b6d4",gold:"#d4a017",culture:"#ec4899",labor:"#8b5cf6",regulation:"#64748b",science:"#14b8a6",venture:"#84cc16"};
var UE={act:"🔴",deep:"🔵",watch:"🟡"};var UL={act:"🔴 Act Now",deep:"🔵 Deep",watch:"🟡 Watch"};
var fc="All",fu="All",fs=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function toggle(id){document.getElementById('c'+id).classList.toggle('open');}
function setC(c){fc=c;fs=null;render(true);}
function setU(u){fu=u;fs=null;render(true);}
function filterBySrc(name){fs=name;fc="All";fu="All";render(false);}
function pill(label,active,color,fn){return '<span class="pill" style="'+(active?'background:'+color+';border-color:'+color+';color:#fff':'')+'" onclick="'+fn+'">'+esc(label)+'</span>';}
function render(collapse){
  var cats=[];ITEMS.forEach(function(i){if(cats.indexOf(i.cat)<0)cats.push(i.cat);});
  var h=pill("All ("+ITEMS.length+")",fc==="All","#333","setC('All')");
  cats.forEach(function(c){var n=ITEMS.filter(function(i){return i.cat===c;}).length;h+=pill(c+" ("+n+")",fc===c,COL[c]||"#333","setC('"+c+"')");});
  document.getElementById('catbar').innerHTML=h;
  h=pill("All",fu==="All","#333","setU('All')");
  ["act","deep","watch"].forEach(function(u){var n=ITEMS.filter(function(i){return i.urgency===u;}).length;h+=pill(UL[u]+" ("+n+")",fu===u,"#333","setU('"+u+"')");});
  document.getElementById('urgbar').innerHTML=h;
  var out="";
  ITEMS.forEach(function(item){
    if(fc!=="All"&&item.cat!==fc)return;if(fu!=="All"&&item.urgency!==fu)return;
    if(fs&&item.source.indexOf(fs)<0)return;
    var col=COL[item.cat]||"#333";
    var open=fs?" open":"";
    var ch=item.charts.count>0?(item.charts.hot?"🔥":"📊"):"";
    out+='<div class="card'+open+'" id="c'+item.id+'"><div class="hd" onclick="toggle('+item.id+')"><span class="num">'+item.id+'</span><span>'+UE[item.urgency]+'</span><span class="src" style="background:'+col+'">'+esc(item.source)+'</span><span class="tag">'+esc(item.cat)+'</span><span>'+ch+'</span><span class="ttl">'+esc(item.title)+'</span></div><div class="bd">'+
    '<div class="lbl">The Idea</div><div>'+esc(item.idea)+'</div>'+
    '<div class="lbl">My Angle</div><div class="angle" style="border-color:'+col+';background:'+col+'14">'+esc(item.angle)+'</div>'+
    '<div class="tw"><div><div class="lbl" style="color:#378add">Tweet A</div>'+esc(item.tweetA)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>'+
    '<div><div class="lbl" style="color:#7f77dd">Tweet B</div>'+esc(item.tweetB)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>'+
    '<div class="chart'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING · ':'')+(item.charts.count>0?item.charts.count+' chart(s): ':'')+esc(item.charts.desc||'No charts in email')+'</div>'+
    '<div style="margin-top:8px"><a href="'+esc(item.link)+'" target="_blank" rel="noopener">↗ Read full article</a></div></div></div>';
  });
  document.getElementById('cards').innerHTML=out||'<p>No items.</p>';
}
function init(){
  document.getElementById('sub').textContent=META.date+" · "+META.time+" · "+ITEMS.length+" items";
  var r='<p>Window: '+esc(META.windowStart)+' to '+esc(META.windowEnd)+'. Emails outside this window were not processed.</p><p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</p><b>Included sources</b><ul>';
  META.includedSources.forEach(function(s){r+='<li><span class="sl" data-n="'+esc(s[0])+'" onclick="filterBySrc(this.getAttribute(\'data-n\'))">'+esc(s[0])+'</span> — '+s[1]+'</li>';});
  r+='</ul><b>Skipped</b><ul>';META.skippedSources.forEach(function(s){r+='<li>'+esc(s[0])+' — '+esc(s[1])+'</li>';});
  document.getElementById('repbd').innerHTML=r+'</ul>';
  render(true);
}
init();
</script></body></html>
