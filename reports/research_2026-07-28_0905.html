function toggleReport(){
  const el = document.getElementById('reportCard');
  el.classList.toggle('open');
  document.getElementById('rchev').textContent = el.classList.contains('open') ? '▾' : '▸';
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

let activeCat = 'all';
let activeUrg = 'all';
let activeSrc = null;

function catColor(cat){ return CAT_COLORS[cat] || '#888'; }

function buildFilterBars(){
  const catCounts = {};
  ITEMS.forEach(function(i){ catCounts[i.cat] = (catCounts[i.cat]||0) + 1; });
  const cats = Object.keys(catCounts).sort();

  const catBar = document.getElementById('catBar');
  let html = '<button class="pill' + (activeCat==='all'?' active':'') + '" style="' + (activeCat==='all'?'background:#333;':'') + '" onclick="setCat(\'all\')">All (' + ITEMS.length + ')</button>';
  cats.forEach(function(c){
    const on = activeCat === c;
    const color = catColor(c);
    html += '<button class="pill' + (on?' active':'') + '" style="' + (on?('background:'+color+';border-color:'+color+';'):('color:'+color+';border-color:'+color+';')) + '" onclick="setCat(\'' + c + '\')">' + c + ' (' + catCounts[c] + ')</button>';
  });
  catBar.innerHTML = html;

  const urgCounts = {red:0, blue:0, watch:0};
  ITEMS.forEach(function(i){ urgCounts[i.urgency]++; });
  const urgBar = document.getElementById('urgBar');
  let uhtml = '<button class="pill' + (activeUrg==='all'?' active':'') + '" style="' + (activeUrg==='all'?'background:#333;':'') + '" onclick="setUrg(\'all\')">All (' + ITEMS.length + ')</button>';
  ['red','blue','watch'].forEach(function(u){
    const on = activeUrg === u;
    uhtml += '<button class="pill' + (on?' active':'') + '" style="' + (on?'background:#555;border-color:#555;':'') + '" onclick="setUrg(\'' + u + '\')">' + URG_META[u].emoji + ' ' + URG_META[u].label + ' (' + urgCounts[u] + ')</button>';
  });
  urgBar.innerHTML = uhtml;
}

function setCat(c){ activeCat = c; activeSrc = null; buildFilterBars(); renderCards(); }
function setUrg(u){ activeUrg = u; activeSrc = null; buildFilterBars(); renderCards(); }
function filterBySrc(name){
  activeSrc = name; activeCat = 'all'; activeUrg = 'all';
  buildFilterBars(); renderCards(true, name);
}

function renderCards(expandMatching, srcFilter){
  const cardsEl = document.getElementById('cards');
  let html = '';
  ITEMS.forEach(function(item, idx){
    let visible = true;
    if (activeCat !== 'all' && item.cat !== activeCat) visible = false;
    if (activeUrg !== 'all' && item.urgency !== activeUrg) visible = false;
    if (srcFilter && item.source.indexOf(srcFilter) === -1) visible = false;
    if (!visible) return;

    const color = catColor(item.cat);
    const openClass = (srcFilter && item.source.indexOf(srcFilter) !== -1) ? ' open' : '';
    const chartFlag = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');

    html += '<div class="card' + openClass + '" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">' + String(idx+1).padStart(2,'0') + '</span>';
    html += '<span class="urg">' + URG_META[item.urgency].emoji + '</span>';
    html += '<span class="badge" style="background:' + color + '">' + item.source.split(' / ')[0].split(' (')[0] + '</span>';
    html += '<span class="cattag">' + item.cat + '</span>';
    if (chartFlag) html += '<span class="chartflag">' + chartFlag + '</span>';
    html += '<span class="htitle">' + item.title + '</span>';
    html += '<span class="chev">▸</span>';
    html += '</div>';

    html += '<div class="card-body">';
    html += '<div class="seclabel">The Idea</div>';
    html += '<div class="idea-text">' + item.idea + '</div>';
    html += '<div class="seclabel">My Angle</div>';
    html += '<div class="angle-box" style="border-left:3px solid ' + color + '; background:' + color + '14;">' + item.angle + '</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet a"><div class="twlabel">TWEET A</div><div class="twtext">' + item.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet b"><div class="twlabel">TWEET B</div><div class="twtext">' + item.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    if (item.charts.count > 0 || item.charts.desc) {
      html += '<div class="chart-box' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '🔥 ' : '📊 ') + item.charts.desc + '</div>';
    }
    html += '<a class="readlink" href="' + item.link + '" target="_blank" style="color:' + color + '">↗ Read full article</a>';
    html += '</div>';
    html += '</div>';
  });
  if (!html) html = '<div style="padding:40px; text-align:center; color:var(--ink-soft);">No items match this filter.</div>';
  cardsEl.innerHTML = html;
}

function toggleCard(id){
  document.getElementById('card-' + id).classList.toggle('open');
}

function buildReportCard(){
  let html = '<div><strong>Time window:</strong> ' + META.windowStart + ' → ' + META.windowEnd + '</div>';
  html += '<div style="margin-top:4px;"><strong>Emails in window:</strong> ' + META.emailsInWindow + ' · <strong>Emails read:</strong> ' + META.emailsRead + ' · <strong>Items extracted:</strong> ' + META.itemsExtracted + '</div>';
  html += '<div class="seclabel" style="margin-top:16px;">Included Sources</div>';
  META.includedSources.forEach(function(s){
    html += '<div class="srcrow"><span class="srcname" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span><span>' + s.count + ' item' + (s.count===1?'':'s') + '</span></div>';
  });
  html += '<div class="seclabel" style="margin-top:16px;">Skipped Sources</div>';
  META.skippedSources.forEach(function(s){
    html += '<div class="skiprow"><strong>' + s.name + '</strong> — ' + s.reason + '</div>';
  });
  html += '<div class="totals">Total: ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources (' + META.emailsRead + ' emails read, ' + META.skippedSources.length + ' skipped as empty/promotional)</div>';
  document.getElementById('rbody').innerHTML = html;
}

document.getElementById('headMeta').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items';
buildFilterBars();
renderCards();
buildReportCard();
