    h+='<div class="lbl">my angle</div><div class="angle" style="border-color:'+c+';background:'+tint(c)+'">'+esc(item.angle)+'</div>';
    h+='<div class="tw"><div class="twb"><div class="twh"><span style="color:#378add">TWEET A</span>'+'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button>'+'</div>'+esc(item.tweetA)+'</div>';
    h+='<div class="twb"><div class="twh"><span style="color:#7f77dd">TWEET B</span>'+'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button>'+'</div>'+esc(item.tweetB)+'</div></div>';
    if(item.charts&&(item.charts.count>0||item.charts.desc)){h+='<div class="chart'+(hot?' hot':'')+'">'+(hot?'🔥 CHART WORTH SAVING — ':'📊 ')+(item.charts.count?item.charts.count+' chart(s): ':'')+esc(item.charts.desc)+'</div>';}
    h+='<a class="lnk" href="'+esc(item.link)+'" target="_blank" rel="noopener">↗ Read full article</a></div></div>';
  });
  document.getElementById('cards').innerHTML=n?h:'<div class="empty">No items match.</div>';
}
function toggle(id){document.getElementById('c'+id).classList.toggle('open');}
function setCat(c){fCat=c;fSrc=null;renderBars();renderCards(false);}
function setUrg(u){fUrg=u;fSrc=null;renderBars();renderCards(false);}
function filterBySrc(name){fSrc=name;fCat="all";fUrg="all";renderBars();renderCards(true);window.scrollTo(0,0);}
function renderReport(){
  var h='<p><b>Window:</b> '+esc(META.windowStart)+' → '+esc(META.windowEnd)+'. Emails outside this window were not processed.</p>';
  h+='<p><b>Emails in window:</b> '+META.emailsInWindow+' · <b>Read:</b> '+META.emailsRead+' · <b>Items:</b> '+META.itemsExtracted+'</p>';
  h+='<p><b>Included sources</b> (click to filter):</p><ul>';
  META.includedSources.forEach(function(s){h+='<li><span class="srcl" onclick="filterBySrc(\''+s.name.replace(/'/g,"\\'")+'\')">'+esc(s.name)+'</span> — '+s.items+' items</li>';});
  h+='</ul><p><b>Skipped sources:</b> '+(META.skippedSources.length?'':'none')+'</p><ul>';
  META.skippedSources.forEach(function(s){h+='<li>'+esc(s.name)+' — '+esc(s.reason)+'</li>';});
  h+='</ul><p style="color:#777">'+esc(META.note||'')+'</p>';
  document.getElementById('repbody').innerHTML=h;
}
function init(){document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items from '+META.includedSources.length+' sources';renderBars();renderCards(false);renderReport();}
init();
</script></body></html>
