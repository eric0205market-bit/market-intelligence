ction in overseas markets.", "quote": null, "locator": "With domestic demand still subdued", "quote_verified": false}, {"claim": "Chinese NEV exports face 2027 policy headwinds: an EU cap on imports of Chinese-built hybrids and a cut in China's VAT export rebate for NEVs from 13% to 9% from 1 April 2027.", "speaker": "Benchmark Team", "type": "prediction", "entities": ["EU", "China", "NEV"], "conviction": "medium", "so_what": "Export-led relief for Chinese automakers may weaken in 2027, likely pulling exports forward into Q1 2027.", "quote": "the reduction in China’s VAT export rebate for NEVs from 13% to 9% from 1 April 2027", "locator": "With domestic demand still subdued", "quote_verified": true}]}, {"theme": "Rest of World boom and its fragility", "insights": [{"claim": "Rest of World EV sales rose 85% year-on-year to 300,000 units in October 2026, leaving the region up 93% year-to-date, making it the fastest-growing region.", "speaker": "Benchmark Team", "type": "data_point", "entities": ["Rest of the World"], "conviction": "high", "so_what": "Emerging markets are becoming a material incremental demand source, largely served by Chinese brands.", "quote": null, "locator": "Sales in the Rest of the World", "quote_verified": false}, {"claim": "Australia's EV sales rose more than 200% year-on-year in October 2026, but a surge of new, largely Chinese, car brands is fragmenting sales and squeezing dealer margins, so volume growth is not translating into healthy dealer profits.", "speaker": "Benchmark Team", "type": "causal", "entities": ["Australia"], "conviction": "medium", "so_what": "Chinese brand proliferation drives volume but erodes downstream profitability in import markets.", "quote": "this growth has not translated into healthy profits for dealers", "locator": "Australia’s EV sales were up more", "quote_verified": true}, {"claim": "Brazil's 2026 EV boom was driven largely by temporary factors—imports pulled forward ahead of phased tariff step-ups, a fuel crisis boosting EV demand, and BYD's local plant ramp—and its growth drivers look set to ease once tariffs are fully in place and fuel prices normalise.", "speaker": "Benchmark Team", "type": "prediction", "entities": ["Brazil", "BYD"], "conviction": "medium", "so_what": "Expect Brazil's EV growth to decelerate sharply; BYD's local production becomes the main remaining support.", "quote": "After this period of extreme growth, the drivers of Brazil’s EV market look set to ease.", "locator": "Brazil has also seen huge growth", "quote_verified": true}, {"claim": "BYD's local Brazilian plant will also serve Argentina and Mexico, positioning it as the main structural support for Latin American EV supply once Brazil's tariff and fuel-driven tailwinds fade.", "speaker": "Benchmark Team", "type": "thesis", "entities": ["BYD", "Brazil", "Argentina", "Mexico"], "conviction": "medium", "so_what": "BYD's localisation in Brazil creates a tariff-insulated Latin American export hub.", "quote": null, "locator": "Brazil has also seen huge growth", "quote_verified": false}]}], "insight_total": 19, "top_entities": ["Benchmark Mineral Intelligence", "Europe", "China", "North America", "US", "Germany", "UK", "BYD", "Brazil", "Australia", "NEV", "Electric Car Grant"], "source_meta": {"author": "Benchmark Team", "word_count": 936, "paywalled": false}}, {"record_id": "8abc14e638c7ef6e", "source_type": "technology", "source_name": "Hugging Face Blog", "source_url": "https://huggingface.co/blog/nvidia/nemotron-pii-japan-ja", "title": "Nemotron PII Japan: プライバシー保護に向けた日本語PIIオープンデータ", "published_date": "2026-11-09", "language": "en", "processed_at": "2026-11-13T11:06:12Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech"], "gist": "NVIDIA released Nemotron PII Japan, a CC BY 4.0 open dataset of 100,000 synthetic Japanese business documents across 8 domains and 43 document types with 56 PII entity types and 810,703 span annotations, generated via NeMo Data Designer with values fixed before LLM writing. Fine-tuning GLiNER multi-v2.1 on it lifted external Sumi benchmark micro F1 from 13.41% to 73.80% (in-template) and 8.13% to 65.30% (out-of-distribution).", "themes": [{"theme": "Nemotron PII Japan dataset release and specs", "insights": [{"claim": "NVIDIA released Nemotron PII Japan, an open dataset of 100,000 synthetic Japanese business documents with PII position and type annotations, covering 8 domains (medical, finance, government, employment, education, legal, telecom/IT, e-commerce) and 43 document types.", "speaker": "Masaya Ogushi", "type": "data_point", "entities": ["NVIDIA", "Nemotron PII Japan"], "conviction": "high", "so_what": "NVIDIA is seeding localized enterprise-AI safety infrastructure for Japan, a market where data-privacy constraints gate LLM adoption.", "quote": "医療、金融、行政、雇用、教育、法務、通信・IT、ECの8領域・43文書種を収録。", "locator": "オープンデータとしての特徴", "quote_verified": true}, {"claim": "The Nemotron PII Japan dataset defines 56 PII entity types, including My Number (Japan's national ID), bank account numbers, and separate labels for medical institution, educational institution, and public body names.", "speaker": "Masaya Ogushi", "type": "data_point", "entities": ["Nemotron PII Japan", "マイナンバー"], "conviction": "high", "so_what": "Fine-grained, Japan-specific label taxonomy raises the bar for PII-detection vendors targeting Japanese enterprises.", "quote": "PIIエンティティ型：56種類。", "locator": "オープンデータとしての特徴", "quote_verified": true}, {"claim": "The Nemotron PII Japan corpus totals 34,737,684 tokens (about 347 tokens per document, measured with the NVIDIA Nemotron Nano 9B v2 Japanese tokenizer) and contains 810,703 PII span annotations, about 8.11 per document.", "speaker": "Masaya Ogushi", "type": "data_point", "entities": ["NVIDIA Nemotron Nano 9B v2 Japanese", "Nemotron PII Japan"], "conviction": "high", "so_what": "Short, densely annotated documents suit training span-extraction models rather than long-context evaluation.", "quote": "PIIスパン数：810,703（約81.1万）", "locator": "オープンデータとしての特徴", "quote_verified": true}, {"claim": "Nemotron PII Japan is released under CC BY 4.0, permitting both commercial and non-commercial use, as a single data.parquet file without a fixed train/test split.", "speaker": "Masaya Ogushi", "type": "data_point", "entities": ["Nemotron PII Japan", "CC BY 4.0"], "conviction": "high", "so_what": "Commercially usable license lowers cost for startups and SIs building Japanese PII-masking products.", "quote": "CC BY 4.0 ライセンスに基づき、商用・非商用を問わず利用可能", "locator": "オープンデータとしての特徴", "quote_verified": true}]}, {"theme": "Why Japanese PII masking needs contextual data", "insights": [{"claim": "Japanese business-document AI must protect PII while preserving meaning, because the same name can play different roles (patient, doctor, applicant, staff) and addresses and dates (e.g., Japanese imperial-era dates) vary in notation, so evaluation must capture both missed leaks and over-masking that destroys useful information.", "speaker": "Masaya Ogushi", "type": "thesis", "entities": ["NVIDIA"], "conviction": "high", "so_what": "Masking quality, not just recall, determines whether regulated Japanese firms can safely route documents to external LLMs.", "quote": "見逃しによる漏えいと、過剰なマスキングによる情報の欠落の両方を評価するため、文脈を備えた日本語のオープンデータが役立ちます。", "locator": "日本のプライバシー保護に向けたオープンデータ", "quote_verified": false}, {"claim": "A key target use case is a Japanese financial institution summarizing loan-screening documents with an external LLM while masking birth dates, full addresses, and repayment account details but retaining loan purpose and screening rationale.", "speaker": "Masaya Ogushi", "type": "framework", "entities": ["外部LLM"], "conviction": "medium", "so_what": "Signals demand for pre-LLM redaction gateways in Japanese banking, a niche for privacy middleware vendors.", "quote": "日本の金融機関がローン審査書類を外部LLMで要約する場合", "locator": "日本のプライバシー保護に向けたオープンデータ", "quote_verified": true}, {"claim": "Business documents containing real personal data are hard to share or reuse and therefore hard to use as common public benchmarks; synthetic PII lets developers compare methods under identical conditions, though synthetic results alone cannot guarantee production performance.", "speaker": "Masaya Ogushi", "type": "causal", "entities": [], "conviction": "high", "so_what": "Synthetic benchmarks shift the bottleneck in privacy AI from data access to real-world validation.", "quote": "一方、合成データでの結果だけで実運用の性能は保証できません。", "locator": "合成PIIデータの重要性", "quote_verified": false}]}, {"theme": "Generation pipeline: fix values first, let LLM write prose", "insights": [{"claim": "The dataset is generated with NVIDIA's NeMo Data Designer, where PII and business values are decided before text generation and passed to the LLM as placeholders (e.g., __JP_PII_EMAIL_1__, __JP_PLAN_MONTHLY_REPAYMENT__), then substituted afterward and checked for consistency with the body text.", "speaker": "Masaya Ogushi", "type": "framework", "entities": ["NeMo Data Designer", "Data Designer Plugins"], "conviction": "high", "so_what": "A reusable recipe for label-accurate synthetic data that avoids relying on LLM self-checks, relevant to any synthetic-data tooling business.", "quote": "LLMの出力や自己点検だけに頼らず、人物・PII・業務上の値を先に決め、生成後に本文と照合します。", "locator": "生成パイプライン: 合成値を確定してから文章を書く", "quote_verified": true}, {"claim": "For documents that require arithmetic, a Data Designer Plugins component called CalculationPlan pre-computes results (e.g., a 137,653 yen monthly repayment from a 14.96 million yen loan at 2% over 10 years) and validates them with Pydantic schemas, so the LLM is never asked to calculate.", "speaker": "Masaya Ogushi", "type": "framework", "entities": ["CalculationPlan", "Data Designer Plugins", "Pydantic"], "conviction": "high", "so_what": "Shows NVIDIA's pattern of separating deterministic computation from LLM prose to get numerically correct synthetic data.", "quote": "LLMへは計算を依頼せず、次のように結果を入れるplaceholderを渡します。", "locator": "CalculationPlan: 返済額を事前に計算して説明文を作る", "quote_verified": true}, {"claim": "Person attributes in the generated documents come from NVIDIA's synthetic persona dataset Nemotron Personas Japan via DataDesigner's Person Sampler, combined with catalogs of companies, banks, document themes and medical scenarios that are type- and duplicate-checked before use.", "speaker": "Masaya Ogushi", "type": "framework", "entities": ["Nemotron Personas Japan", "Person Sampler", "DataDesigner"], "conviction": "medium", "so_what": "NVIDIA is building a stack of interlocking Japan-specific synthetic datasets, deepening ecosystem lock-in around Nemotron/NeMo tools.", "quote": "人物カタログの基盤には、NVIDIAの合成ペルソナデータセットNemotron Personas Japanを使用しています。", "locator": "カタログ: 文書に使う素材と関連情報を準備する", "quote_verified": true}, {"claim": "No real customer or patient information was collected; documents were built from synthetic personas, synthetic PII and business catalogs, with unintended inclusion of real information and label errors treated as post-generation check items.", "speaker": "Masaya Ogushi", "type": "data_point", "entities": ["NVIDIA"], "conviction": "high", "so_what": "Privacy-by-design provenance reduces legal risk for enterprises adopting the dataset.", "quote": "実際の顧客・患者情報を集めず、合成ペルソナ、合成PII、業務カタログを組み合わせて文書を生成しています。", "locator": "プライバシーを保護した設計", "quote_verified": true}]}, {"theme": "GLiNER fine-tune results on external benchmarks", "insights": [{"claim": "Fine-tuning urchade/gliner_multi-v2.1 on 95,000 Nemotron PII Japan documents with 56 labels raised exact-match micro F1 on the external Sumi test set (2,000 docs) from 13.41% to 73.80%, a +60.39 pp gain.", "speaker": "Masaya Ogushi", "type": "data_point", "entities": ["urchade/gliner_multi-v2.1", "Sumi test", "Nemotron PII Japan"], "conviction": "high", "so_what": "A small open NER model gains roughly 60 points from domain data, showing data rather than model scale drives Japanese PII performance.", "quote": "Sumi test +60.39 pp、Sumi OOD +57.17 ppです。", "locator": "日本語PIIモデルの追加学習で確認された性能向上", "quote_verified": true}, {"claim": "On Sumi OOD (520 documents of Wikipedia, legal and literary text with embedded synthetic PII), the fine-tuned GLiNER model scored 65.30% micro F1 versus 8.13% for the base, with precision/recall of 61.63%/69.43% (vs 85.17%/65.10% on Sumi test).", "speaker": "Masaya Ogushi", "type": "data_point", "entities": ["Sumi OOD", "urchade/gliner_multi-v2.1"], "conviction": "high", "so_what": "Out-of-template generalization lags in-template results and recall stays mid-60s, leaving room for commercial PII products.", "quote": "Sumi OOD（520文書）は、Wikipedia・法令・文学の文章に合成PIIを埋め込み、テンプレート外への汎化を評価するデータです。", "locator": "日本語PIIモデルの追加学習で確認された性能向上", "quote_verified": true}, {"claim": "Internal validation F1 peaked at 98.08% after epoch 1 (97.53% at epochs 2 and 3), but the authors treat it only as a checkpoint-selection metric because documents within the dataset are highly similar.", "speaker": "Masaya Ogushi", "type": "contrarian", "entities": ["urchade/gliner_multi-v2.1"], "conviction": "medium", "so_what": "Near-perfect in-distribution scores overstate real capability; investors should discount headline validation numbers on synthetic data.", "quote": "文書間の類似性が高いため、内部検証F1はチェックポイント選択のための指標とし", "locator": "日本語PIIモデルの追加学習で確認された性能向上", "quote_verified": true}]}, {"theme": "Limitations and intended users", "insights": [{"claim": "Annotations in Nemotron PII Japan follow per-document-type rules and may not cover all PII in the text, so scoring unannotated spans as non-PII can count correct detections as false positives; and since all 100,000 documents contain PII, false-positive rates on PII-free documents require separate evaluation data.", "speaker": "Masaya Ogushi", "type": "thesis", "entities": ["Nemotron PII Japan"], "conviction": "high", "so_what": "Benchmark precision/F1 claims built on this dataset need caveats before being used in vendor comparisons.", "quote": "未注釈箇所を非PIIとして採点すると、正しい検出も誤検知として数えられる場合があるため、適合率やF1の解釈には注意が必要です。", "locator": "実用的な AI アプリケーションへの利用", "quote_verified": true}, {"claim": "The dataset targets engineers building Japanese PII detection and masking, AI-safety researchers and security staff, and teams designing document sharing/analytics platforms, with use cases such as masking before sending to external LLMs, PII removal before summarizing inquiry logs, and pre-sharing review of logs and reports; the authors advise re-evaluating on target data before production.", "speaker": "Masaya Ogushi", "type": "prediction", "entities": ["外部LLM"], "conviction": "medium", "so_what": "Defines the buyer set for Japanese AI-governance tooling: regulated enterprises and their SIs.", "quote": "本番導入前には適用先のデータと運用条件で再評価します。", "locator": "想定するユーザ", "quote_verified": false}]}], "insight_total": 16, "top_entities": ["NVIDIA", "Nemotron PII Japan", "NeMo Data Designer", "Data Designer Plugins", "CalculationPlan", "Nemotron Personas Japan", "urchade/gliner_multi-v2.1", "Sumi test", "Sumi OOD", "NVIDIA Nemotron Nano 9B v2 Japanese", "CC BY 4.0"], "source_meta": {"author": "Masaya Ogushi", "word_count": 425, "paywalled": false}}, {"record_id": "8e5af45c7d38c88e", "source_type": "technology", "source_name": "Quantum Computing Report", "source_url": "https://quantumcomputingreport.com/ibm-unveils-520-qubit-nighthawk-r3-processor-1040-qubit-linked-roadmap-and-managed-hybrid-workflows-at-qdc-2026/", "title": "IBM Unveils 520-Qubit Nighthawk r3 Processor, 1,040-Qubit Linked Roadmap, and Managed Hybrid Workflows at QDC 2026 - Quantum Computing Report", "published_date": "2026-11-12", "language": "en", "processed_at": "2026-11-13T11:07:53Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "At QDC 2026 IBM unveiled the 520-qubit Nighthawk r3 (2027, 10,000 two-qubit ops, 1,040 qubits via two-chip link), reported Nighthawk r2 has run >34B circuits with up to 19x speedups over Heron, showed 99.3% chip-to-chip l-couplers and a cut in Loon Josephson junctions from ~5,000 to 2,000, and launched Managed Workflows under Resource Units billing on the path to 2029 fault-tolerant Starling.", "themes": [{"theme": "Nighthawk hardware roadmap", "insights": [{"claim": "IBM's Nighthawk r3, scheduled for 2027, is designed to execute 10,000 accurate two-qubit operations across 520 programmable qubits (2,034 physical qubits), with plans to link two chips via couplers into a 1,040-qubit system.", "speaker": "Mohamed Abdel-Kareem", "type": "prediction", "entities": ["IBM", "Nighthawk r3"], "conviction": "high", "so_what": "Sets a concrete 2027 benchmark for IBM's competitive position against rival superconducting and other modalities.", "quote": null, "locator": "At its annual Quantum Developer Conference", "quote_verified": false}, {"claim": "IBM's Nighthawk r2, deployed September 2026, offers 120 programmable qubits (458 physical), more than 7,500 accurate two-qubit operations, and up to 100,000 samples per second via 100 kHz reset, 25x faster than Heron.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["IBM", "Nighthawk r2", "Heron"], "conviction": "high", "so_what": "Sampling throughput is the key economic metric for sample-hungry hybrid workloads.", "quote": null, "locator": "IBM Quantum Nighthawk Architecture & Roadmap Progression", "quote_verified": false}, {"claim": "IBM frames Nighthawk r3 as a transitional stepping stone toward the fault-tolerant IBM Quantum Starling system targeted for 2029.", "speaker": "Mohamed Abdel-Kareem", "type": "prediction", "entities": ["IBM", "Nighthawk r3", "Starling"], "conviction": "high", "so_what": "2029 fault tolerance remains IBM's anchor date; slips or confirmations will move sentiment across the sector.", "quote": "Transitional stepping stone toward 2029 fault-tolerant IBM Quantum Starling", "locator": "IBM Quantum Nighthawk Architecture & Roadmap Progression", "quote_verified": true}]}, {"theme": "Production throughput and partner speedups", "insights": [{"claim": "Since September 2026, IBM Nighthawk r2 processors have executed more than 34 billion circuits for partners including E.ON, Algorithmiq and Q-CTRL, delivering speedups of up to 19x over previous Heron systems.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["IBM", "Nighthawk r2", "E.ON", "Algorithmiq", "Q-CTRL", "Heron"], "conviction": "high", "so_what": "Billions of circuits in two months signal real usage volume that underpins IBM's quantum services revenue.", "quote": "executed more than 34 billion circuits for partners including E.ON, Algorithmiq, and Q-CTRL, delivering speedups of up to 19× over previous IBM Heron systems", "locator": "Utility-scale applications in chemistry, materials science", "quote_verified": true}, {"claim": "In Algorithmiq materials-simulation benchmarks, Nighthawk r2's square-lattice connectivity ran circuits 8x faster than Heron, while competing tensor-network approximations would require an estimated 240x more classical memory.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Algorithmiq", "Nighthawk r2", "Heron"], "conviction": "medium", "so_what": "Widening the classical-memory gap is the kind of evidence needed to substantiate quantum-advantage claims.", "quote": null, "locator": "Utility-scale applications in chemistry, materials science", "quote_verified": false}, {"claim": "Utility-scale quantum applications in chemistry, materials science and optimization increasingly require millions to billions of circuit samples, making sampling speed a core performance metric.", "speaker": "Mohamed Abdel-Kareem", "type": "thesis", "entities": ["IBM"], "conviction": "medium", "so_what": "Shifts the competitive axis from qubit counts to throughput, favoring fast-reset superconducting platforms.", "quote": "Utility-scale applications in chemistry, materials science, and optimization increasingly require millions to billions of circuit samples.", "locator": "Utility-scale applications in chemistry, materials science", "quote_verified": true}]}, {"theme": "Modular scaling: couplers, cryogenics and qLDPC", "insights": [{"claim": "IBM demonstrated four chip-to-chip l-couplers linking Nighthawk processors with up to 99.3% quantum state transfer fidelity, and Nighthawk r3 will carry 10 such l-couplers for multi-processor entanglement.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["IBM", "Nighthawk", "l-couplers"], "conviction": "high", "so_what": "Modular interconnect fidelity is the gating technology for scaling beyond single-chip limits.", "quote": null, "locator": "To support its modular scaling path", "quote_verified": false}, {"claim": "IBM cooled a dual-module cryogenic system below 15 millikelvin in under five days.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["IBM"], "conviction": "medium", "so_what": "Faster cooldown of modular cryostats shortens deployment and maintenance cycles for large systems.", "quote": null, "locator": "To support its modular scaling path", "quote_verified": false}, {"claim": "Design refinements to IBM's Loon qLDPC memory architecture using denser c-couplers cut required Josephson junctions per module from roughly 5,000 to 2,000.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["IBM", "Loon", "c-couplers"], "conviction": "medium", "so_what": "A ~60% component reduction lowers fabrication complexity and yield risk on the path to fault tolerance.", "quote": "reduced required Josephson junctions per module from roughly 5,000 to 2,000", "locator": "To support its modular scaling path", "quote_verified": true}]}, {"theme": "Hybrid software stack and monetization", "insights": [{"claim": "IBM introduced Managed Workflows in IBM Quantum Functions (formerly Qiskit Functions) under a unified Resource Units billing model, bundling persistent storage, GPU-accelerated classical compute and parallel orchestration for multi-billion-sample hybrid jobs.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["IBM", "Managed Workflows", "IBM Quantum Functions", "Resource Units"], "conviction": "high", "so_what": "Unified RU billing lets IBM monetize classical compute alongside QPU time, expanding revenue per workload.", "quote": null, "locator": "On the software front, IBM introduced", "quote_verified": false}, {"claim": "Automated sample-based quantum diagonalization pipelines let IBM and RIKEN accelerate large-scale electronic structure calculations 5x while running 100x more computations than their foundational 77-qubit study.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["IBM", "RIKEN", "SQD"], "conviction": "medium", "so_what": "Workflow automation, not just hardware, is delivering multiplicative productivity gains.", "quote": null, "locator": "On the software front, IBM introduced", "quote_verified": false}, {"claim": "Cleveland Clinic and RIKEN automatically processed 608 million samples for 12,000-atom biomolecular complexes 33x faster than unautomated workflows using IBM's SQD pipelines.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Cleveland Clinic", "RIKEN", "IBM"], "conviction": "medium", "so_what": "Healthcare/biomolecular use cases are moving to production-scale sample volumes on IBM's stack.", "quote": null, "locator": "On the software front, IBM introduced", "quote_verified": false}, {"claim": "IBM released developer tooling including a directed execution model (Samplomatic, Executor), qiskit-mitigation and qiskit-noise-learning libraries, pulse-level dynamic circuit tools running 1,000,000-round repetition codes, the Rust-based QRMI for HPC schedulers, and open-source Qiskit Agent Skills for AI coding assistants.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["IBM", "Qiskit", "QRMI", "Samplomatic", "Qiskit Agent Skills"], "conviction": "medium", "so_what": "HPC-scheduler integration and AI-agent tooling deepen Qiskit's ecosystem lock-in.", "quote": null, "locator" nment that is driving the agenda on electrification and clean power.", "locator": "How, in your experience at COP31", "quote_verified": true}, {"claim": "Ed Miliband said the UK will 'go all out' to meet its 2030 NDC of cutting emissions 68% below 1990 levels but conceded the target is stretching and blamed a difficult inheritance from the previous government in 2024.", "speaker": "Simon Evans", "type": "data_point", "entities": ["UK", "NDC", "Ed Miliband"], "conviction": "medium", "so_what": "Admission that the 68% target is stretching hints at delivery risk and possible further policy push (or slippage) in UK decarbonisation.", "quote": "Obviously, it’s stretching. We inherited, from 2024, a difficult situation from the previous government", "locator": "Are you confident that the UK", "quote_verified": true}, {"claim": "Ed Miliband acknowledged the UK lacks a national climate education programme despite UNFCCC and Paris commitments, pointing instead to the annual climate and nature statement he started in 2025 and Mary Creagh repeated in 2026.", "speaker": "Simon Evans", "type": "anecdote", "entities": ["UK", "Mary Creagh", "Paris Agreement", "UN climate convention"], "conviction": "medium", "so_what": "Public-information gaps amid misinformation are a soft risk to political durability of UK net-zero policy.", "quote": "We need to do more. You’re completely right.", "locator": "We need to do more. You’re", "quote_verified": true}]}, {"theme": "Climate as national/energy security", "insights": [{"claim": "Ed Miliband frames climate as a national security issue, arguing that politicians not serious about climate are not serious about national security.", "speaker": "Simon Evans", "type": "framework", "entities": ["Ed Miliband", "UK"], "conviction": "high", "so_what": "Reframing climate as security can protect clean-energy budgets from fiscal cuts and broaden political support, favouring defence-adjacent energy spending.", "quote": "if you’re serious about national s , "themes": [{"theme": "Scope of the government demand", "insights": [{"claim": "The DOJ asked LinkedIn for 18 months of communications from targeted journalists who collectively published over 1,000 articles, extending to users with any possible link to those journalists around the time a leaked military report was drafted.", "speaker": "Ashley Belanger", "type": "data_point", "entities": ["Department of Justice", "LinkedIn"], "conviction": "high", "so_what": "Shows the breadth of government data demands that tech platforms face.", "quote": null, "locator": "The order came after the DOJ", "quote_verified": false}, {"claim": "The Trump administration obtained a secrecy order barring LinkedIn from disclosing the request for a year, leaving affected journalists unaware their First Amendment rights were compromised.", "speaker": "Ashley Belanger", "type": "data_point", "entities": ["Trump administration", "LinkedIn", "First Amendment"], "conviction": "high", "so_what": "Gag orders raise legal and trust risk for platforms hosting sensitive communications.", "quote": null, "locator": "The majority of journalists have LinkedIn accounts", "quote_verified": false}]}, {"theme": "Appeals court ruling and legal standard", "insights": [{"claim": "A unanimous three-judge appeals panel led by Judge J. Harvie Wilkinson III rejected quashing the order entirely but ordered the district court to substantially narrow the LinkedIn disclosure order to protect press freedoms.", "speaker": "Ashley Belanger", "type": "data_point", "entities": ["J. Harvie Wilkinson III", "LinkedIn"], "conviction": "high", "so_what": "Sets a precedent limiting broad government data requests to platforms.", "quote": null, "locator": "Judge: Security and free speech can coexist", "quote_verified": false}, {"claim": "The appeals court held that district courts may not approve government records requests merely because they are logistically feasible for the company to compile.", "speaker": "Ashley Belanger", "type": "framework", "entities": ["J. Harvie Wilkinson III"], "conviction": "high", "so_what": "Raises the bar for compelled data production, reducing compliance burdens for tech firms.", "quote": "“It is not appropriate for district courts to approve requests purely because the records requested are logistically feasible to compile,”", "locator": "As Wilkinson explained", "quote_verified": true}, {"claim": "Wilkinson wrote that wholesale collection of reporters' records to identify sources would harm democratic health, and that many targeted users had no conceivable relationship to the leak investigation.", "speaker": "Ashley Belanger", "type": "thesis", "entities": ["J. Harvie Wilkinson III"], "conviction": "high", "so_what": "Strengthens legal protection for confidential communications on platforms.", "quote": "“A request by the government to scoop up reporters’ records wholesale and ascertain the identity of their sources would tip the balance against informed discourse in a manner inimical to democratic health.”", "locator": "Without such an intervention", "quote_verified": true}, {"claim": "Unless the government gives a more persuasive justification on remand, LinkedIn's proposal to notify a single attorney of the investigated news outlet must be adopted as a narrow exception to the secrecy order.", "speaker": "Ashley Belanger", "type": "prediction", "entities": ["LinkedIn", "Trump administration"], "conviction": "high", "so_what": "Likely to weaken blanket gag orders on platforms in leak probes.", "quote": null, "locator": "“Unless the government’s response to LinkedIn’s proposal", "quote_verified": false}]}, {"theme": "Platform and press reactions", "insights": [{"claim": "LinkedIn argued that most journalists publish contact details there to attract sources, so overbroad demands threaten a critical platform for confidential sourcing, an argument the judges accepted.", "speaker": "Ashley Belanger", "type": "causal", "entities": ["LinkedIn"], "conviction": "high 5Z", "processor": "claude-code-sub-opus", "tags": ["Energy", "Tech"], "gist": "Sponsored profile of Sophia University materials scientist Kenichi Takai, whose low-temperature thermal desorption spectrometry (L-TDS) maps where hydrogen sits in steel defects (vacancies, dislocations, grain boundaries). Hydrogen embrittlement threatens pipelines and storage tanks for a hydrogen economy, and Takai aims to shift from post-failure analysis to predicting dangerous conditions before fracture.", "themes": [{"theme": "Hydrogen embrittlement as a hydrogen-economy bottleneck", "insights": [{"claim": "Hydrogen embrittlement, where hydrogen atoms penetrate steel and weaken it, threatens the switch to hydrogen fuel because it can weaken the pipelines and storage tanks used for hydrogen gas.", "speaker": "Nature Energy", "type": "causal", "entities": ["hydrogen embrittlement", "hydrogen fuel", "pipelines", "storage tanks", "steel"], "conviction": "high", "so_what": "Materials durability is a gating cost and safety risk for hydrogen transport and storage infrastructure buildout.", "quote": null, "locator": "Known as hydrogen embrittlement, this phenomenon", "quote_verified": false}, {"claim": "According to Sophia University materials scientist Kenichi Takai, hydrogen embrittlement is an old problem, but the transition to hydrogen-based energy systems makes solving it much more urgent.", "speaker": "Nature Energy", "type": "thesis", "entities": ["Kenichi Takai", "Sophia University", "hydrogen embrittlement"], "conviction": "high", "so_what": "Rising hydrogen adoption increases demand for hydrogen-resistant steels, testing, and qualification services.", "quote": "Hydrogen embrittlement is not a new problem,", "locator": "Hydrogen embrittlement is not a new problem", "quote_verified": true}, {"claim": "Despite decades of study, the underlying mechanisms of hydrogen embrittlement in steel remain debated, partly because hydrogen is too small to track easily and often escapes broken components before lab analysis.", "speaker": "Nature Energy", "type": "data_point", "entities": ["hydrogen embrittlement", "steel"], "conviction": "high", "so_what": "Unresolved science means hydrogen-service steel standards may stay conservative, raising infrastructure costs.", "quote": null, "locator": "It's an ambitious goal.", "quote_verified": false}]}, {"theme": "Strength-vs-hydrogen-sensitivity trade-off", "insights": [{"claim": "Even very small amounts of hydrogen can cause surprisingly large reductions in fracture resistance in high-strength steels, because the dense dislocations and interfaces that make steel strong also interact strongly with hydrogen.", "speaker": "Nature Energy", "type": "causal", "entities": ["high-strength steels", "dislocations", "Kenichi Takai"], "conviction": "high", "so_what": "Lightweighting with high-strength steel in hydrogen service carries a hidden failure risk, favoring designs with lower-strength or specially engineered grades.", "quote": "Some of the microstructural features that make steel very strong can also make it more sensitive to hydrogen.", "locator": "Even a very small amount of hydrogen", "quote_verified": true}, {"claim": "Takai argues hydrogen embrittlement has no single mechanism: it depends on each steel's microstructure, with hydrogen stabilizing vacancies, altering dislocation motion, and weakening binding at grain boundaries.", "speaker": "Nature Energy", "type": "framework", "entities": ["Kenichi Takai", "vacancies", "dislocations", "grain boundaries"], "conviction": "high", "so_what": "Mitigation must be grade-specific, so one-size-fits-all hydrogen-ready steel claims deserve scrutiny.", "quote": "Hydrogen embrittlement isn’t caused by one single mechanism", "locator": "Takai has investigated how each type", "quote_verified": true}, {"claim": "In high-strength steel stressed within the elastic region, stress redistributes hydrogen toward grain boundaries and promotes fracture between grains, whereas in the plastic region hydrogen tends to move toward dislocations and vacancies, promoting fracture within grains.", "speaker": "Nature Energy", "type": "data_point", "entities": ["high-strength steel", "grain boundaries", "dislocations", "vacancies"], "conviction": "medium", "so_what": "Failure mode depends on loading regime, which matters for pressure-cycled pipelines and tanks.", "quote": null, "locator": "L-TDS also reveals how stress", "quote_verified": false}]}, {"theme": "L-TDS: fingerprinting hydrogen traps", "insights": [{"claim": "Takai's team developed low-temperature thermal desorption spectrometry (L-TDS), which cools steel to about -200 °C to freeze hydrogen in place before gradual warming, avoiding the hydrogen losses of conventional room-temperature thermal desorption methods.", "speaker": "Nature Energy", "type": "data_point", "entities": ["L-TDS", "thermal desorption spectroscopy", "Kenichi Takai"], "conviction": "high", "so_what": "Better measurement tools could become the basis for qualification testing of hydrogen-service materials.", "quote": null, "locator": "L-TDS overcomes that problem", "quote_verified": false}, {"claim": "Hydrogen trapped at different lattice defects is released at different temperatures, letting researchers distinguish hydrogen at dislocations, grain boundaries and vacancies, and even use tracer hydrogen to map strain-induced defects.", "speaker": "Nature Energy", "type": "framework", "entities": ["L-TDS", "dislocations", "grain boundaries", "vacancies"], "conviction": "high", "so_what": "Defect-level diagnostics enable targeted alloy design rather than trial-and-error testing.", "quote": "We can use hydrogen desorption behaviour as a kind of fingerprint of the defects", "locator": "Recent experiments have shown that hydrogen", "quote_verified": true}]}, {"theme": "Design strategy: safer trapping and predictive failure", "insights": [{"claim": "Takai's design goal for hydrogen-resistant steel is not only lowering hydrogen content but steering hydrogen into harmless trap sites, while reducing vacancy formation, harmful grain-boundary trapping and local stress concentrations.", "speaker": "Nature Energy", "type": "thesis", "entities": ["Kenichi Takai", "grain boundaries", "vacancies"], "conviction": "medium", "so_what": "Microstructure-engineered steels could be a differentiated product line for steelmakers serving hydrogen infrastructure.", "quote": "The goal is not only to reduce the hydrogen content, but also to ensure that the hydrogen is in safer places", "locator": "From knowledge to prediction", "quote_verified": true}, {"claim": "Takai aims to shift hydrogen embrittlement research from analyzing steel after fracture to predicting dangerous conditions before failure, combining L-TDS, microscopy, mechanical testing and computational approaches.", "speaker": "Nature Energy", "type": "prediction", "entities": ["Kenichi Takai", "L-TDS"], "conviction": "exploratory", "so_what": "Predictive integrity monitoring for hydrogen assets could become a valuable inspection and software niche.", "quote": "I’d like to move from understanding failure after it happens, to predicting dangerous conditions before failure occurs", "locator": "Traditionally, research into hydrogen embrittlement", "quote_verified": true}]}], "insight_total": 10, "top_entities": ["hydrogen embrittlement", "Kenichi Takai", "Sophia University", "L-TDS", "high-strength steels", "grain boundaries", "dislocations", "vacancies", "pipelines", "hydrogen economy"], "source_meta": {"author": "Nature Energy", "word_count": 1218, "paywalled": false}}, {"record_id": "c2f79d0f0a9a002f", "source_type": "technology", "source_name": "Ars Technica", "source_url": "https://arstechnica.com/ai/2026/11/taiwans-chipmaking-giant-tsmc-to-invest-1b-in-anthropic-openai/", "title": "Taiwan’s chipmaking giant TSMC to invest $1B in Anthropic, OpenAI", "published_date": "2026-11-11", "language": "en", "processed_at": "2026-11-13T11:08:12Z", "processor": "clau // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
