  "date": "2026-08-16",
  "time": "09:07 CEST",
  "windowStart": "2026-08-16 03:07 CEST",
  "windowEnd": "2026-08-16 09:07 CEST",
  "emailsInWindow": 8,
  "emailsRead": 8,
  "itemsExtracted": 17,
  "includedSources": [
    { "name": "Exponential View (Azeem Azhar)", "count": 9 },
    { "name": "Vik's Newsletter (SemiExponent)", "count": 2 },
    { "name": "Michael Parekh / AI-RTZ", "count": 1 },
    { "name": "The Dark Side of the Boom", "count": 4 },
    { "name": "MacroEdge Oil and Gas Research", "count": 1 }
  ],
  "skippedSources": [
    { "name": "MacroEdge (chat thread notification)", "reason": "duplicate Substack chat-thread notification pointing to the same 'Weekly Energy Macro Note' already captured directly from MacroEdge, zero original content beyond a repost link" }
  ]
};

const CAT_COLORS = {
  macro: "#e24b4a", credit: "#378add", positioning: "#ef9f27", "AI/infra": "#1d9e75",
  crypto: "#7f77dd", geopolitics: "#d85a30", energy: "#f97316", tech: "#06b6d4",
  gold: "#d4a017", culture: "#ec4899", labor: "#8b5cf6", regulation: "#64748b",
  science: "#14b8a6", venture: "#84cc16"
};

const URG_META = {
  act_now: { emoji: "🔴", label: "Act Now" },
  deep: { emoji: "🔵", label: "Deep" },
  watch: { emoji: "🟡", label: "Watch" }
};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function catColor(cat) { return CAT_COLORS[cat] || "#888"; }

function buildFilters() {
  const catCounts = {};
  ITEMS.forEach(i => { catCounts[i.cat] = (catCounts[i.cat] || 0) + 1; });
  const catWrap = document.getElementById("catFilters");
  let html = `<div class="pill active" data-cat="all" style="background:#1a1a1a;border-color:#1a1a1a;" onclick="setCat('all')">All (${ITEMS.length})</div>`;
  Object.keys(catCounts).sort().forEach(cat => {
    html += `<div class="pill" data-cat="${cat}" onclick="setCat('${cat}')">${cat} (${catCounts[cat]})</div>`;
  });
  catWrap.innerHTML = html;

  const urgCounts = {};
  ITEMS.forEach(i => { urgCounts[i.urgency] = (urgCounts[i.urgency] || 0) + 1; });
  const urgWrap = document.getElementById("urgFilters");
  let uhtml = `<div class="pill active" data-urg="all" style="background:#1a1a1a;border-color:#1a1a1a;" onclick="setUrg('all')">All (${ITEMS.length})</div>`;
  ["act_now", "deep", "watch"].forEach(u => {
    if (!urgCounts[u]) return;
    const m = URG_META[u];
    uhtml += `<div class="pill" data-urg="${u}" onclick="setUrg('${u}')">${m.emoji} ${m.label} (${urgCounts[u]})</div>`;
  });
  urgWrap.innerHTML = uhtml;
}

function setCat(cat) {
  activeCat = cat;
  activeSrc = null;
  document.querySelectorAll("#catFilters .pill").forEach(p => {
    const isActive = p.getAttribute("data-cat") === cat;
    p.classList.toggle("active", isActive);
    if (isActive) {
      p.style.background = cat === "all" ? "#1a1a1a" : catColor(cat);
      p.style.borderColor = cat === "all" ? "#1a1a1a" : catColor(cat);
    } else {
      p.style.background = "transparent";
      p.style.borderColor = "";
    }
  });
  renderCards();
}

function setUrg(urg) {
  activeUrg = urg;
  activeSrc = null;
  document.querySelectorAll("#urgFilters .pill").forEach(p => {
    const isActive = p.getAttribute("data-urg") === urg;
    p.classList.toggle("active", isActive);
    p.style.background = isActive ? "#1a1a1a" : "transparent";
  });
  renderCards();
}

function filterBySrc(name) {
  activeCat = "all";
  activeUrg = "all";
  activeSrc = name;
  document.querySelectorAll("#catFilters .pill").forEach(p => {
    const isActive = p.getAttribute("data-cat") === "all";
    p.classList.toggle("active", isActive);
    p.style.background = isActive ? "#1a1a1a" : "transparent";
    p.style.borderColor = isActive ? "#1a1a1a" : "";
  });
  document.querySelectorAll("#urgFilters .pill").forEach(p => {
    const isActive = p.getAttribute("data-urg") === "all";
    p.classList.toggle("active", isActive);
    p.style.background = isActive ? "#1a1a1a" : "transparent";
  });
  renderCards();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderCards() {
  const wrap = document.getElementById("cardsWrap");
  const empty = document.getElementById("emptyState");
  let visible = ITEMS.filter(i => {
    if (activeCat !== "all" && i.cat !== activeCat) return false;
    if (activeUrg !== "all" && i.urgency !== activeUrg) return false;
    if (activeSrc && i.source.indexOf(activeSrc) === -1) return false;
    return true;
  });

  if (visible.length === 0) {
    wrap.innerHTML = "";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  let html = "";
  visible.forEach(item => {
    const color = catColor(item.cat);
    const urg = URG_META[item.urgency];
    const chartFlag = item.charts && (item.charts.hot ? "🔥" : (item.charts.count > 0 ? "📊" : ""));
    const openClass = activeSrc ? " open" : "";
    html += `<div class="card${openClass}" id="card-${item.id}">
      <div class="card-header" onclick="toggleCard(${item.id})">
        <span class="idx">#${String(item.id).padStart(2, "0")}</span>
        <span class="urg-emoji">${urg.emoji}</span>
        <span class="src-badge" style="background:${color}">${escapeHtml(item.source)}</span>
        <span class="cat-tag">${escapeHtml(item.cat)}</span>
        ${chartFlag ? `<span class="chart-flag">${chartFlag}</span>` : ""}
        <span class="card-title">${escapeHtml(item.title)}</span>
        <span class="chevron">▸</span>
      </div>
      <div class="card-body">
        <div class="section-label">The Idea</div>
        <div class="idea-text">${escapeHtml(item.idea)}</div>
        <div class="section-label">My Angle</div>
        <div class="angle-box" style="border-left:2px solid ${color}; background:${color}14;">${escapeHtml(item.angle)}</div>
        <div class="tweets">
          <div class="tweet-card">
            <div class="tweet-label a">TWEET A</div>
            <div class="tweet-text">${escapeHtml(item.tweetA)}</div>
            <button class="copy-btn" onclick="copyTweet(${item.id},'a')">📋 Copy</button>
          </div>
          <div class="tweet-card">
            <div class="tweet-label b">TWEET B</div>
            <div class="tweet-text">${escapeHtml(item.tweetB)}</div>
            <button class="copy-btn" onclick="copyTweet(${item.id},'b')">📋 Copy</button>
          </div>
        </div>
        ${item.charts && (item.charts.count > 0 || item.charts.desc) ? `<div class="charts-box${item.charts.hot ? " hot" : ""}">${item.charts.hot ? "🔥 CHART WORTH SAVING — " : "📊 "}${item.charts.count > 0 ? item.charts.count + " chart(s). " : ""}${escapeHtml(item.charts.desc || "")}</div>` : ""}
        <div class="link-row"><a href="${item.link}" target="_blank" rel="noopener">↗ Read full article</a></div>
      </div>
    </div>`;
  });
  wrap.innerHTML = html;
}

function toggleCard(id) {
  const el = document.getElementById("card-" + id);
  if (el) el.classList.toggle("open");
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function toggleReport() {
  document.getElementById("reportCard").classList.toggle("open");
  document.getElementById("reportChevron").textContent =
    document.getElementById("reportCard").classList.contains("open") ? "▾" : "▸";
}

function buildReport() {
  let html = `<div>Window: <strong>${META.windowStart}</strong> to <strong>${META.windowEnd}</strong>. Emails outside this window were not processed.</div>`;
  html += `<div style="margin-top:6px;">Emails in window: ${META.emailsInWindow} · Emails read: ${META.emailsRead} · Items extracted: ${META.itemsExtracted}</div>`;
  html += `<h4>Included Sources</h4><ul>`;
  META.includedSources.forEach(s => {
    html += `<li><span class="src-link" onclick="filterBySrc('${s.name.replace(/'/g, "\\'")}')">${escapeHtml(s.name)}</span> — ${s.count} item(s)</li>`;
  });
  html += `</ul>`;
  if (META.skippedSources && META.skippedSources.length) {
    html += `<h4>Outside Window / Skipped</h4><ul>`;
    META.skippedSources.forEach(s => {
      html += `<li>${escapeHtml(s.name)} — ${escapeHtml(s.reason)}</li>`;
    });
    html += `</ul>`;
  }
  document.getElementById("reportBody").innerHTML = html;
}

function init() {
  document.getElementById("metaLine").textContent =
    `${META.date} · ${META.time} · ${META.itemsExtracted} items from ${META.includedSources.length} sources`;
  buildFilters();
  renderCards();
  buildReport();
}

init();
</script>
