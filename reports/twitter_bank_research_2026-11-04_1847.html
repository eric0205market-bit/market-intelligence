<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }

.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);

.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>

cratic side explicitly campaigned on stricter data center regulation, and we expect Democratic governors in Texas, Georgia, and Michigan to impose conditional moratoria pending new legislation restricting data centers. That legislation could end certain tax breaks (a priority for Hinojosa), tighten environmental, water, and electricity rules, and make it easier for localities to impose their own moratoria....since data centers are low on the list of priorities for voters this election, we expect that the issue will fade somewhat in importance in the ensuing months and that these moratoria will not be long-lived if they are enacted.\"\n\nThe positive angle:\n▪️ BofA’s Aditya Bhave notes real AI-related capital spending has grown about 26% annualized since the first quarter of 2025, a front-loaded wave he calls “symptomatic of over-investment.” Slowing it now could lower the risk of a harder landing later.\n▪️ Goldman’s Rich Privorotsky says AI stocks had been “sold to death” into the vote (via MarketWatch). He thinks companies may pull spending into 2027 to lock in today’s permitting, and that limits on new supply make capacity already running more valuable, which favors Amazon, Microsoft and Alphabet. For neoclouds like CoreWeave and Nebius, it depends on how much compute is contracted versus already built. He also expects volatility to fall quickly now that the election is over.\n\nBeyond data centers:\n▪️ Goldman expects Democrats to reverse last year’s spending cuts, adding about 0.25% of GDP to 2027 spending. The first test is December 11, when government funding runs out; Goldman sees a short-term extension to February or March as most likely.\n▪️ The FT reports corporate America is bracing for a wave of congressional investigations once Democrats gain subpoena power.", "tweet_url": "https://x.com/neilsethinew/status/2117974692766044433", "images": ["https://pbs.twimg.com/media/HWSNWTXXUAA-Zjd.jpg", "https://pbs.twimg.com/media/HWSOrc6WIAAy54T.jpg"], "created_a  America is bracing for a wave of congressional investigations once Democrats gain subpoena power.", "tweet_url": "https://x.com/neilsethinew/status/2117974692766044433", "images": ["https://pbs.twimg.com/media/HWSNWTXXUAA-Zjd.jpg", "https://pbs.twimg.com/media/HWSOrc6WIAAy54T.jpg"], "created_at": "2026-11-04T13:38:11.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Midterm Election Outcomes: Impacts on Power &amp; Utilities.. a BofA summary... https://t.co/ikVuZlcEFr", "tweet_url": "https://x.com/MikeZaccardi/status/2117955270559055977", "images": ["https://pbs.twimg.com/media/HWR9GFgWsAAIio_.png"], "created_at": "2026-11-04T12:21:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "BofA: Blue Sweep, Gridlock Risks... a summary \n\n-Democrats outperform even the rosiest predictions\n-Equity strategy: any knee-jerk sell-off likely temporary\n-Rates: Bull steepening, but fundamentals should reassert\n-FX strategy: A near-term setback, not a turning point https://t.co/oqthFfqSPq", "tweet_url": "https://x.com/MikeZaccardi/status/2117953340575228302", "images": ["https://pbs.twimg.com/media/HWR7VwfX0AA0aRQ.png"], "created_at": "2026-11-04T12:13:20.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BofA says their clients sold US equities for a 3rd week last week (-$4.7B of stocks + ETFs) with all three client groups net sellers. \n\nWhile Goldman and MS saw some short covering from hedge funds, BofA saw a -$2.9B outflow, their biggest selling week since mid-July, and their 4-week average turned negative for the first time in 3 months.\n\nInstitutions’ October selling, typically driven by mutual fund tax-loss harvesting ahead of the 10/31 fiscal year-end, ended as the largest of any October since 2017 relative to market cap they said.", "tweet_url": "https://x.com/neilsethinew/status/2117944949891363273", "images": ["https://pbs.twimg.com/media/HWP_vm2WAAA12cM.jpg"], "created_at": "2026-11-04T11:40:00.000Z", "relayers": []}]}, {"bank": "Yardeni", "theme": "Yardeni — Democratic sweep commentary, SLOOS loan demand, Wednesday Brief", "items": [{"author": "neilsethinew", "text": "@C_Barraud's Wednesday Brief is packed with analysis of the Democrats winning control of the House and Senate which, in contrast to conventional thinking, is seeing both bonds and stocks (and gold) higher with the asset taking the biggest hit the dollar.\n\n▪️ Dollar: Bloomberg’s dollar index fell as much as 0.5%, its biggest drop in two months, to its lowest since late September. The Swiss franc, yen and euro all gained.\n▪️ Treasuries: the 10-year yield is down 3 basis points to 4.93%. The 5-year fell as much as 9 basis points to 4.67% before pairing some gains.\n▪️ Stocks: S&P 500 futures recovered from a 1.4% overnight drop to trade about 0.9% higher, and Nasdaq 100 futures erased a 2.4% slide.\n▪️ Gold is up nearly 3% since Tuesday’s close.\n\nWhy bonds are rallying: Wellington’s Brij Khurana told Bloomberg divided government has historically been good for Treasuries, since a Democratic Congress limits Trump’s room for more tax cuts and spending that would need more issuance. \nNedgroup’s David Roberts added a growth angle: Democratic control could slow the AI buildout that has been driving growth and inflation, so the Fed might not need to hike next year.\n\nWhy the dollar fell hardest: its 4% rally since early September was built on the AI boom, through money pouring into US tech and AI-driven inflation lifting Fed hike bets. Democrats are talking tougher tech rules and higher taxes on companies and high earners. Crédit Agricole’s David Forrester said the dollar’s “Achilles’ heel” is being exposed. Nomura’s Dominic Bunning added that investors were leaning long the dollar, so there’s room for those bets to unwind.\n\nVontobel’s Andrew Jackson though noted that blocking new spending doesn’t shrink the existing deficit, so heavy issuance could limit how far long yields fall. Ed Yardeni warned a Democratic sweep could make debt ceiling talks messy, with shutdown risk that could push yields higher (although Republicans may look to get the debt ceiling taken care of in the lame duck session). And dollar bulls have oil: Bloomberg notes the dollar’s gains could resume if Middle East turbulence lifts crude and Fed hike bets.\n\nWhat to watch: the Treasury’s refunding announcement later this morning, where dealers expect groundwork for possible 2027 cuts to the longest-dated auctions, offset by more bills and shorter notes (Commerzbank expects no coupon changes for now).", "tweet_url": "https://x.com/neilsethinew/status/2117967093135978811", "images": ["https://pbs.twimg.com/media/HWSHpxjW0AAhyNC.jpg"], "created_at": "2026-11-04T13:07:59.000Z", "relayers": []}, {"author": "neilsethinew", "text": "In the third-quarter Senior Loan Officer Opinion Survey (SLOOS), banks reported that business loan demand weakened for the first time since the second quarter of 2025. But other data doesn’t show businesses borrowing less.\n\nThe Fed’s weekly bank lending data shows commercial & industrial (C&I) loans are up 11.3% year-over-year, the fastest since early 2023 (h/t Ed Yardeni), and we know equipment spending surged at a 20.9% annualized rate in third-quarter GDP.\n\nThe banks’ own explanation hints at what’s going on: “customer borrowing shifting to more attractive bank or nonbank funding sources.”\n\nWorth noting, the survey’s demand reading has historically led actual C&I loan growth by about three quarters (correlation of 0.64 since 1991), so either loan growth cools into mid-2027 or the survey is off this time.\n\nInterestingly, though, while banks left business loan standards little changed, they tightened standards on every type of loan to the nonbank lenders (nondepository financial institutions, or NDFIs) that may be taking their business:\n\n▪️ Private credit (business credit intermediaries): a net 22% of banks tightened, while a net 10.7% saw stronger demand from them\n▪️ Private equity funds: 15.4% tightened, demand up 5.4%\n▪️ Mortgage and consumer credit intermediaries and other NDFIs: 16.7% to 20.4% tightened\nDespite that, bank loans to NDFIs are up 20.3% year-over-year, about the 20% to 22% pace they’ve held all year. Meanwhile, loan-loss reserves are flat at $202 billion while total loans grew 7.9%, so coverage slipped to 1.42% of loans from 1.54% a year ago.\n\nSome other nuggets from the SLOOS report:\n▪️ Commercial real estate standards tightened in all three categories for the first time since the third quarter of 2024, with large banks flipping tighter after six straight surveys of easing on construction and multifamily loans\n▪️ Mortgage demand weakened in all seven categories, while credit card demand was the strongest since the third quarter of 2022", "tweet_url": "https://x.com/neilsethinew/status/2117949989913604124", "images": ["https://pbs.twimg.com/media/HWQA1wIXUAArrhN.jpg"], "created_at": "2026-11-04T12:00:01.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "A Democratic sweep could be ‘a cold shower for stocks,’ but if so, buy the dip – @Yardeni @seekingalpha https://t.co/bm5ouTZRbN", "tweet_url": "https://x.com/MikeZaccardi/status/2117711913018663221", "images": ["https://pbs.twimg.com/media/HWOfwzdW8AEuddf.png"], "created_at": "2026-11-03T20:13:59.000Z", "relayers": []}]}, {"bank": "Apollo/Slok", "theme": "Apollo/Slok — Iran economy chart", "items": [{"author": "MikeZaccardi", "text": "Iran’s economy is in a severe tailspin since the conflict began:\n\n• Inflation hit ~90% YoY\n• Rial collapsed to ~3M per USD\n• Oil exports crashed from 1.8M b/d to near zero\n\nLost oil dollars crash the currency, driving inflation higher in a self-reinforcing loop. T at Apollo https://t.co/YZfafqF5PX", "tweet_url": "https://x.com/MikeZaccardi/status/2117948223700500618", "images": ["https://pbs.twimg.com/media/HWR2r5cWgAAcrXq.jpg"], "created_at": "2026-11-04T11:53:00.000Z", "relayers": []}]}, {"bank": "Citi", "theme": "Citi — Treasury Quarterly Refunding auction sizes", "items": [{"author": "neilsethinew", "text": "Treasury’s Quarterly Refunding announcement is out, setting auction sizes for the upcoming quarter. The sizes came in as expected, but the long end jumped on the release before settling back.\n\nIn terms of auction sizes, Treasury kept note and bond sizes unchanged at $125B for next week’s refunding (3s, 10s, 30s). So there was no cut to 20- and 30-year bonds, which some, including Citi, had expected this month. It also repeated that it sees “strong demand” for bills.\n\nHowever, the Treasury Borrowing Advisory Committee (TBAC) sounded less sure about that:\n\n▪ Money market fund assets “have leveled off,” and the bill market “has started to show some signs of price sensitivity”\n\n▪ It recommended larger coupon auctions in the second half of FY27 (April–September 2027), focused on 2- to 10-year notes, with “meaningful discussion” about future 20- and 30-year sizes\n\n▪ Dealers see a $2.14T funding shortfall in FY28–29 at current auction sizes. Bills can cover FY27’s “modest” gap, but not that much\n\n▪ TBAC said the maturity mix should be managed through auction sizes, not buybacks, even as Treasury nearly doubled its planned liquidity buybacks to up to $70B this quarter, from $38B in August’s plan\n\nTreasury also softened its guidance to holding sizes “for the next several quarters,” dropping “at least.” Starting in March 2027, the 7-year note moves to a new issue each quarter with two reopenings.\n\nPer Claude’s calculations, bills could reach close to 24% of marketable debt by March, the highest since late 2020. The Fed has already hiked once, and markets price about three more increases over the coming year (per TBAC). If bill buyers also start demanding higher yields, it’s a double whammy for Treasury’s interest costs.", "tweet_url": "https://x.com/neilsethinew/status/2117978524682277173", "images": ["https://pbs.twimg.com/media/HWSSOvTXUAABZS3.jpg"], "created_at": "2026-11-04T1  Cantrill expects “a lot more sand in the gears” even without statewide moratoriums.\n▪️Goldman: \"In each of these states except Ohio, the Democratic side explicitly campaigned on stricter data center regulation, and we expect Democratic governors in Texas, Georgia, and Michigan to impose conditional moratoria pending new legislation restricting data centers. That legislation could end certain tax breaks (a priority for Hinojosa), tighten environmental, water, and electricity rules, and make it easier for localities to impose their own moratoria....since data centers are low on the list of priorities for voters this election, we expect that the issue will fade somewhat in importance in the ensuing months and that these moratoria will not be long-lived if they are enacted.\"\n\nThe positive angle:\n▪️ BofA’s Aditya Bhave notes real AI-related capital spending has grown about 26% annualized since the first quarter of 2025, a front-loaded wave he calls “symptomatic of over-investment.” Slowing it now could lower the risk of a harder landing later.\n▪️ Goldman’s Rich Privorotsky says AI stocks had been “sold to death” into the vote (via MarketWatch). He thinks companies may pull spending into 2027 to lock in today’s permitting, and that limits on new supply make capacity already running more valuable, which favors Amazon, Microsoft and Alphabet. For neoclouds like CoreWeave and Nebius, it depends on how much compute is contracted versus already built. He also expects volatility to fall quickly now that the election is over.\n\nBeyond data centers:\n▪️ Goldman expects Democrats to reverse last year’s spending cuts, adding about 0.25% of GDP to 2027 spending. The first test is December 11, when government funding runs out; Goldman sees a short-term extension to February or March as most likely.\n▪️ The FT reports corporate America is bracing for a wave of congressional investigations once Democrats gain subpoena power.", "tweet_url": "https://x.com/neilsethinew/status/21 // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
