t experiencing hardship, a structure Hussman says he strongly discouraged while advising members of Congress.", "speaker": "John P. Hussman", "type": "anecdote", "entities": ["U.S. Congress", "pandemic stimulus", "corporate profits"], "conviction": "high", "so_what": "Explains part of the post-2020 margin surge as a one-time fiscal transfer to corporations rather than an operating improvement.", "quote": null, "locator": "Like the response to the Global Financial Crisis, the first round of pandemic support", "quote_verified": false}, {"claim": "The 'cash on the sidelines' waiting to enter stocks is a myth: currency, bank reserves and reverse repos are Fed liabilities that exist because the Fed created them and can only change hands between holders until the Fed shrinks its balance sheet.", "speaker": "John P. Hussman", "type": "contrarian", "entities": ["Federal Reserve", "money market funds", "bank reserves"], "conviction": "high", "so_what": "Removes one of the most common bullish talking points from the analytical toolkit — money-market fund balances are not latent equity demand.", "quote": "If someone puts a dollar of cash “into” the market, the seller takes it right back out.", "locator": "Meanwhile, the frequently-discussed mountain of so-called “cash on the sidelines”", "quote_verified": true}, {"claim": "Quantitative easing does not eliminate the government's obligation, it only changes its form: the Fed removes Treasury securities from public hands and substitutes bank reserves, reverse repos or currency as its own liability.", "speaker": "John P. Hussman", "type": "framework", "entities": ["Federal Reserve", "quantitative easing", "U.S. Treasury"], "conviction": "high", "so_what": "Clarifies that balance-sheet policy is a maturity/composition swap, not debt cancellation — relevant to how QT reintroduces duration supply.", "quote": "The government’s obligation doesn’t disappear, it just changes the form of that obligation.", "locator": "In effect, the Fed removes Treasury securities from the hands of the public", "quote_verified": true}, {"claim": "The U.S. current account deficit in goods and services is essentially the mirror image of the capital and financial account surplus, so importing more goods necessarily means exporting more financial claims — about $9 trillion of which are Treasury securities held abroad.", "speaker": "John P. Hussman", "type": "framework", "entities": ["current account", "U.S. Treasury", "foreign investors"], "conviction": "high", "so_what": "Policies that shrink the trade deficit mechanically shrink foreign demand for Treasuries and U.S. financial assets.", "quote": null, "locator": "When the United States imports more goods and services than it exports", "quote_verified": false}]}, {"theme": "Rates, inflation and the case for bonds", "insights": [{"claim": "Long-term interest rates have faced upward pressure recently from the combination of heavy Treasury debt, disruptions in the global oil supply chain and labor market tightness, but Hussman judges many of these pressures to be temporary.", "speaker": "John P. Hussman", "type": "thesis", "entities": ["U.S. Treasury", "oil supply chain", "labor market", "long-term interest rates"], "conviction": "medium", "so_what": "Argues recent yield backup is an opportunity rather than a regime change, supporting duration purchases on weakness.", "quote": null, "locator": "The combination of heavy Treasury debt, disruptions in the global oil supply chain", "quote_verified": false}, {"claim": "The best predictor of next year's inflation is inflation over the past year, with inflation two years ago the second best — better than employment, GDP growth or Federal Reserve policy moves — because inflation is driven largely by what is in people's minds.", "speaker": "John P. Hussman", "type": "framework", "entities": ["inflation", "Federal Reserve", "GDP"], "conviction": "high", "so_what": "An autoregressive inflation model beats macro-fundamental forecasting, which argues against trading inflation off Fed decisions or growth data.", "quote": "Hands down, the best predictor of inflation next year, beyond employment, beyond GDP growth, beyond Federal Reserve policy moves, is inflation over the past year.", "locator": "My own impression is that many of these pressures are temporary", "quote_verified": true}, {"claim": "Systematic historical relationships between the Fed Funds rate and observable economic variables suggest the policy rate is currently a bit lower than conditions indicate, but Hussman sees no pressing case for rate hikes because the departure from policy benchmarks is nowhere near as egregious as it was between 2008 and 2022.", "speaker": "John P. Hussman", "type": "thesis", "entities": ["Federal Reserve", "Fed Funds rate"], "conviction": "medium", "so_what": "A calibrated, non-alarmist read on Fed policy that argues against positioning for a hawkish policy shock.", "quote": "I don’t see a pressing case for rate hikes at the moment", "locator": "Based on systematic historical relationships between the Federal Funds rate", "quote_verified": true}, {"claim": "The link between Fed policy rates and real economic activity — and even inflation — is weak and unreliable in effect size, with only moves of hundreds of basis points and the speculative effect of near-zero rates mattering materially.", "speaker": "John P. Hussman", "type": "contrarian", "entities": ["Federal Reserve", "interest rates"], "conviction": "high", "so_what": "Downgrades 25bp Fed decisions as tradeable macro events; the speculative channel, not the real-economy channel, is where policy matters.", "quote": null, "locator": "As I’ve detailed previously, however, the link between Fed policy rates", "quote_verified": false}, {"claim": "After a very long period of inadequate long-term Treasury yields, yields have finally pushed into territory where a bond component makes sense in a diversified portfolio, particularly if price weakness is used as  "fully two-thirds of history, and even about one-third of periods in recent years, comprise periods that we can classify as “constructive”", "locator": "Since February, and particularly since mid-May", "quote_verified": true}, {"claim": "Hussman's core inputs are unchanged — valuations, market internals and the elements of the discipline have not changed — and market internals remain unfavorable at present; only the flexibility of response has changed.", "speaker": "John P. Hussman", "type": "thesis", "entities": ["market internals", "valuations"], "conviction": "high", "so_what": "Distinguishes a tactical implementation change from a capitulation on the bearish long-term view.", "quote": "It’s not that valuations, market internals, or other core features of the market environment have changed. They haven’t.", "locator": "Since February, and particularly since mid-May", "quote_verified": true}, {"claim": "The September 2024 hedging implementation gave Hussman a systematic way to vary the intensity of a bearish outlook even when market internals are unfavorable, a capability he says he vastly underexploited until a February 2026 realization that he had been 'discriminating against the bubble.'", "speaker": "John P. Hussman", "type": "anecdote", "entities": ["Hussman Investment Trust", "options hedging"], "conviction": "high", "so_what": "Explains the mechanism (option/hedging math) behind the change and dates the inflection precisely for anyone tracking his real-time record.", "quote": "“Oh, no. I’ve been discriminating against the bubble.”", "locator": "In early February, in a moment of meditation actually", "quote_verified": true}, {"claim": "In a speculative bubble, fast and furious rebounds after selloffs behave like re-inflating an already stretched balloon, so the majority of constructive opportunities occur once the market has retreated from its highs — though this is not as simple as 'buy the dip' because many dips extend and some devolve into collapses.", "speaker": "John P. Hussman", "type": "framework", "entities": ["S&P 500", "market internals"], "conviction": "high", "so_what": "Defines when to take risk inside a bubble: after retreats from highs, filtered by sentiment and internals, not at new highs.", "quote": "In a speculative bubble, the “fast, furious” market rebounds that accompany market selloffs are often of that variety, particularly if market internals are unfavorable (as they are now).", "locator": "Part of my tortured adolescence included several years as a performing magician", "quote_verified": true}, {"claim": "Even under hostile valuation and internals conditions, Hussman's frequency of constructive positions rarely drops below about 20% of periods — roughly once in five weeks — and even in the most extreme bubble periods the market's overall gain is generally concentrated in that small handful of periods.", "speaker": "John P. Hussman", "type": "data_point", "entities": ["S&P 500", "market internals"], "conviction": "high", "so_what": "Quantifies how concentrated bubble-era returns are in a minority of windows — a case for condition-gated exposure rather than continuous exposure.", "quote": "even amid hostile conditions, the frequency of constructive positions rarely drops below about 20% (that is, roughly once in 5 weeks)", "locator": "Valuations and market internals continue to dictate whether or not we require a safety net", "quote_verified": true}, {"claim": "Given present market extremes Hussman expects to be about twice as likely defensive as constructive, with a constructive stance roughly 20-30% of the time, and a safety net is viewed as obligatory regardless of short-term conditions.", "speaker": "John P. Hussman", "type": "prediction", "entities": ["Hussman Investment Trust", "S&P 500"], "conviction": "high", "so_what": "A concrete expected positioning distribution for anyone allocating to or benchmarking against his funds.", "quote": "we’re about twice as likely to be defensive as constructive, but even here, we expect our investment stance to be constructive about 20-30% of the time", "locator": "Aside from knowing that our investment position presently requires a safety net", "quote_verified": true}, {"claim": "Being 'constructive with a safety net' means locally constructive exposure that benefits from an advance while being globally structured so that an immediate crash would produce only a modest initial loss, turning neutral and then positive as market losses deepen.", "speaker": "John P. Hussman", "type": "framework", "entities": ["options hedging", "S&P 500"], "conviction": "high", "so_what": "A concrete convex payoff template for participating in late-bubble upside without carrying crash risk.", "quote": null, "locator": "Again, we currently view a safety net as obligatory", "quote_verified": false}, {"claim": "News, earnings, fundamentals and economic events do not move markets directly — only investors' beliefs, perceptions and expectations do, so identical news can be positive or negative depending on whether it supports or refutes hopes and fears already in the collective mind.", "speaker": "John P. Hussman", "type": "framework", "entities": ["S&P 500", "investor sentiment"], "conviction": "high", "so_what": "Explains why bubbles can extend indefinitely on unchanged fundamentals and why positioning must be measured off internals and sentiment, not news.", "quote": "If people believe gibberish, it can and will affect their actions, even those actions are based on distorted perceptions.", "locator": "Still, every bit of news and information that affects the market", "quote_verified": true}, {"claim": "Every one of Hussman's market return/risk classifications is associated with both gains and losses — in any given week close to a coin flip — with the edge coming from differences in average return, distribution width, shape and especially the shape of the tails.", "speaker": "John P. Hussman", "type": "framework", "entities": ["S&P 500", "return/risk classifications"], "conviction": "high", "so_what": "A useful humility check: regime classification is a tail-shaping tool, not a weekly direction call.", "quote": "it’s close to a coin flip – but the average return, the width, the shape of the distributions, particularly the shape of the tails, is significantly different across these classifications", "locator": "Recall the “bell curves” that I’ve presented in prior comments", "quote_verified": true}, {"claim": "Hussman states he would be perfectly content with a never-ending bubble and equally content with an immediate collapse, and that nothing in his discipline relies on either outcome or on any scenario others assume he is forecasting.", "speaker": "John P. Hussman", "type": "thesis", "entities": ["Hussman Investment Trust"], "conviction": "high", "so_what": "Positions the approach as scenario-agnostic and convexity-based, which is the practical answer to the 'permabear' critique.", "quote": "If the current speculative bubble was to persist and expand, forever, we would be very content with that. If the bubble was to collapse immediately, we would be equally content.", "locator": "What has changed profoundly is the flexibility of our response", "quote_verified": true}, {"claim": "Hussman claims the more flexible classifications would have improved on his discipline's prior-cycle record including the tech bubble, the mortgage bubble and their subsequent collapses, while explicitly disclaiming any intent to 'get cute' with a bubble or reach for nickels in front of a steamroller.", "speaker": "John P. Hussman", "type": "thesis", "entities": ["tech bubble", "mortgage bubble", "S&P 500"], "conviction": "medium", "so_what": "Backtest claim to verify in real time; the stated test is whether constructive periods show a stair-step gain profile from here.", "quote": "We have no intention of “getting cute” with a bubble, or to reach for nickels in front of a steamroller.", "locator": "It’s particularly encouraging that our present, more flexible classifications", "quote_verified": true}, {"claim": "Hussman states that aside from the standing safety net he has no opinions, preferences or scenarios about the market even a month or a quarter ahead, and argues that if his discipline cannot say whether it will be constructive or negative in a few weeks, nobody else knows either.", "speaker": "John P. Hussman", "type": "thesis", "entities": ["S&P 500"], "conviction": "high", "so_what": "A direct argument against acting on short-horizon market forecasts from any source, including his own.", "quote": "if even we can’t say whether our investment stance will be constructive or negative even a few weeks or months from now, believe me, nobody else knows either", "locator": "But – aside from safety nets", "quote_verified": true}]}], "insight_total": 61, "top_entities": ["S&P 500", "Federal Reserve", "U.S. Treasury", "MarketCap/GVA", "AI", "hyperscalers", "OpenAI", "Anthropic", "Cast AI", "Robert Shiller", "Hyman Minsky", "OECD"], "source_meta": {"author": "@@HussmanFunds", "word_count": 9189, "paywalled": false}}, {"record_id": "3791a914ac8e0281", "source_type": "concepts", "source_name": "Oxford Economics", "source_url": "https://www.oxfordeconomics.com/resource/the-uks-investment-shortfall/", "title": "The UK's Investment Shortfall", "published_date": "2026-09-08", "language": "en", "processed_at": "2026-09-09T14:01:06Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Energy", "Positioning"], "gist": "Oxford Economics, commissioned by a consortium of UK infrastructure owners (Manchester Airports Group, London Gatwick, Getlink, Eurostar, GIIA and others), finds the UK has under-invested versus the G7 for 25 years to the tune of ~£1.9tn cumulative, leaving it with the G7's smallest productive capital stock relative to GDP. The gap is concentrated in business investment in long-lived physical assets, and is pinned on business property taxes, delivery costs and policy unpredictability; converging to the G7 average by 2040 would lift real GDP 1.7% permanently.", "themes": [{"theme": "Scale of the UK investment gap", "insights": [{"claim": "Had the UK invested at the G7 average rate since 2000, cumulative UK investment would have been around £1.9 trillion higher, according to Oxford Economics benchmarking of total and business investment over 2000-2025.", "speaker": "Suki Masana", "type": "data_point", "entities": ["UK", "G7", "OECD", "Oxford Economics"], "conviction": "high", "so_what": "Quantifies the size of the structural capex hole that any UK growth thesis must either assume gets filled or price as a permanent drag on trend growth.", "quote": "Had the UK invested at the G7 average rate since 2000, cumulative investment would have been around £1.9 trillion higher", "locator": "The report benchmarks UK total and business investment", "quote_verified": true}, {"claim": "The UK's productive capital stock is now the smallest in the G7 relative to GDP, the accumulated result of at least a quarter of a century of investing less than almost every comparable economy.", "speaker": "Suki Masana", "type": "data_point", "entities": ["UK", "G7"], "conviction": "high", "so_what": "A thin capital base caps UK supply-side capacity, arguing for structurally lower UK productivity growth and reinforcing the case for underweighting UK domestic cyclicals versus peers absent policy change.", "quote": "the UK’s productive capital stock is now the smallest in the G7 relative to GDP", "locator": "The report benchmarks UK total and business investment", "quote_verified": true}, {"claim": "The UK's investment shortfall is broad-based but concentrated in business investment — the only component whose gap with the rest of the G7 has actually widened over 2000-2025.", "speaker": "Suki Masana", "type": "thesis", "entities": ["UK", "G7", "business investment"], "conviction": "high", "so_what": "Points the diagnosis at corporate capex incentives rather than public spending, so watch business-rates and capital-allowance policy rather than headline government investment totals for the real signal.", "quote": "the shortfall is broad-based but concentrated in business investment – the only component whose gap with the rest of the G7 has widened", "locator": "The report benchmarks UK total and business investment", "quote_verified": true}, {"claim": "The UK's investment deficit sits in long-lived physical assets rather than intangibles, meaning the country's weakness is in buildings, plant and infrastructure rather than software and IP.", "speaker": "Suki Masana", "type": "framework", "entities": ["UK", "intangibles", "infrastructure"], "conviction": "high", "so_what": "Reframes the common 'the UK is fine because intangibles are mismeasured' rebuttal; the beneficiaries of any catch-up would be construction, engineering, grid and transport asset owners, not software.", "quote": "in long-lived physical assets rather than intangibles", "locator": "The report benchmarks UK total and business investment", "quote_verified": true}]}, {"theme": "Diagnosed causes of UK under-investment", "insights": [{"claim": "Three features consistently set the UK's investment environment apart from peers: the burden and design of recurrent taxes on business property, the cost of delivering and operating new capacity, and policy unpredictability.", "speaker": "Suki Masana", "type": "causal", "entities": ["UK", "business rates", "IMF", "OECD", "Bank of England", "OBR", "National Infrastructure Commission"], "conviction": "high", "so_what": "Gives a three-part checklist for judging whether any UK Budget measure is genuinely investment-positive; measures that fail all three are noise for UK capex-exposed equities.", "quote": "the burden and design of recurrent taxes on business property, the cost of delivering and operating new capacity, and policy unpredictability", "locator": "Drawing on evidence from the IMF, OECD, Bank of England", "quote_verified": true}, {"claim": "Recurrent taxes on business property are singled out for their design as well as their level, implying that a revenue-neutral business rates reform could still lift UK investment.", "speaker": "Suki Masana", "type": "thesis", "entities": ["UK", "business rates", "business property"], "conviction": "medium", "so_what": "Sets up a cheap policy option ahead of the Autumn Budget: watch for structural rates reform, which would disproportionately benefit property-heavy UK sectors such as retail, logistics and infrastructure.", "quote": "the burden and design of recurrent taxes on business property", "locator": "Drawing on evidence from the IMF, OECD, Bank of England", "quote_verified": true}, {"claim": "Policy unpredictability is treated as a first-order cause of weak UK capital formation on par with tax and delivery cost, because investors must have confidence in the environment over the whole life of a long-lived asset.", "speaker": "Suki Masana", "type": "causal", "entities": ["UK", "Global Infrastructure Investor Association"], "conviction": "high", "so_what": "Implies UK regulatory-regime stability is itself a valuation input for airports, rail concessions and utilities — repeated policy resets raise required returns even when headline tax rates are unchanged.", "quote": "improve confidence in the environment over the life of an asset", "locator": "The report does not prescribe a programme of reform", "quote_verified": true}]}, {"theme": "Convergence scenario and payoff", "insights": [{"claim": "In an Oxford Economics Global Economic Model scenario where UK business investment converges on the G7 average by 2040, real GDP ends 1.7% above baseline, the productive capital stock is 8.7% larger, and real household disposable income is 2.1% higher — about £1,540 per household.", "speaker": "Suki Masana", "type": "prediction", "entities": ["UK", "G7", "Oxford Economics Global Economic Model"], "conviction": "medium", "so_what": "Sets an upper bound on the macro payoff from UK investment reform: 1.7% of GDP over 15 years is real but modest, so avoid pricing UK capex reform as a growth regime change.", "quote": "Real GDP ends the period 1.7% above baseline, the productive capital stock is 8.7% larger, and real household disposable income is 2.1% higher – around £1,540 per household", "locator": "Using the Oxford Economics Global Economic Model", "quote_verified": true}, {"claim": "The gains from closing the UK's investment gap are characterised as permanent rather than cyclical, because they come through a larger capital stock and higher supply capacity rather than a demand boost.", "speaker": "Suki Masana", "type": "framework", "entities": ["UK", "capital stock"], "conviction": "high", "so_what": "Supply-side gains do not carry the usual inflation cost, so a credible UK investment revival would be a rare growth impulse the Bank of England need not lean against.", "quote": "with the gains permanent rather than cyclical", "locator": "Using the Oxford Economics Global Economic Model", "quote_verified": true}, {"claim": "Oxford Economics deliberately declines to prescribe a reform programme, instead offering a three-part test for judging proposals: whether they raise the return each pound of investment can earn, lower the cost of delivering it, or improve confidence over the life of an asset.", "speaker": "Suki Masana", "type": "framework", "entities": ["Oxford Economics", "UK"], "conviction": "high", "so_what": "A portable screen for scoring Budget and planning announcements quickly, separating genuine capex catalysts from headline-grabbing measures.", "quote": "whether they raise the return each pound of investment can earn, lower the cost of delivering it, or improve confidence in the environment over the life of an asset", "locator": "The report does not prescribe a programme of reform", "quote_verified": true}]}, {"theme": "Budget timing and sponsor positioning", "insights": [{"claim": "The report was published ahead of // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
