, {"theme": "Transferable Playbook: Build, Don't Capture", "insights": [{"claim": "The central transferable lesson is that the RSS declined the contest to recapture existing elite institutions — universities, legacy media, credentialing bodies — and built a parallel ecosystem of schools, service organizations, publishing houses and talent pipelines instead, so that by the time it engaged establishment institutions it had its own leaders to send into them.", "speaker": "Bill Drexel", "type": "framework", "entities": ["RSS", "universities", "legacy media", "India"], "conviction": "high", "so_what": "A playbook argument that parallel institution-building beats institutional capture on a 20-40 year horizon — directly relevant to where long-duration ideological and philanthropic capital should be deployed.", "quote": "Building is more effective than capturing, and a movement willing to operate outside the existing prestige hierarchies can produce a competitive one of its own within a generation or two.", "locator": "One lesson is that the RSS did not try to redirect the existing elite.", "quote_verified": true}, {"claim": "Most Western institutions that claim to identify and develop talent are actually just sorting candidates who already self-selected through legacy filters — prestigious universities and jobs — whereas a serious counter-elite requires doing the searching and the developing directly.", "speaker": "Bill Drexel", "type": "contrarian", "entities": ["RSS", "universities", "Western institutions"], "conviction": "high", "so_what": "Names a structural inefficiency in elite talent markets: the returns sit with whoever searches outside credential filters rather than bidding for pre-sorted candidates.", "quote": "Most Western institutions claiming to identify and develop talent are actually just sorting candidates who have already self-selected through legacy filters", "locator": "Over time, the RSS has been able to identify", "quote_verified": true}, {"claim": "The institutions that win the twenty-first century may be the ones that can offer disoriented and disenfranchised young men something to belong to and something challenging to overcome — physical or spiritual — which is precisely what the shakhas provide to millions of young Indian men from childhood.", "speaker": "Bill Drexel", "type": "prediction", "entities": ["RSS", "shakhas", "young men", "India"], "conviction": "high", "so_what": "Identifies a global demand gap — purpose and fraternity for young men — as an institution-building opportunity and a political fault line across developed societies.", "quote": "The institutions that win the twenty-first century may be the ones that can offer something to belong to and something challenging to overcome, be it physical or spiritual development.", "locator": "The fact that it provides these things to millions", "quote_verified": true}, {"claim": "Mandated austerity is an anti-degeneration mechanism: because pracharaks are celibate and forswear wealth they have no heirs to pass resources to, which in a culture dominated by family dynasties in business and politics provides credibility to the masses that dynastic elites cannot match.", "speaker": "Bill Drexel", "type": "framework", "entities": ["RSS", "pracharaks", "India"], "conviction": "high", "so_what": "Explains the durability of RSS-derived legitimacy against corruption attacks — a reputational moat dynastic Indian political families structurally lack.", "quote": "Celibate pracharaks don’t even have heirs to pass their resources on to.", "locator": "Crucially, it also calls these men to austerity", "quote_verified": true}, {"claim": "Contrary to prevailing beliefs among political scientists, civilization has strong salience at a popular level and recognition of it can serve as the practical basis for building civil society — the RSS's heterogeneity on economic and social issues would be unworkable without a shared Hindu civilizational identity transcending caste, language, class and geography.", "speaker": "Bill Drexel", "type": "contrarian", "entities": ["RSS", "BJP", "India", "political science"], "conviction": "high", "so_what": "If civilizational identity is the strongest available organizing principle for mass coalitions, expect civilizational rather than class or ideological framing to dominate emerging-market politics.", "quote": "contrary to the prevailing beliefs of today’s political scientists, there is strong salience to the idea of civilization at a popular level", "locator": "Its success also suggests that", "quote_verified": true}, {"claim": "The RSS operates parallel organizations in more than 40 countries, making its diaspora infrastructure a global rather than purely Indian phenomenon.", "speaker": "Bill Drexel", "type": "data_point", "entities": ["RSS", "diaspora", "India"], "conviction": "high", "so_what": "Diaspora political organization in the US, UK and Canada is a live channel for Indian domestic politics to spill into Western local politics — as the Bhagwat tour backlash demonstrated.", "quote": "With a network of parallel organizations in more than 40 countries", "locator": "The RSS’s goal is to train men physically", "quote_verified": true}]}], "insight_total": 35, "top_entities": ["RSS", "BJP", "Narendra Modi", "India", "Chinese Communist Party", "Muslim Brotherhood", "Mohan Bhagwat", "Sangh Parivar", "China", "Indian National Congress", "Pew Research Center", "United States"], "source_meta": {"author": "Bill Drexel", "word_count": 3917, "paywalled": false}}, {"record_id": "1a96600de8c86937", "source_type": "concepts", "source_name": "Peterson Institute (PIIE)", "source_url": "https://www.piie.com/blogs/realtime-economics/2026/youre-already-getting-socialism-and-democratic-socialists-have", "title": "You're already getting socialism—and Democratic Socialists have nothing to do with it", "published_date": "2026-09-10", "language": "en", "processed_at": "2026-09-12T17:27:56Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Geopolitics", "Tech", "Society", "AI", "Positioning"], "gist": "Using V-Dem's State Ownership of Economy index, PIIE's Cullen Hendrix shows the US took one of the largest single-year jumps toward state control of any country since 2005 during 2025 — falling from a near-permanent top-4 rank to 16th of 179 — driven not by the left but by the Trump administration's equity stakes in 30+ semiconductor, critical mineral, and quantum firms (including 10% of Intel) and its 'golden share' in Nippon Steel. His argument is that the level of state ownership is not the risk; the ad-hoc, privately negotiated, executive-discretion terms are, because that structure historically degenerates into Louis XIV-style rent-seeking rather than Temasek-style technocratic stewardship.", "themes": [{"theme": "The statist turn is coming from the right, not the left", "insights": [{"claim": "The measurable shift toward state ownership and control of the US economy in 2025 came from a Republican-controlled White House taking equity stakes in semiconductor firms and veto power over steelmakers — not from Democratic Socialist policy, which holds at most three congressional seats (Tlaib, Ocasio-Cortez, and generously Sanders).", "speaker": "Cullen S. Hendrix", "type": "contrarian", "entities": ["Trump administration", "Democratic Socialists", "Zohran Mamdani", "Bernie Sanders", "Alexandria Ocasio-Cortez", "Rashida Tlaib", "Intel", "Nippon Steel"], "conviction": "high", "so_what": "Investors pricing 'socialism risk' off Mamdani-style election headlines are watching the wrong variable; the policy channel that actually moves cap tables is federal equity-taking and golden shares under a GOP administration.", "quote": "That pivot is not being overseen by the intellectual descendants of early 20th century socialist leader Eugene V. Debs—it is coming from the Trump administration.", "locator": "Yet according to the most rigorous comparative measure", "quote_verified": true}, {"claim": "The right analytical question about US industrial policy is not whether the economy is becoming more statist but how the state exercises that control, because state ownership can coexist durably with economic freedom and innovation or become a vehicle for patronage and rent-seeking.", "speaker": "Cullen S. Hendrix", "type": "framework", "entities": ["Trump administration", "United States"], "conviction": "high", "so_what": "Frames the actual investable distinction: governance terms (transparency, arm's-length management, benchmarks) matter more for long-run returns than the headline fact of a government stake.", "quote": "The terms under which these stakes have been acquired and managed by the administration—ad-hoc, privately negotiated, and with significant executive discretion—are more troubling than the equity stakes themselves.", "locator": "The real question is not whether the US economy", "quote_verified": true}, {"claim": "Labeling federal equity acquisitions as 'industrial policy focused on national security and economic competitiveness' does not change their analytical character — they remain socialistic by the ownership/control definition even if the national-security rationale is accurate.", "speaker": "Cullen S. Hendrix", "type": "thesis", "entities": ["Trump administration"], "conviction": "high", "so_what": "Expect the political framing to keep obscuring a real structural change in US corporate ownership; model the balance-sheet and governance reality, not the branding.", "quote": "But the acquisitions are no less socialistic for it.", "locator": "The Trump administration is obviously not framing", "quote_verified": true}]}, {"theme": "Defining and measuring state control", "insights": [{"claim": "The analytically correct definition of socialism is public or state ownership and/or control of productive resources, which is distinct from redistribution, worker empowerment, and egalitarianism — meaning economies as different as Qatar, New Zealand, and the Soviet Union all classify as socialist.", "speaker": "Cullen S. Hendrix", "type": "framework", "entities": ["Qatar", "New Zealand", "Soviet Union"], "conviction": "high", "so_what": "Separating the ownership axis from the redistribution axis lets an investor spot state-control risk in ostensibly pro-business regimes and avoid mispricing left-wing rhetoric as ownership risk.", "quote": "The defining feature of socialism is public or state ownership and/or control of productive resources.", "locator": "What is socialism?", "quote_verified": true}, {"claim": "Terms like dirigisme, state capitalism, social democracy, and 'socialism' conflate three separate dimensions that should be scored independently: who owns or controls productive assets, whether redistribution runs upward or downward, and how much direct discretion the executive holds over those assets.", "speaker": "Cullen S. Hendrix", "type": "framework", "entities": ["United States"], "conviction": "high", "so_what": "A three-axis scorecard is the cleanest way to compare policy regimes across countries; the executive-discretion axis is the one most correlated with expropriation and favoritism risk.", "quote": null, "locator": "These terms conflate at least three analytically distinct dimensions", "quote_verified": false}, {"claim": "State control is frequently hidden from balance sheets and exerted through regulatory leverage, procurement, tariffs, credit allocation, and political pressure, which is why credible measurement relies on expert assessment rather than observable ownership data.", "speaker": "Cullen S. Hendrix", "type": "causal", "entities": ["V-Dem"], "conviction": "high", "so_what": "Screening portfolios for 'government ownership' understates true state exposure; tariff exemptions and credit allocation are the invisible channels to monitor.", "quote": "These mechanisms facilitate control without appearing as ownership on a balance sheet.", "locator": "Measuring state ownership and control", "quote_verified": true}, {"claim": "The US government's golden share in Nippon Steel confers no equity and pays no dividends but allows Washington to appoint a board member and veto plant closures, idling, job transfers, and headquarters relocation — control without ownership.", "speaker": "Cullen S. Hendrix", "type": "data_point", "entities": ["Nippon Steel", "U.S. Steel", "Trump administration"], "conviction": "high", "so_what": "Capacity rationalization and restructuring optionality are now politically constrained at U.S. Steel assets, a structural drag on margin recovery that conventional ownership screens won't flag.", "quote": "It is control without ownership.", "locator": "The US government's \"golden share\" in Nippon Steel", "quote_verified": true}, {"claim": "Heritage Foundation-style 'economic freedom' indices measure regulatory burden and ease of doing business rather than state ownership, and correlate only moderately with V-Dem's state ownership measure (r = 0.56, n = 166) — Singapore ranks 1st on Heritage yet 138th on state ownership because of Temasek's footprint.", "speaker": "Cullen S. Hendrix", "type": "data_point", "entities": ["Heritage Foundation", "Fraser Institute", "V-Dem", "Singapore", "Temasek", "World Bank"], "conviction": "high", "so_what": "Country-risk models built on economic-freedom indices are blind to state-ownership exposure; the two measures need to be used together, not interchangeably.", "quote": "Singapore ranks no. 1 on the Heritage economic freedom measure and 138th on the V-Dem measure of state ownership/control", "locator": "The correlation between Heritage's economic freedom measure", "quote_verified": true}, {"claim": "Heritage's own 2026 index writeup scores the US at 72.8 (22nd freest), up 2.6 points, and explicitly credits 'the Trump Administration's pragmatic pro-growth economic strategy' — evidence that such indices embed normative assumptions the V-Dem measure avoids.", "speaker": "Cullen S. Hendrix", "type": "data_point", "entities": ["Heritage Foundation", "Trump administration", "United States"], "conviction": "high", "so_what": "Treat ideologically sponsored index revisions as commentary rather than data when building sovereign risk scores.", "quote": "The Heritage Foundation is not particularly coy about this", "locator": "Notes, 3.", "quote_verified": true}]}, {"theme": "Scale of the 2025 US shift", "insights": [{"claim": "The US had never ranked worse than 4th of 179 countries for least state control of the economy over two decades, often sitting 2nd behind Japan, but in 2025 it dropped to 16th, with 15 countries now less state-controlled and 163 more.", "speaker": "Cullen S. Hendrix", "type": "data_point", "entities": ["United States", "Japan", "V-Dem", "North Korea"], "conviction": "high", "so_what": "A quantified regime change in US institutional character that credit and equity risk premia on US assets have not obviously repriced.", "quote": "In 2025, the first year of the Trump administration, the United States came under more state control of its economy, and 15 countries now have less state control than the United States, while 163 have more.", "locator": "How socialist is the US economy already?", "quote_verified": true}, {"claim": "Only about 1.2 percent of all year-over-year V-Dem state-ownership score changes since 2005 were larger than the 2025 US shift, and the comparably large moves come from Afghanistan, Burkina Faso, Honduras, the Maldives, Myanmar, and South Sudan — not advanced economies.", "speaker": "Cullen S. Hendrix", "type": "data_point", "entities": ["United States", "Afghanistan", "Burkina Faso", "Honduras", "Maldives", "Myanmar", "South Sudan", "V-Dem"], "conviction": "high", "so_what": "The US institutional shift is statistically in the company of war- and coup-affected states, a tail event worth flagging in any long-horizon US institutional-stability thesis.", "quote": "The largest year-over-year changes in the sample are driven by countries like Afghanistan, Burkina Faso, Honduras, the Maldives, Myanmar, and South Sudan", "locator": "The US change in these rankings was not small", "quote_verified": true}, {"claim": "Rank-based country measures can move purely from other countries' scores shifting, and 5.3 percent of country-years initially flagged as rank shocks showed no meaningful change in the country's own underlying score.", "speaker": "Cullen S. Hendrix", "type": "framework", "entities": ["V-Dem"], "conviction": "medium", "so_what": "A methodological caveat for anyone trading off index-rank headlines: check the underlying score, not the league-table position.", "quote": null, "locator": "Notes, 5.", "quote_verified": false}]}, {"theme": "Equity stakes as the delivery mechanism", "insights": [{"claim": "Most of the increase in US state ownership has taken the form of equity stakes rather than outright nationalizations, making the shift far less politically visible than it otherwise would be.", "speaker": "Cullen S. Hendrix", "type": "causal", "entities": ["Trump administration", "United States"], "conviction": "high", "so_what": "The low salience of the mechanism means political resistance stays muted and the program can keep expanding — a reason to expect more deals, not fewer.", "quote": "Most of the increase in state ownership and control has taken the form of equity stakes", "locator": "Most of the increase in state ownership", "quote_verified": true}, {"claim": "The Trump administration has accumulated equity or equity-like stakes in over 30 firms across semiconductors, critical minerals, and quantum computing, with the single largest being a 10 percent stake in Intel negotiated in 2025 that converted prior federal grants into equity.", "speaker": "Cullen S. Hendrix", "type": "data_point", "entities": ["Intel", "Trump administration", "semiconductors", "critical minerals", "quantum computing"], "conviction": "high", "so_what": "Grant-to-equity conversion is now the template; any company holding federal subsidies in these three sectors should be modeled as carrying potential dilution and a political shareholder.", "quote": "a portfolio of equity or equity-like stakes in over 30 firms", "locator": "Under the Trump administration, the United States has acquired", "quote_verified": true}, {"claim": "Both politicians and the industry itself are calling for the US government to take equity stakes in artificial intelligence hyperscalers that have not yet gone public.", "speaker": "Cullen S. Hendrix", "type": "prediction", "entities": ["artificial intelligence hyperscalers", "artificial intelligence", "Trump administration"], "conviction": "medium", "so_what": "Pre-IPO AI infrastructure names are the next candidates for federal equity; private-market investors should price the possibility of a government cap-table entry and the governance strings attached.", "quote": "for the US government to take equity stakes in artificial intelligence hyperscalers who have yet to go public.", "locator": "Calls are coming both from politicians", "quote_verified": true}, {"claim": "Unlike the 2008 stakes in GM, distressed banks, AIG, and the Fannie Mae/Freddie Mac conservatorships — and unlike the Great Depression interventions — the current acquisitions are happening amid economic growth, low unemployment, and financial market stability, making them proactive and open-ended rather than temporary crisis lifelines.", "speaker": "Cullen S. Hendrix", "type": "contrarian", "entities": ["General Motors", "AIG", "Fannie Mae", "Freddie Mac", "Trump administration"], "conviction": "high", "so_what": "There is no crisis-resolution off-ramp built into these stakes the way TARP had one, so assume the government stays on the register indefinitely rather than exiting on recovery.", "quote": "These are proactive, open-ended acquisitions, not temporary lifelines.", "locator": "In contrast, the Trump administration's acquisitions", "quote_verified": true}]}, {"theme": "Why the slippery-slope argument fails", "insights": [{"claim": "There have been no genuine transitions to communism in over 50 years (the last in 1975), and the three plausibly communist regimes in 2026 — Cuba, North Korea, and Laos — together account for less than 0.2 percent of global GDP.", "speaker": "Cullen S. Hendrix", "type": "data_point", "entities": ["Cuba", "North Korea", "Laos", "China", "Deng Xiaoping"], "conviction": "high", "so_what": "Deflates the communism tail-risk narrative; China should be modeled as highly interventionist market-oriented socialism, not a planned economy exporting ideology.", "quote": "China's model is more accurately described as highly interventionist market-oriented socialism than a communist, planned economy", "locator": "Is it a slippery slope to communism?", "quote_verified": true}, {"claim": "Across 2000–2025, countries that experienced state-control score shocks above the 95th percentile split roughly evenly in what followed — 30 percent reversed within five years, 32 percent kept moving further, and 38 percent held steady — so a single year's shift predicts very little about persistence.", "speaker": "Cullen S. Hendrix", "type": "data_point", "entities": ["V-Dem"], "conviction": "high", "so_what": "Base rates argue against extrapolating the 2025 US move into a deterministic statist trend; position for a wide distribution of outcomes rather than a one-way ratchet.", "quote": "30 percent improved within five years, 32 percent kept falling, and 38 percent held steady", "locator": "Across the 2000–2025 period", "quote_verified": true}, {"claim": "High state ownership is compatible with high assessed economic freedom and with regime types from authoritarian constitutional monarchy to consolidated democracy, as shown by Singapore, Bahrain, Botswana, Malaysia, Uruguay, and New Zealand's alternation between high and low state control.", "speaker": "Cullen S. Hendrix", "type": "thesis", "entities": ["Singapore", "Bahrain", "Botswana", "Malaysia", "Uruguay", "New Zealand"], "conviction": "high", "so_what": "State-ownership levels alone are a weak signal for country risk; pair them with institutional quality before discounting an equity market.", "quote": null, "locator": "Countries can durably sustain comparatively high levels", "quote_verified": false}, {"claim": "Even the Soviet Union, the most extensive public-ownership experiment attempted, allowed collective farms in later years to sell produce at market prices once state quotas were filled — evidence that all real economies commingle public and private ownership rather than being either/or.", "speaker": "Cullen S. Hendrix", "type": "framework", "entities": ["Soviet Union", "Singapore", "Temasek", "New York Times"], "conviction": "high", "so_what": "Rejects binary 'is this still capitalism' framing; the useful variable is the position on a continuum plus the governance terms.", "quote": "In fact, all economies throughout history have commingled public and private ownership to at least some extent.", "locator": "The concept is often treated as either/or", "quote_verified": true}]}, {"theme": "Governance terms and the rent-seeking risk", "insights": [{"claim": "Temasek and Singapore's sovereign wealth fund show that state ownership can be benign when run by technocrats at arm's length from politics with transparent mandates and performance benchmarks, leaving the state a mostly passive day-to-day investor.", "speaker": "Cullen S. Hendrix", "type": "framework", "entities": ["Temasek", "Singapore"], "conviction": "high", "so_what": "Gives investors a concrete benchmark against which to judge any US sovereign-stake vehicle: arm's-length technocratic management, published mandate, performance benchmarks.", "quote": "the state is, in the day-to-day sense, a mostly passive investor", "locator": "Temasek, Singapore's massive state-owned holding company", "quote_verified": true}, {"claim": "When state control is exercised ad-hoc through privately negotiated channels without independent oversight, the benefits typically get redistributed to politically connected clients and away from the public — the core concern with the Trump administration's approach.", "speaker": "Cullen S. Hendrix", "type": "causal", "entities": ["Trump administration"], "conviction": "high", "so_what": "Political connectedness becomes a priced factor in US equities; firms with access capture rents while unconnected competitors face a structural cost disadvantage.", "quote": "state ownership and control typically redistribute benefits to politically connected clients and away from the public", "locator": "What is much more corrosive", "quote_verified": true}, {"claim": "Privately negotiated tariff exemptions are the trade-policy analog of the equity-stake patronage logic, exemplified by Belgium's diamond industry securing zero tariffs on $2 billion in annual polished diamond exports in September 2025 and then presenting Trump with a jewel-encrusted ring.", "speaker": "Cullen S. Hendrix", "type": "anecdote", "entities": ["Belgium", "diamond industry", "Trump administration", "tariffs"], "conviction": "high", "so_what": "Tariff-exemption lobbying now has demonstrable and very high ROI, which means exemption outcomes — not published tariff schedules — determine relative winners in trade-exposed sectors.", "quote": "How else should one interpret Belgium's diamond industry securing zero tariffs on $2 billion in annual polished diamond exports in September 2025, then presenting Trump with a jewel-encrusted ring?", "locator": "It is the domestic analog to the administration's privately negotiated tariff exemptions", "quote_verified": true}, {"claim": "Louis XIV's France is the cautionary template: wealth flowed through royal charters and monopolies granted on court connections rather than market competition, producing a brief boom followed by 18th-century stagnation while parliamentary-constrained Britain pulled ahead.", "speaker": "Cullen S. Hendrix", "type": "framework", "entities": ["France", "Britain", "Louis XIV", "Trump administration"], "conviction": "high", "so_what": "The historical analogy implies near-term growth can look fine while competitiveness erodes — a slow-burn risk that shows up with a multi-year lag, not in current macro prints.", "quote": "France boomed briefly; by the 18th century, it stagnated while Britain—its government's role in the economy constrained by parliament and allowing genuine market competition—leapt ahead.", "locator": "State direction of the political economy was famously characteristic", "quote_verified": true}, {"claim": "Rent-seeking saps competitiveness through a direct resource-reallocation channel: a dollar spent lobbying for regulatory favor is a dollar not spent on R&D, and the accompanying consolidation of political power is the real risk rather than communism.", "speaker": "Cullen S. Hendrix", "type": "causal", "entities": ["United States", "Trump administration"], "conviction": "high", "so_what": "Watch corporate lobbying spend versus R&D intensity in the stake-taking sectors as a leading indicator of the productivity cost of this policy regime.", "quote": "A dollar spent lobbying for regulatory favor is a dollar not spent on research and development.", "locator": "The Trump administration's \"golden share\" in Nippon Steel", "quote_verified": true}, {"claim": "Neither private nor state ownership is politically neutral — a private firm answers to shareholders and a state-owned firm answers to political actors — so the analysis should focus on the nature of control rather than searching for a neutral structure.", "speaker": "Cullen S. Hendrix", "type": "framework", "entities": ["Temasek"], "conviction": "high", "so_what": "Removes the ideological prior from due diligence: ask whose interests the controlling party serves and through what process, in both public and private ownership cases.", "quote": "A private firm answers to shareholders; a state-owned firm answers to political actors. Neither is politically neutral.", "locator": "All ownership structures—whether state or private", "quote_verified": true}]}], "insight_total": 26, "top_entities": ["Trump administration", "Intel", "Nippon Steel", "V-Dem", "Temasek", "Singapore", "Heritage Foundation", "United States", "China", "artificial intelligence hyperscalers", "Democratic Socialists", "Belgium"], "source_meta": {"author": "Cullen S. Hendrix", "word_count": 2617, "paywalled": false}}, {"record_id": "d82e8d825b4a71ea", "source_type": "concepts", "source_name": "Works in Progress", "source_url": "https://worksinprogress.co/issue/do-people-prefer-traditional-architecture/", "title": "Do people prefer traditional architecture? - Works in Progress Magazine", "published_date": "2026-09-11", "language": "en", "processed_at": "2026-09-12T17:28:08Z", "processor": "claude-code-sub-opus", "tags": ["Society", "AI"], "gist": "Roughly twenty properly sampled visual preference surveys since the 1990s show 60-92 percent of the public prefers traditional architecture over modernist designs, with the preference holding across age, gender, politics, race, income and nationality; AI image editing has recently collapsed the cost of producing tightly controlled image pairs, creating a 'golden age' of such surveying. The author's closing puzzle is a stated-versus-revealed preference gap: over 99 percent of architects practice modernist styles and Britain has commissioned almost no public building in a traditional style since the 1950s, even in stylistically neutral planning regimes.", "themes": [{"theme": "The headline finding: a 70-90 percent traditionalist supermajority", "insights": [{"claim": "Across every properly sampled visual preference survey on architectural style run since the 1990s, more than 60 percent of respondents have favored traditional architecture, with many studies showing over 85 percent support.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["visual preference surveys", "modernist architecture", "traditional architecture"], "conviction": "high", "so_what": "A consistent 60-90 percent consumer preference that the supply side ignores is the classic setup for an underserved market; watch housebuilders and developers who can price traditional facades at a premium.", "quote": "In every survey conducted, over 60 percent of the respondents have favored traditional architecture, with many revealing over 85 percent support.", "locator": "In every survey conducted, over 60 percent", "quote_verified": true}, {"claim": "The author's provisional bottom line is that 70 to 90 percent of the population has a clear preference for traditional architecture, with every demographic group — men and women, old and young, rich and poor — favoring traditional design, and demographic tilts being only slight.", "speaker": "WorksInProgMag", "type": "thesis", "entities": ["traditional architecture", "modernist architecture", "demographics"], "conviction": "medium", "so_what": "Because the preference is demographically flat, it can't be dismissed as a niche or aging-cohort taste — it will not fade as boomers exit the market.", "quote": "For now, the provisional conclusion is that 70 to 90 percent of the population has a clear preference for traditional architecture.", "locator": "For now, the provisional conclusion", "quote_verified": true}, {"claim": "The preference for traditional design extends beyond housing to hospitals, commercial buildings and civic buildings, meaning it is not confined to the one segment (private housing) where the market already supplies it.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["hospitals", "commercial buildings", "civic buildings", "housing"], "conviction": "medium", "so_what": "The gap between preference and supply is widest in institutional and commercial property, where procurement is professionalized — the likeliest place for a policy or reputational shock.", "quote": "This holds not only for houses but also for hospitals and commercial and civic buildings.", "locator": "This holds not only for houses", "quote_verified": true}, {"claim": "In a 1998 British Market Research Bureau survey for the Popular Housing Forum, 94 percent of potential newbuild buyers said they would prefer to live in one of the more traditional options and 92 percent of other respondents preferred a traditional option to be built near them.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["British Market Research Bureau", "Popular Housing Forum", "UK housebuilding"], "conviction": "medium", "so_what": "Near-unanimous buyer preference in the one segment that is genuinely market-driven explains why UK volume housebuilders already build pastiche traditional — and why the pattern breaks in non-market segments.", "quote": "94 percent of potential newbuild buyers said they would prefer to live in one of the more traditional options", "locator": "The first properly sampled visual preference survey followed in 1998", "quote_verified": true}]}, {"theme": "Preference is demographically flat — including politically", "insights": [{"claim": "In the 2020 National Civic Art Society survey of US federal and courthouse buildings, traditional designs won by an average of 72 percent across seven controlled image pairs, with essentially no partisan split: 70 percent of Democrats and 73 percent of Republicans preferred traditional.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["National Civic Art Society", "United States", "federal courthouses", "Democrats", "Republicans"], "conviction": "high", "so_what": "A design-standards mandate for federal buildings is one of the rare policy levers with genuine cross-party polling cover — low political cost, so it can move faster than most expect.", "quote": "There was almost no correlation with political affiliation, with 70 percent of Democrats and 73 percent of Republicans preferring the traditional designs.", "locator": "As in other studies, most striking is how little", "quote_verified": true}, {"claim": "In the same US survey, 75 percent of white Americans, 65 percent of Hispanic Americans and 62 percent of black Americans preferred traditional designs, with no significant correlation to income or education and age only a weak predictor (77 percent of over-65s versus 68 percent of 18-34s).", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["National Civic Art Society", "United States", "demographics"], "conviction": "high", "so_what": "Kills the 'elite versus populist' and 'old versus young' framings of the architecture debate — the only real cleavage left is professional versus lay.", "quote": null, "locator": "75 percent of white Americans preferred traditional architecture", "quote_verified": false}, {"claim": "The demographic tilts that do exist are weak and not always in the expected direction: in the HS2 viaduct survey, Labour voters were slightly more pro-traditional than Conservatives (72 versus 69 percent) and younger respondents more pro-traditional than older ones (70 versus 64 percent).", "speaker": "WorksInProgMag", "type": "contrarian", "entities": ["HS2", "Create Streets", "Labour Party", "Conservative Party"], "conviction": "medium", "so_what": "Undercuts the assumption that traditionalism is a right-coded or nostalgic preference; the political economy of design standards is less predictable than the culture-war framing implies.", "quote": "Anomalously, the survey also found that Labour voters were slightly more pro-traditional than Conservatives (72 against 69 percent) and younger people more than older people", "locator": "These results varied only modestly along demographic lines", "quote_verified": true}, {"claim": "Even in the youngest cohort most open to modernism, the traditional option still wins decisively: 18-24 year olds preferred the classical Bath stadium design by 61 to 39 percent.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["Apollodorus Architecture", "Create Streets", "Bath", "rugby stadium"], "conviction": "high", "so_what": "The generational-replacement argument for modernism has no empirical support — a preference this stable across cohorts is a durable demand signal, not a fashion cycle.", "quote": null, "locator": "Older people were, as in most studies, more traditional", "quote_verified": false}]}, {"theme": "AI as the enabling technology for controlled preference research", "insights": [{"claim": "Artificial intelligence has sharply cut the time and cost of generating matched architectural images, making reliable large-scale visual preference surveys feasible for the first time and driving what the author calls a golden age of the method since roughly 2020.", "speaker": "WorksInProgMag", "type": "causal", "entities": ["artificial intelligence", "image editing", "visual preference surveys", "Create Streets", "The Aesthetic City"], "conviction": "high", "so_what": "A cheap AI capability is unlocking a whole class of evidence that was previously cost-prohibited — a template for where else generative imaging turns qualitative debates into settled empirical ones.", "quote": "In the past few years, artificial intelligence has greatly reduced the time and costs of producing comparable images, making reliable large-scale visual preference surveys far more feasible.", "locator": "In the past few years, artificial intelligence", "quote_verified": true}, {"claim": "The Aesthetic City's 2025 Dutch survey used AI to generate the traditional counterfactual from a photograph of an actual modernist building in all but one of eight image pairs, holding context, weather and massing constant — a methodology that removes the standard confounders critics used to dismiss earlier studies.", "speaker": "WorksInProgMag", "type": "framework", "entities": ["The Aesthetic City", "Netherlands", "artificial intelligence"], "conviction": "high", "so_what": "The photograph-plus-AI-counterfactual pair is now the reference method; expect every future architecture consultation fight to be argued with these images.", "quote": "In all but one image pair, they used a photograph of a modernist building and then used AI to create the traditional alternative.", "locator": "The Dutch study is notable for showing how useful artificial intelligence is", "quote_verified": true}, {"claim": "Dutch respondents in the 2025 Aesthetic City survey preferred traditional buildings in a range of 67 to 92 percent across eight image pairs, averaging 82 percent — higher than comparable British or American results.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["The Aesthetic City", "Netherlands"], "conviction": "high", "so_what": "Continental results running above Anglo ones suggests the finding is not an artifact of British royal-patronage politics; the effect travels.", "quote": null, "locator": "Continental Europeans appear to prefer traditional architecture", "quote_verified": false}]}, {"theme": "The expert-lay divergence", "insights": [{"claim": "David Halpern's 1987 Cambridge study found that architecture students and non-architecture students agreed closely on which faces were attractive but held wildly divergent, often directly opposite, views on buildings — evidence that architectural training, not general aesthetic sense, is what separates professional from public taste.", "speaker": "WorksInProgMag", "type": "causal", "entities": ["David Halpern", "Cambridge", "architecture education"], "conviction": "high", "so_what": "The face-rating control is the key analytical move: it isolates professional socialization as the cause, which means the supply-side blockage sits in architecture schools, not in some innate elite sensibility.", "quote": "Students on different programs had similar views on which faces were the most attractive. But when it came to buildings, architecture students held wildly different views from those in other disciplines.", "locator": "Halpern showed volunteer students photographs of twelve people and twelve buildings", "quote_verified": true}, {"claim": "The Halpern expert-lay divergence has been replicated in Canada in 2001, Britain in 2015 and Chile in 2019, making it one of the more robust cross-national findings in the literature.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["David Halpern", "Canada", "Britain", "Chile"], "conviction": "medium", "so_what": "Replication across three continents and thirty years means the professional-public gap is structural, not a local quirk — it will not self-correct.", "quote": null, "locator": "studies have since been run in Canada in 2001", "quote_verified": false}, {"claim": "Luis Balula's 2008-2009 survey in Evora, Portugal found experts and non-experts converged in rating older buildings highly but inverted on modern designs — non-experts liked a pastiche Mediterranean housing group that experts disliked, and experts rated positively a modernist apartment block that non-experts rated negatively.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["Luis Balula", "Evora", "Portugal"], "conviction": "medium", "so_what": "Agreement on heritage but inversion on new build localizes the conflict precisely to new construction — the only place where it costs money.", "quote": null, "locator": "Portuguese researcher Luis Balula carried out a visual preference survey", "quote_verified": false}, {"claim": "The Commission for Architecture and the Built Environment's 2005 report expressed regret that modern styles' advantages in light and large windows 'does not seem to have been understood by home buyers', which the author reads as evidence that professionals interpret contrary public preference as public failure to understand rather than as a signal.", "speaker": "WorksInProgMag", "type": "anecdote", "entities": ["CABE", "Commission for Architecture and the Built Environment", "UK"], "conviction": "medium", "so_what": "When even the public body commissioning the research treats the result as a comprehension problem, the feedback loop from consumer preference to supply is broken by design.", "quote": "The Modern Movement’s concern for light and sun and large windows should give a modern style a clear advantage over more traditional designs, but this advantage does not seem to have been understood by home buyers", "locator": "Two visual preference surveys were commissioned in 2002 and 2005", "quote_verified": true}, {"claim": "Prize-winning modernist buildings do not close the gap: in ADAM Architecture's 2009 survey, two award-winning modernist commercial buildings drew only 23 percent support against 77 percent for two traditional designs, despite matched perspectives and lighting.", "speaker": "WorksInProgMag", "type": "contrarian", "entities": ["ADAM Architecture", "commercial buildings"], "conviction": "high", "so_what": "Directly rebuts the 'they only tested bad modernism' defense — professional acclaim and public appeal are close to inversely related.", "quote": "Both of the modernist buildings had won prizes, suggesting that they were especially well-designed examples. Even so, only 23 percent of respondents preferred them", "locator": "One of the best early visual preference surveys was commissioned", "quote_verified": true}, {"claim": "Even the world's most prestigious practices lose these head-to-heads: 71 percent of over 2,000 British adults preferred Create Streets' Gothic counterproposal for a new Christ's College Cambridge library to the actual 2025 proposal by Grafton Architects, which got 21 percent.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["Grafton Architects", "Christ's College Cambridge", "Create Streets"], "conviction": "high", "so_what": "Star-architect brand equity carries no weight with the public, which weakens the reputational justification institutions use for premium design fees.", "quote": null, "locator": "In 2025, Christ's College Cambridge announced plans", "quote_verified": false}]}, {"theme": "Live UK development fights as natural experiments", "insights": [{"claim": "Create Streets' survey of 3,130 British adults on the Marks and Spencer Oxford Street site produced its strongest result ever: 79 percent backed a Francis Terry scheme retaining and extending the existing 1920s facade at the same floor area, against 17 percent for M&S's demolition-and-modern-rebuild plan.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["Marks and Spencer", "Francis Terry", "Create Streets", "Oxford Street", "London"], "conviction": "high", "so_what": "Retrofit-plus-facade-retention schemes carry overwhelming public support at equal floor area, which strengthens objectors' hand in high-profile demolition consents and raises planning risk for demolition-led retail and office redevelopment.", "quote": null, "locator": "The British retailer Marks and Spencer is planning to demolish", "quote_verified": false}, {"claim": "Londoners were only marginally more favorable to Marks and Spencer's modern proposal than the national average and still backed the traditional Terry scheme 72 to 26 percent, undercutting the idea that urban, design-literate populations are the constituency for modernism.", "speaker": "WorksInProgMag", "type": "contrarian", "entities": ["Marks and Spencer", "London", "Francis Terry"], "conviction": "medium", "so_what": "Developers cannot appeal to a sophisticated local audience to justify contested schemes — the local electorate polls the same as everyone else.", "quote": null, "locator": "Londoners were a little more likely to favor", "quote_verified": false}, {"claim": "The public's preference for traditional treatment extends to infrastructure, not just buildings: a Create Streets survey found 69 percent preferred a red-brick-clad HS2 viaduct emulating nineteenth-century railway viaducts against 28 percent for HS2's planned concrete design, with only building treatment varying between images.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["HS2", "Create Streets", "London", "Birmingham", "infrastructure"], "conviction": "high", "so_what": "Cladding and treatment choices on megaprojects are a cheap lever for public consent; infrastructure sponsors facing local opposition may be leaving easy goodwill on the table.", "quote": null, "locator": "The same trend shows up in infrastructure", "quote_verified": false}, {"claim": "In the Shoreditch Works poll, 76 to 78 percent of respondents preferred proposed traditionally-styled office blocks drawing on Victorian commercial and Art Deco precedent over existing postwar warehouses, even though the new buildings were drastically taller — a test deliberately loaded against the traditional option by the usual assumption that the public dislikes high-rise.", "speaker": "WorksInProgMag", "type": "contrarian", "entities": ["Shoreditch Works", "Create Streets", "London", "Art Deco"], "conviction": "medium", "so_what": "Suggests style can buy density: developers may be able to trade traditional facade treatment for additional height in contested urban schemes, a directly monetizable finding.", "quote": "The standard view is that the public dislikes high-rise development, meaning that this study could be seen as ‘biased against’ traditional architecture. But in each case, between 76 and 78 percent of respondents preferred the proposed scheme", "locator": "Most of the studies we have looked at aim to control", "quote_verified": true}, {"claim": "Britain's unusually active visual preference survey industry is partly a product of the King's championship of traditional urbanism, which has kept architectural debate politically live there in a way it is not elsewhere.", "speaker": "WorksInProgMag", "type": "causal", "entities": ["United Kingdom", "the King", "Create Streets"], "conviction": "medium", "so_what": "Explains why the UK is the leading indicator for design-code policy shifts — watch Britain first for regulatory changes that later travel.", "quote": null, "locator": "Many are British, partly because the King's championship", "quote_verified": false}]}, {"theme": "Caveats, sponsor bias and the thin evidence base", "insights": [{"claim": "Perhaps only three dozen fully controlled image pairs have ever been polled, and the high-quality studies exist only in Britain, the Netherlands and the United States, so the author expects the evidence base to triple or quadruple within a decade before firm conclusions can be drawn.", "speaker": "WorksInProgMag", "type": "prediction", "entities": ["visual preference surveys", "Britain", "Netherlands", "United States"], "conviction": "medium", "so_what": "Anyone building policy or a product thesis on this finding is doing so on ~36 data points — the next decade of surveys is the real catalyst to watch.", "quote": "perhaps only three dozen fully controlled image pairs have ever been polled on", "locator": "Visual preference surveying on architectural style is still in its infancy", "quote_verified": true}, {"claim": "The author concedes the strongest objection to the literature: most visual preference surveys have been commissioned by organizations sympathetic to traditional architecture, with only a handful of counterexamples like the early CABE studies, raising the suspicion of loaded image selection.", "speaker": "WorksInProgMag", "type": "thesis", "entities": ["Create Streets", "CABE", "National Civic Art Society", "The Aesthetic City"], "conviction": "medium", "so_what": "Sponsor bias is the live attack line against this evidence; the fact that the sceptic-commissioned CABE studies reached the same conclusion is the strongest available rebuttal.", "quote": "The suspicion of a loaded choice of images is heightened by the fact that most visual preference surveys have been commissioned by organizations sympathetic to traditional architecture", "locator": "Sceptics often argue that when the public prefers", "quote_verified": true}, {"claim": "The single strongest defense of the finding is not any one study's quality but uniformity of sign: every image pair surveyed so far has generated the same result, with zero counterexamples across roughly twenty properly sampled surveys in six countries.", "speaker": "WorksInProgMag", "type": "framework", "entities": ["visual preference surveys"], "conviction": "high", "so_what": "Unanimity of direction across independent sponsors and countries is harder to fake than any single effect size — the result to watch is the first genuine counterexample.", "quote": "Nevertheless, it is striking that every image pair surveyed so far has generated the same result.", "locator": "Nevertheless, it is striking that every image pair", "quote_verified": true}, {"claim": "The 1979 Metuchen, New Jersey survey run by the Rutgers University Urban Design Studio established that responses to built environments are predictable and shared rather than purely matters of individual taste, and the town later wrote a design code on the basis of its results.", "speaker": "WorksInProgMag", "type": "anecdote", "entities": ["Metuchen", "New Jersey", "Rutgers University Urban Design Studio", "Anton C Nelessen"], "conviction": "medium", "so_what": "Precedent that preference surveys translate directly into binding local design codes — the mechanism by which this research becomes a development constraint.", "quote": "The Metuchen survey was the first to show that people tend to have predictable, shared responses to different built environments, responses that are not purely a matter of individual taste.", "locator": "The birth of visual preference surveying", "quote_verified": true}]}, {"theme": "The unexplained stated-versus-revealed preference gap", "insights": [{"claim": "Almost every architecture school in the world teaches exclusively broadly modernist styles and probably more than 99 percent of architects practice exclusively in them, producing a supply monoculture in the face of a 70-90 percent contrary demand signal.", "speaker": "WorksInProgMag", "type": "thesis", "entities": ["architecture schools", "architects", "modernist architecture"], "conviction": "high", "so_what": "A near-total supply monoculture against overwhelming stated demand is either a massive latent market opportunity for traditionalist practices or evidence that the stated preference does not convert to willingness to pay — the resolution is the whole investment question.", "quote": "Almost every architectural school in the world exclusively teaches broadly modernist styles, and probably more than 99 percent of architects practice exclusively in them.", "locator": "If this is true, a greater puzzle comes into view", "quote_verified": true}, {"claim": "Britain has seen hardly a single public commission in a traditional style since the 1950s and only a trickle of commercial and institutional ones, making traditional styles virtually extinct for seven decades outside the private housing market.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["United Kingdom", "public procurement", "private housing"], "conviction": "high", "so_what": "Private housing being the sole surviving traditionalist segment is the tell: where consumers pay directly, traditional wins; where procurement is intermediated, it does not.", "quote": "Except in the market for private housing, traditional styles have been virtually extinct for seven decades.", "locator": "In Britain, there has been hardly a single public commission", "quote_verified": true}, {"claim": "The author rules out planning regulation as the full explanation, noting the anti-traditional trend persists in jurisdictions whose development control systems are stylistically neutral, and frames the residual as a mysterious divergence between stated and revealed preferences that the article deliberately leaves unresolved.", "speaker": "WorksInProgMag", "type": "causal", "entities": ["planning regulation", "development control", "architects"], "conviction": "medium", "so_what": "If deregulation alone won't shift built output, the binding constraint sits in the architectural profession and client procurement culture — a much slower thing to arbitrage than a rule change.", "quote": "Although in some cases this can be explained by anti-traditional planning rules, the broad trend is still evident in jurisdictions whose development control systems are stylistically neutral.", "locator": "Although in some cases this can be explained", "quote_verified": true}, {"claim": "Contemporaries on both sides of the modernist debate agreed from the outset that it lacked public support, with John Summerson in 1940 saying the public 'can't understand it, never will, and hates it like poison' and the anti-modernist critic Wolf von Eckardt in 1977 declaring it 'was never popular' — meaning the new survey evidence confirms an eighty-year-old consensus rather than discovering something new.", "speaker": "WorksInProgMag", "type": "anecdote", "entities": ["John Summerson", "Wolf von Eckardt", "modernist architecture"], "conviction": "high", "so_what": "Sustained unpopularity that was known and openly acknowledged for eighty years without changing practice is the clearest evidence that public preference is not an input into this industry at all.", "quote": "can’t understand it, never will, and hates it like poison", "locator": "Throughout its history, both supporters and detractors", "quote_verified": true}]}], "insight_total": 30, "top_entities": ["Create Streets", "The Aesthetic City", "National Civic Art Society", "David Halpern", "CABE", "Marks and Spencer", "HS2", "ADAM Architecture", "Grafton Architects", "artificial intelligence", "Luis Balula", "Metuchen"], "source_meta": {"author": "WorksInProgMag", "word_count": 3353, "paywalled": false}}, {"record_id": "15bacb48dcbc7927", "source_type": "concepts", "source_name": "World Economic Forum", "source_url": "https://www.weforum.org/stories/economic-growth hts": [{"claim": "The competitiveness agenda is structured as four interconnected workstreams - clean and competitive energy and industry, technology and innovation, financial markets, and external partnerships - which is the map of where EU-level policy pressure is being organized.", "speaker": "World Economic Forum", "type": "framework", "entities": ["Europe", "EU", "energy", "financial markets"], "conviction": "high", "so_what": "Use the four pillars as a watchlist structure for European policy catalysts; sectors outside them are unlikely to receive coordinated political sponsorship.", "quote": "solutions across four interconnected themes. These include 1) Clean and Competitive Energy and Industry, 2) Technology and Innovation, 3) Financial Markets, and 4) External Partnerships.", "locator": "The Leaders for European Growth and Competitiveness is a multistakeholder platform", "quote_verified": true}, {"claim": "The financial-markets workstream is built around the savings and investments union and mobilizing capital supply, positioning finance as the enabler that closes Europe's investment gap rather than as a sector to be reformed for its own sake.", "speaker": "World Economic Forum", "type": "thesis", "entities": ["Europe", "savings and investments union", "financial markets"], "conviction": "medium", "so_what": "Progress on a savings and investments union would re-rate European exchanges, asset gatherers and securitization channels; stalling keeps household savings parked in deposits.", "quote": "3 Financing Europe’s investment challenge4 The savings and investments union5 Enhancing funding supply through mobilizing capital", "locator": "Leveraging Financial Markets", "quote_verified": true}, {"claim": "The energy and industry chapter is explicitly framed around crisis as a catalyst, implying the reform path being advocated depends on external shock rather than on steady-state political consensus.", "speaker": "World Economic Forum", "type": "framework", "entities": ["Europe", "energy", "industry"], "conviction": "medium", "so_what": "Expect European industrial policy to accelerate on energy or supply shocks and drift in calm periods - a timing signal for policy-sensitive positions.", "quote": "2 Context: How crisis serves as a catalyst", "locator": "Clean and Competitive Energy and Industry", "quote_verified": true}, {"claim": "The external-partnerships pillar singles out critical raw materials as its one sectoral deep dive, alongside trade strategy and outbound investment, marking raw-material supply security as the chosen chokepoint in Europe's alliance strategy.", "speaker": "World Economic Forum", "type": "thesis", "entities": ["Europe", "critical raw materials", "trade policy", "outbound investment"], "conviction": "medium", "so_what": "Critical-raw-material offtake, refining and strategic-partnership deals are where EU external policy is most likely to produce concrete, contractable outcomes.", "quote": "3 Europe’s trade strategy4 Europe’s outbound investment and development strategy5 Sectoral analysis: critical raw materials", "locator": "Enabling Strategic Alliances", "quote_verified": true}]}, {"theme": "Who is writing the agenda, and what it concedes", "insights": [{"claim": "The European competitiveness blueprint was written in collaboration with Accenture, McKinsey and Oliver Wyman, meaning three large consultancies are co-authoring the reform agenda whose implementation they would be positioned to advise on.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["Accenture", "McKinsey", "Oliver Wyman", "World Economic Forum"], "conviction": "high", "so_what": "Read the recommendations as consulting-shaped - implementation-heavy, transformation-program flavoured - and note the direct commercial beneficiaries of a large EU structural-reform push.", "quote": "Written in collaboration with Accenture, McKinsey and Oliver Wyman", "locator": "The Leaders for European Growth and Competitiveness is a // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
