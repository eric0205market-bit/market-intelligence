function chartBlockHtml(item){
  const c = item.charts || {};
  const hot = !!c.hot;
  const rowClass = "chart-row" + (hot ? " hot" : "");
  const label = hot ? "🔥 CHART WORTH SAVING" : (c.count > 0 ? ("📊 " + c.count + " chart(s)") : "📊 Charts");
  return '<div class="block-label">Charts</div>' +
    '<div class="' + rowClass + '">' + label + '</div>' +
    '<div class="chart-placeholder' + (hot?" hot":"") + '">' + (c.desc || "No chart description available.") + '</div>';
}

function cardHtml(item, index){
  const color = catColor(item.cat);
  const urg = URG_META[item.urgency] || {emoji:"⚪",label:item.urgency};
  const chartFlag = (item.charts && (item.charts.hot || item.charts.count>0)) ? '<span class="chart-flag">' + (item.charts.hot ? "🔥" : "📊") + '</span>' : "";
  let html = '<div class="card" data-id="' + item.id + '" data-cat="' + item.cat + '" data-urg="' + item.urgency + '" data-src="' + item.source.replace(/"/g,'&quot;') + '">';
  html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
  html += '<span class="idx">' + String(index+1).padStart(2,"0") + '</span>';
  html += '<span class="urg">' + urg.emoji + '</span>';
  html += '<span class="badge" style="background:' + color + '">' + item.source + '</span>';
  html += '<span class="cat-pill">' + item.cat + '</span>';
  html += chartFlag;
  html += '<span class="card-title">' + item.title + '</span>';
  html += '<span class="chevron">▶</span>';
  html += '</div>';
  html += '<div class="card-body">';
  html += '<div class="block-label">The Idea</div><div class="idea-text">' + item.idea + '</div>';
  html += '<div class="block-label">My Angle</div><div class="angle-box" style="--cat-color:' + color + '">' + item.angle + '</div>';
  html += '<div class="block-label">Tweets</div>';
  html += '<div class="tweets">';
  html += '<div class="tweet-box"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div>' +
          '<button class="copy-btn" onclick="event.stopPropagation();copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  html += '<div class="tweet-box"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div>' +
          '<button class="copy-btn" onclick="event.stopPropagation();copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
  html += '</div>';
  html += chartBlockHtml(item);
  html += '<div class="link-row"><a href="' + item.link + '" target="_blank">↗ Read full article</a></div>';
  html += '</div></div>';
  return html;
}

function renderCards(){
  const wrap = document.getElementById("cards");
  let filtered = ITEMS.filter(i => {
    if(activeCat !== "all" && i.cat !== activeCat) return false;
    if(activeUrg !== "all" && i.urgency !== activeUrg) return false;
    if(activeSrc && i.source.indexOf(activeSrc) === -1) return false;
    return true;
  });
  if(filtered.length === 0){
    wrap.innerHTML = '<div class="empty-state">No items match this filter.</div>';
    return;
  }
  wrap.innerHTML = filtered.map((item) => cardHtml(item, ITEMS.indexOf(item))).join("");
  if(activeSrc){
    filtered.forEach(item => {
      const el = wrap.querySelector('.card[data-id="' + item.id + '"]');
      if(el) el.classList.add("open");
    });
  }
}

function toggleCard(id){
  const el = document.querySelector('.card[data-id="' + id + '"]');
  if(el) el.classList.toggle("open");
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function filterBySrc(name){
  activeCat = "all"; activeUrg = "all"; activeSrc = name;
  renderFilters();
  renderCards();
  document.getElementById("cards").scrollIntoView({behavior:"smooth"});
}

function renderReport(){
  const body = document.getElementById("reportBody");
  let html = "";
  html += '<div>Window: <strong>' + META.windowStart + '</strong> → <strong>' + META.windowEnd + '</strong>. Emails outside this window were not processed.</div>';
  html += '<div class="report-totals">Emails in window: ' + META.emailsInWindow + ' &nbsp;·&nbsp; Emails read: ' + META.emailsRead + ' &nbsp;·&nbsp; Items extracted: ' + META.itemsExtracted + '</div>';
  html += '<h4>Included Sources</h4>';
  META.includedSources.forEach(s => {
    var safeName = s.name.replace(/\\/g,"\\\\").replace(/'/g,"\\'");
    html += '<div class="src-line" onclick="filterBySrc(\'' + safeName + '\')">' + s.name + ' — ' + s.count + ' item' + (s.count>1?'s':'') + '</div>';
  });
  html += '<h4>Skipped Sources</h4>';
  if(META.skippedSources.length === 0){
    html += '<div style="color:#8a847a;">None — every email received in the 6-hour window contained extractable content.</div>';
  } else {
    META.skippedSources.forEach(s => {
      html += '<div>' + s.name + ' — ' + s.reason + '</div>';
    });
  }
  body.innerHTML = html;
}
