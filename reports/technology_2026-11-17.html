l"], "source_meta": {"author": "Financial Times", "word_count": 510, "paywalled": false}}, {"record_id": "d635ae0908ae7f8f", "source_type": "technology", "source_name": "Nature Machine Intelligence", "source_url": "https://www.nature.com/articles/s42256-026-01327-4", "title": "Interpretable distance-resolved graph learning for cancer gene priority screening - Nature Machine Intelligence", "published_date": "2026-11-16", "language": "en", "processed_at": "2026-11-17T11:05:41Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech"], "gist": "CGMap (Central South University) is an interpretable, width-oriented graph-learning framework that uses distance-resolved channels and a global diffusion module to prioritize cancer genes; across 12,022 genes in pan-cancer networks it beat existing methods and nominated 70 candidates, with FN1 and TTN knockdown validated in cell assays. Only the abstract and metadata are available (paywalled preview).", "themes": [{"theme": "CGMap width-oriented graph architecture", "insights": [{"claim": "CGMap, a graph-learning framework from Central South University, prioritizes candidate cancer genes from biomolecular networks using a width-oriented parallel architecture rather than stacking deeper GNN layers.", "speaker": "Nature Machine Intelligence", "type": "framework", "entities": ["CGMap", "Central South University", "graph neural networks"], "conviction": "high", "so_what": "Signals a design shift in biomedical GNNs from depth to parallel multi-scale channels; watch for adoption in target-discovery platforms.", "quote": "uses a width-oriented parallel architecture to prioritize potential CGs from biomolecular networks", "locator": "Abstract", "quote_verified": true}, {"claim": "CGMap builds distance-resolved channels (precomputed one-shot parallel propagation up to 10-hop distance) to localize spatially dispersed cancer-gene signals across multiple topological scales while avoiding representation homogenization (over-smoothing).", "speaker": "Nature Machine Intelligence", "type": "causal", "entities": ["CGMap", "Zenodo"], "conviction": "high", "so_what": "Addresses the over-smoothing limit of deep GNNs, a general bottleneck relevant to any network-biology AI vendor.", "quote": "CGMap localizes spatially dispersed CG signals across multiple topological scales while avoiding representation homogenization", "locator": "Abstract", "quote_verified": true}, {"claim": "Compared with depth-oriented baselines such as APPNP, GCNII, ResGCN and SGC evaluated at propagation depths of 1 to 10 layers on a PPI network, CGMap was benchmarked using 10 repetitions of five-fold cross-validation (50 held-out-fold evaluations) on AUC and AUPR.", "speaker": "Nature Machine Intelligence", "type": "data_point", "entities": ["CGMap", "APPNP", "GCNII", "ResGCN", "SGC"], "conviction": "medium", "so_what": "Rigorous repeated-CV benchmarking strengthens the credibility of the width-over-depth claim.", "quote": null, "locator": "Extended Data Fig. 1", "quote_verified": false}]}, {"theme": "Built-in interpretability via diffusion", "insights": [{"claim": "A global diffusion module in CGMap quantifies gene cooperativity along pathway contexts and produces traceable virtual interactions that map each prediction to a potential regulatory hypothesis, giving intrinsic rather than post-hoc interpretability.", "speaker": "Nature Machine Intelligence", "type": "framework", "entities": ["CGMap"], "conviction": "high", "so_what": "Intrinsic explainability lowers the barrier for wet-lab teams and regulators to trust AI-nominated drug targets.", "quote": "yields traceable virtual interactions that map predictions to potential regulatory hypotheses, providing intrinsic interpretability for model decisions", "locator": "Abstract", "quote_verified": true}]}, {"theme": "Pan-cancer benchmark performance", "insights": [{"claim": "Across multiple biomolecular networks (PPI, PathNet and GGNet) in a pan-cancer setting, CGMap analysed 12,022 genes and consistently outperformed existing cancer-gene identification methods while remaining computationally efficient.", "speaker": "Nature Machine Intelligence", "type": "data_point", "entities": ["CGMap", "PPI", "PathNet", "GGNet"], "conviction": "high", "so_what": "Efficiency plus accuracy makes the method cheap to deploy at scale in computational oncology pipelines.", "quote": "CGMap analysed 12,022 genes, consistently outperformed existing methods while remaining computationally efficient", "locator": "Abstract", "quote_verified": true}, {"claim": "CGMap was additionally stress-tested with cross-network generalization under strict identity holdout, topological isolation analysis and a unified time-split evaluation on three biological networks, targeting the data-leakage concerns common in network-based gene prediction.", "speaker": "Nature Machine Intelligence", "type": "framework", "entities": ["CGMap"], "conviction": "medium", "so_what": "Time-split and holdout evaluations are the right bar for judging whether AI target-discovery claims generalize to genuinely new genes.", "quote": null, "locator": "Extended Data Table 1-3", "quote_verified": false}]}, {"theme": "Novel candidates and wet-lab validation", "insights": [{"claim": "CGMap prioritized 70 reliable cancer-gene candidates, including genes not previously annotated in established databases such as the NCG and COSMIC Cancer Gene Census.", "speaker": "Nature Machine Intelligence", "type": "data_point", "entities": ["CGMap", "NCG", "COSMIC Cancer Gene Census"], "conviction": "high", "so_what": "Unannotated candidates are potential new oncology targets; a source of novel IP for target-discovery pipelines.", "quote": "prioritized 70 reliable candidates, including those previously unannotated in established databases", "locator": "Abstract", "quote_verified": true}, {"claim": "Loss-of-function assays on CGMap-predicted targets FN1 and TTN linked their knockdown to reduced cell proliferation, migration and invasion and a shift of EMT-related features toward a non-mesenchymal state, across cancer and non-malignant cell lines (including SVG p12 and MCF-10A).", "speaker": "Nature Machine Intelligence", "type": "causal", "entities": ["FN1", "TTN", "CGMap", "EMT"], "conviction": "medium", "so_what": "Wet-lab confirmation of AI-nominated targets is the key step converting computational predictions into drug-discovery value.", "quote": "the prioritized candidates were associated with the suppression of tumour-related phenotypes, including reduced cell proliferation, migration and invasion", "locator": "Abstract; Fig. 6", "quote_verified": true}, {"claim": "External databases including GEPIA2, TIMER 2.0 and CancerSEA were used as independent evidence supporting CGMap-prioritized candidates.", "speaker": "Nature Machine Intelligence", "type": "data_point", "entities": ["GEPIA2", "TIMER 2.0", "CancerSEA", "CGMap"], "conviction": "medium", "so_what": "Multi-source corroboration is a reusable validation template for AI-driven target nomination.", "quote": null, "locator": "Data availability; Fig. 5", "quote_verified": false}]}, {"theme": "Open release and funding", "insights": [{"claim": "CGMap source code is openly released on GitHub (Incendio1/CGMap) and archived on Zenodo, built on the pytorch_geometric ecosystem with Optuna hyperparameter search, making it freely reusable by academic and commercial oncology teams.", "speaker": "Nature Machine Intelligence", "type": "data_point", "entities": ["CGMap", "GitHub", "Zenodo", "Optuna", "pytorch_geometric"], "conviction": "high", "so_what": "Open-source release commoditizes this capability, compressing moats for proprietary AI target-discovery vendors.", "quote": null, "locator": "Code availability", "quote_verified": false}, {"claim": "The CGMap work was funded by the National Natural Science Foundation of China and the Hunan Provincial Natural Science Foundation, reflecting state-backed Chinese investment in AI-for-oncology research.", "speaker": "Nature Machine Intelligence", "type": "anecdote", "entities": ["National Natural Science Foundation of China", "Central South University"], "conviction": "medium", "so_what": "Adds to evidence of China's growing output in AI-for-biomedicine published in top Western journals.", "quote": null, "locator": "Funding", "quote_verified": false}]}], "insight_total": 11, "top_entities": ["CGMap", "Central South University", "FN1", "TTN", "NCG", "COSMIC Cancer Gene Census", "GEPIA2", "APPNP", "GCNII", "Optuna"], "source_meta": {"author": "Nature Machine Intelligence", "word_count": 3661, "paywalled": false}}, {"record_id": "e537107b10f38230", "source_type": "technology", "source_name": "Wired", "source_url": "https://www.wired.com/story/epa-chemical-detecting-plane-isnt-doing-job/", "title": "The EPA’s Chemical-Detecting Plane Isn’t Doing Its Job Anymore", "published_date": "2026-11-16", "language": "en", "processed_at": "2026-11-17T11:06:33Z", "processor": "claude-code-sub-opus", "tags": ["Society", "Energy", "Tech"], "gist": "A Floodlight investigation finds the EPA's ASPECT chemical-detection plane has decayed: only seven emergency responses since early 2021, sensors that no longer deliver results in minutes (manual analysis takes about a week), missed toxics at the 2025 Smitty's Supply fire, and a no-bid $1.7M Telops sensor replacement that former program scientists say fixes the wrong problem amid rising chemical accidents.", "themes": [{"theme": "ASPECT deployment collapse", "insights": [{"claim": "The EPA's ASPECT chemical-detection plane flew almost 80 emergency missions in its first two decades (about four a year) but has averaged roughly one a year over the past five years, with just seven emergency responses since early 2021.", "speaker": "Ames Alexander", "type": "data_point", "entities": ["EPA", "ASPECT"], "conviction": "high", "so_what": "Federal airborne chemical-emergency monitoring capacity has eroded, shifting detection burden to local responders and private testers.", "quote": null, "locator": "During its first two decades, the plane flew", "quote_verified": false}, {"claim": "The ASPECT plane did not respond to at least 80 chemical emergencies this year, including the October Toledo, Ohio glycidyl methacrylate tank leak that forced hundreds to evacuate and sent more than 50 to hospitals.", "speaker": "Ames Alexander", "type": "data_point", "entities": ["ASPECT", "EPA", "glycidyl methacrylate"], "conviction": "high", "so_what": "Gaps in federal monitoring raise liability and community-health exposure for chemical operators after incidents.", "quote": null, "locator": "In October, hundreds were evacuated", "quote_verified": false}, {"claim": "Accidental chemical releases are rising: the US Chemical Safety Board tracked 133 last year, up from 83 in 2021, even as the Trump administration proposes rolling back safeguards such as independent safety audits and community hazard disclosures.", "speaker": "Ames Alexander", "type": "data_point", "entities": ["US Chemical Safety Board", "Trump administration"], "conviction": "high", "so_what": "Rising incident frequency plus deregulation increases tail risk for chemical, refining and industrial operators and their insurers.", "quote": null, "locator": "The decline comes as accidental chemical releases", "quote_verified": false}]}, {"theme": "Lost expertise drove decline", "insights": [{"claim": "ASPECT's decline began when a 2019 EPA reorganization ordered staff to relocate to Texas or face termination, causing PhD-level program leads to leave, and the EPA failed to replace them with scientists experienced in airborne chemical detection.", "speaker": "Ames Alexander", "type": "causal", "entities": ["EPA", "ASPECT", "Mark Thomas"], "conviction": "high", "so_what": "Institutional knowledge loss, not hardware, can disable government technical programs; a pattern relevant to agency-capability risk.", "quote": "They lost the institutional knowledge of the program, and quite frankly, lost the momentum of the program,", "locator": "How the Program Lost Its Way", "quote_verified": true}, {"claim": "After the original ASPECT managers left, the program stopped proactively tracking emergencies and urging on-scene coordinators to deploy the plane, which now stays in a Texas hangar until requested.", "speaker": "Ames Alexander", "type": "causal", "entities": ["ASPECT", "EPA"], "conviction": "medium", "so_what": "Process changes, not capability, explain the drop in deployments.", "quote": null, "locator": "Former ASPECT program managers say they used to actively track", "quote_verified": false}]}, {"theme": "East Palestine and Smitty's failures", "insights": [{"claim": "In the 2023 Norfolk Southern East Palestine derailment, ASPECT was not requested until more than two days later, missed the vinyl chloride vent-and-burn, and collected only eight minutes of chemical data; the NTSB later concluded the vent-and-burn was unnecessary.", "speaker": "Ames Alexander", "type": "anecdote", "entities": ["Norfolk Southern", "East Palestine", "ASPECT", "NTSB", "vinyl chloride"], "conviction": "high", "so_what": "Slow federal monitoring contributed to costly, possibly avoidable emergency decisions; the EPA inspector general is auditing the response.", "quote": null, "locator": "A Missed Opportunity in East Palestine", "quote_verified": false}, {"claim": "At the August 2025 Smitty's Supply fire in Roseland, Louisiana, the EPA published ASPECT results showing pollutants far below harmful levels, but whistleblower Robert Kroutil's manual reanalysis of the raw data found high concentrations of toluene, trichloroethylene and naphthalene that could have endangered nearby communities.", "speaker": "Ames Alexander", "type": "contrarian", "entities": ["Smitty’s Supply", "EPA", "ASPECT", "Robert Kroutil", "toluene", "trichloroethylene", "naphthalene"], "conviction": "high", "so_what": "Official all-clear air data can understate exposure, a factor in ongoing class-action litigation against Smitty's.", "quote": null, "locator": "A later analysis of the raw flight data", "quote_verified": false}, {"claim": "In June the EPA inspector general found the ASPECT plane can no longer provide chemical data within five minutes as designed; manual analysis takes about a week, and the EPA failed to tell on-scene coordinators the program was not working as designed.", "speaker": "Ames Alexander", "type": "data_point", "entities": ["EPA", "ASPECT"], "conviction": "high", "so_what": "A week's delay makes the data useless for evacuation decisions, undermining federal emergency-response credibility.", "quote": null, "locator": "In June, the EPA inspector general confirmed", "quote_verified": false}]}, {"theme": "Telops sensor replacement dispute", "insights": [{"claim": "The EPA bypassed competitive bidding to award Canadian firm Telops, owned by Exosens, a $1.7 million contract for replacement ASPECT sensors, with integration not complete until early to mid 2027.", "speaker": "Ames Alexander", "type": "data_point", "entities": ["EPA", "Telops", "Exosens", "ASPECT"], "conviction": "high", "so_what": "A small no-bid federal contract win for Exosens/Telops in airborne gas-detection hyperspectral sensing.", "quote": null, "locator": "EPA officials blamed the delays on old sensors", "quote_verified": false}, {"claim": "Five former ASPECT staff and independent infrared spectrometer expert Chris Manning argue the Telops sensors, mostly field-tested on methane leak tracking, are slower, less sensitive and less suited to moving targets than the old Bomem sensors, making them a poor replacement though a possible complement.", "speaker": "Ames Alexander", "type": "contrarian", "entities": ["Telops", "Bomem", "Chris Manning", "ASPECT"], "conviction": "medium", "so_what": "Methane-focused sensing tech may not generalize to complex industrial toxic plumes; procurement may degrade capability.", "quote": "To say, ‘We're just going to replace these other two instruments’ … I mean, that’s ludicrous,", "locator": "Chris Manning, an infrared spectrometer expert", "quote_verified": true}, {"claim": "ASPECT's old sensors' AI software was never retrained after an electrical malfunction despite a 2023 retraining plan from contract scientists, which former staff say is the real cause of the failures rather than worn-out hardware.", "speaker": "Ames Alexander", "type": "causal", "entities": ["ASPECT", "EPA", "Robert Kroutil"], "conviction": "medium", "so_what": "Neglected model maintenance, not sensor age, can break AI-dependent detection systems.", "quote": null, "locator": "The old sensors had problems, too", "quote_verified": false}, {"claim": "Former ASPECT scientist Robert Kroutil predicts the program will keep deteriorating and the EPA will be flying blind unless major changes are made.", "speaker": "Ames Alexander", "type": "prediction", "entities": ["Robert Kroutil", "EPA", "ASPECT"], "conviction": "high", "so_what": "Expect continued gaps in federal chemical-emergency monitoring absent reform or oversight action.", "quote": "Unless major changes are made at EPA and with the ASPECT program, it is not going to get any better and EPA will be flying blind.", "locator": "In the affidavit submitted to the Government Accountability Project", "quote_verified": true}]}], "insight_total": 12, "top_entities": ["EPA", "ASPECT", "Robert Kroutil", "Telops", "Exosens", "Norfolk Southern", "East Palestine", "Smitty’s Supply", "US Chemical Safety Board", "Mark Thomas"], "source_meta": {"author": "Ames Alexander", "word_count": 2658, "paywalled": false}}, {"record_id": "ecf09aee9d40356d", "source_type": "technology", "source_name": "NVIDIA Developer Blog", "source_url": "https://developer.nvidia.com/blog/nvidia-vera-rubin-nvl72-leads-agentic-inference-performance-on-mlperf-endpoints-v1-0/", "title": "NVIDIA Vera Rubin NVL72 Leads Agentic Inference Performance on MLPerf Endpoints v1.0 | NVIDIA Technical Blog", "published_date": "2026-11-16", "language": "en", "processed_at": "2026-11-17T11:06:00Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech", "Energy"], "gist": "Provisional (not yet MLCommons-verified) MLPerf Endpoints v1.0 results show NVIDIA Vera Rubin NVL72 delivering 5x-10x throughput per provisioned kilowatt and 3x-5x end-to-end interactivity versus verified GB300 NVL72 on agentic workloads (Kimi K3, DeepSeek-V4.1-Flash, Qwen3.6-35B-A3B). NVIDIA attributes the gains to HBM4, Tensor Cores and sixth-generation NVLink plus context-aware serving (prefix caching, Dynamo routing, disaggregated prefill/decode) and model-specific kernels.", "themes": [{"theme": "Agentic inference per-watt leap", "insights": [{"claim": "Provisional MLPerf Endpoints v1.0 results show NVIDIA Vera Rubin NVL72 delivering over 10x the throughput per kilowatt of provisioned power of GB300 NVL72 on Kimi K3 at a shared minimum end-to-end interactivity of 50 tokens per second per user.", "speaker": "Zhihan Jiang", "type": "data_point", "entities": ["Vera Rubin NVL72", "GB300 NVL72", "Kimi K3", "MLPerf Endpoints v1.0"], "conviction": "high", "so_what": "In power-constrained data centers, tokens per kW is the revenue metric — a 10x step implies Rubin sharply lowers inference cost per token and pressures prior-gen rental pricing.", "quote": null, "locator": "In MLPerf Endpoints v1.0, provisional NVIDIA Vera Rubin NVL72 results", "quote_verified": false}, {"claim": "Across models, Vera Rubin NVL72 versus GB300 NVL72 showed throughput-per-provisioned-kW ratios of 10x on Kimi K3, 9x on DeepSeek-V4.1-Flash and 5x on Qwen3.6-35B-A3B, and E2E interactivity ratios of 3x, 5x and 3x respectively at matched concurrency.", "speaker": "Zhihan Jiang", "type": "data_point", "entities": ["Kimi K3", "DeepSeek-V4.1-Flash", "Qwen3.6-35B-A3B", "Vera Rubin NVL72", "GB300 NVL72"], "conviction": "high", "so_what": "Gains are largest on the biggest model and smallest on the small 35B-A3B MoE, so Rubin's edge is most valuable for frontier-scale agent serving.", "quote": null, "locator": "Table 1. Throughput per kilowatt and E2E interactivity ratios", "quote_verified": false}, {"claim": "The headline Kimi K3 comparison pits a 32-accelerator Vera Rubin NVL72 run (1,024 concurrent queries, 41,414.2 tokens/sec, 100.89 kW) against a 48-accelerator GB300 NVL72 run (48 queries, 2,210.4 tokens/sec, 60 kW); at matched 1,024-query concurrency GB300 reached only 16.8 tokens/sec per user versus 50.4 for Vera Rubin.", "speaker": "Zhihan Jiang", "type": "data_point", "entities": ["Vera Rubin NVL72", "GB300 NVL72", "Kimi K3"], "conviction": "medium", "so_what": "The 10x is measured on provisioned power at a chosen interactivity floor with very different operating points — treat it as a best-case framing and await MLCommons verification.", "quote": null, "locator": "Footnote 1 (MLPerf Endpoints v1.0, Kimi K3)", "quote_verified": false}, {"claim": "The Vera Rubin NVL72 Endpoints results are provisional and pending MLCommons verification and peer review, while the GB300 NVL72 results they are compared against are verified.", "speaker": "Zhihan Jiang", "type": "data_point", "entities": ["MLCommons", "Vera Rubin NVL72", "GB300 NVL72"], "conviction": "high", "so_what": "Headline multiples could change after review; watch the verified results on endpoints.mlcommons.org.", "quote": "Pending MLCommons Association verification, results are subject to change pending peer review.", "locator": "Table 1 footnote", "quote_verified": true}, {"claim": "Higher throughput per kilowatt lets operators run more AI agents simultaneously within the same power budget while meeting the same responsiveness requirement.", "speaker": "Zhihan Jiang", "type": "causal", "entities": ["NVIDIA", "AI agents"], "conviction": "high", "so_what": "With power as the binding constraint on AI capacity, perf-per-watt upgrades translate directly into revenue capacity per site — a driver for Rubin replacement demand.", "quote": "Higher throughput per kilowatt enables organizations to run more agents simultaneously within the same power budget while meeting the same responsiveness requirement.", "locator": "Higher throughput per kilowatt enables organizations", "quote_verified": true}]}, {"theme": "How agentic serving differs", "insights": [{"claim": "Agentic workloads stress inference systems differently: coding trajectories accumulate conversation history over many turns and enterprise workflows reuse shared instructions, tool definitions and business rules, so context length grows across a session.", "speaker": "Zhihan Jiang", "type": "framework", "entities": ["MLPerf Endpoints v1.0", "AI agents"], "conviction": "high", "so_what": "Growing context per session raises memory (HBM, KV cache) intensity of inference — supportive of HBM4 and memory-tier demand.", "quote": null, "locator": "The serving demands of multi-turn agentic AI", "quote_verified": false}, {"claim": "MLPerf Endpoints v1.0 benchmarks serving capacity versus responsiveness through API endpoints on coding and enterprise workflows, checking generated tool calls against reference values and running separate SWE-bench Verified evaluations to confirm faster serving preserves model quality.", "speaker": "Zhihan Jiang", "type": "framework", "entities": ["MLPerf Endpoints v1.0", "SWE-bench Verified", "MLCommons"], "conviction": "medium", "so_what": "A new endpoint-level agentic benchmark gives investors a standardized way to compare inference vendors on throughput per kW vs latency.", "quote": null, "locator": "MLPerf Endpoints v1.0 evaluates this balance", "quote_verified": false}]}, {"theme": "Hardware and serving-stack levers", "insights": [{"claim": "NVIDIA Rubin GPUs combine HBM4 memory for fast access to weights and conversation state, Tensor Cores for matrix math, and sixth-generation NVLink for cross-GPU communication to meet agentic inference demands.", "speaker": "Zhihan Jiang", "type": "data_point", "entities": ["Rubin", "HBM4", "Tensor Cores", "NVLink"], "conviction": "high", "so_what": "HBM4 is central to Rubin's inference story — read-through to HBM4 suppliers' volume ramp.", "quote": null, "locator": "Hardware and software optimizations for agentic inference", "quote_verified": false}, {"claim": "Context-aware serving — prefix caching, state reuse, NVIDIA Dynamo routing and disaggregated prefill/decode serving — reduces redundant computation and balances load for agentic inference, e.g. Kimi pairs disaggregated serving with prefill changes that cut GPU synchronization waits.", "speaker": "Zhihan Jiang", "type": "causal", "entities": ["NVIDIA Dynamo", "Kimi K3", "prefix caching", "disaggregated serving"], "conviction": "high", "so_what": "Much of the inference gain is software (Dynamo), deepening NVIDIA's full-stack moat beyond silicon.", "quote": null, "locator": "Context-aware serving and model-specific optimizations", "quote_verified": false}, {"claim": "Model-specific GPU execution adds further gains: DeepSeek's MegaMoE kernel exploits Rubin GPU locality and matrix-multiply instructions, and Qwen's multi-token prediction pairs token proposals with Tensor Core verification to reduce sequential decoding steps.", "speaker": "Zhihan Jiang", "type": "data_point", "entities": ["DeepSeek", "MegaMoE", "Qwen", "Rubin", "multi-token prediction"], "conviction": "medium", "so_what": "Chinese open-weight model developers are optimizing kernels for NVIDIA Rubin, reinforcing CUDA as the default target for leading models.", "quote": null, "locator": "Table 2. Software optimizations improve context reuse", "quote_verified": false}, {"claim": "NVIDIA argues agentic inference performance depends on co-design across hardware, system architecture and serving software rather than raw chip specs alone.", "speaker": "Zhihan Jiang", "type": "thesis", "entities": ["NVIDIA", "Vera Rubin"], "conviction": "medium", "so_what": "Framing favors integrated full-stack vendors over merchant-chip or ASIC competitors that lack a mature serving stack.", "quote": "Agentic inference performance depends on co-design across hardware, system architecture, and serving software.", "locator": "More productive infrastructure for agentic AI", "quote_verified": true}]}], "insight_total": 11, "top_entities": ["NVIDIA", "Vera Rubin NVL72", "GB300 NVL72", "MLPerf Endpoints v1.0", "Kimi K3", "DeepSeek-V4.1-Flash", "Qwen3.6-35B-A3B", "HBM4", "NVLink", "Dynamo", "MLCommons", "MegaMoE"], "source_meta": {"author": "Zhihan Jiang", "word_count": 1721, "paywalled": false}}, {"record_id": "ee0ebee49c398738", "source_type": "technology", "source_name": "Quantum Computing Report", "source_url": "https://quantumcomputingreport.com/ibm-and-amd-open-source-pelagos-gpu-decoder-framework-for-large-scale-qldpc-error-correction-simulations/", "title": "IBM and AMD Open-Source Pelagos GPU Decoder Framework for Large-Scale qLDPC Error Correction Simulations - Quantum Computing Report", "published_date": "2026-11-16", "language": "en", "processed_at": "2026-11-17T11:06:58Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "IBM Research and AMD open-sourced Pelagos, a vendor-neutral Triton-based GPU decoder framework for simulating qLDPC error-correction codes at supercomputing scale, reporting up to 97x single-GPU speedups and near-linear 8-GPU scaling on AMD Instinct MI300X/MI355X at ORNL's Lux. A six-company survey (AMD, HPE, IBM, IQM, Riverlane, Xanadu) mapped hierarchical real-time decoding architectures across hardware.", "themes": [{"theme": "Pelagos open-source GPU decoder", "insights": [{"claim": "IBM Research and AMD open-sourced Pelagos (pelagos-decoder on PyPI), a vendor-neutral GPU-accelerated quantum error-correction decoding framework for evaluating qLDPC codes at supercomputing scale, announced at SC26.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["IBM Research", "AMD", "Pelagos", "qLDPC"], "conviction": "high", "so_what": "AMD is inserting itself into the quantum error-correction compute stack, challenging NVIDIA's CUDA-Q dominance.", "quote": null, "locator": "IBM Research and AMD have open-sourced Pelagos", "quote_verified": false}, {"claim": "Pelagos is written in the open-source Triton GPU language under Apache 2.0, implementing Relay-BP-S in fused kernels that target AMD ROCm/HIP, NVIDIA CUDA and Intel SPIR-V GPUs, with up to 97x single-GPU speedup versus one CPU core.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Triton", "Relay-BP", "AMD ROCm", "NVIDIA CUDA", "Intel SPIR-V"], "conviction": "high", "so_what": "Hardware-neutral Triton kernels reduce CUDA lock-in for QEC simulation — a modest positive for AMD and Intel GPU relevance.", "quote": null, "locator": "Pelagos Open-Source Decoder Architecture table", "quote_verified": false}, {"claim": "Pelagos keeps belief-propagation message arrays, convergence flags and candidate selection resident in GPU high-bandwidth memory while autotuning between syndrome-major and edge-major layouts.", "speaker": "Mohamed Abdel-Kareem", "type": "framework", "entities": ["Pelagos", "HBM", "belief propagation"], "conviction": "medium", "so_what": "QEC decoding is HBM-bound work — another incremental demand vector for high-bandwidth-memory GPUs.", "quote": null, "locator": "Written in the open-source Triton GPU programming language", "quote_verified": false}]}, {"theme": "Why QEC needs supercomputers", "insights": [{"claim": "Evaluating fault-tolerant qLDPC codes such as bivariate-bicycle memories requires simulating billions of circuit-level error syndromes to resolve logical error rates down to 10−12.", "speaker": "Mohamed Abdel-Kareem", "type": "causal", "entities": ["qLDPC", "bivariate-bicycle codes"], "conviction": "high", "so_what": "Fault-tolerance R&D is a structural HPC/GPU workload, tying quantum roadmaps to classical compute spend.", "quote": "requires simulating billions of circuit-level error syndromes to resolve logical error rates down to 10−12", "locator": "Evaluating fault-tolerant qLDPC codes", "quote_verified": true}]}, {"theme": "AMD Instinct scaling results", "insights": [{"claim": "Pelagos reached 3,845 decodes/s on the One-Gross [[144,12,12]] code using 8x AMD Instinct MI355X (6.23x end-to-end scaling) and 2,686 decodes/s on 8x MI300X.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["AMD Instinct MI355X", "AMD Instinct MI300X", "One-Gross code"], "conviction": "high", "so_what": "Concrete AMD Instinct performance numbers for QEC give AMD a benchmarkable foothold in quantum-HPC.", "quote": null, "locator": "Pelagos Open-Source Decoder Architecture table", "quote_verified": false}, {"claim": "On the Two-Gross [[288,12,18]] code, Pelagos achieved 7.58x GPU decode scaling on eight MI300X GPUs and 7.45x scaling (1,265 decodes/s) on ORNL's Lux MI355X supercomputer.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["AMD Instinct MI300X", "Lux", "ORNL", "Two-Gross code"], "conviction": "high", "so_what": "Near-linear multi-GPU scaling means QEC simulation capacity grows with GPU node purchases.", "quote": null, "locator": "Pelagos Open-Source Decoder Architecture table", "quote_verified": false}, {"claim": "Replacing single-process threaded dispatch with persistent per-GPU worker processes and shared-memory output buffers cut eight-GPU host preprocessing overhead on two-gross circuits from 3.21 seconds to 0.73 seconds on ORNL's Lux.", "speaker": "Mohamed Abdel-Kareem", "type": "causal", "entities": ["AMD", "IBM", "ORNL", "Lux"], "conviction": "high", "so_what": "Host-side orchestration, not GPU kernels, was a key bottleneck — system software matters for quantum-HPC scaling.", "quote": null, "locator": "In an accompanying technical study", "quote_verified": false}]}, {"theme": "Industry decoding architecture consensus", "insights": [{"claim": "AMD, HPE, IBM, IQM, Riverlane and Xanadu co-authored a hierarchical decoding survey mapping predecoding cascades, sliding-window streaming pipelines and concatenated-code interfaces across CPUs, GPUs, FPGAs, ASICs and cryogenic hardware.", "speaker": "Mohamed Abdel-Kareem", "type": "framework", "entities": ["AMD", "HPE", "IBM", "IQM", "Riverlane", "Xanadu"], "conviction": "medium", "so_what": "Cross-vendor collaboration suggests decoding stacks will be heterogeneous — opportunities for FPGA/ASIC suppliers and Riverlane.", "quote": null, "locator": "Alongside the software release, authors from AMD", "quote_verified": false}, {"claim": "Real-time QEC decoding reaction targets span three orders of magnitude, from microsecond superconducting cycles to millisecond-scale trapped-ion and neutral-atom schedules.", "speaker": "Mohamed Abdel-Kareem", "type": "framework", "entities": ["superconducting qubits", "trapped-ion", "neutral-atom"], "conviction": "high", "so_what": "Modality determines decoder hardware: superconducting needs FPGA/ASIC-class latency while ions/atoms can use GPUs.", "quote": null, "locator": "Alongside the software release, authors from AMD", "quote_verified": false}, {"claim": "The Pelagos release advances a joint QEC co-design platform established earlier in November 2026 by IBM, AMD and Oak Ridge National Laboratory (ORNL).", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["IBM", "AMD", "ORNL"], "conviction": "medium", "so_what": "IBM is diversifying classical partners beyond NVIDIA, giving AMD a strategic quantum foothold.", "quote": null, "locator": "IBM Research and AMD have open-sourced Pelagos", "quote_verified": false}]}], "insight_total": 10, "top_entities": ["IBM", "AMD", "Pelagos", "ORNL", "qLDPC", "AMD Instinct MI355X", "MI300X", "Triton", "Relay-BP", "Riverlane", "Xanadu", "IQM"], "source_meta": {"author": "Mohamed Abdel-Kareem", "word_count": 539, "paywalled": false}}, {"record_id": "f59968fc454641d1", "source_type": "technology", "source_name": "Apple ML Research", "source_url": "https://machinelearning.apple.com/research/theory-evaluability", // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
