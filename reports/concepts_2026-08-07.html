his is not simply a response to President", "quote_verified": true}, {"claim": "President Trump's war against Iran – described as the largest deployment of US forces since 1990 – is what pushed Riyadh to reassess its role in the regional order, an ironic outcome given a decade of US efforts to reduce Middle East exposure.", "speaker": "Chatham House", "type": "causal", "entities": ["Donald Trump", "Iran", "US", "Saudi Arabia"], "conviction": "high", "so_what": "The escalation that was meant to shrink US commitments has instead deepened Gulf-US operational entanglement — watch for sustained elevated defence and force-posture spending.", "quote": "it is President Donald Trump’s war against Iran – involving the largest deployment of US forces since 1990 – that has prompted Riyadh to reassess its role in the regional order", "locator": "Ironically, it is President Donald Trump’s war", "quote_verified": true}, {"claim": "Chatham House flags that unilateral actions by Israel or Iran can trigger wider instability that directly hits Saudi interests, making Riyadh a hostage to two actors it does not control.", "speaker": "Chatham House", "type": "causal", "entities": ["Israel", "Iran", "Saudi Arabia"], "conviction": "medium", "so_what": "Tail risk to Gulf energy assets is exogenous to Saudi policy — hedges should key off Israeli/Iranian escalation, not Saudi restraint.", "quote": null, "locator": "Recent conflicts have also reinforced the risks", "quote_verified": false}]}, {"theme": "The 22 July civilian nuclear agreement", "insights": [{"claim": "Saudi Arabia and the US signed a civilian nuclear agreement on 22 July 2026 that establishes a framework for long-term cooperation and positions US companies to play a leading role in the Saudi nuclear programme.", "speaker": "Chatham House", "type": "data_point", "entities": ["Saudi Arabia", "US", "civilian nuclear technology"], "conviction": "high", "so_what": "A multi-decade addressable market for US nuclear engineering, fuel-c t - and these can be lost one at a time rather than all at once.", "speaker": "Gavekal Research", "type": "framework", "entities": ["US dollar", "gold", "pound sterling"], "conviction": "high", "so_what": "Frames dollar-decline debates as three distinct trades rather than one binary bet, so investors can track which leg is actually breaking.", "quote": "A reserve currency has three attributes; it is (i) a medium of exchange, (ii) a reserve of value and (iii) a unit of account.", "locator": "A reserve currency has three attributes", "quote_verified": true}, {"claim": "The past 55 years, in which the US dollar performed all three monetary functions globally without any backing by a rare metal, are a genuine historical anomaly rather than a stable baseline; every previous dominant currency (sterling in 1870, the pre-1971 dollar) was ultimately a receipt for gold.", "speaker": "Gavekal Research", "type": "framework", "entities": ["US dollar", "gold", "pound sterling", "Richard Nixon"], "conviction": "high", "so_what": "Reversion to a gold-anchored store of value is the historical norm, not a tail scenario - a structural argument for a permanently higher strategic gold weighting.", "quote": "Thus, in purely monetary terms, the past 55 years have been a genuinely unique experience in history; a time when the US dollar combined all three major functions for the entire globe, and this without the backing of a rare metal.", "locator": "For most of history, and until Richard Nixon’s 1971 suspension", "quote_verified": true}, {"claim": "When a currency loses preeminence, the store-of-value function defects first - usually to gold - while the medium-of-exchange and unit-of-account roles survive for decades on habit.", "speaker": "Gavekal Research", "type": "framework", "entities": ["US dollar", "gold"], "conviction": "high", "so_what": "Watch reserve-asset composition, not invoicing or settlement share, for the earliest read on dollar erosion; invoicing data will lag by years." sk is now priced into the reserve-allocation decision itself, sustaining official gold demand irrespective of real rates.", "quote": "For many emerging market savers, the American “warehouse” now bears perhaps as great a risk of financial repression as their own domestic markets", "locator": "This transition is perhaps all the more essential", "quote_verified": true}, {"claim": "The closure of the Strait of Hormuz and the Iran war are likely to worsen Saudi Arabia's already negative current account, further reducing the Gulf's capacity to recycle savings into US assets.", "speaker": "Gavekal Research", "type": "causal", "entities": ["Saudi Arabia", "Iran", "Strait of Hormuz", "Gulf Cooperation Council"], "conviction": "medium", "so_what": "A deteriorating Gulf external position means more Gulf dollar issuance and less Gulf Treasury buying - both long-end negative.", "quote": "a current account deficit which is now likely to get worse because of the Iran war and Strait of Hormuz closure", "locator": "This has occurred even though Saudi Arabia registered a current account deficit", "quote_verified": true}]}, {"theme": "AI billing war: Ferrari invoices versus free BYDs", "insights": [{"claim": "The US and Chinese AI strategies are monetary mirror images: America sells rare, high-priced intelligence on US$2mn-a-year cloud contracts invoiced in dollars, while China manufactures cheap open models and gives them away.", "speaker": "Gavekal Research", "type": "framework", "entities": ["artificial intelligence", "China", "US dollar", "BYD"], "conviction": "high", "so_what": "The competitive threat to US AI monetization is a pricing attack, not a capability race - model the revenue line, not just benchmark scores.", "quote": "China’s strategy has been to manufacture BYDs… and to give them away!", "locator": "In past pieces and video interviews", "quote_verified": true}, {"claim": "China's open AI models destroy the American invoice without creating a Chinese one, because a free or near-free model generates no meaningful invoices in any currency.", "speaker": "Gavekal Research", "type": "contrarian", "entities": ["artificial intelligence", "China", "renminbi", "US dollar"], "conviction": "high", "so_what": "Chinese AI commoditization is bearish US AI pricing power but is NOT bullish renminbi internationalization - a distinction most 'de-dollarization' narratives miss.", "quote": "A free, or almost free, model generates no meaningful invoices in any currency.", "locator": "These open models destroy the American invoice", "quote_verified": true}, {"claim": "China produces roughly 140trn daily AI tokens sold at one-tenth to one-hundredth of the American price, which carries virtually no monetary weight in currency terms despite the enormous volume.", "speaker": "Gavekal Research", "type": "data_point", "entities": ["artificial intelligence", "China"], "conviction": "medium", "so_what": "Token volume is not revenue - use price-per-token, not usage, when sizing the AI monetization pool.", "quote": "China’s 140trn or so daily tokens, sold at one-tenth to one-hundredth of the American price, carry virtually no monetary weight.", "locator": "A free, or almost free, model generates no meaningful invoices", "quote_verified": true}, {"claim": "The US attempt to convert the petrodollar into a compute-dollar is bound to fail because of China's free-AI strategy, yet China will not create a compute-renminbi either - so the result is that the US loses the rent but keeps the currency.", "speaker": "Gavekal Research", "type": "prediction", "entities": ["US dollar", "renminbi", "artificial intelligence", "China"], "conviction": "high", "so_what": "Trade the margin compression in US AI monetization without assuming a currency regime change; the wedge is between rent and currency, not between dollar and renminbi.", "quote": "Chinese-driven AI commoditization will drive a wedge between rent and currency, not between the US dollar and the renminbi.", "locator": "Looking ahead, if we assume that", "quote_verified": true}, {"claim": "For a compute-renminbi to emerge, Beijing would have to sell compute in bundles - a free model tied to chips, data centers and renminbi-based financing settled through its own channels with gold as the exit route - and China is clearly nowhere near able to deliver this today.", "speaker": "Gavekal Research", "type": "framework", "entities": ["China", "renminbi", "gold", "artificial intelligence", "data centers"], "conviction": "medium", "so_what": "A concrete checklist for spotting a genuine renminbi bloc: watch for bundled chip-plus-financing export packages, not settlement statistics.", "quote": "Beijing would have to sell compute in bundles: a free model tied to chips, data centers, and renminbi-based financing, settled through its own channels, with gold possibly serving as the exit route.", "locator": "Indeed, for the renminbi to gain ground", "quote_verified": true}, {"claim": "The plausible end-state is a Brazilian company running a Chinese model on Huawei chips, using a US model only at the margins, and paying for it in USDT - Chinese technology, dollar unit of account, crypto rails.", "speaker": "Gavekal Research", "type": "prediction", "entities": ["Huawei", "Brazil", "USDT", "Tether", "China", "artificial intelligence"], "conviction": "medium", "so_what": "Positions Huawei's silicon stack and dollar stablecoins as complements rather than competitors; long the rails, short the rent.", "quote": "a company in, say, Brazil will run a Chinese model on Huawei chips—using a US model only at the margins—and will pay for it all in USDT", "locator": "Looking ahead, if we assume that", "quote_verified": true}, {"claim": "A physical asymmetry defines the AI battlefield: America controls three-quarters of global compute capacity but faces a five-to-seven-year wait for grid connection, while China adds the equivalent of Germany's entire power grid annually but cannot fill its data centers for lack of chips.", "speaker": "Gavekal Research", "type": "data_point", "entities": ["artificial intelligence", "China", "data centers", "Germany", "power grid"], "conviction": "high", "so_what": "Grid interconnection is the binding US constraint and chips the binding Chinese one - both are the highest-leverage bottlenecks to own or track (power infrastructure in the US, semiconductors in China).", "quote": "America controls three-quarters of global compute capacity, yet faces a five-to-seven-year wait for grid connection. China adds the equivalent of Germany’s entire power grid annually, but struggles to fill its data centers due to a lack of chips.", "locator": "And so a physical asymmetry seems to define the AI battlefield", "quote_verified": true}, {"claim": "The American AI infrastructure buildout runs on Chinese equipment - the US imported over 8,000 transformers from China last year and roughly 40% of its batteries - meaning the hostages of any escalation are already bolted into the substations.", "speaker": "Gavekal Research", "type": "data_point", "entities": ["China", "United States", "transformers", "batteries", "data centers"], "conviction": "high", "so_what": "US grid and data-center buildout timelines carry direct China-supply-chain risk; a tariff or export-control shock hits AI capex delivery, not just component prices.", "quote": "Last year, the US imported over 8,000 transformers from China. The US also imported some 40% of its batteries… the “hostages” are thus already bolted into the substations.", "locator": "The American infrastructure buildout itself now runs on Chinese equipment", "quote_verified": true}]}, {"theme": "Hong Kong as the sluice between three currencies", "insights": [{"claim": "Hong Kong is evolving from a pipe or bridge that money passes through into a sluice where money actually stops and stays, because it is the jurisdiction least exposed to both the Chinese and American systems simultaneously.", "speaker": "Gavekal Research", "type": "framework", "entities": ["Hong Kong", "China", "United States"], "conviction": "high", "so_what": "Reframes Hong Kong from a declining China-access play into a structural offshore savings pool - the core actionable idea of the piece.", "quote": "Hong Kong will likely evolve from being a pipe/bridge and will instead become a sluice where money no longer just passes through (with Hong Kong lawyers, bankers, accountants etc… taking a cut of course), but actually stays put.", "locator": "But in this new world, Hong Kong will likely evolve", "quote_verified": true}, {"claim": "Hong Kong bank deposits grew by nearly 12% in 2025, almost entirely in foreign currency, and the city has become the world's leading center for cross-border wealth management.", "speaker": "Gavekal Research", "type": "data_point", "entities": ["Hong Kong", "China"], "conviction": "high", "so_what": "Deposit growth is the observable proxy for the sluice thesis - track it as the leading indicator for Hong Kong asset reflation.", "quote": "Hong Kong bank deposits grew by nearly 12% in 2025, almost entirely in foreign currency, and the city has now become the world’s leading center for cross-border wealth management.", "locator": "Hong Kong bank deposits grew by nearly 12% in 2025", "quote_verified": true}, {"claim": "Mainland savings that stop in Hong Kong inflate the local monetary base and push rates down, exactly as the Eurodollar market once did: in spring 2025 the monetary authority bought nearly US$17bn to weaken a Hong Kong dollar pinned at its ceiling, and Hibor collapsed toward 0% while the Fed's rate was above 4%.", "speaker": "Gavekal Research", "type": "data_point", "entities": ["Hong Kong", "Hibor", "Hong Kong dollar", "Federal Reserve", "Eurodollar"], "conviction": "high", "so_what": "A 400bp+ decoupling of Hibor from Fed funds is a direct funding-cost subsidy to Hong Kong property, banks and equities - the mechanism behind the bullish Hong Kong call.", "quote": "The Hibor collapsed toward 0% while the Federal Reserve’s rate was above 4%...", "locator": "In the spring of 2025, the monetary authority had to buy nearly US$17bn", "quote_verified": true}, {"claim": "Hong Kong asset prices will be driven by liquidity rather than by profits, with London's fifty-year run as a sluice for Russian, Arab and rich European savings - a period in which the city grew far richer without its stock market rising much - as the precedent.", "speaker": "Gavekal Research", "type": "prediction", "entities": ["Hong Kong", "London", "Russia"], "conviction": "medium", "so_what": "Suggests favouring Hong Kong real assets, property and rate-sensitive vehicles over the broad equity index, since the London analogue delivered wealth without index returns.", "quote": "The precedent here might be London, a city that grew ever richer for 50 years thanks to its similar role as a sluice (for Russian savings, for Arab savings, for the savings of rich Europeans…) and this without the value of its stock market increasing very much.", "locator": "In time, this will drive asset prices through liquidity", "quote_verified": true}, {"claim": "The Hong Kong dollar peg is the load-bearing wall of the entire sluice arrangement, and Beijing has deliberately placed its offshore gold vault inside that jurisdiction so savers can step from currency into metal without entering either the Chinese or the American system.", "speaker": "Gavekal Research", "type": "thesis", "entities": ["Hong Kong dollar", "Hong Kong", "Shanghai Gold Exchange", "gold", "China"], "conviction": "high", "so_what": "Any threat to the HKD peg is a systemic threat to this entire architecture - the peg is the key risk to monitor for the bullish Hong Kong trade.", "quote": "In this framework, the Hong Kong dollar peg is the load-bearing wall of the sluice. And notice where Beijing has placed its gold vault: inside it.", "locator": "In this framework, the Hong Kong dollar peg", "quote_verified": true}, {"claim": "Hong Kong's value is that of a toll that grows with traffic between the three currencies - gold, the US dollar and the renminbi - meaning it grows with geopolitical mistrust itself; the more the world fragments, the more profitable the crossing points become.", "speaker": "Gavekal Research", "type": "framework", "entities": ["Hong Kong", "gold", "US dollar", "renminbi"], "conviction": "high", "so_what": "Makes Hong Kong assets a long-fragmentation hedge that pays off precisely when geopolitical risk rises - an unusual convexity versus most risk assets.", "quote": "The value of Hong Kong is thus that of a toll—it grows with the traffic between the three currencies (gold, US dollar and renminbi), that is, with mistrust itself.", "locator": "The value of Hong Kong is thus that of a toll", "quote_verified": true}, {"claim": "Hong Kong becomes the most strategic and most contested asset in the global monetary system, since rival sluices such as Singapore and Dubai do not straddle the Chinese and American worlds nearly as well.", "speaker": "Gavekal Research", "type": "thesis", "entities": ["Hong Kong", "Singapore", "Dubai", "China", "United States"], "conviction": "medium", "so_what": "Implies geopolitical headline risk on Hong Kong is a feature of the trade, and that Singapore/Dubai are imperfect substitutes for the same exposure.", "quote": "And sure, there are other sluices (i.e.: Singapore, Dubai…), but none that straddle so perfectly the Chinese world and the US world.", "locator": "If this analysis is right, then Hong Kong becomes the most strategic", "quote_verified": true}]}, {"theme": "The three-way equilibrium that keeps the system stable", "insights": [{"claim": "The emerging arrangement is sustainable because each party gets what its regime needs: China retains its surpluses, employment and social peace without opening its capital account; the US retains the unit of account, captive Treasury demand and partial reindustrialization financed by others' factories.", "speaker": "Gavekal Research", "type": "framework", "entities": ["China", "United States", "US Treasuries", "renminbi"], "conviction": "high", "so_what": "Argues against a disorderly monetary rupture - the equilibrium is self-reinforcing, so trade the slow drift, not a crisis.", "quote": "The United States retains the unit of account, captive demand for treasury bonds, and partial reindustrialization financed by the factories of others.", "locator": "And what makes the arrangement sustainable", "quote_verified": true}, {"claim": "Gold is the load-bearing compromise of the new system: it gives China's trading partners the exit route the renminbi cannot offer, and lets both superpowers distrust each other without the system collapsing.", "speaker": "Gavekal Research", "type": "framework", "entities": ["gold", "China", "renminbi", "United States"], "conviction": "high", "so_what": "Gold demand is structural and political rather than cyclical or inflation-driven, which decouples it from the usual real-rate model.", "quote": "More importantly, gold allows both superpowers to distrust each other, without causing the system to collapse.", "locator": "Gold offers China’s partners the exit strategy", "quote_verified": true}, {"claim": "At each transition between monetary systems a toll is paid, and Hong Kong, gold vaults and stablecoins are the three locks where value comes to a halt - so the owners of those chokepoints capture the economics of fragmentation.", "speaker": "Gavekal Research", "type": "framework", "entities": ["Hong Kong", "gold", "stablecoins", "Tether"], "conviction": "high", "so_what": "Points to a concrete basket for the fragmentation trade: Hong Kong assets, physical gold and the stablecoin/vaulting infrastructure.", "quote": "At each transition from one system to another, a toll is paid: Hong Kong, gold vaults, and stablecoins are the locks where value comes to a halt.", "locator": "At each transition from one system to another", "quote_verified": true}, {"claim": "There is no longer any single currency fulfilling all three monetary functions globally, and there likely will not be one for a very long time - instead there are three currencies (the US dollar, the renminbi and gold) linked by sluices.", "speaker": "Gavekal Research", "type": "thesis", "entities": ["US dollar", "renminbi", "gold", "Hong Kong"], "conviction": "high", "so_what": "The base case is a tri-polar monetary system, so allocate across all three legs rather than betting on a single dollar-successor.", "quote": "There is no longer, at the global level, a currency that fulfills all three functions, and there will likely not be one for a very long time.", "locator": "5) Conclusion", "quote_verified": true}]}, {"theme": "Trade implications: structural steepener, gold, Hong Kong", "insights": [{"claim": "The US yield curve must steepen structurally because the two ends now have divorced customer bases: the front end has a price-insensitive buyer as each stablecoin issued automatically buys a Treasury bond, while the long end has only natural sellers as central banks rotate to gold and GCC savings rotate to equity.", "speaker": "Gavekal Research", "type": "prediction", "entities": ["US Treasuries", "stablecoins", "gold", "Gulf Cooperation Council", "central banks"], "conviction": "high", "so_what": "A direct, mechanical steepener thesis independent of the inflation outlook - the cleanest expression is 2s10s or 5s30s steepeners.", "quote": "The curve must therefore steepen structurally, not in anticipation of inflation but through a divorce between two customer groups", "locator": "First, on the American curve", "quote_verified": true}, {"claim": "If US authorities eventually cap long yields through curve control or regulatory constraint, that will be an admission that financial repression has begun and the signal for the final migration of savings into gold, or possibly the renminbi.", "speaker": "Gavekal Research", "type": "prediction", "entities": ["US Treasuries", "gold", "renminbi", "Federal Reserve"], "conviction": "high", "so_what": "Gives a specific, observable trigger for the terminal gold trade: any move toward yield-curve control or forced domestic bank buying of Treasuries.", "quote": "the day when we reach a ceiling along the way, through curve control or regulatory constraint, it will be an admission that financial repression has begun, and the signal of the final migration towards gold", "locator": "and the day when we reach a ceiling along the way", "quote_verified": true}, {"claim": "The overall configuration is bearish long-dated bonds and bearish the US dollar, bullish gold, and above all bullish Hong Kong assets.", "speaker": "Gavekal Research", "type": "thesis", "entities": ["US dollar", "gold", "Hong Kong", "US Treasuries"], "conviction": "high", "so_what": "The explicit portfolio conclusion: underweight duration and USD, overweight gold, with Hong Kong assets as the highest-conviction expression.", "quote": "None of this is bullish for long-dated bonds, or for the US dollar. This new set-up is bullish for gold. But most of all, it might be very bullish Hong Kong assets.", "locator": "None of this is bullish for long-dated bonds", "quote_verified": true}, {"claim": "As long as Chinese savings continue to flee the mainland, Hong Kong's liquidity will keep swelling and its interest rates will keep decoupling downwards from the Federal Reserve's policy rate.", "speaker": "Gavekal Research", "type": "prediction", "entities": ["Hong Kong", "China", "Federal Reserve", "Hibor"], "conviction": "high", "so_what": "A persistent Hibor-vs-Fed-funds discount is the tradable transmission channel; monitor mainland outflow proxies and HK deposit growth.", "quote": "As long as Chinese savings continue to flee, Hong Kong will see its liquidity swell and its rates decouple downwards from the Fed.", "locator": "The more the world fragments", "quote_verified": true}, {"claim": "The unit-of-account function remains American and is the last bastion of dollar hegemony, which is why the battle over AI billing could prove decisive for the currency order.", "speaker": "Gavekal Research", "type": "thesis", "entities": ["US dollar", "artificial intelligence", "renminbi"], "conviction": "high", "so_what": "Watch the currency of AI service invoicing as the single most informative indicator for the dollar's remaining structural franchise.", "quote": "The unit of account, the stickiest, remains American; it is the last bastion. Which is why the battle over AI billing could prove very important.", "locator": "5) Conclusion", "quote_verified": true}]}], "insight_total": 48, "top_entities": ["US dollar", "gold", "renminbi", "Hong Kong", "China", "Tether", "Saudi Arabia", "Gulf Cooperation Council", "US Treasuries", "Shanghai Gold Exchange", "artificial intelligence", "Hibor"], "source_meta": {"author": "", "word_count": 3233, "paywalled": false}}, {"record_id": "db597c933cefecc5", "source_type": "concepts", "source_name": "Gavekal Research", "source_url": "https://research.gavekal.com/teaser/europes-broad-earnings-recovery/", "title": "Europe’s Broad Earnings Recovery", "published_date": "2026-08-06", "language": "en", "processed_at": "2026-08-07T00:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "AI", "Positioning"], "gist": "Teaser excerpt only (the article is cut at 'Want to read the whole article?' after two paragraphs): Gavekal argues European equities are a way to keep AI exposure without owning the fragility of the AI earnings boom, because Europe's earnings recovery is diversified across sectors. The one hard number given is consensus 12-month forward EPS growth for MSCI Europe of 15.4% in euro terms at end-July 2026, versus a -2% contraction in July 2025.", "themes": [{"theme": "European equities as a hedged AI trade", "insights": [{"claim": "Investors who doubt the sustainability of the AI earnings boom but still want AI exposure should look at European equities, which offer a powerful earnings-recovery story with a significant AI element.", "speaker": "Gavekal Research", "type": "thesis", "entities": ["European equities", "artificial intelligence", "Europe"], "conviction": "high", "so_what": "Frames European equity exposure as a way to stay long the AI theme with less single-theme drawdown risk than US AI leaders.", "quote": "Investors who question the sustainability of the AI earnings boom, but who nevertheless want to retain some exposure to the growth of artificial intelligence, may want to look again at European equities.", "locator": "Investors who question the sustainability", "quote_verified": true}, {"claim": "Europe's earnings growth is diversified across a broad range of sectors and therefore stands a good chance of surviving even if the AI boom turns to bust.", "speaker": "Gavekal Research", "type": "thesis", "entities": ["Europe", "European equities", "AI boom"], "conviction": "high", "so_what": "The durability argument rests on breadth, not on AI beta — so watch sector dispersion of European EPS revisions as the thing that would falsify the call.", "quote": "the continent’s earnings growth is diversified across a broad range of sectors, and therefore stands a good chance of surviving even if the AI boom turns to bust", "locator": "But best of all, the continent’s earnings growth", "quote_verified": true}, {"claim": "Breadth of earnings growth across sectors — rather than exposure to the dominant growth theme itself — is the criterion for judging which equity markets survive an AI bust.", "speaker": "Gavekal Research", "type": "framework", "entities": ["AI boom", "Europe", "equity markets"], "conviction": "medium", "so_what": "Gives a screenable test for AI-bust resilience: measure how concentrated a market's forward EPS growth is in AI-linked sectors.", "quote": null, "locator": "But best of all, the continent’s earnings growth", "quote_verified": false}]}, {"theme": "MSCI Europe forward EPS inflection", "insights": [{"claim": "At the end of July 2026, consensus estimates projected 12-month forward earnings-per-share growth for the MSCI Europe index of 15.4% measured in euro terms, versus a -2% contraction in July 2025.", "speaker": "Gavekal Research", "type": "data_point", "entities": ["MSCI Europe", "euro", "Europe"], "conviction": "high", "so_what": "A ~17-point year-on-year swing in forward EPS growth is the quantitative spine of the European re-rating case; track whether the 15.4% consensus holds or gets revised down.", "quote": "consensus estimates were projecting 12-month forward earnings-per-share growth for the MSCI Europe index of 15.4% measured in euro terms. That compares with a -2% contraction in July 2025.", "locator": "At the end of July, consensus estimates", "quote_verified": true}]}], "insight_total": 4, "top_entities": ["Europe", "European equities", "MSCI Europe", "artificial intelligence", "AI boom", "euro", "Gavekal Research"], "source_meta": {"author": "", "word_count": 138, "paywalled": false}}, {"record_id": "6bcff01cb1db7673", "source_type": "concepts", "source_name": "NY Fed — Liberty Street Economics", "source_url": "https://libertystreeteconomics.newyorkfed.org/2026/08/why-do-fewer-renters-expect-to-move/", "title": "Why Do Fewer Renters Expect to Move? - Liberty Street Economics", "published_date": "2026-08-06", "language": "en", "processed_at": "2026-08-07T11:23:19Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Society"], "gist": "New York Fed SCE Housing Survey data show renters' mean three-year moving probability fell from roughly 57 percent in 2014 to about 37 percent in 2026, tracking a slide in the average self-assessed chance of ever owning a home from ~52 percent (2015) to ~35 percent (2025). The authors attribute this to perceived mortgage affordability — the share calling a mortgage very difficult to obtain rose from ~27 percent (2021) to over 45 percent (2024) and expected rates more than doubled to ~6.8 percent — while the desire to own stayed flat at 65-74 percent, implying deferred rather than destroyed first-time-buyer demand.", "themes": [{"theme": "Renter Mobility Collapse (2014–2026)", "insights": [{"claim": "U.S. renters' mean self-reported probability of moving within three years fell from roughly 57 percent in 2014 to about 37 percent in 2026, a 20-percentage-point drop, per the New York Fed SCE Housing Survey.", "speaker": "John Lanuza", "type": "data_point", "entities": ["renters", "New York Fed SCE Housing Survey", "Survey of Consumer Expectations", "residential mobility"], "conviction": "high", "so_what": "A 20pp collapse in intended renter turnover is a direct headwind to moving-linked consumption (movers, furniture, appliances, brokerage) and a tailwind to apartment-REIT renewal rates.", "quote": null, "locator": "Renters' Expected 3-Year Mobility Fell 20 Percentage Points in the Last 12 Years", "quote_verified": false}, {"claim": "Homeowners' expected three-year moving probability fell from about 21 percent to 14 percent between 2014 and 2026, a smaller relative decline than renters experienced over the same period.", "speaker": "John Lanuza", "type": "data_point", "entities": ["homeowners", "renters", "Survey of Consumer Expectations"], "conviction": "high", "so_what": "Owners get all the mortgage-lock-in headlines, but renters are the faster-deteriorating leg of U.S. household mobility — watch renter turnover data, not just existing-home sales.", "quote": "Relative to their initial levels, expected mobility declined somewhat more for renters than for homeowners.", "locator": "Renters' Expected 3-Year Mobility Fell 20 Percentage Points", "quote_verified": true}, {"claim": "Because renters are not subject to mortgage rate lock-in yet still show a larger relative decline in expected mobility than homeowners, mortgage lock-in cannot be the primary explanation for falling U.S. residential mobility.", "speaker": "John Lanuza", "type": "contrarian", "entities": ["renters", "homeowners", "mortgage rate lock-in", "residential mobility"], "conviction": "medium", "so_what": "Undercuts the consensus 'rates fall, lock-in unwinds, transactions normalize' trade — a rate cut releases owners but leaves the structurally frozen renter cohort largely in place.", "quote": "renters account for roughly a third of U.S. households and, unlike homeowners, are not subject to mortgage rate lock-in", "locator": "Americans are moving less than they used to", "quote_verified": true}, {"claim": "The broad U.S. decline in moving rates — from close to 20 percent annually in the mid-1980s to below 10 percent by 2019 — has persisted through business cycles and across all regions and demographic groups, marking it as structural rather than cyclical.", "speaker": "John Lanuza", "type": "data_point", "entities": ["residential mobility", "U.S. households"], "conviction": "high", "so_what": "A four-decade, cycle-proof halving of mobility argues against betting on a cyclical rebound in housing turnover or labor reallocation.", "quote": "This decline has persisted through business cycles and has been evident across all regions, and has affected a broad range of demographic groups.", "locator": "Americans are moving less than they used to", "quote_verified": true}, {"claim": "Expected mobility is a leading indicator: because stated moving intentions predict actual moving behavior, survey-based mobility expectations flag turns in residential mobility before transactions register them.", "speaker": "John Lanuza", "type": "framework", "entities": ["Survey of Consumer Expectations", "residential mobility", "New York Fed SCE Housing Survey"], "conviction": "medium", "so_what": "Gives an early-read overlay on housing turnover and rental churn ahead of existing-home sales and lease-turnover prints.", "quote": "Since expected mobility predicts actual moving behavior, it provides an early signal of where residential mobility is headed before moves occur.", "locator": "In this post, we show that the decline", "quote_verified": true}]}, {"theme": "Homeownership Expectations De-Anchoring", "insights": [{"claim": "Renters' average self-assessed probability of ever owning a home fell from roughly 52 percent in 2015 to about 35 percent by 2025, with the decline especially sharp after 2021.", "speaker": "John Lanuza", "type": "data_point", "entities": ["renters", "homeownership", "Survey of Consumer Expectations"], "conviction": "high", "so_what": "A structurally shrinking pool of expected first-time buyers is bearish for entry-level homebuilders and mortgage origination volumes, and bullish for long-duration rental demand.", "quote": null, "locator": "Renters Less Optimistic About Ever Owning a Home", "quote_verified": false}, {"claim": "Renter moving intentions and homeownership expectations move together: renters who put only a 0–20 percent chance on ever owning report a ~25 percent three-year moving probability, versus ~76 percent for those at 81–100 percent — a gap of more than 50 percentage points.", "speaker": "John Lanuza", "type": "causal", "entities": ["renters", "homeownership", "residential mobility"], "conviction": "high", "so_what": "Renter churn is effectively a proxy for first-time-buyer formation; when ownership hope dies, so does the lease turnover that drives re-leasing spreads.", "quote": "a difference of more than 50 percentage points across the distribution.", "locator": "Renters Who Don't Expect to Move Also Don't Expect to Ever Own a Home", "quote_verified": true}, {"claim": "The post frames declining renter mobility as a two-hypothesis test — affordability constraints versus a shift in preferences away from owning — and finds the evidence supports affordability, not taste.", "speaker": "John Lanuza", "type": "framework", "entities": ["renters", "homeownership", "housing affordability"], "conviction": "high", "so_what": "A reusable diagnostic: if a demand shortfall is affordability-driven it is latent and rate/price-sensitive, whereas a preference shift is permanent and un-tradeable.", "quote": null, "locator": "These patterns raise a natural question", "quote_verified": false}]}, {"theme": "Mortgage Access Shock, 2021–2024", "insights": [{"claim": "The share of U.S. renters who say obtaining a mortgage would be very difficult jumped from around 27 percent in 2021 to over 45 percent by 2024.", "speaker": "John Lanuza", "type": "data_point", "entities": ["renters", "mortgage rates", "housing affordability"], "conviction": "high", "so_what": "Perceived credit-box tightness, not just price, is gating first-time buyers — a signal for mortgage insurers, non-bank originators, and FHA-exposed lenders.", "quote": null, "locator": "Renters Perceive Mortgages as Increasingly Difficult to Afford", "quote_verified": false}, {"claim": "The median mortgage rate renters believe they would receive if they applied today rose from about 3.3 percent in 2021 to nearly 6.8 percent by 2024, more than doubling in three years.", "speaker": "John Lanuza", "type": "data_point", "entities": ["renters", "mortgage rates"], "conviction": "high", "so_what": "Renter rate expectations are anchored near 7 percent; a durable move below that is the trigger condition for any first-time-buyer demand release.", "quote": "more than doubling over three years", "locator": "Both measures suggest that mortgage access", "quote_verified": true}, {"claim": "Perceived ease of getting a mortgage discriminates renter mobility far more sharply than the expected rate level: mean three-year moving probability is about 66 percent for renters who say a mortgage would be very easy to get versus about 42 percent for very difficult, while moving probability slips only from about 60 percent to about 54 percent across expected rates of 3 percent to 8 percent.", "speaker": "John Lanuza", "type": "data_point", "entities": ["renters", "mortgage rates", "housing affordability"], "conviction": "medium", "so_what": "Implies credit availability and qualification — not the headline rate — is the binding constraint, so easing underwriting would unlock more demand than a modest rate cut.", "quote": null, "locator": "Renters Who Expect High Mortgage Rates Are Less Likely to Move", "quote_verified": false}]}, {"theme": "Desire to Own Is Intact", "insights": [{"claim": "The share of U.S. renters who would prefer or strongly prefer to own a home if they had the financial resources has stayed in a narrow 65–74 percent band since 2015 and sat at about 65 percent in 2026, showing no collapse in the desire to own.", "speaker": "John Lanuza", "type": "data_point", "entities": ["renters", "homeownership"], "conviction": "high", "so_what": "Demand for ownership is deferred, not destroyed — pent-up first-time-buyer demand remains a live option on any genuine affordability improvement.", "quote": null, "locator": "Renters Still Prefer to Own a Home", "quote_verified": false}, {"claim": "Renters' view of homeownership as a good or very good investment has held in a 51 to 68 percent range since 2015, so the asset-class case for housing has not deteriorated in renters' minds even as their expectation of ever owning fell by about 17 percentage points.", "speaker": "John Lanuza", "type": "data_point", "entities": ["renters", "homeownership"], "conviction": "medium", "so_what": "Sentiment toward housing as an investment is not the marginal variable; affordability is — focus on payment-to-income and credit access metrics, not consumer housing sentiment surveys.", "quote": null, "locator": "The share who view homeownership as a good or very good investment", "quote_verified": false}, {"claim": "Renters' growing pessimism about ever owning a home reflects affordability constraints rather than a weakening desire for homeownership, according to the New York Fed's survey evidence.", "speaker": "John Lanuza", "type": "thesis", "entities": ["renters", "homeownership", "housing affordability", "Federal Reserve Bank of New York"], "conviction": "high", "so_what": "Positions falling household mobility as a fixable, policy- and rate-sensitive problem — which makes it a potential swing factor for housing-linked equities if affordability inflects.", "quote": "reflects affordability constraints rather than a weakening desire for homeownership", "locator": "These patterns suggest that renters' growing pessimism", "quote_verified": true}]}, {"theme": "Caveats on the Evidence", "insights": [{"claim": "The authors flag that their affordability-versus-mobility comparisons are unconditional — not controlling for renter credit scores or for changing economic conditions over time — so the relationship is associational rather than identified.", "speaker": "John Lanuza", "type": "causal", "entities": ["renters", "mortgage rates", "Survey of Consumer Expectations"], "conviction": "medium", "so_what": "Discount the effect size before sizing any trade on it; the true causal contribution of affordability to mobility is likely smaller than the raw gaps imply.", "quote": "Although these comparisons do not control for differences across renters, such as credit scores, or for changes in economic conditions over time", "locator": "In the left panel, renters who say obtaining a mortgage", "quote_verified": true}, {"claim": "Housing affordability is presented as only one contributing factor behind declining expected renter mobility, leaving a substantial unexplained residual in the decades-long U.S. mobility slide.", "speaker": "John Lanuza", "type": "thesis", "entities": ["housing affordability", "renters", "residential mobility"], "conviction": "medium", "so_what": "Don't model the mobility decline as a pure affordability story — other structural drivers (remote work, aging, dual-earner households) remain unpriced and unmeasured here.", "quote": "housing affordability may be one factor behind declining expected mobility among renters", "locator": "What These Patterns Suggest", "quote_verified": true}]}], "insight_total": 16, "top_entities": ["renters", "homeowners", "New York Fed SCE Housing Survey", "Survey of Consumer Expectations", "mortgage rates", "homeownership", "housing affordability", "residential mobility", "mortgage rate lock-in", "Federal Reserve Bank of New York"], "source_meta": {"author": "John Lanuza", "word_count": 1671, "paywalled": false}}, {"record_id": "b67fdb251f899d6e", "source_type": "concepts", "source_name": "Oxford Economics", "source_url": "https://www.oxfordeconomics.com/resource/forecasting-the-future-of-cities-neighbourhood-by-neighbourhood/", "title": "Forecasting the future of cities, neighbourhood by neighbourhood", "published_date": "2026-08-05", "language": "en", "processed_at": "2026-08-07T11:21:50Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Society"], "gist": "Oxford Economics is building ANIMA, its first Quantitative Spatial Equilibrium model, which decomposes US metro areas into sub-1km hexagons (more than 17,000 in New York) and forecasts employment, income, population and real estate prices for each out to 2050. The pitch is that city-level averages hide the divergence that actually drives siting, development and policy decisions, and the first New York output shows declining-employment hexagons sitting directly next to growing ones.", "themes": [{"theme": "City averages as a blind spot", "insights": [{"claim": "A city's headline growth figure can simultaneously contain a thriving downtown core and a struggling suburb, so city-level aggregates systematically obscure the local variation that businesses and local leaders need to see.", "speaker": "Emma Pollard", "type": "thesis", "entities": ["Oxford Economics", "cities", "economic forecasting"], "conviction": "high", "so_what": "Any allocation decision benchmarked to metro-level GDP or employment growth rests on a number that may not describe the specific submarket being underwritten.", "quote": "But a single, city-level average can hide just as much as it reveals.", "locator": "For decades, economic forecasting at the national", "quote_verified": true}, {"claim": "Investment decisions, site selection, infrastructure planning and policy interventions are typically taken at a far more local level than the city as a whole, creating a resolution mismatch between the scale of available economic forecasts and the scale of the actual decisions.", "speaker": "Emma Pollard", "type": "framework", "entities": ["site selection", "infrastructure planning", "real estate investors", "policymakers"], "conviction": "high", "so_what": "That gap defines the commercial opening for granular spatial data products and explains why forecast vendors are pushing below the metro level.", "quote": "Granular forecasting provides a way to align economic insights with the scale at which decisions are actually taken and where businesses actually operate.", "locator": "And understanding these differences is becoming", "quote_verified": true}, {"claim": "Neighbouring areas inside a single strong urban economy can follow very different trajectories in employment, income, population change and real estate demand, so heterogeneity within a metro is the rule rather than the exception.", "speaker": "Emma Pollard", "type": "thesis", "entities": ["employment", "personal income", "real estate demand"], "conviction": "high", "so_what": "Metro-level screens for real estate or consumer expansion will mis-rank submarkets; dispersion within a metro can exceed dispersion across metros.", "quote": "Cities are not homogeneous.", "locator": "Why granularity matters", "quote_verified": true}]}, {"theme": "ANIMA resolution and coverage", "insights": [{"claim": "Oxford Economics' ANIMA model decomposes the New York metropolitan area into more than 17,000 hexagonal cells of less than 1 km across and produces a forecast for each cell out to 2050 across a detailed range of economic indicators.", "speaker": "Emma Pollard", "type": "data_point", "entities": ["ANIMA", "Oxford Economics", "New York"], "conviction": "high", "so_what": "Sets the emerging resolution benchmark for commercial urban forecasting, sub-1km on a 25-year horizon, against which rival geospatial and real estate data products will be judged.", "quote": "in New York alone, the model decomposes the metropolitan area into more than 17,000 hexagonal cells, each less than 1 km across, and produces a forecast for each one out to 2050", "locator": "ANIMA is our first Quantitative Spatial Equilibrium model", "quote_verified": true}, {"claim": "ANIMA can be run for any major US metropolitan area and is built by breaking down the results of Oxford Economics' existing city and regional models to a much more granular level, rather than replacing them.", "speaker": "Emma Pollard", "type": "data_point", "entities": ["ANIMA", "Oxford Economics", "United States"], "conviction": "high", "so_what": "A top-down decomposition architecture means the granular forecasts inherit the parent city model's errors, a key diligence question for anyone buying the output.", "quote": null, "locator": "ANIMA is our first Quantitative Spatial Equilibrium model", "quote_verified": false}, {"claim": "The intended buyers of neighbourhood-scale forecasts are consumer-facing businesses choosing where to locate, real estate investors and developers deciding where to build, and policymakers shaping how neighbourhoods evolve.", "speaker": "Emma Pollard", "type": "thesis", "entities": ["ANIMA", "real estate investors", "developers", "policymakers"], "conviction": "high", "so_what": "Identifies the paying demand pool for spatial analytics: site selection, commercial real estate underwriting and public infrastructure budgets.", "quote": "It is built for the decision-makers who operate below the city level—from consumer-facing businesses choosing where to locate and invest, to real estate investors and developers deciding where to build", "locator": "At Oxford Economics, we are developing ANIMA", "quote_verified": true}]}, {"theme": "Quantitative Spatial Equilibrium mechanics", "insights": [{"claim": "ANIMA applies the Quantitative Spatial Equilibrium literature from urban economics, linking where firms locate, where households live, and how wages, rents, accessibility and real estate markets adjust to one another over time.", "speaker": "Emma Pollard", "type": "framework", "entities": ["ANIMA", "Quantitative Spatial Equilibrium", "urban economics"], "conviction": "high", "so_what": "An academic equilibrium framework rather than trend extrapolation, so outputs are internally consistent across rents, wages and jobs and can be shocked for scenarios.", "quote": "a rigorous way to link where firms locate, where households live, and how wages, rents, accessibility, and real estate markets adjust to one another over time", "locator": "A new way to model cities", "quote_verified": true}, {"claim": "The model's core behavioural assumptions are that households choose where to live based on income, housing costs and accessibility; firms choose location based on productivity, land costs and access to labour; and real estate markets respond to demand across residential and commercial space.", "speaker": "Emma Pollard", "type": "framework", "entities": ["households", "firms", "real estate markets", "ANIMA"], "conviction": "high", "so_what": "A reusable checklist of the variables that move neighbourhood outcomes, usable for hand-building a submarket thesis even without the model.", "quote": null, "locator": "At its core, this framework captures how", "quote_verified": false}, {"claim": "Because the components are interconnected, a localised shock such as job growth in one specific area feeds through into population movements, housing demand and local prices elsewhere, so local employment news is never purely local.", "speaker": "Emma Pollard", "type": "causal", "entities": ["employment", "housing demand", "local prices"], "conviction": "high", "so_what": "A single large campus or plant announcement should be underwritten for its spillover into adjacent submarket rents and population, not just the host location.", "quote": "Changes in one part of the system—such as job growth in a specific area—feed through to others, influencing population movements, housing demand, and local prices.", "locator": "These elements are closely interconnected", "quote_verified": true}, {"claim": "The model is fed by unconventional datasets including granular buildings and building-heights data, detailed real estate data, and hexagon-to-hexagon multimodal journey times across every mode of transport.", "speaker": "Emma Pollard", "type": "data_point", "entities": ["ANIMA", "buildings data", "real estate data", "transport"], "conviction": "high", "so_what": "Points to the alternative-data inputs (building footprints and heights, multimodal travel-time matrices) becoming the raw material of urban forecasting, a supply chain worth mapping.", "quote": "hexagon-to-hexagon multimodal journey times to capture how long it takes to travel between any two locations, across every mode of transport", "locator": "Modelling a city at this resolution requires", "quote_verified": true}, {"claim": "New transport connections, housing supply interventions and land-use policy shifts can be introduced explicitly into the framework to assess how they would reshape local economic outcomes over time.", "speaker": "Emma Pollard", "type": "framework", "entities": ["ANIMA", "transport infrastructure", "housing supply", "land-use policy"], "conviction": "medium", "so_what": "Enables ex-ante quantification of a transit line or upzoning on specific parcels, directly relevant to land banking and infrastructure-linked real estate bets.", "quote": null, "locator": "The framework also allows us to explicitly incorporate", "quote_verified": false}]}, {"theme": "New York: adjacency without convergence", "insights": [{"claim": "In 2024 New York data, many lower-income households in the Bronx live directly adjacent to the highest-paying jobs in Manhattan, while parts of Brooklyn have already emerged as high-income neighbourhoods in their own right, showing that proximity to high-wage employment does not translate into local income.", "speaker": "Emma Pollard", "type": "data_point", "entities": ["New York", "the Bronx", "Manhattan", "Brooklyn"], "conviction": "high", "so_what": "Undermines the standard proximity-to-jobs proxy used in residential underwriting; income and job-access maps must be treated as separate layers.", "quote": "Many lower-income households in the Bronx live right at the doorstep of the highest-paying jobs in Manhattan, while other parts of Brooklyn have already emerged as high-income neighbourhoods in their own right.", "locator": "Even this single snapshot tells an interesting story", "quote_verified": true}, {"claim": "ANIMA's New York employment forecast to 2040 shows areas of declining employment sometimes located directly next to areas of growth, meaning job-loss and job-growth micro-markets can sit within a few hundred metres of each other.", "speaker": "Emma Pollard", "type": "prediction", "entities": ["ANIMA", "New York", "employment"], "conviction": "high", "so_what": "Submarket selection dominates metro selection over a 15-year horizon; buying the metro trend can still leave an investor in a declining pocket.", "quote": "The results reveal remarkable spatial variation, with areas of declining employment sometimes located directly next to areas of growth.", "locator": "A step-change in urban forecasting", "quote_verified": true}, {"claim": "Manhattan's total employment is forecast to keep rising, but land availability and real estate profitability concentrate that growth in already dense areas, producing even greater spatial specialisation rather than a spreading out of jobs.", "speaker": "Emma Pollard", "type": "prediction", "entities": ["Manhattan", "New York", "employment", "real estate"], "conviction": "high", "so_what": "Argues against a decentralisation thesis for New York: constrained land plus profitability keeps reinforcing the densest cores, favouring prime-core assets over dispersed ones.", "quote": "In Manhattan, total employment continues to rise, but land availability and real estate profitability concentrate this growth in already dense areas, leading to even greater spatial specialisation.", "locator": "The results reveal remarkable spatial variation", "quote_verified": true}, {"claim": "Employment is forecast to grow across Brooklyn and the Bronx by 2040, albeit from a relatively low base, with declines limited to smaller pockets.", "speaker": "Emma Pollard", "type": "prediction", "entities": ["Brooklyn", "the Bronx", "New York", "employment"], "conviction": "medium", "so_what": "Broad-based outer-borough job growth off a low base is the setup for rent and income catch-up trades, with the caveat that individual pockets still decline.", "quote": "Employment is also set to grow across Brooklyn and the Bronx, albeit from a relatively low base, with declines limited to smaller pockets.", "locator": "In Manhattan, total employment continues to rise", "quote_verified": true}, {"claim": "The neighbourhood employment-change forecast is driven by past employment and productivity growth, real estate prices and available floorspace, making physical floorspace supply an explicit constraint on where jobs can land.", "speaker": "Emma Pollard", "type": "causal", "entities": ["ANIMA", "productivity", "real estate prices", "floorspace"], "conviction": "medium", "so_what": "Where floorspace is capped, job growth is capped, giving a screen for submarkets whose employment upside is physically blocked and whose rents should therefore squeeze.", "quote": "The model considers a range of factors—including past employment and productivity growth, real estate prices, and available floorspace—to produce this forecast.", "locator": "Figure 2 shows our forecast for employment change by 2040", "quote_verified": true}]}, {"theme": "Product roadmap and output set", "insights": [{"claim": "Across thousands of locations, ANIMA is planned to forecast population, employment by sector, productivity, GDP, personal income, residential real estate prices and housing affordability for major US cities.", "speaker": "Emma Pollard", "type": "data_point", "entities": ["ANIMA", "Oxford Economics", "United States", "housing affordability"], "conviction": "medium", "so_what": "A forward view of neighbourhood-level housing affordability and residential prices is a direct input for single-family rental, homebuilder and mortgage-credit geography decisions.", "quote": null, "locator": "What we are building towards", "quote_verified": false}, {"claim": "ANIMA is still described as under development and is positioned as a complement to Oxford Economics' existing city-level analysis rather than a finished replacement, with the published New York maps presented as illustrations of capability and no accuracy or back-test evidence offered.", "speaker": "Emma Pollard", "type": "thesis", "entities": ["ANIMA", "Oxford Economics", "New York"], "conviction": "medium", "so_what": "Treat the published numbers as a product demonstration rather than a validated track record when weighing the forecasts.", "quote": null, "locator": "Our ambition for ANIMA is to develop", "quote_verified": false}]}], "insight_total": 18, "top_entities": ["ANIMA", "Oxford Economics", "New York", "Manhattan", "Brooklyn", "the Bronx", "Quantitative Spatial Equilibrium", "United States", "real estate", "employment"], "source_meta": {"author": "Emma Pollard", "word_count": 1129, "paywalled": false}}, {"record_id": "ba73547ddd390043", "source_type": "concepts", "source_name": "Peterson Institute (PIIE)", "source_url": "https://www.piie.com/blogs/realtime-economics/2026/corporate-mentions-trumps-tariffs-spiked-spring-2025", "title": "Corporate mentions of Trump's tariffs spiked in spring 2025", "published_date": "2026-08-04", "language": "en", "processed_at": "2026-08-07T11:21:58Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Geopolitics", "Positioning"], "gist": "A PIIE text-analysis of 920 earnings calls from 150 US-listed companies (Jan 2025-Jul 2026) finds tariff mentions peaked at 85 percent of calls in Q2 2025 right after Trump's April 2 'Liberation Day' announcement and fell to 34 percent by Q2 2026, with average tariff passages per call dropping from six to one. The authors read this as habituation rather than relief, and warn that if Trump interprets fading corporate pushback as acquiescence he may escalate tariffs further.", "themes": [{"theme": "Tariff-talk decay curve in earnings calls", "insights": [{"claim": "US corporate executives mentioned tariffs in 85 percent of quarterly earnings calls in Q2 2025 (immediately after the April 2, 2025 'Liberation Day' announcement) but in only 34 percent of calls by Q2 2026, based on a sample of 920 calls from 150 companies.", "speaker": "Gary Clyde Hufbauer", "type": "data_point", "entities": ["Donald Trump", "S&P 500", "S&P MidCap 400", "S&P SmallCap 600", "tariffs"], "conviction": "high", "so_what": "Tariff commentary intensity is a tradable sentiment gauge: the 85 percent-to-34 percent collapse marks the point where trade policy stopped being a repricing catalyst for equities and became background noise.", "quote": "We found that executives in 85 percent of calls in the sample mentioned tariffs during the second quarter of 2025, peaking in the wake of Trump's Liberation Day announcement.", "locator": "For this analysis, we counted the number", "quote_verified": true}, {"claim": "The average number of passages mentioning tariffs per US earnings call fell from six in Q2 2025 to one in Q2 2026, a six-fold drop in narrative intensity over four quarters.", "speaker": "Gary Clyde Hufbauer", "type": "data_point", "entities": ["tariffs", "earnings calls"], "conviction": "high", "so_what": "Intensity per call, not just incidence, has normalized - a signal that management guidance is no longer being built around trade-policy contingencies.", "quote": "the average number of passages mentioning tariffs per earnings call dropped from six in the second quarter of 2025 to one in the second quarter of 2026", "locator": "The figure shows that the average number", "quote_verified": true}, {"claim": "Corporate silence on tariffs should be read as habituation to a new policy norm rather than as evidence that tariff costs have disappeared, since firms may simply have adapted, grown less concerned, or judged that saying nothing is safest on a politically charged topic.", "speaker": "Gary Clyde Hufbauer", "type": "framework", "entities": ["Donald Trump", "US corporate executives", "tariffs"], "conviction": "medium", "so_what": "Do not treat falling tariff mentions as an all-clear on margins; the cost may have migrated from disclosed risk language into quietly repriced input costs and guidance.", "quote": "Some may have decided that silence was the best way to navigate a politically charged topic.", "locator": "While it's impossible to interpret this pattern", "quote_verified": true}, {"claim": "The declining frequency of tariff discussion is interpreted by PIIE as evidence that firms now find White House trade policy less shocking than a year earlier, implying the shock component of tariff announcements has largely been discounted.", "speaker": "Gary Clyde Hufbauer", "type": "thesis", "entities": ["White House", "Donald Trump", "tariffs"], "conviction": "medium", "so_what": "Event-driven tariff trades have decaying half-lives; the same announcement magnitude now moves less corporate language and probably less price.", "quote": "These results suggest that firms find White House tariff policy less shocking now than a year ago.", "locator": "These results suggest that firms find", "quote_verified": true}]}, {"theme": "Policy whipsaw after the Supreme Court ruling", "insights": [{"claim": "The US Supreme Court struck down Trump's so-called recipr ", "Europe", "UK", "Switzerland", "China", "CSI 300 Stock Index", "North America", "Japan", "COMEX", "Fed", "LBMA", "Middle East"], "source_meta": {"author": "@goldcouncil", "word_count": 1626, "paywalled": false}}]};

// ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
