<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twitter Data Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DATA POINT TAGS */
.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type":"TWITTER DATA INTELLIGENCE","date":"2026-08-14 05:21 UTC","collected_at":"2026-08-14T05:21:00Z","input_stats":{"total_tweets":78,"unique_authors":21,"tweets_with_images":32,"after_filter":62},"summary":"62 items across 53 report entries from 21 accounts, covering fund flows, labor market, fiscal data, global macro, AI/tech, and crypto. **Key numbers:** Hedge funds bought $6.8B in US equities last week (largest in 18 years); S&P 500 hit its 27th ATH of 2026 (470th since 2013); full-time employment fell 106K in July for the 4th consecutive monthly decline; Bitcoin 90-day volatility is at the 8th percentile of its 4-year history; Norway's $2.3T sovereign wealth fund returned $184.3B profit in H1 2026.\n\n**Dominant themes:** HF demand for US equities is surging while retail and institutions sell; labor market shows cracks under the surface despite headline strength; national debt accelerating ($3.7T in 13 months); China losing competitiveness despite tech boom; crypto in extreme low-vol transition state.","topics":[{"topic":"Fund Flows & Positioning","items":[{"author":"KobeissiLetter","description":"Hedge funds bought +$6.8 billion in US equities last week — the largest weekly purchase in 18 years and 9th-largest since 2008 as % of S&P market cap. 2-week total of $11.6B is the largest 2-week purchase on record. Meanwhile institutional investors sold -$1.1B (2nd consecutive week) and retail sold -$4.1B.","tweet_url":"https://x.com/KobeissiLetter/status/2087967669127393745","images":["https://pbs.twimg.com/media/HPmy-QRWwAA832K.jpg"],"data_points":["HF +$6.8B last week (18-year record)","HF 2-week total $11.6B (all-time record)","Institutional -$1.1B (2nd consecutive sell)","Retail -$4.1B","HF 4-week avg +$1.8B"],"created_at":"2026-08-13T18:20:59.000Z"},{"author":"KobeissiLetter","description":"US-listed China ETFs recorded -$3.4 billion in combined outflows across May, June, and July. 12-month cumulative outflow fell to -$1.0B — largest withdrawal in at least a year. FXI leads YTD outflows. Investor demand for Chinese equities is weak.","tweet_url":"https://x.com/KobeissiLetter/status/2088004031444660396","images":["https://pbs.twimg.com/media/HPmz2oJXsAAdByQ.jpg"],"data_points":["China ETF outflows -$3.4B (May-Jul)","12mo cumulative -$1.0B (1yr high)","FXI -$1.6B YTD","MCHI -$868M YTD","KWEB -$833M YTD"],"created_at":"2026-08-13T20:45:28.000Z"},{"author":"sentimentrader","description":"Smart Money / Dumb Money Confidence as of Aug 13: Smart Money at 0.34 (pessimistic), Dumb Money at 0.65 (very optimistic). Divergence between retail and institutional sentiment is wide.","tweet_url":"https://x.com/sentimentrader/status/2088084296812888233","images":["https://pbs.twimg.com/media/HPpdkf0aUAAil79.jpg"],"data_points":["Smart Money Confidence: 0.34","Dumb Money Confidence: 0.65"],"created_at":"2026-08-14T02:04:25.000Z"},{"author":"sentimentrader","description":"VIX fell below 15 at a six-month low. Historically after VIX drops to a 6-month low below 15, the S&P 500 averaged +1.0% over the next month with an average maximum drawdown of only 1.4% — low VIX has usually carried inertia.","tweet_url":"https://x.com/sentimentrader/status/2088090980855787806","images":["https://pbs.twimg.com/media/HPpjnfaaYAAde4u.png"],"data_points":["VIX below 15 (6-month low)","S&P 500 avg +1.0% next month historically","Avg max drawdown 1.4%"],"created_at":"2026-08-14T02:30:59.000Z"},{"author":"AAIISentiment","description":"AAII just launched a completely redesigned Sentiment Survey page — new interface for tracking weekly retail investor bull/bear sentiment.","tweet_url":"https://x.com/AAIISentiment/status/2088003121515561160","images":["https://pbs.twimg.com/media/HPoTtD7WEAAt_5s.jpg"],"data_points":[],"created_at":"2026-08-13T20:41:52.000Z"},{"author":"EricBalchunas","description":"Notes the irony: as index fund companies see inflows, they are mechanically forced to buy all stocks — including speculative names. Passive riven rally.","tweet_url":"https://x.com/themarketear/status/2088019922798379176","images":[],"data_points":[],"created_at":"2026-08-13T21:48:37.000Z"},{"author":"themarketear","description":"Brazil EWZ is at a must-hold support level. Election risk rising, fiscal credibility fading, vol still cheap — setting up as an interesting trade.","tweet_url":"https://x.com/themarketear/status/2088012365392457866","images":[],"data_points":[],"created_at":"2026-08-13T21:18:35.000Z"},{"author":"bespokeinvest","description":"Friday event calendar is light. Only notable release: Baker Hughes rig count at 1:00 PM ET.","tweet_url":"https://x.com/bespokeinvest/status/2088015361530634315","images":["https://pbs.twimg.com/media/HPm0iP-W0AAWMwm.png"],"data_points":["Baker Hughes rig count: 1:00 PM ET Friday"],"created_at":"2026-08-13T21:30:30.000Z"},{"author":"RyanDetrick","description":"CNBC appearance (Carson Group): covered investing through the lost decade, current market sentiment, Gen Z feeling the market is rigged, and why the bull market isn't over yet. Multiple slides/charts shared.","tweet_url":"https://x.com/RyanDetrick/status/2088095212136468717","images":["https://pbs.twimg.com/media/HPpnhStXYAAFgEQ.jpg","https://pbs.twimg.com/media/HPpnhe5WkAAsobd.jpg","https://pbs.twimg.com/media/HPpnhrsXYAE81Le.jpg","https://pbs.twimg.com/media/HPpnh5OWAAACS0Z.jpg","https://pbs.twimg.com/media/HPpol28WUAAuCIG.jpg","https://pbs.twimg.com/media/HPpomQcWkAAmgE4.jpg","https://pbs.twimg.com/media/HPpomzSXkAErfzy.jpg","https://pbs.twimg.com/media/HPponMuW4AA8ucD.jpg"],"data_points":[],"created_at":"2026-08-14T02:47:48.000Z"}]},{"topic":"Economic Indicators & Labor","items":[{"author":"KobeissiLetter","description":"Full-time employment fell 106,000 in July to 133.55 million — the lowest since December 2024. This is the 4th consecutive monthly decline, totaling -1.11 million. Since January 2025, full-time employment has dropped -2.35 million. Full-time employment is only 1.4% above pre-pandemic levels. The ratio of full-time to total employment fell to 82.4% — 3rd lowest since March 2018.","tweet_url":"https://x.com/KobeissiLetter/status/2088069641868316902","images":["https://pbs.twimg.com/media/HPmzXIcWMAA_Su6.jpg"],"data_points":["Full-time employment -106K in July","Total: 133.55M (Dec 2024 low)","4th consecutive monthly decline","-1.11M total decline streak","-2.35M since Jan 2025","FT ratio: 82.4% (3rd lowest since Mar 2018)"],"created_at":"2026-08-14T01:06:11.000Z"},{"author":"LizAnnSonders","description":"Atlanta Fed Wage Growth Tracker ticked up to +3.8% in July. Job switchers continue to see stronger wage gains than job stayers.","tweet_url":"https://x.com/LizAnnSonders/status/2087947742265889207","images":["https://pbs.twimg.com/media/HPnhaByWQAAY0iu.jpg"],"data_points":["Wage Growth Tracker +3.8% July","Switchers > Stayers"],"created_at":"2026-08-13T17:01:48.000Z"},{"author":"charliebilello","description":"Surging commodity prices will keep CPI above 3% YoY in August — this will be the 66th consecutive month with US inflation above the Fed's 2% target. The market is not pricing a September rate hike, meaning the Fed will remain further behind the curve.","tweet_url":"https://x.com/charliebilello/status/2087995178329993629","images":["https://pbs.twimg.com/media/HPoMfnHXQAA07qE.png"],"data_points":["CPI >3% YoY expected August","66th consecutive month above 2%","No September hike priced in"],"created_at":"2026-08-13T20:10:18.000Z"},{"author":"Polymarket","description":"Survey: 66% of AI workers in India expect major layoffs within the next 3-6 months.","tweet_url":"https://x.com/Polymarket/status/2088129991561052285","images":[],"data_points":["66% of AI workers in India expect major layoffs in 3-6 months"],"created_at":"2026-08-14T05:06:00.000Z"}]},{"topic":"Fiscal Policy & National Debt","items":[{"author":"charliebilello","description":"Washington's budget cycle: raise the debt ceiling, keep spending, run massive deficits, repeat. Result: the national debt is up $3.7 trillion in just 13 months.","tweet_url":"https://x.com/charliebilello/status/2088086018964496885","images":["https://pbs.twimg.com/media/HPpfIiPXcAAnYmr.png"],"data_points":["National debt +$3.7T in 13 months"],"created_at":"2026-08-14T02:11:16.000Z"},{"author":"charliebilello","description":"The US national debt has increased by over $550 billion since July 1st. The federal government continues to borrow from the future at an accelerating rate.","tweet_url":"https://x.com/charliebilello/status/2088001645510590645","images":["https://pbs.twimg.com/media/HPoSYCjWoAAC6b-.png"],"data_points":["US debt +$550B since July 1"],"created_at":"2026-08-13T20:36:00.000Z"},{"author":"charliebilello","description":"Trump stated: 'We're going to pay down debt. We have a lot of money coming in... there could be a distribution or dividend to the people... for middle-income and lower-income people.' Framing tariff revenues as deficit-reduction and potential direct payments.","tweet_url":"https://x.com/charliebilello/status/2088010845166989736","images":[],"data_points":[],"created_at":"2026-08-13T21:12:33.000Z"},{"author":"kurtsaltrichter","description":"Illustrated via Powerball: A $1 billion jackpot now pays only $433M in cash. In 2021, a smaller $731M prize paid $547M. The gap = bond yields. Long-dated Treasuries (EDV) are down ~50% since 2021 while the S&P 500 nearly doubled. Duration is a bet on falling yields — for 5 years that bet has cost holders half their money.","tweet_url":"https://x.com/kurtsaltrichter/status/2088053998855020555","images":["https://pbs.twimg.com/media/HPpCC9hXQAIP1mR.jpg"],"data_points":["EDV down ~50% since 2021","S&P 500 nearly doubled since 2021","Powerball $1B jackpot → $433M cash","2021 $731M prize paid $547M cash"],"created_at":"2026-08-14T00:04:02.000Z"}]},{"topic":"Housing Market","items":[{"author":"kurtsaltrichter","description":"The median first-time homebuyer in America is now 40 years old — a record high, up fro ear reactors under construction. The United States has 0.","tweet_url":"https://x.com/zerohedge/status/2088101699017752927","images":["https://pbs.twimg.com/media/HPptW25WIAAEjVZ.png"],"data_points":["China: 37 nuclear reactors under construction","US: 0 reactors under construction"],"created_at":"2026-08-14T03:13:34.000Z"},{"author":"C_Barraud","description":"Bloomberg: China's high-tech boom is seen failing to halt the broader economic slowdown — tech sector outperformance is not translating to aggregate GDP acceleration.","tweet_url":"https://x.com/C_Barraud/status/2088128562893045847","images":["https://pbs.twimg.com/media/HPqFz-cXYAI-pCK.png"],"data_points":[],"created_at":"2026-08-14T05:00:19.000Z"},{"author":"C_Barraud","description":"Reuters: White House says goods transshipped through third countries to evade US tariffs cost between $19 billion and $26 billion in lost tariff revenue.","tweet_url":"https://x.com/C_Barraud/status/2088127406259175866","images":[],"data_points":["Transshipping: $19B–$26B in lost tariff revenue"],"created_at":"2026-08-14T04:55:43.000Z"},{"author":"zerohedge","description":"Treasury Secretary Bessent says the US is about to 'apply measures on Iran that have never been seen in history' — unprecedented economic isolation expected next week. Polymarket: 20% probability the US provides Iran with reconstruction funding as part of any deal.","tweet_url":"https://x.com/zerohedge/status/2088077606700646861","images":[],"data_points":["20% odds: US provides Iran reconstruction funding (Polymarket)"],"created_at":"2026-08-14T01:37:50.000Z"},{"author":"Polymarket","description":"95% probability Xi Jinping visits the US this year. Separately: a building roughly 650 feet from the White House was reportedly purchased by a former CCP intelligence official.","tweet_url":"https://x.com/Polymarket/status/2088104773421576447","images":[],"data_points":["95% probability Xi Jinping visits US in 2026"],"created_at":"2026-08-14T03:25:47.000Z"},{"author // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = item.description || item.text || '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(renderItem).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const topicCount = (d.topics || []).length;
  const itemCount = (d.topics || []).reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`topics <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const topicsBody = (d.topics || []).map(renderTopic).join('')
                  || '<div class="empty">No topics.</div>';
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Topics', topicsBody, (d.topics || []).length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
