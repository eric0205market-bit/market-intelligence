<title>Twitter Bank Research</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DATA POINT TAGS */
.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>

<script>
const REPORT_DATA = {"report_type": "TWITTER BANK RESEARCH", "collected_at": "2026-11-01T18:23:40Z", "window_days": 4, "input_stats": {"total_tweets": 120, "considered": 120, "kept": 46, "dropped": 74, "deduped": 0}, "freshness_gate": "FRESHNESS GATE PASSED.", "summary": "Goldman dominates the window: S&P 500 EPS growth (~33% in Q3 2026), valuation/P/E, breadth and hyperscaler capex/FCF charts.\nBofA: Flow Show, CTA Treasury positioning, IG credit supply and S&P 500 FCF.\nConsumer themes recur across Apollo/Slok, JPM and BofA (K-shaped consumer, real consumption).\nHSBC, Yardeni, Citi/Wells Fargo, Morningstar and Citadel each appear with 1-2 items.\nCounts: Goldman 31, BofA 7, Apollo/Slok 2, HSBC 2, Yardeni 2, Citadel 1, Citi 1, JPM 1, Morningstar 1, Wells Fargo 1.", "by_bank_counts": {"Goldman": 31, "BofA": 7, "Apollo/Slok": 2, "HSBC": 2, "Yardeni": 2, "Citadel": 1, "Citi": 1, "JPM": 1, "Morningstar": 1, "Wells Fargo": 1}, "banks": [{"bank": "Goldman", "theme": "S&P 500 earnings, valuation and breadth charts; hyperscaler capex and free cash flow; Q3 earnings reaction stats", "items": [{"author": "MikeZaccardi", "text": "S&P 500 EW 16x P/E GS... near the average of the last 10 years.. nice AI diversification https://t.co/bXli5MwOKt", "tweet_url": "https://x.com/MikeZaccardi/status/2116948637443838224", "images": ["https://pbs.twimg.com/media/HWDpkTsW4AAC42w.png"], "created_at": "2026-11-01T17:41:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Honing on a 33% SPX EPS growth rate this year... upside or downside risk to next year's 16% assumption? GS https://t.co/gtH04GQpM6", "tweet_url": "https://x.com/MikeZaccardi/status/2116943604002218236", "images": ["https://pbs.twimg.com/media/HWDk_V3WoAARGLp.png"], "created_at": "2026-11-01T17:21:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Nasdaq 100 P/E cools further to 22x GS https://t.co/JNIyixvjkw", "tweet_url": "https://x.com/MikeZaccardi/status/2116938570510348711", "images": ["https://pbs.twimg.com/media/HWDgaXhWYAEoHNG.jpg"], "created_at": "2026-11-01T17:01:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "As a reminder three weeks ago Goldman's Brian Garrett flagged the extreme short position in the Russell 2000 \"maximum short, minimum insurance against being wrong\".\n\nThis week Goldman notes that those shorts have started to cover as \"open interest fell by $2.1 billion while 3m funding cheapened meaningfully – both outright and relative to the S&P 500 (Chart 3) – indicating the advance was driven by orderly short covering, into which recently added length took profit rather than chasing.\"\n\n\"Looking ahead, the setup for the Russell 2K remains constrained: heightened rate sensitivity and debt-refinancing headwinds will continue to cap upside. Furthermore, should Friday's price action persist, GS systematic momentum thresholds are set to flip negative, halting projected CTA buying and muting potential for near-term upside.\"", "tweet_url": "https://x.com/neilsethinew/status/2116938318684581968", "images": ["https://pbs.twimg.com/media/HWC39RJWAAADZw6.jpg"], "created_at": "2026-11-01T17:00:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "US large-cap value is +26% YTD with a super Sharpe GS\n\nOh my.. Comm Services battles with bitcoin for the bottom spot https://t.co/ZN8UaKF27J", "tweet_url": "https://x.com/MikeZaccardi/status/2116928505329987956", "images": ["https://pbs.twimg.com/media/HWDXQbzW8AABNvu.jpg"], "created_at": "2026-11-01T16:21:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Tech sector P/E right at its 30-year average GS https://t.co/xMHyOc55xF", "tweet_url": "https://x.com/MikeZaccardi/status/2116918438325023049", "images": ["https://pbs.twimg.com/media/HWDOGfAXMAAngf4.jpg"], "created_at": "2026-11-01T15:41:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "S&P 500 realized average stock correlation remains near record lows... imagine the freakout if this spiked in a bearish tape... GS https://t.co/6RXQY9aRF0", "tweet_url": "https://x.com/MikeZaccardi/status/2116906358284931454", "images": ["https://pbs.twimg.com/media/HWDDHYZWoAAJE8E.png"], "created_at": "2026-11-01T14:53:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "The largest 10 stocks are just about carrying their own weight in earnings GS\n\n39% vs 37% https://t.co/AA7r567bz4", "tweet_url": "https://x.com/MikeZaccardi/status/2116902583600034020", "images": ["https://pbs.twimg.com/media/HWC_rpiXsAA8KlC.png"], "created_at": "2026-11-01T14:38:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman on Friday's unprecedented action of over 80% of the SPX advancing on a down day:\n\n\"We suspect month-end dynamics were somewhat at play with the aggressive price action to end the week. Going into today, US Pensions were modeled to BUY $4.5B of US equities, driven by relative performance of 0.96% in equities vs 2.51% in bonds. \n\n\"$4.5B to buy ranked in the 31st percentile amongst all buy and sell estimates in absolute dollar value over the past three years and in the 40th percentile going back to Jan 2000.\"", "tweet_url": "https://x.com/neilsethinew/status/2116900570875257080", "images": ["https://pbs.twimg.com/media/HWAQ5NzWcAAzoAJ.jpg"], "created_at": "2026-11-01T14:30:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Market breadth just had one of its best weekly improvements in the last 20 years... GS https://t.co/km1sbq6Hj9", "tweet_url": "https://x.com/MikeZaccardi/status/2116893306877571442", "images": ["https://pbs.twimg.com/media/HWC3PrcXEAEVy8-.png"], "created_at": "2026-11-01T14:01:08.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Goldman tracks 2.2% Q4 GDP based on market trends.. 2027 US real GDP growth seen near 2.2% (consensus) https://t.co/nwJgn0Npmi", "tweet_url": "https://x.com/MikeZaccardi/status/2116889498994852024", "images": ["https://pbs.twimg.com/media/HWCzx_0XwAAFEhy.png"], "created_at": "2026-11-01T13:46:01.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Some epic collapses last week.. a handful of S&Pers fell 20% or more GS https://t.co/DaLAOlbKNE", "tweet_url": "https://x.com/MikeZaccardi/status/2116885722443534397", "images": ["https://pbs.twimg.com/media/HWCwWLiXIAAZ94Z.jpg"], "created_at": "2026-11-01T13:31:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: Friday QQQ was smashed as pain was felt across the tech universe. The realized vs implied move was one of the most outsized instances on a 1y lookback. https://t.co/l5IgVX644P", "tweet_url": "https://x.com/neilsethinew/status/2116885471431450976", "images": ["https://pbs.twimg.com/media/HWAQSnzWIAA4Hkk.png"], "created_at": "2026-11-01T13:30:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "The S&P 500 12-month ahead bottom-up consensus price target is 9150.. seems high.. that's be a 23% total return GS https://t.co/LwUhYtDxjt", "tweet_url": "https://x.com/MikeZaccardi/status/2116881947754480116", "images": ["https://pbs.twimg.com/media/HWCs6fiXQAAs4AY.png"], "created_at": "2026-11-01T13:16:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Goldman sees S&P 8700 in 12 months... about a 16% total return if so https://t.co/HOENevar1H", "tweet_url": "https://x.com/MikeZaccardi/status/2116878172402659601", "images": ["https://pbs.twimg.com/media/HWCpeu0XkAESxZj.png"], "created_at": "2026-11-01T13:01:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman (Wilson): I’d been arguing that this week (hyperscaler results) and next (mid-terms) would mark peak event risk for the market, and that clearing these 2 weeks would likely allow for a year-end rally, probably led by the biggest stocks in the index. I’d also argued that the AI sentiment pendulum had swung too far since end-Q2 and that substantive opportunities were beginning to emerge again.\n\nWell … ouch. Its been a pretty bruising couple of weeks navigating that view; for every step forward there’s been twice as many back.\n\nI don’t like the fact these notes have become so dominated by the AI debate, there’s so much else going on in the world... However, the reality is that the largest driver in macro markets today continues to be the AI investment cycle, and the resolution (either way) of newsflow in the coming weeks is still likely best expressed via many of the micro themes & trades in equity markets.\n\nAs that AI-myopia and rotational pivot has amplified in markets, investors have been left to navigate unprecedented breakdowns in stock correlations: Apple is now negatively correlated to the Nasdaq for the first time ever.", "tweet_url": "https://x.com/neilsethinew/status/2116877928466092301", "images": ["https://pbs.twimg.com/media/HV_JriLXwAA_Ll2.png"], "created_at": "2026-11-01T13:00:02.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: S&P 500 EPS growth is on track to register 33% year/year in Q3 2026. This would match Q2 as the strongest quarter in recent decades outside of post-recession recoveries.\n\nConsensus estimates for 2027 S&P 500 EPS have risen by 2% since the start of the earnings season. https://t.co/EwjmVgPEmv", "tweet_url": "https://x.com/MikeZaccardi/status/2116874397570990478", "images": ["https://pbs.twimg.com/media/HWCmDAjW4AAk6og.jpg"], "created_at": "2026-11-01T12:46:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Hyperscaler cloud revenue growth continued to accelerate in Q3... and backlogs swelled, on net, for $AMZN $GOOGL $MSFT \n\nMaybe stick to your knitting? https://t.co/IuXWAaFzdI", "tweet_url": "https://x.com/MikeZaccardi/status/2116870622454096166", "images": ["https://pbs.twimg.com/media/HWCinRyXcAADK-P.png"], "created_at": "2026-11-01T12:31:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Hyperscaler capex spending now exceeds operating cash flow, and analysts expect the group's free cash flow to continue declining in 2027 before turning positive again in 2028.\n\nCapex vigilantes may have the final say on that https://t.co/OMcDqUlCeH", "tweet_url": "https://x.com/MikeZaccardi/status/2116866847421182076", "images": ["https://pbs.twimg.com/media/HWCfLjRWYAA4f0-.png"], "created_at": "2026-11-01T12:16:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Consensus estimates show hyperscaler free cash flow declining further in 2027 but rebounding in 2028 https://t.co/k4c4h8p4SZ", "tweet_url": "https://x.com/MikeZaccardi/status/2116551268260892795", "images": ["https://pbs.twimg.com/media/HV-AKaHXMAAKLjj.png"], "created_at": "2026-10-31T15:22:00.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"Valuation bear market... Global equities have de-rated materially, with 12m forward P/E ratios down c.20%\"\n\nGoldman Sachs via @MikeZaccardi https://t.co/k6SiNwaknE", "tweet_url": "https://x.com/dailychartbook/status/2116545880547328487", "images": ["https://pbs.twimg.com/media/HV97QzOXEAAw-1C.png"], "created_at": "2026-10-31T15:00:36.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Hyperscaler aggregate free cash flow turned negative in Q3\n$AMZN $GOOGL $META $MSFT $ORCL https://t.co/dEcXvxMmS8", "tweet_url": "https://x.com/MikeZaccardi/status/2116534658615615764", "images": ["https://pbs.twimg.com/media/HV9xDnpWMAAGNZR.png"], "created_at": "2026-10-31T14:16:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: The median stock beating EPS estimates has outperformed the S&P 500 by 152 bp on the day after reporting earnings, above the historical median. \n\nThis pattern marks a reversal following several quarters of below-average rewards for EPS beats. \n\nBut under hood there is a large discrepency between TMT (Technology, Media, and Telecommunications) which fallen 76 bp and non-TMT which have risen 172 bp. \n\nStocks in cyclical sectors — which have recently experienced a large decline in hedge fund positioning — have performed best following earnings beats.", "tw // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
