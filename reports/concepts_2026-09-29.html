shed_date": "2026-09-28", "language": "en", "processed_at": "2026-09-29T11:16:45Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Geopolitics", "Tech"], "gist": "Gavekal's AJ Cortese says Chinese EV makers are on track to export over 5mn vehicles in 2026, double 2025, and will next shift production offshore to Europe to get closer to markets and evade tariffs. Half a dozen European projects are under way, often in taken-over plants, so ramp-up may be faster than Japan's in North America; the open question is whether EU regulators can force supply-chain localization and tech transfer. Teaser only.", "themes": [{"theme": "Chinese EV export surge", "insights": [{"claim": "Chinese EV makers have conquered their home market and are on track to export over 5mn vehicles in 2026, double the 2025 figure.", "speaker": "AJ Cortese", "type": "data_point", "entities": ["Chinese EV makers", "China"], "conviction": "high", "so_what": "Export volume doubling raises pressure on European incumbents and on trade-barrier responses; monitor monthly Chinese export and EU registration data.", "quote": "Chinese EV makers have conquered their home market and are on track to export over 5mn vehicles this year, double the 2025 figure.", "locator": "opening paragraph", "quote_verified": true}]}, {"theme": "Offshoring production to Europe", "insights": [{"claim": "Chinese EV makers' next move is shifting production offshore to be closer to key markets and evade tariffs, with Europe the biggest target.", "speaker": "AJ Cortese", "type": "thesis", "entities": ["Chinese EV makers", "Europe", "tariffs"], "conviction": "high", "so_what": "Tariffs are pushing a shift from exports to local production, which changes who captures value; watch plant announcements and tariff-exposed European carmakers.", "quote": null, "locator": "opening paragraph", "quote_verified": false}, {"claim": "About half a dozen Chinese EV projects are under way in Europe and many more are planned.", "speaker": "AJ Cortese", "type": "data_point", "entities": ["Chinese EV makers", "Europe"], "conviction": "medium", "so_what": "Pipeline of projects signals capacity coming online in the region; track announcements and start-of-production dates.", "quote": null, "locator": "opening paragraph", "quote_verified": false}]}, {"theme": "Speed of localization", "insights": [{"claim": "Chinese EV makers may ramp European production far faster than Japanese carmakers did in North America four decades ago, partly because they are taking over existing plants rather than building new ones.", "speaker": "AJ Cortese", "type": "causal", "entities": ["Chinese EV makers", "Japanese carmakers", "Europe", "North America"], "conviction": "medium", "so_what": "Brownfield takeovers shorten time to local output, so competitive pressure on European incumbents may arrive sooner than the Japan analogy suggests.", "quote": null, "locator": "opening paragraph", "quote_verified": false}]}, {"theme": "EU regulatory response", "insights": [{"claim": "The key uncertainty is whether EU regulators will succeed in driving localization of supply chains and tech transfer from Chinese EV makers.", "speaker": "AJ Cortese", "type": "thesis", "entities": ["EU regulators", "Chinese EV makers", "supply chains"], "conviction": "medium", "so_what": "Outcome determines whether Chinese plants in Europe are mere assembly or transfer technology; monitor EU local-content and tech-transfer conditions.", "quote": "The big question is whether EU regulators will succeed in driving the localization of supply chains and tech transfer.", "locator": "opening paragraph", "quote_verified": true}]}], "insight_total": 5, "top_entities": ["Chinese EV makers", "Europe", "EU regulators", "Japanese carmakers", "North America", "tariffs", "Gavekal Technologies"], "source_meta": {"author": "AJ Cortese", "word_count": 153, "paywalled": false}}, {"record_id": "7ba1523e54d453fa", "source_type": "concepts", "source_name": "Glencore investor reports", "source_url": "https://www.glencore.com/sustainability/ethics-and-compliance/our-ethics-and-compliance-programme", "title": "Our Ethics and Compliance Programme", "published_date": "", "language": "en", "processed_at": "2026-09-29T11:17:03Z", "processor": "claude-code-sub-opus", "tags": ["Society"], "gist": "Glencore's web overview of its Ethics and Compliance Programme: a risk-based, feedback-loop framework built with external counsel and DOJ/UK MoJ/Swiss guidance. Descriptive and promotional, with no quantitative outcomes.", "themes": [{"theme": "Programme design and structure", "insights": [{"claim": "Glencore's Ethics and Compliance Programme comprises risk assessments, policies, standards, procedures and guidelines, training and awareness, advice, monitoring, speaking openly and raising concerns, investigations, and discipline and incentives.", "speaker": "Glencore investor reports", "type": "framework", "entities": ["Glencore"], "conviction": "high", "so_what": "Baseline checklist for judging whether Glencore's compliance framework is complete versus peers.", "quote": null, "locator": "Opening paragraph", "quote_verified": false}, {"claim": "Glencore describes its programme as risk-based, built to address the challenges of its diverse business operations.", "speaker": "Glencore investor reports", "type": "thesis", "entities": ["Glencore"], "conviction": "high", "so_what": "Risk-based framing implies resources are targeted at higher-risk activities such as trading and deals; watch where incidents still occur.", "quote": "The key elements of our Ethics and Compliance Programme establish a risk-based approach to ethics and compliance", "locator": "Paragraph after key elements", "quote_verified": true}, {"claim": "Glencore says the programme elements form a feedback loop intended to identify and address compliance risks across the business on an ongoing basis.", "speaker": "Glencore investor reports", "type": "framework", "entities": ["Glencore"], "conviction": "med ment news.", "quote": null, "locator": "Programme in action section", "quote_verified": false}]}, {"theme": "Culture and speak-up mechanisms", "insights": [{"claim": "Glencore provides safe channels to raise concerns of potential misconduct through its Raising Concerns Programme, with investigations coordinated to be objective and consistent, confidential, and protective against retaliation.", "speaker": "Glencore investor reports", "type": "data_point", "entities": ["Glencore", "Raising Concerns Programme"], "conviction": "medium", "so_what": "Whistleblower channel quality is a leading indicator of misconduct detection; watch reported case volumes.", "quote": null, "locator": "Raising concerns and investigations items", "quote_verified": false}, {"claim": "Glencore lists a refreshed Code of Conduct townhall, deal lifecycle training and a Social Contribution Framework launch as recent programme activities.", "speaker": "Glencore investor reports", "type": "anecdote", "entities": ["Glencore", "Code of Conduct", "Social Contribution Framework"], "conviction": "low", "so_what": "Shows activity but no outcome data; treat as soft evidence of programme maturity.", "quote": null, "locator": "Programme in action section", "quote_verified": false}]}], "insight_total": 8, "top_entities": ["Glencore", "US Department of Justice", "UK Ministry of Justice", "State Secretariat for Economic Affairs", "Raising Concerns Programme", "Code of Conduct", "Social Contribution Framework", "vessel screening"], "source_meta": {"author": "", "word_count": 388, "paywalled": false}}, {"record_id": "f8cd000485885101", "source_type": "concepts", "source_name": "NY Fed — Liberty Street Economics", "source_url": "https://libertystreeteconomics.newyorkfed.org/2026/09/whos-borrowing-and-lending-in-repo-markets/", "title": "Who’s Borrowing and Lending in Repo Markets? - Liberty Street Economics", "published_date": "2026-09-28", "language": "en", "processed_at": "2026-09-29T11:17:32Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Positioning"], "gist": "NY Fed primer on private repo markets (about $13.5 trillion outstanding, 40 percent of GDP, 70 percent Treasury-collateralized): hedge funds are the top cash borrowers (about $3 trillion by late 2025, driven by basis trades) and money market funds the top lenders (about $3 trillion by January 2026). Part one of a three-part series; later posts cover microstructure and monetary policy.", "themes": [{"theme": "Repo market scale and structure", "insights": [{"claim": "The U.S. repo market has roughly $13.5 trillion of agreements outstanding daily, about 40 percent of U.S. GDP, making it a core plumbing layer of the financial system.", "speaker": "Gara Afonso, Jun-Davinci Choi, Gonzalo Cisternas, and Will Riordan", "type": "data_point", "entities": ["repo market", "OFR", "U.S. GDP"], "conviction": "high", "so_what": "Repo stress or rate moves propagate through a market this large; monitor repo rates as a system-wide funding gauge.", "quote": "Repos are an essential component of the U.S. financial system", "locator": "What's a Repo?", "quote_verified": true}, {"claim": "About 70 percent of repos are collateralized by U.S. Treasuries and most are overnight, so repo funding is tightly bound to Treasury market conditions and needs constant rollover.", "speaker": "Gara Afonso, Jun-Davinci Choi, Gonzalo Cisternas, and Will Riordan", "type": "data_point", "entities": ["U.S. Treasury securities", "repo"], "conviction": "high", "so_what": "Treasury supply and liquidity shocks transmit directly into short-term funding; overnight maturity means funding can reprice or vanish quickly.", "quote": null, "locator": "What's a Repo?", "quote_verified": false}, {"claim": "Roughly 60 percent of repos are centrally cleared (35 percent via a central counterparty, 25 percent via a third party) while 40 percent are cleared directly between buyer and seller.", "speaker": "Gara Afonso, Jun-Davinci Choi, Gonzalo Cisternas, and Will Riordan", "type": "data_point", "entities": ["central counterparty", "OFR", "repo"], "conviction": "high", "so_what": "Bilateral share of about 40 percent is the less transparent, less centrally managed part of the market; clearing mandates shift this mix.", "quote": null, "locator": "What's a Repo?", "quote_verified": false}, {"claim": "Repo rates depend on collateral type, maturity, counterparty, haircut size and clearing method, so there is no single repo rate but a family of segmented rates.", "speaker": "Gara Afonso, Jun-Davinci Choi, Gonzalo Cisternas, and Will Riordan", "type": "framework", "entities": ["repo rate", "haircut", "collateral"], "conviction": "high", "so_what": "When reading funding stress, distinguish GC, specific-collateral, cleared and bilateral rates rather than one headline print.", "quote": null, "locator": "What's a Repo?", "quote_verified": false}, {"claim": "Treasury and federal agency repos are exempt from the Bankruptcy Code's automatic stay, letting cash lenders terminate and sell collateral promptly if the borrower defaults, which has supported repo liquidity and growth.", "speaker": "Gara Afonso, Jun-Davinci Choi, Gonzalo Cisternas, and Will Riordan", "type": "causal", "entities": ["Bankruptcy Code", "U.S. Treasury securities", "federal agency securities"], "conviction": "high", "so_what": "The legal safe harbor is a structural reason repo is treated as safe funding; changes to it would reprice repo markets.", "quote": null, "locator": "Repos can be traced back to the early 20th century", "quote_verified": false}, {"claim": "Repo market size and contracting conventions changed markedly in the 1980s after several dealer failures, amid rising and volatile interest rates and growing Treasury debt supply.", "speaker": "Gara Afonso, Jun-Davinci Choi, Gonzalo Cisternas, and Will Riordan", "type": "anecdote", "entities": ["dealers", "Garbade 2006", "Treasury debt"], "conviction": "medium", "so_what": "Historical precedent that dealer failures reshape repo conventions; useful context for judging how crises could change today's rules.", "quote": null, "locator": "Repos can be traced back to the early 20th century", "quote_verified": false}]}, {"theme": "Repo motives: funding versus specific securities", "insights": [{"claim": "A repo has one party borrowing cash and a counterparty that either invests cash for a return or obtains a specific security; the first motive makes repo economically similar to fed funds, Eurodollars or commercial paper, but collateralized.", "speaker": "Gara Afonso, Jun-Davinci Choi, Gonzalo Cisternas, and Will Riordan", "type": "framework", "entities": ["repo", "federal funds", "Eurodollars", "commercial paper"], "conviction": "high", "so_what": "Repo should be compared to other money-market instruments as the collateralized version; collateral lowers lender risk and rate.", "quote": null, "locator": "What Are Repos Used for?", "quote_verified": false}, {"claim": "In general collateral (GC) repo the lender accepts any security meeting set criteria, making GC repo a funding market for cash borrowers financing a basket of securities and cash lenders seeking a competitive rate.", "speaker": "Gara Afonso, Jun-Davinci Choi, Gonzalo Cisternas, and Will Riordan", "type": "framework", "entities": ["GC repo", "cash lenders", "cash borrowers"], "conviction": "high", "so_what": "The GC rate is the benchmark for secured funding costs against which specials are measured.", "quote": null, "locator": "What Are Repos Used for?", "quote_verified": false}, {"claim": "In the worked example a money market fund lends $98 million overnight against Treasuries with a 2 percent haircut and receives $98,009,800 the next day, a 3.6 percent annualized return.", "speaker": "Gara Afonso, Jun-Davinci Choi, Gonzalo Cisternas, and Will Riordan", "type": "data_point", "entities": ["money market funds", "repo dealer", "U.S. Treasury securities"], "conviction": "high", "so_what": "Illustrates that a 3.6 percent annualized overnight repo return is the reference yield MMFs earn on secured cash.", "quote": null, "locator": "An Example of a Repo Transaction", "quote_verified": false}, {"claim": "A security in high demand relative to supply becomes a 'special' and trades at a lower repo rate than GC, because the cash lender seeking the scarce asset forgoes some return.", "speaker": "Gara Afonso, Jun-Davinci Choi, Gonzalo Cisternas, and Will Riordan", "type": "causal", "entities": ["specials", "GC rate", "Duffie 1996"], "conviction": "high", "so_what": "Rates well below GC signal scarcity or crowded shorts in a specific Treasury; a useful positioning indicator.", "quote": null, "locator": "Participants may also engage in repo to acquire a specific security", "quote_verified": false}, {"claim": "Repo resembles securities lending against cash collateral, differing mainly in that repo uses fixed-income collateral and typically gives the lender no right of early recall.", "speaker": "Gara Afonso, Jun-Davinci Choi, Gonzalo Cisternas, and Will Riordan", "type": "framework", "entities": ["repo", "securities lending"], "conviction": "medium", "so_what": "Explains why special repo rates work as the price of borrowing a specific bond.", "quote": null, "locator": "Participants may also engage in repo to acquire a specific security", "quote_verified": false}]}, {"theme": "Hedge funds as top cash borrowers", "insights": [{"claim": "Hedge funds are the largest cash borrowers in private repo markets, using repo for leverage to boost returns.", "speaker": "Gara Afonso, Jun-Davinci Choi, Gonzalo Cisternas, and Will Riordan", "type": "thesis", "entities": ["hedge funds", "repo"], "conviction": "high", "so_what": "Hedge fund leverage is a major channel through which repo conditions affect Treasury market stability.", "quote": "The top cash borrowers in private repo markets are hedge funds.", "locator": "The Borrowers", "quote_verified": true}, {"claim": "The Treasury cash-futures basis trade buys a Treasury, sells a Treasury futures contract, and is levered by financing the purchase in repo against the same securities.", "speaker": "Gara Afonso, Jun-Davinci Choi, Gonzalo Cisternas, and Will Riordan", "type": "framework", "entities": ["Treasury cash-futures basis trade", "hedge funds", "Treasury futures"], "conviction": "high", "so_what": "Basis-trade unwinds forced by repo funding tightening or margin calls are a known Treasury-market fragility to monitor.", "quote": null, "locator": "The Borrowers", "quote_verified": false}, {"claim": "Hedge fund repo borrowing tripled over 2013-23 from $400 billion to $1.5 trillion, then doubled again over the next two years to $3 trillion by late 2025.", "speaker": "Gara Afonso, Jun-Davinci Choi, Gonzalo Cisternas, and Will Riordan", "type": "data_point", "entities": ["hedge funds", "OFR", "repo"], "conviction": "high", "so_what": "Rapid growth in leveraged Treasury financing raises systemic risk if funding conditions or basis spreads turn.", "quote": "hedge fund borrowing in repo markets tripled over 2013-23", "locator": "The Borrowers", "quote_verified": true}, {"claim": "The next three largest repo borrowers (U.S. branches of foreign banks, U.S. depository institutions and REITs) together have borrowed between $800 billion and $1.3 trillion since 2013, far below hedge funds' $3 trillion.", "speaker": "Gara Afonso, Jun-Davinci Choi, Gonzalo Cisternas, and Will Riordan", "type": "data_point", "entities": ["foreign bank branches", "U.S. depository institutions", "REITs"], "conviction": "medium", "so_what": "Hedge funds now dominate marginal repo borrowing; other borrower groups are comparatively stable.", "quote": null, "locator": "The Borrowers", "quote_verified": false}]}, {"theme": "Money market funds as top cash lenders", "insights": [{"claim": "Money market funds are the main cash lenders in repo; their lending rose 90 percent from under $600 billion in January 2013 to $1 trillion in January 2021, then almost tripled to $3 trillion by January 2026.", "speaker": "Gara Afonso, Jun-Davinci Choi, Gonzalo Cisternas, and Will Riordan", "type": "data_point", "entities": ["money market funds", "repo"], "conviction": "high", "so_what": "MMF inflows are the key supply of repo cash; MMF asset growth and allocation shifts drive repo funding availability and rates.", "quote": null, "locator": "The Lenders", "quote_verified": false}, {"claim": "Repo suits MMFs because it is a short-term investment meeting their regulatory maturity and asset-composition requirements while giving flexibility to manage investor redemptions.", "speaker": "Gara Afonso, Jun-Davinci Choi, Gonzalo Cisternas, and Will Riordan", "type": "causal", "entities": ["money market funds", "repo"], "conviction": "high", "so_what": "MMF regulation structurally channels cash into repo, so rule changes or redemption waves shift repo supply.", "quote": null, "locator": "The Lenders", "quote_verified": false}, {"claim": "Hedge funds are the second largest repo lenders despite being net borrowers, lending about $1.3 trillion in late 2025 up from $350 billion in early 2013, to manage cash and liquidity and for collateral transformation.", "speaker": "Gara Afonso, Jun-Davinci Choi, Gonzalo Cisternas, and Will Riordan", "type": "data_point", "entities": ["hedge funds", "repo"], "conviction": "high", "so_what": "Hedge funds are on both sides of repo, so gross exposures and interconnectedness exceed net borrowing figures.", "quote": null, "locator": "The Lenders", "quote_verified": false}, {"claim": "GSEs, foreign bank branches and U.S. depository institutions, also key in fed funds, Eurodollar and selected deposits markets, jointly lent $0.6-$1.5 trillion in repo over 2013-25.", "speaker": "Gara Afonso, Jun-Davinci Choi, Gonzalo Cisternas, and Will Riordan", "type": "data_point", "entities": ["GSEs", "foreign bank branches", "U.S. depository institutions"], "conviction": "medium", "so_what": "Money-market participants move across funding venues, so repo rates are linked to fed funds and Eurodollar conditions.", "quote": null, "locator": "The Lenders", "quote_verified": false}]}, {"theme": "Repo and monetary policy", "insights": [{"claim": "Repos play a key role in monetary policy implementation and central banks use them in their toolkits; the series' third post is set to cover this.", "speaker": "Gara Afonso, Jun-Davinci Choi, Gonzalo Cisternas, and Will Riordan", "type": "thesis", "entities": ["central banks", "monetary policy", "repo"], "conviction": "medium", "so_what": "Repo rates and volumes are a transmission channel for policy and balance-sheet decisions; watch the series' later posts.", "quote": null, "locator": "What Are Repos Used for?", "quote_verified": false}, {"claim": "Private repo is more complex than fed funds or Eurodollar markets because of a broader, more diverse set of ultimate borrowers and lenders, plus dealers acting as instrumental intermediaries.", "speaker": "Gara Afonso, Jun-Davinci Choi, Gonzalo Cisternas, and Will Riordan", "type": "framework", "entities": ["dealers", "federal funds", "Eurodollars"], "conviction": "medium", "so_what": "Dealer balance-sheet capacity is a bottleneck between cash lenders and borrowers; the series' second post covers it.", "quote": null, "locator": "Who Participates in Repo Markets?", "quote_verified": false}]}], "insight_total": 21, "top_entities": ["repo market", "hedge funds", "money market funds", "U.S. Treasury securities", "Treasury cash-futures basis trade", "dealers", "OFR", "GSEs", "central counterparty", "REITs"], "source_meta": {"author": "Gara Afonso, Jun-Davinci Choi, Gonzalo Cisternas, and Will Riordan", "word_count": 1901, "paywalled": false}}, {"record_id": "b9b8ab30b2611c81", "source_type": "concepts", "source_name": "Oxford Economics", "source_url": "https://www.oxfordeconomics.com/resource/the-top-us-cities-in-2026/", "title": "The top US cities in 2026", "published_date": "2026-09-28", "language": "en", "processed_at": "2026-09-29T11:17:35Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Society"], "gist": "Oxford Economics' 2026 Global Cities Index has US cities holding half the top 10 and 30 of the top 100, driven by GDP, headquarters and tech-led GDP per person (16 of the top 20). A new 'Cities to Watch' list flags Boise, Durham, Jacksonville and San Antonio as emerging growth metros.", "themes": [{"theme": "US dominance of Global Cities Index", "insights": [{"claim": "US cities account for half of the top 10 and 30 of the top 100 cities in Oxford Economics' 2026 Global Cities Index, with strong Economics scores separating them from the rest of the world.", "speaker": "Sally Li", "type": "data_point", "entities": ["Oxford Economics", "Global Cities Index", "US cities"], "conviction": "high", "so_what": "Confirms concentration of global urban economic weight in US metros; supports overweight US regional exposure.", "quote": "Strong Economics scores are what set US cities apart from the rest of the global economy.", "locator": "Opening paragraph", "quote_verified": true}, {"claim": "The 90 US cities in the GCI (9% of the 1,000 analysed) generate a third of the composite GDP, with average GDP per capita of $101,000, close to four times the GCI weighted city average.", "speaker": "Sally Li", "type": "data_point", "entities": ["US cities", "Global Cities Index"], "conviction": "high", "so_what": "Highlights outsized productivity of US metros versus global peers.", "quote": null, "locator": "US cities lead the top 100", "quote_verified": false}, {"claim": "US cities' Human Capital scores are high because they host 21% of GCI corporate headquarters, plus top universities and high educational attainment.", "speaker": "Sally Li", "type": "data_point", "entities": ["US cities", "corporate headquarters", "universities"], "conviction": "high", "so_what": "HQ and university clustering is a durable moat for talent and high-value jobs.", "quote": null, "locator": "US cities lead the ", "so_what": "Shows a non-tech route to high urban productivity.", "quote": null, "locator": "Chart 3 paragraph", "quote_verified": false}, {"claim": "US cities hold 16 of the top 20 spots for GDP per person (80%); only smaller, specialised cities like Dublin, Basel, Luxembourg and Zurich break in.", "speaker": "Sally Li", "type": "data_point", "entities": ["US cities", "Dublin", "Basel", "Luxembourg", "Zurich"], "conviction": "high", "so_what": "US productivity per head is hard to match among large cities.", "quote": null, "locator": "Chart 3 paragraph", "quote_verified": false}]}, {"theme": "Cities to Watch: emerging growth metros", "insights": [{"claim": "The new 'Cities to Watch' list names Boise, Durham, Jacksonville and San Antonio as US cities with steady job, GDP and population growth, aided by strong post-Covid in-migration.", "speaker": "Sally Li", "type": "thesis", "entities": ["Boise", "Durham", "Jacksonville", "San Antonio"], "conviction": "medium", "so_what": "Candidate secondary metros for regional growth, real estate and labour-market exposure.", "quote": null, "locator": "Several US cities are emerging as growth leaders", "quote_verified": false}, {"claim": "In-migration to these four cities was driven by outdoor amenities, and they score better on Environment metrics than larger peers.", "speaker": "Sally Li", "type": "causal", "entities": ["Boise", "Durham", "Jacksonville", "San Antonio", "in-migration"], "conviction": "medium", "so_what": "Amenity-driven migration shapes where population growth flows.", "quote": null, "locator": "Several US cities are emerging as growth leaders", "quote_verified": false}, {"claim": "Boise and Durham attract young people via large universities that foster entrepreneurship; Boise's tech growth is helped by Micron, which is undergoing a $50 billion expansion.", "speaker": "Sally Li", "type": "data_point", "entities": ["Boise", "Durham", "Micron", "Boise State University"], "conviction": "medium", "so_what": "Micron's $50bn expansion is a local demand driver for Boise; watch semis capex.", "quote": null, "locator": "Boise and Durham have especially drawn", "quote_verified": false}, {"claim": "Durham's growth is concentrated in life sciences and pharma near Research Triangle Park, shared with Raleigh.", "speaker": "Sally Li", "type": "data_point", "entities": ["Durham", "Raleigh", "Research Triangle Park", "life sciences"], "conviction": "medium", "so_what": "Biotech clustering underpins Durham-Raleigh growth.", "quote": null, "locator": "Boise and Durham have especially drawn", "quote_verified": false}, {"claim": "Jacksonville's growth is led by fintech alongside finance, federal government and tourism, while San Antonio's growth is diversified across military, defence contractors, auto manufacturing, finance and tourism.", "speaker": "Sally Li", "type": "data_point", "entities": ["Jacksonville", "San Antonio", "fintech", "defence contractors"], "conviction": "medium", "so_what": "Diversified bases make these cities resilient growth stories.", "quote": null, "locator": "Jacksonville too has thrived", "quote_verified": false}]}, {"theme": "Rank movers and Human Capital versus size", "insights": [{"claim": "Biggest GCI ranking climbers include Greenville (SC), Charleston, Provo, Fresno and Indianapolis, driven by steady economic growth and improved Human Capital metrics such as headquarters and educational attainment.", "speaker": "Sally Li", "type": "data_point", "entities": ["Greenville", "Charleston", "Provo", "Fresno", "Indianapolis"], "conviction": "medium", "so_what": "Signals where relative momentum is building outside the coastal giants.", "quote": null, "locator": "Meanwhile, other US cities climbed", "quote_verified": false}, {"claim": "Biggest GCI ranking decliners include New Orleans, Rochester (NY), Albany (NY), Hartford and Pittsburgh.", "speaker": "Sally Li", "type": "data_point", "entities": ["New Orleans", "Rochester", "Albany", "Hartford", "Pittsburgh"], "conviction": "medium", "so_what": "Relative laggards may face weaker growth and fiscal pressure.", "quote": null, "locator": "Meanwhile, other US cities climbed", "quote_verified": false}, {"claim": "Smaller cities score lower on Economics due to size but tend to do better on Human Capital because of universities, educational attainment and age profiles; Provo, Durham, Worcester, Madison and Des Moines score among the highest.", "speaker": "Sally Li", "type": "framework", "entities": ["Provo", "Durham", "Worcester", "Madison", "Des Moines"], "conviction": "medium", "so_what": "Size and human capital are separate axes when screening cities.", "quote": null, "locator": "Smaller cities that rank lower on the Economics score", "quote_verified": false}, {"claim": "El Paso, Columbia (SC), Stockton and New Haven have weaker Human Capital but healthy GDP growth and good economic diversity scores; large anchor employers (federal government, state government, Amazon, Yale) boost their economic stability scores.", "speaker": "Sally Li", "type": "data_point", "entities": ["El Paso", "Columbia", "Stockton", "New Haven", "Amazon", "Yale University"], "conviction": "medium", "so_what": "Anchor employers give stability but create concentration exposure.", "quote": null, "locator": "Other smaller cities, such as El Paso", "quote_verified": false}]}, {"theme": "Labour mobility and outlook", "insights": [{"claim": "High US labour mobility forces cities to compete for migrants and jobs, which sets the US apart from cross-continental peers and supports continued productivity and GDP growth.", "speaker": "Sally Li", "type": "causal", "entities": ["US labour mobility", "US cities"], "conviction": "medium", "so_what": "Competition for talent underpins US urban outperformance over time.", "quote": "which often forces cities to compete for migrants and jobs, sets it apart from its cross-continental peers", "locator": "The findings show that every US city has a unique profile", "quote_verified": true}, {"claim": "Oxford Economics expects US cities to keep generating stellar productivity and GDP growth, keeping them at the top of the economic pyramid.", "speaker": "Sally Li", "type": "prediction", "entities": ["US cities", "Oxford Economics"], "conviction": "medium", "so_what": "Base case supports long-run overweight of US metro economies.", "quote": null, "locator": "The findings show that every US city has a unique profile", "quote_verified": false}]}], "insight_total": 19, "top_entities": ["Oxford Economics", "Global Cities Index", "New York", "San Jose", "San Francisco", "Seattle", "Boston", "Boise", "Durham", "Micron"], "source_meta": {"author": "Sally Li", "word_count": 1111, "paywalled": false}}, {"record_id": "589dc301e2d8d440", "source_type": "concepts", "source_name": "Packy McCormick / Not Boring", "source_url": "https://www.notboring.co/p/airbound-as-we-may-move", "title": "Airbound: As We May Move", "published_date": "2026-09-28", "language": "en", "processed_at": "2026-09-29T11:18:59Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI", "Society"], "gist": "Packy McCormick's deep dive on Airbound (founder Naman Pushp, 21), which bets that carbon-fiber-first, autonomous small eVTOLs built for lowest cost per kg-km can follow a Model T cost curve to displace trucks, vans and cars, scaling across three aircraft (5 kg, 100 kg, 500 kg). The author is an investor and flags major risks: unproven targets, incumbents like Zipline/Uber, and regulation.", "themes": [{"theme": "Cost per kg-km as sole objective", "insights": [{"claim": "Airbound optimizes a single loss function, cost per kilogram-kilometer (total cost to build, operate, maintain and refuel an aircraft divided by payload times distance moved over its life), and treats everything else as secondary.", "speaker": "Packy McCormick", "type": "framework", "entities": ["Airbound", "Naman Pushp"], "conviction": "high", "so_what": "A single metric that arbitrates every engineering trade-off is the tell for a vertically integrated efficiency play; track kg-km cost disclosures as the real KPI.", "quote": "There is one loss function that we care about: cost per kilogram-kilometer", "locator": "Airbound: The idea behind Airbound", "quote_verified": true}, {"claim": "Naman Pushp argues aerospace and today's drone industry focus on capabilities engineering, while Airbound pursues efficiency engineering: take a well-understood capability set (vertical takeoff, carry a package, deliver) and make it as cheap as possible, reserving novelty for materials and manufacturing.", "speaker": "Packy McCormick", "type": "contrarian", "entities": ["Airbound", "Zipline", "Naman Pushp"], "conviction": "high", "so_what": "If capabilities commoditize, the winner is the lowest-cost operator, which challenges capability-led drone valuations.", "quote": null, "locator": "Efficiency Engineering", "quote_verified": false}, {"claim": "Airbound's stated thesis is that if flight can be made cheapest per kg-km, it can dominate 80% of cargo and 90% of human movement; the author explicitly notes success is not guaranteed.", "speaker": "Packy McCormick", "type": "thesis", "entities": ["Airbound", "logistics", "eVTOL"], "conviction": "medium", "so_what": "Defines the upside case and the single variable (cost) the whole bet hinges on.", "quote": "flight can dominate all existing transportation for 80% of all cargo and 90% of all human movement", "locator": "Airbound: As We May Move (intro to Naman's vision)", "quote_verified": true}, {"claim": "Naman believes the eVTOL stack (no runway, autonomy, electric, small) is about 90% of the way to replacing cars, with cost the last 10%; without winning on cost the category is merely 'Aviation++'.", "speaker": "Packy McCormick", "type": "thesis", "entities": ["eVTOL", "Airbound", "Joby", "Archer"], "conviction": "high", "so_what": "Frames why cost, not capability, decides whether eVTOL becomes mass-market or stays niche.", "quote": "Cost is the last 10%", "locator": "You Can't Replace a Horse with a Steam Engine", "quote_verified": true}, {"claim": "The author argues that when battery replacement cost dominates operating cost at about 100 kg payload, energy becomes the main cost and the only thing left to squeeze is the aircraft itself.", "speaker": "Packy McCormick", "type": "causal", "entities": ["Airbound", "lithium-ion batteries"], "conviction": "medium", "so_what": "Battery cycle life becomes the key sensitivity; watch cell cost and longevity as the driver of drone logistics unit economics.", "quote": "we can make it so that energy starts to dominate at 100 kgs", "locator": "Medium", "quote_verified": true}]}, {"theme": "Batching and how transport shaped cities", "insights": [{"claim": "Historically, cheap transport of bulk inputs set city size: Rome fed a million people via grain shipping (wagon transport about 50x costlier than sea), London grew on coal colliers, New York rose after the Erie Canal cut grain shipping from $100 and three weeks per ton to $10 and six days.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Erie Canal", "New York City", "Rome", "London", "Philadelphia"], "conviction": "high", "so_what": "Supports the base-rate argument that step changes in movement cost re-rank geographies and asset values.", "quote": null, "locator": "Reshaping the World", "quote_verified": false}, {"claim": "Centralizing 'batch machines' (galley, canal boat, railroad, container ship, jet) create hubs because they are only economic when full, while the car, carrying one family point-to-area, spread cities out; the author claims cheap point-to-point flight would expand the map in every direction at once.", "speaker": "Packy McCormick", "type": "framework", "entities": ["shipping container", "Ford", "Los Angeles", "Singapore", "Dubai"], "conviction": "medium", "so_what": "A reusable model for second-order effects: batch vehicles agglomerate, individual vehicles disperse; point-to-point flight implies real-estate repricing far from hubs.", "quote": null, "locator": "Reshaping the World", "quote_verified": false}, {"claim": "Marchetti's Constant (people commute about 30 minutes each way) explains why urban radius grew from about 2.5km in 1800 to about 20km by 1960 but has stalled since; container ships now move slower than under Nixon and planes fly at similar speeds.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Marchetti's Constant", "Berlin", "container ships"], "conviction": "high", "so_what": "Transport speed has stagnated for 60 years, which is the gap Airbound targets and why any real speed gain would be a discontinuity.", "quote": null, "locator": "Reshaping the World (Marchetti)", "quote_verified": false}, {"claim": "Logistics is organized around batching because every mode sits on a cost-speed-versatility frontier; batching forces waiting and pre-positioned capex-heavy locations (warehouses, DCs, depots) whose rent, inventory and labor are amortized into item prices.", "speaker": "Packy McCormick", "type": "causal", "entities": ["Amazon", "logistics", "distribution centers"], "conviction": "high", "so_what": "If unbatched cheap movement works, the fixed-asset footprint of last-mile logistics (urban DCs) is what gets stranded.", "quote": null, "locator": "Breaking Batch", "quote_verified": false}, {"claim": "Amazon went from eight warehouses to 54 and cut the average package trip from 450 to 141 miles, showing how much capital is spent pre-positioning inventory to buy speed.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Amazon", "NBER"], "conviction": "high", "so_what": "Shows the scale of capex substituted for cheap fast movement; a cheap flying alternative would attack that spend.", "quote": null, "locator": "Breaking Batch", "quote_verified": false}]}, {"theme": "Model T analogy: steam carriage to eVTOL", "insights": [{"claim": "Early steam carriages were effectively buses because their staffing and ng to consumers.", "speaker": "Packy McCormick", "type": "causal", "entities": ["Wright's Law", "Joby", "Archer"], "conviction": "medium", "so_what": "Explains why pushing a cheap small aircraft up the size curve is a structurally different path than pushing an expensive one down the cost curve.", "quote": null, "locator": "Large (S, M, L Aircraft)", "quote_verified": false}, {"claim": "Airbound's bet is to push a sub-$5,000 vehicle up the size curve rather than push a $5M vehicle down the cost curve, funding volume via burritos and blood deliveries before people.", "speaker": "Packy McCormick", "type": "thesis", "entities": ["Airbound", "Wright's Law"], "conviction": "high", "so_what": "Sequencing (cheap cargo first, humans later) is the strategic distinction to underwrite.", "quote": null, "locator": "Large", "quote_verified": false}, {"claim": "Wright's Law originated in a 1936 study of airplane cost (about 20% labor decline per doubling of cumulative output), yet aviation stayed low-volume with fewer than 10,000 aircraft a year versus about 90 million vehicles in autos.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Wright's Law", "aviation industry", "auto industry"], "conviction": "high", "so_what": "Aviation has not ridden the learning curve that made solar, batteries and chips cheap; the volume gap is the opportunity and the risk.", "quote": "The entire aviation industry globally makes less than 10,000 aircraft a year", "locator": "Small, Medium, Large", "quote_verified": true}]}, {"theme": "Carbon-fiber-first, one-piece manufacturing", "insights": [{"claim": "Naman contends carbon fiber is the third materials paradigm (after natural and semi-natural materials), the first designable from the molecule up, and that industry wrongly treats it as a drop-in metal replacement instead of redesigning aircraft around it.", "speaker": "Packy McCormick", "type": "contrarian", "entities": ["carbon fiber", "Airbound", "Naman Pushp"], "conviction": "high", "so_what": "Core technical differentiation claim; validate via manufacturing cost, yield and weight data as they emerge.", "quote": null, "locator": "Betting on Carbon Fiber", "quote_verified": false}, {"claim": "Lighter airframes trigger 'mass decompounding' (smaller battery, fewer or lighter motors, less structure), the reverse of the vicious add-weight loop, and Airbound designs the whole aircraft carbon-fiber-first with design coupled to manufacturing.", "speaker": "Packy McCormick", "type": "causal", "entities": ["mass decompounding", "carbon fiber", "batteries"], "conviction": "high", "so_what": "Weight compounding means small structural savings amplify into battery and motor cost savings, driving kg-km cost.", "quote": null, "locator": "Betting on Carbon Fiber", "quote_verified": false}, {"claim": "Airbound claims to have pioneered manufacturing an entire aircraft, including internal supports, as a single carbon fiber piece (V2), which removes joins that add weight and labor and enables high-aspect-ratio long wings.", "speaker": "Packy McCormick", "type": "thesis", "entities": ["Airbound", "V2", "carbon fiber"], "conviction": "medium", "so_what": "One-piece composite manufacturing is the potential process moat; the claim is unproven at volume.", "quote": "What we have pioneered is the ability to make an entire aircraft in one piece", "locator": "The Airbound Aircraft", "quote_verified": true}, {"claim": "Airbound's in-house composites specialist made the TRT surface from a single layer of roughly 40 gsm carbon cloth, and outside vendors could not work with such light materials, forcing Airbound to build capabilities in-house.", "speaker": "Packy McCormick", "type": "anecdote", "entities": ["Airbound", "Sambid", "TRT"], "conviction": "medium", "so_what": "Evidence that the tight design-manufacturing loop creates know-how suppliers lack, supporting vertical integration.", "quote": null, "locator": "The Airbound Aircraft", "quote_verified": false}, {"claim Erie Canal"], "source_meta": {"author": "Packy McCormick", "word_count": 21445, "paywalled": false}}, {"record_id": "7185b9aafeb7fd08", "source_type": "concepts", "source_name": "Peterson Institute (PIIE)", "source_url": "https://www.piie.com/blogs/realtime-economics/2026/after-two-years-where-mexico-heading-under-president-sheinbaum", "title": "After two years, where is Mexico heading under President Sheinbaum?", "published_date": "2026-09-28", "language": "en", "processed_at": "2026-09-29T11:18:12Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Geopolitics", "Society"], "gist": "Alejandro Werner argues Mexico's baseline through 2030 is continuity: low growth, redistribution, financial stability and no structural reform, with fiscal deficits stuck near 4 percent of GDP and rating risk, offset by domestic savings and a credible central bank. The main threats are US trade policy, Pemex and coalition splits.", "themes": [{"theme": "Baseline: continuity to 2030", "insights": [{"claim": "Mexico's most likely path through 2030 under Sheinbaum is low growth, redistribution, financial stability and no structural reform, because avoiding hard fiscal, energy or growth reforms may be politically winning ahead of the 2030 election.", "speaker": "Alejandro Werner", "type": "thesis", "entities": ["Mexico", "Claudia Sheinbaum", "Morena"], "conviction": "high", "so_what": "Base case is muddle-through: expect no reform catalyst, so Mexican assets trade on carry and external shocks rather than policy change.", "quote": "the most likely scenario between now and 2030 is more of the same: low growth, redistribution, financial stability, and no structural reform", "locator": "Opening paragraphs", "quote_verified": true}, {"claim": "The low-growth, redistribution, slowly deteriorating finances equilibrium worked for López Obrador and appears to work for Sheinbaum, whose approval rating hovers around 70 percent, so it is likely sustainable for the rest of her term.", "speaker": "Alejandro Werner", "type": "data_point", "entities": ["Claudia Sheinbaum", "Andrés Manuel López-Obrador"], "conviction": "high", "so_what": "High approval lowers the odds of a voluntary policy pivot.", "quote": null, "locator": "The equilibrium the administration is relying could prove short-lived", "quote_verified": false}, {"claim": "The current equilibrium only delays Mexico's challenges to the next government and could be disrupted sooner by US trade-policy shocks, a sudden fall in Mexican oil production, or splits inside the governing coalition over pressure to act against party members tied to organized crime or over the 2030 candidate.", "speaker": "Alejandro Werner", "type": "prediction", "entities": ["Mexico", "United States", "Pemex", "Morena"], "conviction": "medium", "so_what": "Watch US trade actions, Pemex output and coalition infighting as the triggers for regime change in Mexican risk pricing.", "quote": null, "locator": "The equilibrium the administration is relying could prove short-lived", "quote_verified": false}]}, {"theme": "Fiscal slippage and rating risk", "insights": [{"claim": "Sheinbaum's consolidation goal of a 2.9 percent of GDP deficit in 2027 has stalled at around 4 percent, with a primary balance near zero; the 2027 budget targets the same level and a gradual move to 3 percent by 2032, but 4 to 5 percent deficits look the most plausible baseline.", "speaker": "Alejandro Werner", "type": "data_point", "entities": ["Mexico", "Sheinbaum government", "2027 budget"], "conviction": "high", "so_what": "Expect deficits to overshoot official paths; treat official consolidation targets skeptically.", "quote": null, "locator": "Fiscal policy", "quote_verified": false}, {"claim": "Stabilizing Mexico's debt-to-GDP needs a primary balance improvement of at least 2 percentage points of GDP, which the author says will only happen with a tax reform.", "speaker": "Alejandro Werner", "type": "causal", "entities": ["Mexico", "tax reform", "IMF"], "conviction": "high", "so_what": "No tax reform means debt keeps drifting up; a tax reform announcement would be a genuine positive catalyst.", "quote": null, "locator": "Fiscal policy", "quote_verified": false}, {"claim": "A growing share of Mexico's infrastructure agenda is financed through quasi-fiscal vehicles whose obligations are hard for outside observers to trace, understating true public liabilities.", "speaker": "Alejandro Werner", "type": "data_point", "entities": ["Mexico", "quasi-fiscal vehicles"], "conviction": "medium", "so_what": "Headline deficit likely understates the true fiscal position; hidden liabilities are a rating-agency risk.", "quote": null, "locator": "Fiscal policy", "quote_verified": false}, {"claim": "Rating agencies have cut Mexico's rating by one and two notches over six years because of fiscal slippage and low growth, putting investment grade at risk, and Pemex's unrestored stand-alone financial strength pulls the sovereign toward junk.", "speaker": "Alejandro Werner", "type": "causal", "entities": ["Mexico", "Pemex", "rating agencies"], "conviction": "high", "so_what": "Sovereign downgrade to junk is a live risk; Pemex contingent liabilities are the key linkage to monitor.", "quote": null, "locator": "Fiscal policy", "quote_verified": false}, {"claim": "Debt dynamics are pressured by rising pension and healthcare spending and an unfavorable r-g differential of very low growth against relatively high implicit interest rates.", "speaker": "Alejandro Werner", "type": "causal", "entities": ["Mexico", "pensions", "healthcare"], "conviction": "medium", "so_what": "Structural drift upward in debt ratio with low growth; no self-correcting mechanism.", "quote": null, "locator": "Fiscal policy", "quote_verified": false}, {"claim": "Mexico can finance deficits from domestic savings because the current account is expected near balance, banks are well capitalized, reserves keep rising, and a rapidly growing local pension system creates deep demand for peso sovereign debt.", "speaker": "Alejandro Werner", "type": "causal", "entities": ["Mexico", "local pension system", "peso sovereign debt", "banks"], "conviction": "high", "so_what": "Domestic bid for local-currency government bonds cushions against foreign outflows and limits crisis odds.", "quote": null, "locator": "Fiscal policy", "quote_verified": false}, {"claim": "Even if debt rises above 60 percent of GDP and Mexico loses investment grade, the author expects it to retain market access and financing capacity like many non-investment-grade emerging markets.", "speaker": "Alejandro Werner", "type": "contrarian", "entities": ["Mexico", "investment grade"], "conviction": "medium", "so_what": "A downgrade would likely be a technical, not a funding, event; forced-selling dislocations could be buying opportunities.", "quote": null, "locator": "Fiscal policy", "quote_verified": false}]}, {"theme": "Monetary policy and Banxico", "insights": [{"claim": "Banco de México's independence has been left untouched by the institutional weakening agenda; it has not intervened in the currency market in eight years and has stayed comparatively hawkish for three years, keeping medium-term inflation expectations 30 basis points above 2012-18 levels.", "speaker": "Alejandro Werner", "type": "data_point", "entities": ["Banco de México", "peso"], "conviction": "high", "so_what": "Central bank credibility remains an anchor for the peso and local rates despite institutional erosion elsewhere.", "quote": null, "locator": "Monetary policy", "quote_verified": false}, {"claim": "August inflation was 3.26 percent, core inflation 3.88 percent, and medium-term inflation expectations 3.80 percent.", "speaker": "Alejandro Werner", "type": "data_point", "entities": ["Banco de México", "Mexico inflation"], "conviction": "high", "so_what": "Inflation is near target, leaving room for a measured policy path.", "quote": null, "locator": "Monetary policy", "quote_verified": false}]}, {"theme": "US trade relationship", "insights": [{"claim": "Mexico has preserved a meaningful tariff advantage in the US market versus third countries despite Trump's threats, with BBVA Research putting the average US tariff on Mexican imports at 3.7 percent, but has not secured a durable agreement, leaving long-term trade-rule uncertainty that weighs on investment.", "speaker": "Alejandro Werner", "type": "data_point", "entities": ["Mexico", "United States", "Donald Trump", "BBVA Research", "USMCA"], "conviction": "high", "so_what": "Trade-regime uncertainty, not current tariffs, is the drag on Mexican capex and nearshoring.", "quote": null, "locator": "Trade", "quote_verified": false}, {"claim": "Mexico has managed US negotiations by spacing out concessions and holding back measures for future threats, including higher tariffs on countries without trade agreements such as China and a proposed foreign investment review regime, a Mexican version of CFIUS, to limit Chinese investment.", "speaker": "Alejandro Werner", "type": "framework", "entities": ["Mexico", "China", "CFIUS", "United States"], "conviction": "medium", "so_what": "Alignment against China is Mexico's currency in USMCA talks; more concessions are in reserve.", "quote": null, "locator": "Trade", "quote_verified": false}, {"claim": "Mexican exports to the US rose 42 percent in two years, fully explained by electronic equipment exports benefiting from the AI investment boom, which made Mexico the top exporter to the US but risks becoming a negotiating liability since US policy aims to reduce bilateral deficits.", "speaker": "Alejandro Werner", "type": "causal", "entities": ["Mexico", "AI", "electronic equipment", "United States"], "conviction": "high", "so_what": "Mexican export strength is an AI-capex derivative and creates political exposure to US deficit-reduction demands.", "quote": null, "locator": "Trade", "quote_verified": false}, {"claim": "Washington has found that leaving the USMCA review incomplete, threatening to exit, or imposing discretionary tariffs is its most effective lever to force Mexican action on migration, security and geopolitical alignment, with tighter rules of origin against Asian inputs the next demand.", "speaker": "Alejandro Werner", "type": "causal", "entities": ["USMCA", "United States", "Mexico", "rules of origin"], "conviction": "medium", "so_what": "Expect stricter rules of origin; Asian-content-heavy Mexican manufacturing supply chains are at risk.", "quote": null, "locator": "Growth", "quote_verified": false}]}, {"theme": "Growth and institutional erosion", "insights": [{"claim": "Mexico has had the weakest average growth in Latin America except Venezuela this century, and growth slowed further in the past eight years, with three proximate causes: erosion of institutions and rule of law, uncertainty over preferential US market access, and sharply higher unit labor costs; their relative contributions have not been empirically decomposed.", "speaker": "Alejandro Werner", "type": "causal", "entities": ["Mexico", "Latin America", "unit labor costs"], "conviction": "medium", "so_what": "Low structural growth caps equity upside and worsens debt dynamics.", "quote": null, "locator": "Growth", "quote_verified": false}, {"claim": "The governing coalition's project of near one-party rule takes precedence over economic policy, with the most ambitious judicial takeover in Mexico's history followed by electoral and media changes, and no respected opposition, so no change of direction is expected unless shocks make voters weigh institutional decay.", "speaker": "Alejandro Werner", "type": "thesis", "entities": ["Morena", "Mexico judiciary", "opposition"], "conviction": "high", "so_what": "Rule-of-law erosion is persistent; price a permanent governance discount in Mexican assets.", "quote": null, "locator": "Growth", "quote_verified": false}, {"claim": "Minimum wage increases and budget-funded redistribution pressure public finances and competitiveness, but the government judges the political and economic benefits worth the cost.", "speaker": "Alejandro Werner", "type": "thesis", "entities": ["Mexico", "minimum wage", "redistribution"], "conviction": "medium", "so_what": "Rising unit labor costs erode manufacturing competitiveness at the margin.", "quote": null, "locator": "Growth", "quote_verified": false}, {"claim": "If market access became restricted, Mexico could either pursue ambitious fiscal reform and more market-friendly policies, or turn heterodox with financial repression, capital controls and higher inflation.", "speaker": "Alejandro Werner", "type": "prediction", "entities": ["Mexico", "capital controls", "financial repression"], "conviction": "exploratory", "so_what": "Tail scenario fork: reform versus heterodoxy determines whether a stress event is buyable.", "quote": null, "locator": "Growth", "quote_verified": false}]}], "insight_total": 20, "top_entities": ["Mexico", "Claudia Sheinbaum", "Pemex", "Banco de México", "USMCA", "United States", "Donald Trump", "China", "López Obrador", "BBVA Research"], "source_meta": {"author": "Alejandro Werner", "word_count": 1810, "paywalled": false}}, {"record_id": "ba98b725b0775c68", "source_type": "concepts", "source_name": "SF Fed Economic Letters", "source_url": "https://www.frbsf.org/research-and-insights/publications/economic-letter/2026/09/stablecoin-issuers-growing-appetite-for-treasury-securities/", "title": "Stablecoin Issuers’ Growing Appetite for Treasury Securities - San Francisco Fed", "published_date": "2026-09-28", "language": "en", "processed_at": "2026-09-29T11:18:49Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Crypto"], "gist": "SF Fed finds stablecoin issuers (Tether, USDC) added about $200B of Treasuries in five years, over 40% of China's holdings decline, and outbought Japan in short-term Treasuries since 2023. Trend extrapolation implies about $400B by 2030, still small relative to US financing needs.", "themes": [{"theme": "Foreign demand erosion", "insights": [{"claim": "The share of US Treasury securities held by foreigners has fallen from a peak above 50% around 2008 to roughly 30% in early 2026, even as federal debt held by the public rose from about 35% of GDP in 2006 to roughly 100%.", "speaker": "Aleisha Sawyer", "type": "data_point", "entities": ["US Treasury", "Federal Reserve Board", "foreign holders"], "conviction": "high", "so_what": "Structural loss of the marginal foreign buyer raises the question of who funds rising deficits and at what term premium; watch the TIC and Fed Z.1 holder shares.", "quote": null, "locator": "Foreign demand for Treasury securities", "quote_verified": false}, {"claim": "Foreign governments' share of foreign Treasury holdings fell from nearly 100% in the 1970s to just above 40% by early 2026, so private foreign investors now dominate foreign demand.", "speaker": "Aleisha Sawyer", "type": "data_point", "entities": ["foreign official institutions", "US Treasury"], "conviction": "high", "so_what": "A more private, price-sensitive foreign base means Treasury demand is more rate-elastic than the reserve-manager era.", "quote": null, "locator": "Foreign demand for Treasury securities", "quote_verified": false}, {"claim": "China's Treasury holdings have fallen by more than half since their late-2013 peak, with the often-cited driver being Beijing's desire to diversify reserves across a broader range of global assets.", "speaker": "Aleisha Sawyer", "type": "data_point", "entities": ["China", "US Treasury"], "conviction": "high", "so_what": "China's diversification is a persistent headwind for long-end Treasury demand; monitor SAFE/TIC data for further declines.", "quote": null, "locator": "Foreign demand for Treasury securities", "quote_verified": false}, {"claim": "If the Treasury investor base shifts toward private investors who are more sensitive to global interest rates, then any perception that US debt is riskier could make them demand greater compensation, eroding the so-called exorbitant privilege of low-cost financing.", "speaker": "Aleisha Sawyer", "type": "causal", "entities": ["US Treasury", "exorbitant privilege", "private investors"], "conviction": "medium", "so_what": "Risk premium on Treasuries becomes more reactive to fiscal-credibility shocks; supports term-premium-up scenarios.", "quote": "Hence, if U.S. debt were perceived as riskier, the larger share of private investors could start requiring greater compensation to hold Treasury securities.", "locator": "Opening paragraphs", "quote_verified": true}]}, {"theme": "Stablecoin issuers as Treasury buyers", "insights": [{"claim": "Stablecoin issuers have become a novel source of Treasury demand because, to protect one-to-one dollar convertibility, they hold liquid assets, particularly short-term Treasury securities.", "speaker": "Aleisha Sawyer", "type": "causal", "entities": ["stablecoin issuers", "US Treasury", "Treasury bills"], "conviction": "high", "so_what": "Stablecoin growth translates mechanically into T-bill demand; crypto adoption is now a rates-market variable.", "quote": null, "locator": "Opening paragraphs", "quote_verified": false}, {"claim": "Tether and USD Coin make up more than 80% of stablecoin market capitalization as of mid-August 2026, and their issuers hold a large fraction of assets in short-term Treasuries alongside cash, bank deposits and repurchase agreements.", "speaker": "Aleisha Sawyer", "type": "data_point", "entities": ["Tether", "USD Coin", "Circle Internet Financial"], "conviction": "high", "so_what": "Treasury demand from stablecoins is concentrated in two issuers, so issuer-specific reserve decisions or regulation can move bill demand.", "quote": null, "locator": "Stablecoin issuers' demand for Treasury securities", "quote_verified": false}, {"claim": "The two largest stablecoin issuers' Treasury holdings have grown more than tenfold over five years, largely surpassing growth in Treasury bill holdings of foreign governments.", "speaker": "Aleisha Sawyer", "type": "data_point", "entities": ["Tether", "USD Coin", "foreign governments", "Treasury bills"], "conviction": "high", "so_what": "Stablecoin issuers now rival sovereigns as a bill-market marginal buyer.", "quote": null, "locator": "Stablecoin issuers' demand for Treasury securities", "quote_verified": false}, {"claim": "Over five years stablecoin issuers added about $200 billion of Treasury holdings, more than 40% of the decline in China's holdings, partially offsetting Chinese diversification.", "speaker": "Aleisha Sawyer", "type": "data_point", "entities": ["stablecoin issuers", "China", "US Treasury"], "conviction": "high", "so_what": "A partial substitution of Chinese selling by crypto-dollar demand; net effect on yields depends on maturity mix.", "quote": "Over the past five years, stablecoin issuers have increased their Treasury security holdings by about $200 billion, that is, more than 40% of the decline in China’s holdings over the same period.", "locator": "Stablecoin issuers' demand for Treasury securities", "quote_verified": true}, {"claim": "China's decline in Treasury holdings is mostly in longer-term debt, while stablecoin issuers are buying short-term securities, so the offset is a maturity mismatch that supports bills more than the long end.", "speaker": "Aleisha Sawyer", "type": "framework", "entities": ["China", "stablecoin issuers", "Treasury bills", "term premium"], "conviction": "medium", "so_what": "Stablecoin demand compresses front-end yields but does not backstop duration; a curve-steepening implication.", "quote": null, "locator": "Stablecoin issuers' demand for Treasury securities", "quote_verified": false}, {"claim": "Since 2023 stablecoin issuers have increased holdings of short-term Treasuries by more than Japan, the largest non-US holder, which drove the recent pickup in foreign official bill demand.", "speaker": "Aleisha Sawyer", "type": "data_point", "entities": ["Japan", "stablecoin issuers", "Treasury bills"], "conviction": "high", "so_what": "Stablecoins have outgrown the biggest foreign holder as incremental bill buyers.", "quote": "Notably, since 2023, stablecoin issuers have increased their holdings of short-term Treasury securities more than Japan.", "locator": "Stablecoin issuers' demand for Treasury securities", "quote_verified": true}, {"claim": "Some research cited by the authors finds stablecoin issuers' Treasury demand is already large enough to have a measurable impact on short-term government bond yields.", "speaker": "Aleisha Sawyer", "type": "data_point", "entities": ["stablecoin issuers", "Bank for International Settlements", "short-term Treasury yields"], "conviction": "medium", "so_what": "Stablecoin flows may be a tradeable driver of bill yields; watch stablecoin supply changes against front-end pricing.", "quote": null, "locator": "Opening paragraphs", "quote_verified": false}]}, {"theme": "Run risk and regulation", "insights": [{"claim": "Stablecoin issuers can inherit the problems of fixed exchange rate regimes and banks: if holders doubt par redemption, runs can occur, which is why issuers hold historically safe and liquid assets.", "speaker": "Aleisha Sawyer", "type": "framework", "entities": ["stablecoin issuers", "bank runs", "fixed exchange rates"], "conviction": "high", "so_what": "A stablecoin run would force rapid liquidation of Treasury bills, a channel for stress in short-term funding markets.", "quote": null, "locator": "Stablecoin issuers' demand for Treasury securities", "quote_verified": false}, {"claim": "The GENIUS Act of 2025 will require approved domestic stablecoin issuers to back issuance one-to-one with high-quality liquid assets such as Treasury bills, locking in structural bill demand tied to stablecoin growth.", "speaker": "Aleisha Sawyer", "type": "causal", "entities": ["GENIUS Act", "stablecoin issuers", "Treasury bills"], "conviction": "high", "so_what": "Regulation converts stablecoin growth into a legally required T-bill bid; regulatory changes abroad are a swing factor.", "quote": null, "locator": "Stablecoin issuers' demand for Treasury securities", "quote_verified": false}]}, {"theme": "2030 projection and limits", "insights": [{"claim": "Extrapolating recent trend growth, stablecoin issuers' Treasury demand could nearly double to roughly $400 billion by the end of 2030, and other studies project even stronger growth.", "speaker": "Aleisha Sawyer", "type": "prediction", "entities": ["stablecoin issuers", "US Treasury"], "conviction": "medium", "so_what": "Base case of about $400B is a useful sizing anchor for stablecoin-linked bill demand; upside cases exist.", "quote": "the associated demand for short-term Treasury securities would nearly double to about $400 billion by the end of 2030", "locator": "A simple projection", "quote_verified": true}, {"claim": "Even at $400 billion, stablecoin Treasury holdings would stay substantially smaller than US government financing needs, so they are a meaningful but not decisive source of demand.", "speaker": "Aleisha Sawyer", "type": "thesis", "entities": ["stablecoin issuers", "US Treasury"], "conviction": "high", "so_what": "Do not overstate stablecoins as a solution to deficit financing; they are a marginal bill buyer.", "quote": null, "locator": "Conclusion", "quote_verified": false}, {"claim": "The projection is highly uncertain: stablecoin growth depends on regulations worldwide, competing products, and possible bank technologies that ease cross-border digital payments and compete with stablecoins.", "speaker": "Aleisha Sawyer", "type": "causal", "entities": ["stablecoins", "banks", "regulation"], "conviction": "medium", "so_what": "Bank-issued tokens or tighter rules are the main risks to the stablecoin Treasury-demand story.", "quote": null, "locator": "A simple projection", "quote_verified": false}, {"claim": "Stablecoin use is higher relative to GDP in Africa, the Middle East and Latin America, mostly in international transactions, likely lowering cross-border and remittance costs and offering a store of value where local currency is volatile.", "speaker": "Aleisha Sawyer", "type": "data_point", "entities": ["stablecoins", "Africa", "Middle East", "Latin America", "remittances"], "conviction": "medium", "so_what": "Emerging-market dollarization via stablecoins is the demand base behind issuer reserves; a source of structural dollar demand.", "quote": null, "locator": "A simple projection", "quote_verified": false}, {"claim": "Whether stablecoin demand is additive depends on the investor mix: stablecoins could attract new investors who do not hold Treasuries, or merely let existing holders hold Treasuries indirectly.", "speaker": "Aleisha Sawyer", "type": "framework", "entities": ["stablecoins", "Treasury investors"], "conviction": "medium", "so_what": "Net new demand versus repackaged demand determines whether stablecoins lower yields overall.", "quote": null, "locator": "A simple projection", "quote_verified": false}]}], "insight_total": 18, "top_entities": ["Tether", "USD Coin", "China", "Japan", "US Treasury", "GENIUS Act", "stablecoin issuers", "Bank for International Settlements", "Circle Internet Financial"], "source_meta": {"author": "Aleisha Sawyer", "word_count": 2134, "paywalled": false}}, {"record_id": "08d5f0fd0557faf7", "source_type": "concepts", "source_name": "St. Louis Fed — FRED Blog", "source_url": "https://fredblog.stlouisfed.org/2026/09/what-is-the-treasury-general-account/", "title": "What is the Treasury general account?", "published_date": "", "language": "en", "processed_at": "2026-09-29T11:19:12Z", "processor": "claude-code-sub-opus", "tags": ["Macro"], "gist": "Explainer on the Treasury general account, the federal government's checking account at the Fed. Its balance counts as Fed reserves, has been large (at times over $1 trillion) since 2008, rises with bond auction proceeds, falls with buybacks and payouts, and nearing zero often signals a debt-ceiling squeeze.", "themes": [{"theme": "TGA as government checking account", "insights": [{"claim": "The Treasury general account (TGA) is the US federal government's checking account at the Federal Reserve, used to receive income and pay bills, and commentary on federal finances is often based on flows into and out of it.", "speaker": "St. Louis Fed — FRED Blog", "type": "framework", "entities": ["Treasury general account", "Federal Reserve", "US Treasury"], "conviction": "high", "so_what": "Use TGA flows as the primary gauge of federal cash position and liquidity impact.", "quote": "When you hear commentary on the federal government’s financial situation, the information is often based on the money flowing into and out of the Treasury general account.", "locator": "The takeaway", "quote_verified": true}, {"claim": "The Fed provides the TGA in its role as fiscal agent of the federal government.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["Federal Reserve", "Treasury general account"], "conviction": "high", "so_what": "Ties Treasury cash management directly to the Fed balance sheet.", "quote": null, "locator": "The US government’s checking account", "quote_verified": false}, {"claim": "FRED updates the TGA balance weekly, every Wednesday, so the series is a regular high-frequency monitoring input.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["FRED", "Treasury general account"], "conviction": "high", "so_what": "Build a weekly watch on the Wednesday TGA print.", "quote": null, "locator": "The US government’s checking account", "quote_verified": false}]}, {"theme": "TGA as bank reserves and Fed policy", "insights": [{"claim": "TGA holdings count as reserves at the Fed, equivalent to the reserves banks hold there, so TGA swings interact with system liquidity.", "speaker": "St. Louis Fed — FRED Blog", "type": "framework", "entities": ["Treasury general account", "Federal Reserve", "banks", "reserves"], "conviction": "high", "so_what": "Rising TGA drains bank reserves; falling TGA adds them, relevant for funding markets and risk assets.", "quote": null, "locator": "Reserves held at the Fed", "quote_verified": false}, {"claim": "TGA balances were originally kept minimal to avoid interfering with Fed policy and reserve requirements; that changed in 2008 when banks routinely began holding excess reserves and earning interest on them.", "speaker": "St. Louis Fed — FRED Blog", "type": "causal", "entities": ["Treasury general account", "Federal Reserve", "2008 financial crisis", "excess reserves"], "conviction": "high", "so_what": "Post-2008 regime allows large TGA balances without disrupting policy, changing liquidity dynamics.", "quote": null, "locator": "Reserves held at the Fed", "quote_verified": false}, {"claim": "Since 2008 the TGA has carried considerable balances, at times over a trillion dollars.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["Treasury general account"], "conviction": "high", "so_what": "Trillion-dollar swings are large relative to reserves and can move liquidity materially.", "quote": "Since then, the Treasury general account has been holding considerable balances, at times over a trillion dollars.", "locator": "Reserves held at the Fed", "quote_verified": true}]}, {"theme": "Drivers of TGA inflows and drawdowns", "insights": [{"claim": "Proceeds of new Treasury bond auctions conducted through the Fed land in the TGA, increasing the balance.", "speaker": "St. Louis Fed — FRED Blog", "type": "causal", "entities": ["Treasury bonds", "auctions", "Treasury general account"], "conviction": "high", "so_what": "Heavy issuance rebuilds the TGA and can drain market liquidity.", "quote": null, "locator": "Reserves held at the Fed", "quote_verified": false}, {"claim": "The TGA balance is reduced when Treasury bonds are bought back, when stimulus checks are issued, and when tax rebates turn out high.", "speaker": "St. Louis Fed — FRED Blog", "type": "causal", "entities": ["Treasury general account", "Treasury buybacks", "stimulus checks", "tax rebates"], "conviction": "high", "so_what": "Fiscal outlays and buybacks inject liquidity as the TGA is drawn down.", "quote": null, "locator": "Reserves held at the Fed", "quote_verified": false}]}, {"theme": "TGA and debt ceiling cash-out forecasts", "insights": [{"claim": "When the TGA balance approaches zero it is often because a debt ceiling is approaching.", "speaker": "St. Louis Fed — FRED Blog", "type": "causal", "entities": ["Treasury general account", "debt ceiling"], "conviction": "high", "so_what": "A shrinking TGA is a signal of debt-ceiling stress and possible T-bill and liquidity effects.", "quote": "When the balance gets close to zero, it’s often because a debt ceiling is approaching.", "locator": "Reserves held at the Fed", "quote_verified": true}, {"claim": "Forecasts that the federal government will run out of cash on a given date are made by examining the TGA and its inflows and outflows.", "speaker": "St. Louis Fed — FRED Blog", "type": "framework", "entities": ["Treasury general account", "debt ceiling", "US federal government"], "conviction": "medium", "so_what": "Track TGA balance and net flow trends to time X-date estimates.", "quote": null, "locator": "Reserves held at the Fed", "quote_verified": false}]}], "insight_total": 10, "top_entities": ["Treasury general account", "Federal Reserve", "US Treasury", "debt ceiling", "reserves", "Treasury bonds", "FRED", "2008 financial crisis"], "source_meta": {"author": "", "word_count": 311, "paywalled": false}}, {"record_id": "c5e275d91db31fd8", "source_type": "concepts", "source_name": "World Economic Forum", "source_url": "https://www.weforum.org/podcasts/agenda-dialogues/episodes/chief-economists-outlook-sept-2026/", "title": "Chief Economists Outlook", "published_date": "2026-09-28", "language": "en", "processed_at": "2026-09-29T11:20:00Z", "processor": "claude-code-sub-opus", "
