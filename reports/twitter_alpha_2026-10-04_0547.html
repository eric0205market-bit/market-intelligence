<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-10-04T05:21:02Z", "input_stats": {"total_tweets": 172, "unique_authors": 47, "tweets_with_images": 24, "after_noise_filter": 61}, "summary": "**Fed/Rates:** 'Able vs unwilling' fight: — @dampedspring argues the Fed *can* hit 2% but is *unwilling*, against Lyn Alden's fiscal-dominance view, and would sell **$50bn Treasuries + $50bn MBS monthly** if in charge. @biancoresearch notes **10y TIPS at 2.91%** are only back to the pre-QE **2.74%** average despite debt rising from ~35% to ~100% of GDP. @stevehou says the **5.3% 10y** prices a dot-com style AI boom-then-bust, with **6.3% NGDP vs 2.2% real** growth this year.\n\n**Brazil:** Final Atlas Intel poll puts **Lula 47.6% vs Bolsonaro 47.4%** before tomorrow's vote; @Geiger_Capital still leans Lula slightly.\n\n**Crypto:** Rotation from memes to fundamentals — @fejau_inc says top memes couldn't reach **$500M** and calls this bull market healthier; @Zeneca names **ZEC, DRV, PUMP** as winners and reports crypto card spend **+10% m/m**. @Fiskantes lays out Robinhood's chain playbook. Bitget accepted ~**$30M** of stolen funds per @laurashin.\n\n**AI:** @VitalikButerin demos private LLM use (local Qwen + zkAPI + Tor); @dylan522p defends SemiAnalysis's Cerebras/AMD reporting; @cryptopunk7213 relays a WSJ report on ~400 'Swarmchasers' tracking OpenAI agent incidents.\n\n**Geopolitics:** Iraq moved **2M barrels** through Hormuz; @zriboua flags Iranian diplomats' defections and Houthi-area tribal mobilization.\n\n**Note:** a thin, low-signal weekend batch — most of the 172 tweets are replies and banter.", "sections": {"A_events": [{"cluster": "Brazil Election — Lula vs Bolsonaro Is a Coin Flip", "category": ["geopolitics", "EM", "macro"], "items": [{"author": "Geiger_Capital", "summary": "Ahead of tomorrow's Brazil election, Geiger still leans Lula as a slight favorite.", "tweet_url": "https://x.com/Geiger_Capital/status/2106525476588032083", "images": [], "type": "tweet"}, {"author": "Geiger_Capital", "summary": "Follow-up: Atlas Intel's final poll shows Lula 47.6% vs Bolsonaro 47.4% — effectively a coin flip the night before the vote.", "tweet_url": "https://x.com/Geiger_Capital/status/2106584417909235938", "images": ["https://pbs.twimg.com/media/HTwXXRLW4AAxhNq.jpg"], "type": "tweet"}]}, {"cluster": "Bitget Stolen-Funds Fallout", "category": ["crypto", "regulation"], "items": [{"author": "laurashin", "summary": "About $30M of stolen funds left in a second round that Bitget knowingly accepted. Bitget's representative says the team couldn't rule out a private-key compromise, so moving funds to cold wallets came first. Laura links the full conversation.", "tweet_url": "https://x.com/laurashin/status/2106534804405764506", "images": [], "type": "thread"}, {"author": "zachxbt", "summary": "Defending his reporting on a crypto-card issuer: says illicit actors register fake shell companies rather than real names, that XinbiPay support supplied video proof of its crypto card, and that UPay got two weeks to reply before he posted and only responded afterward, claiming to be a HK entity.", "tweet_url": "https://x.com/zachxbt/status/2106493410559619076", "images": [], "type": "thread"}]}, {"cluster": "Iran / Middle East — Hormuz Transit, Defections, Yemen Mobilization", "category": ["geopolitics", "energy"], "items": [{"author": "zriboua", "summary": "Reacting to a report that Iraq moved 2M barrels of crude through Hormuz on its state tanker company's first such operation in decades: Iran has lost so much power that even Iraq is exploiting it.", "tweet_url": "https://x.com/zriboua/status/2106562128861667656", "images": [], "type": "tweet"}, {"author": "zriboua", "summary": "On an Axios scoop that two Iranian diplomats were 'kicked out' of the US after ignoring a departure order: they look like they were trying to escape; the Islamic Republic is in very bad shape.", "tweet_url": "https://x.com/zriboua/status/2106478275388207289", "images": [], "type": "tweet"}, {"author": "zriboua", "summary": "Flags tribal leaders in Al-Bayda, Yemen calling for mobilization against the Houthis, a 'battle for liberation'.", "tweet_url": "https://x.com/zriboua/status/2106562661991235735", "images": [], "type": "tweet"}]}, {"cluster": "Fed 'Able vs Willing' Debate — Fiscal Dominance, Real Yields, Nominal GDP", "category": ["macro"], "items": [{"author": "dampedspring", "summary": "Long exchange (20 replies) with Lyn Alden and others over whether the Fed is 'unable' (fiscal dominance) or merely 'unwilling' to bring inflation to target. His view: Powell could have returned inflation to target durably but was unwilling; Warsh is able but willingness is unknown. He is skeptical that the rich-saver interest-income cohort outweighs still-restrictive policy. If he ran the Fed: sell $50bn Treasuries and $50bn MBS monthly, buy bills, match any Treasury cut to 10-30y issuance or buybacks bond for bond, and hold short rates — aiming to crush asset prices and raise corporate funding costs. Adds that fiscal outlays currently grow slower than NGDP (a drag), and that deficits in an asset selloff aren't inflationary. Core dispute with Alden: if the Fed can hit target with its own tools, it isn't fiscal dominance.", "tweet_url": "https://x.com/dampedspring/status/2106472798059180408", "images": [], "type": "thread"}, {"author": "dampedspring", "summary": "Replying to biancoresearch's real-yield chart: the pre-2008 period is distorted by weak initial demand for TIPS; the 'excess' TIPS risk premium 1997-2007 was ~50bp by his reading of studies.", "tweet_url": "https://x.com/dampedspring/status/2106537430816055347", "images": [], "type": "tweet"}, {"author": "biancoresearch", "summary": "Responding to a YCC discussion: every yield-curve-control attempt ended with a bond-market blowup (Operation Twist in the 1960s, Japan now, Australia 2021). On real yields: 10y TIPS at 2.91% are only back to the pre-QE average of 2.74%, though debt held by the public has gone from ~35% to ~100% of GDP — if debt drove yields, real yields would be far higher. Cites France's last three days as a counterexample to a skeptic.", "tweet_url": "https://x.com/biancoresearch/status/2106516046723309724", "images": ["https://pbs.twimg.com/media/HTvaVm_WsAA2wB4.png"], "type": "thread"}, {"author": "stevehou", "summary": "Long macro thread on AI vs inflation. Doubling nominal GDP by 2035 needs ~8%/yr; 2026 tracks ~6.3% NGDP with only 2.2% real growth, so mostly inflation. If AI lifts growth to e.g. 4% real + 4% inflation in 2028 (a scenario he attributes to Dylan Patel) without a recession, inflation would run 3-4% for three years — implying the Fed would re-declare war on inflation, making AI an enemy of the 2% target. The 10y at 5.3% is consistent with 2.5-3% real growth and 3% inflation, not 4+4, so the bond market seems to price a dot-com style boom-then-bust. He questions which industries drive GDP given the narrow base of heavy AI users (hedge funds, pharma), and notes technological deflation likely arrives 3-4 years after the inflationary buildout. Prompted by Sholto Douglas's claim that AI capex goes from $1T to $4T by 2028.", "tweet_url": "https://x.com/stevehou/status/2106544318886629419", "images": ["https://pbs.twimg.com/media/HTvy5LLakAAev_p.jpg"], "type": "thread"}, {"author": "DCinvestor", "summary": "Reacting to a post that anyone under 45 is living through their first real rising-rate regime (last one 1960-80): wonders whether higher rates will stop VC funding trash, or merely stop private equity from buying and ruining local businesses.", "tweet_url": "https://x.com/DCinvestor/status/2106523940063703211", "images": [], "type": "tweet"}]}, {"cluster": "Crypto Cycle Character — Meme Coin Decay vs Fundamentals Rotation", "category": ["crypto", "positioning"], "items": [{"author": "fejau_inc", "summary": "Reflecting on the latest meme run: top memes couldn't reach $500M market cap, a 'runner' was ~$30M — far below past cycles; $1B is now a pipe dream. Expects the trend to continue while launchpads and meme supply keep expanding; trading opportunities exist but don't let 'industrial trench farms' convince you it's durable. Quoting a post comparing it to the end of the NFT cycle.", "tweet_url": "https://x.com/fejau_inc/status/2106523860359340155", "images": [], "type": "thread"}, {"author": "fejau_inc", "summary": "More excited about this bull market than the last: better coins with clearer value accrual, fully vested tokenomics, regulatory clarity, no dual equity/token structures, and higher dispersion rewarding teams that persisted through the alt bear market. 'These aren't currencies, they're businesses.'", "tweet_url": "https://x.com/fejau_inc/status/2106477589426835768", "images": [], "type": "thread"}, {"author": "Evan_ss6", "summary": "Replying in a thread on alts vs BTC: whoever picks the winning alts outperforms BTC (ETH 2017, SOL/LUNA/AVAX 2021, SOL/HYPE 2025), with hindsight caveats and many losers each cycle.", "tweet_url": "https://x.com/Evan_ss6/status/2106479305668571202", "images": [], "type": "thread"}, {"author": "Evan_ss6", "summary": "Quote-tweets a post that 'the graveyard is much bigger than this, many more graves to be dug' (a chart of dead projects).", "tweet_url": "https://x.com/Evan_ss6/status/2106520847653449912", "images": ["https://pbs.twimg.com/media/HTvdirhWgAACff7.jpg"], "type": "tweet"}, {"author": "MoonOverlord", "summary": "Quip: add a billion to PUMP's market cap for every failed launchpad attempt.", "tweet_url": "https://x.com/MoonOverlord/status/2106555287092257275", "images": [], "type": "tweet"}, {"author": "zeroxkyle", "summary": "Advice that this cycle's investors should ignore big-name partnerships teams use to pump tokens and focus on real, growing fundamentals (revenue-style metric chart attached).", "tweet_url": "https://x.com/zeroxkyle/status/2106571278929010769", "images": [], "type": "tweet"}, {"author": "0xQuit", "summary": "On the MegaETH sale: bid the $182k max after selling BTC at $112k, got zero allocation, and by the time the refund arrived BTC was $90k — 'saved a bunch of money'.", "tweet_url": "https://x.com/0xQuit/status/2106556607849009549", "images": [], "type": "tweet"}]}, {"cluster": "Robinhood Chain Playbook and Hyperliquid Stablecoin Ratings", "category": ["crypto", "tech"], "items": [{"author": "Fiskantes", "summary": "Lays out a five-step read on Robinhood's chain: (1) simple EVM chain for easy contract deployment, (2) vamp the big narratives — RWA tokenization, perps, agentic finance, (3) attract crypto degens to expand TAM, (4) keep existing RH users off-chain so customer value doesn't leak, (5) strong PR and stunts aimed at crypto natives. Conclusion: Vlad isn't here to save the trenches, he's driving value to HOOD shareholders — and is very good at it.", "tweet_url": "https://x.com/Fiskantes/status/2106606182068883480", "images": [], "type": "thread"}, {"author": "stacy_muur", "summary": "Questions why Hyperliquid's rating rated global stablecoins 5/5 for trading, liquidity and DeFi access but only 3/5 for everyday payments; argues stablecoin-linked Visa/Mastercard cards make daily spending easy even at small shops.", "tweet_url": "https://x.com/stacy_muur/status/2106419762901463459", "images": ["https://pbs.twimg.com/media/HTuBnKIbUAAvsXr.png"], "type": "tweet"}]}, {"cluster": "Crypto Cards and Neobanks — Spending Up 10% MoM", "category": ["crypto"], "items": [{"author": "Zeneca", "summary": "Crypto card spending rose ~10% from August to September; biggest winners EtherFi, Wirex, KAST, Karta and Plasma. Expects the trend to continue and is bullish neobanks; in replies says net cashback of 1-6% is typical with the right card(s). Related replies: EtherFi has among the best cashback; a card brand is reportedly shutting down; his CryptoCardFinder tests real FX and fees.", "tweet_url": "https://x.com/Zeneca/status/2106523522747211983", "images": [" gh better coordination; frontier labs have an incentive for their native harness to use more tokens, not fewer.", "tweet_url": "https://x.com/garrytan/status/2106508407645811070", "images": [], "type": "tweet"}, {"author": "udiWertheimer", "summary": "Likes Claude Desktop's new projects beta, but local sessions' permission prompts don't surface to project threads, so they can't be approved remotely — he must walk to the machine to unstick them.", "tweet_url": "https://x.com/udiWertheimer/status/2106573495622647936", "images": [], "type": "tweet"}]}], "B_insights": [{"author": "VitalikButerin", "summary": "Self-experiment in private AI use: a local model (Qwen 3.8 Flash Next) orchestrates and calls powerful remote models as tools to get personalized diet/exercise advice from his health and travel data without leaking identity. Three privacy layers: local model writes the queries (no PII or writing-style leak), zkAPI for payments, Tor for network. Works, and frontier input improved results. Deficiencies: Tor isn't built for per-request de-linking and adds 10-100x latency; skill-file strategies are far from optimal; the local model runs 20-30 TPS but needs 100+; and more privacy means less helpful answers. Code is in an ethereum/zkapi PR.", "tweet_url": "https://x.com/VitalikButerin/status/2106537633056969024", "images": ["https://pbs.twimg.com/media/HTvsz8DbcAAfb9X.png", "https://pbs.twimg.com/media/HTvsz8JacAA_fjp.png"], "type": "thread"}, {"author": "cryptopunk7213", "summary": "Responding to a 'nobody really uses AI' thesis: ~98% non-use is about not knowing how or why, not unwillingness. Winning AI products aren't models but things that use models to help people with minimal friction — which he says is why Muse is a hit.", "tweet_url": "https://x.com/cryptopunk7213/status/2106591182222430711", "images": ["https://pbs.twimg.com/media/HTwdg-CWYAAy1m6.jpg"], "type": "tweet"}, {"author": "DCinvestor", "summary": "Argues religious systems will gain credibility in an AI // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
