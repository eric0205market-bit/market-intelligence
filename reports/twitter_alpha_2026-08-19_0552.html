<!DOCTYPE html>
<html lang="en">
<head>

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-08-19T05:21:01Z", "input_stats": {"total_tweets": 199, "unique_authors": 69, "tweets_with_images": 47, "after_noise_filter": 62}, "summary": "**AI safety pause:** OpenAI (@sama) paused some frontier RL training runs citing alignment/security standards not keeping pace with capability growth. @EMostaque publicly commended the move as evidence \"strange and perhaps dangerous things are happening.\" @udiWertheimer mocked the framing as generic hedge-language (\"the fifth time we have paused development\").\n\n**Anthropic/Claude sentiment souring:** @RaoulGMI says he gave up on Opus 5 and reverted to 4.8; in a reply he says Opus's issues plus Fable's costs are pushing \"the biggest Claude lovers\" to other providers with no acknowledgement from Anthropic. @udiWertheimer posted detailed product feedback comparing Claude Code unfavorably to Codex (confusing chat/cowork/dispatch/code split, no remote GUI, cluttered UI). @stevehou and @mrjasonchoi separately report Claude getting worse/pedantic and safety-flagging normal conversations.\n\n**Humanoid robotics IPO frenzy:** Unitree (688836) went public in China at ~$53.3B valuation, +492% on debut (@aleabitoreddit), and is trading 472% above IPO on Hyperliquid perps per @Bluntz_Capital, who also flags Agility ($CCXI, ~$2.5B premoney Q4) and $BOT as beneficiaries of the same scarcity dynamic.\n\n**Crypto regulation tailwind:** The SEC's new \"Regulation Crypto Assets\" proposal drew bullish reaction across the board — @brian_armstrong (Coinbase), @jchervinsky, @sjdedic and @Matt_Hougan all frame it as a long-awaited step toward token-sale exemptions and an \"Innovation Exemption\" for tokenized equities.\n\n**AI capex/bubble debate:** Via @patrick_oshag's interview clips, Ben Thompson argues the industry is burning through free cash flow, debt, and now equity to fund AI buildout with a multi-year lag before revenue catches up (railroad-1870s analogy), while comparing Google's AI bet to Berkshire's BNSF railroad purchase funded by See's Candies cash flow. @pboockvar separately amplifies the view that AI can be transformative **and** a capital-destroying bubble simultaneously — not a contradiction.\n\n**Markets/macro:** Meta sold off 4.4% (vs Nasdaq -4.4% vs -1.3%) on teen-safety/social-media litigation risk that @munster_gene says is \"the tip of the iceberg\" over the next year; @jimcramer flags a strong-district legal risk for Meta and notes \"big semis never rallied.\" @dgt10011 flags an odd credit-spread/rate divergence (tights in credit, blowout in long rates) as a sign something may be mispriced. AI-datacenter political backlash is building in swing states — Josh Shapiro's PA executive order and Geiger Capital's warning that Big Tech risks ceding 2028 AI policy to the left if it doesn't court the political center.\n\n**Contrarian:** @goodalexander's sprawling bear thesis ties together AI-capex skepticism, GDP overestimation, and a CBDC/tokenization endgame for stablecoins — arguing crypto's real bull case is structural, not sentiment-driven.", "sections": {"A_events": [{"cluster": "OpenAI Pauses Frontier RL Training", "category": ["AI", "regulation"], "items": [{"author": "sama", "summary": "Sam Altman announced OpenAI paused some frontier RL training to ensure alignment, security, and monitoring standards keep pace with rapidly advancing model capabilities. Says the field will need shared safety standards but OpenAI will act unilaterally in the meantime; near-term model releases unaffected, only \"further-out\" ones.", "tweet_url": "https://x.com/sama/status/2089787807611195475", "images": [], "type": "thread"}, {"author": "EMostaque", "summary": "Publicly commends Altman/OpenAI for taking the pause \"at face value,\" saying it's clear strange and possibly dangerous things are happening that current systems aren't ready for, and that sub-frontier models are already capable enough to change lives.", "tweet_url": "https://x.com/EMostaque/status/2089807825883009428", "images": [], "type": "tweet"}, {"author": "udiWertheimer", "summary": "Satirizes the announcement's language as generic bureaucratic hedging by rewriting it as a student excusing unfinished homework, then notes dryly that this is the fifth such 'pause' announcement from the labs.", "tweet_url": "https://x.com/udiWertheimer/status/2089853459818500375", "images": [], "type": "thread"}]}, {"cluster": "Anthropic/Claude Product Sentiment Turns Negative", "category": ["AI", "tech"], "items": [{"author": "RaoulGMI", "summary": "Says he gave up on Opus 5 and reverted to Claude 4.8, calling it solid.", "tweet_url": "https://x.com/RaoulGMI/status/2089751018200355202", "images": [], "type": "tweet"}, {"author": "RaoulGMI", "summary": "In a follow-up reply, argues Opus's issues plus Fable's cost are pushing the most committed Claude users toward other providers, and that Anthropic has offered no acknowledgement despite the sentiment being widespread across the AI-focused timeline.", "tweet_url": "https://x.com/RaoulGMI/status/2089938959011119371", "images": [], "type": "tweet"}, {"author": "udiWertheimer", "summary": "Detailed product critique of the Claude Code app vs. OpenAI's Codex app: says the chat/cowork/dispatch/code split is confusing and should be unified; wants tasks/sessions to communicate across those barriers; wants the ability to start fresh cloud sessions remotely (not just reconnect); wants a remote GUI into the VM for cloud mode so users can watch Claude work and log into websites; and criticizes the UI as \"tacky\" compared to Codex, which competitors have converged on.", "tweet_url": "https://x.com/udiWertheimer/status/2089861456389099671", "images": [], "type": "tweet"}, {"author": "stevehou", "summary": "Agrees with a quoted complaint that the \"honeymoon with Claude is over\" — calls it pedantic and condescending lately, says he's switched to Grok.", "tweet_url": "https://x.com/stevehou/status/2089930436654911874", "images": [], "type": "tweet"}, {"author": "mrjasonchoi", "summary": "Says Claude forgets project instructions/skills mid-conversation despite being configured at every level, and sometimes flags conversations for safety without cause.", "tweet_url": "https://x.com/mrjasonchoi/status/2089925138125107468", "images": [], "type": "tweet"}, {"author": "cryptopunk7213", "summary": "Reports a successor model (\"Fable 5.1\") is already being tested for select accounts, likely alongside a new OpenAI model (\"Astra\"), and says the shipping pace of the two labs suggests they're nearing recursive self-improvement (RSI).", "tweet_url": "https://x.com/cryptopunk7213/status/2089750383778304405", "images": [], "type": "tweet"}]}, {"cluster": "Unitree IPO — Humanoid Robotics Public-Market Frenzy", "category": ["tech", "positioning"], "items": [{"author": "aleabitoreddit", "summary": "Unitree (688836) is now public on a Chinese exchange, valued at ~$53.3B after rising +492%, giving the market its first major public benchmark for humanoid-robot valuations. Compares to Agility (backed by Nvidia/Amazon, going public via $CCXI at ~$2.5B premoney in Q4) and notes Tesla's Optimus is buried inside a $1T+ company, arguing pure-play humanoid demand in public markets is larger than expected.", "tweet_url": "https://x.com/aleabitoreddit/status/2089908198694351064", "images": ["https://pbs.twimg.com/media/HQDYbZWbQAAYiNj.jpg"], "type": "tweet"}, {"author": "Bluntz_Capital", "summary": "Notes Unitree is trading 472% above its IPO price on Hyperliquid, was 5,526x oversubscribed, with $BOT at 2.8x NAV and $CCXI at 65% to trust — three independent gauges pointing to demand far outstripping supply for robotics exposure, since names like Figure, Apptronik and 1X remain private.", "tweet_url": "https://x.com/Bluntz_Capital/status/2089897268828885027", "images": ["https://pbs.twimg.com/media/HQDOVw3b0AAD9_d.jpg"], "type": "tweet"}, {"author": "Bluntz_Capital", "summary": "Follow-up: says $BOT and $CCXI are going to \"full send\" on the same dynamic.", "tweet_url": "https://x.com/Bluntz_Capital/status/2089902115514945909", "images": [], "type": "tweet"}]}, {"cluster": "SEC's \"Regulation Crypto Assets\" Proposal", "category": ["crypto", "regulation"], "items": [{"author": "brian_armstrong", "summary": "Credits SEC Chair Atkins and the SEC for a long-awaited step on token taxonomy via \"Reg Crypto,\" and calls for the SEC to next release the Innovation Exemption to unlock onchain trading of tokenized equities, urging speed before other jurisdictions get there first.", "tweet_url": "https://x.com/brian_armstrong/status/2089821009264390490", "images": [], "type": "tweet"}, {"author": "Matt_Hougan", "summary": "Says the sound you hear is crypto entrepreneurs waking from hibernation, hoping this is just the start of the regulatory thaw.", "tweet_url": "https://x.com/Matt_Hougan/status/2089890831154938305", "images": [], "type": "tweet"}, {"author": "jchervinsky", "summary": "Calls Reg Crypto a critical step toward clarity, noting it creates exemptions for public token sales and a safe harbor from \"investment contract\" classification.", "tweet_url": "https://x.com/jchervinsky/status/2089789227831570760", "images": [], "type": "tweet"}, {"author": "sjdedic", "summary": "Notes that regulatory clarity arrived via the SEC even as the CLARITY Act itself stalled in Congress; calls the release open-minded and positive for the industry, predicting a \"token bull market\" ahead.", "tweet_url": "https://x.com/sjdedic/status/2089810707235713264", "images": [], "type": "tweet"}]}, {"cluster": "AI Capex/Bubble Debate — Ben Thompson via Patrick O'Shaughnessy", "category": ["AI", "macro"], "items": [{"author": "patrick_oshag", "summary": "Shares Ben Thompson's warning about a capital/compute timing mismatch: AI infrastructure spend has moved from free cash flow to debt to now equity issuance (Nvidia's ~$500B vehicle tapping pensions/insurers) in barely a year. Thompson compares it to 1870s railroad financing — long build times funded by short-term capital — and warns that if revenue doesn't catch up soon, \"we could have a big blowup.\" Also notes today's underinvestment (2023-24) means compute shortfalls persist into 2029.", "tweet_url": "https://x.com/patrick_oshag/status/2089800728571215888", "images": [], "type": "tweet"}, {"author": "patrick_oshag", "summary": "Second Thompson clip compares Google to Berkshire Hathaway: Google Search is \"See's Candies\" (high-margin, capped absolute profit), and its AI bet is the equivalent of Berkshire's BNSF railroad purchase — lower margins but a vastly larger addressable profit pool if AI captures white-collar work. Concludes Berkshire isn't just an investor in Google but a model for where Google is headed.", "tweet_url": "https://x.com/patrick_oshag/status/2089848013992656971", "images": [], "type": "tweet"}, {"author": "pboockvar", "summary": "Amplifies a related point that lower rates can't repair bad capital allocation — the Fed can cut financing costs but can't retroactively make an unnecessary data center necessary.", "tweet_url": "https://x.com/pboockvar/status/2089804764359852058", "images": [], "type": "tweet"}, {"author": "pboockvar", "summary": "Separately amplifies the view that AI can be as transformative as its biggest proponents believe while simultaneously being an investment bubble — the two aren't contradictory, citing historical precedent of revolutionary tech attracting overcapitalized infrastructure buildouts.", "tweet_url": "https://x.com/pboockvar/status/2089877846269305066", "images": [], "type": "tweet"}]}, {"cluster": "Meta Selloff — Teen Safety & Legal Risk", "category": ["tech", "regulation"], "items": [{"author": "munster_gene", "summary": "Flags Meta down 4.4% vs. the Nasdaq's 1.3% on state-level teen-safety and social-media-addiction actions, arguing what's visible today is \"the tip of the iceberg\" of regulatory pressure coming over the next year.", "tweet_url": "https://x.com/munster_gene/status/2089826327490703572", "images": [], "type": "tweet"}, {"author": "jimcramer", "summary": "Says the Meta trial is being heard in the worst possible district for corporate defendants, explaining the stock hit, but thinks the case may not survive Supreme Court review despite being strong enough to proceed. Also separately notes \"big semis never rallied\" during the session.", "tweet_url": "https://x.com/jimcramer/status/2089827539757760919", "images": [], "type": "tweet"}]}, {"cluster": "AI Data Center Political Backlash Building", "category": ["geopolitics", "regulation", "AI"], "items": [{"author": "Geiger_Capital", "summary": "Notes Josh Shapiro — a moderate Democrat in a true swing state — signing a strict AI-datacenter executive order, and warns Big Tech that if it doesn't rethink its strategy toward the American middle/right, it risks having Bernie Sanders/AOC-style politicians run 2028 AI policy instead.", "tweet_url": "https://x.com/Geiger_Capital/status/2089813749624701136", "images": ["https://pbs.twimg.com/media/HQCCh1vXMAAXEVv.jpg"], "type": "tweet"}, {"author": "nic_carter", "summary": "Pushes back on datacenter opposition, responding to Shapiro's executive order and broader anti-datacenter sentiment: argues water/pollution objections are largely unfounded and that grid strain is solvable, though job-displacement fears are legitimate; predicts new datacenters will increasingly become a red-state phenomenon as blue-state governors cave to what he calls the \"degrowth\" coalition.", "tweet_url": "https://x.com/nic_carter/status/2089816449246240859", "images": [], "type": "thread"}]}, {"cluster": "Florida Special Elections — DSA Momentum", "category": ["geopolitics"], "items": [{"author": "Geiger_Capital", "summary": "Reports DSA-backed candidate Angie Nixon upset establishment Democrat (and anti-Trump figure) Alexander Vindman in a Florida primary, raising only ~$800k against ~$20M in party backing — calling it evidence the DSA is \"eating\" the Democratic Party.", "tweet_url": "https://x.com/Geiger_Capital/status/2089871072803831828", "images": ["https://pbs.twimg.com/media/HQC2qk_W8AAfSD2.jpg"], "type": "tweet"}, {"author": "Geiger_Capital", "summary": "Notes all Florida primaries were called with ~95% of votes counted within two hours, contrasting it with deep-blue states that take weeks to report results.", "tweet_url": "https://x.com/Geiger_Capital/status/2089887197616824612", "images": [], "type": "tweet"}]}, {"cluster": "Etched Raises $700M at $21B Valuation", "category": ["AI", "tech"], "items": [{"author": "cryptopunk7213", "summary": "Highlights Etched's raise ($700M at $21B from Jane Street, Kleiner Perkins, Sequoia, a16z, Thiel, BCV, Blackstone) and first rack shipment to Jane Street, calling it one of the fastest chip-startup scaling stories ever (founded by three Harvard dropouts). Argues every major AI lab, including OpenAI and Anthropic, is now building custom inference silicon.", "tweet_url": "https://x.com/cryptopunk7213/status/2089935086779048415", "images": [], "type": "tweet"}, {"author": "novogratz", "summary": "Says he's \"in awe\" of Etched's growth/execution speed, glad Galaxy is an investor.", "tweet_url": "https://x.com/novogratz/status/2089759183344422931", "images": [], "type": "tweet"}]}], "B_insights": [{"author": "goodalexander", "summary": "Sprawling bear thesis tying together AI-capex skepticism, GDP overestimation, and crypto's structural bull case. Argues societal-scale AI investment demands societal-scale returns that aren't showing up (worse airline ops, buggy apps despite maxed-out AI spend); expects GDP growth near 2% vs. consensus 4.4%, with much of labs' ARR churning to cheaper models over time. Predicts AI labs will pivot to unfalsifiable \"biological advancement\" bull cases once productivity gains fail to materialize, alongside a coming surge in the American left as inflation, Trump's broken war promises, and AI- ha/status/2089835954349727768", "images": [], "type": "tweet"}, {"author": "AnjneyMidha", "summary": "Argues the industry has entered an era of \"deployment alignment\" — the real hard problem isn't reasoning about alignment in the abstract, it's correctly configuring millions of task types, environments, and virtual machines at scale, and there's no longer time for toy-model alignment research.", "tweet_url": "https://x.com/AnjneyMidha/status/2089910735233257733", "images": [], "type": "tweet"}, {"author": "hasufl", "summary": "Structural critique of Ethereum's proof-of-stake governance: unlike PoW, where miners and token holders/users are largely separate constituencies that can be overruled, PoS stakers are the same people who own and use the chain, giving them an effective soft veto over protocol changes. Argues this makes Ethereum far harder to meaningfully change post-launch than most realize, and that this lesson hasn't been internalized yet.", "tweet_url": "https://x.com/hasufl/status/2089775935797039447", "images": [], "type": "thread"}, {"author": "nic_carter", "summary": "Argues California and New York have effectively industrialized welfare through Medicaid-funded home-care programs (CA's IHSS, NY's CDPAP) that pay people to care for relatives — $34B/yr for 875k recipients in CA, $11B/yr for 260k in NY (up 500% since 2017) — largely federally reimbursed. Calls it a disguised cash-for-votes scheme that, alongside interest and entitlements, will eventually strain state and federal finances broadly, not just blue states.", "tweet_url": "https://x.com/nic_carter/status/2089930914885456180", "images": [], "type": "thread"}, {"author": "aleabitoreddit", "summary": "Notes from the Rosenblatt optics/photonics summit on $AAOI: expects premium ASPs for US-based 800G/1.6T production, has multiple LTAs it's declining to sign to avoid getting capacity locked by single customers (implicitly Nvidia), is sold out through H2 next year and beyond with demand visibility co // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
