<script>
const ITEMS = [{"id": 1, "cat": "venture", "urgency": "deep", "source": "a16z Frontier / Substack Notes", "title": "Prediction markets did $123.6B notional in October, 1.5x all of 2024 and 2025 combined", "idea": "Per a16z Frontier, October 2026 notional volume hit $123.6B (+58% m/m) against $82B for 2024 and 2025 combined. Cash actually paid in was $22.7B, more than all of 2025 ($20.9B). Trades 644M (+36%), fees $647M (+27%), open interest $3.1B (+42%). Almost every metric set an all-time high for the second month running.", "angle": "Fees of $647M a month annualize to roughly $7.8B, which is exchange-sized revenue. The same morning Polymarket confirmed layoffs, so the category is booming while share is consolidating toward Kalshi.", "tweetA": "$647M in fees in one month. Annualized that's ~$7.8B, which puts prediction markets in the same revenue conversation as a mid-cap exchange. $CME $ICE $HOOD should be treating this as a competitor now.", "tweetB": "$123.6B traded on $3.1B of open interest is about 40x monthly turnover. That's a trading product, not a forecasting tool. And this lands the same week Polymarket confirmed cuts. Volume is booming, so who is losing share?", "charts": {"count": 0, "hot": false, "desc": "No chart in note; a16z Frontier usually publishes the monthly dashboard"}, "link": "https://substack.com/@a16zfrontier/note/c-383208197"}, {"id": 2, "cat": "culture", "urgency": "watch", "source": "Stacy Muur / Substack Notes", "title": "Edelman: 95% of hidden B2B buyers are more open to outreach after strong thought leadership", "idea": "An Edelman survey of 1,934 LinkedIn managers: 95% of hidden buyers say strong thought leadership makes them more receptive, 73% judge a company's calibre by it, and 64% trust it more than product sheets when judging vendor capability.", "angle": "Distribution through founder persona is replacing the sales deck. It fits the Founders Corner point that brand and trust are among the few moats AI can't copy.", "tweetA": "64% of B2B buyers trust a founder's posts more than the product sheet. The marketing budget is moving from ads to a person, and that's why every CEO suddenly has a newsletter.", "tweetB": "If AI makes the product easy to copy, buyers end up judging the thinking instead of the features. Thought leadership is turning into a moat, and it's priced like a vanity project.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://substack.com/@stacymuur/note/c-379311979"}, {"id": 3, "cat": "energy", "urgency": "deep", "source": "MacroEdge Oil & Gas Research / Strategy Note 11/11", "title": "Oil failed at $98-108; near-term neutral, but 'no growth scare, no demand issue, and certainly no peace'", "idea": "MacroEdge says crude couldn't clear the $98-108/bbl band, so the near term is neutral even though fundamentals stay robust. The left-tail risk is an MOU/'TACO' deal announcement that they think is timed to the upcoming mega-IPOs (Anthropic next week) more than to diplomacy. Iran hasn't moved on its 7-point plan, so any talks should be short-lived.", "angle": "Oil is at $86 today per Morning Minute, so the market is already pricing a deal. If the MOU is IPO theatre, the downside is a headline flush, not a regime change.", "tweetA": "The theory that an Iran MOU will be timed to the Anthropic IPO is cynical and probably right. Oil at $86 is already pricing peace while Iran hasn't moved an inch on its 7 points. I'd fade the headline. $XLE $USO", "tweetB": "No growth scare, no demand problem, no peace, and oil still can't hold $98. When good fundamentals can't lift price, positioning is the story. Watch whether the deal headline is the last flush.", "charts": {"count": 2, "hot": false, "desc": "Yields vs oil correlation chart; 'spring, meet board' WTI curve chart"}, "link": "https://macroedgeenergy.substack.com/p/macroedge-oil-and-gas-research-strategy-da6"}, {"id": 4, "cat": "macro", "urgency": "watch", "source": "MacroEdge Oil & Gas Research / Strategy Note 11/11", "title": "A 50bp Fed HIKE in December is underpriced: 15% odds vs MacroEdge's 25-35%", "idea": "MacroEdge thinks a 50bp hike in December should be priced at 25-35%, not 15%. They argue a hawkish turn wouldn't end the energy cycle, which is moving into a 'revenge of the old world economy' theme for 2027. They also say the yields-oil correlation is much weaker than talking heads claim.", "angle": "A hiking Fed alongside strong energy is the 1970s template. Energy equities have historically held up through hiking cycles that come with supply-driven inflation.", "tweetA": "The market prices a 15% chance the Fed HIKES 50bp in December. Not cuts. Hikes. If you have to argue over the size of the hike, the 'AI disinflation' story already lost.", "tweetB": "'Revenge of the old world economy' is going to be the 2027 trade. Hard assets, producers, refiners. The Fed hiking into an energy shock is how that theme gets its multiple. $XOM $COP", "charts": {"count": 1, "hot": false, "desc": "Small-sample hike-cycle performance table, used as a warning about overfitting"}, "link": "https://macroedgeenergy.substack.com/p/macroedge-oil-and-gas-research-strategy-da6"}, {"id": 5, "cat": "energy", "urgency": "deep", "source": "MacroEdge Oil & Gas Research / Strategy Note 11/11", "title": "SPR releases are 'subsidizing demand' with demand at or near all-time highs, a long-run policy failure", "idea": "MacroEdge argues the endgame of current SPR policy is obvious: draining reserves to subsidize consumption while demand is at or near record highs fails over the long run. Thanksgiving travel will be the next barometer of consumer demand.", "angle": "Every barrel released now has to be bought back later, which puts a floor under deferred WTI. That fits their 'springboards across the WTI curve' view.", "tweetA": "Releasing the SPR while demand is at record highs isn't supply policy. It's a consumer subsidy you pay back with interest later. The refill bid is a floor under the back of the curve.", "tweetB": "Thanksgiving gasoline demand is the cleanest read on whether the 'growth scare' exists. If miles driven hold up while the SPR drains, the reserve is buying votes, not stability.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://macroedgeenergy.substack.com/p/macroedge-oil-and-gas-research-strategy-da6"}, {"id": 6, "cat": "geopolitics", "urgency": "watch", "source": "MacroEdge Oil & Gas Research / Strategy Note 11/11", "title": "Middle East calm is the US 'pausing to reload' while it enforces the blockade", "idea": "MacroEdge reads the current quiet as tactical: the US has paused to reload while it keeps the blockade on Iran. Iran hasn't budged on the 7-point peace plan it has demanded for months, which sets up another round of war-driven price volatility after any short-lived talks.", "angle": "Vol sellers in crude are collecting premium on a ceasefire that both sides treat as a reload window. Cheap upside optionality makes sense here.", "tweetA": "'Calm' in the Gulf right now means one side is restocking munitions and the other hasn't changed its demands. That isn't de-escalation. It's an intermission. Crude vol is too cheap for an intermission.", "tweetB": "A blockade still being enforced and talks with no movement means the base case is renewed volatility, not peace. Crude calls are cheap insurance against a market pricing the reverse.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://macroedgeenergy.substack.com/p/macroedge-oil-and-gas-research-strategy-da6"}, {"id": 7, "cat": "culture", "urgency": "watch", "source": "MacroEdge Oil & Gas Research / Strategy Note 11/11", "title": "'Texodus': a Texas energy research shop moves to Arizona as Sun Belt advantages fade", "idea": "MacroEdge is moving its operating hub to Arizona and suspects it's 'the start of a reversal trend' away from places people flocked to that now offer little advantage over other states, which they partly blame on the inflationary regime since 2021.", "angle": "If the post-2020 Sun Belt migration is reversing at the margin, it hits Texas/Florida housing, insurance and municipal growth assumptions.", "tweetA": "When an oil research firm leaves Texas, notice it. The Sun Belt trade was built on cheap housing and low taxes. Inflation since 2021 ate the first one.", "tweetB": "The migration arbitrage of 2020-22 is closing. Insurance, property taxes and home prices caught up. Watch net domestic migration data for Austin and Tampa in 2027. $DHI $LEN", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://macroedgeenergy.substack.com/p/macroedge-oil-and-gas-research-strategy-da6"}, {"id": 8, "cat": "energy", "urgency": "watch", "source": "MacroEdge Oil & Gas Research / Strategy Note 11/11", "title": "Hedge funds are short natgas at a key level, and MacroEdge sees 'substantially asymmetric' opportunities", "idea": "The note flags crowded hedge fund shorts in natural gas with price sitting at a key level, and points to asymmetric long setups that complement their existing book. High-quality producers keep leading.", "angle": "Crowded shorts going into winter, plus LNG export demand and data-center gas burn, make the setup asymmetric.", "tweetA": "Hedge funds short natgas in November with data centers signing gas-fired PPAs every week. That's a crowded trade against the weather and the AI buildout at the same time. $EQT $AR", "tweetB": "Same pattern as silver this week: positioning stretched to an extreme and price at a key level. Short squeezes in commodities don't need good news, just a cold week.", "charts": {"count": 1, "hot": false, "desc": "CFTC natgas positioning chart, behind paywall"}, "link": "https://macroedgeenergy.substack.com/p/macroedge-oil-and-gas-research-strategy-da6"}, {"id": 9, "cat": "AI/infra", "urgency": "watch", "source": "BowTiedBull / Feels a Lot Like 2016", "title": "Cockroach theory: the wave of negative AI news is the semi/AI cycle ending, 'right on schedule'", "idea": "BowTiedBull says this week's run of bad AI news fits the cycle-top outline they gave at the end of June: when the semi/AI cycle closes, 'all the cockroaches come out at the same time.' They dismiss the personal scandal itself and say the only real risk is the Chinese spy angle, i.e. whether confidential information was leaked.", "angle": "A contrarian take on the NVDA dip-buying consensus, and it matters that it comes from a long-time bull voice.", "tweetA": "Cockroach theory on AI: a CEO scandal, a credit spread blowout and a capex financing scare all in the same month. When the bad news clusters, it's usually the cycle talking, not bad luck.", "tweetB": "The 2016 comparison is interesting. That year had a scare that turned into the start of the next leg. The difference now is that the bull case runs on credit. Watch spreads, not headlines.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bowtiedbull.io/p/feels-a-lot-like-2016-nvda-and-ai"}, {"id": 10, "cat": "geopolitics", "urgency": "act", "source": "Campbell Ramble / He's Out? I'm Out!", "title": "Stopped out of long TWD/INR: the Jensen scandal 'begs the Taiwan question'", "idea": "Campbell exits a long Taiwan dollar vs Indian rupee trade. The Jensen scandal exposes 'the convenient fiction that we can ask Taiwan to continue to play both sides.' The most critical node in the global supply chain sits just outside China, on an island Beijing claims. NVDA was down another 8%+ overnight.", "angle": "A macro FX trader turning bearish on TWD is a second-order read on the NVDA story: the risk premium spreads to the whole Taiwan complex, not just one stock.", "tweetA": "The NVDA scandal isn't really about Jensen. It's about whether Taiwan can keep playing both sides. Once the market starts pricing that question, TWD and $TSM carry a premium that doesn't go away with a new CEO.", "tweetB": "Smart FX money just stopped out of long TWD. If you're long $TSM and $EWT, ask what your hedge is when the market decides Taiwan's 'silicon shield' cuts both ways.", "charts": {"count": 3, "hot": false, "desc": "Claude, GPT and Grok ratings of potential Nvidia CEOs; board composition chart"}, "link": "https://www.campbellramble.ai/p/hes-out-im-out"}, {"id": 11, "cat": "credit", "urgency": "deep", "source": "Campbell Ramble / He's Out? I'm Out!", "title": "'The Jensen Put': NVDA was the credit intermediary behind the AI capex build", "idea": "Campbell argues the mega rally ran on two pipes, credit and supply, and both just took a hit. Jensen was 'single-handedly pushing the ball down the field', with NVDA's real or implied backstop enabling capex that would otherwise need bigger balance sheets or tighter financing. His takeaway: fewer chips plus tighter credit means compute prices have to rise.", "angle": "Boockvar puts NVDA's equity investments at $99B, before vendor financing and lease guarantees. If the backstop wavers, neoclouds' cost of capital reprices.", "tweetA": "Everyone's pricing the Jensen scandal as a CEO risk. The real risk is the 'Jensen Put': NVDA's balance sheet underwriting neocloud capex. Remove the founder and the board gets a lot more conservative with $99B of investments. $CRWV $NBIS", "tweetB": "Fewer chips and tighter credit, with the same demand, means the price of compute goes UP. The scandal could be bullish for anyone already holding GPUs under contract.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.campbellramble.ai/p/hes-out-im-out"}, {"id": 12, "cat": "geopolitics", "urgency": "watch", "source": "Campbell Ramble / He's Out? I'm Out!", "title": "INR leg still fine vs KRW, but India's capital account and reserve policy are getting 'shenanigans'", "idea": "In the appendix Campbell notes the Indian rupee leg still looks fine against the Korean won, but flags ongoing capital-account and reserve-policy 'shenanigans' that deserve their own piece.", "angle": "INR/KRW is a clean way to express India's domestic-demand story against Korea's semiconductor-cycle exposure.", "tweetA": "If you're bearish on the Asian chip cycle but bullish on India's domestic economy, long INR vs KRW is the cleanest expression. Just watch the RBI's reserve management.", "tweetB": "Korea's won is basically a memory-chip proxy. With Micron up 12% in a day, shorting KRW against anything is a bet that the memory upcycle ends soon. Brave.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.campbellramble.ai/p/hes-out-im-out"}, {"id": 13, "cat": "geopolitics", "urgency": "deep", "source": "Marvin Liao (Hard Fork) / Venkatesh Rao on thick sovereignty", "title": "'Thick sovereignty on a thin cosmopolitan floor': Rao's frame for post-globalization", "idea": "Venkatesh Rao argues the world isn't moving from globalism to autarky. It's moving to 'thick sovereignty' (states underwriting fabs, grids, ports, cyber defense, minerals and payments as strategic coordination assets) sitting on a 'thin cosmopolitan floor' of shipping, reserve currencies, internet protocols and commodity markets. Globalization looks alive and diminished at once: the floor stays intact, but the speculative premium for extending it has gone.", "angle": "This is the framework behind defense, grid, critical minerals and domestic fab spending. The 'floor' assets (shipping, payment rails, exchanges) get re-rated as utilities.", "tweetA": "Rao's frame explains why both 'deglobalization' and 'globalization is fine' feel true. The floor of shipping, dollars and protocols isn't going anywhere. Everything above it is now national security. Price the floor like a utility and the top layer like defense.", "tweetB": "If fabs, grids and minerals are 'strategic coordination assets,' their cost of capital is set by governments, not markets. That's why ROIC screens keep missing $MP, $CEG and $LMT.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/the-case-for-reindustrialization"}, {"id": 14, "cat": "macro", "urgency": "deep", "source": "Marvin Liao (Hard Fork) / Venkatesh Rao on thick sovereignty", "title": "Leverage cycle vs deleveraging: 'both are right, both are wrong, they're asking the wrong question'", "idea": "Rao: one camp sees leverage (AI capex, fiscal deficits, buoyant equities), the other sees deleveraging (CRE, slowing globalization, higher rates, aging, cautious consumers). Both are describing a shift toward national capitalism, where the state re-levers strategic sectors while private balance sheets in the old model shrink.", "angle": "This is a K-shaped balance sheet: public and AI leverage going up, CRE and consumer leverage going down. It explains why credit spreads and equity vol are diverging (BofA, same morning).", "tweetA": "The economy is levering and deleveraging at the same time, just in different places. AI and the state are levering up. CRE and households are deleveraging. Your macro model needs two balance sheets, not one.", "tweetB": "Everyone's arguing 'boom or bust.' Rao's answer is that capital is migrating from private-efficiency assets to state-resilience assets. You don't trade that with the index, you trade it with the mix.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/the-case-for-reindustrialization"}, {"id": 15, "cat": "regulation", "urgency": "watch", "source": "Marvin Liao (Hard Fork) / Venkatesh Rao on thick sovereignty", "title": "Option-preserving investment: fabs and reserves optimize for Knightian uncertainty, not ROI", "idea": "Rao says strategic investments like resilience fabs, excess generation, redundant logistics and strategic reserves look bad on ROI but optimize a different objective: buying adaptability under Knightian uncertainty, where risks can't even be listed. Institutions aligned with these imperatives will get easier access to capital, talent and political support.", "angle": "Policy-favored sectors get a lower cost of capital, which works as a structural subsidy to equity holders.", "tweetA": "'Strategic reserves produce no quarterly earnings' is true, and it's exactly why governments now own the trade. When the state is the marginal buyer of resilience, the cost of capital in those sectors falls below what the market would charge.", "tweetB": "A fab built for resilience will never be the lowest-cost producer. That's fine if the buyer is a government. The investor question becomes who has the policy-backed offtake, not who has the lowest cost curve.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/the-case-for-reindustrialization"}, {"id": 16, "cat": "venture", "urgency": "deep", "source": "Chris Tottman / The Founders Corner", "title": "NFX: network-effect companies were 35% of $1B+ digital companies but 70% of the value", "idea": "In NFX's study of 336 digital companies founded 1994-2017 that reached $1B+, about 35% had network effects at their core but captured about 70% of total value, and a 2022 re-run confirmed it. Morningstar defines a narrow moat as ~10 years of advantage and a wide moat as 20+. Helmer: moat = benefit to you + barrier to them.", "angle": "The math: network-effect companies are worth about 4.3x the others on average (70/35 vs 30/65). AI weakens IP moats, so this premium should widen.", "tweetA": "Do the math on NFX's data: network-effect companies are 35% of unicorns and 70% of value, so they're worth ~4.3x the average non-network company. In an AI world where code is free, that multiple should go up.", "tweetB": "'We move fast' isn't a moat because money can buy speed. Money can't buy three years of your customers' data. That's why boring switching-cost software outlasts flashy AI wrappers.", "charts": {"count": 1, "hot": false, "desc": "Radar chart of seven defensibility dimensions"}, "link": "https://www.the-founders-corner.com/p/your-advantage-has-an-expiry-date"}, {"id": 17, "cat": "tech", "urgency": "deep", "source": "Chris Tottman / The Founders Corner", "title": "If AI makes code cheap to copy, switching costs, certifications and trust gain value", "idea": "Tottman's rebuttal to 'AI means anyone can copy anything': it weakens IP for almost everyone, which raises the relative value of switching costs, regulatory certifications, data rights and trust. 'A competitor can copy your product in a year. Your customers' last three years are much harder to copy.' He cites a16z's 'Empty Promise of Data Moats': most data network effects are weak scale effects.", "angle": "A framework for sorting SaaS in the AI-disruption selloff: workflow lock-in plus compliance (vertical SaaS) beats horizontal tools.", "tweetA": "The SaaS selloff treats every software company as equally disruptable by AI. It isn't. Anything with regulatory certs and three years of embedded workflow data gets MORE defensible as code gets cheaper. $VEEV $TYL", "tweetB": "Founders keep putting 'our data' first on the moat slide. a16z said in 2019 that most data moats are weak scale effects, and AI makes that worse. The underrated moat is 'it's a pain to leave.'", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/your-advantage-has-an-expiry-date"}, {"id": 18, "cat": "positioning", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom (Goldman silver)", "title": "Silver specs at the 2nd percentile after five weeks of selling, with $2.6B of fresh shorts", "idea": "Goldman's Robert Quinn: five straight weeks of speculative selling took net silver positioning to the 2nd percentile of its two-year range, with $2.6B of new shorts. Silver then bounced 6% on a post-election recovery in Chinese solar equities, downside options got cheaper, and the metal recovered fast from another hot US inflation print.", "angle": "Extreme positioning with price ignoring bad news is the classic squeeze setup. The Chinese solar link means silver is trading as an industrial metal right now.", "tweetA": "$2.6B of fresh silver shorts at the 2nd percentile of positioning, and the metal shrugged off a hot CPI. When bad news stops working, the shorts are the fuel. $SLV", "tweetB": "Silver's 6% rebound came from Chinese solar stocks, not from gold. That tells you who the marginal buyer is. Watch the polysilicon and module price chain, not the Fed. $SLV $SIL", "charts": {"count": 2, "hot": true, "desc": "CFTC net spec positioning at 2nd percentile vs price"}, "link": "https://thedarksideoftheboom.substack.com/p/silvers-short-fuse-goldmans-robert"}, {"id": 19, "cat": "AI/infra", "urgency": "act", "source": "Michael Parekh / AI Ramblings Daily #205", "title": "Nvidia board preparing to oust Jensen; CFO Colette Kress the leading interim pick", "idea": "Per WSJ/Semafor/Bloomberg as compiled by Parekh: the NVDA board met Wednesday, some directors favor CFO Colette Kress as interim CEO with a possible new COO, and an outside search firm is looking at permanent candidates (Apple's Johny Srouji among them, with AMD, Broadcom and Arm CEOs and even Tim Cook floated). A second relationship, with a direct report who is VP of health care, surfaced. The stock rose 3% Wednesday, then fell ~8% after hours to a 52-week low, and is down more than 11% over five days. Earnings are November 17.", "angle": "Jensen has 60 direct reports and no obvious number two. A CFO interim five days before earnings is about stability, not strategy. The risk is guidance tone without the founder on the call.", "tweetA": "Nvidia has 40,000 employees, 60 direct reports to the CEO, and no number two. That isn't a succession plan. It's a single point of failure the market valued at $4T+. Earnings on Nov 17 will be the first call in 33 years without Jensen selling the roadmap. $NVDA", "tweetB": "If Srouji gets the job, Apple loses the architect of Apple Silicon and Nvidia gets a supply-chain operator. The best NVDA trade might be the Apple silicon-roadmap discount. $AAPL $NVDA", "charts": {"count": 0, "hot": false, "desc": "Charts inside: NVDA price path through the scandal"}, "link": "https://michaelparekh.substack.com/p/upside-down-in-ai-nvidias-mega-blip"}, {"id": 20, "cat": "regulation", "urgency": "act", "source": "Michael Parekh / AI Ramblings Daily #205", "title": "Trump approved chip-diversion action three times this year and Commerce stalled each time (Axios)", "idea": "Axios: Treasury Secretary Bessent confronted Commerce Secretary Lutnick in the Situation Room over why Megaspeed wasn't on the Entity List (Commerce denies it). The President approved action on chip diversion three times and Commerce stalled each time. Commerce is now finalizing a rule blocking Chinese AI firms from remote access to advanced chips in seven more countries, including Singapore. Democrats get subpoena power in January, and Sen. Kevin Cramer (R) has called on Huang to resign.", "angle": "Export-control risk for NVDA is moving from a slow trickle to a regime change, with an incoming Democratic Congress investigating 'what Nvidia knew.'", "tweetA": "The administration approved chip-diversion curbs three times and Commerce sat on them. With subpoena power changing hands in January, that inaction becomes evidence. NVDA's China risk now depends on Congress, not the White House. $NVDA", "tweetB": "A remote-access rule covering seven more countries, including Singapore, closes the loophole Chinese labs used for two years. Look at Southeast Asian neoclouds: the rule is aimed at their customers.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/upside-down-in-ai-nvidias-mega-blip"}, {"id": 21, "cat": "geopolitics", "urgency": "act", "source": "Michael Parekh / AI Ramblings Daily #205", "title": "Chinese AI firms rushing to lock in offshore Nvidia capacity before remote-access curbs", "idea": "Reuters: a major Chinese cloud provider has discussed locking in overseas Nvidia capacity, smaller labs are approaching Southeast Asian providers, and grey-market buyers are stockpiling restricted chips. Parekh's 'Security Dilemma': close the remote-access door and China speeds up its own chips and open-weight models.", "angle": "A pull-forward of demand into SEA neoclouds before the rule lands, and then a cliff.", "tweetA": "Every export-control announcement creates a pre-ban buying spree. Chinese labs are locking in offshore GPU capacity right now, which makes Q4 SEA neocloud bookings a pull-forward, not a trend.", "tweetB": "Close the remote-access door and China doubles down on Huawei Ascend and open weights. Every US control so far has accelerated the substitute. $NVDA's China TAM was already zero. The new question is how fast DeepSeek-class models get cheaper.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/upside-down-in-ai-nvidias-mega-blip"}, {"id": 22, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily #205", "title": "Singapore was 22% of Nvidia revenue ($10.2B), then vanished from disclosures after the Megaspeed cutoff", "idea": "WSJ: Singapore made up 22% of Nvidia's revenue, $10.2B, in the quarter ended July 2025. Shortly after Nvidia cut off Megaspeed, Singapore disappeared from its geographic disclosures. It isn't clear the two are related. Alice Huang is reportedly in Beijing, and Taiwan's interior minister says she'll be barred from returning.", "angle": "If Singapore billing was largely trans-shipment, part of the historical revenue base was China demand in disguise. That bears on the earnings run-rate and the regulatory exposure.", "tweetA": "Singapore was 22% of NVDA revenue, $10.2B in a quarter, from a city-state of 6 million people. Then it disappeared from the filings. Investigators will ask the obvious question, and the answer matters for both the run-rate and the fines. $NVDA", "tweetB": "$10.2B a quarter of 'Singapore' revenue implies about $40B a year from a country with fewer data centers than Northern Virginia. Billing location isn't end demand, and Congress is about to make that distinction expensive.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/upside-down-in-ai-nvidias-mega-blip"}, {"id": 23, "cat": "geopolitics", "urgency": "watch", "source": "Michael Parekh / AI Ramblings Daily #205", "title": "Taiwan's 'Silicon Shield' gets a national-security question: Nvidia plans $150B a year of Taiwan spending", "idea": "WSJ: Huang, born in Taipei and raised in Tainan, was a national celebrity ('Jensanity'). Nvidia plans to spend $150B a year in Taiwan. His ties to a suspected Chinese spy aren't gossip on an island whose chip industry is its security guarantee. Trump and Xi meet again in Shenzhen in days.", "angle": "$150B a year of Taiwan spend is Nvidia's supply chain. Any political overreaction in Taipei or Washington reaches $TSM and the ODMs.", "tweetA": "Nvidia plans to spend $150B a year in Taiwan. That makes the scandal Taiwan's problem too, and Trump meets Xi in Shenzhen in a few days. Taiwan's leverage just got weaker at exactly the wrong moment. $TSM $EWT", "tweetB": "The 'Silicon Shield' theory assumed Taiwan's tech elite was firmly in the Western camp. One alleged spy next to the most important CEO in chips puts that assumption on trial in Taipei.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/upside-down-in-ai-nvidias-mega-blip"}, {"id": 24, "cat": "tech", "urgency": "watch", "source": "Michael Parekh / AI Ramblings Daily #205", "title": "United bans AI agents from booking flights; Uber saw ~500 agent orders out of 320M in a week", "idea": "United Airlines is blocking AI agents from completing bookings (agents can still show fares), citing user data exposure, unintended purchases and federal travel rules. It follows Amazon blocking agents like Meta's Muse. Scale check: during Halloween week Uber had 320M trips and orders, and AI agents made about 500 of them.", "angle": "Agentic commerce is roughly 1.6 orders per million. Incumbents are protecting the transaction leg (and the ancillary fees) before agents can commoditize them.", "tweetA": "500 out of 320 million. That's how many Uber orders AI agents placed in Halloween week: 0.00016%. Agentic commerce is mostly a slide-deck metric right now. $UBER", "tweetB": "United isn't blocking agents for safety. It's blocking them because agents compare fares across carriers and strip out the upsell. Airlines make their margin on ancillaries, and an agent that buys the base fare is an existential threat to $UAL's revenue per passenger.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/upside-down-in-ai-nvidias-mega-blip"}, {"id": 25, "cat": "AI/infra", "urgency": "watch", "source": "Michael Parekh / AI Ramblings Daily #205", "title": "Anthropic and OpenAI are both using AI to design their own AI chips", "idea": "Parekh's companion AI-RTZ #1268 covers Anthropic and OpenAI using AI to design custom AI chips, a 'frenemies' model with Nvidia that is unusually well timed given the turmoil. It won't replace Nvidia overnight but has interesting technical architectures at both. He says OpenAI and Anthropic are relatively insulated from Nvidia's turmoil.", "angle": "Custom silicon designed by the labs plus a leaderless Nvidia shifts bargaining power toward the custom-ASIC partners ($AVGO, $MRVL) and TSMC.", "tweetA": "The two biggest GPU customers are using their own models to design chips that replace GPUs, in the same month Nvidia lost its CEO. If I'm $AVGO, this is the best negotiating week in history.", "tweetB": "AI designing AI chips shortens the custom-silicon cycle from years to quarters. Nvidia's moat was CUDA plus the cadence. A headless Nvidia and AI-compressed ASIC cycles hit both at once.", "charts": {"count": 0, "hot": false, "desc": "Charts inside AI-RTZ #1268, worth opening"}, "link": "https://michaelparekh.substack.com"}, {"id": 26, "cat": "crypto", "urgency": "act", "source": "Axel Adler Jr / Bitcoin Market State Report", "title": "MSCI confirms Strategy removal after Nov 30; BTC trading below its annual median", "idea": "MSCI will remove Strategy from its equity indexes after the November 30 close under its new non-operating-company rules. MSCI-tracking funds hold 3.1% of MSTR shares, so direct impact is limited, but the risk to BTC is indirect: forced MSTR selling pressures the stock and makes it harder to raise capital for more BTC. Adler's question: with price below the annual median, is this a deeper correction or support?", "angle": "The key variable is MSTR's mNAV. If the premium compresses, the reflexive BTC bid from Saylor's ATM issuance stops.", "tweetA": "MSCI forced selling is only 3.1% of MSTR. The real damage is to the flywheel: lower share price means less ATM issuance, which means less BTC buying. The largest marginal buyer of bitcoin just got its funding cost raised. $MSTR $BTC", "tweetB": "BTC is below its annual median, ETFs are bleeding and the biggest corporate buyer is being kicked out of the index. I'm watching Hyperliquid whale liquidation levels. That's where the next leg gets decided.", "charts": {"count": 0, "hot": false, "desc": "Charts inside: OI, spot CVD across exchanges, Hyperliquid liquidation map"}, "link": "https://adlerinsight.substack.com/p/bitcoin-market-state-report-552"}, {"id": 27, "cat": "positioning", "urgency": "deep", "source": "Macro Charts / Market Update 11/12", "title": "S&P futures OI jumped $19.1B in a day on shorts, then collapsed $16.6B in the squeeze", "idea": "Goldman: S&P futures open interest rose $19.1B on Nov 5, the fifth-largest daily increase in two years excluding rolls, as investors piled into shorts. As AI stabilized and oil fell, the S&P recovered 2.7% through Nov 9 while OI collapsed $16.6B. Much of the rebound was short covering, not new conviction buying. The S&P is now up for November and since the midterm; QQQ is down 0.01% for the month.", "angle": "87% of the short build was covered within three sessions. Once the squeeze fuel is spent, the next leg needs real buyers.", "tweetA": "$19.1B of S&P shorts added in a day, and 87% of it covered within three sessions. That rally was the shorts' exit, not the bulls' entry. The next 2% needs someone who actually wants to own it. $SPY", "tweetB": "On Nov 5 nobody would have believed the S&P would finish up for the month. Two weeks later it is, and QQQ is flat in a month where NVDA lost its CEO. The market keeps punishing whoever is most confident.", "charts": {"count": 2, "hot": true, "desc": "Goldman S&P futures OI daily change; S&P since midterm (Ryan Detrick)"}, "link": "https://www.macrocharts.com/p/market-update-and-signals-111226"}, {"id": 28, "cat": "credit", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom (BofA credit vs vol)", "title": "BofA: hyperscaler credit spreads at 5-year wides while equity vol has barely moved, so own downside vol and correlation", "idea": "BofA's Benjamin Bowler and Global Equity Derivatives: as hyperscalers lean on debt markets for the AI build, their borrowing spreads have widened to levels not seen in at least five years, yet equity valuations and options have barely adjusted. BofA recommends owning downside volatility and correlation before funding concerns reach the earnings narrative. Other BofA strategists draw different conclusions from the same credit data.", "angle": "The credit-equity divergence is the cleanest early-warning signal in the AI trade. Long correlation is the hedge if all AI names reprice together on funding.", "tweetA": "Bondholders are charging hyperscalers the widest spreads in 5 years. Option sellers are charging almost nothing. One of those two markets is wrong, and credit usually isn't. $QQQ vol is the cheap hedge.", "tweetB": "The trade isn't 'short AI.' It's 'long correlation.' If funding becomes the story, $MSFT $META $ORCL $CRWV stop trading on fundamentals and all move together. Correlation is priced for dispersion.", "charts": {"count": 0, "hot": false, "desc": "Charts inside: IG spread vs implied vol divergence"}, "link": "https://thedarksideoftheboom.substack.com/p/the-credit-market-has-already-blinked"}, {"id": 29, "cat": "tech", "urgency": "watch", "source": "Michael Spencer & Weng Honn / AI Supremacy", "title": "The Anthropic IPO is 'multiple times oversubscribed', and retail investors are building AI equity analysts", "idea": "AI Supremacy calls the Anthropic IPO multiple times oversubscribed against a backdrop of NVDA volatility, and publishes the second guide in a series on using AI bots (here Grok, via its real-time X data) as no-code equity research assistants for retail investors, written by a Malaysian investor-creator.", "angle": "Retail adoption of LLM research tools compresses the information edge on large caps, and the IPO's oversubscription is a sentiment gauge for AI risk appetite despite the NVDA turmoil.", "tweetA": "Anthropic's IPO is multiple times oversubscribed in the same week Nvidia is losing its CEO. Investors aren't leaving AI. They're rotating from the picks-and-shovels to the model layer.", "tweetB": "Retail investors in Kuala Lumpur are building equity analysts out of chatbots. When everyone has a sell-side analyst in their pocket, the edge moves to data nobody else has, not better analysis.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.ai-supremacy.com/p/how-to-build-your-own-equity-research-analyst-with-grok-bot"}, {"id": 30, "cat": "AI/infra", "urgency": "act", "source": "Robert Marsh / Big Moves Nov 11", "title": "CoreWeave +24.7%: revenue +168% to $3.66B, backlog $132.5B, demand '10x capacity' through 2027", "idea": "CoreWeave Q3: revenue $3.66B (+168%), adj. EBITDA $2.26B (62% margin), backlog $132.5B (from ~$104B in June). Management says qualified demand is about 10x available capacity through 2027. Long-term contracts get $20-25M per MW and short ones up to $40M. Active power is 1.7GW vs 4.6GW contracted, across 52 data centers. 2026 revenue guide is $13.0-13.3B, with exit run-rate $20-21B.", "angle": "4.6GW contracted at ~$22.5M/MW is about $104B, which roughly reconciles with the backlog. The gap between 1.7GW active and 4.6GW contracted is the execution risk.", "tweetA": "Quick math on $CRWV: 4.6GW contracted at $20-25M/MW is ~$104B, which explains most of the $132.5B backlog. The demand is real. The question is whether they can energize 2.9GW before the debt bill comes due.", "tweetB": "The CoreWeave beat was published in the same 24 hours NVDA lost its CEO. Demand is 10x capacity, which is why Campbell argues less supply means HIGHER compute prices. $CRWV", "charts": {"count": 0, "hot": false, "desc": "Charts inside: backlog and active vs contracted power"}, "link": "https://bigmoves.substack.com/p/big-moves-november-11-2026"}, {"id": 31, "cat": "credit", "urgency": "deep", "source": "Robert Marsh / Big Moves Nov 11", "title": "CoreWeave: $46.9B debt, $846M quarterly interest, $7.5B cash burn; Q4 interest heading to ~$1.1B", "idea": "Q3 net interest expense was $846M (vs $310M a year ago), producing a $709M net loss despite $207M GAAP operating income. Operating cash flow was $1.98B against $9.44B of cash capex, a ~$7.47B deficit. Q4 interest is guided to $1.05-1.15B. Funding: $6.5B cash, ~$5B undrawn DDTL, ~$9B of expected customer prepayments in three months, secured financing at ~7-7.5%. Management sees under $5B of incremental parent-level capital needed through 2027.", "angle": "Q4 interest annualizes to ~$4.4B, about 21% of the exit revenue run-rate. Customer prepayments are effectively customers financing the build, which is a form of vendor finance in reverse.", "tweetA": "$CRWV's Q4 interest bill annualizes to ~$4.4B, about 21% of its exit run-rate revenue. Quarterly capex ($14.5B) is 4x quarterly revenue. This isn't a software company. It's a utility with a credit rating problem.", "tweetB": "The quiet tell: ~$9B of customer prepayments in the next 3 months. The hyperscalers are now financing the neocloud. If the 'Jensen Put' fades, the 'customer put' replaces it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-november-11-2026"}, {"id": 32, "cat": "AI/infra", "urgency": "watch", "source": "Robert Marsh / Big Moves Nov 11", "title": "300k CoreWeave GPUs roll off contract in 2027-28, worth ~$10B of incremental annualized revenue on renewal", "idea": "About 130,000 GPUs come off contract in 2027 and 170,000 in 2028. Management estimates renewals at current prices could add about $10B of combined incremental annualized revenue without matching new equipment purchases. Positive adjusted net income expected in 2028.", "angle": "This is the GPU depreciation debate in numbers. If H100/H200-class renewal pricing holds, depreciation bears are wrong. If it collapses, the 2028 profit target goes with it.", "tweetA": "$10B of renewal revenue on 300k GPUs is about $33k per GPU per year for hardware that will be 4-5 years old. That number decides whether GPU depreciation schedules are fiction. Watch H100 spot rental prices. $CRWV $NVDA", "tweetB": "The bear case on neoclouds is that old GPUs are worthless. CoreWeave is betting a 2023 GPU still earns real money in 2028. Compute scarcity (Campbell's 'less supply, same demand') is exactly what makes that bet work.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-november-11-2026"}, {"id": 33, "cat": "AI/infra", "urgency": "deep", "source": "Robert Marsh / Big Moves Nov 11", "title": "Sandisk +13.7%: NAND price increases have lasted ~6 quarters vs ~2 historically; Evercore PT $2,500", "idea": "Evercore (Daryanani, Outperform, $2,500 PT vs $977.69 close) says NAND supply discipline, multiyear customer agreements with price floors, ceilings and financial guarantees, and immediate AI data-center demand make earnings more durable. Sandisk management says it isn't supply constrained, and high profitability reduces the incentive to chase volume. Micron +11.9%, Seagate +10%, Dell +11.8%.", "angle": "Memory is being re-rated from cyclical to contracted. Price floors in multiyear deals are the mechanism, and the test is the next downturn.", "tweetA": "NAND price increases historically lasted 2 quarters. This one is at 6. When customers sign multiyear deals with price FLOORS, memory stops being a commodity. That's the whole re-rating case for $SNDK $MU.", "tweetB": "Evercore's $2,500 on $SNDK implies +156%. The bull case needs Samsung and SK Hynix to stay disciplined. Memory discipline has never survived a downturn, and contracts are only as strong as the customer's need for supply.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-november-11-2026"}, {"id": 34, "cat": "energy", "urgency": "deep", "source": "Robert Marsh / Big Moves Nov 11", "title": "AI power plays: Bloom +13% on CoreWeave read-through; Oracle's Opower posts record utility peak-demand cuts", "idea": "Bloom Energy rose 12.97% to $209 as CoreWeave's results eased fears of a data-center slowdown (Bloom supplies on-site fuel-cell power). Oracle +8.8% after utilities using its AI Opower platform achieved record peak-demand reductions and ran far more demand-response events. Lattice and MPWR rose after Trump backed expanded AI data-center construction.", "angle": "Behind-the-meter power (Bloom) plus demand-response software (Opower virtual power plants) are the two ways around grid interconnection queues.", "tweetA": "Bloom up 13% on a CoreWeave earnings beat tells you the bottleneck: it isn't GPUs, it's getting electrons behind the meter. 4.6GW contracted vs 1.7GW active is a power-equipment order book. $BE $GEV", "tweetB": "Oracle's Opower angle is underrated. If AI can shave the grid's peak, the same lines carry more data-center load. Virtual power plants are the cheapest gigawatt in America. $ORCL", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-november-11-2026"}, {"id": 35, "cat": "energy", "urgency": "watch", "source": "Robert Marsh / Big Moves Nov 11", "title": "Darling Ingredients +5%: Diamond Green Diesel swings to profit on renewable diesel margins and credit values", "idea": "Darling's quarterly filing showed Diamond Green Diesel swinging to earnings on better renewable-diesel volumes, credit values and diesel margins, plus higher fat and protein pricing in Feed Ingredients and stronger collagen demand in Food Ingredients.", "angle": "Renewable diesel margins recovering alongside oil-product strength and RIN/LCFS credit values. Biofuels lean into the 'old world economy' theme.", "tweetA": "Renewable diesel was left for dead in 2025. Diamond Green Diesel just swung back to profit on credit values and diesel cracks. If diesel stays tight, the waste-fat supply chain becomes a margin story again. $DAR $VLO", "tweetB": "Collagen demand is a GLP-1-era protein story hiding inside a rendering company. $DAR is quietly a play on animal fats, diesel cracks AND the protein-supplement boom.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-november-11-2026"}, {"id": 36, "cat": "positioning", "urgency": "watch", "source": "Robert Marsh / Big Moves Nov 11", "title": "NDX bounced off a clean three-touch trendline last week; objective is a new high", "idea": "Robert Marsh notes the Nasdaq 100 tested a clean trendline (third touch) last week. All else equal the objective is a new high, risking a close below last week's low. From an investor roundtable: the AI trade 'was never truly gone'; the press conflates corrections with bear markets. 10 of 12 big movers were data-center related.", "angle": "Clear technical risk definition: last week's low is the stop.", "tweetA": "Three touches on the NDX trendline held in a week when NVDA lost its CEO. If the market can't break the line on THAT news, the line is real. Stop is last week's low. $QQQ", "tweetB": "10 of the 12 biggest movers yesterday were data-center plays, the day after the AI trade was declared dead. Corrections get reported as bear markets, and that's how bull markets refill their wall of worry.", "charts": {"count": 1, "hot": false, "desc": "NDX trendline chart with three touches"}, "link": "https://bigmoves.substack.com/p/big-moves-november-11-2026"}, {"id": 37, "cat": "AI/infra", "urgency": "watch", "source": "Robert Marsh / Big Moves Nov 11", "title": "Zoom launches an equity-free AI Launchpad; Seagate ships FireCuda Forge HDD on its Alkemi platform", "idea": "Zoom +7.9% after launching AI Launchpad, giving startups credits and support to build on its speech, language, voice and decision APIs with no equity taken. Seagate +10% on FireCuda Forge (8TB/20TB), the first drive on its Alkemi intelligent-storage platform, promising SSD-like responsiveness from HDD capacity.", "angle": "Zoom is trying to become an AI API platform rather than an app, competing with hyperscalers for developer mindshare.", "tweetA": "Zoom giving startups free credits to build on its voice APIs is the AWS Activate playbook. A video app trying to become an AI infrastructure company is either genius or 2021 all over again. $ZM", "tweetB": "Seagate putting 'SSD-like responsiveness' in a 20TB hard drive matters for AI storage tiers. If HDDs close the latency gap, cold data stays on spinning disk and NAND gets squeezed at the margin. $STX $SNDK", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-november-11-2026"}, {"id": 38, "cat": "macro", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom (GS Europe consumer)", "title": "Goldman: Europe's consumer stalls through winter as delayed utility bills hit; normal growth not until 2028", "idea": "GS economists Garnadt and Pierdomenico: European households weathered the energy shock by spending savings, not through real income growth. Delayed utility-bill pass-through, tighter consumer credit and falling confidence will bring consumption close to a standstill this winter. Recovery comes later in 2027, with normal growth only in 2028. The divergence from the resilient US consumer matters for European equities, the ECB and the euro.", "angle": "Europe's energy shock hits on a lag, so the worst consumer prints come after the oil price has already eased. That argues for an ECB cut while the Fed is debating hikes, i.e. EUR/USD downside.", "tweetA": "Europe's energy shock arrives on a delay: utility bills reset months after the oil spike. So the European consumer prints get worse just as oil cools, and the ECB will be cutting into it while the Fed debates a HIKE. That's a EUR/USD story. $FXE", "tweetB": "European households spent their savings to absorb the shock. That buffer is gone, which makes this winter the real test. Long US consumer vs short EU discretionary looks cleaner than it has in years. $EXV5", "charts": {"count": 0, "hot": false, "desc": "Charts inside: GS consumption model"}, "link": "https://thedarksideoftheboom.substack.com/p/gss-2027-consumer-playbook-part-ii"}, {"id": 39, "cat": "AI/infra", "urgency": "deep", "source": "Peter Boockvar / The Boock Report", "title": "Nvidia holds $99B of equity stakes in other companies, plus vendor financing and lease guarantees", "idea": "Boockvar: as of Q2, Nvidia had $99B of equity investments in other companies, not counting the vendor financing and lease guarantees it has extended. With the founder possibly leaving, the open question is what happens to future investments and financing across its partner network. AMD and Broadcom traded up premarket.", "angle": "This is the number behind Campbell's 'Jensen Put.' A new CEO and an activist board are much less likely to keep writing those checks.", "tweetA": "Nvidia has $99B in equity stakes in its own customers, before vendor financing and lease guarantees. A founder can run that as strategy. A new CEO under congressional investigation will run it as risk. $CRWV $NBIS", "tweetB": "AMD and Broadcom up premarket on NVDA turmoil is the obvious trade. The less obvious one: whoever depends on Nvidia's balance sheet to fund GPUs needs a new lender. Private credit just got a new client list. $AMD $AVGO", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://peterboockvar.substack.com/p/who-was-it-that-said-life-is-stranger"}, {"id": 40, "cat": "positioning", "urgency": "deep", "source": "Peter Boockvar / The Boock Report", "title": "Sentiment back to April lows: II bulls 37 (from 42.6), AAII bulls 30.8, Fear/Greed 37", "idea": "Investors Intelligence bulls fell to 37 from 42.6 and bears jumped to 24.1 from 18.5, back to early-April levels after the March oil spike. AAII bulls fell 3.3 to 30.8, the lowest since July, and bears 41.4. CNN Fear/Greed is 37 vs 19 (Extreme Fear) a week ago. Boockvar: the sour mood was the perfect contrarian setup for a rally.", "angle": "Sentiment is washed out while the squeeze is already happening (Macro Charts), so the contrarian fuel is partly spent.", "tweetA": "AAII bull-bear spread is -10.6 and the S&P is UP for November. Retail is still bearish into a rally driven by short covering. That gap is what pushes the next leg.", "tweetB": "Fear/Greed went from 19 to 37 in a week while AAII bears are still at 41%. The fear has left price but hasn't left people. That's usually when you want to be long. $SPY", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://peterboockvar.substack.com/p/who-was-it-that-said-life-is-stranger"}, {"id": 41, "cat": "macro", "urgency": "watch", "source": "Peter Boockvar / The Boock Report", "title": "BrightView -14%: residential community construction is slowing", "idea": "BrightView, the largest US commercial landscaper (~75% maintenance, the rest new development), fell almost 14% after its development segment was hit by a slowdown in residential community construction.", "angle": "Landscaping is a late-stage indicator in the housing pipeline. A slowdown in development landscaping means fewer completions 6-12 months out.", "tweetA": "The biggest US landscaper just told you residential community construction is slowing. Landscaping is the last step before move-in, so this is the housing pipeline thinning in real time. $BV $ITB", "tweetB": "Housing data lags. Landscaping contracts don't. If BrightView's development book is shrinking, builders' 2027 completions guidance has downside. $DHI $LEN", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://peterboockvar.substack.com/p/who-was-it-that-said-life-is-stranger"}, {"id": 42, "cat": "AI/infra", "urgency": "act", "source": "David Rosenberg / Early Morning with Dave", "title": "Rosenberg: no apparent successor at Nvidia, and a 'domino effect' across an interconnected AI industry", "idea": "David Rosenberg: two sex scandals in a single week 'doesn't happen very often.' There is no apparent successor if the board ousts the architect of the AI boom, and we can't rule out a domino effect across the industry given how interconnected it is.", "angle": "A long-time AI-capex skeptic now has a governance catalyst. The interconnectedness point matches the $99B equity book (Boockvar) and circular financing.", "tweetA": "Rosenberg's 'domino effect' is the right frame. NVDA invests in customers who buy NVDA chips financed by lenders who lend on NVDA's backstop. Take out the person holding that circle together and every link gets repriced.", "tweetB": "Bears have spent two years waiting for an AI catalyst. They expected a demand miss, a power shortage or a credit event. They got a governance scandal. Cycles rarely end the way the forecast said.", "charts": {"count": 0, "hot": false, "desc": "Charts inside, worth opening"}, "link": "https://www.earlymorningwithdave.com/p/a-tangled-web-gets-weaved"}, {"id": 43, "cat": "crypto", "urgency": "act", "source": "Lucky Trader / Morning Minute", "title": "OKX-ICE tokenized stock venue launches Nov 23 even though 67 issuers objected, including all of the Mag 7", "idea": "Under the SEC's September innovation exemption (after CLARITY died in the Senate), issuers can block third-party tokenization by objecting in writing within 30 days. Objections at OKXICE went 22, then 50, 56 and now 67, including every Magnificent Seven company. The venue launches Nov 23 with 70+ assets, 59 of them Direxion ETFs, plus Coinbase, Circle, Robinhood, Strategy, BitGo, Securitize and Better.com. Securitize tokenizes 1:1 with dividends and votes, and trading runs on Uniswap v4 on X Layer.", "angle": "Issuer veto means third-party tokenization only gets crypto-native names. The winning model is issuer-sponsored via transfer agents (NYSE/Avalanche, DTCC/Canton).", "tweetA": "A tokenized stock exchange from OKX and the NYSE's parent launches with 7 crypto stocks and 59 leveraged ETFs. The Mag 7 vetoed it, all seven. Tokenization will happen through transfer agents, not around them.", "tweetB": "Every Mag 7 company objected to being tokenized by a third party. Issuers don't want a shareholder registry they can't see. That's why DTCC and NYSE/Avalanche are going to win this, not DeFi venues. $ICE", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/tokenized-stock-venues-are-launching"}, {"id": 44, "cat": "crypto", "urgency": "deep", "source": "Lucky Trader / Morning Minute", "title": "NYSE picks Avalanche for clearing and settlement of 24/7 tokenized securities; DTCC live on Canton with 20 participants", "idea": "NYSE chose Avalanche to handle clearing and settlement for its 24/7 tokenized securities platform (Q4 launch target after ~1 year of testing), with Broadridge, Computershare, Equiniti and Superstate signed for issuer-sponsored tokens and transfer-agent work. DTCC's tokenization service went live Oct 28 on Canton with 20 participants including BofA, Citi, JPM and Citadel Securities. Morgan Stanley has already run equities and Treasuries through it.", "angle": "Financial plumbing is being rebuilt by incumbents on chosen chains, so the value accrues to the settlement layer they picked.", "tweetA": "The NYSE picked Avalanche. DTCC picked Canton. The two biggest settlement decisions in US equities went to chains most crypto Twitter ignores. Plumbing wins over hype. $AVAX", "tweetB": "When the issuer's own transfer agent mints the token, there's nothing to veto. Computershare and Broadridge are the gatekeepers of tokenized equity, and they're priced as boring back-office stocks. $BR", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/tokenized-stock-venues-are-launching"}, {"id": 45, "cat": "crypto", "urgency": "act", "source": "Lucky Trader / Morning Minute", "title": "BTC $72.8k: short-term holders dumped ~47,300 BTC to exchanges at a loss in 24h; BTC ETFs -$300M, ETH ETFs -$144M", "idea": "BTC -1% to $72.8k, ETH $2,020, SOL $82, HYPE $70, ZEC $966. Short-term holders sent about 47,300 BTC to exchanges below cost basis in 24h. BTC ETFs saw $300M of net outflows Wednesday, ETH ETFs $144M. Gold is at $3,950 and oil at $86. Odds Jensen is removed in 2026 spiked above 80% on prediction markets.", "angle": "47.3k BTC at ~$72.8k is about $3.4B of loss-taking in a day, which is capitulation-style. Combined with MSCI forced selling, the next two weeks are the stress test.", "tweetA": "~47,300 BTC sent to exchanges at a loss in 24h is about $3.4B of capitulation from short-term holders. Add the MSCI exit and ETF outflows and every marginal seller is selling at once. Capitulation is a process, not an event.", "tweetB": "BTC at $72.8k and gold at $3,950 puts the ratio at ~18 ounces. 'Digital gold' is losing to physical gold in a geopolitical year. The debasement trade picked a side. $GLD $IBIT", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/tokenized-stock-venues-are-launching"}, {"id": 46, "cat": "crypto", "urgency": "deep", "source": "Lucky Trader / Morning Minute", "title": "MSCI's new rule: companies with >50% of assets in digital assets are treated as funds, so Strategy, Metaplanet and Yellow Cake are out", "idea": "MSCI removes Strategy, Metaplanet and uranium holder Yellow Cake from global indexes after the Nov 30 close, under a rule that treats firms whose digital-asset or similar holdings exceed half of total assets as investment funds rather than operating businesses. MSTR -7%.", "angle": "Yellow Cake being caught shows it's a generic 'holding company' screen, not an anti-crypto rule. Any commodity-treasury company is exposed.", "tweetA": "MSCI's rule caught Yellow Cake, a uranium holder, alongside MSTR and Metaplanet. So it isn't anti-crypto. It's anti-'company that's really a fund.' Every treasury-strategy copycat just lost the passive bid.", "tweetB": "The treasury-company model needed index inclusion to make its premium-to-NAV reflexive. Without passive buyers, mNAV converges to 1, and the ATM-issuance machine stops. $MSTR $MTPLF", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/tokenized-stock-venues-are-launching"}, {"id": 47, "cat": "crypto", "urgency": "watch", "source": "Lucky Trader / Morning Minute", "title": "CoinShares survey: regulation and corporate restrictions tie as the top barrier to buying crypto (~24% each)", "idea": "Fund managers citing regulation as the main barrier rose from ~16% to ~24%, and corporate restrictions from ~9% to ~24%. Volatility fell from the top concern (32%) to ~18%. Deutsche Bank went live with institutional crypto custody for European corporate and investment bank clients, five years after starting the build.", "angle": "Institutional barriers are moving from risk to compliance. MSCI's rule is a corporate restriction in action.", "tweetA": "Fund managers no longer cite volatility as the main reason not to own crypto. Now it's compliance departments. That's progress, because compliance can be solved and volatility can't.", "tweetB": "'Corporate restrictions' as a barrier went from 9% to 24% in one survey. Index providers and compliance teams are tightening at the same time banks are launching custody. Access is improving, permission isn't.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/tokenized-stock-venues-are-launching"}, {"id": 48, "cat": "crypto", "urgency": "watch", "source": "Lucky Trader / Morning Minute", "title": "Telegram's Durov: 1M self-custodial Gram wallets activated in 48 hours", "idea": "Pavel Durov says more than 1 million self-custodial Gram wallets were activated in 48 hours as the native wallet rolls out across Telegram, and calls Gram 'ridiculously undervalued.' Gram +4%.", "angle": "A distribution-first crypto launch inside a billion-user messaging app is the closest thing to WeChat Pay for crypto.", "tweetA": "1M wallets in 48 hours is what crypto distribution looks like when it lives inside a messaging app instead of an exchange. Telegram has ~1B users, so Gram's TAM is the address book.", "tweetB": "Self-custody at Telegram scale means a billion people could hold keys without knowing it. That's either the onboarding breakthrough or the biggest phishing surface in history.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/tokenized-stock-venues-are-launching"}, {"id": 49, "cat": "crypto", "urgency": "watch", "source": "Lucky Trader / Morning Minute", "title": "Kraken tokenizes 200+ UK/EU stocks (HSBC, Shell, LVMH, Airbus); xStocks passes 1,500 assets", "idea": "Payward (Kraken) added more than 200 UK and EU-listed stocks as xStocks, backed 1:1 by shares at a regulated custodian, across Solana, Ethereum and TON. The total is past 1,500 tokenized assets. Not available to UK or US investors; hundreds of Hong Kong stocks are coming.", "angle": "Offshore tokenized equities are the export product: access for non-US/non-UK retail to Western blue chips 24/7.", "tweetA": "Kraken now offers tokenized LVMH and Shell to everyone except Brits and Americans. Tokenized equities are an export product: 24/7 access to Western blue chips for the rest of the world.", "tweetB": "1,500 tokenized assets on xStocks vs 7 real stocks at OKXICE. The non-US market is moving faster because there's no issuer veto. Regulatory arbitrage, again.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/tokenized-stock-venues-are-launching"}, {"id": 50, "cat": "crypto", "urgency": "watch", "source": "Lucky Trader / Morning Minute", "title": "Bitcoin Core discloses a patched high-severity bug that could freeze a miner's block production after a reorg", "idea": "Bitcoin Core disclosed three vulnerabilities patched in v30.0 and v29.2 (October 2025). The most serious could corrupt a node's mempool during a chain reorganization and stop it building block templates until restarted, halting a miner's block production. Disclosure followed the 29.x series reaching end of life.", "angle": "Mining-node liveness bugs are the kind of tail risk that matters as quantum and node-diversity debates heat up.", "tweetA": "A bug that could stop miners producing blocks after a reorg, patched quietly a year ago and disclosed now. The responsible-disclosure process worked. The question is how many miners still run unpatched nodes.", "tweetB": "Bitcoin's security story focuses on quantum and 51% attacks. The real risk keeps being mundane software bugs in the reference client. Client diversity matters more than the memes suggest.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/tokenized-stock-venues-are-launching"}, {"id": 51, "cat": "crypto", "urgency": "watch", "source": "Lucky Trader / Morning Minute", "title": "Hyperliquid leads on-chain revenue ($2.19M/day); Decrypt adds 40x perps on stocks, gold and pre-IPO names", "idea": "Hyperliquid led on-chain protocols with $2.19M of daily revenue, followed by Pump.fun ($1.32M) and Collector Crypt ($369k). Decrypt added perpetual futures through Phoenix (Ellipsis Labs, Solana) with 100+ markets covering crypto, US stocks, gold and pre-IPO names at up to 40x.", "angle": "Perps on everything are moving into media apps. Pre-IPO perps (Anthropic next week) are where retail speculation goes before listing.", "tweetA": "A crypto media site now offers 40x leverage on pre-IPO names. Anthropic perps will be trading on Solana before the bell rings on the real IPO. Price discovery is moving offshore and on-chain.", "tweetB": "Hyperliquid at ~$800M annualized revenue ($2.19M/day) is a top-tier exchange business with no office in New York. That's what the Citadel/Cboe lawsuit against stock perps is really about. $HYPE", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/tokenized-stock-venues-are-launching"}, {"id": 52, "cat": "crypto", "urgency": "deep", "source": "Unchained / Daily", "title": "MSCI's first non-operating screen: 6 deletions, 19 on watchlist; Strategy the only name leaving US indexes outright", "idea": "MSCI's November review is the first since the Oct 15 non-operating-company screen. Six securities are marked for removal and 19 more are on a watchlist. A current constituent is cut only after failing the screen in two straight annual filings. MSCI is removing 24 securities from its USA Index, 23 of which move to Small Cap; Strategy is the only one leaving US indexes entirely. Strategy says MSCI funds hold ~13M shares (3.1%).", "angle": "The 19-name watchlist is the next wave of forced selling. That's the list to short ahead of the next annual filing cycle.", "tweetA": "23 of 24 names cut from MSCI USA dropped to Small Cap. Strategy got nothing. When an index provider treats you as a fund, not a company, there's no downgrade, just the exit. $MSTR", "tweetB": "The more important number is the 19 securities on MSCI's watchlist. Strategy is the warning shot. The next filing cycle decides which treasury companies lose passive demand in 2027.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/strategy-to-leave-msci-indexes-by-month-end-metaplanet-also-out/"}, {"id": 53, "cat": "regulation", "urgency": "act", "source": "Unchained / Daily", "title": "SEC files brief backing CFTC on single-stock perps against a Cboe/Citadel Securities lawsuit", "idea": "Single-stock perp applications from Coinbase, Kalshi and Bitnomial were deemed approved Nov 2 when the CFTC review window lapsed. The Capital Markets Alliance (members include Cboe and Citadel Securities) sued, arguing they're security-based swaps under the SEC. The SEC reportedly filed a brief backing the CFTC, calling the 'CFTC gone rogue' framing mistaken, though it took no position on futures vs swaps. Dec 31 is the SEC's deadline to overturn the rules. Two former senior SEC officials signed a Better Markets brief backing the injunction.", "angle": "If stock perps survive, Coinbase and Kalshi get an equity-derivatives product that competes with listed options. That's why Cboe and Citadel sued.", "tweetA": "Cboe and Citadel suing to stop stock perps tells you exactly who loses if they launch: the listed-options complex. The SEC siding with the CFTC is a big signal. Dec 31 is the date. $COIN $CBOE", "tweetB": "The SEC defending the CFTC's turf is something I never expected to write. Regulators are coordinating to let crypto venues offer equity leverage. 0DTE options just got a perpetual competitor. $HOOD", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/sec-reportedly-backs-cftc-against-stock-perps-injunction/"}, {"id": 54, "cat": "regulation", "urgency": "watch", "source": "Unchained / Daily", "title": "Senators ask whether a White House aide who bet on Trump's words via Kalshi could get clemency", "idea": "Sens. Warren and Merkley asked White House Counsel Will Scharf whether he'd recommend clemency for Gabriel Perez, a former teleprompter operator who traded Kalshi 'mention' contracts (on what Trump would say) from Dec 2025 to Mar 2026. He must disgorge $107,539 and pay a $65,000 penalty. The letter also cites Donald Trump Jr.'s advisory roles and stakes at Kalshi and Polymarket. Answers are due Nov 23.", "angle": "Insider trading in prediction markets is now a congressional oversight topic. With Democrats taking subpoena power in January, prediction-market regulation risk goes up.", "tweetA": "The teleprompter operator bet on what the President would say, and made $107k. Mention markets are the purest insider-trading product ever built: the information exists only in the room.", "tweetB": "Prediction markets did $123.6B in October. Congress just found its first insider-trading case and its first conflict-of-interest angle (Don Jr.). Volume and political scrutiny are going up together.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/senators-ask-white-house-if-kalshi-betting-aide-could-get-clemency/"}, {"id": 55, "cat": "venture", "urgency": "watch", "source": "Unchained / Daily", "title": "Polymarket confirms layoffs after new execs (ex-Amazon CFO, ex-Uber growth chief) review headcount", "idea": "Polymarket confirmed a viral termination email was real; the poster said 30% of the workforce was hit, which Polymarket disputes without giving a number. Cuts fell mostly on contractors in marketing, customer experience and engineering. This follows new hires Warren Jenson (ex-Amazon finance) as first CFO and Travis VanderZanden (ex-Uber) as chief growth officer, after investors pushed founder Shayne Coplan for more discipline. Morning Minute frames it as losing ground to Kalshi.", "angle": "Record category volume plus cuts at the former leader means share is shifting to the regulated venue. An IPO-prep CFO is the tell.", "tweetA": "Prediction markets just had their best month ever, and Polymarket is cutting staff. When the category grows 58% m/m and you lay people off, you're losing share. Kalshi is winning the regulated war.", "tweetB": "First CFO is an ex-Amazon finance chief, growth chief is ex-Uber, contractors are cut. That's what IPO prep looks like. Polymarket is trading crypto-native culture for public-market discipline.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/polymarket-says-viral-contractor-cut-email-is-real-wont-say-how-many-jobs-went/"}, {"id": 56, "cat": "regulation", "urgency": "deep", "source": "Unchained / Daily", "title": "Judge calls CFTC's swap rules 'inherently contradictory', denies Novig's bid to block New York's gambling license requirement", "idea": "Judge Colleen McMahon denied Novig's request to block New York from requiring a gambling license for its sports contracts, finding that at this stage they aren't swaps under the Commodity Exchange Act. She called the CFTC's interim final rule and proposed rule 'inherently contradictory.' Novig appealed the same day.", "angle": "State gaming regulators are winning the jurisdiction fight over sports contracts. That's the core of prediction-market volume.", "tweetA": "A federal judge just called the CFTC's own rules 'inherently contradictory' and let New York regulate sports contracts as gambling. Sports are most of prediction-market volume. This is the case to watch, not the election markets.", "tweetB": "If sports event contracts are gambling at the state level, prediction markets need 50 licenses, just like DraftKings. The moat moves from tech to licensing, which favors the incumbents. $DKNG $FLUT", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/judge-calls-cftcs-swap-rules-inherently-contradictory-as-novig-loses-bid-to-block-new-york/"}, {"id": 57, "cat": "crypto", "urgency": "watch", "source": "Unchained / Daily", "title": "Nomura exploring sale of Laser Digital after losses pushed its European ops into the red", "idea": "Bloomberg: Nomura is exploring a sale of its Zurich-based crypto unit Laser Digital, with Marex among potential buyers. Losses at the unit last year were big enough to push Nomura's European operations into the red.", "angle": "Banks' crypto ambitions are splitting: custody (Deutsche, same day) is in, prop/market-making units are out.", "tweetA": "Same day: Deutsche Bank launches crypto custody, Nomura tries to sell its crypto unit. Banks want the fee business, not the trading risk. Custody is the business model that's surviving.", "tweetB": "Marex as a buyer is the tell. Commodity brokers see crypto as just another collateralized flow business. The 'bank-grade crypto' dream is ending up at a broker.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.bloomberg.com/news/articles/2026-11-11/nomura-explores-possible-sale-of-laser-digital-crypto-unit"}, {"id": 58, "cat": "crypto", "urgency": "watch", "source": "Unchained / Daily", "title": "Across bridge domain hijacked via Namecheap social engineering; ~$350k phished in 6.5 hours", "idea": "An attacker socially engineered Namecheap into handing over Across's domain and served a phishing page for ~6.5 hours. GoPlus estimates $350k in losses (unconfirmed by Across). The team says users will be made whole.", "angle": "Web2 dependencies (DNS registrars) remain the weakest link in DeFi security.", "tweetA": "A $1B+ DeFi bridge got hijacked by phoning a domain registrar. The smart contracts were fine. The weakest link in crypto is still a Web2 support desk.", "tweetB": "Every DeFi front end runs on DNS from a registrar with a phone line. Until frontends are content-addressed (ENS/IPFS), 'decentralized finance' has a very centralized front door.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/across-back-online-after-namecheap-social-engineering-handed-domain-to-attacker/"}, {"id": 59, "cat": "crypto", "urgency": "watch", "source": "Unchained / Daily", "title": "LlamaRisk asks Aave to freeze osETH, LBTC and rETH on V3 Core (~$364M of debt backed)", "idea": "As part of a plan to keep Aave V3 Core for liquid collateral and move riskier assets to V4, LlamaRisk proposed freezing StakeWise's osETH, Lombard's LBTC and Rocket Pool's rETH. Those tokens back ~$364M of debt; existing positions would be unaffected.", "angle": "Collateral tiering in DeFi lending is happening: LST/LRT liquidity is now treated as second-tier.", "tweetA": "Aave's risk manager says rETH, a blue-chip ETH LST, isn't liquid enough for Core collateral. That's DeFi admitting the LST trade has a liquidity problem. $AAVE", "tweetB": "DeFi just reinvented the haircut schedule. Liquid collateral in Core, everything else in a riskier tier. It's the repo market, rebuilt on-chain, five years later.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/llamarisk-asks-aave-to-freeze-stakewise-lombard-and-rocket-pool-tokens-on-its-v3-core-market/"}, {"id": 60, "cat": "crypto", "urgency": "watch", "source": "Unchained / Daily", "title": "Zcash draft would claw back 50,000 ZEC (~$50M) from the grants treasury and end its 8% block reward", "idea": "Zcash's ZIP editors merged a draft that would pull 50,000 ZEC (~$50M) from Zcash Community Grants and end its 8% share of block rewards. Coinholders vote on it and competing plans Nov 16-30. ZEC is at $966.", "angle": "ZEC's rally has turned treasury governance into a live issue. Ending the dev fund cuts sell pressure but defunds development.", "tweetA": "ZEC at $966 turned an 8% dev fund into a $50M political fight. When a token rallies, every treasury becomes a governance war. Vote Nov 16-30. $ZEC", "tweetB": "Cutting the dev fund means less ZEC sold to pay developers. Short-term bullish supply math, long-term question of who ships the privacy roadmap.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://github.com/zcash/zips/pull/1428"}, {"id": 61, "cat": "gold", "urgency": "watch", "source": "Unchained / Daily", "title": "Anchorage lets institutions borrow USD/USDT against tokenized gold (XAUT)", "idea": "Anchorage Digital now lets institutions borrow USD or USDT against Tether Gold (XAU₮) through its Prime platform, the first of several tokenized RWAs it plans to support. Tether invested $100M in Anchorage in February.", "angle": "Tokenized gold becoming loanable collateral makes it a financing asset, not just a holding. With gold at $3,950, that unlocks leverage on the bullion stack.", "tweetA": "With gold at $3,950, institutions can now borrow dollars against tokenized gold at a federally chartered crypto bank. Gold just became programmable repo collateral. $GLD", "tweetB": "Note the circularity: Tether invested $100M in Anchorage, and Anchorage now lends against Tether's gold token. Tokenized RWAs are building their own closed-loop financial system.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/anchorage-digital-lets-institutions-borrow-against-tethers-tokenized-gold/"}, {"id": 62, "cat": "venture", "urgency": "watch", "source": "Unchained / Daily", "title": "Marble raises $11M seed (Polychain) for frontier-market trading and private credit for AI compute providers", "idea": "Marble, co-founded by ex-BitGo and ex-Galaxy executives, raised an $11M seed led by Polychain with Maven 11, Ripple, Susquehanna Crypto, Lattice and Blockwall. It's building institutional trading for digital assets, RWAs and prediction markets, plus private credit for AI compute providers. Pyth also became a distributor of NYSE BQT real-time quotes (for equity perps and tokenized stocks), and Apex Group ($3.5T AUA) joined the Hedera Council.", "angle": "Crypto-native capital is moving into GPU financing, which matters if NVDA's 'Jensen Put' fades.", "tweetA": "A crypto VC-backed startup is bu
