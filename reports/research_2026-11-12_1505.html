const COLORS={"macro":"#e24b4a","credit":"#378add","positioning":"#ef9f27","AI/infra":"#1d9e75","crypto":"#7f77dd","geopolitics":"#d85a30","energy":"#f97316","tech":"#06b6d4","gold":"#d4a017","culture":"#ec4899","labor":"#8b5cf6","regulation":"#64748b","science":"#14b8a6","venture":"#84cc16"};
const UE={act:"🔴",deep:"🔵",watch:"🟡"};const UL={act:"🔴 Act Now",deep:"🔵 Deep",watch:"🟡 Watch"};
var fCat="all",fUrg="all",fSrc=null;
function col(c){return COLORS[c]||"#888";}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function toggle(id){var e=document.getElementById("c"+id);e.classList.toggle("open");}
function cardHTML(item){
  var c=col(item.cat),ch=item.charts||{count:0};
  var icon=ch.hot?" 🔥":(ch.count>0?" 📊":"");
  var h='<div class="card" id="c'+item.id+'" data-id="'+item.id+'">';
  h+='<div class="hd" onclick="toggle('+item.id+')"><span class="num">#'+item.id+'</span><span>'+UE[item.urgency]+'</span>';
  h+='<span class="badge" style="background:'+c+'">'+esc(item.source)+'</span><span class="tag">'+esc(item.cat)+'</span>'+icon;
  h+='<span class="ttl">'+esc(item.title)+'</span></div><div class="bd">';
  h+='<div class="lbl">The Idea</div><div>'+esc(item.idea)+'</div>';
  h+='<div class="lbl">My Angle</div><div class="angle" style="border-color:'+c+';background:'+c+'14">'+esc(item.angle)+'</div>';
  h+='<div class="tw"><div><div class="h" style="color:#378add">TWEET A <button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>'+esc(item.tweetA)+'</div>';
  h+='<div><div class="h" style="color:#7f77dd">TWEET B <button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>'+esc(item.tweetB)+'</div></div>';
  if(ch.count>0||ch.desc){h+='<div class="chart'+(ch.hot?' hot':'')+'">'+(ch.hot?'🔥 CHART WORTH SAVING — ':'📊 ')+(ch.count?ch.count+' chart(s): ':'')+esc(ch.desc)+'</div>';}
  h+='<a class="lnk" href="'+esc(item.link)+'" target="_blank" rel="noopener">↗ Read full article</a></div></div>';
  return h;
}
function visible(i){return (fCat==="all"||i.cat===fCat)&&(fUrg==="all"||i.urgency===fUrg)&&(!fSrc||i.source.indexOf(fSrc)!==-1);}
function render(expand){
  var html="";ITEMS.forEach(function(i){if(visible(i))html+=cardHTML(i);});
  document.getElementById("list").innerHTML=html||'<p class="note">No items match.</p>';
  if(expand){document.querySelectorAll(".card").forEach(function(e){e.classList.add("open");});}
  document.getElementById("srcnote").innerHTML=fSrc?('Source filter: <b>'+esc(fSrc)+'</b> · <span class="src" onclick="clearSrc()">clear</span>'):"";
  pills();
}
function pills(){
  var cc={};ITEMS.forEach(function(i){cc[i.cat]=(cc[i.cat]||0)+1;});
  var h='<button class="pill'+(fCat==="all"?' on':'')+'" style="'+(fCat==="all"?'background:#1f1d1a':'')+'" onclick="setCat(\'all\')">All '+ITEMS.length+'</button>';
  Object.keys(cc).sort().forEach(function(k){var on=fCat===k;h+='<button class="pill'+(on?' on':'')+'" style="'+(on?'background:'+col(k):'border-color:'+col(k)+'66')+'" onclick="setCat(\''+k+'\')">'+esc(k)+' '+cc[k]+'</button>';});
  document.getElementById("cats").innerHTML=h;
  var uc={act:0,deep:0,watch:0};ITEMS.forEach(function(i){uc[i.urgency]++;});
  var u='<button class="pill'+(fUrg==="all"?' on':'')+'" style="'+(fUrg==="all"?'background:#1f1d1a':'')+'" onclick="setUrg(\'all\')">All</button>';
  ["act","deep","watch"].forEach(function(k){var on=fUrg===k;u+='<button class="pill'+(on?' on':'')+'" style="'+(on?'background:#555':'')+'" onclick="setUrg(\''+k+'\')">'+UL[k]+' '+uc[k]+'</button>';});
  document.getElementById("urgs").innerHTML=u;
}
function setCat(c){fCat=c;fSrc=null;render(false);}
function setUrg(u){fUrg=u;fSrc=null;render(false);}
function clearSrc(){fSrc=null;render(false);}
function filterBySrc(name){fSrc=name;fCat="all";fUrg="all";render(true);window.scrollTo(0,0);}
function init(){
  document.getElementById("sub").textContent=META.date+" · "+META.time+" · "+ITEMS.length+" items · "+META.emailsRead+"/"+META.emailsInWindow+" emails read";
  var r='<p><b>Window:</b> '+esc(META.windowStart)+' to '+esc(META.windowEnd)+'. Emails outside this window were not processed.</p>';
  r+='<p><b>Totals:</b> '+META.emailsInWindow+' emails in window · '+META.emailsRead+' read · '+META.itemsExtracted+' items extracted · '+META.includedSources.length+' sources</p>';
  r+='<p><b>Included sources</b> (click to filter):</p><ul>';
  META.includedSources.forEach(function(s,ix){r+='<li><span class="src" data-ix="'+ix+'">'+esc(s.name)+'</span> — '+s.items+'</li>';});
  r+='</ul><p><b>Skipped:</b></p><ul>';
  META.skippedSources.forEach(function(s){r+='<li>'+esc(s.name)+' — '+esc(s.reason)+'</li>';});
  r+='</ul>';
  var rb=document.getElementById("repbody");rb.innerHTML=r;
  rb.querySelectorAll(".src[data-ix]").forEach(function(el){el.addEventListener("click",function(){filterBySrc(META.includedSources[+el.getAttribute("data-ix")].name);});});
  render(false);
}
init();
