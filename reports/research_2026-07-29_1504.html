const ITEMS = [{"id": 1, "cat": "macro", "urgency": "act", "source": "Bespoke Investment Group", "title": "SK Hynix craters 10% in Seoul, its US ADR shrugs off 1%", "idea": "Kospi fell as much as 13% intraday before closing -6%, with SK Hynix down ~10% overnight in Seoul on weaker-than-expected results — yet the US-listed ADR is down just 1% this morning. Futures still price a 36% chance of a Fed hike today despite last month's headline CPI printing negative.", "angle": "The Seoul/NY pricing gap in the same company is a pure liquidity/leverage story, not a fresh fundamentals repricing — worth watching whether it closes by the US open.", "tweetA": "SK Hynix is down 10% in Seoul and down 1% in its US ADR. Same earnings, same company, two different markets pricing two different stories. One of them is wrong.", "tweetB": "Fed futures still price 36% odds of a hike today with headline CPI negative last month. Someone is going to be very surprised at 2pm.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bespokeinvest.substack.com/p/two-indices-diverge-morning-market"}, {"id": 2, "cat": "crypto", "urgency": "deep", "source": "Adler's Crypto Insights", "title": "Bitcoin framework spits out \"reduced exposure, entry blocked\" while structure stays bullish", "idea": "Adler's 3-layer decision stack (structure / tactical / trigger) resolves ~20 conflicting BTC signals through hierarchy and veto, not averaging. As of July 29 the verdict is “reduced target exposure, entry blocked,” even though the cyclical structure layer remains constructive.", "angle": "A disciplined framework producing a bearish-tactical / bullish-structural split is a useful contrarian gut-check against emotional entries right after a selloff.", "tweetA": "Bitcoin's structure says bull market. Bitcoin's tactical layer says pressure. Averaging those two gives you nothing. The right answer is neither — it's “reduced exposure, entry blocked.”", "tweetB": "Most crypto \"analysis\" is twenty indicators listed until half are bullish and half are bearish, then a shrug: \"mixed.\" That's not analysis. That's an author refusing to have a view.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://adlerscryptoinsights.substack.com/p/decision-architecture-for-bitcoin-660"}, {"id": 3, "cat": "macro", "urgency": "act", "source": "Mando Minutes", "title": "US tariff revenue just went negative for the first time ever", "idea": "Per Barchart, US tariff revenue turned negative for the first time on record, even as tariff policy is used as both a trade-leverage signal and a fiscal revenue source in the current administration's framing.", "angle": "If tariff receipts are now a net drag rather than an inflow, that quietly undercuts one leg of the fiscal narrative behind the trade stance — worth checking against Treasury data directly.", "tweetA": "Tariff revenue just went negative for the first time ever recorded. The policy sold as “they pay us” just started paying out.", "tweetB": "Everyone's watching the Fed today. Nobody's watching that US tariff revenue just flipped negative for the first time in history. That's the more interesting chart.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://x.com/Barchart/status/2082338540680097943"}, {"id": 4, "cat": "positioning", "urgency": "act", "source": "Mando Minutes", "title": "Hedge funds just had their worst day since the Covid crash", "idea": "Per Zerohedge, hedge funds recorded their worst single day since the Covid crash this week, and July is on pace to be the worst month for momentum strategies excluding Covid — both stats point to a violent unwind in crowded positioning, not a fundamentals story.", "angle": "Momentum crashes this size are historically the setup for forced deleveraging that outlasts the initial catalyst (SK Hynix) — watch whether it stays contained to Korea/semis or spreads.", "tweetA": "Worst hedge fund day since Covid. Worst month for momentum since Covid, ex-Covid. Two “worst since 2020” stats in the same week and everyone's calling it a rotation.", "tweetB": "Momentum crashes don't stay contained to the sector that triggered them. They're a leverage problem wearing a sector costume. Watch what gets sold next, not what already got sold.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://x.com/zerohedge/status/2082264620174098676"}, {"id": 5, "cat": "science", "urgency": "watch", "source": "Mando Minutes", "title": "Google just dissolved AlphaFold as a standalone team", "idea": "DeepMind folded its AlphaFold team into the Gemini org — the protein-folding project whose creators won a Nobel Prize is being absorbed into the general-purpose model effort rather than run as a dedicated scientific unit.", "angle": "A tell on where Google thinks frontier value sits: general multimodal reasoning models eating purpose-built scientific tools, not the reverse.", "tweetA": "AlphaFold won a Nobel Prize. A short while later it's an org-chart line item inside Gemini. That's not a demotion — it's Google betting general models will out-science the specialist ones.", "tweetB": "If a Nobel-winning, purpose-built scientific model gets absorbed into a general chatbot’s org, what does that say about every \"vertical AI\" startup pitching a narrower version of the same idea?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://x.com/ChrisGPT/status/2082331070389698878"}, {"id": 6, "cat": "geopolitics", "urgency": "act", "source": "Mando Minutes", "title": "The US just banned Chinese humanoid robot imports", "idea": "The US moved to ban imports of Chinese humanoid robots, extending the chip/EV-style trade-barrier playbook to a new hardware category just as Chinese firms have been closing the hardware gap with US robotics startups.", "angle": "\"Robots are the next chips\" just moved from rhetoric to policy — worth tracking read-through to US humanoid names and Chinese robotics IPO pipelines.", "tweetA": "Solar panels, EVs, chips, and now humanoid robots. The US has a template for this fight and it just got applied to robotics. China's hardware lead in humanoids just hit a tariff wall.", "tweetB": "Every time the US bans a Chinese hardware category, the domestic version gets a multi-year subsidized runway. Watch what happens to US humanoid robotics valuations next.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://x.com/Cointelegraph/status/2082295208822125044"}, {"id": 7, "cat": "macro", "urgency": "act", "source": "Phil Dauber / Two Planets", "title": "One number — the 5Y real yield breaking 2% — explains six unrelated moves on the tape", "idea": "The 5Y real yield broke above 2.00% (2.1957%) for the first time since December 2024, and the 30Y real is pressing 3%. Dauber's thesis: this single move is a “duration purge” — everything priced on long-dated cash flows (semis, gold, 30Y bonds, momentum, high-multiple software) is being sold, while everything priced on near-term cash flows (healthcare, staples, insurers, banks) is being bought. He says he's wrong if the 5Y real yield closes back under 2.00%.", "angle": "Reframes today's “rotation out of AI into value” as a rates story, not a sector story — the tell to watch is XLV vs XLK and the 5Y real yield print, not the S&P headline.", "tweetA": "5Y real yield breaks 2% and suddenly gold is down, semis are down, 30-year bonds are down, and healthcare is at a 4.5-year relative high. That's not six trades. That's one trade wearing six costumes.", "tweetB": "Everyone's calling this a rotation into value. But industrials and utilities — the actual rate-sensitive “value” trade — both lagged on the day rates fell hardest. The real trade is short duration, not “value vs growth.”", "charts": {"count": 1, "hot": true, "desc": "NASA's new 3D gravity-field (geoid) model of Earth used as the opening metaphor for market 'lumps' beneath a smooth index average, plus embedded real-yield and sector-performance charts"}, "link": "https://phildauber.substack.com/p/two-planets"}, {"id": 8, "cat": "credit", "urgency": "watch", "source": "Phil Dauber / Two Planets", "title": "$8tn in privately-held Treasuries roll over in the next year — that number was $2tn in 2010", "idea": "More than $8 trillion of privately held marketable Treasury debt matures within the next twelve months, up from roughly $2tn in 2010 and roughly $4tn in 2020 — a figure Dauber calls having “gone vertical,” citing the FT / Treasury Bulletin. Every basis point on the front end now lands as a real bill inside the year.", "angle": "The structural reason the Treasury needs lower rates regardless of what the inflation data says — a live tension against an oil-driven inflation shock that could force the Fed the other way.", "tweetA": "$8 trillion of US debt refinances in the next 12 months. That number was $2 trillion in 2010. Every 25bp the Fed holds instead of cuts is now a real fiscal cost inside this calendar year.", "tweetB": "The Fed's inflation mandate and the Treasury's funding math are now pointing in opposite directions at the same meeting. That tension doesn't resolve today — it just gets carried forward, bigger each quarter.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://phildauber.substack.com/p/two-planets"}, {"id": 9, "cat": "AI/infra", "urgency": "deep", "source": "Phil Dauber / Two Planets", "title": "Apple passed Nvidia to become the most valuable company on earth — by refusing to spend", "idea": "Apple touched a $5.036tn intraday market cap and passed Nvidia as the world's most valuable public company. Apple's FY2025 capex was $12.7bn; Alphabet plans ~$205bn this year, Microsoft ~$190bn, Amazon ~$145bn — roughly 16x Apple's spend. The market just crowned the hyperscaler that refused to build the AI infrastructure everyone else is funding.", "angle": "The clearest single data point yet for a “capex fatigue” thesis: if the market rewards the company that isn't spending on AI buildout, that's a verdict on ROI patience, not on AI itself.", "tweetA": "Apple's FY25 capex: $12.7bn. Alphabet's this year: ~$205bn. Sixteen times the spend, and the market just made the company that refused the most valuable on earth.", "tweetB": "The AI capex race was supposed to be won by whoever built the most. This week the market crowned the company that built the least. That's not a verdict on AI — it's a verdict on how long investors will fund a payoff that lands after 2030.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://phildauber.substack.com/p/two-planets"}, {"id": 10, "cat": "AI/infra", "urgency": "act", "source": "Phil Dauber / Two Planets", "title": "SK Hynix grew operating profit 6.5x YoY at 76% margins — and got sold anyway", "idea": "SK Hynix posted operating profit up 6.5x year-on-year at a 76% operating margin, with first-half revenue over 100 trillion won for the first time in company history — yet missed consensus by roughly 5.5% and guided capex up 50% to 45 trillion won (~$31bn). Dauber's read: “you are not looking at an earnings problem. You are looking at a discount rate problem.”", "angle": "The cleanest data point yet that AI-adjacent names are being priced off the discount rate, not fundamentals — a 5.5% miss on a 6.5x profit beat erasing half the stock's value in weeks is a valuation-mechanics story.", "tweetA": "SK Hynix: profit up 6.5x, margins at 76%, first-half revenue over 100 trillion won for the first time ever. Stock got cut in half from its peak anyway. When a beat this big gets sold this hard, the problem isn't the business.", "tweetB": "Raise the 5-year real yield 20bps and the terminal value of an AI capex story moves more than any single quarter's beat can offset. SK Hynix just proved it in real time.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://phildauber.substack.com/p/two-planets"}, {"id": 11, "cat": "gold", "urgency": "deep", "source": "Phil Dauber / Two Planets", "title": "Gold and oil just decoupled harder than they have in 35 years", "idea": "Goldman's 3-month rolling correlation between gold and Brent hit -0.45 — the most negative reading in a series running back to 1991, versus a 35-year average of +0.09. Dauber's read: an inflation shock lifts both gold and oil together; a real-rate shock lifts oil through the supply channel while destroying gold, a zero-coupon asset with nothing to discount against but the real rate.", "angle": "The correlation break is itself the tell that this is a rates story, not an inflation story — worth watching whether gold keeps decoupling from oil as the real-yield move continues.", "tweetA": "Gold and oil are supposed to move together — both are the “money is losing value” trade. Right now their correlation is the most negative it's been in 35 years. That's not diversification. That's the real yield doing the sorting.", "tweetB": "Missiles flew, oil ripped 5%+, and gold sat 28% off its high, below both its 50-day and 200-day. If this were an inflation shock, gold would be flying too. It isn't — which tells you what's actually driving this.", "charts": {"count": 1, "hot": true, "desc": "Goldman's 3-month rolling gold-Brent correlation at -0.45 vs a 35-year average of +0.09 — chart-native and highly tweetable on its own"}, "link": "https://phildauber.substack.com/p/two-planets"}, {"id": 12, "cat": "credit", "urgency": "watch", "source": "Phil Dauber / Two Planets", "title": "Credit is \"quietly leaking\" while every desk note calls it benign", "idea": "ICE BofA high-yield OAS moved to 281bp on July 27 from 268bp on the 22nd — 13bp wider in three sessions and the widest print of the month — while investment grade widened from 78bp to 81bp. Dauber computed the percentile himself: 281bp sits at the 21st percentile of the last three years of daily history, i.e. spreads have been tighter than this about 80% of the time.", "angle": "Every note calling credit “benign and stable” is reading the level, not the direction — 13bp in three sessions is a real move that upgrades from noise to signal if it keeps widening alongside the equity rotation.", "tweetA": "HY spreads: 13bp wider in three sessions, the widest print of the month, sitting at the 21st percentile of three years of history. Every note on my desk called it \"benign.\" Level and direction are different questions.", "tweetB": "Nobody is stressed about credit right now. That's usually when credit is worth watching most, because the spread move shows up before the narrative does.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://phildauber.substack.com/p/two-planets"}, {"id": 13, "cat": "geopolitics", "urgency": "deep", "source": "Phil Dauber / Two Planets", "title": "A dead senator's documentary footage just complicated every Iran de-escalation trade", "idea": "Late senator Lindsey Graham died July 11; a documentary shot since 2023 (working title “Lindsey's Game”) reportedly shows him taking personal credit for pushing the US into the Iran conflict, comparing Trump/Netanyahu to Roosevelt/Churchill, and offering to lobby for extending the campaign to Lebanon. Every de-escalation oil trade this year has assumed the war is an instrument being negotiated, not an end in itself — the footage undercuts that assumption for at least part of the coalition that built the war.", "angle": "If war-as-objective rather than war-as-leverage is even partially right, that changes the base rate for how often oil 'peace rallies' fade versus hold — worth pricing wider tail risk into energy longs.", "tweetA": "Every oil de-escalation trade this year assumes the Iran war is a negotiation. Leaked documentary footage of a since-deceased senator taking personal credit for starting it — and pushing to extend it to Lebanon — says otherwise for at least part of the coalition that built it.", "tweetB": "Brent fell 16% in three days on ceasefire hope, then ripped back on fresh strikes. If the war was never meant to end, that pattern isn't noise — it's the trade.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://phildauber.substack.com/p/two-planets"}, {"id": 14, "cat": "positioning", "urgency": "deep", "source": "All Star Charts", "title": "The 'average stock' chart nobody's tweeting about right now", "idea": "The equal-weight S&P 500 ($RSP) hit a fresh all-time high even as semiconductors bled and dragged the Nasdaq 100 lower — evidence the market-cap-weighted index's weakness is concentrated in a handful of mega-cap tech/semis names, not broad-based.", "angle": "A useful counter to every “market is breaking down” headline built off Nasdaq/semis price action alone — the breadth data says something different, and the divergence itself is the story.", "tweetA": "The Nasdaq is down on semis. The equal-weight S&P just hit an all-time high. Same market, two headlines. Pick the one that matches what your book actually needs to know.", "tweetB": "“The market is weak” and “leadership is rotating” produce the exact same cap-weighted index print. The equal-weight chart is how you tell them apart.", "charts": {"count": 1, "hot": false, "desc": "$RSP equal-weight S&P 500 chart at a fresh all-time high, embedded in email"}, "link": "https://www.allstarcharts.com/2026-07-28/semis-are-sitting-edge-cliff"}, {"id": 15, "cat": "regulation", "urgency": "deep", "source": "Unchained Crypto", "title": "Binance changed how it responds to police — and investigators on two continents are stuck", "idea": "Since April 2025, Binance has been routing foreign law-enforcement requests through the UAE and formal treaty channels instead of directly, per NYT reporting. European officers say they now only get fast responses on CSAM / terrorism / imminent-threat cases — everything else goes through Abu Dhabi's regulated entities or slow Mutual Legal Assistance Treaties.", "angle": "A structural, deliberate compliance shift — not a one-off dispute — that gives Binance a jurisdictional buffer against most law enforcement requests; worth watching for EU/UK regulatory blowback.", "tweetA": "Binance didn't stop cooperating with police. It just rerouted almost every request through Abu Dhabi and a treaty process that takes months instead of days. That's not compliance — that's jurisdiction shopping, quietly operationalized.", "tweetB": "If you want to know where an exchange thinks its regulatory center of gravity actually is, don't read the press release — read where it routes law enforcement requests. Binance just told you: the UAE.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/binance-routes-foreign-law-enforcement-requests-through-the-uae-frustrating-investigators-nyt-reports/"}, {"id": 16, "cat": "crypto", "urgency": "deep", "source": "Unchained Crypto", "title": "Crypto hacks hit a record 212 incidents in H1 2026 — and attackers stopped breaking code", "idea": "Crypto lost about $1.1bn across 212 verified exploits in H1 2026 (Blockaid) — the highest incident count on record, roughly 3.4x all of 2025's count. Operational attacks (stolen keys, credentials, signer compromises) drove 74% of dollar losses even though smart-contract bugs were more common by count. North Korea-linked actors drove ~55% of losses; the KelpDAO and Drift compromises alone totaled ~$577M.", "angle": "The attack surface moved from code to people/infrastructure — smart contract audits solve yesterday's problem while key-management and signer security are where the money is actually leaking.", "tweetA": "Smart contract bugs are still the most common crypto exploit by count. They're not where the money goes. 74% of stolen dollars this year came from stolen keys and compromised signers, not broken code.", "tweetB": "North Korea drove roughly 55% of crypto hack losses in H1 2026. Two incidents — KelpDAO and Drift — accounted for over half a billion dollars alone. This isn't hacking anymore, it's a state revenue line.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/crypto-lost-1-1-billion-across-212-exploits-in-h1-2026-a-record-incident-count-blockaid-says/"}, {"id": 17, "cat": "AI/infra", "urgency": "act", "source": "The Dark Side of the Boom", "title": "Korea just gave the AI boom its first real stress test — and it failed", "idea": "SK Hynix lost more than half its value from its June peak; the KOSPI fell as much as 13% intraday Wednesday before closing ~6% lower, down ~15% over three sessions. The author argues what failed wasn't the technology or HBM demand — it was market structure: leveraged retail products, late fund inflows, and extreme index concentration turning an earnings disappointment into a self-reinforcing liquidation. Warning: once prime brokers tighten collateral against concentrated AI exposure, a valuation correction can become a broader balance-sheet contraction.", "angle": "The transmission channel to watch for contagion beyond Korea is leverage + concentration + prime-broker collateral — a market-plumbing risk, which spreads faster than a fundamentals risk.", "tweetA": "SK Hynix round-tripped a full year's gain in six weeks. Nothing about HBM demand broke. What broke was leverage stacked on the most concentrated index bet in Asia. That's a plumbing failure, not a demand failure — and plumbing failures spread.", "tweetB": "Watch what prime brokers do next, not what SK Hynix does next. If they start tightening collateral on concentrated AI exposure anywhere else, Korea was the preview, not the event.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-boom-just-failed-its-first"}, {"id": 18, "cat": "science", "urgency": "act", "source": "Lucky Trader / Morning Minute", "title": "An unreleased Claude model just broke a NIST post-quantum encryption finalist", "idea": "Anthropic said an unreleased 'Claude Mythos Preview' model found two previously unknown attacks on crypto algorithms, including one against HAWK — a lattice-based digital signature scheme that had advanced to the third round of NIST's post-quantum standardization and was the last lattice-based candidate standing. The attack found a symmetry no human had used, cutting the cost of stealing HAWK's smallest key from 2^64 operations to 2^38 — roughly 67 million times less work. Patching requires roughly doubling key sizes, which “eliminates many of the reasons” HAWK was attractive.", "angle": "Frontier models are now doing novel cryptanalysis, not just pattern-matching known attacks — the entire post-quantum migration effort (BlackRock-Coinbase-Strategy consortium, Vitalik's roadmap, Zcash/NEAR) assumes the replacement schemes are sound, and this is the first public case of an AI finding a hole in one before deployment.", "tweetA": "An AI model just cut the cost of breaking a NIST post-quantum finalist by 67 million times — before it ever shipped. The entire “post-quantum crypto is the safe migration” narrative assumes these schemes are sound. One unreleased Claude model just found out one wasn't.", "tweetB": "Everyone's post-quantum roadmap — BlackRock, Coinbase, Strategy, Vitalik, Zcash — assumes the new cryptography is safe because it resists quantum computers. Nobody priced in the new cryptography being vulnerable to the AI that's supposed to help build it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/claude-mythos-breaks-post-quantum"}, {"id": 19, "cat": "AI/infra", "urgency": "act", "source": "David Rosenberg", "title": "+557% earnings growth. -15% intraday. Same stock, same day.", "idea": "Rosenberg's framing of SK Hynix: the share price dove as much as 15% intraday despite year-on-year earnings growth of +557% and revenue growth of +257%, on renewed jitters about capex plans.", "angle": "The size of the gap between the growth rate and the price reaction is itself the cleanest single data point for how much was priced in.", "tweetA": "SK Hynix earnings grew 557% year-on-year. The stock fell 15% intraday. If you need one number to explain “priced for perfection,” that's it.", "tweetB": "A 557% earnings beat that gets sold isn't a valuation call anymore — it's a referendum on whether the market believes the growth rate itself is sustainable. That's a much scarier question for every other AI name still trading on a growth narrative.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.earlymorningwithdave.com/p/who-is-the-real-kevin-warsh-we-shall"}, {"id": 20, "cat": "macro", "urgency": "act", "source": "Peter Boockvar", "title": "The Fed's balance sheet just grew back to its biggest size since March 2025", "idea": "The Fed's balance sheet has increased all year and now sits at $6.7 trillion, the largest since March 2025 and up about $200bn from the December 2025 lows. Boockvar's read: Warsh doesn't need to hike today to tighten — simply stopping this quiet balance-sheet expansion would itself be a tightening move. Separately, TIPS breakevens (2s, 5s, 10s) are all sliding toward 2%, arguing against a hike, while PPI running 200bps over CPI signals wholesale cost pressure the TIPS market isn't capturing.", "angle": "\"Stop the quiet expansion\" is a lower-drama, higher-probability tightening lever than a headline rate hike — worth watching balance-sheet data alongside the FOMC statement, not just the missing dot plot.", "tweetA": "The Fed doesn't need to hike today to tighten. Its balance sheet just grew back to $6.7 trillion, the biggest since March 2025. “Stop quietly expanding” is a rate hike that doesn't show up in the headline.", "tweetB": "TIPS breakevens are sliding toward 2% across the curve, which argues for a hold. PPI running 200bps hot over CPI argues the opposite. The TIPS market and the wholesale cost data are telling two different stories, and only one of them is priced.", "charts": {"count": 1, "hot": false, "desc": "Inflation breakevens (2s/5s/10s) and Fed balance sheet charts embedded in email"}, "link": "https://peterboockvar.substack.com/p/if-kevin-warsh-is-still-watching"}, {"id": 21, "cat": "positioning", "urgency": "deep", "source": "Peter Boockvar", "title": "\"Sell semis, buy ketchup\" — and only 1 of 21 analysts has caught on", "idea": "Boockvar frames the current rotation as \"sell semi's, buy ketchup\" — consumer staples (Kraft Heinz, Coca-Cola) benefiting from the flow shift out of AI/semis. He flags Kraft Heinz specifically: still just 1 of 21 covering analysts rates it a buy, despite what he sees as a genuine bottoming in fundamentals, not just a flow rotation.", "angle": "A single-digit buy-rating count on a stock already leading its sector on a flow rotation is the kind of sell-side lag that tends to show up as alpha later.", "tweetA": "\"Sell semis, buy ketchup.\" Kraft Heinz still has 1 buy rating out of 21 analysts while the flow rotation is already showing up in the stock. Sell-side coverage is the most lagging indicator in markets.", "tweetB": "When the entire street is bearish on a name that's already inflecting on flows, that's not a reason to avoid it — that's the setup. Someone's going to be upgrading Kraft Heinz in Q4.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://peterboockvar.substack.com/p/if-kevin-warsh-is-still-watching"}, {"id": 22, "cat": "crypto", "urgency": "deep", "source": "Capital Wars", "title": "Global Liquidity peaked ten months ago — and it's the reason crypto has been dead money", "idea": "Global Liquidity in USD terms peaked at the end of Q3 2025 and has been slowing since, which the author argues explains crypto's poor 2026 performance. The relationship is cyclical — a rebound is 'certain' eventually, but likely still several months away. A basket of BTC/ETH/SOL (60/30/10) tracked against Global Liquidity lagged 13 weeks is the chart used to make the case.", "angle": "If the liquidity-lag framework holds, the actionable read isn't \"buy now,\" it's \"know the turn is coming and don't be surprised when it does.\"", "tweetA": "Global Liquidity peaked at the end of Q3 2025. Crypto's entire miserable 2026 traces back to that one turn, lagged about three months. The turn back up isn't here yet — but the framework says it's not optional either.", "tweetB": "Everyone wants to know \"when does crypto turn.\" Wrong question. The right one: when does Global Liquidity turn, plus a 13-week lag. That's the actual clock, and it isn't running yet.", "charts": {"count": 1, "hot": true, "desc": "BES$ crypto basket (60% BTC / 30% ETH / 10% SOL) six-week log change vs Global Liquidity lagged 13 weeks — a genuinely tweetable single chart"}, "link": "https://capitalwars.substack.com/p/global-liquidity-and-cryptocurrencies"}, {"id": 23, "cat": "culture", "urgency": "watch", "source": "HRMT / Hermit Research", "title": "He returned £1.6m in client capital and personally lost €135k keeping it clean", "idea": "The author of Hermit Research is resetting his fund structure after \"months of wrestling with compliance hurdles, institutional friction, and open-ended overhead\" — he returned client capital entirely intact and profitable, while personally absorbing roughly €135,000 in costs over ~2 years, including €1m of his own capital locked up as a guarantee that a bank charged fees against while he couldn't even park it in a money market fund.", "angle": "A rare, candid inside look at how much friction the 'professionalize into a public parent company' path actually costs a small manager — a cautionary tale for anyone weighing scaling a fund institutionally versus staying lean.", "tweetA": "A fund manager returned £1.6m to clients fully intact and profitable — and personally ate €135,000 doing it, including a €1m guarantee a bank charged him fees on while he wasn't even allowed to earn interest on it. That's the real cost of “professionalizing.”", "tweetB": "Every AUM fee near 0%, every 'trust the custodian' assumption, every over-engineered legal structure — he lists the ten mistakes that cost him personally. Required reading for any emerging manager copying the institutional model.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.hermitresearch.com/p/july-2026-hrmt"}, {"id": 24, "cat": "macro", "urgency": "act", "source": "The Bond Beat", "title": "The man who invented the market's bond fear gauge wants a 50bp hike today", "idea": "Harley Bassman, inventor of the MOVE index, argues the Fed should hike 50bps today — not on economic grounds but on market psychology and politics, per the Bond Beat's summary. Meanwhile Polymarket prices 79% odds of a hold versus CME FedWatch at 68.5% — an 11-point gap between the two venues going into the decision.", "angle": "A hawkish call from someone with zero economic justification, purely on politics/psychology, is worth weighing against the prediction-market spread as a volatility setup regardless of the actual decision.", "tweetA": "The guy who invented the bond market's fear index wants the Fed to hike 50bps today. His reasoning: not economics, just psychology and politics. That's either refreshingly honest or the entire game in one sentence.", "tweetB": "Polymarket: 79% hold. CME FedWatch: 68.5% hold. An 11-point gap between two venues going into a Fed decision with no dot plot and no forward guidance. The market doesn't even agree on the base case.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thebondbeat.substack.com/p/while-we-slept-usts-inch-higher-into"}, {"id": 25, "cat": "macro", "urgency": "deep", "source": "The Bond Beat", "title": "Australia just went from 'hike is coming' to a coin flip in two days", "idea": "Australian front-end yields fell 8-9bps after Q2 inflation data showed softening; traders slashed odds of another RBA hike to 50% from 90% before the report, with expectations tempering further after Governor Bullock's Tuesday speech.", "angle": "A 40-point swing in hike odds in 48 hours is a large repricing for a G10 central bank — a read-through for how fast other developed-market central banks could reprice on their own soft prints.", "tweetA": "RBA hike odds: 90% to 50% in two days on one inflation print. If you think central bank forward guidance is stable right now, Australia just showed you it isn't, anywhere.", "tweetB": "Every developed-market central bank is one soft print away from a 40-point repricing in hike odds. The Fed isn't special today — it's just the one everyone's watching.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thebondbeat.substack.com/p/while-we-slept-usts-inch-higher-into"}, {"id": 26, "cat": "labor", "urgency": "deep", "source": "The Bond Beat", "title": "The 'how do things feel right now' survey just hit a 5-year low", "idea": "Per Zerohedge (via Bond Beat), the Conference Board survey's 'Present Situation' component logged its weakest reading in over five years, even as US home prices unexpectedly jumped in May (Chicago leading, Vegas lagging) — a stagflation-flavored data mismatch landing the same morning as the FOMC decision.", "angle": "'Present situation' surveys are typically less noisy than forward-looking expectations components — a 5-year-low here alongside rising home prices supports a stagflation read over a clean growth-scare or clean-inflation story.", "tweetA": "Home prices unexpectedly jumped in May. The 'how do things feel right now' consumer survey just hit its weakest level in five years. That combination has a name, and it's not 'soft landing.'", "tweetB": "Everyone's framing today as growth-scare-vs-inflation-scare, pick one. The data landing hours before the Fed decision doesn't let you pick. Home prices up, present-situation sentiment at a 5-year low — that's both at once.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thebondbeat.substack.com/p/while-we-slept-usts-inch-higher-into"}, {"id": 27, "cat": "labor", "urgency": "deep", "source": "Young and Calculated", "title": "Jane Street's revenue per employee is 9x Goldman Sachs's", "idea": "Jane Street generated $39.6bn in net trading revenue in 2025 with ~3,500 employees — over $11m in revenue per head. Goldman generated $58.28bn in net revenue with 47,400 employees — about $1.23m per head, roughly a 9:1 ratio. Jane Street paid out $9.38bn in total 2025 comp, averaging $2.68m per employee, about 7x Goldman's average — even though Goldman pays a larger share of revenue (32% vs Jane Street's 24%).", "angle": "The headline 'Jane Street pays more' story misses the sharper point: Goldman is the more generous payer by percentage of revenue — it just has 13x the headcount diluting a much thinner per-head revenue base. The real story is capital structure, not generosity.", "tweetA": "Jane Street pays 7x Goldman's average comp. Less discussed: Goldman actually gives employees a bigger cut of revenue — 32% vs Jane Street's 24%. Jane Street isn't more generous. It just generates 9x the revenue per head to be generous with.", "tweetB": "Jane Street's members' equity is up almost 2,000% since 2016, to $45bn, deployed without answering to outside investors. That's the real edge — not talent density, capital structure. A bank's balance sheet is regulated. A partnership's is not.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://youngandcalculated.substack.com/p/the-10m-analyst-how-a-26-year-old"}, {"id": 28, "cat": "regulation", "urgency": "deep", "source": "Big Moves", "title": "A next-gen Army helicopter program just ran out of money mid-year", "idea": "Textron fell 6.4% after Bell's MV-75 Cheyenne program exhausted its available fiscal-2026 funding, with additional funding now pending congressional approval — despite Bell's overall military revenue rising and Textron reiterating full-year guidance.", "angle": "A flagship next-gen rotorcraft program hitting a funding wall mid-fiscal-year, rather than at budget renewal, is a tell on how tight defense appropriations have gotten — worth watching whether this becomes a pattern across other FLRAA-adjacent programs.", "tweetA": "Textron's next-gen Army helicopter program just ran out of its 2026 funding — mid-year, not at budget renewal. That's not a program problem. That's a defense appropriations problem showing up early.", "tweetB": "If a marquee next-gen rotorcraft program can hit a funding wall before the fiscal year even ends, every other defense primer's 'on track' guidance deserves a second look at the appropriations calendar, not just the backlog number.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-july-28-2026"}, {"id": 29, "cat": "geopolitics", "urgency": "watch", "source": "Big Moves", "title": "Carrier raised guidance and still posted a margin decline, with China sales down 14%", "idea": "Carrier Global raised its full-year sales, operating-profit and EPS outlook, but Q2 adjusted operating margin fell 190bps, adjusted EPS fell 7% to $0.86, and China sales fell 14% amid weaker demand and pricing — even as the company cited strong data-center order growth.", "angle": "A US industrial simultaneously raising guidance and reporting a 14% China sales decline plus margin compression is a clean microcosm of 'data-center demand masking China weakness' worth checking across other industrials with China exposure.", "tweetA": "Carrier raised full-year guidance. Its China sales fell 14% and margins compressed 190bps in the same quarter. Data-center orders are covering for a China business that's shrinking — that trade-off is showing up across industrials, not just here.", "tweetB": "'Raised guidance' and 'China sales down 14%' in the same earnings release is becoming a pattern, not a one-off. AI infrastructure demand is quietly subsidizing a China slowdown that isn't getting its own headline.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-july-28-2026"}, {"id": 30, "cat": "regulation", "urgency": "act", "source": "Salazar Slytherin / Crypto News", "title": "CME just sued its own regulator", "idea": "CME Group sued the CFTC over its approval of onchain perpetual futures, arguing the products are swaps, not futures, and were approved without proper rulemaking — a direct legal challenge to the regulator that oversees CME itself.", "angle": "An incumbent exchange suing its regulator to block a competing product category is a rare, aggressive move — a bellwether for how contested onchain derivatives market structure will be over the next year.", "tweetA": "CME just sued the CFTC — its own regulator — to block onchain perpetual futures. When the incumbent exchange sues the umpire instead of competing on the field, that tells you who's actually winning market share.", "tweetB": "\"Swaps, not futures\" is a rules-lawyering argument dressed as a legal filing. CME isn't fighting a classification question. It's fighting for the toll booth on a product category it doesn't control.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/crypto-news-july-29-2026"}, {"id": 31, "cat": "tech", "urgency": "watch", "source": "Salazar Slytherin / Crypto News", "title": "Confidential blockchain transactions just got 5,000x faster in four years", "idea": "Zama hit 1,000 confidential transfers per second on GPUs for fully homomorphic encryption (FHE) smart contracts, up from 0.2 transactions per second in 2022 — a roughly 5,000x speedup — cutting the cost of an ERC-7984 confidential transaction to about $0.000004.", "angle": "FHE has been the 'too slow to matter' technology in crypto privacy for years — a 5,000x throughput gain landing at sub-thousandth-of-a-cent transaction cost is the kind of curve-bend that makes previously theoretical privacy tech commercially viable.", "tweetA": "FHE went from 0.2 transactions per second to 1,000 in four years. That's not incremental progress, that's a technology crossing from 'interesting paper' to 'usable infrastructure' in real time.", "tweetB": "Confidential smart contract transactions now cost $0.000004. The privacy tech everyone wrote off as too slow for production just quietly became cheaper than almost anything else onchain.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/crypto-news-july-29-2026"}, {"id": 32, "cat": "AI/infra", "urgency": "watch", "source": "Salazar Slytherin / AI News", "title": "AMD just locked up 500MW of US data-center capacity from a former Bitcoin miner", "idea": "Core Scientific and AMD struck a deal giving AMD over 500MW of US data-center capacity starting in 2027 — another sign of ex-crypto-mining infrastructure being repurposed for AI compute, with AMD building dedicated capacity independent of Nvidia-aligned hyperscalers.", "angle": "Crypto-mining-turned-AI-datacenter deals are becoming a recurring capacity-sourcing strategy for chipmakers that don't want to wait in the hyperscaler queue — worth tracking as a distinct AI infra supply channel.", "tweetA": "AMD just locked up 500MW of AI data-center capacity from a former Bitcoin miner. The crypto-mining-to-AI-datacenter pipeline isn't a one-off anymore — it's becoming a standard sourcing channel for chipmakers who don't want to wait behind the hyperscalers.", "tweetB": "Every idle megawatt of Bitcoin mining capacity built during the last crypto cycle is now a bidding-war target for AI compute. That's the most direct link between the two markets right now, and it's not priced into either.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/ai-news-july-29-2026"}, {"id": 33, "cat": "venture", "urgency": "deep", "source": "The Founder Corner", "title": "You have 3 minutes and 44 seconds to get a term sheet", "idea": "DocSend's tracked data across millions of investor sessions: the average investor spends 3 minutes 44 seconds on a pitch deck before deciding whether to keep going, and only 58% of decks get read to completion. The author's framework: partners don't read decks fresh, they pattern-match against the last 200 they've seen — meaning the deck's job is to survive a checklist, not to be original.", "angle": "The 'order is part of the score' insight — a well-scored slide in the wrong sequence still fails — is sharper and more actionable than the usual 'tell a good story' pitch deck advice.", "tweetA": "Average VC spends 3 minutes 44 seconds on your deck. 42% never make it to the last slide. You're not being read. You're being pattern-matched against the last 200 decks that partner has seen.", "tweetB": "A perfect traction slide in the wrong position in the deck scores worse than a mediocre one in the right position, because each slide answers the question the previous one raised. Order beats polish.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/the-pitch-deck-playbook"}, {"id": 34, "cat": "geopolitics", "urgency": "act", "source": "The Dark Side of the Boom", "title": "China's biggest chip IPO ever just surged 466% on day one", "idea": "ChangXin Memory Technologies (CXMT) raised $8.6bn in its listing and surged 466% on its first trading day, creating a $484bn semiconductor company that Goldman's Kinger Lau frames as a 'market rebalancing event,' not just a hot IPO — index inclusion could generate $12-17bn of cumulative passive buying by late 2027, forcing existing STAR50 constituents to surrender index weight.", "angle": "Beijing's clearest signal yet that it will finance strategic semiconductor capacity through domestic capital markets rather than state banks alone — worth tracking STAR50 rebalancing mechanics and which existing constituents lose the most weight.", "tweetA": "China's biggest chip IPO ever: $8.6bn raised, +466% on day one, instantly a $484bn company. Index inclusion alone could force $12-17bn of passive buying through 2027. This isn't a hot IPO story. It's Beijing rewriting an index by decree.", "tweetB": "Every STAR50 constituent just got a forced seller they didn't choose: the index itself, reallocating weight to CXMT. Watch which existing names get starved of passive flow over the next 18 months — that's the second-order trade here.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/chinas-biggest-chip-ipo-is-becoming"}];

    b.classList.toggle('active', isActive);
    if(isActive && c !== 'all'){ b.style.background = catColor(c); b.style.borderColor = catColor(c); }
    else if(!isActive){ b.style.background = '#fff'; b.style.borderColor = '#e4e0da'; b.style.color = '#1a1a1a'; }
    else { b.style.background = '#1a1a1a'; b.style.borderColor = '#1a1a1a'; }
  });
  render();
}
function setUrg(u){
  activeUrg = u; activeSrc = null;
  document.querySelectorAll('#urgFilter .pill').forEach(function(b){
    var isActive = b.getAttribute('data-urg') === u;
    b.classList.toggle('active', isActive);
    b.style.background = isActive ? '#1a1a1a' : '#fff';
    b.style.borderColor = isActive ? '#1a1a1a' : '#e4e0da';
    b.style.color = isActive ? '#fff' : '#1a1a1a';
  });
  render();
}
function filterBySrc(name){
  activeCat = 'all'; activeUrg = 'all'; activeSrc = name;
  document.querySelectorAll('#catFilter .pill, #urgFilter .pill').forEach(function(b){
    var isAll = (b.getAttribute('data-cat') === 'all') || (b.getAttribute('data-urg') === 'all');
    b.classList.toggle('active', isAll);
    b.style.background = isAll ? '#1a1a1a' : '#fff';
    b.style.borderColor = isAll ? '#1a1a1a' : '#e4e0da';
    b.style.color = isAll ? '#fff' : '#1a1a1a';
  });
  render();
  document.getElementById('cards').scrollIntoView({behavior:'smooth'});
}

function render(){
  const container = document.getElementById('cards');
  let list = ITEMS;
  if(activeSrc){ list = list.filter(function(it){ return it.source.indexOf(activeSrc) !== -1; }); }
  if(activeCat !== 'all'){ list = list.filter(function(it){ return it.cat === activeCat; }); }
  if(activeUrg !== 'all'){ list = list.filter(function(it){ return it.urgency === activeUrg; }); }

  let html = '';
  list.forEach(function(it){
    const u = URG[it.urgency];
    const color = catColor(it.cat);
    const chartIcon = it.charts && it.charts.count > 0 ? (it.charts.hot ? '🔥' : '📊') : '';
    const isOpen = !!activeSrc;
    html += '<div class="card' + (isOpen ? ' open' : '') + '" id="card-' + it.id + '">';
    html += '<div class="card-h" onclick="toggleCard(' + it.id + ')">';
    html += '<span class="idx">' + String(it.id).padStart(2,'0') + '</span>';
    html += '<span class="urg">' + u.emoji + '</span>';
    html += '<span class="badge" style="background:' + color + '">' + it.source + '</span>';
    html += '<span class="cattag">' + it.cat + '</span>';
    if(chartIcon) html += '<span class="chartmark">' + chartIcon + '</span>';
    html += '<span class="card-title">' + escapeHtml(it.title) + '</span>';
    html += '</div>';
    html += '<div class="card-body">';
    html += '<div class="section-label">The Idea</div><div class="idea-txt">' + escapeHtml(it.idea) + '</div>';
    html += '<div class="section-label">My Angle</div><div class="angle-box" style="border-left-color:' + color + ';background:' + color + '14">' + escapeHtml(it.angle) + '</div>';
    html += '<div class="tweetrow">';
    html += '<div class="tweetbox a"><div class="lbl">TWEET A</div><p>' + escapeHtml(it.tweetA) + '</p><button class="copy-btn" onclick="copyTweet(' + it.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweetbox b"><div class="lbl">TWEET B</div><p>' + escapeHtml(it.tweetB) + '</p><button class="copy-btn" onclick="copyTweet(' + it.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    if(it.charts && (it.charts.count > 0 || it.charts.desc)){
      html += '<div class="chartbox' + (it.charts.hot ? ' hot' : '') + '">' + (it.charts.hot ? '🔥 CHART WORTH SAVING — ' : '📊 ') + escapeHtml(it.charts.desc || 'Chart embedded in email') + '</div>';
    }
    html += '<div class="linkrow"><a href="' + it.link + '" target="_blank" rel="noopener">↗ Read full article</a></div>';
    html += '</div></div>';
  });
  if(list.length === 0){ html = '<div style="padding:30px;text-align:center;color:#999;">No items match this filter.</div>'; }
  container.innerHTML = html;
}

function toggleCard(id){
  const el = document.getElementById('card-' + id);
  if(el) el.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function escapeHtml(s){
  if(!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildReport(){
  let html = '<h4>Time Window</h4>';
  html += '<div>' + META.windowStart + ' &rarr; ' + META.windowEnd + '</div>';
  html += '<div style="color:#888;margin-top:2px;">Emails outside this window were not processed.</div>';
  html += '<h4>Included Sources</h4>';
  META.includedSources.forEach(function(s){
    html += '<div class="srcline"><span class="sname" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span><span>' + s.count + ' item' + (s.count>1?'s':'') + '</span></div>';
  });
  html += '<h4>Skipped Sources</h4>';
  META.skippedSources.forEach(function(s){
    html += '<div class="skipline"><b>' + s.name + '</b> — ' + s.reason + '</div>';
  });
  html += '<div class="totals">Emails in window: ' + META.emailsInWindow + ' &nbsp;|&nbsp; Emails read: ' + META.emailsRead + ' &nbsp;|&nbsp; Items extracted: ' + META.itemsExtracted + '</div>';
  document.getElementById('reportBody').innerHTML = html;
}

buildHeader();
buildFilters();
render();
buildReport();
</script>
