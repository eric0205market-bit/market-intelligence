<script>
const ITEMS = [{"id": 1, "cat": "positioning", "urgency": "act", "source": "Macro Charts / Macro Charts", "title": "Tech just had its 2nd-worst week since COVID — and energy fell MORE than semis", "idea": "Tech had its 2nd worst week since COVID (worst was April 2025); semis their worst since April 2025; energy fell more than semis. Biggest gainers: precious metals, solar, China, airlines, medical devices, homebuilders. Author says last week's topping signals gave a timely warning.", "angle": "The winners list (metals, solar, China, airlines, homebuilders) is a rotation basket, not a flight to safety. Energy falling harder than semis breaks the 'oil hedges the AI unwind' idea.", "tweetA": "Energy fell more than semis. Gold and silver miners led. Airlines and homebuilders up. That's not a risk-off tape, it's a rotation out of the two most crowded trades at once. Where were you hedged?", "tweetB": "Second-worst tech week since COVID and the only thing worse was April 2025, which was a tariff shock. This time there's no single villain. That's what makes me nervous.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening (sector/industry weekly performance, top stock chart)"}, "link": "https://www.macrocharts.com/p/all-or-nothing"}, {"id": 2, "cat": "positioning", "urgency": "act", "source": "Macro Charts / Macro Charts", "title": "Breadth paradox: 41% of industries up, but 78% outperformed the index", "idea": "52% of S&P stocks advanced and 70% outperformed the index; 41% of industries advanced while 78% outperformed. Index down hard, median stock held up — cap-weighted pain is concentrated in a few mega-names.", "angle": "Equal-weight vs cap-weight divergence. If the median stock is fine, this is a mega-cap unwind, not a broad liquidation.", "tweetA": "70% of S&P stocks beat the index in a week the index got hammered. The market didn't fall. A handful of stocks did. Different problem, different hedge.", "tweetB": "Everyone is quoting the index drawdown. Median stock: 52% advanced. If this is a concentration unwind, equal-weight is the thing to watch before calling a bear market.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening (weekly breadth stats)"}, "link": "https://www.macrocharts.com/p/all-or-nothing"}, {"id": 3, "cat": "positioning", "urgency": "watch", "source": "Macro Charts / Macro Charts", "title": "'A big turn in Flows. No one is talking about this.'", "idea": "Author flags an unspecified flow turn plus continued 'capitulation tracking', calls noise 'at a climax' and says an 'enormous opportunity' lies on the other side. Details sit behind the fold (5 charts, top signals, portfolio plan).", "angle": "Teaser only, but a practitioner calling capitulation after a 2nd-worst-tech-week is a positioning data point worth cross-checking against ETF flow data.", "tweetA": "Someone calling capitulation the same week tech has its second-worst stretch since COVID. Early or right? I'd want ETF flow data before agreeing.", "tweetB": "'Noise is at a climax' is what every top-ticker says at the bottom and at the first leg down. The flow data decides which.", "charts": {"count": 5, "hot": true, "desc": "Five charts + flows chart behind the link — 🔥 CHART WORTH SAVING"}, "link": "https://www.macrocharts.com/p/all-or-nothing"}, {"id": 4, "cat": "tech", "urgency": "deep", "source": "ChinaTalk / Chang Che (New Yorker)", "title": "Time-to-exploit is now -7 days: attackers beat the patch", "idea": "An OpenAI model found a PHP bug in August (PHP runs ~70% of websites). By October exploit attempts began before disclosure. Google's incident response team puts average time-to-exploit at -7 days. A week after disclosure the US patched >25% of 14M exposed services, Japan similar, China 4% (Censys).", "angle": "Cyber-risk is now a patch-velocity problem. Negative time-to-exploit is a pricing input for cyber insurers and security vendors.", "tweetA": "Time-to-exploit: -7 days. Attackers are in before the patch exists. Every cyber insurance model priced on 'days to patch' is now a model of the past. $CRWD $PANW", "tweetB": "Same PHP zero-day, a week later: US 25% patched, China 4%. The country that built the world's biggest manufacturing base is the slowest to update its own servers. Adoption speed beats build speed.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — Censys patch-rate comparison likely; worth opening"}, "link": "https://www.chinatalk.media/p/china-in-the-cyberpocalypse"}, {"id": 5, "cat": "tech", "urgency": "deep", "source": "ChinaTalk / Chang Che (New Yorker)", "title": "The death of NOBUS: a $450 model replaces a million-dollar zero-day", "idea": "Nicole Perlroth: the zero-day gray market is 'likely being decimated' — 'why would a government pay millions for something they can find with a model for $450?' Scarcity era gives way to abundance; the NSA 'nobody but us' doctrine is dead, and the incentive flips to fix fast.", "angle": "A multi-hundred-million-dollar government procurement category collapsing in price by ~4 orders of magnitude. Spend shifts from hoarding to remediation.", "tweetA": "$450 vs millions. That's the new price of a zero-day. The exploit brokers' business model got repriced by a model API. Defense spend has to move to remediation. Who gets that budget?", "tweetB": "NSA's NOBUS doctrine assumed nobody else could find the hole. Now anyone with an API key can. The 'hoard vs patch' debate is over because the hoard has an expiry date.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.chinatalk.media/p/china-in-the-cyberpocalypse"}, {"id": 6, "cat": "regulation", "urgency": "deep", "source": "ChinaTalk / Chang Che (New Yorker)", "title": "China's 2021 zero-day law built the offense and broke the immune system", "idea": "Since 2021 Chinese researchers must report bugs to MIIT within 48h and can't sell abroad or publicize. Bug bounties: 9 of 10 top US tech firms have them vs 6 of 10 in China; Apple/Google pay millions, Tencent tops out at $15,000. China copied NSA hoarding but not the bottom-up disclosure ecosystem.", "angle": "State capture of vulnerabilities creates a hoard that's now 'use it or lose it' as AI rediscovers them. Governance model becomes the variable.", "tweetA": "$15,000 vs millions. That's the gap between China's top bug bounty and Apple's. You can't mandate a security culture, you have to pay for one.", "tweetB": "China's MSS is sitting on a zero-day stockpile with an expiry date, on a de-Americanized stack that's now Swiss cheese. 'Use it or lose it' is an escalation incentive.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.chinatalk.media/p/china-in-the-cyberpocalypse"}, {"id": 7, "cat": "credit", "urgency": "act", "source": "The Dark Side Of The Boom / Stephen Innes", "title": "Goldman credit desk: AI borrowing has outrun its own forecasts", "idea": "Goldman's Amanda Lynam (Global Credit Trader) says AI financing needs are accelerating just as investors demand more compensation, and the burden extends well beyond hyperscalers. Context: Nasdaq 100's worst session since the pandemic and semis collapsing. Email body is a teaser; detail is in the post.", "angle": "Credit may price the AI cycle before equities do. Watch whether spreads widen on new issuance (price) or issuance windows shut (quantity).", "tweetA": "Equities are debating AI earnings. Credit desks are asking who funds the next $X. Spread widening on new AI paper is a more honest signal than any multiple.", "tweetB": "Price vs quantity. If investors only demand a bigger concession, it's a repricing. If the books get thin, it's a funding timetable problem. The next two weeks of issuance tell us.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening (Goldman issuance charts likely)"}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-credit-clock-is-ticking-goldman"}, {"id": 8, "cat": "macro", "urgency": "deep", "source": "Weekly S&P500 ChartStorm / Callum Thomas", "title": "2018 replay: Dem House, Dec hike risk, funding deadline, trade", "idea": "S&P is ~6% off the Oct 6 peak. Jay Woods' 2018 analog: previous Trump term also saw Republicans lose the House; then trade war, Fed hikes and a government shutdown sank markets. Now: possible Dec Fed hike, federal funding deadline, trade and geopolitics, plus AI rattles. Inverted S&P chart must clear short-term resistance plus the 200-DMA.", "angle": "2018 Q4 was -20% peak to trough into a Fed pivot. The question is whether the Fed has a pivot in 2026 with a hike on the table.", "tweetA": "2018 had three ingredients: trade war, Fed hikes, shutdown. Dec 2026 has the same three on the calendar. The difference: in 2018 the Fed blinked in January. Would this one?", "tweetB": "S&P is 6% off the high and the 200-DMA is the line. I'm not calling 2018 again, but I'm checking the Dec FOMC and the funding deadline dates in my calendar today.", "charts": {"count": 2, "hot": true, "desc": "Inverted S&P with 200-DMA confluence + 2018 vs 2026 overlay — 🔥 CHART WORTH SAVING"}, "link": "https://www.chartstorm.info/p/weekly-s-and-p500-chartstorm-8-november"}, {"id": 9, "cat": "positioning", "urgency": "deep", "source": "Weekly S&P500 ChartStorm / Callum Thomas", "title": "Semis: 5-month count of -5% days >10 has only happened in 2000 and 2008", "idea": "Semis broke the 200-day, lower highs/lows; next support ~400 on SMH. Dean Christians: rolling 5-month count of days semis fell ≥5% exceeding 10 occurred only in July 2000 (dot-com peak) and Dec 2008 (GFC). Author says today looks more like 2000.", "angle": "Two data points, so a story, not a statistic. But volatility regime change in the leadership group is what matters.", "tweetA": "Semis have had more than 10 days of -5% in five months. It's happened twice: July 2000 and December 2008. One was the top, the other the middle of the crash. There's no good version.", "tweetB": "SMH 400 is the line. I care less about the level and more about the vol: leadership groups don't have ten -5% days in a healthy uptrend.", "charts": {"count": 2, "hot": true, "desc": "Semis day-count chart (2000/2008) + SMH downtrend — 🔥 CHART WORTH SAVING"}, "link": "https://www.chartstorm.info/p/weekly-s-and-p500-chartstorm-8-november"}, {"id": 10, "cat": "credit", "urgency": "act", "source": "Weekly S&P500 ChartStorm / Callum Thomas", "title": "Tech CDS spiking post-midterms: highest since the GFC", "idea": "Tech sector CDS went from rising to spiking after midterms, now the highest since the global financial crisis. Callum links it to AI bubbles bursting in China and Korea rippling to the US, plus worry that a Dem sweep means friendlier-to-nobody AI regulation.", "angle": "Tech CDS at GFC highs while forward PE says 'cheap as March 2020': credit and equity disagree.", "tweetA": "Tech CDS at highest since 2008-09. Tech forward PE as cheap as March 2020. One of those markets is wrong, and I know which one usually leads.", "tweetB": "AI bubbles bursting in China and Korea first, US second. Which market is the canary matters more than the S&P level. Where did the Korean memory names top?", "charts": {"count": 1, "hot": true, "desc": "Tech sector CDS chart — 🔥 CHART WORTH SAVING"}, "link": "https://www.chartstorm.info/p/weekly-s-and-p500-chartstorm-8-november"}, {"id": 11, "cat": "positioning", "urgency": "deep", "source": "Weekly S&P500 ChartStorm / Callum Thomas", "title": "Tech forward PE as cheap as March 2020 — bullish or earnings capitulation?", "idea": "Kevin Gordon: Tech sector forward PE at March 2020 level. Callum's three readings: could get cheaper, could be a false signal if euphoric earnings disappoint, or a buying opportunity. @negligible_cap semis vs S&P relative forward PE: cheap, or total loss of confidence in future earnings, i.e. the end of the first AI phase.", "angle": "A multiple falls for two reasons: price down or E up. The market is telling you which by revisions.", "tweetA": "Cheap forward PE only matters if the E holds. March 2020 earnings were destroyed and then restored. What's the AI earnings equivalent of the stimulus?", "tweetB": "A forward PE as low as March 2020 on a sector with record capex. Either the market believes capex returns won't come, or it's wrong. That's the whole trade.", "charts": {"count": 2, "hot": false, "desc": "Tech fwd PE history + semis vs S&P relative forward PE"}, "link": "https://www.chartstorm.info/p/weekly-s-and-p500-chartstorm-8-november"}, {"id": 12, "cat": "positioning", "urgency": "deep", "source": "Weekly S&P500 ChartStorm / Callum Thomas", "title": "Echo of dot-com: record equity allocation, cash and bonds at cycle lows", "idea": "Equity allocations at record, valuations similarly high, T-bill rates ticking up. Allocations to cash and bonds at cycle lows; defensive sectors' market-cap weight rising from record lows. Leveraged US equity ETF dip-buyers are deploying, a group that was wrong heading into 2022. Seasonal 6-month best period begins, though a big excursion can sit inside it.", "angle": "Positioning is the amplifier: low cash plus leveraged dip-buying equals fewer natural buyers on the next leg.", "tweetA": "Equity allocation record. Cash and bonds at cycle lows. Leveraged ETF dip-buyers going in. They were right in early 2025 and wrong in 2022. Which regime is this?", "tweetB": "Everyone cites seasonality: Nov to Apr is the best 6 months. Callum's footnote is the real point: a positive 6-month return can still contain a 15% drawdown.", "charts": {"count": 3, "hot": true, "desc": "Valuations/allocations/cash-rate chart + leveraged ETF flows — 🔥 CHART WORTH SAVING"}, "link": "https://www.chartstorm.info/p/weekly-s-and-p500-chartstorm-8-november"}, {"id": 13, "cat": "culture", "urgency": "watch", "source": "Weekly S&P500 ChartStorm / Callum Thomas", "title": "Fridges and Coca-Cola: the biggest beneficiary of a technology isn't its maker", "idea": "From @BoringBiz_: after refrigerators went mainstream, Coca-Cola benefited more than fridge makers (shift from soda fountains to bottled/canned). Same pattern: industrials from electrification, software from the internet (not telecom), Sears from railroads, Uber from GPS plus smartphones.", "angle": "Applied to AI: value may accrue to users of cheap intelligence, not model/compute suppliers, which is the bear case on capex returns.", "tweetA": "The fridge's biggest winner was Coca-Cola. Electrification's was industry. The internet's was software, not telecom. If AI follows, the winner isn't who's spending $100B+ in capex.", "tweetB": "Whoever owns the 'Coca-Cola of AI' isn't in the Nasdaq-100 top ten today. That's an uncomfortable thing to say to an allocator who is 40% long the picks and shovels.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://www.chartstorm.info/p/weekly-s-and-p500-chartstorm-8-november"}, {"id": 14, "cat": "AI/infra", "urgency": "deep", "source": "The Hard Fork / Marvin Liao (weekly reads)", "title": "If AI busts, China's capex is subsidized and America's isn't", "idea": "Quoted piece: Amazon capex fell from $287M in 1999 to $46M in 2003; Anthropic/OpenAI would survive a crash but cut research for 1-2 years. Chinese firms would be state-subsidized through a bust; no US taxpayer bailout for firms whose engineers are centimillionaires. 'The AI boom favored America's system; China's will probably perform strongly in a bust.'", "angle": "Asymmetry: the US wins the boom, China wins the bust. Pair with credit-market stress on AI financing.", "tweetA": "Amazon's capex went $287M to $46M in four years after the dotcom bust. Now ask what OpenAI's does if credit closes. China's doesn't close, the state funds it. Boom favors one system, bust the other.", "tweetB": "Nobody is bailing out AI labs. The political optics alone make it nil. That makes the bust a one-sided geopolitical event for compute share.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening (originals linked in digest)"}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-nov-8th"}, {"id": 15, "cat": "AI/infra", "urgency": "deep", "source": "The Hard Fork / Marvin Liao (weekly reads)", "title": "Rent vs own: gross margin now depends on graduating from API renter to model owner", "idea": "Recommendation: startups rent until the data says otherwise but log every interaction as training data; enterprises audit API spend by workload, since 2-3 loops likely drive most of it; VCs should diligence margin trajectory on rent-to-own. Hybrid: rent frontier for long tail, own distilled specialist models for core loops. 'The ones that don't will look like resellers.'", "angle": "API spend is the new COGS. Distillation is the margin lever.", "tweetA": "API spend is the new cloud bill. Two or three loops account for most of it. Those are the loops to distill and own. The rest of the company is a reseller with a nice UI.", "tweetB": "A startup's AI gross margin in 2027 = how fast it moved its top two workloads off frontier APIs. That's a diligence question I don't hear asked.", "charts": {"count": 0, "hot": false, "desc": "No chart in digest"}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-nov-8th"}, {"id": 16, "cat": "AI/infra", "urgency": "deep", "source": "The Hard Fork / Marvin Liao (weekly reads)", "title": "Which companies should build their own AI model? Captive data, distribution, scale", "idea": "Framework: a company with at least 3 of 5 properties should consider its own model. Don't buy a stock because it announces a custom model; buy if it has captive data to train better, captive distribution to force adoption, and scale to make the economics work.", "angle": "A checklist to separate real from announcement-driven AI stocks.", "tweetA": "Custom-model press release is not a moat. Captive data, captive distribution and scale are. Run your holdings through that screen and see how many pass.", "tweetB": "Banks, insurers, payments: all have captive data and captive distribution. Interesting that the 'AI losers' list is so full of the companies that pass this test.", "charts": {"count": 0, "hot": false, "desc": "No chart"}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-nov-8th"}, {"id": 17, "cat": "AI/infra", "urgency": "watch", "source": "The Hard Fork / Marvin Liao (weekly reads)", "title": "Verdad: AI's 'high-modernist' hubris — dark data centers and commoditized models", "idea": "Quote from Verdad's 'Ambiguity, Hubris, and AI': confident predictions often fail; the monuments to this experiment may be dark data centers, obsolete GPUs and commoditized models that play small roles in workflows and never reach superintelligence.", "angle": "Direct bear case on capex, in the same week semis have their worst week since April 2025.", "tweetA": "'Dark data centers, obsolete GPUs, commoditized models.' That's the bear case in one line. GPU depreciation schedules are where it shows up first.", "tweetB": "James C. Scott's high modernism applied to AI capex. Planners with certainty, a complex system, and a $1T commitment. Historical hit rate is not great.", "charts": {"count": 0, "hot": false, "desc": "Charts inside linked piece — worth opening"}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-nov-8th"}, {"id": 18, "cat": "venture", "urgency": "deep", "source": "The Hard Fork / Marvin Liao (weekly reads)", "title": "Venture: 'pure gold entry prices for fool's gold companies'", "idea": "Angular Ventures: entry valuations have crept up in every round, geography and sector; consensus deals are priced to perfection and the downstream fundraising challenge is the real exit obstacle. Separate quote: funds feel forced to 'pay up or go to reality', but non-consensus companies can't raise despite everyone claiming they want such rounds.", "angle": "Venture dispersion is the story: consensus deals have no margin of safety, non-consensus deals have no capital.", "tweetA": "Everyone says they want non-consensus rounds. Almost nobody funds them. That's the cleanest description of VC in 2026 I've read: pay up for consensus or starve the contrarian.", "tweetB": "'Pure gold prices for fool's gold companies.' At seed. If the downstream round is the exit risk, the real metric is Series B conversion, not entry price.", "charts": {"count": 0, "hot": false, "desc": "No chart"}, "link": "https://newsletter.angularventures.com/p/raising-the-bar-inception-stage-venture-in-the-age-of-consensus"}, {"id": 19, "cat": "venture", "urgency": "watch", "source": "The Hard Fork / Marvin Liao (weekly reads)", "title": "Debt arrives in defense tech: a regulated bank lends against a seaglider round", "idea": "Quoted analysis: a bank participating in a seaglider financing signals American defense manufacturing is creditworthy — factories, contracts and backlog are now collateral. Equity funded the experimental phase; debt funds the industrial phase, letting founders scale production without dilution.", "angle": "Maturation marker: defense tech moves from VC bet to financeable infrastructure.", "tweetA": "When a regulated bank lends against defense hardware, the sector stopped being a venture bet. Debt funds the industrial phase. Watch who is first to securitize the backlog.", "tweetB": "Credit shows up after equity proves the model. Defense tech just got its first lender. That's usually when the cost of capital starts falling fast.", "charts": {"count": 0, "hot": false, "desc": "No chart"}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-nov-8th"}, {"id": 20, "cat": "geopolitics", "urgency": "deep", "source": "The Hard Fork / Marvin Liao (weekly reads)", "title": "Europe's cruise-missile pivot: 1,000 Anthem missiles in 2027, 5,000 by 2028", "idea": "Covenant aims to produce 1,000 Anthem missiles in 2027 across German and US sites, scaling to 5,000 at both by 2028. Mass-producible low-cost cruise missiles with long range and decent payloads could let European states quickly fill arsenals, including deep-strike, which is central to deterring Russia.", "angle": "Cost-per-missile is the variable; cheap mass production changes the arithmetic of deterrence in Europe.", "tweetA": "1,000 cruise missiles in 2027, 5,000 in 2028 from a startup. Europe's deep-strike gap closes via manufacturing, not procurement programs. That's a different supplier universe than $RHM.", "tweetB": "Deterrence by volume. Whoever builds cheap missiles at four-digit annual rates sets the price of air defense. Interceptor costs vs missile costs is the trade.", "charts": {"count": 0, "hot": false, "desc": "No chart"}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-nov-8th"}, {"id": 21, "cat": "geopolitics", "urgency": "deep", "source": "The Hard Fork / Marvin Liao (weekly reads)", "title": "Yemen: Ansar Allah takes the Red Sea coast; US declined Saudi appeals", "idea": "Quoted: Ansar Allah has broken out of its northern redoubt, taking the entire Red Sea coastline, and is mobilizing on Marib, the last PLC stronghold in the north. Another quoted piece: Saudi Arabia asked Washington for help against Ansar Allah attacks and was declined as the US focuses on Iran and Hormuz. Iran operation supplied from Diego Garcia and even Singapore, unhardened US bases exposed.", "angle": "Red Sea shipping risk plus Saudi disappointment with US guarantees: two threads that reprice Gulf alignment.", "tweetA": "Saudi called Washington for help and was told the US needs to focus on Iran. Riyadh takes note. Those are billions in US arms buyers learning what the guarantee is worth.", "tweetB": "Houthis hold the entire Red Sea coastline. Add Hormuz risk and you have both energy chokepoints contested at once. Insurance rates tell the story before oil does.", "charts": {"count": 0, "hot": false, "desc": "No chart"}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-nov-8th"}, {"id": 22, "cat": "geopolitics", "urgency": "deep", "source": "The Hard Fork / Marvin Liao (weekly reads)", "title": "AI 'pacing' deal would hand China the win: industrial capacity is its edge", "idea": "Quoted argument: China's AI bottleneck is semiconductors, so time helps it; it would agree to a slowdown only if everyone gets AI parity, which with China's industrial capacity means it wins (US designs, China builds; robots offset China's population decline). 'There's no way the race doesn't continue, either outright or in the shadows.'", "angle": "AI arms-control talk faces a structural objection: parity favors the better manufacturer.", "tweetA": "US designs, China builds. AI parity would give China the design layer for free while it already has the factory. That's why a 'pause' fails at the first staff meeting.", "tweetB": "If AI parity plus industrial robots solves China's demographic problem, every tariff conversation is really a robotics conversation.", "charts": {"count": 0, "hot": false, "desc": "No chart"}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-nov-8th"}, {"id": 23, "cat": "energy", "urgency": "watch", "source": "The Hard Fork / Marvin Liao (weekly reads)", "title": "Doomberg: EU energy policy sits upstream of every other political problem", "idea": "Doomberg: the EU's 'bungled energy policies sit upstream of all other hot-button issues'; losing heavy industry and paying more for basics is unpopular, especially as foreign-policy adventures worsen energy realities. A 2021-22-style gas crisis repeat five years later is described as 'inconceivable' yet underway, with Berlin in wait-and-see mode.", "angle": "European gas risk is back as a macro variable, during a Hormuz-sensitive winter.", "tweetA": "Doomberg says energy is upstream of every European political problem. Gas storage, Hormuz and a wait-and-see Berlin is how 2022 started.", "tweetB": "Heavy industry doesn't come back once it leaves. The 2022 crisis was a demand destruction event; the second is a permanent relocation event.", "charts": {"count": 0, "hot": false, "desc": "No chart"}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-nov-8th"}, {"id": 24, "cat": "culture", "urgency": "watch", "source": "The Hard Fork / Marvin Liao (weekly reads)", "title": "Claire Barnes' Asia 1990s 'Market Wizards': 16 managers, written just before 1997", "idea": "Review of a book of 16 fund-manager interviews published right before the Asian Financial Crisis; the reviewer tracked every manager to see who survived. Some hedged, others bought the hype; many with excessive drawdowns 'didn't live to see another day'.", "angle": "A survivorship study across a crash, a timely read now.", "tweetA": "A book of 16 star managers published right before 1997. The author tracked down where they ended up. It's the best argument for position sizing I've seen.", "tweetB": "Checking who survived the last crash is more useful than reading who called the next one.", "charts": {"count": 0, "hot": false, "desc": "No chart"}, "link": "https://www.asiancenturystocks.com/clairebarnes/"}, {"id": 25, "cat": "science", "urgency": "watch", "source": "The Hard Fork / Marvin Liao (weekly reads)", "title": "Biotech century: 'the nation that leads the biological age writes the rules of life'", "idea": "Quoted policy piece: the US built the science, capital markets, regulatory gold standard and alliances of the biotech century and retains every advantage; what's needed is a decision. The nation that leads the biological age sets its standards, trade and norms.", "angle": "Biotech framed explicitly as a strategic competition, which implies policy support and China as the counterparty.", "tweetA": "Biotech is being reframed from healthcare to national competition. That changes who funds it and who gets blocked from it.", "tweetB": "The AI race has a rhetoric template. Biotech just adopted it. Expect procurement,
