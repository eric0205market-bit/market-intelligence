  angle:"Nobody selling a backtest tells you which decay bucket their Sharpe ratio came from — data-mining, awareness, or capacity.",

  link:"https://youngandcalculated.substack.com/p/quants-get-paid-millions-to-find" },

const CAT_COLORS = {macro:"#e24b4a",credit:"#378add",positioning:"#ef9f27","AI/infra":"#1d9e75",crypto:"#7f77dd",geopolitics:"#d85a30",energy:"#f97316",tech:"#06b6d4",gold:"#d4a017",culture:"#ec4899",labor:"#8b5cf6",regulation:"#64748b",science:"#14b8a6",venture:"#84cc16"};
const URG_LABEL = {act:"🔴 Act Now", deep:"🔵 Deep", watch:"🟡 Watch"};
const URG_EMOJI = {act:"🔴", deep:"🔵", watch:"🟡"};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function catCounts(){
  const c = {};
  ITEMS.forEach(i => c[i.cat] = (c[i.cat]||0)+1);
  return c;
}
function urgCounts(){
  const c = {};
  ITEMS.forEach(i => c[i.urgency] = (c[i.urgency]||0)+1);
  return c;
}

function renderFilters(){
  const cc = catCounts();
  const cats = Object.keys(cc).sort();
  let html = '<div class="pill'+(activeCat==='all'?' gray-active active':'')+'" onclick="setCat(\'all\')">All ('+ITEMS.length+')</div>';
  cats.forEach(cat => {
    const color = CAT_COLORS[cat] || '#888';
    const isActive = activeCat === cat;
    html += '<div class="pill'+(isActive?' active':'')+'" style="'+(isActive?('background:'+color+';'):'')+'border-color:'+color+';color:'+(isActive?'#fff':color)+'" onclick="setCat(\''+cat+'\')">'+esc(cat)+' ('+cc[cat]+')</div>';
  });
  document.getElementById('catBar').innerHTML = html;

  const uc = urgCounts();
  let uhtml = '<div class="pill'+(activeUrg==='all'?' gray-active active':'')+'" onclick="setUrg(\'all\')">All ('+ITEMS.length+')</div>';
  ['act','deep','watch'].forEach(u => {
    if(!uc[u]) return;
    const isActive = activeUrg === u;
    uhtml += '<div class="pill'+(isActive?' gray-active active':'')+'" onclick="setUrg(\''+u+'\')">'+URG_LABEL[u]+' ('+uc[u]+')</div>';
  });
  document.getElementById('urgBar').innerHTML = uhtml;
}

function setCat(cat){ activeCat = cat; activeSrc = null; renderFilters(); renderCards(); }
function setUrg(urg){ activeUrg = urg; activeSrc = null; renderFilters(); renderCards(); }
function filterBySrc(name){
  activeSrc = name; activeCat = 'all'; activeUrg = 'all';
  renderFilters(); renderCards(true);
}

function renderCards(expandMatches){
  let html = '';
  ITEMS.forEach(item => {
    if(activeCat !== 'all' && item.cat !== activeCat) return;
    if(activeUrg !== 'all' && item.urgency !== activeUrg) return;
    if(activeSrc && item.source.indexOf(activeSrc) === -1) return;
    const color = CAT_COLORS[item.cat] || '#888';
    const chartFlag = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');
    const open = expandMatches && activeSrc ? ' open' : '';
    html += '<div class="card">';
    html += '<div class="card-header" onclick="toggleCard(this)">';
    html += '<span class="idx">#'+item.id+'</span>';
    html += '<span class="urg">'+URG_EMOJI[item.urgency]+'</span>';
    html += '<span class="src-badge" style="background:'+color+'">'+esc(item.source.split('/')[0].split('(')[0].trim())+'</span>';
    html += '<span class="cat-pill">'+esc(item.cat)+'</span>';
    if(chartFlag) html += '<span class="chart-flag">'+chartFlag+'</span>';
    html += '<span class="title">'+esc(item.title)+'</span>';
    html += '</div>';
    html += '<div class="card-body'+(open?' open':'')+'">';
    html += '<div class="section-label">The Idea</div><div class="idea">'+esc(item.idea)+'</div>';
    html += '<div class="section-label">My Angle</div><div class="angle" style="border-left-color:'+color+';background:'+color+'12">'+esc(item.angle)+'</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet-box"><div class="tweet-label a">TWEET A</div><div class="tweet-text">'+esc(item.tweetA)+'</div><button class="copy-btn" onclick="copyTweet('+item.id+',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet-box"><div class="tweet-label b">TWEET B</div><div class="tweet-text">'+esc(item.tweetB)+'</div><button class="copy-btn" onclick="copyTweet('+item.id+',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    if(item.charts.count > 0 || item.charts.desc){
      html += '<div class="chart-box'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 ':'📊 ')+esc(item.charts.desc || ('Charts: '+item.charts.count))+'</div>';
    }
    html += '<div class="link-row"><a href="'+item.link+'" target="_blank">↗ Read full article</a></div>';
    html += '</div>'; // card-body
    html += '</div>'; // card
  });
  if(!html) html = '<div style="padding:20px;color:#999;">No items match this filter.</div>';
  document.getElementById('cards').innerHTML = html;
}

function toggleCard(headerEl){
  const body = headerEl.nextElementSibling;
  body.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function renderReport(){
  let html = '';
  html += '<div>Window: <strong>'+META.windowStart+'</strong> to <strong>'+META.windowEnd+'</strong>. Emails outside this window were not processed.</div>';
  html += '<div>Emails in window: '+META.emailsInWindow+' &middot; Read: '+META.emailsRead+' &middot; Items extracted: '+META.itemsExtracted+'</div>';
  html += '<h4>Included Sources</h4>';
  META.includedSources.forEach(s => {
    html += '<div><span class="srclink" onclick="filterBySrc(\''+esc(s.name)+'\')">'+esc(s.name)+'</span> — '+s.count+' item'+(s.count>1?'s':'')+'</div>';
  });
  html += '<h4>Skipped Sources</h4>';
  META.skippedSources.forEach(s => {
    html += '<div><strong>'+esc(s.name)+'</strong>: '+esc(s.reason)+'</div>';
  });
  document.getElementById('reportContent').innerHTML = html;
}

document.getElementById('metaLine').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items';
renderFilters();
renderCards();
renderReport();
</script>
