<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DATA POINT TAGS */
.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}

<script>
const REPORT_DATA = {"report_type": "TWITTER BANK RESEARCH", "collected_at": "2026-11-06T18:24:15Z", "window_days": 4, "input_stats": {"total_tweets": 120, "considered": 120, "kept": 19, "dropped": 101, "deduped": 0}, "summary": "Window: last 4 days; 19 bank/strategist research items kept of 120 considered.\nRecurring themes: Friday US payrolls previews (BofA, Goldman, JPM) and labor-market data.\nKorea/KOSPI drawdown and valuation charts from Goldman; Goldman oil and gold forecast updates.\nVolatility/positioning: Goldman Vol Panic Index, Barclays vol-control, hedge fund blow-up flows.\nPer-bank counts: Goldman 9, BofA 7, JPM 2, Apollo/Slok 1, Barclays 1, Nomura 1.", "by_bank_counts": {"Goldman": 9, "BofA": 7, "JPM": 2, "Apollo/Slok": 1, "Barclays": 1, "Nomura": 1}, "banks": [{"bank": "Goldman", "theme": "Goldman via Zaccardi/Neil — KOSPI drawdown & valuation, oil/gold forecasts, vol panic index, payrolls preview", "items": [{"author": "MikeZaccardi", "text": "GS: South Korea leveraged ETF assets under management have fallen below levels last seen in January https://t.co/cuqwZGqsfL", "tweet_url": "https://x.com/MikeZaccardi/status/2118758059409334722", "images": ["https://pbs.twimg.com/media/HWdXOj5XAAAAxCu.png"], "created_at": "2026-11-06T17:31:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: the KOSPI semiconductor sector's FY3 P/B has fallen to a historical low of around 0.7x, a level that has historically indicated a bottom of semi cycle and implied encouraging forward returns https://t.co/N7c3jDeiIq", "tweet_url": "https://x.com/MikeZaccardi/status/2118754284930060535", "images": ["https://pbs.twimg.com/media/HWdTy22XIAAxiaq.png"], "created_at": "2026-11-06T17:16:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Down 44.5% from its June peak, KOSPI is nearing GFC and Dot-com bubble drawdown levels (~52-53%). What makes this drop unique: it's driven by valuation compression despite rising earnings.\n\nCompared with the Dot-com bubble in particular, earnings quality is stronger https://t.co/Gg9fOf2OcX", "tweet_url": "https://x.com/MikeZaccardi/status/2118751950300692664", "images": ["https://pbs.twimg.com/media/HWdRq88XsAESrdv.jpg"], "created_at": "2026-11-06T17:06:44.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Goldman Sachs' latest oil forecasts https://t.co/4XE1CtJPqG", "tweet_url": "https://x.com/MikeZaccardi/status/2118706620322517272", "images": ["https://pbs.twimg.com/media/HWcocaOXgAAz45M.png"], "created_at": "2026-11-06T14:06:36.000Z", "relayers": []}, {"author": "neilsethinew", "text": "@C_Barraud’s Friday Brief has several posts on this week’s hedge fund blow-up. Goldman Prime data show Thursday’s drop (as of 10:30am) was a more-than-two-standard-deviation move for US fundamental, TMT and multistrategy funds (1-year lookback).\n\nPer the WSJ, a Goldman client note said TMT-focused hedge funds lost more than 4% Thursday, all but wiping out year-to-date gains that had reached as much as 24% before the summer AI selloff. Multistrategy funds lost 1.4%.\n\n“The real danger isn’t the market selloff itself, but the illusion of diversification across hedge funds,” Bruno Schneller, managing partner at multifamily office Erlen Capital Management, told Bloomberg. “I suspect the bigger risk is still ahead: As losses mount, risk managers may force funds to cut exposure, potentially triggering another wave of selling regardless of fundamentals.”\n\nGoldman’s John Flood, head of Americas equities execution, said in his note to clients (via ZeroHedge): “This feels like a lot. It is always darkest before dawn.” Nasdaq 100 futures were up 1.4% early Friday after Thursday’s 6.4% drop.", "tweet_url": "https://x.com/neilsethinew/status/2118695620059787615", "images": ["https://pbs.twimg.com/media/HWceNRUWUAAIny-.jpg"], "created_at": "2026-11-06T13:22:53.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Goldman Sachs’ Vol Panic Index surged back into the panic zone. \n@soberlook https://t.co/EGLX7QmA3x https://t.co/wYKggkw0sP", "tweet_url": "https://x.com/MikeZaccardi/status/2118681303621029907", "images": ["https://pbs.twimg.com/media/HWcRayXWsAA-6tX.jpg"], "created_at": "2026-11-06T12:26:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Ahead of today's employment report, Bank of America, Goldman Sachs and JPMorgan interestingly all land on the same number for October payrolls: 75,000. That’s above the 65,000 Bloomberg consensus and up from September’s 29,000.\n\nThe case for a beat is mostly the lack of layoffs. Goldman notes jobless claims averaged 198,000 in the October survey month. Since then, claims have dropped to 189,000, back to the joint-lowest since 1969, Challenger job cuts were the fewest for any October since 2023, and ADP came in at 86,000.\n\nWhere the banks split:\n\n▪️ Unemployment rate: JPMorgan sees 4.1%, while Bank of America and Goldman see 4.2%, although Goldman calling the risks skewed lower. September was 4.175% unrounded, so it doesn’t take much to tip it.\n▪️ Hourly earnings: Bank of America and Goldman see 0.3%. JPMorgan sees 0.2%, which would drop the annual pace to 2.8%, a new cycle low.\n▪️ Participation: Bank of America sees it falling to 61.7%, JPMorgan rising to 61.9%.\n▪️ Seasonals: Goldman says a late Labor Day sets up an October rebound, while Bank of America says October seasonals usually work against payrolls.\n\nBank of America also flags slowing weekly ADP data (about 17,000 a week in October from about 23,000 in September) and Temporary Protected Status visa revocations as downside risks.\n\nBank of America doesn’t expect the report to move December Fed pricing much. With the banks bunched at 75,000, the surprise is more likely to come from the unemployment rate and wages. 4.1% with 0.3% wage growth backs a December hike; 4.2% with 0.2% probably goes the other way.", "tweet_url": "https://x.com/neilsethinew/status/2118652110191620563", "images": ["https://pbs.twimg.com/media/HWaQ3MoXsAAORco.jpg"], "created_at": "2026-11-06T10:30:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: We lower our end-2026 gold forecast to $4,150/toz and our end-2027 forecast to $4,800/toz https://t.co/ygchjiif8o", "tweet_url": "https://x.com/MikeZaccardi/status/2118474944229126472", "images": ["https://pbs.twimg.com/media/HWZVvE0XoAATeLS.png"], "created_at": "2026-11-05T22:46:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Oct. nonfarm payrolls estimated at +75k (vs. +65k consensus &amp; +51k 3-month avg.), driven by low layoffs and solid high-frequency data.\n\nAverage hourly earnings expected +0.3% MoM. The unemployment rate is steady at 4.2%, with downside risk toward continuing claims levels. https://t.co/1R228Pb97H", "tweet_url": "https://x.com/MikeZaccardi/status/2118467393991102872", "images": ["https://pbs.twimg.com/media/HWZO3nhWkAAApsH.png"], "created_at": "2026-11-05T22:16:00.000Z", "relayers": []}]}, {"bank": "BofA", "theme": "BofA — Hartnett Flow Show risk-off conditions, BofAI labor-market and wage data", "items": [{"author": "neilsethinew", "text": "BofA’s Hartnett (Flow Show) says “we stay risk-off until” three things happen to reverse the tightening in financial conditions. None has yet:\n\n▪ Central bank rate hikes end. There have been 41 in the past six months, and BofA puts December hike odds at 64% for the Fed, 76% for the ECB and 68% for the BoJ.\n▪ The 10-year Treasury yield falls below 4.5%. It’s at 4.84%.\n▪ Oil falls below $80. WTI is at $90 and Brent at $98.\n\nHis path out was if this month’s payroll and CPI data come in weak, December’s Fed, ECB and BoJ hikes become the “last hikes,” and “risk assets start year-end rally @ Thanksgiving.”  It seems today's jobs report quashed that.\n\nMeanwhile, he flags an “ominous ‘double-top’” in the equal-weight S&P 500, with “no one talking ‘big top.’”", "tweet_url": "https://x.com/neilsethinew/status/2118739705273503842", "images": ["https://pbs.twimg.com/media/HWdGhMqXoAAzY9_.jpg"], "created_at": "2026-11-06T16:18:04.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "O\"K\" ... Lower-income households are seeing the strongest wage growth. \n\nAfter-tax wage growth for lower-income households rose to 4.7% YoY in October, compared with 3.8% for middle-income and 3.4% for higher-income households BofAI https://t.co/mzZOqWitCN", "tweet_url": "https://x.com/MikeZaccardi/status/2118677528680313183", "images": ["https://pbs.twimg.com/media/HWcN_ECXoAAGU6-.jpg"], "created_at": "2026-11-06T12:11:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "BofAI: A broader-based labor market is seeing a rise in job switching \n\njibes with the quits rate uptick in Sept JOLTS https://t.co/3qx62p8LON", "tweet_url": "https://x.com/MikeZaccardi/status/2118676899694018641", "images": ["https://pbs.twimg.com/media/HWcNabuXMAAa60t.jpg"], "created_at": "2026-11-06T12:08:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "SMID-biz hiring? Small business payments to hiring firms have accelerated since March 2026, whereas mid-sized picked up in the last few months BofAI https://t.co/JoQD7oeQq7", "tweet_url": "https://x.com/MikeZaccardi/status/2118676270561046588", "images": ["https://pbs.twimg.com/media/HWcM1z9XsAAfiT0.jpg"], "created_at": "2026-11-06T12:06:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "BofAI: Job growth moderated in October to 1.2% year-over-year (YoY), but the labor market remains resilient\n\n-unemployment payments were down around 5% YoY, suggesting few signs of labor market stress https://t.co/kVVBLHAGnK", "tweet_url": "https://x.com/MikeZaccardi/status/2118675527913418781", "images": ["https://pbs.twimg.com/media/HWcMKmvWQAASWR1.png"], "created_at": "2026-11-06T12:03:03.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Ahead of today's employment report, Bank of America, Goldman Sachs and JPMorgan interestingly all land on the same number for October payrolls: 75,000. That’s above the 65,000 Bloomberg consensus and up from September’s 29,000.\n\nThe case for a beat is mostly the lack of layoffs. Goldman notes jobless claims averaged 198,000 in the October survey month. Since then, claims have dropped to 189,000, back to the joint-lowest since 1969, Challenger job cuts were the fewest for any October since 2023, and ADP came in at 86,000.\n\nWhere the banks split:\n\n▪️ Unemployment rate: JPMorgan sees 4.1%, while Bank of America and Goldman see 4.2%, although Goldman calling the risks skewed lower. September was 4.175% unrounded, so it doesn’t take much to tip it.\n▪️ Hourly earnings: Bank of America and Goldman see 0.3%. JPMorgan sees 0.2%, which would drop the annual pace to 2.8%, a new cycle low.\n▪️ Participation: Bank of America sees it falling to 61.7%, JPMorgan rising to 61.9%.\n▪️ Seasonals: Goldman says a late Labor Day sets up an October rebound, while Bank of America says October seasonals usually work against payrolls.\n\nBank of America also flags slowing weekly ADP data (about 17,000 a week in October from about 23,000 in September) and Temporary Protected Status visa revocations as downside risks.\n\nBank of America doesn’t expect the report to move December Fed pricing much. With the banks bunched at 75,000, the surprise is more likely to come from the unemployment rate and wages. 4.1% with 0.3% wage growth backs a December hike; 4.2% with 0.2% probably goes the other way.", "tweet_url": "https://x.com/neilsethinew/status/2118652110191620563", "images": ["https://pbs.twimg.com/media/HWaQ3MoXsAAORco.jpg"], "created_at": "2026-11-06T10:30:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Not surprisingly given his \"top forecaster\" record with Bloomberg for the EU, @C_Barraud flagged eurozone producer prices coming in above 11.0% as “very likely” against a Bloomberg consensus of 10.6%. Eurostat printed 11.1%, up from an upwardly revised 8.3% in August and the first double-digit reading since February 2023.\n\nWhile I wouldn't normally post on EU PPI, Christophe's focus on the print is for a reason.  First, the specifics:\n\n▪️ Month-over-month: +2.5% after +2.0% in August\n▪️ Energy: +30.8% year-over-year, up from 21.0% in August\n▪️ Excluding energy: +3.5% year-over-year, +0.1% month-over-month\n\nSo, energy drives the headline, but the ECB needs to be watching that ex-energy number. At 3.5% year-over-year it’s the highest since May 2023, up from 1.4% in March. Historically, ex-energy producer prices have led consumer goods inflation by about seven months, with a 0.88 correlation since 2001.\n\nSo that would point to an acceleration in EU CPI at an awkward time for the ECB:\n\n▪️ It has hiked twice this year to a 2.50% deposit rate, then held last week. Lagarde said she sees no “material risk of second-round effects at the moment.”\n▪️ Euro area consumer core inflation held at 2.5% in October. That flat core was part of the ECB’s case for patience.\n▪️ Markets price two to three more hikes over the next year, per Reuters, with the Bundesbank and Bank of Italy heads signaling December is likely.\n▪️ France is the complication. The 10-year OAT touched about 5% on October 1, and OAT-Bund spreads hit a 15-year high on October 22. France is also under the EU’s excessive deficit procedure, which makes the ECB’s backstop harder to use. ABN AMRO pushed its hike calls back to December and March, partly because of the bond selloff.\n▪️ Then there’s the leadership turnover. Lagarde leaves February 7, nine months early, likely in part so EU leaders can choose her successor before France’s April-May presidential election. Schnabel leaves January 3 for the IMF, and Lane’s term ends May 31. That’s half the Executive Board turning over in the next six months.\n\nWhile the ECB has plenty of reasons to go slow, including French spreads, weak growth and a leadership handoff, the pipeline is concerning. On the historical relationship, today’s 3.5% points to goods inflation of about 1.5% by spring from 1.2% now. \n\nSo the real risk is whether energy keeps pushing ex-energy prices higher from here. The cleanest comparison is 2008. An oil shock pushed energy producer prices to 23.9% that July, and ex-energy producer prices peaked at 4.0%, not far from today’s 3.5%. Yet core never moved, holding at 1.7%. \n\nThe ECB famously hiked into it anyway and was cutting by October, then did the same in 2011. That history, plus French spreads and a leadership handoff, explains the reluctance now. Outside 2021–23 which had its own supply side dynamics, every 10 points of energy producer-price inflation has added only about 0.1 point to core a year later, which on history puts core near 2.7% next fall rather than breaking out. \n\nThe catch is the starting point: core is 2.5% and services 3.3%, versus 1.7% and 2.6% in 2008. And 2008’s energy shock didn’t fade on its own; the financial crisis ended it. If energy is still compounding by January, when firms reset prices, the ECB will likely find itself forced to continue hiking irrespective of what's going on with French bond yields.", "tweet_url": "https://x.com/neilsethinew/status/2118644309104681243", "images": ["https://pbs.twimg.com/media/HWaPytEXUAAPYKW.jpg"], "created_at": "2026-11-06T09:59:00.000Z", "relayers": []}]}, {"bank": "JPM", "theme": "JPM — off-balance-sheet AI debt/lease commitments; payrolls preview", "items": [{"author": "dailychartbook", "text": "\"Only 15% of debt and lease commitments appear on balance sheet for the big seven AI companies; that may explain why their credit spreads have been widening rapidly\"\n\n-Michael Cembalest, JPMorgan https://t.co/xPau7hfZkL", "tweet_url": "https://x.com/dailychartbook/status/2118659532775678313", "images": ["https://pbs.twimg.com/media/HWb9ngUXAAAN1cn.jpg"], "created_at": "2026-11-06T10:59:30.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Ahead of today's employment report, Bank of America, Goldman Sachs and JPMorgan interestingly all la // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
