<!DOCTYPE html>
<html lang="en">
<head>

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-10-10T05:21:08Z", "input_stats": {"total_tweets": 203, "unique_authors": 68, "tweets_with_images": 29, "after_noise_filter": 88}, "summary": "**Russia diesel / sanctions:** Trump announced a deal with Putin for Russian diesel exports (**~300kt** rest of October, **~500kt** in November, roughly 100–125 kb/d) and Treasury confirmed sanctions on Russian diesel are lifted until **April 2027** (JavierBlas). Blas calls the volumes too small to matter; **qthomp** calls it a 'massive fade' since Russia lacks spare diesel; **dampedspring** says it's about one day of consumption; **elerian** flags Europe's reaction.\n\n**Ledger supply-chain attack / crypto security:** An authorized Ledger reseller (**CryptoBilis**) shipped compromised devices; **0xQuit** reports it was quietly sold in March under an NDA that expires in 10 days and suspects a sophisticated, possibly **DPRK** actor — advice: move funds from any reseller-bought wallet, interim 2-of-2 multisig, long-term 2/3 or 3/5. **nic_carter** and **ercwl** also speculate (no evidence) that OpenAI's math results mean parts of public-key crypto may be weakened, with nic_carter guessing PQ will tilt to hash-based schemes and ECDLP not yet broken.\n\n**AI / Anthropic:** Anthropic will treat abusive behavior toward Claude as a Usage Policy violation from **Nov 12**; the Pope's remarks on machine memory and 'soul' spawned jokes, and **lopp** and **nic_carter** argue about whether LLM welfare makes sense (lopp: LLMs feel nothing; nic_carter: be kind, but Anthropic is too interventionist). **All-In** covers the Claude/Pope fight, OpenAI's 700+ math papers, and France riots/bond vigilantes.\n\n**Gold / macro:** China's central bank bought **+23t** in September, its **23rd straight monthly purchase** (abcampbell, dgt10011); gold ~**$4,200** and silver **$60.77** after a volatile week (Swedish_uranium) with US inflation data next. **saxena_puru** sees SPX/NDX still in an uptrend; **_tolks** thinks crypto charts still look broken with OI near yearly highs; **biancoresearch** podcasts on a K-shaped consumer.\n\n**Crypto notables:** Papertrade launches Oct 10 with predeposits and Circuit agent support; the equity-vs-token structure of **Backpack ($BP)** drew a debate (Evan_ss6, goodalexander, zeroxkyle); **0xQuit** is launching a 'chicken' mint tied to Abstract's Dec 15 shutdown; **Zeneca** pitches $BAT as an onchain revenue-backed token.", "sections": {"A_events": [{"cluster": "Trump–Putin Russian Diesel Deal — Sanctions Lifted to April 2027", "category": ["energy", "geopolitics"], "items": [{"author": "JavierBlas", "summary": "Breaking: Trump says he agreed with Putin that Russia will export diesel to the \"American and Global Marketplace\". Blas notes the volumes are too small to matter: ~300kt immediately (~2.2M bbl, ~100 kb/d for the rest of October) plus ~500kt in November (~3.7M bbl, ~125 kb/d), with flows to rise later per Trump. Unsaid: the White House must again lift sanctions on Russian refined products (if not all oil). Conversion used 7.46 bbl/t (BP).", "tweet_url": "https://x.com/JavierBlas/status/2108632941526229303", "images": ["https://pbs.twimg.com/media/HUNee5CWYAAtkla.jpg"], "type": "thread", "category": ["energy", "geopolitics"]}, {"author": "JavierBlas", "summary": "Follow-ups: US Treasury confirms it is lifting sanctions on Russian diesel exports (including into the US) until April 2027. He points out the move comes less than a month after Congress passed and Trump signed the 'Lindsey O. Graham Sanctioning Russia and Iran Act of 2026', which gives the White House broad powers to limit Kremlin energy sales — the first use is to lift sanctions on diesel. He adds the deal puts Zelensky in a bind: continued Ukrainian strikes on Russian refineries would now jeopardise a US–Russia economic deal.", "tweet_url": "https://x.com/JavierBlas/status/2108635894769156573", "images": ["https://pbs.twimg.com/media/HUNhK3XXUAExY2X.jpg"], "type": "tweet", "category": ["energy", "geopolitics", "regulation"]}, {"author": "qthomp", "summary": "Calls the deal 'one of Trump's dumbest tactics yet' and a 'massive fade': (1) Putin will lie to Trump's face, (2) Russia has no spare diesel — output is far below normal from war disruption, or it would already be exporting, (3) Ukraine won't let the tankers flow freely.", "tweet_url": "https://x.com/qthomp/status/2108633522676105612", "images": [], "type": "tweet", "category": ["energy", "geopolitics", "positioning"]}, {"author": "elerianm", "summary": "Shares a CNBC piece on the diesel announcement and says the reaction of European governments 'will be fascinating'.", "tweet_url": "https://x.com/elerianm/status/2108635572986314987", "images": ["https://pbs.twimg.com/media/HUNg4KeW4AAUUhX.jpg"], "type": "tweet", "category": ["energy", "macro", "geopolitics"]}, {"author": "dampedspring", "summary": "Dismissive of the headline: the full volume announced equals roughly one day of consumption — 'thanks I guess'.", "tweet_url": "https://x.com/dampedspring/status/2108642411362570558", "images": [], "type": "tweet", "category": ["energy", "macro"]}]}, {"cluster": "Ledger Reseller Compromise (CryptoBilis) — Hardware Wallet Supply-Chain Attack", "category": ["crypto", "society"], "items": [{"author": "0xQuit", "summary": "Long thread update: the 'authorized reseller' (CryptoBilis, serving the Philippines/Malaysia/Indonesia) was reportedly bought out in March and forced into an NDA barring disclosure of the sale; the NDA expires in 10 days. Quit now thinks this is less a rogue employee and more a well-funded, sophisticated actor, possibly DPRK, and probably not the only reseller targeted. Advice: if you bought any hardware wallet from a reseller rather than direct, move funds slowly and carefully to a new device; as interim, a 2-of-2 multisig (hardware + hot wallet); long-term 2/3 or 3/5 multisig, not 2/2. In replies he argues software wallets are unacceptable for meaningful sums (keylogger risk), says resellers add unacceptable risk, and questions whether Ledger could have known of the sale. Earlier in the day he relayed Mark's speculation about spy implants and the open question of malicious operator vs. resold returned units; he also asked the ex-owners whether they told Ledger about the sale.", "tweet_url": "https://x.com/0xQuit/status/2108616149370060896", "images": [], "type": "thread", "category": ["crypto"]}, {"author": "0xQuit", "summary": "Replying to katexbt's/Zach's advice to store crypto on an iPhone: if everyone did, drains would appear weekly; the advice is not appropriate for 95% of people, and a phone with poor opsec leads to more drains than any hardware device.", "tweet_url": "https://x.com/0xQuit/status/2108600570990989483", "images": [], "type": "thread", "category": ["crypto", "society"]}, {"author": "nic_carter", "summary": "Reacting to the Ledger supply-chain reports (eSIM, LTE module and a separate CPU soldered in): in the last 6 months every worst nightmare of the most tinfoil-hat Bitcoiners became real — only a solar-flare EMP remains.", "tweet_url": "https://x.com/nic_carter/status/2108636220662378738", "images": [], "type": "tweet", "category": ["crypto"]}, {"author": "laurashin", "summary": "Podcast clip: tayvano_ on why ZachXBT taking his DPRK laundering investigation public puts pressure on exchanges — 'if this bro on Twitter can tweet this, why didn't anyone do anything beforehand?'. Relevant backdrop to the DPRK speculation around the Ledger case.", "tweet_url": "https://x.com/laurashin/status/2108739383189008696", "images": [], "type": "thread", "category": ["crypto", "regulation"]}]}, {"cluster": "OpenAI Math Results → 'Is Public-Key Crypto Broken?' Speculation", "category": ["crypto", "AI", "tech"], "items": [{"author": "nic_carter", "summary": "Responding to a thread arguing OpenAI's latest math results (integer multiplication, matrix improvements) hint public-key encryption may be broken. Carter's explicitly zero-inside-information guess: some cryptographic schemes have been classically broken/weakened to unusability, possibly including some PQ candidates (maybe lattices), so PQ will lean toward hash-based schemes; ECDLP has NOT been broken, but labs are starting to suspect a break may be doable. In a reply he says nearly everyone now agrees quantum computing is a genuine threat and far further along than expected — 'vindicated 100x'.", "tweet_url": "https://x.com/nic_carter/status/2108637708092572024", "images": [], "type": "thread", "category": ["crypto", "AI"]}, {"author": "ercwl", "summary": "Measured take: it's suspicious that cryptanalysis is mostly absent from OpenAI/Anthropic releases though understandable; no evidence anything is broken; urging caution is reasonable; everything digital sits in an 'awkward bucket' near term and the world in the mid term; 'bunker mode' makes sense but beware who is capturing the narrative and in which direction.", "tweet_url": "https://x.com/ercwl/status/2108736361935044762", "images": [], "type": "tweet", "category": ["crypto", "AI"]}, {"author": "stacy_muur", "summary": "TL;DR of Stacks CEO Muneeb's TOKEN2049 talk: quantum security as an early priority within three 'Satoshi Upgrades' through 2030 — (1) Bitcoin capital markets (BTC yield, borrow without giving up custody; Bitcoin Staking Genesis Bond sold out at 230 BTC in September, PoX-6 targeted for 2027), (2) compliant privacy, (3) post-quantum security. Discloses holding $STX.", "tweet_url": "https://x.com/stacy_muur/status/2108617993664217500", "images": [], "type": "tweet", "category": ["crypto"]}, {"author": "udiWertheimer", "summary": "Having worked with both engineers and mathematicians, finds it unsurprising that mathematicians are the bigger complainers about being replaced by AI (context: the OpenAI math-community backlash).", "tweet_url": "https://x.com/udiWertheimer/status/2108764103200084371", "images": [], "type": "tweet", "category": ["AI", "society"]}]}, {"cluster": "Anthropic Bans 'Abuse of Claude' (Nov 12) — Model Welfare, the Pope and the Backlash", "category": ["AI", "society", "regulation"], "items": [{"author": "lopp", "summary": "Thread on the Anthropic model-welfare move (responding to a post backing it: 'cruelty to something that believes it is experiencing pain is not ok'). Lopp, citing 20 years of engineering, says an LLM is compressed data with a natural-language interface — it feels and believes nothing; it's not a neural network with persistence, has a very limited context window, and a single LLM doesn't meet almost anyone's bar for consciousness, though lines may blur later and reasoning/memory may stay distinct from 'feeling'. Amused anti-woke folks are laying groundwork for 'AI-wokeness'.", "tweet_url": "https://x.com/lopp/status/2108597020298535379", "images": [], "type": "thread", "category": ["AI", "society"]}, {"author": "nic_carter", "summary": "Says he is kind to LLMs the way he avoids stepping on ants — not because they're conscious but because needless cruelty is bad for the soul. In a reply he adds that unless Anthropic can furnish strong proof of qualia they shouldn't punish users for ordinary behavior: 'model cos are way too interventionist'.", "tweet_url": "https://x.com/nic_carter/status/2108605571176050765", "images": [], "type": "thread", "category": ["AI", "society"]}, {"author": "zeroxkyle", "summary": "Reacts to the notice that effective November 12, 2026 abusive behavior toward Claude violates Anthropic's Usage Policy — 'I really need grok bot to get better asap' (fejau_inc also notes the Grok bot now runs on Opus).", "tweet_url": "https://x.com/zeroxkyle/status/2108700021768274115", "images": [], "type": "thread", "category": ["AI", "regulation"]}, {"author": "cryptopunk7213", "summary": "Quips he never thought he'd see the Pope beefing with Anthropic, quoting the Pope's statement that intelligence must draw on memory and lived experience, et_url": "https://x.com/dgt10011/status/2108677567741907066", "images": ["https://pbs.twimg.com/media/HUOG5T4WwAAE7JQ.png"], "type": "tweet", "category": ["macro", "positioning"]}, {"author": "Swedish_uranium", "summary": "Weekly metals wrap (Oct 9): gold recovered toward $4,200/oz, ~+1.3% on the week after Wednesday's two-month low, with elevated yields and Fed hike risk as headwinds; silver +2.4% to $60.77 reclaiming $60; copper supported by China's return from Golden Week and the Centinela (Chile) strike; Kazatomprom holders approved a uranium contract with China's SNURDC while the Uranium One contract failed (88.34% abstained). US inflation data is next week's test.", "tweet_url": "https://x.com/Swedish_uranium/status/2108651367921537446", "images": [], "type": "tweet", "category": ["energy", "macro", "positioning"]}, {"author": "_tolks", "summary": "Has been methodically buying gold since $3,900 this summer (no current call), plans to keep doing so, citing central banks and China as buyers; happy to be patient and wants it in the overall portfolio.", "tweet_url": "https://x.com/_tolks/status/2108646483360620912", "images": ["https://pbs.twimg.com/media/HUNqyV-XAAAVC1F.jpg"], "type": "thread", "category": ["macro", "crypto", "positioning"]}]}, {"cluster": "France Unrest and Bond Vigilantes", "category": ["geopolitics", "macro", "society"], "items": [{"author": "zriboua", "summary": "Predicts the French 'student protests' will spread across European countries; says the 'Gen Z' protests looked coordinated, comparable to Nepal and Morocco. In follow-ups he agrees with a reply that the Moroccan protests were wrongly portrayed as spontaneous.", "tweet_url": "https://x.com/zriboua/status/2108680198539612388", "images": [], "type": "tweet", "category": ["geopolitics", "society"]}, {"author": "theallinpod", "summary": "The All-In episode's segment (from 1:02:03) on riots in France, Friedberg's 'socialism metric' and the bond market putting the West 'on notice'.", "tweet // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
