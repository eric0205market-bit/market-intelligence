ter to leaks before it reaches customers, and ruptures in the 72-inch Superaqueduct triggered the emergency. Experts argue decentralized rooftop rainwater harvesting — standard in the US Virgin Islands and Barbados — could capture 30 billion gallons a year from 1 million households at $500–$5,000 per system, but Puerto Rico offers no incentives and even a 2024 law mandating collection on government buildings goes unenforced.", "themes": [{"theme": "Distribution failure, not supply shortfall", "insights": [{"claim": "The Puerto Rico Aqueduct and Sewer Authority loses about 60 percent of the island's drinking water to leaking pipes and failing infrastructure before any of it reaches customers' homes, making non-revenue water — not rainfall — the dominant loss in the system.", "speaker": "Yessenia Funes", "type": "data_point", "entities": ["Puerto Rico Aqueduct and Sewer Authority", "Puerto Rico"], "conviction": "high", "so_what": "A 60 percent loss rate defines an enormous addressable market for leak detection, pipe replacement and metering vendors, and makes federal infrastructure dollars for PR a repair-capex story rather than a new-supply story.", "quote": "loses about 60 percent of the island’s drinking water before any arrives at customers’ homes due to leaking pipes and failing infrastructure", "locator": "The Puerto Rico Aqueduct and Sewer Authority", "quote_verified": true}, {"claim": "The current water emergency in Puerto Rico was caused in part by a series of ruptures in the 72-inch Superaqueduct pipe, a single main artery servicing major cities on the northern coast — a textbook single-point-of-failure risk in centralized water distribution.", "speaker": "Yessenia Funes", "type": "causal", "entities": ["Superaqueduct", "Puerto Rico", "Puerto Rico Aqueduct and Sewer Authority"], "conviction": "high", "so_what": "Concentration risk in trunk infrastructure is the argument decentralized-water vendors will use in every Caribbean and island bid; watch for redundancy mandates in post-crisis procurement.", "quote": null, "locator": "The ongoing emergency was caused, in part, by a series of ruptures", "quote_verified": false}, {"claim": "Environmental lawyer Ruth Santiago argues the biggest issue in Puerto Rico is government mismanagement of water rather than a lack of it, since abundant water remains available even amid the climate crisis and drought.", "speaker": "Yessenia Funes", "type": "contrarian", "entities": ["Ruth Santiago", "Comité Diálogo Ambiental", "Puerto Rico"], "conviction": "high", "so_what": "If scarcity is governance-driven rather than hydrological, the investable fix is operations, storage and metering — not desalination or long-haul supply projects.", "quote": "Even with the climate crisis and these droughts, we still have abundant water", "locator": "While the drought is a factor, the biggest issue", "quote_verified": true}, {"claim": "Puerto Rico governor Jenniffer González ordered municipal governments to shut off water two days at a time in the northeast, leaving 180,000 households with limited access, while many families had already gone without consistent water for more than 100 days.", "speaker": "Yessenia Funes", "type": "data_point", "entities": ["Jenniffer González", "Puerto Rico", "180,000 households"], "conviction": "high", "so_what": "Multi-month service failure at this scale is the political trigger for emergency appropriations and off-grid household spending on tanks, pumps and filtration.", "quote": null, "locator": "For the past week, Puerto Rico governor Jenniffer González", "quote_verified": false}]}, {"theme": "Rooftop capture economics", "insights": [{"claim": "Architect Fernando Abruña estimates Puerto Rico could gather 30 billion gallons of water a year if just 1 million households installed rainwater collection, against total residential use of just over 72 billion gallons a year at 62 gallons per resident per day.", "speaker": "Yessenia Funes", "type": "data_point", "entities": ["Fernando Abruña", "Abruña & Musgrave Architects", "Puerto Rico"], "conviction": "high", "so_what": "Roughly 40 percent of residential demand covered by decentralized capture sizes a real hardware market — gutters, tanks, pumps, filtration — that scales per household rather than per utility contract.", "quote": "One of the best unused reservoirs of water in Puerto Rico are the roofs of the houses", "locator": "Abruña, who is also a fellow with the American Institute of Architects", "quote_verified": true}, {"claim": "Rainwater harvesting system costs run $500 to $2,000 for small simple gravity-fed units and up to $5,000 for larger units with electric pumps, plus ongoing maintenance and water-quality monitoring costs, according to Plenitud Puerto Rico.", "speaker": "Yessenia Funes", "type": "data_point", "entities": ["Plenitud Puerto Rico", "Owen Ingley", "Las Marías"], "conviction": "high", "so_what": "A $500–$5,000 unit price with recurring maintenance is a serviceable consumer/NGO price point — cheap enough for subsidy programs and rebate-driven volume, unlike utility-scale capex.", "quote": null, "locator": "Executive codirector Owen Ingley estimates that the technology costs", "quote_verified": false}, {"claim": "The most resilient rainwater systems are purely gravity-fed — gutters diverting roof runoff into a canister connected to indoor pipes — which means they keep working during the grid outages that accompany Caribbean storms.", "speaker": "Yessenia Funes", "type": "framework", "entities": ["Puerto Rico", "rainwater harvesting"], "conviction": "medium", "so_what": "Gravity-fed designs beat pump-based ones on resilience metrics in grid-fragile markets, favoring low-tech tank and gutter suppliers over electromechanical solutions.", "quote": null, "locator": "The most resilient harvesting systems rely on gravity", "quote_verified": false}, {"claim": "Larger rainwater harvesting systems can supply water for cooling power plants and other industrial uses, extending the addressable market beyond residential potable substitution into industrial process water.", "speaker": "Yessenia Funes", "type": "thesis", "entities": ["Puerto Rico", "power plants"], "conviction": "medium", "so_what": "Industrial process-water capture is a higher-ticket segment than household barrels and is where commercial water-tech margins live.", "quote": null, "locator": "Bigger systems can help collect water", "quote_verified": false}, {"claim": "Household rainwater systems in Puerto Rico typically do not provide drinking water, serving non-potable needs like toilet flushing and pet water, which limits their substitution value against utility supply.", "speaker": "Yessenia Funes", "type": "data_point", "entities": ["Plenitud Puerto Rico", "Owen Ingley"], "conviction": "high", "so_what": "Non-potable-only output caps willingness to pay unless paired with filtration and treatment — the natural attach-on product for anyone selling into this market.", "quote": null, "locator": "The system doesn’t provide drinking water", "quote_verified": false}]}, {"theme": "Building-code mandates as the adoption lever", "insights": [{"claim": "Roughly 90 percent of homes in the US Virgin Islands have a cistern to collect rainwater, and the territory's building codes require many new developments to include the infrastructure — a direct demonstration that code mandates, not consumer preference, drive island-wide adoption.", "speaker": "Yessenia Funes", "type": "causal", "entities": ["US Virgin Islands", "Barbados", "Puerto Rico"], "conviction": "high", "so_what": "Building-code adoption is the single best leading indicator for rainwater-hardware demand; track code changes in Caribbean and coastal jurisdictions as procurement signals.", "quote": null, "locator": "Roughly 90 percent of homes in the US Virgin Islands", "quote_verified": false}, {"claim": "Honolulu County offers a limited number of free rain barrel installations to residents, showing that US jurisdictions already use direct subsidy rather than mandate alone to seed decentralized water capture.", "speaker": "Yessenia Funes", "type": "data_point", "entities": ["Honolulu County", "Hawaii"], "conviction": "medium", "so_what": "Subsidy programs create lumpy municipal purchase orders for barrel and cistern manufacturers — a bid pipeline distinct from retail demand.", "quote": null, "locator": "In Hawaii, Honolulu County even offers", "quote_verified": false}, {"claim": "Puerto Rico's government offers no incentives or financial assistance for rainwater harvesting and does not require catchment systems, unlike some other island states, leaving small nonprofits to meet demand at tiny scale.", "speaker": "Yessenia Funes", "type": "data_point", "entities": ["Puerto Rico", "Plenitud Puerto Rico"], "conviction": "high", "so_what": "Zero policy support means the market is currently philanthropic, not commercial — the upside case requires a policy catalyst, so watch legislative action as the entry trigger.", "quote": null, "locator": "Yet in Puerto Rico, the government offers no incentives", "quote_verified": false}, {"claim": "Farah Nibbs of the University of Maryland Baltimore County argues rainwater harvesting should be treated as part of the national water supply and that governments should cover costs to avoid pushing economic burdens onto households.", "speaker": "Yessenia Funes", "type": "framework", "entities": ["Farah Nibbs", "University of Maryland Baltimore County", "Caribbean"], "conviction": "high", "so_what": "Reclassifying decentralized capture as national supply infrastructure is what unlocks public funding streams — the framing to watch in Caribbean water policy.", "quote": "There is nothing that can help the Caribbean region as quickly and as reliably as rainwater harvesting", "locator": "There is nothing that can help the Caribbean region", "quote_verified": true}]}, {"theme": "Legislative inertia and enforcement gap", "insights": [{"claim": "A 2024 Puerto Rico law mandating all public agencies to install rainwater collection systems on government buildings is not being followed by agencies nor enforced, showing that mandate passage without an enforcement mechanism produces no procurement.", "speaker": "Yessenia Funes", "type": "causal", "entities": ["José Pérez Cordero", "Puerto Rico House of Representatives", "New Progressive Party"], "conviction": "high", "so_what": "Legislated demand that never converts to orders is a common trap in emerging climate-adaptation markets; discount headline mandates until enforcement or budget lines appear.", "quote": null, "locator": "He points to a 2024 law that mandated all public agencies", "quote_verified": false}, {"claim": "At-large legislator José Pérez Cordero introduced a June resolution ordering the Puerto Rican Natural Resources Committee to study rainwater harvesting feasibility based on other Caribbean models, and it has gone nowhere despite mounting water insecurity even though his New Progressive Party holds power.", "speaker": "Yessenia Funes", "type": "data_point", "entities": ["José Pérez Cordero", "Puerto Rican Natural Resources Committee", "New Progressive Party"], "conviction": "high", "so_what": "Even majority-party sponsorship is failing to move adaptation policy in an active crisis — a caution on timing any Puerto Rico climate-infrastructure thesis to political catalysts.", "quote": "We are, right now, in the perfect moment to do it, because we are in the middle of a crisis", "locator": "José Pérez Cordero, an at-large legislator", "quote_verified": true}, {"claim": "Since 2010 the nonprofit Plenitud Puerto Rico has donated and installed only 73 rainwater harvesting systems in Las Marías, a scale that underscores how far philanthropic delivery falls short of island-wide need.", "speaker": "Yessenia Funes", "type": "data_point", "entities": ["Plenitud Puerto Rico", "Las Marías", "Puerto Rico"], "conviction": "high", "so_what": "73 units over 15 years versus a 1-million-household opportunity quantifies the gap that only policy or commercial capital can close.", "quote": null, "locator": "Since 2010, local environmental nonprofit Plenitud Puerto Rico", "quote_verified": false}]}, {"theme": "Limits of the decentralized fix", "insights": [{"claim": "Rainwater harvesting cannot solve Puerto Rico's water problems in urban locations where large apartment complexes are hard to retrofit, and the systems become unsustainable if the wet season is not rainy enough — a risk rising with fossil-fuel-driven warming.", "speaker": "Yessenia Funes", "type": "contrarian", "entities": ["Puerto Rico", "rainwater harvesting"], "conviction": "medium", "so_what": "The adaptation market is bounded by building typology and precipitation variance; single-family low-rise markets are the realistic beachhead, not dense urban ones.", "quote": null, "locator": "Rainwater harvesting won’t solve all of Puerto Rico’s water problems", "quote_verified": false}, {"claim": "Puerto Rico's July was the driest month on record, driving a historic drought that pushed the territory into water rationing despite annual precipitation ranging from 30 to 169 inches across the island.", "speaker": "Yessenia Funes", "type": "data_point", "entities": ["Puerto Rico"], "conviction": "high", "so_what": "Record precipitation volatility on a rain-abundant island is the core adaptation thesis: storage buffers, not more supply, are the product the climate is demanding.", "quote": null, "locator": "Puerto Rico is experiencing a historic drought", "quote_verified": false}]}], "insight_total": 18, "top_entities": ["Puerto Rico", "Puerto Rico Aqueduct and Sewer Authority", "Superaqueduct", "Plenitud Puerto Rico", "Fernando Abruña", "Ruth Santiago", "José Pérez Cordero", "US Virgin Islands", "Farah Nibbs", "Jenniffer González"], "source_meta": {"author": "Yessenia Funes", "word_count": 1079, "paywalled": false}}, {"record_id": "c2f9fb19fa9c1cf8", "source_type": "technology", "source_name": "Wired", "source_url": "https://www.wired.com/story/its-never-too-early-to-start-planning-for-the-next-two-solar-eclipses/", "title": "It’s Never Too Early to Start Planning for the Next Two Solar Eclipses", "published_date": "2026-08-16", "language": "en", "processed_at": "2026-08-17T11:38:19Z", "processor": "claude-code-sub-opus", "tags": ["Society", "Macro"], "gist": "Following the August 12 total solar eclipse, two more events in the 'Iberian eclipse trio' remain: an August 2, 2027 total eclipse with 6 minutes 23 seconds of totality — the longest in 100 years — crossing southern Spain, North Africa (peaking over Egypt's Thebes) and the Arabian Peninsula, and a January 26, 2028 annular 'ring of fire' eclipse running from Ecuador and Peru through Brazil to Portugal and Spain. Spain is the only European country in the 2027 path of totality, concentrating European eclipse tourism demand into a single destination.", "themes": [{"theme": "2027 totality: duration and geographic scarcity", "insights": [{"claim": "The total solar eclipse of August 2, 2027 will hide the sun for 6 minutes and 23 seconds at peak, nearly three times the roughly 2 minutes 18 seconds of totality delivered by the August 12 eclipse, making it the longest total eclipse in 100 years.", "speaker": "Jorge Garay", "type": "data_point", "entities": ["solar eclipse", "August 2 2027"], "conviction": "high", "so_what": "A once-per-century duration is the kind of scarcity that drives premium pricing in tour packages, hotel rates and charter capacity along the path — book and price exposure roughly 12-18 months ahead.", "quote": "the longest eclipse in 100 years", "locator": "On August 2, 2027, one of the longest total solar eclipses", "quote_verified": true}, {"claim": "Spain will be the only European country from which the total phase of the 2027 eclipse can be observed, aside from the UK overseas territory of Gibraltar, concentrating the entire European totality market into a single national destination.", "speaker": "Jorge Garay", "type": "data_point", "entities": ["Spain", "Gibraltar", "United Kingdom", "Europe"], "conviction": "high", "so_what": "Geographic exclusivity means southern Spanish hospitality, rail and airport capacity absorbs continent-wide demand on a single date — a measurable one-day RevPAR and traffic spike for Andalusian operators.", "quote": null, "locator": "Spain will be the only European country", "quote_verified": false}, {"claim": "The 2027 path of totality runs from southern Spain and northern Africa through Morocco, Algeria, Tunisia, Libya, Egypt, then Saudi Arabia, Yemen and Somalia — a corridor spanning countries with widely divergent tourism infrastructure and travel-security profiles.", "speaker": "Jorge Garay", "type": "data_point", "entities": ["Morocco", "Algeria", "Tunisia", "Libya", "Egypt", "Saudi Arabia", "Yemen", "Somalia", "Spain"], "conviction": "high", "so_what": "Only a subset of the path is practically bookable for Western travelers, pushing demand disproportionately onto Spain, Morocco, Egypt and Saudi Arabia and inflating pricing power there.", "quote": null, "locator": "A narrow band across the planet", "quote_verified": false}, {"claim": "Egypt will see both the peak and the longest duration of the 2027 eclipse, with the moon's shadow falling over ancient Thebes — the temples of Karnak and Luxor and the Valley of the Kings — while the Giza pyramids sit just outside totality and get only a partial eclipse.", "speaker": "Jorge Garay", "type": "data_point", "entities": ["Egypt", "Thebes", "Karnak", "Luxor", "Valley of the Kings", "Giza"], "conviction": "high", "so_what": "The overlap of maximum totality with Egypt's highest-value heritage sites is an unusually strong tourism catalyst for Luxor specifically, while Cairo/Giza operators miss the premium event.", "quote": null, "locator": "Egypt will see both the peak of the eclipse", "quote_verified": false}]}, {"theme": "2028 annular event and the Iberian trio", "insights": [{"claim": "The January 26, 2028 annular eclipse will produce a visible ring of fire for 10 minutes and 27 seconds in Brazil, one of the longest annular eclipses of the century, along a path running from Ecuador and Peru across Brazil and the Atlantic to Portugal and Spain.", "speaker": "Jorge Garay", "type": "data_point", "entities": ["Brazil", "Ecuador", "Peru", "Portugal", "Spain"], "conviction": "high", "so_what": "A second cross-Atlantic event 18 months after 2027 extends the eclipse-tourism cycle into South America, spreading demand across two continents and two booking seasons.", "quote": null, "locator": "The third eclipse in the series will occur on January 26, 2028", "quote_verified": false}, {"claim": "In Spanish cities including Seville, Córdoba, Albacete and Valencia the 2028 ring of fire will last about seven minutes and appear very close to the horizon shortly before sunset, a configuration described as potentially very photogenic.", "speaker": "Jorge Garay", "type": "data_point", "entities": ["Seville", "Córdoba", "Albacete", "Valencia", "Spain"], "conviction": "medium", "so_what": "Low-horizon sunset framing maximizes viral image potential, which historically drives the last-minute surge in domestic travel and camera/optics accessory sales.", "quote": null, "locator": "Spain will experience a shorter but potentially very photogenic version", "quote_verified": false}, {"claim": "Europe is entering what the article calls a mini golden age of eclipses, with the 'Iberian eclipse trio' having two of three events still to come after August 12, giving destination marketers a multi-year rather than single-date planning horizon.", "speaker": "Jorge Garay", "type": "thesis", "entities": ["Europe", "Spain", "Iberian eclipse trio"], "conviction": "medium", "so_what": "A clustered multi-event sequence justifies durable capacity investment (viewing sites, transport, accommodation) rather than the one-off surge economics of a single eclipse.", "quote": "the mini go // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
