const ITEMS = [{"cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "Anthropic S-1: compute per revenue dollar fell from $2.51 to $0.48 — first operating profit $974M", "idea": "335-page S-1, Nasdaq ticker ANT. Quarterly revenue went $376M (early 2025) to $11.6B (Q2 2026), ~31x. Compute cost per $ of revenue dropped $2.51 → $0.48, producing a first operating profit of $974M (~8% margin). The $80.7B H1 net loss is mostly fair-value charges on convertible notes, i.e. paper.", "angle": "The unit-economics inflection is the whole IPO story. Compare against OpenAI (projected compute above revenue) and the hyperscaler capex prints the same week.", "tweetA": "$2.51 of compute to earn $1 in early 2025. $0.48 now. That's a 5x swing in unit economics in ~5 quarters, and it's not a software business yet — it's a power and silicon business with a model on top. $NVDA $GOOGL $AMZN", "tweetB": "An 8% operating margin on $11.6B quarterly revenue, and the headline is an $80.7B loss. Either the convert accounting is noise or it's the first tell that the equity story and the credit story of AI are the same instrument. Read the notes before the P&L.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-s-1-the-cloud-gang", "id": 1}, {"cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "Anthropic S-1: ~$800B compute commitments vs $131.7B cash, and a $40T TAM claim", "idea": "Close to $800B of compute commitments across Google TPUs, Amazon, Microsoft, neoclouds and 'SpaceXSI'; $131.7B cash; five stock classes; 94 pages of risk factors. Anthropic sizes its market at >$40T (the value of world knowledge work), one-upping Elon's $28.5T. Parekh: 'pay-regardless compute bill and customers who can switch in hours.'", "angle": "Fixed-cost take-or-pay vs a variable, switchable revenue base is the structural mismatch. Ties directly to the Goldman credit work on refinancing risk.", "tweetA": "$800B of commitments against $131.7B of cash. The revenue is variable and switchable in hours; the compute bill is take-or-pay for years. That's not an equity story, that's a duration mismatch with a ticker.", "tweetB": "$40T TAM = the entire world's knowledge-worker payroll. Elon says $28.5T. When two issuers both claim to eat all of labor, ask who's left to pay the invoices. $ANT", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-s-1-the-cloud-gang", "id": 2}, {"cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "OpenAI's discount war: Anthropic's share at Rippling went 57% → 18%, switch took hours", "idea": "OpenAI is offering ~40% off; Replit moved most AI spend after a >30% discount on a $100M+ contract; a bank doubled ChatGPT seats at the same price. Anthropic ~75% gross margin on existing models vs OpenAI projecting compute above revenue. Anthropic regained OpenRouter lead after Opus 5.5. Parekh: 'your margin is my opportunity'; new gigawatts next year erode scarcity pricing.", "angle": "Model switching costs ≈ zero is the bear case for every AI IPO. Wholesale API buyers (Replit, Cursor) are the canary.", "tweetA": "Rippling: Anthropic 57% → 18% of coding work in five months. Switching took hours, not quarters. Now ask what a 75% gross margin is worth when your customer's switching cost is a config change.", "tweetB": "OpenAI is subsidizing share ahead of its own 2027 IPO while Anthropic is marketing margin ahead of its 2026 one. One of them is pricing in a world where compute stays scarce. The gigawatts landing next year say it's not Anthropic's world. $MSFT $AMZN", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-s-1-the-cloud-gang", "id": 3}, {"cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "Google: cloud +103% to $30.7B, FCF –$9.1B, stock –13% — worst day ever, ~$500B erased", "idea": "Revenue +25% to ~$128B (fastest since 2021, slight miss). Cloud doubled on TPU sales. Search +12% and slowing; Google admitted AI Mode answers monetize worse. Capex $51B in the quarter, FCF –$9.1B, >$1T of AI commitments disclosed. Parekh still calls it long-term leader of the capex gang.", "angle": "A cloud doubling being punished means the market is now pricing FCF, not growth. Connect to the rotation/credit pieces.", "tweetA": "Cloud +103%. Stock –13%, the worst day in its history. The market just told you growth is no longer the scarce asset — free cash flow is. $GOOGL burned $9.1B in a quarter while printing its fastest growth since 2021.", "tweetB": "The Google detail nobody's pricing: AI Mode answers make LESS ad money than ten blue links. Search is the cash cow funding the capex, and the product that's cannibalizing it is the one the capex is for. $GOOGL", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-s-1-the-cloud-gang", "id": 4}, {"cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "Microsoft rewarded: Azure $33.2B (+48%), backlog +73% to $677B, Copilot seat count quietly dropped", "idea": "Revenue +19% to ~$92B; Azure +48%, first time disclosed in dollars; Microsoft Cloud +30% to ~$64B; commercial backlog +73% to $677B; capex $45B, a bit below plan; FCF ~$19B beat. Microsoft stopped disclosing Copilot seats as it moves to usage-based agents (The Information). Parekh: Copilot becoming 'a Costco of AI'.", "angle": "Same week, same capex theme, opposite reaction vs Google/Amazon: FCF positive + backlog visibility gets paid. Dropping seat disclosure is a tell.", "tweetA": "$MSFT: capex $45B, FCF +$19B. $GOOGL: capex $51B, FCF –$9.1B. Same AI demand, opposite stock reactions. The market isn't debating whether AI is real — it's pricing who funds it from cash flow.", "tweetB": "Microsoft stopped reporting Copilot seats. You only stop disclosing a metric when it no longer flatters you — or when you want to be valued on usage instead. Either way, it's the first big-cap to retire its AI adoption KPI.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-s-1-the-cloud-gang", "id": 5}, {"cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "Amazon: AWS +39% to $46B, but capex ~$77B/qtr, TTM FCF –$42.4B, stock –7% after hours", "idea": "AWS fastest growth in ~5 years; Jassy sees >40% growth in 2027 and 2028 and a $1T AWS in 5-10 years. Trainium chips to be sold outside AWS from late next year. Online stores +2%. Amazon blocks outside AI shopping agents such as Meta's Muse.", "angle": "Sum Google $51B + MSFT $45B + AMZN ~$77B ≈ $173B in a single quarter — ~$690B annualized from three companies.", "tweetA": "$51B + $45B + $77B. Three companies spent ~$173B in one quarter, ~$690B annualized. And Amazon's TTM FCF is –$42.4B. At some point the question flips from 'can AI demand absorb this' to 'who is the marginal buyer of the debt'. $AMZN", "tweetB": "Amazon will sell Trainium outside AWS. Google already sells TPUs. The hyperscalers are becoming merchant silicon vendors to each other — and $NVDA's biggest customers just became its competitors with a head start on supply.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-s-1-the-cloud-gang", "id": 6}, {"cat": "AI/infra", "urgency": "watch", "source": "Michael Parekh / AI-RTZ", "title": "Google's 'TPU moment' and the global AI wave: loved abroad, feared at home", "idea": "Two additional items in the roundup: Google is having a notable global 'TPU moment' vs Nvidia and others; and new data shows the AI tech wave is embraced outside the US but feared/resisted domestically.", "angle": "Adoption geography as a regulatory and demand signal; TPU sales explain part of Cloud +103%.", "tweetA": "Cloud +103% 'helped by its own TPU chips' — read that again. Google isn't just an Nvidia customer, it's now a supplier of the thing everyone's short on. $GOOGL $NVDA", "tweetB": "AI is more popular in Lagos and Jakarta than in Ohio. That's the political-economy asymmetry: the US builds the capex, foreign users capture the surplus, and local voters price the risk. Watch for regulation to come from the side that gets the least benefit.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-s-1-the-cloud-gang", "id": 7}, {"cat": "credit", "urgency": "deep", "source": "Dark Side of the Boom (Goldman Global Credit Trader)", "title": "Goldman: credit correlations at highest since the Q1 Iran escalation — AI funding scare is leaving AI borrowers", "idea": "Goldman Global Credit Trader (Lynam, Grut, Ali): index-level credit looks composed while weak-borrower conditions deteriorate. Correlations are at the highest since the first-quarter Iran escalation. Prefers selective single-B, neutral on AI-related HY, avoids CCC where refinancing pressure bites.", "angle": "Correlation spike = the trade has stopped being idiosyncratic. Pair with Google FCF –$9.1B and Anthropic's $800B commitments.", "tweetA": "Credit correlations are back to Iran-escalation levels — except this time the shock is a capex funding question, not a geopolitical one. When single names start moving together, the diversification you paid for is gone. Watch CCC first.", "tweetB": "Goldman: neutral on AI HY, avoid CCC, like single-B. Translation: the market will lend to the survivors and refuse the refinancers. The AI buildout and the CCC refi wall are the same trade seen from different seats.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-credit-shock-is-spreading", "id": 8}, {"cat": "credit", "urgency": "deep", "source": "Dark Side of the Boom (Goldman Global Credit Trader)", "title": "The new defensive credit trade is sorted by AI sensitivity, not ratings", "idea": "In IG, utilities, financials and healthcare have lower AI sensitivity; in HY, energy provides diversification. Goldman also favours BBB compression and selected subordinated debt.", "angle": "Sector-by-AI-beta is a new factor. Utilities are both AI-power beneficiaries and defensive — an odd overlap.", "tweetA": "Credit desks now sort issuers by 'AI beta' like they used to sort by duration. Utilities, financials, healthcare as the hide; energy as the HY diversifier. A rating tells you default risk. AI beta tells you who correlates with the next headline.", "tweetB": "Funny that utilities are the 'low AI sensitivity' credit when the grid is the bottleneck for the whole buildout. Either they're a safe haven or they're the most under-priced AI levered credit in IG. Can't be both. $XLU", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-credit-shock-is-spreading", "id": 9}, {"cat": "credit", "urgency": "deep", "source": "Dark Side of the Boom (Goldman Global Credit Trader)", "title": "Europe: Goldman prefers USD over EUR credit and says keep macro hedges despite cost", "idea": "Europe faces energy prices, sovereign stress and refinancing vulnerabilities; Goldman favours USD over EUR credit and recommends maintaining macro hedges despite higher cost.", "angle": "Cross-Atlantic credit divergence; ties to energy and sovereign spreads.", "tweetA": "When Goldman tells you to own USD credit over EUR credit AND keep paying for hedges, they're saying carry doesn't cover tail risk in Europe. Energy + sovereign + refi is a stack, not a list.", "tweetB": "Everyone's watching US tech credit. The cleaner stress is in European refinancing, where there's no AI capex excuse — just energy and sovereigns. Hedge cost is the market's price of that optionality.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-credit-shock-is-spreading", "id": 10}, {"cat": "positioning", "urgency": "watch", "source": "Campbell Ramble", "title": "Campbell Ramble: still short via puts, rotating into minerals after Nasdaq air pocket", "idea": "Post on a rough Nasdaq (QQQ) session: 'in the middle of the bullish range for the AI trade' since 2022, but the hill has been steep. Net net still short stocks via puts, adding to minerals stocks as the puts pay off.", "angle": "A practitioner recycling put gains into minerals — a hedge-to-real-assets rotation signal.", "tweetA": "Selling puts' gains into minerals is the interesting move. Not 'buy the dip', not 'stay short' — convert paper vol into hard-asset exposure. That's what a trader does when he doubts the bounce but fears the debasement.", "tweetB": "QQQ is mid-range since 2022 and still feels like a cliff because the climb was vertical. A –13% day in $GOOGL and an equal-weight S&P up on the same tape is how tops rotate before they roll.", "charts": {"count": 1, "hot": false, "desc": "QQQ chart (per post text) — worth opening"}, "link": "https://www.campbellramble.ai/p/spooky-speedbrake-on-the-way-to-the", "id": 11}];

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function copyTweet(itemId, which) {

  });

}
