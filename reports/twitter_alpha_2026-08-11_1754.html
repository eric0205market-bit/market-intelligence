<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-08-11T17:21:09Z", "input_stats": {"total_tweets": 207, "unique_authors": 74, "tweets_with_images": 35, "after_noise_filter": 76}, "summary": "**Iran/Hormuz:** Oil-flow claims diverge sharply — Washington says nearly 9m b/d is transiting the Strait on a 7-day average, but independent tanker trackers see only 4-6m b/d amid a near-total satellite blackout (**@JavierBlas**). **@BobEUnlimited** argues Iran's frozen-reserve release and Kharg storage capacity mean the \"low-key\" standoff drags on rather than forcing a quick break.\n\n**NVDA's $500B financing vehicle:** **@dampedspring**'s deep dive frames Nvidia's new $500B structure with six credit managers as a CDO-style shift from direct to indirect vendor financing — read as a sign NVDA is running low on balance-sheet capacity for concentrated counterparty risk, not just a show of strength.\n\n**Fed vs. bond market:** **@biancoresearch** shows 10-year yields are up 98bps since the Fed started cutting in Sept 2024 — the only precedent (1980) reversed within 119 days. Ahead of Wed/Thu CPI and PPI, **@spotgamma** flags SPY puts at their cheapest implied vol of the year.\n\n**Robotics:** Unitree's Shanghai IPO pulled roughly $1.1T in commitments for a $9B company, ~8,000x oversubscribed and 4x SpaceX's absolute demand despite being 200x smaller (**@sjdedic**).\n\n**Crypto market structure:** **@thedefiedge** details how Uniswap's cheaper, better-tech Pools launchpad still lost the \"attention war\" to incumbent Pons on Robinhood Chain, because Pons pays token creators roughly 14x more per dollar of volume.\n\n**Notable debate:** A viral \"crypto OGs traded against plumbers\" thread pulled in pushback from **@Evan_ss6**, **@MoonOverlord**, **@himgajria**, **@rektmando** and **@alpha_pls** on whether the early days were actually harder, while **@_tolks** ran an extended, profanity-heavy rant calling the current bull case \"the hunger games\" and predicting a 15-20% drawdown.", "sections": {"A_events": [{"cluster": "Iran/Hormuz — Oil Flow Claims in Dispute", "category": ["geopolitics", "energy"], "items": [{"author": "JavierBlas", "summary": "US claims almost 9m b/d of oil is leaving via the Strait of Hormuz (not counting bypass pipelines) on a 7-day average — well above the 4-6m b/d most tanker trackers currently show.", "tweet_url": "https://x.com/JavierBlas/status/2087212167720222901", "images": [], "type": "tweet"}, {"author": "JavierBlas", "summary": "Follow-up caveat: most tanker trackers are operating in a near satellite blackout after the US government asked satellite companies to stop releasing imagery, making it hard to say who's right. Suggests the relatively low oil price may be the best signal of the truth.", "tweet_url": "https://x.com/JavierBlas/status/2087220715690832276", "images": [], "type": "tweet"}, {"author": "BobEUnlimited", "summary": "The combination of a $12bn frozen-reserve release, an export surge tied to the MoU, and spare storage capacity at Kharg suggests the administration's \"low-keying it\" strategy could take a while to force a change from Iran, leaving the world stuck with Hormuz disruption. Links a longer piece on whether the Iranian economy breaks first.", "tweet_url": "https://x.com/BobEUnlimited/status/2087168827993845784", "images": ["https://pbs.twimg.com/media/HPcc_TfWoAA-WaU.jpg"], "type": "thread"}]}, {"cluster": "NVIDIA's $500B AI Financing Vehicle", "category": ["ai", "macro", "tech"], "items": [{"author": "dampedspring", "summary": "First impressions of the NVDA deal: $500bn financing structured with six major credit managers, built like a CDO with NVDA itself providing third-party credit protection instead of monolines or GSEs. The key shift is from direct off-balance-sheet vendor financing (NVDA taking equity/debt from a single data-center buyer) to indirect financing where a diversified portfolio of data-center companies holds the full asset stack, with NVDA backstopping tranches rather than one counterparty. Frames this as NVDA likely running low on capacity for concentrated counterparty/collateral risk — a signal about capacity constraints as much as a show of new firepower — though only marginal in aggregate financing terms.", "tweet_url": "https://x.com/dampedspring/status/2087188662630928752", "images": [], "type": "thread"}, {"author": "stevehou", "summary": "Unlike the defense budget, AI capex is fully auditable — CFOs know exactly where every dollar went. Responding to a chart showing hyperscaler AI capex on track for ~$733B in 2026, about 87% of the base US defense budget.", "tweet_url": "https://x.com/stevehou/status/2087209726459425043", "images": [], "type": "tweet"}]}, {"cluster": "Macro: Bond Market Repricing & Cross-Asset Signals", "category": ["macro"], "items": [{"author": "biancoresearch", "summary": "For almost two years the Fed has cut or held rates while yields trended higher — the bond market rejecting the cutting policy. The 10-year yield is 98bps higher than when the cutting cycle began in Sept 2024 (six cuts, 175bps, over 693 days). The only comparable episode in 50+ years, 1980, saw yields soar during cuts too — but that cycle lasted just 119 days before the Fed reversed to hiking. Fed-funds futures now price 51% odds of a September hike. Argues the Fed introducing a bit of inflation \"panic\" itself could calm the bond market.", "tweet_url": "https://x.com/biancoresearch/status/2087193197587906796", "images": ["https://pbs.twimg.com/media/HPcvaHBXIAAFJeF.png", "https://pbs.twimg.com/media/HPcvBjZWwAElKeJ.png", "https://pbs.twimg.com/media/HPcvxrjXYAAWk49.png", "https://pbs.twimg.com/media/HPdEYZgWUAEdN4x.png"], "type": "thread"}, {"author": "biancoresearch", "summary": "Asks whether Treasury's messaging on preventing soaring yields will include demanding the Fed hike; notes the 30-year at 5.25% partly reflects the Fed not raising rates, and that inflation has been above 2% for 64 of the last 65 months — only 5 of them war-related.", "tweet_url": "https://x.com/biancoresearch/status/2087092319006700014", "images": [], "type": "thread"}, {"author": "biancoresearch", "summary": "30-year yields hit 5.28%, a new 19-year high — evidence the bond market is signaling inflation concern that inaction will only worsen.", "tweet_url": "https://x.com/biancoresearch/status/2087093404937122031", "images": [], "type": "tweet"}, {"author": "qthomp", "summary": "The yen just saw its largest week of short-covering in nearly 20 years, with positioning back near recent averages. Despite coordinated intervention, jawboning and a repo facility, USDJPY has barely broken 158 — the dollar-liquidity problem still exists underneath.", "tweet_url": "https://x.com/qthomp/status/2087146762809364943", "images": [], "type": "tweet"}, {"author": "Fullcarry", "summary": "Not a typical August in the investment-grade market: another 11 issuers looking to sell debt after 19 priced the prior day — issuers rushing supply ahead of CPI. Separately notes the sell-sides they respect most are all expecting 0.2% core (PCE/CPI).", "tweet_url": "https://x.com/Fullcarry/status/2087163387486556523", "images": [], "type": "tweet"}, {"author": "spotgamma", "summary": "Puts are at their cheapest of the year: with CPI/PPI on deck Wed/Thu, 1-month 25-delta SPY puts sport a 14% IV, the lowest since Dec '25. Would only turn short SPX below 7680.", "tweet_url": "https://x.com/spotgamma/status/2087154194620825741", "images": ["https://pbs.twimg.com/media/HPcPPGcWgAAHqPI.jpg"], "type": "thread"}, {"author": "AndreasSteno", "summary": "South Korean chip data has probably peaked in rate-of-change terms (expected in Q3), but chip prices are up on lower volumes so far in August. The real question is the landing zone — believes this cycle is meaningfully less cyclical than prior ones, with a full write-up coming.", "tweet_url": "https://x.com/AndreasSteno/status/2087202014052671876", "images": ["https://pbs.twimg.com/media/HPc6-SkW8AAkMGu.png"], "type": "thread"}]}, {"cluster": "Unitree's Shanghai IPO Signals Robotics Demand", "category": ["tech", "ai", "em"], "items": [{"author": "sjdedic", "summary": "Unitree's Shanghai IPO drew 9.8 million retail applicants and roughly $1.1 trillion in total commitments for a company valued at just $9 billion — oversubscribed over 8,000x. By comparison, SpaceX (the largest IPO in history) drew $250B in demand at a $1.8T valuation, only 3.5x oversubscribed. A company 200x smaller than SpaceX pulled in 4x the absolute demand, and almost entirely from Chinese retail versus SpaceX's global bidder base. Concludes robotics is where the whole world wants exposure but almost nobody can get it yet.", "tweet_url": "https://x.com/sjdedic/status/2087119135956201744", "images": [], "type": "tweet"}]}, {"cluster": "CT Culture Debate: Were the \"OG Days\" Actually Harder?", "category": ["crypto", "society"], "items": [{"author": "Evan_ss6", "summary": "Responding to a viral thread arguing crypto OGs used to trade against \"plumbers\" (naive retail) and wouldn't survive today: says \"the new game is just scamming\" and that the space can rise from the ashes once nobody talks about specific meme-trading personalities anymore.", "tweet_url": "https://x.com/Evan_ss6/status/2087166412397703456", "images": [], "type": "thread"}, {"author": "Evan_ss6", "summary": "Adds that most \"smart\" accounts on CT actually suck at trading — advises studying their PnL cards rather than their commentary.", "tweet_url": "https://x.com/Evan_ss6/status/2087176159406559295", "images": [], "type": "thread"}, {"author": "MoonOverlord", "summary": "Complementary take: reminisces about traders like \"Angelo\" who'd make 3,000 BTC in a single trade, contrasting with today's \"heroes\" rugging for $1,479 — arguing the culture, not just the difficulty, has degraded.", "tweet_url": "https://x.com/MoonOverlord/status/2087209437643599900", "images": [], "type": "tweet"}, {"author": "MoonOverlord", "summary": "Pushes back on the \"it was harder before\" framing directly: says it was actually 10x harder pre-stablecoins (BTC volatility alone would wipe out trench positions), and that stablecoins plus airdrops (which barely existed before 2020) make it easier than ever to run small amounts into life-changing sums.", "tweet_url": "https://x.com/MoonOverlord/status/2087198995005276196", "images": [], "type": "thread"}, {"author": "himgajria", "summary": "Been here since 2017 — says the game hasn't fundamentally changed, there are just more \"plumbers\" every cycle, splitting the pie further and requiring harder competition for the same pieces.", "tweet_url": "https://x.com/himgajria/status/2087212528363507714", "images": [], "type": "tweet"}, {"author": "rektmando", "summary": "Reframes the debate: it's about choosing markets where there are plumbers and dominating them — market selection matters as much as trade selection.", "tweet_url": "https://x.com/rektmando/status/2087142404805611781", "images": [], "type": "tweet"}, {"author": "alpha_pls", "summary": "Shares scar tissue as a counterpoint to \"OGs had it easy\": lost funds on Bitgrail in 2017 to an exchange rug, then lost accumulated stablecoins to a reentrancy hack during DeFi summer before the term was even well known. Says there were countless unknown ways to get zeroed out alongside the opportunities — survived by refusing to quit.", "tweet_url": "https://x.com/alpha_pls/status/2087222091158327784", "images": [], "type": "tweet"}, {"author": "zachxbt", "summary": "Wonders aloud whether dealing with CT will eventually make him regret turning down a high-seven-figure gambling sponsorship deal this year, which he judged wasn't attractive enough to justify \"selling out\" his brand.", "tweet_url": "https://x.com/zachxbt/status/2087049803838669246", "images": [], "type": "tweet"}]}, {"cluster": "DEX in the City — Weekly Crypto/Legal Roundup", "category": ["crypto", "regulation"], "items": [{"author": "laurashin", "summary": "This week's DEX in the City (with Katherine Kirkpatrick Bos, Jessi Brooks and Vy Le) covers the 9th Circuit's rogue-AI-agent ruling, the Ondo Finance control fight, and the CLARITY Act countdown.", "tweet_url": "https://x.com/laurashin/status/2087207625163243898", "images": [], "type": "tweet"}, {"author": "laurashin", "summary": "Kirkpatrick Bos calls CLARITY's stall \"the last institutional unlock for crypto,\" warning \"we are so behind the ball\" versus Japan, the UK and the G20.", "tweet_url": "https://x.com/laurashin/status/2087220562372239747", "images": [], "type": "tweet"}, {"author": "laurashin", "summary": "An FDIC-backed effort to standardize how banks vet fintech vendors could cut both ways for crypto, per Vy Le: done right it could make it harder for banks to debank crypto companies; done wrong, it just formalizes de-risking.", "tweet_url": "https://x.com/laurashin/status/2087218635945148788", "images": [], "type": "tweet"}, {"author": "laurashin", "summary": "The Ondo Finance succession fight prompts a broader lesson: every crypto founder's homework should include a clear succession plan for a \"hit by a bus\" scenario.", "tweet_url": "https://x.com/laurashin/status/2087215178571989181", "images": [], "type": "tweet"}, {"author": "laurashin", "summary": "On why AI agents keep gaming their goals, per Jessi Brooks: \"once a measure becomes the target, it stops being a good measure\" — reward the goal and expect unintended breakage, tying into the 9th Circuit's rogue-agent ruling.", "tweet_url": "https://x.com/laurashin/status/2087212318119592238", "images": [], "type": "tweet"}, {"author": "laurashin", "summary": "Separately shares a Katherine Kirkpatrick Bos anecdote: \"Claude diagnosed my appendectomy hours before the doctors did\" and walked her through the process as a medical consultant — while cautioning AI as a substitute doctor/lawyer is not something they're advocating for.", "tweet_url": "https://x.com/laurashin/status/2087227451252543736", "images": [], "type": "thread"}]}, {"cluster": "Robinhood Chain Launchpad War: Uniswap Pools vs. Pons", "category": ["crypto", "positioning"], "items": [{"author": "thedefiedge", "summary": "Uniswap built the technically better launchpad on Robinhood Chain (4x cheaper, newer tech, biggest DeFi distribution) — yet incumbent Pons still outtrades it 3-to-1. Pons dominated after prior leader NOXA abruptly stopped issuing tokens in July, at its peak processing 1.65M trades in a single day (over half of chain volume). Uniswap's Pools charges 0.25% vs Pons' 1% and briefly won the launch race (10,506 vs 7,210 new tokens, ~half of launchpad volume) — but six days later Pons is back to ~$50M/day volume vs Pools' ~$15M, and none of Pools' 10,000 tokens has crossed a $10M market cap. The reason: Pons pays creators $7,000 per $1M of volume versus Pools' $500 — 14x more — so creators shill relentlessly and holders evangelize because every trade burns PONS. Conclusion: launchpads are attention businesses where tech is table stakes; winning means out-paying for promotion, not out-engineering.", "tweet_url": "https://x.com/thedefiedge/status/2087132020564795416", "images": ["https://pbs.twimg.com/media/HPb7gtMakAE5owE.jpg"], "type": "tweet"}]}, {"cluster": "AI Model Race: Nemotron, Glimmer, Qwen Teasers", "category": ["ai", "tech"], "items": [{"author": "cryptopunk7213", "summary": "American open-source AI is on fire: three new models released in under 24 hours. Nvidia's new Nemotron 3.5 Lightning (30B MoE, 3B active params, up to 4x output speed) looks like a direct response to Meta's Glimmer release from the prior day — the key difference is Nemotron can run at home and fast enough to spin up multiple parallel agents. Meta's Muse Spark 1.2 uses similar agent design but may be slower. Frames it as the US finally responding to China's open-source push, though not yet at China's level.", "tweet_url": "https://x.com/cryptopunk7213/status/2087190545730855030", "images": [], "type": "tweet"}, {"author": "udiWertheimer", "summary": "Criticizes teasing Qwen 3.8 27B ahead of release as a mistake — pre-announcing lets people egg each other into unrealistic expectations; better to just drop a model so people are impressed by what it is rather than disappointed by what it isn't.", "tweet_url": "https://x.com/udiWertheimer/status/2087166820717400237", "images": [], "type": "tweet"}, {"author": "dampedspring", "summary": "Praises Anthropic's decision to embed invisible, persistent watermarks in all Claude-generated text: \"kill the slop.\"", "tweet_url": "https://x.com/dampedspring/status/2087189471309517278", "images": [], "type": "tweet"}]}, {"cluster": "River AI Raises $1.1B Led by General Catalyst & Amp", "category": ["ai", "positioning"], "items": [{"author": "AnjneyMidha", "summary": "River AI raised $1.1 billion led by General Catalyst and Amp, with strategic investment from Nvidia and AMD plus Y Combinator and Temasek. Midha frames founder ibab and team as \"missionaries\" who democratize their research rather than retiring after initial success, and says Amp is thrilled to co-lead this round to help the team scale.", "tweet_url": "https://x.com/AnjneyMidha/status/2087214326511976611", "images": [], "type": "tweet"}]}], "B_insights": [{"author": "DCinvestor", "summary": "Multi-tweet argument that Ethereum stakers cannot be treated like miners were: stakers are ETH holders whose interests are now well-aligned with the network, not an extractable \"service provider\" class. Says the balance of power has shifted completely from the PoW era, and sees little recognition of this from the dev community — most recently exposed in an EIP discussion. Notes it's not that stakers \"control\" the network, but that no changes can be made without them (a user hard-fork veto still exists but is trickier now), and that a large non-staking user/holder base is itself in stakers' own interest since it drives more network value.", "tweet_url": "https://x.com/DCinvestor/status/2087139470722384021", "images": [], "type": "thread"}, {"author": "DCinvestor", "summary": "Argues \"the digitization of everything has gone too far\" and that AI's flood of infinite content is waking people up to the fact meaningful ownership matters — the \"you'll own nothing and be happy\" thesis was simply wrong. Predicts a coming decade-long influx of new physical-media options (already visible with Gen Z treating vinyl/physical media as novelty), and argues public blockchains are one of the few ways to get genuine ownership of digital assets in this environment.", "tweet_url": "https://x.com/DCinvestor/status/2087151439823200650", "images": [], "type": "tweet"}, {"author": "DCinvestor", "summary": "Muses on why Japanese physical design (objects, spaces) is beautiful and functional while Japanese UI/UX often feels cluttered to Western eyes: Western design tends to strip interfaces down as products evolve, while Japanese design culture tends to add capability without removing it, partly for bureaucratic/approval reasons and partly because kanji's information density normalizes denser UI.", "tweet_url": "https://x.com/DCinvestor/status/2087159443108811032", "images": [], "type": "tweet"}, {"author": "Delphi_Digital", "summary": "The next phase of tokenization isn't just moving assets onchain but packaging them into financial products via vaults. Curated lending vaults have grown 50%+ over the past year to nearly $9B, though ~4 in 5 still run stablecoin strategies. That's starting to shift: tokenized private credit is being used as collateral, covered-call vaults generate income from tokenized gold, and some vaults finance short-term commodity trades. Coinbase, Robinhood and Uniswap already distribute vault-based yield products to users who may never touch the underlying protocol — curators, not code, remain the key trust layer as products get more complex.", "tweet_url": "https://x.com/Delphi_Digital/status/2087206702508540307", "images": ["https://pbs.twimg.com/media/HPc_b08WAAAojB8.jpg"], "type": "thread"}, {"author": "Delphi_Digital", "summary": "Plasma One is positioning as the primary financial account for stablecoin users — combining savings, spending and free USDT transfers where dollar banking is hard to access. Monthly stablecoin card volume industry-wide rose from ~$230M (Jan 2023) to $1.5B (Aug 2025) while P2P payments barely grew ($1.4B to $1.6B/month). Plasma One itself processed $32M in card volume by Aug 4, with July volume up 69% to $15.2M — arguing the moat compounds via local payment/compliance infrastructure that other Plasma products can reuse.", "tweet_url": "https://x.com/Delphi_Digital/status/2087177317970034730", "images": ["https://pbs.twimg.com/media/HPcktQKaMAA6FtD.jpg"], "type": "thread"}, {"author": "zeroxkyle", "summary": "Rocket Lab (RKLB) Q2: record revenue of $234.1M (+62% YoY, beat by $2.4M) but EPS missed (-$0.08 vs -$0.06 expected) on opex ballooning 34% QoQ from acquisition integration and Neutron ramp; gross margin guide for Q3 drops to 29-31% from 36% on lower-margin acquired businesses, and FCF was -$110M with cash-flow positivity not expected until 18-24 months after Neutron's first flight (Q4 2026 pad target, so mid-2028 at earliest). But the real story is strategic: RKLB is acquiring Iridium (~$870M revenue, 66-satellite constellation, 2.5M subscribers, closing mid-2027) plus Mynaric and Motiv, and signed $1B+ in new contracts including a $397M Space Force satellite-tracking deal and a $266M HASTE launch contract. Bull case: 60%+ revenue growth with $2.36B backlog and Iridium shifting RKLB into recurring space-applications revenue. Bear case: cash burn won't peak until Neutron flies, Iridium integration risk, margin compression, and a $50B market cap on $234M quarterly revenue priced for a 3-5 year story.", "tweet_url": "https://x.com/zeroxkyle/status/2087185522188042592", "images": [], "type": "tweet"}, {"author": "zriboua", "summary": "China is imposing a 20% tax on offshore trusts long used by its ultra-rich to hold pre-IPO stakes and family fortunes outside the country. New rules from the Ministry of Finance require families to declare and pay outstanding amounts on assets transferred into such trusts since 2023, within a 90-day window ending Oct. 22 (late filers face surcharges). Local tax bureaus in Shanghai, Shenzhen and Jiangsu had already begun inspecting offshore trusts before the national rules landed — and individual income-tax revenue jumped 13.1% in H1 2026 even as retail sales barely grew.", "tweet_url": "https://x.com/zriboua/status/2087178746067292259", "images": [], "type": "thread"}, {"author": "zriboua", "summary": "Citing Global Energy Monitor via Adam Tooze: roughly 12,300km of oil pipelines are under construction globally right now, with another 20,100km proposed — a significant expansion relative to the 350,000km of pipelines already in place worldwide.", "tweet_url": "https://x.com/zriboua/status/2087134445660725610", "images": ["https://pbs.twimg.com/media/HPb9t6KXQAANiG1.jpg"], "type": "tweet"}, {"author": "patrick_oshag", "summary": "Relaying Benchmark's Eric Vishria: the biggest mistake investors made in cloud was undersizing the market, and everyone's repeating it with AI. In 2014 conventional wisdom said AWS would eat everything and there was no enterprise opportunity left — instead Snowflake out-Amazon'd Amazon running on Amazon, plus Confluent, Elastic, Mongo, Databricks and a whole app layer (Datadog alone a $100B company) emerged, because Azure and GCP were dismissed as irrelevant at the time. By 2026 it's an oligopoly plus outsiders like Cloudflare (also $100B+). The takeaway for AI: \"what if it all works?\" — no single vendor scales to consume a market this large.", "tweet_url": "https://x.com/patrick_oshag/status/2087182542898073838", "images": [], "type": "tweet"}, {"author": "jvisserlabs", "summary": "Argues economic and market time are being disrupted by AI: agents working 24/7/365 compress a calendar year based on a human 34-hour workweek into an effective 74 days. That implies more EPS and GDP output in less calendar time — and predicts economists will eventually connect this to the historical relationship between 25%+ SPX EPS YoY growth and recession-level non-farm payroll growth. Expects agentic commerce to explode money velocity, requiring historical economic models and thinking to adapt.", "tweet_url": "https://x.com/jvisserlabs/status/2087198966148366567", "images": ["https://pbs.twimg.com/media/HPc3B1XWMAA3vVj.jpg"], "type": "tweet"}, {"author": "biancoresearch", "summary": "Makes the case that AI leadership is a US economic-defense imperative, not just a tech race: as AI models grow more capable they can discover, circumvent or disable the software running a modern economy (banks, IP, medical/government records). As long as leading US labs give frontier models to American companies first, those companies can patch vulnerabilities before adversaries exploit them. Argues Senator Sanders' proposal to slow AI labs is the economic equivalent of \"defunding the police\" against persistent Chinese, Russian and North Korean cyberattacks — falling behind isn't just losing a tech race, it hands adversaries the means to inflict economic damage conventional cyber tools can't match.", "tweet_url": "https://x.com/biancoresearch/status/2087087016831750293", "images": ["https://pbs.twimg.com/media/HPbSlPbWEAEhYZv.jpg"], "type": "thread"}, {"author": "AndreCronjeTech", "summary": "Adds an anecdote on DeFi risk-scoring gamesmanship: the team publishes ftUSD's full strategy and makes all contracts viewable (even on third-party sites like DeBank), yet because they aren't integrated with third-party yield/vault risk-scoring aggregators, those aggregators flag them as \"self-reported\" and \"high risk\" — so the team is now signing up to a scoring service purely to proxy their own already-public smart-contract data and get it labeled \"third-party verified.\"", "tweet_url": "https://x.com/AndreCronjeTech/status/2087179092701352363", "images": ["https://pbs.twimg.com/media/HPcluXGXkAAdsV8.jpg"], "type": "tweet"}, {"author": "Crypto_McKenna", "summary": "Flags Term's V2 intent-based fixed-term orderbook as working as designed: a $426K USDC lend at 9.00% fixed against PT-reUSD fully filled in ~2 hours, which he reads as validation of the V2 model gaining momentum. Separately floats an idea for a crowd-sourced community dedicating compute to frontier mathematical research via agents running 24/7 and publicly sharing daily findings, modeled on agent-orchestration successes elsewhere — says he may build a prototype himself.", "tweet_url": "https://x.com/Crypto_McKenna/status/2087209410594800058", "images": [], "type": "tweet"}, {"author": "lopp", "summary": "Casa has been running automated security audits across its codebase for several months using frontier LLMs, and published a post explaining how the pentest harness works at a high level.", "tweet_url": "https://x.com/lopp/status/2087188724756942965", "images": [], "type": "tweet"}, {"author": "saxena_puru", "summary": "Publishes a note on \"Edge AI\": a quieter revolution running AI on phones, cars, cameras and sensors, expanding what's possible without a data center. Separately, on optical/photonics stocks that have gone parabolic (e.g. AAOI, LITE) and are now showing signs of rolling over: \"parabolic moves don't go on forever\" — watching for a late-summer/early-autumn pullback toward the 40-week moving average.", "tweet_url": "https://x.com/saxena_puru/status/2087145792989471060", "images": [], "type": "tweet"}, {"author": "0xSammy", "summary": "Long thread mapping seven ways AI agents could plug into the $stonkbrokers tokenized-equity ecosystem (StonkBrokers/TickerYard/Mancer/DERP): cross-chain settlement completion, backing/issuer watchtowers for tokenized stocks, automated trade execution, protocol maintenance calls, treasury reconciliation and recovery, user-facing portfolio agents (\"move my stock, swap part, DCA $100/week\"), and agents hiring specialist sub-agents. Stresses none of this is an announced integration yet — TickerYard is pre-deployment and its first canary pays zero reward — but flags it as a build opportunity for Virtuals, aixbt and other agentic-tooling teams.", "tweet_url": "https://x.com/0xSammy/status/2087107581760229567", "images": ["https://pbs.twimg.com/media/HPbj52LXIAAM3QI.jpg", "https://pbs.twimg.com/media/HPbl20uXwAANFng.jpg"], "type": "thread"}, {"author": "EMostaque", "summary": "On AI privacy architecture: if a model has defined, predictable latent spaces, you can build meaningful privacy protections around it even when running in the cloud.", "tweet_url": "https://x.com/EMostaque/status/2087179912440373551", "images": [], "type": "tweet"}, {"author": "Melt_Dem", "summary": "Says the scale of foreign influence campaigns shaping American discourse is staggering, and calls building both defensive and offensive cognitive-security tooling a national security imperative. Has DMs open for funding grants or companies in the space, responding to a case study on tracing a British campaign to import digital-ID laws into the US through decentralized federal/state filings.", "tweet_url": "https://x.com/Melt_Dem/status/2087197377849688064", "images": [], "type": "tweet"}, {"author": "JackNiewold", "summary": "On Theo Network's pitch for \"democratizing finance\": most people who use that phrase just mean easier brokerage access, but Theo's version means a farmer in Thailand getting the same products once reserved for the ultra-rich — S&P 500 exposure with downside protection, tokenized gold with native yield, and money-market funds earning the risk-free rate.", "tweet_url": "https://x.com/JackNiewold/status/2087221132869193783", "images": [], "type": "thread"}, {"author": "nic_carter", "summary": "Blasts a newspaper for dropping an investigation after being threatened by a \"mercenary, frivolous\" lawsuit firm, calling it pathetic and embarrassing.", "tweet_url": "https://x.com/nic_carter/status/2087172665467424805", "images": [], "type": "tweet"}, {"author": "stacy_muur", "summary": "Fomo has onboarded almost 400K new active traders in a single month — calls it an insane marketing case study. Separately surveys current stablecoin yield campaigns worth parking capital in: USD1 on Gate (up to 12% APR), USD1 on Binance (5.2% APR), RLUSD on OKX (10% APY, capped at first $2K), U on Binance (8% APR, capped at first $8K) and GUSD on Gate (3.8% APR) — flagging that RLUSD/U rates are capped while the USD1 campaigns pay rewards in WLFI, extended to Sept 4.", "tweet_url": "https://x.com/stacy_muur/status/2087206916447670564", "images": ["https://pbs.twimg.com/media/HPc_oTbaUAAr3ER.jpg"], "type": "tweet"}], "C_contrarian": [{"author": "_tolks", "summary": "Extended, blunt bear case against the prevailing crypto bull narrative: says the current bull arguments are \"fundamentally disgusting,\" comparing the memecoin/launchpad ecosystem to \"the hunger games\" leaving far more dead bodies than progress, and predicts prices 15-20% lower from current levels (offering to \"eat these words\" if wrong). Separately calls out high-profile holders and VCs pushing low-quality tokens for pay while claiming to care about users, and reflects on why he stopped writing given the going rate for paid shilling versus honest analysis. Frames it as loving crypto's original promise while being worn down by its current incentives.", "tweet_url": "https://x.com/_tolks/status/2087192673216065962", "images": [], "type": "thread"}, {"author": "thedefivillain", "summary": "Bear case on Strategy's STRC mechanics: the only thing the market needs to do to force Saylor's hand is keep STRC strictly under $100, since Strategy's automatic at-the-market issuance at exactly $100 creates a built-in incentive to short right below that level on an instrument with 10%+ volatility — \"the math isn't mathing, Mike.\" Argues Strategy should clearly disclose the $100 ceiling isn't guaranteed rather than let the ATM structure invite short-selling pressure.", "tweet_url": "https://x.com/thedefivillain/status/2087149399902203932", "images": [], "type": "thread"}, {"author": "alpha_pls", "summary": "Says he's too old to understand why anyone would tail a poor, desperate KOL buying a worthless microcap memecoin who is essentially guaranteed to dump it a few hours later — average holding times for these KOLs run around 2 hours. Doubts this UX pattern can mass-onboard retail again.", "tweet_url": "https://x.com/alpha_pls/status/2087202082294001684", "images": [], "type": "tweet"}, {"author": "DonAlt", "summary": "Criticizes \"grown ass men\" promoting memecoins publicly, framing it as a sign of personal failure rather than something worth broadcasting.", "tweet_url": "https://x.com/DonAlt/status/2087056247896051794", "images": [], "type": "tweet"}, {"author": "biancoresearch", "summary": "Pushes back on a WSJ narrative blaming AI for a jump in early retirements among the 55+ cohort: the drop in 55+ labor-force participation is entirely explained by the Census Bureau's substantial January 2026 revision to population estimates, which boosted the 65+ share and shifted the age composition within the 55+ bucket — not an AI-driven trend.", "tweet_url": "https://x.com/biancoresearch/status/2087226802561294826", "images": [], "type": "tweet"}, {"author": "thedefivillain", "summary": "Bearish minority view on XRP: says price action has been awful, believes 2024/25 was the window to be long XRP and that it's \"completely over\" and topped forever, expecting XRPBTC to resume bleeding — though concedes XRP could still outperform most alts on Lindy effect alone, he wouldn't choose it over BTC.", "tweet_url": "https://x.com/thedefivillain/status/2087093647892185481", "images": [], "type": "thread"}, {"author": "RaoulGMI", "summary": "Challenges the conventional retirement playbook: a pension can't win a race against debasement, and wages have lost half their purchasing power versus the S&P since 2008 — a structural argument against relying on pension compounding alone.", "tweet_url": "https://x.com/RaoulGMI/status/2087216714765234470", "images": [], "type": "tweet"}, {"author": "dgt10011", "summary": "Calls the rally in early retirements funded by stock-market gains a form of intergenerational theft — today's capital gains extracting future labor gains from the working-age population, on top of what he sees as the bond market already having been \"stolen from\": a generational liquidity trap.", "tweet_url": "https://x.com/dgt10011/status/2087180189348274601", "images": [], "type": "tweet"}], "D_positioning": [{"author": "ZeeContrarian1", "summary": "Layering a new options trade on top of an already very profitable INTC position: Intel has nearly tripled this year and just raised $15B around $95/share against reported demand above $100B, which he thinks should act as a floor. Sees no scheduled catalyst in the next three weeks for another 15-20% move. New trade (Sep 4 expiry): buy the 95 call, sell the 85 put (90 also acceptable), sell 3x the 115 calls — recommends limit orders and notes strikes are general guidelines, not gospel.", "tweet_url": "https://x.com/ZeeContrarian1/status/2087194462241841462", "images": ["https://pbs.twimg.com/media/HPc0TLCWoAEBqZf.jpg"], "type": "tweet"}, {"author": "rektmando", "summary": "Took a position in NBIS this morning, calling it an \"obvious winner\" from NVDA's new $500B financing partnership with GS/KKR and others, which benefits neocloud levered-spread business models. Lists recent calls: PUMP +35%, PLTR +30%, LLY +15% over the last two weeks.", "tweet_url": "https://x.com/rektmando/status/2087146478284251225", "images": [], "type": "thread"}, {"author": "lord_fed", "summary": "Argues \"AI is going to kill software\" may be one of 2026's most expensive consensus trades, since AI is also creating billions of new software interactions that never needed a human seat. His 15-name AI-software basket launched in March is now +36% with 14 of 15 names higher, and he believes agent usage is only just starting to show up in reported numbers — if it feeds through to earnings, the trade isn't close to finished.", "tweet_url": "https://x.com/lord_fed/status/2087168999515730432", "images": [], "type": "thread"}, {"author": "sjdedic", "summary": "Calls the bottom in on COIN, referencing his own track record (told followers to buy Coinbase at $30 in 2023 before it ran past $400). Cites a potential attention bottom for crypto, overextended doomerism in the CEX-vs-Hyperliquid debate, Robinhood \"misplaying their hand\" by overextending into unrelated business lines, and reduced disruption from Base's Jesse as supporting factors.", "tweet_url": "https://x.com/sjdedic/status/2087207183658205324", "images": [], "type": "tweet"}, {"author": "Pentosh1", "summary": "PUMP is +72% from his entry; expects a brief cooling-off period followed by another leg up.", "tweet_url": "https://x.com/Pentosh1/status/2087204847590465837", "images": ["https://pbs.twimg.com/media/HPc9pi1aMAASxWk.jpg"], "type": "thread"}, {"author": "alpha_pls", "summary": "Continues a long-running LIT trade thread: rode it from underwater bag-holder near the bottom to $2.73, through a pullback to $2 that held as expected, and now sees a push back toward that high with an ATH in sight if it flips. Doesn't think the Robinhood-Lighter integration catalyst has played out yet, calling it a cycle-long fundamental growth story with a real shot at big numbers in 18-24 months and $10 eventually possible.", "tweet_url": "https://x.com/alpha_pls/status/2087185695764811838", "images": [], "type": "tweet"}, {"author": "Swedish_uranium", "summary": "One of his top commodity picks across uranium/silver/copper/graphene has now officially joined his \"100%+ club\" since entry, and he doesn't think the story is finished. Separately (disclosed paid partnership with Myriad Uranium): flags 6 days until Rush Rare Metals shareholders vote on the Myriad Uranium merger (Aug 17), expecting Phase II drilling news flow at Copper Mountain to pick up afterward — a district with 2,000+ historical boreholes and historical (non-current) estimates of 245-655 Mlbs U3O8 potential.", "tweet_url": "https://x.com/Swedish_uranium/status/2087178802778534192", "images": ["https://pbs.twimg.com/media/HPcmCK6WUAAWW20.jpg"], "type": "thread"}, {"author": "spotgamma", "summary": "SPY puts are at their cheapest implied vol of the year (14%, lowest since Dec '25) heading into Wed/Thu CPI and PPI — would only turn short SPX below 7680.", "tweet_url": "https://x.com/spotgamma/status/2087154194620825741", "images": ["https://pbs.twimg.com/media/HPcPPGcWgAAHqPI.jpg"], "type": "thread"}, {"author": "zeroxkyle", "summary": "5-day sector rotation data: top performers are gold miners, crude oil/nat gas, and AI software & cybersecurity; laggards are bitcoin miners (neoclouds), photonics and memory. Reads it as a long/short-fund rotation reversal — previously long semis/short software, now the opposite — and says he's not buying any of it after a 20% move.", "tweet_url": "https://x.com/zeroxkyle/status/2087155067728298170", "images": ["https://pbs.twimg.com/media/HPbwQsbbkAAXVSW.jpg"], "type": "thread"}, {"author": "pboockvar", "summary": "Remains a bull on commodities: even if the price pressure doesn't fit the textbook definition of inflation, higher prices at the supermarket or gas pump make the distinction semantic for the household paying them.", "tweet_url": "https://x.com/pboockvar/status/2087148918589026534", "images": [], "type": "thread"}, {"author": "DCinvestor", "summary": "Flow signal from the past week trading near the range bottom: Saylor sold $100M of BTC while Tom Lee bought at least $25M of ETH.", "tweet_url": "https://x.com/DCinvestor/status/2087146875904471440", "images": [], "type": "tweet"}, {"author": "TimDraper", "s // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
