<script>
const ITEMS = [{"id": 1, "cat": "crypto", "urgency": "act", "source": "0xJeff / The After Hour", "title": "BTC has given back the whole Sep–Oct rally, and the 'smart money' alts fell harder", "idea": "0xJeff has BTC testing the $62–64k August level, which erases every gain from September and October. The alts smart money had been piling into (NEAR, GRASS, UNI, AERO, ZEC) are each down more than 20% in a week. He compares it to another 10/10-style flush with no obvious trigger.", "angle": "When the highest-conviction alts drop more than BTC, crowded positioning is the cause, not narrative. Watch which of the five bounces first. That tells you where the real holders are.", "tweetA": "NEAR, GRASS, UNI, AERO and ZEC are all down 20%+ in a week. These were the 'resilient' smart-money picks, and conviction trades are where the leverage was. The bottom comes when the crowded longs finally stop getting hit, not when BTC stops falling.", "tweetB": "BTC is back at its August level, so two months of upside are gone in a few sessions. Nothing broke on-chain and no exchange blew up. That's what makes it uncomfortable: a flush with no cause usually means the marginal buyer simply went somewhere else. $BTC", "charts": {"count": 0, "hot": false, "desc": "No charts in the email preview; the market-state section and resilient categories sit behind the paywall. Charts inside, worth opening"}, "link": "https://defi0xjeff.substack.com/p/the-after-hour-ep81-golden-wind"}, {"id": 2, "cat": "positioning", "urgency": "deep", "source": "Callum Thomas / Weekly S&P500 ChartStorm", "title": "Nasdaq's November RSI<30 signal says +5%, and it has already delivered +5%", "idea": "Every time the Nasdaq 100's RSI fell below 30 in a November, the index went on to rally 5% on average. It is already up exactly 5% from the 5-Nov close. Global 50dma breadth is turning up from oversold, as it did in late-24/early-25, and country A/D lines are rising again.", "angle": "If the seasonal playbook has already paid out, the next leg needs a new catalyst. NVDA earnings this week is the obvious one.", "tweetA": "The Nasdaq oversold-in-November signal averages +5%. We're already +5% off the Nov 5 close. The 'easy' bounce is done, and everything from here is a bet on fundamentals, not on mean reversion. $QQQ", "tweetB": "Global breadth is turning up from oversold, A/D lines are rising and Nasdaq RSI has rebounded: the technical repair has happened. But it happened while BTC lost a quarter of its value and NVDA posted 6 red weeks in a row. That divergence won't last.", "charts": {"count": 3, "hot": false, "desc": "Global 50dma breadth by country, country-group A/D lines, Nasdaq RSI<30 November study"}, "link": "https://www.chartstorm.info/p/weekly-s-and-p500-chartstorm-15-november-f1e"}, {"id": 3, "cat": "AI/infra", "urgency": "deep", "source": "Callum Thomas / Weekly S&P500 ChartStorm", "title": "Semis are down 30% from June, yet SOX on 2-year forward P/E is nearly as cheap as 2011", "idea": "Semis peaked in June, have fallen about 30% and now sit at key support. On price to 2-year forward earnings the SOX is nearly as cheap as in 2011, and cheaper than in 2020 or 2022. Thomas's read: the market rejects either the estimates or how long they last, since most capex projections peak in 2027.", "angle": "A 2011-level multiple prices a capex cliff. If 2027 capex guidance holds through NVDA and hyperscaler Q4 calls, this is the cheapest entry of the cycle. If it slips, the 'E' gets cut and the multiple isn't really cheap.", "tweetA": "SOX at a 2-year forward P/E last seen in 2011, while hyperscalers are still guiding capex higher. The market doesn't believe the E. Fine, but in 2022 it didn't believe the E either. $SMH $SOXX", "tweetB": "Something down 30% can fall another 30%. The real question about 'cheap' semis is whether 2027 is the capex peak, as most models say. If it is, forward earnings are a mirage, and a 2011 multiple on peak earnings is a value trap. $NVDA $AMD", "charts": {"count": 2, "hot": true, "desc": "🔥 SOX price to 2-yr forward earnings vs history (2011/2020/2022 lows); semis vs software since the AI era"}, "link": "https://www.chartstorm.info/p/weekly-s-and-p500-chartstorm-15-november-f1e"}, {"id": 4, "cat": "macro", "urgency": "deep", "source": "Callum Thomas / Weekly S&P500 ChartStorm", "title": "Furman: AI's stock-market wealth effect has done more for GDP than the data-center build itself", "idea": "Jason Furman's chart shows that rising stock prices 'because AI' have boosted the economy more than actual data-center construction. Household equity allocations are at records, now above real estate. That makes the economy fragile to a major equity drawdown, and the logic is circular.", "angle": "The macro bear case on AI is a wealth-effect reversal, not a capex bust. BTC -25%, NVDA -6 weeks and a Nasdaq that needed a bounce all feed straight into consumer spending through household balance sheets.", "tweetA": "Households now hold more in equities than in real estate. AI's biggest economic effect so far is the wealth effect, not the data centers. That makes the Fed's reaction function hostage to $NVDA. The 'Fed put' is now an AI put.", "tweetB": "Circular economy in one sentence: AI stocks rise → households spend → GDP holds up → AI capex is 'justified' → AI stocks rise. Run it in reverse and you don't need a single data center to be cancelled for a recession.", "charts": {"count": 1, "hot": true, "desc": "🔥 Furman: contribution to growth from AI-driven stock gains vs data-center investment; household equity allocation vs real estate"}, "link": "https://www.chartstorm.info/p/weekly-s-and-p500-chartstorm-15-november-f1e"}, {"id": 5, "cat": "macro", "urgency": "watch", "source": "Callum Thomas / Weekly S&P500 ChartStorm", "title": "Housing, Caterpillar and Tech are all topping in the 2000/2008/2022 pattern", "idea": "Jim Knarr highlights three leading gauges showing major topping patterns similar to 2000, 2008 and 2022: the Housing Index (US economy), Caterpillar (global cycle) and Technology (growth). Separately, recessions have historically never begun in year 3 of the presidential cycle. Thomas puts the odds above zero but sees the worst of the slowdown later, possibly slipping into 2028.", "angle": "CAT is the cleanest of the three to trade, because it is a global capex proxy that also carries the AI power and genset story. If CAT tops alongside housing, the 'AI offsets cyclical weakness' thesis breaks.", "tweetA": "Caterpillar has been trading as an AI power stock. Housing and Tech are making the same topping shape as CAT, and in 2000, 2008 and 2022 that combination meant the cycle was rolling over. $CAT $XHB $XLK", "tweetB": "'Recessions never start in year 3 of the presidential cycle.' That's a fact about the past, not a probability. With 2027 as year 3, a Democratic Congress, and capex expected to peak in 2027, this is the year to stress-test that rule.", "charts": {"count": 2, "hot": false, "desc": "Housing Index, CAT and Tech topping overlay (ChartMonitor); recession starts by presidential-cycle year (Baird/Detrick)"}, "link": "https://www.chartstorm.info/p/weekly-s-and-p500-chartstorm-15-november-f1e"}, {"id": 6, "cat": "positioning", "urgency": "deep", "source": "Callum Thomas / Weekly S&P500 ChartStorm", "title": "Foreigners are piling into US equities: add it to the dot-com folder", "idea": "Foreign flows into US assets have surged, and with market moves, foreign allocations to US assets are now skewed heavily toward equities. Thomas files it under 'things that look like dot com'. His 5-factor framework reads valuations expensive, positioning extended, sentiment bullish and monetary policy a headwind. Only macro/earnings and trend are still supportive. Stance: 'on-watch'.", "angle": "Foreigners buying US equities while the dollar is surging (see Hartnett/Innes this morning) is a reflexive loop: the dollar inflow makes the dollar rally, which makes US assets look better in local currency. It unwinds fast.", "tweetA": "Foreign money is scrambling into US stocks just as the dollar rips. That's not diversification, it's FX momentum plus equity momentum compounding on the same trade. The 1999–2000 version ended when both reversed at once. $DXY $SPY", "tweetB": "Four of five factors are flashing caution: valuation, positioning, sentiment and policy. The fifth, earnings, rests on AI capex. Foreign allocations skewed to US equities mean the last buyer is already in.", "charts": {"count": 2, "hot": false, "desc": "Foreign flows into US assets (TheStalwart); foreign allocation mix to US equities vs bonds"}, "link": "https://www.chartstorm.info/p/weekly-s-and-p500-chartstorm-15-november-f1e"}, {"id": 7, "cat": "positioning", "urgency": "deep", "source": "Callum Thomas / Weekly S&P500 ChartStorm", "title": "Equal-weight S&P is boxed in at 8500–9000", "idea": "SPXEW is still in a technical uptrend: higher highs and lows, above a rising 200dma, with solid 200dma breadth. But it is boxed between heavy resistance near 9000 and support at 8500, and breadth has traced a well-defined range since 2025. A break of 8500 would be 'a very bad sign for the cycle'.", "angle": "Clear lines make clear trades: fade 9000 and buy 8500 until one breaks. NVDA earnings is the likely trigger.", "tweetA": "SPXEW: 9000 resistance, 8500 support, and breadth range-bound since 2025. Three years of 'broadening' and the typical stock still can't escape a 6% box. $RSP", "tweetB": "The cap-weighted index tells you about 10 stocks. The equal-weight tells you about the economy, and it has been stuck in a range while the mega-caps carried the index. If 8500 breaks, the 'soft landing' story goes with it.", "charts": {"count": 2, "hot": false, "desc": "SPXEW with 8500/9000 levels; 200dma breadth range since 2025"}, "link": "https://www.chartstorm.info/p/weekly-s-and-p500-chartstorm-15-november-f1e"}, {"id": 8, "cat": "energy", "urgency": "deep", "source": "MacroEdge Oil & Gas Research", "title": "Permian's days as a rapid-response swing supplier are 'increasingly limited'", "idea": "Permian Resources co-CEO James Walter says the Permian may still grow, but its ability to respond quickly to global disruptions is fading. MacroEdge ties this to US inventory tightness that has built over 15 years, especially since 2014. E&Ps can no longer 'bet the company' on aggressive drilling, and capital-disciplined operators should outperform.", "angle": "If shale is no longer the swing barrel, the volatility floor on oil is structurally higher. That supports holding long-dated calls even in a glut year.", "tweetA": "The Permian is no longer the world's shock absorber. A co-CEO of a major Permian producer is saying so. Every oil bear model since 2015 assumed $80 brings on 1mbpd within a year, and that assumption just retired. $XOP $PR", "tweetB": "Here is the irony: the IEA projects a 4.5mbpd surplus in 2027 while US shale says it can't surge anymore. If OPEC+ and the Gulf restore supply, shale doesn't have to. If they can't, nobody else can either.", "charts": {"count": 0, "hot": false, "desc": "Charts inside: rig count, frac spread, Henry Hub and real price signals sections. Worth opening"}, "link": "https://macroedgeenergy.substack.com/p/oil-and-gas-research-weekly-macro-3cf"}, {"id": 9, "cat": "geopolitics", "urgency": "act", "source": "MacroEdge Oil & Gas Research", "title": "Iran strikes Bahrain with ballistic missiles as the 'escalation window' opens through mid-December", "idea": "MacroEdge reports fresh Iranian ballistic missile and drone strikes on Bahrain, which it reads as a lure to bait Trump into wider conflict. Hormuz flows have been rolling over since Nov 6 as Iran tightens control measures, and the Houthis advance in Yemen. With Iran's 'economic D-Day' set for mid-to-late December, someone (the US, Iran or Israel) likely blinks within 6 weeks. That supports an $80–82 WTI base and Henry Hub upside if winter storms stack up.", "angle": "This lands after the IEA glut headlines and a calm options market (see Innes). A Bahrain strike when vol is cheap is exactly when upside optionality pays.", "tweetA": "Iran hit Bahrain with ballistic missiles the same week the IEA declared a glut and Brent options compressed. The market is pricing calm in a 6-week window where someone has to blink. $USO $XLE", "tweetB": "Iran's logic: the broader the war, the longer it can play. America's constraint: a $45T debt load and a bond market that punishes escalation. One side is trying to drag it out and the other can't afford to, which favors Tehran.", "charts": {"count": 0, "hot": false, "desc": "Hormuz flow tracking and technicals inside. Worth opening"}, "link": "https://macroedgeenergy.substack.com/p/oil-and-gas-research-weekly-macro-3cf"}, {"id": 10, "cat": "geopolitics", "urgency": "watch", "source": "MacroEdge Oil & Gas Research", "title": "Cede Hormuz and the Bab, or risk a bond nightmare: the US deepwater-navy dilemma", "idea": "MacroEdge frames the US choice as binary. It can cede control of Hormuz and Bab el-Mandeb, signalling that asymmetric drones have devalued a 150-year-old deepwater navy and pivoting to the Western Hemisphere. Or it can escalate and risk 'a total bond and inflation nightmare' with almost $45T of debt. Energy and softs markets are being propped up by the SPR while demand sits at all-time highs.", "angle": "This matches the Foreign Affairs-style 'American age is over' essay in Hard Fork's digest. Two independent sources say the same thing: drones beat carriers. Defense procurement will follow, toward drones, counter-UAS and munitions, not hulls.", "tweetA": "Cheap drones have done more to end US naval dominance than any rival navy. If Washington exits Hormuz, the 'Western Hemisphere pivot' is the quiet start of a new security order. Watch LatAm energy and defense names. $KTOS $AVAV", "tweetB": "'We can't attack while yields are at X' started as a joke and is now policy. The 10-year has become a constraint on US foreign policy, which makes the bond market the most hawkish dove in Washington.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://macroedgeenergy.substack.com/p/oil-and-gas-research-weekly-macro-3cf"}, {"id": 11, "cat": "tech", "urgency": "watch", "source": "MacroEdge Oil & Gas Research", "title": "Massive recent cyber incidents are probably not coincidental", "idea": "MacroEdge flags a cyber component that has 'come into play in recent days'. It speculates that several large incidents are unlikely to be coincidental, whether they come from Iran alone or from another state unhappy with the US election results.", "angle": "Cyber is the asymmetric escalation channel that doesn't move oil prices but does move insurance, utilities and payments names. Worth tracking alongside the Hormuz countdown.", "tweetA": "Iranian missiles on Bahrain are the visible escalation. A run of 'unrelated' cyber incidents in the same week is the invisible one. The war premium is moving from crude to cyber. $CRWD $PANW", "tweetB": "If states are retaliating against a US election result through cyberattacks, the escalation ladder now has a rung below kinetic that nobody prices, and it hits grids and banks before it hits tankers.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://macroedgeenergy.substack.com/p/oil-and-gas-research-weekly-macro-3cf"}, {"id": 12, "cat": "crypto", "urgency": "act", "source": "The Market Ear", "title": "Perfect storm: BTC down ~25% since Oct 21, with ~$2B liquidated in the weekend flush", "idea": "Bitcoin has lost about a quarter of its value since October 21. The latest weekend flush liquidated nearly $2B, with a serious weekend volume spike (Marquee data). ETF outflows continue, leverage is being flushed, and buyers have 'seemingly disappeared'.", "angle": "A weekend volume spike with $2B of liquidations is usually closer to the end than the start. The tell is whether the Monday cash session brings ETF inflows or a seventh-plus day of outflows.", "tweetA": "BTC -25% in 25 days, $2B liquidated, and the biggest volume of the move on a weekend when TradFi is closed. Weekend flushes are what leverage looks like dying. Monday's ETF print tells you if anyone's left to buy. $BTC $IBIT", "tweetB": "Bitcoin was meant to be the hedge against everything wobbling. It just posted the worst month of any major asset while the S&P rallied. Its correlation is to liquidity, not to fear.", "charts": {"count": 2, "hot": false, "desc": "Weekend volume spike (Marquee), two charts"}, "link": "https://themarketear.com/posts/cYEHDMS4EG"}, {"id": 13, "cat": "crypto", "urgency": "act", "source": "The Market Ear", "title": "The 200dma break at ~$73k is where selling accelerated", "idea": "Selling accelerated after BTC broke its 200-day moving average around $73,000. The break turned a correction into a trend-following liquidation.", "angle": "CTAs and systematic crypto funds key off the 200dma. Reclaiming $73k is the level that flips them back, so it's the first resistance on any bounce.", "tweetA": "$73k was the 200dma. Below it, systematic sellers took over from discretionary ones. Every bounce now runs into the same wall: the level where trend followers were told to leave.", "tweetB": "Capital Wars says $70k is support. 0xJeff says $62–64k is being tested. Market Ear says the damage started at $73k. Three sources, three levels, one $11k band that will decide the year for $BTC.", "charts": {"count": 1, "hot": false, "desc": "BTC vs 200dma (secretsatoshis)"}, "link": "https://themarketear.com/posts/cA8BWVSekX"}, {"id": 14, "cat": "crypto", "urgency": "deep", "source": "The Market Ear", "title": "$2.35B left spot BTC ETFs over two weeks, seven straight days of selling", "idea": "According to The Block, $2.35B left spot BTC ETFs over the last two weeks, including seven consecutive days of outflows (Farside). Market Ear: 'The ETF bid has become the ETF offer.'", "angle": "The ETF was supposed to be sticky allocator money. Seven straight days of outflows suggests advisor and RIA rebalancing, not tourists.", "tweetA": "Spot BTC ETFs were sold as a one-way structural bid. $2.35B out in two weeks proves the plumbing works both ways. Allocators rebalance, and in a drawdown rebalancing means selling. $IBIT $FBTC", "tweetB": "Seven red ETF days in a row while the S&P rallied. If this were risk-off, equities would be selling too. It's a relative-value rotation out of crypto, and the next item suggests where the money went.", "charts": {"count": 1, "hot": false, "desc": "Daily spot BTC ETF flows (Farside)"}, "link": "https://themarketear.com/posts/cw3UV1G22O"}, {"id": 15, "cat": "crypto", "urgency": "deep", "source": "The Market Ear", "title": "MARA sold 40% of its BTC in six weeks to pay down loans and fund AI data centers", "idea": "MARA sold 13,597 BTC (about $1.1B) in six weeks, equal to 40% of its September-end holdings. It used $750M to repay BTC-backed loans, and future sales could fund its AI data-center ambitions. Including earlier disposals, MARA has sold more than 40,000 BTC in 2026.", "angle": "Miners pivoting to AI hosting are now forced sellers of the asset they mine. Every miner with an HPC pivot (CORZ, RIOT, CLSK, HUT) is a potential supply overhang for BTC.", "tweetA": "MARA sold 40,000+ BTC this year to fund AI data centers. The company that promised to HODL forever decided a GPU rack beats a coin, and that's the clearest market verdict on BTC vs AI returns you'll see. $MARA $BTC", "tweetB": "Miners hold roughly 2% of BTC supply, and every one with an AI-hosting pivot just became a seller with a use for the cash. Halving economics squeezed them, and now AI capex is giving them a reason to dump. $RIOT $CORZ $CLSK", "charts": {"count": 1, "hot": false, "desc": "MARA BTC holdings drawdown"}, "link": "https://themarketear.com/posts/cOYwGllCnC"}, {"id": 16, "cat": "crypto", "urgency": "watch", "source": "The Market Ear", "title": "BTC is below Strategy's average cost again", "idea": "Bitcoin is trading below Strategy's (MSTR) average purchase price again. Market Ear says the real question isn't forced liquidation. It's whether the market's most aggressive corporate buyer can keep providing the bid when everyone else is selling.", "angle": "MSTR's bid depends on its premium to NAV. Below cost basis, the premium compresses, so fresh issuance becomes dilutive and the reflexive bid shrinks.", "tweetA": "Strategy is underwater on its BTC again. The flywheel (issue stock at a premium, buy BTC, raise the premium) only spins one way. Below cost basis, the market's biggest buyer becomes its biggest question mark. $MSTR", "tweetB": "Nobody is forcing MSTR to sell. But a buyer who can't buy is functionally the same as a seller missing from the order book, and that's how a bid disappears without a single coin being sold.", "charts": {"count": 1, "hot": false, "desc": "BTC vs Strategy average cost (CoinDesk)"}, "link": "https://themarketear.com/posts/c5o6kyUG0R"}, {"id": 17, "cat": "crypto", "urgency": "deep", "source": "The Market Ear", "title": "Is the Anthropic IPO sucking the oxygen out of Bitcoin?", "idea": "Market Ear cites Strive's Matt Cole: BTC fell 19% in the 50 days before the SpaceX IPO and has fallen a similar 18% over the comparable stretch ahead of Anthropic's. The theory is that investors are selling liquid assets, BTC included, to raise cash for allocations. Miners sell BTC to fund AI infrastructure, and investors may sell BTC to buy the hottest AI IPO.", "angle": "If the theory holds, BTC should bounce after the Anthropic pricing as the cash-raise pressure lifts. That gives a dated, falsifiable trade setup.", "tweetA": "BTC fell 19% in the 50 days before SpaceX's IPO and 18% before Anthropic's. If mega-IPO allocations really drain crypto liquidity, the bottom is close to pricing day, and that's a calendar trade you can actually set. $BTC", "tweetB": "Supply side: miners sell BTC to build AI data centers. Demand side: investors sell BTC to buy Anthropic stock. Crypto has become the funding leg of the AI trade, the ATM the AI trade draws on.", "charts": {"count": 1, "hot": true, "desc": "🔥 BTC drawdown into the SpaceX IPO vs into the Anthropic IPO (50-day analog)"}, "link": "https://themarketear.com/posts/cMHCrHzK64"}, {"id": 18, "cat": "crypto", "urgency": "act", "source": "The Market Ear", "title": "Funding turned negative on Binance, OKX and Bybit", "idea": "Perp funding turned negative on Binance, OKX and Bybit on Nov 13. The market is no longer only liquidating longs: traders are now paying to be short.", "angle": "Negative funding across all three majors during a liquidation is the classic setup for a short squeeze. Combine it with a weekend volume climax and the bounce odds rise.", "tweetA": "Funding went negative on all three big venues. Shorts are now paying longs to hold their bets, after a 25% drop and a weekend liquidation climax. That's usually where squeezes are born, not where crashes start. $BTC", "tweetB": "Two weeks ago longs paid to stay long, and now shorts pay to stay short. Sentiment flipped completely in 14 days and the price merely fell 25%. Positioning moves faster than price.", "charts": {"count": 1, "hot": false, "desc": "Perp funding across Binance/OKX/Bybit (CoinGlass)"}, "link": "https://themarketear.com/posts/cUe4BJySCS"}, {"id": 19, "cat": "positioning", "urgency": "deep", "source": "The Market Ear", "title": "Three amigos: NVDA's longest red streak since 2012 and China's weakest stretch ever", "idea": "NVDA has closed red for 6 consecutive weeks, its longest losing streak since 2012. China's stock market has been red in 13 of the last 14 weeks, the weakest stretch in its history. Bitcoin tried to decouple, but 'gravity eventually reunited the three amigos'.", "angle": "BTC, NVDA and China are all liquidity-beta assets. A synchronized drawdown in all three points to a global liquidity squeeze (the strong dollar), not three separate stories.", "tweetA": "NVDA: 6 red weeks, the longest streak since 2012. China: 13 of 14 red weeks, the worst ever. BTC: -25%. Three 'unrelated' assets bleeding together is one trade, the dollar. $NVDA $FXI $BTC", "tweetB": "NVDA's last 6-week losing streak was 2012, right before a decade-long run. China at its worst stretch ever, with Beijing having every incentive to stimulate. Either this is the end of an era, or it's the setup of the decade.", "charts": {"count": 2, "hot": false, "desc": "NVDA weekly losing streak; China weekly red streak (barchart)"}, "link": "https://themarketear.com/posts/c3Qt0hOADU"}, {"id": 20, "cat": "geopolitics", "urgency": "deep", "source": "Marvin Liao / The Hard Fork", "title": "The Houthis can no longer assume Iran will outlast Saudi Arabia", "idea": "A quoted analysis argues that past Saudi campaigns against the Houthis failed because the conditions sustaining them stayed intact, above all an Iran able to resupply weapons, protect militias and run several theaters at once. For the first time, the Houthis can't count on that. Saudi Arabia is on the outs with Washington and fighting a two-front war, but 'wars often turn when the assumptions that sustained one side cease to hold.'", "angle": "Read against MacroEdge's note that the Houthis are 'advancing aggressively' in Yemen. One source sees Houthi momentum, the other a Houthi strategic ceiling. Bab el-Mandeb risk depends on which is right.", "tweetA": "MacroEdge says the Houthis are advancing. A Gulf analyst says their decade-old strategy just lost its foundation, because Iran can't resupply. Advancing while losing your supply line is how offensives collapse. Bab el-Mandeb could reopen sooner than tankers price.", "tweetB": "Since 2015 the Houthi strategy was simply to outlast. It works only if your patron outlasts too. An Iran economically cornered by mid-December changes the math for every proxy at once.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-nov-15th"}, {"id": 21, "cat": "geopolitics", "urgency": "deep", "source": "Marvin Liao / The Hard Fork", "title": "'The American age has come to an end': hamstrung by Iran, hiding munitions shortfalls", "idea": "A quoted essay (Lawrence Freedman-adjacent) argues the US is 'hiding problems rather than correcting them'. The Pentagon has forced out Stars and Stripes staff and ordered polygraphs in a probe of leaks about munitions shortages. 'As recently as February, few experts would have predicted that the United States… would end up so hamstrung by Iran.' The successor may not be China, but a chaotic era with more self-reliant democracies.", "angle": "If allies conclude they must self-arm, European and Asian defense budgets keep re-rating no matter what happens in Ukraine. The winners are allied primes and munitions makers, not US hulls.", "tweetA": "Polygraphs over leaks about munitions shortages tell you the shortages are real. The defense trade for 2027 isn't 'US primes', it's every ally that just realized it has to buy its own shells. $RHM $BAESY $HAG", "tweetB": "Every hegemon declines, and the transition is never obvious while it happens. In February nobody had Iran stalemating the US on their bingo card. That's what a regime change in world order looks like from the inside.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-nov-15th"}, {"id": 22, "cat": "science", "urgency": "deep", "source": "Marvin Liao / The Hard Fork", "title": "Over 300 single points of failure in US munitions: only one Western TNT producer is left", "idea": "The munitions industrial base has 300+ single points of failure. The US stopped making TNT in the 1980s and became partly reliant on China. Poland's Nitro-Chem is effectively the only Western producer. A new Kentucky TNT plant won't produce until 2029, and its contractor is Repkon USA, a unit of the Turkish firm tied to the Mesquite 155mm scandal. RDX/HMX synthesis starts in 2031. The sites are Government-Owned, Contractor-Operated; the private sector has never made independent energetics bets 'until now'.", "angle": "Energetics is the bottleneck under every shell, missile and drone warhead. A first private-capital energetics startup cycle is starting, with a venture angle (hard tech) and a listed angle (chemicals with defense contracts).", "tweetA": "The US can't fill a 155mm shell without TNT from one Polish company. First new US TNT comes in 2029, from a Turkish contractor's subsidiary. Forget the hypersonics debate. America's defense ceiling is a 1940s chemical. $GD $NOC", "tweetB": "300 single points of failure in munitions, and one TNT plant for the entire West. That's the supply-chain physics of deterrence. The first VC-backed energetics company is a better defense bet than another drone startup.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-nov-15th"}, {"id": 23, "cat": "AI/infra", "urgency": "deep", "source": "Marvin Liao / The Hard Fork", "title": "The labs are copying Palantir: $30B deployed and 9,000+ forward-deployed engineers hired", "idea": "In four months OpenAI, Anthropic, Google, Meta and Microsoft deployed $30B of capital. They acquired or funded four ex-Palantir companies (Tomoro, Fractional, Northslope, Thrive Holdings), partnered with the largest PE firms (Blackstone, TPG, Bain, Thoma Bravo) and set out to hire 9,000+ FDEs, the headcount of two Palantirs. Microsoft even named its platform 'Foundry'. The essay's thesis: Palantir actually solved connecting computation to institutional knowledge without destroying sovereignty, which the labs 'don't grok'.", "angle": "As tokens get cheaper, value moves to permissioned institutional context and deployment labor. That's bullish for PLTR's moat and for services-heavy AI integrators, and margin-dilutive for labs that have to hire armies of engineers.", "tweetA": "OpenAI, Anthropic, Google, Meta and Microsoft are hiring 9,000 forward-deployed engineers, two Palantirs' worth. When your competitors' best strategy is to clone your org chart, the moat was never the software. $PLTR", "tweetB": "Cheap tokens make the prompt and the permission more valuable than the model. The labs are now spending $30B to buy the one thing they can't train on: access inside the institution. That's a services business with an AI label. $MSFT $PLTR", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-nov-15th"}, {"id": 24, "cat": "venture", "urgency": "deep", "source": "Marvin Liao / The Hard Fork", "title": "Anjney Midha: Anthropic check at <$1B, OpenRouter at $50M → $7.5B, and now a 'national grid of compute'", "idea": "Midha cut Anthropic an early check in 2021 at under a $1B valuation, using much of his family savings, and its IPO could value it at up to $2T. At a16z he co-led a 20% stake in OpenRouter at about $50M in 2025, and Stripe just agreed to buy it for $7.5B. His new firm AMP raised $1.3B, much of it into Anthropic's February round at $380B, and is incubating a startup to launch as a 'national grid of compute' that matches AI startups to available capacity.", "angle": "OpenRouter at $7.5B (150x in about a year) shows that model-routing and compute-brokering layers are being valued as infrastructure. A compute 'grid' operator is the next layer, essentially a power-market structure applied to GPUs.", "tweetA": "OpenRouter: 20% bought at a $50M valuation in 2025, sold to Stripe for $7.5B in 2026. That's 150x in a year for a model router. The AI middleware layer is being priced like payments, which might be exactly why Stripe bought it.", "tweetB": "Anthropic went from under $1B to $380B to a possible $2T IPO in five years. The same investor's next bet is a 'national grid of compute', so the VCs who called the models are now betting the scarce asset is GPU allocation, not intelligence.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-nov-15th"}, {"id": 25, "cat": "AI/infra", "urgency": "deep", "source": "Marvin Liao / The Hard Fork", "title": "US has 10x+ the effective compute of all Chinese labs combined, but energy and attention are its deficits", "idea": "A VC back from China argues the US has more than 10x the effective compute of every Chinese lab combined, the frontier models, and a structural (not temporary) lead in long-horizon agentic work. US deficits: energy (a 5–10 year permitting problem) and attention ('they study us far more closely'). China's AI sector is 'a thousand exhausted competitors just trying to survive', and that involution breeds excellent engineers. 'When you trail the frontier, openness maximizes reputation per unit of capability; the moment you lead, you close.'", "angle": "Doomberg's data says China has 24GW of DCs operating and 50GW in the pipeline vs 56GW in the US. The energy deficit this VC names is already closing in China's favor, while US voters block data centers.", "tweetA": "'When you trail, you open-source; when you lead, you close.' That's the cleanest framework for Chinese open weights I've seen. The day DeepSeek stops releasing weights is the day you know the gap has closed.", "tweetB": "10x the compute, but the binding constraint is energy, and 40 of 41 US data-center ballot measures just went against building. America's AI lead is now a permitting race, and China doesn't hold elections on substations.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-nov-15th"}, {"id": 26, "cat": "labor", "urgency": "deep", "source": "Marvin Liao / The Hard Fork", "title": "Squeezed middle: under $1.5M of wealth with 50–60% tied up in the home", "idea": "A quoted note argues that the 'middle', anyone with roughly $1.5M or less, has 50–60% of its wealth in a primary residence expected to be flat to down. With half their wealth not compounding, 'even T-bills and bonds could beat the middle of the road person'. Rates hit 95% of the country disproportionately.", "angle": "Pair it with Furman's wealth-effect chart: the top decile's wealth effect is in equities, the middle's is in housing. A K-shaped wealth effect implies K-shaped consumption, which favors premium over mass-market consumer names.", "tweetA": "The top 10% are levered to AI stocks and the middle 90% are levered to a house that won't appreciate. That's the whole K-shaped economy in one balance sheet, and it's why Walmart and LVMH can both be right.", "tweetB": "If half your net worth is a flat house and the T-bill beats you, the rational move is to stop spending. The consumer slowdown won't show up as job losses first. It shows up as a middle class that quietly stops feeling richer.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-nov-15th"}, {"id": 27, "cat": "culture", "urgency": "watch", "source": "Marvin Liao / The Hard Fork", "title": "The financialization of romance in China: beauty has a score, attention has a price", "idea": "A discussion of Chinese dating culture finds pricing has become explicit. Beauty has a score, attention a price, emotional support a value. A woman can be 'held too cheaply'. A man can search for an 'undervalued' woman, and love can be treated as 'excessive exposure'. What's new is not materialism but explicitness.", "angle": "Romance described in portfolio language is a demographic signal. China's marriage and birth rates keep falling, and that weighs on long-run consumption, housing demand and the wedding/baby economy.", "tweetA": "Chinese daters now call partners 'undervalued' and love 'excessive exposure'. When romance gets a risk-management vocabulary, the fertility chart was never going to turn. Short the baby economy, long the solo economy. $FXI", "tweetB": "China's youth didn't stop believing in love. They started pricing it, and a society that prices romance like an asset will under-allocate to it like a risky one. This is the cultural layer under every Chinese demographic forecast.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-nov-15th"}, {"id": 28, "cat": "tech", "urgency": "deep", "source": "Marvin Liao / The Hard Fork", "title": "Cleveland Clinic's sepsis AI cut mortality 41%, which would mean 140k lives a year if scaled", "idea": "Sepsis kills about 350,000 Americans a year and is treatable with antibiotics if caught early; detection is the hard part. Cleveland Clinic deployed an AI model that cut its sepsis mortality rate by 41% (via Josh Tyrangiel's book *AI for Good*). Deployed across US healthcare, that could save more than 140,000 lives a year.", "angle": "Clinical AI with hard mortality outcomes is what gets reimbursed. It's a counter-narrative to the populist backlash against data centers in the midterms.", "tweetA": "A 41% drop in sepsis deaths from a single AI deployment. At 350k deaths a year, that's 140,000 lives annually if scaled. Voters just rejected 40 of 41 data-center measures. Nobody put this on the ballot.", "tweetB": "The AI debate is about chatbots and power bills. The real ROI is a model that spots sepsis hours earlier than a nurse can. Healthcare is where AI's value is measured in lives, and payers will pay for that before they pay for copilots.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-nov-15th"}, {"id": 29, "cat": "regulation", "urgency": "deep", "source": "Marvin Liao / The Hard Fork", "title": "US reindustrialization means strategic self-sufficiency, not autarky", "idea": "A quoted research note argues the US won't rebuild every supply chain domestically and shouldn't try. The goal is strategic self-sufficiency in energy, semiconductors, aerospace & defense, rare earths, pharma and advanced-manufacturing technologies. Progress will be uneven: labor shortages, power constraints, cost overruns and policy changes. The result will be more automated than the 1950s economy.", "angle": "'Strategic sectors' is the government's shopping list. Rare earths and pharma APIs are the least crowded of the six.", "tweetA": "Six sectors on Washington's reindustrialization list: energy, semis, A&D, rare earths, pharma, advanced manufacturing. Everyone owns semis and defense. Rare earths and pharma APIs are where the policy money flows with the least competition. $MP $USAR", "tweetB": "'More automated, more resilient' is the polite way to say reshored factories will hire robots, not people. The reindustrialization trade is a robotics trade, and the largest robotics ETF is down 5% YTD.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-nov-15th"}, {"id": 30, "cat": "venture", "urgency": "watch", "source": "Marvin Liao / The Hard Fork", "title": "The largest robotics ETF is down 5% YTD while private robotics raises billions", "idea": "A quoted note points out a public/private disconnect. The largest robotics ETF is down 5% for the year while early-stage investors pour billions into private robotics companies. The argument: robotics' 'ah-ha moment' thanks to AI is coming, and you can position in public names at attractive valuations now.", "angle": "Public/private valuation gaps close either by private markdowns or by public re-ratings. The Anthropic IPO could pull the AI-adjacent IPO window open, letting private robotics companies list and reprice the public comps.", "tweetA": "Private robotics raising billions, while the biggest public robotics ETF is red YTD. Either the VCs are wrong or the public market is asleep. Since Anthropic's IPO is about to set the AI multiple, I'd bet on the re-rating. $BOTZ $ROBO", "tweetB": "The humanoid hype is private and the public robotics names are the boring industrial ones (Fanuc, Yaskawa, ABB). The ah-ha moment, if it comes, reprices the boring ones first.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-nov-15th"}, {"id": 31, "cat": "geopolitics", "urgency": "watch", "source": "Marvin Liao / The Hard Fork", "title": "Central Asia flipped from pass-through to necessary between 2022 and 2026", "idea": "A quoted piece argues Central Asia spent a century as somewhere great powers passed through or fought over, never needed. Since 2022, Russia's war has rerouted trade through Kazakhstan, the US-China minerals rivalry has made Kazakh ground strategic, Europe has courted Kazakh oil and gas, and global capital now treats Kazakh companies and Uzbekistan's startups as investable. The open question is whether they gain durable independence or trade one dependency for a wealthier version of it.", "angle": "Kazakhstan is a uranium (KAP), critical-minerals and Middle Corridor logistics play, all of which strengthen if Hormuz stays contested.", "tweetA": "Kazakhstan: uranium, critical minerals, a non-Russian corridor to Europe, and oil that doesn't sail through Hormuz. Four great-power needs met by one country nobody covers. $KAP $URA", "tweetB": "For a century Central Asia was the board great powers played on. Now it's a player, because every war since 2022 has rerouted something through it. Being needed by everyone is leverage, until two buyers demand you pick a side.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-nov-15th"}, {"id": 32, "cat": "culture", "urgency": "watch", "source": "Marvin Liao / The Hard Fork", "title": "Confidence erodes first: a leading indicator for personal collapse", "idea": "A quoted essay argues that declining self-confidence predicts depression, job loss and relationship problems. By the time the breakdown, firing or breakup happens, 'it's already a lagging signal'. The modern environment is 'actively engineered to undermine' it.", "angle": "Consumer confidence works the same way at the aggregate level. Sentiment surveys lead spending, and the squeezed middle (see the wealth item above) is where confidence erodes first.", "tweetA": "'By the time the crash happens, it's a lagging signal. The confidence went first.' Swap 'person' for 'consumer' and that's macro. Watch confidence surveys, not retail sales.", "tweetB": "Self-doubt shows up weeks before the breakdown, as avoidance, second-guessing and withdrawal. Markets show the same pattern: liquidity goes first, then breadth, then price. The behavior is the leading indicator and the event is the lagging one.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-nov-15th"}, {"id": 33, "cat": "venture", "urgency": "watch", "source": "Marvin Liao / The Hard Fork", "title": "Bending Spoons: the anti-Silicon Valley compounder", "idea": "Marvin highlights several interviews and a deep dive on Bending Spoons, the Italian acquirer that buys and re-engineers mature consumer software (Evernote, WeTransfer, Vimeo, AOL). He calls it 'one of the more interesting companies of the last decade' and an anti-Silicon Valley bet. The interviews 'make me want to buy Bending Spoons stock'.", "angle": "A roll-up of mature software that cuts headcount aggressively is the AI-era playbook. AI coding tools make operating legacy apps with tiny teams cheaper still.", "tweetA": "Bending Spoons buys software companies the market thinks are dead and runs them with a fraction of the staff. In an age of AI coding agents, that's no longer contrarian, it's the default model for every mature SaaS.", "tweetB": "Silicon Valley builds new apps. Bending Spoons buys old ones and keeps the cash flows. When AI drives down the cost of maintaining code, the buyer of legacy software gets the margin expansion, not the builder.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/marvins-best-weekly-reads-nov-15th"}, {"id": 34, "cat": "AI/infra", "urgency": "deep", "source": "Doomberg", "title": "China: 24GW of operational data centers, 50GW more coming, 89 in a single Inner Mongolia hub", "idea": "Citing SemiAnalysis, Doomberg reports China has 24GW of operational data-center capacity, more than the rest of Asia combined but under half the US's 56GW. Another 50GW is under construction or announced. Ulanqab in Inner Mongolia alone has 89 data centers built or planned, as Beijing turns cheap hinterland power and land into an AI advantage. Doomberg's core claim: China builds faster and cheaper, including the power plants.", "angle": "24 + 50 = 74GW, which puts China ahead of today's US base, and with the US now facing local referendums on every project, the gap could flip by about 2028.", "tweetA": "China: 24GW of data centers running, 50GW in the pipeline. US: 56GW, and voters just killed 40 of 41 ballot measures that would have built more. Do the addition. The AI race is becoming a power-plant race, and only one side holds referendums on substations.", "tweetB": "89 data centers in one Inner Mongolian city. Ulanqab has more planned compute than most countries. The US compute lead (10x per the VCs) is real, but compute follows power, and power follows permitting.", "charts": {"count": 0, "hot": false, "desc": "Charts inside, worth opening"}, "link": "https://newsletter.doomberg.com/p/lame-duck-a-lorange"}, {"id": 35, "cat": "regulation", "urgency": "act", "source": "Doomberg", "title": "Midterms rout: 40 of 41 data-center ballot measures sought restrictions, and voters backed them across 10 states", "idea": "In the Nov 3 midterms, voters across 10 states backed data-center restrictions or rejected proposals (Reuters, Redbud Consulting). 40 of the 41 measures aimed to restrict them. In most counties with such measures, Senate votes shifted toward Democrats vs 2024, which signals potential tighter oversight from a Democrat-led Congress.", "angle": "Data-center NIMBYism is now an electoral force. Sites with existing interconnects and friendly jurisdictions (TX, behind-the-meter gas) become scarce assets, so grid-connected, permitted land is worth more.", "tweetA": "40 of 41 data-center ballot measures were anti-build, and voters agreed in 10 states. The scarcest asset in AI isn't GPUs, it's a permitted site with a grid connection. Already-powered land just re-rated. $VRT $EQIX $DLR", "tweetB": "A Democrat-led Congress just won counties where data centers were on the ballot. Hyperscaler capex guidance assumes sites get built. Nobody modelled the voter as a supply constraint.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://newsletter.doomberg.com/p/lame-duck-a-lorange"}, {"id": 36, "cat": "energy", "urgency": "act", "source": "Doomberg", "title": "Lame-duck permitting overhaul could be the biggest AI event of 2026, bigger than the Jensen affair", "idea": "Doomberg says a bill to overhaul US energy permitting has its best chance of becoming law in the lame-duck session. If it passes, expect a 'globally relevant boom' in oil, gas, wind, solar and nuclear development, and many 'left-for-dead' data-center projects would become viable again. Doomberg rates the Jensen Huang affair 'at best' the second-most impactful AI event of late 2026.", "angle": "A binary catalyst inside 6 weeks: if the bill passes, it's bullish for gas turbines, transmission, nuclear and permitted-but-stalled DC developers. Most of the market is watching NVDA's CEO, not Congress.", "tweetA": "Everyone is watching who runs Nvidia. Doomberg says the bigger AI event of 2026 might be a permitting bill in a lame-duck Congress. GPUs don't matter if you can't plug them in. $GEV $CEG $VST", "tweetB": "A lame-duck Congress is the only window where a Senate can pass something voters just rejected at the ballot box. If permitting reform clears in December, the midterm data-center revolt gets overruled within six weeks.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://newsletter.doomberg.com/p/lame-duck-a-lorange"}, {"id": 37, "cat": "energy", "urgency": "deep", "source": "Stephen Innes / Dark Side Of The Boom (Oil Weekly)", "title": "An 8mbpd swing in 7 months: from a 6.3mbpd deficit to a 2mbpd surplus", "idea": "Per the IEA, October production exceeded consumption by almost 2mbpd, reversing a deficit that hit 6.3mbpd when the US-Iran war erupted. The surplus is projected to reach 4.5mbpd by Q2 2027, possibly the largest quarterly imbalance in 7 years. Demand is projected to fall 2.7mbpd this year and not regain 2025 levels until 2028. Brent is down about 18% this month to $95.84.", "angle": "Demand -2.7mbpd in a non-recession year is the buried number. That's demand destruction from $100+ oil, and it won't snap back when prices fall.", "tweetA": "World oil demand fell 2.7mbpd this year and won't regain 2025 levels until 2028, per the IEA. That's not a recession, it's a price shock teaching the world to use less. The 4.5mbpd 2027 glut is half supply and half permanent behavior change. $BNO", "tweetB": "8mbpd swing in seven months. If a broker modeled that in February, they'd have been laughed out of the room. And Brent is still $95. A record glut forecast and $95 oil can only coexist because the tanks are empty.", "charts": {"count": 1, "hot": true, "desc": "🔥 IEA global balance: from a 6mbpd+ deficit in March to a ~2mbpd surplus in October"}, "link": "https://thedarksideoftheboom.substack.com/p/oil-market-weekly-the-glut-is-back"}, {"id": 38, "cat": "energy", "urgency": "deep", "source": "Stephen Innes / Dark Side Of The Boom (Oil Weekly)", "title": "The flow problem is fixed, the inventory problem isn't: refined products are still depleted", "idea": "Observed inventories rose 1.7mbpd in October, the first build since June, after three months of draws averaging 1.9mbpd. Morgan Stanley tracked 11.8M barrels entering storage in one November week. But JPMorgan's chart shows refined-product stocks well below recent years, with Middle Eastern refinery exports hit by Hormuz risk and Ukraine hitting Russian refineries. Aramco says global inventories could take two years to rebuild.", "angle": "Crude falling while diesel and jet stay tight means crack spreads stay wide. Long refiners over producers, and a reason headline-CPI relief won't reach the core inflation the Fed watches.", "tweetA": "Brent is down 18% but diesel and jet are still expensive, because the oil got fixed and the refineries didn't. The disinflation everyone expects from cheaper crude stops at the refinery gate. $VLO $MPC $PSX", "tweetB": "Aramco: two years to rebuild global inventories. Restocking demand is a hidden 1–2mbpd buyer that soaks up the 'glut' before it shows up in price, and the IEA counts it as surplus.", "charts": {"count": 1, "hot": false, "desc": "JPMorgan: crude vs refined-product inventories relative to recent years"}, "link": "https://thedarksideoftheboom.substack.com/p/oil-market-weekly-the-glut-is-back"}, {"id": 39, "cat": "energy", "urgency": "watch", "source": "Stephen Innes / Dark Side Of The Boom (Oil Weekly)", "title": "Brent options price a narrower world, but Gulf flows still ride on US naval escorts", "idea": "The Brent options-implied distribution has compressed sharply from May to Nov 11, with much less upside tail priced. Innes: 'more concentrated, not necessarily more accurate'. Compressed premiums make protection relatively attractive. The irony is that earlier in the year traders feared US military action would cut Gulf supply, and now US naval escorts keep it moving. Remove the escorts early and the fat tail returns.", "angle": "MacroEdge's Bahrain-strike report landed the same weekend. Cheap upside calls on Brent with Dec/Jan expiry match the 6-week 'someone blinks' window.", "tweetA": "The options market priced away the Hormuz tail just as Iran fired ballistic missiles at Bahrain. Cheap vol plus a hard deadline (Iran's mid-December economic D-Day) is the asymmetric setup. Long Brent Jan calls.", "tweetB": "The irony: the US Navy was the oil market's biggest risk in March and is its only insurance in November. The day escorts end is the day the implied distribution widens again. That's a policy decision, not a forecast.", "charts": {"count": 1, "hot": false, "desc": "Brent options-implied price distribution, May vs Nov 11"}, "link": "https://thedarksideoftheboom.substack.com/p/oil-market-weekly-the-glut-is-back"}, {"id": 40, "cat": "positioning", "urgency": "deep", "source": "The Blind Squirrel", "title": "20 stocks for 20 years: the consumer and healthcare sleeve", "idea": "Blind Squirrel's '20-for-20' project (started in August) picks 20 stocks to hold for 20 years. This week covers consumer and healthcare: 'Folk will still be eating, seeking experiences and getting sick in 2046. Figuring out who will be capturing the economics is much harder!' The podcast episode is 'Time Please, Gentlemen!'.", "angle": "Twenty-year consumer/healthcare picks must survive GLP-1s, AI diagnostics (see Cleveland Clinic sepsis) and an aging population. Those three forces decide who captures the economics.", "tweetA": "Picking 2046's consumer winners means picking who survives GLP-1s cutting calories, AI cutting diagnosis costs, and demographics cutting the customer count. Demand will still be there. The question is whose margin it lands in.", "tweetB": "'People will still eat and get sick in 2046' is the easy half. The hard half: in 20 years, does the value sit with the brand, the distributor, or the algorithm that tells you what to buy? $COST $LLY", "charts": {"count": 0, "hot": false, "desc": "Podcast plus paywalled post. Worth opening for the picks"}, "link": "https://www.blindsquirrelmacro.com/p/time-please-gentlemen"}, {"id": 41, "cat": "geopolitics", "urgency": "watch", "source": "Peter Frankopan / Global Threads", "title": "Indonesia wants a much bigger share of its mineral wealth", "idea": "Frankopan's new weekend round-up flags Indonesia's plans to claim a much larger share of its mineral wealth as an under-covered story with implications 'well beyond' Indonesia. Indonesia is the world's dominant nickel supplier after its export-ban, downstreaming model.", "angle": "Resource nationalism from the nickel kingpin pushes up EV battery and stainless input costs. It's also a template other mineral states (DRC, Chile, Kazakhstan) will copy.", "tweetA": "Indonesia used an ore export ban to become the world's nickel refinery. Now it wants a bigger cut. Every critical-minerals state is watching, and resource nationalism is the cheapest policy a commodity government can run. $VALE", "tweetB": "The West's critical-minerals strategy assumes it can buy from friendly producers. Indonesia's message is that friendly is priced in, and the cut is going up.", "charts": {"count": 0, "hot": false, "desc": "Paywalled; topic list only"}, "link": "https://peterfrankopan.substack.com/p/global-threads-in-5-minutes-weekend"}, {"id": 42, "cat": "geopolitics", "urgency": "watch", "source": "Peter Frankopan / Global Threads", "title": "India–Pakistan opening, China's Middle East/Africa push, and a Chile–Argentina Falklands row", "idea": "Frankopan's other three under-covered stories: an unexpected diplomatic opening between India and Pakistan, China's diplomatic push across the Middle East and Africa, and a row between Chile and Argentina over a cargo ship sailing to the Falkland Islands. He also says historical posts will now be free and contemporary geopolitics paid.", "angle": "China's diplomatic push into the Gulf and Africa fits the 'US cedes Hormuz' scenario in MacroEdge. China fills whatever vacuum Washington leaves.", "tweetA": "While Washington debates leaving Hormuz, Beijing is touring the Middle East and Africa. Vacuums don't stay empty. The 'Western Hemisphere pivot' has a mirror image, and it's Chinese.", "tweetB": "An India–Pakistan thaw would be the most under-priced positive in Asia: lower defense risk premium, trade corridors reopening. Nobody covers it because nothing has blown up.", "charts": {"count": 0, "hot": false, "desc": "Paywalled; topic list only"}, "link": "https://peterfrankopan.substack.com/p/global-threads-in-5-minutes-weekend"}, {"id": 43, "cat": "AI/infra", "urgency": "deep", "source": "Sebastian Raschka / Ahead of AI", "title": "Partial RoPE went from minority to majority in 2026 open models, and Raschka says it's 'hardly worth it'", "idea": "In Raschka's LLM Architecture Gallery, RoPE is still the most common position method but its share is falling through 2026. Among RoPE models, partial RoPE (rotating only some dims per head) went from a minority in 2025 to a majority in both 2026 cohorts. Example: MiniMax-M3 rotates 64 of 128 dims, saving just 128MiB at 1M context in BF16, and the KV cache stays full size. A study found rotating ~10% of features matches full RoPE on most evals.", "angle": "Architecture convergence on cheaper attention tricks is a signal that labs are optimizing memory/bandwidth at long context. The KV cache, not compute, is the binding constraint, which matters for HBM demand.", "tweetA": "Partial RoPE is now the majority in 2026 open models, and it saves only 128MB at a 1M-token context. Architecture teams are chasing every byte because the KV cache, not FLOPs, is the bottleneck. That's an HBM story. $MU $SKHYNIX", "tweetB": "RoPE (2021) is still the default position method in 2026. In a field that reinvents itself every six months, the boring building block won. The real innovation is in what gets skipped, not added.", "charts": {"count": 3, "hot": false, "desc": "Positional-method share 2025 vs 2026 cohorts; partial-RoPE share among RoPE models; 2026 gallery labeled by position type"}, "link": "https://magazine.sebastianraschka.com/p/understanding-positional-embeddings"}, {"id": 44, "cat": "AI/infra", "urgency": "watch", "source": "Sebastian Raschka / Ahead of AI", "title": "NoPE/RoPE hybrids and Inkling's learned bias: position encoding is starting to fragment", "idea": "More models now mix RoPE and NoPE layers. SmolLM3 (3B) applies RoPE in 3 of every 4 layers, which its authors say improves long context. All NoPE-only models are recurrent hybrids. Thinky's Inkling revives a T5-style learned relative position bias, conditioned on the query's hidden state, in both sliding-window and global layers. Raschka expects more Inkling-like designs in 2027.", "angle": "Long-context generalization is the frontier fight, and length extrapolation without retraining lowers inference cost per useful token.", "tweetA": "SmolLM3 drops position encoding in every 4th layer and gets better long context. Sometimes the fix is giving the model less information. That's the most counterintuitive design pattern in LLMs right now.", "tweetB": "Inkling brought back a 2019 T5 idea and made it work at the frontier. The AI arms race isn't only new ideas, it's old ideas that finally have the compute. Expect 2027 architectures to raid the 2018–2020 paper archive.", "charts": {"count": 2, "hot": false, "desc": "NoPE toy example; Inkling relative-bias diagram"}, "link": "https://magazine.sebastianraschka.com/p/understanding-positional-embeddings"}, {"id": 45, "cat": "science", "urgency": "deep", "source": "Sebastian Raschka / Ahead of AI", "title": "Why GPT-2-style learned positions died: at 100k context they'd be >22% of model weights", "idea": "GPT-2 Medium's learned positional table is just 0.30% of weights at 1,024 positions. At today's ~100k context it would be over 22% of total weights, which is why the field moved to RoPE's computed rotations. The causal mask itself leaks order: a NoPE layer can recover position as 1/prefix-length.", "angle": "A good explainer of why context length forced architectural change. Useful when discussing whether long-context costs scale linearly.", "tweetA": "GPT-2's position table: 0.3% of weights at 1k tokens, more than 22% at 100k. Long context didn't just need more memory, it forced a completely different way of telling a model where it is.", "tweetB": "Fun fact: a transformer with no position encoding still knows word order, because the causal mask lets it count. Attention averaging over a prefix gives you 1/n, and the model learns to read that as 'position'.", "charts": {"count": 2, "hot": false, "desc": "GPT-2 vs MiniMax-M3 architecture; RoPE rotation diagrams"}, "link": "https://magazine.sebastianraschka.com/p/understanding-positional-embeddings"}, {"id": 46, "cat": "positioning", "urgency": "act", "source": "Macro Charts", "title": "MAX SHORT: Tech had its best week since September and semis since June, yet positioning is at max short", "idea": "Macro Charts: all S&P sectors rose this week and 79% of S&P stocks advanced (46% beat the index). Tech had its best week since September and semis since June. His Chart 1 headline is 'MAX SHORT. It's that time again…', a positioning extreme he is flagging. He weighs whether this is a dead-cat bounce or something more.", "angle": "Max-short positioning with semis already bouncing is squeeze fuel into NVDA earnings. ChartStorm's SOX-cheapness chart and Market Ear's negative BTC funding point the same way.", "tweetA": "Max short in the same week semis posted their best week since June. Shorts are adding into strength, and that usually ends with forced covering, not a new low. NVDA earnings is the match. $SMH $NVDA", "tweetB": "Three signals, three sources, one direction: Macro Charts says max short, Market Ear has negative BTC funding, ChartStorm has SOX at a 2011 multiple. The crowd is leaning one way going into the biggest print of the quarter.", "charts": {"count": 1, "hot": true, "desc": "🔥 Chart 1 'MAX SHORT' positioning gauge (paywalled; four more charts plus portfolio plan inside)"}, "link": "https://www.macrocharts.com/p/max-short"}, {"id": 47, "cat": "crypto", "urgency": "deep", "source": "Michael Howell / Capital Wars", "title": "Howell: a liquidity-led 'Big Thaw' for crypto in 2027", "idea": "Michael Howell stays long-term bullish on BTC and tactically bearish in 2026. Gold, silver and altcoins have struggled too, a hard year for 'monetary inflation hedges'. October's global liquidity rebound is encouraging but not yet sustained. A slowing world economy and pressure to ease could lift liquidity from mid-2027 or earlier. Near term, BTC is testing about $70k.", "angle": "Liquidity bottoms lead BTC by months. If Howell's mid-2027 turn is right, the next 3–6 months are an accumulation window, not a chase.", "tweetA": "Howell's call: crypto winter thaws when global liquidity turns, probably mid-2027. BTC is a liquidity sponge, so buy it when liquidity is bottoming and the headlines are about MARA dumping coins. $BTC", "tweetB": "Gold, silver, BTC and alts all struggled in 2026, every 'debasement hedge' at once. Either debasement is over, or the hedges got front-run by a strong dollar. Howell's bet is that the dollar breaks first.", "charts": {"count": 1, "hot": false, "desc": "Global Liquidity index vs BTC"}, "link": "https://capitalwars.substack.com/p/crypto-winter-is-the-ice-beginning"}, {"id": 48, "cat": "crypto", "urgency": "deep", "source": "Michael Howell / Capital Wars", "title": "Intensive vs extensive margin: a framework for Bitcoin adoption", "idea": "Howell splits BTC demand in two. The intensive margin is the share of a representative investor's portfolio in BTC, which cycles with liquidity. The extensive margin is adoption across the wider investor universe, which follows an S-curve like TVs and mobile phones. The structural case (adoption plus monetary inflation) and the cyclical case (liquidity) work on different horizons.", "angle": "Right now the intensive margin is collapsing (ETF outflows, MARA selling) while the extensive margin is unchanged. That's the classic condition for a cyclical, not structural, bear.", "tweetA": "Intensive margin: how much BTC each holder owns, and it's collapsing (ETF outflows, MARA selling). Extensive margin: how many people own any, and it's still on its S-curve. Bears are trading the first while long-term holders bet on the second.", "tweetB": "TVs and mobile phones both had brutal cyclical drawdowns on the way up their adoption S-curves. Howell's framework says 2026 is a dip on the curve, not the top of it. Falsifiable: watch wallet growth, not price.", "charts": {"count": 1, "hot": false, "desc": "Adoption S-curve benchmark (TV/mobile diffusion)"}, "link": "https://capitalwars.substack.com/p/crypto-winter-is-the-ice-beginning"}];

}

    h+='<div class="chart'+(ch.hot?' hot':'')+'">📊 Charts: '+ch.count+(ch.desc?' — '+esc(ch.desc):'')+'</div>';

}
