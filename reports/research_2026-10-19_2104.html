  "idea": "Producing another E. coli (~0.3 pg) costs ~10 billion ATP, made from 2-3 billion glucose molecules; one 4g sugar cube is enough for ~5 trillion cells, and lifting a small apple 1 metre equals the energy to build a billion cells. A cell holds ~2M proteins, DNA is only 3% of dry mass and protein 55%. Yet no one has built life from inert molecules because ingredients aren't a recipe: noise (genetically identical cells vary by ~40% SD in protein expression) and fault tolerance dominate.",

  "title": "Cells ignore absolute concentration and compute fold-changes: chemotaxis, 1 mg in 2,300 litres",
  "idea": "E. coli chemotaxis responds to relative, not absolute, concentration (1 to 3 and 10 to 30 are both a 3x increase), letting the same sensor work across wildly different environments. It can detect an amino acid at 1 mg in 2,300 litres of water. A 2020 study showed isoleucine-starved cells appearing dead for 70 hours before a mutant subpopulation rewired metabolism and recovered, an example of population-level fault tolerance.",
  "angle": "A design principle for sensors and for portfolio risk: respond to ratios and regime changes, not levels. Also evolution-by-selection beats precise design in noisy systems.",

 "itemsExtracted": 35
};
var COL={macro:"#e24b4a",credit:"#378add",positioning:"#ef9f27","AI/infra":"#1d9e75",crypto:"#7f77dd",geopolitics:"#d85a30",energy:"#f97316",tech:"#06b6d4",gold:"#d4a017",culture:"#ec4899",labor:"#8b5cf6",regulation:"#64748b",science:"#14b8a6",venture:"#84cc16"};
var UE={act:"🔴",deep:"🔵",watch:"🟡"},UL={act:"🔴 Act Now",deep:"🔵 Deep",watch:"🟡 Watch"};
var fc="all",fu="all",fs=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function toggle(id){var e=document.getElementById('c'+id);e.classList.toggle('open')}
function pill(label,active,color,fn){var b=document.createElement('button');b.className='pill'+(active?' active':'');b.textContent=label;if(active)b.style.background=color||'#333';b.onclick=fn;return b}
function bars(){
  var cb=document.getElementById('catbar');cb.innerHTML='';
  cb.appendChild(pill('All ('+ITEMS.length+')',fc==='all',"#333",function(){fc='all';fs=null;render()}));
  Object.keys(COL).forEach(function(c){var n=ITEMS.filter(function(i){return i.cat===c}).length;if(!n)return;
    cb.appendChild(pill(c+' ('+n+')',fc===c,COL[c],function(){fc=c;fs=null;render()}))});
  var ub=document.getElementById('urgbar');ub.innerHTML='';
  ub.appendChild(pill('All',fu==='all',"#333",function(){fu='all';fs=null;render()}));
  ['act','deep','watch'].forEach(function(u){var n=ITEMS.filter(function(i){return i.urgency===u}).length;
    ub.appendChild(pill(UL[u]+' ('+n+')',fu===u,"#333",function(){fu=u;fs=null;render()}))});
}
function card(item){
  var col=COL[item.cat]||'#888';
  var h='<div class="card'+(fs?' open':'')+'" id="c'+item.id+'"><div class="hd" onclick="toggle('+item.id+')">';
  h+='<span class="num">#'+item.id+'</span><span>'+UE[item.urgency]+'</span><span class="badge" style="background:'+col+'">'+esc(item.source)+'</span><span class="tag">'+esc(item.cat)+'</span>';
  if(item.charts.count>0||item.charts.hot)h+='<span>'+(item.charts.hot?'🔥':'📊')+'</span>';
  h+='<div class="ttl">'+esc(item.title)+'</div></div><div class="body">';
  h+='<div class="lbl">The Idea</div><div>'+esc(item.idea)+'</div>';
  h+='<div class="lbl">My Angle</div><div class="angle" style="border-color:'+col+';background:'+col+'14">'+esc(item.angle)+'</div>';
  h+='<div class="tw"><div><div class="lbl" style="color:#378add;margin-top:0">Tweet A</div>'+esc(item.tweetA)+'<br>'+'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  h+='<div><div class="lbl" style="color:#7f77dd;margin-top:0">Tweet B</div>'+esc(item.tweetB)+'<br>'+'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>';
  if(item.charts.desc)h+='<div class="chart'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING — ':'')+esc(item.charts.desc)+'</div>';
  h+='<div style="margin-top:8px"><a href="'+esc(item.link)+'" target="_blank" rel="noopener">↗ Read full article</a></div></div></div>';
  return h;
}
function render(){
  bars();
  var l=ITEMS.filter(function(i){return (fc==='all'||i.cat===fc)&&(fu==='all'||i.urgency===fu)&&(!fs||i.source.indexOf(fs)!==-1)});
  document.getElementById('list').innerHTML=l.map(card).join('');
}
function filterBySrc(name){fc='all';fu='all';fs=name;render();window.scrollTo(0,0)}
function init(){
  render();
  var r='<p><b>Window:</b> '+esc(META.windowStart)+' to '+esc(META.windowEnd)+'. '+esc(META.note)+'</p>';
  r+='<p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items extracted: '+META.itemsExtracted+'</p><p><b>Included sources</b> (click to filter):</p><ul>';
  META.includedSources.forEach(function(s,i){r+='<li><span class="src" data-i="'+i+'">'+esc(s.name)+'</span> — '+s.count+'</li>'});
  r+='</ul><p><b>Skipped</b></p><ul>';
  META.skippedSources.forEach(function(s){r+='<li>'+esc(s.name)+' — '+esc(s.reason)+'</li>'});
  r+='</ul>';
  var el=document.getElementById('rep');el.innerHTML=r;
  Array.prototype.forEach.call(el.querySelectorAll('.src'),function(n){n.onclick=function(){filterBySrc(META.includedSources[+n.getAttribute('data-i')].name)}});
}
init();
</script></body></html>
