tags": ["Tech", "AI"], "gist": "Daniel Nenni reports TSMC's A14 details from the 2026 Europe OIP workshop: second-gen GAA nanosheets with NanoFlex Pro (Boost and Low-Power cells), 14% speed or 23% power gain vs N2P NanoFlex, a sub-0.017um2 SRAM cell, PDK v0.9 ready, Cadence/Synopsys flows certified, risk production 2H27, HVM 2H28 and an A13 shrink in 2029; he argues scaling now depends on DTCO and ecosystem integration.", "themes": [{"theme": "A14 schedule and readiness", "insights": [{"claim": "TSMC's A14 (1.4nm-class) process is scheduled for risk production in the second half of 2027 and high-volume manufacturing in the second half of 2028, with the v0.9 PDK now ready for customer design.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["TSMC", "A14"], "conviction": "high", "so_what": "Sets the timeline for next-gen leading-edge capacity and customer tape-outs.", "quote": null, "locator": "A14 is scheduled to enter risk production", "quote_verified": false}, {"claim": "Cadence and Synopsys have completed full A14 design-flow certification using an Arm Cortex-A725 core covering implementation and signoff, with Siemens EDA progressing toward additional certifications.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["Cadence", "Synopsys", "Siemens EDA", "Arm Cortex-A725", "TSMC A14"], "conviction": "high", "so_what": "Early EDA readiness lowers adoption risk for A14 customers; Cadence/Synopsys ahead of Siemens.", "quote": null, "locator": "Both Cadence and Synopsys have completed", "quote_verified": false}, {"claim": "TSMC offers a migration path from A14 to A13, scheduled for volume production in 2029, with about 6% die area savings without significant design-flow changes.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["TSMC", "A13", "A14"], "conviction": "high", "so_what": "An optical-shrink-style follow-on extends A14 design investment value.", "quote": null, "locator": "TSMC is also providing customers with a migration path", "quote_verified": false}]}, {"theme": "Transistor and cell architecture", "insights": [{"claim": "A14 is TSMC's second-generation gate-all-around nanosheet technology building on the N2 family, and introduces NanoFlex Pro, an evolution of N2's NanoFlex standard-cell architecture.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["TSMC", "A14", "GAA nanosheet", "NanoFlex Pro", "N2"], "conviction": "high", "so_what": "Iterative GAA maturity lowers technical risk for TSMC versus first-gen GAA competitors.", "quote": null, "locator": "A14 represents TSMC’s second generation", "quote_verified": false}, {"claim": "NanoFlex Pro introduces Boost Cells for performance-critical paths and Low-Power Cells where peak frequency matters less, improving chip efficiency without the power and area penalty of optimizing every circuit for maximum performance.", "speaker": "Daniel Nenni", "type": "framework", "entities": ["NanoFlex Pro", "TSMC"], "conviction": "medium", "so_what": "Cell-level mixing is a growing source of PPA gains beyond the transistor.", "quote": null, "locator": "An important innovation is the introduction of Boost Cells", "quote_verified": false}]}, {"theme": "A14 PPA versus N2P", "insights": [{"claim": "TSMC says A14 with NanoFlex Pro delivers about 14% higher performance at equal power or 23% lower total power at equal performance versus N2P with NanoFlex.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["TSMC", "A14", "N2P"], "conviction": "high", "so_what": "Headline generational gain for customers planning 2028+ products.", "quote": null, "locator": "According to TSMC, A14 with NanoFlex Pro delivers", "quote_verified": false}, {"claim": "Versus baseline N2P, TSMC shows energy efficiency / drawn transistor density / logic density gains of +12%/+11%/0% for N2P NanoFlex, +23%/+16%/+2% for N2U NanoFlex Pro, +50%/+22%/+23% for A14 NanoFlex Pro and +58%/+22%/+30% for A13 NanoFlex Pro.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["TSMC", "N2P", "N2U", "A14", "A13"], "conviction": "high", "so_what": "A14 is the major efficiency/logic-density step; N2U is a modest density bump; A13 adds density via shrink.", "quote": null, "locator": "TSMC also presented the following comparisons", "quote_verified": false}, {"claim": "The energy-efficiency figures versus baseline N2P use a different comparison basis than the performance and power figures versus N2P with NanoFlex, so the two sets of numbers are not directly comparable.", "speaker": "Daniel Nenni", "type": "framework", "entities": ["TSMC", "N2P"], "conviction": "medium", "so_what": "Avoid conflating the +50% efficiency figure with the 23% power figure in models.", "quote": null, "locator": "Importantly, the energy-efficiency figures", "quote_verified": false}]}, {"theme": "SRAM scaling and DTCO", "insights": [{"claim": "TSMC's A14 IEDM presentation describes an SRAM bit cell smaller than 0.017 square micrometers, important for AI and HPC chips with large on-chip caches as SRAM scaling has become one of the hardest problems at advanced nodes.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["TSMC", "A14", "SRAM", "IEDM"], "conviction": "high", "so_what": "Continued SRAM shrink benefits cache-heavy AI accelerators.", "quote": null, "locator": "TSMC’s upcoming A14 technical presentation at IEDM", "quote_verified": false}, {"claim": "Design-technology co-optimization across transistors, standard cells, interconnects and physical design is becoming essential as traditional geometric scaling delivers diminishing returns.", "speaker": "Daniel Nenni", "type": "causal", "entities": ["DTCO"], "conviction": "medium", "so_what": "Foundry advantage increasingly rests on ecosystem/co-optimization, not lithography alone.", "quote": null, "locator": "Design-technology co-optimization (DTCO)", "quote_verified": false}]}, {"theme": "Competitive and data-center stakes", "insights": [{"claim": "AI accelerators, data center and mobile processors are increasingly constrained by power, thermals and manufacturing economics rather than transistor performance, so modest efficiency gains translate into substantial savings at hyperscale AI data centers.", "speaker": "Daniel Nenni", "type": "causal", "entities": ["AI accelerators", "hyperscale data centers"], "conviction": "medium", "so_what": "Efficiency gains from A14 are economically valuable to hyperscalers.", "quote": null, "locator": "AI accelerators, data center processors", "quote_verified": false}, {"claim": "A14 could intensify competition among leading advanced foundries as Intel develops its 14A technology and Samsung advances its GAA roadmap.", "speaker": "Daniel Nenni", "type": "prediction", "entities": ["TSMC", "Intel 14A", "Samsung"], "conviction": "medium", "so_what": "Watch Intel 14A and Samsung GAA timing versus A14's 2H28 HVM.", "quote": null, "locator": "A14 could also intensify competition", "quote_verified": false}, {"claim": "The next era of Moore's Law will be defined less by smaller transistors and more by how effectively the whole semiconductor ecosystem of manufacturing, architecture, design optimization and EDA works together.", "speaker": "Daniel Nenni", "type": "thesis", "entities": ["Moore's Law", "TSMC"], "conviction": "medium", "so_what": "Favors foundries with deep ecosystem partnerships (OIP) over pure process leaders.", "quote": "The next era of Moore’s Law will increasingly be defined not simply by smaller transistors, but by how effectively the entire semiconductor ecosystem works together.", "locator": "Bottom line", "quote_verified": true}]}], "insight_total": 13, "top_entities": ["TSMC", "A14", "N2P", "A13", "NanoFlex Pro", "Cadence", "Synopsys", "Siemens EDA", "SRAM", "Intel", "Samsung"], "source_meta": {"author": "Daniel Nenni", "word_count": 886, "paywalled": false}}, {"record_id": "caa819641342a7c4", "source_type": "technology", "source_name": "ServeTheHome", "source_url": "https://www.servethehome.com/kioxia-gp2-series-ssd/", "title": "Kioxia Announces GP2 Series SSD with Over 18 Million Random Read IOPS", "published_date": "2026-11-27", "language": "en", "processed_at": "2026-11-28T11:05:52Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "Kioxia announced the GP2 Series SSD (PCIe 6.0 / NVMe 2.3, XL-FLASH gen 3) with >18M random read IOPS at 512B, nearly double the GP1, aimed at a GPU-accessible flash memory tier that substitutes for costlier HBM/DRAM in AI systems. Evaluation samples only reach select customers by end of 2027, so it is a longer-dated roadmap item.", "themes": [{"theme": "GP2 performance specs", "insights": [{"claim": "Kioxia's GP2 Series SSD delivers more than 18 million random read IOPS at a 512-byte block size, nearly double the GP1 Series shown at FMS in August 2026, with expected sequential reads up to 28GB/s on PCIe 6.0 / NVMe 2.3.", "speaker": "Cliff Robinson", "type": "data_point", "entities": ["Kioxia", "GP2 Series", "GP1 Series", "PCIe 6.0", "NVMe 2.3"], "conviction": "high", "so_what": "Small-block IOPS is roughly doubling per generation in AI-oriented SSDs; a benchmark to track Kioxia against rival flash vendors.", "quote": "18M IOPS is nearly double the performance of the GP1 Series Kioxia showed in August at FMS.", "locator": "Kioxia GP2 Series SSDs", "quote_verified": true}, {"claim": "Kioxia says the GP2's XL-FLASH generation 3 memory delivers about 2.5x the IOPS of its own TLC-based CM10 Series SSDs at a 512-byte block size, plus higher endurance, because low-latency flash better suits fine-grained memory-expansion access than TLC.", "speaker": "Cliff Robinson", "type": "causal", "entities": ["Kioxia", "XL-FLASH", "CM10 Series", "TLC NAND"], "conviction": "medium", "so_what": "Specialty low-latency NAND (XL-FLASH) is being positioned as a distinct product line from capacity TLC, potentially higher-margin.", "quote": null, "locator": "Kioxia is using its XL-FLASH generation 3", "quote_verified": false}]}, {"theme": "Flash as GPU memory tier", "insights": [{"claim": "Kioxia's GP series is designed to let AI operators build a flash-based memory tier that GPUs access directly, instead of adding more expensive HBM or DRAM, handling larger datasets at lower cost.", "speaker": "Cliff Robinson", "type": "thesis", "entities": ["Kioxia", "HBM", "DRAM", "GPU", "NAND"], "conviction": "medium", "so_what": "If GPU-attached flash tiers gain adoption, some AI memory spend could shift from HBM/DRAM toward specialty NAND; watch for hyperscaler qualification.", "quote": "Instead of adding more expensive HBM or DRAM to a GPU system, operators can use these NAND-based drives to create a flash-based memory tier the GPU can access directly.", "locator": "Kioxia GP2 Series Launched", "quote_verified": true}, {"claim": "Endurance is the key question when replacing DRAM with NAND; the Kioxia GP2 is rated up to 50 DWPD, a step above many common capacity-focused SSDs.", "speaker": "Cliff Robinson", "type": "data_point", "entities": ["Kioxia", "GP2 Series", "DRAM", "NAND"], "conviction": "medium", "so_what": "Endurance ratings are the gating spec for NAND-as-memory adoption; 50 DWPD is the bar to compare competitors against.", "quote": "Whenever you try to replace DRAM with NAND, endurance becomes a question.", "locator": "Kioxia GP2 Series Launched", "quote_verified": true}]}, {"theme": "Roadmap and timing", "insights": [{"claim": "Kioxia previewed a 20M IOPS GP-series system live at OCP Summit 2026 and says future generations will target up to 100 million random read IOPS.", "speaker": "Cliff Robinson", "type": "prediction", "entities": ["Kioxia", "OCP Summit 2026"], "conviction": "low", "so_what": "Signals a multi-generation roadmap for AI-memory flash, but the 100M IOPS target is aspirational.", "quote": "future generations will target up to 100 million random read IOPS, but we are not there just yet", "locator": "Kioxia GP Series SSD preview at OCP Summit 2026", "quote_verified": true}, {"claim": "Kioxia GP2 evaluation samples will reach only select customers by the end of 2027, making the product a distant revenue contributor even as AMD and NVIDIA PCIe Gen6 systems begin appearing.", "speaker": "Cliff Robinson", "type": "data_point", "entities": ["Kioxia", "GP2 Series", "AMD", "NVIDIA", "PCIe 6.0"], "conviction": "high", "so_what": "Do not expect GP2 revenue before 2028; PCIe Gen6 platform ramps are the nearer-term enabler to watch.", "quote": "evaluation GP2 samples will be available to select customers by the end of 2027, so this seems a bit further out", "locator": "Final Words", "quote_verified": true}]}], "insight_total": 6, "top_entities": ["Kioxia", "GP2 Series", "XL-FLASH", "PCIe 6.0", "HBM", "DRAM", "NAND", "CM10 Series", "AMD", "NVIDIA"], "source_meta": {"author": "Cliff Robinson", "word_count": 427, "paywalled": false}}, {"record_id": "7fb517ea0eb12913", "source_type": "technology", "source_name": "The Next Platform", "source_url": "https://www.nextplatform.com/control/2026/11/27/the-software-defined-mirage-and-the-alien-worlds-of-socket-cores-and-os-kernels/5313186", "title": "The Software-Defined Mirage And The Alien Worlds Of Socket Cores And OS Kernels", "published_date": "2026-11-27", "language": "en", "processed_at": "2026-11-28T11:06:33Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "Guest author Cristian Vasile argues that software-based cloud isolation (namespaces, cgroups, hypervisors) wastes 10-15% of server capacity because CPU cores are blind to tenant identity, and proposes Layer3CTX: a per-thread VMID/CID/PID register triad, never-flushed tagged TLBs, an on-die 3D-SRAM context vault with a hardware mapping table, and eight privileged instructions that turn context switches into atomic Begin/Commit hardware transactions. He claims cutting the tax to 5% would free a 100,000-server phantom fleet per million nodes and enable silicon-enforced Gold/Silver/Bronze SLA tiers; it is an unvalidated proposal, not a vendor product.", "themes": [{"theme": "Software isolation tax", "insights": [{"claim": "Software-based multi-tenant isolation in cloud datacenters (Linux namespaces, cgroups, hypervisors, VMs) consumes roughly 10-15 percent of total server capacity, according to guest author Cristian Vasile.", "speaker": "Cristian Vasile", "type": "data_point", "entities": ["Linux", "cgroups", "hypervisors", "hyperscalers"], "conviction": "high", "so_what": "A 10-15% isolation tax is the size of the prize for any hardware or software vendor that can reclaim it; benchmark claims of 'virtualization overhead' against this figure.", "quote": "approximately 10 percent to 15 pecent of total server capacity", "locator": "Right now, we are wasting a ridiculous amount", "quote_verified": true}, {"claim": "CPU cores and OS kernels are mutually context-unaware: a physical core on a 256-core/512-thread server has no native knowledge of which tenant, container or process a clock cycle belongs to.", "speaker": "Cristian Vasile", "type": "thesis", "entities": ["AMD", "Intel", "Nvidia", "ARM"], "conviction": "high", "so_what": "Frames per-tenant hardware identity as a missing primitive that CPU vendors could differentiate on.", "quote": "our compute cores and the operating system kernels are completely context-unaware of each other", "locator": "The real issue is right under our noses", "quote_verified": true}, {"claim": "Each container-to-container context switch on Linux forces Ring 0 software bookkeeping: saving general-purpose and AVX-512 registers into task_struct via XSAVE, scheduler queue walks under rq_lock, and a CR3 update that triggers a full TLB flush so the new process starts cold.", "speaker": "Cristian Vasile", "type": "causal", "entities": ["Linux", "AVX-512", "TLB", "rq_lock"], "conviction": "high", "so_what": "Context-switch cost scales with container density, so the overhead worsens as hyperscalers pack more tenants per socket.", "quote": null, "locator": "Traditionally, this software-driven crisis unfolds in four expensive steps", "quote_verified": false}, {"claim": "Cold TLBs and shared L3 caches produce the 'noisy neighbor' problem, where one misbehaving container floods L3 and starves adjacent workloads; today's remedy is crude software throttling that reduces throughput and causes unpredictable latency spikes.", "speaker": "Cristian Vasile", "type": "causal", "entities": ["L3 cache", "noisy neighbor", "containers"], "conviction": "high", "so_what": "Tail-latency unpredictability is a pricing limiter for premium cloud SLAs; watch cache-partitioning features as a competitive lever.", "quote": null, "locator": "The new process starts completely cold", "quote_verified": false}, {"claim": "The author argues the software-defined isolation model will hit a physical wall as distributed AI and CXL-connected global memory pooling scale up.", "speaker": "Cristian Vasile", "type": "prediction", "entities": ["CXL", "AI", "memory pooling"], "conviction": "medium", "so_what": "Suggests CXL-era architectures will need hardware-level tenancy features, a potential product roadmap item for CPU and CXL controller vendors.", "quote": "this software-defined illusion is bound to hit a physical wall", "locator": "Every morning, the world's cloud giants", "quote_verified": true}]}, {"theme": "Layer3CTX hardware identity triad", "insights": [{"claim": "The proposed Layer3CTX (Layer 3 Context Switch) architecture adds a per-logical-thread triad of physical registers - VMID, CID (Container ID) and PID - with the hypervisor writing VMID in Ring -1 (VMX Root Mode) and the guest kernel writing CID/PID in Ring 0, invisible to user space.", "speaker": "Cristian Vasile", "type": "framework", "entities": ["Layer3CTX", "VMID", "CID", "PID", "Hyper-Threading/SMT"], "conviction": "high", "so_what": "A concrete spec for silicon-native tenancy; watch whether any CPU vendor adopts container-level hardware IDs analogous to existing VM tags.", "quote": null, "locator": "Enter The Layer 3 Context Switch", "quote_verified": false}, {"claim": "Under Layer3CTX the TLB is never flushed on a switch; instead TLB entries gain five state bits (SH, a two-bit SH_LEVEL, NX for No Context Execute, RO for Read-Only Context) so container-wide shared pages bypass the PID check and the TLB stays hot.", "speaker": "Cristian Vasile", "type": "framework", "entities": ["TLB", "Layer3CTX"], "conviction": "high", "so_what": "Eliminating TLB flushes is the main mechanism behind the claimed overhead reduction; it is the piece most dependent on vendor microarchitecture changes.", "quote": "The Translation Lookaside Buffer (TLB) is never flushed again.", "locator": "The Translation Lookaside Buffer (TLB) is never flushed again", "quote_verified": true}, {"claim": "Identity is treated as a hierarchical prefix-based segmented identifier, a 64-bit CTX_TOKEN of [VMID x CID x PID], compared left-to-right like a network router so switches within the same guest VM complete locally inside the CCD, supporting nested virtualization.", "speaker": "Cristian Vasile", "type": "framework", "entities": ["CTX_TOKEN", "nested virtualization", "CCD"], "conviction": "medium", "so_what": "Router-style prefix matching is a reusable design idea that could extend tenancy tags across fabrics.", "quote": null, "locator": "This flexible hierarchy provides total resilience", "quote_verified": false}, {"claim": "The author claims the concept is vendor-neutral: implementation would differ across Intel, AMD, ARM and IBM microarchitectures, but the blueprint of a 256 KB per-core context buffer would absorb any instruction set's context layout.", "speaker": "Cristian Vasile", "type": "thesis", "entities": ["Intel", "AMD", "ARM", "IBM"], "conviction": "medium", "so_what": "Positions the idea as a cross-industry standard opportunity rather than a single-vendor feature.", "quote": "this architectural concept is universally applicable across silicon vendors", "locator": "Crucially, this architectural concept is universally applicable", "quote_verified": true}]}, {"theme": "On-die SRAM context vault and CHMT", "insights": [{"claim": "Layer3CTX would offload register state to a dedicated, eviction-isolated 256 KB SRAM segment per core instead of DRAM, with a 16 KB Local RSB-Vault preserving Return Stack Buffer state so the branch predictor restarts warm.", "speaker": "Cristian Vasile", "type": "framework", "entities": ["3D-SRAM", "Return Stack Buffer", "L3 cache"], "conviction": "medium", "so_what": "Implies more die area spent on non-evictable SRAM, a tailwind for 3D-stacked SRAM/hybrid-bonding packaging.", "quote": null, "locator": "Locally, each core chiplet (CCD)", "quote_verified": false}, {"claim": "The reference topology pairs 2nm-class compute chiplets (CCDs) with a 6nm I/O die holding 64 MB of 3D-SRAM, of which 32 MB forms a Layer3CTX-Hub able to store 2.6 KB context snapshots for more than 12,000 concurrent processes without touching external DRAM.", "speaker": "Cristian Vasile", "type": "data_point", "entities": ["3D-SRAM", "I/O Die", "CCD", "2nm", "6nm"], "conviction": "medium", "so_what": "Quantifies the SRAM budget needed (32 MB per socket) for hardware context switching; relevant to advanced packaging and SRAM-stacking demand.", "quote": null, "locator": "The Topological Hierarchy of Layer 3 CTX", "quote_verified": false}, {"claim": "The Core Hardware Mapping Table (CHMT) is proposed as a physical routing ledger etched into the IOD's 3D-SRAM, mapping VMs, containers and processes to CCDs and CXL memory pools and updating within a single-digit clock cycle window with zero OS overhead.", "speaker": "Cristian Vasile", "type": "framework", "entities": ["CHMT", "I/O Die", "CXL"], "conviction": "medium", "so_what": "Moves scheduler-adjacent state into silicon, shrinking the kernel's role in the memory path.", "quote": "the CHMT is not a software table living in system RAM", "locator": "Crucially, the CHMT is not a software table", "quote_verified": true}, {"claim": "When transient context volume exceeds the on-chip vault, the hardware would evict inactive contexts to CXL memory pools over a prioritized virtual channel (VC_CONTEXT), with telemetry exposed via MSRs (MSR_L3CTX_CONFIG, MSR_L3CTX_MISS_COUNT, MSR_L3CTX_EVICT_COUNT) and capabilities advertised through ACPI tables.", "speaker": "Cristian Vasile", "type": "framework", "entities": ["CXL", "ACPI", "MSR"], "conviction": "medium", "so_what": "Shows a CXL-dependent overflow path, adding another use case for CXL memory expansion.", "quote": null, "locator": "If the volume of transient activity exceeds", "quote_verified": false}]}, {"theme": "Eight-instruction transactional switch", "insights": [{"claim": "Layer3CTX defines eight privileged instructions (SI_CTX_BEGIN, SAVE, LOAD, ROLLBACK, CLONE, YIELD, FLUSH, COMMIT) controlled via three 32-bit system registers (CTX_CORE, CTX_SRC_IDX, CTX_DEST_IDX), turning a context switch into an atomic Begin/Commit hardware transaction modeled on OLTP engines.", "speaker": "Cristian Vasile", "type": "framework", "entities": ["Layer3CTX", "OLTP", "SI_CTX instructions"], "conviction": "high", "so_what": "Borrowing database transaction semantics for CPU context switching is the core design insight; any adoption would require OS kernel (Linux) support.", "quote": "an atomic hardware transaction modeled after a Begin/Commit structure borrowed from OLTP engines", "locator": "Through this design, the context switch ceases", "quote_verified": true}, {"claim": "Fault handling uses a -1 (0xFFFFFFFF) failure token in CTX_DEST_IDX; when the kernel reads it after SI_CTX_SAVE it invokes SI_CTX_ROLLBACK, which restores the original thread's registers and predictor and lifts the bus fence, avoiding system-wide hangs.", "speaker": "Cristian Vasile", "type": "framework", "entities": ["SI_CTX_ROLLBACK", "CTX_DEST_IDX"], "conviction": "medium", "so_what": "Reliability design is a prerequisite for hyperscaler adoption of any hardware scheduler offload.", "quote": null, "locator": "SI_CTX_ROLLBACK (The Zero-Trust Safety Net)", "quote_verified": false}, {"claim": "SI_CTX_CLONE would replace the slow Linux fork() in serverless environments by duplicating a pre-warmed 2.6 KB template context in the on-die pool in nanoseconds, eliminating cold-start penalties for thousands of concurrent requests.", "speaker": "Cristian Vasile", "type": "causal", "entities": ["serverless", "AWS Lambda", "fork()", "Linux"], "conviction": "medium", "so_what": "Cold start is a key serverless economics problem; hardware cloning would favor function-as-a-service density.", "quote": null, "locator": "SI_CTX_CLONE (The Nanosecond Fork)", "quote_verified": false}, {"claim": "SI_CTX_FLUSH electrically zeroes a CHMT slot within a few clock cycles when an ephemeral function terminates, which the author says prevents the 'Metadata Garbage Flood' of page-table churn in RAM and blocks side-channel leakage.", "speaker": "Cristian Vasile", "type": "causal", "entities": ["SI_CTX_FLUSH", "AWS Lambda", "side-channel attacks"], "conviction": "medium", "so_what": "Pitches security (side-channel mitigation) as a second selling point alongside performance.", "quote": null, "locator": "SI_CTX_FLUSH (The Electrical Purge)", "quote_verified": false}]}, {"theme": "Identity tags across PCIe/CXL fabrics", "insights": [{"claim": "Extending the container ID over PCIe and CXL via Contextual Address Space Mapping would let SmartNICs tag packets with the target CID so payloads land directly in that container's pinned L3 lines, enabling zero-copy networking that bypasses the Linux network stack.", "speaker": "Cristian Vasile", "type": "prediction", "entities": ["SmartNICs", "PCIe", "CXL", "Linux network stack"], "conviction": "medium", "so_what": "A tenancy-aware fabric would raise the value of SmartNIC/DPU offload and cut kernel networking overhead.", "quote": null, "locator": "SmartNICs can tag inbound network packets", "quote_verified": false}, {"claim": "GPUs receiving container-ID tags could isolate Tensor cores and VRAM per tenant and drop conflicting accesses at the circuit level, which the author argues would make multi-tenant LLM hosting safe from data leakage.", "speaker": "Cristian Vasile", "type": "prediction", "entities": ["GPUs", "LLMs", "VRAM", "Tensor cores"], "conviction": "medium", "so_what": "Hardware-enforced GPU multi-tenancy would improve utilization economics for shared AI inference clusters.", "quote": "Hosting multi-tenant Large Language Models (LLMs) suddenly becomes completely bulletproof against data leakage.", "locator": "GPUs can segment their internal Tensor cores", "quote_verified": true}, {"claim": "CXL memory pools could be safely shared across separate physical servers because the fabric memory controller would validate page permissions based on hardware identity, stopping speculative side-channel attacks before execution.", "speaker": "Cristian Vasile", "type": "prediction", "entities": ["CXL", "memory pooling", "side-channel attacks"], "conviction": "medium", "so_what": "Security is a gating concern for cross-server CXL pooling; hardware identity could unlock that market.", "quote": null, "locator": "CXL Memory Pools can safely share", "quote_verified": false}, {"claim": "The author asserts the identity tags can traverse PCIe/CXL without requiring changes to rigid industry bus packet headers, by mapping logical memory sub-spaces to the running container ID at the memory controller.", "speaker": "Cristian Vasile", "type": "thesis", "entities": ["PCIe", "CXL"], "conviction": "medium", "so_what": "Avoiding standard-body changes lowers the adoption barrier, if the claim holds up under scrutiny.", "quote": "without requiring changes to rigid industry bus packet headers", "locator": "However, the true architectural magic unlocks", "quote_verified": true}]}, {"theme": "Hyperscaler economics and SLA tiers", "insights": [{"claim": "Cutting the isolation overhead from 15 percent to 5 percent would reclaim ten percentage points of compute; at one million nodes this equals a 100,000-server 'phantom fleet' and hundreds of millions of dollars of avoided capex, according to the author.", "speaker": "Cristian Vasile", "type": "data_point", "entities": ["hyperscalers", "capex"], "conviction": "high", "so_what": "Frames hardware context switching as a capex lever; any vendor shipping it could pitch TCO directly against server count.", "quote": "liberates a 100,000-server phantom fleet", "locator": "By compressing this systemic latency tax", "quote_verified": true}, {"claim": "Per-core hardware tenancy would let clouds sell three silicon-enforced tiers: Gold (exclusive L3 slice mapped to a container ID with absolute pipeline priority), Silver (best-effort shared cache with frequency throttling during surges) and Bronze (spot instances paused at the clock-cycle level when higher tiers reclaim the core).", "speaker": "Cristian Vasile", "type": "framework", "entities": ["cloud providers", "SLA", "spot instances"], "conviction": "medium", "so_what": "Hardware-backed tiering could shift cloud pricing toward guaranteed-performance premiums and higher margins.", "quote": null, "locator": "With per-core hardware tracking built directly", "quote_verified": false}, {"claim": "The author argues flatter tail latency lets providers contractually guarantee low-jitter performance, converting wasted power and thermal budget into high-margin enterprise SLA revenue, so customers could buy compute with the predictability of electricity.", "speaker": "Cristian Vasile", "type": "thesis", "entities": ["cloud providers", "SLA"], "conviction": "medium", "so_what": "Watch for clouds productizing guaranteed-latency tiers as a margin expansion path.", "quote": "customers can buy computing power with the same predictability as purchasing electricity", "locator": "This mechanism completely removes the guessing game", "quote_verified": true}, {"claim": "The author compares the opportunity to IBM's pioneering of hardware virtualization on 1960s mainframes, and predicts whichever chip giant first ships the identity triad with Layer 3 Context Switch registers and instructions will rewrite infrastructure economics.", "speaker": "Cristian Vasile", "type": "prediction", "entities": ["IBM", "AMD", "Intel", "ARM"], "conviction": "medium", "so_what": "Signals a potential differentiation race among CPU vendors; note this is a guest proposal, not an announced product.", "quote": "isn't just launching a feature; they are fundamentally rewriting the economics of global infrastructure", "locator": "At the end of the day, whichever chip giant", "quote_verified": true}]}, {"theme": "Kernel as conductor", "insights": [{"claim": "The author's philosophical thesis is that after 25 years of software outpacing hardware, silicon should natively understand the cloud, relaxing the software stack so the kernel merely triggers transactions while hardware moves contexts.", "speaker": "Cristian Vasile", "type": "contrarian", "entities": ["Linux", "OS kernels"], "conviction": "medium", "so_what": "Contrarian to the software-defined-everything trend; implies value migrating from software layers into CPU silicon.", "quote": "Software merely commands, and the black magic of transistors delivers the cloud of the future.", "locator": "Ultimately, the most radical shift", "quote_verified": true}, {"claim": "Layer3CTX is presented as a guest-authored architectural proposal by a senior technical business analyst at Integrated Data Systems SRL (Bucharest), not a product announced by any chip vendor, and the article offers no prototype or benchmark data.", "speaker": "Cristian Vasile", "type": "anecdote", "entities": ["Integrated Data Systems SRL", "The Next Platform"], "conviction": "high", "so_what": "Treat the performance and capex numbers as an unvalidated proposal, not a vendor roadmap.", "quote": null, "locator": "Cristian Vasile is a long-time reader", "quote_verified": false}]}], "insight_total": 27, "top_entities": ["Layer3CTX", "Linux", "TLB", "CXL", "3D-SRAM", "CHMT", "AMD", "Intel", "ARM", "IBM", "SmartNICs", "hyperscalers"], "source_meta": {"author": "Cristian Vasile", "word_count": 4104, "paywalled": false}}, {"record_id": "116cb989ab11d4ae", "source_type": "technology", "source_name": "Wired", "source_url": "https://www.wired.com/story/amazon-black-friday-deals-11-27-2026/", "title": "Amazon Black Friday Deals Are Live. Here’s What’s on Sale", "published_date": "2026-11-24", "language": "en", "processed_at": "2026-11-28T11:09:13Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "Shopping roundup of Amazon's 'Black Friday Week' sale (running to November 30). The few investable signals: Apple raised prices earlier in 2026 (MacBook Air now starts at $1,299, Black Friday discounts roughly restore pre-increase prices), gaming laptops became more expensive this year, and Google's Pixel 11 line hit record-low Amazon prices.", "themes": [{"theme": "Hardware price inflation", "insights": [{"claim": "Apple raised prices earlier in 2026 so the MacBook Air (M5) now starts at about $1,300, and the $999 Black Friday price on Amazon only brings it back near its pre-increase level.", "speaker": "Les Shu", "type": "data_point", "entities": ["Apple", "MacBook Air (M5, 2026)", "Amazon"], "conviction": "high", "so_what": "Apple's 2026 price hikes mean holiday discounts mostly offset increases rather than cut below historic price points; watch for unit-demand effects.", "quote": "When Apple raised prices earlier this year, the once-affordable MacBook Air now starts at $1,300.", "locator": "Best Amazon Black Friday Tech Deals", "quote_verified": true}, {"claim": "The base iPad (A16) Black Friday price of $379 brings it closer to its MSRP before Apple's 2026 price increase.", "speaker": "Les Shu", "type": "data_point", "entities": ["Apple", "iPad (2025, A16)"], "conviction": "medium", "so_what": "Confirms Apple's price increases spanned multiple  Pro 3 are discounted 40% to $149 at Amazon and Walmart for Black Friday, the lowest price they have ever been.", "speaker": "Louryn Strampe", "type": "data_point", "entities": ["Apple", "AirPods Pro 3", "Amazon", "Walmart"], "conviction": "high", "so_what": "Unusually deep retailer discounting on Apple's flagship earbuds may signal channel inventory or aggressive holiday promotion in wearables.", "quote": null, "locator": "AirPods Pro 3 are finally, actually on sale.", "quote_verified": false}, {"claim": "Apple's inexpensive MacBook Neo, priced around $699, rarely drops in price and is only $50 off for Black Friday; WIRED says it is adequate for basic use but wishes it had more RAM.", "speaker": "Louryn Strampe", "type": "data_point", "entities": ["Apple", "MacBook Neo"], "conviction": "medium", "so_what": "Apple holds pricing discipline on its new entry-level Mac, with RAM as the noted weak point.", "quote": null, "locator": "The inexpensive MacBook Neo doesn't drop in price very often", "quote_verified": false}, {"claim": "WIRED calls the MacBook Air (M5, 2026) the best laptop for most people of any kind, with its price the main drawback, now discounted to $999 for the 13-inch model.", "speaker": "Louryn Strampe", "type": "data_point", "entities": ["Apple", "MacBook Air (M5, 2026)"], "conviction": "medium", "so_what": "Strong reviewer endorsement supports MacBook Air holiday demand.", "quote": null, "locator": "We love this MacBook and think it's the best option", "quote_verified": false}, {"claim": "AirPods Max 2 are discounted to $419 from $549; WIRED notes they basically never drop very far in price.", "speaker": "Louryn Strampe", "type": "data_point", "entities": ["Apple", "AirPods Max 2"], "conviction": "medium", "so_what": "Rare discount on a premium Apple product is consistent with broad holiday promotional intensity.", "quote": null, "locator": "For over-ear headphone enthusiasts looking to keep thing Apple", "quote_verified": false}]}], "insight_total": 4, "top_entities": ["Apple", "AirPods Pro 3", "AirPods Max 2", "MacBook Air (M5, 2026)", "MacBook Neo", "AirTag", "Amazon"], "source_meta": {"author": "Louryn Strampe", "word_count": 1185, "paywalled": false}}, {"record_id": "a73645a794d11335", "source_type": "technology", "source_name": "Wired", "source_url": "https://www.wired.com/story/a-new-breed-of-chip-runs-ai-models-using-waves-of-light/", "title": "A New Breed of Chip Runs AI Models Using Waves of Light", "published_date": "2026-11-27", "language": "en", "processed_at": "2026-11-28T11:09:13Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech", "Energy"], "gist": "Interview with Q.ANT founder-CEO Michael Förtsch on photonic processors positioned as GPU coprocessors for nonlinear AI math, aimed at cutting AI energy and memory-access costs. Q.ANT is piloting chips in IONOS data centers, claims 4-5x energy reduction only in simulation so far, and sees supply chain and developer adoption, not foundry capacity, as the gating constraints.", "themes": [{"theme": "AI energy cost bottleneck", "insights": [{"claim": "AI labs and cloud providers are trying to site new data centers in places with cheap renewable energy such as Scandinavia, but logistics, scarcity of key components and anti-data-center protests are slowing that strategy.", "speaker": "Joel Khalili", "type": "causal", "entities": ["data centers", "Scandinavia", "renewable energy"], "conviction": "medium", "so_what": "Siting constraints on cheap-power data centers raise the value of efficiency-side solutions (chips, cooling) relative to pure power procurement.", "quote": null, "locator": "To rein in runaway costs, AI labs", "quote_verified": false}, {"claim": "Q.ANT CEO Michael Förtsch argues the main cost driver in AI compute today is memory access, so a processor that completes complex math in a single step instead of thousands reduces data movement and therefore energy cost.", "speaker": "Joel Khalili", "type": "causal", "entities": ["Q.ANT", "Michael Förtsch", "memory access", "photonic processors"], "conviction": "high", "so_what": "Frames AI efficiency as a memory-bandwidth problem; watch architectures that reduce memory traffic as a competitive axis alongside raw FLOPS.", "quote": "The cost driver today is the access to the memory.", "locator": "WIRED: Michael, could you start by outlining", "quote_verified": true}]}, {"theme": "Photonics as GPU coprocessor", "insights": [{"claim": "Photonic processors compute with waves of light instead of moving electrons, which supposedly generates less heat and needs minimal cooling, one of the largest cost sources for data centers.", "speaker": "Joel Khalili", "type": "causal", "entities": ["photonic processors", "GPUs", "data center cooling"], "conviction": "medium", "so_what": "If validated, photonics would compress data-center cooling capex/opex, a negative second-order signal for cooling-heavy buildouts.", "quote": null, "locator": "Whereas regular GPUs transmit and process data", "quote_verified": false}, {"claim": "Q.ANT positions its photonic chips as coprocessors alongside GPUs rather than replacements: GPUs handle linear math, while photonic processors take complex, nonlinear calculations.", "speaker": "Joel Khalili", "type": "framework", "entities": ["Q.ANT", "Nvidia H200", "GPUs", "photonic processors"], "conviction": "high", "so_what": "Complementary rather than competitive positioning implies photonics is not a near-term threat to Nvidia's GPU franchise.", "quote": "Linear math? Please route it to the GPU. Non-linear and complex stuff? Please route it to us.", "locator": "What distinguishes the type of problem best left", "quote_verified": true}, {"claim": "Q.ANT expects photonic processors to be strongest in image and video workloads (recognition, segmentation, generation) and in robotics and physical AI.", "speaker": "Joel Khalili", "type": "prediction", "entities": ["Q.ANT", "computer vision", "robotics", "physical AI"], "conviction": "medium", "so_what": "Target end-markets for photonic compute adoption are vision and robotics workloads rather than LLM training.", "quote": null, "locator": "We believe we will be much stronger in everything related to pictures", "quote_verified": false}, {"claim": "Q.ANT's claimed four-to-five-times energy reduction from pairing photonic processors with GPUs comes from simulation only and has not yet been demonstrated in real hardware.", "speaker": "Joel Khalili", "type": "data_point", "entities": ["Q.ANT", "photonic processors"], "conviction": "low", "so_what": "Treat photonic efficiency claims as unproven until hardware benchmarks appear from the IONOS pilot.", "quote": "Under simulation, we are ending up at around four or five times energy reduction. But in real hardware we are not yet demonstrating it.", "locator": "What is the estimated gain in energy efficiency", "quote_verified": true}, {"claim": "Förtsch says Q.ANT would not be shy about attacking the GPU directly within five years if an opportunity arises, but that depends on what future AI model architectures and workloads look like.", "speaker": "Joel Khalili", "type": "prediction", "entities": ["Q.ANT", "GPUs", "AI model architecture"], "conviction": "exploratory", "so_what": "Long-dated optionality: the coprocessor pitch could turn competitive if model architectures shift toward nonlinear-heavy math.", "quote": null, "locator": "Can you imagine a future in which AI models run entirely", "quote_verified": false}]}, {"theme": "Adoption and deployment", "insights": [{"claim": "Q.ANT has rolled out its photonic chips to data centers operated by cloud company IONOS as a pilot, and says more than 30 engineering teams are developing AI models optimized for photonic computing.", "speaker": "Joel Khalili", "type": "data_point", "entities": ["Q.ANT", "IONOS", "photonic processors"], "conviction": "medium", "so_what": "IONOS pilot is the first real-world proof point to watch for photonic compute credibility.", "quote": null, "locator": "Few photonic processors are running inside data centers today", "quote_verified": false}, {"claim": "Existing C++ or Python code can run on Q.ANT machines, but GPU-optimized workloads need adaptation to gain speed, creating a chicken-and-egg problem between developer adoption and cloud-provider purchases.", "speaker": "Joel Khalili", "type": "causal", "entities": ["Q.ANT", "C++", "Python", "cloud providers"], "conviction": "high", "so_what": "Software ecosystem lock-in (GPU-optimized models) is the main moat incumbents hold against new compute architectures.", "quote": null, "locator": "It’s a chicken and egg problem, right?", "quote_verified": false}, {"claim": "Förtsch says any new processor technology needs time to earn the credibility for a company like Google to build data center infrastructure around it, which is why Q.ANT entered data centers with proof-of-concept systems.", "speaker": "Joel Khalili", "type": "thesis", "entities": ["Q.ANT", "Google", "data centers"], "conviction": "high", "so_what": "Expect long hyperscaler qualification cycles before photonic chips become material revenue.", "quote": null, "locator": "Whether it’s photonic or any other processor technology", "quote_verified": false}, {"claim": "Q.ANT is GPU-vendor agnostic and wants to work alongside both Nvidia and AMD GPUs rather than tying itself to one supplier.", "speaker": "Joel Khalili", "type": "data_point", "entities": ["Q.ANT", "Nvidia", "AMD"], "conviction": "medium", "so_what": "Vendor neutrality widens addressable market but means no single GPU maker will champion the technology.", "quote": null, "locator": "Are Q.ANT processors built to function alongside a particular brand", "quote_verified": false}]}, {"theme": "Manufacturing and supply chain", "insights": [{"claim": "Q.ANT photonic chips need only 90-nanometer node technology from the 2000s, letting foundries use existing cheap lines to make higher-priced chips without massive new capital investment, sidesteppi ner lawsuit show directors found the administration's proposed economic terms unattractive yet accepted the deal anyway, which the suit calls caving to government extortion.", "speaker": "Noah Shachtman", "type": "data_point", "entities": ["Intel", "Richard Paisner", "Intel board"], "conviction": "high", "so_what": "Creates fiduciary-duty litigation risk for boards that accept political deals against shareholder interest.", "quote": "The economic terms that had been proposed [by] the Administration were not, in their current form, attractive to the company,", "locator": "Intel’s board met, and decided they hated the deal.", "quote_verified": true}, {"claim": "Intel's attorneys argue in a motion to dismiss that there was real back-and-forth negotiation that improved terms, with the grants becoming immediately available and stockholder and government interests strategically aligned.", "speaker": "Noah Shachtman", "type": "data_point", "entities": ["Intel", "US government"], "conviction": "medium", "so_what": "Outcome of the motion to dismiss is a key marker for whether coerced-deal claims survive in court.", "quote": null, "locator": "But they went ahead with it anyway.", "quote_verified": false}, {"claim": "Shapiro urged Intel's board to weigh the benefits of having a friend in the administration and what it could do to help Intel, including with customers.", "speaker": "Noah Shachtman", "type": "causal", "entities": ["Intel", "David Shapiro", "Trump administration"], "conviction": "high", "so_what": "Government equity stakes may come with implied commercial support, a possible tailwind for Intel's foundry customer wins.", "quote": "benefits of having a friend in this administration and what the administration can do to help Intel (including with customers).", "locator": "Then came the call in which Shapiro insisted", "quote_verified": true}]}, {"theme": "Lip-Bu Tan and China ties", "insights": [{"claim": "Intel CEO Lip-Bu Tan, hired in March 2025, became a Trump tar // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
