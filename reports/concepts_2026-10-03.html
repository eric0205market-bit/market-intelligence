 "conviction": "high", "so_what": "Non-consensus positioning: early capital into physical capacity may earn outsized returns before the category is crowded.", "quote": "There is no ‘silver bullet’ software-style zero-marginal-cost escape hatch.", "locator": "Manufacturing is capital-in, capability-out", "quote_verified": true}, {"claim": "Capital chases systems companies with headline contracts, leaving Tier 2 and 3 suppliers, which hold decades of qualifications, flying components, skilled workers, and customer relationships, grossly underpriced and operating at a fraction of potential.", "speaker": "Connor Love, Collen Larson", "type": "thesis", "entities": ["Tier 2 suppliers", "Tier 3 suppliers"], "conviction": "high", "so_what": "Identifies a valuation gap: qualified sub-tier suppliers as acquisition/modernization targets.", "quote": "Tier 2 and 3 suppliers, the layer technology hasn’t touched, sit grossly underpriced.", "locator": "Capital historically chases the systems companies", "quote_verified": true}, {"claim": "The opportunity is not to buy shops and 'slap AI on them' but to use engineering, software, and capital to make scarce industrial assets produce more; advanced technology adoption remains concentrated in the largest firms.", "speaker": "Connor Love, Collen Larson", "type": "contrarian", "entities": ["AI"], "conviction": "medium", "so_what": "Cautions against superficial AI roll-up theses; value comes from real throughput gains.", "quote": "the opportunity is not to buy these shops and slap AI on them", "locator": "However, let’s be clear", "quote_verified": true}, {"claim": "Smart sensors, industrial IoT, AI, physics-informed AI, and digital twins give manufacturers visibility into processes and across suppliers, exposing bottlenecks before one shop becomes the system's production ceiling.", "speaker": "Connor Love, Collen Larson", "type": "causal", "entities": ["industrial IoT", "digital twins", "physics-informed AI"], "conviction": "medium", "so_what": "Tailwind for industrial software vendors enabling supply-chain visibility.", "quote": null, "locator": "This opportunity exists partly because of", "quote_verified": false}, {"claim": "The 'two-second transfer test': if a worker can move a part between machines in two seconds, a robot likely adds cost without output, so capital should target the actual constraint such as CNC cutting cycles, fixture changes, or inspection queues.", "speaker": "Connor Love, Collen Larson", "type": "framework", "entities": ["robotics", "CNC"], "conviction": "medium", "so_what": "A practical heuristic for diligencing automation capex and robotics pitches.", "quote": "If a worker can move a part between two machines in two seconds, adding a robot probably adds cost without meaningfully increasing output.", "locator": "Enter the two-second transfer test", "quote_verified": true}]}, {"theme": "Proof points: Hadrian and Amca", "insights": [{"claim": "Hadrian builds AI-driven factories from scratch with its Opus platform; in 2022 it made spaceflight-grade parts 10x faster and over 40% more efficiently than the legacy supply chain, and its Javelin and TOW components for RTX programs achieved 98% on-time delivery.", "speaker": "Connor Love, Collen Larson", "type": "data_point", "entities": ["Hadrian", "Opus", "RTX", "Javelin", "TOW"], "conviction": "high", "so_what": "Greenfield AI-native factories can demonstrably beat legacy suppliers on speed and reliability.", "quote": "Hadrian-made Javelin and TOW components achieved 98% on-time delivery", "locator": "Hadrian builds new, AI-driven factories", "quote_verified": true}, {"claim": "Amca pairs its RAPID AI engineering platform with established capacity across six factories, shipping over 50,000 components monthly and cutting development-to-production timelines by 67% versus industry standards.", "speaker": "Connor Love, Collen Larson", "type": "data_point", "entities": ["Amca", "RAPID"], "conviction": "high", "so_what": "Brownfield modernization of qualified capacity is a viable alternative to greenfield builds.", "quote": "Amca ships more than 50,000 components each month", "locator": "Amca combines AI-based engineering with established", "quote_verified": true}, {"claim": "Hadrian raised $1.37 billion in equity and one week later closed a $360 million revolving credit facility for manufacturing infrastructure, machinery, and hardware, illustrating the handoff from venture to cheaper capital.", "speaker": "Connor Love, Collen Larson", "type": "data_point", "entities": ["Hadrian"], "conviction": "high", "so_what": "Shows defense manufacturers can access debt markets, lowering cost of capital for expansion.", "quote": "One week after raising $1.37 billion in equity, Hadrian closed a $360 million revolving credit facility", "locator": "Hadrian’s progression from venture-backed factories", "quote_verified": true}]}, {"theme": "Defense-industrial capital flywheel", "insights": [{"claim": "The authors' capital stack model: government capital anchors strategically necessary capability, venture takes early technical risk, then growth equity, PE, strategic capital, and credit fund subsequent factories, with allied and commercial demand sustaining utilization.", "speaker": "Connor Love, Collen Larson", "type": "framework", "entities": ["venture capital", "private equity", "credit"], "conviction": "high", "so_what": "Maps where each capital type fits; expensive venture equity becomes the wrong tool once production is proven.", "quote": "At some point, expensive venture equity becomes the wrong tool for expansion.", "locator": "Once production is proven, growth equity", "quote_verified": true}, {"claim": "Contrary to venture instinct, entry of institutions like Apollo and JP Morgan and private equity into American manufacturing can be a positive signal that industrial production attracts larger, cheaper capital pools.", "speaker": "Connor Love, Collen Larson", "type": "contrarian", "entities": ["Apollo", "JP Morgan", "private equity"], "conviction": "medium", "so_what": "Large-institution entry may compress cost of capital and validate the asset class.", "quote": "contrary to instinct in most venture-backed markets, private equity flowing into American manufacturing can be a good signal", "locator": "Hadrian’s progression from venture-backed factories", "quote_verified": true}, {"claim": "The authors' test for PE in manufacturing is whether it leaves stronger engineering, qualification capacity, equipment, workers, and independent sources; leveraged buy-and-hollow strategies amount to stripping the industrial base and are against the national interest.", "speaker": "Connor Love, Collen Larson", "type": "framework", "entities": ["private equity"], "conviction": "medium", "so_what": "Signals potential policy/political scrutiny of leveraged roll-ups in the defense supply base.", "quote": "The goal is more winners, not fewer owners.", "locator": "Critics will say this is exactly", "quote_verified": true}, {"claim": "The US should not compete on labor cost or imitate China's subsidized overcapacity, but use deep capital markets and frontier technology to build economically durable capacity, amid a top-down political decision to reduce reliance on China in batteries, motors, actuators, turbines, and rare earths.", "speaker": "Connor Love, Collen Larson", "type": "thesis", "entities": ["China", "rare earths", "batteries"], "conviction": "high", "so_what": "Reshoring of the industrial stack away from Chinese leverage is policy-backed demand for US component manufacturers.", "quote": "America cannot compete on labor cost, nor should we try.", "locator": "America cannot compete on labor cost", "quote_verified": true}, {"claim": "The authors predict a new age of manufacturing inspired by Silicon Valley but built across Middle America, forming a brand-new American manufacturing asset class.", "speaker": "Connor Love, Collen Larson", "type": "prediction", "entities": ["Silicon Valley", "Middle America"], "conviction": "high", "so_what": "Frames US manufacturing as an emerging investable category for venture, PE, and credit.", "quote": "creating what will become a brand new American manufacturing asset class", "locator": "We are entering a new age", "quote_verified": true}]}], "insight_total": 36, "top_entities": ["Anduril", "Castelion", "Hadrian", "Amca", "SpaceX", "Pentagon", "Nominal", "China", "FQ-44 Fury", "RTX", "Apollo"], "source_meta": {"author": "Connor Love, Collen Larson", "word_count": 4448, "paywalled": false}}, {"record_id": "420bc491cf6ff7bf", "source_type": "concepts", "source_name": "BCG Henderson Institute", "source_url": "https://www.bcg.com/publications/2026/approach-foresight-right-company", "title": "Which Strategic Foresight Approach Is Best for You?", "published_date": "2026-10-02", "language": "en", "processed_at": "2026-10-03T11:14:15Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech", "Energy"], "gist": "BCG Henderson Institute, drawing on research into 500+ organizations, argues companies should match their strategic foresight approach to their strategy, since those using the wrong one were ~20 points less confident in handling disruption. It proposes four archetypes—listener, scout, visionary, navigator—defined by wave-rider vs. wave-maker objectives and many-small vs. few-big innovation bets, with AI and digital twins increasingly augmenting each.", "themes": [{"theme": "Foresight fit beats technique-chasing", "insights": [{"claim": "BCG argues most companies do strategic foresight poorly, chasing the latest techniques in a scattershot way instead of building a portfolio of foresight capabilities matched to their strategic challenges and business models.", "speaker": "https://www.bcg.com/about/people/experts/alan-iny", "type": "thesis", "entities": ["BCG"], "conviction": "high", "so_what": "Firms dabbling in many foresight methods likely waste spend without improving disruption readiness.", "quote": "Companies often chase the latest techniques in a scattershot way.", "locator": "But in our experience, too few do it well", "quote_verified": true}, {"claim": "In BCG research covering over 500 organizations, companies applying the wrong foresight approach were roughly 20 percentage points less likely to express confidence in their ability to predict and adapt to disruption.", "speaker": "https://www.bcg.com/about/people/experts/alan-iny", "type": "data_point", "entities": ["BCG"], "conviction": "high", "so_what": "Mismatch between foresight style and strategy measurably erodes management confidence in handling disruption.", "quote": "those applying the wrong approach were roughly 20 percentage points less likely to express confidence in their ability to predict and adapt to disruption", "locator": "Based on our experience and research", "quote_verified": true}, {"claim": "Organizations are increasingly building foresight engines that augment human intuition, some using AI-accelerated insights drawn from real-time data.", "speaker": "https://www.bcg.com/about/people/experts/alan-iny", "type": "thesis", "entities": ["AI"], "conviction": "medium", "so_what": "Signals rising corporate demand for AI-driven data and analytics tooling for strategy.", "quote": null, "locator": "Strategic foresight—the ability to anticipate", "quote_verified": false}, {"claim": "Foresight delivers competitive advantage only if it systematically drives real-world actions; companies must strengthen links between strategic insight and execution after choosing a style.", "speaker": "https://www.bcg.com/about/people/experts/alan-iny", "type": "thesis", "entities": [], "conviction": "high", "so_what": "Evaluate corporate foresight claims by whether they translate into capital and operating decisions.", "quote": "even the best foresight capabilities deliver competitive advantage only if they systematically drive real-world actions that create new value", "locator": "Once you’re clear on the right style", "quote_verified": true}]}, {"theme": "Two-axis archetype framework", "insights": [{"claim": "BCG maps foresight into four archetypes along two axes: strategic objective (wave rider outperforming in today's game vs. wave maker hunting disruptive opportunities) and innovation portfolio (many small short-term investments vs. a few big long-horizon bets).", "speaker": "https://www.bcg.com/about/people/experts/alan-iny", "type": "framework", "entities": ["BCG"], "conviction": "high", "so_what": "Gives a lens to classify how a company's foresight setup fits its strategy and capital allocation.", "quote": null, "locator": "We locate our archetypes along two dimensions", "quote_verified": false}, {"claim": "The four resulting styles are: listener (fast insights in today's game), scout (shaping an innovation portfolio for tomorrow), visionary (timing a big bet), and navigator (maximizing a large capital investment in a complex ecosystem).", "speaker": "https://www.bcg.com/about/people/experts/alan-iny", "type": "framework", "entities": [], "conviction": "high", "so_what": "Maps foresight organization design to business model type.", "quote": null, "locator": "These two dimensions define four styles", "quote_verified": false}, {"claim": "The right answer may be a portfolio of foresight styles across business units—e.g., listener for the core business, scout for disruptive opportunities, visionary for a blockbuster initiative—with the mix evolving over time.", "speaker": "https://www.bcg.com/about/people/experts/alan-iny", "type": "framework", "entities": [], "conviction": "medium", "so_what": "Multi-unit conglomerates should run differentiated foresight, not one centralized model.", "quote": "The answer might lie with a portfolio of approaches tailored to different business units or initiatives.", "locator": "What’s the right approach to foresight", "quote_verified": true}]}, {"theme": "Listeners: real-time signal-to-shelf", "insights": [{"claim": "The listener style uses near-real-time data flows (buying behavior, social media, logistics) to optimize investment and operations, and fits when customer preferences are articulable or inferable and offerings can be reshaped rapidly.", "speaker": "https://www.bcg.com/about/people/experts/alan-iny", "type": "framework", "entities": [], "conviction": "high", "so_what": "Favors companies with fast product cycles and rich live customer data.", "quote": null, "locator": "Listeners Make Sense of the Noise", "quote_verified": false}, {"claim": "Listener systems work best with a small dedicated analytical team at the nexus of strategy, product development, and operations, linked to distributed sensors, sales data, social feeds, and customer-facing staff.", "speaker": "https://www.bcg.com/about/people/experts/alan-iny", "type": "framework", "entities": [], "conviction": "medium", "so_what": "Organizational design, not data volume, determines whether signals get monetized.", "quote": null, "locator": "Because speed is critical to how listeners", "quote_verified": false}, {"claim": "Inditex/Zara and L'Oréal are cited as consumer companies that excel at listener-style foresight, and a European port is experimenting with a live digital twin fed by weather, tide, water-depth, and vessel data to optimize scheduling and berthing.", "speaker": "https://www.bcg.com/about/people/experts/alan-iny", "type": "anecdote", "entities": ["Inditex", "Zara", "L’Oréal"], "conviction": "medium", "so_what": "Fast-fashion and beauty leaders are framed as benchmarks for data-driven responsiveness.", "quote": "Consumer companies like Inditex/Zara and L’Oréal excel at this approach", "locator": "Consumer companies like Inditex/Zara", "quote_verified": true}, {"claim": "BCG predicts listener systems will feed AI-driven ideation engines and evolve into signal-to-shelf engines that move seamlessly from insight to design to manufacturing.", "speaker": "https://www.bcg.com/about/people/experts/alan-iny", "type": "prediction", "entities": ["AI"], "conviction": "medium", "so_what": "Points to compressing product cycles and demand for integrated AI design-to-manufacturing tooling in consumer goods.", "quote": "Listener systems are evolving rapidly and are likely to become signal-to-shelf engines that move seamlessly from insight to design to manufacturing.", "locator": "Increasingly, listener systems can channel", "quote_verified": true}]}, {"theme": "Scouts: weak signals and adjacencies", "insights": [{"claim": "Scout-style foresight triangulates diverse data streams—patents, scientific literature, investment flows, rival partnering, upstart traction—to find unexpressed needs and adjacencies at the intersection of shifting demand and the company's right to win.", "speaker": "https://www.bcg.com/about/people/experts/alan-iny", "type": "framework", "entities": [], "conviction": "high", "so_what": "Patent citations and rival investment patterns are flagged as leading indicators of disruption.", "quote": "Are the company’s patents being cited in unexpected domains?", "locator": "Scouts Uncover Emerging Unexpressed Needs", "quote_verified": true}, {"claim": "Scout systems work best when decentralized and participatory but linked to central innovation analytics, using employee free time, seed funding, and corporate venture capital—practices cited at Google, 3M, and Adobe.", "speaker": "https://www.bcg.com/about/people/experts/alan-iny", "type": "framework", "entities": ["Google", "3M", "Adobe"], "conviction": "medium", "so_what": "CVC arms and internal seed programs are framed as foresight infrastructure, not just financial bets.", "quote": null, "locator": "Recognizing this, scouts encourage the wisdom", "quote_verified": false}, {"claim": "IBM Research runs an annual global technology outlook that crowdsources ideas then narrows them via centralized analytics; a similar process led Bosch to apply its automotive stability-control sensor expertise to consumer electronics (phone auto-rotate, motion gaming, fitness trackers).", "speaker": "https://www.bcg.com/about/people/experts/alan-iny", "type": "anecdote", "entities": ["IBM Research", "Bosch"], "conviction": "medium", "so_what": "Shows how structured scouting can unlock adjacent markets for existing industrial IP.", "quote": null, "locator": "Some scout systems are more formal", "quote_verified": false}]}, {"theme": "Visionaries: triggers for big bets", "insights": [{"claim": "Visionary foresight suits organizations with one or a few game-changing bets; it focuses on sensing what must be true for success—technical specs, customer price point, ecosystem dependencies, regulation—and on predefined triggers for action set by senior leadership.", "speaker": "https://www.bcg.com/about/people/experts/alan-iny", "type": "framework", "entities": [], "conviction": "high", "so_what": "For big-bet companies, watch whether management has explicit go/no-go triggers.", "quote": null, "locator": "Visionaries Test Hypotheses and Sense Triggers", "quote_verified": false}, {"claim": "Apple set size, weight, and storage criteria before committing to an MP3 player; after seeing Toshiba's 1.8-inch 5 GB hard drive in February 2001, it released the iPod by early November and sold over 125,000 units by December 2001.", "speaker": "https://www.bcg.com/about/people/experts/alan-iny", "type": "anecdote", "entities": ["Apple", "Toshiba", "iPod"], "conviction": "high", "so_what": "Illustrates how component breakthroughs can serve as triggers that unlock a pre-planned bet.", "quote": "by December 2001, it had sold over 125,000 units", "locator": "Consider the first portable MP3 audio players", "quote_verified": true}, {"claim": "BCG expects agentic AI bots to complement person-to-person scanning—monitoring scientific publications, patents, regulation, rival hiring, conference proceedings, and venture funding—with leading-edge systems tying foresight outputs directly to strategic choices.", "speaker": "https://www.bcg.com/about/people/experts/alan-iny", "type": "prediction", "entities": ["agentic AI"], "conviction": "exploratory", "so_what": "Agentic AI is positioned as an enterprise strategy/intelligence use case.", "quote": null, "locator": "Clearly such person-to-person investigation remains important", "quote_verified": false}]}, {"theme": "Navigators: capital-heavy ecosystem bets", "insights": [{"claim": "Navigator foresight fits capital-intensive, long-return bets bounded by external factors—e.g., a materials company opening a new mine or an energy company expanding into renewables—where outcomes depend on suppliers, competitors, infrastructure owners, regulators, and large customers.", "speaker": "https://www.bcg.com/about/people/experts/alan-iny", "type": "framework", "entities": ["renewables"], "conviction": "high", "so_what": "Mining, energy, and utility investors should weight ecosystem and regulatory scenarios over customer demand forecasting.", "quote": null, "locator": "Navigators Map the Currents", "quote_verified": false}, {"claim": "Navigator systems are centralized teams tied to senior leadership that use scenario planning and war gaming; mining firms use scenarios on commodity-price drivers to weigh new-mine ROI, and utilities are experimenting with digital twins for grid and network planning.", "speaker": "https://www.bcg.com/about/people/experts/alan-iny", "type": "data_point", "entities": ["digital twins", "utilities"], "conviction": "medium", "so_what": "Digital twin adoption in grid planning signals a growing simulation-software market for utilities.", "quote": "Utilities, for example, are experimenting with digital twins to help optimize grid and network planning.", "locator": "Navigator systems tend to be centralized teams", "quote_verified": true}]}], "insight_total": 19, "top_entities": ["BCG", "Inditex", "Zara", "L’Oréal", "Google", "3M", "Adobe", "IBM Research", "Bosch", "Apple", "Toshiba", "iPod"], "source_meta": {"author": "https://www.bcg.com/about/people/experts/alan-iny", "word_count": 1873, "paywalled": false}}, {"record_id": "4706696e23785dcc", "source_type": "concepts", "source_name": "Chatham House", "source_url": "https://www.chathamhouse.org/2026/10/war-has-returned-tigray-time-it-may-not-stay-ethiopia", "title": "War has returned to Tigray. This time it may not stay in Ethiopia", "published_date": "2026-10-01", "language": "en", "processed_at": "2026-10-03T11:14:18Z", "processor": "claude-code-sub-opus", "tags": ["Geopolitics", "Society"], "gist": "War resumed in Tigray on 23 September 2026 after the Pretoria Agreement unravelled, with federal forces advancing on Mekelle and drone strikes reaching Addis Ababa. Chatham House argues the fractured TPLF and a shaky opposition 'Alliance for Survival' face a cautious federal government, while Eritrea and Sudan entanglements (Tsimdo, Assab, GERD) and weak AU mediation make a protracted war with regional spillover likely.", "themes": [{"theme": "Tigray war resumes", "insights": [{"claim": "Conflict resumed in Ethiopia's Tigray region on 23 September 2026 when TPLF forces stormed three national airports in Tigray and expanded ground offensives along the borders with Amhara and Afar.", "speaker": "Chatham House", "type": "data_point", "entities": ["TPLF", "Tigray", "Amhara", "Afar", "Ethiopia"], "conviction": "high", "so_what": "Marks a return to open civil war in Africa's second-most-populous country, raising sovereign and regional risk premia.", "quote": "Conflict returned to Ethiopia’s northern region of Tigray on 23 September", "locator": "Conflict returned to Ethiopia’s northern region", "quote_verified": true}, {"claim": "Early battlefield results were mixed: the TPLF and allies captured parts of Afar but lost key areas in southern Tigray including Alamata, while federal forces and the allied Tigray Peace Force advance toward Mekelle.", "speaker": "Chatham House", "type": "data_point", "entities": ["TPLF", "Afar", "Alamata", "Tigray Peace Force", "Mekelle"], "conviction": "high", "so_what": "Federal momentum toward the regional capital suggests escalation rather than quick stalemate.", "quote": "Ethiopia’s federal government forces and the allied Tigray Peace Force (TPF) are now advancing towards Mekelle", "locator": "The TPLF and its allies captured", "quote_verified": true}, {"claim": "Reported drone strikes in Addis Ababa and on government-controlled airbases change the character of the Ethiopian conflict by bringing it to the capital.", "speaker": "Chatham House", "type": "causal", "entities": ["Addis Ababa", "Ethiopia"], "conviction": "medium", "so_what": "Strikes on the capital raise risk for urban economic activity, aviation and foreign investors in Addis Ababa.", "quote": "reports of drone strikes in Addis Ababa and on government-controlled airbases alters the nature of the war", "locator": "Meanwhile, reports of drone strikes", "quote_verified": true}, {"claim": "The 2022 Pretoria Agreement failed because of a persistent zero-sum approach by both the federal government and the TPLF plus weak implementation and oversight; it effectively unravelled in May 2026 when the TPLF reinstated its pre-war legislative council and named Debretsion Gebremichael regional president, ending the Tigray Interim Regional Administration.", "speaker": "Chatham House", "type": "causal", "entities": ["Pretoria Agreement", "TPLF", "Debretsion Gebremichael", "Tigray Interim Regional Administration"], "conviction": "high", "so_what": "Shows peace frameworks without enforcement decay; ceasefire headlines in the region should be discounted.", "quote": "a continued zero-sum approach by both sides, as well as weak implementation and oversight", "locator": "The slow creep towards renewed conflict", "quote_verified": true}, {"claim": "The TPLF was partly pushed into war by continued containment of Tigray, no implementation or dispute mechanism under Pretoria, no incentives to rejoin the federal fold, eroding legitimacy at home and recent government drone attacks.", "speaker": "Chatham House", "type": "causal", "entities": ["TPLF", "Tigray", "Pretoria Agreement"], "conviction": "medium", "so_what": "Structural drivers persist, implying conflict is not a one-off flare-up.", "quote": null, "locator": "The TPLF views the recent escalation", "quote_verified": false}, {"claim": "Unlike in the 2020-22 war, the Ethiopian federal government has been more cautious and calculated in actions and messaging, framing the TPLF as a rogue administration colluding with internal insurgents and external actors against Ethiopia's territorial integrity.", "speaker": "Chatham House", "type": "framework", "entities": ["Ethiopian federal government", "TPLF"], "conviction": "medium", "so_what": "Government narrative-building suggests preparation for a sustained campaign with international cover.", "quote": "the federal government has been more cautious and calculated in its actions as well as public messaging", "locator": "But unlike in the 2020–22 war", "quote_verified": true}]}, {"theme": "Fractured Tigray and opposition alliance", "insights": [{"claim": "The TPLF's grip on Tigrayan society has weakened significantly since 2022, with protests over crippling economic conditions, rival parties, defections, forced recruitment of young men and crackdowns on speech.", "speaker": "Chatham House", "type": "data_point", "entities": ["TPLF", "Tigray"], "conviction": "high", "so_what": "A weakened TPLF raises odds of internal collapse but also of a worsening humanitarian crisis.", "quote": "The TPLF’s control over Tigrayan society has weakened significantly.", "locator": "Internal division in Tigray and", "quote_verified": true}, {"claim": "Since the offensive began, senior TPLF officials have reportedly been arrested or defected to Addis Ababa, indicating deep internal division within the party.", "speaker": "Chatham House", "type": "data_point", "entities": ["TPLF", "Addis Ababa"], "conviction": "medium", "so_what": "Elite defections can shorten the conflict in the federal government's favour.", "quote": null, "locator": "There is deep division within", "quote_verified": false}, {"claim": "Days before fighting resumed, the TPLF and six other armed opposition groups including Amhara's Fano and the Oromo Liberation Army formed the 'Alliance for Survival', aiming to remove Prime Minister Abiy Ahmed and the Prosperity Party and install a transitional government.", "speaker": "Chatham House", "type": "data_point", "entities": ["TPLF", "Fano", "Oromo Liberation Army", "Alliance for Survival", "Abiy Ahmed", "Prosperity Party"], "conviction": "high", "so_what": "A multi-front challenge to Abiy raises regime-stability risk for Ethiopia.", "quote": null, "locator": "Days before the fighting resumed", "quote_verified": false}, {"claim": "The Alliance for Survival is an uneasy tactical coalition unlikely to deliver functional cooperation: senior Fano leaders publicly oppose it, a divided OLA may struggle to justify it, and Fano and the OLA have been violent enemies while the TPLF accuses Fano of grave abuses in Tigray.", "speaker": "Chatham House", "type": "contrarian", "entities": ["Alliance for Survival", "Fano", "Oromo Liberation Army", "TPLF"], "conviction": "medium", "so_what": "Limits the existential threat to the Abiy government despite the headline coalition.", "quote": "it is not immediately clear that this uneasy tactical alliance", "locator": "But it is not immediately clear", "quote_verified": true}]}, {"theme": "Regional spillover: Eritrea and Sudan", "insights": [{"claim": "The key strategic question is whether Addis Ababa contains the war within northern Ethiopia or pursues bolder options such as targeting Eritrea, which it accuses of backing anti-government movements; Ethiopia has already closed its embassy in Eritrea and expelled Eritrean diplomats.", "speaker": "Chatham House", "type": "prediction", "entities": ["Ethiopia", "Eritrea"], "conviction": "medium", "so_what": "An Ethiopia-Eritrea interst h MARA for operational synergies.", "speaker": "Glencore investor reports", "type": "causal", "entities": ["Alumbrera", "MARA"], "conviction": "high", "so_what": "Sequencing a brownfield restart ahead of a large project lowers execution risk and capex intensity versus a greenfield build.", "quote": "It is designed to reduce ramp-up risk for the concentrator and downstream logistics", "locator": "The restart is a natural enabler", "quote_verified": true}]}, {"theme": "Agua Rica resource and output", "insights": [{"claim": "The Agua Rica deposit in Catamarca has estimated measured and indicated resources of about 1.2 billion tonnes of ore grading 0.47% copper, 0.20 g/t gold, 3.40 g/t silver and 0.03% molybdenum.", "speaker": "Glencore investor reports", "type": "data_point", "entities": ["Agua Rica", "copper", "gold", "silver", "molybdenum"], "conviction": "high", "so_what": "Defines a large, long-life polymetallic resource with meaningful by-product credits.", "quote": "c.1.2 billion tonnes of ore, with average grades of 0.47% copper, 0.20 g/t gold, 3.40 g/t silver and 0.03% molybdenum", "locator": "About Agua Rica", "quote_verified": true}, {"claim": "MARA plans to process Agua Rica ore at the existing Alumbrera facilities located 35km from the Agua Rica pit, combining the two into one project.", "speaker": "Glencore investor reports", "type": "framework", "entities": ["Agua Rica", "Alumbrera", "MARA"], "conviction": "high", "so_what": "Reusing existing processing infrastructure should lower capital needs and time to production.", "quote": "The project plans to use the Alumbrera processing facilities, located 35km from the Agua Rica pit", "locator": "About Agua Rica", "quote_verified": true}, {"claim": "MARA has the potential to produce an average of more than 200,000 tonnes of copper in concentrate per year during its first ten years of operation.", "speaker": "Glencore investor reports", "type": "prediction", "entities": ["MARA", "copper"], "conviction": "medium", // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
