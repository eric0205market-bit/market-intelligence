: "2026-11-03T11:11:09Z", "processor": "claude-code-sub-opus", "tags": ["Macro"], "gist": "A November 2026 Liberty Street Economics index page previews a post by Correia, Luck and Verner on how supervisors handle failing banks. It argues closures rest on book-equity data that supervision partly shapes, and that stricter supervision lowers resolution costs but can restrict credit supply.", "themes": [{"theme": "How banks actually fail", "insights": [{"claim": "Bank failures typically result from supervisory closure decisions that are based on hard information about book equity, rather than from market-driven runs alone.", "speaker": "Sergio Correia, Stephan Luck, and Emil Verner", "type": "thesis", "entities": ["Sergio Correia", "Stephan Luck", "Emil Verner", "NY Fed"], "conviction": "high", "so_what": "Book-equity reporting, not market signals, is the trigger to watch for bank closures.", "quote": "bank failures typically result from supervisory closure decisions based on hard information about book equity", "locator": "In this post", "quote_verified": true}]}, {"theme": "Supervision shapes the information", "insights": [{"claim": "The hard book-equity information that triggers closures is itself partly produced by supervision, because supervisors require troubled banks to recognize potential losses.", "speaker": "Sergio Correia, Stephan Luck, and Emil Verner", "type": "causal", "entities": ["Sergio Correia", "Stephan Luck", "Emil Verner", "NY Fed"], "conviction": "medium", "so_what": "Reported capital at troubled banks reflects supervisory pressure, so reported equity may lag or jump when supervisors push loss recognition.", "quote": null, "locator": "In this post", "quote_verified": false}]}, {"theme": "Supervisory trade-off", "insights": [{"claim": "Stricter supervision can reduce the costs of resolving failing banks.", "speaker": "Sergio Correia, Stephan Luck, and Emil Verner", "type": "causal", "entities": ["Sergio Correia", "Stephan Luck", "Emil Verner", "NY Fed"], "conviction": "medium", "so_what": "Earlier, firmer intervention lowers resolution losses, which matters for deposit insurance and taxpayers.", "quote": null, "locator": "In this post", "quote_verified": false}, {"claim": "Stricter supervision can also tighten regulatory capital constraints and hold back credit supply.", "speaker": "Sergio Correia, Stephan Luck, and Emil Verner", "type": "causal", "entities": ["Sergio Correia", "Stephan Luck", "Emil Verner", "NY Fed"], "conviction": "medium", "so_what": "Tougher supervision of weak banks can weigh on lending and credit availability, a macro and bank-credit headwind.", "quote": null, "locator": "In this post", "quote_verified": false}, {"claim": "Supervision faces a trade-off between lower resolution costs and tighter capital constraints that restrain credit supply.", "speaker": "Sergio Correia, Stephan Luck, and Emil Verner", "type": "framework", "entities": ["Sergio Correia", "Stephan Luck", "Emil Verner", "NY Fed"], "conviction": "medium", "so_what": "Policy shifts toward stricter or looser supervision carry a cost-versus-credit tradeoff that bank investors should price.", "quote": null, "locator": "In this post", "quote_verified": false}]}], "insight_total": 5, "top_entities": ["Sergio Correia", "Stephan Luck", "Emil Verner", "Liberty Street Economics", "book equity"], "source_meta": {"author": "", "word_count": 143, "paywalled": false}}, {"record_id": "d587005198c43fef", "source_type": "concepts", "source_name": "NY Fed — Liberty Street Economics", "source_url": "https://libertystreeteconomics.newyorkfed.org/2026/11/how-do-banking-supervisors-deal-with-failing-banks/", "title": "How Do Banking Supervisors Deal with Failing Banks? - Liberty Street Economics", "published_date": "2026-11-02", "language": "en", "processed_at": "2026-11-03T11:11:18Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Positioning"], "gist": "NY Fed staff research using 2000-2023 exam data finds bank failures are supervisory closure decisions driven by low reported book equity (near-certain failure risk below 2% equity-to-assets), and that supervisors themselves shape that equity through forced restatements. Stricter supervision cut FDIC resolution costs but reduced credit supply in the GFC.", "themes": [{"theme": "Failures are supervisory decisions", "insights": [{"claim": "Banks almost always fail on Fridays, the FDIC's preferred closure day: only 28 of 557 commercial bank failures since 2000 occurred on another day.", "speaker": "Sergio Correia, Stephan Luck, and Emil Verner", "type": "data_point", "entities": ["FDIC"], "conviction": "high", "so_what": "Closures are scheduled administrative events, not market-triggered runs, so supervisory signals lead failures.", "quote": null, "locator": "Bank Closures Are Supervisory Decisions", "quote_verified": false}, {"claim": "Failed banks are almost always purchased by another bank, with the purchase typically arranged before the formal failure.", "speaker": "Sergio Correia, Stephan Luck, and Emil Verner", "type": "data_point", "entities": ["FDIC"], "conviction": "high", "so_what": "Resolution is pre-negotiated, limiting surprise losses for acquirers and creditors.", "quote": null, "locator": "Bank Closures Are Supervisory Decisions", "quote_verified": false}, {"claim": "Before federal deposit insurance (1865-1935), failure dates were effectively uniformly distributed across weekdays, implying owners or depositors set the timing; modern supervisory action partly substitutes for lost depositor discipline.", "speaker": "Sergio Correia, Stephan Luck, and Emil Verner", "type": "causal", "entities": ["FDIC"], "conviction": "medium", "so_what": "Deposit insurance shifts the trigger from market discipline to supervisors, who become the key variable to track.", "quote": null, "locator": "Bank Closures Are Supervisory Decisions", "quote_verified": false}]}, {"theme": "Hard information thresholds", "insights": [{"claim": "Banks with an equity-to-assets ratio above 5 percent effectively never fail; failure probability rises rapidly below 5 percent and reaches almost 70 percent within a year when the ratio is under 2 percent.", "speaker": "Sergio Correia, Stephan Luck, and Emil Verner", "type": "data_point", "entities": ["equity-to-assets ratio"], "conviction": "high", "so_what": "Gives concrete capital thresholds for screening bank failure risk.", "quote": null, "locator": "Supervisors Act Based on Hard Information", "quote_verified": false}, {"claim": "Banks with equity-to-assets above 7.5 percent are typically rated CAMELS 1 or 2 (average about 1.8), while those below 4 percent are almost always rated 4 or 5, averaging well above 4.", "speaker": "Sergio Correia, Stephan Luck, and Emil Verner", "type": "data_point", "entities": ["CAMELS"], "conviction": "high", "so_what": "Downgrades track reported capital, so ratings are a lagging confirmation of financial-statement stress.", "quote": null, "locator": "Supervisors Act Based on Hard Information", "quote_verified": false}, {"claim": "For distressed banks the composite CAMELS rating coincides with the capital rating, while for well-capitalized banks it sits closer to the management rating, indicating supervisory discretion only when banks are not in distress.", "speaker": "Sergio Correia, Stephan Luck, and Emil Verner", "type": "framework", "entities": ["CAMELS"], "conviction": "medium", "so_what": "Discretion matters for healthy banks; for weak ones the numbers dictate outcomes.", "quote": null, "locator": "Supervisors Act Based on Hard Information", "quote_verified": false}, {"claim": "Supervisors close banks based on low reported book equity combined with a supervisory rating signaling risk of failure.", "speaker": "Sergio Correia, Stephan Luck, and Emil Verner", "type": "thesis", "entities": ["supervisors"], "conviction": "high", "so_what": "Watch reported book equity and CAMELS downgrades as closure triggers.", "quote": null, "locator": "Supervisors Act Based on Hard Information", "quote_verified": false}]}, {"theme": "Supervisors produce the hard information", "insights": [{"claim": "Revisions of previously submitted call reports rise slightly in the two months before an on-site examination and spike in the exam month and the two months after, suggesting exams force loss recognition.", "speaker": "Sergio Correia, Stephan Luck, and Emil Verner", "type": "data_point", "entities": ["call reports"], "conviction": "high", "so_what": "Reported capital understates true losses until exams force restatement.", "quote": null, "locator": "Supervisors Shape Hard Information", "quote_verified": false}, {"claim": "In the five years before failure, a typical failing bank sees an 8 percentage point drop in equity-to-assets, with revisions accounting for nearly 3 points of it.", "speaker": "Sergio Correia, Stephan Luck, and Emil Verner", "type": "data_point", "entities": ["equity-to-assets ratio"], "conviction": "high", "so_what": "Roughly a third of the visible decline comes from restatements, so initial filings overstate capital at troubled banks.", "quote": null, "locator": "Supervisors Shape Hard Information", "quote_verified": false}, {"claim": "CAMELS ratings and bank capitalization are jointly determined in distressed banks, because supervisors shape the book equity numbers they then act on.", "speaker": "Sergio Correia, Stephan Luck, and Emil Verner", "type": "causal", "entities": ["CAMELS"], "conviction": "medium", "so_what": "Reported capital for weak banks is partly endogenous to supervisory pressure.", "quote": null, "locator": "Supervisors Shape Hard Information", "quote_verified": false}]}, {"theme": "Strictness versus forbearance trade-off", "insights": [{"claim": "In a 2008 GFC natural experiment with quasi-randomly assigned supervisors, stricter supervisors (worse CAMELS for the same condition) caused banks to recognize more losses, report lower book equity and fail more often.", "speaker": "Sergio Correia, Stephan Luck, and Emil Verner", "type": "causal", "entities": ["GFC", "CAMELS"], "conviction": "high", "so_what": "Supervisor stringency directly drives failure rates independent of fundamentals.", "quote": null, "locator": "The Trade-Off between Strictness and Forbearance", "quote_verified": false}, {"claim": "Stricter supervision lowered FDIC resolution costs but reduced credit supply in the short term.", "speaker": "Sergio Correia, Stephan Luck, and Emil Verner", "type": "causal", "entities": ["FDIC"], "conviction": "high", "so_what": "Tough loss recognition protects the insurance fund but tightens credit when conditions are weak.", "quote": null, "locator": "The Trade-Off between Strictness and Forbearance", "quote_verified": false}, {"claim": "Strictness curbs gambling for resurrection and zombie banks that misallocate credit, while forbearance can preserve credit and let banks recover if asset values improve; deposit insurance makes the trade-off sharper by weakening market discipline.", "speaker": "Sergio Correia, Stephan Luck, and Emil Verner", "type": "framework", "entities": ["deposit insurance"], "conviction": "medium", "so_what": "Supervisory posture in a downturn is a key swing factor for credit availability and bank equity.", "quote": null, "locator": "The Trade-Off between Strictness and Forbearance", "quote_verified": false}, {"claim": "The authors' analysis is positive only and draws no normative conclusion about the optimal degree of supervisory strictness; strictness operates mainly through producing hard information, which determines closures.", "speaker": "Sergio Correia, Stephan Luck, and Emil Verner", "type": "thesis", "entities": ["supervisors"], "conviction": "medium", "so_what": "The paper does not endorse a policy stance, so do not read it as signaling regulatory direction.", "quote": null, "locator": "Wrapping Up", "quote_verified": false}]}], "insight_total": 14, "top_entities": ["FDIC", "CAMELS", "Liberty Street Economics", "GFC", "call reports", "equity-to-assets", "deposit insurance", "Federal Reserve Bank of New York"], "source_meta": {"author": "Sergio Correia, Stephan Luck, and Emil Verner", "word_count": 2121, "paywalled": false}}, {"record_id": "0116a74172076003", "source_type": "concepts", "source_name": "Oxford Economics", "source_url": "https://www.oxfordeconomics.com/resource/bank-of-japan-will-continue-rate-hikes-to-keep-inflation-at-the-target/", "title": "Bank of Japan will continue rate hikes to keep inflation at the target", "published_date": "2026-10-30", "language": "en", "processed_at": "2026-11-03T11:11:13Z", "processor": "claude-code-sub-opus", "tags": ["Macro"], "gist": "Oxford Economics says the BoJ held at 1.25% in a hawkish pause and will likely hike in December and April to 1.75%. It argues target-level inflation reflects supply-side pass-through more than wage-driven demand, and the BoJ is also speeding up ETF sales.", "themes": [{"theme": "BoJ hawkish pause and rate path", "insights": [{"claim": "The Bank of Japan held its policy rate at 1.25% on 30 Oct 2026 in a widely expected 'hawkish pause' that did not change Oxford Economics' near-term forecast.", "speaker": "Yasuko Koido", "type": "data_point", "entities": ["Bank of Japan", "Oxford Economics"], "conviction": "high", "so_what": "No surprise in the October hold; focus shifts to December.", "quote": "delivered a ‘hawkish pause’ today, keeping its policy rate at 1.25%", "locator": "Intro", "quote_verified": true}, {"claim": "Oxford Economics expects the BoJ to hike in December and April to a terminal rate of 1.75%.", "speaker": "Yasuko Koido", "type": "prediction", "entities": ["Bank of Japan", "Oxford Economics"], "conviction": "high", "so_what": "Implies two further 25bp hikes; supports yen and pressures JGB yields.", "quote": null, "locator": "Intro", "quote_verified": false}, {"claim": "The BoJ said more rate hikes are needed to prevent inflation overshooting the target.", "speaker": "Yasuko Koido", "type": "thesis", "entities": ["Bank of Japan"], "conviction": "high", "so_what": "Policy bias is tightening, not neutral.", "quote": null, "locator": "Intro", "quote_verified": false}, {"claim": "If the supply-side shock lasts longer than expected, the BoJ may need to hike to 2% by July, just before the terms of the two most hawkish board members end, despite rising government pressure.", "speaker": "Yasuko Koido", "type": "prediction", "entities": ["Bank of Japan", "Japanese government"], "conviction": "low", "so_what": "Upside risk to the terminal rate and a possible faster hiking timetable.", "quote": null, "locator": "Risk scenario", "quote_verified": false}]}, {"theme": "Nature of Japan's inflation", "insights": [{"claim": "BoJ underlying inflation indicators have reached the 2% target, and Governor Ueda says policy focus has shifted from raising inflation to keeping it at 2% as risks are tilted to the upside.", "speaker": "Yasuko Koido", "type": "thesis", "entities": ["Bank of Japan", "Kazuo Ueda"], "conviction": "high", "so_what": "Regime shift from reflation to inflation control.", "quote": null, "locator": "Paragraph 2", "quote_verified": false}, {"claim": "Target-level underlying inflation was driven mainly by pass-through of external supply-side shocks rather than the wage-driven demand growth the government and BoJ pursued.", "speaker": "Yasuko Koido", "type": "contrarian", "entities": ["Bank of Japan", "Japanese government"], "conviction": "medium", "so_what": "Inflation quality is weaker than headline suggests, raising the risk of policy overtightening.", "quote": null, "locator": "Paragraph 3", "quote_verified": false}, {"claim": "Domestic demand has been resilient to rate hikes and the terms-of-trade shock but lacks momentum.", "speaker": "Yasuko Koido", "type": "data_point", "entities": ["Japan"], "conviction": "medium", "so_what": "Limited demand cushion if hikes continue.", "quote": null, "locator": "Paragraph 3", "quote_verified": false}, {"claim": "Oxford expects the inflation shock from higher energy prices and past yen depreciation to fade gradually, with inflation stabilising around 2% in late 2027.", "speaker": "Yasuko Koido", "type": "prediction", "entities": ["Oxford Economics", "Japanese Yen"], "conviction": "medium", "so_what": "Fading shock caps how far the BoJ needs to go beyond 1.75%.", "quote": null, "locator": "Paragraph 4", "quote_verified": false}]}, {"theme": "ETF holdings unwind", "insights": [{"claim": "The BoJ will raise annual sales of its ETF holdings from 330 billion yen to 860 billion yen from 2027.", "speaker": "Yasuko Koido", "type": "data_point", "entities": ["Bank of Japan"], "conviction": "high", "so_what": "More supply of ETFs into the Japanese equity market, though still small.", "quote": null, "locator": "Final paragraph", "quote_verified": false}, {"claim": "The faster ETF sales shorten the time to complete the unwind from about 112 years to 43 years.", "speaker": "Yasuko Koido", "type": "data_point", "entities": ["Bank of Japan"], "conviction": "high", "so_what": "Even the faster pace implies a decades-long overhang, so the market impact is gradual.", "quote": null, "locator": "Final paragraph", "quote_verified": false}]}], "insight_total": 10, "top_entities": ["Bank of Japan", "Kazuo Ueda", "Japanese Yen", "ETF", "BoJ"], "source_meta": {"author": "Yasuko Koido", "word_count": 509, "paywalled": false}}, {"record_id": "29ffe02b18d8dd15", "source_type": "concepts", "source_name": "Palladium Magazine", "source_url": "https://www.palladiummag.com/2026/11/02/do-not-tread-lightly/", "title": "Do Not Tread Lightly", "published_date": "2026-11-02", "language": "en", "processed_at": "2026-11-03T11:11:23Z", "processor": "claude-code-sub-opus", "tags": ["Society", "Tech"], "gist": "A widow argues that law, regulation and cultural norms leave families only cremation, burial or donation, blocking preservation of the body even though preservation chemicals and techniques are cheap. She reframes the meaning of life around material legacy and funerary rites as a marker of civilization.", "themes": [{"theme": "Legal limits on body disposition", "insights": [{"claim": "After death, a body's custody passes to the morgue, coroner and funeral home, and the funeral director said only two options exist: disposal or donation.", "speaker": "R. B.", "type": "thesis", "entities": ["funeral industry"], "conviction": "high", "so_what": "Regulation confines the death-care market to a narrow product set, leaving unserved demand for preservation.", "quote": "the funeral director ultimately informed me there are only two: disposal or donation", "locator": "Legal custody section", "quote_verified": true}, {"claim": "Cremation heats remains to 1,400-1,800 degrees Fahrenheit and pulverizes them, destroying all DNA; ashes are distinguishable only by paperwork chain of custody.", "speaker": "R. B.", "type": "data_point", "entities": ["cremation"], "conviction": "high", "so_what": "Cremation, the cheap default, is irreversible and forecloses any future biological use.", "quote": null, "locator": "cremation passage", "quote_verified": false}, {"claim": "Shared-coffin burial is essentially impossible because exhumation requires PPE, negative pressure tents, disinfectants, and thousands of dollars in funeral home, cemetery, vault, casket and legal fees, and is legally permitted only for relocation or forensic examination.", "speaker": "R. B.", "type": "data_point", "entities": ["exhumation", "cemeteries"], "conviction": "high", "so_what": "Regulatory and fee layers make post-burial access prohibitively costly.", "quote": null, "locator": "shared coffin passage", "quote_verified": false}, {"claim": "Most cemeteries require each casket in a separate reinforced vault, so burial in the vast majority of cases forfeits any future physical presence with the loved one.", "speaker": "R. B.", "type": "data_point", "entities": ["cemeteries"], "conviction": "medium", "so_what": "Vault rules lock in the irreversibility of burial.", "quote": null, "locator": "Wuthering Heights passage", "quote_verified": false}, {"claim": "Body brokers and research institutions are granted far greater control over a donated body, for a few thousand dollars per body, than owners or next of kin can obtain at any price.", "speaker": "R. B.", "type": "contrarian", "entities": ["body brokers", "research institutions"], "conviction": "medium", "so_what": "Asymmetry between institutional and family rights over bodies is a regulatory-capture signal.", "quote": null, "locator": "Donation passage", "quote_verified": false}, {"claim": "In 2023 Oregon passed legislation allowing patients to keep amputated body parts after patients reportedly refused lifesaving surgeries that would have destroyed or discarded the limbs.", "speaker": "R. B.", "type": "data_point", "entities": ["Oregon"], "conviction": "medium", "so_what": "A precedent that incremental legal expansion of bodily rights is possible.", "quote": null, "locator": "Oregon passage", "quote_verified": false}]}, {"theme": "Cost and regulatory barriers to preservation", "insights": [{"claim": "Preservation technology has become cheap: the chemicals that preserved Rosalia Lombardo for a century cost barely $100 today, and excarnation of a medium mammal skeleton costs several hundred to several thousand dollars, less than a moderately nice coffin.", "speaker": "R. B.", "type": "data_point", "entities": ["Rosalia Lombardo"], "conviction": "medium", "so_what": "Cost is not the binding constraint on human preservation; law is.", "quote": null, "locator": "preservation costs passage", "quote_verified": false}, {"claim": "Legal barriers, regulatory burden and a tight market of qualified professionals inflate preservation costs even for non-human remains, and applying such skills to human remains is never permitted.", "speaker": "R. B.", "type": "causal", "entities": ["regulation"], "conviction": "medium", "so_what": "Regulation, not technology, creates scarcity and potential pricing power in preservation services.", "quote": null, "locator": "preservation costs passage", "quote_verified": false}, {"claim": "Abuse-of-a-corpse laws are cited as justification for the restrictions, yet the author argues the state assumes everyone wants the same anonymous rot or cremation regardless of individual personality.", "speaker": "R. B.", "type": "contrarian", "entities": ["abuse of a corpse laws"], "conviction": "medium", "so_what": "Uniform rules ignore heterogeneous preferences, an unserved niche for differentiated offerings.", "quote": null, "locator": "abuse of corpse passage", "quote_verified": false}, {"claim": "The Sedlec Ossuary contains bones from at least 40,000 skeletons, shaped into columns, a chandelier and a coat of arms, showing the line between honoring and exploiting the dead has always been blurry.", "speaker": "R. B.", "type": "data_point", "entities": ["Sedlec Ossuary"], "conviction": "medium", "so_what": "Historical precedent for respectful display undercuts the premise of the restrictions.", "quote": null, "locator": "Sedlec passage", "quote_verified": false}]}, {"theme": "Market tilt toward cheap disappearance", "insights": [{"claim": "Contrary to warnings about a predatory funeral industry upselling grieving customers, the author was repeatedly steered toward the cheap, easy, convenient option such as cardboard caskets and cremation.", "speaker": "R. B.", "type": "contrarian", "entities": ["funeral industry"], "conviction": "medium", "so_what": "Industry incentives and norms push low-cost disposal, shaping demand toward commodity services.", "quote": null, "locator": "predatory industry passage", "quote_verified": false}, {"claim": "The wealthy are sold disappearance too: the most expensive venue toured was a natural cemetery barring embalming chemicals, with tiny or absent grave markers and overgrown, hard-to-traverse terrain, certified by the Green Burial Council.", "speaker": "R. B.", "type": "anecdote", "entities": ["Green Burial Council"], "conviction": "medium", "so_what": "Premium death-care is trending toward green, anonymous burial rather than lasting memorials.", "quote": null, "locator": "natural cemetery passage", "quote_verified": false}, {"claim": "Limits on choice over the post-sentient state stem from a confluence of regulatory capture, inflated costs and unquestioned cultural assumptions.", "speaker": "R. B.", "type": "causal", "entities": ["regulatory capture"], "conviction": "medium", "so_what": "Frames death-care as a captured, culturally entrenched market ripe for disruption.", "quote": null, "locator": "post-sentient passage", "quote_verified": false}]}, {"theme": "Philosophy of legacy and civilization", "insights": [{"claim": "The author shifted from sentientism to a maximalist view of life's meaning: consciousness lasts mere years while the material effects of works and physical form can endure for centuries.", "speaker": "R. B.", "type": "thesis", "entities": [], "conviction": "high", "so_what": "Values placed on durable material legacy support long-horizon, legacy-oriented products and projects.", "quote": null, "locator": "maximalist view passage", "quote_verified": false}, {"claim": "Funerary rites embody three necessary qualities of civilization: valuing material legacy, honoring neighbors' wishes when unobserved, and belief in a shared future, which enabled pyramids, churches and scientific knowledge finished after their architects died.", "speaker": "R. B.", "type": "framework", "entities": ["civilization"], "conviction": "medium", "so_what": "Links long-term institutional capacity to respect for the dead and future-orientation.", "quote": null, "locator": "three fundamentals passage", "quote_verified": false}, {"claim": "Mummification practices are documented on every continent humans have lived on, including hunter-gatherer remains in Asia dating to 10,000 BC, so modern regulation marks a departure from an ancient, widespread desire to preserve the body.", "speaker": "R. B.", "type": "data_point", "entities": ["mummification"], "conviction": "medium", "so_what": "Preservation demand is historically universal, suggesting latent demand.", "quote": null, "locator": "mummification passage", "quote_verified": false}, {"claim": "Cryonics has not yet solved freezing human tissue without water crystallizing and destroying cellular structure, and companies must be subscribed to in advance to retrieve a body at the moment of death.", "speaker": "R. B.", "type": "data_point", "entities": ["cryonics"], "conviction": "medium", "so_what": "Cryonics remains technically unproven, leaving preservation alternatives as the practical option.", "quote": null, "locator": "cryonics passage", "quote_verified": false}]}], "insight_total": 17, "top_entities": ["Oregon", "Sedlec Ossuary", "Rosalia Lombardo", "Green Burial Council", "cryonics", "cremation", "Wuthering Heights", "Oakland"], "source_meta": {"author": "R. B.", "word_count": 2953, "paywalled": false}}, {"record_id": "35b97d9fba0ee6e6", "source_type": "concepts", "source_name": "Peterson Institute (PIIE)", "source_url": "https://www.piie.com/blogs/realtime-economics/2026/ai-could-do-my-first-job-not-my-last", "title": "AI Could Do My First Job. Not My Last.", "published_date": "2026-11-01", "language": "en", "processed_at": "2026-11-03T11:11:34Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Macro", "Society"], "gist": "Jason Furman argues AI could replace much of the analytic work of the 35-person Council of Economic Advisers (about ten humans plus AI), especially junior roles, while humans keep meeting- and coalition-driven jobs. He weighs Jevons-style demand effects, the threat to the junior training pipeline and his own mixed feelings about AI.", "themes": [{"theme": "AI can replace most analytic staff work at CEA", "insights": [{"claim": "Furman believes most of what the White House Council of Economic Advisers did under his 2013-2017 leadership could now be done by about ten people plus AI, versus a staff of about 35.", "speaker": "Jason Furman", "type": "thesis", "entities": ["Council of Economic Advisers", "Jason Furman"], "conviction": "high", "so_what": "Signals large headcount compression in analytic knowledge-work organizations.", "quote": null, "locator": "The Council of Economic Advisers", "quote_verified": false}, {"claim": "He told Neil Irwin he would choose today's AI systems over 20 staff with current and future Ph.D.s to run the CEA, and now thinks that figure may have understated the case.", "speaker": "Jason Furman", "type": "thesis", "entities": ["Neil Irwin", "Council of Economic Advisers"], "conviction": "medium", "so_what": "A prominent senior economist openly endorses AI over junior-to-mid economist headcount.", "quote": null, "locator": "The Council of Economic Advisers", "quote_verified": false}, {"claim": "As a junior CEA staffer under Clinton, Furman judges AI guided by seniors like Stiglitz and Yellen could do 95 percent of what he did: short analyses, data tracking, memos, report drafting, forecast work and speechwriting.", "speaker": "Jason Furman", "type": "data_point", "entities": ["Joe Stiglitz", "Janet Yellen", "Clinton administration"], "conviction": "high", "so_what": "Entry-level analytic tasks are the most automatable.", "quote": null, "locator": "The Messy Reality", "quote_verified": false}, {"claim": "AI exposure depends on task mix, not seniority or intelligence: roles of meetings, briefings, testimony and coalition-building are safe, while computer-based analysis and writing roles are exposed, even for experienced senior economists.", "speaker": "Jason Furman", "type": "framework", "entities": ["CEA Chair", "AI"], "conviction": "high", "so_what": "Screen jobs by share of interpersonal/coordination work rather than title or pay.", "quote": null, "locator": "The Messy Reality", "quote_verified": false}, {"claim": "Junior staff at the National Economic Council are probably safer from AI than even senior CEA staff because NEC work is running meetings, building coalitions and implementing policy.", "speaker": "Jason Furman", "type": "contrarian", "entities": ["National Economic Council", "CEA"], "conviction": "medium", "so_what": "Exposure measures by occupation or seniority can miss within-sector differences.", "quote": null, "locator": "The Messy Reality", "quote_verified": false}, {"claim": "AI poses more threat to some of the smartest people in academia, such as mathematicians, than to people in many other disciplines, and some colleagues wonder if their days as active researchers are numbered.", "speaker": "Jason Furman", "type": "contrarian", "entities": ["mathematicians"], "conviction": "low", "so_what": "High-skill research jobs are not automatically insulated.", "quote": null, "locator": "The Messy Reality", "quote_verified": false}]}, {"theme": "Current AI capability evidence (Furman's agent experiments)", "insights": [{"claim": "Furman's Paperwright multi-agent engine turned the prompt 'data centers and electricity prices' into a 65-page economics paper in about six hours, with a mathematical model, county-level data analysis, references and a replication package.", "speaker": "Jason Furman", "type": "data_point", "entities": ["Paperwright", "Environmental Protection Agency", "Energy Information Administration"], "conviction": "high", "so_what": "Agentic pipelines now produce thesis-grade research for hours of compute and little human input.", "quote": null, "locator": "Don't Underestimate", "quote_verified": false}, {"claim": "He rates the paper not publishable even in a mid-level journal, but would expect a Summa-range grade as a Harvard senior thesis.", "speaker": "Jason Furman", "type": "data_point", "entities": ["Harvard", "Paperwright"], "conviction": "medium", "so_what": "Calibrates quality: strong undergraduate-level, not frontier research.", "quote": null, "locator": "Don't Underestimate", "quote_verified": false}, {"claim": "His Blogwright experiment produces think-tank-style blogs he judges to be among the better versions of the genre, and he expects a simple chatbot prompt to beat his multi-step architecture within a year or two.", "speaker": "Jason Furman", "type": "prediction", "entities": ["Blogwright"], "conviction": "medium", "so_what": "Scaffolding advantages erode fast, so value shifts to the base models.", "quote": null, "locator": "Don't Underestimate", "quote_verified": false}, {"claim": "Almost every Econvitals email is AI-written and sent without his review, and he finds them timely, reasonably comprehensive and generally accurate.", "speaker": "Jason Furman", "type": "anecdote", "entities": ["Econvitals"], "conviction": "medium", "so_what": "Unsupervised AI content production is already workable in economic commentary.", "quote": null, "locator": "Don't Underestimate", "quote_verified": false}, {"claim": "He prefers AI-generated blog posts to human-written ones for getting up to speed, because human pieces may be out of date or contain inaccurate numbers, and AI used properly can make fewer mistakes than people.", "speaker": "Jason Furman", "type": "thesis", "entities": ["AI"], "conviction": "medium", "so_what": "Information-product demand may shift toward AI-generated explainers.", "quote": null, "locator": "Don't Underestimate", "quote_verified": false}, {"claim": "Complaints about hallucinations and Wikipedia repackaging describe weaker models from a year or two ago and are barely relevant to agentic AI today.", "speaker": "Jason Furman", "type": "contrarian", "entities": ["agentic AI"], "conviction": "high", "so_what": "Skeptics are anchoring on stale capabilities.", "quote": null, "locator": "Don't Underestimate", "quote_verified": false}, {"claim": "Furman still expects his own posts to be more interesting than AI output, and says the human-written pieces his Morning Note links to also beat anything AI writes.", "speaker": "Jason Furman", "type": "thesis", "entities": ["Econvitals"], "conviction": "medium", "so_what": "Humans keep an edge in original, interesting writing for now.", "quote": null, "locator": "Don't Underestimate", "quote_verified": false}, {"claim": "Both over-reliance (slop nobody understands) and under-reliance (more mistakes, less ambition) are errors, and he sees more under-users among economists and think tankers.", "speaker": "Jason Furman", "type": "thesis", "entities": ["economists", "think tankers"], "conviction": "medium", "so_what": "Adoption gaps in professional services may still be large.", "quote": null, "locator": "Don't Underestimate", "quote_verified": false}]}, {"theme": "Elasticity of demand and Jevons paradox", "insights": [{"claim": "Whether technology cuts or raises labor demand depends on the elasticity of demand for output: farming employment shrank as food demand stayed flat, while accounting hiring grew as business demand for accounting services soared, though that has fallen off lately.", "speaker": "Jason Furman", "type": "causal", "entities": ["Jevons paradox", "farmers", "accountants"], "conviction": "high", "so_what": "Sector outcomes hinge on demand elasticity, so favor sectors with elastic demand for AI-cheapened output.", "quote": null, "locator": "AI Can Also Enable Us", "quote_verified": false}, {"claim": "For CEA, demand elasticity is doubtful because its output was already free and its clients (NEC, Congress, media) could do much of the work themselves, so demand could fall rather than rise.", "speaker": "Jason Furman", "type": "causal", "entities": ["CEA", "NEC"], "conviction": "medium", "so_what": "Captive or low-elasticity internal-service functions are most at risk of shrinking.", "quote": null, "locator": "AI Can Also Enable Us", "quote_verified": false}, {"claim": "Humans have consistently underestimated demand for improved goods over time, since people can picture living standards twice as good but not ten or a hundred times as good, so Furman may be underestimating how many people AI-enabled analysis will need.", "speaker": "Jason Furman", "type": "contrarian", "entities": ["living standards"], "conviction": "low", "so_what": "Bullish counterweight: unmet demand could absorb displaced labor.", "quote": null, "locator": "AI Can Also Enable Us", "quote_verified": false}, {"claim": "Furman has talked to dozens of Harvard and other colleagues and found none who cites Jevons paradox in hiring research assistants; most think they need the same number, fewer or none, and he himself no longer has a full-time RA.", "speaker": "Jason Furman", "type": "anecdote", "entities": ["Harvard", "research assistants", "Claude Code"], "conviction": "medium", "so_what": "Anecdotal evidence of falling demand for junior research labor.", "quote": null, "locator": "AI Can Also Enable Us", "quote_verified": false}, {"claim": "Hosseini Maasoum and Lichtinger found junior employment down about 9 percent at AI-adopting firms, while the Yale Budget Lab team under Martha Gimbel sees no occupational mix shift clearly lining up with AI.", "speaker": "Jason Furman", "type": "data_point", "entities": ["Seyed Mahdi Hosseini Maasoum", "Guy Lichtinger", "Martha Gimbel", "The Budget Lab"], "conviction": "medium", "so_what": "Evidence on AI job displacement is still conflicting and early.", "quote": null, "locator": "AI Can Also Enable Us", "quote_verified": false}, {"claim": "Furman would not be surprised if the optimal CEA were about half its current size, with more senior staff chosen for interpersonal skills and ability to manage AI agents, and expects the optimal number to be more likely to fall than rise.", "speaker": "Jason Furman", "type": "prediction", "entities": ["CEA"], "conviction": "medium", "so_what": "Hiring will tilt toward senior, AI-managing generalists with fewer entry roles.", "quote": null, "locator": "AI Can Also Enable Us", "quote_verified": false}, {"claim": "Statistical agencies are vastly underresourced, and Econvitals depends on the thousands of people who collect and analyze data there, so efficiency drives should not always mean cutting staff.", "speaker": "Jason Furman", "type": "thesis", "entities": ["statistical agencies"], "conviction": "medium", "so_what": "Data-producing public functions remain a human-resource bottleneck for the AI economy.", "quote": null, "locator": "AI Can Also Enable Us", "quote_verified": false}]}, {"theme": "The junior talent pipeline problem", "insights": [{"claim": "Furman says CEA's training role has had real though not purely causal impact, citing alumni who became Nobel and John Bates Clark winners, a Treasury Secretary and a CBO Director, much of which is selection.", "speaker": "Jason Furman", "type": "data_point", "entities": ["CEA", "CBO"], "conviction": "medium", "so_what": "Apprenticeship pipelines have value that is hard to measure.", "quote": null, "locator": "The Difficult Question", "quote_verified": false}, {"claim": "The paper 'Pyramids, Diamonds, and Oscillations' by Guido Friebel and coauthors models AI making firms freeze junior hiring in the short run and possibly shifting permanently from a pyramid of many juniors to a diamond with a bulge of experienced mid-level people.", "speaker": "Jason Furman", "type": "framework", "entities": ["Guido Friebel", "Pyramids, Diamonds, and Oscillations"], "conviction": "medium", "so_what": "Org charts may reshape to diamonds, hurting entry-level labor markets first.", "quote": null, "locator": "The Difficult Question", "quote_verified": false}, {"claim": "Taxpayer-funded jobs where the bulk of work could be done by AI cannot be justified just for training, and 'training' by botsitting is questionable; research grantors also seek maximum output rather than pipeline-building.", "speaker": "Jason Furman", "type": "thesis", "entities": ["taxpayers", "research grants"], "conviction": "medium", "so_what": "Public and grant funding unlikely to subsidize junior roles made redundant by AI.", "quote": null, "locator": "The Difficult Question", "quote_verified": false}, {"claim": "Under Becker's model workers pay for general training through lower wages, which works if an associate produces $300,000 but earns $200,000, but breaks down if the associate produces about zero, since nobody would pay the firm $100,000 a year to be trained.", "speaker": "Jason Furman", "type": "causal", "entities": ["Gary Becker", "investment banking associate"], "conviction": "high", "so_what": "Economics of apprenticeship in finance and professional services is under threat, with training to be paid explicitly.", "quote": null, "locator": "The Difficult Question", "quote_verified": false}, {"claim": "Furman expects the pipeline to need explicit funding through fellowships and training grants rather than relying on organizations to keep hiring people they no longer need, and says surplus government funds should go where skills are needed, such as public health, AI safety or national security.", "speaker": "Jason Furman", "type": "prediction", "entities": ["fellowships", "training grants"], "conviction": "medium", "so_what": "Policy direction: explicit training subsidies instead of implicit make-work.", "quote": null, "locator": "The Difficult Question", "quote_verified": false}]}, {"theme": "Furman's ambivalence and advice", "insights": [{"claim": "Furman, formerly an AI accelerationist who said the biggest worry was not having enough AI, would now be seriously tempted to press a button freezing AI for decades, though he would not actually press it.", "speaker": "Jason Furman", "type": "anecdote", "entities": ["Jason Furman"], "conviction": "medium", "so_what": "Notable shift in tone among mainstream economists on AI.", "quote": "\"The biggest worry I have about AI is that we will not have enough of it.\"", "locator": "I Don't Know the Right Ratio", "quote_verified": true}, {"claim": "He argues AI's downside falls mostly on the high-income or high-meaning knowledge workers, while poorer people, the sick and those hit by climate change have more upside than downside from innovation and productivity growth.", "speaker": "Jason Furman", "type": "contrarian", "entities": ["knowledge workers", "climate change"], "conviction": "medium", "so_what": "Global welfare framing favors continued AI progress despite concentrated losses in white-collar work.", "quote": null, "locator": "I Don't Know the Right Ratio", "quote_verified": false}, {"claim": "His advice is to use AI better while focusing on uniquely human value added, such as management and interpersonal skills, and continuing to challenge oneself so skills are not offloaded to AI, though it may not suffice.", "speaker": "Jason Furman", "type": "framework", "entities": ["AI"], "conviction": "medium", "so_what": "Skill premium shifts toward AI management and interpersonal coordination.", "quote": null, "locator": "I Don't Know the Right Ratio", "quote_verified": false}, {"claim": "Furman defers his broader public policy response to AI labor disruption to a later post.", "speaker": "Jason Furman", "type": "anecdote", "entities": ["Jason Furman"], "conviction": "low", "so_what": "Policy prescriptions are still to come.", "quote": null, "locator": "I Don't Know the Right Ratio", "quote_verified": false}]}], "insight_total": 30, "top_entities": ["Jason Furman", "Council of Economic Advisers", "National Economic Council", "Neil Irwin", "Paperwright", "Jevons paradox", "Gary Becker", "The Budget Lab", "Econvitals", "Guido Friebel"], "source_meta": {"author": "Jason Furman", "word_count": 4419, "paywalled": false}}, {"record_id": "ecd5382d4d0a3b9d", "source_type": "concepts", "source_name": "Peterson Institute (PIIE)", "source_url": "https://www.piie.com/blogs/realtime-economics/2026/santas-sleigh-will-be-weighed-down-tariffs", "title": "Santa's sleigh will be weighed down by tariffs", "published_date": "2026-11-02", "language": "en", "processed_at": "2026-11-03T11:11:18Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Geopolitics", "Society"], "gist": "Tariffs on sports gear, art supplies, instruments and consoles rose from ~5% to 20-28% effective rates in 2025 and remain 14-17% after the Supreme Court ruling. Imports fell 17-33%, prices keep rising faster than core goods, and no manufacturing revival has materialized.", "themes": [{"theme": "Tariff rate surge on hobby goods", "insights": [{"claim": "Effective US tariff rates on sports equipment, pencils/crayons and musical instruments were 5.6%, 5.0% and 5.7% in the 2024 holiday season (Sep-Dec).", "speaker": "Cullen S. Hendrix", "type": "data_point", "entities": ["sports equipment", "musical instruments"], "conviction": "high", "so_what": "Baseline shows scale of 2025 tariff shock on consumer discretionary imports.", "quote": null, "locator": null, "quote_verified": false}, {"claim": "By the 2025 holiday season effective tariff rates jumped to 27.7% on sports equipment, 26.6% on pencils and crayons and 21.2% on instruments, driven by the escalated trade war with China where most are made.", "speaker": "Cullen S. Hendrix", "type": "data_point", "entities": ["China", "Trump"], "conviction": "high", "so_what": "Heavy China exposure in low-end consumer goods drove the peak.", "quote": null, "locator": null, "quote_verified": false}, {"claim": "After the Supreme Court struck down some tariffs, effective rates through August 2026 eased only to 17.2% (sports equipment), 16.1% (pencils/crayons) and 14.1% (instruments), still roughly 3x the 2024 levels.", "speaker": "Cullen S. Hendrix", "type": "data_point", "entities": ["Supreme Court"], "conviction": "high", "so_what": "Tariff relief is partial; a structurally higher tariff floor persists.", "quote": null, "locator": null, "quote_verified": false}]}, {"theme": "Demand destruction rather than import substitution", "insights": [{"claim": "Holiday-season imports in 2025 fell 24% for musical instruments and 17% each for sports equipment and pencils/crayons versus 2024.", "speaker": "Cullen S. Hendrix", "type": "data_point", "entities": ["musical instruments"], "conviction": "high", "so_what": "Volume contraction hits importers and retailers of discretionary goods.", "quote": null, "locator": null, "quote_verified": false}, {"claim": "Higher prices did not shift buyers to domestic producers because entry-level versions of these products largely are not made in the US; the tariffs instead destroyed demand.", "speaker": "Cullen S. Hendrix", "type": "causal", "entities": ["US consumers"], "conviction": "high", "so_what": "Tariffs on goods with no domestic substitute act as pure consumption taxes.", "quote": null, "locator": null, "quote_verified": false}, {"claim": "Trump's tariffs have not produced a US manufacturing boom in either employment or construction.", "speaker": "Cullen S. Hendrix", "type": "thesis", "entities": ["Trump"], "conviction": "medium", "so_what": "Undercuts the reshoring rationale for the tariffs.", "quote": null, "locator": null, "quote_verified": false}]}, {"theme": "Sticky prices despite tariff relief", "insights": [{"claim": "Prices for all three goods classes rose in 2026 relative to 2025 and have outpaced core goods prices since 2024, even as tariffs eased.", "speaker": "Cullen S. Hendrix", "type": "data_point", "entities": ["BLS"], "conviction": "high", "so_what": "Retail margins and prices ratchet up; tariff relief is not a disinflation channel.", "quote": null, "locator": null, "quote_verified": false}, {"claim": "Three reasons prices stay high: importers sold pre-tariff stock in 2025 so 2026 prices reflect tariffs that held until the February 2026 Supreme Court decision; retail prices rise fast and fall slowly; and underlying inflation remains elevated.", "speaker": "Cullen S. Hendrix", "type": "causal", "entities": ["importers", "retailers"], "conviction": "medium", "so_what": "Pass-through is asymmetric, so tariff cuts help margins before consumers.", "quote": null, "locator": null, "quote_verified": false}, {"claim": "Core consumer prices are up 5.7% over two years, stoked by spillovers from the war with Iran and large fiscal deficits, further eroding purchasing power.", "speaker": "Cullen S. Hendrix", "type": "data_point", "entities": ["Iran"], "conviction": "medium", "so_what": "Elevated core inflation forces households to cut wants versus needs.", "quote": null, "locator": null, "quote_verified": false}, {"claim": "Musical instrument prices rose 9.1% over the period versus 2.3% for core goods, so general inflation cannot explain the increase; instruments saw the steepest price rise and largest import drop.", "speaker": "Cullen S. Hendrix", "type": "data_point", "entities": ["musical instruments"], "conviction": "high", "so_what": "Tariff-exposed categories show much larger price gains than the core goods index.", "quote": null, "locator": null, "quote_verified": false}, {"claim": "Importers of record are receiving tariff refunds, but little is likely to be passed to consumers who ultimately paid.", "speaker": "Cullen S. Hendrix", "type": "prediction", "entities": ["importers of record"], "conviction": "medium", "so_what": "Refund windfalls may accrue to importers and retailers.", "quote": null, "locator": null, "quote_verified": false}]}, {"theme": "Video game consoles", "insights": [{"claim": "Video game console effective tariff rates went from zero in the 2024 holiday season to 19.7% in 2025, with calculated duties rising from nothing to $508 million.", "speaker": "Cullen S. Hendrix", "type": "data_point", "entities": ["video game consoles"], "conviction": "high", "so_what": "Consoles are a meaningful duty base.", "quote": null, "locator": null, "quote_verified": false}, {"claim": "Console imports spiked in early 2025 on front-running and the Nintendo Switch 2 launch, then fell 33% over the 2025 holiday season; through August 2026 they were 10% below 2024 levels.", "speaker": "Cullen S. Hendrix", "type": "data_point", "entities": ["Nintendo", "Switch 2"], " // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
