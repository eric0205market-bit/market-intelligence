@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;

}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);

.summary p:last-child { margin-bottom: 0; }

.section { background: var(--surface); border: 1px solid var(--border);

.topic { border-bottom: 1px solid var(--border-light); }

.topic-name { flex: 1; }

.item-card { background: var(--surface); border: 1px solid var(--border);

.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>

const REPORT_DATA = {"report_type": "TWITTER BANK RESEARCH", "freshness_gate": "OK    data/twitter/latest/tweets_bank_research.json: collected_at 2026-11-28T06:22:53+00:00 (0.4h old), non-empty | FRESHNESS GATE PASSED.", "collected_at": "2026-11-28T06:22:53Z", "date": "2026-11-28 06:22 UTC · collected", "window_days": 4, "input_stats": {"total_tweets": 120, "considered": 120, "kept": 20, "dropped": 100, "deduped": 0}, "summary": "Recurring themes: AI capex and hyperscaler cash flow (UBS, Deutsche), global equity valuations and the US premium vs Europe/EM/Korea (Goldman, Barclays), semis/Nasdaq-100 volatility vs the S&P 500 (Goldman via Neil Sethi), macro data — Q4 GDP tracking and DM core inflation (Goldman), and the ECB presidency change (SocGen/BofA tags). Also: 2027 earnings outlook (Barclays), stablecoin supply (Apollo), household wealth by generation (Yardeni).\nPer-bank counts: Goldman 9, UBS 4, Barclays 2, BofA 2, Apollo/Slok 1, Deutsche 1, SocGen 1, Yardeni 1. 20 unique tweets kept across 8 banks; no duplicates collapsed.", "by_bank_counts": {"Goldman": 9, "UBS": 4, "Barclays": 2, "BofA": 2, "Apollo/Slok": 1, "Deutsche": 1, "SocGen": 1, "Yardeni": 1}, "banks": [{"bank": "Goldman", "theme": "US/Europe/EM valuations, KOSPI P/E & drawdown, Q4 GDP tracking, DM core inflation, dividend payout low, semis vs NDX swings", "items": [{"author": "MikeZaccardi", "text": "GS: Lowering Q4 GDP Tracking to +2.2%\n\nGoods Trade Deficit Widens Much More Than Expected in October https://t.co/4CUHAywHSV", "tweet_url": "https://x.com/MikeZaccardi/status/2126336754936390106", "images": ["https://pbs.twimg.com/media/HYJEAuEXkAAjmdF.png"], "created_at": "2026-11-27T15:26:02.000Z", "relayers": [], "data_points": ["2026-11-27 15:26 UTC"]}, {"author": "MikeZaccardi", "text": "GS: USA trades 17.4x P/E... several turns above European bourses \n\n$EEM 8.0x https://t.co/Qi2Uk4zjmU", "tweet_url": "https://x.com/MikeZaccardi/status/2126331966295273615", "images": ["https://pbs.twimg.com/med ctober 2000, when its record low and record high came two days apart, seven months after the dot-com peak. Whipsaws this big tend to show up when a market is still trying to find its footing, not when it's healthy.", "tweet_url": "https://x.com/neilsethinew/status/2126292459970085169", "images": ["https://pbs.twimg.com/media/HYGQA1XXsAEeB-G.jpg"], "created_at": "2026-11-27T12:30:01.000Z", "relayers": [], "data_points": ["2026-11-27 12:30 UTC"]}, {"author": "MikeZaccardi", "text": "GS: On a Monthly Annualized Basis, Traditional Exclusion-Based Core Inflation Slowed or Moved Sideways Across DMs https://t.co/nRta4EPNwy", "tweet_url": "https://x.com/MikeZaccardi/status/2126289076479246665", "images": ["https://pbs.twimg.com/media/HYIYpdTWcAEupCe.png"], "created_at": "2026-11-27T12:16:35.000Z", "relayers": [], "data_points": ["2026-11-27 12:16 UTC"]}, {"author": "neilsethinew", "text": "The @DailyChartbook nightly email Wednesday included an interesting post on the Nasdaq-100's underperformance vs the S&P 500. \n\nThe former's 6-month return fell 8.66 points behind the S&P 500's on November 24, and the gap widened to 9.25 points at Wednesday's close. Their table shows the Nasdaq-100 itself has tended to do well after these extremes, averaging +30.2% over the next 12 months.\n\nI was curious whether that was equally bullish for both indices or if it means the gap closes.  Using their same rule since 1986:\n\n▪️ The Nasdaq-100 beat the S&P 500 over the next 6 and 12 months after 11 of the 13 completed signals.\n\n▪️ The median 12-month gap was +10 points in the Nasdaq's favor, about double the +5.1 points you'd get on any random day since 1986.\n\n▪️ The catch-up wasn't immediate. The median edge after one month was +0.5 points, no better than normal; most of it came in months two through six.\n\n▪️ In those 11 wins, most of the damage was already done by the signal date. The Nasdaq-100 never fell more than about 5% further behind the S&P before turning.\n\nThe two exceptions are important though. After August 2000, the Nasdaq-100 trailed the S&P by another 43 points over the next year as the dot-com bust played out. After March 2022, it lagged by 2 points, and the gap first widened by nearly 11% as the Fed began hiking. In both cases the tech slide turned into a full tech bear market.\n\nToday has whiffs of both. Elsewhere in the same email, there were notes that chip shares have fallen faster than in 2000 and that the link between AI stocks and broader risk appetite is near a six-year high (Goldman Sachs).\n\nHistory favors tech closing the gap from here, but it also says the line to watch is whether the Nasdaq-100 falls more than about 6% further behind the S&P from the November 24 signal.  In that case, it's tracking 2000 and 2022 rather than the usual rebound. So far, it has slipped about 0.4% further.", "tweet_url": "https://x.com/neilsethinew/status/2126277358269468883", "images": ["https://pbs.twimg.com/media/HYDkjlqWYAAS13S.jpg"], "created_at": "2026-11-27T11:30:01.000Z", "relayers": [], "data_points": ["2026-11-27 11:30 UTC"]}, {"author": "MikeZaccardi", "text": "The amount of S&P 500 earnings paid out as dividends is at an all-time (100+ year) low.\n\nWould like to see this GS chart refreshed h/t @ISABELNET_SA https://t.co/fHSNReORHl", "tweet_url": "https://x.com/MikeZaccardi/status/2126088864729035247", "images": ["https://pbs.twimg.com/media/HYFijkZW0AAtBQP.png"], "created_at": "2026-11-26T23:01:00.000Z", "relayers": [], "data_points": ["2026-11-26 23:01 UTC"]}]}, {"bank": "UBS", "theme": "AI capex & hyperscaler FCF, inference costs vs token usage, grid investment", "items": [{"author": "MikeZaccardi", "text": "While AI capex growth is uncertain, grid investment seems to be on a straight-line path higher $GRID UBS https://t.co/2E8MMljkET", "tweet_url": "https://x.com/MikeZaccardi/status/2126330455662141938", "images": ["https://pbs.twimg.com/media/HYI-SDHX0AA45p7.png"], "created_at": "2026-11-27T15:01:00.000Z", "relayers": [], "data_points": ["2026-11-27 15:01 UTC"]}, {"author": "MikeZaccardi", "text": "UBS: Jevon's Paradox playing out... inference costs dropping with token usage climbing https://t.co/TdD2yqh6B7", "tweet_url": "https://x.com/MikeZaccardi/status/2126304031643476061", "images": ["https://pbs.twimg.com/media/HYImP-KWoAE-5uE.png"], "created_at": "2026-11-27T13:16:00.000Z", "relayers": [], "data_points": ["2026-11-27 13:16 UTC"]}, {"author": "MikeZaccardi", "text": "Chart of the year candidate... from UBS... AI hyperscaler FCF plunges negative... Semis FCF surges to an unsustainable level https://t.co/gKBcy5yMgr", "tweet_url": "https://x.com/MikeZaccardi/status/2126300256849539155", "images": ["https://pbs.twimg.com/media/HYIi0PqXEAALKgD.png"], "created_at": "2026-11-27T13:01:00.000Z", "relayers": [], "data_points": ["2026-11-27 13:01 UTC"]}, {"author": "MikeZaccardi", "text": "UBS: AI capex continues to outperform\n\nBut spending growth expected to peak in 2027 https://t.co/vBOJDbaPC7", "tweet_url": "https://x.com/MikeZaccardi/status/2126296481674011104", "images": ["https://pbs.twimg.com/media/HYIfYgIWoAAy1E2.png"], "created_at": "2026-11-27T12:46:00.000Z", "relayers": [], "data_points": ["2026-11-27 12:46 UTC"]}]}, {"bank": "Barclays", "theme": "2027 S&P 500 earnings growth forecast and regional equity views", "items": [{"author": "MikeZaccardi", "text": "S&P 500 earnings growth forecast to ease to 16.1% in 2027 from 32.7%, per Barclays \n$RSP +10.1% in the out year\nSmall caps a strong +15.7% https://t.co/JuKdYresZt", "tweet_url": "https://x.com/MikeZaccardi/status/2126311581289951485", "images": ["https://pbs.twimg.com/media/HYItHZ3WQAA3lN9.png"], "created_at": "2026-11-27T13:46:00.000Z", "relayers": [], "data_points": ["2026-11-27 13:46 UTC"]}, {"author": "MikeZaccardi", "text": "Barclays has a positive view of US equities for 2027... cautious EU & Japan https://t.co/MoyJvta9QG", "tweet_url": "https://x.com/MikeZaccardi/status/2126307806550651092", "images": ["htt // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
