<title>Twitter Data Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DATA POINT TAGS */
.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>
</head>

iption": "S&P 500 trading >2 std devs below its 50-DMA (first since April) while only ~17% of stocks are oversold and ~47% overbought (highest since early Feb).", "tweet_url": "https://x.com/KobeissiLetter/status/2118048633438319039", "images": ["https://pbs.twimg.com/media/HWS8zT6XsAAUvIN.jpg"], "data_points": ["SPX >2σ below 50-DMA", "17% oversold", "47% overbought"], "created_at": "2026-11-04T18:32:00.000Z", "text": "This is highly unusual:\n\nThe S&P 500 is trading more than 2 standard deviations below its 50-day moving average, the first such occurrence since April.\n\nSuch a reading puts the S&P 500 in historically extreme oversold territory.\n\nAt the same time, only ~17% of the index’s stocks are now oversold, near its lowest proportion since July.\n\nMeanwhile, ~47% of stocks are now overbought, the highest proportion since early February. \n\nThis figure has more than doubled since the start of October as many stocks have rallied beneath the surface.\n\nThe broader market looks far healthier than the S&P 500's recent performance suggests."}, {"author": "LizAnnSonders", "description": "Schwab (Liz Ann Sonders) report: market calm YTD with double-digit gain but rotations/churn under the surface increasingly intense.", "tweet_url": "https://x.com/LizAnnSonders/status/2118036269154582860", "images": [], "data_points": [], "created_at": "2026-11-04T17:42:52.000Z", "text": "This is a valuable report … if we do say so ourselves!"}]}, {"topic": "Volatility & Options", "items": [{"author": "spotgamma", "description": "Of 31 non-earnings names, 28 saw 30-day ATM IV fall vs Tuesday: QQQ -4.5 vol pts, IWM -3.0, SPX -2.7. IV up in MRVL, CRWV, BABA (down 9-11%).", "tweet_url": "https://x.com/spotgamma/status/2118077662912823415", "images": ["https://pbs.twimg.com/media/HWTsLMwW0AAYKEF.jpg"], "data_points": ["QQQ IV -4.5pts", "IWM -3.0", "SPX -2.7", "28/31 names IV lower"], "created_at": "2026-11-04T20:27:21.000Z", "text": "Of 31 non-earnings names 28 saw 30-day ATM IV fall vs Tuesday afternoon. $QQQ -4.5 vol pts, $IWM -3.0, $SPX -2.7 (2 PM ET).\n\nIV is up in the worst: $MRVL, $CRWV, $BABA. MRVL and CRWV are down 9-11% vs Tuesday's close. https://t.co/ZjF2J4dV6S"}, {"author": "spotgamma", "description": "SPX closed 7,569 Tuesday; futures hit a 6-week low overnight; opened 7,636 and the vol crush lifted it to 7,700 by 2:30 PM (+1.75%). Risk pivot 7,600.", "tweet_url": "https://x.com/spotgamma/status/2118066449868533918", "images": ["https://pbs.twimg.com/media/HWTh6yeXoAEp0CS.png"], "data_points": ["SPX open 7,636", "High 7,700 (+1.75%)", "Risk pivot 7,600"], "created_at": "2026-11-04T19:42:48.000Z", "text": "Yesterday: $SPX snapped a three-day losing streak, closing at 7,569.\n\nOvernight: S&P futures plunged to a six-week low on the election results.\n\nOur 7 AM read: with $SPX starting above our 7,600 Risk Pivot, falling vols could fuel a rally, with 7,700 as the upside level.\n\nSPX opened at 7,636, and the vol crush lifted the market 7,700 by 2:30 PM (+1.75%)\n\nFrom this morning’s Founder’s Note: “There quite frankly aren’t any great explanations for the price action - just a bunch of floppy narratives.”\n\nWe seek truth in vols.\n\nWere you prepared this morning? Learn the hidden mechanics behind the markets, and how they can give you an edge in your trading. Free half-hour session with Brent Kochuba: https://t.co/zpdtPwttJO"}, {"author": "spotgamma", "description": "Day-over-day change in QQQ fixed-strike vol showing a broad vol crush.", "tweet_url": "https://x.com/spotgamma/status/2118048698894577798", "images": ["https://pbs.twimg.com/media/HWTR52UWQAA1_i4.jpg"], "data_points": [], "created_at": "2026-11-04T18:32:15.000Z", "text": "\"Volatility is an asset class\" and the short vol position won today. This is the day-over-day change in $QQQ fixed strike vol - an absolute crushing. https://t.co/CN6GJpqqrg"}]}, {"topic": "Fund Flows & Positioning", "items": [{"author": "RyanDetrick", "description": "Institutional clients' October net selling (normalized by market cap) was the largest for any October in nine years.", "tweet_url": "https://x.com/RyanDetrick/status/2118181885037920354", "images": [], "data_points": ["Largest Oct inst. outflows in 9 yrs"], "created_at": "2026-11-05T03:21:29.000Z", "text": "Institutional clients sold A LOT in October."}, {"author": "KobeissiLetter", "description": "Combined buybacks by GOOGL, AMZN, MSFT, META, ORCL fell to $4.4B in Q3 2026, lowest since Q3 2017, down 90% from the $45.9B Q4 2021 peak.", "tweet_url": "https://x.com/KobeissiLetter/status/2118069349374181532", "images": ["https://pbs.twimg.com/media/HWNLZckXcAAECGq.jpg"], "data_points": ["Q3 buybacks $4.4B", "-90% vs $45.9B peak", "Q1 2026 $33.0B"], "created_at": "2026-11-04T19:54:19.000Z", "text": "The era of massive Big Tech stock buybacks is over.\n\nCombined buybacks by Alphabet, $GOOGL, Amazon, $AMZN, Microsoft, $MSFT, Meta, $META, and Oracle, $ORCL, fell to $4.4 billion in Q3 2026, the lowest since Q3 2017.\n\nShare repurchases have dropped -90% since the ~$45.9 billion peak recorded in Q4 2021.\n\nThis also marks the 3rd consecutive quarter with buybacks below $5.0 billion.\n\nThis comes as Alphabet, Amazon, Meta, and Oracle have not purchased their own stock in 2026.\n\nBy comparison, combined buybacks by these Big Tech companies stood at +$33.0 billion in Q1 2026.\n\nAI spending is coming at the expense of Big Tech buybacks."}, {"author": "EricBalchunas", "description": "ETF inflows look about the same in S&P 500 up months and down months (the 'Vanguard Put').", "tweet_url": "https://x.com/EricBalchunas/status/2118042377562554538", "images": ["https://pbs.twimg.com/media/HWTMHVuWQAABeac.png"], "data_points": [], "created_at": "2026-11-04T18:07:08.000Z", "text": "COMFORTABLY NUMB: ETF inflows are indistinguishable whether it is an S&P 500 up month or down month. This is basically another way of showing the Vanguard Put which is that most investors nowadays are happily 'married' to their low cost beta and to US stocks and see no reason to leave (or not continue to DCA into mkt). via @psarofagis"}]}, {"topic": "Economic Indicators, Rates & Central Banks", "items": [{"author": "PeterBerezinBCA", "description": "Chart: high-income workers leaving Europe; as top earners move more easily, high taxes on them bring in less.", "tweet_url": "https://x.com/PeterBerezinBCA/status/2118188018892689843", "images": ["https://pbs.twimg.com/media/HWVQxs_WgAA7CLV.jpg"], "data_points": [], "created_at": "2026-11-05T03:45:52.000Z", "text": "High-income workers are fleeing Europe. \n\nEconomic theory tells us that the more\nmobile a factor of production becomes,\nthe lower its optimal tax rate. This is why taxes on capital, which is relatively mobile, tend to be lower than taxes on labor, which historically has been less mobile.\n\nHowever, as the chart below shows, as elite human capital has become more footloose, high taxes have become increasingly counterproductive.\n\nThis is a huge existential problem for European welfare states, which have traditionally relied on heavily taxing their most productive workers."}, {"author": "charliebilello", "description": "Global inflation-rate table: inflation rising across major economies; Fed, ECB, BOJ, BOE seen behind the curve.", "tweet_url": "https://x.com/charliebilello/status/2118163522731298958", "images": ["https://pbs.twimg.com/media/HWU5_gnXYAAksVa.png"], "data_points": [], "created_at": "2026-11-05T02:08:32.000Z", "text": "Global Inflation Rates are rising and the Fed, ECB, BOJ, and BOE remain behind the curve.\n\nMore rate hikes are coming from all of these central banks before year end. https://t.co/yQfx7N7WOA"}, {"author": "KobeissiLetter", "description": "US CPI +31.3% since Apr 2020 vs average hourly earnings +25.9%; CPI above 2% for 67 straight months (3rd-longest streak in 100 yrs).", "tweet_url": "https://x.com/KobeissiLetter/status/2118147600847118353", "images": ["https://pbs.twimg.com/media/HWUsBHbXUAACSdn.jpg"], "data_points": ["CPI +31.3% since 4/2020", "AHE +25.9%", "67 months above 2%"], "created_at": "2026-11-05T01:05:15.000Z", "text": "Inflation has more than wiped out all US consumer wage gains since the 2020 Pandemic:\n\nUS consumer prices have risen +31.3% since April 2020, to an all-time high in September.\n\nOver the same period, average hourly earnings have increased just +25.9%.\n\nThis comes as CPI inflation has now been above the Fed’s 2% target for 67 consecutive months, the 3rd-longest streak over the last 100 years.\n\nThe only 2 longer streaks lasted 242 months, ending in 1986, and 128 months, ending in 1997.\n\nInflation continues to erode the spending power of Americans."}, {"author": "Jamie1Coutts", "description": "The Fed bought ~$215B of T-bills from December to keep reserves ample, none since mid-August; repo funding is +7bp above IORB.", "tweet_url": "https://x.com/Jamie1Coutts/status/2118147252804063373", "images": ["https://pbs.twimg.com/media/HWUrhSTaIAAvauR.jpg"], "data_points": ["Fed T-bill buys ~$215B", "Repo +7bp over IORB"], "created_at": "2026-11-05T01:03:52.000Z", "text": "The Fed bought ~$215bn of T-bills from December to keep reserves ample. Since mid-August, zero.\n\nRepo funding is creeping back above interest on reserves (+7bp).  \n\nGame of chicken. Game on. https://t.co/NyQuET5vj4"}, {"author": "Jamie1Coutts", "description": "Quoted data: Australia M3 money supply rose from ~$309B (1995) to ~$3.5T (Sep 2026), +1,000%+.", "tweet_url": "https://x.com/Jamie1Coutts/status/2118146905343676913", "images": [], "data_points": ["AU M3 $309B → $3.5T"], "created_at": "2026-11-05T01:02:30.000Z", "text": "If the increase in money supply was matched by an increase in productive capacity, real incomes would be higher, and there wouldn't be a cost-of-living crisis. An increase in money supply for unproductive uses, namely financing a massive property bubble, plus deficit spending by governments- the one entity you do not want to give free rein to- results in terminal decline, removal of rights, a march towards authoritarianism, and economic collapse."}, {"author": "KobeissiLetter", "description": "South Korea exports +94% YoY in October to $115B (2nd highest ever, strongest YoY since Jan 1974); semis +259% to a record $56B; computers +497%.", "tweet_url": "https://x.com/KobeissiLetter/status/2118113888486986103", "images": ["https://pbs.twimg.com/media/HWSrNi5WMAAInDV.jpg"], "data_points": ["Exports +94% YoY", "$115B", "Semis +259% / $56B", "YTD $930B record"], "created_at": "2026-11-04T22:51:18.000Z", "text": "BREAKING: South Korea's exports surged +94% YoY in October, to $115 billion, the 2nd-highest reading on record.\n\nThis also marks the strongest YoY growth since January 1974.\n\nSouth Korea’s exports have now recorded 5 consecutive months with YoY growth of at least +60%.\n\nIn the first 10 months of 2026, exports totaled a record $930 billion.\n\nSemiconductors led last month's surge, rising +259% YoY, to a record $56 billion.\n\nAt the same time, computer sales spiked +497% amid strong demand for AI servers.\n\nThe AI boom has turned South Korea into an export powerhouse."}, {"author": "bespokeinvest", "description": "US tech imports hit a $1T annualized pace in September; the AI boom is a big reason the trade deficit hasn't narrowed.", "tweet_url": "https://x.com/bespokeinvest/status/2118111788424372290", "images": ["https://pbs.twimg.com/media/HWUKibJXUAAlRVs.png"], "data_points": ["Tech imports $1T annualized"], "created_at": "2026-11-04T22:42:57.000Z", "text": "US Tech imports hit a $1 trillion annualized pace in September!  Ironic that the AI Boom is a big reason the trade deficit hasn't narrowed despite tariffs. https://t.co/VLHCNNf9NS\n\nWe've got much more analysis in tonight's Closer, which you can read in full here: https://t.co/rStX01eCYX"}, {"author": "bespokeinvest", "description": "Calendar: Fed speakers Hammack 8:30 AM, Barkin 9:10 AM, Logan 7:00 PM ET; Nat Gas inventories 10:30 AM; VEEV investor day.", "tweet_url": "https://x.com/bespokeinvest/status/2118109912127447276", "images": ["https://pbs.twimg.com/media/HWTefaCXAAAlv91.png"], "data_points": ["Hammack 8:30", "Barkin 9:10", "Logan 19:00 ET"], "created_at": "2026-11-04T22:35:30.000Z", "text": "Fed speakers tomorrow are Hammack at 8:30 AM ET, Barkin at 9:10 AM, and Logan at 7:00 PM. Natural Gas Inventories are due at 10:30 AM, and Veeva Systems $VEEV holds its investor day. https://t.co/nHXKQIvsuI"}]}, {"topic": "Commodities", "items": [{"author": "zerohedge", "description": "Headline: Gold rises 2% as dollar and yields fall on midterm results.", "tweet_url": "https://x.com/zerohedge/status/2118191036912533720", "images": [], "data_points": ["Gold +2%"], "created_at": "2026-11-05T03:57:51.000Z", "text": "*GOLD RISES BY 2% AS DOLLAR AND YIELDS FALL ON MIDTERM RESULTS"}, {"author": "TaviCosta", "description": "Chart posted with a quoted headline that the biggest new copper mine has stumbled again as costs rise.", "tweet_url": "https://x.com/TaviCosta/status/2118145993531335138", "images": ["https://pbs.twimg.com/media/HWUqjjbb0AA5Fyd.jpg"], "data_points": [], "created_at": "2026-11-05T00:58:52.000Z", "text": "This chart just wasn’t even considering this. \n\nInsane. https://t.co/HHjxoVdc9H"}, {"author": "Geo_papic", "description": "GeoMacro Alpha report published the day before recommended shorting Brent and BWET.", "tweet_url": "https://x.com/Geo_papic/status/2118091276650418383", "images": ["https://pbs.twimg.com/media/HWT4th0WEAAiNqq.jpg"], "data_points": [], "created_at": "2026-11-04T21:21:27.000Z", "text": "The GeoMacro Alpha report dropped... yesterday. Just for some shameless back-slapping, the conclusion was to short Brent and BWET."}, {"author": "TaviCosta", "description": "Valuation chart: silver miners at historically cheapest levels.", "tweet_url": "https://x.com/TaviCosta/status/2118047899422687495", "images": ["https://pbs.twimg.com/media/HWTRVvxbgAAyyOc.jpg"], "data_poi ics2024 kinda similar ~30-35% actually, but it was during the pandemic (2Q'20 and 3Q'20) which probably makes SHOP's performance even more impressive\n\n1. yes, it's lot easier to scale a platform biz than a marketplace reliant on scaling the logistics as well. I covered this before (https://t.co/LXItibmTLq), so stopped mentioning it in every quarterly update\n\n2. they're not necessarily direct competitors, but Shopify is enabler of all possible channels. From AMZN's perspective, they obviously have an interest in enabling just their own channel."}, {"author": "borrowed_ideas", "description": "Shopify took 7 years to go from 10% to 30% of Amazon retail GMV; next 20 points projected in ~3 years.", "tweet_url": "https://x.com/borrowed_ideas/status/2118038609886601306", "images": ["https://pbs.twimg.com/media/HWTIARwbgAAz-z-.jpg", "https://pbs.twimg.com/media/HWTIFzJakAAQTiC.jpg"], "data_points": ["SHOP 10%→30% of AMZN GMV in 7y"], "created_at": "2026-11-04T17:52:10.000Z", "text": "it took seven years for $SHOP to go from 10% of $AMZN retail GMV to 30%. The next 20 points will take just three years! \n\nhttps://t.co/gIl1dSSeWI"}]}, {"topic": "AI Infrastructure, Credit & Data Centers", "items": [{"author": "C_Barraud", "description": "SCMP: How a Democratic sweep could slow US AI growth and help China.", "tweet_url": "https://x.com/C_Barraud/status/2118223447381987638", "images": [], "data_points": [], "created_at": "2026-11-05T06:06:39.000Z", "text": "🇺🇸🇨🇳 How Democratic sweep could slow AI growth in US – and help China’s ambitions - SCMP\nhttps://t.co/PdqivQYndC"}, {"author": "C_Barraud", "description": "Bloomberg: Wall Street sees risks to the AI boom after the Democratic sweep.", "tweet_url": "https://x.com/C_Barraud/status/2118219940226289851", "images": ["https://pbs.twimg.com/media/HWVtuDHWUAA7SUf.jpg"], "data_points": [], "created_at": "2026-11-05T05:52:43.000Z", "text": "🇺🇲 #WallStreet Sees Risks to AI Boom After the Democratic Sweep - Bloomberg\nhttps://t.co/ co/7fUZ5gA5LM\n\nDaily updates for pro subs \nhttps://t.co/sT1hNySbWW"}, {"author": "zerohedge", "description": "Comment on ad CPM economics for agentic AI.", "tweet_url": "https://x.com/zerohedge/status/2118184444192526818", "images": [], "data_points": [], "created_at": "2026-11-05T03:31:40.000Z", "text": "Please think of Jevon: one trillion agentic ad impressions per millisecond will more than offset the $0.0001 cpm"}, {"author": "Polymarket", "description": "Polymarket: 56% of voters said AI/data centers were a major factor in their congressional vote; 29% chance any state enacts a data center moratorium by YE.", "tweet_url": "https://x.com/Polymarket/status/2118183924275056690", "images": [], "data_points": ["56% voters: AI major factor", "29% moratorium odds"], "created_at": "2026-11-05T03:29:36.000Z", "text": "JUST IN: 56% of voters say AI &amp; data centers were a major or crucial factor in their midterm vote for Congress.\n\n29% chance any state enacts a data center moratorium by end of year.\n\nhttps://t.co/rNqdiCrkea"}, {"author": "zerohedge", "description": "Chart attached to the quoted Goldman note on hyperscaler lease and purchase commitments.", "tweet_url": "https://x.com/zerohedge/status/2118182329009209748", "images": ["https://pbs.twimg.com/media/HWVLmZCWUAAzud0.jpg"], "data_points": [], "created_at": "2026-11-05T03:23:15.000Z", "text": "https://t.co/P2yON8FGPR"}, {"author": "zerohedge", "description": "Goldman: hyperscalers have $1.7T of lease commitments and $1.9T of unconditional purchase commitments ($685B due by YE2027); quoted: AI off-balance-sheet obligations hit $4.1T, +$1T in 90 days.", "tweet_url": "https://x.com/zerohedge/status/2118181839156158671", "images": [], "data_points": ["Leases $1.7T", "Purchase commitments $1.9T", "$685B due by 2027", "Off-BS $4.1T"], "created_at": "2026-11-05T03:21:19.000Z", "text": "3 days later: \n\n\"For the hyperscalers, we track $1.7 trillion in lease commitments. We also estimate $1.9 trillion of aggregate, unconditional purchase commitments—$685 billion of which is due by year-end 2027. While a portion of this amount is captured in consensus capex forecasts, we believe this (fast-growing) category nonetheless represents an additional 'use of cash.'\" - Goldman"}, {"author": "zerohedge", "description": "CoreWeave bonds at 78 cents (22 cents creditor impairment before equity); quoted: below 80c, >15% yield.", "tweet_url": "https://x.com/zerohedge/status/2118179141690483154", "images": ["https://pbs.twimg.com/media/HWVInwUXYAAMQEA.jpg"], "data_points": ["CRWV bonds 78c", "Yield >15%"], "created_at": "2026-11-05T03:10:35.000Z", "text": "CoreWeave bonds down to 78. \nThat's 22 cents of creditor impairment before equity value https://t.co/GQCEDHvWUD"}, {"author": "RealVision", "description": "Raoul Pal: intelligence per joule doubling every 4.5 months.", "tweet_url": "https://x.com/RealVision/status/2118078757504184352", "images": [], "data_points": ["Intelligence/joule 2x per 4.5 mo"], "created_at": "2026-11-04T20:31:42.000Z", "text": "Everyone's waiting for the AI bubble to burst. @RaoulGMI says it can't.\n\nIntelligence per joule is doubling every four and a half months, so if Google slows down for a year, Microsoft is three years ahead. Nobody in the race can afford to stop.\n\n\"It is the greatest discovery in the history of humanity, and the last discovery in all of humanity, because everything now gets discovered by AI.\""}, {"author": "matthew_sigel", "description": "Reply re-citing the Texas data-center jobs figures.", "tweet_url": "https://x.com/matthew_sigel/status/2118046016066769203", "images": [], "data_points": [], "created_at": "2026-11-04T18:21:36.000Z", "text": "@GinaHinojosaTX Don't forget the jobs. Good luck."}, {"author": "matthew_sigel", "description": "Quoted Texas data-center queue stakes: $520B–$780B construction for 65 GW (18-27% of TX GDP) up to $3.79T–$5.69T for full queue; jobs 45.5k–130k (65 GW) to 332k–948k construction jobs.", "tweet_url": "https://x.com/matthew_sigel/status/2118031702987555282", "images": [], "data_points": ["65 GW: $520-780B", "Full queue: $3.79-5.69T", "Up to 948k construction jobs"], "created_at": "2026-11-04T17:24:43.000Z", "text": "And don't forget the jobs:\nConstruction workers --&gt; \n45,500 to 130,000 for 65 GW \n143,500 to 410,000 for 205 GW\n331,800 to 948,000 for the full queue.\n\nPermanent operations jobs --&gt; \n9,750 to 22,750 for 65 GW\n30,750 to 71,750 for 205 GW\n71,100 to 165,900 for the full queue.\n\n@blackgldrush Yes agree here\n\n@blackgldrush @305Live2 Many such cases."}]}, {"topic": "Crypto Data", "items": [{"author": "matthew_sigel", "description": "FERC approved MARA's Long Ridge deal: $1.512B EV for ~0.5 GW gas generation, ~$144M adj. EBITDA (~10.5x vs ~7x PJM comps); ~$123M debt cost vs EBITDA (~1.2x); 600 MW AI load potential.", "tweet_url": "https://x.com/matthew_sigel/status/2118156500241957234", "images": ["https://pbs.twimg.com/media/HWUk36lWUAA8WbT.png"], "data_points": ["EV $1.512B", "EBITDA $144M", "10.5x vs 7x comps", "600 MW potential"], "created_at": "2026-11-05T01:40:37.000Z", "text": "Huge relief for $MARA.\n\nFERC approved $MARA’s Long Ridge acquisition today (EC26-92). Good to see the IMM’s spurious BlackRock/Vanguard challenge get the Heisman. FERC also turned down the request to condition approval on keeping the plant’s output in PJM. Solid.\n\nThe deal: $1.512B enterprise value for ~0.5 GW of gas generation (485 MW authorized, 505 MW nameplate) and ~$144M of annualized adj. EBITDA, about 10.5x. Recent PJM gas plant deals went at about 7x (Talen 6.7x, Vistra 7x, NRG 7.5x), which would put the plant alone at ~$1.0B. MARA is paying ~$0.5B more for the land, gas wells, rail and expansion option. MARA keeps ~$900M of Long Ridge debt in place and needs ~$610M of cash, which the $600M of BTC-backed loans it drew in August are meant to cover. I’d expect it to close by the Nov 30 outside date.\n\nDebt math: ~$1.9B of MARA’s $2.3B convert stack is zero coupon, so total post-close cash interest is roughly $140M: ~$58M on the Coinbase and Two Prime loans, ~$76M on Long Ridge’s own debt (the 8.75% notes alone are $52.5M) and ~$7M on the converts. Judging the deal on its own: the debt that finances it (Long Ridge’s ~$76M plus ~$46M on the new BTC loans) costs ~$123M a year against $144M of EBITDA, about 1.2x. The upside is expansion.\n\nMARA talks about 600 gross MW of AI load at the site. That appears to include the existing 200 MW of grid load (on top of the 505 MW plant that sells into PJM). AEP’s 2025 filing proposed reconductoring the feeder serving a customer at the Hannibal station to go from 100 to 200 MW, for about $0.5M, targeting about nine months from PJM first seeing the need to in-service. The station ties into four 138 kV lines and once fed a 540 MW smelter, which is encouraging, but nothing is signed. To get from 200 to 600 MW, AEP would likely need to add a second feed or upgrade lines, or MARA would build on-site generation, which raises turbine availability questions. I can’t find a public study of how much more the grid connection can carry. AEP Ohio’s data center tariff also requires large customers to pay for at least 85% of contracted capacity for up to 12 years, if it applies here. Still, an energized site with fuel, land and a 138 kV hub may beat waiting in ERCOT’s queue.\n\nIt’s unclear whether the Hannibal buildout goes through the Starwood JV, where MARA would keep up to 50%. That will decide how much of the 600 MW upside MARA owns. Each 100MW developed at a 7% cap rate and $2M/MW rent could be $1.5B+ of value creation, so it's a big variable and explains why they paid ~$500M above the 7x multiple for the extra capacity.\n\nNext catalyst, possibly at closing or just after: a signed lease."}, {"author": "matthew_sigel", "description": "Off-topic Sigel thread (leaving NY) with screenshot.", "tweet_url": "https://x.com/matthew_sigel/status/2118135592957714699", "images": ["https://pbs.twimg.com/media/HWUgcWxXQAAx44K.png"], "data_points": [], "created_at": "2026-11-05T00:17:33.000Z", "text": "Apparently Florida isn't far enough for some people. Started with \"good riddance\" and escalated to this gem. The basement dweller deleted it but I keep receipts. https://t.co/j7M272dbzj\n\n@atc6955 Sounds kinda nice right now too ngl\n\n@dollar_mara Wasn't you, yours was funny"}, {"author": "Tyler_Did_It", "description": "Robinhood Chain published its first ecosystem newsletter.", "tweet_url": "https://x.com/Tyler_Did_It/status/2118114121086550160", "images": [], "data_points": [], "created_at": "2026-11-04T22:52:13.000Z", "text": "Vlad just shared the first-ever What's on Robinhood Chain newsletter.\n\nThe Robinhood team said they'd lean in and are leaning in hard, day after day.\n\nPromises made, promises kept.\n\n@divotends_ hearing they're saving the boner posting for next week's newsletter"}, {"author": "matthew_sigel", "description": "Sigel suggests weakly capitalized miners sell to better-funded buyers; real estate investors valuing on 2028 numbers.", "tweet_url": "https://x.com/matthew_sigel/status/2118109873401409669", "images": [], "data_points": [], "created_at": "2026-11-04T22:35:21.000Z", "text": "My humble suggestion to the management teams in the sector with the weakest balance sheets: hire an advisor and formally discuss selling your company to someone who can better afford to build out your infrastructure. \n\nBe a hero. Set the valuation floor for everyone. Your legacy is secure. Find your next chapter.\n\n@FinGigawatt No. Real Estate investors. On 2028 numbers.\n\n@ashergenoot Done"}, {"author": "matthew_sigel", "description": "VanEck chart: Bitcoin miners down sharply with sector-wide valuation support; research note says selloff overdone.", "tweet_url": "https://x.com/matthew_sigel/status/2118107333599347013", "images": ["https://pbs.twimg.com/media/HWUGFO0X0AA4xNy.png"], "data_points": [], "created_at": "2026-11-04T22:25:15.000Z", "text": "Bitcoin miners have been crushed, and November is picking up where October left off.\n\nRarely do we see this much valuation support across an entire sector of our digital assets universe.\n\nThe market is pricing in a lot of bad news in our opinion. Our latest research explains why we think it's overdone.\n\nH/T Griffin MacMaster\n\n⬇️\n\nFull note --&gt;\nhttps://t.co/WuSbXtSoLY"}, {"author": "Tyler_Did_It", "description": "New 'Lobbies' social/group-trading feature for crypto trading apps.", "tweet_url": "https://x.com/Tyler_Did_It/status/2118106930103169146", "images": [], "data_points": [], "created_at": "2026-11-04T22:23:39.000Z", "text": "Pretty cool new feature to enable even more social trading. \n\nHave multiple friends whose screens I'd like to be watching while trenching..."}, {"author": "matthew_sigel", "description": "$CORZ backlog chart: 58% of backlog is $AMD (stock price vs backlog divergence).", "tweet_url": "https://x.com/matthew_sigel/status/2118102747748741557", "images": ["https://pbs.twimg.com/media/HWUDJAZXYAAqFZf.png"], "data_points": ["58% of CORZ backlog = AMD"], "created_at": "2026-11-04T22:07:02.000Z", "text": "ONE OF THESE LINES IS LYING\n\n58% of $CORZ (blue line) backlog is $AMD (white bars) https://t.co/1lEfUfqFWT\n\n@CoverageRatio that's the kind of capitulation I like to see: \"uninvestable\"."}, {"author": "matthew_sigel", "description": "VanEck post-election takeaways: BTC and gold outperform as tech lags; BTC-Nasdaq correlation breaking down; four-year cycle bottom seen in October.", "tweet_url": "https://x.com/matthew_sigel/status/2118096349178871921", "images": [], "data_points": [], "created_at": "2026-11-04T21:41:36.000Z", "text": "Key Takeaways:\n>Bitcoin and gold are outperforming post-election while tech lags. The Bitcoin-NASDAQ correlation breaking down is affirming. \n>More spending and debt issuance under a divided government is likely to keep the lights and the debt ceiling raised. Rs no longer have the numbers for their austerity wing to achieve anything. That's a bullish backdrop for Bitcoin as a hard asset as a meaningful percentage of the electorate and our trading partners object not only to the magnitude of deficits but also the use of funds.\n>Bitcoin’s regulatory picture is already clear. Nothing changes post-election. Custody and leverage are both regulated. Adoption continues to grow, with Bhutan becoming the third country to hold Bitcoin on its central bank balance sheet and Israel considering using BTC to circumvent some sanctions which are probably more likely given the elections' outcome.\n>VanEck sees Bitcoin setting up for another major run. It      follows a predictable four-year cycle, and based on that pattern, the bottom came in October. Democrats don’t create regulatory uncertainty for Bitcoin. Debate around altcoins and stablecoins is a separate story.\n>Bitcoin miners hit by Texas data center approvals may be a buying opportunity. Many stocks have round-tripped since announcing their AI pivots. Miners with orphaned capacity can still mine Bitcoin instead, to maximize powered land while they wait. Perhaps the election reinforced the value of that optionality."}, {"author": "glassnode", "description": "Glassnode: BTC spot volume stayed above August levels (when it hit lowest since 2023) despite the pullback.", "tweet_url": "https://x.com/glassnode/status/2118084798803517712", "images": ["https://pbs.twimg.com/media/HWTxJqpXkAAS0QD.jpg"], "data_points": ["Volume above Aug lows"], "created_at": "2026-11-04T20:55:42.000Z", "text": "bitcoin:native traders are still here after the retrace.\n\nBefore the spike in August, volume had sunk to its lowest since 2023.\n\nDespite BTC pulling back over the last weeks, volume has stayed above this August level.\n\nThis indicates sustained interest in crypto after months of apathy."}, {"author": "Tyler_Did_It", "description": "STRC repegged to $100 for the first time in ~6 months (12% yield), giving Saylor buying power for 157+ BTC.", "tweet_url": "https://x.com/Tyler_Did_It/status/2118080706018431131", "images": ["https://pbs.twimg.com/media/HWTu9HcXYAAebk1.jpg", "https://pbs.twimg.com/media/HWTvLOBWIAAzcnq.jpg"], "data_points": ["STRC $100", "157 BTC", "12% yield"], "created_at": "2026-11-04T20:39:27.000Z", "text": "STRC repegged to $100 today for the first time in nearly 6 months\n\nGiving Saylor the buy power for 157 BTC and counting https://t.co/P5LCq48F9j\n\n@retiredpotatoz Because it pays 12% interest on your money"}, {"author": "charliebilello", "description": "Trump family crypto earnings $1.4B vs $TRUMP -98.4%, $MELANIA -99.5%.", "tweet_url": "https://x.com/charliebilello/status/2118072490119626919", "images": ["https://pbs.twimg.com/media/HWTnVxPW8AANqYu.png", "https://pbs.twimg.com/media/HWTqjsqW8AASIEc.png", "https://pbs.twimg.com/media/HWTqlVSWwAAI4o-.png"], "data_points": ["$1.4B earnings", "TRUMP -98.4%", "MELANIA -99.5%"], "created_at": "2026-11-04T20:06:48.000Z", "text": "“Everybody’s profiting.” -President Trump\n\nExcept the people who bought his coins...\nTrump family crypto earnings: $1.4 billion\n$TRUMP meme coin: -98.4%\n$MELANIA meme coin: -99.5%\n\nPerhaps the most blatant example of corruption in the history of American politics. https://t.co/870rr3gyhj\n\nhttps://t.co/Uw5ZJ8q3M6\n\n@harveyrosenblum Right. The President of the United States bears no responsibility for people losing money on a meme coin he created, profited from, and used to sell access to the presidency. Makes sense."}, {"author": "benjamincowen", "description": "Comment: political figures were 'pro-getting-rich-off-crypto' rather than pro-crypto.", "tweet_url": "https://x.com/benjamincowen/status/2118072184006693172", "images": [], "data_points": [], "created_at": "2026-11-04T20:05:35.000Z", "text": "@ProofOfMoney They were never pro-crypto.\n\nThey were just pro-getting-rich-off-crypto."}, {"author": "matthew_sigel", "description": "Sigel CNBC Power Lunch appearance at 2:40 PM ET on bitcoin, stocks, election.", "tweet_url": "https://x.com/matthew_sigel/status/2118053533832630767", "images": [], "data_points": [], "created_at": "2026-11-04T18:51:28.000Z", "text": "I'll be on @PowerLunch at 2:40pm ET with Kelly and Dom. \nTune in for takes on Bitcoin, stocks, and the election.\n\n@EmmettLong8 @PowerLunch Here"}]}, {"topic": "Private Markets & VC", "items": [{"author": "a16z", "description": "US buyout minus Russell 3000 by vintage: +9.7 pts/yr (2001-05), +2.0 (2006-20), behind every vintage since 2019; 10-yr buyout 14.5%/yr vs venture 17.6%.", "tweet_url": "https://x.com/a16z/status/2118123637735919725", "images": ["https://pbs.twimg.com/media/HWUWOUPboAA_t_1.jpg"], "data_points": ["Buyout 14.5%/yr", "VC 17.6%/yr", "2001-05 +9.7pts"], "created_at": "2026-11-04T23:30:02.000Z", "text": "Recent US buyout funds would have done better just buying the stock market\n\nUS buyout returns minus the Russell 3000, by vintage:\n- About 9.7 points a year ahead for 2001-05 vintages\n- About 2.0 points a year ahead for 2006-20 vintages\n- Behind for every vintage since 2019\n\n\"Buyout has trailed public stocks while carrying far more debt. Over the last 10 years, US Buyout returned 14.5% a year, underperforming the Russell 3000. In contrast, US venture as a whole returned 17.6% a year over the same period (pooled across all funds), 2.3 points ahead of the Russell 3000. Unlevered.\"\n\nFull piece from a16z's Jen Kha: https://t.co/FQ7O8OwBe3\n\nNot an offer or solicitation. None of the above should be taken as investment advice or an advertisement for investment services. Please see https://t.co/nX2FtaLE06 for more information."}, {"author": "a16z", "description": "Martin Casado on four investing mindsets: financial, productive, frontier, speculative.", "tweet_url": "https://x.com/a16z/status/2118108653177950424", "images": [], "data_points": [], "created_at": "2026-11-04T22:30:30.000Z", "text": "a16z's Martin Casado on the four mindsets people bring to investing, and why knowing yours stops you from justifying your own bias:\n\n1. Financial\n\n\"The correct proxy for the health of a business is the market it's going into and its finances. That's what it is. What are the SaaS metrics? What is the size of the market? That is a proxy for the entire business.\"\n\n2. Productive\n\n\"You believe you're investing in a productive asset, and the productive asset is what's creating value. If you believe in that, as it creates value, it will create market... The type of diligence you do if you're a productive investor is more like, what is the technical approach? What are the adjacent markets?\"\n\n3. Frontier\n\n\"I think this is the romantic, idealized version of VC from the 60s and 70s, which is kind of YOLO. It's like, founders know better than VCs, and they've seen something that I don't see, and they're gonna go out there and do it. And, like, who am I to second guess them?\"\n\n4. Speculative\n\n\"It is always so surprising how prevalent it is... They don't even care about the asset. They just want to time a market, right?... They're like, 'Well, this looks cheap. It's clearly gonna go up in value' or, 'This is the top of the market, like, I'm gonna get out.'\"\n\n\"...You can justify any deal or not justify any deal. So if you don't know what your beliefs are, you'll always basically just kind of justify whatever personal bias you have.\"\n\n@martin_casado w/ @patrick_oshag on @InvestLikeBest"}, {"author": "a16z", "description": "Assistant Benchmark: 147 AI assistants tracked; trust is top fear in 22% of ~3,600 messages.", "tweet_url": "https://x.com/a16z/status/2118093537619349550", "images": [], "data_points": ["147 assistants", "22% of 3,600 msgs"], "created_at": "2026-11-04T21:30:26.000Z", "text": "a16z's Anish Acharya and David Pawlan, creator of Assistant Benchmark, on the gap between people's stated and revealed preferences on privacy, and what that means for AI agent adoption:\n\n\"I think in revealed preferences, consumers will share any amount of data for even the most trivial amount of upside.\"\n\n\"People have been connecting their cards, their credit cards, and their bank accounts via Plaid since the Venmo era. But when you ask them, they're like, 'Oh, yes, I'm very concerned about trust and safety.'\"\n\n\"I think an example though of where consumers are very concerned about sort of trust and assumptions is around being embarrassed and social signaling... The social mechanics actually feel so much higher stakes than the actual, like, real-world implications.\"\n\n\"[One company] offered a million dollars worth of pizza to anyone that wanted to use their product... In order to get that $30 of pizza, you were granting access to your entire Google Workspace, all of your emails, all of your data for 30 bucks.\"\n\n\"It just proves it right there, that people are willing to just give up all that data for some free pizza.\"\n\n@illscience @DavidPawlan"}, {"author": "a16z", "description": "Median revenue growth: PE-backed software 3-7%, public 10-16%, VC-backed private 18-30%.", "tweet_url": "https://x.com/a16z/status/2118078342746476919", "images": ["https://pbs.twimg.com/media/HWTtBxEboAAtFfO.jpg"], "data_points": ["PE 3-7%", "Public 10-16%", "VC 18-30%"], "created_at": "2026-11-04T20:30:03.000Z", "text": "PE-backed software now grows slower than public software, while venture-backed companies grow several times faster\n\nMedian revenue growth (latest available):\n- PE-backed software grows 3 to 7%\n- Public software grows 10 to 16%\n- Venture-backed private software grows 18 to 30%\n\n\"Because the best companies are staying private longer than ever, more of that growth is happening before they ever hit the public markets.\"\n\nFull piece from a16z's Jen Kha: https://t.co/FQ7O8OwBe3\n\nNot an offer or solicitation. None of the above should be taken as investment advice or an advertisement for investment services. Please see https://t.co/nX2FtaLE06 for more information."}, {"author": "a16z", "description": "Tech share of global buyout deal value: 23% (2018), 34% (2023), 29% (2025), 11% (Q1 2026).", "tweet_url": "https://x.com/a16z/status/2118067011943329903", "images": ["https://pbs.twimg.com/media/HWTiuNPaYAAjoph.jpg"], "data_points": ["23%→34%→29%→11%"], "created_at": "2026-11-04T19:45:02.000Z", "text": "PE's appetite for tech peaked just as the AI wave arrived\n\nTech's share of global buyout deal value:\n- 23% in 2018\n- 34% in 2023, the year after ChatGPT launched\n- 29% in 2025\n- 11% in the first quarter of 2026\n\n\"SaaS, of course, was also the manna from heaven for private equity: capital-light, consistent recurring revenue that was easy to lend against, lots of small markets with clear leaders, and a small but critical line in the customer's budget, so prices could go up.\"\n\n\"It is safe to say that the 2010s aren't coming back anytime soon: a supply of fixer-uppers, a decade of falling rates, and fast-growing funds that kept buying from each other at higher prices. A few rate cuts help the debt; they don't re-create that decade.\"\n\nFull piece from a16z's Jen Kha: https://t.co/FQ7O8OwBe3\n\nNot an offer or solicitation. None of the above should be taken as investment advice or an advertisement for investment services. Please see https://t.co/nX2FtaLE06 for more information."}, {"author": "a16z", "description": "Eve (legal AI): 1,700+ of ~29,000 US plaintiff firms, 350,000+ cases, $3.5B recovered; one firm 100→500 clients/attorney.", "tweet_url": "https://x.com/a16z/status/2118048262825665018", "images": [], "data_points": ["1,700 firms", "350k cases", "$3.5B recovered"], "created_at": "2026-11-04T18:30:31.000Z", "text": "Plaintiff lawyers only get paid if they win, so every legal firm hits a limit on how many cases it can take, and every case it turns down leaves someone without a lawyer.\n\nEve builds AI that handles the time-intensive casework, like reviewing medical records, drafting key documents, and opening insurance claims, cutting work that took days to under an hour. One firm went from about 100 clients per attorney to 500.\n\nThat gives small firms a real shot against insurers with far more resources.\n\nCo-founder and CEO Jay Madheswaran: \"Think about giving David a slingshot to take down Goliath. That's what we're doing.\"\n\nThree years in, 1,700+ of the roughly 29,000 plaintiff firms in the US use Eve. It's been used in 350,000+ cases and helped recover $3.5 billion for clients.\n\nEve is hiring across engineering, machine learning, sales, and customer success in SF, the Bay Area, and remotely across the US: https://t.co/l4xZWNv27o\n\n@jayanthmadhesw1 @evelegalai"}, {"author": "a16z", "description": "Top 5% of US funds 2007-16 vintages: venture 8.5x TVPI (5.3x DPI) vs buyout 3.8x (3.5x DPI).", "tweet_url": "https://x.com/a16z/status/2118036811666849822", "images": ["https://pbs.twimg.com/media/HWTHQWMbIAAgtzq.jpg"], "data_points": ["VC 8.5x TVPI", "Buyout 3.8x TVPI"], "created_at": "2026-11-04T17:45:01.000Z", "text": "The higher up you go, the more venture pulls ahead of buyout\n\nAmong the top 5% of US funds from 2007-16 vintages:\n- Venture funds hit 8.5x TVPI, with 5.3x returned in cash\n- Buyout funds hit 3.8x TVPI, with 3.5x returned in cash\n\n\"In venture, winning tends to beget winning: the best firms typically get the next call from the best founders.\"\n\nFull piece from a16z's Jen Kha: https://t.co/FQ7O8OwBe3\n\nNot an offer or solicitation. None of the above should be taken as investment advice or an advertisement for investment services. Please see https://t.co/nX2FtaLE06 for more information."}]}, {"topic": "Politics, Geopolitics & Prediction Markets", "items": [{"author": "Polymarket", "description": "New Polymarket market: Mayor combo New Taipei & Kaohsiung.", "tweet_url": "https://x.com/Polymarket/status/2118227058786787827", "images": [], "data_points": [], "created_at": "2026-11-05T06:21:00.000Z", "text": "🚨 NEW POLYMARKET: Mayor Combo: New Taipei and Kaohsiung\n\nhttps://t.co/DQRtvSAzQC"}, {"author": "C_Barraud", "description": "Bloomberg: France faces fresh protest wave as budget impasse deepens.", "tweet_url": "https://x.com/C_Barraud/status/2118219596943782105", "images": ["https://pbs.twimg.com/media/HWVsxmQWUAE7j_9.png"], "data_points": [], "created_at": "2026-11-05T05:51:21.000Z", "text": "🇫🇷 #France Faces Fresh Protest Wave With Budget Impasse Deepening - Bloomberg\nhttps://t.co/Xacgd98VX7 https://t.co/vVUBJgiA8Z"}, {"author": "Polymarket", "description": "Trump criticizes Senate for failing to pass the Sunshine Protection Act.", "tweet_url": "https://x.com/Polymarket/status/2118210701344796947", "images": [], "data_points": [], "created_at": "2026-11-05T05:16:00.000Z", "text": "JUST IN: Trump blasts the Senate for failing to pass the Sunshine Protection Act, calling 5 PM sunsets “ridiculous.”"}, {"author": "Polymarket", "description": "Polymarket: 99% chance California voters rejected the 5% billionaire wealth tax.", "tweet_url": "https://x.com/Polymarket/status/2118201076000362663", "images": ["https://pbs.twimg.com/media/HWVchqcX0AA4Jo7.jpg"], "data_points": ["99% odds rejected"], "created_at": "2026-11-05T04:37:45.000Z", "text": "BREAKING: Polymarket projects California voters have rejected the 5% billionaire wealth tax — 99% chance. https://t.co/pjXFA6lCrp"}, {"author": "zerohedge", "description": "ZeroHedge article: Trump's legacy and the Third Gulf War.", "tweet_url": "https://x.com/zerohedge/status/2118197976736633267", "images": [], "data_points": [], "created_at": "2026-11-05T04:25:26.000Z", "text": "Trump's Legacy Will Ultimately Be Determined By The Outcome Of The Third Gulf War https://t.co/Hhsz3DCpyv"}, {"author": "Polymarket", "description": "DeSantis comment on the 2026 midterms.", "tweet_url": "https://x.com/Polymarket/status/2118192287155109998", "images": [], "data_points": [], "created_at": "2026-11-05T04:02:50.000Z", "text": "JUST IN: Ron DeSantis says “George Washington would have lost” if he ran as a Republican in the 2026 midterms."}, {"author": "zerohedge", "description": "ZeroHedge political article: Virginia abortion law.", "tweet_url": "https://x.com/zerohedge/status/2118191684638896520", "images": [], "data_points": [], "created_at": "2026-11-05T04:00:26.000Z", "text": "Virginia Now Protects Third-Trimester Abortion With Doctor's Note https://t.co/PyKHhNY49B"}, {"author": "zerohedge", "description": "Comment: Democratic Socialists now lead both NYC and LA.", "tweet_url": "https://x.com/zerohedge/status/2118180604634341638", "images": [], "data_points": [], "created_at": "2026-11-05T03:16:24.000Z", "text": "Democrat Socialist in charge of NYC\nDemocrat Socialist in charge of LA"}, {"author": "KobeissiLetter", "description": "Axios: US preparing for a possible resumption of 'major' combat operations in Iran.", "tweet_url": "https://x.com/KobeissiLetter/status/2118179324050260254", "images": [], "data_points": [], "created_at": "2026-11-05T03:11:19.000Z", "text": "BREAKING: The Trump Administration and the US Military are finishing preparations for a possible resumption of \"major\" combat operations in Iran, per Axios.\n\nDetails include:\n\n1. Preparations including sending more assets to the Middle East, US officials say\n\n2. Vice President JD Vance has privately accused Israeli Prime Minister Netanyahu of \"being wrong on everything\" regarding Iran\n\n3. A former Trump Adivsor says, \"it's one thing to lose the midterms. But Trump doesn't want to look like a loser twice\"\n\nMarkets now await Trump's next move."}, {"author": "zerohedge", "description": "ZeroHedge article: Kansas mail carrier charged.", "tweet_url": "https://x.com/zerohedge/status/2118179102389637426", "images": [], "data_points": [], "created_at": "2026-11-05T03:10:26.000Z", "text": "Going Postal On The GOP? Kansas Mail Carrier Charged With Stealing Thousands Of Letters https://t.co/MJCFhJ8C6r"}, {"author": "Polymarket", "description": "West Hollywood votes to recognize multi-partner relationships.", "tweet_url": "https://x.com/Polymarket/status/2118174997747212729", "images": [], "data_points": [], "created_at": "2026-11-05T02:54:07.000Z", "text": "JUST IN: West Hollywood, California, votes unanimously to legally recognize throuples, foursomes, &amp; other multi-partner relationships."}, {"author": "zerohedge", "description": "Headline: Raman wins LA mayor race (DDHQ).", "tweet_url": "https://x.com/zerohedge/status/2118174409534091377", "images": [], "data_points": [], "created_at": "2026-11-05T02:51:47.000Z", "text": "*RAMAN WINS LOS ANGELES MAYOR RACE, DDHQ PROJECTS"}, {"author": "zerohedge", "description": "ZeroHedge article: Space Force guardians alongside elite units.", "tweet_url": "https://x.com/zerohedge/status/2118172810061160489", "images": [], "data_points": [], "created_at": "2026-11-05T02:45:26.000Z", "text": "Space Force Guardians Will Now Officially Serve Alongside Elite Units Like SEALs And Green Berets https://t.co/t9P9VOkrpS"}, {"author": "LynAldenContact", "description": "Lyn Alden long reply on legal system vs legislative roles.", "tweet_url": "https://x.com/LynAldenContact/status/2118170141305242059", "images": [], "data_points": [], "created_at": "2026-11-05T02:34:50.000Z", "text": "I can only reply to a minority of comments, and it’s usually luck-of-the-draw what I see when I’m online. And Twitter isn’t really the best place for long-form debates.\n\n“Why do you think the legal system couldn’t prevent the Biden Admin from allowing millions of unknown foreign men to illegally enter the country?”\n\n-Surely you’re aware of the asymmetry that courts are more able to block specific illegal actions than force officials to take positive actions that require funding. In other words, with a stroke of a pen a court can say,“no, those tariffs are illegal actually, you can’t use emergency powers for indefinite and broad new taxes” but it’s much harder to say, “you have to allocate more resources to the border.” To fix the latter you generally need an executive and legislative branch with the will to do it, which is partially what the 2024 election was a mandate on.\n\n“Why can’t the legal system prevent criminals who’ve been arrested 37 times from being let back into society?”\n\n-Places where people are arrested 37 times tend to be cities where the politicians and courts are in agreement. That’s the set of policies they have on the books and how the rules are being interpreted. If people get fed up with it they can elect people that will write and interpret stricter laws and sentences about repeated crime.\n\n“Why couldn’t the legal system prevent billions of dollars of egregious welfare fraud?”\n\n-Tons of cases are prosecuted each year. Even so, outright fraud is a small share of the spending. The bigger issue is healthcare bloat and demographics.\n\n“Why can’t the legal system enact voter ID which is the most obvious and basic tenet of election security?”\n\n-It’s not the role of the legal system to enact voter ID or other details around voting. That’s primarily within the legislative branch (unless the legislative branch does something that violates the Constitution).\n\n“If you are so willing to label Trump a \"fascist\", perhaps you could assign a label to the people who fail to deliver the most basic functions of government? What label should they be given?”\n\n-By definition, that description would be closer to anarchist."}, {"author": "Geo_papic", "description": "Papic: Biden-era regulation restricted energy supply, which was bullish for the energy sector.", "tweet_url": "https://x.com/Geo_papic/status/2118103524475273438", "images": [], "data_points": [], "created_at": "2026-11-04T22:10:07.000Z", "text": "@citrini Joe Biden was GREAT for the energy sector because he used regulation to restrict supply. \n\nSecond order effects are often weird when it comes to regulation."}, {"author": "RealVision", "description": "Real Vision: Democrats took Congress; watching // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = item.description || item.text || '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(renderItem).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const topicCount = (d.topics || []).length;
  const itemCount = (d.topics || []).reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`topics <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const topicsBody = (d.topics || []).map(renderTopic).join('')
                  || '<div class="empty">No topics.</div>';
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Topics', topicsBody, (d.topics || []).length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
</body>
