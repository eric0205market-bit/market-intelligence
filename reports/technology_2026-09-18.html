ovation have launched a joint $10 million (£7.4 million) research initiative supporting eight transatlantic research teams in molecular quantum information science.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["National Science Foundation", "UK Research and Innovation", "molecular quantum information science"], "conviction": "high", "so_what": "Public money is flowing into pre-commercial molecular qubit chemistry, seeding the IP and talent base that later private rounds will build on.", "quote": "have launched a joint $10 million (£7.4 million) research initiative supporting eight transatlantic research teams", "locator": "opening paragraph", "quote_verified": true}, {"claim": "The money is split roughly evenly, with $5 million from the NSF Directorate for Mathematical and Physical Sciences and £3.7 million (about $5 million) from UKRI's Engineering and Physical Sciences Research Council.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["NSF MPS", "UKRI", "EPSRC"], "conviction": "high", "so_what": "A matched-contribution structure signals durable bilateral commitment rather than a one-off grant, which matters for research continuity.", "quote": "Funded via $5 million from the NSF Directorate for Mathematical and Physical Sciences (MPS) and £3.7 million (~$5 million) from UKRI’s Engineering and Physical Sciences Research Council (EPSRC)", "locator": "opening paragraph", "quote_verified": true}, {"claim": "This is the second $10 million phase of joint NSF-EPSRC quantum chemistry funding, expanding upon initial allocations announced in 2025.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["NSF", "EPSRC", "quantum chemistry"], "conviction": "high", "so_what": "A repeat tranche implies the first phase cleared internal review, making this a programmatic line item rather than an experiment.", "quote": "The initiative represents the second $10 million phase of joint NSF-EPSRC quantum chemistry funding", "locator": "second paragraph", "quote_verified": true}]}, {"theme": "Molecular Qubits as a Distinct Hardware Bet", "insights": [{"claim": "The program targets foundational chemistry research to manipulate quantum coherence, entanglement and superposition within complex molecular architectures, rather than the superconducting or trapped-ion platforms that dominate commercial quantum computing.", "speaker": "Mohamed Abdel-Kareem", "type": "thesis", "entities": ["quantum coherence", "entanglement", "superposition", "molecular architectures"], "conviction": "medium", "so_what": "Molecular qubits are an early-stage alternative modality; state funding here is a leading indicator of where a future hardware challenger could emerge.", "quote": "the program targets foundational chemistry research to manipulate quantum coherence, entanglement, and superposition within complex molecular architectures", "locator": "opening paragraph", "quote_verified": true}, {"claim": "Technical objectives include synthesizing custom molecular systems that preserve fragile quantum states against environmental decoherence such as thermal noise, engineering molecular-scale spin qubits, and modeling quantum information transfer in chemical reactions.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["molecular spin qubits", "decoherence", "thermal noise"], "conviction": "high", "so_what": "Decoherence shielding at the molecular level is the specific technical unlock that would make this modality investable.", "quote": "engineering molecular-scale spin qubits, and modeling quantum information transfer in complex chemical reactions", "locator": "second paragraph", "quote_verified": true}, {"claim": "The initiative pairs international laboratory capabilities to accelerate design of molecular hardware for quantum sensing, memory and information processing, implying sensing and memory applications may arrive before general-purpose computing.", "speaker": "Mohamed Abdel-Kareem", "type": "prediction", "entities": ["quantum sensing", "quantum memory", "molecular hardware"], "conviction": "medium", "so_what": "Sensing and memory are nearer-term revenue surfaces than universal quantum computation, so this is where molecular-qubit commercialization would start.", "quote": "accelerate the design of molecular hardware for quantum sensing, memory, and information processing", "locator": "fourth paragraph", "quote_verified": true}]}, {"theme": "Policy Mandate and Geographic Distribution", "insights": [{"claim": "The collaborative framework directly fulfills international research partnership directives outlined in the June 2026 Executive Order on Ushering in the Next Frontier of Quantum Innovation.", "speaker": "Mohamed Abdel-Kareem", "type": "causal", "entities": ["Executive Order on Ushering in the Next Frontier of Quantum Innovation", "NSF", "UKRI"], "conviction": "high", "so_what": "Executive-order backing means further allied quantum co-funding announcements are likely, and grant flow becomes semi-predictable policy output.", "quote": "directly fulfills international research partnership directives outlined in the June 2026 Executive Order on Ushering in the Next Frontier of Quantum Innovation", "locator": "second paragraph", "quote_verified": true}, {"claim": "In the U.S. the funding supports principal investigators across nine higher education institutions in nine states, including capacity-building awards under the NSF Established Program to Stimulate Competitive Research.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["NSF EPSCoR", "United States"], "conviction": "medium", "so_what": "Deliberate geographic spread widens the regional quantum talent base beyond the coastal research hubs that currently capture most quantum capital.", "quote": "supports principal investigators across nine higher education institutions in nine states, including capacity-building awards under the NSF Established Program to Stimulate Comp gh a central untrusted hub and thereby eliminates detector-side channel attack vectors present in traditional point-to-point QKD.", "speaker": "Mohamed Abdel-Kareem", "type": "framework", "entities": ["MDI-QKD", "QKD", "Falqon Systems"], "conviction": "high", "so_what": "Removing trust from the central node is the argument that lets QKD vendors sell into networks where a trusted-node model would be rejected outright.", "quote": "routes quantum signals through a central untrusted hub, eliminating detector-side channel attack vectors", "locator": "MDI-QKD paragraph", "quote_verified": true}, {"claim": "MDI-QKD allows multi-node star topologies where many parties share cryptographic keys without exposing raw keys at the central junction, a topology advantage over point-to-point links.", "speaker": "Mohamed Abdel-Kareem", "type": "framework", "entities": ["MDI-QKD", "star topology"], "conviction": "high", "so_what": "Topology economics decide QKD unit costs: one shared detector hub serving many spokes is far cheaper per endpoint than pairwise links.", "quote": "allowing multi-node star topologies to share cryptographic keys without exposing raw keys at the central junction", "locator": "MDI-QKD paragraph", "quote_verified": true}, {"claim": "The Falqon Key Manager handles hybrid key lifecycle management that integrates QKD with post-quantum cryptography and exposes an ETSI GS QKD 014 compliance interface.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Falqon Key Manager", "post-quantum cryptography", "ETSI GS QKD 014"], "conviction": "medium", "so_what": "Combining QKD with PQC rather than positioning them as rivals is how QKD vendors stay relevant as software-only PQC becomes the default.", "quote": "Integrates QKD & Post-Quantum Cryptography (PQC)", "locator": "product portfolio matrix", "quote_verified": true}, {"claim": "The Falqon Domain Controller applies software-defined networking control for dynamic optical routing, key allocation and dwestern ecosystem — Kommu quote", "quote_verified": true}, {"claim": "Brewer Science's presence in the Midwest since 1981 is offered as evidence that world-class materials innovation and manufacturing can thrive outside traditional coastal hubs, directly challenging the historical consolidation of semiconductor ecosystems.", "speaker": "Brendan Heffernan", "type": "contrarian", "entities": ["Brewer Science", "Srikanth Kommu"], "conviction": "high", "so_what": "Undercuts the default assumption that semiconductor agglomeration economics force coastal or Asian concentration.", "quote": "Brewer Science has been rooted in the Midwest since 1981, and our positioning isn’t incidental to the region; it’s strategic", "locator": "Defining the Midwestern ecosystem — Kommu quote", "quote_verified": true}, {"claim": "The manufacturers that will matter most in the region are those treating it as a 20-year investment in institutional capability rather than a response to quarterly performance metrics.", "speaker": "Brendan Heffernan", "type": "thesis", "entities": ["Brewer Science", "Srikanth Kommu"], "conviction": "high", "so_what": "A screening heuristic: suppliers managing to quarterly metrics are unlikely to hold the regional positions that pay off late this decade.", "quote": "The manufacturers who will matter most in this region are those treating this as a 20-year investment in institutional capability, not a response to quarterly performance metrics.", "locator": "Defining the Midwestern ecosystem — Kommu quote", "quote_verified": true}]}, {"theme": "Workforce velocity and capital durability as the binding constraints", "insights": [{"claim": "Two challenges determine whether the regional semiconductor resurgence becomes durable: workforce velocity and capital market confidence.", "speaker": "Brendan Heffernan", "type": "framework", "entities": ["Brewer Science", "Srikanth Kommu", "Midwest"], "conviction": "high", "so_what": "A compact two-variable frame for underwriting r g execution question rather than a build-announcement event.", "quote": null, "locator": "Filling the gaps in workforce development and funding — Salomone quote", "quote_verified": false}]}, {"theme": "Chicago quantum cluster as the region's open-field bet", "insights": [{"claim": "The Chicagoland quantum push is backed by $500 million in Illinois state funding for the Illinois Quantum and Microelectronics Park plus a planned $1 billion investment from PsiQuantum, on part of the former U.S. Steel South Works site on Chicago's south side lakefront.", "speaker": "Brendan Heffernan", "type": "data_point", "entities": ["PsiQuantum", "Illinois Quantum and Microelectronics Park", "Illinois", "U.S. Steel", "Chicago"], "conviction": "high", "so_what": "Quantifies one of the largest subnational quantum commitments in the U.S. and identifies PsiQuantum as its anchor private counterparty.", "quote": "with $500 million in Illinois state funding for the Illinois Quantum and Microelectronics Park and a planned $1 billion investment from PsiQuantum", "locator": "Quantum opportunities", "quote_verified": true}, {"claim": "The University of Chicago-affiliated Chicago Quantum Exchange projects emerging quantum technology could generate up to $80B in economic impact for Illinois, Wisconsin and Indiana by 2035.", "speaker": "Brendan Heffernan", "type": "prediction", "entities": ["Chicago Quantum Exchange", "University of Chicago", "Illinois", "Wisconsin", "Indiana"], "conviction": "medium", "so_what": "An explicit, datable size estimate for tri-state quantum economic impact that can be tested against actual commercialization by 2035.", "quote": "could generate up to $80B in economic impact for Illinois, Wisconsin, and Indiana by 2035", "locator": "Quantum opportunities", "quote_verified": true}, {"claim": "The region's advantage in quantum depends on continuing to launch initiatives 18 to 24 months ahead of other regions, an edge the Midwest has not typically maintained in other sector pans materials, components, subsystems and full systems, and regional manufacturers already produce inputs such as diamond, vacuum systems and nanopositioners that could scale into a domestic quantum supply chain that does not yet fully exist.", "speaker": "Brendan Heffernan", "type": "framework", "entities": ["Chicago Quantum Exchange", "Kate Waimey Timmerman", "diamond", "nanopositioners", "vacuum systems"], "conviction": "medium", "so_what": "Points to unglamorous component vendors — not qubit startups — as the near-term investable layer of quantum.", "quote": "We already have regional manufacturers producing materials such as diamond, as well as components such as vacuum systems and nanopositioners.", "locator": "Quantum opportunities — Timmerman quote for manufacturers", "quote_verified": true}, {"claim": "Quantum sensors are already at relatively high technology-readiness levels and can be bought and piloted today, while quantum networking and quantum computing remain farther off.", "speaker": "Brendan Heffernan", "type": "prediction", "entities": ["quantum sensors", "quantum networking", "quantum computing", "Chicago Quantum Exchange"], "conviction": "high", "so_what": "Separates the near-term revenue segment of quantum from the long-dated ones — sensing is where commercial orders exist now.", "quote": "Quantum sensors are already at relatively high technology-readiness levels, and companies can buy and pilot systems today.", "locator": "Quantum opportunities — Timmerman, for end users", "quote_verified": true}, {"claim": "Even though quantum systems require fundamentally different architectures than conventional computing, they still rely on sophisticated design methodologies, simulation technologies and increasingly complex semiconductor components — creating an EDA and modeling attach point.", "speaker": "Brendan Heffernan", "type": "thesis", "entities": ["Synopsys", "Christopher Salomone", "EDA", "quantum computing"], "conviction": "medium", "so_what": "EDA vendors have a credible, non-speculative revenue path into quantum via design, modeling and verification rather than qubit technology bets.", "quote": "While quantum systems require fundamentally different architectures than conventional computing, they still rely on sophisticated design methodologies, simulation technologies, and increasingly complex semiconductor components.", "locator": "Quantum opportunities — Salomone quote", "quote_verified": true}, {"claim": "The Duality Accelerator, launched in 2020-2021 as the first quantum-focused startup accelerator in the U.S. and managed by the Chicago Quantum Exchange, has supported roughly 25 to 30 startups across quantum computing, communications, sensing and enabling technologies, with companies like qBraid relocating to the region.", "speaker": "Brendan Heffernan", "type": "data_point", "entities": ["Duality Accelerator", "Chicago Quantum Exchange", "qBraid"], "conviction": "high", "so_what": "Gives a concrete deal-flow count for the region's quantum startup pipeline and evidence that infrastructure access pulls companies to relocate.", "quote": "To date, Duality has supported roughly 25 to 30 startups.", "locator": "Quantum opportunities — Timmerman on Duality", "quote_verified": true}]}, {"theme": "Startup infrastructure economics and the Valley of Death", "insights": [{"claim": "The Midwest Microelectronics Consortium's core role is helping regional entrepreneurs survive the \"Valley of Death\" by giving members access to compute environments, design tools and prototyping capabilities at lower cost or through different cost models than were previously available.", "speaker": "Brendan Heffernan", "type": "framework", "entities": ["MMEC", "Matt Casto", "design tools", "prototyping"], "conviction": "high", "so_what": "Shared-infrastructure consortia, not venture capital alone, are the mechanism lowering the entry cost for hardware startups outside coastal hubs.", "quote": "Streamlining access to prototyping capabilities, whether that be tools to do epitaxial development, or the ability to do advanced packaging and module development and characterization and tests", "locator": "Startup support — Casto quote", "quote_verified": true}, {"claim": "MMEC is developing intellectual property and building startup design feedback into its digital infrastructure specifically to make it easier for other companies to use foundry ecosystems, aggregating requirements to lower costs through economies of scale.", "speaker": "Brendan Heffernan", "type": "causal", "entities": ["MMEC", "Matt Casto", "foundry ecosystems", "IP"], "conviction": "medium", "so_what": "Demand aggregation by a consortium is a non-obvious lever for reducing per-startup foundry access cost, and a potential channel partner for EDA and IP vendors.", "quote": "We can aggregate requirements and lower costs through economies of scale for other businesses to use.", "locator": "Startup support — Casto quote", "quote_verified": true}, {"claim": "EDA companies historically supplied tools to universities in order to hire graduates and relocate them to existing tech hubs; what has changed is that new jobs are now being created outside those hubs, where cost of living is far lower than in places like Silicon Valley.", "speaker": "Brendan Heffernan", "type": "contrarian", "entities": ["EDA", "Synopsys", "Silicon Valley", "universities"], "conviction": "medium", "so_what": "A structural shift in engineering labor geography that lowers the wage base for chip design work and changes where EDA seat growth lands.", "quote": "in the past the goal was to hire new engineering graduates and relocate them back to existing tech hubs", "locator": "Startup support", "quote_verified": true}]}], "insight_total": 29, "top_entities": ["Intel", "SK hynix", "PsiQuantum", "Brewer Science", "Synopsys", "Chicago Quantum Exchange", "MMEC", "Hemlock Semiconductor", "Polar Semiconductor", "IBM", "Quantum Computing Inc.", "NHanced Semiconductors"], "source_meta": {"author": "Brendan Heffernan", "word_count": 3459, "paywalled": false}}, {"record_id": "45e06747585b352a", "source_type": "technology", "source_name": "Semiconductor Engineering", "source_url": "https://semiengineering.com/negative-expansion-materials-resist-warpage/", "title": "Negative Expansion Materials Resist Warpage", "published_date": "2026-09-17", "language": "en", "processed_at": "2026-09-18T11:10:46Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "Thermally induced warpage from coefficient-of-thermal-expansion mismatch is one of the biggest constraints on growing package substrates, interposers and panels, and existing levers like silicon thinning conflict with high-power thermal needs. A newly commercial class of negative thermal expansion fillers from Mitsubishi Chemical Group — inorganic, lattice-caged materials mixed into epoxy molding compounds and underfills — offers a way to tune effective CTE downward, but adoption hinges on temperature range, mixing uniformity, and alpha-particle-emitting impurities.", "themes": [{"theme": "Warpage as the gating constraint on larger packages and panels", "insights": [{"claim": "Thermally induced warpage is one of the biggest issues holding back the constant enlargement of package substrates, interposers and panels, because the larger the bonded area, the greater the likelihood that edge connections are poor or fail altogether.", "speaker": "Bryon Moyer", "type": "causal", "entities": ["warpage", "interposers", "panel-level packaging", "package substrates"], "conviction": "high", "so_what": "Identifies the physical ceiling on the package-size scaling that AI accelerator roadmaps depend on — a materials problem, not a lithography one.", "quote": "It’s one of the biggest issues holding back the constant enlargement of package substrates, interposers, and panels.", "locator": "Warpage as the enemy", "quote_verified": true}, {"claim": "Excess warpage defeats standard manufacturing equipment features before bonding even happens: vacuum chucks pull warpage down, but if warpage is too high the tool cannot get a good vacuum.", "speaker": "Bryon Moyer", "type": "causal", "entities": ["Amkor", "Knowlton Olmstead", "vacuum chucks", "warpage"], "conviction": "high", "so_what": "Warpage limits are enforced by installed equipment, meaning the problem shows up as yield and handling loss across existing OSAT tool fleets, not just at final test.", "quote": "The vacuum chucks will pull the warpage down, but if the warpage is too high, then you won’t get a good vacuum", "locator": "Warpage as the enemy — Olmstead quote", "quote_verified": true}, {"claim": "It is theoretically impossible to eliminate all warpage where a CTE difference exists, so the engineering question is not prevention but how much warpage is too much and what levers can control it.", "speaker": "Bryon Moyer", "type": "framework", "entities": ["CTE", "warpage", "Amkor"], "conviction": "high", "so_what": "Reframes warpage as a tolerance-budgeting discipline, which is why modeling and materials tuning — not a single fix — become recurring spend.", "quote": "It’s theoretically impossible to stop all warpage if there is a CTE difference.", "locator": "Warpage as the enemy", "quote_verified": true}, {"claim": "Thinning silicon reduces warping by reducing the impact of low-CTE silicon, but in the extreme the silicon merely follows the shape of whatever it is attached to, and nobody wants really thin silicon for managing high power.", "speaker": "Bryon Moyer", "type": "causal", "entities": ["Amkor", "Mike Kelly", "silicon thinning", "FCBGA", "chiplets"], "conviction": "high", "so_what": "The conventional warpage lever directly conflicts with high-power AI package thermal requirements, which is why new materials rather than thinner die are being pursued.", "quote": "In the extreme, you can make it super thin, and then it can follow the shape of whatever I’m attached to. But that ends up being a problem, because nobody wants really thin silicon for managing high power.", "locator": "Warpage as the enemy — Kelly quote", "quote_verified": true}, {"claim": "Glass panels could raise warpage by three orders of magnitude relative to today's practice — from micrometers of warpage to potentially millimeters — as panel size grows.", "speaker": "Bryon Moyer", "type": "prediction", "entities": ["Synopsys", "Lang Lin", "glass substrates", "panel-level packaging"], "conviction": "medium", "so_what": "A concrete magnitude estimate for why glass-core substrate adoption may be slower and more materials-dependent than roadmaps assume.", "quote": "Today we talk about micrometers of warpage, but with glass, it could be even larger — millimeters, maybe.", "locator": "Warpage as the enemy — Lin quote", "quote_verified": true}, {"claim": "Epoxy molding compound used for fillers and underfill is the leverage point for warpage control because it fills all the major gaps inside the package and therefore affects everything it touches when temperature changes.", "speaker": "Bryon Moyer", "type": "framework", "entities": ["epoxy molding compound", "EMC", "underfill", "advanced packaging"], "conviction": "high", "so_what": "Explains why molding compound and underfill suppliers — not substrate makers alone — capture the value from solving large-package warpage.", "quote": "It fills all the major gaps inside the package, so when the temperature changes, it can affect everything it touches.", "locator": "Going against the grain", "quote_verified": true}]}, {"theme": "Negative thermal expansion mechanism: lattices and caged flow", "insights": [{"claim": "Rather than relying solely on the few substances that genuinely shrink when heated, companies are focusing on mixtures of materials with a lattice structure that resists the urge to expand, using them as underfill and molding compound to add rigidity for larger packages while keeping warpage in check.", "speaker": "Bryon Moyer", "type": "thesis", "entities": ["NTE materials", "underfill", "molding compound", "lattice structure"], "conviction": "high", "so_what": "The commercial path is composite formulation, not discovery of exotic pure NTE compounds — which makes it a formulation-chemistry business.", "quote": "Rather than relying solely on the few substances that can shrink, companies are focusing on mixtures of materials with a lattice structure that can resist the urge to expand.", "locator": "Lede", "quote_verified": true}, {"claim": "The performance of a negative-expansion additive is governed by the structure of the filler network — house-of-cards, rigid-rod, or tetrahedral lattices each behave differently — rather than by the chemical identity of the material alone.", "speaker": "Bryon Moyer", "type": "framework", "entities": ["Mitsubishi Chemical Group", "Sanjiv Bhatt", "rheology", "filler network"], "conviction": "high", "so_what": "Competitive moat sits in network architecture and functionalization know-how, which is harder to copy than a compound formula.", "quote": "It’s more of a network thing than a material thing", "locator": "Going against the grain — Bhatt quote", "quote_verified": true}, {"claim": "The difference between filler types is analogous to logs in a river versus clay in water: carbon fiber forms a reinforcing rigid-rod network that only partially restricts flow, while a dispersed particulate like clay changes viscosity and literally restricts movement.", "speaker": "Bryon Moyer", "type": "anecdote", "entities": ["Mitsubishi Chemical Group", "Sanjiv Bhatt", "carbon fiber", "carbon powder"], "conviction": "medium", "so_what": "A usable mental model for judging which filler chemistries can actually suppress expansion versus merely reinforce a resin.", "quote": "If I use the logs in water, it is going to have little impact on the ability of water to flow.", "locator": "Going against the grain — Bhatt quote", "quote_verified": true}, {"claim": "Shrinkage and expansion are treated rheologically as low shear-rate flows, so caging a material in a matrix changes the dynamics of that flow and can even produce slight contraction on heating by reorienting molecules in the structure.", "speaker": "Bryon Moyer", "type": "framework", "entities": ["Mitsubishi Chemical Group", "Sanjiv Bhatt", "rheology", "NTE"], "conviction": "medium", "so_what": "Recasting thermal expansion as a flow problem opens design space beyond searching for naturally NTE compounds.", "quote": "A lot of people will talk about shrinkage and expansion, but to me, those are low shear-rate flows rheologically", "locator": "Caught in a cage — Bhatt quote", "quote_verified": true}, {"claim": "Self-assembly is where chemistry enters: the filler components must be functionalized appropriately so they arrange themselves into a house-of-cards lattice whose resultant matrix has a negative CTE.", "speaker": "Bryon Moyer", "type": "causal", "entities": ["Mitsubishi Chemical Group", "Sanjiv Bhatt", "self-assembly", "negative CTE"], "conviction": "high", "so_what": "Surface functionalization capability, not raw material supply, determines who can actually produce working NTE fillers at scale.", "quote": "Self-assembly is where chemistry comes into the picture — you have to make sure that these things are functionalized appropriately so they arrange themselves in a certain way.", "locator": "Caught in a cage — Bhatt quote", "quote_verified": true}, {"claim": "The restraining matrix can burst under the pressure of the expanding material it cages, and that failure mode is simply melting — the point at which the entire configuration falls apart — bounded by the matrix's own thermal capability.", "speaker": "Bryon Moyer", "type": "causal", "entities": ["Mitsubishi Chemical Group", "Sanjiv Bhatt", "melting", "matrix"], "conviction": "medium", "so_what": "Defines the upper operating limit of caged NTE composites, which matters for high-temperature assembly steps and reliability qualification.", "quote": "If you have a matrix and you melt it and it starts flowing, that’s the bursting analogy", "locator": "Caught in a cage — Bhatt quote", "quote_verified": true}, {"claim": "Reinforcement changes the flow characteristics of the encased material but does very little for its thermal transitional behavior and will never change the glass transition or melt transition temperature.", "speaker": "Bryon Moyer", "type": "data_point", "entities": ["Mitsubishi Chemical Group", "Sanjiv Bhatt", "glass transition", "melt transition"], "conviction": "high", "so_what": "Sets a hard boundary on what NTE fillers can fix — they buy CTE tuning, not extended thermal operating windows.", "quote": "It will never change the glass transition or the melt transition temperature.", "locator": "Caught in a cage — Bhatt quote", "quote_verified": true}, {"claim": "The goal is not a zero-CTE material but tuning a compound's effective CTE to minimize the mismatch among die, substrate and encapsulant, thereby reducing stress and package warpage.", "speaker": "Bryon Moyer", "type": "thesis", "entities": ["Mitsubishi Chemical Group", "Sanjiv Bhatt", "CTE matching", "encapsulant"], "conviction": "high", "so_what": "Reframes the product as a tunable CTE knob per package stack, implying customized formulations per customer rather than a single commodity grade.", "quote": "Our negative-CTE filler contracts as temperature rises, offsetting the natural expansion of the resin", "locator": "Caught in a cage — Bhatt quote", "quote_verified": true}, {"claim": "Negative-CTE fillers can be added to a polymer, which typically has a very high CTE compared to inorganics, to pull the polymer matrix's overall CTE closer to that of the metal layers and other device components.", "speaker": "Bryon Moyer", "type": "causal", "entities": ["Brewer Science", "Luke Prenger", "polymer", "inorganic fillers"], "conviction": "high", "so_what": "Names the specific mismatch — organic layers versus metal and inorganic layers — that NTE fillers target inside advanced packages.", "quote": "Reducing or modulating the CTE of organic layers to be closer to the inorganic layers helps in reducing warpage and overall stress build-up in a device.", "locator": "Warpage as the enemy — Prenger quote", "quote_verified": true}]}, {"theme": "Scarcity of true NTE materials and the inorganic-only constraint", "insights": [{"claim": "The number of negative-CTE materials is very limited, with β-eucryptite actively used as ceramics for chucks and parts in certain tooling and zirconium tungstate used as an additive for various mold compounds and underfills.", "speaker": "Bryon Moyer", "type": "data_point", "entities": ["Brewer Science", "Luke Prenger", "β-eucryptite", "zirconium tungstate"], "conviction": "high", "so_what": "Names the only two incumbent NTE materials in practical use — a very narrow supply base that constrains how fast the approach can scale.", "quote": "β-eucryptite is actively used as ceramics for chunks and parts in certain tooling, and zirconium tungstate is being utilized as an additive for various types of mold compounds and underfills.", "locator": "NTE materials debut — Prenger quote", "quote_verified": true}, {"claim": "Zirconium tungstate does not occur in nature and is one of the human-made substances exhibiting negative thermal expansion in all three dimensions, and such materials are very challenging to design.", "speaker": "Bryon Moyer", "type": "data_point", "entities": ["zirconium tungstate", "eucryptite", "NTE"], "conviction": "high", "so_what": "Three-dimensional NTE is rare and synthetic, so the supply chain for these fillers is manufactured chemistry rather than mined material.", "quote": "With NTE in all three dimensions, it’s one of the human-made NTE substances.", "locator": "NTE materials debut", "quote_verified": true}, {"claim": "Designing new negative-CTE materials exists only in the realm of inorganic materials, because for almost every polymer noted to have negative CTE the effect is negative in only one dimension — which limits organic materials exclusively to adding inorganic fillers.", "speaker": "Bryon Moyer", "type": "causal", "entities": ["Brewer Science", "Luke Prenger", "polymers", "inorganic fillers"], "conviction": "high", "so_what": "Structurally rules out an all-organic solution, locking the value into inorganic filler suppliers who feed the polymer formulators.", "quote": "for almost every polymer material that is noted to have negative CTE, it is negative only in one dimension, not in three dimensions", "locator": "NTE materials debut — Prenger quote", "quote_verified": true}, {"claim": "True NTE behavior often occurs only within specific temperature ranges and may be associated with a phase change, as with water, which expands between 3.98°C and 0°C as more of it takes on the less dense ice configuration.", "speaker": "Bryon Moyer", "type": "framework", "entities": ["NTE", "phase change", "water"], "conviction": "high", "so_what": "Explains why temperature-range coverage is the key qualification hurdle for these materials rather than peak performance at one temperature.", "quote": "A variety of materials can exhibit true negative thermal expansion (NTE) behavior, although it often occurs within specific temperature ranges.", "locator": "Going against the grain", "quote_verified": true}]}, {"theme": "Commercialization: Mitsubishi's debut and the adoption gates", "insights": [{"claim": "Although NTE materials have been a research topic for a while, they have recently become commercially available from Mitsubishi Chemical Group as an inorganic material that can be mixed with organic epoxy resins to customize the epoxy's CTE, and is also offered pre-mixed with resin.", "speaker": "Bryon Moyer", "type": "data_point", "entities": ["Mitsubishi Chemical Group", "epoxy resins", "NTE"], "conviction": "high", "so_what": "Marks the transition of NTE from lab curiosity to a purchasable packaging material, with Mitsubishi holding first-mover position.", "quote": "they’ve recently become available from Mitsubishi Chemical Group", "locator": "NTE materials debut", "quote_verified": true}, {"claim": "If this proves out and other materials companies follow suit, negative-expansion filler could become a standard formulation for semiconductor packaging.", "speaker": "Bryon Moyer", "type": "prediction", "entities": ["Mitsubishi Chemical Group", "semiconductor packaging", "molding compound"], "conviction": "exploratory", "so_what": "Flags a potential new standard line item in the packaging materials bill of materials, with follow-on entrants likely if qualification succeeds.", "quote": "If this proves out and other materials companies follow suit, this could become a standard formulation for semiconductor packaging.", "locator": "NTE materials debut", "quote_verified": true}, {"claim": "Commercial success for NTE packaging materials requires performing over a wide temperature range covering both processing and higher-temperature manufacturing operations, mixing easily and uniformly into resins, and not introducing unexpected effects from alpha-particle emissions caused by impurities.", "speaker": "Bryon Moyer", "type": "framework", "entities": ["NTE materials", "alpha particles", "resins", "purity"], "conviction": "high", "so_what": "A three-item qualification checklist that will decide adoption — alpha emission in particular ties material purity directly to soft-error reliability.", "quote": "They must also not introduce unexpected effects from alpha-particle emissions caused by impurities.", "locator": "NTE materials debut", "quote_verified": true}, {"claim": "Warpage is modeled beforehand and then controlled through a set of levers, making pre-assembly simulation a standard part of OSAT warpage management.", "speaker": "Bryon Moyer", "type": "data_point", "entities": ["Amkor", "Knowlton Olmstead", "warpage modeling"], "conviction": "medium", "so_what": "Simulation tooling is already embedded in packaging workflows, creating pull-through for EDA and multiphysics vendors alongside new materials.", "quote": "We do a certain level of modeling to model the warpage beforehand, and then there’s certain levers you can pull to control the warpage", "locator": "Warpage as the enemy — Olmstead quote", "quote_verified": true}, {"claim": "If NTE materials work as planned, they represent another step toward enabling larger packages and panels — tying a materials-chemistry advance directly to the package-size scaling that advanced packaging roadmaps require.", "speaker": "Bryon Moyer", "type": "thesis", "entities": ["NTE materials", "panel-level packaging", "advanced packaging"], "conviction": "medium", "so_what": "Positions specialty filler chemistry as an enabler of the large-format packaging that AI compute economics depend on.", "quote": "If all works as planned, this may be yet another step toward enabling larger packages and panels.", "locator": "NTE materials debut, closing", "quote_verified": true}]}], "insight_total": 24, "top_entities": ["Mitsubishi Chemical Group", "Amkor", "Brewer Science", "Synopsys", "zirconium tungstate", "epoxy molding compound", "CTE", "warpage", "glass", "underfill"], "source_meta": {"author": "Bryon Moyer", "word_count": 2669, "paywalled": false}}, {"record_id": "fa231278a886160f", "source_type": "technology", "source_url": "https://semiengineering.com/why-package-digital-twins-are-so-hard-to-build/", "source_name": "Semiconductor Engineering", "title": "Why Package Digital Twins Are So Hard To Build", "published_date": "2026-09-17", "language": "en", "processed_at": "2026-09-18T11:10:46Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "Package digital twins are harder than fab process twins because they must span silicon, substrate, materials, assembly, test and system operation across multiple companies that each hold pieces of the data as intellectual property. The binding problems are missing context in supplier handoffs, material properties that drift with cure and temperature, non-separable coupled physics, and calibration that expires whenever the application moves outside the validated envelope — making continuous recalibration, not one-time accuracy, the measure of success.", "themes": [{"theme": "Why package twins differ from fab process twins", "insights": [{"claim": "A chiplet that is fully characterized, tested and considered known good gives no guarantee it will stay that way after placement into a different package, because a different substrate alters the mechanical and electrical environment, a different thermal interface changes how heat leaves, and a new power envelope changes how much heat must leave.", "speaker": "Gregory Haley", "type": "thesis", "entities": ["chiplets", "Synopsys", "Kenneth Larsen", "known good die", "heterogeneous integration"], "conviction": "high", "so_what": "Undermines the core chiplet reuse economics thesis — die-level qualification does not transfer across package contexts, adding hidden cost per SKU.", "quote": "The chiplet has not changed, but its electrical, thermal, and mechanical environment has.", "locator": "Opening — Larsen quote", "quote_verified": true}, {"claim": "A thermal path that worked in a first product can cause throttling in a second product built from the same chiplet, because the surrounding package and cooling assumptions have changed.", "speaker": "Gregory Haley", "type": "causal", "entities": ["chiplets", "thermal throttling", "packaging", "cooling"], "conviction": "high", "so_what": "Performance regressions from package reuse are a real product risk, which is why per-SKU thermal modeling spend is rising.", "quote": "A thermal path that worked in the first product can cause throttling in the second because the surrounding package and cooling assumptions have changed.", "locator": "Opening", "quote_verified": true}, {"claim": "The distinction is not that fab twins are easy and package twins are hard — a fab process twin is extremely complex, but it lives deep within one manufacturing environment, one process technology, and one managed flow of equipment, materials, process data and statistical learning.", "speaker": "Gregory Haley", "type": "framework", "entities": ["Synopsys", "Kenneth Larsen", "fab process twin", "digital twins"], "conviction": "high", "so_what": "Explains why front-end digital twin vendors' success does not translate directly into the packaging market — different problem structure, different buyers.", "quote": "A fab twin is usually deep within one manufacturing environment, one process technology, and one managed flow of equipment, materials, process data, and statistical learning.", "locator": "Fab vs. packaging: A different kind of twin", "quote_verified": true}, {"claim": "A package digital twin must solve a broader integration problem — how a multi-die system is realized across silicon, substrate, assembly, manufacturing variation, test and reliability learning — rather than model one process deeply.", "speaker": "Gregory Haley", "type": "framework", "entities": ["Synopsys", "Kenneth Larsen", "multi-die systems", "digital twins"], "conviction": "high", "so_what": "Defines the scope a credible package twin product must cover, a useful filter for evaluating EDA and PLM vendor claims.", "quote": "A package digital twin has to solve a broader integration problem — how a multi-die system is realized across silicon, substrate, assembly, manufacturing variation, test, and reliability learning.", "locator": "Fab vs. packaging: A different kind of twin", "quote_verified": true}, {"claim": "Effective domain tools for electrical, thermal and mechanical behavior do not become a package twin simply by running next to one another; the harder problem is keeping them synchronized around the same physical package as it moves from design to manufacturing.", "speaker": "Gregory Haley", "type": "contrarian", "entities": ["multiphysics simulation", "Synopsys", "digital twins", "EDA"], "conviction": "high", "so_what": "Vendors bundling existing point tools are not delivering a twin — synchronization and data plumbing is the differentiated hard part.", "quote": "Engineers already have effective tools for each of those domains, but they don’t become a package twin simply by running next to one another.", "locator": "Fab vs. packaging: A different kind of twin", "quote_verified": true}, {"claim": "If package, silicon, substrate, materials, thermal solution and manufacturing assumptions are optimized separately, the digital twin degenerates into a late-stage validation artifact, which is not where the value is.", "speaker": "Gregory Haley", "type": "thesis", "entities": ["Synopsys", "Kenneth Larsen", "digital twins", "co-optimization"], "conviction": "high", "so_what": "The ROI case for package twins depends on early co-optimization adoption, not on adding another sign-off checkpoint.", "quote": "If they are optimized separately, the digital twin becomes a late-stage validation artifact. That is not where the value is.", "locator": "Fab vs. packaging: A different kind of twin", "quote_verified": true}, {"claim": "An end-to-end package digital twin requires visibility across the entire lifecycle from wafer fabrication through assembly, test and ultimately system operation, because key process information originates upstream in foundry operations or downstream in customer applications.", "speaker": "Gregory Haley", "type": "framework", "entities": ["Amkor", "Joon Ahn", "foundry", "OSAT", "digital thread"], "conviction": "high", "so_what": "The required data span crosses at least three company boundaries, making the twin an ecosystem governance problem as much as a software one.", "quote": "An end-to-end package digital twin requires visibility across the entire lifecycle, from wafer fabrication through assembly, test, and ultimately system operation", "locator": "Fab vs. packaging: A different kind of twin — Ahn quote", "quote_verified": true}]}, {"theme": "The data hole: missing context across company boundaries", "insights": [{"claim": "For OSATs an end-to-end digital twin is not a single model but a connected ecosystem of process, equipment, production, supply chain and traceability data, and even equipment inside the same manufacturing flow may provide different types of data depending on its age and supplier.", "speaker": "Gregory Haley", "type": "framework", "entities": ["Amkor", "Joon Ahn", "OSATs", "traceability"], "conviction": "high", "so_what": "Heterogeneous installed tool fleets mean data normalization is a persistent operating cost for OSATs, favoring larger players who can fund it.", "quote": "For OSATs, an end-to-end digital twin is not a single model, but a connected ecosystem of process, equipment, production, supply chain, and traceability data", "locator": "The data hole — Ahn quote", "quote_verified": true}, {"claim": "What an OSAT actually receives falls short of what a predictive model needs: incoming die data may include critical dimensions and wafer-sort results but not detailed power-density or local stress maps, a substrate may arrive within nominal specifications without showing actual warpage across the production lot, and material data sheets may not capture behavior in the end device.", "speaker": "Gregory Haley", "type": "data_point", "entities": ["OSATs", "wafer sort", "warpage", "substrate suppliers", "Amkor"], "conviction": "high", "so_what": "Names the exact data gaps that would have to be closed contractually before package twins can be predictive rather than descriptive.", "quote": "A substrate may arrive within nominal specifications without showing actual warpage across the production lot", "locator": "The data hole", "quote_verified": true}, {"claim": "Downstream analysis can look precise while missing manufacturing reality, because what is missing is not just more data but the context telling the next tool or team how the data should be used.", "speaker": "Gregory Haley", "type": "contrarian", "entities": ["Synopsys", "Kenneth Larsen", "simulation", "manufacturing data"], "conviction": "high", "so_what": "Precision without provenance is a false-confidence trap — a reason to discount vendor accuracy claims that do not address context transfer.", "quote": "The downstream analysis can then look precise while missing the manufacturing reality", "locator": "The data hole — Larsen quote", "quote_verified": true}, {"claim": "The hardest handoffs are not where there is least data but where data must move between very different engineering domains — a foundry describing die behavior one way, a substrate supplier another, and a materials company providing properties measured under a very specific set of conditions.", "speaker": "Gregory Haley", "type": "contrarian", "entities": ["ASE", "CP Hung", "foundry", "substrate suppliers", "materials suppliers"], "conviction": "high", "so_what": "Redirects investment from data collection to semantic translation between domains, a different and less commoditized capability.", "quote": "The hardest handoffs aren’t necessarily where we have the least data. They’re usually where the data has to move between very different engineering domains", "locator": "The data hole — Hung quote", "quote_verified": true}, {"claim": "Much of the knowledge needed for a package twin is intellectual property held by separate companies — the material supplier knows chemistry the equipment company does not, and the equipment company knows process integration details unavailable to the OSAT or fab.", "speaker": "Gregory Haley", "type": "causal", "entities": ["Mitsubishi Chemical Group", "Sanjiv Bhatt", "OSAT", "equipment vendors", "IP"], "conviction": "high", "so_what": "IP protection is a structural, not technical, barrier — implying either consortium-style data agreements or vendor-neutral intermediaries become necessary.", "quote": "We all have our own data and everybody wants to protect intellectual property", "locator": "The data hole — Bhatt quote", "quote_verified": true}, {"claim": "The industry was formerly more open in how it collaborated as an ecosystem, and that shift toward guarded data is now a drag on building package twins.", "speaker": "Gregory Haley", "type": "anecdote", "entities": ["Mitsubishi Chemical Group", "Sanjiv Bhatt", "industry collaboration"], "conviction": "medium", "so_what": "Suggests the bottleneck could ease through commercial norms shifting rather than new technology — a slower but real catalyst to watch.", "quote": "I’ve been in this industry all my life, and when we started we had a different way of collaborating. We were a lot more open as an industry, as an ecosystem.", "locator": "The data hole — Bhatt quote", "quote_verified": true}, {"claim": "A common file format can move information between tools but cannot supply process data that was never shared, a material property that was never characterized, or an upstream excursion never attached to the incoming die — meaning the model can be incomplete before the first coupled simulation runs.", "speaker": "Gregory Haley", "type": "contrarian", "entities": ["standards", "file formats", "digital twins", "OSATs"], "conviction": "high", "so_what": "Tempers expectations for standards-driven solutions to the packaging data problem; format standardization is necessary but far from sufficient.", "quote": "A common file format can help move information between tools, but it can’t provide process data that was never shared", "locator": "The data hole", "quote_verified": true}]}, {"theme": "As-drawn versus as-manufactured: process variation defeats idealized models", "insights": [{"claim": "Photonic devices are typically designed and optimized using idealized geometries while manufactured devices are governed by process-induced variability, so a design optimized for the as-drawn geometry often does not represent the as-manufactured device.", "speaker": "Gregory Haley", "type": "thesis", "entities": ["Silvaco", "Eric Guichard", "photonics", "TCAD", "photonic integrated circuit"], "conviction": "high", "so_what": "Explains why silicon photonics struggles to move from lab demos to high-volume manufacturing — a recurring risk for optical interconnect roadmaps.", "quote": "The biggest disconnect is that photonic devices are typically designed and optimized using idealized geometries, while manufactured devices are governed by process-induced variability", "locator": "Manufacturing gets a vote — Guichard quote", "quote_verified": true}, {"claim": "In photonics, critical dimensions, film thickness or sidewall profile can shift enough during processing to change optical loss or wavelength response without anything being obviously broken.", "speaker": "Gregory Haley", "type": "causal", "entities": ["photonics", "Silvaco", "critical dimensions", "optical loss"], "conviction": "high", "so_what": "Silent parametric degradation makes photonics yield harder to detect and fix than digital logic yield, raising qualification cost.", "quote": "Critical dimensions, film thickness, or sidewall profile can move enough during processing to change optical loss or wavelength response without anything being obviously “broken.”", "locator": "Manufacturing gets a vote", "quote_verified": true}, {"claim": "Fine process details such as humidity levels, changes in cleaning chemistry concentration, or a slight under-etch must become explicit model inputs if they change performance.", "speaker": "Gregory Haley", "type": "framework", "entities": ["process variation", "digital twins", "under-etch", "cleaning chemistry"], "conviction": "medium", "so_what": "The input space for a credible package twin expands into fab housekeeping variables, which vastly increases required instrumentation.", "quote": null, "locator": "Manufacturing gets a vote", "quote_verified": false}, {"claim": "ASIC design tools set an expectation that simulation output closely matches the software model, but that correlation breaks down for technologies that lack comparable lifetime and qualification history or that push the bleeding edge, where subtleties can have massive impacts.", "speaker": "Gregory Haley", "type": "causal", "entities": ["NLM Photonics", "Brad Booth", "ASIC design tools", "simulation"], "conviction": "high", "so_what": "Explains why simulation-first design economics do not transfer to novel packaging and photonics — physical build cycles remain mandatory and costly.", "quote": "Subtle nuances don’t show up in the model", "locator": "Manufacturing gets a vote — Booth quote", "quote_verified": true}, {"claim": "Introducing any new material explodes the number of knobs and dials, because engineers must know how the material performs across many different environments and what its variance is over its lifetime.", "speaker": "Gregory Haley", "type": "causal", "entities": ["NLM Photonics", "Brad Booth", "new materials", "modeling"], "conviction": "high", "so_what": "Quantifies the hidden qualification tax on novel packaging materials, which slows adoption regardless of the material's headline properties.", "quote": "When you introduce any new material into that, it just explodes the number of knobs and dials", "locator": "Manufacturing gets a vote — Booth quote", "quote_verified": true}]}, {"theme": "Material properties as moving targets, not datasheet constants", "insights": [{"claim": "A datasheet gives only a snapshot of CTE, modulus, adhesion and viscosity measured under one set of conditions at one point in time, while mechanical and thermal properties shift with the degree of curing and crosslink density may continue to evolve after processing.", "speaker": "Gregory Haley", "type": "data_point", "entities": ["Brewer Science", "Hanlin Chen", "CTE", "crosslink density", "curing"], "conviction": "high", "so_what": "Datasheet-driven simulation systematically misrepresents materials, which is the root of documented simulation-to-silicon gaps.", "quote": "A datasheet gives you a snapshot — CTE, modulus, adhesion, viscosity, measured under one set of conditions at one point in time", "locator": "Manufacturing gets a vote — Chen quote", "quote_verified": true}, {"claim": "CTE varies particularly in the temperature region near a polymer's glass transition temperature, and treating any of these properties as a single static number causes a lot of simulation-to-silicon gaps.", "speaker": "Gregory Haley", "type": "causal", "entities": ["Brewer Science", "Hanlin Chen", "glass transition temperature", "CTE", "polymers"], "conviction": "high", "so_what": "Names the specific physics region where package models break, guiding where characterization investment actually pays off.", "quote": "Treating any of these as a single static number causes a lot of simulation-to-silicon gaps.", "locator": "Manufacturing gets a vote — Chen quote", "quote_verified": true}, {"claim": "Adhesion strength depends heavily on the specific bonding interface, so a material value that was accurate when a model was built can become less representative after cure, thermal exposure or assembly even when the material name and formulation have not changed.", "speaker": "Gregory Haley", "type": "causal", "entities": ["Brewer Science", "Hanlin Chen", "adhesion", "bonding interface"], "conviction": "high", "so_what": "Model validity decays through the process flow itself, requiring versioned material data rather than a static library.", "quote": "Crosslink density may continue to evolve after processing, and adhesion strength depends heavily on the specific bonding interface.", "locator": "Manufacturing gets a vote — Chen quote", "quote_verified": true}]}, {"theme": "Coupled physics and the interface standardization gap", "insights": [{"claim": "Engineers may model thermal, mechanical and electrical behavior separately for expediency, but the physical package does not respect those boundaries — current creates heat, heat changes resistance, electrical changes alter dissipated power, and the new power distribution changes the thermal picture again, forcing iteration until results converge.", "speaker": "Gregory Haley", "type": "framework", "entities": ["multiphysics simulation", "digital twins", "thermal modeling", "power delivery"], "conviction": "high", "so_what": "Coupled-loop convergence is a compute-intensive requirement that raises the cost and runtime of package sign-off, benefiting multiphysics tool vendors.", "quote": "Current creates heat, heat changes resistance, and those electrical changes alter the power being dissipated.", "locator": "When one problem becomes another", "quote_verified": true}, {"claim": "Process variables rarely act independently, and yield is often limited by the combined and nonlinear interaction of multiple process variations rather than by any single variation.", "speaker": "Gregory Haley", "type": "causal", "entities": ["Silvaco", "Eric Guichard", "yield", "process variation"], "conviction": "high", "so_what": "Nonlinear interaction means yield improvement cannot be decomposed into independent fixes — a driver of statistical, multi-variable modeling tools.", "quote": "Yield is often limited by the combined and nonlinear interaction of multiple process variations.", "locator": "When one problem becomes another — Guichard quote", "quote_verified": true}, {"claim": "The least-standardized models are at the interfaces rather than in the isolated physics domains, in the difficult areas where materials, structures, processes, suppliers and system-level decisions meet.", "speaker": "Gregory Haley", "type": "thesis", "entities": ["Synopsys", "Kenneth Larsen", "standardization", "interfaces"], "conviction": "high", "so_what": "Points standards bodies and tool vendors at interface assumptions as the highest-value unsolved area in packaging modeling.", "quote": "The least-standardized models are often at the interfaces, not in the isolated physics domains", "locator": "When one problem becomes another — Larsen quote", "quote_verified": true}, {"claim": "A substrate supplier and an assembly house can both hold technically valid models that describe different parts of the same physical behavior under different assumptions, so the failure is not that either model is wrong but that they do not mesh into a common representation of the package.", "speaker": "Gregory Haley", "type": "framework", "entities": ["substrate suppliers", "OSAT", "modeling", "Synopsys"], "conviction": "high", "so_what": "Reconciliation of valid-but-incompatible models is a distinct product opportunity separate from building better physics solvers.", "quote": null, "locator": "When one problem becomes another", "quote_verified": false}]}, {"theme": "Calibration as a continuous process with expiry", "insights": [{"claim": "In Intel's hybrid-bonding work, experimental distortion data is fed back into the finite-element model so engineers can refine it and then use it to explore changes that would be impractical to test experimentally.", "speaker": "Gregory Haley", "type": "anecdote", "entities": ["Intel", "hybrid bonding", "finite-element model", "distortion"], "conviction": "high", "so_what": "A working template for measurement-fed model refinement in the most demanding advanced packaging process now moving toward volume.", "quote": "Experimental distortion data is fed back into the finite-element model, which engineers can then refine before using it to explore changes that would be impractical to test experimentally.", "locator": "Calibration never ends", "quote_verified": true}, {"claim": "The answer is not to measure everything at every step but to measure at the points where the package changes state — transitions including bonding, molding, curing, thinning and thermal transitions.", "speaker": "Gregory Haley", "type": "framework", "entities": ["ASE", "CP Hung", "metrology", "bonding", "molding", "curing"], "conviction": "high", "so_what": "A metrology placement heuristic that defines where inspection spend in advanced packaging lines will concentrate.", "quote": "It’s really about measuring at the points where the package changes state", "locator": "Calibration never ends — Hung quote", "quote_verified": true}, {"claim": "Warpage is the obvious calibration measurement for a package model but is not enough; the calibration set has to include bump and interconnect metrology, die placement, substrate characterization, underfill/mold/TIM measurements, thermal characterization and electrical testing.", "speaker": "Gregory Haley", "type": "data_point", "entities": ["Amkor", "Joon Ahn", "warpage", "TIM", "interconnect metrology"], "conviction": "high", "so_what": "Enumerates the full metrology basket a package twin demands — a direct read on advanced packaging inspection equipment demand.", "quote": "For a package model, warpage is the obvious measurement, but it is not enough", "locator": "Calibration never ends — Ahn quote", "quote_verified": true}, {"claim": "Model development and physical development cannot be separated when the technology is new — the twin has to be built at the same time as the devices, in lockstep, because a digital twin cannot be called accurate until a part has actually been built and correlated.", "speaker": "Gregory Haley", "type": "thesis", "entities": ["NLM Photonics", "Brad Booth", "digital twins", "correlation"], "conviction": "high", "so_what": "Kills the hope that twins reduce prototype builds for emerging technology; they add parallel effort before they save any.", "quote": "You’ve got to build that twin at the same time you’re building the devices, so you have some correlation", "locator": "Calibration never ends — Booth quote", "quote_verified": true}, {"claim": "There is no fixed recalibration interval — it is driven by how far the new application sits from the conditions of the original model, with a new package architecture, a different substrate, a shift in thermal budget or a change in process flow all capable of moving a material outside its validated envelope.", "speaker": "Gregory Haley", "type": "framework", "entities": ["Brewer Science", "Hanlin Chen", "recalibration", "validated envelope"], "conviction": "high", "so_what": "Recalibration becomes a recurring, application-triggered service revenue stream for materials suppliers rather than a scheduled cost.", "quote": "There’s no fixed interval; it’s driven by how far the new application sits from the conditions of the original model", "locator": "Calibration never ends — Chen quote", "quote_verified": true}, {"claim": "Reduced-order and AI surrogate models gain speed by using a simplified representation, and without the context of the conditions under which they remain trustworthy, a fast model becomes a fast way to make the wrong decision.", "speaker": "Gregory Haley", "type": "contrarian", "entities": ["Synopsys", "Kenneth Larsen", "AI surrogate models", "reduced-order models"], "conviction": "high", "so_what": "A direct caution on AI-accelerated simulation in packaging — validity metadata, not model speed, is the differentiator worth paying for.", "quote": "Without that context, a fast model can become a fast way to make the wrong decision", "locator": "Calibration never ends — Larsen quote", "quote_verified": true}, {"claim": "In advanced packaging there may never be a point when everything is completely known, because components come from different suppliers, materials change during processing, and assembly introduces new stresses and interactions — so the twin must evolve with the package or become a precise model of something that no longer exists.", "speaker": "Gregory Haley", "type": "thesis", "entities": ["advanced packaging", "digital twins", "suppliers", "assembly"], "conviction": "high", "so_what": "Frames package twins as a subscription-like ongoing capability rather than a deliverable, reshaping how the software should be priced and staffed.", "quote": "The twin has to evolve along with the package or risk becoming a precise model of something that no longer exists.", "locator": "Conclusion: Keeping the twin attached to reality", "quote_verified": true}, {"claim": "The real measure of success is not predicting the physical package perfectly once, but remaining useful as the physical package changes — with the built package improving the model and the model letting teams ask what will change before committing to the next design, package stack or product SKU.", "speaker": "Gregory Haley", "type": "framework", "entities": ["Synopsys", "Kenneth Larsen", "digital twins", "product SKU"], "conviction": "high", "so_what": "Supplies the evaluation criterion buyers should apply to package twin offerings, replacing one-shot accuracy benchmarks.", "quote": "A useful package twin is not just a simulation sitting next to the hardware", "locator": "Conclusion: Keeping the twin attached to reality", "quote_verified": true}]}], "insight_total": 34, "top_entities": ["Synopsys", "Amkor", "ASE", "Silvaco", "Brewer Science", "Mitsubishi Chemical Group", "NLM Photonics", "Intel", "chiplets", "hybrid bonding", "photonics", "OSATs"], "source_meta": {"author": "Gregory Haley", "word_count": 3648, "paywalled": false}}, {"record_id": "5e330e35b6d04f0b", "source_type": "technology", "source_name": "SemiWiki", "source_url": "https://semiwiki.com/podcast/podcast-ep366-how-cognichip-is-changing-chip-design-with-faraj-aalaei/", "title": "Podcast EP366: How Cognichip is Changing Chip Design with Faraj Aalaei - Semiwiki", "published_date": "2026-09-16", "language": "en", "processed_at": "2026-09-18T11:14:23Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "In a SemiWiki podcast, Cognichip CEO Faraj Aalaei argues custom AI chips must be developed far faster to keep up with AI deployment, and that today's AI-assisted hardware design falls short because the models do not understand chip physics. Cognichip is building AI that solves design problems at designer-level cognitive ability, positioned as the industry's first full-stack intelligence infrastructure for chip design.", "themes": [{"theme": "AI chip supply as the constraint on AI deployment", "insights": [{"claim": "Cognichip CEO Faraj Aalaei argues there is a critical need to develop custom enabling AI chips faster in order to keep pace with the ever-growing demand created by AI deployment.", "speaker": "Daniel Nenni", "type": "thesis", "entities": ["Cognichip", "Faraj Aalaei", "AI chips", "custom silicon"], "conviction": "high", "so_what": "If chip design cycle time is the bottleneck on AI buildout, tools that compress design schedules capture outsized value.", "quote": "Daniel explores the growing impact of AI deployment with Faraj, who discusses the critical need to develop custom enabling AI chips faster to keep pace with ever-growing need.", "locator": "podcast summary", "quote_verified": true}]}, {"theme": "Limits of today's AI-assisted design", "insights": [{"claim": "Current AI-assisted hardware design has real shortcomings, chiefly that today's models do not understand the physics of chip design.", "speaker": "Daniel Nenni", "type": "contrarian", "entities": ["AI-assisted design", "EDA", "Faraj Aalaei"], "conviction": "high", "so_what": "It implies generic LLM copilots bolted onto EDA flows are insufficient, favoring physics-aware model builders over prompt wrappers.", "quote": "Faraj discusses the shortcomings of AI-assisted hardware design today and describes the need for AI models that understand the physics of chip design.", "locator": "podcast summary", "quote_verified": true}, {"claim": "Cognichip is developing a type of AI intended to learn, understand and solve design problems at designer-level cognitive abilities rather than merely assist a human designer.", "speaker": "Daniel Nenni", "type": "thesis", "entities": ["Cognichip", "AI", "chip design"], "conviction": "medium", "so_what": "Designer-level autonomy, if achieved, would change EDA pricing from seat licenses toward outcome or capacity-based models.", "quote": "Cognichip to develop a type of AI that learns, understands, and solves design problems at designer-level cognitive abilities", "locator": "podcast summary", "quote_verified": true}]}, {"theme": "Full-stack intelligence infrastructure positioning", "insights": [{"claim": "Cognichip is deploying its technology as what is described as the industry's first full-stack intelligence infrastructure for chip design.", "speaker": "Daniel Nenni", "type": "framework", "entities": ["Cognichip", "chip design", "EDA"], "conviction": "medium", "so_what": "A full-stack infrastructure claim positions the startup as a platform layer competing with, not selling into, incumbent EDA vendors.", "quote": "He explains that this technology is being deployed as the industry’s first full-stack intelligence infrastructure for chip design.", "locator": "podcast summary", "quote_verified": true}, {"claim": "Cognichip is led by Faraj Aalaei, an entrepreneur with over 40 years in communications and networking technologies who founded and led two semiconductor companies through IPOs as CEO.", "speaker": "Daniel Nenni", "type": "anecdote", "entities": ["Faraj Aalaei", "Cognichip", "Silicon Valley"], "conviction": "high", "so_what": "A two-time semiconductor IPO founder at the helm raises the odds of institutional funding and credible customer access.", "quote": "he was responsible for building and leading two semiconductor companies through IPOs as a founder and CEO", "locator": "guest introduction", "quote_verified": true}]}], "insight_total": 5, "top_entities": ["Cognichip", "Faraj Aalaei", "Daniel Nenni", "chip design", "AI", "EDA", "semiconductor"], "source_meta": {"author": "Daniel Nenni", "word_count": 247, "paywalled": false}}, {"record_id": "a3d7c8790fecc7b6", "source_type": "technology", "source_name": "SemiWiki", "source_url": "https://semiwiki.com/semiconductor-manufacturers/intel/373593-asml-has-high-na-and-chipmakers-cant-say-no/", "title": "ASML Has High-NA and Chipmakers Can’t Say No - Semiwiki", "published_date": "2026-09-17", "language": "en", "processed_at": "2026-09-18T11:14:23Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI", "Geopolitics"], "gist": "ASML's High-NA EUV (NA 0.55, ~$400M per tool, ~40% smaller features) has crossed from Intel-only bet to broad industry commitment, with Intel already running 18A/Panther Lake layers at NXE-matching yields and over one million wafers processed, Samsung and SK Hynix targeting DRAM by 2028 and TSMC by 2030. Half-field anamorphic optics still handicap very large AI accelerator dies until a larger photomask platform reaches volume readiness in 2033, while EUV slots are nearly sold out through 2027.", "themes": [{"theme": "High-NA EUV adoption tipping point", "insights": [{"claim": "ASML is winning broad industry support for High Numerical Aperture EUV lithography, its next-generation tool for printing smaller and denser circuitry, on top of an existing monopoly in conventional EUV systems.", "speaker": "Daniel Nenni", "type": "thesis", "entities": ["ASML", "High NA EUV", "EUV lithography"], "conviction": "high", "so_what": "A second monopoly generation extends ASML's pricing power and visibility well into the 2030s.", "quote": "ASML’s grip on the most advanced corner of chip manufacturing is tightening.", "locator": "opening paragraph", "quote_verified": true}, {"claim": "High NA EUV machines cost roughly $400 million each, about twice the price of conventional EUV systems, so adoption hinges on chipmakers believing the tools improve yields, cut process steps and stay useful across several processor generations.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["ASML", "High NA EUV"], "conviction": "high", "so_what": "Each tool sale is a large, lumpy revenue event whose timing depends on customer conviction, not just capacity needs.", "quote": "High NA machines cost roughly $400 million each, about twice as much as conventional EUV systems.", "locator": "paragraph on cost and adoption", "quote_verified": true}, {"claim": "Raising the numerical aperture of the optical system from 0.33 to 0.55 enables features about 40% smaller than current EUV tools can print, letting a single exposure replace multiple patterning steps.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["ASML", "High NA EUV", "multi-patterning"], "conviction": "high", "so_what": "Step reduction is the economic argument that offsets the $400M sticker price and pressures multi-patterning-related process spend.", "quote": "High NA raises the numerical aperture of the optical system from 0.33 to 0.55, enabling features about 40% smaller than those produced by current EUV tools.", "locator": "High NA resolution paragraph", "quote_verified": true}, {"claim": "Replacing multiple patterning steps with one exposure simplifies manufacturing and potentially reduces defects, which is how High NA is expected to sustain transistor scaling as older techniques grow more complicated and expensive.", "speaker": "Daniel Nenni", "type": "causal", "entities": ["ASML", "High NA EUV", "transistor scaling"], "conviction": "medium", "so_what": "The scaling-continuation case supports the entire advanced-node capex cycle, not just litho vendors.", "quote": null, "locator": "High NA resolution paragraph", "quote_verified": false}]}, {"theme": "Intel's first-mover validation", "insights": [{"claim": "Intel Foundry began using High NA EUV on selected layers of its 18A process for Panther Lake processors, making it the first company to ship a high-volume logic product built with the technology.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["Intel", "Intel Foundry", "18A", "Panther Lake", "ASML", "High NA EUV"], "conviction": "high", "so_what": "Intel converts an expensive early bet into a credibility asset it can sell to external foundry customers.", "quote": "ASML said Intel Foundry had begun using High NA on selected layers of its 18A process for Panther Lake processors, making it the first company to ship a high-volume logic product made with the technology.", "locator": "Intel early lead paragraph", "quote_verified": true}, {"claim": "The High NA-patterned layers at Intel achieved yields matching Intel's established NXE platform, providing real-world validation beyond laboratory demonstrations.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["Intel", "ASML", "NXE", "High NA EUV"], "conviction": "high", "so_what": "Yield parity removes the main technical objection that had kept cautious buyers on the sidelines.", "quote": "The selected layers achieved yields matching Intel’s established NXE platform, giving ASML an important real-world validation beyond laboratory demonstrations.", "locator": "Intel early lead paragraph", "quote_verified": true}, {"claim": "Intel has processed more than one million wafers with High NA systems across research, qualification and production runs.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["Intel", "High NA EUV", "ASML"], "conviction": "high", "so_what": "Learning-curve data of that scale is a durable competitive moat for Intel Foundry against later adopters.", "quote": "Intel has since processed more than one million wafers with High NA systems, including research, qualification and production runs.", "locator": "Intel early lead paragraph", "quote_verified": true}]}, {"theme": "Customer adoption timelines and memory pull-in", "insights": [{"claim": "Samsung plans to introduce High NA EUV into high-volume DRAM manufacturing by 2028, and SK Hynix is targeting memory production around the same period.", "speaker": "Daniel Nenni", "type": "prediction", "entities": ["Samsung", "SK Hynix", "DRAM", "High NA EUV"], "conviction": "medium", "so_what": "Memory, not just logic, becomes a High NA demand pool, widening ASML's 2028 order book.", "quote": "Samsung plans to introduce High NA into high-volume DRAM manufacturing by 2028, while SK Hynix is also targeting memory production around that period.", "locator": "customer timelines paragraph", "quote_verified": true}, {"claim": "TSMC, which had questioned whether High NA's cost justified early adoption, now expects to deploy the technology by 2030.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["TSMC", "ASML", "High NA EUV"], "conviction": "medium", "so_what": "The most cost-disciplined foundry capitulating signals the tool is inevitable rather than optional.", "quote": "TSMC, which had questioned whether the technology’s cost justified early adoption, now expects to deploy it by 2030.", "locator": "customer timelines paragraph", "quote_verified": true}, {"claim": "Commitments from Intel, Samsung, TSMC and SK Hynix collectively reduce the risk that High NA remains a niche tool tied mainly to Intel's roadmap.", "speaker": "Daniel Nenni", "type": "thesis", "entities": ["Intel", "Samsung", "TSMC", "SK Hynix", "ASML"], "conviction": "high", "so_what": "Diversified demand de-risks ASML's EXE revenue ramp from single-customer execution risk at Intel.", "quote": "These schedules vary, but collectively they reduce the risk that High NA becomes a niche tool tied mainly to Intel’s roadmap.", "locator": "customer timelines paragraph", "quote_verified": true}]}, {"theme": "Monopoly economics and competitive moat", "insights": [{"claim": "ASML held about 94% of the lithography market in 2025 and has no commercial rival in EUV, while Nikon and Canon remain active only in older lithography categories.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["ASML", "Nikon", "Canon", "lithography"], "conviction": "high", "so_what": "Near-total share means litho capex forecasts translate almost one-for-one into ASML revenue.", "quote": "ASML held about 94% of the lithography market in 2025 and has no commercial rival in EUV.", "locator": "competitive position paragraph", "quote_verified": true}, {"claim": "Replicating ASML's ecosystem of precision optics, powerful light sources, software and thousands of specialized components would require enormous capital and years of coordinated development, which is why Chinese suppliers working to close the gap remain behind.", "speaker": "Daniel Nenni", "type": "causal", "entities": ["ASML", "China", "Carl Zeiss", "EUV"], "conviction": "high", "so_what": "The moat is supply-chain coordination, not a single patent, so export controls bite harder and substitution timelines stay long.", "quote": null, "locator": "competitive position paragraph", "quote_verified": false}, {"claim": "Every customer adoption decision deepens ASML's installed base, service revenue and strategic importance, so early commitments secure access and influence over manufacturing technology for the 2030s.", "speaker": "Daniel Nenni", "type": "thesis", "entities": ["ASML", "High NA EUV"], "conviction": "high", "so_what": "Recurring service revenue on a growing installed base smooths the cyclicality of tool shipments.", "quote": "For ASML, every adoption decision deepens its installed base, service revenue and strategic importance.", "locator": "bottom line", "quote_verified": true}]}, {"theme": "Technical compromises and field-size stitching", "insights": [{"claim": "High NA's anamorphic optics expose only half the field size of existing EUV systems, creating difficulties for very large AI accelerators and data-center chips that may need designs divided and exposures stitched together.", "speaker": "Daniel Nenni", "type": "contrarian", "entities": ["High NA EUV", "AI accelerators", "data-center chips", "ASML"], "conviction": "high", "so_what": "The largest, highest-value AI dies are precisely the hardest fit for High NA, delaying its revenue share in that segment.", "quote": "Its anamorphic optics expose only half the field size of existing EUV systems, creating difficulties for very large AI accelerators and data-center chips.", "locator": "compromises paragraph", "quote_verified"
