aise this broad usually means Q3 numbers get revised up before the quarter even starts.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bespokeinvest.substack.com/p/monster-quarter-morning-market-note"}, {"id": 60, "cat": "labor", "urgency": "act", "source": "Bespoke Investment Group", "title": "ADP whiffs at 44K vs 65K expected, keeping the soft-landing debate alive", "idea": "The July ADP payrolls report printed 44K versus consensus of 65K, a meaningful miss landing right before the ISM/S&P services PMIs, alongside the 10-year yield down 2bps to 4.60%.", "angle": "A weak ADP print into a market already chasing upside is the kind of divergence that can either validate rate-cut hopes or spook the soft-landing narrative.", "tweetA": "ADP just printed 44K vs 65K expected. Not a disaster, but it's the second soft labor data point this week landing into a market up 4 of the last 5 sessions on AI/earnings optimism. Yields ticking down 2bps to 4.60% on the print. Bulls will call it 'good news for cuts.'", "tweetB": "The real question with a 44K ADP miss: is this the labor market genuinely cooling, or just ADP's usual noise ahead of Friday's NFP? Bespoke didn't flinch on it, buried it under an earnings-season headline — that itself tells you where sentiment currently sits.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bespokeinvest.substack.com/p/monster-quarter-morning-market-note"}, {"id": 61, "cat": "macro", "urgency": "act", "source": "Bespoke Investment Group", "title": "China's July services PMI craters to 50.4, missing by 3+ points", "idea": "China's July PMI reading came in at 50.4, down sharply from 54.1 in June and far below the 53.7 consensus, even as Asian equities (Japan, Korea both +3.5%+) rallied on the US lead.", "angle": "A China PMI miss of this size sitting underneath a regional equity rally is a classic divergence worth flagging.", "tweetA": "China July services PMI: 50.4. Consensus was 53.7. Prior was 54.1. A 3.7-point miss and a 3.7-point sequential drop in one month — yet Hang Seng/Shanghai still rallied today on the US risk-on lead. Divergence between the data and the tape worth watching. $FXI $KWEB", "tweetB": "If China services activity is decelerating this fast (54.1→50.4 in a month, missing consensus by 3.7pts) while Japan and Korea rip 3.5%+ on AI hardware optimism, that's two very different Asia stories getting priced as one 'Asia up' headline.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bespokeinvest.substack.com/p/monster-quarter-morning-market-note"}, {"id": 62, "cat": "macro", "urgency": "deep", "source": "Bespoke Investment Group", "title": "Cross-asset tape says the 'everything rally' has a hedge underneath it", "idea": "Even as equities ran (Nasdaq +1%+ for a 4th day), gold rose 2.5%, the 10-year yield fell 2bps to 4.60%, and crude was only fractionally higher after two straight 5%+ daily declines — a mix that doesn't look like pure risk-on.", "angle": "Gold +2.5% and yields grinding lower alongside an equity melt-up is a cross-asset tell that real hedging demand persists beneath the 'chase' narrative.", "tweetA": "Nasdaq up 4 straight days, but gold is +2.5% and the 10yr is grinding to 4.60% on the SAME morning. That's not a clean risk-on tape — someone's still buying protection even as SPX chases new highs. $GLD $TLT", "tweetB": "Crude down two straight days by 5%+ each, now barely bouncing, while gold jumps 2.5% — that combination reads more like a growth-scare hedge unwinding into a relief rally than genuine reflation optimism.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bespokeinvest.substack.com/p/monster-quarter-morning-market-note"}, {"id": 63, "cat": "AI/infra", "urgency": "act", "source": "Salazar Slytherin / Crypto Integrated", "title": "Anthropic locks a $10B, 6-year compute deal routed through a Bitcoin miner", "idea": "Anthropic signed a $10B, 6-year compute deal with Nvidia-backed startup Volta, delivered in partnership with Bitcoin miner Bitdeer Technologies via a 133MW Norway data center running Nvidia's next-gen Vera Rubin chips.", "angle": "Bitcoin miners repurposing power contracts for AI compute deals is a recurring pattern; Bitdeer landing a $10B/6yr Anthropic-linked deal is fresh evidence for the 'miners as AI infra plays' thesis.", "tweetA": "Anthropic just signed a $10B, 6-year compute deal running through Bitdeer Technologies — yes, the Bitcoin miner — via a 133MW Norway data center on Nvidia's Vera Rubin chips. The bitcoin-miner-to-AI-datacenter pivot isn't a trade anymore, it's the default. $BTDR $NVDA", "tweetB": "$10B over 6 years for 133MW in Norway works out to roughly $75M per MW of committed spend — a useful benchmark for pricing the next miner-to-AI conversion deal that gets announced. Watch which miners still have stranded power capacity left to sell.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/ai-news-august-5-2026"}, {"id": 64, "cat": "crypto", "urgency": "act", "source": "Salazar Slytherin / Crypto Integrated", "title": "Western Union puts stablecoins into a $100B/year remittance flow", "idea": "Western Union's Stablecard went live via Rain, letting remittances arrive as stablecoins and be spent instantly anywhere Visa is accepted; Rain frames it as $100B/year across 100M customers moving onchain.", "angle": "A legacy remittance giant plugging directly into stablecoin rails is a bigger real-world-usage data point than another DeFi TVL number.", "tweetA": "Western Union's Stablecard is live via Rain: remittances now arrive as stablecoins, spendable instantly anywhere Visa works. Rain's own framing: $100B/year across 100M customers moving onchain. That's the actual remittance market switching rails. $WU", "tweetB": "The stablecoin bull case was always 'cheaper/faster cross-border payments,' and Western Union just handed it real distribution — 100M existing customers, no new user acquisition needed. Worth tracking how fast WU's own volume actually migrates vs. this being a side product.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/crypto-news-august-5-2026"}, {"id": 65, "cat": "crypto", "urgency": "watch", "source": "Salazar Slytherin / Crypto Integrated", "title": "Bittensor tries to stop root-yield subsidizing weak subnets", "idea": "Bittensor launched 'Root Reborn,' letting validators compete on subnet baskets so TAO root yield flows to the best-performing subnets instead of being spread via uniform selling pressure across all subnets.", "angle": "A structural tokenomics fix aimed at reducing TAO sell pressure from underperforming subnets.", "tweetA": "Bittensor's 'Root Reborn' lets validators compete on subnet baskets so root yield concentrates in the best-performing subnets instead of getting spread uniformly. If it works, it directly targets the mechanism blamed for TAO's chronic sell pressure. $TAO", "tweetB": "The interesting bet isn't the yield mechanic, it's whether validators actually converge on genuinely good subnets or just chase whichever basket is hot this week — same reflexivity problem as every 'smart' yield-routing design before it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/crypto-news-august-5-2026"}, {"id": 66, "cat": "crypto", "urgency": "watch", "source": "Salazar Slytherin / Crypto Integrated", "title": "Tokenized Treasuries land on BNB Chain with daily yield and instant redemption", "idea": "Ondo's USDY went live on BNB Chain with daily yield accrual and instant minting/redemption, integrated across 1inch, Ledger, LI.FI, CoW Protocol, Trust Wallet, and LayerZero, pitched explicitly at 'AI agents & hundreds of millions of wallets.'", "angle": "RWA tokenization keeps expanding distribution surface; the AI-agent framing signals issuers building for machine-to-machine payment rails.", "tweetA": "Ondo's USDY is now live on BNB Chain — daily yield accrual, instant mint/redeem, plugged into 1inch, Ledger, LI.FI, CoW, Trust Wallet and LayerZero simultaneously. Ondo's own pitch: this is infrastructure for 'AI agents,' not just wallets. $ONDO", "tweetB": "Every tokenized-treasury launch now name-checks 'AI agents' as the target user. Worth asking how much actual agent-driven USDY volume exists today versus this being forward-positioning language for a market that doesn't exist yet.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/crypto-news-august-5-2026"}, {"id": 67, "cat": "crypto", "urgency": "watch", "source": "Salazar Slytherin / Crypto Integrated", "title": "Aave users can now jump V3 to V4 in one transaction", "idea": "DeFiSaver launched the first Aave V3-to-V4 position migrator, letting users move full positions in a single transaction instead of manually unwinding and rebuilding, saving gas and execution risk.", "angle": "Frictionless migration tooling tends to accelerate TVL rotation into the newest version faster than organic adoption alone.", "tweetA": "DeFiSaver's new Aave V3→V4 migrator moves a full position in one transaction — no manual unwind, no multi-tx gas waste. Tooling like this is usually what actually moves TVL between versions, not the announcement of V4 itself. $AAVE", "tweetB": "The real tell for Aave V4 adoption speed won't be the launch headline — it'll be how fast this migrator's usage ramps versus users just staying on V3 out of inertia.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/crypto-news-august-5-2026"}, {"id": 68, "cat": "crypto", "urgency": "act", "source": "Salazar Slytherin / Crypto Integrated", "title": "BlackRock's ETH ETF cuts trading costs with a 1-for-3 reverse split", "idea": "BlackRock announced a 1-for-3 reverse share split for its spot Ethereum ETF ($ETHA), taking the price from roughly $14 to $42 in October and cutting trading costs from about 7bps to roughly 2bps, per Bloomberg's Eric Balchunas.", "angle": "A 5bp cost reduction on a major ETH ETF is a structural flow tailwind; narrower spreads typically pull in more institutional volume.", "tweetA": "BlackRock's doing a 1-for-3 reverse split on $ETHA, taking it from ~$14 to ~$42 in October — purely to cut trading costs from 7bps to ~2bps. Balchunas's point stands: ETF issuers treat a 7bp spread as a problem to engineer away, crypto exchanges treat worse spreads as normal.", "tweetB": "A 5bp round-trip cost cut sounds small until you annualize it across institutional rebalancing flows — this is the kind of unsexy structural change that quietly pulls incremental AUM into $ETHA over the next two quarters.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/crypto-news-august-5-2026"}, {"id": 69, "cat": "AI/infra", "urgency": "watch", "source": "Salazar Slytherin / Crypto Integrated", "title": "Cloudflare gives AI agents their own stablecoin wallets", "idea": "Cloudflare launched programmable 'Wallets,' letting accounts and their AI agents hold stablecoins and pay for APIs, MCP tools, and content directly (the launch post drew 1.79M views and 6.25K likes).", "angle": "Infrastructure-layer stablecoin wallets built for agent-to-agent payments is the 'AI economy needs its own money rails' thesis moving from theory to a live Cloudflare product.", "tweetA": "Cloudflare Wallets: stablecoins held by accounts AND their AI agents, spendable directly on APIs, MCP tools, and content. This is infrastructure-layer plumbing for machine-to-machine payments — not a crypto product, a Cloudflare product. $NET", "tweetB": "If AI agents start paying for MCP tool calls with stablecoins natively at the CDN layer, the interesting metric to watch isn't wallet count, it's per-call transaction volume — that's the number that tells you if agent commerce is real or a demo.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/crypto-news-august-5-2026"}, {"id": 70, "cat": "regulation", "urgency": "act", "source": "Salazar Slytherin / Crypto Integrated", "title": "SBF loses final appeals court fight, 25-year sentence stands", "idea": "The Second Circuit formally closed Sam Bankman-Fried's appeal, upholding all 7 FTX fraud convictions, the 25-year sentence, and the $11B forfeiture order, leaving only a Supreme Court petition as a remaining long-shot option.", "angle": "Closes the legal overhang on FTX's collapse definitively, relevant context for the 'crypto has cleaned up its act' narrative.", "tweetA": "Second Circuit just closed SBF's appeal for good: all 7 fraud convictions upheld, 25-year sentence stands, $11B forfeiture order intact. Only the Supreme Court is left, and that's a long shot. The FTX chapter is legally closed even if victim recovery isn't.", "tweetB": "Worth remembering while everyone's chasing stablecoin/RWA headlines this week: the last major legal loose end from the 2022 crypto blowup just got tied off. A clean legal slate is part of why institutional money feels comfortable coming back in.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/crypto-news-august-5-2026"}, {"id": 71, "cat": "regulation", "urgency": "watch", "source": "Salazar Slytherin / Crypto Integrated", "title": "Senators press SEC to probe Trump's own memecoin", "idea": "Senators Warren and Blumenthal are pushing SEC Chair Paul Atkins to investigate President Trump's $TRUMP memecoin for fraud and 'unjust enrichment,' a direct political-regulatory collision given Atkins's generally crypto-friendly SEC posture.", "angle": "A sitting president's memecoin facing a formal SEC investigation push is a genuine regulatory tail-risk headline for the broader memecoin/political-token complex.", "tweetA": "Warren and Blumenthal are formally pressing SEC Chair Paul Atkins to investigate Trump's own $TRUMP memecoin for fraud/unjust enrichment. Under a crypto-friendly SEC chair appointed by the same administration, this is more political theater than enforcement risk — but it's a headline that won't age quietly.", "tweetB": "The awkward position this puts Atkins in: a crypto-friendly SEC chair being asked to investigate the sitting president's own token. Whatever he does (or doesn't do) becomes the precedent cited next time a politically-connected memecoin draws scrutiny.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/crypto-news-august-5-2026"}, {"id": 72, "cat": "crypto", "urgency": "watch", "source": "Salazar Slytherin / Crypto Integrated", "title": "Polymarket eyes $20B valuation just months after its last raise", "idea": "Polymarket is reportedly in early talks to raise ~$1B at a $20B+ valuation, per Bloomberg, months after closing a $15B round with NYSE-owner ICE as a backer, with annualized revenue now said to have surpassed $1B.", "angle": "A 33%+ valuation step-up in months, paired with claimed $1B+ annualized revenue, is a concrete data point for how fast prediction markets are being priced by institutional investors.", "tweetA": "Polymarket is reportedly in talks to raise at $20B+, up from $15B just months ago — with annualized revenue said to have crossed $1B. That's a ~33% valuation step-up in a few months on a business that barely existed as an institutional category two years ago.", "tweetB": "If Polymarket's revenue run-rate really is >$1B annualized, a $20B valuation is ~20x revenue — rich, but not absurd next to other high-growth fintech comps. The real question is durability: is that revenue election-driven or structurally recurring?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/crypto-news-august-5-2026"}, {"id": 73, "cat": "crypto", "urgency": "watch", "source": "Salazar Slytherin / Crypto Integrated", "title": "Binance launches a no-liquidation BTC-backed loan for small borrowers", "idea": "Binance's new Lite Loan lets users borrow up to 1,000 USDT against BTC for 30 days with a fee (1%, promoted at 0.5%) and no LTV liquidation risk during the term.", "angle": "Removing liquidation risk on a short-dated BTC loan could pull retail leverage-seekers away from riskier LTV-liquidation products elsewhere.", "tweetA": "Binance's Lite Loan: borrow up to 1,000 USDT against BTC for 30 days, 0.5% promo fee, and — the actual hook — no price-triggered liquidation during the term. Removing liquidation risk on a small BTC-backed loan is a genuinely different retail product than the usual margin-call structure.", "tweetB": "A capped, no-liquidation BTC loan is basically Binance underwriting the 30-day volatility risk themselves in exchange for the fee. Worth watching whether they widen the cap once they've seen a full cycle of default/repayment data.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/crypto-news-august-5-2026"}, {"id": 74, "cat": "crypto", "urgency": "watch", "source": "Salazar Slytherin / Crypto Integrated", "title": "NEAR co-founder proposes a sovereign fund to cut reliance on inflation", "idea": "NEAR co-founder Illia Polosukhin proposed a 'NEAR Sovereign Fund' to hold treasury and protocol revenue, generate yield, and fund security, explicitly aimed at reducing the network's reliance on token inflation to pay for validator security.", "angle": "Another L1 following the 'wean off inflation, fund security with real yield' playbook, worth tracking against similar Ethereum and Solana disinflation moves the same week.", "tweetA": "NEAR's Illia Polosukhin just proposed a Sovereign Fund to hold treasury/revenue, generate yield, and fund validator security — explicitly to cut reliance on token inflation. Same week Ethereum's EIP-8361 and Solana's disinflation vote are doing the same thing. The 'wean off inflation' trend is now consensus across L1s.", "tweetB": "Three different L1s (NEAR, Ethereum, Solana) are independently proposing ways to fund security without inflation this same week. That's not coincidence, that's every major L1 treasury team reaching the same conclusion about token supply overhang at once.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/crypto-news-august-5-2026"}, {"id": 75, "cat": "crypto", "urgency": "act", "source": "Salazar Slytherin / Crypto Integrated", "title": "Boltz bridge stays dark indefinitely after AI-assisted attacks", "idea": "Non-custodial Bitcoin bridge Boltz will remain offline indefinitely following a surge in AI-assisted attacks on its infrastructure, though it maintains no user funds are at risk and refunds remain available cooperatively, and unilaterally if needed.", "angle": "One of the first explicit 'AI-assisted attack' disclosures from a DeFi protocol, a preview of the security-ops arms race AI tooling is bringing to smaller infra providers.", "tweetA": "Boltz (non-custodial BTC bridge) is staying offline indefinitely after a surge in AI-assisted attacks on its infra, no ETA given. No user funds at risk, they say, and refunds work unilaterally regardless of Boltz's own uptime. One of the first protocols to explicitly name 'AI-assisted' as the attack vector.", "tweetB": "Watch the language here: 'AI-assisted attacks' is becoming the new disclosure category for DeFi infra incidents. Expect more small/mid protocols to go dark rather than fight an automated, iterating adversary in real time.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/crypto-news-august-5-2026"}, {"id": 76, "cat": "crypto", "urgency": "deep", "source": "Salazar Slytherin / Crypto Integrated", "title": "CZ argues exchanges are statistically safer than self-custody — the data's messier than the tweet", "idea": "CZ claimed storing coins on exchanges is statistically safer than self-custody, citing River's 2025 report showing 1.57M BTC lost via self-custody versus 1.51M BTC lost on exchanges, a razor-thin ~4% gap that Willy Woo flagged as 'sobering.'", "angle": "A ~4% difference between self-custody and exchange losses is a weak basis for 'exchanges are safer' as a blanket claim, especially from an exchange founder.", "tweetA": "CZ: exchanges are statistically safer than self-custody. His source: River's data showing 1.57M BTC lost self-custody vs 1.51M BTC lost on exchanges. That's a 4% gap, not exactly a landslide case for 'not your keys, still fine.' Also: exchange-loss data is heavily survivorship-biased toward the exchanges still around to report it.", "tweetB": "The framing problem with CZ's stat: self-custody losses accumulate over 15 years of lost seed phrases and dead hard drives, exchange losses are concentrated hacks/failures (Mt Gox, FTX) at specific entities. Comparing cumulative totals isn't comparing risk rates.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/crypto-news-august-5-2026"}, {"id": 77, "cat": "crypto", "urgency": "watch", "source": "Salazar Slytherin / Crypto Integrated", "title": "BitGo standardizes WBTC cross-chain infra on Chainlink CCIP", "idea": "BitGo picked Chainlink's CCIP as its exclusive cross-chain infrastructure provider for WBTC, migrating away from its legacy solution to standardize WBTC and all future BitGo-issued assets on one interoperability layer.", "angle": "Another institutional custodian consolidating on Chainlink's CCIP as the default cross-chain rail.", "tweetA": "BitGo is moving WBTC (and all future BitGo-issued assets) exclusively onto Chainlink's CCIP, dropping its legacy cross-chain solution. Another institutional custodian defaulting to CCIP as the interoperability standard — the pattern is becoming hard to ignore. $LINK", "tweetB": "Worth tracking how many custodians have now standardized on CCIP specifically versus building or maintaining their own bridge infra — that consolidation trend matters more for LINK's long-term value accrual than any single announcement.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/crypto-news-august-5-2026"}, {"id": 78, "cat": "crypto", "urgency": "watch", "source": "Salazar Slytherin / Crypto Integrated", "title": "BNY adds staking to its institutional digital asset custody platform via Galaxy", "idea": "Galaxy and BNY Mellon are partnering to bring staking support to BNY's Digital Asset Custody platform, combining custody and staking into a single institutional servicing model.", "angle": "A top-tier TradFi custodian offering native staking is a meaningful institutional-adoption marker.", "tweetA": "BNY Mellon is adding staking support to its Digital Asset Custody platform via a Galaxy partnership — custody and staking now bundled in one institutional servicing model. This is the kind of plumbing upgrade that quietly precedes staking-yield products getting approved. $GLXY", "tweetB": "If a custodian the size of BNY is comfortable offering native staking, the remaining blocker for staking-enabled ETH/SOL ETFs looks a lot more like regulatory sign-off than operational readiness.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/crypto-news-august-5-2026"}, {"id": 79, "cat": "crypto", "urgency": "deep", "source": "Salazar Slytherin / Crypto Integrated", "title": "Base's stablecoin volume already blew past all of 2025 — with 5 months to go", "idea": "Base's 2026 stablecoin volume hit $26.1T with five months still left in the year, already surpassing 2025's full-year total of $17.5T.", "angle": "A concrete, verifiable on-chain volume number quantifying the stablecoin adoption curve on a specific L2.", "tweetA": "Base stablecoin volume: $26.1T so far in 2026, with 5 months still left. Full-year 2025 was $17.5T. Annualize the current pace and you're looking at something like $37-40T for the year, more than double 2025. This is the actual usage number behind the stablecoin hype cycle. $COIN", "tweetB": "$26.1T in stablecoin volume on a single L2 with a third of the year remaining is a bigger number than most people tracking 'crypto adoption' narratives realize. Worth comparing this against Visa/Mastercard's own annual settlement volume for scale.", "charts": {"count": 1, "hot": true, "desc": "Base's own tweet shows a 2025 ($17.5T) vs 2026 YTD ($26.1T) stablecoin volume bar comparison"}, "link": "https://www.cryptointegrat.com/p/crypto-news-august-5-2026"}, {"id": 80, "cat": "crypto", "urgency": "watch", "source": "Salazar Slytherin / Crypto Integrated", "title": "Solana's disinflation vote clears first hurdle, targeting ~$1.4B in cut emissions", "idea": "Solana's proposal to double its disinflation rate cleared the initial governance vote and moves to discussion ahead of a final vote; if approved, it would cut emissions by an estimated 18.9M SOL, roughly $1.39B, over six years.", "angle": "A concrete, quantified supply-reduction proposal clearing its first governance gate is a real tokenomics catalyst.", "tweetA": "Solana's disinflation-doubling proposal cleared its first governance vote: if it passes final vote, it cuts emissions by ~18.9M SOL (~$1.39B at current prices) over six years. That's a real, quantified supply reduction, not just a 'SOL is deflationary now' vibe. $SOL", "tweetB": "Compare this to Ethereum's EIP-8361 landing the same week (targeting near-zero yield above 50% staked): both are separately arriving at 'we're paying too much for security, let's cut it,' just with different mechanisms. Watch which chain gets its vote through first.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/crypto-news-august-5-2026"}, {"id": 81, "cat": "crypto", "urgency": "watch", "source": "Salazar Slytherin / Crypto Integrated", "title": "Ethereum researchers propose zeroing out staking yield above 50% staked", "idea": "Justin Drake and co-authors proposed EIP-8361 ('Tapered Issuance Burn'), which would zero out ETH staking yield above 50% of supply staked and halve it to roughly 1% at the current staked level, removing the incentive for stake growth beyond that threshold.", "angle": "A specific, numeric proposal to cap ETH's staking ratio is a real tokenomics lever worth flagging for anyone modeling ETH staking-yield ETFs.", "tweetA": "EIP-8361 ('Tapered Issuance Burn') would cut ETH staking yield to roughly 1% at current staked levels and zero it above 50% staked. The goal: stop incentivizing stake growth past that threshold. If this lands, every staking-yield-based $ETH ETF pitch needs a rewrite.", "tweetB": "Ethereum researchers are now explicitly trying to cap the staking ratio via yield mechanics rather than let it float, the same week Solana and NEAR are separately tackling their own inflation/security tradeoffs. 2026 is shaping up as the year every major L1 rewrites its issuance model.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.cryptointegrat.com/p/crypto-news-august-5-2026"}, {"id": 82, "cat": "AI/infra", "urgency": "act", "source": "Neil Sethi / Neil's Newsletter", "title": "SpaceX drops 11% on AI spending guidance, AMD falls 9% on weak outlook — same morning Arista jumps 11%", "idea": "Ahead of the open, SpaceX fell about 11% after projecting higher-than-expected spending on its AI business, and AMD dropped about 9% on an underwhelming sales outlook, even as Arista Networks jumped 11% — three double-digit AI-related moves in opposite directions on one morning.", "angle": "A clean illustration that the 'AI theme' isn't trading as a monolith anymore; investors are pricing execution/guidance quality stock by stock.", "tweetA": "Same morning: SpaceX -11% (guided to higher AI spend than expected), AMD -9% (weak sales outlook), Arista +11%. Three AI-adjacent names, three completely different verdicts. The 'AI trade' stopped being one trade a while ago, this is what stock-picking inside a theme actually looks like. $AMD $ANET", "tweetB": "If SpaceX gets punished for spending MORE on AI while Arista gets rewarded, the market isn't judging AI capex on the dollar amount, it's judging it on whether the spender can show a path to monetizing it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://neilsethi.substack.com/p/as-we-approach-the-open-8526"}, {"id": 83, "cat": "geopolitics", "urgency": "act", "source": "Neil Sethi / Neil's Newsletter", "title": "US, Iran, Oman near a 60-day Strait of Hormuz shipping deal — but Tehran is playing it down", "idea": "Reports say the US, Iran, and Oman are preparing a 60-day agreement on shipping through the Strait of Hormuz, with inbound vessels using a northern lane near Iran and outbound traffic routed through Omani waters, no tolls during the transitional period. Trump said 'it could happen tomorrow or the next day,' but Iranian state TV downplayed the outcome the same day.", "angle": "A de-escalation headline already being partially walked back by Iranian state media is exactly the setup that can whipsaw oil on headline risk in either direction.", "tweetA": "Trump says a US-Iran-Oman Strait of Hormuz shipping deal 'could happen tomorrow or the next day' — 60 days, no tolls, split lanes for inbound/outbound traffic. Iranian state TV is already downplaying it same-day, saying it's contingent on 'a change in US behavior.' Classic setup for an oil headline whipsaw. $USO", "tweetB": "Worth noting the asymmetry: Trump's comments read as imminent, Tehran's state media reads as conditional and non-committal, same day. When the two sides of a deal send opposite signals to press within hours of each other, that's usually a sign it's not actually close.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://neilsethi.substack.com/p/as-we-approach-the-open-8526"}, {"id": 84, "cat": "labor", "urgency": "act", "source": "Neil Sethi / Neil's Newsletter", "title": "ADP job growth miss (+44K vs +65K expected) adds to the soft-data pile", "idea": "The ADP Monthly report showed July job growth of +44K, well under the +65K expected, landing the same morning as a Treasury refunding announcement that left auction sizes unchanged.", "angle": "Connects labor softness directly to the funding/rates picture on the same morning.", "tweetA": "ADP: +44K vs +65K expected. Landing the same morning Treasury confirmed non-bill auction sizes stay unchanged this quarter, meaning T-bill issuance keeps creeping up regardless of what the labor data says. Two different parts of the machine, moving independently.", "tweetB": "A 21K miss on ADP normally moves the rate-cut conversation. But watch: Treasury just reconfirmed steady coupon auction sizes 'for at least the next several quarters' — Bessent's funding plan isn't reacting to soft data in real time, it's on its own multi-quarter track.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://neilsethi.substack.com/p/as-we-approach-the-open-8526"}, {"id": 85, "cat": "credit", "urgency": "deep", "source": "Neil Sethi / Neil's Newsletter", "title": "Bessent's steady-as-she-goes refunding locks in rising T-bill issuance", "idea": "The Treasury refunding announcement left non-bill (over 1-year maturity) auction sizes unchanged from the prior quarter and kept forward guidance that it 'anticipates maintaining nominal coupon and FRN auction sizes for at least the next several quarters,' effectively locking in a steady increase in T-bill issuance to fund the gap.", "angle": "The unchanged coupon guidance is itself the signal: Treasury is deliberately leaning on bills rather than coupons to fund the deficit.", "tweetA": "Treasury's refunding language didn't move an inch: coupon/FRN auction sizes held steady 'for at least the next several quarters.' That's not inaction, it's a deliberate choice to fund the growing deficit gap through rising T-bill issuance instead of coupons.", "tweetB": "Everyone's watching the 10-year auction, but the real story is what Treasury ISN'T doing: no coupon size increase, again. That pushes the funding burden onto bills, exactly the kind of thing that shows up later as money-market yield pressure, not headline drama now.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://neilsethi.substack.com/p/as-we-approach-the-open-8526"}, {"id": 86, "cat": "geopolitics", "urgency": "act", "source": "Neil Sethi / Neil's Newsletter", "title": "Beijing hits back at US tech curbs by tightening drone export controls", "idea": "China's Commerce Ministry announced four sets of retaliatory measures against recent US actions, including the FCC's ban on some foreign-made robots/power inverters and the blacklisting of 40+ Chinese companies over forced-labor allegations, by stiffening controls on drone exports, leveraging its dominance in global drone production.", "angle": "China weaponizing its drone-manufacturing dominance, a new lever distinct from the usual rare-earths playbook.", "tweetA": "China's retaliation for US robot/inverter bans and the 40+ company blacklist: tightened drone export controls. Beijing is leaning on drone manufacturing dominance as a new trade-war lever, distinct from the usual rare-earths playbook. Watch DJI-dependent supply chains (agri, surveying, logistics) for knock-on effects.", "tweetB": "Xi and Trump are set to meet next month after May's 'constructive strategic stability' summit language, and Beijing is escalating export controls days closer to that meeting. Worth asking whether this is negotiating leverage-building or a genuine breakdown in the truce.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://neilsethi.substack.com/p/as-we-approach-the-open-8526"}, {"id": 87, "cat": "macro", "urgency": "act", "source": "Neil Sethi / Neil's Newsletter", "title": "China services PMI hits its weakest read since Sept 2024, business confidence lowest since Feb 2020", "idea": "The RatingDog China services PMI slipped to 50.4 from 54.1 in June, missing the 53.7 consensus by a wide margin and marking the lowest reading since September 2024. Business expectations for the year ahead, while still positive, softened to their lowest level since February 2020.", "angle": "'Lowest since Feb 2020' on business confidence is the sharper data point than the PMI headline — a nearly six-year low in forward sentiment.", "tweetA": "Buried in the China PMI miss (50.4 vs 54.1, worst since Sept 2024): business expectations for the year ahead just fell to their lowest since February 2020. That's pre-COVID-low confidence in a China services survey. The headline miss is the least interesting part of this data.", "tweetB": "China's factory PMI also slowed on weather + weak demand this same report. Services confidence at a near-6-year low plus manufacturing softness is a two-engine slowdown story, not a one-off soft print.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://neilsethi.substack.com/p/as-we-approach-the-open-8526"}, {"id": 88, "cat": "macro", "urgency": "deep", "source": "Neil Sethi / Neil's Newsletter", "title": "Japan's wage streak just hit its longest in 34 years — BOJ hike case building", "idea": "Japan's nominal wages rose 3.4% YoY in June, extending a streak of 3%+ gains to five months, the longest such run in 34 years. Real wages (ex-rent) rose 1.6%, a sixth straight month of gains, the longest since 2021.", "angle": "A 34-year record wage streak is a genuinely rare macro data point and the cleanest fundamental case for further BOJ hikes.", "tweetA": "Japan nominal wages +3.4% YoY in June, five straight months above 3%, the longest streak in 34 years. This is the real BOJ hike case, not the yen intervention headlines. Economist quote in the note: 'the trend in wage growth is strengthening... keep the BOJ on track to reduce stimulus.'", "tweetB": "Real wages (ex-rent) up 1.6%, sixth straight monthly gain, longest since 2021. If Japanese households are actually getting real purchasing power back for the first time in years, that's a bigger deal for domestic consumption stocks than anything happening in dollar-yen this week. $EWJ", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://neilsethi.substack.com/p/as-we-approach-the-open-8526"}, {"id": 89, "cat": "macro", "urgency": "act", "source": "Neil Sethi / Neil's Newsletter", "title": "Yen's best 4-day rally in 2 years snaps despite Bessent's support pledge", "idea": "The yen weakened 0.4% against the dollar, ending its best four-day rally in two years, even after Treasury Secretary Bessent pledged the US would 'do whatever it takes' to support Japan following a joint intervention. Traders are watching the 155/dollar level as the threshold for a structural shift.", "angle": "A verbal Bessent pledge failing to extend the rally suggests markets want to see the 155 level actually break before believing in a structural yen turn.", "tweetA": "Yen's best 4-day rally in 2 years just snapped, even with Bessent publicly pledging the US will 'do whatever it takes' to support Japan. Traders are watching 155/dollar as the real test; April/May interventions only briefly got there before fading. Verbal support isn't enough anymore. $USDJPY", "tweetB": "The gap between 'Treasury Secretary says X' and 'the market actually holds the level' is the whole story here. If jawboning alone moved dollar-yen sustainably, it would have worked in April and May too, it didn't.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://neilsethi.substack.com/p/as-we-approach-the-open-8526"}, {"id": 90, "cat": "geopolitics", "urgency": "watch", "source": "Neil Sethi / Neil's Newsletter", "title": "Labour overtakes Reform for the first time in over a year under Burnham", "idea": "A new JL Partners poll shows Labour at 27% versus Reform UK's 25%, Labour's first lead over Farage's party since March 2025 and its strongest polling since November 2024. Head-to-head, 53% prefer Burnham to Farage as PM versus 24% the other way.", "angle": "A specific, sourced polling swing under a new PM is worth flagging for anyone tracking UK political risk/GBP positioning.", "tweetA": "New JL Partners poll: Labour 27%, Reform 25%, Labour's first lead over Farage's party since March 2025. Head-to-head, Burnham beats Farage 53-24 on 'better PM.' A genuine polling inflection under new leadership; Bloomberg's 14-day composite shows the same trend.", "tweetB": "'Being in front will be a tonic... it's far easier to demand discipline when you're winning' — the quote in the piece nails why this poll matters beyond the headline number: a Labour lead changes Burnham's internal leverage over his own party, not just the electoral horse race.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://neilsethi.substack.com/p/as-we-approach-the-open-8526"}, {"id": 91, "cat": "macro", "urgency": "deep", "source": "Neil Sethi / Neil's Newsletter", "title": "EM carry trades shrug off the yen intervention — this isn't August 2024 again", "idea": "The Bloomberg EM FX Carry Risk Premia Index has fallen only about 1% since the joint US-Japan intervention, versus a 4% drop in August 2024's yen-driven carry unwind. The Brazilian real is down 4% vs yen but flat vs dollar and only 0.8% lower vs euro, as funding has diversified away from yen toward euro/Swiss franc.", "angle": "A quantified comparison (1% vs 4% drawdown) between this intervention and the 2024 blowup is the kind of concrete risk-premium data that actually settles the 'is carry about to unwind' debate.", "tweetA": "EM carry trade drawdown since the US-Japan intervention: ~1%. August 2024's yen-driven carry unwind: ~4%. Same type of shock, 4x smaller impact, because funding has diversified away from yen into EUR/CHF. Vontobel's Larose: 'the bar for a disorderly carry unwind is higher than we thought a few weeks ago.'", "tweetB": "Brazilian real -4% vs yen but flat vs dollar and only -0.8% vs euro since the intervention — that spread tells you exactly how much of the 'carry unwind' story was really just a yen-specific move, not a broad EM risk-off.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://neilsethi.substack.com/p/as-we-approach-the-open-8526"}, {"id": 92, "cat": "regulation", "urgency": "watch", "source": "Neil Sethi / Neil's Newsletter", "title": "Beijing launches a global hunt for decades of unpaid taxes from the ultra-rich", "idea": "China has launched a global campaign to recover hundreds of billions of dollars in unpaid taxes on overseas capital gains and investments, in some cases going back to 2000, per the FT, with banks instructed to review wealthy clients' overseas holdings, alongside a parallel push to tighten outbound capital controls.", "angle": "A fiscal-hole-driven tax crackdown on China's wealthy paired with tighter outbound capital controls is a capital-flight risk signal.", "tweetA": "China is running a global hunt for unpaid taxes on overseas capital gains going back to 2000, hundreds of billions of dollars, per FT. Banks are being told to flag wealthy clients' undeclared overseas income. Paired with tighter outbound capital controls, this reads like Beijing plugging its fiscal hole by squeezing money that already left.", "tweetB": "A 25-year lookback on offshore capital gains plus new outbound capital controls at the same time is a combination that tends to accelerate capital flight before it stops it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://neilsethi.substack.com/p/as-we-approach-the-open-8526"}, {"id": 93, "cat": "macro", "urgency": "act", "source": "Neil Sethi / Neil's Newsletter", "title": "Disney, CVS and Eli Lilly all beat — for very different reasons", "idea": "Disney rose 4% on a profit beat driven by entertainment division strength and resilient theme parks; CVS climbed over 3% after raising full-year profit guidance on better-than-expected Aetna medical costs; Eli Lilly rose nearly 6% after boosting its full-year revenue forecast — three unrelated beat drivers landing the same morning.", "angle": "Three sizable single-day moves from completely different beat mechanisms is a reminder that 'beat season' strength isn't one story.", "tweetA": "Same morning: Disney +4% (parks/entertainment beat), CVS +3% (Aetna medical costs came in better than feared), Eli Lilly +6% (raised full-year revenue). Three completely different beat mechanisms, all green on the same tape. $DIS $CVS $LLY", "tweetB": "The CVS move is the one worth digging into: medical cost ratios beating expectations is an insurer-specific signal about healthcare utilization trends, not a 'consumer is fine' signal like Disney or Lilly. Don't lump all three into the same 'earnings season is strong' narrative.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://neilsethi.substack.com/p/as-we-approach-the-open-8526"}, {"id": 94, "cat": "macro", "urgency": "watch", "source": "Neil Sethi / Neil's Newsletter", "title": "Europe's earnings scoreboard: Chanel beats LVMH, Infineon stumbles on margins", "idea": "Chanel's H1 sales rose by double digits, beating luxury rivals including LVMH; Novo Nordisk fell 4% as Wegovy sales disappointed; Infineon fell over 5% on margin pressure despite meeting revenue expectations; Next Plc raised its outlook for the third time this fiscal year, hitting a record high on UK weather-driven demand.", "angle": "Divergence within European sectors is a reminder that sector-level 'Europe is fine/not fine' calls miss company-specific execution stories.", "tweetA": "European earnings divergence in one morning: Chanel's H1 sales beat LVMH's luxury numbers by a wide margin, while Novo Nordisk -4% on disappointing Wegovy sales, and Infineon -5%+ on margin pressure DESPITE meeting revenue estimates. 'Europe earnings' isn't one trade right now, it's three different ones.", "tweetB": "Infineon meeting revenue but missing on margins and still dropping 5%+ is the more telling data point than the headline beats — the market cares more about chipmaker pricing power right now than topline growth. Watch for the same pattern in other semis reporting this cycle.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://neilsethi.substack.com/p/as-we-approach-the-open-8526"}];

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function toggleCard(id){

  el.classList.toggle('open');
}

  var el = document.getElementById('reportCard');
  el.classList.toggle('open');
  document.getElementById('reportChevron').textContent = el.classList.contains('open') ? '▾' : '▸';
}

function setCat(c){
  activeCat = c; activeSrc = null;
  render();
}
function setUrg(u){
  activeUrg = u; activeSrc = null;
  render();
}
function filterBySrc(name){
  activeSrc = name; activeCat = "All"; activeUrg = "All";
  render();
  setTimeout(function(){
    ITEMS.forEach(function(it){
      if(it.source.indexOf(name) !== -1 || name.indexOf(it.source) !== -1){
        var el = document.getElementById('card-' + it.id);
        if(el) el.classList.add('open');
      }
    });
  }, 0);
}

function buildFilterBars(){
  var cats = {};
  var urgs = {act:0, deep:0, watch:0};
  ITEMS.forEach(function(it){
    cats[it.cat] = (cats[it.cat]||0)+1;
    urgs[it.urgency] = (urgs[it.urgency]||0)+1;
  });

  var catRow = document.getElementById('catRow');
  var allBtn = '<button class="pill' + (activeCat==="All"?" active":"") + '" style="' + (activeCat==="All"?"background:#333;":"") + '" onclick="setCat(\'All\')">All <span class="count">' + ITEMS.length + '</span></button>';
  var catHtml = allBtn;
  Object.keys(cats).sort().forEach(function(c){
    var isActive = activeCat === c;
    var style = isActive ? ("background:" + catColor(c) + ";border-color:" + catColor(c) + ";") : "";
    catHtml += '<button class="pill' + (isActive?" active":"") + '" style="' + style + '" onclick="setCat(\'' + c + '\')">' + c + ' <span class="count">' + cats[c] + '</span></button>';
  });
  catRow.innerHTML = catHtml;

  var urgRow = document.getElementById('urgRow');
  var urgAllActive = activeUrg === "All";
  var urgHtml = '<button class="pill' + (urgAllActive?" active":"") + '" style="' + (urgAllActive?"background:#333;":"") + '" onclick="setUrg(\'All\')">All <span class="count">' + ITEMS.length + '</span></button>';
  ["act","deep","watch"].forEach(function(u){
    var isActive = activeUrg === u;
    var style = isActive ? "background:#333;" : "";
    urgHtml += '<button class="pill' + (isActive?" active":"") + '" style="' + style + '" onclick="setUrg(\'' + u + '\')">' + URG_META[u].emoji + ' ' + URG_META[u].label + ' <span class="count">' + (urgs[u]||0) + '</span></button>';
  });
  urgRow.innerHTML = urgHtml;
}

function cardHtml(item, index){
  var color = catColor(item.cat);
  var chartIcon = '';
  if(item.charts && item.charts.hot) chartIcon = '<span class="charticon">🔥</span>';
  else if(item.charts && item.charts.count > 0) chartIcon = '<span class="charticon">📊</span>';

  var chartsSection = '';
  if(item.charts && (item.charts.count > 0 || item.charts.desc)){
    chartsSection = '<div class="charts-box' + (item.charts.hot?' hot':'') + '">' +
      (item.charts.hot ? '🔥 CHART WORTH SAVING — ' : '📊 ') +
      (item.charts.count||0) + ' chart(s). ' + (item.charts.desc||'') +
      '</div>';
  }

  var linkSection = item.link ? '<div class="linkrow"><a href="' + item.link + '" target="_blank" rel="noopener">↗ Read full article</a></div>' : '';

  return '' +
    '<div class="card" id="card-' + item.id + '">' +
      '<div class="card-header" onclick="toggleCard(' + item.id + ')">' +
        '<span class="idx">' + String(index+1).padStart(2,'0') + '</span>' +
        '<span class="urg">' + URG_META[item.urgency].emoji + '</span>' +
        '<span class="badge" style="background:' + color + ';">' + item.source + '</span>' +
        '<span class="cattag">' + item.cat + '</span>' +
        chartIcon +
        '<span class="htitle">' + item.title + '</span>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="label">The Idea</div>' +
        '<div class="idea-text">' + item.idea + '</div>' +
        '<div class="label">My Angle</div>' +
        '<div class="angle-box" style="border-left-color:' + color + '; background:' + color + '12;">' + item.angle + '</div>' +
        '<div class="tweets">' +
          '<div class="tweetbox">' +
            '<div class="tweet-head"><span class="tweet-label a">TWEET A</span><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>' +
            '<div class="tweet-text">' + item.tweetA + '</div>' +
          '</div>' +
          '<div class="tweetbox">' +
            '<div class="tweet-head"><span class="tweet-label b">TWEET B</span><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>' +
            '<div class="tweet-text">' + item.tweetB + '</div>' +
          '</div>' +
        '</div>' +
        chartsSection +
        linkSection +
      '</div>' +
    '</div>';
}

function render(){
  buildFilterBars();
  var filtered = ITEMS.filter(function(it){
    if(activeSrc && it.source.indexOf(activeSrc) === -1 && activeSrc.indexOf(it.source) === -1) return false;
    if(activeCat !== "All" && it.cat !== activeCat) return false;
    if(activeUrg !== "All" && it.urgency !== activeUrg) return false;
    return true;
  });
  var html = filtered.map(function(it, idx){ return cardHtml(it, idx); }).join('');
  document.getElementById('cards').innerHTML = html || '<p style="color:#999;">No items match this filter.</p>';
}

function buildReport(){
  document.getElementById('metaLine').textContent =
    META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails';

  var html = '';
  html += '<div><strong>Window:</strong> ' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</div>';
  html += '<div style="margin-top:6px;"><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp; <strong>Read:</strong> ' + META.emailsRead + ' &nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</div>';

  html += '<div class="label" style="margin-top:14px;">Included Sources</div>';
  META.includedSources.slice().sort(function(a,b){return b.count-a.count;}).forEach(function(s){
    html += '<div><span class="srcline" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span> — ' + s.count + ' item' + (s.count===1?'':'s') + '</div>';
  });

  html += '<div class="label" style="margin-top:14px;">Skipped Sources</div>';
  META.skippedSources.forEach(function(s){
    html += '<div>' + s.name + ' — <span class="skip-reason">' + s.reason + '</span></div>';
  });

  html += '<div class="label" style="margin-top:14px;">Totals</div>';
  html += '<div>' + META.itemsExtracted + ' items · ' + META.includedSources.length + ' sources included · ' + META.skippedSources.length + ' sources skipped</div>';

  document.getElementById('reportBody').innerHTML = html;
  document.getElementById('reportHead').onclick = toggleReport;
}

render();
buildReport();
</script>
