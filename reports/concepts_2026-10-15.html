* { box-sizing: border-box; margin: 0; padding: 0; }

const REPORT_DATA = {"date": "2026-10-15", "generated_at": "2026-10-15T11:15:20.000Z", "stats": {"cards": 12, "insights": 86, "sources": 9, "quote_verified_pct": 100}, "cards": [{"record_id": "c3e3686b8f6a0131", "source_type": "concepts", "source_name": "a16z Blog", "source_url": "https://a16z.com/winning-the-relay-race-long-running-agents-in-high-value-customer-journeys/", "title": "Winning the Relay Race: Long-Running Agents in High-Value Customer Journeys | Andreessen Horowitz", "published_date": "2026-10-14", "language": "en", "processed_at": "2026-10-15T11:15:14Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech"], "gist": "a16z's David Haber argues long-running AI agents can own multi-week 'relay race' customer journeys (plaintiff law, insurance, mortgages, enterprise sales) end to end, shifting AI vendors from selling cost savings to being paid on outcomes — and threatening incumbents like Red Ventures.", "themes": [{"theme": "Relay-race value leakage", "insights": [{"claim": "Long customer journeys such as plaintiff-law case preparation are 'relay races' with drop-off and value leakage at every handoff: slow intake lets prospects sign with the first firm that calls back, and thin attention on routine cases lowers settlement value.", "speaker": "David Haber", "type": "framework", "entities": ["plaintiff law firms", "personal injury"], "conviction": "high", "so_what": "Map where handoffs leak value in any multi-week workflow; that is where an agent's ROI concentrates.", "quote": null, "locator": "Value Only Appears At The End Of The Relay Race", "quote_verified": false}, {"claim": "Human capacity limits cause concrete losses in legal case work: a firm may accept a first settlement offer when a detailed read of a doctor's note would have revealed a brain injury and a higher settlement value.", "speaker": "David Haber", "type": "anecdote", "entities": ["plaintiff law firms"], "conviction": "medium", "so_what": "Illustrates why exhaustive document review by agents can raise revenue, not just cut cost.", "quote": null, "locator": "Value Only Appears At The End Of The Relay Race", "quote_verified": false}, {"claim": "Context fragmentation across documents, stakeholders and systems over months makes it nearly impossible for humans to hold the full picture of every case, so bills get omitted from demand letters and treatment gaps go unexplained.", "speaker": "David Haber", "type": "causal", "entities": ["plaintiff law firms"], "conviction": "medium", "so_what": "Persistent memory is a core differentiator of long-running agents.", "quote": null, "locator": "Value Only Appears At The End Of The Relay Race", "quote_verified": false}]}, {"theme": "Long-running agent capability shift", "insights": [{"claim": "Until recently AI agents handled bounded tasks with short interactions and verifiable outcomes (customer support was the early use case); long-running agents now pursue goals across dozens of steps, modalities and long time horizons.", "speaker": "David Haber", "type": "thesis", "entities": ["AI agents", "customer support"], "conviction": "high", "so_what": "Agent value is migrating from narrow task automation toward whole-journey ownership; watch vendors who can demonstrate multi-week reliability.", "quote": null, "locator": "The Long-Running Agent Opportunity", "quote_verified": false}, {"claim": "A long-running case agent can wake on events or deadlines, dispatch sub-agents to call witnesses, update clients, work across phone/email/text, consolidate findings and keep learning across cases, so evidence collection is no longer bounded by human capacity.", "speaker": "David Haber", "type": "framework", "entities": ["AI agents", "sub-agents"], "conviction": "medium", "so_what": "Architecture pattern: persistent context + event wake-ups + sub-agent fan-out.", "quote": null, "locator": "The Long-Running Agent Opportunity", "quote_verified": false}, {"claim": "Because agents are nearly infinitely scalable, even seemingly routine low-value cases get worked fully, which removes a labor constraint that previously forced firms to triage claims.", "speaker": "David Haber", "type": "causal", "entities": ["AI agents"], "conviction": "medium", "so_what": "Unit economics of low-value work flip when marginal attention costs near zero.", "quote": null, "locator": "The Long-Running Agent Opportunity", "quote_verified": false}]}, {"theme": "Outcome-based pricing", "insights": [{"claim": "Owning the full customer journey lets AI vendors drive revenue uplift rather than only cost reduction, and because outcomes are observable and attributable they can price on work product or outcomes, reaching contract values unattainable through cost savings alone.", "speaker": "David Haber", "type": "thesis", "entities": ["AI vendors", "outcome-based pricing"], "conviction": "high", "so_what": "TAM expands from a share of labor budgets to a share of revenue; favors vendors with attributable outcomes.", "quote": null, "locator": "Getting Paid For Outcomes", "quote_verified": false}, {"claim": "Outcome pricing faces friction: most US states bar non-lawyers from sharing legal fees, procurement teams lack precedent for outcome-based contracts, and attribution disputes will likely arise early, making deployment a commercial challenge as much as a technical one.", "speaker": "David Haber", "type": "causal", "entities": ["plaintiff law firms", "procurement"], "conviction": "medium", "so_what": "Regulatory and procurement barriers can slow adoption in legal, regulated verticals.", "quote": null, "locator": "Getting Paid For Outcomes", "quote_verified": false}]}, {"theme": "Red Ventures as disruption case", "insights": [{"claim": "Red Ventures pioneered end-to-end outsourced digital sales for long-term consumer contracts, e.g. owning sites like homeinsurance.com and closing policies for insurers, and per S&P Global generated about $370M EBITDA on about $1.4B sales in 2022.", "speaker": "David Haber", "type": "data_point", "entities": ["Red Ventures", "S&P Global", "homeinsurance.com"], "conviction": "high", "so_what": "Benchmark for how lucrative owning a journey and being paid per close can be.", "quote": null, "locator": "The Case For An AI-native Red Ventures", "quote_verified": false}, {"claim": "Red Ventures' model looks structurally threatened: consumers can ask personal agents such as Meta's Muse or Instinct for recommendations, devaluing traditional comparison sites, while long-running agents can replace hundreds of humans running linear funnels; its EBITDA fell to an estimated ~$160M in 2025.", "speaker": "David Haber", "type": "causal", "entities": ["Red Ventures", "Meta", "Google"], "conviction": "medium", "so_what": "Lead-gen and comparison-site intermediaries are exposed to agentic discovery and agentic sales; an AI-native entrant could take the profit pool.", "quote": null, "locator": "The Case For An AI-native Red Ventures", "quote_verified": false}]}, {"theme": "Go-to-market models", "insights": [{"claim": "Three go-to-market routes exist for long-running agents: sell the platform (price upside, longer sales cycles, harder attribution), sell the service by replacing outsourced BPO work (shorter cycles, but legacy pricing and in-house journeys limit reach), or go full-stack and become the AI-native operator.", "speaker": "David Haber", "type": "framework", "entities": ["BPO", "AI vendors"], "conviction": "medium", "so_what": "Use as a lens to classify AI startups' revenue models and margin ceilings.", "quote": null, "locator": "Three Ways To Market", "quote_verified": false}, {"claim": "Full-stack example: instead of selling an agent to a debt collection firm, buy debt portfolios and collect them directly to capture all AI upside and solve attribution, at the cost of owning licensing and compliance outside the core journey.", "speaker": "David Haber", "type": "anecdote", "entities": ["debt collection"], "conviction": "low", "so_what": "Full-stack AI-native plays tra urn spectrum, from local food banks with immediate measurable results to systemic change needing more time and tolerating uncertain outcomes, and Sonsini allocates across both as a portfolio.", "speaker": "Morgan Housel & Craig Shapiro", "type": "framework", "entities": ["Matt Sonsini", "Ravello Impact"], "conviction": "medium", "so_what": "Apply portfolio construction logic to impact and philanthropic capital.", "quote": null, "locator": "Key Takeaways", "quote_verified": false}, {"claim": "Measuring philanthropic impact is harder than measuring investment returns because a donor can enjoy a gala and a name on a building without knowing how much good the money did, unlike a business that hears from the market.", "speaker": "Morgan Housel & Craig Shapiro", "type": "causal", "entities": ["Matt Sonsini", "philanthropy"], "conviction": "medium", "so_what": "Feedback-loop quality is the main gap in impact giving; look for funds with real measurement.", "quote": null, "locator": "Key Takeaways", "quote_verified": false}, {"claim": "Sonsini doubts that mere mortal investors can compound capital faster than the world's problems compound, which is the argument for giving now rather than waiting; only someone like Warren Buffett has a reasonable shot.", "speaker": "Morgan Housel & Craig Shapiro", "type": "contrarian", "entities": ["Warren Buffett", "Matt Sonsini"], "conviction": "medium", "so_what": "Challenges the give-later-after-compounding logic common in philanthropy planning.", "quote": "But for mere mortal investors, I’m personally doubtful that’s the case.", "locator": "Introduction", "quote_verified": true}]}, {"theme": "Venture terms and failure", "insights": [{"claim": "A higher valuation can hide a worse deal: senior liquidation preferences and separate investor approval rights create conflicts when growth stalls, so founders should resist trading away important terms for a headline valuation.", "speaker": "Morgan Housel & Craig Shapiro", "type": "thesis", "entit // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
