<!DOCTYPE html>

<title>Twitter Bank Research</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DATA POINT TAGS */
.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "TWITTER BANK RESEARCH", "freshness_gate": "OK    data/twitter/latest/tweets_bank_research.json: collected_at 2026-11-25T18:23:17+00:00 (0.4h old), non-empty\nFRESHNESS GATE PASSED.", "date": "2026-11-25 18:47 UTC", "collected_at": "2026-11-25T18:23:17Z", "window_days": 4, "input_stats": {"total_tweets": 120, "considered": 120, "kept": 19, "dropped": 101, "deduped": 0}, "summary": "AI selloff dominates: Goldman credit CDS baskets (IG, hyperscaler, data-center) at record/multi-year wides while equities bounced; Nomura/Goldman frame Monday's rally as mechanical (leveraged ETFs, CTA covering).\nPositioning: Goldman sees CTAs unloading $68B of global equities and the sharpest cut in leveraged Nasdaq futures since 2022.\nMacro data day: GS core PCE +0.29% (3.26% YoY), Q4 GDP tracking 2.4%, jobless claims 189K; BofA on consumption/AI demand and sticky core services inflation.\nTargets/valuation: Deutsche street-high 9,000 2027 S&P target, UBS 8,900, Yardeni fwd P/E 16.4x; BofA on 2027 EPS revisions.\nEnergy/AI power: Goldman data-center power demand through 2028, Apollo on China's ~550 GW power additions, JPM on SPR at 1982 lows.\nCounts: Goldman 11, BofA 3, Apollo/Slok 2, Deutsche 2, Citi 1, JPM 1, Nomura 1, UBS 1, Yardeni 1.", "by_bank_counts": {"Goldman": 11, "BofA": 3, "Apollo/Slok": 2, "Deutsche": 2, "Citi": 1, "JPM": 1, "Nomura": 1, "UBS": 1, "Yardeni": 1}, "banks": [{"bank": "Goldman", "theme": "GS on core PCE/Q4 GDP tracking, jobless claims, AI credit CDS baskets, systematic/CTA & leveraged Nasdaq positioning, data-center power demand", "items": [{"author": "MikeZaccardi", "text": "GS: Core PCE index +0.29% in October, in line with expectations, and the YoY rate increased to 3.26%. \n\nWe estimate the Dallas Fed’s trimmed-mean PCE rose 0.23% MoM and 2.38% YoY. https://t.co/v1sAfoKnEP", "tweet_url": "https://x.com/MikeZaccardi/status/2125640504201101667", "images": ["https://pbs.twimg.com/media/HX_Kxl6XEAAgDae.png"], "created_at": "2026-11-25T17:19:23.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS Q4 GDP tracking estimate unchanged at +2.4% after this morning's data https://t.co/JdoDwUxVOO", "tweet_url": "https://x.com/MikeZaccardi/status/2125639894315803056", "images": ["https://pbs.twimg.com/media/HX_KOFhXsAAV2Uq.png"], "created_at": "2026-11-25T17:16:57.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Initial jobless claims fell 13,000 to 189,000 for the week ending November 21, the most since July 18, matching that July low as the lowest since 1969. That makes it the 19th week below 200,000 since 1969. The four-week average fell 1,500 to 196,000, close to the 195,250 at the end of October that was the lowest since October 1969.\n\nContinuing claims fell 95,000, the most since December 2021, to 1,697,000, reversing nearly all of the prior week's jump, which was revised up to 99,000, the largest since September 2021. Excluding Michigan, where Goldman Sachs linked the spike to a new unemployment insurance system, the swing was still about +54,000 and then about −66,000.", "tweet_url": "https://x.com/neilsethinew/status/2125588262068625774", "images": ["https://pbs.twimg.com/media/HX-bQCSW0AAIvUU.jpg"], "created_at": "2026-11-25T13:51:47.000Z", "relayers": []}, {"author": "neilsethinew", "text": "@C_Barraud's Morning Brief today had multiple posts noting that AI credit is blowing out again:\n\n▪️ Reuters, citing S&P data, says Oracle, Alphabet and CoreWeave credit default swap spreads are the widest on record, and SoftBank's the widest in four years.\n▪️ ZeroHedge calls Oracle credit an \"absolute meltdown.\" Its 6.7% bonds due 2056, issued in February, are down to about 76 cents on the dollar and yield more than 9%. The spread over Treasuries is at an all-time high and the CDS is the widest on record.\n▪️ ZeroHedge also showed a hyperscaler CDS basket blowing out to a record wide.\n\nGoldman's Rich Privorotsky set up a test on Monday: if Nvidia rallied but neocloud spreads stayed under pressure, \"we're probably just covering shorts.\" By Tuesday morning, he said credit \"didn't quite have the beta of equities.\" Then in Tuesday's session it went the wrong way:\n\n▪️ Goldman's investment-grade CDS basket hit its widest since spring 2025.\n▪️ High-yield CDX topped 385bp.\n▪️ Goldman's hyperscaler CDS basket hit a record.\n▪️ Its data-center CDS basket was back near 496bp, close to its early-November high.\n▪️ CoreWeave bonds hit record lows (Bloomberg).\n\nBond investors focus on the risk of not getting paid back, which Privorotsky says makes credit the cleaner read on AI fears, especially given how much of Monday's equity buying was mechanical (see previous post). \n\nStocks jumped Monday, credit didn't buy it. Until spreads stop widening, by Privorotsky's test the rebound looks more like short covering than a bottom.", "tweet_url": "https://x.com/neilsethinew/status/2125584138556084357", "images": ["https://pbs.twimg.com/media/HX-XgTMWAAAE1Id.jpg"], "created_at": "2026-11-25T13:35:24.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Goldman strategist says it's too early to buy the AI selloff https://t.co/UW4sLoXpay", "tweet_url": "https://x.com/MikeZaccardi/status/2125581453111038396", "images": ["https://pbs.twimg.com/media/HX-VEVBWYAAmD-p.png"], "created_at": "2026-11-25T13:24:44.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Monday's rip on Jensen Huang's return gave the S&P 500 its best day since April 2025, but a lot of that buying wasn't anyone's decision. Per Nomura's Charlie McElligott (via ZeroHedge), a lot was mechanical:\n\n▪️ Leveraged ETFs were projected to buy $41B into the close, second only to the April 9, 2025 tariff-pause day ($46.5B) in data back to 2006.\n▪️ CTAs, at max short, had to cover ~$16B of S&P futures on a close above 7,043 (up to $34B globally).\n▪️ Dealers bought back hedges as the VIX collapsed.\n▪️ Only vol control sold ($10B–$16B).\n\nThe catch is that those buyers are now done. Covering only got CTAs back to flat, and Nomura's model doesn't have them buying to go long until 7,625, 5.9% above Tuesday's 7,201 close. Vol control sells any 1%+ move in either direction. So the next leg needs discretionary buyers, and Goldman's Peter Callahan said Monday looked more like \"net exposure management\" than \"investing.\"\n\nAnd credit never bought it. Goldman's Rich Privorotsky said if Nvidia rallied while neocloud spreads stayed under pressure, \"we're probably just covering shorts.\" Tuesday:\n▪️ Goldman's IG CDS basket hit its widest since spring 2025.\n▪️ HY CDX topped 385bp.\n▪️ Goldman's hyperscaler CDS basket hit a record.\n▪️ CoreWeave bonds hit record lows (Bloomberg).\n\nSemis gave back nearly two-thirds of Monday's 14% (SOX −7.9%). That 5.9-point lag versus the Nasdaq-100 is close to the October 2000 record (6.9 points), in Bloomberg data shared by Goldman.\n\nThe bull case: Privorotsky says if the market can \"sit still for a couple of days,\" systematic funds can re-lever into year-end. But near term the mechanical bid is spent.", "tweet_url": "https://x.com/neilsethinew/status/2125575510532960394", "images": ["https://pbs.twimg.com/media/HX-PqWBW4AALeDQ.jpg"], "created_at": "2026-11-25T13:01:07.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Data center development has accelerated across all key US regional power markets in 2026\n\n'We expect growth acceleration in data centers to be driven not only by a higher volume of facilities, but by increasingly larger physical footprints and higher power density' https://t.co/vVnSeOU27x", "tweet_url": "https://x.com/MikeZaccardi/status/2125572335017086977", "images": ["https://pbs.twimg.com/media/HX-MxoAWEAAVr4v.png"], "created_at": "2026-11-25T12:48:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: US Data Center Power Demand: Accelerated Growth Through (At Least) 2028\n\n'We extend our project schedule-based estimates and expect data center power capacity growth to continue accelerating through 2028, with two-sided risks' https://t.co/vLlH3QLfA8", "tweet_url": "https://x.com/MikeZaccardi/status/2125571706127311360", "images": ["https://pbs.twimg.com/media/HX-MNAxWkAAN3K6.png"], "created_at": "2026-11-25T12:46:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Wednesday is packed with economic data ahead of the Thanksgiving holiday.\n\nThe most notable US economic data is October’s personal income and spending report, which includes core PCE inflation, the Fed’s preferred inflation metric. Bloomberg consensus is for core PCE to rise 0.3% m/m (3.2% y/y, from 3.1%) and headline PCE 0.3% (3.8% y/y, from 3.6%). J.P. Morgan and Goldman Sachs both expect core at 0.29%. Personal income and spending are both expected to rise 0.4%.\n\nThe second estimate of Q3 GDP comes at the same time (which should also include Gross Domestic Income, another key economic indicator), with consensus at 3.5% (the advance estimate was 3.4%), while J.P. Morgan and Goldman both expect 3.7%. We’ll also get October durable goods orders (consensus +0.5%) and new home sales (650,000), plus weekly jobless claims a day early because of the holiday (consensus 200,000).\n\nThe Fed releases its Beige Book at 2pm ET, its last major release before the December 8-9 FOMC meeting. As I mentioned in the Week Ahead: “The Beige Book is important…as the Fed pays a lot of attention to anecdotal ‘on the ground’ reports like that one.” As noted yesterday, there are no scheduled Fed speakers until the meeting.\n\nNon-Bill (>1yr in maturity) US Treasury auctions include $44B of 7-year notes at 11:30am ET, earlier than usual ahead of the holiday.\n\nDeere ($DE) is the only S&P 500 component reporting earnings, before the open.\n\nEx-US highlights include Australia’s October CPI (7:30pm ET Tuesday), Japan’s October services PPI (6:50pm ET Tuesday) and final machine tool orders, Germany’s final Q3 GDP (2am ET) and French consumer confidence for November (2:45am ET). The ECB Governing Council holds a non-monetary policy meeting in Frankfurt, EU and Western Balkan leaders meet for a summit in Brussels and the OECD and African Union hold their International Economic Forum on Africa in Paris.", "tweet_url": "https://x.com/neilsethinew/status/2125545034686873892", "images": ["https://pbs.twimg.com/media/HX7--fyXUAAwu-i.jpg"], "created_at": "2026-11-25T11:00:01.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"Leveraged investors have sharply reduced Nasdaq futures exposure... the biggest negative change since the 2022 bear market\"\n\nGoldman Sachs via @MikeZaccardi https://t.co/ApPjxo2FJN", "tweet_url": "https://x.com/dailychartbook/status/2125529994516480248", "images": ["https://pbs.twimg.com/media/HX9mRFGW8AAWGkh.png"], "created_at": "2026-11-25T10:00:15.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"CTAs are expected to unload $68 billion worth of global equities in the next five days ... on par with the five days through Friday when stocks clocked their worst week since the Covid-19 pandemic.\"\n\nGoldman Sachs via @NKniazhevich https://t.co/eSBTo0rtEw", "tweet_url": "https://x.com/dailychartbook/status/2125429625656369581", "images": ["https://pbs.twimg.com/media/HX8K-qhWwAERls7.jpg"], "created_at": "2026-11-25T03:21:25.000Z", "relayers": []}]}, {"bank": "BofA", "theme": "BofA on US domestic demand, core services inflation vs 2% target, SPX EPS revision trend", "items": [{"author": "MikeZaccardi", "text": "BofA: Consumption and AI are powering US domestic demand https://t.co/Vw451QJW8E", "tweet_url": "https://x.com/MikeZaccardi/status/2125576737790804478", "images": ["https://pbs.twimg.com/media/HX-Lc09XEAAMrTN.png"], "created_at": "2026-11-25T13:06:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "BofA: Core services inflation is well above the level needed to reach the 2% target\n\nThe formula for 2% inflation was easy…Until deglobalization broke it https://t.co/ // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
