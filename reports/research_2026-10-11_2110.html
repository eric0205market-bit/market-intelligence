<script>
const ITEMS = [{"cat": "macro", "urgency": "deep", "source": "The Bubble Bubble", "title": "10Y yield printed a string of shooting stars, and metals bounced the moment it stalled", "idea": "The 10Y surge became the dominant driver of precious metals and spooked markets, overshadowing energy for the first time since the US-Iran war began in March. Several days of spike-then-fade 'shooting star' candles plus an overbought RSI preceded Thu/Fri's pullback, helped by three clean 3Y/10Y/30Y auctions.", "angle": "Yields, not oil, are now the marginal macro variable. Gold/silver are trading as a duration asset again, which matters for how I size into the CPI print.", "tweetA": "Three clean auctions (3Y/10Y/30Y) in one week and the 10Y still ran above 5.3%. That's not a demand problem, that's a term premium problem. Gold is trading it like long duration, not like a hedge.", "tweetB": "For the first time since March the war isn't the macro driver, the 10Y is. Oil at $100+ and the bond market is the one scaring people. Worth asking what that says about where the inflation risk premium sits.", "charts": {"count": 1, "hot": false, "desc": "Charts inside — 10Y shooting-star candles, worth opening"}, "link": "https://thebubblebubble.substack.com/p/precious-metals-are-trying-to-form", "id": 1}, {"cat": "macro", "urgency": "deep", "source": "The Bubble Bubble", "title": "CPI 3.7% and PPI 5.9% y/y are the last prints before the Oct 28 FOMC, and the Fed is looking at inflation, not jobs", "idea": "Wednesday's September CPI is expected at 3.7% y/y and Thursday's PPI at 5.9% y/y. They are the final major inflation readings before the October 28 meeting, where the debate is hike vs hold. Michigan sentiment hit a five-month low on cost-of-living frustration.", "angle": "PPI at 5.9% against CPI at 3.7% is a 2.2pt pipeline gap. Margin squeeze or pass-through still to come — either way it is a setup for a vol event around Wed/Thu.", "tweetA": "CPI 3.7%, PPI 5.9%. A 220bp gap between what producers pay and what consumers see is either a margin story or a CPI story. One of them has to give, and the Fed meets Oct 28.", "tweetB": "Consumer sentiment at a 5-month low, PPI expected at 5.9%, and the Fed deciding between holding and hiking. Whoever is long duration into Wednesday is making a very specific bet about pass-through.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thebubblebubble.substack.com/p/precious-metals-are-trying-to-form", "id": 2}, {"cat": "macro", "urgency": "watch", "source": "The Bubble Bubble", "title": "Dollar index surge is the quiet reason non-energy commodities have been weak for a month", "idea": "The sharp rise in DXY over the past month is named as the other main headwind for precious metals and non-energy commodities, alongside yields. Energy is the exception.", "angle": "Strong USD + 5%+ 10Y + $100 Brent = squeeze on everything that doesn't pay carry. Energy-vs-everything-else dispersion is the trade.", "tweetA": "Oil at $100, dollar ripping, 10Y above 5.3%. Energy is the only commodity not getting crushed by the same macro that's crushing copper and gold. That dispersion is not an accident.", "tweetB": "Everyone is asking if gold has bottomed. Better question: does the dollar? Metals and non-energy commodities have been trading as inverse DXY for a month.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thebubblebubble.substack.com/p/precious-metals-are-trying-to-form", "id": 3}, {"cat": "gold", "urgency": "deep", "source": "Robert Sinn", "title": "Judy Shelton becomes Counselor to Bessent on currency policy, with a China focus", "idea": "Treasury announced Friday that Shelton, a long-time gold-standard advocate, will advise Bessent on currency policy with a focus on China's financial conditions. Sinn argues it opens the door to new thinking on how Washington uses its gold reserves and how it markets its debt, citing a 2024 Shelton post pointing at 2026.", "angle": "Gold reserves carried at $42.22/oz on the Fed's books is the obvious lever. A revaluation or a gold-backed debt instrument would be a monetary regime event — low probability, enormous payoff.", "tweetA": "Treasury just hired the most prominent gold-standard advocate in Washington to advise on currency policy. The US holds ~8,133 tonnes of gold booked at $42/oz. I'm not saying revaluation. I'm saying someone just got a seat to propose it.", "tweetB": "Hiring Shelton and a 10Y above 5.3% in the same month. If the Treasury wants a new way to finance itself, the gold reserves are the only asset on the balance sheet the market can't see the true value of. $GLD $GDX", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://robertsinn.substack.com/p/dr-judy-shelton-appointed-as-us-treasury", "id": 4}, {"cat": "geopolitics", "urgency": "watch", "source": "Robert Sinn", "title": "Shelton's mandate is framed as a China play: restructuring the global monetary order", "idea": "The framing is 'it's all about China': the appointment is read as part of orchestrating a restructuring of the global monetary order, not a domestic policy hire. Sinn digs through Shelton's past writing for clues on timing and mechanism.", "angle": "Pairs with the Capital Flows take that China is using floating-FX mechanics against the US. Two very different newsletters landing on 'FX as a weapon' on the same day.", "tweetA": "Two unrelated newsletters today, same conclusion: the US-China fight is moving into currency. One says Treasury just hired a gold-standard advocate for it. The other says Beijing is already using free-floating FX as a weapon.", "tweetB": "Currency policy with a 'China focus' reads like a Plaza Accord sequel. The difference from 1985: Japan was an ally, and this time there's no one to make the deal with.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://robertsinn.substack.com/p/dr-judy-shelton-appointed-as-us-treasury", "id": 5}, {"cat": "AI/infra", "urgency": "deep", "source": "Vik's Newsletter (Semi Doped)", "title": "Copper reach halves every time speed doubles: ~2m at 224G, ~1m at 448G — too short for a rack", "idea": "Skin-effect loss caps passive copper at ~2m for 224 Gbps and ~1m at 448 Gbps. TE Connectivity's co-packaged-copper + 1m DAC + CPC chain is 1.6m total, with -46 dB end-to-end loss and BER 1.4e-6. A 2m DAC at the same PAM4 112 GHz Nyquist loses -63 dB and runs BER 1.2e-1 — roughly 1 bit in 10 wrong.", "angle": "The 2m vs 1m cliff is why rack-scale copper (NVL-style) has a physical ceiling. Every doubling of lane speed pushes more of the fabric onto optics or active cables.", "tweetA": "-46 dB at 1m, -63 dB at 2m. A 17 dB difference is 50x less signal power for one extra metre of cable. That's the physics behind every 'copper vs optics' debate in AI racks. $CRDO $ALAB $COHR", "tweetB": "BER of 1.2e-1 on a 2m DAC means 1 in 10 bits wrong. You cannot error-correct that. The next rack architecture is being decided by a skin-effect curve, not by a roadmap slide.", "charts": {"count": 3, "hot": true, "desc": "Loss/BER plots from TE Connectivity for 1m and 2m DAC with and without re-driver; NVL-style rack copper limits"}, "link": "https://www.viksnewsletter.com/p/the-pam4-vs-pam6-dilemma-for-448g", "id": 6}, {"cat": "AI/infra", "urgency": "deep", "source": "Vik's Newsletter (Semi Doped)", "title": "PAM6 at 448G: 173.4 GBaud and 86.7 GHz Nyquist, but the alternative is a re-driver the hyperscalers don't want", "idea": "PAM6 packs 2.5 bits/symbol (5 bits over 2 symbols via Cross-32 QAM mapping), cutting 448G to 173.4 GBaud and Nyquist to 86.7 GHz vs 112 GHz for PAM4 at 224 GBaud. The fallback — a Semtech-style re-driver — cut loss to -32 dB (1m) / -49 dB (2m) but adds power, parts and a failure point; hyperscalers resist that. The industry (Ethernet Alliance TEF) is now seriously considering PAM6 for copper.", "angle": "A modulation change is a hidden supply-chain event: DSP/SerDes content rises, active-cable content falls if PAM6 works. Who wins depends on whether the 25 GHz of Nyquist relief is enough.", "tweetA": "Moving from PAM4 to PAM6 buys 25 GHz of Nyquist headroom for the price of tighter SNR margins. The companies that win aren't the ones with the best cable, they're the ones with the best DSP. $MRVL $AVGO $CRDO", "tweetB": "Hyperscalers would rather change the modulation than add a re-driver. A chip with no extra power and no extra supply chain beats a better chip every time. That's why PAM6 is being discussed seriously and the active-copper vendors should be nervous. $SMTC $ALAB", "charts": {"count": 2, "hot": false, "desc": "Cross-32 QAM constellation, TE PAM6 1m DAC results"}, "link": "https://www.viksnewsletter.com/p/the-pam4-vs-pam6-dilemma-for-448g", "id": 7}, {"cat": "crypto", "urgency": "deep", "source": "IT Tech PL (Onchain Insights)", "title": "US spot BTC ETFs lost $701.3M — biggest outflow since late June — while price held above $82.8K", "idea": "BTC traded $80,393–$86,999, weekly candle -4.03% at $83,039, first red week after three green. BTC ETFs lost $701.3M (largest since June's $1.79B), Wednesday alone was -$487M, IBIT and FBTC among the largest. Price sits just $239 above the author's $82,800 correction trigger and stopped 1.7% above the 365-day MA.", "angle": "The September breakout was ETF-bid. If the marginal buyer has left and price still holds, someone else is absorbing — the author hints at long-term holders but it's behind the paywall.", "tweetA": "$701M out of BTC ETFs and price is down only 4%. Either a new buyer showed up or the bid was already gone and this is just air. The $82.8K line is $239 away. $IBIT $FBTC", "tweetB": "BTC at $83K, 10Y above 5.3%. Bitcoin pays nothing and T-bills pay 5%+. Every week the 10Y stays here the burden of proof moves to the bulls.", "charts": {"count": 1, "hot": false, "desc": "Weekly candle and ETF flow charts"}, "link": "https://ittechpl.substack.com/p/recent-buyers-sold-at-a-loss-198", "id": 8}, {"cat": "crypto", "urgency": "deep", "source": "IT Tech PL (Onchain Insights)", "title": "Ether ETFs lost $486.1M — worst week since January — and Coinbase premium was positive in 1 of 168 hours", "idea": "ETH futures 90-day taker CVD reads 'Taker Sell Dominant' for the second week, while spot is neutral. The ETH Coinbase Premium Gap, a proxy for US spot demand, was positive in only one of the last 168 hours. ETH fell 7.61% on a rolling 7 days vs BTC -2.47%.", "angle": "The 1-of-168 stat is the cleanest read I've seen on US spot demand in ETH. US allocators aren't buying; derivatives are doing the selling.", "tweetA": "One hour out of 168. That is how often US buyers paid a premium for ETH this week. ETF outflows -$486M and futures taker-sell dominant. The question isn't whether ETH is cheap, it's who is left to buy. $ETH", "tweetB": "BTC -2.5%, ETH -7.6%, SOL -9.6%. When ETH underperforms BTC by 5 points in a down week and the Coinbase premium is dead, the beta in this market is just leverage unwinding.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://ittechpl.substack.com/p/recent-buyers-sold-at-a-loss-198", "id": 9}, {"cat": "crypto", "urgency": "watch", "source": "IT Tech PL (Onchain Insights)", "title": "Bitcoin miners were last of 25 sectors for the second week: -11.0% after -6.2%", "idea": "Artemis' five-day view has Bitcoin Miners dead last for a second consecutive week. DeFi Lending & Yield -6.0%, Stablecoins & RWA -4.6%, Exchanges -4.3%. Smart Contract Platforms +3.4% was the only crypto sector green, while Vertical SaaS led equities at +8.5% and the S&P slipped 0.7%. BTC.D rose to 60.08%.", "angle": "Miners dropping 17% in two weeks while BTC is down about 4% is a margin-and-AI-pivot story: power costs, hashprice, and the market not rewarding the HPC narrative anymore. $MARA $RIOT", "tweetA": "Miners -11% after -6.2%, two straight weeks dead last out of 25 sectors, while BTC drops 4%. That's not a BTC beta story. Hashprice and power cost are doing it. $MARA $RIOT $CLSK", "tweetB": "Vertical SaaS +8.5% while the S&P is -0.7% and crypto bleeds. Software, the AI-loser trade, is the best sector in the week that risk assets get sold. Nobody has that on their bingo card.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://ittechpl.substack.com/p/recent-buyers-sold-at-a-loss-198", "id": 10}, {"cat": "geopolitics", "urgency": "deep", "source": "IT Tech PL (Onchain Insights)", "title": "Trump ruled out a US strike on Iran before the November midterms; Brent still $100-103", "idea": "On Oct 9 Trump ruled out a US strike on Iran before the midterms. Brent eased to ~$103 and BTC bounced back above $82.5K. The week's broader driver was Hormuz supply risk, Brent $100-103, and liquidations over $2.4B in crypto derivatives, mostly longs, in the anniversary week of the Oct 10, 2025 $19B crash.", "angle": "A political deadline on military action is a time-limited put on oil. It also sets up a post-midterm gap risk — the market is now trading a calendar, not a threat.", "tweetA": "Trump takes a US strike off the table until November. Brent barely moved, still $100+. That tells you the market doesn't think a strike was the risk. It thinks Hormuz is. $USO $XLE", "tweetB": "Strike off the table 'until after the midterms.' That is the most specific oil-calendar risk I've seen: a stated expiry date. Positioning for November 4th is a trade no one wanted to have in October.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://ittechpl.substack.com/p/recent-buyers-sold-at-a-loss-198", "id": 11}, {"cat": "macro", "urgency": "deep", "source": "IT Tech PL (Onchain Insights)", "title": "10Y above 5.3%, markets price a hold on Oct 28 with a hike still possible by December", "idea": "The single sentence driving the week: Brent near $100-103 on Hormuz risk plus the 10Y above 5.3% took back the rally. The market now prices a hold on Oct 28 and still sees a December hike chance. September CPI is on Oct 14.", "angle": "Note the date discrepancy vs Bubble Bubble: CPI is Wednesday Oct 14. Both agree the Oct 28 meeting is the next hard catalyst.", "tweetA": "A 5.3% 10Y with a Fed priced on hold. That's the bond market doing the hiking for them. Every 25bp the long end adds is worth one Fed hike without a vote.", "tweetB": "The market sees a hold on the 28th and a hike by December. Hold-then-hike is the most painful path for anyone long duration: the forward curve was never going to be your friend.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://ittechpl.substack.com/p/recent-buyers-sold-at-a-loss-198", "id": 12}, {"cat": "credit", "urgency": "deep", "source": "Dark Side of the Boom", "title": "Morgan Stanley: Oracle's data-centre delay isn't capex relief, it's a refinancing-clock problem", "idea": "MS credit (Lindsay Tyler, Benjamin Guerrero) argue delayed campuses push monetization of Oracle's enormous AI backlog behind financing assumptions. Power is the bottleneck at several major campuses. Delayed GPU purchases can bunch spend into a narrow window just as lease liabilities and debt maturities arrive. Oracle CDS is at record wides with tens of billions of construction debt tied to power-constrained sites.", "angle": "The credit market is pricing execution risk before the equity story does. Power as the binding constraint turns a construction slip into a revenue and refinancing mismatch.", "tweetA": "The comforting version: delay the campus, delay the GPU spend, save cash. The Morgan Stanley version: the revenue clock slips and the debt clock doesn't. Record CDS says credit sides with MS. $ORCL", "tweetB": "You can buy GPUs with a bond. You can't buy a substation with one. Oracle's backlog is a promise to deliver power that isn't connected yet, and the lenders are starting to price the gap.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/oracles-ai-buildout-is-running-into", "id": 13}, {"cat": "positioning", "urgency": "deep", "source": "Callum Thomas / Weekly S&P500 ChartStorm", "title": "Equal-weighted S&P followed the seasonal script almost exactly while the cap-weighted index hid it", "idea": "The headline S&P didn't show a seasonal slump, but the equal-weighted index tracked the typical seasonal pattern closely, rebounding off lows in line with it. Breadth is ticking up after a hefty reset, and the cap-weighted index notched a new all-time high. Election-cycle seasonality implies a Q4 rally into a pre-election-year upturn in 2027 — though Thomas asks whether some of it has already been pulled forward.", "angle": "The seasonal pattern was there; the cap-weighted index just masked it. Equal-weight vs cap-weight divergence is the real regime signal into year-end.", "tweetA": "The seasonal slump happened. You just couldn't see it in the S&P 500. The equal-weight index took the hit and bounced on schedule while five stocks kept the headline flat. $RSP $SPY", "tweetB": "Everyone is waiting for the post-midterm rally. If the Iran war already did the 'reset' in H1, then 2027 may be the pull-forward year in reverse. Seasonality is a map; it doesn't know about the war.", "charts": {"count": 3, "hot": false, "desc": "Equal-weight vs seasonal chart, election cycle chart"}, "link": "https://chartstorm.substack.com/", "id": 14}, {"cat": "AI/infra", "urgency": "deep", "source": "Callum Thomas / Weekly S&P500 ChartStorm", "title": "SMH has closed lower four days in a row (Tue-Fri) with a lower high — the main engine of the bull market", "idea": "Semis are slipping: SMH made a lower high, breadth rolled over from overbought, and closed lower each of Tue/Wed/Thu/Fri. Thomas calls it concerning for the supposed main engine of the bull market.", "angle": "Four down days with a lower high while the S&P prints an ATH is a divergence. Semis ate the market for two years; if they lead down, the headline index needs another leader.", "tweetA": "S&P at an all-time high. SMH down four straight days with a lower high. Either leadership rotates or the index follows semis down. I don't see what else holds it up. $SMH $NVDA", "tweetB": "Semis -4 days in a row is noise. Semis -4 days in a row after breadth was overbought, while software is the top sector, is a rotation. Watch what Vertical SaaS does next week. $SMH", "charts": {"count": 1, "hot": false, "desc": "SMH price and breadth chart"}, "link": "https://chartstorm.substack.com/", "id": 15}, {"cat": "AI/infra", "urgency": "deep", "source": "Callum Thomas / Weekly S&P500 ChartStorm", "title": "Semis market-cap weight is slipping from ATH, but earnings share only partly justifies it — the gap is the risk", "idea": "Thomas updated the semiconductor sector cap-weight chart and added earnings share. Earnings share partially justifies cap share, but the market is front-running higher earnings still to come. Combined PE (avg of forward, trailing, CAPE) is elevated; the risk case is overbuilt datacenters and supernormal profits attracting competition.", "angle": "The risk is not today's earnings, it is the slope of the grey earnings-share line. If it plateaus, the cap-weight gap has nowhere to close from.", "tweetA": "Semis' share of S&P earnings justifies most of their share of market cap. 'Most' is the problem. The gap is a bet on a line that has to keep rising. $SOXX", "tweetB": "New paradigm of earnings or not, supernormal profits have one reliable consequence: supply. Every cycle in this sector ended with capacity, not demand, killing the margin. $AMD $INTC $TSM", "charts": {"count": 2, "hot": true, "desc": "Semis cap weight vs earnings share; combined PE chart"}, "link": "https://chartstorm.substack.com/", "id": 16}, {"cat": "credit", "urgency": "deep", "source": "Callum Thomas / Weekly S&P500 ChartStorm", "title": "Effective borrowing cost of S&P 500 companies is turning up after decades of decline — with a lag", "idea": "Chart of the effective interest rate S&P 500 companies pay on net borrowing: the recent yield surge will flow through with a lag, raising interest expense in coming quarters and reinforcing the end of the multi-decade decline in effective rates (echoing the same turn in effective tax rates).", "angle": "Falling effective tax and interest rates were two of the quiet margin tailwinds of the last 30 years. Both reversing at once is a margin story nobody has in their 2027 numbers.", "tweetA": "Corporate tax rate and corporate interest rate both stopped falling. Two of the quiet margin tailwinds of 30 years, gone in the same cycle. Where's that in the 2027 EPS consensus?", "tweetB": "The 10Y above 5.3% doesn't hit this quarter's earnings. It hits the refi of every 2020-21 bond maturing in 2027. That's the lag Thomas is charting.", "charts": {"count": 1, "hot": false, "desc": "Effective borrowing cost vs bond yields"}, "link": "https://chartstorm.substack.com/", "id": 17}, {"cat": "macro", "urgency": "watch", "source": "Callum Thomas / Weekly S&P500 ChartStorm", "title": "Top 5 S&P 500 stocks now equal the bottom 434 combined", "idea": "Michael Batnick chart: the top 5 stocks by weight equal the bottom 434. Thomas reads it as structural technology shifts plus market anticipation of a permanently higher path for top-end earnings. His composite valuation signal is 'expensive' with ERP very expensive on the bond-yield surge; stance remains 'pragmatically bullish' with policy as swing factor, neutral but tightening.", "angle": "Concentration + ERP at extremes + policy tightening. Thomas's own 5-factor table says the swing factor is the one moving the wrong way.", "tweetA": "Five stocks equal 434 stocks. Add a 5.3% 10Y and an ERP the author calls 'very expensive.' Pragmatically bullish is doing a lot of work in that outlook.", "tweetB": "1987 says it drops without warning, 1999 says expensive can stay expensive, 2008 says it topples without being expensive. Valuation tells you the size of the fall, never the date. That's why it's the least tradeable accurate indicator.", "charts": {"count": 1, "hot": true, "desc": "Top 5 vs bottom 434 concentration chart"}, "link": "https://chartstorm.substack.com/", "id": 18}, {"cat": "macro", "urgency": "deep", "source": "Tavi Costa", "title": "Mortgage rates approaching 7.5%: 'one of the most important charts in the current macro environment'", "idea": "Tavi Costa flags mortgage rates nearing 7.5% as tightening 'a belt until you can barely breathe': buyers priced out, sellers locked in, residential construction slows. He expects government intervention to become increasingly likely and closes with 'none of us own enough hard assets.' Newsletter title: Top 40 Charts.", "angle": "7.5% mortgages with 10Y at 5.3% is housing as the transmission channel for hikes. Intervention means GSE/agency-MBS support or yield-curve control — both are hard-asset-bullish.", "tweetA": "7.5% mortgages. Locked-in sellers, priced-out buyers, falling construction. The Fed doesn't need to hike for housing to break, the long end already did it. The intervention that follows is what I'd position for.", "tweetB": "Housing stuck at 7.5% creates a policy reflex: when buyers can't buy, Washington subsidises the buyer or caps the rate. Either route is a debasement trade. The 'hard assets' line is the entire thesis in three words.", "charts": {"count": 1, "hot": true, "desc": "Mortgage rate chart; 40 charts inside — worth opening"}, "link": "https://tavicosta.substack.com/p/top-40-charts", "id": 19}, {"cat": "positioning", "urgency": "watch", "source": "Norseman Market Timing", "title": "Huginn fund stays 120% long S&P 500 this week", "idea": "Norseman's trend-following 'Huginn' fund (S&P-only, leveraged where conditions allow) made no change and remains 120% long. Philosophy: stay invested through the full bull market and adjust, rather than jump in and out on short-term moves.", "angle": "A rules-based trend follower still levered long with the 10Y above 5.3% is a useful sentiment datapoint: trend systems
