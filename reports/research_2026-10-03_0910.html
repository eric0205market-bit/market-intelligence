const ITEMS = [{"id": 1, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / Goldman (Snider) — Q3 Earnings", "title": "Ten companies = 68% of Q3 S&P EPS growth; Micron + Nvidia alone are over a third", "idea": "Goldman's Snider has consensus at +27% y/y S&P 500 EPS for Q3, the strongest pre-season setup since 2021 (Q2 was 33% distortion-adjusted). But 10 names deliver 68% of the growth, and MU + NVDA account for more than one third of that.", "angle": "Index EPS is a two-stock story. Equal-weight and cyclicals are the real test; a miss at either memory/compute name moves the whole aggregate.", "tweetA": "27% EPS growth sounds like a broad boom. Strip out 10 companies and you're holding a market that earns like 2019. Micron and Nvidia are a third of the engine. $MU $NVDA", "tweetB": "If two tickers are >1/3 of 68% of index earnings growth, the S&P is a levered AI-memory/compute fund with a 498-stock tracking error. What's your single-name risk when you 'own the index'?", "charts": {"count": 0, "hot": false, "desc": "Earnings concentration chart likely inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/q3-earnings-still-have-the-horsepower"}, {"id": 2, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / Goldman (Snider) — Q3 Earnings", "title": "Hyperscaler capex +116% y/y in Q3 — the question flips to monetization", "idea": "Q3 hyperscaler capex expected +116% y/y. Goldman looks for cloud revenue growth to accelerate from 48% in Q2 to 55% in Q3. The author's framing: the market knows the winners can spend; Q3 tests whether the money comes back through the door.", "angle": "The capex-to-cloud-revenue ratio is the number to watch. Capex doubling while revenue growth goes 48→55 is still a widening gap, which is where depreciation and financing costs bite (see data center HY bonds pricing at a discount).", "tweetA": "Capex +116%. Cloud revenue growth 48% to 55%. Spending is growing at 2x the pace of the revenue it's meant to produce. That gap has to be financed by someone, and the HY market is already asking for a discount.", "tweetB": "I don't care about the capex number anymore, everyone has priced it. The tell in Q3 is whether cloud growth beats 55% AND depreciation guidance stays sane. That's the whole AI trade in one print.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/q3-earnings-still-have-the-horsepower"}, {"id": 3, "cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom / Goldman (Snider) — Q3 Earnings", "title": "Index near records, median stock far from its highs, median EPS growth slowing", "idea": "The author notes the index sits near record territory while the median stock remains much further from highs and median company earnings growth is slowing. Q3 is whether the rest of corporate America can start carrying some of the load.", "angle": "Breadth divergence plus a rising 10y (see FX piece) is the setup where cap-weight keeps working until a duration shock hits the concentrated leaders.", "tweetA": "Record index. Median stock nowhere near its high. Median earnings growth slowing. Both statements are true, which is exactly how a narrow market looks right before it matters that it's narrow.", "tweetB": "Rates are up, financial conditions are tighter, and the median company's EPS growth is decelerating. Who is the marginal buyer of the other 490 stocks?", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/q3-earnings-still-have-the-horsepower"}, {"id": 4, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom — FX Weekly", "title": "The dollar is at its strongest point of the year, but 'carry unwind' beats 'regime change'", "idea": "USD starts Q4 at its YTD high after months of suppressed FX vol. Author argues the move looks like a large carry book squeezed through a narrow exit, because yields repriced on strong growth, not on central banks changing reaction functions. With the Fed willing to wait and Asian policymakers managing FX firmly, chasing here is poor; tactical fade interest is rising even as medium-term USD risk skews higher.", "angle": "Growth-led repricing vs hawkish policy shock is the distinction that decides whether USD is a 2-week or a 6-month trade.", "tweetA": "Everyone is calling the dollar breakout. Growth-driven yield repricing flushes carry; a policy shock rewrites the cycle. Different trades, different durations. Know which one you're in before you chase DXY.", "tweetB": "USD strongest of the year while the Fed says it can wait. That's not a hawkish dollar, that's a forced-liquidation dollar. Those retrace faster than anyone sizes for.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/fx-weekly-dont-get-carried-away-the"}, {"id": 5, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom — FX Weekly", "title": "The 10-year is the FX speed limit: 20-30bp monthly move and carry loses altitude", "idea": "The author's rule of thumb: once monthly moves in the US 10y push past roughly 20-30bp, even good carry trades start failing, and currencies shift from relative-value to funding-survival behavior. 'Carry still has a speed limit, and the US Treasury market controls it.'", "angle": "A quantified threshold is tradeable: it turns UST vol into a signal for sizing EM and G10 carry.", "tweetA": "20-30bp. That's the monthly 10y move where carry stops being a strategy and becomes a collateral problem. Put it on your screen next to USDJPY and MXN.", "tweetB": "Most risk models treat carry as a spread. It behaves like a short option on Treasury volatility, with a strike around 25bp a month. Priced accordingly? Mostly not.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/fx-weekly-dont-get-carried-away-the"}, {"id": 6, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom — FX Weekly", "title": "Euro needs contagion: BTPs moving with OATs changed France from a French story to a European one", "idea": "EUR usually ignores local sovereign stress, but when Italian spreads started moving with French OATs it turned regional. Historic sensitivity is roughly a 4-5% EUR decline per 100bp of sovereign spread widening during genuine stress. Worst case is Bund yields falling while peripherals rise, which tightens conditions on the ECB's behalf and removes its room to stay hawkish.", "angle": "Different from a 2011 setup: ECB is still trying to tighten, growth is resilient and energy costs are higher. Spread beta regime-switches rather than drifting.", "tweetA": "EUR beta to sovereign spreads is ~0 until it's 4-5% per 100bp. BTPs just started trading with OATs. I'd want to know where that regime switch triggers before I'm long anything with EUR in the name.", "tweetB": "Bunds rallying while BTPs and OATs sell off means the periphery is tightening for the ECB. The central bank wanted tighter conditions; it may get more than it ordered, and then the currency pays.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/fx-weekly-dont-get-carried-away-the"}, {"id": 7, "cat": "macro", "urgency": "watch", "source": "Dark Side of the Boom — FX Weekly", "title": "CHF funding trade bit back, but this isn't an old-school European crisis", "idea": "Swiss franc squeezed as European stress hit crowded CHF funding positions. But the author says capital flight should be limited: yields are rising on easier fiscal policy and resilient growth rather than a collapsing economy, and Switzerland still has the lowest policy rate in the developed world, so the SNB has little reason to resist depreciation. Funding case 'mostly intact'.", "angle": "Tactical: squeeze fade vs structural short CHF remains. Watch whether European bank stress changes the capital-flight assumption.", "tweetA": "Funding currencies are obedient until everyone needs the leg back at once. CHF just reminded the market. The question is whether the old safe-haven flows show up, and this time the macro says they shouldn't.", "tweetB": "CHF squeeze with the lowest policy rate in DM and no collapsing European economy behind it. That's a positioning event, not a regime change. Those are the ones you fade.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/fx-weekly-dont-get-carried-away-the"}, {"id": 8, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom — FX Weekly", "title": "Sterling: a ~6% Brexit valuation scar, EUR/GBP lower, and the Autumn Budget as the catalyst", "idea": "EUR/GBP fell as UK political messaging landed better and euro carried sovereign baggage. The research estimates ~6% cumulative Brexit valuation hit, an upside tail if trade frictions were unwound. But UK front-end is priced for more BoE tightening than G10 can support; if OATs and BTPs calm, the rates differential returns and October upside risk to EUR/GBP reappears.", "angle": "GBP gets a cyclical tailwind from euro weakness but its own fiscal risk sits one budget away.", "tweetA": "GBP is winning a beauty contest it didn't enter. EUR/GBP lower because Europe's credit is wobbling, not because the UK fixed anything. If OATs calm down, so does the trade.", "tweetB": "There's a theoretical ~6% sterling re-rating if the EU relationship thaws. There's also an Autumn Budget before that. Guess which one the market trades first.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/fx-weekly-dont-get-carried-away-the"}, {"id": 9, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom — FX Weekly", "title": "RBA hikes unanimously (fourth hike) and AUD sells off; the cleaner trade is EUR/AUD", "idea": "Australia delivered a unanimous hike, but the press conference signaled conditions are already restrictive and the four hikes delivered will be left to work. AUD fell anyway. Author still sees AUD as one of the better G10 stories (terms of trade, carry, fiscal resilience), prefers EUR/AUD, and expects RBA to hold then ease in H2 2027. Risk: AUD correlates with NZD and the Scandis if bonds crack equities.", "angle": "'Hike and the currency falls' is a positioning tell: the market priced more than the RBA delivered.", "tweetA": "RBA hiked unanimously and AUD sold off. When good news can't lift the currency, you're looking at a market that was already positioned for the next hike. Fade the narrative, not the fundamentals.", "tweetB": "If you like AUD carry but hate global duration risk, the author's answer is EUR/AUD: be long the growth story against the one with a sovereign credit discount. It's a cleaner expression than AUD/USD in a rising-yield tape.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/fx-weekly-dont-get-carried-away-the"}, {"id": 10, "cat": "geopolitics", "urgency": "deep", "source": "Dark Side of the Boom — FX Weekly", "title": "EM FX unwind: MXN took the hit, COP defended with a 12.25% hike, BRL waits on an election", "idea": "The peso came in strong, expensive and at historically low implied vol while Banxico stayed relaxed on matching Fed tightening, so MXN became the pressure valve. Colombia hiked proactively to 12.25% and finished among the stronger performers. Brazil sits in the middle with an election pending; PLN and CLP underperformed, THB and ILS moved in line.", "angle": "Natural experiment on central-bank credibility under duration shock: defend with real ammunition and carry survives.", "tweetA": "MXN: strong, expensive, low vol, relaxed central bank. Colombia hiked to 12.25% and got its currency back. Same shock, opposite outcome, and the difference was one central banker.", "tweetB": "Brazil's relative resilience is the risk, not the strength. If the election lands badly BRL has catching down to do against peers that already took their medicine.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/fx-weekly-dont-get-carried-away-the"}, {"id": 11, "cat": "AI/infra", "urgency": "act", "source": "Michael Parekh / AI-RTZ #1228", "title": "Anthropic roadshow by mid-October, IPO pricing before Thanksgiving at a $1.8-2T valuation", "idea": "Investors meet at Anthropic's SF HQ as early as Oct 14, formal marketing as soon as the week of Nov 9, pricing ahead of Nov 26. Valuation talk is $1.8-2T, aiming to match or beat SpaceX's record June IPO. It has two straight quarters of positive adjusted operating income and, per The Information, now ends enterprise discounts when big customers hit usage caps, a line OpenAI isn't matching. Headwinds: frontier safety 'Blip 3.0', AI incidents rising, choppy IPO market.", "angle": "The largest tech IPO supply event in history lands in the same window as rising 10y yields. Supply absorption and index inclusion flows matter.", "tweetA": "Anthropic prices at $1.8-2T before Thanksgiving. For comparison, that is bigger than almost every company in the S&P other than the top handful. The question isn't whether demand exists, it's what gets sold to make room.", "tweetB": "Two quarters of positive adjusted operating income, and it's ending enterprise discounts at usage caps. That's pricing power. OpenAI delaying to 2027 while Anthropic goes first is the quiet competitive signal here.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-ipo-go-time-openais"}, {"id": 12, "cat": "AI/infra", "urgency": "act", "source": "Michael Parekh / AI-RTZ #1228", "title": "OpenAI raising $30B+ at $1.4T, up from ~$850B in March; IPO pushed to 2027", "idea": "Pre-IPO round valued above $1.4T vs ~$850B when it raised $122B in March, a ~65% step-up in about six months. Altman told Bloomberg TV they want to get through the period of heightened AI safety concerns first. Enterprise revenue crossed consumer this summer; OpenAI is halving prices on new models via intermediaries to take share from Anthropic. 1.2B+ weekly users.", "angle": "Private marks are now leading public ones. The delay + price cuts also reads as a defensive posture vs Anthropic.", "tweetA": "$850B to $1.4T in six months, in a private round, while the IPO gets pushed back a year. That's not a company that needs the public market. It's one that prefers it later, and cheaper-to-defend pricing signals why.", "tweetB": "OpenAI enterprise revenue just passed consumer, and it's halving model prices to chase Anthropic. When your biggest competitor is ending discounts and you're cutting 50%, someone has misread the elasticity.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-ipo-go-time-openais"}, {"id": 13, "cat": "tech", "urgency": "deep", "source": "Michael Parekh / AI-RTZ #1228", "title": "OpenAI Dots: always-on agents that don't count against token limits; GPT-6.1 Sol at ~1/5 the price of Astra, plus a $500/month tier", "idea": "Fourth Dev Day: Dots are always-on agents that use a computer, research, draft and code, accessible via ChatGPT, Slack or Teams, organized in 'Spaces'. GPT-6.1 Sol is close to top model Astra at about a fifth of the price. Dots usage doesn't count against token limits. Author warns of agent overpopulation (Dots, Muse, Instinct, Anthropic's coming) and cognitive overload.", "angle": "Pricing architecture is the story: a $500 tier plus unmetered agent usage, while Anthropic holds the line on usage-cap discounts.", "tweetA": "A model at 1/5 the price of the flagship, and agent usage that doesn't burn tokens. Inference cost per unit of work is falling faster than anyone's capex model assumes. Who underwrites that?", "tweetB": "Dots, Muse, Instinct, Anthropic's agents. The next bottleneck isn't compute, it's the human who has to supervise four always-on blobs with names. Attention is the scarce input.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-ipo-go-time-openais"}, {"id": 14, "cat": "tech", "urgency": "deep", "source": "Michael Parekh / AI-RTZ #1228", "title": "Gemini 4 Argon: Google's first top-end model in 7+ months, tied with GPT-6 Astra, Anthropic still leads", "idea": "Argon launches first to trusted cybersecurity partners with early US government access. Artificial Analysis has it tied with GPT-6 Astra, Anthropic still ahead, and the lowest hallucination rate among leading models. Some Google employees doubt real-world coding performance. Google skipped the promised Gemini 3.5 Pro in June and had been prioritizing compute for business customers; new AI chief Koray Kavukcuoglu is putting commercial priorities first.", "angle": "Frontier leaderboard is now a three-way tie in capability with differentiation moving to reliability, distribution and cost.", "tweetA": "Gemini 4 ties GPT-6 Astra with the lowest hallucination rate, shipped first to cyber partners and the US government. The frontier is being released like a controlled asset now, not a product.", "tweetB": "Google skipped a model, took seven months, and is back in a tie. Meanwhile the leader hasn't changed. In a market where capability converges, the moat is who gets the discount-free contract.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-ipo-go-time-openais"}, {"id": 15, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ #1228", "title": "SpaceXAI becomes 'Elon Web Services': Anthropic ~$85B committed, 420k Nvidia GPUs in Memphis in November", "idea": "SpaceXAI is accelerating into a bigger AI cloud business than planned. Anthropic has committed about $85B to its compute; Google is another big customer and Microsoft talks have occurred. ~420,000 Nvidia GPUs come online in Memphis in November. Financing is getting pricier: all four high-yield data center bond deals since July priced at a discount, including one for a Meta data center.", "angle": "Anthropic renting from a competitor's lab at $85B is a counterparty-concentration story. And discounts on HY data-center paper are the first financing stress signal.", "tweetA": "Anthropic has $85B committed to compute run by Elon Musk's company. The IPO prospectus risk-factor section writes itself.", "tweetB": "Four for four: every HY data center bond since July priced at a discount, including one backing Meta. Equity says the buildout is infinite; the credit desk is asking for more yield. Pay attention to the credit desk. $NVDA $META", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-ipo-go-time-openais"}, {"id": 16, "cat": "regulation", "urgency": "watch", "source": "Michael Parekh / AI-RTZ #1228", "title": "Frontier AI 'incidents' go from a trickle to a flood — safety is now gating IPO timing", "idea": "The roundup flags 'The Blip 3.0' on frontier model safety, with AI incidents rising sharply, as a headwind for Anthropic's IPO and the reason Altman gives for pushing OpenAI's listing to 2027. Also an 'additional item' on a timely profile of ASML CEO Christophe Fouquet.", "angle": "Safety incident frequency is becoming an input to capital-markets timing and valuation. A regulatory or disclosure shock would hit both IPOs.", "tweetA": "Two largest AI labs, two opposite IPO calendars, one shared stated risk: safety incidents. When Altman says the IPO waits for 'heightened safety concerns' to pass, that is a risk factor, disclosed in advance.", "tweetB": "AI incidents going from trickle to flood has a second-order effect nobody prices: insurance, liability and disclosure rules. The first large frontier-model loss event will set the regulatory template for the whole sector.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-ipo-go-time-openais"}];

    '<div class="tw"><div><div class="lbl" style="color:#378add">TWEET A</div>'+esc(item.tweetA)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>'+
    '<div><div class="lbl" style="color:#7f77dd">TWEET B</div>'+esc(item.tweetB)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>'+
    '<div class="ch'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING — ':'')+esc(item.charts.desc)+'</div>'+
    '<p><a href="'+item.link+'" target="_blank">↗ Read full article</a></p></div></div>';
  });
  document.getElementById("cards").innerHTML=out||"<p>No items.</p>";
}
function init(){
  document.getElementById("sub").textContent=META.date+" · "+META.time+" · "+ITEMS.length+" items";
  var r="<p>Window: "+META.windowStart+" to "+META.windowEnd+". Emails outside this window were not processed.</p><p>Emails in window: "+META.emailsInWindow+" · read: "+META.emailsRead+" · items: "+META.itemsExtracted+"</p><p><b>Included sources</b> (click to filter):<br>";
  META.includedSources.forEach(function(s,k){r+='<span class="sl" data-k="'+k+'">'+esc(s.name)+'</span> — '+s.items+' items<br>'});
  r+="</p><p><b>Skipped:</b><br>"+META.skippedSources.map(esc).join("<br>")+"</p>";
  document.getElementById("rep").innerHTML=r;
  Array.prototype.forEach.call(document.querySelectorAll(".sl"),function(e){e.onclick=function(){filterBySrc(META.includedSources[+e.getAttribute("data-k")].name)}});
  render();
}
init();
</script></body></html>
