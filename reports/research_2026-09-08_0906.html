const META = {
  date: "2026-09-08",
  time: "09:06 CEST",
  windowStart: "2026-09-08 03:06 CEST",
  windowEnd: "2026-09-08 09:06 CEST",
  emailsInWindow: 11,
  emailsRead: 11,
  itemsExtracted: 14,
  includedSources: [
    { name:"John Authers (Bloomberg Opinion) via Dark Side of the Boom", count:4, note:"Same underlying John Authers piece reached the inbox via two channels (Dark Side of the Boom's summary + Bloomberg's own Points of Return newsletter); consolidated as one source line, extracted into 4 distinct sub-items given the volume of distinct data points/charts." },
    { name:"MacroEdge", count:1 },
    { name:"BowTiedBull", count:1 },
    { name:"Michael Parekh (AI-RTZ #1203)", count:2 },
    { name:"Dark Side of the Boom (Deutsche Bank Research)", count:1 },
    { name:"Checkonchain", count:1 },
    { name:"Dark Side of the Boom (Goldman Sachs research)", count:1 },
    { name:"Dark Side of the Boom (+ Bloomberg / David Fickling)", count:1 },
    { name:"Callum Thomas (Topdown Charts)", count:1 },
    { name:"Vik's Newsletter", count:1 }
  ],
  skippedSources: [],
  skippedNote: "All 11 emails in the 6-hour window contained extractable analytical content — none were skipped as empty/promotional/automated."
};

function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function catCounts(){
  const m={};
  ITEMS.forEach(i=>{ m[i.cat]=(m[i.cat]||0)+1; });
  return m;
}
function urgCounts(){
  const m={red:0,deep:0,watch:0};
  ITEMS.forEach(i=>{ m[i.urgency]=(m[i.urgency]||0)+1; });
  return m;
}

function renderFilters(){
  const cc = catCounts();
  const catBar = document.getElementById('catFilters');
  catBar.innerHTML = '';
  const allPill = el('button','pill'+(activeCat==='all'?' active':''), 'All <span class="count">'+ITEMS.length+'</span>');
  allPill.style.background = activeCat==='all' ? '#333' : '';
  allPill.onclick = ()=>{ activeCat='all'; activeSrc=null; renderAll(); };
  catBar.appendChild(allPill);
  Object.keys(cc).sort().forEach(cat=>{
    const color = CATCOLORS[cat] || '#888';
    const p = el('button','pill'+(activeCat===cat?' active':''), cat+' <span class="count">'+cc[cat]+'</span>');
    if(activeCat===cat){ p.style.background=color; p.style.borderColor=color; }
    p.onclick = ()=>{ activeCat = (activeCat===cat? 'all': cat); activeSrc=null; renderAll(); };
    catBar.appendChild(p);
  });

  const uc = urgCounts();
  const urgBar = document.getElementById('urgFilters');
  urgBar.innerHTML='';
  const allU = el('button','pill'+(activeUrg==='all'?' active':''), 'All <span class="count">'+ITEMS.length+'</span>');
  allU.style.background = activeUrg==='all' ? '#333' : '';
  allU.onclick = ()=>{ activeUrg='all'; activeSrc=null; renderAll(); };
  urgBar.appendChild(allU);
  ['red','deep','watch'].forEach(u=>{
    const p = el('button','pill'+(activeUrg===u?' active':''), URGLABEL[u]+' <span class="count">'+uc[u]+'</span>');
    if(activeUrg===u){ p.style.background = u==='red'?'#e24b4a':(u==='deep'?'#378add':'#ef9f27'); p.style.borderColor='transparent'; }
    p.onclick = ()=>{ activeUrg = (activeUrg===u? 'all': u); activeSrc=null; renderAll(); };
    urgBar.appendChild(p);
  });
}

function renderCards(){
  const wrap = document.getElementById('cards');
  wrap.innerHTML = '';
  let shown = 0;
  ITEMS.forEach((item, idx)=>{
    if(activeCat!=='all' && item.cat!==activeCat) return;
    if(activeUrg!=='all' && item.urgency!==activeUrg) return;
    if(activeSrc && item.source.indexOf(activeSrc)===-1) return;
    shown++;
    const color = CATCOLORS[item.cat] || '#888';
    const card = el('div','card'+(activeSrc? ' open':''));
    card.id = 'card-'+item.id;

    const header = el('div','card-header');
    const chartFlag = item.charts && (item.charts.hot ? ' 🔥' : (item.charts.count>0 ? ' 📊' : ''));
    header.innerHTML =
      '<span class="idx">'+String(idx+1).padStart(2,'0')+'</span>'+
      '<span class="urg">'+URGEMOJI[item.urgency]+'</span>'+
      '<span class="badge" style="background:'+color+'">'+item.source+'</span>'+
      '<span class="cattag">'+item.cat+'</span>'+
      (chartFlag? '<span class="chartflag">'+chartFlag+'</span>' : '')+
      '<span class="title">'+item.title+'</span>'+
      '<span class="chev">▶</span>';
    header.onclick = ()=>{ card.classList.toggle('open'); };
    card.appendChild(header);

    const body = el('div','card-body');
    body.innerHTML =
      '<div class="section-label">The Idea</div>'+
      '<div class="idea-text">'+item.idea+'</div>'+
      '<div class="section-label">My Angle</div>'+
      '<div class="angle-box" style="--accent:'+color+'">'+item.angle+'</div>'+
      '<div class="tweets">'+
        '<div class="tweet a"><div class="tweet-label">TWEET A</div><div class="tweet-text">'+item.tweetA+'</div>'+
          '<button class="copy-btn" onclick="copyTweet('+item.id+',\'a\')">📋 Copy</button></div>'+
        '<div class="tweet b"><div class="tweet-label">TWEET B</div><div class="tweet-text">'+item.tweetB+'</div>'+
          '<button class="copy-btn" onclick="copyTweet('+item.id+',\'b\')">📋 Copy</button></div>'+
      '</div>'+
      '<div class="charts-box'+(item.charts && item.charts.hot ? ' hot':'')+'">'+
        (item.charts && item.charts.count>0 ? item.charts.count+' chart(s). ' : 'No charts embedded. ')+
        (item.charts ? item.charts.desc : '')+
      '</div>'+
      '<div class="link-row"><a href="'+item.link+'" target="_blank" rel="noopener">↗ Read full article</a></div>';
    card.appendChild(body);
    wrap.appendChild(card);
  });
  if(shown===0){
    wrap.appendChild(el('div','empty','No items match this filter.'));
  }
}

function renderReport(){
  const b = document.getElementById('reportBody');
  let html = '';
  html += '<h4>Time Window</h4><div>'+META.windowStart+' → '+META.windowEnd+'. Emails outside this window were not processed.</div>';
  html += '<h4>Totals</h4><div>'+META.emailsInWindow+' emails in window · '+META.emailsRead+' read · '+META.itemsExtracted+' items extracted.</div>';
  html += '<h4>Included Sources</h4>';
  META.includedSources.forEach(s=>{
    html += '<div><span class="srcname" onclick="filterBySrc(\''+s.name.replace(/'/g,"\\'")+'\')">'+s.name+'</span> — '+s.count+' item(s)'+(s.note? ' <span style="color:var(--text-dim)">('+s.note+')</span>':'')+'</div>';
  });
  html += '<h4>Skipped Sources</h4><div>'+(META.skippedSources.length? META.skippedSources.join(', ') : 'None. '+META.skippedNote)+'</div>';
  b.innerHTML = html;
}

function filterBySrc(name){
  activeSrc = name;
  activeCat = 'all';
  activeUrg = 'all';
  renderAll();
  document.getElementById('cards').scrollIntoView({behavior:'smooth'});
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function renderAll(){
  renderFilters();
  renderCards();
}

function init(){
  document.getElementById('headerMeta').textContent =
    META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails';
  renderAll();
  renderReport();
}
init();
</script>
