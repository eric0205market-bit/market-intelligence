ty. CRWV bonds are the cleanest read on financing stress.", "tweetA": "Everyone with a private OpenAI or Anthropic stake needs a hedge, and the only liquid one is CoreWeave. So the stock isn't pricing CoreWeave, it's pricing the cost of insurance on the whole cycle. 15% yield, no news. $CRWV", "tweetB": "Demand isn't the problem: CoreWeave just told customers GPU-hour prices go up another 10%. The problem is a 15% cost of capital on a business that borrows against 2.5-year contracts. Both can be true until refinancing.", "charts": {"count": 1, "hot": true, "desc": "CoreWeave bond-yield chart Musk reposted - 🔥 CHART WORTH SAVING (in the linked The Information piece)"}, "link": "https://michaelparekh.substack.com/p/ai-nvidias-170-billion-neocloud-safety", "id": 2}, {"cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "Non-hyperscaler customers are 45% of Nvidia DC revenue (~$40B) while NVDA CDS roughly doubled", "idea": "Neoclouds plus enterprises were 45% of Nvidia data center revenue in the July quarter, about $40B, more than 2x year on year. Investors are asking for more protection on Nvidia's own debt: CDS spreads roughly doubled in recent months. Parekh's historical rhyme: equipment makers financing customers' build-outs in the late-90s telecom boom.", "angle": "The diversification away from the 'frenemy' hyperscalers is real, but it was bought with Nvidia's balance sheet.", "tweetA": "$40B a quarter from customers Nvidia is helping finance. And its own CDS has doubled. The market is already charging for the circularity the bulls say doesn't exist. $NVDA", "tweetB": "Lucent and Nortel financed customers in 1999 too, and the equipment was real. The question was never whether fiber got built. It was who owned the losses when utilization lagged. Who owns them here?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-nvidias-170-billion-neocloud-safety", "id": 3}, {"cat": "AI/infra", "urgency": "watch", "source": "Michael Parekh / AI-RTZ", "title": "Neocloud consolidation: execs say 7-10 survive, Gartner sees 80% losing independence by 2030", "idea": "Lessors (CoreWeave) can stumble without stranding buildings; neoclouds that own their sites could stall the build-out itself. Jefferies expects pricier credit to force neoclouds to sell stock. Insurers bought >$740M of a CoreWeave project loan tied to a Meta contract; CoreWeave's CFO wants insurers' 'unlimited' capital pools.", "angle": "The owner-versus-lessee split decides who gets hurt. Insurers as the new marginal lender of GPU paper is a plumbing story.", "tweetA": "Lease vs build is the whole neocloud trade. A lessee can fail and the data hall gets re-let. An owner-builder that fails strands power, land and shell. Position accordingly.", "tweetB": "Insurers are now buying project loans backed by Meta contracts on GPU collateral. Annuity money funding a depreciating chip asset. I'd want to know the useful-life assumption in that loan.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-nvidias-170-billion-neocloud-safety", "id": 4}, {"cat": "positioning", "urgency": "act", "source": "Dark Side of the Boom / Nomura (McElligott)", "title": "Nomura: October selloff is moving from crowding unwind to repricing of the AI growth left tail", "idea": "Charlie McElligott sees market psychology shifting from momentum unwinds and Treasury short-covering to reassessing AI-driven growth. Return of downside hedging is changing equity vol behaviour, options positioning could amplify the next move, and Treasuries are regaining their defensive role - the bond market looking past stubborn inflation toward a growth risk.", "angle": "Bonds hedging again is the tell. If stocks-bonds correlation flips back negative, vol-control and risk-parity flows change.", "tweetA": "October was explained away as a crowded exit. McElligott says that story is expiring. When Treasuries start rallying on bad equity days again, the market is pricing growth, not inflation.", "tweetB": "AI capex has been holding up GDP, capex-linked credit and the equity index at the same time. Hedge the left tail and you are hedging all three. That's why puts are bid and why gamma matters on the next leg.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/repricing-the-left-tail-when-the", "id": 5}, {"cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / TS Lombard (Perkins)", "title": "TS Lombard: AI-crash financial damage far bigger than the recession it implies - but rates cuts revive the left-behind economy", "idea": "Dario Perkins put numbers on an AI-bust scenario (the headline frames a ~$20T question): financial losses considerably larger than the economic recession. Recycled capital, vendor financing and future-revenue commitments mean the cycle is fragile if spending merely stops accelerating. Key distinction: market losses versus real-economy damage, with lower rates afterwards reviving sectors the AI boom left behind.", "angle": "Wealth effect vs real economy split. Rotation trade post-crash: rate-sensitive, left-behind sectors (housing, small caps, regionals).", "tweetA": "Perkins' point worth sitting with: a $20T wipeout with a mild recession. The damage lands on balance sheets of the top decile, not payrolls. Then the Fed cuts into it and Main Street gets the rate relief it never had.", "tweetB": "Stopping acceleration is enough. Capex is a second derivative. You don't need AI to fail, you need AI spending to be merely flat for two quarters to break the vendor-financing loop.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/gaming-the-ai-crash-the-20-trillion", "id": 6}, {"cat": "macro", "urgency": "act", "source": "Tavi Costa / Crescat", "title": "Dollar didn't bid in the selloff - 'the most important thing today'", "idea": "Tavi Costa flags the muted dollar response: Treasuries aside, the dollar would normally catch a strong bid in a selloff as liquidity becomes king. Against several currencies it went the other way. He is also changing his Brazil exposure in the full report.", "angle": "If USD stops being the liquidity haven, de-dollarization/gold narratives get a data point and EM (Brazil) becomes a funding-flow trade.", "tweetA": "Risk-off day. Treasuries up, dollar flat to down. That's not what the playbook says. One day proves nothing, but this is the correlation I'd track every selloff for the next month.", "tweetB": "If the dollar stops being the crisis bid, who is? Gold and the yen get the call, and Brazil rewrites its funding risk. Costa rotating his Brazil book on the same day is not a coincidence.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://tavicosta.substack.com/p/macro-observation", "id": 7}, {"cat": "credit", "urgency": "deep", "source": "Capital Flows Research", "title": "Credit Cycle Intelligence: 3 years of liquidity injections keep nominal GDP above trend, equity priced for perfection", "idea": "Macro liquidity and credit issuance injected over the last three years pushed nominal GDP well above trend and index valuations high (S&P 500 and Nasdaq charts in the email). Builds on a prior piece linking AI capex to term premia; the thesis is that sustainability of liquidity sets how aggressive to be taking risk. Regime models for rates, FX flows and equity rotations are paywalled.", "angle": "Liquidity impulse is the variable - frames position size, not direction.", "tweetA": "Nominal GDP above trend, valuations at perfection. Both are downstream of the same liquidity. When the impulse fades, they fade together, and nobody hedges that correlation.", "tweetB": "AI capex raises the term premium, higher term premium raises CoreWeave's coupon. Capital Flows connects the first link, the neocloud tape shows the last one.", "charts": {"count": 2, "hot": false, "desc": "S&P 500 and Nasdaq liquidity-vs-valuation charts in body; rest paywalled"}, "link": "https://www.capitalflowsresearch.com/p/credit-cycle-intelligence", "id": 8}, {"cat": "credit", "urgency": "deep", "source": "Rupak Ghose", "title": "LSEG buys Octus for $3.5B: 11-12x revenue, 27-30x EBITDA", "idea": "Octus (distressed/restructuring credit intelligence, now loans, HY, private credit, CLOs, munis) goes to LSEG at 11-12x revenue, similar to Tradeweb/Trumid days earlier and slightly below BlackRock/Preqin and S&P/With Intelligence. Trumid was 60x EBITDA pre synergies, 19.4x post. Bloomberg's Canoe deal (~$0.8-0.9B) reportedly at a higher revenue multiple. Octus guides low double-digit growth.", "angle": "Private-credit data is the toll road for a $2T asset class. Everyone is paying 11x+ for the map.", "tweetA": "Trumid, Octus, Preqin, With Intelligence, Canoe. Five deals in a year, all priced like software, for the plumbing around private credit. The asset class got big enough that its data layer is now M&A fuel.", "tweetB": "27-30x EBITDA for double-digit growth in an AI-disruption-fearing data sector. LSEG is buying a unique dataset (court dockets, filings) precisely because LLMs can't scrape it.", "charts": {"count": 1, "hot": false, "desc": "Multiple comparison chart of deal revenue multiples - worth opening"}, "link": "https://rupakghose.substack.com/p/octus-what-financial-market-infrastructure", "id": 9}, {"cat": "tech", "urgency": "deep", "source": "Rupak Ghose", "title": "Revenue per employee: Octus ~$300-350K, Tradeweb $1.3M, Trumid $750K, Bloomberg ~2x Octus", "idea": "Octus has 900+ staff, implying revenue per head of $300-350K - the same as Refinitiv when LSEG bought it. Tradeweb is $1.3M, Trumid $750K, Bloomberg nearly double Octus/Refinitiv despite thousands of journalists. Without a walled garden the model is hugely human-intensive.", "angle": "Human-intensive data businesses are the ones with AI cost-out optionality and AI disruption risk. Both.", "tweetA": "$325K revenue per head at Octus vs $1.3M at Tradeweb. The gap is the AI margin opportunity or the AI disruption target, depending on whose analysts you believe.", "tweetB": "Bloomberg ran 2x revenue per employee with thousands of journalists. The walled garden is the moat; headcount is not.", "charts": {"count": 1, "hot": false, "desc": "Octus headcount growth chart; worth opening"}, "link": "https://rupakghose.substack.com/p/octus-what-financial-market-infrastructure", "id": 10}, {"cat": "tech", "urgency": "deep", "source": "Rupak Ghose", "title": "'Is Mike Bloomberg the last great entrepreneur of financial market infrastructure?' - build vs buy", "idea": "Exchange groups protect monopolies and extend to adjacencies via M&A (ICE bought IDC for ~$5B). Bloomberg prioritizes organic growth and sustains losses for years. Data names (LSEG, S&P, FactSet, RELX) trade on AI-disruption perception while revenue trends are little changed; Ghose sees little evidence AI features raise pricing power or switching costs.", "angle": "Test for AI moat: customers paying more. Not yet visible in reported numbers.", "tweetA": "Every data CEO says AI improves the product. Show me the price increase or the lower churn. Until then it is a defense, not a growth driver.", "tweetB": "Financial plumbing has been a roll-up business for 30 years because incumbents are cash machines. The one builder is private. That tells you what public-market incentives select for.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://rupakghose.substack.com/p/octus-what-financial-market-infrastructure", "id": 11}, {"cat": "science", "urgency": "watch", "source": "McKinsey Weekend Read", "title": "Quantum could create up to $2.7T of value by 2035 while threatening public-key encryption", "idea": "McKinsey (Govindarajan, Soller, Catlin) argues leaders should secure talent and partnerships now and prepare for security risk from advances that break today's public-key encryption.", "angle": "Harvest-now-decrypt-later is the crypto/custody risk angle: BTC address exposure, bank rails.", "tweetA": "$2.7T of upside by 2035 and the same machines break RSA. Every custody, clearing and BTC key-management roadmap should have a post-quantum date on it.", "tweetB": "Consultants telling boards to hire quantum talent now is a late-cycle signal for quantum equities, and an early-cycle one for post-quantum security vendors.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://email.mckinsey.com/featured-insights/the-weekend-read", "id": 12}, {"cat": "tech", "urgency": "watch", "source": "McKinsey Weekend Read", "title": "Forward-deployed engineers: what happens when off-the-shelf AI isn't enough", "idea": "McKinsey explainer (Hurtgen, Harrysson, Robson): the forward-deployed engineer builds tailored AI solutions alongside the end users to turn AI investment into results.", "angle": "The Palantir model is going mainstream; services margin mix matters for AI vendors.", "tweetA": "Forward-deployed engineers are the tell that AI deployment is a labor problem, not a software one. Palantir figured that out first. Now McKinsey sells it.", "tweetB": "If the last mile needs an engineer embedded on site, the AI revenue per head looks like services, not SaaS. Price that multiple accordingly.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://email.mckinsey.com/featured-insights/the-weekend-read", "id": 13}, {"cat": "culture", "urgency": "watch", "source": "McKinsey Weekend Read", "title": "Business aviation hit a record 3.9M departures in 2025; supply, airports and maintenance are the constraint", "idea": "McKinsey's first analysis of the sector: record 3.9M departures in 2025, with demand straining aircraft supply, airport infrastructure and maintenance capacity.", "angle": "K-shaped consumption: top-decile spending at record while capacity is the bottleneck.", "tweetA": "3.9M private jet departures. A record. The K-shape isn't an anecdote, it's a flight log.", "tweetB": "The bottleneck is maintenance and slots, not demand. Pricing power sits with owners of scarce capacity: MRO, FBO, airframe.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://email.mckinsey.com/featured-insights/the-weekend-read", "id": 14}, {"cat": "labor", "urgency": "watch", "source": "McKinsey Weekend Read", "title": "Americans strongly connected to their community are 3x as likely to feel in control of their future", "idea": "McKinsey Institute for Economic Mobility: place, purpose and belonging shape economic opportunity; strongly community-connected Americans are three times as likely to say they control their future.", "angle": "Loneliness/belonging as an economic variable; affects migration, consumption and political risk.", "tweetA": "3x. Sense of control over your future tracks community ties as much as the paycheck. Policy designed around income alone is missing half the variable.", "tweetB": "This is the demand side of the populism trade. Belonging is scarce, and whoever monetizes it (churches, gyms, run clubs) is not in anyone's consumer discretionary model.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://email.mckinsey.com/featured-insights/the-weekend-read", "id": 15}, {"cat": "macro", "urgency": "watch", "source": "McKinsey Weekend Read", "title": "Chemicals at an inflection: persistent overcapacity, shifting trade flows erode traditional advantage", "idea": "McKinsey senior partners (Goyal, Prieto, Weihe, Malik) argue competition, overcapacity and shifting trade flows are breaking cost/technology/geography advantage; 'system advantage' is the new source of value (webinars Nov 12 and 20).", "angle": "Overcapacity in chemicals is a China export story; margins in European chemicals are the casualty.", "tweetA": "Overcapacity plus shifting trade flows. That's China's industrial policy meeting EU energy costs. European chemicals are the canary.", "tweetB": "If cost, tech and document.getElementById('rb').innerHTML='<p>Window: '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</p><p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</p><p><b>Included:</b><br>'+names.map(function(n,k){return '<span class="src" onclick="filterBySrc(names['+k+'])">'+esc(n)+'</span>';}).join('<br>')+'</p><p><b>Skipped:</b><br>'+META.skippedSources.map(esc).join('<br>')+'</p>';
render();
</script></body></html>
