<script>
const ITEMS = [{"cat": "geopolitics", "urgency": "deep", "source": "HFI Research (WCTW)", "title": "Since day one of the Iran war the playbook was two-sided: pump equities, suppress crude", "idea": "HFIR argues every move since the war began (leaks, timing, 'peace' headlines) served two goals: stocks up, oil down. Pattern: large block sells followed by fake peace headlines; Trump himself alluded to it when asked about the June MOU. Polymarket now shows Democrats at 77% to win, i.e. the intervention failed on its own terms.", "angle": "If the oil suppression was a midterm trade, the incentive set changes on Nov 4. Frame the post-election oil path as a regime change, not noise.", "charts": {"count": 1, "hot": true, "desc": "Polymarket midterm odds chart (Dems 77%)"}, "link": "https://www.hfir.com/p/wctw-show-me-the-incentives-and-ill", "id": 1, "tweetA": "Two objectives for eight months: stocks up, oil down. Midterms tomorrow and the market says it didn't work. Once the election constraint disappears, what exactly is holding the front of the Brent curve down? $XLE $USO", "tweetB": "Intervention buys time, not outcomes. Polymarket at 77% Democrats is the scoreboard for a strategy built on headline timing. The next incentive set is legacy, not elections.", "chartLink": "https://www.hfir.com/p/wctw-show-me-the-incentives-and-ill"}, {"cat": "positioning", "urgency": "deep", "source": "HFI Research (WCTW)", "title": "Strikes started only after the equity close, 'love taps' went unannounced", "idea": "HFIR documents that military attacks began only after US markets closed, which revived the 'war on, war off' adage in July. Recent small strikes on Iranian assets were never communicated; only OSINT accounts caught them. Equities ramped on peace and sold on conflict, and block sells preceded fake peace headlines.", "angle": "Overnight gap risk is now a tradable pattern: Sunday and after-hours headline windows carry the real information.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.hfir.com/p/wctw-show-me-the-incentives-and-ill", "id": 2, "tweetA": "If strikes only land after the cash close, the whole risk premium lives in futures and after-hours. Cash-session vol understates it. Watch where the Iran headline hits, not just what it says.", "tweetB": "The tell nobody prices: strikes that go unannounced. If OSINT accounts front-run the wires, the information edge is in the feed you follow, not the terminal.", "chartLink": "https://www.hfir.com/p/wctw-show-me-the-incentives-and-ill"}, {"cat": "energy", "urgency": "act", "source": "John Authers / Bloomberg Points of Return", "title": "Brent -11.4% in one day, biggest drop in six months, on Khamenei delegating powers to talk", "idea": "Oil had its biggest fall since April after Iran's Supreme Leader gave the government powers to negotiate. Authers notes the biggest drops this year (Mar 10 'war ends soon', Apr 'important update') were followed by no peace. What differs this time: Iran, not Trump, is talking up diplomacy. Signum's Bishop says diplomacy is more likely than re-escalation.", "angle": "Test whether this one holds where March 10 failed. The difference is who is speaking.", "charts": {"count": 2, "hot": true, "desc": "Brent front-month vs end-2027 contract; Gulf flow data"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-11-03/ahead-of-midterms-oil-markets-were-voting-for-war", "id": 3, "tweetA": "Brent -11.4%. Same size drop as March 10, when 'the war ends soon' didn't end the war. The only new variable is the voice: Tehran, not Washington. That's a thin edge for a 11% move. $BNO $XOM", "tweetB": "Signum's call: the US built a credible re-escalation threat, so Iran blinked. If that's right, Monday wasn't peace, it was the price of fear unwinding. Different trade.", "chartLink": "https://www.bloomberg.com/opinion/newsletters/2026-11-03/ahead-of-midterms-oil-markets-were-voting-for-war"}, {"cat": "energy", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "End-2027 Brent at $87 had never been higher, while physical supply is better than April", "idea": "Authers shows official Gulf supply data suggests oil is flowing again despite Hormuz disruption, yet the front-month nearly made a new high and the contract for delivery at end of next year, now $87, had never been higher. Hard to explain unless traders priced a longer, more intense war.", "angle": "Back end of the curve was the war-duration bet. It is the cleanest read on what unwinds if talks hold.", "charts": {"count": 1, "hot": true, "desc": "Brent futures curve: front vs Dec-2027"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-11-03/ahead-of-midterms-oil-markets-were-voting-for-war", "id": 4, "tweetA": "Brent for end-2027 delivery printed its all-time high at the same time physical flows improved vs April. That's not a supply price, it's a duration-of-war price. $87 is the number to watch if talks hold.", "tweetB": "Backwardation tells you scarcity; a record deferred contract tells you fear. Those two aren't the same thing and the curve was paying for both.", "chartLink": "https://www.bloomberg.com/opinion/newsletters/2026-11-03/ahead-of-midterms-oil-markets-were-voting-for-war"}, {"cat": "energy", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "Tchir: diesel, LNG and fertilizer exports not at half of prewar levels", "idea": "Academy Securities' Tchir says Iranian oil has 'slowed to a trickle' under the US blockade, longer shipping times raise costs for refineries globally, and diesel, LNG and fertilizer are not exporting at even half of prewar levels by optimistic estimates. Crude recovery masks the products and inputs.", "angle": "Crude down is not the same as the downstream chain fixing. Fertilizer and diesel are the second-order inflation channel.", "charts": {"count": 1, "hot": false, "desc": "Gulf export volumes chart"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-11-03/ahead-of-midterms-oil-markets-were-voting-for-war", "id": 5, "tweetA": "Crude -11% and diesel, LNG, fertilizer still under half of prewar exports. The headline commodity heals first and the ones that feed farms and trucks last. Look at urea before you call inflation done.", "tweetB": "Refiners care about shipping time, not the Brent print. A longer haul is a tax on every barrel, and it doesn't vanish on a headline. $VLO $MPC", "chartLink": "https://www.bloomberg.com/opinion/newsletters/2026-11-03/ahead-of-midterms-oil-markets-were-voting-for-war"}, {"cat": "macro", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "Robin Brooks: war fear hit S&P, French debt, gold and silver in line with oil correlation", "idea": "Brooks argues S&P 500, French debt, gold and silver all sold off as anxiety over a return to hot war built, consistent with their historical correlation to oil, and so losses should reverse quickly after the period of maximum uncertainty. Authers' corollary: escalation would hit stocks harder, and a durable deal unwinds a lot of war premium in oil.", "angle": "Gold selling off with oil up is the unusual leg. Worth a correlation check.", "charts": {"count": 1, "hot": false, "desc": "Oil-correlated assets chart"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-11-03/ahead-of-midterms-oil-markets-were-voting-for-war", "id": 6, "tweetA": "Gold and silver fell with the war premium. The 'geopolitical hedge' trade turns out to be an oil-beta trade in this regime. Where does that leave gold if there is a deal?", "tweetB": "French debt sold off on Iran fear. That's the quiet one: Europe's fiscal gap, repriced by an energy shock. $FXE", "chartLink": "https://www.bloomberg.com/opinion/newsletters/2026-11-03/ahead-of-midterms-oil-markets-were-voting-for-war"}, {"cat": "geopolitics", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "Gavekal's Denyer: Democrats winning loomberg.com/opinion/newsletters/2026-11-03/ahead-of-midterms-oil-markets-were-voting-for-war", "id": 8, "tweetA": "$4.7B out, 3% of assets. That's not a bank run. But JPMorgan has the Fed and the FDIC; Binance has a tweet. The first exchange stress test of this cycle is also the first with AI-assisted attackers. $BTC $BNB", "tweetB": "Bitcoin's selling point is that transactions can't be reversed. After a $6.3B hack, that's the bug. Meanwhile Binance recovered part of it. Which one is crypto: irreversible or negotiable?", "chartLink": "https://www.bloomberg.com/opinion/newsletters/2026-11-03/ahead-of-midterms-oil-markets-were-voting-for-war"}, {"cat": "crypto", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "Spot BTC ETFs: -$2.6B net since the peak, +$4.8B since July", "idea": "Cantor's Gacetta, quoted by Authers, notes US spot funds have shed roughly $2.6B net more than a year after Bitcoin peaked, but flows turned positive, with about $4.8B entering since July. His view: the Binance breach doesn't derail an early-innings bull cycle and could strengthen smart contract resilience.", "angle": "Net outflow since peak and net inflow since July: ETF holders are net trapped and net adding at once.", "charts": {"count": 1, "hot": false, "desc": "BTC/ETH price chart"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-11-03/ahead-of-midterms-oil-markets-were-voting-for-war", "id": 9, "tweetA": "Spot BTC ETFs are -$2.6B net since the top and +$4.8B since July. So the marginal buyer is up and the average holder is underwater. That's a fragile base for a bull case.", "tweetB": "Cantor calls a $6B hack a 'strengthening event'. When a bank says that about a hack, regulators open an investigation. When a broker says it about crypto, it's a price target.", "chartLink": "https://www.bloomberg.com/opinion/newsletters/2026-11-03/ahead-of-midterms-oil-markets-were-voting-for-war"}, {"cat": "macro", "urgency": "act", "source": "John Authers / Bloomberg Points of Return", "title": "Nasdaq 100 is 10.4% off its peak, with a Fed rate hike expected in December", "idea": "Authers' headline bullets: Nasdaq 100 down 10.4% from peak, Kalshi and Polymarket give a 75% chance of a Democratic Senate after today's midterms, and the 'survival tips' joke is that Fed Chair Warsh has everyone waiting for a December hike.", "angle": "Correction territory plus a hiking Fed plus election risk is a stack, not a single catalyst.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-11-03/ahead-of-midterms-oil-markets-were-voting-for-war", "id": 10, "tweetA": "Nasdaq 100 -10.4% from peak. A Fed Chair who's expected to hike in December. A Senate flip priced at 75%. Three catalysts in six weeks, and the market is treating them as one.", "tweetB": "A hike into an equity drawdown is the opposite of the playbook the last 15 years taught. Who's positioned for a Fed that doesn't blink?", "chartLink": "https://www.bloomberg.com/opinion/newsletters/2026-11-03/ahead-of-midterms-oil-markets-were-voting-for-war"}, {"cat": "positioning", "urgency": "deep", "source": "Stephen Innes / The Dark Side of the Boom", "title": "Goldman: tech hedge funds lost nearly 12% in October; Mag 7 still near year-high positioning", "idea": "Goldman's Sharkey finds hedge funds retreating after a punishing October, with tech specialists suffering their worst month in years (~-12%). Semis, neoclouds and speculative infrastructure took the losses; the Mag 7 remain close to highest positioning of the year and could become a source of funds to finance losses elsewhere.", "angle": "The AI unwind has hit the periphery first. The core crowded longs are the remaining supply.", "charts": {"count": 1, "hot": false, "desc": "Goldman PB positioning charts"}, "link": "https://thedarksideoftheboom.substack.com/p/making-money-is-hard-keeping-it-is", "id": 11, "tweetA": "Tech HFs -12% in October and the Mag 7 are still near their most crowded of the year. The losses were in the periphery, the margin calls come from the core. Sell what you can, not what you want.", "tweetB": "Everyone says 'quality holds up.' Prime-brokerage data say quality is where the funds are most exposed. That's not defensive, it's a liquidity source.", "chartLink": "https://thedarksideoftheboom.substack.com/p/making-money-is-hard-keeping-it-is"}, {"cat": "positioning", "urgency": "deep", "source": "Stephen Innes / The Dark Side of the Boom", "title": "Net exposure rebound is short covering; gross leverage still exceptionally high", "idea": "Per the Goldman note, the apparent recovery in hedge fund net exposure is largely short covering rather than new buying, while gross leverage remains exceptionally elevated. Managers entering November are focused on protecting annual profits over chasing rallies.", "angle": "A bounce on short covering with high gross is a squeeze setup in both directions.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/making-money-is-hard-keeping-it-is", "id": 12, "tweetA": "Net exposure up, but it's shorts being covered, not longs added. Gross leverage is still near records. That's a market that can't absorb a shock and a rally that isn't conviction.", "tweetB": "Year-end arithmetic: in June you take risk, in November you protect the year. October's losses just moved the calendar forward.", "chartLink": "https://thedarksideoftheboom.substack.com/p/making-money-is-hard-keeping-it-is"}, {"cat": "macro", "urgency": "deep", "source": "Stephen Innes / The Dark Side of the Boom", "title": "Goldman's risk appetite indicator: sharpest deterioration since Nov 2021, but not yet a contrarian extreme", "idea": "Goldman's Coppersmith sees October as one of the largest monthly declines in the Risk Appetite Indicator in two decades, yet without the extremes that signal a contrarian buy. Hedge funds cut directional exposure while holding elevated gross leverage; strong earnings are failing to support crowded positions.", "angle": "Nov 2021 was the start of the 2022 drawdown. Historical rhyme worth flagging, not a forecast.", "charts": {"count": 1, "hot": false, "desc": "Risk appetite indicator"}, "link": "https://thedarksideoftheboom.substack.com/p/wall-streets-risk-appetite-breaks", "id": 13, "tweetA": "The last time Goldman's risk appetite fell this fast was November 2021. Earnings were also fine then. The market doesn't care about earnings when the discount rate is moving.", "tweetB": "Not at a contrarian extreme means there's more to go. 'Falling knife' is the technical term.", "chartLink": "https://thedarksideoftheboom.substack.com/p/wall-streets-risk-appetite-breaks"}, {"cat": "AI/infra", "urgency": "watch", "source": "Stephen Innes / The Dark Side of the Boom", "title": "The market shifts from AI growth to the cost of financing it", "idea": "Innes: investors are moving attention from AI growth to the cost of financing it, with the AI investment cycle influencing corporate cash flow and Treasury yields. The relationship between equities, volatility and Treasury yields is changing, creating unusually wide outcomes in both directions.", "angle": "AI capex as a yield-curve driver is a new factor; track it alongside term premium.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/wall-streets-risk-appetite-breaks", "id": 14, "tweetA": "AI capex now moves Treasury yields. That's a new transmission channel: a chip order can move the 10-year. Equity/vol/yield correlations that held for a decade are being rewritten.", "tweetB": "When a trade moves from 'how big is demand' to 'who pays for it', it's a credit trade. The equity market hasn't priced that.", "chartLink": "https://thedarksideoftheboom.substack.com/p/wall-streets-risk-appetite-breaks"}, {"cat": "crypto", "urgency": "deep", "source": "Checkonchain / James", "title": "Bitcoin's first gut check margin line pays for it.", "chartLink": "https://www.tmad.news/p/tmad-spotlight-the-market-is-offering"}, {"cat": "AI/infra", "urgency": "act", "source": "Trading Mindset & Data (TMAD)", "title": "Palantir: US commercial revenue ($984M, +148%) passed US government for the first time", "idea": "PLTR adj. EPS $0.44 vs $0.41, revenue $2.31B (+96% y/y) vs $2.18B. US commercial $984M surpassed US government $953M (+96%). FY26 guide raised to ~$8.53B. Stock -3% after hours, after falling 6.3% Friday and 3.1% Monday.", "angle": "The business mix flipped while the stock sold on a beat.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.tmad.news/p/tmad-spotlight-the-market-is-offering", "id": 17, "tweetA": "Palantir's commercial business just passed government for the first time: $984M vs $953M, +148%. The market sold it anyway. When good numbers get sold, that's the information. $PLTR", "tweetB": "+96% revenue growth at $2.3B a quarter and the stock is down three days in a row. Growth isn't the constraint; the multiple is.", "chartLink": "https://www.tmad.news/p/tmad-spotlight-the-market-is-offering"}, {"cat": "macro", "urgency": "act", "source": "Trading Mindset & Data (TMAD)", "title": "VIX 17.20 to 21.15 in three sessions; S&P 7,720 to 7,541; support at 7,535/7,500", "idea": "TMAD tracks a shift in risk tolerance: VIX closed 21.15 vs 17.20 Thursday, S&P fell from 7,720 to 7,541 in three sessions, leaders sold on good news. Levels: 7,535 support, 7,500 critical, 7,400 first correction target; reclaim 7,589 then 7,633. Author is 60% cash, with a hedging primer (puts, put spreads, collars, -1x ETFs).", "angle": "Concrete levels for the S&P into the print week: 7,535 / 7,500 / 7,400.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.tmad.news/p/tmad-spotlight-the-market-is-offering", "id": 18, "tweetA": "S&P 7,720 to 7,541 in three sessions, VIX 17 to 21. The levels people are watching: 7,535, then 7,500, then 7,400. When everyone has the same line, the move through it is the information.", "tweetB": "Fifty-percent-plus cash in a 'Stage 3/4' framework: even the trend followers are sitting out. Who's left to buy the dip?", "chartLink": "https://www.tmad.news/p/tmad-spotlight-the-market-is-offering"}, {"cat": "regulation", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "21 of 36 governor races have a major nominee backing a data center moratorium", "idea": "Per The Information: five states where both nominees back a pause (MI, NH, OH, OR, TX); three where a pause backer likely wins (ME, NM, NY); seven toss-ups (AK, FL, GA, IA, KS, WI, VT). Those 15 states hold over a third of the US population and giant projects: Stargate sites in TX/MI/NM, an 8GW SB Energy campus in Ohio, Atlanta now the top construction market. Three sitting governors (Hochul, Abbott, Kotek) have already paused.", "angle": "Texas and Ohio are core to OpenAI; both candidates for governor in both states back a pause.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-data-centers-on-the-ballot-in", "id": 19, "tweetA": "Both gubernatorial candidates in Texas and Ohio back a data center pause. Those two states carry Stargate and an 8GW OpenAI campus. The AI buildout is a ballot item and the polls aren't on its side. $ORCL $NVDA", "tweetB": "Same word, different pauses: 45 days to 3 years, some only above 50 MW. New York's 50 MW line could be the template: it blocks frontier training campuses and lets inference through.", "chartLink": "https://michaelparekh.substack.com/p/ai-data-centers-on-the-ballot-in"}, {"cat": "culture", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "Local data center bans: ~40 at start of 2026 to 500+ by August; 60%+ oppose one nearby", "idea": "Local bans rose from about 40 to over 500. Opposition to nearby data centers went from 49% in March to over 60% (UPenn poll). Pew: six in ten uncomfortable with a new data center nearby, under a quarter think it helps jobs or taxes. Axios-CivicScience AI Sentiment Index at 41.8/100, with jobs the deepest negative. Nicknames: 'Data Center Joe', 'Chat JKT'. $130B of projects had stalled by September.", "angle": "Opinion moved 11 points in six months. That is a faster adoption curve of backlash than of the product.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-data-centers-on-the-ballot-in", "id": 20, "tweetA": "Opposition to local data centers went from 49% to over 60% in six months. Bans 40 to 500. Backlash is scaling faster than the compute. The bottleneck is no longer power, it's permission.", "tweetB": "Americans expect AI to grow the economy and not create jobs. That's the combination that politicians turn into policy. Look at which candidate gets the nickname.", "chartLink": "https://michaelparekh.substack.com/p/ai-data-centers-on-the-ballot-in"}, {"cat": "credit", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "CoreWeave 2031 bonds: 4pts to 10+pts over Treasuries since June, with Nvidia as backstop", "idea": "CoreWeave's 2031 bonds now trade at more than 10 points over Treasuries, from just over 4 in June, even though Nvidia is its second-largest shareholder and promised to rent spare compute until 2032. Nvidia also provided a $105B backstop for SB Energy's Ohio build. OpenAI has raised under half of a $30B target; Google lost ~$500B of market value in a day. Parekh draws the 2001 vendor-financing parallel.", "angle": "The credit market is pricing what equity hasn't: even with a guarantor, spreads widened 6 points.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-data-centers-on-the-ballot-in", "id": 21, "tweetA": "Nvidia promised to rent CoreWeave's spare compute through 2032. The bonds still went from +400 to +1000bp. A backstop that the market doesn't believe isn't a backstop. $CRWV $NVDA", "tweetB": "Vendor financing, 2001 edition: the supplier lends to the customer who buys the supplier's product. Telecom equipment makers learned how it ends. Ohio is the test: $105B of Nvidia backstop in a state where both candidates want a pause.", "chartLink": "https://michaelparekh.substack.com/p/ai-data-centers-on-the-ballot-in"}, {"cat": "venture", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "Investors are buying AI insurance: options, CDS, and compute-price derivatives", "idea": "WSJ (via Parekh): tech employees quitting to hedge company stock, investors turning to options and CDS, and trading firms building derivatives tied to the price of computing power. Banks are raising concerns over data center exposure; neoclouds on the IPO track are delaying or downsizing.", "angle": "A compute futures market is a financial plumbing story: it also lets hyperscalers hedge capex.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-data-centers-on-the-ballot-in", "id": 22, "tweetA": "Someone is building a futures contract on the price of compute. If it works, it's the first real price discovery for the AI buildout. If it works, it also lets you short it. $NVDA", "tweetB": "Employees quitting to hedge their own stock is the most honest sentiment signal in this note.", "chartLink": "https://michaelparekh.substack.com/p/ai-data-centers-on-the-ballot-in"}, {"cat": "science", "urgency": "watch", "source": "Michael Parekh / AI-RTZ", "title": "Space data centers: Google says up to 100x cost; parity needs launch at $200/kg", "idea": "Google's data center energy chief says orbital data centers could cost up to 100 times terrestrial ones; Google's Suncatcher TPUs in orbit ran a first AI workload (a haiku). Its researchers say space matches Earth on power cost at $200/kg launch, possibly by 2035, depending on Starship. SpaceX is ~$1.8T market value since its June IPO; Musk says orbital data centers next year; Altman called it ridiculous.", "angle": "Cost per kg is the single variable. Track Starship cadence.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-data-centers-on-the-ballot-in", "id": 23, "tweetA": "Google's own answer on space data centers: up to 100x the cost. Break-even at $200/kg to orbit, maybe 2035. SpaceX is valued at $1.8T partly on a story its biggest potential customer says doesn't work yet. $SPCX", "tweetB": "The terrestrial bottleneck is permits and grid studies, not power. That is a software problem for a space company to sell against: speed to power.", "chartLink": "https://michaelparekh.substack.com/p/ai-data-centers-on-the-ballot-in"}, {"cat": "regulation", "urgency": "deep", "source": "Michael Parekh / AI-RTZ", "title": "Anthropic's S-1 names moratoriums as a business risk and is expanding data centers overseas", "idea": "Anthropic's IPO filing cites New York and Texas moratoriums as a business risk and says regulatory challenges are part of why it is expanding its data center footprint abroad. SB Energy and Nscale name the same risk. Google's list of 'pay your own way' commitments: 15-20 years of grid upgrade payments, full power bills and property taxes, restoration bonds, no NDAs.", "angle": "Offshoring compute because of US state politics is a policy export story.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-data-centers-on-the-ballot-in", "id": 24, "tweetA": "Anthropic's S-1 lists state data center moratoriums as a risk factor and says it's expanding compute overseas partly because of it. The US is exporting its AI buildout, state by state.", "tweetB": "Google's playbook: pay for 15-20 years of grid upgrades, post a bond, drop the NDA. That's not PR, that's the price of a permit. Newer entrants without it are the political target.", "chartLink": "https://michaelparekh.substack.com/p/ai-data-centers-on-the-ballot-in"}, {"cat": "venture", "urgency": "watch", "source": "TWiST / This Week in Startups", "title": "Jason: under $40K of AI tools a year for more than $2M of value; '$1 of AI is $50 of output'", "idea": "TWiST's takeaway: calculate the human-hours each agent task would have taken and compare with AI spend. Jason spends under $40K/year and claims over $2M value, i.e. 'a dollar invested in AI, done properly, is $50 of output'. Also: show usage bars and token counts, hire for taste and community, and 'let the agents in' because platforms blocking bots are in a losing fight.", "angle": "A 50:1 self-reported ROI is the number to stress-test against enterprise software budgets.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/keep-track-of-the-value-youre-getting-da4", "id": 25, "tweetA": "Founder says $40K of AI spend returned $2M of output. 50:1. If even a tenth of that is real, the budget line that gets cut in a downturn isn't AI, it's the people it replaced.", "tweetB": "Platforms blocking agents are blocking their own next billion users. In five years 'agent-friendly' will be what 'mobile-friendly' was in 2012.", "chartLink": "https://twistartups.substack.com/p/keep-track-of-the-value-youre-getting-da4"}, {"cat": "tech", "urgency": "watch", "source": "TWiST / This Week in Startups", "title": "Odyssey-3 world model: a new task learned from 20-30 hours of examples", "idea": "Odyssey sells its Odyssey-3 world model to robotics labs and self-driving companies, who post-train it themselves; a model with broad world knowledge learns a new task from 20-30 hours of data (CEO Oliver Cameron). Lesson: own the last mile instead of training a base model from scratch.", "angle": "20-30 hours of data per task is a cost curve for robotics.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/keep-track-of-the-value-youre-getting-da4", "id": 26, "tweetA": "20-30 hours of demonstrations to teach a robot a new task. A year ago it was thousands. World models are turning robotics from a hardware problem into a data-collection problem.", "tweetB": "The supply chain implication: a base model sold B2B means robotics labs don't need frontier compute, they need cameras and operators. Where does that spend go?", "chartLink": "https://twistartups.substack.com/p/keep-track-of-the-value-youre-getting-da4"}, {"cat": "labor", "urgency": "watch", "source": "BowTiedBull", "title": "Actuarial odds: 83% of 40-year-olds reach 70; and 11-12% of Americans hit the top 1% for at least one year", "idea": "BowTiedBull: roughly four in five 40-year-olds reach 70 (actuary data ~83%), so every fifth person you know won't. W-2 income feels stable because wages rise fast in the 20s and early 30s, then stall: one regional manager seat, with younger and cheaper replacements. About 11-12% of Americans earn top-1% income in at least one year.", "angle": "Top 1% is a transient state for most, which changes how you read income-percentile stats.", "charts": {"count": 1, "hot": false, "desc": "Actuarial life table (in article)"}, "link": "https://bowtiedbull.io/p/laundry-list-of-things-for-middle", "id": 27, "tweetA": "11-12% of Americans will be in the top 1% for at least one year. The top 1% isn't a class, it's a year. Policy debates assume the opposite.", "tweetB": "One regional manager seat, ten candidates, and a cheaper hire every cycle. Corporate ladders are pyramids with a ceiling. AI makes the cheaper hire a software license.", "chartLink": "https://bowtiedbull.io/p/laundry-list-of-things-for-middle"}, {"cat": "culture", "urgency": "watch", "source": "BowTiedBull", "title": "A 2% return swing on $5M is $100K, which is a bigger lever than an extra $50K of salary", "idea": "At a 10% target return, a 2% swing equals $20K on $1M, $100K on $5M, $200K on $10M; adding $50K net worth via overtime means little at $5M. Author's view: investment returns should outpace earnings in middle age ('the first $4M is hardest'). Also cites health screens (DEXA, calcium heart scan) and that expense shifts rather than rises with two kids.", "angle": "Portfolio-vs-income crossover is a core demographic fact for wealth products.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bowtiedbull.io/p/laundry-list-of-things-for-middle", "id": 28, "tweetA": "At $5M, a 2% swing in returns is $100K. Your extra hours at work are worth less than your allocation decision. The crossover point where capital beats labor is the real retirement number.", "tweetB": "Childless doesn't mean cheaper: flights, dry cleaning and $200 dinners. The spending swaps, it doesn't fall. Which is why consumer data for 35-45 year olds looks the way it does.", "chartLink": "https://bowtiedbull.io/p/laundry-list-of-things-for-middle"}];
