r": "My internal seismograph reads otherwise.", "quote_verified": true}, {"claim": "Baudelaire himself explicitly prized bad taste, writing in his private journals that what is exhilarating in bad taste is the aristocratic pleasure of giving offense — directly at odds with treating refined 'good taste' as the answer to flattened AI content.", "speaker": "AFRA WANG", "type": "contrarian", "entities": ["Baudelaire"], "conviction": "high", "so_what": "Offers a historical counter-example undermining the premise that curated 'good taste' is the antidote to algorithmic sameness — the opposite instinct produced more lasting art.", "quote": "“What is exhilarating in bad taste,” he wrote in his private journals, “is the aristocratic pleasure of giving offense.”", "locator": "Baudelaire would have no use for it.", "quote_verified": true}, {"claim": "Claude's published 'Constitution,' an approximately 80-page document instructing the model how to behave, tells it to be 'genuinely good, wise, and virtuous' and to help people 'in the way a good person would,' a safety-alignment target the author argues is fundamentally incompatible with the kind of transgressive genius Baudelaire represents.", "speaker": "AFRA WANG", "type": "causal", "entities": ["Claude", "Constitution"], "conviction": "medium", "so_what": "Names the specific alignment document and language behind a leading model's behavior, framing it as a direct, traceable source of the 'flattened' output the essay critiques.", "quote": "instructs it to be “genuinely good, wise, and virtuous”: to be tactful, helpful, graceful, honest and, above all, to “help people in the way a good person would.”", "locator": "Claude's own 'Constitution,'", "quote_verified": true}, {"claim": "Historian Simon Schama's line that 'great art has dreadful manners' — describing art as a 'thug' that will grab you in a headlock and rearrange your sense of reality — is invoked as a standard that alignment-trained, safety-optimized AI output structurally cannot meet.", "speaker": "AFRA WANG", "type": "framework", "entities": ["Simon Schama", "The Power of Art"], "conviction": "high", "so_what": "Provides a memorable, quotable benchmark for what 'good' art actually does, against which safety-optimized AI content is implicitly measured and found lacking.", "quote": "great art has dreadful manners.", "locator": "I keep returning to a line from Simon Schama's", "quote_verified": true}]}, {"theme": "The Author's Own Entanglement With AI", "insights": [{"claim": "As a non-native English speaker, the author relies heavily on Claude as a grammar checker to smooth her sentences and remove 'ESL flavor,' comparing the effect to installing a pair of mechanical wings that extend her reach to new audiences while making her writing feel less entirely her own.", "speaker": "AFRA WANG", "type": "anecdote", "entities": ["Claude"], "conviction": "medium", "so_what": "Complicates a simple anti-AI-writing stance by showing AI-as-tool can be a genuine access enabler for non-native writers even while introducing a felt loss of authenticity.", "quote": "AI makes those wings less heavy, but more not-entirely-me.", "locator": "Because English is my second language", "quote_verified": true}, {"claim": "Noema discloses that this article's initial draft used Claude to improve grammar and syntax and that the piece then received numerous human edits plus a human fact-check and identity verification, illustrating one publication's concrete protocol for authorized AI use.", "speaker": "AFRA WANG", "type": "data_point", "entities": ["Noema Magazine", "Claude"], "conviction": "high", "so_what": "A working, disclosed example of a publisher's AI-use policy that other media outlets could benchmark against as disclosure norms solidify industry-wide.", "quote": "The initial submitted draft of this piece used Claude to improve grammar and syntax. This piece has since received numerous human edits.", "locator": "Editor's Note: Noema is transparent", "quote_verified": true}]}], "insight_total": 24, "top_entities": ["Claude", "Baudelaire", "Simplified Chinese Internet", "Elias Thorne", "Substack", "LessWrong", "Walter Benjamin", "Bei Dao", "Simon Schama", "Sam Kriss", "Jerry Zhou", "Zhengdong Wang"], "source_meta": {"author": "AFRA WANG", "word_count": 3643, "paywalled": false}}, {"record_id": "357f194e4533b0c3", "source_type": "concepts", "source_name": "Oxford Economics", "source_url": "https://www.oxfordeconomics.com/resource/ai-macroeconomic-impact-modelling/", "title": "Modelling AI’s macroeconomic impact", "published_date": "2026-09-09", "language": "en", "processed_at": "2026-09-11T11:51:35Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "AI"], "gist": "Oxford Economics models generative AI's macro impact with three adjustable levers (task exposure, adoption speed, labour-augmenting vs. labour-replacing) in its Global Economic Model, landing on a cautious baseline of 3.5%-4.5% US productivity uplift while flagging scenarios where similar GDP outcomes hide very different labour-market and financial consequences.", "themes": [{"theme": "Investment Outpacing Productivity", "insights": [{"claim": "AI's clearest economic impact so far shows up in capital expenditure, not realised productivity: AI hardware demand has boosted supplier economies in Asia and AI-related spending (hardware, information processing equipment, software) has sustained US business investment over the past two years, while firm-level output gains remain unproven.", "speaker": "Duncan Campbell", "type": "data_point", "entities": ["Asia", "US business investment", "AI hardware"], "conviction": "high", "so_what": "Capex-led AI spending can keep boosting supplier economies and equipment/software sales even before any productivity payoff shows up — watch capex data as the leading indicator, not productivity stats.", "quote": "AI is already affecting the global economy, but the clearest evidence so far is visible in capital expenditure rather than realised productivity gains.", "locator": "So far, AI's impact has been clearer in investment than productivity", "quote_verified": true}, {"claim": "Oxford Economics' baseline forecast is that generative AI makes the US economy about 3.5% more productive over the next decade, rising to 4.5% in the long run — a figure deliberately near the cautious end of a published estimate range spanning roughly 1% to over 12%.", "speaker": "Duncan Campbell", "type": "prediction", "entities": ["US economy", "Global Economic Model (GEM)"], "conviction": "medium", "so_what": "A widely-cited productivity uplift estimate (3.5%/4.5%) is explicitly positioned as conservative versus the broader forecasting community — useful benchmark for judging whether other AI productivity claims are aggressive or in line.", "quote": "We expect generative AI to make the US economy around 3.5% more productive over the next decade, with the gain rising to 4.5% in the long run.", "locator": "So far, AI's impact has been clearer in investment than productivity", "quote_verified": true}, {"claim": "The gap between rapid AI adoption headlines and limited realised productivity gains is explained by firms needing to redesign workflows and build complementary infrastructure before AI efficiencies convert into higher output — adoption is not the same as integration.", "speaker": "Duncan Campbell", "type": "causal", "entities": ["firm-level productivity"], "conviction": "high", "so_what": "Don't equate AI adoption-rate headlines with near-term earnings upside; the productivity lag implies a multi-year gap between spending and payoff.", "quote": "businesses still need to redesign workflows and develop complementary infrastructure before the efficiencies created by AI translate into higher firm-level output", "locator": "Evidence of a broad productivity uplift remains much less conclusive", "quote_verified": true}]}, {"theme": "Three-Lever Modelling Framework", "insights": [{"claim": "Oxford Economics built three adjustable 'levers' into its Global Economic Model (GEM) to make AI scenario assumptions explicit: AI Exposure (share of tasks automatable), AI Adoption (share of automatable tasks actually automated), and whether AI is labour-augmenting or labour-replacing.", "speaker": "Duncan Campbell", "type": "framework", "entities": ["Global Economic Model (GEM)", "Oxford Economics"], "conviction": "high", "so_what": "This is a reusable mental model for stress-testing any AI macro forecast: separate 'can it be automated,' 'will it be automated,' and 'does automation cut jobs or redeploy them' rather than treating AI impact as one number.", "quote": "Our model levers seek to answer three key questions about generative AI", "locator": "Three questions shape our AI outlook", "quote_verified": true}, {"claim": "AI exposure is highly uneven by task and geography: clerical, administrative, and IT jobs are among the most exposed to generative AI automation, while physical activities like mining, construction, and fishing are least exposed — so emerging markets with more physical-labour-heavy economies are structurally less exposed to AI disruption than advanced, knowledge-service-heavy economies.", "speaker": "Duncan Campbell", "type": "data_point", "entities": ["clerical and IT jobs", "mining, construction, fishing", "emerging markets", "advanced economies"], "conviction": "high", "so_what": "AI exposure is a country-differentiation factor: advanced, services-heavy economies (and their white-collar labor pools) carry more AI disruption risk/opportunity than resource- or physical-labor-heavy emerging markets.", "quote": "Clerical, administrative, and IT jobs are some of the most exposed to generative AI in our research, while physical activities like mining, construction, and fishing are least exposed.", "locator": "How many tasks within the economy can generative AI automate?", "quote_verified": true}, {"claim": "AI adoption is modelled as an S-curve that accelerates as the technology is tested and integrated, then slows near saturation; the US is already leading global AI adoption while Japan lags because of a rigid, ageing labour force, and the baseline assumes 80% of possible AI applications are adopted by 2040 across most advanced economies.", "speaker": "Duncan Campbell", "type": "prediction", "entities": ["US", "Japan", "AI adoption"], "conviction": "medium", "so_what": "Japan's demographic rigidity is flagged as a specific structural drag on AI-driven productivity relative to the US — a country-level divergence to track in productivity/growth comparisons through 2040.", "quote": "the US is already leading in terms of AI adoption, while Japan lags behind due to a rigid and ageing labour force", "locator": "How many tasks within the economy will generative AI automate?", "quote_verified": true}, {"claim": "Whether AI ends up 'labour-augmenting' (freeing workers for oversight or new roles) or 'labour-replacing' (a net loss of jobs equal to every task automated) is the pivotal unresolved variable that determines whether AI produces sustained growth or structural unemployment; Oxford Economics' baseline bets on augmentation.", "speaker": "Duncan Campbell", "type": "thesis", "entities": ["labour market", "generative AI"], "conviction": "medium", "so_what": "The augmentation-vs-replacement assumption is the single biggest swing factor between benign and disruptive AI macro outcomes — track labor-market data (job cancellations vs. redeployment) as the tell for which path is unfolding.", "quote": "Our baseline view is that AI will primarily augment labour, helping workers perform tasks more efficiently and move into new roles rather than causing a lasting rise in unemployment.", "locator": "Will generative AI be labour-augmenting or labour-replacing?", "quote_verified": true}]}, {"theme": "Divergent Growth Scenarios", "insights": [{"claim": "In Oxford Economics' 'AI Breakthrough' scenario (faster adoption than baseline), world GDP growth averages close to 3% annually in the 2030s versus 2.4% in the baseline, with the uplift concentrated in the initial adoption phase before fading as adoption approaches saturation.", "speaker": "Duncan Campbell", "type": "prediction", "entities": ["World GDP", "AI Breakthrough scenario"], "conviction": "medium", "so_what": "A faster-than-baseline AI adoption path implies a front-loaded global growth boost this decade that fades later — useful for timing macro/cyclical calls tied to AI diffusion speed.", "quote": "For the world, annual GDP growth averages close to 3% in the 2030s, compared with 2.4% in our baseline.", "locator": "What do the scenarios mean for global growth?", "quote_verified": true}, {"claim": "The 'AI Disruption' scenario generates productivity gains similar to AI Breakthrough but produces weaker world GDP growth (2.8% vs. 3% in the 2030s) because rising structural unemployment among displaced workers weakens household income and consumption, showing that strong productivity gains alone don't guarantee stronger growth if labour displacement isn't absorbed.", "speaker": "Duncan Campbell", "type": "causal", "entities": ["AI Disruption scenario", "structural unemployment", "household consumption"], "conviction": "medium", "so_what": "Same productivity gain, different growth outcome: the labour-market channel (job displacement vs. redeployment) can swing GDP by roughly 0.2 percentage points a year in the 2030s even holding productivity fixed — a reminder that consumption/wage data matters as much as productivity data for judging which AI path is playing out.", "quote": "Structural unemployment rises as displaced workers struggle to move into new roles, weighing on household incomes and consumption.", "locator": "What do the scenarios mean for global growth?", "quote_verified": true}, {"claim": "In the 'AI Disappointment' scenario (slower adoption, weaker productivity gains), world GDP growth falls to around 2.2% in the 2030s, and firms that invested heavily in AI infrastructure face weaker-than-expected returns, which would reduce their appetite for further AI capex and could trigger a reassessment of AI-related equity valuations that dents household wealth and consumer spending.", "speaker": "Duncan Campbell", "type": "prediction", "entities": ["AI Disappointment scenario", "AI infrastructure capex", "equity markets"], "conviction": "medium", "so_what": "A disappointment scenario isn't just a lower productivity number — it's a specific transmission chain (weak AI ROI to capex pullback to equity de-rating to weaker consumer spending) worth watching for early signs, e.g. AI infrastructure spending guidance cuts or AI-linked equity multiple compression.", "quote": "A reassessment of expected returns from AI would also weigh on equity markets, household wealth and consumer spending.", "locator": "What do the scenarios mean for global growth?", "quote_verified": true}]}, {"theme": "Beyond GDP: Why the Mechanism Matters", "insights": [{"claim": "Scenarios with similar headline GDP outcomes (e.g., AI Breakthrough's ~3% vs. AI Disruption's 2.8% world growth in the 2030s) can imply very different labour markets, wage paths, and financial conditions, so business and investment planning should look past a single GDP growth number to the underlying scenario mechanism.", "speaker": "Duncan Campbell", "type": "framework", "entities": ["GDP growth", "labour markets", "financial conditions"], "conviction": "high", "so_what": "When assessing an 'AI upside' or 'AI downside' growth forecast, ask which mechanism (productivity, adoption speed, labour displacement) is driving it — two similar GDP forecasts can call for opposite portfolio and hiring decisions.", "quote": "scenarios with similar GDP outcomes may have very different implications for labour markets, consumer demand and financial conditions", "locator": "Explore the possibilities", "quote_verified": true}]}], "insight_total": 11, "top_entities": ["Oxford Economics", "Global Economic Model (GEM)", "US", "Japan", "Asia", "AI Breakthrough scenario", "AI Disruption scenario", "AI Disappointment scenario", "equity markets", "clerical and IT jobs"], "source_meta": {"author": "Duncan Campbell", "word_count": 1541, "paywalled": false}}, {"record_id": "70bc2bd234552be8", "source_type": "concepts", "source_name": "Oxford Economics", "source_url": "https://www.oxfordeconomics.com/resource/frances-government-debt-is-a-commercial-real-estate-problem/", "title": "France’s government debt is a commercial real estate problem", "published_date": "2026-09-08", "language": "en", "processed_at": "2026-09-11T11:51:35Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Geopolitics", "Positioning"], "gist": "France's political deadlock is driving government debt higher and pushing up bond yields, which Oxford Economics expects to weigh on an already weak French commercial real estate market over the next five years, though tourism-linked hotel, retail and industrial segments offer selective bright spots.", "themes": [{"theme": "France's debt-driven CRE downturn", "insights": [{"claim": "France's political deadlock is causing government debt to keep rising, and markets are pricing more risk into French government bonds, which is expected to push bond yields higher and weigh on France's commercial real estate recovery.", "speaker": "Duncan Campbell", "type": "causal", "entities": ["France", "government bonds", "commercial real estate"], "conviction": "high", "so_what": "Watch French sovereign bond yields as a leading indicator for further downside in French CRE valuations and financing costs.", "quote": "Political deadlock means France’s government debt will continue rising, and that has markets pricing more risk for owning government bonds. We expect higher bond yields will weigh on France’s commercial real estate recovery.", "locator": "Political deadlock means France's government debt", "quote_verified": true}, {"claim": "French commercial real estate values are forecast to keep declining this year, and France is expected to be one of Europe's weakest-performing commercial real estate markets over the next five years.", "speaker": "Duncan Campbell", "type": "prediction", "entities": ["France", "commercial real estate", "Europe"], "conviction": "high", "so_what": "A multi-year underperformance call flags France as a market to underweight relative to European CRE peers.", "quote": "France is expected to be one of Europe’s weakest-performing commercial real estate markets over the next five years.", "locator": "The outlook for French commercial real estate is challenging", "quote_verified": true}, {"claim": "The weak French commercial real estate outlook is driven specifically by the country's strained growth outlook combined with high exposure to the office sector.", "speaker": "Duncan Campbell", "type": "thesis", "entities": ["France", "office sector"], "conviction": "medium", "so_what": "Office-heavy French portfolios carry outsized downside risk versus other property types in the same market.", "quote": "given the country’s strained growth outlook and high exposure to the office sector", "locator": "The outlook for French commercial real estate is challenging", "quote_verified": true}]}, {"theme": "Tourism and retail as offsetting bright spots", "insights": [{"claim": "Despite the bleak macro and office-sector outlook, tourism growth and e-commerce expansion are expected to support performance in France's hotel, retail, and industrial real estate segments.", "speaker": "Duncan Campbell", "type": "contrarian", "entities": ["France", "tourism", "e-commerce", "hotel", "retail", "industrial real estate"], "conviction": "medium", "so_what": "Investors avoiding French CRE broadly should still consider selective exposure to hotel, retail, and industrial assets rather than a blanket exit.", "quote": "Tourism growth and e-commerce expansion will support hotel, retail, and industrial performance.", "locator": "Despite this, selective opportunities exist", "quote_verified": true}, {"claim": "France is one of the world's top tourism destinations, and Paris ranks first in Europe for international visitor spending, underpinning demand for hotel and retail commercial real estate.", "speaker": "Duncan Campbell", "type": "data_point", "entities": ["France", "Paris", "tourism"], "conviction": "high", "so_what": "Paris's top-ranked international visitor spending supports a case for selective hotel/retail asset picking even as broader French CRE weakens.", "quote": "France is notably one of the world’s top tourism destinations and Paris ranks first in Europe for international visitor spending.", "locator": "Despite this, selective opportunities exist", "quote_verified": true}]}], "insight_total": 5, "top_entities": ["France", "Paris", "Europe", "commercial real estate", "government bonds", "office sector", "tourism", "retail", "industrial real estate", "e-commerce"], "source_meta": {"author": "Duncan Campbell", "word_count": 365, "paywalled": false}}, {"record_id": "814bfbf680e66f3a", "source_type": "concepts", "source_name": "Oxford Economics", "source_url": "https://www.oxfordeconomics.com/resource/us-wealth-effects-are-a-major-swing-factor-for-the-consumer-outlook/", "title": "US Wealth effects are a major swing factor for the consumer outlook", "published_date": "2026-09-09", "language": "en", "processed_at": "2026-09-11T11:51:35Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "AI", "Positioning"], "gist": "US consumer spending is propped up by wealth effects from stocks and housing, but the boost is expected to fade as stock wealth gains slow, with AI's trajectory as the key swing factor for how household wealth (and thus spending) evolves.", "themes": [{"theme": "Wealth effects on US consumer spending", "insights": [{"claim": "In the current US economy, a one-dollar increase in stock market wealth boosts consumer spending by about four cents, while a one-dollar increase in housing wealth boosts spending by about two cents.", "speaker": "Emma Pollard", "type": "data_point", "entities": ["US consumer spending", "stock wealth", "housing wealth"], "conviction": "high", "so_what": "Stock market moves have roughly twice the spending impact per dollar as housing moves, so equity market drawdowns or rallies are a more sensitive lever on consumption than home price swings.", "quote": "Currently, a dollar increase in stock wealth boosts spending by four cents, while housing wealth contributes two cents.", "locator": "Currently, a dollar increase in stock wealth", "quote_verified": true}, {"claim": "Discretionary spending (big-ticket, non-essential purchases) is more sensitive to changes in household wealth than spending on essentials, and the negative hit from falling asset prices is more pronounced than the positive lift from rising asset prices, especially for big-ticket items.", "speaker": "Emma Pollard", "type": "causal", "entities": ["discretionary spending", "US consumer spending", "stock wealth", "housing wealth"], "conviction": "high", "so_what": "A market correction is likely to hit discretionary/big-ticket consumer categories disproportionately hard relative to the boost a rally of similar size would give, implying asymmetric downside risk to consumer-facing sectors.", "quote": "The asymmetry in wealth effects indicates that negative impacts during asset price declines are morepronounced than positive effects during rises, particularly for big-ticket items.", "locator": "Notably, discretionary spending is more sensitive", "quote_verified": true}, {"claim": "Positive wealth effects have added an average of 0.4 percentage points to US consumer spending growth during the current economic expansion.", "speaker": "Emma Pollard", "type": "data_point", "entities": ["US consumer spending", "US economic expansion"], "conviction": "high", "so_what": "A tangible, quantifiable slice of recent consumption growth (0.4pp) is attributable to asset-price gains rather than income growth, meaning this cushion could disappear if wealth gains stall.", "quote": "Our analysis suggests that positive wealth effects have added an average of 0.4 percentage points to consumer spending growth during the current economic expansion.", "locator": "Our analysis suggests that positive wealth effects", "quote_verified": true}, {"claim": "Oxford Economics expects wealth gains to slow, particularly stock market wealth, which should reduce the overall contribution of wealth effects to US economic growth going forward, even as the general influence of wealth effects on the outlook is expected to diminish.", "speaker": "Emma Pollard", "type": "prediction", "entities": ["US consumer spending", "stock wealth", "US economic growth"], "conviction": "medium", "so_what": "Investors should expect the wealth-driven tailwind to consumer spending to fade, which could be a headwind for consumer discretionary names and GDP growth forecasts if stock valuations plateau.", "quote": "However, as we anticipate a slowdown in wealth gains, particularly in stock wealth, the overall contribution to economic growth may wane.", "locator": "However, as we anticipate a slowdown", "quote_verified": true}]}, {"theme": "AI as the wildcard for household wealth", "insights": [{"claim": "The author frames AI's trajectory (its impact on equity valuations and household wealth) as the single biggest wildcard for the outlook on US household wealth and, by extension, consumer spending's contribution to growth.", "speaker": "Emma Pollard", "type": "thesis", "entities": ["AI", "household wealth", "US consumer spending"], "conviction": "medium", "so_what": "Because stock wealth has roughly double the spending multiplier of housing wealth, how AI-driven equity valuations evolve (boom or bust) could be the deciding factor in whether the consumer spending tailwind persists or reverses.", "quote": "Wealth effects are shaping consumer spending, but AI is the biggest wildcard to the outlook for household wealth.", "locator": "Wealth effects are shaping consumer spending", "quote_verified": true}]}], "insight_total": 5, "top_entities": ["US consumer spending", "stock wealth", "housing wealth", "AI", "household wealth", "discretionary spending", "US economic growth"], "source_meta": {"author": "Emma Pollard", "word_count": 359, "paywalled": false}}, {"record_id": "412b40f2c5484256", "source_type": "concepts", "source_name": "Packy McCormick / Not Boring", "source_url": "https://www.notboring.co/p/an-ode-to-counter-positioning", "title": "An Ode to Counter-Positioning", "published_date": "2026-09-10", "language": "en", "processed_at": "2026-09-11T11:51:35Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI", "Positioning", "Energy"], "gist": "Counter-positioning — building a business model incumbents can't copy without damaging their own economics — is the one moat available to young startups before they can earn the other six of Hamilton Helmer's 7 Powers, but it is inherently temporary and must be converted into durable moats (Scale Economies, Network Effects, Switching Costs) before an incumbent adapts or a new startup counter-positions against you.", "themes": [{"theme": "Counter-Positioning as a Startup Moat", "insights": [{"claim": "Counter-positioning is defined (via Lindy CEO Flo Crivello) as developing a business model such that incumbents have conflicting incentives that prevent them from competing effectively — the incumbent's own advantages become the reason it can't respond.", "speaker": "Packy McCormick", "type": "framework", "entities": ["Hamilton Helmer", "Flo Crivello", "Lindy"], "conviction": "high", "so_what": "Use this as a screen for startup moats: ask not 'is this better' but 'would copying this destroy the incumbent's existing profit pool or business model.'", "quote": "the practice of developing your business model such that incumbents have conflicting incentives preventing them to compete effectively", // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
