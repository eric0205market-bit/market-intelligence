 amid weak domestic demand. Shrinking supply of newly tradeable stocks in 2027 offers a favorable base if sentiment recovers. Only a teaser of the article is available.", "themes": [{"theme": "October Selloff and Policy Backstop", "insights": [{"claim": "China's benchmark CSI 300 fell 8.5% in October 2026, its worst month in more than a decade, leaving the onshore market down 14% for the year.", "speaker": "Gavekal Research", "type": "data_point", "entities": ["CSI 300"], "conviction": "high", "so_what": "Chinese equities are in a deep drawdown despite official support.", "quote": "the benchmark CSI 300 fell 8.5% in October, its worst month in more than a decade", "locator": "It’s been a bumpy week", "quote_verified": true}, {"claim": "Market regulators, the People's Bank of China and the National Team all intervened after the October rout, yet the market remains down 14% year to date.", "speaker": "Gavekal Research", "type": "data_point", "entities": ["People’s Bank of China", "National Team", "CSI 300"], "conviction": "high", "so_what": "Official backstops have limited the damage but not restored sentiment.", "quote": null, "locator": "It’s been a bumpy week", "quote_verified": false}]}, {"theme": "AI Dependence and Weak Domestic Demand", "insights": [{"claim": "China's equity fortunes are tied squarely to global sentiment on the AI boom, especially the pace of the US data center buildout.", "speaker": "Gavekal Research", "type": "thesis", "entities": ["China", "US data center buildout"], "conviction": "high", "so_what": "A wobble in US AI capex expectations transmits directly to Chinese stocks.", "quote": "market fortunes are tied squarely to global sentiment on the artificial-intelligence boom", "locator": null, "quote_verified": true}, {"claim": "The reliance on a single AI story is especially intense because domestic demand has shown no significant improvement and policymakers continue to struggle to boost sustainable demand.", "speaker": "Gavekal Research", "type": "causal", "entities": ["China"], "conviction": "high", "so_what": "Without a domestic demand offset, the market lacks an alternative driver.", "quote": null, "locator": "This reliance on a single story", "quote_verified": false}]}, {"theme": "Shrinking Equity Supply as Support", "insights": [{"claim": "The supply of newly tradeable stocks hitting the market should keep shrinking in 2027 to the lowest level in a decade.", "speaker": "Gavekal Research", "type": "prediction", "entities": ["China"], "conviction": "medium", "so_what": "Reduced share supply is a technical tailwind for Chinese equities.", "quote": null, "locator": "the supply of newly tradeable stocks", "quote_verified": false}, {"claim": "Falling supply of tradeable stocks creates a favorable foundation for Chinese equities should sentiment rebound.", "speaker": "Gavekal Research", "type": "thesis", "entities": ["China"], "conviction": "medium", "so_what": "Upside could be amplified when sentiment turns, as supply will not absorb the demand.", "quote": "That creates a favorable foundation should sentiment rebound.", "locator": null, "quote_verified": true}]}], "insight_total": 6, "top_entities": ["CSI 300", "People’s Bank of China", "National Team", "China", "US data center buildout"], "source_meta": {"author": "", "word_count": 177, "paywalled": false}}, {"record_id": "ea207b11b8f100ca", "source_type": "concepts", "source_name": "Gavekal Research", "source_url": "https://research.gavekal.com/teaser/mounting-headwinds-for-us-assets/", "title": "Mounting Headwinds For US Assets", "published_date": "2026-11-09", "language": "en", "processed_at": "2026-11-10T11:11:38Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Positioning"], "gist": "Teaser only: Louis-Vincent Gave restates Gavekal's thesis that US outperformance is ending after a 2024 post-election blow-off top, and asks whether recent events revive or stall it. The body is paywalled and truncated.", "themes": [{"theme": "End of US outperformance", "insights": [{"claim": "Gavekal's running research theme for the past few years is that the age of massive US outperformance is drawing to an end.", "speaker": "Louis-Vincent Gave", "type": "thesis", "entities": ["Gavekal Research", "US equities"], "conviction": "high", "so_what": "Frames a structural case for diversifying away from US assets.", "quote": "the age of massive US outperformance was drawing to an end", "locator": "The point of the Daily reports", "quote_verified": true}, {"claim": "The surge in US relative performance that accompanied Donald Trump's 2024 election victory was probably an exponential blow-off top, typical of climactic bull markets.", "speaker": "Louis-Vincent Gave", "type": "thesis", "entities": ["Donald Trump", "US equities"], "conviction": "medium", "so_what": "If a blow-off top, US relative performance may mean-revert sharply.", "quote": "an exponential “blow-off top” that is fairly typical of climactic bull markets", "locator": null, "quote_verified": true}, {"claim": "The open question as of 9 Nov 2026 is whether recent events revive US outperformance or stall it; the full answer is paywalled, but the title points to mounting headwinds for US assets.", "speaker": "Louis-Vincent Gave", "type": "framework", "entities": ["US assets"], "conviction": "exploratory", "so_what": "Watch for events that confirm or negate the end-of-US-outperformance narrative.", "quote": "whether recent events will revive US outperformance? Or stall it?", "locator": null, "quote_verified": true}]}], "insight_total": 3, "top_entities": ["Louis-Vincent Gave", "Gavekal Research", "Donald Trump"], "source_meta": {"author": "", "word_count": 136, "paywalled": false}}, {"record_id": "5d4539b22042869a", "source_type": "concepts", "source_name": "NY Fed — Liberty Street Economics", "source_url": "https://libertystreeteconomics.newyorkfed.org/2026/11/has-u-s-monetary-policy-really-improved-a-150-year-perspective/", "title": "Has U.S. Monetary Policy Really Improved? A 150-Year Perspective - Liberty Street Economics", "published_date": "2026-11-09", "language": "en", "processed_at": "2026-11-10T11:11:54Z", "processor": "claude-code-sub-opus", "tags": ["Macro"], "gist": "Barnichon and Mesters benchmark 150 years of US monetary policy against the best feasible response to the shocks faced, finding meaningful improvement only in the last thirty years since Volcker. Gains came mainly from better responses to financial crises (early Fed raised rates into panics) and supply shocks (the postwar Fed under-reacted).", "themes": [{"theme": "Framework for judging policy quality", "insights": [{"claim": "Comparing monetary policy across eras requires separating policy quality from the shocks faced, because central bankers do not control their environment and may suffer worse outcomes simply from larger or harder-to-stabilize shocks.", "speaker": "Regis Barnichon", "type": "framework", "entities": ["Federal Reserve"], "conviction": "high", "so_what": "Raw inflation/unemployment records, such as the Great Moderation, are weak evidence of policy skill.", "quote": null, "locator": "Why Is Measuring Monetary Policy Performance So Difficult?", "quote_verified": false}, {"claim": "The authors benchmark actual policy against the best feasible response to the shocks faced, implemented through empirically estimated impulse responses to policy and non-policy shocks rather than a fully specified structural model, for a broad class of macro models.", "speaker": "Regis Barnichon", "type": "framework", "entities": ["Barnichon", "Mesters"], "conviction": "high", "so_what": "The method is model-light, so it can be applied across very different monetary regimes.", "quote": null, "locator": "Our framework addresses this challenge", "quote_verified": false}, {"claim": "Two complementary metrics are produced: the percentage correction to the policy-path response to each shock, and the distance to minimum loss (DML), the avoidable expected squared inflation and unemployment deviations under the best feasible response.", "speaker": "Regis Barnichon", "type": "framework", "entities": ["distance to minimum loss"], "conviction": "high", "so_what": "One metric grades the reaction function; the other grades the economic cost of its errors.", "quote": "The policy-path correction thus assesses the reaction function directly, while the distance to minimum loss captures the economic consequences of policy mistakes.", "locator": "The policy-path correction thus assesses", "quote_verified": true}, {"claim": "The study covers four periods: Gold Standard (1879-1912), early Fed (1913-41), postwar (1954-84; table labels 1951-84) and post-Volcker (1990-2019), using shocks including bank panics, government spending, energy, inflation expectations, TFP and monetary policy.", "speaker": "Regis Barnichon", "type": "data_point", "entities": ["Gold Standard", "Federal Reserve", "Volcker"], "conviction": "high", "so_what": "Note that the sample ends in 2019, so post-2020 inflation and policy are not evaluated.", "quote": null, "locator": "We apply these measures to four periods", "quote_verified": false}]}, {"theme": "Late arrival of policy improvement", "insights": [{"claim": "Monetary policy has not steadily improved over 150 years; most gains emerged only after Volcker's disinflation, with little evidence the Fed's systematic response to shocks improved materially before.", "speaker": "Regis Barnichon", "type": "thesis", "entities": ["Paul Volcker", "Federal Reserve"], "conviction": "high", "so_what": "Challenges the narrative of gradual learning and suggests modern success is institutional and recent, not guaranteed.", "quote": "There is surprisingly little evidence that the Federal Reserve’s systematic response to macroeconomic shocks improved materially before.", "locator": "Finding #1", "quote_verified": true}, {"claim": "Policy-path corrections stayed above 100 percent on average in the Gold Standard, early Fed and postwar periods, indicating a reaction function far from optimum.", "speaker": "Regis Barnichon", "type": "data_point", "entities": ["Gold Standard", "Federal Reserve"], "conviction": "medium", "so_what": "Historic policy was not just unlucky but systematically far from the best feasible response.", "quote": null, "locator": "Finding #1", "quote_verified": false}, {"claim": "In the post-Volcker period corrections shrink to an average absolute value of around 30 percent and become statistically insignificant.", "speaker": "Regis Barnichon", "type": "data_point", "entities": ["Volcker"], "conviction": "high", "so_what": "Modern policy is statistically indistinguishable from the best feasible response on average, though not perfect.", "quote": "Only in the post-Volcker period do these corrections become substantially smaller—and statistically insignificant—with an average absolute correction of around 30 percent.", "locator": "Finding #1", "quote_verified": true}, {"claim": "Median distance to minimum loss fell from 97.4 in the early Fed (credible set 57-230) to 8.4 in the Gold Standard era, 6.6 post-WWII and 3.2 post-Volcker (1.4-7.2).", "speaker": "Regis Barnichon", "type": "data_point", "entities": ["Federal Reserve", "Gold Standard"], "conviction": "medium", "so_what": "The early Fed was an extreme outlier in avoidable macro loss, about 30 times the modern level.", "quote": null, "locator": "Distance to Minimum Loss (DML)", "quote_verified": false}, {"claim": "The costs of policy mistakes vary dramatically across periods: the early Fed's avoidable losses were far larger than those of the Gold Standard and postwar eras even where reaction-function errors were comparable.", "speaker": "Regis Barnichon", "type": "causal", "entities": ["Federal Reserve"], "conviction": "high", "so_what": "The size of the error matters less than the fragility of the economy it hits, such as financial panics.", "quote": "the policy mistakes in the Early Fed period were far more costly when compared to those in the Gold Standard era and the Post WWII period", "locator": "Finding #1", "quote_verified": true}]}, {"theme": "Financial-crisis response", "insights": [{"claim": "The largest improvements in monetary policy came in the response to financial shocks, measured by bank panics.", "speaker": "Regis Barnichon", "type": "thesis", "entities": ["Federal Reserve"], "conviction": "high", "so_what": "Crisis response is where modern central banking adds most value.", "quote": "The largest improvements in monetary policy occurred in the response to financial shocks.", "locator": "Finding #2", "quote_verified": true}, {"claim": "In the early Fed, bank panics were followed by higher policy rates; because panics also lowered inflation, real rates rose, making policy contractionary exactly when support was needed.", "speaker": "Regis Barnichon", "type": "causal", "entities": ["Federal Reserve", "bank panics"], "conviction": "high", "so_what": "This is the mechanism behind the 1920s-30s policy failure and the large early-Fed DML.", "quote": "Because banking panics also lowered inflation, the real policy rate increased substantially", "locator": "Finding #2", "quote_verified": true}, {"claim": "The optimal adjustment for early Fed bank panics would have been to lower rates, substantially stabilizing both inflation and unemployment; bank-panic DML in that era was 29.4 of the 97.4 total.", "speaker": "Regis Barnichon", "type": "data_point", "entities": ["Federal Reserve"], "conviction": "medium", "so_what": "Easing into panics is the empirically supported benchmark.", "quote": null, "locator": "Finding #2", "quote_verified": false}, {"claim": "After Volcker the Fed already lowers rates after financial shocks, the estimated adjustment is small and insignificant, and bank-panic DML is just 0.2.", "speaker": "Regis Barnichon", "type": "data_point", "entities": ["Volcker", "Federal Reserve"], "conviction": "high", "so_what": "Markets can reasonably expect easing in financial stress, consistent with the modern Fed's reaction function.", "quote": null, "locator": "Finding #2", "quote_verified": false}]}, {"theme": "Great Inflation and supply shocks", "insights": [{"claim": "The postwar Fed's reaction function was almost as far from optimum as the early Fed's, but the failure was reacting too weakly to supply-side disturbances (energy, productivity and inflation-expectation shocks) rather than to financial crises.", "speaker": "Regis Barnichon", "type": "thesis", "entities": ["Federal Reserve"], "conviction": "high", "so_what": "Policy failures take different forms by era; weak response to supply shocks drives inflation episodes.", "quote": "Rather than responding poorly to financial crises, the postwar Federal Reserve reacted too weakly to a range of supply-side disturbances", "locator": "Finding #3", "quote_verified": true}, {"claim": "After inflation-expectation shocks, inflation rose steadily but the policy rate responded only weakly, so real rates fell and reinforced inflation; the optimal correction restores a much stronger rate response, consistent with the Taylor principle.", "speaker": "Regis Barnichon", "type": "causal", "entities": ["Taylor principle", "inflation expectations"], "conviction": "high", "so_what": "Un-anchored expectations plus insufficient rate response is the recipe for persistent inflation.", "quote": "consistent with the Taylor principle", "locator": "Finding #3", "quote_verified": true}, {"claim": "Postwar corrections for the inflation-expectations shock were 6.9 percent (credible set 2.1-24.9), and the early-Fed inflation-expectations DML was 30.2.", "speaker": "Regis Barnichon", "type": "data_point", "entities": ["inflation expectations"], "conviction": "low", "so_what": "Expectation shocks were the most notable single source of postwar policy-path error, though the table layout is hard to parse.", "quote": null, "locator": "Percentage correction to policy path response", "quote_verified": false}, {"claim": "Post-Volcker supply-shock corrections are small and insignificant (energy -0.6, inflation expectations -1.1, DML around 0.1-0.2 each), implying the modern Fed responds near-optimally to supply shocks.", "speaker": "Regis Barnichon", "type": "data_point", "entities": ["Volcker"], "conviction": "medium", "so_what": "Supports the view that energy and supply shocks are manageable under the current reaction function.", "quote": null, "locator": "Percentage correction to policy path response", "quote_verified": false}]}, {"theme": "Implications and caveats", "insights": [{"claim": "Most of the modern improvement reflects better responses to financial and supply shocks, among other developments, rather than just a more favorable environment.", "speaker": "Regis Barnichon", "type": "contrarian", "entities": ["Federal Reserve"], "conviction": "medium", "so_what": "Counters the claim that the Great Moderation was mostly luck, at least for the post-Volcker era.", "quote": "Most of the gains reflect, among other developments, substantially better responses to financial shocks and supply shocks.", "locator": "Intro", "quote_verified": true}, {"claim": "Because the evidence ends in 2019 and the improvements are only about thirty years old, the track record of near-optimal policy rests on a short sample, which warrants caution about extrapolating it to future regimes.", "speaker": "Regis Barnichon", "type": "thesis", "entities": ["Federal Reserve"], "conviction": "exploratory", "so_what": "The modern regime has been tested by few crises of the size seen in the early Fed.", "quote": null, "locator": null, "quote_verified": false}]}], "insight_total": 19, "top_entities": ["Federal Reserve", "Volcker", "Gold Standard", "Taylor principle", "distance to minimum loss", "bank panics", "inflation expectations", "Great Inflation"], "source_meta": {"author": "Regis Barnichon", "word_count": 1780, "paywalled": false}}, {"record_id": "eaf1e3f1d4074e27", "source_type": "concepts", "source_name": "Peterson Institute (PIIE)", "source_url": "https://www.piie.com/blogs/realtime-economics/2026/chinas-undervalued-currency-driving-its-trade-surplus-higher", "title": "China's undervalued currency is driving its trade surplus higher", "published_date": "2026-11-09", "language": "en", "processed_at": "2026-11-10T11:11:51Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Geopolitics"], "gist": "PIIE argues China's real exchange rate is undervalued by about 20 percent, consistent with the IMF's 21 percent, and that this is driving a trade surplus now larger relative to world GDP than during the 2000s China Shock. Rebalancing needs substantial appreciation plus domestic consumption reforms.", "themes": [{"theme": "Size of RMB undervaluation", "insights": [{"claim": "PIIE estimates China's currency is undervalued by around 20 percent in 2026, with the real effective exchange rate about 8 percent below its trend but the trend itself embedding undervaluation.", "speaker": "Joseph E. Gagnon,Nishtha Agrawal", "type": "data_point", "entities": ["China", "PIIE", "REER"], "conviction": "high", "so_what": "Implies sizable RMB appreciation is needed to rebalance trade.", "quote": "China's currency is undervalued by around 20 percent.", "locator": "As Europe prepares to discuss", "quote_verified": true}, {"claim": "The log REER gap that sets the ex-gold current account to zero is 0.12 versus an estimated -0.08 in 2026, which yields roughly 20 percent total undervaluation.", "speaker": "Joseph E. Gagnon,Nishtha Agrawal", "type": "data_point", "entities": ["China", "REER"], "conviction": "high", "so_what": "Shows how the 20 percent figure is derived.", "quote": null, "locator": "Under these assumptions", "quote_verified": false}, {"claim": "The 20 percent estimate matches the IMF 2026 External Sector Report finding of 21 percent REER undervaluation in 2025, and is echoed by Brad Setser and Goldman Sachs economists.", "speaker": "Joseph E. Gagnon,Nishtha Agrawal", "type": "data_point", "entities": ["IMF", "Brad Setser", "Goldman Sachs", "China"], "conviction": "high", "so_what": "Convergence across institutions strengthens the case against Chinese denials.", "quote": null, "locator": "This assessment is in accord", "quote_verified": false}, {"claim": "Applying the Cline-Williamson fundamental equilibrium exchange rate framework with a zero target current account also gives roughly 20 percent undervaluation.", "speaker": "Joseph E. Gagnon,Nishtha Agrawal", "type": "framework", "entities": ["William R. Cline", "John Williamson", "PIIE"], "conviction": "medium", "so_what": "A second method corroborates the regression result.", "quote": null, "locator": "This analysis is similar in spirit", "quote_verified": false}, {"claim": "The equilibrium REER gap result is robust: across eight regression specifications it ranges only between 0.11 and 0.14.", "speaker": "Joseph E. Gagnon,Nishtha Agrawal", "type": "data_point", "entities": ["China"], "conviction": "medium", "so_what": "Reduces concern that the finding depends on specification choices.", "quote": null, "locator": "Note 7", "quote_verified": false}]}, {"theme": "Trade surplus and the China Shock", "insights": [{"claim": "Relative to world economic size, China's trade surplus already exceeds its level during the 2000s China Shock and is still rising, taking sales from manufacturers outside China.", "speaker": "Joseph E. Gagnon,Nishtha Agrawal", "type": "thesis", "entities": ["China"], "conviction": "high", "so_what": "Raises risk of trade frictions and protection against Chinese goods.", "quote": "it continues to rise, grabbing sales from manufacturers outside China and contributing to rising international tensions.", "locator": "As Europe prepares to discuss", "quote_verified": true}, {"claim": "The goods trade surplus in January-September 2026 came in notably higher than expected, suggesting the IMF's 2026 projection is likely too low.", "speaker": "Joseph E. Gagnon,Nishtha Agrawal", "type": "prediction", "entities": ["IMF", "China"], "conviction": "medium", "so_what": "Surplus forecasts may be revised up, adding to trade tension.", "quote": null, "locator": "Note 6", "quote_verified": false}, {"claim": "If China's true relative PPP GDP gap is deeply negative, given collapsing property prices and inflation undershooting since 2023, that would push the trade surplus up further.", "speaker": "Joseph E. Gagnon,Nishtha Agrawal", "type": "causal", "entities": ["China"], "conviction": "medium", "so_what": "Domestic weakness feeds external surplus.", "quote": null, "locator": "Note 6", "quote_verified": false}, {"claim": "Net nonmonetary gold imports are on track to reach a record 1.0 percent of China's GDP in 2026, depressing the measured current account although they function mostly as a financial asset.", "speaker": "Joseph E. Gagnon,Nishtha Agrawal", "type": "data_point", "entities": ["China", "gold"], "conviction": "medium", "so_what": "Headline surplus understates the underlying surplus excluding gold.", "quote": null, "locator": "Before we take that measurement", "quote_verified": false}]}, {"theme": "Real exchange rate dynamics", "insights": [{"claim": "China's REER fell sharply since 2022 because the nominal dollar rate barely moved while trading partners had an inflation burst and China experienced deflation.", "speaker": "Joseph E. Gagnon,Nishtha Agrawal", "type": "causal", "entities": ["China", "REER"], "conviction": "high", "so_what": "Deflation is acting as an implicit devaluation, boosting competitiveness.", "quote": null, "locator": "In assessing the valuation", "quote_verified": false}, {"claim": "China's REER has a trend increase over 30 years from faster productivity growth, with trend growth around 1 percent in the 1990s, 1.5 percent in the 2000s and 0.5 percent after 2020.", "speaker": "Joseph E. Gagnon,Nishtha Agrawal", "type": "data_point", "entities": ["China"], "conviction": "medium", "so_what": "Slower relative growth reduces the appreciation expected from fundamentals.", "quote": null, "locator": "Note 2", "quote_verified": false}, {"claim": "Chinese officials downplay the link between currency and trade surplus, repeating their 2006-07 arguments, a period the data also contradict.", "speaker": "Joseph E. Gagnon,Nishtha Agrawal", "type": "contrarian", "entities": ["China"], "conviction": "high", "so_what": "Chinese denials are not supported by past or present evidence.", "quote": "The data reject the Chinese position, both then and now.", "locator": "As Europe prepares to discuss", "quote_verified": true}]}, {"theme": "Regression model", "insights": [{"claim": "A simple equation using trade openness times the lagged log REER gap and the relative PPP GDP gap explains 88 percent of movements in China's ex-gold current account balance over 1994-2025.", "speaker": "Joseph E. Gagnon,Nishtha Agrawal", "type": "framework", "entities": ["China"], "conviction": "high", "so_what": "Exchange rate gaps have strong, statistically significant effects on China's external balance.", "quote": null, "locator": "The following simple equation", "quote_verified": false}, {"claim": "The exchange rate effect scales with trade openness, so REER gaps matter more when trade is a larger share of the economy; openness was 0.38 in 2025.", "speaker": "Joseph E. Gagnon,Nishtha Agrawal", "type": "causal", "entities": ["China"], "conviction": "medium", "so_what": "Appreciation would work through a large trade channel.", "quote": null, "locator": "The equation implies", "quote_verified": false}, {"claim": "A zero current account benchmark is reasonable for China since a fast-growing developing economy might run a deficit but rapid aging raises saving; the IMF norm of 0.6 percent of GDP is biased upward by excessive official reserves.", "speaker": "Joseph E. Gagnon,Nishtha Agrawal", "type": "thesis", "entities": ["IMF", "China"], "conviction": "medium", "so_what": "Benchmark choice drives the undervaluation estimate; IMF may revise its norm.", "quote": null, "locator": "Note 5", "quote_verified": false}]}, {"theme": "Policy implications and rebalancing", "insights": [{"claim": "Sustainable growth requires China to consume far more of what it produces and import more, through social safety net reform and easier market access for foreign firms.", "speaker": "Joseph E. Gagnon,Nishtha Agrawal", "type": "thesis", "entities": ["China"], "conviction": "high", "so_what": "Domestic demand reform is the core of rebalancing.", "quote": null, "locator": "To get sustainable growth", "quote_verified": false}, {"claim": "Appreciation requires active support of Chinese policymakers since the government retains multiple levers of control over the foreign exchange market, which is why European policymakers want to discuss the exchange rate.", "speaker": "Joseph E. Gagnon,Nishtha Agrawal", "type": "causal", "entities": ["China", "Europe"], "conviction": "high", "so_what": "Currency appreciation is a political negotiation, not a market outcome.", "quote": null, "locator": "Despite some liberalization", "quote_verified": false}, {"claim": "The United States is curiously silent as Europe prepares to discuss exchange rates with China.", "speaker": "Joseph E. Gagnon,Nishtha Agrawal", "type": "anecdote", "entities": ["Europe", "United States", "China"], "conviction": "low", "so_what": "Signals divergent transatlantic approaches to currency issues.", "quote": null, "locator": "As Europe prepares to discuss", "quote_verified": false}, {"claim": "Currency appreciation is not a silver bullet; policies to boost Chinese consumption remain essential for strong, balanced growth.", "speaker": "Joseph E. Gagnon,Nishtha Agrawal", "type": "thesis", "entities": ["China"], "conviction": "high", "so_what": "Appreciation alone will not fix imbalances.", "quote": null, "locator": "As important as currency appreciation", "quote_verified": false}]}], "insight_total": 19, "top_entities": ["China", "PIIE", "IMF", "REER", "Europe", "Goldman Sachs", "Brad Setser", "William R. Cline"], "source_meta": {"author": "Joseph E. Gagnon,Nishtha Agrawal", "word_count": 1331, "paywalled": false}}, {"record_id": "537ac0abde2959fd", "source_type": "concepts", "source_name": "SF Fed Economic Letters", "source_url": "https://www.frbsf.org/research-and-insights/publications/economic-letter/2026/11/are-inflation-expectations-currently-well-anchored/", "title": "Are Inflation Expectations Currently Well Anchored? - San Francisco Fed", "published_date": "2026-11-09", "language": "en", "processed_at": "2026-11-10T11:11:59Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Positioning"], "gist": "SF Fed researchers estimate how long-run breakeven inflation reacts to FOMC surprises: -0.34 over 1999-2026, troughing near -0.89 in 2018, but near zero by June 2026 (five-year window -0.23, -0.08 with press conferences). They conclude expectations are increasingly well anchored, leaving the Fed room to tolerate temporary supply-shock inflation such as higher oil prices.", "themes": [{"theme": "Sensitivity measure framework", "insights": [{"claim": "The SF Fed gauges the strength of the Fed's nominal anchor by how much long-run market inflation expectations respond to monetary policy surprises; a value near zero means a strong, credible anchor.", "speaker": "Taerin Kim", "type": "framework", "entities": ["Federal Reserve", "SF Fed", "Bocola et al."], "conviction": "high", "so_what": "Gives a market-based, high-frequency read on Fed credibility.", "quote": "A value of this sensitivity measure close to zero indicates a strong credible anchor", "locator": "The response of market participants", "quote_verified": true}, {"claim": "A significantly negative sensitivity means unexpected policy moves make markets revise their view of the Fed's commitment to its inflation goal, signaling a weaker anchor.", "speaker": "Taerin Kim", "type": "framework", "entities": ["Federal Reserve"], "conviction": "high", "so_what": "Negative readings flag credibility uncertainty that can amplify policy surprises.", "quote": null, "locator": "By contrast, a significantly negative value", "quote_verified": false}, {"claim": "The measure is built from one-day changes in 5-year 5-year-forward breakeven inflation (Treasuries minus TIPS) around FOMC announcements, regressed on policy surprises from federal funds contracts spanning one month to one year.", "speaker": "Taerin Kim", "type": "framework", "entities": ["FOMC", "TIPS", "Treasury", "5y5y breakeven"], "conviction": "high", "so_what": "Method is replicable from public market data.", "quote": null, "locator": "Estimating perceptions of central bank credibility", "quote_verified": false}, {"claim": "Policy surprises are measured in a 30-minute window around the FOMC statement and a 100-minute window that also covers the press conference; 1999-2026 FOMC events are used, excluding July 2008-June 2009 for TIPS market dysfunction.", "speaker": "Taerin Kim", "type": "data_point", "entities": ["FOMC", "TIPS"], "conviction": "high", "so_what": "Method choices matter: the window changes the conclusion about anchoring.", "quote": null, "locator": "We compute the monetary policy surprise", "quote_verified": false}]}, {"theme": "Historical anchor strength", "insights": [{"claim": "Over the full 1999-2026 sample the sensitivity measure is -0.34 and statistically significant, implying the nominal anchor may not always have been fully credible.", "speaker": "Taerin Kim", "type": "data_point", "entities": ["Federal Reserve"], "conviction": "high", "so_what": "Long-run history shows only partial credibility.", "quote": "Estimates for the entire 1999–2026 sample yield a sensitivity measure of –0.34.", "locator": "Estimates for the entire 1999–2026 sample", "quote_verified": true}, {"claim": "A 1 percentage point unexpected tightening lowered long-run inflation expectations by roughly 0.34 percentage point, as markets raised the odds of a strongly inflation-averse Fed.", "speaker": "Taerin Kim", "type": "causal", "entities": ["Federal Reserve", "FOMC"], "conviction": "high", "so_what": "Tightening surprises lower, not raise, long-run breakevens when credibility is imperfect.", "quote": null, "locator": "In particular, the result indicates", "quote_verified": false}, {"claim": "The most negative readings came in 2018-2020, with a five-year-window trough of -0.89 in 2018 and a 10-year-window trough of -0.81 in 2019, showing expectations risked becoming unanchored just before the pandemic.", "speaker": "Taerin Kim", "type": "data_point", "entities": ["Federal Reserve"], "conviction": "high", "so_what": "Pre-pandemic anchor was at its weakest, a benchmark for downside risk.", "quote": null, "locator": "The most consistently negative", "quote_verified": false}, {"claim": "The authors attribute the 2018-2020 weakness to persistently below-target realized inflation, which likely lowered long-run expectations.", "speaker": "Taerin Kim", "type": "causal", "entities": ["Federal Reserve"], "conviction": "medium", "so_what": "Undershooting inflation, not overshooting, eroded the anchor.", "quote": null, "locator": "These persistently negative values", "quote_verified": false}]}, {"theme": "Post-2020 re-anchoring", "insights": [{"claim": "Estimates began rising toward zero in 2020, likely reflecting the August 2020 adoption of average inflation targeting and the March 2022 start of the post-pandemic tightening cycle.", "speaker": "Taerin Kim", "type": "causal", "entities": ["Federal Reserve", "Average inflation targeting"], "conviction": "medium", "so_what": "Both tolerance for temporary overshoots and a credible tightening reinforced the anchor.", "quote": null, "locator": "The estimates for both rolling windows", "quote_verified": false}, {"claim": "In June 2026 the five-year rolling estimate is -0.23 and statistically indistinguishable from zero, while the 10-year estimate is -0.32, still significant but well up from its 2019 trough.", " // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
