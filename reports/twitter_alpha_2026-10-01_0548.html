<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

"US 10Y Yield Breaks 5.30% — Highest Since 2002, Bond Vol Spikes", "category": ["macro"], "items": [{"author": "DCinvestor", "summary": "Quoting a headline that the US 10Y yield rose above 5.30%, the highest since April 2002 (+55bp in September, +138bp since the March 2026 low, mortgage rates near 7.60%), DCinvestor mocks Treasury Secretary Bessent's 'I am the house now' posture — the bond market is the house. Separately, he lists a '1970s playbook' checklist: gold rallying, unpopular foreign war, Middle East instability, oil supply shocks, rising inflation, strained consumer, a creaking dollar system, airplane hijackings — 'what's next?'", "tweet_url": "https://x.com/DCinvestor/status/2105458218860486798", "images": ["https://pbs.twimg.com/tweet_video_thumb/HTgXFepbYAALzoB.jpg"], "type": "tweet"}, {"author": "Fullcarry", "summary": "Fullcarry debates @aRishisays and @talmonsmith on why long yields are rising. His view: unemployment has been structurally low for a decade, and wide term spreads with low unemployment have precedent (late 1960s, inflation concern). We are still normalizing from QE-era suppression of long rates; there's been excessive fiscal expansion; and the duration investor base is shifting from price-insensitive official buyers who didn't pay taxes to private buyers who do (top marginal rate 40.8%), which requires higher yields to clear. With the Fed targeting 2% inflation, duration below 5% is mispriced for a taxpaying investor, so 30s clearing below 5% is hard to see. Conclusion: 'normalizing to more rational levels but nothing scary here' — USTs are 'a fun trade' because the drivers keep shifting. Chart via Barclays attached.", "tweet_url": "https://x.com/Fullcarry/status/2105360972190007607", "images": ["https://pbs.twimg.com/media/HTfLZ04XgAAkM0m.png"], "type": "thread"}, {"author": "beaniemaxi", "summary": "Replying to @notthreadguy on why yields are up: hyperscalers are funding data centers with huge bond sales and corporate borrowing, which abilise yields.", "tweet_url": "https://x.com/pboockvar/status/2105390972884455784", "images": [], "type": "tweet"}, {"author": "EconguyRosie", "summary": "EconguyRosie thanks attendees of 'An Afternoon with Rosie and Gundlach': Jeffrey Gundlach, 40+ years in bonds, said this is the most unhinged market he has ever seen. They argued whether the cause is the debt or the Fed. Replay linked; photos attached.", "tweet_url": "https://x.com/EconguyRosie/status/2105374105625080199", "images": ["https://pbs.twimg.com/media/HTfJ4joXkAEuWQU.jpg", "https://pbs.twimg.com/media/HTfJ7XnWsAEXcVb.jpg", "https://pbs.twimg.com/media/HTfJ7YBXUAITOnT.jpg"], "type": "tweet"}, {"author": "Swedish_uranium", "summary": "Swedish_uranium's quarter-end metals pulse: gold ~$4,153/oz (higher bond yields weighed despite softer US inflation data, but still on course for a quarterly gain after a sharp September decline); silver ~$60.18, -2.1% on the day; copper on track for ~+8% in Q3 as China's manufacturing PMI returned to growth; uranium in focus after a US federal RFI targeting up to 4M lb/yr of domestic uranium from 2030 (interest, not a purchase commitment). Next move for gold/silver 'hinges heavily on rates'.", "tweet_url": "https://x.com/Swedish_uranium/status/2105392498269126739", "images": [], "type": "tweet"}, {"author": "Evan_ss6", "summary": "Evan_ss6 mocks the timeline 'shrieking about yields and oil' as if an asset were at $600 — when it's actually just up against all-time highs (chart attached; the asset isn't named in the text).", "tweet_url": "https://x.com/Evan_ss6/status/2105486703100121530", "images": ["https://pbs.twimg.com/media/HTgw_h8WoAAPxp8.jpg"], "type": "tweet"}]}, {"cluster": "Micron Q4 FY26 — $54.2bn Revenue (+379% YoY), Guide $61.5bn", "category": ["tech", "AI", "positioning"], "items": [{"author": "AndreasSteno", "summary": "AndreasSteno's five takeaways (RealVision live notes): (1) Korea's export data called it again; Micron printed $54.2bn revenue (+379% YoY, $3bn above consensus) and guided next quarter to $61.5bn vs. street $57bn — Q4 was a 14-week quarter, so the 13-week Q1 guide is an even bigger sequential step. (2) Cyclicality debate 'over for now': 87% gross margin, ~$100bn of remaining performance obligations in strategic customer agreements, $33bn quarterly FCF, $73bn cash — funds Idaho buildout without debt markets, something neoclouds can't say. (3) Valuation: run-rate EPS ~$153 at a $1,070 share price is ~7x vs S&P 22x and CrowdStrike ~200x; guidance says profits rise into 2027 as HBM4 volume lands. (4) Quality of earnings is the factor in a hiking cycle; memory is the all-weather asset in the frontier-slows debate (training wants bandwidth, inference wants capacity). Prefers US memory over Korea into the licence decision; holds, does not add after a 290% run. (5) Watch capex: FY26 capex $27bn vs $62bn FCF; if all three memory makers raise capex sharply together, that's the first 2027-28 warning sign. Management flagged price increases are moderating — volume and contracts now do the work.", "tweet_url": "https://x.com/AndreasSteno/status/2105392657392709713", "images": [], "type": "thread"}, {"author": "aleabitoreddit", "summary": "aleabitoreddit says he'll comment on $MU and $JBL earnings later (still sick). In a reply he says he thought JBL's earnings were great and that when the market reaction disagrees, 'that usually just means there's a buying opportunity'.", "tweet_url": "https://x.com/aleabitoreddit/status/2105397070681248021", "images": [], "type": "thread"}]}, {"cluster": "Gemini 4 Argon Launch — Google Back at the Frontier, But Not #1", "category": ["AI", "tech"], "items": [{"author": "hosseeb", "summary": "hosseeb: Google's new Gemini 4 Argon benchmarks look frontier-level, tied with GPT-6 Astra, but at $2 in/$10 out it's strictly dominated by Opus 5.5 High — same price per task, and Opus is smarter. Google models also tend to underperform on 'vibes'. Replying to @toly and @EMostaque on whether hyperscalers will squeeze the labs, he argues it's a classic tech-cycle transition (Cisco/Microsoft/IBM didn't win) and the squeeze comes from the other side: if Amazon/MSFT/Google ask too much, Anthropic and OpenAI will pull their models from those platforms. Intelligence is scarce, not enterprise contracts; give it two years and Bedrock/Vertex-only companies will switch if that's the only way to get access.", "tweet_url": "https://x.com/hosseeb/status/2105395003853885457", "images": ["https://pbs.twimg.com/media/HTfcsVeWcAE4kQN.jpg"], "type": "thread"}, {"author": "cryptopunk7213", "summary": "cryptopunk7213: Gemini 4 is 'unexpectedly' a good model — new coding record (deepSWE 1.1), head-to-head with GPT-6 and Opus 5.5, Google's best reasoning model yet. But it isn't 'best' at anything: a catch-up model, not #1 — the first release since Demis stepped down. Benchmark images attached.", "tweet_url": "https://x.com/cryptopunk7213/status/2105403397780148312", "images": ["https://pbs.twimg.com/media/HTflOzQXIAAS6nX.jpg", "https://pbs.twimg.com/media/HTflOzYWcAM8Cez.jpg", "https://pbs.twimg.com/media/HTflOzTWwAAllIU.jpg"], "type": "tweet"}, {"author": "aleabitoreddit", "summary": "aleabitoreddit posted the Gemini 4 Argon benchmark vs. GPT-6 Astra and Anthropic Fable 5.1 / Opus 5.5: 'looks like Google is back.' Caveat: anecdotally Google's models get 'hard nerfed' soon after public release, maybe due to compute constraints.", "tweet_url": "https://x.com/aleabitoreddit/status/2105397070681248021", "images": ["https://pbs.twimg.com/media/HTfdrnNawAAhn0u.jpg"], "type": "thread"}, {"author": "buccocapital", "summary": "buccocapital jokes someone should get eyes on Tae Kim 'for everyone's safety' in response to the Argon announcement (rolled out to trusted testers via the Fairwind Program, focus on cybersecurity defense).", "tweet_url": "https://x.com/buccocapital/status/2105399557207343320", "images": [], "type": "tweet"}]}, {"cluster": "Model Economics — GPT-6.1 Sol, OpenRouter Usage, Compute Scarcity", "category": ["AI", "tech"], "items": [{"author": "nicbstme", "summary": "nicbstme (3 years building LLM agents): the benchmark he trusts most is OpenRouter usage — 'voting with your credit card'. Small models: DeepSeek Flash ~22.7T tokens/week, GLM Flash ~10.6T, GPT-6 Luna ~5.1T. Frontier: Opus 5.5 ~1.9T, GPT-6 Sol ~1.2T, Gemini Pro ~0.2T (~10x less than Opus). Compare within category; you can game a benchmark but not where companies spend. The eval that matters is your own on real customer tasks, so build a multi-model platform with customer evals routing tasks.", "tweet_url": "https://x.com/nicbstme/status/2105464782811697542", "images": [], "type": "tweet"}, {"author": "nicbstme", "summary": "nicbstme praises OpenAI's GPT-6.1 Sol ('near-Astra intelligence for a fifth of the price') as great for his COGS.", "tweet_url": "https://x.com/nicbstme/status/2105470516609839320", "images": [], "type": "tweet"}, {"author": "nicbstme", "summary": "Replying to a question on spare capacity: most 2026-27 compute is already booked; he cites OpenAI CFO Sarah Friar on All-In saying 2026 capacity is effectively unavailable and 2027 very limited.", "tweet_url": "https://x.com/nicbstme/status/2105385426878095587", "images": [], "type": "tweet"}, {"author": "nicbstme", "summary": "When software is a commodity, the moat is value delivered per unit of compute; model quality compounds it (better results with less compute → higher gross margins → more compute to train the next model). 'The winning flywheel for the next 24 months.'", "tweet_url": "https://x.com/nicbstme/status/2105339193253920970", "images": [], "type": "tweet"}, {"author": "Geiger_Capital", "summary": "Geiger_Capital: 'We need more data centers' quoting a thread where GPT-6 Astra decoded a cipher to one of Napoleon's generals, unread for 217 years, in ~6 hours from a single image and goal.", "tweet_url": "https://x.com/Geiger_Capital/status/2105476684933652711", "images": [], "type": "tweet"}, {"author": "Delphi_Digital", "summary": "Delphi Digital's Hivemind clip: José on the real risk behind the AI buildout — 'their demand is underwriting the build out of these data centers. If it's a structural demand problem, then we're cooked.'", "tweet_url": "https://x.com/Delphi_Digital/status/2105357005351158249", "images": [], "type": "thread"}]}, {"cluster": "OpenSea WETH-Approval Exploit and NFT Recovery", "category": ["crypto", "regulation"], "items": [{"author": "0xQuit", "summary": "0xQuit explains the exploit: if you have an open approval on wrapped ETH, it can be taken. If you hold no WETH nothing is stolen — but accepting an NFT offer then delivers WETH that is stolen immediately. Before accepting, users get a warning to revoke the approval. OpenSea is untangling it; replies note OpenSea was 'the first and seems they'll be the last standing'. Also quips 'please not another industry-threatening vulnerability, not yet' (#105).", "tweet_url": "https://x.com/0xQuit/status/2105363478190129338", "images": [], "type": "thread"}, {"author": "0xQuit", "summary": "0xQuit's recovery tally: returned assets include 75 Pirates of Fukushu, 57 Gucci, 50 Land of Valeria, 44 Chibi Heads, 14 CryptoMories, 15 10KTF assets, 5 V1 Phunks and ~15 other items, all added to a claim site. Subsequent posts: 410 more 10KTF 'Grailed' recovered, Creepz #4043 returned, and another address joining the recovery. Also warns of impersonators who say they'll DM (they won't). Stacy_muur separately warns impostors now put handles in their bio.", "tweet_url": "https://x.com/0xQuit/status/2105424319358861343", "images": [], "type": "thread"}]}, {"cluster": "LAPTOP Token Fallout and Hunter Biden on the Clarity Act", "category": ["crypto", "regulation"], "items": [{"author": "laurashin", "summary": "Laura Shin/Unchained: Hunter Biden says a market-maker error drove LAPTOP's launch-day spike to a $317bn market cap — 'pure fiction' — and that the firm has admitted it internally. In follow-ups she points to the token's disclosures PDF naming Wintermute and G20 as involved parties.", "tweet_url": "https://x.com/laurashin/status/2105483652377551295", "images": [], "type": "tweet"}, {"author": "laurashin", "summary": "Interview takeaways (via FT/Unchained): Hunter Biden says Trump's refusal to bend on ethics rules touching his family is the 'single biggest reason' the Clarity Act died (while also blaming Democrats), calling Trump a 'max extractor' in crypto. He predicts passage will be 'very, very difficult' over the next two years as Democrats gaining ground in Congress have other priorities (#7), and criticizes Elizabeth Warren for siding with banks on crypto given the 2008 bailout and money printing (#6).", "tweet_url": "https://x.com/laurashin/status/2105455614453534811", "images": [], "type": "thread"}, {"author": "laurashin", "summary": "Unchained episode: @austincampbell argues that if your unsandboxed AI agent hacks something, you — not the agent — are on the hook, using Tesla FSD as the analogy.", "tweet_url": "https://x.com/laurashin/status/2105462745718296656", "images": [], "type": "thread"}]}, {"cluster": "NEAR Spot ETF Debut and the 'Privacy AI' Narrative", "category": ["crypto", "AI"], "items": [{"author": "Matt_Hougan", "summary": "Matt_Hougan (Bitwise): Day-2 stats for the Bitwise NEAR ETF $NRR, the first US spot NEAR ETP — net inflows $13.2M, volume $20.1M, AUM $52.8M. 'Strong launch', a big week for NEAR.", "tweet_url": "https://x.com/Matt_Hougan/status/2105511075449876703", "images": [], "type": "tweet"}, {"author": "zeroxkyle", "summary": "zeroxkyle: the Privacy-AI narrative let NEAR add ~$5bn of market cap in a month, yet a coin that just entered it (Orbio, which launched end-to-end encrypted agent inference on Phala's confidential GPUs) isn't $100M — why pvp random bundled KOL coins on Robinhood Chain? He later notes subscribers made 'a ton' on ORBIO (#185).", "tweet_url": "https://x.com/zeroxkyle/status/2105486387281875408", "images": [], " , process as veto (fees, license steps, EPA reviews erode capital), worst-case models treated as fact (LNT radiation, sonic booms), and rules written for the last accident applied to the next design — seen in nuclear and financial services. 'Keep building.'", "tweet_url": "https://x.com/brian_armstrong/status/2105415751272190015", "images": [], "type": "thread"}, {"author": "andrewchen", "summary": "andrewchen: when the PC won it killed $20k+ workstations (SGI, NeXT, Sun) — yet now you add an RTX PRO 6000 or buy a Mac Studio and prices are rising. History may rhyme: inference could be built into PCs/mobile or a new architecture could make today's workstation moment a blip.", "tweet_url": "https://x.com/andrewchen/status/2105371378275045809", "images": [], "type": "thread"}, {"author": "BobEUnlimited", "summary": "BobEUnlimited: the biggest driver of a VC getting unicorn outcomes is the number of bets over a career; a recent paper tying success to investor attributes misses that those attributes just buy more bets rather than making the investor better.", "tweet_url": "https://x.com/BobEUnlimited/status/2105375931875348655", "images": [], "type": "tweet"}, {"author": "garrytan", "summary": "garrytan on Capy coding agents: unlike editors with top-down child-agent coordination, agent swarms speak to each other as peers and self-coordinate, letting you explore the space rather than pre-arrange it. 'Capy is special.'", "tweet_url": "https://x.com/garrytan/status/2105449821645480046", "images": [], "type": "thread"}, {"author": "cryptopunk7213", "summary": "cryptopunk7213: 'narrative violation' — three weeks ago Z.ai released an unrestricted version of GLM 5.3 with cyber-exploitation capability, yet Fortune 500 firms are using it to defend successfully; the only hacks seen came from frontier-lab models, he says.", "tweet_url": "https://x.com/cryptopunk7213/status/2105486030379868398", "images": [], "type": "tweet"}, {"author": "zeroxkyle", "summary": "zeroxkyle on a K-shaped crypto market: no alpha in longing tokens CT is shilling — best performers (BP, LIT, VVV) are ones CT isn't discussing. Catalyst trades like MON/WLD rely on incremental believers; allocators with large capital are instead buying tokens with growing users/revenue that are undervalued. 'Buy and hodl works — see HYPE — but few will do it.' (#183: Backpack is an asymmetric token at ATHs.)", "tweet_url": "https://x.com/zeroxkyle/status/2105521952769376708", "images": [], "type": "tweet"}, {"author": "Evan_ss6", "summary": "Evan_ss6 asks why people copy-trade accounts that shill hundreds or thousands of tokens a year, and says 'cashflow coins / crime barbell' has never been better (#23). Chart posts (#15, #31) are meme-heavy.", "tweet_url": "https://x.com/Evan_ss6/status/2105461672941138213", "images": [], "type": "thread"}, {"author": "Zeneca", "summary": "Zeneca's trading advice: get a job and keep your bankroll separate from living costs (a poker lesson — you can't fire a big bluff while worrying about rent). Most people lose trying to trade full time; most shouldn't day trade; use horizons of weeks to years; part-time trenching gets you eaten alive.", "tweet_url": "https://x.com/Zeneca/status/2105389482593886377", "images": [], "type": "thread"}, {"author": "zriboua", "summary": "zriboua: Trump is unlocking corridors that directly undercut China's Belt and Road Initiative (essay on her Substack). She also shares a Hudson Institute piece on how China uses Israel to indict Japan and the launch of its US National Security and Antisemitism series (#122, #123).", "tweet_url": "https://x.com/zriboua/status/2105442322561253465", "images": ["https://pbs.twimg.com/media/HTgIooQXEAAE9TK.jpg"], "type": "tweet"}, {"author": "qthomp", "summary": "qthomp shares a Prof G piece ('Oppenheimer Inc') arguing the administration's support of equity markets at all costs comes at the expense of lower/middle-income citizens, noting similar concerns from Keith McCullough and a growing set of prominent voices. In #129 he says Hedgeye's largest position since a recent long-opportunity write-up has been $BNO (oil).", "tweet_url": "https://x.com/qthomp/status/2105362696111808742", "images": [], "type": "tweet"}, {"author": "ASvanevik", "summary": "ASvanevik: working more hours has never had higher ROI — some will let AI 2x output while others aim for 100x on quality and speed (#97). Nansen also now offers ETH staking with in-house validators (7-year track record, zero slashing).", "tweet_url": "https://x.com/ASvanevik/status/2105461412474868113", "images": [], "type": "tweet"}, {"author": "RaoulGMI", "summary": "RaoulGMI: everyone fears AI will eat the world's electricity but the ending is wrong — the most powerful companies need more power than exists and there's only one way to build it fast enough (linked piece, subject not stated in tweet).", "tweet_url": "https://x.com/RaoulGMI/status/2105352585343271286", "images": [], "type": "tweet"}, {"author": "0xJeff", "summary": "0xJeff's weekly article on Onchain Robotics: hardware is dominated by big robotics firms, but the software 'brain' and coordination gaps remain open — covers key players, moats across DePIN/infra/financialization layers and the most asymmetric opportunities.", "tweet_url": "https://x.com/0xJeff/status/2105509184620122118", "images": ["https://pbs.twimg.com/media/HThFbN6agAA0rDO.jpg"], "type": "thread"}, {"author": "hooeem", "summary": "hooeem shares prompts to build a personalised 'agentic hedge fund' that learns from experience via a memory-enhanced trading agent (images attached).", "tweet_url": "https://x.com/hooeem/status/2105400547906146731", "images": ["https://pbs.twimg.com/media/HTfiol_XgAAtk67.jpg", "https://pbs.twimg.com/media/HTfiol7XcAAhIKV.jpg", "https://pbs.twimg.com/media/HTfiomAWYAE-1ue.jpg", "https://pbs.twimg.com/media/HTfiol_XQAAdvCX.jpg"], "type": "thread"}, {"author": "Crypto_McKenna", "summary": "Crypto_McKenna highlights an arXiv paper claiming potential first n campus in Miami could have been in New York under a pro-business tax policy; instead NY vilifies successful leaders. Also endorses (#85) a summary of Howard Hughes ($HHH) shareholder meeting: insurance — float, Buffett-style — may be the piece that changes everything.", "tweet_url": "https://x.com/BillAckman/status/2105394819744886899", "images": [], "type": "tweet"}, {"author": "nic_carter", "summary": "nic_carter: the long-term answer for education is that shoehorning every child into an academic/white-collar path is over — most lack the 'cultural aptitude'. He predicts most children will become illiterate with only kids of motivated couples retaining reading and reasoning ability (#144). On Tesla FSD (#146) he calls it 'full full self driving' though you still sit and watch.", "tweet_url": "https://x.com/nic_carter/status/2105386267932537272", "images": [], "type": "thread"}, {"author": "dylan522p", "summary": "dylan522p: 'Can't invest in Anthropic at $2 trillion because it could be a zero and I'm fucked, or $20 trillion — but at $20 trillion we are all fucked.' Also (#75) jokes about hearing 'we use Asians to build xyz' for 'agents', noting that's been the global economy for decades.", "tweet_url": "https://x.com/dylan522p/status/2105334504726692035", "images": [], "type": "tweet"}, {"author": "RayDalio", "summary": "Ray Dalio's principle of the day on employee-company reciprocity: the quid pro quo must be economically viable; set clear policies, shift them with measured (not excessive) precision, allow rare exceptions both ways, pay for above-normal work and dock below-normal, and let the give-and-take roughly even out over time.", "tweet_url": "https://x.com/RayDalio/status/2105384308345024527", "images": ["https://pbs.twimg.com/media/HTfT3gYWEAADCQU.png"], "type": "tweet"}, {"author": "Geiger_Capital", "summary": "Geiger_Capital touts his political-forecast record (2024 Trump 49/50 states, 2020 Biden 50/50, 2016 Trump 48/50) while calling some current polls // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
