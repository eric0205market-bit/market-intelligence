const ITEMS = [{"cat": "crypto", "urgency": "deep", "source": "Viktor / Crypto Narratives", "title": "BTC refused to break after Warsh hiked 25bps — $75k to $87k in five days", "idea": "Clarity Act failed to pass Sep 15 and BTC dumped to $75k. Next day the FOMC (Warsh) hiked 25bps, already priced, and BTC refused to go lower, printing higher lows, then broke the $76-82k range and hit $87k on Sep 21. Altcoins outperformed BTC all month: a risk-on tape, but Viktor notes no 'stupid things' in speculation yet.", "angle": "A hiking Fed plus a failed crypto bill and BTC still +16% off the low. That is a positioning story, not a macro one. Useful contrast with equities at ATH while the long end sells.", "tweetA": "Crypto's two worst catalysts of September landed 24 hours apart: Clarity Act dead, Fed hiking. BTC went $75k to $87k anyway. When bad news stops moving price, the sellers are already gone. $BTC", "tweetB": "A Fed that is hiking, 20-year-high rates, and altcoins outperforming BTC for a month. Either liquidity is coming from somewhere nobody is watching, or this is the setup right before the speculative excess shows up. $BTC $ETH", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://cryptonarratives.substack.com/p/september-2026-recap-narratives-best", "id": 1}, {"cat": "crypto", "urgency": "deep", "source": "Viktor / Crypto Narratives", "title": "SEC let tokenized US securities trade in Uniswap v4 pools — UNI doubled to ~$11", "idea": "Sep 17: SEC granted temporary conditional exemptive relief for tokenized US securities in permissioned AMM pools on Uniswap v4, UNI +35%. UNI doubled in September to almost $11 (+350% from 2026 low). ARB +140% ($1.1bn to $2.55bn FDV) because Robinhood chain is an Arbitrum chain and ARB earns revenue from its activity.", "angle": "Regulatory exemption turned into an AMM listing venue. Financial plumbing trade: whoever hosts tokenized equities collects the fees.", "tweetA": "The SEC just handed an AMM the right to list US equities and UNI is +350% off the low. Compare that with the NYSE's multiple on the same business line. $UNI $ARB $ICE", "tweetB": "ARB is a toll road on Robinhood's chain, and Robinhood is where retail already trades stocks. Nobody priced L2 revenue share as an equity-adjacent trade until September. $ARB $HOOD", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://cryptonarratives.substack.com/p/september-2026-recap-narratives-best", "id": 2}, {"cat": "crypto", "urgency": "deep", "source": "Viktor / Crypto Narratives", "title": "Memecoins paired with tokenized stocks: $AI/NVDA hit $380M, then $160M", "idea": "Robinhood chain launchpad Pons grew revenue for ~2 weeks straight; PONS went 25x in 2 weeks ($0.4 to ~$1). $AI (Artificial Inu, paired with tokenized NVDA) hit $380M mcap mid-September and closed the month at $160M. Solana copy-cat Stonkdotfun took $STONK from $20M to $350M; $ZCAT (paired with tokenized ZEC) went zero to $170M in 4 days. Pumpfun launched custom pairs Sep 9 and sold the news.", "angle": "Retail is now gambling on coin-plus-stock baskets. The pairing mechanism turns equity beta into reflexive meme leverage. Good gauge of froth.", "tweetA": "A memecoin paired with tokenized NVDA went to $380M and gave back 58% in two weeks. Retail just invented leveraged stock-picking with extra steps. $NVDA", "tweetB": "Pons +25x in two weeks, then daily revenue turned down and so did the coin. Launchpad tokens are the cleanest read on retail appetite: watch daily fees, not price.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://cryptonarratives.substack.com/p/september-2026-recap-narratives-best", "id": 3}, {"cat": "crypto", "urgency": "deep", "source": "Viktor / Crypto Narratives", "title": "ZEC to $1,700, NEAR $2 to $5.5: privacy is the SoV trade of this cycle", "idea": "ZEC went $500 to $800+ in August and reached $1,700 on Sep 26 with no dip in September. Viktor thinks it is becoming the go-to store of value 'in case something happens to BTC'. NEAR ran $2 to $5.5 (about $7bn) with almost no drawdown, backed by rising TVL on Near Intents; DASH +84% squeeze; ZAMA +140%.", "angle": "Privacy coins as hedge-against-BTC-failure is an unusual framing. It matches surveillance/CBDC worries and shows capital rotating inside crypto toward optionality.", "tweetA": "ZEC at $1,700 is a bet that BTC's transparency eventually becomes a bug. Strange that the same market hiking rates is paying a premium for financial privacy. $ZEC $BTC", "tweetB": "NEAR doubled-plus on TVL growth in an intents product while ZEC carried the whole privacy beta. When the beta coin has the better fundamentals chart than the leader, the leader is usually late. $NEAR $ZEC", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://cryptonarratives.substack.com/p/september-2026-recap-narratives-best", "id": 4}, {"cat": "crypto", "urgency": "deep", "source": "Viktor / Crypto Narratives", "title": "Sell-the-news pattern: QNT +430% on Clearing House pick, then the top", "idea": "Sep 24 The Clearing House picked Quant to power its On-Chain Money Initiative, a US network to clear and settle tokenized bank deposits: QNT +430% in 3 days, local top, $16M longs liquidated. Binance spot-listed HYPE the same day: only +3%, then -10%. CME announced BCH and UNI futures: BCH +35% in a day. Ondo launched BlackRock-designed portfolio tokens: +40% in 3 days.", "angle": "Institutional-plumbing headlines are being front-run by retail in minutes. Fast-money lesson: the news candle is the exit.", "tweetA": "Biggest US bank consortium picks a tokenized-deposit rail and the coin goes +430% in 72 hours. The settlement layer for banks will not be priced by day traders, only the headline will. $QNT", "tweetB": "Binance lists HYPE: +3%. CME lists BCH futures: +35%. The asset that was already everywhere gets nothing from the exchange that is everywhere. Listings only matter where access was scarce. $HYPE $BCH", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://cryptonarratives.substack.com/p/september-2026-recap-narratives-best", "id": 5}, {"cat": "crypto", "urgency": "watch", "source": "Viktor / Crypto Narratives", "title": "Scam-coin froth gauge: AKE $1bn to $16bn FDV, LSK 20x in 4 days", "idea": "$AKE pumped 45x from July bottom; $2bn to $6bn FDV in a day, then to $16bn+ two days later. $LSK 20x in 4 days with $36M longs liquidated. $BTW went from $500M in June to $14bn FDV with almost no mindshare. $BR +560%, $BULLA 8x. Viktor says 'a ton of squeezes without continuation' — lots of long and short opportunities.", "angle": "Vertical squeezes in low-float names with no mindshare is a late-cycle marker. Track liquidations as sentiment.", "tweetA": "$BTW: $500M to $14bn FDV, nobody can say what it does. $AKE: $16bn. Low float plus thin books makes a valuation, not an asset. Check who can actually sell.", "tweetB": "September squeeze list: ONE 8x, SAGA 6x, NIL 4x, PHA 4x. The alts are acting like it is 2021 while BTC just broke a 76-82k range. Rotation or last call? $BTC", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://cryptonarratives.substack.com/p/september-2026-recap-narratives-best", "id": 6}, {"cat": "crypto", "urgency": "watch", "source": "Viktor / Crypto Narratives", "title": "Laggard catch-up: SUI, AVAX, GRASS rebound on revenue, not narratives", "idea": "SUI was at its pre-August price in mid-September and then nearly 2x'd. AVAX +70% bottom to top (RWA tokenization, Helicon upgrade Sep 22, laggard catch-up). GRASS +170% in 2 weeks with no catalyst after sitting at a $0.3 support: 'market accepted the revenue numbers were true'. ZRO 2x in 2 weeks off sub-$1bn FDV. ENA 2x ($0.14 to ~$0.3), expanding to farm basis on equity perps on Binance.", "angle": "Rotation into names with real revenue where price had not followed. Revenue-to-token flow is the screen.", "tweetA": "GRASS +170% with zero news. The only change: the market decided the revenue was real. Tokens s with 30y near multi-decade highs.", "tweetA": "ADP weekly: ~100k a month. BLS September private: +46k. One of these is wrong, and the one that gets revised sets the next FOMC. $TLT $SPY", "tweetB": "If the real pace is 100k, the Fed's hiking cycle is not choking labor and the long end is right to sell. If it is 46k, the 'higher for longer' trade is mispriced. Pick the data source you trust.", "charts": {"count": 1, "hot": true, "desc": "ADP NER weekly pulse bars vs BLS private"}, "link": "https://www.dailychartbook.com/p/companies-are-switching-their-top-model-more-than-ever-58ba", "id": 9}, {"cat": "credit", "urgency": "deep", "source": "Daily Chartbook (DC Lite #698)", "title": "CCC spreads blowing out while 90% of high yield stays calm", "idea": "JC Parets: why should we freak out about CCC spreads blowing out when the other 90% of the junk bond market stays relatively calm? 'If this is the first domino, the rest of the market hasn't gotten the memo.' (@jc_paretsx)", "angle": "Bottom-quality dispersion usually leads. Pair with MacroEdge noting credit spreads starting to expand.", "tweetA": "CCC is the canary. Either it's idiosyncratic zombie cleanup or the first leg of a repricing. The difference is whether BB spreads move in the next 30 days. $HYG $JNK", "tweetB": "Spreads wide at the bottom, tight everywhere else, equities at ATH. That's what credit looks like right before the equity market is asked to explain itself.", "charts": {"count": 1, "hot": true, "desc": "CCC vs total HY spread chart"}, "link": "https://www.dailychartbook.com/p/companies-are-switching-their-top-model-more-than-ever-58ba", "id": 10}, {"cat": "gold", "urgency": "deep", "source": "Daily Chartbook (DC Lite #698)", "title": "Central banks bought 39t of gold in August, 170t YTD", "idea": "World Gold Council: reported net central bank buying totalled 39t in August, bringing YTD purchases to 170t. (Marissa Salim, WGC.)", "angle": "Steady but far below the 2022-24 pace of ~1,000t/yr. Official demand is still positive while real yields are at 20-year highs.", "tweetA": "Central banks: 170t YTD, about 21t a month. A fraction of the 2022-24 rate. Gold is holding with the biggest buyer slowing. Who's picking up the slack? $GLD", "tweetB": "Real yields at multi-year highs, central banks buying less, and gold still bid. If the only marginal buyer left is private money, the downside is not the same trade it was.", "charts": {"count": 1, "hot": false, "desc": "WGC monthly central bank gold purchases"}, "link": "https://www.dailychartbook.com/p/companies-are-switching-their-top-model-more-than-ever-58ba", "id": 11}, {"cat": "macro", "urgency": "deep", "source": "Daily Chartbook (DC Lite #698)", "title": "Fed model: three P/E versions give three different answers", "idea": "Jurrien Timmer (Fidelity): booming earnings aside, rising valuation pressure from rates. The chart shows three iterations of the Fed model; depending on forward, trailing or CAPE P/E, the market is either still fine or approaching the danger zone.", "angle": "Forward earnings (27% growth) keep it fine; CAPE and trailing say the opposite. The disagreement is the story.", "tweetA": "On forward EPS the equity risk premium is fine. On CAPE it's in the danger zone. The entire bull case is the denominator being forecast, not reported. $SPX", "tweetB": "With Q3 EPS growth penciled at 27% and the median stock at 9%, the Fed model works only if you believe two companies' guidance. $NVDA $MU", "charts": {"count": 1, "hot": true, "desc": "Fed Model three versions - forward, trailing, CAPE"}, "link": "https://www.dailychartbook.com/p/companies-are-switching-their-top-model-more-than-ever-58ba", "id": 12}, {"cat": "AI/infra", "urgency": "deep", "source": "Daily Chartbook (DC Lite #698)", "title": "Record 8% of companies switched top AI model in September", "idea": "The monthly share of firms switching providers reached a record 8% in September. @arakharazian: ARR is a dumb measure for AI spend, there is no ency": "deep", "source": "Dark Side of the Boom", "title": "AI infrastructure >50% of S&P EPS growth; Micron EPS +1,000%", "idea": "AI infra names drive more than half of Q3 S&P 500 EPS growth and the top ten contributors over two-thirds. Micron's year-on-year EPS growth is above 1,000%. Nvidia market cap is closing in on $6T and AMD talks of very strong demand for years. The AI buildout is increasingly debt-funded with enormous hyperscaler issuance, but they issue because they can, with capex 'remarkably insensitive to rates'.", "angle": "Capex insensitivity to rates is the key variable. That's why bonds and equities decoupled.", "tweetA": "Micron EPS +1,000% y/y. Memory used to be the textbook cyclical, and now it's carrying the index. Cyclicals look like growth stocks right at the peak of the cycle. $MU", "tweetB": "Hyperscalers issuing debt because they can, not because they have to. Fine, until the 30-year is at 6% and the same issuers are competing with the Treasury for the same buyers. $MSFT $GOOGL $AMZN $META", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/le-pen-pauses-europes-red-october", "id": 15}, {"cat": "geopolitics", "urgency": "act", "source": "Dark Side of the Boom", "title": "Le Pen's shadow budget compresses OAT/Bund and cools global duration", "idea": "Tuesday's relief: Marine Le Pen's shadow budget gave markets evidence that politics bends when the bond market pushes. French yields eased, OAT/Bund spread compressed sharply, Treasury yields backed away from multi-decade highs. 'Rate-hike expectations barely moved — a term-premium story, not a Fed story.' Election is still far away.", "angle": "The global long end was being driven by France, not the Fed. One session's pause doesn't fix the arithmetic.", "tweetA": "A shadow budget from the opposition party moved the US 30-year more than the last Fed hike did. The Fed isn't the marginal price setter on duration right now. $TLT $EUR", "tweetB": "French spreads tightened on the idea of fiscal discipline from a party that markets feared. Nothing has been solved. The OAT/Bund tell is that bond vigilantes only need one visible win to ease off, which is also why they'll be back.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/le-pen-pauses-europes-red-october", "id": 16}, {"cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom", "title": "'Correlation discovery': higher yields no longer hit the stocks carrying the index", "idea": "The historical yields-up-equities-down link is less dependable because index carriers (hyperscalers) have fortress balance sheets and rate-insensitive capex. 'The level of yields still matters; the velocity matters more.' A 30-year above 6% no longer belongs only in the tail-risk drawer. Equities can live with high yields if they stop sprinting.", "angle": "Rates-equity correlation regime shift: watch the long-end speed, not the level.", "tweetA": "The old playbook: yields up, duration down, growth stocks pay. New one: the biggest growth stocks are the ones who can afford the yield. Look at velocity, not level. $TLT $QQQ", "tweetB": "If 30-year hits 6% and the S&P doesn't care, that's not resilience. That's a market that has concentrated into the few companies that don't need to borrow.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/le-pen-pauses-europes-red-october", "id": 17}, {"cat": "macro", "urgency": "deep", "source": "WealthVest Macro", "title": "Nominal GDP north of 7%: maybe yields should be higher", "idea": "WealthVest lists six narratives for the bond selloff. #2: nominal GDP (real growth plus inflation) is running north of 7%, 'a fair case that yields should actually be higher', given growth well above potential. #3: the Great Moderation (mid-80s to pandemic) is over; commodity prices, globalization and labor supply no longer push inflation down, and these regimes historically last long.", "angle": "With nominal GDP at 7+, a 5% 10-year isn't restrictive. Compare to 4% in 2019.", "tweetA": "Nominal GDP above 7% while the Fed is hiking. Rates at 20-year highs may simply be normal for this growth rate. The bond market is only now repricing the 2% inflation world as the anomaly. $TLT", "tweetB": "Great Moderation: 1985-2020. Falling rates and inflation for 35 years. If this regime is as long, anyone's duration thesis is a 30-year thesis. Don't try to call the bottom.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://wealthvest.substack.com/p/pick-your-favorite-bond-beatdown", "id": 18}, {"cat": "energy", "urgency": "deep", "source": "WealthVest Macro", "title": "Oil shock as regime: cheap offensive military capability disrupting refined products", "idea": "Narrative #1: the recent oil move may be the start of an era of higher geopolitical risk with an inflection in refined-product supply disruptions because cheap, effective offensive military capability (drones/missiles) has proliferated.", "angle": "Refining assets are the soft target. Pairs with MacroEdge's diesel ATH.", "tweetA": "A cheap drone against an expensive refinery unit. Asymmetric cost curve = permanently higher risk premium on refined products, not on crude. $VLO $MPC", "tweetB": "Cheap offense vs expensive infrastructure is the same structure in Ukraine, Red Sea and the Gulf. Diesel at all-time highs says the market is slowly pricing it. $XLE", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://wealthvest.substack.com/p/pick-your-favorite-bond-beatdown", "id": 19}, {"cat": "macro", "urgency": "watch", "source": "WealthVest Macro", "title": "Yen carry unwinding and AI crowding out: two bond anchors removed", "idea": "Narrative #4: the Japanese anchor has been lifted: the yen carry liquidity fountain is off and Japanese savings are repatriating as JGB yields rise. #6: AI infra capex ($1T here, $1T there) is a real crowding-out issue and drives commodity/component demand, stoking inflation. #5: bond vigilantes may finally shame policymakers, but have more work to do in the US.", "angle": "The marginal Treasury buyer story: Japan repatriating + AI issuance competing for the same savings.", "tweetA": "Japan was the world's rate anchor for 30 years. Now the yen carry funding is going home. The Treasury is not competing with Bunds, it's competing with Japan's own bond market.", "tweetB": "A trillion of AI capex needs a trillion of savings. If those savings are also financing deficits and Japan's repatriation, the price that clears is the 30-year yield. $TLT", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://wealthvest.substack.com/p/pick-your-favorite-bond-beatdown", "id": 20}, {"cat": "macro", "urgency": "watch", "source": "MacroEdge Research / @SixFinance", "title": "Breadth worst since 2000, rates at 20-year highs, diesel at ATH: 40% of a macro book in long duration", "idea": "MacroEdge: S&P at ATH, heavily tech-concentrated, breadth worst since 2000; rates at 20-year highs; France bordering on sovereign crisis; employment weakening, credit spreads starting to expand; diesel at all-time highs. As yields rose, employment weakened and spreads widened, they added long-duration Treasuries to ~40% of the portfolio. (Note: promotional launch of a model portfolio, 1% fee.)", "angle": "A macro shop going 40% long duration into a bond rout is a contrarian marker. Fade-or-follow depends on the labor data (see ADP vs BLS).", "tweetA": "Breadth worst since 2000, diesel at all-time highs, credit spreads widening, and a macro book at 40% long bonds. That is not a diversified book, it's a recession call with a leash. $TLT", "tweetB": "You can have equities at ATH and a flight to duration in the same quarter if the equity index is two stocks. That's what this tape is. $SPY", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.macroedge.world/p/introducing
