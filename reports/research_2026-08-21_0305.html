{ id:13, cat:"positioning", urgency:"deep", source:"Young and Calculated",
  title: "A fund running 4x leverage got liquidated in July. Platforms running 11x lost about 2%.",
  idea: "Situational Awareness, a fund that returned 439% in H1 2026 and grew to roughly $45bn, was liquidated within three weeks in July after concentrated AI infrastructure positions reversed, losses hit 67% for the month, forcing a sale of its public book to Citadel. Over the same period, Millennium lost 2.1%, ExodusPoint lost 0.9% (still +3.5% YTD), Verition lost 1.1% (+4.5% YTD), Point72 lost 3.3%, and Citadel's Wellington fund gained 5.9%, partly by buying the forced seller's positions.",
  angle: "Gross leverage as a headline number is nearly meaningless without knowing whether it's concentrated-directional or diversified-market-neutral. A 4x concentrated book is more dangerous than an 11x diversified one, and this July episode is the cleanest real-world proof of that this cycle.",
  tweetA: "4x leverage killed a $45bn fund in three weeks. 11x leverage cost several multi-strat platforms about 2%. If you're still using gross leverage as your risk metric, July just proved you're measuring the wrong thing. Concentration, not multiple, is what kills funds.",
  tweetB: "Citadel's Wellington fund gained 5.9% the same month a concentrated AI fund got forced to sell its book to Citadel. Somebody's blowup is always somebody else's alpha. The liquidity to buy distressed AI infra positions in July came from exactly this kind of dispersion.",
  charts:{count:0, hot:false, desc:"No charts -- data table of July hedge fund returns cited in the piece."},
  link:"https://youngandcalculated.substack.com/p/what-leverage-actually-is-in-a-hedge" },

{ id:14, cat:"credit", urgency:"deep", source:"Young and Calculated",
  title: "Why '11x leverage' at a multi-strat platform is diversification math, not risk appetite",
  idea: "The piece works the volatility algebra: 40 market-neutral pods at 2% annualized vol each, with 0.05 average pairwise correlation, combine to just 0.54% portfolio volatility at 1x gross, far below the ~6% vol / Sharpe-2+ allocators demand. Reaching that target requires levering up roughly 11x, matching the 11.8x gross-assets-to-NAV figure multi-strat funds report on Form PF. Raise correlation from 0.05 to 0.30 with everything else held constant, and unlevered vol roughly doubles to 1.13%, pushing realized fund vol at the same 11x gross to about 12.5%, more than double the target.",
  angle: "The entire multi-strat business model is a bet that pod correlation stays near zero. The moment correlation creeps toward 0.3, exactly what happens when everything sells off together, the same 'safe' 11x leverage produces double the intended volatility. That's the actual mechanism behind why multi-strat blowups happen all at once during systemic stress.",
  tweetA: "Multi-strat funds run 11x gross leverage because the math requires it to hit target returns at near-zero pod correlation. Bump correlation from 0.05 to 0.30, which is just 'a bad week in markets', and the same leverage doubles realized volatility. The 11x isn't reckless. It's fragile to a single assumption.",
  tweetB: "Nobody worries about multi-strat leverage because it's diversified. But diversification is a correlation assumption, not a fact. The entire multi-strat industry is short correlation risk at 11x notional, and correlation goes to 1 exactly when you need it not to.",
  charts:{count:0, hot:false, desc:"No charts -- full volatility-math derivation in the piece, worth reading in full."},
  link:"https://youngandcalculated.substack.com/p/what-leverage-actually-is-in-a-hedge" },

{ id:18, cat:"macro", urgency:"act", source:"The Pressure Point (Fulcrum)",
  title: "Bessent found a bid for bonds. He didn't find the missing balance sheet.",
  idea: "Treasury's surprise doubling of long-end buybacks briefly rallied bonds, but yields fully round-tripped within a session, the 30-year hit 5.34% (highest since 2007) before the intervention and recovered most of the move after. The piece's core distinction: 'market-making is not yield targeting.' A Treasury buyback can smooth liquidity but can't change who ultimately holds the duration risk the way a Fed balance sheet can. Only the Fed can actually take duration out of public hands; Treasury can only rearrange where within the market it sits.",
  angle: "This reframes the entire Bessent-vs-Warsh dynamic: the market isn't testing whether Treasury can move yields for a day, it's testing whether Washington has quietly built a shadow yield-curve-control regime without admitting it, which is precisely the kind of ambiguity that eventually forces the Fed's hand either way.",
  tweetA: "Treasury announced it would 'make a market' in long bonds. Market-making and yield-targeting are not the same tool, but investors are pricing them as if they might become the same thing. That ambiguity, not the buyback size, is what actually needs resolving.",
  tweetB: "The 30-year hit its highest yield since 2007, got a one-day rally from a buyback, and gave it all back within 24 hours. A confidence operation works right up until the market asks who's actually taking the bonds home. Bessent doesn't have an answer to that. Only the Fed does.",

{ id:21, cat:"energy", urgency:"act", source:"Dark Side of the Boom (Asia Wakes Up)",
  title: "JPMorgan: Treasury risks losing credibility if buybacks aren't matched by real fiscal progress",
  idea: "JPMorgan's institutional critique of the Bessent buyback: leaning against the market's clearing yield without fixing the underlying debt/supply problem can eventually backfire through a higher term premium. The immediate trigger for Thursday's reversal was more mechanical: Trump's 'Economic D-Day' threat against Iran pushed Brent toward $95/bbl and WTI above $88/bbl (highest since July 24), forcing inflation risk straight back into the long end just as Treasury tried to calm it.",
  angle: "Two arms of the same government are fighting each other in real time: Treasury trying to suppress term premium while the White House runs a geopolitical strategy that mechanically raises the oil-driven inflation input the bond market has to price. The bond market doesn't care which department owns which policy, it prices the combined effect.",
  tweetA: "JPMorgan's warning is the sharp one: Treasury buybacks without fiscal progress can eventually backfire into HIGHER term premium, not lower. And on cue, Trump's Iran threat sent oil up and erased the entire buyback rally in one session. The government is fighting itself on yields in real time.",

{ id:22, cat:"macro", urgency:"deep", source:"Dark Side of the Boom (Asia Wakes Up)",
  title: "The post-pandemic 'echo boom' that's carried the consumer through four years of shocks is running low",
  idea: "The author's framework: pandemic-era fiscal transfers and excess savings created a consumer resilience echo that outlasted every recession call for four years, surviving the fastest tightening cycle in decades, a regional bank scare, and a housing affordability crisis. But excess savings are largely depleted, fiscal transfers are gone, revolving credit is more expensive, and households are now living off current income rather than accumulated cushion. Walmart's worst earnings reaction since 2022 lands right as oil is rising again, a shock the consumer has fewer buffers left to absorb.",
  angle: "This is the most underappreciated bear case in the market right now because it doesn't require a single bad print, it's a slow depletion story, and Walmart is the first crack in the windshield, not the whole story. Worth pairing with the robot productivity thesis above as two structural forces pulling in opposite directions on growth.",
  tweetA: "The consumer has out-survived four straight years of recession calls on pandemic-era savings and fiscal-transfer echoes. Those echoes are basically gone now. Walmart's worst earnings reaction since 2022 arriving exactly as oil turns higher again isn't a coincidence, it's the shock absorber running out right when the next pothole shows up.",
  tweetB: "Nobody should call a recession off one Walmart quarter. But the framing matters: this consumer doesn't have 2021's savings cushion, 2022's wage acceleration, or 2023's refi-locked mortgage rates working for it anymore. The next oil shock lands on a much thinner buffer than the last three did.",

{ id:23, cat:"macro", urgency:"deep", source:"Dark Side of the Boom (Asia Wakes Up)",
  title: "If Washington won't let Treasury yields rise to their clearing level, the adjustment migrates into the dollar",
  idea: "The author's FX thesis: foreign Treasury buyers are normally compensated for fiscal, inflation and duration risk through the bond yield itself. If Treasury increasingly leans against that adjustment via buybacks, the compensation foreign holders require doesn't vanish, it has to show up somewhere else, most likely a weaker dollar, since a cheaper currency restores some of the return foreign investors are no longer getting through yield.",
  angle: "This is a genuinely different mechanism than the standard 'twin deficits weaken the dollar' story. It's specifically about policy suppression of the adjustment channel forcing a substitution into FX, predicting dollar weakness that intensifies precisely as Treasury intervention intensifies, a policy-induced negative feedback loop rather than a slow structural drift.",
  tweetA: "New mechanism worth tracking: it's not that deficits weaken the dollar directly. It's that suppressing the yield foreign buyers need to be paid forces the compensation into the currency instead. Every additional buyback might be dollar-negative by design, not by accident.",
  tweetB: "Higher yields used to support the dollar. If Treasury keeps leaning against yields rising to their clearing level, that relationship inverts: the more successfully Bessent caps yields, the weaker the dollar has to get to keep foreign buyers whole. Success and failure start to look the same in FX.",
  charts:{count:0, hot:false, desc:"No charts -- FX mechanism piece."},
  link:"https://thedarksideoftheboom.substack.com/p/asia-wakes-up-to-the-bond-markets" },

function buildFilterBars(){
  const catCounts = {};
  ITEMS.forEach(i=>{ catCounts[i.cat] = (catCounts[i.cat]||0)+1; });
  const catbar = document.getElementById('catbar');
  let html = '<button class="pill active" data-cat="all" onclick="setCatFilter(\'all\')" style="border-color:#333;">All (' + ITEMS.length + ')</button>';
  Object.keys(CATS).forEach(c=>{
    if(!catCounts[c]) return;
    html += '<button class="pill" data-cat="' + c + '" onclick="setCatFilter(\'' + c + '\')" style="border-color:' + CATS[c] + ';color:' + CATS[c] + ';">' + c + ' (' + catCounts[c] + ')</button>';
  });
  catbar.innerHTML = html;

  const urgCounts = {act:0, deep:0, watch:0};
  ITEMS.forEach(i=>{ urgCounts[i.urgency]++; });
  const urgbar = document.getElementById('urgbar');
  let uhtml = '<button class="pill active" data-urg="all" onclick="setUrgFilter(\'all\')" style="border-color:#333;">All (' + ITEMS.length + ')</button>';
  uhtml += '<button class="pill" data-urg="act" onclick="setUrgFilter(\'act\')">🔴 Act Now (' + urgCounts.act + ')</button>';
  uhtml += '<button class="pill" data-urg="deep" onclick="setUrgFilter(\'deep\')">🔵 Deep (' + urgCounts.deep + ')</button>';
  uhtml += '<button class="pill" data-urg="watch" onclick="setUrgFilter(\'watch\')">🟡 Watch (' + urgCounts.watch + ')</button>';
  urgbar.innerHTML = uhtml;
}

let currentCat = 'all';
let currentUrg = 'all';
let currentSrc = null;

function setCatFilter(c){
  currentCat = c; currentSrc = null;
  document.querySelectorAll('#catbar .pill').forEach(b=>{
    const isActive = b.getAttribute('data-cat') === c;
    b.classList.toggle('active', isActive);
    if(isActive){
      b.style.background = (c==='all') ? '#333' : CATS[c];
      b.style.color = '#fff';
    } else {
      b.style.background = 'transparent';
      b.style.color = (b.getAttribute('data-cat')==='all') ? 'var(--text)' : CATS[b.getAttribute('data-cat')];
    }
  });
  renderCards();
}

function setUrgFilter(u){
  currentUrg = u; currentSrc = null;
  document.querySelectorAll('#urgbar .pill').forEach(b=>{
    const isActive = b.getAttribute('data-urg') === u;
    b.classList.toggle('active', isActive);
    b.style.background = isActive ? '#333' : 'transparent';
    b.style.color = isActive ? '#fff' : 'var(--text)';
  });
  renderCards();
}

function filterBySrc(name){
  currentSrc = name; currentCat = 'all'; currentUrg = 'all';
  document.querySelectorAll('#catbar .pill, #urgbar .pill').forEach(b=>{
    const isAll = b.getAttribute('data-cat')==='all' || b.getAttribute('data-urg')==='all';
    b.classList.toggle('active', isAll);
    b.style.background = isAll ? '#333' : 'transparent';
    b.style.color = isAll ? '#fff' : (b.getAttribute('data-cat') && b.getAttribute('data-cat')!=='all' ? CATS[b.getAttribute('data-cat')] : 'var(--text)');
  });
  renderCards();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderCards(){
  const cards = document.getElementById('cards');
  let html = '';
  ITEMS.forEach((item, idx)=>{
    const catMatch = currentCat === 'all' || item.cat === currentCat;
    const urgMatch = currentUrg === 'all' || item.urgency === currentUrg;
    const srcMatch = currentSrc === null || item.source.indexOf(currentSrc) !== -1;
    if(!catMatch || !urgMatch || !srcMatch) return;
    const openClass = currentSrc !== null ? ' open' : '';
    const u = URGENCY[item.urgency];
    const chartFlag = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');
    html += '<div class="card' + openClass + '" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">#' + item.id + '</span>';
    html += '<span class="urg">' + u.emoji + '</span>';
    html += '<span class="badge" style="background:' + CATS[item.cat] + ';">' + item.source + '</span>';
    html += '<span class="cattag">' + item.cat + '</span>';
    if(chartFlag) html += '<span class="chartflag">' + chartFlag + '</span>';
    html += '<span class="htitle">' + item.title + '</span>';
    html += '</div>';
    html += '<div class="card-body">';
    html += '<div class="block-label">The Idea</div><div class="idea">' + item.idea + '</div>';
    html += '<div class="block-label">My Angle</div><div class="angle" style="border-left:2px solid ' + CATS[item.cat] + ';background:' + CATS[item.cat] + '12;">' + item.angle + '</div>';
    html += '<div class="block-label">Tweets</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    html += '<div class="chartbox' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '🔥 ' : '📊 ') + item.charts.desc + '</div>';
    html += '<div class="linkrow"><a href="' + item.link + '" target="_blank">↗ Read full article</a></div>';
    html += '</div></div>';
  });
  if(html === ''){ html = '<p style="color:var(--text-dim);padding:24px 0;">No items match this filter.</p>'; }
  cards.innerHTML = html;
}

function toggleCard(id){
  const card = document.getElementById('card-' + id);
  card.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function buildReport(){
  document.getElementById('metaline').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails';
  let html = '<p><strong>Window:</strong> ' + META.windowStart + ' &rarr; ' + META.windowEnd + ' (hard 6-hour boundary). Emails outside this window were not processed.</p>';

  html += '<p><strong>Included sources</strong> (click a name to filter cards):</p><ul>';

    html += '<li><span class="srcname" onclick="filterBySrc(\'' + s.name.replace(/'/g, "\\'") + '\')">' + s.name + '</span> — ' + s.count + ' item' + (s.count>1?'s':'') + '</li>';

  html += '</ul>';

  });
  html += '</ul>';
  document.getElementById('reportbody').innerHTML = html;
}
