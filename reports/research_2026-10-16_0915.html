<script>
const ITEMS = [{"id": 1, "cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom / Goldman Prime (Vincent Lin)", "title": "Hedge funds erased ALL net AI buying since Jan 2025 in five sessions", "idea": "Goldman Prime: HFs net sold the Global AI basket five straight sessions (Oct 8-14), reversing every dollar of cumulative net buying since the start of 2025. The latest session was the second-heaviest AI selling of the past year. The flow line is back to where it started.", "angle": "A 21-month build unwound in 5 days is a liquidity event, not a thesis change. Compare to what price did over the same stretch.", "tweetA": "21 months of hedge fund AI buying, gone in 5 sessions. Flow line back to zero. Either the thesis broke on a Tuesday, or this is a liquidity event wearing a thesis costume. I know which one price action looks like.", "tweetB": "If you bought the AI basket in Jan 2025 and held, your cost basis is fine. The marginal buyer who got in after that is the one who just left. Worth asking who is left to sell.", "charts": {"count": 1, "hot": true, "desc": "Goldman Prime cumulative HF net flow into Global AI basket, round-tripped to the Jan 2025 starting level (per description; chart in article)"}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-just-dumped-the-ai-trade"}, {"id": 2, "cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom / Goldman Prime (Vincent Lin)", "title": "The washout is real, the positioning is not clean: AI net exposure still 83rd pct (3y), gross near 5y highs", "idea": "Despite the dump, AI net exposure remains in the 83rd percentile of the past 3 years, and prime-book gross leverage is near five-year extremes. Selling was overwhelmingly long liquidation, not new shorts; money rotated into Health Care and Consumer Staples.", "angle": "One-year view says flushed, three-year view says still crowded. Long-only liquidation with no shorting means no short-cover fuel yet.", "tweetA": "Everyone is calling this a flush. 83rd percentile of 3-year net exposure says it's a trim. Gross leverage still near 5-year highs. The pain trade may not be up yet.", "tweetB": "Look at what they bought with the proceeds: Health Care and Staples. That's not 'rotate to the next AI winner', that's hiding. Different regime from the usual tech wobble.", "charts": {"count": 1, "hot": false, "desc": "Percentile/gross-leverage positioning charts likely in Goldman note - charts inside, worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-just-dumped-the-ai-trade"}, {"id": 3, "cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom / Goldman Prime (Vincent Lin)", "title": "Dumped at the point where a squeeze becomes plausible? Sell-side turns constructive into weakness", "idea": "The author flags a growing sell-side chorus turning constructive into the weakness, and asks whether the trade got dumped exactly when positioning, sentiment and price become combustible enough for another squeeze. Because selling was long liquidation, a lot of directional risk has already been removed fast.", "angle": "Contrarian setup: long-only supply exhausted + sell-side upgrades. But sell-side upgrading after a drop is also how you get a lower high.", "tweetA": "Sell-side turns bullish AFTER a five-day dump. You can read that as capitulation or as the last bid before the next leg lower. Same data, opposite trade. Position size is the only honest answer.", "tweetB": "No new shorts means no short covering. A squeeze needs someone offside. Right now the people offside are the ones who already sold. That's the part I can't make work.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-just-dumped-the-ai-trade"}, {"id": 4, "cat": "credit", "urgency": "deep", "source": "Dark Side of the Boom / Goldman (Privorotsky) + Morgan Stanley", "title": "CoreWeave isn't just a borrower, it's the rent cheque behind ~$14.1B of high-yield data-center bonds", "idea": "CoreWeave is the tenant supporting a sizeable chunk of the HY data-center financing market: roughly $14.1B of bonds issued by landlords whose repayment depends on CoreWeave continuing to pay rent. Any deterioration in CoreWeave credit forces reassessment of the landlord debt. Goldman's Privorotsky and Morgan Stanley's AI financing work converge on this pressure point.", "angle": "Credit contagion path runs tenant -> landlord, not through banks. Bond holders in the 'real asset' wrapper may be holding single-name tenant risk.", "tweetA": "$14.1B of 'data center' HY bonds is really one credit: whoever pays the rent. If that's CoreWeave, you don't own real estate, you own CoreWeave with a longer maturity and worse disclosure.", "tweetB": "Landlord equity has a lease. Landlord bondholders have a lease on a tenant whose own funding is the open question. Where do those bonds trade versus CRWV unsecured? That spread is the cleanest read on the whole chain.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/coreweave-lifted-the-kimono-now-credit"}, {"id": 5, "cat": "credit", "urgency": "deep", "source": "Dark Side of the Boom / Goldman (Privorotsky) + Morgan Stanley", "title": "Market now prices tenant quality: CoreWeave vs Google/Amazon/Nvidia/Oracle-backed projects", "idea": "The market is already distinguishing sharply between projects backed by CoreWeave, Google, Amazon, Nvidia and Oracle. Tenant quality, construction timing and loan-to-cost are starting to matter more than the generic 'AI' label. The risk is crowding out and repricing, not an immediate default wave.", "angle": "The AI credit trade bifurcates: IG-tenant data centers become the new utility paper, neocloud-tenant becomes the new CCC. Read-across to the generic AI-themed funds.", "tweetA": "'AI data center' stopped being an asset class this month. It's now five different credits depending on who signs the lease. Google paper and CoreWeave paper should not trade on the same curve and soon won't.", "tweetB": "Crowding out is the underrated risk. One borrower's cost of capital goes up and every refinancing behind it gets pricier. Defaults aren't needed for the marginal project to die.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/coreweave-lifted-the-kimono-now-credit"}, {"id": 6, "cat": "venture", "urgency": "deep", "source": "Michael Parekh / AI Reset (AI-RTZ #1241)", "title": "Anthropic Q3 revenue $16.8B (+~50% QoQ), profitable and cash-flow positive, $1.70 revenue per $1 of compute", "idea": "At Wednesday's investor day Anthropic said Q3 revenue rose nearly 50% to $16.8B from $11.5B. Second straight adjusted profitable quarter, cash-flow positive, adjusted operating margin 11% excluding stock comp. Revenue per dollar of compute: $1.70. Meanwhile Alphabet turned FCF negative in Q2 on AI capex.", "angle": "Compare to the hyperscaler side: the model lab is FCF positive while the cloud parents burn. Annualized, $16.8B is about $67B.", "tweetA": "Anthropic: $16.8B quarter, cash-flow positive, $1.70 back for every $1 of compute. Alphabet, the money machine, went FCF negative the same period. The lab is out-earning the landlord's balance sheet.", "tweetB": "Q2 to Q3: $11.5B -> $16.8B. Q1 to Q2 was more than a doubling. Growth is decelerating from 100%+ to 46% per quarter and the IPO is priced like it isn't. That's the whole debate in one line.", "charts": {"count": 0, "hot": false, "desc": "Charts inside the linked article - worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-mega-data-center-sprint"}, {"id": 7, "cat": "venture", "urgency": "deep", "source": "Michael Parekh / AI Reset (AI-RTZ #1241)", "title": "The run-rate gap: $65B in July, SemiAnalysis says ~$74B now, summer talk was $100B+ by year-end", "idea": "Anthropic did not update its $65B annualized run rate from July. SemiAnalysis estimates ~$74B today, below the summer chatter of $100B+ by year-end. The Information calls the growth 'rapid but slowing'; Meta and Microsoft are cutting Claude spend and leaning on in-house tools. Run rate went from ~$9B at end-2025 to $65B+ by end-July.", "angle": "Whisper numbers vs delivered. If $100B was the buy-side anchor, $74B is a miss against it and IPO price discovery gets harder.", "tweetA": "Street talk: $100B+ run rate by year-end. SemiAnalysis: ~$74B today. Anthropic declined to update the $65B from July. When a company stops updating the number during the roadshow, read the silence.", "tweetB": "Customers shifting to in-house tools is the quiet risk. Microsoft and Meta aren't just negotiating, they're building. The biggest buyers are the ones with the most incentive to become competitors.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-mega-data-center-sprint"}, {"id": 8, "cat": "venture", "urgency": "deep", "source": "Michael Parekh / AI Reset (AI-RTZ #1241)", "title": "IPO math: $965B private in May, bankers float $2T, some investors say below $1.5T, 'two-horse race' with OpenAI", "idea": "Anthropic was valued at $965B privately in May and is expected to list next month before Thanksgiving. Some bankers have floated $2T; some potential investors think it should price below $1.5T. An analyst told the FT it is now a 'two-horse race' with a resurgent OpenAI.", "angle": "Spread between $1.5T and $2T is $500B, more than the entire market cap of most S&P names. Pricing risk sits with the first-day buyer.", "tweetA": "The range on Anthropic's IPO is $1.5T to $2T. The disagreement is bigger than Meta. That's not price discovery, that's two different companies depending on whether you believe 46% QoQ or 100%.", "tweetB": "At $16.8B a quarter, $67B annualized. $1.5T is ~22x run-rate sales, $2T is ~30x. For a company with 11% adjusted op margins. I'm not saying no. I'm saying size it like it can go either way on day two.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-mega-data-center-sprint"}, {"id": 9, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI Reset (AI-RTZ #1241)", "title": "15 GW of committed capacity: 1.4GW (2025) -> 5GW -> 9.5GW -> 15GW+ (2028); Azure was ~5GW at end-2023", "idea": "Anthropic has committed to rent/lease ~15GW from AWS, Google, SpaceXAI and over a dozen other providers. Measured AI projects 1.4GW in 2025, 5GW this year, 9.5GW in 2027, 15GW+ in 2028. Microsoft's entire Azure ran at ~5GW at end-2023. At $50B+/GW that's $750B+ of build-out, mostly on partners' and lenders' balance sheets.", "angle": "A single tenant is replicating the whole Azure footprint three times over by 2028, financed by other people's debt. Concentration shows up in every lender's book.", "tweetA": "Anthropic's contracted capacity by 2028 is three Azures (circa end-2023). $750B of buildout, and the tenant owns almost none of it. Somebody else's balance sheet is carrying the biggest compute bet in history.", "tweetB": "1.4GW to 15GW in three years is 10.7x. Power equipment lead times didn't get 10x shorter. The constraint isn't demand, it's transformers and turbines. Look at who sells those.", "charts": {"count": 1, "hot": true, "desc": "Measured AI projection of Anthropic capacity: 1.4GW (2025) to 5GW (2026), 9.5GW (2027), 15GW+ (2028)"}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-mega-data-center-sprint"}, {"id": 10, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI Reset (AI-RTZ #1241)", "title": "Louisiana math: 330MW draw -> 245MW compute; one month early = $1.3B revenue vs ~$200M lease => ~85% inference GM", "idea": "The Hut 8 campus outside Baton Rouge draws 330MW for 245MW of usable compute. Per analysts, a month earlier online yields $1.3B+ of extra revenue (if all inference) against ~$200M/month chip lease cost (Occam Edge), implying ~85% gross margin at the site. Compute starts Q2 2027, on Google TPUs via Fluidstack.", "angle": "Every month of delay is worth over a billion dollars to the tenant. That's why the lab pays for speed and why the developers have pricing power in construction.", "tweetA": "One month of 245MW coming online early is worth $1.3B in revenue to Anthropic against $200M of lease cost. That's why they're paying any price to a bitcoin miner for power and a roof.", "tweetB": "330MW in, 245MW usable: the 25% overhead is the part nobody models. PUE and cooling are now a margin line. Which is also why Vertiv's CEO says prefab halves install time.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-mega-data-center-sprint"}, {"id": 11, "cat": "crypto", "urgency": "deep", "source": "Michael Parekh / AI Reset (AI-RTZ #1241)", "title": "Bitcoin miners are Anthropic's 'fresh horses': Hut 8, TeraWulf, IREN, Riot ($9B), Nscale; Stream buys failed Plug hydrogen sites", "idea": "Former and current bitcoin miners picked up what big clouds missed: grid-connected power rights at old aluminum smelters, failed green-hydrogen sites, renewables-rich land. Riot signed a $9B compute deal in August; IREN has an unannounced multiyear deal; Anthropic is in talks for up to 1GW from Apollo-backed Stream Data Centers, which just bought two failed Plug Power hydrogen sites. Hut 8's legacy mining business has Donald Trump Jr. and Eric Trump as partners.", "angle": "Hash rate becomes a rounding error versus power rights. The miner trade is now a power-contract trade. Failed climate bets repurposed as AI real estate.", "tweetA": "Bitcoin miners spent years stranded with power contracts and nobody wanted them. Now they're the only ones who have what Anthropic needs. Failed hydrogen sites too. The most valuable asset in AI is a grid interconnect someone else gave up on.", "tweetB": "Miner optionality: $RIOT $IREN $WULF $HUT. The question is whether the BTC price still matters to their equity or whether it's now purely a $/MW-contracted story. I think the second one, and it changes how you should hedge them.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-mega-data-center-sprint"}, {"id": 12, "cat": "energy", "urgency": "deep", "source": "Michael Parekh / AI Reset (AI-RTZ #1241)", "title": "'Compute Heat Rate': AI inference can pay $5,631/MWh; frontier labs $12,791/MWh vs ~$50 wholesale", "idea": "Energy analyst Hans Royal's Compute Heat Rate: the electricity price an AI inference data center can pay and still earn a return. In Q3 it was $5,631/MWh for commercial AI (100x+ the typical $50 grid price) and $12,791/MWh for the most advanced labs like Anthropic. Proposed trade: get grid power sooner by agreeing to curtail a few peak hours a year.", "angle": "A buyer that will pay ~250x wholesale breaks every utility price signal. It also makes curtailment agreements the cheapest capacity on the grid.", "tweetA": "AI labs can pay $12,791 per MWh and still make money. The grid clears at $50. When one buyer's willingness to pay is 250x the market, the market doesn't clear, it rations. By queue position.", "tweetB": "Flip it: if data centers will switch off for a few peak hours a year to get connected sooner, that's the cheapest demand response ever built. Utilities should be thanking them. Voters hearing 'your bill went up' won't.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-mega-data-center-sprint"}, {"id": 13, "cat": "credit", "urgency": "deep", "source": "Michael Parekh / AI Reset (AI-RTZ #1241)", "title": "AI financing is getting pricier: all four HY data-center bond deals since July priced at a discount, Nvidia CDS ~doubled, Firmus pulled IPO", "idea": "All four high-yield data-center bond deals since July sold at a discount. Nvidia's CDS spreads have roughly doubled. Nvidia-backed Firmus Grid pulled what would have been Australia's biggest IPO in almost 30 years, citing volatility. Backdrop: Nvidia + Apollo/BlackRock/Blackstone/Brookfield/Goldman/KKR $500B+ financing package; Google backstopping ~$35B of Anthropic's leases; Nvidia backstopped Firmus loans for $15B+ of chips.", "angle": "Nvidia's CDS doubling while its equity is the market's anchor is the cleanest sign the funding chain is the weak link. Read together with the $14.1B CoreWeave-tenant bonds.", "tweetA": "4 for 4: every HY data-center bond since July priced at a discount. Nvidia CDS has doubled. The equity market is arguing about demand. Credit is already arguing about who funds it.", "tweetB": "Nvidia guaranteed loans for Firmus to buy $15B of Nvidia chips. Firmus then pulled its IPO. When the vendor is also the lender and the equity window shuts, I stop calling it demand and start calling it vendor financing.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-mega-data-center-sprint"}, {"id": 14, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI Reset (AI-RTZ #1241)", "title": "Neoclouds from niche to necessity: CoreWeave $2.58B quarter (+113%, $104B backlog), Nebius +454% to $582M", "idea": "CoreWeave had $25M annual revenue when it took its first big GPU-backed loan in 2023; it reported $2.58B in the June quarter alone (+113%) with a $104B backlog and 3.7GW contracted power. Nebius revenue grew 454% to $582M ($3B annual pace) and targets 5GW contracted by year-end. Both benefit from H100 rentals up 50%+ on 2022-vintage chips.", "angle": "Rising rental prices on 4-year-old H100s breaks the 'GPUs depreciate in 3 years' bear case, which matters for the debt secured on them.", "tweetA": "H100s from 2022 are renting for 50% MORE than before. Every depreciation schedule in the sector assumes the opposite. If that holds, collateral values are conservative. If it reverses, so does the credit.", "tweetB": "CoreWeave: $25M of revenue in 2023 to a $104B backlog. That's a 4,000x backlog-to-revenue run in under three years. Leverage on top of that backlog is the entire debate.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-mega-data-center-sprint"}, {"id": 15, "cat": "regulation", "urgency": "deep", "source": "Michael Parekh / AI Reset (AI-RTZ #1241)", "title": "Data centers as midterm football: West Feliciana Parish revenue to triple to $130M, state law lets locals cut property taxes 25%", "idea": "Hut 8's tax payments are expected to triple West Feliciana Parish's annual revenue to $130M, and a new Louisiana law lets local officials cut residents' property taxes by 25%. Parekh notes AI data centers are now a political issue in the midterms over rising utility bills; whether voters elsewhere will see tax relief as an offset is the open question.", "angle": "A template for the local politics of AI: share the gains via property tax. Watch which states copy it before the bill-shock narrative hardens.", "tweetA": "A Louisiana parish just made data centers a tax cut: revenue triples to $130M, residents get 25% off property taxes. If this is the template, AI buildout gets a local lobby. If it isn't, it gets a midterm villain.", "tweetB": "Utility bills are the transmission mechanism between the AI trade and the ballot box. One parish got a tax cut. Every other ratepayer got a rate case. Guess which one the campaign ads use.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-mega-data-center-sprint"}, {"id": 16, "cat": "tech", "urgency": "watch", "source": "Michael Parekh / AI Reset (AI-RTZ #1241)", "title": "Prefab data-center blocks halve install time (Vertiv): power, batteries, cooling, fire protection shipped as bundles", "idea": "Vertiv CEO Giordano Albertazzi says it now ships prefabricated bundles of power, batteries, cooling and fire protection, assembled offsite, cutting typical installation time in half. Parekh ties it to the economics that one month early is worth $1.3B+ on a single 245MW site.", "angle": "Construction technology is the cheapest way to buy time at this scale. Modularization shifts value from the GC to the equipment vendor.", "tweetA": "Half the install time on a site where one month is worth $1.3B. Prefab isn't a construction story, it's a time-value story. $VRT is selling weeks, priced in billions.", "tweetB": "The data center 'build' is turning into manufacturing. Same arc as shipbuilding and modular housing, except the customer is paying $1B+/month for speed. Margin accrues to whoever controls the factory line.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-anthropics-mega-data-center-sprint"}, {"id": 17, "cat": "macro", "urgency": "deep", "source": "McKinsey / The Weekend Read", "title": "Global AUM hit a record $151T in 2025, but a small group of firms captures a rising share of growth", "idea": "McKinsey's asset management piece: global AUM reached a record $151 trillion in 2025, yet a relatively small group of firms is capturing an increasing share of growth ('plenty for the few'). Authors examine what separates winners and how others can compete. Teaser only in email; full article has data.", "angle": "Concentration in asset management mirrors concentration in the index. Fee compression plus scale advantage favors the top handful.", "tweetA": "$151T of AUM, record high, and the growth is going to a handful of firms. Sound familiar? It's the same concentration story as the S&P, one layer up.", "tweetB": "If the winners are scaling through private markets and AI-enabled distribution, then the mid-tier manager has two choices: specialize hard or sell. Watch M&A in asset management this winter.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.mckinsey.com/industries/financial-services/our-insights/asset-management-2026-plenty-for-the-few"}, {"id": 18, "cat": "energy", "urgency": "watch", "source": "McKinsey / The Weekend Read", "title": "Metals & mining: record profits, stalled productivity; $450-750B annual productivity gain on the table", "idea": "McKinsey's Global Materials Perspective 2026 examines shifting trade patterns, changing demand and a potential $450B-$750B per year in productivity gains, under the framing 'record profits, stalled productivity in metals and mining'. Teaser only in email.", "angle": "Record profits with stalled productivity means margins are price-driven, not efficiency-driven. Fragile if commodity prices mean-revert.", "tweetA": "Mining is posting record profits with stalled productivity. That's a price story, not an operating story. $450-750B of efficiency sits unclaimed. If prices turn, the margin falls and nobody has a cost cushion.", "tweetB": "Critical minerals are the bottleneck for the data center buildout above. The producers are making record money doing nothing differently. Capex discipline or the next supercycle: those are the only two outcomes.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.mckinsey.com/industries/energy-and-materials/our-insights/global-materials-perspective"}, {"id": 19, "cat": "tech", "urgency": "watch", "source": "McKinsey / The Weekend Read", "title": "The AI value curve: companies measure AI adoption, not value; where automation pays off most cheaply", "idea": "McKinsey/QuantumBlack: many organizations are still measuring AI adoption rather than value. The 'AI value curve' is a framework to identify where AI's automation potential can be deployed most cost-effectively across existing work. Teaser only in email.", "angle": "Adoption metrics (seats, tokens) are the vanity metric of this cycle. Value-per-task curves are what the capex needs to be validated by.", "tweetA": "Corpora lan for multiple scenarios and monitor early signals", "idea": "McKinsey (Mischke, Watters, Singhal) examine six global shifts and how leading companies prepare: multiple scenarios, early-signal monitoring, response plans, framed by 'a policy decision in one country can disrupt operations a continent away'. Teaser only in email.", "angle": "Scenario planning is going mainstream in corporate strategy. A tell for how widely firms now assume policy shocks.", "tweetA": "Boards used to plan for a base case. McKinsey is telling them to plan for several worlds and watch early signals. That's the corporate version of owning convexity.", "tweetB": "If every large company is building a scenario playbook for trade and policy shocks, supply chain duplication becomes structural cost. That's an inflation floor nobody models.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.mckinsey.com/capabilities/geopolitics/our-insights/as-the-world-order-turns-leading-companies-are-keeping-pace-heres-how"}];

<script>
var COLORS={macro:"#e24b4a",credit:"#378add",positioning:"#ef9f27","AI/infra":"#1d9e75",crypto:"#7f77dd",geopolitics:"#d85a30",energy:"#f97316",tech:"#06b6d4",gold:"#d4a017",culture:"#ec4899",labor:"#8b5cf6",regulation:"#64748b",science:"#14b8a6",venture:"#84cc16"};
var UE={act:"🔴",deep:"🔵",watch:"🟡"};
var fc="all",fu="all",fs=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function toggle(id){var e=document.getElementById("c"+id);e.classList.toggle("open");}
function filterBySrc(name){fs=name;fc="all";fu="all";render(true);}
function setC(c){fc=c;fs=null;render(false);}
function setU(u){fu=u;fs=null;render(false);}
function pill(label,active,color,fn){var p=document.createElement("span");p.className="pill";p.textContent=label;if(active){p.style.background=color;p.style.borderColor=color;p.style.color="#fff";}p.onclick=fn;return p;}
function render(expand){
  var cats={};ITEMS.forEach(function(i){cats[i.cat]=(cats[i.cat]||0)+1;});
  var cb=document.getElementById("cats");cb.innerHTML="";
  cb.appendChild(pill("All "+ITEMS.length,fc==="all",""+"#333",function(){setC("all");}));
  Object.keys(cats).forEach(function(c){cb.appendChild(pill(c+" "+cats[c],fc===c,COLORS[c]||"#555",function(){setC(c);}));});
  var ub=document.getElementById("urgs");ub.innerHTML="";
  [["all","All"],["act","🔴 Act Now"],["deep","🔵 Deep"],["watch","🟡 Watch"]].forEach(function(u){
    var n=u[0]==="all"?ITEMS.length:ITEMS.filter(function(i){return i.urgency===u[0];}).length;
    ub.appendChild(pill(u[1]+" "+n,fu===u[0],"#333",function(){setU(u[0]);}));});
  var h="";
  ITEMS.forEach(function(item){
    if(fc!=="all"&&item.cat!==fc)return;
    if(fu!=="all"&&item.urgency!==fu)return;
    if(fs&&item.source.indexOf(fs)<0)return;
    var col=COLORS[item.cat]||"#555";
    var ci=item.charts.count>0?(item.charts.hot?" 🔥":" 📊"):"";
    h+='<div class="card'+(expand?' open':'')+'" id="c'+item.id+'"><div class="hd" onclick="toggle('+item.id+')"><span class="num">#'+item.id+'</span><span>'+UE[item.urgency]+'</span><span class="src" style="background:'+col+'">'+esc(item.source)+'</span><span class="tag">'+esc(item.cat)+'</span><span>'+ci+'</span><span class="ttl">'+esc(item.title)+'</span></div>';
    h+='<div class="body"><div class="lbl">The Idea</div><div>'+esc(item.idea)+'</div>';
    h+='<div class="lbl">My Angle</div><div class="angle" style="border-left-color:'+col+';background:'+col+'14">'+esc(item.angle)+'</div>';
    h+='<div class="tw"><div><div class="lbl" style="color:#378add">TWEET A</div>'+esc(item.tweetA)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    h+='<div><div class="lbl" style="color:#7f77dd">TWEET B</div>'+esc(item.tweetB)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>';
    h+='<div class="lbl">Charts</div><div class="chart'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING - ':'')+item.charts.count+' chart(s). '+esc(item.charts.desc||"None in email")+'</div>';
    h+='<div style="margin-top:8px"><a href="'+esc(item.link)+'" target="_blank">↗ Read full article</a></div></div></div>';
  });
  document.getElementById("list").innerHTML=h||"<p>No items.</p>";
}
function init(){
  document.getElementById("sub").textContent=META.date+" · "+META.time+" · "+ITEMS.length+" items";
  var r='<p><b>Window:</b> '+esc(META.windowStart)+' to '+esc(META.windowEnd)+'. Emails outside this window were not processed.</p>';
  r+='<p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</p><p><b>Included sources</b> (click to filter):</p><ul>';
  META.includedSources.forEach(function(s,i){r+='<li><span class="sl" data-i="'+i+'">'+esc(s)+'</span></li>';});
  r+='</ul><p><b>Skipped:</b></p><ul>';
  META.skippedSources.forEach(function(s){r+='<li>'+esc(s)+'</li>';});
  r+='</ul>';
  var rb=document.getElementById("repb");rb.innerHTML=r;
  rb.addEventListener("click",function(e){var i=e.target.getAttribute("data-i");if(i!==null){var s=META.includedSources[+i];filterBySrc(s.replace(/ \(\d+\)$/,""));}});
  document.getElementById("reph").onclick=function(){rb.style.display=rb.style.display==="block"?"none":"block";};
  render(false);
}
init();
