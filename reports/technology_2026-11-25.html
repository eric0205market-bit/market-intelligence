iction": "high", "so_what": "CI and artifact-delivery infrastructure scale super-linearly with agent adoption.", "quote": null, "locator": "Pando now powers all development", "quote_verified": false}, {"claim": "OpenAI reports Pando cut median push latency by nearly 80% by coordinating branch updates independently and reusing stored packfiles across fetches; it went into production in April 2026.", "speaker": "Eran Stiller", "type": "data_point", "entities": ["OpenAI", "Pando"], "conviction": "high", "so_what": "Legacy Git hosting architectures may be inadequate for agent-scale repos — pressure on GitHub/GitLab-style backends.", "quote": null, "locator": "OpenAI has detailed Pando", "quote_verified": false}]}, {"theme": "Pando design trade-offs", "insights": [{"claim": "Pando provides causal consistency with serialisable per-reference updates and read-your-own-write consistency, but no repository-wide snapshot across branches, removing a shared coordination point for unrelated pushes.", "speaker": "Eran Stiller", "type": "framework", "entities": ["Pando", "Git"], "conviction": "high", "so_what": "Relaxing global consistency is the key lever for scaling agent-era infra — a reusable architectural pattern.", "quote": null, "locator": "OpenAI refers to this as causal consistency", "quote_verified": false}, {"claim": "Pando validates pushed packfiles while streaming them to immutable blob storage without unpacking, and advertises only a trunk branch as base so packs can be reused, trading extra bandwidth for reusability.", "speaker": "Eran Stiller", "type": "framework", "entities": ["Pando", "Git", "blob storage"], "conviction": "medium", "so_what": "Shifts cost from compute to storage/bandwidth — favourable for object-storage consumption.", "quote": null, "locator": "Rather than replace Git's client and protocol", "quote_verified": false}, {"claim": "Pando uses Git's packfile-uri capability to return download links served by Express, a regional pack-delivery cache with cache-hit rates above 99% and tests saturating 10 Gbps links.", "speaker": "Eran Stiller", "type": "data_point", "entities": ["Pando", "Express", "Git"], "conviction": "medium", "so_what": "Caching/CDN-style delivery becomes central to source control at agent scale.", "quote": null, "locator": "For fetches, Pando maps", "quote_verified": false}, {"claim": "Pando's background compaction groups packs into geometrically sized covers, resembling log-structured merge-tree compaction, which improves compression and serves as a skip-list-like index for fetch planning.", "speaker": "Eran Stiller", "type": "framework", "entities": ["Pando", "LSM tree"], "conviction": "medium", "so_what": "Database storage techniques are migrating into source-control infrastructure.", "quote": null, "locator": "Background compaction groups packs", "quote_verified": false}]}, {"theme": "Pando vs Anthropic Scion", "insights": [{"claim": "Anthropic's Scion takes the opposite approach to OpenAI's Pando: it replaces Git's model with changesets and server-side commits, merges and rebases, assumes an online client, and uses sparse or virtualised checkouts, whereas Pando preserves Git's object model and client workflows.", "speaker": "Eran Stiller", "type": "framework", "entities": ["Anthropic", "Scion", "OpenAI", "Pando", "Git"], "conviction": "high", "so_what": "Frontier labs are diverging on whether to keep Git — watch which model incumbents like GitHub adopt.", "quote": null, "locator": "The design contrasts with Anthropic's Scion", "quote_verified": false}, {"claim": "OpenAI's Pando and Anthropic's Scion results are not directly comparable: OpenAI reports push latency, while Anthropic reports checkout speedups and infrastructure reductions versus its prior Git setup.", "speaker": "Eran Stiller", "type": "data_point", "entities": ["OpenAI", "Anthropic", "Pando", "Scion"], "conviction": "medium", "so_what": "Avoid headline comparisons between the two systems' performance claims.", "quote": null, "locator": "Both systems make use of immutable data", "quote_verified": false}, {"claim": "Despite Git compatibility, OpenAI had to deploy Pando as a read/write-through proxy, migrate clients in phases, move hundreds of integrations, and ship its own Git build supporting parallel pack download and indexing.", "speaker": "Eran Stiller", "type": "anecdote", "entities": ["OpenAI", "Pando", "Git"], "conviction": "medium", "so_what": "Source-control migrations remain costly even when protocol-compatible — sticky incumbency for Git hosts.", "quote": null, "locator": "Git compatibility did not eliminate migration work", "quote_verified": false}, {"claim": "Architects face two separate decisions: which source-control operations belong on the server, and which consistency and transfer guarantees their workloads actually need.", "speaker": "Eran Stiller", "type": "framework", "entities": ["Git"], "conviction": "medium", "so_what": "A useful lens for evaluating next-gen dev-infra vendors.", "quote": null, "locator": "For the architects, it's a case", "quote_verified": false}]}], "insight_total": 11, "top_entities": ["OpenAI", "Pando", "Codex", "Git", "Anthropic", "Scion", "Express", "packfile"], "source_meta": {"author": "Eran Stiller", "word_count": 1321, "paywalled": false}}, {"record_id": "83a2a28eac27b230", "source_type": "technology", "source_name": "InfoQ", "source_url": "https://www.infoq.com/presentations/enterprise-ai-inference-architecture-costs", "title": "Inferencing for Enterprises", "published_date": "2026-11-24", "language": "en", "processed_at": "2026-11-25T11:07:17Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech", "Geopolitics"], "gist": "JPMorganChase AI-infrastructure product lead Dio Rettori argues enterprise inference is six problems at once — hard, expensive, ever-changing, and a data-sovereignty, dependency and regulatory problem — citing ~$16–20M three-year TCO for 64 B200s (on-prem ≈ AWS reserved), 41% vs 5.2% latency variance cloud vs self-controlled, and a case that RAG has a ceiling so business ontology should be baked into models via RL/fine-tuning. Views are personal, not JPMorgan's.", "themes": [{"theme": "Inference is distinct systems engineering", "insights": [{"claim": "Dio Rettori argues inference is deep systems engineering distinct from training: training resembles HPC (priority queues, topology-aware GPU clusters), while inference is real-time, latency-sensitive, stateful and bursty, and the skill sets do not necessarily overlap.", "speaker": "Dio Rettori", "type": "framework", "entities": ["inference", "training", "HPC"], "conviction": "high", "so_what": "Inference-serving talent and tooling are a separate market from training infra.", "quote": null, "locator": "Training vs. Inference", "quote_verified": false}, {"claim": "The industry is specialising hardware for inference, with NVIDIA partnering with an inference-focused chipset company (Grok, per the speaker) and Cerebras pursuing very large silicon dies surrounded by more memory, at the cost of larger blast radius when a die fails.", "speaker": "Dio Rettori", "type": "data_point", "entities": ["NVIDIA", "Grok", "Cerebras"], "conviction": "medium", "so_what": "Inference-specific silicon is a growing segment; watch NVIDIA's inference partnerships and wafer-scale players.", "quote": null, "locator": "Now the industry is going in a specialization route", "quote_verified": false}, {"claim": "Tokenization in an LLM inference call runs on the CPU, not the GPU, so inference needs both, and any point where the GPU starves for data wastes money.", "speaker": "Dio Rettori", "type": "causal", "entities": ["CPU", "GPU", "inference"], "conviction": "medium", "so_what": "CPU demand rides alongside GPU demand in inference fleets.", "quote": null, "locator": "Inside an inferencing call", "quote_verified": false}, {"claim": "KV cache grows with context length and spilling to CPU memory during inference severely slows processing, making memory-saving techniques like quantization (e.g., the TurboQuant paper) critical, though lossless results are hard to guarantee.", "speaker": "Dio Rettori", "type": "causal", "entities": ["KV cache", "TurboQuant", "quantization"], "conviction": "medium", "so_what": "HBM capacity and memory-efficiency techniques are binding constraints on inference economics.", "quote": null, "locator": "Inference is a Hard Technical Problem", "quote_verified": false}, {"claim": "Agents multiply inference load, making batching and scheduling — matching synchronous versus overnight batchable work to infrastructure — a core utilization lever.", "speaker": "Dio Rettori", "type": "causal", "entities": ["AI agents", "batching"], "conviction": "medium", "so_what": "Agentic adoption is a multiplier on inference compute demand.", "quote": "Agents make this all go crazy because it's just multiplying everything.", "locator": "Within inferencing, it's just called batching", "quote_verified": true}]}, {"theme": "GPU cost, utilization and failure", "insights": [{"claim": "A Cast AI report cited by Rettori found only 5% GPU utilization across the systems it studied, along with CPU over-provisioning.", "speaker": "Dio Rettori", "type": "data_point", "entities": ["Cast AI", "GPU"], "conviction": "medium", "so_what": "Massive GPU underutilization implies efficiency tooling upside — and a risk that some GPU demand is wasteful.", "quote": null, "locator": "Inference is an Expensive Problem", "quote_verified": false}, {"claim": "GPUs fail far more often than other hardware — a vendor told Rettori around 10% failure, and companies are reportedly comfortable at ~5% — due to sensitivity to temperature and radiation, including solar flares, so fleets must be over-bought.", "speaker": "Dio Rettori", "type": "data_point", "entities": ["GPU", "UIUC", "IBM"], "conviction": "medium", "so_what": "GPU failure rates inflate effective unit demand and spare-parts needs, supportive of GPU volume.", "quote": null, "locator": "Again, cost is real", "quote_verified": false}, {"claim": "Rettori estimates a three-year total cost of ownership of $16–20 million for a 64-GPU NVIDIA B200 system, including hardware, software licenses, spares, services, power and cooling, but excluding inference software, operating team and model licensing.", "speaker": "Dio Rettori", "type": "data_point", "entities": ["NVIDIA", "B200"], "conviction": "medium", "so_what": "Benchmark for enterprise on-prem AI capex: ~$250–300K per B200 over three years all-in.", "quote": null, "locator": "A quick game for us here", "quote_verified": false}, {"claim": "Renting 64 B200s on AWS P6-B200 capacity blocks with a three-year reservation costs roughly the same as owning them on-prem, but owned GPUs that outlast three years and are amortized become a win thereafter.", "speaker": "Dio Rettori", "type": "data_point", "entities": ["AWS", "P6-B200", "NVIDIA B200"], "conviction": "medium", "so_what": "Cloud vs on-prem GPU price parity at 3-year commitments; GPU useful life beyond 3 years is a key variable for both enterprises and hyperscaler depreciation debates.", "quote": null, "locator": "Capacity blocks already assume", "quote_verified": false}, {"claim": "Rettori argues sound enterprises should use on-prem, cloud and pay-per-token APIs together, because single-vendor dependence for inference is not a sound business practice.", "speaker": "Dio Rettori", "type": "thesis", "entities": ["AWS", "foundation model providers"], "conviction": "high", "so_what": "Enterprise AI spend will be multi-sourced, limiting any one provider's lock-in.", "quote": "It's not a sound business practice to have single vendors for mostly anything.", "locator": "Then there is a big differentiator", "quote_verified": true}]}, {"theme": "Sovereignty, dependency, regulation", "insights": [{"claim": "Every inference call to an external API is a data transfer decision; contractual no-training clauses do not stop data leaving the enterprise perimeter, so global firms need control of where inference runs.", "speaker": "Dio Rettori", "type": "thesis", "entities": ["data sovereignty", "inference APIs"], "conviction": "high", "so_what": "Data-residency demands favour self-hosted/regional inference and sovereign-AI offerings.", "quote": "Every inference call to an external API is a data transfer decision, whether or not you treat it as one.", "locator": "Inference is a Data Sovereignty Problem", "quote_verified": true}, {"claim": "Most enterprises depend on a small set of foundation model providers, concentrating pricing, capacity and capability risk they cannot control, such as unannounced behaviour changes between model versions.", "speaker": "Dio Rettori", "type": "thesis", "entities": ["foundation model providers", "Opus"], "conviction": "high", "so_what": "Concentration risk is a driver for open-weight model adoption and multi-provider routing.", "quote": null, "locator": "Inference is a Dependency Problem", "quote_verified": false}, {"claim": "Inference is becoming a regulatory problem: the EU AI Act requires logging and proof of how decisions were made, and US states including Colorado, New York and California are following similar patterns, so global firms will comply with the most restrictive regime.", "speaker": "Dio Rettori", "type": "prediction", "entities": ["EU AI Act", "Colorado", "New York", "California"], "conviction": "medium", "so_what": "AI governance, logging and audit tooling has regulatory demand tailwinds even without US federal rules.", "quote": null, "locator": "Inference is a Regulatory Problem", "quote_verified": false}, {"claim": "Every SaaS vendor an enterprise contracts uses many further third parties, so without strong vendor oversight a company loses control of where its data goes.", "speaker": "Dio Rettori", "type": "causal", "entities": ["SaaS"], "conviction": "medium", "so_what": "Third-party risk management is a gating factor for enterprise AI SaaS sales.", "quote": null, "locator": "There you have customer assets information", "quote_verified": false}]}, {"theme": "Latency determinism for agents", "insights": [{"claim": "Rettori believes most agentic workloads will be system-to-system rather than human-replacing, and these are far more sensitive to latency variance — e.g., a payment workflow cannot take an unpredictable 1 to 35 seconds.", "speaker": "Dio Rettori", "type": "prediction", "entities": ["AI agents", "payments"], "conviction": "medium", "so_what": "Transactional agent use cases will demand latency SLAs, a premium product for inference providers.", "quote": null, "locator": "A lot of the workloads that we see", "quote_verified": false}, {"claim": "In Rettori's demo of a six-agent sequential workflow, latency variation was 41% via a cloud API versus 5.2% running on his own controlled hardware, though he admits tuning the local run.", "speaker": "Dio Rettori", "type": "data_point", "entities": ["OpenAI", "Gemma 4", "RTX 5080"], "conviction": "medium", "so_what": "Controlled infrastructure buys determinism; providers selling deterministic response times at a premium have a market.", "quote": "The variation for when doing the call on cloud was 41%. The variation when running on-prem was 5.2%.", "locator": "Determinism is hard", "quote_verified": true}, {"claim": "Most inference providers sell more deterministic response times at extra cost, so control of latency can be obtained contractually, not only by owning hardware.", "speaker": "Dio Rettori", "type": "data_point", "entities": ["inference providers"], "conviction": "medium", "so_what": "Latency guarantees are a monetizable tier for inference API vendors.", "quote": null, "locator": "I hacked it a little bit", "quote_verified": false}]}, {"theme": "RAG ceiling and ontology in models", "insights": [{"claim": "Rettori contends RAG is statistical rather than truly semantic search and, citing a Google paper, has a mathematical ceiling: beyond ~50,000 similar documents, fixed-size embedding vectors cannot represent the differences.", "speaker": "Dio Rettori", "type": "contrarian", "entities": ["RAG", "Google", "embeddings"], "conviction": "medium", "so_what": "Limits of vector retrieval challenge the RAG/vector-DB growth narrative for large similar corpora.", "quote": "RAG doesn't fix the problem.", "locator": "I can just never-ending forever RAG", "quote_verified": true}, {"claim": "Rettori predicts reinforcement learning pipelines will explode as enterprises try to bake business and process ontology directly into the models they control, reducing agent calls, RAG and processing time.", "speaker": "Dio Rettori", "type": "prediction", "entities": ["reinforcement learning", "fine-tuning"], "conviction": "exploratory", "so_what": "Demand shift toward fine-tuning/RL infrastructure and open, trainable models.", "quote": null, "locator": "Retrieval does not understand a lot", "quote_verified": false}, {"claim": "Enterprises cannot fine-tune a model they do not control, so Rettori recommends investing in trainable (open) models and self-hosting with real understanding and ownership of the stack.", "speaker": "Dio Rettori", "type": "thesis", "entities": ["open-weight models", "self-hosting"], "conviction": "medium", "so_what": "Supports open-weight model ecosystems and enterprise GPU ownership.", "quote": null, "locator": "Retrieval does not understand a lot", "quote_verified": false}, {"claim": "Agents lack the codes of conduct and self-preservation incentives that make humans apply guardrails, so every human policy must be codified for agents; Rettori suggests counting agentic-governance job postings as an adoption gauge.", "speaker": "Dio Rettori", "type": "framework", "entities": ["AI agents", "agentic governance"], "conviction": "medium", "so_what": "Agentic governance roles and tooling are an emerging category to watch.", "quote": null, "locator": "I think it's starting", "quote_verified": false}]}], "insight_total": 21, "top_entities": ["JPMorganChase", "Dio Re igation is already complete, making community detection unnecessary.", "speaker": "Ritesh Modi", "type": "contrarian", "entities": ["GraphRAG"], "conviction": "low", "so_what": "GraphRAG is not a default; fit depends on whether graph discovery is already done upstream.", "quote": null, "locator": "Since the investigation of the network is already done", "quote_verified": false}]}, {"theme": "Evals as the quality backbone", "insights": [{"claim": "An LLM judge is itself non-deterministic, so its version should be frozen and paired with a deterministic fact-checker for names, dates and amounts.", "speaker": "Ritesh Modi", "type": "framework", "entities": ["LLM judge"], "conviction": "high", "so_what": "Evaluation tooling combining LLM judges with deterministic checks is a growing need.", "quote": null, "locator": "Key Takeaways", "quote_verified": false}, {"claim": "Evals act as the test suite for LLM systems — used during development, requirement changes, model updates, ongoing sampling of production spans for drift, and as a gate on every release.", "speaker": "Ritesh Modi", "type": "framework", "entities": ["evals"], "conviction": "high", "so_what": "Eval platforms become mandatory infrastructure for production AI.", "quote": null, "locator": "Evals are like tests", "quote_verified": false}, {"claim": "Because models and prompts change, all evals must be re-run against a golden dataset of edge cases before any model upgrade or prompt/config change, with the golden set augmented from human feedback in production.", "speaker": "Ritesh Modi", "type": "framework", "entities": ["golden dataset", "evals"], "conviction": "medium", "so_what": "Model upgrades carry regression risk; vendor model churn has a real testing cost for enterprises.", "quote": null, "locator": "Regression Evals with Golden Data Set", "quote_verified": false}, {"claim": "Observability for probabilistic systems must trace the decision trajectory across the LLM itself, RAG retrieval quality and system eginning of 2025, showing the off-grid strategy went from rarity to common in under two years.", "speaker": "Casey Crownhart", "type": "data_point", "entities": ["data centers", "natural gas", "behind-the-meter power"], "conviction": "high", "so_what": "Rapid trend adoption; watch whether announcements convert to construction.", "quote": null, "locator": "The vast majority of these announcements", "quote_verified": false}, {"claim": "Only a small fraction of announced data-center gas capacity is real so far: 4.9 GW of behind-the-meter gas projects tied to data centers are operating and 15.8 GW are under construction, versus 115+ GW announced, per Cleanview.", "speaker": "Casey Crownhart", "type": "data_point", "entities": ["Cleanview", "data centers", "natural gas"], "conviction": "high", "so_what": "Large announced-to-built gap means headline pipeline numbers overstate near-term gas/turbine demand; track conversion rate.", "quote": null, "locator": "Today, just 4.9 gigawatts of behind-the-meter", "quote_verified": false}, {"claim": "BloombergNEF tracks 181 GW of announced on-site natural gas projects at data centers globally, with 90% of that capacity designated for the US.", "speaker": "Casey Crownhart", "type": "data_point", "entities": ["BloombergNEF", "data centers", "natural gas", "US"], "conviction": "high", "so_what": "The on-site gas phenomenon is overwhelmingly a US story, concentrating exposure in US gas and power equipment markets.", "quote": null, "locator": "BloombergNEF is also tracking on-site natural gas", "quote_verified": false}, {"claim": "xAI's Memphis campus has used dozens of natural gas turbines, some without permits, since 2024, and remains subject to ongoing legal battles, illustrating regulatory risk in the off-grid gas approach.", "speaker": "Casey Crownhart", "type": "anecdote", "entities": ["xAI", "Memphis", "natural gas turbines"], "conviction": "high", "so_what": "Permitting and litigation are a live risk for behind-the-meter AI power strategies.", "quote": null, "locator": "xAI’s Memphis campus has famously used", "quote_verified": false}]}, {"theme": "Speed premium over grid interconnection", "insights": [{"claim": "Grid interconnection queues for large loads like data centers can last as long as a decade, so AI developers are paying a significant premium to build their own on-site gas plants and get online faster.", "speaker": "Casey Crownhart", "type": "causal", "entities": ["data centers", "grid interconnection", "AI"], "conviction": "high", "so_what": "Time-to-power is the binding constraint for AI capacity; assets that shorten it command premium pricing.", "quote": "The biggest motivator for on-site power right now from data centers is speed", "locator": "One of the biggest roadblocks to starting up", "quote_verified": true}, {"claim": "Behind-the-meter gas is often pitched as a temporary bridge, which Energy Innovation's Brendan Pierpont calls a very expensive way to cover a five-to-seven-year gap until data centers obtain a grid connection, after which plants may serve as backup.", "speaker": "Casey Crownhart", "type": "framework", "entities": ["Energy Innovation", "Brendan Pierpont", "data centers", "grid interconnection"], "conviction": "medium", "so_what": "Bridge-power demand may be cyclical rather than permanent; plants could shift to backup duty once grid ties arrive.", "quote": "a very expensive way to bridge that maybe five-to-seven-year timeline gap", "locator": "Behind-the-meter doesn’t always mean being totally", "quote_verified": true}, {"claim": "Once data center operators sink capital into on-site gas plants, they may keep running them long after grid connection, creating fossil fuel lock-in risk according to BloombergNEF's Musfika Mishi.", "speaker": "Casey Crownhart", "type": "causal", "entities": ["BloombergNEF", "Musfika Mishi", "natural gas", "data centers"], "conviction": "medium", "so_what": "Supports longer-duration gas demand than 'bridge' framing implies; a durable tailwind for gas suppliers.", "quote": "the probability that it is going to be in use much longer is a real risk, and that leads to fossil fuel lock-in", "locator": "Even if gas plants are pitched as a near-term", "quote_verified": true}]}, {"theme": "Turbine shortage pushes simple-cycle", "insights": [{"claim": "Gas turbine equipment manufacturers are struggling to keep up with surging demand from both utilities and data centers, pushing behind-the-meter developers toward less-efficient, cheaper single-cycle turbines rather than combined-cycle units.", "speaker": "Casey Crownhart", "type": "causal", "entities": ["gas turbines", "combined-cycle turbines", "single-cycle turbines", "utilities", "data centers"], "conviction": "high", "so_what": "Turbine makers have pricing power and backlog; simple-cycle/aeroderivative and reciprocating supply is a bottleneck to watch.", "quote": null, "locator": "Utilities are already planning to build more natural gas", "quote_verified": false}, {"claim": "Very few planned behind-the-meter data center gas plants will use combined-cycle turbines, so these off-grid plants will likely emit more greenhouse gases than other natural gas generation.", "speaker": "Casey Crownhart", "type": "prediction", "entities": ["BloombergNEF", "combined-cycle turbines", "data centers"], "conviction": "medium", "so_what": "Higher heat rates mean more gas burned per MWh, raising gas demand and emissions scrutiny.", "quote": null, "locator": "Very few of the planned behind-the-meter facilities", "quote_verified": false}]}, {"theme": "Emissions and ratepayer spillovers", "insights": [{"claim": "If all planned US behind-the-meter data center gas plants proceed, they could emit 345 million metric tons CO2e per year by 2035, 152 million tons more than drawing from the US grid, a gap larger than the Netherlands' total annual emissions, per BloombergNEF.", "speaker": "Casey Crownhart", "type": "data_point", "entities": ["BloombergNEF", "data centers", "natural gas", "Netherlands"], "conviction": "high", "so_what": "Sizable emissions delta invites regulatory and ESG pushback against off-grid AI gas power.", "quote": null, "locator": "If all planned behind-the-meter gas plants", "quote_verified": false}, {"claim": "With nuclear and renewables supplying about 40% of US electricity, a grid connection is generally lower-emissions than an all-gas on-site plant, though not in coal-heavy grids such as India's, which expects a data center boom.", "speaker": "Casey Crownhart", "type": "framework", "entities": ["US grid", "India", "nuclear", "renewables", "coal"], "conviction": "medium", "so_what": "Emissions advantage of grid power is region-specific; India data center growth is tied to coal.", "quote": null, "locator": "Today, the US grid is still reliant", "quote_verified": false}, {"claim": "Off-grid data center gas plants do not shield other consumers: added gas demand could raise natural gas prices for the roughly 60% of US households using gas for heating and cooking, and may trickle into electricity prices, says Energy Innovation's Matthias Fripp.", "speaker": "Casey Crownhart", "type": "causal", "entities": ["Energy Innovation", "Matthias Fripp", "natural gas", "US households"], "conviction": "medium", "so_what": "Bullish Henry Hub demand signal; raises political/affordability risk for AI data center buildout.", "quote": null, "locator": "And while it might seem logical that data centers", "quote_verified": false}]}, {"theme": "Alternatives to on-site gas", "insights": [{"claim": "Pairing on-site gas with on-site renewables or energy storage could reduce how often data center gas plants fire, though multi-source economics are tricky, per BloombergNEF's Mishi.", "speaker": "Casey Crownhart", "type": "thesis", "entities": ["BloombergNEF", "Musfika Mishi", "renewables", "energy storage"], "conviction": "exploratory", "so_what": "Hybrid on-site power is an opportunity for storage and solar vendors serving data centers.", "quote": null, "locator": "Creative solutions could also help limit", "quote_verified": false}, {"claim": "Energy Innovation research finds building renewables and energy storage to meet rising electricity demand could be reliable and cheaper than relying on fossil fuels, and Fripp calls rushing off-grid with gas probably a bad solution.", "speaker": "Casey Crownhart", "type": "contrarian", "entities": ["Energy Innovation", "Matthias Fripp", "renewables", "energy storage"], "conviction": "medium", "so_what": "Counter-narrative to gas-for-AI; supports storage/renewables as competing data center power solutions.", "quote": "Rushing off the grid and putting in your own behind-the-meter gas is probably a bad way", "locator": "While the grid is struggling to keep up", "quote_verified": true}]}], "insight_total": 15, "top_entities": ["data centers", "natural gas", "behind-the-meter power", "Cleanview", "BloombergNEF", "Energy Innovation", "xAI", "combined-cycle turbines", "renewables", "energy storage"], "source_meta": {"author": "Casey Crownhart", "word_count": 1267, "paywalled": false}}, {"record_id": "8a83f358dd5bb06d", "source_type": "technology", "source_name": "Nature Biotechnology", "source_url": "https://www.nature.com/articles/s41587-026-03351-6", "title": "Modular mRNA-encoded helper proteins enhance DNA delivery - Nature Biotechnology", "published_date": "2026-11-24", "language": "en", "processed_at": "2026-11-25T11:06:40Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "University of Pennsylvania researchers (Brenner lab) report MEND (mRNA-enhanced DNA delivery), which codelivers mRNA-encoded helper proteins — DNA translocators, host modulators and immune dampeners — alongside a DNA payload to prime the recipient cell rather than optimizing the lipid vehicle. Reported gains run from ~10-fold to 44-fold in vitro, ~70-fold with sequence-specific TetR-H3.3, and 4-16-fold in mice with liver-, lung- and intradermal-targeted LNPs, with lower IFNβ/IL-6 than standard DNA-LNPs.", "themes": [{"theme": "Engineer the cell, not the lipid", "insights": [{"claim": "MEND (mRNA-enhanced DNA delivery) shifts nonviral DNA delivery optimization away from lipid chemistry and LNP formulation toward transiently engineering the recipient cell to produce mRNA-encoded helper proteins that prime it for DNA processing.", "speaker": "Nature Biotechnology", "type": "framework", "entities": ["MEND", "lipid nanoparticles", "mRNA", "DNA delivery"], "conviction": "high", "so_what": "A new, orthogonal axis of improvement in gene delivery: platform value may accrue to helper-protein IP rather than to the lipid libraries most delivery companies have been racing to patent.", "quote": "While current DNA delivery strategies focus on optimizing lipid chemistry and LNP formulation3,4, we instead engineered the recipient cell to transiently produce helper proteins.", "locator": "Main — 'The promise of genetic medicine'", "quote_verified": true}, {"claim": "DNA-LNPs underperform viral vectors chiefly because exogenous DNA must survive endosomal entrapment, cytosolic degradation, nuclear exclusion and innate immune sensing via the cGAS-STING pathway — a stack of barriers rather than a single bottleneck.", "speaker": "Nature Biotechnology", "type": "causal", "entities": ["DNA-LNPs", "cGAS-STING", "viral vectors"], "conviction": "high", "so_what": "Explains why single-point fixes to nonviral DNA delivery have plateaued; investors should expect winners to stack multiple interventions rather than sell one trick.", "quote": "endosomal entrapment, cytosolic degradation, nuclear exclusion and innate immune sensing, such as the cGAS–STING pathway", "locator": "Main — 'This disparity is driven in large part'", "quote_verified": true}, {"claim": "MEND is explicitly modular across three helper-protein classes — DNA translocators, host modulators and immune dampeners — so the same codelivery architecture can be repointed at different delivery bottlenecks without redesigning the vehicle.", "speaker": "Nature Biotechnology", "type": "framework", "entities": ["MEND", "DNA translocators", "host modulators", "immune dampeners"], "conviction": "high", "so_what": "Modularity is what makes this a platform rather than a single asset; watch for licensing deals structured around the helper-mRNA layer.", "quote": null, "locator": "Main — 'To illustrate the diverse capabilities of MEND'", "quote_verified": false}]}, {"theme": "BAF variants as sequence-independent translocators", "insights": [{"claim": "Barrier-to-autointegration factor (BAF) was chosen as the lead DNA translocator scaffold because it both binds DNA robustly and can outcompete cGAS, addressing nuclear transit and innate sensing with one protein.", "speaker": "Nature Biotechnology", "type": "causal", "entities": ["BAF", "cGAS", "DNA translocators"], "conviction": "high", "so_what": "Dual-function helper proteins are the efficient design point; screening libraries should be biased toward proteins that hit two barriers at once.", "quote": null, "locator": "DNA translocators MEND — 'we first tested the barrier-to-autointegration factor'", "quote_verified": false}, {"claim": "Of three engineered BAF mutants, BAFv3 — which combines the L58R LEM-interaction-abolishing mutation with the TTS2-4AAA phosphorylation-disabling mutation — emerged as the lead candidate for raising transgene expression in HepG2 cells.", "speaker": "Nature Biotechnology", "type": "data_point", "entities": ["BAFv3", "BAFv1", "BAFv2", "HepG2"], "conviction": "high", "so_what": "The specific winning variant is the patentable unit; note Penn has filed a patent on the DNA-LNP technology described.", "quote": null, "locator": "DNA translocators MEND — 'On the basis of the documented BAF mutations'", "quote_verified": false}, {"claim": "Appending C-terminal nuclear localization signal sequences to BAFv3 failed to further raise expression in HepG2 cells, implying that in proliferative cells the bottleneck is postentry chromatin engagement and intranuclear localization rather than nuclear import.", "speaker": "Nature Biotechnology", "type": "contrarian", "entities": ["BAFv3", "NLS", "HepG2", "chromatin"], "conviction": "medium", "so_what": "Contradicts the default assumption that NLS tagging is the lever for nuclear delivery; programs built on NLS fusions in dividing cells may be optimizing the wrong step.", "quote": "the primary bottleneck may not be nuclear import but, rather, postentry chromatin engagement and intranuclear localization", "locator": "DNA translocators MEND — 'Notably, appending various C-terminal NLS sequences'", "quote_verified": true}, {"claim": "Fusing BAFv3 to euchromatin binders — LEDGF's PWWP domain (BAFv3-PWWP) or histone H3.3 (BAFv3-H3.3) — significantly increased gene expression, exceeding 44-fold in some in vitro conditions.", "speaker": "Nature Biotechnology", "type": "data_point", "entities": ["BAFv3-PWWP", "BAFv3-H3.3", "LEDGF", "histone H3.3"], "conviction": "high", "so_what": "44-fold in vitro is the headline efficiency number; it sets the benchmark competing nonviral DNA platforms will be measured against.", "quote": "significantly increased gene expression—exceeding 44-fold in some conditions", "locator": "DNA translocators MEND — 'we hypothesized that fusing BAF to a euchromatin binder'", "quote_verified": true}, {"claim": "A MEND-LNP carrying mCherry mRNA produced no improvement over standard DNA-LNPs, establishing that the expression gains come from the specific helper protein rather than from any generic codelivery or formulation effect.", "speaker": "Nature Biotechnology", "type": "data_point", "entities": ["MEND-LNP", "mCherry", "DNA-LNPs"], "conviction": "high", "so_what": "The negative control rules out the most deflating alternative explanation, which raises the credibility of the whole dataset for a licensing diligence read.", "quote": null, "locator": "DNA translocators MEND — 'We confirmed that this was not a delivery effect'", "quote_verified": false}, {"claim": "Different helper proteins have different optimal mRNA-to-DNA ratios, so the ratio must be re-optimized for each use case rather than fixed platform-wide.", "speaker": "Nature Biotechnology", "type": "framework", "entities": ["MEND", "mRNA", "DNA"], "conviction": "medium", "so_what": "A hidden CMC/development cost: each indication needs its own ratio optimization, slowing the 'drop-in platform' story.", "quote": null, "locator": "DNA translocators MEND — 'We further observed that different helper proteins'", "quote_verified": false}]}, {"theme": "Borrowing viral tricks: host modulators and immune dampeners", "insights": [{"claim": "Screening mammalian and viral protein kinases to create a cell state 'permissive' to exogenous DNA yielded US3 kinase from human herpesvirus 1, which delivered a 10-fold improvement in DNA expression over standard DNA-LNPs.", "speaker": "Nature Biotechnology", "type": "data_point", "entities": ["US3 kinase", "human herpesvirus 1", "DNA-LNPs", "protein kinases"], "conviction": "high", "so_what": "Viral proteomes are a cheap, pre-evolved screening library for delivery enhancers — a repeatable discovery strategy, not a one-off hit.", "quote": null, "locator": "Host modulator MEND — 'We screened various mammalian and viral protein kinases'", "quote_verified": false}, {"claim": "Most screened immune dampeners targeting the cGAS-STING axis failed to measurably reduce the immune response in THP-1 cells; only the vaccinia viral IFN inhibitor B18R reduced interferon regulatory factor activation.", "speaker": "Nature Biotechnology", "type": "data_point", "entities": ["B18R", "cGAS-STING", "THP-1", "IRF"], "conviction": "medium", "so_what": "Honest negative data: immune dampening is the weakest of the three MEND classes and was only a proof of concept, so near-term value sits in the translocator arm.", "quote": null, "locator": "Immune dampeners MEND — 'Next, we screened various immune dampeners'", "quote_verified": false}]}, {"theme": "In vitro gains do not survive translation intact", "insights": [{"claim": "Although BAFv3-PWWP, BAFv3-H3.3 and US3 all showed more than tenfold in vitro gains, only plain BAFv3 translated to liver-targeted LNPs in mice, achieving a peak 16-fold increase in expression over standard DNA-LNPs.", "speaker": "Nature Biotechnology", "type": "data_point", "entities": ["BAFv3", "BAFv3-H3.3", "BAFv3-PWWP", "US3", "liver-targeted LNP"], "conviction": "high", "so_what": "A sharp in vitro-to-in vivo attrition signal: discount any gene-delivery claim benchmarked only in immortalized dividing cell lines.", "quote": null, "locator": "Main — 'While the PWWP and H3.3 BAFv3 fusions and US3 showed more than tenfold improvements'", "quote_verified": false}, {"claim": "The divergence between cell lines and liver arises because quiescent hepatocytes bottleneck at nuclear pore entry while rapidly dividing HepG2 cells bottleneck at chromatin engagement — a cell-cycle-dependent mechanism supported by aphidicolin growth arrest reducing MEND's effect, especially for BAFv3-H3.3.", "speaker": "Nature Biotechnology", "type": "causal", "entities": ["HepG2", "hepatocytes", "aphidicolin", "nuclear pore complex", "BAFv3-H3.3"], "conviction": "medium", "so_what": "Implies helper-protein choice must be matched to the target tissue's proliferative state — a design rule that will determine which indications a given construct can serve.", "quote": "In the liver, the bottleneck may be initial entry through the nuclear pore complex rather than chromatin engagement", "locator": "Main — 'This suggests that the biology of a quiescent (resting) liver cell'", "quote_verified": true}, {"claim": "MEND-LNP (BAFv3) produced lower IFNβ and IL-6 at 4 h and comparable AST/ALT at 24 h versus standard DNA-LNPs in mice, so the added helper mRNA did not worsen the acute inflammatory or liver-damage profile in this initial assessment.", "speaker": "Nature Biotechnology", "type": "data_point", "entities": ["MEND-LNP", "BAFv3", "IFNβ", "IL-6", "AST", "ALT"], "conviction": "medium", "so_what": "Early safety read is the gating risk for exogenous-protein delivery; a neutral-to-better cytokine profile keeps the asset investable, but redosing data is still absent.", "quote": null, "locator": "Main — 'Next, to make an initial assessment of the safety profile'", "quote_verified": false}, {"claim": "MEND extended beyond the luciferase reporter to a therapeutic IL10 transgene, raising IL-10 at both protein and mRNA levels, and worked in HUVECs in vitro plus PECAM-targeted lung LNPs (4-fold peak, sustained >20 days) and intradermal delivery (14-fold peak, sustained >14 days) in vivo.", "speaker": "Nature Biotechnology", "type": "data_point", "entities": ["IL10", "HUVEC", "PECAM-targeted LNPs", "luciferase", "intradermal"], "conviction": "high", "so_what": "Durability of two-to-three weeks plus a real therapeutic payload moves this from reporter-gene novelty toward a credible dosing regimen.", "quote": null, "locator": "Main — 'Lastly, we extended MEND from a reporter gene (luciferase)'", "quote_verified": false}]}, {"theme": "Vehicle-agnostic reach and programmable control", "insights": [{"claim": "Codelivering BAFv3-H3.3 mRNA-LNPs with either Lipofectamine 2000 or adeno-associated virus yielded roughly 10-fold enhancement in transgene expression, so the helper-protein layer improves viral vectors too, not just LNPs.", "speaker": "Nature Biotechnology", "type": "data_point", "entities": ["BAFv3-H3.3", "Lipofectamine 2000", "AAV", "adeno-associated viruses"], "conviction": "high", "so_what": "The addressable market widens from nonviral delivery to the entire AAV gene-therapy field, where dose-limiting toxicity makes a 10-fold potency gain economically significant.", "quote": null, "locator": "Alternative delivery vectors — 'Codelivery of BAFv3-H3.3 mRNA-LNPs'", "quote_verified": false}, {"claim": "Because BAF preferentially binds double-stranded DNA, the authors annealed ~600-bp oligos to low-immunogenicity circular single-stranded DNA to create dsDNA engagement regions, recovering a 10-fold expression increase for the hybrid payload.", "speaker": "Nature Biotechnology", "type": "causal", "entities": ["cssDNA", "dsDNA", "BAFv3-H3.3", "BAF"], "conviction": "medium", "so_what": "Shows the helper layer can be retrofitted to next-generation low-immunogenicity DNA formats, but only via payload re-engineering — an extra manufacturing step competitors must also solve.", "quote": null, "locator": "Diverse DNA architectures — 'We next adapted MEND for circular single-stranded DNA'", "quote_verified": false}, {"claim": "A sequence-specific translocator — TetR fused to histone H3.3 codelivered with a DNA payload bearing 21 tetO sites — drove a ~70-fold expression increase that scaled with the number of tetO sites, confirming the effect comes from specific TetR-DNA binding rather than nonspecific H3.3 affinity.", "speaker": "Nature Biotechnology", "type": "data_point", "entities": ["TetR-H3.3", "tetO", "histone H3.3"], "conviction": "high", "so_what": "The largest single effect size in the paper, and the dose-response on site count is strong mechanistic evidence — the most defensible claim for diligence.", "quote": "drove a robust ~70-fold increase in transgene expression", "locator": "DNA-sequence-specific delivery — 'We engineered a DNA payload harboring 21 tetO-binding sites'", "quote_verified": true}, {"claim": "With doxycycline induction, MEND-LNPs (BAFv3-H3.3) raised the on/off fold-induction ratio of a drug-inducible promoter construct to 1,300 versus 250 for standard DNA-LNPs, improving dynamic range and not just absolute expression.", "speaker": "Nature Biotechnology", "type": "data_point", "entities": ["doxycycline", "MEND-LNP", "BAFv3-H3.3", "DNA-LNPs"], "conviction": "high", "so_what": "A 5x better on/off window is what makes drug-controllable gene circuits clinically governable; relevant to anyone underwriting inducible cell or gene therapies.", "quote": "achieved an ‘on/off’ fold-induction ratio of 1,300—far exceeding the ratio of 250 observed with standard DNA-LNPs", "locator": "Control by small-molecule drugs — 'Upon induction with doxycycline'", "quote_verified": true}]}, {"theme": "Stated limits and the authors' roadmap", "insights": [{"claim": "The authors flag that because some MEND versions introduce exogenous proteins, rigorous evaluation of innate sensing and adaptive immune responses is essential before redosable regimens — the key unresolved translational risk.", "speaker": "Nature Biotechnology", "type": "thesis", "entities": ["MEND", "adaptive immune response", "innate sensing"], "conviction": "high", "so_what": "Anti-helper-protein immunity is the most likely failure mode for chronic dosing; it is the question to put to any company licensing this approach.", "quote": "rigorous evaluation of its safety profile—specifically innate sensing and adaptive immune responses—is essential for redosable regimens", "locator": "Conclusion — 'In conclusion, MEND establishes a modular paradigm'", "quote_verified": true}, {"claim": "The authors position MEND's next applications in DNA-reliant gene insertion technologies including transposon-based integration and targeted HDR-mediated knock-ins, framing it as an enabler for durable, high-level expression where viral and nonviral delivery alone fall short.", "speaker": "Nature Biotechnology", "type": "prediction", "entities": ["MEND", "transposon-based integration", "HDR", "gene therapies"], "conviction": "medium", "so_what": "Signals where the follow-on IP and collaborations will land — integration-based gene writing rather than transient episomal expression.", "quote": null, "locator": "Conclusion — 'Future applications will extend to DNA-reliant gene insertion technologies'", "quote_verified": false}, {"claim": "Two authors (M.N.P. and J.S.B.) have filed a patent on the DNA-LNP technology described, and the work was funded by NIH, NSF, the American Heart Association and the Korea Health Industry Development Institute.", "speaker": "Nature Biotechnology", "type": "data_point", "entities": ["University of Pennsylvania", "Jacob S. Brenner", "Manthan N. Patel", "NIH"], "conviction": "high", "so_what": "The IP is already staked at Penn, so commercial exposure would come via a Penn spinout or license rather than an open-field race.", "quote": null, "locator": "Ethics declarations — Competing interests", "quote_verified": false}]}], "insight_total": 22, "top_entities": ["MEND", "BAFv3", "BAFv3-H3.3", "lipid nanoparticles", "DNA-LNPs", "TetR–H3.3", "cGAS–STING", "HepG2", "AAV", "US3 kinase", "B18R", "University of Pennsylvania"], "source_meta": {"author": "Nature Biotechnology", "word_count": 4335, "paywalled": false}}, {"record_id": "2578d40f6bb872f6", "source_type": "technology", "source_name": "NVIDIA Developer Blog", "source_url": "https://developer.nvidia.com/blog/whats-new-for-game-developers-ai-animation-and-rtx-tools/", "title": "What’s New for Game Developers: AI Animation and RTX Tools | NVIDIA Technical Blog", "published_date": "2026-11-24", "language": "en", "processed_at": "2026-11-25T11:06:33Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "NVIDIA's November 2026 game-developer roundup pushes neural rendering (DLSS 5 in War Thunder), generative AI animation (Kimodo as the first model in Unreal Engine 5.9's guided animation framework), on-device AI (In-Game Inferencing SDK 1.8) and a wave of ray-tracing SDK/tooling updates, nearly all now targeting the new RTX Spark platform. Nsight tools add an MCP server and agent skill files, extending agentic AI into graphics debugging.", "themes": [{"theme": "DLSS 5 neural rendering adoption", "insights": [{"claim": "Gaijin Entertainment integrated NVIDIA DLSS 5 with 3D-Guided Neural Rendering into War Thunder's Dagor Engine, adapting its color pipeline to evaluate DLSS 5 in sRGB before post-processing and UI and then map results back to linear HDR.", "speaker": "Phillip Singh", "type": "data_point", "entities": ["Gaijin Entertainment", "War Thunder", "Dagor Engine", "DLSS 5", "NVIDIA"], "conviction": "high", "so_what": "Shows DLSS 5 requires real engine pipeline changes, not a drop-in toggle; adoption by established titles is a leading indicator of NVIDIA's neural-rendering moat.", "quote": null, "locator": "How Gaijin raised War Thunder’s realism", "quote_verified": false}, {"claim": "Gaijin says DLSS 5 delivers a level of microcontrast in War Thunder that the studio could not previously achieve, producing a more natural, lifelike image.", "speaker": "Phillip Singh", "type": "thesis", "entities": ["Gaijin Entertainment", "DLSS 5", "War Thunder"], "conviction": "high", "so_what": "Developer testimony that neural rendering adds image quality beyond traditional rendering supports NVIDIA's GPU differentiation narrative.", "quote": "introducing a new level of microcontrast that we simply haven’t been able to achieve before", "locator": "How Gaijin raised War Thunder’s realism", "quote_verified": true}, {"claim": "Studios integrating DLSS 5 must tune it against their reference look to preserve art direction details such as vehicle markings, surface wear and material properties, evaluating quality and performance separately per game mode.", "speaker": "Phillip Singh", "type": "framework", "entities": ["DLSS 5", "War Thunder", "Gaijin Entertainment"], "conviction": "medium", "so_what": "Art-direction drift is the key adoption friction for neural rendering; watch whether more studios ship it by default or keep it optional.", "quote": null, "locator": "The team also discusses tuning DLSS 5", "quote_verified": false}]}, {"theme": "Generative AI animation in Unreal", "insights": [{"claim": "NVIDIA Kimodo is the first AI motion-generation model integrated into Unreal Engine 5.9 Preview's new guided animation framework, letting animators generate character motion inside Sequencer.", "speaker": "Phillip Singh", "type": "data_point", "entities": ["NVIDIA Kimodo", "Unreal Engine 5.9", "Epic Games", "NVIDIA"], "conviction": "high", "so_what": "First-mover placement inside Epic's engine gives NVIDIA a distribution channel for GPU-accelerated generative tools into mainstream game production.", "quote": null, "locator": "NVIDIA Kimodo is the first model", "quote_verified": false}, {"claim": "Kimodo generates motion constrained by text prompts, drawn spline paths and target poses at specific frames, keeping creative control with animators rather than fully automating animation.", "speaker": "Phillip Singh", "type": "framework", "entities": ["NVIDIA Kimodo", "Unreal Engine 5.9"], "conviction": "medium", "so_what": "Constraint-guided generation is the pattern that makes generative AI acceptable to professional content pipelines.", "quote": null, "locator": "Animators can describe a motion with", "quote_verified": false}]}, {"theme": "On-device game AI and RTX Spark", "insights": [{"claim": "NVIDIA In-Game Inferencing SDK 1.8 adds hardened RTX Spark platform support, newer llama.cpp and whisper.cpp backends, Parakeet speech recognition via whisper.cpp, and Vulkan priority API support for running ACE AI characters locally alongside game graphics.", "speaker": "Phillip Singh", "type": "data_point", "entities": ["NVIDIA In-Game Inferencing SDK", "NVIDIA ACE", "RTX Spark", "llama.cpp", "whisper.cpp", "Parakeet", "Vulkan"], "conviction": "high", "so_what": "NVIDIA is pushing local LLM/ASR inference on consumer GPUs for games, which raises VRAM and compute demand per PC.", "quote": null, "locator": "NVIDIA In-Game Inferencing SDK 1.8 expands", "quote_verified": false}, {"claim": "RTX Spark support is being added across nearly every NVIDIA game SDK in this release cycle, including In-Game Inferencing, RTXDI 3.2, RTX Path Tracing 1.9 and the BVH Viewer.", "speaker": "Phillip Singh", "type": "thesis", "entities": ["RTX Spark", "NVIDIA", "RTXDI", "RTX Path Tracing"], "conviction": "medium", "so_what": "Broad SDK enablement signals NVIDIA is preparing a developer ecosystem around the RTX Spark platform; watch its commercial ramp.", "quote": null, "locator": null, "quote_verified": false}]}, {"theme": "Ray tracing SDKs and debugging tools", "insights": [{"claim": "NVIDIA RTX Path Tracing 1.9 integrates SHaRC radiance caching into the main path tracer by default to feed DLSS Ray Reconstruction, and expands NEE-AT light sampling to up to two million lights.", "speaker": "Phillip Singh", "type": "data_point", "entities": ["RTX Path Tracing", "SHaRC", "DLSS Ray Reconstruction", "NVIDIA"], "conviction": "medium", "so_what": "Tighter coupling of path tracing to DLSS Ray Reconstruction deepens reliance on NVIDIA-specific AI denoising.", "quote": null, "locator": "RTX Path Tracing 1.9 adds an introductory", "quote_verified": false}, {"claim": "NVIDIA released Real-Time BVH Viewer 1.0, a vendor-agnostic tool that shows live ray-tracing acceleration structures (TLAS/BLAS) for D3D12 and Vulkan apps, including per-pixel trace-time heatmaps, and can attach to running titles without code changes.", "speaker": "Phillip Singh", "type": "data_point", "entities": ["NVIDIA Real-Time BVH Viewer", "D3D12", "Vulkan"], "conviction": "medium", "so_what": "Lowering ray-tracing debugging cost accelerates RT adoption, which favors GPUs strongest at ray tracing.", "quote": null, "locator": "NVIDIA Real-Time BVH Viewer 1.0 brings", "quote_verified": false}, {"claim": "RTX Global Illumination 2.9 adds Shader Execution Reordering support for Direct3D 12 Shader Model 6.9 and Vulkan, plus a deferred-renderer sample using NRC or SHaRC for indirect diffuse lighting.", "speaker": "Phillip Singh", "type": "data_point", "entities": ["RTX Global Illumination", "Shader Execution Reordering", "Direct3D 12", "Vulkan"], "conviction": "low", "so_what": "Incremental; SER in standard APIs broadens reach of NVIDIA hardware features.", "quote": null, "locator": "RTX Global Illumination 2.9 adds", "quote_verified": false}]}, {"theme": "Agentic AI enters graphics tooling", "insights": [{"claim": "Nsight Graphics 2026.4 ships an MCP server that lets compatible AI agents capture applications, inspect and debug captures and analyze GPU traces, while Nsight Systems 2026.6 adds skill files guiding agents to diagnose CPU bottlenecks, stutter and CPU-GPU sync overhead.", "speaker": "Phillip Singh", "type": "data_point", "entities": ["Nsight Graphics", "Nsight Systems", "MCP", "NVIDIA"], "conviction": "high", "so_what": "NVIDIA is exposing its profiling stack to AI agents via MCP, an early sign of agentic workflows penetrating performance engineering.", "quote": null, "locator": "The new releases also introduce agentic AI tooling", "quote_verified": false}, {"claim": "Nsight Graphics and Nsight Systems now separate DLSS Frame Generation generated frames from application frames on the timeline, requiring Streamline SDK 2.12 or newer.", "speaker": "Phillip Singh", "type": "data_point", "entities": ["Nsight Graphics", "Nsight Systems", "DLSS Frame Generation", "Streamline SDK"], "conviction": "medium", "so_what": "Tooling for frame pacing under Multi-Frame Generation addresses a key developer pain point for frame-gen adoption.", "quote": null, "locator": "NVIDIA Nsight Graphics 2026.4 and Nsight Systems 2026.6", "quote_verified": false}]}], "insight_total": 12, "top_entities": ["NVIDIA", "DLSS 5", "War Thunder", "Gaijin Entertainment", "NVIDIA Kimodo", "Unreal Engine 5.9", "RTX Spark", "In-Game Inferencing SDK", "RTX Path Tracing", "Nsight Graphics", "Nsight Systems", "Vulkan"], "source_meta": {"author": "Phillip Singh", "word_count": 1842, "paywalled": false}}, {"record_id": "def54c97ba9e3192", "source_type": "technology", "source_name": "NVIDIA Developer Blog", "source_url": "https://developer.nvidia.com/blog/how-to-run-nvidia-cosmos-3-on-local-ai-devices-using-hugging-face-diffusers/", "title": "How to Run NVIDIA Cosmos 3 on Local AI Devices Using Hugging Face Diffusers | NVIDIA Technical Blog", "published_date": "2026-11-24", "language": "en", "processed_at": "2026-11-25T11:06:33Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech"], "gist": "NVIDIA shows how to run its Cosmos 3 Nano world foundation model on consumer GeForce RTX GPUs with as little as 12 GB VRAM by streaming transformer weights from system RAM via a Hugging Face Diffusers adapter, plus an FP8 checkpoint. Benchmarks show it works but is slow: 720p text-to-video takes ~44 minutes on an RTX 5070 versus ~17 minutes on an RTX 5090, and hosts carried ~128 GB of system RAM.", "themes": [{"theme": "Weight streaming on consumer GPUs", "insights": [{"claim": "NVIDIA's Cosmos-Framework offloading package runs the Cosmos 3 Nano world foundation model on GPUs with as little as 12 GB of VRAM by keeping model weights in system RAM and moving each transformer block to the GPU only when needed.", "speaker": "Atharva Joshi", "type": "data_point", "entities": ["NVIDIA Cosmos 3 Nano", "Cosmos-Framework", "Hugging Face Diffusers", "GeForce RTX"], "conviction": "high", "so_what": "Pushes physical-AI video generation onto mainstream consumer GPUs, widening NVIDIA's developer base beyond data-center hardware.", "quote": null, "locator": "Step 2: Offload weights storage", "quote_verified": false}, {"claim": "Weight streaming trades GPU memory for higher system RAM use and PCIe transfer load, and does not deliver interactive latency.", "speaker": "Atharva Joshi", "type": "causal", "entities": ["Cosmos 3 Nano", "PCIe", "system RAM"], "conviction": "high", "so_what": "Local video-gen shifts bottlenecks to DRAM capacity and PCIe bandwidth, a tailwind for high-capacity PC memory.", "quote": "Note that this approach does not provide interactive latency or stream weights directly from disk during inference.", "locator": "This streaming adapter builds on top", "quote_verified": true}, {"claim": "All tested consumer-GPU hosts for Cosmos 3 Nano local generation had approximately 128 GB of system RAM, though NVIDIA says this is not a measured minimum.", "speaker": "Atharva Joshi", "type": "data_point", "entities": ["Cosmos 3 Nano", "GeForce RTX 5070", "GeForce RTX 5090"], "conviction": "medium", "so_what": "The real cost of running world models locally includes a large DRAM footprint, relevant to memory demand from AI PCs and workstations.", "quote": null, "locator": "Use an existing Linux environment", "quote_verified": false}, {"claim": "The Cosmos adapter computes the understanding pathway once for fixed conditioning and reuses each streamed block across both classifier-free guidance predictions to avoid repeated weight transfers.", "speaker": "Atharva Joshi", "type": "framework", "entities": ["Cosmos 3", "Hugging Face Diffusers", "classifier-free guidance"], "conviction": "medium", "so_what": "Shows software scheduling, not just hardware, determines whether large models fit on small GPUs.", "quote": null, "locator": "Reuse understanding context during generation", "quote_verified": false}]}, {"theme": "Cosmos 3 model capabilities", "insights": [{"claim": "Cosmos 3 is an open omnimodal world foundation model for physical AI with separate understanding and generation pathways inside one transformer, supporting text-, image- and video-to-video, sound, action and control-guided generation through one Diffusers pipeline.", "speaker": "Atharva Joshi", "type": "data_point", "entities": ["NVIDIA Cosmos 3", "Hugging Face Diffusers", "physical AI"], "conviction": "high", "so_what": "Open multimodal world models with action outputs are NVIDIA's play to own the robotics/physical-AI software stack that drives GPU demand.", "quote": null, "locator": "NVIDIA Cosmos 3, an open omnimodal", "quote_verified": false}, {"claim": "Cosmos 3 Nano can generate robot action outputs from a conditioning video in a policy mode, e.g. using the bridge_orig_lerobot domain, with action runs completing in roughly 38-66 seconds on an RTX 5070.", "speaker": "Atharva Joshi", "type": "data_point", "entities": ["Cosmos 3 Nano", "CosmosActionCondition", "GeForce RTX 5070"], "conviction": "medium", "so_what": "Action generation is far cheaper than video generation, making robot-policy experimentation feasible on consumer cards.", "quote": null, "locator": "Action generation", "quote_verified": false}]}, {"theme": "FP8 mixed precision", "insights": [{"claim": "The Cosmos 3 Nano FP8 checkpoint uses W8A16 for the first three and last three denoising steps and W8A8 for the middle steps, while attention stays in BF16 SDPA, so the pipeline is not fully FP8.", "speaker": "Atharva Joshi", "type": "data_point", "entities": ["Cosmos 3 Nano", "FP8", "NVIDIA Model Optimizer"], "conviction": "medium", "so_what": "Mixed-precision schedules are how model vendors squeeze consumer hardware; full low-precision attention remains unsolved here.", "quote": "Note that attention remains BF16 SDPA; the entire pipeline does not run in FP8.", "locator": "Step 4: Use the FP8 checkpoint", "quote_verified": true}, {"claim": "On a 12 GB RTX 5070, the FP8 checkpoint cut 720p text-to-video time from 2,624.9 s to 2,235.7 s (about 15%) and peak memory from 9.94 GiB to 9.16 GiB, in single-run measurements.", "speaker": "Atharva Joshi", "type": "data_point", "entities": ["GeForce RTX 5070", "Cosmos 3 Nano", "FP8"], "conviction": "medium", "so_what": "FP8 gives only modest gains under weight streaming, implying transfer, not math, dominates on small cards.", "quote": null, "locator": "Text-to-video results across RTX GPUs", "quote_verified": false}]}, {"theme": "Benchmark economics across RTX cards", "insights": [{"claim": "Full 720p, 189-frame Cosmos 3 Nano text-to-video in BF16 took 2,624.9 s on an RTX 5070 (12 GB), 1,594.4 s on an RTX 5080 (16 GB), 1,052.2 s on an RTX 4090 (24 GB) and 1,016.7 s on an RTX 5090 (32 GB).", "speaker": "Atharva Joshi", "type": "data_point", "entities": ["GeForce RTX 5070", "GeForce RTX 5080", "GeForce RTX 4090", "GeForce RTX 5090", "Cosmos 3 Nano"], "conviction": "high", "so_what": "VRAM capacity, not just architecture, drives local generative-video speed; supports upsell to higher-VRAM GPUs.", "quote": null, "locator": "Table 4. Full text-to-video pipeline latency", "quote_verified": false}, {"claim": "The prior-generation RTX 4090 with 24 GB nearly matched the RTX 5090 at 720p (1,052 s vs 1,017 s) and beat the 16 GB RTX 5080, indicating memory capacity matters more than GPU generation for streamed video-model inference.", "speaker": "Atharva Joshi", "type": "causal", "entities": ["GeForce RTX 4090", "GeForce RTX 5090", "GeForce RTX 5080"], "conviction": "exploratory", "so_what": "Suggests older high-VRAM cards retain value for local AI; NVIDIA cautions these are single-run results, not a controlled ranking.", "quote": null, "locator": "Text-to-video results across RTX GPUs", "quote_verified": false}, {"claim": "Control-guided Transfer generation at 720p on an RTX 5070 took 4,834.9 s in BF16 (about 80 minutes) with guardrails off, the slowest modality, because Transfer performs more guidance work than text- or image-to-video.", "speaker": "Atharva Joshi", "type": "data_point", "entities": ["GeForce RTX 5070", "Cosmos 3 Nano"], "conviction": "medium", "so_what": "Local world-model generation remains batch, not interactive, on entry cards; cloud/data-center demand for production use persists.", "quote": null, "locator": "Full modality results on RTX 5070", "quote_verified": false}, {"claim": "NVIDIA recommends 12 GB GPUs start at 240p or 480p, 16 GB at 480p, while 24 GB gives materially faster full-resolution generation and 32 GB had the best measured consumer latency for 720p BF16.", "speaker": "Atharva Joshi", "type": "framework", "entities": ["GeForce RTX", "Cosmos 3 Nano"], "conviction": "medium", "so_what": "A clear VRAM-tier ladder for local AI video use cases.", "quote": null, "locator": "Step 5: Choose a GPU and resolution", "quote_verified": false}]}], "insight_total": 12, "top_entities": ["NVIDIA Cosmos 3 Nano", "Hugging Face Diffusers", "Cosmos-Framework", "GeForce RTX 5070", "GeForce RTX 5080", "GeForce RTX 4090", "GeForce RTX 5090", "FP8", "PCIe", "physical AI"], "source_meta": {"author": "Atharva Joshi", "word_count": 2967, "paywalled": false}}, {"record_id": "f36e2492b6228b4e", "source_type": "technology", "source_name": "NVIDIA Developer Blog", "source_url": "https://developer.nvidia.com/blog/qa-how-everstone-brings-where-winds-meet-to-life-with-nvidia-dlss-5/", "title": "Q&A: How Everstone Brings Where Winds Meet to Life with NVIDIA DLSS 5 | NVIDIA Technical Blog", "published_date": "2026-11-24", "language": "en", "processed_at": "2026-11-25T11:06:33Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "Everstone Studio (Where Winds Meet) describes adopting NVIDIA DLSS 5 neural rendering via its existing Streamline integration, tuning model selection and structural/tonal strength to preserve art direction. DLSS 5 adds measurable performance overhead, so it will ship as an optional, player-toggleable feature, and the studio advises budgeting for it early.", "themes": [{"theme": "Integration via Streamline", "insights": [{"claim": "Everstone Studio adopted NVIDIA DLSS 5 in Where Winds Meet smoothly because it had continuously kept its NVIDIA Streamline and prior DLSS integrations up to date.", "speaker": "Phillip Singh", "type": "causal", "entities": ["Everstone Studio", "Where Winds Meet", "DLSS 5", "NVIDIA Streamline"], "conviction": "high", "so_what": "Prior DLSS integrations create switching costs and a fast path for each new NVIDIA feature, reinforcing ecosystem lock-in.", "quote": null, "locator": "How did you integrate DLSS 5", "quote_verified": false}, {"claim": "NVIDIA gives DLSS 5 developers model selection plus structural and tonal strength controls, and Everstone artists and engineers iterate on these to keep faces and colour palette from drifting off the intended look.", "speaker": "Phillip Singh", "type": "framework", "entities": ["DLSS 5", "NVIDIA", "Everstone Studio"], "conviction": "medium", "so_what": "Controllability is what lets neural rendering pass art-direction review in shipped games.", "quote": null, "locator": "NVIDIA provides developers with options", "quote_verified": false}]}, {"theme": "Visual gains vs art direction", "insights": [{"claim": "Everstone reports DLSS 5 tones down overly bright highlights, adds ambient-light detail in shadows and recognizes material properties, with the biggest improvement in Where Winds Meet's Jiangnan region (wood and roof-tile detail).", "speaker": "Phillip Singh", "type": "data_point", "entities": ["DLSS 5", "Where Winds Meet", "Everstone Studio"], "conviction": "medium", "so_what": "Neural rendering is being used to add material detail, not just upscale, a qualitative step-up in NVIDIA's software differentiation.", "quote": null, "locator": "We find that Jiangnan is where", "quote_verified": false}, {"claim": "Everstone's stated goal for DLSS 5 is harmony with existing art direction rather than greater visual impact for its own sake, checking that characters stay recognizable and materials stay distinct.", "speaker": "Phillip Singh", "type": "thesis", "entities": ["Everstone Studio", "DLSS 5"], "conviction": "medium", "so_what": "Studios will gate neural-rendering adoption on preserving IP identity.", "quote": null, "locator": "Our goal, isn’t to pursue greater", "quote_verified": false}]}, {"theme": "Performance overhead and optionality", "insights": [{"claim": "Everstone's internal testing indicates enabling DLSS 5 introduces additional performance overhead, so Where Winds Meet will let players enable or disable it and the art team will choose the DLSS 5 model.", "speaker": "Phillip Singh", "type": "data_point", "entities": ["DLSS 5", "Where Winds Meet", "Everstone Studio"], "conviction": "high", "so_what": "DLSS 5 is a GPU-cost feature, not a free performance win; it raises demand for GPU headroom on high-end RTX cards.", "quote": "Our rns and trading volume at multiple horizons using Megatron Core's distributed training loop.", "speaker": "Liana Mikaelyan", "type": "data_point", "entities": ["NVIDIA", "Megatron Core", "Megatron-LM"], "conviction": "high", "so_what": "NVIDIA is courting capital-markets firms to train their own forecasting foundation models on GPU clusters, expanding FSI compute demand.", "quote": null, "locator": "NVIDIA Megatron Core is an open-source library", "quote_verified": false}, {"claim": "The Megatron financial pipeline keeps price and volume as continuous features via a learned patch embedding rather than converting market values into text tokens.", "speaker": "Liana Mikaelyan", "type": "framework", "entities": ["Megatron-LM", "patch embedding"], "conviction": "medium", "so_what": "Signals the finance-foundation-model approach favored by NVIDIA is time-series transformers, not LLMs reading numbers as text.", "quote": null, "locator": "Forecast returns and trading volume", "quote_verified": false}, {"claim": "A single shared forecasting model can be trained across many instruments, with each window tagged by instrument ID so the model learns instrument-specific behavior within shared parameters.", "speaker": "Liana Mikaelyan", "type": "framework", "entities": ["Megatron-LM"], "conviction": "medium", "so_what": "Cross-asset pooled models are the scaling path for market forecasting, favoring firms with broad data and compute.", "quote": null, "locator": "A common data interface supports training", "quote_verified": false}]}, {"theme": "Patching and target design", "insights": [{"claim": "The preprocessing script groups consecutive bars into patches that act as tokens, e.g. eight bars per patch and 32 patches per window give 256 observations in 32 model positions, each patch carrying its intraday session position.", "speaker": "Liana Mikaelyan", "type": "data_point", "entities": ["Megatron-LM", "preprocessing.py"], "conviction": "medium", "so_what": "Practical recipe for tokenizing tick/bar data for transformers.", "quote": null, "locator": "preprocessing.py groups consecutive bars", "quote_verified": false}, {"claim": "Each training window carries targets for every context position, so one forward pass yields forecasts across the whole context; targets can be point (a future step) or cumulative (summed log return and total volume), with volume on a log scale.", "speaker": "Liana Mikaelyan", "type": "framework", "entities": ["Megatron-LM"], "conviction": "medium", "so_what": "Dense per-position targets improve training efficiency for causal forecasting models.", "quote": null, "locator": "Defining forecast targets", "quote_verified": false}, {"claim": "The example forecasts at horizons of 1, 2, 5 and 15 steps on 390 time units per day, with within-day log returns derived by the script so the overnight gap never enters the inputs.", "speaker": "Liana Mikaelyan", "type": "data_point", "entities": ["Megatron-LM"], "conviction": "low", "so_what": "Configured for one-minute US-session-style bars; useful template for short-horizon execution research.", "quote": null, "locator": "Run preprocessing and training", "quote_verified": false}]}, {"theme": "Leakage and look-ahead safeguards", "insights": [{"claim": "The pipeline splits data by date, keeps a window only if its full context and longest-horizon future fall in one split, applies an embargo of trading days before validation, and checks context patches do not overlap across splits to prevent forward-looking bias.", "speaker": "Liana Mikaelyan", "type": "framework", "entities": ["Megatron-LM"], "conviction": "high", "so_what": "Embedding leakage controls in the default tooling reduces the most common failure in ML backtests.", "quote": null, "locator": "Preserving time in financial modeling", "quote_verified": false}, {"claim": "Per-horizon target normalization statistics are computed from the training split only, so future evaluation data never determines target scaling used in training. , {"record_id": "91f9b9ffee34c25f", "source_type": "technology", "source_name": "Quantum Computing Report", "source_url": "https://quantumcomputingreport.com/harvard-quera-nvidia-anthropic-and-three-national-labs-secure-12-million-doe-award-for-ai-driven-quantum-error-correction/", "title": "Harvard, QuEra, NVIDIA, Anthropic, and Three National Labs Secure $12 Million DOE Award for AI-Driven Quantum Error Correction - Quantum Computing Report", "published_date": "2026-11-24", "language": "en", "processed_at": "2026-11-25T11:06:11Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "A Harvard-led consortium including QuEra, NVIDIA, Anthropic, MIT, Cornell and three national labs won a $12M DOE Genesis Mission Phase II award (ASQC) to use AI to co-design application-specific quantum error correction codes, decoders and compilers, aiming to cut fault-tolerance overhead. Validation on neutral-atom hardware will feed QuEra's Libra fault-tolerant processor slated for Amazon Braket in 2028.", "themes": [{"theme": "ASQC award and consortium", "insights": [{"claim": "A Harvard-led consortium including QuEra Computing was awarded $12 million by the U.S. Department of Energy to develop AI-designed quantum error correction tailored to scientific computing workloads.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Harvard University", "QuEra Computing", "U.S. Department of Energy"], "conviction": "high", "so_what": "Federal funding is flowing to AI-for-QEC; QuEra gains DOE-backed validation for its neutral-atom roadmap.", "quote": null, "locator": "QuEra Computing has joined a Harvard University-led consortium", "quote_verified": false}, {"claim": "The DOE's Application-Aware Error Correction Codesign for Scientific Quantum Computing (ASQC) project is one of 12 Phase II awards under the DOE Genesis Mission administered by the Advanced Scientific Computing Research (ASCR) division.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["DOE Genesis Mission", "ASCR", "ASQC"], "conviction": "high", "so_what": "The Genesis Mission is a multi-award DOE vehicle; track the other 11 Phase II awards for where federal AI+quantum money is going.", "quote": null, "locator": "Titled Application-Aware Error Correction Codesign", "quote_verified": false}, {"claim": "The ASQC consortium unites Harvard, MIT, Cornell, Los Alamos, Lawrence Berkeley and Sandia national laboratories with industry partners QuEra, NVIDIA and Anthropic, mixing a quantum hardware vendor, a GPU vendor and a frontier AI lab.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Harvard University", "MIT", "Cornell University", "Los Alamos National Laboratory", "Lawrence Berkeley National Laboratory", "Sandia National Laboratories", "QuEra Computing", "NVIDIA", "Anthropic"], "conviction": "high", "so_what": "AI labs and GPU vendors are embedding themselves in quantum R&D; NVIDIA and Anthropic gain exposure to fault-tolerant quantum workflows.", "quote": null, "locator": "Titled Application-Aware Error Correction Codesign", "quote_verified": false}, {"claim": "ASQC is led by Harvard physicist and QuEra co-founder Mikhail Lukin, tightly coupling the academic program to QuEra's commercial hardware roadmap.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Mikhail Lukin", "Harvard University", "QuEra Computing"], "conviction": "high", "so_what": "Leadership overlap means ASQC results are likely to flow directly into QuEra products.", "quote": null, "locator": "Led by Harvard physicist and QuEra co-founder Mikhail Lukin", "quote_verified": false}]}, {"theme": "Application-aware QEC to cut overhead", "insights": [{"claim": "ASQC aims to reduce the physical qubit and gate overhead required for fault tolerance by matching error-correcting codes, decoders and compilers to the structure of specific scientific applications rather than treating all noise uniformly.", "speaker": "Mohamed Abdel-Kareem", "type": "thesis", "entities": ["quantum error correction", "fault tolerance", "ASQC"], "conviction": "high", "so_what": "If application-tailored QEC works, useful fault-tolerant machines could arrive with fewer physical qubits than generic-code estimates imply.", "quote": "rather than treating all noise uniformly", "locator": "Led by Harvard physicist and QuEra co-founder Mikhail Lukin", "quote_verified": true}, {"claim": "One ASQC workstream will train AI models to identify dominant fault pathways and define verifiable application-level code quality metrics for quantum simulation, materials science, chemistry and nuclear science workloads.", "speaker": "Mohamed Abdel-Kareem", "type": "framework", "entities": ["ASQC", "AI", "materials science", "chemistry", "nuclear science"], "conviction": "medium", "so_what": "Shifts QEC benchmarking from generic logical error rates to application-level metrics — a new yardstick for comparing vendors.", "quote": null, "locator": "Error-Sensitivity & Code Metrics workstream table", "quote_verified": false}, {"claim": "Cornell's Eun-Ah Kim group will build a reinforcement-learning compiler that translates quantum algorithms into atom movements and gate sequences for neutral-atom hardware, and set quantitative benchmarks for AI code search.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Eun-Ah Kim", "Cornell University", "reinforcement learning", "neutral-atom"], "conviction": "medium", "so_what": "Atom-shuttling compilation is a key neutral-atom bottleneck; RL compilers could improve QuEra's effective throughput.", "quote": null, "locator": "Within the consortium, Eun-Ah Kim's group at Cornell", "quote_verified": false}, {"claim": "ASQC will benchmark hybrid quantum-classical simulations of strongly interacting electrons in quantum materials as a target application.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Cornell University", "quantum materials", "hybrid quantum-classical"], "conviction": "medium", "so_what": "Strongly correlated electron simulation is a leading candidate for early quantum advantage in materials science.", "quote": null, "locator": "Within the consortium, Eun-Ah Kim's group at Cornell", "quote_verified": false}]}, {"theme": "AI results ASQC builds on", "insights": [{"claim": "Prior work by the ASQC team demonstrated neural-network decoders that reduced logical error rates by up to 17x.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["neural decoders", "quantum error correction"], "conviction": "high", "so_what": "AI decoders are delivering order-of-magnitude QEC gains — a tailwind for GPU-accelerated decoding (NVIDIA).", "quote": null, "locator": "The program builds on recent collaborations", "quote_verified": false}, {"claim": "Autonomous laser-locking routines developed with Anthropic's Claude restored drifted optical locks in 695 of 700 testbed trials, showing LLM agents can automate quantum lab operations.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Anthropic", "Claude", "laser locking"], "conviction": "high", "so_what": "LLM agents automating lab calibration could lower operating costs of neutral-atom systems and is a concrete AI-for-science use case for Anthropic.", "quote": "restored drifted optical locks in 695 of 700 testbed trials", "locator": "The program builds on recent collaborations", "quote_verified": true}, {"claim": "The ASQC team has also used large language model-driven quantum circuit discovery, in collaboration with Anthropic.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Anthropic", "large language models", "quantum circuit discovery"], "conviction": "medium", "so_what": "LLMs are being applied to quantum algorithm/circuit design, not just lab automation.", "quote": null, "locator": "The program builds on recent collaborations", "quote_verified": false}]}, {"theme": "Path to QuEra Libra on Braket", "insights"
