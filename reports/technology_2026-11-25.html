<script>
const REPORT_DATA = {"date": "2026-11-25", "generated_at": "2026-11-25T11:08:09.000Z", "stats": {"cards": 64, "insights": 719, "sources": 17, "quote_verified_pct": 100}, "cards": [{"record_id": "65839a56829d7b09", "source_type": "technology", "source_name": "Anyscale / Ray Blog", "source_url": "https://www.anyscale.com/blog/mid-epoch-resumption-ray-train", "title": "Enabling Mid-Epoch Training Resumption with Ray Train | Anyscale", "published_date": "2026-11-24", "language": "en", "processed_at": "2026-11-25T11:05:14Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech"], "gist": "Ray Train and Ray Data add mid-epoch resumption: the data loader checkpoints which row IDs each worker consumed alongside the model, so a restarted job resumes mid-epoch with exactly-once row coverage. In an ImageNet/ResNet-50 benchmark on 16 A100s with a failure at 75% of an epoch, it cut end-to-end runtime and cost by 9% versus skip-batch resumption; it ships in open-source Ray 2.61 and is already in the Anyscale Runtime from Ray 2.50.", "themes": [{"theme": "Cost of mid-epoch failures", "insights": [{"claim": "Restarting an epoch from the beginning after a mid-epoch training failure causes data imbalance, because previously consumed rows are trained on twice in the same epoch, skewing what the model learns.", "speaker": "Jason Li", "type": "causal", "entities": ["Ray Train", "Ray Data"], "conviction": "high", "so_what": "Fault recovery is a model-quality issue, not only a compute-cost issue, for large-scale training runs.", "quote": null, "locator": "The cost of mid-epoch training failures", "quote_verified": false}, {"claim": "The GPU cost of replaying an epoch after failure grows with epoch size: on a dataset that takes a day to traverse, a single late failure can cost another full day of GPU time.", "speaker": "Jason Li", "type": "causal", "entities": ["GPU"], "conviction": "high", "so_what": "Training-infra resilience features become more valuable as datasets and runs scale, supporting demand for fault-tolerant orchestration layers.", "quote": "on a dataset that takes a day to get through, a single late failure can cost another day of GPU time", "locator": "Both of these costs grow with the size of your epoch", "quote_verified": true}, {"claim": "Fast-forwarding past already-seen batches cannot guarantee exactly-once training with streaming loaders like Ray Data, because they process data on the fly without a guaranteed row order and skipped rows still need to be recomputed.", "speaker": "Jason Li", "type": "contrarian", "entities": ["Ray Data"], "conviction": "high", "so_what": "The common skip-batch workaround is both wasteful and incorrect for non-deterministic streaming pipelines.", "quote": null, "locator": "To avoid these costs, teams often fast-forward", "quote_verified": false}, {"claim": "Anyscale frames training infrastructure as increasingly judged by how quickly it recovers from failures, since training failures are increasingly common at scale.", "speaker": "Jason Li", "type": "thesis", "entities": ["Anyscale", "Ray Train"], "conviction": "medium", "so_what": "Recovery speed is positioned as a competitive axis for AI training platforms.", "quote": "effective training infrastructure is judged by how quickly it recovers from them", "locator": "Training failures are increasingly common at scale", "quote_verified": true}]}, {"theme": "Row-ID checkpointing design", "insights": [{"claim": "Ray Data's mid-epoch resumption tracks which specific rows were consumed (by unique row ID) rather than a position or batch count, because Ray Data does not hand out rows in a fixed order.", "speaker": "Jason Li", "type": "framework", "entities": ["Ray Data"], "conviction": "high", "so_what": "Set-based progress tracking is the design pattern that makes exactly-once resumption work for unordered streaming data loaders.", "quote": "The key idea is to track consumed rows rather than a position.", "locator": "How it works", "quote_verified": true}, {"claim": "With data checkpointing enabled, a background thread writes each yielded batch's row IDs to Parquet files in shared storage, organized by rank, epoch and checkpoint index; calling state_dict() returns a small JSON-serializable dictionary saved alongside model and optimizer state so the two are committed together.", "speaker": "Jason Li", "type": "framework", "entities": ["Ray Train", "Ray Data", "Parquet"], "conviction": "high", "so_what": "Coupling data-loader state to model checkpoints removes drift between what was trained and what the loader thinks was trained.", "quote": null, "locator": "Saving progress", "quote_verified": false}, {"claim": "On restore, Ray Data loads and sorts all consumed row IDs across ranks and filters them out right after the read via binary search, so skipped rows never reach preprocessing or the training loop, and the remaining rows are redistributed across whatever workers the restarted run has.", "speaker": "Jason Li", "type": "causal", "entities": ["Ray Data", "Ray Train"], "conviction": "high", "so_what": "Savings come from skipping preprocessing and transfer, and the design tolerates elastic worker counts after restart.", "quote": null, "locator": "Restoring progress", "quote_verified": false}, {"claim": "Mid-epoch resumption in Ray requires a unique, preprocessing-surviving row ID column (auto-generated IDs work only with Parquet), only row-preserving transformations such as map, map_batches and filter, shared cloud or network storage, and FailureConfig(max_failures=...) for automatic restarts.", "speaker": "Jason Li", "type": "data_point", "entities": ["Ray Train", "Ray Data", "Parquet"], "conviction": "high", "so_what": "Adoption constraints limit the feature for pipelines that expand rows or use non-Parquet data without native IDs.", "quote": null, "locator": "Requirements", "quote_verified": false}, {"claim": "Ray Data's iterator counts a batch as consumed once it is handed to the training loop, so frameworks that queue batches before training must drain the queue before checkpointing or the data checkpoint will run ahead of what the model actually trained on.", "speaker": "Jason Li", "type": "causal", "entities": ["Ray Data", "Ray Train"], "conviction": "high", "so_what": "A correctness caveat for teams integrating prefetching frameworks with Ray's data checkpointing.", "quote": null, "locator": "Finish consuming a batch before you checkpoint", "quote_verified": false}]}, {"theme": "Benchmark results", "insights": [{"claim": "In an Anyscale benchmark of ResNet-50 on a modified 1M-row ImageNet using 16 A100 GPUs plus 10 CPU nodes, with a simulated failure 75% through an epoch, mid-epoch resumption cut end-to-end time from 594 s to 542 s and cost from $1.45 to $1.32 (about 9%) versus skipping batches.", "speaker": "Jason Li", "type": "data_point", "entities": ["Anyscale", "ResNet-50", "ImageNet", "A100"], "conviction": "high", "so_what": "Modest 9% gain on a small benchmark; the vendor claims savings scale with epoch size and preprocessing weight.", "quote": null, "locator": "Evaluating the impact", "quote_verified": false}, {"claim": "Skipping batches to resume, which Hugging Face Transformers does by default, still reads, preprocesses and transfers every row before the restore point only to discard it, so mid-epoch resumption's savings grow with larger epochs and heavier preprocessing.", "speaker": "Jason Li", "type": "causal", "entities": ["Hugging Face Transformers", "Ray Data"], "conviction": "high", "so_what": "Positions Ray against the Hugging Face default for heavy-preprocessing workloads such as large images or multimodal data.", "quote": null, "locator": "Without mid-epoch resumption, skipping batches", "quote_verified": false}]}, {"theme": "Release and commercial packaging", "insights": [{"claim": "Mid-epoch resumption ships in open-source Ray starting with Ray 2.61 but has been available earlier in the commercial Anyscale Runtime starting with Ray 2.50.", "speaker": "Jason Li", "type": "data_point", "entities": ["Anyscale", "Ray", "Anyscale Runtime"], "conviction": "high", "so_what": "Anyscale uses early access to features in its paid runtime as a differentiator over open-source Ray.", "quote": null, "locator": "Mid-epoch resumption will ship with Ray 2.61", "quote_verified": false}]}], "insight_total": 12, "top_entities": ["Ray Train", "Ray Data", "Anyscale", "Anyscale Runtime", "ResNet-50", "ImageNet", "A100", "Hugging Face Transformers", "Parquet"], "source_meta": {"author": "Anyscale / Ray", "word_count": 1881, "paywalled": false}}, {"record_id": "1479a2d5f1158c80", "source_type": "technology", "source_name": "Ars Technica", "source_url": "https://arstechnica.com/ai/2026/11/whats-going-on-with-the-riemann-hypothesis/", "title": "What's going on with the Riemann hypothesis?", "published_date": "2026-11-24", "language": "en", "processed_at": "2026-11-25T11:07:37Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech"], "gist": "Levent Alpöge, a mathematician working at Anthropic, announced a Claude-generated proof of the Riemann hypothesis delivered both as Lean-verified formal code and a human-readable logic description; Timmer argues Lean has removed AI's hallucination bottleneck in math, but opaque AI proofs threaten the process-driven way mathematics has historically advanced.", "themes": [{"theme": "Claude's Riemann proof", "insights": [{"claim": "Levent Alpöge, a mathematician working at Anthropic, announced a proof of the Riemann hypothesis generated with Anthropic's Claude AI model.", "speaker": "John Timmer", "type": "data_point", "entities": ["Levent Alpöge", "Anthropic", "Claude", "Riemann hypothesis"], "conviction": "medium", "so_what": "A flagship frontier-math result attributed to Claude is a high-visibility capability signal for Anthropic versus rival AI labs.", "quote": null, "locator": "The proof of the hypothesis was announced", "quote_verified": false}, {"claim": "Alpöge's Riemann proof workflow had the AI first work on a simplified 'toy' form of his own insights and then directed it to expand the results to the full Riemann hypothesis, combining human intuition with machine-generated detail.", "speaker": "John Timmer", "type": "framework", "entities": ["Levent Alpöge", "Claude", "Riemann hypothesis"], "conviction": "medium", "so_what": "Human-directed AI scaling of toy problems is a template for how AI could be deployed on hard research problems in other fields.", "quote": null, "locator": "But it does make clear that this proof", "quote_verified": false}, {"claim": "The Riemann hypothesis bears on the distribution of prime numbers, giving it significance for fields from number theory to cryptography.", "speaker": "John Timmer", "type": "data_point", "entities": ["Riemann hypothesis", "cryptography", "number theory"], "conviction": "high", "so_what": "Watch whether the proof's content has any practical bearing on cryptography; so far mathematicians have barely begun digesting it.", "quote": null, "locator": "Tackling Riemann", "quote_verified": false}, {"claim": "The AI-generated Riemann proof comes in two forms: a Lean formalization enabling rapid machine verification of validity, and a description of the underlying logic that may matter more for the field.", "speaker": "John Timmer", "type": "data_point", "entities": ["Lean", "Riemann hypothesis"], "conviction": "high", "so_what": "Dual-output (formal + explanatory) is emerging as the standard format for credible AI-generated mathematics.", "quote": null, "locator": "The proof itself comes in two different forms", "quote_verified": false}, {"claim": "Mathematicians had barely started sifting through the Lean-expressed logic of the Riemann proof, and it may take years for humans to extract new insights and tools from it.", "speaker": "John Timmer", "type": "prediction", "entities": ["Riemann hypothesis", "Lean"], "conviction": "medium", "so_what": "Expect a long lag between AI-verified results and their absorption into human knowledge; headline claims will outrun understanding.", "quote": null, "locator": "Indeed, nobody can say anything much", "quote_verified": false}]}, {"theme": "Lean removes the hallucination bottleneck", "insights": [{"claim": "The Lean proof language lets AI-generated mathematical proofs be readily machine-verified, removing the need for extensive human validation that hallucination risk would otherwise require and shifting the effort/reward ratio of using AI in math.", "speaker": "John Timmer", "type": "causal", "entities": ["Lean", "large language models"], "conviction": "high", "so_what": "Formal verification layers are the key enabler turning unreliable LLM output into trustworthy results; analogous verifiers in code and other domains could unlock similar gains.", "quote": null, "locator": "AI models have also had one of their biggest limitations removed", "quote_verified": false}, {"claim": "AI models have advantages over human mathematicians in proofs: they are not specialized in one field and can combine tools across disciplines, and they pay no career or emotional cost for abandoning a wrong track and starting over.", "speaker": "John Timmer", "type": "thesis", "entities": ["AI", "mathematics"], "conviction": "medium", "so_what": "Cross-domain synthesis and cheap failure are the structural edges of AI research agents, relevant to valuing AI-for-science efforts.", "quote": null, "locator": "When it comes to proofs, AI might have some advantages", "quote_verified": false}, {"claim": "LLM-based systems have recently produced multiple major math breakthroughs, providing both formal proofs and counterexamples disproving proposals, leaving the field of mathematics in upheaval.", "speaker": "John Timmer", "type": "data_point", "entities": ["large language models", "mathematics"], "conviction": "high", "so_what": "AI capability in formal reasoning is advancing quickly, supporting the narrative of AI moving into high-value research work.", "quote": null, "locator": "Last week, news broke", "quote_verified": false}]}, {"theme": "Limits of AI math", "insights": [{"claim": "So far AI has only solved mathematical problems humans already recognized as significant; there is no indication AI can identify or formulate important unresolved problems on its own.", "speaker": "John Timmer", "type": "thesis", "entities": ["AI", "mathematics"], "conviction": "high", "so_what": "Problem selection remains a human moat; claims of autonomous AI research should be discounted until AI shows it can pose questions.", "quote": null, "locator": "Proof factories", "quote_verified": false}, {"claim": "Because neural networks are opaque and LLMs are selected for plausible-sounding text, asking an AI to explain its proof reasoning is likely to yield fabricated explanations, so AI proofs alone offer the field little in new ideas.", "speaker": "John Timmer", "type": "causal", "entities": ["large language models", "interpretability"], "conviction": "medium", "so_what": "Interpretability is a limiting factor on the scientific value of AI output, supporting demand for interpretability research.", "quote": null, "locator": "By contrast, the internal workings of large neural networks", "quote_verified": false}, {"claim": "Mathematics historically advanced more through the process of working out proofs—new tools, shortcuts, and related problems discovered along the way—than through the proofs themselves, a process AI-generated proofs bypass.", "speaker": "John Timmer", "type": "contrarian", "entities": ["mathematics", "AI"], "conviction": "medium", "so_what": "Efficiency gains from AI may hollow out the 'byproduct' innovation of human research; a second-order risk for AI-for-science narratives.", "quote": "the proof itself was often less important for math than the process of generating it", "locator": "But that was rarely the case.", "quote_verified": true}, {"claim": "Mathematicians have published a formal open letter expressing fears that nsights": [{"claim": "The Pacific Northwest produces more than 95 percent of US hops and about 40 percent of the global supply, so wildfire smoke taint there carries significant economic risk for beer brewing.", "speaker": "Jennifer Ouellette", "type": "data_point", "entities": ["Pacific Northwest", "hops", "beer brewing"], "conviction": "high", "so_what": "Hop supply is geographically concentrated; regional wildfires are a supply/quality risk for brewers.", "quote": null, "locator": "The 2020 Oregon wildfires burned", "quote_verified": false}, {"claim": "The 2020 Oregon wildfires burned over 1 million acres, killed 11 people, and produced smoke taint that damaged both local wine production and hops grown for brewing.", "speaker": "Jennifer Ouellette", "type": "data_point", "entities": ["Oregon", "wildfires", "wine", "hops"], "conviction": "high", "so_what": "Climate-driven wildfire events create agricultural quality losses beyond direct burn damage.", "quote": null, "locator": "The 2020 Oregon wildfires burned", "quote_verified": false}, {"claim": "Smoke taint in hops is caused mainly by volatile phenols, produced when lignin in plant cells is exposed to wildfire heat; smoke exposure during hop drying increased phenol uptake and gave hops meaty, smoky, artificial BBQ and medicinal notes that overpower citrus aromas.", "speaker": "Jennifer Ouellette", "type": "causal", "entities": ["volatile phenols", "hops", "Oregon State University"], "conviction": "high", "so_what": "Explains the mechanism of crop quality loss and why post-harvest drying conditions matter.", "quote": null, "locator": "Aroma therapy?", "quote_verified": false}]}, {"theme": "Brewing-stage mitigation", "insights": [{"claim": "Oregon State University's Thomas Shellhammer and Cade Jobe found that beers dry-hopped with smoke-tainted Cascade hops had volatile phenol concentrations and smoky/medicinal flavors that rose with the share of tainted hops used.", "speaker": "Jennifer Ouellette", "type": "data_ ng", "aviation"], "conviction": "exploratory", "so_what": "Ethanol-to-jet and marine-fuel pathways are the potential demand backstop for ethanol producers; watch offtakes and policy support in these segments.", "quote": null, "locator": "Demand: Shipping and aviation", "quote_verified": false}, {"claim": "Demand-side policies, particularly in the EU, restrict crop-based feedstocks, limiting the share of existing ethanol supply (largely corn and sugarcane based) that qualifies for shipping and aviation decarbonization uses.", "speaker": "Jade Patterson", "type": "causal", "entities": ["EU", "ethanol", "corn", "sugarcane", "shipping", "aviation"], "conviction": "high", "so_what": "Crop-based ethanol may not capture the new decarbonization demand in regulated markets like the EU, so the surplus may not be cleanly absorbed — a headwind for US corn and Brazilian sugarcane ethanol.", "quote": "certain demand-side policies, particularly in the EU, restrict crop-based feedstocks, limiting the share of existing ethanol supply that qualifies", "locator": "Demand: Shipping and aviation", "quote_verified": true}]}, {"theme": "Supply concentration in US and Brazil", "insights": [{"claim": "The US and Brazil accounted for 51% and 27% of global ethanol production respectively in 2025, remaining the dominant producers.", "speaker": "Jade Patterson", "type": "data_point", "entities": ["US", "Brazil", "ethanol"], "conviction": "high", "so_what": "Nearly four-fifths of global ethanol supply sits in two countries, so US and Brazilian policy and crop conditions drive global ethanol balances.", "quote": null, "locator": "Supply: The US and Brazil", "quote_verified": false}, {"claim": "Almost all US ethanol is produced from corn, while Brazilian ethanol relies significantly on sugarcane.", "speaker": "Jade Patterson", "type": "data_point", "entities": ["US", "Brazil", "corn", "sugarcane"], "conviction": "high", "so_what": "US ethanol is directly exposed to crop-based feedstock restriction acro"], "gist": "COP31 in Antalya ended nearly 50 hours late with the 'Antalya pact' cover decision rejected, agriculture talks collapsing (derailed partly by CBAM disputes), and few hard outcomes for food, forests, oceans and nature. Article 6 carbon-market rules stayed light-touch despite integrity flaws, adaptation finance targets were dropped, and forest/ocean finance pledges (e.g. TFFF at $8.2bn vs a $10bn target) fell short.", "themes": [{"theme": "Collapse of the Antalya pact", "insights": [{"claim": "The COP31 'Antalya pact' cover decision, proposed by the joint Turkish-Australian presidency, was rejected by at least 32 countries including the EU and UK in the closing plenary, after the summit ran nearly 50 hours over time.", "speaker": "Carbon Brief Staff", "type": "data_point", "entities": ["COP31", "EU", "UK", "Turkey", "Australia"], "conviction": "high", "so_what": "Multilateral climate process is producing weaker binding signals; policy-driven climate trades should lean on national/regional policy rather than UNFCCC outcomes.", "quote": null, "locator": "Cover decision", "quote_verified": false}, {"claim": "Parties failed to agree the COP31 cover text chiefly because all references to fossil fuels had been removed and it lacked concrete climate-finance targets.", "speaker": "Carbon Brief Staff", "type": "causal", "entities": ["COP31", "fossil fuels", "climate finance"], "conviction": "high", "so_what": "No new UN-level fossil-fuel phase-out language — removes a headline regulatory overhang for oil & gas from this cycle.", "quote": null, "locator": "Ultimately, parties did not find consensus", "quote_verified": false}, {"claim": "The rejected COP31 cover decision 'welcomed' carbon dioxide removal (including tree planting) immediately after recognising forests and oceans as greenhouse-gas sinks, worrying experts about offsetting via nature.", "speaker": "Carbon Brief Staff", "type": "thesis", "entities": ["carbon dioxide removal", "nature-based solutions"], "conviction": "medium", "so_what": "Signals rising political acceptance of CDR in UN texts — supportive for CDR developers if the language resurfaces at COP32.", "quote": null, "locator": "Experts, however, were concerned", "quote_verified": false}, {"claim": "No draft of the COP31 cover decision mentioned the COP17 biodiversity summit or the Kunming-Montreal Global Biodiversity Framework, reflecting 'toxic' politics over climate-nature synergies.", "speaker": "Carbon Brief Staff", "type": "data_point", "entities": ["Kunming-Montreal Global Biodiversity Framework", "COP17"], "conviction": "medium", "so_what": "Climate and biodiversity policy tracks remain siloed; nature-finance products tied to GBF get little UNFCCC tailwind.", "quote": null, "locator": "None of the iterations of the rejected cover decision", "quote_verified": false}, {"claim": "Food-systems advocates argued that language in COP cover decisions rarely translates into on-the-ground impact, making negotiation tracks a more effective lever than cover-text references.", "speaker": "Carbon Brief Staff", "type": "framework", "entities": ["ActionAid", "food systems"], "conviction": "medium", "so_what": "Discount headline COP cover-text wording when assessing real policy impact on agriculture.", "quote": "What we often find is that getting references or language to things in the cover decision doesn’t really play out as impacts on the ground", "locator": "However, observers told Carbon Brief", "quote_verified": true}]}, {"theme": "Agriculture talks derailed by CBAM", "insights": [{"claim": "UNFCCC agriculture negotiations (Sharm el-Sheikh joint work on agriculture) collapsed for the second year running at COP31, ending with only a procedural text punting substance to Bonn and COP32 in Ethiopia.", "speaker": "Carbon Brief Staff", "type": "data_point", "entities": ["SJWA", "UNFCCC", "COP32", "Ethiopia"], "conviction": "high", "so_what": "No multilateral agriculture-emissions framework is imminent; ag-sector climate regulation remains national.", "quote": null, "locator": "Agriculture and food security", "quote_verified": false}, {"claim": "The Arab group derailed COP31 agriculture talks by arguing fertilisers are vital to food security and that fertiliser exports are being hurt by the EU's carbon border adjustment mechanism (CBAM), demanding trade measures be discussed.", "speaker": "Carbon Brief Staff", "type": "causal", "entities": ["Arab group", "EU CBAM", "fertilisers"], "conviction": "high", "so_what": "CBAM is biting on fertiliser exporters enough to be weaponised in negotiations — watch fertiliser trade flows and CBAM exposure of Gulf/North African producers.", "quote": null, "locator": "However, in the first negotiating session", "quote_verified": false}, {"claim": "Observers said the underlying blocker in COP31 agriculture talks was not bad faith but developed countries' failure to deliver climate finance, leaving nothing in the negotiation for global-south countries.", "speaker": "Carbon Brief Staff", "type": "causal", "entities": ["Action Against Hunger", "climate finance", "global south"], "conviction": "medium", "so_what": "Finance shortfalls are the binding constraint on multilateral climate deals across tracks.", "quote": "The main issue is not bad-faith negotiating; it’s the fact that, across the UNFCCC, the countries that have a climate debt are not paying it", "locator": "Marie Cosquer, advocacy analyst", "quote_verified": true}, {"claim": "A fundamental rift persists over whether UNFCCC agriculture work should focus on adaptation only (India, G77 and China) or also pursue mitigation co-benefits (EU and others).", "speaker": "Carbon Brief Staff", "type": "framework", "entities": ["India", "G77 and China", "EU"], "conviction": "medium", "so_what": "Mitigation mandates on farming emissions (e.g. fertiliser, livestock) face structural opposition from large emerging markets.", "quote": null, "locator": "At the same time, said Camp", "quote_verified": false}]}, {"theme": "Carbon markets: Article 6 integrity", "insights": [{"claim": "Technical expert reviews of 16 national Article 6.2 carbon-trading reports found 543 inconsistencies, 115 of them significant, and no report was free of issues.", "speaker": "Carbon Brief Staff", "type": "data_point", "entities": ["Article 6.2", "carbon markets"], "conviction": "high", "so_what": "Integrity risk in sovereign bilateral carbon credits is material — price in reputational/reversal risk for ITMO buyers.", "quote": null, "locator": "Across 16 national reports checked so far", "quote_verified": false}, {"claim": "COP31 dropped draft language flagging Article 6.2 integrity problems with concern; the final decision merely 'takes note', leaving the bilateral carbon-trading 'wild west' untightened.", "speaker": "Carbon Brief Staff", "type": "causal", "entities": ["Article 6.2", "UNFCCC"], "conviction": "high", "so_what": "Light-touch Article 6.2 regime persists — favourable for deal volume (e.g. Singapore-Peru), negative for credit-quality assurance.", "quote": null, "locator": "However, this entire paragraph disappeared", "quote_verified": false}, {"claim": "IETA and the Project Developer Forum lobbied for a 'course correction' arguing Article 6.4 market rules are too conservative and failing to attract investment in carbon projects.", "speaker": "Carbon Brief Staff", "type": "thesis", "entities": ["IETA", "Project Developer Forum", "Article 6.4"], "conviction": "medium", "so_what": "Industry pressure to loosen Paris carbon market rules is real; supply growth in 6.4 credits depends on outcome of 2028 rules review.", "quote": "current version of [the market] is failing to attract investment in carbon projects", "locator": "On Article 6.4, negotiations began", "quote_verified": true}, {"claim": "After EU pushback, the final COP31 Article 6.4 text dropped a requested formal assessment of the 'cumulative impact' of conservative rules, only asking the supervisory body to consider how cture.", "quote": null, "locator": "Late on 21 November, an unbracketed text", "quote_verified": false}, {"claim": "The COP31 just transition text referenced critical minerals in a COP decision for the first time, but parties removed human-rights due diligence across critical-mineral supply chains.", "speaker": "Carbon Brief Staff", "type": "data_point", "entities": ["critical minerals", "Resource Justice Network"], "conviction": "medium", "so_what": "Critical minerals entering UNFCCC texts without due-diligence obligations — lower near-term compliance burden for miners, but a marker of rising scrutiny.", "quote": null, "locator": "Additionally, critical minerals were referenced", "quote_verified": false}, {"claim": "COP31's just transition work programme explicitly endorsed agroecological farming approaches, a first that food-systems advocates hailed as a landmark.", "speaker": "Carbon Brief Staff", "type": "data_point", "entities": ["agroecology", "just transition work programme"], "conviction": "medium", "so_what": "Gives policy legitimacy to agroecology, a mild headwind narrative for input-intensive agriculture (fertilisers, agrochemicals).", "quote": null, "locator": "Food-systems advocates were, however, heartened", "quote_verified": false}]}, {"theme": "Trade measures and response measures", "insights": [{"claim": "A first COP31 draft called on developed countries to phase out unilateral trade-restrictive measures, such as the EU CBAM and deforestation law, by end-2027, but all trade references were cut and none survived the conference.", "speaker": "Carbon Brief Staff", "type": "data_point", "entities": ["EU CBAM", "EU deforestation law"], "conviction": "high", "so_what": "CBAM and EUDR survive untouched by UNFCCC pressure — EU border carbon pricing continues on schedule.", "quote": null, "locator": "Trade and climate featured strongly", "quote_verified": false}, {"claim": "Russia, Brazil, Kenya, the Arab and African groups protested the treatment of trade a
