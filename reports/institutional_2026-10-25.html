<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Institutional Research</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #7c3aed;          /* purple — institutional report accent */
  --accent-soft: #f3eefc;
  --divergence: #d94052;      /* divergence red */
  --consensus: #15803d;       /* consensus green */
  --yellow: #fff5b3;

  /* category colors (institutional schema: rates, growth, fx, equities,
     credit, crypto, energy, commodities, geopolitics, ai_tech, em) */
  --cat-rates: #2563eb;
  --cat-growth: #d97706;
  --cat-fx: #0891b2;
  --cat-equities: #15803d;
  --cat-credit: #be185d;
  --cat-crypto: #8b5cf6;
  --cat-energy: #dc2626;
  --cat-commodities: #ea580c;
  --cat-geopolitics: #b91c1c;
  --cat-ai_tech: #4f46e5;
  --cat-em: #059669;
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 980px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 12px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* STATS BAR (top: period + coverage) */
.stats-top { margin-bottom: 16px; padding: 8px 12px; background: var(--surface);
             border: 1px solid var(--border); border-radius: 6px;
             font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
             color: var(--text-2); display: flex; gap: 16px; flex-wrap: wrap; }
.stats-top strong { color: var(--text); font-weight: 600; }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 10px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* THEME CARD (Section A) */
.theme { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.theme:last-child { border-bottom: none; }
.theme-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
              flex-wrap: wrap; }
.theme-title { font-weight: 600; font-size: 14.5px; }
.theme-stance { display: grid; grid-template-columns: 1fr; gap: 6px; margin-bottom: 10px; }
@media (min-width: 720px) { .theme-stance { grid-template-columns: 1fr 1fr; } }
.theme-line { font-size: 13px; padding: 8px 10px; border-radius: 4px;
              border-left: 3px solid var(--border); background: #fafafa; line-height: 1.5; }
.theme-line.consensus { border-left-color: var(--consensus); background: #f0f9f3; }
.theme-line.divergence { border-left-color: var(--divergence); background: #fdf6f7; }
.theme-line .lbl { font-family: 'IBM Plex Mono', monospace; font-size: 10px;
                   text-transform: uppercase; letter-spacing: .06em;
                   color: var(--text-3); display: block; margin-bottom: 2px; }
.theme-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
               border-left: 2px solid var(--border-light); }
.theme-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-source { font-weight: 600; color: var(--accent); }
a.item-source { text-decoration: none; }
a.item-source:hover { text-decoration: underline; }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-title { font-weight: 600; font-size: 14px; margin: 4px 0 6px; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DEEP READS (Section C) — purple left border to mark flagship long-form */
.section-deepreads .item-card { border-left: 4px solid var(--accent); background: var(--accent-soft); }

/* HOUSE VIEWS — compact one-line-per-source list */
.hv-row { display: flex; gap: 10px; align-items: baseline;
          padding: 6px 16px; border-bottom: 1px solid var(--border-light);
          font-size: 13px; }
.hv-row:last-child { border-bottom: none; }
.hv-name { font-weight: 600; color: var(--accent); min-width: 180px;
           text-decoration: none; }
.hv-name:hover { text-decoration: underline; }
.hv-stance { color: var(--text); flex: 1; }

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 110px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .hv-row { flex-direction: column; gap: 2px; }
  .hv-name { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "INSTITUTIONAL RESEARCH", "collected_at": "2026-10-25T03:01:51Z", "period": {"lookback_days": 10, "from": "2026-10-15", "to": "2026-10-25"}, "input_stats": {"total_articles": 380, "sources_present": 52, "after_filter": 150}, "summary": "**Rates / Fed:** Consensus is a **Fed on hold at the 28 Oct meeting (3.75-4.00% after the September hike)** with another hike in **December** (UBS, StanChart, BNY; CoinShares cites ~83% market odds). The split is magnitude: markets price **~3.5 further hikes / ~90bp over 12 months**, while **UBS** (two more: Dec + Mar, then hold; 10y YE target **4.9%**), **StanChart** (<60bp) and **Capital Economics** say that is too much, and **BlackRock's Rieder** doesn't see a 'long series' of hikes.\n\n**Oil / Iran:** Everyone agrees Gulf crude flows have mostly recovered but prices haven't (Brent **$112-113** on 22-23 Oct, 5-month high; Houthi strikes on Saudi infrastructure per RBC/UBS). **Goldman** sees Brent **$90 in Dec** and **$80 avg 2027** as a ~**$25** risk premium fades; **Capital Economics** has Brent staying near **$100 into early 2027** before **$70 by end-2027**.\n\n**AI trade:** The 22 Oct tech sell-off (**Nasdaq -2.6%, SOX -6.7%**) split houses. **UBS** says fundamentals are robust (AI capex **+33% to $1.2tn in 2027**; Q3 S&P EPS **+28%**) and only trims neoclouds; **Goldman's** trading desk describes a de-risking spiral (financing costs, power constraints, model-layer competition); **Capital Economics** doubts returns justify the spend, and **Vanguard** pushes active over passive AI exposure.\n\n**US growth / consumer:** Aggregate data are strong (**Franklin** 2026 GDP **2.5%**, GDPNow Q3 **3.6%**; **BofA** card spend **+6.2% y/y**) but **BlackRock** calls growth 'fractured' (computers ~1% of GDP, ~**27%** of growth; payrolls ex-healthcare ~**6k/month**) and housing is at record-weak levels (pending sales index **66.0**).\n\n**UK / Europe:** The BoE's MPC is split on how tight is tight enough (**Mann, Pill** voting to hike; **Taylor** says policy is already more than restrictive), while French spreads are the **widest since 2011** (Moody's). **BCA** is the contrarian with a structural **'Buy Europe'**; **Gavekal** calls France a gradual repricing, not (yet) an euro crisis.\n\n**US midterms (3 Nov):** **Amundi** expects a **split Congress** (Dem House, GOP Senate); **StanChart** (via Polymarket) leans to a **Democratic sweep** and flags tax/AI-policy risk, though opposition sweeps have historically delivered the best 12-month equity returns.\n\n**Credit:** **BCA** says fade credit concerns and favour quality, **Goldman** sees credit resilient, but **PIMCO** says software-loan 'optics improved, economics unchanged' (bids still ~**8 pts** below non-software) and **RBC** flags widening HY spreads as a risk for small caps.\n\n**Crypto:** **CoinShares** and **Galaxy** treat Bitcoin as rate-sensitive but resilient (BTC flat on the week to 23 Oct; a surprise October Fed hike is the flagged risk); no major house is calling a break either way.", "sections": {"A_debates": [{"theme": "Rates & the Fed (US)", "category": ["rates"], "consensus": "The Fed (policy rate 3.75-4.00% after a 25bp September hike) is widely expected to hold on 28 October and hike again in December: UBS CIO, StanChart, BNY and Franklin Templeton all frame October as a pause, CoinShares quotes CME/Polymarket odds of ~12-17% for an October hike (down from 40%+ after the hot CPI) and ~83% for December. Hot September data (CPI +0.6% m/m, 3.7% y/y; core 2.6%; PPI +1.3% m/m, 6.3% y/y) are the common starting point, and 10y yields peaked around 5.3% on 5-6 October before easing to ~4.95-5.1%.", "divergence": "The split is over how many hikes follow. Markets price roughly 3.5 further hikes (~90bp over 12 months). UBS CIO expects only two more (Dec and Mar) then a hold until late 2027, with a 10y year-end target of 4.9% (from 4.6%) and cites Fed speakers Williams, Jefferson and Daly urging no urgency. StanChart also expects less than the ~60bp priced for the Fed and ECB, as oil disinflation arrives in H2 2027; Capital Economics likewise says the Fed, ECB and BoE will tighten but by less than priced. BlackRock's Rieder argues a long hiking series isn't needed because tightening bites in housing and credit cards (90-day card delinquencies 12.9%) but not in AI capex or energy, noting the Fed's median dot implies two 2026 hikes (4.125%), +50bp higher in 2027-28 and a cut only in 2028. BNY is more hawkish on process: it expects at least one more 2026 hike and a hawkish tone from Chair Warsh, who rejects forward guidance and may prefer less frequent moves. Gavekal's Kaletsky argues bonds are trading Fed expectations rather than inflation, so the sell-off was over-extended. Apollo's Slok (on UBS) lists three inflation tailwinds: oil, delayed tariff pass-through and immigration restrictions.", "items": [{"source": "ubs", "name": "UBS CIO", "thesis": "Expects Fed hikes in Dec and Mar (two more, vs ~3.5 priced), then hold until late 2027; raises 10y UST YE-2026 forecast to 4.9% from 4.6%. Fixed income rated Attractive; market pricing 'too hawkish'. Sept payrolls 29k (3m avg 51k), ISM mfg 54.5.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-15102026.html", "images": []}, {"source": "bny", "name": "BNY", "thesis": "'Climbing up the learning curve': Warsh avoids forward guidance, trusts markets, worries less about high-frequency data; BNY expects at least one more 2026 hike, a hawkish skew and uncertain cadence.", "url": "https://www.bny.com/investments/us/en/individual/articles/markets-and-economy/fed-thoughts-climbing-up-the-learning-curve.html", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "thesis": "After hot CPI/PPI, fed funds futures went to a 50/50 October hike then back to 27%; market sees three hikes by Dec 2027 (3.5 right after CPI). Real avg hourly earnings -0.7% y/y. October pause most likely.", "url": "https://www.franklintempleton.com/articles/en/2026/10/flash-insights-resilient-growth-sticky-inflation", "images": []}, {"source": "blackrock_investment_institute", "name": "BlackRock (Rick Rieder)", "thesis": "Warsh says policy 'not restrictive'; SEP core PCE 2026 revised to 3.4%. Rieder: acyclical inflation (energy, insurance, healthcare) won't respond to rate hikes, so a long series isn't warranted.", "url": "https://www.blackrock.com/us/individual/insights/cio-perspective-asking-better-questions", "images": []}, {"source": "gavekal", "name": "Gavekal (Kaletsky)", "thesis": "10y yield peaked 5.31% on 6 Oct and fell to 5.09% despite 'shockingly bad' CPI/PPI: bond prices driven almost exclusively by Fed expectations.", "url": "https://research.gavekal.com/teaser/why-bonds-respond-to-the-fed-not-to-inflation/", "images": []}, {"source": "capital_economics", "name": "Capital Economics", "thesis": "Fed/ECB/BoE to tighten, but by less than markets price; core inflation to stay below 3% in major DMs and fall toward 2% by end-2027.", "url": "https://www.capitaleconomics.com/blog/inflation-outlook-and-bond-market-sell", "images": []}]}, {"theme": "Bonds & Duration Positioning", "category": ["rates"], "consensus": "Higher yields have made high-quality fixed income attractive again: UBS CIO keeps Attractive on quality bonds, Vanguard says 'the case for fixed income has strengthened' (munis at their best yields since 2008), BlackRock's Rieder notes a diversified portfolio can yield >7% with <3 years of duration at an average A- rating, and PIMCO says starting book yields of 6-8% are highly predictive of five-year returns.", "divergence": "They differ on duration. PIMCO (Ivascyn, with a PIMCO generalist PM on UBS Trending) argues for owning somewhat more duration, globally diversified, as protection against an AI-capex shock and a flight-to-quality rally, calling the recent price action technical and deleveraging-driven. BlackRock's Rieder emphasises carry with short duration (<3y) while asking how fast to add duration as supply and fiscal pressure persist. StanChart took profits, closing its opportunistic US 10-year idea, and prefers 3-7y DM investment grade and AUD bonds. BCA says EM local bonds face near-term turbulence (inflation, risk aversion, FX) but advises using the sell-off to build exposure, and is bullish Canadian bonds because it doesn't expect the 100bp of BoC hikes markets price.", "items": [{"source": "pimco", "name": "PIMCO", "thesis": "Ivascyn: 'many ways to win' in rate volatility; price action reads as technical/deleveraging; a bit more, globally diversified duration hedges flight-to-quality scenarios.", "url": "https://www.pimco.com/us/en/archive/insights/podcasts/accrued-interest/many-ways-to-win-dan-ivascyn-on-making-the-most-of-rate-volatility", "images": []}, {"source": "ubs", "name": "UBS CIO (Trending)", "thesis": "With UST 10y ~5.25% (real ~3%) and 6-8% yields on high-quality portfolios, allocation to fixed income 'should be higher'; Fed seen hiking again in December.", "url": "https://www.ubs.com/us/en/wealth-management/insights/ubs-studios/2026/positioning-across-fixed-income.html", "images": []}, {"source": "vanguard", "name": "Vanguard", "thesis": "Q4 fixed income: yield rise driven more by real yields; MBS underperformed, record muni issuance lifted tax-exempt yields to the highest since 2008.", "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/active-fixed-income-perspectives-q4-2026-looking-through-fog.html", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "EM domestic bonds: turbulence before an opportunity; Canada: own bonds now, CAD and resource stocks multi-year winners.", "url": "https://www.bcaresearch.com/reports/em-domestic-bonds-turbulence-opportunity-16-10-2026/227221", "images": []}, {"source": "federal_reserve", "name": "Federal Reserve (FEDS Note)", "thesis": "Government bonds' safe-haven property depends on the shock type: in an inflationary supply shock (March 2026) bonds sold off with stocks.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/government-bonds-safe-haven-property-and-inflationary-pressures-20261016.html", "images": []}]}, {"theme": "Global Central Banks (BoE, ECB, BoJ, BoC)", "category": ["rates"], "consensus": "Central banks are leaning hawkish on the energy shock. StanChart expects the Fed, ECB and BoJ to hold next week after September hikes and hike in December, with the BoE, BoC and RBNZ each seen hiking 25bp within two weeks; BoE officials (Lombardelli) say policy is already restrictive and will tighten further if needed (Bank Rate 3.75%, 2-year fixed mortgage rates >1pt higher since the conflict began). The BoE also announced a new QT chapter (Ramsden): the APF is down >£400bn from a £895bn peak to ~£488bn.", "divergence": "The BoE MPC is openly split. Mann says policy is 'not sufficiently tight' and voted for 25bp hikes at the last two meetings, arguing the MPC cannot rely on a higher nominal curve alone and needs to follow through with Bank Rate rises. Pill likewise supports hiking (to 4%) for clear, prompt action so Middle East price pressure doesn't embed. Greene challenges the comfort of labour-market slack, questioning whether it will contain wages and second-round effects. Taylor is the dove: both Bank Rate and the OIS curve are already substantially restrictive against his estimate of neutral at 2.75-3.0%, and his Taylor-rule estimate for the UK falls to 3.5% by 2Q27. Outside the UK, BCA says the BoC will not hike 100bp (markets do) and RBC calls October a close call; StanChart thinks the RBA is near the end of its cycle (hiked four times this year).", "items": [{"source": "boe", "name": "Bank of England (Mann)", "thesis": "Financial conditions: UK markets price greater risk premia since the conflict intensified; current stance 'not sufficiently tight'; voted for +25bp at the last two meetings.", "url": "https://www.bankofengland.co.uk/speech/2026/october/catherine-mann-nomura-investor-conference", "images": []}, {"source": "boe", "name": "Bank of England (Taylor)", "thesis": "'Searching for signposts': policy stance and OIS curve substantially restrictive vs neutral 2.75-3.0%; risk is persistence via expectations/second-round effects.", "url": "https://www.bankofengland.co.uk/speech/2026/september/searching-for-signposts-speech-by-alan-taylor", "images": []}, {"source": "boe", "name": "Bank of England (Greene)", "thesis": "Does labour market slack contain second-round effects of the energy shock? Greene challenges the argument using a range of wage indicators (20 Oct).", "url": "https://www.bankofengland.co.uk/speech/2026/october/megan-greene-speech-at-lse-economics-society-london", "images": []}, {"source": "boe", "name": "Bank of England (Pill)", "thesis": "'Homophones': explains support for raising Bank Rate to 4%; prompt, decisive action and communication to avoid embedding (3 Sep).", "url": "https://www.bankofengland.co.uk/speech/2026/september/remarks-at-the-edinburgh-chamber-of-commerce", "images": []}, {"source": "boe", "name": "Bank of England (Lombardelli)", "thesis": "Outlook for inflation: near-term inflation driven by global energy; policy already leaning against persistence and will tighten further if needed (24 Sep).", "url": "https://www.bankofengland.co.uk/speech/2026/september/clare-lombardelli-speech-at-the-sixth-biennial-conference-poland", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Fed/ECB/BoJ hold next week, hike in Dec; BoE, BoC, RBNZ seen hiking 25bp; RBA near end (60% odds of a hike on 3 Nov); AUD supported by cash rate 60bp above the Fed.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-23-10-2026/?mvog=1", "images": []}]}, {"theme": "Energy, Oil & the Iran War", "category": ["energy", "commodities", "geopolitics"], "consensus": "Gulf supply has largely adapted (Goldman: Persian Gulf crude exports back near 2025 average since late September incl. ~4 mb/d 'dark' barrels; UBS: OPEC output 85% of February level, G7 emergency stock release) yet prices are high because of escalation risk, record-low inventories and portfolio hedging demand. Brent hit $112-113/bbl on 22-23 Oct on Houthi attacks on Saudi airports and Aramco (RBC, UBS), and UBS notes NYT reports of US/Israeli plans for renewed strikes on Iran after the 3 Nov midterms. Everyone sees lower prices in 2027.", "divergence": "The disagreement is over how fast the premium fades. Goldman (Struyven) sees Brent at $90 in December (up from $85) and $80 average in 2027 as the market swings to surplus in Q4-2026/2027, with a ~$25 risk premium in spot, though dated Brent is >$130 and refined-product exports are only ~40% of 2025 levels; he also expects copper +10% by end-2027 and higher gold. Capital Economics keeps Brent around $100 into early 2027 with elevated refining margins, pushing global inflation above 4% before Brent falls to $70 by end-2027 and European gas to EUR40/MWh. BCA stresses a persistent energy shock plus a 'super' El Nino as the setup for the next agriculture rally (a correction, not a top). Oxford Economics notes 10y UST >5% for the first time since 2007 and is running escalation scenarios.", "items": [{"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Brent $90 Dec-2026, $80 avg 2027; risk premium ~$25; surplus in Q4-26/2027 is the 'key driver' of lower prices; escalation is net upside risk.", "url": "https://www.goldmansachs.com/insights/articles/will-oil-prices-decline-as-middle-east-supply-recovers", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs (Exchanges)", "thesis": "Why prices surge despite recovering supply: precautionary physical buying, portfolio hedging via crude, refined products ~40% of 2025 levels; copper +10% by end-2027.", "url": "https://www.goldmansachs.com/insights/goldman-sachs-exchanges/why-oil-prices-are-surging-despite-recovering-supply", "images": []}, {"source": "capital_economics", "name": "Capital Economics", "thesis": "Brent ~$100 into early 2027, $70 by end-2027; global inflation 2.6% (Jan) to 3.6% (Aug), >4% early 2027.", "url": "https://www.capitaleconomics.com/blog/inflation-outlook-and-bond-market-sell", "images": []}, {"source": "rbc", "name": "RBC Capital Markets", "thesis": "Iran war's second front: Houthi attacks on Saudi airports and Aramco HQ (Dhahran), East-West pipeline targeted; key question is whether Washington stays out.", "url": "https://www.rbccm.com/en/insights/2026/10/escalating-middle-east-tensions-amplify-energy-supply-risks", "images": []}, {"source": "ubs", "name": "UBS CIO", "thesis": "Brent $112/bbl first time since May (+9.4% in October); Saudi attacks, US diplomats ordered out; geopolitics rarely a reason to stop investing (S&P higher 12m later ~75% of the time).", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-22102026.html", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "thesis": "Base metals: >250 GW data-centre pipeline and geopolitical supply shocks collide; transmission/power can need 3-4x more metal than the data centres themselves.", "url": "https://www.woodmac.com/press-releases/wood-mackenzie-geopolitical-supply-shocks-and-ai-power-crunch-collide-across-global-base-metals/", "images": []}]}, {"theme": "AI Trade & Tech Earnings", "category": ["ai_tech", "equities"], "consensus": "Everyone agrees the AI trade is being re-priced on financing costs and monetization after a violent week (Nasdaq -4.5% on the week to 16-17 Oct, then -2.6% on 22 Oct with SOX -6.7%, Meta -7% on capex), and that the debate has shifted from whether AI drives earnings to whether returns justify the capital. Neoclouds (CoreWeave etc.) are the weak link for UBS, Gavekal and Goldman alike.", "divergence": "UBS CIO is constructive: AI demand is robust, compute supply constrained, AI capex to grow 33% to $1.2tn in 2027 with neoclouds <10%, hyperscalers borrow at 6.5-7% against ~25% ROIC, and Q3 S&P EPS should rise 28% (semis ~half of growth). Goldman's equity trading desk (Privorotsky) describes the opposite dynamic: a crowded 'long AI, short everything else' trade unwinding on cost-of-capital spillovers, constrained power (20-40-50 GW energisation gap next year) and model-layer competition, with bonds rallying as growth expectations fall. Capital Economics is optimistic on productivity but finds it 'harder to see' how returns justify the investment surge. Vanguard argues chasing AI-chain winners risks buying high and favours active, non-tech AI adopters; Franklin Templeton (AI ecosystem ~55% of US market cap) calls AI a capital cycle, not a bubble, but says July's hidden momentum reversal showed how fragile positioning is. PIMCO's risk is deceleration, not bust: growth depends on the change in spending, so even high capex fades as a growth impulse. Gavekal (Dragonomics) notes Anthropic's latest quarterly revenue growth disappointed some investors, and argues China cannot overtake US AI even if the US stumbles.", "items": [{"source": "ubs", "name": "UBS CIO", "thesis": "AI fundamentals remain robust despite volatility; limit neoclouds, favour well-funded hyperscalers; Q3 cloud revenue growth forecast to accelerate to 58% from 48%.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-19102026.html", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs (Markets podcast)", "thesis": "Why investors are reducing AI exposure: financing cost spillover, power bottlenecks, competition; 'seismic shift' from savings glut to spending glut.", "url": "https://www.goldmansachs.com/insights/the-markets/why-investors-are-reducing-ai-exposure", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "AI boom bigger for US demand than GDP (high import content); >$1tn US tech capex in 2026 and ~$1.5tn after; key risk is deceleration.", "url": "https://www.pimco.com/us/en/insights/the-ai-investment-boom-goes-beyond-america", "images": []}, {"source": "vanguard", "name": "Vanguard", "thesis": "Navigating the AI hype cycle: case for active; semis' rolling 3-year outperformance may echo prior tech cycles (semis ETFs -10.2% in October to the 16th).", "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/vemo/navigating-the-ai-hype-cycle-a-case-for-active.html", "images": []}, {"source": "gavekal", "name": "Gavekal", "thesis": "Anthropic revenue disappointment, Meta raises 2026 capex guidance; higher yields unlikely to damage US profits significantly.", "url": "https://research.gavekal.com/teaser/higher-yields-and-corporate-profits/", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "Week 43: Nvidia's Huang says capital availability constrains neocloud expansion; 10y fell below 5% as VIX and MOVE spiked.", "url": "https://coinshares.com/insights/research-data/equities-update-23-10-2026/", "images": []}]}, {"theme": "US Growth, Consumer & Earnings", "category": ["growth", "equities"], "consensus": "US aggregate activity is resilient: Franklin sees 2026 GDP at 2.5% (consensus 2.2%), GDPNow Q3 at 3.6%; BofA card spending per household +6.2% y/y in September; retail sales +0.8% m/m; claims ~194-199k; the IMF raised 2026 global growth to 3.1% (2027: 3.4%) with global inflation 4.7% in 2026 (BNP/Amundi). Q3 earnings are expected to be historically strong (UBS: S&P EPS +28%; StanChart: consensus tech EPS >60% y/y; NDR: 85.5% beat rate in Q2).", "divergence": "The disagreement is over quality of growth. BlackRock's Rieder says it is 'strong headline, fractured underneath': profits growing like 7% nominal GDP, but computers (~1% of GDP) delivered ~27% of recent growth, the hires rate is the lowest since 2010 and ex-healthcare payrolls average ~6k/month, with housing in 'something resembling a recession'. Franklin flags real hourly earnings -0.7% y/y and growth concentrated in higher-income households; CoinShares cites homebuilder confidence 29 (lowest since 2012) and a record-low pending home sales index at 66.0. UBS counters that growth near 3% in Q3 and a 3-month payroll average of 51k are enough to keep unemployment stable. BNP AM's Morris cautions that tech provides ~two-thirds of global earnings growth this quarter, while median growth ex-tech/energy is only 7%, a sign of fragility; Oxford expects a bifurcated holiday season (retail sales +4.2% nominal, +2.2% real).", "items": [{"source": "bofa", "name": "BofA Institute", "thesis": "Consumer Checkpoint (Oct): card spend per household +6.2% y/y (5.1% ex-gas), third strongest in four years; employment report shows deposit-based job growth softening to 1.4% y/y.", "url": "https://institute.bankofamerica.com/economic-insights/consumer-checkpoint-october-2026.html", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "thesis": "A critical earnings season approaches: tech nearly two-thirds of global profit growth; energy 20%; MOVE back to Iran-war-start levels while VIX near lows.", "url": "https://viewpoint.bnpparibas-am.com/view-from-the-markets-a-critical-earnings-season-approaches/", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "thesis": "From the US Market Desk: hot inflation, cold chips, stay diversified; 2-year 4.95%, 10-year 5.33% post-CPI, then 5.08%.", "url": "https://www.franklintempleton.com/articles/en/series/from-the-market-desk", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "US holiday retail sales +4.2% nominal, +2.2% real; bifurcated consumer with high-income households supported by equity gains.", "url": "https://www.oxfordeconomics.com/resource/us-holiday-cheer-at-a-higher-price/", "images": []}, {"source": "ned_davis_research", "name": "Ned Davis Research", "thesis": "Chart of the Week: Q2 beat rate of 85.5% sets a high bar; focus shifts to 2027 guidance and how much growth decelerates.", "url": "https://info.ndr.com/ndr-signals/all-eyes-on-earnings-season?hsLang=en", "images": []}]}, {"theme": "Credit", "category": ["credit"], "consensus": "Credit has held up despite higher rates (Goldman credit trading: steady rate rises have historically been seen as opportunities; Vanguard: credit well supported by fundamentals; BNP AM: euro credit fundamentals supportive), but all agree dispersion is rising as AI-related issuance and funding costs separate durable cash flow from debt-reliant growth (JPM).", "divergence": "BCA is the most relaxed: credit spreads widened but stress is narrow and valuations have compressed, so fade the concern and lean into quality (large over small caps). PIMCO sees only cosmetic improvement in software loans: spreads retraced about one-third of this year's widening and sit ~100bp inside June wides, but have widened again since early September and bids remain ~8 points below non-software peers (vs ~10 in June). RBC flags the recent widening in high-yield spreads as a new point of concern for small caps. The Fed's own FEDS note adds private credit to the Financial Accounts, and Goldman's equity desk lists triple-C and sovereign spread widening as symptoms of the cost-of-capital spillover.", "items": [{"source": "pimco", "name": "PIMCO", "thesis": "The Credit Market Lens: improved optics, unchanged economics in software loans (>10% of the leveraged loan index); dispersion to stay high.", "url": "https://www.pimco.com/us/en/insights/the-credit-market-lens-improved-optics-but-unchanged-economics-in-software-loans", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "Fade credit concerns, favour quality: 10 things ahead of earnings season.", "url": "https://www.bcaresearch.com/reports/fade-credit-concerns-favor-quality-10-things-we-are-thinking-ahead-earnings-season-19-10-2026/227223", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "How higher rates and AI issuance are affecting credit markets (Finston): resilient credit; hot CPI then falling yields reflects the AI-growth interplay.", "url": "https://www.goldmansachs.com/insights/the-markets/how-higher-rates-and-ai-issuance-are-affecting-credit-markets", "images": []}, {"source": "jpmorgan", "name": "J.P. Morgan", "thesis": "Credit markets look for AI's weak links: the 'AI' label alone is no longer enough for lenders.", "url": "https://www.jpmorgan.com/insights/markets-and-economy/top-market-takeaways/tmt-credit-markets-look-for-ais-weak-links", "images": []}, {"source": "rbc", "name": "RBC Capital Markets", "thesis": "Caveats and risks: soft start to 3Q26 earnings stats, investors neutral with nervousness, HY spread widening a concern for small caps.", "url": "https://www.rbccm.com/en/insights/2026/10/caveats-and-risks", "images": []}]}, {"theme": "Europe & France", "category": ["equities", "rates", "geopolitics"], "consensus": "French sovereign stress is the main European worry: Moody's Analytics headlines French spreads as the widest since 2011, Gavekal sees a gradual repricing of France's sovereign signature rather than a new crisis, and StanChart closed its European CoCo trade on French political risk. Structural stories (defence, energy, strategic autonomy) are widely seen as supportive: BNP AM cites ~EUR1.8tn of investment expected under Europe's strategic autonomy drive.", "divergence": "BCA (Papic, Savary) goes against the grain with 'Buy Europe': despite '99 problems', bearish views are crowded, European assets have outperformed the US for two years, and structural reform in services is about to unlock value; BCA also favours European integration winners in its screener. Gavekal's Gave takes a different contrarian angle: the rising cost of funding government debt will be Western politicians' first concern, so the EU's protectionist turn (Chinese hybrid-car curbs) is fighting the last war; Gavekal's Gemehl says the probability of a euro-crisis rerun is low today but conditions can change. Goldman reports German exports rebounding on US, EU and AI-buildout demand.", "items": [{"source": "bca_research", "name": "BCA Research", "thesis": "Buy Europe: structural reform to unlock services; challenges understood or priced in.", "url": "https://www.bcaresearch.com/reports/buy-europe-20-10-2026/227240", "images": []}, {"source": "moodys_analytics", "name": "Moody's Analytics", "thesis": "Europe Daily Briefing: French spreads widest since 2011 (headline only; body text not captured).", "url": "https://www.economy.com/economicview/analysis/424255/Europe-Daily-Briefing-French-Spreads-Are-Widest-Since-2011", "images": []}, {"source": "gavekal", "name": "Gavekal", "thesis": "What would it take for another euro crisis? Good reasons for low probability now; identifies conditions that would raise it.", "url": "https://research.gavekal.com/teaser/what-would-it-take-for-another-euro-crisis/", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "thesis": "European strategic autonomy: a EUR1.8tn investment opportunity (defence, energy, tech, healthcare).", "url": "https://viewpoint.bnpparibas-am.com/talking-heads-european-strategic-autonomy-a-e1-8-trillion-investment-opportunity/", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "German exports rebound amid demand from the US, EU and AI buildout.", "url": "https://www.goldmansachs.com/insights/articles/german-exports-rebound-amid-demand-from-the-us-eu-and-ai-buildout", "images": []}]}, {"theme": "US Politics: Midterms (3 Nov)", "category": ["equities", "geopolitics"], "consensus": "A Democratic House is largely priced in; both Amundi and StanChart expect divided or opposition-controlled government to limit major fiscal change, and see AI/IT, industrials and materials as sector beneficiaries of continued capex.", "divergence": "Amundi's base case is a split Congress (Democrats take the House, Republicans keep the Senate), preserving policy continuity, though it calls a Democratic sweep 'also very likely' and says a Republican hold of both chambers is very unlikely; it warns the president may pivot to a more interventionist foreign policy, and that a Republican rebound could still surprise markets. StanChart leans harder on prediction markets (Polymarket) favouring Democrats in both chambers: opposition sweeps have historically delivered the best 12-month equity returns, but a decisive 'blue wave' raises longer-term risk of higher taxes and uncertainty about AI/data-centre policy.", "items": [{"source": "amundi", "name": "Amundi", "thesis": "US midterms: fiscal gridlock on the horizon? House 220R-215D, Senate 53R-45D-2I; sector effects: IT supported, industrials/materials benefit, energy mixed.", "url": "https://research-center.amundi.com/article/us-midterm-elections-fiscal-gridlock-horizon", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Charts of the week: consensus Q3 S&P earnings by sector and Polymarket odds of Democratic control.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-23-10-2026/?mvog=1", "images": []}, {"source": "deutsche_bank", "name": "Deutsche Bank Wealth Mgmt", "thesis": "EMEA CIO Steffen: market wary into midterms and earnings season amid tech and bond volatility.", "url": "https://wealth.db.com/en/insights/investing-insights/cio-weekly-investment-outlook-podcast.html", "images": []}]}, {"theme": "Crypto & Digital Assets", "category": ["crypto"], "consensus": "Bitcoin is trading as a rate-sensitive risk asset that has held up better than equities: CoinShares notes BTC unchanged on the week to 23 Oct after $434M of ETP outflows in the week to 16 Oct; Galaxy's lending note shows BTC bottoming near $58k in June, +25% in August to >$82k early September, then ~$76k on 16 Sep, with ETF flows +$3.52B in August after -$4.5B in June.", "divergence": "There is little real disagreement; the nuance is on risk. CoinShares argues a surprise October Fed hike would hurt BTC more than a signalled December move because it would tighten conditions abruptly, and that markets want 'a much higher bar' than AI narratives. Galaxy highlights flows and the long-end (Treasury buybacks, weaker dollar) as the August catalyst and notes the CLARITY Act failed to advance. Franklin Templeton says quantum computing won't kill crypto and could accelerate Wall Street's adoption of blockchain. CoinShares also finds stablecoin supply flat ($305.83B, -0.8% vs March), making deposit flight a multi-year, not near-term, bank risk. Delphi Digital's titles (e.g. 'The Worst Is Behind Us', 'The House Always Wins') imply a constructive-but-speculative framing; body text was not captured.", "items": [{"source": "coinshares", "name": "CoinShares", "thesis": "Market update 23 Oct: housing weakness buys the Fed time, inflation takes it back; Dec hike ~83%.", "url": "https://coinshares.com/insights/research-data/market-update-23-10-2026/", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "Stablecoins and banks: $6.6T of US transactional deposits exposed; supply is 4.6% of that; a margin risk rather than funding shock so far.", "url": "https://coinshares.com/insights/research-data/the-four-ways-stablecoins-reach-an-equity-portfolio/", "images": []}, {"source": "galaxy_digital", "name": "Galaxy", "thesis": "Crypto markets recover as rates and lending conditions shift.", "url": "https://www.galaxy.com/insights/perspectives/crypto-markets-recover-as-rates-and-lending-conditions-shift", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "thesis": "Quantum won't kill crypto, but could accelerate Wall Street's adoption of blockchain.", "url": "https://www.franklintempleton.com/articles/en/2026/10/quantum-wont-kill-crypto-but-it-could-accelerate-wall-streets-adoption-of-blockchain", "images": []}]}, {"theme": "China, Trade & Geopolitics", "category": ["geopolitics", "em"], "consensus": "Trade tensions with China have eased on paper (mutual tariff cuts after the leaders' summit, per Gavekal) but structural conflict persists: the US has a new Section 301 probe on 'structural excess capacity' and Brookings notes overcapacity concerns are now broadly shared. The CCP plenum runs 26-29 Oct (Brookings preview). Citi's IMF takeaways: fiscal and yield pressures, varied central bank reactions and growing AI impact.", "divergence": "Gavekal (Dragonomics) says tariffs are not working: US Customs shows imports from China/HK of $276bn (down from $550bn in 2018) but this decoupling is overstated by fraud and re-routing. Gavekal's Gave notes Chinese equities have fallen ten straight weeks despite global AI enthusiasm. BCA is bullish on EM local bonds after near-term turbulence, while BNP AM notes EM semiconductor/tech stocks are 28% below their July peak but +47% year-to-date. PIIE's Wolff argues the US should consider allowing Chinese EV production in America under conditions, a minority policy view.", "items": [{"source": "gavekal", "name": "Gavekal Dragonomics", "thesis": "The fruit of tariffs is fraud: official US-China imports halved since 2018 overstate real decoupling.", "url": "https://research.gavekal.com/teaser/the-fruit-of-tariffs-is-fraud/", "images": []}, {"source": "brookings", "name": "Brookings", "thesis": "Do we finally agree on overcapacity? Now what? (22 Oct).", "url": "https://www.brookings.edu/articles/do-we-finally-agree-on-overcapacity-now-what/", "images": []}, {"source": "brookings", "name": "Brookings", "thesis": "Xi's party: what to look for at the CCP plenum (26-29 Oct).", "url": "https://www.brookings.edu/articles/xis-party-what-to-look-for-at-the-upcoming-chinese-communist-party-plenum/", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "thesis": "Why have EM tech stocks been so volatile? Index 28% below July peak, +47% YTD.", "url": "https://viewpoint.bnpparibas-am.com/view-from-the-markets-why-have-emerging-market-tech-stocks-been-so-volatile/", "images": []}, {"source": "peterson_institute", "name": "PIIE", "thesis": "Policy brief: US could allow Chinese EV production in America under conditions.", "url": "https://www.piie.com/publications/policy-briefs/2026/us-should-consider-allowing-chinese-production-electric-vehicles", "images": []}]}], "B_calls": [{"source": "goldman_sachs", "name": "Goldman Sachs", "call": "Brent $90/bbl in Dec 2026 (from $85); $80 avg in 2027; copper +10% by end-2027; gold higher on central-bank demand (16 and 23 Oct).", "category": ["energy", "commodities"], "url": "https://www.goldmansachs.com/insights/articles/will-oil-prices-decline-as-middle-east-supply-recovers", "images": []}, {"source": "capital_economics", "name": "Capital Economics", "call": "Brent ~$100 into early 2027, falling to $70 by end-2027; European gas to EUR40/MWh; Fed/ECB/BoE tighten less than priced; DM core inflation <3% and toward 2% by end-2027.", "category": ["energy", "rates"], "url": "https://www.capitaleconomics.com/blog/inflation-outlook-and-bond-market-sell", "images": []}, {"source": "ubs", "name": "UBS CIO", "call": "Fed hikes in December and March (two more vs ~3.5 priced); 10y UST YE-2026 4.9% (from 4.6%); fixed income Attractive; add quality bonds (19-21 Oct).", "category": ["rates"], "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-15102026.html", "images": []}, {"source": "ubs", "name": "UBS CIO", "call": "Q3 S&P 500 EPS +28% y/y; AI capex +33% to $1.2tn in 2027; limit neoclouds, favour well-funded hyperscalers; cyclicals supported by 9 months of ISM new orders expansion (22-23 Oct).", "category": ["equities", "ai_tech"], "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-22102026.html", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "call": "Defensive and diversified stance; close US 10-year and European CoCo opportunistic trades with gains; 3-7yr DM investment grade attractive; AUD corporate bonds; hold from Fed/ECB/BoJ next week, December hikes.", "category": ["rates", "credit"], "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-23-10-2026/?mvog=1", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered (Daily)", "call": "DXY at 101.607, technical downside toward the 100-day MA at 100.5; USD/JPY support 156.4; USD/CHF support 0.82/0.8133; Fed expected to hold at 3.75-4.00% on 28 Oct with December hike favoured.", "category": ["fx"], "url": "https://www.sc.com/sg/market-outlook/daily-navigator-23-10-2026/?mvog=1", "images": []}, {"source": "pimco", "name": "PIMCO", "call": "Own a bit more, globally diversified duration to hedge AI/flight-to-quality shocks; software loans: elevated dispersion, avoid chasing the spread recovery.", "category": ["rates", "credit"], "url": "https://www.pimco.com/us/en/archive/insights/podcasts/accrued-interest/many-ways-to-win-dan-ivascyn-on-making-the-most-of-rate-volatility", "images": []}, {"source": "blackrock_investment_institute", "name": "BlackRock (Rieder)", "call": "Diversified fixed income portfolio yielding >7% with <3 years duration and average A- rating; decide pace of adding duration as yields reset.", "category": ["rates", "credit"], "url": "https://www.blackrock.com/us/individual/insights/cio-perspective-asking-better-questions", "images": []}, {"source": "bca_research", "name": "BCA Research", "call": "Fade credit concerns, favour quality: large over small caps, quality capex, Tech margins; quality Tech basket, European winners, selective US cyclicals (Industrials/Materials).", "category": ["equities", "credit"], "url": "https://www.bcaresearch.com/reports/quality-tech-basket-europes-winners-and-selective-us-cyclicals-22-10-2026/227277", "images": []}, {"source": "bca_research", "name": "BCA Research", "call": "Buy Europe (structural services reform); Canada: own bonds, CAD and resource stocks multi-year winners, BoC will not hike 100bp; EM local bonds: build on sell-off; Ags: correction not a top.", "category": ["equities", "rates", "fx", "commodities"], "url": "https://www.bcaresearch.com/reports/buy-europe-20-10-2026/227240", "images": []}, {"source": "vanguard", "name": "Vanguard", "call": "Prefer active over naive AI chasing; look to non-tech AI adopters; muni yields near best in a decade.", "category": ["equities", "credit"], "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/vemo/navigating-the-ai-hype-cycle-a-case-for-active.html", "images": []}, {"source": "amundi", "name": "Amundi", "call": "Midterm sector view: IT supported by AI capex, industrials and materials benefit as capex broadens, energy mixed, renewables more competitive.", "category": ["equities"], "url": "https://research-center.amundi.com/article/us-midterm-elections-fiscal-gridlock-horizon", "images": []}, {"source": "rbc", "name": "RBC Capital Markets", "call": "USD/CAD trading range: buyers 1.3800/1.3900, sellers 1.4200/1.4300; US rate call revised for timing, not magnitude of hikes.", "category": ["fx", "rates"], "url": "https://www.rbccm.com/en/insights/2026/10/the-george-davis-report-october-2026-edition", "images": []}, {"source": "deutsche_bank", "name": "Deutsche Bank Wealth Management", "call": "Equities can absorb higher yields if growth and earnings are resilient; speed of yield rise matters; selectivity, little room for multiple expansion.", "category": ["equities"], "url": "https://wealth.db.com/en/insights/investing-insights/asset-class-insights/higher-for-longer-implications-for-the-stock-market.html", "images": []}, {"source": "invesco", "name": "Invesco", "call": "Stocks have historically performed better in the 1-, 2- and 3-year periods after rate hikes than after cuts.", "category": ["equities"], "url": "https://www.invesco.com/us/en/insights/surprising-case-investing-fed-raising-rates.html", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "call": "Stay diversified; 2026 US GDP 2.5% vs 2.2% consensus; October Fed pause most likely.", "category": ["equities", "growth"], "url": "https://www.franklintempleton.com/articles/en/series/from-the-market-desk", "images": []}, {"source": "norges_bank_im", "name": "Norges Bank Investment Management", "call": "Q3 return roughly flat: equities +0.5%, fixed income -3.5%, unlisted renewables +7.5%; energy stocks led, utilities and real estate fell; fund value down NOK670bn.", "category": ["equities", "rates"], "url": "https://www.nbim.no/en/news-and-insights/the-press/press-releases/2026/negative-return-in-the-third-quarter/", "images": []}], "C_deep_reads": [{"source": "blackrock_investment_institute", "name": "BlackRock (Rick Rieder)", "title": "CIO Perspective: Asking Better Questions", "summary": "Rieder argues investors should ask structural questions rather than collect answers. (1) Growth: strong headline but narrow: corporate profits are growing in line with ~7% nominal GDP, yet computers (~1% of GDP) produced ~27% of recent growth, while rate-sensitive housing is near-recession (qualifying income for a median home $125k, first-time buyer age 40). Warsh said policy is 'not restrictive'. (2) Inflation/Fed: the question is responsiveness, not level. The Fed hiked to 3.75-4.00%; the SEP median dot now implies two 2026 hikes (4.125%), 2027 and 2028 medians +50bp, a hold next year and a cut in 2028; 2026 core PCE revised to 3.4%. Acyclical components (energy, insurance, healthcare, education, chip/asset-price-linked goods) are driving headline inflation, and hikes bite in housing and credit cards (90-day delinquency 12.9%) but not in AI capex or energy, like 'turning down the thermostat in one room'; he does not think this hike requires a long series. (3) Labour: unemployment 4.1% but hires rate lowest since 2010, wage growth 3.1%, ex-healthcare payrolls ~6k/month while profit per employee grows at the fastest pace in 25 years outside crisis rebounds. (4) Fixed income: a diversified portfolio can yield >7% with <3y duration and an A- average rating; real yields attractive, vol 2.6% vs 11.1% in 2021; nearly half of marketable Treasuries mature within two years.", "url": "https://www.blackrock.com/us/individual/insights/cio-perspective-asking-better-questions", "images": []}, {"source": "bny", "name": "BNY", "title": "Fed Thoughts: Climbing Up The Learning Curve", "summary": "Less than five months into his tenure, Chair Warsh is changing the Fed's operating style. BNY is 'reasonably sure' of three things: the Fed likely hikes at least once more this year; it will not signal its October decision (Warsh: 'forward guidance is not the business we should be in'); and the message will be firmly focused on price stability. Uncertain is cadence: the committee leans toward removing accommodation but its chair, who proposed cutting scheduled meetings, may prefer fewer interventions. BNY frames this via a welfare-loss logic: when inflation is far from 2% the policy direction is clear and guidance helps anchor expectations; when near goal, the Fed should listen to markets' views instead of leaning on the scale. It adds that Warsh worries less about high-frequency data fluctuations ('Newton's first law': policy persists unless acted upon).", "url": "https://www.bny.com/investments/us/en/individual/articles/markets-and-economy/fed-thoughts-climbing-up-the-learning-curve.html", "images": []}, {"source": "capital_economics", "name": "Capital Economics", "title": "The Inflation Outlook and the Bond Market Sell-Off (Neil Shearing)", "summary": "Two themes dominate markets: AI-boom sustainability (especially its debt financing) and the bond sell-off that pushed US 10y yields to their highest since the mid-2000s. Capital Economics is optimistic on AI productivity but finds it harder to see returns justifying the investment surge. On inflation: global CPI rose from 2.6% y/y in January to 3.6% in August almost entirely on energy; DM non-energy inflation was marginally lower than pre-war. Brent forecast ~$100 into early 2027 with elevated refining margins, pushing global inflation above 4% early 2027; baseline assumes Middle East supply improving through H1-2027, Brent $70 by end-2027 and EU gas EUR40/MWh. Second-round effects are judged unlikely (looser labour markets than 2022, weaker demand limits pass-through), so core stays below 3% in major DMs and falls toward 2% by end-2027, below inflation-swap pricing. Hence the Fed, ECB and BoE tighten by less than priced; the recent yield rise looks hard to justify on inflation alone, unless Gulf disruption deepens. Separately: AI-related activity accounted for just over a quarter of US GDP growth over the past year (Stephen Brown).", "url": "https://www.capitaleconomics.com/blog/inflation-outlook-and-bond-market-sell", "images": []}, {"source": "pimco", "name": "PIMCO (Dan Ivascyn)", "title": "'Many Ways to Win': Dan Ivascyn on Making the Most of Rate Volatility", "summary": "Recorded 15 Oct after hot CPI and PPI prints and a bond rally. Ivascyn calls recent price action choppy and technically driven (deleveraging and unwinds, not just fundamentals); a flight-to-quality scenario would benefit from more, globally diversified duration. He recalls how 2023's apparent peak in yields reversed once inflation and growth data turned, 'maybe wishful thinking', not his base case, but a reminder that surprises run both ways. With policy rates far above zero, extending interest-rate exposure a bit is not a tactical bet against the Fed but a way to lock in high-quality yields for years and protect against negative shocks that rally the front end. He draws a parallel between AI capex and prior buildouts, and notes the post-2008 separation of finance from the real economy via regulation is being tested by AI-driven growth. US mortgage holders mostly locked in rates below the current 7.5%, and fiscally stronger, slower economies abroad offer diversification.", "url": "https://www.pimco.com/us/en/archive/insights/podcasts/accrued-interest/many-ways-to-win-dan-ivascyn-on-making-the-most-of-rate-volatility", "images": []}, {"source": "pimco", "name": "PIMCO (Tiffany Wilding)", "title": "Macro Signposts: The AI Investment Boom Goes Beyond America", "summary": "Announced large US tech capex exceeds $1tn in 2026 with ~$1.5tn more forecast after. The boom is bigger for US demand than GDP because much equipment is imported, cutting direct GDP contribution, but wealth effects from AI-driven equities and productivity expectations lift consumption. The impulse spreads to Asian supply chains (semis, tech hardware) and other economies investing in resilience and technology security. Key risk is deceleration, not necessarily bust: growth depends on the change in spending, so even high capex can become less supportive if its pace slows.", "url": "https://www.pimco.com/us/en/insights/the-ai-investment-boom-goes-beyond-america", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "title": "Canvas Market Insights: Calm on the Surface, Steady as She Goes?", "summary": "Q3: S&P 500 +2.3% (YTD +12.8%), international developed lagged, EM slightly negative, Russell 2000 -7.2%, yields soared as the Iran conflict entered month eight. Beneath calm indices, July saw one of the most severe momentum reversals in four decades, likely triggered by the unwind of a large levered AI-focused hedge fund; AI and AI-adjacent stocks are ~55% of US market cap. Franklin earlier called AI a capital cycle, not a bubble; the question for allocators shifts from whether AI drives earnings to whether the capital required to sustain it earns sufficient returns, as buildout needs more cash and outside capital.", "url": "https://www.franklintempleton.com/articles/en/2026/10/canvas-market-insights-calm-on-the-surface-steady-as-she-goes", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs (Daan Struyven)", "title": "Will Oil Prices Decline as Middle East Supply Recovers?", "summary": "Base case: continued adaptation of Middle East supply reduces crude prices. Brent forecast $90 in December 2026 (from $85) and $80 average in 2027. Persian Gulf exports are around their 2025 average since late September, including ~4 mb/d of 'dark' exports. Yet dated Brent is >$130 and futures >$100: Struyven estimates a ~$25 risk premium (escalation could target ports, pipelines, fields) on top of near-record-low inventories prompting restocking. The market is projected to move into surplus in Q4-2026 and 2027, 'the key driver' of lower prices; escalation remains net upside risk. In the follow-up podcast he adds portfolio hedging demand (bonds and equities unusually sensitive to oil) and refined products still ~40% of 2025 Gulf export levels.", "url": "https://www.goldmansachs.com/insights/articles/will-oil-prices-decline-as-middle-east-supply-recovers", "images": []}, {"source": "boe", "name": "Bank of England (Alan Taylor)", "title": "Searching for signposts", "summary": "The 2026 Dow Lecture addresses whether higher energy prices create persistent inflation via expectations and second-round effects. Taylor argues the current stance is more than sufficient: both Bank Rate and the OIS curve remain substantially restrictive relative to his neutral estimate of 2.75-3.0%, and beyond two years market rates are more restrictive than when the last cycle's final hike (5.25%, Aug 2023, inflation 6.8%) was delivered. His Taylor-rule estimate for the UK falls from 4.2% (4Q25) to 3.5% (2Q27), unlike other economies where it rises. He describes monitoring signposts for de-anchoring and why restrictive policy guards against persistence; contrasts with Mann/Pill hawks.", "url": "https://www.bankofengland.co.uk/speech/2026/september/searching-for-signposts-speech-by-alan-taylor", "images": []}], "D_charts": [{"source": "bnp_paribas", "name": "BNP Paribas AM (Daniel Morris)", "chart": "Exhibit 1: technology is the source of nearly two-thirds of global Q3 earnings growth (energy ~20%); Exhibit 3 relates index earnings growth to tech/energy share of each market. Shows how concentrated the earnings season is.", "url": "https://viewpoint.bnpparibas-am.com/view-from-the-markets-a-critical-earnings-season-approaches/", "images": ["https://viewpoint.bnpparibas-am.com/wp-content/uploads/2026/10/Exhibit-1-Technology-sector-is-the-source-of-nearly-two-thirds-of-global-earnings-growth.png", "https://viewpoint.bnpparibas-am.com/wp-content/uploads/2026/10/Exhibit-3-Index-earnings-growth-a-function-of-tech-and-or-energy-share-in-market.png"]}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "chart": "Exhibit 2: earnings growth expected to be more balanced next year (2027) as tech's share of growth fades.", "url": "https://www.bnpparibas-am.com/en-us/front-of-mind/view-from-the-markets-a-critical-earnings-season-approaches/", "images": ["https://www.bnpparibas-am.com/wp-content/uploads/2026/10/Exhibit-2-Earnings-growth-expected-to-be-more-balanced-next-year.png"]}, {"source": "pimco", "name": "PIMCO", "chart": "Software loan spreads have somewhat recovered since their peak sell-off: spreads about 100bp inside June wides but widening again since early September; bid prices ~8 points below non-software loans.", "url": "https://www.pimco.com/us/en/insights/the-credit-market-lens-improved-optics-but-unchanged-economics-in-software-loans", "images": ["https://www.pimco.com/us/en/-/media/global-assets/insights/economic-and-market-commentary/the-credit-market-lens/10/the-credit-market-lens-improved-optics-but-unchanged-economics-in-software-loans/figure-1.webp?rev=ffc6fd612e47497595862369c38c4814&la=en-US&h=720&w=1280&hash=30C79F327EA6ED4BF2CBB8FAD44ECDF9"]}, {"source": "pimco", "name": "PIMCO (Macro Signposts)", "chart": "Figure 1 of the AI investment piece: illustrates how AI capex flows through US demand and global supply chains (imports // ---------- helpers ----------
const CAT_VARS = {
  rates: 'var(--cat-rates)',
  growth: 'var(--cat-growth)',
  fx: 'var(--cat-fx)',
  equities: 'var(--cat-equities)',
  credit: 'var(--cat-credit)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  commodities: 'var(--cat-commodities)',
  geopolitics: 'var(--cat-geopolitics)',
  ai_tech: 'var(--cat-ai_tech)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }
function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}
function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}
function pills(cats) {
  if (!cats) return '';
  if (Array.isArray(cats)) return cats.map(pill).join(' ');
  return pill(cats);
}
function externalLink(url, label) {
  if (!url) return '';
  return `<a class="item-link" href="${escapeAttr(url)}" target="_blank" rel="noopener">${label || 'link →'}</a>`;
}
function nameLink(url, name) {
  if (!name) return '';
  if (!url) return `<span class="item-source">${escapeHtml(name)}</span>`;
  return `<a class="item-source" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderThemeItem(it) {
  return `
    <div class="theme-item">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.thesis || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderTheme(theme) {
  const items = (theme.items || []).map(renderThemeItem).join('');
  return `
    <div class="theme">
      <div class="theme-head">
        ${pills(theme.category)}
        <div class="theme-title">${escapeHtml(theme.theme || '')}</div>
      </div>
      <div class="theme-stance">
        ${theme.consensus ? `<div class="theme-line consensus"><span class="lbl">Consensus</span>${renderBold(theme.consensus)}</div>` : ''}
        ${theme.divergence ? `<div class="theme-line divergence"><span class="lbl">Divergence</span>${renderBold(theme.divergence)}</div>` : ''}
      </div>
      ${items ? `<div class="theme-items">${items}</div>` : ''}
    </div>`;
}

function renderCall(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${pills(it.category)}
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.call || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderDeepRead(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url, 'read →')}
      </div>
      ${it.title ? `<div class="item-title">${escapeHtml(it.title)}</div>` : ''}
      <div class="item-text">${renderBold(it.summary || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderChart(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.chart || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderHouseView(hv) {
  const name = hv.name || hv.source || '';
  const nameHtml = hv.url
    ? `<a class="hv-name" href="${escapeAttr(hv.url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`
    : `<span class="hv-name">${escapeHtml(name)}</span>`;
  return `
    <div class="hv-row">
      ${nameHtml}
      <span class="hv-stance">${renderBold(hv.stance || '')}</span>
    </div>`;
}

function renderSection(letter, name, items, render, extraClass) {
  if (!items || !items.length) return '';
  const body = items.map(render).join('');
  const cls = 'section' + (extraClass ? (' ' + extraClass) : '');
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderTopStats(d) {
  const parts = [];
  const p = d.period || {};
  const is = d.input_stats || {};
  const cv = d.coverage || {};
  if (p.from && p.to)
    parts.push(`period <strong>${escapeHtml(p.from)} → ${escapeHtml(p.to)}</strong>`);
  else if (p.lookback_days != null)
    parts.push(`lookback <strong>${p.lookback_days}d</strong>`);
  if (is.total_articles != null) parts.push(`articles <strong>${is.total_articles}</strong>`);
  if (is.sources_present != null) parts.push(`sources <strong>${is.sources_present}</strong>`);
  if (is.after_filter != null) parts.push(`after filter <strong>${is.after_filter}</strong>`);
  if (cv.coverage_pct != null) {
    const pct = (cv.coverage_pct <= 1 ? cv.coverage_pct * 100 : cv.coverage_pct);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  } else if (cv.sources_covered != null && cv.sources_total != null) {
    parts.push(`coverage <strong>${cv.sources_covered}/${cv.sources_total}</strong>`);
  }
  return parts.join(' | ');
}

function reportDate(d) {
  if (d.period && d.period.to) return d.period.to;
  if (d.collected_at) return String(d.collected_at).slice(0, 10);
  return '';
}

// ---------- interactions ----------
function toggleSection(headEl) { headEl.parentElement.classList.toggle('open'); }
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('lightbox').classList.contains('open')) {
    closeLightbox();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = reportDate(d);
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  const s = d.sections || {};
  const out = [
    renderSummary(d.summary),
    renderSection('A.', 'Debates — Consensus vs Divergence', s.A_debates,    renderTheme),
    renderSection('B.', 'Key Calls & Positioning',           s.B_calls,      renderCall),
    renderSection('C.', 'Notable Deep Reads',                s.C_deep_reads, renderDeepRead,
                  'section-deepreads'),
    renderSection('D.', 'Charts & Data',                     s.D_charts,     renderChart),
    renderSection('E.', 'House Views',                       s.house_views,  renderHouseView),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = out || '<div class="empty">No report data.</div>';

  // Auto-open Summary's section view: first two sections open by default.
  document.querySelectorAll('.section').forEach((sec, i) => {
    if (i < 2) sec.classList.add('open');
  });
}

renderReport(REPORT_DATA);
</script>
