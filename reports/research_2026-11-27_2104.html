<script>
const ITEMS = [{"cat": "crypto", "urgency": "watch", "source": "Unchained Daily / Laura Shin team", "title": "Binance put up $6.34B of its own money and reopened all withdrawals 28 days after the hack", "idea": "Binance says the withdrawal suspension from the Oct 29 hot-wallet hack (about $6.3B) is fully lifted, 28 days later. It covered the loss with more than $6.34B from its futures insurance fund, corporate treasury and SAFU reserve. Some edges are still frayed: USDT-on-Solana withdrawals were blocked under a 'Low Hot Wallet Balance' label, and the Sonic network was halted for 'Security Issues'.", "angle": "The largest crypto theft on record was absorbed by one balance sheet in four weeks. That shows how much equity sits inside the top CEX, and how much of it just left. Watch whether Binance's insurance fund and SAFU get rebuilt, and what that does to BNB demand.", "tweetA": "Binance just ate a $6.3B loss out of pocket and reopened in 28 days. Most regional banks couldn't survive a hit that size. The real question is how long it takes to refill SAFU, and who's selling BNB to pay for it.", "tweetB": "'Fully lifted.' Then the status page shows USDT on Solana blocked for 'Low Hot Wallet Balance'. Recovery is done on paper. Hot-wallet liquidity is still being rationed. $BNB", "charts": {"count": 1, "hot": false, "desc": "Section header images only; no data charts in email"}, "link": "https://unchainedcrypto.com/binance-lifts-withdrawal-suspension-from-6-3-billion-hack-says-recovery-is-complete/", "id": 1}, {"cat": "crypto", "urgency": "watch", "source": "Unchained Daily / Laura Shin team", "title": "Standard Chartered-bound Zodia Custody breached: intruder reached client contact data", "idea": "Zodia Custody, which StanChart agreed to buy in October, spotted probing on Nov 23 and switched off its B2B API. By Nov 24 the intruder had reached public org details plus business contact names and emails for 'a small number of clients and employees'. No unauthorized transactions so far. Zodia hasn't said how they got in or who it was.", "angle": "In the same week, 1Password was hacked through an employee's GitHub (per Mando), and 1,000+ BTC mining sites had their hashrate hijacked. Institutional custody's selling point is opsec, and contact lists are what spear-phishing campaigns are built from.", "tweetA": "A bank-owned crypto custodian leaked client contact lists through its B2B API. Nothing was stolen yet, but a list of who holds institutional crypto custody is exactly what the next social-engineering wave needs.", "tweetB": "Binance hack, Zodia breach, 1Password via GitHub, a mining-pool hashrate hijack. All in about four weeks. Crypto's attack surface isn't the chain anymore. It's the people and the APIs around it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/zakura-asks-zcash-to-close-sapling-to-new-funds-citing-ai-factoring-rumors/", "id": 2}, {"cat": "credit", "urgency": "act", "source": "Unchained Daily / Laura Shin team", "title": "Sky's stUSDS: $78K withdrawable against $158.6M deposited, and the foundation is a top borrower", "idea": "Spark's data page showed just $78,231 available to withdraw from stUSDS against about $158.6M deposited, so exits depend on repayments or new money. Sky fast-tracked a vote to send 25M USDS to the Sky Frontier Foundation to pay down debt. The foundation itself owes about $40M, second only to a wallet likely tied to co-founder Rune Christensen. Gnosis' Koeppelmann argued plain repayments let bots skim value.", "angle": "This is a run-on-the-bank setup in DeFi lending: 0.05% liquidity and insiders as the largest borrowers. Watch the USDS peg, SKY token, and contagion to Spark-integrated venues.", "tweetA": "stUSDS liquidity ratio: $78K / $158.6M = 0.05%. The two largest borrowers are the foundation and a wallet tied to the co-founder. That's not a lending market. It's an insider credit line with retail as the depositor base.", "tweetB": "Everyone's watching BTC's $60K line. Meanwhile a $158M DeFi lending pool has gated 99.95% of withdrawals, and governance is rushing a vote to repay the foundation first. Credit stress always shows up in the plumbing before the price.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/sky-fast-tracks-25-million-for-its-foundation-to-pay-down-debt-as-stusds-withdrawals-stall/", "id": 3}, {"cat": "crypto", "urgency": "watch", "source": "Unchained Daily / Laura Shin team", "title": "Ethereum locks Glamsterdam with contested EIP-8037 gas repricing; Hoodi fork Dec 15", "idea": "Core devs kept the gas repricing (EIP-8037) unchanged. It makes new accounts, storage and contract code costlier. No execution-layer client team vetoed. Besu abstained, and Erigon's Ashikhmin called it 'the lesser evil'. Dietrichs said forking Hoodi on this spec 'pretty much commits us' to mainnet as-is.", "angle": "Raising state-growth costs pushes state-heavy apps to L2s, which helps the rollup-settlement thesis for ETH. It also squeezes app teams who pushed back. No mainnet date yet.", "tweetA": "Ethereum is making new state more expensive on purpose. That's a tax on L1 app sprawl and a subsidy to rollups. The devs chose state hygiene over app-developer comfort. $ETH", "tweetB": "No client team vetoed. One abstained. One called it 'the lesser evil'. That's what rough consensus looks like when nobody loves the trade-off but everyone fears state bloat more.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/ethereum-devs-lock-in-glamsterdams-gas-repricing-set-hoodi-testnet-fork-for-dec-15/", "id": 4}, {"cat": "crypto", "urgency": "act", "source": "Unchained Daily / Laura Shin team", "title": "KuCoin delists Monero Nov 30: its pairs were 58% of tracked XMR volume; XMR -12%", "idea": "KuCoin will close four XMR spot pairs on Nov 30. Those pairs carried about 58% of Monero's tracked trading volume. XMR fell about 12% in a day to $460.63.", "angle": "Privacy coins are losing their last big centralized venue just as Spain gives its AML unit judge-free account freezes and Switzerland narrows its CARF partner list. The regulatory squeeze on privacy is coordinated, even if nobody announced it that way.", "tweetA": "58% of Monero's tracked volume disappears on Monday. XMR is only down 12%. Either the 'tracked' volume was never real price discovery, or the real drop comes when market makers lose their hedging venue. $XMR", "tweetB": "Privacy coin liquidity is being dismantled one venue at a time. KuCoin was the big one left. Next stop is DEXs and atomic swaps, and that's where the regulatory fight moves too.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/kucoin-drops-monero-monday-its-pairs-carried-over-half-of-tracked-xmr-volume/", "id": 5}, {"cat": "regulation", "urgency": "watch", "source": "Unchained Daily / Laura Shin team", "title": "Spain lets its AML unit freeze bank, payment and crypto accounts for 5 days without a judge", "idea": "A royal decree-law published Nov 25 gives Spain's anti-money-laundering unit power to freeze bank, payment and crypto accounts for up to five business days without a court order. A longer freeze needs a court to ratify it.", "angle": "Administrative freezes without judicial review are spreading in the EU. For crypto platforms operating under MiCA in Spain, this is a new operational risk on customer funds.", "tweetA": "Spain can now freeze your bank and crypto accounts for five business days on an administrative order. Five days is long enough to miss a margin call, a payroll or a closing. Due process now comes after the freeze.", "tweetB": "Keep an eye on how this spreads. EU AML harmonization usually travels from one member state to the rest. A judge-free freeze tool in Spain today is a template for AMLA tomorrow.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.boe.es/buscar/doc.php?id=BOE-A-2026-24702#dfsexta", "id": 6}, {"cat": "geopolitics", "urgency": "watch", "source": "Unchained Daily / Laura Shin team", "title": "ASEAN+3 (China, Japan, Korea + ASEAN) form working group on cross-border digital payments and digital assets", "idea": "At a Nov 26 meeting in Kyoto, ASEAN+3 finance and central bank deputies agreed to form a working group on cross-border digital payments and regulatory approaches to digital assets, under the AMRO. Ministers will review results in May 2027.", "angle": "This is a regional payments bloc that includes China and Japan but not the US. It connects to the 'chip-dollar' and de-dollarization debates: alternative payment plumbing in Asia matters more than any single CBDC headline.", "tweetA": "China, Japan, Korea and ASEAN just agreed to coordinate on digital payment rails and crypto rules. The US isn't in the room. Payment plumbing is where de-dollarization actually happens, quietly, in working groups.", "tweetB": "Kyoto, Nov 26: ASEAN+3 launch a digital-assets working group. Report due May 2027. Small headline, but stablecoin policy in the world's most trade-dense region is now being drafted without Washington.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.mof.go.jp/english/policy/international_policy/convention/others/CochairsStatement.pdf", "id": 7}, {"cat": "positioning", "urgency": "watch", "source": "Unchained Daily / Laura Shin team", "title": "DWF's Grachev: mid-size crypto market makers 'will die' as Auros winds down", "idea": "DWF Labs' Andrei Grachev said mid-size market makers will die as margins disappear. He posted the same day CoinDesk reported Hong Kong-based Auros is winding down. Separately, Bluefin is shutting its perps exchange on Dec 4, and it accounted for 95% of Sui's all-time perps volume.", "angle": "Liquidity providers exiting in a bear market thins order books right when volatility is highest. That makes alt drawdowns sharper and supports the 'squeeze risk is on the short side' view only for majors.", "tweetA": "Market makers dying in a bear market isn't a footnote. It's how alt liquidity disappears. Thinner books mean bigger wicks both ways. Size down on anything outside the top 10.", "tweetB": "Auros winding down, Bluefin killing perps that were 95% of Sui's volume, DWF calling the mid-tier dead. Crypto market structure is consolidating like prime brokerage in 2009.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/dwf-labs-grachev-says-mid-size-crypto-market-makers-will-die-amid-auros-closure-report/", "id": 8}, {"cat": "science", "urgency": "watch", "source": "Unchained Daily / Laura Shin team", "title": "Zcash proposal: close the Sapling pool over rumors AI labs can factor large numbers faster", "idea": "Zakura urged Zcash to close its older Sapling shielded pool to new funds and move holders to the newer Ironwood pool, citing unconfirmed rumors that AI labs can factor large numbers much faster. About 400,000 ZEC, roughly 2% of supply, sits in Sapling.", "angle": "This is the first concrete protocol action driven by the 'AI broke cryptography' rumor (Aaronson, Google's six RSA-math papers, VP≠VNP proofs). Even if the rumor is wrong, the migration cost is real, and other chains will face the same question.", "tweetA": "A blockchain is proposing to retire a cryptographic pool because of a rumor about AI and factoring. Whether or not the rumor is true, the risk premium on legacy crypto primitives just went up.", "tweetB": "2% of ZEC supply sits in a pool its own ecosystem now wants to deprecate on AI-factoring fears. If that's prudent for Zcash, what's the plan for the trillions secured by RSA in TradFi?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/zakura-asks-zcash-to-close-sapling-to-new-funds-citing-ai-factoring-rumors/", "id": 9}, {"cat": "regulation", "urgency": "watch", "source": "Unchained Daily / Laura Shin team", "title": "Switzerland cuts crypto tax-data partners to 57 from 74 under OECD CARF, no reason given", "idea": "Switzerland approved 57 foreign partners to receive crypto tax data under the OECD's CARF starting in 2028, down from 74 in its June 2025 draft. It named only the EU, UK and 'various G20 countries'. Also this week, Switzerland's first spot BTC ETF debuted on SIX (per Mando).", "angle": "Seventeen jurisdictions dropped quietly from the list. Which ones were cut matters for where crypto wealth migrates ahead of 2028.", "tweetA": "Switzerland quietly removed 17 countries from its crypto tax-reporting list and won't say which. In 2028 the question 'where is my exchange reporting to?' becomes a residency decision.", "tweetB": "Same week: Switzerland gets its first spot BTC ETF and trims its CARF partner list by 23%. The Swiss are building the onshore crypto product and keeping the reporting perimeter narrow.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.com/switzerland-oks-57-foreign-tax-partners-for-crypto-reporting-down-17-from-its-2025-plan/", "id": 10}, {"cat": "venture", "urgency": "watch", "source": "Unchained Daily / Laura Shin team", "title": "Crypto x AI seed rounds: Ulys $17M, Cournot $5M, Sequent $2.2M (Jaan Tallinn's Metaplanet)", "idea": "Ulys raised $17M total for an AI investing app (Tom Lee, BitMine, XBTO). Cournot raised $5M (Paper Ventures, Beam) for an oracle layer that interprets real-world events for onchain apps and AI agents. Sequent raised a $2.2M pre-seed co-led by Jaan Tallinn's Metaplanet for 'Alan', an AI agent that mathematically proves code follows its rules. Curve is its first paying customer.", "angle": "Formal verification is getting funded in the same week Lean certified an AI-assisted Riemann proof. Formally verified smart contracts could be the first place 'centaur math' earns money.", "tweetA": "Lean certified a 17M-line AI proof of the Riemann Hypothesis. The same week, a startup raised money to have AI formally prove DeFi code follows its rules. Formal verification is going from academic to billable.", "tweetB": "Bear-market crypto VC in one line: nobody's funding new L1s. They're funding AI agents that read the world (oracles) and AI agents that prove code is safe (verification). The money is following the agent stack.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sequent.inc/news/sequent-raises-2-2m/", "id": 11}, {"cat": "geopolitics", "urgency": "act", "source": "The Dark Side of the Boom — GS Privorotsky", "title": "Beijing brings in the national team: STAR 50 +15%, ChiNext +11.6%, KOSPI +4.1%", "idea": "The State Council explicitly called on Central Huijin to play a bigger role in liquidity support. STAR 50 rose about 15% and ChiNext 11.6%. KOSPI added 4.1% on reports Seoul is weighing a bigger stabilization fund, and S&P futures climbed back above 7,300. After weeks of hedge-fund deleveraging and systematic selling, the marginal seller may be running out of ammunition just as policy steps in.", "angle": "Two Asian governments now backstop AI-linked equities at the same time. Howell (Capital Wars) argues this is a signal, not yet a liquidity injection. Trade the squeeze, but the rally needs PBoC follow-through.", "tweetA": "STAR 50 +15% in a day. That's not a recovery, it's a short squeeze into a state backstop. Real liquidity hasn't shown up yet: no PBoC injection, no RRR cut. Fade it if the PMIs come in weak. $KWEB $FXI", "tweetB": "When Beijing and Seoul both defend chip stocks in the same week, the AI drawdown has stopped being a market problem and become a policy problem. That's a floor under Asian tech, not a bull case.", "charts": {"count": 1, "hot": false, "desc": "Inline index chart likely; charts inside, worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/goldman-sachs-rich-privorotsky-beijing", "id": 12}, {"cat": "AI/infra", "urgency": "deep", "source": "The Dark Side of the Boom — GS Privorotsky", "title": "Privorotsky: is AI becoming too cheap for its own good?", "idea": "Goldman's Head of EMEA Delta One sees a constructive near-term setup, since positioning, vol and systematic flows could fuel a year-end recovery. The bigger worry is that dramatic AI efficiency gains could undercut the financial assumptions behind the infrastructure boom. The next phase may depend less on how fast compute demand grows and more on whether that growth earns enough revenue to justify capex already committed.", "angle": "Same day, SemiAnalysis shows Trainium3 at 73.5% token margins vs GB300 at 53%, and SpaceX is slashing Blackwell rents after Anthropic left. Falling cost per token is great for users but deflationary for whoever bought GPUs at peak prices.", "tweetA": "AI deflation is the bull case for users and the bear case for lenders. If tokens get 3x cheaper every year, the GPU you financed over five years is worth a fraction of its book value by year two. $CRWV $NVDA", "tweetB": "Everyone asks whether AI demand is real. Goldman's Delta One desk is asking the better question: does efficiency grow faster than revenue? If it does, capex returns get competed away to consumers.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/goldman-sachs-rich-privorotsky-beijing", "id": 13}, {"cat": "crypto", "urgency": "deep", "source": "Ecoinometrics / Nick", "title": "BTC ETF flows are tracking the bearish simulation, which implies low-$50Ks, not $60K", "idea": "At the start of November, Ecoinometrics simulated three paths for rolling 30-day ETF flows. Actual flows are tracking the bearish one and now run slightly ahead of it. Their flows-to-returns model says current demand fits BTC in the low $50Ks, not above $60K. BTC is about 50% off its ATH.", "angle": "Price is above where the model says flow supports it, so either a squeeze or a catch-down is coming. Mando's 'BTC squeeze risk is on the short side' (Ki Young Ju) is the other side of this trade.", "tweetA": "BTC is holding $60K. The ETF-flow model says demand supports the low $50Ks. A gap that wide between price and flow-implied value closes one of two ways, and shorts are betting on only one. $BTC $IBIT", "tweetB": "They modeled a bearish path for November ETF flows. Reality is slightly worse than the bear case. When your pessimistic scenario is too optimistic, believe the flows.", "charts": {"count": 1, "hot": true, "desc": "🔥 CHART WORTH SAVING: simulated bearish/base/bullish rolling-30d ETF flow paths vs actual (black line tracking the bear path)"}, "link": "https://ecoinometrics.substack.com/p/bitcoin-etf-flows-are-following-the", "id": 14}, {"cat": "crypto", "urgency": "deep", "source": "Ecoinometrics / Nick", "title": "Nine straight sessions, ~50K BTC out of ETFs: second-largest outflow streak of this bear market", "idea": "BTC has traded in the low $60Ks for two weeks while the ETFs lost almost 50K BTC in nine consecutive sessions, the second-largest outflow streak of this bear market. No dip-buying is showing up in ETF data at what's supposed to be strong support.", "angle": "That 50K BTC of supply was absorbed without breaking $60K, so someone is bidding. Is it Cardone (1K BTC), corporate treasuries, or OTC? Watch Strategy's mNAV at 0.88x: it can't issue equity to buy.", "tweetA": "50,000 BTC left the ETFs in nine sessions. Price barely moved. Somebody absorbed about $3B of supply at $60K. Find that buyer and you've found the floor. $BTC", "tweetB": "Support levels are supposed to bring in buyers. At $60K, ETF holders keep selling. A floor that only holds because the sellers haven't finished isn't much of a floor.", "charts": {"count": 1, "hot": false, "desc": "Bar chart of daily ETF net flows showing the 9-session streak"}, "link": "https://ecoinometrics.substack.com/p/bitcoin-etf-flows-are-following-the", "id": 15}, {"cat": "macro", "urgency": "deep", "source": "Ecoinometrics / Nick", "title": "PCE: third straight month of rising YoY inflation across headline, core and core services", "idea": "This week's PCE was the third straight month of rising YoY inflation, and the rise is broad: headline, core and core services. Disinflation stalled in 2025 and has gone the wrong way since. That pressures the Fed to tighten and pushes yields higher, which raises the cost of capital for everything from real estate to AI data centers.", "angle": "Mando: hot PCE pushed December hike odds to 93%. Raoul Pal says the dollar did more than half of the tightening since February. The AI capex cycle is now financed in a rising-rate world.", "tweetA": "Three straight months of rising PCE, across headline, core AND core services. You can't blame energy for that: oil fell from $102 to $84 this month. This is sticky, and the Fed is about to hike into it.", "tweetB": "Higher yields hit Bitcoin and gold the same way, as more competition for capital. But they also raise the hurdle rate on every data center being financed. The hike prices the AI trade, not just crypto.", "charts": {"count": 1, "hot": false, "desc": "Long-run chart of PCE headline/core/core services YoY"}, "link": "https://ecoinometrics.substack.com/p/bitcoin-etf-flows-are-following-the", "id": 16}, {"cat": "science", "urgency": "deep", "source": "Not Boring / Packy McCormick — Weekly Dose #221", "title": "Alpöge + Claude: a 17-million-line Lean proof of the (Generalized) Riemann Hypothesis that no human can read yet", "idea": "Anthropic mathematician Levent Alpöge, working six weeks with an unreleased frontier Claude, released a formal Lean proof of GRH for Dirichlet L-functions. The Lean FRO and Mathlib certified it within 24 hours across multiple independent checkers. There's no natural-language paper. Tao says it draws on 'the full power' of Langlands and arithmetic geometry. Strogatz: 'a very skilled AI jockey riding a very fast AI horse.'", "angle": "This is the moment verification beat understanding. When machines produce truths humans can't read, trust moves to proof checkers. That's a new infrastructure category, and it matters for the encryption-risk debate.", "tweetA": "A Millennium Prize Problem was solved, verified by machine, and still no human understands the proof. We've separated knowing something is true from knowing why. Every field that runs on expert judgment should be nervous.", "tweetB": "Six weeks, one mathematician, one model, 17M lines of Lean. Run the math on R&D productivity: if this works for number theory, what does a lab of 100 AI jockeys do to drug discovery timelines?", "charts": {"count": 1, "hot": false, "desc": "WSJ video still; no data chart"}, "link": "https://www.notboring.co/p/weekly-dose-of-optimism-221", "id": 17}, {"cat": "science", "urgency": "watch", "source": "Not Boring / Packy McCormick — Weekly Dose #221", "title": "Anthropic and OpenAI both post AI-generated proofs of VP ≠ VNP; P vs NP rumors swirl", "idea": "Both labs posted AI-generated proofs of VP ≠ VNP, the algebraic cousin of P vs NP (open since 1979). Packy notes rumors that the labs cracked P vs NP too. If P = NP were proven, a lot of cryptography could be invalidated.", "angle": "Taken together with Aaronson's dinner-party post, Google's six RSA-math papers and the Zcash Sapling proposal, the 'AI broke crypto' narrative now drives protocol and policy decisions before any proof exists.", "tweetA": "VP ≠ VNP is proven, by AI, at two labs, in one week. That's evidence these systems are working on complexity theory's hardest problems. 'They cracked P vs NP' is still a rumor, but it isn't a crazy one anymore.", "tweetB": "Notice the asymmetry: VP ≠ VNP makes the world safer (things stay hard). The P = NP rumor would make it much less safe. Markets are pricing the scary rumor, not the reassuring proof.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.notboring.co/p/weekly-dose-of-optimism-221", "id": 18}, {"cat": "science", "urgency": "watch", "source": "Not Boring / Packy McCormick — Weekly Dose #221", "title": "OpenAI's Ven Chandrasekaran proposes a quantum theory of vacuum gravity in 4D", "idea": "The paper proposes a background-independent quantization of pure general relativity in 4D Lorentzian spacetime. It builds a Hilbert space and a Lorentzian path integral, and recovers Bekenstein-Hawking entropy (including Sen's one-loop log correction) and semiclassical Einstein equations. It covers vacuum only, not matter, and needs peer checking. Direct experiments aren't possible with current tech.", "angle": "AI-assisted theoretical physics is now producing frontier-level proposals within days of the math breakthroughs. Expect a wave of 'AI-assisted' claims, with credibility sorted by formal verification.", "tweetA": "Wednesday: quantum gravity proposal. Friday before: Riemann. Same week: VP ≠ VNP. Last time science moved this fast, it took a world war to fund it.", "tweetB": "The paper recovers black-hole entropy, including Sen's correction. That's the minimum bar for a quantum gravity theory. We may be entering a period where clearing minimum bars is cheap, and the bottleneck is experiment.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.notboring.co/p/weekly-dose-of-optimism-221", "id": 19}, {"cat": "culture", "urgency": "watch", "source": "Not Boring / Packy McCormick — Weekly Dose #221", "title": "SpaceX and Elon to give every US child two shares, then one more a year: >10% of his stake in a decade", "idea": "Every American child gets two SpaceX shares, one from the company and one from Musk, via Trump Accounts, plus an additional share every year from Musk. He controls about 6.4B shares, and there are about 72M US kids. Packy's math: more than 10% of his ownership goes to American kids within a decade.", "angle": "Turning 72M minors into SpaceX shareholders builds a political constituency, and a structural bid from a retail base that never sells. Watch SpaceX listing plans and the Tesla merger talk (FT, via Raoul Pal).", "tweetA": "72M kids times one share a year is 720M shares over a decade, more than 10% of Musk's stake. That's not philanthropy, it's the biggest retail-shareholder acquisition campaign in history.", "tweetB": "Every American kid owning SpaceX turns 'regulate SpaceX' into 'regulate your kid's college fund'. Best political moat ever built, and it costs about 1% of his stake a year.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.notboring.co/p/weekly-dose-of-optimism-221", "id": 20}, {"cat": "AI/infra", "urgency": "watch", "source": "Not Boring / Packy McCormick — Weekly Dose #221", "title": "FCC authorizes SpaceX to deploy 1 million orbital compute satellites, a US first", "idea": "The FCC granted SpaceX the first US authorization for a constellation of data centers in space, up to 1M satellites. Starship reportedly became fully reusable last week. Mando: SpaceX is also slashing Blackwell rents after Anthropic left.", "angle": "Orbital compute sidesteps grid interconnect queues and the permitting fights (BAAJA is in the House). But it competes with terrestrial neoclouds just as their rental pricing cracks.", "tweetA": "The FCC approved 1M compute satellites the same week SpaceX cut Blackwell rents because Anthropic walked. SpaceX is building GPU supply in orbit while ground rental prices fall. Bad combination for $CRWV.", "tweetB": "Power is the bottleneck for AI on Earth. In orbit, the sun is free and there's no interconnection queue. Permission is done. The bottleneck is now launch cadence and radiation-hardened chips.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.notboring.co/p/weekly-dose-of-optimism-221", "id": 21}, {"cat": "science", "urgency": "watch", "source": "Not Boring / Packy McCormick — Weekly Dose #221", "title": "Neuralink gets FDA approval for LINK, the first US pivotal BCI trial", "idea": "The FDA cleared Neuralink to launch LINK, the first pivotal trial for an implantable brain-computer interface in the US. ALS patients may be eligible. An early patient reportedly played GTA VI by thought this week.", "angle": "A pivotal trial is the step before commercial approval. BCI moves from demo to regulated medical-device economics, which matters for reimbursement and med-tech comps.", "tweetA": "Pivotal trial means the FDA thinks the safety data supports a path to market. BCI just moved from science fair to reimbursement codes. That's the real milestone, not the GTA VI demo.", "tweetB": "Neuralink pivotal trial, pig kidney at one year, autonomous bio labs. All in one newsletter. Med-tech used to move in decades. This is moving in quarters.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.notboring.co/p/weekly-dose-of-optimism-221", "id": 22}, {"cat": "regulation", "urgency": "deep", "source": "Not Boring / Packy McCormick — Weekly Dose #221", "title": "Senate passes BAAJA permitting reform 62–33: NEPA, CWA, ESA streamlined; transmission, nuclear, data centers fast-tracked", "idea": "The Bipartisan American Affordability and Jobs Act (H.R. 2347) passed the Senate 62–33. It streamlines NEPA, Clean Water Act and Endangered Species Act reviews, with dedicated provisions for transmission lines, nuclear licensing, energy permitting and data center projects. The House is pushing to get it signed before Christmas.", "angle": "Permitting is the real constraint on the AI power buildout. If it passes, it helps grid equipment, nuclear (OKLO, CEG) and EPC names, and makes orbital compute less necessary.", "tweetA": "62 Senate votes for permitting reform in 2026. Transmission and nuclear licensing were the binding constraint on AI power, not chips. If the House passes it, the 2028–2030 grid bottleneck gets a lot narrower. $ETN $GEV $CEG", "tweetB": "Oklo fell 28% in November because its first plant isn't due until 2028. A law that cuts licensing time is worth more to it than any earnings beat. The market sold the power trade right before its biggest policy tailwind.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.notboring.co/p/weekly-dose-of-optimism-221", "id": 23}, {"cat": "venture", "urgency": "watch", "source": "Not Boring / Packy McCormick — Weekly Dose #221", "title": "Hadrian opens a 1M sq ft factory in San Francisco after raising $1.37B at $7.87B", "idea": "Hadrian, the AI-plus-human precision-parts manufacturer, opens a 1M sq ft development factory and engineering campus in SF in January 2027. It recently raised $1.37B at a $7.87B valuation. AI helps automate the work and captures tribal knowledge from skilled machinists.", "angle": "Reshoring precision manufacturing in the most expensive US city works only if AI collapses the labor-skill premium. It's a live test of the 'AI makes US manufacturing competitive' thesis, and a defense-supply-chain signal.", "tweetA": "A million square feet of factory in San Francisco. Four years ago that would have been a joke. It's a bet that recruiting AI talent matters more than land and labor cost, and that's the clearest sign the factory has become a software company.", "tweetB": "$7.87B for a parts machinist. Defense primes trade at 1–2x sales. The market is pricing Hadrian as software-defined manufacturing. If that model works, the legacy aerospace supply base gets repriced.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.notboring.co/p/weekly-dose-of-optimism-221", "id": 24}, {"cat": "science", "urgency": "watch", "source": "Not Boring / Packy McCormick — Weekly Dose #221", "title": "Capable emerges from stealth: vertically integrated autonomous preclinical lab, starting with peptides", "idea": "Capable (founder Isaak Freeman) is building a vertically integrated AI-enabled platform to run experiments, generate data and learn, aiming at human enhancement: endurance, longevity, energy on less sleep, 'unbreakable bones'. It's starting with peptides.", "angle": "AI x bio is moving toward closed-loop labs that own their data generation. Peptides are a fast, gray-zone entry point, with consumer longevity demand already there.", "tweetA": "AI can propose a thousand molecules overnight, but lab throughput is the bottleneck. Capable's bet is that whoever owns the closed loop of experiment, data and model wins bio. Same playbook as Tesla's data advantage.", "tweetB": "Starting with peptides is a tell. Short regulatory path, huge consumer longevity demand, fast iteration. The human-enhancement market is arriving through the gray zone, not through big pharma.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.notboring.co/p/weekly-dose-of-optimism-221", "id": 25}, {"cat": "science", "urgency": "deep", "source": "Not Boring / Packy McCormick — Weekly Dose #221", "title": "First patient to live a full year off dialysis with a pig kidney; eGenesis 33-patient trial in Q1", "idea": "Molly Falco passed one year with an eGenesis pig kidney carrying 69 genetic edits (Nov 22, MGH). Of six recipients since 2024, three currently have functioning grafts. eGenesis begins formal trials with 33 patients in Q1 2027, and United Therapeutics did its first pig thymo-kidney and has FDA clearance for a pig heart trial. The US has 500K+ on dialysis (55% five-year mortality), 90K on the waitlist, and 12 deaths a day waiting.", "angle": "Xenotransplant threatens the economics of the US dialysis duopoly (DaVita, Fresenius) over a 5–10 year horizon. UTHR is the listed pure play.", "tweetA": "500,000 Americans on dialysis, 55% five-year mortality, worse than most cancers. A pig kidney just made it a full year. If xeno scales, the dialysis business model becomes the stranded asset. $DVA $FMS $UTHR", "tweetB": "69 edits to one pig genome, and a former chef is skiing the bunny slopes. The biggest healthcare disruption of the decade may be a farm animal, not a drug.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.notboring.co/p/weekly-dose-of-optimism-221", "id": 26}, {"cat": "positioning", "urgency": "deep", "source": "Young and Calculated", "title": "GS: fundamental L/S clients up ~7% YTD (from 17% at midyear) while systematic clients strengthened", "idea": "Goldman's asset-weighted data shows fundamental equity L/S clients up about 7% YTD, down from about 17% at midyear. Systematic clients' returns improved after midyear. After five straight weeks of gross reductions through Nov 20, clients stopped cutting and added shorts, including index and ETF hedges.", "angle": "Half of the fundamental L/S YTD alpha was given back in H2. Adding index hedges raises gross while lowering net, which means pod risk managers are still tight. That's also the fuel for a squeeze if the China and policy backstop holds.", "tweetA": "Fundamental L/S went from +17% to +7% in five months. Quants improved. After five weeks of degrossing, the street is adding index shorts, not covering. That's the setup for a year-end squeeze nobody is positioned for.", "tweetB": "Note the hedge mechanics: adding $25M of index shorts cuts net exposure but raises gross. Risk desks see more gross, not less risk. The 'de-risking' is mechanically adding to the short base.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://youngandcalculated.substack.com/p/why-a-profitable-quant-team-can-still", "id": 27}, {"cat": "credit", "urgency": "deep", "source": "Young and Calculated", "title": "Correlation math: two strategies going from 0 to 0.8 correlation forces a ~25% cut with no losing trade; France losses spilled into gilt repo", "idea": "With two 10%-vol strategies, uncorrelated gives about 7.1% portfolio vol; at 0.8 correlation it rises to about 9.5%. To restore target vol, both must be cut about 25% even though neither lost money. The BoE FSR (Nov 26) shows the real version: losses on French sovereign positions led some funds to cut exposure in other government-bond markets and gilt repo.", "angle": "Cross-asset contagion goes through the fund's balance sheet, not through fundamentals. A French OAT selloff can force gilt and UST basis unwinds. FTAV adds that British and European banks have taken on a lot of France risk.", "tweetA": "Your strategy can be profitable and still get cut 25%. All it takes is your book's correlation with the pod next door going from 0 to 0.8. Multi-manager risk is a correlation problem, not a P&L problem.", "tweetB": "The BoE just documented it: French bond losses forced funds to shrink gilt repo. If OATs gap again, the selling shows up in markets that have nothing to do with France. Watch the basis trade.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://youngandcalculated.substack.com/p/why-a-profitable-quant-team-can-still", "id": 28}, {"cat": "macro", "urgency": "act", "source": "Mando Minutes", "title": "Hot PCE pushes December Fed hike odds to 93%; prelim Q3 GDP 4.3% vs 3.5% estimate", "idea": "Mando's top stories: hot PCE drove December hike odds to 93%, and preliminary Q3 GDP came in at 4.3% vs a 3.5% estimate. October new home sales surged. Trump wants a probe of 'fake' pre-midterm data. Andreas Steno notes oil is down $61 since October, yet the Fed is set to hike.", "angle": "A Fed hiking into a 4.3% GDP print with oil collapsing is a classic late-cycle policy mistake setup, or a sign of an inflation regime change. The 'fake data' probe adds institutional risk to the data the Fed depends on.", "tweetA": "GDP 4.3%. PCE rising three months in a row. Hike odds 93%. And the President wants to investigate the data. When the data's credibility becomes political, term premium is the release valve. $TLT", "tweetB": "Steno's point is the one that matters: oil down $61 since October and the Fed still hikes. If inflation is sticky without the energy push, the problem is services and wages, and a 25bp hike won't fix that.", "charts": {"count": 1, "hot": false, "desc": "Chart of the day: gold vs 200DMA (see gold item)"}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-1-5846", "id": 29}, {"cat": "positioning", "urgency": "act", "source": "Mando Minutes", "title": "Burry sold all his Nasdaq 100 puts and flipped long; SOXL took in $1.9B this week", "idea": "Mando reports Michael Burry sold all his NDX puts and flipped long. Kobeissi: SOXL (3x semis) pulled in $1.9B this week as traders piled in. FTAV: Nvidia leveraged short ETFs blew up, as they're designed to.", "angle": "The most famous bear capitulating, $1.9B into 3x semis, and GMI Nasdaq fear at 4/100 (Raoul Pal) all suggest a sentiment washout. Retail leverage coming back this fast after a 17% drawdown is a warning that a second leg is possible.", "tweetA": "Burry flips long the same week $1.9B pours into 3x leveraged semis. When the famous bear and the YOLO crowd agree, I look for who's left to buy. $SOXL $QQQ", "tweetB": "Nasdaq fear and greed at 4 out of 100, the famous short covers, and leveraged-short Nvidia ETFs blow up. Textbook capitulation of the bears. The next 2 weeks decide if it was the low or a bear-market rally.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-1-5846", "id": 30}, {"cat": "energy", "urgency": "act", "source": "Mando Minutes", "title": "Houthis hit two oil tanks at Ras Tanura; Saudi shuts Jazan refinery; US confirms direct talks with Iran", "idea": "Mando macro headlines: Houthis hit two oil tanks at Saudi Arabia's Ras Tanura, Saudi shut the Jazan refinery after an attack, the US envoy confirmed direct talks with Iran, and the US renewed its Middle East travel alert. Oil has nonetheless fallen from $102 to $84 over November (Raoul Pal).", "angle": "The market is trading Iran diplomacy, not Gulf infrastructure attacks. Ras Tanura is the world's largest offshore loading terminal, so any escalation leaves the downside skew in crude underpriced at $84.", "tweetA": "Houthis just hit Ras Tanura, the biggest crude export terminal in the world, and oil is down $18 on the month. The market is pricing the Iran talks and ignoring the drones. That gap is the trade. $XLE $USO", "tweetB": "Jazan refinery shut, Ras Tanura tanks hit, US-Iran talks confirmed in the same news cycle. Diplomacy on one hand, drones on the other. Crack spreads, not crude, are where this shows up first. $VLO $MPC", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-1-5846", "id": 31}, {"cat": "gold", "urgency": "deep", "source": "Mando Minutes", "title": "Gold 20% below its 200-day MA, most oversold since 2013; gold and silver bounce", "idea": "Chart of the Day (Kobeissi): gold is 20% below its 200-day moving average, the most oversold since 2013. Gold and silver rallied after the deep sell-off. Benjamin Cowen: BTC usually bottoms after gold and silver. Peter Schiff: gold miners may have bottomed on an outside reversal.", "angle": "Howell (Capital Wars) expects renewed PBoC liquidity to support gold. Combine a 2013-style oversold reading with China easing and gold becomes the cleanest mean-reversion trade, while a rising dollar is the risk.", "tweetA": "Gold 20% under its 200-day. The last time it was this stretched was 2013, and that was the start of a multi-year bear. The difference now is that central banks are buyers and China is about to ease. $GLD $GDX", "tweetB": "Cowen says BTC tends to bottom after gold and silver. Gold just put in its most oversold reading in 13 years and bounced. If the sequence holds, BTC's low is still ahead, not behind.", "charts": {"count": 1, "hot": true, "desc": "🔥 CHART WORTH SAVING: gold % deviation from 200DMA, deepest since 2013 (Kobeissi)"}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-1-5846", "id": 32}, {"cat": "crypto", "urgency": "deep", "source": "Mando Minutes", "title": "Strategy mNAV at a record-low 0.88x (JPM); USDT supply shrank $8.1B in 60 days; Galaxy sees BTC bottom at $28–48K", "idea": "Mando crypto bullets: JPMorgan says Strategy's mNAV hit a record-low 0.88x, and TD Cowen says Strategy can survive BTC at $20K. USDT supply shrank by $8.1B in 60 days. Galaxy sees a BTC bottom at $28–48K, and Trader_XO's value zone is $38–53K. Cardone Capital bought 1K BTC. An ETH ICO whale sold its last $75M of ETH. More than $600M of Binance hack funds moved via THORChain.", "angle": "With mNAV below 1, Strategy can't accretively issue equity to buy BTC. The largest structural bid is switched off, and stablecoin supply shrinkage confirms the liquidity drain.", "tweetA": "Strategy trades at 0.88x its BTC. The flywheel runs in reverse: every share issued now destroys BTC per share. The biggest buyer of this cycle has just been benched. $MSTR $BTC", "tweetB": "USDT supply down $8.1B in 60 days. Stablecoins are crypto's M2, and M2 is contracting. Galaxy's $28–48K bottom range isn't a doom call. It's what a shrinking monetary base implies.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-1-5846", "id": 33}, {"cat": "AI/infra", "urgency": "act", "source": "Mando Minutes", "title": "AI credit cracks: banks to sell $4.5B of CoreWeave loans; SpaceX slashes Blackwell rents after Anthropic exits; S&P puts Nvidia on downgrade watch", "idea": "Mando AI and tech headlines: banks plan to sell $4.5B of CoreWeave loans 'as fears surge'. SpaceX slashed Blackwell rents after Anthropic left. S&P placed Nvidia's rating on downgrade watch. Nvidia will pay $290M to settle a crypto-mining suit and halted chip shipments to Southeast Asia. Polymarket launched Nvidia H100 perps. Nvidia surged pre-market on US stake rumors.", "angle": "GPU rental deflation plus bank loan sales is how the AI credit cycle turns. Compare Trainium3's TCO advantage (SemiAnalysis): the marginal tenant now has cheaper options, so neocloud collateral values fall.", "tweetA": "Banks are selling $4.5B of CoreWeave loans. SpaceX is cutting Blackwell rents because its anchor tenant left. When lenders want out and landlords cut rent, the collateral is repricing. $CRWV $NVDA", "tweetB": "Polymarket launched H100 rental perps the same week Blackwell rents got slashed. GPU-hours just became a tradeable commodity with a forward curve, and the first thing the curve shows is backwardation.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-1-5846", "id": 34}, {"cat": "tech", "urgency": "watch", "source": "Mando Minutes", "title": "Huawei HBM claims 2x Samsung/SK Hynix pin density; the Dutch resist US plans to curb ASML China sales", "idea": "Mando: Huawei's HBM reportedly reaches twice the pin density of Samsung and SK Hynix. The Netherlands will resist US plans to further curb ASML sales to China. Also: Japan's JERA is in talks with US AI firms to build data centers. Anthropic cut API CPU use about 70% by moving to Rust. Google's AI released six papers on the maths behind RSA.", "angle": "Erdil (Dwarkesh) says the EUV export-control lead is a temporary advantage. A Huawei HBM leapfrog plus Dutch pushback shortens that window, a risk to the 'US lead buys 5 years' pacing strategy.", "tweetA": "Huawei claims HBM with 2x the pin density of SK Hynix, and the Dutch just told Washington no on more ASML curbs. Export controls were supposed to buy five years. That's starting to look optimistic. $ASML $MU", "tweetB": "Anthropic cut API CPU use about 70% by rewriting in Rust. In a GPU-scarce world everyone forgets the CPU bill. Rewrites like this are how AI gross margins expand without new chips.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-1-5846", "id": 35}, {"cat": "geopolitics", "urgency": "watch", "source": "Mando Minutes", "title": "UK tells 100K veterans to be ready for call-up; N Korea halts missile supplies to Russia; French GDP -0.2% Q3", "idea": "Mando: the UK told 100K veterans to be ready for call-up. North Korea halted missile supplies to Russia. Trump urged Putin to halt aggression in Europe, and a Russian missile hit a Ukrainian shopping center. French GDP shrank 0.2% in Q3. The BIS's Hernández de Cos will succeed Lagarde at the ECB.", "angle": "European mobilization signals plus French recession plus bank exposure to France (FTAV) is a European fiscal-and-defense squeeze. A BIS technocrat at the ECB suggests a financial-stability-first central bank.", "tweetA": "The UK is telling 100,000 veterans to be ready. France is in contraction. European banks are loaded with French risk. Europe's defense bill is coming due exactly when its fiscal room is gone. $EUAD $BNP", "tweetB": "North Korea stops sending missiles to Russia the same week the UK readies reservists. Either Pyongyang's stockpile is drained, or Moscow's need changed. Either way, the supply chain of this war just shifted.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-1-5846", "id": 36}, {"cat": "labor", "urgency": "watch", "source": "Mando Minutes", "title": "SAP weighs 10K+ job cuts in AI restructuring; IBM tells H-1B consultants to leave the US or resign", "idea": "Mando tech headlines: SAP is weighing more than 10K job cuts in an AI-driven restructuring. IBM told H-1B consultants to leave the US or resign. Situational Awareness (the fund) was hit by 65% losses in Q3.", "angle": "Enterprise software incumbents are cutting at scale, which supports Erdil's view (Dwarkesh) that the premium for experience is collapsing. The IBM H-1B move ties labor policy to the AI-substitution story.", "tweetA": "SAP cutting 10K+ for 'AI restructuring' is the enterprise-software version of the entry-level dev crisis. Headcount isn't moving to AI-native companies. It's being removed. $SAP", "tweetB": "IBM is telling H-1B consultants to leave the country or quit. The offshore-consulting model was arbitrage on human labor cost. AI is arbitraging the arbitrage. $INFY $ACN", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-1-5846", "id": 37}, {"cat": "macro", "urgency": "deep", "source": "The Boock Report / Peter Boockvar", "title": "Data center capex in the data: machinery orders +16.7% y/y, primary metals +19%, core durables +1.2% vs +0.7% est", "idea": "October core durable goods orders rose 1.2% m/m (est. +0.7%), and September was revised up to +0.8%. Machinery orders rose 1.8% m/m and 16.7% y/y, electrical equipment +4.2% y/y, primary metals +19% y/y, autos/parts +7% y/y. Boockvar ties it explicitly to the data center build. Also: claims fell to 189k (11k below est.), personal income rose 0.7% (est. +0.4%), private wages +0.5%, and the savings rate rose to 4.1% from 3.6%.", "angle": "The real economy is running hot from AI capex even while AI equities sell off. Machinery +16.7% y/y is the physical-layer confirmation, so the Fed hike case gets stronger.", "tweetA": "AI stocks had their worst week since March 2020. Meanwhile machinery orders are up 16.7% y/y and primary metals 19%, because data centers are still being built. Equity sentiment broke, but the physical buildout didn't. $CAT $ETN", "tweetB": "Claims at 189k, income +0.7%, savings rate up to 4.1%, core capex beating. This isn't an economy that needs help. It's one the Fed thinks needs a hike, and the data agree.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://peterboockvar.substack.com/p/succinct-summation-of-the-weeks-events-d97", "id": 38}, {"cat": "macro", "urgency": "deep", "source": "The Boock Report / Peter Boockvar", "title": "Conference Board confidence jumps to 103.3 from 91.9, but 1-year inflation expectations stuck at 5.7%", "idea": "November consumer confidence rose to 103.3 from 91.9, with Present Situation and Expectations both up. Jobs 'plentiful' rose 4.6 pts to the best since May 2025, and 'more jobs ahead' rose 2.8 pts. One-year inflation expectations stayed at 5.7% (from 5.8%). Big-ticket spending intentions improved. Write-ins mentioned war and conflict a bit more.", "angle": "An 11-point jump in confidence with 5.7% inflation expectations is not a Fed-friendly mix. It supports the December hike pricing.", "tweetA": "Confidence +11 points in a month. Households expect 5.7% inflation over the next year, and they're planning to buy cars, homes and appliances anyway. Consumers aren't afraid of inflation anymore, they're used to it. That's what should worry the Fed.", "tweetB": "Jobs 'plentiful' at the best level since May 2025, while Wall Street had its worst Nasdaq week since 2020. Main Street and the market are reading different charts.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://peterboockvar.substack.com/p/succinct-summation-of-the-weeks-events-d97", "id": 39}, {"cat": "macro", "urgency": "watch", "source": "The Boock Report / Peter Boockvar", "title": "Container rates falling but still ~3x February: Shanghai–LA $6,437 vs $2,191; Shanghai–NY $7,615 vs $2,771", "idea": "Shanghai–LA rates fell 8.4% for a third weekly drop to $6,437 per 40ft, the lowest since August but still about 3x the $2,191 of late February. Shanghai–NY fell for a fifth week, down 7% to $7,615 (vs $2,771 in February). Purchase mortgage applications jumped 10.2% w/w even with 30-year rates at 7.38%. Richmond manufacturing turned positive at +3, with prices paid and received still very elevated.", "angle": "Freight is still a goods-inflation headwind until rates return to February levels. The decline tracks oil falling from $102 to $84.", "tweetA": "Container rates are 'falling', from 3x to just under 3x where they were in February. Goods disinflation from shipping is a 2027 story, not a December one. The Fed knows it. $ZIM $MATX", "tweetB": "Purchase mortgage apps +10% with 30-year rates at 7.38%. Housing demand isn't dead at 7%+, it was on pause. That tells you the neutral rate is higher than the Fed thinks.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://peterboockvar.substack.com/p/succinct-summation-of-the-weeks-events-d97", "id": 40}, {"cat": "AI/infra", "urgency": "deep", "source": "SemiAnalysis — Trainium3 InferenceX", "title": "Trainium3 + vLLM: 73.5% token margin vs 53% for GB300 + SGLang at 135 tok/s/user", "idea": "On InferenceX/AgentX (replayed real coding-agent sessions), Trainium3 has better perf per TCO than every accelerator except Vera Rubin across the whole interactivity curve. At p90 135 tok/s/user, with Z.ai list prices and 60% fleet utilization, Trainium3 yields a 73.5% profit margin vs GB300's 53% (3-year rental prices). It has only 17% of Blackwell Ultra's FP4 FLOPS (2,517 vs 15,000 TFLOPS) and 61% of its bandwidth (4.9 vs 8.0 TB/s), at about 30% of the TCO. It lags on TTFT because prefill is compute-bound.", "angle": "This undercuts the Nvidia monopoly-margin thesis for decode-heavy agentic inference, and it explains why GPU rents are cracking. Bullish $AMZN AWS margins, plus Astera and Marvell in the Trainium supply chain.", "tweetA": "Trainium3 has 17% of GB300's FLOPS and earns 20 points more margin per token. Agentic inference is memory-bound decode, not compute. Nvidia is selling FLOPS to a workload that pays for bandwidth per dollar. $AMZN $NVDA", "tweetB": "Do the math: 61% of the bandwidth at 30% of the TCO is about 2x the bandwidth per dollar. That's the margin gap. When the customer is a coding agent streaming tokens, the cheapest bytes per second wins.", "charts": {"count": 6, "hot": true, "desc": "🔥 CHART WORTH SAVING: InferenceX Pareto frontier, perf per TCO vs p90 interactivity (Trainium3 beats all but Vera Rubin); plus margin-by-accelerator chart"}, "link": "https://newsletter.semianalysis.com/p/trainium3-inferencex", "id": 41}, {"cat": "AI/infra", "urgency": "deep", "source": "SemiAnalysis — Trainium3 InferenceX", "title": "'Short King' thesis: Trainium3 wins with 144GB HBM, half GB300's, and next-gen parts are moving to 4-Hi/8-Hi", "idea": "Trainium3 gets these margins with 144GB of HBM per chip, half GB300's capacity. SemiAnalysis's 'Short King' thesis: extra HBM capacity must deliver enough throughput at the target latency to justify its cost. That's why 4-Hi is attractive industry-wide and next-gen accelerators mostly use 8-Hi, not 12/16-Hi.", "angle": "This is a direct hit to the 'HBM content per GPU only goes up' bull case for memory. Bit growth could come from more chips with shorter stacks, which changes the mix for SK Hynix, Micron and Samsung.", "tweetA": "The memory bull case assumes HBM per accelerator goes up forever. SemiAnalysis says the best-margin inference chip uses half the HBM, and the industry is moving to shorter stacks. Bits still grow, but the 'more layers' premium shrinks. $MU", "tweetB": "'Short King': HBM capacity only earns its cost if it buys throughput at your latency target. That's a capital-efficiency test the 2024–25 memory supercycle never had to pass.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://newsletter.semianalysis.com/p/trainium3-inferencex", "id": 42}, {"cat": "AI/infra", "urgency": "deep", "source": "SemiAnalysis — Trainium3 InferenceX", "title": "Trainium3n gen-2 racks: 320-lane Astera Scorpio X switches in a single plane, 2.8x all-to-all bandwidth", "idea": "Gen-1 Trainium3 racks used 160-lane Astera Scorpio X switches in a dual-plane design, so some chips were two hops apart. Gen-2 (trn3n) uses 320-lane Scorpio X, with 8 switches forming one plane for all 32 chips. That gives 2.8x all-to-all bandwidth, which is critical for MoE. At UltraServer scale, all-reduce and reduce-scatter are a fifth to a quarter faster. Chip-level all-to-all is 9–10x faster than node or rack level.", "angle": "This is an Astera Labs content win: double the lanes per switch on every new AWS rack. Clear evidence that scale-up networking is a fast-growing piece of AI capex.", "tweetA": "AWS moved from 160-lane to 320-lane Astera switches and got 2.8x all-to-all for MoE. Every MoE model is an all-to-all problem. The switch vendor is the quiet winner in Trainium's TCO story. $ALAB", "tweetB": "The checkerboard latency pattern in gen-1 racks came from a lane-count limit. Fixing one switch spec unlocked 2.8x expert-parallel bandwidth. In AI, the bottleneck keeps moving to the parts nobody models.", "charts": {"count": 3, "hot": false, "desc": "Collective bandwidth/latency curves gen1 vs gen2; chip-to-chip latency heatmap (checkerboard)"}, "link": "https://newsletter.semianalysis.com/p/trainium3-inferencex", "id": 43}, {"cat": "tech", "urgency": "watch", "source": "SemiAnalysis — Trainium3 InferenceX", "title": "MXFP8 power-throttles to 68.6% MFU on Trainium3; profiler 'loved by Anthropic performance engineers'", "idea": "With full-chip load, BF16 runs near max throughput and FP8 and MXFP4 reach about 90% MFU, but MXFP8 throttles to 68.6% MFU. Clock-limiting to 2GHz shows power, not design, is the limit. Separately, SemiAnalysis says Trainium's profiler is industry-leading, and Anthropic's head of performance has said profiling on Trainium beats Nvidia's.", "angle": "Power density, not FLOPS, caps low-precision throughput. Software tooling is now a Trainium moat for Anthropic, which deepens AWS–Anthropic lock-in as Anthropic leaves SpaceX's Blackwell capacity.", "tweetA": "MXFP8 runs at 68.6% MFU because the chip hits its power limit. Peak FLOPS in low-precision formats are a marketing number. Watts per token is the spec that matters.", "tweetB": "Anthropic's performance engineers prefer Trainium's profiler to CUDA tooling. The CUDA moat was always the developer experience. If the biggest model lab finds the tools better elsewhere, that moat has a leak. $AMZN", "charts": {"count": 2, "hot": false, "desc": "MFU by precision under full-chip load; throttled vs clock-limited comparison"}, "link": "https://newsletter.semianalysis.com/p/trainium3-inferencex", "id": 44}, {"cat": "labor", "urgency": "deep", "source": "TWiST / LAUNCH", "title": "New-grad dev playbook (tidy GitHub, LeetCode) is obsolete now that coding agents do the entry-level work", "idea": "A viral r/SoftwareEngineerJobs post raised the problem: the new-grad hiring playbook was built for hand-written code. With agents doing entry-level work, how do juniors learn the trade? LAUNCH asked founders what AI-native companies want. Tip #1, from Karpathy (now on Anthropic's pre-training team): design a detailed spec with your agent, then actually deploy it.", "angle": "Erdil (Dwarkesh) says hiring processes are 'in complete denial'. The junior pipeline problem is a 5–10 year talent-supply risk for software firms, and a demand signal for AI-native education.", "tweetA": "If agents do the junior work, where do seniors come from in 2035? Every industry that killed its apprenticeship rung learned this the hard way. Software is next.", "tweetB": "Karpathy's advice to new grads isn't 'learn to code'. It's 'spec it with your agent and ship it'. The scarce skill is turning ambiguity into a deployable plan. That's product management, not engineering.", "charts": {"count": 1, "hot": false, "desc": "Screenshot of viral X post / Reddit comment"}, "link": "https://twistartups.substack.com/p/5-ways-early-career-builders-can", "id": 45}, {"cat": "geopolitics", "urgency": "watch", "source": "Doomberg", "title": "Doomberg: is the Jensen Huang scandal cover for the US government monopolizing recursive self-improvement?", "idea": "Doomberg goes from I.J. Good's 1966 'ultraintelligent machine' to today's race for recursive self-improvement at Google, SpaceX, newly public Anthropic and OpenAI. It notes that insider murmurs say RSI has already been achieved privately, and that a P = NP-style encryption break is among the 'benign' implications. The question: if Washington believed it had unlocked 'God mode', would November's strange Nvidia headlines look like this?", "angle": "Speculative, but it fits a pattern: S&P downgrade watch, a re-hire scandal, SE Asia shipment halt, 'US stake' rumors. State control of compute is a real tail risk for $NVDA equity holders.", "tweetA": "Nvidia halts SE Asia shipments, gets put on S&P downgrade watch, rallies on US-stake rumors, and the CEO saga goes on. Doomberg asks the uncomfortable question: what if the government decided compute is too strategic to leave private?", "tweetB": "I.J. Good, 1966: the first ultraintelligent machine is 'the last invention that man need ever make'. If anyone believed that in 2026, nationalizing the chip supply wouldn't be a conspiracy theory. It would be standard defense procurement.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://newsletter.doomberg.com/p/do-not-pass-go", "id": 46}, {"cat": "regulation", "urgency": "deep", "source": "FT Alphaville / Bryce Elder", "title": "BoE Financial Stability Report Q&A was nearly all about frontier AI threats to bank infrastructure", "idea": "Almost every question at the BoE FSR Q&A was about frontier AI risk to critical bank infrastructure. Bailey said developers are worried new models have 'even more powerful properties' and that 'we are, as they put it now, on the exponential part'. FTAV mocks the commentariat's overnight P vs NP expertise and Scott Aaronson's alarmist dinner-party post on suppressed 'bombshell' discoveries.", "angle": "When central bank press conferences shift from rates to AI cyber-risk, expect supervisory demands for post-quantum and post-AI cryptographic migration. That's a spending wave for bank IT and cyber vendors.", "tweetA": "The Bank of England held a financial-stability press conference and nearly every question was about AI breaking bank infrastructure. Not rates, not France, not private credit. The risk agenda just changed. $CRWD $PANW", "tweetB": "FTAV's line: treat theoretical computer scientists' speculation like that of 'theoretical dentists'. Fair, but the people running Cobol cores aren't asked whether RSA survives. Regulators asking the question is enough to force a migration budget.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://ftav.substack.com/p/zero-sum-thinking", "id": 47}, {"cat": "credit", "urgency": "deep", "source": "FT Alphaville / Bryce Elder", "title": "FTAV week: British and European banks loaded with France risk; private credit's 'alpha' problem; SpaceX's Black Friday bond hangover", "idea": "The Alphaville roundup: British and European banks have taken on a lot of France risk. Private credit has an 'alpha' problem. SpaceX has a big Black Friday bond hangover. BlackRock wants private-market ETFs. Nvidia leveraged short ETFs blew up. The viral claim of OTM Nvidia call buying before Jensen's re-hire appears false. Martin Wolf: a French crisis is both threat and opportunity for Europe.", "angle": "France plus French GDP -0.2% (Mando) plus the BoE showing French losses spill into gilt repo (Young and Calculated) all point to one risk. European banks are the transmission channel.", "tweetA": "French GDP shrinks 0.2%. The BoE says French bond losses forced funds to cut gilt repo. FTAV flags UK and EU banks heavy on France risk. That's three sources and one contagion map. $EWQ $BNP", "tweetB": "BlackRock wants to put private markets in an ETF the same week FTAV writes about private credit's 'alpha' problem. When the alpha fades, the product becomes a wrapper with a liquidity mismatch.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://ftav.substack.com/p/zero-sum-thinking", "id": 48}, {"cat": "culture", "urgency": "watch", "source": "FT Alphaville / Bryce Elder", "title": "Of the UK's 90 'comically complicated' taxes, six predate 1800; the oldest, the prisage on wine, dates to 1302", "idea": "FT charts roundup: the UK has 90 taxes, six of which date back to before 1800, and the oldest, the prisage (a medieval duty on wine), dates to 1302. Also: Burn-Murdoch on a transatlantic divide between hoarding by the rich and middle-class stagnation, and Soumaya Keynes on the 'frustratingly fuzzy' topic of food affordability.", "angle": "Tax-code sprawl is a productivity drag and a signal of state capacity. Burn-Murdoch's wealth-hoarding chart is relevant to the consumer K-shape.", "tweetA": "The UK still has a tax on its books from 1302. Not reforming your tax code for 700 years is a choice. It tells you how hard it will be to rebuild the state for AI.", "tweetB": "90 taxes, six older than the United States. Every Budget adds complexity and none removes it. The UK's productivity puzzle isn't a puzzle.", "charts": {"count": 1, "hot": false, "desc": "FT charts (Burn-Murdoch wealth chart linked); charts inside, worth opening"}, "link": "https://ftav.substack.com/p/zero-sum-thinking", "id": 49}, {"cat": "macro", "urgency": "deep", "source": "The Exponentialist / Raoul Pal", "title": "Raoul Pal: a 'liquidity panic', not the end of the cycle, with the dollar doing more than half the tightening", "idea": "The Nasdaq 100 had its worst week since March 2020 (week to Nov 20) and closed the 25th 17% below its Oct 6 high. Nvidia fell 14% on strong earnings, and Anthropic's record IPO ($81bn raised) closed below its $83 offer. DXY went from 102.2 to 103.7 (high 104.3) and broke out of its channel, with a December 9 hike fully priced. The dollar did more than half of the financial-conditions tightening since February, and a rising dollar also shrinks dollar-measured global liquidity. Yet ISM is above 50, claims are below last year, junk spreads are under stress levels, and oil fell from $102 to $84.", "angle": "The trade hinges on the dollar. If DXY rolls over after the December hike, the liquidity bulls are right. Capital Wars' Howell is more bearish (1930s risk), a useful counterpoint.", "tweetA": "Anthropic raised $81B in the biggest IPO ever and closed below its offer. Nvidia beat and fell 14%. When good news gets sold, it's not about the news. It's about the dollar. DXY is the only chart that matters into December 9.", "tweetB": "Pal says 'liquidity panic'. Howell says '1930s debt deflation'. Same data, rising dollar and falling global liquidity, read in opposite directions. The difference: Pal sees the US and China still creating liquidity, Howell sees both with their hands tied.", "charts": {"count": 2, "hot": false, "desc": "Financial conditions index and DXY channel charts likely; charts inside, worth opening"}, "link": "https://theexponentialist.substack.com/p/portfolio-update-cc8", "id": 50}, {"cat": "positioning", "urgency": "act", "source": "The Exponentialist / Raoul Pal", "title": "GMI fear & greed: Nasdaq 4/100, crypto 11/100 on Nov 23", "idea": "On Nov 23 the GMI fear and greed gauge read 4 out of 100 for the Nasdaq and 11 for crypto, extreme fear on both. Pal sees a high probability the low comes within weeks if it isn't already in. His book's average position fell 17% in November. The hit rate dropped to 46% from 63%, and Apple leads at +83%.", "angle": "A sentiment extreme plus Burry flipping long plus GS clients adding index shorts is a contrarian long setup. The risk is the December 9 hike and DXY.", "tweetA": "Nasdaq fear and greed: 4 out of 100. Not 20, not 10. Four. You don't get readings like that at tops. The question is whether the Fed hike on December 9 is the final flush or the start of something worse. $QQQ", "tweetB": "A strategist's book fell 17% in a month, and he's telling you the bottom is close. Unusually honest, and it's what capitulation looks like from inside a long-only book.", "charts": {"count": 1, "hot": false, "desc": "GMI fear & greed gauges"}, "link": "https://theexponentialist.substack.com/p/portfolio-update-cc8", "id": 51}, {"cat": "crypto", "urgency": "deep", "source": "The Exponentialist / Raoul Pal", "title": "Circle -41% with USDC flat at $73.9bn, but on-chain volume up 49% y/y", "idea": "Circle fell 41% after a Q3 with USDC in circulation flat y/y at $73.9bn and reserve income down 8% as rates fell. Coinbase fell 36% (weak quarter, Morgan Stanley downgrade, Binance hack). Robinhood -28%. BTC -26% to $58,800 on the 20th, ETH -28%, SOL -31%, and more than $1bn left the ETH ETFs in November. But Circle's on-chain volume was up 49% y/y.", "angle": "Usage is up while revenue is flat, the classic stablecoin dilemma. Circle is a rate-sensitivity trade, not an adoption trade. A Fed hike helps Circle's float income even as it hurts crypto prices.", "tweetA": "Circle: USDC volume +49%, USDC supply flat, reserve income -8%, stock -41%. Stablecoin adoption and stablecoin economics have decoupled. Circle earns on balances, not velocity. $CRCL", "tweetB": "Odd setup: a Fed hike is bad for every crypto asset except the stablecoin issuer, whose float income goes up. Circle at -41% is the one crypto name the December hike might help.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://theexponentialist.substack.com/p/portfolio-update-cc8", "id": 52}, {"cat": "tech", "urgency": "deep", "source": "The Exponentialist / Raoul Pal", "title": "Hims & Hers -50% on a real business miss: revenue $890m, subscribers down 100K to 2.8M", "idea": "Hims & Hers did the most damage in Pal's book, down 50%. Q3 revenue of $890m missed. Subscribers fell 100K to 2.8 million. The company cut its full-year adjusted EBITDA guide midpoint to $267m from $300m, blaming UK and Germany pricing and marketing and weight-loss revenue slipping into January. Pal: 'a business miss, not only a market move'.", "angle": "Subscriber decline suggests the compounded GLP-1 tailwind is fading as branded supply normalizes. International expansion is expensive. Telehealth DTC unit economics are getting squeezed.", "tweetA": "Hims lost 100,000 subscribers in a quarter. The GLP-1 compounding boom was a supply-shortage business, and the shortage ended. $HIMS", "tweetB": "Raoul's own words: 'a business miss, not only a market move'. In a liquidity panic, separate the stocks that fell from the ones that broke. Hims broke.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://theexponentialist.substack.com/p/portfolio-update-cc8", "id": 53}, {"cat": "energy", "urgency": "watch", "source": "The Exponentialist / Raoul Pal", "title": "AI power names sold with everything: Oklo -28%, Constellation -9% after beating and raising", "idea": "Oklo fell 28% despite a smaller-than-expected Q3 loss, since its first plant isn't due until 2028. Constellation fell 9% after raising its FY guide to $12.50–12.80. ARKK -22%, ROBO -16%, TAN -14%. What held up were cash-flow names: Apple hit a record $356.27 on record September-quarter revenue of $114.5bn (+12%), and IHE big pharma rose 5%. The FT reports SpaceX and Tesla have picked banks for a possible all-stock merger.", "angle": "The Senate's BAAJA permitting bill (Not Boring) directly shortens nuclear licensing. Power names sold off ahead of a policy catalyst. Constellation's beat-and-raise sell-off is the clearest value signal.", "tweetA": "Constellation beat, raised guidance, and fell 9%. In a liquidity panic, the market sells cash-flow AI power alongside pre-revenue AI power. That's the entry, not a warning. $CEG $OKLO", "tweetB": "The Senate passed a permitting reform with nuclear licensing provisions the same month Oklo fell 28%. The market priced the dollar, not the policy. Policy outlasts a month of dollar strength.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://theexponentialist.substack.com/p/portfolio-update-cc8", "id": 54}, {"cat": "AI/infra", "urgency": "deep", "source": "Dwarkesh Podcast — Kokotajlo vs Erdil", "title": "Kokotajlo (>50%) vs Erdil (~20%): intelligence explosion before 2029, and they agree it barely matters", "idea": "Daniel Kokotajlo (AI Futures Project) thinks full automation of AI research is slightly more likely than not in 2027, with superintelligence soon after. Ege Erdil (now at Google DeepMind) gives a software-only singularity 10–20% over three years, with a 15–20 year median to full automation without RSI. Both say even 20% demands a plan. Erdil is against pausing now because the public doesn't yet understand what's at stake. Kokotajlo proposes capping AI R&D compute at 10% of company compute.", "angle": "A 10% R&D-compute cap or pacing regime would directly hit frontier-lab compute demand. It's a policy tail to price alongside BAAJA, export controls and the BoE's new AI-risk focus.", "tweetA": "The 'skeptic' in this debate gives a 20% chance of an intelligence explosion in three years. That's the skeptic. Nothing in markets is priced for 1-in-5 odds of the economy being rewritten by 2029.", "tweetB": "Kokotajlo's proposal: cap AI R&D at 10% of each lab's compute. That's a supply shock to the biggest marginal GPU buyer. If pacing ever becomes policy, the capex models break before the AI does. $NVDA", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.dwarkesh.com/p/daniel-kokotajlo-ege-erdil", "id": 55}, {"cat": "venture", "urgency": "deep", "source": "Dwarkesh Podcast — Kokotajlo vs Erdil", "title": "Erdil's 2027 prediction: top AI company at $250–300B annualized revenue, up from Anthropic's ~$90B now", "idea": "Asked for end-2027, Erdil gives a median $250–300B annualized revenue for the top AI company, versus about $90B for Anthropic today (2.5–3x). He also expects AIs that can beat any Steam game and control robots to do simple physical tasks like folding laundry at about human speed. Kokotajlo expects 2027 to 'look like AI 2027'.", "angle": "Anthropic's IPO closed below offer (Raoul Pal) while a DeepMind researcher forecasts 3x revenue in a year. The equity is pricing the dollar and the hike, not the revenue curve.", "tweetA": "Anthropic IPO'd, raised $81B, and closed under its offer. A DeepMind researcher's median is that the top lab does $250–300B run-rate by end-2027, 3x today. One of those is wrong by a lot.", "tweetB": "$300B in annual revenue would be bigger than Microsoft's entire 2025 revenue, at a company that was a research lab five years ago. Even half of Erdil's median would be the fastest corporate scaling ever recorded.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.dwarkesh.com/p/daniel-kokotajlo-ege-erdil", "id": 56}, {"cat": "labor", "urgency": "deep", "source": "Dwarkesh Podcast — Kokotajlo vs Erdil", "title": "Erdil: 'the premium for software engineering experience has gone way down', and hiring is 'in complete denial'", "idea": "Erdil argues AI models (Claude Fable 5.2, Gemini 4.0 Neon, Astra 6.2) understand economics better than the median professional economist. He says the premium for hands-on knowledge-work experience has collapsed outside world-class specialists. What still matters is execution and judgment, which AIs are bad at. Dwarkesh's corollary: once AIs gain on-the-job learning, near-zero hiring and firing friction makes labor disruption much bigger than expected.", "angle": "This lines up with SAP's 10K cuts and the TWiST new-grad item. The scarce input moves from experience to judgment and execution. Expect wage compression in mid-career knowledge work.", "tweetA": "A DeepMind researcher says today's models beat the median professional economist 'and it's not even close'. Fields without a hard metric like 'solved Riemann' can deny it longer, but not forever.", "tweetB": "Dwarkesh's real insight: the AI 'diffusion lag' is a capability gap, not adoption friction. Once agents learn on the job, you can spin up 100 workers today and zero tomorrow. No human labor market has ever had that elasticity.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.dwarkesh.com/p/daniel-kokotajlo-ege-erdil", "id": 57}, {"cat": "geopolitics", "urgency": "deep", "source": "Dwarkesh Podcast — Kokotajlo vs Erdil", "title": "Both agree: the US antagonizing China undermines the treaty superintelligence will need; the EUV lead is temporary", "idea": "Erdil says the US (and to some extent Anthropic) stance toward China is 'very myopic and dangerous' because any global slowdown needs coordination. Kokotajlo agrees a treaty is eventually needed. Erdil: China lacks EUV now, but at its rate of industrial progress that lead lasts maybe five years. He quotes Gwern: if the US 'wins', then what? Does it try to topple Beijing? China will assume so.", "angle": "This pairs with Huawei's HBM pin-density claim and Dutch pushback on ASML curbs. The export-control window is closing faster than five years, which is a risk for the 'US lead' premium in semis.", "tweetA": "The AI safety hawk and the AI skeptic agree on one thing: hostility toward China is the biggest obstacle to the treaty both say we'll need. That's not the consensus in Washington.", "tweetB": "Gwern's question, which nobody in DC answers: say the US gets superintelligence first. Then what? If Beijing thinks the answer is regime change, every 'slowdown' offer reads as a trap.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.dwarkesh.com/p/daniel-kokotajlo-ege-erdil", "id": 58}, {"cat": "macro", "urgency": "deep", "source": "Capital Wars / Michael Howell", "title": "Howell: China's bond yields imply 2–3% nominal GDP vs official 4–5% real; 1930s debt-deflation parallel", "idea": "Using the standard nominal-growth-to-yield relationship, China's low government bond yields fit NGDP growth of about 2–3%, far below the official 4–5% real growth. US NGDP around 6% explains higher UST yields, a 1970s-like path. China is in 1930s territory: external creditor strength masking internal debt deflation, as with 1930s America and France. The State Council's Nov 27 signal drove the Shanghai Composite +3.7%, its best day in two years, but it is 'not yet a major liquidity injection'.", "angle": "Asian markets led the sell-off ahead of Wall Street. If the PBoC follows with real liquidity, it's bullish for gold (Howell's call) and Asian equities. Without it, the rally fades.", "tweetA": "China's bond market says nominal GDP is growing 2–3%. The official number says 4–5% real. One of them is lying, and bond markets usually aren't. $FXI $CNY", "tweetB": "The US looks like the 1970s, China looks like the 1930s, and they share one global liquidity pool. Neither will move: the Fed won't ease into inflation, and Beijing won't reflate into a stronger yuan. Gold is the asset that works in both.", "charts": {"count": 1, "hot": true, "desc": "🔥 CHART WORTH SAVING: China vs US 10y government bond yields overlaid on the 1930s and 1970s analog paths"}, "link": "https://capitalwars.substack.com/p/chinas-gathering-debt-deflation-risk", "id": 59}, {"cat": "gold", "urgency": "deep", "source": "Capital Wars / Michael Howell", "title": "Howell expects renewed PBoC liquidity, and gold to benefit", "idea": "Howell's conclusion: patience is needed, but expect renewed PBoC liquidity provision and resulting support for gold. A debt-heavy world has big liquidity needs, and with both the US and China constrained, 'the spectre of a 1930s-like decade looms'.", "angle": "This combines with Kobeissi's gold-20%-below-200DMA (most oversold since 2013) reading. A liquidity catalyst plus an extreme technical setup is the best asymmetric gold entry since 2013, as long as DXY peaks.", "tweetA": "Gold is 20% below its 200-day, the most oversold since 2013. The world's best-known liquidity tracker says the PBoC is about to inject. Oversold plus a catalyst is the setup you wait years for. $GLD", "tweetB": "Howell's 1930s parallel: creditor nations with huge reserves weren't protected when liquidity dried up. That describes China in 2026. The PBoC's way out is printing, and it historically shows up in gold first.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://capitalwars.substack.com/p/chinas-gathering-debt-deflation-risk", "id": 60}, {"cat": "positioning", "urgency": "act", "source": "Cubic Analytics", "title": "Cubic: stocks gapped up and closed at the highs; the 200-day MA cloud is the next inflection", "idea": "Cubic Analytics says Friday's session gapped higher at the open and held momentum into a close at the highs. The setup is 'breakout, retest, rebound'. A break above the 200-day MA cloud would make a fully bullish regime much more likely. He disclosed new buys behind the paywall.", "angle": "A close at the highs on a thin holiday session with a China backstop is positive but low-volume. The 200DMA test is the line, with the December 9 FOMC the catalyst.", "tweetA": "Gap up, closed at the highs, on Black Friday volume. I'd want to see it hold on Monday's real volume before calling it. The 200-day cloud is the line, and the FOMC is 8 trading days away. $SPY", "tweetB": "Funny week. Nasdaq fear at 4/100 and Burry flipping long on one side. A Fed hike priced at 93% on the other. Technicians say 'retest the 200-day'. Macro says 'hike'. One of them gets humbled by December 9.", "charts": {"count": 1, "hot": false, "desc": "S&P chart with 200-day MA cloud"}, "link": "https://cubicanalytics.substack.com/p/what-i-bought-today", "id": 61}];

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
