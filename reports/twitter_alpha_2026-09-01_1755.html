<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-09-01T17:23:31Z", "input_stats": {"total_tweets": 222, "unique_authors": 76, "tweets_with_images": 39, "after_noise_filter": 58}, "summary": "**Fed/Rates:** Warsh's hawkish tilt is repricing the curve — 2yr and 10yr yields hit new YTD highs and mortgage rates are climbing back to 7%. **Geiger_Capital** called it a top, **Jim Cramer** flipped from cautious to \"Warsh turned out to be a wolf\" and started locking in gains, while **Bob Elliott** dug up Warsh's past hawkish record during 10% unemployment as a warning sign.\n\n**Middle East:** Iran/Hormuz tensions grind into September with fresh Trump strike threats. **Z Riboua** argues Tehran's regional force-multiplier network (Hezbollah, Houthis, Assad's Syria) has unwound since October 7, leaving Iran isolated even as Russia supplies equipment but withholds fighter jets.\n\n**Crypto/Robinhood Chain:** Social-trading mania around Robinhood Chain and the FOMO app is the dominant crypto storyline — **0xSammy** flags a new activity ATH, **thedefivillain** is skeptical the user growth is real, and **zeroxkyle** argues Solana fumbled its tokenized-stock lead. **Andy Constan (dampedspring)** ran an extended thread on bond-market mechanics and Fed levers to rally the long end.\n\n**Security alert:** A wave of X account compromises and phishing (password-reset spam, a Dropbox breach) hit **Jameson Lopp**, **Nic Carter**, **mert**, **krugermacro** and **Chartfest1** (whose account was actually hacked) — worth an immediate settings check.\n\n**AI:** A jailbroken GLM 5.3 model with safety guardrails stripped is circulating (**cryptopunk7213**), echoing **Haseeb Qureshi's** warning that rogue AIs can already self-fund via crypto/GPU rails. Apple's John Ternus era begins amid an escalating Apple-OpenAI trade-secrets dispute (**Gene Munster**).", "sections": {"A_events": [{"cluster": "Fed — Warsh Confirmation Fears Send Yields to New Highs", "category": ["macro"], "items": [{"author": "Geiger_Capital", "summary": "US 2-year and 10-year yields both hit new YTD highs and mortgage rates are climbing back toward 7%, which Geiger frames sarcastically against renewed Middle East involvement.", "tweet_url": "https://x.com/Geiger_Capital/status/2094771940779016523", "images": ["https://pbs.twimg.com/media/HRIf-qxWsAAaJt0.jpg"], "type": "tweet"}, {"author": "Geiger_Capital", "summary": "Quote-tweeting a bearish-rates take (\"I don't see how rates can go down\"), Geiger flags it bluntly as a contrarian top signal.", "tweet_url": "https://x.com/Geiger_Capital/status/2094773880250372260", "images": [], "type": "tweet"}, {"author": "jimcramer", "summary": "Live-reacting through the session: opens skeptical (\"Warsh means business... Bessent not so much\"), turns explicitly bearish (\"Warsh turned out to be a wolf\"), then says he's \"taking some action to lock in gains.\"", "tweet_url": "https://x.com/jimcramer/status/2094733263973568906", "images": [], "type": "tweet"}, {"author": "BobEUnlimited", "summary": "Pushes back hard on giving Warsh credit, digging up his record of arguing for aggressive hikes to fight \"imaginary inflation\" while unemployment was at 10% during his prior Fed stint.", "tweet_url": "https://x.com/BobEUnlimited/status/2094758081427099763", "images": [], "type": "thread"}, {"author": "BobEUnlimited", "summary": "Separately posts a chart showing Euro area headline inflation is above target and rising, questioning whether Lagarde will deliver hikes or stay spooked by the ghost of Trichet.", "tweet_url": "https://x.com/BobEUnlimited/status/2094776034046750741", "images": ["https://pbs.twimg.com/media/HRIZQRbWEAAwlMh.png"], "type": "thread"}, {"author": "dampedspring", "summary": "Andy Constan argues any interference with the long bond when term premium and curve steepness are already low is \"by definition panic,\" and lays out the only three real levers to rally the long end: anti-growth/anti-inflation policy, pushing institutions to buy bonds, and buyback/issuance composition changes.", "tweet_url": "https://x.com/dampedspring/status/2094801074787848596", "images": [], "type": "thread"}, {"author": "dampedspring", "summary": "In a separate reply, clarifies it's the front-end (bills to 5s) that matters for debt-servicing costs and refinancing, not the 30-year — rates matter, just not that part of the curve.", "tweet_url": "https://x.com/dampedspring/status/2094827202411901110", "images": ["https://pbs.twimg.com/media/HRJSPSnWYAAQiXF.jpg", "https://pbs.twimg.com/media/HRJSPSoW0AAC9-N.jpg"], "type": "tweet"}]}, {"cluster": "Iran/Hormuz — Strikes Continue, Tehran's Regional Network Erodes", "category": ["geopolitics", "energy"], "items": [{"author": "_tolks", "summary": "Vents that the Hormuz/Iran situation is still dragging on in September, calling it an embarrassment for the administration, while joking the market cares more about Robinhood Chain than the Strait.", "tweet_url": "https://x.com/_tolks/status/2094767397051707665", "images": [], "type": "thread"}, {"author": "zriboua", "summary": "Z Riboua argues Iran's historical edge was force-multiplication across proxies — Hezbollah from Lebanon, Hamas from Gaza, Iraqi militias against US forces, the Houthis against shipping, and Assad's Syria as a logistics corridor — giving Tehran strategic depth. Since October 7, nearly the opposite of what Tehran wanted has unfolded, and he separately notes Putin is supplying Iran equipment and training but withholding the fighter jets it actually needs.", "tweet_url": "https://x.com/zriboua/status/2094798993670672599", "images": [], "type": "thread"}, {"author": "RayDalio", "summary": "Frames new US sanctions on countries trading with Iran as a live test of US global power, tying it to the \"Big Cycle\" framework from his book and linking a fuller explainer article.", "tweet_url": "https://x.com/RayDalio/status/2094797659932377140", "images": [], "type": "tweet"}]}, {"cluster": "Security — X Account Compromise & Phishing Wave", "category": ["tech", "society"], "items": [{"author": "lopp", "summary": "Jameson Lopp reports his own Dropbox account was compromised via a newly disclosed authentication vulnerability (thankfully files were locally encrypted), and separately rounds up a busy morning in security: the Dropbox breach, a fake BitKey desktop phishing email, an X password-reset email deluge, and a Protonmail outage. Also teases a CasaHODL report on Google-support social engineers.", "tweet_url": "https://x.com/lopp/status/2094825940090057033", "images": [], "type": "thread"}, {"author": "nic_carter", "summary": "Confirms many people are getting unsolicited X password-reset emails and tells users to enable \"password reset protect\" under X security settings.", "tweet_url": "https://x.com/nic_carter/status/2094781323357327806", "images": [], "type": "tweet"}, {"author": "mert", "summary": "Warns followers that if his account starts shilling coins like ETH, assume it's been hacked — flagging the wave of Twitter account takeovers going around.", "tweet_url": "https://x.com/mert/status/2094828829621862582", "images": [], "type": "tweet"}, {"author": "krugermacro", "summary": "Same advisory: enable \"password reset protect\" on X, noting it isn't on by default.", "tweet_url": "https://x.com/krugermacro/status/2094833096327872859", "images": ["https://pbs.twimg.com/media/HRJXQZea0AA7eM5.jpg"], "type": "tweet"}, {"author": "Chartfest1", "summary": "Helene Meisler confirms her account was actually hacked and she has moved to a new handle (@chartfest1).", "tweet_url": "https://x.com/Chartfest1/status/2094800798798479692", "images": [], "type": "tweet"}]}, {"cluster": "Robinhood Chain / FOMO — Social Trading Mania", "category": ["crypto", "positioning"], "items": [{"author": "0xSammy", "summary": "Posts an updated Robinhood Chain roundup showing activity spiking (transactions hit a new ATH excluding one outlier, network revenue over $1.2M/24h), and separately speculates Robinhood is preparing its own social trading app given projects being incubated through it.", "tweet_url": "https://x.com/0xSammy/status/2094782285396549973", "images": [], "type": "thread"}, {"author": "thedefivillain", "summary": "Skeptical of the 50K new FOMO users/day figure, arguing it doesn't match how thin CT trading activity actually feels — suggests fees paid is a better activity metric than user counts.", "tweet_url": "https://x.com/thedefivillain/status/2094750741667651767", "images": [], "type": "thread"}, {"author": "0xJeff", "summary": "Long-form take on the Robinhood Chain ecosystem: heavy Uniswap v4 hooks experimentation reminiscent of 2023 Arbitrum DeFi season, high fee-capture DEXs/launchpads, but a huge gap in quality AI projects — whoever fills that could trigger a \"Robinhood AI season\" bigger than Base's.", "tweet_url": "https://x.com/0xJeff/status/2094785347272032530", "images": [], "type": "tweet"}, {"author": "CirrusNFT", "summary": "Compares the current social-trading PnL frenzy to what an OpenSea unrealized-PnL leaderboard would have looked like in 2021, arguing OpenSea was effectively the first social trading app.", "tweet_url": "https://x.com/CirrusNFT/status/2094805449715663103", "images": [], "type": "thread"}, {"author": "ColdBloodShill", "summary": "Bullishly describes the current cycle as waking up to higher prices, more airdrops, and new ATHs, and lays out a simple plan: buy Robinhood memes, hold through corrections, buy more dips.", "tweet_url": "https://x.com/ColdBloodShill/status/2094759536640798877", "images": [], "type": "tweet"}, {"author": "zeroxkyle", "summary": "Argues Solana had tokenized-stock infrastructure before Robinhood but fumbled the lead badly, calling it a crack in the fundamental Solana bull case — pushes back on the idea that Robinhood distribution (versus FOMO) drove crypto-anon adoption.", "tweet_url": "https://x.com/zeroxkyle/status/2094674186103033862", "images": [], "type": "thread"}, {"author": "himgajria", "summary": "Argues social trading transparency \"killed your top signal\" — people calling the top on visible 7-8 figure PnLs would have made the same call during the 2024 AI/Goat meta before billions in liquidity and most of the cycle arrived.", "tweet_url": "https://x.com/himgajria/status/2094836133750513860", "images": [], "type": "tweet"}, {"author": "ViktorDefi", "summary": "Notes in hindsight it was one specific founder tweet that unleashed the current Robinhood meme wave — lesson: founders should tweet more.", "tweet_url": "https://x.com/ViktorDefi/status/2094808046232883551", "images": [], "type": "thread"}]}, {"cluster": "Apple — Ternus Era Begins Amid OpenAI Trade-Secrets Dispute", "category": ["tech", "AI"], "items": [{"author": "munster_gene", "summary": "Welcomes John Ternus as new Apple CEO, framing brain drain to OpenAI (~400 ex-Apple employees) as his top priority, and argues OpenAI is unlikely to out-execute Apple on hardware given the difficulty of building a full device family at accessible price points. Separately notes markets are siding with Apple in the trade-secrets dispute — $AAPL up 3% vs Nasdaq down 1% — since Apple's evidence-destruction claims would be reckless to make if untrue.", "tweet_url": "https://x.com/munster_gene/status/2094780202958143895", "images": [], "type": "thread"}]}, {"cluster": "AI Safety — Jailbroken GLM 5.3 Strips Safety Guardrails", "category": ["AI"], "items": [{"author": "cryptopunk7213", "summary": "Reports on an \"abliterated\" version of GLM 5.3 with refusal safeguards removed via orthogonalization, accepting unsafe requests ~85% of the time and enabled by the model's open weights — warns this creates a grey market for jailbroken model access and calls for action following the Hugging Face exploit and Anthropic/OpenAI training pauses.", "tweet_url": "https://x.com/cryptopunk7213/status/2094812269066514943", "images": ["https://pbs.twimg.com/media/HRJEpgdXwAALdg6.jpg"], "type": "tweet"}, {"author": "hosseeb", "summary": "Haseeb Qureshi revives the point that rogue AIs don't need to hack anything to self-replicate — self-custodial crypto wallets and permissionless GPU clouds (NEAR, Akash, ionet) already let a model pay its own bills with no KYC. Argues their real comparative advantage will be scamming, phishing and hacking humans, operating like pirates beyond state reach — a live coordination problem by 2030.", "tweet_url": "https://x.com/hosseeb/status/2094782497473065463", "images": ["https://pbs.twimg.com/media/HRIkbZBawAAC59Y.png"], "type": "tweet"}]}, {"cluster": "AI Meets the Physical World — New Ventures", "category": ["AI"], "items": [{"author": "Evan_ss6", "summary": "Flags backing (via a fund SPV) for Physical Superintelligence (PSI), which just raised a $58M seed to apply AI to materials science, math, medicine and physics.", "tweet_url": "https://x.com/Evan_ss6/status/2094806645796647229", "images": [], "type": "thread"}, {"author": "sjdedic", "summary": "Compares the launch of Robotico — a dedicated intelligence/tracking platform for the humanoid robotics industry (companies, capital, people) — to CoinMarketCap's early role in crypto, calling it the same setup at the same early stage.", "tweet_url": "https://x.com/sjdedic/status/2094773069172613139", "images": [], "type": "tweet"}]}], "B_insights": [{"author": "patrick_oshag", "summary": "Patrick O'Shaughnessy's second conversation with Sarah Guo (Conviction) — she tracks the ~250 people pushing the AI frontier and describes a real shift in the last 6-12 months: many researchers now believe recursive self-improvement puts an exponential-intelligence takeoff 1-2 years away, which paradoxically leaves individual researchers feeling less ownership of outcomes as labs become compute- and headcount-heavy. She frames the choice facing researchers as either \"the model will do it anyway\" or \"only compute scale matters\" — both disempowering.", "tweet_url": "https://x.com/patrick_oshag/status/2094821570938077480", "images": [], "type": "tweet"}, {"author": "Matt_Hougan", "summary": "Frames bitcoin as a \"service\" (censorship-resistant store of value akin to Microsoft selling Office/cloud access) rather than a company with cash flows — value comes purely from how many people want that service, which he thinks will grow. In a separate reply, argues the AI-stocks-vs-bitcoin framing maps directly to Bessent's growth bet: long AI stocks if the US grows out of its debt, long bitcoin if it inflates out — own both to win either way.", "tweet_url": "https://x.com/Matt_Hougan/status/2094788281514742019", "images": [], "type": "tweet"}, {"author": "dgt10011", "summary": "Jeff Park's extended philosophical thread on \"permanent loss\" as the counterpart to impermanent loss in constant-product AMMs — argues permanence requires either zero energy or infinite time, and that the real hedge against permanent (existential) loss is active living: taking more firsts, more risk, more joy and sadness, to make time feel infinite.", "tweet_url": "https://x.com/dgt10011/status/2094816630018646033", "images": [], "type": "tweet"}, {"author": "Delphi_Digital", "summary": "Explainer on Proof-of-Useful-Work (PoUW): the bull case is a flywheel where AI compute demand strengthens blockchain security economics, but only if useful work is directly tied to consensus and revenue stays coupled to the canonical chain — otherwise compute providers just migrate elsewhere and token emissions end up bootstrapping a market that can't survive on customer demand alone.", "tweet_url": "https://x.com/Delphi_Digital/status/2094816768191779109", "images": [], "type": "thread"}, {"author": "DCinvestor", "summary": "Three-tweet riff arguing crypto's core value prop is being an un-censorable, programmable store of value, not \"revenue\" — if you want legal claims on cash flows, buy stocks; everything else in crypto is narrative on top of the store-of-value meme (opens with a provocative // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
