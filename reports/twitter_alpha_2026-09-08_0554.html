<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-09-08T05:21:45Z", "input_stats": {"total_tweets": 203, "unique_authors": 60, "tweets_with_images": 36, "after_noise_filter": 78}, "summary": "**AI race whiplash:** OpenAI's **GPT-6 Astra** saturated benchmarks (99.9% ARC-AGI-3, 98% Frontier Math) but Anthropic's **Fable 5.1** retook the broad-capability crown within 48 hours and formalized a 358-year-old math proof (**PeterDiamandis**). **nicbstme** estimates a 100K-GPU Astra training run at ~$1.86B and argues most users won't feel the jump since everyday-task AI is already saturated; **buccocapital** is skeptical anyone's AI lead is structural given leadership flips every 8 months.\n\n**Hunter Biden's $LAPTOP memecoin** (launching on Base, Sept 9) triggered a defensive multi-thread reply spree from Coinbase's **cobie** (\"permissionless \\u2260 endorsement\"), pushback from **DonAlt** (insider-trader hypocrisy) and **thedefiedge**, jokes from **fejau_inc**/**_tolks**, and a real red flag from **0xQuit**: the contract reportedly contains a \"preCrime\" function.\n\n**Macro:** Copper hit an all-time high above $14,530/ton, up 68% since April 2025 (**biancoresearch**), validating **Chamath's** early call (via **pboockvar**). **stevehou** ran a long thread arguing the Fed didn't cause this inflation cycle and that monetary policy alone can't fix supply/capex-driven overheating. **DTAPCAP** ties USD/Yen intervention and 30-year-high JGB yields to a bullish BTC setup (gold leads, BTC follows).\n\n**AI capex \\u2192 energy:** **Crypto_McKenna** flags data centers reaching ~12% of US electricity demand by 2030 as a coming inflationary force; **RaoulGMI** (pushing his new book) argues data centers are only ~30% built vs. where they should be, calling it the largest capex supercycle in history.\n\n**Geopolitics:** **zriboua** says most people misread the Strait of Hormuz standoff, pointing to the just-revealed secret 4-month Navy SEAL mine-clearing operation as the tell.\n\n**Notable:** A degenerate but persistent new narrative \\u2014 stock/memecoin hybrids (RuneScape's $RSTR, Bittensor's $BUTT, \"Boner\") \\u2014 is drawing real trading flow per **0xSammy** and **himgajria**, alongside **Tesla's** Cybercab hitting an NHTSA probe in Austin (bullish framing from **munster_gene**).", "sections": {"A_events": [{"cluster": "GPT-6 Astra vs. Fable 5.1 — Frontier AI Race", "category": ["AI", "tech", "macro"], "items": [{"author": "PeterDiamandis", "summary": "Recaps a whiplash 48 hours: GPT-6 Astra saturated benchmarks built over years (99.9% ARC-AGI-3, 98% Frontier Math, 100% Exploitbench), but Anthropic's Fable 5.1 retook the crown on broad economic capability and formalized a 358-year-old math proof (13M lines, 29,000 new theorems). Also notes Tesla's Cybercab launch ($30K, no wheel/pedals vs. Waymo's $100K+) and GLP-1 drugs extending mouse lifespan ~100 days.", "tweet_url": "https://x.com/PeterDiamandis/status/2097030604671881465", "images": [], "type": "thread"}, {"author": "nicbstme", "summary": "Estimates the cost of a 100K-GPU Astra-scale training run at ~$1.86B (3 months at public GB300 rental rates), before post-training costs. Separately argues most people won't notice the Astra jump because everyday AI tasks (email, calendars, product lookups) are already saturated at ~100% capability — the leap will only be visible at the frontier of coding, math, and science.", "tweet_url": "https://x.com/nicbstme/status/2097157829044081050", "images": [], "type": "thread"}, {"author": "cryptopunk7213", "summary": "Says Astra is a genuine step-change omni model, able to identify sounds (barking dogs, a lightsaber) from spectrograms zero-shot, and predicts real-world uses for architects and musicians. Separately flags AI agents emailing humans and asking self-improving questions, warning agents could be indistinguishable from humans online within a year.", "tweet_url": "https://x.com/cryptopunk7213/status/2097120422684774402", "images": [], "type": "tweet"}, {"author": "buccocapital", "summary": "Contrarian note: skeptical of the pattern where a 'new AI leader' is crowned every ~8 months and pundits always claim durable, structural advantage — the opposite has repeatedly been true.", "tweet_url": "https://x.com/buccocapital/status/2097046639189848305", "images": [], "type": "tweet"}, {"author": "udiWertheimer", "summary": "Used GPT-6 Pro to strategize on two unfamiliar-field ideas and got \"amazing\" blind-spot feedback in minutes; separately notes AAA game porting to new platforms used to cost tens of millions, reacting to a demo of Astra running Skyrim/Batman/Hades locally on an iPad.", "tweet_url": "https://x.com/udiWertheimer/status/2097171578463117683", "images": [], "type": "tweet"}, {"author": "goodalexander", "summary": "Reacting to a bull thesis on OpenAI/SoftBank ('Astra'), notes the stock move (6% after 12% the day before) suggests the market wasn't pricing the news in.", "tweet_url": "https://x.com/goodalexander/status/2097141011608658092", "images": [], "type": "tweet"}, {"author": "marcvanderchijs", "summary": "Reacting to an account getting interview requests from an AI acting as a journalist: \"the world is getting stranger and stranger.\" Separately warns that AI log analysis is becoming necessary because data volume exceeds human review capacity — but AI summaries may not be reliably truthful.", "tweet_url": "https://x.com/marcvanderchijs/status/2097147657865335267", "images": [], "type": "tweet"}, {"author": "DCinvestor", "summary": "Argues AGI status is beside the point — what matters is that machine-generated intelligence at 90-95th percentile human level can now be applied to billions of tasks that lacked enough human compute before.", "tweet_url": "https://x.com/DCinvestor/status/2097105850741764355", "images": [], "type": "tweet"}]}, {"cluster": "Hunter Biden's $LAPTOP Memecoin Launch on Base", "category": ["crypto", "regulation", "positioning"], "items": [{"author": "cobie", "summary": "Ran an extended, multi-thread defense of Coinbase/Base after backlash over Hunter Biden launching $LAPTOP on Base (Sept 9, airdropping people who lost money on $TRUMP). Core argument repeated across dozens of replies: token creation on Base is permissionless, Coinbase doesn't control external protocols (Aerodrome, Kraken, Pump.fun) that tweeted about it, and there was no coordination or endorsement — while acknowledging there's plenty of legitimate criticism to make of Coinbase/Base elsewhere.", "tweet_url": "https://x.com/cobie/status/2097098242320158971", "images": ["https://pbs.twimg.com/media/HRp_0VJbwAIZLHa.jpg"], "type": "thread"}, {"author": "0xQuit", "summary": "Flags that the $LAPTOP contract reportedly contains a 'preCrime' function — clarifies it's a standard LayerZero OFT function, not necessarily unique to this token, but notes supply was already sent to CEXs/market makers just two days after deployment.", "tweet_url": "https://x.com/0xQuit/status/2097039336277750081", "images": ["https://pbs.twimg.com/media/HRouCAWb0AAPmA-.png"], "type": "thread"}, {"author": "DonAlt", "summary": "Calls the launch an embarrassment ('finally got a platform to speak his truth... launches a memecoin'), and separately notes the hypocrisy of people who insider-traded prior celebrity coins now loudly boycotting this one — complementary skeptical takes, not a disagreement.", "tweet_url": "https://x.com/DonAlt/status/2097155595388555687", "images": [], "type": "tweet"}, {"author": "thedefiedge", "summary": "Argues Biden lacks Trump's popularity when Trump launched his coin, and that launching on Base instead of Robinhood is a further handicap — says he's not interested in being exit liquidity.", "tweet_url": "https://x.com/thedefiedge/status/2097140141265658159", "images": [], "type": "tweet"}, {"author": "0xSammy", "summary": "Proposes shorting $LAPTOP via collateralized 3x positions paired against meme tokens to accelerate its decline to zero, funded by meme trading fees.", "tweet_url": "https://x.com/0xSammy/status/2097097374132814006", "images": [], "type": "thread"}, {"author": "fejau_inc", "summary": "Jokes that crypto exchanges losing business to Robinhood's memestock push should respond by launching their own Hunter Biden coin.", "tweet_url": "https://x.com/fejau_inc/status/2097087291101434266", "images": [], "type": "tweet"}, {"author": "_tolks", "summary": "Quips comparing the trend of celebrity-family memecoins: \"elon wife slinky coin daughter or hunter biden laptop son.\"", "tweet_url": "https://x.com/_tolks/status/2097005550642864443", "images": [], "type": "tweet"}, {"author": "Bluntz_Capital", "summary": "Comments on the fallout, noting cobie spent hours re-explaining the same point to critics.", "tweet_url": "https://x.com/Bluntz_Capital/status/2097149196419899903", "images": [], "type": "tweet"}]}, {"cluster": "Copper Breaks Out to All-Time High", "category": ["macro", "positioning"], "items": [{"author": "biancoresearch", "summary": "LME copper surged to an all-time high above $14,530/ton, up more than 68% since 'Liberation Day' (April 2025) — flags it as a signal of a booming economy and inflation ('Dr. Copper').", "tweet_url": "https://x.com/biancoresearch/status/2097131520620147168", "images": ["https://pbs.twimg.com/media/HRqB-DdWsAAz5Sv.png"], "type": "tweet"}, {"author": "pboockvar", "summary": "Endorses the commodity bull market thesis, referencing Jeff Currie's case for owning hard assets (gold $10K target, energy over tech) and warning of under-priced global recession risk.", "tweet_url": "https://x.com/pboockvar/status/2097002980583051372", "images": [], "type": "tweet"}, {"author": "theallinpod", "summary": "Notes copper's rally is validating Chamath's January 2026 prediction that copper would be the biggest business winner of the year, citing persistent underestimation of the global supply/demand gap.", "tweet_url": "https://x.com/theallinpod/status/2097022657166184601", "images": [], "type": "tweet"}]}, {"cluster": "AI Capex Buildout as an Inflationary/Supercycle Force", "category": ["macro", "AI", "energy"], "items": [{"author": "Crypto_McKenna", "summary": "Argues AI capex's next bottleneck is reliable energy: US data centers are forecast to hit ~12% of total US electricity consumption by 2030, and if data-center demand outpaces grid capacity growth, it becomes an inflationary force on consumer electricity — concludes capital will keep flowing into energy. Cites data showing US data center construction spending up 57% YoY in July to a record $75B annualized run rate.", "tweet_url": "https://x.com/Crypto_McKenna/status/2097109674709688693", "images": ["https://pbs.twimg.com/media/HRpszhIa4AAlZbu.jpg"], "type": "tweet"}, {"author": "RaoulGMI", "summary": "Argues data centers are only ~30% built versus where they need to be, framing the US/China AI race as one neither side (nor any single lab) can be allowed to lose — calls it the largest capex cycle in human history, where bottlenecks paradoxically demand more spend rather than less. (Tied to promotion of his new book, The Everything Code.)", "tweet_url": "https://x.com/RaoulGMI/status/2097098271403454567", "images": [], "type": "thread"}]}, {"cluster": "Strait of Hormuz — Secret Navy SEAL Mine-Clearing Operation Revealed", "category": ["geopolitics", "energy"], "items": [{"author": "zriboua", "summary": "Argues many observers badly misjudged the Strait of Hormuz standoff because basic military-balance analysis was set aside for political talking points; says the pattern (Assad's exit, Hezbollah decimated in Syria, a hesitant Houthi posture) should have signaled how it would resolve. Reacts to news that US Navy SEALs ran a secret four-month operation using divers, robots, and unmanned vessels to locate and destroy suspected Iranian mines.", "tweet_url": "https://x.com/zriboua/status/2097181028716601453", "images": [], "type": "tweet"}]}, {"cluster": "Tesla Cybercab Draws NHT // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
