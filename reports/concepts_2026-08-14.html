s", "entities": ["USMCA", "Oxford Economics"], "conviction": "medium", "so_what": "A renegotiation outcome is treated as a genuine upside catalyst, not merely an avoided loss — relevant for positioning in Canada-exposed industrials ahead of review dates.", "quote": "quantify the risks of a potential dissolution of USMCA against the upside of a successful renegotiation of the agreement", "locator": "The study utilizes a sophisticated, multi-model approach", "quote_verified": true}]}, {"theme": "Sub-national and industry-level modeling", "insights": [{"claim": "Economic impacts of the trade outcomes are assessed across industries and down to the individual US state and Canadian province level.", "speaker": "Emma Pollard", "type": "framework", "entities": ["United States", "Canada", "Oxford Economics"], "conviction": "high", "so_what": "Tariff outcomes will disperse regionally — screen for concentrated state/province exposure rather than treating this as a uniform national macro shock.", "quote": "with impacts assessed across industries and down to the state and province levels", "locator": "with impacts assessed across industries", "quote_verified": true}, {"claim": "The provider's Canadian Provincial and Territorial Model is a large-scale, bottom-up model covering all thirteen Canadian provinces and territories, and underpins this class of sub-national trade-policy analysis.", "speaker": "Emma Pollard", "type": "data_point", "entities": ["Oxford Economics", "Canadian Provincial and Territorial Model (CPTM)", "Canada"], "conviction": "medium", "so_what": "Granular provincial modeling capability means the eventual report should yield tradable regional dispersion, not just a national GDP number.", "quote": "a large-scale, detailed bottom-up model of the Canadian economy covering all thirteen provinces and territories", "locator": "Mike also led the development of Oxford", "quote_verified": true}, {"claim": "The study was commissioned by the Canadian American Business Council, a business-side advocacy body, rather than produced as independent house research.", "speaker": "Emma Pollard", "type": "data_point", "entities": ["Canadian American Business Council", "Oxford Economics"], "conviction": "high", "so_what": "Note the sponsor when weighing the framing: commissioned trade-integration research typically emphasizes the costs of disintegration.", "quote": "Commissioned by Canadian American Business Council (CABC)", "locator": "Commissioned by Canadian American Business Council", "quote_verified": true}]}], "insight_total": 9, "top_entities": ["USMCA", "United States", "Canada", "Oxford Economics", "Canadian American Business Council (CABC)", "Canadian Provincial and Territorial Model (CPTM)", "Mexico"], "source_meta": {"author": "Emma Pollard", "word_count": 608, "paywalled": false}}, {"record_id": "76ad5947a8672445", "source_type": "concepts", "source_name": "Packy McCormick / Not Boring", "source_url": "https://www.notboring.co/p/base-power-company-chapter-3", "title": "Base Power Company: Chapter 3", "published_date": "2026-08-12", "language": "en", "processed_at": "2026-08-14T00:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Energy", "Tech", "AI", "Positioning", "Macro"], "gist": "Base Power Company raised $1B at a $13B post-money valuation and has turned itself from a battery reseller into a vertically integrated Texas manufacturer: it killed its outsourced Gen 2 program, stood up its own factory and software stack in about 15 months, and now ships a 39.2 kWh 'Base Core' battery it claims is both the highest-capacity and cheapest residential system on the market. Utility partnerships have overtaken deregulated retail as the biggest demand channel (58% of July installs), Illinois is the second market, and the stated endgame is aiming the accumulated 'Capability Cannon' at the AI compute buildout to become the world's largest energy company.", "themes": [{"theme": "Valuation & Endgame Math", "insights": [{"claim": "Base Power Company raised $1 billion at a $12 billion pre-money / $13 billion post-money valuation in a Series D co-led by Ribbit Capital, Valor Equity Partners, Addition, and JPMorganChase's Strategic Investment Group, agreed on a Friday night and multiples oversubscribed by Sunday.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Base Power Company", "Ribbit Capital", "Valor Equity Partners", "Addition", "JPMorganChase Strategic Investment Group", "Zach Dell", "Micky Malka"], "conviction": "high", "so_what": "A roughly 3x markup from a $4B round about ten months earlier, closed in 48 hours, shows late-stage capital is chasing scarce revenue-generating energy hardware; expect comparable re-ratings across distributed-energy privates.", "quote": null, "locator": "One Friday night earlier this summer", "quote_verified": false}, {"claim": "At $13 billion, Base is the second most valuable energy startup in the world behind Helion, and the most valuable one that actually sells a product today, despite being less than three years old.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Base Power Company", "Helion"], "conviction": "high", "so_what": "Sets the private energy league table: shipping distributed storage is now priced above every pre-revenue generation moonshot except fusion.", "quote": null, "locator": "$13 billion is, to be sure, a hefty price tag", "quote_verified": false}, {"claim": "The energy sector supports far more mega-caps than most investors assume: 18 energy companies are worth more than $100 billion and 55 worth more than $50 billion, with Saudi Aramco at $1.7 trillion and Exxon Mobil second at $650 billion, a full trillion dollars lower.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Saudi Aramco", "Exxon Mobil", "Base Power Company"], "conviction": "high", "so_what": "The top-down TAM case for any energy entrant: the sector has room for many $50B+ outcomes, so the bull case never requires displacing Aramco.", "quote": null, "locator": "Energy is an enormous industry", "quote_verified": false}, {"claim": "Today's largest energy companies were built around the winning assets of the previous energy system — oil fields, refineries, pipelines, tankers, centralized generation, poles and wires — so a shift in where the bottleneck sits opens room for a new entrant to reach the top of the list.", "speaker": "Packy McCormick", "type": "thesis", "entities": ["Base Power Company", "energy sector"], "conviction": "high", "so_what": "Argues incumbency in energy is asset-specific rather than durable; screen incumbents for exposure to assets whose scarcity value is eroding as the grid becomes the constraint.", "quote": null, "locator": "This is a top-down view of the situation", "quote_verified": false}, {"claim": "The author explicitly discloses he is an investor in Base Power Company, plans to keep writing about it through and beyond an IPO, and closes the piece with a direct recruiting pitch to join the company.", "speaker": "Packy McCormick", "type": "anecdote", "entities": ["Packy McCormick", "Not Boring Capital", "Base Power Company"], "conviction": "high", "so_what": "Treat this as high-access primary-source reporting with an owner's bias: the operating data is specific and checkable, but the framing is unambiguously promotional.", "quote": "That is certainly my aim with Base Power Company, which I’ve both invested in and plan to keep writing about through and beyond IPO.", "locator": "In the intro to the last Ramp piece", "quote_verified": true}]}, {"theme": "Capability Cannon Framework", "insights": [{"claim": "The core strategic framework is that a company wins a large, old, incumbent-dominated industry by identifying the constraint holding it back, focusing everything on breaking it to capture a scarce defensible asset ('the High Ground'), then integrating outward from that position.", "speaker": "Packy McCormick", "type": "framework", "entities": ["Standard Oil", "Ford Motor Company", "Carnegie Steel", "Swift Meats", "Base Power Company"], "conviction": "high", "so_what": "A reusable screen for industrial-startup investing: what is the binding constraint, who owns it, and can that owner integrate outward from it?", "quote": null, "locator": "This is the question I tackled in Power in the Age of Intelligence", "quote_verified": false}, {"claim": "The durable asset a company like Base builds is not any single product but a 'Capability Cannon' — deployments, engineering, electrical services, manufacturing, brand, balance sheet, and policy chops — that can be re-aimed at each new opportunity so long as the remaining opportunity exceeds past accomplishments.", "speaker": "Packy McCormick", "type": "framework", "entities": ["Base Power Company", "Zach Dell"], "conviction": "high", "so_what": "Implies underwriting the team's rate of capability acquisition rather than the current product's TAM, and explains why the company will look unfocused by conventional measures.", "quote": null, "locator": "Collectively, Zach calls all the things Base has learned", "quote_verified": false}, {"claim": "Base's animating internal map of the power stack is 'Make, Move, Store, Sell' — generation, transmission and distribution, batteries, and retail/wholesale markets — and the company today occupies only the Store and Sell squares, with backward integration into generation and grid assets openly hinted at.", "speaker": "Packy McCormick", "type": "framework", "entities": ["Base Power Company", "Zach Dell", "Ribbit Capital", "Jared Greene", "Justin Lopas"], "conviction": "high", "so_what": "The expansion roadmap is telegraphed; Ribbit has already published the same framework applied to both electrons and intelligence, so watch for Base moves into generation or transmission.", "quote": "it’s really four things: you have to make it (generation), you have to move it (transmission and distribution), you have to store it (batteries) and you have to sell it (retail and wholesale markets).", "locator": "The way Zach sees it, there are four things", "quote_verified": true}, {"claim": "Base's operating model is described internally as an expanding web where new ideas and scrappiness live at the edge and the center's job is to absorb what worked at the edge and standardize it into process and software.", "speaker": "Packy McCormick", "type": "framework", "entities": ["Base Power Company"], "conviction": "high", "so_what": "A concrete test for whether a fast-scaling hardware company holds together: does it convert one-off heroics into encoded process, or keep re-solving the same problem in every new market?", "quote": "“Imagine Base sort of like a web. It’s expanding outwards, and all of our new ideas are at the edge, and all the scrappiness is at the edge", "locator": "Then she said something that describes Base in 2026", "quote_verified": true}]}, {"theme": "Killing Gen 2 & Owning the Factory", "insights": [{"claim": "Base cancelled its entire outsourced Gen 2 battery program in April 2025 — one battery partner and two inverter partners — and redirected 100% of hardware and supply-chain engineering into a vertically integrated, Texas-manufactured Gen 3 that shipped as 'Base Core'.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Base Power Company", "Dino Sasaridis", "Zach Dell", "Base Core"], "conviction": "high", "so_what": "The single decision the company credits with changing its trajectory, and a template for when outsourcing a core component is the strategic error rather than the prudent step.", "quote": "We made the decision to cancel our Gen 2 program and accelerate Gen 3, a lower cost, Base designed and manufactured (in Texas) home energy system.", "locator": "On May 1, right on schedule as always", "quote_verified": true}, {"claim": "The head of hardware first recommended cancelling the outsourced battery program in May 2024 but was blocked because roughly $15 million in cancellation penalties would have consumed a large share of the money raised; when the company finally exited a year later it did so for only about $1 million in penalties.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Base Power Company", "Dino Sasaridis"], "conviction": "medium", "so_what": "A clean illustration of how a thin balance sheet constrains strategy, and how supplier penalty exposure can collapse by an order of magnitude once you have leverage and time.", "quote": null, "locator": "He actually looked into canceling the contracts", "quote_verified": false}, {"claim": "The stated reason for owning the hardware stack is repairability rather than cost: a company that does not own its technology stack cannot fix the product when it breaks, and the team expected the outsourced design — more complicated than the prior generation — to break.", "speaker": "Packy McCormick", "type": "causal", "entities": ["Base Power Company", "Dino Sasaridis"], "conviction": "high", "so_what": "The vertical-integration argument that actually holds in field-deployed hardware: iteration speed on failures beats bill-of-materials savings.", "quote": "if you don’t own the stack of the technology, you’re absolutely not empowered to fix it when it breaks.", "locator": "The idea of just canceling it kept nagging", "quote_verified": true}, {"claim": "The April 2025 'Liberation Day' tariffs made in-house US manufacturing more attractive and helped tip the internal decision to cancel the outsourced program, an example of trade policy directly redirecting a startup's capital allocation.", "speaker": "Packy McCormick", "type": "causal", "entities": ["Base Power Company", "tariffs"], "conviction": "medium", "so_what": "Tariff regimes are shifting build-versus-buy math for US hardware startups; expect more reshored vertical integration in energy hardware specifically.", "quote": null, "locator": "right around April 2025, right when the Liberation Day tariffs", "quote_verified": false}, {"claim": "Base went from signing a lease on the old Austin American-Statesman press building in June 2025 to getting keys in September, running a pilot battery module line by January 2026, and having two production lines with batteries in the field by March 2026.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Base Power Company", "Andy Ross", "Base Factory 1", "Austin"], "conviction": "high", "so_what": "A roughly nine-month keys-to-production benchmark for battery assembly that resets expectations for how fast domestic energy manufacturing can be stood up.", "quote": null, "locator": "Base people have their own definition of fun", "quote_verified": false}, {"claim": "By the end of 2026 Base needs to produce roughly 1,300 Base Core systems per week — about 5x current output, from a night shift plus uptime and cycle-time work — then 3x again the following year and 2x after that, implying roughly 30x today's daily production by 2028 in a larger, more automated second factory.", "speaker": "Packy McCormick", "type": "prediction", "entities": ["Base Power Company", "Base Factory 2", "Base Core", "Andy Ross"], "conviction": "high", "so_what": "The most falsifiable forward number in the piece; a 30x three-year manufacturing ramp is the key execution risk to check against each monthly investor update.", "quote": null, "locator": "By the end of the year, they’ll need to be pumping out", "quote_verified": false}, {"claim": "The binding constraint has moved from the factory to the supply chain: Base has ramped its own factory faster than four or five key sole-sourced suppliers, and is now ramping more than ten supplier lines in parallel while embedding its own engineers on supplier floors to install tooling and manage the move from bridge to production suppliers.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Base Power Company", "Justin Lopas", "Colby Jarrett"], "conviction": "high", "so_what": "Sole-source exposure across multiple critical parts is the near-term threat to the 5x ramp; watch for supplier diversification or further backward integration into components.", "quote": "Basically, we’ve been able to ramp our factory faster than four or five of the key suppliers we’re sole sourced to right now.", "locator": "When I asked Justin which team currently had the Turtle", "quote_verified": true}, {"claim": "Base deliberately kept its first factory manual to preserve design flexibility, on the principle that automation comes last because automation is inflexible, and only began integrating live controls for the factory's 21 robots in June 2026.", "speaker": "Packy McCormick", "type": "framework", "entities": ["Base Power Company", "Andy Ross", "Elon Musk", "Tesla"], "conviction": "high", "so_what": "An anti-pattern warning for capital-intensive hardware: premature automation locks in a product architecture that is still moving, stranding capex.", "quote": null, "locator": "This is why automation comes last in Elon Musk’s five-step algorithm", "quote_verified": false}]}, {"theme": "Base Core Specs & Unit Economics", "insights": [{"claim": "Base Core carries 39.2 kWh of capacity versus 25 kWh for Base's own Gen 1 and 13.5 kWh for the Tesla Powerwall 3, and many customers install two units for nearly 80 kWh per home.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Base Core", "Tesla Powerwall 3", "Base Power Company"], "conviction": "high", "so_what": "Nearly 3x the capacity of the market-standard Powerwall per unit changes per-home grid-services value and directly pressures Tesla's residential storage franchise.", "quote": null, "locator": "Base Core is the highest-capacity battery on the market", "quote_verified": false}, {"claim": "The design deliberately packs cheap energy capacity into each home so that inverter, customer-acquisition, and installation costs — which are roughly the same whether you install 39.2 kWh or 20 kWh — are spread across far more kilowatt-hours.", "speaker": "Packy McCormick", "type": "causal", "entities": ["Base Power Company", "Base Core"], "conviction": "high", "so_what": "The real unit-economics lever is fixed-cost amortization per home, not cell cost, which structurally favors ever-larger residential systems over incremental Powerwall-sized units.", "quote": null, "locator": "Base optimized for landing a lot of relatively inexpensive energy capacity", "quote_verified": false}, {"claim": "Base aims to roughly break even on the batteries themselves — charging members a few hundred dollars upfront to cover install plus a $19 monthly fee in some areas — and makes most of its money today storing power when it is cheap and selling it back to the grid when it is expensive.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Base Power Company", "Base Core"], "conviction": "high", "so_what": "Revenue is arbitrage and grid services, not hardware margin, so value scales with MWh under control and with price volatility rather than with unit ASPs.", "quote": "Every battery is a time machine.", "locator": "Base aims to roughly breakeven on the batteries", "quote_verified": true}, {"claim": "A new internal disconnect component called 'Disco' splits installation into two stages — electricians disconnect the home from the grid one day, installers plug in the module the next — cutting the install from three steps to two and reducing how much scarce electrician time each system consumes.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Base Power Company", "Base Core", "Dana Paz"], "conviction": "high", "so_what": "Electrician labor is the industry's real throughput constraint, so a design that de-skills part of the install directly relieves the scaling bottleneck.", "quote": null, "locator": "The biggest change is to Disco", "quote_verified": false}, {"claim": "Base Core telemetry runs at 7 kHz on the Disco unit doing waveform analysis, versus 1 Hz on the prior generation and the every-five-minutes cadence utilities are accustomed to, letting the team diagnose and fix most issues remotely and near-instantly.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Base Power Company", "Jared Greene", "Base Core"], "conviction": "high", "so_what": "A multi-order-of-magnitude data advantage over utility norms is the raw material for grid-services and diagnostics products utilities cannot build themselves.", "quote": null, "locator": "For Gen 1, sometimes people would call us", "quote_verified": false}, {"claim": "Base Core includes a 20 kW inverter the company believes is among the most American-made on the market, which matters commercially because the FCC has added foreign-made inverters to its Covered List over vulnerability to remote shutdown.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Base Power Company", "FCC", "Justin Lopas", "Base Core"], "conviction": "high", "so_what": "National-security procurement rules are becoming a moat for domestic inverter manufacturing and a live risk for anyone importing inverters into the US.", "quote": null, "locator": "It has a 20 kW inverter", "quote_verified": false}]}, {"theme": "Demand Engine & Gentailer Model", "insights": [{"claim": "In July 2026 Base signed over 6,000 new Battery members, roughly 40% more than June, while installing a record of more than 2,000 systems — more than three new members signed for every battery installed, leaving the company supply-constrained rather than demand-constrained.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Base Power Company"], "conviction": "high", "so_what": "A 3:1 backlog build is the clearest evidence the valuation is underwritten on manufacturing throughput, not on market demand.", "quote": null, "locator": "In July, Base signed over 6,000 new Battery members", "quote_verified": false}, {"claim": "Base has batteries on over 17,400 customer homes and has deployed 585 MWh of storage, targeting more than 1 GWh by the end of 2026, with its single-day install record climbing from 22 to 113.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Base Power Company"], "conviction": "high", "so_what": "585 MWh to 1 GWh in under five months is the concrete year-end milestone to hold the company to.", "quote": null, "locator": "It’s now deployed 585 MWh of storage", "quote_verified": false}, {"claim": "Base launched 'Base Energy' in April 2026, a battery-free electricity plan with guaranteed below-market rates for renters and apartment dwellers, and it reached more than 14,000 members within three months, pushing total membership above 30,000.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Base Power Company", "Base Energy"], "conviction": "high", "so_what": "A capital-light channel that grew to nearly half of total membership in one quarter, monetizing the fleet's hedge value with no new hardware while serving as top-of-funnel.", "quote": null, "locator": "In April, the company launched Base Energy", "quote_verified": false}, {"claim": "The retail electricity thesis is that a battery fleet physically substitutes for financial hedges: retailers are structurally short power and pay option premiums, while a battery fleet is long power, so combining them cuts risk and lets the savings be passed through as lower customer rates.", "speaker": "Packy McCormick", "type": "framework", "entities": ["Base Power Company", "Jared Greene", "Base Energy"], "conviction": "high", "so_what": "Explains how Base can sustainably undercut incumbent retail electric providers without subsidizing — the cost edge comes from replacing hedging premium with owned physical assets.", "quote": "“The hedge is a financial battery,” as Jared described it. “The battery is a technical hedge.”", "locator": "Selling electricity in a deregulated market", "quote_verified": true}, {"claim": "The homebuilder channel converts unusually well: Lennar accounted for roughly 2,500 homes, about 30% of Base's 2025 installations, and by March 2026 Base was available in 77 Lennar communities with a take rate above 65%.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Lennar", "Base Power Company"], "conviction": "high", "so_what": "A 65%+ attach rate at the point of home sale is the cheapest acquisition channel in the model and a template other national builders may replicate.", "quote": null, "locator": "Lennar accounted for roughly 2,500 homes", "quote_verified": false}]}, {"theme": "Utilities as the Growth Engine", "insights": [{"claim": "Regulated utility partnerships went from a couple percent of Base's business in 2025 to 58% of July 2026 installs, growing from a single Bandera Electric Cooperative pilot into five larger partnerships totaling 220 MW.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Base Power Company", "Bandera Electric Cooperative", "Tim Pianta"], "conviction": "high", "so_what": "This directly resolves the biggest bear case an investor had voiced — that the model only works in deregulated markets — and unlocks the majority of the US that is regulated.", "quote": null, "locator": "That initial Bandera pilot has turned into five larger", "quote_verified": false}, {"claim": "Utility partnerships deliver near-zero customer acquisition cost: roughly 5% of the addressable market signs up simply from the utility sending an email, though only after a multi-month or multi-year enterprise sales cycle to land the partnership.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Base Power Company", "Cole Jones"], "conviction": "high", "so_what": "CAC should fall structurally as the mix shifts toward utilities, showing up as improving contribution margin even with flat hardware costs.", "quote": "“You get like 5% of the addressable market signed up just by the utility sending an email. It’s a free CAC. I love it.”", "locator": "From a go to market motion, the utility world is quite simple", "quote_verified": true}, {"claim": "Base monetizes the identical battery three different ways depending on market structure: owning the asset and selling electricity as a retail electric provider in deregulated Texas, deploying contracted fleets for co-ops and municipal utilities, and selling assets to investor-owned utilities via build-transfer contracts so the IOU can rate-base them and earn an allowed return while paying Base for software and services.", "speaker": "Packy McCormick", "type": "framework", "entities": ["Base Power Company", "investor-owned utilities", "retail electric provider"], "conviction": "high", "so_what": "Business-model flexibility, not technology, is what makes national expansion possible — and the IOU build-transfer path turns Base into a capital-light software and services vendor in regulated states.", "quote": null, "locator": "There are different types of utilities", "quote_verified": false}, {"claim": "The El Paso Electric partnership required installing 10 MW behind one constrained substation — roughly 10% of all homes behind it — to defer capacity upgrades, and Base finished two weeks early with one-third of the neighborhood signing up, executed largely by two marketing interns knocking doors in 104-degree heat.", "speaker": "Packy McCormick", "type": "anecdote", "entities": ["El Paso Electric", "Base Power Company", "Tim Pianta"], "conviction": "high", "so_what": "Proves the highest-value utility use case — geographically targeted non-wires alternatives that defer capex — is operationally achievable, which is where regulated utilities will pay the most.", "quote": null, "locator": "In El Paso, we had to deploy 10MW of batteries", "quote_verified": false}, {"claim": "Utility demand has inverted from Base chasing partnerships to large investor-owned utilities calling Base for help, a shift the CEO says did not exist fifteen months earlier, and Base's pitch is that most utility problems are coordination problems spanning generation, transmission, storage and retail simultaneously.", "speaker": "Packy McCormick", "type": "thesis", "entities": ["Base Power Company", "Zach Dell", "investor-owned utilities"], "conviction": "high", "so_what": "Inbound from IOUs is the leading indicator for regulated-market expansion; the first named IOU build-transfer contract outside Texas would be the confirming catalyst.", "quote": "“All the big utilities are calling us and they’re saying, ‘Please help us,’ basically,”", "locator": "When I spoke with Zach, he was on his way out", "quote_verified": true}]}, {"theme": "Expansion, Permitting & Labor", "insights": [{"claim": "Base chose Illinois as its second market for structural reasons: roughly 4 million single-family homes, a deregulated market, the newly signed Clean and Reliable Grid Affordability Act (SB 25) establishing a 3 GW storage target by 2030, and residential battery access to PJM's high-priced wholesale capacity market.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Illinois", "PJM", "JB Pritzker", "Base Power Company", "ComEd"], "conviction": "high", "so_what": "State storage mandates plus wholesale capacity market access form the checklist for where distributed storage expands next — a screen for predicting the third and fourth markets.", "quote": null, "locator": "Illinois is large, with roughly 4 million single-family homes", "quote_verified": false}, {"claim": "Illinois offers a revenue stream Texas does not: time-varying distribution rates and aging infrastructure let Base get paid for relieving stress on local wires, a value stream it cannot currently monetize in deregulated Texas.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Illinois", "Texas", "PJM", "Base Power Company"], "conviction": "high", "so_what": "Revenue stacks differ materially by market, so distributed storage economics must be modeled state by state rather than as one national unit economic.", "quote": null, "locator": "PJM’s high capacity prices make stored power", "quote_verified": false}, {"claim": "ComEd's all-in residential rate has jumped to 17.07¢/kWh, roughly 90% above the ~9¢/kWh level of 2021, which is why the Chicago pitch leads with affordability while the Texas pitch leads with reliability.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["ComEd", "PJM", "Illinois", "Texas"], "conviction": "high", "so_what": "A 90% five-year retail rate increase in a major metro is simultaneously the demand driver for distributed storage and a mounting political risk for PJM-area utilities.", "quote": null, "locator": "ComEd, the utility that covers Chicago", "quote_verified": false}, {"claim": "Storm-driven local news coverage is the most efficient demand catalyst: after July 27, 2026 storms cut power to more than 530,000 ComEd customers and the Chicago Tribune ran a favorable feature the next morning, 1,437 Chicagoland leads arrived in a single day — five times the previous best — with 172 signing that day against a prior daily record of 90.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["ComEd", "Chicago Tribune", "Base Power Company"], "conviction": "high", "so_what": "Demand is event-driven and highly convex to grid failures, making outage frequency a real-time leading indicator for residential storage sales.", "quote": null, "locator": "Then on July 27th, storms knocked out power", "quote_verified": false}, {"claim": "Base's policy team helped pass Texas SB1252 in August 2025, barring municipalities from amending the National Electrical Code or regulating installation of residential energy backup systems, making Texas the only state where the state itself controls permitting — while Chicagoland's 500-plus permitting jurisdictions put Base back to negotiating with individual inspectors.", "speaker": "Packy McCormick", "type": "causal", "entities": ["Texas", "SB1252", "National Electrical Code", "Illinois", "Justin Lopas", "Base Power Company"], "conviction": "high", "so_what": "Capturing the permitting layer is a replicable, high-ROI moat; track whether similar language lands in the federal permitting bill moving through Congress, since it would compress deployment costs nationally.", "quote": "“if you think about Base as a machine that eats complexity and turns it into moats.”", "locator": "Then, Base ate complexity and turned it into law", "quote_verified": true}, {"claim": "Data centers paying top dollar for electricians on short-term projects are now Base's main hiring challenge, forcing it to compete on benefits, 401k and equity rather than wages as it hires roughly 50 people in Chicagoland by year-end.", "speaker": "Packy McCormick", "type": "causal", "entities": ["Base Power Company", "Dana Paz", "data centers"], "conviction": "medium", "so_what": "Skilled electrical labor is a shared bottleneck between AI datacenter buildout and distributed energy — a wage-inflation signal that raises delivered costs across both sectors.", "quote": null, "locator": "Hiring electricians used to be a huge bottleneck", "quote_verified": false}]}, {"theme": "Pointing the Cannon at AI Compute", "insights": [{"claim": "Base's stated next act is to reorient the entire company around AI infrastructure in two directions — bringing power to the compute and bringing compute to the power — with the CEO saying the result should be the largest energy technology company ever and perhaps the world's largest company.", "speaker": "Packy McCormick", "type": "prediction", "entities": ["Base Power Company", "Zach Dell", "AI"], "conviction": "high", "so_what": "Much of the $13B mark is optionality on this pivot; a concrete distributed-compute product announcement is the catalyst that would validate or deflate it.", "quote": "“So now, we’re taking this Capability Cannon and we’re pointing it at the infrastructure buildout, and we’re going to do it in two broad ways: one is bringing the power to the compute, and two is bringing the compute to the power.”", "locator": "While it’s a bit too early to share specifics", "quote_verified": true}, {"claim": "The technical argument for distributed compute is a spiderweb-and-sand analogy: a single large centralized load is like a rock that breaks the web wherever you place it, while the same hundreds of megawatts spread as sand across nodes with local grid headroom lets far more compute connect far more quickly.", "speaker": "Packy McCormick", "type": "framework", "entities": ["Base Power Company", "Jared Greene", "data centers", "hyperscalers", "neoclouds"], "conviction": "medium", "so_what": "If interconnection queues remain the binding constraint on the AI buildout, distributed compute co-located with residential storage becomes a credible alternative to powered-land hyperscale campuses.", "quote": "so the spiderweb can hold a lot more sand", "locator": "One thing that’s hard with large, centralized grid-scale loads", "quote_verified": true}, {"claim": "The logic pushing Base into compute is that fixing a shrinking portion of the grid is pointless: compute is becoming the dominant load and, described as the fastest-growing consumer of electricity ever, is a major factor that could make the grid unhealthy.", "speaker": "Packy McCormick", "type": "causal", "entities": ["Base Power Company", "Jared Greene", "Zach Dell", "AI"], "conviction": "high", "so_what": "Frames AI load growth as an existential requirement rather than an optional opportunity for any grid business — a lens for evaluating every utility and grid-tech position.", "quote": "“And what is the power grid for? Increasingly, it’s for driving compute.”", "locator": "The mission is to fix the grid", "quote_verified": true}, {"claim": "The author concedes Base would not be first to decentralized compute — Tesla did residential batteries earlier and Base outgrew it anyway — arguing the transferable advantages are hardware manufacturing, home installation logistics, and the ability to operate a distributed network as a single asset, rather than the idea itself.", "speaker": "Packy McCormick", "type": "thesis", "entities": ["Base Power Company", "Tesla"], "conviction": "medium", "so_what": "The bet is execution capability over novelty, which is the counter to any 'the incumbent already tried this' objection when sizing hardware entrants.", "quote": null, "locator": "Base is not the first company to think about doing decentralized compute", "quote_verified": false}]}], "insight_total": 43, "top_entities": ["Base Power Company", "Zach Dell", "Justin Lopas", "Base Core", "Tesla", "Ribbit Capital", "ComEd", "Lennar", "PJM", "El Paso Electric", "Illinois", "Texas"], "source_meta": {"author": "Packy McCormick", "word_count": 14686, "paywalled": false}}, {"record_id": "23b0604d8c2fa8cf", "source_type": "concepts", "source_name": "Peterson Institute (PIIE)", "source_url": "https://www.piie.com/blogs/realtime-economics/2026/why-trump-will-lose-again-new-challenge-his-tariffs", "title": "Why Trump will lose (again) on the new challenge to his tariffs", "published_date": "2026-08-12", "language": "en", "processed_at": "2026-08-14T10:56:32Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Geopolitics", "Positioning"], "gist": "Two former USTR general counsels argue the Trump administration's third attempt at a near-universal tariff — a 10 to 12.5 percent Section 301 levy on 60 countries justified by their alleged failure to curb forced-labor imports — is legally doomed at the Court of International Trade, the Federal Circuit, and likely the Supreme Court, because Section 301 is a selective, not blanket, authority and a blanket use would unconstitutionally transfer Congress's tariff power to the president. They flag Section 232 and the never-used Section 338 of the 1930 Smoot-Hawley Act as the administration's likely next legal vehicles, and note refunds will be slow, partial, and captured by importers of record rather than the households that actually bore the cost.", "themes": [{"theme": "Three failed tariff vehicles", "insights": [{"claim": "The Supreme Court struck down the president's blanket 'emergency' tariff on February 20, 2026, after which senior administration officials publicly vowed to find another legal route to keep an equivalent tariff in place.", "speaker": "Alan Wm. Wolff,Warren Maruyama", "type": "data_point", "entities": ["Supreme Court", "Trump administration", "IEEPA"], "conviction": "high", "so_what": "Tariff levels are now a function of statutory shopping, not policy stability — assume any headline tariff rate carries a live legal expiry option rather than a durable cost floor.", "quote": "When the Supreme Court struck down the president's blanket \"emergency\" tariff on February 20, senior administration officials vowed they would find a way to keep the tariff in place. They did, using the forced labor argument.", "locator": "It is easy to dismiss the lawsuit", "quote_verified": true}, {"claim": "A 150-day 10 percent interim tariff justified as a balance-of-payments defense was rejected by the US Court of International Trade and expired on July 25, forcing the administration to substitute a Section 301 tariff within days.", "speaker": "Alan Wm. Wolff,Warren Maruyama", "type": "data_point", "entities": ["US Court of International Trade", "Section 122 of the Trade Act of 1974", "Section 301 of the Trade Act of 1974"], "conviction": "high", "so_what": "Each replacement is built faster and on thinner record than the last, raising the probability that the next stopgap is struck down more quickly — watch for compressed shelf-life on tariff-driven margin assumptions.", "locator": "To recap: First, as an interim measure", "quote": null, "quote_verified": false}, {"claim": "The replacement tariff is a flat 10 to 12.5 percent on goods from 60 countries and economies covering essentially all large and medium-sized US trading partners, with product exclusions and an exemption for free trade agreement goods from Canada and Mexico.", "speaker": "Alan Wm. Wolff,Warren Maruyama", "type": "data_point", "entities": ["Canada", "Mexico", "USTR", "Section 301 of the Trade Act of 1974"], "conviction": "high", "so_what": "USMCA-origin supply chains are the carve-out — sourcing shifted into Canada and Mexico enjoys both a tariff exemption today and insulation from the legal reversal risk.", "locator": "When that balance-of-payments measure expired", "quote": null, "quote_verified": false}, {"claim": "Twenty-five states plus a group of small businesses and affected importers have sued, arguing that a two-and-a-half-month investigation covering 60 countries was a sham designed to preserve a pre-decided tariff.", "speaker": "Alan Wm. Wolff,Warren Maruyama", "type": "data_point", "entities": ["Letitia James", "New York", "US Court of International Trade"], "conviction": "high", "so_what": "Business co-plaintiffs give the case standing and commercial-injury evidence that a purely partisan state suit would lack — this is a stronger challenge than the headline framing suggests.", "quote": "once again trying to illegally raise taxes on families and businesses with a new round of tariffs", "locator": "Twenty-five states sued the Trump administration", "quote_verified": true}]}, {"theme": "Selective statute, blanket use", "insights": [{"claim": "Section 301 of the Trade Act of 1974 is by its terms a selective authority requiring a country-specific finding after serious investigation, and nothing in its language or legislative history supports en masse use against 60 countries accounting for most of US trade.", "speaker": "Alan Wm. Wolff,Warren Maruyama", "type": "framework", "entities": ["Section 301 of the Trade Act of 1974", "Congress", "USTR"], "conviction": "high", "so_what": "The distinction between selective and blanket delegated authority is the load-bearing test for every remaining tariff vehicle — apply it to score the survival odds of any new tariff announcement.", "locator": "Besides the facts, the importers point", "quote": null, "quote_verified": false}, {"claim": "Setting an unlimited-rate tariff on goods from most countries the United States trades with would amount to a complete transfer of the constitutional tariff power from Congress to the president, which the Constitution forbids regardless of the statute invoked.", "speaker": "Alan Wm. Wolff,Warren Maruyama", "type": "thesis", "entities": ["Congress", "Constitution", "Section 301 of the Trade Act of 1974"], "conviction": "high", "so_what": "The nondelegation ceiling means no statute can be stretched into a universal tariff — country-specific and sector-specific tariffs are the durable risk, universal ones are the transient one.", "quote": "this amounts to a complete transfer of the tariff power from the Congress to the president and his officials. That the Constitution cannot allow.", "locator": "In effect, they point to a basic constitutional flaw", "quote_verified": true}, {"claim": "In 50 years of Section 301 practice, no president or USTR has ever imposed a blanket tariff on countries accounting for nearly all US trade; comprehensive tariff changes have come only through multilateral trade agreements under authority Congress delegated on a bipartisan basis.", "speaker": "Alan Wm. Wolff,Warren Maruyama", "type": "framework", "entities": ["Section 301 of the Trade Act of 1974", "USTR", "Congress"], "conviction": "high", "so_what": "Absence of precedent over five decades is exactly the evidence courts weigh under major-questions review — it materially raises the odds the tariff is vacated.", "locator": "They will supply evidence that the impact", "quote": null, "quote_verified": false}, {"claim": "Better US tariff treatment under the new regime depends on whether a country has a trade deal with the United States and promises to invest more here, not on its actual record against forced-labor imports, and no path to improved treatment through stronger forced-labor enforcement is specified.", "speaker": "Alan Wm. Wolff,Warren Maruyama", "type": "causal", "entities": ["USTR", "Trump administration"], "conviction": "high", "so_what": "The pricing mechanism is deal-and-investment leverage dressed as human rights — read country tariff differentials as a scoreboard of bilateral concessions, and expect that mismatch to be the fatal evidentiary flaw in court.", "locator": "The plaintiffs also point to the fact", "quote": null, "quote_verified": false}, {"claim": "USTR's justification rests on generalized observations that forced labor could disadvantage US goods rather than country-specific findings of burden or restriction on US commerce, a gap made worse because many of the 60 targeted countries already ban forced labor.", "speaker": "Alan Wm. Wolff,Warren Maruyama", "type": "causal", "entities": ["USTR"], "conviction": "high", "so_what": "A record this thin is the classic arbitrary-and-capricious target; the weakness of the factual findings, not the politics, is what decides the case.", "locator": "Those challenging the tariff will point", "quote": null, "quote_verified": false}]}, {"theme": "APA exposure and shrinking deference", "insights": [{"claim": "Unlike the earlier IEEPA and Section 122 measures, which were not reviewable under the Administrative Procedures Act, the USTR's factual justification for the Section 301 tariff is subject to judicial review for being arbitrary and capricious or an abuse of discretion.", "speaker": "Alan Wm. Wolff,Warren Maruyama", "type": "framework", "entities": ["IEEPA", "Section 122 of the Trade Act of 1974", "Administrative Procedures Act", "USTR"], "conviction": "high", "so_what": "Switching to Section 301 traded one legal vulnerability for a worse one — it opened the administrative record itself to attack, which is why this attempt is more fragile than its predecessors.", "quote": "extremely tenuous if not contrived factual justifications, which have major gaps and contradictions", "locator": "While the president's earlier use of emergency powers", "quote_verified": true}, {"claim": "Under Loper Bright v. Raimondo courts exercise independent judgment over the bounds of agency authority even where the statute is ambiguous, and the major questions doctrine adds heightened scrutiny where economic and political stakes are large.", "speaker": "Alan Wm. Wolff,Warren Maruyama", "type": "framework", "entities": ["Loper Bright v. Raimondo", "Supreme Court", "major questions doctrine"], "conviction": "high", "so_what": "The post-Chevron doctrinal shift that deregulatory investors welcomed now cuts directly against executive tariff power — the same case law is a systematic headwind for any sweeping unilateral trade action.", "locator": "Judicial deference to the executive?", "quote": null, "quote_verified": false}, {"claim": "A 10 to 12 percent tariff applied to the majority of $4.36 trillion of US imports puts hundreds of billions of dollars at stake and reaches household budgets, inflation, interest rates, and allied relations, which is precisely the scale that triggers major-questions scrutiny.", "speaker": "Alan Wm. Wolff,Warren Maruyama", "type": "data_point", "entities": ["Supreme Court", "US imports"], "conviction": "high", "so_what": "Size the reversal: roughly $400 billion-plus of annualized tariff revenue is contingent on litigation, a fiscal and CPI variable with a binary court-driven resolution.", "locator": "Here, hundreds of billions of dollars", "quote": null, "quote_verified": false}]}, {"theme": "Refund mechanics and true incidence", "insights": [{"claim": "US Customs has refunded $100 million of tariffs illegally collected under the April 2, 2025 emergency tariff and is still reviewing claims for the other 40 percent of what it collected, while refunds for the February 2026 balance-of-payments tariff cannot even begin until appeals conclude.", "speaker": "Alan Wm. Wolff,Warren Maruyama", "type": "data_point", "entities": ["US Customs", "Financial Times", "US Court of International Trade"], "conviction": "high", "so_what": "Refund receivables are real but multi-year and back-loaded — importers with documented entries hold an underpriced contingent asset, but do not model near-term cash recovery.", "locator": "Justice triumphs, but not immediately", "quote": null, "quote_verified": false}, {"claim": "Only the importer of record can claim a tariff refund, and US trade law gives courts and Customs no mandate to trace how much of the charge was passed downstream to retailers and consumers, leaving supply-chain participants to negotiate any redistribution among themselves.", "speaker": "Alan Wm. Wolff,Warren Maruyama", "type": "framework", "entities": ["US Customs", "importer of record"], "conviction": "high", "so_what": "Refund windfalls accrue to whoever held the customs entry, not whoever ate the margin — screen for importers of record with pass-through pricing as the asymmetric beneficiaries.", "quote": "There is no full justice to be had.", "locator": "There is no full justice to be had", "quote_verified": true}, {"claim": "Early research including work by staff of the Federal Reserve Bank of New York finds that American businesses and households, not foreign exporters, ultimately bear the cost of the tariffs.", "speaker": "Alan Wm. Wolff,Warren Maruyama", "type": "causal", "entities": ["Federal Reserve Bank of New York"], "conviction": "high", "so_what": "Tariff incidence lands domestically, so a court-ordered rollback is a disinflationary and margin-positive event for US importers and consumer-facing retailers.", "quote": "it is mainly American businesses and households that end up with the bill", "locator": "What we do know from early research", "quote_verified": true}]}, {"theme": "Next statutes in the queue", "insights": [{"claim": "The authors warn that the next expansive moves would be an excessive use of the national security authority of Section 232 of the Trade Expansion Act of 1962 and a first-ever, novel use of the anti-discrimination authority in Section 338 of the Smoot-Hawley Tariff Act of 1930.", "speaker": "Alan Wm. Wolff,Warren Maruyama", "type": "prediction", "entities": ["Section 232 of the Trade Expansion Act of 1962", "Section 338", "Smoot-Hawley Tariff Act of 1930"], "conviction": "medium", "so_what": "Section 232 is sector-specific and historically court-resilient, so steel, autos, semiconductors and pharma face stickier tariff risk than broad-based importers even if the blanket tariff falls.", "locator": "Three statutes have already been given", "quote": null, "quote_verified": false}, {"claim": "The Court of International Trade will hear the forced-labor tariff case before a three-judge panel in early fall 2026, with subsequent appeals to the Federal Circuit and very likely the Supreme Court, and the authors assert the tariff will ultimately be struck down.", "speaker": "Alan Wm. Wolff,Warren Maruyama", "type": "prediction", "entities": ["US Court of International Trade", "US Court of Appeals for the Federal Circuit", "Supreme Court"], "conviction": "high", "so_what": "A dateable catalyst in early fall 2026 with a long appellate tail — the first ruling is the volatility event, final resolution and refunds are years out.", "quote": "The end is certain, however. This tariff will not stand.", "locator": "But the first order of business", "quote_verified": true}]}], "insight_total": 17, "top_entities": ["Section 301 of the Trade Act of 1974", "US Court of International Trade", "USTR", "Supreme Court", "IEEPA", "Loper Bright v. Raimondo", "US Customs", "Section 232 of the Trade Expansion Act of 1962", "Section 338", "Federal Reserve Bank of New York", "Letitia James", "US Court of Appeals for the Federal Circuit"], "source_meta": {"author": "Alan Wm. Wolff,Warren Maruyama", "word_count": 1980, "paywalled": false}}, {"record_id": "8647f416e0e0e8b6", "source_type": "concepts", "source_name": "Peterson Institute (PIIE)", "source_url": "https://www.piie.com/blogs/realtime-economics/2026 // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
