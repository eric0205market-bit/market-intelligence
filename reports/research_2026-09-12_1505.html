    { name: "Hardfork (Anthony Deden / Radigan Carter)", count: 1 },
    { name: "Noahpinion (Noah Smith)", count: 1 },
    { name: "Seven C Premium", count: 1 },
    { name: "Doomberg", count: 1 },
    { name: "Big Moves / Big Price Moves Explained", count: 2 },
    { name: "Ironsides Macro", count: 1 },
    { name: "Helene Meisler (Saturday Chart Fest)", count: 1 },
    { name: "Blind Squirrel Macro (Arcadia Now)", count: 1 },
    { name: "Hermit Research", count: 1 }
  ],
  skippedSources: []
};

const CAT_LABELS = {"AI/infra":"AI/infra"};
const URG_META = {
  deep: { emoji: "🔵", label: "Deep" },
  watch: { emoji: "🟡", label: "Watch" },
  act: { emoji: "🔴", label: "Act Now" }
};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function catColorVar(cat){
  return "var(--" + cat.toLowerCase().replace("/", "") + ")";
}

function buildFilters(){
  const cats = {};
  ITEMS.forEach(i => cats[i.cat] = (cats[i.cat]||0)+1);
  const catBar = document.getElementById('catBar');
  let html = '<button class="pill active" data-filter="cat" data-cat="all" onclick="setCat(\'all\')">All (' + ITEMS.length + ')</button>';
  Object.keys(cats).forEach(function(c){
    html += '<button class="pill" data-filter="cat" data-cat="' + c + '" onclick="setCat(\'' + c + '\')">' + c + ' (' + cats[c] + ')</button>';
  });
  catBar.innerHTML = html;

  const urgs = {};
  ITEMS.forEach(i => urgs[i.urgency] = (urgs[i.urgency]||0)+1);
  const urgBar = document.getElementById('urgBar');
  let uhtml = '<button class="pill active" data-urg="all" onclick="setUrg(\'all\')">All</button>';
  ['act','deep','watch'].forEach(function(u){
    if(!urgs[u]) return;
    const m = URG_META[u];
    uhtml += '<button class="pill" data-urg="' + u + '" onclick="setUrg(\'' + u + '\')">' + m.emoji + ' ' + m.label + ' (' + urgs[u] + ')</button>';
  });
  urgBar.innerHTML = uhtml;
}

function setCat(c){
  activeCat = c; activeSrc = null;
  document.querySelectorAll('[data-filter="cat"]').forEach(function(b){ b.classList.toggle('active', b.dataset.cat === c); });
  render();
}
function setUrg(u){
  activeUrg = u; activeSrc = null;
  document.querySelectorAll('[data-urg]').forEach(function(b){ b.classList.toggle('active', b.dataset.urg === u); });
  render();
}
function filterBySrc(name){
  activeCat = 'all'; activeUrg = 'all'; activeSrc = name;
  document.querySelectorAll('[data-filter="cat"]').forEach(function(b){ b.classList.toggle('active', b.dataset.cat === 'all'); });
  document.querySelectorAll('[data-urg]').forEach(function(b){ b.classList.toggle('active', b.dataset.urg === 'all'); });
  render(true);
}

function toggleCard(id){
  const el = document.getElementById('card-' + id);
  el.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function render(expandMatches){
  const container = document.getElementById('cards');
  let html = '';
  ITEMS.forEach(function(item, idx){
    const catMatch = activeCat === 'all' || item.cat === activeCat;
    const urgMatch = activeUrg === 'all' || item.urgency === activeUrg;
    const srcMatch = activeSrc === null || item.source.indexOf(activeSrc) !== -1;
    if (!(catMatch && urgMatch && srcMatch)) return;
    const um = URG_META[item.urgency];
    const openClass = (activeSrc !== null && srcMatch) ? ' open' : '';
    html += '<div class="card' + openClass + '" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">' + String(idx+1).padStart(2,'0') + '</span>';
    html += '<span>' + um.emoji + '</span>';
    html += '<span class="badge" style="background:' + catColorVar(item.cat) + '">' + item.source.split(' / ')[0].split(' (')[0] + '</span>';
    html += '<span class="cattag">' + item.cat + '</span>';
    if(item.charts.count > 0 || item.charts.hot){ html += '<span>' + (item.charts.hot ? '🔥' : '📊') + '</span>'; }
    html += '<span class="title">' + item.title + '</span>';
    html += '</div>';
    html += '<div class="card-body">';
    html += '<div class="block-label">The Idea</div><div class="idea">' + item.idea + '</div>';
    html += '<div class="block-label">My Angle</div><div class="angle" style="border-left:2px solid ' + catColorVar(item.cat) + '">' + item.angle + '</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet a"><div class="lbl">TWEET A</div><p>' + item.tweetA + '</p><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet b"><div class="lbl">TWEET B</div><p>' + item.tweetB + '</p><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    html += '<div class="charts' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '🔥 CHART WORTH SAVING — ' : (item.charts.count>0 ? '📊 ' : '')) + item.charts.desc + '</div>';
    html += '<a class="readlink" href="' + item.link + '" target="_blank">↗ Read full article</a>';
    html += '</div></div>';
  });
  if(!html) html = '<p style="color:var(--sub)">No items match this filter.</p>';
  container.innerHTML = html;
}

function buildReport(){
  const rc = document.getElementById('reportContent');
  let html = '<b>Time window</b>' + META.windowStart + ' to ' + META.windowEnd + '. Emails outside this window were not processed.';
  html += '<b>Emails in window / read</b>' + META.emailsInWindow + ' / ' + META.emailsRead;
  html += '<b>Items extracted</b>' + META.itemsExtracted;
  html += '<b>Included sources</b>';
  html += META.includedSources.map(function(s){
    return '<span class="srcname" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span> (' + s.count + ')';
  }).join(' &middot; ');
  if(META.skippedSources.length){
    html += '<b>Skipped</b>' + META.skippedSources.map(function(s){ return s.name + ' — ' + s.reason; }).join(' &middot; ');
  } else {
    html += '<b>Skipped</b>None — all emails in the window contained original analytical content.';
  }
  rc.innerHTML = html;
}

document.getElementById('metaLine').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails';
buildFilters();
render();
buildReport();
</script>
