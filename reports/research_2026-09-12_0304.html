function esc(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function toggleCard(id) {
  var body = document.getElementById('body-' + id);
  body.classList.toggle('open');
}

function filterBySrc(name) {
  activeSrc = name;
  activeCat = "all";
  activeUrg = "all";
  renderFilterBars();
  renderCards();
}

function setCat(c) { activeCat = c; activeSrc = null; renderFilterBars(); renderCards(); }
function setUrg(u) { activeUrg = u; activeSrc = null; renderFilterBars(); renderCards(); }

function renderFilterBars() {
  var cats = {};
  ITEMS.forEach(function(i) { cats[i.cat] = (cats[i.cat] || 0) + 1; });
  var catBar = document.getElementById('catBar');
  var html = '<span class="pill' + (activeCat === 'all' ? ' active' : '') + '" style="' + (activeCat === 'all' ? 'background:#333;' : '') + '" onclick="setCat(\'all\')">All <span class="cnt">' + ITEMS.length + '</span></span>';
  Object.keys(cats).sort().forEach(function(c) {
    var color = CAT_COLORS[c] || '#999';
    var isActive = activeCat === c;
    html += '<span class="pill' + (isActive ? ' active' : '') + '" style="' + (isActive ? 'background:' + color + ';border-color:' + color + ';' : 'color:' + color + ';border-color:' + color + ';') + '" onclick="setCat(\'' + c + '\')">' + esc(c) + ' <span class="cnt">' + cats[c] + '</span></span>';
  });
  catBar.innerHTML = html;

  var urgCounts = { "act-now": 0, "deep": 0, "watch": 0 };
  ITEMS.forEach(function(i) { urgCounts[i.urgency]++; });
  var urgBar = document.getElementById('urgBar');
  var uhtml = '<span class="pill' + (activeUrg === 'all' ? ' active' : '') + '" style="' + (activeUrg === 'all' ? 'background:#333;' : '') + '" onclick="setUrg(\'all\')">All <span class="cnt">' + ITEMS.length + '</span></span>';
  Object.keys(URG).forEach(function(u) {
    var isActive = activeUrg === u;
    uhtml += '<span class="pill' + (isActive ? ' active' : '') + '" style="' + (isActive ? 'background:#555;border-color:#555;' : '') + '" onclick="setUrg(\'' + u + '\')">' + URG[u].emoji + ' ' + URG[u].label + ' <span class="cnt">' + urgCounts[u] + '</span></span>';
  });
  urgBar.innerHTML = uhtml;
}

function renderCards() {
  var container = document.getElementById('cards');
  var filtered = ITEMS.filter(function(i) {
    if (activeSrc && i.source.indexOf(activeSrc) === -1) return false;
    if (activeCat !== 'all' && i.cat !== activeCat) return false;
    if (activeUrg !== 'all' && i.urgency !== activeUrg) return false;
    return true;
  });
  var html = '';
  filtered.forEach(function(item, idx) {
    var color = CAT_COLORS[item.cat] || '#999';
    var u = URG[item.urgency];
    var chartFlag = '';
    if (item.charts.hot) chartFlag = '🔥';
    else if (item.charts.count > 0) chartFlag = '📊';
    var openClass = activeSrc ? ' open' : '';
    html += '<div class="card">';
    html += '<div class="card-head" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">' + String(idx + 1).padStart(2, '0') + '</span>';
    html += '<span>' + u.emoji + '</span>';
    html += '<span class="badge" style="background:' + color + '">' + esc(item.source) + '</span>';
    html += '<span class="catpill">' + esc(item.cat) + '</span>';
    if (chartFlag) html += '<span class="chartflag">' + chartFlag + '</span>';
    html += '<span class="title">' + esc(item.title) + '</span>';
    html += '</div>';
    html += '<div class="card-body' + openClass + '" id="body-' + item.id + '">';
    html += '<div class="label">The Idea</div><div class="idea">' + esc(item.idea) + '</div>';
    html += '<div class="label">My Angle</div><div class="angle" style="border-left:2px solid ' + color + '; background:' + color + '14;">' + esc(item.angle) + '</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet"><div class="lbl" style="color:#378add;">TWEET A</div><div class="txt">' + esc(item.tweetA) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet"><div class="lbl" style="color:#7f77dd;">TWEET B</div><div class="txt">' + esc(item.tweetB) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    if (item.charts.count > 0 || item.charts.desc) {
      html += '<div class="charts"><div class="chartbox' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '🔥 CHART WORTH SAVING — ' : (item.charts.count > 0 ? '📊 ' + item.charts.count + ' chart(s) — ' : '')) + esc(item.charts.desc) + '</div></div>';
    }
    html += '<div class="link" style="margin-top:10px;"><a href="' + esc(item.link) + '" target="_blank">↗ Read full article</a></div>';
    html += '</div>';
    html += '</div>';
  });
  if (filtered.length === 0) html = '<p style="color:#888;">No items match this filter.</p>';
  container.innerHTML = html;
}

function renderMeta() {
  document.getElementById('metaLine').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails';
}

function renderReport() {
  var body = document.getElementById('reportBody');
  var html = '<p><strong>Window:</strong> ' + esc(META.windowStart) + ' → ' + esc(META.windowEnd) + '. Emails outside this window were not processed.</p>';
  html += '<p><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp; <strong>Read:</strong> ' + META.emailsRead + ' &nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</p>';
  html += '<div class="label">Included Sources</div><ul>';
  META.includedSources.forEach(function(s) {
    html += '<li><span class="src" onclick="filterBySrc(\'' + esc(s.name).replace(/'/g, "\\'") + '\')">' + esc(s.name) + '</span> — ' + s.count + ' item(s)</li>';
  });
  html += '</ul>';
  html += '<div class="label">Skipped Sources</div><ul>';
  META.skippedSources.forEach(function(s) {
    html += '<li><strong>' + esc(s.name) + '</strong> — ' + esc(s.reason) + '</li>';
  });
  html += '</ul>';
  body.innerHTML = html;
}

renderMeta();
renderFilterBars();
renderCards();
renderReport();
</script>
</body>
</html>
