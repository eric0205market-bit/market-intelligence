<script>
var ITEMS = [{"id": 1, "cat": "AI/infra", "urgency": "red", "source": "Ben Pouladian / BEP Research", "title": "Lumentum CEO: optics 'almost sold out for 2029' — was 2027 in April", "idea": "In April Lumentum's CEO Hurlston said products were 'basically sold out' through 2027; today on Bloomberg it's 'almost sold out for 2029'. Lumentum is under-shipping demand by ~30% on some products into 2028 and ~70% on others in 2027. He also wants M&A (laser chips converging with CMOS; Japan/US/Europe, within ~a year) — BEP speculates a SiPho deal.", "angle": "$LITE is a physical demand marker: the sold-out horizon extended 2 years in 6 months. Cross-read to $COHR, $AAOI and the silicon-photonics supply chain; M&A target is the optionality.", "tweetA": "Sold-out horizon moved from 2027 to 2029 in six months. That's not a backlog, that's a queue. $LITE under-shipping by 70% on some lines next year means price, not volume, is the next variable. $COHR $AAOI", "tweetB": "Everyone is modeling AI capex as a spend number. The constraint is a laser fab. A CEO who says he can't ship 70% of demand and then goes shopping for SiPho assets is telling you where the margin pool moves next.", "charts": {"count": 0, "hot": false, "desc": "Short chat post; Bloomberg video linked"}, "link": "https://www.bloomberg.com/news/videos/2026-10-09/lumentum-ceo-opto-parts-capacity-sold-out-to-2029-video"}, {"id": 2, "cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom / Goldman S&T (Jason Klein)", "title": "$1 trillion a day traded, $11 million resting at top of book", "idea": "US equities average ~19B shares and ~$1T executed daily (+~10% y/y through Q3), but visible top-of-book depth is only ~$11M and has barely grown. On depth per dollar traded the market is thinner than in the 2022 bear market. The risk is what happens when volatility arrives and the book vanishes.", "angle": "Record volume is not depth. This is a gap-risk setup: sizing and stop placement should assume air pockets, especially in single names after a miss.", "tweetA": "$1T traded daily against $11M resting at the touch. That's roughly 90,000x turnover on the visible book. Busy is not liquid, and the next vol event finds out the difference in one print.", "tweetB": "Everyone celebrates record volume as proof of a healthy market. Depth per dollar is thinner than 2022. Volume is exhaust; resting size is the shock absorber, and it isn't there. Short-vol carry looks very different on this tape.", "charts": {"count": 1, "hot": true, "desc": "Goldman top-of-book depth vs executed value chart (in article)"}, "link": "https://thedarksideoftheboom.substack.com/p/a-1-trillion-tape-sitting-on-an-11"}, {"id": 3, "cat": "credit", "urgency": "deep", "source": "Dark Side of the Boom / Bloomberg (Michael Ball)", "title": "S&P holds while tech is 39% of distressed leveraged loans, CCC at ~1,000bp", "idea": "Index near records, but yields near multi-decade highs, oil back above $100, stronger dollar, Fed biased to tightening. Credit says otherwise: tech is 39% of distressed leveraged loans and CCC spreads are ~1,000bp. Rally leans on a shrinking group of mega-cap leaders; real danger is rising real yields plus credit stress plus no room for earnings misses.", "angle": "Equity vol and CCC spreads disagree; I side with credit. Software/tech leveraged loans are the AI-disruption trade showing up in the debt stack first.", "tweetA": "Tech is 39% of distressed leveraged loans. CCCs at ~1,000bp. The S&P at records. One of these markets is wrong, and the one with the covenants usually isn't.", "tweetB": "Either the equity index is right and tech credit is a dislocation to buy, or credit is early again. At 10y >5% and oil >$100, I'm not underwriting the first one without a catalyst.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/the-s-and-p-500-is-still-standing"}, {"id": 4, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily #180", "title": "OpenRouter spend share: Anthropic's ~75% lead is now roughly even with OpenAI", "idea": "At start of year Anthropic had ~3/4 of business spend across the two labs on OpenRouter (~120k companies); by September roughly even. Turning point was June: cheaper GPT-5.6 models and price cuts up to 80%. This week GPT-6 rolled to all 1.2B weekly ChatGPT users and Claude Haiku 5.5 launched with a 90% API price cut. Ramp data shows OpenAI ahead only a few days in mid-September.", "angle": "Anthropic's IPO case (author estimates >$100B revenue this year, >$200B next, pricing before Thanksgiving) rests on that lead. Price war compresses model-layer margins; benefits inference-heavy buyers and compute sellers.", "tweetA": "Anthropic went from ~75% of lab spend to a coin flip in nine months, and the response is a 90% price cut. When the leader cuts price 90% to defend share, you're no longer pricing a software margin. $NVDA doesn't care who wins. The IPO investors do.", "tweetB": "Ramp has OpenAI ahead for days. OpenRouter says even. The honest read: switching cost for model APIs is near zero, so 'lead' is a lagging indicator measured in weeks. Two IPOs are being priced on a moat that a startup CEO already called a 'honeymoon'.", "charts": {"count": 0, "hot": false, "desc": "No chart in email; WSJ/OpenRouter data in linked sources"}, "link": "https://michaelparekh.substack.com/p/more-of-the-same-in-ai-openai-vs"}, {"id": 5, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily #180", "title": "Musk: SpaceX Grok will use rival models incl. Claude — while Anthropic commits ~$85B to SpaceXAI data centers", "idea": "SpaceX will use the best model for any task to power its Grok agent, including Anthropic's Claude. SpaceX paid >$60B for Cursor earlier this year, the largest private tech payout ever. Anthropic is SpaceX's biggest compute tenant with ~$85B committed to SpaceXAI data centers.", "angle": "Frenemy stacks: a frontier-model competitor is also landlord and customer. Compute capacity is monetizable regardless of whose model wins; model-agnostic orchestration is where the leverage is.", "tweetA": "SpaceX owns a frontier lab, bought Cursor for $60B+, hosts Anthropic's $85B of compute, and now routes Grok tasks to Claude. Pick the layer that gets paid no matter who wins: it's the one with the power contracts.", "tweetB": "When the guy building a frontier model says he'll use a rival's when it's better, the model layer is commoditizing out loud. The $85B lease is the actual business.", "charts": {"count": 0, "hot": false, "desc": "None"}, "link": "https://michaelparekh.substack.com/p/more-of-the-same-in-ai-openai-vs"}, {"id": 6, "cat": "credit", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily #180", "title": "Tens of billions in AI chip debt: Broadcom $50B+, Oracle SPV lease, SpaceX $40B for Nvidia chips", "idea": "Broadcom is arranging >$50B for OpenAI's custom chip (Apollo, Blackstone in talks). Oracle is discussing with Apollo/Goldman a structure where investors fund a separate company that buys chips and leases them to Oracle. SpaceX has talked to lenders about $40B for Nvidia chips, after its June IPO. Last week high-yield data center bonds traded at a discount.", "angle": "Financing has moved from hyperscaler cash flow to IG bonds to private credit and SPVs. Off-balance-sheet lease structures are the 2026 version of vendor financing; watch who holds the residual value risk on GPUs.", "tweetA": "$50B Broadcom + $40B SpaceX + the Oracle SPV, all in one week. Hyperscalers used to fund chips from cash flow; now it's leased through a vehicle somebody else owns. Ask who holds the GPU residual value in year four.", "tweetB": "HY data center bonds are already trading at a discount while Apollo and Blackstone line up for more. Either private credit is pricing this correctly, or it's the marginal buyer of paper public markets won't touch.", "charts": {"count": 0, "hot": false, "desc": "None"}, "link": "https://michaelparekh.substack.com/p/more-of-the-same-in-ai-openai-vs"}, {"id": 7, "cat": "macro", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily #180", "title": "10y above 5% (24-year high), S&P forward P/E 19x vs 22x in January; four stocks > 3x the index gain", "idea": "10-year hit a 24-year high above 5% after its steepest quarterly rise since 1994. S&P trades ~19x next-year earnings, down from 22x in January; Nvidia's multiple also compressed. Microsoft, Nvidia, Apple and Meta added more than three times the index's gain last quarter while the other 496 subtracted collectively. Parekh draws the 1994 to 2000 analogy.", "angle": "Forward earnings yield ~5.3% vs a 5% risk-free: equity risk premium roughly zero, held up by four names. Concentration + rates is the fragility.", "tweetA": "S&P at 19x forward means ~5.3% earnings yield. The 10-year is above 5%. Equity risk premium is basically zero and four stocks did more than 3x the index's gain. 1994 rhymes.", "tweetB": "The other 496 stocks collectively subtracted last quarter. The index isn't rising, four balance sheets are. That's a funding-liquidity bet, not a broad earnings bet.", "charts": {"count": 0, "hot": false, "desc": "None"}, "link": "https://michaelparekh.substack.com/p/more-of-the-same-in-ai-openai-vs"}, {"id": 8, "cat": "tech", "urgency": "watch", "source": "Michael Parekh / AI Ramblings Daily #180", "title": "Microsoft/Nvidia launch Surface RTX Spark: $5,999 dev box with 128GB unified memory runs 120B+ models locally", "idea": "Surface RTX Spark Dev Box ($5,999, 128GB unified memory, runs >120B-parameter models, ships November) and Surface Laptop Ultra ($2,599, Oct 16), both on Nvidia's Arm RTX Spark. Apple Mac Studio now configurable to 528GB RAM (~$20k+). RAMageddon is raising PC prices. Parekh: local AI is a bargain next to compute bills of tens or hundreds of thousands a month.", "angle": "Local inference hardware is becoming a product category; unified memory is the spec that matters. Watch memory pricing ($MU, Samsung, SK Hynix) as local AI competes with data centers for DRAM.", "tweetA": "A 120B model on a $6k desk box. Against a six-figure monthly API bill that pays back in weeks. Local AI is the cheap hedge to the token price war, and it's competing with data centers for the same DRAM.", "tweetB": "Apple spent a decade building unified memory and Microsoft needed Nvidia to answer. 528GB Mac Studio vs 128GB Surface: the memory ceiling, not the TOPS, is the moat.", "charts": {"count": 0, "hot": false, "desc": "None"}, "link": "https://michaelparekh.substack.com/p/more-of-the-same-in-ai-openai-vs"}, {"id": 9, "cat": "credit", "urgency": "deep", "source": "Michael Parekh / AI-RTZ #1234", "title": "Nvidia as AI banker: $500B Blackstone framework, Firmus $15B backstop, CDS roughly doubled", "idea": "In August Nvidia announced a framework with Blackstone and others to raise $500B to finance Nvidia chips, with Nvidia providing credit support for up to a quarter of some projects. In June it backstopped loans for Firmus (Australia) to buy 170,000 Grace Blackwell/Vera Rubin chips worth >$15B for a cut of future cloud revenue. GPU-secured debt is now at least tens of billions (from Blackstone's $2.3B CoreWeave loan in 2023, now a $7.5B facility). Nvidia's CDS spreads have roughly doubled in recent months; rating is one rung below the top.", "angle": "Vendor financing at central-bank scale. If Nvidia finances more capacity than the market absorbs, it eats weaker pricing and guarantee losses. CDS doubling is the early signal.", "tweetA": "Nvidia's CDS has doubled while it backstops up to 25% of projects in a $500B financing framework. The company selling the chips is now the lender of last resort for the buyers. That's the circularity everyone joked about, now with a spread you can trade.", "tweetB": "GPUs are being turned into an asset class like aircraft: lenders must value them. Aircraft have 25-year lives and a secondary market. What's the residual on a chip that's obsolete in 3 years?", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-nvidia-the-ai-banker-and-its-next"}, {"id": 10, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ #1234", "title": "Neoclouds and sovereign AI: Nvidia building customers beyond the hyperscalers", "idea": "Top five clouds are >50% of Nvidia's data center revenue; one direct customer was 16% of revenue last quarter (~$15B). Neoclouds are likely low-double-digit % of revenue today, but an Nvidia employee told The Information they could be half. Only a handful have passed $200M annual revenue and none are profitable; Nebius rebuffed the revenue-share program. Sovereign AI: Korea, Australia, Kazakhstan, Saudi, UAE, India; BofA once estimated $50B a year.", "angle": "$15B = 16% implies ~$94B quarterly revenue. Replacing hyperscaler concentration with unprofitable neoclouds swaps one risk for another.", "tweetA": "One customer was $15B, 16% of Nvidia's quarter, which implies ~$94B in revenue. The diversification story is neoclouds where none are profitable. Concentration risk didn't go away, it got a worse balance sheet.", "tweetB": "AI factory with a flag on it: governments want their own compute on their own data. That's a defense-budget-style demand curve, price-insensitive and politically sticky.", "charts": {"count": 0, "hot": false, "desc": "None"}, "link": "https://michaelparekh.substack.com/p/ai-nvidia-the-ai-banker-and-its-next"}, {"id": 11, "cat": "culture", "urgency": "watch", "source": "Michael Parekh / AI-RTZ #1234 (citing The Information)", "title": "Nvidia run like a family business: Jensen's son-in-law Nico Caprez, 35, is 'Jensen's consigliere'", "idea": "Caprez (ex-Swiss ski racer, BCG, PSquared) joined Nvidia in 2024, was promoted VP of global AI infrastructure growth in January, co-leads the Cloud Partner program and manages multibillion-dollar relationships with neoclouds. He married Madison Huang (35, senior director physical AI) in September; Spencer Huang (36) runs robotics product. Jensen is 63 and has led Nvidia for 33 years.", "angle": "Succession and governance at a ~$5T company with key financing relationships running through one person is a risk factor nobody models.", "tweetA": "Key relationship for multibillion-dollar GPU financing: a 35-year-old former ski racer who married the CEO's daughter in September. 'If you want something done, talk to Nico.' At $5T that's a governance footnote worth reading.", "tweetB": "Nvidia's AI banking arm, its neocloud pipeline and its physical-AI bet all run through the founder's family. Succession isn't a 2035 question when the people are already in the seats.", "charts": {"count": 0, "hot": false, "desc": "None"}, "link": "https://michaelparekh.substack.com/p/ai-nvidia-the-ai-banker-and-its-next"}, {"id": 12, "cat": "crypto", "urgency": "watch", "source": "Check On Chain / Sidelined", "title": "BTC back near $80k: lessons from being a sidelined Bitcoiner (paywalled)", "idea": "Teaser only: author frames the 'move back down to $80k' after a month of price action as a test of whether it signals a return of the bear or a contrarian buy-the-dip opportunity. Behavioral argument: we lump-sum local highs, panic sell dips, and wait for cheaper prices that never come. Full video/article paywalled.", "angle": "Sentiment marker: premium on-chain shop is pitching dip-buying psychology at $80k. Worth a look at on-chain cost-basis levels in the full piece.", "tweetA": "Pain of missing a rally exceeds pain of a loss, so people chase highs and freeze at lows. BTC back at $80k and the sidelined crowd is exactly who gets the second chance. Whether they take it is the whole market.", "tweetB": "When on-chain research firms start writing about 'sidelined' investors, it usually means flows have already dried up. The question is whether $80k is where that crowd's cost basis sits.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening (premium)"}, "link": "https://newsletter.checkonchain.com/p/sidelined"}, {"id": 13, "cat": "macro", "urgency": "watch", "source": "Tavi Costa / Brazil: Three Big Themes", "title": "Brazilian stocks: commodity cycle set the stage before the elections", "idea": "Teaser: 'fascinating chart' argues the commodity cycle was setting up Brazilian equities long before elections; politics accelerated the move and what was a major obstacle may become an enabler. Report covers three themes of the Brazil strategy, a new company, and miners.", "angle": "LatAm as a commodity-cycle expression. A new Brazil name is promised in the full piece.", "tweetA": "Brazil's rally started with the commodity cycle, not the ballot box. Politics just lit the fuse. If the macro driver is copper and iron ore, the election is a tailwind, not the thesis.", "tweetB": "The market is debating who wins the election while the cycle is already pricing it. Same pattern as Argentina: macro first, politics as accelerant.", "charts": {"count": 1, "hot": true, "desc": "One chart teased (Brazil vs commodity cycle)"}, "link": "https://tavicosta.substack.com/p/brazil-three-big-themes"}, {"id": 14, "cat": "labor", "urgency": "watch", "source": "McKinsey / The Weekend Read (Krivkovich, Weddle, Price, Sohoni)", "title": "Only 11% of organizations reached AI 'reinvention'; $1 on AI needs $3 on change management", "idea": "Just 11% of organizations have reached the 'reinvention' horizon where AI changes how work gets done. Dreamforce takeaway: for every $1 spent deploying AI, firms may need $3 on change management, yet most do the reverse. Also: CFOs can release 10-30% of working capital; banks pitched digital twins for nonfinancial risk; mid-sized heartland cities could add trillions in output.", "angle": "Gap between AI capex and enterprise adoption: the demand side of the $1T buildout is bottlenecked by organizations, not models. Supports services/integration names.", "tweetA": "Hyperscalers spend hundreds of billions on AI supply. Only 11% of companies have reinvented how work gets done. Capex is running way ahead of the organizational capacity to absorb it.", "tweetB": "McKinsey says $3 of change management per $1 of AI. Nobody budgets it that way. That is where the AI ROI gap lives, and the first CFO to fix it wins margin.", "charts": {"count": 0, "hot": false, "desc": "None"}, "link": "https://email.mckinsey.com/featured-insights/the-weekend-read"}];

    +'<div class="tb"><div class="lbl" style="color:#7f77dd;margin-top:0">TWEET B</div>'+esc(item.tweetB)+'<br><button class="copy-btn" onclick="copyTweet('+item.id+',\'b\')">📋 Copy</button></div></div>'
    +'<div class="ch'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING — ':'')+item.charts.count+' chart(s). '+esc(item.charts.desc)+'</div>'
    +'<div style="margin-top:8px"><a href="'+item.link+'" target="_blank" rel="noopener">↗ Read full article</a></div></div></div>';
  });
  document.getElementById('cards').innerHTML=out;
}
document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+META.itemsExtracted+' items';
var r='<p>Window: '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</p><p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</p><b>Included sources</b><ul>';
META.includedSources.forEach(function(s){r+='<li><span class="src" onclick="filterBySrc(\''+s.name.split(' (')[0].split(' /')[0].replace(/'/g,'')+'\')">'+esc(s.name)+'</span> — '+s.items+'</li>';});
r+='</ul><b>Skipped</b><ul>';META.skippedSources.forEach(function(s){r+='<li>'+esc(s.name)+': '+esc(s.reason)+'</li>';});
document.getElementById('rb').innerHTML=r+'</ul>';
render();
</script></body></html>
