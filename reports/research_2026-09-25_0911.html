  list.forEach(function(item){
    var color = CAT_COLORS[item.cat] || '#666';
    var chartIcon = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');
    html += '<div class="card" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">' + String(item.id).padStart(2,'0') + '</span>';
    html += '<span>' + URG_EMOJI[item.urgency] + '</span>';
    html += '<span class="badge" style="background:' + color + '">' + esc(item.source.split(' / ')[0]) + '</span>';
    html += '<span class="tag">' + esc(CAT_LABELS[item.cat]||item.cat) + '</span>';
    if (chartIcon) html += '<span class="chartmark">' + chartIcon + '</span>';
    html += '<span class="title">' + esc(item.title) + '</span>';
    html += '</div>';

    html += '<div class="card-body">';
    html += '<div class="label">The Idea</div><div class="idea">' + esc(item.idea) + '</div>';
    html += '<div class="label">My Angle</div><div class="angle" style="border-left:2px solid ' + color + '; background:' + color + '12;">' + esc(item.angle) + '</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet a"><div class="tlabel">TWEET A</div><p>' + esc(item.tweetA) + '</p><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet b"><div class="tlabel">TWEET B</div><p>' + esc(item.tweetB) + '</p><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    html += '<div class="chart-box' + (item.charts.hot?' hot':'') + '">' + (item.charts.count>0 ? ('📊 ' + item.charts.count + ' chart(s) — ') : '') + esc(item.charts.desc) + '</div>';
    html += '<div class="linkrow"><a href="' + item.link + '" target="_blank">↗ Read full article</a></div>';
    html += '</div>';
    html += '</div>';
  });
  document.getElementById('cards').innerHTML = html || '<p style="color:var(--muted)">No items match this filter.</p>';
}

function renderReport(){
  var html = '';
  html += '<h4>Time Window</h4><div>' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</div>';
  html += '<h4>Emails</h4><div>' + META.emailsInWindow + ' in window · ' + META.emailsRead + ' read · ' + META.itemsExtracted + ' items extracted</div>';
  html += '<h4>Included Sources</h4>';
  META.includedSources.forEach(function(s){
    html += '<div><span class="srcline" onclick="filterBySrc(\'' + esc(s.name).replace(/'/g,"\\'") + '\')">' + esc(s.name) + '</span> — ' + s.count + ' item(s)</div>';
  });
  html += '<h4>Skipped Sources</h4>';
  META.skippedSources.forEach(function(s){
    html += '<div>' + esc(s.name) + ' — ' + esc(s.reason) + '</div>';
  });
  document.getElementById('reportBody').innerHTML = html;
}

function render(){
  renderFilters();
  renderCards();
}

function init(){
  document.getElementById('metaLine').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails';
  render();
  renderReport();
}
init();
</script>
</body>
</html>
