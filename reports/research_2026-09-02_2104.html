{id:17,cat:"geopolitics",urgency:"deep",source:"Dark Side of the Boom (via Goldman Sachs)",

 idea:"China's 10-year government bond yields near 1.7% versus the US 10-year more than 300bps higher, which makes RMB internationalization a hard sell without expected currency appreciation to compensate foreign holders. Goldman's base case: controlled RMB appreciation of 3-5%/year, taking USDCNY to ~6.00 by end-2028 and ~5.50 by end-2031, with the currency move offsetting the yield gap without a damaging rise in the real trade-weighted exchange rate given lower Chinese inflation.",
 angle:"A slow, controlled RMB rise over 5+ years is a very different trade than a de-dollarization shock — it's a multi-year carry/FX thesis, not an event trade, and it directly counters the 'China devalues to export deflation' narrative that's more common in the geopolitics discourse.",
 tweetA:"Goldman's China call isn't devaluation, it's the opposite: a slow-motion 25%+ RMB appreciation through 2031, engineered specifically to make Chinese bonds attractive enough to internationalize despite a 300bp yield gap to Treasuries. That's the quiet de-dollarization mechanism nobody's positioning for.",
 tweetB:"China's yield disadvantage to the US is over 300bps and growing. A controlled currency appreciation is the only way Beijing gets foreign capital into RMB bonds without cutting rates it doesn't want to cut. Watch USDCNY 6.00 as the 2028 marker, not any single policy headline.",
 charts:{count:0,hot:false,desc:""}, link:"https://thedarksideoftheboom.substack.com/p/beijing-may-let-the-renminbi-rise"},

{id:18,cat:"macro",urgency:"watch",source:"Haymaker Daily",
 title:"The 2026 rally is broader than the headline S&P number suggests",
 idea:"The S&P 500 is up roughly 12.5% YTD on a total return basis, but the equally-weighted S&P index is running slightly ahead of that number — meaning the average stock, not just the mega-caps, is participating in this year's advance more than in prior AI-led rally years.",
 angle:"Breadth confirmation matters directly for the 'is this still American exceptionalism or is it 7 stocks' debate — equal-weight outperforming cap-weight is evidence against the narrow-leadership bear case that's been a consensus worry all year.",
 tweetA:"Equal-weight S&P is beating cap-weight S&P YTD. If this were still a 'Mag 7 carries everything' market, that wouldn't be true. The breadth bears have been wrong about market structure for most of 2026, not just about direction.",
 tweetB:"12.5% YTD total return with equal-weight ahead of cap-weight is a genuinely different regime than 2023-24's mega-cap-only rally. The 'AI bubble concentrated in 7 names' framing that most people still use to describe this market is already stale.",
 charts:{count:0,hot:false,desc:""}, link:"https://haymaker.substack.com/p/haymaker-daily-6d3"},

{id:19,cat:"regulation",urgency:"watch",source:"Young and Calculated",
 title:"The LME cancelled $3.9bn of already-executed trades in 2022 — and 'trade finality' became a probability, not a fact",
 idea:"When a single Chinese producer's ~150,000-tonne short position threatened clearing-member defaults in March 2022, the London Metal Exchange simply reversed a morning's worth of matched, confirmed nickel trades rather than let members fail. That decision — a venue rewriting settled reality after the fact — now sits inside every commodity desk's risk assumptions as a live tail risk, not a historical curiosity.",
 angle:"This is the cleanest recent example of the piece's general rule: concentration is dangerous relative to the venue, not relative to your own fund size — a position that looks fine on your internal risk report can BE the market at the exchange level.",
 tweetA:"The LME didn't just have a bad day in 2022, it proved that 'my trade executed and cleared' is now a conditional statement, not a fact — reversible if a big enough short can't cover. Every desk pricing counterparty risk should model that as a real tail, not a black swan footnote.",
 tweetB:"A position that's 3% of your fund can be 40% of open interest at the venue — that's the number that determines whether you can actually exit, and it's never on your own risk report. The LME nickel episode is the case study for why concentration has to be measured against the exchange, not your own book.",
 charts:{count:0,hot:false,desc:""}, link:"https://youngandcalculated.substack.com/p/the-trades-that-changed-market-structure"},

{id:20,cat:"regulation",urgency:"watch",source:"Young and Calculated",
 title:"The Hunt brothers didn't lose to a better trader, they lost to the exchange rewriting the rules mid-position",
 idea:"The Hunt brothers controlled roughly a third of the world's privately held silver at the 1980 peak by taking physical delivery instead of rolling futures — shrinking the deliverable float against every other short. COMEX's response, Silver Rule 7, restricted the contract to liquidation-only and killed the bid within hours; Silver Thursday followed with a one-third single-session crash and a $1.1bn bank bailout of the family's position.",
 angle:"Federal speculative position limits and exchange emergency-declaration authority both trace directly to this episode — and both were invoked again in 2022's LME nickel reversal, showing the same regulatory muscle memory gets reused nearly 45 years later.",
 tweetA:"The Hunts weren't beaten by a smarter counterparty. They were beaten by COMEX changing the contract's rules while they held the position — legally, foreselably in hindsight, and completely outside their risk model. Exchange rules are endogenous to your own size.",
 tweetB:"Silver Rule 7 in 1980 and the LME nickel reversal in 2022 are the same regulatory reflex, 42 years apart: when a position gets big enough to threaten clearing members, the venue changes the game mid-hand. Any commodity position sized to move the deliverable float should assume this is coming.",
 charts:{count:0,hot:false,desc:""}, link:"https://youngandcalculated.substack.com/p/the-trades-that-changed-market-structure"},

{id:21,cat:"regulation",urgency:"watch",source:"Young and Calculated",
 title:"One rogue trader's €50bn position moved a global index — and gross notional became its own risk limit because of it",
 idea:"Jérôme Kerviel's ~€50bn concealed notional exposure at Société Générale exceeded his own bank's market cap. The bank's monitoring only tracked net exposure — fictitious offsetting trades made the net look small — so the position went undetected until January 2008. Unwinding it over three sessions contributed materially to a >5% single-day Euro Stoxx 50 decline, which the Fed cited in part when it cut rates 75bps in an unscheduled emergency move.",
 angle:"A single institution's forced unwind moving a continental index by a measurable, cited amount is direct evidence that liquidation risk is a market-wide factor, not an idiosyncratic one — which is exactly the CTA/vol-control crowding risk flagged elsewhere in today's reads (Dark Side of the Boom, Alethean Narrative).",
 tweetA:"One trader's unwind at one French bank helped move the Fed to an emergency 75bp cut. Gross notional wasn't a monitored risk limit before Kerviel — only net was — because a fictitious hedge only works when nobody's looking at the gross number. It is now, everywhere.",
 tweetB:"Connect this to today's CTA-crowding story: if one concealed €50bn position could move a continental index enough to influence Fed policy, imagine what a fully-invested, no-dry-powder systematic complex does when volatility actually spikes. The mechanism is identical, just distributed instead of concentrated.",
 charts:{count:0,hot:false,desc:""}, link:"https://youngandcalculated.substack.com/p/the-trades-that-changed-market-structure"},

{id:22,cat:"regulation",urgency:"watch",source:"Young and Calculated",
 title:"Porsche's Volkswagen squeeze proved 'days to cover' means nothing if you don't know the real float",
 idea:"Porsche's October 2008 disclosure of 42.6% direct VW ownership plus cash-settled options on another 31.5% revealed that short interest exceeded the entire genuine free float (under 6%), because German disclosure rules at the time didn't capture cash-settled derivatives. VW briefly became the world's largest company by market cap as shorts scrambled to cover a stock that barely traded; hedge fund losses were estimated at €20-30bn.",
 angle:"The permanent fix — calculating days-to-cover against verified real float rather than shares outstanding — is a check that's still worth running manually on any heavily-shorted small/mid-cap where a strategic holder's derivative position isn't fully disclosed.",
 tweetA:"VW briefly became the most valuable company on Earth because shorts didn't know 94% of the float was already spoken for through cash-settled options that carried zero disclosure obligation. 'Days to cover' is fiction if you're calculating it against shares outstanding instead of verified free float.",
 tweetB:"Every short squeeze retrospective treats VW/Porsche as a one-off. It's not — it's the same disclosure-gap mechanism as GME, just with derivatives instead of options-market gamma. The lesson generalizes: any instrument with equivalent economic exposure but no reporting requirement can hide the real squeeze risk.",
 charts:{count:0,hot:false,desc:""}, link:"https://youngandcalculated.substack.com/p/the-trades-that-changed-market-structure"},

{id:24,cat:"crypto",urgency:"watch",source:"Ignas | DeFi Research",
 title:"A $757m TVL chain is generating $17m a day in fees — an 819% APR nobody's arbitraging away yet",
 idea:"Robinhood Chain (live since July) is running $757m TVL against $17m in daily app fees — 819% APR, or 2.24%/day — because the volume comes almost entirely from meme-coin degens using Fomo and Robinhood Wallet, neither of which has an LP feature, so nobody is providing liquidity to capture the fees. Tokenized-stock/meme pairs (AI/NVDA, BONER/HIMS) are among the chain's top fee-generating pools, and JPMorgan has reportedly asked Visa to review Robinhood Wallet's credit-card meme purchases.",
 angle:"The inefficiency exists specifically because the retail flow (credit-card meme buys) and the LP supply (DeFi-native yield farmers) haven't found each other yet — that gap closes as soon as a fund-sized LP notices, so the window is short and pool-size-constrained by design.",
 tweetA:"819% APR sitting unclaimed on a $757m chain because the volume comes from meme traders buying with credit cards, not DeFi natives who know how to LP. JPMorgan is worried enough about the credit-card angle to ask Visa to look into it — that's your signal this flow is real, not wash trading.",
 tweetB:"The stock/meme arbitrage pools (AI/NVDA, BONER/HIMS) are quietly some of the highest fee-generating pools on any chain right now, and funds can't touch them because they're too small individually. That's a structural inefficiency that only exists until someone builds an aggregator across all 27 pairs.",

{id:25,cat:"macro",urgency:"deep",source:"Dark Side of the Boom (via Simon White)",
 title:"The Treasury is starting to act like a shadow central bank",
 idea:"Simon White's argument, per Dark Side of the Boom: heavier reliance on T-bill issuance is turning Treasury liabilities into closer substitutes for central bank money — short maturity, zero haircut, repeatedly reused as repo collateral — which increases the political constraints on the Fed's ability to tighten, since higher rates now flow straight through to federal borrowing costs at bill-like speed.",
 angle:"This inverts the 2007 'shadow banking' framing (private lenders acting like banks) into 2026's mirror image: the sovereign acting like the central bank. It's a structural argument for why hikes get harder to sustain the more bill-heavy the debt stock becomes — directly relevant to the Sept 15-16 FOMC debate running through three other pieces in this window.",
 tweetA:"2007's shadow banking problem was private lenders acting like banks. 2026's version is the US Treasury acting like a shadow Fed — bill issuance so heavy that its own liabilities behave like money, which quietly straitjackets how far Warsh can actually hike.",
 tweetB:"Every hike now flows almost directly into the government's own borrowing cost because the debt stock has shifted so heavily to bills. That's a self-limiting mechanism on rate hikes that doesn't show up in any Fed model — it's fiscal math constraining monetary policy in real time.",
 charts:{count:0,hot:false,desc:""}, link:"https://thedarksideoftheboom.substack.com/p/the-treasury-is-becoming-a-shadow"},

{id:26,cat:"positioning",urgency:"deep",source:"The Market House (interview w/ Jared Dillian)",
 title:"A portfolio that fell 9% in the GFC while the S&P fell 57%, and gives up almost nothing in returns",
 idea:"Jared Dillian's 'Awesome Portfolio,' back-tested over 50+ years: max drawdown ever was 12%, the GFC drawdown was only 9%, and the next three worst drawdowns were all 1% — while annual returns run only 1-2% below the S&P. Separately, Dillian flags leveraged ETF assets up 4-4.5x in recent years, whose daily rebalancing swaps can produce large market-on-close orders that amplify volatility in ways the market hasn't been tested against at this scale.",
 angle:"Size your risk first, then back out the return — Dillian's actual argument is a portfolio construction philosophy, not a specific allocation, and the leveraged-ETF flag is a distinct systemic-risk data point worth pairing with the CTA-crowding and vol-control items elsewhere in this window.",
 tweetA:"9% drawdown in the GFC while the S&P fell 57%, giving up only 1-2% of annual return to get it. Most 'stress-free' portfolio pitches are marketing. This one has a 50-year backtest that says the tradeoff is real, not a rounding error.",
 tweetB:"Leveraged ETF AUM is up 4-4.5x in a few years, and their daily rebalancing swaps create market-on-close flow that scales with volatility itself — a feedback loop the market has never actually been tested against at this size. That's a bigger tail risk than most people's September hedges are pricing.",
 charts:{count:0,hot:false,desc:""}, link:"https://themarkethouse.substack.com/p/the-awesome-portfolio-from-jared"},

{id:27,cat:"macro",urgency:"actnow",source:"The News Block",
 title:"Warsh's first Jackson Hole speech as Fed chair: inflation isn't beaten, and the market heard it",
 idea:"In his debut Jackson Hole address, Kevin Warsh stressed the Fed's preferred inflation gauge is still running at 3.7% against a 2% target, with price pressure spread broadly rather than concentrated in one or two categories. September rate-hike odds jumped immediately after the speech; Bitcoin pulled back from above $80,000 and Treasury yields moved higher in direct response.",
 angle:"This is the speech that reset the entire September macro calendar everyone in this window is reacting to — the ADP miss, the payroll preview, the narrowing-corridor thesis, and the bitcoin pullback all trace back to this one data point (3.7% vs. 2%).",
 tweetA:"3.7% vs. a 2% target, spread broadly across categories, not concentrated — that's the number Warsh chose to lead with in his first Jackson Hole speech as chair. Every 'will the Fed hike in September' debate this week is downstream of that one sentence.",
 tweetB:"Bitcoin dropped from above $80k the moment Warsh spoke. That's a cleaner real-time inflation-expectations gauge than the bond market gave you that day — crypto is now trading Fed hawkishness faster than rates markets are repricing it.",
 charts:{count:0,hot:false,desc:""}, link:"https://thenewsblock.substack.com/p/bitcoins-september-test"},

{id:28,cat:"macro",urgency:"deep",source:"The News Block",
 title:"US debt crossed $40 trillion, and Druckenmiller calls the Treasury's bond buybacks 'price management'",
 idea:"Federal debt has more than doubled over the last decade and crossed $40 trillion for the first time in August. Starting September 9, Treasury doubles its bond buyback ceiling from $2bn to at least $4bn per operation on 10-30 year debt, officially to improve market liquidity — but Stanley Druckenmiller, a former mentor to Treasury Secretary Bessent, has publicly characterized the move as a form of price management rather than a liquidity fix.",
 angle:"Druckenmiller calling out his own protégé's Treasury for yield-curve price management is a notable break in a normally aligned relationship — worth watching whether other macro heavyweights follow him in framing Treasury buybacks as quasi-QE by another name.",
 tweetA:"$40 trillion in debt, and Treasury just doubled its bond-buyback ceiling to $4bn per operation starting Sept 9. Druckenmiller — Bessent's own mentor — is calling it price management. When your mentor breaks publicly with your policy, that's not a partisan attack, that's a credibility problem.",
 tweetB:"Pair this with the 'Treasury as shadow Fed' thesis from the same newsletter cluster today: bill issuance making Treasury liabilities money-like, plus doubled buybacks managing the long end. Two separate mechanisms, same direction — fiscal policy is doing the Fed's job by other means.",
 charts:{count:0,hot:false,desc:""}, link:"https://thenewsblock.substack.com/p/bitcoins-september-test"},

{id:29,cat:"crypto",urgency:"deep",source:"The News Block",
 title:"21 major banks including JPMorgan and Goldman are forming a joint dollar stablecoin, launch targeted H1 2027",
 idea:"On September 1, a consortium of 21 major financial institutions — JPMorgan, Goldman Sachs, Bank of America, Citi, and Deutsche Bank among them — announced plans to form a company issuing a joint dollar-backed stablecoin, with launch targeted for the first half of 2027. This is the same JPMorgan whose CEO once called Bitcoin a fraud.",
 angle:"The framing worth stealing: stablecoins upgrade the rails, they don't change the money — it's still a dollar, still subject to the same monetary and fiscal system, which is precisely why it strengthens the dollar's reach internationally while leaving Bitcoin's core differentiated pitch (no issuer, no supply vote) fully intact.",
 tweetA:"JPMorgan called Bitcoin a fraud and is now one of 21 banks building a joint stablecoin. That's not capitulation to crypto — it's the banking system accepting Bitcoin's actual insight (money should move at internet speed) while keeping every bit of issuer control Bitcoin was built to remove.",
 tweetB:"A 21-bank stablecoin consortium targeting 2027 actually strengthens the Bitcoin bull case, not weakens it: once every form of fiat can move instantly, the only question left is what you actually want to hold when you're not transacting — and a bank consortium can't answer that one for you.",
 charts:{count:0,hot:false,desc:""}, link:"https://thenewsblock.substack.com/p/bitcoins-september-test"},

{id:31,cat:"crypto",urgency:"deep",source:"Ecoinometrics",
 title:"Bitcoin ETF flows just went from 9 straight days of inflows to a stutter-step pattern",
 idea:"Bitcoin broke above $80,000 last week on nine consecutive days of ETF inflows but has since stalled. Since the Fed's hawkish Jackson Hole message, flows have gone outflow, inflow, outflow — not a trend break, but a meaningfully less consistent demand picture than the run that carried the breakout.",
 angle:"Flow consistency, not flow direction, is the tell here — a single week of choppy flows right after Warsh's hawkish Jackson Hole speech is the ETF-market's version of the same macro repricing showing up in ADP, gold, and equity momentum scans elsewhere in this window.",
 tweetA:"Nine straight days of ETF inflows carried Bitcoin through $80k. Since Warsh's Jackson Hole speech: outflow, inflow, outflow. That's not distribution yet, but it's the first sign of hesitation in flow data since the breakout — worth watching before assuming the trend just continues.",
 tweetB:"Every asset in this window flinched the same week Warsh spoke hawkish at Jackson Hole — gold correcting, equity momentum rotating defensive, and now Bitcoin ETF flows losing their one-way consistency. That's one macro catalyst rippling through four unrelated asset classes simultaneously.",
 charts:{count:0,hot:false,desc:"Charts inside on daily ETF flow data and price overlay."}, link:"https://ecoinometrics.substack.com/p/bitcoin-etf-demand-still-points-higher"},

{id:32,cat:"gold",urgency:"deep",source:"Robert Sinn (Goldfinger Capital)",
 title:"Same gold belt, three market caps: $70m, $1.5bn, and $4bn",
 idea:"Tiger Gold (~C$86m market cap) sits in Colombia's Mid-Cauca gold-copper belt alongside Collective Mining (~$1.5bn) and Aris Mining (~$4bn) — same structural corridor, same geology. Tiger's Ceibal discovery has returned 685m at 0.6 g/t Au from surface, with mineralization traced to ~800m depth and still open; a new pro-mining Colombian president (De La Espriella, took office Aug 7) is reversing the prior administration's hostility, with an estimated $3.6-4bn in mining investment sitting on the sidelines waiting for a permitting signal.",
 angle:"A 50-60x market-cap gap for comparable geology in the same belt is either a real risk discount (permitting, dilution, $480m capex requirement vs. $86m market cap) or a mispricing waiting on the same political catalyst that just flipped — the resource conversion path over the next two quarters (Ceibal maiden resource Q1 2027) is the thing to track.",
 tweetA:"Tiger Gold, Collective Mining, and Aris Mining all sit in the same Colombian gold belt. Market caps: $70-90m, $1.5bn, $4bn. That's not a random spread — it's a derisking ladder, and the newest pro-mining Colombian president just removed the biggest reason Tiger was still at the bottom of it.",
 tweetB:"$3.6-4bn of mining investment is reportedly sitting on the sidelines waiting for Colombia's permitting environment to improve. That's roughly 40-50x Tiger Gold's entire market cap in capital waiting to deploy into the exact belt Tiger already holds 100% of.",
 charts:{count:0,hot:false,desc:""}, link:"https://robertsinn.substack.com/p/a-rare-combination-of-existing-ounces"},

{id:33,cat:"macro",urgency:"watch",source:"Bespoke Investment Group",
 title:"September's bad reputation mostly comes from years the market was already ugly heading in",
 idea:"Bespoke's seasonal breakdown: most of September's historically poor average return is driven by years when the market was already declining heading into the month, not by September itself carrying some intrinsic curse. This September starts with rates at multi-year highs, WTI back near $90 on renewed Middle East tension, and the Fed expected to hike — a setup investors are already worried about independent of the calendar.",
 angle:"Combined with Bulltard's momentum-scan read (energy/defensive leadership) and the Alethean Narrative's mid-October risk window, the seasonal data itself is neutral-to-mildly-bearish only because the fundamental backdrop already is — the calendar isn't adding independent risk this year.",
 tweetA:"September's curse is a conditional effect, not an unconditional one — it's bad in years the market enters already weak. This year checks that box anyway: rates at multi-year highs, oil near $90, a hike priced in. The seasonality isn't the risk, it's just correlated with a risk that's already there.",
 tweetB:"Stop treating 'September is historically weak' as a standalone trading signal. The real base rate: September is weak conditional on the market already being weak in August. This year's setup (rates, oil, Fed) means the conditional applies — but it's the fundamentals doing the work, not the month.",
 charts:{count:0,hot:false,desc:""}, link:"https://bespokeinvest.substack.com/p/not-all-septembers-are-created-equal"},
];

function setCat(c){

  document.querySelectorAll('#catFilters .pill').forEach(function(b){
    const isActive = b.getAttribute('data-cat') === c;
    b.classList.toggle('active', isActive);
    if(isActive){ b.style.background = c==='all' ? '#333' : catColor(c); b.style.borderColor = 'transparent'; b.style.color = '#fff'; }
    else { b.style.background = 'transparent'; b.style.borderColor = 'var(--chip-border)'; b.style.color = 'var(--text-dim)'; }
  });
  render();
}
function setUrg(u){
  activeUrg = u; activeSrc = null;
  document.querySelectorAll('#urgFilters .pill').forEach(function(b){
    const isActive = b.getAttribute('data-urg') === u;
    b.classList.toggle('active', isActive);
    if(isActive){ b.style.background = '#333'; b.style.borderColor = 'transparent'; b.style.color = '#fff'; }
    else { b.style.background = 'transparent'; b.style.borderColor = 'var(--chip-border)'; b.style.color = 'var(--text-dim)'; }
  });
  render();
}
function filterBySrc(name){
  activeSrc = name; activeCat = 'all'; activeUrg = 'all';
  setCat('all'); setUrg('all');
  activeSrc = name;
  render();
  var wanted = ITEMS.filter(function(i){ return i.source.indexOf(name) !== -1; }).map(function(i){return i.id;});
  wanted.forEach(function(id){
    var card = document.getElementById('card-'+id);
    if(card) card.classList.add('open');
  });
}

function render(){
  const wrap = document.getElementById('cards');
  let list = ITEMS.filter(function(i){
    if(activeCat !== 'all' && i.cat !== activeCat) return false;
    if(activeUrg !== 'all' && i.urgency !== activeUrg) return false;
    if(activeSrc && i.source.indexOf(activeSrc) === -1) return false;
    return true;
  });
  let html = '';
  list.forEach(function(item, idx){
    const cc = catColor(item.cat);
    const chartFlag = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');
    html += '<div class="card" id="card-'+item.id+'">';
    html += '<div class="card-header" onclick="toggleCard('+item.id+')">';
    html += '<span class="idx">'+String(idx+1).padStart(2,'0')+'</span>';
    html += '<span class="urg">'+URG_EMOJI[item.urgency]+'</span>';
    html += '<span class="src-badge" style="background:'+cc+'">'+item.source.split(' (')[0].split(' /')[0]+'</span>';
    html += '<span class="cat-tag">'+(CAT_LABELS[item.cat]||item.cat)+'</span>';
    if(chartFlag) html += '<span class="chart-flag">'+chartFlag+'</span>';
    html += '<span class="title">'+item.title+'</span>';
    html += '</div>';
    html += '<div class="card-body">';
    html += '<div class="block-label">The Idea</div><div class="idea-text">'+item.idea+'</div>';
    html += '<div class="block-label">My Angle</div><div class="angle" style="border-color:'+cc+';background:'+cc+'12">'+item.angle+'</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet"><div class="tweet-label" style="color:var(--tweetA)">TWEET A</div><div class="tweet-text">'+item.tweetA+'</div><button class="copy-btn" onclick="copyTweet('+item.id+',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet"><div class="tweet-label" style="color:var(--tweetB)">TWEET B</div><div class="tweet-text">'+item.tweetB+'</div><button class="copy-btn" onclick="copyTweet('+item.id+',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    if(item.charts.desc){
      html += '<div class="chart-box'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 ':'📊 ')+item.charts.desc+'</div>';
    }
    html += '<div class="link-row"><a href="'+item.link+'" target="_blank">↗ Read full article</a></div>';
    html += '</div></div>';
  });
  if(list.length === 0){ html = '<div style="padding:30px;text-align:center;color:var(--text-faint)">No items match this filter.</div>'; }
  wrap.innerHTML = html;
}

function toggleCard(id){
  const card = document.getElementById('card-'+id);
  card.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function buildReport(){
  document.getElementById('metaLine').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources';
  let html = '<p>Window: <strong>'+META.windowStart+'</strong> to <strong>'+META.windowEnd+'</strong> (last 6 hours). Emails in window: <strong>'+META.emailsInWindow+'</strong>. Emails read in full: <strong>'+META.emailsRead+'</strong>. Items extracted: <strong>'+META.itemsExtracted+'</strong>.</p>';
  html += '<h4>Included Sources</h4><div>';
  META.includedSources.forEach(function(s){
    html += '<div><span class="src-link" onclick="filterBySrc(\''+s.name.replace(/'/g,"\\'")+'\')">'+s.name+'</span> — '+s.count+' item'+(s.count>1?'s':'')+'</div>';
  });
  html += '</div>';
  html += '<h4>Skipped Sources</h4><div>';
  META.skippedSources.forEach(function(s){
    html += '<div><strong>'+s.name+'</strong> — '+s.reason+'</div>';
  });
  html += '</div>';
  document.getElementById('reportBody').innerHTML = html;
}

document.getElementById('reportToggle').addEventListener('click', function(){
  const card = document.getElementById('reportCard');
  card.classList.toggle('open');
  document.getElementById('reportChevron').textContent = card.classList.contains('open') ? '▾' : '▸';
});

buildFilters();
render();
buildReport();
</script>
