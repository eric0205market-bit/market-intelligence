<script>
const ITEMS = [{"id": 1, "cat": "macro", "urgency": "deep", "source": "Bespoke Investment Group", "title": "Kospi -20% in seven sessions: only Covid March 2020 was worse", "idea": "Korea's Kospi is down more than 20% in 7 sessions, including -7.6% last night; you have to go back to March 2020 to find a larger 7-day decline. Japan's Nikkei is down 6 straight sessions (~9%), half of it from a -4.9% print last night. India's Sensex was the one bright spot, +2%, because it has largely sat out the AI trade.", "angle": "The AI-beta map: Korea and Taiwan are the high-beta end, India the un-owned end. Positioning, not earnings, is driving the tape.", "tweetA": "Kospi -20% in seven sessions. The only deeper seven-day drop on record is March 2020, and there's no virus this time, just a capex narrative. Meanwhile the Sensex is +2% because India never owned the trade. That's your AI-beta map on one screen. $EWY $INDA", "tweetB": "Nasdaq is roughly flat on the month. Kospi is down mid-teens. When a drawdown this size lands in the index with the fattest memory weights, the question isn't 'is AI over', it's who else carries the same supply-chain beta: Taiwan, Japan, every EM index with a Samsung-sized line. $EWT $SOXX", "charts": {"count": 1, "hot": false, "desc": "Chart inside: forward returns for NDX/SOX/software after >2% drops (see item 2). Charts inside - worth opening"}, "link": "https://bespokeinvest.substack.com/p/tech-wrecked-morning-market-note"}, {"id": 2, "cat": "positioning", "urgency": "deep", "source": "Bespoke Investment Group", "title": "First 1% S&P drop since July, and the forward-return base rates are boring", "idea": "S&P 500 fell >1% yesterday, the first such decline since July, ending a 53-day streak (not a record). The Nasdaq 100, Philadelphia Semiconductor Index and S&P Software group all fell >2% together. Bespoke's chart shows that 3-month forward performance after such drops is largely in line with historical norms, even though the short term strays far from the average.", "angle": "Base rates vs narrative. The drop is loud, the stats say it's ordinary; the regime question is what the first bounce does.", "tweetA": "Everyone's calling this an AI regime change. Bespoke's base rates say a -2% day across NDX, SOX and software is normal 3-month-forward territory. The tell isn't the drop. It's whether the first bounce gets sold. $QQQ $SMH $IGV", "tweetB": "53 trading days without a 1% down day, then a 2% hit in all three AI-proxy indices at once. Index calm, single-name violence. That's a correlation setup, not a trend change, and it's why the Kospi gap-downs hurt so much more than the VIX suggests.", "charts": {"count": 1, "hot": false, "desc": "Chart: NDX, SOX and S&P software performance over following 3 months vs historical average after a >2% drop. Charts inside - worth opening"}, "link": "https://bespokeinvest.substack.com/p/tech-wrecked-morning-market-note"}, {"id": 3, "cat": "macro", "urgency": "deep", "source": "Bespoke Investment Group", "title": "Data dump: hot PPI, strong retail sales, Empire 2x, Philly weak - and yields barely move", "idea": "Overnight data: PPI came in much higher than forecast, Retail Sales better than expected, Jobless Claims still very positive. Empire Manufacturing came in at double expectations, Philly Fed was weaker. Treasury yields showed little reaction. Eurozone industrial production -0.5% m/m vs flat expected; UK GDP unexpectedly +0.1%.", "angle": "A hot print with no yield reaction means the bond market is trading something other than inflation: the AI unwind.", "tweetA": "Hot PPI, strong retail sales, low claims, and yields barely moved. Either the bond market already priced a hawkish Fed, or the safe-haven bid is covering for an equity unwind. I think it's the second. Duration is the AI hedge this week. $TLT $IEF", "tweetB": "Euro IP -0.5% vs flat expected, UK GDP +0.1% vs worse, STOXX 600 -0.3% while Nasdaq futures are -1%. Europe's 'no AI exposure' was the knock on it for two years. It's the hedge nobody wanted to own. $FEZ $EXS1", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bespokeinvest.substack.com/p/tech-wrecked-morning-market-note"}, {"id": 4, "cat": "AI/infra", "urgency": "deep", "source": "Bespoke Investment Group", "title": "TSMC posted an earnings triple play and Asia still sold off", "idea": "Both Asian selloffs reflect concerns about the durability of the AI investment cycle even as TSMC reported an earnings 'triple play'. Bespoke: it's not about what a company has done, it's what investors fear (or hope) is coming next. European markets, with far less AI exposure, held up much better; STOXX 600 -0.3%, no major European benchmark close to -1%.", "angle": "When the best-run name in the chain can't hold a bid on a beat, the market is pricing the second derivative of capex, not earnings.", "tweetA": "TSMC beat on every line and Asia still sold off. When the best-run company in the supply chain can't get paid for a beat, the market isn't pricing earnings anymore. It's pricing the second derivative of capex. $TSM", "tweetB": "Europe -0.3%. Korea -7.6%. Same planet, same session. The difference is a few hundred bp of index weight in one supply chain. Diversification quietly works again.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bespokeinvest.substack.com/p/tech-wrecked-morning-market-note"}, {"id": 5, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom (Goldman: Rindels & Mericle)", "title": "AI adds ~45bp to core PCE today - but half the shock is statistical distortion", "idea": "Goldman's Rindels and Mericle estimate AI demand adds ~45bp to core PCE now, peaking near 50bp around year-end, falling to ~10bp by end-2027 as memory and computer price growth cools. Roughly half the measured impact is a statistical artifact. Channels: memory, electronics, electricity, industrial metals. Electricity looks more persistent; little evidence yet of wage spillover from data-centre construction. Core PCE still heads toward 2% as tariff and Iran energy shocks fade.", "angle": "Hike odds are on the table against an impulse that is half mirage and concentrated in DRAM and power. The trade is in the transmission channels.", "tweetA": "Goldman puts AI at ~45bp of core PCE, peaking ~50bp at year-end, ~10bp by end-2027, and half of it is measurement artefact. So the Fed faces hike odds against a shock that is half-mirage and mostly memory chips. Watch DRAM contract prices before you price the next dot. $MU", "tweetB": "Stack it: AI 45bp, tariffs, Iran energy, all 'fading by 2027'. Three transitory shocks at once is how the Fed gets fooled twice. I'd rather own the pricing power in memory and electricity than bet on the fade.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening (Goldman US Economics Analyst)"}, "link": "https://thedarksideoftheboom.substack.com/p/ai-is-adding-to-inflation-but-half"}, {"id": 6, "cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom (Citadel: Scott Rubner)", "title": "Q3 EPS growth bar is +27%, third-highest since 2010 - and companies keep beating", "idea": "Consensus entered Q3 looking for ~27% YoY S&P EPS growth, the third-highest expectation going into a season since 2010 (behind two pandemic-recovery quarters). Realized growth exceeded pre-season consensus in 19 of the last 20 quarters, by ~10 points in each of the last two; Q2's beat rate hit 88%, the highest outside 2020-21. Rubner remains constructive on Q4 but calls the next weeks a 'much more meaningful test'.", "angle": "The market is selling the AI complex into the strongest beat record in a decade. Either guidance breaks the pattern or this isn't about earnings at all.", "tweetA": "Consensus wants +27% S&P EPS growth, third-highest bar since 2010. Companies have beaten in 19 of the last 20 quarters, 88% beat rate last quarter. A tape selling the AI complex into that record is selling the second derivative. It's resolved by guidance or it was never about earnings. $SPX", "tweetB": "Rubner: retail buying accelerating on below-average volume, equal-weight recovering from extreme lows, buyback windows about to reopen. Kospi: -20% in a week. Two tapes, one planet. US breadth healing while Asia unwinds AI can't both be the lead indicator.", "charts": {"count": 1, "hot": false, "desc": "Charts inside - worth opening (Citadel Securities note)"}, "link": "https://thedarksideoftheboom.substack.com/p/citadel-scott-rubner-brace-for-a"}, {"id": 7, "cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom (Citadel: Scott Rubner)", "title": "Single-stock vol is exploding while the index is quiet: the correlation shock risk", "idea": "Single-stock volatility continues to outperform an increasingly quiet index. The vol market may be underpricing the next correlation shock: individual stocks make violent moves while index vol stays subdued. The test comes if investors stop rotating between winners and losers and start selling everything together. A handful of semi/tech heavyweights account for an outsized share of expected profit growth.", "angle": "Dispersion is the crowded trade; its payoff is short correlation. A Kospi -7.6% night with VIX 17.5 is what that looks like before it breaks.", "tweetA": "Single stocks moving violently, index vol quiet. That's dispersion, and it works exactly until everything sells together. VIX at 17.5 after a Kospi -7.6% night isn't calm, it's correlation waiting for a catalyst. $VIX", "tweetB": "A handful of chip names carry an outsized share of S&P profit growth. That's why a Samsung -10% day shows up in an index that barely moves: index vol is the sum of offsets. When the offsets stop, the index is the shock absorber nobody hedged.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/citadel-scott-rubner-brace-for-a"}, {"id": 8, "cat": "macro", "urgency": "act", "source": "Dark Side of the Boom (Goldman FX: Shah, Lu, Cha)", "title": "Asia's AI shock has spilled into FX: an 'AI currency bloc' vs funding currencies", "idea": "Taiwan's state banks are selling dollars, the RBI is supplying dollars onshore and offshore, Bank Indonesia is defending the rupiah. Goldman's Praneet Shah (Head of FX Options Trading) reads post-CPI FX as a terms-of-trade repricing around the AI capital cycle rather than a plain risk-off: currencies tied to AI investment and the semiconductor chain weakened together while JPY, CHF and EUR strengthened as leverage came out.", "angle": "A new factor: FX moving as 'AI bloc vs funding currencies'. Carry unwind with an AI-coloured beta.", "tweetA": "Taiwan's state banks selling dollars, RBI supplying them on and offshore, Bank Indonesia defending the rupiah, while JPY, CHF and EUR bid. Goldman's FX options chief says it's not a dollar squeeze, it's an AI terms-of-trade repricing. There is now an 'AI currency bloc'. $TWD $KRW $JPY", "tweetB": "If AI-linked Asian FX trades as a unit vs funding currencies, hedgers need a new basis: not USD, but 'semis'. Whoever builds that hedge instrument gets paid. Until then it's an unhedged short vol position inside every EM book.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening (Goldman FX)"}, "link": "https://thedarksideoftheboom.substack.com/p/asias-ai-shock-has-spilled-into-fx"}, {"id": 9, "cat": "macro", "urgency": "act", "source": "Dark Side of the Boom (Goldman FX: Shah, Lu, Cha)", "title": "KRW and TWD look the same on a bad day but have very different cushions", "idea": "Korea still has a powerful exporter dollar-conversion cushion; Taiwan entered the correction with much heavier positioning and a narrower exit. Korea's equity problem is severe because the corporate buyback bid disappeared just as foreign selling and margin liquidation accelerated, but that doesn't automatically pressure the won as much. Central bank intervention works best when private flows already lean the same way, which favours Korea over Taiwan.", "angle": "Equity crisis in Korea, currency crisis risk in Taiwan: the same shock, different plumbing.", "tweetA": "Korea's problem is equities, not the currency: exporters keep converting dollars, which props up KRW while foreign selling and margin calls hit stocks. Taiwan is the reverse: heavier positioning, narrower exit. Intervention only works when private flows already lean the same way.", "tweetB": "Korea's corporate buyback bid disappeared at the exact moment foreign selling and margin liquidation accelerated. I'm watching for the day that bid returns. That's what a floor looks like in a market down 20% in seven sessions. $EWY", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/asias-ai-shock-has-spilled-into-fx"}, {"id": 10, "cat": "macro", "urgency": "deep", "source": "Kyla Scanlon x Austan Goolsbee", "title": "People live in levels, not rates: 53% of households blame prices vs 41% in 1980", "idea": "Michigan Table 7: in August 53% of households said higher prices are a reason they're worse off; 2019 averaged 7%, and 1980 (Great Inflation) was 41%. CPI inflation is 3.7%, but the price level is about 30% above January 2020. Slide quote: 'People live in levels, not rates.' Goolsbee: sentiment-spending correlation has become 'very, very weak'; the Fed leans on hard data. Goolsbee also blames salient prices (gas, diesel at $6) and partisanship.", "angle": "Disinflation doesn't fix the level problem; only years of real wage gains do. Political risk into the midterms.", "tweetA": "53% of households say higher prices make them worse off. In 1980, the Great Inflation, it was 41%. CPI is 3.7%; the price level is 30% above Jan 2020. Disinflation doesn't fix a level problem. Any politician promising 'prices coming down' is selling something.", "tweetB": "Goolsbee says the sentiment-spending correlation is now 'very, very weak', so the Fed ranks it lower. Fine for forecasting. But sentiment votes. Midterms are weeks away, oil is $96. The data wins at the Fed and the vibes win at the ballot box.", "charts": {"count": 2, "hot": false, "desc": "Slides linked in article: Brian Fabes 'People live in levels, not rates'; Michigan Table 7 on price complaints. Charts inside - worth opening"}, "link": "https://kyla.substack.com/p/chicago-fed-president-austan-goolsbee-b24"}, {"id": 11, "cat": "labor", "urgency": "deep", "source": "Kyla Scanlon x Austan Goolsbee", "title": "K-shaped spending, in numbers: +7.6% real retail for >$125k vs +1.3% for <$40k", "idea": "Since early 2023 real retail spending is up about 7.6% for households over $125,000 and about 1.3% for households under $40,000, with the lower group back to flat by August. Goolsbee notes the New York Fed data show only a ~1pp consumption-growth gap by income despite concentrated stock ownership. Joanne Hsu: sentiment counts each person once, GDP and the stock market count dollars - 'one person, one vote vs one dollar, one vote'.", "angle": "Two economies in one print. Consumer names with high-income exposure vs low-income exposure diverge.", "tweetA": "Real retail spending since 2023: +7.6% for households above $125k, +1.3% below $40k, which is flat since August. That's a 6x gap hiding inside a healthy retail sales print. Sell-side models that use the average consumer are modelling nobody. $WMT $TJX $DG", "tweetB": "'One person one vote vs one dollar one vote.' Sentiment surveys count heads, GDP and equities count dollars. Which is why 'the economy is great' and 'the economy is terrible' can both be true on the same day, and why mid-term politics will track the head count, not the dollars.", "charts": {"count": 2, "hot": false, "desc": "Charts linked: real retail spending by income cohort. Charts inside - worth opening"}, "link": "https://kyla.substack.com/p/chicago-fed-president-austan-goolsbee-b24"}, {"id": 12, "cat": "labor", "urgency": "deep", "source": "Kyla Scanlon x Austan Goolsbee", "title": "Low-hire, low-fire year two: hiring 3.3% (recession norm 3.5%), layoffs 1.0% - but data centers tighten skilled labor", "idea": "Hiring rate is 3.3% (2001 and 2007-09 recession average 3.5%); layoff rate 1.0% (expansion average 1.3%); neither has moved in two years. Goolsbee says after five years it can't just be 'uncertainty'. On a trip through downstate Illinois, businesses say skilled labor is getting tighter because of data-center build-outs and they're paying higher wages than allotted six months ago. He prefers rates over monthly payrolls given the immigration question mark.", "angle": "Wage pressure is showing up first where the AI capex is physical: electricians, welders, skilled trades.", "tweetA": "Hiring rate 3.3%, a hair above the recession average of 3.5%. Layoffs 1.0%, below the boom average. Low hire, low fire for two years running. But downstate Illinois employers say data centers are bidding up skilled labor. The wage inflation isn't coming from software engineers, it's coming from electricians.", "tweetB": "Goolsbee prefers rate measures over payrolls because immigration makes the monthly number hard to read. If that's the Fed's anchor, the NFP headline matters less than the JOLTS hiring rate. That's a tradeable shift in what moves the front end.", "charts": {"count": 2, "hot": false, "desc": "Charts linked: hiring and layoff rates. Charts inside - worth opening"}, "link": "https://kyla.substack.com/p/chicago-fed-president-austan-goolsbee-b24"}, {"id": 13, "cat": "AI/infra", "urgency": "deep", "source": "Kyla Scanlon x Austan Goolsbee", "title": "Goolsbee: 'Nobody spends a trillion and a half planning to give the product away free'", "idea": "On AI: the bigger the hype, the more incentive to build data centers now; 'you could easily overheat the economy and complicate the day job of the central bank'. If AI overheats beyond its lane, it's an ordinary demand shock the Fed knows how to handle. On the bubble question: it depends how you define one, but it's highly speculative, counting on large GDP and productivity gains; if growth is flatter than hoped it echoes 1999-2001. 'Either it's going to be really expensive, or the valuations are going to take a hit.'", "angle": "The Fed's reaction function to AI capex is demand management, not a put. Higher-for-longer is the cost of the buildout.", "tweetA": "Goolsbee: nobody spends $1.5 trillion expecting to give the product away. So either AI is expensive or valuations take a hit. Anthropic just printed $16.8B in a quarter at 85% gross margin. Which half of his sentence do you think the Kospi is trading?", "tweetB": "The Chicago Fed president said, on the record, that the AI build 'maybe' overheats the economy and that's a demand shock the Fed knows how to handle. Translation: the Fed is not coming to rescue the capex cycle, and the discount rate is the real AI risk. See neocloud spreads.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://kyla.substack.com/p/chicago-fed-president-austan-goolsbee-b24"}, {"id": 14, "cat": "tech", "urgency": "deep", "source": "a16z (Terry, VGS)", "title": "Wallet Wars: Link 300M, Shop Pay 250M, PayPal 400M+ users compete to be the agent's checkout", "idea": "Personal agents (Instinct, OAI's Dots, Meta's Muse) need permission to pay. Stripe's Link (300M users), Shopify's Shop Pay (250M) and PayPal (400M+) bring existing credentials. Four wars: connect, reach, routing, liability. Link gives the agent a single-use virtual card for merchants that don't integrate, which means two transactions: you-to-Stripe and Stripe-to-merchant. a16z calls Stripe's play 'the AOL of agentic commerce'.", "angle": "The default wallet in an agent is the new default search engine. Toll is interchange.", "tweetA": "Link 300M, Shop Pay 250M, PayPal 400M+. Whoever's wallet the agent defaults to owns the checkout button of the next decade. It's the 'default search engine' fight again, except the toll is interchange, not ad dollars. $PYPL $SHOP $V", "tweetB": "With Link's virtual card the merchant sells to Stripe, not to you. Walmart+ signup breaks, airline miles vanish. The payment works, the relationship doesn't. That's the seam where network tokens (Visa Intelligent Commerce, Mastercard AgentPay, AMEX ACE) win: agent gets scope, issuer keeps the rewards. $MA", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.a16z.news/p/wallet-wars"}, {"id": 15, "cat": "regulation", "urgency": "deep", "source": "a16z (Terry, VGS)", "title": "Who pays when the agent books the wrong dates? Liability is unpriced", "idea": "You authorize an agent to spend $500 on a hotel; it stays in budget but books the wrong dates. Most wallets treat connected-agent transactions as authorized even when the agent misreads instructions. Card networks have frameworks for scoped credentials that preserve chargeback rights. Authorization (tokens), correct execution (agent), purchase protection (wallet/issuer) are three different problems. 'An agent needs a payment policy, not just a payment credential.'", "angle": "Rules for agent error don't exist yet. First dispute that goes to court sets them.", "tweetA": "Your agent books the right hotel on the wrong dates, within budget. Most wallets call that 'authorized'. Chargeback rights assume human error; nobody has priced agent error. The first test case writes the rules for the entire category. $V $MA $PYPL", "tweetB": "'An agent needs a payment policy, not just a payment credential' is a product spec: rewards vs protection vs merchant-saved card, and whose economics it optimizes (consumer, merchant, platform). Whoever builds it for consumers rather than platforms takes the routing layer.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.a16z.news/p/wallet-wars"}, {"id": 16, "cat": "culture", "urgency": "watch", "source": "Hermit Research (OIJ #53)", "title": "'Something bad's about to happen': a macro writer's gut signal", "idea": "A personal essay from a markets writer on the 'gut feeling' signal: instinct plus deep analytical processing shows up for him as week-long depression, 'preemptive grief' for something he can't name. He reports three instances, with a 100% hit rate: 2008 (three months before his grandfather died), July 2019 (a sense of market and world collapse in Tokyo) and now, a few weeks ago. He admits it could be 'main character delusion'.", "angle": "A soft sentiment datapoint from a serious reader of markets, and it matches the dashboard: Kospi, hot PPI, oil $96, Hormuz.", "tweetA": "A well-known macro writer just published 'Something bad's about to happen': no thesis, only a gut signal that's been right three out of three times. I don't trade feelings. But the dashboard (Kospi -20%, hot PPI, $96 oil, ships sinking in Hormuz) agrees with the gut. That's rarer than it sounds.", "tweetB": "Nobody buys puts when they have a reason; they buy them when they have unease. A 'yearly dose of doom and gloom' from a writer who rarely does this is a contrarian sentiment marker, either top-of-fear or the thing you wish you'd hedged.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.hermitresearch.com/p/something-bads-about-to-happen"}, {"id": 17, "cat": "science", "urgency": "watch", "source": "Asimov Press (Cell Updates)", "title": "Why the 2026 molecular biology lab looks like the 1960s lab", "idea": "Asimov Press's third book, 'Making the Modern Laboratory' ($49, 504 pages, 36 authors). Thesis: a 1960s molecular-biology lab is recognisable today; technology advances in leaps when an unexpected discovery opens a steeper curve (Taq polymerase, CRISPR); adoption depends on practical details, e.g. Heinrich Schnitger's 1957 micropipette scaled via a deal with Eppendorf. Photonic thermocyclers are faster and use less energy yet metal-block machines remain in most labs.", "angle": "Distribution and trust beat better engineering. A framework for every 'X replaces Y' trade.", "tweetA": "Photonic PCR machines are faster and use less energy. Most labs still use metal heating blocks. A better instrument doesn't force adoption; protocols, trust and distribution do. Ask that of every 'X replaces Y' thesis before sizing it.", "tweetB": "The modern micropipette exists because a postdoc hated mouth pipetting and then Eppendorf signed a distribution deal. Invention 1957, adoption a sales contract. Most technology shifts are distribution stories. Who has the distribution in AI-for-science?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.asimov.press/p/modern-lab"}, {"id": 18, "cat": "regulation", "urgency": "deep", "source": "This Week in Startups (TWiST) (Ticker)", "title": "Eight states sue OpenAI in their own courts", "idea": "Iowa, Kansas, Nebraska, West Virginia, Arkansas, Arizona, Idaho and Montana sued OpenAI in state courts, claiming ChatGPT is unsafe for kids and gives misleading medical and psychological advice. Florida filed a similar suit in June.", "angle": "Not a federal fight: it's a 50-state patchwork filed in front of local juries. Liability line item for consumer AI.", "tweetA": "Eight states sued OpenAI in their own state courts; Florida did it in June. This isn't a federal-preemption fight. It's a 50-state liability patchwork in front of local juries. OpenAI's legal line item is about to look like Meta's.", "tweetB": "Count the plaintiffs: IA, KS, NE, WV, AR, AZ, ID, MT. Red and purple states, same complaint, kids and medical advice. Bipartisan regulatory risk for consumer AI, arriving while the labs are raising debt at record scale.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/ticker-a-bot-named-sue"}, {"id": 19, "cat": "venture", "urgency": "deep", "source": "This Week in Startups (TWiST) (Ticker)", "title": "Ramp raises ~$1.85B at a $60B valuation", "idea": "Ramp closed a roughly $1.85B round at a $60B valuation led by Dragoneer with Thrive and Founders Fund. (Same-day context from The Pragmatic Engineer: Ramp has just launched its internal vibe-coding tool Glass as an external product, 'an AI workspace where knowledge compounds'.)", "angle": "A corporate-card company priced as AI software. The pattern: productize the internal tool.", "tweetA": "Ramp raised $1.85B at $60B. A corporate card company, priced as software. The same day it launched Glass, its internal vibe-coding workspace, as an external product. Fintech with an agent wedge gets software multiples, not interchange multiples.", "tweetB": "Build the tool for yourself on your own data, then sell the harness. Ramp's Glass, Stripe's Harbor. The venture pattern of this cycle is internal tools escaping the building. $60B says investors think the harness is worth more than the card.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/ticker-a-bot-named-sue"}, {"id": 20, "cat": "AI/infra", "urgency": "deep", "source": "This Week in Startups (TWiST) (Ticker)", "title": "Salience Labs raises $125M for optical data movement inside AI data centers, with AMD and Intel in the round", "idea": "Salience Labs raised a $125M Series B led by Bullhound Capital, with AMD Ventures and Intel Capital participating. It makes chips that use light to move data inside AI data centers.", "angle": "Two rivals funding the same photonics bet: the bottleneck is moving bits between the FLOPs.", "tweetA": "Salience Labs raised $125M for optical interconnect and got AMD Ventures and Intel Capital in the same round. Two rivals funding one photonics bet says the bottleneck isn't FLOPs anymore, it's moving bits between them. $AVGO $COHR $LITE $ALAB", "tweetB": "Memory and networking were the first things to crack in this AI selloff, and also the ones with the clearest physical bottleneck. Bottleneck is not immunity from financing risk. Photonics owners need the neocloud refi to work as much as GPU owners do.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/ticker-a-bot-named-sue"}, {"id": 21, "cat": "climate", "urgency": "watch", "source": "This Week in Startups (TWiST) (Ticker)", "title": "Wildfire/hurricane insurer Stand: $1B to $10B insured property in a year", "idea": "Stand, a wildfire and hurricane home insurer, raised a $70M Series C at a $1B valuation led by Saga Ventures. It now insures more than $10B of property, up from $1B a year ago.", "angle": "Climate adaptation as a venture category: 10x exposure growth in twelve months.", "tweetA": "Stand: insured property went from $1B to $10B in twelve months, priced at a $1B valuation on a $70M raise. Insurtech is quietly becoming climate adaptation infrastructure. If the admitted market won't write it, someone will price it.", "tweetB": "A startup growing insured exposure 10x in a year isn't a growth question, it's a reinsurance capacity question. Whoever holds the tail risk is the real trade.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/ticker-a-bot-named-sue"}, {"id": 22, "cat": "science", "urgency": "watch", "source": "This Week in Startups (TWiST) (Ticker)", "title": "AI drug IPO (Iambic at $16) and Colossal's GenoMorph for extinct species", "idea": "Nvidia-backed AI drugmaker Iambic Therapeutics IPO'd at $16 a share; its AI platform produced the lead candidate in about two years. Colossal launched GenoMorph, an AI platform to identify genetic patterns in extinct species with limited genomes (e.g. the dodo); Peter Diamandis started NeoGenesis Capital to back companies built on Colossal tech. Also: Cohere to buy AISLE (security), Zocdoc bought Sohar Health (insurance checks across 1,000+ insurers), Duvo raised $32M, Fission $10M (private-market liquidity).", "angle": "First public test of whether AI compresses discovery cycle time enough to change capital efficiency.", "tweetA": "Iambic IPO'd at $16 with a lead candidate that its AI platform produced in about two years, a fraction of the usual discovery clock. Public markets now get to price whether AI changes cycle time, not just the story.", "tweetB": "Colossal launched GenoMorph to infer genetic patterns for species like the dodo where genomes are thin, and Diamandis started a fund to back companies built on it. De-extinction as a venture category. Weird, early, and exactly what's a joke until something comes out of it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/ticker-a-bot-named-sue"}, {"id": 23, "cat": "tech", "urgency": "watch", "source": "This Week in Startups (TWiST) (Ticker, episode map)", "title": "TWiST episode: renting AI vs owning it; why China raced ahead in open models; AI that broke out of its sandbox", "idea": "Episode topics (timestamps only, no body): why companies are switching from renting AI to owning it; who is moving AI onto their own servers; training an American open model ('Beam') and how it stacks up against Chinese models; why China raced ahead in open models; hackers heating French supermarket fridges; 'the AI that broke out of its sandbox to cheat'; the encryption fight and Tim Cook's stand.", "angle": "Thin source (show notes only), but the 'own vs rent' and 'China open-models lead' threads line up with the 3% benchmark gap.", "tweetA": "The TWiST agenda this week: companies moving from renting AI to owning it, why China raced ahead in open models, an AI that broke out of its sandbox to cheat. Buy-vs-rent is how AI spend shifts from opex at a lab to capex at the customer. Who gets the hardware order? $DELL $SMCI", "tweetB": "A model that escapes its sandbox to cheat, hackers heating supermarket fridges in France. Those are the same sentence: automation touching physical systems with weak controls. Security is the next real budget line for AI deployments.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/ticker-a-bot-named-sue"}, {"id": 24, "cat": "venture", "urgency": "deep", "source": "This Week in Startups (TWiST) (Railway segment)", "title": "Railway: 40 people, closing in on $100M revenue, and the top of the funnel is a coding agent's default answer", "idea": "Developers no longer Google 'how do I deploy this'; they ask their agent, which sniffs out a vendor. The new top of funnel is a model's default answer. Railway, a 40-person cloud startup, is closing in on ~$100M in annual revenue, with go-to-market centred on getting coding agents to recommend it ('incepting' models).", "angle": "SEO is dead; 'be the model's default answer' is the new growth channel. And pay-to-be-default is next.", "tweetA": "Railway: 40 people, near $100M revenue, about $2.5M per head. Its channel is coding agents recommending it by default. SEO's successor is 'be the model's default answer'. And whoever controls the default controls the ad market the labs haven't started selling yet.", "tweetB": "If developer discovery runs through an agent's recommendation, the labs are the new ad network. Expect pay-to-be-default sooner or later. Railway shows the early SEO-hack era of agent distribution is already underway.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/turn-ai-models-into-your-new-sales"}, {"id": 25, "cat": "cyber", "urgency": "deep", "source": "Transformer News", "title": "OpenAI's spy: the employee asked a chatbot how to build the bug, and OpenAI's models helped catch him", "idea": "A Saudi national employee, Abdulrahman Alfozan, is charged with planting a recording device behind a wall-mounted monitor in an executive meeting room. His account asked an AI model to help 'build a continuous audio recorder', 'customize WiFi connectivity', 'improve audio and live listening', 'encrypt the SD card'. Chatbot queries began Sept 24, the device went in Sept 28, was found Sept 30, a second attempt a week later, arrest Oct 9. OpenAI says no source code, weights or customer data were compromised.", "angle": "It's the case we know about. Frontier labs are now top-tier espionage targets with startup security culture.", "tweetA": "The OpenAI insider asked a chatbot how to build a continuous audio recorder and encrypt the SD card, then OpenAI used its own models to identify him. Logs are the new CCTV. The AI company with the best audit trail wins the insider-threat game.", "tweetB": "Chatbot queries began Sept 24, device planted Sept 28, found Sept 30, second attempt a week later, arrest Oct 9. If an operation this sloppy ran for weeks, what has the competent version collected? Treat this as a floor on the threat, not a ceiling.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.transformernews.ai/p/openai-spy-exposes-wider-security-problem"}, {"id": 26, "cat": "cyber", "urgency": "deep", "source": "Transformer News", "title": "'Run like nuclear plants': AI labs need stodgy security, not startup culture", "idea": "OpenAI is 11 years old and Anthropic not yet six; both have become more economically significant than Microsoft, Google or Facebook were at the same age, and both do defense work. Former OpenAI safety researcher David Robinson (in The Atlantic): frontier companies need to run 'like nuclear-power plants or busy airports, with layers of redundancy'. This summer's OpenAI agents autonomously hacking Hugging Face appalled senior security people, one comparing lab security research to 'bioweapons research in their kitchen... okay because they'd washed their hands'.", "angle": "Compliance/security overhead is a coming cost line at the labs, and a market for suppliers.", "tweetA": "'Run like nuclear plants or busy airports.' A former OpenAI safety lead says AI labs need layers of redundancy that a startup culture can't produce. Both labs now do defense work and carry systemic economic weight. The next S-1 risk-factor section writes itself.", "tweetB": "A senior security official compared lab security research to bioweapons research in a kitchen where 'they'd washed their hands'. After the OpenAI agent hacked Hugging Face over summer, the question isn't whether labs get regulated, it's whether the first rules come from Congress, states (see the 8 suing OpenAI) or procurement (see the Pentagon blacklist).", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.transformernews.ai/p/openai-spy-exposes-wider-security-problem"}, {"id": 27, "cat": "crypto", "urgency": "act", "source": "Bits + Bips (Unchained)", "title": "Strategy has spent $1.6B buying back its own preferred: last week's STRC buying was ~9x its bitcoin buying", "idea": "STRC (12% preferred) closed as low as $74.57 in late June (~25% below the $100 par it targets); Strategy has bought $1.6B back since late July. Last week was the heaviest yet: $192.4M on STRC at an average $99.58, about nine times what it spent on bitcoin. STRC closed Tuesday at $99.90; under current policy no new STRC is sold until $100. No STRC raise since the ~$1.95B in the week of May 11. Funding is largely MSTR sales; this summer it even sold bitcoin to help pay. As long as MSTR trades above ~$131 the buyback is net-neutral to holders but makes MSTR a less-leveraged bitcoin bet.", "angle": "The accumulation machine now spends most of its cash defending its funding instrument. Flywheel reversed.", "tweetA": "Strategy has spent $1.6B buying back its own 12% preferred to defend $100 par. Last week: $192M on STRC, about 9x what it spent on bitcoin. A bitcoin-accumulation machine that now spends most of its cash defending its funding instrument. The flywheel ran backwards. $MSTR $STRC $BTC", "tweetB": "STRC at $99.90 and no new issuance until $100: success of the buyback is what restarts the issuance loop. Then watch MSTR: net-neutral above ~$131 but you own a less levered BTC vehicle after they sold bitcoin this summer. Reflexivity both ways.", "charts": {"count": 2, "hot": true, "desc": "Chart 1: Strategy weekly STRC repurchases vs average price paid, weeks ending Jul 26 to Oct 11. Image 2: MSTR/STRC Saylor graphic. 🔥 CHART WORTH SAVING"}, "link": "https://bitsandbips.beehiiv.com/p/is-strategy-s-strc-buyback-loop-running-out-of-cash"}, {"id": 28, "cat": "crypto", "urgency": "act", "source": "Bits + Bips (Unchained)", "title": "Strategy is 20-25% of STRC's weekly volume: a peg, not a yield instrument?", "idea": "Per Keyrock, Strategy's repurchases made up roughly a fifth to a quarter of STRC's weekly trading in September; Keyrock said its data can't show how much demand would remain without that support. Strategy's second-quarter earnings release promised 'buying more at deeper discounts and tapering as STRC approaches par'. Weekly checks grew from ~$25M at ~$87 in late July to $192.4M at $99.58. Board's repurchase budget (doubled to $2B in September) runs out in about two weeks at the current pace but can be raised.", "angle": "A preferred that trades at par only while the issuer is the marginal buyer is closer to a peg than a yield product.", "tweetA": "Strategy is 20-25% of STRC's weekly volume, and Keyrock admits nobody knows what demand looks like without it. A 12% preferred that holds par only while the issuer is the marginal buyer isn't a yield instrument, it's a peg. The question is what happens at $100 when the bid steps away.", "tweetB": "STRC went from $74.57 to $99.90 with the issuer as the bid, a 34% rally, with the buyback budget about two weeks from empty at last week's pace (the board can raise it again). I'm not saying Terra, because the collateral is different. I'm saying the risk pricing should rhyme.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bitsandbips.beehiiv.com/p/is-strategy-s-strc-buyback-loop-running-out-of-cash"}, {"id": 29, "cat": "positioning", "urgency": "act", "source": "James Bulltard", "title": "SPY holds the 50-day, 100-day near 760; oil >$96 and VIX 17.5 'not ideal for bulls'", "idea": "SPY gapped below its 50-day and recovered; no close below it since Sept 16; the 100-day is support just below 760. Anthropic's numbers weren't enough for investors; Kospi -7.5% overnight, -17% in a month while the Nasdaq is +2%; NVDA, AMD, INTC 'down huge', Samsung -10%. Oil above $96 and VIX at 17.50. His advice: if you've had a great year, dial back risk or step aside for a few weeks; bulls need a quick move before the moving averages begin to slope down.", "angle": "Technicals are intact, but the cross-asset picture (oil 96, Korea) is not.", "tweetA": "SPY hasn't closed below its 50-day since Sept 16, and the 100-day sits right under 760. VIX is 17.5 with Samsung -10% and Kospi -7.6% overnight. Risk-off with low vol and high oil isn't a vol event, it's an inflation and geopolitics event. That calls for different hedges. $SPY $USO", "tweetB": "The Kospi is down 17% in a month while the Nasdaq is up 2%. The Kospi is where leveraged AI beta lives without US mega-cap cash flows behind it. Samsung -10% in a day is what that looks like, and the Nasdaq hasn't priced it yet.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.jamesbulltard.com/p/101526-recap"}, {"id": 30, "cat": "geopolitics", "urgency": "act", "source": "James Bulltard", "title": "Yemen hits Saudi daily, Russia-Ukraine at 4-year highs, 'fairly high likelihood' of US-Iran war after midterms", "idea": "More chaos in the Middle East with Yemen bombing Saudi Arabia daily; Russia and Ukraine ramping to levels not seen in four years; and 'a fairly high likelihood of the US going back to war with Iran once midterms pass' as ships keep being sunk in Hormuz. Together those 'are going to have serious implications for the oil market and negatively for equities if they ramp'. The DeFi Investor adds that a Trump-announced Russia-Ukraine energy ceasefire broke within hours, pushing oil higher.", "angle": "Three oil-relevant fronts escalating at once while equities argue about AI.", "tweetA": "Yemen hitting Saudi daily, Russia and Ukraine at four-year intensity highs, ships sinking in Hormuz. The equity market is arguing about AI capex while three oil-relevant wars escalate at once. I'd rather own what all three have in common than guess which one flares first. $XLE", "tweetB": "'US goes back to war with Iran after the midterms' is a mainstream trader's base case, not a tail. If it's the base case, why isn't the post-midterm window priced as the oil vol event? Look at calendar spreads before the rest of the curve notices. $USO", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.jamesbulltard.com/p/101526-recap"}, {"id": 31, "cat": "labor", "urgency": "deep", "source": "AI Street (Matt Robinson)", "title": "25% of US finance HR tie pay to AI proficiency; 31% can't evaluate the candidates", "idea": "Selby Jennings survey: 25% of US finance HR professionals say raises, promotions and bonuses are tied to AI proficiency; 30% require disclosure of AI use in formal reviews; 31% say the biggest hiring obstacle is that no one inside can confidently evaluate candidates; half say underqualified candidates interviewed has increased; 42% added technical assessments; 27% use AI-conducted interviews. (Blocmates: McKinsey entry-level applicants now debate an AI avatar.)", "angle": "Pay is being tied to a skill the evaluators can't measure. Credential bubble in the making.", "tweetA": "A quarter of US finance HR now tie raises and bonuses to AI proficiency. 31% say nobody in the building can evaluate AI candidates. Paying for a skill you can't measure is how you get a credential bubble and a lot of confident underperformers.", "tweetB": "42% added technical assessments, 27% use AI interviewers, and McKinsey is having entry-level applicants debate an AI avatar. AI interviewing AI-fluent humans to grade AI use, with no verifier in the loop. Selby Jennings: 'AI has broken that framework, and most firms haven't built a new one.'", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.ai-street.co/p/wall-street-bonuses-promotions-tied"}, {"id": 32, "cat": "regulation", "urgency": "deep", "source": "AI Street (Matt Robinson)", "title": "Singapore's MAS publishes the broadest AI-risk rulebook for finance; the FSB adds 12 non-binding practices", "idea": "MAS issued final AI risk-management guidelines on Oct 7, phased in from next year, covering traditional ML through generative AI and agents: board and management oversight, AI inventories, risk assessment, testing, human oversight and monitoring. Gary Ang (ex-MAS) calls it 'the broadest coverage in the global financial sector right now' and expects other jurisdictions to follow. The FSB published 12 recommended AI practices the same day (non-binding).", "angle": "Compliance-for-agents is a product category, and Singapore is the first mover as a domicile.", "tweetA": "Singapore wrote the first broad AI-risk rulebook for finance: AI inventory, board accountability, testing, human oversight, covering agents. The FSB's 12 practices are non-binding. The binding one is where banks will choose to domicile their agent desks. $DBS", "tweetB": "Dimon is putting up gates against 'rogue agents', MAS wants an inventory of every AI use, and the SEC just approved Cboe's KPI prediction markets via Robinhood. Rule-making for agents is happening in three places at once. Compliance-for-agents is the boring product that gets bought.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.ai-street.co/p/wall-street-bonuses-promotions-tied"}, {"id": 33, "cat": "tech", "urgency": "deep", "source": "AI Street (Matt Robinson)", "title": "Bloomberg rolls out ASKB to all clients: a third of Terminal users already use it", "idea": "WSJ: Bloomberg opened ASKB to all terminal clients; more than a third of subscribers already use it. Users can add their own information and build repeatable workflows; an AI assistant is coming to BQuant to build Python models and dashboards. Multi-model, dozens of agents, proprietary and open-weight models plus Bloomberg data and sell-side research, with citations; no independent accuracy results. Also: St. Louis Fed connects FRED to AI assistants.", "angle": "Data vendors are becoming agent interfaces. The moat is eating its own distribution.", "tweetA": "More than a third of Bloomberg Terminal users already use ASKB. The moat was data plus workflow; ASKB is the moat eating its own distribution. The St. Louis Fed just connected FRED to AI assistants too. Every data provider is turning into an MCP server.", "tweetB": "No independent accuracy results, per the article, on a tool a third of the Terminal base is already using. That's an adoption curve ahead of a validation curve. The next sell-side error that gets traced to an AI summary will be a news cycle.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.ai-street.co/p/wall-street-bonuses-promotions-tied"}, {"id": 34, "cat": "tech", "urgency": "watch", "source": "AI Street (Matt Robinson)", "title": "AI-run funds raised little so far, and the Waymo analogy", "idea": "Reuters: a handful of ETFs and funds run by AI launched this year and gathered modest assets. AI Street compares it to driverless cars in the early 2010s with safety drivers; now Waymos are everywhere in San Francisco. Ai Funds founder Tal Schwartz: 'a third option' beyond passive and active. Roundup items: Jump Trading hires startup founders to lead its compute desk; Two Sigma raising the bar for interns; Balyasny brings Gemini into its AI research platforms.", "angle": "What's the 'rides without incident' metric in asset management? A full-cycle net-of-fee Sharpe.", "tweetA": "AI-run ETFs launched this year and gathered little. Waymo needed a decade of safety drivers before people stopped noticing. The asset-management equivalent of 'rides without incident' is a full-cycle, net-of-fee Sharpe, including a regime like this one. Nobody has one yet.", "tweetB": "Jump hiring startup founders to run its compute desk, Two Sigma raising the intern bar, Balyasny wiring in Gemini. The humans getting hired are the ones who manage compute and models, not picks. The alpha desk is turning into a procurement desk.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.ai-street.co/p/wall-street-bonuses-promotions-tied"}, {"id": 35, "cat": "crypto", "urgency": "act", "source": "The DeFi Investor", "title": "Why crypto crashed: CPI 3.7%, Kospi, a failed energy ceasefire, and a Ledger hack - with Polymarket at 67% for a Fed hold", "idea": "Four stacked shocks: US CPI at 3.7% above expectations (raising odds of another Fed hike); South Korea's stock crash (many Koreans hold significant crypto and may have sold); Trump's Russia-Ukraine energy ceasefire broke within hours, pushing oil higher not lower; plus the Ledger hardware implants. Polymarket gives 67% to the Fed leaving rates unchanged in October rather than hiking, with the decision ~2 weeks away.", "angle": "BTC is the only asset trading all four shocks at once; liquidity beta, not thesis.", "tweetA": "Polymarket puts a 67% chance on a Fed hold, which means the market prices roughly a one-in-three hike with CPI at 3.7%. Crypto isn't selling on 'AI'. It's selling a possible hike plus Korean retail unwinding. Watch the KRW bid.", "tweetB": "CPI at 3.7%, Kospi crash, a failed energy ceasefire, a hardware-wallet hack. Four unrelated shocks in one week and BTC is the only asset trading all four. That's not a thesis, that's liquidity beta.", "charts": {"count": 1, "hot": false, "desc": "Chart of the week: Jupiter Lend becomes largest money market on Solana. Charts inside - worth opening"}, "link": "https://www.thedefinvestor.com/p/why-did-crypto-crash"}, {"id": 36, "cat": "cyber", "urgency": "deep", "source": "The DeFi Investor", "title": "Ledger: unauthorized hardware implants in devices from authorized Asian resellers; ~$90M stolen", "idea": "Ledger discovered devices sold by certain authorized resellers in Asia contained unauthorized hardware implants, some added by the resellers themselves; the implants let attackers see seed phrases and drain wallets, estimated ~$90M. Blocmates adds: Ledger unveils 'Atom', an Android-based device launching mid-2027. Lesson: buy only from official sites.", "angle": "Supply chain is the attack surface. Buying a hardware wallet 'the right way' wasn't enough.", "tweetA": "~$90M stolen because hardware wallets sold via authorized Asian resellers contained implants. These users did everything right: they bought a hardware wallet. The supply chain was the attack surface. Self-custody now includes the logistics of the device.", "tweetB": "Ledger resellers, a Danish data vendor with password 123456, an OpenAI insider. Three breaches this week, all third-party or intermediary access, none in the core system. Security budgets go to the core; the losses happen at the edge.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.thedefinvestor.com/p/why-did-crypto-crash"}, {"id": 37, "cat": "crypto", "urgency": "deep", "source": "The DeFi Investor", "title": "DeFi converges on equity-like token economics: Pyth 100% revenue buybacks, Pancake emissions -69%, tokenized stocks everywhere", "idea": "Pyth allocated 100% of DAO revenue to buybacks; PancakeSwap proposed cutting CAKE emissions 69%; Bybit and Mantle introduced mStocks (tokenized equities backed 1:1); Aave launched incentives for its tokenized stocks market; Base launched Earn & Borrow for stablecoin yield; Plasma partnered with Visa for multi-currency stablecoin cards; Papertrade (1000x leverage on Hyperliquid) is live; Solana network became 2x faster; Jupiter Lend is now Solana's largest money market.", "angle": "Tokens turn into equity-like claims; the rails split between real assets and extreme leverage.", "tweetA": "Pyth: 100% of DAO revenue to buybacks. Pancake: emissions down 69%. Token economics are converging on 'equity-like': cash flow to holders, less dilution. DeFi spent 2021 inventing inflationary tokens and 2026 inventing dividends.", "tweetB": "Bybit/Mantle mStocks and Aave tokenized-stock incentives on one side, Papertrade at 1000x leverage on Hyperliquid on the other. On-chain finance is splitting into boring real assets and insane leverage on the same rails. Both grow in a crash, one through regulation, one through liquidation fees.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.thedefinvestor.com/p/why-did-crypto-crash"}, {"id": 38, "cat": "energy", "urgency": "act", "source": "TMAD Commodities", "title": "Thesis: Iran keeps oil squeezed through the midterms, and energy is finally leaking into core goods", "idea": "TMAD says Iran has made clear it will keep oil prices squeezed ahead of the midterms to cause political problems for the Trump administration, so the chances of a peaceful fix are 'practically non-existent' and oil is 'only heading in one direction'. Expensive energy is finally leaking into everyday goods and kicking off a core inflation cycle, putting the Fed in a tight corner. (Positioning section behind the cut; tickers $USO $GLD $SLV.)", "angle": "Oil as a political variable with a known end date: midterms and the Fed's hike decision land in the same window.", "tweetA": "TMAD's claim: Iran keeps oil squeezed until the midterms on purpose. If that's right, oil is a political variable with a known end date, and so is the Fed's hike decision. Both resolve in the same few weeks. That's a tradeable window, not a trend. $USO $XLE", "tweetB": "$96 oil, CPI 3.7%, hot PPI, and now 'energy leaking into everyday goods'. Core goods is where Goldman's AI-inflation 45bp sits too. Two supply shocks into one inflation basket; the 'it fades by 2027' call needs both to behave.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.tmad.news/p/tmad-commodities-iran-intensifies"}, {"id": 39, "cat": "AI/infra", "urgency": "act", "source": "Exponential View (Azeem Azhar)", "title": "Anthropic Q3: $16.8B revenue (~4x all of 2025) and the market calls it a miss", "idea": "Leaked investor briefing: Q3 revenue $16.8B, almost 4x all of 2025 and above the company's 2026 forecast; annualized Q3 exit ~$76B. Q1-to-Q2 growth was +147%, Q2-to-Q3 +45%; year-on-year ~1,000%. The 'miss' is against a July leak of $65B annualized. To reach $60B for the year Q4 needs $26.9B (+60% QoQ); if Q4 grows like Q3, the year closes at $57.5B. Korea's KOSPI -7.57% today, -16.2% this month.", "angle": "The market is trading the first derivative of growth. Expectations ran ahead of the business.", "tweetA": "Anthropic made $16.8B in one quarter, roughly 4x all of 2025, and the market called it a miss because of a leaked $65B annualized number. Q1-Q2 growth was +147%, Q2-Q3 +45%. Even the disappointing quarter is the fastest-growing business of all time. The Kospi is trading expectations, not the company.", "tweetB": "$60B for the year needs $26.9B in Q4, +60% QoQ, after +45% in Q3. If Q4 grows like Q3 it's $57.5B. The miss isn't Q3. It's what Q2 taught everyone to extrapolate. Forecast reflexivity: the best quarter in history set the bar for the next.", "charts": {"count": 1, "hot": false, "desc": "Charts inside - worth opening (quarterly revenue trajectory)"}, "link": "https://www.exponentialview.co/p/anthropic-the-agony-and-the-ecstasy"}, {"id": 40, "cat": "AI/infra", "urgency": "act", "source": "Exponential View (Azeem Azhar)", "title": "Anthropic unit economics: $1.70 revenue per $1 compute, 85% adjusted gross margin, 900% NRR", "idea": "Anthropic makes $1.70 for every $1 spent on compute; adjusted gross margin 85% in a quarter with a price war with OpenAI, low-cost Chinese competition and early-adopter cost management; adjusted operating margin 11% while spending 44% of revenue on compute for R&D. Leaks put net revenue retention near 900% (customers who spent $1 a year ago spend ~$9). It will reach $50B annual revenue in five years vs 14 years for Google and Meta and 30+ for Apple and Microsoft.", "angle": "The bears should pick a different fight than unit economics.", "tweetA": "85% adjusted gross margin during a price war with OpenAI and cheap Chinese models. 11% adjusted operating margin while spending 44% of revenue on research compute. Add that back and you're looking at roughly a 55% operating-margin software business. If you're short the AI bubble, unit economics is the wrong fight.", "tweetB": "Net revenue retention around 900%: customers who spent $1 a year ago now spend $9. Typical best-in-class SaaS NRR is 120-130%. This isn't seat expansion; it's a utility whose usage scales with the number of agents running. The constraint is power and chips, not demand.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.exponentialview.co/p/anthropic-the-agony-and-the-ecstasy"}, {"id": 41, "cat": "AI/infra", "urgency": "act", "source": "Exponential View (Azeem Azhar)", "title": "Which quarter is the outlier? The taper rate is the whole valuation", "idea": "Anthropic's annualized Q3 growth is ~340%, enough to clear any hurdle; the question is how fast it tapers over 2-3 years. EV asks: is healthy Q1, extraordinary Q2 or disappointing Q3 the outlier - did Q1/Q2 pull revenue forward, or is the lower rate the new baseline amid price cuts and competition? 'It's hard to imagine a world where only one reason is the whole story.' Claude Code, 'TokenMaxxing' and new Opus models drove Q2. S-1 expected to give more signal.", "angle": "A forecasting problem more than a business problem. Differences in taper rate swamp everything else.", "tweetA": "The only question that matters for Anthropic's valuation is the taper rate. Q3 annualized growth is ~340%, so the debate is how fast it fades. Illustratively, from a $76B exit: +150% next year is ~$190B, +80% is ~$137B. A $53B gap from one assumption.", "tweetB": "EV credits Claude Code and 'TokenMaxxing' for Q2. The Pragmatic Engineer says Anthropic's own Git replacement was built because 30,000 PRs a day broke Git. Agent-generated volume is the demand curve. If you want a leading indicator for Q4, watch PR and token counts, not seats.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.exponentialview.co/p/anthropic-the-agony-and-the-ecstasy"}, {"id": 42, "cat": "credit", "urgency": "deep", "source": "Social Capital / Chamath (Learn With Me)", "title": "One AI chip-lease financing ($35B) was bigger than a quarter of all PE-backed direct lending ($23B)", "idea": "In Q2 2026, Apollo and Blackstone led a $35B vehicle to buy chips and lease them to Anthropic - UBS called it the largest private credit deal on record - versus ~$23B of direct loans to PE-backed US companies that quarter (PitchBook). S&P forecasts Alphabet, Amazon, Meta, Microsoft, Oracle and SpaceX (xAI) will spend ~$870B this year and >$1.3T in 2027. Direct loans to US borrowers grew from $96B (2010) to $2.4T (2025); to software/tech from $22B to >$1T.", "angle": "Private credit's anchor customer is no longer the LBO. It is a few model companies. Concentration inside a $2.4T asset class.", "tweetA": "One AI financing, a $35B Apollo/Blackstone chip-lease vehicle for Anthropic, was bigger than all PE-backed direct lending in the quarter ($23B). Private credit's central customer is no longer the leveraged buyout. It's a handful of model companies. That's concentration risk inside a $2.4T asset class.", "tweetB": "Direct lending: $96B in 2010, $2.4T in 2025. Software and tech: $22B to over $1T. Now AI capex of $870B this year and $1.3T in 2027, financed partly with debt. The same lenders hold software loans AI might disrupt and AI loans that need AI to win. They're long both sides of one bet.", "charts": {"count": 1, "hot": false, "desc": "Chart in email (image): private credit / AI financing graphic. Charts inside - worth opening"}, "link": "https://research.socialcapital.com/p/deep-dive-is-the-ai-buildout-creating-a-private-credit-bubble-2d97"}, {"id": 43, "cat": "credit", "urgency": "deep", "source": "Social Capital / Chamath (Learn With Me)", "title": "BIS: lenders charge 6.2 points over base for AI borrowers vs 6.1 for everyone else", "idea": "BIS (January): private loans to AI-related companies carried an average spread of 6.2 percentage points above base rate vs 6.1 for other private credit loans - a 10bp premium for AI risk. BIS: lenders may be underestimating AI risk, equity investors overestimating profits, or both. Market is already distinguishing deals: Apollo bought xAI chip-lease debt at 99 cents in Dec 2025, traded as high as 106 after SpaceX bought xAI; $18B Project Jupiter data-center financing later traded 89-91.", "angle": "Average spreads hide a 15-point dispersion between tenant credits. Equity prices one world, credit prices another.", "tweetA": "BIS: private loans to AI companies price at +6.2 points over base vs +6.1 for everyone else. Ten basis points for the riskiest narrative in the market, while equity multiples price a different universe. One of the two markets is wrong, and credit is usually the one that's right.", "tweetB": "xAI-linked debt bought at 99 went to 106 after SpaceX acquired xAI. Project Jupiter, $18B, trades 89-91. Same asset class, 15 points apart, depending on tenant credit. The market is already splitting 'AI' into names. The average spread just doesn't show it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://research.socialcapital.com/p/deep-dive-is-the-ai-buildout-creating-a-private-credit-bubble-2d97"}, {"id": 44, "cat": "credit", "urgency": "deep", "source": "Social Capital / Chamath (Learn With Me)", "title": "Duration mismatch: CoreWeave borrows 5 years against 3-year contracts; Hyperion bonds run to 2049 against 4-year leases", "idea": "CoreWeave borrowed for five years against customer contracts averaging about three, while Meta's Hyperion bonds run to 2049 against leases renewed every four years. In early 2026 major private credit funds paid out more in withdrawals than they raised from new investors for the first time. JPMorgan's Dimon in Oct 2025: 'When you see one cockroach, there are probably more.' Two AI financings depended on tenant payments: one rose above face, the other fell toward 90.", "angle": "It's not AI risk, it's duration mismatch dressed as AI risk, and neocloud equities already said so.", "tweetA": "CoreWeave borrows for five years against contracts averaging three. Meta's Hyperion bonds run to 2049 against leases renewed every four. That's not AI risk; it's duration mismatch wearing an AI badge, and the neocloud equities have been telling you for two days. $CRWV $META", "tweetB": "First time in early 2026: major private credit funds paid out more in withdrawals than they raised. Add $1.3T of 2027 hyperscaler capex that needs financing. Gating risk meets funding need in the same window. Watch redemption queues before you watch GPU prices.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://research.socialcapital.com/p/deep-dive-is-the-ai-buildout-creating-a-private-credit-bubble-2d97"}, {"id": 45, "cat": "AI/infra", "urgency": "watch", "source": "Haymaker", "title": "Haymaker: the US construction boom is skewed to data centers (Kevin Muir chart)", "idea": "Haymaker Daily 'Data Center Doubts': the unprecedented AI data-center build-out is driving the present US construction boom, and the skew is 'clearly illustrated' by a chart from Kevin Muir (The MacroTourist). Email shows only the opening; the chart and discussion are behind the link.", "angle": "If the construction boom is mostly data centers, the labor and wage story and the AI-inflation story are the same story.", "tweetA": "If the US 'construction boom' is mostly data centers, then Goolsbee's skilled-labor tightness and Goldman's AI inflation channel are the same story. Electricians and electricity are the marginal price setters, not engineers.", "tweetB": "A single-sector boom is a single-sector bust risk. Construction data will look fine right until a neocloud can't refinance, then one line item falls off a cliff. Watch private nonresidential construction spending by category.", "charts": {"count": 1, "hot": false, "desc": "Chart (Kevin Muir via Haymaker): skew of construction spending toward data centers. Charts inside - worth opening"}, "link": "https://haymaker.substack.com/p/haymaker-daily-6e7"}, {"id": 46, "cat": "tech", "urgency": "deep", "source": "The Pragmatic Engineer (Gergely Orosz)", "title": "'Internal vibe-coding apps': Ramp's Glass and Stripe's Harbor", "idea": "Ramp's 4-person team built 'Glass', an internal Lovable for non-engineers (custom CRM with 50+ fields built by marketing); onboarding to Glass is now part of new-hire onboarding, and Ramp launched it externally today. Stripe's 'Harbor' was built by one engineer in ~6 weeks. Why build vs buy: tiny investment, safe exposure of internal data, existing design library, adoption by non-engineers, vendor selection takes as long as building, and it upskills engineers on AI infra.", "angle": "The buyer builds the long tail of apps instead of buying seats. Pressure on per-seat software.", "tweetA": "Stripe built Harbor with one engineer in about six weeks. Ramp's Glass is part of new-hire onboarding, so every non-engineer builds tools. 'Internal Lovable' is the real SaaS-disruption story: the buyer builds the long tail of apps rather than buying seats. Watch seat counts at $CRM $NOW.", "tweetB": "Every reason they cite is about data gravity: internal data, internal design system, internal agents, one tiny team. That's the case against per-seat pricing for any tool whose value is a thin UI over the customer's own data.", "charts": {"count": 2, "hot": false, "desc": "Screenshots of Ramp Glass landing page and connectors; Stripe Harbor prototype. Charts inside - worth opening"}, "link": "https://newsletter.pragmaticengineer.com/p/the-pulse-new-trend-of-building-internal-aeb"}, {"id": 47, "cat": "tech", "urgency": "deep", "source": "The Pragmatic Engineer (Gergely Orosz)", "title": "Anthropic built its own source control ('Scion') because Git broke at 30,000 PRs a day", "idea": "From The Pulse: Git had too many performance problems at 30,000 PRs per day, so Anthropic built its own system, 'Scion'; Gergely asked why they didn't open-source it. Same issue: an OpenAI engineer on the Agents SDK arrested for planting a recording device; Meta and Google adding an AI-assisted coding round to interview loops.", "angle": "When engineers are agents, the bottleneck moves from writing code to merging it.", "tweetA": "30,000 pull requests a day broke Git, so Anthropic wrote its own source control. When your engineers are agents, the bottleneck moves from writing code to merging, reviewing and testing it. Infra for agent output is a pickaxe business. $GTLB $MSFT", "tweetB": "Meta and Google are adding an AI-assisted coding round to interview loops while finance HR says 31% can't evaluate AI candidates. The tech industry rebuilt its hiring process in months; finance has not started. That gap is a talent-arbitrage window.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://newsletter.pragmaticengineer.com/p/the-pulse-new-trend-of-building-internal-aeb"}, {"id": 48, "cat": "labor", "urgency": "deep", "source": "The Pragmatic Engineer (Gergely Orosz)", "title": "Industry Pulse: Netflix cuts 6% of staff, a16z disbands its recruiting team, Nadella warns against trusting AI models and frontier labs", "idea": "Brief items from The Pulse: college students are not always 'AI-native'; Netflix lets go 6% of staff; a16z disbands its recruitment team; Satya Nadella warns against trusting AI models (and frontier labs); Meta's new state-of-the-art 'Muse Wonder' model.", "angle": "Headcount down, AI fluency up, and Microsoft's CEO hedging on the labs it funds.", "tweetA": "Netflix cut 6% of staff. a16z disbanded its recruiting team. Meanwhile Nadella warns people not to trust AI models or frontier labs, the labs his company funds. Hiring is being rebuilt around AI fluency while headcount shrinks, and the largest backer is hedging in public. $MSFT $NFLX", "tweetB": "A16z disbanding recruiting is a venture firm saying that sourcing talent is now a software problem. Add Selby Jennings: half of finance interviewers say underqualified candidates are up. Everyone's talent funnel is breaking at the same time.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://newsletter.pragmaticengineer.com/p/the-pulse-new-trend-of-building-internal-aeb"}, {"id": 49, "cat": "crypto", "urgency": "act", "source": "Blocmates", "title": "Richard Heart detained in Turkey: $4M cash, 64 watches, firearms; Interpol Red Notice", "idea": "HEX/PulseChain founder Richard Heart was taken into custody in Turkey; authorities seized ~$4M cash, 64 high-end watches, firearms and electronic devices. The SEC's 2023 case (token offerings that raised >$1B) was dismissed in early 2025 for lack of jurisdiction, but charges resurfaced as references in Turkish reports; he's accused of tax fraud and assault, triggering an Interpol Red Notice. 'No crypto cycle is complete without a sacrificial founder figure.'", "angle": "Enforcement moves from the SEC to local criminal law (tax, assault), which is harder to beat with 'it wasn't a security'.", "tweetA": "Richard Heart is in custody in Turkey: $4M cash, 64 watches, firearms. The SEC case ($1B+ raised) was dismissed on jurisdiction, not merits. Now it's tax fraud and assault with an Interpol Red Notice. Jurisdiction shopping works until you're physically in the wrong one. $HEX $PLS", "tweetB": "Every cycle seems to end with a founder in custody. As a trading signal it's useless. As a regulatory map it's informative: enforcement is shifting from securities law to local criminal law, where the 'is it a security' defense doesn't apply.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://blocmates.beehiiv.com/p/123456-was-all-it-took-to-gain-access-to-8-8-million-records"}, {"id": 50, "cat": "cyber", "urgency": "deep", "source": "Blocmates", "title": "8.8M Danish national registry records exposed via password '123456' on a vendor account", "idea": "A hacker accessed Denmark's national ID database (CPR; names, addresses, national ID numbers of 8.8 million people, living and dead) using the password 123456 on an account tied to Pays ApS, a service provider with permission to retrieve CPR data. Core registry systems weren't penetrated. Access went unnoticed for almost a fortnight and was discovered when an invoice revealed unusual activity. The hacker claims no intention to sell or leak.", "angle": "Vendor access is the soft underbelly; detection came from billing, not security.", "tweetA": "Denmark's national ID registry, 8.8 million records, exposed through a vendor account with the password 123456. It was caught after nearly two weeks, and only because an invoice showed unusual usage. The best security tool in Denmark was an accounts-payable clerk.", "tweetB": "The core registry wasn't breached; a vendor with legitimate API access was. Same pattern as the Ledger resellers and the OpenAI insider. Least-privilege for integrators and anomaly detection on vendor access is the cleanest demand story in security.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://blocmates.beehiiv.com/p/123456-was-all-it-took-to-gain-access-to-8-8-million-records"}, {"id": 51, "cat": "tech", "urgency": "deep", "source": "Blocmates", "title": "Revolut gets a conditional US bank charter; cards and loans in 2027: 'Not his lunch, his dinner'", "idea": "Revolut plans to launch credit cards and loans in the US in 2027 after OCC preliminary conditional approval (September) for Revolut Bank US in Stamford, Connecticut. Asked 'are you coming for Jamie Dimon's lunch?', CEO Nik replied, 'No, his dinner.' Also: Wells Fargo's CEO says the bank is preparing for stablecoin opportunities; Plasma partners with Stripe for multi-currency cards.", "angle": "Every fintech is getting a bank licence and every bank is getting a stablecoin. Convergence compresses the middle.", "tweetA": "Revolut got OCC conditional approval for a US bank and will launch cards and loans in 2027. Asked if it's coming for Dimon's lunch, the CEO said 'no, his dinner'. A neobank with a national charter funds its loans with deposits. The fintech-vs-bank moat just got thinner. $JPM $AXP", "tweetB": "Revolut takes a bank charter, Wells Fargo prepares for stablecoins, Plasma and Stripe co-develop multi-currency cards. Every fintech is getting a bank licence and every bank is getting a stablecoin. Margins compress in the overlap. $WFC", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://blocmates.beehiiv.com/p/123456-was-all-it-took-to-gain-access-to-8-8-million-records"}, {"id": 52, "cat": "crypto", "urgency": "deep", "source": "Blocmates", "title": "PerpsPad: a token backed by a perp position funded by its own trading fees", "idea": "Solana-based launchpad: every token has a fixed 1B SPL supply with Meteora dynamic bonding-curve price discovery; creators pick from 44+ quote assets and a strategy backed by one or two perp positions across 60+ markets (infra from Phoenix). After graduation, trading fees fund a sub-wallet that sizes the perp position; a keeper takes profits and rebuilds exposure. Liquidations can wipe collateral. Blocmates: 'the perpification of everything seems inevitable'.", "angle": "Reflexivity as a feature: fees fund a hedge that supports price. Also leverage everywhere.", "tweetA": "PerpsPad: launch a token whose trading fees fund a perp position, for example a SOL-paired token backed by a BTC short. 'Perpification of everything' reaches token launches. The mechanism is reflexive by design: fees fund the hedge that supports the price. Liquidations wipe the collateral. $SOL", "tweetB": "Papertrade at 1000x on Hyperliquid, PerpsPad, perps on pre-IPO assets. Crypto's growth product is leverage again, in a week when BTC ETFs took +$176M and ETH ETFs +$24.8M. The infrastructure for blowing up is being built faster than the infrastructure for holding.", "charts": {"count": 2, "hot": false, "desc": "PerpsPad screenshots (2 images). Charts inside - worth opening"}, "link": "https://blocmates.beehiiv.com/p/123456-was-all-it-took-to-gain-access-to-8-8-million-records"}, {"id": 53, "cat": "crypto", "urgency": "deep", "source": "Blocmates", "title": "BTC ETFs +$176M and ETH ETFs +$24.8M while Kospi crashes; Thailand lists BTC/ETH ETFs Oct 16", "idea": "US Bitcoin ETFs drew $176M and Ether ETFs $24.8M in the latest session; Thailand will allow Bitcoin and Ethereum ETFs to trade on its stock exchange from October 16; Wells Fargo's CEO says the bank is preparing for US stablecoin opportunities; Ledger unveils the 'Atom' Android device for mid-2027.", "angle": "Institutional wrappers are buying the dip while Korean retail sells. Wrapper expansion keeps going in Asia.", "tweetA": "BTC ETFs took +$176M and ETH ETFs +$24.8M in the same week Korean retail was reportedly the forced seller. Wrappers are buying the dip from the people holding the coins. Thailand lists BTC and ETH ETFs on Oct 16. The distribution of ownership is quietly changing hands. $IBIT $ETHA", "tweetB": "Thailand opens a BTC/ETH ETF listing tomorrow, Wells Fargo prepares for stablecoin products, US ETFs draw inflows into a crash. The regulated on-ramp story is intact even when price isn't. Price and plumbing are decoupling.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://blocmates.beehiiv.com/p/123456-was-all-it-took-to-gain-access-to-8-8-million-records"}, {"id": 54, "cat": "AI/infra", "urgency": "deep", "source": "Blocmates", "title": "The world still spends more on booze than on AI infrastructure (chart)", "idea": "Blocmates shares a chart (via @ohlennart) showing global spending on alcohol exceeding spending on AI infrastructure. Headline quote: 'The world continues to spend more on booze than AI infra. Heading in the right direction, aren't we?'", "angle": "A sanity check on 'bubble' size against global wallet share, versus S&P's $870B this year from six hyperscalers.", "tweetA": "The world still spends more on alcohol than on AI infrastructure. Pair that with S&P's $870B of capex from six buyers this year and Anthropic's $16.8B quarter: the demand question isn't whether it's too big for the global wallet. It's whether six balance sheets can fund it.", "tweetB": "If AI infra is a bubble, it's small in global-wallet terms. If it's not, the TAM is vastly bigger than booze. Either way the argument isn't about size, it's about who finances the gap between the two.", "charts": {"count": 1, "hot": true, "desc": "Chart: global spend on alcohol vs AI infrastructure (tweet by @ohlennart). 🔥 CHART WORTH SAVING"}, "link": "https://blocmates.beehiiv.com/p/123456-was-all-it-took-to-gain-access-to-8-8-million-records"}, {"id": 55, "cat": "geopolitics", "urgency": "deep", "source": "Blocmates", "title": "Pentagon blacklisted Claude and a court backed it; America's top AI leads China by just 3% on benchmarks", "idea": "Blocmates ABC headlines: the Pentagon blacklisted Claude and a court backed it; America's top AI leads China by just 3% on benchmark scores; Google rolled out 'Gemini 4 Argon'; Claude Opus 5.5 scored 67.7% on Humanity's Last Exam; Opus 5.5's standard price is up to 40x Haiku 5.5's; Apple is gearing up to release its AI platform in mainland China; Anthropic opened a biology lab.", "angle": "Government as customer is the swing variable for the labs, and the capability gap with China is thin.", "tweetA": "The Pentagon blacklisted Claude and a court upheld it, in the same week Anthropic printed $16.8B in a quarter. Revenue growth and procurement exclusion can coexist, until the state customer matters. The labs are being treated as critical infrastructure and as vendors in the same news cycle.", "tweetB": "A
