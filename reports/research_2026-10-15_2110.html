nd mining delivered record returns in 2025, value pools shifting toward gold and copper, with diverging shareholder returns by commodity exposure; (2) governments now extend trade measures and export restrictions to scrap, yet supply concentration has barely changed; (3) capital and talent need reshuffling as demand broadens into new sources such as data centers; (4) temporary productivity stagnation could give way to $450-750B a year of improvement, 15-25% of industry revenues; (5) recycling and resilience push means more regulation and rising costs in scrap markets as Europe and the US move to restrict exports.", "angle": "Scrap export controls are the next chokepoint after rare earths; data centers are a new metals demand source.", "tweetA": "Governments are extending export restrictions from ore to scrap, and Europe and the US are both moving to restrict scrap exports. Recycling is becoming a strategic reserve and the next chokepoint after rare earths. McKinsey also says metals value pools shifted to gold and copper in 2025. $COPX $GLD", "tweetB": "McKinsey sizes the productivity prize in materials at $450-750B a year, 15-25% of industry revenues, after stagnant productivity while record returns went to gold and copper. The margin is in productivity, not the spot price. Boring is the trade, and data centers are the new demand.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://email.mckinsey.com/industries/energy-and-materials/our-insights/global-materials-perspective"}, {"id": 58, "cat": "tech", "urgency": "watch", "source": "This Week in AI", "title": "Reverse Engineer Anything (REA): 250k+ GitHub stars in a week, and vanilla Opus nearly matches it", "idea": "MIT-licensed open source project REA connects a coding agent via MCP to Chrome and reverse-engineering tools (Ghidra, Hopper, IDA Pro) and reports how an app does something, citing evidence and flagging uncertainty. It hit 250,000+ stars in about a week. Nick Saraev rebuilt Mac Preview with REA and raced a Claude Opus session without REA: REA's version replicated most features, but the Opus-only build finished first, since REA 'just gives your AI agent access to these tools'.", "angle": "The repo's moat is thin; the model is the product. Software cloning cost is collapsing either way.", "tweetA": "Reverse Engineer Anything hit 250k GitHub stars in about a week. The test that matters: plain Opus cloned Mac Preview almost as well and finished first. The repo is an agent plus Ghidra over MCP; the model is the product. Software isn't dying. Scarce specs and distribution are what's left.", "tweetB": "'Any app is a prompt away' moves protection from engineering effort to legal teams and EULAs. That's the opposite of a technical moat. Which public software company's moat is only that cloning it would take 18 months?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.thisweekinai.ai/p/rea-clones-simple-apps-fast"}];

var COLORS={"macro":"#e24b4a","credit":"#378add","positioning":"#ef9f27","AI/infra":"#1d9e75","crypto":"#7f77dd","geopolitics":"#d85a30","energy":"#f97316","tech":"#06b6d4","gold":"#d4a017","culture":"#ec4899","labor":"#8b5cf6","regulation":"#64748b","science":"#14b8a6","venture":"#84cc16","cyber":"#0ea5e9","commodities":"#a16207","climate":"#16a34a"};
var UE={act:"🔴",deep:"🔵",watch:"🟡"};
var catF="all",urgF="all",srcF=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function toggle(id){var el=document.getElementById("c"+id);if(el)el.classList.toggle("open");}
function pill(label,on,color,fn){var b=document.createElement("button");b.className="pill"+(on?" on":"");b.textContent=label;if(on)b.style.background=color;b.onclick=fn;return b;}
function renderBars(){
  var cb=document.getElementById("catbar");cb.innerHTML="";
  var counts={};ITEMS.forEach(function(i){counts[i.cat]=(counts[i.cat]||0)+1;});
  cb.appendChild(pill("All "+ITEMS.length,catF==="all"&&!srcF,"#333",function(){catF="all";srcF=null;collapse();render();}));
  Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];}).forEach(function(c){
    cb.appendChild(pill(c+" "+counts[c],catF===c&&!srcF,COLORS[c]||"#555",function(){catF=c;srcF=null;collapse();render();}));
  });
  var ub=document.getElementById("urgbar");ub.innerHTML="";
  var uc={act:0,deep:0,watch:0};ITEMS.forEach(function(i){uc[i.urgency]++;});
  ub.appendChild(pill("All",urgF==="all","#333",function(){urgF="all";srcF=null;collapse();render();}));
  [["act","🔴 Act Now"],["deep","🔵 Deep"],["watch","🟡 Watch"]].forEach(function(u){
    ub.appendChild(pill(u[1]+" "+uc[u[0]],urgF===u[0],"#333",function(){urgF=u[0];srcF=null;collapse();render();}));
  });
}
function collapse(){document.querySelectorAll(".card.open").forEach(function(e){e.classList.remove("open");});}
function cardHtml(item){
  var col=COLORS[item.cat]||"#555";
  var ch=item.charts.hot?"🔥":(item.charts.count>0?"📊":"");
  var h='<div class="card" id="c'+item.id+'" data-cat="'+esc(item.cat)+'">';
  h+='<div class="hd" onclick="toggle('+item.id+')"><span class="num">#'+item.id+'</span><span>'+UE[item.urgency]+'</span>';
  h+='<span class="src" style="background:'+col+'">'+esc(item.source)+'</span><span class="tag">'+esc(item.cat)+'</span>'+(ch?'<span>'+ch+'</span>':'');
  h+='<div class="ttl">'+esc(item.title)+'</div></div>';
  h+='<div class="bd"><div class="lbl">The idea</div><div>'+esc(item.idea)+'</div>';
  h+='<div class="angle" style="border-color:'+col+';background:'+col+'14"><b>MY ANGLE</b> &mdash; '+esc(item.angle)+'</div>';
  h+='<div class="tw"><div class="tb"><div class="lbl" style="color:#378add">Tweet A</div><div>'+esc(item.tweetA)+'</div>'+'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  h+='<div class="tb"><div class="lbl" style="color:#7f77dd">Tweet B</div><div>'+esc(item.tweetB)+'</div>'+'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>';
  if(item.charts.count>0||item.charts.desc){h+='<div class="chart'+(item.charts.hot?' hot':'')+'">📊 '+item.charts.count+' chart(s): '+esc(item.charts.desc||"Charts inside - worth opening")+'</div>';}
  h+='<a class="lk" href="'+esc(item.link)+'" target="_blank" rel="noopener">↗ Read full article</a></div></div>';
  return h;
}
function render(){
  renderBars();
  var out=ITEMS.filter(function(i){
    if(srcF!==null)return i.source.indexOf(srcF)!==-1;
    return (catF==="all"||i.cat===catF)&&(urgF==="all"||i.urgency===urgF);
  });
  document.getElementById("cards").innerHTML=out.map(cardHtml).join("");
  if(srcF!==null){out.forEach(function(i){toggle(i.id);});}
}
function filterBySrc(name){srcF=name;catF="all";urgF="all";render();window.scrollTo(0,0);}
function init(){
  document.getElementById("sub").textContent=META.date+" · "+META.time+" · "+ITEMS.length+" items";
  var r='<p class="muted">Window: '+esc(META.windowStart)+' to '+esc(META.windowEnd)+'. Emails outside this window were not processed.<br>Emails in window: '+META.emailsInWindow+' · opened/read: '+META.emailsRead+' · items extracted: '+META.itemsExtracted+'</p>';
  r+='<b>Included sources</b> (click to filter)<ul>';
  META.includedSources.forEach(function(s,i){r+='<li><span class="s" data-i="'+i+'">'+esc(s.name)+'</span> &mdash; '+s.items+'</li>';});
  r+='</ul><b>Skipped</b><ul>';
  META.skippedSources.forEach(function(s){r+='<li>'+esc(s.name)+' &mdash; <span class="muted">'+esc(s.reason)+'</span></li>';});
  r+='</ul><p class="muted">'+esc(META.notes)+'</p>';
  var rb=document.getElementById("repbody");rb.innerHTML=r;
  rb.querySelectorAll(".s").forEach(function(e){e.onclick=function(){filterBySrc(META.includedSources[+e.getAttribute("data-i")].name);};});
  render();
}
init();
