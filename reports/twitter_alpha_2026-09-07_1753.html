<!DOCTYPE html>

<head>

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-09-07T17:21:05Z", "input_stats": {"total_tweets": 204, "unique_authors": 65, "tweets_with_images": 41, "after_noise_filter": 74}, "summary": "**AI/AGI:** GPT-6 Astra's launch dominates the timeline. Bulls (**goodalexander**, **zeroxkyle** citing a 99.9% ARC-AGI-3 score) call it AGI-defining and bullish for OpenAI, inference demand and semis, while **buccocapital** and **DCinvestor** push back on the hype and **nicbstme** pegs the training run's raw compute cost at roughly $1.86B.\n\n**Memecoin political theater:** Hunter Biden's **$LAPTOP** memecoin (launching Sept 9 on Base, airdropping to $TRUMP-coin losers) split alpha accounts between disgust (**_tolks**, **thedefivillain**) and opportunistic buying (**Geiger_Capital**), while **goodalexander** spins it into a longer CBDC-acceleration thesis.\n\n**Semis/memory:** INTC and memory names (DRAM, SNDK, MU) are the week's consensus AI trade — **zeroxkyle** says he's \"all in INTC,\" **Evan_ss6** flags regional plays (Korea's 000660, Taiwan's 2454/9984), and **aleabitoreddit**'s indium-phosphide-bottleneck thesis on $IQE/$AXTI keeps playing out.\n\n**Macro/politics:** **dampedspring** runs the impeachment and midterm math (bipartisan impeachment near-impossible; GOP needs 50 loyalists just to hold the status quo) and calls the government's Intel equity stake a pure wealth transfer rather than a fundamental improvement; **Swedish_uranium**'s metals pulse frames Japan's August reserve drawdown as \"the entire gold thesis\" playing out on one balance sheet.\n\n**Crypto structure:** **DefiIgnas** warns the memecoin meta is late-cycle (huge unrealized PnL sitting on thin liquidity, one panic from unwinding) even as he lays out a full trader/LP playbook; **0xSammy** documents two new memetic-derivative mechanics — TAMPONS' built-in short-PONS treasury and RSTR's in-game OSRS hat squeeze.\n\n**Notable:** **ZeeContrarian1**'s sum-of-the-parts case for $ZIM (up to $100+/share vs. a $28.50 buyout floor) and **Crypto_McKenna**'s Hyperliquid HIP-3 energy-perps regulatory push are the week's most detailed asymmetric trade write-ups.", "sections": {"A_events": [{"cluster": "Hunter Biden's $LAPTOP Memecoin Launch", "category": ["crypto", "positioning", "society"], "items": [{"author": "goodalexander", "summary": "Argues the launch is more consequential than it looks: sees it as the moment the political left \"gets on chain,\" accelerating a US dollar-collateralized speculative infrastructure that pressures Europe into launching CBDCs, which he thinks eventually triggers capital flight, a far-right electoral wave, and a straight line to $5-10 trillion in on-chain asset value.", "tweet_url": "https://x.com/goodalexander/status/2097008188038193226", "type": "thread"}, {"author": "Geiger_Capital", "summary": "Simply: \"I'm going to buy Hunter Biden's memecoin.\"", "tweet_url": "https://x.com/Geiger_Capital/status/2096986229187260826", "images": ["https://pbs.twimg.com/media/HRn93LRX0AAB3ZA.jpg"], "type": "tweet"}, {"author": "stacy_muur", "summary": "Notes the coin will airdrop to people who lost money on $TRUMP — \"I guess he figured it out.\"", "tweet_url": "https://x.com/stacy_muur/status/2096993127345303988", "images": ["https://pbs.twimg.com/media/HRoEIx8bMAA7np3.png"], "type": "tweet"}, {"author": "thedefivillain", "summary": "Calls it \"an absolute clown grifter\" move and expects it to trade like LIBRA/CAR (i.e., a fast rug) — advises against trading it unless deeply in the trenches.", "tweet_url": "https://x.com/thedefivillain/status/2096987432730120320", "type": "thread"}, {"author": "_tolks", "summary": "Reacts with dismay (\"aaaaaaaa make it stop\") and jokes about the absurdity of Elon's ex-wife and Hunter Biden both having meme-coin-launching kids in the same news cycle.", "tweet_url": "https://x.com/_tolks/status/2096974770499678477", "type": "tweet"}, {"author": "aleabitoreddit", "summary": "\"We got AGI with Astra and Hunter Biden $LAPTOP in the same weekend\" — captures the whiplash of the news cycle.", "tweet_url": "https://x.com/aleabitoreddit/status/2097005818302607682", "type": "tweet"}]}, {"cluster": "GPT-6 Astra Launch — AGI Debate & Cost", "category": ["AI", "tech", "positioning"], "items": [{"author": "zeroxkyle", "summary": "Points to an AI hitting 99.9% on ARC-AGI-3 as proof the AI equity cycle is entering \"Season 3: Inference\" after GPUs and bottlenecks, arguing inference demand will keep eating the world (citing Jevons' Paradox in China).", "tweet_url": "https://x.com/zeroxkyle/status/2096849511943729503", "type": "tweet"}, {"author": "goodalexander", "summary": "Bullish OpenAI over Anthropic: cites 900M DAUs, early-stage ad monetization, best-in-class UX/video, in-house chips, and says \"Altman is a killer, Dario isn't him.\" Separately jokes Anthropic's IPO case rests on curing a rare disease or Claude fronting a Linkin Park reunion.", "tweet_url": "https://x.com/goodalexander/status/2097004790790095112", "type": "thread"}, {"author": "nicbstme", "summary": "Backs into the cost of the Astra training run: ~100K Blackwell GPUs at public rental rates (~$8.62/GPU/hr) implies ~$862K/hour, ~$20.7M/day, ~$620M/month — roughly $1.86B for a 3-month pre-training run alone, before post-training and bulk-pricing discounts.", "tweet_url": "https://x.com/nicbstme/status/2097000964775620999", "type": "tweet"}, {"author": "mrjasonchoi", "summary": "Flags OpenAI's new research on models accelerating internal AI research, joking recursive self-improvement (RSI) arrives \"by March 2028.\"", "tweet_url": "https://x.com/mrjasonchoi/status/2096996724460097687", "images": ["https://pbs.twimg.com/media/HRoHaG_bQAA_j1M.jpg"], "type": "tweet"}, {"author": "cryptopunk7213", "summary": "Reacting to a GPT-6 Astra Ultra demo, argues Apple's real AI bull case is on-device real-time tracking within 12 months, paired with cheaper-but-smarter local models.", "tweet_url": "https://x.com/cryptopunk7213/status/2096975062058274996", "type": "tweet"}]}, {"cluster": "Memory/Semiconductor Rally — INTC, DRAM, InP Bottleneck", "category": ["tech", "AI", "positioning"], "items": [{"author": "zeroxkyle", "summary": "Says semis positioning is still near lows despite the long/short pair rotating toward IGV/SMH and leveraged longs getting wiped out; he's \"all in INTC\" with some tilt to Taiwan names, and separately notes INTC popped from $95.8 to $99.5 over the weekend on a Trump tweet.", "tweet_url": "https://x.com/zeroxkyle/status/2096853061247619577", "images": ["https://pbs.twimg.com/media/HRmEZuea4AARiVK.jpg"], "type": "thread"}, {"author": "Evan_ss6", "summary": "Lists regional memory/semi tickers to watch: Korea's 000660 (SK Hynix), DRAM names, INTC, and Taiwan's 2454 (MediaTek) and 9984.", "tweet_url": "https://x.com/Evan_ss6/status/2097010813512880366", "type": "tweet"}, {"author": "santiagoroel", "summary": "Flags Goldman Sachs' call for ~80% upside on Korean stocks, with a 12,000 KOSPI target driven by the AI memory boom.", "tweet_url": "https://x.com/santiagoroel/status/2096993025926828047", "type": "tweet"}, {"author": "AndreasSteno", "summary": "Says the memory-stock setup ($SNDK, $MU) looks technically strong and fundamentally even better.", "tweet_url": "https://x.com/AndreasSteno/status/2096922776955138227", "type": "tweet"}, {"author": "aleabitoreddit", "summary": "Cross-references a new Bloomberg report on indium phosphide (InP) substrate risk to AI datacenter buildout, noting he flagged $AXTI as exposed to this a year ago and that names tied to $TSM have been on a tear since.", "tweet_url": "https://x.com/aleabitoreddit/status/2096904209371427277", "images": ["https://pbs.twimg.com/media/HRmzQwGaYAAifrw.jpg", "https://pbs.twimg.com/media/HRm1MbebMAAJR3v.jpg"], "type": "thread"}, {"author": "dampedspring", "summary": "Contrarian angle on the same trade: argues the government's equity stake in Intel is a wealth transfer from taxpayers to shareholders, not proof the company is fundamentally improved — the chip/memory sector has performed well with or without the intervention.", "tweet_url": "https://x.com/dampedspring/status/2096920852042219630", "images": ["https://pbs.twimg.com/media/HRnCZjUWkAU4HKj.jpg"], "type": "thread"}]}, {"cluster": "US Politics — Impeachment Odds & Midterm Math", "category": ["macro", "geopolitics"], "items": [{"author": "dampedspring", "summary": "Argues bipartisan impeachment is essentially impossible and would be politically self-destructive for Democrats ahead of 2028. Walks through midterm scenarios: even a GOP House win plus Whatley/Paxton Senate wins only reduces Murkowski/Paul's leverage — there's no path to a filibuster-proof majority or nuclear-option threshold, so reconciliation is the ceiling on what passes. Separately argues Bessent's claims of imminent fiscal consolidation news are \"gas lighting\" that generates alpha, and is skeptical establishment Republicans will act on their private dislike of Trump.", "tweet_url": "https://x.com/dampedspring/status/2096917311420567606", "type": "thread"}]}, {"cluster": "Global Macro Data — Eurozone, UK, Canada Tariffs", "category": ["macro", "geopolitics"], "items": [{"author": "elerianm", "summary": "Reports a sharp upward revision to Irish GDP lifted Eurozone Q2 growth to 0.6% (vs. 0.4% preliminary), the fastest pace in over a year, though France remains a drag alongside Japan and the UK's fiscal troubles.", "tweet_url": "https://x.com/elerianm/status/2096934089710305607", "images": ["https://pbs.twimg.com/media/HRnOcO4WYAEEK2Q.jpg", "https://pbs.twimg.com/media/HRnOcPdbcAAaIw5.jpg"], "type": "tweet"}, {"author": "elerianm", "summary": "Covers UK Chancellor John Healey's upbeat \"Growth Britain\" speech — maintaining fiscal discipline while pushing regional investment — and notes debt interest alone would now outspend Defense, Home Office and Justice combined if it were its own department.", "tweet_url": "https://x.com/elerianm/status/2096939861185896611", "type": "tweet"}, {"author": "elerianm", "summary": "Flags that Canada is set to impose retaliatory tariffs of 15-50% on US imports absent a last-minute deal, with the US warning of further tariffs and possible export bans in response.", "tweet_url": "https://x.com/elerianm/status/2096993283675246645", "type": "tweet"}]}, {"cluster": "ZIM / Hapag-Lloyd Buyout Valuation Fight", "category": ["macro", "positioning"], "items": [{"author": "ZeeContrarian1", "summary": "Reports Hapag-Lloyd and FIMI got another 30 days to improve their $ZIM offer, then builds a detailed sum-of-the-parts case: the stated $35/share bid is effectively ~$45/share once employee comp and transferred assets are counted, implying Hapag-Lloyd's own models value ZIM near $60/share — before accounting for the recent shipping-rate \"golden swan\" and multi-year fleet lead times that make replacement value even higher (potential $100+/share).", "tweet_url": "https://x.com/ZeeContrarian1/status/2096913976873381920", "images": ["https://pbs.twimg.com/media/HRm8JYUXQAIVkgP.jpg"], "type": "thread"}, {"author": "ZeeContrarian1", "summary": "Follow-up quantifies the near-term return: $35 buyout + ~$5/share in dividends before close + ~$2/share recovered impairment value = $42/share, roughly 47% upside from $28.50, with management already discussing value creation with major shareholders.", "tweet_url": "https://x.com/ZeeContrarian1/status/2096958148443525602", "type": "thread"}]}], "B_insights": [{"author": "Swedish_uranium", "summary": "Daily metals pulse: Japan's August reserves fell a record $79.6B, with FX reserves down $94.6B including an $87.8B Treasury drawdown — but unchanged gold holdings (27.2M oz) gained $14.6B in value, offsetting 15%+ of the reserve decline and lifting gold's reserve share from 8.5% to 10.3% without any additional buying. Frames this as the entire gold thesis playing out live: paper reserves get spent, gold reprices. Also covers silver (structurally deficit-driven, higher beta), copper (consolidating near record highs on constrained supply and AI/grid demand), and uranium (Russian supply share risk rising toward 36% by 2040).", "tweet_url": "https://x.com/Swedish_uranium/status/2096838545193210250", "type": "tweet"}, {"author": "pboockvar", "summary": "Agrees with the commodity bull case after a podcast segment with Jeff Currie pounding the table on hard assets, a $10K gold target, energy over tech, and underpriced global recession risk.", "tweet_url": "https://x.com/pboockvar/status/2097002980583051372", "type": "tweet"}, {"author": "DefiIgnas", "summary": "Full playbook for the current memecoin meta: for traders with no edge, buy volume-capturing infra ($UNI, Jupiter, Raydium; $ARB if Robinhood Chain mania persists, $SOL if Solana memes dominate) or tokenization plays ($BP, $HOOD); for more meme exposure, buy launchpads ($PONS, LaunchLab, $PUMP) since every new token pays them first. For LPs, tokenized stock/USD pairs offer high fees with low impermanent loss because arb bots keep prices pinned to Nasdaq.", "tweet_url": "https://x.com/DefiIgnas/status/2096946542938575059", "type": "thread"}, {"author": "zeroxkyle", "summary": "Lays out a checklist for evaluating tokens beyond pure memetic attention: founder quality/background (the biggest driver of 100x outcomes), value accrual mechanics (how the token captures value without VC/insider dump risk), product PMF and growth-theme fit (perps/launchpads currently \"sexier\" than bridges/yield), and secondary factors like monetization and runway.", "tweet_url": "https://x.com/zeroxkyle/status/2096950427623518626", "type": "thread"}, {"author": "0xSammy", "summary": "Breaks down \"TAMPONS,\" a memecoin structurally paired with a 3x short on $PONS: every trade's 1% fee partly funds the short position, realized shorting profits buy back and burn TAMPONS, creating a flywheel where PONS downside becomes recurring TAMPONS buy pressure. Sees this memetic // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
