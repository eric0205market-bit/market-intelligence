story; Russia/Ukraine-style energy-infrastructure war would be a scarcity shock.", "tweetA": "Everyone prices Hormuz. Bab-el-Mandeb is the second door and the Saudis are fighting on both sides of the building with weak ground forces. That's a different risk than 'tanker attack premium'.", "tweetB": "If the Russia/Ukraine template of hitting energy infrastructure migrates to the Gulf, the question isn't $80 vs $90 oil. It's whether spare capacity exists where the damage is.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.macroedge.world/p/war-note-doctor-doctor-saudihouthi"}, {"id": 3, "cat": "energy", "urgency": "deep", "source": "MacroEdge / War Note", "title": "WTI $80-82 'floor' entrenching, back-end of the curve barely weak, Jan-27 strong; Hormuz tightening arrives with a lag", "idea": "Strait flows have escalated meaningfully over ~3 days, which MacroEdge argues tightens the oil market with a lag, contrary to the narrative of immediate reaction. Dip of the last two weeks feels like the pre-May period; still some technical downside but a $80-$82 WTI floor is being entrenched. Back-end showing very little weakness, called positive for operators, rational E&Ps and non-ops. Also flags bullish diesel dynamics (hurricane + Venezuelan refinery outage) and a G7/IEA SPR announcement of ~100M barrels coming.", "angle": "Curve shape is the tell: a sticky back end says the market isn't pricing this as a spike. E&P/non-op names are the expression.", "tweetA": "Spot dips, back end doesn't. That's the market telling you it's a duration problem, not a spike. Look at the Jan-27 strip before you look at the headline. $WTI $FANG", "tweetB": "100M barrels of SPR is roughly one day of global demand. Priced like a rescue. It's a bandage, and the diesel cracks (hurricane + Venezuela refinery outage) know it. $VLO $MPC", "charts": {"count": 2, "hot": false, "desc": "2 oil curve charts (back-end strength, Jan-27) - worth opening"}, "link": "https://www.macroedge.world/p/war-note-doctor-doctor-saudihouthi"}, {"id": 4, "cat": "AI/infra", "urgency": "watch", "source": "MacroEdge / War Note", "title": "'Final wave' of AI crack-up melt-up? Data-center construction number likely to roll over Q4/Q1 — 'watch KOSPI'", "idea": "MacroEdge sees tech/high-beta data-center equities charging on an Administration mandate but wonders if it's the final wave of the melt-up. Its data pointed all year to a Q4/Q1-27 rollover in total construction spend, and thinks it's close, especially if a blue wave revives environmentalism. Wyckoff-style reference and 'keep an eye on the KOSPI in the next month'.", "angle": "KOSPI (memory-heavy) as the canary for the AI trade; data-center construction as a nominal-growth prop.", "tweetA": "Data-center construction is propping up nominal GDP and everyone knows it. The rollover isn't the story, the second derivative is. KOSPI is the cleanest read on memory-cycle exhaustion. $EWY", "tweetB": "A blue wave doesn't have to stop AI buildout to matter. It only has to make permitting and power interconnects harder. That alone could flatten the construction number. $VRT $ETN", "charts": {"count": 1, "hot": false, "desc": "Wyckoff-style chart (likely KOSPI) - worth opening"}, "link": "https://www.macroedge.world/p/war-note-doctor-doctor-saudihouthi"}, {"id": 5, "cat": "macro", "urgency": "act", "source": "Dark Side of the Boom / Bond Market Daily", "title": "$120B coupon supply this week: 3y $58B, 10y $39B, 30y $22B — the tail is the trade after September", "idea": "Treasury sells close to $120B of 3/10/30-year paper this week. The Sept 22-24 round, particularly an ugly 5-year sale, kicked off one of the sharpest yield jumps since early 2025, and yields never retraced, rolling to multi-decade highs. The author's lens: high yields aren't stressed yields, but progressively larger concessions to clear the same supply are the warning light.", "angle": "Clear 10y/30y auctions with little tail would say recent yield spike found buyers; a stumble makes the bounce an intermission. Positions in duration/steepeners hinge on this.", "tweetA": "Not 'can the US sell bonds'. 'What concession clears $22B of 30s'. One bad tail is noise, three is price discovery. This week's 30y auction is the vote that counts. $TLT", "tweetB": "Fed pauses and the long end doesn't care. 120B of supply, deficit gushing, and the marginal buyer wants a better price. Front-end relief is not duration relief.", "charts": {"count": 1, "hot": false, "desc": "LSEG auction/yield chart - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/bond-market-daily-running-with-the"}, {"id": 6, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / Bond Market Daily", "title": "Fed hiked in September; Oct hike odds now ~20% after softer payrolls and easier PCE", "idea": "September's hike came with a hawkish tone but payrolls softened and PCE came in easier than feared. Market now puts roughly 80-20 against an October move, reversing most of the hike probability built a week earlier. Minutes Wednesday. Front end outperforming; long end not.", "angle": "A hiking Fed pausing after one move while the long end has its own supply problem = steepener setup.", "tweetA": "A Fed that hikes once, then blinks on one soft payroll. The front end rallies, and the long end quietly says 'we don't believe you'. Curve steepens either way. $ZT_F $ZB_F", "tweetB": "Hike probability went from build to unwind in one week. If that's the Fed reaction function, the tail risk is a 'hike then reverse' narrative and real yields that don't know where to settle.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/bond-market-daily-running-with-the"}, {"id": 7, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / Higher Yields Keep Traders Paying Up", "title": "MOVE near yearly highs, payer skew and Treasury put skew rich — traders still buying the airbag after the bounce", "idea": "Bloomberg's Michael Ball notes the MOVE Index remains near the year's highs, implied vol in long-duration Treasuries near the top of its range, and Citi shows rich payer skew and Treasury put skew. Oct hike probability is now below 25%, front end outperforming, but options say nobody is relaxed.", "angle": "Rates vol bid despite price rally = positioning isn't flat; a clean auction could unwind it, a weak one squeezes the long end.", "tweetA": "Price says relief. Skew says nobody believes it. When the rally comes with the MOVE still near highs, the market is renting insurance, not buying duration. Cheap?", "tweetB": "Payer skew rich after a bounce is how you get a violent second leg. Someone is paying up for higher yields at the top of their range. I'd rather know who before the 30y auction.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/higher-yields-keep-traders-paying"}, {"id": 8, "cat": "crypto", "urgency": "watch", "source": "a16z crypto / Substack Notes", "title": "Hyperliquid: 28 non-crypto perp markets did $249B in 90 days — almost half tied to chips and memory", "idea": "a16z crypto note: the 28 non-crypto perp markets tracked on Hyperliquid did $249B volume over 90 days; nearly half was tied to chips and memory. There are also markets for oil, silver, and not-yet-public companies.", "angle": "Crypto rails are becoming the 24/7 venue for AI-trade risk. Pre-IPO perps (Anthropic/OpenAI) are a sentiment gauge.", "tweetA": "$249B in 90 days on non-crypto perps. Half of it chips and memory. The most liquid weekend market for $NVDA/$MU risk is now a crypto exchange. TradFi closes, the AI trade doesn't.", "tweetB": "Perps on companies that haven't IPO'd yet. Anthropic lists by Thanksgiving; there's already a market pricing it with leverage. That is the price discovery the IPO bankers are trying to control. $HYPE", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://substack.com/@a16zcrypto/note/c-351363238"}, {"id": 9, "cat": "culture", "urgency": "watch", "source": "Stacy Muur / Substack Notes", "title": "Top-performing creatives by industry on Facebook/Instagram: street interview 30% for auto, 'post it' 27.4% for fashion", "idea": "Stacy Muur's note lists best-performing ad formats: automotive street interview 30.0%; fashion post-it 27.4% and quiz 26%; pets nostalgia 26.1%; parenting unboxing 25.5%; home reaction video 22.5%; entertainment how-to 19.5%; professional services notes-app 16.7%; technology letter 17.6%; beauty trend 12.3%. Also a16z note: 'Make it exist first, make it good later.'", "angle": "Format data for content: tech does letters, not demos. Useful for tweet structure; also shows attention arbitrage by format.", "tweetA": "Tech ads that work best look like a letter. Not a demo, not a slick video. In the era of AI slop, plain text with a person's voice is the premium format.", "tweetB": "Auto: street interview. Fashion: post-it. Tech: letter. The winning formats are all 'someone you could know said it'. Authenticity is now the ad-tech moat. $META", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://newsletter.stacysbrain.com/p/research-the-best-performing-hooks"}, {"id": 10, "cat": "science", "urgency": "watch", "source": "McKinsey / Only McKinsey Perspectives", "title": "Humanoids edging toward everyday deployment; forecast >1 billion by 2050; constraints shift to chips, power, capital, talent", "idea": "Per Forbes via McKinsey: humanoid robots are in factories/warehouses for labor shortages, could reach hospitals and homes as costs fall, with one forecast above a billion units by 2050. McKinsey's Tech Trends Outlook 2026 says robotics is one of 14 AI-accelerated trends and that the binding constraint is now chips, power, capital and talent, not capability.", "angle": "Robotics supply chain (actuators, rare-earth magnets, batteries) as the physical-AI trade; the same power/chip bottleneck as data centers.", "tweetA": "One billion humanoids by 2050 means ~40M units a year if linear. That's more than global auto production. Where does the magnet supply come from? $TSLA", "tweetB": "McKinsey says the bottleneck for physical AI is no longer capability. It's chips, power, capital and talent. That's the same list as data centers. They're competing for the same scarce inputs.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://email.mckinsey.com/capabilities/tech-and-ai/our-insights/the-top-trends-in-tech"}, {"id": 11, "cat": "culture", "urgency": "watch", "source": "McKinsey / Only McKinsey Perspectives", "title": "Billion-dollar beauty is rare: 7 of 400+ brands founded since 2005 hit $1B sales in 2025, two fragrance; Indian fragrance rising", "idea": "McKinsey analysis of 400+ beauty brands founded since 2005: only seven reached $1B annual sales in 2025, including two fragrance brands. FT notes Indian fragrance brands gaining global traction with scents rooted in South Asian culture, via digital discovery and retailer interest.", "angle": "1.7% hit rate; the base rate for consumer brand venture. Fragrance as cultural-export vector (India).", "tweetA": "7 out of 400+. Less than 2% of beauty brands founded in 20 years reached $1B. The brand-building 'playbook' has a success rate below most seed funds. Fragrance is winning two of the seven. $EL $COTY", "tweetB": "Indian fragrance brands going global is a soft-power data point. Culture-rooted products travel via digital discovery faster than any retailer ever moved them.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://email.mckinsey.com/industries/consumer-packaged-goods/our-insights/billion-dollar-beauty-the-odds-of-scaling-a-breakout-brand"}, {"id": 12, "cat": "AI/infra", "urgency": "deep", "source": "McKinsey / Only McKinsey Perspectives", "title": "AI turns tech from asset-light to capital-intensive; as models converge, advantage shifts to who can finance, build and operate infra", "idea": "Via Fortune/McKinsey: as leading models converge in capability, competitive advantage may shift to companies that most efficiently finance, build and operate the infrastructure behind them. Arenas such as AI, robotics, and EVs are reshaping where value is created; leaders should direct capital to emerging sources of advantage rather than legacy positions.", "angle": "Cost of capital is the new moat: favors hyperscalers with balance sheets and utilities-like financiers; pressures pure-play labs.", "tweetA": "Tech used to be the asset-light industry. Now the winner is whoever has the cheapest capital. That's a utility business model with a software multiplier. Valuations haven't adjusted. $MSFT $ORCL", "tweetB": "When models converge, margin moves to whoever owns the power and the financing. This is why Anthropic is IPO'ing: a model company needs a bond desk.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://email.mckinsey.com/capabilities/strategy-and-corporate-finance/our-insights/strategy-in-the-age-of-arenas"}, {"id": 13, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI: Reset to Zero (AI-RTZ #1232)", "title": "Agents paying agents: Stripe reportedly paid $7.5B for OpenRouter; Nvidia ~$13B for Hugging Face; revive HTTP 402", "idea": "Parekh's three-legged stool (ads, subscriptions, transactions) rebuilt for AI. Cloudflare's Prince wants to revive HTTP 402 'Payment Required' with Coinbase and Stripe so agents pay fractions of a penny per page. Stripe reportedly paid $7.5B for OpenRouter (400+ models, 80+ providers), Nvidia about $13B for Hugging Face. Stripe processes ~$2T/yr incl. billing for OpenAI and Anthropic. 'Routing tokens is starting to look a lot like routing payments.'", "angle": "Token routing as the new payments layer; stablecoin micropayments as the settlement rail. Crypto/AI intersection.", "tweetA": "Stripe bought OpenRouter for $7.5B. Nvidia bought Hugging Face for $13B. Both are the same bet: whoever routes and meters model calls owns the toll booth. 402 was reserved in 1996, and the machines finally need it. $STRIPE_PRIVATE $NVDA", "tweetB": "Agents can't use a credit card with a human signature. The unit of commerce shrinks to a fraction of a cent, and that's only economic on stablecoin rails. This is the actual stablecoin use case, not remittances. $COIN $USDC", "charts": {"count": 1, "hot": false, "desc": "AI Tech Wave 'Box 4' chart - worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-the-three-legged-business-stool"}, {"id": 14, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI: Reset to Zero (AI-RTZ #1232)", "title": "Meta's Muse to take a fee on transactions instead of ads; Apple Pay reportedly earns ~0.15% of US card transactions", "idea": "Zuckerberg said at Meta Connect that Muse will earn a small fee on transactions it completes, with PayPal, Walmart, Best Buy and Expedia signed on. That mirrors the card-network model (Apple Pay reportedly earns ~0.15% of US credit card transactions since 2014). Over 40% of Instinct's users handed over a credit card within three weeks. Google writing rules via the Agent Payments Protocol; OpenAI has app store but not billing layer.", "angle": "Agent commerce take-rate war: Visa/MA vs Apple vs Meta vs Stripe. Trust is built quickly (40% in 3 weeks).", "tweetA": "40% of users gave an AI agent a credit card within three weeks. That's not adoption, that's trust compression. Now count the take-rate: Apple 0.15%, Meta 'a small fee'. $V $MA are the incumbents at risk. ", "tweetB": "Meta is going from ads to taxing transactions. If agents shop, the ad impression is bypassed and the ad business goes with it. Zuckerberg didn't pick this pivot out of curiosity. $META", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-the-three-legged-business-stool"}, {"id": 15, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI: Reset to Zero (AI-RTZ #1232)", "title": "Wikipedia pageviews -8% as AI answers replace visits; Reddit earns several times more per token than NYT; 'Box 4' data needs its own rail", "idea": "Wikimedia CEO Meehan told Axios pageviews fell 8% last year as AI replaced visits; ~80% of funding is small donors, ~10% enterprise (Amazon, Google, Microsoft, Meta, Perplexity). Per Prince, Reddit earns several times more per token in licensing than the NYT, since nothing substitutes it. Creator economy ~half a trillion (Goldman). YouTube creators keep 55%; Spotify paid ~$12B to rights holders. Music took a decade from Napster to Spotify.", "angle": "Data-licensing price discovery: scarce, non-substitutable corpora win. Bearish for ad-funded content; bullish for unique data owners.", "tweetA": "Reddit gets paid several times more per token than the NYT. Not because it's better writing. Because nothing substitutes it. In the AI economy, uniqueness is priced, quality isn't. $RDDT", "tweetB": "Wikipedia traffic -8% while every model trains on it. The models need fresh data and the data producers get less traffic. Someone has to build the rail or the training data degrades. Music took 10+ years. They don't have 10.", "charts": {"count": 1, "hot": false, "desc": "AI Tech Wave stack chart - worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-the-three-legged-business-stool"}, {"id": 16, "cat": "AI/infra", "urgency": "act", "source": "Irrational Analysis / Marvell 2026 Investor Day", "title": "Ciena up more than Marvell on Marvell's own investor day — author sold CIEN for AXTI the day before", "idea": "Irrational Analysis sold Ciena to buy more AXTI to lever optics, then Marvell's investor day 'sent Ciena to the moon' while only mildly lifting MRVL. Author has been ultra Broadcom bull / moderate Marvell bear ('the engineering delta is quite wide') and notes everyone uses Broadcom as a funding short while Marvell has gone to the moon.", "angle": "Cross-asset funding: AVGO as funding short, optics names squeezing. Read-through of Marvell's optics narrative to coherent/DCI vendors.", "tweetA": "Marvell has an investor day and Ciena rips more than Marvell. Positioning is the signal: the market is paying for 'optics beta' wherever it can find it. $MRVL $CIEN $AVGO", "tweetB": "Broadcom as the funding short for Marvell and optics. When your best-engineered name is the funding leg, that's not a fundamental call, that's crowding.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://irrationalanalysis.substack.com/p/marvell-2026-investor-day-irrational"}, {"id": 17, "cat": "AI/infra", "urgency": "deep", "source": "Irrational Analysis / Marvell 2026 Investor Day", "title": "Far-out targets and 'CAGR CAGR CAGR' decks are bubble tells: 'this bubble probably gonna pop before 2030'", "idea": "The author says that when semis give far-out targets it indicates a bubble, and that half the deck is the same CAGR bar chart. Notes epic attrition, a 5G/telco business 'dead', a SerDes ranking (Oct 2026), and asks whether the EDA-agent is a wrapper for external LLMs.", "angle": "Sentiment indicator: management guiding to 2030+ targets. Keep slide as a time-stamped bubble marker.", "tweetA": "Rule of thumb from an engineer: when a semi company shows 2030 targets, it's late. Save the slide. We'll want it as evidence of what the top looked like.", "tweetB": "Counter: 'CAGR' replaced 'engineering' at investor days. The most informative slide in the deck is the attrition number nobody put on a slide. $MRVL", "charts": {"count": 1, "hot": false, "desc": "Annotated slides (SerDes ranking) - worth opening"}, "link": "https://irrationalanalysis.substack.com/p/marvell-2026-investor-day-irrational"}, {"id": 18, "cat": "AI/infra", "urgency": "deep", "source": "Irrational Analysis / Marvell 2026 Investor Day", "title": "Optics engineering teardown: TFLN 'a meme', chromatic dispersion limit, uLED/uVCSEL reach, GeSi EAM, OCI MSA O-band vs C-band", "idea": "Detailed technical critique: TFLN is called a meme material pitched by PhDs; plasmonic modulators unproven; ring modulators 'process agnostic' dismissed; uVCSEL can go 10 m or not at all; GeSi EAM pivot to NPO/CPO defeats its shoreline point; OCI MSA is defined at O-band but their EAM is C-band only. Flags a 1.6T DSP respin and a VP fired. Praised: die-to-die PHY, dense SRAM, pre-FEC BER 3e-6 / post-FEC 1e-11.", "angle": "Photonics picks: separate real from meme. Skeptic of TFLN/uLED/plasmonic; positive on die-to-die and SiPho incumbents.", "tweetA": "TFLN is the optics trade everyone wants to own and an engineer who reads the datasheets calls it a meme. When the technology skeptic and the investor-day deck disagree, I'm trading the skeptic. $LITE $COHR", "tweetB": "O-band standard, C-band modulator. Sometimes the market doesn't care about the spec until the design win doesn't come. Watch what ships in volume, not what's on a slide. $MRVL", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://irrationalanalysis.substack.com/p/marvell-2026-investor-day-irrational"}, {"id": 19, "cat": "AI/infra", "urgency": "watch", "source": "Irrational Analysis / Marvell 2026 Investor Day", "title": "Marvell memory expander uses HBM as a cache for DRAM — HBM allocation question; 'latency under 100ns would be pretty good'", "idea": "Marvell showed a memory-expander product with HBM as cache in front of DRAM. Author doubts the economics and whether Marvell can get HBM allocation when most allocation is needed for XPUs. Also: Marvell NAND controller share 'like none', Celestial AI disappeared from the deck.", "angle": "HBM supply is the choke point for everything; any product that uses HBM as cache competes with XPU allocation.", "tweetA": "HBM is the scarcest good in the AI stack and Marvell wants to use it as a cache. Who gets the allocation, an XPU or a memory expander? That's the answer to whether CXL expansion is real. $MU", "tweetB": "What happened to Celestial AI? They vanished from the deck. When the acquired photonics startup is invisible one year later, that's a footnote that matters. $MRVL", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://irrationalanalysis.substack.com/p/marvell-2026-investor-day-irrational"}, {"id": 20, "cat": "positioning", "urgency": "deep", "source": "Bloomberg / John Authers, Points of Return", "title": "S&P at a record on narrowest breadth: small caps lost nearly all 2026 outperformance vs mega-caps; value at decade-low vs growth", "idea": "S&P 500 closed at an all-time high Tuesday, first since August. Russell 2000 has given back almost all of its YTD outperformance vs Russell Top 50; S&P value vs growth at a fresh decade nadir. Gap between large growth and small value since ChatGPT launch is 'yawning'. Q2 growth earnings outstripped value earnings at an unprecedented rate; Q3 season starts next week.", "angle": "Size and value anomalies, the two textbook ones, are both dead. Q3 earnings decide if AI profit is zero-sum.", "tweetA": "Two textbook anomalies, size and value, have both inverted at once. The market is a one-factor trade: owning the AI winners. The question for Q3 is whether those profits are coming out of everyone else's margins. $IWM $QQQ", "tweetB": "Record high and the equal-weight trade is losing. When the index and the median stock tell different stories, one of them is wrong, and it's usually the median stock that gets surprised.", "charts": {"count": 3, "hot": true, "desc": "3 charts: size/value spread, large growth vs small value gap, growth vs value Q2 earnings - 🔥 CHART WORTH SAVING"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-07/sesame-street-has-two-letters-for-the-record-us-stock-rally"}, {"id": 21, "cat": "macro", "urgency": "deep", "source": "Bloomberg / John Authers, Points of Return", "title": "IPOs: ~$230B raised YTD (+45% y/y) vs $373B in 2021; IPO market cap 4.3% of S&P vs >10% in the 1990s; multiples compress ~3 pts", "idea": "Global IPOs raised nearly $230B YTD, >45% above last year, but need a burst to beat 2021's $373B. BCA's Weisberger: post-listing IPO market cap is $2.7T (nearly 2x prior peaks in real terms) but only 4.3% of S&P cap vs >10% in the 1990s; only ~200 companies in 12 months, one-third of prior peaks. GMO: market more sensitive to equity supply. Forward multiples have compressed ~3 points as earnings rose. 'The bigger the wave, the bigger the hit to returns and multiples.'", "angle": "Equity supply as an AI-bubble catalyst: SpaceX lockup and Anthropic/OpenAI listings.", "tweetA": "Earnings up, multiples down 3 points. That's supply, not fundamentals. The AI bubble doesn't need demand to disappoint, it needs enough paper to be sold to the same buyers. $SPY", "tweetB": "IPO volume is concentrated: ~200 deals, one SpaceX. Market cap 4.3% of S&P vs >10% in 1999. Everyone says 'bubble' but by supply the real wave hasn't even started yet. That's not comforting.", "charts": {"count": 4, "hot": true, "desc": "IPO proceeds vs 2021, IPO cap/S&P cap, forward multiples, IPO supply vs returns - 🔥 CHART WORTH SAVING"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-07/sesame-street-has-two-letters-for-the-record-us-stock-rally"}, {"id": 22, "cat": "venture", "urgency": "act", "source": "Bloomberg / John Authers, Points of Return", "title": "Anthropic IPO expected by Thanksgiving; OpenAI not this year; $2T of SpaceX shares unlock next summer", "idea": "Anthropic's IPO is 'imminent', expected by Thanksgiving, and the next big AI test after SpaceX (biggest IPO on record this summer, which fell 20% below its IPO price in July, erasing $1.2T of value). OpenAI's IPO won't happen this year. The release of $2T of SpaceX shares when the lock-up expires next summer 'could be far more of a problem'. Oura postponed its IPO over valuation gap. Bloomberg Opinion's Aaron Brown says the Anthropic prospectus is long on flash, short on information.", "angle": "AI IPO calendar: Anthropic Nov, SpaceX lockup next summer. Supply overhang for mega-cap growth.", "tweetA": "Anthropic lists by Thanksgiving. SpaceX lockup next summer is $2T. The AI IPO calendar is a supply schedule, and the second one is 20x bigger than the first. $SPCX", "tweetB": "SpaceX dropped 20% below IPO price within weeks, wiping $1.2T. That's the base rate for 'biggest IPO ever'. Price the Anthropic deal with that in mind, not with the ARR slide.", "charts": {"count": 1, "hot": false, "desc": "SpaceX lockup chart - worth opening"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-07/sesame-street-has-two-letters-for-the-record-us-stock-rally"}, {"id": 23, "cat": "macro", "urgency": "act", "source": "Bloomberg / John Authers, Points of Return", "title": "France: OAT-Bund 10y spread 141→127bp in two days, 2y 65→44; France now riskier than Spain; Italian BTPs yield less than OATs", "idea": "French over German 10y spread retreated from 141 to 127bp in two days, 2y from 65 to 44bp, after Le Pen vowed to cut the deficit (below 3% by 2032). TS Lombard: a parabolic move tends to exhaust; leveraged long-OAT positions were forced out; 150bp is the consensus ECB-reaction zone. Spain's 2012 spreads were far higher. France's average debt duration is >8 years, longer than US/Germany/Italy. Prediction markets give Melenchon 12% (he argued for cancelling French debt).", "angle": "FROGS trade. Spread tail risk vs ECB backstop; long duration funding is the buffer.", "tweetA": "France at 127bp, riskier than Spain, with Italy yielding less than France. If you told a 2012 trader that, they'd say 'sell the euro'. Meloni being the sane one is the plot twist. $FXE", "tweetB": "Le Pen is promising deficit cuts by cutting EU contributions, which is not real. The market bought the sentence, not the math. Spreads rallying on a promise nobody believes is a short setup, not a bull case.", "charts": {"count": 4, "hot": true, "desc": "French-German spread, French vs euro-zone stocks, Spain 2012 comparison - 🔥 CHART WORTH SAVING"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-07/sesame-street-has-two-letters-for-the-record-us-stock-rally"}, {"id": 24, "cat": "credit", "urgency": "watch", "source": "Bloomberg / John Authers, Points of Return", "title": "Deeply distressed US loans rise to highest level since the pandemic", "idea": "Bloomberg flags (headline only in the Authers bullet list) that deeply distressed US loans are at the highest since the pandemic, alongside a record S&P and tight growth/value.", "angle": "Credit/equity divergence: record equity highs next to rising deep distress in loans. Ties to higher long-end real yields.", "tweetA": "Record S&P, and deeply distressed loans at the highest since the pandemic. Same economy, two scoreboards. The AI winners aren't the ones refinancing at these yields. $BKLN", "tweetB": "Equity is a narrow AI trade; credit is the whole economy. The 'deeply distressed' share is the part of the economy not in the index.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.bloomberg.com/news/articles/2026-10-06/deeply-distressed-us-loans-rise-to-highest-level-since-pandemic"}, {"id": 25, "cat": "energy", "urgency": "act", "source": "HFIR / Peak Hormuz", "title": "'Peak Hormuz': ship-to-ship transfer maxed out, 10 tankers attacked since Oct 1 (UKMTO), old VLCC prices rising", "idea": "HFIR argues the Oman-lane flow recovering to pre-war levels gave a false sense of stability. Since the start of October UKMTO reports 10 tanker attacks. Old VLCCs have risen in price as countries like the UAE buy older ships for shuttle runs they can discard if hit. This is unsustainable: Iran's escalation will bleed the fleet dry. Preliminary Kpler loading data says we've already seen peak Hormuz. Calls 'Iran is losing control because flows rose' the worst take of the year; China allowed Saudi exports from the East.", "angle": "Physical oil: VLCC rates and old tanker values are the leading indicator; shuttle flow falls as fleet attrits. Complements MacroEdge floor thesis.", "tweetA": "10 tankers hit in 6 days and the market's response is to buy old VLCCs to use as disposable ferries. When the used-ship market prices attrition, the oil price isn't pricing attrition yet. $FRO $DHT", "tweetB": "Oman lane flow hit pre-war levels and everyone said 'normalizing'. It was the shuttle running at max capacity. You can't surge a number that's already maxed out. Next print is lower.", "charts": {"count": 0, "hot": false, "desc": "Kpler loading charts in article - worth opening"}, "link": "https://www.hfir.com/p/peak-hormuz"}, {"id": 26, "cat": "gold", "urgency": "deep", "source": "Dark Side of the Boom / Gold Market Daily", "title": "Producer countries are hoarding their own gold: Indonesia export levy up to 15%, Laos domestic refining, China makes exit hard", "idea": "Nikkei Asia (via the note): producer countries push to capture value via refining, export restrictions and central-bank purchases of local production. Indonesia (100+ t/yr) has an export tax up to 15%; Laos (~12 t in 2025) is building a Lao Bullion Bank; China (~380 t/yr, a tenth of mine supply) makes inflows easy and outflows hard. Mine supply stays flat but metal available to the international market shrinks. 'The mine is still producing. The ounces simply stop travelling.'", "angle": "Supply-side tightening not captured in demand-focused models; a new component to the gold structural story.", "tweetA": "Everyone models central-bank demand. Nobody models ounces that never reach LBMA. Indonesia 15% export tax, China closed exit, Laos building a bullion bank. That's supply tightening without a single mine closing. $GLD $GDX", "tweetB": "Gold bulls talk about demand. The next leg is a supply story: producers keeping their own metal. Goldman's model doesn't capture ounces that never become 'central bank buying' on paper.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/gold-market-daily-the-countries-that"}, {"id": 27, "cat": "gold", "urgency": "deep", "source": "Dark Side of the Boom / Gold Market Daily", "title": "China's reserve rotation: PBOC gold 2,345t, Treasury holdings -41% since 2020; non-monetary gold imports 997t Jan-Jul (+80% y/y); 5-month imports 374→790t", "idea": "China's reported Treasury holdings are down ~41% since 2020 while PBOC gold is cited at 2,345t. Chinese non-monetary imports were 997t Jan-Jul (+80% y/y) plus 142t in August, with strong flows into Beijing and Guangdong (previously official-sector routes). Between two five-month periods imports more than doubled, 374 to 790t, absorbing weaker India imports and ex-China ETF selling. SocGen: dollar share of reserves ~57% in 2025, 5+ pts below 2022; top buyers include Poland, China, Kazakhstan, Czechia, Chile.", "angle": "China is the physical bid underneath the market. Dollar share of reserves 57%.", "tweetA": "China imported 790t in five months vs 374t a year earlier. India bought less, ETFs sold, and China covered the whole gap. That's the floor under gold. It's one buyer. $GLD", "tweetB": "Treasury holdings -41%, gold up, dollar reserves share 57%. De-dollarization isn't an event, it's a slope. Look at it over 5 years, not 5 weeks. $TLT $GLD", "charts": {"count": 3, "hot": true, "desc": "China gold vs Treasuries, China imports 5m comparison, ex-China flows - 🔥 CHART WORTH SAVING"}, "link": "https://thedarksideoftheboom.substack.com/p/gold-market-daily-the-countries-that"}, {"id": 28, "cat": "gold", "urgency": "deep", "source": "Dark Side of the Boom / Gold Market Daily", "title": "Goldman: central banks buying ~91t/month vs 17t pre-2022; $5,400 end-2027 target kept but slower path; two clocks: Fed vs reserve managers", "idea": "Goldman's central-bank nowcast estimates ~91t/month (3m SA) vs 17t pre-2022 average; projects ~60t/month through 2026-27, and keeps $5,400/oz end-2027 but expects a slower path after renewed rate rises. Structural forecast is overwhelmingly central-bank driven (ETFs and spec contribute little). GLD call positioning far above historical norms (dealer gamma). Gold fell from late-summer peak as the Fed returned to tightening. Gillard: Chinese demand can support a sell-off without sustaining a rally.", "angle": "Two-clock framework: Fed owns the trading tape, reserve managers own the structural bid. Dips as strategic buys; GLD call gamma as upside accelerant.", "tweetA": "Reserve managers don't care about 20bp in real yields. They might welcome the lower price. Gold has a buyer with a decade-long clock and a seller with a weekly one. $GLD", "tweetB": "91t a month vs 17t. Goldman still sees $5,400 but slowed the path because real yields went up. The target didn't change, the timing did. That's a trade, not a thesis change.", "charts": {"count": 4, "hot": true, "desc": "central-bank nowcast, Goldman forecast decomposition, forecast path, GLD calls - 🔥 CHART WORTH SAVING"}, "link": "https://thedarksideoftheboom.substack.com/p/gold-market-daily-the-countries-that"}];
