d US IG credit only to Neutral, while holding a negative view on US and European corporate credit and high yield given tight spreads.", "url": "https://www.schroders.com/en-us/us/individual/insights/our-multi-asset-investment-views-july-2026/", "images": []}, {"source": "schroders", "name": "Schroders", "thesis": "US Multi-Sector Fixed Income team sees limited scope for further spread tightening given roughly $1.2 trillion of expected 2026 IG issuance (~30% ahead of 2025's pace), holds a low, defensive corporate-credit allocation, favors hyperscaler/data-center IG issuers, banks, agency MBS and EM debt, and calls the AI-driven hyperscaler debt surge ($182bn YTD vs. $13bn a year earlier) more opportunity than bubble.", "url": "https://www.schroders.com/en-us/us/individual/insights/fixed-income-markets-now-demand-a-mix-of-tactical-offense-and-resilient-defense/", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "Lotfi Karoui argues direct-lending stress since late 2025 is cyclical, not systemic, but flags that a corporate default cycle has begun and financial-engineering excess (leveraged ETFs, CLOs referencing illiquid assets) is re-emerging, with BDC mark dispersion between optimistic and pessimistic managers running six to seven points; separately estimates $1.6 trillion of 2026-27 hyperscaler capex, increasingly debt-funded, keeping real yields higher for longer.", "url": "https://www.pimco.com/us/en/insights/podcasts/accrued-interest/lotfi-karoui-on-private-credit-and-the-ai-capex-supercycle", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "Lotfi Karoui shows persistently negative 10-year swap spreads make US corporate spreads look mechanically tighter versus Treasuries than versus swaps, but monthly swap-spread changes show almost no relationship with IG credit spread changes, implying Treasury cheapness explains little; concludes spread dispersion, not swap-Treasury mechanics, is the real source of alpha for active credit managers.", "url": "https://www.pimco.com/us/en/insights/the-credit-market-lens-rich-spreads-cheap-treasuries-and-an-incomplete-explanation", "images": []}, {"source": "man_group", "name": "Man Group", "thesis": "Q3 2026 hedge fund outlook flags private-credit non-accruals running well above official default rates, concentrated in software, with a further public default wave expected once a 2027-2028 maturity wall arrives, and notes the CCC/BB credit spread ratio is near an all-time high of about 4.5x; maintains positive views on Convertible Arbitrage and Discretionary Macro while downgrading Equity Market Neutral.", "url": "https://www.man.com/insights/the-early-view-july-2026", "images": []}, {"source": "amundi", "name": "Amundi", "thesis": "H2 2026 hedge fund outlook sees credit entering a more mature mid-cycle phase that should eventually reward fundamental long/short credit once spreads dislocate, though dispersion isn't yet wide enough to fully exploit it; prefers directional long/short equity and merger arbitrage over broad credit beta.", "url": "https://research-center.amundi.com/article/hedge-fund-outlook-h2-2026", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas", "thesis": "Olivier Monnoyeur reports European high yield spreads compressed 54bp to 315bp in Q2 (record ~EUR49bn quarterly issuance, 58% higher-quality), YTD returns +1.7%, CCC-BB gap still wide (1260bp vs. 211bp), defaults seen falling to 2.4% by end-2026; stays constructive but flags less room for error, preferring single-B over high-BB and defensive sectors (telecom, healthcare, real estate).", "url": "https://www.bnpparibas-am.com/en/portfolio-perspectives/european-high-yield-market-supportive-despite-geopolitical-tensions/", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas", "thesis": "Chris Iggo argues bonds offer poor real returns given an oil-driven inflation risk (Brent +~20% in July) and prefers short-duration and credit exposure over long-duration government bonds since US IG yields 5.3% versus 3.5% inflation (European IG 3.6% vs. 2.8%), while continuing to view equities as the superior inflation hedge.", "url": "https://www.bnpparibas-am.com/en/front-of-mind/view-from-the-markets-get-real-bonds/", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas", "thesis": "Q3 2026 Global Fixed Income Outlook favors carry over duration across five sleeves: euro IG for coupon income, US agency MBS for carry without significant credit risk, European high yield supported by low defaults but tight spreads requiring selective issuer analysis, and selective EM debt prioritizing durable fundamentals over broad beta.", "url": "https://viewpoint.bnpparibas-am.com/global-fixed-income-outlook-q3-2026-bonds-keep-calm-and-carry-on/", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas", "thesis": "Alaa Bushehri says EM debt showed resilience in Q2 2026 despite the Middle East energy shock, with a growing split between oil-exporting beneficiaries (GCC) and oil-importers (India, Turkey); tightened hard-currency EM credit valuations now require disciplined country selection, though local-currency EM debt remains attractive on real yields.", "url": "https://www.bnpparibas-am.com/en-us/portfolio-perspectives/emerging-market-debt-established-resilience/", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas", "thesis": "John Carey says US agency MBS fundamentals remain robust as elevated mortgage rates (~6.45% origination) suppress refinancing (only 12% of the universe in the money) and prepayments (June speeds down 11%); spreads tightened to ~+100bp (Bloomberg US MBS Index yielding ~5.01%) leading BNP to a modest overweight but neutral stance on further compression.", "url": "https://www.bnpparibas-am.com/en-us/portfolio-perspectives/us-agency-mortgage-backed-securities-fundamentals-remain-robust/", "images": []}, {"source": "kkr", "name": "KKR", "thesis": "Matt Salem argues senior secured CRE debt is a compelling relative-value lending opportunity, not a distressed play, after property values fell roughly 20-30% from peak; KKR's origination pipeline runs about $40 billion per week (70% refinancing, 30% acquisitions), focused on $100 million-plus multifamily and industrial loans offering a premium to liquid corporates.", "url": "https://www.kkr.com/insights/case-for-cre-debt", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "thesis": "Benefit Street Partners argues private-credit lenders should underwrite each borrower's competitive moat rather than treat AI/software exposure as a binary bubble signal, distinguishing narrow single-purpose tools (vulnerable to AI-agent replacement) from deeply embedded system-of-record software; warns lenders in illiquid 4-5 year private-credit positions cannot simply exit if wrong.", "url": "https://www.franklintempleton.com/articles/2026/alternatives/avoiding-saaspocalypse-is-about-underwriting-skill-for-lenders", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "Deputy Governor Sarah Breeden warns private markets AUM has grown roughly six-fold since 2008/09 to about $18 trillion alongside weakening underwriting standards and recent defaults (MFS, Tricolor, First Brands Group), plus rising redemption pressure at retail private-credit funds — one of three vulnerabilities (with gilt-repo leverage and stretched AI valuations) that could crystallize together.", "url": "https://www.bankofengland.co.uk/speech/2026/april/sarah-breeden-at-the-program-on-international-financial-systems-and-harvard-law-school", "images": []}, {"source": "deutsche_bank", "name": "Deutsche Bank", "thesis": "EMEA CIO Dirk Steffen flags that heavy AI-related debt issuance from big tech (capex approaching ~$1 trillion across a handful of hyperscalers) could be crowding out demand and keeping sovereign yields elevated, with market participants favoring corporate investment-grade bonds over government bonds.", "url": "https://wealth.db.com/en/insights/investing-insights/cio-weekly-investment-outlook-podcast.html", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Brian Garrett notes hyperscalers' AI-driven credit issuance ($5.5-6 trillion of capex financing needed 2025-2030) is starting to widen spreads, with Goldman's hyperscaler bond basket widening 22bp in a single week on size and sector-concentration concerns.", "url": "https://www.goldmansachs.com/insights/the-markets/how-earnings-volatility-and-ai-capex-are-affecting-us-markets", "images": []}, {"source": "federal_reserve", "name": "Federal Reserve", "thesis": "A Fed IFDP paper finds about 29% of publicly traded nonfinancial firms use substantial operating leases and 12% show intra-period borrowing as hidden off-balance-sheet leverage, concentrated in smaller, less-monitored firms that report artificially low leverage; forced disclosure in 2019 led affected firms to cut capex 25% and R&D 14%.", "url": "https://www.federalreserve.gov/econres/ifdp/hidden-leverage-in-nonfinancial-corporations.htm", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "Crypto-collateralized lending contracted 9.81% to $69.55B in Q4 2025 on a 24.15% drop in DeFi borrows, while CeFi borrows grew 11.66% (Tether at 61.84% share); total crypto-related debt fell 7.89% to $84.37B from Q3's $91.6B peak, with CeFi loanbooks showing no contagion from the record Oct. 10 liquidation event — a contrast Galaxy reads as validating post-2022 de-risking.", "url": "https://www.galaxy.com/insights/research/state-of-crypto-leverage-q4-2025", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "Portfolio Construction team recommends overweighting private equity, rotating from momentum stocks into quality and hyperscalers, and downgrading late-stage venture capital as part of a broader cross-asset allocation call.", "url": "https://www.bcaresearch.com/marketing/webcasts/quarterly-outlook-portfolio-construction/221556", "images": []}]}, {"theme": "Crypto", "category": ["crypto"], "consensus": "Crypto-research shops broadly agree that spot BTC is in a consolidation/stress phase rather than either a runaway bull run or a systemic crisis. CoinShares' James Butterfill says bitcoin's floor is 'likely in' after fund flows swung to +$287M for the week of July 17 following an eight-week, $8B outflow streak (the worst on record), but sees a break above $80,000 as unlikely without a bigger shift in monetary-policy expectations. CoinShares' July 24 update has BTC pinned in a $64,000-$66,800 range, up roughly 13% from its July 1 low of $57,750 (its best month since January), with ETH near $1,920 and weekly flows of $716M. Galaxy Research's Q4 2025 leverage study corroborates a 'stress without contagion' read: crypto-collateralized lending contracted 9.8% to $69.55B and futures open interest fell 39% to $120.11B after the largest perpetuals liquidation event in history on Oct. 10, yet CeFi loan books (Tether commands 61.8% of CeFi lending) showed no visible contagion, which Galaxy reads as validating post-2022 de-risking. There is also wide agreement that stablecoin plumbing is consolidating fast and reinforcing rather than threatening the dollar: the Fed's international-dollar-roles conference (Governor Waller) and the Bank of England both frame stablecoins as channeling demand into Treasuries and complementing existing money, with the BoE set to publish draft systemic-stablecoin rules next month and finalize them by year-end alongside the US timeline, and the EU's MiCA regime already live with 200+ authorized providers.", "divergence": "The sharpest split is over where bitcoin goes from here and why. Galaxy Research's 2026 outlook is structurally bullish, calling for BTC to reach $250,000 by year-end 2027 and treating near-term weakness (BTC round-tripped from its Oct. 6, 2025 all-time high of $126,080 to the low $90,000s) as a base to reclaim $100,000-105,000 from, reinforced by an 'agentic flywheel' thesis in which AI agents become a new, sticky source of onchain demand. Yet Galaxy's own scorecard shows this optimism has repeatedly overshot: its 2025 targets of $150,000 (later cut to $125,000) missed against BTC actually trading in the $80,000-90,000s. CoinShares is more agnostic and range-bound: Butterfill sees the downside floor as in place but explicitly rejects near-term upside beyond $80,000 without a monetary-policy catalyst. Gavekal goes further, arguing from a halving-cycle framework that the current 'crypto winter' has structural, quadrennial drivers that have produced every prior bull/bear cycle — implying more downside time could still run rather than an imminent reclaim of highs, a direct challenge to Galaxy's 2027 target. Delphi Digital argues the broader cross-asset backdrop remains risk-on so any speculative-leverage flush should be bought rather than sold — but Delphi's preferred tactical shorts are Japan and the UK, not crypto or US equities, implying crypto is treated as a beneficiary of the same regime rather than a target of the trade. On regulation, Galaxy cut its odds of the CLARITY Act becoming law in 2026 to 30% (from a 50/50 coin flip in late June) after seven Democratic negotiators said the combined 616-page Senate text 'falls short' and Elizabeth Warren called it 'dead on arrival'; CoinShares documented the resulting price whipsaw directly — BTC broke above $66,000 on Treasury Secretary Bessent's 'one-yard line' comment, then fell back to $65,500 as implied passage odds dropped from 46% to 38% on the Democratic pushback.", "items": [{"source": "coinshares", "name": "CoinShares", "thesis": "Bitcoin fund flows swung to +$287M for the week of July 17 following an eight-week, $8B outflow streak (the worst on record) as soft CPI/PPI prints halved priced-in rate-hike odds; James Butterfill says BTC's floor is likely in but a break above $80,000 is unlikely without a bigger shift in monetary-policy expectations.", "url": "https://coinshares.com/insights/research-data/market-update-17-07-2026/", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "MiCA's transitional period expired July 1 with 200+ CASPs authorized (57 in Germany), even as crypto-native firms suffered a record 207 hacks in H1 2026 ($972M stolen, two-thirds North Korea-linked); CoinShares argues regulation removed a 'grey-zone subsidy' rather than causing the wreckage.", "url": "https://coinshares.com/insights/the-node/edito-24-07-2026/", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "Bitcoin broke above $66,000 on Bessent's CLARITY 'one-yard line' comment, then fell to $65,500 as Senate Democrats said the draft 'falls short,' cutting implied passage odds from 46% to 38%; BTC is up ~13% from its July 1 low of $57,750, pinned $64,000-$66,800 with ETH near $1,920 and weekly flows of $716M, the strongest since early May.", "url": "https://coinshares.com/insights/research-data/market-update-24-07-2026/", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "Galaxy Research cut its odds of the CLARITY Act becoming law in 2026 to 30% (from a 50/50 coin flip in late June) after seven Democratic negotiators called the 616-page combined Senate text a shortfall and Elizabeth Warren called it 'dead on arrival,' with Republicans holding only ~50 of the 60 votes needed ahead of a July 30 floor deadline.", "url": "https://www.galaxy.com/insights/research/clarity-act-30-percent-odds", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "Galaxy maps an 'agentic flywheel' in which AI agents deploy, reinvest and compound crypto revenue onchain: agent Felix Craft breached $120,000 in 30-day revenue, and Giza's ARMA agent has deployed $35M+ across lending protocols, generating $5.4M in transaction volume on Base in four weeks.", "url": "https://www.galaxy.com/insights/research/zero-human-companies-ai-agents-defi-crypto", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "Galaxy's Q4 2025 leverage report finds crypto-collateralized lending fell 9.8% to $69.55B; futures open interest fell 39% to $120.11B after the largest perps liquidation event in history on Oct. 10; total crypto debt fell 7.89% to $84.37B; CeFi books showed no realized losses, which Galaxy reads as validating post-2022 de-risking versus 2022's Genesis/BlockFi/Celsius collapses.", "url": "https://www.galaxy.com/insights/research/state-of-crypto-leverage-q4-2025", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "Galaxy's 2026 outlook calls for BTC to hit $250,000 by year-end 2027, with near-term downside risk until BTC reclaims $100-105k; a review of 2025's predictions shows BTC missed both its $150k and revised $125k targets, trading $80-90k at time of writing.", "url": "https://www.galaxy.com/insights/research/predictions-2026-crypto-bitcoin-defi", "images": []}, {"source": "chainalysis", "name": "Chainalysis", "thesis": "FATF's 7th Targeted Update (147 jurisdictions) shows rising formal AML compliance but a wide enforcement gap (fewer than 10% of jurisdictions fully meet AML/CFT standards); stablecoins now account for 84% of illicit crypto volume, with 2025 scam losses near $17bn.", "url": "https://www.chainalysis.com/blog/fatf-7th-targeted-update-crypto-compliance/", "images": []}, {"source": "chainalysis", "name": "Chainalysis", "thesis": "The EU's 21st Russia sanctions package (July 23, 218 designations, largest in four years) imposed transaction bans on 14 crypto platforms across six jurisdictions for enabling sanctions evasion, plus a new mechanism letting the EU impose full third-country bans on crypto services.", "url": "https://www.chainalysis.com/blog/eu-21st-russia-sanctions-package-crypto-patforms-july-2026/", "images": []}, {"source": "federal_reserve", "name": "Federal Reserve", "thesis": "The Fed/NY Fed's fifth International Roles of the Dollar conference concluded dollar-denominated stablecoins are likely to reinforce rather than erode dollar dominance — stablecoin transaction volumes now exceed Bitcoin's and channel demand into Treasuries — even as IMF-affiliated research found stablecoin demand shocks can move Treasury yields, FX and equity prices.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/fifth-conference-on-the-international-roles-of-the-u-s-dollar-stablecoins-digital-payments-and-the-ir-of-the-usd-20260716.html", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "BoE Executive Director Nathanaël Benjamin describes the Bank's forthcoming regime for systemic stablecoins, requiring issuers to hold high-quality backing assets for prompt at-par redemption, as part of a 'multi-money' vision where cash, bank deposits, tokenised deposits and stablecoins coexist.", "url": "https://www.bankofengland.co.uk/speech/2026/july/nathanael-benjamin-speech-at-omfif", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "BoE Deputy Governor Sarah Breeden confirms the Bank will publish draft rules for systemic sterling stablecoins next month, finalized by year-end alongside the US timeline, as part of a 'multi-money' retail system.", "url": "https://www.bankofengland.co.uk/speech/2026/may/sarah-breeden-speech-at-city-week-the-future-of-money-in-a-digital-world", "images": []}, {"source": "delphi_digital", "name": "Delphi Digital", "thesis": "Delphi's Scott Freeman argues the macro regime remains risk-on and that stretched leveraged-ETF/options positioning makes a volatility flush a dip to buy, not a bear-market start; Delphi favors shorting Japan and the UK, where the fiscal anchor is cracking, over crypto or US equities.", "url": "https://members.delphidigital.io/feed/bearish-speculation-not-growth-ai", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Gavekal argues the bitcoin halving cycle has been at least partly responsible for every crypto bull and bear market to date, including the current downturn, and offers a framework for gauging how much longer the crypto winter and further bitcoin downside could last.", "url": "https://research.gavekal.com/teaser/how-much-longer-for-this-crypto-winter/", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "Uniswap has generated $5.0bn+ in cumulative fees (behind only Tether/Circle); its Robinhood Chain deployment collected $13.2M in fees in 15 days, more than Ethereum, Bitcoin, Solana or Base collected in the prior 30 days, turning UNI into an asset with directly attributable revenue.", "url": "https://coinshares.com/insights/knowledge/uniswap-the-fee-machine-at-the-heart-of-robinhoods-new-chain/", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "Nine major institutional BTC holders (BlackRock, Fidelity Digital Assets, Coinbase, Strategy, Block, Galaxy, Anchorage, ARK Invest, Blockstream) formed the Bitcoin Security Consortium, pledging $15M over three years for security research, as quantum-computing risk to institutionally held BTC shifts from theoretical to an active engineering priority.", "url": "https://www.galaxy.com/insights/research/bitcoin-quantum-security-consortium", "images": []}]}, {"theme": "Energy & Commodities", "category": ["energy", "commodities"], "consensus": "Across banks and independents there is broad agreement that the renewed Iran/Middle East conflict and Houthi attacks on Red Sea shipping have driven a sharp, durable repricing of crude and unsettled gas and metals markets alike. UBS's July 23-24 Dailies track Brent rising from below $73 to above $97/bbl (+33% since the start of July) and then through $100/bbl within a day, alongside Standard Chartered's note of WTI's 6.2% jump to above $91/bbl; Deutsche Bank puts the broader move at roughly $80 to $100/bbl, driven by Saudi Arabia rerouting about 4 million bpd (roughly 65% of pre-crisis volumes) through the Petroline pipeline to Yanbu after Houthi attacks on tankers -- a flow Wood Mackenzie's tanker-tracking shows has nonetheless fallen 41% from a March peak of 4.07mbd to 2.39mbd by June, even as Gulf-wide seaborne exports collapsed 82% y/y with Iraq, Kuwait and Qatar recording zero cargoes. BNP Paribas, CoinShares and BNY all likewise mark oil at one-month-to-eight-week highs. Most houses (UBS, BNY, Deutsche Bank, Schroders) treat the shock as inflationary but not yet regime-changing: UBS still expects the Fed's next move to be a cut toward its ~3% neutral estimate and Treasury yields to fall, while Schroders and BNP Paribas both recommend adding industrial-metals exposure (copper/aluminum) as supply-constrained, resource-independence plays even though the Iran conflict has hit that supply directly. On gold, JPMorgan and Standard Chartered agree the metal has been extremely volatile -- JPMorgan cites trading volumes near $510bn/day (versus $370bn a year ago) and a round trip from an all-time high above $5,400/oz to near $4,000/oz by mid-July, while Standard Chartered pegs support at $3,950/oz after a 2% pullback -- with central-bank buying (China's 20-month streak, the Czech Republic's 39-month streak) cited by both as the structural bid underneath. On gas, Wood Mackenzie and RBC agree European storage is unusually low for the season (just above 50% full per Wood Mackenzie; 54% versus 64% at the same point in 2022 per RBC), with TTF prompt above 60 EUR/MWh, pointing to a tight winter 2026/27 largely independent of how the Gulf conflict resolves.", "divergence": "The sharpest disagreement is over how much further oil can run if the Iran conflict escalates, and how durable the current shock will prove. RBC's Helima Croft takes the most aggressively bullish (tail-risk) side: with Brent already up more than 30% since July 1, the IRGC targeting Gulf data centers, and laden VLCCs now forced to reroute via the Cape of Good Hope (stretching Asia transit from roughly 44 to 54 days), she argues a full regional war could push Brent through the 2022 Russia/Ukraine peak of $128/bbl or even the 2008 record of $146/bbl -- she also notes Hormuz traffic has collapsed to a 3.9mb/d seven-day average with the IMO declaring the Strait too dangerous to cross, while the US SPR sits at 43-year lows and Cushing at operational minimums, leaving almost no buffer against a further supply loss. On the other side, BNY, UBS and Brookings argue the tail risk is overstated and the base case is normalization: BNY's 'muddling through' call rests on the world having far more energy-management flexibility than in 2022 (diversified sourcing, expanded LNG capacity, larger drawn-down inventories); UBS's base case is that Hormuz flows gradually recover and inflation pressure subsides, which is precisely why UBS still expects the Fed's next move to be a cut toward ~3% neutral rather than a hike, with yields falling over the rest of the year; and Brookings' new 'Global Currents' series explicitly flags that Brent spot and futures 'have not spiked as much as many expected,' attributing the muted response partly to drawn-down emergency inventories already being tapped. Deutsche Bank effectively straddles both camps: its acute Red Sea note treats ~$100/bbl Brent as a genuine stagflationary risk that could trigger a rotation into US large-cap IT, healthcare, utilities and energy producers and away from Europe and energy-intensive cyclicals, while its standing CIO Perspectives outlook still calls for oil to head toward a supply surplus 'barring delivery bottlenecks' -- underscoring how unsettled the medium-term view remains even within a single house.", "items": [{"source": "bny", "name": "BNY", "thesis": "Renewed hostilities in the Strait of Hormuz have pushed oil futures into backwardation and spot crude sharply higher, but BNY's base case is a 'muddling through' scenario in which the world's improved energy-management flexibility keeps growth intact despite the energy-cost spike; BNY favors Japan and EM ex-China equities, real assets and value stocks.", "url": "https://www.bny.com/investments/us/en/individual/articles/markets-and-economy/middle-east-conflict-re-escalation-takes-portfolio-volatility-higher.html", "images": []}, {"source": "deutsche_bank", "name": "Deutsche Bank", "thesis": "Houthi attacks on Saudi tankers have exposed a second chokepoint beyond Hormuz: Saudi Arabia now routes roughly 4 million bpd via the Petroline pipeline to Yanbu, and Brent has risen from ~$80/bbl to ~$100/bbl on the escalation. DB's base case is that Gulf flows recover over time, but warns sustained higher oil would revive inflation risk and could trigger a rotation into US large-cap IT, healthcare, utilities and energy producers.", "url": "https://wealth.db.com/en/insights/investing-insights/investing-themes/red-sea-disruptions-increasing-risks-for-energy-markets.html", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "US-Iran tensions have pushed Brent above $100/bbl and the 10-year Treasury yield to 4.7%. Houthi attacks on Red Sea shipping have cut Gulf oil-loading volumes to 2.5mb/d (from 6mb/d) and pushed floating storage in the Gulf to 80-90 million barrels. UBS's base case still sees Hormuz flows gradually recovering and inflation pressure subsiding, keeping the Fed's next move a cut toward ~3% neutral.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-24072026.html", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "The 10-year Treasury yield sits at 4.66%, near its May peak, as Houthi attacks on Saudi tankers and escalating Iran-US strikes push Brent above $97/bbl (+33% since the start of the month). UBS still expects yields to drift lower and expects the Fed's next move to be a cut toward ~3% neutral.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-23072026.html", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas", "thesis": "Renewed US-Iran military strikes drove oil to a one-month high and unsettled equities (MSCI World, S&P 500 and MSCI Europe flat on the week; Nasdaq and Nikkei each -1%). Global public finance commitments to diversify critical-minerals supply chains (lithium, nickel) more than quadrupled to $65 billion between 2023 and 2025.", "url": "https://www.bnpparibas-am.com/en/front-of-mind/take-two-renewed-middle-east-hostilities-china-gdp-growth-falls/", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas", "thesis": "Nadia Grant expects Q2 S&P earnings to grow 22% YoY, led by energy (>2x growth); trade ideas include adding defence and resource-independence plays in copper/aluminum, which have been hit by the Iran conflict but remain supply-constrained.", "url": "https://www.bnpparibas-am.com/en-us/portfolio-perspectives/talking-heads-global-equities-earnings-expectations-remain-strong/", "images": []}, {"source": "rbc", "name": "RBC Capital Markets", "thesis": "Helima Croft notes Houthi entry into the Red Sea has pushed Brent up more than 30% since July 1, and warns oil could breach the 2022 peak of $128/bbl or even test the 2008 high of $146/bbl in a worst-case full regional conflict, as VLCCs rerouting around Suez extend Asia transit from ~44 to ~54 days. European gas storage is only 54% full versus 64% at the same point in 2022.", "url": "https://www.rbccm.com/en/insights/2026/07/data-centers-become-the-new-battleground-in-iran-war", "images": []}, {"source": "rbc", "name": "RBC Capital Markets", "thesis": "The Trump-brokered Versailles ceasefire has collapsed; seven-day average Hormuz traffic has fallen to 3.9mb/d and the IMO has declared the Strait too dangerous for commercial crossings. Cushing sits at operational minimums and the US SPR is at 43-year lows; Russian refinery intake fell to 3.43mb/d in June, cutting July diesel exports and squeezing importers like Turkey and Brazil.", "url": "https://www.rbccm.com/en/insights/2026/07/energy-market-risks-reignited-after-iran-ceasefire-collapses", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "thesis": "Saudi Red Sea crude bypass via the East-West Petroline peaked at ~4.07mbd in March 2026 but had declined 41% to ~2.39mbd by June, while Gulf-wide crude exports fell 82% from January to June, with Iraq, Kuwait and Qatar recording zero seaborne exports since the Hormuz closure; freight rates are running roughly 3x pre-conflict levels.", "url": "https://www.woodmac.com/press-releases/saudi-arabias-red-sea-crude-bypass-peaks-in-march-and-declines-41-by-june/", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "thesis": "European gas storage is only just above 50% full, a historic low for the season. Even in a best case where Qatar restarts by end-September, storage would reach at most 75% by 1 November (versus a five-year average of 90%), virtually guaranteeing elevated gas prices through winter 2026/27 and into 2027.", "url": "https://www.woodmac.com/blogs/the-edge/is-europes-gas-market-inching-towards-winter-crisis/", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "thesis": "A durable Middle East ceasefire and Hormuz reopening remain elusive; sustained LNG-transit disruption would push near-term European gas and power prices higher, though Wood Mackenzie's May 2026 base case still sees the conflict leaving European long-term power-market fundamentals largely unchanged.", "url": "https://www.woodmac.com/news/opinion/what-middle-east-conflict-means-for-european-power-markets/", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "US energy stocks have been the best-performing GICS sector over the past five years -- surging when the Strait of Hormuz effectively closed -- yet remain badly under-owned at just a 3% S&P 500 weight (near record lows) versus tech's roughly 40%.", "url": "https://research.gavekal.com/teaser/the-energy-risk-remains-part-i/", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "The Gulf and Ukraine wars have driven a US oil-and-gas boom (rising production, record refiner margins, surging exports) even as US consumers pay roughly double Trump's target gasoline price, raising the risk the administration imposes export controls ahead of the midterms.", "url": "https://research.gavekal.com/teaser/geoeconomic-monitor-dominance-and-decline/", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Listed pure-play oil refiners outside China have quietly had a monster year, with gains recently turning parabolic even as market attention stays fixed on semiconductor stocks.", "url": "https://research.gavekal.com/teaser/the-energy-risk-remains-part-ii/", "images": []}, {"source": "jpmorgan", "name": "JPMorgan", "thesis": "Average daily gold trading volumes in 2026 are running around $510bn versus $370bn last year, with prices surging to an all-time high above $5,400/oz before pulling back to near $4,000/oz by mid-July. China is on a 20-month central-bank buying streak and the Czech Republic on a 39-month streak; Tether's gold-backed reserves (~130 tons) are flagged as a new source of demand.", "url": "https://www.jpmorgan.com/insights/podcast-hub/making-sense/sifting-through-shifts-in-asia-pacific-gold-trading", "images": []}, {"source": "deutsche_bank", "name": "Deutsche Bank", "thesis": "Deutsche Bank's standing CIO outlook expects gold to keep outshining peers on trade-conflict and inflation-expectation support, sees copper facing both frontloading benefits and tariff risk, and expects oil markets to head toward a supply surplus barring delivery bottlenecks -- a more sanguine medium-term view than the bank's acute Red Sea crisis note.", "url": "https://wealth.db.com/en/insights/investing-insights/economic-and-market-outlook/cio-perspectives-march-2025.html", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "WTI surged 6.2% to above $91/bbl on intensifying US-Iran conflict fears. Gold fell 2% as higher yields and a stronger dollar outweighed safe-haven demand, with support seen at $3,950/oz.", "url": "https://www.sc.com/sg/market-outlook/daily-navigator-24-7-2026/?mvog=1", "images": []}, {"source": "schroders", "name": "Schroders", "thesis": "Schroders flags inflation as more likely to surprise to the upside given Middle East-driven energy disruption, and has turned tactically positive on the US 10-year Treasury. It stays constructive on energy and mining shares and positive on commodities, particularly industrial metals, alongside emerging-market local-currency debt.", "url": "https://www.schroders.com/en-us/us/individual/insights/our-multi-asset-investment-views-july-2026/", "images": []}, {"source": "brookings", "name": "Brookings Institution", "thesis": "Brookings' new 'Global Currents' series notes Brent crude spot and futures have risen with renewed Iran hostilities but have not spiked as much as many expected, partly due to depleted emergency inventories; they also flag the G7's Russian oil price cap continuing to be undermined by an expanding sanctions-evading 'shadow fleet' out of the Baltic.", "url": "https://www.brookings.edu/articles/puzzles-in-the-world-economy/", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "Oxford Economics now expects a more drawn-out Middle East conflict with a long-term reduction in Strait of Hormuz shipping, driving supply-chain stress concentrated in Asia; sulphuric acid prices have risen sharply on Middle East export reliance plus a China export ban.", "url": "https://www.oxfordeconomics.com/resource/middle-east-flare-up-to-boost-supply-chain-stress/", "images": []}]}, {"theme": "Geopolitics", "category": ["geopolitics"], "consensus": "Across asset managers, bulge-bracket and regional banks, central banks and independent researchers, there is broad agreement that the re-escalation of the Iran/Gulf conflict — the collapse of the Trump-brokered Versailles ceasefire around July 8-16, 2026, renewed US strikes on roughly 95 locations across 12 Iranian cities, and Houthi attacks on Saudi tankers and Red Sea shipping — is this period's dominant geopolitical driver of markets. T. Rowe Price, UBS, RBC's Helima Croft, Deutsche Bank and BNP Paribas all cite Brent's climb from the ~$80s to above $100/bbl and the 10-year US Treasury yield's spike to ~4.7% (highest since January 2025) as the direct transmission channels; RBC notes seven-day average Hormuz traffic has fallen to 3.9mb/d with the IMO declaring the Strait too dangerous to cross, while Wood Mackenzie's vessel-tracking shows Gulf-wide seaborne crude exports down 82% since January, with Iraq, Kuwait and Qatar at zero. There is equal consensus that central banks now face a genuine look-through-versus-second-round-effects tradeoff from the energy shock: Goldman's David Mericle, and the BoE's Bailey, Taylor, Breeden and Greene, alongside BNP Paribas and BNY on the ECB's Lagarde, all describe holding rates while monitoring wage/price pass-through rather than reacting to the first-round inflation impulse. Sources also broadly agree the Trump administration is using tariffs as a durable geopolitical instrument rather than a temporary emergency measure: after the Supreme Court struck down IEEPA tariffs (February 20, 2026) and Section 122 tariffs lapsed (July 24), the administration rotated to Section 338 (50% tariffs on Canadian dairy/alcohol/autos), Section 301 forced-labor tariffs on 60 economies (including a stack on Brazil toward ~37.5%), and ongoing Section 232 actions — documented by UBS, Brookings' trade tracker, and PIIE's de Bolle, Wolff and Hufbauer. Finally, several flagship pieces (Bridgewater's Karniol-Tambour and Jensen, KKR's McVey, PIIE's Wolff, Brookings' Kagan) converge on a shared framing that the world is fragmenting into a more mercantilist, multipolar order with widening chokepoint risk (Hormuz, Bab al-Mandab, the Baltic 'shadow fleet') and reshuffled, still China-linked supply chains, as documented in the Federal Reserve's Vietnam note.", "divergence": "The sharpest split is over where the Iran/Gulf conflict goes from here and what that implies for policy. UBS, Goldman Sachs and BNY argue for de-escalation or at least a 'muddling through' base case: UBS expects Hormuz flows to gradually recover and the Fed's next move to be a cut toward ~3% neutral rather than a hike; Goldman's Mericle sees the Fed on hold through 2026 with only a ~25% chance of a further hike, well below the market's implied ~50%; BNY explicitly frames its base case as 'muddling through' given improved global energy-management flexibility versus the 2022 Russia shock. Against this, RBC's Helima Croft, Wood Mackenzie and Oxford Economics argue the conflict is structurally worsening rather than resolving: Croft warns Brent could still breach the 2022 peak of $128/bbl or even the 2008 high of $146/bbl in a full regional war; Wood Mackenzie's tracking shows Gulf exports already down 82% with Iraq, Kuwait and Qatar at zero seaborne exports and warns a Houthi Bab al-Mandeb blockade would turn Yanbu into 'a shift from one strategic bottleneck to another'; Oxford Economics now expects a 'more drawn-out' conflict with a long-term reduction in Hormuz shipping rather than a temporary shock. This same escalation-versus-de-escalation split resurfaces in the debate over US global standing: PIIE's Alan Wm. Wolff argues American hegemonic decline is real and self-inflicted, drawing an Athens/Delian-League parallel and citing strains with Canada, Greenland, China and Iran as evidence that 'decline appears to be a choice,' whereas Brookings' Robert Kagan counters that this is a 'radical break' rather than gradual decline, that China is 'sitting pretty' rather than rushing to fill the Gulf vacuum, and that the more likely outcome is a genuine multipolar order (adding Japan and Germany as great powers) rather than either American or Chinese hegemony; Brookings' Brent Christensen pushes back further still, arguing the US-Taiwan relationship is 'stronger than the headlines suggest' given record security cooperation and TSMC's $265 billion Arizona buildout. On tariffs specifically, UBS's house view is that the effective US tariff rate settles into a low-impact 10-15% range with 'limited broad market impact,' while PIIE's Wolff and de Bolle argue the forced-labor tariffs are a legally fragile pretext likely to be struck down by the Supreme Court just as IEEPA was, and, per Hufbauer, will still raise consumer prices into the November 2026 midterms in the meantime.", "items": [{"source": "t_rowe_price", "name": "T. Rowe Price", "thesis": "Weekly recap: Nasdaq -2.13% (worst major index) on AI-capex jitters post-Alphabet/Tesla earnings; 10-year UST briefly topped 4.7% (highest since Jan 2025) on Iran-war oil fears. US flash composite PMI hit an 8-month high of 53.6. ECB held rates but Lagarde flagged the Iran-driven energy shock and left a September hike possible; Japan's 10-year JGB yield rose to 2.80% and the yen weakened toward JPY 164 (40-year low).", "url": "https://www.troweprice.com/en/us/insights/global-markets-weekly-update", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "thesis": "Western Asset flags a tightening 2026 midterm landscape: Senate Republicans hold ~51-47, and a record 58 House incumbents (36 Republicans) aren't seeking re-election. Trump's approval has slipped to 33-37% amid Iran-driven energy/inflation pressure. Argues investors should weight a divided-government scenario, raising the relative importance of executive-controlled policy (trade, tariffs, sanctions) versus congressionally-dependent themes.", "url": "https://www.franklintempleton.com/articles/2026/western-asset/us-midterm-elections-interpreting-the-early-signs", "images": []}, {"source": "kkr", "name": "KKR", "thesis": "McVey frames 2026 as a 'Divergence Conundrum': a persisting global productivity boom coexists with intensifying geopolitical/economic fragmentation. KKR is above-consensus on US growth and inflation, expects the Fed's easing cycle to keep fading, sees the oil futures curve underpricing geopolitical risk premium, and believes the dollar has peaked without a disorderly unwind.", "url": "https://www.kkr.com/insights/mid-year-update-2026", "images": []}, {"source": "bridgewater", "name": "Bridgewater Associates", "thesis": "Co-CIO Karen Karniol-Tambour said 'modern mercantilism' — every country spending to close vulnerabilities — is a structural, inflationary force; most investors are overweight US equities and underweight real assets, poorly positioned for the environment ahead.", "url": "https://www.bridgewater.com/research-and-insights/karen-karniol-tambour-on-investing-in-a-more-fragmented-world", "images": []}, {"source": "bridgewater", "name": "Bridgewater Associates", "thesis": "Co-CIO Greg Jensen said AI compute demand now outpaces supply in ways that will require rationing, describing an inflection point in software disruption alongside an accelerating geopolitical resource grab tied to modern mercantilism and the weaponization of strategic chokepoints.", "url": "https://www.bridgewater.com/research-and-insights/two-resource-grabs-reshaping-markets-modern-mercantilism-and-ai", "images": []}, {"source": "deutsche_bank", "name": "Deutsche Bank", "thesis": "Houthi attacks on Saudi tankers in the Red Sea/Bab al-Mandab expose a second chokepoint beyond Hormuz; Brent has risen from ~$80 to ~$100/bbl. Base case is that Gulf flows recover, but sustained higher oil would revive inflation/rate-hike risk and could trigger rotation toward US large-cap IT, healthcare, utilities, energy producers, away from Europe and energy-intensive cyclicals.", "url": "https://wealth.db.com/en/insights/investing-insights/investing-themes/red-sea-disruptions-increasing-risks-for-energy-markets.html", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas", "thesis": "Fed Chair Warsh's removal of forward guidance has pushed market-implied neutral-rate pricing to 3.5-4.0% vs. the FOMC's own 3.0%. Eurozone Q2 GDP grew just 0.1% q/q; UK gilts remain exposed to fiscal-rule talks amid a seventh PM in ten years (Burnham succeeding Starmer) and renewed Middle East energy risk, with the BoE now holding rather than hiking.", "url": "https://www.bnpparibas-am.com/en/portfolio-perspectives/global-sovereign-bonds-watching-the-new-fed-chair/", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "UBS details the administration's evolving tariff strategy post-Supreme Court IEEPA ruling: new 50% Section 338 tariffs on Canadian goods, a broader ~10-12.5% Section 301 tariff on 60 countries tied to forced-labor allegations. House view: US effective tariff rate stays 10-15%, implying limited broad market impact though individual sectors could be hit hard.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-21072026.html", "images": []}, {"source": "rbc", "name": "RBC Capital Markets", "thesis": "Helima Croft argues data centers have become a strategic Iran-war battleground: five confirmed attacks on Gulf data centers. Houthi entry into the Red Sea has pushed Brent up 30%+ since July 1; RBC warns oil could breach the 2022 peak of $128/bbl or even the 2008 high of $146/bbl in a worst-case full regional conflict.", "url": "https://www.rbccm.com/en/insights/2026/07/data-centers-become-the-new-battleground-in-iran-war", "images": []}, {"source": "rbc", "name": "RBC Capital Markets", "thesis": "The Trump-brokered Versailles ceasefire has collapsed; seven-day average Hormuz traffic has fallen to 3.9mb/d and the IMO has declared the Strait too dangerous for commercial crossings. Cushing sits at operational minimums and the US SPR is at 43-year lows.", "url": "https://www.rbccm.com/en/insights/2026/07/energy-market-risks-reignited-after-iran-ceasefire-collapses", "images": []}, {"source": "federal_reserve", "name": "Federal Reserve", "thesis": "A Fed international-finance note finds Chinese-owned firms captured a disproportionate share of Vietnam's export boom to the US post-2018-19 tariffs: Chinese FDI firms' share rose from 11% to 25% while domestic Vietnamese firms' share fell from 33% to 23%, suggesting US tariffs aimed at reducing China dependence may be less effective than bilateral data suggests.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/vietnams-export-boom-to-the-u-s-the-role-of-Chinese-firms-20260717.html", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "Governor Bailey addresses the Hormuz/Iran oil-and-gas shock: UK inflation was on track for the 2% target before the conflict, but April CPI printed 2.8% (0.8pp energy-driven upside surprise). He confirms the MPC's hold at 3.75% was an 'active choice,' looking through direct energy-shock effects but signaling a forceful response to second-round wage-price effects.", "url": "https://www.bankofengland.co.uk/speech/2026/may/andrew-bailey-speech-at-the-reykjavik-2026-economic-conference", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "The Senate's combined CLARITY Act text merges the Agriculture and Banking committees' bills. Seven negotiating Democrats said the draft 'falls short'; Elizabeth Warren called it 'dead on arrival.' Galaxy cut its 2026 passage odds to 30%, down from a 50/50 coin flip in late June.", "url": "https://www.galaxy.com/insights/research/clarity-act-30-percent-odds", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "Bitcoin broke above $66,000 after Treasury Secretary Bessent called CLARITY at the 'one-yard line,' then reversed to $65,500 after Senate Democrats said the draft 'falls short.' The Iran conflict resumed, sending Brent up more than $14 over the week to break $100.", "url": "https://coinshares.com/insights/research-data/market-update-24-07-2026/", "images": []}, {"source": "brookings", "name": "Brookings Institution", "thesis": "Brookings' updated trade tracker shows US tariff policy in sustained volatility since 2018: the Supreme Court's February 20, 2026 ruling invalidating IEEPA tariffs forced the administration to rotate through Section 201, 301, 232 and 122 authorities.", "url": "https://www.brookings.edu/articles/tracking-trade-amid-uncertain-and-changing-tariff-policies/", "images": []}, {"source": "peterson_institute", "name": "Peterson Institute for International Economics", "thesis": "Monica de Bolle argues the USTR's 25% Section 301 tariff on Brazil reveals weak US trade leverage: exemptions covering ~44% of Brazilian exports plus another 13% already under Section 232 duties mean two of every three Brazilian export dollars escape the new tariff, despite the US running a $14.4bn trade surplus with Brazil.", "url": "https://www.piie.com/blogs/realtime-economics/2026/trumps-new-tariffs-brazil-reflect-weakness-us-trade-strategy", "images": []}, {"source": "peterson_institute", "name": "Peterson Institute for International Economics", "thesis": "Alan Wm. Wolff draws an extended parallel between declining Athenian hegemony and the US today, listing current strains — Canada, Greenland, China export controls/tariffs, and the Iran war — while China, Russia and North Korea pledge closer alignment; concludes US hegemonic decline looks like a choice rather than an external defeat.", "url": "https://www.piie.com/blogs/realtime-economics/2026/end-americas-hegemony", "images": []}, {"source": "brookings", "name": "Brookings Institution", "thesis": "Historian Robert Kagan argues America's world role is undergoing a 'radical break,' not incremental decline. He argues China is 'sitting pretty,' not rushing to fill the Gulf vacuum, and expects a genuine multipolar world (adding Japan and likely Germany) rather than either US or Chinese hegemony.", "url": "https://www.brookings.edu/articles/will-china-replace-america-on-the-world-stage/", "images": []}, {"source": "brookings", "name": "Brookings Institution", "thesis": "Former AIT director Brent Christensen argues the US-Taiwan relationship is stronger than eroding-confidence polling suggests: record security cooperation, Taiwan's rise to the US's fourth-largest trading partner on AI-driven semiconductor demand, and TSMC's $265bn Arizona investment.", "url": "https://www.brookings.edu/articles/the-us-taiwan-relationship-is-stronger-than-the-headlines-suggest/", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "thesis": "Vessel-tracking data shows Saudi Arabia's Red Sea crude bypass peaked at ~4.07mb/d in March 2026 but fell 41% to ~2.39mb/d by June; Gulf-wide crude exports fell 82% January-June, with Iraq, Kuwait and Qatar recording zero seaborne exports since the Hormuz closure.", "url": "https://www.woodmac.com/press-releases/saudi-arabias-red-sea-crude-bypass-peaks-in-march-and-declines-41-by-june/", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "Now expects a more drawn-out Middle East conflict with a long-term reduction in Strait of Hormuz shipping, driving supply-chain stress concentrated in Asia.", "url": "https://www.oxfordeconomics.com/resource/middle-east-flare-up-to-boost-supply-chain-stress/", "images": []}, {"source": "peterson_institute", "name": "Peterson Institute for International Economics", "thesis": "Cullen Hendrix estimates a newly arrived 'Super' El Niño will cause ~$686bn in year-one global GDP losses and up to $3.1 trillion over five years, concentrated in 51 lower/middle-income tropical countries, compounding a food-price risk alongside the Strait of Hormuz's fertilizer disruption.", "url": "https://www.piie.com/blogs/realtime-economics/2026/el-nino-could-drag-down-global-economy-almost-700-billion-or-3", "images": []}, {"source": "peterson_institute", "name": "Peterson Institute for International Economics", "thesis": "Gary Hufbauer reports Trump ordered new 50% tariffs on select Canadian alcohol, dairy and auto imports by invoking Section 338 of the 1930 Tariff Act for the first time, overriding the 2020 USMCA's zero-tariff commitments.", "url": "https://www.piie.com/blogs/realtime-economics/2026/trumps-new-50-percent-tariffs-canada-and-others-train-will-likely", "images": []}, {"source": "ned_davis_research", "name": "Ned Davis Research", "thesis": "NDR finds the S&P 500 has diverged from its typical midterm-election-year seasonal pattern this spring, driven by the Iran conflict, surging AI-related capex and prospects for a new Fed chair rather than the election itself.", "url": "https://info.ndr.com/ndr-signals/iran-pushed-the-sp-500-off-typical-midterm-course?hsLang=en", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Notes the Gulf and Ukraine wars have driven a US oil-and-gas boom even as US consumers pay roughly double Trump's target gasoline price, raising the risk of export controls ahead of the midterms.", "url": "https://research.gavekal.com/teaser/geoeconomic-monitor-dominance-and-decline/", "images": []}]}, {"theme": "AI & Tech", "category": ["ai_tech"], "consensus": "Across asset managers, banks and central banks there is broad agreement that AI capex is now a first-order macro and market variable, and that most of the current cycle still reflects genuine spending/earnings rather than pure multiple expansion. Capital Economics estimates AI-related activity directly or indirectly accounts for more than half of China's quarter-on-quarter GDP growth in Q2 2026 and roughly one-third of US growth over the past year; the Federal Reserve's July 17, 2026 staff note similarly finds AI-related investment (software, data centers, computer equipment) has contributed meaningfully to US GDP growth from 2025 through Q1 2026, while aggregate labor productivity has not yet diverged between high-AI-exposure sectors and low-exposure sectors — leading Fed staff to conclude the economy is still in an 'investment-led buildout phase' rather than broad-based labor displacement. On capex scale, sources converge on comparable trillion-dollar-plus figures: Goldman's Peter Oppenheimer projects hyperscaler capex of about $755 billion in 2026 and $920 billion in 2027; PIMCO's Lotfi Karoui estimates roughly $1.6 trillion of hyperscaler capex for 2026-27, increasingly debt-funded; Deutsche Bank's Dirk Steffen and UBS both cite spending 'approaching $1 trillion' in the near term; Goldman's Brian Garrett estimates $5.5-6 trillion of capex financing needed 2025-2030; and BoE Deputy Governor Sarah Breeden cites AI firms expected to invest over $5 trillion over the next five years. On jobs, Vanguard's Adam Schickling, Fed staff, and Gavekal Research independently converge on the same finding: nearly four years after ChatGPT's launch, occupations most exposed to AI have not shown outsized aggregate employment declines, with effects so far limited to softer entry-level/junior hiring rather than layoffs.", "divergence": "The sharpest fault line is whether the AI capex boom is a justified, self-funding investment supercycle or an increasingly debt-fueled bubble vulnerable to a sharp unwind. On the 'justified' side: Goldman Sachs CEO David Solomon told CNBC (July 16) that Q2 net revenue rose 39% YoY and earnings 78% YoY on an AI-and-capital-formation 'supercycle' he calls 'early innings, not a bubble,' backed by $9 trillion sitting in US money-market funds. Goldman's Oppenheimer argues markets have entered a 'post-modern cycle' rewarding capital-intensive 'HALO' businesses on fundamentals, not multiple expansion. Putnam's Shep Perkins notes S&P 500 consensus EPS rose from about $265 to about $340 (+30%) over the past year even as the forward P/E multiple contracted — evidence of earnings-driven, not speculative, gains. BNP Paribas' Daniel Morris and Nadia Grant characterize the July EM tech/semiconductor sell-off (Korea's index down 15.6% from a +250% YTD peak) as technical profit-taking, not a bubble bursting, since forward earnings estimates stayed steady. On the 'bubble/overbuild' side: Vanguard is explicitly cautious, noting the 'Magnificent Seven' fell about 1% in H1 2026 (versus the S&P 500's +9%) and nearly 9% in June alone, continuing to prefer US value and non-US developed equities over the Magnificent Seven given 'stretched valuations.' BoE Deputy Governor Sarah Breeden warns that AI infrastructure investment is now financed by 'rapidly growing and more complex debt' rather than mostly cash flow and equity as before, meaning 'the financial stability consequences of any fall in AI-related asset prices could well increase.' Man Group flags 'mini-cycles of AI boom/bust' and warns hedge funds' elevated gross/net exposure leaves them 'vulnerable to a consolidation shock if the AI/tech trend reverses.' PIMCO's Karoui flags that financial-engineering excess (leveraged ETFs, CLOs referencing illiquid assets) is 're-emerging in ways that increase interconnectedness, echoing pre-GFC dynamics.' And Capital Economics — 'among the most bullish forecasters on US equities for three years' — has now turned more cautious, arguing 'the AI-driven US tech rally is far more advanced than the macro benefit cycle.' Amundi captures the pivot point directly: it sees the AI ecosystem shifting from 'buildout euphoria to monetization scrutiny,' with pressure likely to fall hardest on capex-heavy hyperscalers rather than infrastructure suppliers with pricing power.", "items": [{"source": "t_rowe_price", "name": "T. Rowe Price", "thesis": "T. Rowe Price's Wenli Zheng and Bill Bai argue China is building a parallel, cost-efficient open-source AI ecosystem (DeepSeek, Moonshot, MiniMax, Zhipu) rather than converging with US frontier labs, and see the most immediate investment opportunities in AI infrastructure suppliers where Chinese manufacturers hold meaningful global share, rather than in picking model winners.", "url": "https://www.troweprice.com/en/us/insights/ai-in-china-parallel-ecosystems-and-commercialization", "images": []}, {"source": "vanguard", "name": "Vanguard", "thesis": "Vanguard's Adam Schickling argues AI's labor impact today resembles the 1980s ATM era (stable employment) rather than 2010s mobile banking (job cuts). Separately, the 'Magnificent Seven' fell ~1% in H1 2026 (S&P 500 +9%) and ~9% in June alone, its worst month in over a year, as a ~45-company global 'AI complex' ex-hyperscalers returned ~100% in H1; Vanguard prefers US value and non-US developed equities over the Magnificent Seven given stretched valuations.", "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/vemo/ai-jobs-atm-phase.html", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "thesis": "Putnam's Shep Perkins argues equities are being driven by genuine earnings growth: S&P 500 consensus EPS rose from ~$265 to ~$340 (+30%) over the past year as the index rose from ~6,000 to 7,400+ while the forward P/E actually contracted. He warns rising capital intensity and semiconductor cyclicality make companies harder to value, drawing a parallel to the 1990s boom.", "url": "https://www.franklintempleton.com/articles/2026/putnam/the-price-of-admission-further-equity-upside-comes-with-a-cost-volatility", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "PIMCO's Lotfi Karoui estimates roughly $1.6 trillion of hyperscaler capex for 2026-27, increasingly debt-funded — a positive demand shock keeping real yields higher for longer. He also flags financial-engineering excess (leveraged ETFs, CLOs on illiquid assets) re-emerging in ways that echo pre-GFC dynamics, and recommends rotating ~90/10 equity-heavy portfolios back toward 60/40 given 10-year yields near 4.5%.", "url": "https://www.pimco.com/us/en/insights/podcasts/accrued-interest/lotfi-karoui-on-private-credit-and-the-ai-capex-supercycle", "images": []}, {"source": "man_group", "name": "Man Group", "thesis": "Man Group's Q3 2026 outlook expects continued mini-cycles of AI boom/bust, downgrading Equity Market Neutral on crowded factor exposure and high leverage, while upgrading Event-Driven Special Situations on a wave of large IPOs. It warns the industry's strong H1 has left gross/net exposures elevated, leaving funds vulnerable to a consolidation shock if the AI/tech trend reverses.", "url": "https://www.man.com/insights/the-early-view-july-2026", "images": []}, {"source": "amundi", "name": "Amundi", "thesis": "Amundi's H2 2026 hedge fund outlook says capex-led growth (AI, power, grids, defense) is narrowing leadership and widening K-shaped dispersion. It frames H2 as a shift from AI 'buildout euphoria to monetization scrutiny,' with pressure likely to fall hardest on capex-heavy hyperscalers rather than infrastructure suppliers with pricing power.", "url": "https://research-center.amundi.com/article/hedge-fund-outlook-h2-2026", "images": []}, {"source": "bridgewater", "name": "Bridgewater Associates", "thesis": "Bridgewater Co-CIO Greg Jensen said AI compute demand is now outpacing supply in ways that will require rationing, describing an inflection point in software disruption alongside an accelerating geopolitical resource grab tied to modern mercantilism.", "url": "https://www.bridgewater.com/research-and-insights/two-resource-grabs-reshaping-markets-modern-mercantilism-and-ai", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Goldman's Vincent Lin says hedge funds remain fundamentally bullish on AI despite the sharpest tech de-grossing in the prime book's history: the high-beta momentum basket fell 32% from highs. He calls the unwind a 'healthy reset,' not a loss of conviction, and recommends buying the dip in US AI infrastructure equipment names via call spreads.", "url": "https://www.goldmansachs.com/insights/the-markets/are-hedge-funds-still-bullish-on-ai-stocks", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Goldman CEO David Solomon told CNBC Q2 net revenue rose 39% YoY and earnings 78% YoY, driven by an AI-and-capital-formation supercycle he calls 'early innings, not a bubble,' even while acknowledging possible 'dislocations.' He noted financing demand outstrips supply and $9 trillion sits in US money-market funds available to fund further AI capex.", "url": "https://www.goldmansachs.com/insights/videos/cnbc-david-solomon-2q-earnings-deal-making-and-ai-investment", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Goldman's Peter Oppenheimer argues markets have entered a 'post-modern cycle' rewarding capital-intensive, tangible-asset ('HALO') businesses over the asset-light tech model, driven by higher rates, rising government debt and geopolitical fragmentation. The biggest AI providers are projected to spend ~$755 billion on capex in 2026 and ~$920 billion in 2027.", "url": "https://www.goldmansachs.com/insights/articles/what-the-capex-boom-means-for-stock-investors", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Goldman's Brian Garrett notes hyperscalers' AI-driven credit issuance ($5.5-6 trillion of capex financing needed 2025-2030) is starting to widen spreads, with Goldman's hyperscaler bond basket widening 22bp in a single week on size and sector-concentration concerns.", "url": "https://www.goldmansachs.com/insights/the-markets/how-earnings-volatility-and-ai-capex-are-affecting-us-markets", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "UBS attributes the Samsung (-8.8%) and SK Hynix (-11.5%) sell-off, which dragged the Philadelphia Semiconductor Index down ~15%, mainly to Korean regulatory action against leveraged ETFs. It remains constructive on semiconductors given TSMC's +77% YoY profit and ASML's beat-and-raise, expecting overall AI spending to approach $1 trillion in 2027.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-16072026.html", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "BoE Deputy Governor Sarah Breeden warns that stretched valuations in AI-linked US tech are one of three financial-stability vulnerabilities that could crystallise together, noting AI firms are expected to invest over $5 trillion over the next five years, increasingly financed by debt across public markets, leveraged finance and private credit rather than mostly equity and cash.", "url": "https://www.bankofengland.co.uk/speech/2026/april/sarah-breeden-at-the-program-on-international-financial-systems-and-harvard-law-school", "images": []}, {"source": "federal_reserve", "name": "Federal Reserve", "thesis": "Fed Board staff propose a public dashboard tracking the generative-AI buildout, finding AI-related investment components contributed meaningfully to US GDP growth from 2025 through Q1 2026, firm-level adoption is trending up (skewed to larger firms), but aggregate labor productivity has not yet diverged between high- and low-AI-exposure sectors.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/the-ai-buildout-and-the-economy-publicly-available-data-to-assess-ais-impact-20260717.html", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "thesis": "Wood Mackenzie's Q1 2026 tracking shows US data-centre developers prioritizing existing pipelines as new capacity growth slows: 36 GW added in Q1 2026, down 19% q/q; cumulative disclosed capacity totals 331 GW; disclosed project capex broke $1 trillion in Q1 2026, with PJM flagged as most at risk of demand outrunning generation supply.", "url": "https://www.woodmac.com/news/opinion/us-data-centre-developers-prioritise-existing-project-pipelines-as-new-pipeline-capacity-grows/", "images": []}, {"source": "capital_economics", "name": "Capital Economics", "thesis": "Capital Economics estimates AI-related activity accounts for more than half of China's Q2 2026 QoQ GDP growth and roughly one-third of US growth over the past year. Having been among the most bullish US equity forecasters for three years, the firm is now turning more cautious, arguing the AI-driven US tech rally is far more advanced than the macro benefit cycle.", "url": "https://www.capitaleconomics.com/blog/ai-now-key-driver-growth-both-us-and-china", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Gavekal notes China's government under Xi is treating AI purely as a growth engine and not preparing for mass white-collar job losses, arguing this stance is analytically correct so far since most research finds no aggregate US labor-market impact from AI beyond softer demand for entry-level and software-engineering roles.", "url": "https://research.gavekal.com/teaser/how-china-is-handling-ais-risk-to-jobs/", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas", "thesis": "BNP Paribas AM's Daniel Morris argues the 15.6% drop in EM tech hardware/semiconductor stocks is a technical reset, not an AI bubble bursting: US hardware/semis fell only 5.8% from highs (still +36% YTD), and forward earnings estimates stayed steady.", "url": "https://viewpoint.bnpparibas-am.com/view-from-the-markets-whats-the-meaning-of-the-emerging-market-tech-stock-sell-off/", "images": []}, {"source": "kpmg", "name": "KPMG", "thesis": "KPMG survey research finds only 14% of organizations consider themselves AI top-performers despite accelerating investment, pointing to an execution/orchestration gap.", "url": "https://kpmg.com/xx/en/our-insights/transformation/your-ai-is-working.html", "images": []}]}, {"theme": "Emerging Markets", "category": ["em"], "consensus": "Across asset managers and banks there is broad agreement that EM assets have re-rated on strong earnings and AI-supply-chain exposure while remaining cheap and under-owned. Franklin Templeton's Templeton Global Investments team forecasts about 50% 2026 EM earnings growth (roughly double the US) and near-40% annualized two-year EPS growth, yet EM equities trade at a 38% P/E discount to developed markets and are only 5.8% of global investor allocations versus a 12% MSCI ACWI weight (down from 13% in 2010). Goldman Sachs Asset Management's Katherine Bordlemay (July 8, 2026) similarly notes EM equities have returned more than double the S&P 500 over 18 months on 55% expected 2026 earnings growth, a 40%+ valuation discount, nearly $50 billion of YTD inflows (the most in two decades), and EM's ~80% share of global AI hardware exports. BNY's July 23 recap of client flows confirms this structurally, showing EM assets under custody growing three times faster than developed markets in Q1 2026. KKR's Henry McVey stays structurally bullish on Asia outperformance and believes the dollar has peaked. On the debt side, BNP Paribas AM (Alaa Bushehri) and Schroders both call local-currency EM debt an under-owned, high-conviction position on attractive real yields and undervalued currencies, even as tightened hard-currency spreads push both toward selective, country-specific exposure rather than broad beta.", "divergence": "The sharpest split is between the structural EM-bull consensus and a more cautious reading of China-specific and tariff-related fragility beneath that headline strength. Bulls such as Franklin Templeton, Goldman Sachs, UBS (Alejo Czerwonko) and KKR frame 2026 as a durable re-rating: Korea and Taiwan are up roughly 80% and 60% in USD over the past year and now near 50% of EM market cap on AI/semiconductor demand, Latin America has returned about 75% over 18 months on commodities, and UBS has upgraded India to Attractive alongside China as 2026 laggards (each down about 10% YTD) worth adding to. Gavekal Research takes the opposing, China-specific view: Q2 GDP growth slowed to 4.3% (officially blamed on the oil shock and external shocks), domestic EV sales are set for their first-ever annual decline of about 7% in 2026 as BYD and Tesla lose share to subsidized rivals, and despite coordinated state-institution stock purchases this week, Gavekal's Andrew Batson judges a major stimulus 'pivot' akin to September 2024 remains unlikely because Beijing still expects the Strait of Hormuz disruption to prove temporary — implying policy support markets are pricing in may not materialize. A second, related disagreement concerns whether the July EM-tech sell-off was healthy or a warning sign: BNP Paribas' Daniel Morris argues the 15.6% drop in EM tech hardware/semiconductor stocks (Korea's index had been up over 250% YTD, now 'just' 85%) was technical profit-taking by foreign investors rather than an AI-bubble bursting, citing steady forward-earnings estimates and forward P/Es (11.3x semis vs. a 13.9x long-run average) that argue against excess; UBS's Czerwonko, while still constructive on fundamentals, flags rising volatility from Korean retail leveraged-ETF usage as a genuine risk factor. A third front is tariff exposure: PIIE's Monica de Bolle argues the US's 25% Section 301 tariff on Brazil (effective July 22) plus a pending forced-labor action that could push the combined rate toward roughly 37.5% reveals real, escalating US trade risk to EM economies even as exemptions cover two-thirds of Brazilian exports, while BNP Paribas separately notes a growing split within EM debt between oil-exporting beneficiaries (GCC) and vulnerable oil-importers like India and Turkey now facing delayed Fed cuts and higher import bills — complicating the simple 'EM is structurally underweight, therefore buy' thesis with country-level dispersion.", "items": [{"source": "franklin_templeton", "name": "Franklin Templeton", "thesis": "Templeton Global Investments argues EM has structurally shifted from old-economy sectors (now 15% of the EM index, down from a third fifteen years ago) to new-economy sectors (64%), forecasts about 50% 2026 EM earnings growth (double the US) and near-40% two-year annualized EPS growth, yet EM trades at a 38% P/E discount to developed markets while investors remain underweight at 5.8% of global allocations versus a 12% MSCI ACWI weight.", "url": "https://www.franklintempleton.com/articles/2026/equity/why-now-emerging-markets", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Goldman Sachs Asset Management's Katherine Bordlemay says EM equities have returned more than double the S&P 500 over 18 months on 55% expected 2026 earnings growth (versus a 40%+ valuation discount to the US), with nearly $50 billion of YTD inflows (most in two decades) and EM economies accounting for ~80% of global AI hardware exports positioning further outperformance.", "url": "https://www.goldmansachs.com/insights/videos/emerging-market-stocks-may-climb-higher-amid-boost-from-ai", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "UBS EM CIO Alejo Czerwonko notes Korea and Taiwan are up ~80% and ~60% in USD over the past year and now nearly 50% of EM market cap on semiconductor exposure, with Latin America up ~75% over 18 months on commodities; he flags rising volatility from Korean retail leveraged-ETF activity and recommends staying in North Asia while adding to 2026 laggards India and China, both down ~10% YTD.", "url": "https://www.ubs.com/us/en/wealth-management/insights/ubs-studios/2026/have-emerging-markets-become-an-ai-trade.html", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "UBS's July 17 Daily house view sees ~10% 12-month upside for the MSCI ACWI on broad earnings strength, forecasts 72% 2026/20% 2027 profit growth for MSCI Asia ex-Japan, and has upgraded India (alongside Eurozone equities) to Attractive while continuing to favor Japan, China, and select Southeast Asian markets.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-17072026.html", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas", "thesis": "BNP Paribas AM's Alaa Bushehri says EM debt showed resilience in Q2 2026 despite the Middle East conflict, with a growing divide between oil-exporting beneficiaries (GCC) and oil-importers like India and Turkey facing higher inflation. With Fed-cut pricing shifting from two cuts to zero or hikes, some EM central banks are delaying easing into 2027; BNP stays constructive on local-currency EM debt for its real yields and undervalued currencies but favors selective country exposure over hard-currency beta.", "url": "https://www.bnpparibas-am.com/en-us/portfolio-perspectives/emerging-market-debt-established-resilience/", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas", "thesis": "BNP Paribas AM's Daniel Morris argues the 15.6% sell-off in EM tech hardware/semiconductor stocks (Korea's index had been up over 250% YTD, now ~85%) is technical profit-taking rather than an AI-bubble bursting: US hardware/semis fell only 5.8% (still +36% YTD), Korean local retail and US-domiciled ETFs kept buying while foreign investors rebalanced, forward earnings estimates stayed steady, and valuations (11.3x forward P/E for EM tech hardware vs. a 13.9x long-run average) do not look excessive.", "url": "https://www.bnpparibas-am.com/en/front-of-mind/view-from-the-markets-whats-the-meaning-of-the-emerging-market-tech-stock-sell-off/", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas", "thesis": "BNP Paribas AM's Q3 2026 Global Fixed Income Outlook favors carry over duration across euro IG, US agency MBS and European high yield, with EM debt (Alaa Bushehri) prioritizing durable-fundamental markets with credible policy and attractive real yields over broad beta given the split between energy-exporting beneficiaries and import-dependent economies hurt by the energy shock.", "url": "https://viewpoint.bnpparibas-am.com/global-fixed-income-outlook-q3-2026-bonds-keep-calm-and-carry-on/", "images": []}, {"source": "schroders", "name": "Schroders", "thesis": "Schroders' US Multi-Sector Fixed Income team sees today's higher starting yields (Bloomberg Agg ~4.75%) as one of the best entry points in a decade, holds a low, defensive corporate-credit allocation given ~$1.2 trillion of expected 2026 IG issuance (30% ahead of 2025), and favors hyperscaler/data-center IG, agency MBS, structured municipals, and emerging-market debt, which it views as under-owned and positioned to benefit from potential dollar weakness.", "url": "https://www.schroders.com/en-us/us/individual/insights/fixed-income-markets-now-demand-a-mix-of-tactical-offense-and-resilient-defense/", "images": []}, {"source": "schroders", "name": "Schroders", "thesis": "Schroders' Global Fixed Income team has shifted its scenario probabilities more hawkish (its 'too cold' case now implies only one-plus Fed cuts, versus three to four previously) but stays moderately constructive on duration overall, and sees selective value in emerging-market government bonds such as Hungary, where investors look past near-term political risk to a supportive longer-term credit story.", "url": "https://www.schroders.com/en-us/us/individual/insights/reading-between-the-lines-are-rate-fears-overdone-for-bonds-/", "images": []}, {"source": "kkr", "name": "KKR", "thesis": "KKR's Mid-Year Outlook (Henry McVey) frames 2026 as a 'Divergence Conundrum' of productivity boom amid geopolitical fragmentation, staying above-consensus on US growth/inflation, expecting the Fed's easing cycle to keep fading, believing the dollar has peaked without a disorderly unwind, and maintaining conviction that Asia outperforms across public and private markets.", "url": "https://www.kkr.com/insights/mid-year-update-2026", "images": []}, {"source": "bny", "name": "BNY", "thesis": "BNY's recap of a client webinar notes US bonds still comprise over 70% of global fixed-income holdings under custody (a concentration risk) alongside growing flows into EM energy/commodity equities, Korean and Taiwanese AI-oriented stocks, and Latin American fixed income/FX; EM assets under custody grew three times faster than developed markets in Q1 2026, though BNY cautions EM investing still requires careful FX execution, settlement and liquidity management.", "url": "https://www.bny.com/corporate/global/en/insights/dissecting-international-investment-trends-during-volatile-times.html", "images": []}, {"source": "t_rowe_price", "name": "T. Rowe Price", "thesis": "T. Rowe Price's Wenli Zheng and Bill Bai argue China is building a parallel, cost-efficient open-source AI ecosystem (DeepSeek, Moonshot, MiniMax, Zhipu) competing alongside rather than converging with US frontier labs, and see the most immediate investment opportunities in Chinese infrastructure suppliers (semiconductors, optical components, PCBs, power systems) rather than in picking individual AI model winners.", "url": "https://www.troweprice.com/en/us/insights/ai-in-china-parallel-ecosystems-and-commercialization", "images": []}, {"source": "rbc", "name": "RBC Capital Markets", "thesis": "RBC's Tom Narayan says Chinese OEMs held 65% of China's domestic EV market in 2025, on track for 80% by 2030, and are localizing production in Hungary, Turkey, Spain and Austria to get around EU tariffs; a 100% US tariff blocks near-term entry, but he estimates Chinese OEMs could eventually capture 20-25% of the US market given openness among younger consumers.", "url": "https://www.rbccm.com/en/insights/2026/07/how-chinas-ev-strategy-is-reshaping-the-global-auto-industry", "images": []}, {"source": "federal_reserve", "name": "Federal Reserve", "thesis": "A Federal Reserve note finds Chinese-owned firms' share of Vietnam's exports to the US rose from 11% (2018-19) to 25% (2020-23) as domestic Vietnamese firms' share fell from 33% to 23%, with the number of Chinese-owned firms in Vietnam up 122.5% (1,287 to 2,864); the authors conclude US tariffs aimed at reducing China dependence may be less effective than bilateral trade data suggest since supply chains remain tied to China even as production relocates to Vietnam.", "url": "h
