ttps://www.federalreserve.gov/econres/notes/feds-notes/vietnams-export-boom-to-the-u-s-the-role-of-Chinese-firms-20260717.html", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Gavekal's Andrew Batson argues a major China stimulus 'pivot' remains unlikely near-term despite Q2 GDP growth slowing to 4.3% (blamed on the oil shock and external shocks) and flat-to-down equities, even though unusual regulator messaging and coordinated state-institution stock purchases this week show a more targeted support effort, partly because Beijing still expects the Strait of Hormuz disruption to prove temporary.", "url": "https://research.gavekal.com/teaser/the-possibility-of-a-pivot/", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Gavekal expects China's domestic EV sales to fall roughly 7% in 2026 -- the segment's first-ever annual decline -- as BYD and Tesla lose share to well-capitalized rivals kept afloat by exports, which now account for a third of Chinese EV makers' unit sales, raising the question of how long export markets can keep absorbing rising Chinese volumes.", "url": "https://research.gavekal.com/teaser/evs-year-of-living-dangerously/", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Gavekal's Xiaoxi Zhang finds Chinese household net worth grew faster in 2025 and into 2026 on high savings, deleveraging and rising stock markets, though the recovery is unevenly distributed and the number of financially distressed households is rising.", "url": "https://research.gavekal.com/teaser/rebuilding-the-household-balance-sheet/", "images": []}, {"source": "peterson_institute", "name": "Peterson Institute for International Economics", "thesis": "PIIE's Monica de Bolle says the USTR's 25% Section 301 tariff on Brazil (effective July 22, 2026) exempts roughly 44% of Brazilian exports plus another 13% already under Section 232, so two of three dollars of Brazilian exports escape the new duties despite the US running a $14.4 billion trade surplus with Brazil; Brazil has since diverted 37% of exports to China and boosted shipments to India over 50%.", "url": "https://www.piie.com/blogs/realtime-economics/2026/trumps-new-tariffs-brazil-reflect-weakness-us-trade-strategy", "images": []}, {"source": "peterson_institute", "name": "Peterson Institute for International Economics", "thesis": "PIIE's Monica de Bolle argues the USTR's forced-labor Section 301 investigation into Brazil is a pretext to globalize the US's China forced-labor import ban, since it never examines actual Brazilian practices; the new tariff would add 10-12.5% on top of the existing 25%, pushing the combined rate toward ~37.5% (near the unlawful 50% imposed in 2025) and hitting 60 economies including the EU, Canada and Mexico.", "url": "https://www.piie.com/blogs/realtime-economics/2026/forced-labor-case-against-brazil-not-about-forced-labor", "images": []}, {"source": "peterson_institute", "name": "Peterson Institute for International Economics", "thesis": "PIIE's Maurice Obstfeld warns that despite Javier Milei's stabilization program sharply cutting inflation since December 2023, Argentina's exchange rate regime leaves monetary policy without a credible nominal anchor, and recommends transitioning to a floating exchange rate with inflation targeting to durably lock in gains ahead of the 2027 election.", "url": "https://www.piie.com/publications/working-papers/2026/argentina-challenge-and-opportunity", "images": []}, {"source": "peterson_institute", "name": "Peterson Institute for International Economics", "thesis": "PIIE's Cullen Hendrix estimates a newly arrived 'Super' El Nino will cause roughly $686 billion in year-one global GDP losses and up to $3.1 trillion over five years, concentrated in 51 lower- and middle-income tropical countries that bear $535 billion (3.3% of their combined GDP), compounding a food-price risk in late 2026/early 2027 alongside the Strait of Hormuz's fertilizer disruption.", "url": "https://www.piie.com/blogs/realtime-economics/2026/el-nino-could-drag-down-global-economy-almost-700-billion-or-3", "images": []}, {"source": "world_bank", "name": "World Bank", "thesis": "The World Bank's new Atlas of Global Development finds developing countries progressing at their slowest pace since 1950, with more than 50 economies on track to take a century or more to reach current high-income levels absent reform, though it cites counter-examples like Rwanda (extreme poverty cut from ~90% to under 40%) as models via its 'Knowledge Bank' and 'Mission 300' initiatives.", "url": "https://blogs.worldbank.org/en/voices/development-against-the-odds", "images": []}]}], "B_calls": [{"source": "goldman_sachs", "name": "Goldman Sachs", "call": "David Mericle: Fed holds through all of 2026, first cut pushed to 2027; puts 2026 hike odds at ~25% versus the market's implied ~50%.", "category": ["rates"], "url": "https://www.goldmansachs.com/insights/goldman-sachs-exchanges/us-midyear-outlook-geopolitical-shocks-the-new-fed-era-and-growth", "images": []}, {"source": "citi_gps", "name": "Citi", "call": "Rob Rowe and Veronica Clark: the Fed's next move will be a cut, not a hike, contingent on softer core CPI and a rising unemployment rate.", "category": ["rates"], "url": "https://www.citigroup.com/global/insights/e84-the-warsh-fed-mind-the-data", "images": []}, {"source": "ubs", "name": "UBS", "call": "Expects the Fed's next move to be a cut toward its ~3% neutral-rate estimate; recommends the 2-5 year segment of the Treasury curve.", "category": ["rates"], "url": "https://www.ubs.com/us/en/wealth-management/insights/investment-research/insights-display-adp/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-23072026.html", "images": []}, {"source": "schroders", "name": "Schroders", "call": "Turned tactically positive on the US 10-year Treasury for the first time since November 2023; upgraded government bonds to Long/positive, US IG credit only to Neutral, and stays negative on US/European corporate credit and HY given tight spreads.", "category": ["rates", "credit"], "url": "https://www.schroders.com/en-us/us/individual/insights/our-multi-asset-investment-views-july-2026/", "images": []}, {"source": "pimco", "name": "PIMCO", "call": "Marc Seidner and Pramol Dhawan: at a ~4.55% 10-year yield, a growth scare or recession could push its one-year total return to 10%+ (up to ~20% in a severe recession) as the Fed cuts aggressively.", "category": ["rates"], "url": "https://www.pimco.com/us/en/insights/old-fashioned-bond-math-for-a-new-fashioned-fed", "images": []}, {"source": "rbc", "name": "RBC Capital Markets", "call": "Helima Croft: a full regional war could push Brent through the 2022 peak of $128/bbl or even the 2008 record of $146/bbl; US SPR at 43-year lows leaves almost no buffer.", "category": ["energy", "geopolitics"], "url": "https://www.rbccm.com/en/insights/2026/07/energy-market-risks-reignited-after-iran-ceasefire-collapses", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "call": "Sets DXY resistance at 102, EUR/USD support at 1.1330, expects USD/JPY to correct only to 155-158, and pegs gold support at $3,950/oz after a 2% pullback.", "category": ["fx", "commodities"], "url": "https://www.sc.com/sg/market-outlook/daily-navigator-24-7-2026/?mvog=1", "images": []}, {"source": "ubs", "name": "UBS", "call": "Sees ~10% 12-month upside for the MSCI ACWI on broad earnings strength; upgraded Eurozone equities and India to Attractive.", "category": ["equities"], "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-17072026.html", "images": []}, {"source": "citi_gps", "name": "Citi", "call": "Beata Manthey and David Groman upgraded Japan to overweight on its leverage to the AI investment cycle, framing the broader rally as a 'narrow broadening' (+10% YTD).", "category": ["equities"], "url": "https://www.citigroup.com/global/insights/markets-edition-back-to-the-broadening", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas", "call": "Olivier Monnoyeur: European HY spreads compressed to 315bp on record ~EUR49bn quarterly issuance; sees defaults falling to 2.4% by end-2026 and rotates toward single-B over high-BB credit.", "category": ["credit"], "url": "https://www.bnpparibas-am.com/en/portfolio-perspectives/european-high-yield-market-supportive-despite-geopolitical-tensions/", "images": []}, {"source": "kkr", "name": "KKR", "call": "Matt Salem: senior secured CRE debt is a compelling relative-value opportunity after property values fell 20-30% from peak; KKR's origination pipeline runs ~$40 billion per week.", "category": ["credit"], "url": "https://www.kkr.com/insights/case-for-cre-debt", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "call": "2026 outlook calls for BTC to reach $250,000 by year-end 2027, though its 2025 targets of $150,000 (later cut to $125,000) both missed.", "category": ["crypto"], "url": "https://www.galaxy.com/insights/research/predictions-2026-crypto-bitcoin-defi", "images": []}, {"source": "coinshares", "name": "CoinShares", "call": "James Butterfill: bitcoin's floor is likely in after an eight-week, $8B outflow streak reversed, but a break above $80,000 is unlikely without a bigger shift in monetary-policy expectations.", "category": ["crypto"], "url": "https://coinshares.com/insights/research-data/market-update-17-07-2026/", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "call": "Templeton Global Investments forecasts ~50% 2026 EM earnings growth (double the US) against a 38% P/E discount to developed markets, with EM only 5.8% of global allocations versus a 12% MSCI ACWI weight.", "category": ["em", "equities"], "url": "https://www.franklintempleton.com/articles/2026/equity/why-now-emerging-markets", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "call": "Katherine Bordlemay: EM equities have returned more than double the S&P 500 over 18 months on 55% expected 2026 earnings growth, with nearly $50 billion of YTD inflows, the most in two decades.", "category": ["em", "equities"], "url": "https://www.goldmansachs.com/insights/videos/emerging-market-stocks-may-climb-higher-amid-boost-from-ai", "images": []}, {"source": "bca_research", "name": "BCA Research", "call": "Portfolio Construction team recommends overweighting private equity, rotating from momentum stocks into quality and hyperscalers, and downgrading late-stage venture capital.", "category": ["equities", "credit"], "url": "https://www.bcaresearch.com/marketing/webcasts/quarterly-outlook-portfolio-construction/221556", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "call": "European gas storage is only just above 50% full, a historic seasonal low; even a best-case Qatari restart by end-September caps storage at 75% by November 1 versus a 90% five-year average.", "category": ["energy"], "url": "https://www.woodmac.com/blogs/the-edge/is-europes-gas-market-inching-towards-winter-crisis/", "images": []}, {"source": "deutsche_bank", "name": "Deutsche Bank", "call": "Dirk Steffen flags heavy AI-related debt issuance from big tech (capex approaching ~$1 trillion) could be crowding out demand and keeping sovereign yields elevated; favors corporate IG bonds over governments.", "category": ["credit", "rates"], "url": "https://wealth.db.com/en/insights/investing-insights/cio-weekly-investment-outlook-podcast.html", "images": []}], "C_deep_reads": [{"source": "kkr", "name": "KKR", "title": "Mid-Year Outlook for 2026: The Divergence Conundrum", "summary": "Henry McVey's flagship mid-year outlook frames 2026 as a 'Divergence Conundrum': a genuine global productivity boom coexisting with intensifying geopolitical and economic fragmentation, producing K-shaped winners and losers across sectors. KKR runs above-consensus on both US growth and inflation (higher-for-longer outside China), expects the Fed's easing cycle to keep fading, and argues the oil futures curve still underprices geopolitical risk premium. The firm believes the dollar has peaked but sees no disorderly unwind, and maintains high conviction that Asia outperforms across both public and private markets. Key tilts include nominal-GDP-linked real assets (power/energy infrastructure, data centers, logistics) and Structured Equity/Capital Solutions; the biggest flagged risk is 'politics rather than technology' derailing the productivity cycle.", "url": "https://www.kkr.com/insights/mid-year-update-2026", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "title": "US Midyear Outlook: Geopolitical Shocks, the New Fed Era, and Growth", "summary": "Chief US economist David Mericle's midyear outlook lays out Goldman's house view under new Fed Chair Kevin Warsh: rates held through the rest of 2026 with the first cut pushed to 2027, even as markets price roughly 50/50 odds of one to two more hikes (Goldman puts hike odds nearer 25%). Core PCE inflation is expected to run around 20bp/month, soft enough for the Fed to look through tariff, war-driven oil, and AI-mismeasurement effects, with GDP growth landing near 2% versus Goldman's ~2.5% potential estimate as consumption cools in H2 once fading tax-refund and wealth-effect tailwinds wear off. The labor market has nonetheless 'surprised to the upside' despite the Iran-war oil shock, with job growth running above the estimated 50-60k/month breakeven rate. The key risk flagged: further war-driven oil spikes reigniting inflation and forcing a hawkish Fed pivot.", "url": "https://www.goldmansachs.com/insights/goldman-sachs-exchanges/us-midyear-outlook-geopolitical-shocks-the-new-fed-era-and-growth", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "title": "Global Investment Outlook 2026", "summary": "Franklin Templeton's flagship collection frames 2026 around a 'Resilience' thesis: markets and economies have held up despite geopolitical shocks, policy uncertainty and rising inflation, with global growth staying near trend on consumer spending, business investment, productivity gains and strong corporate profits. The Fixed Income team's Central Bank Watch says global central banks are in a 'no rush to relax' phase balancing sticky inflation against uneven growth; the Investment Solutions team's July 10 Allocation Views upgraded equities on strong earnings, resilient growth and improving energy-market conditions despite inflation risks, while the Q3 2026 Hedge Fund Strategy Outlook stays constructive, favoring security selection over broad market beta.", "url": "https://www.franklintempleton.com/insights/collections/global-investment-outlook-2026", "images": []}, {"source": "pimco", "name": "PIMCO", "title": "Lotfi Karoui on Private Credit and the AI CapEx Supercycle", "summary": "PIMCO's Lotfi Karoui argues the direct-lending stress that began in late 2025 is 'cyclical, not systemic,' but flags that a corporate default cycle 'has begun' and that financial-engineering excess — leveraged ETFs, CLOs referencing illiquid assets — is re-emerging in ways that echo pre-GFC interconnectedness, with BDC mark dispersion between optimistic and pessimistic managers running six to seven points. He separately estimates roughly $1.6 trillion of hyperscaler capex for 2026-27, increasingly debt-funded, which he frames as a positive demand shock keeping real yields higher for longer even as AI adoption could eventually prove disinflationary. His practical takeaway: rotate ~90/10 equity-heavy portfolios back toward a more traditional 60/40 given 10-year yields near 4.5%.", "url": "https://www.pimco.com/us/en/insights/podcasts/accrued-interest/lotfi-karoui-on-private-credit-and-the-ai-capex-supercycle", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas", "title": "Global Fixed Income Outlook Q3 2026: Bonds, Keep Calm and Carry On", "summary": "BNP Paribas AM's flagship quarterly fixed income outlook favors carry over duration across five sleeves: euro investment grade for coupon income, US agency MBS for carry without significant credit risk, European high yield (supported by low defaults but tight spreads requiring selective issuer analysis), and selective emerging-market debt prioritizing durable fundamentals over broad beta. The report ties this positioning to the same Fed Chair Warsh forward-guidance shift running through the bank's other July notes — market-implied neutral now 3.5-4.0% versus the FOMC's own 3.0% estimate — and to the EM debt divide between oil-exporting beneficiaries and oil-importing economies squeezed by the energy shock.", "url": "https://viewpoint.bnpparibas-am.com/global-fixed-income-outlook-q3-2026-bonds-keep-calm-and-carry-on/", "images": []}, {"source": "boe", "name": "Bank of England", "title": "This time is different? — speech by Sarah Breeden", "summary": "Deputy Governor Sarah Breeden's speech is one of the period's most significant financial-stability warnings: private markets AUM has grown roughly six-fold since the 2008/09 low-rate era to about $18 trillion alongside weakening underwriting standards and a recent string of defaults (MFS, Tricolor, First Brands Group), plus rising redemption pressure at retail private-credit funds. She warns this could crystallize alongside record hedge-fund gilt-repo leverage (highest since 2017) and stretched AI-linked US tech valuations — AI firms are expected to invest over $5 trillion over the next five years, increasingly financed by debt across public markets, leveraged finance and private credit rather than mostly equity and cash as in prior cycles, meaning 'the financial stability consequences of any fall in AI-related asset prices could well increase.'", "url": "https://www.bankofengland.co.uk/speech/2026/april/sarah-breeden-at-the-program-on-international-financial-systems-and-harvard-law-school", "images": []}, {"source": "man_group", "name": "Man Group", "title": "The Road Ahead: Andy Burnham, Can You Hear Me?", "summary": "Henry Neville's deep-dive examines why UK gilt yields have risen to match Australia's for the highest among major developed markets despite UK debt-to-GDP (~100%) being unremarkable historically versus peers. He attributes the gilt premium to the UK's outlier inflation record and an elevated term premium from political instability (seven PMs since 2016) — a quarter of UK public liabilities are inflation-linked, more than double any peer. He quantifies the budget deterioration precisely: debt-interest costs up £82bn over four years, welfare spending up £48bn, pensions/Triple Lock up £37bn (the Triple Lock itself adding an estimated £15-23bn), with the OBR forecasting a record UK tax burden exceeded only by France and Italy — a pointed brief for incoming PM Andy Burnham on the fiscal inheritance he faces.", "url": "https://www.man.com/insights/road-ahead-andy-burnham", "images": []}, {"source": "peterson_institute", "name": "Peterson Institute for International Economics", "title": "Is this the end of America's hegemony?", "summary": "Alan Wm. Wolff draws an extended historical parallel between declining Athenian hegemony and the US today: both depended on protecting trade routes (Athenian grain versus US oil), built alliance structures (the Delian League versus NATO/GATT-WTO) that strained under perceived overreach, and suffered internal instability alongside external overextension (the Sicilian Expedition versus the Iraq/Iran wars). He catalogs current strains — friction with Canada, threats against Denmark over Greenland, 'Turnberry'-style unequal-treaty demands, China export controls and tariffs, and the Iran war — set against China, Russia and North Korea pledging closer alignment, and concludes that US hegemonic decline 'looks like a choice' rather than an externally imposed defeat, while leaving open the possibility of a future US-led coalition with Europe and Japan.", "url": "https://www.piie.com/blogs/realtime-economics/2026/end-americas-hegemony", "images": []}, {"source": "brookings", "name": "Brookings Institution", "title": "Will China replace America on the world stage?", "summary": "Historian Robert Kagan, in Brookings' 'Beijing Brief' podcast and companion project 'Blowback: How the Iran War May Change the World,' argues America's world role is undergoing a 'radical break' under Trump rather than incremental decline, and concludes the Iran war likely leaves a persistently contested Strait of Hormuz and a stronger, more confident Iran — forcing oil/gas-dependent Asian nations, especially Japan, to find alternatives as the US recedes as guarantor of international waterways. Directly countering the PIIE/Wolff framing of straightforward American decline, Kagan argues China is 'sitting pretty,' not rushing to fill the Gulf vacuum, and predicts a genuine multipolar world — adding Japan and likely Germany as great powers — rather than either American or Chinese hegemony, while remaining skeptical that US foreign policy reverts to its prior posture even after the current administration.", "url": "https://www.brookings.edu/articles/will-china-replace-america-on-the-world-stage/", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "title": "26 Cryptocurrency, Bitcoin, and DeFi Predictions for 2026", "summary": "Galaxy's flagship annual outlook calls for BTC to reach $250,000 by year-end 2027, with near-term downside risk persisting until BTC reclaims the $100,000-105,000 zone; options markets price essentially coin-flip odds on both a $70k-vs-$130k range by June 2026 and a $50k-vs-$250k range by year-end 2026. Other calls include DEXs capturing 25%+ of spot trading volume, crypto-backed loans clearing $90bn, ETF inflows exceeding $50bn, and five or more digital-asset treasury companies being forced to sell holdings or shut down. Notably, Galaxy's own scorecard of its 2025 predicti // ---------- helpers ----------
const CAT_VARS = {
  rates: 'var(--cat-rates)',
  growth: 'var(--cat-growth)',
  fx: 'var(--cat-fx)',
  equities: 'var(--cat-equities)',
  credit: 'var(--cat-credit)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  commodities: 'var(--cat-commodities)',
  geopolitics: 'var(--cat-geopolitics)',
  ai_tech: 'var(--cat-ai_tech)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }
function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}
function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}
function pills(cats) {
  if (!cats) return '';
  if (Array.isArray(cats)) return cats.map(pill).join(' ');
  return pill(cats);
}
function externalLink(url, label) {
  if (!url) return '';
  return `<a class="item-link" href="${escapeAttr(url)}" target="_blank" rel="noopener">${label || 'link →'}</a>`;
}
function nameLink(url, name) {
  if (!name) return '';
  if (!url) return `<span class="item-source">${escapeHtml(name)}</span>`;
  return `<a class="item-source" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderThemeItem(it) {
  return `
    <div class="theme-item">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.thesis || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderTheme(theme) {
  const items = (theme.items || []).map(renderThemeItem).join('');
  return `
    <div class="theme">
      <div class="theme-head">
        ${pills(theme.category)}
        <div class="theme-title">${escapeHtml(theme.theme || '')}</div>
      </div>
      <div class="theme-stance">
        ${theme.consensus ? `<div class="theme-line consensus"><span class="lbl">Consensus</span>${renderBold(theme.consensus)}</div>` : ''}
        ${theme.divergence ? `<div class="theme-line divergence"><span class="lbl">Divergence</span>${renderBold(theme.divergence)}</div>` : ''}
      </div>
      ${items ? `<div class="theme-items">${items}</div>` : ''}
    </div>`;
}

function renderCall(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${pills(it.category)}
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.call || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderDeepRead(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url, 'read →')}
      </div>
      ${it.title ? `<div class="item-title">${escapeHtml(it.title)}</div>` : ''}
      <div class="item-text">${renderBold(it.summary || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderChart(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.chart || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderHouseView(hv) {
  const name = hv.name || hv.source || '';
  const nameHtml = hv.url
    ? `<a class="hv-name" href="${escapeAttr(hv.url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`
    : `<span class="hv-name">${escapeHtml(name)}</span>`;
  return `
    <div class="hv-row">
      ${nameHtml}
      <span class="hv-stance">${renderBold(hv.stance || '')}</span>
    </div>`;
}

function renderSection(letter, name, items, render, extraClass) {
  if (!items || !items.length) return '';
  const body = items.map(render).join('');
  const cls = 'section' + (extraClass ? (' ' + extraClass) : '');
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderTopStats(d) {
  const parts = [];
  const p = d.period || {};
  const is = d.input_stats || {};
  const cv = d.coverage || {};
  if (p.from && p.to)
    parts.push(`period <strong>${escapeHtml(p.from)} → ${escapeHtml(p.to)}</strong>`);
  else if (p.lookback_days != null)
    parts.push(`lookback <strong>${p.lookback_days}d</strong>`);
  if (is.total_articles != null) parts.push(`articles <strong>${is.total_articles}</strong>`);
  if (is.sources_present != null) parts.push(`sources <strong>${is.sources_present}</strong>`);
  if (is.after_filter != null) parts.push(`after filter <strong>${is.after_filter}</strong>`);
  if (cv.coverage_pct != null) {
    const pct = (cv.coverage_pct <= 1 ? cv.coverage_pct * 100 : cv.coverage_pct);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  } else if (cv.sources_covered != null && cv.sources_total != null) {
    parts.push(`coverage <strong>${cv.sources_covered}/${cv.sources_total}</strong>`);
  }
  return parts.join(' | ');
}

function reportDate(d) {
  if (d.period && d.period.to) return d.period.to;
  if (d.collected_at) return String(d.collected_at).slice(0, 10);
  return '';
}

// ---------- interactions ----------
function toggleSection(headEl) { headEl.parentElement.classList.toggle('open'); }
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('lightbox').classList.contains('open')) {
    closeLightbox();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = reportDate(d);
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  const s = d.sections || {};
  const out = [
    renderSummary(d.summary),
    renderSection('A.', 'Debates — Consensus vs Divergence', s.A_debates,    renderTheme),
    renderSection('B.', 'Key Calls & Positioning',           s.B_calls,      renderCall),
    renderSection('C.', 'Notable Deep Reads',                s.C_deep_reads, renderDeepRead,
                  'section-deepreads'),
    renderSection('D.', 'Charts & Data',                     s.D_charts,     renderChart),
    renderSection('E.', 'House Views',                       s.house_views,  renderHouseView),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = out || '<div class="empty">No report data.</div>';

  // Auto-open Summary's section view: first two sections open by default.
  document.querySelectorAll('.section').forEach((sec, i) => {
    if (i < 2) sec.classList.add('open');
  });
}

renderReport(REPORT_DATA);
</script>
