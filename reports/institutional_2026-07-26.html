<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Institutional Research</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #7c3aed;          /* purple — institutional report accent */
  --accent-soft: #f3eefc;
  --divergence: #d94052;      /* divergence red */
  --consensus: #15803d;       /* consensus green */
  --yellow: #fff5b3;

  /* category colors (institutional schema: rates, growth, fx, equities,
     credit, crypto, energy, commodities, geopolitics, ai_tech, em) */
  --cat-rates: #2563eb;
  --cat-growth: #d97706;
  --cat-fx: #0891b2;
  --cat-equities: #15803d;
  --cat-credit: #be185d;
  --cat-crypto: #8b5cf6;
  --cat-energy: #dc2626;
  --cat-commodities: #ea580c;
  --cat-geopolitics: #b91c1c;
  --cat-ai_tech: #4f46e5;
  --cat-em: #059669;
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 980px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 12px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* STATS BAR (top: period + coverage) */
.stats-top { margin-bottom: 16px; padding: 8px 12px; background: var(--surface);
             border: 1px solid var(--border); border-radius: 6px;
             font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
             color: var(--text-2); display: flex; gap: 16px; flex-wrap: wrap; }
.stats-top strong { color: var(--text); font-weight: 600; }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 10px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* THEME CARD (Section A) */
.theme { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.theme:last-child { border-bottom: none; }
.theme-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
              flex-wrap: wrap; }
.theme-title { font-weight: 600; font-size: 14.5px; }
.theme-stance { display: grid; grid-template-columns: 1fr; gap: 6px; margin-bottom: 10px; }
@media (min-width: 720px) { .theme-stance { grid-template-columns: 1fr 1fr; } }
.theme-line { font-size: 13px; padding: 8px 10px; border-radius: 4px;
              border-left: 3px solid var(--border); background: #fafafa; line-height: 1.5; }
.theme-line.consensus { border-left-color: var(--consensus); background: #f0f9f3; }
.theme-line.divergence { border-left-color: var(--divergence); background: #fdf6f7; }
.theme-line .lbl { font-family: 'IBM Plex Mono', monospace; font-size: 10px;
                   text-transform: uppercase; letter-spacing: .06em;
                   color: var(--text-3); display: block; margin-bottom: 2px; }
.theme-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
               border-left: 2px solid var(--border-light); }
.theme-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-source { font-weight: 600; color: var(--accent); }
a.item-source { text-decoration: none; }
a.item-source:hover { text-decoration: underline; }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-title { font-weight: 600; font-size: 14px; margin: 4px 0 6px; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DEEP READS (Section C) — purple left border to mark flagship long-form */
.section-deepreads .item-card { border-left: 4px solid var(--accent); background: var(--accent-soft); }

/* HOUSE VIEWS — compact one-line-per-source list */
.hv-row { display: flex; gap: 10px; align-items: baseline;
          padding: 6px 16px; border-bottom: 1px solid var(--border-light);
          font-size: 13px; }
.hv-row:last-child { border-bottom: none; }
.hv-name { font-weight: 600; color: var(--accent); min-width: 180px;
           text-decoration: none; }
.hv-name:hover { text-decoration: underline; }
.hv-stance { color: var(--text); flex: 1; }

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 110px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .hv-row { flex-direction: column; gap: 2px; }
  .hv-name { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "INSTITUTIONAL RESEARCH", "collected_at": "2026-07-26T02:01:26.000Z", "period": {"lookback_days": 10, "from": "2026-07-16", "to": "2026-07-25"}, "input_stats": {"total_articles": 414, "sources_present": 52, "after_filter": 212}, "summary": "**Rates & Central Banks:** Consensus is a **synchronized hold** while banks assess the Iran oil shock — Fed at **3.5-3.75%**, ECB at **2.25%**, BoE at **3.75%**. Sharpest split: **Citi** and **UBS** expect the Fed's next move to be a **cut** toward ~3% neutral on cooling core CPI, while **KKR** and market pricing itself lean toward **hike risk**, with **Goldman**'s Mericle in between (hold through 2026, first cut 2027, hike odds ~25% vs. the market's ~50%).\n\n**Oil / Iran-Gulf conflict:** Consensus is that Brent's surge from the $80s to **above $100/bbl** on the Hormuz/Red Sea escalation is inflationary but not yet regime-changing (**UBS, BNY, Deutsche Bank**). Sharpest split: **RBC**'s Helima Croft warns Brent could still hit **$128-146/bbl** in a full regional war, while **UBS** and **Brookings** see flows normalizing and inflation subsiding.\n\n**US Equities:** Consensus is **earnings-led, not multiple-driven** gains broadening beyond the Magnificent Seven — **UBS** forecasts 28% Q2 EPS growth, **Citi** upgraded Japan on AI leverage. Sharpest split: **Goldman** and **Vanguard** call the AI trade \"early innings, not a bubble,\" while **Capital Economics** (long among the most bullish US forecasters) and **BoE's Sarah Breeden** now warn the rally has outrun the macro benefit cycle and is increasingly debt-financed.\n\n**AI & Tech:** Consensus is that AI capex is a genuine growth driver — **Capital Economics** estimates it's ~1/3 of US and over half of China's Q2 growth — with hyperscaler spend converging near **$755bn-$1.6 trillion** across Goldman, PIMCO and BoE estimates. Sharpest split: **Goldman's Solomon** calls it \"early innings, not a bubble\" backed by $9tn in money-market cash, while **Man Group** and **PIMCO's Karoui** warn of re-emerging pre-GFC-style financial engineering and a maturing default cycle.\n\n**Credit:** Consensus is that spreads are **historically tight** with little room to compress further (**Schroders, BNP Paribas**), even as elevated all-in yields keep credit attractive on carry. Sharpest split: **PIMCO** and **KKR** call private-credit stress \"cyclical, not systemic\" and see relative value in CRE debt, while **Man Group** and **BoE's Sarah Breeden** warn the **$18 trillion** private-markets complex has weakening underwriting and rising defaults (MFS, Tricolor, First Brands).\n\n**Crypto:** Consensus is **consolidation, not crisis** — **CoinShares** sees bitcoin's floor \"likely in\" near **$64-67k** after an $8bn outflow streak, with no contagion from Q4 2025's record liquidation event (**Galaxy**). Sharpest split: **Galaxy** targets **$250,000 BTC by year-end 2027**, while **Gavekal**'s halving-cycle framework implies more downside time could still run, and **Galaxy**'s own CLARITY Act odds were just cut to 30% after Senate Democratic pushback.\n\n**Emerging Markets:** Consensus is EM is **structurally cheap and under-owned** — **Franklin Templeton** and **Goldman** cite ~50-55% 2026 EM earnings growth against a 38-40% valuation discount and record inflows. Sharpest split: **UBS/KKR** bullish bulls versus **Gavekal**'s more alarmed China read (Q2 GDP at 4.3%, EV sales set for their first-ever decline) and **Capital Economics**' own Activity Proxy putting real Chinese growth closer to 3.2%.\n\n**Geopolitics:** Consensus is the **Iran/Gulf conflict and tariff escalation** (Section 338 on Canada, Section 301 forced-labor tariffs on 60 economies) are now durable, not temporary, features of the landscape. Sharpest split: **PIIE's Wolff** argues US hegemonic decline is real and self-inflicted (an Athens/Delian League parallel), while **Brookings' Kagan** counters it's a \"radical break,\" not decline, with China \"sitting pretty\" rather than filling the vacuum.", "sections": {"A_debates": [{"theme": "Rates & Central Banks", "category": ["rates"], "consensus": "The dominant view is that major central banks are pausing to assess the Iran/Middle East oil shock rather than moving decisively in either direction — Franklin Templeton's Central Bank Watch frames this as a global 'no rush to relax' phase balancing sticky inflation against uneven growth. On the Fed (funds rate 3.5-3.75% under new Chair Kevin Warsh): Goldman Sachs, Citi, Schroders, UBS, Standard Chartered and BNY all converge on a near-term hold at the July/August meeting. The ECB held its deposit rate at 2.25% on July 23-24 (T. Rowe Price, Standard Chartered), with President Lagarde flagging Iran-related energy-shock upside inflation risk and leaving the door open to a September hike. The BoE held Bank Rate at 3.75% in June, which Governor Bailey called an 'active choice' — looking through the direct energy-shock hit (UK CPI 2.8% in April, an 0.8pp upside surprise) while standing ready to act forcefully against second-round wage-price effects. Warsh's elimination of Fed forward guidance/the dot plot (Citi, BNP Paribas, PIMCO, Deutsche Bank) has pushed the market-implied neutral rate to 3.5-4.0% versus the FOMC's own ~3.0% estimate (BNP Paribas), keeping 10-year Treasury yields range-bound around 4.35%-4.7% (T. Rowe Price: briefly topped 4.7%, highest since January 2025; UBS: 4.66-4.68%; BNP Paribas: 4.35%-4.65%). There is also broad agreement that June US CPI cooled (headline to 3.5% from 4.2%, core to 2.6% from 2.9%, per BNP Paribas/Schroders/UBS) — the first monthly deceleration in underlying inflation since 2020 — even as Brent above $100/bbl and WTI above $90/bbl threaten to reverse that progress and ECB corporate contacts see euro-area wage growth decelerating from 3.1% (2025) to 2.5% (2026) and 2.4% (2027).", "divergence": "The sharpest fault line is over what the Fed's NEXT move will actually be, and it splits desks roughly down the middle. On the dovish/cut side: Citi's Rob Rowe and Veronica Clark maintain the Fed's next move will be a cut, not a hike, contingent on softer core CPI prints and a rising unemployment rate. UBS goes further, expecting the next move to be a cut toward the Fed's ~3% neutral-rate estimate specifically because June's core CPI showed the first monthly decline in underlying inflation since 2020 and 10-year breakevens have eased to 2.25% from 2.5% in May — UBS recommends the 2-5 year segment of the curve. Schroders' fixed income and multi-asset teams assign a higher probability than the market to the Fed simply holding (not hiking), arguing markets are 'too hawkish' on the medium-term path, and backed that view by turning tactically positive on the 10-year Treasury for the first time since November 2023 and upgrading government bonds overall to Long/positive. PIMCO's Marc Seidner and Pramol Dhawan argue that at a ~4.55% 10-year yield, investors are already paid to wait for convexity that could deliver a 10-20% one-year total return if the Fed is forced to cut aggressively into a growth scare. On the hawkish/hike-risk side: market pricing itself has moved sharply — Standard Chartered's Daily Navigator flags markets now pricing a September Fed hike (versus SC's own call for a hold next week, with hike risk later in the year contingent on oil pass-through), and BNP Paribas notes Fed-cut pricing has collapsed from two cuts by year-end to zero cuts or possible hikes, a shift already pushing some EM central banks to delay planned easing into 2027. Goldman Sachs' David Mericle sits closer to the middle but still disputes the market consensus on hike risk: he sees the Fed on hold through all of 2026 with the first cut pushed to 2027, pegging 2026 hike odds at just ~25% versus the market's implied ~50%, since core PCE running near 20bp/month is soft enough for the Fed to look through tariff, oil-shock and AI-mismeasurement noise. KKR takes the most structurally hawkish view, running above-consensus on both US growth and inflation and arguing the Fed's easing cycle 'keeps fading' with higher long-end yields a persistent, not transitory, pressure point — the polar opposite of PIMCO's and Schroders' 'buy duration now' calls built on the same starting yields.", "items": [{"source": "t_rowe_price", "name": "T. Rowe Price", "thesis": "The ECB held rates on July 23 but President Lagarde flagged the Iran-related energy shock and left the door open to a September hike; Andy Burnham was sworn in as new UK PM. The 10-year UST yield briefly topped 4.7% (highest since January 2025) on oil-driven inflation fears before easing to ~4.68%, even as US flash composite PMI rose to an 8-month high of 53.6 and jobless claims fell to 187,000 (lowest since 1969). In Japan, the 10-year JGB yield rose to 2.80% and the yen weakened to near JPY 164, a 40-year low, despite intervention warnings.", "url": "https://www.troweprice.com/en/us/insights/global-markets-weekly-update", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "thesis": "Franklin Templeton Fixed Income's Central Bank Watch says global central banks are in a 'no rush to relax' phase, balancing sticky inflation against uneven growth. The Investment Solutions team's July 10 Allocation Views upgraded equities on strong earnings, resilient growth and improving energy-market conditions despite inflation risks; the Q3 2026 Hedge Fund Strategy Outlook stays constructive, favoring security selection over broad market beta.", "url": "https://www.franklintempleton.com/insights/collections/global-investment-outlook-2026", "images": []}, {"source": "man_group", "name": "Man Group", "thesis": "Man Group's Henry Neville examines why UK gilt yields have risen to match Australia's for the highest among major developed markets despite UK debt-to-GDP (~100%) being unremarkable historically. He attributes the gilt premium to the UK's outlier inflation record and an elevated term premium from political instability (seven PMs since 2016) — a quarter of UK public liabilities are inflation-linked, more than double any peer. He quantifies budget deterioration: debt-interest costs up £82bn over four years, welfare spending up £48bn, pensions/Triple Lock up £37bn, with the OBR forecasting a record UK tax burden exceeded only by France and Italy.", "url": "https://www.man.com/insights/road-ahead-andy-burnham", "images": []}, {"source": "schroders", "name": "Schroders", "thesis": "With headline inflation at 3.5% (still above target) but easing, Schroders' fixed income team expects the Fed to hold at its next meeting with September as the key decision point, arguing markets are too hawkish on the medium-term policy path and seeing value in duration at current yields, while favoring higher-quality fixed income over corporate credit given historically tight spreads and early signs of stress in lower-rated high yield/private credit.", "url": "https://www.schroders.com/en-us/us/individual/insights/weekly-bond-market-update-from-superstars-to-team-performance/", "images": []}, {"source": "schroders", "name": "Schroders", "thesis": "Schroders' Multi-Asset team says the biggest shift versus the start of the year is that markets have moved from pricing rate cuts to pricing rate rises; Schroders responded by turning tactically positive on the US 10-year Treasury for the first time since November 2023, upgrading government bonds overall to Long/positive and US investment-grade credit to Neutral, while holding a negative view on US/European corporate credit and high yield given tight spreads.", "url": "https://www.schroders.com/en-us/us/individual/insights/our-multi-asset-investment-views-july-2026/", "images": []}, {"source": "schroders", "name": "Schroders", "thesis": "Schroders' US Multi-Sector Fixed Income team says today's higher starting yields (Bloomberg Agg ~4.75%) provide one of the most attractive entry points in over a decade, even as sticky inflation, resilient labor markets and fiscal deficits keep the Fed on hold with no near-term catalyst for materially lower yields. They hold a low, defensive corporate-credit allocation given ~$1.2 trillion of expected 2026 IG issuance, favoring hyperscaler/data-center IG issuers, agency MBS, structured municipals and EM debt instead.", "url": "https://www.schroders.com/en-us/us/individual/insights/fixed-income-markets-now-demand-a-mix-of-tactical-offense-and-resilient-defense/", "images": []}, {"source": "schroders", "name": "Schroders", "thesis": "Schroders' Global Fixed Income team says its scenario probabilities have shifted more hawkish (its 'too cold' scenario now implies only one-plus Fed cuts, versus three to four previously), but its underlying view assigns a higher probability than the market to the Fed staying on hold. It remains moderately constructive on duration overall, is more constructive on eurozone duration, moves Japan to neutral on intervention risk, and sees selective value in Greek and Hungarian government bonds.", "url": "https://www.schroders.com/en-us/us/individual/insights/reading-between-the-lines-are-rate-fears-overdone-for-bonds-/", "images": []}, {"source": "kkr", "name": "KKR", "thesis": "KKR, led by Henry McVey, is above-consensus on US GDP growth and on inflation (higher-for-longer outside China), expects the Fed's easing cycle to keep fading, sees higher long-end yields as a persistent pressure point, and believes the oil futures curve still underprices geopolitical risk premium. KKR believes the dollar has peaked but expects no disorderly unwind.", "url": "https://www.kkr.com/insights/mid-year-update-2026", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "PIMCO's Tiffany Wilding finds the June 2026 Fed meeting delivered one of the largest hawkish monetary policy surprises in recent history even though the policy rate was unchanged, yet longer-dated forward rates barely moved. She attributes this to a shift from demand-driven to supply-driven inflation shocks under new Fed Chair Kevin Warsh's lighter use of forward guidance, concluding short-rate volatility is likely to rise without necessarily hitting long-dated rates, reinforcing the case for high-quality bonds.", "url": "https://www.pimco.com/us/en/insights/when-monetary-policy-surprises-stop-translating", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "PIMCO's Marc Seidner and Pramol Dhawan argue new Fed Chair Kevin Warsh's shift toward less forward guidance, combined with today's higher starting yields, makes a strong case for high-quality fixed income. With the 10-year Treasury at ~4.55%, they estimate a growth scare or recession could push its one-year total return to 10% or more (up to ~20% in a severe recession), while investors are paid ~4.55% to wait.", "url": "https://www.pimco.com/us/en/insights/old-fashioned-bond-math-for-a-new-fashioned-fed", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Goldman's David Mericle expects the Fed to hold rates steady through the rest of 2026 with the first cut pushed to 2027, even though markets are pricing roughly a 50/50 chance of one to two more hikes (Goldman puts hike odds nearer 25%). He expects core PCE inflation to run around 20bp/month, soft enough for the Fed to look through tariff, war-driven oil, and AI-mismeasurement effects, with GDP growth near 2% versus Goldman's ~2.5% potential estimate.", "url": "https://www.goldmansachs.com/insights/goldman-sachs-exchanges/us-midyear-outlook-geopolitical-shocks-the-new-fed-era-and-growth", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas", "thesis": "BNP Paribas AM's Alaa Bushehri notes market pricing for Fed cuts has shifted from two cuts by year-end to zero cuts or possible hikes, pushing some EM central banks to delay planned easing into 2027. BNP remains constructive on local-currency EM debt given attractive real yields, but says tightened hard-currency credit valuations require disciplined, selective country selection.", "url": "https://www.bnpparibas-am.com/en-us/portfolio-perspectives/emerging-market-debt-established-resilience/", "images": []}, {"source": "citi_gps", "name": "Citi GPS", "thesis": "Citi's Rob Rowe and Veronica Clark discuss the Warsh Fed's shift away from explicit forward guidance and dot plots toward a more data-dependent, less predictable communication regime, adding to market volatility. Citi continues to expect the Fed's next move to be a rate cut rather than a hike, contingent on softer core CPI prints and a rise in the unemployment rate.", "url": "https://www.citigroup.com/global/insights/e84-the-warsh-fed-mind-the-data", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas", "thesis": "Chris Iggo argues renewed Middle East hostilities and the resulting oil-price spike (Brent +~20% in July) threaten to reverse June's cooling inflation (US headline CPI to 3.5% from 4.2%, core to 2.6% from 2.9%). Iggo prefers short-duration and credit (US IG yielding 5.3% vs. 3.5% inflation) over long-duration government bonds, and welcomes new Fed Chair Kevin Warsh's pledge to 'double down' on the 2% inflation target.", "url": "https://www.bnpparibas-am.com/en/front-of-mind/view-from-the-markets-get-real-bonds/", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas", "thesis": "BNP Paribas AM flags that Fed Chair Warsh's removal of forward guidance and the dot plot has pushed market pricing of the neutral rate to 3.5-4.0% versus the FOMC's own 3.0% estimate, keeping 10-year Treasury yields range-bound at 4.35%-4.65% absent a growth slowdown or clear inflation cooling. In the Eurozone the ECB retains a cautious tightening bias amid widening periphery risk premia; UK gilts remain exposed to fiscal-rule negotiations, with the BoE now holding rather than hiking.", "url": "https://www.bnpparibas-am.com/en/portfolio-perspectives/global-sovereign-bonds-watching-the-new-fed-chair/", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "UBS flags a second consecutive weekly decline in global equities as Brent tops $100/bbl on US-Iran tensions, pushing the 10-year US Treasury yield to 4.7% (highest since January 2025). UBS's base case is that energy flows recover over time and that June's cooling core CPI keeps the Fed from needing to hike further, and it maintains quality fixed income given expected falling yields.", "url": "https://www.ubs.com/us/en/wealth-management/insights/investment-research/insights-display-adp/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-24072026.html", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "UBS notes the 10-year Treasury yield at 4.66%, near its May peak of 4.68%, but continues to expect yields to drift lower over coming quarters because inflation expectations remain contained (10-year breakeven ~2.25% vs. 2.5% in May) and June's core CPI showed the first monthly decline in underlying inflation since 2020. UBS expects the Fed's next move to be a cut toward its ~3% neutral rate estimate and recommends the 2-5 year maturity segment.", "url": "https://www.ubs.com/us/en/wealth-management/insights/investment-research/insights-display-adp/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-23072026.html", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Standard Chartered expects major central banks to hold rates this month: the ECB held its deposit rate at 2.25%, keeping a hike option open later this year; the Fed is expected to hold at 3.5-3.75%; the BoJ is seen as having a rising chance of two hikes this year to support the yen. The bank flags US inflation-protected bonds as attractive given real yields near 2.4%, the highest since 2008.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-24-7-2026/?mvog=1&source=podcast", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "WTI surged 6.2% above $91/bbl on intensifying US-Iran conflict fears just as Trump announced new 10-12.5% tariffs effective that Friday. Markets are pricing a September Fed hike, but Standard Chartered expects the Fed to hold next week, with hike risk later this year contingent on oil pass-through. The ECB held its rate at 2.25% as expected; SC raises the odds of another 25bp hike later this year given Lagarde's flagged upside inflation risks.", "url": "https://www.sc.com/sg/market-outlook/daily-navigator-24-7-2026/?mvog=1", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "BoE MPC member Catherine Mann explains why she backed an 'activist hold' of Bank Rate at 3.75% in June 2026, citing mixed disaggregated data and household/firm inflation expectations moving into a 'non-linear' de-anchoring-risk region after the Iran conflict. She concludes her policy strategy has shifted toward 'a longer hold, and potentially a need to lean against' inflation risk.", "url": "https://www.bankofengland.co.uk/speech/2026/july/catherine-l-mann-fireside-chat-at-the-natixis-cib-conference-on-private-debt", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "BoE MPC member Alan Taylor defends the centrality of the Bank's forecast even as the April 2026 Monetary Policy Report moved to unweighted scenarios amid Iran-conflict uncertainty. Following a de-escalatory MoU, he now expects CPI inflation to peak around 3.25% later in 2026 (half a point below the April MPR's 3.75% projection). With Bank Rate 75bps above his neutral estimate, he argues an extended hold is correct now.", "url": "https://www.bankofengland.co.uk/speech/2026/june/alan-taylor-speech-at-the-barclays-and-centre-for-economic-policy-research", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "BoE Governor Andrew Bailey addresses the Hormuz/Iran-conflict oil and gas shock: UK inflation had been on track for the 2% target before the conflict, but April CPI printed 2.8% (0.8pp of upside surprise from energy) and is set to rise further this year. He confirms the MPC's hold of Bank Rate at 3.75% was an 'active choice,' looking through direct energy-shock effects but signaling a forceful response to any second-round wage-price effects.", "url": "https://www.bankofengland.co.uk/speech/2026/may/andrew-bailey-speech-at-the-reykjavik-2026-economic-conference", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "BoE MPC member Megan Greene examines the inflation risks from the Iran-conflict energy shock, outlining the price- and wage-setting channels through which energy shocks can generate persistent inflation and drawing lessons for assessing second-round effects and the appropriate monetary policy response.", "url": "https://www.bankofengland.co.uk/speech/2026/june/megan-greene-speech-at-university-of-derby-business-school", "images": []}, {"source": "ecb", "name": "European Central Bank", "thesis": "ECB staff contacts with 76 large euro-area companies (22 June-1 July 2026) reported moderate Q2 growth and around 40% of contacts seeing higher selling prices/margin compression in Q2, with petrochemical prices up 20-30% on oil pass-through. Wage growth expectations continue to decelerate: 3.1% in 2025, slowing to 2.5% in 2026 and 2.4% in 2027.", "url": "https://www.ecb.europa.eu/press/economic-bulletin/focus/2026/html/ecb.ebbox202605_05~8c25c55b38.en.html", "images": []}, {"source": "deutsche_bank", "name": "Deutsche Bank", "thesis": "Deutsche Bank's EMEA CIO Dr. Dirk Steffen flags that heavy AI-related debt issuance from big tech could be keeping sovereign bond yields elevated by crowding out demand, with investors favoring corporate IG bonds over government bonds. He previews the upcoming ECB meeting, where rates are widely expected to hold steady despite the recent rise in oil prices.", "url": "https://wealth.db.com/en/insights/investing-insights/cio-weekly-investment-outlook-podcast.html", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "Bitcoin fund flows swung positive (+$287M last week) after an eight-week, $8B outflow streak — the worst on record — as a downside CPI miss on July 14 and a PPI miss on July 15 caused markets to halve priced-in September rate-hike odds. CoinShares' James Butterfill argues bitcoin's floor is likely in but sees a break above $80,000 as unlikely without a bigger shift in monetary policy.", "url": "https://coinshares.com/insights/research-data/market-update-17-07-2026/", "images": []}, {"source": "brookings", "name": "Brookings Institution", "thesis": "Brookings' Robin Brooks and Kari Heerman flag Japan's long-term government bond yields rising sharply even as the yen keeps weakening — an 'alarming signal' amid G10-wide fiscal deterioration from defense build-ups and energy-price support — alongside Brent crude's rise since renewed Iran hostilities.", "url": "https://www.brookings.edu/articles/puzzles-in-the-world-economy/", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "Oxford Economics' nowcast projects headline US PCE inflation decelerating to 3.7% y/y in June from a peak above 4% in May, driven mainly by lower energy prices, even as core goods inflation stays elevated on an AI-driven memory chip shortage; the Fed is seen holding its current stance until late 2027.", "url": "https://www.oxfordeconomics.com/resource/us-pce-nowcast-past-the-oil-shock-peak/", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Gavekal observes that while nominal 20- and 30-year US Treasury yields remain within their three-year range, real yields on long-term TIPS have broken above their post-2008-crisis highs, and this rise is coinciding with US dollar appreciation rather than capital flight.", "url": "https://research.gavekal.com/teaser/the-meaning-of-higher-real-yields/", "images": []}]}, {"theme": "Growth & Recession", "category": ["growth"], "consensus": "The dominant street view remains 'resilient growth, no imminent recession.' Franklin Templeton frames 2026 around a 'Resilience' thesis -- global growth staying near trend on consumer spending, business investment and strong corporate profits -- while Deutsche Bank's quarterly outlook likewise expects robust global growth from solid consumption and investment. Goldman Sachs's David Mericle expects US GDP growth near 2% in 2026 as consumption cools in H2, but stresses the labor market has 'surprised to the upside' despite the Iran-war oil shock, with job growth running above the estimated 50-60k/month breakeven rate -- a reading corroborated by Bank of America Institute data showing payroll growth accelerating to an estimated 1.7% YoY in June 2026 and card spending up 6.3% YoY, the strongest in over four years. Delphi Digital explicitly states US growth leading indicators are resilient and recession probabilities low. Inflation is seen cooling gradually enough to keep central banks patient rather than panicked: Amundi and BNP Paribas both note US headline CPI cooled to 3.5% (core 2.6%) in June, and Oxford Economics' nowcast sees headline PCE decelerating to 3.7% y/y in June from over 4% in May, consistent with Goldman's and Oxford's expectation that the Fed holds through 2026. Capital Economics adds that AI-related investment now accounts for roughly one-third of US GDP growth over the past year, a structural growth tailwind layered on top of cyclical resilience.", "divergence": "The sharpest split is over whether resilient labor-market data means the Fed can simply sit tight, or whether cracks serious enough to force easing are already forming. Goldman Sachs (Mericle) argues the labor market has surprised to the upside despite the oil-price shock, with job growth above the 50-60k/month breakeven rate, and forecasts the Fed holds rates steady through all of 2026 with the first cut delayed to 2027 -- markets price roughly 50/50 odds of one-to-two more hikes, but Goldman puts the odds nearer 25%. Oxford Economics aligns with this resilient-labor read, seeing the Fed on hold until late 2027. Citi (Rob Rowe and Veronica Clark) takes the opposite side: it maintains its call that the Fed's next move will be a rate CUT, not a hike, explicitly contingent on softer core CPI prints AND a rise in the unemployment rate -- a labor-deterioration call that directly contradicts Goldman's above-breakeven, upside-surprise framing. A parallel divergence plays out on China: Gavekal's Andrew Batson argues that despite disappointing Q2 GDP growth of 4.3% (down from 5.0% in Q1, officially blamed on the oil shock and external factors), a major stimulus 'pivot' akin to September 2024 remains unlikely near-term, since Beijing still expects the Strait of Hormuz disruption to prove temporary -- even as securities regulators and state institutions stage coordinated stock purchases. Capital Economics is more alarmed, noting its own Activity Proxy already puts real Chinese growth closer to 3.2% y/y (well below the official 4.3%) and warning that structural demographic headwinds could cap Chinese growth at just 2%/year in the 2030s -- a genuine hard-landing-adjacent read rather than a one-off oil-shock blip.", "items": [{"source": "franklin_templeton", "name": "Franklin Templeton", "thesis": "Frames 2026 around 'Resilience': markets and economies have held up despite geopolitical shocks, policy uncertainty and rising inflation, with global growth staying near trend on consumer spending, business investment, productivity gains and strong corporate profits.", "url": "https://www.franklintempleton.com/insights/collections/global-investment-outlook-2026", "images": []}, {"source": "amundi", "name": "Amundi", "thesis": "Weekly note flags sector rotation picking up as earnings season begins. Notes US headline CPI cooled to 3.5% (core 2.6%) on falling energy and softer core services/goods prices, keeping the Fed likely on hold absent further Middle East escalation, while China's Q2 GDP growth slowed more than expected to 4.3% year-over-year from 5.0%.", "url": "https://research-center.amundi.com/article/rotations-are-playing-out", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "David Mericle's house view: the Fed holds rates steady through the rest of 2026, first cut pushed to 2027, even as markets price roughly 50/50 odds of one to two more hikes (Goldman puts hike odds near 25%). GDP growth lands close to 2% as consumption cools in H2. The labor market has surprised to the upside despite the Iran-war oil shock, with job growth running above the estimated 50-60k/month breakeven rate.", "url": "https://www.goldmansachs.com/insights/goldman-sachs-exchanges/us-midyear-outlook-geopolitical-shocks-the-new-fed-era-and-growth", "images": []}, {"source": "hsbc", "name": "HSBC", "thesis": "James Pomeroy argues aging, wealthier populations (the 'silver dollar') are a structurally larger driver of developed-market consumption: US over-65s' share of consumer spending rose from 18% (2014) to 22% (2024). HSBC expects real over-65 spending in developed markets to grow 4-5%/year over the coming decade versus ~1% for other adults.", "url": "https://www.business.hsbc.com/en-gb/insights/the-booming-silver-dollar", "images": []}, {"source": "citi_gps", "name": "Citi GPS", "thesis": "Rob Rowe and Veronica Clark discuss the Warsh Fed's shift away from explicit forward guidance and dot plots toward a data-dependent regime, adding to volatility. Citi maintains its call for the Fed's next move to be a rate cut rather than a hike, contingent on softer core CPI prints and a rise in the unemployment rate.", "url": "https://www.citigroup.com/global/insights/e84-the-warsh-fed-mind-the-data", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas", "thesis": "US annual inflation fell to 3.5% (core 2.6%) in June and Eurozone inflation to 2.8% (core 2.4%); China Q2 GDP growth slowed to 4.3%, its weakest pace since 2022 and below Beijing's 4.5-5.0% target, even as China's trade surplus tracks toward a second straight ~$1 trillion year.", "url": "https://viewpoint.bnpparibas-am.com/take-two-renewed-middle-east-hostilities-china-gdp-growth-falls/", "images": []}, {"source": "bofa", "name": "Bank of America", "thesis": "Small business profitability growth turned positive in June 2026 for the first time since the start of the year, though revenue growth still isn't fully offsetting cost pressures; small-business hiring also improved in June, suggesting AI has not yet dented white-collar hiring demand.", "url": "https://institute.bankofamerica.com/economic-insights/small-business-checkpoint-july-2026.html", "images": []}, {"source": "bofa", "name": "Bank of America", "thesis": "Account-data-based employment tracker shows payroll growth accelerating to an estimated 1.7% YoY in June 2026, broad-based across World Cup host and non-host cities, with unemployment-benefit receipts continuing to soften; lower-income households' after-tax wage growth rose to 4.1% YoY, nearly matching higher-income households' 4.2%.", "url": "https://institute.bankofamerica.com/economic-insights/monthly-employment-report-june-2026.html", "images": []}, {"source": "deutsche_bank", "name": "Deutsche Bank", "thesis": "Quarterly outlook expects robust global growth from solid consumption and investment: stable sequential US growth, German fiscal stimulus keeping Eurozone growth near potential, pro-growth policy supporting Japan, and continued Chinese policy support for strategic industries and households, though geopolitical tensions pose a drag.", "url": "https://wealth.db.com/en/insights/investing-insights/economic-and-market-outlook/perspectives-economic-and-asset-class-outlook-march-2026.html", "images": []}, {"source": "bofa", "name": "Bank of America", "thesis": "Total credit/debit card spending rose 6.3% YoY in June -- the strongest growth in over four years -- almost entirely discretionary as gasoline prices fell, partly boosted by online promotions and the FIFA World Cup 2026.", "url": "https://institute.bankofamerica.com/economic-insights/consumer-checkpoint-july-2026.html", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "BoE MPC member Catherine Mann explains why she backed an 'activist hold' of Bank Rate at 3.75% in June 2026: disaggregated data show mixed signals, with private-sector pay growth easing but public-sector wage growth keeping whole-economy pay elevated. GDP growth has been driven disproportionately by public-sector output, outpacing market-sector output by ~1pp.", "url": "https://www.bankofengland.co.uk/speech/2026/july/catherine-l-mann-fireside-chat-at-the-natixis-cib-conference-on-private-debt", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "Andrew Bailey states UK CPI has not returned to the 2% target as previously expected because of the Middle East conflict, but reiterates confidence it will get there. UK potential-supply growth fell from ~2.8%/year in the 15 years before the financial crisis to ~1.3%/year since.", "url": "https://www.bankofengland.co.uk/speech/2026/july/andrew-bailey-speech-at-manison-house", "images": []}, {"source": "ecb", "name": "European Central Bank", "thesis": "Staff contacts with 76 large euro-area non-financial companies reported moderate Q2 growth with broadly unchanged momentum expected in Q3, with growth composition shifting toward manufacturing and away from services; the Iran conflict lifted fuel prices and cut euro-area airport travel an estimated 2-4%.", "url": "https://www.ecb.europa.eu/press/economic-bulletin/focus/2026/html/ecb.ebbox202605_05~8c25c55b38.en.html", "images": []}, {"source": "federal_reserve", "name": "Federal Reserve", "thesis": "Fed Board staff propose a public-data dashboard tracking the generative-AI buildout: AI-related investment components contributed meaningfully to US GDP growth from 2025 through Q1 2026; aggregate labor productivity has not yet diverged between high-AI-exposure and low-exposure sectors, and the economy remains in an investment-led 'buildout' phase rather than broad-based labor displacement.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/the-ai-buildout-and-the-economy-publicly-available-data-to-assess-ais-impact-20260717.html", "images": []}, {"source": "delphi_digital", "name": "Delphi Digital", "thesis": "Scott Freeman argues the cyclical macro regime remains risk-on -- US growth leading indicators resilient, recession probabilities low, equity breadth broadening -- and that what's actually stretched is speculative positioning, making a positioning-driven volatility flush a dip to buy rather than the start of a bear market.", "url": "https://members.delphidigital.io/feed/bearish-speculation-not-growth-ai", "images": []}, {"source": "capital_economics", "name": "Capital Economics", "thesis": "Estimates AI-related activity now directly or indirectly accounts for more than half of China's quarter-on-quarter GDP growth in Q2 2026 and roughly one-third of US growth over the past year, even as China's official GDP growth slowed from 5.0% y/y in Q1 to 4.3% in Q2 (converging toward Capital Economics' own Activity Proxy of ~3.2% y/y); China's structural headwinds could cap growth at just 2%/year in the 2030s.", "url": "https://www.capitaleconomics.com/blog/ai-now-key-driver-growth-both-us-and-china", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "Nowcast projects headline US PCE inflation decelerating to 3.7% y/y in June from a peak above 4% in May, driven mainly by lower energy prices, even as core goods inflation stays elevated on an AI-driven memory chip shortage; the Fed is seen holding its current stance until late 2027.", "url": "https://www.oxfordeconomics.com/resource/us-pce-nowcast-past-the-oil-shock-peak/", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Andrew Batson argues that despite disappointing Q2 GDP growth (4.3%, blamed officially on the oil shock and external shocks) and flat-to-down Chinese equities, a major new stimulus 'pivot' akin to September 2024 remains unlikely for now, partly because Beijing still expects the Strait of Hormuz disruption to prove temporary.", "url": "https://research.gavekal.com/teaser/the-possibility-of-a-pivot/", "images": []}]}, {"theme": "USD & FX", "category": ["fx"], "consensus": "The dominant read this week is a firmer dollar underpinned by a geopolitical/oil shock and rising US real yields, with the debate centered on levels rather than direction. Standard Chartered (Daily Navigator, 24 Jul 2026) flags DXY resistance at 102 as WTI surged 6.2% to above $91/bbl on US-Iran conflict fears and the US 10-year yield pushed above 4.7% (up ~35bps since 29 June); it puts EUR/USD support at 1.1330 after the pair fell 0.3% on the ECB's hold at 2.25%, and in its Weekly Market View (also 24 Jul) sets USD/CNH support at 6.75 even if the PBoC cuts reserve requirements, while expecting USD/JPY to correct toward only 155-158, and only if the Fed-BoJ rate gap narrows (BoJ seen with rising odds of two hikes this year). Gavekal (16 Jul) independently corroborates the strong-dollar backdrop, noting long-term US TIPS real yields have broken above post-2008-crisis highs precisely as the dollar appreciates rather than sells off, calling into question the standard capital-flight explanation for higher real rates. On the structural side, participants at the Fed's Fifth Conference on the International Roles of the U.S. Dollar (16 Jul FEDS note) — including Governor Christopher Waller and Eswar Prasad — broadly agreed dollar dominance remains intact and that dollar-denominated stablecoins (whose transaction volumes now exceed Bitcoin's) are more likely to reinforce than erode that role, even as they open new shock-transmission channels into Treasury yields and FX. BNY's 23 July flow recap adds that EM currency and fixed-income exposure (e.g., Latin American FX) is rising within diversification flows, but cautions FX execution and settlement risk remain a genuine constraint on that trend.", "divergence": "The sharpest disagreement in this set is not a bull/bear USD call but a dispute over which policy lever actually moves currency and trade imbalances — and it cuts directly against the tariff-heavy strategy currently in play. PIIE's Joseph Gagnon and Nishtha Agrawal (23 Jul working paper) argue empirically that tariffs have \"little effect on aggregate trade balances,\" while fiscal policy and outright FX intervention are the real drivers: a $1 improvement in a country's fiscal balance raises its current account by about $0.30, and $1 of foreign-exchange reserve purchases raises it by roughly $0.50 or more — a direct challenge to the rationale behind both the Trump administration's tariff program and China's persistent surplus. That stands in tension with the on-the-ground policy trajectory Brookings documents (23 Jul tracker): since the Supreme Court's 20 February 2026 ruling invalidating IEEPA tariffs, the administration has simply rotated through Section 201, 301, 232 and 122 authorities to keep tariffs as its primary trade-adjustment tool (e.g., new 10-12.5% tariffs announced effective 24 July per Standard Chartered), rather than shifting toward the fiscal- or reserve-based levers PIIE identifies as more effective. A secondary, related tension: PIIE's Obstfeld (17 Jul) argues Argentina's peso regime lacks a credible nominal anchor and should float, while Standard Chartered's own base case leans on continued managed/intervention-style support for USD/CNH (support at 6.75) — i.e., one strand of the research favors letting currencies float to lock in credibility, while the desk view assumes continued authorities' intervention to defend levels. Beyond this, the dataset shows no genuine two-sided argument over whether the dollar itself goes up or down from here — StanChart, Gavekal and the Fed conference participants all point the same direction (firmer dollar, intact dominance).", "items": [{"source": "standard_chartered", "name": "Standard Chartered", "thesis": "24 July 2026 Weekly Market View: WTI above $90/bbl and Brent above $100/bbl on the Houthi Red Sea blockade and US-Iran tensions, with the 10-year yield above 4.7% (up ~35bps since 29 June); SC expects the Fed to hold at 3.5-3.75%, ECB to hold after keeping its deposit rate at 2.25%, and sees a rising chance of two BoJ hikes this year to support JPY. It sets USD/CNH support at 6.75 even amid possible PBoC reserve-requirement cuts, and expects USD/JPY to correct only toward 155-158, contingent on the Fed-BoJ rate gap narrowing.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-24-7-2026/?mvog=1&source=podcast", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "24 July 2026 Daily Navigator: WTI surged 6.2% to above $91/bbl on escalating US-Iran conflict fears as Trump announced new 10-12.5% tariffs on most trading partners effective that Friday; jobless claims fell to 187,000 (lowest since 1969). SC sees DXY resistance at 102 and expects the Fed to hold next week despite markets pricing a September hike. The ECB held its rate at 2.25%, but SC raises the odds of a further 25bps hike later this year on Lagarde's flagged inflation risks; EUR/USD fell 0.3% with support at 1.1330. Gold fell 2% to a support level of $3,950/oz as higher yields and a stronger dollar outweighed safe-haven demand.", "url": "https://www.sc.com/sg/market-outlook/daily-navigator-24-7-2026/?mvog=1", "images": []}, {"source": "federal_reserve", "name": "Federal Reserve", "thesis": "FEDS Note (16 Jul) on the Fed/NY Fed's Fifth Conference on the International Roles of the U.S. Dollar (22-23 June 2026): Governor Christopher Waller argued dollar dominance rests on US economic/financial strength and that stablecoin/DLT innovation should complement rather than threaten it; Eswar Prasad's keynote was skeptical digital currencies will meaningfully erode the dollar's role given network effects and the lack of credible alternatives. Dollar-denominated stablecoin transaction volumes now exceed Bitcoin's and are channeling demand into US Treasuries, but IMF-affiliated research found stablecoin demand shocks affect Treasury yields, exchange rates, equity prices and covered interest parity deviations, and a joint Fed/BIS paper flagged persistent cross-border dollar-funding risk.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/fifth-conference-on-the-international-roles-of-the-u-s-dollar-stablecoins-digital-payments-and-the-ir-of-the-usd-20260716.html", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "May 2026 LSE speech (published 21 Jul) by BoE MPC member Catherine Mann examines how the UK's current account deficit is financed by an offsetting financial account surplus, focusing on how energy shocks affect the trade deficit, how valuation effects shape the UK's net international investment position, and why a changing gilt investor base matters for monetary policy transmission and, implicitly, sterling.", "url": "https://www.bankofengland.co.uk/speech/2026/may/catherine-l-mann-speech-at-the-london-school-of-economics", "images": []}, {"source": "peterson_institute", "name": "Peterson Institute for International Economics", "thesis": "Maurice Obstfeld (17 Jul) warns Argentina's exchange-rate regime leaves monetary policy without a credible nominal anchor despite Milei's stabilization gains since December 2023 and continued US financial backing; he recommends transitioning to a floating exchange rate with inflation targeting ahead of the 2027 election to durably lock in the disinflation and fiscal gains.", "url": "https://www.piie.com/publications/working-papers/2026/argentina-challenge-and-opportunity", "images": []}, {"source": "peterson_institute", "name": "Peterson Institute for International Economics", "thesis": "Joseph Gagnon and Nishtha Agrawal (23 Jul working paper) find fiscal and exchange-rate policy dominate trade-imbalance outcomes: a $1 improvement in fiscal balance raises the current account by about $0.30, while $1 of FX reserve purchases raises it by roughly $0.50 or more, whereas tariffs have little effect on aggregate trade balances — a direct challenge to the logic behind the ongoing Trump-era tariff push and China's persistent surplus.", "url": "https://www.piie.com/publications/working-papers/2026/how-buy-trade-surplus", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Gavekal (16 Jul) observes that while nominal 20- and 30-year US Treasury yields remain within their three-year range, real yields on long-term TIPS have broken above their post-2008-crisis highs, and this rise is coinciding with dollar appreciation rather than capital flight — reframing the usual explanation for why real rates are climbing.", "url": "https://research.gavekal.com/teaser/the-meaning-of-higher-real-yields/", "images": []}, {"source": "brookings", "name": "Brookings Institution", "thesis": "Brookings' updated tariff/trade tracker (23 Jul) shows US tariff policy has been in sustained volatility since 2018, especially since January 2025, with the Supreme Court's 20 February 2026 ruling invalidating IEEPA tariffs forcing a rotation through Section 201, 301, 232 and 122 authorities. Primary metal manufacturing imports jumped from $9.5bn to $43.7bn in January 2025 ahead of Section 232 steel/aluminum tariffs, with a similar surge before the August 2025 copper tariffs, and Canada's average tariff rate has repeatedly re-spiked as new IEEPA, copper and auto Section 232 duties layered on.", "url": "https://www.brookings.edu/articles/tracking-trade-amid-uncertain-and-changing-tariff-policies/", "images": []}, {"source": "bny", "name": "BNY", "thesis": "BNY's 23 July flow recap cites internal iFlow data showing US bonds still comprise over 70% of global fixed-income holdings under custody, alongside recent diversification flows into EM energy/commodity equities, South Korean and Taiwanese AI stocks, and Latin American fixed income and FX; EM assets under custody grew three times faster than developed markets in Q1 2026, though BNY cautions EM investing still requires careful management of FX execution, settlement risk and liquidity.", "url": "https://www.bny.com/corporate/global/en/insights/dissecting-international-investment-trends-during-volatile-times.html", "images": []}]}, {"theme": "Equities", "category": ["equities"], "consensus": "Most houses stay constructive on equities into H2 2026, arguing the rally is earnings-led rather than multiple-driven and that leadership is broadening beyond the Magnificent Seven/semiconductors. UBS forecasts Q2 S&P 500 EPS growth of 28% (fastest pace in four-plus years outside a recession rebound), full-year 2026 profit growth of 20%, sees roughly 10% 12-month upside for the MSCI ACWI, and has upgraded Eurozone equities and India to Attractive while staying overweight Japan, China and Southeast Asia. BNP Paribas AM's Nadia Grant pegs Q2 S&P 500 earnings growth at 22% (energy >2x, tech ~60%, margins expanding from 13.5% to just under 15%), Europe near 12%, Japan near 12%, and EM above 60%. Schroders rates US, Europe ex-UK, global/EM and EM Asia ex-China equities Green, noting the Magnificent Seven's S&P weight has eased from a peak of ~33-34% to ~31% as ~25% y/y EPS growth broadens into financials, industrials, materials and energy. Franklin Templeton upgraded its equities view on July 10 citing strong earnings and resilient growth; Putnam's Shep Perkins notes S&P consensus EPS estimates rose from roughly $265 to about $340 (+30%) over the past year while the forward P/E actually contracted -- evidence the move is earnings-, not multiple-, driven. Citi calls it a 'narrow broadening' (+10% YTD) and has upgraded Japan to overweight on its AI leverage; Standard Chartered stays Overweight US technology and communication services and bullish on Japan and European ex-UK financials. Goldman's Ben Snider, CEO David Solomon and chief strategist Peter Oppenheimer likewise stay constructive, alongside Vanguard's near-term constructive stance on the deepening AI capex cycle.", "divergence": "The sharpest fight is whether AI-driven equity gains -- and the July sell-off in EM tech hardware/semiconductors -- reflect a healthy, earnings-justified expansion or a stretched, increasingly debt-financed bubble nearing its limits. Bulls dismissing bubble fears: Goldman's Vincent Lin calls the sharpest tech de-grossing in the prime book's history (the high-beta momentum basket down 32% from its highs, still +16% YTD) a 'healthy reset, not a loss of conviction,' and recommends buying the dip in US AI infrastructure equipment names near two-year-low valuations via call spreads. BNP Paribas AM's Daniel Morris and Nadia Grant argue the 15.6% EM tech-hardware/semiconductor drop is technical profit-taking, not an AI bust: contagion has been limited (US hardware/semis -5.8% from highs, still +36% YTD), forward earnings estimates have stayed steady, and valuations don't look excessive. Vanguard frames the Magnificent Seven's roughly flat H1 2026 return (-1% versus the S&P 500's +9%) as healthy rotation into a broader ~45-company AI complex that returned ~100% in H1, and Goldman CEO David Solomon insists the AI-and-capital-formation supercycle remains 'early innings,' with $9 trillion still parked in US money-market funds. Bears turning more cautious: Capital Economics -- 'among the most bullish forecasters on US equities for three years' -- has now turned cautious, arguing the AI-driven US tech rally is 'far more advanced than the macro benefit cycle.' Bank of England Deputy Governor Sarah Breeden warns that stretched AI-linked US tech valuations are increasingly financed by debt rather than equity and cash, compounding leverage risks already visible in gilt repo and the ~$18 trillion private-credit/markets complex. PIMCO's Marc Seidner and Pramol Dhawan call US equity concentration (the top-10 S&P 500 issuers ~39% of the index) an 'illusion of diversification' and argue 10-year Treasuries at ~4.55% now offer better risk/reward. Bridgewater's Karen Karniol-Tambour says markets are still pricing the AI buildout phase rather than the harder adoption phase that follows, and that most investors are overweight US equities and poorly positioned for what comes next. Man Group's Matt Rowe argues the VIX (16-19, versus roughly 30 for real panic) looks complacent given AI 'mini-tantrums' and pairwise stock correlation down more than 60% this year, comparing the mood to the late-1990s telecom buildout and the calm before the 2007 crisis.", "items": [{"source": "ubs", "name": "UBS", "thesis": "UBS sees ~10% 12-month upside for the MSCI All Country World Index on broad earnings strength, forecasts 92% 2026 / 40% 2027 EPS growth for the Philadelphia Semiconductor Index and 12% median S&P 500 earnings growth across all 11 sectors, and has upgraded Eurozone equities and India to Attractive while favoring Japan, China and Southeast Asia.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-17072026.html", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "UBS forecasts 28% S&P 500 EPS growth for Q2 (contributing to 20% full-year 2026 profit growth), with nearly 90% of reporters beating estimates by a median 8.8%, but flags Middle East risk and AI-capex durability concerns as reasons to diversify into defensive tech, Europe and Asia rather than concentrate in AI winners.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-20072026.html", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "Matthew Tormey expects S&P 500 Q2 profit growth to accelerate to 28%, the fastest pace in more than four years outside a recession rebound, with growth broad-based beyond semiconductors on improving manufacturing and resilient consumer spending.", "url": "https://www.ubs.com/us/en/wealth-management/insights/ubs-studios/2026/earnings-momentum-builds-this-q2.html", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "Ahead of Alphabet's Q2 report, UBS frames three swing factors for the AI trade -- hyperscaler capex trajectory into 2027, durability of AI-driven cloud/advertising/search revenue, and margin resilience -- and recommends balanced exposure across semiconductors, hardware, megacap tech and defensive tech rather than concentrated AI bets.", "url": "https://www.ubs.com/us/en/wealth-management/insights/investment-research/insights-display-adp/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-22072026.html", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "UBS attributes the sell-off in Samsung and SK Hynix, which dragged the Philadelphia Semiconductor Index down ~15%, to Korean regulatory action against leveraged single-stock ETFs rather than fundamentals, and remains constructive on semis given strong TSMC and ASML earnings.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-16072026.html", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "UBS flags a second consecutive weekly decline in global equities as Brent tops $100/bbl and the 10-year Treasury yield hits 4.7%; Alphabet fell over 7% after raising 2026 capex guidance to $195-205bn and posting negative free cash flow for the first time. UBS recommends capital preservation strategies while maintaining broadened equity exposure.", "url": "https://www.ubs.com/us/en/wealth-management/insights/investment-research/insights-display-adp/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-24072026.html", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas", "thesis": "Nadia Grant forecasts 22% Q2 S&P 500 earnings growth (energy >2x, tech ~60%, margins expanding from 13.5% to just under 15%; Europe ~12%, Japan ~12%, EM >60%) and, despite a 16% pullback in EM tech hardware, does not see an AI bust, recommending staying long AI infrastructure/semis and adding defence and copper/aluminum resource-independence plays.", "url": "https://viewpoint.bnpparibas-am.com/talking-heads-global-equities-earnings-expectations-remain-strong/", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas", "thesis": "Daniel Morris argues the 15.6% drop in EM tech hardware/semiconductor stocks is a technical reset, not an AI bubble bursting: contagion has been limited, Korean outflows were led by foreign investors rebalancing while local retail/US ETFs kept buying, and forward earnings estimates have stayed steady.", "url": "https://viewpoint.bnpparibas-am.com/view-from-the-markets-whats-the-meaning-of-the-emerging-market-tech-stock-sell-off/", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Vincent Lin says hedge funds remain fundamentally bullish on AI despite the sharpest tech de-grossing in the prime book's history. He calls it a 'healthy reset,' notes buying has resumed, and recommends buying the dip in US AI infrastructure equipment names near two-year-low valuations via call spreads.", "url": "https://www.goldmansachs.com/insights/the-markets/are-hedge-funds-still-bullish-on-ai-stocks", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "David Solomon said Goldman's Q2 net revenue rose 39% YoY and earnings 78% YoY, driven by an AI-and-capital-formation supercycle he called 'early innings,' not a bubble, citing $9 trillion in US money-market funds available to fund further AI capex.", "url": "https://www.goldmansachs.com/insights/videos/cnbc-david-solomon-2q-earnings-deal-making-and-ai-investment", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Peter Oppenheimer argues markets have entered a 'post-modern cycle' rewarding capital-intensive, tangible-asset ('HALO') companies, with the biggest AI providers projected to spend ~$755bn on capex in 2026 and ~$920bn in 2027, cascading into growth for industrials, materials and energy suppliers.", "url": "https://www.goldmansachs.com/insights/articles/what-the-capex-boom-means-for-stock-investors", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Ben Snider highlights consumer-experience stocks, undervalued 'compounder' stocks and M&A candidates (US M&A volume +32% YoY to $1.2 trillion in 2026) as themes with minimal correlation to AI infrastructure after momentum-factor volatility hit a 45-year high.", "url": "https://www.goldmansachs.com/insights/articles/three-new-stock-themes-are-in-focus-as-the-ai-trade-gyrates", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "thesis": "Putnam's Shep Perkins argues equities are being driven higher by genuine earnings growth: S&P 500 consensus EPS rose from ~$265 to ~$340 (+30%) over the past year while the index rose from ~6,000 to more than 7,400 and the forward P/E actually contracted, though he warns rising capital intensity makes companies harder to value.", "url": "https://www.franklintempleton.com/articles/2026/putnam/the-price-of-admission-further-equity-upside-comes-with-a-cost-volatility", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "thesis": "Franklin Templeton Investment Solutions' July 10, 2026 Allocation Views upgraded equities citing strong earnings, resilient growth and improving energy-market conditions despite inflation risks.", "url": "https://www.franklintempleton.com/insights/collections/global-investment-outlook-2026", "images": []}, {"source": "schroders", "name": "Schroders", "thesis": "Schroders' Multi-Asset team remains positive on equities overall (US, Europe ex-UK, global/EM and EM Asia ex-China rated Green) despite stretched valuations, is less positive specifically on US technology while staying constructive on energy and mining shares.", "url": "https://www.schroders.com/en-us/us/individual/insights/our-multi-asset-investment-views-july-2026/", "images": []}, {"source": "schroders", "name": "Schroders", "thesis": "Schroders' fixed income team says US equity leadership is broadening beyond the Magnificent Seven, whose S&P 500 weight has eased from a peak of ~33-34% to ~31%, with early Q3 earnings pointing to ~25% y/y S&P 500 EPS growth spreading into financials, industrials, materials and energy.", "url": "https://www.schroders.com/en-us/us/individual/insights/weekly-bond-market-update-from-superstars-to-team-performance/", "images": []}, {"source": "citi_gps", "name": "Citi GPS", "thesis": "Beata Manthey and David Groman describe a 'narrow broadening' in global equities (+10% YTD) beyond the AI/tech trade and highlight Citi's upgrade of Japan to overweight on its leverage to the AI investment cycle and favorable cyclical growth.", "url": "https://www.citigroup.com/global/insights/markets-edition-back-to-the-broadening", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Standard Chartered stays Overweight US technology and communication services heading into Big Tech earnings (65.6% y/y Q2 EPS growth expected for US tech), is bullish Japan and European ex-UK financials on rising net interest margins and BoJ hikes.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-24-7-2026/?mvog=1&source=podcast", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "Marc Seidner and Pramol Dhawan argue higher starting yields make a strong case for bonds: with the 10-year at ~4.55%, a growth scare could push its one-year total return to 10%+. They call US equity concentration (top-10 S&P issuers ~39% of the index) an 'illusion of diversification.'", "url": "https://www.pimco.com/us/en/insights/old-fashioned-bond-math-for-a-new-fashioned-fed", "images": []}, {"source": "bridgewater", "name": "Bridgewater Associates", "thesis": "Bridgewater Co-CIO Karen Karniol-Tambour said most investors are overweight US equities and underweight real assets, arguing markets are still pricing the AI buildout phase rather than the adoption phase that follows.", "url": "https://www.bridgewater.com/research-and-insights/karen-karniol-tambour-on-investing-in-a-more-fragmented-world", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "BoE Deputy Governor Sarah Breeden warns that stretched AI-linked US tech valuations, alongside record hedge-fund leverage in gilt repo and rapidly grown private markets, could crystallise together; AI firms are expected to invest over $5 trillion over five years, increasingly financed by debt.", "url": "https://www.bankofengland.co.uk/speech/2026/april/sarah-breeden-at-the-program-on-international-financial-systems-and-harvard-law-school", "images": []}, {"source": "man_group", "name": "Man Group", "thesis": "Matt Rowe argues the VIX (16-19, well short of the ~30 level signaling real panic) looks complacent given AI 'mini-tantrums,' the restarted Iran war, and pairwise stock correlation down more than 60% this year, comparing the mood to the late-1990s telecom buildout and the calm before the 2007 crisis.", "url": "https://www.man.com/insights/views-from-the-floor-2026-21-July", "images": []}, {"source": "amundi", "name": "Amundi", "thesis": "Amundi's weekly note says sector rotation is picking up beneath calm headline markets, with investors rotating within the AI trade away from expensive semiconductors toward infrastructure, power and applications, helping financials and defensives lead.", "url": "https://research-center.amundi.com/article/rotations-are-playing-out", "images": []}, {"source": "capital_economics", "name": "Capital Economics", "thesis": "Capital Economics -- long among the most bullish forecasters on US equities -- is turning more cautious, arguing the AI-driven US tech rally is far more advanced than the macro benefit cycle and that elevated earnings expectations will be hard to sustain.", "url": "https://www.capitaleconomics.com/blog/ai-now-key-driver-growth-both-us-and-china", "images": []}, {"source": "ned_davis_research", "name": "Ned Davis Research", "thesis": "NDR finds the S&P 500 has diverged from its typical midterm-election-year seasonal pattern this spring, driven by the Iran conflict, surging AI-related capex and a new Fed chair rather than the election itself, suggesting further market consolidation into the fall is a realistic scenario.", "url": "https://info.ndr.com/ndr-signals/iran-pushed-the-sp-500-off-typical-midterm-course?hsLang=en", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Gavekal notes US after-tax non-financial corporate profit margins held at 7.6% in Q1 2026, just below the post-1949 high of 8.2% in Q2 2021, defying expectations that rising labor costs, tighter immigration and tariffs would compress margins.", "url": "https://research.gavekal.com/teaser/are-us-corporate-profit-margins-too-high/", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "BCA Research's Portfolio Construction team recommends overweighting private equity, rotating out of momentum stocks into quality and hyperscalers, and downgrading late-stage venture capital.", "url": "https://www.bcaresearch.com/marketing/webcasts/quarterly-outlook-portfolio-construction/221556", "images": []}, {"source": "bny", "name": "BNY", "thesis": "BNY's base case is 'muddling through' as renewed Strait of Hormuz hostilities push oil into backwardation, favoring Japan and emerging-market ex-China equities, real assets, and value-oriented stocks as better positioned to withstand oil-driven volatility.", "url": "https://www.bny.com/investments/us/en/individual/articles/markets-and-economy/middle-east-conflict-re-escalation-takes-portfolio-volatility-higher.html", "images": []}, {"source": "delphi_digital", "name": "Delphi Digital", "thesis": "Scott Freeman argues the cyclical macro regime remains risk-on and that what's stretched is speculative positioning, making a positioning-driven volatility flush a dip to buy rather than a bear-market start; for a tactical short he favors Japan and the UK.", "url": "https://members.delphidigital.io/feed/bearish-speculation-not-growth-ai", "images": []}]}, {"theme": "Credit", "category": ["credit"], "consensus": "The dominant view across asset managers is that corporate credit spreads — both US/European investment grade and high yield — are historically tight to rich, leaving little room for further compression, even though elevated all-in yields still make credit attractive versus government bonds on a carry basis. Schroders is the most explicit and repeats the call across three separate July notes: its Multi-Asset team (July 24) holds a negative view on US and European corporate credit and high yield given tight spreads while upgrading US investment-grade credit only to Neutral and turning tactically positive on the 10-year Treasury for the first time since November 2023; its US Multi-Sector Fixed Income team (July 16) sees \"limited scope for further spread tightening\" against roughly $1.2 trillion of expected 2026 IG issuance (about 30% ahead of 2025's pace) and holds a \"low, defensive\" corporate-credit allocation, preferring agency MBS, structured municipals and EM debt instead; and its fixed income team (July 22) flags corporate spreads as \"historically tight with limited room for further compression\" and early stress in lower-rated high yield and private credit. BNP Paribas' Olivier Monnoyeur corroborates this in European HY, where spreads compressed 54bp to 315bp in Q2 (record ~EUR49bn quarterly issuance) with yields at 5.74%, prompting him to flag \"less room for error\" and rotate toward single-B over high-BB credit and defensive sectors (telecom, healthcare, real estate). BNP's Chris Iggo and John Carey both frame credit's edge as carry rather than spread upside — US IG yielding 5.3% versus 3.5% CPI, agency MBS spreads near +100bp having tightened from March's wides to where BNP is now neutral on further compression. PIMCO's Lotfi Karoui (July 20) adds that credit looks mechanically \"rich\" versus Treasuries mainly because 10-year swap spreads are persistently negative, not because of a genuine valuation shift, and that spread dispersion — not the swap-Treasury basis — remains the real source of active-manager alpha.", "divergence": "The sharpest fight is over whether the private-credit and leveraged-finance boom is healthy mid-cycle maturation or an emerging systemic risk. On the constructive side, PIMCO's Lotfi Karoui (July 16 podcast) argues the direct-lending stress that began in late 2025 is \"cyclical, not systemic,\" and KKR's Matt Salem makes an aggressive relative-value case for senior secured CRE debt specifically — not distressed equity — after property values fell roughly 20-30% from peak, with KKR's origination pipeline running about $40 billion per week (70% refinancing, 30% acquisition) in $100 million-plus multifamily and industrial loans. Franklin Templeton's Benefit Street Partners similarly pushes back on blanket bearishness, arguing lenders should underwrite each software borrower's competitive moat rather than treat \"AI exposure\" as a binary bubble signal, noting that even AI-disrupted public names (insurance brokers) saw sharp selloffs reverse once entrenched workflows proved harder to displace than feared. Schroders' fixed income team goes further on the AI financing angle specifically, calling the surge in hyperscaler bond issuance ($182 billion year-to-date through July versus $13 billion a year earlier) \"more opportunity than bubble\" given strong balance sheets and contracted, non-speculative demand. On the bearish side, Man Group's Q3 2026 outlook reports private-credit non-accruals running \"well above official default rates,\" concentrated in software, with a further public default wave expected once the 2027-2028 maturity wall hits, and flags the CCC/BB credit spread ratio near an all-time high of about 4.5x as evidence dispersion is already widening beneath the surface. Bank of England Deputy Governor Sarah Breeden delivers the starkest systemic warning: private markets AUM has grown roughly six-fold since the 2008/09 low-rate era to about $18 trillion alongside weakening underwriting standards, a recent string of defaults (MFS, Tricolor, First Brands Group), and rising redemption pressure at retail private-credit funds — risks she says could crystallize alongside record hedge-fund gilt-repo leverage and stretched AI-linked valuations. Notably, even Karoui's own PIMCO piece hedges toward the bearish camp by flagging that a corporate default cycle \"has begun\" and that financial-engineering excess (leveraged ETFs, CLOs referencing illiquid assets) is re-emerging in ways that echo pre-GFC interconnectedness, with BDC mark dispersion between optimistic and pessimistic managers running six to seven points — underscoring that the boom-versus-bubble question is contested even within single shops, not just across them.", "items": [{"source": "schroders", "name": "Schroders", "thesis": "US fixed income team says corporate credit spreads are historically tight with limited room for further compression, flags early stress in lower-rated high yield and private credit, and favors government bonds, securitized credit, municipals and selected EM debt over corporate credit risk, believing markets are too hawkish on the Fed's medium-term path.", "url": "https://www.schroders.com/en-us/us/individual/insights/weekly-bond-market-update-from-superstars-to-team-performance/", "images": []}, {"source": "schroders", "name": "Schroders", "thesis": "Multi-Asset team turned tactically positive on the US 10-year Treasury for the first time since November 2023 and upgraded government bonds to Long/positive an
