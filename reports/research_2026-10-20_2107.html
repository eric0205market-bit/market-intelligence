<script>
const ITEMS = [{"id": 1, "cat": "positioning", "urgency": "act", "source": "Dark Side of the Boom (BofA Global Equity Vol Insights)", "title": "BofA: the defensive hiding place now screens as a bubble — US healthcare BRI at ~0.8, Coca-Cola near the top", "idea": "BofA's Bubble Risk Indicator (returns, realised vol, momentum, fragility; 0.8 = warning, 7 of 8 historical bubbles crossed it before peaking) has US healthcare near 0.8, energy and staples ~0.67, tech only ~0.5. Moderna leads the S&P 500, then Coca-Cola, Revvity, Zebra; healthcare is ~half the top names. Only 13 S&P names are >0.8 (2.8% of cap) vs 50-100 names / 20-40% of cap at the dotcom peak. Hedge funds entered the rotation underweight healthcare, so rebuilding it created forced buying.", "angle": "The AI unwind trade has a second leg: the hedge becomes the crowded position. Tweetable because Coca-Cola on a bubble list is an instantly legible image.", "tweetA": "Coca-Cola is on a bubble-risk list and Nvidia isn't. Last week's rotation didn't reduce risk, it moved it. 13 names above 0.8 is nothing like 2000, but 'defensive' just became a momentum factor. $KO $XLV $XLP", "tweetB": "Everyone spent three years asking who would be the last buyer of AI. Nobody asked who's the last buyer of staples at a bubble-risk score. Hedge funds were underweight healthcare going in — that's not conviction, that's a cover bid.", "charts": {"count": 0, "hot": false, "desc": "BRI by sector bar chart likely in BofA note; charts inside — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/the-safety-trade-gets-crowded-wall"}, {"id": 2, "cat": "positioning", "urgency": "act", "source": "Dark Side of the Boom / BofA Equity Vol Insights", "title": "VIX complex short gamma at 96th percentile — a 10pt VIX futures move needs hedging equal to ~90% of a normal day's futures volume", "idea": "Friday: VIX +6 intraday toward 22 on an S&P drop of ~1.5%, closing 19.99 vs 14.84 a week earlier, after 53 sessions without a -1% day. The VIX minus 1M ATM implied spread blew out (tail demand, not ATM). BofA puts short gamma in VIX ETPs/options at the 96th percentile since 2014. Calls it a 'mini-fragility event'.", "angle": "Connects the calm-index/violent-factor story to mechanics: low realized vol is exactly what loads the spring. Pairs with Bespoke's S&P <3% October range.", "tweetA": "53 sessions without a -1% day, then VIX goes 14.84 to 19.99 in a week on a -1.5% print. When short gamma is at the 96th percentile the index doesn't need a reason, it needs a trigger. The calm WAS the positioning.", "tweetB": "Do the math BofA gave: +10 vol points in front-month VIX futures = ~90% of an average day's futures volume in dealer hedging. That's not a risk model, that's a queue. Who's at the front of it when the next -1.5% comes?", "charts": {"count": 0, "hot": false, "desc": "VIX vs S&P beta chart, VIX-ATM spread chart likely in source note"}, "link": "https://thedarksideoftheboom.substack.com/p/the-safety-trade-gets-crowded-wall"}, {"id": 3, "cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom / BofA Equity Vol Insights", "title": "BofA's relative-value expression: long XLP/XLV puts vs short XLK puts for a net credit — defensive vol is at the 20th percentile", "idea": "XLP and XLV implied vol relative to XLK sits around the 20th percentile. Trade 1: buy XLP Nov 85 puts, sell XLK Nov 175 puts (~2.1:1) for 0.23% credit; Trade 2: XLV Nov 170 puts vs XLK 175 puts (~1.05:1) for 0.20% credit. Risk: short XLK puts if the AI selloff continues. BofA still prefers a Sep-2027 max-lookback Nasdaq put contingent on falling 10y yields; last week NDX -5.5% came with 10y -16bp.", "angle": "Shows the crowding thesis priced as a trade, with the obvious flaw (you're short the thing that's been falling).", "tweetA": "Market is paying up for protection on the sector that's been falling and charging nothing for protection on the sectors that rallied on the fall. BofA's trade is selling the first to fund the second. It works until it's the same fall.", "tweetB": "Last week: NDX -5.5%, 10y -16bp. That's the cross-asset signature of an AI capex scare plus a growth scare. A put that only pays if yields fall at the same time is a much better description of the real risk than 'tech down'.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-safety-trade-gets-crowded-wall"}, {"id": 4, "cat": "AI/infra", "urgency": "act", "source": "Dark Side of the Boom / BofA Equity Vol Insights", "title": "The AI selloff is a balance-sheet story: CoreWeave and Nebius -20-25% on the week while hyperscalers traded near beta", "idea": "Nasdaq -5%+ and SOX -10%+ last week, the worst since Liberation Day; semis fell 8 straight sessions, matching the longest streak since 2006. BofA's actual-vs-beta decomposition shows the damage concentrated in high-beta, leveraged names (CRWV, NBIS -20 to -25%, far worse than beta implied), not in mega-cap tech. Defensive-vs-tech 5-day gap is at levels last seen in the dotcom era.", "angle": "Supports a 'cost of capital, not demand' reading, which is the thing to test against credit spreads and SoftBank CDS (see Mando).", "tweetA": "SOX -10% in a week, 8 straight down days, longest since 2006. And the hyperscalers barely moved vs beta. That isn't a demand scare. It's the market repricing who funds the buildout at what rate. Watch the borrowers, not the buyers. $CRWV $NBIS", "tweetB": "Defensives vs tech over five days is at dotcom-era extremes while the S&P is down low single digits. Ownership is changing hands faster than risk is being removed. Those are different things and they unwind differently.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-safety-trade-gets-crowded-wall"}, {"id": 5, "cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom (Goldman FICC & Equities, J. Malmstrom)", "title": "Goldman: quality is back as the market's real leadership — hedge funds cut AI hard, one positioning measure says it isn't done", "idea": "Goldman's Malmstrom shows investors rewarding durable margins, cash generation and balance sheets that survive a higher cost of capital rather than growth narrative. Hedge funds have aggressively reduced AI complex exposure, though one positioning metric suggests the adjustment is incomplete. Flags an approaching shift in AI capex economics that credit may already be pricing. (Email body truncated after intro.)", "angle": "Companion to the BofA read: both banks say positioning, but GS adds that credit may be ahead of equity.", "tweetA": "Record highs in the index, and underneath it the market is paying for balance sheets, not stories. If credit has already seen the capex shift that equity is just starting to discuss, you know which one to trust. Quality isn't defensive here, it's a view on rates.", "tweetB": "Two bank notes in one afternoon: BofA says the AI unwind is positioning, Goldman says the unwind isn't finished. Both can be true. 'Not a collapse' and 'not over' is the most dangerous combination for a crowded long.", "charts": {"count": 0, "hot": false, "desc": "Goldman charts likely in note; charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/the-quality-trade-is-back-what-wall"}, {"id": 6, "cat": "credit", "urgency": "act", "source": "Young & Calculated", "title": "Hedge funds are >50% of euro-area government bond volume; French 10y at ~4.9%, OAT-Bund 140-150bp", "idea": "ECB data: hedge funds are more than half of secondary-market volume and of dealer auction requests across DE/FR/IT/ES, largely leveraged relative-value via repo. French liquidity hit its worst since 2008 in early October; Reuters cited a ~25bp two-day spread widening, the largest since the euro crisis. Mechanism: VaR uses recent vol, so a spread shock doubles risk, forcing ~50% position cuts; repo haircuts add a second constraint; 'right trade, forced exit'.", "angle": "Sovereign bonds are now a vol-targeted trade. This is the plumbing behind why French selling looked bigger than the fiscal news.", "tweetA": "Hedge funds are more than half of euro govvie volume. A pension fund holds a French bond through a 20bp move. A relative-value fund with repo and a VaR limit can't. That's why OATs moved faster than the fiscal news justified.", "tweetB": "Doubling realised vol halves the position a VaR-constrained fund can hold, whatever its conviction. The thesis can be right, the spread can be cheaper, and the fund still has to sell. That's what 'liquidity spiral' means in practice. $FXE", "charts": {"count": 0, "hot": false, "desc": "DV01 / VaR worked examples in text; no charts"}, "link": "https://youngandcalculated.substack.com/p/when-hedge-funds-become-half-the"}, {"id": 7, "cat": "AI/infra", "urgency": "deep", "source": "Pragmatic Engineer (Gergely Orosz)", "title": "A quant shop's AI spend went $500K to $8M/month in 8 months — with a $25,000 per-employee cap", "idea": "From 27 companies: a ~2,000-dev quant firm hit $8M/month in September (16x January), $1,600/dev avg (from ~$80), biggest spenders are traders not devs; internal GPU/CPU farms and in-house models targeting SOTA. ROI is judged by desk P&L, so AI is just cost base. Other bands: $3,000/dev/month for a 2-person .NET shop doing ~60 PRs/dev/week; $1,000-4,000 caps at big companies.", "angle": "Cleanest data point yet on who captures AI productivity: firms where output maps directly to P&L have no ROI debate.", "tweetA": "A trading firm went from $500K to $8M a month on AI in eight months and nobody asked for a business case, because desk P&L is the ROI. Everyone else is still debating PR counts. That gap is the real adoption curve.", "tweetB": "The biggest AI spenders at the quant firm aren't engineers, they're traders. $25K per-head cap, higher than Nvidia's. If you wonder where the 'AI-native' alpha shops are, they just told you in their expense line.", "charts": {"count": 3, "hot": false, "desc": "CodeRabbit weekly/monthly PR charts (+113% to +128%), Gitar PRs/dev/week tiers"}, "link": "https://newsletter.pragmaticengineer.com/p/whats-the-roi-of-software-engineers"}, {"id": 8, "cat": "AI/infra", "urgency": "deep", "source": "Pragmatic Engineer (Gergely Orosz)", "title": "AI coding spend peaked in summer and roughly halved on API plans; subsidised subscriptions ending means 5-10x bills", "idea": "June/July was peak monthly spend at nearly all companies; costs roughly halved for API users thanks to Opus 5.5 and a move to open models. Several firms flagged that subsidised subscriptions are ending, so they either optimise or face 5-10x bills. Company size and spend are unrelated ($150 cap at a 1,500-engineer public company vs $3,000/dev at a 2-person shop). Caps are common and easily avoided.", "angle": "Token deflation vs subsidy withdrawal: two opposing forces on AI demand/revenue that headline capex numbers hide.", "tweetA": "Per-seat AI coding spend peaked in July and halved since — model efficiency plus open weights. Meanwhile the subsidised subscriptions end and bills go 5-10x. Which one wins decides whether lab revenue growth is price or volume.", "tweetB": "Spend per developer is falling on API plans. Capex forecasts keep rising. Either usage per dev is exploding or somebody's utilisation assumptions are wrong. Citi says $5.35T of Big Tech capex through 2030 — go check the token math.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://newsletter.pragmaticengineer.com/p/whats-the-roi-of-software-engineers"}, {"id": 9, "cat": "labor", "urgency": "deep", "source": "Pragmatic Engineer (Gergely Orosz)", "title": "More PRs is not more shipping: 2x PR throughput at CodeRabbit, but quality-focused teams see flat velocity and 3x bigger diffs", "idea": "CodeRabbit: +113% weekly PRs, +128% for a fixed cohort of 20,000 devs; Gitar's AI-native teams ship 60+ PRs/dev/week. Counter-evidence from interviews: a 5,000-dev public company had flat PR frequency but 3x lines per change; a SaaS company with human review saw velocity unchanged ('accelerated slop'); a multinational team closed 3x more user stories since Feb/March but driven by one outlier engineer.", "angle": "Productivity is a distribution: a few power users capture it. That shapes who gets displaced and who gets paid.", "tweetA": "PRs doubled. Diffs tripled in size at another company. Velocity flat where humans still review. We keep measuring AI productivity with the metric AI is best at inflating.", "tweetB": "One engineer's output skyrocketed and the rest of the team barely moved — that's from the team lead who reported a 4x. Averages hide the story. The labor effect of AI won't be 'everyone 2x', it'll be 'one person does what five did'.", "charts": {"count": 3, "hot": false, "desc": "PR growth charts"}, "link": "https://newsletter.pragmaticengineer.com/p/whats-the-roi-of-software-engineers"}, {"id": 10, "cat": "AI/infra", "urgency": "deep", "source": "a16z (Superhuman Hardware Design Is The Easy Part)", "title": "'The interface between the digital and physical world is lossy' — why superhuman AI hardware design won't mean superhuman hardware engineering", "idea": "Frontier models can now generate CAD, design PCBs and source COTS parts; benchmarks (CAD Arena, EE Bench, LuxoBench) are improving. But the write path (CNC/CAM translation, tolerance stack-up, vendors, 1 vs 1,000,000 units) and read path (non-uniform, sparse, expensive, high-latency, qualitative physical data) stay lossy. Example: a chicken buyer moving 45M birds/week has 20% week-to-week yield variance; SpaceX has 591 supply-chain staff and is hiring 128 more.", "angle": "Where the bottleneck sits in physical AI: measurement and process knowledge, not design.", "tweetA": "A friend buys 45 million chickens a week and still sees 20% variance in saleable output. That's the lossy interface. Models will design the part in seconds. Getting that part from atoms to spec and back to data is the actual moat.", "tweetB": "SpaceX, the poster child for vertical integration, has 591 people in supply chain roles and wants 128 more. Superhuman design collapses the cost of the easy part and raises the value of whoever owns machining, test and procurement data. Machining, test and procurement, not CAD.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.a16z.news/p/superhuman-hardware-design-is-the"}, {"id": 11, "cat": "AI/infra", "urgency": "watch", "source": "a16z (Superhuman Hardware Design Is The Easy Part)", "title": "Robotics training data funnel: millions of hours egocentric, tens of thousands teleop, only hours of high-quality demos", "idea": "Citing Eric Jang's 'Smooth Exponentials for Robotics': 2026 labs train on roughly millions of hours of egocentric video, hundreds of thousands of hours of UMI gripper data, tens of thousands of hours of teleop data, and just hours of high-quality hardware-specific demonstrations. Periodic Labs' autonomous lab (superconductors, magnets, semis) is called the 'platonic ideal' closed loop. Also: a16z announced OpenAI acquired portfolio company Orchestra Bio.", "angle": "Quantifies why humanoid timelines slip: the funnel narrows by orders of magnitude at the tier that matters.", "tweetA": "Robot data funnel: millions of hours of video, hundreds of thousands of gripper, tens of thousands teleop, a few hours of the demos that actually matter. Four orders of magnitude of attrition. Humanoid timelines are a data-collection problem wearing a hardware costume.", "tweetB": "OpenAI buying a biotech and Periodic building autonomous labs are the same bet: whoever owns closed-loop physical data owns the next scaling curve. The cloud bills are the small part.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.a16z.news/p/superhuman-hardware-design-is-the"}, {"id": 12, "cat": "AI/infra", "urgency": "deep", "source": "AI Street (Matt Robinson)", "title": "Citadel Securities' AI project-risk backtest: 18 of 100 flagged greens turned yellow/red in 3 months vs 10 of 100 unflagged", "idea": "At the AI Engineer conference: Citadel Securities' COO for AI described an internal 'world model' combining project reports, Slack, notes and code changes; specialist agents plus reviewer agents more than doubled useful updates. Bridgewater's Vault (100M+ documents from 135 sources) now has agents proposing research questions; Apollo/Redding Ridge cut 200-400-credit portfolio prep from 2-3 days to minutes (80-90% complete); Two Sigma registers every agent with owner, tools and endpoints. AI Street also launched a 79-entry use-case tracker.", "angle": "Honest base rate: 18% vs 10% is a modest lift, which is the realistic size of an AI edge in internal ops.", "tweetA": "Citadel Securities' 'world model' flagged 100 green projects; 18 went yellow/red in three months vs 10 unflagged. That's a real edge and an unimpressive one. Worth remembering when someone shows you an AI demo with 90% accuracy.", "tweetB": "Two Sigma keeps a registry of every AI agent: owner, purpose, tools, endpoints. That's an org chart for non-employees. Agent identity and permissions becomes a compliance product before it becomes a headline.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.ai-street.co/p/citadel-securities-two-sigma-and"}, {"id": 13, "cat": "labor", "urgency": "watch", "source": "AI Street (Matt Robinson)", "title": "Why quiet quant firms are suddenly public: frontier labs are fishing in the same PhD pool", "idea": "AI Street's explanation for why historically secretive funds now speak at conferences: recruiting AI/ML talent. Frontier labs hire from the same math/CS/engineering PhD pool quants used to dominate. Related: Coatue's AI head is mapping research tasks to rules, ML, agents or people ('a simple rule may beat a large model'), with decades of preserved decision notes as context.", "angle": "Talent-flow signal: quant comp now competes with lab comp. Marketing budgets of hedge funds are a hiring signal.", "tweetA": "Citadel, Two Sigma, Bridgewater on conference stages isn't transparency. It's recruiting. Frontier labs are bidding for the same 500 PhDs. When the secretive people start talking, you're seeing the price of talent go up.", "tweetB": "Coatue's rule: a simple rule may beat a large model; portfolio implications still need a person. Compare that with the quant firm spending $8M/month on Claude. Two different answers to the same question about where AI belongs in the stack.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.ai-street.co/p/citadel-securities-two-sigma-and"}, {"id": 14, "cat": "macro", "urgency": "act", "source": "James Bulltard", "title": "Pending home sales -7% m/m and -11% y/y; November crude touched $110; SPY back below the 50-day", "idea": "10/20 recap: pending home sales down 7% from August, 11% YoY; 'high rates are starting to cause havoc'; Nov crude hit $110 before cooling; SPY rejected at and closed below the 50-day Monday; S&P is only ~1% above where it was on June 1. Argues oil sustaining high means rates stay high; bad economic news means rate cuts could become discussable. Flags SpaceX (SPCX) and Netflix as the first big tech reports.", "angle": "Stagflation framing in one paragraph: oil pins rates, housing is the transmission.", "tweetA": "S&P is 1% above where it was on June 1. Pending home sales -11% YoY, crude at $110 intraday, and the bull case is 'bad news means cuts'. That only works if oil lets the Fed. Oil at $110 says it doesn't.", "tweetB": "Housing is the one sector that tells you rates are restrictive in real time. Starts, permits and now pending sales all rolled over on the same day crude printed $110. The Fed is being asked to cut into an energy shock. $XHB $USO", "charts": {"count": 0, "hot": false, "desc": "Scanner screenshots only"}, "link": "https://www.jamesbulltard.com/p/102026-recap"}, {"id": 15, "cat": "macro", "urgency": "act", "source": "Peter Boockvar", "title": "Single-family permits 845k, lowest since March 2023; sunbelt multifamily construction 'slowed dramatically'", "idea": "September single-family starts fell to 859k (from 900k, vs 875k expected), lowest in a year; single-family permits 845k; multifamily starts 362k (from 388k; July was 494k) while multifamily permits rose to 555k. Boockvar expects excess apartment supply to be absorbed and rents to inflect up in 2027 as first-time buying gets harder.", "angle": "A contrarian rent view: today's housing weakness sets up tomorrow's shelter inflation.", "tweetA": "Multifamily starts went 494k in July, 388k, now 362k. Single-family permits at a 3.5-year low. The housing slump now is the shelter inflation of 2027. Supply responds to rates with a lag and the CPI shelter print responds with a longer one.", "tweetB": "First-time buyer can't buy, so they rent; nobody is building the rental; supply from the 2022-24 wave gets absorbed. Boockvar's 2027 rent inflection is the first housing call I've seen that treats weak starts as inflationary. $EQR $AVB", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://peterboockvar.substack.com/p/home-construction-and-sales-in-september"}, {"id": 16, "cat": "macro", "urgency": "deep", "source": "Bespoke Investment Group", "title": "Kospi: +50%, -20%, +74%, -15%, +22%, -39%, +27%, now -22% in October alone — ~10x the S&P's range", "idea": "Kospi has done a sequence of 50% up, 20% down, 74% up, 15% down, 22% up, 39% down, 27% up this year and is now down 22% in a single month, closing just under its July low and up <32% YTD vs +123% at the peak. S&P's October high-low range is under 3%, roughly a tenth of Kospi's, and historically narrow for the month since 1993.", "angle": "The AI-memory proxy is already in a bear market while the US index is flat — the dispersion story at country level.", "tweetA": "Kospi: +123% YTD at the peak, +32% now, -22% this month. S&P: inside a 3% range. Same AI trade, two completely different risk surfaces. The US index is the quietest place to look at the world's most volatile theme. $EWY", "tweetB": "S&P October range under 3% while Kospi swings ~30%. Index vol is low because correlation has been traded away underneath it. That's the setup for Friday's VIX +5. Low vol is a statement about dispersion, not safety.", "charts": {"count": 1, "hot": true, "desc": "S&P 500 October high-low range by year since 1993 — 🔥 CHART WORTH SAVING"}, "link": "https://bespokeinvest.substack.com/p/wheres-the-index-vol-morning-market"}, {"id": 17, "cat": "positioning", "urgency": "deep", "source": "Danny Dayan (Quant Corner)", "title": "Quant Corner Oct 20: crowded NDX/RTY pair reversed with NDX catching down; dollar crowded and extended settled", "idea": "Dayan's model-based series recapped that his prior edition flagged the NDX/RTY pair as crowded and overbought; the reversal came but via NDX falling. Also flagged a crowded, technically extended dollar, which has since settled. No crypto signals this week; levels for BTC/ETH updated in chat. (Body truncated; signals are behind paywall.)", "angle": "Record of crowded-trade calls that played out; useful as a cross-check with BofA's crowding view.", "tweetA": "Crowded long NDX / short RTY: flagged, reversed, but not the way the rotation bulls wanted — NDX fell to meet it. Small caps didn't rally, large caps just came down. That's a de-grossing signature.", "tweetB": "Another quant note, another 'dollar is crowded'. If both the safety trade and the dollar are crowded, what is not? Crowding indicators saturating across assets is itself a regime signal.", "charts": {"count": 0, "hot": false, "desc": "Model charts inside - worth opening"}, "link": "https://dannydayan.substack.com/p/quant-corner-f55"}, {"id": 18, "cat": "energy", "urgency": "deep", "source": "Haymaker", "title": "Haymaker: bullish uranium reiteration — 'oil, the one almost everyone hated at the start of 2026' has been a top commodity", "idea": "Haymaker Daily opens with a uranium reiteration ('Have Your Yellow Cake... and Refine It, Too'). Notes 2026 commodity winners: copper, aluminum, wheat and oil, the consensus-hated trade of January. (Body truncated; full thesis behind the link.)", "angle": "Consensus-hate in January for oil is a clean reminder for positioning contrarians.", "tweetA": "Oil was the trade almost everyone hated in January 2026. It's now at $100-110. The best contrarian signals show up at the start of the year, when nobody is prepared to size them. $CCJ $URA $USO", "tweetB": "Copper, aluminum, wheat, oil: the real-assets complex had a good year, and equities with AI rotation are what you're debating. Uranium sits at the junction of the AI power buildout and the energy shock.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://haymaker.substack.com/p/haymaker-daily-b9f"}, {"id": 19, "cat": "energy", "urgency": "deep", "source": "Robert Sinn", "title": "Namibia: 20bn bbl offshore oil, uranium restart, a C$368M gold take-out in ~5 years, and a 3.5Mt-Cu porphyry heading to PFS", "idea": "Namibia ranks 2nd in sub-Saharan Africa for rule of law and 5th of 54 for stability. Langer Heinrich restarted in 2024 and produced 4.82Mlb U3O8 in FY to June 2026; Osino's Twin Hills discovery to cash take-out by Shanjin at C$368M (C$1.90/sh) took ~5 years, gold now ~2x; B2Gold's Otjikoto produced 199k oz at AISC $969/oz and is stepping down to 80-100k oz in 2026 with Antelope underground; Koryx's Haib has 3.5Mt contained copper, PFS due by end-November. Disclosure: author owns Koryx and B2Gold.", "angle": "Frontier jurisdiction case with a built-in M&A comp: Chinese buyers paying cash for African discovery.", "tweetA": "A Chinese gold company paid C$368M cash for a Namibian discovery five years after it was found, with gold at half today's price. That's the comp. Haib has 3.5Mt of copper and a PFS due by November. $B2G", "tweetB": "Namibia: uranium restart done, 20bn bbl offshore, the second-best rule-of-law ranking in sub-Saharan Africa and a tax code unchanged for 35 years. The Western world's critical-minerals plan is shopping for exactly this jurisdiction, and a Chinese buyer got there first.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://robertsinn.substack.com/p/namibia-africas-overlooked-mining"}, {"id": 20, "cat": "crypto", "urgency": "deep", "source": "Blockworks Research (via Messari) — Sam Schubert", "title": "Aptos deflation: supply growth cut ~70% (5% to ~1.5%), burn at ~10% of issuance, gas repriced 10x", "idea": "Between Feb 19 and Mar 19, 2026 tokenholders repriced gas 10x, halved staking rewards to a flat 2.6%, capped supply at 2.1B APT and permanently locked 210M APT. Net supply growth fell ~70% while daily transactions doubled to ~9M (led by Decibel's fully onchain perps order book). Burn went from 0.2% to ~10% of issuance; Blockworks' Token Holder Net Income metric has been positive since May 2026.", "angle": "A governance-led tokenomics reset where usage rose after fees rose — rare.", "tweetA": "Aptos 10x'd gas fees and transactions doubled anyway. Usage that doesn't leave when you raise prices is the definition of a product. Supply growth 5% to 1.5%, burn 0.2% to 10% of issuance. $APT", "tweetB": "Token holder net income going positive in May 2026 is the first time I've seen an L1 pitch itself on a P&L line. If Decibel's onchain perps order book is driving it, this is a trading venue disguised as a chain.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://research.blockworks.co/"}, {"id": 21, "cat": "crypto", "urgency": "act", "source": "Mando Minutes", "title": "Mando: BTC $81.6K -1% despite +$527M ETF inflows; BlackRock files buffer BTC ETF; Switzerland approves retail spot BTC ETF", "idea": "BTC 81,636 (-1%), ETH 2,398, BTC ETFs +$527M vs ETH ETFs -$103M, hash rate within 7% of record, Fear & Greed 56. BlackRock filed for a downside-protected (buffer) Bitcoin ETF after IBIT drew $665M in a day. Switzerland approved a spot BTC ETF for retail; JPMorgan launched JPM Coin on Ethereum; Multicoin says HYPE is its fund's largest position; Hyperliquid asked the SEC to clarify airdrop rules.", "angle": "Price weak against record-ish inflows and hash rate: the marginal seller isn't ETF money. A buffer ETF is an institutional-grade product trying to monetise vol.", "tweetA": "BTC down 1% on a day with +$527M ETF inflows and hash rate 7% off the record. Whoever's selling isn't the new buyer base. Then BlackRock files for a buffered BTC ETF — the product you build when clients can't stomach the vol they bought. $IBIT", "tweetB": "ETH ETFs: -$103M. BTC ETFs: +$527M. JPM launches a coin on Ethereum the same day. The financial system is adopting the rails and not the asset — that is the entire BTC vs ETH debate in one day of flows.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-8602"}, {"id": 22, "cat": "geopolitics", "urgency": "act", "source": "Mando Minutes", "title": "Oil surges as Houthis target energy infrastructure; EU gas above €90, highest since 2022; US-Iran deal rumours", "idea": "Houthis targeting energy infrastructure pushed oil higher while rumours say a US-Iran deal may come this week. EU gas is above €90, highest since 2022. Tether says freezes cut Iran stablecoin volume 94%. Also: Trump says someone else should lead Ukraine talks, is open to a Xi/Putin summit; Vance declined to endorse Netanyahu; France imposed curfews in riot-hit cities; Trump revived a New York gas pipeline via wartime law.", "angle": "Energy shock plus deal optionality: pricing asymmetry if talks slip.", "tweetA": "EU gas at €90+, highest since 2022. Crude pushing $100-110. And the market's pricing a US-Iran deal 'this week' on rumours. If the Muscat track fails, the move in gas is not done. $TTF $XLE", "tweetB": "Tether claims freezes cut Iran stablecoin volume by 94%. Sanctions enforcement just became a programmable-money product: the issuer is now a sanctions desk. That's the cleanest example of stablecoins extending state reach, not escaping it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-8602"}, {"id": 23, "cat": "macro", "urgency": "act", "source": "Mando Minutes", "title": "Indonesia's worst rout since 1998; MSCI threatens Argentina-style treatment; PBOC to inject up to ¥1T daily via repos", "idea": "Indonesian stocks suffered their worst rout since 1998, spreading to bonds and FX, with MSCI threatening to reclassify. PBOC to inject up to ¥1T daily via repos. BoJ may raise its inflation forecast but hold rates. French yields continue to rise; Malaysia exports hit an ATH on the AI boom; Alberta voted to stay in Canada; N Korea confirms Kim Jong Un is alive.", "angle": "EM stress plus Chinese liquidity plus French yields: the dollar-funding corner of the story.", "tweetA": "Indonesia worst since 1998 and PBOC injecting up to ¥1 trillion a day through repo. One of those is a symptom and the other is the antidote. Watch whether the PBOC's liquidity ends up in the rupiah or in the yuan's carry.", "tweetB": "Malaysia exports at ATH on AI demand while Indonesia's equities, bonds and FX all crash. One AI-era winner and one commodity-and-governance loser in the same neighbourhood. EM is no longer a basket.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-8602"}, {"id": 24, "cat": "AI/infra", "urgency": "act", "source": "Mando Minutes", "title": "Citi: Big Tech capex $5.35T through 2030; SoftBank CDS at 4-year high; OpenAI seeks $1.4T valuation before Anthropic IPO", "idea": "Citi estimates $5.35T of Big Tech capex through 2030. SoftBank CDS hit a four-year high. OpenAI reportedly wants a $1.4T valuation before Anthropic IPOs; Nscale and Anthropic are in talks for another $45B compute deal; Tenstorrent raised $1.5B at $6.2B; Amazon surged after a Morgan Stanley upgrade and launched TorchNeuron targeting Nvidia; Micron says humanoids need 16x more memory; US banned DeepSeek from federal agencies and sanctioned five Chinese entities over Google AI trade secrets.", "angle": "The financing stack in one list: capex, the most levered buyer's CDS, and a race to price before a rival lists.", "tweetA": "$5.35T of capex through 2030 and SoftBank's CDS at a four-year high. The buildout's cost of capital is a CDS quote on Masayoshi Son. If that spread keeps widening the narrative changes before a single GPU is cancelled. $SFTBY", "tweetB": "OpenAI wants $1.4T before Anthropic lists. Anthropic's talking another $45B of compute. Both are racing to get a valuation set against the other. The IPO window isn't opened by the market, it's opened by a rival's S-1.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-8602"}, {"id": 25, "cat": "regulation", "urgency": "deep", "source": "Mando Minutes", "title": "Schwab and JPMorgan restrict third-party AI agents; Mastercard adds stablecoin fraud screening; Visa+Mesh enable crypto at 175M merchants", "idea": "Schwab and JPMorgan are restricting third-party AI agents from accessing accounts. Mastercard brought its fraud tools to stablecoin payments; Visa and Mesh enable crypto payments at 175M merchants; Ripple Prime joined DTCC's tokenisation service; Ramp applied for a US trust bank charter; Revolut had an EU-wide outage after a Google Cloud outage hit UK banks; CFTC rebuffed CME's perp futures stance; NYSE launched extended-hours options.", "angle": "Agentic commerce meets liability: banks gate-keeping agents while payment networks absorb stablecoins.", "tweetA": "Schwab and JPMorgan are blocking third-party AI agents from client accounts. Visa and Mastercard are welcoming stablecoins. The incumbents' strategy: own the rails, control who touches them. Agentic finance gets a permission layer before it gets a market.", "tweetB": "A Google Cloud outage took down UK banks and Revolut across the EU the same day banks restrict agents. Concentration risk in cloud is the actual systemic question for agentic finance, not whether the agent is smart.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-8602"}, {"id": 26, "cat": "AI/infra", "urgency": "watch", "source": "This Week in Startups (TWiST 2352)", "title": "Clone Robotics: humanoid with water-powered 'hydraulic myofiber' muscles instead of motors and tendons", "idea": "Most humanoid companies use motors pulling tendons like a puppet. Clone Robotics uses artificial hydraulic myofibers — a rubber tube in a braided sleeve that contracts when pressurised with gas or liquid — claiming human-level strength and dexterity at human size, with the goal of android 'clones' and home butlers. Episode also compares Anthropic's 'Public Benefit Fund' with Musk's plan to give US kids SpaceX shares, and Odyssey's world model release.", "angle": "Actuation architecture is the open variable in humanoids; hydraulics reintroduces fluid/pressure supply chains vs. rare-earth motors.", "tweetA": "Nearly every humanoid is a motor-and-tendon puppet. Clone Robotics is betting on pressurised rubber tubes that contract like muscle. If actuation moves from rare-earth motors to hydraulics, the humanoid bill of materials has a very different supply chain. $TSLA", "tweetB": "Same podcast: Anthropic's public benefit fund vs Musk giving American kids SpaceX shares. Frontier labs and Musk are both trying to buy social licence with equity. Who owns the AI dividend is becoming policy design by press release.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/the-humanoid-robot-has-water-powered-c85"}, {"id": 27, "cat": "science", "urgency": "watch", "source": "Binary Breakaway", "title": "Biological computing ethics: organoid clusters show activity on par with a preterm infant; a sentience-threshold test is being built", "idea": "Part 2 on biological computing: brain organoids (pinhead-size clusters of lab-grown human neurons) respond to electrical signals and show memory; their neural activity is roughly comparable to a preterm infant. Integrated Information Theory underpins a 2025 Consortium for Organoid Intelligence effort to set 'sentience candidate' thresholds that trigger stricter oversight; others test for sleep cycles. If donors' cells are used, there's a consent and IP question: 'Is that AGI partially you?'", "angle": "Compute-energy limits could push alternatives, but wetware brings regulation before scale.", "tweetA": "Compute hunger is creating demand for alternatives that use 20 watts instead of 20 megawatts. Brain organoids are the leading candidate — and they already show activity comparable to a preterm infant. The first regulatory constraint on compute may be bioethics.", "tweetB": "If a donor's neurons end up in a biocomputer that hosts an AGI, who owns what? Informed consent and IP law written for tissue banks and software will collide. The surprising part is that people are already drafting thresholds.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://binarybreakaway.substack.com/p/the-ethics-of-biological-computer"}, {"id": 28, "cat": "venture", "urgency": "deep", "source": "McKinsey (Asset management 2026: Plenty for the few?)", "title": "McKinsey: 'a golden age for the industry is becoming a golden age for a smaller group of asset managers'", "idea": "Only the teaser was in the email: McKinsey Banking leaders Ishaan Seth and Stephanie Hauser frame 2026 asset management growth as concentrating among fewer firms, with 2025's 'great convergence' and AI reshaping industry economics as companion reads. No figures in the email body; the report itself has the data.", "angle": "Concentration in asset management matches concentration in equity returns and in AI compute; the barbell story.", "tweetA": "McKinsey says asset management's golden age is for a smaller group. That's the same shape as the market: five stocks, six labs, a handful of managers. Winner-take-most isn't a tech phenomenon, it's the 2026 equilibrium.", "tweetB": "Fee compression, passive, private markets, AI: every pressure on asset managers rewards scale. If McKinsey's right that growth favours the few, the mid-sized active manager is the structurally short position.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening (email is teaser only)"}, "link": "https://email.mckinsey.com/industries/financial-services/our-insights/asset-management-2026-plenty-for-the-few"}, {"id": 29, "cat": "AI/infra", "urgency": "watch", "source": "McKinsey (The AI value curve)", "title": "McKinsey: 'many organizations are still measuring AI adoption instead of value' — AI value curve ranks tasks by cost-effectiveness of automation", "idea": "Teaser from QuantumBlack leaders Dan Tinkoff and Lieven Van der Veken: the AI value curve identifies where automation potential can be deployed most cost-effectively. Companion reads: 'The cost of intelligence: How CIOs can manage AI demand at scale' and 'Where AI agents pay off'. Email carries no numbers.", "angle": "Matches the Pragmatic Engineer finding: spend is rising, ROI measurement isn't. Consulting firms selling the measurement layer.", "tweetA": "McKinsey's pitch: companies measure AI adoption, not AI value. The same week a quant firm spends $8M a month and measures nothing but desk P&L. Adoption metrics are the new vanity metrics.", "tweetB": "'The cost of intelligence: how CIOs manage AI demand' is a McKinsey title now. When the Big 3 start selling demand management for AI, usage has outrun budgets. That's usually where pricing power turns.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening (email is teaser only)"}, "link": "https://email.mckinsey.com/capabilities/quantumblack/our-insights/the-ai-value-curve-the-economics-of-applying-ai-to-existing-work"}, {"id": 30, "cat": "labor", "urgency": "watch", "source": "McKinsey (The judgment bottleneck)", "title": "McKinsey: 'Analysis now runs on AI time, but judgment still runs on human time'", "idea": "McKinsey Quarterly teaser (Andy West, Sébastien Lacroix): AI collapses analysis time but strategy judgment stays human-speed; three moves to convert speed into better decisions. Companions: how AI is transforming strategy development; when can AI make good decisions (AI corporate citizens). No body detail in email.", "angle": "The scarce input shifts from analysis to decisions; relevant to PM workflows and to Pragmatic Engineer's reviewers-as-bottleneck.", "tweetA": "Analysis at AI speed, judgment at human speed. Same bottleneck the senior engineers describe reviewing 10x larger diffs. The constraint moved from producing to deciding, and deciding doesn't scale with tokens.", "tweetB": "If analysis is free, the edge is who decides faster and with better calibration. That's a hedge fund thesis in a consulting headline. Citadel Securities needed 18-vs-10 from a backtest to trust its model — judgment is the product.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening (email is teaser only)"}, "link": "https://email.mckinsey.com/capabilities/strategy-and-corporate-finance/our-insights/the-judgment-bottleneck-balancing-ai-and-human-speeds-in-strategy"}, {"id": 31, "cat": "labor", "urgency": "watch", "source": "This Week in Startups (Founder Field Notes)", "title": "Mehrotra's PSHE hiring framework: reference checks reveal whether someone owns Problem, Solution, How or Execution", "idea": "Superhuman CEO Shishir Mehrotra ranks Problem > Solution > How > Execution and uses reference calls to distinguish 'How' people who pass as 'Problem' people. Technique: never tell the reference what you value; offer four complimentary personas so they rank without feeling they're grading; ask 'would you hire again and how excited' and 'what should I have asked'. When signals disagree: references first, then work exercises, then interviews.", "angle": "In an AI era where execution is cheap, the PSHE ladder says value migrates up to problem selection.", "tweetA": "Mehrotra's hiring ladder: Problem, Solution, How, Execution. AI is eating the bottom rung first. If execution gets cheap, the premium shifts to whoever picks the problem — which is the one thing interviews can't test and references can.", "tweetB": "A reference check that offers four flattering personas and lets the reference rank them is a neat trick: it removes the social cost of honesty. Same logic would work for sell-side ratings. Give analysts an 'out' and they'll tell you.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/stop-asking-references-if-your-candidate"}, {"id": 32, "cat": "culture", "urgency": "watch", "source": "Hard Fork (Radigan Carter via Hardfork newsletter)", "title": "Radigan Carter on stress: don't make decisions under stress that can wait", "idea": "Reposts a conflict-zone writer's stress playbook: ask what you're actually upset about and let the subconscious work; staying angry only costs future opportunities; give yourself permission to feel it and 'not make any decisions I don't have to, under stress'. Cites chronic cortisol effects (cardiovascular, cognitive decline, accelerated ageing).", "angle": "Decision hygiene for traders in a volatile tape.", "tweetA": "Rule from someone who works in actual war zones: don't make decisions under stress that can wait. Most of my worst trades were decisions I didn't have to make that day.", "tweetB": "Stress has a long half-life in the brain. Markets with VIX +5 in a day don't. Position sizing is mostly about the first fact.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/dealing-with-stress-more-radigan"}];

  var u={act:0,deep:0,watch:0};ITEMS.forEach(function(i){u[i.urgency]++});
  document.getElementById('urgs').innerHTML=pill('All',st.urg==='all','#333',"setUrg('all')")+pill('🔴 Act Now ('+u.act+')',st.urg==='act','#e24b4a',"setUrg('act')")+pill('🔵 Deep ('+u.deep+')',st.urg==='deep','#378add',"setUrg('deep')")+pill('🟡 Watch ('+u.watch+')',st.urg==='watch','#ef9f27',"setUrg('watch')");
  var out='';
  ITEMS.forEach(function(it){
    if(st.cat!=='all'&&it.cat!==st.cat)return;
    if(st.urg!=='all'&&it.urgency!==st.urg)return;
    if(st.src&&it.source.indexOf(st.src)===-1)return;
    var c=COL[it.cat]||'#333',o=st.open[it.id];
    out+='<div class="card'+(o?' open':'')+'"><div class="hd" onclick="tog('+it.id+')"><span class="num">'+String(it.id).padStart(2,'0')+'</span><span>'+UE[it.urgency]+'</span><span class="src" style="background:'+c+'">'+esc(it.source)+'</span><span class="tag">'+esc(it.cat)+'</span>'+(it.charts.count?'<span>'+(it.charts.hot?'🔥':'📊')+'</span>':'')+'<span class="ttl">'+esc(it.title)+'</span></div><div class="bd">'
     +'<div class="lbl">The idea</div><div>'+esc(it.idea)+'</div>'
     +'<div class="angle" style="border-color:'+c+';background:'+c+'14"><b>MY ANGLE</b> — '+esc(it.angle)+'</div>'
     +'<div class="tw"><div><div class="lbl" style="color:#378add">Tweet A</div>'+esc(it.tweetA)+'<br><button class="copy-btn" onclick="copyTweet(' + it.id + ',\'a\')">📋 Copy</button></div>'
     +'<div><div class="lbl" style="color:#7f77dd">Tweet B</div>'+esc(it.tweetB)+'<br><button class="copy-btn" onclick="copyTweet(' + it.id + ',\'b\')">📋 Copy</button></div></div>'
     +(it.charts.desc?'<div class="ch'+(it.charts.hot?' hot':'')+'">'+(it.charts.count?it.charts.count+' chart(s): ':'')+esc(it.charts.desc)+'</div>':'')
     +'<div style="margin-top:10px"><a href="'+esc(it.link)+'" target="_blank" rel="noopener">↗ Read full article</a></div></div></div>';
  });
  document.getElementById('list').innerHTML=out||'<p>No items.</p>';
}
function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';
  var r='<p><b>Window:</b> '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.<br>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</p><p><b>Included sources</b> (click to filter):</p><ul>';
  META.includedSources.forEach(function(s){r+='<li><span class="sl" data-n="'+esc(s.name)+'">'+esc(s.name)+'</span> — '+s.items+'</li>'});
  r+='</ul><p><b>Skipped:</b></p><ul>';
  META.skippedSources.forEach(function(s){r+='<li>'+esc(s.name)+' — '+esc(s.reason)+'</li>'});
  r+='</ul><p>'+esc(META.notes)+'</p>';
  document.getElementById('repb').innerHTML=r;
  document.getElementById('repb').addEventListener('click',function(e){var n=e.target.getAttribute&&e.target.getAttribute('data-n');if(n)filterBySrc(n)});
  render();
}
init();
</script></body></html>
