{ id:38, cat:"positioning", urgency:"watch", source:"Young & Calculated",
  title:"A signal with a 2-day alpha half-life captures 62% of its value if executed evenly over 3 days — or 90%+ if executed in half a day, at several times the cost",
  idea:"The piece lays out execution-schedule economics: a signal with a two-day half-life executed evenly across three days captures roughly 62% of the theoretical alpha; the same signal executed in half a day captures over 90% but pays several times the market impact. The scheduling choice is fundamentally a statement about signal decay, and most execution desks never receive that half-life number from research.",

{ id:44, cat:"positioning", urgency:"deep", source:"Phil Dauber",
  title:"The VIX at 15.47 isn't cheap — it's arithmetic. Average single-name vol is near 40 and correlation is doing all the canceling",
  idea:"Realized volatility on the average S&P 500 stock sits near 40, while the VIX (index-implied volatility) is only 15.47. Since index variance roughly equals average single-name variance times average correlation, the entire gap between 40 and 15.47 is being paid for by record-negative correlation — and correlation is described as the least stable parameter in the whole market, which mean-reverts fastest exactly when positioning gets forced.",
  angle:"A low VIX read right now is measuring cancellation between stocks, not calm — the moment correlation snaps back toward its 80% historical average (which the same piece shows is already breaking down elsewhere), index vol has to reprice violently even with zero change in any individual stock's volatility.",
  tweetA:"VIX at 15.47. Average S&P stock realizing volatility near 40. That gap isn't calm — it's correlation doing all the work, and correlation is the LEAST stable number in markets. The index looks quiet purely because -34% correlation is canceling out stocks that are each individually moving like it's 2020. That cancellation can reverse in a single session.",
  tweetB:"Nobody buying index vol at 15 is actually betting the market is calm. They're implicitly betting record-negative correlation holds. That's a much narrower, much riskier bet than \"the market stays calm\" — and it's one most vol buyers don't realize they're making.",
  charts:{count:0,hot:false,desc:"Charts inside — worth opening (full financials dispersion table behind the paywall referenced in the piece)."},
  link:"https://phildauber.substack.com/p/can-you-tell-me-how-to-get" },

{ id:52, cat:"tech", urgency:"deep", source:"Tiger Research",
  title:"The ad-funded web is breaking because AI agents extract data and leave without ever seeing a banner ad",
  idea:"Tiger Research's report argues the three-decade-old ad-supported internet model is structurally breaking as AI agents become primary web consumers — an agent extracts only the specific data it needs and leaves, never generating the ad impressions that funded free content. The report frames x402 and stablecoin-based micropayments as the emerging replacement infrastructure, drawing a direct parallel to music streaming's shift from $15 CDs to $0.003-0.005-per-play economics: per-unit price collapses, but machine-driven volume more than compensates.",
  angle:"This is the clearest single articulation of a business-model extinction event running quietly underneath the entire AI-agent narrative — every ad-supported content business (media, recipe sites, data providers) faces the same existential math as agents replace human eyeballs as the primary traffic source.",
  tweetA:"A human visit generates ~$0.005 in ad revenue. A machine reading the same page and paying for it directly generates ~$0.001 — a fifth as much per visit. The bet the entire agent-payments industry is making: machine traffic volume will be so much larger than human traffic ever was that the total market gets BIGGER despite each visit being worth less. That's the exact bet the music industry made moving from CDs to streaming, and it paid off. Nobody's tested it for content yet.",
  tweetB:"Every ad-supported website built its business model assuming a human would see the ads. AI agents don't see ads — they extract data and leave. That's not a slow decline, that's the entire revenue mechanism silently switching off underneath publishers who haven't noticed yet because their traffic numbers still look fine.",
  charts:{count:0,hot:false,desc:"No chart in email body; full Tiger Research report likely has adoption-curve and revenue-model charts. Charts inside — worth opening."},
  link:"https://reports.tiger-research.com/p/ai-agent-payments-a-future-we-cannot-eng" },

    { name: "Phil Dauber", count: 8, note: "One extremely dense post extracting 8 distinct items: the 5bps buyback arithmetic, the broken haven test/record-negative correlation, the manufactured-cheap VIX arithmetic, 686bps financials dispersion, Walmart-vs-Ross trade-down, the buyback's election-timed calendar, the Hormuz/Iran-junta geopolitical read, and the Oracle-vs-Microsoft CDS divergence." },
    { name: "Bespoke Investment Group", count: 2, note: "The unknown-catalyst lesson on Bitcoin and the Korea export surge, both from one morning note." },
    { name: "Tiger Research", count: 3, note: "One deep report extracting 3 items: the ad-model-breaking/x402/streaming-economics thesis, the OpenAI Instant Checkout adoption gap, and the x402 security audit findings." }
  ],
  skippedSources: [
    { name: "Google (Security alert)", reason: "Automated account-notification email, zero analytical content." },
    { name: "Substack (Verification code)", reason: "Automated login-code email, zero analytical content." }
  ]
};

function catColor(c){
  const map={macro:"var(--macro)",credit:"var(--credit)",positioning:"var(--positioning)","AI/infra":"var(--aiinfra)",crypto:"var(--crypto)",geopolitics:"var(--geopolitics)",energy:"var(--energy)",tech:"var(--tech)",gold:"var(--gold)",culture:"var(--culture)",labor:"var(--labor)",regulation:"var(--regulation)",science:"var(--science)",venture:"var(--venture)"};
  return map[c]||"#888";
}
function urgEmoji(u){ return u==="act"?"🔴":u==="watch"?"🟡":"🔵"; }
function urgLabel(u){ return u==="act"?"Act Now":u==="watch"?"Watch":"Deep"; }

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function buildFilterBars(){
  const cats = {};
  ITEMS.forEach(i=>{ cats[i.cat]=(cats[i.cat]||0)+1; });
  const catBar = document.getElementById("catBar");
  let html = `<button class="pill ${activeCat==='all'?'active':''}" style="${activeCat==='all'?'background:#333;':''}" onclick="setCat('all')">All <span class="count">${ITEMS.length}</span></button>`;
  Object.keys(cats).sort().forEach(c=>{
    const active = activeCat===c;
    html += `<button class="pill ${active?'active':''}" style="${active?('background:'+catColor(c)+';'):''}" onclick="setCat('${c}')">${c} <span class="count">${cats[c]}</span></button>`;
  });
  catBar.innerHTML = html;

  const urgs = {};
  ITEMS.forEach(i=>{ urgs[i.urgency]=(urgs[i.urgency]||0)+1; });
  const urgBar = document.getElementById("urgBar");
  let uhtml = `<button class="pill ${activeUrg==='all'?'active':''}" style="${activeUrg==='all'?'background:#333;':''}" onclick="setUrg('all')">All <span class="count">${ITEMS.length}</span></button>`;
  ["act","deep","watch"].forEach(u=>{
    if(!urgs[u]) return;
    const active = activeUrg===u;
    uhtml += `<button class="pill ${active?'active':''}" style="${active?'background:#333;':''}" onclick="setUrg('${u}')">${urgEmoji(u)} ${urgLabel(u)} <span class="count">${urgs[u]}</span></button>`;
  });
  urgBar.innerHTML = uhtml;
}

function setCat(c){ activeCat=c; activeSrc=null; buildFilterBars(); render(); }
function setUrg(u){ activeUrg=u; activeSrc=null; buildFilterBars(); render(); }
function filterBySrc(name){
  activeSrc = name; activeCat="all"; activeUrg="all";
  buildFilterBars(); render();
  document.querySelectorAll('.card').forEach(function(el){
    if(!el.classList.contains('hidden')) el.classList.add('open');
  });
}

function render(){
  const cardsEl = document.getElementById("cards");
  let html = "";
  ITEMS.forEach(item=>{
    let visible = true;
    if(activeCat!=="all" && item.cat!==activeCat) visible=false;
    if(activeUrg!=="all" && item.urgency!==activeUrg) visible=false;
    if(activeSrc && item.source.indexOf(activeSrc)===-1) visible=false;
    const chartIcon = item.charts.hot ? "🔥" : (item.charts.count>0 ? "📊" : "");
    html += `<div class="card ${visible?'':'hidden'}" id="card-${item.id}">
      <div class="card-header" onclick="toggleCard(${item.id})">
        <span class="idx">${String(item.id).padStart(2,'0')}</span>
        <span>${urgEmoji(item.urgency)}</span>
        <span class="badge" style="background:${catColor(item.cat)}">${item.source.split(' (')[0].split(' —')[0]}</span>
        <span class="cattag">${item.cat}</span>
        <span class="charticon">${chartIcon}</span>
        <span class="title">${item.title}</span>
      </div>
      <div class="card-body">
        <div class="section-label">The Idea</div>
        <div class="idea">${item.idea}</div>
        <div class="section-label">My Angle</div>
        <div class="angle" style="border-left:2px solid ${catColor(item.cat)};background:${catColor(item.cat)}14;">${item.angle}</div>
        <div class="tweets">
          <div class="tweet">
            <div class="tweet-label a">TWEET A</div>
            <div class="tweet-text">${item.tweetA}</div>
            <button class="copy-btn" onclick="copyTweet(${item.id},'a')">📋 Copy</button>
          </div>
          <div class="tweet">
            <div class="tweet-label b">TWEET B</div>
            <div class="tweet-text">${item.tweetB}</div>
            <button class="copy-btn" onclick="copyTweet(${item.id},'b')">📋 Copy</button>
          </div>
        </div>
        <div class="charts-box ${item.charts.hot?'hot':''}">${item.charts.hot?'🔥 CHART WORTH SAVING — ':'📊 '}${item.charts.desc}</div>
        <div class="link-row"><a href="${item.link}" target="_blank">↗ Read full article</a></div>
      </div>
    </div>`;
  });
  cardsEl.innerHTML = html;
}

function toggleCard(id){
  document.getElementById('card-'+id).classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function buildReport(){
  document.getElementById("metaLine").textContent =
    META.date + " · " + META.time + " · " + META.itemsExtracted + " items from " + META.emailsRead + " emails read (" + META.emailsInWindow + " in window)";

  let html = `<div><strong>Window:</strong> ${META.windowStart} → ${META.windowEnd}</div>`;
  html += `<div style="margin-top:8px;"><strong>Emails in window:</strong> ${META.emailsInWindow} &nbsp;|&nbsp; <strong>Emails read:</strong> ${META.emailsRead} &nbsp;|&nbsp; <strong>Items extracted:</strong> ${META.itemsExtracted}</div>`;
  html += `<div class="section-label" style="margin-top:14px;">Included Sources</div>`;
  META.includedSources.forEach(s=>{
    html += `<div style="margin-top:4px;"><span class="src-name" onclick="filterBySrc('${s.name}')">${s.name}</span> — ${s.count} item${s.count>1?'s':''}. ${s.note}</div>`;
  });
  html += `<div class="section-label" style="margin-top:14px;">Skipped Sources</div>`;
  META.skippedSources.forEach(s=>{
    html += `<div style="margin-top:4px;"><strong>${s.name}</strong> — ${s.reason}</div>`;
  });
  document.getElementById("reportBody").innerHTML = html;
}

buildFilterBars();
render();
buildReport();
</script>
