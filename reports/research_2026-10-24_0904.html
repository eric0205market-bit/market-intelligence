function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';
  var r='<p>Window: '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.<br>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</p><b>Included sources</b><ul>';
  META.includedSources.forEach(function(s){r+='<li><a href="#" onclick="filterBySrc(this.getAttribute(\'data-n\'));return false" data-n="'+s.name+'">'+s.name+'</a> ('+s.count+')</li>'});
  r+='</ul><b>Skipped</b><ul>';META.skippedSources.forEach(function(s){r+='<li>'+s.name+': '+s.reason+'</li>'});
  document.getElementById('repb').innerHTML=r+'</ul>';
  render();
}
init();
</script></body></html>
