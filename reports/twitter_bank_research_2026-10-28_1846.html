<title>Twitter Bank Research</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DATA POINT TAGS */
.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>

<script>
const REPORT_DATA = {"report_type": "TWITTER BANK RESEARCH", "freshness_gate": "FRESHNESS GATE PASSED.", "collected_at": "2026-10-28T18:24:12Z", "window_days": 4, "input_stats": {"total_tweets": 120, "considered": 120, "kept": 30, "dropped": 90, "deduped": 0}, "summary": "Research charts from banks and strategists over the last 4 days: 30 unique items.\nRecurring themes: CTA/systematic positioning and Fed/FOMC expectations; Q3 GDP tracking and earnings expectations; consumer confidence and spending; S&P 500 targets, buybacks and profit margins; Treasury positioning and yields.\nPer-bank counts: Goldman 12, BofA 11, SocGen 3, JPM 2, Yardeni 2, Apollo/Slok 1.", "by_bank_counts": {"Goldman": 12, "BofA": 11, "SocGen": 3, "JPM": 2, "Yardeni": 2, "Apollo/Slok": 1}, "banks": [{"bank": "Goldman", "theme": "Goldman — CTA/positioning flows, GDP tracking, buybacks, S&P target and tightening-cycle charts", "items": [{"author": "neilsethinew", "text": "ZH: \"According to the latest CFTC data, Nasdaq non-dealer net positioning hit a new nominal high in the week through October 20, as non-dealers bought $9.5 billion of futures while the index slid 3.5%. That was the third straight week of buying, for a cumulative $21.8 billion since September 29.\n\n\"That is the main finding of a note published this morning by Goldman futures trader Robert Quinn (available to pro subs), and his conclusion is about as blunt as desk notes get: length remains elevated heading into more megacap tech results, and if Amazon, Microsoft, and Alphabet 'fail to impress, meaningful futures selling could ensue.'\"\n\nhttps://t.co/YLZbiBAC6Y", "tweet_url": "https://x.com/neilsethinew/status/2115495057096908839", "images": ["https://pbs.twimg.com/media/HVux16HWYAArKz6.png"], "created_at": "2026-10-28T17:25:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "The surge in AI imports pushed the US goods trade deficit to $134.9B in September (est. $130.2B), the widest since March 2025 and a third straight monthly increase, per the Census Bureau’s advance report.\n\n▪️ Still exports grew +2.6% to $209.2B, the third highest on record\n▪️ Imports (which are  +2.4% to $344.1B a fresh record\n▪️ Capital goods imports, which include computers, chips and telecom gear,  +7.5% to a record $157.4B, up 77% from a year ago\n▪️ Consumer goods imports +3.1%, the most in four months, but still down 12% from a year ago\n▪️ Industrial supplies imports (incl. oil and gold) -6.0% after jumping 17.1% in August\n\nThe main story is capital goods, the category with the computers, chips and telecom gear feeding the AI buildout. The capital goods deficit is now $84.1B, up from $29.8B a year ago. Strip it out and the rest of the goods deficit is $50.8B, slightly smaller than a year ago ($52.9B).\n\nGoldman noted: \"The capital goods category has been a primary contributor to the widening trade deficit this year and has partially offset the impact of rapidly rising AI business investment on GDP growth.\"\n\nBefore today’s data, the Atlanta Fed’s GDPNow had net exports subtracting 2.86 points from Q3 GDP. The full trade balance report, with services, is out November 4.", "tweet_url": "https://x.com/neilsethinew/status/2115446713229926770", "images": ["https://pbs.twimg.com/media/HVuTiczWEAAPLRy.jpg"], "created_at": "2026-10-28T14:12:54.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Central bank shocker... RBNZ holds at 2.75% in a surprise 4-3 vote GS https://t.co/PilkPCNtzu", "tweet_url": "https://x.com/MikeZaccardi/status/2115413384757661842", "images": ["https://pbs.twimg.com/media/HVt1Q4NXIAA_4y6.png"], "created_at": "2026-10-28T12:00:28.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: Tightening cycles have historically been longer and larger than this one is expected to be, and there are a limited number of historical examples of modest hiking cycles. \n\n1997 and 2015 were cycles where the Fed hiked only once, and 1999 was the next smallest hiking cycle at 175bps of tightening. We bucket those three smallest and shortest hiking cycles (1997, 1999, and 2015) as “modest” tightening cycles and the larger and longer cycles as “other cycles” (1983, 1988, 1994, 2004, 2016, 2022). \n\nThe exhibits  show median asset performance across those categories and across the full sample in the one year before and the two years following the first Fed hike, indexed to the day of the hike, for the S&P 500, the 2-year Treasury yield, the slope of the yield curve (10y minus 2y yields), and the real trade-weighted US Dollar.\n\n-Equities tend to struggle after the first hike but recover quickly. \n\n-Both front- and long-end yields tend to rise in anticipation of the first hike. In the median, yields tend to peak locally shortly after the first hike in modest hiking cycles but continue to rise for some time in other cycles.\n\n-The curve tends to flatten into the first hike, and this flattening tends to continue after the first hike...Our rates strategists similarly noted that front-end forward yields usually peak around the end of rate hikes and after the peak in inflation is confirmed in the data and that, after the peak in forward yields, flattening tends to stop as the curve rallies in parallel.\n\n-The real trade-weighted US Dollar tends to strengthen into the first hike, but its performance afterwards has been mixed across cycles.", "tweet_url": "https://x.com/neilsethinew/status/2115413270899147159", "images": ["https://pbs.twimg.com/media/HVruMhyWYAAbxPL.jpg"], "created_at": "2026-10-28T12:00:00.000Z", "relayers": []}, {"author": "LanceRoberts", "text": "Goldman Sachs sees the S&amp;P 500 climbing to 8,700 over the next 12 months, a 14% gain. Earnings growth, not multiple expansion, is expected to drive the advance.\nh/t @ISABELNET_SA https://t.co/qC1aiH4b8G", "tweet_url": "https://x.com/LanceRoberts/status/2115391491149287804", "images": ["https://pbs.twimg.com/media/HVthQqQW4AEo5v7.png"], "created_at": "2026-10-28T10:33:28.000Z", "relayers": []}, {"author": "neilsethinew", "text": "A chart in the @dailychartbook nightly email caught my eye from Goldman's Tony Pasquariello: \"The markets have suddenly engaged in an intense debate around both the availability AND the cost of capital. Our AI leaders-vs-laggards basket was up nearly 100% YTD at the end of June; in the time since, the entirety of that performance has been given back.\"\n\nAs he intimates the timing lines up pretty good with the headlines surrounding the shift to debt-funded AI capex: \n1 - Mid-June, Goldman flagged consensus hyperscaler capex of $770B this year, roughly 100% of operating cash flow (vs. a ~40% 10-yr avg), and Nvidia launched a $20B bond sale, its first since 2021 \n2 - Incremental debt had gone from 9% of hyperscaler capex in FY2024 to 32% over the last twelve months \n3 - AI-related issuers now pay ~115 bp over Treasuries vs. 78 bp for the broader IG market, and Goldman sees $420B of hyperscaler debt issuance next year, up 60%\n\nWorth remembering though this is a spread. \"Gave back 100%\" means the gap reclosed, not that AI stocks necessarily round-tripped, but there's no question that the market got a wake-up call at the peak that all this AI spending wasn't coming out of the hyperscalers' pockets.", "tweet_url": "https://x.com/neilsethinew/status/2115388102646935637", "images": ["https://pbs.twimg.com/media/HVr0MdHW4AA_t8f.jpg"], "created_at": "2026-10-28T10:20:00.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"CTAs have sold nearly $3bn of Nasdaq 100 futures over the past three sessions, the largest three-day selling wave since March 2025. Looks like they timed the low perfectly...\"\n\nGoldman Sachs via ZeroHedge https://t.co/X7tZLBMTlK", "tweet_url": "https://x.com/dailychartbook/status/2115360296520810510", "images": ["https://pbs.twimg.com/media/HVtE-s8XcAAHOtu.jpg"], "created_at": "2026-10-28T08:29:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Core Capital Goods Orders in Line With Expectations but Shipments Above Expectations; \n\nBoosting Q3 GDP Tracking Estimate to +3.4% https://t.co/hqispQDEVL", "tweet_url": "https://x.com/MikeZaccardi/status/2115216249630130242", "images": ["https://pbs.twimg.com/media/HVrB-GsXkAA3HGk.png"], "created_at": "2026-10-27T22:57:07.000Z", "relayers": []}, {"author": "neilsethinew", "text": "As expected, Goldman raises Q3 GDP tracking to +3.4% after durable goods. https://t.co/pNchSyZ0Ip", "tweet_url": "https://x.com/neilsethinew/status/2115111284685635606", "images": ["https://pbs.twimg.com/media/HVpaS8LWkAAV_Mb.png"], "created_at": "2026-10-27T16:00:01.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Zooming out (not just midterm years).. now is often a great time to buy GS $SPY https://t.co/IzpAF0tkw6", "tweet_url": "https://x.com/MikeZaccardi/status/2115088880705900957", "images": ["https://pbs.twimg.com/media/HVPQampWgAAUeKv.jpg"], "created_at": "2026-10-27T14:31:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: We estimate ~27% of the index is currently in open buyback window, with that number almost doubling to ~50% by the end of the week. \n\nAs reporting progresses and corporate windows systematically reopen, we anticipate an uptick in volumes into November, which seasonally ranks as our second most active execution month on the desk. \n\nIn terms of execution mix, clients are slowly moving back into opportunistic open market flow, with discretionary orders climbing to 16% vs 84% in 10b5-1plans (compared to 15% and 85% respectively in the prior week).", "tweet_url": "https://x.com/neilsethinew/status/2115086264336605205", "images": ["https://pbs.twimg.com/media/HVpLv4fWsAAhFRK.png"], "created_at": "2026-10-27T14:20:36.000Z", "relayers": []}, {"author": "neilsethinew", "text": "From @C_Barraud's Morning Brief, ZeroHedge points out we need another update to the AI \"circular financing\" chart, as Nvidia, AMD and Broadcom, three of Meta's biggest chip suppliers, \"indicated an interest\" in buying up to $5 billion of Meta's announced $95 billion equity offering.\n\nNote though that indication is non-binding, and they \"may determine to purchase more, fewer, or no shares.\" \n\nZH's take: \"If Meta, with an AA- rating and one of the world's two biggest ad businesses, prefers stock to bonds, the question for everyone else is obvious. Oracle hosts its investor day on Wednesday. SpaceX still has to price its $40 billion chip deal. Microsoft and Alphabet report Wednesday, Amazon on Thursday, and Goldman's TMT desk warns that 'any signs of further equity issuance or balance-sheet pressure are unlikely to be well received.' As for the neoclouds, which have neither Starlink nor Instagram to fall back on, Musk has already written the obituary.\"", "tweet_url": "https://x.com/neilsethinew/status/2115063632161636611", "images": ["https://pbs.twimg.com/media/HVo21YXXsAAuLDh.png"], "created_at": "2026-10-27T12:50:40.000Z", "relayers": []}]}, {"bank": "BofA", "theme": "BofA — Fed/FOMC positioning, earnings expectations, consumer spending and inflation charts", "items": [{"author": "neilsethinew", "text": "Into today’s FOMC, BofA’s CTA model shows while trend followers have mostly covered their long-maturity Treasury shorts, there remains a healthy amount of short-maturity shorts which could be at risk from a dovish Warsh:\n\n▪ 20- and 30-year: covering done\n▪ 7- and 10-year: inside their covering ranges, the 10-year ~1bp from finishing\n▪ 2- and 5-year: shorts still on\n\nThe 2-year in particular is highly sensitive to Fed rate expectations. Because the front end is less volatile, BofA thinks those shorts were likely larger at their peak than the long-end ones already unwound. Yields there need to fall another ~7–9bp to start covering, a level BofA calls the “key threshold for a rally extension risk.”\n\nSo an unexpectedly dovish Fed could set off a sharp move lower in front-end yields, as covering adds to the rally.", "tweet_url": "https://x.com/neilsethinew/status/2115466117607281107", "images": ["https://pbs.twimg.com/media/HVuaCfzWMAABZtL.jpg"], "created_at": "2026-10-28T15:30:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Among the aged, 2/3rds of net wealth is held by the wealthiest 10% of households -BofAI https://t.co/kAsBkKh3lf", "tweet_url": "https://x.com/MikeZaccardi/status/2115464531874902390", "images": ["https://pbs.twimg.com/media/HVujyAWXEAAGZKO.jpg"], "created_at": "2026-10-28T15:23:42.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "BofAI: Older generations’ spending growth has slowed \n\nDiscretionary spending growth has been slower among older (Baby Boomer and Traditionalist) households despite wealth effect https://t.co/oxSYsM3XNM", "tweet_url": "https://x.com/MikeZaccardi/status/2115456304894333333", "images": ["https://pbs.twimg.com/media/HVucTC0XQAALTyA.jpg"], "created_at": "2026-10-28T14:51:01.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Given the weakness in the Communications sector last week, probably not a surprise that BofA says clients sold $4.8B of Communication Services stocks, the sector's largest weekly outflow since it was created in 2018 (also the largest relative to market cap). Retail clients did about 70% of that selling. \n\nThat took the headline away from the fact that Industrials saw a 13th straight week of outflows. The longest streak in BofA's data, back to 2008, was 30 weeks in 2016.\n\nElsewhere, clients bought 7 of 11 sectors, led by Consumer Discretionary, Financials and Health Care (over $1B each).", "tweet_url": "https://x.com/neilsethinew/status/2115438434676273604", "images": ["https://pbs.twimg.com/media/HVuKZD6XQAAuQrl.jpg"], "created_at": "2026-10-28T13:40:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BofA says regardless of whether Fed hikes, the bigger picture is the Fed has more work to do. \n\nIf the Fed holds, BofA expects hikes in December and March and seesd risks tilted toward more increases in June and possibly September 2027 if inflation stays sticky despite favorable base effects.\n\nThursday’s September PCE report is part of that case. BofA expects core PCE prices to rise 0.3% (0.35% unrounded – that is their wording), lifting the year-over-year rate a tenth to 3.1%. \n\nEven a 0.15% monthly pace for the rest of the year, roughly 1.8% annualized, would leave core PCE at 2.9% in December, where it ended 2025, so no progress over the year.", "tweet_url": "https://x.com/neilsethinew/status/2115433401427669430", "images": ["https://pbs.twimg.com/media/HVuEh4AXEAARWyC.jpg"], "created_at": "2026-10-28T13:20:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Ahead of this week's batch of earnings a little surprisingly, misses have been getting a pass. \n\nPer BofA, companies missing EPS estimates have outperformed the S&P 500 by 0.7 percentage points the day after reporting, vs. a typical 2-point lag since 2000. \n\nFactSet finds the same: misses have fallen just 0.4% from two days before their reports through two days after, vs. a 3.1% five-year average.\n\nBeats in contrast are being rewarded at roughly normal levels (BofA +0.7 pt vs. +1.0 average; FactSet +1.3% vs. +0.9%)\n\nOverall, the average next-day move is 3.7% vs. 5.3% in 2Q.", "tweet_url": "https://x.com/neilsethinew/status/2115403201885139183", "images": ["https://pbs.twimg.com/media/HVr14DLXQAAW4gp.jpg"], "created_at": "2026-10-28T11:20:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "BofA: Supermarket inflation falls to a 1-yr+ low at 2.6% MTD YoY https://t.co/XjjuH6WdRd", "tweet_url": "https://x.com/MikeZaccardi/status/2115402196573409469", "images": ["https://pbs.twimg.com/media/HVtrFpQWQAAxbK_.png"], "created_at": "2026-10-28T11:16:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Of the major banks, the only one I know that as of this week was still calling for a rate hike today was BofA although it's a curious call given they have \"low conviction\":\n\nAditya Bhave and team are sticking with their out-of-consensus call saying the large beat in September inflation “bolsters the case for an Oct hike,” but concedes it would be “a heavy lift,” with markets pricing only about a 10% chance and the meeting falling six days before the midterm elections. Despite its “strong conviction that the Fed should hike,” BofA says it has “only low conviction that it will,” makng the reasoning behind sticking with the call a little questionable.\n\nBofA frames the meeting as a test of Chair Kevin Warsh’s resolve to bring a “sea change” to the Fed’s forward guidance. Vice Chair Philip Jefferson and New York Fed President John Williams gave what BofA calls “heavy-handed forward guidance” that led markets to price out an October hike. \n\nWhichever way the Fed goes, BofA says Warsh’s job at the press conference will be to head off a “policy error” trade. A hike risks markets pricing in over-tightening, which BofA says could bring a large correction in risk assets and a flatter yield curve. \n\nA hold invites questions about the Fed’s inflation-fighting credibility. It also risks a repeat of the July press conference: a steeper curve, a weaker dollar and a moderate selloff in risk assets.", "tweet_url": "https://x.com/neilsethinew/status/2115398181177700856", "images": ["https://pbs.twimg.com/media/HVr0n9SXUAAmUDT.png"], "created_at": "2026-10-28T11:00:03.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BofA: Ahead of Alphabet and Microsoft later today and Amazon on Thursday BofA notes consensus has the five hyperscalers (Microsoft, Amazon, Alphabet, Meta and Oracle) spending $1.11 trillion on capex in 2027, per BofA. \n\nThat’s now slightly more than the other ~495 S&P 500 companies combined ($1.09 trillion). \n\nTheir share of S&P 500 capex has climbed from 16% in 2023 to a projected 51% in 2027, and 2027 estimates are up nearly 90% this year.", "tweet_url": "https://x.com/neilsethinew/stat // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
