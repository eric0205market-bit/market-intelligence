each signals that state retrenchment, not donor ambition, is the binding constraint on global health budgets.", "quote": "It’s not right for a private philanthropy to be one of the largest funders of multinational global health efforts,", "locator": "The WHO itself has acknowledged issues", "quote_verified": true}, {"claim": "McGoey's second-order argument is that donations alleviating symptoms of wealth inequality end the debate about systemic remedies before it begins, making philanthropy a substitute for rather than a complement to structural reform.", "speaker": "Joel Khalili", "type": "causal", "entities": ["Linsey McGoey", "wealth inequality", "philanthropy"], "conviction": "medium", "so_what": "If accepted, this framing shifts pressure from voluntary giving to taxation; a durable tail risk to founder net worth in high-tax jurisdictions.", "quote": null, "locator": "Donations that alleviate issues stemming from wealth inequality", "quote_verified": false}]}, {"theme": "Moral hazard of pledges that scale with success", "insights": [{"claim": "A pledge that scales with a company's success creates a structural moral hazard: the larger the eventual charitable payout, the easier it is to justify unsavory business practices or reckless accelerationism along the way.", "speaker": "Joel Khalili", "type": "framework", "entities": ["AI industry", "effective altruism", "corporate governance"], "conviction": "high", "so_what": "A reusable lens for auditing mission-driven AI labs: check whether the stated giving commitment is being used to pre-justify risk-taking that would otherwise be constrained.", "quote": null, "locator": "Along with a new generation of techno-philanthropists", "quote_verified": false}, {"claim": "Sam Bankman-Fried's 25-year fraud sentence in 2024 is presented as the template risk, with trial testimony that he based all decisions on cold statistical analysis and gladly risked disaster for a sufficiently positive expected outcome.", "speaker": "Joel Khalili", "type": "anecdote", "entities": ["Sam Bankman-Fried", "FTX", "effective altruism"], "conviction": "high", "so_what": "The FTX precedent is now the standing reputational discount applied to expected-value-maximizing founders; diligence should probe for the same decision style in AI leadership.", "quote": null, "locator": "There is a further risk that entrepreneurs", "quote_verified": false}, {"claim": "The specific AI-era danger identified is that by Bankman-Friedian logic the headlong pursuit of superintelligence becomes justified regardless of consequences so long as the resulting wealth funds a large enough philanthropic impact.", "speaker": "Joel Khalili", "type": "causal", "entities": ["superintelligence", "effective altruism", "Sam Bankman-Fried"], "conviction": "medium", "so_what": "This is the argument regulators will reach for when arguing that lab self-governance is insufficient; it strengthens the case for external AI oversight regimes.", "quote": "By Bankman-Friedian logic, the headlong pursuit of superintelligence would be justified, potential consequences be damned, if the money it creates will have a large enough philanthropic impact.", "locator": "In the context of artificial intelligence", "quote_verified": true}]}, {"theme": "Benchmarks from the prior techno-philanthropy generation", "insights": [{"claim": "The Gates Foundation has given away more than $100 billion over 25 years targeting poverty and disease, setting the scale benchmark any AI-era philanthropy will be measured against.", "speaker": "Joel Khalili", "type": "data_point", "entities": ["Gates Foundation", "Bill Gates", "Melinda Gates"], "conviction": "high", "so_what": "A $100B/25-year run rate is the yardstick; AI pledges measured in billions of unrealized equity are still an order of magnitude short of that deployed total.", "quote": null, "locator": "The Gates Foundation—the most famous embodiment", "quote_verified": false}, {"claim": "Mark Zuckerberg and Priscilla Chan have pledged their $200 billion fortune to scientific research through the Chan Zuckerberg Initiative, showing that pledge headlines are denominated in volatile founder equity rather than cash.", "speaker": "Joel Khalili", "type": "data_point", "entities": ["Mark Zuckerberg", "Priscilla Chan", "Chan Zuckerberg Initiative", "Meta"], "conviction": "medium", "so_what": "Headline pledge values move with the underlying stock, so philanthropic capacity in this cohort is effectively a levered bet on a handful of tech share prices.", "quote": null, "locator": "The Gates Foundation—the most famous embodiment", "quote_verified": false}, {"claim": "The WHO acknowledged problems with its financing and introduced a new funding model in 2022 designed to reduce dependence on a narrow donor base.", "speaker": "Joel Khalili", "type": "data_point", "entities": ["WHO"], "conviction": "medium", "so_what": "Institutional reform at the WHO signals a slow shift back toward assessed government contributions, which would dilute the agenda-setting power of any single private donor.", "quote": null, "locator": "The WHO itself has acknowledged issues", "quote_verified": false}]}], "insight_total": 24, "top_entities": ["David Silver", "Ineffable Intelligence", "Founders Pledge", "Google DeepMind", "effective altruism", "Gates Foundation", "Anton Osika", "Lovable", "OpenAI", "Anthropic", "Sam Bankman-Fried", "WHO"], "source_meta": {"author": "Joel Khalili", "word_count": 1643, "paywalled": false}}, {"record_id": "2bdc094f40e823fd", "source_type": "technology", "source_name": "Wired", "source_url": "https://www.wired.com/story/digital-estate-planning-tips/", "title": "The Complicated Case of Passing On Your Digital Estate", "published_date": "2026-08-09", "language": "en", "processed_at": "2026-08-10T18:16:39Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "Crypto", "Society"], "gist": "US digital-inheritance law (RUFADAA, enacted in 48 states plus DC and the US Virgin Islands) collides with the federal Stored Communications Act so that a named fiduciary can close a decedent's accounts but gets only metadata catalogs unless content access is explicitly granted in a will; meanwhile platform legacy tools from Google, Apple and Meta legally override those written instructions, there is no standard protocol to even notify a provider that a user died, and self-custodied crypto without a key is permanently lost.", "themes": [{"theme": "RUFADAA vs. Stored Communications Act", "insights": [{"claim": "The Revised Uniform Fiduciary Access to Digital Assets Act (RUFADAA) has been enacted in 48 US states plus Washington, DC and the US Virgin Islands, with Massachusetts having adopted but not yet enacted it and Louisiana passing a similar but different law of its own.", "speaker": "Jill Duffy", "type": "data_point", "entities": ["RUFADAA", "Uniform Law Commission", "Benjamin Orzeske", "Massachusetts", "Louisiana"], "conviction": "high", "so_what": "Digital-estate products can be built to a near-national single legal standard, but Louisiana and Massachusetts require carve-outs — a compliance cost line item for any estate-tech or custodial platform.", "quote": null, "locator": "Navigating the Law", "quote_verified": false}, {"claim": "The binding constraint on releasing a dead person's online data is the federal Stored Communications Act, which bars companies holding online assets from releasing them without the user's permission — RUFADAA exists to grant survivors rights while preserving the original holder's privacy.", "speaker": "Jill Duffy", "type": "causal", "entities": ["Stored Communications Act", "RUFADAA", "Benjamin Orzeske"], "conviction": "high", "so_what": "Platform refusal to hand over a decedent's data is a federal-liability posture, not customer-service obstruction — expect providers to stay maximally restrictive until the statute changes.", "quote": "The real point of conflict, according to Orzeske, lies in the Stored Communications Act, a federal law that says companies that handle our online assets can't release them without our permission.", "locator": "The real point of conflict", "quote_verified": true}, {"claim": "Under RUFADAA the default for a named trusted person is the power to close accounts plus a 'catalog' of metadata — send/receive timestamps and sender or recipient details — while the actual contents of emails, private messages, videos, photos and attachments require the decedent to have expressly granted that authority to the personal representative fiduciary.", "speaker": "Jill Duffy", "type": "framework", "entities": ["RUFADAA", "Catherine Hodder", "FindLaw", "Benjamin Orzeske"], "conviction": "high", "so_what": "The content-versus-catalog split is the single decision point that determines whether an estate can recover monetizable digital assets; drafting language, not technology, is the bottleneck.", "quote": "grants the authority to the personal representative fiduciary,", "locator": "Under RUFADAA, a named trusted person", "quote_verified": true}, {"claim": "The legal theory behind RUFADAA is that digital property differs from tangible property because a fiduciary receiving forwarded mail gets only incoming communications, whereas email access hands over a searchable history the deceased may have expected to stay private.", "speaker": "Jill Duffy", "type": "framework", "entities": ["RUFADAA", "Benjamin Orzeske", "email"], "conviction": "high", "so_what": "A reusable mental model — flow versus archive — that explains why every platform will treat inherited access to historical data more restrictively than access to new activity.", "quote": "At the heart of RUFADAA is this recognition that digital property is in some ways different from traditional, tangible property,", "locator": "At the heart of RUFADAA", "quote_verified": true}]}, {"theme": "Crypto custody and inheritance risk", "insights": [{"claim": "Cryptocurrency held in a private wallet whose key nobody else has is permanently unrecoverable at death, whereas crypto held by a third party such as Coinbase or PayPal can be passed on through the estate process.", "speaker": "Jill Duffy", "type": "causal", "entities": ["Bitcoin", "Coinbase", "PayPal", "cryptocurrency", "self-custody"], "conviction": "high", "so_what": "Inheritance friction is a structural, demographic tailwind for custodial exchanges and a permanent supply-destruction mechanism for self-custodied coins — relevant both to exchange revenue and to circulating-supply models.", "quote": "If it's stored in a private wallet and no one has the key, the money is lost forever.", "locator": "What about cryptocurrency?", "quote_verified": true}, {"claim": "Social media accounts that earn dividends create an unresolved question of how a beneficiary collects future proceeds and whether the account should be kept alive at all, making creator accounts a cash-flowing asset with no established succession mechanism.", "speaker": "Jill Duffy", "type": "thesis", "entities": ["social media", "creator economy", "beneficiaries"], "conviction": "medium", "so_what": "As the creator economy ages, monetized-account succession becomes a real asset class problem — watch for platforms or specialists that build transferable creator-account rights.", "quote": null, "locator": "Digital assets can have as much monetary value", "quote_verified": false}]}, {"theme": "Platform legacy tools override your will", "insights": [{"claim": "A platform's own online legacy controls take top priority and can override the instructions a person writes into their will, which is why the recommended action is to name a fiduciary in a will and deliberately NOT enable the built-in legacy features.", "speaker": "Jill Duffy", "type": "contrarian", "entities": ["Mike Kiser", "Google", "Apple", "Meta", "OpenID Foundation"], "conviction": "high", "so_what": "The advice inverts the intuitive default of using platform tools; it signals that private contract terms currently outrank probate documents, a governance gap regulators or standards bodies will eventually attack.", "quote": "a platform’s own online controls take top priority and thus could override what you put into your instructions", "locator": "Also, do not enable those legacy features", "quote_verified": true}, {"claim": "Google has offered Inactive Account Manager since 2013 and Apple and Meta use 'legacy contact' terminology, with Instagram filing the same function under 'memorialization' — inconsistent naming across custodians that itself obstructs users finding the feature.", "speaker": "Jill Duffy", "type": "data_point", "entities": ["Google", "Apple", "Meta", "Instagram", "Inactive Account Manager"], "conviction": "high", "so_what": "Thirteen-plus years after Google shipped the first tool the category still has no common vocabulary — evidence that no incumbent is investing here and that the standards gap is wide open.", "quote": null, "locator": "The Shortcomings of Built-In Tools", "quote_verified": false}, {"claim": "Instagram's death-transfer flow requires the designated recipient to already hold an Instagram account before they can download a decedent's content, embedding user acquisition into the bereavement process.", "speaker": "Jill Duffy", "type": "data_point", "entities": ["Instagram", "Meta"], "conviction": "high", "so_what": "A concrete example of platforms designing inheritance to retain users rather than to serve estates — the kind of dark-pattern detail that draws consumer-protection scrutiny.", "quote": null, "locator": "For example, if you want to give someone permission", "quote_verified": false}]}, {"theme": "The missing death-notification protocol", "insights": [{"claim": "There is no defined technical or procedural way to tell an online provider that a user has died or lost capacity, so every built-in legacy tool still depends on a human successfully reaching the company by unspecified means.", "speaker": "Jill Duffy", "type": "thesis", "entities": ["Mike Kiser", "OpenID Foundation", "Death in the Digital Estate Community Group"], "conviction": "high", "so_what": "This is the identity-infrastructure hole that makes all downstream tooling brittle; whoever standardizes the death/incapacity signal captures a chokepoint across every consumer platform.", "quote": "there is no defined way to tell a provider that someone has died or lost capacity.", "locator": "Mike Kiser, a co-chair", "quote_verified": true}, {"claim": "The OpenID Foundation has stood up a Death in the Digital Estate Community Group whose long-term goal is developing protocols and guidance for users to manage their digital estates.", "speaker": "Jill Duffy", "type": "data_point", "entities": ["OpenID Foundation", "Mike Kiser"], "conviction": "medium", "so_what": "A standards effort at this early a stage is the leading indicator to track for when identity vendors and password managers get an interoperable hook to build against.", "quote": null, "locator": "His group has the long-term goal", "quote_verified": false}, {"claim": "Users who never gave a platform their real name or real date of birth leave their trusted contact unable to prove the account was ever theirs, converting past privacy hygiene into an inheritance failure mode.", "speaker": "Jill Duffy", "type": "causal", "entities": ["identity verification", "data custodians"], "conviction": "medium", "so_what": "Pseudonymity and estate recoverability are directly in tension — a design constraint any privacy-first identity product will eventually have to price in.", "quote": null, "locator": "What happens if you never gave your real name", "quote_verified": false}]}, {"theme": "Why DIY handoffs fail in practice", "insights": [{"claim": "Biometric-gated two-factor authentication apps defeat credential handoff entirely: even a trusted person holding every password from a password manager cannot complete logins that require the decedent's fingerprint.", "speaker": "Jill Duffy", "type": "anecdote", "entities": ["two-factor authentication", "biometrics", "password managers"], "conviction": "high", "so_what": "Security hardening and estate recoverability move in opposite directions — a real product gap for password managers and MFA vendors to solve with recovery delegation.", "quote": "my two-factor authentication app is protected by biometrics", "locator": "While researching this story", "quote_verified": true}, {"claim": "A colleague of an OpenID Foundation working-group co-chair built a DIY digital-estate handoff system, then tested it from his trusted person's perspective and failed at the very first step, indicating even expert-designed solutions break on first contact.", "speaker": "Jill Duffy", "type": "anecdote", "entities": ["Mike Kiser", "OpenID Foundation"], "conviction": "high", "so_what": "Treat any digital-estate solution as unvalidated until dry-run tested from the successor's seat; the failure rate among sophisticated users is the market opportunity.", "quote": "He failed in step one,", "locator": "Kiser says that one of his colleagues", "quote_verified": true}, {"claim": "Someone other than the account holder logging in with inherited credentials likely violates the data custodian's terms of service, and enforcement is plausible in high-profile cases such as celebrities and public figures.", "speaker": "Jill Duffy", "type": "causal", "entities": ["terms of service", "data custodians"], "conviction": "medium", "so_what": "Credential-sharing workarounds carry legal tail risk, which is why the durable solution has to be contractual and statutory rather than technical.", "quote": null, "locator": "There's also the sticky issue", "quote_verified": false}]}, {"theme": "Actionable playbook and its limits", "insights": [{"claim": "Credentials must never be listed in a will because a will is a public document; the will should name the person and the specific assets, while passwords are shared separately and only with the people who need them.", "speaker": "Jill Duffy", "type": "framework", "entities": ["Catherine Hodder", "FindLaw", "wills"], "conviction": "high", "so_what": "A hard operational rule that splits the legal instrument from the secret store — and explains why password managers with legacy features sit adjacent to, not inside, the legal workflow.", "quote": "the will is a public document.", "locator": "The way to give that permission", "quote_verified": true}, {"claim": "An unencrypted USB drive holding a full local export of your data is a workable fallback for heirs but requires disciplined regular re-export and still does nothing to terminate the online accounts you want closed.", "speaker": "Jill Duffy", "type": "framework", "entities": ["local backup", "USB drive"], "conviction": "medium", "so_what": "Data preservation and account termination are two separate problems; solutions that solve only one leave a recurring liability behind.", "quote": null, "locator": "One other possibility is to create a local backup", "quote_verified": false}, {"claim": "The single most important maintenance step is updating final-instruction documents every time accounts change or assets move, meaning digital estate planning is a recurring obligation rather than a one-time filing.", "speaker": "Jill Duffy", "type": "thesis", "entities": ["estate planning", "fiduciary"], "conviction": "high", "so_what": "Recurring-maintenance framing is what turns digital estate planning into a subscription business rather than a one-off legal fee.", "quote": null, "locator": "Most important of all, update your final instructions", "quote_verified": false}, {"claim": "Even where wishes are written into a will, family in-fighting over a decedent's accounts remains the likeliest real-world outcome — the will's practical value is the legal protection it gives the fiduciary rather than conflict avoidance.", "speaker": "Jill Duffy", "type": "contrarian", "entities": ["fiduciary", "wills", "beneficiaries"], "conviction": "medium", "so_what": "Sets realistic expectations for what estate documentation buys — indemnity, not harmony — which is how such services should actually be underwritten and sold.", "quote": null, "locator": "A more likely scenario is that loved ones disagree", "quote_verified": false}]}], "top_entities": ["RUFADAA", "Stored Communications Act", "OpenID Foundation", "Mike Kiser", "Benjamin Orzeske", "Catherine Hodder", "Google", "Apple", "Meta", "Instagram", "Coinbase", "Bitcoin"], "source_meta": {"author": "Jill Duffy", "word_count": 1551, "paywalled": false}, "insight_total": 19}, {"record_id": "ba579e31d1004a62", "source_type": "technology", "source_name": "Wired", "source_url": "https://www.wired.com/story/space-agencies-trying-stop-astronauts-losing-sight/", "title": "Space Agencies Are Trying to Keep Astronauts From Losing Their Sight", "published_date": "2026-08-10", "language": "en", "processed_at": "2026-08-10T12:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "Society"], "gist": "The European Space Agency has commissioned UK startup Siloton to shrink optical-coherence retinal scanning onto a coin-sized photonic chip, because spaceflight-associated neuro-ocular syndrome (SANS) already affects ~70% of ISS astronauts and current ISS eye-scanning hardware is bulky and needs real-time ground guidance that deep-space comms delays will make impossible. Siloton's cofounder frames the space contract as dual-use R&D that directly upgrades its NHS at-home self-scanning product for elderly retinal patients.", "themes": [{"theme": "SANS as a mission-limiting risk", "insights": [{"claim": "Spaceflight-associated neuro-ocular syndrome (SANS) affects roughly 70 percent of astronauts aboard the International Space Station according to NASA, making eye degradation a near-universal rather than edge-case crew health problem.", "speaker": "Isabella Ward", "type": "data_point", "entities": ["NASA", "International Space Station", "SANS"], "conviction": "high", "so_what": "A ~70% incidence rate turns astronaut vision into a budgeted, recurring procurement line for every crewed program, not a research curiosity — a durable demand signal for space-medicine hardware suppliers.", "quote": "it impacts around 70 percent of astronauts on the International Space Station, according to NASA", "locator": "Spaceflight-associated neuro-ocular syndrome (SANS) is a collection", "quote_verified": true}, {"claim": "NASA astronaut John Phillips launched to the ISS in 2005 with 20/20 vision and returned six months later at 20/100 — moderate visual impairment — after fluid pooled in his head, squashed his eyeballs, swelled the optic nerve and pushed the retina forward.", "speaker": "Isabella Ward", "type": "anecdote", "entities": ["John Phillips", "NASA", "International Space Station"], "conviction": "high", "so_what": "A documented 20/20-to-20/100 loss over just six months sets the severity benchmark planners must price for on multi-year Mars-class missions.", "quote": "launched to the ISS in 2005 with 20/20 vision, and splashed down six months later with his vision at 20/100", "locator": "One of the starkest cases is that of NASA astronaut", "quote_verified": true}, {"claim": "The mechanism of SANS is mechanical rather than radiological — in microgravity bodily fluid, uninhibited by gravity, accumulates in the head and physically deforms the eyeball and optic nerve — which means shielding and radiation countermeasures do not address it.", "speaker": "Isabella Ward", "type": "causal", "entities": ["SANS", "microgravity", "optic nerve"], "conviction": "high", "so_what": "Separates the SANS problem from the radiation-mitigation market: the addressable solutions are diagnostics, fluid-shift countermeasures and artificial gravity, not shielding materials.", "quote": "bodily fluid, uninhibited by gravity, built up in his head, squashing his eyeballs, swelling his optic nerve, and pushing his retina forward", "locator": "While he was in space, bodily fluid", "quote_verified": true}, {"claim": "Space agencies weigh two distinct SANS costs — the operational risk of an astronaut losing vision mid-mission and the long-term health liability after return — and returning to Earth only reverses some of the damage.", "speaker": "Isabella Ward", "type": "framework", "entities": ["European Space Agency", "UK Space Agency"], "conviction": "medium", "so_what": "Partial irreversibility means agencies cannot defer the problem to post-flight care, which forces in-flight diagnostic spend now rather than after Artemis flies.", "quote": "While returning to Earth can reverse some of the damage, space agencies are concerned by both the operational risk of astronauts losing their vision mid-mission, as well as the longer-term health impacts.", "locator": "While returning to Earth can reverse some", "quote_verified": true}]}, {"theme": "Comms latency forces autonomous diagnostics", "insights": [{"claim": "The existing ISS eye-monitoring device — a modified optometry instrument measuring the thickness of layers at the back of the eye — is bulky and requires real-time remote guidance from experts on the ground, a dependency that breaks as deep-space communication delays lengthen.", "speaker": "Isabella Ward", "type": "causal", "entities": ["International Space Station", "European Space Agency"], "conviction": "high", "so_what": "Light-speed latency is the forcing function creating a new product category: every ground-in-the-loop medical instrument on ISS becomes an obsolete SKU once missions leave cislunar space.", "quote": "the device is bulky and requires real-time remote guidance from experts on the ground", "locator": "However, the device is bulky", "quote_verified": true}, {"claim": "Siloton's pitch is automation of the scan workflow so examinations need no ground support, letting astronauts self-scan retinas far more frequently and generating a denser longitudinal dataset the ESA hopes will surface early warning signs before any vision change occurs.", "speaker": "Isabella Ward", "type": "thesis", "entities": ["Siloton", "European Space Agency"], "conviction": "medium", "so_what": "The value accrues to the data cadence, not the optics — whoever owns the longitudinal ocular dataset owns the eventual predictive/treatment IP for SANS.", "quote": "possibly provide early warning signs that changes in the eye may be occurring—even before they result in vision change", "locator": "Siloton’s device would allow astronauts to scan", "quote_verified": true}, {"claim": "Spaceflight-grade eye scanning faces hard engineering constraints beyond optics: batteries are largely disallowed because of fire risk, the binocular-sized unit competes for scarce cabin volume, and head stabilization normally provided by a gravity-dependent chin rest must be re-engineered.", "speaker": "Isabella Ward", "type": "data_point", "entities": ["Siloton", "spacecraft design"], "conviction": "medium", "so_what": "Power, volume and restraint constraints — not imaging performance — are the real moat and the real schedule risk for any terrestrial medtech trying to sell into crewed spaceflight.", "quote": "Other technical challenges include getting around using batteries to power the device because they pose such a big fire risk.", "locator": "Other technical challenges include getting around", "quote_verified": true}]}, {"theme": "Photonic-chip miniaturization and dual-use economics", "insights": [{"claim": "Siloton, founded by physicists in 2020, uses quantum technology to shrink the core components of optometrist-grade eye-testing equipment onto a photonic chip smaller than a coin — a size and cost step-change versus benchtop retinal imaging hardware.", "speaker": "Isabella Ward", "type": "data_point", "entities": ["Siloton", "photonic chip", "quantum technology"], "conviction": "high", "so_what": "Chip-scale retinal imaging is the enabling shift that opens home and remote-care diagnostics markets far larger than the space niche; watch photonic-integration plays for the same collapse in instrument BOM cost.", "quote": "uses quantum technology to shrink core components used in eye-testing equipment found at optometrists to fit on a photonic chip smaller than a coin", "locator": "The health tech uses quantum technology", "quote_verified": true}, {"claim": "Siloton is already building the same capability for the UK's National Health Service so retinal-condition patients can self-scan at home, and its CTO Euan Allen says the ESA's requirements are essentially identical, just in a different environment.", "speaker": "Isabella Ward", "type": "thesis", "entities": ["Siloton", "NHS", "European Space Agency", "Euan Allen"], "conviction": "high", "so_what": "One R&D stack serving two funded buyers — a national health system and a space agency — means the space contract is effectively non-dilutive development capital for a much bigger terrestrial TAM.", "quote": "The ESA pretty much has the same requirements", "locator": "Founded by physicists in 2020, Siloton", "quote_verified": true}, {"claim": "Allen argues the hard usability problem is terrestrial, not orbital: getting an 80-year-old patient with existing visual impairment to self-scan is harder than getting a young, highly trained astronaut with full eye function to do it.", "speaker": "Isabella Ward", "type": "contrarian", "entities": ["Euan Allen", "Siloton", "NHS"], "conviction": "high", "so_what": "Inverts the usual assumption that space qualification is the gating risk — if the NHS elderly-patient use case is the harder validation, execution risk sits in the commercial channel, not the ESA contract.", "quote": "We're very confident, because we're trying to do that with 80-year-old patients who already have some level of visual imparity", "locator": "But that’s a walk-in-the-park compared with getting a retiree", "quote_verified": true}, {"claim": "Allen expects bidirectional technology bleed-through, with space-hardening work improving the NHS home device and vice versa, framing the ESA program as a product-quality subsidy rather than a standalone revenue line.", "speaker": "Isabella Ward", "type": "framework", "entities": ["Siloton", "NHS", "European Space Agency", "Euan Allen"], "conviction": "medium", "so_what": "Classic dual-use flywheel: judge such companies on whether agency contracts measurably harden the commercial product, not on contract value alone.", "quote": "All this research and development work, in principle, is making our products that are going to go into the NHS much better.", "locator": "I think lots of the stuff that we're doing for space", "quote_verified": true}]}, {"theme": "Artemis-driven procurement window", "insights": [{"claim": "The ESA commissioned Siloton's solution specifically ahead of the international Artemis moon flights and other deep-space missions, and the UK Space Agency's director Rebecca Evernden publicly calls SANS a serious health risk for long missions.", "speaker": "Isabella Ward", "type": "data_point", "entities": ["European Space Agency", "Artemis", "UK Space Agency", "Rebecca Evernden", "Siloton"], "conviction": "high", "so_what": "Artemis timelines put a dated procurement window on crew-health hardware, and UK agency endorsement signals national-level funding support behind small British space-medtech suppliers.", "quote": "The eye condition SANS is a serious health risk facing astronauts on long missions", "locator": "The agency has commissioned British eye-scanning startup Siloton", "quote_verified": true}]}], "insight_total": 12, "top_entities": ["Siloton", "European Space Agency", "NASA", "International Space Station", "SANS", "NHS", "Euan Allen", "Artemis", "UK Space Agency", "John Phillips", "Rebecca Evernden"], "source_meta": {"author": "Isabella Ward", "word_count": 708, "paywalled": false}}, {"record_id": "ecc211afd3099e56", "source_type": "technology", "source_name": "Wired", "source_url": "https://www.wired.com/story/the-rise-of-the-1-am-job-interview/", "title": "The Rise of the 1 am Job Interview", "published_date": "2026-08-10", "language": "en", "processed_at": "2026-08-10T12:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI", "Society", "Macro"], "gist": "AI voice and video interviewing has crossed into mainstream hiring - roughly two-thirds of applicants have now faced an AI agent, and vendors Ribbon and Greenhouse report 15-35% of AI interviews happening between 10 pm and 2 am local time - but candidate resistance is severe, with 38% of US candidates saying they have already withdrawn from a process rather than be screened by AI. The economic driver is an application deluge created by candidates' own AI-written resumes, which pushes employers toward automated first-round scoring that in practice often no human ever watches.", "themes": [{"theme": "Off-hours interviewing becomes structural", "insights": [{"claim": "Ribbon, a voice-AI recruitment software vendor, reports that 24 percent of its AI interviews across more than 500 client companies occur between 10 pm and 2 am local time.", "speaker": "Kate Taylor", "type": "data_point", "entities": ["Ribbon", "Arsham Ghahramani", "voice AI", "recruitment software"], "conviction": "high", "so_what": "Async AI interviewing unlocks a labor pool that cannot interview during business hours; HR-tech vendors selling 24/7 screening capacity have a usage-driven wedge, not just a cost-cutting pitch.", "quote": "Twenty-four percent of Ribbon’s AI interviews take place between 10 pm and 2 am local time, according to data from the more than 500 companies that use the service.", "locator": "Arsham Ghahramani said that he noticed", "quote_verified": true}, {"claim": "Late-night AI interviewing skews heavily toward blue-collar hiring: for Ribbon's manufacturing clients, 35 percent of AI interviews happen between 10 pm and 2 am, versus 24 percent overall.", "speaker": "Kate Taylor", "type": "data_point", "entities": ["Ribbon", "manufacturing", "hourly workers"], "conviction": "high", "so_what": "The clearest near-term commercial market for AI interviewing is high-volume shift-worker hiring (manufacturing, kitchens, logistics), not white-collar roles - watch which vendors position there first.", "quote": "For his manufacturing clients, that figure jumps to 35 percent.", "locator": "For his manufacturing clients", "quote_verified": true}, {"claim": "Greenhouse independently corroborates the off-hours pattern, reporting that roughly 15 to 20 percent of candidates interviewed by its voice agent now schedule that interview at night.", "speaker": "Kate Taylor", "type": "data_point", "entities": ["Greenhouse", "voice AI"], "conviction": "high", "so_what": "Two unaffiliated platforms showing the same shift makes this a category-level behavior change rather than one vendor's sampling artifact.", "quote": "Hiring platform Greenhouse says that roughly 15 to 20 percent of candidates interviewed by its voice agent now schedule an interview at night.", "locator": "Ribbon isn’t the only platform", "quote_verified": true}, {"claim": "The demand driver for off-hours interviewing is scheduling constraint rather than preference - parents, hourly-paid employees, and people tied up on noisy factory floors or in kitchens cannot free 30 minutes during the workday.", "speaker": "Kate Taylor", "type": "causal", "entities": ["Ribbon", "Arsham Ghahramani", "hourly workers", "manufacturing"], "conviction": "medium", "so_what": "If constraint rather than convenience drives usage, adoption is sticky in shift-work sectors and should track hourly-employment volume rather than the white-collar hiring cycle.", "quote": "Many parents can’t sacrifice 30 minutes until the clock strikes 10 pm.", "locator": "This is a genuinely new option for people", "quote_verified": true}]}, {"theme": "AI screening penetration vs. candidate revolt", "insights": [{"claim": "A Greenhouse survey in May found nearly two-thirds of job applicants have been interviewed by an AI agent, up 13 percentage points in six months.", "speaker": "Kate Taylor", "type": "data_point", "entities": ["Greenhouse", "AI agent", "job applicants"], "conviction": "high", "so_what": "AI interviewing is past pilot stage and compounding fast - a ~13-point half-year gain implies near-saturation of applicant exposure within a year or two, pulling forward vendor revenue and regulatory attention alike.", "quote": "nearly two-thirds of job applicants have been interviewed by an AI agent, up 13 points over six months", "locator": "While a Greenhouse survey in May found", "quote_verified": true}, {"claim": "Thirty-eight percent of American candidates told Greenhouse they had already withdrawn from a hiring process rather than be interviewed by an AI, and another 12 percent said they would drop out if an AI interview were required.", "speaker": "Kate Taylor", "type": "data_point", "entities": ["Greenhouse", "AI interviews", "job applicants"], "conviction": "high", "so_what": "Roughly half the applicant pool is willing to self-select out - a direct quality-of-hire cost employers deploying AI screening are not currently pricing, and a plausible trigger for backlash or hybrid product redesign.", "quote": "Thirty-eight percent of American candidates told Greenhouse that they had withdrawn from a hiring process rather than be interviewed by an AI.", "locator": "Thirty-eight percent of American candidates", "quote_verified": true}, {"claim": "The head of Greenhouse's own voice AI division says AI should not replace human interviews, positioning the product as a resume add-on that surfaces high-scoring candidates who would otherwise be lost in the application deluge.", "speaker": "Kate Taylor", "type": "thesis", "entities": ["Greenhouse", "Ophir Samson", "voice AI"], "conviction": "medium", "so_what": "Vendor messaging is already defensive about full automation, so category roadmaps and pricing will be framed as augmentation - capping how much recruiting headcount cost employers can credibly claim to remove.", "quote": "he doesn’t think artificial intelligence should replace human interviews", "locator": "Ophir Samson, who became head of Greenhouse’s", "quote_verified": true}, {"claim": "Candidate anxiety centers on opacity - applicants do not know how their recorded interview footage will be used or whether an AI can reject them for failing to say a certain buzzword.", "speaker": "Kate Taylor", "type": "thesis", "entities": ["AI interviews", "job applicants", "video interviews"], "conviction": "medium", "so_what": "Disclosure and handling of recorded candidate footage is the obvious regulatory and litigation attack surface for this category; mandated transparency would raise vendor compliance costs.", "quote": "One of the major stressors for applicants is the lack of transparency on how the footage will be used.", "locator": "One of the major stressors for applicants", "quote_verified": true}]}, {"theme": "How the scoring machine works", "insights": [{"claim": "Typical AI interviews are scored against a job-specific rubric - technical skills or certifications for a welder, an 'enthusiasm' score for a sales role - with the AI analyzing footage, assigning a score, and passing that score plus the video to a recruiter.", "speaker": "Kate Taylor", "type": "framework", "entities": ["Ribbon", "Arsham Ghahramani", "AI interviews", "sales roles"], "conviction": "high", "so_what": "Machine-scoring subjective traits like enthusiasm is precisely where disparate-impact claims land, and it makes candidate-side rubric-gaming tools a natural adjacent market.", "quote": "a sales role might include an “enthusiasm” score", "locator": "While different employers and services vary", "quote_verified": true}, {"claim": "In practice many AI interviews are never watched by a human at all, meaning the machine score is the effective hiring decision even where vendors describe humans as remaining in the loop.", "speaker": "Kate Taylor", "type": "contrarian", "entities": ["AI interviews", "recruiter", "Greenhouse", "Ribbon"], "conviction": "medium", "so_what": "The 'augmentation not replacement' framing is thinner than marketed; any rule requiring meaningful human review of automated hiring decisions would hit the real workflow, not just the stated one.", "quote": "though, realistically, many of the interviews go unwatched by humans", "locator": "AI analyzes footage of the interview", "quote_verified": true}]}, {"theme": "AI arms race across the hiring funnel", "insights": [{"claim": "Candidates mass-using AI to write resumes is the stated cause of the application deluge in which good candidates cannot stand out, which in turn creates employer demand for AI screening - a self-reinforcing loop on both sides of the funnel.", "speaker": "Kate Taylor", "type": "causal", "entities": ["Greenhouse", "Ophir Samson", "AI", "resumes", "hiring"], "conviction": "high", "so_what": "Demand for recruiting AI is endogenous to consumer generative-AI adoption rather than to hiring volume, giving the category a rare countercyclical growth driver even in a weak labor market.", "quote": "You’re competing with thousands of candidates that are all using AI to write their résumés. So, good candidates can’t stand out.", "locator": "It’s a shitty time to be a candidate", "quote_verified": true}, {"claim": "The vendor framing reframes the decision as ghosting versus AI screening rather than human versus robot, arguing an AI interview improves the chance of eventually reaching a human interviewer in the next round.", "speaker": "Kate Taylor", "type": "framework", "entities": ["Greenhouse", "Ophir Samson", "AI interviews"], "conviction": "medium", "so_what": "This narrative has to hold for adoption to survive a 38% withdrawal rate; if candidate outcomes do not visibly improve, the category faces a trust problem it cannot message its way out of.", "quote": "as a choice between human and robot, but a choice between being ghosted", "locator": "Samson describes Greenhouse’s approach", "quote_verified": true}, {"claim": "Greenhouse acquired a voice AI startup in May and installed its founder as head of the resulting voice AI division, showing that established hiring platforms are buying conversational screening capability rather than building it.", "speaker": "Kate Taylor", "type": "data_point", "entities": ["Greenhouse", "Ophir Samson", "voice AI", "acquisition"], "conviction": "high", "so_what": "Incumbent hiring platforms are consolidating voice-AI point solutions, which sets an exit path for private vendors like Ribbon and compresses the window for standalone players.", "quote": "who became head of Greenhouse’s voice AI division when the company acquired his startup in May", "locator": "Ophir Samson, who became head", "quote_verified": true}, {"claim": "The candidate-facing format is a timed one-way recording - roughly 30 seconds to think, then two minutes to answer, with open-ended scheduling that pushes sessions into the late evening.", "speaker": "Kate Taylor", "type": "anecdote", "entities": ["automated video interviews", "Tim Millard", "media relations"], "conviction": "medium", "so_what": "The format itself - timed, unwatched, no human contact - is what generates the withdrawal statistics, so softening it is the likeliest axis of product differentiation for vendors.", "quote": "Once the 30 seconds was up, ‘ding!’ Now you have two minutes to record your answer", "locator": "The questions were pretty standard", "quote_verified": true}]}], "insight_total": 14, "top_entities": ["Greenhouse", "Ribbon", "Ophir Samson", "Arsham Ghahramani", "Tim Millard", "voice AI", "AI interviews", "manufacturing", "recruitment", "WIRED"], "source_meta": {"author": "Kate Taylor", "word_count": 899, "paywalled": false}}, {"record_id": "b6faad73a99bdc20", "source_type": "technology", "source_name": "Wood Mackenzie", "source_url": "https://www.woodmac.com/news/opinion/rise-of-the-robots-how-surging-growth-in-robotics-is-boosting-power-demand/", "title": "Rise of the r // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
