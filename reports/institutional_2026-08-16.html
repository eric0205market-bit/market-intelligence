<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Institutional Research</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #7c3aed;          /* purple — institutional report accent */
  --accent-soft: #f3eefc;
  --divergence: #d94052;      /* divergence red */
  --consensus: #15803d;       /* consensus green */
  --yellow: #fff5b3;

  /* category colors (institutional schema: rates, growth, fx, equities,
     credit, crypto, energy, commodities, geopolitics, ai_tech, em) */
  --cat-rates: #2563eb;
  --cat-growth: #d97706;
  --cat-fx: #0891b2;
  --cat-equities: #15803d;
  --cat-credit: #be185d;
  --cat-crypto: #8b5cf6;
  --cat-energy: #dc2626;
  --cat-commodities: #ea580c;
  --cat-geopolitics: #b91c1c;
  --cat-ai_tech: #4f46e5;
  --cat-em: #059669;
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 980px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 12px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* STATS BAR (top: period + coverage) */
.stats-top { margin-bottom: 16px; padding: 8px 12px; background: var(--surface);
             border: 1px solid var(--border); border-radius: 6px;
             font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
             color: var(--text-2); display: flex; gap: 16px; flex-wrap: wrap; }
.stats-top strong { color: var(--text); font-weight: 600; }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 10px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* THEME CARD (Section A) */
.theme { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.theme:last-child { border-bottom: none; }
.theme-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
              flex-wrap: wrap; }
.theme-title { font-weight: 600; font-size: 14.5px; }
.theme-stance { display: grid; grid-template-columns: 1fr; gap: 6px; margin-bottom: 10px; }
@media (min-width: 720px) { .theme-stance { grid-template-columns: 1fr 1fr; } }
.theme-line { font-size: 13px; padding: 8px 10px; border-radius: 4px;
              border-left: 3px solid var(--border); background: #fafafa; line-height: 1.5; }
.theme-line.consensus { border-left-color: var(--consensus); background: #f0f9f3; }
.theme-line.divergence { border-left-color: var(--divergence); background: #fdf6f7; }
.theme-line .lbl { font-family: 'IBM Plex Mono', monospace; font-size: 10px;
                   text-transform: uppercase; letter-spacing: .06em;
                   color: var(--text-3); display: block; margin-bottom: 2px; }
.theme-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
               border-left: 2px solid var(--border-light); }
.theme-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-source { font-weight: 600; color: var(--accent); }
a.item-source { text-decoration: none; }
a.item-source:hover { text-decoration: underline; }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-title { font-weight: 600; font-size: 14px; margin: 4px 0 6px; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DEEP READS (Section C) — purple left border to mark flagship long-form */
.section-deepreads .item-card { border-left: 4px solid var(--accent); background: var(--accent-soft); }

/* HOUSE VIEWS — compact one-line-per-source list */
.hv-row { display: flex; gap: 10px; align-items: baseline;
          padding: 6px 16px; border-bottom: 1px solid var(--border-light);
          font-size: 13px; }
.hv-row:last-child { border-bottom: none; }
.hv-name { font-weight: 600; color: var(--accent); min-width: 180px;
           text-decoration: none; }
.hv-name:hover { text-decoration: underline; }
.hv-stance { color: var(--text); flex: 1; }

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 110px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .hv-row { flex-direction: column; gap: 2px; }
  .hv-name { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "INSTITUTIONAL RESEARCH", "collected_at": "2026-08-16T06:42:00.000Z", "period": {"lookback_days": 10, "from": "2026-08-06", "to": "2026-08-15"}, "input_stats": {"total_articles": 370, "sources_present": 55, "after_filter": 166}, "summary": "**Rates / Fed:** Consensus across **UBS**, **Standard Chartered**, **JPMorgan** and **BCA Research** is the Fed holds through year-end under new Chair **Kevin Warsh**, with September hike odds falling from above 50% to roughly **35%** after a weak July payrolls print (**-23k**) and cooling CPI (3.4%/2.5% core). Sharpest split: **Franklin Templeton/Western Asset** says the market is overpricing hike risk and is extending duration toward 10yr yields near 4.75%, while **WisdomTree** recommends its Zero Duration ETF suite to protect against further AI-debt-driven yield increases — opposite ends of the duration trade.\n\n**US Labor & Growth:** Payrolls have clearly cooled (**-23k** in July, 3-month average near **+20k**, well below breakeven) and participation sits at a **5-year low**, but the read on what that means splits sharply. **PIMCO** and **Oxford Economics** see genuine slack forming and argue the Fed may already be tighter than needed; **KKR** and **ClearBridge/Franklin Templeton** counter that the broader economy — strong ISM, low jobless claims, an AI-capex-driven productivity cycle — is firmer than the payroll print implies.\n\n**Yen / BoJ:** The July 31 US-Japan intervention (**$52-87bn** depending on the estimate) bought time but didn't fix the structural problem, all agree. **Capital Economics** is the outlier: it calls the yen fundamentally undervalued (fair value ¥125-130) and expects material appreciation as the **BoJ hikes toward 2%**; **Barclays'** Yoichi Takemura instead sees durable weakness from Japanese households shifting savings abroad and recommends fading bear-flattening JGB trades on Japan's own long-term fiscal risk.\n\n**US Equities:** Consensus stays constructive — Q2 beat rates ran **77-87%** across desks and the rally is **broadening** beyond the Magnificent Seven (BNY: 72% of S&P 500 above its 200-day average). The divide is US-vs-rest-of-world: **BNP Paribas** argues 2026 has reprised US exceptionalism on a $755bn-vs-$100bn AI capex gap with China, while **UBS**, **Citi** and **Standard Chartered** are actively pushing clients to diversify into Europe, Asia ex-Japan and small caps to escape Mag-7 concentration risk.\n\n**AI Capex Sustainability:** Nobody disputes the scale — **Goldman Sachs** puts 2026 global AI investment near **$1 trillion**, and an HSBC survey of 200+ investors finds 90% call current capex appropriate or under-utilized. **Gavekal's** Will Denyer is the lone bear flagging it as the single biggest swing factor for global growth and yields, while **Bridgewater** cautions markets are still pricing the AI buildout phase, not the harder adoption phase.\n\n**Credit:** AI-linked issuance is reshaping the market — $1.2tn of IG issuance in H1 2026 (**Franklin Templeton**) and hyperscalers now ~5% of the USD IG index (**PIMCO**). Where houses split: **Apollo (Torsten Slok)** and **RBC** frame private credit as the *solution* closing the AI funding gap, while the **Federal Reserve's** own research flags banks still concentrated behind BDCs and smaller borrowers structurally unable to substitute into leveraged loans if private credit pulls back.\n\n**Oil / Middle East:** Consensus is a **'prolonged stalemate'** (Standard Chartered) around the Strait of Hormuz that keeps a risk premium alive without escalating further; **Oxford Economics** raised its 2026 oil forecast to average **$85/bbl**. **Goldman's** Ashok Varadhan is the outlier, naming oil settling **below $70/bbl** by year-end as his single best trade for 2026.\n\n**Crypto:** Bitcoin remains well off its October 2025 high (~$126k) with leverage contracting for a second straight quarter (**Galaxy**). **CoinShares** sees range-bound trading toward $80k near-term, needing clearer labor deterioration for a durable move to $100k, while **Galaxy Research's** house call is BTC at **$250k by end-2027** — a wide gap on time horizon rather than direction.\n\n**Emerging Markets:** **BNP Paribas** makes a repeated valuation case for EM equities (10x forward earnings vs 20x for the S&P 500). **BCA Research** challenges the standard playbook directly, arguing a coming dollar regime shift — from pro-cyclical to counter-cyclical — means EM equities would **not** rally even as the dollar weakens, upending the conventional weak-dollar-helps-EM assumption most other houses lean on.", "sections": {"A_debates": [{"theme": "Rates & Central Banks", "category": ["rates"], "consensus": "The dominant view — held by UBS, Standard Chartered, JPMorgan, BCA Research and Goldman Sachs's Ashok Varadhan — is that the Fed holds its 3.50-3.75% target through year-end 2026 under new Chair Kevin Warsh. September hike odds (the debate this cycle is about a hike, not a cut) fell from above 50-55% to roughly 35-40% after July payrolls contracted -23k and CPI cooled to 3.4% headline / 2.5% core, the lowest core print since 2021.", "divergence": "Franklin Templeton's Western Asset argues the market is still overpricing hike risk — it counts more than two hikes priced over 12 months and a term premium near 70bp — and is extending duration toward the 10-year approaching 4.75%, judging a move above 5% unlikely without a major repricing. WisdomTree takes the opposite side of that same trade: attributing the rise in long yields (30-year above 5%, highest since June 2007) to a 'Warsh effect' of no forward guidance plus AI-debt crowding out, it recommends its Zero Duration ETF suite (USFR, AGZD, HYZD) to limit duration risk rather than extend it. KKR's base case is an extended hold but flags a real tail risk of two to four hikes if data reaccelerates, while Goldman's Mike Mitchell prefers a curve-steepener — long the front end (which he says fully prices Fed action) against continued long-end term-premium widening.", "items": [{"source": "franklin_templeton", "name": "Franklin Templeton (Western Asset)", "thesis": "Recommends extending duration as 10yr yields approach ~4.75%, arguing markets overprice hike risk and a term premium near 70bp caps yields below 5% absent a major repricing.", "url": "https://www.franklintempleton.com/articles/2026/institute/time-for-core-plus-bond-portfolios-again", "images": []}, {"source": "wisdomtree", "name": "WisdomTree", "thesis": "Attributes rising long yields to a 'Warsh effect' (no forward guidance) plus AI-debt crowding out (~$500bn 2026 issuance); recommends Zero Duration ETFs (USFR, AGZD, HYZD) rather than extending duration.", "url": "https://www.wisdomtree.com/us/insights/blog/what-s-driving-treasury-yields-higher", "images": []}, {"source": "kkr", "name": "KKR", "thesis": "Base case is an extended Fed hold, but flags tail risk of 2-4 hikes if data reaccelerates; forecasts 10yr yield 4.75% (2026)/4.25% (2027) and 17% S&P 500 EPS growth.", "url": "https://www.kkr.com/insights/flash-macro-jobs-update-july-2026", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Mike Mitchell (Head of US Treasury and Inflation Trading) prefers a curve steepener — long the front end/belly against continued long-end term-premium widening — citing $250bn of 2026 AI-infrastructure bond issuance (potentially $400bn in 2027).", "url": "https://www.goldmansachs.com/insights/the-markets/how-inflation-and-fiscal-policy-are-driving-us-treasury-markets", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "Weekly digest tracks CPI/PPI/retail-sales prints all building the case for a Fed hold in September; house view stays tactically overweight equities vs bonds on US economic resilience.", "url": "https://www.bcaresearch.com/marketing/felix-antoine-vezina-poirier", "images": []}]}, {"theme": "Growth, Labor & Recession Risk", "category": ["growth"], "consensus": "US labor data has clearly cooled — July payrolls contracted -23k against expectations of +80k (KKR, CoinShares), the 3-month rolling average sits near +20k, and participation has fallen to its lowest since 1976 outside COVID. Consumer spending is decelerating but not collapsing (BofA: card spending growth eased to 5.0% YoY from 6.3%), and the prior K-shaped divergence between income cohorts is converging.", "divergence": "PIMCO's Tiffany Wilding and Oxford Economics read the participation decline as a genuine supply-side weakening — Oxford models the 'breakeven' pace of job growth needed to hold unemployment steady falling to zero next year — and argue labor isn't a source of inflation pressure, meaning Taylor-rule frameworks using the unemployment rate may overstate how tight policy actually is. KKR and Franklin Templeton's ClearBridge (Jeff Schulze) take the opposite read: KKR argues the broader economy — strong ISM manufacturing, low jobless claims, a productivity/AI-capex-led cycle — is firmer than the payroll print suggests, and ClearBridge keeps its Recession Risk Dashboard at 11 of 12 green indicators, explicitly dismissing 'earnings bubble' concerns on falling corporate debt-to-GDP ratios.", "items": [{"source": "kkr", "name": "KKR", "thesis": "July payrolls -23k, prior two months revised down -103k combined; participation at a 5-year low. Reads this as market-friendly but maintains the economy is on firmer footing than the print implies given a productivity/AI-capex-led cycle.", "url": "https://www.kkr.com/insights/flash-macro-jobs-update-july-2026", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "Tiffany Wilding: participation fell a full point since Dec 2025 to the lowest since 1976 (ex-COVID); an unchanged-participation unemployment rate would be ~5.6%, highest since 2021. Concludes labor is not an inflation risk and current Fed policy looks appropriately calibrated.", "url": "https://www.pimco.com/us/en/insights/as-older-workers-retire-labor-costs-ease", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "Forecasts the breakeven pace of US employment growth falls to zero next year and turns negative by 2028 on immigration policy and demographics, meaning recent payroll gains may overstate labor-market strength.", "url": "https://www.oxfordeconomics.com/resource/what-low-breakeven-employment-growth-means-for-the-us-labour-market/", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton (ClearBridge)", "thesis": "Jeff Schulze keeps the Recession Risk Dashboard at 11/12 green, nudging 12-month recession odds to 20% from 15% on Middle East risk; dismisses 'earnings bubble' concerns citing falling corporate debt-to-GDP.", "url": "https://www.franklintempleton.com/articles/2026/franklin-templeton-solutions/aor-update-podcast-are-current-strong-earnings-a-bubble", "images": []}, {"source": "bofa", "name": "Bank of America", "thesis": "Card spending growth eased to 5.0% YoY in July from 6.3% in June, mostly reflecting fading temporary boosts rather than weaker underlying demand; the K-shaped consumer pattern is converging across income groups.", "url": "https://institute.bankofamerica.com/economic-insights/consumer-checkpoint-august-2026.html", "images": []}]}, {"theme": "USD & FX (incl. Yen/BoJ)", "category": ["fx"], "consensus": "The July 31 coordinated US-Japan FX intervention (estimated $52-87bn depending on the source) is broadly agreed to have bought time without solving the underlying yen weakness, and multiple houses (UBS, Goldman) see continued but modest broad-USD softness on fiscal concerns, favoring high-yielding carry currencies.", "divergence": "Capital Economics is the clearest bull on yen fundamentals: it puts fair value at ¥125-130 versus ¥158 spot, blames the gap on eroding confidence in PM Takaichi's fiscal stance rather than fundamentals, and forecasts the BoJ hikes again in September toward a ~2% policy rate next year, implying material appreciation once fiscal fears fade. Barclays' Yoichi Takemura sees the opposite dynamic — durable yen weakness from Japanese households (50% in cash) structurally reallocating into equities and foreign assets — and explicitly recommends fading aggressive bear-flattening JGB positions given Japan's own long-run fiscal risk (interest payments/GDP rising from 1.8% to 5.5-6% by 2040). On the dollar itself, BCA Research goes furthest, arguing a coming regime shift makes the dollar pro-cyclical (driven by the balance of payments rather than rate differentials) — meaning a weaker dollar would be deflationary for the rest of the world and EM equities would not rally in absolute terms despite it, contradicting the conventional wisdom UBS and others lean on.", "items": [{"source": "capital_economics", "name": "Capital Economics", "thesis": "Yen weakness (¥158) isn't justified by fundamentals — fair value ¥125-130 — and reflects eroding fiscal confidence under PM Takaichi. Forecasts BoJ hikes again in September, taking the rate to ~2% next year, implying material yen appreciation once fears fade.", "url": "https://www.capitaleconomics.com/blog/weak-yens-lesson-policymakers-far-beyond-japan", "images": []}, {"source": "barclays", "name": "Barclays", "thesis": "Yoichi Takemura attributes yen weakness to structural Japanese household capital flight into equities/foreign assets; recommends fading bear-flattening JGB positions given underpriced long-run fiscal risk (interest payments/GDP to 5.5-6% by 2040).", "url": "https://www.ib.barclays/content/barclaysmicrosites/ibpublic/en/our-insights/barclays-brief/japan-why-the-world-is-watching.html", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Estimates Japan's intervention at up to $85bn, the largest two-day intervention outside Oct 2011. Markets price 65% odds of a September BoJ hike; base case is modest further USD strength vs low-yielders (EUR, JPY) but continued USD weakness vs higher-yielding EM currencies.", "url": "https://www.goldmansachs.com/insights/goldman-sachs-exchanges/what-the-us-japan-currency-intervention-means-for-the-yen-rates-and-the-dollar", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "Arthur Budaghyan's thesis: the dollar's primary driver is shifting from rate differentials to the balance of payments, turning the dollar pro-cyclical and the euro counter-cyclical. A weaker dollar would be deflationary (not reflationary) globally, and EM equities would not rally despite it.", "url": "https://www.bcaresearch.com/marketing/webcasts/get-out-of-the-dollar-g-o-d/222826", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "Structurally bearish USD on fiscal concerns despite near-term stability; favors high-yielding carry currencies (GBP, NOK, AUD, NZD) and expects CNY to appreciate toward 6.50 by June 2027.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-14082026.html", "images": []}]}, {"theme": "US Equities & AI Concentration", "category": ["equities", "ai_tech"], "consensus": "Q2 earnings have broadly beaten (77-87% beat rates across desks; Amundi's blended S&P 500 growth ~52% YoY) and the rally is widely described as broadening beyond the Magnificent Seven — BNY notes 72% of S&P 500 constituents trade above their 200-day average, the highest since December 2024, and the equal-weighted index is modestly outperforming the cap-weighted one.", "divergence": "BNP Paribas' Daniel Morris argues 2026 has actually reprised US exceptionalism, not broadening — the AI capex gap between the US (~$755bn) and China (~$100bn) is the dominant driver, and he sees more relative opportunity in the Korean tech-hardware correction (P/Es below long-run averages) than in a genuine US-to-world rotation. UBS, Citi and Standard Chartered take the opposite tactical stance, actively pushing clients to diversify away from concentrated US mega-cap exposure into Europe, Asia ex-Japan, China internet/semicap and small caps — UBS's Sean O'Hara flags that the Mag-7 still represents 35-40% of index weight and recommends rotating into small caps and global equities as a hedge against overconcentration. WisdomTree makes the same case through product design, noting its zero-Mag-7 High Dividend Fund (DHS) has outperformed the S&P 500 YTD at meaningfully lower multiples.", "items": [{"source": "bnp_paribas", "name": "BNP Paribas AM", "thesis": "Argues US exceptionalism, not broadening, drove 2026: AI capex gap of ~$755bn (US) vs ~$100bn (China). Korean/EM tech-hardware correction viewed as technical (P/Es below long-run averages), not fundamental.", "url": "https://viewpoint.bnpparibas-am.com/global-equity-outlook-a-tale-of-two-markets/", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "Sean O'Hara (UBS Trending): Mag-7 still 35-40% of index weight; recommends rotating into small caps and international/global equities as diversifiers against overconcentration risk.", "url": "https://www.ubs.com/us/en/wealth-management/insights/ubs-studios/2026/the-rally-broadens.html", "images": []}, {"source": "citi_gps", "name": "Citi", "thesis": "Recommends an equal-weight (vs cap-weight) S&P 500 position on a dovish Fed and rising earnings revisions, plus positioning for US yield-curve steepening.", "url": "https://www.citigroup.com/global/insights/markets-edition-macro-tapas-fed-japan-equities-carry", "images": []}, {"source": "wisdomtree", "name": "WisdomTree", "thesis": "US High Dividend Fund (DHS), with zero Mag-7 exposure, outperformed the S&P 500 YTD through July 10 at meaningfully lower valuation multiples — positioned as a way to reduce AI concentration risk without sacrificing performance.", "url": "https://www.wisdomtree.com/us/insights/blog/looking-to-avoid-the-mag-7-in-the-second-half-of-2026", "images": []}, {"source": "bny", "name": "BNY", "thesis": "The rally looks broader than headlines suggest: ex-tech/AI the S&P is still up 8% YTD, equal-weighted S&P (+14%) is modestly ahead of cap-weighted (+13.2%), and 72% of constituents trade above their 200-day moving average.", "url": "https://www.bny.com/wealth/global/en/insights/chart-of-the-week/is-the-market-rally-broadening.html", "images": []}]}, {"theme": "AI Capex Sustainability", "category": ["ai_tech", "growth"], "consensus": "The scale of the buildout is not in dispute: Goldman Sachs puts 2026 global AI-related investment near $1 trillion (up from a commonly cited $794bn hyperscaler-only figure), forecasting capex rising from 1.8% of US GDP this year to 2.8% by 2028 — within the historical peak range for prior general-purpose-technology cycles. An HSBC survey of 200+ global investors ($2.32tr AUM) finds 90% call current AI capex appropriate or under-utilized, with only 10% calling it overdone, and UBS forecasts hyperscaler cloud revenue growth accelerating to 58% next quarter.", "divergence": "Gavekal's Will Denyer is the clearest bear, framing the AI capex boom as the single biggest swing factor for global growth, equities and bond yields — a rollover would hit corporate profits broadly (not just AI-exposed names), unwind the equity wealth effect propping up consumption, and remove a key technical support for bond yields. Bridgewater's Karen Karniol-Tambour offers a more structural caution: markets are still pricing the AI buildout phase, not the harder adoption phase, leaving portfolios overweight US equities and underweight real assets. Oxford Economics adds a competitive dimension, arguing China's lower-cost 'WAICO' model ecosystem is compressing the US model-layer moat quickly even as the US holds up better at the compute layer — a risk to hyperscaler valuations that UBS's own note (flagging Nvidia's >$500bn circular financing package as a 'concentration risk to monitor') implicitly echoes without changing its constructive stance.", "items": [{"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Raises 2026 global AI investment estimate to ~$1 trillion (incl. $581bn in the US); forecasts AI capex rising from 1.8% of US GDP in 2026 to 2.8% by 2028, within the 2-5% peak range of prior GPT buildouts, with leading indicators near the top of their range since 2022.", "url": "https://www.goldmansachs.com/insights/articles/global-investment-is-forecast-to-exceed-1-trillion-in-2026", "images": []}, {"source": "hsbc", "name": "HSBC", "thesis": "9th Funding the Future Survey: 60% of 200+ global investors expect AI capex to keep rising over six months and 90% call it under-utilized or about right; only 10% call it overdone. Investment activity is increasingly concentrated in a handful of AI/software megadeals.", "url": "https://www.business.hsbc.com/en-gb/insights/ai-megadeals-and-the-rest", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Will Denyer: the AI capex boom is the single biggest swing factor for global growth, equities and bond yields; a rollover would hit profits broadly, unwind the equity wealth effect, and remove technical support for yields.", "url": "https://research.gavekal.com/teaser/how-sustainable-is-the-ai-capex-boom/", "images": []}, {"source": "bridgewater", "name": "Bridgewater Associates", "thesis": "Karen Karniol-Tambour: markets are still pricing the AI buildout phase rather than the later adoption phase, leaving most investors overweight US equities and underweight real assets.", "url": "https://www.bridgewater.com/research-and-insights/karen-karniol-tambour-on-investing-in-a-more-fragmented-world", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "Frames AI competition as splitting into a US-led 'Pax Silica' and China-led 'WAICO'; argues the US model-layer moat is compressing quickly even as compute holds up better, flagging hyperscaler valuation risk.", "url": "https://www.oxfordeconomics.com/resource/the-moat-illusion-chinas-bid-to-deflate-us-ai-valuations/", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "Flags Nvidia's >$500bn financing package across six institutions as a circular-financing/concentration risk to monitor, while staying constructive given 48% y/y hyperscaler cloud revenue growth and $2.3tr of unbooked advance orders.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-11082026.html", "images": []}]}, {"theme": "Credit & AI-Driven Issuance", "category": ["credit", "ai_tech"], "consensus": "AI-linked borrowing is reshaping credit markets: Franklin Templeton counts $1.2tn of IG issuance in H1 2026 (versus a 2015-2025 norm of $134bn/month), and PIMCO's Lotfi Karoui finds hyperscalers now make up ~5% of the USD IG index versus 1.2% of EUR IG. Spreads are broadly described as 'fair, not cheap' with contained default rates (StanChart: ~2% vs 3-3.5% long-run average).", "divergence": "Apollo's Torsten Slok and RBC's Raja Khanna frame private credit as the solution to a public-market 'capacity problem' — private IG credit is essential to closing the AI funding gap, RBC says, with private credit increasingly moving into larger deals, JVs and data centers. The Federal Reserve's own research pushes back on how insulated that solution really is: one FEDS note finds banks remain deeply embedded behind BDCs (loan commitments >$60bn, ~40% of BDC debt, charging a premium of ~1.1pp during tightening cycles), and a companion note finds smaller private-credit borrowers are far less able to substitute into leveraged loans than larger firms if private credit pulls back — meaning monetary policy still transmits through the 'shadow' system, and the borrowers most exposed to a PC-specific shock are the smallest, least-covered ones. PIMCO's Karoui separately flags that USD IG dispersion tied to AI issuers has climbed back to April-2025 'Liberation Day' tariff-aftermath levels, a stress signal not visible in headline spreads.", "items": [{"source": "franklin_templeton", "name": "Franklin Templeton (Western Asset)", "thesis": "IG issuance topped $1.2tn in H1 2026, well above the historical $134bn/month norm, driven by hyperscaler borrowing; remains biased toward higher-rated high-yield issuers, viewing all-in yield above 7% as attractive.", "url": "https://www.franklintempleton.com/articles/2026/institute/time-for-core-plus-bond-portfolios-again", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "Lotfi Karoui: hyperscaler USD IG spreads have underperformed euro-denominated bonds from the same issuers; USD IG dispersion tied to AI issuers has climbed back to April-2025 tariff-aftermath levels, a stress signal not visible in EUR IG.", "url": "https://www.pimco.com/us/en/insights/the-credit-market-lens-the-ai-split-between-us-dollar-and-euro-investment-grade", "images": []}, {"source": "apollo_slok", "name": "Apollo (Torsten Slok)", "category_note": "asset_manager", "thesis": "2026 Midyear Credit Outlook: financing the AI buildout has become a market-capacity problem for public markets; private investment-grade credit is framed as essential to closing the funding gap.", "url": "https://www.apolloacademy.com/2026-midyear-credit-outlook-adoption-financing-and-investing-in-the-age-of-ai/", "images": []}, {"source": "federal_reserve", "name": "Federal Reserve", "thesis": "FEDS Notes: bank loan commitments to BDCs exceed $60bn (~40% of BDC debt), with banks charging an extra ~1.1pp premium during tightening; smaller private-credit borrowers are far less able to substitute into leveraged loans than larger firms, leaving them most exposed to a PC-specific pullback.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/private-credit-and-leveraged-loan-markets-similarities-differences-and-substitution-20260811.html", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "GoldenTree's Steven Tananbaum: AI financing is ~2% of below-IG indices but already pressuring IG spreads (out 8-10bps); sees IG as the better risk-adjusted way to play AI credit risk given rising dispersion ahead.", "url": "https://www.goldmansachs.com/insights/goldman-sachs-exchanges/goldentrees-steven-tananbaum-the-evolution-of-credit-investing", "images": []}]}, {"theme": "Crypto", "category": ["crypto"], "consensus": "Bitcoin remains well off its October 2025 high (~$126k), with onchain leverage and lending contracting for a second straight quarter as CeFi shows resilience while DeFi borrows have fallen over 50% from their September 2025 peak (Galaxy). The CLARITY Act's odds of passing in 2026 have collapsed to roughly 10-14% across trackers (Galaxy, CoinShares/Polymarket), a regulatory overhang most agree weighs more on Ethereum/altcoins than Bitcoin.", "divergence": "On timing, CoinShares' James Butterfill sees range-bound trading toward $80,000 over the next 2-3 months, arguing a durable move to $100k needs clearer labor-market deterioration and a bigger dovish Fed shift — a near-term, macro-gated view. Galaxy Research's house call is far more aggressive on a longer horizon: BTC at $250,000 by year-end 2027, alongside a raft of adoption calls (US spot ETF inflows >$50bn, crypto-backed loans >$90bn). The two aren't strictly contradictory (different time horizons) but reflect very different confidence levels about the pace of the next leg up. On the yield-crypto relationship, CoinShares offers a genuinely contrarian read: it argues rising JGB/UST yields — normally a risk-asset headwind — could paradoxically turn bullish for Bitcoin as a non-sovereign store of value if Japanese capital rotation pressures Treasury yields higher.", "items": [{"source": "coinshares", "name": "CoinShares", "thesis": "James Butterfill: Bitcoin's cycle lows are probably in but highs are not; expects range-bound trading toward ~$80,000 over 2-3 months, with a durable move to $100k requiring clearer labor-market deterioration and a bigger dovish Fed shift.", "url": "https://coinshares.com/insights/research-data/market-update-07-08-2026/", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "2026 outlook calls for BTC to reach $250k by year-end 2027 despite 2025 closing roughly flat; also calls for US spot ETF inflows >$50bn, crypto-backed loans >$90bn, and 5+ digital asset treasury companies forced to sell or shut down.", "url": "https://www.galaxy.com/insights/research/predictions-2026-crypto-bitcoin-defi", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "Q4 2025 leverage report: crypto-collateralized lending fell 9.81% q/q; CeFi lenders (Tether, Maple, Galaxy dominant) showed zero visible stress despite the largest-ever onchain liquidation event, in contrast to 2022's Celsius/BlockFi-style insolvencies.", "url": "https://www.galaxy.com/insights/research/state-of-crypto-leverage-q4-2025", "images": []}]}, {"theme": "Energy & Commodities", "category": ["energy", "commodities"], "consensus": "Standard Chartered's framing of a 'prolonged stalemate' around the Strait of Hormuz — an elevated but not escalating risk premium amid 'warfare fatigue' on both sides — is echoed widely. Oxford Economics raised its 2026 oil forecast to average $85/bbl, falling toward $65 by end-2027, now treating sustained Hormuz disruption as its base case rather than a tail risk. Gold is close to universally bullish: UBS, among others, sees it rising toward $5,000/oz in H1 2027 on central-bank buying (750-1,000 tons forecast for 2026) and eventual Fed easing.", "divergence": "Goldman's Ashok Varadhan breaks sharply from the stalemate-premium consensus, naming oil settling below $70/bbl by year-end as his single best trade for 2026 — well under both Oxford Economics' $85 average and Standard Chartered's $70-90 range built around continued disruption. He uses that view to argue for being long US front-end yields.", "items": [{"source": "oxford_economics", "name": "Oxford Economics", "thesis": "Raised 2026 oil forecast to average $85/bbl, falling to ~$65 by end-2027; treats a long-term reduction in Strait of Hormuz shipping as the base case rather than tail risk. World GDP growth still seen at 2.5% (2026)/3.1% (2027).", "url": "https://www.oxfordeconomics.com/resource/world-economic-prospects-preview/", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Ashok Varadhan's single best trade for 2026: oil settles below $70/bbl by year-end, which argues for being long/constructive on US front-end yields. Overall call is 'stay invested' into year-end.", "url": "https://www.goldmansachs.com/insights/the-markets/why-us-stocks-may-grind-higher", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "Gold broke above $4,250/oz; expects a rise toward $5,000/oz in H1 2027 on Fed easing resumption, structural dollar weakness and continued central-bank buying (750-1,000 tons forecast for 2026). Recommends a mid-single-digit portfolio allocation.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-06082026.html", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Middle East conflict framed as a 'prolonged stalemate' with warfare fatigue reducing odds of oil returning to March/April highs; oil rangebound $70-90/bbl base case.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-14-8-2026/?mvog=1", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "thesis": "Gulf of America 'BBG3' lease sale drew 16 companies and $99.5m of bids, average $300/acre high bid (down 10% from the prior sale); deepwater accounted for 98% of total value. Key open question: when lease inventory converts into drilling.", "url": "https://www.woodmac.com/press-releases/goa-bbg3-lease-sale-confirms-stable-leasing-cadence/", "images": []}]}, {"theme": "Geopolitics", "category": ["geopolitics"], "consensus": "The Middle East conflict and the Strait of Hormuz are the dominant geopolitical risk driver across nearly every house this cycle; the US-China relationship is broadly described as an 'uneasy stalemate' (Gavekal) in which the May Trump-Xi truce keeps fraying via tit-for-tat tech restrictions, but full decoupling remains impractical to execute and the September Xi-Trump summit is expected to proceed.", "divergence": "Brookings' 'electrostates vs petrostates' analysis argues China is the structural winner of the Hormuz shock on both fronts at once — its strategic reserves and coal fleet buffered the import shock, while its clean-tech exports (record EV and solar exports) surged — whereas the US captures only the fossil-fuel windfall (record crude exports) and gains nothing on the clean-energy side. Separately, the Peterson Institute argues the Trump administration's newest Section 301 tariffs (10-12.5% on 60 countries, ~$4.36tn of imports) are legally vulnerable and likely to be struck down under Loper Bright and the major-questions doctrine — a trade-policy risk scenario not yet reflected in most banks' base cases, which generally treat the tariff regime as a settled input.", "items": [{"source": "brookings", "name": "Brookings Institution", "thesis": "China positioned to benefit from both the fossil-fuel scramble (record Russian oil imports, strategic reserves) and the clean-energy transition (record EV/solar exports) post-Hormuz shock, while the US captures only the fossil-fuel windfall. Recommends the US negotiate cleantech tech-transfer terms and build a 'Cleantech Strategic Reserve.'", "url": "https://www.brookings.edu/articles/electrostates-vs-petrostates-the-us-china-and-the-hormuz-energy-shock/", "images": []}, {"source": "peterson_institute", "name": "Peterson Institute for International Economics", "thesis": "25-state lawsuit against Trump's newest Section 301 tariffs (10-12.5% on 60 countries, ~$4.36tn of imports) likely to succeed — argued to be an unconstitutional delegation of Congress's tariff power under Loper Bright and the major-questions doctrine.", "url": "https://www.piie.com/blogs/realtime-economics/2026/why-trump-will-lose-again-new-challenge-his-tariffs", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "US-China relationship characterized as an uneasy stalemate: the May 'constructive strategic stability' truce is fraying via new FCC tech-import restrictions and calibrated Chinese countermeasures, but full decoupling remains impractical; September Xi-Trump summit still expected.", "url": "https://research.gavekal.com/teaser/the-tech-truce-starts-to-fray/", "images": []}, {"source": "peterson_institute", "name": "Peterson Institute for International Economics", "thesis": "Mercosur is at risk from asymmetric US tariff treatment of Argentina vs Brazil plus deteriorating Milei-Lula relations; Argentina's unilateral US tariff deal breaches the bloc's common external tariff, threatening EU/EFTA/Canada/Japan trade-deal ratification.", "url": "https://www.piie.com/blogs/realtime-economics/2026/mercosur-risk-us-tariffs-and-politics", "images": []}]}, {"theme": "Emerging Markets", "category": ["em"], "consensus": "BNP Paribas repeats a valuation-driven case for EM equities across multiple pieces this window: MSCI EM trades at 10x forward earnings versus 20x for the S&P 500 and 15x for MSCI EAFE, with the investable universe roughly 3x larger than the concentrated index, offering an under-covered 'long tail' opportunity, especially in clean-energy/environmental-solutions supply chains.", "divergence": "BCA Research's coming dollar-regime-shift call directly undercuts the standard EM playbook most other houses implicitly lean on: if the dollar turns pro-cyclical, a weaker dollar becomes deflationary for the rest of the world rather than a tailwind, meaning EM equities would not rally in absolute terms even as the dollar weakens — the opposite of the valuation-plus-weak-dollar case BNP Paribas and UBS effectively make. WisdomTree's EM local-debt positioning shows the market itself fragmenting along oil-importer/exporter lines rather than moving as a bloc: it stays overweight higher-yielding Latin American issuers (resilient to oil-import dependence) against underweights in Asia and CEEMEA, constructive on EM currencies but more cautious on EM rates given two-sided inflation risk from the Gulf conflict.", "items": [{"source": "bnp_paribas", "name": "BNP Paribas AM", "thesis": "MSCI EM trades at 10x forward earnings vs 20x S&P 500 and 15x MSCI EAFE; investable EM universe ~3x the concentrated index. Cites India's $100bn 2025 clean-energy spend and China's ~1,390GW of planned 2025-2030 renewable additions (30% of global total).", "url": "https://www.bnpparibas-am.com/en/portfolio-perspectives/emerging-market-equities-offer-a-deepvalue-play-as-the-global-growth-engine-turns-green/", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "If the dollar's driver shifts from rate differentials to the balance of payments (turning pro-cyclical), a weaker dollar would be deflationary globally and EM equities would not rally in absolute terms despite it — contradicting the standard weak-dollar-helps-EM assumption.", "url": "https://www.bcaresearch.com/marketing/webcasts/get-out-of-the-dollar-g-o-d/222826", "images": []}, {"source": "wisdomtree", "name": "WisdomTree", "thesis": "EM local-debt fund (ELD) up 2.16% YTD, +43bps vs benchmark; stays overweight higher-yielding Latin American issuers vs underweight Asia/CEEMEA. Constructive on EM currencies, more cautious on EM rates on two-sided Gulf-conflict inflation risk.", "url": "https://www.wisdomtree.com/us/insights/blog/em-local-debt-staying-selective-through-the-persian-gulf-conflict", "images": []}, {"source": "blackrock_investment_institute", "name": "BlackRock Investment Institute", "thesis": "Gulf economies diversifying funding away from oil as Brent sits ~50% below its 2022 peak; flags potential ~$10bn of passive inflows from raising Saudi foreign-ownership limits and ~$5bn from likely 2026 JPMorgan EMBI inclusion. Stays constructive on GCC hard-currency credit for carry.", "url": "https://www.blackrock.com/corporate/insights/blackrock-investment-institute/publications/global-insights/middle-east-nov-2025", "images": []}]}], "B_calls": [{"source": "goldman_sachs", "name": "Goldman Sachs", "call": "Ashok Varadhan's single best trade for 2026: oil settles below $70/bbl by year-end; argues for being long/constructive on US front-end yields. Overall 'stay invested' call into year-end.", "category": ["energy", "rates"], "url": "https://www.goldmansachs.com/insights/the-markets/why-us-stocks-may-grind-higher", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "call": "Mike Mitchell's preferred trade is a curve steepener: long the front end/belly (fully pricing Fed action) against continued long-end term-premium widening, given $250bn of 2026 AI-infrastructure bond issuance.", "category": ["rates"], "url": "https://www.goldmansachs.com/insights/the-markets/how-inflation-and-fiscal-policy-are-driving-us-treasury-markets", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton (Western Asset)", "call": "Extend bond duration as 10yr Treasury yields approach ~4.75%; top EM pick is Latin America local-currency debt; finds Bund yields attractive above 3.1%.", "category": ["rates", "em"], "url": "https://www.franklintempleton.com/articles/2026/institute/time-for-core-plus-bond-portfolios-again", "images": []}, {"source": "wisdomtree", "name": "WisdomTree", "call": "Recommends its Zero Duration ETF suite (USFR, AGZD, HYZD) to limit duration risk amid rising long-end yields driven by AI-debt issuance and Fed Chair Warsh's lack of forward guidance.", "category": ["rates"], "url": "https://www.wisdomtree.com/us/insights/blog/what-s-driving-treasury-yields-higher", "images": []}, {"source": "ubs", "name": "UBS", "call": "Gold price target: rise toward $5,000/oz in H1 2027; recommends a mid-single-digit portfolio allocation and views dips toward $4,000/oz as buying opportunities.", "category": ["commodities"], "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-06082026.html", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "call": "AUD/USD forecast 0.74 (3-month)/0.75 (12-month); Overweight China tech equities via HSTECH despite a 13% YTD decline; opportunistically bullish US high yield (spreads 4th percentile tight but yield 69th percentile).", "category": ["fx", "equities", "credit"], "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-14-8-2026/?mvog=1", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "call": "Initiated a bullish AUD/NZD position after NZ two-year inflation expectations fell, on a widening Australia-NZ policy-rate differential and expected further RBA hike.", "category": ["fx"], "url": "https://www.sc.com/sg/market-outlook/daily-navigator-14-8-2026/?mvog=1", "images": []}, {"source": "blackrock_investment_institute", "name": "BlackRock Investment Institute", "call": "Flags ~$10bn of potential passive inflows if Saudi Arabia raises its foreign equity-ownership limit to 100%, and ~$5bn from likely 2026 JPMorgan EMBI index inclusion. Stays constructive on GCC hard-currency sovereign/quasi-sovereign credit for carry.", "category": ["em", "credit"], "url": "https://www.blackrock.com/corporate/insights/blackrock-investment-institute/publications/global-insights/middle-east-nov-2025", "images": []}, {"source": "lazard", "name": "Lazard", "call": "Maintains its full-year 2026 secondaries market volume forecast of $275bn after a record ~$124bn H1 (up ~28% YoY); $77bn of dry powder earmarked for 2H GP-led deployment alone.", "category": ["credit"], "url": "https://www.lazard.com/research-insights/lazard-interim-2026-secondary-market-report/", "images": []}, {"source": "kkr", "name": "KKR", "call": "House forecasts: 17% S&P 500 EPS growth pital_economics", "name": "Capital Economics", "call": "Forecasts the BoJ hikes again in September, taking the policy rate to ~2% next year; implies the undervalued yen (fair value ¥125-130 vs ¥158 spot) could appreciate materially once fiscal/monetary fears fade.", "category": ["fx", "rates"], "url": "https://www.capitaleconomics.com/blog/weak-yens-lesson-policymakers-far-beyond-japan", "images": []}, {"source": "barclays", "name": "Barclays", "call": "Recommends fading aggressive bear-flattening positions in JGBs, judging the BoJ unlikely to hike materially above neutral given Japan's long-run debt-divergence risk (interest payments/GDP rising to 5.5-6% by 2040).", "category": ["rates", "fx"], "url": "https://www.ib.barclays/content/barclaysmicrosites/ibpublic/en/our-insights/barclays-brief/japan-why-the-world-is-watching.html", "images": []}, {"source": "citi_gps", "name": "Citi", "call": "Favor equal-weight (vs cap-weight) S&P 500; position for US yield-curve steepening; fund FX carry trades with the Swiss Franc and Canadian Dollar rather than traditional Asian funding currencies.", "category": ["equities", "rates", "fx"], "url": "https://www.citigroup.com/global/insights/markets-edition-macro-tapas-fed-japan-equities-carry", "images": []}], "C_deep_reads": [{"source": "deutsche_bank", "name": "Deutsche Bank", "title": "Annual Outlook 2026: Investing in Tomorrow", "summary": "CIO Christian Nolting's flagship annual outlook is broadly constructive: robust global growth with the US ahead of Europe and China subdued, supported by three expected Fed cuts by end-2026, US tax relief/spending, banking deregulation and Germany's EUR500bn special fund. Equities are favored on double-digit earnings growth forecasts driven by AI capex spillovers into construction, utilities, industrials and materials, though a global power shortage for AI and tariff escalation are flagged as key risks. Fixed income: a normalising US yield curve with 10-year Bunds and Treasuries offering positive real returns and a preference for quality/size in corporate issuers. Commodities: oil stabilising at low levels, gold with further upside, and China's rare-earths quasi-monopoly flagged as a structural risk. USD stability is expected with slight JPY appreciation.", "url": "https://wealth.db.com/en/insights/investing-insights/economic-and-market-outlook/cio-annual-outlook-2026-investing-in-tomorrow.html", "images": []}, {"source": "chainalysis", "name": "Chainalysis", "title": "Violent Wrench Attacks Targeting Crypto Holders", "summary": "Chainalysis's mid-year crime update finds violent 'wrench attacks' against crypto holders on pace for a record 2026: over $30M stolen through mid-year versus a record $58M in all of 2025, even as success rates have fallen to 26% of attempts (from 49% in 2025 and 67% in 2024) as targets harden. Home invasions rose to 37% of incidents from 26% in 2023. France has become the epicenter — 30 documented incidents through mid-2026 versus 19 in all of 2025 — traced to a 2024 tax-agency data breach and a separate Waltio breach exposing ~50,000 high-net-worth holders' data; French prosecutors have made ~200 arrests and 88 indictments. A companion CoinShares feature adds texture: Paris's only dedicated bitcoin shop has closed, and the French government's proposed mandatory annual self-custody wallet declarations are seen by the industry as both inadequate and themselves a driver of exposure risk, after a French tax official was found under investigation for leaking taxpayer crypto-holding data to a criminal network.", "url": "https://www.chainalysis.com/blog/violent-crypto-wrench-attacks-2026/", "images": []}, {"source": "brookings", "name": "Brookings Institution", "title": "Electrostates vs. Petrostates: The US, China, and the Hormuz Energy Shock", "summary": "Following the February 2026 US-Israel strikes on Iran and Iran's closure of the Strait of Hormuz (20% of global oil and LNG flows), Brent rose from ~$70 to $100/bbl and Asian LNG spot from ~$13 to $21/mmBtu, prompting the IMF to cut its 2026 global growth forecast to 3.1% from 3.3%. The US drew down stockpiles to export a record 5.6mb/d of crude in May 2026, while China cut oil imports by 3.6mb/d after aggressive pre-conflict stockpiling, leaning on ~1.4bn barrels of strategic reserves (~7 months of imports), a coal fleet supplying ~50% of power generation, and rising Russian oil imports (17.4% of China's total). China's EV fleet displaced an estimated 1mb/d of oil demand in 2025 per the IEA, and its clean-tech exports surged post-shock — EV exports hit a record $9.2bn in May 2026 (+49% y/y) and solar exports hit a record 68GW in March 2026. Brookings concludes China is positioned to benefit from both the fossil-fuel scramble and the clean-energy transition while the US captures only the former, and recommends the US negotiate tech-transfer terms with Chinese cleantech firms and build a domestic 'Cleantech Strategic Reserve.'", "url": "https://www.brookings.edu/articles/electrostates-vs-petrostates-the-us-china-and-the-hormuz-energy-shock/", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "title": "Global Equity Outlook: A Tale of Two Markets", "summary": "Daniel Morris argues 2026 has reprised US exceptionalism rather than the broadening many expected, driven by an AI capex gap: ~$755bn of US AI spend this year (Goldman Sachs estimate) versus ~$100bn in China and only ~5% of the US level in Europe (Morgan Stanley). EM tech/semiconductor stocks, especially Korea, were the prime beneficiaries — up as much as 120% YTD (Korea +250%) at the late-June peak and still up ~80% aggregate after a correction that Morris views as technical (leveraged-ETF AUM peaked at $33bn) rather than fundamental, noting Korean tech-hardware and semiconductor forward P/Es (7.2x/6.8x) sit below their long-run averages (12.5x/8.9x). US small caps are expected to perform roughly in line with non-tech large caps. European 2027 earnings growth is estimated at about half the US rate despite a strong +23% Q2 season, so BNP sees more opportunity in European tech (9% of the MSCI Europe index) than the broad market. Markets price an 86% probability of a further 25bp ECB hike in September versus 60% odds of one more Fed hike; Brent's 26% fall since mid-May is supporting European relative performance, while yen strengthening is flagged as the top risk to Japanese equities given ~60% of MSCI Japan revenue comes from abroad.", "url": "https://viewpoint.bnpparibas-am.com/global-equity-outlook-a-tale-of-two-markets/", "images": []}, {"source": "deloitte", "name": "Deloitte", "title": "European CFO Survey — Spring 2026", "summary": "Deloitte's Spring 2026 European CFO Survey of 1,136 CFOs across 12 countries finds pessimism has nearly doubled since autumn 2025: the share of CFOs less optimistic than three months prior jumped from 25% to 48%, the highest since the 2022 energy crisis, with 76% rating external uncertainty high or very high (+15pp). Life sciences/healthcare is the most resilient sector (25% optimistic vs 35% pessimistic) versus consumer (20% optimistic, 48% pessimistic). Top risks cited are energy shocks, Middle East escalation and critical-material disruption; 42% of firms say energy costs have already hurt profitability/investment over the prior two years, and 48% expect negative Middle East-conflict effects on margins with only 21% feeling adequately hedged. Just 26% plan to raise capex (45% no change) and 85% say now isn't the time for more balance-sheet risk; cost reduction ranks in the top three priorities survey-wide for the first time ever, and only 23% plan to add headcount (36% expect cuts, financial services most aggressive at 31%).", "url": "https://www.deloitte.com/us/en/insights/topics/business-strategy-growth/european-cfo-survey-spring-2026.html", "images": []}, {"source": "federal_reserve", "name": "Federal Reserve", "title": "Private Credit and Leveraged Loan Markets: Similarities, Differences, and Substitution", "summary": "Fed staff (Banegas, Castelo, Degerli, Dobridge, Kennedy) find private credit (PC) and leveraged loan (LL) markets are roughly equal in size (~$1.4tn each, end-2025) and together account for ~45% of lending to private nonfinancial corporations, but PC borrowers are smaller (median revenue $223M vs $902M) and more leveraged (5.0x debt/EBITDA vs 3.2x, interest coverage 2.2x vs 3.7x), with 85% rated single-B or below versus 63% for LL. Larger middle-market firms substitute freely between markets — the share of LL borrowers switching to PC hit ~50% of switchers (~25% of total PC issuance) at the 2023 tightening peak, and 41% of large firms have used both markets — while smaller firms are far less able to switch (only 25% access both, 57% are PC-only). Since large and small firms each account for roughly half of PC loan volume, the authors conclude substitution to LL can mitigate but not eliminate the fallout from a PC-specific credit pullback, with smaller, less-covered firms the most exposed.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/private-credit-and-leveraged-loan-markets-similarities-differences-and-substitution-20260811.html", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton (Western Asset)", "title": "Time for Core (Plus) Bond Portfolios Again?", "summary": "Franklin Templeton Institute recommends shifting from a short-duration bias toward core(-plus) bond portfolios as fixed income valuations become more attractive, using 10-year US Treasury yields as the key guidepost: they favor extending duration as yields approach ~4.75% (upper end of their expected range), noting the market prices in more than two Fed hikes over 12 months and a term premium near 70bp (versus a recent high of ~90bp), making a move above 5% unlikely absent a major repricing. In credit, IG issuance topped $1.2tn in H1 2026 — well above the 2015-2025 historical norm of $134bn/month, driven by hyperscaler borrowing — widening spreads back to April-2026 levels, though issuance should slow seasonally in H2; they remain biased toward higher-rated high-yield issuers, viewing an all-in yield above 7% as attractive. In EM debt, Latin America local-currency debt is their top pick given high carry and resilience to oil-import dependence, balanced with USD-denominated EM debt as a dollar-strength hedge; in Europe they find Bund yields attractive above 3.1%.", "url": "https://www.franklintempleton.com/articles/2026/institute/time-for-core-plus-bond-portfolios-again", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "title": "Inference Market (and Micro) Structure", "summary": "A long-form Galaxy deep-dive argues AI inference is developing exchange-like market structure: token buyers, inference-provider 'market makers' (Fireworks, Baseten, Together AI) and marketplaces like OpenRouter (5.5% take rate on ~$1B GPV, ~$55M revenue). Open-source models are approaching parity with frontier labs, with new releases roughly every 41 days; OpenRouter volume is up 125x since January 2025 and 75% of it now runs on open-source models. Providers earn a 'crack spread' on GPU-hours — e.g. $2.74/hr H100 cost versus $3.24/hr revenue at full utilization, with a breakeven utilization around 85% — and DeepSeek's flagship output price has fallen roughly 8x since January 2025 even as H100 rental costs rose 17%. The piece proposes GPU-hour futures (via Galaxy Ventures portfolio companies Ornn and Architect) as a hedging mechanism against 130%+ annualized realized volatility in GPU rental rates, with worked contango/backwardation hedging examples for inference providers.", "url": "https://www.galaxy.com/insights/perspectives/inference-market-and-micro-structure", "images": []}], "D_charts": [{"source": "standard_chartered", "name": "Standard Chartered", "chart": "Weekly Market View chart pack showing S&P 500 beat rates (~85% vs 67% historical average), AI ROI estimates for hyperscalers (25-3 // ---------- helpers ----------
const CAT_VARS = {
  rates: 'var(--cat-rates)',
  growth: 'var(--cat-growth)',
  fx: 'var(--cat-fx)',
  equities: 'var(--cat-equities)',
  credit: 'var(--cat-credit)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  commodities: 'var(--cat-commodities)',
  geopolitics: 'var(--cat-geopolitics)',
  ai_tech: 'var(--cat-ai_tech)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }
function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}
function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}
function pills(cats) {
  if (!cats) return '';
  if (Array.isArray(cats)) return cats.map(pill).join(' ');
  return pill(cats);
}
function externalLink(url, label) {
  if (!url) return '';
  return `<a class="item-link" href="${escapeAttr(url)}" target="_blank" rel="noopener">${label || 'link →'}</a>`;
}
function nameLink(url, name) {
  if (!name) return '';
  if (!url) return `<span class="item-source">${escapeHtml(name)}</span>`;
  return `<a class="item-source" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderThemeItem(it) {
  return `
    <div class="theme-item">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.thesis || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderTheme(theme) {
  const items = (theme.items || []).map(renderThemeItem).join('');
  return `
    <div class="theme">
      <div class="theme-head">
        ${pills(theme.category)}
        <div class="theme-title">${escapeHtml(theme.theme || '')}</div>
      </div>
      <div class="theme-stance">
        ${theme.consensus ? `<div class="theme-line consensus"><span class="lbl">Consensus</span>${renderBold(theme.consensus)}</div>` : ''}
        ${theme.divergence ? `<div class="theme-line divergence"><span class="lbl">Divergence</span>${renderBold(theme.divergence)}</div>` : ''}
      </div>
      ${items ? `<div class="theme-items">${items}</div>` : ''}
    </div>`;
}

function renderCall(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${pills(it.category)}
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.call || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderDeepRead(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url, 'read →')}
      </div>
      ${it.title ? `<div class="item-title">${escapeHtml(it.title)}</div>` : ''}
      <div class="item-text">${renderBold(it.summary || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderChart(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.chart || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderHouseView(hv) {
  const name = hv.name || hv.source || '';
  const nameHtml = hv.url
    ? `<a class="hv-name" href="${escapeAttr(hv.url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`
    : `<span class="hv-name">${escapeHtml(name)}</span>`;
  return `
    <div class="hv-row">
      ${nameHtml}
      <span class="hv-stance">${renderBold(hv.stance || '')}</span>
    </div>`;
}

function renderSection(letter, name, items, render, extraClass) {
  if (!items || !items.length) return '';
  const body = items.map(render).join('');
  const cls = 'section' + (extraClass ? (' ' + extraClass) : '');
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderTopStats(d) {
  const parts = [];
  const p = d.period || {};
  const is = d.input_stats || {};
  const cv = d.coverage || {};
  if (p.from && p.to)
    parts.push(`period <strong>${escapeHtml(p.from)} → ${escapeHtml(p.to)}</strong>`);
  else if (p.lookback_days != null)
    parts.push(`lookback <strong>${p.lookback_days}d</strong>`);
  if (is.total_articles != null) parts.push(`articles <strong>${is.total_articles}</strong>`);
  if (is.sources_present != null) parts.push(`sources <strong>${is.sources_present}</strong>`);
  if (is.after_filter != null) parts.push(`after filter <strong>${is.after_filter}</strong>`);
  if (cv.coverage_pct != null) {
    const pct = (cv.coverage_pct <= 1 ? cv.coverage_pct * 100 : cv.coverage_pct);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  } else if (cv.sources_covered != null && cv.sources_total != null) {
    parts.push(`coverage <strong>${cv.sources_covered}/${cv.sources_total}</strong>`);
  }
  return parts.join(' | ');
}

function reportDate(d) {
  if (d.period && d.period.to) return d.period.to;
  if (d.collected_at) return String(d.collected_at).slice(0, 10);
  return '';
}

// ---------- interactions ----------
function toggleSection(headEl) { headEl.parentElement.classList.toggle('open'); }
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('lightbox').classList.contains('open')) {
    closeLightbox();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = reportDate(d);
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  const s = d.sections || {};
  const out = [
    renderSummary(d.summary),
    renderSection('A.', 'Debates — Consensus vs Divergence', s.A_debates,    renderTheme),
    renderSection('B.', 'Key Calls & Positioning',           s.B_calls,      renderCall),
    renderSection('C.', 'Notable Deep Reads',                s.C_deep_reads, renderDeepRead,
                  'section-deepreads'),
    renderSection('D.', 'Charts & Data',                     s.D_charts,     renderChart),
    renderSection('E.', 'House Views',                       s.house_views,  renderHouseView),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = out || '<div class="empty">No report data.</div>';

  // Auto-open Summary's section view: first two sections open by default.
  document.querySelectorAll('.section').forEach((sec, i) => {
    if (i < 2) sec.classList.add('open');
  });
}

renderReport(REPORT_DATA);
</script>
