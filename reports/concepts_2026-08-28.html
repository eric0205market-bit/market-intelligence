 an experimental novelty and is beginning to free up genuine work hours.", "speaker": "St. Louis Fed — FRED Blog", "type": "thesis", "entities": ["generative AI"], "conviction": "medium", "so_what": "Frames the debate away from 'is AI useful' toward 'how fast does the saved time convert into output or cost cuts' — the margin question for corporate earnings.", "quote": "Rising time savings suggest AI is not just a novelty; it’s starting to free up real work hours.", "locator": "The summary", "quote_verified": true}, {"claim": "If the current trend in adoption, hours assisted, and hours saved persists, generative AI could begin appearing in broad aggregate productivity statistics within the next several years.", "speaker": "St. Louis Fed — FRED Blog", "type": "prediction", "entities": ["generative AI", "productivity statistics"], "conviction": "medium", "so_what": "Puts a multi-year, not multi-quarter, clock on the macro payoff — relevant to potential-GDP and neutral-rate assumptions rather than to next-quarter earnings.", "quote": "If this trend holds, generative AI could show up in broader productivity statistics in the years ahead.", "locator": "If this trend holds, generative AI", "quote_verified": true}]}, {"theme": "Measurement caveats on self-reported savings", "insights": [{"claim": "The 'time saved' figures in the AI adoption tracker are respondent self-reports, making the measurements inherently approximate rather than observed productivity data.", "speaker": "St. Louis Fed — FRED Blog", "type": "framework", "entities": ["Real-Time Population Survey", "generative AI"], "conviction": "high", "so_what": "Discount the level but trust the direction: the series is best used as a trend/second-derivative indicator, and firm-level or task-level studies are needed to confirm the magnitude.", "quote": "The information is based on how respondents self-report their “time saved,” so the measurements are inherently approximate.", "locator": "The summary", "quote_verified": true}, {"claim": "The three series — weekly work use, hours assisted, and hours saved — are argued to be credible collectively because they move together in a mutually consistent pattern even though each is individually noisy.", "speaker": "St. Louis Fed — FRED Blog", "type": "framework", "entities": ["generative AI"], "conviction": "medium", "so_what": "A triangulation template for reading any self-reported AI-impact survey: require corroboration across breadth, depth, and outcome metrics before acting on a single headline number.", "quote": "these three data series together do tell a coherent story of AI adoption", "locator": "But these three data series together", "quote_verified": true}]}, {"theme": "Data provenance and tracker mechanics", "insights": [{"claim": "The Generative Artificial Intelligence Adoption Tracker was built by economists Alexander Bick, Adam Blandin, and David Deming using the Real-Time Population Survey, a nationally representative online survey of working-age adults aged 18 to 64.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["Alexander Bick", "Adam Blandin", "David Deming", "Real-Time Population Survey", "Generative Artificial Intelligence Adoption Tracker"], "conviction": "high", "so_what": "A nationally representative, quarterly, free FRED series is the closest thing to an official high-frequency AI-diffusion gauge — usable as a repeatable input to macro and AI-exposure models.", "quote": null, "locator": "The survey", "quote_verified": false}, {"claim": "The Real-Time Population Survey asks employed respondents each quarter how fast and how intensely they are adopting AI both at work and outside of work, giving a quarterly cadence to AI diffusion data.", "speaker": "St. Louis Fed — FRED Blog", "type": "framework", "entities": ["Real-Time Population Survey", "generative AI"], "conviction": "high", "so_what": "Quarterly refresh means the series can be tracked as a recurring catalyst for the AI-productivity debate, unlike one-off academic studies.", "quote": "Each quarter, employed respondents report how fast and how intensely they’re adopting AI technology both at work and outside of work.", "locator": "The survey", "quote_verified": true}]}], "insight_total": 11, "top_entities": ["generative AI", "FRED", "Generative Artificial Intelligence Adoption Tracker", "Real-Time Population Survey", "Alexander Bick", "Adam Blandin", "David Deming", "Diego Mendez-Carbajo"], "source_meta": {"author": "", "word_count": 377, "paywalled": false}}, {"record_id": "756e3bc2b72365e6", "source_type": "concepts", "source_name": "Vanguard Research", "source_url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/about-our-funds/proxy-voting-across-funds/how-the-funds-vote.html", "title": "How the funds vote", "published_date": "2026-08-27", "language": "en", "processed_at": "2026-08-28T18:17:25Z", "processor": "claude-code-sub-opus", "tags": ["Positioning", "Society"], "gist": "Vanguard describes a deliberately decentralized proxy-voting architecture: roughly two dozen internal and external managers vote across 400+ funds, and as of 2026 U.S. internally managed fund voting was split from one stewardship group into two separate teams (VCMIS and VPMIS). The stated posture is explicit deference to boards and management — the passive U.S. funds will not submit shareholder proposals or nominate directors — while the Investor Choice program pushes voting power down to end investors in a growing number of funds. The page is primarily a disclosure/navigation hub, so the signal is structural rather than analytical.", "themes": [{"theme": "Fragmented voting architecture", "insights": [{"claim": "Vanguard's proxy votes are not cast by a single centralized body: across more than 400 funds worldwide, roughly two dozen internal and external investment managers vote on behalf of the funds or fund portions they manage.", "speaker": "Vanguard Research", "type": "data_point", "entities": ["Vanguard"], "conviction": "high", "so_what": "Treating 'Vanguard' as one monolithic voting bloc misreads the ownership map; campaigns and vote-outcome models need to account for up to two dozen separate decision-makers with different policies.", "quote": "Across Vanguard’s more than 400 funds worldwide, some two dozen internal and external investment managers cast proxy votes on behalf of the respective funds—or portion of funds—that they manage.", "locator": "A fund-by-fund approach", "quote_verified": true}, {"claim": "Proxy voting for Vanguard's internally managed U.S. funds is administered by two separate and distinct teams — Vanguard Capital Management Investment Stewardship (VCMIS) and Vanguard Portfolio Management Investment Stewardship (VPMIS) — each with its own approach and voting policies.", "speaker": "Vanguard Research", "type": "framework", "entities": ["Vanguard Capital Management Investment Stewardship", "VCMIS", "Vanguard Portfolio Management Investment Stewardship", "VPMIS"], "conviction": "high", "so_what": "Two policy sets inside the same asset manager can produce split votes on the same ballot item; watch for divergence between VCMIS- and VPMIS-stewarded fund lists on contested governance votes.", "quote": "Two separate and distinct teams administer proxy voting on behalf of Vanguard’s internally managed U.S. funds", "locator": "Proxy voting on behalf of Vanguard’s internally managed U.S. funds", "quote_verified": true}, {"claim": "The VCMIS/VPMIS split is new as of 2026 — prior to that year, voting for Vanguard's internally advised funds was administered by a single group, Vanguard Investment Stewardship.", "speaker": "Vanguard Research", "type": "data_point", "entities": ["Vanguard Investment Stewardship", "VCMIS", "VPMIS"], "conviction": "high", "so_what": "Historical Vanguard voting records are not apples-to-apples with post-2026 data; any time series on index-manager voting behavior needs a structural break at 2026.", "quote": "Prior to the establishment of VCMIS and VPMIS in 2026, proxy voting on behalf of Vanguard’s internally advised funds was administered by Vanguard Investment Stewardship.", "locator": "Note: Prior to the establishment of", "quote_verified": true}, {"claim": "Where a fund is managed by multiple advisors, each external advisor's vote is disclosed separately in the vote record rather than aggregated to a single fund-level position.", "speaker": "Vanguard Research", "type": "data_point", "entities": ["Vanguard"], "conviction": "high", "so_what": "Vote-record scraping must dedupe at the advisor level; a single fund can show internally conflicting votes on the same resolution.", "quote": "If a fund is managed by multiple advisors, each external advisor’s vote will display in the record.", "locator": "Global fund disclosure", "quote_verified": true}]}, {"theme": "Deference-to-management stance", "insights": [{"claim": "The passively managed U.S. index equity funds and ETFs explicitly do not seek to dictate company strategy or operations, do not submit shareholder proposals, and do not nominate board members.", "speaker": "Vanguard Research", "type": "thesis", "entities": ["Vanguard", "index equity funds", "ETFs"], "conviction": "high", "so_what": "Activists and issuers should not expect the largest passive holder to originate campaigns; pressure has to come from active holders, with Vanguard votes as a swing factor rather than an instigator.", "quote": "these passive U.S. funds do not seek to dictate company strategy or operations, submit shareholder proposals, or nominate board members", "locator": "Proxy voting on behalf of Vanguard’s internally managed U.S. funds", "quote_verified": true}, {"claim": "The stated governance principle is that precise strategies and tactics for maximizing long-term investment returns belong to a company's board of directors and management team, not to the index fund shareholder.", "speaker": "Vanguard Research", "type": "contrarian", "entities": ["Vanguard", "boards of directors"], "conviction": "high", "so_what": "This is a deliberate step back from the 'universal owner as steward' consensus that drove index-manager engagement in the prior decade — it lowers the odds of passive-money support for prescriptive ESG or strategy resolutions.", "quote": "The precise strategies and tactics for maximizing long-term investment returns should be decided by a company’s board of directors and management team.", "locator": "The precise strategies and tactics for", "quote_verified": true}, {"claim": "Voting is framed as being conducted under stated voting policies in pursuit of each fund's stated investment objective, rather than under a firmwide house view on governance or corporate behavior.", "speaker": "Vanguard Research", "type": "framework", "entities": ["Vanguard"], "conviction": "medium", "so_what": "Grounding votes in per-fund investment objectives narrows the legal and political attack surface on index managers and makes fiduciary-duty challenges to their voting harder to sustain.", "quote": "The managers administer proxy voting in accordance with the stated voting policies and in pursuit of each fund’s stated investment objective.", "locator": "A fund-by-fund approach", "quote_verified": true}]}, {"theme": "Pass-through voting expansion", "insights": [{"claim": "Investor Choice, which gives end investors a greater voice in how their equity index funds vote, has moved past its pilot stage and is offered in a growing number of Vanguard funds.", "speaker": "Vanguard Research", "type": "thesis", "entities": ["Investor Choice", "Vanguard", "equity index funds"], "conviction": "medium", "so_what": "Pass-through voting mechanically dilutes the concentrated voting power of the big index complexes; as coverage grows, forecasting outcomes at large-cap meetings gets noisier and campaign targeting gets harder.", "quote": "A growing number of Vanguard funds offer investors in those funds a greater voice in the proxy voting process through Investor Choice.", "locator": "Investor Choice", "quote_verified": true}, {"claim": "Investors in the Investor Choice pilot directed how their equity index funds voted at select company shareholder meetings, and those directed votes are separately disclosed in a dedicated Investor Choice report.", "speaker": "Vanguard Research", "type": "data_point", "entities": ["Investor Choice", "Vanguard"], "conviction": "high", "so_what": "The Investor Choice record is a rare dataset on what retail index holders actually want on governance ballots — useful for anticipating where pass-through voting shifts outcomes versus the manager default.", "quote": null, "locator": "Vanguard Investor Choice report", "quote_verified": false}, {"claim": "Vanguard publishes Investor Choice Voting Briefs explaining how its U.S. equity index funds voted on important governance topics, including how the voting policy options offered through Investor Choice were applied.", "speaker": "Vanguard Research", "type": "data_point", "entities": ["Investor Choice Voting Briefs", "Vanguard", "U.S. equity index funds"], "conviction": "medium", "so_what": "The briefs are a low-latency read on stewardship reasoning at specific meetings — a cheaper leading indicator than waiting for the annual N-PX dump.", "quote": null, "locator": "Vanguard Investor Choice Voting Briefs", "quote_verified": false}]}, {"theme": "Disclosure cadence and operational risk points", "insights": [{"claim": "U.S. fund votes are disclosed annually on Form N-PX to the SEC under the Investment Company Act of 1940 for the proxy year ended June 30, 2026, while global fund disclosure covers the prior two proxy years and the current proxy year is published quarterly on a rolling basis.", "speaker": "Vanguard Research", "type": "data_point", "entities": ["Form N-PX", "U.S. Securities and Exchange Commission", "Investment Company Act of 1940"], "conviction": "high", "so_what": "The quarterly rolling global feed is materially fresher than the annual N-PX filing — the faster channel to monitor if you track index-manager voting shifts in near real time.", "quote": null, "locator": "Annual U.S. fund disclosure", "quote_verified": false}, {"claim": "Both stewardship teams operate under named operational policies covering third-party service provider oversight, securities lending and proxy voting, and proxy voting conflicts of interest.", "speaker": "Vanguard Research", "type": "framework", "entities": ["VCMIS", "VPMIS", "securities lending"], "conviction": "medium", "so_what": "Securities lending and proxy-advisor reliance are where voting power actually leaks or gets outsourced — these three policies are the pressure points for anyone assessing how much of a share's vote is truly cast.", "quote": null, "locator": "Information about operational procedures and policies", "quote_verified": false}, {"claim": "The internally managed U.S. funds predominantly track benchmarks set by independent index providers, which is presented as the reason those funds refrain from directing company strategy.", "speaker": "Vanguard Research", "type": "causal", "entities": ["Vanguard", "index providers", "ETFs"], "conviction": "high", "so_what": "It reinforces that real allocation power sits with the index providers who define the benchmarks, not with the manager casting the votes.", "quote": "passively managed index equity funds and ETFs that seek to track benchmarks determined by independent index providers", "locator": "Proxy voting on behalf of Vanguard’s internally managed U.S. funds", "quote_verified": true}]}], "insight_total": 13, "top_entities": ["Vanguard", "Vanguard Capital Management Investment Stewardship", "Vanguard Portfolio Management Investment Stewardship", "VCMIS", "VPMIS", "Investor Choice", "Vanguard Investment Stewardship", "Form N-PX", "U.S. Securities and Exchange Commission", "Investment Company Act of 1940", "ETFs", "index providers"], "source_meta": {"author": "", "word_count": 536, "paywalled": false}}, {"record_id": "12a692194e7be981", "source_type": "concepts", "source_name": "Works in Progress", "source_url": "https://worksinprogress.co/issue/the-everything-theory-of-mass-transit/", "title": "The everything theory of mass transit - Works in Progress Magazine", "published_date": "2026-08-26", "language": "en", "processed_at": "2026-08-28T18:19:19Z", "processor": "claude-code-sub-opus", "tags": ["Society", "Energy", "Macro"], "gist": "US transit agencies have accumulated so many secondary mandates - emissions, equity, union jobs, Buy America content, community input, public art - that each dollar of mission creep is subtracted from frequency and coverage, the only things that actually shift drivers out of cars. The hardest evidence is bus electrification economics: Austin pays $917,000 per electric bus vs $535,000 diesel, Miami-Dade runs about six of 75 electric buses on a given day after Proterra's bankruptcy, and the capital for electrifying a single bus could instead buy roughly 2,300 service hours carrying 30,000+ riders. The article argues congestion pricing and land-use densification dominate electrification on emissions per dollar (66m tons from shorter trips vs 9m tons from mode-switching in 2018).", "themes": [{"theme": "Mission creep as a cost driver", "insights": [{"claim": "Public transport agencies are assigned goals - emissions reduction, neighborhood beautification, union job creation, community empowerment - that trade off directly against the core function of moving the maximum number of people.", "speaker": "WorksInProgMag", "type": "thesis", "entities": ["public transit agencies"], "conviction": "high", "so_what": "Cost-per-rider and on-time metrics for US transit are structurally impaired by policy design, not management; underwrite transit capex programs assuming persistent overruns rather than efficiency gains.", "quote": "All of this impedes public transport’s ability to do its main job: transporting the public.", "locator": "We ask public transport to address problems", "quote_verified": true}, {"claim": "The Boston Green Line extension, finished a decade later than planned, added a three-kilometer bike and pedestrian path costing $20 million after 13 people advocated for it at a community meeting.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["Transit Costs Project", "Boston Green Line extension"], "conviction": "high", "so_what": "A concrete price tag on discretionary scope additions - useful as a benchmark when modeling contingency on US rail extensions.", "quote": "added a three-kilometer bike and pedestrian path after 13 people advocated for it at a community meeting, at a staggering cost of $20 million", "locator": "The Transit Costs Project documents", "quote_verified": true}, {"claim": "Each layer of government attaches its own mandates to a transit agency's funding: federal domestic-content and prevailing-wage rules (Buy America, CHIPS Act daycare requirements, Davis-Bacon), state environmental review (the California Environmental Quality Act), and local design, public art, local hiring, and engagement requirements.", "speaker": "WorksInProgMag", "type": "framework", "entities": ["Buy America", "CHIPS Act", "Davis-Bacon", "California Environmental Quality Act"], "conviction": "high", "so_what": "Multi-source funding is a hidden cost multiplier: projects with federal plus state plus local money should be priced with materially worse unit economics than single-source ones.", "quote": null, "locator": "The typical transit agency gets funding", "quote_verified": false}, {"claim": "Road, highway, and parking construction is held to a much narrower mandate - improving mobility - than transit is, giving car infrastructure a structural cost advantage in public procurement.", "speaker": "WorksInProgMag", "type": "causal", "entities": ["highways", "parking structures", "transit agencies"], "conviction": "high", "so_what": "Explains why transit keeps losing share to driving on a cost-per-unit-of-mobility basis despite subsidy; a regulatory-symmetry reform would be the real catalyst to watch, not more capital.", "quote": null, "locator": "Governments build roads, highways, and parking structures", "quote_verified": false}, {"claim": "Buses account for less than one percent of US transportation emissions yet operate under more rules and regulations than personal cars do.", "speaker": "WorksInProgMag", "type": "contrarian", "entities": ["buses", "US transportation emissions"], "conviction": "high", "so_what": "Regulatory burden on buses is wildly disproportionate to their emissions footprint - decarbonization capital aimed at bus fleets is chasing under one percent of the problem.", "quote": "Buses are a rounding error as a proportion of vehicles on the road, accounting for less than one percent of US transportation emissions.", "locator": "Buses are a rounding error", "quote_verified": true}]}, {"theme": "How transit acquired its extra mandates", "insights": [{"claim": "Until the mid-twentieth century almost all transit was privately owned with a simple objective function - maximize ridership and fare revenue while minimizing costs - and mission creep began only after governments took over failing lines in the 1960s.", "speaker": "WorksInProgMag", "type": "framework", "entities": ["private transit operators"], "conviction": "high", "so_what": "The historical baseline shows the current cost structure is institutional, not technological - relevant to any thesis that privatized or concession-model transit can undercut public agencies.", "quote": null, "locator": "Transit missions didn't always creep", "quote_verified": false}, {"claim": "Because most of the public drove, the political case for continued transit subsidy had to be made to non-users, which pushed agencies to align with the War on Poverty, the Civil Rights Movement, environmentalism, and the oil crisis rather than with rider outcomes.", "speaker": "WorksInProgMag", "type": "causal", "entities": ["War on Poverty", "Civil Rights Movement", "environmentalism"], "conviction": "high", "so_what": "Identifies the political mechanism producing scope creep - it persists as long as the median funder is a non-rider, so reform will not come from within agencies.", "quote": "the majority of funding coming from voters who didn’t use it", "locator": "In the 1960s, governments began taking over", "quote_verified": true}, {"claim": "The American Public Transit Association markets transit as a cure-all, claiming it will deliver work, education, healthcare access, job creation, less congestion, and cleaner air simultaneously.", "speaker": "WorksInProgMag", "type": "anecdote", "entities": ["American Public Transit Association"], "conviction": "medium", "so_what": "The industry's own advocacy language is the source of the everything-mandate problem - a tell that stated benefit cases in transit funding proposals are systematically overstated.", "quote": "will get Americans to work, to education, and to healthcare, and it will also get our nation to more job creation, less traffic congestion and cleaner air", "locator": "Today, the American Public Transit Association touts", "quote_verified": true}]}, {"theme": "Electric bus economics are breaking", "insights": [{"claim": "Austin's CapMetro pays $917,000 for a 40-foot electric bus versus $535,000 for the diesel equivalent, a roughly 71 percent procurement premium before operating costs.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["CapMetro", "Austin"], "conviction": "high", "so_what": "Hard capex spread for anyone modeling electric bus OEM demand or municipal fleet budgets - the premium is far above typical EV price-parity assumptions.", "quote": null, "locator": "Austin's CapMetro 40-foot electric buses", "quote_verified": false}, {"claim": "Miami-Dade's transit agency spent roughly $1.1 million per electric bus and, out of 75 purchased, only about six are operating on a given day because they break down every 600 miles - seven times as often as diesel buses.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["Miami-Dade", "electric buses"], "conviction": "high", "so_what": "An eight percent availability rate on an $82m fleet purchase is the strongest single argument against near-term electric bus procurement; expect procurement pullback and warranty/reliability litigation risk.", "quote": "out of the 75 buses it purchased, only about six are operating", "locator": "In south Florida, the Miami-Dade county's transit agency", "quote_verified": true}, {"claim": "Proterra's bankruptcy has made replacement parts for already-purchased electric buses difficult to obtain, compounding the fleet's downtime.", "speaker": "WorksInProgMag", "type": "causal", "entities": ["Proterra", "Miami-Dade"], "conviction": "high", "so_what": "Supplier-solvency risk is a first-order variable in transit electrification, not a footnote - buyers should price OEM balance sheets, and it is a cautionary precedent for other thinly capitalized EV manufacturers.", "quote": null, "locator": "particularly since the manufacturer, Proterra, filed for bankruptcy", "quote_verified": false}, {"claim": "Buy American rules mean US agencies pay nearly twice the roughly $600,000 that a standard 12-meter electric bus sells for in Europe, where Chinese manufacturers compete freely.", "speaker": "WorksInProgMag", "type": "causal", "entities": ["Buy America", "Chinese bus manufacturers", "Europe"], "conviction": "high", "so_what": "A quantified protectionism tax of roughly 2x on a decarbonization input - a template for how domestic-content rules erode the volume of green infrastructure actually delivered per dollar.", "quote": null, "locator": "In Europe, where Chinese manufacturers compete freely", "quote_verified": false}, {"claim": "The US electric bus market remains small - about 7,000 electric out of roughly 63,000 buses, and 5,000 of those 7,000 are school buses - leaving transit agencies with few competing suppliers.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["US bus fleet", "school buses"], "conviction": "high", "so_what": "Only about 2,000 non-school electric transit buses exist in the US: the addressable market is far thinner than headline electrification targets imply, and thin markets sustain the price premium.", "quote": null, "locator": "Out of roughly 63,000 buses in the US", "quote_verified": false}, {"claim": "Germany's bus fleet electrification raised operating costs by 12 percent, and Stockholm research puts the operator cost increase at at least 16 percent depending on the charging setup, even though passengers experience no difference.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["Germany", "Stockholm"], "conviction": "high", "so_what": "A 12-16 percent structural opex increase with zero rider-facing benefit means electrification is a pure subsidy sink absent a carbon price that clears that bar.", "quote": null, "locator": "In Germany, electrifying bus fleets increased costs", "quote_verified": false}, {"claim": "Converting a diesel bus fleet to electric requires new software, land use permitting, grid connections for charging infrastructure, and additional worker time to fuel vehicles, with route planning around chargers adding significant operational complexity.", "speaker": "WorksInProgMag", "type": "framework", "entities": ["charging infrastructure", "grid connections"], "conviction": "high", "so_what": "The ancillary spend - depot electrification, permitting, dispatch software - is where the real dollars sit, pointing to grid-interconnect and fleet-software vendors rather than bus OEMs as the exposure.", "quote": null, "locator": "Moving from diesel to electric buses doesn't just mean swapping vehicles", "quote_verified": false}]}, {"theme": "Opportunity cost arithmetic", "insights": [{"claim": "At a median US bus operating cost of $131 per hour and a median 14.3 passengers carried per hour, the money used to electrify a single bus could instead fund roughly 2,300 additional service hours carrying at least 30,000 additional riders.", "speaker": "WorksInProgMag", "type": "framework", "entities": ["US bus operations"], "conviction": "high", "so_what": "A ready-made unit-economics test for any transit capital decision: convert capex into forgone service hours and riders before approving it.", "quote": null, "locator": "Assuming the median cost per hour for operating a bus", "quote_verified": false}, {"claim": "Every dollar spent complying with Buy America or staging community meetings is a dollar not spent on improving service frequency or coverage.", "speaker": "WorksInProgMag", "type": "thesis", "entities": ["Buy America", "community engagement"], "conviction": "high", "so_what": "Frames compliance spending as directly cannibalizing the service quality that drives ridership and farebox revenue - the key variable for transit credit and ridership forecasts.", "quote": "Every dollar spent complying with Buy America or staging community meetings is a dollar not spent improving frequency or coverage.", "locator": "Every dollar spent complying with Buy America", "quote_verified": true}, {"claim": "Six California transportation pilot programs - electric carshare, bikeshare, and microtransit in disadvantaged areas funded by the California Air Resources Board - improved mobility for households mostly earning under $25,000 a year but added 128,880 net new vehicle miles and slightly increased overall emissions.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["California Air Resources Board", "microtransit", "bikeshare", "electric carshare"], "conviction": "high", "so_what": "Green mobility pilots can be net emissions-additive while succeeding on equity - a direct warning that dual-mandate programs should not be underwritten on their climate claims.", "quote": "the programs added 128,880 net new vehicle miles and slightly increased overall emissions rather than decreasing them", "locator": "The transit tradeoff", "quote_verified": true}]}, {"theme": "Pricing and density beat electrification", "insights": [{"claim": "Research on Stockholm's busiest bus route found that better pricing of roads and transit plus running buses more often delivered more benefit than electrifying the buses.", "speaker": "WorksInProgMag", "type": "contrarian", "entities": ["Stockholm"], "conviction": "high", "so_what": "Ranks demand-side pricing above supply-side electrification on cost-effectiveness - the policy path that would actually move mode share, and the one with fiscal upside rather than drain.", "quote": null, "locator": "Prices make perfect", "quote_verified": false}, {"claim": "London's congestion charge cut vehicle greenhouse gas emissions by 16 percent, generated £227 million in a single year, and coincided with nine percent fewer traffic accidents in its first year.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["London", "congestion pricing"], "conviction": "high", "so_what": "Congestion charging is revenue-positive and emissions-negative simultaneously - a fiscally attractive template for cities facing transit funding gaps, and a watch item for municipal budget forecasts.", "quote": null, "locator": "In London, greenhouse gas emissions from vehicles fell", "quote_verified": false}, {"claim": "Switching people from driving to transit saved nine million metric tons of carbon in 2018, but shortening travel distances through more efficient land use could prevent 66 million metric tons - roughly seven times as much.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["land use", "carbon emissions"], "conviction": "high", "so_what": "Land use, not vehicle technology, is the dominant decarbonization lever in transportation - a reason to weight zoning and density reform above fleet electrification in climate-policy exposure.", "quote": null, "locator": "Switching people from driving to transit saved nine million", "quote_verified": false}, {"claim": "Increasing transit service frequency by one percent boosts ridership by about 0.5 percent, and once buses arrive every ten minutes the service becomes appealing to riders who have alternatives, creating a self-reinforcing loop of revenue and quality.", "speaker": "WorksInProgMag", "type": "framework", "entities": ["transit frequency", "ridership"], "conviction": "high", "so_what": "A quantified frequency elasticity of 0.5 plus a ten-minute headway threshold gives a concrete operating target to judge whether an agency's spending will actually grow ridership.", "quote": "Once buses arrive every ten minutes, bus services become more appealing for riders with alternatives.", "locator": "When transit becomes more viable and reliable", "quote_verified": true}, {"claim": "Electrifying buses makes more sense in major cities where transit is dominant than in car-dominant places such as Fresno, California, where the priority should be moving low-income people to jobs.", "speaker": "WorksInProgMag", "type": "thesis", "entities": ["Fresno", "California"], "conviction": "medium", "so_what": "Argues for geographically differentiated electrification policy - uniform national fleet mandates misallocate capital in low-density metros.", "quote": null, "locator": "In major cities, where transit is more dominant", "quote_verified": false}]}, {"theme": "Riders, cars, and the equity inversion", "insights": [{"claim": "While 91.5 percent of American households own at least one car, only 45 percent of transit riders have a vehicle available at home, meaning transit's core constituency is the carless minority.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["American households", "transit riders"], "conviction": "high", "so_what": "Quantifies the political-economy trap: transit serves a small captive base while being funded by a driving majority, which sustains scope creep indefinitely.", "quote": null, "locator": "While 91.5 percent of American households own", "quote_verified": false}, {"claim": "In most of the US, poor people who gain access to a car are more likely to find jobs, keep jobs, find higher-paying jobs, work more hours, get off welfare, and move to better neighborhoods - making car access an anti-poverty intervention.", "speaker": "WorksInProgMag", "type": "contrarian", "entities": ["car ownership", "poverty"], "conviction": "high", "so_what": "Directly against the transit-advocacy consensus: mobility outcomes for the poor may be better served by car access programs than by transit capital, a live fault line in transportation policy funding.", "quote": "Poor people who gain access to a car are more likely to find jobs, keep their jobs, find higher paying jobs, work more hours, get off welfare, and move to better neighborhoods.", "locator": "Focusing transit on what it does best", "quote_verified": true}, {"claim": "Loading environmental and labor mandates onto transit asks people already struggling financially, who already emit far less than most Americans, to carry the cost of decarbonization - which is self-defeating because it makes transit less competitive against cars.", "speaker": "WorksInProgMag", "type": "thesis", "entities": ["transit riders", "emissions policy"], "conviction": "high", "so_what": "Reframes green transit mandates as regressive: the policy is failing on both its equity and its climate objectives, which is the argument that could eventually reverse funding formulas.", "quote": "Scope creep fails on its own terms.", "locator": "Scope creep fails on its own terms", "quote_verified": true}, {"claim": "A 2018 UCLA report on Southern California estimated that if one in four rare transit users replaced a single driving trip with transit every two weeks, annual ridership would grow by 96 million.", "speaker": "WorksInProgMag", "type": "prediction", "entities": ["UCLA", "Southern California"], "conviction": "medium", "so_what": "Shows the ridership upside sits with occasional riders who own cars, not the captive base - so service quality aimed at choice riders is where marginal investment pays.", "quote": null, "locator": "A 2018 UCLA report on transit ridership", "quote_verified": false}, {"claim": "Emissions reduction is better achieved by getting a broad base of people to make small behavioral changes than by forcing a small, already burdened group of transit-dependent riders to carry the load.", "speaker": "WorksInProgMag", "type": "thesis", "entities": ["emissions policy", "transit riders"], "conviction": "high", "so_what": "The closing policy prescription - broad marginal shifts over concentrated mandates - which favors pricing and land-use instruments over fleet procurement rules.", "quote": null, "locator": "It's more sensible to reduce emissions", "quote_verified": false}]}], "insight_total": 28, "top_entities": ["Proterra", "CapMetro", "Miami-Dade", "Buy America", "California Air Resources Board", "London", "Stockholm", "Transit Costs Project", "American Public Transit Association", "California Environmental Quality Act", "Davis-Bacon", "Fresno"], "source_meta": {"author": "WorksInProgMag", "word_count": 1488, "paywalled": false}}]};

function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
