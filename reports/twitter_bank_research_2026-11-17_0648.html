<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;

  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;

                 color: var(--text-3); }

.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;

              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }

.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);

.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }

.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);

.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;

.lightbox img { max-width: 92vw; max-height: 92vh;

            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}

const REPORT_DATA = {"report_type": "TWITTER BANK RESEARCH", "freshness_gate": "OK    data/twitter/latest/tweets_bank_research.json: collected_at 2026-11-17T06:23:38+00:00 (0.4h old), non-empty\nFRESHNESS GATE PASSED.", "collected_at": "2026-11-17T06:23:38Z", "date": "2026-11-17", "window_days": 4, "input_stats": {"total_tweets": 120, "considered": 120, "kept": 29, "dropped": 91, "deduped": 1}, "summary": "Recurring themes: 2027 house outlooks (Goldman macro/inflation/AI-capex/gold, Morgan Stanley 'max overweight' equities, Goldman/MS/Barclays all at S&P 8,700).\nPositioning washouts and flows: Goldman CTA NDX shorts near max, BofA systematic releveraging and negative-to-neutral gamma, Barclays timing model bearish, Citadel buyback window reopening.\n$NVDA valuation, leverage and FCF work from JPMAM Cembalest; Staples valuation stretch (Goldman thematic, Yardeni).\nMacro data: BofA soft October card spending vs trend-like retail sales call; Citi Economic Surprise Index at 3+ year highs.\nCounts: Goldman 12, JPM 6, BofA 4, Barclays 2, Citi 2, Morgan Stanley 2, Yardeni 2, Apollo/Slok 1, Citadel 1.", "by_bank_counts": {"Goldman": 12, "JPM": 6, "BofA": 4, "Barclays": 2, "Citi": 2, "Morgan Stanley": 2, "Yardeni": 2, "Apollo/Slok": 1, "Citadel": 1}, "banks": [{"bank": "Goldman", "theme": "Goldman 2027 outlook — gold $4,650, core PCE 2.4%, AI capex $1.4tn, 50k/mo jobs; post-hike trough pattern, CTA Tech shorts, Staples short, China cost of capital", "items": [{"author": "MikeZaccardi", "text": "GS: We see gold prices grinding higher to $4,650/toz by end-2027 $GLD https://t.co/GeJvpSyVIc", "tweet_url": "https://x.com/MikeZaccardi/status/2122404648980021595", "images": ["https://pbs.twimg.com/media/HXRLyBvWAAAsnjB.png"], "created_at": "2026-11-16T19:01:15.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Morgan Stanley’s 2027 outlook goes “max overweight” global stocks, saying “With risk assets having cheapened, we embrace risk.” It added to equities in every region:\n\n▪️ U.S. stays overweight; Japan and Europe raised to overweight; EM stays equal weight.\n▪️ End-2027 targets: S&P 500 8,700 (+15%), TOPIX 4,800 (+22%), MSCI Europe 3,030 (+15%), MSCI EM 1,760 (+13%).\n▪️ Funded by cutting the rest of fixed income, commodities and cash; corporate credit raised to equal weight; likes gold.\n▪️ Expects $1.7T of hyperscaler capex in 2027 and $1.8T in 2028, and says AI is broadening to adopters.\n\nWilson’s new 8,700 target (from 8,000) is 19x his 2028 EPS of $458. His EPS path is $369 / $420 / $458 for 2026–28 (+34% / +14% / +9%).\n\nSo the whole target raise has come from earnings. Since May Wilson has lifted his 2027 EPS 11% while cutting the multiple to 19x from about 20.5x. Notably his 14% 2027 growth is still below the 16.2% analysts expect (FactSet).\n\nNote also the bank is calling for the 10-year Treasury rate to fall to 5.05% in 1H27 even with two more Fed rate hikes. The S&P’s forward earnings yield (18.3x per FactSet) is about 5.5%, only about a third of a point over the current 5.14% 10-year. On trailing earnings, stocks now yield 1.31 points less than the 10-year, the widest gap since 2009. \n\nWith Goldman and Barclays also at 8,700 for next year, the debate is whether the earnings show up. Wilson also says says a retest of 7,100–7,300 “could still lie ahead.”\n\n“Our view dating back to late September has been that the correction associated with the mid cycle transition would conclude with the S&P 500 catching down to narrow breadth. That process is now well advanced as the index has approached our established 7,100–7,300 support range,” he said. “While a retest could still lie ahead, the recent correction provides the springboard for the next leg higher toward our new 8,700 base case.”", "tweet_url": "https://x.com/neilsethinew/status/2122374555876376952", "images": ["https://pbs.twimg.com/media/HXQirsvWoAAxkeA.jpg"], "created_at": "2026-11-16T17:01:40.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: We Expect Core PCE Inflation to Fall to 2.4% by End-2027\n\n'We Are Confident That the Combined Impact of Tariffs, the Energy Shock, and AI Price Pressures Will Fall Sharply by End-2027' https://t.co/YtAFVPqT0u", "tweet_url": "https://x.com/MikeZaccardi/status/2122370110346117326", "images": ["https://pbs.twimg.com/media/HXQsXlrXYAAViOH.png"], "created_at": "2026-11-16T16:44:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Today marks two months since the Fed’s September 16 hike, and so far stocks are following the pattern Goldman laid out for a first hike in a “modest” hiking cycle. Goldman found equities “tend to struggle after the first hike but recover quickly,” with the median trough coming within two months.\n\nThe S&P 500’s November 5 close (7,353), 2.6% below the hike-day close, remains its low since the hike and its Q4 low so far. Friday’s close left the index 2.8% above that low and 0.1% above the hike-day close.\n\nWhether that low holds is the question I explored in part in this week's Week Ahead.", "tweet_url": "https://x.com/neilsethinew/status/2122338217869357283", "images": ["https://pbs.twimg.com/media/HXQPEMwXYAA94RU.jpg"], "created_at": "2026-11-16T14:37:16.000Z", "relayers": []}, {"author": "neilsethinew", "text": "From @C_Barraud’s packed Monday Morning Brief, @AndreasSteno says “Everything is upside down to the dot com pricing.”\n\nTwo of the valuation items in the brief (the second from @MikeZaccardi via @yardeni):\n\n▪️ In March 2000, S&P tech traded at 55x and Cisco at 130x, while Staples sat at 17x. Today, as I mentioned last week, the Nasdaq-100 is at about 18x, the lowest since the Covid crash. Nvidia is at 11x and Micron at 4x, while Walmart and Costco trade at 40x and 42x.\n▪️ Consumer Staples’ forward P/E has climbed to 24.2x, the highest since 1999. That’s well above its 5-year (20.8x) and 10-year (20.1x) averages.\n\nGoldman’s thematic desk was already leaning against the move last week. As I noted in that week’s Week Ahead (https://t.co/JZ7uYgRz4o), it liked shorting its Staples basket, which had beaten the S&P 500 by nearly 20% over the prior month. They noted similar metrics:\n\n▪️ S&P Staples’ valuation premium to the index is the highest in more than 10 years.\n▪️ The basket’s 2.84% dividend yield is 2.05pp below the 10-year Treasury yield, the 1st percentile of the last 10 years.\n▪️ Historically, Staples have lagged over the next three months after similar runs, except in late 2021/early 2022.\n\nLooking at the charts, on Nov 5, $XLP’s one-month lead over $SPY hit +18.4%. Only April and October 2000 and March 2020 were higher. Since 1999 there have been 10 earlier runs of 12% or more, and XLP lagged over the next three months in 6 of them (median −4.5%).\n\nThe exceptions: 2000 (twice), late 2008 and 2022. Each came during an S&P 500 bear market that kept grinding lower over the next three months. Being in a bear market wasn’t enough on its own though: the 2001 and March 2020 runs also came during bear markets, and Staples lagged as stocks bounced. So the short is really a bet on a rebound.\n\nEven if it is a 2000 replay, the starting point is very different. Staples went into the dot-com unwind at 17x. They’re going into this one at 24x.", "tweet_url": "https://x.com/neilsethinew/status/2122322269217214568", "images": ["https://pbs.twimg.com/media/HXP-X2lXcAAKG3l.jpg"], "created_at": "2026-11-16T13:33:54.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Goldman expects a 50k/mo pace of job growth through 2027\n\nUnemployment rate climbing back toward 4.5% https://t.co/oNMXY0ruI4", "tweet_url": "https://x.com/MikeZaccardi/status/2122310844478296545", "images": ["https://pbs.twimg.com/media/HXP2d4SWEAAjZN2.png"], "created_at": "2026-11-16T12:48:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: We Expect Nominal AI Investment Spending to Increase $500bn to an Annualized Pace of $1.4tn by End-2027, Slightly Less Than the Peak $550bn Increase in 2026 https://t.co/Y1W1qK1TL2", "tweet_url": "https://x.com/MikeZaccardi/status/2122310215290798427", "images": ["https://pbs.twimg.com/media/HXP15QGXYAAi8QD.png"], "created_at": "2026-11-16T12:46:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS sees 2027 real GDP growth of 2.4%, with +2.4% on core PCE ... call it 4.5-5% nominal growth https://t.co/5a3RxmUqkL", "tweet_url": "https://x.com/MikeZaccardi/status/2122309586044489974", "images": ["https://pbs.twimg.com/media/HXP1UodXAAEYJdn.png"], "created_at": "2026-11-16T12:43:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Fed Chairman Kevin Warsh will give opening remarks at the Productivity and Jobs Task Force Conference held at the San Francisco Fed. \n\nWarsh will also moderate two panels and participate in a fireside chat later in the day. https://t.co/N06wULel9X", "tweet_url": "https://x.com/MikeZaccardi/status/2122308328239829440", "images": ["https://pbs.twimg.com/media/HXP0LaQXQAAXKi_.png"], "created_at": "2026-11-16T12:38:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: We Estimate the Brent Risk Premium Has Dropped From $27/bbl Before the Midterms to Only a Few Dollars https://t.co/3JtMu5WF8d", "tweet_url": "https://x.com/MikeZaccardi/status/2122307699224265070", "images": ["https://pbs.twimg.com/media/HXPzmyTXEAAGMa1.png"], "created_at": "2026-11-16T12:36:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman (Coppersmith): In addition to of discretionary investors, CTAs have also been aggressively selling Tech. In fact, CTA positioning in NDX is back near max shortlevels. \n\nWith positioning this light, it probably doesn't take much positive news to spark a squeeze higher. https://t.co/9iOUwCfERg", "tweet_url": "https://x.com/neilsethinew/status/2122303671048306787", "images": ["https://pbs.twimg.com/media/HXNicChXwAAQqMg.jpg"], "created_at": "2026-11-16T12:20:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "@C_Barraud's Top Macro Charts of the Week included a link to a ZeroHedge article on a new Goldman Global Strategy Paper that looks into why China’s growth has never seemed to reach shareholders. Goldman’s interesting conclusion? Capital has been too cheap.\n\nThe scorecard:\n▪️ China has added about $5T of GDP since Covid, but its stocks have trailed global equities by 110 percentage points since 2020.\n▪️ From 2020 to 2026, China is the only market in Goldman’s comparison with a negative dollar return (-22%), vs. +137% for the S&P 500 and +75% for the rest of EM.\n▪️ EPS has compounded at just 6% a year since 2021, and ROE has fallen for six straight years even as leverage rose.\n▪️ Realized index EPS has missed start-of-year consensus nine years in a row.\n▪️ Net share issuance has averaged 0.8% of market cap a year, about 15% cumulative EPS dilution.\nGoldman says the problem is that China has “probably one of the lowest COCs [costs of capital] among key markets globally”:\n▪️ MSCI China (ex-financials) WACC has fallen from 7.5% in 2020 to 5.4%, while the US went the other way, from 4.9% to 6.0%.\n▪️ CSI 300 WACC is down from 9.3% to 3.8%, and the broad “All China” universe from 8.1% to 3.2%.\n\nWhy is that a problem? When the hurdle rate is 3%, almost any project clears it. That’s why capex intensity keeps climbing while ROE, ROIC and capacity utilization slide.\n\nGoldman names five causes for the low COC: subsidies, regulatory caps on private-sector profits (Common Prosperity, the 3 Red Lines, the Alibaba and Didi crackdowns), a stimulus bias toward supply over households, the property bust and disinflationary tech. The capacity figures show the result: China’s projected 2026–28 capacity equals 167% of global demand in solar modules, 122% in lithium batteries and 102% in air conditioners.\n\nTwo things I’d add:\n▪️ The cheap money isn’t free; the banks are absorbing it (which is why Chinese bank profitability is at record lows). Chinese bank net interest margins hit a record-low 1.40% in Q1, below the 1.8% regulators consider healthy, with the 1-year LPR held at a record-low 3.0% for 17 straight months through October. Natixis puts listed-company return on capital at about 6%, vs. more than 11% for global peers.\n▪️ 2026 looks set to make it ten years of misses. Goldman’s own China team opened the year calling for 14% EPS growth. Per Bloomberg, consensus 2026 estimates for MSCI China were cut more than 4% from the end of March, and Q3 reporters had missed by about 9% on average as of late October.\n\nGoldman is still constructive. It sees trend EPS growth of 6.4% that AI and “Going Global” could lift to 10% a year over the next five years, with anti-involution a distant third. It pairs that with a 12% normal ROE and 10–15% re-rating upside. It says to avoid the property-linked “Depressed Growth” bucket, where profits have collapsed from RMB1.1T in 2020 to RMB150B, until housing stabilizes, possibly not before 2028/29.\n\nOverall, the findings bolster the arguments of those who say the “return to normal” of rates in the US is not a bad thing. The US is the counterexample: its cost of capital rose 1.1 points over 2020–26, and the S&P 500 still returned 137%. Cheap money didn’t make Chinese companies more profitable; it made them less disciplined.\n\nFor investors, it seems the investable part of China is the companies that earn more than their cost of capital.", "tweet_url": "https://x.com/neilsethinew/status/2122275988818342180", "images": ["https://pbs.twimg.com/media/HXNu5m6XEAAiNRI.jpg"], "created_at": "2026-11-16T10:30:00.000Z", "relayers": []}]}, {"bank": "JPM", "theme": "JPMAM Cembalest — $NVDA leverage, FCF, PEG 0.2x, index weight and retail dip-buying", "items": [{"author": "MikeZaccardi", "text": "$NVDA debt debt to trailing 12m EBITDA ... basically nothing\n\n$ORCL by contrast... > 4x JPMAM Cembalest https://t.co/RYrD764cfB", "tweet_url": "https://x.com/MikeZaccardi/status/2122454646312563060", "images": ["https://pbs.twimg.com/media/HXR5QPvW0AABqA-.png"], "created_at": "2026-11-16T22:19:55.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Historic $NVDA retail dip-buying. JPMAM Cembalest https://t.co/wE3e7a4RrF", "tweet_url": "https://x.com/MikeZaccardi/status/2122359289700393398", "images": ["https://pbs.twimg.com/media/HXQihxTXUAEHibi.png"], "created_at": "2026-11-16T16:01:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "As always, street estimates follow price #ConservatismBias $NVDA \nJPMAM Cembalest @danielcrosby @Ritholtz @jasonzweigwsj https://t.co/8ozjavizUF", "tweet_url": "https://x.com/MikeZaccardi/status/2122349223291011436", "images": ["https://pbs.twimg.com/media/HXQZX08XkAALymj.png"], "created_at": "2026-11-16T15:21:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "$NVDA big free cash flow.. even $MSFT may drift negative. JPMAM Cembalest https://t.co/v1qpw4h3Vk", "tweet_url": "https://x.com/MikeZaccardi/status/2122340414178971876", "images": ["https://pbs.twimg.com/media/HXQRXENWUAA_uvI.png"], "created_at": "2026-11-16T14:46:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "JPMAM Cembalest: Nvidia now trades at a PEG (P/E to consensus earnings growth) ratio of just 0.2x, compared to much higher figures for other companies and sectors $NVDA https://t.co/KMovmEKxmw", "tweet_url": "https://x.com/MikeZaccardi/status/2122335381202907446", "images": ["https://pbs.twimg.com/media/HXQMyGYWMAAR389.png"], "created_at": "2026-11-16T14:26:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "JPMAM Cembalest: $NVDA had the fastest rise to the top of the S&P 500 in history—surging from 1% to 8.5% of the index.\n\nNow, Jensen exit marks the end of an era.\n$NVDA now trades at a valuation far below that of other large AI stocks. https://t.co/V83OynPeQE", "tweet_url": "https://x.com/MikeZaccardi/status/2122331872705315233", "images": ["https://pbs.twimg.com/media/HXQJldQXQAA-Vsr.png"], "created_at": "2026-11-16T14:12:04.000Z", "relayers": []}]}, {"bank": "BofA", "theme": "BofA — October card spending and retail sales preview, systematic releveraging flows, SPX gamma", "items": [{"author": "neilsethinew", "text": "BofA’s card data shows October spending fell short of its usual pace almost everywhere.\n\nBy our calculations, 10 of 11 categories grew more slowly in October than their average month over the prior 11 months. Furniture (−2.7%) and department stores (−1.9%) were the weakest, and even online retail’s +0.7% rebound only matched its usual pace.\n\nTotal card spending per household rose just 0.1% month over month, the second soft month in a row.", "tweet_url": "https://x.com/neilsethinew/status/2122418616721154116", "images": ["https://pbs.twimg.com/media/HXRYcu6XAAAWgCJ.jpg"], "created_at": "2026-11-16T19:56:45.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BofA is looking for a trend-like October retail sales report, close to consensus:\n\n▪ Retail sales +0.2% (consensus +0.1%).\n▪ Ex-autos +0.4% (consensus +0.3%).\n▪ Control group +0.4% (in line with consensus).\n\nBofA’s own card data was soft, but it expects seasonal adjustment to lift the Census figures by 0.2–0.3pp relative to that signal.", "tweet_url": "https://x.com/neilsethinew/status/2122308703810736531", "images": ["https://pbs.twimg.com/media/HXMTVdzXgAAfHYl.jpg"], "created_at": "2026-11-16T12:40:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "In a positive for flows this week, after cleaning out positioning, BofA sees the systematic community ready to releverage: \n\nBofA estimates global systematic positioning slipped to ~$212B, its lowest this year, from ~$225B the prior week and ~$350B a month ago.\n\nIt sees funds buying stocks this week as its base case:\n\n+$28B of buying in a flat market (from roughly $0 last week), as vol control (~$11B), risk parity (~$9B) and CTAs (~$8B, mostly Europe) all add.\n+$26B of buying in an “up” market (BofA’s high-percentile path, roughly +3.8% for S&P 500 futures over five days; from +$11B last week), almost all from CTAs rebuilding longs.\n−$22B of selling in a “down” market (BofA’s low-percentile path, roughly −5.9% for S&P futures; from −$37B last week), from CTAs (~$17B) and vol control (~$10B), partly offset by risk-parity buying (~$5B). That’s the smallest down-market estimate in at least eight weeks.", "tweet_url": "https://x.com/neilsethinew/status/2122298890355413210", "images": ["https://pbs.twimg.com/media/HXNskFcWgAA9Yb0.jpg"], "created_at": "2026-11-16T12:01:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "In what will hopefully reduce volatility this week, BofA says while SPX hedger gamma was negative at every close last week, it ended Thursday at −$1.0B (13th percentile of the past year), up from −$4.9B a week earlier. \n\nOn Thursday’s profile, gamma turns positive at ~7,605 and stays positive up to ~7,850, so a modest rally would have market makers dampening moves again (currently they are relatively neutral). Friday’s 0.4% drop left the S&P 500 at 7,561.67, about 0.6% below the level where gamma turns positive.\n\nThat said, any further declines would push gamma further negative likely leading to more volatility.", "tweet_url": "https://x.com/neilsethinew/status/2122293604337193105", "images": ["https://pbs.twimg.com/media/HXNqr81XEAAucP-.jpg"], "created_at": "2026-11-16T11:40:00.000Z", "relayers": []}]}, {"bank": "Barclays", "theme": "Barclays — 8,700 S&P target alongside MS/GS; market-timing model bearish", "items": [{"author": "neilsethinew", "text": "Morgan Stanley’s 2027 outlook goes “max overweight” global stocks, saying “With risk assets having cheapened, we embrace risk.” It added to equities in every region:\n\n▪️ U.S. stays overweight; Japan and Europe raised to overweight; EM stays equal weight.\n▪️ End-2027 targets: S&P 500 8,700 (+15%), TOPIX 4,800 (+22%), MSCI Europe 3,030 (+15%), MSCI EM 1,760 (+13%).\n▪️ Funded by cutting the rest of fixed income, commodities and cash; corporate credit raised to equal weight; likes gold.\n▪️ Expects $1.7T of hyperscaler capex in 2027 and $1.8T in 2028, and says AI is broadening to adopters.\n\nWilson’s new 8,700 target (from 8,000) is 19x his 2028 EPS of $458. His EPS path is $369 / $420 / $458 for 2026–28 (+34% / +14% / +9%).\n\nSo the whole target raise has come from earnings. Since May Wilson has lifted his 2027 EPS 11% while cutting the multiple to 19x from about 20.5x. Notably his 14% 2027 growth is still below the 16.2% analysts expect (FactSet).\n\nNote also the bank is calling for the 10-year Treasury rate to fall to 5.05% in 1H27 even with two more Fed rate hikes. The S&P’s forward earnings yield (18.3x per FactSet) is about 5.5%, only about a third of a point over the current 5.14% 10-year. On trailing earnings, stocks now yield 1.31 points less than the 10-year, the widest gap since 2009. \n\nWith Goldman and Barclays also at 8,700 for next year, the debate is whether the earnings show up. Wilson also says says a retest of 7,100–7,300 “could still lie ahead.”\n\n“Our view dating back to late September has been that the correction associated with the mid cycle transition would conclude with the S&P 500 catching down to narrow breadth. That process is now well advanced as the index has approached our established 7,100–7,300 support range,” he said. “While a retest could still lie ahead, the recent correction provides the springboard for the next leg higher toward our new 8,700 base case.”", "tweet_url": "https://x.com/neilsethinew/status/2122374555876376952", "images": ["https://pbs.twimg.com/media/HXQirsvWoAAxkeA.jpg"], "created_at": "2026-11-16T17:01:40.000Z", "relayers": []}, {"author": "LanceRoberts", "text": "Sentiment and positioning in the market have become bearish across multiple measures, including @WarrenPies' sentiment model, @Barclays' market-timing model, and CTA Positioning. Such negative readings often precede market reversals. https://t.co/JYPFtF1GXn", "tweet_url": "https://x is EPS path is $369 / $420 / $458 for 2026–28 (+34% / +14% / +9%).\n\nSo the whole target raise has come from earnings. Since May Wilson has lifted his 2027 EPS 11% while cutting the multiple to 19x from about 20.5x. Notably his 14% 2027 growth is still below the 16.2% analysts expect (FactSet).\n\nNote also the bank is calling for the 10-year Treasury rate to fall to 5.05% in 1H27 even with two more Fed rate hikes. The S&P’s forward earnings yield (18.3x per FactSet) is about 5.5%, only about a third of a point over the current 5.14% 10-year. On trailing earnings, stocks now yield 1.31 points less than the 10-year, the widest gap since 2009. \n\nWith Goldman and Barclays also at 8,700 for next year, the debate is whether the earnings show up. Wilson also says says a retest of 7,100–7,300 “could still lie ahead.”\n\n“Our view dating back to late September has been that the correction associated with the mid cycle transition would conclude with the S&P 500 catching down to narrow breadth. That process is now well advanced as the index has approached our established 7,100–7,300 support range,” he said. “While a retest could still lie ahead, the recent correction provides the springboard for the next leg higher toward our new 8,700 base case.”", "tweet_url": "https://x.com/neilsethinew/status/2122374555876376952", "images": ["https://pbs.twimg.com/media/HXQirsvWoAAxkeA.jpg"], "created_at": "2026-11-16T17:01:40.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Morgan Stanley is 'max overweight' global stocks on AI cycle https://t.co/aJONzaqK5c", "tweet_url": "https://x.com/MikeZaccardi/status/2122317766128459914", "images": ["https://pbs.twimg.com/media/HXP8wvwWYAA8azs.png"], "created_at": "2026-11-16T13:16:00.000Z", "relayers": []}]}, {"bank": "Yardeni", "theme": "Yardeni — Staples forward P/E 24.2x, Citi surprise index highs", "items": [{"author": "neilsethinew", "text": "From @C_Barraud’s packed Monday Morning Brief, @AndreasSteno says “Everything is upside down to the dot com pricing.”\n\nTwo of the valuation items in the brief (the second from @MikeZaccardi via @yardeni):\n\n▪️ In March 2000, S&P tech traded at 55x and Cisco at 130x, while Staples sat at 17x. Today, as I mentioned last week, the Nasdaq-100 is at about 18x, the lowest since the Covid crash. Nvidia is at 11x and Micron at 4x, while Walmart and Costco trade at 40x and 42x.\n▪️ Consumer Staples’ forward P/E has climbed to 24.2x, the highest since 1999. That’s well above its 5-year (20.8x) and 10-year (20.1x) averages.\n\nGoldman’s thematic desk was already leaning against the move last week. As I noted in that week’s Week Ahead (https://t.co/JZ7uYgRz4o), it liked shorting its Staples basket, which had beaten the S&P 500 by nearly 20% over the prior month. They noted similar metrics:\n\n▪️ S&P Staples’ valuation premium to the index is the highest in more than 10 years.\n▪️ The basket’s 2.84% dividend yield is 2.05pp below the 10-year Treasury yield, the 1st percentile of the last 10 years.\n▪️ Historically, Staples have lagged over the next three months after similar runs, except in late 2021/early 2022.\n\nLooking at the charts, on Nov 5, $XLP’s one-month lead over $SPY hit +18.4%. Only April and October 2000 and March 2020 were higher. Since 1999 there have been 10 earlier runs of 12% or more, and XLP lagged over the next three months in 6 of them (median −4.5%).\n\nThe exceptions: 2000 (twice), late 2008 and 2022. Each came during an S&P 500 bear market that kept grinding lower over the next three months. Being in a bear market wasn’t enough on its own though: the 2001 and March 2020 runs also came during bear markets, and Staples lagged as stocks bounced. So the short is really a bet on a rebound.\n\nEven if it is a 2000 replay, the starting point is very different. Staples went into the dot-com unwind at 17x. They’re going into this one at 24x.", "tweet_url": "https://x.com/neilsethinew/status/2122322269217214568", "images": ["https://pbs.twimg.com/media/HXP-X2lXcAAKG3l.jpg"], "created_at": "2026-11-16T13:33:54.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Citi Eco Surprise Index... more 3+ year highs @yardeni https://t.co/ZBH3AgF3WX", "tweet_url": "https://x.com/MikeZaccardi/status/2122320282178261152", "images": ["https://pbs.twimg.com/media/HXP_DNlWUAAhxwR.jpg"], "created_at": "2026-11-16T13:26:00.000Z", "relayers": []}]}, {"bank": "Apollo/Slok", "theme": "Apollo — federal interest bill doubled to ~$1.25T while private sector insulated", "items": [{"author": "MikeZaccardi", "text": "T at Apollo: Higher rates hit Washington, not the private sector\n\nCorporations and homeowners locked in low pandemic-era rates, leaving them largely insulated. Meanwhile, Washington didn’t—and its annual interest bill has more than doubled from ~$500B to ~$1.25T.\n\nCharts below 👇 https://t.co/QubQHY7NKP", "tweet_url": "https://x.com/MikeZaccardi/status/2122297286294147149", "images": ["https://pbs.twimg.com/media/HXPqIbYWoAAR0z3.jpg", "https://pbs.twimg.com/media/HXPqIiwWwAAdrim.jpg", "https://pbs.twimg.com/media/HXPqIrfWcAEtjOJ.jpg"], "created_at": "2026-11-16T11:54:38.000Z", "relayers": []}]}, {"bank": "Citadel", "theme": "Citadel — buyback window: ~82% of S&P weight eligible, peaking ~97% mid-December", "items": [{"author": "neilsethinew", "text": "Citadel estimates about 82% of S&P 500 index weight will be eligible to repurchase shares today (November 16th), rising to about 91% by next Monday (November 23rd) and peaking near 97% in mid-December, before falling back late in the month as the next blackout begins. https://t.co/0cF2WaTWQs", "tweet_url": "https://x.com/neilsethinew/status/2122268439024988545", "images": ["https://pbs.twimg.com/media/HXNme3RWIAAavyv.jpg"], "created_at": "2026-11-16T10:00:00.000Z", "relayers": []}]}]};

// ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
