const ITEMS = [{"id": 1, "cat": "positioning", "urgency": "act", "source": "Stephen Innes / The Dark Side Of The Boom", "title": "Nomura: $47B of leveraged-ETF selling into the close, another $61B from vol-control still to come", "idea": "Nomura's McElligott estimates leveraged ETFs faced ~$47B of end-of-day selling requirements, the second-largest adjustment in its history, overwhelmingly tech and semis. Vol-control funds could add $61B, and dealers are short gamma. His real worry: the Street has learned to front-run the mechanical flows, so when the expected afternoon rebound fails, that failure becomes its own risk.", "angle": "This is a flow story, not a fundamentals story, which means the bottom is set by when the schedules finish, not by an earnings revision. Different execution schedules = liquidation can bleed into Friday.", "tweetA": "$47B levered-ETF rebalance done. $61B of vol-control selling still on the schedule. Everyone has the same calendar, so the trade isn't 'buy the dip', it's 'who is left to take the other side of a rebalance everybody front-ran'.", "tweetB": "Gamma-short dealers plus levered ETF rebalances means the close is a forced seller, not an opinion. The tell isn't price, it's whether the bounce into the next open happens at all. If it doesn't, the crowd's playbook is the risk.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening (VIX chart referenced as 'VIX Legend')"}, "link": "https://thedarksideoftheboom.substack.com/p/the-100-billion-trap-nomura-warns"}, {"id": 2, "cat": "macro", "urgency": "act", "source": "Stephen Innes / The Dark Side Of The Boom", "title": "S&P -4%, Nasdaq-100 -6%, semis -11%: the post-election relief rally lasted one session", "idea": "Wednesday's rally was oil collapsing, yields falling, a less inflationary backdrop. Thursday the market decided cheap money is no consolation if AI earnings estimates get cut. Volumes: SPY ~160% above 20-day avg, QQQ +100%, semis ETFs +150%, DRAM turnover +75%; vol had its sharpest jump in nearly two years.", "angle": "Good news on rates was fully overwhelmed by bad news on E. The multiple argument lost to the denominator argument in 24 hours.", "tweetA": "Wednesday: oil down, yields down, stocks up. Thursday: same oil, same yields, S&P -4%. The discount-rate trade got front-run by the earnings-estimate trade in one session. Know which one you own.", "tweetB": "SPY volume at 2.6x average and QQQ at 2x isn't dip buying, it's a risk-budget liquidation. When the market sells the portfolio instead of the stocks, quality gets sold first because it's what's liquid.", "charts": {"count": 1, "hot": true, "desc": "VIX chart ('VIX Legend') embedded in email"}, "link": "https://thedarksideoftheboom.substack.com/p/hedge-funds-are-capitulating-the"}, {"id": 3, "cat": "AI/infra", "urgency": "deep", "source": "Stephen Innes / The Dark Side Of The Boom", "title": "Too many chips, not enough plugs: the 2028 gigawatt bear case is 'flat vs 2027'", "idea": "Investors had modeled data-center power capacity and capex growing 30%+ y/y in 2028. The darker scenario now circulating has GW added in 2028 running barely above 2027. The worry is chips arriving faster than powered shells, which hits memory (DRAM/NAND/HDD) hardest because the shortage premium sits in ASPs. Texas, Georgia and Ohio exposure is why IPPs, E&C and neoclouds are all in the downdraft.", "angle": "The AI bear case just rotated from 'demand' to 'physical throughput'. Memory is the cleanest expression: its pricing power depends on someone being able to plug the servers in.", "tweetA": "The AI bear case used to be 'who pays'. Now it's 'where do you plug it in'. 30% growth in 2028 GW vs flat is the entire difference between memory at peak margin and memory at mid-cycle.", "tweetB": "Land, interconnects, permits. Semis can be fabbed on a schedule; a county zoning board can't. Watch DRAM/HBM lead times vs powered-shell completions, that spread is the 2028 inventory problem.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/hedge-funds-are-capitulating-the"}, {"id": 4, "cat": "positioning", "urgency": "deep", "source": "Stephen Innes / The Dark Side Of The Boom", "title": "Burry cut his semi ETF puts by 25% into the crash", "idea": "Buried in the Innes note: Michael Burry disclosed he reduced his semiconductor ETF put positions by 25% during the rout. Same session: Intel down nearly 30% since Friday, Qualcomm and Arm guided weak, Tesla and SpaceX down at least 8%, Bitcoin another -5%, Apple's $7.5B bond deal printed fine.", "angle": "The famous bear taking profits while long-onlys are frozen is a positioning tell: shorts are lighter, so the next leg down needs fresh sellers.", "tweetA": "The most famous semi bear cut his puts 25% into the biggest semi drawdown since Covid. When the shorts take money off, the next leg has to come from longs. That's a very different tape.", "tweetB": "Apple prints $7.5B of bonds into the worst tape in 18 months. Access to credit isn't the problem for the top of the cap structure, which is why the AI debt story will be about the *bottom* of it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/hedge-funds-are-capitulating-the"}, {"id": 5, "cat": "positioning", "urgency": "act", "source": "Daily Chartbook (DC Lite #715)", "title": "Oversold semis: first reading since the April 2025 tariff tantrum; Nasdaq-100 and SOX had worst days since Covid", "idea": "S&P 500 and Russell 2000 fell the most in 18+ months; Nasdaq-100 and semiconductors had their worst day since Covid. Daily Chartbook's study flags semis oversold for the first time since Apr '25.", "angle": "Oversold is a setup, not a signal, and the Apr '25 comp is a policy reversal. This one has no tweet from anyone to reverse it.", "tweetA": "Semis oversold for the first time since April 2025. Last time a policy reversal fixed it in days. This time there's no one to call. Fade the analogy before you fade the move.", "tweetB": "Worst day since Covid for the SOX and a Russell 2000 break at the same time says it isn't an AI-only unwind. Count how many 'AI' stocks you own that are actually just beta.", "charts": {"count": 2, "hot": true, "desc": "Koyfin: S&P/R2K/NDX/SOX worst days; Daily Chartbook study: SOX first oversold since Apr'25"}, "link": "https://www.dailychartbook.com/p/the-question-is-whether-the-bull-market-can-continue-without-semis-participating-41e9"}, {"id": 6, "cat": "macro", "urgency": "deep", "source": "Daily Chartbook (DC Lite #715)", "title": "SPX vs semis: +70% on semi-up days, -34% on semi-down days this year", "idea": "Per Warren Pies: owning the S&P only on days semis are up produced +70% YTD; owning it on semi-down days lost 34%. 'No industry has dictated index performance this much.' The open question post-midterms: can the bull market continue without semis?", "angle": "One industry is a factor exposure to the entire index. After a -11% day, the question isn't valuation, it's what the S&P is without its only engine.", "tweetA": "+70% on semi-up days, -34% on semi-down days. The S&P in 2026 is one stock-picking decision. Not diversified, a single sector wearing an index costume.", "tweetB": "If SOX is the S&P's beta, then S&P puts are cheaper semis puts, and semis puts are the more direct thing. Do the math on which vol surface is richer before choosing.", "charts": {"count": 1, "hot": true, "desc": "Warren Pies chart: S&P returns split by semi up/down days"}, "link": "https://www.dailychartbook.com/p/the-question-is-whether-the-bull-market-can-continue-without-semis-participating-41e9"}, {"id": 7, "cat": "AI/infra", "urgency": "deep", "source": "Daily Chartbook (DC Lite #715)", "title": "TS Lombard: >80% of AI revenues are still 'recycled capex'", "idea": "Dario Perkins: more than 80% of AI-related revenues still come from recycled capex, i.e. from inside the ecosystem, not from businesses and consumers outside it willing to pay for AI services.", "angle": "If four-fifths of the revenue is the ecosystem paying itself, a capex slowdown cuts revenue directly, not just growth. Circularity is the reflexive part of the bear case.", "tweetA": "80% of AI revenue is recycled capex. So a capex cut isn't a growth slowdown, it's a revenue cut. Reflexivity runs both directions and we just saw the downside leg start.", "tweetB": "Contrast with the Dwarkesh/TWIAI data points: one guy spent $100k on tokens in weeks. Real end-users exist, but in this chart they're still under 20% of the pie.", "charts": {"count": 1, "hot": true, "desc": "Perkins/TS Lombard recycled-capex chart"}, "link": "https://www.dailychartbook.com/p/the-question-is-whether-the-bull-market-can-continue-without-semis-participating-41e9"}, {"id": 8, "cat": "credit", "urgency": "deep", "source": "Daily Chartbook (DC Lite #715)", "title": "JPM's Cembalest: only 15% of AI debt and lease commitments sit on balance sheet for the big seven", "idea": "Cembalest ('Now you can see everything'): only ~15% of debt and lease commitments appear on balance sheet for the big seven AI companies, which may explain why their credit spreads have been widening rapidly.", "angle": "Spread widening in the IG hyperscaler complex is the quiet counterpart to the equity rout. 85% off-balance-sheet means the agencies and equity analysts are looking at the wrong denominator.", "tweetA": "15% on balance sheet. 85% in leases, SPVs and commitments. Credit has been repricing this for months; equity just noticed Thursday.", "tweetB": "Compare with Apple's $7.5B deal clearing fine today. Spread dispersion inside 'AI' credit is the actual trade: best balance sheets bid, off-balance-sheet builders offered.", "charts": {"count": 1, "hot": true, "desc": "JPM Eye on the Market: on vs off balance sheet AI liabilities"}, "link": "https://www.dailychartbook.com/p/the-question-is-whether-the-bull-market-can-continue-without-semis-participating-41e9"}, {"id": 9, "cat": "positioning", "urgency": "watch", "source": "Daily Chartbook (DC Lite #715)", "title": "Daily Chartbook ICYMI: CTA model at -3.3 sd US equity positioning; central bank gold demand strong in Q3; 'Safe is expensive'", "idea": "Headlines linked in the ICYMI: a CTA model puts aggregate US equity positioning at -3.3 standard deviations; central bank gold buying stayed strong in Q3; and a 'safe is expensive' piece. Only titles are visible in the email.", "angle": "-3.3 sd positioning after one day suggests a lot of the mechanical selling is already in the number. Hold against PA's estimate that half of ~$200B is done.", "tweetA": "CTA equity positioning at -3.3 sd. That's about as washed out as the model gets. Mechanical selling gets exhausted by construction; the question is who has dry powder after the margin calls.", "tweetB": "Central banks kept buying gold in Q3 while gold ETFs are being sold as a liquidity source. Two different buyers with opposite time horizons.", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://www.dailychartbook.com/p/our-cta-model-estimates-aggregate-us-equity-positioning-at-3-3-standard-deviations-75c8"}, {"id": 10, "cat": "positioning", "urgency": "act", "source": "PA - Global Macro", "title": "~$200B of systematic selling estimated, half already done; CTAs are short rates, long oil, long equities", "idea": "PA estimates nearly $200B of selling is set to occur, roughly half on Thursday, and the next moves are 'mechanical'. Momentum factors were destroyed on Wednesday, then CTAs de-risked after the vicious oil move drove a big Treasury rally, which hurt their short-rates/long-oil book while they were still long equities. Kospi futures were -8%.", "angle": "CTAs were wrong-footed on all three legs by the same shock (oil down, bonds up, stocks down). A single macro variable that hits every leg of a trend book is a correlation event.", "tweetA": "CTAs: short bonds, long oil, long equities. Oil falls, bonds rally, stocks drop. Every leg lost on the same news. That's not diversification failing, that's the book being one trade.", "tweetB": "Kospi futures -8% overnight. Korea is the cleanest listed proxy for the memory trade, so the next 12 hours of Asian tape is the real test of whether the $100B left to sell is mostly in Seoul.", "charts": {"count": 1, "hot": false, "desc": "Macro dashboard screenshot embedded"}, "link": "https://www.paperalfa.com/p/friday-thoughts-929"}, {"id": 11, "cat": "macro", "urgency": "deep", "source": "PA - Global Macro", "title": "PA: payrolls Friday matter less than the systems; model went long bonds late October, short US equities", "idea": "PA expects a solid payroll report and says any back-up in yields will be bought. Models caught the short in US equities and went long bonds at the end of October. Expects further de-grossing 'also in light of a weekend of possible geopolitical flare-ups'. Central bank action (RBA, BoE) reviewed in the paywalled Macro D section.", "angle": "When a macro seller says a strong payroll is a bond buying opportunity, it's a statement that the regime is risk-off, not data-dependent.", "tweetA": "A strong payroll print tomorrow and the market's likely reaction function is 'buy bonds on the back-up'. That's a regime where good news isn't bad news anymore. It's just irrelevant.", "tweetB": "The weekend is the risk: de-grossing into a Friday close with Iran headlines possible. Nobody wants to hold gross into Sunday night.", "charts": {"count": 1, "hot": false, "desc": "Daily dashboard screenshot"}, "link": "https://www.paperalfa.com/p/friday-thoughts-929"}, {"id": 12, "cat": "energy", "urgency": "act", "source": "Trading Mindset & Data (TMAD)", "title": "Midterms send WTI below $100 as administration blames the Iran conflict for market debacles", "idea": "WTI sold off sharply after the midterms as the administration attributes the market problems to the Iran conflict, reviving hopes for a negotiated settlement even though Tehran still rejects peace terms. The pullback briefly revived precious metals, but with the conflict ongoing the sustainability of a gold rebound is 'highly questionable' amid a hawkish Fed.", "angle": "WTI below $100 is a political-risk discount, not a supply fix. Compare with Every's note that Hormuz is moving oil at a ~$40 security premium.", "tweetA": "Oil down on 'Iran deal' hopes while Tehran rejects the terms. That's the market selling a headline, not a barrel. Do the math on what happens to WTI if Muscat falls through. $USO $XLE", "tweetB": "Gold got a one-day bid from lower oil and then a hawkish Fed reminds you what the real rate is doing. The easy gold narrative this week is 'safe haven', the harder one is 'rates, not fear'. $GLD $SLV", "charts": {"count": 0, "hot": false, "desc": "Positioning charts inside - worth opening"}, "link": "https://www.tmad.news/p/tmad-commodities-midterm-elections"}, {"id": 13, "cat": "geopolitics", "urgency": "deep", "source": "Maggie Lake / The Market House (Michael Every, Rabobank)", "title": "Michael Every: 'There aren't going to be any TACOs' on Iran", "idea": "Rabobank's Every says the market bet all year Trump would 'taco' on Iran; he disagrees because Iran is part of an energy play against China: Americas plus Middle East = control of the energy complex, a card against China's rare-earths card. 'If he wins, he keeps it. And if he doesn't, he will not taco and go home.' Either regime change or a stalemate of blockade and low-level war.", "angle": "Sets up a contrary read to today's oil selloff (TMAD): a market pricing 'settlement' vs a strategist saying the strategy is written down and public.", "tweetA": "The consensus trade this year was TACO on Iran. Every says the strategy is published government policy, not improvisation. Oil under $100 on 'deal' hopes is a bet against a document.", "tweetB": "Oil isn't just the fuel here, it's the counter-weapon in a rare-earths standoff. If you trade crude on headlines and not on that framework, you will keep getting chopped.", "charts": {"count": 0, "hot": false, "desc": "67-min video episode; first ~25 min free"}, "link": "https://themarkethouse.substack.com/p/michael-every-no-tacos-on-iran"}, {"id": 14, "cat": "geopolitics", "urgency": "deep", "source": "Maggie Lake / The Market House (Michael Every, Rabobank)", "title": "Hormuz math: $40 security premium, freight 11-12x normal, and China pays more than the US", "idea": "Every: oil gets out through Hormuz at a ~$40 security premium, refined products can't, bunker fuel is short, insurance is dearer, fuel gets shuttled around Africa, and freight is 'like 11, 12 times' normal. US diesel hurts, but 'China has it worse'. The plan was 'Venezuela 2.0' that didn't go to plan; Plan B squeezes China's commodity inputs.", "angle": "A $40 premium and 11x freight is the transmission mechanism for every inflation print for the next quarter.", "tweetA": "11-12x freight. A $40/bbl security premium. And the thing being tested isn't US consumers, it's Chinese industry. I'd want to know which side is closer to a pain threshold. $FRO $TNK", "tweetB": "The refined-products bottleneck, not crude, is the pinch. That's why crack spreads and diesel keep leading, and why 'oil down' headlines don't relieve the real economy. $VLO $MPC", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://themarkethouse.substack.com/p/michael-every-no-tacos-on-iran"}, {"id": 15, "cat": "geopolitics", "urgency": "deep", "source": "Maggie Lake / The Market House (Michael Every, Rabobank)", "title": "Rare earths: Japan can't get any yttrium; China-to-world price gap 'a thousand X'", "idea": "Every confirms China holds the rare-earths cards: Japan currently cannot source yttrium at all, and the price gap between China and everyone else is ~1000x. His counter: US/Canada/Mexico/LatAm oil production and refining is second only to the Middle East, so energy is the weapon Washington can put on the table.", "angle": "A 1000x domestic-vs-export price gap isn't a market, it's a tax. Yttrium is a coating/ceramics input, so watch where the first downstream shortage shows up.", "tweetA": "Japan can't buy yttrium at any price, and the China vs ex-China gap is ~1000x. That's not a commodity, it's a export license with a price tag. Where's the first factory line to go dark?", "tweetB": "'Someone's put a gun on the table and you say, okay, where do I sign?' is the best description of why 'because markets' has no answer to a weaponized supply chain.", "charts": {"count": 0, "hot": false, "desc": "Yttrium link in email"}, "link": "https://themarkethouse.substack.com/p/michael-every-no-tacos-on-iran"}, {"id": 16, "cat": "geopolitics", "urgency": "watch", "source": "Maggie Lake / The Market House (Michael Every, Rabobank)", "title": "Peace is a spectrum: 'who did better in 1945, Japan or the US?'", "idea": "Every's frame: peace is analog, not binary. Best case in Russia-Ukraine is a frozen Korea-style conflict with continued arming, so many trades stay the same, maybe fewer refinery strikes. In the Middle East, either Iran is toppled and the region reordered (worse before better) or the blockade and low-level war persist.", "angle": "Useful to stress-test a de-escalation long: which assets actually benefit from a frozen conflict vs a resolved one?", "tweetA": "Everyone is trading 'peace' as a binary. Japan and the US both got peace in 1945. Pick which one your portfolio is.", "tweetB": "A Korea-style freeze in Ukraine means defense budgets stay elevated and refinery risk dips only slightly. That's the base case for European defence, not a peace dividend. $RHM $BAE", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://themarkethouse.substack.com/p/michael-every-no-tacos-on-iran"}, {"id": 17, "cat": "regulation", "urgency": "act", "source": "Michael Parekh / AI Ramblings Daily", "title": "Data-center ballot measures passed 43 to 1; ~60% of planned 2028 capacity now at risk of delay", "idea": "Axios: restrictive data-center ballot measures won 43 to 1 on Tuesday, ~75% of voters in favor on average. Analysts say ~60% of planned 2028 capacity risks delay. WSJ: Texas, Georgia and Ohio hold over 40% of planned US data-center capacity; a top AI investor says a quarter to a third of next year's buildout could be at risk. The new Big Tech offer: pay for the grid, bring your own power, no tax breaks, no secret deals; Amazon sets aside $1B over five years.", "angle": "43-1 is not a margin you negotiate around. The buildout now has a political cost of capital.", "tweetA": "43 to 1. That's the scoreboard on data-center ballot measures. When 75% of voters in three of the biggest power markets say no, the 2028 GW forecast isn't a spreadsheet problem, it's a permitting problem.", "tweetB": "Bring-your-own-power plus no tax breaks plus community payments is a cost stack. Who has the balance sheet to eat it? That's a consolidation trade: Big Tech wins, neoclouds wait for financing. $MSFT $AMZN $CRWV", "charts": {"count": 0, "hot": false, "desc": "Charts in AI-RTZ #1261 - worth opening"}, "link": "https://michaelparekh.substack.com/p/the-baby-and-the-bathwater-in-ai"}, {"id": 18, "cat": "regulation", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily", "title": "OpenAI's 'National Community Compact': no NDAs, residents don't pay for power, public reporting", "idea": "Two days after the vote OpenAI released a compact: no more NDAs in data-center deals (a key local grievance), residents won't bear power costs (builders bring behind-the-meter power), clear data on water/noise/energy, local hiring goals, public reports. OpenAI wants it written into law and says some projects may be delayed. Also renaming data centers 'compute campuses'.", "angle": "A company asking to be regulated is usually pre-empting a worse rule. Writing it into law also raises the barrier for a smaller entrant.", "tweetA": "OpenAI is asking Congress to write its own community compact into law. Look at who can afford the compliance cost: not a leveraged neocloud.", "tweetB": "'Compute campuses' is the tell. When the industry rebrands to avoid ballot measures, it knows the unit economics are now a political product.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/the-baby-and-the-bathwater-in-ai"}, {"id": 19, "cat": "tech", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily", "title": "The AI trade split in two: MSFT/AMZN +6% on Wednesday, Hut 8 -23%, IREN and Core Scientific ~-10%", "idea": "Post-vote Wednesday: Microsoft and Amazon +6%+, Alphabet/Apple/Meta up, while data-center builders were hit (Hut 8 -23%, IREN and Core Scientific ~-10%), the chip index hit a six-month low, and SpaceX/Tesla fell 3%+. The Information's logic: slowdown hurts neoclouds (CoreWeave, Nebius) most and may let Big Tech pull back spend. This was before Thursday's broad liquidation.", "angle": "Wednesday's split (hyperscaler up, builders down) was the rational trade. Thursday's everything-down was the forced one. The split is the signal to watch when it resumes.", "tweetA": "Wednesday MSFT/AMZN +6%, Hut 8 -23%. That was the *rational* repricing: capex slowdown = Big Tech margin relief and neocloud pain. Thursday wasn't rational, it was mechanical. Which one persists?", "tweetB": "A capex pullback is a transfer from the supply chain to the hyperscaler P&L. Be long the spender, short the one selling them power and racks.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/the-baby-and-the-bathwater-in-ai"}, {"id": 20, "cat": "labor", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily", "title": "The hidden post-midterm upside for AI: immigration (H-1B at $100k, Hispanic swing of 30-40 points)", "idea": "Parekh: Democrats run both chambers from Jan 3 and are likely proactive on immigration; Texas youth/Hispanic voters swung 30-40+ points. Legal tech-talent immigration is down double digits, India/China student flows down sharply, H-1B carries a $100,000 fee. 'Talent is as key an input as power and Nvidia's chips.'", "angle": "If talent is the third constraint after power and chips, a visa reform is a supply-side catalyst nobody is pricing.", "tweetA": "Everyone is pricing the data-center permit risk from the midterms. Almost nobody is pricing the H-1B reversal. Talent is the third bottleneck after power and GPUs.", "tweetB": "A $100k H-1B fee is a tax on exactly the engineers Meta is paying nine figures to poach. The talent war is a tell for how binding that constraint is.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/the-baby-and-the-bathwater-in-ai"}, {"id": 21, "cat": "venture", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily", "title": "Coding is the enterprise on-ramp: Meta buys Conductor, OpenAI buys Pierre; Musk paid $60B+ for Cursor", "idea": "Meta acquired Conductor (runs many AI coding agents in parallel, founded 2024), same day OpenAI said it is buying Pierre Computer. Parekh notes Musk spent $60B+ for Cursor before taking SpaceX public in June. Brockman told WSJ H1 was 'pretty rough' for OpenAI before a Q3 coding-driven revenue inflection; business customers now bring in more than consumers. OpenAI IPO targeted next year; Anthropic reportedly planning to list before Thanksgiving.", "angle": "Coding is where AI revenue is cleanest, so it's where M&A prices go. Anthropic before Thanksgiving is a near-term supply event for the whole complex.", "tweetA": "Meta, OpenAI and Musk all bought AI coding tools in the same week. When incumbents buy the orchestration layer, the startups running 'many agents at once' just got a price discovery event.", "tweetB": "Anthropic IPO before Thanksgiving, OpenAI next year, SpaceX already public. The supply of AI equity is about to be the thing the market has to absorb, in a week when it can't absorb semis.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/the-baby-and-the-bathwater-in-ai"}, {"id": 22, "cat": "culture", "urgency": "watch", "source": "Michael Parekh / AI Ramblings Daily", "title": "GTA 6 lands Nov 19; RAMageddon is adding hundreds of dollars to console and laptop prices", "idea": "GTA 5 sold 230M+ copies; about a third of US gamers plan to buy GTA 6 (Nov 19). Nintendo's Ocarina of Time remake is out for Switch 2. Meanwhile Microsoft is resetting Xbox with thousands laid off, EA closing BioWare, Epic cuts, and memory-driven price hikes of hundreds of dollars on consoles, handhelds and gaming laptops.", "angle": "Memory shortage is a consumer tax now. The AI buildout is repricing a consumer hobby.", "tweetA": "The biggest game launch in history lands into a memory shortage that's added hundreds of dollars to hardware. AI datacenters are crowding out gamers for DRAM.", "tweetB": "GTA 6 is a single-title demand shock in a market where the platform holder is laying off thousands. Take-Two vs Microsoft is the barbell. $TTWO $MSFT", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/the-baby-and-the-bathwater-in-ai"}, {"id": 23, "cat": "science", "urgency": "deep", "source": "Dwarkesh Patel", "title": "Dwarkesh: AIs playing a deception game, GPT-6 Astra beats Opus 4.6 by ~430 Elo (92% win rate)", "idea": "He spent ~$20,000 in API credits running 386 games of Blood on the Clocktower with whole teams of one model. Astra (Sept) beats Opus 4.6 (Feb) about 92% of the time; OpenAI gained 580 Elo from GPT-5.4 to GPT-6 Astra (97% win rate vs 5.4). Gains are mostly on the good side: OpenAI models are more skeptical of individual evidence, Claude models tend to take reported information at face value.", "angle": "A benchmark that measures long-horizon deception and coordination is exactly the capability stack agents need. Elo that doesn't saturate because the opponent is the next model.", "tweetA": "430 Elo is a 92% win rate. In seven months. A benchmark where the opponent is the next model never saturates, which is the only kind worth watching.", "tweetB": "The finding that matters: models that update holistically instead of trusting reported info win. That's not just a game skill, it's the difference between an agent you can give a budget to and one you can scam.", "charts": {"count": 1, "hot": false, "desc": "Elo leaderboard chart in video essay"}, "link": "https://www.dwarkesh.com/p/clocktower"}, {"id": 24, "cat": "science", "urgency": "watch", "source": "Dwarkesh Patel", "title": "AIs now build and improve their own RL environments (20+ revisions, subagents read every game)", "idea": "Dwarkesh used Claude to write the engine, then Claude launched dozens of games, spun up parallel subagents to read each one for unfairness or imbalance, and revised the design; 20+ loops, some while he slept. Also: no AI ever used 'who writes like me' to identify teammates, and a mixed-model team did not significantly outperform pure teams.", "angle": "If models can build and iterate on the environments that train models, the RL-environment bottleneck loosens. Data-center capex is the other bottleneck.", "tweetA": "The model wrote the game, ran the games, read the games, then rewrote the game. That's an RL environment factory run by the thing being trained. I'm stunned at how little human judgment was left.", "tweetB": "20 revisions, a few overnight with the human out of the loop. Compute is the input here, not labor. It's the bullish case for tokens and the bearish case for the RL data-vendor business.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.dwarkesh.com/p/clocktower"}, {"id": 25, "cat": "tech", "urgency": "deep", "source": "This Week in AI", "title": "The all-you-can-eat AI buffet is closing: Grok Bot throttled, $1,000/mo agents, $100k of tokens in weeks", "idea": "SpaceX throttled Grok Bot compute calling the offering financially unsustainable. The panel would pay $1,000/mo (Jason, Mark Jeffrey) or $500 (Nick Harris of Lightmatter); Code Metal's Peter Morales burned $100,000 of tokens in a few weeks and is fighting his CTO; Garry Tan spends up to $200k/year. Subsidized plans cost frontier labs real money daily, so higher prices are coming.", "angle": "The unit-economics question is finally being answered by throttling, not by pricing pages. Subsidy removal is a demand test.", "tweetA": "Grok Bot throttled because the compute bill was unsustainable. Plans that cost the lab real money every day are the equivalent of a free Uber ride in 2015. Price is the next shoe.", "tweetB": "$100k in tokens in weeks and a fight with the CTO. That's a cloud-bill moment. The firms that win are the ones who get ROI/token, not tokens.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.thisweekinai.ai/p/the-all-you-can-eat-ai-buffet-is"}, {"id": 26, "cat": "regulation", "urgency": "watch", "source": "This Week in AI", "title": "Headlines in link list: Texas Gov. Abbott halts data-center approvals pending audits; Meta ordered to pay $25B in New Mexico case; Goldman pulls AI coding tools", "idea": "The link list carries several notable headlines: Abbott halts data center approvals until audits are done (NBC DFW), a judge orders Meta to pay $25B in New Mexico's Cambridge Analytica case, Goldman Sachs pulls AI coding tools from traders and bankers, WaPo on LLM answers about the midterms coming from a handful of suspect websites, and Altman calling DRAM home computers 'quite terrible'. Only titles are visible in the email.", "angle": "Texas pausing approvals lines up with the ballot-measure numbers: even red-state power markets are slowing the pipe.", "tweetA": "Texas has the largest share of planned US data-center capacity, and its governor just paused approvals pending audits. The permitting risk isn't a blue-state story.", "tweetB": "Goldman pulling AI coding tools from traders is the other half: the buyer with the biggest compliance budget in finance isn't comfortable. Adoption curves hit risk walls before they hit capability walls.", "charts": {"count": 0, "hot": false, "desc": "Links only - open the episode page"}, "link": "https://www.thisweekinai.ai/p/the-all-you-can-eat-ai-buffet-is"}, {"id": 27, "cat": "geopolitics", "urgency": "act", "source": "Michael McDonough / The Pressure Point", "title": "Bomb hoaxes disrupt 25+ European flights: a message can command airspace, airports and air forces", "idea": "At least 25 flights were disrupted Thursday (London, Dublin, Helsinki) after ~10 on Nov 3, when a Warsaw airport closed and jets scrambled in Rome. Roughly 35 across two waves with no explosives found and no attribution. The piece's thesis: the safety procedure is the payload; the sender needs authorities to respond correctly, and the cost asymmetry favors the hoaxer. Counter: coordination may be an artifact of coverage.", "angle": "Hybrid-warfare cost curve: pennies to the attacker, millions to carriers and air forces.", "tweetA": "~35 flights disrupted by anonymous messages and no device found. The attacker's cost is an email. Europe's integrated network turns a local alarm into a continental delay. $RYA  $LHA", "tweetB": "Compliance as attack surface: any system designed to respond correctly to every credible threat can be driven by someone who only has to be credible. Think about which other infrastructure runs on that rule.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-compliance-is-the-payload/"}, {"id": 28, "cat": "credit", "urgency": "act", "source": "Michael McDonough / The Pressure Point", "title": "Paraguay's president resigns amid Ueno Bank collapse; ~3M people without access to deposits", "idea": "Under 'Things happen': President Santiago Peña resigned amid Ueno Bank's collapse, with Vice President Pedro Alliana taking office while millions await access to their deposits (Euronews).", "angle": "A bank failure that takes down a head of state is rare. Sovereign-and-bank doom loop in a frontier market with a USD-linked deposit base.", "tweetA": "A bank collapse just removed Paraguay's president. When deposits are frozen for 3M people, the political risk premium isn't a spread, it's a government.", "tweetB": "Watch the LatAm local credit and the guaraní. Frontier bank runs rarely stay frontier when the dollar is strong and oil is volatile.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-compliance-is-the-payload/"}, {"id": 29, "cat": "tech", "urgency": "deep", "source": "Michael McDonough / The Pressure Point", "title": "Anthropic launches a Claude personal-finance service that connects directly to bank accounts", "idea": "From 'Things happen': Anthropic introduced a Claude personal-finance service that can connect directly to users' bank accounts (via Plaid, per the Verge link).", "angle": "The AI model providers are moving into account-level data, which is where the real stickiness is.", "tweetA": "An LLM that can see your bank account is a different product from a chatbot. Data access, not model quality, is the moat. Plaid is the plumbing.", "tweetB": "Consumer fintech just got a new competitor with a general-purpose model. Watch what happens to the budgeting-app category's multiple. $INTU $PYPL", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-compliance-is-the-payload/"}, {"id": 30, "cat": "regulation", "urgency": "watch", "source": "Michael McDonough / The Pressure Point", "title": "California Governor Newsom to commute all 548 death sentences; DOJ civil-rights chief Dhillon resigns; Ukraine hopes for more US support", "idea": "Things happen: Newsom will commute the sentences of all 548 inmates on death row (SCMP). Harmeet Dhillon stepped down as head of DOJ civil rights, the first senior departure after the GOP midterm defeat. Ukraine expects greater US support after Democrats won both chambers; Melania Trump hosted Russian and Ukrainian envoys to tout a short local truce that allowed civilians to evacuate a damaged town.", "angle": "Post-midterm personnel exits and Ukraine policy signals are the early read on how fast the DC regime changes.", "tweetA": "First senior DOJ departure after the midterms. Personnel is policy; watch the next resignation for the real reorganisation.", "tweetB": "Ukraine reading the midterms as a pivot in its favour is a bet on Congress, not the White House. Whether the money and the veto line up is the thing to watch. $RHM $LMT", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-compliance-is-the-payload/"}];
const META = {"date": "2026-11-06", "time": "03:05 CEST", "windowStart": "2026-11-05 21:04 CEST", "windowEnd": "2026-11-06 03:04 CEST", "emailsInWindow": 11, "emailsRead": 11, "itemsExtracted": 30, "includedSources": [{"name": "Stephen Innes / The Dark Side Of The Boom", "items": 4}, {"name": "Daily Chartbook (DC Lite #715)", "items": 5}, {"name": "PA - Global Macro", "items": 2}, {"name": "Trading Mindset & Data (TMAD)", "items": 1}, {"name": "Maggie Lake / The Market House (Michael Every, Rabobank)", "items": 4}, {"name": "Michael Parekh / AI Ramblings Daily", "items": 6}, {"name": "Dwarkesh Patel", "items": 2}, {"name": "This Week in AI", "items": 2}, {"name": "Michael McDonough / The Pressure Point", "items": 4}], "skippedSources": [{"name": "SemiAnalysis", "reason": "Sent 2026-11-05 19:03:45 UTC, ~50 seconds BEFORE the cutoff (19:04:35 UTC) - excluded per hard window rule"}, {"name": "SixSigmaResearch (subscriber chat notification)", "reason": "Automated chat notification; one-line comment on a tough session, no analytical content. Its first message (16:05 UTC) was outside the window"}]};
var COL={macro:"#e24b4a",credit:"#378add",positioning:"#ef9f27","AI/infra":"#1d9e75",crypto:"#7f77dd",geopolitics:"#d85a30",energy:"#f97316",tech:"#06b6d4",gold:"#d4a017",culture:"#ec4899",labor:"#8b5cf6",regulation:"#64748b",science:"#14b8a6",venture:"#84cc16"};
var UE={act:"🔴",deep:"🔵",watch:"🟡"};

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function toggle(id){document.getElementById('c'+id).classList.toggle('open')}
function setC(c){fc=c;fs=null;render()}
function setU(u){fu=u;fs=null;render()}
function filterBySrc(name){fs=name;fc="all";fu="all";render(true)}
function pill(label,active,color,fn){return '<span class="pill" style="'+(active?'background:'+color+';border-color:'+color+';color:#fff':'')+'" onclick="'+fn+'">'+label+'</span>'}
function render(expand){
  var cats=[];ITEMS.forEach(function(i){if(cats.indexOf(i.cat)<0)cats.push(i.cat)});
  var h=pill("All ("+ITEMS.length+")",fc==="all","#333","setC('all')");
  cats.forEach(function(c){var n=ITEMS.filter(function(i){return i.cat===c}).length;h+=pill(c+" ("+n+")",fc===c,COL[c]||"#333","setC('"+c+"')")});
  document.getElementById('cats').innerHTML=h;
  var u=pill("All",fu==="all","#333","setU('all')");
  ["act","deep","watch"].forEach(function(k){var n=ITEMS.filter(function(i){return i.urgency===k}).length;var nm={act:"Act Now",deep:"Deep",watch:"Watch"}[k];u+=pill(UE[k]+" "+nm+" ("+n+")",fu===k,"#333","setU('"+k+"')")});
  document.getElementById('urg').innerHTML=u;
  var out="";
  ITEMS.forEach(function(it){
    if(fc!=="all"&&it.cat!==fc)return;if(fu!=="all"&&it.urgency!==fu)return;
    if(fs&&it.source.indexOf(fs)<0)return;
    var col=COL[it.cat]||"#333";
    out+='<div class="card'+(expand?' open':'')+'" id="c'+it.id+'"><div class="hd" onclick="toggle('+it.id+')"><span class="num">'+it.id+'</span><span>'+UE[it.urgency]+'</span><span class="badge" style="background:'+col+'">'+esc(it.source)+'</span><span class="tag">'+esc(it.cat)+'</span>'+(it.charts.count?'<span>'+(it.charts.hot?'🔥':'📊')+'</span>':'')+'<span class="ttl">'+esc(it.title)+'</span></div>'
    +'<div class="body"><div class="lbl">The Idea</div><div>'+esc(it.idea)+'</div><div class="lbl">My Angle</div><div class="angle" style="border-color:'+col+';background:'+col+'14">'+esc(it.angle)+'</div>'
    +'<div class="tw"><div><div class="lbl" style="color:#378add">TWEET A</div>'+esc(it.tweetA)+'<br><button class="copy-btn" onclick="copyTweet(' + it.id + ',\'a\')">📋 Copy</button></div>'
    +'<div><div class="lbl" style="color:#7f77dd">TWEET B</div>'+esc(it.tweetB)+'<br><button class="copy-btn" onclick="copyTweet(' + it.id + ',\'b\')">📋 Copy</button></div></div>'
    +'<div class="chart'+(it.charts.hot?' hot':'')+'">'+(it.charts.hot?'🔥 CHART WORTH SAVING - ':'')+(it.charts.count?it.charts.count+' chart(s): ':'')+esc(it.charts.desc||'No chart in email')+'</div>'
    +'<p><a href="'+esc(it.link)+'" target="_blank">↗ Read full article</a></p></div></div>';
  });
  document.getElementById('list').innerHTML=out||'<p>No items.</p>';
}
function init(){
  document.getElementById('sub').textContent=META.date+" · "+META.time+" · "+META.itemsExtracted+" items";
  var r='<p><b>Window:</b> '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</p><p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</p><p><b>Included sources</b> (click to filter):</p><ul>';

  r+='</ul><p><b>Skipped:</b></p><ul>';

}
