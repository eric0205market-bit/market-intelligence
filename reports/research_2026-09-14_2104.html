art."}, "link": "https://www.jamesbulltard.com/p/91426-recap"}, {"id": 11, "cat": "positioning", "urgency": "deep", "source": "Robert's Sinn / Eric Coffin (HRA Advisories)", "title": "40-year mining veteran's own book: VR Resources, Talon Metals, Stuve Gold, Perseverance Metals", "idea": "Eric Coffin — co-founder of HRA Advisories, 20 years publishing, picks include Great Bear Resources and Fireweed Metals before they broke out — discloses his own current positions ahead of the Metals Investor Forum: VR Resources, Talon Metals, Stuve Gold, and Perseverance Metals.", "angle": "Coffin's edge historically has been getting in before discovery re-ratings, not after — his current book is a watchlist worth cross-referencing against drill-result calendars, not a buy signal on its own.", "tweetA": "A guy whose picks include Great Bear and Fireweed Metals before they were obvious is currently long VR Resources, Talon Metals, Stuve Gold, and Perseverance Metals. Doesn't mean buy them — means put them on the drill-result calendar.", "tweetB": "The junior miner game is 90% about being early to a discovery, not right about a thesis. Coffin's whole career is built on the first part. Worth noting which names he's actually got money in versus just covering.", "charts": {"count": 0, "hot": false, "desc": "Video interview, no charts in the plaintext preview."}, "link": "https://robertsinn.substack.com/p/40-year-veteran-mining-speculator"}, {"id": 12, "cat": "AI/infra", "urgency": "act now", "source": "WealthVest Macro", "title": "SMH opened down 5% on Dario's essay — against a backdrop of +300% in five years", "idea": "WealthVest points out semiconductor ETF SMH opened down ~5% Monday on the heels of Amodei's 'Pacing the Frontier' essay proposing third-party AI safety evaluators — framed against SMH being up over 50% this year and 300%+ over five years. Consensus view: no real slowdown happens because nobody believes China cooperates.", "angle": "A 5% single-morning move on a sector up 300% in five years is noise unless it's the start of a repricing of the growth assumption itself — the real question is whether 'pacing' becomes a genuine cost or just a headline.", "tweetA": "SMH -5% on a Monday morning after a CEO essay. Against +300% in five years, that's a rounding error — unless this is the first crack in the growth assumption everyone's been pricing as a given.", "tweetB": "The real tell here isn't the price move, it's the timing: 'let's pace the frontier' lands right before the S-1 financials go public. Face-saving and genuine caution aren't mutually exclusive, but the timing isn't nothing.", "charts": {"count": 0, "hot": false, "desc": "No chart; opinion piece."}, "link": "https://wealthvest.substack.com/p/all-angles-of-the-ambiguous-ai-slowdown"}, {"id": 13, "cat": "tech", "urgency": "watch", "source": "This Week in AI", "title": "What actually killed OpenClaw's momentum after its viral 2.0 launch", "idea": "OpenClaw — the agent app that kicked off 'agent-mania' — dropped v2.0 on August 31 to viral fanfare, then imploded within hours. TWIAI's breakdown: OpenAI poached creator Peter Steinberger, Anthropic raised the cost of Claude access, plus security flaws, bugs, and rivals (Nous's Hermes, xAI's Grok Bot, Instinct) shipping their own versions fast.", "angle": "The lesson isn't that OpenClaw was a bad product — it's that being first in agent-mania bought almost no moat once the model providers themselves could squeeze the economics or poach the talent.", "tweetA": "OpenClaw's actual killers, in order: OpenAI hired away its creator, Anthropic raised API prices under it, then three competitors shipped clones. Being first to viral in agents buys you weeks, not a moat.", "tweetB": "The real story here is upstream: if a model provider can just reprice API access and kill your unit economics overnight, 'agent startup' is a business built on someone else's discretion, not a business built on distribution.", "charts": {"count": 0, "hot": false, "desc": "No chart in email; podcast breakdown."}, "link": "https://www.thisweekinai.ai/p/demo-of-the-day-what-went-wrong-with"}, {"id": 14, "cat": "AI/infra", "urgency": "deep", "source": "SemiAnalysis", "title": "Shared datacenter GPUs beat onboard robot chips past 7 robots per GPU", "idea": "SemiAnalysis's TCO model finds the crossover where offloading robot 'brains' to a shared B300 datacenter GPU beats putting a Jetson Thor chip on every robot: 7 robots/GPU on silicon-per-robot, 5 robots/GPU on memory-per-robot. Net of realistic utilization (B300 server ~90%, on-device ~40%), the offload scenario reaches just 46% of the onboard TCO per FLOP for industrial deployments, and ~12% for home deployments.", "angle": "This is the cloud-vs-edge debate from a decade of enterprise IT, replaying in robotics — the winners in humanoid economics will be whoever solves the wireless network problem, not whoever has the best onboard chip.", "tweetA": "SemiAnalysis put a number on robot cloud economics: shared datacenter GPUs get you 46% of the TCO of onboard chips for industrial robots, 12% for home robots. The bottleneck isn't compute anymore, it's whether your WiFi can hold a stable link.", "tweetB": "Everyone's obsessing over which robot has the best onboard silicon. The actual constraint, per this analysis, is networking: sub-100ms jitter, not raw FLOPs, decides whether cloud-offloaded robot brains work at all.", "charts": {"count": 1, "hot": true, "desc": "🔥 CHART WORTH SAVING — TCO sensitivity chart plotting GPU-server utilization vs on-device utilization; the crossover chart alone tells the story."}, "link": "https://newsletter.semianalysis.com/p/a-brain-too-big-to-carry-on-device"}, {"id": 15, "cat": "AI/infra", "urgency": "deep", "source": "SemiAnalysis", "title": "Boston Dynamics splits Atlas's brain across a wireless link to a ~1T-parameter model on Google TPUs", "idea": "Atlas runs System 1 (visuomotor control) onboard a Jetson Thor, but System 2 (the reasoning layer, 48 hours.", "tweetA": "Sunday Robotics assumed cloud inference for their home robot, like everyone does. Two days of real-home testing killed that plan — not bandwidth, WiFi jitter. If home robotics can't trust home WiFi, that's a bigger problem than any model architecture debate.", "tweetB": "Starlink's satellites cross the sky in minutes — meaning any tree or roofline near your house drops the connection on every single pass. That's a real constraint on 'AI robot as a cloud service' nobody in the hype cycle is pricing in.", "charts": {"count": 0, "hot": false, "desc": "In-domain vs out-of-domain success-rate chart described in text — worth opening."}, "link": "https://newsletter.semianalysis.com/p/a-brain-too-big-to-carry-on-device"}, {"id": 17, "cat": "gold", "urgency": "watch", "source": "Robert's Sinn", "title": "Hercules Metals hits a new porphyry center at the Hook target in Idaho", "idea": "First reconnaissance drill hole (HER-26-03) at Hercules Metals' Hook target intersected intense phyllic alteration — geologically consistent with the margins of a new porphyry system — at the edge of a 1.8km chargeability anomaly.", "angle": "Phyllic alteration at a target edge is the classic early tell for a porphyry center underneath; this is a single-hole confirmation, not a resource, but exactly the kind of early-stage signal that re-rates junior miners fastest.", "tweetA": "First hole into Hercules Metals' Hook target found phyllic alteration at the margin of a 1.8km chargeability anomaly — textbook signature of a porphyry system underneath. One hole, but it's the right kind of one hole.", "tweetB": "This is why juniors move 10x on a single press release: the market isn't pricing the metal in the ground yet, it's pricing the probability the geology story is real. Phyllic alteration at the anomaly edge just moved that probability.", "charts": {"count": 0, "hot": false, "desc": "No chart in email; likely has a target map on the article page."}, "link": "https://robertsinn.substack.com/p/hercules-uncovers-a-new-potential"}, {"id": 18, "cat": "positioning", "urgency": "deep", "source": "SixSigmaCapital", "title": "A 30% mega-cap tech, 11.5% cash portfolio going into FOMC week", "idea": "SixSigmaCapital's disclosed current allocation: Mega-Cap Tech 29.9%, Emerging Markets & Cross-Border 17.3%, Biotech & Healthcare 15.2%, AI Infra & Compute 14.8%, Cash 11.5%, Software 7.0%, Industrials 5.8%, Crypto 5.2%, Consumer Brands 2.7%.", "angle": "Nearly 45% combined exposure to mega-cap tech plus AI infra, with only 11.5% cash, is an aggressive stance to carry into a week with both an oil supply shock and an FOMC decision — worth benchmarking your own AI-adjacent exposure against this.", "tweetA": "One prominent portfolio going into FOMC week: 30% mega-cap tech + 15% AI infra = 45% combined AI-adjacent exposure, only 11.5% cash. That's a high-conviction bet that this week's oil shock and Fed decision don't touch the AI trade.", "tweetB": "Cash at 11.5% while oil is spiking and CAPE sits at 41 tells you where risk appetite actually is right now, regardless of what anyone says on TV about being cautious.", "charts": {"count": 1, "hot": false, "desc": "Full portfolio pie-chart breakdown embedded on the article page."}, "link": "https://sixsigmaresearch.com/p/designing-a-high-quality-portfolio"}, {"id": 19, "cat": "crypto", "urgency": "watch", "source": "Unchained Crypto", "title": "Olas has settled 14M agent-to-agent transactions and is giving Claude Code sessions their own wallets", "idea": "Olas (formerly Autonolas) co-founder David Minarsch says the protocol has facilitated over 14 million transactions between AI agents, settling onchain via USDC and xDAI. Its new Connect tool gives a local Claude Code or Codex session its own wallet, and Olas plans to launch on Robinhood in coming weeks with new DeFi products.", "angle": "Giving a coding agent session its own onchain wallet is a small detail with a big implication: agent-to-agent commerce infrastructure is being built well ahead of any obvious mainstream use case, which is usually how the real one sneaks in.", "tweetA": "Olas just gave local Claude Code and Codex sessions their own onchain wallets. 14M agent-to-agent transactions already settled via USDC/xDAI. Nobody's talking about agent-native payment rails, but the infrastructure is already live.", "tweetB": "The Robinhood launch is the tell here — Olas isn't trying to stay crypto-native, it's trying to be the settlement layer under agent commerce before anyone agrees on what agent commerce even looks like.", "charts": {"count": 0, "hot": false, "desc": "Video interview, paywalled beyond the summary."}, "link": "https://unchainedcrypto.beehiiv.com/p/how-olas-is-equipping-newbies-with-self-custodial-prediction-market-trading-agents"}, {"id": 20, "cat": "AI/infra", "urgency": "deep", "source": "McKinsey", "title": "Only 6% of companies are actual AI 'high performers' — despite 60% planning to spend more", "idea": "McKinsey's State of AI research, cited in their agentic-AI cost webinar invite: 60% of respondents expect to increase AI investment next year, but only about 6% qualify as 'AI high performers' — meaningful value plus at least 5% EBIT impact. Token prices are falling but consumption is rising fast as agentic workflows get more complex, making token budgets a real management problem.", "angle": "A 10-to-1 gap between 'spending more' and 'actually getting EBIT impact' is the real AI-ROI story underneath every capex headline — and rising consumption despite falling unit prices means total AI cost is still climbing for most firms.", "tweetA": "60% of companies are raising AI spend. Only 6% can show 5%+ EBIT impact from it. That 10-to-1 gap between spending and results is the actual AI bubble question, not the compute capex headlines.", "tweetB": "Token prices are falling and AI costs are still rising for most companies — because agentic workflows just consume more tokens per task. Cheaper unit economics doesn't mean cheaper total spend if the workload keeps expanding to fill it.", "charts": {"count": 0, "hot": false, "desc": "McKinsey's full State of AI report likely has the high-performer breakdown chart — worth opening."}, "link": "https://email.mckinsey.com/events/managing-the-cost-of-agentic-ai-a-guide-for-business-leaders"}];
const META = {"date": "2026-09-14", "time": "21:04 CEST", "windowStart": "2026-09-14 15:04 CEST", "windowEnd": "2026-09-14 21:04 CEST", "emailsInWindow": 18, "emailsRead": 18, "itemsExtracted": 20, "includedSources": [{"name": "SixSigmaCapital (subscriber chat)", "count": 3}, {"name": "Ecoinometrics", "count": 1}, {"name": "Dark Side of the Boom", "count": 1}, {"name": "Mando Minutes", "count": 4}, {"name": "James Bulltard", "count": 1}, {"name": "Robert's Sinn / Eric Coffin (HRA Advisories)", "count": 1}, {"name": "WealthVest Macro", "count": 1}, {"name": "This Week in AI", "count": 1}, {"name": "SemiAnalysis", "count": 3}, {"name": "Robert's Sinn", "count": 1}, {"name": "SixSigmaCapital", "count": 1}, {"name": "Unchained Crypto", "count": 1}, {"name": "McKinsey", "count": 1}], "skippedSources": [{"name": "The Hermit (hrmt@substack.com)", "reason": "Pure promotional annual-subscription discount push ($100 off, first 5 subscribers) with zero original analytical content"}, {"name": "Ironsides Macroeconomics", "reason": "Email body was only a video link ('Full Trichet') plus legal boilerplate — zero sentences of actual content"}, {"name": "Phil Dauber (midday brief)", "reason": "Plaintext body was just 'TL;DR...' — paywalled with zero preview content"}, {"name": "McKinsey (Brilliant Moves: Coffee with Lloyds CEO Charlie Nunn)", "reason": "Generic executive-profile teaser with no specific data, numbers, or claims — pure promotional framing for a video"}]};
const CAT_COLORS = {"macro": "#e24b4a", "credit": "#378add", "positioning": "#ef9f27", "AI/infra": "#1d9e75", "crypto": "#7f77dd", "geopolitics": "#d85a30", "energy": "#f97316", "tech": "#06b6d4", "gold": "#d4a017", "culture": "#ec4899", "labor": "#8b5cf6", "regulation": "#64748b", "science": "#14b8a6", "venture": "#84cc16"};

let activeCat = 'all';
let activeUrg = 'all';
let activeSrc = null;

const urgencyEmoji = { "act now": "🔴", "deep": "🔵", "watch": "🟡" };

function headerSub() {
  document.getElementById('header-sub').textContent =
    META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources';
}

function matchesFilters(item) {
  if (activeCat !== 'all' && item.cat !== activeCat) return false;
  if (activeUrg !== 'all' && item.urgency !== activeUrg) return false;
  if (activeSrc && item.source.indexOf(activeSrc) === -1) return false;
  return true;
}

function renderCards() {
  const container = document.getElementById('cards');
  container.innerHTML = '';
  ITEMS.forEach(function(item) {
    if (!matchesFilters(item)) return;
    const color = CAT_COLORS[item.cat] || '#999';
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + item.id;
    card.style.setProperty('--cat-color', color);

    const chartFlag = item.charts && (item.charts.count > 0 || item.charts.hot) ? '<span class="chart-flag">' + (item.charts.hot ? '🔥' : '📊') + '</span>' : '';

    const header = document.createElement('div');
    header.className = 'card-header';
    header.innerHTML =
      '<span class="idx">' + String(item.id).padStart(2, '0') + '</span>' +
      '<span>' + (urgencyEmoji[item.urgency] || '') + '</span>' +
      '<span class="badge" style="background:' + color + '">' + item.source + '</span>' +
      '<span class="cat-tag">' + item.cat + '</span>' +
      chartFlag +
      '<span class="title-text">' + item.title + '</span>';
    header.addEventListener('click', function() {
      card.classList.toggle('open');
    });

    const body = document.createElement('div');
    body.className = 'card-body';

    let chartsHtml = '';
    if (item.charts) {
      const hotClass = item.charts.hot ? ' hot' : '';
      const chartLabel = item.charts.hot ? '🔥 CHART WORTH SAVING' : (item.charts.count > 0 ? '📊 ' + item.charts.count + ' chart(s)' : '📊 No chart in email');
      chartsHtml = '<div class="chart-block' + hotClass + '"><strong>' + chartLabel + '</strong><br>' + item.charts.desc + '</div>';
    }

    body.innerHTML =
      '<div class="section-label">The Idea</div>' +
      '<div class="idea-text">' + item.idea + '</div>' +
      '<div class="section-label">My Angle</div>' +
      '<div class="angle-box">' + item.angle + '</div>' +
      '<div class="tweets">' +
        '<div class="tweet-box"><span class="tweet-label-a">TWEET A</span><div class="tweet-text">' + item.tweetA + '</div>' +
          '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>' +
        '<div class="tweet-box"><span class="tweet-label-b">TWEET B</span><div class="tweet-text">' + item.tweetB + '</div>' +
          '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>' +
      '</div>' +
      chartsHtml +
      '<a class="read-link" href="' + item.link + '" target="_blank">↗ Read full article</a>';

    card.appendChild(header);
    card.appendChild(body);
    container.appendChild(card);
  });
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function filterBySrc(name) {
  activeSrc = name;
  activeCat = 'all';
  activeUrg = 'all';
  document.querySelectorAll('.cat-pill').forEach(function(p) { p.classList.toggle('active', p.dataset.cat === 'all'); });
  document.querySelectorAll('.urg-pill').forEach(function(p) { p.classList.toggle('active', p.dataset.urg === 'all'); });
  renderCards();
  document.querySelectorAll('.card').forEach(function(c) { c.classList.add('open'); });
  window.scrollTo({top: 0, behavior: 'smooth'});
}

document.getElementById('cat-filters').addEventListener('click', function(e) {
  if (!e.target.classList.contains('cat-pill')) return;
  activeSrc = null;
  activeCat = e.target.dataset.cat;
  document.querySelectorAll('.cat-pill').forEach(function(p) { p.classList.toggle('active', p === e.target); });
  renderCards();
});

document.getElementById('urg-filters').addEventListener('click', function(e) {
  if (!e.target.classList.contains('urg-pill')) return;
  activeSrc = null;
  activeUrg = e.target.dataset.urg;
  document.querySelectorAll('.urg-pill').forEach(function(p) { p.classList.toggle('active', p === e.target); });
  renderCards();
});

function renderReport() {
  var html = '';
  html += '<p><strong>Time window:</strong> ' + META.windowStart + ' &ndash; ' + META.windowEnd + '</p>';
  html += '<p>' + META.emailsInWindow + ' emails in window, ' + META.emailsRead + ' read, ' + META.itemsExtracted + ' items extracted.</p>';
  html += '<p><strong>Included sources:</strong></p><ul>';
  META.includedSources.forEach(function(s) {
    html += '<li><button class="src-pill" onclick="filterBySrc(\'' + s.name.replace(/'/g, "\\'") + '\')">' + s.name + '</button> (' + s.count + ')</li>';
  });
  html += '</ul>';
  html += '<p><strong>Skipped sources:</strong></p><ul>';
  META.skippedSources.forEach(function(s) {
    html += '<li>' + s.name + ' &mdash; ' + s.reason + '</li>';
  });
  html += '</ul>';
  document.getElementById('report-body').innerHTML = html;
}

headerSub();
renderCards();
renderReport();
</script>
