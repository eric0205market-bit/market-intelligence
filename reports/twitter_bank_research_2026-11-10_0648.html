@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {

}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);

.filter-bar.active { display: flex; }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }

.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }

.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;

.item-card { background: var(--surface); border: 1px solid var(--border);

.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }

.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}

const REPORT_DATA = {"report_type": "TWITTER BANK RESEARCH", "collected_at": "2026-11-10T06:23:38Z", "window_days": 4, "input_stats": {"total_tweets": 120, "considered": 120, "kept": 36, "dropped": 84, "deduped": 0}, "freshness_gate": "FRESHNESS GATE PASSED.", "summary": "Goldman dominates the feed (18 items): CPI forecast, risk appetite, CTA and levered-ETF flows, valuations.\nBofA: systematic positioning and SPX hedger gamma; Citi/Morgan Stanley: post-midterm and regional allocation; Deutsche: Tech overweight.\nRecurring themes: volatility/positioning after the AI-related selloff, US CPI and Fed speakers, oil and inflation expectations.\nPer-bank counts: Goldman 18, BofA 4, JPM 3, Citi 2, Deutsche 2, Morgan Stanley 2, UBS 2, Yardeni 2, Apollo/Slok 1, HSBC 1.", "by_bank_counts": {"Goldman": 18, "BofA": 4, "JPM": 3, "Citi": 2, "Deutsche": 2, "Morgan Stanley": 2, "UBS": 2, "Yardeni": 2, "Apollo/Slok": 1, "HSBC": 1}, "banks": [{"bank": "Goldman", "theme": "Goldman charts — CPI forecast, risk appetite, CTA/ETF flows, momentum, valuations, oil and macro trackers", "items": [{"author": "MikeZaccardi", "text": "Oil down... breakeven inflation rates down GS https://t.co/ITUBMLhynL", "tweet_url": "https://x.com/MikeZaccardi/status/2119939595278205403", "images": ["https://pbs.twimg.com/media/HWuJ0-ZWsAA0Rok.png"], "created_at": "2026-11-09T23:46:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Nasdaq volatility index had the largest weekly swing since March 2020 $QQQ $VXN https://t.co/2ZvPrib9x4", "tweet_url": "https://x.com/MikeZaccardi/status/2119932045669306618", "images": ["https://pbs.twimg.com/media/HWuC9iRXQAAqDgG.png"], "created_at": "2026-11-09T23:16:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS core inflation tracker... rising for the better part of 3 years https://t.co/bXO5KLiK8e", "tweet_url": "https://x.com/MikeZaccardi/status/2119924495502733481", "images": ["https://pbs.twimg.com/media/HWt8GFQXgAAfNgh.png"], "created_at": "2026-11-09T22:46:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Some indicators point to risk-off, but flows are not one of them GS\n\n4wk average hit a record on the latest print https://t.co/EPx6WxKF2q", "tweet_url": "https://x.com/MikeZaccardi/status/2119916945902334201", "images": ["https://pbs.twimg.com/media/HWt1Oo9XMAAqlJV.png"], "created_at": "2026-11-09T22:16:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Momentum's dramatic 2H plunge... GS https://t.co/xmuUOfmtQA", "tweet_url": "https://x.com/MikeZaccardi/status/2119890521552228531", "images": ["https://pbs.twimg.com/media/HWtdMilXwAEWz7m.png"], "created_at": "2026-11-09T20:31:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "The global P/E has fallen to the 21st-century average $ACWI GS\n\n15.2x... a 6.6% earnings yield https://t.co/gRZeYUDimC", "tweet_url": "https://x.com/MikeZaccardi/status/2119888017355682176", "images": ["https://pbs.twimg.com/media/HWta6x-XcAApxpH.png"], "created_at": "2026-11-09T20:21:03.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Goldman's Brent crude oil forecast looking better... $80 out 12 months https://t.co/cknKAnM92G", "tweet_url": "https://x.com/MikeZaccardi/status/2119885488391606430", "images": ["https://pbs.twimg.com/media/HWtYnjtWUAASADE.png"], "created_at": "2026-11-09T20:11:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: levered/inverse ETF AUM just under $140B, down $55B over the past 20 days, and gross exposure down $135B over the same stretch, which should mean less forced buying and selling on big index moves. https://t.co/4FsAR8qs53", "tweet_url": "https://x.com/neilsethinew/status/2119802188285288606", "images": ["https://pbs.twimg.com/media/HWsFSPWXcAAsxu2.jpg"], "created_at": "2026-11-09T14:40:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Europe was up last week, Japan 7.5%... USA in the middle https://t.co/7WsIAItmke", "tweet_url": "https://x.com/MikeZaccardi/status/2119798666282013085", "images": ["https://pbs.twimg.com/media/HWsJp3CXIAAY-R0.png"], "created_at": "2026-11-09T14:26:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "CPI health insurance set to print -2.5% m/m (GS)\n\nyeah.. that 15% jump in 2027 premiums is probably fake... https://t.co/jwB1YGN3RG", "tweet_url": "https://x.com/MikeZaccardi/status/2119797408649355589", "images": ["https://pbs.twimg.com/media/HWsIgnNXAAAPasq.png"], "created_at": "2026-11-09T14:21:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman also sees CTAs selling SPX this week as its base case:\n\nIt expects CTAs to sell $28B of S&P futures over the next week and $45B over the next month in its baseline scenario, “which would take the position to overall net short.”\n\nGoldman’s futures desk says CTA signals are now negative in around 60% of global equity markets at the short- and medium-term horizons, including the S&P 500, where the levels are around 7,685 and 7,550.\n\nThe S&P 500 closed Friday at 7,376.86, below both levels and its 100-DMA (7,619), though Thursday’s low (7,350.35) held just above the 200-DMA (7,325), which the index hasn’t closed below since April 7th.", "tweet_url": "https://x.com/neilsethinew/status/2119797155053339077", "images": ["https://pbs.twimg.com/media/HWsEMJfWAAAXA4E.png"], "created_at": "2026-11-09T14:20:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: We Expect a 0.16% Increase in Core CPI in October\n\nOur CPI Forecast Translates to a Larger Core PCE Increase of +0.23% in October https://t.co/Ea5FX9byXc", "tweet_url": "https://x.com/MikeZaccardi/status/2119794022822654242", "images": ["https://pbs.twimg.com/media/HWsFbjoXEAATv6r.png"], "created_at": "2026-11-09T14:07:33.000Z", "relayers": []}, {"author": "neilsethinew", "text": "After bouncing back last week, Goldman’s Risk Appetite Indicator* fell back to −0.7 from −0.3 the prior week, and the momentum index fell to −1.2 from −0.8, both their lowest since April 2025. Still far from the -1.5 to -2.0 area under which \"signals are most powerful\"\n\nBy component, credit remains the weakest (−2.2), followed by equity volatility (−1.1) and equities (−0.6), while bonds (0.8) and FX & gold (0.5) are still positive.\n\n*”Goldman Sachs Risk Appetite Indicator (RAI) aims to track the level of global market risk appetite and risk aversion based on various market variables. A sharp rise in the index can send a warning signal that investors have more risk appetite and are potentially exposed to a correction if consensus views are tested. Similarly, a sharp decline indicates a reduction in risk appetite, and at extreme levels it can indicate that markets may have overshot. RAI signals are most powerful when the level of risk appetite is very low below -1.5, with levels closer to -2.0 giving the clearest signal over longer time horizons, as at such levels the asymmetry of subsequent medium term equity return becomes very positively skewed. RAI momentum is designed to track short term shifts of market risk appetite, and subcomponents of the RAI.”", "tweet_url": "https://x.com/neilsethinew/status/2119777031605063960", "images": ["https://pbs.twimg.com/media/HWpvFl5WgAAC_sk.jpg"], "created_at": "2026-11-09T13:00:02.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: history is “somewhat encouraging once panic reaches these extremes.” \n\nAfter the prior 15 panic signals above 9.5, the S&P 500 gained an average 4.6% over the next three months (higher 80% of the time) and 9.0% over six months (73%), although “the immediate path has been much less reliable, particularly while still in price discovery mode.”", "tweet_url": "https://x.com/neilsethinew/status/2119771988939899165", "images": ["https://pbs.twimg.com/media/HWpsvBjW8AAuC2j.jpg"], "created_at": "2026-11-09T12:40:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "USA does the AI-spending heavy lifting GS ... Europe, not so much https://t.co/QKo7n1jyNm", "tweet_url": "https://x.com/MikeZaccardi/status/2119769737756328311", "images": ["https://pbs.twimg.com/media/HWrvWAhXUAAZIrq.png"], "created_at": "2026-11-09T12:31:03.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Bowman, Goolsbee, Barkin on the tape today. Waller tomorrow before CPI\n\nThe Logan, Schmid, Bowman, Paulson, Bowman (third time) GS https://t.co/TAfvb5QM5u", "tweet_url": "https://x.com/MikeZaccardi/status/2119767838072115667", "images": ["https://pbs.twimg.com/media/HWrtnaNXYAA8pj2.png"], "created_at": "2026-11-09T12:23:30.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"Global music industry revenues are expected to reach approximately $200 billion annually by 2035 ... Goldman Sachs Research expects revenues to increase at a compound rate of 5.8% per year between 2025-2035.\"\n\n-Goldman Sachs https://t.co/Efrn6SF4kj", "tweet_url": "https://x.com/dailychartbook/status/2119762037882445861", "images": ["https://pbs.twimg.com/media/HWroVyDWUAA8100.png"], "created_at": "2026-11-09T12:00:27.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Goldman’s estimate of underlying trend job growth rose to 124,000... the highest in almost 2 years https://t.co/Cs0zQIZwJu", "tweet_url": "https://x.com/MikeZaccardi/status/2119756583441748228", "images": ["https://pbs.twimg.com/media/HWrjYVQXsAAUgZd.png"], "created_at": "2026-11-09T11:38:47.000Z", "relayers": []}]}, {"bank": "BofA", "theme": "BofA — systematic positioning, SPX hedger gamma, Nvidia probe headline, Day Ahead", "items": [{"author": "MikeZaccardi", "text": "Bloomberg: Nvidia faces an unprecedented crisis as its board launches an independent probe into whether a foreign intelligence agency targeted CEO Jensen Huang. $NVDA\n\nThe investigation comes amidst rising US scrutiny over Nvidia's ties to Singapore-based Megaspeed. https://t.co/NkokqzJdgT", "tweet_url": "https://x.com/MikeZaccardi/status/2119780309675770101", "images": ["https://pbs.twimg.com/media/HWr49QlXkAEFsRu.png"], "created_at": "2026-11-09T13:13:04.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BofA estimates global systematic positioning fell to ~$225B, its lowest since April, from ~$290B last week and ~$365B a month ago, as the volatility spike also forced vol control funds to de-risk. \n\nIn terms of CTAs, BofA no longer lists a sell trigger for the S&P 500 (from ~−0.1% last week), as Thursday’s post-election reversal likely took CTAs’ remaining US equity longs to flat. No triggers were listed for the Nasdaq-100 either, while the Russell 2000’s buy trigger is now +5.4% away (from +1.8%).\n\nPositively, though, BofA is not looking for more selling from the systematic community in their base case with vol-control reloading offsetting more CTA selling:\n\n• They see roughly no net change in a flat market (from −$15B of selling last week), as vol control adding ~$12B about offsets CTA selling of about $13B.\n\n• +$11B of buying in an “up” market (BofA’s high-percentile path, roughly +4.1% for S&P 500 futures over five days this week; from +$37B last week), as CTA buying (~$16B) outweighs risk-parity selling (~$7B).\n\n• −$37B of selling in a “down” market (BofA’s low-percentile path, roughly −5.2% for S&P futures this week; from −$63B last week), almost all from CTAs (~$34B), with Europe and Asia leading. That’s the smallest down-market estimate in eight weeks, though, showing the impact of the cleaner positioning.", "tweet_url": "https://x.com/neilsethinew/status/2119761935914917971", "images": ["https://pbs.twimg.com/media/HWpuKS_XcAAXoCg.jpg"], "created_at": "2026-11-09T12:00:03.000Z", "relayers": []}, {"author": "neilsethinew", "text": "The Day Ahead - A quiet start to the week\n\nIn US economic data, Monday brings us final September wholesale inventories and the NY Fed’s October Survey of Consumer Expectations.\n\nFed speakers include Fed Vice Chair for Supervision Bowman, Chicago Fed President Goolsbee (2027 voter) and Richmond Fed President Barkin (2027 voter).\n\nNon-Bill (>1yr in maturity) US Treasury auctions bring us a $58B 3-year note sale at 1:00pm ET.\n\nSeven S&P 500 components report, none of them with market caps over $100B:\n-Before the open: KKR ($KKR), Constellation Energy ($CEG), Ferguson ($FERG) and NRG Energy ($NRG).\n-After the close: Occidental Petroleum ($OXY) and Take-Two ($TTWO).\n-Time not announced: Skydance ($SKYD).\n-Outside the S&P 500 we’ll hear from Orix ($IX), Credicorp ($BAP), Rocket Lab ($RKLB) and AST SpaceMobile ($ASTS).\n\nEx-US highlights China’s October CPI and PPI and the BoJ’s Summary of Opinions from its October meeting (both Sunday evening ET), followed Monday morning by Japan’s September leading index, Germany’s September trade balance, Taiwan’s October exports and Mexico’s October CPI. \n\nThe Eurogroup and ECOFIN meetings in Brussels could bring a recommendation on successors to ECB President Lagarde and board member Schnabel. G7 foreign ministers meet in France through Tuesday, and the BoE’s Bailey and the ECB’s Cipollone speak.", "tweet_url": "https://x.com/neilsethinew/status/2119746840266453023", "images": ["https://pbs.twimg.com/media/HWpUYMRWwAAJmHd.jpg"], "created_at": "2026-11-09T11:00:04.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BofA says SPX hedger gamma fell precipitously last week and turned negative, ending Thursday at −$4.9B, its lowest reading of the past year and down from $7.1B a week earlier. BofA had flagged this possibility last week.\n\nThursday’s profile shows gamma negative across the whole range BofA charts (6,600–8,100), so market makers amplify moves in either direction, and there’s no nearby level where that flips back.", "tweet_url": "https://x.com/neilsethinew/status/2119739276896153601", "images": ["https://pbs.twimg.com/media/HWpupKdWwAAQ5j1.jpg"], "created_at": "2026-11-09T10:30:01.000Z", "relayers": []}]}, {"bank": "JPM", "theme": "JPM — staying invested, market reversals, bounce view", "items": [{"autho // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
