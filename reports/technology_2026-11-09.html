anced-package EMI shielding, backside metallization for AI/HPC chips, and copper seed layers. Claims include >99% less power and water than sputtering, up to 100% sidewall coverage vs ~40% for PVD, up to 50% lower cost per package (Savansys modeling), and a Merck KGaA partnership on backside metallization.", "themes": [{"theme": "Additive metallization vs PVD and plating", "insights": [{"claim": "Electroninks argues advanced-package metal is today typically deposited by electroless plating or physical vapor deposition, which require large equipment, significant floor space and demanding process chemistry, whereas its MOD inks cure at low temperature in ambient environments without vacuum equipment.", "speaker": "Daniel Nenni", "type": "thesis", "entities": ["Electroninks", "PVD"], "conviction": "medium", "so_what": "An additive, vacuum-free metallization route could threaten demand for PVD/sputter tools in back-end packaging.", "quote": "Today that metal is typically deposited by electroless plating or physical vapor deposition, which bring large equipment, significant floor space and demanding process chemistry.", "locator": "Every advanced package needs metal", "quote_verified": true}, {"claim": "For EMI shielding, Electroninks claims its spray process uses more than 99 percent less power and water than sputtering, and eight spray coaters fit in the floor space of one PVD system.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["Electroninks", "PVD"], "conviction": "medium", "so_what": "Large energy, water and footprint savings could appeal to OSATs facing capex and sustainability pressure.", "quote": "our spray process uses more than 99 percent less power and water than sputtering, and eight spray coaters fit in the floor space of one PVD system", "locator": "When most advanced thin film metals", "quote_verified": true}, {"claim": "Because sputtering is line-of-sight and Electroninks' process is not, it claims up to 100 percent package sidewall coverage versus about 40 percent for PVD, and third-party modeling by Savansys indicates up to 50 percent lower cost per package.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["Electroninks", "Savansys", "PVD"], "conviction": "medium", "so_what": "A claimed 50% cost-per-package reduction in EMI shielding is a meaningful lever for packaging cost structures.", "quote": "Third-party modeling by Savansys indicates up to 50 percent lower cost per package.", "locator": "Sputtering is a line-of-sight process.", "quote_verified": true}, {"claim": "Electroninks' EI-1207 silver ink cures at 160°C and its recon-free process coats sidewalls well enough to remove the dicing and reconstitution steps sputtered films normally require, with reported shielding of 60 dB at 1.2 micrometers and 80 dB at 3 micrometers across 1 to 40 GHz.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["Electroninks", "EI-1207"], "conviction": "medium", "so_what": "Eliminating process steps simplifies packaging flows and could lower OSAT cycle time and cost.", "quote": "We have reported shielding of 60 dB at 1.2 micrometers and 80 dB at 3 micrometers across 1 to 40 GHz.", "locator": "In EMI shielding, our EI-1207 silver ink", "quote_verified": true}, {"claim": "Electroninks' inks can be applied with existing spray, screen, inkjet and spin-coating equipment, so they plug into infrastructure customers already have, with high material utilization since silver ends up on the product.", "speaker": "Daniel Nenni", "type": "thesis", "entities": ["Electroninks"], "conviction": "medium", "so_what": "Drop-in compatibility lowers adoption barriers versus processes needing new capital equipment.", "quote": "the silver ends up on the product, not lost in the process", "locator": "Our inks can be applied with existing", "quote_verified": true}, {"claim": "Electroninks acknowledges silver can discolor under heat or humidity testing, but says the change is cosmetic, does not affect conductivity or shielding, and can be addressed through chemistry changes or an overcoat.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["Electroninks"], "conviction": "medium", "so_what": "Flags a known qualification hurdle for silver ink adoption that buyers will scrutinize.", "quote": null, "locator": "In EMI shielding, our EI-1207 silver ink", "quote_verified": false}]}, {"theme": "Thermal and backside metallization for AI chips", "insights": [{"claim": "Heat dissipation is now a design constraint for AI and high-performance computing chips, and conventional sputtering and plating for backside metallization raise cost, equipment, panel-scaling and environmental issues.", "speaker": "Daniel Nenni", "type": "causal", "entities": ["Electroninks"], "conviction": "medium", "so_what": "AI chip thermal demands create a new materials opportunity in backside metallization for packaging suppliers.", "quote": "backside metallization for AI and high-performance computing chips, where heat dissipation is now a design constraint", "locator": "The same logic applies to backside", "quote_verified": true}, {"claim": "Electroninks is working with Merck KGaA on backside metallization, where a spin-coated MOD layer bonds reliably with thermal interface materials and can replace multilayer metal stacks; the technology is being commercialized at customer sites globally and the companies plan to market it jointly in the US and Asia Pacific.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["Electroninks", "Merck KGaA"], "conviction": "medium", "so_what": "A Merck KGaA partnership gives a small materials startup channel reach into AI-chip thermal packaging.", "quote": "A spin-coated MOD layer bonds reliably with thermal interface materials and can replace multilayer metal stacks", "locator": "In thermal management, we are working", "quote_verified": true}]}, {"theme": "Copper MOD and roadmap", "insights": [{"claim": "Electroninks launched a copper MOD ink in September 2024 for seed layers, and in June 2026 introduced an air-curable version that cures in open air at about 150°C in 5 to 10 minutes without inert gas or vacuum, positioned as a lower-cost alternative to silver and gold for large-area metallization.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["Electroninks"], "conviction": "medium", "so_what": "Air-curable copper could displace costlier precious-metal inks and suits panel-level packaging scale-up.", "quote": "It cures in open air at about 150 degrees Celsius in 5 to 10 minutes, without inert gas, vacuum equipment or specialty tooling.", "locator": "In June 2026 we introduced", "quote_verified": true}, {"claim": "Electroninks intends its copper MOD ink to displace electroless copper plating and PVD tie layers in seed layers for fine-line metallization and redistribution layers.", "speaker": "Daniel Nenni", "type": "prediction", "entities": ["Electroninks", "PVD"], "conviction": "medium", "so_what": "RDL seed-layer substitution would extend the threat to incumbent plating chemistry and PVD tooling in advanced packaging.", "quote": null, "locator": "We also see opportunities in seed layers", "quote_verified": false}, {"claim": "Electroninks is using AI-guided research with Citrine Informatics to improve its particle-free silver ink for aerosol jet printing and plans to extend the approach to gold and copper inks.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["Electroninks", "Citrine Informatics"], "conviction": "low", "so_what": "An example of AI-accelerated materials development in the semiconductor supply chain.", "quote": null, "locator": "We are also using AI-guided research", "quote_verified": false}]}, {"theme": "Defense and regional channels", "insights": [{"claim": "Electroninks was selected in July 2026 for an AFWERX SBIR contract to advance its CircuitJet on-demand PCB manufacturing platform, following a 2021 Phase II SBIR with the Air Force Rapid Sustainment Office, a // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
