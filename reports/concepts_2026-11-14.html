es": ["Macrocycles", "GLP-1", "Unnatural Products"], "conviction": "medium", "so_what": "Oral biologic-like drugs could expand addressable markets for injectable franchises; macrocycle platforms are the enabling modality.", "quote": "The promise is the precision of a biologic in a pill that can slip inside cells to hit targets antibodies can't reach.", "locator": "Real bad time to be a disease", "quote_verified": true}, {"claim": "Argenx and Unnatural Products have partnered since last year on an oral pill against FcRn, the same target as argenx's Vyvgart, which did $1.72 billion in sales last quarter; argenx was already an investor and UNP's Santa Cruz team will become argenx's peptide discovery hub.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["argenx", "Unnatural Products", "FcRn", "Vyvgart"], "conviction": "high", "so_what": "An oral FcRn drug could extend and defend Vyvgart's franchise; the deal is lifecycle management for argenx's core asset.", "quote": null, "locator": "argenx and UNP have been partners", "quote_verified": false}]}, {"theme": "Robotic welding and the industrial labor bottleneck", "insights": [{"claim": "Skilled welders are scarce and highly valuable — top 'golden gloves' welders can earn about $1 million a year — and shipbuilding expansions like Anduril's $3.7 billion Arsenal-2 shipyard will require many more welders than exist.", "speaker": "Packy McCormick", "type": "causal", "entities": ["Anduril", "Arsenal-2", "SpaceX"], "conviction": "medium", "so_what": "Skilled-trade scarcity is a binding constraint on US reindustrialization and shipbuilding, creating demand for automation.", "quote": null, "locator": "(2) Path Robotics Raises $300M", "quote_verified": false}, {"claim": "Path Robotics' Obsidian model differs from conventional welding robots that repeat programmed paths: it inspects each actual joint, plans a custom weld and adjusts in real time, aiming to match top human welders on variable parts.", "speaker": "Packy McCormick", "type": "framework", "entities": ["Path Robotics", "Obsidian"], "conviction": "medium", "so_what": "Perception-driven adaptive robotics unlocks tasks that classic industrial automation could not handle.", "quote": null, "locator": "Path Robotics, which brothers Andy and Alex", "quote_verified": false}, {"claim": "Path Robotics raised a $300 million Series E led by Georgian at a $2.45 billion valuation, with revenue up 17x in 18 months and customers including Lockheed Martin, Saronic and HII, with which it signed a $600 million deal earlier this year.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Path Robotics", "Georgian", "Lockheed Martin", "Saronic", "HII"], "conviction": "high", "so_what": "Defense/shipbuilding demand is driving hypergrowth in industrial robotics; watch defense primes as anchor customers.", "quote": "Its revenue is up 17x in 18 months", "locator": "On Tuesday, Path announced a $300 million", "quote_verified": true}, {"claim": "Path Robotics also offers Rove, a welding-enabled Boston Dynamics quadruped with 50 preorders, slated for shipyards and construction sites next year.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Path Robotics", "Rove", "Boston Dynamics"], "conviction": "medium", "so_what": "Mobile robots extend automated welding to unstructured field sites beyond the factory floor.", "quote": null, "locator": "They also make a robot dog that welds", "quote_verified": false}]}, {"theme": "SpaceX vertical integration and space-solar ambition", "insights": [{"claim": "SpaceX signed a contract with German equipment maker SINGULUS for a turnkey heterojunction (HJT) solar cell production line worth a little over €60 million, delivering in 1H 2027 to its Bastrop, Texas satellite factory, with plans to scale to more than 100 GW of production equipment.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["SpaceX", "SINGULUS", "HJT", "Bastrop", "Starmind"], "conviction": "high", "so_what": "Watch SINGULUS and HJT equipment suppliers for follow-on orders; SpaceX entering solar cell manufacturing at scale.", "quote": null, "locator": "(3) SpaceX Orders 100 GW/Year", "quote_verified": false}, {"claim": "100 GW per year of solar cells would supply roughly 475,000 Starmind satellites (each with a 75-meter wingspan and 210 kW array) annually, versus about 15,000 active satellites in orbit today — a number the author calls preposterous.", "speaker": "Packy McCormick", "type": "contrarian", "entities": ["Starmind", "SpaceX"], "conviction": "medium", "so_what": "Treat headline capacity targets skeptically; actual committed spend is ~€60M.", "quote": "That, to be clear, is a preposterous number.", "locator": "That, to be clear, is a preposterous number", "quote_verified": true}, {"claim": "The author argues the €60 million SINGULUS commitment's announcement was likely worth far more than €60 million to SpaceX's (SPCX) market cap by making Starmind look serious, and that promising 475,000 space data centers a year is the kind of claim taken seriously in a bubble.", "speaker": "Packy McCormick", "type": "contrarian", "entities": ["SpaceX", "SPCX", "Starmind", "SINGULUS"], "conviction": "medium", "so_what": "Signal of bubble-like dynamics in AI/space valuations: announcements outpacing committed capital.", "quote": "A promise to build 475,000 space data centers a year is also exactly the kind of thing you’d expect to hear - and for people to take at least somewhat seriously - if we were in a bubble.", "locator": "On the other hand, as it stands", "quote_verified": true}, {"claim": "Elon Musk's strategy is full vertical integration — Starmind space data centers launched on Starship, possibly with Terafab chips, currently in partnership with Nvidia, powered by solar — and even if the space plans fall short, extra SpaceX solar capacity would yield cheaper clean energy for consumers.", "speaker": "Packy McCormick", "type": "thesis", "entities": ["Elon Musk", "SpaceX", "Starmind", "Starship", "Terafab", "Nvidia", "SpaceXAI"], "conviction": "medium", "so_what": "Vertical integration across launch, compute and power is SpaceX's moat thesis; downside case still adds solar supply.", "quote": null, "locator": "(3) SpaceX Orders 100 GW/Year", "quote_verified": false}]}, {"theme": "Psychedelics and brain aging", "insights": [{"claim": "A study in Aging Cell by Aurora Savino, Francesco Iorio and colleagues mapped age-related gene-expression drift across 3,086 human prefrontal cortex samples (ages two days to 106 years) and found LSD opposed the aging signature in rats and mice more strongly than exercise or an enriched environment, outranking all 193 drugs in a reference database.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["LSD", "Aging Cell", "Aurora Savino", "Francesco Iorio"], "conviction": "exploratory", "so_what": "Early preclinical signal for psychedelics as neurodegeneration/longevity therapeutics; watch psychedelic biotech pipelines.", "quote": null, "locator": "Now, in a new study in Aging Cell", "quote_verified": false}, {"claim": "In the same research, MDMA and alcohol pushed brain gene expression toward an older profile, while LSD repaired amyloid-β-damaged mouse neurons in a dish, restoring branches and synaptic proteins; the author stresses rodent results do not guarantee human efficacy.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["LSD", "MDMA", "amyloid-β", "Alzheimer's"], "conviction": "exploratory", "so_what": "Alzheimer's-relevant mechanism data is early but could fuel interest in psychedelic-based CNS drug development.", "quote": null, "locator": "MDMA and alcohol had the opposite effect", "quote_verified": false}]}, {"theme": "Voyager 1 milestone", "insights": [{"claim": "Voyager 1, launched in 1977, will pass one light-day from Earth 49 years into its journey — the farthest any human-made object has traveled — yet that is only about one 34-trillionth of the way across the 93-billion-light-year observable universe.", "speaker": "Packy McCormick", "type": "anecdote", "entities": ["Voyager 1", "NASA"], "conviction": "high", "so_what": "Low investor relevance; underscores long-duration engineering durability and the scale of space ambitions.", "quote": null, "locator": "(4) Voyager 1 Will Reach One Light-Day", "quote_verified": false}]}], "insight_total": 19, "top_entities": ["AlphaGenome 2", "Google DeepMind", "Nvidia", "Jensen Huang", "argenx", "Unnatural Products", "Vyvgart", "Path Robotics", "SpaceX", "SINGULUS", "Starmind", "LSD"], "source_meta": {"author": "Packy McCormick", "word_count": 2605, "paywalled": false}}, {"record_id": "5ecdd2424175e7fd", "source_type": "concepts", "source_name": "Peterson Institute (PIIE)", "source_url": "https://www.piie.com/blogs/realtime-economics/2026/how-congress-might-take-back-its-trade-powers-and-limit-trumps", "title": "How Congress might take back its trade powers and limit Trump's tariffs", "published_date": "2026-11-13", "language": "en", "processed_at": "2026-11-14T00:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Geopolitics", "Society"], "gist": "After Democrats won both chambers in the November 2026 midterms, PIIE's Inu Manak argues Congress should reclaim delegated trade authority by closing loopholes in Section 232 and Section 301, through approval/disapproval resolutions, narrower executive discretion, transparency and scope limits. She expects veto-proof majorities only for Canada-specific relief, so comprehensive reform is unlikely before the next president, and tariff uncertainty will persist.", "themes": [{"theme": "Midterm backlash creates a tariff-reform mandate", "insights": [{"claim": "The president's party suffered a stunning defeat in the November 2026 US midterm elections, which the author reads as voters rejecting unpopular policies including immigration enforcement, the war in Iran, and tariffs.", "speaker": "Inu Manak", "type": "thesis", "entities": ["Donald Trump", "US Congress", "Iran"], "conviction": "high", "so_what": "The political cost of tariffs is now explicit, which raises the odds of tariff rollback pressure in 2027.", "quote": "the accumulation of unpopular policies—including immigration enforcement, the war in Iran, and tariffs—was thoroughly rebuked", "locator": "Americans are unhappy with the direction", "quote_verified": true}, {"claim": "An NBC News exit poll from 45 states in the 2026 midterms found 66 percent of voters thought President Trump's tariffs had hurt the US economy.", "speaker": "Inu Manak", "type": "data_point", "entities": ["NBC News", "Donald Trump"], "conviction": "high", "so_what": "Broad anti-tariff sentiment gives legislators political cover to vote against tariffs, even members of the president's party.", "quote": "66 percent of voters thought President Donald Trump's tariffs had hurt the national economy", "locator": "Congress may want to start with trade policy", "quote_verified": true}, {"claim": "Democrats will control both the House and Senate from January 2027 after spending billions of dollars on TV ads that portrayed tariffs negatively, and voters are likely to expect them to claw back tariffs as a way to lower consumer costs.", "speaker": "Inu Manak", "type": "causal", "entities": ["Democrats", "House", "Senate"], "conviction": "medium", "so_what": "Tariff rollback is being framed as an affordability policy, so watch for votes tied to consumer-price relief.", "quote": null, "locator": "This Time Is Different", "quote_verified": false}, {"claim": "House Minority Leader Hakeem Jeffries, on track to become House Speaker in January 2027, has said rolling back Trump's tariffs will be a top Democratic priority but has not said which tariffs or trade statutes will be targeted.", "speaker": "Inu Manak", "type": "data_point", "entities": ["Hakeem Jeffries", "Democrats"], "conviction": "high", "so_what": "Which statutes are targeted is the key open question; watch Jeffries' agenda for specifics.", "quote": null, "locator": "House Minority Leader Hakeem Jeffries", "quote_verified": false}]}, {"theme": "Sections 232 and 301 are the core tariff loopholes", "insights": [{"claim": "Section 232 of the Trade Expansion Act of 1962 (national security sectoral tariffs) and Section 301 of the Trade Act of 1974 (which props up baseline tariffs of 10-12 percent on nearly all US imports) are the two statutes the president uses to avoid accountability on tariffs.", "speaker": "Inu Manak", "type": "framework", "entities": ["Section 232", "Section 301", "Trade Expansion Act of 1962", "Trade Act of 1974"], "conviction": "high", "so_what": "Durable tariff relief requires changes to these two statutes; rollbacks elsewhere leave the bulk of the tariff wall in place.", "quote": "Section 301 of the Trade Act of 1974, which is propping up baseline tariffs of 10-12 percent on nearly all US imports", "locator": "We've Been Here Before", "quote_verified": true}, {"claim": "Tariffs under Section 122 of the Trade Act of 1974 (balance of payments, struck down by the US Court of International Trade but on appeal) and Section 338 of the Tariff Act of 1930 (used against Canada, also under court challenge) are low-hanging fruit for Congress, but repealing them would not reclaim the core delegated trade powers.", "speaker": "Inu Manak", "type": "thesis", "entities": ["Section 122", "Section 338", "US Court of International Trade", "Canada"], "conviction": "high", "so_what": "Court rulings or easy repeals of Section 122/338 tariffs should not be read as an end to the trade war; the sectoral and baseline tariffs remain.", "quote": "tackling these measures will not go far enough in reclaiming trade authorities that Congress has delegated to the president", "locator": "There may be some \"low-hanging fruit,\"", "quote_verified": true}, {"claim": "For Canada, Section 338 tariffs are less economically significant than the Section 232 sectoral tariffs, and US-Canada negotiations over the Section 232 tariffs broke down in August 2026.", "speaker": "Inu Manak", "type": "data_point", "entities": ["Canada", "Section 338", "Section 232"], "conviction": "high", "so_what": "Canadian trade exposure depends on Section 232 sectoral relief, not on the Section 338 court case.", "quote": null, "locator": "Section 338 is also being challenged", "quote_verified": false}, {"claim": "Only comprehensive reform of Section 232 and Section 301, the two statutes that have kept trade wars going since 2018, would meaningfully reduce the uncertainty in US economic relations; anything less will do little.", "speaker": "Inu Manak", "type": "causal", "entities": ["Section 232", "Section 301"], "conviction": "high", "so_what": "Expect trade-policy uncertainty premia to persist unless core-statute reform passes, which the author thinks is unlikely this Congress.", "quote": "Anything less will do little to reduce the uncertainty that has plagued US economic relations", "locator": "Section 338 is also being challenged", "quote_verified": true}]}, {"theme": "Reform toolkit: votes, discretion, transparency, scope", "insights": [{"claim": "A joint resolution of approval, which requires Congress to vote on a tariff before it takes effect, is a stronger check than a disapproval resolution, which forces Congress to repeal tariffs after the fact and is politically harder for the president's party.", "speaker": "Inu Manak", "type": "framework", "entities": ["US Congress", "Section 232"], "conviction": "high", "so_what": "Whether a bill uses an approval or a disapproval mechanism decides whether it actually constrains future tariffs.", "quote": null, "locator": "The second, and more robust, option", "quote_verified": false}, {"claim": "The 2025 Trade Review Act by Senators Maria Cantwell and Chuck Grassley would cap new or increased tariffs at 60 days unless Congress passes a joint resolution of approval, and would let Congress end tariffs at any time by disapproval resolution; like other such bills, it would face a presidential veto that needs two-thirds of both houses to override.", "speaker": "Inu Manak", "type": "data_point", "entities": ["Trade Review Act", "Maria Cantwell", "Chuck Grassley"], "conviction": "high", "so_what": "This bipartisan bill is the most likely template for reform; follow its cosponsors and vote counts.", "quote": null, "locator": "A 2025 bill", "quote_verified": false}, {"claim": "Congress could narrow presidential discretion by moving Section 232 national-security investigations from the Secretary of Commerce to the Department of Defense, and Section 301 investigations from the politically appointed USTR to an independent agency such as the US International Trade Commission.", "speaker": "Inu Manak", "type": "framework", "entities": ["Department of Defense", "USTR", "USITC", "Section 232", "Section 301"], "conviction": "medium", "so_what": "Moving investigations to agencies outside the president's control would make new sectoral tariffs harder to justify and easier to predict.", "quote": null, "locator": "Another way to limit executive abuse", "quote_verified": false}, {"claim": "The second Trump administration has not published the Section 232 reports from the Commerce Secretary that underlie its tariff decisions, unlike the first-term autos report, which the Biden administration released. Requiring disclosure and stronger judicial review would make these tariffs easier to challenge.", "speaker": "Inu Manak", "type": "causal", "entities": ["Section 232", "Secretary of Commerce", "Biden administration"], "conviction": "medium", "so_what": "Stronger judicial review would expose sectoral tariffs to court challenges that national-security deference now blocks.", "quote": "In the second Trump administration, these reports have not been made public", "locator": "In addition to building backstops", "quote_verified": true}, {"claim": "Tariff exclusions are granted opaquely: a 2023 GAO review found problems in the Section 232 exclusions process, including unneeded exclusions, and hundreds of products were exempted from Section 301 tariffs in the first Trump term through an opaque process even though the statute has no exclusion mechanism.", "speaker": "Inu Manak", "type": "data_point", "entities": ["Government Accountability Office", "Section 232", "Section 301"], "conviction": "high", "so_what": "Exclusion rules decide which companies and sectors are exposed to tariffs; reform could formalize carve-outs for consumer products, energy, or trade-agreement partners.", "quote": null, "locator": "How and why certain products are excluded", "quote_verified": false}, {"claim": "Congress could define national security narrowly, as the Toomey-Warner bill did, and exclude products with no obvious security use, such as kitchen cabinets or groceries, as well as defense-industrial-base countries and security allies, from national-security tariffs.", "speaker": "Inu Manak", "type": "framework", "entities": ["Pat Toomey", "Mark Warner", "Section 232"], "conviction": "medium", "so_what": "Scope limits would remove the legal basis for sectoral tariffs on consumer goods such as cabinets and groceries.", "quote": "the protection of the United States from foreign aggression; and does not otherwise include the protection of the general welfare of the United States", "locator": "Finally, Congress will need to weigh", "quote_verified": true}, {"claim": "Section 301 was designed as an investigation-driven tool to give the president leverage to lower foreign trade barriers in negotiations with a single country, not to raise US barriers, and Alan Wolff, the author of the original statute, has been skeptical of its use for tariffs aimed at forced labor.", "speaker": "Inu Manak", "type": "contrarian", "entities": ["Section 301", "Alan Wolff"], "conviction": "high", "so_what": "The gap between what Section 301 was meant to do and how it is used now gives reformers a strong argument and may weaken the legal case for the baseline tariffs.", "quote": "Today, its application is far removed from that intent.", "locator": "Such reforms should entail serious reflection", "quote_verified": true}]}, {"theme": "Allies, Canada and limits of exemptions", "insights": [{"claim": "Trump's second-term trade war has targeted allies and adversaries alike, including Canada and free trade agreement partner South Korea, and Canadians are now more likely to see the US as an enemy or potential threat than as a friend.", "speaker": "Inu Manak", "type": "causal", "entities": ["Canada", "South Korea", "Donald Trump"], "conviction": "high", "so_what": "Damage to alliances may outlast tariff relief and weigh on cross-border investment and cooperation.", "quote": null, "locator": "Ending Trump's second-term trade war", "quote_verified": false}, {"claim": "Senator Christopher Coons' 2025 bill would limit tariffs on NATO members, major non-NATO allies and US FTA partners, but allies may need more than targeted exemptions to trust the US again after Congress-approved FTAs and multilateral rules were violated, and Congress may keep some ally tariffs as leverage for concessions.", "speaker": "Inu Manak", "type": "thesis", "entities": ["Christopher Coons", "NATO", "South Korea"], "conviction": "medium", "so_what": "Do not expect blanket relief for allies; partial exemptions with leverage retained are more likely.", "quote": "allies may need more than targeted tariff exemptions to restore trust in the US", "locator": "Furthermore, Trump's second-term trade war", "quote_verified": true}]}, {"theme": "Veto math and outlook for 2027-28", "insights": [{"claim": "A veto-proof majority may exist for Canada-specific tariff relief but probably not for broader tariff reform, so the incoming Congress is unlikely to achieve comprehensive reform because of internal party pressure and lobbying for continued protection.", "speaker": "Inu Manak", "type": "prediction", "entities": ["Canada", "US Congress"], "conviction": "medium", "so_what": "Canada-specific relief is the most plausible legislative tariff change in 2027-28; the broad baseline and sectoral tariffs probably stay.", "quote": "That may exist for Canada-specific tariff relief but not for broader efforts.", "locator": "Of course, for any legislative action", "quote_verified": true}, {"claim": "Congress may hold tariff votes even if the bills are unlikely to pass, to put members on record before the next election and to lay groundwork for the next president and Congress to restore checks and balances on trade.", "speaker": "Inu Manak", "type": "prediction", "entities": ["US Congress", "James Madison"], "conviction": "medium", "so_what": "Tariff votes in 2027-28 will signal where each member stands and shape the 2028 trade agenda more than they change tariffs.", "quote": null, "locator": "Of course, for any legislative action", "quote_verified": false}]}], "insight_total": 19, "top_entities": ["Section 232", "Section 301", "Canada", "Hakeem Jeffries", "Trade Review Act", "USITC", "Section 338", "Section 122", "Christopher Coons", "Department of Defense", "NBC News", "Alan Wolff"], "source_meta": {"author": "Inu Manak", "word_count": 2100, "paywalled": false}}, {"record_id": "aed4588327b84d65", "source_type": "concepts", "source_name": "World Economic Forum", "source_url": "https://www.weforum.org/publications/top-10-emerging-technologies-for-planetary-health-energy-edition", "title": "Emerging Energy Technologies: Top 10 for Planetary Health | World Economic Forum", "published_date": "2026-11-13", "language": "en", "processed_at": "2026-11-14T11:10:55Z", "processor": "claude-code-sub-opus", "tags": ["Energy", "Tech", "Society"], "gist": "A WEF/Frontiers report names 10 emerging energy technologies with credible deployment paths by 2030, among them low-carbon construction materials, digital grids, batteries, industrial heat storage, advanced solar, subsea interconnectors, modular nuclear and floating offshore // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
