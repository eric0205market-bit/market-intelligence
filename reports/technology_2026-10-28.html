antalate", "GeSi", "barium titanate", "IC-Link", "hybrid bonding"], "source_meta": {"author": "Imene Jadli", "word_count": 3780, "paywalled": false}}, {"record_id": "0a511c8a87d3452f", "source_type": "technology", "source_name": "SemiWiki", "source_url": "https://semiwiki.com/forum/threads/26115", "title": "Intel’s Classiq Acquisition Connects Quantum Hardware with Software", "published_date": "2026-10-26", "language": "en", "processed_at": "2026-10-28T11:07:20Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "Intel signed a definitive agreement to acquire quantum software developer Classiq, combining Classiq's automated quantum algorithm synthesis with Intel's silicon spin-qubit hardware and cryogenic control electronics to build a full-stack quantum platform; closing expected 1H 2027, terms undisclosed. The poster frames it as quantum's analogue of EDA and notes Intel CEO Lip-Bu Tan invested in Classiq's 2022 Series B.", "themes": [{"theme": "Intel full-stack quantum push", "insights": [{"claim": "Intel has signed a definitive agreement to acquire Classiq, with closing expected in the first half of 2027 subject to regulatory approvals and with financial terms undisclosed.", "speaker": "M", "type": "data_point", "entities": ["Intel", "Classiq"], "conviction": "high", "so_what": "Marks Intel moving from quantum hardware research toward an integrated hardware-plus-software quantum business.", "quote": "Closing is expected in the first half of 2027, subject to regulatory approvals and customary conditions.", "locator": "The proposed acquisition gives Intel", "quote_verified": true}, {"claim": "The deal combines Classiq's automated algorithm synthesis platform with Intel's silicon spin-qubit technology, cryogenic control electronics and existing quantum software, giving Intel a path to a full-stack quantum computing business.", "speaker": "M", "type": "thesis", "entities": ["Intel", "Classiq"], "conviction": "medium", "so_what": "Vertical integration could let Intel capture the developer layer rather than remain a component/qubit supplier.", "quote": null, "locator": "Intel has signed a definitive agreement", "quote_verified": false}, {"claim": "Intel committed to maintaining Classiq's hardware-agnostic integrations, preserving customer ability to run on other quantum platforms.", "speaker": "M", "type": "data_point", "entities": ["Intel", "Classiq"], "conviction": "medium", "so_what": "Keeps Classiq's cross-platform customer base intact, but rival qubit vendors may grow wary of a software layer owned by a hardware competitor.", "quote": null, "locator": "Intel's commitment to maintain Classiq's", "quote_verified": false}, {"claim": "Intel CEO Lip-Bu Tan personally participated in Classiq's 2022 Series B round, a related-party angle to the acquisition.", "speaker": "M", "type": "anecdote", "entities": ["Lip-Bu Tan", "Classiq", "Intel"], "conviction": "high", "so_what": "Governance watchers may scrutinize related-party dynamics in Tan-era Intel M&A.", "quote": "Lip-Bu Tan participated in Classiqs' 2022 Series B round. Small world.........", "locator": "Lip-Bu Tan participated", "quote_verified": true}]}, {"theme": "Quantum design automation as EDA analogue", "insights": [{"claim": "Translating high-level computational goals into efficient quantum circuits is a major development bottleneck, and Classiq automates it while also supporting hardware benchmarking, resource optimization and multi-platform execution.", "speaker": "M", "type": "causal", "entities": ["Classiq"], "conviction": "medium", "so_what": "Points to software tooling, not just qubit count, as a gating factor for quantum commercialization.", "quote": null, "locator": "Classiq addresses a significant development challenge", "quote_verified": false}, {"claim": "Quantum design automation could play the role EDA played for chips, letting developers build increasingly complex circuits within hardware constraints.", "speaker": "M", "type": "framework", "entities": ["EDA", "Classiq"], "conviction": "medium", "so_what": "If the analogy holds, quantum design-automation tools could become a high-margin chokepoint like Synopsys/Cadence are in chips.", "quote": "Just as EDA helped semiconductor engineers manage growing chip complexity, quantum design automation could help developers create increasingly sophisticated circuits", "locator": "The announcement draws a useful parallel", "quote_verified": true}, {"claim": "Co-owning software and hardware enables cross-stack optimization, matching algorithms to available qubit resources and using software insight to guide future hardware development.", "speaker": "M", "type": "causal", "entities": ["Intel", "Classiq"], "conviction": "medium", "so_what": "Tight hardware-software co-design is a potential differentiator versus pure-hardware quantum players.", "quote": null, "locator": "Combining software and hardware expertise", "quote_verified": false}, {"claim": "The acquisition does not resolve quantum computing's underlying technical challenges; it mainly makes Intel's silicon quantum progress more accessible to application developers.", "speaker": "M", "type": "contrarian", "entities": ["Intel"], "conviction": "medium", "so_what": "Tempers expectations: the deal is a positioning move, not a near-term commercial quantum breakthrough.", "quote": "The acquisition would not itself resolve quantum computing’s technical challenges.", "locator": "The acquisition would not itself", "quote_verified": true}]}], "insight_total": 8, "top_entities": ["Intel", "Classiq", "Lip-Bu Tan", "EDA", "spin-qubit", "cryogenic control electronics"], "source_meta": {"author": "M", "word_count": 327, "paywalled": false}}, {"record_id": "5643c1882fcb14b6", "source_type": "technology", "source_name": "SemiWiki", "source_url": "https://semiwiki.com/prototyping/s2c-eda/375383-s2c-showcases-ai-assisted-risc-v-verification-and-fpga-prototyping-at-risc-v-summit-china/", "title": "S2C Targets Faster RISC-V Bring-Up With Prototyping and AI", "published_date": "2026-10-27", "language": "en", "processed_at": "2026-10-28T11:07:47Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "At the sixth RISC-V Summit China (Shenzhen, Oct 18-20), S2C demonstrated an Andes AX66 RISC-V config running Linux KVM on its Prodigy S8-100 prototyping system using 55% of one AMD Versal Premium VP1902 FPGA, an RCF Agent that automates first-pass RTL compile triage on XiangShan, and an LLM-assisted virtual-platform debug flow. The piece is largely promotional and explicitly cautions that demos are not silicon performance measurements.", "themes": [{"theme": "FPGA prototyping capacity for RISC-V", "insights": [{"claim": "S2C ran an Andes Technology AX66-based RISC-V configuration with Linux KVM on its Prodigy S8-100 FPGA prototyping system, using 55% of the resources of a single AMD Versal Premium VP1902 FPGA.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["S2C", "Andes Technology", "AX66", "Prodigy S8-100", "AMD Versal Premium VP1902"], "conviction": "high", "so_what": "Shows a single VP1902 has headroom for multicore 64-bit RISC-V systems, supporting AMD's position in the high-end prototyping FPGA market.", "quote": "The design used 55% of the resources available on a single AMD Versal Premium VP1902 FPGA.", "locator": "At its booth, S2C demonstrated", "quote_verified": true}, {"claim": "Spare FPGA capacity matters beyond fitting a core because developers need room to evaluate full-system behavior and run software, such as edge AI inference workloads, before first silicon.", "speaker": "Daniel Nenni", "type": "causal", "entities": ["S2C", "edge AI"], "conviction": "medium", "so_what": "Shift-left software validation drives demand for larger prototyping platforms in the RISC-V ecosystem.", "quote": null, "locator": "That utilization figure provides a concrete", "quote_verified": false}, {"claim": "Running Linux KVM on the prototype brings OS-processor virtualization interactions into validation before chips are manufactured, but the demo and utilization figure should not be read as measures of final silicon performance or throughput.", "speaker": "Daniel Nenni", "type": "contrarian", "entities": ["Linux KVM"], "conviction": "medium", "so_what": "Investors should discount prototyping demos as evidence of RISC-V competitiveness on performance.", "quote": "the demonstration and resource-utilization figure should not be read as measurements of final silicon performance or application throughput", "locator": "Running Linux KVM adds another dimension", "quote_verified": true}]}, {"theme": "AI agents in chip verification", "insights": [{"claim": "S2C's RCF Agent, demonstrated on RTL from the open-source XiangShan RISC-V processor, launches compilation, gathers error messages and produces an initial analysis, automating repetitive first-pass triage.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["S2C", "RCF Agent", "XiangShan"], "conviction": "medium", "so_what": "Agentic AI is entering EDA at the grunt-work layer, lowering ramp cost for teams adopting unfamiliar open-source RTL.", "quote": null, "locator": "S2C also demonstrated RCF Agent", "quote_verified": false}, {"claim": "The RCF Agent demo covered only initial analysis and did not show that the agent independently resolves errors or replaces engineering review.", "speaker": "Daniel Nenni", "type": "contrarian", "entities": ["RCF Agent"], "conviction": "medium", "so_what": "Current EDA AI agents are productivity aids, not labor replacements; temper AI-in-EDA hype accordingly.", "quote": "it did not establish that the agent independently resolves every error or replaces engineering review", "locator": "The significance is practical.", "quote_verified": true}, {"claim": "S2C's proposed debug flow pairs a virtual platform modeling processor, memory, buses, interrupt controller and peripherals with an LLM layer that interprets captured debug data, addressing failures that span instruction execution, privilege modes, memory, interrupts and software simultaneously.", "speaker": "Daniel Nenni", "type": "framework", "entities": ["S2C", "LLM"], "conviction": "medium", "so_what": "Growing SoC complexity makes manual log correlation a bottleneck, creating room for LLM-assisted debug tools.", "quote": null, "locator": "S2C's proposed workflow combines", "quote_verified": false}, {"claim": "Save-and-restore of execution state gives teams a reproducible starting point for collaborative debugging, solving the problem that incomplete records make failures hard to reproduce or hand off.", "speaker": "Daniel Nenni", "type": "causal", "entities": ["S2C"], "conviction": "medium", "so_what": "Reproducibility is the enabling feature that makes LLM interpretation of debug data trustworthy enough to use.", "quote": null, "locator": "Saving and restoring execution state", "quote_verified": false}]}, {"theme": "RISC-V ecosystem in China", "insights": [{"claim": "The sixth RISC-V Summit China drew processor architects, IP suppliers, EDA providers and software developers, with agendas spanning AI, HPC, software enablement and chip design and verification, reflecting broadening engineering demands of RISC-V adoption.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["RISC-V Summit China", "Shenzhen"], "conviction": "medium", "so_what": "Signals the Chinese RISC-V ecosystem maturing beyond cores into full toolchain and software stack.", "quote": null, "locator": "Held October 18-20 at the Shenzhen", "quote_verified": false}, {"claim": "RISC-V development increasingly depends on coordinating hardware verification with software readiness, and combining FPGA prototypes, compile automation and reproducible virtual-platform debugging surfaces integration issues before fabrication.", "speaker": "Daniel Nenni", "type": "thesis", "entities": ["RISC-V", "S2C"], "conviction": "medium", "so_what": "Pre-silicon tools vendors benefit as RISC-V adopters try to avoid costly respins.", "quote": "RISC-V development increasingly depends on coordinating hardware verification with software readiness.", "locator": "Bottom line", "quote_verified": true}]}], "insight_total": 9, "top_entities": ["S2C", "RISC-V", "Andes Technology", "Prodigy S8-100", "AMD Versal Premium VP1902", "XiangShan", "RCF Agent", "Linux KVM", "RISC-V Summit China"], "source_meta": {"author": "Daniel Nenni", "word_count": 754, "paywalled": false}}, {"record_id": "6ba1ef1c85e45222", "source_type": "technology", "source_name": "SemiWiki", "source_url": "https://semiwiki.com/eda/synopsys/375201-why-synopsys-role-in-amds-instinct-mi455x-matters-for-ai-infrastructure/", "title": "Why Synopsys’ Role in AMD’s Instinct MI455X Matters for AI Infrastructure", "published_date": "2026-10-27", "language": "en", "processed_at": "2026-10-28T11:08:09Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "Synopsys says AMD used its 3DIC Compiler, multiphysics analysis, memory interface IP, ZeBu emulation (models up to 20 billion gates) and formal/RTL/low-power verification to develop the multi-die Instinct MI455X GPU. Nenni argues that as AI accelerators become interconnected multi-die systems, whole-platform design, verification and pre-silicon software capability is itself a competitive advantage, reinforcing integrated EDA vendors.", "themes": [{"theme": "Multi-die AI GPU design complexity", "insights": [{"claim": "AMD used Synopsys' 3DIC Compiler for multi-die design and advanced package development of the Instinct MI455X, covering partitioning, prototyping, floorplanning, automated die-to-package connections and integrated physical analysis.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["AMD", "Synopsys", "Instinct MI455X", "3DIC Compiler"], "conviction": "high", "so_what": "A flagship AI GPU design win for Synopsys' 3DIC tooling strengthens its position in the chiplet/advanced packaging EDA market.", "quote": null, "locator": "At the center of the effort", "quote_verified": false}, {"claim": "Splitting a processor across multiple dies adds architectural flexibility but creates integration problems in data connectivity, power delivery and heat removal, so a design that looks good at die level can bottleneck once packaged.", "speaker": "Daniel Nenni", "type": "causal", "entities": ["multi-die"], "conviction": "high", "so_what": "System-level co-design tools become mandatory, raising switching costs for chipmakers locked into an integrated EDA flow.", "quote": "A design that looks effective at the individual die level can encounter bottlenecks once assembled into a complete package.", "locator": "This matters because a multi-die", "quote_verified": true}, {"claim": "Thermal, power and electromagnetic effects interact in dense AI packages, so evaluating them together via multiphysics analysis surfaces problems early that would otherwise require expensive late-stage changes.", "speaker": "Daniel Nenni", "type": "causal", "entities": ["Synopsys"], "conviction": "medium", "so_what": "Multiphysics simulation is a growing EDA revenue line tied directly to AI accelerator density.", "quote": null, "locator": "Synopsys' integrated multiphysics analysis", "quote_verified": false}, {"claim": "AMD used Synopsys memory interface IP for the MI455X because extra compute delivers limited benefit when the surrounding system cannot feed data fast enough.", "speaker": "Daniel Nenni", "type": "causal", "entities": ["AMD", "Synopsys", "Instinct MI455X"], "conviction": "high", "so_what": "Memory bandwidth, not compute, is the binding constraint in AI accelerators, sustaining demand for memory interface IP.", "quote": "Additional computing capacity delivers limited benefit when the surrounding system cannot supply data quickly enough.", "locator": "Memory integration was another part", "quote_verified": true}]}, {"theme": "Pre-silicon software and verification", "insights": [{"claim": "AMD used Synopsys ZeBu emulation to validate hardware and develop software before silicon, with Synopsys reporting emulation models supporting up to 20 billion gates.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["AMD", "Synopsys", "ZeBu"], "conviction": "high", "so_what": "Emulation capacity at 20B-gate scale is a key hardware product for Synopsys tied to AI chip programs.", "quote": "Synopsys also reported collaboration on emulation models supporting up to 20 billion gates", "locator": "The collaboration also addressed software readiness", "quote_verified": true}, {"claim": "An accelerator's commercial usefulness depends on drivers and runtime software working with the architecture, so starting software work before chips arrive reduces bring-up uncertainty.", "speaker": "Daniel Nenni", "type": "thesis", "entities": ["AMD"], "conviction": "medium", "so_what": "For AMD versus Nvidia, software readiness at launch is a determinant of AI GPU adoption, and emulation shortens that gap.", "quote": null, "locator": "Starting software work earlier matters", "quote_verified": false}, {"claim": "AMD also used Synopsys formal verification, RTL simulation and low-power verification across individual dies and the full system, as stronger pre-manufacturing verification matters more as architectures grow complex.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["AMD", "Synopsys"], "conviction": "medium", "so_what": "Indicates broad multi-product Synopsys penetration of a single AMD flagship program.", "quote": null, "locator": "AMD additionally used Synopsys' formal verification", "quote_verified": false}]}, {"theme": "Integrated tooling as competitive edge", "insights": [{"claim": "Development efficiency for AI chips increasingly depends on connecting engineering disciplines that were previously handled independently, favoring vendors whose tools span multiple stages.", "speaker": "Daniel Nenni", "type": "thesis", "entities": ["Synopsys"], "conviction": "medium", "so_what": "Supports the bull case for broad-portfolio EDA vendors over point-tool suppliers.", "quote": "development efficiency increasingly depends on connecting disciplines that previously could be handled more independently", "locator": "For Synopsys, the announcement demonstrates", "quote_verified": true}, {"claim": "The author's takeaway is that the ability to design, analyze, verify and prepare software across the whole platform is becoming a competitive capability in its own right for AI chip developers.", "speaker": "Daniel Nenni", "type": "thesis", "entities": ["AI accelerators"], "conviction": "high", "so_what": "Execution capability in system-level engineering, not just architecture, may separate winners among AI chip developers.", "quote": "the ability to design, analyze, verify, and prepare software across the entire platform becomes a competitive capability in its own right", "locator": "Bottom line", "quote_verified": true}]}], "insight_total": 9, "top_entities": ["Synopsys", "AMD", "Instinct MI455X", "3DIC Compiler", "ZeBu", "multiphysics", "memory interface intellectual property"], "source_meta": {"author": "Daniel Nenni", "word_count": 795, "paywalled": false}}, {"record_id": "c7fb58bf7121e95b", "source_type": "technology", "source_name": "SemiWiki", "source_url": "https://semiwiki.com/semiconductor-services/accellera/375280-accelleras-fsl-1-0-gives-functional-safety-data-a-common-language/", "title": "Accellera’s FSL 1.0 Gives Functional Safety Data a Common Language", "published_date": "2026-10-26", "language": "en", "processed_at": "2026-10-28T11:08:28Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "Accellera approved Functional Safety Language (FSL) 1.0 on October 21, a Tcl-based common data model for exchanging FMEDA safety data across the IP-to-chip-to-system supply chain, supporting hierarchical FMEDAs and refinement of diagnostic coverage from fault-injection results. Nenni stresses it does not itself confer ISO 26262/IEC 61508 compliance and that value depends on tool-vendor adoption.", "themes": [{"theme": "Safety data interoperability problem", "insights": [{"claim": "Functional safety data handoffs between IP suppliers, chipmakers and system manufacturers today rely on spreadsheets, proprietary databases and incompatible formats, and each conversion creates opportunities for omissions or misunderstandings.", "speaker": "Daniel Nenni", "type": "causal", "entities": ["IP supplier", "semiconductor company", "system manufacturer"], "conviction": "high", "so_what": "Manual safety-data translation is a hidden cost and risk in automotive/industrial chip supply chains that standardization can remove.", "quote": "every conversion creates an opportunity for omissions or misunderstandings", "locator": "Today, those handoffs can involve", "quote_verified": true}, {"claim": "Accellera Systems Initiative approved Functional Safety Language Standard 1.0 for release on October 21, establishing a common language and data model for capturing and exchanging functional safety information, and it is available for download.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["Accellera Systems Initiative", "FSL 1.0"], "conviction": "high", "so_what": "Creates a new interoperability layer that EDA and safety-tool vendors will need to support.", "quote": null, "locator": "Accellera Systems Initiative has approved", "quote_verified": false}, {"claim": "FSL 1.0 focuses on FMEDA, capturing failure modes, effects, safety mechanisms, technology information and safety requirements plus mappings to design representations, using Tcl-based syntax for machine processing.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["FSL 1.0", "FMEDA", "Tcl"], "conviction": "high", "so_what": "Tcl syntax aligns with existing EDA scripting flows, easing integration into incumbent tools.", "quote": null, "locator": "FSL 1.0 focuses on failure modes", "quote_verified": false}]}, {"theme": "Hierarchical and evidence-linked FMEDA", "insights": [{"claim": "Support for hierarchical FMEDAs lets component analyses roll up into subsystem and system analyses, potentially reducing suppliers' repeated customer-specific deliverables and simplifying integrators' work while preserving traceability.", "speaker": "Daniel Nenni", "type": "causal", "entities": ["FSL 1.0", "FMEDA"], "conviction": "medium", "so_what": "Lowers cost of selling safety-qualified IP into automotive, potentially benefiting IP vendors.", "quote": null, "locator": "Its support for hierarchical FMEDAs", "quote_verified": false}, {"claim": "Reusing a component's safety analysis in a larger system does not automatically validate its assumptions about operating environment, implementation and use; engineering judgment is still required.", "speaker": "Daniel Nenni", "type": "contrarian", "entities": ["FSL 1.0"], "conviction": "high", "so_what": "Standardized exchange does not eliminate integrator liability or safety engineering labor.", "quote": "Moving that analysis into a larger system does not automatically establish that those assumptions remain valid.", "locator": "However, reuse requires engineering judgment.", "quote_verified": true}, {"claim": "FSL supports both assumption-based and design-mapped FMEDA and allows estimated diagnostic coverage to be refined with verification and fault-injection results, closing the gap between safety documentation and measured behavior.", "speaker": "Daniel Nenni", "type": "framework", "entities": ["FSL 1.0", "FMEDA"], "conviction": "medium", "so_what": "Ties safety analysis to verification tools, creating a hook for fault-injection and verification vendors.", "quote": null, "locator": "Another feature connects early estimates", "quote_verified": false}]}, {"theme": "Compliance limits and adoption risk", "insights": [{"claim": "FSL supports calculation of safety failure-rate metrics associated with ISO 26262 and IEC 61508, but adopting it alone does not demonstrate compliance or certify a product.", "speaker": "Daniel Nenni", "type": "contrarian", "entities": ["ISO 26262", "IEC 61508", "FSL 1.0"], "conviction": "high", "so_what": "Do not mistake FSL support claims by vendors for certification advantages.", "quote": "adopting FSL alone does not demonstrate compliance or certify a product", "locator": "FSL uses Tcl-based syntax", "quote_verified": true}, {"claim": "FSL's value depends on adoption: tool vendors need compatible implementations, suppliers dependable export, and customers confidence imported data retains meaning, with round-trip exchange, hierarchical integration and post-change updates the key tests.", "speaker": "Daniel Nenni", "type": "prediction", "entities": ["Accellera", "FSL 1.0"], "conviction": "medium", "so_what": "Watch for multi-vendor round-trip demos as the signal that the standard is gaining real traction.", "quote": "Adoption will determine how much of that opportunity becomes routine practice.", "locator": "Adoption will determine", "quote_verified": true}]}], "insight_total": 8, "top_entities": ["Accellera", "FSL 1.0", "FMEDA", "ISO 26262", "IEC 61508", "Tcl"], "source_meta": {"author": "Daniel Nenni", "word_count": 819, "paywalled": false}}, {"record_id": "d56a8293dad2cf58", "source_type": "technology", "source_name": "SemiWiki", "source_url": "https://semiwiki.com/forum/threads/26118", "title": "Dutch government plans to cut 25,000 jobs in AI-led overhaul, eventually saving $5b a year", "published_date": "2026-10-27", "language": "en", "processed_at": "2026-10-28T11:08:44Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Macro", "Society"], "gist": "The Dutch government plans to cut about 25,000 civil-service jobs over several years in an AI-led efficiency drive, targeting savings of EUR 900 million a year by 2027 rising to EUR 3.5 billion from 2035, with police and defence exempt. Note: the title's '$5b' is Singapore dollars (S$5 billion); the text gives EUR 3.5 billion.", "themes": [{"theme": "AI-driven public sector headcount cuts", "insights": [{"claim": "The Dutch central government aims to cut around 25,000 civil-servant jobs over several years in an AI-led efficiency drive, saving EUR 900 million a year by 2027 and EUR 3.5 billion (S$5 billion) a year from 2035.", "speaker": "B", "type": "data_point", "entities": ["Dutch government", "Netherlands"], "conviction": "high", "so_what": "A sovereign explicitly sizing AI-enabled headcount reduction is an early concrete marker of AI's labor substitution in white-collar public work.", "quote": "The central government wants to save €900 million a year by 2027, rising to €3.5 billion from 2035.", "locator": "The central government wants to save", "quote_verified": true}, {"claim": "The Dutch Cabinet will present its plans for deploying artificial intelligence to raise government productivity in early 2027.", "speaker": "B", "type": "prediction", "entities": ["Dutch Cabinet"], "conviction": "medium", "so_what": "Early 2027 plan is a potential procurement catalyst for AI software and services vendors selling to European governments.", "quote": null, "locator": "The Cabinet will present plans", "quote_verified": false}, {"claim": "Dutch government headcount reached a record 160,000 at the end of 2025, up 41% from 2018, despite previous Cabinets' pledges to reduce it.", "speaker": "B", "type": "data_point", "entities": ["Netherlands"], "conviction": "high", "so_what": "Past failures to cut headcount suggest execution risk; AI is being used as the new justification for an old austerity goal.", "quote": "The number of government officials surged to a record 160,000 at the end of 2025, up 41% compared with 2018", "locator": "The number of government officials surged", "quote_verified": true}, {"claim": "State Secretary for Effective Government Eric van den Burg framed the cuts as necessary tough choices for a simpler, smarter and smaller central government.", "speaker": "B", "type": "thesis", "entities": ["Eric van den Burg"], "conviction": "high", "so_what": "Political framing of AI as an austerity tool may spread to other fiscally conservative EU states.", "quote": "We cannot keep doing what we have been doing", "locator": "State Secretary for Effective Government", "quote_verified": true}]}, {"theme": "Fiscal context and exemptions", "insights": [{"claim": "The Netherlands already runs one of the smallest budget deficits in the EU, yet its long-term outlook still raises concern domestically, motivating the cuts.", "speaker": "B", "type": "causal", "entities": ["Netherlands", "European Union"], "conviction": "medium", "so_what": "Even fiscally strong EU states are pre-emptively tightening, a sign of longer-run spending pressure (ageing, defence).", "quote": null, "locator": "The Dutch government budget deficit", "quote_verified": false}, {"claim": "Police and defence are among the areas exempted from the Dutch civil-service cuts.", "speaker": "B", "type": "data_point", "entities": ["Netherlands"], "conviction": "high", "so_what": "Protecting defence while cutting civil administration is consistent with Europe's security-spending reprioritization.", "quote": null, "locator": "The cuts will not hit equally hard", "quote_verified": false}]}], "insight_total": 6, "top_entities": ["Dutch government", "Netherlands", "Eric van den Burg", "European Union", "artificial intelligence"], "source_meta": {"author": "B", "word_count": 200, "paywalled": false}}, {"record_id": "9f0524a2bd14c574", "source_type": "technology", "source_name": "ServeTheHome", "source_url": "https://www.servethehome.com/asrock-creator-radeon-ai-pro-r9700-review-workstation-inference-amd-style/", "title": "ASRock Creator Radeon AI Pro R9700 Review: Workstation Inference, AMD Style", "published_date": "2026-10-26", "language": "en", "processed_at": "2026-10-28T11:09:54Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech"], "gist": "ServeTheHome reviews the hardware of ASRock's Creator Radeon AI Pro R9700, a 32GB, 300W dual-slot blower workstation card on AMD's RDNA 4 Navi 48 GPU with 382.7 dense FP8 TFLOPS. It argues that AI inference demand has made high-VRAM workstation GPUs a hot commodity. The captured text ends before the performance section, so no benchmark results are included. Key tensions are the R9700's VRAM step-back from the 48GB W7900 and STH's view that AMD is leaving a high-memory gap below the MI350P.", "themes": [{"theme": "AI demand squeezing workstation GPUs", "insights": [{"claim": "The explosion in demand for AI inference hardware has made high-end video cards a hot commodity. Workstation-grade cards with the most VRAM have been hit hardest, because discrete cards are the most effective way to add high-performance inference to a standard-form-factor PC.", "speaker": "Ryan Smith", "type": "thesis", "entities": ["NVIDIA", "AMD", "Intel"], "conviction": "high", "so_what": "Local inference is creating a demand tailwind and pricing power for high-VRAM professional GPUs across all three vendors.", "quote": "discrete video cards have become the most effective way to add high-performance inference hardware to a standard-form-factor PC", "locator": "Thanks to the explosion in demand", "quote_verified": true}, {"claim": "AMD named its RDNA 4 workstation line 'Radeon AI Pro' and added AI-centric upgrades, including faster matrix math and FP8 support. That makes the R9700 AMD's most AI-capable workstation card yet.", "speaker": "Ryan Smith", "type": "data_point", "entities": ["AMD", "Radeon AI Pro R9700", "RDNA 4"], "conviction": "high", "so_what": "AMD is repositioning its workstation graphics as AI inference hardware to capture spending on local AI.", "quote": null, "locator": "The Radeon AI Pro R9700 is", "quote_verified": false}]}, {"theme": "AMD's memory capacity gap", "insights": [{"claim": "The R9700 has 32GB of GDDR6, less than the previous-generation 48GB Radeon Pro W7900. AMD did not produce a true high-end GPU this generation, so it is trying to make up for the lower capacity with compute throughput.", "speaker": "Ryan Smith", "type": "data_point", "entities": ["AMD", "Radeon AI Pro R9700", "Radeon Pro W7900", "Navi 48"], "conviction": "high", "so_what": "VRAM capacity sets the size of model a card can run, so a step back in memory weakens AMD's workstation AI pitch against NVIDIA's high-memory parts.", "quote": null, "locator": "Navi 48 sits somewhere between a", "quote_verified": false}, {"claim": "Asked why the R9700 tops out at 32GB, AMD said that is the maximum the memory configuration supports. Patrick of ServeTheHome argues the market would absorb a higher price for a higher-memory AI part, and wishes AMD offered something between the R9700 and the MI350P.", "speaker": "Ryan Smith", "type": "contrarian", "entities": ["AMD", "MI350P", "Radeon AI Pro R9700"], "conviction": "medium", "so_what": "Points to an unserved, price-insensitive segment for high-VRAM prosumer AI cards that AMD is leaving open to competitors.", "quote": "the market would probably absorb a higher cost and higher memory part for AI", "locator": "Patrick’s note: At an Advancing AI", "quote_verified": true}, {"claim": "Memory capacity is the key differentiator between AMD's consumer and professional cards: 32GB is available only on the Radeon AI Pro cards, using 16 chips in clamshell mode on Navi 48's 256-bit bus.", "speaker": "Ryan Smith", "type": "framework", "entities": ["AMD", "Navi 48", "Radeon AI Pro"], "conviction": "high", "so_what": "AMD uses VRAM to separate its product tiers and price, which drives margin in the professional line.", "quote": null, "locator": "As is traditional for a workstation", "quote_verified": false}]}, {"theme": "RDNA 4 compute and precision tradeoffs", "insights": [{"claim": "The R9700 delivers 382.7 TFLOPS of dense FP8 matrix throughput, double that with sparsity, and 47.8 TFLOPS of FP32 vector throughput. It has 640GB/s of memory bandwidth and a 300W total board power.", "speaker": "Ryan Smith", "type": "data_point", "entities": ["Radeon AI Pro R9700", "Navi 48"], "conviction": "high", "so_what": "640GB/s of bandwidth limits single-user decoding speed, so the compute-heavy, bandwidth-light balance favours prefill and batched workloads over chat-style single-user inference.", "quote": null, "locator": "ASRock Creator Radeon AI Pro R9700 Specifications", "quote_verified": false}, {"claim": "RDNA 4 has no discrete matrix cores like AMD's CDNA. It runs matrix math with WMMA on the same CUs as the vector units, although RDNA 4 doubled floating-point and quadrupled INT8 performance over RDNA 3.", "speaker": "Ryan Smith", "type": "data_point", "entities": ["RDNA 4", "CDNA", "WMMA", "RDNA 3"], "conviction": "high", "so_what": "AMD's split between graphics and datacenter architectures leaves client and workstation AI hardware structurally behind its server parts.", "quote": null, "locator": "Notably, AMD does not include discrete", "quote_verified": false}, {"claim": "The R9700 supports FP6 and FP4 but runs them at FP8 speed, so their benefit is smaller weights rather than faster execution. A typical use is running a roughly 30B-parameter model in FP6 on the 32GB card with VRAM to spare.", "speaker": "Ryan Smith", "type": "data_point", "entities": ["Radeon AI Pro R9700", "FP8", "FP6", "FP4"], "conviction": "high", "so_what": "Without native FP4 speedups, AMD workstation cards trail the industry move to FP4 inference on speed.", "quote": null, "locator": "With a peak clock speed of", "quote_verified": false}]}, {"theme": "Multi-card workstation design", "insights": [{"claim": "AMD sells no reference R9700 card and keeps partners such as ASRock on a short leash. All partner cards are similar dual-slot blowers built to PCIe spec so that up to four can fit in a standard ATX workstation.", "speaker": "Ryan Smith", "type": "framework", "entities": ["AMD", "ASRock", "Radeon AI Pro R9700"], "conviction": "high", "so_what": "AMD is targeting dense multi-GPU local inference rigs, extending its product strategy from consumer to workstation and creating channel opportunities for board partners.", "quote": null, "locator": "Most notably, AMD has kept its", "quote_verified": false}, {"claim": "The R9700 offers soft ECC under Linux only, and it must be enabled manually. The reviewer argues ECC is not just a checkbox feature, because the odds of failure rise when four cards share a system.", "speaker": "Ryan Smith", "type": "causal", "entities": ["Radeon AI Pro R9700", "Linux"], "conviction": "medium", "so_what": "Reliability features matter more as prosumer rigs scale toward small-server deployments.", "quote": null, "locator": "The GDDR6 memory clocks at 20Gbps", "quote_verified": false}, {"claim": "ASRock's Creator R9700 uses an open-backed blower, a vapor chamber with Honeywell PTM7950, and a rear-mounted 12V-2x6 connector. Unique among R9700 vendors, it has four DisplayPort 2.1a outputs and no HDMI.", "speaker": "Ryan Smith", "type": "data_point", "entities": ["ASRock", "Honeywell", "DisplayPort 2.1a"], "conviction": "medium", "so_what": "Mostly differences in how the card is built. Partner differentiation is limited by AMD's tight design rules.", "quote": null, "locator": "ASRock Creator Radeon Pro AI R9700 Build", "quote_verified": false}]}], "insight_total": 11, "top_entities": ["AMD", "ASRock", "Radeon AI Pro R9700", "RDNA 4", "Navi 48", "Radeon Pro W7900", "MI350P", "NVIDIA", "CDNA", "WMMA"], "source_meta": {"author": "Ryan Smith", "word_count": 1800, "paywalled": false}}, {"record_id": "20a91001f6974c47", "source_type": "technology", "source_name": "Wired", "source_url": "https://www.wired.com/story/some-iphone-duo-models-are-breaking-ifixits-teardown-might-explain-why/#intcid=86de1414-be79-447e-9c5d-cb523443a08a", "title": "Some iPhone Duo Models Are Breaking. iFixit’s Teardown Might Explain Why", "published_date": "2026-10-26", "language": "en", "processed_at": "2026-10-28T11:09:18Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "A small number of Apple's first foldable, the $1,999 iPhone Duo, are cracking on the inner screen shortly after opening ('crackgate'); Apple acknowledges the issue and offers AppleCare replacements. iFixit's teardown theorizes a hinge center support bar creates a mid-screen stress point, while awarding a provisional 5/10 repairability score, the highest it has given any foldable.", "themes": [{"theme": "iPhone Duo inner-screen defect", "insights": [{"claim": "Reddit reports indicate that a small number of Apple iPhone Duo units suffer inner-screen cracks when opened, sometimes as early as device setup, an issue users have dubbed 'crackgate'.", "speaker": "Boone Ashworth", "type": "data_point", "entities": ["Apple", "iPhone Duo", "Reddit"], "conviction": "high", "so_what": "Early quality defects on Apple's first foldable could dent launch-cycle sentiment and raise warranty costs.", "quote": "People are already calling this “crackgate.”", "locator": "The first batch of Apple’s first", "quote_verified": true}, {"claim": "Apple has acknowledged an issue affecting the inner display on a small number of iPhone Duo units and directs affected users to AppleCare for a replacement.", "speaker": "Boone Ashworth", "type": "data_point", "entities": ["Apple", "iPhone Duo", "AppleCare"], "conviction": "high", "so_what": "Official acknowledgment and replacement policy signals Apple treats it as contained, limiting but not eliminating recall-style risk.", "quote": "We are aware of an issue impacting the inner display on a small number of iPhone Duo units.", "locator": "The response to iPhone Duo from", "quote_verified": true}, {"claim": "The iPhone Duo screen failures tend to surface quickly after use rather than days after unboxing, and WIRED's review unit showed no issues after more than two weeks of daily use.", "speaker": "Boone Ashworth", "type": "anecdote", "entities": ["iPhone Duo", "WIRED"], "conviction": "medium", "so_what": "Early-failure pattern suggests a manufacturing/tolerance defect rather than a progressive wear issue affecting the whole installed base.", "quote": null, "locator": "The issue affects a small number", "quote_verified": false}, {"claim": "iFixit theorizes that during folding the iPhone Duo's center hinge support bar, across which a display cable passes, fails to get out of the way, creating a stress point in the middle of the inner screen that may cause the cracks.", "speaker": "Boone Ashworth", "type": "causal", "entities": ["iFixit", "iPhone Duo"], "conviction": "medium", "so_what": "If the root cause is hinge design rather than a component batch, a fix may require hardware revision, not just supply changes.", "quote": "the center support bar along the hinge fails to get out of the way as the screen folds, making a stress point right in the middle of the screen", "locator": "The culprit behind the screen breaking", "quote_verified": true}, {"claim": "Apple's inner-screen repair service for the iPhone Duo costs $999, roughly half the phone's $1,999 price.", "speaker": "Boone Ashworth", "type": "data_point", "entities": ["Apple", "iPhone Duo"], "conviction": "high", "so_what": "High out-of-warranty repair cost may push buyers toward AppleCare attach, supporting services revenue.", "quote": null, "locator": "Removing the full inner screen requires", "quote_verified": false}]}, {"theme": "Foldable engineering limits", "insights": [{"claim": "Foldable phones have a history of hinge-related failures, such as dust ingress breaking Samsung's original Galaxy Fold in 2019, which forced Samsung to pause sales; such problems have diminished as the category matured but remain hard to fix.", "speaker": "Boone Ashworth", "type": "framework", "entities": ["Samsung", "Galaxy Fold"], "conviction": "medium", "so_what": "Precedent suggests first-gen foldable defects are typically survivable for the brand but can delay ramp.", "quote": "But fewer problems don’t mean easier fixes.", "locator": "This is familiar territory for nt.", "speaker": "Boone Ashworth", "type": "data_point", "entities": ["iPhone Duo", "iFixit"], "conviction": "high", "so_what": "The defect hits exactly the component that is most expensive and difficult to repair.", "quote": null, "locator": "The tricky part, according to iFixit", "quote_verified": false}, {"claim": "US and EU legislation has gradually pushed Apple to expand self-repair, and the iPhone Duo launched with a widely accessible repair manual on day one, which has not always been the case.", "speaker": "Boone Ashworth", "type": "causal", "entities": ["Apple", "European Union", "iPhone Duo"], "conviction": "medium", "so_what": "Right-to-repair regulation is visibly shaping Apple's product and documentation decisions.", "quote": null, "locator": "Apple long resisted letting users repair", "quote_verified": false}]}], "insight_total": 11, "top_entities": ["Apple", "iPhone Duo", "iFixit", "AppleCare", "Kyle Wiens", "Samsung", "Galaxy Fold", "Reddit", "European Union"], "source_meta": {"author": "Boone Ashworth", "word_count": 965, "paywalled": false}}, {"record_id": "3a5dcc90b475938b", "source_type": "technology", "source_name": "Wired", "source_url": "https://www.wired.com/story/i-tested-every-major-ai-agent-for-a-day-heres-the-best-one/", "title": "I Tested Every Major AI Agent for a Day. Here’s the Best One", "published_date": "2026-10-27", "language": "en", "processed_at": "2026-10-28T11:09:18Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech", "Society"], "gist": "WIRED's Reece Rogers ran six always-on consumer AI agents (Meta Muse, OpenAI Dots, Instinct, Anthropic Claude Duet, Google Gemini Spark, xAI Grok Bot) through five 24-hour tests on proactivity, instruction-following and browsing. OpenAI's $100/month Dots won overall, free Meta Muse came a close second and is the mass-market leader, Claude Duet had the best interface; agents now mostly work but still miss cross-app proactivity and raise privacy concerns.", "themes": [{"theme": "Agent $30/month; OpenAI Dots $100/month inside ChatGPT.", "speaker": "Reece Rogers", "type": "data_point", "entities": ["Meta", "Muse", "Instinct", "Google", "Gemini Spark", "Anthropic", "Claude Duet", "xAI", "Grok Bot", "OpenAI", "Dots", "ChatGPT"], "conviction": "high", "so_what": "A free, well-distributed entrant (Meta) pressures paid tiers and agent monetization economics.", "quote": null, "locator": "Each agent differs slightly in price", "quote_verified": false}, {"claim": "Meta's free Muse agent has dominated smartphone app download charts since its September release and was the easiest agent to set up.", "speaker": "Reece Rogers", "type": "data_point", "entities": ["Meta", "Muse"], "conviction": "high", "so_what": "Meta may win consumer agent distribution through free access, despite lagging on premium capability.", "quote": "Muse is for the normies! And that’s fine.", "locator": "Muse is free to use and", "quote_verified": true}, {"claim": "The author recommends most people wait for OpenAI to offer Dots free or on its $20-a-month plan, implying the $100 price is a barrier to mass adoption.", "speaker": "Reece Rogers", "type": "prediction", "entities": ["OpenAI", "Dots"], "conviction": "medium", "so_what": "Expect downward price pressure on premium agents as OpenAI seeks scale against free Muse.", "quote": null, "locator": "Best Overall: OpenAI Dots", "quote_verified": false}, {"claim": "Claude Duet's own pitch idea highlighted that Anthropic's proactive agent bills its unprompted background work against the same usage limit users pay for to chat.", "speaker": "Reece Rogers", "type": "anecdote", "entities": ["Anthropic", "Claude Duet"], "conviction": "exploratory", "so_what": "Proactive agents consume compute without explicit requests, raising questions about usage-based pricing and margins.", "quote": "it quietly bills that work to the same usage limit you pay for to chat", "locator": "Muse: 3/5. Not bad, but", "quote_verified": true}]}, {"theme": "Head-to-head test results", "insights": [{"claim": "Across five tests scored 1-5, OpenAI's Dots ranked best overall (per-test scores 2, 5, 5, 4, 4) and Meta's Muse came a close second (3, 4, 2, 5, 4).", "speaker": "Reece Rogers", "type": "data_point", "entities": ["OpenAI", "Dots", "Meta", "Muse"], "conviction": "medium", "so_what": "OpenAI and Meta lead consumer agents, while Google's Gemini Spark lagged badly.", "quote": null, "locator": "Best Overall: OpenAI Dots", "quote_verified": false}, {"claim": "In a test of proactivity, only OpenAI's Dots and Anthropic's Claude Duet detected a conflict between a calendar event and an emailed reminder; Grok Bot, Instinct, Muse and Gemini Spark all missed it.", "speaker": "Reece Rogers", "type": "data_point", "entities": ["Dots", "Claude Duet", "Grok Bot", "Instinct", "Muse", "Gemini Spark"], "conviction": "high", "so_what": "Cross-app reasoning, the core proactive promise, still works for only a minority of agents.", "quote": "Only two of the bots succeeded here, which was fewer than I expected.", "locator": "Schedule Conflicts", "quote_verified": true}, {"claim": "Asked to research for 30 minutes before writing a story pitch, only Meta's Muse and OpenAI's Dots kept researching for most of the allotted time; the others answered instantly or within minutes.", "speaker": "Reece Rogers", "type": "data_point", "entities": ["Muse", "Dots"], "conviction": "medium", "so_what": "Instruction-following on long-horizon tasks differentiates agents and correlates with compute spend.", "quote": null, "locator": "Morning Briefing", "quote_verified": false}, {"claim": "Google's Gemini Spark produced the best news pitch but failed the lunch-ordering task by adding only a single roll for a second person, and scored poorly on proactivity.", "speaker": "Reece Rogers", "type": "data_point", "entities": ["Google", "Gemini Spark"], "conviction": "medium", "so_what": "Google's beta agent is inconsistent, a risk to its position despite Gmail/Calendar data advantages.", "quote": null, "locator": "Lunch Time", "quote_verified": false}, {"claim": "Anthropic's Claude Duet, released as a wait-listed research preview the night before testing, scored mid-pack but had the most user-friendly dedicated app, which the author expects productivity-focused users to adopt in coming months.", "speaker": "Reece Rogers", "type": "prediction", "entities": ["Anthropic", "Claude Duet"], "conviction": "medium", "so_what": "Interface quality could win Anthropic a productivity niche even without top task performance.", "quote": null, "locator": "Best Interface: Anthropic Claude Duet", "quote_verified": false}, {"claim": "The author found Instinct's text-message-only design a deal-breaker because it left him feeling too removed from what the agent did on his behalf, though other WIRED writers praised it.", "speaker": "Reece Rogers", "type": "anecdote", "entities": ["Instinct", "WIRED"], "conviction": "medium", "so_what": "Transparency into agent actions is a UX requirement; messaging-only agents may face trust friction.", "quote": null, "locator": "Most Annoying: Instinct", "quote_verified": false}]}, {"theme": "Agentic commerce and homogenization", "insights": [{"claim": "Walmart has created ways for third-party AI agents to use its shopping platform, while Amazon recently blocked Meta's Muse.", "speaker": "Reece Rogers", "type": "data_point", "entities": ["Walmart", "Amazon", "Meta", "Muse"], "conviction": "medium", "so_what": "Retailers are splitting on agent access, a key strategic fault line for e-commerce share and ad revenue.", "quote": "Walmart Wants Your AI Agent to Buy Your Groceries. Amazon Is Calling the Cops.", "locator": "Gemini Spark: 5/5. A conversational headline", "quote_verified": true}, {"claim": "All six agents recommended nearly identical restaurants for lunch and identical Beijing-Xi'an-Chengdu-Shanghai routes for a China trip, suggesting agents may herd consumers toward the same destinations, a new 'Lonely Planet effect'.", e in pre-launch testing of every component and configuration for Odyssey and MRO.", "speaker": "Meghan Bartels", "type": "causal", "entities": ["Mars Climate Orbiter", "Mars Polar Lander", "NASA", "JPL"], "conviction": "high", "so_what": "Costly failures under cost-cutting regimes drive the over-engineering that later yields durable assets.", "quote": null, "locator": "Experts say both spacecraft benefited from", "quote_verified": false}, {"claim": "NASA's principle of 'margin' meant MRO launched with a larger battery and more propellant than strictly needed, and that surplus is now what lets NASA hope to run it for another decade.", "speaker": "Meghan Bartels", "type": "framework", "entities": ["Mars Reconnaissance Orbiter", "NASA"], "conviction": "high", "so_what": "Spare capacity at launch is the main lever for extending mission life, a design tradeoff relevant to satellite operators.", "quote": null, "locator": "One key principle is what NASA", "quote_verified": false}, {"claim": "Because Mars bandwidth is limited and spacecraft may check in only once or twice a week, Mars craft must operate autonomously, and NASA duplicates vital power and computing parts so missions can run on spares.", "speaker": "Meghan Bartels", "type": "framework", "entities": ["NASA", "Rob Lillis"], "conviction": "high", "so_what": "Autonomy and redundancy are prerequisites for deep-space hardware, raising cost but enabling longevity.", "quote": "A Mars craft has to be able to manage by itself", "locator": "And whereas engineers can keep constant", "quote_verified": true}]}, {"theme": "Aging-asset problems", "insights": [{"claim": "MRO is old enough that stars in its onboard navigation atlas have measurably moved, confusing its orientation and forcing engineers to upload an updated star map last year.", "speaker": "Meghan Bartels", "type": "anecdote", "entities": ["Mars Reconnaissance Orbiter", "JPL", "Paul Fieseler"], "conviction": "high", "so_what": "Long-lived assets face unanticipated const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
