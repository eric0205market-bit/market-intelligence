title:"The Nvidia-sized hole in US GDP statistics: growth already understated by 0.3pp/yr, could hit 2pp by 2028",
idea:"US GDP statistics have a blind spot for fabless chipmakers like Nvidia: chips are designed in the US but manufactured, assembled and sold abroad, so no goods export is recorded (nothing physical leaves the US) and no IP export is recorded either (no explicit foreign payment for the IP). Epoch estimates this understates US GDP growth by ~0.3 percentage points over the past year, a gap that could widen to almost 2pp/year by 2028 if Nvidia's growth continues at its current pace.",
angle:"Reframes every 'the AI boom isn't showing up in GDP' debate — the accounting itself has a hole shaped exactly like Nvidia, and it compounds as Nvidia grows.",
tweetA:"Official GDP growth has been understating the AI boom's contribution by 0.3 percentage points a year — not because the value isn't real, but because a chip Nvidia designs in the US and sells from Taiwan literally has nowhere to be recorded in the accounts. Epoch says this gap could hit 2pp/year by 2028.",
tweetB:"Every 'the AI capex boom isn't showing up in the data' argument needs to reckon with this: the data itself has a hole shaped exactly like Nvidia. Fix the accounting and a meaningful chunk of the 'AI isn't paying off yet' narrative disappears with it.",
charts:{count:0,hot:false,desc:"Charts inside full report — worth opening."},
link:"https://epochai.substack.com/p/the-nvidia-sized-hole-in-us-gdp-statistics"},

angle:"Export controls have focused for years on data-center GPUs; nobody built a control regime for the $200 edge-AI board, and that gap is now being exploited for autonomous weapons.",

const CAT_COLORS = {macro:"var(--macro)",credit:"var(--credit)",positioning:"var(--positioning)",ai:"var(--ai)",crypto:"var(--crypto)",geopolitics:"var(--geopolitics)",energy:"var(--energy)",tech:"var(--tech)",gold:"var(--gold)",culture:"var(--culture)",labor:"var(--labor)",regulation:"var(--regulation)",science:"var(--science)",venture:"var(--venture)"};
const CAT_LABELS = {macro:"macro",credit:"credit",positioning:"positioning",ai:"AI/infra",crypto:"crypto",geopolitics:"geopolitics",energy:"energy",tech:"tech",gold:"gold",culture:"culture",labor:"labor",regulation:"regulation",science:"science",venture:"venture"};
const URG_LABELS = {act:"🔴 Act Now",deep:"🔵 Deep",watch:"🟡 Watch"};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function countBy(field, value){
  return ITEMS.filter(i => value === "all" ? true : i[field] === value).length;
}

function renderFilters(){
  const cats = [...new Set(ITEMS.map(i=>i.cat))];
  const catEl = document.getElementById('catFilters');
  catEl.innerHTML = '';
  const allPill = document.createElement('button');
  allPill.className = 'pill' + (activeCat==='all' ? ' active' : '');
  allPill.style.background = activeCat==='all' ? '#333' : 'transparent';
  allPill.innerHTML = 'All <span class="cnt">' + ITEMS.length + '</span>';
  allPill.onclick = function(){ activeCat='all'; activeSrc=null; renderFilters(); renderCards(); };
  catEl.appendChild(allPill);
  cats.forEach(function(c){
    const btn = document.createElement('button');
    const n = countBy('cat', c);
    btn.className = 'pill' + (activeCat===c ? ' active' : '');
    btn.style.background = activeCat===c ? CAT_COLORS[c] : 'transparent';
    btn.style.borderColor = activeCat===c ? CAT_COLORS[c] : 'var(--pill-border)';
    btn.style.color = activeCat===c ? '#fff' : 'var(--text)';
    btn.innerHTML = CAT_LABELS[c] + ' <span class="cnt">' + n + '</span>';
    btn.onclick = function(){ activeCat = (activeCat===c ? 'all' : c); activeSrc=null; renderFilters(); renderCards(); };
    catEl.appendChild(btn);
  });

  const urgEl = document.getElementById('urgFilters');
  urgEl.innerHTML = '';
  const urgs = ['act','deep','watch'];
  const allUrgPill = document.createElement('button');
  allUrgPill.className = 'pill' + (activeUrg==='all' ? ' active' : '');
  allUrgPill.style.background = activeUrg==='all' ? '#333' : 'transparent';
  allUrgPill.innerHTML = 'All <span class="cnt">' + ITEMS.length + '</span>';
  allUrgPill.onclick = function(){ activeUrg='all'; activeSrc=null; renderFilters(); renderCards(); };
  urgEl.appendChild(allUrgPill);
  urgs.forEach(function(u){
    const btn = document.createElement('button');
    const n = countBy('urgency', u);
    btn.className = 'pill' + (activeUrg===u ? ' active' : '');
    btn.style.background = activeUrg===u ? '#555' : 'transparent';
    btn.innerHTML = URG_LABELS[u] + ' <span class="cnt">' + n + '</span>';
    btn.onclick = function(){ activeUrg = (activeUrg===u ? 'all' : u); activeSrc=null; renderFilters(); renderCards(); };
    urgEl.appendChild(btn);
  });
}

function filterBySrc(name){
  activeCat = 'all';
  activeUrg = 'all';
  activeSrc = name;
  renderFilters();
  renderCards();
  document.getElementById('cards').scrollIntoView({behavior:'smooth'});
}

function renderCards(){
  const wrap = document.getElementById('cards');
  wrap.innerHTML = '';
  let list = ITEMS.filter(function(i){
    if(activeCat !== 'all' && i.cat !== activeCat) return false;
    if(activeUrg !== 'all' && i.urgency !== activeUrg) return false;
    if(activeSrc && i.source.indexOf(activeSrc) === -1) return false;
    return true;
  });
  list.forEach(function(item){
    const card = document.createElement('div');
    card.className = 'card' + (activeSrc ? ' open' : '');
    card.id = 'card-' + item.id;

    const urgEmoji = item.urgency === 'act' ? '🔴' : (item.urgency === 'deep' ? '🔵' : '🟡');
    const chartFlag = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');

    const head = document.createElement('div');
    head.className = 'card-head';
    head.innerHTML =
      '<span class="idx">#' + item.id + '</span>' +
      '<span class="urg">' + urgEmoji + '</span>' +
      '<span class="src-badge" style="background:' + CAT_COLORS[item.cat] + '">' + item.source.split(' / ')[0].split(',')[0].split(' (')[0] + '</span>' +
      '<span class="cat-tag">' + CAT_LABELS[item.cat] + '</span>' +
      (chartFlag ? '<span class="chart-flag">' + chartFlag + '</span>' : '') +
      '<span class="card-title">' + item.title + '</span>';
    head.onclick = function(){ card.classList.toggle('open'); };
    card.appendChild(head);

    const body = document.createElement('div');
    body.className = 'card-body';

    const chartClass = item.charts.hot ? 'chart-box hot' : 'chart-box';
    const chartHtml = '<div class="' + chartClass + '">' + (item.charts.hot ? '🔥 ' : (item.charts.count>0 ? '📊 ' : '')) + item.charts.desc + '</div>';

    body.innerHTML =
      '<div class="section-label">The Idea</div>' +
      '<div class="idea-text">' + item.idea + '</div>' +
      '<div class="section-label">My Angle</div>' +
      '<div class="angle-box" style="border-left-color:' + CAT_COLORS[item.cat] + '; background:' + CAT_COLORS[item.cat] + '14;">' + item.angle + '</div>' +
      '<div class="section-label">Tweets</div>' +
      '<div class="tweets">' +
        '<div class="tweet-box"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div>' +
          '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>' +
        '<div class="tweet-box"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div>' +
          '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>' +
      '</div>' +
      chartHtml +
      '<div class="link-row"><a href="' + item.link + '" target="_blank">↗ Read full article</a></div>';

    card.appendChild(body);
    wrap.appendChild(card);
  });
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function renderReport(){
  const el = document.getElementById('reportBody');
  let html = '';
  html += '<p><strong>Window:</strong> ' + META.windowStart + ' to ' + META.windowEnd + '. Emails outside this window were not processed.</p>';
  html += '<p>' + META.emailsInWindow + ' emails found in window, ' + META.emailsRead + ' read in full, ' + META.itemsExtracted + ' items extracted.</p>';
  html += '<h4>Included Sources</h4><ul>';
  META.includedSources.forEach(function(s){
    html += '<li><span class="src-link" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span> — ' + s.count + ' item' + (s.count>1?'s':'') + '</li>';
  });
  html += '</ul>';
  html += '<h4>Skipped Sources</h4><ul>';
  META.skippedSources.forEach(function(s){
    html += '<li><strong>' + s.name + '</strong> — ' + s.reason + '</li>';
  });
  html += '</ul>';
  el.innerHTML = html;
}

document.getElementById('metaLine').textContent = META.date + ' · ' + META.time + ' · ' + ITEMS.length + ' items from ' + META.emailsRead + ' emails';
renderFilters();
renderCards();
renderReport();
</script>
