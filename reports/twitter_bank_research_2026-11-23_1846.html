:root {

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }

.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);

.section { background: var(--surface); border: 1px solid var(--border);

.topic { border-bottom: 1px solid var(--border-light); }

.topic-name { flex: 1; }

.topic-body { display: none; padding: 4px 0 6px; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);

.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }

.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }

.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);

         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }

  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}

<script>
const REPORT_DATA = {"freshness_gate": "FRESHNESS GATE PASSED.", "report_type": "TWITTER BANK RESEARCH", "collected_at": "2026-11-23T18:23:22Z", "window_days": 4, "input_stats": {"total_tweets": 119, "considered": 119, "kept": 30, "dropped": 89, "deduped": 0}, "summary": "AI-unwind selloff research dominates: Goldman's Hedge Fund Trend Monitor shows the VIP longs basket down 8% YTD; Callahan flags the Fed hiking as a key difference vs past panics; Goldman FCI ex-equities at a new cycle high.\nBuy-the-dip split: Morgan Stanley's Wilson calls it a \"fat pitch\" below 7,100, while JPM's desk and Citi's equity trading strategy turn cautious.\nPositioning and flows: Deutsche discretionary positioning at the 5th percentile and systematic at the biggest underweight in 18 months; BofA SPX hedger gamma negative 11 straight days; Goldman record 4-week ACWI inflows.\nValuation charts: S&P 500 P/E down 30% in 12 months, global 24m forward P/E 13x, EM P/E under 8x (Goldman); Yardeni forward P/E 16.4 and year-end target cut to 7,500; Apollo on US ~75% of DM equity value.\nMacro: Citi Economic Surprise Index down to 51.2; Goldman labor-market perception and job-switching charts; core PCE preview; HSBC weekly data deck.\nPer-bank counts: Goldman 16, BofA 4, Yardeni 3, Citi 2, Deutsche 2, HSBC 2, JPM 2, Morgan Stanley 2, Apollo/Slok 1.", "by_bank_counts": {"Goldman": 16, "BofA": 4, "Yardeni": 3, "Citi": 2, "Deutsche": 2, "HSBC": 2, "JPM": 2, "Morgan Stanley": 2, "Apollo/Slok": 1}, "banks": [{"bank": "Goldman", "theme": "HF Trend Monitor VIP basket underperformance, Callahan on panic vs Fed hiking, FCI ex-equities cycle high, global and S&P 500 P/E compression, EPS revisions, record ACWI inflows, labor-market perception charts", "items": [{"author": "neilsethinew", "text": "Goldman’s quarterly Hedge Fund Trend Monitor (13F holdings at the start of Q4) shows the damage from the AI unwind. \n\nIts basket of hedge funds’ most popular longs (VIP) is down 8% YTD, and its 14-point underperformance over the past six months is the second worst in its 20-year history (only May 2022 was worse, at 15 points). \n\nLong/short net exposures rival April 2025 as the lowest since before Covid. Funds cut TMT and added to cyclicals (Financials, Discretionary, Industrials) and defensives (Staples, Utilities), and momentum exposure is the lowest since early 2023.", "tweet_url": "https://x.com/neilsethinew/status/2124914625128935645", "images": ["https://pbs.twimg.com/media/HX0rl-5XMAAupbd.jpg"], "created_at": "2026-11-23T17:15:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Workers' Perceptions of the Labor Market Have Deteriorated Since Last Year Despite a Stable Unemployment Rate...\n\nwith a Sharper Decline Among Young Workers https://t.co/EyvTRQlPDj", "tweet_url": "https://x.com/MikeZaccardi/status/2124896003597758607", "images": ["https://pbs.twimg.com/media/HX0lp8tWkAALxn9.png"], "created_at": "2026-11-23T16:01:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Morgan Stanley's Mike Wilson is doubling down on buying the selloff after the S&P 500 broke below his 7,100 downside target. In Monday's note, his team called it \"the fat pitch we have patiently been waiting for, and we're not going to miss it,\" adding that \"markets bottom on bad news and deleveraging. We have had a lot of both\" (via Bloomberg).\n\nHow we got here:\n\n▪️ In late September, he warned of a drop to as low as 7,100 before the bull market resumed.\n▪️ In early November, he said the correction was in its final innings, with a 7,100 to 7,300 range. On November 16, he raised his 12-month target to 8,700.\n▪️ On Friday, the S&P 500 closed at 6,910.39, 2.7% below the bottom of that range and 11.6% below the October 6 record. That capped a seven-day losing streak, the longest since February 2020.\n\nWhy he's pressing the call rather than backing off:\n\n▪️ He calls the break below his range an overshoot of fair value, driven by forced deleveraging. His team is more bullish tactically than at any time since early April.\n▪️ Sentiment: his sentiment indicator hit −1.6 and the VIX hit 36, both matching December 2018, and hedge fund positioning is similarly washed out.\n▪️ Valuation: the S&P 500's forward P/E has dropped from nearly 23 in late October to 16.5, below its 17.4 long-run average. The Nasdaq 100 is under 17, below its pandemic low.\n▪️ Earnings: by his math, stocks are pricing in about a 6% drop in 2027 earnings. He forecasts 14% growth, and consensus is 17%.\n▪️ He likes hyperscalers, industrials, quality cyclicals with improving estimates, and companies benefiting from AI adoption.\n▪️ The main risk is still a hawkish Fed. But he thinks market pricing is \"far too hawkish\" and expects a calmer message in December than some fear.\n\nThe history backs him, with a catch. Since 1990, the VIX has had 17 episodes where it first closed at 35 or higher (Friday's close was 35.89):\n\n▪️ The S&P 500 was higher 12 months later in 14 of the 17, with a median gain of 21.6%. That compares with 11.9% for any 12-month stretch since 1990.\n▪️ December 2018, the episode he compares this one to, was followed by a 37.1% gain.\n▪️ But the first spike often wasn't the low. In 8 of the 17, the S&P 500 fell more than 5% further within three months, including another 34.9% in 2008 and 24.9% in 2020.\n▪️ The three losing years were 2001 and 2008, both earnings recessions, and 2022, a Fed hiking cycle.\n\nHistory would indicate his call should hold unless earnings roll over or the Fed gets much more aggressive. The market is already pricing in an earnings drop he doesn't expect, so the bigger swing factor is the Fed, the one risk he concedes. \n\nMorgan Stanley chief economist Seth Carpenter acknowledged in his Sunday Start note (via ZeroHedge) that clients pushed back hard on the bank's \"Embracing Risk\" outlook, and that even if the bank is right, the path through 2027 \"will not be smooth or linear.\"", "tweet_url": "https://x.com/neilsethinew/status/2124895487895412840", "images": ["https://pbs.twimg.com/media/HX0lF94WIAAV07k.jpg"], "created_at": "2026-11-23T15:58:57.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Workers don't move for a new job much anymore GS https://t.co/VeVy228wrD", "tweet_url": "https://x.com/MikeZaccardi/status/2124892228552192422", "images": ["https://pbs.twimg.com/media/HX0iONzWkAAFTcJ.png"], "created_at": "2026-11-23T15:46:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "@C_Barraud's Morning Brief is packed with posts about the equity selloff (along with a lot of other stuff) including @MikeZaccardi's post that Goldman's US Financial Conditions Index excluding equities hit a new cycle high, \"along with intensely bearish Fed speak.\"\n\nThat fits with the analysis I ran in the Week Ahead:\n▪ Goldman's headline FCI tightened 46bp last week to 99.53, the biggest weekly tightening since March 2020 and the ninth-largest since 1990, leaving it the tightest since April 2025.\n▪ Stocks did most of it (about 35bp from Monday's close through Friday), with, with credit spreads and the dollar adding about 5bp each and lower long-term yields offsetting about 9bp.\n▪ The ex-equities line shows conditions outside of stocks were already tight. Goldman says the two series \"diverged\" over the past few years, but \"both series have tightened in recent months.\"\n▪ The Fed's own FCI-G said the same thing in October: stocks supplied 96% of what was left of the tailwind to growth, everything else netted to about zero, and interest rates had turned into a drag.\n▪ But the Fed isn't backing off. By my count all 16 of the 19 FOMC participants who have spoken on rates since the November 5 selloff have signaled more tightening, and Philadelphia's Paulson, one of the most dovish members, said Friday she'd be open to considering back-to-back hikes.\n\nSo we've clearly not gotten to the point of a \"Fed put,\" but with the biggest accommodative factor quickly losing steam, the words \"policy mistake\" are being uttered more and more. \n\nOne silver lining: after the 12 prior weeks since 1990 when Goldman's FCI tightened 41bp or more, the S&P 500 was higher three months later 11 times (median +6.5%, about double normal), though the first week was a coin flip and October 2008 was the big exception.", "tweet_url": "https://x.com/neilsethinew/status/2124861615514239064", "images": ["https://pbs.twimg.com/media/HX0E5C3WoAAqdd9.jpg"], "created_at": "2026-11-23T13:44:21.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Investors have been pouring cash into global stocks in recent weeks GS... record 4-week average inflow $ACWI https://t.co/2DlM1Rc002", "tweet_url": "https://x.com/MikeZaccardi/status/2124850704980308135", "images": ["https://pbs.twimg.com/media/HXz8dOuWEAAj-3Z.png"], "created_at": "2026-11-23T13:01:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman's Callahan notes that:\n\n\"Generally speaking, panic like we’ve recently seen has been a good opportunity to start adding risk. But, there are two important differences with today’s setup that we’re getting pushback on. \n\n\"The first is the Fed, which is hiking rather than cutting. It doesn’t change the tactical setup, however in the five episodes where panic exceeded 9 during a hiking regime, subsequent three-month returns averaged just +0.4%.\"", "tweet_url": "https://x.com/neilsethinew/status/2124850257699668245", "images": ["https://pbs.twimg.com/media/HXz8DHNXgAA351K.png"], "created_at": "2026-11-23T12:59:13.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Bonds with nice diversification benefits in the last 7 weeks GS https://t.co/jYB98lbOCb", "tweet_url": "https://x.com/MikeZaccardi/status/2124848188729233454", "images": ["https://pbs.twimg.com/media/HXz6KxbWcAERTrL.png"], "created_at": "2026-11-23T12:51:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Emerging Markets P/E with a 7-handle GS https://t.co/xwdYoEnr15", "tweet_url": "https://x.com/MikeZaccardi/status/2124845672222322729", "images": ["https://pbs.twimg.com/media/HXz34SLXkAADKeU.png"], "created_at": "2026-11-23T12:41:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "The 24m forward global P/E has plunged to 13x GS $ACWI https://t.co/vtVgz3260n", "tweet_url": "https://x.com/MikeZaccardi/status/2124844413608210936", "images": ["https://pbs.twimg.com/media/HXz2vBFXsAAegbq.png"], "created_at": "2026-11-23T12:36:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Will we see negative earnings revisions soon? EPS estimates holding high. GS https://t.co/AxRfqLydGW", "tweet_url": "https://x.com/MikeZaccardi/status/2124842526028775879", "images": ["https://pbs.twimg.com/media/HXz1BJVWwAApZKg.png"], "created_at": "2026-11-23T12:28:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: The S&P 500 P/E ratio has fallen 30% in the last 12 months \n\nHuge valuation bear market https://t.co/Y1TrRItZAv", "tweet_url": "https://x.com/MikeZaccardi/status/2124841268123513069", "images": ["https://pbs.twimg.com/media/HXzz37dWUAAwfoQ.png"], "created_at": "2026-11-23T12:23:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: The S&P 500 is down 12% from its peak, and the Nasdaq is down more than 19%. \nLooking at Cyclicals vs. Defensives, we think positioning and valuations have reset https://t.co/8LsnskR76b", "tweet_url": "https://x.com/MikeZaccardi/status/2124840009823903916", "images": ["https://pbs.twimg.com/media/HXzyusFWkAAZaCy.png"], "created_at": "2026-11-23T12:18:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Oct core PCE prints Weds morning... a hot 0.3% expected... annualizes to 3.7% GS https://t.co/39L5iyJl63", "tweet_url": "https://x.com/MikeZaccardi/status/2124838751692034259", "images": ["https://pbs.twimg.com/media/HXzxlcNWcAAip9z.png"], "created_at": "2026-11-23T12:13:30.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"Over the course of 2 // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
