<script>
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

var state = { cat: 'all', urg: 'all', src: null };

function esc(s){
  var d = document.createElement('div');
  d.innerText = s;
  return d.innerHTML;
}

function hexToRgba(hex, a){
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

function buildHeader(){
  document.getElementById('headerMeta').textContent =
    META.date + '  ·  ' + META.time + '  ·  ' + META.itemsExtracted + ' items';
}

function buildFilters(){
  var catCounts = {};
  ITEMS.forEach(function(i){ catCounts[i.cat] = (catCounts[i.cat]||0) + 1; });
  var catRow = document.getElementById('catFilters');
  var allBtn = document.createElement('button');
  allBtn.className = 'pill active';
  allBtn.textContent = 'All (' + ITEMS.length + ')';
  allBtn.dataset.cat = 'all';
  allBtn.onclick = function(){ setCatFilter('all'); };
  catRow.appendChild(allBtn);
  Object.keys(catCounts).sort().forEach(function(cat){
    var b = document.createElement('button');
    b.className = 'pill';
    b.textContent = cat + ' (' + catCounts[cat] + ')';
    b.dataset.cat = cat;
    b.onclick = function(){ setCatFilter(cat); };
    catRow.appendChild(b);
  });

  var urgCounts = {act:0, deep:0, watch:0};
  ITEMS.forEach(function(i){ urgCounts[i.urgency] = (urgCounts[i.urgency]||0) + 1; });
  var urgRow = document.getElementById('urgFilters');
  var allUrg = document.createElement('button');
  allUrg.className = 'pill active';
  allUrg.textContent = 'All (' + ITEMS.length + ')';
  allUrg.dataset.urg = 'all';
  allUrg.onclick = function(){ setUrgFilter('all'); };
  urgRow.appendChild(allUrg);
  ['act','deep','watch'].forEach(function(u){
    var b = document.createElement('button');
    b.className = 'pill';
    b.textContent = URG_META[u].emoji + ' ' + URG_META[u].label + ' (' + urgCounts[u] + ')';
    b.dataset.urg = u;
    b.onclick = function(){ setUrgFilter(u); };
    urgRow.appendChild(b);
  });
}

function setCatFilter(cat){
  state.cat = cat; state.src = null;
  document.querySelectorAll('#catFilters .pill').forEach(function(b){
    var active = b.dataset.cat === cat;
    b.classList.toggle('active', active);
    b.style.background = active && cat !== 'all' ? CAT_COLORS[cat] : (active ? '#333' : 'transparent');
    b.style.borderColor = active ? (cat !== 'all' ? CAT_COLORS[cat] : '#333') : '#ccc7bd';
  });
  render();
}

function setUrgFilter(urg){
  state.urg = urg; state.src = null;
  document.querySelectorAll('#urgFilters .pill').forEach(function(b){
    var active = b.dataset.urg === urg;
    b.classList.toggle('active', active);
    b.style.background = active ? '#333' : 'transparent';
    b.style.borderColor = active ? '#333' : '#ccc7bd';
  });
  render();
}

function filterBySrc(name){
  state.src = name; state.cat = 'all'; state.urg = 'all';
  document.querySelectorAll('#catFilters .pill').forEach(function(b){
    b.classList.toggle('active', b.dataset.cat === 'all');
    b.style.background = b.dataset.cat === 'all' ? '#333' : 'transparent';
    b.style.borderColor = b.dataset.cat === 'all' ? '#333' : '#ccc7bd';
  });
  document.querySelectorAll('#urgFilters .pill').forEach(function(b){
    b.classList.toggle('active', b.dataset.urg === 'all');
    b.style.background = b.dataset.urg === 'all' ? '#333' : 'transparent';
    b.style.borderColor = b.dataset.urg === 'all' ? '#333' : '#ccc7bd';
  });
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function buildCard(item){
  var color = CAT_COLORS[item.cat] || '#888';
  var card = document.createElement('div');
  card.className = 'card';
  card.id = 'card-' + item.id;

  var head = document.createElement('div');
  head.className = 'card-head';
  head.onclick = function(){ card.classList.toggle('open'); };

  var chartFlag = '';
  if (item.charts && item.charts.hot) chartFlag = '🔥';
  else if (item.charts && item.charts.count > 0) chartFlag = '📊';

  head.innerHTML =
    '<span class="idx">' + String(item.id).padStart(2,'0') + '</span>' +
    '<span class="urg">' + URG_META[item.urgency].emoji + '</span>' +
    '<span class="src-badge" style="background:' + color + '">' + esc(item.source.split(' / ')[0].split(' (')[0]) + '</span>' +
    '<span class="cat-tag">' + esc(item.cat) + '</span>' +
    (chartFlag ? '<span class="chart-flag">' + chartFlag + '</span>' : '') +
    '<span class="card-title">' + esc(item.title) + '</span>' +
    '<span class="chevron">▸</span>';

  var body = document.createElement('div');
  body.className = 'card-body';

  var chartHtml = '';
  if (item.charts && item.charts.count > 0 || (item.charts && item.charts.desc)) {
    chartHtml =
      '<div class="chart-box' + (item.charts.hot ? ' hot' : '') + '">' +
      (item.charts.hot ? '🔥 CHART WORTH SAVING — ' : '📊 ') +
      esc(item.charts.desc) +
      '</div>';
  }

  body.innerHTML =
    '<div class="section-label">The Idea</div>' +
    '<div class="idea-text">' + esc(item.idea) + '</div>' +
    '<div class="section-label">My Angle</div>' +
    '<div class="angle-box" style="border-left:2px solid ' + color + '; background:' + hexToRgba(color,0.07) + ';">' + esc(item.angle) + '</div>' +
    '<div class="tweets">' +
      '<div class="tweet">' +
        '<div class="tweet-label a">TWEET A</div>' +
        '<div class="tweet-text">' + esc(item.tweetA) + '</div>' +
        '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button>' +
      '</div>' +
      '<div class="tweet">' +
        '<div class="tweet-label b">TWEET B</div>' +
        '<div class="tweet-text">' + esc(item.tweetB) + '</div>' +
        '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button>' +
      '</div>' +
    '</div>' +
    chartHtml +
    '<a class="read-link" href="' + item.link + '" target="_blank" rel="noopener">↗ Read full article</a>';

  card.appendChild(head);
  card.appendChild(body);
  return card;
}

function render(){
  var container = document.getElementById('cards');
  container.innerHTML = '';
  ITEMS.forEach(function(item){
    var show = true;
    if (state.cat !== 'all' && item.cat !== state.cat) show = false;
    if (state.urg !== 'all' && item.urgency !== state.urg) show = false;
    if (state.src && item.source.indexOf(state.src) === -1) show = false;
    var card = buildCard(item);
    if (!show) card.classList.add('hidden');
    if (state.src && show) card.classList.add('open');
    container.appendChild(card);
  });
}

function buildReport(){
  var body = document.getElementById('reportBody');
  var html = '';
  html += '<h4>Time Window</h4>';
  html += '<div>' + META.windowStart + ' &rarr; ' + META.windowEnd + '. Emails outside this window were not processed.</div>';
  html += '<h4>Coverage</h4>';
  html += '<div>Emails in window: ' + META.emailsInWindow + ' &nbsp;·&nbsp; Emails read: ' + META.emailsRead + ' &nbsp;·&nbsp; Items extracted: ' + META.itemsExtracted + '</div>';
  html += '<h4>Included Sources</h4>';
  META.includedSources.forEach(function(s){
    html += '<div class="skip-item"><span class="src-link" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + esc(s.name) + '</span> — ' + s.count + ' item' + (s.count===1?'':'s') + '</div>';
  });
  html += '<h4>Skipped</h4>';
  META.skippedSources.forEach(function(s){
    html += '<div class="skip-item">' + esc(s.name) + ' — ' + esc(s.reason) + '</div>';
  });
  html += '<div class="totals">Total: ' + META.emailsInWindow + ' emails in window, ' + META.emailsRead + ' read, ' + META.itemsExtracted + ' items extracted, ' + META.skippedSources.length + ' skipped.</div>';
  body.innerHTML = html;

  document.getElementById('reportHead').onclick = function(){
    document.getElementById('reportCard').classList.toggle('open');
  };
}

buildHeader();
buildFilters();
render();
buildReport();
</script>
