    {name:"Bloomberg / John Authers", emails:1, count:3},
    {name:"HFIR", emails:1, count:1},
    {name:"Vik's Newsletter", emails:1, count:1}
  ],
  skippedSources: []
};

const CAT_LABELS = {macro:"macro", credit:"credit", positioning:"positioning", aiinfra:"AI/infra", crypto:"crypto",
  geopolitics:"geopolitics", energy:"energy", tech:"tech", gold:"gold", culture:"culture", labor:"labor",
  regulation:"regulation", science:"science", venture:"venture", commodities:"commodities"};
const CAT_VAR = {macro:"--macro", credit:"--credit", positioning:"--positioning", aiinfra:"--aiinfra", crypto:"--crypto",
  geopolitics:"--geopolitics", energy:"--energy", tech:"--tech", gold:"--gold", culture:"--culture", labor:"--labor",
  regulation:"--regulation", science:"--science", venture:"--venture", commodities:"--commodities"};
const URG_LABELS = {actnow:"🔴 Act Now", deep:"🔵 Deep", watch:"🟡 Watch"};
const URG_EMOJI = {actnow:"🔴", deep:"🔵", watch:"🟡"};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function catColor(cat){ return getComputedStyle(document.documentElement).getPropertyValue(CAT_VAR[cat]).trim(); }

function buildFilterBars(){
  const catCounts = {};
  ITEMS.forEach(i => { catCounts[i.cat] = (catCounts[i.cat]||0)+1; });
  const catbar = document.getElementById('catbar');
  let html = '<button class="pill active" data-cat="all" onclick="setCat(\'all\')">All (' + ITEMS.length + ')</button>';
  Object.keys(CAT_LABELS).forEach(function(c){
    if (!catCounts[c]) return;
    html += '<button class="pill" data-cat="' + c + '" onclick="setCat(\'' + c + '\')" style="--pc:' + catColor(c) + '">' + CAT_LABELS[c] + ' (' + catCounts[c] + ')</button>';
  });
  catbar.innerHTML = html;

  const urgCounts = {};
  ITEMS.forEach(i => { urgCounts[i.urgency] = (urgCounts[i.urgency]||0)+1; });
  const urgbar = document.getElementById('urgbar');
  let uhtml = '<button class="pill active" data-urg="all" onclick="setUrg(\'all\')">All (' + ITEMS.length + ')</button>';
  Object.keys(URG_LABELS).forEach(function(u){
    if (!urgCounts[u]) return;
    uhtml += '<button class="pill" data-urg="' + u + '" onclick="setUrg(\'' + u + '\')">' + URG_LABELS[u] + ' (' + urgCounts[u] + ')</button>';
  });
  urgbar.innerHTML = uhtml;
}

function setCat(c){
  activeCat = c; activeSrc = null;
  document.querySelectorAll('#catbar .pill').forEach(function(b){
    var isActive = b.getAttribute('data-cat') === c;
    b.classList.toggle('active', isActive);
    if (isActive && c !== 'all') { b.style.background = 'var(' + CAT_VAR[c] + ')'; }
    else { b.style.background = ''; }
  });
  render();
}
function setUrg(u){
  activeUrg = u; activeSrc = null;
  document.querySelectorAll('#urgbar .pill').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-urg') === u);
  });
  render();
}
function filterBySrc(name){
  activeSrc = name; activeCat = "all"; activeUrg = "all";
  document.querySelectorAll('#catbar .pill').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-cat')==='all'); b.style.background=''; });
  document.querySelectorAll('#urgbar .pill').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-urg')==='all'); });
  render(true);
}

function toggleCard(id){
  var el = document.getElementById('card-' + id);
  el.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function render(forceExpandSrc){
  var container = document.getElementById('cards');
  var html = '';
  ITEMS.forEach(function(item){
    var visible = true;
    if (activeSrc) { visible = item.source.indexOf(activeSrc) !== -1; }
    else {
      if (activeCat !== 'all' && item.cat !== activeCat) visible = false;
      if (activeUrg !== 'all' && item.urgency !== activeUrg) visible = false;
    }
    if (!visible) return;
    var col = catColor(item.cat);
    var chartInd = item.charts.count > 0 ? (item.charts.hot ? '🔥' : '📊') : '';
    var openClass = (activeSrc && forceExpandSrc) ? ' open' : '';
    html += '<div class="card' + openClass + '" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">#' + item.id + '</span>';
    html += '<span>' + URG_EMOJI[item.urgency] + '</span>';
    html += '<span class="badge" style="background:' + col + '">' + item.source + '</span>';
    html += '<span class="tag">' + CAT_LABELS[item.cat] + '</span>';
    if (chartInd) html += '<span class="chart-ind">' + chartInd + '</span>';
    html += '<span class="title">' + item.title + '</span>';
    html += '</div>';
    html += '<div class="card-body">';
    html += '<div class="blk-label">The Idea</div><div class="idea">' + item.idea + '</div>';
    html += '<div class="blk-label">My Angle</div><div class="angle" style="border-left:2px solid ' + col + ';background:' + col + '14;">' + item.angle + '</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    var chartClass = item.charts.hot ? 'chart-box hot' : 'chart-box';
    html += '<div class="' + chartClass + '">' + (item.charts.count > 0 ? (item.charts.count + ' chart(s) — ') : 'No charts in email — ') + item.charts.desc + '</div>';
    html += '<div class="link-row"><a href="' + item.link + '" target="_blank">↗ Read full article</a></div>';
    html += '</div></div>';
  });
  if (!html) html = '<p style="color:var(--text-dim)">No items match this filter.</p>';
  container.innerHTML = html;
}

function buildReport(){
  var body = document.getElementById('reportbody');
  var html = '';
  html += '<table>';
  html += '<tr><td><strong>Window</strong></td><td>' + META.windowStart + ' &rarr; ' + META.windowEnd + '</td></tr>';
  html += '<tr><td><strong>Emails in window</strong></td><td>' + META.emailsInWindow + '</td></tr>';
  html += '<tr><td><strong>Emails read</strong></td><td>' + META.emailsRead + '</td></tr>';
  html += '<tr><td><strong>Items extracted</strong></td><td>' + META.itemsExtracted + '</td></tr>';
  html += '</table>';
  html += '<div class="blk-label" style="margin-top:14px;">Included sources</div><ul>';
  META.includedSources.forEach(function(s){
    html += '<li><span class="src" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span> — ' + s.emails + ' email(s), ' + s.count + ' item(s)</li>';
  });
  html += '</ul>';
  html += '<div class="blk-label">Skipped sources</div>';
  if (META.skippedSources.length === 0) {
    html += '<p>None — every email in the 6-hour window had extractable content.</p>';
  } else {
    html += '<ul>';
    META.skippedSources.forEach(function(s){ html += '<li>' + s.name + ' — ' + s.reason + '</li>'; });
    html += '</ul>';
  }
  body.innerHTML = html;
}

document.getElementById('metaline').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails';
buildFilterBars();
render();
buildReport();
</script>
</body>
</html>
