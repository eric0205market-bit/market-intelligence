<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Institutional Research</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #7c3aed;          /* purple — institutional report accent */
  --accent-soft: #f3eefc;
  --divergence: #d94052;      /* divergence red */
  --consensus: #15803d;       /* consensus green */
  --yellow: #fff5b3;

  /* category colors (institutional schema: rates, growth, fx, equities,
     credit, crypto, energy, commodities, geopolitics, ai_tech, em) */
  --cat-rates: #2563eb;
  --cat-growth: #d97706;
  --cat-fx: #0891b2;
  --cat-equities: #15803d;
  --cat-credit: #be185d;
  --cat-crypto: #8b5cf6;
  --cat-energy: #dc2626;
  --cat-commodities: #ea580c;
  --cat-geopolitics: #b91c1c;
  --cat-ai_tech: #4f46e5;
  --cat-em: #059669;
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 980px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 12px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* STATS BAR (top: period + coverage) */
.stats-top { margin-bottom: 16px; padding: 8px 12px; background: var(--surface);
             border: 1px solid var(--border); border-radius: 6px;
             font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
             color: var(--text-2); display: flex; gap: 16px; flex-wrap: wrap; }
.stats-top strong { color: var(--text); font-weight: 600; }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 10px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* THEME CARD (Section A) */
.theme { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.theme:last-child { border-bottom: none; }
.theme-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
              flex-wrap: wrap; }
.theme-title { font-weight: 600; font-size: 14.5px; }
.theme-stance { display: grid; grid-template-columns: 1fr; gap: 6px; margin-bottom: 10px; }
@media (min-width: 720px) { .theme-stance { grid-template-columns: 1fr 1fr; } }
.theme-line { font-size: 13px; padding: 8px 10px; border-radius: 4px;
              border-left: 3px solid var(--border); background: #fafafa; line-height: 1.5; }
.theme-line.consensus { border-left-color: var(--consensus); background: #f0f9f3; }
.theme-line.divergence { border-left-color: var(--divergence); background: #fdf6f7; }
.theme-line .lbl { font-family: 'IBM Plex Mono', monospace; font-size: 10px;
                   text-transform: uppercase; letter-spacing: .06em;
                   color: var(--text-3); display: block; margin-bottom: 2px; }
.theme-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
               border-left: 2px solid var(--border-light); }
.theme-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-source { font-weight: 600; color: var(--accent); }
a.item-source { text-decoration: none; }
a.item-source:hover { text-decoration: underline; }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-title { font-weight: 600; font-size: 14px; margin: 4px 0 6px; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DEEP READS (Section C) — purple left border to mark flagship long-form */
.section-deepreads .item-card { border-left: 4px solid var(--accent); background: var(--accent-soft); }

/* HOUSE VIEWS — compact one-line-per-source list */
.hv-row { display: flex; gap: 10px; align-items: baseline;
          padding: 6px 16px; border-bottom: 1px solid var(--border-light);
          font-size: 13px; }
.hv-row:last-child { border-bottom: none; }
.hv-name { font-weight: 600; color: var(--accent); min-width: 180px;
           text-decoration: none; }
.hv-name:hover { text-decoration: underline; }
.hv-stance { color: var(--text); flex: 1; }

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 110px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .hv-row { flex-direction: column; gap: 2px; }
  .hv-name { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "INSTITUTIONAL RESEARCH", "collected_at": "2026-10-04T02:01:47.000Z", "period": {"lookback_days": 10, "from": "2026-09-24", "to": "2026-10-03"}, "input_stats": {"total_articles": 420, "sources_present": 52, "after_filter": 295}, "summary": "**Fed / US rates:** Consensus is a **hawkish-but-near-done Fed** after the **25bp September hike to 3.75–4.0%**; the soft **+29k September payrolls** and **0.2% m/m / 3.0% y/y core PCE** cut October-hike odds to ~20%. Sharpest split is size of the path: markets still price **~3–4 more hikes** (**Goldman, UBS, Standard Chartered, Amundi** say too much; Goldman has one more in **December**, SC two more by June 2027), while **BNP, Oxford Economics, BCA's Budaghyan and Gavekal** worry about overheating and sticky inflation.\n\n**Treasuries / duration:** The **10y hit 5.34% intraday (24-year high; 30y >5.6%)**, with real yields (~2.90%) doing the work. **Standard Chartered** initiates a long 10y at 5.2% and **BNY/Vanguard** see yields getting attractive, but **BNP** is underweight governments, **Gavekal** prefers cash over bonds and **BCA (Budaghyan)** says the selloff continues until the **S&P 500 falls double digits**.\n\n**Europe / UK / Japan:** **ECB (two hikes in 2026, deposit 2.5%)**, **BoE (Bank Rate 4%)** and **BoJ (1.25%)** are all in tightening mode; **Goldman** sees one more ECB hike (**Dec, to 2.75%**) and doubts rates stay well above 3%, whereas **BNP** calls market pricing in Europe/UK overly aggressive. **French OAT-Bund spread hit 127bp**, the widest since 2012 (Gavekal, SC).\n\n**Oil / energy:** **Brent ~$96–107** with no end to the Iran conflict (UBS, BNP); **Yardeni** says Gulf flows are back to ~98% of pre-war via workarounds, **UBS** sees de-escalation incentives, while **Goldman/Wood Mackenzie** flag European gas (TTF ~2x since June) and a possible **US diesel export ban** (**RBC**: odds rising before midterms; Energy Secretary Wright opposed).\n\n**US equities / AI:** Consensus is **OW equities on an earnings boom** (Barclays, SC, UBS, BNP, Deutsche, Yardeni S&P 7,900 YE target). Dissent: **BCA** (AI stocks peak before capex; MacroQuant UW equities/bonds, OW cash), **Oxford Economics** (AI capex = **27% of US fixed investment**; downturn risk) and **Goldman's Pasquariello** (bond market is the #1 risk).\n\n**Dollar / credit:** **BCA lifts its DXY target to 105** while **Standard Chartered** expects the dollar to peak within weeks (DXY 102.1). In credit, **BCA/BNP** are OW high yield, **Deutsche** prefers IG and warns on tight HY, and **PIMCO** says AI supply is repricing hyperscalers, not crowding out others.\n\n**Geopolitics / EM:** Trump–Xi summit gave **tariff cuts on $60bn of goods and a truce to Jan 2027** (Capital Economics: just ~10% of trade; Barclays: \"stability without resolution\"); **Gavekal** warns Europe may open a trade fight with China; **BCA** stays downbeat on EM equities while **BNP/SC** are OW.\n\n**Crypto:** **Bitcoin ~$84–88k**, helped by lower hike odds and **$1bn single-day ETP inflow (largest of 2026, Galaxy)**; **CLARITY Act failed cloture 49–50**, so the **SEC framework** is operative (CoinShares); the **$387.5m Bitget hack** (Galaxy: Lazarus pattern) is the idiosyncratic risk.", "sections": {"A_debates": [{"theme": "Fed Path & US Rates", "category": ["rates"], "consensus": "The street agrees the Fed under Chair Warsh delivered a deliberately hawkish 25bp hike in September (to 3.75–4.0%) and that it is close to done: Goldman (Hatzius) says no major further tightening is needed and has moved its next and final hike from October to December; UBS's base case is a December hike then a hold, with the median Fed projection implying no move in 2027; Standard Chartered expects two further 25bp hikes by June 2027 (75bp for the cycle) and a cut in H2 2027. The data after the hike leaned dovish: September payrolls +29k vs ~90k expected with 60k of downward revisions, core PCE +0.2% m/m (3.0% y/y, ~35bp lower after revisions), and New York Fed's Williams, Jefferson and Bowman signalling less urgency. October-hike odds fell from ~75% to ~20% (CoinShares).", "divergence": "Markets still price roughly three to four more hikes (BNY: ~4 through 2027; Goldman trading desk: ~4; SC: ~85–95bp over 12 months), and houses split on whether that is too much. Goldman, UBS, SC and Amundi (central banks to tighten 'by less than markets price') say it is overdone, and Goldman even flags a possible one-and-done if CPI stays near 0.2%. On the other side, BNP warns that PMIs (S&P flash composite 58.4, strongest since July 2021) raise the risk of overheating and more hikes than priced; Oxford Economics rejects the 'bullish hike' idea and says fiscal and AI-productivity effects push yields up regardless; Gavekal frames the US as in an inflationary boom; NDR notes the Fed 'could raise rates again before year-end'. BCA is split internally: Swift's bond team says the labor market is not inflationary and PCE revisions narrow the inflation gap (supporting patience), while Budaghyan says bonds keep selling off until equities fall double digits. PIMCO adds that the financial-conditions tightening since June is nowhere near the 2022 adjustment, and Warsh explicitly targets financial conditions.", "items": [{"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Hatzius: pushes next/final Fed hike to December from October after PCE, Williams/Jefferson and the jobs report; markets pricing three hikes is 'not necessary'; one-and-done possible if CPI stays ~0.2%. Financial conditions ex-equities are tight but overall only a small headwind; growth ~trend.", "url": "https://www.goldmansachs.com/insights/videos/cnbc-jan-hatzius-outlook-for-us-economy", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "UBS: base case Fed hikes in December then holds; 10y touched 5.34% before reversing on comments from Fed officials that they are not in a hurry. Consensus +90k payrolls; claims 197k.", "url": "https://www.ubs.com/us/en/wealth-management/insights/investment-research/insights-display-adp/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-02102026.html?caasID=CAAS-ActivityStream", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "PIMCO (Wilding/Scott): central banks (Fed, ECB, BoJ, RBA) now explicitly target financial conditions; Warsh described the hike as 'removing a dose of accommodation'. Equities have eased conditions, but higher rates since June tighten them; the needed tightening is far smaller than 2022. Output gap estimated 1–1.5ppt above potential implying only a 0.1–0.3ppt inflation impulse.", "url": "https://www.pimco.com/us/en/insights/monetary-policy-through-the-lens-of-financial-conditions", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "BCA (Essentials): September jobs 'take pressure off the Fed to hike in October' (NFP +29k, -60k revisions); financial conditions tightening points to cooler surprises.", "url": "https://www.bcaresearch.com/marketing/felix-antoine-vezina-poirier", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "BCA (Swift): the stable jobs market is not driving inflation, so it is second-order for the Fed's near-term decision.", "url": "https://www.bcaresearch.com/reports/us-labor-market-chartpack-stable-jobs-market-not-driving-inflation-02-10-2026/227069", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "Oxford Economics: little basis for 'bullish rate hikes' under Warsh; US inflation has grown stickier, which could push the Fed toward more hikes; fiscal profligacy and AI productivity could lift yields more than cyclical hikes.", "url": "https://www.oxfordeconomics.com/resource/a-hawkish-federal-reserve-wont-deliver-bullish-hikes/", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "thesis": "BNP Paribas AM: strong US growth raises rate risks; overheating risk means yields may stay elevated even if oil falls; if fed funds expectations rise further the adjustment could be painful.", "url": "https://viewpoint.bnpparibas-am.com/monthly-market-views-us-growth-market-mispricing-and-gold-resilience/", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "CoinShares: Williams said the hike reduced urgency; implied October-hike probability fell from ~75% to ~50% then ~37%, and to ~20% after payrolls (+29k, unemployment 4.2%).", "url": "https://coinshares.com/insights/research-data/market-update-02-10-2026/", "images": []}]}, {"theme": "Treasuries, Term Premium & Duration", "category": ["rates"], "consensus": "Everyone agrees the move is historic: the 10y yield rose ~50–55bp in September (115–125bp YTD), touched 5.34% on 1 October (highest since 2002/2007 depending on source) and settled ~5.24%; the 30y briefly passed 5.6%. The drivers named are strong growth, an oil-led inflation scare, heavy supply (hyperscaler issuance, deficits) and a fading 'scarcity premium' as yield-insensitive buyers retreat (BNP, Amundi). Breakevens are stable (~2.35%), so the move is in real yields (~2.90%, highest since 2008; BNY, Oxford).", "divergence": "Whether to buy the dip is the live disagreement. Standard Chartered initiates a long 10y at 5.2% (12-month yield target 4.75–5.0%; losses under 1% if yields hit 6% vs 6%+ gains below 5%; prefers 3–7y for income), and Vanguard and BNY say starting yields are increasingly attractive. BNY nevertheless warns that in the last seven first-hike cycles the 10y rose a further 43bp on average within six months, so risk is skewed higher. BNP is underweight governments on a structural term-premium rise, Gavekal's Denyer argues for cash over bonds (while adding TIPS and energy alongside nominal bonds), Goldman's Pasquariello says shorting bonds is a useful equity hedge, and BCA's Budaghyan expects Treasuries to keep selling off until a double-digit S&P decline cools nominal growth. UBS thinks catalysts (soft PCE, de-escalation) could stabilise the market and rates Fixed Income 'Attractive'. Oxford Economics asks whether four more hikes priced is too aggressive but sees structural reasons (end of savings glut, fiscal) for higher yields.", "items": [{"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Standard Chartered Market Watch: initiates long opportunistic US 10y at 5.2%; next resistance 5.47%/5.53%; expects 50bp of further hikes by June 2027 vs ~95bp priced; CTAs extremely short, so short-covering risk if data miss.", "url": "https://www.sc.com/sg/market-outlook/market-watch-28-9-2026/?mvog=1", "images": []}, {"source": "bny", "name": "BNY Investments", "thesis": "BNY: 10y ~5.30%, real yield 2.90% highest since 2008, 10y breakeven ~2.35%; history says yields can rise further (avg +43bp in 6 months after first hike) but current levels 'increasingly attractive'.", "url": "https://www.bny.com/investments/us/en/individual/articles/markets-and-economy/treasury-yields-push-to-multi-decade-highs--and-history-says-the.html", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "BCA (Budaghyan): US bonds keep selling off until tighter financial conditions (plausibly a double-digit S&P drop) cool nominal growth; AI stocks will peak well ahead of AI capex; downbeat EM equities.", "url": "https://www.bcaresearch.com/reports/bond-riot-ai-peak-and-em-mirage-01-10-2026/227052", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Gavekal (Denyer/Tan): US is in an AI- and energy-driven inflationary boom that favours tech, energy and cash over bonds; add TIPS and energy stocks alongside high-grade nominal bonds against regime change.", "url": "https://research.gavekal.com/teaser/us-strategy-after-the-inflationary-boom/", "images": []}, {"source": "vanguard", "name": "Vanguard", "thesis": "Vanguard: 2026 'looks very little like 2022' – yields to worst far higher; sharp yield spikes have historically preceded strong Agg returns.", "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/how-2026-may-set-table-stronger-bond-returns.html", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "Oxford Economics: global bond selloff is a 'renormalization' from the 2010s; TIPS yields, not breakevens, are driving it; asks if forwards pricing four more hikes is too aggressive and if yields will spoil the equity party.", "url": "https://www.oxfordeconomics.com/resource/bond-selloff-the-end-of-the-beginning-or-beginning-of-the-end/", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "thesis": "BNP (Morris): 10y +60bp since 4 Aug; bond–oil correlation has broken; tech +9% vs non-tech ACWI -8% over the same window; yields have exceeded nominal GDP growth, historically unusual.", "url": "https://www.bnpparibas-am.com/en/front-of-mind/view-from-the-markets-is-this-the-new-old-normal-for-government-bond-yields/", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Gavekal (Gemehl): French OAT-Bund spread +40bp in three weeks to 127bp, the widest since June 2012; differs from euro crisis because French yields are rising outright.", "url": "https://research.gavekal.com/teaser/how-wide-can-french-spreads-get/", "images": []}]}, {"theme": "ECB, BoE, BoJ & European Fiscal Stress", "category": ["rates", "fx"], "consensus": "Most major central banks are tightening against an energy shock: the ECB has hiked twice in 2026 (deposit 2.5%; markets ~90% for one more by year-end per SC), the BoJ has hiked twice (to 1.25%) and the BoE is at 4% with hawkish messaging (NDR). BoE speakers frame policy as already leaning against second-round effects: Lombardelli says policy 'will be tightened further if needed'; Taylor stresses watching expectations and second-round signposts and that restrictive policy guards against persistence; Pill backs prompt, decisive action; Ramsden announced the 'next chapter' of QT.", "divergence": "Goldman expects the ECB to hike once more in December (deposit to 2.75%) but is skeptical rates stay 'significantly above 3%' as markets imply, citing a higher hurdle for sequential hikes and energy weighing on growth into Q4; BNP says European and UK market pricing is 'overly aggressive' relative to economic reality; BCA notes TTF has surged without a rise in long-run inflation expectations, arguing against the ECB hiking deeply. Against this, ECB's Nagel (via SC) says bond-buying tools should preserve price stability, not cap spreads, leaving the French spread (127bp) unprotected. On Japan, SC notes October BoJ hike odds below 20% and a bullish USD/JPY (158) while Oxford/NDR see further BoJ tightening as likely.", "items": [{"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Goldman: ECB hikes again in December (deposit to 2.75% from 2.5%); euro-area GDP +1.2% annualised in H1; TTF almost doubled since June; sceptical rates stay well above 3%; growth 1% in 2026 to 1.4% in 2027.", "url": "https://www.goldmansachs.com/insights/articles/why-the-ecb-is-unlikely-to-keep-rates-higher-than-3-percent", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "BoE (Lombardelli): framework to monitor second-round effects of the energy shock; policy already leaning against persistence and will tighten further if needed.", "url": "https://www.bankofengland.co.uk/speech/2026/september/clare-lombardelli-speech-at-the-sixth-biennial-conference-poland", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "BoE (Taylor): risk that higher energy prices generate persistent inflation via expectations and second-round effects; restrictive policy guards against persistence.", "url": "https://www.bankofengland.co.uk/speech/2026/september/searching-for-signposts-speech-by-alan-taylor", "images": []}, {"source": "boe", "name": "Bank of England", "thesis": "BoE (Pill): explains support for raising Bank Rate to 4%; prompt, decisive action and communication to prevent embedding of Middle East-origin inflation.", "url": "https://www.bankofengland.co.uk/speech/2026/september/remarks-at-the-edinburgh-chamber-of-commerce", "images": []}, {"source": "moodys_analytics", "name": "Moody's Analytics", "thesis": "Moody's Analytics: euro-area headline inflation jumped to 3.8% y/y in September (highest since 2023, from 3.2%), core 2.5% (from 2.4%); energy story shifting from short-lived and narrow to long-lasting and broad-based.", "url": "https://www.economy.com/economicview/analysis/424061/Euro-Zone-Inflation-Heats-Up", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Standard Chartered: EUR/USD -0.8% to 1.1244 on French fiscal strain; ~90% odds of an ECB hike by year-end; ECB's Nagel: bond tools not for targeting spreads.", "url": "https://www.sc.com/sg/market-outlook/daily-navigator-2-10-2026/?mvog=1", "images": []}]}, {"theme": "Growth, Inflation & the Consumer", "category": ["growth"], "consensus": "Global growth is resilient despite the energy shock, carried by the AI capex cycle and fiscal support: Citi 2.6% (2026)/2.8% (2027), HSBC raised 2026 to 2.7% (2027 2.7%, inflation 3.3%), World Bank consensus ~2.6%, OECD 2.9% (2.8% before) with 2027 cut to 3.0% (via BNP), Barclays 'foundations intact', Deloitte US growth held up by AI investment. US data are strong: Goldman sees Q3 GDP ~3.3%, Q2 revised to 2.2%, ISM manufacturing 54.5 (prices paid 77.9).", "divergence": "The disagreement is about how much of this is sustainable versus inflationary. Gavekal and Deutsche call it an 'inflationary boom'; HSBC says governments have yet to make fiscal tightening choices and 'markets may ultimately force them'; the World Bank calls the resilience 'so far' and warns a renewed energy rise could raise inflation and borrowing costs. UBS and SC lean on disinflation: UBS cites 3-month annualised core PCE of 2.05% and favourable base effects; SC says disposable income is flat and households are drawing savings; consumer confidence at 81.9 is the lowest since 2014 and JOLTS (7.08m) a five-month low. BofA Institute card data show spending still solid (+0.9% m/m, +4.5% y/y in August) while payroll growth cooled to 1.5% y/y.", "items": [{"source": "citi_gps", "name": "Citi GPS", "thesis": "Citi GPS (Sheets): global growth 2.6% in 2026 and 2.8% in 2027; AI is a robust growth engine; most central banks tightening; long-term rates up globally.", "url": "https://www.citigroup.com/global/insights/global-resilience-sunshine-despite-very-cloudy-skies", "images": []}, {"source": "hsbc", "name": "HSBC", "thesis": "HSBC (Janet Henry): 2026 global GDP raised to 2.7% from 2.5%, 2027 2.7%; 2027 inflation raised to 3.3% from 3.1%; many central banks tightening but little fiscal tightening.", "url": "https://www.business.hsbc.com/en-gb/insights/global-economics-quarterly-tightening-tensions", "images": []}, {"source": "world_bank", "name": "World Bank", "thesis": "World Bank: global economy resilient to near-$120 Brent peak; consensus ~2.6% growth in 2026; inflation and borrowing costs rising.", "url": "https://blogs.worldbank.org/en/developmenttalk/the-global-economy-has-been-resilient---so-far", "images": []}, {"source": "deloitte", "name": "Deloitte", "thesis": "Deloitte US Economic Forecast Q3: AI buildout keeps US growth relatively strong despite inflation and demographic headwinds.", "url": "https://www.deloitte.com/us/en/insights/topics/economy/us-economic-forecast/united-states-outlook-analysis.html?icid=_click", "images": []}, {"source": "bofa", "name": "Bank of America Institute", "thesis": "BofA Institute Consumer Checkpoint: August card spending +0.9% m/m, +4.5% y/y; value-seeking; the K-shape has converged across income groups but persists among Millennials.", "url": "https://institute.bankofamerica.com/economic-insights/consumer-checkpoint-september-2026.html", "images": []}, {"source": "moodys_analytics", "name": "Moody's Analytics", "thesis": "Moody's Analytics: 'Labor Market Cools' – September payrolls +29k with downward revisions to prior months (full analysis gated).", "url": "https://www.economy.com/economicview/analysis/424066/Economic-Roundup-Labor-Market-Cools", "images": []}, {"source": "bofa", "name": "Bank of America Institute", "thesis": "BofA Institute: August employment report – estimated payroll growth cooled to 1.5% y/y from 1.8%; lower-income after-tax wage growth now exceeds higher-income.", "url": "https://institute.bankofamerica.com/economic-insights/monthly-employment-report-august-2026.html", "images": []}]}, {"theme": "US Dollar & FX", "category": ["fx"], "consensus": "The dollar is firm on real-rate differentials and haven demand: DXY rose 0.6% to 102.10 on 1 October with resistance at 103.2 (SC), USD/JPY ~158 and EUR/USD ~1.124.", "divergence": "BCA is the most bullish: its FX strategist upgrades the DXY target to 105, arguing global capex is driving the strongest industrial cycle since 2021, the US is best placed to capture it and real-rate differentials will keep widening; MacroQuant is 'very bullish' on the dollar. Standard Chartered says DXY is overbought, expects the USD to peak within weeks together with short/medium-term US yields (supporting gold, EM USD bonds, AUD corporates) but is still bullish USD/JPY (intervention risk near 160) and bearish EUR/USD (support 1.12, then 1.10). Amundi's view is that the old model of recycling savings into US bonds is fading, a longer-run dollar headwind.", "items": [{"source": "bca_research", "name": "BCA Research", "thesis": "BCA (Sakhbiev): 'The Dollar's Last Hurrah' – DXY target raised to 105; global capex cycle and widening real-rate differentials favour further USD upside near term.", "url": "https://www.bcaresearch.com/reports/dollars-last-hurrah-upgrading-our-dxy-target-105-29-09-2026/227033", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Standard Chartered: expects the USD to peak in the next few weeks along with short/medium-term US bond yields.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-2-10-2026/?mvog=1", "images": []}, {"source": "amundi", "name": "Amundi", "thesis": "Amundi: central banks to keep tightening but by less than priced; Japan pushing domestic funding of its debt and Treasury buybacks suggest recycling of global savings into US bonds is fading.", "url": "https://research-center.amundi.com/article/road-ahead-central-banks", "images": []}]}, {"theme": "US Equities, AI & Tech", "category": ["equities", "ai_tech"], "consensus": "Most houses stay overweight equities on an earnings boom that offsets higher yields: Barclays ('Reluctantly optimistic'; case for equities over fixed income 'remains compelling'; compute demand exceeds supply), Standard Chartered (preference for equities over bonds/cash; US and Asia ex-Japan; semis/memory), UBS (resilient growth underpins gains; AI capex $900bn in 2026 to $1.2tn in 2027), BNP (moderate OW, favouring US/EM tech), Deutsche CIO ('earnings super cycle'), Citi (constructive Q4; contrarian snapback in rate-sensitive sectors), Yardeni (S&P just 2.2% below its 7,900 year-end target; Micron revenue +379% y/y to $54.2bn). Tech has ignored yields: BNP shows tech +9% vs non-tech ACWI -8% since 4 August.", "divergence": "Dissenters question valuation and sustainability. BCA's Budaghyan says higher discount rates threaten US equity valuations before earnings weaken, AI stocks peak ahead of AI capex, and MacroQuant is underweight equities and bonds with a large cash overweight. Oxford Economics asks 'Is an AI downturn unavoidable?': AI capex was ~27% of US fixed investment in Q2 and cumulative AI investment is above 2% of GDP, with utilisation-adjusted productivity decelerating and AI firms free-cash-flow negative. Goldman's Pasquariello calls the bond market the 'number one clear and present danger' and expects returns to slow from double-digit; his colleague Callahan says it is now a stock-picker's market. BlackRock's Koesterich says crowded positioning, not fundamentals, drove post-earnings moves; T. Rowe's committee is split on trimming its small-cap overweight ('small-caps are a poor place to hide'). SC notes US small/mid caps are already down 8–9% from peaks; BCA says small caps are rolling over. UBS flags execution risk (Oracle's Project Jupiter may be delayed a year; 9 North American projects, ~7GW, delayed/cancelled).", "items": [{"source": "barclays", "name": "Barclays", "thesis": "Barclays Q4 Outlook 'Reluctantly optimistic': earnings, AI capex, resilient consumers outweigh $100+ oil, higher rates; US more resilient to rates than in past cycles; equities over fixed income.", "url": "https://www.ib.barclays/content/barclaysmicrosites/ibpublic/en/research/global-outlook/q4-2026-reluctantly-optimistic.html", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Standard Chartered Global Market Outlook 'Earnings above all': OW global equities and gold; US and Asia ex-Japan; semiconductors, power & electrification, comm services; Euro-area banks; Japan banks and Taiwan.", "url": "https://www.sc.com/sg/market-outlook/global-market-outlook-25-9-2026/?mvog=1", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "UBS: AI capex forecast $1.2tn in 2027 (+33% vs $900bn in 2026) already assumes delays; Oracle's Project Jupiter report; cautions against extrapolating project-level troubles.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-25092026.html", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Goldman (Pasquariello): bond market is the biggest risk for stocks; shorting bonds is a useful hedge; S&P earnings 'mind-bending' but returns may slow; likes Japan's TOPIX (governance reforms, defense spending).", "url": "https://www.goldmansachs.com/insights/the-markets/why-the-bond-market-may-be-the-stock-markets-biggest-risk", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Goldman (Callahan): AI is now a stock-picker's market – breadth of dispersion, interest in AI implementers and agentic commerce, rising rates pressuring software.", "url": "https://www.goldmansachs.com/insights/the-markets/ai-is-becoming-a-stock-pickers-market", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "BCA (Budaghyan): AI stocks to peak well ahead of AI capex; US equity valuations at risk from higher discount rates.", "url": "https://www.bcaresearch.com/reports/bond-riot-ai-peak-and-em-mirage-01-10-2026/227052", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "Oxford Economics: AI capex 27% of US fixed investment; corrections need only disappointment vs elevated expectations.", "url": "https://www.oxfordeconomics.com/resource/is-an-ai-downturn-unavoidable/", "images": []}, {"source": "blackrock_investment_institute", "name": "BlackRock", "thesis": "BlackRock (Koesterich): Q2 earnings strong but crowding determined reactions; semis briefly entered a technical bear market in July; multiples compressed while revisions held.", "url": "https://www.blackrock.com/us/individual/insights/strong-earnings-crowded-markets", "images": []}, {"source": "t_rowe_price", "name": "T. Rowe Price", "thesis": "T. Rowe Price Asset Allocation Committee: keep core positions, buy equity drawdowns; equity OW, short duration, small-cap tilt and real assets all added value but committee debating trimming risk; AI a 'regime shift'.", "url": "https://www.troweprice.com/en/us/insights/small-caps-oil-and-the-ai-elephant-in-the-room", "images": []}, {"source": "yardeni_research", "name": "Yardeni Research", "thesis": "Yardeni: S&P 500 2.2% below 7,900 YE target; could overshoot as Gulf oil shipments are ~98% of pre-war; risk is multiple compression if yields rise on debt concerns.", "url": "https://yardeni.com/research/quicktakes/2026/10/03/us-market-call-stocks-ignoring-bonds-for-now", "images": []}, {"source": "citi_gps", "name": "Citi GPS", "thesis": "Citi (Chronert/Galvin): constructive Q4 US equity view; contrarian tilt toward sectors hurt by hawkish Fed for a snapback; selective on semis.", "url": "https://www.citigroup.com/global/insights/markets-edition-q4-its-not-how-you-start-its-how-you-finish", "images": []}]}, {"theme": "Credit & Fixed-Income Allocation", "category": ["credit"], "consensus": "Credit fundamentals are seen as solid and spreads resilient: Deutsche, PIMCO, SC and BNP all cite strong corporate fundamentals; carry is the main return driver. PIMCO finds AI supply is repricing hyperscalers rather than crowding others out: AI borrowers were ~25% of non-financial USD IG supply YTD (from <13% last year and 4% in 2024), non-AI spreads have not widened meaningfully, and A-rated-or-better hyperscalers now trade wider than utilities.", "divergence": "The split is about quality and the high-yield trade. BCA's quarterly TAA says higher rates have changed the opportunity set and is overweight high-yield credit, both within asset allocation and versus private credit ('no longer picking up pennies in front of a steamroller'). BNP is overweight HY and EM debt while underweight governments and IG. SC is overweight EM USD bonds and likes US HY, AAA CLOs and bank AT1s but caps duration. Deutsche's CIO prefers quality IG (financials), saying limited spread compression remains and tight HY spreads plus refinancing risks warrant selectivity. BlackRock adds that munis will fund only part of the AI buildout (up to $11bn of muni AI issuance in 2026, <2% of supply).", "items": [{"source": "pimco", "name": "PIMCO", "thesis": "PIMCO Credit Market Lens: 'Hyperscalers are repricing, not displacing (so far)': AI ~quarter of USD non-financial supply; hyperscaler back-ends steepened; IG spread over AA index at narrowest in 20+ years.", "url": "https://www.pimco.com/us/en/insights/the-credit-market-lens-hyperscalers-are-repricing-not-displacing-so-far", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "BCA Quarterly TAA: OW high-yield credit in allocation and versus private credit.", "url": "https://www.bcaresearch.com/reports/quarterly-taa-picking-20-bills-front-steamroller-01-10-2026/227047", "images": []}, {"source": "deutsche_bank", "name": "Deutsche Bank CIO", "thesis": "Deutsche CIO: credit spreads quietly resilient; carry the main driver; prefer IG, esp. financials; HY selective.", "url": "https://wealth.db.com/en/insights/investing-insights/asset-class-insights/credit-spreads-quiet-resilience.html", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "thesis": "BNP multi-asset (Clavel): moderate OW equities and commodities; UW governments and IG; OW HY and EM debt.", "url": "https://www.bnpparibas-am.com/en-us/portfolio-perspectives/multi-asset-investment-views-staying-alive/", "images": []}, {"source": "blackrock_investment_institute", "name": "BlackRock", "thesis": "BlackRock: munis fund local power/grid/water; muni AI issuance up to $11bn in 2026; most AI campus capital is financed elsewhere.", "url": "https://www.blackrock.com/us/individual/insights/munis-ai-data-center-financing", "images": []}]}, {"theme": "Energy, Oil & Commodities", "category": ["energy", "commodities"], "consensus": "Oil remains the key swing factor: Brent trades ~$96–107 (BNP: peak ~$109 then $96; UBS: ~$107 on 29 Sep; Citi: near $100), and the Iran conflict (now in its eighth month) shows no imminent resolution. SC, UBS and Citi expect disinflation to return as oil and tariff effects ease over 12 months. US fuel stress is acute: RBC cites retail diesel +~70% and gasoline +~50% since the conflict began.", "divergence": "On supply, Yardeni argues Gulf shipments are ~98% of pre-war (ex-Iran) through pipeline routes, ship-to-ship transfers and escorted transits, so oil could soften, while UBS/BNP see no deal and BCA's MacroQuant is positive on oil. Goldman's commodities team sees upside risk to European gas (TTF almost doubled since June) in a cold winter, and Wood Mackenzie's Flowers argues the EU methane regulation risks worsening the energy crisis. On US policy, RBC (Helima Croft) says diesel export restrictions will likely be implemented if the White House political team judges they help in tossup Senate races, while Energy Secretary Wright publicly called a ban a bad idea and Wood Mackenzie's Crooks warns restrictions would raise fuel costs for most Americans and hit refiners. On metals, BNP says gold risk-reward is skewed up (central banks buying; China +20t in Aug, 80t YTD; a further Fed hike may cause a limited correction) and SC is OW gold, whereas BCA MacroQuant is slightly negative on gold and copper; Brookings' Robin Brooks sees the 'debasement trade' clustered around tariff and dovish-Fed events.", "items": [{"source": "rbc", "name": "RBC Capital Markets", "thesis": "RBC (Croft): odds of a US diesel export restriction have risen ahead of midterms; Trump said 'let's not send out the diesel'; Wright opposed; restrictions could be waived, time-limited or tied to inventory benchmarks.", "url": "https://www.rbccm.com/en/insights/2026/09/election-season-politics-reshape-us-diesel-strategy", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "thesis": "Wood Mackenzie (Crooks): US considering diesel export restrictions; Louisiana declared a diesel state of emergency; impact on refiners and fuel costs.", "url": "https://www.woodmac.com/blogs/energy-pulse/us-considers-diesel-export-restrictions/", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "thesis": "Wood Mackenzie (Flowers): EU methane regulation risks worsening the energy crisis ('good intentions, badly timed').", "url": "https://www.woodmac.com/blogs/the-edge/eu-methane-regulation-risks-worsening-energy-crisis/", "images": []}, {"source": "yardeni_research", "name": "Yardeni Research", "thesis": "Yardeni: Gulf crude shipments ~98% of pre-war levels ex-Iran via workarounds.", "url": "https://yardeni.com/research/quicktakes/2026/10/03/us-market-call-stocks-ignoring-bonds-for-now", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "thesis": "BNP: oil is 'the tail wagging the market dog'; gold – risk-reward skewed up despite possible limited correction on a further Fed hike.", "url": "https://viewpoint.bnpparibas-am.com/monthly-market-views-us-growth-market-mispricing-and-gold-resilience/", "images": []}, {"source": "brookings", "name": "Brookings", "thesis": "Brookings (Robin Brooks): Q&A on the 'debasement trade' – precious metals rallies cluster around tariff rollout (2 Apr 2025), dovish Fed events (Jackson Hole 22 Aug 2025; 29 Jul 2026); 30s-2s curve steepening is consistent with it.", "url": "https://www.brookings.edu/articles/what-is-the-debasement-trade/", "images": []}]}, {"theme": "Geopolitics, Trade, China & EM", "category": ["geopolitics", "em"], "consensus": "The Trump–Xi Washington summit produced limited outcomes. Capital Economics: both sides agreed to cut tariffs on $60bn of goods (~10% of bilateral trade) and extend the truce to January 2027, with possible new Section 301 tariffs offsetting; Barclays calls it 'stability without resolution'; Brookings and Carnegie criticise the lack of AI-safety progress. China's data are mixed: Gavekal says infrastructure FAI is -5.4% YTD.", "divergence": "Views differ on who has leverage and what follows. Capital Economics says China feels increasingly able to manage US tariffs (it sought a longer extension); PIIE's Auclair finds a $99.8bn gap between China's reported exports to the US ($258.1bn Jan–Jul) and US-reported imports ($158.3bn), pointing to tariff evasion and making US import data an unreliable gauge of decoupling. Gavekal warns Europe could follow the US into a trade fight if talks with China break down next week and that Beijing may punch back harder than Brussels expects. On EM, HSBC's survey shows bulls at 50% (from 60%), bears back at 5% and cash at 5.7% (highest since Dec 2023), BNP and SC are overweight EM (BNP sees China's AI as underrated), the World Bank says EMDEs have absorbed higher AE yields better than feared ('resilience is not safety'), while BCA is 'downbeat on EM stocks' and calls it an 'EM mirage'.", "items": [{"source": "capital_economics", "name": "Capital Economics", "thesis": "Capital Economics (Shearing): Trump–Xi: $60bn tariff cut (~10% of trade), truce to Jan 2027, China feels able to manage US tariffs; little urgency on AI regulation.", "url": "https://www.capitaleconomics.com/blog/economics-ai-regulation-meet-realities-geopolitical-rivalry", "images": []}, {"source": "barclays", "name": "Barclays", "thesis": "Barclays Brief Ep.50 'Trump-Xi: Stability without resolution' (Kotecha/Coffey).", "url": "https://www.ib.barclays/content/barclaysmicrosites/ibpublic/en/our-insights/barclays-brief/trump-xi-stability-without-resolution.html", "images": []}, {"source": "peterson_institute", "name": "PIIE", "thesis": "PIIE (Auclair): US vs China trade data gap of $99.8bn Jan–Jul 2026 points to tariff evasion.", "url": "https://www.piie.com/blogs/realtime-economics/2026/lost-tabulation-diverging-us-china-trade-data-point-tariff-evasion", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Gavekal Geoeconomic Monitor: Europe close to following US trade war with China if next week's talks fail.", "url": "https://research.gavekal.com/teaser/geoeconomic-monitor-europe-fights-china-shock/", "images": []}, {"source": "hsbc", "name": "HSBC", "thesis": "HSBC EM Sentiment Survey: 50% bullish (from 60%), net sentiment 45%, 16th straight positive net reading; risk appetite 6.6; cash 5.7%.", "url": "https://www.business.hsbc.com/en-gb/insights/hsbc-emerging-markets-sentiment-survey-less-bull-more-bite", "images": []}, {"source": "world_bank", "name": "World Bank", "thesis": "World Bank: EMDEs have navigated higher AE yields better than feared but resilience is not safety.", "url": "https://blogs.worldbank.org/en/developmenttalk/why-have-rising-sovereign-bond-yields-in-advanced-economies-not-", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Gavekal Dragonomics: China infrastructure FAI -5.4% YTD through August; local officials risk-averse.", "url": "https://research.gavekal.com/teaser/infrastructure-is-becoming-ineffective/", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "thesis": "BNP Paribas AM: 'Is the market underestimating China's AI potential?' – STAR 50 and alternative AI infrastructure.", "url": "https://www.bnpparibas-am.com/en/front-of-mind/talking-heads-is-the-market-underestimating-chinas-ai-potential/", "images": []}]}, {"theme": "Crypto & Digital Assets", "category": ["crypto"], "consensus": "Digital assets have been resilient: Bitcoin recovered from ~$75k to a $87k high on 23 Sept and ~$84k (CoinShares), with Galaxy's podcast citing a test of $88k on $2.4bn weekly ETF inflows. Galaxy notes spot BTC ETPs took in $1bn on a single day (largest of 2026), turning YTD flows positive for the first time since April. CoinShares ties support to falling hike odds, large-holder accumulation and fiscal concerns, and says the SEC's framework is now operative after the CLARITY Act failed cloture 49–50.", "divergence": "The tension is between macro and flows. CoinShares notes fund flows slowed to ~$150m from ~$3.5bn the week before and that blockchain equities fell 4.6% vs BTC +3.2% as yields rose; it argues falling front-end hike odds and rising long-end yields (fiscal worry) could both help Bitcoin through different channels. Galaxy's research points to the idiosyncratic risk of the $387.5m Bitget hack across 11 chains (largest single-chain loss ~$83m in XRP), which it says repeats the Lazarus/Bybit pattern; Chainalysis traced funds with in-house AI.", "items": [{"source": "coinshares", "name": "CoinShares", "thesis": "CoinShares: BTC broke $80k, ~+13% on the week, $3.5bn of inflows; CLARITY Act failed 49–50; SEC taxonomy is operative.", "url": "https://coinshares.com/insights/research-data/market-update-25-09-2026/", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "CoinShares: lower hike odds supportive; long yields at 24-year high; inflows slow to ~$150m.", "url": "https://coinshares.com/insights/research-data/market-update-02-10-2026/", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "CoinShares equities update: blockchain equities index -4.6% on the week vs BTC +3.2%; MOVE index ~110, VIX ~16; equal-weight S&P 500 on a seventh weekly decline.", "url": "https://coinshares.com/insights/research-data/equities-update-02-10-2026/", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "Galaxy Charts of the Week: spot BTC ETPs +$1bn net inflows (largest daily of 2026); YTD flows positive first time since April; 10y yield highest in nearly two decades.", "url": "https://www.galaxy.com/insights/research/bitcoin-etp-inflows-10-year-treasury-yield", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "Galaxy: Bitget $387.5m exploit repeats a Lazarus pattern.", "url": "https://www.galaxy.com/insights/research/bitget-hack-lazarus-bybit-pattern", "images": []}, {"source": "chainalysis", "name": "Chainalysis", "thesis": "Chainalysis: used in-house AI to trace the $387M Bitget theft.", "url": "https://www.chainalysis.com/blog/387m-bitget-theft-2026/", "images": []}]}], "B_calls": [{"source": "standard_chartered", "name": "Standard Chartered", "call": "Standard Chartered: initiate long opportunistic US 10y Treasury at ~5.2% yield; 12-month yield target 4.75–5.0%; losses <1% if 10y reaches 6%, gains ≥6% if yield <5.0%; prefers 3–7y maturities and corporates over governments.", "category": ["rates"], "url": "https://www.sc.com/sg/market-outlook/market-watch-28-9-2026/?mvog=1", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "call": "Standard Chartered 12m foundation: OW global equities, gold, US and Asia-ex-Japan equities, EM USD bonds; opportunistic semiconductors, high dividend/power & electrification, US comm services, euro-area banks, Japan banks, MSCI Taiwan; TIPS, AAA CLOs, US HY, bank AT1s, AUD corporates.", "category": ["equities", "credit", "commodities"], "url": "https://www.sc.com/sg/market-outlook/global-market-outlook-25-9-2026/?mvog=1", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "call": "Standard Chartered: US dollar to peak 'in the next few weeks' with short/medium US yields; opportunities in AUD corporate bonds, EM USD bonds and gold; stay with quality large caps (S&P 400/600 down 8–9% from peaks).", "category": ["fx", "credit"], "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-2-10-2026/?mvog=1", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "call": "Standard Chartered: bullish USD/JPY (158; intervention risk near 160); bearish EUR/USD (1.1244; support 1.12 then 1.10); DXY resistance 103.2.", "category": ["fx"], "url": "https://www.sc.com/sg/market-outlook/daily-navigator-2-10-2026/?mvog=1", "images": []}, {"source": "bca_research", "name": "BCA Research", "call": "BCA: raises DXY target to 105 (from current ~102); real-rate differentials widen on the strongest global industrial cycle since 2021.", "category": ["fx"], "url": "https://www.bcaresearch.com/reports/dollars-last-hurrah-upgrading-our-dxy-target-105-29-09-2026/227033", "images": []}, {"source": "bca_research", "name": "BCA Research", "call": "BCA: overweight high-yield credit within asset allocation and versus private credit.", "category": ["credit"], "url": "https://www.bcaresearch.com/reports/quarterly-taa-picking-20-bills-front-steamroller-01-10-2026/227047", "images": []}, {"source": "bca_research", "name": "BCA Research", "call": "BCA MacroQuant: underweight equities and bonds, significant overweight cash; very bullish USD; slightly negative gold and copper; positive oil.", "category": ["equities", "rates", "fx", "commodities"], "url": "https://www.bcaresearch.com/reports/macroquant-model-update-constellation-r-stars-30-09-2026/227041", "images": []}, {"source": "bca_research", "name": "BCA Research", "call": "BCA (Budaghyan): US bonds sell off until a double-digit S&P 500 decline; AI stocks peak ahead of AI capex; downbeat EM equities.", "category": ["rates", "equities", "em"], "url": "https://www.bcaresearch.com/reports/bond-riot-ai-peak-and-em-mirage-01-10-2026/227052", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "call": "BNP Paribas AM multi-asset: moderate OW global equities (US, EM, Japan/Europe banks), moderate OW commodities (energy, precious/industrial metals); UW governments and IG; OW high yield and EM debt.", "category": ["equities", "credit", "commodities"], "url": "https://www.bnpparibas-am.com/en-us/portfolio-perspectives/multi-asset-investment-views-staying-alive/", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "call": "Goldman (Hatzius): Fed final 25bp hike in December (moved from October); market pricing of three hikes 'not necessary'; one-and-done possible.", "category": ["rates"], "url": "https://www.goldmansachs.com/insights/videos/cnbc-jan-hatzius-outlook-for-us-economy", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "call": "Goldman: ECB to hike in December to 2.75% deposit rate; unlikely to hold rates well above 3%.", "category": ["rates"], "url": "https://www.goldmansachs.com/insights/articles/why-the-ecb-is-unlikely-to-keep-rates-higher-than-3-percent", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "call": "Goldman (Pasquariello): shorting bonds is a useful hedge for equity holdings; opportunities in Japan's TOPIX.", "category": ["rates", "equities"], "url": "https://www.goldmansachs.com/insights/the-markets/why-the-bond-market-may-be-the-stock-markets-biggest-risk", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "call": "Gavekal: add TIPS and energy stocks alongside high-grade nominal bonds; favours tech, energy and cash over bonds in the inflationary boom.", "category": ["rates", "equities", "energy"], "url": "https://research.gavekal.com/teaser/us-strategy-after-the-inflationary-boom/", "images": []}, {"source": "barclays", "name": "Barclays", "call": "Barclays: case for equities over fixed income 'remains compelling'.", "category": ["equities"], "url": "https://www.ib.barclays/content/barclaysmicrosites/ibpublic/en/research/global-outlook/q4-2026-reluctantly-optimistic.html", "images": []}, {"source": "yardeni_research", "name": "Yardeni Research", "call": "Yardeni: S&P 500 year-end target 7,900 (currently 2.2% below); bullish memory (Micron FQ4 revenue $54.2bn, +379% y/y, GM 87%).", "category": ["equities", "ai_tech"], "url": "https://yardeni.com/research/quicktakes/2026/10/03/us-market-call-stocks-ignoring-bonds-for-now", "images": []}, {"source": "citi_gps", "name": "Citi GPS", "call": "Citi (Chronert): contrarian Q4 tilt toward sectors pressured by hawkish Fed hikes for a snapback; selective in semis.", "category": ["equities"], "url": "https://www.citigroup.com/global/insights/markets-edition-q4-its-not-how-you-start-its-how-you-finish", "images": []}, {"source": "t_rowe_price", "name": "T. Rowe Price", "call": "T. Rowe Price AAC: maintain core risk positions (equity OW, short duration, small-cap tilt, real assets), buy equity drawdowns; debating trimming small caps.", "category": ["equities"], "url": "https://www.troweprice.com/en/us/insights/small-caps-oil-and-the-ai-elephant-in-the-room", "images": []}, {"source": "deutsche_bank", "name": "Deutsche Bank CIO", "call": "Deutsche Bank CIO: favour quality IG credit, especially financials; be selective in HY.", "category": ["credit"], "url": "https://wealth.db.com/en/insights/investing-insights/asset-class-insights/credit-spreads-quiet-resilience.html", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "call": "BNP Paribas AM: gold risk-reward skewed to upside; central banks buying (China +80t YTD).", "category": ["commodities"], "url": "https://viewpoint.bnpparibas-am.com/monthly-market-views-us-growth-market-mispricing-and-gold-resilience/", "images": []}, {"source": "ubs", "name": "UBS", "call": "UBS: fixed income rated Attractive; hedge funds historically positive in every Fed tightening cycle since 1994 – favours alpha strategies into 2027.", "category": ["credit", "equities"], "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-29092026.html", "images": []}], "C_deep_reads": [{"source": "barclays", "name": "Barclays", "title": "Barclays Q4 2026 Global Outlook: Reluctantly optimistic", "summary": "Barclays Research (lead: Ajay Rajadhyaksha) argues that despite widening cracks – $100+ oil, renewed geopolitical tension, higher rates and bond yields – the foundations of global growth hold. Strong corporate earnings, an accelerating AI capex boom (demand for compute still exceeds supply, with spillover into construction, energy, infrastructure and labour), resilient consumers and a less rate-sensitive US economy outweigh headwinds. It argues higher rates matter less than investors assume (US borrowing in the reserve currency gives fiscal flexibility) and that the case for equities over fixed income remains compelling. Full report is client-gated; summary from the public page.", "url": "https://www.ib.barclays/content/barclaysmicrosites/ibpublic/en/research/global-outlook/q4-2026-reluctantly-optimistic.html", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "title": "Standard Chartered Global Market Outlook: Earnings above all (25 Sep)", "summary": "SC's flagship says higher oil is in a tussle with stronger growth, and that strong growth lets equities focus on earnings. Maintain equities over bonds and cash; use the pause to add to preferred markets (US, Asia ex-Japan) and themes; take advantage of higher bond yields via credit risk but cap duration because the risk is most pressing in ultra-long maturities; overweight EM USD bonds, gold and global equities. The note draws '1990s' parallels with the mid-cycle bond selloff and tracks oil as the key risk. A follow-up Market Watch (28 Sep) adds the long 10y Treasury trade.", "url": "https://www.sc.com/sg/market-outlook/global-market-outlook-25-9-2026/?mvog=1", "images": []}, {"source": "pimco", "name": "PIMCO", "title": "PIMCO Macro Signposts: Monetary Policy Through the Lens of Financial Conditions", "summary": "PIMCO (Wilding, Scott) observes that the Fed, ECB, BoJ and RBA all now justify policy via financial conditions. Warsh described the September hike as removing accommodation so financial and credit conditions are more consistent with objectives. PIMCO's decomposition of the Fed's FCI-G shows equity gains have given the largest boost to growth over the past year; higher yields since June should cool that impulse, but the tightening needed to return inflation to target is nowhere near 2022's. Because r* is unobservable, they propose a time-varying financial-conditions target; with output 1–1.5ppt above potential the implied Phillips-curve inflation impulse is only ~0.1–0.3ppt.", "url": "https://www.pimco.com/us/en/insights/monetary-policy-through-the-lens-of-financial-conditions", "images": []}, {"source": "hsbc", "name": "HSBC", "title": "HSBC Global Economics Quarterly: Tightening tensions", "summary": "Janet Henry: with the Middle East escalation and renewed energy price rise, many central banks are tightening, but governments have not made the politically hard fiscal choices despite higher debt and long-term rates; 'markets may ultimately force them to', and AI-driven productivity may not save public finances given reliance on labour taxes. Global growth has been 'remarkably resilient' (June US–Iran MoU lifted confidence; AI investment and export boom). 2026 global GDP forecast raised to 2.7% from 2.5%; 2027 unchanged at 2.7%; 2027 global inflation raised to 3.3% from 3.1%; food-price (El Niño) shocks are a 2027 story.", "url": "https://www.business.hsbc.com/en-gb/insights/global-economics-quarterly-tightening-tensions", "images": []}, {"source": "citi_gps", "name": "Citi GPS", "title": "Citi GPS: Global Resilience – Sunshine Despite Very Cloudy Skies", "summary": "Nathan Sheets' team keeps its 'global resilience' narrative: growth 2.6% in 2026 (about 25bp below pre-Iran-conflict forecasts but ~10bp above July) and 2.8% in 2027 as Middle East pressure eases. The production side has become more flexible and AI spending is a robust engine for both developed and emerging economies, while higher energy prices lifted inflation, prompted tightening and raised long rates worldwide; consumer and business confidence remain weak.", "url": "https://www.citigroup.com/global/insights/global-resilience-sunshine-despite-very-cloudy-skies", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "title": "Oxford Economics: Is an AI downturn unavoidable?", "summary": "AI is among the largest tech booms of the past two centuries; AI-related capex was ~27% of US fixed investment in Q2 and cumulative investment topped 2% of US GDP in three years – only 1840s UK railway mania was bigger. Evidence of returns is limited (utilisation-adjusted productivity growth decelerating, AI firms FCF-negative), and consensus profit growth looks inconsistent with likely productivity gains. A sharp correction needs only disappointment versus elevated expectations; triggers include profitability concerns, weak productivity/demand news and regulation.", "url": "https://www.oxfordeconomics.com/resource/is-an-ai-downturn-unavoidable/", "images": []}, {"source": "amundi", "name": "Amundi", "title": "Amundi: The road ahead for central banks", "summary": "Amundi argues growth rests on a narrow base (everyone investing in the same sectors), gains are unevenly distributed and inflation pressures persist; monetary and fiscal policy must be considered together. Summer policy events (Japan pushing domestic investors to fund its debt, US Treasury buybacks, diversification) suggest the old model of recycling global savings into US bonds is fading. Major central banks should continue tightening but by less than markets currently price; supply shocks are becoming the norm.", "url": "https://research-center.amundi.com/article/road-ahead-central-banks", "images": []}, {"source": "boe", "name": "Bank of England", "title": "Bank of England (Alan Taylor): Searching for signposts", "summary": "MPC member Taylor frames the key macro risk: higher energy prices generating persistent inflation via expectations and second-round effects. He examines the balance of risks, the indicators the Bank uses to monitor second-round effects and how current restrictive policy guards against persistence (75k-character Dow Lecture).", "url": "https://www.bankofengland.co.uk/speech/2026/september/searching-for-signposts-speech-by-alan-taylor", "images": []}, {"source": "brookings", "name": "Brookings", "title": "Brookings (Robin Brooks): What is the debasement trade?", "summary": "Q&A on whether the precious-metals surge reflects investors fleeing fiat currencies on fiscal/monetary debasement fears. Prices have fallen from early-2026 peaks but remain far above year-ago levels. Event markers: tariffs (2 Apr 2025), the dovish Jackson Hole speech (22 Aug 2025), the Iran war start (27 Feb 2026) and the 29 Jul 2026 Fed meeting that disappointed hike hopes. Treasury 30s-2s steepening at turning points offers some bond-market evidence for the thesis.", "url": "https://www.brookings.edu/articles/what-is-the-debasement-trade/", "images": []}, {"source": "world_bank", "name": "World Bank", "title": "World Bank: The global economy has been resilient — so far", "summary": "The   rates: 'var(--cat-rates)',

  credit: 'var(--cat-credit)',

};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }
function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}
function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}
function pills(cats) {
  if (!cats) return '';
  if (Array.isArray(cats)) return cats.map(pill).join(' ');
  return pill(cats);
}
function externalLink(url, label) {
  if (!url) return '';
  return `<a class="item-link" href="${escapeAttr(url)}" target="_blank" rel="noopener">${label || 'link →'}</a>`;
}
function nameLink(url, name) {
  if (!name) return '';
  if (!url) return `<span class="item-source">${escapeHtml(name)}</span>`;
  return `<a class="item-source" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderThemeItem(it) {
  return `
    <div class="theme-item">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.thesis || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderTheme(theme) {
  const items = (theme.items || []).map(renderThemeItem).join('');
  return `
    <div class="theme">
      <div class="theme-head">
        ${pills(theme.category)}
        <div class="theme-title">${escapeHtml(theme.theme || '')}</div>
      </div>
      <div class="theme-stance">
        ${theme.consensus ? `<div class="theme-line consensus"><span class="lbl">Consensus</span>${renderBold(theme.consensus)}</div>` : ''}
        ${theme.divergence ? `<div class="theme-line divergence"><span class="lbl">Divergence</span>${renderBold(theme.divergence)}</div>` : ''}
      </div>
      ${items ? `<div class="theme-items">${items}</div>` : ''}
    </div>`;
}

function renderCall(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${pills(it.category)}
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.call || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderDeepRead(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url, 'read →')}
      </div>
      ${it.title ? `<div class="item-title">${escapeHtml(it.title)}</div>` : ''}
      <div class="item-text">${renderBold(it.summary || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderChart(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.chart || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderHouseView(hv) {
  const name = hv.name || hv.source || '';
  const nameHtml = hv.url
    ? `<a class="hv-name" href="${escapeAttr(hv.url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`
    : `<span class="hv-name">${escapeHtml(name)}</span>`;
  return `
    <div class="hv-row">
      ${nameHtml}
      <span class="hv-stance">${renderBold(hv.stance || '')}</span>
    </div>`;
}

function renderSection(letter, name, items, render, extraClass) {
  if (!items || !items.length) return '';
  const body = items.map(render).join('');
  const cls = 'section' + (extraClass ? (' ' + extraClass) : '');
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderTopStats(d) {
  const parts = [];
  const p = d.period || {};
  const is = d.input_stats || {};
  const cv = d.coverage || {};
  if (p.from && p.to)
    parts.push(`period <strong>${escapeHtml(p.from)} → ${escapeHtml(p.to)}</strong>`);
  else if (p.lookback_days != null)
    parts.push(`lookback <strong>${p.lookback_days}d</strong>`);
  if (is.total_articles != null) parts.push(`articles <strong>${is.total_articles}</strong>`);
  if (is.sources_present != null) parts.push(`sources <strong>${is.sources_present}</strong>`);
  if (is.after_filter != null) parts.push(`after filter <strong>${is.after_filter}</strong>`);
  if (cv.coverage_pct != null) {
    const pct = (cv.coverage_pct <= 1 ? cv.coverage_pct * 100 : cv.coverage_pct);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  } else if (cv.sources_covered != null && cv.sources_total != null) {
    parts.push(`coverage <strong>${cv.sources_covered}/${cv.sources_total}</strong>`);
  }
  return parts.join(' | ');
}

function reportDate(d) {
  if (d.period && d.period.to) return d.period.to;
  if (d.collected_at) return String(d.collected_at).slice(0, 10);
  return '';
}

// ---------- interactions ----------
function toggleSection(headEl) { headEl.parentElement.classList.toggle('open'); }
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('lightbox').classList.contains('open')) {
    closeLightbox();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = reportDate(d);
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  const s = d.sections || {};
  const out = [
    renderSummary(d.summary),
    renderSection('A.', 'Debates — Consensus vs Divergence', s.A_debates,    renderTheme),
    renderSection('B.', 'Key Calls & Positioning',           s.B_calls,      renderCall),
    renderSection('C.', 'Notable Deep Reads',                s.C_deep_reads, renderDeepRead,
                  'section-deepreads'),
    renderSection('D.', 'Charts & Data',                     s.D_charts,     renderChart),
    renderSection('E.', 'House Views',                       s.house_views,  renderHouseView),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = out || '<div class="empty">No report data.</div>';

  // Auto-open Summary's section view: first two sections open by default.
  document.querySelectorAll('.section').forEach((sec, i) => {
    if (i < 2) sec.classList.add('open');
  });
}

renderReport(REPORT_DATA);
</script>
