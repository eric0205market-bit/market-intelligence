s.", "category": ["fx", "commodities", "crypto"], "url": "https://www.citigroup.com/global/insights/markets-edition-bessent-and-the-back-end", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "call": "Bullish US micro-caps: Russell Microcap up 109.0% since the April 2025 low vs. 77.2% for the Russell 2000, trading near a 25-year-low EV/EBIT discount to large caps.", "category": ["equities"], "url": "https://www.franklintempleton.com/articles/2026/royce-investment-partners/are-us-micro-caps-the-markets-best-kept-secret", "images": []}, {"source": "wisdomtree", "name": "WisdomTree", "call": "Positions WDRN for a multi-year demand tailwind from Section 232 drone tariffs (up to 100% on Chinese drones effective Sept 3, 2026), favoring domestic and allied-nation drone/component makers.", "category": ["geopolitics", "equities"], "url": "https://www.wisdomtree.com/us/insights/blog/from-ban-to-tariff-wall-how-u-s-drone-policy-is-reshaping-the-global-supply-chain", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "call": "Base case: BTC consolidates with near-term downside risk below $100-105k but a strengthening longer-term bullish thesis toward $250k by end-2027; forecasts US spot crypto ETF inflows exceeding $50bn in 2026 (vs. $23bn in 2025).", "category": ["crypto"], "url": "https://www.galaxy.com/insights/research/predictions-2026-crypto-bitcoin-defi", "images": []}, {"source": "deutsche_bank", "name": "Deutsche Bank", "call": "Forecasts three Fed rate cuts by end-2026, double-digit corporate earnings growth across all major regions, further gold upside, and oil stabilizing at low levels.", "category": ["rates", "equities", "commodities"], "url": "https://wealth.db.com/en/insights/investing-insights/economic-and-market-outlook/cio-annual-outlook-2026-investing-in-tomorrow.html", "images": []}, {"source": "jpmorgan", "name": "JPMorgan", "call": "Committing $10bn of its own balance sheet to defense/aerospace (AI, cyber, drones, sub-sea capabilities) against a ~$1-1.5tn US defense budget backdrop.", "category": ["geopolitics", "equities"], "url": "https://www.jpmorgan.com/insights/podcast-hub/making-sense/the-new-defense-playbook-partnerships-capital-capability", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "call": "Warns a decisive break above 5% on the 10-year Treasury (vs. an implicit 4.75% Treasury 'line in the sand') would mean 'all bets are off,' drawing a parallel to the unstable late-1960s breakout that ran to 15%.", "category": ["rates"], "url": "https://research.gavekal.com/teaser/four-charts-to-watch/", "images": []}], "C_deep_reads": [{"source": "carnegie", "name": "Carnegie Endowment for International Peace", "title": "Who Paid for China's Last Debt Cleanup, and Who Will Pay for the Next?", "summary": "Michael Pettis argues China's 2000s bank cleanup -- transferring roughly RMB1.4 trillion (about 20% of GDP) of non-performing loans from the Big Four banks to asset-management companies (Cinda, Huarong, Orient, Great Wall) at up to full face value -- didn't eliminate losses but shifted them onto households via financial repression (suppressed deposit rates costing households as much as 5 percentage points of GDP per year between 2001-2010), which drove consumption's GDP share down from about 64% in 2000 to 49.4% by 2010 and pushed the current-account surplus above 10% of GDP. He warns Beijing faces a similar debt overhang today but that the 'hide the cost in households' option is far less available since household consumption share is already at record lows, meaning today's resolution must fall more on businesses (lower margins/slower growth) or on government balance sheets (explicit fiscal costs).", "url": "https://carnegieendowment.org/china-financial-markets/2026/08/who-paid-for-chinas-last-debt-cleanup-and-who-will-pay-for-the-next", "images": []}, {"source": "brookings", "name": "Brookings Institution", "title": "What is the value of a 'Europeanized NATO' for the United States?", "summary": "Companion Brookings briefs (with 'How can a Europeanized NATO defend Europe with reduced American support?') lay out the fullest treatment in the dataset of Europe's post-US-drawdown defense options: Europe plus Canada would need to roughly triple deployable conventional combat capacity, from an estimated 3-4 brigades today to 10-12 brigades plus airpower/logistics, achievable within NATO's existing 3.5%-of-GDP spending target if efficiently allocated (versus needing over 5% of GDP for a decade with no US role at all). UK/French nuclear forces, at roughly one-tenth Russia's size, cannot credibly substitute for the US nuclear umbrella. The companion piece is more pessimistic on timing: Europe likely cannot mount a fully successful defense against Russia by the widely-cited 2029 threat horizon without US support, since troop 'mass' (most countries remain reluctant to reinstate conscription) and command/interoperability integration lag behind the closing equipment gap; only the UK or France could plausibly assume the coordinating role the US currently plays.", "url": "https://www.brookings.edu/articles/what-is-the-value-of-a-europeanized-nato-for-the-united-states/", "images": []}, {"source": "deutsche_bank", "name": "Deutsche Bank", "title": "Annual Outlook 2026 | Economic and Market Outlook", "summary": "Deutsche Bank's Global CIO Christian Nolting expects 2026 to be 'another constructive year' for markets, forecasting three Fed rate cuts by end-2026 alongside continued tax relief and defense/security spending under the 'One Big Beautiful Bill Act,' with the US near full employment; Europe gets a cyclical lift from Germany's EUR500bn special fund. DB forecasts double-digit corporate earnings growth across all major regions, sees AI capex benefiting Big Tech plus construction, utilities and industrial/basic-materials supply chains, and views AI as 'more of a structural boom than a bubble.' Cross-asset calls: USD stability (including versus EUR) with slight JPY appreciation and a stable PBoC-managed USD/CNY; 10-year Bunds and Treasuries to offer positive real returns amid continued yield-curve normalization; gold has 'further upside potential' while oil is expected to stabilize at low levels; and China's rare-earths quasi-monopoly should intensify the search for substitutes.", "url": "https://wealth.db.com/en/insights/investing-insights/economic-and-market-outlook/cio-annual-outlook-2026-investing-in-tomorrow.html", "images": []}, {"source": "citi_gps", "name": "Citi GPS", "title": "Global Resilience: Many Storm Clouds, but Still Little Rain", "summary": "Citi Research (led by Nathan Sheets) sees global growth running near 2.6% in 2026 (down slightly y/y) despite the US-Iran conflict, with oil holding at or below $90/bbl; global headline inflation is tracking 3.4% (up from 2.8% in 2025 and about 0.75pp above pre-conflict forecasts), with Brazil, South Korea, Thailand, Australia, the euro area, US and Japan seeing the largest inflation-forecast upgrades. Risk is two-sided: oil above $100/bbl would hit growth and lift inflation further, while a reopening of the Strait of Hormuz could send oil back to about $80/bbl or lower. 17 of a panel of 27 major central banks have seen rate expectations move higher; BoJ rates are seen reaching 2% over two years, the ECB may hike once more before pausing, and the BoE holds this year before cutting in 2027. Since the pandemic, the US/Australia/Canada have grown 11-16% cumulatively (the strongest group), Taiwan/China/India/Vietnam have expanded over 30%, while Mexico's per-capita growth is near zero since mid-2023.", "url": "https://www.citigroup.com/global/insights/global-resilience-many-storm-clouds-but-still-little-rain", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "title": "It's all about the yield – Market Outlook", "summary": "SC's monthly flagship argues US bond yields will be 'increasingly capped' as inflation concerns recede (core CPI eased to 2.5%, unit labour costs at 1.4%), keeping it Underweight DM government bonds but favoring the 3-5yr part of the curve, with selective long-end adds only above a 4.75% 10-year yield; it maintains Overweight EM USD sovereigns (6.1% average yield vs. 6% 10-year average) and stays Neutral on DM/Asia USD credit. It stays Overweight global, US and Asia ex-Japan equities on a steep earnings cushion (2026/2027 global EPS growth of 32%/14%; US EPS revised to +30%/+13% for 2026/2027 after Q2 beats), initiates an Overweight-supporting opportunistic idea on Euro area banks, and trims India and gold-adjacent India allocation to Core from Overweight on stretched valuations. It reinstates an Overweight on gold, raising 3-month/12-month targets to USD 4,750/oz and USD 5,000/oz respectively, while holding WTI oil forecasts at USD 90/bbl (3-month) and USD 70/bbl (12-month) as Gulf supply normalizes. On rates, it expects the Fed to hold through year-end (its 'soft landing' base case probability raised slightly to 50%), one more 25bps ECB 'insurance' hike to 2.5%, and two more BoJ hikes to 1.5% by December; on FX it cuts its 3-month DXY forecast to 98 from 101.5 and expects USD to drift to 96 over 12 months, while its quant stock-bond model raised its equity overweight score to +3 from +2 (max +5), with the model YTD returning 13.8% vs. a 60/40 benchmark by 4.2ppt.", "url": "https://www.sc.com/sg/market-outlook/global-market-outlook-28-8-2026/?mvog=1", "images": []}, {"source": "schroders", "name": "Schroders", "title": "Treasury twist—Treating the symptom, not the disease", "summary": "Schroders' weekly fixed income note argues Treasury's August 19 increase of long-end liquidity-support buybacks (from $2bn to at least $4bn per operation, effective Sept 9) briefly pulled the 30-year yield down about 10bps before the move reversed, and is too small to fix the underlying fiscal problem. Net interest costs have risen from ~8% of federal revenue in 2021 to almost 20% today, now exceeding defense spending; the 10-year has stayed broadly in a 4-5% range for nearly three years and Schroders argues today's yields aren't historically unusual -- it's the post-GFC near-zero-rate era that was the anomaly. Schroders prefers the 5-10yr part of the curve, curve steepeners, Agency MBS, taxable munis and selective EM debt over long-duration Treasuries and broad corporate credit, and flags Fed Chair Warsh's Jackson Hole speech as the key test for restoring policy clarity.", "url": "https://www.schroders.com/en-us/us/individual/insights/weekly-bond-market-update-treasury-twist-treating-the-symptom-not-the-disease/", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "title": "26 Cryptocurrency, Bitcoin, and DeFi Predictions for 2026", "summary": "Galaxy Research's 26 predictions for 2026 (after BTC roundtripped from a $126,080 Oct-2025 ATH back to the low $90,000s by December) include: BTC hitting $250k by year-end 2027 with near-term risk skewed to the downside until it reclaims $100-105k; Solana's Internet Capital Markets cap surging to $2bn from ~$750m; total crypto-backed loans clearing $90bn; stablecoins overtaking ACH transaction volume; >50 spot altcoin ETFs and >50 other crypto ETFs launching with US spot crypto ETF net inflows exceeding $50bn (vs $23bn in 2025); a major wirehouse adding BTC to standard model portfolios at 1-2%; 15+ crypto IPOs/uplistings; 5+ DATs forced to sell/be acquired/shut down as mNAVs compress below 1x; DEXs capturing >25% of spot volume (from ~15-17% today); privacy-token market cap exceeding $100bn (from $63bn); and Polymarket weekly volumes consistently exceeding $1.5bn. A review of 2025's 23 predictions shows a mixed record (BTC missed its $150k/$185k targets, ETH missed $5,500, but bitcoin ETF wirehouse-allocation and stablecoin-legislation calls proved correct).", "url": "https://www.galaxy.com/insights/research/predictions-2026-crypto-bitcoin-defi", "images": []}, {"source": "wisdomtree", "name": "WisdomTree", "title": "Gold Miners in 2026: Beneath the Surface, the Case Is Building", "summary": "WisdomTree argues the gold-miner equity thesis remains intact despite a more range-bound 2026 gold price (after 2025's rally), because miners' all-in sustaining costs (AISC) have risen far more slowly than the gold price over the past decade, implying structurally expanding margins not yet fully reflected in valuations. It highlights the WisdomTree Efficient Gold Plus Gold Miners Strategy Fund (GDMN), which combines 90 cents of gold-miner equity exposure and 90 cents of gold futures exposure per hypothetical dollar (10 cents in Treasury collateral), versus pure-gold GLD or pure-miner GDX exposure, and notes recent performance data hints at a possible turn in miners' relative performance.", "url": "https://www.wisdomtree.com/us/insights/blog/gold-miners-in-2026-beneath-the-surface-the-case-is-building", "images": []}, {"source": "world_bank", "name": "World Bank", "title": "History's lesson for taxing wealth today", "summary": "A new World Bank/LSE/Harvard paper reconstructs over 100 years of US General Property Tax data, showing the tax raised an average 4% of GDP from 1850-1940 while US private wealth rose from roughly 3x GDP in 1800 to a Depression-era peak of 580% of GDP in 1932, and sits above 5x GDP again today. The critical failure mode was under-assessment: the national average assessment ratio fell from about 83% of market value in 1850 to roughly 40% by the early 1900s, a problem now echoed in developing countries where property taxes raise only about 0.1% of GDP. The authors also find wealth concentration is highly persistent and growth-negative: the wealthiest 10% of US counties held about 70% of total property by 1930 (1870-1930 rank correlation above 0.6), and counties with more concentrated top-decile wealth in 1870 grew significantly slower over the following 60 years.", "url": "https://blogs.worldbank.org/en/developmenttalk/history-s-lesson-for-taxing-wealth-today", "images": []}, {"source": "coinshares", "name": "CoinShares", "title": "Output - From despair to greed in a week", "summary": "CoinShares CEO Jean-Marie Mognetti notes over 100 crypto projects shut down or went bankrupt in 2026 (BitMEX, BitMart among closures in late July) before Bitcoin reclaimed $80,000 and traders began pricing a move above $82,000; he attributes the reversal to a macro/policy regime shift rather than improved asset quality -- 30-year Treasury yields hit multi-decade highs as US federal debt passed $40 trillion, reinforcing the 'debasement trade' (echoing Stanley Druckenmiller's WSJ comment that 'governments defending prices against fundamentals always lose'), plus a policy shift evidenced by Trump urging Congress to pass the CLARITY Act and the CFTC working to bring Hyperliquid onshore. He cautions that crypto exploits cost the industry over $1 billion in H1 2026 and that a broad rally doesn't validate weak projects -- only Bitcoin (a monetary-credibility play) and infrastructure with real usage/revenue deserve the re-rating.", "url": "https://coinshares.com/insights/the-node/output-from-despair-to-greed-in-a-week-a-rally-is-not-a-verdict/", "images": []}], "D_charts": [{"source": "federal_reserve", "name": "Federal Reserve", "chart": "Figure 1 is a stylized T-account diagram of how Fed balance-sheet runoff shifts Treasury holdings onto dealers who finance them via repo, and Figure 2 is a regression chart showing how a $50 billion net Treasury issuance shock moves the TGCR-IORB repo spread across five different levels of Fed liquidity as a share of GDP.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/repo-markets-and-the-feds-balance-sheet-implications-for-monetary-policy-implementation-20260826.html", "images": ["https://www.federalreserve.gov/econres/notes/feds-notes/fig1-4069.png", "https://www.federalreserve.gov/econres/notes/feds-notes/fig2-4069.png"]}, {"source": "capital_economics", // ---------- helpers ----------
const CAT_VARS = {
  rates: 'var(--cat-rates)',
  growth: 'var(--cat-growth)',
  fx: 'var(--cat-fx)',
  equities: 'var(--cat-equities)',
  credit: 'var(--cat-credit)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  commodities: 'var(--cat-commodities)',
  geopolitics: 'var(--cat-geopolitics)',
  ai_tech: 'var(--cat-ai_tech)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }
function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}
function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}
function pills(cats) {
  if (!cats) return '';
  if (Array.isArray(cats)) return cats.map(pill).join(' ');
  return pill(cats);
}
function externalLink(url, label) {
  if (!url) return '';
  return `<a class="item-link" href="${escapeAttr(url)}" target="_blank" rel="noopener">${label || 'link →'}</a>`;
}
function nameLink(url, name) {
  if (!name) return '';
  if (!url) return `<span class="item-source">${escapeHtml(name)}</span>`;
  return `<a class="item-source" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderThemeItem(it) {
  return `
    <div class="theme-item">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.thesis || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderTheme(theme) {
  const items = (theme.items || []).map(renderThemeItem).join('');
  return `
    <div class="theme">
      <div class="theme-head">
        ${pills(theme.category)}
        <div class="theme-title">${escapeHtml(theme.theme || '')}</div>
      </div>
      <div class="theme-stance">
        ${theme.consensus ? `<div class="theme-line consensus"><span class="lbl">Consensus</span>${renderBold(theme.consensus)}</div>` : ''}
        ${theme.divergence ? `<div class="theme-line divergence"><span class="lbl">Divergence</span>${renderBold(theme.divergence)}</div>` : ''}
      </div>
      ${items ? `<div class="theme-items">${items}</div>` : ''}
    </div>`;
}

function renderCall(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${pills(it.category)}
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.call || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderDeepRead(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url, 'read →')}
      </div>
      ${it.title ? `<div class="item-title">${escapeHtml(it.title)}</div>` : ''}
      <div class="item-text">${renderBold(it.summary || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderChart(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.chart || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderHouseView(hv) {
  const name = hv.name || hv.source || '';
  const nameHtml = hv.url
    ? `<a class="hv-name" href="${escapeAttr(hv.url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`
    : `<span class="hv-name">${escapeHtml(name)}</span>`;
  return `
    <div class="hv-row">
      ${nameHtml}
      <span class="hv-stance">${renderBold(hv.stance || '')}</span>
    </div>`;
}

function renderSection(letter, name, items, render, extraClass) {
  if (!items || !items.length) return '';
  const body = items.map(render).join('');
  const cls = 'section' + (extraClass ? (' ' + extraClass) : '');
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderTopStats(d) {
  const parts = [];
  const p = d.period || {};
  const is = d.input_stats || {};
  const cv = d.coverage || {};
  if (p.from && p.to)
    parts.push(`period <strong>${escapeHtml(p.from)} → ${escapeHtml(p.to)}</strong>`);
  else if (p.lookback_days != null)
    parts.push(`lookback <strong>${p.lookback_days}d</strong>`);
  if (is.total_articles != null) parts.push(`articles <strong>${is.total_articles}</strong>`);
  if (is.sources_present != null) parts.push(`sources <strong>${is.sources_present}</strong>`);
  if (is.after_filter != null) parts.push(`after filter <strong>${is.after_filter}</strong>`);
  if (cv.coverage_pct != null) {
    const pct = (cv.coverage_pct <= 1 ? cv.coverage_pct * 100 : cv.coverage_pct);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  } else if (cv.sources_covered != null && cv.sources_total != null) {
    parts.push(`coverage <strong>${cv.sources_covered}/${cv.sources_total}</strong>`);
  }
  return parts.join(' | ');
}

function reportDate(d) {
  if (d.period && d.period.to) return d.period.to;
  if (d.collected_at) return String(d.collected_at).slice(0, 10);
  return '';
}

// ---------- interactions ----------
function toggleSection(headEl) { headEl.parentElement.classList.toggle('open'); }
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('lightbox').classList.contains('open')) {
    closeLightbox();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = reportDate(d);
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  const s = d.sections || {};
  const out = [
    renderSummary(d.summary),
    renderSection('A.', 'Debates — Consensus vs Divergence', s.A_debates,    renderTheme),
    renderSection('B.', 'Key Calls & Positioning',           s.B_calls,      renderCall),
    renderSection('C.', 'Notable Deep Reads',                s.C_deep_reads, renderDeepRead,
                  'section-deepreads'),
    renderSection('D.', 'Charts & Data',                     s.D_charts,     renderChart),
    renderSection('E.', 'House Views',                       s.house_views,  renderHouseView),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = out || '<div class="empty">No report data.</div>';

  // Auto-open Summary's section view: first two sections open by default.
  document.querySelectorAll('.section').forEach((sec, i) => {
    if (i < 2) sec.classList.add('open');
  });
}

renderReport(REPORT_DATA);
</script>
