const META = {
  date: "2026-08-24",
  time: "03:05 CEST",
  windowStart: "2026-08-23 21:05 CEST",
  windowEnd: "2026-08-24 03:05 CEST",
  emailsInWindow: 11,
  emailsRead: 11,
  itemsExtracted: 18,
  includedSources: [
    {name:"Dark Side of the Boom", count:7},
    {name:"SemiAnalysis", count:2},
    {name:"The Pressure Point (Fulcrum)", count:1},
    {name:"Speedrun (pequityresearch)", count:1},
    {name:"Chamath", count:3},
    {name:"Neil Sethi", count:2},
    {name:"Maverick Equity Research", count:1},
    {name:"McKinsey", count:1}
  ],
  skippedSources: []
};

const CAT_COLORS = {
  macro:"#e24b4a", credit:"#378add", positioning:"#ef9f27", "AI/infra":"#1d9e75",
  crypto:"#7f77dd", geopolitics:"#d85a30", energy:"#f97316", tech:"#06b6d4",
  gold:"#d4a017", culture:"#ec4899", labor:"#8b5cf6", regulation:"#64748b",
  science:"#14b8a6", venture:"#84cc16"
};
const URG_META = {
  act:{emoji:"🔴", label:"Act Now"},
  deep:{emoji:"🔵", label:"Deep"},
  watch:{emoji:"🟡", label:"Watch"}
};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function catCounts(){
  const m = {};
  ITEMS.forEach(i=>{ m[i.cat]=(m[i.cat]||0)+1; });
  return m;
}
function urgCounts(){
  const m = {act:0, deep:0, watch:0};
  ITEMS.forEach(i=>{ m[i.urgency]=(m[i.urgency]||0)+1; });
  return m;
}

function renderFilters(){
  const cc = catCounts();
  const cats = Object.keys(cc).sort();
  const catBar = document.getElementById('catBar');
  let html = '<button class="pill' + (activeCat==='all'?' active':'') + '" style="' + (activeCat==='all'?'background:#333;':'') + '" onclick="setCat(\'all\')">All <span class="count">' + ITEMS.length + '</span></button>';
  cats.forEach(function(c){
    const color = CAT_COLORS[c] || "#888";
    const isActive = activeCat === c;
    html += '<button class="pill' + (isActive?' active':'') + '" style="' + (isActive? ('background:'+color+';border-color:'+color+';') : ('color:'+color+';border-color:'+color+';')) + '" onclick="setCat(\'' + c + '\')">' + c + ' <span class="count">' + cc[c] + '</span></button>';
  });
  catBar.innerHTML = html;

  const uc = urgCounts();
  const urgBar = document.getElementById('urgBar');
  let uhtml = '<button class="pill' + (activeUrg==='all'?' active':'') + '" style="' + (activeUrg==='all'?'background:#333;':'') + '" onclick="setUrg(\'all\')">All <span class="count">' + ITEMS.length + '</span></button>';
  ['act','deep','watch'].forEach(function(u){
    const meta = URG_META[u];
    const isActive = activeUrg === u;
    const color = u==='act' ? '#e24b4a' : (u==='deep' ? '#378add' : '#ef9f27');
    uhtml += '<button class="pill' + (isActive?' active':'') + '" style="' + (isActive? ('background:'+color+';border-color:'+color+';') : ('color:'+color+';border-color:'+color+';')) + '" onclick="setUrg(\'' + u + '\')">' + meta.emoji + ' ' + meta.label + ' <span class="count">' + uc[u] + '</span></button>';
  });
  urgBar.innerHTML = uhtml;

  document.getElementById('metaLine').textContent = META.date + '  ·  ' + META.time + '  ·  ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources';
}

function setCat(c){ activeCat = c; activeSrc = null; renderFilters(); renderCards(); }
function setUrg(u){ activeUrg = u; activeSrc = null; renderFilters(); renderCards(); }
function filterBySrc(name){
  activeSrc = name; activeCat = "all"; activeUrg = "all";
  renderFilters(); renderCards();
  ITEMS.forEach(function(item){
    if(item.source.indexOf(name) !== -1){
      const el = document.getElementById('card-' + item.id);
      if(el) el.classList.add('open');
    }
  });
}

function toggleCard(id){
  const el = document.getElementById('card-' + id);
  el.classList.toggle('open');
}

function renderCards(){
  const container = document.getElementById('cards');
  let html = '';
  ITEMS.forEach(function(item, idx){
    if(activeCat !== 'all' && item.cat !== activeCat) return;
    if(activeUrg !== 'all' && item.urgency !== activeUrg) return;
    if(activeSrc && item.source.indexOf(activeSrc) === -1) return;
    const color = CAT_COLORS[item.cat] || "#888";
    const urg = URG_META[item.urgency];
    const chartFlag = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');
    html += '<div class="card" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx idx-arrow">' + String(idx+1).padStart(2,'0') + '</span>';
    html += '<span class="urg">' + urg.emoji + '</span>';
    html += '<span class="badge" style="background:' + color + '">' + item.source.split(' (')[0] + '</span>';
    html += '<span class="catpill">' + item.cat + '</span>';
    if(chartFlag) html += '<span class="chartflag">' + chartFlag + '</span>';
    html += '<span class="title">' + item.title + '</span>';
    html += '</div>';
    html += '<div class="card-body">';
    html += '<div class="section-label">The Idea</div><div class="idea-text">' + item.idea + '</div>';
    html += '<div class="section-label">My Angle</div><div class="angle-box" style="border-color:' + color + ';background:' + color + '14;">' + item.angle + '</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    html += '<div class="charts-box' + (item.charts.hot?' hot':'') + '">' + (item.charts.count>0 ? (item.charts.count + ' chart(s) — ') : '') + item.charts.desc + '</div>';
    html += '<div class="link-row"><a href="' + item.link + '" target="_blank" rel="noopener">↗ Read full article</a></div>';
    html += '</div>';
    html += '</div>';
  });
  if(!html) html = '<div style="text-align:center;color:#948e84;padding:40px 0;">No items match this filter.</div>';
  container.innerHTML = html;
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function renderReport(){
  var body = document.getElementById('reportBody');
  var html = '';
  html += '<div><strong>Window:</strong> ' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</div>';
  html += '<div style="margin-top:6px;"><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp;·&nbsp; <strong>Emails read:</strong> ' + META.emailsRead + ' &nbsp;·&nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</div>';
  html += '<h4>Included Sources (click to filter)</h4>';
  META.includedSources.forEach(function(s){
    html += '<div><span class="srcline" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span> — ' + s.count + ' item(s)</div>';
  });
  html += '<h4>Skipped Sources</h4>';
  if(META.skippedSources.length === 0){
    html += '<div class="skiprow">None — all 11 in-window emails were substantive and processed.</div>';
  }
  META.skippedSources.forEach(function(s){
    html += '<div class="skiprow"><strong>' + s.name + '</strong> — ' + s.reason + '</div>';
  });
  body.innerHTML = html;
}

renderFilters();
renderCards();
renderReport();
</script>
</body>
</html>
