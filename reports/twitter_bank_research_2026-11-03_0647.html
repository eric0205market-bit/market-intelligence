<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {

}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }

.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }

.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DATA POINT TAGS */
.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}

<script>
const REPORT_DATA = {"freshness_gate": "FRESHNESS GATE PASSED.", "report_type": "TWITTER BANK RESEARCH", "collected_at": "2026-11-03T06:23:52Z", "window_days": 4, "input_stats": {"total_tweets": 120, "considered": 120, "kept": 20, "dropped": 100, "deduped": 0}, "summary": "Treasury Quarterly Refunding/borrowing estimates appear across BofA, Citi, JPM, UBS, Barclays and Goldman.\nGoldman dominates with AI adoption/employment trackers, prime book and derivatives flow charts.\nBofA items cover CTA sell triggers, dealer gamma and private client equity flows.\nCitadel buyback window, Morgan Stanley consumer view and Apollo/Slok Fed-hike model each appear once.\nCounts: Goldman 12, BofA 5, Citi 2, JPM 2, Apollo/Slok 1, Barclays 1, Citadel 1, Morgan Stanley 1, UBS 1", "by_bank_counts": {"Goldman": 12, "BofA": 5, "Citi": 2, "JPM": 2, "Apollo/Slok": 1, "Barclays": 1, "Citadel": 1, "Morgan Stanley": 1, "UBS": 1}, "banks": [{"bank": "Goldman", "theme": "Goldman — AI adoption & employment trackers, derivatives/prime book flows, style charts", "items": [{"author": "neilsethinew", "text": "Traders/investors were adding risk into the end-of-week selloff. \n\nPer DB’s read of EPFR data (week through Wednesday, October 28th), equity funds took in about 0.2% of assets for a third straight week, bond fund inflows ticked up by about 0.15%, and money market inflows slowed to near zero (from about +0.25% the prior week).\n\nThe risk appetite showed up abroad. EM equity funds took in more than 1% of assets for a second week, led by Asia ex-Japan (about 2%), while Latin America saw outflows (about −0.85%) after big inflows earlier in the month, and US equity funds took in less than 0.1%. By sector, Tech funds still saw inflows (about 0.35%), but well below the prior week’s ~1.2%, while Utilities saw outflows for a second week (about −0.5%).", "tweet_url": "https://x.com/neilsethinew/status/2117319579261399106", "images": ["https://pbs.twimg.com/media/HWIwczDWgAA4W82.png"], "created_at": "2026-11-02T18:15:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Value vs growth... a years-long smile GS https://t.co/6mWfoNwMkE", "tweet_url": "https://x.com/MikeZaccardi/status/2117285882738708658", "images": ["https://pbs.twimg.com/media/HWIcSmBWUAEjCEO.png"], "created_at": "2026-11-02T16:01:06.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Welcome to the party, 2028 earnings estimates... it too is on a heater GS https://t.co/wf7jCOzTOG", "tweet_url": "https://x.com/MikeZaccardi/status/2117273294848024822", "images": ["https://pbs.twimg.com/media/HWIQ15BXkAABTMV.png"], "created_at": "2026-11-02T15:11:05.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman’s derivatives desk says that “for the first time, we are now seeing flows catch up to the bear thesis,” with Friday’s activity concentrated in buying downside on the index and semis. Vol of vol (VVIX) hit 124 intraday Friday, its highest since March.\n\nBut they note markets are strangely sanguine ahead of the election. Gamma “hasn’t repriced to the same extent as vol and skew”: the straddle through Wednesday’s close, covering the midterms, they find is just priced at a 1.51% move, less than Friday’s 1.82% drop. \n\nThe S&P 500’s implied move through Friday is just 1.84%. The VIX itself closed Friday at 19.42, after hitting 23.93 intraday, below its close the prior two Fridays.", "tweet_url": "https://x.com/neilsethinew/status/2117259599610777831", "images": ["https://pbs.twimg.com/media/HWIEYoGX0AArENw.jpg"], "created_at": "2026-11-02T14:16:39.000Z", "relayers": []}, {"author": "neilsethinew", "text": "At Wednesday’s Quarterly Refunding Announcement, Treasury will set note and bond auction sizes for the next quarter. That starts with next week’s refunding auctions, which would total $125B if sizes are unchanged: $58B of 3s, $42B of 10s and $25B of 30s. It will also update its guidance on future coupon sales.\n\nSome on the Street are speculating that Treasury will shift supply away from the long end, particularly 20- and 30-year bonds, and toward T-bills. Citi expects cuts to 20s and 30s starting this month. BofA, Goldman, UBS and Barclays are among those looking for a change to the “at least the next several quarters” language in place since January 2024, although UBS sees no actual change in issuance until May. JPMorgan is the notable dissent. It expects the language to hold into 2027 and argues that cutting long bonds wouldn’t be prudent given the borrowing ahead and early signs that bill demand is stalling.\n\nThe motive is yields. The 30-year was still above 5.30% on Friday after long rates hit their highest in more than two decades in early October.\n\nThat shift though would push the T-bill share of debt further above the ~20% average the TBAC advised in 2024:\n\n▪ Bills were 22.4% of marketable debt at the end of September. Rolling that forward with daily Treasury data puts October at ~23.0%, the highest since early 2021.\n\n▪ BofA and Goldman already see 24.3% in 2027, and Goldman 24.9% in 2028, near the 25.5% pandemic peak. That’s before any shift out of the long end.\n\n▪ For scale, Treasury sold ~$445B of nominal 20- and 30-year bonds over the past 12 months. Moving half of that into bills would add roughly 0.7 points a year to the bill share.\n\nHeavier bill reliance is also why gross issuance is already at a record given they need to be rolled over frequently. Treasury auctioned $839B last week, the most in data back to 1979. The 13-week average is $636B, nearly 3x the 2019 average of $226B. \n\nThe downside of this moves to shorter maturities is that this leaves Treasury’s interest costs more exposed to swings in short-term rates, with the market pricing three more rate hikes from the Fed by the end of 2027. And while investors have piled into bills since the pandemic, there’s no assurance that demand will continue. \n\nBills outstanding have nearly tripled, from $2.6T in February 2020 to $7.1T in September. JPMorgan is already flagging early signs of stalling, and the stablecoin bid Treasury officials have touted has yet to show up at scale.\n\nTreasury also updates its quarterly borrowing estimates this afternoon.", "tweet_url": "https://x.com/neilsethinew/status/2117247620850532664", "images": ["https://pbs.twimg.com/media/HWHz8jHW8AA4Ao-.jpg"], "created_at": "2026-11-02T13:29:04.000Z", "relayers": []}, {"author": "neilsethinew", "text": "@C_Barraud's packed Monday Brief had several items on AI investment, costs, leverage, etc., including a ZH article that covers a lot of ground but notes that MS says hedge funds had moved underweight the broader AI trade for the first time since early 2023, with a de-grossing over the past few months that marks \"the largest sustained stretch of L/S fund de-risking in over 15 years, as gross exposure never fully recovered between episodes\n\n\"The MS Prime Brokerage data is brutal: cumulative gross flow is now down 8% from the June peak, the largest sustained de-grossing on record.\"\n\nThey go on to note though, in line with my post earlier this morning about Goldman's prime data, that hedge funds did take up net positioning slightly but \"the bulk of ... buying came from short covering, which pushed US L/S net leverage up 5 points to 51%, while gross slipped 1 point to 207% (still in the 92nd percentile since 2010, but just the 10th percentile over the past year).\"\n\nThey go on to note that the overall degrossing in AI names with money rotating in other sectors (note the record dispersion Friday) has seen \"single-name vol relative to index vol [hit] a record high (going back to 2005, and well above both the GFC and Covid), while the six-month pairwise correlation of S&P stocks has dropped to a record low below 10%.\"", "tweet_url": "https://x.com/neilsethinew/status/2117240310715605173", "images": ["https://pbs.twimg.com/media/HWHw8LRXIAAGT_y.png"], "created_at": "2026-11-02T13:00:01.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Job Growth Drag in AI-Affected Industries Currently Stands at -6k/mo\n\nBroader employment contraction in AI-affected industries since mid-2023 https://t.co/qBd9MGNxGQ", "tweet_url": "https://x.com/MikeZaccardi/status/2117238043396428026", "images": ["https://pbs.twimg.com/media/HWHwx_mW4AARYvn.png"], "created_at": "2026-11-02T12:51:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Tech’s Employment Share Continues to Decline Below Its Long-Run Trend https://t.co/AJyNfbKJWK", "tweet_url": "https://x.com/MikeZaccardi/status/2117237414242513228", "images": ["https://pbs.twimg.com/media/HWHwNXjWEAAmAop.png"], "created_at": "2026-11-02T12:48:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: A Statistically Significant Relationship Between AI Adoption and Job Growth and Unemployment Among Nonmanufacturing Subsectors https://t.co/ZjKyt1Yw2Z", "tweet_url": "https://x.com/MikeZaccardi/status/2117236785285566833", "images": ["https://pbs.twimg.com/media/HWHvowiWcAA9-Xl.jpg"], "created_at": "2026-11-02T12:46:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: AI Adoption Rises to 24.6% in October, +0.8ppt m/m...  28.6% Expect to Use AI In the Next 6 Months\n-Adoption Approaching 50% in the Information, Professional, and Finance Sectors\n\n'Our Tracking of 2026 Total Global AI Investment Currently Stands at $1.1tn' https://t.co/2TTgG5QsHv", "tweet_url": "https://x.com/MikeZaccardi/status/2117236155896754210", "images": ["https://pbs.twimg.com/media/HWHvEIjWkAAJmGl.png"], "created_at": "2026-11-02T12:43:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "The Goldman Sachs Analyst Index (GSAI) declined by 6.5pt to 49.1 in October, dipping below 50 for the first time since April 2025.\n\nOther business activity surveys were mixed to stronger on net this month. PMIs on tap later this morning... https://t.co/QTvkP91id8", "tweet_url": "https://x.com/MikeZaccardi/status/2117235527099330787", "images": ["https://pbs.twimg.com/media/HWHufg_XwAA1tiB.png"], "created_at": "2026-11-02T12:41:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman’s Prime Book says hedge funds were starting to cover their big net short position through Thursday.  That might have been derailed by Friday's action.\n\nThey say hedge funds net bought US stocks for the first time in four weeks (October 23–29, +1.1 standard deviations vs. the past year). But it was mostly taking off their index shorts, not new longs:\n\n▪️ Index and ETF products were 73% of the buying. US-listed ETF shorts fell 4.8%, the most covering in more than six months.\n▪️ Single stocks were modestly net bought after five weeks of selling, almost entirely on short covers.\n▪️ Info Tech was the most net bought sector, but that buying was only ~40% of what was sold the prior three weeks. The Mag 7 were net sold in 4 of the last 5 sessions, “suggesting little recovery in risk appetite.”\n▪️ Net leverage rose 3.6 points to 47.0% from last week’s five-year low, but it’s still only in the 5th percentile over five years. Gross leverage (216.3%) is in the 91st, and the long/short ratio is in the 1st.\n▪️ The Prime data run through Thursday. Goldman’s Shares desk said hedge fund flows “finished balanced” for the full week, including Friday’s selloff.\n\nSo hedge funds were slowly taking bearish bets off, not adding risk. With net exposure still near five-year lows, there’s plenty of room for more covering, fuel for an *eventual* rally.\n\nhttps://t.co/Zslc78IW87", "tweet_url": "https://x.com/neilsethinew/status/2117235274153689427", "images": ["https://pbs.twimg.com/media/HWHn4yyXkAA3pat.jpg"], "created_at": "2026-11-02T12:40:00.000Z", "relayers": []}]}, {"bank": "BofA", "theme": "BofA — CTA triggers, gamma, private client flows, refunding", "items": [{"author": "neilsethinew", "text": "As an update to this morning's post on the Treasury's Quarterly Refunding, Treasury released its quarterly borrowing estimates this afternoon, and while the headline figure for this quarter edged lower due to a higher starting cash balance, the underlying need moved up and next quarter’s number is projected to be much larger, meaning an even greater reliance on bills if non-bill borrowing remains constant or shrinks.\n\n▪ Oct–Dec (current quarter): Treasury expects to borrow $618B, $10B less than its August estimate. That cut came entirely from starting the quarter with $34B more cash than assumed. Excluding the cash balance, borrowing is $24B higher than in August, meaning the deficit is running wider than expected.\n\n▪ Jan–Mar: $800B, up 38% from $578B in the first estimate for the same quarter a year ago. About $150B is a planned cash build to $1T by end-March (from $850B). Excluding that, the need is $650B, still up 12%.\n\n▪ Across both quarters, borrowing excluding cash swings totals ~$1.4T vs $1.19T in last November’s estimates, up 18%.\n\n▪ Jul–Sep (last quarter) came in a touch better: $742B borrowed vs a $739B estimate, but $34B went to a bigger cash pile, so the underlying need was $30B below August’s projection.\n\nIf note and bond sizes are held steady Wednesday, bills have to carry most of the increase. Net note and bond issuance ran $322B last quarter. At that pace, bills fund roughly half of this quarter’s borrowing and ~60% of next quarter’s, about $480B of net new bills.\n\nPer Claude that lifts the bill share of marketable debt to ~23.7% by end-March, with ~$7.9T outstanding. That would be the highest since December 2020, already close to BofA’s 24.3% (~$8T) projection for next September and well above the ~20% average the TBAC advised in 2024. And that’s before any shift away from 20- and 30-year bonds, which some on the Street (Citi) expect.\n\nCaveat: April tax receipts typically pay bills down, so March would likely be a near-term high. Last April–June, bills outstanding fell $129B and the share eased from 22.1% to 21.5%.", "tweet_url": "https://x.com/neilsethinew/status/2117355235983196429", "images": ["https://pbs.twimg.com/media/HWJbWPGXYAA90nj.jpg"], "created_at": "2026-11-02T20:36:41.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BofA says private clients ($4.6 trillion AUM) were buyers again, logging their 2nd-biggest weekly equity inflow on record. Curiously, they said it was “driven by IPO proceeds,” and I’m not sure what that refers to, as there haven’t been any major IPOs the last couple of weeks.\n\nWith the equity drawdown though allocations barely moved: stocks 66.0% (from 65.9%), bonds 17.5% and cash 9.4%. That’s just off stocks’ record high of 66.4% and cash’s record low of 9.3%.", "tweet_url": "https://x.com/neilsethinew/status/2117330652190458163", "images": ["https://pbs.twimg.com/media/HWIwpeDXwAANaBz.jpg"], "created_at": "2026-11-02T18:59:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "BofA sees CTA selling thresholds for the SPX right around Friday's closing levels. \n\nThe sell trigger for the S&P 500 now sits around −0.1% (from ~−0.5% the prior week), measured on December S&P 500 futures: 7,606 vs. Friday’s 7,617, and BofA says a further ~2% decline would fully unwind CTAs’ remaining longs. No sell triggers were listed for the Nasdaq-100 (from ~−0.2%), where 11 of BofA’s 12 CTA models have now stopped out, or the Russell 2000 (from ~−3.0%), but they see a buy trigger for the latter at +1.8% (from +2.4%).\n\nFor the upcoming week in global CTA equity flows they see:\n\n−$15B of selling in a flat market (from −$48B the prior week), with selling from CTAs (~$8B), risk parity (~$5B) and vol control (~$2B);\n\n+$37B of buying in an “up” market (BofA’s high-percentile path, which scales with volatility and this week implies roughly +2.6% for S&P 500 futures over five days; from −$1B of selling), almost all from CTAs reloading (~$34B), the biggest up-market buying estimate in the last eight weeks; and\n\n−$63B of selling in a “down” market (BofA’s low-percentile path, roughly −3.8% for S&P futures this week vs about −5% the prior two weeks; from −$79B), split between vol control (~$32B) and CTAs (~$30B).\n\nGlobal systematic positioning fell to ~$290B as CTAs de-risked this week, below its five-year median (~$315B) and down from ~$370B a month ago.", "tweet_url": "https://x.com/neilsethinew/status/2117268067654713746", "images": ["https://pbs.twimg.com/media/HWIL4hYWoAAgWJV.jpg"], "created_at": "2026-11-02T14:50:18.000Z", "relayers": []}, {"author": "neilsethinew", "text": "At Wednesday’s Quarterly Refunding Announcement, Treasury will set note and bond auction sizes for the next quarter. That starts with next week’s refunding auctions, which would total $125B if sizes are unchanged: $58B of 3s, $42B of 10s and $25B of 30s. It will also update its guidance on future coupon sales.\n\nSome on the Street are speculating that Treasury will shift supply away from the long end, particularly 20- and 30-year bonds, and toward T-bills. Citi expects cuts to 20s and 30s starting this month. BofA, Goldman, UBS and Barclays are among those looking for a change to the “at least the next several quarters” language in place since January 2024, although UBS sees no actual change in issuance until May. JPMorgan is the notable dissent. It expects the language to hold into 2027 and argues that cutting long bonds wouldn’t be prudent given the borrowing ahead and early signs that bill demand is stalling.\n\nThe motive is yields. The 30-year was still above 5.30% on Friday after long rates hit their highest in more than two decades in early October.\n\nThat shift though would push the T-bill share of debt further above the ~20% average the TBAC advised in 2024:\n\n▪ Bills were 22.4% of marketable debt at the end of September. Rolling that forward with daily Treasury data puts October at ~23.0%, the highest since early 2021.\n\n▪ BofA and Goldman already see 24.3% in 2027, and Goldman 24.9% in 2028, near the 25.5% pandemic peak. That’s before any shift out of the long end.\n\n▪ F // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
</body>
