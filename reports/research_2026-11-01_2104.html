function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function visible(i){
  if(state.cat!=="all" && i.cat!==state.cat) return false;
  if(state.urg!=="all" && i.urgency!==state.urg) return false;
  if(state.src && i.source.indexOf(state.src)===-1) return false;
  return true;
}

function setCat(c){state.cat=c;state.src=null;open={};render();}
function setUrg(u){state.urg=u;state.src=null;open={};render();}
function filterBySrc(name){
  state.src=name;state.cat="all";state.urg="all";open={};
  ITEMS.forEach(function(i){if(i.source.indexOf(name)!==-1)open[i.id]=true;});
  render();
  window.scrollTo(0,0);
}
function toggle(id){open[id]=!open[id];render();}

function renderBars(){
  var cats={};ITEMS.forEach(function(i){cats[i.cat]=(cats[i.cat]||0)+1;});
  var h='<span class="pill'+(state.cat==="all"?' active':'')+'" style="'+(state.cat==="all"?'background:#333':'')+'" onclick="setCat(\'all\')">All '+ITEMS.length+'</span>';
  Object.keys(cats).sort().forEach(function(c){
    var col=COLORS[c]||"#888";var a=state.cat===c;
    h+='<span class="pill'+(a?' active':'')+'" style="'+(a?'background:'+col:'')+'" onclick="setCat(this.getAttribute(\'data-c\'))" data-c="'+esc(c)+'">'+esc(c)+' '+cats[c]+'</span>';
  });
  document.getElementById('catbar').innerHTML=h;
  var u={act:0,deep:0,watch:0};ITEMS.forEach(function(i){u[i.urgency]++;});
  var defs=[["all","All "+ITEMS.length],["act","🔴 Act Now "+u.act],["deep","🔵 Deep "+u.deep],["watch","🟡 Watch "+u.watch]];
  var h2='';
  defs.forEach(function(d){var a=state.urg===d[0];h2+='<span class="pill'+(a?' active':'')+'" style="'+(a?'background:#333':'')+'" onclick="setUrg(\''+d[0]+'\')">'+d[1]+'</span>';});
  document.getElementById('urgbar').innerHTML=h2;
}

function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';
  var rb='<p><b>Window:</b> '+esc(META.windowStart)+' to '+esc(META.windowEnd)+'. Emails outside this window were not processed.</p>';
  rb+='<p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items extracted: '+META.itemsExtracted+'</p>';
  rb+='<p><b>Included sources</b> (click to filter):<br>';
  META.includedSources.forEach(function(s){rb+='<span class="src" data-n="'+esc(s.name)+'" onclick="filterBySrc(this.getAttribute(\'data-n\'))">'+esc(s.name)+'</span> ('+s.count+')<br>';});
  rb+='</p><p><b>Skipped sources</b>:<br>';
  META.skippedSources.forEach(function(s){rb+=esc(s.name)+' — '+esc(s.reason)+'<br>';});
  rb+='</p>';
  document.getElementById('repbody').innerHTML=rb;
  render();
}

function render(){
  renderBars();
  var h='';var n=0;
  ITEMS.forEach(function(item){
    if(!visible(item))return;
    n++;
    var col=COLORS[item.cat]||"#888";
    var isOpen=!!open[item.id];
    var ch=item.charts&&item.charts.count>0;
    h+='<div class="card'+(isOpen?' open':'')+'">';
    h+='<div class="ch" onclick="toggle('+item.id+')">';
    h+='<span class="num">'+(item.id<10?'0':'')+item.id+'</span><span>'+URG[item.urgency]+'</span>';
    h+='<span class="badge" style="background:'+col+'">'+esc(item.source)+'</span>';
    h+='<span class="tag">'+esc(item.cat)+'</span>';
    if(ch)h+='<span>'+(item.charts.hot?'🔥':'📊')+'</span>';
    h+='<span class="ttl">'+esc(item.title)+'</span></div>';
    h+='<div class="body">';
    h+='<div class="lbl">The Idea</div><div>'+esc(item.idea)+'</div>';
    h+='<div class="lbl">My Angle</div><div class="angle" style="border-left-color:'+col+';background:'+col+'14">'+esc(item.angle)+'</div>';
    h+='<div class="tw"><div class="tb"><div class="lbl" style="color:#378add">TWEET A</div><div class="tbtxt">'+esc(item.tweetA)+'</div>';
    h+='<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    h+='<div class="tb"><div class="lbl" style="color:#7f77dd">TWEET B</div><div class="tbtxt">'+esc(item.tweetB)+'</div>';
    h+='<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>';
    if(item.charts&&(item.charts.count>0||item.charts.desc)){
      h+='<div class="chart'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING · ':'📊 ')+(item.charts.count>0?item.charts.count+' chart(s) · ':'')+esc(item.charts.desc)+'</div>';
    }
    h+='<a class="lnk" href="'+esc(item.link)+'" target="_blank" rel="noopener">↗ Read full article</a>';
    h+='</div></div>';
  });
  if(!n)h='<div class="empty">No items match.</div>';
  document.getElementById('cards').innerHTML=h;
}
init();
</script>
</body>
</html>
