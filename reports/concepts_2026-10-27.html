const REPORT_DATA = {"date": "2026-10-27", "generated_at": "2026-10-27T11:21:28.000Z", "stats": {"cards": 10, "insights": 79, "sources": 8, "quote_verified_pct": null}, "cards": [{"record_id": "3110ce6ff7985c2b", "source_type": "concepts", "source_name": "BCG Henderson Institute", "source_url": "https://www.bcg.com/publications/2026/balance-ai-innovation-and-governance", "title": "How to Create AI Value by Balancing Innovation and Risk", "published_date": "2026-10-26", "language": "en", "processed_at": "2026-10-27T11:21:22Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech"], "gist": "BCG's 2026 Applied AI Index (1,330 leaders) plus a 142-leader governance survey argues AI innovation and governance are complements: firms scaling both earn ~3x the value of low-innovation firms, and transparency plus accountability separate 'accountable innovators' from unsupervised, cautious and merely experimenting firms.", "themes": [{"theme": "Governance as a value multiplier", "insights": [{"claim": "Companies that scale AI innovation alone see twice the ROI of low-innovation firms, while those that scale innovation together with AI governance see three times the value, so governance raises rather than caps AI returns.", "type": "data_point", "entities": ["BCG Applied AI Index", "enterprise AI"], "conviction": "high", "so_what": "Governance maturity is a screen for which enterprises will actually monetize AI deployments.", "quote": null, "locator": "Opening section", "quote_verified": false, "speaker": "BCG Henderson Institute"}, {"claim": "Organizations that both record and codify AI decisions are twice as likely to run more than 50 AI use cases in production and show more than 30% higher ROI than those that only record decisions.", "type": "data_point", "entities": ["enterprise AI", "AI governance"], "conviction": "high", "so_what": "Codified decision-making is a leading indicator of AI scaling capacity.", "quote": null, "locator": "Creating a Unified, Risk-Tiered Governance Framework", "quote_verified": false, "speaker": "BCG Henderson Institute"}, {"claim": "Accountable innovators are about twice as likely as cautious adopters to have 50+ AI use cases in production, showing excessive caution is itself a drag on deployment.", "type": "data_point", "entities": ["cautious adopters", "accountable innovators"], "conviction": "medium", "so_what": "Overly cautious corporates are likely AI laggards; do not treat low risk appetite as a safe AI posture.", "quote": null, "locator": "Cautious adopters paragraph", "quote_verified": false, "speaker": "BCG Henderson Institute"}, {"claim": "Organizations with mature governance are about twice as likely to embed agentic AI into legacy modernization and over three times as likely to use agents to strategically drive modernization.", "type": "data_point", "entities": ["agentic AI", "legacy modernization"], "conviction": "medium", "so_what": "Governance maturity correlates with enterprise-wide agent adoption, a demand driver for platform vendors.", "quote": null, "locator": "Automation section, Exhibit 5", "quote_verified": false, "speaker": "BCG Henderson Institute"}]}, {"theme": "Agentic AI risk amplification", "insights": [{"claim": "AI does not create new categories of enterprise risk; agentic systems amplify existing cyber, data, operations, people and compliance risks through breadth, speed and opacity.", "type": "framework", "entities": ["agentic AI", "enterprise risk"], "conviction": "high", "so_what": "Existing risk functions and vendors are the natural owners; budget is more likely to expand than new categories to form.", "quote": null, "locator": "What Can Go Wrong?", "quote_verified": false, "speaker": "BCG Henderson Institute"}, {"claim": "Reported AI incidents rose from 106 in 2022 to 445 in 2025, with 186 already logged in 2026 year to date, according to the AI Incident Database.", "type": "data_point", "entities": ["AI Incident Database", "agentic AI"], "conviction": "high", "so_what": "Steepening incident curve supports demand for AI monitoring, red-teaming and assurance tooling.", "quote": null, "locator": "What Can Go Wrong?", "quote_verified": false, "speaker": "BCG Henderson Institute"}, {"claim": "Most recent AI incidents involved no bad actor but an agent doing what it was asked via an unanticipated path with nobody watching, so build-phase testing is insufficient because systems behave correctly by their own logic after review.", "type": "causal", "entities": ["agentic AI", "AI testing"], "conviction": "high", "so_what": "Production runtime monitoring, not pre-deployment testing, is where assurance spending must go.", "quote": null, "locator": "What Can Go Wrong?", "quote_verified": false, "speaker": "BCG Henderson Institute"}, {"claim": "Because agentic systems are nondeterministic, testing alone cannot prove reliability and nondeterministic behavior evades signature-based detection.", "type": "causal", "entities": ["agentic AI", "cybersecurity"], "conviction": "medium", "so_what": "Signature-based security tooling is poorly matched to agent risk, favoring behavior-based monitoring.", "quote": null, "locator": "Opacity paragraph", "quote_verified": false, "speaker": "BCG Henderson Institute"}]}, {"theme": "Shadow AI and transparency", "insights": [{"claim": "On average 16% of employees at large firms with scaled AI use unapproved tools because sanctioned tools are too restrictive or employees are unaware of options.", "type": "data_point", "entities": ["shadow AI", "enterprise AI"], "conviction": "high", "so_what": "Restrictive approved-tool policies push usage underground, creating data leakage risk and a market for discovery tools.", "quote": null, "locator": "Survey of 142 policy leaders", "quote_verified": false, "speaker": "BCG Henderson Institute"}, {"claim": "Cautious adopters have the highest unauthorized-tool use: 46% estimate that 20% or more of their employees use unapproved AI, versus 24% of transparent experimenters.", "type": "data_point", "entities": ["cautious adopters", "transparent experimenters", "shadow AI"], "conviction": "medium", "so_what": "Blocking AI does not stop usage; it removes visibility.", "quote": null, "locator": "Archetypes section", "quote_verified": false, "speaker": "BCG Henderson Institute"}, {"claim": "Transparency means an inventory of AI systems and agents with named product owners, visibility into agent and user actions, and the capability to pause or shut down AI quickly.", "type": "framework", "entities": ["AI inventory", "kill switch"], "conviction": "medium", "so_what": "These three controls are a checklist for diligence on any enterprise AI deployer.", "quote": null, "locator": "The first lever is transparency", "quote_verified": false, "speaker": "BCG Henderson Institute"}, {"claim": "High-accountability organizations are more than two-and-a-half times as likely as others to have and deploy a kill switch for production AI systems.", "type": "data_point", "entities": ["kill switch", "accountable innovators"], "conviction": "medium", "so_what": "Kill-switch capability is an observable marker of governance maturity.", "quote": null, "locator": "Technical controls paragraph", "quote_verified": false, "speaker": "BCG Henderson Institute"}, {"claim": "Genuine limits on transparency remain: leaders can monitor tasks via compliance APIs but cannot easily see when someone builds and shares a skill or dashboard, which interviewees called a whack-a-mole problem.", "type": "anecdote", "entities": ["shadow AI", "compliance API"], "conviction": "medium", "so_what": "Citizen-development visibility is an unsolved product gap.", "quote": null, "locator": "Genuine Limits on Transparency", "quote_verified": false, "speaker": "BCG Henderson Institute"}]}, {"theme": "Accountability and archetypes", "insights": [{"claim": "BCG's matrix of transparency and accountability yields four archetypes: unsupervised adopters, transparent experimenters, cautious adopters and accountable innovators; in the 142-firm sample these were 59, 17, 33 and 25 companies.", "type": "framework", "entities": ["accountable innovators", "unsupervised adopters"], "conviction": "medium", "so_what": "Most large firms (59 of 134 classified) sit in the lowest-control quadrant, so a governance catch-up demand cycle is likely.", "quote": null, "locator": "Our Methodology", "quote_verified": false, "speaker": "BCG Henderson Institute"}, {"claim": "Transparent experimenters are almost 50% more likely than other quadrants to give general-purpose models like ChatGPT or Claude to all employees by default, and over three times as likely as accountable innovators to default to proceed-unless-told-to-stop under deadlines.", "type": "data_point", "entities": ["ChatGPT", "Claude", "transparent experimenters"], "conviction": "medium", "so_what": "Broad seat rollouts without accountability carry latent risk.", "quote": null, "locator": "Transparent experimenters paragraph", "quote_verified": false, "speaker": "BCG Henderson Institute"}, {"claim": "While 80% of 142 respondents say enterprise AI accountability sits with named executives or a standing committee, fewer than 10% have a single named executive, though 94% could name one primary owner; 75% pick among the chief AI, information or technology officer and only a minority the chief risk officer.", "type": "data_point", "entities": ["chief AI officer", "CIO", "CTO", "CRO"], "conviction": "medium", "so_what": "Ownership of AI sits with technology leaders, not risk, which shapes who buys governance tooling.", "quote": null, "locator": "Establishing Accountability and Continuous Learning at the Top", "quote_verified": false, "speaker": "BCG Henderson Institute"}, {"claim": "Only 52% of respondents say accountability for AI outcomes extends to end users, so cascading governance to users is a gap for most organizations.", "type": "data_point", "entities": ["end users", "AI governance"], "conviction": "medium", "so_what": "Diffuse accountability is a liability exposure area.", "quote": null, "locator": "Infusing the Organization Chart", "quote_verified": false, "speaker": "BCG Henderson Institute"}]}, {"theme": "Risk-tiering and automation", "insights": [{"claim": "BCG recommends a formal risk-tiering framework with four tiers: low risk (no review), moderate (some review), high (significant review) and critical (no-fly zone).", "type": "framework", "entities": ["AI risk tiering", "EU AI Act", "ISO/IEC 42001", "NIST AI RMF"], "conviction": "high", "so_what": "Regulatory regimes are being built around risk tiers, so tier-based programs are the compliance baseline.", "quote": null, "locator": "Creating a Unified, Risk-Tiered Governance Framework", "quote_verified": false, "speaker": "BCG Henderson Institute"}, {"claim": "Only 50% of respondents systematically document AI decisions with their analysis and assumptions, and only 26% incorporate resolved novel questions into standing guidance.", "type": "data_point", "entities": ["AI governance"], "conviction": "medium", "so_what": "Most firms still run governance manually, so automation of policy workflows is an open market.", "quote": null, "locator": "Creating a Unified, Risk-Tiered Governance Framework", "quote_verified": false, "speaker": "BCG Henderson Institute"}, {"claim": "One organization that built a risk hierarchy and automated precedent-backed decisions approved 80% of AI citizen-developer requests within hours, after previously taking more than two months for simple decisions.", "type": "anecdote", "entities": ["AI approvals", "citizen development"], "conviction": "medium", "so_what": "Automating low-risk approvals demonstrably unlocks throughput.", "quote": null, "locator": "Accountable innovators create a single place", "quote_verified": false, "speaker": "BCG Henderson Institute"}, {"claim": "A single request portal with streamlined and automated reviews makes companies 30% more likely to approve the average use case within four weeks and reduces shadow AI by 15%.", "type": "data_point", "entities": ["AI governance", "shadow AI"], "conviction": "medium", "so_what": "Evidence that governance tooling pays back in speed and reduced shadow usage.", "quote": null, "locator": "Streamlining and Automating Processes", "quote_verified": false, "speaker": "BCG Henderson Institute"}, {"claim": "Missing roles are a hidden gap: monitoring drift, revalidating after model updates, auditing agent behavior in production and red teaming new builds are continuous tasks not in anyone's job description.", "type": "causal", "entities": ["AI red teaming", "model drift"], "conviction": "medium", "so_what": "Expect hiring and services demand for AI assurance roles.", "quote": null, "locator": "Missing Roles", "quote_verified": false, "speaker": "BCG Henderson Institute"}, {"claim": "Where mistakes are punished, employees stop surfacing them and perform innovation instead of doing it, producing performative compliance.", "type": "contrarian", "entities": ["AI culture"], "conviction": "low", "so_what": "Self-reported AI adoption metrics may overstate real impact.", "quote": null, "locator": "Fear of Creating Performative Compliance", "quote_verified": false, "speaker": "BCG Henderson Institute"}]}], "insight_total": 23, "top_entities": ["BCG", "Applied AI Index", "agentic AI", "shadow AI", "AI Incident Database", "EU AI Act", "ChatGPT", "Claude", "kill switch", "chief AI officer"], "source_meta": {"author": "https://www.bcg.com/about/people/experts/matthew-kropp", "word_count": 4591, "paywalled": false}}, {"record_id": "9cd9140c6b070dad", "source_type": "concepts", "source_name": "Bessemer Venture Partners", "source_url": "https://www.bvp.com/news/bedrock-robotics-deploying-autonomous-equipment-for-the-built-world", "title": "Bedrock Robotics: Deploying autonomous equipment for the Built World", "published_date": "2026-10-26", "language": "en", "processed_at": "2026-10-27T11:21:22Z", "processor": "claude-code-sub- // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
