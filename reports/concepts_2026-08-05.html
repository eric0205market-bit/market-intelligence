s", "source_name": "ECB Blog", "source_url": "https://www.ecb.europa.eu/press/blog/date/2026/html/ecb.blog20260805~cdb927b992.en.html", "title": "Building resilience: how energy prices boost home efficiency", "published_date": "2026-08-05", "language": "en", "processed_at": "2026-08-05T20:18:54Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Energy", "Geopolitics"], "gist": "The ECB argues that the 2022 and 2026 energy price spikes triggered a euro area renovation wave in heat pumps, PV and insulation that cushions housing investment even as new-build construction keeps falling, with specialised construction activities at 75% of construction output and works on existing buildings above 60% of housebuilding. Household survey evidence shows high-bill, fossil-heated homes retrofit most, fossil space heating has fallen 3.5pp to 56% since 2023, and the authors conclude this structurally lowers the pass-through of oil price swings to inflation.", "themes": [{"theme": "Renovation, not new-build, is carrying euro area construction", "insights": [{"claim": "Specialised construction activities (finishing and installation work) make up 75% of euro area construction activity, so renovation demand rather than new housing starts is the dominant swing factor for construction output.", "speaker": "European Central Bank", "type": "data_point", "entities": ["euro area", "construction sector", "specialised construction activities"], "conviction": "high", "so_what": "Construction-exposed equities and building-materials names should be modelled off renovation volumes rather than housing starts.", "quote": "In fact, SCAs represent 75% of construction activity.", "locator": "Renovation wave drives building production", "quote_verified": true}, {"claim": "Industry surveys (Architects' Council of Europe, FIEC, EUROCONSTRUCT) put works on existing buildings at above 60% of total euro area housebuilding activity, and electrical, plumbing, heating and air conditioning installations alone at 40% of value added in the five largest euro area countries in 2023.", "speaker": "European Central Bank", "type": "data_point", "entities": ["Architects’ Council of Europe", "FIEC", "EUROCONSTRUCT", "euro area", "heating and air conditioning installations"], "conviction": "high", "so_what": "HVAC and electrical installation businesses are the largest single value-added pool in the construction chain, a direct read on the renovation cycle.", "quote": "Electrical, plumbing, heating and air conditioning installations alone accounted for 40% of value added in the five largest euro area countries in 2023.", "locator": "Renovation wave drives building production", "quote_verified": true}, {"claim": "Renovations of existing buildings have been the main driver of the recovery in euro area construction activity while construction of new buildings continues to decline.", "speaker": "European Central Bank", "type": "data_point", "entities": ["euro area", "construction sector", "housing investment"], "conviction": "high", "so_what": "A construction recovery that is renovation-led means volumes recover without the mortgage-rate-sensitive new-build channel reviving.", "quote": "Recently, renovations of existing buildings have been a main driver of the recovery in construction activity.", "locator": "Renovation wave drives building production", "quote_verified": true}, {"claim": "Producer prices for the manufacture of articles of concrete, cement and plaster rose 18% in 2022 and a further 7% up to Q2 2026, a cost shock the ECB flags as a likely reason new-build construction keeps falling.", "speaker": "European Central Bank", "type": "causal", "entities": ["concrete", "cement", "concrete, cement and plaster", "euro area"], "conviction": "medium", "so_what": "Energy-intensive materials producers are getting price but losing volume; input-cost pass-through is suppressing new-build demand.", "quote": "Producer prices in the sector “manufacture of articles of concrete, cement and plaster” increased by 18% in 2022 and by another 7% up to the second quarter of 2026.", "locator": "Producer prices in the sector", "quote_verified": true}, {"claim": "Energy price shocks hit construction through two opposing channels: they raise building and maintenance costs and tighten mortgage conditions, but simultaneously trigger a renovation wave that cushions the net hit to housing investment.", "speaker": "European Central Bank", "type": "framework", "entities": ["energy prices", "housing investment", "construction sector", "mortgages"], "conviction": "high", "so_what": "The net construction drag from an energy shock is smaller than the new-build drag alone, so bearish construction calls off an oil spike can be too aggressive.", "quote": "So while energy shocks may slow new construction, they can simultaneously drive a wave of renovation activity.", "locator": "When energy prices skyrocket, that often comes", "quote_verified": true}]}, {"theme": "Solar import boom and the collapse in PV module prices", "insights": [{"claim": "Euro area PV imports from China nearly doubled after the 2022 energy price hike caused by the war in Ukraine and have remained high since.", "speaker": "European Central Bank", "type": "data_point", "entities": ["China", "PV modules", "euro area", "Ukraine war"], "conviction": "high", "so_what": "Solar installation demand in Europe looks structurally step-changed rather than a one-off spike, supportive for installers and connection equipment.", "quote": "PV imports from China nearly doubled after the energy price hike and have remained high since then", "locator": "In 2022 PV imports to the euro area increased sharply", "quote_verified": true}, {"claim": "China supplied 97% of euro area photovoltaic module and panel imports by volume and 95% by value in 2025, an almost total single-country dependency in the equipment underpinning Europe's energy-efficiency push.", "speaker": "European Central Bank", "type": "data_point", "entities": ["China", "PV modules", "euro area", "import share"], "conviction": "high", "so_what": "Any tariff, export control or shipping disruption on Chinese PV would immediately re-price Europe's renovation and decarbonisation cost curve.", "quote": "Its import share stood at 97% or 95% in 2025 in terms of volumes and value, respectively.", "locator": "Notes: Concerning panel a) China is the main supplier", "quote_verified": true}, {"claim": "The average price of an imported tonne of PV modules or panels fell by two-thirds, from nearly EUR 5,000 in 2023 to only EUR 1,700 in 2026.", "speaker": "European Central Bank", "type": "data_point", "entities": ["PV modules", "China", "euro area"], "conviction": "high", "so_what": "Deflating hardware costs mean solar adoption keeps accelerating even without richer subsidies: bullish volumes, brutal for module manufacturer margins.", "quote": "The average price of an imported tonne of PV modules or panels fell by two-thirds – from nearly €5,000 in 2023 to only €1,700 in 2026.", "locator": "The decline in their prices since 2023", "quote_verified": true}, {"claim": "Demand for efficiency-enhancing equipment spills beyond installation into the manufacturers of the equipment and materials, their upstream suppliers, and the planning, installation and maintenance services around them.", "speaker": "European Central Bank", "type": "causal", "entities": ["heat pumps", "PV modules", "insulation", "manufacturing", "planning, installing and maintenance"], "conviction": "medium", "so_what": "The renovation trade is broader than solar hardware: upstream materials and downstream service providers capture the multiplier.", "quote": null, "locator": "The increased demand for efficiency-enhancing equipment also supports output", "quote_verified": false}]}, {"theme": "Middle East war spike already showing in subsidy queues", "insights": [{"claim": "In Germany, 64,000 households and businesses applied for funding to renovate their building envelope between March and May 2026, 16% more than a year earlier, while funding requests for heating investments rose by as much as 40%.", "speaker": "European Central Bank", "type": "data_point", "entities": ["Germany", "BAFA", "BMWE", "heat pumps", "insulation"], "conviction": "high", "so_what": "A high-frequency, near-real-time proxy for European renovation demand, with heating-system applications inflecting far faster than envelope work.", "quote": "Funding requests for heating investments increased by as much as 40% (Chart 2, panel b).", "locator": "In Germany, 64,000 households and businesses sought funding", "quote_verified": true}, {"claim": "Since the start of the war in the Middle East, national subsidy programmes for energy-saving measures in countries including the Netherlands and the United Kingdom have seen additional demand for financing.", "speaker": "European Central Bank", "type": "data_point", "entities": ["Netherlands", "United Kingdom", "war in the Middle East", "national subsidy programmes"], "conviction": "medium", "so_what": "Fiscal support for retrofits is scaling with the energy shock, adding a policy-funded floor under renovation volumes.", "quote": null, "locator": "More recently, since the beginning of the war in the Middle East", "quote_verified": false}, {"claim": "The ECB expects a further increase in renovation interest to drive housing investment going forward, because its February 2026 household survey data were collected before the Middle East war and the associated energy price spike.", "speaker": "European Central Bank", "type": "prediction", "entities": ["ECB", "Consumer Expectations Survey", "housing investment", "war in the Middle East"], "conviction": "medium", "so_what": "The surveyed renovation-planning share is a floor, not a peak: expect upward revisions to European renovation volume forecasts.", "quote": "These data were collected before the war in the Middle East had started and the associated energy price spike. So we might see an additional increase in interest in renovations driving housing investment going forward.", "locator": "These data were collected before the war", "quote_verified": true}]}, {"theme": "Household triggers: utility bills and fossil heating drive retrofits", "insights": [{"claim": "ECB Consumer Expectations Survey data show that when household utility costs grow faster in the preceding heating season, the share of energy-renovated dwellings rises, and that share jumped by 10 percentage points between February 2023 and February 2024 just after the Ukraine war energy shock.", "speaker": "European Central Bank", "type": "causal", "entities": ["ECB", "Consumer Expectations Survey", "households", "energy prices"], "conviction": "high", "so_what": "Retrofit demand lags the energy bill by roughly one heating season, giving a usable lead indicator for installers' order books.", "quote": "In the period closest to the Ukraine war, between February 2023 and 2024, this share jumped by 10 percentage points.", "locator": "Who renovates more?", "quote_verified": true}, {"claim": "Controlling for ownership, property type, age, past renovations and region, a EUR 100 increase in monthly utility costs is associated with a 0.8 percentage point higher probability of planning an energy-efficiency renovation, oil or gas heating with 1.7 percentage points higher, and renewable heating systems with 4.0 percentage points lower.", "speaker": "European Central Bank", "type": "framework", "entities": ["ECB", "Consumer Expectations Survey", "heat pumps", "oil or gas heating", "gas-based heating systems"], "conviction": "high", "so_what": "Quantifies the retrofit elasticity: the addressable market is concentrated in high-bill, fossil-heated homes, which is where installers and lenders should target.", "quote": "A €100 increase in monthly utility costs is related to a 0.8 percentage point higher renovation probability, a 1.7 percentage point higher probability of using oil or gas heating and a 4.0 percentage point lower probability of relying on renewable heating systems.", "locator": "Notes: In panel a) the blue line shows", "quote_verified": true}, {"claim": "As of February 2026, energy-efficiency renovations were the most frequently mentioned planned renovation type after general repairs, cited by 14.5% of ECB Consumer Expectations Survey respondents.", "speaker": "European Central Bank", "type": "data_point", "entities": ["ECB", "Consumer Expectations Survey", "households"], "conviction": "medium", "so_what": "A concrete size for the 12-month pipeline of European retrofit demand, and the base case for installer and heat-pump volume forecasts.", "quote": "Such plans were mentioned by 14.5% of CES respondents.", "locator": "Households facing higher expenditure on utilities", "quote_verified": true}, {"claim": "Euro area households already on renewable heating systems such as heat pumps or solar collectors are markedly less likely to plan efficiency renovations because they were not affected by the recent energy price spikes, implying the retrofit market shrinks as electrification proceeds.", "speaker": "European Central Bank", "type": "thesis", "entities": ["heat pumps", "solar collectors", "households"], "conviction": "medium", "so_what": "The renovation boom is a transition-phase revenue pool with a finite runway: model decay in the addressable base rather than a perpetual annuity.", "quote": null, "locator": "In contrast, the probability was lower for households", "quote_verified": false}]}, {"theme": "Lower fossil dependence dampens oil's pass-through to inflation", "insights": [{"claim": "The share of fossil fuels used for space heating in the euro area fell 3.5 percentage points between 2023 and 2026 to 56%, with the countries that were most dependent cutting the most.", "speaker": "European Central Bank", "type": "data_point", "entities": ["euro area", "oil", "oil and gas", "space heating"], "conviction": "high", "so_what": "Structural demand destruction in European heating oil and gas: a slow bleed in fossil heating fuel volumes.", "quote": "the share of fossil fuels used for space heating in the euro area declined by 3.5 percentage points between 2023 and 2026 to stand at 56%", "locator": "Investment increases resilience to energy-price shocks", "quote_verified": true}, {"claim": "Euro area households that carried out efficiency renovations saw utility costs grow about 9% in the following heating season in 2024 and 2025, versus about 11% for households that had not renovated.", "speaker": "European Central Bank", "type": "data_point", "entities": ["ECB", "Consumer Expectations Survey", "households"], "conviction": "medium", "so_what": "The measured payoff is real but modest, roughly 2 percentage points of bill-growth relief, which caps unsubsidised payback speed on retrofits.", "quote": "the average growth in utility costs over the next heating season was on average around 9% for households who implemented efficiency-related renovations and 11% for those that had not", "locator": "According to CES data, for the years 2024 and 2025", "quote_verified": true}, {"claim": "From 2028 the EU Emissions Trading System will cover the building sector, raising the cost of oil and gas and further incentivising a switch away from fossil-based heating systems.", "speaker": "European Central Bank", "type": "prediction", "entities": ["EU ETS", "EU", "oil", "oil and gas", "heat pumps"], "conviction": "high", "so_what": "A dated, legislated demand shock: the 2028 ETS extension is a forward catalyst for heat pump and insulation demand and a headwind for heating fuel distributors.", "quote": "From 2028, the building sector will also be covered by the EU ETS.", "locator": "Investment increases resilience to energy-price shocks", "quote_verified": true}, {"claim": "The European Green Deal's Renovation Wave Strategy targets at least doubling the annual rate of energy renovations by 2030, an explicit policy tailwind behind European retrofit volumes.", "speaker": "European Central Bank", "type": "data_point", "entities": ["European Green Deal", "Renovation Wave Strategy", "EU"], "conviction": "medium", "so_what": "Policy-set volume targets underwrite multi-year demand visibility for insulation, window and heating equipment suppliers.", "quote": "The European Green Deal aims to at least double the annual rate of energy renovations by 2030.", "locator": "EU policies are aiming to boost this trend", "quote_verified": true}, {"claim": "The ECB argues that improved building energy efficiency and lower reliance on oil and gas heating reduce the impact of oil price fluctuations on inflation, implying structurally lower energy pass-through into euro area headline inflation.", "speaker": "European Central Bank", "type": "thesis", "entities": ["ECB", "inflation", "oil", "monetary policy", "euro area"], "conviction": "high", "so_what": "If the oil-to-inflation beta is structurally falling, the ECB's reaction function to future energy spikes should be less hawkish than in 2022, relevant for euro rates and inflation swaps.", "quote": "This has positive implications for monetary policy – both improved energy efficiency and lower reliance on oil and gas heating reduce the impact of oil price fluctuations on inflation.", "locator": "This has positive implications for monetary policy", "quote_verified": true}]}], "insight_total": 21, "top_entities": ["ECB", "euro area", "China", "PV modules", "heat pumps", "Germany", "EU ETS", "European Green Deal", "Consumer Expectations Survey", "construction sector", "oil", "oil and gas"], "source_meta": {"author": "European Central Bank", "word_count": 2293, "paywalled": false}}, {"record_id": "213d88886082f829", "source_type": "concepts", "source_name": "Gavekal Research", "source_url": "https://research.gavekal.com/teaser/state-subsidies-subside-further/", "title": "State Subsidies Subside Further", "published_date": "2026-08-05", "language": "en", "processed_at": "2026- , "global consultation", "AI governance"], "conviction": "medium", "so_what": "Months, not years, is the claimed time-to-first-artifact — a plausible route by which an AI norm appears far ahead of any treaty process.", "quote": null, "locator": "The first tier, an LLM-mediated global consultation", "quote_verified": false}, {"claim": "A well-run global AI consultation should break results out by region rather than flatten them into a single global average, surfacing genuine divergences such as a Western emphasis on individual data privacy and precautionary restriction versus a data-sovereignty and development-first framing more common in Africa and India.", "speaker": "HÉLÈNE LANDEMORE", "type": "framework", "entities": ["Africa", "India", "data privacy", "data sovereignty", "AI regulation"], "conviction": "high", "so_what": "Names the actual axis of global AI regulatory divergence — development-first data sovereignty in Africa and India versus Western precaution — which shapes where AI products meet friction.", "quote": "a data-sovereignty and development-first framing more common in Africa and India", "locator": "The first tier, an LLM-mediated global consultation", "quote_verified": true}, {"claim": "Tier two would be an online global deliberation where participants interact with each other in real time mediated by AI facilitators, testing and sometimes replacing the recommendations produced by tier-one LLM aggregation.", "speaker": "HÉLÈNE LANDEMORE", "type": "framework", "entities": ["AI facilitators", "deliberative democracy"], "conviction": "medium", "so_what": "Creates a product category — AI deliberation facilitation at global scale — with no incumbent vendor.", "quote": null, "locator": "The second tier would be more logistically", "quote_verified": false}, {"claim": "Tier three would run local and national citizens' assemblies in every country and region, ideally combined with referenda, feeding into a concluding global citizens' assembly that could ratify, amend or supersede the earlier drafts.", "speaker": "HÉLÈNE LANDEMORE", "type": "framework", "entities": ["citizens' assemblies", "referenda", "United Nations"], "conviction": "medium", "so_what": "The institutional endgame requires state funding and standing, so national assembly mandates are the leading indicator that this path is real.", "quote": null, "locator": "The third tier would reach deeper still", "quote_verified": false}, {"claim": "The tiered design is explicitly a hedge against AI timeline uncertainty: if the clock is as short as feared there is still an artifact, and if it is longer the slower deeper tiers take over before the fast draft hardens into something unexamined.", "speaker": "HÉLÈNE LANDEMORE", "type": "framework", "entities": ["AI timelines", "AI governance"], "conviction": "high", "so_what": "A governance option-value structure — build the cheap fast floor first, keep the expensive slow process as the upgrade path.", "quote": "If the clock turns out to be as short as feared, we would not be left with nothing.", "locator": "The third tier would reach deeper still", "quote_verified": true}, {"claim": "The objection that a consultation reaching an unrepresentative fraction of humanity lacks legitimacy is answered by precedent: most early democratic constitutions were written by men for men with women absent from the room, and those were not retroactively voided but built on and corrected over time.", "speaker": "HÉLÈNE LANDEMORE", "type": "framework", "entities": ["constitutional law", "democratic legitimacy"], "conviction": "high", "so_what": "A rhetorical template letting labs and institutions ship imperfect governance artifacts now rather than wait for perfect representation.", "quote": null, "locator": "To be sure, any document produced through", "quote_verified": false}]}, {"theme": "Direct Asks To Anthropic, OpenAI And Meta", "insights": [{"claim": "In 2023 Anthropic and the Collective Intelligence Project sourced constitutional prin rkers", "hiring", "labor market"], "conviction": "medium", "so_what": "Net payroll prints will look uneventful while the AI-skill wage premium widens — trade the dispersion, not the aggregate.", "quote": "some firms are reducing hiring because AI automates tasks, while others are increasing hiring for AI-proficient workers", "locator": "Moreover, recruiting patterns are shifting", "quote_verified": true}]}, {"theme": "Jobs as Task Bundles and Retraining Over Firing", "insights": [{"claim": "The New York Fed's read of the evidence is that AI's labor-market impact so far has more to do with changing skill requirements than with eliminating jobs, an explicitly time-qualified conclusion rather than a permanent one.", "speaker": "Kartik B. Athreya", "type": "thesis", "entities": ["New York Fed", "AI", "labor market"], "conviction": "high", "so_what": "This is the Fed's working assumption for the employment side of its dual mandate — it implies no AI-driven easing bias until layoff data actually turn.", "quote": "AI’s labor-market impact has more to do with changing skill requirements than eliminating jobs—at least so far", "locator": "The data, then, indicate that", "quote_verified": true}, {"claim": "Treating each job as a 'bundle of tasks' rather than a single function is the right analytical frame for AI displacement, because when AI takes over some tasks it frees teams to work on other areas of production and respond to changing demand.", "speaker": "Kartik B. Athreya", "type": "framework", "entities": ["Luis Garicano", "AI", "task-based labor economics"], "conviction": "high", "so_what": "Screen companies by task exposure, not occupation labels — firms whose headcount sits on task bundles with high residual value are mispriced as 'AI roadkill'.", "quote": "it’s useful to think about each job as encompassing a “bundle of tasks” rather than a single function", "locator": "Adaptation and Diffusion", "quote_verified": true}, {"claim": "Work by Luis Garicano and coauthor oratory", "so_what": "A rare official-sector welfare critique of the attention-economy business model — a leading indicator of regulatory interest in AI-amplified social platforms.", "quote": "Constantly chasing those outcomes would also be a zero-sum game, since there can only be a few “best” meal experiences", "locator": "A world in which our consumption patterns", "quote_verified": true}, {"claim": "The New York Fed's summary judgment is that evidence on AI adoption suggests more muted effects on labor and hiring so far, even though anxiety about AI remains undiminished — an explicit gap between measured impact and perceived impact.", "speaker": "Kartik B. Athreya", "type": "thesis", "entities": ["New York Fed", "AI", "labor market", "hiring"], "conviction": "high", "so_what": "The measured-vs-perceived gap is the tradable inefficiency: sentiment-sensitive assets can overreact to AI job-loss narratives the Fed's own data do not yet support.", "quote": "the evidence on adoption suggests more muted effects on labor and hiring so far, but anxiety remains just the same.", "locator": "Ending where we began", "quote_verified": true}]}], "insight_total": 16, "top_entities": ["New York Fed", "Kartik B. Athreya", "AI", "Regional Business Surveys", "Luis Garicano", "Survey of Consumer Expectations", "service firms", "manufacturers", "college-educated workers", "social media platforms", "universal basic income (UBI)", "labor market"], "source_meta": {"author": "peterstevens", "word_count": 1351, "paywalled": false}}, {"record_id": "f516789175ab4d74", "source_type": "concepts", "source_name": "NY Fed — Liberty Street Economics", "source_url": "https://libertystreeteconomics.newyorkfed.org/2026/08/a-window-into-bond-investors-uncertainty-about-r-star/", "title": "A Window into Bond Investors’ Uncertainty About R-Star - Liberty Street Economics", "published_date": "2026-08-04", "language": "en", "processed_at": "2026-08-05T20:18:12Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Positioning"], "gist": "A New York Fed Staff Report models bond pricing under incomplete information and finds investors' perceived r-star has been remarkably stable between 0 and 2.5 percent from the 1960s to 2022, with 95 percent uncertainty bands of ±170 basis points that barely narrow even with full hindsight (±130bp). The late-sample rise in r-star is more modest than other term-structure estimates suggest, casting doubt on the death of the low-r-star era.", "themes": [{"theme": "Investor-perceived r-star is stable, not rising", "insights": [{"claim": "A New York Fed bond-pricing model finds investors' perceived r-star trend followed a remarkably stable path between 0 percent and 2.5 percent from the 1960s through 2022, with no regime break at the end of the sample.", "speaker": "Guillaume Roussellet", "type": "data_point", "entities": ["New York Fed", "r-star", "U.S. zero-coupon yield curve", "bond investors"], "conviction": "high", "so_what": "If the market-implied equilibrium real rate never actually left its historical 0-2.5% band, term premium and cyclical policy — not a higher r-star — explain elevated long-end yields.", "quote": "which shows a remarkably stable path from the 1960s to 2022 between 0 percent and 2.5 percent", "locator": "What About R-Star?", "quote_verified": true}, {"claim": "Once investor information frictions are modeled, the late-sample rise in r-star is more modest and gradual than other financial-market and term-structure estimates imply, casting doubt on the claim that the low-r-star era has ended.", "speaker": "Guillaume Roussellet", "type": "contrarian", "entities": ["r-star", "term structure models", "New York Fed"], "conviction": "medium", "so_what": "A direct challenge to the 'higher for longer neutral rate' consensus — bearish for the structural-steepener/higher-terminal-rate thesis in long-duration Treasuries.", "quote": "also casts doubt on the death of the low r-star era", "locator": "Beyond parameters that are estimated on", "quote_verified": true}, {"claim": "The model's r-star estimates are smoother and less volatile than the Laubach-Williams (2003) series published on the New York Fed's website, while aligning with the yield-curve-based Bauer and Rudebusch (2020) estimates.", "speaker": "Guillaume Roussellet", "type": "data_point", "entities": ["Laubach and Williams", "Bauer and Rudebusch", "New York Fed", "r-star"], "conviction": "high", "so_what": "Which r-star series you anchor to materially changes the implied policy gap; yield-curve-based measures move far less than the widely quoted Laubach-Williams estimate.", "quote": null, "locator": "Our estimates are in line with Bauer", "quote_verified": false}]}, {"theme": "The uncertainty bands swamp the signal", "insights": [{"claim": "Investors' 95 percent confidence band around r-star is estimated at plus or minus 170 basis points, a range wider than most policy debates about the neutral rate.", "speaker": "Guillaume Roussellet", "type": "data_point", "entities": ["r-star", "bond investors"], "conviction": "high", "so_what": "Any trade premised on a precise neutral-rate level is inside the noise band; fade strong r-star narratives and size rate positions to that uncertainty.", "quote": "we also estimate investors’ 95 percent confidence bands of r-star at ±170 basis points", "locator": "What About R-Star?", "quote_verified": true}, {"claim": "Estimated 95 percent confidence bands for the trend components are plus or minus 225 basis points for the nominal rate trend i-star, plus or minus 125 basis points for the inflation trend pi-star, and plus or minus 80 basis points for the growth trend.", "speaker": "Guillaume Roussellet", "type": "data_point", "entities": ["i-star", "pi-star", "growth trend", "CPI inflation"], "conviction": "high", "so_what": "Uncertainty is concentrated in the nominal rate trend rather than growth, so long-end rate risk is dominated by unknowable policy-anchor drift.", "quote": null, "locator": e.", "speaker": "Sally Li", "type": "thesis", "entities": ["electric vehicles", "wind turbines", "industrial motors", "robotics", "data centres", "defence"], "conviction": "high", "so_what": "An EV sales slowdown alone should not break the rare-earth demand story; robotics, data centres and defence procurement provide offsetting bids.", "quote": "Demand is supported by electric vehicles, wind turbines, industrial motors, robotics, data centres, and defence applications.", "locator": "Demand is supported by electric vehicles", "quote_verified": true}]}, {"theme": "Light vs heavy rare-earth asymmetry", "insights": [{"claim": "Neodymium and praseodymium trade in larger light-rare-earth markets, while dysprosium and terbium are smaller heavy-rare-earth markets with more concentrated supply and greater exposure to export controls — making the heavies structurally more price-volatile and politically exposed.", "speaker": "Sally Li", "type": "framework", "entities": ["neodymium", "praseodymium", "dysprosium", "terbium", "export controls"], "conviction": "high", "so_what": "Position size and hedge the heavy rare earths differently from the lights: dysprosium and terbium carry the export-control tail risk and the thinner order books.", "quote": "Neodymium and praseodymium are larger light-rare-earth markets, while dysprosium and terbium are smaller heavy-rare-earth markets with more concentrated supply and greater exposure to export controls.", "locator": "Neodymium and praseodymium are larger light-rare-earth markets", "quote_verified": true}]}, {"theme": "Thrifting and recycling as partial, slow buffers", "insights": [{"claim": "Magnet manufacturers have already cut heavy-rare-earth intensity through improved motor design and greater material efficiency, so demand-side innovation should temper rather than eliminate upward price pressure on dysprosium and terbium.", "speaker": "Sally Li", "type": "causal", "entities": ["magnet manufacturers", "dysprosium", "terbium", "motor ator": "The decline in job finding from nonparticipation", "quote_verified": true}, {"claim": "The 'pulling-in' effect — where a lengthening recovery draws in younger, less-educated and less-experienced workers who could not find jobs in a weaker economy — is the hallmark of a mature expansion, and it is now running in reverse.", "speaker": "Ingrid Chen", "type": "framework", "entities": ["Arthur Okun", "Stephanie Aaronson", "Mary Daly", "Julie Hotchkiss"], "conviction": "high", "so_what": "The canonical high-pressure-economy benefit to marginal workers has stopped operating, which undercuts the case that keeping the expansion going will fix distributional labor outcomes.", "quote": "Instead of being pulled in, the pipeline into employment is shrinking such that the recovery is no longer reaching workers at the margins.", "locator": "Considering that January 2023 through January 2026", "quote_verified": true}, {"claim": "Weaker job finding among traditionally marginal workers may simply be normalization from extraordinarily strong post-pandemic labor demand rather than fresh deterioration.", "speaker": "Ingrid Chen", "type": "thesis", "entities": ["U.S. labor market"], "conviction": "medium", "so_what": "A benign alternative reading of the low-end weakness; the two channels may require different policy responses.", "quote": "Job finding among nonparticipants weakened for traditionally marginal workers, which may reflect a normalization following extraordinarily strong post-pandemic labor demand.", "locator": "The changes in job-finding rates by age and education", "quote_verified": true}]}, {"theme": "Contrast with the Great Recession template", "insights": [{"claim": "The current three-year job-finding decline is roughly half the size of the December 2006 to December 2009 episode, when the unemployment-to-employment rate fell about 13 percentage points (a 45% decrease) and the nonparticipation-to-employment rate fell 1.3 percentage points (a 24% decrease).", "speak s": [{"claim": "The San Francisco Fed authors flag immigration-driven changes, sector-specific slowdowns in technology and government contracting, policy uncertainty, and early broad labor-market deterioration as the leading candidate explanations still to be tested.", "speaker": "Ingrid Chen", "type": "thesis", "entities": ["Federal Reserve Bank of San Francisco", "technology sector", "government contracting", "immigration"], "conviction": "medium", "so_what": "A checklist of the variables to monitor for confirmation of the structural thesis; tech and federal-contractor hiring data are the cleanest tests.", "quote": "including immigration-driven changes, sector-specific slowdowns in technology and government contracting, policy uncertainty, or early signals of broader labor market deterioration", "locator": "Conclusions", "quote_verified": true}, {"claim": "The combined evidence implies the labor market is undergoing both a cooling and a restructuring, not merely a slowdown along a single dimension.", "speaker": "Ingrid Chen", "type": "thesis", "entities": ["U.S. labor market"], "conviction": "high", "so_what": "Restructuring implies displaced skilled workers do not simply get rehired when demand recovers, extending the tail of any labor weakness.", "quote": "imply both a cooling and a restructuring within the labor market", "locator": "Job-finding rates have declined over the past three years", "quote_verified": true}]}], "insight_total": 19, "top_entities": ["Federal Reserve Bank of San Francisco", "labor market", "Current Population Survey", "Bureau of Labor Statistics", "college-educated workers", "prime-age and college-educated workers", "nonparticipants", "AI", "technology", "government contracting", "Great Recession", "Marianna Kudlyak"], "source_meta": {"author": "Ingrid Chen", "word_count": 1883, "paywalled": false}}, {"record_id": "d840dceae2dcc923", "source_type": "concepts", "source_name": "St. Louis Fed — FRED Blog", "source_url": "https://fredblog.stlouisfed.org/2026/08/how-does-seasonal-weather-affect-construction-employment/", "title": "How does seasonal weather affect construction employment?", "published_date": "", "language": "en", "processed_at": "2026-08-05T20:18:03Z", "processor": "claude-code-sub-opus", "tags": ["Macro"], "gist": "Using BLS state construction payrolls from May 2016 to June 2026, the FRED Blog shows that Minnesota's construction employment has a far wider seasonal swing than Kentucky's — both peak in August and trough in February, but the cold-winter state's amplitude is much larger — and argues the gap reflects the South's ability to keep building through winter. The practical trick is normalizing the seasonal gap as a fraction of seasonally adjusted employment so states of very different size become comparable.", "themes": [{"theme": "Climate-driven seasonality in construction payrolls", "insights": [{"claim": "Construction employment in Minnesota and Kentucky follows the same seasonal shape — rising through August and declining until February — so the seasonal turning points in state construction payrolls are calendar-stable regardless of latitude.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["Minnesota", "Kentucky", "construction", "US Bureau of Labor Statistics", "FRED"], "conviction": "high", "so_what": "Anyone reading monthly state construction payroll prints should expect an August high and February low as the baseline; deviations from that calendar are the actual news.", "quote": "increases through August and declines until February", "locator": "To better tell the story behind", "quote_verified": true}, {"claim": "Measured as a fraction of seasonally adjusted employment, the seasonal swing in construction employment is much larger in Minnesota than in Kentucky — much higher highs and much lower lows — over May 2016 to June 2026.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["Minnesota", "Kentucky", "construction", "FRED"], "conviction": "high", "so_what": "Cold-state construction data carries far more seasonal noise, so the same unadjusted month-over-month move means very different things in Minnesota versus Kentucky.", "quote": "a much wider seasonal range in Minnesota than in Kentucky. (That is, much higher highs and much lower lows for Minnesota.)", "locator": "To better tell the story behind", "quote_verified": true}, {"claim": "The FRED Blog attributes the wider seasonal employment range in northern states to the fact that southern winters allow construction work to continue through more of the year, making weather the proposed mechanism behind cross-state seasonality differences.", "speaker": "St. Louis Fed — FRED Blog", "type": "causal", "entities": ["Minnesota", "Kentucky", "construction", "weather"], "conviction": "medium", "so_what": "If weather is the driver, warming winters or unusually mild/severe seasons should compress or widen northern construction payroll swings — a testable overlay for regional homebuilder and materials demand.", "quote": "This difference could be related to the ability to work through more of the winter months in the South relative to the North.", "locator": "To better tell the story behind", "quote_verified": true}, {"claim": "Seasonal employment concentration is not unique to construction: FRED has previously documented that retail and postal services employment peaks around the Christmas holidays, indicating seasonality analysis generalizes across labor-intensive, calendar-driven industries.", "speaker": "St. Louis Fed — FRED Blog", "type": "framework", "entities": ["retail", "postal services", "construction", "FRED"], "conviction": "medium", "so_what": "The same seasonal-amplitude method can be pointed at retail and logistics payrolls to separate genuine cycle inflections from calendar effects.", "quote": null, "locator": "The FRED Blog has discussed why employment", "quote_verified": false}]}, {"theme": "Normalization method for cross-state comparison", "insights": [{"claim": "Comparing raw construction employment peaks and troughs across states is unreliable because absolute headcount differences swamp seasonal signal — Minnesota has far more construction employees than Kentucky simply because it is more populous.", "speaker": "St. Louis Fed — FRED Blog", "type": "framework", "entities": ["Minnesota", "Kentucky", "construction"], "conviction": "high", "so_what": "Level comparisons across states are a trap; scale-invariant measures are required before drawing conclusions about regional labor-market strength.", "quote": "comparing annual employment peaks and throughs between states isn’t easy or straightforward", "locator": "Note there are far more construction employees", "quote_verified": true}, {"claim": "The fix for size-distorted comparisons is to plot the seasonal component — the gap between unadjusted and seasonally adjusted employment — as a fraction of seasonally adjusted employment, which renders seasonality comparable across states of different sizes.", "speaker": "St. Louis Fed — FRED Blog", "type": "framework", "entities": ["FRED", "Minnesota", "Kentucky", "construction"], "conviction": "high", "so_what": "A reusable, cheap normalization for any regional or sector series where the base sizes differ — apply it before ranking states or industries on cyclical volatility.", "quote": "the size of the seasonal changes in employment as a fraction of the seasonally adjusted employment figures", "locator": "To better tell the story behind", "quote_verified": true}, {"claim": "The analysis rests on a 2018 research piece from the Federal Reserve Bank of Chicago on why construction employment follows different patterns across states, giving the weather-seasonality argument a prior research anchor rather than being a novel finding.", "speaker": "St. Louis Fed — FRED Blog", "type": "anecdote", "entities": ["Federal Reserve Bank of Chicago", "construction"], "conviction": "medium", "so_what": "Points to a deeper source for anyone building a formal model of regional construction seasonality.", "quote": null, "locator": "The FRED Blog has discussed why employment", "quote_verified": false}]}, {"theme": "Replicable data plumbing", "insights": [{"claim": "The exact FRED series for replicating state construction seasonality are MNCONS and KYCONS (seasonally adjusted) paired with MNCONSN and KYCONSN (not seasonally adjusted) for All Employees: Construction in Minnesota and Kentucky, with state-level employment by industry available across FRED.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["MNCONS", "MNCONSN", "KYCONS", "KYCONSN", "FRED", "Minnesota", "Kentucky"], "conviction": "high", "so_what": "Gives a ready-made ticker recipe to extend the seasonal-amplitude screen to all 50 states and other industries without hunting for series IDs.", "quote": null, "locator": "How these graphs were created", "quote_verified": false}]}], "insight_total": 8, "top_entities": ["Minnesota", "Kentucky", "construction", "FRED", "US Bureau of Labor Statistics", "Federal Reserve Bank of Chicago", "MNCONS", "KYCONS", "Alison Booth", "Diego Mendez-Carbajo"], "source_meta": {"author": "", "word_count": 373, "paywalled": false}}, {"record_id": "30a4aae63ad8080c", "source_type": "concepts", "source_name": "World Gold Council", "source_url": "https://www.gold.org/goldhub/research/gold-demand-trends/gold-demand-trends-us-focus-q2-2026", "title": "Gold Demand Trends: US Focus Q2 2026", "published_date": "2026-08-05", "language": "en", "processed_at": "2026-08-05T20:18:37Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Positioning", "Geopolitics"], "gist": "US total gold demand collapsed to 7.9t in Q2 2026 (-94% y/y, vs a 10-year quarterly average of 90t) entirely because US-listed gold ETFs shed 44.4t, with 61t of H1 outflows concentrated in just two months (March -85t/US$13bn and June -40t/US$5bn); strip those two months out and US ETFs would have take d windows are where the gold ETF supply hits the tape.", "quote": "Holdings fell by 40t in June, compared with a combined 4t decline during April and May, reinforcing the pattern of concentrated quarter-end selling that also characterised Q1.", "locator": "US gold demand overshadowed by ETF outflows", "quote_verified": true}, {"claim": "US gold-backed ETFs recorded net outflows of 61t in H1 2026, the fourth largest H1 tonnage decline and the second largest H1 outflow in US dollar terms on record.", "speaker": "World Gold Council", "type": "data_point", "entities": ["gold ETFs", "gold"], "conviction": "high", "so_what": "The dollar rank being worse than the tonnage rank shows high prices amplify the market impact of any given tonnage redemption — a structural change in how ETF selling transmits.", "quote": "As a result, US gold backed ETFs recorded net outflows of 61t in H1, marking the fourth largest H1 decline in holdings and the second largest H1 outflow in US dollar terms on record", "locator": "ETF weakness was concentrated, not continuous", "quote_verified": true}, {"claim": "Stripping out the March and June liquidations, US gold-backed ETFs would have recorded 65t of net inflows in H1 2026 rather than 61t of outflows.", "speaker": "World Gold Council", "type": "contrarian", "entities": ["gold ETFs", "gold"], "conviction": "high", "so_what": "Baseline US ETF demand was positive all half — the bearish flow headline overstates real investor abandonment of gold.", "quote": "Excluding the March and June outflows, US gold backed ETFs would have recorded 65t of net inflows in H1.", "locator": "ETF weakness was concentrated, not continuous", "quote_verified": true}, {"claim": "The largest US gold ETF reductions in both Q1 and Q2 2026 occurred in the final month of the quarter, a repeatable quarter-end liquidation pattern rather than steady attrition.", "speaker": "World Gold Council", "type": "framework", "entities": ["gold ETFs", "gold"], "conviction": "high", "so_what": "Treat gold ETF supply as calendar-clustered: fade quarter-end weakness and expect flow to stabilise in the first two months of each quarter.", "quote": "Importantly, the weakness was highly concentrated with the largest reductions occurring in the final month of each quarter.", "locator": "ETF weakness was concentrated, not continuous", "quote_verified": true}, {"claim": "US gold ETF outflows accelerated in June 2026 even as the gold price was falling, with redemptions themselves reinforcing the downward price move.", "speaker": "World Gold Council", "type": "causal", "entities": ["gold ETFs", "gold", "LBMA PM gold price"], "conviction": "medium", "so_what": "A reflexive price-flow loop means gold drawdowns can overshoot on ETF mechanics alone — sizing should assume momentum-driven air pockets.", "quote": "But outflows gathered momentum in June despite a falling gold price, with holdings declining by a further 40t, equivalent to US$5bn, the third-largest monthly outflow in US dollar terms on record.", "locator": "ETF weakness was concentrated, not continuous", "quote_verified": true}, {"claim": "The World Gold Council reads the H1 2026 US ETF selling as an episodic investment pause rather than a breakdown in the strategic case for gold.", "speaker": "World Gold Council", "type": "thesis", "entities": ["gold ETFs", "gold", "World Gold Council"], "conviction": "high", "so_what": "If correct, the marginal US ETF buyer returns once rates/dollar stabilise — a coiled-spring source of demand into H2.", "quote": "The concentration of outflows in these two months suggests an episodic investment pause rather than a sustained breakdown in the strategic case for gold.", "locator": "What drove H1 ETF outflows?", "quote_verified": true}]}, {"theme": "War liquidity, hawkish Fed, firmer dollar", "insights": [{"claim": "The escalation of the US-Iran war initially caused investors to sell gold to raise liquidity rather than buy it as a hedge, inverting the usual geopolitical safe-haven response.", "speaker": "World Gold Council", "type": "contrarian", "entities": ["US-Iran war", "gold", "gold ETFs", "Iran", "United States"], "conviction": "medium", "so_what": "Gold can sell off on the first shock of a conflict as margin and liquidity needs dominate — buy the de-risking, don't chase the headline.", "quote": "The escalation in geopolitical risk stemming from the US-Iran war initially prompted investors to raise liquidity, while gold’s strong 2025 performance and record highs in early 2026 provided an opportunity to lock in gains or reduce allocations that had risen above target weights", "locator": "What drove H1 ETF outflows?", "quote_verified": true}, {"claim": "Gold's strong 2025 performance and record highs in early 2026 pushed portfolio gold weights above target, making mechanical rebalancing and profit-taking a distinct source of 2026 ETF supply.", "speaker": "World Gold Council", "type": "causal", "entities": ["gold", "gold ETFs"], "conviction": "medium", "so_what": "Rebalancing-driven selling is price-insensitive and self-limiting — it fades once weights normalise, unlike thesis-driven exits.", "quote": null, "locator": "De-risking, profit taking and rebalancing", "quote_verified": false}, {"claim": "A stronger dollar, higher yields and delayed rate-cut expectations under a more hawkish Fed outlook raised the opportunity cost of holding gold through H1 2026.", "speaker": "World Gold Council", "type": "causal", "entities": ["Fed", "US dollar", "gold", "gold ETFs", "US Treasury yields"], "conviction": "high", "so_what": "US gold ETF flow remains a rates-and-dollar trade — the flow turns on the first credible Fed easing repricing.", "quote": "A stronger dollar, higher yields and delayed rate-cut expectations weighed on demand, particularly as markets adopted a more hawkish outlook for Fed policy.", "locator": "Higher opportunity costs and inflation concerns", "quote_verified": true}, {"claim": "By June 2026 investors were pricing the US-Iran conflict mainly through its inflationary consequences — higher yields and a firmer dollar — rather than through gold's safe-haven appeal.", "speaker": "World Gold Council", "type": "contrarian", "entities": ["US-Iran war", "gold", "US dollar", "Fed"], "conviction": "medium", "so_what": "War-driven inflation is currently bearish for gold via the rates channel; the trade only flips if the Fed is seen accommodating the shock.", "quote": "By June, investors appeared more focused on the conflict’s inflationary implications, and the potential for higher yields and a firmer dollar, than on gold’s safe-haven appeal", "locator": "Higher opportunity costs and inflation concerns", "quote_verified": true}, {"claim": "The two 2026 outflow episodes had different mechanisms: March was forced de-risking, crowded positioning and momentum-driven liquidation, while June was a fundamental repricing of rates, real yields and the dollar.", "speaker": "World Gold Council", "type": "framework", "entities": ["gold ETFs", "gold", "US dollar", "real yields"], "conviction": "high", "so_what": "Positioning flushes mean-revert quickly; a real-yield repricing does not — the June driver is the one to monitor for whether outflows resume.", "quote": "In summary, March reflected forced de-risking, crowded positioning and momentum-driven liquidation, whereas June reflected renewed price weakness and a more fundamental repricing of rates, real yields and the dollar.", "locator": "What drove H1 ETF outflows?", "quote_verified": true}]}, {"theme": "Flagship funds bleed, low-cost siblings gain", "insights": [{"claim": "Year-to-date through 30 June 2026, GLD saw US$9,021mn of outflows (-65t of holdings) and IAU US$4,168mn (-29t), while lower-cost GLDM took in US$4,317mn (+28t) and IAUM US$837mn (+5t).", "speaker": "World Gold Council", "type": "data_point", "entities": ["GLD", "GLDM", "IAU", "IAUM", "gold ETFs"], "conviction": "high", "so_what": "The US 'gold exit' is really a rotation out of the two flagship products into cheaper mini versions — a fee-compression story for State Street and BlackRock, not pure gold de-allocation.", "quote": null, "locator": "Table 2: Top four US-listed funds based on net inflows", "quote_verified": false}, {"claim": "GLD's US$9.0bn of 2026 year-to-date outflows reversed roughly 39% of the US$23,361mn it took in during 2025, while GLDM's YTD inflows already exceed half of its US$8,017mn 2025 haul.", "speaker": "World Gold Council", "type": "data_point", "entities": ["GLD", "GLDM", "gold ETFs"], "conviction": "high", "so_what": "Tactical hot money concentrated in GLD is what left; sticky allocation money in the mini products kept adding — a cleaner read on strategic demand.", "quote": null, "locator": "Table 2: Top four US-listed funds based on net inflows", "quote_verified": false}, {"claim": "Despite 65t of tonnage redemptions, GLD's AUM only fell from US$148bn at end-2025 to US$130bn by 30 June 2026, while GLDM's AUM rose from US$25bn to US$27bn as holdings grew from 183t to 211t.", "speaker": "World Gold Council", "type": "data_point", "entities": ["GLD", "GLDM", "gold ETFs"], "conviction": "high", "so_what": "High gold prices cushion issuer revenue even through heavy redemptions — fee income is far more resilient than the tonnage headlines imply.", "quote": null, "locator": "Table 2: Top four US-listed funds based on net inflows", "quote_verified": false}, {"claim": "Higher gold prices have amplified the US dollar impact of any given tonnage of US ETF outflow, which is why H1 2026 ranks second-worst in dollar terms but only fourth-worst in tonnes.", "speaker": "World Gold Council", "type": "framework", "entities": ["gold ETFs", "gold", "LBMA PM gold price"], "conviction": "high", "so_what": "Dollar-flow headlines will keep looking historically extreme at high prices — use tonnage, not US$bn, to compare flow episodes across cycles.", "quote": "Chart 2: Higher gold prices amplified the dollar impact of US ETF outflows", "loca // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
