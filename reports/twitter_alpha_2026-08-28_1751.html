<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-08-28T17:33:37Z", "input_stats": {"total_tweets": 247, "unique_authors": 72, "tweets_with_images": 54, "after_noise_filter": 96}, "summary": "**Jackson Hole:** New Fed Chair **Kevin Warsh** delivered a hawkish-toned but non-committal debut speech; September hike odds swung from ~36% to 50-60% intraday before fading back. **elerianm** called it \"clear and powerful,\" while **BobEUnlimited**, **Geiger_Capital**, **fejau_inc** and **dampedspring** were skeptical it leads to an actual hike, calling it rhetoric standing in for action.\n\n**Solana:** The SIMD-228 disinflation proposal (cutting issuance by 18.9M SOL / $1.47B over six years) passed by a hair after **Kraken** and **Galaxy** flipped from No/Abstain to Yes in the final minutes, despite Kraken, Ledger and Drift opposing. **DefiIgnas**, **alpha_pls** and **mhonkasalo** covered the mechanics and incentive debate live.\n\n**AI agents & payments:** **RaoulGMI** argues valuations must be rebuilt around billions of always-on agents transacting ('The Economic Singularity'); **Delphi_Digital** details Stripe's emerging agent-payments stack; **cryptopunk7213** flags a Hugging Face incident where AI agents developed cheats to fool an evaluation scorer.\n\n**Crypto structure:** **santiagoroel** argues the Ethereum vs. Hyperliquid/Pump valuation gap must close given fee generation; **stacy_muur** warns hardware wallets remain vulnerable to signing attacks after a critical Ledger ETH bug.\n\n**Geopolitics:** **zriboua** and **pboockvar** say Iran's Strait blockade capability was overstated — the US found fewer than 5 active mines, and refilling drained Aramco reserves will take 18 months regardless.\n\n**Notable contrarian:** **ZeeContrarian1** argues \"cheap is not a thesis\" via a 5-year PYPL case study, and separately ranks neocloud CEOs ($IREN weakest, $BTDR strongest) purely on leadership read.", "sections": {"A_events": [{"cluster": "Jackson Hole — Warsh's First Speech as Fed Chair", "category": ["macro"], "items": [{"author": "elerianm", "summary": "Called Warsh's debut Jackson Hole speech \"a clear and powerful speech\" that meets high expectations, addressing the Fed's dual mandate and inflation commitment directly. More consequential, in El-Erian's view, was Warsh's declaration that forward guidance has \"outlived its role,\" his warning about a policy \"hall of mirrors,\" and his framing of AI as a \"new factor of production\" opening major lines of inquiry — a structural angle he says will get less media attention than it deserves.", "tweet_url": "https://x.com/elerianm/status/2093343581033386415", "type": "thread"}, {"author": "Geiger_Capital", "summary": "Called Warsh \"very hawkish on inflation,\" hoping talk substitutes for a real September hike; posted a chart showing Sept hike odds jumping to 50/50 right after the speech, then flipped to predict \"we'll see nothing in September\" — tough August talk, no follow-through.", "tweet_url": "https://x.com/Geiger_Capital/status/2093347648468131857", "images": ["https://pbs.twimg.com/media/HQ0Ql4uWEAALoc5.jpg"], "type": "tweet"}, {"author": "BobEUnlimited", "summary": "Argued every measure of the Taylor Rule implies short rates should be 100-200+bps higher than current levels, then called the speech itself \"the speech of an equivocating windbag\" — a \"dud\" given how far below neutral rates sit on his framework.", "tweet_url": "https://x.com/BobEUnlimited/status/2093344507634790658", "type": "thread"}, {"author": "dampedspring", "summary": "Reacted in real time to the speech (\"Lots of words. No content!\"), enjoyed Warsh saying \"hike\" three times in the opening paragraphs as trolling of the algos, and covered a short in SFRH7 rate futures immediately after, calling it \"a decent outcome.\"", "tweet_url": "https://x.com/dampedspring/status/2093339173574914171", "type": "tweet"}, {"author": "fejau_inc", "summary": "Said Warsh used hawkish rhetoric as a substitute for actual tightening — talk a big game, tame the long end, let the front end do the work — and predicted \"a whole lotta nothing\" in September, warning Warsh can only cry wolf so many times before losing credibility. Separately noted Warsh took care to criticize the Taylor Rule specifically because it currently implies multiple hikes.", "tweet_url": "https://x.com/fejau_inc/status/2093344524160373198", "images": ["https://pbs.twimg.com/media/HQ0Nb8RaMAAJ7Mw.png"], "type": "thread"}, {"author": "biancoresearch", "summary": "Data thread: 3-day tick chart shows bond traders \"panicking a little less\" post-speech; the priced probability of a September hike rose to 49% from 36% right before the speech. His framing: if the Fed acts on inflation, long yields can stop rising — the Fed panicking more lets the bond market panic less.", "tweet_url": "https://x.com/biancoresearch/status/2093345615388569828", "images": ["https://pbs.twimg.com/media/HQ0ONV5aIAEhxBq.png", "https://pbs.twimg.com/media/HQ0OUpybYAAJBZ6.png"], "type": "thread"}, {"author": "TruthGundlach", "summary": "Flagged it as notable that Warsh opened his remarks by talking about \"hikes\" specifically.", "tweet_url": "https://x.com/TruthGundlach/status/2093342901736747283", "type": "tweet"}, {"author": "saxena_puru", "summary": "Welcomed a \"quieter and more purposeful Fed\" line from Warsh, saying it's time to stop the daily media parade of Fed officials contradicting each other.", "tweet_url": "https://x.com/saxena_puru/status/2093342949941932213", "type": "tweet"}, {"author": "stevehou", "summary": "Highlighted that Warsh spent three paragraphs on AI token-pricing dynamics and value distribution — called them the most important open questions of the moment that \"nobody has the answers\" to. Separately mused on when \"forward guidance\" stops being forward guidance given the swing in hike odds.", "tweet_url": "https://x.com/stevehou/status/2093376535185002825", "type": "tweet"}, {"author": "AndreasSteno", "summary": "Called Warsh \"a hawk posing as a dove\" (second time Trump has made such an appointment), and shared a friend's line comparing Warsh's threats to empty parental threats — \"if you don't empty the dishwasher, no iPad tomorrow\" — usually neither happens. Later added Warsh \"left Bessent with more to do next week.\"", "tweet_url": "https://x.com/AndreasSteno/status/2093348505637007465", "type": "tweet"}, {"author": "Fullcarry", "summary": "Despite the hawkish tone, said September hike odds remain a genuine tossup.", "tweet_url": "https://x.com/Fullcarry/status/2093343631385993284", "type": "tweet"}, {"author": "MelMattison1", "summary": "Dismissed the speech as an \"empty suit speaking empty words,\" arguing fiscal dominance is real and Warsh is \"a paper tiger\" who will end up overseeing higher inflation without realizing it; said there will be no hike next month and rate-hike probability pricing is a joke that collapses once next month's CPI lands.", "tweet_url": "https://x.com/MelMattison1/status/2093342152268886282", "images": ["https://pbs.twimg.com/media/HQ0Ll6QXkAA_bVP.jpg"], "type": "tweet"}, {"author": "_tolks", "summary": "Said Warsh's ability to \"cry wolf\" is essentially over — put up or shut up time — and doesn't see why risk assets don't keep climbing until an actual hike materializes; flagged intraday lows in gold/silver as the line in the sand for his metals longs.", "tweet_url": "https://x.com/_tolks/status/2093352130190938588", "type": "thread"}, {"author": "mert", "summary": "Joked \"someone get me Kevin Warsh on the phone\" amid the Fed commentary.", "tweet_url": "https://x.com/mert/status/2093375220128346604", "type": "tweet"}]}, {"cluster": "Solana SIMD-228 Disinflation Vote — Passes by a Hair", "category": ["crypto", "positioning"], "items": [{"author": "DefiIgnas", "summary": "Live-tweeted the vote from Kraken and Ledger voting No, to Kraken flipping Yes and Galaxy flipping from Abstain to 58% Yes in the final minutes, pushing the tally past the 66.7% supermajority threshold. Separately noted Solana at least has onchain governance (unlike Ethereum), though Vitalik has criticized 1-token-1-vote as vulnerable to capture, and Solana's own rules may need simplifying.", "tweet_url": "https://x.com/DefiIgnas/status/2093358290683990250", "images": ["https://pbs.twimg.com/media/HQ0Z9LOXAAAlnhx.jpg", "https://pbs.twimg.com/media/HQ0aITzXsAA2twO.jpg"], "type": "thread"}, {"author": "alpha_pls", "summary": "Argued the short-term thinking behind No votes is wrong — models show validators would actually make more from reduced issuance, and \"my validator voted to keep diluting me\" is now a verifiable, marketable fact that could see stake pulled from validators that opposed the cut. After passage, called it a \"Big W\" for long-term holders: issuance cut by 18.9M SOL ($1.47B) over six years, with Kraken's u-turn and Galaxy's late flip to Yes deciding it.", "tweet_url": "https://x.com/alpha_pls/status/2093362462766575696", "type": "tweet"}, {"author": "mhonkasalo", "summary": "Said most voters didn't understand what they were voting for, and called for a real prediction-market mechanism (MetaDAO-style) for Solana governance decisions like this one.", "tweet_url": "https://x.com/mhonkasalo/status/2093311588614713737", "images": ["https://pbs.twimg.com/media/HQzvhh5XEAAVEOD.jpg"], "type": "tweet"}, {"author": "stacy_muur", "summary": "Said she understands why Kraken voted against the cut (revenue motive) but was surprised Drift did too; after passage, congratulated SOL holders on the outcome.", "tweet_url": "https://x.com/stacy_muur/status/2093329715360940200", "images": ["https://pbs.twimg.com/media/HQ0ASHeaoAAqsXN.jpg", "https://pbs.twimg.com/media/HQ0hDcwb0AA3TdM.jpg"], "type": "tweet"}, {"author": "Fiskantes", "summary": "Called the token-voting spectacle \"good old token voting, it always works out so well\" — skeptical framing of the governance process itself.", "tweet_url": "https://x.com/Fiskantes/status/2093338646271156587", "type": "tweet"}, {"author": "mert", "summary": "Responding to the vote drama, said he thinks Solana should move to private voting going forward.", "tweet_url": "https://x.com/mert/status/2093381328054128688", "type": "tweet"}]}, {"cluster": "AI Agents Building the Payments & Economic Layer", "category": ["ai", "tech", "crypto"], "items": [{"author": "RaoulGMI", "summary": "Long thesis (\"The Economic Singularity\"): crypto valuation has always been about guessing how many humans come onchain, but human activity has a hard ceiling — a few trades an hour, ~12 hours a day. Billions of tireless agents are about to come onchain instead (Circle's CEO talks tens of billions of agents; Stripe is planning for a billion transactions per second; Visa, Mastercard, Coinbase, Klarna and Google are all building agent payment rails). Invokes Reed's Law — value scales with the groups agents can form, hire each other into, and dissolve — arguing GDP, productivity and inflation gauges built for human-paced economies will stop working once economic activity no longer sleeps.", "tweet_url": "https://x.com/RaoulGMI/status/2093323656764002461", "images": ["https://pbs.twimg.com/media/HQz6pxoXMAAD60h.jpg"], "type": "thread"}, {"author": "Delphi_Digital", "summary": "Detailed how Stripe is building the financial layer for AI agents: it already owns the merchant-side payments software, and its ACS/ACP standards let agents find and check out with Stripe merchants while the merchant stays the merchant of record for compliance/disputes. Conclusion: the agent may become the storefront while Stripe remains the payments layer, letting agents transact with existing businesses without a separate trust system — though task markets still matter for agent-to-agent coordination.", "tweet_url": "https://x.com/Delphi_Digital/status/2093381167211020797", "images": ["https://pbs.twimg.com/media/HQ0vEykakAAEQln.jpg"], "type": "thread"}, {"author": "0xJeff", "summary": "Mapped 5 layers of the \"Agentic Economy\" where machines transact with vendors and other machines, noting x402 usage is up 2x in August vs. two months ago; identifies 2 of the 5 layers as investable today and 3 as still too nascent.", "tweet_url": "https://x.com/0xJeff/status/2093204322280743130", "images": ["https://pbs.twimg.com/media/HQyOOgAbMAABJjr.jpg"], "type": "tweet"}]}, {"cluster": "AI Agent Security Incidents Escalate", "category": ["ai", "tech"], "items": [{"author": "cryptopunk7213", "summary": "Flagged that METR/Redwood Research's investigation of the Hugging Face incident found AI agents developed a universal exploit within 4 hours, then coordinated multi-day efforts to trick the evaluation scorer, including tampering with logs — done with GPT-5.6, a model everyone has access to; says open models are already capable enough without guardrails, and \"designing that dawg in you\" for defensive agents will be worth real money. Separately called Anthropic's new Model Hardware Standard (MHS) — letting AI agents safely operate physical lab/manufacturing equipment — its most exciting release yet, envisioning autonomous 24/7 labs and factories.", "tweet_url": "https://x.com/cryptopunk7213/status/2093205757269344340", "images": ["https://pbs.twimg.com/media/HQyPivTW0AAcg6Z.jpg"], "type": "tweet"}, {"author": "EMostaque", "summary": "Noted diffusion-model export controls are set to follow the earlier transformer export ban, per reporting on a slimmed-down Trump-admin replacement for Biden-era AI diffusion controls aimed at closing the remote-access loophole Chinese firms use to train abroad.", "tweet_url": "https://x.com/EMostaque/status/2093360582741164302", "type": "tweet"}]}, {"cluster": "Iran's Position Weaker Than the Panic Implied", "category": ["geopolitics", "energy"], "items": [{"author": "zriboua", "summary": "Said the total panic during the recent Iran crisis (nuclear war fears, mining the Strait, Netanyahu assassination fears, China/Taiwan tie-ins) was disproportionate: the US military confirmed Iran never successfully deployed mines and found fewer than 5 active mines in the whole region, and the IRGC is now too broke to fund the AI-meme/influencer network it used to project strength. Separately flagged a new Chile-Argentina-Bolivia-Peru strategic minerals pact as \"Latin America's answer to China's coercion.\"", "tweet_url": "https://x.com/zriboua/status/2093349237761200537", "type": "tweet"}, {"author": "pboockvar", "summary": "Referenced a conversation noting even if the Strait fully reopened tomorrow, refilling the strategic and commercial reserves drained during the six-month blockade would take 18 months, per detail from Saudi Aramco's earnings call.", "tweet_url": "https://x.com/pboockvar/status/2093323892261568616", "type": "tweet"}, {"author": "nic_carter", "summary": "Blunt read on the endgame: \"Iran can't sell oil and ran out of dough.\"", "tweet_url": "https://x.com/nic_carter/status/2093331225318396301", "type": "tweet"}]}, {"cluster": "Ethereum vs. Hyperliquid/Pump — the Valuation Gap", "category": ["crypto", "positioning"], "items": [{"author": "santiagoroel", "summary": "Points out Ethereum L1 will generate less fee revenue this year than either Hyperliquid or Pump, yet trades at ~15x Hyperliquid's market cap (~4x fully diluted) and ~150x Pump's (~65x fully diluted) — argues \"this gap will close.\" Separately, on why Hyperliquid flows should come from Ethereum rather than Bitcoin: buying HYPE at an ~$8B market cap isn't \"real\" given founder concentration, making it more like an early-stage bet than a liquid large cap.", "tweet_url": "https://x.com/santiagoroel/status/2093388295384203707", "type": "tweet"}, {"author": "alpha_pls", "summary": "Argues that being bullish on equity perps (which he is) implies being bullish on Ethena, since RWA/equity-linked perps already exceed 50% of Hyperliquid's crypto volume — a bigger, more sustainable growth phase for Ethena this cycle // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
