function catCounts(){
  const c = {};
  ITEMS.forEach(i => c[i.cat] = (c[i.cat]||0)+1);
  return c;
}
function urgCounts(){
  const c = {act:0, deep:0, watch:0};
  ITEMS.forEach(i => c[i.urgency] = (c[i.urgency]||0)+1);
  return c;
}

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function renderFilters(){
  const cc = catCounts();
  const cats = Object.keys(cc).sort();
  const catbar = document.getElementById('catbar');
  catbar.innerHTML = '';
  const allPill = document.createElement('div');
  allPill.className = 'pill' + (activeCat==='all' ? ' active' : '');
  if(activeCat==='all'){ allPill.style.background = '#333'; }
  allPill.textContent = 'All (' + ITEMS.length + ')';
  allPill.onclick = function(){ activeCat='all'; activeSrc=null; renderFilters(); renderCards(); };
  catbar.appendChild(allPill);
  cats.forEach(function(cat){
    const p = document.createElement('div');
    p.className = 'pill' + (activeCat===cat ? ' active' : '');
    if(activeCat===cat){ p.style.background = CATCOLORS[cat]; }
    p.textContent = cat + ' (' + cc[cat] + ')';
    p.onclick = function(){ activeCat = cat; activeSrc=null; renderFilters(); renderCards(); };
    catbar.appendChild(p);
  });

  const uc = urgCounts();
  const urgbar = document.getElementById('urgbar');
  urgbar.innerHTML = '';
  const allU = document.createElement('div');
  allU.className = 'pill' + (activeUrg==='all' ? ' active' : '');
  if(activeUrg==='all'){ allU.style.background = '#333'; }
  allU.textContent = 'All (' + ITEMS.length + ')';
  allU.onclick = function(){ activeUrg='all'; activeSrc=null; renderFilters(); renderCards(); };
  urgbar.appendChild(allU);
  ['act','deep','watch'].forEach(function(u){
    const p = document.createElement('div');
    p.className = 'pill' + (activeUrg===u ? ' active' : '');
    if(activeUrg===u){ p.style.background = '#333'; }
    p.textContent = URGLABEL[u] + ' (' + (uc[u]||0) + ')';
    p.onclick = function(){ activeUrg = u; activeSrc=null; renderFilters(); renderCards(); };
    urgbar.appendChild(p);
  });
}

function tint(hex){
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',0.08)';
}

function renderCards(){
  const wrap = document.getElementById('cards');
  wrap.innerHTML = '';
  ITEMS.forEach(function(item, idx){
    var visible = true;
    if(activeCat !== 'all' && item.cat !== activeCat) visible = false;
    if(activeUrg !== 'all' && item.urgency !== activeUrg) visible = false;
    if(activeSrc && item.source.indexOf(activeSrc) === -1) visible = false;

    const card = document.createElement('div');
    card.className = 'card' + (visible ? '' : ' hidden') + (activeSrc ? ' open' : '');
    card.id = 'card-' + item.id;
    const color = CATCOLORS[item.cat] || '#888';

    const urgEmoji = item.urgency === 'act' ? '🔴' : (item.urgency === 'deep' ? '🔵' : '🟡');
    const chartFlag = item.charts && item.charts.count > 0 ? (item.charts.hot ? '🔥' : '📊') : '';

    const header = document.createElement('div');
    header.className = 'card-header';
    header.innerHTML =
      '<span class="idx">' + String(idx+1).padStart(2,'0') + '</span>' +
      '<span class="urgency">' + urgEmoji + '</span>' +
      '<span class="badge" style="background:' + color + '">' + item.source.split(' (')[0] + '</span>' +
      '<span class="cattag">' + item.cat + '</span>' +
      (chartFlag ? '<span class="chartflag">' + chartFlag + '</span>' : '') +
      '<span class="card-title">' + item.title + '</span>' +
      '<span class="chevron">▸</span>';
    header.onclick = function(){ card.classList.toggle('open'); };
    card.appendChild(header);

    const body = document.createElement('div');
    body.className = 'card-body';
    body.style.setProperty('--accent', color);
    body.style.setProperty('--accent-tint', tint(color));

    var chartHtml = '';
    if(item.charts && item.charts.count > 0){
      chartHtml = '<div class="section"><div class="label">Charts</div>' +
        '<div class="chart-placeholder' + (item.charts.hot ? ' hot' : '') + '">' +
        (item.charts.hot ? '🔥 CHART WORTH SAVING — ' : '📊 ') +
        item.charts.count + ' chart(s). ' + item.charts.desc + '</div></div>';
    } else if(item.charts && item.charts.desc){
      chartHtml = '<div class="section"><div class="label">Charts</div>' +
        '<div class="chart-placeholder">' + item.charts.desc + '</div></div>';
    }

    body.innerHTML =
      '<div class="section"><div class="label">The Idea</div><div class="idea-text">' + item.idea + '</div></div>' +
      '<div class="section"><div class="label">My Angle</div><div class="angle-box">' + item.angle + '</div></div>' +

        '<div class="tweetrow">' +
          '<div class="tweetbox a"><div class="tlabel">TWEET A</div><div class="tweettext">' + item.tweetA + '</div>' +
            '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>' +
          '<div class="tweetbox b"><div class="tlabel">TWEET B</div><div class="tweettext">' + item.tweetB + '</div>' +
            '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>' +
        '</div></div>' +
      chartHtml +
      '<div class="linkrow"><a href="' + item.link + '" target="_blank">↗ Read full article</a> &nbsp;·&nbsp; <span class="idea-text" style="font-size:12.5px;color:#6b6b6b;">Source: ' + item.source + '</span></div>';

    card.appendChild(body);
    wrap.appendChild(card);
  });
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function filterBySrc(name){
  activeCat = 'all'; activeUrg = 'all'; activeSrc = name;
  renderFilters();
  renderCards();
  document.getElementById('cards').scrollIntoView({behavior:'smooth'});
}

function renderReport(){
  var html = '';
  html += '<p><strong>Window:</strong> ' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</p>';
  html += '<p><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp; <strong>Read:</strong> ' + META.emailsRead + ' &nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</p>';
  html += '<p><strong>Included sources:</strong></p><ul>';
  META.includedSources.forEach(function(s){
    html += '<li><span class="srcname" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span> — ' + s.count + ' item(s)</li>';
  });
  html += '</ul>';
  html += '<p><strong>Skipped sources:</strong></p><ul>';
  META.skippedSources.forEach(function(s){
    html += '<li class="skiprow"><strong>' + s.name + '</strong> — ' + s.reason + '</li>';
  });
  html += '</ul>';
  document.getElementById('reportbody').innerHTML = html;
}

renderMeta();
renderFilters();
renderCards();
renderReport();
</script>
