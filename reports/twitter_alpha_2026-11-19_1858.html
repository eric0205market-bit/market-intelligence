<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-11-19T18:21:22Z", "summary": "**Anthropic IPO:** $ANT priced at **$83**, opened at **$111.50** (+35%, ~**$2T** indicated) and traded below **$100** within the first hour, while the **Nasdaq fell ~2%** and NVDA/SPY sold off. **elerianm**, **jimcramer** and **munster_gene** read the tape as funds \"making room\": they sold other holdings to finance the mega-IPO and got little allocation. **0xSammy** and **sjdedic** flag the crypto-style structure: ~**5%** float with unlocked supply set to grow **12x** in a year. **laurashin** reports crypto perps priced the open within **50 cents**.\n\n**Nvidia / semis:** With Jensen Huang out and NVDA **-34% in six weeks**, **ZeeContrarian1** calls it \"peak FUD\" at ~10x forward P/E and finished building a **20%** portfolio position. **MelMattison1** pushes the opposite conjecture (CCP compromise, no evidence offered). A Hunterbook short report alleges **AMD** also sold chips illegally into China (**AMD -8%**); **jimcramer** defends AMD. **TSMC** halted sub-16nm orders for China under new Commerce rules (**AndrewCurran_**).\n\n**Positioning extremes:** Goldman prime-book tech net flow at **-4.4 sigma** (**AndreasSteno**), **NAAIM 52**, lowest since the tariff tantrum (**Chartfest1**), CTAs max short (**saxena_puru**). Several see a tradeable low, but **cointradernik** says dollar liquidity got worse this week and **qthomp** notes the Fed keeps a hiking bias with November CPI landing the day after the December FOMC.\n\n**Oil after the Shenzhen summit:** Crack spreads are collapsing and the all-in cost of a barrel is down **>$50 in a month** (**AndreasSteno**); European gasoline is **-40%** from its September peak (**JavierBlas**). **VKMacro** nonetheless finds it hard to be short here with Hormuz flows slowing and CTAs already short.\n\n**Cyber:** The European Commission was hacked via ARTEX, JPMorgan disclosed two separate third-party breaches, and Chase branches are reportedly short of cash (**AndrewCurran_**, **jvisserlabs**). **cryptopunk7213** argues the wave is AI-coordinated.\n\n**Crypto:** BTC bounced from **$62k** but is on track for a 7th straight weekly loss (**rektmando**). Strategy's **~$2.3B STRC buybacks** below par draw criticism (**qthomp**, **thedefivillain**). Hyperliquid volume is now **69% TradFi** (**Delphi_Digital**); Coinbase launched options (**brian_armstrong**); tokenized equities on Solana hit **$1.22B** (**Matt_Hougan**).", "sections": {"A_events": [{"cluster": "Anthropic IPO — $111.50 Open, Below $100 Within the Hour", "category": ["ai", "macro"], "items": [{"author": "Geiger_Capital", "summary": "ANT opened at $111.50 and was already below $100 shortly after (chart). Earlier in the day Geiger warned that if the Anthropic rally gets killed the way the Nvidia rally was, \"it's actually over\", adding that ANT is another $2T name that spreads AI investors thinner.\n\nAlso: https://x.com/Geiger_Capital/status/2123442194480533587", "tweet_url": "https://x.com/Geiger_Capital/status/2123463110778368422", "images": ["https://pbs.twimg.com/media/HXgOchEWQAI1g1P.jpg"], "type": "tweet", "created_at": "2026-11-19T17:07:12.000Z"}, {"author": "AndrewCurran_", "summary": "Up 35% as soon as shares started trading (chart).", "tweet_url": "https://x.com/AndrewCurran_/status/2123461109948817508", "images": ["https://pbs.twimg.com/media/HXgMoHfbsAA2yaY.jpg"], "type": "tweet", "created_at": "2026-11-19T16:59:15.000Z"}, {"author": "AndrewCurran_", "summary": "Live coverage of the listing: the Amodeis at the Nasdaq and on CNBC, with Dario Amodei's full comments linked.\n\nAlso: https://x.com/AndrewCurran_/status/2123417278079484380", "tweet_url": "https://x.com/AndrewCurran_/status/2123432164427800682", "images": ["https://pbs.twimg.com/media/HXfyTOwbUAA8aB8.jpg", "https://pbs.twimg.com/media/HXf18o3bsAAzudA.jpg", "https://pbs.twimg.com/media/HXf2YPEbwAEBoTg.jpg", "https://pbs.twimg.com/media/HXf7wm4agAAAc2x.jpg"], "type": "thread", "created_at": "2026-11-19T15:04:14.000Z"}, {"author": "saxena_puru", "summary": "Notes ANT was in a bear market (-20% from its all-time high) within an hour of trading as a public company.", "tweet_url": "https://x.com/saxena_puru/status/2123480325921894650", "images": [], "type": "tweet", "created_at": "2026-11-19T18:15:36.000Z"}, {"author": "amitisinvesting", "summary": "ANT opens up 20% while NVDA loses the $150 level, SPY loses $720 and the Dow loses 50,000 — \"thanks Dario for the vibe coded correction\". In replies attributes the weakness to China issues and a Fed that is hard to fight.", "tweet_url": "https://x.com/amitisinvesting/status/2123465162296549546", "images": [], "type": "thread", "created_at": "2026-11-19T17:15:21.000Z"}, {"author": "AndreasSteno", "summary": "Quoting a report that most institutional buyers got no allocation, Steno noted ANT was still above 105 at the time; an hour later simply: \"Crazy price action\".\n\nAlso: https://x.com/AndreasSteno/status/2123468924469551481", "tweet_url": "https://x.com/AndreasSteno/status/2123450334861574253", "images": [], "type": "tweet", "created_at": "2026-11-19T16:16:26.000Z"}, {"author": "Evan_ss6", "summary": "Indicated to open at $2T — \"thanks for playing\". His total guess for the path: maybe $120-135 by around Monday, then down for a while. Later: nasty two-way vol in an extremely illiquid market, a good time to reassess what you believe and position for it.\n\nAlso: https://x.com/Evan_ss6/status/2123470849533792291", "tweet_url": "https://x.com/Evan_ss6/status/2123452547394371698", "images": [], "type": "thread", "created_at": "2026-11-19T16:25:13.000Z"}, {"author": "dampedspring", "summary": "Days like today are why people hate options market makers (he was one); bid/offer is outrageous in anything. Also notes one of the two JHEQX collar strikes was hit.\n\nAlso: https://x.com/dampedspring/status/2123461243428364789", "tweet_url": "https://x.com/dampedspring/status/2123472602337579068", "images": [], "type": "thread", "created_at": "2026-11-19T17:44:55.000Z"}, {"author": "AviFelman", "summary": "Nasdaq down 4% from the highs; Felman hosted a live market update on what the Anthropic IPO means and whether a rebound follows.\n\nAlso: https://x.com/AviFelman/status/2123471807265051026", "tweet_url": "https://x.com/AviFelman/status/2123478919466913946", "images": [], "type": "tweet", "created_at": "2026-11-19T18:10:01.000Z"}, {"author": "_tolks", "summary": "It's easy to blame the IPO and that is part of it, but \"something is deeply broken\" — you don't get today's price action when everything is fine, a point he has been making for weeks.", "tweet_url": "https://x.com/_tolks/status/2123471782334038294", "images": [], "type": "tweet", "created_at": "2026-11-19T17:41:39.000Z"}, {"author": "jvisserlabs", "summary": "Quoting a report that Chase branches are out of cash after the bank outages: \"new times\" — the largest stock in the world and head of the AI trade is down 34% in six weeks, Costco sees a run on generators and bottled water, bank branches run out of cash, and the Fed jawbones the market about fighting 2.6% core CPI.", "tweet_url": "https://x.com/jvisserlabs/status/2123468349762048387", "images": ["https://pbs.twimg.com/media/HXgSRlkacAAy2sC.png"], "type": "tweet", "created_at": "2026-11-19T17:28:01.000Z"}, {"author": "krugermacro", "summary": "Color: \"This market is like a glass of warm milk. Deep-fried in elephant piss. Aged in a barrel. For a hundred years.\"", "tweet_url": "https://x.com/krugermacro/status/2123463472419652061", "images": [], "type": "tweet", "created_at": "2026-11-19T17:08:38.000Z"}, {"author": "Chartfest1", "summary": "Plans to start a (new) chart in ANT, quoting shares at $95.50 and Leverage Shares' plan to launch a 2x long Anthropic daily ETF ($ANUU) on Nov 23.", "tweet_url": "https://x.com/Chartfest1/status/2123466398781321404", "images": [], "type": "tweet", "created_at": "2026-11-19T17:20:16.000Z"}, {"author": "zeroxkyle", "summary": "\"ANT IPO is my GTA 6.\"", "tweet_url": "https://x.com/zeroxkyle/status/2123410359017214457", "images": [], "type": "tweet", "created_at": "2026-11-19T13:37:35.000Z"}, {"author": "cryptopunk7213", "summary": "History made twice today: the world's most anticipated video game (GTA VI) and the world's largest IPO — \"both will do a fantastic job of removing people from their jobs. Happy Grand Theft Anthropic day.\" He also recorded his bull/bear take on the IPO and the trajectory to RSI.\n\nAlso: https://x.com/cryptopunk7213/status/2123477533534638582", "tweet_url": "https://x.com/cryptopunk7213/status/2123408812468208002", "images": [], "type": "tweet", "created_at": "2026-11-19T13:31:26.000Z"}]}, {"cluster": "\"Making Room\" — Why the Nasdaq Fell as ANT Popped", "category": ["macro", "ai"], "items": [{"author": "elerianm", "summary": "For those surprised that Nasdaq and other indices are down 1.5-2% while Anthropic trades 20% above its IPO price: this isn't just about the promise of AI but about making room for it. Narrowly, financing the mega-IPO means selling other holdings. More broadly, it mirrors what has been happening with yields — with no large borrowers reducing their use of the bond market, financing costs rise for everyone and rate-sensitive sectors get hit hardest (CNBC index table attached).", "tweet_url": "https://x.com/elerianm/status/2123466886931259790", "images": ["https://pbs.twimg.com/media/HXgR1TYWoAACDpl.png"], "type": "tweet", "created_at": "2026-11-19T17:22:12.000Z"}, {"author": "jimcramer", "summary": "Pre-open mechanics: when futures are up like this, think (1) people sold a lot more than they received — they sold other stocks to fund Anthropic and got little allocation, (2) they must now buy Anthropic in the open market to size the position, and (3) they have to put back the money they raised. Expected retail to come in with market orders, so the open could be $120; not a lot of allocations for retail.\n\nAlso: https://x.com/jimcramer/status/2123402843013210521", "tweet_url": "https://x.com/jimcramer/status/2123350396777254977", "images": [], "type": "tweet", "created_at": "2026-11-19T09:39:19.000Z"}, {"author": "munster_gene", "summary": "Nasdaq drops 2% as ANT pops 20%. Many bet the IPO would lift the broader AI trade — classic groupthink. Not an indictment of AI; it is what happens when many are on the same side of a trade. Investors still want the exposure, and the $80B Anthropic raised will soon fund infrastructure and applications.", "tweet_url": "https://x.com/munster_gene/status/2123472881900196317", "images": [], "type": "tweet", "created_at": "2026-11-19T17:46:01.000Z"}, {"author": "cryptopunk7213", "summary": "ANT indicated to open at $2T — the 6th largest company in the world, with $500B of excess demand. For anyone who thought the Nvidia drama killed appetite, it is the opposite: money is rotating heavily into the AI lab layer while semis cool off. Separately reminds that Google owns about 17% of Anthropic — roughly $260B at the open.\n\nAlso: https://x.com/cryptopunk7213/status/2123415858126963105", "tweet_url": "https://x.com/cryptopunk7213/status/2123458995348271500", "images": [], "type": "tweet", "created_at": "2026-11-19T16:50:51.000Z"}, {"author": "ZeeContrarian1", "summary": "The only explanation for the Nasdaq rallying 2% in premarket on an IPO everyone knew was oversubscribed is that sentiment had become so bearish that even widely anticipated news triggered a powerful rally. What he wants to see next is a collapse in volatility: for every 1% rise in the S&P, the VIX should fall at least 7%; anything less and he questions the move — \"price going up is one thing, fear disappearing is another\".\n\nAlso: https://x.com/ZeeContrarian1/status/2123337893967995302", "tweet_url": "https://x.com/ZeeContrarian1/status/2123401978050904443", "images": [], "type": "thread", "created_at": "2026-11-19T13:04:17.000Z"}, {"author": "zeroxkyle", "summary": "Quoting the thesis that the ANT IPO marks the local bottom for the AI basket (as the pump.fun ICO did for memecoins — degens dumped memes to free liquidity, then memes rallied), Kyle declared the Santa rally begun.", "tweet_url": "https://x.com/zeroxkyle/status/2123337183499317541", "images": [], "type": "tweet", "created_at": "2026-11-19T08:46:48.000Z"}]}, {"cluster": "Anthropic IPO — Low Float, Unlocks and Crypto-Style Pricing", "category": ["ai", "crypto"], "items": [{"author": "0xSammy", "summary": "TradFi is running the same low-float, high-FDV playbook crypto ran last cycle: ~5% of ANT shares in the IPO, with unlocked supply set to grow more than 12x in the next year according to DefiLlama's pre-IPO unlock tracker. Links a benchmark of recent IPOs from his newsletter (chart).", "tweet_url": "https://x.com/0xSammy/status/2123447825367191626", "images": ["https://pbs.twimg.com/media/HXgA1UXWgAAmD8o.jpg"], "type": "thread", "created_at": "2026-11-19T16:06:27.000Z"}, {"author": "sjdedic", "summary": "\"The perfect crypto playbook\": list low float / high FDV at an insane valuation, start the hype machine about how the TAM is bigger than you can imagine, then top and bleed out — \"learnt from the best\".", "tweet_url": "https://x.com/sjdedic/status/2123434110345675054", "images": [], "type": "tweet", "created_at": "2026-11-19T15:11:58.000Z"}, {"author": "fejau_inc", "summary": "Sarcastic: \"We did it, we protected retail investors by allowing them to only buy in at a $2T market cap!\" (chart).", "tweet_url": "https://x.com/fejau_inc/status/2123466693834076332", "images": ["https://pbs.twimg.com/media/HXgRnZzaMAAaKJQ.png"], "type": "tweet", "created_at": "2026-11-19T17:21:26.000Z"}, {"author": "laurashin", "summary": "Unchained: crypto traders had Anthropic within 50 cents of its $111.50 Nasdaq open a minute before the first trade.", "tweet_url": "https://x.com/laurashin/status/2123479567973425650", "images": [], "type": "tweet", "created_at": "2026-11-19T18:12:36.000Z"}, {"author": "Matt_Hougan", "summary": "Quoting the tight pricing of ANT perps across venues: \"Onchain markets work.\"", "tweet_url": "https://x.com/Matt_Hougan/status/2123436405368214003", "images": [], "type": "tweet", "created_at": "2026-11-19T15:21:05.000Z"}, {"author": "0xfoobar", "summary": "Circuit is teaming up with Polymarket as Polymarket launches its perps product; a $30k competition lets agents trade ANT perps, with Circuit pitched as the easiest way to build perp agents for it.", "tweet_url": "https://x.com/0xfoobar/status/2123466339235012706", "images": [], "type": "tweet", "created_at": "2026-11-19T17:20:02.000Z"}]}, {"cluster": "Nvidia Without Jensen — $150 Stock, \"Peak FUD\" vs Conspiracy", "category": ["tech", "ai"], "items": [{"author": "ZeeContrarian1", "summary": "\"$NVDA PEAK FUD\": lists the narratives being priced as fact — Jensen a pathological liar who secretly sold chips to China, ran a criminal organization, Chinese intelligence infiltrated Nvidia, employees leaving, competition everywhere, earnings not real, it's over. Almost all of it is speculation and rumor, none conclusively proven, yet the market prices it as established. Not all fears need to be disproven — it is enough for some to be false or less bad than feared for the stock to spike. At $150 and ~10x forward P/E he sees a generational opportunity for a 1-2+ year horizon and planned to lift NVDA to 10-20% of his portfolio. Replies: at $150 the stock already prices 50% of the allegations as true; don't get lost in details you can't analyze — understand the sentiment. Separately calls the \"varsity team\" analogy one of the worst he has heard: Nvidia has lost $2T of market value with Jensen out, an extraordinary price for one man.\n\nAlso: https://x.com/ZeeContrarian1/status/2123353540148040048", "tweet_url": "https://x.com/ZeeContrarian1/status/2123345276626751557", "images": [], "type": "thread", "created_at": "2026-11-19T09:18:58.000Z"}, {"author": "jimcramer", "summary": "On the WSJ report that Wall Street's pledged $500B for Nvidia has not deployed a dime: Cramer has bird-dogged the story with every participant supposedly involved — all say it will happen, but nothing has: no infrastructure, no team. \"Kudos to the WSJ for the obituary… another Jensen product undone by Jensen.\"", "tweet_url": "https://x.com/jimcramer/status/2123371576510853444", "images": [], "type": "tweet", "created_at": "2026-11-19T11:03:28.000Z"}, {"author": "jimcramer", "summary": "A lot of Anthropic's money flows to SpaceX — $3.1B a month at full capacity for compute (Google paying ~$920M a month) — and that is for SpaceX's Nvidia chips. He can't blame Elon for chastising Nvidia: a big client that also wants lower prices is the real battle behind the scenes. Compare what Google pays Apple per year net to be given compute.\n\nAlso: https://x.com/jimcramer/status/2123373231616802994", "tweet_url": "https://x.com/jimcramer/status/2123372797229506737", "images": [], "type": "tweet", "created_at": "2026-11-19T11:08:19.000Z"}, {"author": "dampedspring", "summary": "Mocking the \"buyback blackout window ending\" narrative: the NVDA buyback was announced on September 28 and the blackout-window theory is a myth — \"how's the blackout window ending working out for you misinformed folks?\"", "tweet_url": "https://x.com/dampedspring/status/2123472828963910128", "images": [], "type": "tweet", "created_at": "2026-11-19T17:45:49.000Z"}, {"author": "AviFelman", "summary": "SpaceX relies on NVDA; they are not direct competitors. Reads the argument as the \"AI bet\" rotating from NVDA to SpaceX stock, which he can see.", "tweet_url": "https://x.com/AviFelman/status/2123431767000694880", "images": [], "type": "thread", "created_at": "2026-11-19T15:02:39.000Z"}, {"author": "MelMattison1", "summary": "Big hedge funds thought they reduced risk by selling Micron and SK Hynix to buy NVDA as the safe bet — that is why they are now begging for Jensen's return.", "tweet_url": "https://x.com/MelMattison1/status/2123470201115361492", "images": [], "type": "tweet", "created_at": "2026-11-19T17:35:22.000Z"}]}, {"cluster": "AMD Short Report and TSMC China Curbs — Chip War Ramps", "category": ["tech", "geopolitics", "regulation"], "items": [{"author": "amitisinvesting", "summary": "Hunterbook: \"We believe AMD has also illegally sold chips into China.\" AMD -8% on the headline.", "tweet_url": "https://x.com/amitisinvesting/status/2123441692510429378", "images": [], "type": "tweet", "created_at": "2026-11-19T15:42:05.000Z"}, {"author": "jimcramer", "summary": "The short-seller attack on AMD does not hold up to close scrutiny. He agrees with AMD's statement that the claims misrepresent its business practices and that it complies with US export controls — \"we would buy it if we could for the trust\".", "tweet_url": "https://x.com/jimcramer/status/2123473952261435879", "images": [], "type": "tweet", "created_at": "2026-11-19T17:50:17.000Z"}, {"author": "AndrewCurran_", "summary": "Reuters: TSMC is tightening restrictions on China after new US Commerce Department rules took effect today — orders using 16nm-and-below processes are halted unless customers obtain US export licenses. \"The Chip War is slowly ramping up.\"", "tweet_url": "https://x.com/AndrewCurran_/status/2123410036575879496", "images": ["https://pbs.twimg.com/media/HXfeLFbbIAAGBZE.jpg"], "type": "thread", "created_at": "2026-11-19T13:36:18.000Z"}]}, {"cluster": "Tech Positioning at Historic Extremes — Is This the Low?", "category": ["macro", "positioning"], "items": [{"author": "AndreasSteno", "summary": "Goldman's prime-book net flow in global tech: a trailing six-week z-score of -4.4 as of mid-November. On a normal distribution that is a one-in-185,000 event — once every twenty thousand years for a six-week window — though flows are not normally distributed, so treat it as description rather than probability (chart).", "tweet_url": "https://x.com/AndreasSteno/status/2123343280934924307", "images": ["https://pbs.twimg.com/media/HXehdDpW4AACG_L.png"], "type": "thread", "created_at": "2026-11-19T09:11:02.000Z"}, {"author": "Chartfest1", "summary": "NAAIM exposure down to 52, the lowest since the 35 reading during the Tariff Tantrum. Seaport cut its 2026 S&P year-end target to 7700 from 8200 — \"that's a 5% rally from here\" — and sees 8400 by end-2027. On DVOL at 86%: \"now we're getting somewhere\". Notes 2018, 2014 and 1986 were midterm years.\n\nAlso: https://x.com/Chartfest1/status/2123451486692950181 · https://x.com/Chartfest1/status/2123463472272785491 · https://x.com/Chartfest1/status/2123464462921252954", "tweet_url": "https://x.com/Chartfest1/status/2123468557249806619", "images": [], "type": "tweet", "created_at": "2026-11-19T17:28:50.000Z"}, {"author": "cointradernik", "summary": "The SPX/NDX divergence yesterday was a tell. Above 28k on NDX he expects 28.5k into the ATH anchored VWAP — a major inflection. He does not like the lows as a durable bottom (people are talking 3000 SPX again), but from a price-action view the market is putting in a higher low above the Liberation Day AVWAP and 365-day MA. Massive overhead resistance all the way to 29k; above that things look much better. If price deviates above that cluster and then fails back below, 26k is next, and acceptance below that looks cooked — but with inflation impulses collapsing he thinks it very unlikely this is the endgame. Base case: a growth-scare bear trap into a Goldilocks reversal (4 charts).", "tweet_url": "https://x.com/cointradernik/status/2123329624264622188", "images": ["https://pbs.twimg.com/media/HXeUv1NWIAAjm0g.jpg", "https://pbs.twimg.com/media/HXeZ_g2WIAAAXAN.jpg", "https://pbs.twimg.com/media/HXeaAJxXMAAO2F4.jpg", "https://pbs.twimg.com/media/HXgOCpRWcAAPucZ.jpg"], "type": "thread", "created_at": "2026-11-19T08:16:46.000Z"}, {"author": "cointradernik", "summary": "Dollar liquidity conditions got worse this week, not better. He wouldn't short any crypto down here, but expectations of V-reversals or strength for the rest of the quarter are now unlikely; the severe, rapid repricing helps a little on further downside but not on positive skew out to early Q1 (3 charts).", "tweet_url": "https://x.com/cointradernik/status/2123463211164815380", "images": ["https://pbs.twimg.com/media/HXfxT_bW4AE1VSo.jpg", "https://pbs.twimg.com/media/HXgOiLwWgAAP_rU.jpg", "https://pbs.twimg.com/media/HXgOiLyXkAI-Dr8.jpg"], "type": "tweet", "created_at": "2026-11-19T17:07:36.000Z"}, {"author": "qthomp", "summary": "Posture from this week's Scouting the Tape: liquidity is tight and the equity outlook is mediocre at best while the Fed keeps this strong a hiking bias. November CPI isn't out until Dec 10, the day after the FOMC decision — there may not be much data to change their mind before then.", "tweet_url": "https://x.com/qthomp/status/2123446698806481089", "images": [], "type": "tweet", "created_at": "2026-11-19T16:01:59.000Z"}, {"author": "alpha_pls", "summary": "Scenario in his head: relief into and after the ANT IPO, then a crescendo low before/after the December FOMC for both stocks and crypto, with crypto bottoming first as is tradition; 2018 is the guide. Still thinks the recovery will be long because of AI uncertainty, with the biggest performance divergence the crypto asset class has ever seen.", "tweet_url": "https://x.com/alpha_pls/status/2123317563081764972", "images": [], "type": "tweet", "created_at": "2026-11-19T07:28:51.000Z"}, {"author": "ZeeContrarian1", "summary": "When VXN hits extremes you buy the Nasdaq; when VIX hits extremes you buy the SPX. VXN reached extreme levels yesterday and the Nasdaq rallied 3.5% since. \"I said to buy yesterday; don't chase today.\"", "tweet_url": "https://x.com/ZeeContrarian1/status/2123370370535395463", "images": [], "type": "thread", "created_at": "2026-11-19T10:58:41.000Z"}, {"author": "ColdBloodShill", "summary": "First presence of higher-timeframe bull divergences on Bitcoin alongside several stocks — probably another little low run on lower timeframes, but this is the position you want for some sort of bounce; \"then we just have to see how pathetic it is\". Hours later: green evaporated, \"absolutely pitiful rally\" (charts).\n\nAlso: https://x.com/ColdBloodShill/status/2123441731760972256", "tweet_url": "https://x.com/ColdBloodShill/status/2123412576067535357", "images": ["https://pbs.twimg.com/media/HXfgPM8XgAA7Al0.jpg"], "type": "tweet", "created_at": "2026-11-19T13:46:23.000Z"}, {"author": "Evan_ss6", "summary": "\"Hope you enjoyed the bull market gents\" (chart).", "tweet_url": "https://x.com/Evan_ss6/status/2123441110915957072", "images": ["https://pbs.twimg.com/media/HXf6ZFmXQAAbhXN.jpg"], "type": "thread", "created_at": "2026-11-19T15:39:47.000Z"}, {"author": "AndreasSteno", "summary": "\"Not sure there is a bigger consensus view out there than this one\" (chart).", "tweet_url": "https://x.com/AndreasSteno/status/2123470543873585385", "images": ["https://pbs.twimg.com/media/HXgVM5CXYAACaLc.jpg"], "type": "tweet", "created_at": "2026-11-19T17:36:44.000Z"}]}, {"cluster": "Oil Breaks Down After the Trump-Putin-Xi Shenzhen Summit", "category": ["energy", "geopolitics"], "items": [{"author": "AndreasSteno", "summary": "Details of the Putin-Xi-Trump oil deal remain scarce, but crack spreads continue to collapse in a one-way move. The all-in cost of a barrel has fallen by more than $50 in a month — an unprecedented move getting surprisingly little official attention (chart).", "tweet_url": "https://x.com/AndreasSteno/status/2123381656681595293", "images": ["https://pbs.twimg.com/media/HXfEW4zWsAEPJi9.png"], "type": "tweet", "created_at": "2026-11-19T11:43:32.000Z"}, {"author": "JavierBlas", "summary": "European wholesale gasoline (Eurobob Oxy NWE) is down ~40% from its September peak to an 8-month low around $800/t — below the 5-year average and only ~15% above the 10-year average.", "tweet_url": "https://x.com/JavierBlas/status/2123471787501756854", "images": [], "type": "tweet", "created_at": "2026-11-19T17:41:40.000Z"}, {"author": "VKMacro", "summary": "\"Quite hard to be short oil here\": CTAs are already short, Hormuz flows are slowing, and physical indicators have turned up after bottoming in mid-November (chart; he admits it is mostly vibes now that he no longer covers oil in detail). In a separate exchange with Warren Pies and others he argues the forward-curve move also reflects current spot tightness, so there is signal: not securing supply longer-term risks missing out or paying more, though an inferred curve is not the same as a traded one.\n\nAlso: https://x.com/VKMacro/status/2123469372723478961", "tweet_url": "https://x.com/VKMacro/status/2123477314604499194", "images": ["https://pbs.twimg.com/media/HXgdd8ibQAAckoM.jpg"], "type": "thread", "created_at": "2026-11-19T18:03:38.000Z"}, {"author": "zriboua", "summary": "From the Shenzhen trilateral summit readout — UN reform, opposing ICC jurisdiction abuse, nuclear-risk talks — she singles out one line: \"Boost refined petroleum supply & stable energy flows. Interesting.\"", "tweet_url": "https://x.com/zriboua/status/2123427746399359450", "images": [], "type": "tweet", "created_at": "2026-11-19T14:46:40.000Z"}, {"author": "BobEUnlimited", "summary": "\"China Hosts While Crumbling At Home\": the latest suite of economic data suggests an emerging domestic Chinese economic crisis just as policymakers focus on global power and palace intrigue (chart; Substack linked).", "tweet_url": "https://x.com/BobEUnlimited/status/2123389577050108388", "images": ["https://pbs.twimg.com/media/HXfD8c_WIAA5OQH.png"], "type": "tweet", "created_at": "2026-11-19T12:15:00.000Z"}, {"author": "ASvanevik", "summary": "With Elon Musk in Shenzhen, Svanevik confirms Shenzhen Robot Valley is worth the visit.", "tweet_url": "https://x.com/ASvanevik/status/2123359198159454555", "images": [], "type": "tweet", "created_at": "2026-11-19T10:14:17.000Z"}]}, {"cluster": "Cyberattack Wave — Brussels, JPMorgan, Chase Branches", "category": ["tech", "geopolitics", "society"], "items": [{"author": "AndrewCurran_", "summary": "The European Commission has been hacked; the attackers once again used ARTEX. The Commission admits the attack has been ongoing since October 22 and does not yet know the extent of the damage or whether staff personal data was accessed (Politico linked).", "tweet_url": "https://x.com/AndrewCurran_/status/2123403849545191765", "images": ["https://pbs.twimg.com/media/HXfYjERacAA9CyU.jpg"], "type": "thread", "created_at": "2026-11-19T13:11:43.000Z"}, {"author": "AndrewCurran_", "summary": "Third-party vendors to JPMorgan Chase were hacked, exposing customer names and emails after a ransomware deadline expired this morning. He then clarifies a second, separate JPMorgan attack released 16,000 customer email addresses, phone numbers and account IDs plus 100+ employee emails (Cybernews linked).", "tweet_url": "https://x.com/AndrewCurran_/status/2123422063864213539", "images": ["https://pbs.twimg.com/media/HXfpHUPaAAAg5Vr.jpg", "https://pbs.twimg.com/media/HXf6nP_bYAAuJB5.jpg"], "type": "thread", "created_at": "2026-11-19T14:24:05.000Z"}, {"author": "stacy_muur", "summary": "Timeline of the week: Nov 12 Microsoft 365 outage; Nov 13 FAA nationwide ground stop; Nov 16 BofA, JPMorgan and Wells Fargo outages, United Airlines outage; Nov 17 Schwab, Apple services and the NSA classified network; Nov 19 Chase's third parties hacked. \"Welcome to the AI era.\"", "tweet_url": "https://x.com/stacy_muur/status/2123448999445442614", "images": [], "type": "tweet", "created_at": "2026-11-19T16:11:07.000Z"}, {"author": "jimcramer", "summary": "Palo Alto's clean beat was the second-biggest story of the night after Anthropic; Nikesh Arora explained why we are seeing all these outages. \"To be a salesperson at CrowdStrike or Palo Alto Networks… it must be joy.\"\n\nAlso: https://x.com/jimcramer/status/2123350554973733368", "tweet_url": "https://x.com/jimcramer/status/2123373456045600896", "images": [], "type": "tweet", "created_at": "2026-11-19T11:10:56.000Z"}, {"author": "Matt_Hougan", "summary": "On the JPMorgan breach: \"I wonder if JPM will increase or decrease its AI cyberdefense budget next year?\"", "tweet_url": "https://x.com/Matt_Hougan/status/2123434966671569133", "images": [], "type": "tweet", "created_at": "2026-11-19T15:15:22.000Z"}, {"author": "lopp", "summary": "Asks whether anyone else is getting deluged with a wide variety of phishing emails this week.", "tweet_url": "https://x.com/lopp/status/2123450967043563785", "images": [], "type": "tweet", "created_at": "2026-11-19T16:18:57.000Z"}]}, {"cluster": "Strategy's STRC Buybacks Under Fire", "category": ["crypto", "positioning"], "items": [{"author": "qthomp", "summary": "Since Monday August 24, Strategy has repurchased ~$2.3B of STRC at prices higher than where it trades now but below the ~$100 par it was issued at.", "tweet_url": "https://x.com/qthomp/status/2123446286779314312", "images": [], "type": "tweet", "created_at": "2026-11-19T16:00:21.000Z"}, {"author": "thedefivillain", "summary": "Was buying back $200M at $99.9 a good idea when it trades at $96 a week later? Holding cash would have been better; defending a floor the market can force is almost always a bad idea — if Saylor is a buyer at $99.9 there can be $5B of sell pressure at that level. To Saylor directly: this is the consequence of absorbing 100% of demand above $100.01 and then rushing to buy billions of BTC above $80k.\n\nAlso: https://x.com/thedefivillain/status/2123435749915734387", "tweet_url": "https://x.com/thedefivillain/status/2123406484637675943", "images": [], "type": "thread", "created_at": "2026-11-19T13:22:11.000Z"}]}, {"cluster": "Crypto Rails Go TradFi — Hyperliquid, Coinbase Options, Tokenized Stocks; Ledger CSO Exits", "category": ["crypto"], "items": [{"author": "Delphi_Digital", "summary": "Speculation on Hyperliquid has moved to TradFi: a year ago altcoins were 94% of volume outside BTC/ETH; stocks and commodities are now 69% of that flow. Silver led early in the year, then oil in spring and memory-chip stocks in summer; in July TradFi volume topped BTC and ETH combined.", "tweet_url": "https://x.com/Delphi_Digital/status/2123432713998700555", "images": [], "type": "tweet", "created_at": "2026-11-19T15:06:25.000Z"}, {"author": "chameleon_jeff", "summary": "Ripio — one of LATAM's largest exchanges with 8M+ users — integrated Hyperliquid, with wARS/USDC and wBRL/USDC (Argentine peso, Brazilian real) live on the HyperCore spot order book; part of the builder-code vision of meeting users where they are, geographically and in denomination.", "tweet_url": "https://x.com/chameleon_jeff/status/2123423417773043804", "images": [], "type": "tweet", "created_at": "2026-11-19T14:29:28.000Z"}, {"author": "brian_armstrong", "summary": "Crypto options, powered by Deribit liquidity, are now live on Coinbase for non-US users and coming to the US soon via Coinbase Pro.", "tweet_url": "https://x.com/brian_armstrong/status/2123417174031417841", "images": [], "type": "tweet", "created_at": "2026-11-19T14:04:40.000Z"}, {"author": "Matt_Hougan", "summary": "Tokenized equities are now a billion-dollar asset class on Solana ($1.22B circulating, nearly double October's close): \"huge milestone, and oh so early — this will be trillions some day\".", "tweet_url": "https://x.com/Matt_Hougan/status/2123434559169778065", "images": [], "type": "tweet", "created_at": "2026-11-19T15:13:45.000Z"}, {"author": "WazzCrypto", "summary": "Added after-hours price data to his tokenized-stocks tracker, since tokenized stocks don't close at 4pm.", "tweet_url": "https://x.com/WazzCrypto/status/2123479151290073364", "images": [], "type": "tweet", "created_at": "2026-11-19T18:10:56.000Z"}, {"author": "beaniemaxi", "summary": "On Ledger's CSO (founder of the Donjon attack lab) leaving at end-2026 after nine years: a long-time critic who has had heated DMs with Ledger's CTO over what he considers massive OpSec and product-strategy failures, he wishes him well; suggests making devices tamper-proof and dropping email-based seed recovery.", "tweet_url": "https://x.com/beaniemaxi/status/2123463149969969285", "images": [], "type": "thread", "created_at": "2026-11-19T17:07:21.000Z"}]}, {"cluster": "Gemini 4 Neon (\"Carbon\") — Google Back on Top of Benchmarks", "category": ["ai"], "items": [{"author": "AndrewCurran_", "summary": "The only other time Google topped every benchmark was the week of Gemini 3.1, when it was dethroned only by a newer Gemini. Replying to a note on Google's spend, he adds Google also passed its rival on compute spend for the first time (chart).\n\nAlso: https://x.com/AndrewCurran_/status/2123425388445733356", "tweet_url": "https://x.com/AndrewCurran_/status/2123424731991097668", "images": [], "type": "thread", "created_at": "2026-11-19T14:34:42.000Z"}, {"author": "dylan522p", "summary": "Quoting a researcher's apology to Google (\"they cooked with Carbon — spikier across domains but really good in a few areas\"), Patel says SemiAnalysis evals are running; they take time because the tasks are complex.", "tweet_url": "https://x.com/dylan522p/status/2123454923253989893", "images": [], "type": "thread", "created_at": "2026-11-19T16:34:40.000Z"}, {"author": "WazzCrypto", "summary": "Repeated ask to lab staff: stop restricting the new model to your own harness and let subscribers use it wherever — it is the only reason he hasn't subscribed.\n\nAlso: https://x.com/WazzCrypto/status/2123407297246302650 · https://x.com/WazzCrypto/status/2123414132120850601 · https://x.com/WazzCrypto/status/2123467994885927259", "tweet_url": "https://x.com/WazzCrypto/status/2123407159753068766", "images": [], "type": "tweet", "created_at": "2026-11-19T13:24:52.000Z"}]}], "B_insights": [{"author": "SemiAnalysis_", "summary": "AI racks are now too heavy for most old datacenters. A GB300 NVL72 weighs 1,590kg with its liquid loop filled versus ~450kg for a 2011 rack, and Nvidia puts next year's Vera Rubin rack at ~4,000lb; filled floor load per square foot is up 3.5x since 2011 and heading to 4x. Coolant alone adds 500-1,000lb. The TIA-942 standard asks for 150-250lb/sq ft (7-12kPa); a GB300 puts ~17kPa on its footprint dry and 22kPa filled, while Singapore multistory sites are rated 5-15kPa. Racks ship dry — a dry GB300 fits a standard 1,500kg freight lift, a filled one does not — so the lift sees the dry rack and the floor carries the filled one. Raising an upper floor's rating means strengthening slabs, beams, columns and foundations, often in post-tensioned concrete that cannot be cut, and overhead coolant pipes and busway add load. Conclusion: new AI capacity goes into single-story halls or buildings designed for the weight from the start (3 charts).", "tweet_url": "https://x.com/SemiAnalysis_/status/2123465108193992939", "images": ["https://pbs.twimg.com/media/HXgQQ2LXsAAyyJF.jpg", "https://pbs.twimg.com/media/HXgQQ1YWQAAuuPy.jpg", "https://pbs.twimg.com/media/HXgQQ0sXEAAYAyx.jpg"], "type": "thread", "created_at": "2026-11-19T17:15:08.000Z"}, {"author": "aleabitoreddit", "summary": "Soitec ($SOI) quarter: markets have given him PTSD on every green rally, but SOI going from $25M quarterly photonics-SOI revenue with no visibility earlier this year to $1.2B of capacity-reservation agreements this quarter, backed by cash, is transformative. Transcript highlights: AI datacenters have idle compute because copper links limit data availability and optics removes that bottleneck (his point that aggregate capex does not map 1:1 to optical, since optics improve GPU utilization); near-package optics brings first volume by fiscal year-end and high volume next year, co-packaged optics for scale-out is starting to ramp, TPO for scale-up is next; FY2027 revenue mostly pluggables with initial NPO volume; revenue grew 39% led by photonics-SOI with margin expansion pulled forward; reservation agreements cover CY2027, CY2028 and beyond; new requests skew to CPO and NPO, especially for scale-up. He calls this quarter the inflection of optical acceleration for Soitec and silicon photonics — a chokepoint turning into company economics. Earlier Citi had warned photonics-SOI expectations were excessive (2 charts).", "tweet_url": "https://x.com/aleabitoreddit/status/2123335230870392843", "images": ["https://pbs.twimg.com/media/HXeaIHgaUAAuNBn.jpg", "https://pbs.twimg.com/media/HXeaIHfaMAAeEs0.jpg"], "type": "thread", "created_at": "2026-11-19T08:39:03.000Z"}, {"author": "aleabitoreddit", "summary": "Coherent ($COHR) announced a new $2B open-market buyback — the confidence signal he likes. The optical industry looks very undervalued at the inflection of the next supercycle: photonics-SOI substrate players went from $25M revenue to $1.2B of LTAs in a quarter, InP substrates from $100M backlog to $500M; lasers, modules and the rest of the optical chain should accelerate next. Coherent presumably finds its own valuation low too after signing $20B of LTAs (chart).", "tweet_url": "https://x.com/aleabitoreddit/status/2123401652782923980", "images": ["https://pbs.twimg.com/media/HXfWivNaIAAtZp5.jpg"], "type": "tweet", "created_at": "2026-11-19T13:02:59.000Z"}, {"author": "AndreasSteno", "summary": "Steno's AI-cycle thesis across several posts: he spent 45 minutes with Raoul Pal on why the AI buildout is the exact opposite of the dot-com bubble — the market is priced \"upside down\" versus 2000 and infrastructure is being built far too slowly relative to demand (free on YouTube). GPU rental rates still rising even for older Nvidia chips is natural when no one wants to fund or approve the buildout. To the \"Anthropic is the new Yahoo, no moat\" rebuttal: the company that has grown faster than any in history having zero moat is \"the single most stupid viewpoint I have ever heard\" — the training-to-inference ratio is collapsing as expected and inference is already highly profitable. Short version of where we are: \"Anthropic is the new Windows; Micron, Hynix and the memory chain are the new Intel\".\n\nAlso: https://x.com/AndreasSteno/status/2123405064983154858 · https://x.com/AndreasSteno/status/2123446142897955044 · https://x.com/AndreasSteno/status/2123385955117945017", "tweet_url": "https://x.com/AndreasSteno/status/2123455881824092352", "images": ["https://pbs.twimg.com/media/HXgH3i5XsAAcVqX.jpg"], "type": "thread", "created_at": "2026-11-19T16:38:28.000Z"}, {"author": "RaoulGMI", "summary": "\"Compute is the only good ever with infinite demand… and the market is pricing it like a cyclical that's about to roll over.\" Sat down with Andreas Steno on why both think the market has the AI trade wrong, what really drove the selloff, and what it means for crypto.", "tweet_url": "https://x.com/RaoulGMI/status/2123464241441038521", "images": [], "type": "tweet", "created_at": "2026-11-19T17:11:41.000Z"}, {"author": "nicbstme", "summary": "Read the open-source X ranking code (param.rs weights for the For You feed). Copying a post's link has weight 20 versus 0.7 for a like — ~30x a like and 4x a reply — his guess being that copying a link means you are about to send it to a group chat or email, the strongest signal a post is worth something. Reply, quote and DM-share are 5, following the author 4, share 2.1, repost 1, like 0.7. Negatives are brutal: report -234, mute -59, \"not interested\" -53, block -31. A reply from a mutual gets a 15x boost. Reposts don't reach strangers (a filter drops them for non-followers of the reposter) while a quote is a new post that travels further. Posts leave For You after 48 hours; small accounts get guaranteed test slots while a post is under 2 hours old with under 200 views. Hashtags are not read anywhere in the ranking code — text and images are embedded and matched to similar-interest users. Takeaway: write things people want to send to one specific person.", "tweet_url": "https://x.com/nicbstme/status/2123435494457626915", "images": [], "type": "tweet", "created_at": "2026-11-19T15:17:28.000Z"}, {"author": "nicbstme", "summary": "Announces he leads \"Today\" at Microsoft, the product shown across Ignite this week: a new form factor for work that is a feed rather than a chat box. Overnight an agent works through your email, calendar, Teams and documents; in the morning replies are drafted, conflicts spotted, important messages surfaced and documents queued for review, and you send, accept or mark done in a few taps — no prompting or configuration. It lives in existing apps, starting with Outlook and Copilot.", "tweet_url": "https://x.com/nicbstme/status/2123481166737289514", "images": [], "type": "tweet", "created_at": "2026-11-19T18:18:57.000Z"}, {"author": "hooeem", "summary": "A copy-paste prompt for Gemini 4 Neon that turns any trader's YouTube videos into a track-record table: pull the last 10 public videos, extract every stated trade call with URL, title, publish date, timestamp, exact quote, asset, direction, entry/target/stop and any speaker-stated date (writing \"not stated\" rather than inventing), then look up historical prices around each call with citations and tally whether price moved with or against the call. Afterwards copy to Sheets, verify every timestamp and price, and have Gemini chart calls against price. Caveats: deleted/unlisted videos make records look cleaner than they were, no trader is always right, and the useful read is risk/reward and a 40%+ hit rate.", "tweet_url": "https://x.com/hooeem/status/2123435036003160173", "images": [], "type": "tweet", "created_at": "2026-11-19T15:15:38.000Z"}, {"author": "alpha_pls", "summary": "On the \"PEARL can flip BTC\" pitch: the biggest problem is that Bitcoin failing would be such devastating capital destruction that it would undermine the idea that any digital store of value can work — the lesson cemented would be that there is always another digital SOV to vamp the incumbent, so these assets would stay niche and unattractive to big capital. The pitch is therefore wrong even if parts of the design are superior; the modern world has had very few liquid SOVs for good reason, and BTC still has a long way to go against a 5,000-year-old shiny rock. BTC succeeding is good for all alt digital SOVs — as silver flipping gold would destroy gold's value. He has seen the hashrate argument for many PoW coins (KAS most recently), concedes PEARL's path to growing hashrate is clearer, and holds PEARL himself — he just wants it pitched honestly.", "tweet_url": "https://x.com/alpha_pls/status/2123340124834439396", "images": [], "type": "thread", "created_at": "2026-11-19T08:58:30.000Z"}, {"author": "DCinvestor", "summary": "The influential participants on X lean clearly right of center, which is why the site has offered significant political alpha for years: narratives that percolated here had a direct line into policy, largely via Elon's hundreds of millions in the political process. With the blue sweep, the death of MAGA and Elon effectively disavowing it, that alpha may degrade into noise detached from public opinion and policy direction — even accounting for the \"blue shift\" business leaders will now attempt. TL;DR: X's political narrative-setting power may die soon.", "tweet_url": "https://x.com/DCinvestor/status/2123373206715474305", "images": [], "type": "thread", "created_at": "2026-11-19T11:09:57.000Z"}, {"author": "nic_carter", "summary": "Asked by Joe Weisenthal whether X was worth it: of course — friends, relationships, professional success, information; \"it's like asking someone if talking on the phone was worth it\". He took the summer off from posting after a big fight with Bitcoin Twitter, and recalls fighting with Izabella Kaminska about Bitcoin back in the FT Alphaville days.", "tweet_url": "https://x.com/nic_carter/status/2123447442888868332", "images": [], "type": "thread", "created_at": "2026-11-19T16:04:56.000Z"}, {"author": "zeroxkyle", "summary": "Realized halfway through a year of trading equities that it isn't a game of picking stocks but of figuring out what long/short funds will buy next — see the recent Walmart price action. Quoted context: equity L/S has de-grossed to near neutral, macro funds are short, positioning is several standard deviations below normal, and only crypto looks outright net short.", "tweet_url": "https://x.com/zeroxkyle/status/2123330430602801236", "images": [], "type": "tweet", "created_at": "2026-11-19T08:19:58.000Z"}, {"author": "lopp", "summary": "How will the concept of technical debt evolve in the agentic age given how easy refactoring now is — will organizations still back themselves into complexity even LLMs can't escape? Separately highlights exnode, a weekend, heavily AI-assisted Bitcoin full node written in Elixir: the number of maintained node implementations has dwindled for years, but AI tooling may turn the tide.\n\nAlso: https://x.com/lopp/status/2123403507751674252", "tweet_url": "https://x.com/lopp/status/2123427844542075253", "images": [], "type": "tweet", "created_at": "2026-11-19T14:47:04.000Z"}, {"author": "PeterDiamandis", "summary": "Three data points: a personalized cancer vaccine built from each patient's tumor mutations cut melanoma recurrence or death by 42% on top of standard immunotherapy in a 1,137-person trial (82% alive and recurrence-free at two years vs 70%); a 76% lower rate of progression to moderate/severe dementia over three years in routine clinics, relevant to 7.2M Americans over 65 with Alzheimer's; and GPT-3.5-level AI falling from $20 to $0.07 per million tokens in ~18 months — a 280x price collapse.\n\nAlso: https://x.com/PeterDiamandis/status/2123438115708969454 · https://x.com/PeterDiamandis/status/2123436269585789364", "tweet_url": "https://x.com/PeterDiamandis/status/2123393613451153816", "images": [], "type": "tweet", "created_at": "2026-11-19T12:31:02.000Z"}, {"author": "Rewkang", "summary": "Demand for robot hardware will overwhelm supply by multiple orders of magnitude for many, many years.", "tweet_url": "https://x.com/Rewkang/status/2123452202513842649", "images": [], "type": "tweet", "created_at": "2026-11-19T16:23:51.000Z"}, {"author": "TimDraper", "summary": "Request for startups — areas he wants to fund: (1) AI mediation, one system doing the work for both sides of a legal case and producing the settlement; (2) Polymarket for insurance, where people bid to offer coverage (e.g. Pacific Palisades fire insurance) and bids price the risk; (3) interspecies communication via AI; (4) new countries with new governance models; (5) electromagnetic rocket launch, horizontal then vertical, replacing propulsion. Open to anything along these lines.", "tweet_url": "https://x.com/TimDraper/status/2123461596399940061", "images": [], "type": "tweet", "created_at": "2026-11-19T17:01:11.000Z"}, {"author": "dampedspring", "summary": "Housekeeping he has done professionally and personally for decades: take a daily download of every financial account and save it locally — storage is cheap and even keeping only the latest download is good hygiene. Motivation: a record in case your institution has issues; his hedge fund had a cash-reconciliation problem with a third-party general-ledger provider in 2004 that left a mark. Save as PDF, pull it off your email server, store locally; an agent could handle it trivially now.", "tweet_url": "https://x.com/dampedspring/status/2123450399046635589", "images": [], "type": "thread", "created_at": "2026-11-19T16:16:41.000Z"}, {"author": "stonecoldpat0", "summary": "On Ethereum post-quantum plans (thread with Uniswap and EF researchers): he would rather see PQ signatures added as a straight replacement for ECDSA via hardfork, then focus on tx.gaspayer (replacing tx.origin) allowing a contract or non-signing EOA to pay gas. Asks whether PQ will be a native signature or a contract popped into the frame; argues it could simply be today's transaction format with a PQ signature, with an actor in the middle proving the signature in ZK and stripping it before storage. Multisigs could be done Bitcoin-style, K-of-N signatures in one transaction, so people wouldn't need MPC or a Safe.", "tweet_url": "https://x.com/stonecoldpat0/status/2123440212273729988", "images": [], "type": "thread", "created_at": "2026-11-19T15:36:12.000Z"}, {"author": "zriboua", "summary": "Israel's real GDP grew at an 8.0% annualized rate in Q3 2026 (1.9% q/q) per the CBS first estimate, among the fastest in the OECD. \"Production abroad\" — advanced products based on Israeli technology, made and sold overseas — accounted for roughly half of headline growth; excluding it, growth was 4.0% annualized. Private consumption +6.4% and fixed investment +11.3% annualized (chart).", "tweet_url": "https://x.com/zriboua/status/2123479405561282893", "images": ["https://pbs.twimg.com/media/HXgdRADXQAA0INa.jpg"], "type": "tweet", "created_at": "2026-11-19T18:11:57.000Z"}, {"author": "laurashin", "summary": "Jesse Pollak on Base, from Unchained's live broadcast: the next phase of adoption is a parallel path of new entrants building products fast and incumbents with distribution and assets using the tech to run more efficiently; the adoption race will be competitive over the next few years; Base's focus is simply products customers love. Base has done four upgrades on its new Azul stack with a fifth before year-end and hopes for ~20 next year, eventually weekly. With the SEC's innovation exemption Base wants to bring its tokenization product to the US; public-company hesitancy is normal early-technology caution.\n\nAlso: https://x.com/laurashin/status/2123466071013494832 · https://x.com/laurashin/status/2123466671457280416 · https://x.com/laurashin/status/2123469487777239277 · https://x.com/laurashin/status/2123471128786268405 · https://x.com/laurashin/status/2123471982750748887", "tweet_url": "https://x.com/laurashin/status/2123467746763563076", "images": [], "type": "tweet", "created_at": "2026-11-19T17:25:37.000Z"}, {"author": "laurashin", "summary": "Aztec's Zac Williamson on keeping North Korea out of private protocols: cash has serial numbers and so do private notes on Aztec — users privately prove their funds don't overlap with a public list of flagged deposits (e.g. Lazarus) without anyone seeing the internals (Unchained Premium).", "tweet_url": "https://x.com/laurashin/status/2123480254648058185", "images": [], "type": "thread", "created_at": "2026-11-19T18:15:19.000Z"}, {"author": "hosseeb", "summary": "The crypto utopianism of 2021 was wrong — so what did crypto actually accomplish, why is it still exciting, and what is the case for continuing to invest? A podcast where he answers the skeptics, arguing crypto's strongest use cases are financial and stablecoins expand access.", "tweet_url": "https://x.com/hosseeb/status/2123474002664669560", "images": [], "type": "tweet", "created_at": "2026-11-19T17:50:29.000Z"}, {"author": "rektmando", "summary": "Mando Minutes daily digest. Markets: BTC $63,666 (-1.6%), ETH $1,804, SOL $74.51, HYPE $68.17, ZEC $941; Nasdaq 24,430 (+0.4%), gold $3,742 (-3.2%), oil $91.95, DXY 103.86; Fear & Greed 11, 24h liquidations $388M. Top stories: BTC bounces from $62k; FOMC minutes show nearly all officials see more hikes; Anthropic prices IPO at $83 ($1.5T); Nvidia falls further despite earnings; gold, silver, copper plunge. Crypto: BTC futures OI at 8-month low; BTC on track for 7th straight weekly loss; STRC lowest since August; MARA and Riot have sold 28K BTC; Citi cuts BTC target to $99.5K from $113K; Hayes says an AI-bubble burst could send BTC to $10K; pump.fun SOL sales hit $890M; Backpack NFA approval for US perps; Coinbase 10x US spot margin; Kraken parent buying Tribe Capital; Variational raises $110M at $1.5B; Binance $6.5B freeze order in Abu Dhabi; tampered Ledgers found in Germany/UAE. Macro: S&P longest losing streak since Aug 2025; Waller calls for 50bp hike in December; pending home sales record low; debt ceiling could bind by Feb/Mar 2027; Trump meets Putin, trilateral with Xi agrees Iran can't have nukes; IRGC says three more tankers ablaze in Hormuz; Ukraine strikes cut Russian refining 45%. AI/tech: Ackman says Nvidia board breached fiduciary duty; Nvidia chair says Jensen not coming back, petition hits 200K; Moody's lowers Nvidia outlook; Google launches Gemini 4 Neon (#2 on Agent Arena); Arizona probes AI firms over rogue agents; GTA VI launches, Take-Two surges.", "tweet_url": "https://x.com/rektmando/status/2123379422573019325", "images": ["https://pbs.twimg.com/media/HXfCOeSXQAAD37C.jpg"], "type": "tweet", "created_at": "2026-11-19T11:34:39.000Z"}, {"author": "jimcramer", "summary": "Software and hyperscaler notes: the multiple shrinkage at Salesforce and ServiceNow is extraordinary — Anthropic is not going to wipe them out, and Satya is now working with Benioff on \"Copilotforce\"; the plug-in is good, not bad. Microsoft is determined to maintain positive operating cash flow, per Satya — perhaps the smartest hyperscaler. CoreWeave's CSO letter should make shorts rethink, though Cramer notes he did sell more than $1B of stock.\n\nAlso: https://x.com/jimcramer/status/2123352883102171370 · https://x.com/jimcramer/status/2123388177536971002 · https://x.com/jimcramer/status/2123408201261465725", "tweet_url": "https://x.com/jimcramer/status/2123352581376458914", "images": [], "type": "tweet", "created_at": "2026-11-19T09:48:00.000Z"}, {"author": "AndrewCurran_", "summary": "New essay from the DeepMind Institute, by Shane Legg: \"What comes after AGI?\"", "tweet_url": "https://x.com/AndrewCurran_/status/2123438927906550226", "images": ["https://pbs.twimg.com/media/HXf4c7VaMAA6WJJ.jpg"], "type": "thread", "created_at": "2026-11-19T15:31:06.000Z"}, {"author": "AndrewCurran_", "summary": "Nick Bostrom this morning on superintelligence slaying the \"Dragon-Tyrant\" (ageing and death) and the cost of waiting too long — Curran links the 20-year-old fable and the interview; in replies: \"it will be free\" and the timeline is a lower bound.", "tweet_url": "https://x.com/AndrewCurran_/status/2123469639900684732", "images": ["https://pbs.twimg.com/media/HXgUYgOa8AAkpWB.jpg", "https://pbs.twimg.com/media/HXgVBEnbQAAImAA.jpg"], "type": "thread", "created_at": "2026-11-19T17:33:08.000Z"}, {"author": "thedefivillain", "summary": "Price-action history: the night before the January 2025 inauguration BTC pumped 7% in an hour to a new ATH, then fully retraced the same day because no strategic reserve was announced — a reminder of how event-driven spikes resolve (chart).", "tweet_url": "https://x.com/thedefivillain/status/2123378181797495143", "images": ["https://pbs.twimg.com/media/HXfBFZXXUAAPI-_.jpg"], "type": "tweet", "created_at": "2026-11-19T11:29:43.000Z"}, {"author": "Zeneca", "summary": "In a world where everyone outsources writing and thinking to AI, there is immense value in thinking for yourself and writing like a human; the homogenization is getting out of hand and will get much worse.", "tweet_url": "https://x.com/Zeneca/status/2123455396295983414", "images": [], "type": "tweet", "created_at": "2026-11-19T16:36:33.000Z"}, {"author": "jimcramer", "summary": "Society note: \"two classes in this two-class America — the super-rich can do whatever they want, you can't\", citing Lenin's What Is to Be Done? and the Communist Manifesto's power as a two-class story (above the law because of money vs following it) — \"we must not go there\".\n\nAlso: https://x.com/jimcramer/status/2123422338842530016 · https://x.com/jimcramer/status/2123423323258298516", "tweet_url": "https://x.com/jimcramer/status/2123420559312846893", "images": [], "type": "tweet", "created_at": "2026-11-19T14:18:07.000Z"}], "C_contrarian": [{"author": "MelMattison1", "summary": "CONTRARIAN (conjecture, no evidence offered): Mattison shares a ChatGPT conversation exploring the possibility that both Jensen Huang and Lisa Su were compromised by the CCP, stressing \"no proof or evidence or claims made\". He thinks China may have been playing a deadly game with Jensen and perhaps Su, that \"Jensen lovers\" will look naive once the saga is revealed, that Bessent is handling it, and the market should move on — if Jensen is Michael Jordan, the NBA is exactly where it would be had Jordan never returned. He also claims his anti-Jensen posts are being suppressed on X.\n\nAlso: https://x.com/MelMattison1/status/2123449570197750076 · https://x.com/MelMattison1/status/2123451742067077543 · https://x.com/MelMattison1/status/2123460696369209514 · https://x.com/MelMattison1/status/2123468288579735963", "tweet_url": "https://x.com/MelMattison1/status/2123446281368437002", "images": [], "type": "tweet", "created_at": "2026-11-19T16:00:19.000Z"}, {"author": "MelMattison1", "summary": "CONTRARIAN CALL: this weekend is the four-year bottom — \"get ready to buy\". ANT is \"the ultimate rug pull\": SPX capitulates and collapses today or tomorrow, just like 2022, then BTC goes from the equivalent of $15k to $120k+ over three years. He expects QQQ to close the week around $650, calling it a capitulation collapse he has seen before, exactly four years to the day from the 2022 BTC low (chart).\n\nAlso: https://x.com/MelMattison1/status/2123475496042467787 · https://x.com/MelMattison1/status/2123480531631304915 · https://x.com/MelMattison1/status/2123479380127277349", "tweet_url": "https://x.com/MelMattison1/status/2123481634968162670", "images": ["https://pbs.twimg.com/media/HXgfSpGXQAApP9M.jpg"], "type": "tweet", "created_at": "2026-11-19T18:20:48.000Z"}, {"author": "cryptopunk7213", "summary": "CONTRARIAN: when will people wake up to the strong possibility these hacks are coordinated by AI? Brussels hacked this morning, 178 websites and platforms exploited yesterday, and the main tool is ARTEX — an open-source AI penetration tester people are strapping DeepSeek models to and turning on any nascent system: governments, banks, web apps. He isn't one for doom without evidence, but the number of people denying any AI involvement \"seems very artificial\".", "tweet_url": "https://x.com/cryptopunk7213/status/2123430418456187230", "images": [], "type": "tweet", "created_at": "2026-11-19T14:57:17.000Z"}, {"author": "beaniemaxi", "summary": "CONTRARIAN: public crypto equities are essentially uninvestable because they aren't genuine businesses — a hodgepodge of products that will never have real demand; the only tech that makes sense is stablecoins and RWA, and there is no margin in operating the rails. To a deep-value investor who disagrees: he is taking the other side — crypto is \"cooked\" for public-equity participation.\n\nAlso: https://x.com/beaniemaxi/status/2123457875901030817", "tweet_url": "https://x.com/beaniemaxi/status/2123452753695420910", "images": [], "type": "tweet", "created_at": "2026-11-19T16:26:02.000Z"}, {"author": "beaniemaxi", "summary": "CONTRARIAN / allegation: on PumpSeek and director Mike Alfred, Beanie says Alfred received half the company's shares for free for a business nobody can define, calls the board grifters, says the stock is going to zero, and asks how many lost money on insider promises of big partners that never materialized.", "tweet_url": "https://x.com/beaniemaxi/status/2123456408024719700", "images": [], "type": "thread", "created_at": "2026-11-19T16:40:34.000Z"}, {"author": "zeroxkyle", "summary": "CONTRARIAN on Solana: using SOL as a hedge on any longs will probably be a good idea going forward. Not about the dating-show event itself, but the optics of a culture seeping across bloated, billion-dollar-funded L1s that attract \"MOPs and sociopaths\" (Chapman's geeks-mops-sociopaths essay linked). Public blockchains have a culture-market-fit problem: almost there for broad adoption, then screwing up badly enough that institutions conclude they are better off building their own chain. Blockchains make no money of their own; there is no real world in which Solana the asset should rise over time with no earnings growth.", "tweet_url": "https://x.com/zeroxkyle/status/2123426299452764376", "images": [], "type": "tweet", "created_at": "2026-11-19T14:40:55.000Z"}, {"author": "BobEUnlimited", "summary": "CONTRARIAN to AI hype: for all the noise, model spend growth remains pretty paltry, at least in the Ramp user sample (chart).", "tweet_url": "https://x.com/BobEUnlimited/status/2123463515524518021", "images": ["https://pbs.twimg.com/media/HXgO0K4W8AATV7c.jpg"], "type": "tweet", "created_at": "2026-11-19T17:08:48.000Z"}, {"author": "marcvanderchijs", "summary": "CONTRARIAN: amplifies former Y Combinator president Geoff Ralston's essay \"Stop!\" and hopes more people spread the message to stop developing frontier-lab AI.", "tweet_url": "https://x.com/marcvanderchijs/status/2123317365253497274", "images": [], "type": "tweet", "created_at": "2026-11-19T07:28:03.000Z"}], "D_positioning": [{"author": "ZeeContrarian1", "summary": "Finished building his NVDA position: 20% of the portfolio. He won't trade it, write about it or comment on every move — \"my edge is patience\". When NVDA was ~$220 before the Jensen charade, many leading hedge funds were buying; he suspects they are buying again, and Nvidia has ~$227B of authorized buyback capacity to repurchase at depressed prices. Sold out of INSM after today's buyout rumors. On BTDR he got sizing wrong rather than the thesis — he entered what he thought was a drawdown that became a full-cycle decline; Druckenmiller and others also lost on it.\n\nAlso: https://x.com/ZeeContrarian1/status/2123359737831969140", "tweet_url": "https://x.com/ZeeContrarian1/status/2123456181213565128", "images": [], "type": "thread", "created_at": "2026-11-19T16:39:40.000Z"}, {"author": "saxena_puru", "summary": "AI and technology stocks seem very close to a major low; on watch for a multi-week rally into Q1 2027. Reasons in replies: CTA positioning max short, massive fund-manager selling of tech (a 4-sigma event), VIX spike, put/call spike, horrendous sentiment. Expects a 25bp hike.", "tweet_url": "https://x.com/saxena_puru/status/2123311634236199404", "images": [], "type": "thread", "created_at": "2026-11-19T07:05:17.000Z"}, {"author": "Evan_ss6", "summary": "Has been \"pretty short\" semis and tech (SQQQ has been good), though it is getting oversold; posts a chart captioned \"your investments are in good cyclical semiconductor businesses — they will come back\" and admits he has been bearposting hard and will eventually be punished. Guess on ANT: $120-135 by around Monday, then down for a while. Wonders aloud about DXY up 5-10% soon.\n\nAlso: https://x.com/Evan_ss6/status/2123452547394371698", "tweet_url": "https://x.com/Evan_ss6/status/2123464244452634681", "images": ["https://pbs.twimg.com/media/HXgPZbEWQAAin40.jpg"], "type": "thread", "created_at": "2026-11-19T17:11:42.000Z"}, {"author": "goodalexander", "summary": "\"It's not that I want the market to crash. It's just that I'm short a lot of stocks\" — possibly top-ticked it \"right down to the quarter\".", "tweet_url": "https://x.com/goodalexander/status/2123465230067917053", "images": [], "type": "thread", "created_at": "2026-11-19T17:15:37.000Z"}, {"author": "rektmando", "summary": "Bought some PUMP: revenue still $1.5M a day in these conditions, people are pitching him trench coins again, and a $1M perp tournament will sustain volume. Market overall looks like death, so probably more of a bounce trade.", "tweet_url": "https://x.com/rektmando/status/2123416108765941814", "images": [], "type": "thread", "created_at": "2026-11-19T14:00:26.000Z"}, {"author": "BillAckman", "summary": "Pershing Square Inc. ($PS) is scheduled to join the Russell 3000 on December 11, estimated to require ~5M shares of passive buying, not counting closet indexers. \"I don't know who has been selling over the last few days, but I thought they might want to know.\" (LSEG additions list linked.)", "tweet_url": "https://x.com/BillAckman/status/2123460497391468962", "images
