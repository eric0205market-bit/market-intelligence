h let him negotiate with British envoy Sir John Bowring in 1855 as an intellectual peer rather than being dismissed as an 'aloof' Asian ruler.", "speaker": "WorksInProgMag", "type": "anecdote", "entities": ["Mongkut", "Sir John Bowring"], "conviction": "high", "so_what": "Personal credibility and fluency in a dominant power's own frameworks (language, science, law) can materially shift negotiating outcomes with that power, even absent military parity.", "quote": "British imperialists were unaccustomed to negotiating with Asian rulers who could meet them on their own intellectual ground.", "locator": "European diplomats had often found Asian rulers, including Mongkut's predecessors, to be aloof", "quote_verified": true}, {"claim": "The 1855 Bowring Treaty capped Siamese import/export duties at 3 percent and granted British subjects extraterritorial legal rights -- an unfavorable, unequal deal -- but crucially it preserved Siam's status as a sovereign negotiating partner rather than a conquered or annexed territory.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["Bowring Treaty", "Mongkut", "Britain"], "conviction": "high", "so_what": "Illustrates a negotiating principle for asymmetric power situations: accepting materially unfavorable but sovereignty-preserving terms can be a rational trade against the alternative of full annexation.", "quote": "It capped Siamese import and export duties at 3 percent and gave significant extraterritorial rights to British subjects", "locator": "The treaty that Mongkut and Bowring negotiated was a decisive shift", "quote_verified": true}, {"claim": "After the Anglo-Burmese Wars, Britain forced Burma to surrender four provinces, pay a crippling ~£1 million indemnity (about $160 million today), and accept a British overseer with veto power over the king's decisions -- a far harsher outcome than Siam's unequal-but-sovereign 1855 treaty.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["Burma", "Britain", "Anglo-Burmese Wars"], "conviction": "high", "so_what": "A quantified benchmark showing the gap between 'unequal treaty' status and de facto colonization -- useful for calibrating how severe different forms of great-power coercion actually are.", "quote": null, "locator": "Following its defeats in the Anglo-Burmese Wars of 1824-26 and 1852", "quote_verified": false}, {"claim": "In 1868 Mongkut staged a lavish solar eclipse-viewing event for British and French officials and accurately predicted the eclipse's timing using combined Thai and Western astronomical methods, reportedly outperforming the French astronomers present, because he understood France prized science as the marker of civilization while Britain prized law and free trade.", "speaker": "WorksInProgMag", "type": "anecdote", "entities": ["Mongkut", "France", "Britain"], "conviction": "high", "so_what": "Shows the value of tailoring legitimacy signals to each audience's specific criteria for 'civilization' rather than a one-size-fits-all diplomatic pitch.", "quote": "The Siamese court knew what to perform to whom.", "locator": "In 1868, Mongkut extended invitations to British and French officials to observe a solar eclipse", "quote_verified": true}]}, {"theme": "Nation-building and identity engineering", "insights": [{"claim": "Chulalongkorn (Rama V) dismantled Siam's traditional mandala system -- in which sovereignty faded with distance from the capital and multiple overlapping zones of authority existed -- and replaced it with a Western-style centralized nation-state with fixed borders, a standard language, and a census, directly closing off the divide-and-rule tactics Britain and France used elsewhere.", "speaker": "WorksInProgMag", "type": "framework", "entities": ["Chulalongkorn", "mandala system"], "conviction": "high", "so_what": "A generalizable playbook: multi-ethnic, decentralized polities are structurally vulnerable to external powers' 'protect the minority' pretexts, and rapid administrative enturies-old identity into an inclusive nation-state, instead privileging ethnic Vietnamese over minorities like the Cham and Khmer; France exploited this by governing Cochinchina as a colony and Annam/Tonkin as separate protectorates, deepening fragmentation and ultimately dismantling the Vietnamese state.", "speaker": "WorksInProgMag", "type": "causal", "entities": ["Vietnam", "Tu Duc", "France", "Nguyen dynasty"], "conviction": "high", "so_what": "A negative case study: having a strong pre-existing national identity is not sufficient if it excludes minorities in a way an external power can exploit via administrative fragmentation.", "quote": null, "locator": "This approach differed dramatically from that taken by Vietnam", "quote_verified": false}, {"claim": "Chulalongkorn undertook grand tours of Europe in 1897 and 1907, insisting on being received as a monarch of equal rank, dressing his entourage in Western clothing and European court customs, speaking fluent English, and sending some of his sons (future Siamese kings) to elite institutions like Eton -- a sustained image-management campaign to signal peer status to European elites.", "speaker": "WorksInProgMag", "type": "anecdote", "entities": ["Chulalongkorn", "Eton"], "conviction": "high", "so_what": "Illustrates that elite-level symbolic signaling (dress, education, court protocol) sustained over decades can materially shift how a weaker state is perceived and treated by dominant powers.", "quote": null, "locator": "Chulalongkorn embarked on grand tours of Europe in 1897 and 1907", "quote_verified": false}]}, {"theme": "Institutional modernization as a sovereignty defense", "insights": [{"claim": "Chulalongkorn built a Western-recognized legal system advised by Belgian jurist Gustave Rolin-Jaequemyns, deliberately choosing a Belgian because Belgium's legal tradition was adjacent to British and French systems but Belgium itself was not a colonial rival -- this legal modernization was the explicit lever used to argue for abolishing British and French extraterritorial privileges.", "speaker": "WorksInProgMag", "type": "framework", "entities": ["Chulalongkorn", "Gustave Rolin-Jaequemyns", "Belgium"], "conviction": "high", "so_what": "A precise example of neutral third-party expertise being used deliberately to build institutional legitimacy without over-indexing to any single rival power's interests -- a template for small-state advisory sourcing today.", "quote": "The choice of a Belgian was strategic: adjacent to British and French legal traditions but crucially not from either colonial power.", "locator": "He assembled a team of foreign advisors, most notably the Belgian jurist Gustave Rolin-Jaequemyns", "quote_verified": true}, {"claim": "Siam abolished slavery in stages -- an 1874 decree freeing children of slaves at age 21, an 1884 ban on selling ethnic minorities into slavery, the 1905 Slavery Abolition Act reforming debt bondage, and full criminalization by 1908 -- timed to align with Western post-abolition norms and resonate strongly with European and American audiences.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["Siam", "Chulalongkorn"], "conviction": "high", "so_what": "Demonstrates that aligning domestic social reform timing with the moral norms of a dominant external audience can function as a deliberate legitimacy investment, not just an internal policy choice.", "quote": null, "locator": "Perhaps most significantly for Western audiences, Chulalongkorn abolished slavery", "quote_verified": false}, {"claim": "Chulalongkorn Westernized Siam's military with German advisors and a Prussian model: command centralized under the monarch, noble levies replaced by a professional standing army, and some royals sent to the Prussian military academy.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["Chulalongkorn", "Germany", "Prussian military academy"], "conviction": "medium", "so_what": "Military centralization under the crown simultaneously reduced internal noble fragmentation and increased external deterrent credibility -- a dual-purpose reform.", "quote": null, "locator": "Chulalongkorn also Westernized the military", "quote_verified": false}, {"claim": "Siam's modernization extended into symbolic daily-life markers: adopting the Gregorian calendar, promoting the concept of siwilai ('civilized'), encouraging Western dress, and discouraging practices like betel-nut chewing that European observers deemed uncivilized.", "speaker": "WorksInProgMag", "type": "framework", "entities": ["Chulalongkorn", "siwilai"], "conviction": "medium", "so_what": "Legitimacy campaigns worked at every scale from grand treaties down to personal habits -- a reminder that soft-power signaling operates most powerfully when it is comprehensive and consistent, not just diplomatic.", "quote": null, "locator": "Religion, too, was reformed to appear more rational by Western standards", "quote_verified": false}]}, {"theme": "Strategic territorial retreat: sacrificing periphery to save the core", "insights": [{"claim": "During the 1893 Paknam incident, French gunboats forced passage up the Chao Phraya River toward Bangkok, killed three Siamese sailors, and compelled Chulalongkorn to cede Mekong-region territory and pay a three-million-franc indemnity; he deliberately surrendered the outer Lao/Khmer-majority regions where Bangkok's mandala-era authority was already weakest, in order to protect the Thai-majority Chao Phraya valley core that was the source of the kingdom's agricultural wealth and identity.", "speaker": "WorksInProgMag", "type": "causal", "entities": ["Chulalongkorn", "France", "Paknam incident", "Chao Phraya"], "conviction": "high", "so_what": "A clear model of triage under coercion: when facing an overwhelming military threat, deliberately cede the periphery to preserve the economically and culturally essential core rather than contesting every inch of territory.", "quote": "By surrendering territories where their control was already tenuous, the Siamese leadership prevented France from advancing into this core.", "locator": "Between 1893 and 1909, Siam would cede around 40 percent of its territory", "quote_verified": true}, {"claim": "Between 1893 and 1909, Siam ceded roughly 40 percent of its total territory to France and Britain -- a massive material loss that nonetheless functioned as a deliberate strategic retreat that preserved the political independence of Siam's core.", "speaker": "WorksInProgMag", "type": "data_point", "entities": ["Siam", "France", "Britain"], "conviction": "high", "so_what": "Quantifies the real cost of Siam's survival strategy -- useful context for judging how 'successful' the resistance actually was versus a romanticized reading of full sovereignty preserved intact.", "quote": null, "locator": "Between 1893 and 1909, Siam would cede around 40 percent of its territory to France and Britain", "quote_verified": false}]}, {"theme": "Long-run legacy of self-directed transformation", "insights": [{"claim": "Because Siam's transformation into a Western-style nation-state was self-directed from within rather than imposed through conquest, its resulting institutions may have been more durable than the colonially-imposed institutions of Cambodia, Vietnam, Malaysia, and Burma, which collapsed after twentieth-century decolonization and contributed to mass death in those countries.", "speaker": "WorksInProgMag", "type": "thesis", "entities": ["Siam", "Cambodia", "Vietnam", "Malaysia", "Burma"], "conviction": "medium", "so_what": "Suggests a durable general principle for state-building: institutions built and owned domestically, even under external duress, tend to outlast institutions imposed wholesale by an occupying power once that power withdraws.", "quote": "Weak institutions built by colonists fell apart after twentieth-century decolonizations, contributing to the deaths of millions of people across Cambodia, Vietnam, Malaysia, and Burma.", "locator": "Yet rather than becoming Westernized by conquest, this transformation was carefully orchestrated from within", "quote_verified": true}]}], "insight_total": 25, "top_entities": ["Siam (Thailand)", "Mongkut (Rama IV)", "Chulalongkorn (Rama V)", "Ramkhamhaeng Stele", "Britain", "France", "Burma", "Vietnam", "Sir John Bowring", "Gustave Rolin-Jaequemyns"], "source_meta": {"author": "WorksInProgMag", "word_count": 3956, "paywalled": false}}]};

// ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
