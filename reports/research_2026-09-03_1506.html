  angle: "This directly informs the AI-capex debate: if dematerialization was the dominant multi-decade trend, AI data centers are the first technology in a generation to reverse it — pulling energy demand back up after 50 years of flattening.",
  tweetA: "US per-capita energy use fell for two decades while GDP per capita rose 40%. Then AI data centers showed up and started reversing that trend almost single-handedly. That's the real story hiding in this piece — not flying cars, but the first technology in a generation pulling energy demand back up.",
  tweetB: "Young Americans travel less than half the miles per day they did 20 years ago. Physical mobility is being replaced by bandwidth. Bet on the pipes that move bits, not the ones that were supposed to move cars through the sky.",
  charts: { count: 6, hot: true, desc: "Henry Adams Curve (US per-capita energy use flattening since 1970), US GDP-per-capita vs. energy use divergence, goods-vs-services spending gap since 1970, and China's solar-vs-nuclear buildout chart" },

    { name: "David Rosenberg / Early Morning With Dave", count: 1 },
    { name: "ChinaTalk", count: 3 },
    { name: "The Founder's Corner", count: 1 },
    { name: "Salazar Slytherin / AI News", count: 6 },
    { name: "Salazar Slytherin / Crypto News", count: 2 },
    { name: "Lucky Trader / Morning Minute", count: 3 },
    { name: "Big Moves / Big Price Moves Explained", count: 4 },
    { name: "AI Supremacy", count: 1 },
    { name: "Noahpinion", count: 2 },
    { name: "All Star Charts", count: 1 },
    { name: "SixSigmaCapital", count: 1 },
    { name: "Paper Alfa", count: 1 },
    { name: "Hardfork (personal newsletter)", count: 1 },
    { name: "Compounding Quality", count: 1 },
    { name: "Multiple (Unchained Crypto, Lucky Trader, Salazar Slytherin / Crypto News)", count: 1 }
  ],
  skippedSources: [
    { name: "Prometheus Research (💬 subscriber chat: \"Macro Talk: Q&A\")", reason: "Just an announcement that a Q&A will happen tomorrow — zero analytical or original content." },
    { name: "Prometheus Research (🗓️ live-stream invite, Sep 7 with Michael Howell)", reason: "Pure calendar/event invite, no content." },
    { name: "hrmt / Alejandro Yela (🗓️ live-stream invite, Sep 3)", reason: "Pure calendar/event invite, no content." },
    { name: "Capital Wars (Global Liquidity Watch: Weekly Update)", reason: "Email body is solely \"Sorry for the errors in the table. Here is the corrected version\" — the actual table/data is not present as extractable text in the email." },
    { name: "Crypto Narratives (Best Trades of August 2026)", reason: "Promotional description of a paid trade database (fields, how it's organized) with no specific trades or analysis shown in the email body itself." }
  ]
};

let activeCat = 'all';
let activeUrg = 'all';
let activeSrc = null;

function countByCat(key) {
  if (key === 'all') return ITEMS.length;
  return ITEMS.filter(function(i){ return i.cat === key; }).length;
}
function countByUrg(key) {
  if (key === 'all') return ITEMS.length;
  return ITEMS.filter(function(i){ return i.urgency === key; }).length;
}

function renderMeta() {
  document.getElementById('header-meta').textContent =
    META.date + '  ·  ' + META.time + '  ·  ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails';
}

function renderCatFilter() {
  const el = document.getElementById('cat-filter');
  let html = '';
  html += '<button class="pill' + (activeCat === 'all' ? ' active' : '') + '" style="' + (activeCat === 'all' ? 'background:#333;' : '') + '" onclick="setCat(\'all\')">All <span class="count">' + countByCat('all') + '</span></button>';
  CATS.forEach(function(c) {
    const n = countByCat(c.key);
    if (n === 0) return;
    const isActive = activeCat === c.key;
    html += '<button class="pill' + (isActive ? ' active' : '') + '" style="' + (isActive ? 'background:' + c.color + ';' : '') + '" onclick="setCat(\'' + c.key + '\')">' + c.label + ' <span class="count">' + n + '</span></button>';
  });
  el.innerHTML = html;
}

function renderUrgFilter() {
  const el = document.getElementById('urg-filter');
  let html = '';
  html += '<button class="pill' + (activeUrg === 'all' ? ' active' : '') + '" style="' + (activeUrg === 'all' ? 'background:#333;' : '') + '" onclick="setUrg(\'all\')">All <span class="count">' + countByUrg('all') + '</span></button>';
  URGENCY.forEach(function(u) {
    const n = countByUrg(u.key);
    if (n === 0) return;
    const isActive = activeUrg === u.key;
    html += '<button class="pill' + (isActive ? ' active' : '') + '" style="' + (isActive ? 'background:#333;' : '') + '" onclick="setUrg(\'' + u.key + '\')">' + u.label + ' <span class="count">' + n + '</span></button>';
  });
  el.innerHTML = html;
}

function setCat(key) {
  activeCat = key;
  activeSrc = null;
  renderCatFilter();
  renderUrgFilter();
  renderCards(false);
}
function setUrg(key) {
  activeUrg = key;
  activeSrc = null;
  renderCatFilter();
  renderUrgFilter();
  renderCards(false);
}

function urgencyEmoji(key) {
  if (key === 'act') return '🔴';
  if (key === 'deep') return '🔵';
  return '🟡';
}

function renderCards(preserveExpanded) {
  const el = document.getElementById('cards');
  let html = '';
  ITEMS.forEach(function(item, idx) {
    const catInfo = CAT_MAP[item.cat];
    const visible =
      (activeCat === 'all' || item.cat === activeCat) &&
      (activeUrg === 'all' || item.urgency === activeUrg) &&
      (activeSrc === null || item.source.indexOf(activeSrc) !== -1);
    const expand = activeSrc !== null && item.source.indexOf(activeSrc) !== -1;
    let chartFlag = '';
    if (item.charts.hot) chartFlag = '🔥';
    else if (item.charts.count > 0) chartFlag = '📊';

    html += '<div class="card' + (expand ? ' expanded' : '') + (visible ? '' : ' hidden-card') + '" data-id="' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">' + String(idx + 1).padStart(2, '0') + '</span>';
    html += '<span class="urgency-emoji">' + urgencyEmoji(item.urgency) + '</span>';
    html += '<span class="badge" style="background:' + catInfo.color + '">' + item.source + '</span>';
    html += '<span class="cat-tag">' + catInfo.label + '</span>';
    if (chartFlag) html += '<span class="chart-flag">' + chartFlag + '</span>';
    html += '<span class="card-title">' + item.title + '</span>';
    html += '</div>';

    html += '<div class="card-body">';
    html += '<div class="section-label">The Idea</div>';
    html += '<div class="idea-text">' + item.idea + '</div>';
    html += '<div class="section-label">My Angle</div>';
    html += '<div class="angle-box" style="border-left:2px solid ' + catInfo.color + '; background:' + catInfo.color + '10;">' + item.angle + '</div>';

    html += '<div class="tweets-row">';
    html += '<div class="tweet-box"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet-box"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';

    if (item.charts.count > 0 || item.charts.desc) {
      html += '<div class="charts-box' + (item.charts.hot ? ' hot' : '') + '">';
      if (item.charts.hot) html += '<strong>🔥 CHART WORTH SAVING</strong><br>';
      if (item.charts.count > 0) html += item.charts.count + ' chart(s): ';
      html += item.charts.desc;
      html += '</div>';
    }

    html += '<a class="read-link" href="' + item.link + '" target="_blank">↗ Read full article</a>';
    html += '</div>'; // card-body
    html += '</div>'; // card
  });
  el.innerHTML = html;
}

function toggleCard(id) {
  const card = document.querySelector('.card[data-id="' + id + '"]');
  if (card) card.classList.toggle('expanded');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function filterBySrc(name) {
  activeCat = 'all';
  activeUrg = 'all';
  activeSrc = name;
  renderCatFilter();
  renderUrgFilter();
  renderCards(true);
  document.getElementById('cards').scrollIntoView({ behavior: 'smooth' });
}

function renderReport() {
  const el = document.getElementById('report-body');
  let html = '';
  html += '<div>Window: <strong>' + META.windowStart + '</strong> → <strong>' + META.windowEnd + '</strong>. Emails outside this window were not processed.</div>';
  html += '<div>' + META.emailsRead + ' of ' + META.emailsInWindow + ' emails in window read in full. ' + META.itemsExtracted + ' items extracted.</div>';

  html += '<div class="report-section-title">Included sources</div>';
  META.includedSources.forEach(function(s) {
    html += '<div><span class="src-link" onclick="filterBySrc(\'' + s.name.replace(/'/g, "\\'") + '\')">' + s.name + '</span> — ' + s.count + ' item(s)</div>';
  });

  html += '<div class="report-section-title">Skipped sources</div>';
  if (META.skippedSources.length === 0) {
    html += '<div>None — every email in the window contained extractable content.</div>';
  } else {
    META.skippedSources.forEach(function(s) {
      html += '<div>' + s.name + ' — ' + s.reason + '</div>';
    });
  }

  html += '<div class="report-section-title">Totals</div>';
  html += '<div>' + META.itemsExtracted + ' items · ' + META.includedSources.length + ' sources · ' + ITEMS.filter(function(i){return i.urgency==='act';}).length + ' Act Now · ' + ITEMS.filter(function(i){return i.urgency==='deep';}).length + ' Deep · ' + ITEMS.filter(function(i){return i.urgency==='watch';}).length + ' Watch</div>';

  el.innerHTML = html;
}

document.getElementById('report-toggle').addEventListener('click', function() {
  const body = document.getElementById('report-body');
  body.classList.toggle('open');
});

renderMeta();
renderCatFilter();
renderUrgFilter();
renderCards(false);
renderReport();
</script>
</body>
