<!DOCTYPE html>

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-10-11T17:21:15Z", "date": "2026-10-11 17:21 UTC", "input_stats": {"total_tweets": 147, "unique_authors": 58, "tweets_with_images": 40, "after_noise_filter": 81}, "summary": "**Geopolitics/Energy:** Trump announced a Russia-Ukraine **energy truce** that Zelenskiy said was news to him. @biancoresearch notes the same thing happened **Sept 14**, with energy facilities hit hours later. @qthomp frames the wars as reflexive, with high commodity prices funding Russia. @JavierBlas says the IEA's Birol is pushing for **more diesel reserve releases** ahead of an **Oct 15** meeting.\n\n**AI capex debate:** @BobEUnlimited says the Sequoia **$600bn question is now $3tn** while revenue is up only ~**$100bn**, and that the AI boom is turning from parabolic to linear. @Evan_ss6 counters that usefulness is power-law and adoption takes **5-10 years**. @Rewkang says Nvidia needs frontier open-source models.\n\n**Macro/Politics:** **US CPI is Wednesday Oct 14**. @Swedish_uranium flags gold ~**$4,194** and silver ~**$60.77** with rate-hike risk in play. @hooeem argues a Democratic House (**~92%** per prediction markets) is bullish via gridlock, and @qthomp cites the 45% approval midterm rule.\n\n**Crypto:** A **Ledger supply-chain compromise** is driving a trust debate; @lopp warns against swapping one single point of failure for another. @stacy_muur flags a 40x BTC short ($16.35M, liq ~**$82.7k**), and Blur saw ~half its loan book in liquidation. @sjdedic and @zeroxkyle push 'revenue meta' (Hyperliquid, Ethena, Collector Crypt); @0xfoobar says Papertrade nears **$1T** volume.\n\n**Notable:** @ZeeContrarian1 published unusually candid portfolio details (**~120% long**, hedged, with BTDR the loser). @AviFelman's Istanbul thread and @zriboua's civilizational-crisis piece were the main society debates.", "sections": {"A_events": [{"cluster": "Trump's 'Energy Truce' Announcement — Russia/Ukraine Blindsided, IEA Eyes Diesel Reserves", "category": ["geopolitics", "energy"], "items": [{"author": "JavierBlas", "summary": "BREAKING: Trump claims Russia and Ukraine both agreed to an 'energy truce'. Blas notes it is the second such announcement, and this one follows a Russia-US 'diesel on diesel' exchange.", "tweet_url": "https://x.com/JavierBlas/status/2109292434819830047", "images": ["https://pbs.twimg.com/media/HUW2MYVWwAE9ExY.png"], "type": "tweet"}, {"author": "biancoresearch", "summary": "Skeptical: a month ago (Sept 14) Trump announced a ceasefire that neither side knew about, and energy facilities were hit hours later. Quotes Axios: Zelenskiy says the announcement was news to him, and Ukraine will agree if Russia does.", "tweet_url": "https://x.com/biancoresearch/status/2109305891195339069", "images": ["https://pbs.twimg.com/media/HUXB7DfW4AARJm8.png"], "type": "tweet"}, {"author": "biancoresearch", "summary": "Follow-up on a Ukrainian readout (Zelenskiy spoke with Carney, Stubb and Rutte about the ceasefire, 'awaiting details from the American side'): points out that Trump did not talk to Zelenskiy beforehand.", "tweet_url": "https://x.com/biancoresearch/status/2109308560647823740", "images": [], "type": "tweet"}, {"author": "qthomp", "summary": "Says Trump's plea to Russia confirms his earlier thesis that the wars are reflexive. The US won't let Iran control the Strait of Hormuz, which lifts commodity prices. That supports Russia's economy and its war effort, so Iran's fight with the US helps Russia and Russia's fight in Ukraine helps Iran. Links his firm's report.", "tweet_url": "https://x.com/qthomp/status/2109274317313712581", "images": [], "type": "tweet"}, {"author": "AndreasSteno", "summary": "Argues there is no grand plan on Iran or Russia: Trump decides on the fly based on what suits him and the US at the moment. Fits the pattern of ad-hoc announcements.", "tweet_url": "https://x.com/AndreasSteno/status/2109236502374781295", "images": [], "type": "tweet"}, {"author": "JavierBlas", "summary": "Ahead of an Oct 15 meeting, IEA head Birol is urging members to weigh further diesel releases from strategic petroleum reserves. Diesel is the tight spot.", "tweet_url": "https://x.com/JavierBlas/status/2109301818559787019", "images": ["https://pbs.twimg.com/media/HUW-x2gXQAA4qis.png"], "type": "tweet"}, {"author": "AndreasSteno", "summary": "Pushes back on those 'cheering on' a recession from energy: it would take much higher energy prices to tip the economy over, because the economy is much less energy-sensitive than it used to be.", "tweet_url": "https://x.com/AndreasSteno/status/2109299929847923062", "images": [], "type": "tweet"}]}, {"cluster": "Ledger Supply-Chain Compromise — Self-Custody Trust Debate", "category": ["crypto", "tech"], "items": [{"author": "beaniemaxi", "summary": "Would bin any Ledger, even one bought from Amazon fulfilled by Amazon, and says to assume the entire supply chain is compromised. Notes Ledger is 'completely silent'.", "tweet_url": "https://x.com/beaniemaxi/status/2109310276898070726", "images": [], "type": "tweet"}, {"author": "beaniemaxi", "summary": "In a thread replying to @GivnerAriel, argues Amazon FBA could be a vector. Boxes of hardware wallets are handled like any other inventory, so a swapped box would go unnoticed. Compares it to the Mossad pager operation.", "tweet_url": "https://x.com/beaniemaxi/status/2109291286121324894", "images": [], "type": "thread"}, {"author": "lopp", "summary": "After every major Bitcoin-industry security failure the reflex is 'stop trusting X, move to Y', which just swaps one single point of failure for another. In replies, says supply-chain attackers would simply ship install guides without the photo check, and that people neglect security until it's too late. Points to Casa's wealth-security protocol as architecture guidance for self-custody.", "tweet_url": "https://x.com/lopp/status/2109278083115012145", "images": [], "type": "thread"}]}, {"cluster": "Is AI Capex Justified? Revenue Gap vs 'Power-Law' Adoption", "category": ["AI", "macro"], "items": [{"author": "BobEUnlimited", "summary": "Thread on his blog: the Sequoia '$600bn question' from two years ago is now a '$3tn question', while actual AI revenue has risen only a little over $100bn. The forward need has far outgrown reality.", "tweet_url": "https://x.com/BobEUnlimited/status/2109316847589872080", "images": ["https://pbs.twimg.com/media/HUWQOQgW4AAQFxT.jpg"], "type": "thread"}, {"author": "BobEUnlimited", "summary": "Semis and hyperscalers cite plenty of AI demand but never say who pays. His math: meeting the expectations would require all non-tech companies to bet their entire free cash flow on AI by 2030. Replying to @Evan_ss6, says financing the capex is not the issue; what matters is which end user pays enough revenue to justify it. Also finds it silly to be certain this is the greatest technology ever while it's invisible in macro productivity stats.", "tweet_url": "https://x.com/BobEUnlimited/status/2109271549601612236", "images": ["https://pbs.twimg.com/media/HUQ8MkhXMAAwydd.png"], "type": "thread"}, {"author": "BobEUnlimited", "summary": "This week's free post: the AI boom is shifting from parabolic to linear growth ('the OpenAI and Anthropic S-curve') and most investors are unprepared.", "tweet_url": "https://x.com/BobEUnlimited/status/2109226250199781746", "images": ["https://pbs.twimg.com/media/HUQ62FYWsAAPCe5.png"], "type": "thread"}, {"author": "Evan_ss6", "summary": "Counter to BobEUnlimited: doubting superintelligence is worth the investment is 'silly', never mind the race for American hegemony. Usefulness is power-law, far better for top-1% IQs, and large corporations adapt slowly. Check back in 5-10 years.", "tweet_url": "https://x.com/Evan_ss6/status/2109276194185384431", "images": ["https://pbs.twimg.com/media/HUWng5GWwAAgZjM.jpg"], "type": "thread"}, {"author": "jvisserlabs", "summary": "Announces a video on 'climbing the AI Wall of Worry' against the constant 'AI is a bubble' narrative; says things are accelerating.", "tweet_url": "https://x.com/jvisserlabs/status/2109260225622446388", "images": ["https://pbs.twimg.com/media/HUQ4e6hWEAAiOkX.jpg"], "type": "tweet"}, {"author": "zeroxkyle", "summary": "Urges public-market investors to talk to Americans living inside the AI boom (he spoke with @0xZergs). From Singapore he only sees headlines. Quotes a post saying 'AI gets 2x better every quarter' may now be an understatement.", "tweet_url": "https://x.com/zeroxkyle/status/2109236114066456588", "images": [], "type": "tweet"}, {"author": "PeterDiamandis", "summary": "Some AI services are priced below cost, so today's prices and limits aren't guaranteed. Use the window to build skills; hopeful costs collapse as intelligence gets cheaper to diffuse.", "tweet_url": "https://x.com/PeterDiamandis/status/2109245267069260287", "images": [], "type": "tweet"}]}, {"cluster": "Nvidia, Open-Weight Models and the Jensen Dwarkesh Episode", "category": ["AI", "tech"], "items": [{"author": "Rewkang", "summary": "After the Jensen Huang podcast episode: dominance of closed-source models is an existential threat to Nvidia. It's game-theoretically optimal for Nvidia to build frontier open-source models optimized for its own hardware; same logic for physical-AI models, where deployments on owned hardware are the moat.", "tweet_url": "https://x.com/Rewkang/status/2109330657948360896", "images": ["https://pbs.twimg.com/media/HUXYjwoWIAASjUe.jpg"], "type": "thread"}, {"author": "GavinSBaker", "summary": "Sarcastic reply to @OnodaCapital: 'There won't be anyone to fund a $100 billion open-weight training run. Oh wait.' Implies Nvidia could fund it. Separately says he's bullish on both names in a debate but expects them to lose share.", "tweet_url": "https://x.com/GavinSBaker/status/2109289376144576534", "images": ["https://pbs.twimg.com/media/HUWzgTnWwAAi0lD.jpg"], "type": "tweet"}, {"author": "dylan522p", "summary": "Notes sinesses. He says he pitched the pre-seed to dozens of VCs in early 2024 and all passed; the founder funded it himself and now earns that round's size in revenue every day.", "tweet_url": "https://x.com/sjdedic/status/2109226819945685499", "images": ["https://pbs.twimg.com/media/HUV4K-uXUAAH0Ek.png"], "type": "tweet"}, {"author": "sjdedic", "summary": "$AERO is 10 days from its biggest upgrade and 2.4x from its ATH.", "tweet_url": "https://x.com/sjdedic/status/2109286964616970544", "images": ["https://pbs.twimg.com/media/HUWxUGGXIAAKHu4.jpg"], "type": "tweet"}, {"author": "zeroxkyle", "summary": "Your only job: find businesses with non-cyclical, probably non-crypto-native revenue and hockey-stick growth; only ~3 verticals qualify. Quotes a 'Revenue Meta' post naming Hyperliquid/Trade.xyz and Ethena/StablecoinX.", "tweet_url": "https://x.com/zeroxkyle/status/2109245514416025722", "images": [], "type": "tweet"}, {"author": "zeroxkyle", "summary": "Calls it absurd that you can get exposure to an inference provider (VVV) at a $1bn valuation and says it will go to trillions.", "tweet_url": "https://x.com/zeroxkyle/status/2109245083979821335", "images": [], "type": "tweet"}, {"author": "Zeneca", "summary": "Biggest takeaway from the Jez interview: the poker 'VPIP' analogy. Nearly everyone is better off with lower VPIP, and the same is true for trading: fewer, better bets.", "tweet_url": "https://x.com/Zeneca/status/2109202896051179826", "images": [], "type": "tweet"}, {"author": "0xJeff", "summary": "After Hour EP.76: the quantum threat is back (some chains better prepared), Citrini released a 15-token 'Long Tokenization' basket, and other opportunities. Quoted data: onchain inference hit ATHs, with dphnAI's POD at a record after an Upbit listing and AskSurplus at ~175B tokens/day.", "tweet_url": "https://x.com/0xJeff/status/2109177777513791991", "images": [], "type": "thread"}, {"author": "0xJeff", "summary": "Calls dphnAI possibly one of the fastest inference providers ood leaves LA.", "tweet_url": "https://x.com/garrytan/status/2109294554038079703", "images": [], "type": "tweet"}, {"author": "udiWertheimer", "summary": "Defends an app that lets you modify your own copy of a Steam game and sideload it via Xcode: only Steam credentials are used, Apple credentials never touch the app, and it uses official developer flows.", "tweet_url": "https://x.com/udiWertheimer/status/2109312183821578572", "images": [], "type": "tweet"}, {"author": "stacy_muur", "summary": "Five-step AEO (answer-engine optimization) playbook with stats: ~90% of third-party AI citations come from listicles/reviews with 80% of cited brands in the top 3; 85% of brand mentions come from third-party sources; lists/tables appear in ~80% of ChatGPT-cited pages versus 29% of Google top results; clean H1-H3 hierarchy gives 2.8x citation odds; FAQs +40%; pages updated within 3 months are 3x likelier to be cited.", "tweet_url": "https://x.com/stacy_muur/status/2109199328824934911", "images": ["https://pbs.twimg.com/media/HUVhnLUaUAIpAxo.jpg"], "type": "thread"}, {"author": "ZeeContrarian1", "summary": "Explains why he posts returns: writing eloquently and making money are different skills, and he suspects many big accounts would have underperformed the market over ten years. His own account takes much more risk than client accounts (e.g., he'd never put 49% in SNAP, 50% in ZIM or 40% in WGS for clients); admits three 10% drawdowns.", "tweet_url": "https://x.com/ZeeContrarian1/status/2109168339259904223", "images": [], "type": "thread"}, {"author": "ZeeContrarian1", "summary": "Candid on results: no loss on IONS but sold too early; significant loss on BTDR. Stopped covering very small caps because his posts move prices and threaten his integrity.", "tweet_url": "https://x.com/ZeeContrarian1/status/2109177482993688871", "images": [], "type": "thread"}, {"author": "0xQuit", "summary": "Added a 'will I mint' simulator to a site: enter share of active wallets and share wanting function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
