<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-10-04T17:21:05Z", "input_stats": {"total_tweets": 149, "unique_authors": 58, "tweets_with_images": 37, "after_noise_filter": 64}, "summary": "**Iran/Hormuz:** The war premium is now in logistics — **Javier Blas** shows VLCC Gulf-to-Far-East rates at **~$1.3M/day** (vs <$50k pre-war), >25% of delivered crude cost; **BobEUnlimited** says ship-to-ship Hormuz transfers add a **$30-40/bbl** surcharge. Saudi-backed Yemeni forces launched an offensive on the Houthis.\n\n**Macro/Markets:** Weak Friday payrolls cut Fed-hike odds but gold/silver stayed heavy on elevated yields; **jvisserlabs** notes Q3 S&P EPS **+29.5%** with record positive guidance and NDX at highs, while **spotgamma** sees a sleepy SPX straddle ahead of PMI, FOMC minutes (Wed) and claims. **qthomp** thinks the 'supported into midterms' trade is running out of time; **biancoresearch** says Bessent's bond-market bluff got called.\n\n**Brazil:** **Geiger_Capital** maps the first-round vote: Lula's margin decides whether $EWZ is red or limit up.\n\n**AI:** A US 'Super Intelligence Force' was announced (**cryptopunk7213**: no frontier lab included, possible step toward nationalization). **zeroxkyle** vs **nicbstme** is the day's debate — 'good enough AI, no one pays' vs 'it'll feel as normal as card payments in 10 years'; **Delphi** flags AI-driven growth as bearish for the debasement trade.\n\n**Crypto:** BTC holding **$82k** (ColdBloodShill eyes six figures); **cointradernik** sees OTHERS breaking to YTD highs with an alt rotation through October. Robinhood Chain strategy, PUMP/ZEC/launchpad fatigue, the Arbitrum freeze precedent and Greenfield's Swiss complaint against the Safe Foundation drive the narrative flow.\n\n**Notable:** **zriboua** flags China's record bank closures (3,139 entities, -23% in 4 years); **buccocapital** ties AI to Gordon's inequality-vs-growth thesis; Trump's $5k-check pledge is read as 'stupid but bullish'.", "sections": {"A_events": [{"cluster": "Iran-Hormuz War — Freight, Surcharges and Yemen Escalation", "category": ["energy", "geopolitics"], "items": [{"author": "JavierBlas", "summary": "Chart of the day: the cost of chartering a supertanker from the Persian Gulf to the Far East has risen further to ~$1.3M per day, versus <$50k/day before the war started and ~$1.1M when he first published the chart in September. Shipbroker Poten & Partners estimates freight is now >25% of the cost of a barrel at the refinery gate, vs ~3% pre-war.", "tweet_url": "https://x.com/JavierBlas/status/2106659930535293294", "images": ["https://pbs.twimg.com/media/HTxbpcQWEAAdIKT.png"], "type": "thread", "created_at": "2026-10-04T08:17:21.000Z"}, {"author": "BobEUnlimited", "summary": "Following up on MacroTalk: the crude market has 'solved' much of the supply problem via high surcharges. Surging Hormuz flows via high-risk ship-to-ship transfers add a $30-40/bbl surcharge on every incremental barrel — volume reaches the market, but at a steep price. Complements Blas's freight chart: the war premium now sits in logistics, not just the crude price.", "tweet_url": "https://x.com/BobEUnlimited/status/2106689535107080346", "images": [], "type": "tweet", "created_at": "2026-10-04T10:15:00.000Z"}, {"author": "JavierBlas", "summary": "Saudi-backed Yemeni forces launched a full-scale military operation to retake all Houthi-held areas after weeks of escalation between the Iran-backed group and Saudi Arabia (Bloomberg).", "tweet_url": "https://x.com/JavierBlas/status/2106770194060189828", "images": [], "type": "tweet", "created_at": "2026-10-04T15:35:30.000Z"}, {"author": "zriboua", "summary": "Blunt read on Iran's behaviour: 'safe to assume the IRGC simply has no idea what it's doing.'", "tweet_url": "https://x.com/zriboua/status/2106785052109807888", "images": [], "type": "tweet", "created_at": "2026-10-04T16:34:33.000Z"}, {"author": "Swedish_uranium", "summary": "Weekend metals pulse flags the continued Hormuz standoff as an energy-inflation watch item, alongside weak Friday payrolls and elevated bond yields (see macro cluster).", "tweet_url": "https://x.com/Swedish_uranium/status/2106790184050102563", "images": [], "type": "tweet", "created_at": "2026-10-04T16:54:56.000Z"}]}, {"cluster": "Macro Setup Into Earnings Season — Rates, Fed Minutes, Midterms", "category": ["macro", "positioning"], "items": [{"author": "jvisserlabs", "summary": "Heading into earnings with sentiment fixated on rates, oil and breadth, yet Q3 S&P EPS growth is estimated at 29.5% YoY and the number of SPX companies issuing positive guidance is the highest since FactSet began tracking in 2006. >55% of SPX is now the digital economy (tech plus non-tech Mag7); NDX and equal-weight tech made new all-time highs last week. Strategists still stuck in the 'broadening out' trade hoping for a crash — 'follow the signal, avoid the noise.'", "tweet_url": "https://x.com/jvisserlabs/status/2106709112180375695", "images": ["https://pbs.twimg.com/media/HTyG0jOXUAAFM0Q.jpg"], "type": "tweet", "created_at": "2026-10-04T11:32:47.000Z"}, {"author": "spotgamma", "summary": "Despite the hand-wringing on rates, the weekly SPX straddle remains very sleepy. Calendar: PMI Monday, FOMC minutes Wednesday, jobless claims Thursday.", "tweet_url": "https://x.com/spotgamma/status/2106757463169184039", "images": ["https://pbs.twimg.com/media/HTy0vnoWMAAkSmF.jpg"], "type": "tweet", "created_at": "2026-10-04T14:44:55.000Z"}, {"author": "Swedish_uranium", "summary": "Friday's weak US payrolls cut expectations of another Fed hike, but precious metals stayed under pressure and the jobs bounce in gold faded; Treasury yields remain the key obstacle. Week ahead: ISM Services Monday, Fed minutes Wednesday, consumer sentiment/inflation expectations Friday. Also: Amazon–Constellation 20-year deal (+190 MW at Calvert Cliffs, online 2030-32, >$3B); Chile August copper output -12.8% YoY, Shanghai inventories lowest since Jan 2024, Escondida strike risk; China reopens Oct 8.", "tweet_url": "https://x.com/Swedish_uranium/status/2106790184050102563", "images": [], "type": "tweet", "created_at": "2026-10-04T16:54:56.000Z"}, {"author": "biancoresearch", "summary": "Quoting Bessent ('I can't control the bond market... I am the house means I have superior information'): 'His bluff got called' — a read that the Treasury secretary's bond-market jawboning has lost credibility.", "tweet_url": "https://x.com/biancoresearch/status/2106727078821605828", "images": [], "type": "tweet", "created_at": "2026-10-04T12:44:11.000Z"}, {"author": "qthomp", "summary": "Consensus is that markets stay supported into midterms; he thinks that view's shot clock is running out. After Nov 3 Trump starts his lame-duck last two years with a divided Congress — normally good for markets, but he wonders whether that holds after the most market-friendly administration ever.", "tweet_url": "https://x.com/qthomp/status/2106722251055780329", "images": [], "type": "tweet", "created_at": "2026-10-04T12:25:00.000Z"}, {"author": "sjdedic", "summary": "Reacting to Trump's pledge of $5,000 checks to all adults if Republicans win both chambers: ~250M adults means $1.25T. 'Stupid, but bullish' — doubts it passes, but it's the kind of stupid that is why Bitcoin exists, and would be a decent market stimulus as in Covid.", "tweet_url": "https://x.com/sjdedic/status/2106648652064137528", "images": [], "type": "tweet", "created_at": "2026-10-04T07:32:32.000Z"}]}, {"cluster": "Brazil First-Round Election — Lula Margin as the Market Signal", "category": ["geopolitics", "EM", "positioning"], "items": [{"author": "Geiger_Capital", "summary": "Scenario map for the vote (polls close 4pm ET; no one expected to clear 50%): Lula +5% or more → clear runoff favourite for Oct 25, Brazilian stocks red Monday; Lula +2-4% → coin-flip runoff; Lula +1-2% → Bolsonaro runoff favourite, stocks green at open; Bolsonaro leads (as with Abelardo in Colombia) → equities limit up. $EWZ.", "tweet_url": "https://x.com/Geiger_Capital/status/2106756470519837062", "images": [], "type": "tweet", "created_at": "2026-10-04T14:40:58.000Z"}, {"author": "Geiger_Capital", "summary": "Follow-up quote: a Bolsonaro win would pivot Latin America's largest economy from China toward the US — 'The Golden Age of Latin America.'", "tweet_url": "https://x.com/Geiger_Capital/status/2106761083507912868", "images": [], "type": "tweet", "created_at": "2026-10-04T14:59:18.000Z"}]}, {"cluster": "US Government 'Super Intelligence Force' Announcement", "category": ["AI", "regulation", "geopolitics"], "items": [{"author": "cryptopunk7213", "summary": "Reacting to the announced Super Intelligence Force (SIF), tasked with coordinating federal effort to keep the US leading in superintelligence: notes the conspicuous absence of any leading AI research lab, and that with Jay leading it, national security (esp. vs China) is clearly priority #1. Sees it as plausibly a step toward nationalization of the labs 'if they get out of hand.'", "tweet_url": "https://x.com/cryptopunk7213/status/2106754548433850729", "images": ["https://pbs.twimg.com/media/HTyyGMiWEAADCxJ.jpg"], "type": "tweet", "created_at": "2026-10-04T14:33:20.000Z"}]}, {"cluster": "Arbitrum Freeze Fallout and Ethereum's 2030 Roadmap", "category": ["crypto", "regulation"], "items": [{"author": "laurashin", "summary": "After Arbitrum's freeze of stolen funds, @kain says 'the cat is out of the bag' — most Layer 2s can freeze stolen funds if they want to.", "tweet_url": "https://x.com/laurashin/status/2106765607505195027", "images": [], "type": "tweet", "created_at": "2026-10-04T15:17:17.000Z"}, {"author": "laurashin", "summary": "Uneasy Money episode: @kain calls Vitalik's 2030 roadmap the most bullish thing he's read about Ethereum in a long time, saying AI is what makes it achievable; Tay, Austin Griffith and Pablo Sabbatella weigh in.", "tweet_url": "https://x.com/laurashin/status/2106795735471829278", "images": [], "type": "tweet", "created_at": "2026-10-04T17:17:00.000Z"}, {"author": "VitalikButerin", "summary": "Vitalik (reply): zkAPI runs on Ethereum and payments are made in ETH — a small data point on the privacy-preserving API-payment design.", "tweet_url": "https://x.com/VitalikButerin/status/2106737532142862777", "images": [], "type": "tweet", "created_at": "2026-10-04T13:25:43.000Z"}]}, {"cluster": "Safe Foundation Supervisory Complaint", "category": ["crypto", "regulation"], "items": [{"author": "mhonkasalo", "summary": "Greenfield Capital published an open letter on the Safe community forum explaining a supervisory complaint filed with the Swiss Federal Supervisory Authority for Foundations (ESA) about the Safe Ecosystem Foundation; Honkasalo shares it with a screenshot.", "tweet_url": "https://x.com/mhonkasalo/status/2106795500875727316", "images": ["https://pbs.twimg.com/media/HTzXV1XXcAEHf45.jpg"], "type": "tweet", "created_at": "2026-10-04T17:16:04.000Z"}, {"author": "sjdedic", "summary": "Backing Greenfield (a VC he says actually works for its portcos), he frames the move as part of crypto's transition from idealistic experiments to a grown-up industry with the world's attention — time to replace 'lazy, delusional teams' that overfunded with ones who execute.", "tweet_url": "https://x.com/sjdedic/status/2106757286022594645", "images": [], "type": "tweet", "created_at": "2026-10-04T14:44:13.000Z"}]}, {"cluster": "Robinhood Chain Playbook and Launchpad Fatigue", "category": ["crypto", "tech"], "items": [{"author": "Fiskantes", "summary": "Lays out the Robinhood chain playbook: (1) simple EVM chain, max optionality, lowest effort; (2) vamp the biggest narratives — RWA tokenisation, perps, agentic finance; (3) attract crypto degens to expand TAM; (4) do NOT let existing RH users on-chain (they would leak value out of RH); (5) impeccable PR aimed at crypto natives. 'Vlad is here to drive value to HOOD shareholders.' A follow-up explains #4: existing users already make money for RH inside the app, memecoins are an EV-negative casino, so on-chain natives bridging from Ethereum/Solana are the net-new users.", "tweet_url": ["https://x.com/Fiskantes/status/2106606182068883480", "https://x.com/Fiskantes/status/2106716088931353017"], "images": [], "type": "thread", "created_at": "2026-10-04T04:43:47.000Z"}, {"author": "zeroxkyle", "summary": "Defends his thesis on a Robinhood Chain token he calls the most asymmetric on the chain (net-new vertical), mocking replies that only say 'this other coin does the same thing' — notes that coin ripped from $15M to $110M.", "tweet_url": "https://x.com/zeroxkyle/status/2106670121083400499", "images": ["https://pbs.twimg.com/media/HTxkraaaYAAvWEo.jpg"], "type": "tweet", "created_at": "2026-10-04T08:57:51.000Z"}, {"author": "MoonOverlord", "summary": "Joking that we must be 20+ launchpads deep, quoting 'add a billion to PUMP's market cap for every failed launchpad attempt.'", "tweet_url": "https://x.com/MoonOverlord/status/2106754289863700649", "images": [], "type": "tweet", "created_at": "2026-10-04T14:32:18.000Z"}, {"author": "MoonOverlord", "summary": "'Everyone launches their own exchange but the play was just buy BNB and log off for a few years.'", "tweet_url": "https://x.com/MoonOverlord/status/2106758640052908531", "images": [], "type": "tweet", "created_at": "2026-10-04T14:49:36.000Z"}]}], "B_insights": [{"author": "zeroxkyle", "summary": "Long argument that AI maxis in 2026 resemble blockchain maxis in 2021 — both showing 'only 0.1% use it' charts. Key point: unlike niche tech, the whole world already knows AI; low paid usage means people don't deem it worth paying for (the free version is good enough, like Google search). He splits the debate into two camps: frontier gurus chasing 'machine god' (IQ 200→1000) who think nobody uses AI, vs ground-level builders seeing real adoption in cheap consumer apps (cites Muse downloads vs ChatGPT at launch), concluding we don't need as much compute as assumed. 99% of tasks (emails, flights) are menial and non-recurring so the business model is hard; AI is mostly used for video, which he thinks will be the most successful AI vertical (no good long yet). Expects AI to settle as a useful tool, with frontier models for the ~10% (research, PhD) and cheap models for the 90%, costs falling sharply. Responding to a 'no one uses AI' thesis.", "tweet_url": ["https://x.com/zeroxkyle/status/2106748683224232062", "https://x.com/zeroxkyle/status/2106612560053367093"], "images": [], "type": "tweet", "created_at": "2026-10-04T14:10:02.000Z"}, {"author": "nicbstme", "summary": "Counter-view on the same debate: at 32 he remembers teachers banning Wikipedia, parents forbidding credit cards online, tapping a card feeling insecure, and typed assignments seen as lazy. People refusing to connect email to a chatbot or let an agent book flights sound reasonable now but in 10 years will sound like refusing to put a card number online.", "tweet_url": "https://x.com/nicbstme/status/2106685584466923681", "images": [], "type": "tweet", "created_at": "2026-10-04T09:59:18.000Z"}, {"author": "zeroxkyle", "summary": "Skepticism on agent reliability: a task that takes a human 30 minutes is only done correctly 76% of the time by AI — 'imagine if 1/4 of your flights get booked to a different country.' Would you use it?", "tweet_url": "https://x.com/zeroxkyle/status/2106768441671925911", "images": ["https://pbs.twimg.com/media/HTy-ZABbYAEzGOv.jpg"], "type": "tweet", "created_at": "2026-10-04T15:28:33.000Z"}, {"author": "zeroxkyle", "summary": "Realised his K-shaped-economy view missed a second-order consequence: the rise of communism at the bottom of the K — says there's more to analyse at the bottom than the top. Two chart images attached.", "tweet_url": "https://x.com/zeroxkyle/status/2106766234566213984", "images": ["https://pbs.twimg.com/media/HTy8QbaawAA6RaV.png", "https://pbs.twimg.com/media/HTy8sZSakAAj7h2.png"], "type": "tweet", "created_at": "2026-10-04T15:19:46.000Z"}, {"author": "zeroxkyle", "summary": "Calls a competitor takedown 'the most Chinese business-like thing': competitor in trouble → tweet you're selling their holdings → they spiral → lend them a rope → cut the rope. (Image shows the underlying post.)", "tweet_url": "https://x.com/zeroxkyle/status/2106763562916221329", "images": ["https://pbs.twimg.com/media/HTy59lLbQAEyvyc.jpg"], "type": "tweet", "created_at": "2026-10-04T15:09:09.000Z"}, {"author": "zeroxkyle", "summary": "Sunday nostalgia on dead crypto protocols (images): you could launch a protocol, reach millions in valuation, do nothing and nothing happens to you — e.g. a Ubisoft-developed watch product whose last tweet was in 2025.", "tweet_url": "https://x.com/zeroxkyle/status/2106652214458528010", "images": ["https://pbs.twimg.com/media/HTw1pvMa8AAPAMH.jpg", "https://pbs.twimg.com/media/HTw6SwHbQAAAbp-.jpg", "https://pbs.twimg.com/media/HTw_npjbIAANCFD.jpg"], "type": "tweet", "created_at": "2026-10-04T07:46:42.000Z"}, {"author": "buccocapital", "summary": "Rereading Gordon's 'The Rise and Fall of American Growth': growth was concentrated in a unique cluster of 'Great Inventions' (1870-1970), with inequality since 1970 as a headwind. Will AI be viewed as a Great Invention? He thinks yes — but rising inequality (or attempts to fix it) could cancel it out, and it looks set to be front and center in the next election.", "tweet_url": "https://x.com/buccocapital/status/2106764423889051796", "images": ["https://pbs.twimg.com/media/HTy6-H8WIAAUIvL.jpg"], "type": "thread", "created_at": "2026-10-04T15:12:35.000Z"}, {"author": "zriboua", "summary": "On China: 'if you think this is a bad year, wait until next year.' Cites FT/Fitch — China cut its bank count by nearly a quarter, with a record 670+ closures last year (almost all rural), leaving 3,139 entities, -23% in four years to 2025; the system holds ~$64tn of assets, with sluggish credit demand, low rates, deflation and a prolonged property slowdown pressuring profits.", "tweet_url": "https://x.com/zriboua/status/2106765248019431818", "images": ["https://pbs.twimg.com/media/HTy709iWUAM9-Bv.jpg"], "type": "tweet", "created_at": "2026-10-04T15:15:51.000Z"}, {"author": "zriboua", "summary": "Morocco may soon get a new right-wing nationalist party. Politics has long been dominated by (panarabist) nationalist, socialist, communist and later Islamist parties; the PAM, which just won elections, is on the right and opposed to Islamists, so a further platform would widen choices.", "tweet_url": ["https://x.com/zriboua/status/2106793302733324634", "https://x.com/zriboua/status/2106760791001301169"], "images": ["https://pbs.twimg.com/media/HTzVPl3WAAEeEcg.jpg"], "type": "tweet", "created_at": "2026-10-04T17:07:20.000Z"}, {"author": "paulg", "summary": "Startup misconception: founders don't have one brilliant idea and then execute — more often the biggest idea comes later (cites a YC founder 15 years in still doing big new things). Believing everything hinges on the initial idea makes you quit if it fails and demands it be huge. The founder persists because he's genuinely interested in the domain.", "tweet_url": "https://x.com/paulg/status/2106769829105717318", "images": [], "type": "thread", "created_at": "2026-10-04T15:34:03.000Z"}, {"author": "paulg", "summary": "Replying to a point about AI adoption: using AI to write for you is not like using a credit card online — it's like driving everywhere and losing exercise; those who want to live well avoid that path.", "tweet_url": "https://x.com/paulg/status/2106738358710124665", "images": [], "type": "tweet", "created_at": "2026-10-04T13:29:00.000Z"}, {"author": "paulg", "summary": "'Don't own the .com? There's no such thing — 'the .com' is just the only .com you've thought of so far.' (Same author separately notes that corporate-appealing names may not appeal to customers.)", "tweet_url": ["https://x.com/paulg/status/2106663759221543263", "https://x.com/paulg/status/2106736456622305447"], "images": [], "type": "tweet", "created_at": "2026-10-04T08:32:34.000Z"}, {"author": "Evan_ss6", "summary": "Satirical essay: 'the trenches' as the Crusades of trading — KOL calls as indulgences, 95% dying to snipers/bundles, the Fourth Crusade sacking a city to cover a margin call ('every trench groupchat by hour 6').", "tweet_url": "https://x.com/Evan_ss6/status/2106773913472577817", "images": ["https://pbs.twimg.com/media/HTzDtJsWgAAzGKL.jpg"], "type": "tweet", "created_at": "2026-10-04T15:50:17.000Z"}, {"author": "dgt10011", "summary": "Warning-style post: financiers once knelt to a clay toad in Osaka before decades of ruin; today it's a silicon toad — 'every fall of reason begins with the ache for occult certainty.' Read as a jab at AI-oracle mania.", "tweet_url": "https://x.com/dgt10011/status/2106772479830266151", "images": [], "type": "tweet", "created_at": "2026-10-04T15:44:35.000Z"}, {"author": "dampedspring", "summary": "Replying to Asness's classic '10 peeves' piece (13 years old): the bond peeve is 'as solid as ever.'", "tweet_url": ["https://x.com/dampedspring/status/2106711312189534618", "https://x.com/dampedspring/status/2106716052541612475"], "images": [], "type": "tweet", "created_at": "2026-10-04T11:41:32.000Z"}, {"author": "dylan522p", "summary": "On 3D DRAM: memory companies hate process variation 'in their DNA', so getting them to do 3D DRAM will be very hard (reply to SemiAnalysis). He also points to a SemiAnalysis piece on AMD 2.0 (MI450X, chance to beat Nvidia).", "tweet_url": ["https://x.com/dylan522p/status/2106786500872646779", "https://x.com/dylan522p/status/2106614319148625968"], "images": [], "type": "tweet", "created_at": "2026-10-04T16:40:18.000Z"}, {"author": "udiWertheimer", "summary": "Says Opus 5.5 is 'the December 2025 Claude Code moment for creatives'; in a related thread he notes Claude Code projects beta compiles a task list per thread, and questions why GitHub still tracks which human told Claude to write a line of code.", "tweet_url": ["https://x.com/udiWertheimer/status/2106792219118292999", "https://x.com/udiWertheimer/status/2106742650867257478", "https://x.com/udiWertheimer/status/2106747506923356170"], "images": [], "type": "tweet", "created_at": "2026-10-04T17:03:02.000Z"}, {"author": "stacy_muur", "summary": "Surveys the 2025-26 AI go-to-market stack: Claude Code, Clay, Instantly, HeyReach, Apollo, Freckle, Ergo, Nooks, Mutiny — responding to a post arguing GTM tools reset every 2-3 years and the 2022 best-in-class stack is two waves behind.", "tweet_url": "https://x.com/stacy_muur/status/2106766795168452616", "images": [], "type": "tweet", "created_at": "2026-10-04T15:22:00.000Z"}, {"author": "0xJeff", "summary": "Onchain inference hit a new ATH last week: dphn's POD after an Upbit listing ahead of its public API/agent harness; Surplus at ~175B tokens/day; Orbio shipping features (CREDIT, agent launchpad, PT/YT on inference yield with Pendle). Speculative narratives slowing while onchain AI (inference, data, robotics) heats up.", "tweet_url": "https://x.com/0xJeff/status/2106660181358625056", "images": [], "type": "tweet", "created_at": "2026-10-04T08:18:21.000Z"}, {"author": "mert", "summary": "This cycle's progress isn't confined to one ecosystem — Solana, Zcash and NEAR are all doing unique work.", "tweet_url": "https://x.com/mert/status/2106745924672495856", "images": [], "type": "thread", "created_at": "2026-10-04T13:59:04.000Z"}, {"author": "Delphi_Digital", "summary": "Delphi podcast clip: Kevin argues AI could undercut the debasement trade — if AGI/agents/robotics let governments outgrow their debt, that's bearish for Bitcoin longer term, since growth is the only option for governments to escape massive debt spending.", "tweet_url": "https://x.com/Delphi_Digital/status/2106725163828134113", "images": [], "type": "thread", "created_at": "2026-10-04T12:36:34.000Z"}, {"author": "biancoresearch", "summary": "Rational Dissent Ep. 011 'Three Risks That Matter More Than Terminator AI': Europe's winter gas vulnerability, AI-debt and distressed corporate credit stress (Oracle, CCC), and Fed funding pressure behind the Treasury basis trade, with 'one number to watch.'", "tweet_url": "https://x.com/biancoresearch/status/2106733753825480876", "images": [], "type": "tweet", "created_at": "2026-10-04T13:10:42.000Z"}, {"author": "jvisserlabs", "summary": "Weekly video: rates and breadth are noise vs bigger shifts — consumer AI agents as the next compute-demand inflection, crypto rails needed as agents become economic actors, and the question of whether a 'Bankpocalypse' is beginning in the next AI disruption.", "tweet_url": "https://x.com/jvisserlabs/status/2106723510475276661", "images": ["https://pbs.twimg.com/media/HTqdbUrXwAABoV_.jpg"], "type": "tweet", "created_at": "2026-10-04T12:30:00.000Z"}, {"author": "Zeneca", "summary": "What changed in crypto cards in September: Gnosis Pay ended cashback and is shutting down; XPlace halved cashback; Tria lite cap raised $100→$1,000; ether.fi physical Core card now free (was $50, with conflicting help pages); Plasma One FX fee now plan-dependent. Also notes Tria's TCG gacha (up to 6% cashback) needs pull rates to judge value.", "tweet_url": ["https://x.com/Zeneca/status/2106731298278752355", "https://x.com/Zeneca/status/2106657782728622429"], "images": [], "type": "tweet", "created_at": "2026-10-04T13:00:57.000Z"}, {"author": "AndreCronjeTech", "summary": "FT (Cronje's project) thesis: unified systems give capital efficiency otherwise impossible; Total Return Swaps are the biggest tradfi primitive and FT is first to bring them onchain — price exposure with lower funding and no ADL. More systems/chains rolling out; permissionless stack to be a 0-to-1 for launchpads (xyk or customizable AMM with lending/leverage/derivatives).", "tweet_url": "https://x.com/AndreCronjeTech/status/2106706497946230962", "images": [], "type": "tweet", "created_at": "2026-10-04T11:22:24.000Z"}, {"author": "gametheorizing", "summary": "Not directly at odds with Naval: there's a single-player game (everyone can self-develop) and an adversarial game of societal impact where, without a natural head start in a category, you can't reach the frontier. Responding to Jordi Alexander's claim that only 10-15% can have a meaningful impact.", "tweet_url": "https://x.com/gametheorizing/status/2106637647250853932", "images": [], "type": "tweet", "created_at": "2026-10-04T06:48:49.000Z"}, {"author": "marcvanderchijs", "summary": "Thread on Optimus bots and abundance: Musk-aligned replier says abundance for everyone must come after a 'very difficult (potentially violent) transition period' — author pushes back asking whether Musk ever discusses that.", "tweet_url": "https://x.com/marcvanderchijs/status/2106611606130250225", "images": [], "type": "thread", "created_at": "2026-10-04T05:05:20.000Z"}, {"author": "abcampbell", "summary": "Quoting a USGS post on mapping US critical-mineral deposits: 'Now go and build mines.'", "tweet_url": "https://x.com/abcampbell/status/2106773533833711628", "images": [], "type": "tweet", "created_at": "2026-10-04T15:48:47.000Z"}, {"author": "0xQuit", "summary": "Notes 191,000+ NFTs (including 56 Bored Apes) are still available to be reclaimed from a recovery site.", "tweet_url": "https://x.com/0xQuit/status/2106723750687174771", "images": [], "type": "thread", "created_at": "2026-10-04T12:30:57.000Z"}, {"author": "patrick_oshag", "summary": "Podcast pick: Colossus's Jeremy Stern on what he's learned profiling elite founders and investors (Zuckerberg, Palmer Luckey, Josh Kushner, Neil Mehta, Scott Wu); calls him the best in the world at profiles.", "tweet_url": "https://x.com/patrick_oshag/status/2106781515006779639", "images": [], "type": "tweet", "created_at": "2026-10-04T16:20:29.000Z"}, {"author": "stonecoldpat0", "summary": "Summary and video of the Glitched Vision exhibition in Hong Kong, on seeing as agency in a world of machine vision and AI-generated news.", "tweet_url": "https://x.com/stonecoldpat0/status/2106711588652921172", "images": [], "type": "tweet", "created_at": "2026-10-04T11:42:38.000Z"}, {"author": "BillAckman", "summary": "Endorses Peter Thiel's advice: viewing the future as indefinite leads people to pick resume-building jobs that merely lead to the next job.", "tweet_url": "https://x.com/BillAckman/status/2106761727148703900", "images": [], "type": "tweet", "created_at": "2026-10-04T15:01:52.000Z"}, {"author": "RayDalio", "summary": "Dalio's principle of the day: being considerate means letting others do what they want within principles, policy and law, and putting others ahead of your own desires.", "tweet_url": "https://x.com/RayDalio/status/2106776366003949572", "images": ["https://pbs.twimg.com/media/HTgXX_vXAAAFPAW.png"], "type": "tweet", "created_at": "2026-10-04T16:00:02.000Z"}], "C_contrarian": [{"author": "zeroxkyle", "summary": "Contrarian to the AI-capex consensus: argues AI is the 'good enough' free-tier story, not a machine-god story; expects compute needs and AI SaaS to be overstated.", "tweet_url": "https://x.com/zeroxkyle/status/2106748683224232062", "images": [], "type": "tweet", "created_at": "2026-10-04T14:10:02.000Z"}, {"author": "zeroxkyle", "summary": "Reacting to a claim that AI has diminishing returns despite rising costs: 'we don't need 200 IQ to 400 IQ' — Muse and Grok bot show good enough is good enough; 'short all these random AI SaaS to zero.'", "tweet_url": "https://x.com/zeroxkyle/status/2106612560053367093", "images": [], "type": "tweet", "created_at": "2026-10-04T05:09:07.000Z"}, {"author": "Delphi_Digital", "summary": "Against the 'debasement → Bitcoin' consensus: AI-driven growth is the only way governments outgrow debt, which would be bearish for BTC long term.", "tweet_url": "https://x.com/Delphi_Digital/status/2106725163828134113", "images": [], "type": "thread", "created_at": "2026-10-04T12:36:34.000Z"}, {"author": "qthomp", "s // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
