<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-08-13T05:21:08Z", "input_stats": {"total_tweets": 202, "unique_authors": 71, "tweets_with_images": 31, "after_noise_filter": 86}, "summary": "**Ethereum:** The EF's push for zero staking yield is fracturing the ecosystem — **austincampbell** warns ETH \"should probably be at one tenth of its current value\" if the network rejects institutional money, while **DCinvestor** argues institutions need to organize and embed influence directly into R&D before a small group of ex-EF people dictates protocol direction.\n\n**Hormuz/Oil:** **JavierBlas** and **biancoresearch** both push back on claims the Strait of Hormuz is fully \"blocked\" — tanker trackers dispute 5m vs 9m b/d of non-Iranian flow, with Kpler data showing traffic sinking to just six vessels as Iran talks stall again.\n\n**AI:** Deepseek's **V4-Pro** launched at $0.87/M output tokens (94% cheaper than Kimi, near Opus-4.8 quality) per **hosseeb**; separately **buccocapital** flags Ramp's AI Index showing Anthropic pulling further ahead of OpenAI while Fable adoption stalls, and a Delphi Digital-hosted FT Partners rant argues frontier labs have \"no moat.\"\n\n**Macro:** **EconguyRosie** says core CPI ran just +1.6% annualized over the last three months vs +2.7% a year ago; **biancoresearch** flags that UWMC, America's largest mortgage lender, lost a $27.5B bet on falling rates and needed an emergency Oaktree rescue.\n\n**Crypto positioning:** **DonAlt** is buying ETH into resistance, **Bluntz_Capital** sees SOL's weekly chart at a buy zone with JTO breaking out, while **thedefivillain** tracks $TRUMP now down 98.3% from its $80B FDV peak.\n\n**Notable:** **aleabitoreddit**'s deep-dive on Coherent's earnings flags a structural supply squeeze in indium-phosphide lasers for co-packaged optics — backlog booked through 2027 — a contrarian data point inside the broader \"AI bubble\" debate.", "sections": {"A_events": [{"cluster": "Ethereum Staking Yield Fight — EF vs. Institutions", "category": ["crypto", "regulation"], "items": [{"author": "laurashin", "summary": "Previews her bitsandbips podcast (with austincampbell, perkinscr97, and Franklin Crypto's sethginns) on the EF's push for zero ETH staking yield: austincampbell says the token \"should probably be at one tenth of its current value\" if Ethereum rejects institutional money, and perkinscr97 argues the proposal is \"dead on arrival\" and would prove the Foundation has no real control over the network. Two related posts, same thread.", "tweet_url": "https://x.com/laurashin/status/2087713778054095319", "type": "thread"}, {"author": "DCinvestor", "summary": "Says staking yield would eventually be driven to zero, triggering an aggressive new push to extract MEV and leaving the network close to 100% operated by ETFs, DATs, exchanges and other institutions — solo/small stakers wouldn't survive. Separately argues institutions need to \"mobilize a lot more aggressively\" into Ethereum's R&D process now, since current EF spinouts are staffed almost entirely by ex-EF people who may need financial/governance incentives to challenge the historic \"ivory tower\" perspective; flags Joe Chalom's involvement as a signal.", "tweet_url": "https://x.com/DCinvestor/status/2087691778459947487", "type": "thread"}]}, {"cluster": "Strait of Hormuz — Oil Flow Still Disputed", "category": ["energy", "geopolitics"], "items": [{"author": "JavierBlas", "summary": "Pushes back on claims the Strait of Hormuz is fully \"blocked\": tanker trackers estimate non-Iranian flow at ~5m b/d vs the US government's ~9m b/d claim, but either way oil keeps moving through. Notes vessels that turn off AIS tracking won't show up in flow estimates that rely on that data.", "tweet_url": "https://x.com/JavierBlas/status/2087645088524452214", "type": "thread"}, {"author": "biancoresearch", "summary": "In a back-and-forth with AndreasSteno, cites Kpler tanker data showing Hormuz traffic sinking to just six vessels on Monday as Iran talks stall again, contradicting claims that flows have normalized.", "tweet_url": "https://x.com/biancoresearch/status/2087702498920280254", "type": "thread"}]}, {"cluster": "Deepseek V4-Pro — Frontier AI Price Collapse", "category": ["ai", "tech"], "items": [{"author": "hosseeb", "summary": "Deepseek's V4-Pro launched via API at $0.87/M output tokens vs Opus's $25/M — almost 30x cheaper, with benchmarks landing between Opus 4.8 and Opus 5 quality. Calls it \"incredible deflation in frontier intelligence costs\": V4-Pro is 94% cheaper than Kimi, which was itself 40% cheaper than Opus. Live on OpenRouter; weights not yet public.", "tweet_url": "https://x.com/hosseeb/status/2087591463559512353", "images": ["https://pbs.twimg.com/media/HPiccfQbYAA18GR.jpg"], "type": "thread"}, {"author": "andrewchen", "summary": "Running Deepseek V4 Flash locally on 2x DGX Sparks — reports it's fast with low time-to-first-token and ~50 tok/s, calling it the best prosumer-grade local AI setup right now.", "tweet_url": "https://x.com/andrewchen/status/2087698313172943008", "type": "thread"}]}, {"cluster": "AI Adoption & \"No Moat\" Bubble-Risk Debate", "category": ["ai", "macro"], "items": [{"author": "buccocapital", "summary": "Flags two takeaways from the Ramp AI Index: Anthropic continues pulling away from OpenAI in enterprise adoption, while Fable adoption isn't growing.", "tweet_url": "https://x.com/buccocapital/status/2087599630645170206", "images": ["https://pbs.twimg.com/media/HPijGUxXAAAAt27.jpg", "https://pbs.twimg.com/media/HPijoJOXEAAVEcU.jpg"], "type": "thread"}, {"author": "Delphi_Digital", "summary": "Hosts FT Partners CEO Steve McLaughlin's rant on frontier-lab bubble risk: anything that can be coded by 10-20 different teams with no data or network-effect moat gets competed to nothing — and if frontier labs' technology were really alpha-generating, they'd deploy it directly instead of selling access, the same logic he applies to overhyped hedge-fund-tool startups.", "tweet_url": "https://x.com/Delphi_Digital/status/2087679906901590388", "type": "thread"}]}, {"cluster": "UWMC — Mortgage Lender's Rate Bet Blows Up", "category": ["macro", "positioning"], "items": [{"author": "biancoresearch", "summary": "America's largest mortgage lender, UWMC, made a $27.5B bet that rates would fall; the bet failed, forcing a dividend suspension and an emergency rescue from Oaktree's distressed-situations desk. Bianco: \"Never take your interest rate advice from real estate people\" — they only ever want rates at 0-1%, and he'd note how that worked out for them in 2008.", "tweet_url": "https://x.com/biancoresearch/status/2087688494994923831", "type": "thread"}]}, {"cluster": "Morocco–Spain Migration Standoff Escalates", "category": ["geopolitics", "em"], "items": [{"author": "zriboua", "summary": "Morocco's Justice Minister says Rabat is considering suspending its extradition agreement with Spain over a dispute involving Moroccan minors, accusing Spain of accepting migrants Morocco works to intercept: \"If Spain announces it is willing to receive all immigrants... why do we stop them?\" Escalation follows Moroccan demands for the minors' return that have gone unresolved in bilateral talks.", "tweet_url": "https://x.com/zriboua/status/2087601788555776115", "type": "thread"}]}, {"cluster": "FinCEN Kills Beneficial-Ownership Reporting", "category": ["regulation"], "items": [{"author": "punk6529", "summary": "FinCEN issued a final rule permanently removing the requirement for US companies/persons to report beneficial ownership information, and will delete previously submitted data. 6529 notes the irony: the EU's rationale for its own disclosure rules was partly that the US forces similar disclosure — which is no longer true.", "tweet_url": "https://x.com/punk6529/status/2087604352630333547", "type": "tweet"}]}], "B_insights": [{"author": "aleabitoreddit", "summary": "Deep-dive on Coherent's (COHR) earnings: merchant CW laser suppliers for co-packaged optics (CPO) are becoming extremely important since COHR won't sell indium-phosphide lasers externally while its own DC/transceiver demand absorbs capacity — pushing buyers toward AAOI, MTSI and others for external supply, with MTSI reportedly seeing urgent customer demand despite no meaningful capacity until end-2027. COHR's backlog now extends through calendar 2027 (\"basically completely booked out\"), assembly/test isn't the bottleneck — indium-phosphide production ramp is — and management says there's been zero push-out of CPO demand, with scale-up revenue still expected H2 2027 and quarterly revenue projected to exceed $3B by end of FY2027. Numbers: $2.046B revenue (+13.3% Q/Q, +33.8% Y/Y), 40.2% non-GAAP gross margin, guiding to $2.2-2.4B next quarter. Separately notes \"bears going back into hibernation\" after strong AI earnings from NBIS to LITE, and jokes about the endless list of 3-letter optical acronyms (LPO, LRO, NPO, XPO, CPO) confusing new followers to the trade.", "tweet_url": "https://x.com/aleabitoreddit/status/2087675367595380783", "images": ["https://pbs.twimg.com/media/HPjk-y9aMAA0zbv.jpg", "https://pbs.twimg.com/media/HPjlID2bYAAviBy.jpg"], "type": "thread"}, {"author": "RaoulGMI", "summary": "Argues AI and robots are the only way out of the developed world's debt trap: every economy runs on population + productivity + debt, and when the first two stall the only lever is more debt — which is why debt-to-GDP has climbed for decades regardless of policy. AI/robots become a workforce that doesn't age, retire or need a raise, which could restart productivity growth and let GDP outgrow debt for the first time in a generation, as happened in the 1950s productivity boom that halved US debt-to-GDP. Calls this the \"Economic Singularity\" / \"Exponential Age\" — AI as the largest deflationary force in history, eventually making people feel richer via a productivity boom rather than subsidies or money-printing, though the transition won't be clean (political fights, winners/losers by sector).", "tweet_url": "https://x.com/RaoulGMI/status/2087607385128878424", "type": "thread"}, {"author": "Matt_Hougan", "summary": "Argues crypto tokens increasingly do capture value, contra the old \"tokens don't capture value\" line: Hyperliquid routes 97%+ of fees to buybacks ($2B+ so far), Pump has burned 36% of supply and locks 50% of revenue into burns, Uniswap has burned 107M UNI with its fee switch now on, Aave runs automated buybacks, and Aptos hard-capped supply while 10x'ing fees burned. Says the market hasn't fully repriced this yet, though DeFi apps have generally outperformed lately.", "tweet_url": "https://x.com/Matt_Hougan/status/2087665483969699912", "type": "thread"}, {"author": "Delphi_Digital", "summary": "Report on \"crowded trades\": distinguishes funded crowding (backed by cash flow, organic spot demand, or supply sinks that persist after momentum fades) from borrowed crowding (dependent on leverage and momentum through a thin float). Protocol growth only durably supports a token when activity creates real demand for it — e.g. fees funding buybacks or usage requiring token ownership; without that link, revenue/user growth can rise without token demand rising, and when momentum turns, recovery depends on whether those demand sources still exist.", "tweet_url": "https://x.com/Delphi_Digital/status/2087611649188339922", "images": ["https://pbs.twimg.com/media/HPivoR2WQAAsOlM.jpg"], "type": "thread"}, {"author": "dgt10011", "summary": "Argues AI-driven wealth creation is bullish for BTC long-term: when the asset-liability mismatch inevitably breaks and capital flees, Bitcoin as an \"infinite duration asset\" will be waiting. Separately flags Gen Z increasingly treating sports betting as an asset class — 52% redirect investment funds into bets, 1 in 4 include betting in long-term wealth plans.", "tweet_url": "https://x.com/dgt10011/status/2087723823118303403", "type": "thread"}, {"author": "ZeeContrarian1", "summary": "Reads STAA's earnings as net positive despite the stock trading down ~4%: revenue $93.5M, China grew 10% sequentially to $52.3M, $8.1M net income, $19.7M operating cash flow, $181M cash with no debt. Argues the print removes much of the China-collapse fear priced in, and the new Swiss factory (100% of China-bound lens manufacturing by year-end) should eliminate the US-China tariff drag. Also notes this reopens the door to a competitive sale process if Broadwood pushes for one again, given STAA's niche tech/distribution could have real strategic value; US business also strong, gaining share in a declining laser market.", "tweet_url": "https://x.com/ZeeContrarian1/status/2087641825452421380", "type": "thread"}, {"author": "nicbstme", "summary": "Argues most AI agent products are converging on the same architecture: connect email/calendar/docs/Slack/cloud, extract context into memory files, and run an orchestrator that learns and reproduces the user's patterns. The frontier isn't chat anymore but proactive background agents that act without being prompted. Underlying tech is conceptually simple (context + tools + memory + cron/triggers); the real competition is who can deliver the best memory and actions at the lowest inference cost — cheap to build a $100/user version, hard to get 95% of that quality for $5.", "tweet_url": "https://x.com/nicbstme/status/2087763700031853001", "type": "tweet"}, {"author": "cryptopunk7213", "summary": "Says Elon is now shipping a new xAI model every 3-4 weeks with the most GPUs secured of anyone and cheap off-earth energy coming, calling the comeback \"biblical\"; pushes back on claims Grok is \"nowhere near\" competitive and argues Google's TPUs aren't equivalent to Nvidia's GB200/300 or Vera Rubin chips. Separately argues Grok's bot's rave reviews show people wanted an agent that gets things done rather than the most intelligent model — multiple cost-efficient agents working together beats one frontier model, and non-technical users mainly want tedious admin (email, support tickets, subscriptions) handled for them.", "tweet_url": "https://x.com/cryptopunk7213/status/2087719955185721560", "type": "tweet"}, {"author": "EconguyRosie", "summary": "Core CPI ran at just +1.6% annualized over the three months to July, vs +2.7% over the same period a year earlier. Inflation showed up in computers, airfares, toys, appliances and used cars but nowhere else. Argues inflation-phobes and the three Fed dissenters will have to change their story before long.", "tweet_url": "https://x.com/EconguyRosie/status/2087597567156641811", "type": "tweet"}, {"author": "thedefiedge", "summary": "Argues one-time smart contract audits are stale coverage, not permanent protection: partner Azimuth found 4 confirmed critical vulnerabilities in the past month in code that had already been audited, because contracts changed and new integrations fell outside the original review's scope. Frames Azimuth's approach (recreating attacks to confirm exploitability rather than flagging \"possibly exploitable\" findings, plus a new points/rewards system for validated findings) as continuous validation layered on top of, not replacing, traditional audits.", "tweet_url": "https://x.com/thedefiedge/status/2087748301626175954", "type": "tweet"}, {"author": "Rewkang", "summary": "Flags a large valuation gap ahead of the Unitree humanoid-robotics IPO: stated IPO valuation is $9B, but Hyperliquid's prediction market currently prices the company at $35B.", "tweet_url": "https://x.com/Rewkang/status/2087579051481321784", "type": "tweet"}, {"author": "AndreCronjeTech", "summary": "Describes Flying Tulip's design philosophy — most financial products force capital to choose one job (earn, borrow, trade, or hedge), while Flying Tulip is built around one transparent collateral base, one settlement layer, one risk perimeter. Spot, leveraged trading and TRS are now in private beta; next phase is hardeni // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
