<title>Twitter Bank Research</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DATA POINT TAGS */
.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>

const REPORT_DATA = {"freshness_gate": "FRESHNESS GATE PASSED.", "report_type": "TWITTER BANK RESEARCH", "collected_at": "2026-11-20T06:23:36Z", "date": "2026-11-20 06:23 UTC", "window_days": 4, "input_stats": {"total_tweets": 119, "considered": 119, "kept": 21, "dropped": 98, "deduped": 0}, "summary": "Recurring themes: equity valuation and outlook (Goldman on nominal-growth peak, dispersion and record household equity allocation; Yardeni P/E for S&P 500 and EM), AI investment and AI-infrastructure financing (Apollo/Slok, JPM Cembalest), volatility and seasonality (Goldman holiday seasonality with VIX ≥18 caveat; Nomura dealer gamma and VIX inversion), and US macro/consumer conditions (Goldman jobless claims and Q4 GDP tracker, BofA Institute small-business data, Wells Fargo misery index and Thanksgiving food cost, Morningstar utility yield gap).\n\n21 research items kept from 119 considered tweets across 8 banks/strategists; 0 duplicates collapsed.\n\n**Counts:** Goldman 8, BofA 4, Apollo/Slok 2, Wells Fargo 2, Yardeni 2, JPM 1, Morningstar 1, Nomura 1", "by_bank_counts": {"Goldman": 8, "BofA": 4, "Apollo/Slok": 2, "Wells Fargo": 2, "Yardeni": 2, "JPM": 1, "Morningstar": 1, "Nomura": 1}, "banks": [{"bank": "Goldman", "theme": "US equity outlook (nominal-growth peak, dispersion, household equity allocation, leveraged ETF AUM), Thanksgiving/December seasonality, jobless claims (Michigan), Q4 GDP tracker", "items": [{"author": "neilsethinew", "text": "Continuing claims jump but mostly due to Michigan per Goldman:\n\nInitial jobless claims come in at 203,000 for the week ending November 14, above the 198,000 estimate and up 1,000 from an upwardly revised 202,000, the highest since September 5. The four-week average rose 2,000 to 197,750, the highest since October 17, but remains close to the 195,250 two weeks earlier that was the lowest since October 1969.\n\nContinuing claims jumped 70,000, the most since January 2024, to 1,763,000, the highest since August 29, well above the 1,703,000 estimate. That came after the prior week was revised down to 1,693,000, the lowest since March 2023. Their four-week average is 235,500 lower year-over-year, down for a 42nd straight week, though the gap narrowed from the prior week’s 245,250, the largest since December 2022.\n\nOn the spike in continuing claims from Goldman: \"Much of the increase is driven by Michigan, where continuing claims increased by 44k and initial claims increased by 7k, both the largest increases since the pandemic. We suspect that this spike is related to the launch of Michigan’s new unemployment insurance platform and does not mark a genuine softening in the labor market.\"", "tweet_url": "https://x.com/neilsethinew/status/2123436140254421224", "images": ["https://pbs.twimg.com/media/HXftEEwX0AAleIQ.jpg"], "created_at": "2026-11-19T15:20:02.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Record-high US household equity allocation GS https://t.co/DS9nVl8i3k", "tweet_url": "https://x.com/MikeZaccardi/status/2123399266022359220", "images": ["https://pbs.twimg.com/media/HXfUYXRW4AAQg0w.png"], "created_at": "2026-11-19T12:53:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Leveraged ETF AUM has just about normalized https://t.co/1TQHY8NOvV", "tweet_url": "https://x.com/MikeZaccardi/status/2123398636704870588", "images": ["https://pbs.twimg.com/media/HXfTzvXWoAErjBT.png"], "created_at": "2026-11-19T12:51:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Dispersion in equities may near its peak, potentially leading to a trough in equity volatility.\n\nThe proportion of stocks with negative beta has increased, similar to the Tech Bubble https://t.co/CRuqfhIP4b", "tweet_url": "https://x.com/MikeZaccardi/status/2123397378585567252", "images": ["https://pbs.twimg.com/media/HXfSqfvXcAAm5nN.png"], "created_at": "2026-11-19T12:46:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Peaking nominal growth does not mean a bull market peak\n\nHistorically, equities consolidated around the peak in nominal growth but continued rising afterward, particularly when falling inflation drove the peak https://t.co/c6xA6XccXl", "tweet_url": "https://x.com/MikeZaccardi/status/2123396749565849659", "images": ["https://pbs.twimg.com/media/HXfSF4YWEAAnJSV.png"], "created_at": "2026-11-19T12:43:30.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "GS: Slower returns and less US exceptionalism in 2026\n\nReview of 2026: More moderate returns between earnings tailwinds and rates headwinds https://t.co/5GyiUyyWec", "tweet_url": "https://x.com/MikeZaccardi/status/2123396120898314362", "images": ["https://pbs.twimg.com/media/HXfRhRJXIAEujTU.jpg"], "created_at": "2026-11-19T12:41:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: Everyone around the Thanksgiving table by now has probably heard how positive seasonality is in the November-December period. If this tape has taught us anything, it is that we need to zoom in far more closely than a 2-month period. In fact, there is a clear “holiday” ramp up. \n\nPerformance has historically received a boost in the immediate Thanksgiving period, stalled out in early December, only to be reignited once again in the next round of holiday cheer. Whether this plays out exactly is of course unknown, but it is a factor to be aware of.\n\nThe caveat: Looking back to 1990, in the 17 years when VIX started mid-November at 18 or higher, as it does now, it was lower by year-end in 14, by -3.25 pts on average. In those same years SPX's year-end gain was smaller (mean +1.34%, up in 59% of years). \n\nAs outlined above, the period usually sees a dip first – the median drawdown within the window is -3.0%. Additionally, most of the gains come late; from Dec 15th to year-end the mean is +1.22%, and SPX rose in 27 of 36 years", "tweet_url": "https://x.com/neilsethinew/status/2123391086169342304", "images": ["https://pbs.twimg.com/media/HXdReA_WkAAvE75.jpg"], "created_at": "2026-11-19T12:21:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "I'll be talking about some bullish and bearish indicators. \n\nRight now economic growth is picking up, not slowing.\n\n▪ Q3 real GDP grew 3.4%, the fastest since Q3 2025.\n▪ Both Q4 trackers updated after retail sales point higher than the first half: Goldman at 2.4% and the Atlanta Fed at 3.21%.\n▪ That would put second-half growth at a 2.9%–3.3% annualized rate vs. 2.4% in the first half, and lift y/y growth to 2.6%–2.8% from 2.1%.\n\nThe flip side is that it’s also why the Fed is hiking.", "tweet_url": "https://x.com/neilsethinew/status/2123380768357466133", "images": ["https://pbs.twimg.com/media/HXdPqI2XIAAtOGA.jpg"], "created_at": "2026-11-19T11:40:00.000Z", "relayers": []}]}, {"bank": "BofA", "theme": "BofA Institute small/mid-sized business data (oil-related payments, expansion plans, profitability) and Fedspeak frequency", "items": [{"author": "MikeZaccardi", "text": "BofAI: For firms with <$50M, oil-related payments grew more than 20% YoY in October https://t.co/kuz62NczjK", "tweet_url": "https://x.com/MikeZaccardi/status/2123540825170677898", "images": ["https://pbs.twimg.com/media/HXhVIIfXwAAXa8l.png"], "created_at": "2026-11-19T22:16:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "BofAI: Fewer small and mid-sized businesses plan to expand their business over the next 12 months compared to last year https://t.co/T7QJN4zLeR", "tweet_url": "https://x.com/MikeZaccardi/status/2123537049525322174", "images": ["https://pbs.twimg.com/media/HXhRsZGWoAA3C6P.jpg"], "created_at": "2026-11-19T22:01:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "BofAI: Business owners are entering the next twelve months with greater caution\n\n For mid-sized firms, profitability growth fell in October, and, for small firms, growth was flat https://t.co/Xup2Y0aPh6", "tweet_url": "https://x.com/MikeZaccardi/status/2123533274886648016", "images": ["https://pbs.twimg.com/media/HXhOQrMXgAATTU2.jpg"], "created_at": "2026-11-19T21:46:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "MarketWatch: Inflation is not limited to prices; it's also coming in the frequency of commentary from Federal Reserve officials. According to Bank of America, there's been more \"Fedspeak\" in the last two weeks than in any two-week period since the start of the year.\n\n\"Typically, the chair would weigh in, indicating to markets whether the hawks or doves are in ascendence. Absent this leadership, however, both sides might feel incentivized to speak more often and more forcefully,\" said Bhave. The result of this back-and-forth is undue rate volatility in already turbulent times, he added.", "tweet_url": "https://x.com/neilsethinew/status/2123453753533612308", "images": ["https://pbs.twimg.com/media/HXf9e_MXYAER_YW.png"], "created_at": "2026-11-19T16:30:01.000Z", "relayers": []}]}, {"bank": "Apollo/Slok", "theme": "Slok — AI investment share of US real GDP growth; retirement-savings confidence", "items": [{"author": "dailychartbook", "text": "\"Nearly two-thirds of Americans aren’t confident their retirement savings are on track\"\n\n-Torsten Slok, Apollo https://t.co/Yr9k431IcF", "tweet_url": "https://x.com/dailychartbook/status/2123385966387732691", "images": ["https://pbs.twimg.com/media/HXfISMUW4AAZB6E.jpg"], "created_at": "2026-11-19T12:00:39.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "T at Apollo: AI investment drove ~65% of US real GDP growth over the past three quarters (before netting out imports).\n\nIt is now the #1 engine of the US economy—meaning any 2027 outlook for equities or credit is ultimately a bet on the AI data center buildout. 📈 https://t.co/V9x50TkrMe", "tweet_url": "https://x.com/MikeZaccardi/status/2123382315317436538", "images": ["https://pbs.twimg.com/media/HXfE9p3XgAAGQHd.jpg"], "created_at": "2026-11-19T11:46:09.000Z", "relayers": []}]}, {"bank": "Wells Fargo", "theme": "Thanksgiving food-cost report; misery index at a generational high", "items": [{"author": "MikeZaccardi", "text": "Wells Fargo Thanksgiving Food Report\n\nWells Fargo Agri-Food Institute reports that Thanksgiving for 10 costs $78.93, down 0.4% from last year https://t.co/GQFGrIa14u", "tweet_url": "https://x.com/MikeZaccardi/status/2123567248757391640", "images": ["https://pbs.twimg.com/media/HXhtKN0XIAALB_D.png"], "created_at": "2026-11-20T00:01:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Wells Fargo's misery index soars to a generational high https://t.co/yPonJcjQ8R", "tweet_url": "https://x.com/MikeZaccardi/status/2123494267414839478", "images": ["https://pbs.twimg.com/media/HXgqyJmXMAAeKwn.jpg"], "created_at": "2026-11-19T19:11:00.000Z", "relayers": []}]}, {"bank": "Yardeni", "theme": "P/E multiples — S&P 500 at 17.25x, Emerging Markets at 7.7x", "items": [{"author": "MikeZaccardi", "text": "With today's decline, the S&P 500 is now a 17.25x P/E @yardeni https://t.co/fg3l71t27N", "tweet_url": "https://x.com/MikeZaccardi/status/2123548374003511616", "images": ["https://pbs.twimg.com/media/HXhb_kRXUAAjjzj.jpg"], "created_at": "2026-11-19T22:46:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Emerging Markets fall to a 7.7 P/E with today's drop @yardeni $EEM\n\nLowest since the depths of the 2008-09 GFC https://t.co/kDCqYFiFOA", "tweet_url": "https://x.com/MikeZaccardi/status/2123525725126877600", "images": ["https://pbs.twimg.com/media/HXhHZOCW4AAhJJv.jpg"], "created_at": "2026-11-19T21:16:00.000Z", "relayers": []}]}, {"bank": "JPM", "theme": "Cembalest — rising HY/IG yields on AI-infrastructure debt", "items": [{"author": "dailychartbook", "text": "\"Yields on debt related to financing AI infrastructure (both HY and investment grade) have already been rising sharply this year ... This has started to weigh on overall high yield markets as well.\"\n\n-Michael Cembalest, JPMorgan https://t.co/NAcG8eUAnt", "tweet_url": "https://x.com/dailychartbook/status/2123378337594650760", "images": ["https://pbs.twimg.com/media/HXfBWGoXcAEO05c.png"], "created_at": "2026-11-19T11:30:20.000Z", "relayers": []}]}, {"bank": "Morningstar", "theme": "Utility dividend yields vs 10-year Treasury yield gap", "items": [{"author": "MikeZaccardi", "text": "From @Morningstar: Utility dividend yields are rising but remain roughly 200 basis points below 10-year Treasury yields, an unusually wide gap last seen before the 2000 and 2008 crashes. $XLU \n@soberlook https://thedailyshot.com/subscribe/ https://t.co/bfEfkJsn8V", "tweet_url": "https://x.com/MikeZaccardi/status/2123391088622756205", "images": ["https://pbs.twimg.com/media/HXfM8USXAAAYU4O.jpg"], "created_at": "2026-11-19T12:21:00.000Z", "relayers": []}]}, {"bank": "Nomura", "theme": "McElligott — S&P dealer gamma at −$7.3B alongside VIX term-structure inversion", "items": [{"author": "neilsethinew", "text": "The @dailychartbook nightly email had an interesting post about the VIX. @McClellanOsc (via @LJKawa) notes that spot VIX has moved above all of its futures contracts, a “fairly rare condition” tied to “a bottoming condition for prices.” His caveat is that it’s not necessarily “the exact moment of the bottom.”\n\nCboe data back to late 2007 show spot VIX closing above 3-month VIX (VIX3M) is relatively rare, happening on about 10% of trading days in 75 separate episodes. On Tuesday spot VIX also closed above 6-month VIX (25.46 vs. 25.37), which fits McClellan’s read.\n\nThe good news is returns have been a bit better than average right away, and better still once the curve flips back. Median S&P 500 return one and three months later (share of cases higher in parentheses):\n\n▪️ All days: +1.5% (66%) and +3.8% (73%).\n▪️ First day of inversion: +2.5% (71%) and +4.4% (71%).\n▪️ Day the curve flips back: +3.2% (81%) and +5.4% (79%).\n\nWhy not buy right away then? The inversions that drag on are the problem. The 21 episodes that lasted more than a week (2008, 2011, late 2018 and 2020 among them) saw a median −0.8% the next month, with only 48% higher. Since you only know how long one lasts after the fact, waiting for the curve to flip back may be worthwhile.\n\nThis month is a case study. On Nov. 5 the VIX jumped from 16.6 to 28.2, putting it 10% above VIX3M. The curve flipped back on Nov. 9, and the S&P rallied 3.6% by Nov. 11. Then it rolled over to close at 7,324 on Wednesday, its lowest close since July 29 and 6.3% below the Oct. 6 record. As of Wednesday’s close, VIX/VIX3M is 1.01, a shallow two-day inversion.\n\nNomura’s Charlie McElligott adds a wrinkle in another post in the same email. He says aggregate S&P dealer gamma has fallen to −$7.3B, the deepest on Nomura’s chart going back to 2019, meaning “dealers are now selling into every dip and buying into every rip.” That can make inversions come and go quickly, so a single flip back is a weak all-clear.\n\nBottom line: The inversion says we’re in the zone where lows tend to form. The more useful tell is a flip back that sticks. If the curve stays inverted, this starts to look more like late 2018 or 2020 than a quick dip.", "tweet_url": "https://x.com/neilsethinew/status/2123375735339454920", "images": ["https://pbs.twimg.com/media/HXdUSI7XoAAttYI.jpg"], "created_at": "2026-11-19T11:20:00.000Z", "relayers": []}]}]};

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
