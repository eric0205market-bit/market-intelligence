sity-awarded-400000-nsf-grant-to-expand-post-quantum-cryptographic-protocols/", "title": "Florida Atlantic University Awarded $400,000 NSF Grant to Expand Post-Quantum Cryptographic Protocols - Quantum Computing Report", "published_date": "2026-10-23", "language": "en", "processed_at": "2026-10-24T11:07:59Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "Crypto"], "gist": "The NSF awarded Florida Atlantic University a $399,964 three-year grant (Award No. 2528909, May 2026 to April 2029) led by Edoardo Persichetti and Veronika Kuchta to build post-quantum cryptographic protocols beyond NIST's basic primitives. The work targets blind, threshold and multisignatures and verifiable random functions for decentralized systems and distributed ledgers, using lattices, error-correcting codes, group actions and isogenies.", "themes": [{"theme": "NSF grant scope and team", "insights": [{"claim": "The NSF awarded a $399,964 grant (Award No. 2528909) to Florida Atlantic University's Charles E. Schmidt College of Science for a three-year project (May 15, 2026 to April 30, 2029) to develop cryptographic primitives that secure decentralized systems and digital infrastructure against future quantum attacks.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["National Science Foundation", "Florida Atlantic University"], "conviction": "high", "so_what": "Small but continuing federal funding for PQC research beyond NIST standards; signals US government focus on quantum-safe decentralized infrastructure.", "quote": null, "locator": "The National Science Foundation (NSF) has", "quote_verified": false}, {"claim": "The FAU PQC project is led by Dr. Edoardo Persichetti, director of FAU's Center for Cryptology and Information Security, with co-principal investigator Dr. Veronika Kuchta.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Edoardo Persichetti", "Veronika Kuchta", "Florida Atlantic University"], "conviction": "high", "so_what": "Identifies an academic PQC team with prior standards contributions, relevant for tracking PQC expertise.", "quote": null, "locator": "The National Science Foundation (NSF) has", "quote_verified": false}]}, {"theme": "Moving beyond NIST's basic PQC primitives", "insights": [{"claim": "NIST's post-quantum standardization has focused on foundational mechanisms such as public-key encryption and digital signatures, including FAU-contributed standards like the HQC key encapsulation mechanism and CRYSTALS-DILITHIUM.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["NIST", "HQC", "CRYSTALS-DILITHIUM", "Florida Atlantic University"], "conviction": "high", "so_what": "Base PQC standards exist; the gap is advanced protocols that blockchains and distributed systems need.", "quote": null, "locator": "While global standardization efforts led by", "quote_verified": false}, {"claim": "The FAU NSF project aims to build post-quantum versions of advanced capabilities including blind signatures, threshold signatures, multisignatures and verifiable random functions, for decentralized architectures, privacy-preserving transactions and distributed ledgers.", "speaker": "Mohamed Abdel-Kareem", "type": "thesis", "entities": ["Florida Atlantic University", "National Science Foundation", "distributed ledgers"], "conviction": "high", "so_what": "Threshold and multisignatures are core to crypto custody and blockchains; quantum-safe versions are a prerequisite for crypto's PQC migration.", "quote": "moves beyond basic primitives to build sophisticated capabilities including blind signatures, threshold signatures, multisignatures, and verifiable random functions", "locator": "While global standardization efforts led by", "quote_verified": true}, {"claim": "The FAU team will investigate lattice-based cryptography, error-correcting codes, group actions and isogeny-based frameworks, combining zero-knowledge proofs with structured security assumptions to optimize protocol efficiency, scalability and bandwidth overhead.", "speaker": "Mohamed Abdel-Kareem", "type": "framework", "entities": ["Florida Atlantic University", "zero-knowledge proofs"], "conviction": "medium", "so_what": "Bandwidth and efficiency are the practical blockers for PQC signatures on blockchains; progress here matters for adoption.", "quote": null, "locator": "The research team will investigate algebraic", "quote_verified": false}]}, {"theme": "FAU quantum-safe ecosystem", "insights": [{"claim": "The NSF award also funds student mentoring, research experiences and cybersecurity outreach, and builds on FAU's quantum-safe security work alongside its D-Wave Advantage2 annealing quantum system at the Boca Raton campus.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Florida Atlantic University", "D-Wave Advantage2", "National Science Foundation"], "conviction": "medium", "so_what": "University hardware installs like D-Wave's support vendor revenue and regional quantum talent pipelines.", "quote": null, "locator": "In addition to foundational cryptographic research", "quote_verified": false}]}], "insight_total": 6, "top_entities": ["National Science Foundation", "Florida Atlantic University", "Edoardo Persichetti", "Veronika Kuchta", "NIST", "HQC", "CRYSTALS-DILITHIUM", "D-Wave Advantage2"], "source_meta": {"author": "Mohamed Abdel-Kareem", "word_count": 467, "paywalled": false}}, {"record_id": "bd30eb0310224adf", "source_type": "technology", "source_name": "Quantum Computing Report", "source_url": "https://quantumcomputingreport.com/chalmers-university-demonstrates-trio-pulses-for-control-error-robust-single-qubit-gates-in-superconducting-processors/", "title": "Chalmers University Demonstrates TRIO Pulses for Control-Error-Robust Single-Qubit Gates in Superconducting Processors - Quantum Computing Report", "published_date": "2026-10-23", "language": "en", "processed_at": "2026-10-24T11:07:59Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "Chalmers University's WACQT, with Universite Bourgogne Europe and Aalto University, demonstrated TRIO (Time-Rescaling Robust Inverse-Optimal) pulses for superconducting transmons: a 90 ns X-gate reached 99.90% IRB fidelity and stayed above 99.5% under 20% amplitude and 4 MHz detuning errors, where DRAG Gaussian pulses fell to about 92%. The order-of-magnitude wider tolerance window could cut recalibration overhead in large processors.", "themes": [{"theme": "TRIO gate robustness results", "insights": [{"claim": "A team led by Chalmers University's Wallenberg Centre for Quantum Technology, with Universite Bourgogne Europe and Aalto University, introduced and experimentally validated TRIO (Time-Rescaling Robust Inverse-Optimal) pulses, single-qubit gate envelopes resilient to simultaneous control-amplitude miscalibration and frequency detuning.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Chalmers University of Technology", "Wallenberg Centre for Quantum Technology", "Aalto University", "TRIO"], "conviction": "high", "so_what": "Robust control is a lever for scaling superconducting QPUs without proportional growth in calibration effort.", "quote": null, "locator": "A research team led by the", "quote_verified": false}, {"claim": "On a superconducting transmon processor, a 90-nanosecond TRIO X-gate achieved 99.90% interleaved randomized benchmarking fidelity and kept fidelity above 99.5% under drive-amplitude variations up to 20% and detuning shifts up to 4 MHz.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["TRIO", "transmon"], "conviction": "high", "so_what": "Shows high fidelity can survive large miscalibration, reducing how often qubits must be retuned.", "quote": "a 90-nanosecond TRIO X-gate achieved an Interleaved Randomized Benchmarking (IRB) fidelity of 99.90%", "locator": "Tested on a superconducting transmon processor", "quote_verified": true}, {"claim": "A DRAG-calibrated Gaussian X-gate has slightly higher peak fidelity (99.94%) than TRIO (99.90%) but drops to about 92% under 20% amplitude and 4 MHz detuning errors, whereas TRIO stays above 99.5%, an order-of-magnitude wider tolerance window.", "speaker": "Mohamed Abdel-Kareem", "type": "contrarian", "entities": ["DRAG", "TRIO"], "conviction": "high", "so_what": "Trades a tiny peak-fidelity loss for much better stability, a favorable trade for large fleets of qubits.", "quote": null, "locator": "TRIO vs. Conventional Gaussian Single-Qubit Gate Benchmarks", "quote_verified": false}, {"claim": "By expanding the high-fidelity parameter range by an order of magnitude versus DRAG Gaussian pulses, TRIO pulses offer a pathway to reduce periodic re-calibration overheads in large-scale quantum processors.", "speaker": "Mohamed Abdel-Kareem", "type": "causal", "entities": ["TRIO", "DRAG"], "conviction": "medium", "so_what": "Lower recalibration overhead improves QPU uptime, a cost driver for cloud quantum providers.", "quote": "offering a pathway to reduce periodic re-calibration overheads in large-scale quantum processors", "locator": "Tested on a superconducting transmon processor", "quote_verified": true}]}, {"theme": "Pulse design mechanism", "insights": [{"claim": "Classical Robust Inverse-Optimal pulse designs produce sharp, square-like waveforms that distort in finite-bandwidth microwave hardware and cause leakage into upper transmon states; TRIO applies a time-rescaling function to map energy-optimal Bloch-sphere trajectories onto smooth hyper-Gaussian envelopes, removing high-frequency components.", "speaker": "Mohamed Abdel-Kareem", "type": "causal", "entities": ["TRIO", "transmon"], "conviction": "high", "so_what": "Making robust control compatible with real microwave hardware is what turns a theoretical technique into a deployable one.", "quote": null, "locator": "Classical Robust Inverse-Optimal (RIO) pulse designs", "quote_verified": false}, {"claim": "The TRIO pulse is combined with first-order DRAG corrections to mitigate transmon leakage and AC Stark shifts and is synthesized via IQ microwave phase modulation so Rabi frequency and detuning continuously compensate accumulated errors.", "speaker": "Mohamed Abdel-Kareem", "type": "framework", "entities": ["TRIO", "DRAG", "transmon"], "conviction": "high", "so_what": "Compatible with existing control electronics, lowering adoption barriers for superconducting vendors.", "quote": null, "locator": "The smooth TRIO pulse is further", "quote_verified": false}]}, {"theme": "Universal gate set and fluxonium outlook", "insights": [{"claim": "The team extended TRIO to a universal single-qubit gate set including Hadamard-type operations, achieving average fidelities of 99.69% for Y-pi/2 and 99.62% for X-pi/2.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["TRIO", "Chalmers University of Technology"], "conviction": "high", "so_what": "Universal-set robustness is needed for real algorithms, though these fidelities trail the DRAG Gaussian H-type gate's 99.92%.", "quote": null, "locator": "The research team extended the TRIO", "quote_verified": false}, {"claim": "Numerical simulations indicate TRIO control on higher-anharmonicity qubits such as 1 GHz fluxonium could yield single-qubit gate errors below 10^-6.", "speaker": "Mohamed Abdel-Kareem", "type": "prediction", "entities": ["TRIO", "fluxonium"], "conviction": "exploratory", "so_what": "Simulation-only, but a potential tailwind for fluxonium-based hardware roadmaps.", "quote": null, "locator": "The research team extended the TRIO", "quote_verified": false}]}], "insight_total": 8, "top_entities": ["Chalmers University of Technology", "Wallenberg Centre for Quantum Technology", "Aalto University", "TRIO", "DRAG", "transmon", "fluxonium", "Giovanna Tancredi"], "source_meta": {"author": "Mohamed Abdel-Kareem", "word_count": 551, "paywalled": false}}, {"record_id": "d06ce527737d9f8a", "source_type": "technology", "source_name": "Quantum Computing Report", "source_url": "https://quantumcomputingreport.com/ibm-releases-qiskit-sdk-v2-6-with-c-api-pass-manager-framework-native-qpy-serialization-and-custom-operations/", "title": "IBM Releases Qiskit SDK v2.6 with C API Pass-Manager Framework, Native QPY Serialization, and Custom Operations - Quantum Computing Report", "published_date": "2026-10-23", "language": "en", "processed_at": "2026-10-24T11:07:59Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "IBM Quantum released Qiskit SDK v2.6, expanding its C API with a QkPassManager compiler-pass framework, native QPY serialization (QPY v18 now default) and custom operations via a C vtable, so compilation can run from C, C++ and Julia without Python. The updated roadmap has v2.7 declaring C ABI/API stability and adding a Medium IR for fault-tolerant instruction sets, and v2.8 deploying the Rust-native BackendV3.", "themes": [{"theme": "Qiskit v2.6 C API features", "insights": [{"claim": "IBM Quantum's Qiskit SDK v2.6 expands Qiskit's C API layer so essential compilation capabilities run in native C, C++ and Julia environments without requiring a Python runtime.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["IBM Quantum", "Qiskit", "Julia"], "conviction": "high", "so_what": "Python-optional Qiskit makes IBM's stack easier to embed in HPC centers, reinforcing Qiskit as the default quantum SDK.", "quote": "bringing essential compilation capabilities to native C, C++, and Julia environments without requiring a Python runtime", "locator": "Quantum software developer IBM Quantum (NYSE:", "quote_verified": true}, {"claim": "Qiskit v2.6 adds QkPassManager, a generic C API pass-manager framework in which passes declare input and output representations via QkIrHandle descriptors and the manager validates the full pipeline before execution, enabling multi-stage lowering for C, C++, Julia and Fortran.", "speaker": "Mohamed Abdel-Kareem", "type": "framework", "entities": ["Qiskit", "QkPassManager", "IBM Quantum"], "conviction": "high", "so_what": "Lets third parties build custom compiler passes natively, deepening the Qiskit ecosystem.", "quote": null, "locator": "The new pass-manager framework extends Qiskit", "quote_verified": false}, {"claim": "Qiskit v2.6 exposes native binary QPY serialization directly to C and lets users define custom hardware-native quantum operations through a C vtable interface (QkCustomOp) without Python object model overhead.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Qiskit", "QPY", "IBM Quantum"], "conviction": "high", "so_what": "Hardware vendors can plug native gates into Qiskit cheaply, widening its reach beyond IBM hardware.", "quote": null, "locator": "Qiskit v2.6 introduces a generic C", "quote_verified": false}, {"claim": "QPY format v18 becomes the default serialization in Qiskit v2.6, with more compact encoding of quantum and classical registers that reduces file sizes for large circuits while staying compatible with Python's qiskit.qpy module.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["QPY", "Qiskit"], "conviction": "high", "so_what": "Incremental tooling efficiency for large-scale circuit workflows.", "quote": null, "locator": "The update also makes QPY format", "quote_verified": false}, {"claim": "Building Qiskit from source now requires Rust 1.89, the minimum runtime remains Python 3.10, and Python 3.11+ will be required starting in Qiskit v2.7.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Qiskit", "Rust", "Python"], "conviction": "high", "so_what": "Operational note for teams maintaining Qiskit-based pipelines.", "quote": null, "locator": "The update also makes QPY format", "quote_verified": false}]}, {"theme": "HPC and quantum-centric supercomputing strategy", "insights": [{"claim": "The Qiskit v2.6 C API enhancements advance IBM's roadmap toward Python-optional execution within tightly coupled HPC and Quantum-Centric Supercomputing architectures, including initial removal of the libpython linker dependency from the core libqiskit library.", "speaker": "Mohamed Abdel-Kareem", "type": "thesis", "entities": ["IBM Quantum", "Qiskit", "Quantum-Centric Supercomputing"], "conviction": "high", "so_what": "IBM is positioning Qiskit as infrastructure inside supercomputers, a bid to own the HPC-quantum integration layer.", "quote": null, "locator": "Qiskit v2.6 introduces a generic C", "quote_verified": false}]}, {"theme": "Qiskit roadmap to Rust core and fault tolerance", "insights": [{"claim": "Qiskit 2.7, in development, will formally declare ABI and API stability guarantees for the C interface and introduce a Medium Intermediate Representation (MIR) to support compilation to fault-tolerant instruction sets.", "speaker": "Mohamed Abdel-Kareem", "type": "prediction", "entities": ["Qiskit", "IBM Quantum"], "conviction": "high", "so_what": "Fault-tolerant compilation support in the SDK tracks IBM's move toward error-corrected hardware.", "quote": null, "locator": "Qiskit 2.7 (In Development): Will formally", "quote_verified": false}, {"claim": "Qiskit 2.8, planned, will deploy BackendV3, a Rust-native execution interface exposed to Python and C/C++, and integrate the Samplomatic library into Qiskit's quantum program datamodel.", "speaker": "Mohamed Abdel-Kareem", "type": "prediction", "entities": ["Qiskit", "BackendV3", "Samplomatic", "Rust"], "conviction": "medium", "so_what": "A Rust-native backend interface may reshape how hardware providers integrate with Qiskit.", "quote": null, "locator": "Qiskit 2.8 (Planned): Focuses on deploying", "quote_verified": false}]}], "insight_total": 8, "top_entities": ["IBM Quantum", "Qiskit", "QkPassManager", "QPY", "Rust", "BackendV3", "Samplomatic", "Quantum-Centric Supercomputing", "Julia"], "source_meta": {"author": "Mohamed Abdel-Kareem", "word_count": 630, "paywalled": false}}, {"record_id": "bd07bd8a1635e2a2", "source_type": "technology", "source_name": "Semiconductor Engineering", "source_url": "https://semiengineering.com/chip-industry-week-in-review-161/", "title": "Chip Industry Week In Review", "published_date": "2026-10-23", "language": "en", "processed_at": "2026-10-24T11:06:24Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI", "Geopolitics", "Energy"], "gist": "Semiconductor Engineering's weekly roundup: the US Commerce Department signed CHIPS Act letters of intent for up to $389M (with equity stakes) for power-chip and materials R&D; Nvidia expanded packaging, substrate and test capacity deals (including $3B with Amkor); Lam Research posted record $8.2B revenue (+54% YoY); Chinese hyperscalers reportedly ordered over $35B of export-compliant Nvidia GPUs; and Micron laid out a roadmap with vertical HBM on logic for 2028. Other items include Tenstorrent's $1.5B raise, Samsung/SK hynix upgrading China NAND fabs, a 21% drop in Q3 PC shipments on memory costs, and AI-agent security incidents at OpenAI and OpenCode.", "themes": [{"theme": "CHIPS Act equity-linked power and materials awards", "insights": [{"claim": "The US Commerce Department signed letters of intent for up to $389M in CHIPS Act R&D funding to four power-device and critical-materials companies, and will take minority, nonvoting equity stakes as a condition of the awards.", "type": "data_point", "entities": ["U.S. Commerce Department", "CHIPS Act"], "conviction": "high", "so_what": "US government equity stakes in chip awards are becoming standard, which changes the risk/return for grant recipients.", "quote": "the government will receive minority, nonvoting equity stakes as a condition of the awards", "locator": "CHIPS Act funding", "speaker": "The SE Staff", "quote_verified": true}, {"claim": "The CHIPS Act awards include up to $175M for Helion (high-voltage power semiconductors for fusion), $85M for Commonwealth Fusion Systems, $73M for Vertical Semiconductor (vertical GaN power transistors for AI data-center racks) and $56M fo g Intel's cost per hash was at least twice as high.", "speaker": "SemiWiki", "type": "data_point", "entities": ["Intel", "Blockscale", "Bitmain"], "conviction": "high", "so_what": "In mining ASICs J/TH is the single competitive metric, and Intel was not close to Bitmain.", "quote": "A mining chip is judged on a single number: how many joules it burns per TH of hash rate.", "locator": "A mining chip is judged on", "quote_verified": true}]}, {"theme": "Mining chips as process-tuning vehicles", "insights": [{"claim": "Mining chips suit tuning a new process node because they are highly repetitive, tolerate low yield by disabling failed cores, convert hash rate directly into yield feedback, and remain sellable even at low yield.", "speaker": "SemiWiki", "type": "framework", "entities": ["bitcoin mining chips", "process yield"], "conviction": "medium", "so_what": "Explains why crypto ASICs often appear as early customers on new foundry nodes.", "quote": "A mining chip is highly repetitive and can tolerate lower yield, because you can simply disable the cores that fail.", "locator": "That guess makes sense.", "quote_verified": true}, {"claim": "When SMIC developed its 7 nm process, the MinerVa mining chip, reportedly from the same people as Canaan, ran on it per a TechInsights teardown and helped the new process work out its yield.", "speaker": "SemiWiki", "type": "anecdote", "entities": ["SMIC", "MinerVa", "Canaan", "TechInsights", "7 nm"], "conviction": "medium", "so_what": "Crypto-miner tape-outs can be a leading indicator of a new node's yield ramp.", "quote": null, "locator": "There is precedent. When SMIC", "quote_verified": false}]}, {"theme": "Abrupt end of the program", "insights": [{"claim": "Intel launched the second-generation Blockscale in April 2022, and in April 2023 an Intel spokesperson confirmed the product line had reached end-of-life, while Intel was planning $3 billion of cost cuts in 2023.", "speaker": "SemiWiki", "type": "data_point", "entities": ["Intel", "Blockscale"], "conviction": "high", "so_what": "Cost-cutting pressure cut short exploratory side bets at Intel.", "quote": null, "locator": "Intel launched the second-generation Blockscale", "quote_verified": false}, {"claim": "Neither a process-tuning rationale nor a profit rationale explains Intel's Blockscale: process tuning needs a continuous flow of orders rather than a two-version run, and a profit play would have used Intel's biggest strength, so the poster concludes it was a project nobody was really in charge of.", "speaker": "SemiWiki", "type": "thesis", "entities": ["Intel", "Blockscale"], "conviction": "exploratory", "so_what": "Signals weak project governance at Intel in that era, relevant to judging its execution on new ventures.", "quote": "That leaves one: this was a project nobody was really in charge of.", "locator": "If the mining chip was meant", "quote_verified": true}, {"claim": "Intel had both of a company's most valuable resources, process technology and people, yet took the most careless approach and built its shortest-lived product with Blockscale.", "speaker": "SemiWiki", "type": "contrarian", "entities": ["Intel", "Blockscale"], "conviction": "medium", "so_what": "Having assets is not the same as deploying them well; execution risk remains the Intel question.", "quote": null, "locator": "A plan that could use BTC", "quote_verified": false}]}], "insight_total": 8, "top_entities": ["Intel", "Blockscale", "Bitmain", "SMIC", "MinerVa", "Canaan", "TechInsights", "TSMC"], "source_meta": {"author": "SemiWiki", "word_count": 643, "paywalled": false}}, {"record_id": "3d4e7adc8745c848", "source_type": "technology", "source_name": "SemiWiki", "source_url": "https://semiwiki.com/semiconductor-services/semiconductor-intelligence/375321-strong-electronics-growth-2026/", "title": "Strong Electronics Growth 2026", "published_date": "2026-10-22", "language": "en", "processed_at": "2026-10-24T11:07:08Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI", "Macro"], "gist": "Electronics production growth accelerated through 2026 worldwide, with Taiwan more than doubling on Nvidia AI module demand and the U.S. at 8.1%, Japan 17.6% and the EU 16.9%. Meanwhile IDC reports Q3 2026 PC and smartphone shipments fell 20% and 22% as AI-driven memory demand pushed memory costs up 350% year over year.", "themes": [{"theme": "Accelerating electronics production", "insights": [{"claim": "U.S. electronics production grew 8.1% (three-month average versus a year ago) in August 2026, continuing an accelerating trend since October 2025.", "speaker": "Bill Jewell", "type": "data_point", "entities": ["United States", "electronics production"], "conviction": "high", "so_what": "Broad industrial demand for electronics is strengthening, not peaking.", "quote": null, "locator": "Growth in electronics production has been", "quote_verified": false}, {"claim": "Japan's electronics production growth swung from a 1.5% decline in January 2026 to a 17.6% increase in August 2026, and the EU 27 went from a 10.5% decline in January to 16.9% growth in July 2026.", "speaker": "Bill Jewell", "type": "data_point", "entities": ["Japan", "EU 27"], "conviction": "high", "so_what": "Sharp reacceleration outside Asia suggests the AI hardware cycle is lifting regional supply chains.", "quote": null, "locator": "Growth in electronics production has been", "quote_verified": false}, {"claim": "In August 2026 three-month-average electronics production growth was 71% in Thailand, 40% in Vietnam, 22% in Malaysia, 18% in South Korea and 17% in China, and India was up 14% in July 2026.", "speaker": "Bill Jewell", "type": "data_point", "entities": ["Thailand", "Vietnam", "Malaysia", "South Korea", "China", "India"], "conviction": "high", "so_what": "Southeast Asian assembly hubs are the fastest-growing beneficiaries of the boom.", "quote": null, "locator": "Other key Asian countries are also", "quote_verified": false}]}, {"theme": "Taiwan doubling on Nvidia AI modules", "insights": [{"claim": "Taiwan's electronics production more than doubled in 2026, with three-month-average growth over 100% for most months, driven largely by demand for Nvidia AI modules whose ICs TSMC makes and which other Taiwanese firms assemble.", "speaker": "Bill Jewell", "type": "causal", "entities": ["Taiwan", "Nvidia", "TSMC"], "conviction": "high", "so_what": "Taiwan's electronics output is a direct proxy for Nvidia AI server demand.", "quote": "Taiwan’s electronics production has more than doubled in 2026, driven largely by demand for Nvidia AI modules.", "locator": "Electronics production growth is also accelerating", "quote_verified": true}]}, {"theme": "AI memory squeeze hits PCs and phones", "insights": [{"claim": "According to IDC, PC shipments in Q3 2026 fell 20% year over year and smartphone shipments fell 22%, and IDC projects full-year 2026 declines of 11.3% for PCs and 13.9% for smartphones.", "speaker": "Bill Jewell", "type": "data_point", "entities": ["IDC", "PCs", "smartphones"], "conviction": "high", "so_what": "Consumer device OEMs face a sharp volume downturn in 2026.", "quote": null, "locator": "Despite the global strength in electronics", "quote_verified": false}, {"claim": "AI applications are driving huge demand for DRAM and flash memory, pushing memory costs up 350% year over year in Q3 2026 per IDC, and those shortages and prices are the main cause of falling PC and smartphone shipments.", "speaker": "Bill Jewell", "type": "causal", "entities": ["IDC", "DRAM", "flash memory", "PCs", "smartphones"], "conviction": "high", "so_what": "Memory makers win pricing power while PC and phone OEMs lose volume and margin.", "quote": "According to IDC, memory costs in 3Q 2026 were up 350% from a year ago.", "locator": "Despite the global strength in electronics", "quote_verified": true}, {"claim": "The AI boom is behind high growth in electronics and semiconductors overall, but AI demand is causing declines in other electronics markets.", "speaker": "Bill Jewell", "type": "thesis", "entities": ["AI", "semiconductors"], "conviction": "high", "so_what": "AI is crowding out non-AI electronics; position for divergence between AI and consumer segments.", "quote": "However, AI demand is resulting in declines in other electronics markets.", "locator": "The boom in AI is behind", "quote_verified": true}]}], "insight_total": 7, "top_entities": ["Taiwan", "Nvidia", "TSMC", "IDC", "Japan", "EU 27", "Thailand", "Vietnam", "China", "DRAM", "Semiconductor Intelligence"], "source_meta": {"author": "Bill Jewell", "word_count": 499, "paywalled": false}}, {"record_id": "5964857f52695bc5", "source_type": "technology", "source_name": "SemiWiki", "source_url": "https://semiwiki.com/semiconductor-manufacturers/soitec/375182-the-wafer-is-the-new-battleground-soitec-cpo-rene-jonker-on-building-ai-from-the-substrate-up/", "title": "The Wafer Is the New Battleground: Soitec CPO René Jonker on Building AI from the Substrate Up", "published_date": "2026-10-23", "language": "en", "processed_at": "2026-10-24T11:07:08Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "In a SEMICON West 2026 interview, Soitec CPO René Jonker argues that engineered substrates add properties at the cheapest point in the chain, with Photonics-SOI for co-packaged optics in AI data centers now driving growth after RF-SOI made Soitec dominant in 5G front ends. Soitec's stock rose more than sixfold from January to early October 2026, and the company is extending into SiC (SmartSiC), RF-GaN and smaller-geometry FD-SOI.", "themes": [{"theme": "Soitec's market position and history", "insights": [{"claim": "Soitec stock on Euronext Paris rose more than sixfold in 2026: $100 invested in January 2026 was worth more than $600 by early October.", "speaker": "Lauro Rizzatti", "type": "data_point", "entities": ["Soitec", "Euronext Paris"], "conviction": "high", "so_what": "The market has re-rated Soitec as an AI beneficiary.", "quote": "an investor who put $100 into its stock in January 2026 was holding more than $600 by early October", "locator": "The market has noticed.", "quote_verified": true}, {"claim": "Soitec was spun out of CEA-Leti in 1992 to commercialize Smart Cut, which uses ion implantation and wafer bonding to transfer a nanometers-thin monocrystalline silicon layer onto an insulating substrate to make silicon-on-insulator wafers.", "speaker": "Lauro Rizzatti", "type": "data_point", "entities": ["Soitec", "CEA-Leti", "Smart Cut", "SOI"], "conviction": "high", "so_what": "Smart Cut IP is the core moat underlying all of Soitec's platforms.", "quote": null, "locator": "Soitec was spun out of CEA-Leti", "quote_verified": false}, {"claim": "Soitec's early growth came from SOI deals with AMD and IBM, but customer concentration and a detour into solar caused turbulence in the 2000s before a 2010s turnaround built on RF-SOI for smartphone front-end modules.", "speaker": "Lauro Rizzatti", "type": "anecdote", "entities": ["Soitec", "AMD", "IBM", "RF-SOI"], "conviction": "high", "so_what": "Soitec's history shows customer-concentration and diversification risk.", "quote": null, "locator": "The road was not straight.", "quote_verified": false}, {"claim": "Soitec sits at the bottom of the value chain: foundries and IDMs such as TSMC, GlobalFoundries, STMicroelectronics, Samsung Foundry and UMC buy its wafers, and fabless firms such as Qualcomm, Apple, Broadcom, MediaTek and NXP specify Soitec platforms in their designs.", "speaker": "Lauro Rizzatti", "type": "framework", "entities": ["Soitec", "TSMC", "GlobalFoundries", "STMicroelectronics", "Samsung Foundry", "UMC", "Qualcomm", "Apple", "Broadcom", "MediaTek", "NXP"], "conviction": "high", "so_what": "Design-in by fabless customers drives demand pull through foundries, making Soitec sticky.", "quote": null, "locator": "Soitec is neither a foundry nor", "quote_verified": false}]}, {"theme": "Engineering properties into the substrate", "insights": [{"claim": "As transistor scaling runs into leakage, parasitic capacitance and thermal limits, bulk silicon becomes the bottleneck, and a buried oxide layer under thin silicon often cuts power by 30 to 50 percent without a node shrink.", "speaker": "Lauro Rizzatti", "type": "causal", "entities": ["SOI", "bulk silicon"], "conviction": "high", "so_what": "Substrate engineering offers power gains that otherwise require costly node migrations.", "quote": "often cutting power by 30 to 50 percent without a node shrink", "locator": "That position matters more every year.", "quote_verified": true}, {"claim": "Engineered substrates let suppliers add properties to silicon at the earliest stage so foundries do not need complicated processing to reach similar performance.", "speaker": "René Jonker", "type": "thesis", "entities": ["Soitec", "foundries"], "conviction": "high", "so_what": "Value is migrating down the stack to materials suppliers.", "quote": "By providing a substrate, you can add properties to silicon at a very early stage.", "locator": "Jonker puts the formula in one sentence.", "quote_verified": true}, {"claim": "RF-SOI displaced competing technologies in mobile front-end modules by eliminating bulk silicon parasitics, made Soitec the dominant supplier, and now sits in RF switches and low-noise amplifiers in practically every 5G phone and Wi-Fi module.", "speaker": "Lauro Rizzatti", "type": "causal", "entities": ["RF-SOI", "Soitec", "5G", "Wi-Fi"], "conviction": "high", "so_what": "RF-SOI is a mature cash-generating franchise tied to smartphone volumes.", "quote": null, "locator": "RF-SOI is the proof.", "quote_verified": false}, {"claim": "Soitec now runs five main substrate platforms, each built to solve a problem that is hard to fix further down the chain: RF-SOI, Photonics-SOI, FD-SOI, Power-SOI and Piezoelectric-on-Insulator.", "speaker": "Lauro Rizzatti", "type": "framework", "entities": ["Soitec", "RF-SOI", "Photonics-SOI", "FD-SOI", "Power-SOI", "POI"], "conviction": "high", "so_what": "Diversified platforms reduce Soitec's dependence on smartphone RF.", "quote": null, "locator": "“That’s a little bit behind us now,”", "quote_verified": false}]}, {"theme": "Photonics-SOI as AI growth driver", "insights": [{"claim": "Photonics-SOI is now Soitec's main growth driver, described as the new gold, because AI cluster interconnect is moving from copper to fiber and Photonics-SOI provides the electron-to-photon interface that underpins co-packaged optics in AI data centers.", "speaker": "René Jonker", "type": "causal", "entities": ["Photonics-SOI", "Soitec", "co-packaged optics", "AI data centers"], "conviction": "high", "so_what": "Soitec is a picks-and-shovels play on co-packaged optics adoption.", "quote": "“It’s now seen as the new gold,” Jonker says.", "locator": "The platform carrying Soitec today", "quote_verified": true}, {"claim": "Silicon is only an okay waveguide material and indium phosphide performs better, but silicon photonics wins because the whole industry is set up for silicon and indium phosphide is difficult to work with.", "speaker": "René Jonker", "type": "contrarian", "entities": ["silicon photonics", "indium phosphide"], "conviction": "high", "so_what": "Manufacturing ecosystem advantages favor silicon photonics over InP-based optics.", "quote": "The whole industry is basically set up for silicon, and indium phosphide is a difficult material to begin with.", "locator": "Photonics has the same tension.", "quote_verified": true}]}, {"theme": "FD-SOI, power and new materials", "insights": [{"claim": "FD-SOI cuts leakage and compute power and supports back-biasing to trade speed against power on the fly, and is used in automotive radar, IoT microcontrollers and edge devices; Power-SOI serves high-voltage automotive and industrial circuits and POI targets acoustic RF filters for 5G and 6G.", "speaker": "Lauro Rizzatti", "type": "data_point", "entities": ["FD-SOI", "Power-SOI", "POI", "automotive radar", "IoT"], "conviction": "high", "so_what": "Soitec's mid-portfolio gives exposure to auto, industrial and edge markets.", "quote": null, "locator": "Between RF-SOI, the past", "quote_verified": false}, {"claim": "Demand for specialized materials such as gallium nitride and silicon carbide that enable features classical silicon cannot will keep growing, and the industry will see more and more kinds of materials.", "speaker": "René Jonker", "type": "prediction", "entities": ["gallium nitride", "silicon carbide", "Soitec"], "conviction": "high", "so_what": "Compound-semiconductor materials suppliers have a secular tailwind.", "quote": "For me it is very clear: we will see more and more different kinds of materials.", "locator": "The bigger shift, in Jonker’s view", "quote_verified": true}, {"claim": "Soitec's SmartSiC reuses a single-crystal silicon carbide donor wafer many times by bonding a thin layer onto a conductive base, lowering the cost of SiC power devices for EV inverters.", "speaker": "Lauro Rizzatti", "type": "causal", "entities": ["SmartSiC", "Soitec", "silicon carbide", "EV inverters"], "conviction": "high", "so_what": "Lower-cost SiC substrates could pressure incumbent SiC wafer suppliers.", "quote": null, "locator": "Soitec is positioning for it.", "quote_verified": false}, {"claim": "Soitec is developing RF-GaN on insulator for 6G power amplifiers and aerospace, and moving FD-SOI to smaller geometries for energy-conscious on-device AI in phones and wearables.", "speaker": "Lauro Rizzatti", "type": "prediction", "entities": ["Soitec", "RF-GaN", "FD-SOI", "6G", "on-device AI"], "conviction": "medium", "so_what": "Pipeline products extend Soitec into 6G and edge AI.", "quote": null, "locator": "Soitec is positioning for it.", "quote_verified": false}]}, {"theme": "Competition: suppliers and technologies", "insights": [{"claim": "Soitec's direct substrate competition comes mostly from GlobalWafers, which Jonker says has or used to have access to Soitec IP, but he does not see GlobalWafers at Soitec's level today.", "speaker": "René Jonker", "type": "data_point", "entities": ["GlobalWafers", "Soitec"], "conviction": "medium", "so_what": "GlobalWafers is the main supplier-side threat to Soitec's share.", "quote": "has or used to have access to our IP", "locator": "Direct competition, meaning other suppliers", "quote_verified": true}, {"claim": "The more important competition is between technologies: an FD-SOI customer could instead choose FinFET at TSMC, but FinFET is not very power efficient, giving designers who want to win on power a reason to pick FD-SOI.", "speaker": "René Jonker", "type": "contrarian", "entities": ["FD-SOI", "FinFET", "TSMC"], "conviction": "medium", "so_what": "FD-SOI adoption depends on power-sensitive designs choosing it over TSMC FinFET.", "quote": "FinFET technology is not super efficient in terms of power usage", "locator": "The more interesting competition is between", "quote_verified": true}, {"claim": "Soitec's substrates rarely win on raw physics alone; they win by adding a new property into a silicon-built manufacturing world at the cheapest point in the chain, and in the AI era every watt and bit moved between chips makes the wafer a design decision.", "speaker": "Lauro Rizzatti", "type": "thesis", "entities": ["Soitec", "AI"], "conviction": "high", "so_what": "AI power and bandwidth constraints are turning substrate choice into a strategic lever.", "quote": null, "locator": "That last point sums up Soitec’s", "quote_verified": false}]}], "insight_total": 17, "top_entities": ["Soitec", "René Jonker", "Photonics-SOI", "FD-SOI", "RF-SOI", "Smart Cut", "CEA-Leti", "TSMC", "GlobalWafers", "SmartSiC", "indium phosphide", "co-packaged optics"], "source_meta": {"author": "Lauro Rizzatti", "word_count": 1244, "paywalled": false}}, {"record_id": "88e0c1a3df5b40f5", "source_type": "technology", "source_name": "SemiWiki", "source_url": "https://semiwiki.com/semiconductor-manufacturers/applied-materials/375053-from-sequential-rd-to-trusted-co-innovation-the-epic-model-for-semiconductor-innovation/", "title": "From Sequential R&D to Trusted Co-Innovation: The EPIC Model for Semiconductor Innovation", "published_date": "2026-10-22", "language": "en", "processed_at": "2026-10-24T11:07:08Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "At the October 12, 2026 unveiling of Applied Materials' EPIC Center in Sunnyvale, CEO Gary Dickerson argued AI demands a shift from sequential R&D handoffs to early, parallel co-innovation across materials, transistors, interconnects, memory and packaging. The article frames trust as an operating requirement and EPIC as a physical venue for that model; it offers no figures.", "themes": [{"theme": "From sequential handoffs to early co-innovation", "insights": [{"claim": "Applied Materials CEO Gary Dickerson argued at the EPIC Center unveiling that AI's growing demands require a different R&D approach that brings partners together earlier across the whole semiconductor technology stack.", "speaker": "Kalar Rajendiran", "type": "thesis", "entities": ["Applied Materials", "Gary Dickerson", "EPIC Center", "AI"], "conviction": "high", "so_what": "Applied is positioning itself as the hub of industry R&D, potentially deepening customer lock-in.", "quote": null, "locator": "That was a central message", "quote_verified": false}, {"claim": "Sequential handoffs between technology developers, integrators and manufacturers break down when system performance depends on materials, equipment, transistors, interconnects, packaging, memory and architecture advancing together, because late discovery of dependencies causes costly redesigns and longer timelines.", "speaker": "Kalar Rajendiran", "type": "causal", "entities": ["semiconductor R&D", "advanced packaging"], "conviction": "high", "so_what": "Integration complexity raises the value of suppliers that coordinate across the stack.", "quote": null, "locator": "That approach becomes increasingly difficult when", "quote_verified": false}, {"claim": "Bringing expertise in early lets partners identify requirements and constraints jointly, test ideas sooner, evaluate trade-offs together and run R&D on interdependent problems in parallel rather than waiting for each stage to finish.", "speaker": "Kalar Rajendiran", "type": "framework", "entities": ["semiconductor R&D"], "conviction": "medium", "so_what": "Parallel development could shorten time to market for new nodes and packaging.", "quote": null, "locator": "This creates opportunities to test ideas", "quote_verified": false}]}, {"theme": "System-level innovation for AI", "insights": [{"claim": "For AI infrastructure, research in materials and manufacturing processes must connect with advances in transistors, interconnects, memory integration and advanced packaging so that progress translates into system-level performance, energy efficiency and manufacturability.", "speaker": "Kalar Rajendiran", "type": "framework", "entities": ["AI infrastructure", "advanced packaging", "memory integration"], "conviction": "medium", "so_what": "Equipment value is increasingly judged on system-level outcomes, not single-step improvements.", "quote": null, "locator": "For AI infrastructure, that means connecting", "quote_verified": false}, {"claim": "The most valuable R&D opportunities may lie at the boundaries between technologies, where a challenge cannot be solved by improving a single component.", "speaker": "Kalar Rajendiran", "type": "thesis", "entities": ["semiconductor R&D"], "conviction": "medium", "so_what": "Cross-domain integration (e.g. packaging plus materials) is where differentiation may shift.", "quote": "The most valuable opportunities may lie at the boundaries between technologies", "locator": "This shift also changes how companies", "quote_verified": true}]}, {"theme": "Trust and the EPIC Center model", "insights": [{"claim": "In co-innovation, trust is an operating requirement rather than a cultural aspiration, because partners in a competitive industry must share sensitive constraints and expertise under safeguards that define what can be discussed and how information is protected.", "speaker": "Kalar Rajendiran", "type": "thesis", "entities": ["Applied Materials", "EPIC Center"], "conviction": "medium", "so_what": "IP protection frameworks determine whether rival chipmakers will co-develop at a shared center.", "quote": "Trust is therefore more than a cultural aspiration. It is an enabler of technical progress.", "locator": "Trust is therefore more than", "quote_verified": true}, {"claim": "Applied Materials' EPIC Center, unveiled October 12, 2026 in Sunnyvale, brings Applied and industry partners together to work on next-generation materials, processes and equipment, and its value will be measured by faster learning and technologies reaching manufacturing sooner.", "speaker": "Kalar Rajendiran", "type": "data_point", "entities": ["Applied Materials", "EPIC Center", "Sunnyvale"], "conviction": "high", "so_what": "Watch for named partners and faster tool adoption as evidence EPIC delivers.", "quote": null, "locator": "The EPIC Center provides a physical", "quote_verified": false}, {"claim": "The next competitive advantage in semiconductors may depend as much on how the industry innovates as on the technologies it invents.", "speaker": "Kalar Rajendiran", "type": "prediction", "entities": ["semiconductor industry"], "conviction": "exploratory", "so_what": "Process of collaboration itself could become a moat for equipment suppliers.", "quote": "The next competitive advantage may depend as much on how the industry innovates as on the technologies it invents.", "locator": "The next competitive advantage may depend", "quote_verified": true}]}], "insight_total": 8, "top_entities": ["Applied Materials", "Gary Dickerson", "EPIC Center", "Sunnyvale", "AI", "advanced packaging"], "source_meta": {"author": "Kalar Rajendiran", "word_count": 960, "paywalled": false}}, {"record_id": "8ea8fcd00d55ecfc", "source_type": "technology", "source_name": "SemiWiki", "source_url": "https://semiwiki.com/forum/threads/26106", "title": "The Most Important Factory in America by Dan Wang in NYT 23 Oct 2026", "published_date": "2026-10-23", "language": "en", "processed_at": "2026-10-24T11:07:08Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "Geopolitics", "AI"], "gist": "A forum post excerpting Dan Wang's NYT essay argues TSMC Arizona matters chiefly because it transfers process knowledge the U.S. has lost, not capital or equipment. TSMC, valued at $2 trillion, plans more than a quarter of a trillion dollars for 10 fabs, two packaging plants and an R&D site in Arizona, employs over 3,500 there, and is exploring Texas, while Taiwan concentration keeps a war discount on the stock.", "themes": [{"theme": "Taiwan concentration risk at TSMC", "insights": [{"claim": "TSMC, the world's most advanced chipmaker and supplier to Apple and Nvidia, has a $2 trillion market cap that might be higher if it did not make nearly all its chips in Taiwan, which China's Communist Party covets.", "speaker": "Dan Wang", "type": "thesis", "entities": ["TSMC", "Apple", "Nvidia", "Taiwan", "China"], "conviction": "high", "so_what": "Geopolitical risk is an explicit valuation discount on TSMC that U.S. capacity could narrow.", "quote": "It might be worth even more if TSMC didn’t manufacture nearly all of its chips in Taiwan", "locator": "Taiwan Semiconductor Manufacturing Company is the", "quote_verified": true}, {"claim": "When investment banks model a war over Taiwan, they use phrases like global economic depression, trillions in losses and sometimes World War III.", "speaker": "Dan Wang", "type": "anecdote", "entities": ["Taiwan", "investment banks"], "conviction": "medium", "so_what": "A Taiwan conflict is a systemic tail risk for markets, not just for semis.", "quote": null, "locator": "Taiwan Semiconductor Manufacturing Company is the", "quote_verified": false}]}, {"theme": "TSMC Arizona buildout", "insights": [{"claim": "TSMC announced its Arizona fab in 2020, drawn by proximity to U.S. customers, federal subsidies and political pressure from the Trump administration, which touts it as the largest foreign direct investment ever into the United States.", "speaker": "Dan Wang", "type": "causal", "entities": ["TSMC", "Arizona", "Trump administration"], "conviction": "high", "so_what": "Subsidies and political pressure are effective levers for reshoring chip capacity.", "quote": null, "locator": "In 2020, TSMC announced it would", "quote_verified": false}, {"claim": "In July, TSMC announced plans to invest more than a quarter of a trillion dollars in Arizona for 10 chip plants, two packaging facilities and an R&D site; it employs over 3,500 people there and its CEO said this month it is exploring a Texas investment.", "speaker": "Dan Wang", "type": "data_point", "entities": ["TSMC", "Arizona", "Texas"], "conviction": "high", "so_what": "Massive multi-year capex supports U.S. fab equipment, construction and packaging suppliers.", "quote": null, "locator": "In 2020, TSMC announced it would", "quote_verified": false}]}, {"theme": "Process knowledge as America's missing asset", "insights": [{"claim": "The U.S. invented the semiconductor and dominated the industry for decades, but chipmakers like Intel and Texas Instruments fell behind and AI hardware is now made mostly in East Asia.", "speaker": "Dan Wang", "type": "data_point", "entities": ["Intel", "Texas Instruments", "East Asia"], "conviction": "high", "so_what": "U.S. legacy chipmakers lost manufacturing leadership, explaining dependence on foreign foundries.", "quote": null, "locator": "The United States invented the semiconductor", "quote_verified": false}, {"claim": "TSMC Arizona's most important contribution is process knowledge, not money, equipment or jobs, because the U.S. lacks the practiced skill of manufacturing rather than capital or access to ad
