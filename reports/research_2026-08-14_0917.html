const META = {
  date: "2026-08-14",
  time: "09:17 CEST",
  windowStart: "2026-08-14 03:17 CEST",
  windowEnd: "2026-08-14 09:17 CEST",
  emailsInWindow: 14,
  emailsRead: 14,
  itemsExtracted: 17,
  includedSources: [
    { name: "Dark Side of the Boom", count: 6 },
    { name: "Michael Parekh", count: 2 },
    { name: "MacroEdge", count: 2 },
    { name: "HFIR", count: 1 },
    { name: "Irrational Analysis", count: 1 },
    { name: "DTI Newsletter", count: 1 },
    { name: "McKinsey", count: 1 },
    { name: "Tiger Research", count: 1 },
    { name: "TMAD", count: 1 },
    { name: "Noahpinion", count: 1 }
  ],
  skippedSources: [
    { name: "James Bulltard", reason: "Personal note about a family death — no recap issued, zero analytical content." }
  ]
};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function esc(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function toggleCard(id) {
  var el = document.getElementById('card-' + id);
  el.classList.toggle('open');
}

function catCounts() {
  var counts = {};
  ITEMS.forEach(function(i) { counts[i.cat] = (counts[i.cat] || 0) + 1; });
  return counts;
}
function urgCounts() {
  var counts = {};
  ITEMS.forEach(function(i) { counts[i.urgency] = (counts[i.urgency] || 0) + 1; });
  return counts;
}

function renderFilters() {
  var cc = catCounts();
  var cats = Object.keys(cc).sort();
  var catBar = document.getElementById('catBar');
  var html = '<button class="pill' + (activeCat === 'all' ? ' active' : '') + '" style="' + (activeCat === 'all' ? 'background:#333;' : '') + '" onclick="setCat(\'all\')">All (' + ITEMS.length + ')</button>';
  cats.forEach(function(c) {
    var color = CATEGORY_COLORS[c] || '#888';
    var isActive = activeCat === c;
    html += '<button class="pill' + (isActive ? ' active' : '') + '" style="' + (isActive ? 'background:' + color + ';border-color:' + color + ';' : 'color:' + color + ';border-color:' + color + ';') + '" onclick="setCat(\'' + c + '\')">' + esc(c) + ' (' + cc[c] + ')</button>';
  });
  catBar.innerHTML = html;

  var uc = urgCounts();
  var urgBar = document.getElementById('urgBar');
  var uhtml = '<button class="pill' + (activeUrg === 'all' ? ' active' : '') + '" style="' + (activeUrg === 'all' ? 'background:#333;' : '') + '" onclick="setUrg(\'all\')">All</button>';
  ['act', 'deep', 'watch'].forEach(function(u) {
    if (!uc[u]) return;
    var isActive = activeUrg === u;
    uhtml += '<button class="pill' + (isActive ? ' active' : '') + '" style="' + (isActive ? 'background:#444;' : '') + '" onclick="setUrg(\'' + u + '\')">' + URGENCY_META[u].emoji + ' ' + URGENCY_META[u].label + ' (' + uc[u] + ')</button>';
  });
  urgBar.innerHTML = uhtml;
}

function setCat(c) {
  activeCat = c;
  activeSrc = null;
  renderFilters();
  renderCards();
}
function setUrg(u) {
  activeUrg = u;
  activeSrc = null;
  renderFilters();
  renderCards();
}
function filterBySrc(name) {
  activeCat = "all";
  activeUrg = "all";
  activeSrc = name;
  renderFilters();
  renderCards();
}

function renderCards() {
  var container = document.getElementById('cardContainer');
  var filtered = ITEMS.filter(function(item) {
    if (activeSrc && item.source.indexOf(activeSrc) === -1) return false;
    if (activeCat !== 'all' && item.cat !== activeCat) return false;
    if (activeUrg !== 'all' && item.urgency !== activeUrg) return false;
    return true;
  });

  document.getElementById('emptyState').style.display = filtered.length ? 'none' : 'block';

  var html = '';
  filtered.forEach(function(item) {
    var color = CATEGORY_COLORS[item.cat] || '#888';
    var chartFlag = '';
    if (item.charts && item.charts.hot) chartFlag = '🔥';
    else if (item.charts && item.charts.count > 0) chartFlag = '📊';
    var openClass = activeSrc ? ' open' : '';

    html += '<div class="card' + openClass + '" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">#' + item.id + '</span>';
    html += '<span class="urg">' + URGENCY_META[item.urgency].emoji + '</span>';
    html += '<span class="src-badge" style="background:' + color + '">' + esc(item.source.split(' — ')[0]) + '</span>';
    html += '<span class="cat-tag">' + esc(item.cat) + '</span>';
    if (chartFlag) html += '<span class="chart-flag">' + chartFlag + '</span>';
    html += '<span class="title">' + esc(item.title) + '</span>';
    html += '</div>';

    html += '<div class="card-body">';
    html += '<div class="section-label">The Idea</div>';
    html += '<div class="idea-text">' + esc(item.idea) + '</div>';
    html += '<div class="section-label">My Angle</div>';
    html += '<div class="angle-box" style="border-left:2px solid ' + color + ';background:' + color + '14;">' + esc(item.angle) + '</div>';

    html += '<div class="tweets">';
    html += '<div class="tweet-box"><div class="tweet-label" style="color:#378add;">TWEET A</div><div class="tweet-text">' + esc(item.tweetA) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet-box"><div class="tweet-label" style="color:#7f77dd;">TWEET B</div><div class="tweet-text">' + esc(item.tweetB) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';

    if (item.charts) {
      html += '<div class="chart-block' + (item.charts.hot ? ' hot' : '') + '">📊 Charts: ' + item.charts.count + ' — ' + esc(item.charts.desc) + '</div>';
    }

    html += '<div class="link-row"><a href="' + esc(item.link) + '" target="_blank">↗ Read full article</a></div>';
    html += '</div>'; // card-body
    html += '</div>'; // card
  });

  container.innerHTML = html;
}

function renderReport() {
  var body = document.getElementById('reportBody');
  var html = '';
  html += '<h4>Time Window</h4>';
  html += '<div>' + esc(META.windowStart) + ' &rarr; ' + esc(META.windowEnd) + '. Emails outside this window were not processed.</div>';
  html += '<h4>Totals</h4>';
  html += '<div>' + META.emailsInWindow + ' emails in window &middot; ' + META.emailsRead + ' read &middot; ' + META.itemsExtracted + ' items extracted</div>';
  html += '<h4>Included Sources</h4>';
  html += '<ul class="plain">';
  META.includedSources.forEach(function(s) {
    html += '<li><button class="src-link" onclick="filterBySrc(\'' + esc(s.name) + '\')">' + esc(s.name) + '</button> — ' + s.count + ' item' + (s.count === 1 ? '' : 's') + '</li>';
  });
  html += '</ul>';
  html += '<h4>Skipped Sources</h4>';
  META.skippedSources.forEach(function(s) {
    html += '<div class="skip-item">' + esc(s.name) + ' — ' + esc(s.reason) + '</div>';
  });
  body.innerHTML = html;
}

document.getElementById('metaLine').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails';
document.getElementById('reportToggle').addEventListener('click', function() {
  var box = document.getElementById('reportBox');
  box.classList.toggle('open');
  document.getElementById('reportChevron').textContent = box.classList.contains('open') ? '▾' : '▸';
});

renderFilters();
renderCards();
renderReport();
</script>
