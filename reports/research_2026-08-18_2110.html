function buildFilters(){
  const catCounts = {};
  ITEMS.forEach(i => { catCounts[i.cat] = (catCounts[i.cat]||0)+1; });
  const catWrap = document.getElementById('cat-filters');
  let html = '<button class="pill active" data-cat="all" onclick="setCat(\'all\')">All (' + ITEMS.length + ')</button>';
  Object.keys(CAT_LABELS).forEach(c => {
    if(!catCounts[c]) return;
    html += '<button class="pill" data-cat="' + c + '" onclick="setCat(\'' + c + '\')">' + CAT_LABELS[c] + ' (' + catCounts[c] + ')</button>';

  Object.keys(URG_LABELS).forEach(u => {
    if(!urgCounts[u]) return;

  });
  urgWrap.innerHTML = uhtml;
}

function setCat(c){
  activeCat = c; activeSrc = null;
  document.querySelectorAll('#cat-filters .pill').forEach(function(p){
    const isActive = p.getAttribute('data-cat') === c;
    p.classList.toggle('active', isActive);
    p.style.background = isActive && c !== 'all' ? CAT_COLORS[c] : (isActive ? '#333' : 'transparent');
    p.style.color = isActive ? '#fff' : '';
  });
  collapseAll();
  render();
}
function setUrg(u){
  activeUrg = u; activeSrc = null;
  document.querySelectorAll('#urg-filters .pill').forEach(function(p){
    const isActive = p.getAttribute('data-urg') === u;
    p.classList.toggle('active', isActive);
    p.style.background = isActive ? '#333' : 'transparent';
    p.style.color = isActive ? '#fff' : '';
  });
  collapseAll();
  render();
}
function filterBySrc(name){
  activeSrc = name; activeCat = 'all'; activeUrg = 'all';
  document.querySelectorAll('#cat-filters .pill, #urg-filters .pill').forEach(function(p){
    p.classList.remove('active'); p.style.background='transparent'; p.style.color='';
  });
  document.querySelector('#cat-filters .pill[data-cat="all"]').classList.add('active');
  document.querySelector('#urg-filters .pill[data-urg="all"]').classList.add('active');
  render(true);
  document.getElementById('cards').scrollIntoView({behavior:'smooth'});
}

function collapseAll(){
  document.querySelectorAll('.card').forEach(function(c){ c.classList.remove('open'); });
}

function render(expandMatches){
  const wrap = document.getElementById('cards');
  const empty = document.getElementById('results-empty');
  let html = '';
  let shown = 0;
  ITEMS.forEach(function(item){
    let match = true;
    if(activeCat !== 'all' && item.cat !== activeCat) match = false;
    if(activeUrg !== 'all' && item.urgency !== activeUrg) match = false;
    if(activeSrc && item.source.indexOf(activeSrc) === -1) match = false;
    if(!match) return;
    shown++;
    const urgEmoji = item.urgency === 'act' ? '🔴' : (item.urgency === 'deep' ? '🔵' : '🟡');
    const chartFlag = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');
    const openCls = (activeSrc && expandMatches) ? ' open' : '';
    html += '<div class="card' + openCls + '" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">#' + item.id + '</span>';
    html += '<span class="urg">' + urgEmoji + '</span>';
    html += '<span class="badge-src" style="background:' + CAT_COLORS[item.cat] + '">' + item.source + '</span>';
    html += '<span class="badge-cat">' + CAT_LABELS[item.cat] + '</span>';
    if(chartFlag) html += '<span class="chart-flag">' + chartFlag + '</span>';
    html += '<span class="card-title">' + item.title + '</span>';
    html += '<span class="chev">▸</span>';
    html += '</div>';
    html += '<div class="card-body">';
    html += '<div class="block-label">The Idea</div><div class="idea-text">' + item.idea + '</div>';
    html += '<div class="block-label">My Angle</div><div class="angle-box" style="border-color:' + CAT_COLORS[item.cat] + '; background:' + CAT_COLORS[item.cat] + '14;">' + item.angle + '</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet"><div class="tweet-head"><span class="tweet-label a">TWEET A</span><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div><div class="tweet-text">' + item.tweetA + '</div></div>';
    html += '<div class="tweet"><div class="tweet-head"><span class="tweet-label b">TWEET B</span><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div><div class="tweet-text">' + item.tweetB + '</div></div>';
    html += '</div>';
    if(item.charts.count > 0 || item.charts.desc){
      html += '<div class="chart-box' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '🔥 CHART WORTH SAVING — ' : '📊 ') + (item.charts.desc || (item.charts.count + ' chart(s) in article')) + '</div>';
    }
    html += '<div class="link-row"><a href="' + item.link + '" target="_blank" rel="noopener">↗ Read full article</a></div>';
    html += '</div></div>';
  });
  wrap.innerHTML = html;
  empty.style.display = shown === 0 ? 'block' : 'none';
}

function toggleCard(id){
  const el = document.getElementById('card-' + id);
  el.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

}
