{ id:17, cat:"geopolitics", urgency:"deep", source:"Bloomberg Points of Return (John Authers)",

  idea:"US-Canada talks collapsed and Washington levied 50% tariffs; Carney responded with matching 50% retaliatory tariffs and a defiant speech ('America is trying to break us so they can own us... that will never happen'), noting Canada supplies 99% of US natural gas imports, 85% of electricity imports and 60% of crude oil imports — and Canada has overtaken China again as America's largest trading partner in the past year, partly because China has been diversifying exports elsewhere.",

  tweetA:"Carney's leverage pitch: 99% of US gas imports, 85% of electricity imports, 60% of crude imports come from Canada. That's real, but it's not rare-earths-style scarce — the US can source alternatives slower and at a cost, not never. China's leverage was structural. Canada's is just expensive to replace.",

{ id:18, cat:"positioning", urgency:"deep", source:"Bloomberg Points of Return (John Authers)",
  title:"Fix SPIVA's methodology and 'active managers always lose' drops from 99% to 55%",
  idea:"The latest SPIVA report shows 87% of US equity funds lagged their index over 10 years after fees, with the last year a majority of active funds beat the S&P being 2009 — but a Notre Dame-led academic paper found SPIVA's methodology (survivorship treatment, equal-weighting funds regardless of size, comparing against zero-cost hypothetical benchmarks) overstates the case; adjusted for those issues, the proportion of funds lagging over 5 years drops from 73.7% to 56.2%, and over 20 years from 99.2% to 55%.",
  angle:"The passive-investing 'debate is over' consensus rests partly on a methodology that academics say meaningfully overstates active underperformance — worth revisiting allocator assumptions that treat SPIVA's headline numbers as gospel.",
  tweetA:"SPIVA says 99.2% of active funds lost to the index over 20 years. Fix the methodology — survivorship bias, equal-weighting tiny funds same as giants, comparing to a zero-cost fantasy benchmark — and that number drops to 55%. Still bad for active managers. Not the near-total wipeout everyone quotes.",
  tweetB:"The passive-investing thesis has basically won the argument for retail. But an academic paper just showed the flagship stat behind it (99.2% underperformance) is a methodology artifact more than half the size once you correct it. Worth remembering the next time someone cites SPIVA as settled science.",
  charts:{count:1, hot:true, desc:"🔥 CHART WORTH SAVING — SPIVA 10-year active underperformance chart, plus the Cremers et al. corrected comparison."},
  link:"https://www.bloomberg.com/opinion/newsletters/2026-08-24/canada-trade-war-an-elbow-in-the-face-may-get-us-attention" },

{ id:19, cat:"positioning", urgency:"deep", source:"Bloomberg Points of Return (John Authers)",
  title:"High dispersion didn't help active managers because it was five stocks, not the market",
  idea:"Authers notes 2025 saw the highest stock dispersion since 2009, which should have let active managers shine, but the outperformance was so concentrated in the top five stocks that managers had to overweight those same names to keep pace, unbalancing their portfolios anyway — and cites a colleague's argument that the sheer scale of passive money is itself making mega-caps bigger, making future outperformance even harder.",
  angle:"This connects directly to Savone's dispersion call elsewhere in this batch — high dispersion doesn't automatically help active managers if the dispersion is itself concentrated in five stocks everyone already owns via passive flows.",
  tweetA:"2025 had the highest stock dispersion since 2009 — the exact setup that's supposed to let stockpickers win. They didn't, because the dispersion was five stocks pulling away from everyone else, and passive flows keep making those five bigger. Dispersion doesn't help you if it's concentrated in names you already own.",
  tweetB:"There's a feedback loop nobody prices: passive funds buy the index, the index is increasingly five stocks, so passive buying makes those five stocks bigger, which makes the index even more those five stocks. At some point 'passive' and 'concentrated bet on five names' become the same trade.",

  });
  urgBar.innerHTML = uhtml;

  document.getElementById('metaLine').textContent = META.date + '  ·  ' + META.time + '  ·  ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources';
}

function setCat(c){ activeCat = c; activeSrc = null; renderFilters(); renderCards(); }
function setUrg(u){ activeUrg = u; activeSrc = null; renderFilters(); renderCards(); }
function filterBySrc(name){
  activeSrc = name; activeCat = "all"; activeUrg = "all";
  renderFilters(); renderCards();
  ITEMS.forEach(function(item){
    if(item.source.indexOf(name) !== -1){
      const el = document.getElementById('card-' + item.id);
      if(el) el.classList.add('open');
    }
  });
}

function toggleCard(id){
  const el = document.getElementById('card-' + id);
  el.classList.toggle('open');
}

function renderCards(){
  const container = document.getElementById('cards');
  let html = '';
  ITEMS.forEach(function(item, idx){
    if(activeCat !== 'all' && item.cat !== activeCat) return;
    if(activeUrg !== 'all' && item.urgency !== activeUrg) return;
    if(activeSrc && item.source.indexOf(activeSrc) === -1) return;
    const color = CAT_COLORS[item.cat] || "#888";
    const urg = URG_META[item.urgency];
    const chartFlag = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');
    html += '<div class="card" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx idx-arrow">' + String(idx+1).padStart(2,'0') + '</span>';
    html += '<span class="urg">' + urg.emoji + '</span>';
    html += '<span class="badge" style="background:' + color + '">' + item.source.split(' (')[0] + '</span>';
    html += '<span class="catpill">' + item.cat + '</span>';
    if(chartFlag) html += '<span class="chartflag">' + chartFlag + '</span>';
    html += '<span class="title">' + item.title + '</span>';
    html += '</div>';
    html += '<div class="card-body">';
    html += '<div class="section-label">The Idea</div><div class="idea-text">' + item.idea + '</div>';
    html += '<div class="section-label">My Angle</div><div class="angle-box" style="border-color:' + color + ';background:' + color + '14;">' + item.angle + '</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    html += '<div class="charts-box' + (item.charts.hot?' hot':'') + '">' + (item.charts.count>0 ? (item.charts.count + ' chart(s) — ') : '') + item.charts.desc + '</div>';
    html += '<div class="link-row"><a href="' + item.link + '" target="_blank" rel="noopener">↗ Read full article</a></div>';
    html += '</div>';
    html += '</div>';
  });
  if(!html) html = '<div style="text-align:center;color:#948e84;padding:40px 0;">No items match this filter.</div>';
  container.innerHTML = html;
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function renderReport(){
  var body = document.getElementById('reportBody');
  var html = '';
  html += '<div><strong>Window:</strong> ' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</div>';
  html += '<div style="margin-top:6px;"><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp;·&nbsp; <strong>Emails read:</strong> ' + META.emailsRead + ' &nbsp;·&nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</div>';
  html += '<h4>Included Sources (click to filter)</h4>';
  META.includedSources.forEach(function(s){
    html += '<div><span class="srcline" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span> — ' + s.count + ' item(s)</div>';
  });
  html += '<h4>Skipped Sources</h4>';
  if(META.skippedSources.length === 0){
    html += '<div class="skiprow">None — all in-window emails were substantive and processed.</div>';
  }
  META.skippedSources.forEach(function(s){
    html += '<div class="skiprow"><strong>' + s.name + '</strong> — ' + s.reason + '</div>';
  });
  body.innerHTML = html;
}

renderFilters();
renderCards();
renderReport();
</script>
</body>
</html>
