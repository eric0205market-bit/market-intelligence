<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DATA POINT TAGS */
.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>

<script>
const REPORT_DATA = {"freshness_gate": "FRESHNESS GATE PASSED.", "report_type": "TWITTER BANK RESEARCH", "collected_at": "2026-11-09T06:24:25Z", "window_days": 4, "input_stats": {"total_tweets": 120, "considered": 120, "kept": 47, "dropped": 73, "deduped": 0}, "summary": "Goldman dominates the window (20 of 47 items): AI/tech de-rating, heavy put demand and hedge-fund de-grossing.\nBofA/Hartnett Flow Show, Citadel flow data and Deutsche positioning charts describe the post-selloff positioning backdrop.\nValuation charts recur across Yardeni, Deutsche, BNP and Goldman (Nasdaq 100, semiconductors, Mag 7, ex-US).\nMacro/growth charts from Morgan Stanley, HSBC, JPM and Citi cover nominal GDP, the CPI/PPI week ahead and the economic surprise index.\nCounts: Goldman 20, Morgan Stanley 5, BofA 4, Citadel 4, Deutsche 3, HSBC 3, JPM 3, Yardeni 3, BNP 1, Citi 1, Nomura 1.", "by_bank_counts": {"Goldman": 20, "Morgan Stanley": 5, "BofA": 4, "Citadel": 4, "Deutsche": 3, "HSBC": 3, "JPM": 3, "Yardeni": 3, "BNP": 1, "Citi": 1, "Nomura": 1}, "banks": [{"bank": "Goldman", "theme": "Goldman — AI/tech de-rating, record put demand and vol panic, hedge-fund de-grossing, 8000 target", "items": [{"author": "eliant_capital", "text": "Goldman Sachs’ High Beta Momentum Pair has now suffered a staggering 50% drawdown, the worst in the 15-year history of the dataset, surpassing even the '21–'22 collapse https://t.co/qLSZhdB4ec", "tweet_url": "https://x.com/eliant_capital/status/2119558894271734095", "images": ["https://pbs.twimg.com/media/HWovdF2XAAAZ3aV.jpg"], "created_at": "2026-11-08T22:33:14.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: From a flow perspective, the demand for protection Thursday was astounding. Over 11mm puts traded, the largest put volume day on record, surpassing the previous high in Apr ’25. https://t.co/Vlvd3S9Geq", "tweet_url": "https://x.com/neilsethinew/status/2119437285712367830", "images": ["https://pbs.twimg.com/media/HWkhffXWUAAqMKP.jpg"], "created_at": "2026-11-08T14:30:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Morgan Stanley’s Mike Wilson (Strategy Data Pack, Friday) says the S&P 500 “catching down” to weaker breadth “is likely the final stage of this correction,\" after he rightly called a continuation of the pullback in semi's in the event of a big Democratic victory.\n\nBut he isn’t calling the bottom yet: “We are getting close, but would like to see… further confirmation from our sentiment indicator.” His year-end target stays 8,000.\n\nHere's what’s happened to the three “clearing events” he laid out last weekend:\n\n▪️ Midterms: Democrats took both chambers, with at least 54 Senate seats. Wilson had said a 52-48 Senate was priced in but 55-45 wasn’t, and that a bigger margin could fuel pushback on data centers, so he nailed that.\n▪️ AI and semis: Thursday was the S&P’s worst day since April 2025 (−4.4%) and the Nasdaq-100’s worst since March 2020 (−6.4%). The SOX fell about 12% on weak chip guidance and fears of data-center rules after the election. That left it down about 19% from October 26, when Wilson called for another 10% to 15% drop into mid-November, another hit.\n▪️ Liquidity, the one he ranks most important, hasn’t cleared. He says Fed Chair Warsh acknowledged financial conditions are doing some of the Fed’s tightening but wouldn’t call them “tight,” so the bar for a dovish pivot “remains high.” Then Friday’s payrolls (+165,000 vs. ~65,000 expected) pushed December hike odds to about 78%.\n\nThe math from Friday’s close of 7,376.86 (−5.7% from the record, −2.7% on the week):\n▪️ 7,100 to 7,200 is another 2.4% to 3.8% down.\n▪️ 8,000 is +8.4% from here. His 12-month base case is 8,300 (+12.5%), with a 5,900 bear case and 9,400 bull case.\n\nOn the catch-down, as he also indicated was likely, the average stock is holding up better than the index:\n▪️ Thursday, the equal-weight S&P fell 2.9% vs. 4.4% for the cap-weighted index.\n▪️ In October, equal-weight beat cap-weight by 5.9 points, the second-widest monthly gap since 2003.\n▪️ Wilson notes median Russell 3000 earnings growth is running 14%, the strongest in four years.\n\nHis sentiment indicator was at −0.75 as of Thursday. That compares with roughly −1.45 at the Iran-war low earlier this year and about −2.1 on Liberation Day.", "tweet_url": "https://x.com/neilsethinew/status/2119429736703123757", "images": ["https://pbs.twimg.com/media/HWkjKlgXoAAg0wQ.jpg"], "created_at": "2026-11-08T14:00:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman:  Our vol panic index surged to 9.57 out of 10 (back in the panic zone of 9.5+). This move registered as the 3rd largest daily jump ever, which followed Wednesday’s huge decline (4th largest drop). The combined two-day swing was the largest on record, which shows how quickly the market went from relief to outright panic.\n\nClients had aggressively taken off protection into Wednesday’s post-midterm relief rally, leaving the market underhedged heading into Thursday’s reversal. As equities unwound and forced liquidations emerged across the HF community, we saw a scramble to buy back protection that was just sold.", "tweet_url": "https://x.com/neilsethinew/status/2119422184829423929", "images": ["https://pbs.twimg.com/media/HWjvGSwWQAA4tKS.jpg"], "created_at": "2026-11-08T13:30:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Nasdaq 100 de-rates further to just 20x... it was a stone's throw from 30x a year ago GS\n\nS&amp;P MidCap 400 just 14x earnings (historically cheap)... and those aren't big AI semis either... https://t.co/01Onbr6Zkb", "tweet_url": "https://x.com/MikeZaccardi/status/2119421179119247438", "images": ["https://pbs.twimg.com/media/HWmyVMFWwAApvyM.jpg"], "created_at": "2026-11-08T13:26:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "As tech earnings uncertainty escalates, SPX 'median company' EPS growth should be more consistent and predictable.. 10-12%ish? GS https://t.co/rhbGwWFXRa", "tweet_url": "https://x.com/MikeZaccardi/status/2119418662499021153", "images": ["https://pbs.twimg.com/media/HWmwCtdWgAA0Ba_.png"], "created_at": "2026-11-08T13:16:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman notes in that regard (the 6-month relative underperformance of AI) that last week \"Info Tech was by far the most $ net sold global (and US) sector ... net sold across all regions, driven by long-and-short sales (2.2 to 1). \n\n\"In % terms, [the] week’s selling in global Tech stocks was ~on par with what we saw in mid-October and Sep ‘24 as the largest net selling weeks on our record (since 2016). Also worth noting that 4 the top 5 net selling weeks in global Info Tech on our record have occurred within the past five months. \n\n\"Semis & Semi Equip and to a lesser extent Tech Hardware were the most net sold global subsectors within Info Tech, while Software was the most net bought. US Info Tech net allocation (as % of total US net MV) now stands at 14.4%, approaching multi-year lows in the 1st/1st/3rd percentiles on a 1-year/3-year/5-year lookback.\"", "tweet_url": "https://x.com/neilsethinew/status/2119407089567383735", "images": ["https://pbs.twimg.com/media/HWkgysaWoAAjYa5.png"], "created_at": "2026-11-08T12:30:01.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: One thing that isn't slowing is AI adoption by firms which rose by 0.8pp to 24.6% among US establishments (with adoption expected to rise to 28.6% in the next 6 months) according to the Census Bureau’s Business Trends and Outlook Survey (BTOS). \n\nAdoption is approaching 50% in the information, professional, and finance sectors. At a detailed subsector level, computing, securities, and publishing firms continue to lead adoption.", "tweet_url": "https://x.com/neilsethinew/status/2119165494800613426", "images": ["https://pbs.twimg.com/media/HWi4JLdXUAAOwfw.png"], "created_at": "2026-11-07T20:30:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "AI concerns mounting, but the consensus still calls for 27% Nasdaq 100 EPS growth in CY 2027 GS https://t.co/bJx4RL1lY9", "tweet_url": "https://x.com/MikeZaccardi/status/2119103334866964932", "images": ["https://pbs.twimg.com/media/HWiRQOtWYAA2s5o.png"], "created_at": "2026-11-07T16:23:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: Outside of the very short-term trading pattern around the IPO, SpaceX has had a much smaller impact on equity indices than many investors expected. \n\nAmong major US equity indices, SpaceX carries the largest weight within the Nasdaq-100. Excluding SpaceX, the P/E of the Nasdaq-100 would be less than half a turn lower than its current multiple. Furthermore, the inclusion of SpaceX has not had a major effect on the Nasdaq-100 index return, volatility, or concentration. \n\nCoincidentally, the limited fundamental impact of SpaceX index inclusion has been reminiscent of Tesla's 2020 inclusion in the S&P 500, when the stock had only a minor impact on index valuation.", "tweet_url": "https://x.com/neilsethinew/status/2119097293240435122", "images": ["https://pbs.twimg.com/media/HWfWtEFXYAAATaw.png"], "created_at": "2026-11-07T15:59:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "ooh.. equity correlation ticked up on Thursday... will that be a 2027 trend? GS https://t.co/ijCuaLFlmd", "tweet_url": "https://x.com/MikeZaccardi/status/2119090248336523719", "images": ["https://pbs.twimg.com/media/HWiFWgyW0AA5GR_.png"], "created_at": "2026-11-07T15:31:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "S&amp;P 500 breadth improved markedly... but that's not always bullish GS https://t.co/e9bH3qQofB", "tweet_url": "https://x.com/MikeZaccardi/status/2119084460121415826", "images": ["https://pbs.twimg.com/media/HWiAFlqWgAEVQlK.png"], "created_at": "2026-11-07T15:08:00.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"The KOSPI semiconductor sector's FY3 P/B has fallen to a historical low of around 0.7x, a level that has historically indicated a bottom of semi cycle and implied encouraging forward returns\"\n\n-Goldman Sachs via @MikeZaccardi https://t.co/8rM1AlfkNV", "tweet_url": "https://x.com/dailychartbook/status/2119083040110506138", "images": ["https://pbs.twimg.com/media/HWh-y2BWUAAkkYo.jpg"], "created_at": "2026-11-07T15:02:22.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "More flows into money markets in the last 12 months than stocks GS https://t.co/gWrZYKsMQ0", "tweet_url": "https://x.com/MikeZaccardi/status/2119071373641326678", "images": ["https://pbs.twimg.com/media/HWh0L3LX0AAsoGb.png"], "created_at": "2026-11-07T14:16:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "The biggest losers last week were some of the year's biggest winners GS\n\nMedian SPX stock was ~unch.. trading 18x P/E and growing EPS by 12% https://t.co/UOzndSn1SZ", "tweet_url": "https://x.com/MikeZaccardi/status/2119063824330346842", "images": ["https://pbs.twimg.com/media/HWhtUaaWoAAp1OI.jpg"], "created_at": "2026-11-07T13:46:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Even before the elections Goldman was seeing a peak in the AI buildout:\n\nQ3 results support our view that AI investment spending will continue to grow but that the growth rate of AI capex is peaking. \n\nThe hyperscalers are on track to spend roughly $800 billion in capex this year (+96% year/year) and analyst estimates suggest that spending will grow to $1.2 trillion in 2027 (+44%). Those estimates remained fairly stable this reporting season, in contrast with the pattern of upward revisions in recent quarters. \n\nReflecting the likely deceleration in AI capex growth, analyst estimates show earnings growth for S&P 500 AI infrastructure stocks peaking at 80% this quarter and slowing to roughly 40% in 2027.", "tweet_url": "https://x.com/neilsethinew/status/2119059799539171732", "images": ["https://pbs.twimg.com/media/HWfWIObWoAAyspZ.jpg"], "created_at": "2026-11-07T13:30:01.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "The sellside sees a 25% SPX return over the next 12 months... too sanguine? GS https://t.co/o1RMyy2uMH", "tweet_url": "https://x.com/MikeZaccardi/status/2119056274591474171", "images": ["https://pbs.twimg.com/media/HWhmc90WQAACZst.png"], "created_at": "2026-11-07T13:16:00.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"Per GS, HFs sold AI stocks at the fastest pace in over 5-years &amp; on a trailing 20-day basis, HF selling reached a 5-year extreme at -3.0 SDs\"\n\nGoldman Sachs via @eliant_capital https://t.co/UpoPm9dvSL", "tweet_url": "https://x.com/dailychartbook/status/2119053087973187950", "images": ["https://pbs.twimg.com/media/HWhjjdLW8AAQb1C.jpg"], "created_at": "2026-11-07T13:03:20.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "The S&amp;P 500 needs to rip in the next 8 weeks to hit Goldman's 8000 target https://t.co/uJeRcW6GRv", "tweet_url": "https://x.com/MikeZaccardi/status/2119048724248731687", "images": ["https://pbs.twimg.com/media/HWhflgKWoAAi7xl.png"], "created_at": "2026-11-07T12:46:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman’s latest update notes that through Thursday US Fundamental Long/Short (L/S) Gross leverage fell 8.7 pts – the largest weekly decline since Covid (March ’20) – to the 26th percentile one-year, while US Fundamental L/S Net leverage fell 3.7 pts – the largest weekly decline since the week of liberation day (Apr ’25) – back down to the 0th percentile five-year.\n\nAnd while last week I had noted that the beta-adjusted figures were much higher (beta-adjusted net leverage was 63.9%, only at the 41st percentile over three years and the 53rd over five, vs. the 5th for raw net), meaning there was more risk in hedge fund books than it appeared, those dropped sharply to 57.4% (−6.4 pts), the 0th percentile one-year, the 4th over three years and the 22nd over five. \n\nBeta-adjusted gross fell even more, down 15.7 pts to 213.2%, the 0th percentile one-year and the 5th over three years (from the 69th). \n\nBack of the envelope, their longs’ average beta slipped to about 1.08 from 1.11, meaning they mostly sold their highest-beta longs (AI/semis). The hidden risk finally came out of the books.", "tweet_url": "https://x.com/neilsethinew/status/2119044700913246522", "images": ["https://pbs.twimg.com/media/HWfTXlrWUAAHUl7.jpg"], "created_at": "2026-11-07T12:30:01.000Z", "relayers": []}]}, {"bank": "Morgan Stanley", "theme": "Morgan Stanley — Wilson on breadth catch-down; earnings-driven global gains, nominal GDP and productivity", "items": [{"author": "neilsethinew", "text": "Morgan Stanley’s Mike Wilson (Strategy Data Pack, Friday) says the S&P 500 “catching down” to weaker breadth “is likely the final stage of this correction,\" after he rightly called a continuation of the pullback in semi's in the event of a big Democratic victory.\n\nBut he isn’t calling the bottom yet: “We are getting close, but would like to see… further confirmation from our sentiment indicator.” His year-end target stays 8,000.\n\nHere's what’s happened to the three “clearing events” he laid out last weekend:\n\n▪️ Midterms: Democrats took both chambers, with at least 54 Senate seats. Wilson had said a 52-48 Senate was priced in but 55-45 wasn’t, and that a bigger margin could fuel pushback on data centers, so he nailed that.\n▪️ AI and semis: Thursday was the S&P’s worst day since April 2025 (−4.4%) and the Nasdaq-100’s worst since March 2020 (−6.4%). The SOX fell about 12% on weak chip guidance and fears of data-center rules after the election. That left it down about 19% from October 26, when Wilson called for another 10% to 15% drop into mid-November, another hit.\n▪️ Liquidity, the one he ranks most important, hasn’t cleared. He says Fed Chair Warsh acknowledged financial conditions are doing some of the Fed’s tightening but wouldn’t call them “tight,” so the bar for a dovish pivot “remains high.” Then Friday’s payrolls (+165,000 vs. ~65,000 expected) pushed December hike odds to about 78%.\n\nThe math from Friday’s close of 7,376.86 (−5.7% from the record, −2.7% on the week):\n▪️ 7,100 to 7,200 is another 2.4% to 3.8% down.\n▪️ 8,000 is +8.4% from here. His 12-month base case is 8,300 (+12.5%), with a 5,900 bear case and 9,400 bull case.\n\nOn the catch-down, as he also indicated was likely, the average stock is holding up better than the index:\n▪️ Thursday, the equal-weight S&P fell 2.9% vs. 4.4% for the cap-weighted index.\n▪️ In October, equal-weight beat cap-weight by 5.9 points, the second-widest monthly gap since 2003.\n▪️ Wilson notes median Russell 3000 earnings growth is running 14%, the strongest in four years.\n\nHis sentiment indicator was at −0.75 as of Thursday. That compares with roughly −1.45 at the Iran-war low earlier this year and about −2.1 on Liberation Day.", "tweet_url": "https://x.com/neilsethinew/status/2119429736703123757", "images": ["https://pbs.twimg.com/media/HWkjKlgXoAAg0wQ.jpg"], "created_at": "2026-11-08T14:00:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "MS: 2026 global equity gains are being driven by raw earnings power, not multiple expansion.\n\nYTD, MSCI ACWI 12-month forward EPS is up 30%, while the forward P/E has contracted 14%—signaling strong current fundamentals alongside an ongoing debate over AI earnings sustainability. https://t.co/JlU2MgmTAG", "tweet_url": "https://x.com/MikeZaccardi/status/2119088235066376447", "images": ["https://pbs.twimg.com/media/HWiDhUCWIAAuSrR.jpg"], "created_at": "2026-11-07T15:23:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "MS: Strong Productivity Supports Growth Without Reigniting Inflation https://t.co/tuXLUWU8De", "tweet_url": "https://x.com/MikeZaccardi/status/2119076916544086120", "images": ["https://pbs.twimg.com/media/HWh5OI-WMAAKCK_.jpg"], "created_at": "2026-11-07T14:38:02.000Z", "relayers": []}, {"author": "MikeZ unds everything”) broke $200. It closed Friday at $186.64.\n▪ TSMC (“sees everything”) broke $400. It closed at $375.44.\n▪ The Magnificent 7 ETF, MAGS (“controls everything”), broke $70. It closed at $67.53.\n\n“But so long as recession odds stay low,” meaning banks (IXG) hold $125, mid-caps (MDY) $666 and junk bonds (JNK) $92, he says the S&P 500 holds above 7,000 and “risk rotates (tech bonds, Europe, China, consumer...), no retreat.”\n\nWhere those lines stood at Friday’s close:\n\n▪ Banks (IXG): $130.05, 4.0% above $125.\n▪ Mid-caps (MDY): $657.82, 1.2% below $666, a second straight close under the line.\n▪ Junk bonds (JNK): $92.70, 0.8% above $92. It hasn’t closed below $92 since April 2025.\n▪ S&P 500: 7,377, 5.4% above 7,000.", "tweet_url": "https://x.com/neilsethinew/status/2119074897020531073", "images": ["https://pbs.twimg.com/media/HWfOP5dXAAAKLao.jpg"], "created_at": "2026-11-07T14:30:00.000Z", "relayers": []}]}, {"bank": "Citadel", "theme": "Citadel — record equity buying, buyback window, retail inflows, midterm analog", "items": [{"author": "MikeZaccardi", "text": "S&amp;P 500 not following the typical midterm analog all that well so far... we should be well into rally-mode by now. Citadel Rubner https://t.co/oaYsF13kk5", "tweet_url": "https://x.com/MikeZaccardi/status/2119416145899917554", "images": ["https://pbs.twimg.com/media/HWmtwOnWAAEiNgM.jpg"], "created_at": "2026-11-08T13:06:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Buyback window is wide open. It's now or never. Citadel Rubner \n\nOctober alone saw $166B of new buyback authorizations, more than twice its historical average https://t.co/7a9o1k1eph", "tweet_url": "https://x.com/MikeZaccardi/status/2119112920315339093", "images": ["https://pbs.twimg.com/media/HWiZ-LQWQAAy4qV.png"], "created_at": "2026-11-07T17:01:06.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Citadel Rubner: YTD net equity buying has reached a record $251B, surpassing the previous full-year // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
