<script>
const ITEMS = [{"cat": "macro", "urgency": "deep", "source": "Authers / Bloomberg Points of Return", "title": "2018 is the template for the midterm tape: turbulence, then a Fed pivot buying opportunity", "idea": "Authers maps 2018 onto 2026: Trump in the White House, a tax-cut earnings boom (fwd S&P EPS ~+20% y/y then), a new Fed chair (Warsh) shrinking the balance sheet. In 2018 markets priced 3% funds by end-2019 and got 1.5% after the Christmas Eve selloff forced the Powell Pivot. Longview's Colvin: 3-6 months of sideways and higher vol until the front end resets.", "angle": "The replay only works if something forces the Fed to blink. Today there is an oil shock and the market prices three more hikes by mid-2027, so the pivot trigger is much further away.", "tweetA": "2018 ended with a Fed pivot because stocks broke first. This time the Fed is pricing three more hikes into an oil shock. Who blinks first, the equity market or Warsh?", "tweetB": "The 2018 analogy has a hole: back then the 10y was far below the S&P earnings yield. Now bonds have surged and the equity safety net is gone. Same politics, completely different valuation floor. $SPY $TLT", "charts": {"count": 8, "hot": true, "desc": "Fed funds expectations 2018 vs now, consensus EPS paths 2017-18 vs 2025-26, earnings yield vs 10y. Several charts; the rate-expectations overlay tells the story."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-22/midterms-brace-for-a-market-mess-and-opportunity", "id": 1}, {"cat": "credit", "urgency": "deep", "source": "Authers / Bloomberg Points of Return", "title": "Hyperscaler CDS volume up 691% to a record $140B in 2026", "idea": "Trading volume in CDS tied to the 10 largest hyperscalers and chipmakers hit a record $140B through September, versus $17.7B a year earlier. Yet cash bond spreads show no stress. The pickup dates to hyperscalers turning free cash flow negative early in the year. SocGen: widening CDS coincides with falling forward P/Es, hyperscaler valuations near ChatGPT-launch levels.", "angle": "Equity says no worry, bonds say no worry, CDS volume says hedge. The cheapest place to express an AI capex doubt is the derivative nobody had to use before.", "tweetA": "CDS volume on the top-10 AI names went from $17.7B to $140B in a year while their cash bonds don't move. Someone is buying insurance on a house they publicly say is fireproof.", "tweetB": "SocGen's call is the part to notice: the buy signal for hyperscalers is a peak in CDS spreads, not an EPS beat. Credit sets the multiple now, and equity people are still reading the wrong tab. $MSFT $GOOGL $ORCL", "charts": {"count": 3, "hot": true, "desc": "Implicit default risk from hyperscaler CDS, and SocGen overlay of CDS spread vs 12m forward P/E. 🔥 CDS vs P/E chart."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-22/midterms-brace-for-a-market-mess-and-opportunity", "id": 2}, {"cat": "AI/infra", "urgency": "deep", "source": "Authers / Bloomberg Points of Return", "title": "Bloomberg Intelligence: $1.36T hyperscaler capex in 2026 (+~100%), $2T in 2027 including SpaceX", "idea": "BI's data-center model shows aggregate cloud backlog of ~$2.5T, driving 2026 capex to $1.36T, nearly double 2025, and $2T for 2027 with SpaceX as a new contributor. Authers' open question: do wider CDS spreads reflect credit quality or just investors demanding concession to absorb record issuance? SocGen stays underweight until 2H27 when FCF inflects.", "angle": "Backlog is the bull's anchor; funding is the bear's. A $2.5T backlog against negative FCF means the build is financed by capital markets appetite, not by customers.", "tweetA": "$1.36T this year, $2T next year, $2.5T of backlog behind it. The demand side is signed. The question nobody can answer is who funds the gap between signature and cash.", "tweetB": "Capex doubling in a year is the largest private investment surge since the railways. Railways had one thing the AI build doesn't: assets that last 50 years, not 5. $NVDA $AVGO", "charts": {"count": 2, "hot": false, "desc": "Hyperscaler capex 2025-2027 forecast and backlog. Charts inside — worth opening."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-22/midterms-brace-for-a-market-mess-and-opportunity", "id": 3}, {"cat": "macro", "urgency": "deep", "source": "Authers / Bloomberg Points of Return", "title": "Warsh starts with balance-sheet shrinkage and the market prices three more hikes by mid-2027", "idea": "Kevin Warsh opened by signalling a smaller Fed balance sheet and the year-end funds rate expectation jumped. Market still braced for three more hikes by mid-2027. Authers notes in 2018 the market bet Powell wouldn't be as hawkish and the language staying hawkish led to the brutal Christmas selloff.", "angle": "QT plus hikes plus oil shock. If Warsh is the 2018 Powell, the pivot comes only after a drawdown. Trade the path, not the destination.", "tweetA": "Three more hikes priced by mid-2027 with a new chair who wants a smaller balance sheet. Short end positioning is the most interesting risk in the book.", "tweetB": "2018: Fed priced for 3%, delivered 1.5%. Now: priced for three hikes. The size of that gap is the entire trade if the midterm turbulence arrives. $TLT $SHY", "charts": {"count": 1, "hot": false, "desc": "Bloomberg World Interest Rate Probability overlay for fed funds."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-22/midterms-brace-for-a-market-mess-and-opportunity", "id": 4}, {"cat": "macro", "urgency": "act", "source": "Authers / Bloomberg Points of Return", "title": "French 10-year yield tops 5% for the first time since 2002", "idea": "Authers flags French 10y yields above 5% for the first time since 2002 amid protests over the fiscal mess. A Bloomberg Opinion piece in the same issue argues the fiscal mess can only be solved with discipline.", "angle": "France crossing 5% while the Fed is expected to hike: the sovereign term premium is repricing everywhere and Europe is the weak link in the curve.", "tweetA": "France 10y above 5%. Last time was 2002. The Bund spread is the thing to watch, because it tells you whether this is a global term premium story or a French one.", "tweetB": "Everyone looks at the US 10y. Meanwhile a G7 sovereign just printed 5% with street protests attached. When fiscal and politics collide, bonds go first. $FXE", "charts": {"count": 0, "hot": false, "desc": "No chart in email; article links inside."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-22/midterms-brace-for-a-market-mess-and-opportunity", "id": 5}, {"cat": "geopolitics", "urgency": "act", "source": "Authers / Bloomberg Points of Return", "title": "US withdraws diplomats from Saudi Arabia amid Houthi attacks", "idea": "US ordered some diplomats out of Saudi Arabia and is withdrawing staff from Persian Gulf embassies amid Houthi attacks, listed in Authers' Points. Context: Iran war, Hormuz disruption and an oil shock all year.", "angle": "Embassy drawdowns are a leading indicator of escalation. HFIR and MacroEdge are independently flagging the same post-election window.", "tweetA": "Embassy staff leaving Saudi Arabia is the signal that doesn't show up in headlines until after the strike. Three different newsletters this morning are pointing to escalation. $XLE $OXY", "tweetB": "The US pulling diplomats from the Gulf while oil bulls call for a peace deal. One of those two is wrong. Check the flight and tanker data, not the press releases. $BNO", "charts": {"count": 0, "hot": false, "desc": "No chart."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-22/midterms-brace-for-a-market-mess-and-opportunity", "id": 6}, {"cat": "regulation", "urgency": "deep", "source": "Authers / Bloomberg Points of Return", "title": "California Prop 40 billionaire tax: Zuckerberg weighs leaving; Pictet says 'the music completely changes' if it passes", "idea": "Pictet's Luca Paolini flags California's Proposition 40 to tax billionaires, which prompted Zuckerberg to consider leaving the state. If the populist left gets taken seriously, tax rises and heavy AI regulation after 2028 become possible. Authers: higher taxes are not priced as a risk by markets, and they could endanger a 2019-style buying opportunity.", "angle": "The 2028 tax and AI regulation tail isn't in any multiple. Prop 40 is the first live test of whether founders actually leave.", "tweetA": "Markets price the Fed, oil and AI capex. Nobody prices the 2028 populist tax and AI regulation tail. California Prop 40 is the first real-money test of it.", "tweetB": "Zuckerberg considering leaving California is the move to watch. Domicile is the cheapest hedge a billionaire has, and the first to move tends to set the template. $META", "charts": {"count": 0, "hot": false, "desc": "No chart."}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-10-22/midterms-brace-for-a-market-mess-and-opportunity", "id": 7}, {"cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI Reality Check (AI-RTZ #1247)", "title": "Cloudflare: automated traffic passed human traffic in May 2026, 14 months ahead of forecast; 1,000x in five years", "idea": "Cloudflare's 2026 Founders' Letter says bots and agents overtook humans on its network in May 2026 versus a 2H27 forecast. Founders project automated traffic could reach 1,000x human traffic within five years. An agent checking 1,000 restaurant menus to recommend one serves 1,000 pages for a single customer.", "angle": "The unit of internet demand just changed from human to agent. Bandwidth, CDN and inference demand compounds off a base that is no longer people.", "tweetA": "Cloudflare: automated traffic passed human traffic 14 months early. One agent, 1,000 menus, 1 restaurant gets paid. The internet's demand curve is no longer attached to the human population. $NET", "tweetB": "Every 'AI is plateauing' take is measuring human queries. Machine-to-machine traffic is the denominator that isn't in anyone's capex model. 1,000x human traffic is a very different power bill. $NET $AKAM", "charts": {"count": 0, "hot": false, "desc": "No chart in email; Cloudflare letter linked inside."}, "link": "https://michaelparekh.substack.com/p/ai-ai-loops-101-part-3-beyond-ai", "id": 8}, {"cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI Reality Check (AI-RTZ #1247)", "title": "Google processes ~100 trillion tokens a day, up from 0.3T two years ago", "idea": "Google processes about 100T tokens/day (3.2 quadrillion/month per Pichai at I/O), up roughly 300x in two years, now the same order of magnitude as everything eight billion people write and say daily. Altman in Aug 2024: OpenAI ~100B words/day vs humanity's ~100T.", "angle": "A 300x two-year token ramp is the demand number behind the capex. Inference, not training, is the volume story.", "tweetA": "100 trillion tokens a day at Google. Two years ago: 0.3 trillion. That's a 300x. The capex debate treats this as an assumption when it's already a data series. $GOOGL", "tweetB": "Humans write ~100T words a day. Google alone now processes ~100T tokens a day. The machine-written internet already outproduces the human one on this metric.", "charts": {"count": 0, "hot": false, "desc": "No chart."}, "link": "https://michaelparekh.substack.com/p/ai-ai-loops-101-part-3-beyond-ai", "id": 9}, {"cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI Reality Check (AI-RTZ #1247)", "title": "A billion AI phones ≈ a gigawatt-class Vera Rubin cluster on paper", "idea": "Using the NYT's math, an iPhone 17 Pro does ~2.4 trillion calcs/sec. Times 1 billion GenAI-capable phones (Counterpoint, Q3 2026) = ~2.4 sextillion/sec, roughly what Parekh estimates for a gigawatt of Vera Rubin racks. Caveats: memory, battery, idle time. Microsoft's Surface Laptop Ultra with Nvidia RTX Spark runs a 27B-parameter open model entirely locally.", "angle": "Edge compute is an addition to data center demand, not a substitute. It also changes who pays for inference: the user's battery.", "tweetA": "A billion AI phones add up to one gigawatt of Vera Rubin on paper. The data center is not where most AI math will happen. It's where the most expensive AI math happens. $AAPL $QCOM", "tweetB": "Local 27B models on a laptop. 1B AI-capable phones. If inference moves to the edge, who captures the margin? Probably not the one with $1.36T of capex. $NVDA $MSFT", "charts": {"count": 0, "hot": false, "desc": "No chart in email."}, "link": "https://michaelparekh.substack.com/p/ai-ai-loops-101-part-3-beyond-ai", "id": 10}, {"cat": "tech", "urgency": "watch", "source": "Michael Parekh / AI Reality Check (AI-RTZ #1247)", "title": "TypeSafe Jev: $0.042 per million input tokens, output free ('too cheap to meter'); signups paused", "idea": "TypeSafe AI's Jev returns a typed value and a confidence score for software and agents rather than prose. Pricing: about 4 cents per million input tokens, nothing for output, versus more than a cent per call on a frontier LLM. Demand forced TypeSafe to pause new signups in late September. Parekh frames this as the first sign of hybrid AI with LLMs doing language and small models doing decisions.", "angle": "Cost curve break. Per-call cost under 0.01 cents means agent-to-agent decisions stop being a line item.", "tweetA": "A model that charges nothing for output and is demand-constrained anyway. Token pricing is the new bandwidth pricing: it metered until it didn't. 'Too cheap to meter' was said about nuclear in 1954.", "tweetB": "Frontier LLM: >1 cent per call. Jev: <0.01 cent. 100x cheaper and signups paused for demand. The price of a decision is collapsing faster than anyone's revenue model assumes.", "charts": {"count": 0, "hot": false, "desc": "No chart."}, "link": "https://michaelparekh.substack.com/p/ai-ai-loops-101-part-3-beyond-ai", "id": 11}, {"cat": "science", "urgency": "watch", "source": "Michael Parekh / AI Reality Check (AI-RTZ #1247)", "title": "Human text is ~300T tokens and runs out for training between 2026 and 2032; Cosmos trained on ~9 quadrillion video tokens", "idea": "Epoch AI estimates the stock of public human text at ~300T tokens (range 100T-1 quadrillion), fully used between 2026 and 2032. Llama 3 used ~15T in 2024. Nvidia's Cosmos world models: 20M hours of video, about 9 quadrillion tokens. LeCun: a four-year-old has seen ~50x more data through vision than the largest LLMs read as text.", "angle": "The data wall is a text wall. Video and simulation piles are 30x bigger than all human text, which is why Nvidia sells simulation.", "tweetA": "All public human text is ~300T tokens. Cosmos alone trained on 9 quadrillion video tokens: 30x more. The data wall is a text wall. Nobody told the video. $NVDA", "tweetB": "Nvidia's 'compute equals environment equals data' means the GPU manufactures its own training set. That's a closed loop with a single supplier. $NVDA", "charts": {"count": 0, "hot": false, "desc": "No chart."}, "link": "https://michaelparekh.substack.com/p/ai-ai-loops-101-part-3-beyond-ai", "id": 12}, {"cat": "regulation", "urgency": "watch", "source": "Michael Parekh / AI Reality Check (AI-RTZ #1247)", "title": "Websites closing their doors to AI agents: Amazon, Yelp, Delta, JPMorgan", "idea": "The Verge reported websites including Amazon, Yelp, Delta and JPMorgan are blocking AI agents. Parekh: 'guilty until proven innocent' problem; agents need an internet of their own, per Box's Levie 'trillions of agents'. Friction slows the curve but doesn't reverse it.", "angle": "Cloudflare says bots passed humans; platforms are blocking them. The next fight is agent authentication and who gets paid for access.", "tweetA": "Cloudflare says agents already outnumber humans. Amazon, Yelp, Delta and JPM are blocking them. Whoever builds agent identity and payments rails owns the toll booth. $NET $V", "tweetB": "Agentic commerce needs a counterparty that lets the agent in. Retailers blocking agents is a bet that the human front door remains the cash register. That's a bet against their own customers' tooling.", "charts": {"count": 0, "hot": false, "desc": "No chart."}, "link": "https://michaelparekh.substack.com/p/ai-ai-loops-101-part-3-beyond-ai", "id": 13}, {"cat": "energy", "urgency": "deep", "source": "Dark Side of the Boom (Goldman's Yulia Zhestkova Grigsby)", "title": "The tanker squeeze: global crude freight above $20/bbl vs ~$3 a year ago; Middle East routes above $35", "idea": "Goldman's oil analyst reports average cost to move crude surged above $20/bbl from ~$3 a year earlier, with Middle East routes above $35. What started as a Hormuz war-risk premium has spread across tanker classes and routes. Goldman sees geography increasingly determining profitability, and attractive refining margins masking pressure that feeds product prices.", "angle": "Freight is a second oil shock that doesn't show up in Brent. Refiners with cheap domestic crude win; importers lose.", "tweetA": "$20/bbl to move crude, up from $3. Brent doesn't capture that. The price you pay at the pump is crude plus freight plus margin, and two of three are blowing out. $VLO $MPC", "tweetB": "7x freight cost makes geography the trade. US Gulf refiners on domestic WTI vs Asian refiners paying $35 to import. The crack spread isn't the whole story. $FRO $STNG", "charts": {"count": 0, "hot": false, "desc": "Goldman freight chart likely inside — worth opening."}, "link": "https://thedarksideoftheboom.substack.com/p/oils-hidden-price-shock-the-tanker", "id": 14}, {"cat": "AI/infra", "urgency": "deep", "source": "Dark Side of the Boom", "title": "SpaceX's 2027 capex estimates approach $300B as Wall Street raises revenue forecasts", "idea": "After a big SpaceX earnings surprise Goldman, Deutsche, Citi and Wolfe project accelerating revenue but 2027 capex near $300B. The author argues AI compute demand rests on assumptions about pricing, payback and access to capital, with bond investors already asking for more risk compensation. Bloomberg's BI separately counts SpaceX in its $2T 2027 capex forecast.", "angle": "SpaceX as an AI capex buyer is a new category. Same funding question as the hyperscalers, with a rocket company's balance sheet.", "tweetA": "SpaceX 2027 capex ~ $300B. That's more than the GDP of most countries and it's a launch company's spending on AI compute. Revenue upgrades are the easy part.", "tweetB": "Authers says BI counts SpaceX inside the $2T 2027 capex number. A year ago the sell side didn't have 'rocket company' in an AI capex model.", "charts": {"count": 0, "hot": false, "desc": "No chart."}, "link": "https://thedarksideoftheboom.substack.com/p/spacexs-300-billion-question-wall", "id": 15}, {"cat": "geopolitics", "urgency": "act", "source": "Hfir / Oil Market Articles", "title": "'The Oil Math Is Coming Home To Roost': OSINT points to imminent escalation in the Iran war", "idea": "HFIR says the Iran war has been full of fake-peace headlines and that tanker tracking, flight data and military movement OSINT accounts are the only reliable signal. His read of the past week's intel is imminent escalation. Email is a teaser; full argument paywalled.", "angle": "Different author, same message as MacroEdge: escalation window after the midterms, with oil still pricing a deal.", "tweetA": "The market trades the peace-deal headline. The OSINT crowd tracks tankers and aircraft and says escalation. When the two diverge, the physical data usually wins. $USO $XLE", "tweetB": "Fake peace headlines have been the story of this war. Every deal rumor sells crude. Every denial buys it back. Size accordingly. $BNO", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening."}, "link": "https://www.hfir.com/p/the-oil-math-is-coming-home-to-roost", "id": 16}, {"cat": "positioning", "urgency": "deep", "source": "MacroEdge (Six / Strategy Note)", "title": "Flagship drawdown erased; EWY and SMH shorts closed after 10%+ in a few sessions; CoreWeave bounce was the pivot", "idea": "MacroEdge closed shorts in EWY and SMH on the morning of the 15th when CRWV and its bonds bounced and the sell side defended the neocloud, the epicenter of that leg of the selloff. Shorts had paid over 10% each in a few sessions. Title frames the weeks after the midterms as an escalation window with bonds and energy on a collision course.", "angle": "A practitioner closing AI shorts when the credit stress point (CRWV bonds) stabilised is a decent tell: the trade was credit-driven, not earnings-driven.", "tweetA": "CRWV bonds bounced and the AI short thesis ended the same morning. This selloff was a credit story from the start. Watch neocloud bonds, not SMH. $CRWV $SMH", "tweetB": "EWY and SMH short paid 10% each in days, then closed. The harder trade is the one MacroEdge is setting up next: bonds and oil into the post-midterm window.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening."}, "link": "https://www.macroedge.world/p/strategy-note-the-collision-course", "id": 17}, {"cat": "crypto", "urgency": "act", "source": "Checkonchain / Checkmate", "title": "BTC dip capped at -9% from local high; $80k bought", "idea": "Checkonchain says Bitcoin bears have not managed more than a -9% dip from the local high and dip buyers stepped in around $80k. Analysis covers on-chain profit/loss volumes and which cohorts drive the sell side (premium). New charting suite previewed.", "angle": "A 9% max dip with realized profit-taking is a shallow-correction signature. Watch which cohort sold.", "tweetA": "BTC's drawdown from the local high is -9%. The bid showed up at $80k. This is not what a risk-off tape looks like while the 10y is rising. $BTC $MSTR", "tweetB": "Equities flinch at 5% French yields; bitcoin shrugs off a -9% dip. Either crypto is decoupling or it's the last asset class to hear the bad news. $BTC $ETH", "charts": {"count": 1, "hot": false, "desc": "Chart suite preview; charts inside — worth opening."}, "link":
