  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function renderCards(expandMatches){
  var container = document.getElementById('cards');
  var filtered = ITEMS.filter(function(item){
    if(activeSrc && item.source.indexOf(activeSrc) === -1) return false;
    if(!activeSrc && activeCat !== 'All' && item.cat !== activeCat) return false;
    if(!activeSrc && activeUrg !== 'All' && item.urgency !== activeUrg) return false;
    return true;
  });

  if(filtered.length === 0){
    container.innerHTML = '<div class="empty-msg">No items match this filter.</div>';
    return;
  }

  var html = '';
  filtered.forEach(function(item){
    var color = catColor(item.cat);
    var urg = URG_META[item.urgency];
    var openClass = (activeSrc && expandMatches) ? ' open' : '';
    html += '<div class="card' + openClass + '" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">#' + item.id + '</span>';
    html += '<span class="urg">' + urg.emoji + '</span>';
    html += '<span class="badge" style="background:' + color + '">' + item.source.split(' / ')[0].split(' (')[0] + '</span>';
    html += '<span class="cattag">' + item.cat + '</span>';
    if(item.charts.count > 0){ html += '<span class="chartflag">' + (item.charts.hot ? '🔥' : '📊') + '</span>'; }
    html += '<span class="title">' + item.title + '</span>';
    html += '</div>';

    html += '<div class="card-body">';
    html += '<div class="blocklabel">The Idea</div>';
    html += '<div class="idea">' + item.idea + '</div>';
    html += '<div class="blocklabel">My Angle</div>';
    html += '<div class="angle" style="border-left:2px solid ' + color + ';background:' + color + '14;">' + item.angle + '</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet a"><div class="tlabel">TWEET A</div><p>' + item.tweetA + '</p><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet b"><div class="tlabel">TWEET B</div><p>' + item.tweetB + '</p><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    if(item.charts.count > 0){
      html += '<div class="chartbox' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '🔥 CHART WORTH SAVING — ' : '📊 ') + item.charts.desc + '</div>';
    }
    html += '<div class="linkrow"><a href="' + item.link + '" target="_blank">↗ Read full article</a></div>';
    html += '</div>';
    html += '</div>';
  });
  container.innerHTML = html;
}

function buildReport(){
  var body = document.getElementById('reportBody');
  var html = '';
  html += '<p><strong>Time window:</strong> ' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</p>';
  html += '<p><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp;|&nbsp; <strong>Emails read:</strong> ' + META.emailsRead + ' &nbsp;|&nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</p>';
  html += '<p><strong>Included sources:</strong></p><ul>';
  META.includedSources.forEach(function(s){
    html += '<li><span class="srclink" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span> — ' + s.count + ' item' + (s.count===1?'':'s') + '</li>';
  });
  html += '</ul>';
  html += '<p><strong>Skipped sources:</strong></p><ul>';
  META.skippedSources.forEach(function(s){
    html += '<li class="skipitem">' + s.name + ' — ' + s.reason + '</li>';
  });
  html += '</ul>';
  body.innerHTML = html;

  document.getElementById('metaLine').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources';
}

document.getElementById('reportToggle').addEventListener('click', function(){
  document.getElementById('reportCard').classList.toggle('open');
  document.getElementById('reportChevron').textContent = document.getElementById('reportCard').classList.contains('open') ? '▴' : '▾';
});

buildFilters();
buildReport();
renderCards();
</script>
</body>
</html>
