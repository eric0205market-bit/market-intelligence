<title>Research Intelligence</title>
<style>
:root{
  --bg:#ffffff; --card:#f8f7f5; --text:#1a1a1a; --muted:#6b6b6b; --border:#e5e2dc;
  --pill-bg:#f0efec; --pill-text:#4a4a4a;
  --macro:#e24b4a; --credit:#378add; --positioning:#ef9f27; --aiinfra:#1d9e75; --crypto:#7f77dd;
  --geopolitics:#d85a30; --energy:#f97316; --tech:#06b6d4; --gold:#d4a017; --culture:#ec4899;
  --labor:#8b5cf6; --regulation:#64748b; --science:#14b8a6; --venture:#84cc16;
  --angle-bg:#f0efe9;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
.wrap{max-width:920px; margin:0 auto; padding:24px 16px 80px;}
header.top{margin-bottom:20px;}
header.top h1{font-size:1.5rem; margin:0 0 4px; letter-spacing:-.01em;}
header.top .sub{color:var(--muted); font-size:.9rem;}
.filterbar{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0;}
.pill{border:1px solid var(--border); background:transparent; color:var(--pill-text); border-radius:999px; padding:6px 12px; font-size:.82rem; cursor:pointer; user-select:none; transition:all .15s;}
.pill:hover{border-color:#999;}
.pill.active{color:#fff; border-color:transparent;}
.card{background:var(--card); border:1px solid var(--border); border-radius:12px; margin-bottom:10px; overflow:hidden;}
.card-header{display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; flex-wrap:wrap;}
.idx{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:#9a9690; font-size:.78rem; min-width:22px;}
.badge{border-radius:6px; padding:2px 8px; font-size:.72rem; font-weight:600; color:#fff; white-space:nowrap;}
.tag{background:var(--pill-bg); color:var(--pill-text); border-radius:999px; padding:2px 9px; font-size:.72rem; white-space:nowrap;}
.title-txt{font-weight:600; font-size:.94rem; flex:1; min-width:180px;}
.chart-flag{font-size:.85rem;}
.card-body{padding:0 16px 16px; display:none;}
.card.open .card-body{display:block;}
.section-label{font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700; margin:14px 0 6px;}
.idea-txt{font-size:.92rem; line-height:1.5;}
.angle-box{background:var(--angle-bg); border-left:2px solid #999; padding:8px 12px; font-style:italic; font-size:.88rem; line-height:1.5; margin-top:4px;}
.tweets{display:flex; gap:12px; flex-wrap:wrap; margin-top:14px;}
.tweet-box{flex:1; min-width:240px; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px 12px;}
.tweet-box.a .tweet-label{color:var(--credit);}
.tweet-box.b .tweet-label{color:var(--crypto);}
.tweet-label{font-size:.7rem; font-weight:700; letter-spacing:.06em; margin-bottom:6px;}
.tweet-text{font-size:.85rem; line-height:1.45; margin-bottom:8px; white-space:pre-wrap;}
.copy-btn{border:1px solid var(--border); background:var(--card); border-radius:6px; padding:4px 10px; font-size:.76rem; cursor:pointer;}
.copy-btn:hover{border-color:#999;}
.chart-note{margin-top:12px; border:1px dashed var(--border); border-radius:8px; padding:10px 12px; font-size:.82rem; color:var(--muted);}
.chart-note.hot{border-color:#d4a017; background:#fdf8ec; color:#8a6d1a;}
.link-row{margin-top:12px;}
.link-row a{font-size:.85rem; color:var(--credit); text-decoration:none; font-weight:600;}
.link-row a:hover{text-decoration:underline;}
.report{margin-top:28px; border:1px solid var(--border); border-radius:12px; background:var(--card);}
.report-head{padding:14px 16px; cursor:pointer; font-weight:700; display:flex; justify-content:space-between; align-items:center;}
.report-body{display:none; padding:0 16px 16px; font-size:.85rem; line-height:1.6;}
.report.open .report-body{display:block;}
.src-link{color:var(--credit); cursor:pointer; text-decoration:underline;}
.mini-h{font-weight:700; margin-top:12px;}
.hidden-item{display:none !important;}
</style>

<div class="wrap">
  <header class="top">
    <h1>🔵 RESEARCH INTELLIGENCE</h1>
    <div class="sub" id="metaLine"></div>
  </header>

  <div class="filterbar" id="catBar"></div>
  <div class="filterbar" id="urgBar"></div>

  <div id="cards"></div>

  <div class="report" id="reportBlock">
    <div class="report-head" onclick="document.getElementById('reportBlock').classList.toggle('open')">
      <span>Session Report</span><span>▾</span>
    </div>
    <div class="report-body" id="reportBody"></div>
  </div>
</div>

<script>
const ITEMS = [
{id:1, cat:"positioning", urgency:"deep", source:"Dark Side of the Boom",
 title:"PIMCO's $19B fund is quietly betting the AI trade moves from Silicon Valley to Samsung, SK Hynix and TSMC",
 idea:"PIMCO's Balanced Income and Growth Fund (~$19B, beating 97% of peers over 3 years) is underweight most hyperscalers and the Magnificent Seven, rotating into Asian chip, memory, optical, cooling and power suppliers instead. PM Emmanuel Sharef's framing: every data center needs chips, cooling, cables, power gear and industrial metals before any productivity payoff shows up, so the 'contractors' — Samsung, SK Hynix, TSMC — get paid on order volume regardless of whether hyperscaler AI capex ever earns its return. The fund is also building China financials, biotech and rare-earths/materials exposure as a bridge between the digital AI narrative and physical supply constraints.",
 angle:"This is a positioning tell worth cross-referencing against the $12-of-hardware-per-$1-of-concrete framework below — two separate sources this week are independently converging on 'AI capex risk sits with the hyperscalers, not the suppliers.'",
 tweetA:"PIMCO's $19B fund — beating 97% of peers — just went underweight the Mag7 and overweight Samsung, SK Hynix and TSMC. Read between the lines: they're betting the contractors get paid whether or not the hyperscalers' capex ever earns a return. $TSM $000660.KS $005930.KS",
 tweetB:"Nobody's asking why a fund that beat 97% of its peers is trimming the most obvious AI winners. Because 'obvious' and 'already priced for perfection' are the same thing right now — PIMCO would rather own the picks-and-shovels than the prospectors.",
 charts:{count:0, hot:false, desc:"Charts inside — worth opening (Substack post likely includes fund-flow and supply-chain visuals)."},
 link:"https://thedarksideoftheboom.substack.com/p/ais-next-trade-is-moving-from-silicon"},

{id:2, cat:"aiinfra", urgency:"deep", source:"Dark Side of the Boom",
 title:"PwC's math: every $1 of data center concrete commits the industry to $12 more in GPUs that expire in 4-6 years",
 idea:"PwC's central scenario puts cumulative global data center capex at $31.6 trillion through 2050 (up to $50T on faster AI adoption) — bigger than the internet buildout (~$3.29T) and combined US/UK railway construction (~$720B). The report's key structural point: the building itself is the cheap part — every $1 spent on physical construction could commit the industry to roughly $12 of follow-on spending on servers, networking gear and GPUs that need replacing every 4-6 years. Power, not capital, is now flagged as the binding constraint on how much of that announced capacity actually gets energized.",
 angle:"The 12x multiplier is the number nobody's modeling into 'AI capex peaked' calls — a data center isn't a one-time build, it's a recurring hardware subscription for its entire operating life, which means today's capex run-rate understates the real total by an order of magnitude.",
 tweetA:"PwC's real number isn't $31.6 trillion. It's the ratio: $1 of data center concrete commits the industry to $12 of GPU/server refresh spend on a 4-6 year cycle. The building is the down payment; the hardware is a 30-year mortgage. $NVDA",
 tweetB:"Every 'AI capex is peaking' take is measuring the construction phase. PwC's framework implies construction is a fraction of the lifetime bill — the rest is recurring GPU refreshes every 4-6 years, for as long as the data center exists.",
 charts:{count:0, hot:false, desc:"Charts inside — worth opening (PwC capex scenario chart through 2050 likely embedded)."},
 link:"https://thedarksideoftheboom.substack.com/p/ais-316-trillion-refill-cycle-the"},

{id:3, cat:"macro", urgency:"deep", source:"Dark Side of the Boom",
 title:"The Bessent put was built for bonds — equities are the ones actually cashing it in",
 idea:"Yields keep grinding to cycle highs, but the MOVE index has only risen ~10 vol points, meaning the selloff is orderly rather than a violent shock. Bloomberg's Frank Monkam frames this as the real transmission mechanism: Treasury interventions (bigger buybacks, active duration management) haven't reversed the bond selloff, but keeping bond vol contained has prevented the systematic deleveraging and risk-parity breakdown that would otherwise hit every other asset class. A sustained MOVE break above 100 is the trigger that turns this from a slow bleed into a cross-asset event.",
 angle:"This reframes the 'stocks are ignoring higher yields' puzzle — equities aren't ignoring rates, they're pricing the absence of a vol shock. MOVE, not the 10-year level, is the number that actually matters for the equity risk premium right now.",
 tweetA:"Stocks 'ignoring' higher yields isn't a mystery — check the MOVE index, not the 10Y level. It's up only ~10 vol points despite yields at cycle highs. No vol shock means no forced deleveraging means no reason for equities to care yet.",
 tweetB:"The Bessent put was engineered to protect Treasuries. The actual beneficiary is the S&P. Contained bond vol is the only thing standing between 'yields are rising' and 'risk-parity funds are forced sellers of everything.' Watch for MOVE > 100.",
 charts:{count:0, hot:false, desc:"Charts inside — worth opening (MOVE index chart likely embedded)."},
 link:"https://thedarksideoftheboom.substack.com/p/the-bessent-put-is-cushioning-stocks"},

{id:4, cat:"energy", urgency:"act", source:"Dark Side of the Boom",
 title:"WTI above $90 is pricing Iran, not Venezuela — the 1.5mb/d 'fix' is 3-5 years away",
 idea:"Escalation between the US and Iran has pushed WTI above $90/bbl as the market prices supply-disruption risk in real time. Separately, Washington struck a deal covering roughly a fifth of Venezuela's oil reserves; interim President Delcy Rodríguez projects the 17 fields could eventually add 1.5mb/d, but BMO says that would take 3-5 years and, even fully realized, adds only ~1.5% to global supply (~107mb/d baseline). The clearest near-term casualty isn't the oil price — it's Canadian heavy crude producers, since Venezuelan barrels compete for the same US refinery slots as Canadian heavy/high-sulphur grades.",
 angle:"The market is correctly pricing these on two different clocks, but the Venezuela story risks getting used elsewhere as a bearish long-term oil argument when its real tradeable read is the WCS-WTI spread and Canadian producer risk, not a near-term price cap.",
 tweetA:"Venezuela's 1.5mb/d 'fix' for oil supply needs 3-5 years and adds ~1.5% to global output. It is not a hedge against Hormuz shutting down tomorrow. WTI above $90 already knows the difference between a headline and a barrel.",
 tweetB:"The real losers if Venezuela reopens aren't OPEC members — it's Canadian heavy crude producers fighting for the same US refinery slots. Watch the WCS-WTI spread, not Brent, for the actual read-through on this deal. $CNQ $SU",
 charts:{count:0, hot:false, desc:"Charts inside — worth opening (Venezuela production history and WTI price charts likely embedded)."},
 link:"https://thedarksideoftheboom.substack.com/p/oils-two-clocks-iran-now-venezuela"},

{id:5, cat:"energy", urgency:"watch", source:"Dark Side of the Boom",
 title:"Atlantic hurricane season is the quietest since 1941 — right at its seasonal peak",
 idea:"Atlantic accumulated cyclone energy sits at just 4.4, the weakest start since 1941 per Colorado State's Phil Klotzbach, with zero hurricanes formed despite the September 10 climatological peak. A strengthening El Niño (>90% odds of a very strong event per NOAA) is producing record wind shear that's tearing Atlantic systems apart before they organize — while the same pattern is fueling unusually active Pacific hurricane activity hitting Hawaii and Southern California instead. NOAA's outlook now assigns a 75% probability to a below-normal Atlantic season.",
 angle:"This has quietly pulled one risk premium out of diesel, Gulf refining margins and LNG exports at the exact moment those markets are already tight from geopolitics — but three months remain before season-end, and late, compressed seasons can turn violent fast near the refinery belt.",
 tweetA:"Atlantic ACE at 4.4 — weakest since 1941 — with zero hurricanes at the seasonal peak. That's a full weather risk premium quietly missing from diesel and Gulf refining margins while everyone's watching Hormuz instead.",
 tweetB:"Same El Niño, opposite outcomes: it's shutting down Atlantic hurricanes while juicing Pacific cyclone activity toward Hawaii and SoCal. One climate driver, completely different asset exposures on each coast.",
 charts:{count:0, hot:false, desc:"Charts inside — worth opening (Atlantic ACE index and Pacific storm tracker charts likely embedded)."},
 link:"https://thedarksideoftheboom.substack.com/p/the-oil-markets-hurricane-premium"}
];

const META = {
  date: "2026-09-05",
  time: "09:05 CEST",
  windowStart: "2026-09-05 03:05 CEST",
  windowEnd: "2026-09-05 09:05 CEST",
  emailsInWindow: 7,
  emailsRead: 7,
  itemsExtracted: 5,
  includedSources: [
    {name:"Dark Side of the Boom", count:5}
  ],
  skippedSources: [
    {name:"Michael Parekh (AI-RTZ #1200 Weekly Roundup)", reason:"Substack 'Read in app' teaser — zero sentences of body content beyond the title, just a link and unsubscribe footer."},
    {name:"P Equity Research (Portfolio Update)", reason:"Paywalled preview — only one non-analytical sentence (bought a new car) before the subscriber paywall; no portfolio positions or thesis content in the free preview."}
  ]
};

const CAT_COLORS = {
  macro:"var(--macro)", credit:"var(--credit)", positioning:"var(--positioning)", aiinfra:"var(--aiinfra)",
  crypto:"var(--crypto)", geopolitics:"var(--geopolitics)", energy:"var(--energy)", tech:"var(--tech)",
  gold:"var(--gold)", culture:"var(--culture)", labor:"var(--labor)", regulation:"var(--regulation)",
  science:"var(--science)", venture:"var(--venture)"
};
const CAT_LABELS = {
  macro:"macro", credit:"credit", positioning:"positioning", aiinfra:"AI/infra", crypto:"crypto",
  geopolitics:"geopolitics", energy:"energy", tech:"tech", gold:"gold", culture:"culture",
  labor:"labor", regulation:"regulation", science:"science", venture:"venture"
};
const URG_LABELS = {act:"🔴 Act Now", deep:"🔵 Deep", watch:"🟡 Watch"};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function buildFilterBars(){
  const catCounts = {};
  ITEMS.forEach(i=>{ catCounts[i.cat] = (catCounts[i.cat]||0)+1; });
  const catBar = document.getElementById('catBar');
  let html = `<button class="pill active" data-cat="all" onclick="setCat('all')">All (${ITEMS.length})</button>`;
  Object.keys(CAT_LABELS).forEach(c=>{
    if(catCounts[c]){
      html += `<button class="pill" data-cat="${c}" style="--pc:${CAT_COLORS[c]}" onclick="setCat('${c}')">${CAT_LABELS[c]} (${catCounts[c]})</button>`;
    }
  });
  catBar.innerHTML = html;

  const urgCounts = {};
  ITEMS.forEach(i=>{ urgCounts[i.urgency] = (urgCounts[i.urgency]||0)+1; });
  const urgBar = document.getElementById('urgBar');
  let uhtml = `<button class="pill active" data-urg="all" onclick="setUrg('all')">All (${ITEMS.length})</button>`;
  ["act","deep","watch"].forEach(u=>{
    if(urgCounts[u]){
      uhtml += `<button class="pill" data-urg="${u}" onclick="setUrg('${u}')">${URG_LABELS[u]} (${urgCounts[u]})</button>`;
    }
  });
  urgBar.innerHTML = uhtml;
}

function setCat(c){
  activeCat = c; activeSrc = null;
  document.querySelectorAll('#catBar .pill').forEach(p=>{
    const isActive = p.getAttribute('data-cat')===c;
    p.classList.toggle('active', isActive);
    p.style.background = isActive && c!=='all' ? CAT_COLORS[c] : (isActive ? '#1a1a1a' : 'transparent');
    p.style.borderColor = isActive ? 'transparent' : '';
  });
  collapseAll();
  render();
}
function setUrg(u){
  activeUrg = u; activeSrc = null;
  document.querySelectorAll('#urgBar .pill').forEach(p=>{
    const isActive = p.getAttribute('data-urg')===u;
    p.classList.toggle('active', isActive);
    p.style.background = isActive ? '#1a1a1a' : 'transparent';
  });
  collapseAll();
  render();
}
function filterBySrc(name){
  activeCat = 'all'; activeUrg = 'all'; activeSrc = name;
  document.querySelectorAll('#catBar .pill').forEach(p=>{
    const isActive = p.getAttribute('data-cat')==='all';
    p.classList.toggle('active', isActive);
    p.style.background = isActive ? '#1a1a1a' : 'transparent';
  });
  document.querySelectorAll('#urgBar .pill').forEach(p=>{
    const isActive = p.getAttribute('data-urg')==='all';
    p.classList.toggle('active', isActive);
    p.style.background = isActive ? '#1a1a1a' : 'transparent';
  });
  render(true);
}
function collapseAll(){
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('open'));
}
function toggleCard(id){
  const el = document.getElementById('card-'+id);
  if(el) el.classList.toggle('open');
}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function render(expandMatches){
  const cardsEl = document.getElementById('cards');
  let html = '';
  ITEMS.forEach(item=>{
    let visible = true;
    if(activeSrc){
      visible = item.source.toLowerCase().indexOf(activeSrc.toLowerCase()) !== -1;
    } else {
      if(activeCat !== 'all' && item.cat !== activeCat) visible = false;
      if(activeUrg !== 'all' && item.urgency !== activeUrg) visible = false;
    }
    const chartFlag = item.charts.hot ? '🔥' : (item.charts.count>0 ? '📊' : '');
    const openClass = (expandMatches && visible) ? ' open' : '';
    html += `<div class="card${visible ? '' : ' hidden-item'}${openClass}" id="card-${item.id}">
      <div class="card-header" onclick="toggleCard(${item.id})">
        <span class="idx">#${String(item.id).padStart(2,'0')}</span>
        <span>${URG_LABELS[item.urgency].split(' ')[0]}</span>
        <span class="badge" style="background:${CAT_COLORS[item.cat]}">${esc(item.source.split(' (')[0].split(' /')[0])}</span>
        <span class="tag">${CAT_LABELS[item.cat]}</span>
        ${chartFlag ? `<span class="chart-flag">${chartFlag}</span>` : ''}
        <span class="title-txt">${esc(item.title)}</span>
      </div>
      <div class="card-body">
        <div class="section-label">The Idea</div>
        <div class="idea-txt">${esc(item.idea)}</div>
        <div class="section-label">My Angle</div>
        <div class="angle-box">${esc(item.angle)}</div>
        <div class="tweets">
          <div class="tweet-box a">
            <div class="tweet-label">TWEET A</div>
            <div class="tweet-text">${esc(item.tweetA)}</div>
            <button class="copy-btn" onclick="copyTweet(${item.id},'a')">📋 Copy</button>
          </div>
          <div class="tweet-box b">
            <div class="tweet-label">TWEET B</div>
            <div class="tweet-text">${esc(item.tweetB)}</div>
            <button class="copy-btn" onclick="copyTweet(${item.id},'b')">📋 Copy</button>
          </div>
        </div>
        <div class="chart-note${item.charts.hot ? ' hot':''}">📊 ${esc(item.charts.desc)}</div>
        <div class="link-row"><a href="${item.link}" target="_blank">↗ Read full article</a></div>
      </div>
    </div>`;
  });
  cardsEl.innerHTML = html;
}

function buildReport(){
  document.getElementById('metaLine').textContent =
    `${META.date} · ${META.time} · ${META.itemsExtracted} items from ${META.includedSources.length} sources`;

  let body = `<div>Window: <strong>${META.windowStart}</strong> to <strong>${META.windowEnd}</strong>. Emails outside this window were not processed.</div>
  <div style="margin-top:6px;">Emails in window: ${META.emailsInWindow} · Read in full: ${META.emailsRead} · Items extracted: ${META.itemsExtracted}</div>
  <div class="mini-h">Included sources</div>`;
  META.includedSources.forEach(s=>{
    body += `<div>• <span class="src-link" onclick="filterBySrc('${esc(s.name).replace(/'/g,"\\'")}')">${esc(s.name)}</span> — ${s.count} item${s.count>1?'s':''}</div>`;
  });
  body += `<div class="mini-h">Skipped sources</div>`;
  META.skippedSources.forEach(s=>{
    body += `<div>• ${esc(s.name)} — ${esc(s.reason)}</div>`;
  });
  document.getElementById('reportBody').innerHTML = body;
}

buildFilterBars();
buildReport();
render();
</script>
