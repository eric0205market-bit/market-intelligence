{ id:28, cat:"geopolitics", urgency:"deep", source:"Hard Fork — Marvin's Best Weekly Reads",

{ id:29, cat:"geopolitics", urgency:"deep", source:"Hard Fork — Marvin's Best Weekly Reads",
  title:"The 2026 shock nobody's pricing: sulphuric acid now rations between your fertilizer and your battery metals",
  idea:"More than half of global sulphuric acid output goes to fertilizer, but it's also the key reagent for leaching copper, nickel, cobalt, uranium and rare earths. The 2026 closure of the Strait of Hormuz to elemental sulphur shipments plus China's export ban on sulphuric acid turned a latent molecule-for-molecule competition into a live crisis — Zambia, Indonesia and Chile are now rationing acid domestically, and fertilizer prices are up 40-70%.",
  angle:"A genuinely underpriced cross-asset story linking energy-transition metals, food security and Hormuz geopolitics into one chokepoint nobody covers because it's not glamorous.",
  tweetA:"Copper, nickel, uranium and rare-earth mining all run on the same molecule as fertilizer: sulphuric acid. Hormuz closing to sulphur shipments plus China's export ban just turned 'feed the world' vs 'electrify the world' into a real trade-off, and governments are already choosing food. Fertilizer's up 40-70%. Nobody's pricing what that does to the copper supply chain. $FCX $SCCO",
  tweetB:"The green transition's actual bottleneck isn't lithium or permitting. It's a 1700s industrial chemical that half the world uses to grow food and the other half needs to leach battery metals out of rock. When one country closes a strait and another bans exports, both demand curves hit the same fixed supply at once.",
  charts:{count:0,hot:true,desc:"No embedded chart in this email, but the linked piece likely has a sulphuric acid supply/demand chart. 🔥 CHART WORTH SAVING if you pull it — this is the single most underpriced story in the batch"},
  link:"https://hardfork.substack.com/p/marvins-best-weekly-reads-aug-16th" },
{ id:30, cat:"venture", urgency:"deep", source:"Hard Fork — Marvin's Best Weekly Reads",
  title:"The Big Four collect $300bn to sample. AI can check every transaction. The moat is now a liability",
  idea:"The Big Four accounting firms take in $300bn+ combined revenue for a sampling-based audit methodology designed for 1850, when checking every transaction was physically impossible. The VC pitch: any vertical AI agent replacing a partnership-bound professional-services category (legal, audit, healthcare, tax, asset management ops) has the same structural opportunity.",
  angle:"A cleaner version of the 'AI disrupts professional services' thesis than most — sampling-to-full-population-checking is a discrete, measurable technology unlock, not a vague productivity claim.",
  tweetA:"Auditors get paid $300bn a year to check a sample of your transactions because in 1850 checking all of them was physically impossible. It's 2026. A machine can check every transaction, multiple times a year, for a fraction of the cost. That's not a productivity gain, that's the entire justification for the fee structure disappearing.",
  tweetB:"The AI-disrupts-professional-services thesis usually hand-waves the mechanism. This one doesn't: sampling was a constraint, not a methodology choice. Remove the constraint and the $300bn Big Four moat isn't a moat, it's a legacy cost structure waiting to be arbitraged.",
  charts:{count:0,hot:false,desc:""},
  link:"https://hardfork.substack.com/p/marvins-best-weekly-reads-aug-16th" },
{ id:31, cat:"AI/infra", urgency:"deep", source:"Hard Fork — Marvin's Best Weekly Reads",
  title:"The AI bubble doesn't pop on bad tech. It pops on the first undersubscribed financing round",
  idea:"A contrarian-but-pro-AI thesis argues the risk isn't the technology, it's the speculative capital structure stacked on top of it. The canary: the first undersubscribed financing round on the subsidy side, which would ripple backward — thinner compute demand, thinner data-center margins, softer chip bids, reaching fabs underwritten on straight-line growth. The framework predicts inflation (more usage, thinner margin per unit, a Jevons Paradox effect) rather than collapse.",
  angle:"A concrete, trackable tripwire — worth watching actual capital raises in the AI infra stack this quarter instead of arguing about the technology.",
  tweetA:"The AI bubble thesis everyone argues about the technology. The actual mechanism here: watch for the first undersubscribed financing round on the subsidy side of AI infrastructure. That's the domino, not a bad earnings print. Data center margins, chip bids, fab underwriting all reprice from that one event.",
  tweetB:"This isn't a 'this pops' call, it's a Jevons Paradox call: cheaper compute means more usage, not less capex. The prediction is inflation in the AI stack, not collapse — volume keeps climbing while margin per unit caves in. That's a very different trade than shorting the theme outright.",
  charts:{count:0,hot:false,desc:""},
  link:"https://hardfork.substack.com/p/marvins-best-weekly-reads-aug-16th" },

{ id:33, cat:"venture", urgency:"watch", source:"Hard Fork — Marvin's Best Weekly Reads",
  title:"The top 1% of venture outcomes is now $30 billion",

{ id:34, cat:"science", urgency:"watch", source:"Hard Fork — Marvin's Best Weekly Reads",
  title:"Industrial capitalism's real origin story: 1750s French military-precision culture, not the steam engine",
  idea:"Between 1750-1800, France developed a distinctive culture of precision — military engineering, navigation, metrology, scientific instrumentation — that didn't create industrial capitalism directly but created its conceptual and technical preconditions, which the US later inherited and scaled into mass production.",
  angle:"A useful historical parallel for today's reindustrialization narrative — the 'who builds the underlying precision culture wins the next industrial era' framing applies directly to the current chip/defense-tech reshoring debate.",
  tweetA:"The steam engine gets the credit for industrial capitalism. This thesis says the real precondition was French military-precision culture in the 1750s — metrology, instrumentation, navigation — that the US later inherited and scaled. If that's right, today's reindustrialization race is really a precision-manufacturing-culture race, and that's a much longer game than a tariff schedule.",
  tweetB:"Worth sitting with: the country that built precision culture in the 1700s didn't capture the industrial revolution it enabled — the country that scaled it did. Not a comforting parallel if you're betting on domestic reindustrialization purely on subsidy dollars rather than rebuilding the underlying skilled-trades culture.",

{ id:36, cat:"geopolitics", urgency:"deep", source:"Noah Smith / Noahpinion",
  title:"Zhu Rongji dies at 97 — the architect who cut East Asian extreme poverty from 1.2bn people to a sixth of that",
  idea:"Zhu Rongji, architect of China's 1991-2003 reform era (SOE privatization, WTO accession, the 1997 bank bailout, the tax reform centralizing local revenue), presided over the fastest large-scale poverty reduction in human history. China's growth has since fallen to an official 5% (independent estimates put it at 2-3%), and the debate over whether Xi's industrial-policy era reaccelerated total factor productivity remains unresolved — Penn World Tables now show 2%+ TFP growth in the 2010s after a data revision, while the Conference Board and Brandt et al. still peg it near 1%.",
  angle:"The TFP data-revision detail is the actual story — official growth statistics disagreements aren't just political spin, they're methodology disputes that materially change whether Xi's subsidy-driven industrial policy is working.",
  tweetA:"China's growth fell from Zhu-era double digits to an official 5%, and independent estimates put it at 2-3%. But the number that should worry industrial-policy bulls more: even after a friendly data revision, nobody agrees whether TFP growth reaccelerated under Xi's 'new national system,' or just slowed less than assumed. That's an economy where the underlying growth engine is genuinely unmeasured.",
  tweetB:"Zhu Rongji cut extreme poverty in East Asia from 1.2 billion people to roughly a sixth of that. That's the largest and fastest poverty reduction the human race has ever produced, and most of the West barely knows his name. Worth remembering when the current China growth debate gets reduced to a single headline number.",
  charts:{count:0,hot:true,desc:"Two charts in source: China GDP growth over time, and East Asian sub-$3/day poverty population. 🔥 CHART WORTH SAVING — the poverty-reduction chart especially"},
  link:"https://www.noahpinion.blog/p/the-end-of-an-era-for-chinas-economy" },

    {name:"Compounding Quality", reason:"Pure promotional subscription pitch (buy the Annual plan), no analytical content beyond a generic compounding calculator"},
    {name:"Blind Squirrel Macro (Arcadia Now)", reason:"Podcast teaser only — 'Listen now (25 mins)' with zero sentences of preview content"}
  ]
};

const CATCOLORS = {macro:"var(--macro)",credit:"var(--credit)",positioning:"var(--positioning)","AI/infra":"var(--aiinfra)",crypto:"var(--crypto)",geopolitics:"var(--geopolitics)",energy:"var(--energy)",tech:"var(--tech)",gold:"var(--gold)",culture:"var(--culture)",labor:"var(--labor)",regulation:"var(--regulation)",science:"var(--science)",venture:"var(--venture)"};
const URGEMOJI = {act:"🔴", deep:"🔵", watch:"🟡"};
const URGLABEL = {act:"Act Now", deep:"Deep", watch:"Watch"};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function catCounts(){
  const m = {};
  ITEMS.forEach(i=>{ m[i.cat] = (m[i.cat]||0)+1; });
  return m;
}
function urgCounts(){
  const m = {act:0, deep:0, watch:0};
  ITEMS.forEach(i=>{ m[i.urgency] = (m[i.urgency]||0)+1; });
  return m;
}

function renderFilters(){
  const cc = catCounts();
  const cats = Object.keys(CATCOLORS).filter(c=>cc[c]);
  let html = '<button class="pill' + (activeCat==="all"?" active":"") + '" style="' + (activeCat==="all"?"background:#1a1a1a;":"") + '" onclick="setCat(\'all\')">All <span class="count">' + ITEMS.length + '</span></button>';
  cats.forEach(function(c){
    const isActive = activeCat===c;
    const style = isActive ? ("background:" + CATCOLORS[c] + ";") : "";
    html += '<button class="pill' + (isActive?" active":"") + '" style="' + style + '" onclick="setCat(\'' + c + '\')">' + c + ' <span class="count">' + cc[c] + '</span></button>';
  });
  document.getElementById('catFilter').innerHTML = html;

  const uc = urgCounts();
  let uhtml = '<button class="pill' + (activeUrg==="all"?" active":"") + '" style="' + (activeUrg==="all"?"background:#1a1a1a;":"") + '" onclick="setUrg(\'all\')">All <span class="count">' + ITEMS.length + '</span></button>';
  [["act","🔴 Act Now","var(--macro)"],["deep","🔵 Deep","var(--credit)"],["watch","🟡 Watch","var(--positioning)"]].forEach(function(u){
    const isActive = activeUrg===u[0];
    const style = isActive ? ("background:" + u[2] + ";") : "";
    uhtml += '<button class="pill' + (isActive?" active":"") + '" style="' + style + '" onclick="setUrg(\'' + u[0] + '\')">' + u[1] + ' <span class="count">' + uc[u[0]] + '</span></button>';
  });
  document.getElementById('urgFilter').innerHTML = uhtml;
}

function setCat(c){ activeCat = c; activeSrc = null; renderFilters(); renderCards(); }
function setUrg(u){ activeUrg = u; activeSrc = null; renderFilters(); renderCards(); }
function filterBySrc(name){
  activeSrc = name; activeCat = "all"; activeUrg = "all";
  renderFilters(); renderCards(true);
}

function renderCards(expandMatches){
  const list = ITEMS.filter(function(i){
    if (activeCat !== "all" && i.cat !== activeCat) return false;
    if (activeUrg !== "all" && i.urgency !== activeUrg) return false;
    if (activeSrc && i.source.indexOf(activeSrc) === -1) return false;
    return true;
  });
  if (list.length === 0){
    document.getElementById('cards').innerHTML = '<div class="empty">No items match this filter.</div>';
    return;
  }
  let html = '';
  list.forEach(function(item){
    const chartFlag = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');
    const openClass = expandMatches ? ' open' : '';
    html += '<div class="card' + openClass + '" id="card-' + item.id + '">';
    html += '<div class="card-head" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">#' + item.id + '</span>';
    html += '<span class="urg">' + URGEMOJI[item.urgency] + '</span>';
    html += '<span class="badge" style="background:' + CATCOLORS[item.cat] + '">' + item.source + '</span>';
    html += '<span class="catpill">' + item.cat + '</span>';
    if (chartFlag) html += '<span class="chartflag">' + chartFlag + '</span>';
    html += '<span class="title">' + item.title + '</span>';
    html += '</div>';
    html += '<div class="card-body">';
    html += '<div class="section-label">The Idea</div><div class="idea">' + item.idea + '</div>';
    html += '<div class="section-label">My Angle</div><div class="angle" style="border-left:2px solid ' + CATCOLORS[item.cat] + ';background:' + CATCOLORS[item.cat] + '14;">' + item.angle + '</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet a"><div class="lbl">TWEET A</div><p>' + item.tweetA + '</p><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet b"><div class="lbl">TWEET B</div><p>' + item.tweetB + '</p><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    if (item.charts.count > 0 || item.charts.desc){
      html += '<div class="chartbox' + (item.charts.hot?' hot':'') + '">' + (item.charts.hot?'🔥 ':'📊 ') + (item.charts.desc || 'Charts inside — worth opening') + '</div>';
    }
    html += '<div class="linkrow"><a href="' + item.link + '" target="_blank">↗ Read full article</a></div>';
    html += '</div>'; // card-body
    html += '</div>'; // card
  });
  document.getElementById('cards').innerHTML = html;
}

function toggleCard(id){
  const el = document.getElementById('card-' + id);
  if (el) el.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function renderReport(){
  let html = '<div><b>Time window:</b> ' + META.windowStart + ' to ' + META.windowEnd + '</div>';
  html += '<div style="margin-top:6px;"><b>Emails in window:</b> ' + META.emailsInWindow + ' &nbsp; <b>Read:</b> ' + META.emailsRead + ' &nbsp; <b>Items extracted:</b> ' + META.itemsExtracted + '</div>';
  html += '<div class="section-label" style="margin-top:14px;">Included Sources</div>';
  META.includedSources.forEach(function(s){
    html += '<div class="srcrow" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + ' <span class="count">(' + s.count + ')</span></div>';
  });
  html += '<div class="section-label" style="margin-top:14px;">Skipped Sources</div>';
  META.skippedSources.forEach(function(s){
    html += '<div class="skiprow">' + s.name + ' — ' + s.reason + '</div>';
  });
  document.getElementById('reportInner').innerHTML = html;
}

function init(){
  document.getElementById('headerMeta').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails';
  renderFilters();
  renderCards();
  renderReport();
}
init();
</script>
