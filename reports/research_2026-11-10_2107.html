<script>
const ITEMS = [{"cat": "ai/infra", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom (Goldman semis)", "title": "Goldman: capacity for 2027 chip demand is already under construction, so the DC selloff is pricing a cliff that is mostly already built", "idea": "Goldman's Schneider rebuilt the AI infrastructure pipeline bottom-up from projects already under construction. Even if the 2028 expansion stalls or grows zero, much of the semiconductor demand through 2027 is already committed. The team finds value in compute, semicap and memory, but each sits at a different point in the valuation cycle. Their caveat: cheap doesn't mean it recovers soon while hedge funds are still de-grossing and post-midterm politics around new builds is unresolved.", "angle": "The midterm moratorium headlines hit 2028+ permits; shells under construction are a 2026-27 revenue line. That timing gap is where the trade is: own what ships into existing shells (memory, networking) and be wary of names that depend on new groundbreaks.", "tweetA": "A moratorium on new data centers doesn't un-pour the concrete already poured. Most of the 2027 chip demand is already in buildings with roofs on them. The market is pricing 2028 permits into 2026 revenue. $MU $AVGO", "tweetB": "Two questions get blurred together: will they build more data centers, and will they fill the ones going up now? Texas politics changed the first. Nothing changed the second. Price the stocks on the second.", "charts": {"count": 0, "hot": false, "desc": "Charts inside: worth opening (bottom-up pipeline vs implied semis downside)"}, "link": "https://thedarksideoftheboom.substack.com/p/the-selloff-has-gone-too-far-goldman", "id": 1}, {"cat": "crypto", "urgency": "red", "source": "Mando Minutes", "title": "MARA dumped $1.1B of BTC while whales set records swapping BTC into IBIT", "idea": "In one daily roundup: MARA sold $1.1B of BTC, BTC ETFs saw -$201M and ETH ETFs -$185M of outflows, yet whale demand for BTC-to-IBIT swaps hit a record. Strategy kept buying ($82M BTC plus $188M of its STRC preferred). Open interest rose into the dip. BTC at 74,000, Fear & Greed 31.", "angle": "Miners are price-insensitive sellers into a range (see Danny D's mining-cost note). Whales moving coins into ETF wrappers is custody and tax plumbing, not a bullish signal. Watch OI building into weakness: that is fuel for a flush to $72k.", "tweetA": "Miners sell $1.1B, ETFs bleed $200M a day, open interest climbs into the dip. Who is on the other side? Saylor's preferred-stock machine and leveraged longs. That isn't a floor. It's a queue to get out.", "tweetB": "The record BTC-to-IBIT swap demand is the most misread chart this week. Whales aren't adding exposure, they're changing the wrapper: estate planning, collateral, custody. Same coins, new ticker. $IBIT", "charts": {"count": 0, "hot": false, "desc": "Link roundup, no charts"}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-1-9690", "id": 2}, {"cat": "crypto", "urgency": "deep", "source": "Mando Minutes", "title": "NYSE picks Avalanche to settle tokenised stocks; Ondo will tokenise Anthropic on IPO day; SpaceX and Amazon object to OKX-ICE tokenisation", "idea": "Tokenised-equity plumbing landed in one news cycle. NYSE chose Avalanche as a settlement layer for tokenised stocks. Ondo plans a tokenised Anthropic on IPO day. SpaceX and Amazon formally objected to OKX-ICE tokenising their shares, while Robinhood approved OKX-ICE tokenisation. PNC is piloting USDC payments for corporate clients and Schwab added SOL, AVAX and LINK.", "angle": "The real fight is over issuer consent. When issuers object (SpaceX, AMZN), it shows that tokenisation without the issuer's sign-off is a legal grey zone. Settlement-layer wins (AVAX) are the durable part.", "tweetA": "Issuers are now formally objecting to having their stock tokenised. That's the tell that tokenisation has gone from a crypto toy to a real threat to transfer-agent control. Expect the first lawsuit before the first ETF. $AVAX $ICE", "tweetB": "NYSE settling on Avalanche and Ondo tokenising Anthropic on IPO day put a chain on the ticker tape for a $1T IPO in the same week. The market structure story is bigger than whatever BTC does this month.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-1-9690", "id": 3}, {"cat": "ai/infra", "urgency": "watch", "source": "Mando Minutes", "title": "Norway freezes new power bookings for AI data centers", "idea": "Norway, one of Europe's cheapest and greenest homes for data centers, froze new grid bookings for AI DCs. This came the same week US midterm winners in Texas, Georgia and Ohio ran on DC moratoria. Meanwhile TSMC's October sales were +60% y/y.", "angle": "Power-access politics is now global, not only US-local. Sites with power already contracted gain scarcity value. Nordic DC developers lose optionality.", "tweetA": "Texas, Georgia, Ohio and now Norway, all in one week. The cheapest, greenest power grid in Europe just put up a 'no vacancy' sign for AI. Grid access is now the scarcest input in the stack, more than GPUs.", "tweetB": "TSMC sales +60% y/y in the same news cycle that Norway froze AI power bookings. Chips are getting made faster than places to plug them in. Watch who already holds interconnection queue positions.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-1-9690", "id": 4}, {"cat": "macro", "urgency": "deep", "source": "Mando Minutes", "title": "US consumer credit hits an all-time high of $5.2T while China's trade surplus tops $1T again", "idea": "Two lines buried in the macro section: US consumer credit at an ATH of $5.2T, and China's trade surplus above $1T again. Saudi Arabia confirmed its East-West oil pipeline was hit, Trump is weighing an EU security deal with Russia, and the BoJ debated faster hikes.", "angle": "A record US consumer borrowing stack against a Fed now priced to hike in December is a household-credit squeeze in waiting. A $1T Chinese surplus guarantees more trade friction under a Democratic Congress.", "tweetA": "US consumers owe a record $5.2T going into the first Fed hike cycle in a long time. China runs a $1T surplus selling them the stuff. The Fed is about to tighten on the borrower, not the lender.", "tweetB": "The Saudi East-West pipeline exists to bypass Hormuz. It just got hit, and oil still fell 2% today. The market has fully priced 'Iran war ending'. Not much left to give if that's wrong.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-1-9690", "id": 5}, {"cat": "ai/infra", "urgency": "red", "source": "Mando Minutes", "title": "Big Tech to buy $26B of Anthropic's IPO; roadshow targets $1T after pricing indication was withdrawn", "idea": "Anthropic launched its IPO roadshow for a reported $64B raise, targeting ~$1T valuation. A pricing indication sent to banks was withdrawn. Big Tech will reportedly take $26B of the shares. Also: Grok nears 100M MAU, Apple reclaimed the world's-largest-company title, and Meta dropped Muse Ember.", "angle": "A $26B strategic anchor is ~40% of the deal. The float that actually trades will be thin, so day-one dynamics are set by allocation, not price discovery. Compare with Deluard's 2T to 1.2T and BEP's '$1.3T floor' items below.", "tweetA": "If strategics take $26B of a $64B deal, the real public float is closer to $38B. Thin float plus index demand plus retail FOMO. Day one price will tell you about allocation, not valuation.", "tweetB": "A withdrawn pricing indication, then a $1T target, then $26B of friendly Big Tech money. This is the most carefully engineered IPO book since Aramco. Watch who isn't on that anchor list.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-1-9690", "id": 6}, {"cat": "macro", "urgency": "red", "source": "Peter Boockvar / The Boock Report (CPI)", "title": "Health insurance CPI fell 1.8% m/m 'with no connection to reality', so core 0.3% is understated", "idea": "October CPI +0.4% headline, +0.3% core, both 0.1 above. Energy +0.7% m/m, electricity +0.9% ('helped drive the election results'). Services ex-energy +0.3%, OER +0.3%. Health insurance printed -1.8% m/m purely from BLS methodology. Airfares +0.4% after +1.2/+2.7/+2.2. Hotels +0.7% after 2%+ in each of the prior two months. Vehicle maintenance +0.6% after +0.7/+1.1/+0.6. Car insurance bounced +0.7%.", "angle": "Strip out the methodology-driven health insurance drag and core is closer to 0.35-0.4%. That supports Waller's 50bp case, and the market is only now pricing 25.", "tweetA": "Core CPI 0.3% came with health insurance at -1.8% m/m, a methodology artifact. Put it at zero and you're printing a 0.4 handle. Waller's 50bp isn't hawkish. It's arithmetic.", "tweetB": "Vehicle maintenance: +0.6, +0.7, +1.1, +0.6 in four straight months. That isn't tariffs on parts any more, it's mechanics' wages. Services inflation is quietly re-accelerating where nobody is looking.", "charts": {"count": 0, "hot": false, "desc": "Charts inside: worth opening"}, "link": "https://peterboockvar.substack.com/p/october-cpi-now-fully-priced-for", "id": 7}, {"cat": "culture", "urgency": "deep", "source": "Peter Boockvar / The Boock Report (CPI)", "title": "Electricity +0.9% in one month, and Boockvar ties it directly to the election result", "idea": "Electricity CPI rose 0.9% m/m in October. Boockvar notes electricity prices 'helped in part to drive the election results', which ties to the anti-data-center messaging that won Texas, Georgia and Ohio.", "angle": "Electricity is now a voting issue with an AI villain attached. Expect state PUCs to shift DC power costs onto hyperscalers via large-load tariffs. That is a margin hit for utilities that have been trading like AI derivatives.", "tweetA": "Your electric bill went up 0.9% in a month and a Democrat won the Texas governorship for the first time since 1990 on a data-center moratorium. The AI trade now has a household-budget problem.", "tweetB": "The second-order trade from the 'data-center elections' runs through utility rate cases, not chip stocks. Large-load tariffs that make hyperscalers pay for grid upgrades are coming. $VST $CEG", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://peterboockvar.substack.com/p/october-cpi-now-fully-priced-for", "id": 8}, {"cat": "macro", "urgency": "red", "source": "Bespoke Investment Group", "title": "10y at 4.94% after CPI, yet crude, gold and Bitcoin all fall together", "idea": "After the hot CPI the 10-year jumped to 4.94% (and later 5.02% at auction). Crude, gold and Bitcoin all fell 'firmly' in the same session. Kospi hit upside trading curbs at +5% intraday, Nikkei +~3%. Waller flagged >25bp for December.", "angle": "Gold falling with yields rising and the dollar firm says this is a real-rate shock, not an inflation scare. Breakevens confirm it (see Boockvar's auction note). That is the worst mix for long-duration assets, including BTC.", "tweetA": "Hot CPI and gold falls. If the market believed inflation was the problem, gold would rip. It's pricing a Fed that will hike real rates through the problem. That's a 2022 setup, not a 1970s one.", "tweetB": "Crude, gold and BTC all down on a hot inflation print. Everything that was supposed to be an inflation hedge just traded like duration. The only hedge working today was cash.", "charts": {"count": 1, "hot": false, "desc": "Gas price chart (AAA national average back below $4)"}, "link": "https://bespokeinvest.substack.com/p/hot-inflation-morning-market-note", "id": 9}, {"cat": "macro", "urgency": "deep", "source": "Bespoke Investment Group", "title": "Gas fell below $4 for the first time since July, and the STOXX 600 is near a high because Europe 'has little AI exposure'", "idea": "AAA national average gas dropped below $4 for the first time since July, with a lower high versus spring. Bespoke calls it the most important inflation chart right now. Separately, the STOXX 600 (+0.8%) is within a whisker of a new high because Europe has been insulated from the AI correction. French Q3 unemployment fell to 8.2% vs 8.4% expected.", "angle": "Europe's lack of AI exposure has gone from a 2024 bug to a 2026 feature. Howell's flow data (below) shows money rotating into the Eurozone. Deluard's warning: hedge the EUR.", "tweetA": "For three years 'Europe has no AI exposure' was the bear case. This week the STOXX 600 is at highs because Europe has no AI exposure. Same fact, opposite price. Narratives follow price.", "tweetB": "Gas back under $4 helps next month's CPI. But core services aren't gas-driven: airfares, hotels, car repair. The Fed will hike into falling gasoline prices, and that's how policy mistakes get made.", "charts": {"count": 1, "hot": true, "desc": "🔥 AAA gas price chart: lower high vs spring, now below $4"}, "link": "https://bespokeinvest.substack.com/p/hot-inflation-morning-market-note", "id": 10}, {"cat": "energy", "urgency": "watch", "source": "Robert Sinn / Goldfinger Capital", "title": "Friedland: the first phone used 18 elements; an iPhone 17/18 uses 74, and the US is behind on most of them", "idea": "Robert Friedland on stage with Interior Secretary Burgum: 'Everything you touch, we mined it or we grew it.' The first mobile phone contained ~18 periodic-table elements; current iPhones have 74. Under Burgum, Interior expanded the critical-minerals list to copper, silver and uranium, approved Utah's Velvet-Wood uranium-vanadium project in a 14-day review, and reissued the Ambler Road right-of-way to Alaska's copper district.", "angle": "Permits are the bottleneck being cleared, but production is a 2030s story. The investable edge is in the permitting window: juniors with approvals in hand re-rate before first production.", "tweetA": "18 elements in the first cell phone, 74 in an iPhone today. The demand for critical minerals doesn't scale with units sold, it scales with the periodic table. Supply chains built for 18 elements can't handle 74.", "tweetB": "A 14-day federal review for a uranium-vanadium mine. Ten years ago that took a decade. Permitting speed is the actual policy shift, and nobody models it in mine NPVs. $UUUU $IVN", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://robertsinn.substack.com/p/secretary-burgum-and-robert-friedland", "id": 11}, {"cat": "science", "urgency": "watch", "source": "Robert Sinn / Goldfinger Capital", "title": "Ivanhoe's 'Typhoon': compressed electrical bursts let you image copper, gold and water underground without drilling", "idea": "Friedland describes Typhoon, tech 'out of strategic weaponry' that compresses electrical energy and releases it in huge bursts into the earth to image water, gold and copper at higher resolution, like an MRI rather than surgery. Paired with AI subsidiary Earth Dynamics, he wants the USGS to re-survey America. He notes ~10% of all copper humanity has ever mined came from Arizona, and the state hosts 1,400 defense companies that need it.", "angle": "If non-invasive deep geophysics plus AI cuts exploration cost per discovery, the junior-miner model changes: fewer holes, more targets. That is an AI application in the physical world that nobody in tech is pricing.", "tweetA": "Everyone asks what AI does for software. Friedland is using AI plus electrical bursts from weapons research to see copper a kilometer down without drilling. The cheapest discovery cost wins the next commodity cycle.", "tweetB": "10% of all the copper humanity has ever mined came out of Arizona. Arizona has 1,400 defense contractors. A mine whose copper never leaves the state is a national-security asset, not a commodity bet. $IE", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://robertsinn.substack.com/p/secretary-burgum-and-robert-friedland", "id": 12}, {"cat": "ai/infra", "urgency": "red", "source": "David Mattin / The Exponentialist", "title": "METR inside Anthropic: capability gains now ~2x last year's rate, mostly because AI is doing the R&D", "idea": "METR was given insider access and found Anthropic is improving model capability ~2x faster than in Mar 2024-Oct 2025, primarily because of 'extensive use of AI to do R&D'. Ajeya Cotra reads it as ~10x researcher uplift and argues the S-1's 'may imminently meet' the accelerated-progress threshold has already been passed. METR: 'lack of observed bottlenecks or strong diminishing returns'.", "angle": "This is the bull case for Anthropic's IPO and the bear case for everyone priced as an AI competitor. The S-1 risk factor became a reality one month after filing.", "tweetA": "The S-1 said Anthropic 'may imminently' hit AI-accelerated R&D. A month later METR says it already happened. When was the last time an IPO's risk factor turned into its growth driver before the roadshow ended?", "tweetB": "IJ Good described the intelligence explosion in 1965. In 2026 it shows up as a slope change in an internal benchmark chart, with most of the evidence redacted. History doesn't announce itself, it gets footnoted.", "charts": {"count": 1, "hot": true, "desc": "🔥 METR/Cotra chart: researcher uplift estimates"}, "link": "https://theexponentialist.substack.com/p/the-download-14", "id": 13}, {"cat": "geopolitics", "urgency": "red", "source": "David Mattin / The Exponentialist", "title": "The 'data-center elections': Texas (25% of planned US DC build) elects a governor promising an immediate moratorium", "idea": "Gina Hinojosa beat Greg Abbott, the first Democratic Texas governor since 1990, promising an immediate DC moratorium. Texas is ~25% of planned US DC construction. Georgia (Keisha Lance Bottoms, temporary pause; Atlanta has ~2.9GW under construction, the biggest US hub) and Ohio (Amy Acton beat Vivek Ramaswamy on a conditional freeze) followed. NBC exit poll: >50% said AI and data centers were a 'crucial or major factor'.", "angle": "Mattin expects friction, not a halt: legal fights over approved projects, hyperscalers paying for their own power. The 2028 tail risk is a Democratic AI-sceptic platform nationally. Long behind-the-meter power and on-site gen; short land-banked DC REITs in the three states.", "tweetA": "One quarter of planned US data-center construction is now under a governor who campaigned on stopping it. That isn't a headline risk. It's a capex reallocation to whatever state says yes first.", "tweetB": "More than half of voters said AI and data centers were a major factor in their vote. Two years ago that number would have rounded to zero. AI just became a kitchen-table issue, and politicians follow kitchen tables.", "charts": {"count": 1, "hot": true, "desc": "🔥 FT infographic: anti-DC winners across TX/GA/OH"}, "link": "https://theexponentialist.substack.com/p/the-download-14", "id": 14}, {"cat": "ai/infra", "urgency": "watch", "source": "David Mattin / The Exponentialist", "title": "Ramp data: AI token spend grew 1.5% over Aug-Sep vs 42% in July alone, even as usage kept climbing", "idea": "Across Ramp's business customers, token spend grew only 1.5% over August and September, versus +42% in July alone, while usage kept rising. Ramp economist Ara Kharazian blames OpenAI/Anthropic price cuts plus routing simple tasks to cheap open-source models: 'The era of hypergrowth may be over.' Notion's Akshay Kothari: 'tokens go brrr, costs go ahhh.'", "angle": "This is deflation in the unit price of intelligence showing up in the revenue line. It's the direct counterpoint to BEP's 'cost per task' pitch from Anthropic. Volume up, price down: who captures the surplus?", "tweetA": "Token usage up, token spend flat. That's not demand failing, that's price deflation running faster than adoption. Great for customers, terrifying for anyone underwriting a $1T lab on revenue multiples.", "tweetB": "July: +42% AI spend. Aug-Sep: +1.5%. Same companies, more usage. The second derivative of AI revenue just went negative at the SMB level, in the same month the biggest AI IPO in history goes on the road.", "charts": {"count": 0, "hot": false, "desc": "Charts inside: worth opening"}, "link": "https://theexponentialist.substack.com/p/the-download-14", "id": 15}, {"cat": "geopolitics", "urgency": "deep", "source": "David Mattin / The Exponentialist", "title": "China blocks SoftBank's $5.4B purchase of ABB Robotics' China arm: factory robot data is now a strategic asset", "idea": "Beijing's state planner barred SoftBank from buying ABB Robotics' China business (ABB Robotics has ~7,000 staff; China is its biggest market) out of SoftBank's $5.375B global deal. The worry was that Chinese factory robotics data could train foreign AI models, including OpenAI's, where SoftBank is a major investor. It's the second block this year after Meta was forced to unwind its $2B Manus deal in April.", "angle": "Physical-AI training data now gets the same treatment as rare earths. Western robotics buyers will pay a 'China carve-out' discount. Domestic Chinese robot makers gain a protected data moat.", "tweetA": "China didn't block SoftBank over robots. It blocked it over the data robots generate. Factory telemetry is the new rare earth, and Beijing just put export controls on it.", "tweetB": "Meta-Manus unwound in April, SoftBank-ABB blocked in November. Any Western deal touching Chinese physical-world data is now dead on arrival. Masa's physical-AI thesis just lost its biggest training ground. $SFTBY $ABBN", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://theexponentialist.substack.com/p/the-download-14", "id": 16}, {"cat": "labor", "urgency": "deep", "source": "David Mattin / The Exponentialist", "title": "UK MPs drowning in AI-written complaints: 200-page grievances, tribunal claims up 28% y/y", "idea": "A UK MP's caseworker: 'Half the emails we receive are some form of AI.' Council complaints that averaged ~2 pages are often 10x longer, some 200 pages, citing foreign case law. Employment tribunal claims are up 28% y/y, and employers report AI-drafted grievances. Wiltshire Council is exploring AI to read and reply. Separately: humanoid cleaning at $60/week for two teleoperated robots (Tau Robotics), and Pew finds 71% of Americans expect fewer jobs over 20 years.", "angle": "AI is lowering the cost of filing claims faster than institutions can absorb them. The first measurable AI 'productivity' shock may be a litigation and admin cost shock for employers and governments.", "tweetA": "Employment tribunal claims +28% in a year, complaints 10x longer. AI's first measurable labor effect isn't job losses, it's every employee getting a free lawyer. HR costs are about to go up, not down.", "tweetB": "Citizens use AI to write 200-page complaints; councils use AI to answer them. Bots arguing with bots on the taxpayer's dime. This is what Baumol meets LLMs looks like.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://theexponentialist.substack.com/p/the-download-14", "id": 17}, {"cat": "regulation", "urgency": "watch", "source": "David Mattin / The Exponentialist", "title": "Google tells US schools: no AI means no Google Search", "idea": "After backlash to Gemini defaulting on for students, and NYC Mayor Mamdani banning most AI in schools, Google made Gemini off-by-default for students but said Search now has AI built in, so a school wanting zero AI loses Search entirely. Mamdani called it monopoly coercion; Lina Khan called it coercion.", "angle": "This is a tying argument written for antitrust lawyers, landing as Democrats take Congress in January. GOOGL's remedy risk just got a sympathetic plaintiff: kids.", "tweetA": "Google's message to schools: you can have search without AI as long as you don't want search. That's a tying case with a kindergarten-sized plaintiff, delivered to a Democratic Congress. $GOOGL", "tweetB": "The new AI moat isn't model quality. It's making the old product impossible to use without the new one. Google just showed the playbook, and handed regulators the exhibit.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://theexponentialist.substack.com/p/the-download-14", "id": 18}, {"cat": "crypto", "urgency": "watch", "source": "Danny Dayan / Macro Musings", "title": "Is BTC's range set by the mining cost? No signal for weeks and price can't break above miners' cost", "idea": "Danny D's systematic crypto models have given no trade signal for weeks; the strategy deliberately sits out 'the frustrating chop'. His question: is the crypto range a function of elevated mining costs? If price can't break above the mining cost, the range may persist.", "angle": "Connects to MARA's $1.1B BTC sale: if spot sits near or below all-in cost, miners are forced sellers on every bounce. That caps rallies mechanically until hashprice or difficulty adjust.", "tweetA": "If BTC trades near the all-in mining cost, every bounce becomes miner supply. MARA just sold $1.1B. The ceiling isn't technical, it's industrial.", "tweetB": "Systematic models with no signal for weeks is itself a signal: vol compression in a market that's supposed to be the most volatile asset class. Coiled ranges resolve violently.", "charts": {"count": 0, "hot": false, "desc": "Charts inside: worth opening (model indicators)"}, "link": "https://dannydayan.substack.com/p/crypto-update-710", "id": 19}, {"cat": "tech", "urgency": "red", "source": "SixSigmaCapital / SixSigmaResearch chat", "title": "Three earnings pops in three days: TMDX, QXO, now HROW (+20%, record $99.3M revenue, +39% y/y)", "idea": "HROW reported record Q3 revenue of $99.3M (+39% y/y), led by record VEVYE revenue of $39.7M, and traded up ~15-20%. SixSigma notes this is 3 portfolio winners in 3 sessions (TMDX Friday, QXO Monday, HROW Tuesday). They took a small starter position in another name (details in live chat).", "angle": "Small and mid-cap healthcare and specialty names are rewarding earnings while mega-cap tech bleeds. That fits Deluard's healthcare rotation and Bulltard's 'no tech in momentum scans'.", "tweetA": "While the index fights over NVDA's CEO, specialty pharma quietly prints +39% growth and pops 20%. Rotation doesn't announce itself; it shows up in the earnings reactions of names nobody's watching. $HROW", "tweetB": "Three straight days of 15%+ earnings pops in non-AI names. When the market pays up for real growth outside tech, it's telling you where the marginal dollar is going.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://open.substack.com/chat/posts/9dbe219c-5cd3-4ec3-8210-00b0bb74f9d2", "id": 20}, {"cat": "geopolitics", "urgency": "deep", "source": "SixSigmaCapital / SixSigmaResearch chat", "title": "Microsoft lobbying the White House not to bar Chinese imports of a key AI data-center component", "idea": "Per Reuters (via the SixSigma morning note), Microsoft is pressing the Trump administration to halt plans to bar Chinese imports of a key component used in AI data centers. Same session: Alibaba's T-Head chip unit confidentially filed for a Hong Kong listing.", "angle": "Hyperscalers are now lobbying against decoupling at the component level, just as the Jensen/Megaspeed scandal pushes Congress toward tighter export controls. The policy direction is the opposite of what MSFT wants.", "tweetA": "Microsoft is lobbying to keep buying a Chinese data-center component the same week Nvidia's CEO is under FBI review over a suspected Chinese spy. Worst possible timing to ask Washington for China exceptions. $MSFT", "tweetB": "Alibaba is spinning out its chip arm in Hong Kong while US hyperscalers lobby to keep Chinese parts flowing. Decoupling is happening in press releases; the bill of materials says otherwise. $BABA", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://open.substack.com/chat/posts/15fbd109-47f4-4812-9a3e-18a856e7667d", "id": 21}, {"cat": "regulation", "urgency": "deep", "source": "SixSigmaCapital / SixSigmaResearch chat", "title": "FDA orders NAION vision-loss warning on all GLP-1s; California voters reject 5% billionaire wealth tax", "idea": "FDA requires all GLP-1 makers (LLY Zepbound, NVO Wegovy) to add a warning on potential increased risk of NAION, a rare optic-nerve condition that can cause vision loss. California voters rejected Prop 40, a one-time 5% wealth tax on billionaires, sparing Zuckerberg a multibillion-dollar bill. SE: revenue $8.6B (+43%) but credit-loss provisions +82% to $681.5M. USAR: Serra Verde began commercial heavy rare-earth carbonate shipments.", "angle": "The GLP-1 label change is class-wide, so no relative share shift, but it gives payers a lever on coverage. SE's provisions growing ~2x revenue growth is the EM consumer credit tell.", "tweetA": "Sea grew revenue 43% and credit-loss provisions 82%. When provisions outrun revenue 2:1, the growth is being financed, not earned. Watch the EM fintech lending book. $SE", "tweetB": "A blue wave nationally, yet California voted down a billionaire wealth tax. Voters punish data centers and protect billionaires in the same election. Populism is narrower than the headlines say.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://open.substack.com/chat/posts/15fbd109-47f4-4812-9a3e-18a856e7667d", "id": 22}, {"cat": "tech", "urgency": "deep", "source": "Gergely Orosz / The Pragmatic Engineer", "title": "'No good fix for supply chain security': popular languages assume a trustworthy ecosystem, and agents now write most code", "idea": "Antithesis' Sean Allen: supply chain attacks (hijacked packages executing malicious code) are very hard to defend against. Languages with robust capability-based defenses, like 'E', are unpopular, while popular languages assume a trustworthy ecosystem. Gergely frames the interview around AI agents producing more code than ever, and therefore more bugs shipping to prod. Allen prefers type systems that 'make illegal states unrepresentable' (ML family: OCaml, F#, Rust's sum types) over late-stage testing gates.", "angle": "More agent-written code pulling more dependencies equals a bigger supply-chain attack surface. That's a structural tailwind for verification and correctness tooling (Antithesis, Jepsen-style testing) and for security names in package and SBOM scanning.", "tweetA": "Agents write code 100x faster and pull in dependencies 100x faster. The supply chain attack surface scales with agent output, not developer headcount. Security spend per engineer is about to go up even as engineers go down. $CRWD $S", "tweetB": "The best AI-era coding advice came from an interview that banned the word 'AI': make illegal states unrepresentable. If an agent writes the code, the compiler had better be the reviewer.", "charts": {"count": 0, "hot": false, "desc": "Code samples inside"}, "link": "https://newsletter.pragmaticengineer.com/p/software-correctness", "id": 23}, {"cat": "tech", "urgency": "watch", "source": "Gergely Orosz / The Pragmatic Engineer", "title": "'Tech debt only hurts if you have to pay it back', and the Bank Test still breaks distributed databases", "idea": "Allen argues tech debt is often never repaid: it gets discarded in rewrites once a system becomes popular. On correctness he describes the 'Bank Test' workload: $10,000 split across 10 accounts, random transfers, and a concurrent reader that should only ever see $10,000. Under network faults or node kills (Jepsen/Antithesis style), 'bugs start popping out like crazy' even in mature databases.", "angle": "When agents make rewrites cheap, tech debt becomes an option, not a liability. But fault-injection testing becomes mandatory, because agents won't intuit distributed-systems invariants.", "tweetA": "If agents make rewrites cheap, tech debt stops being debt. It becomes a call option you never exercise. The real cost moves to correctness under faults, which no agent tests for by default.", "tweetB": "Ten accounts, $10,000, random transfers, one reader that must always see $10,000. Mature distributed databases still fail this under network faults. Now picture agent-generated payment code. Fintech's next incident is already in the repo.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://newsletter.pragmaticengineer.com/p/software-correctness", "id": 24}, {"cat": "ai/infra", "urgency": "red", "source": "Maggie Lake / The Market House (Vincent Deluard, StoneX)", "title": "Deluard: Anthropic pricing indication went from $2T to ~$1.2T in weeks, so 'I would not rush to buy'", "idea": "StoneX's Deluard (bear-market warning since summer) says the Anthropic IPO pricing indication 'is not great': '$2 trillion just a few weeks ago, now it's like 1.2.' He sees a 'bubble in pessimism' driven by tech CEOs' twin narratives (it takes your jobs, it might end the world). If it crashes, expect a 2008-style congressional parade. He also notes that NASDAQ's best days were in 2001-02.", "angle": "Three data points on Anthropic's valuation in one day: Deluard ~$1.2T, Mando $1T target, BEP '$1.3T is the floor'. That spread is the trade: whoever is right about where the book clears sets the AI multiple for 2027.", "tweetA": "Anthropic in the same afternoon: '$1.2T' (StoneX), '$1T target' (wires), '$1.3T is the floor' (investor meeting). When three sources can't agree within 30%, the IPO is the price discovery for the entire AI complex.", "tweetB": "A 40% haircut to the IPO talk in weeks, and it's still the largest IPO ever. The re-rating isn't about Anthropic, it's about what public markets will pay for frontier AI growth. Every private mark in the sector is watching this book.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://themarkethouse.substack.com/p/vincent-deluard-on-the-case-for-healthcare", "id": 25}, {"cat": "macro", "urgency": "deep", "source": "Maggie Lake / The Market House (Vincent Deluard, StoneX)", "title": "'You'll cancel Hulu but still take your insulin': healthcare, plus an AI-lab bailout traded for healthcare focus", "idea": "Deluard's top defensive pick is healthcare: a quiet bull market, Blue Wave likely to reverse Medicare/Medicaid cuts. His novel twist: if AI labs need a bailout, the quid pro quo could be redirecting AI to healthcare, like GM's bailout came with the Chevy Volt. He is not keen on staples ('Hershey's traded at a higher multiple than NVIDIA') or utilities ('traded like AI derivatives').", "angle": "If AI-lab capital gets politically conditioned, health and drug discovery becomes the sanctioned use case. That makes AI-bio platforms and CROs the 'policy-favoured' AI exposure.", "tweetA": "Hershey at a higher P/E than Nvidia. Utilities trading like AI derivatives. The 'defensive' sectors aren't defensive anymore. Healthcare is the only one that still behaves like it. $XLV", "tweetB": "The 2008 playbook: bail out GM, demand the Volt. The 2027 version: bail out an AI lab, demand it cure something. If the government ever writes that check, the strings will say 'healthcare'.", "charts": {"count": 0, "hot": false, "desc": "Chart inside: healthcare sector relative performance"}, "link": "https://themarkethouse.substack.com/p/vincent-deluard-on-the-case-for-healthcare", "id": 26}, {"cat": "credit", "urgency": "deep", "source": "Maggie Lake / The Market House (Vincent Deluard, StoneX)", "title": "Long bonds as a hiding place: $1T TGA run-down in a debt-ceiling fight could drop long yields ~100bp", "idea": "Deluard stays in the high-inflation camp but sees a tactical window for long Treasuries. The market has priced down to 1-2 cuts; a budget and debt-ceiling battle would curtail issuance; and the TGA holds ~$1T. Running it down without new issuance could collapse long-end yields 'like the 100bp' moves in past standoffs. 'For the next 12 months, especially if we have a bear market... long-term treasuries would be a great place to hide.'", "angle": "Contrast with Boockvar's soft 10y auction at 5.02% the same day: supply indigestion now versus a supply drought later. The trade is timing the debt-ceiling X-date under a Democratic House from January.", "tweetA": "The 10y auction tailed at 5.02% today. Deluard says a debt-ceiling standoff drains the $1T TGA and long yields drop 100bp. Short-term supply glut, medium-term supply drought. The calendar is the trade. $TLT", "tweetB": "Democrats take the House in January. The power of the purse becomes the main lever. Every debt-ceiling standoff in the past decade ended with a bond rally. Positioning for 5% 10s as if they're permanent is a choice.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://themarkethouse.substack.com/p/vincent-deluard-on-the-case-for-healthcare", "id": 27}, {"cat": "macro", "urgency": "deep", "source": "Maggie Lake / The Market House (Vincent Deluard, StoneX)", "title": "'The euro is the new yen': EUR/USD to 0.7-0.8 as the eurozone's pressure valve; Canada is the cheap winner", "idea": "Deluard: European capital moves slowly ('we're on vacation half the year'); fiscal and political drift persists; and the euro is the region's pressure valve, possibly falling to 0.8 or 0.7. Hedge the currency on European equities. Lagarde 'bravely leaving the Titanic'. Canada: the top-performing MSCI region YTD, CAD lost ~35% despite fundamentals, it gains from Russian oil and fertilizer supply loss, and its politics have stabilized.", "angle": "This directly conflicts with Howell's flow data showing rotation into the Eurozone and Bespoke's STOXX 600 near highs. The resolution: own European exporters currency-hedged, and own Canada for commodity beta with a cheap currency.", "tweetA": "Flows are rotating into Europe (Howell). STOXX 600 is near a high (Bespoke). And StoneX says the euro could go to 0.7. If he's right, every unhedged European long is a currency trade dressed as an equity trade.", "tweetB": "Canada: top MSCI region this year, currency down 35% over the cycle, digs stuff up and sells it to the US during a commodity supply shock. The cheapest way to own the war premium might be the TSX. $EWC", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://themarkethouse.substack.com/p/vincent-deluard-on-the-case-for-healthcare", "id": 28}, {"cat": "ai/infra", "urgency": "red", "source": "Michael Parekh / AI Ramblings Daily", "title": "Nvidia's board: 11 directors, ~15-year average tenure, 161 combined years, zero big-company CEOs, zero national-security experience", "idea": "Nvidia's board averages almost 15 years of tenure (2x the S&P norm), 161 combined years. Two directors (Coxe of Sutter Hill, Stevens of Sequoia) date from the 1993 $2M first round and are the #2 and #3 individual holders. No current or former big-company CEO (Meta and Microsoft each have four). The lead independent director's firm, Cooley, has represented Nvidia since 1993. 'Succession' appears 0 times in Nvidia's annual report versus 25 in Microsoft's and 16 in Alphabet's. Jensen has ~60 direct reports and no No. 2.", "angle": "Unlike Musk and Zuckerberg, Jensen has no super-voting shares (3.56%, one share one vote), so the board can fire him in theory. The governance discount is real and new. Watch for proxy advisors and big index holders pushing board refresh at the next AGM.", "tweetA": "'Succession' appears 25 times in Microsoft's annual report. 16 in Alphabet's. Zero in Nvidia's. A $4.5T company with 60 direct reports and no No. 2 is a single point of failure the market just discovered. $NVDA", "tweetB": "The lead independent director investigating Jensen chairs governance and his law firm has represented Nvidia since 1993. The board cleared him before the investigation finished. That's not a probe, it's a press release.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/too-big-to-govern-in-ai-nvidia-jensen", "id": 29}, {"cat": "geopolitics", "urgency": "red", "source": "Michael Parekh / AI Ramblings Daily", "title": "Megaspeed: $4.6B of Nvidia imports, $7.5B of chip shipments via Chinese firms, and a Commerce probe moved to DOJ after Nvidia's GC called", "idea": "Megaspeed (founded 2023, Singapore) became an Nvidia Cloud Partner within days of a Nov 2023 sale, imported >$4.6B of Nvidia hardware, and rented chips to Alibaba from Southeast Asia. Per The Information, Jensen's ties to Alice Huang facilitated ≥$7.5B of shipments through Chinese firms, including Shanghai Century Litong (founded June 2023, preferred partner by October). Commerce's probe moved to Justice after Nvidia's general counsel contacted export-control officials. A short seller flagged the ties six months earlier. Trump meets Xi next week at APEC in Shenzhen.", "angle": "The export-control push is now bipartisan and Congress flips in January: rules on remote GPU access and lithography are coming. Nvidia also holds ~$99B of stakes in labs and neoclouds, so neoclouds (CRWV) carry second-order risk if Nvidia's balance-sheet support gets scrutinized.", "tweetA": "Founded June 2023. Nvidia preferred partner by October. $7.5B of chips later, it's a DOJ case. The speed of that onboarding is the story, not the affair. $NVDA", "tweetB": "Nvidia has ~$99B in stakes across AI labs and neoclouds. If Washington starts auditing who Nvidia backstops, the weakest links aren't Nvidia, they're the neoclouds living on its balance sheet. $CRWV", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/too-big-to-govern-in-ai-nvidia-jensen", "id": 30}, {"cat": "tech", "urgency": "watch", "source": "Michael Parekh / AI Ramblings Daily", "title": "Apple launches $50 'intelligence usage packs', the first consumer metering of on-device AI features", "idea": "Apple started selling $50 'intelligence usage packs' for select AI features (9to5Mac). Parekh's favourite 2026 gift idea is AI subscription cards with how-to guides, because the biggest question for consumers is still what AI is good for. He stays sidelined on smart glasses for at least another year.", "angle": "Apple metering AI is the consumer version of Ramp's token-spend data: usage-based pricing moves to the edge. It's also a clue to Apple's AI services monetization model, with services margin applied to compute.", "tweetA": "Apple just started selling AI by the bag: $50 usage packs. The company that made apps $0.99 is now metering intelligence. Consumer AI pricing is converging on prepaid phone minutes. $AAPL", "tweetB": "If on-device AI needs prepaid usage packs, then 'on-device' isn't really free compute. Apple is telling you where the inference cost lands, and it's on your credit card.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/too-big-to-govern-in-ai-nvidia-jensen", "id": 31}, {"cat": "positioning", "urgency": "deep", "source": "Stephen Innes / Dark Side of the Boom (Privorotsky)", "title": "Goldman's Privorotsky recovery checklist: energy collapsing, inflation expectations rolling over, credit fine, but the bond market hasn't confirmed", "idea": "After one of the most aggressive hedge-fund deleveraging episodes of the decade, Goldman's EMEA Delta One head sees the ingredients for a durable recovery: collapsing energy prices, sharply lower inflation expectations, resilient credit, and the political threat to AI capex possibly overstated. But he is not chasing. The key is short covering versus genuine re-risking, and Treasury yields 'remain surprisingly stubborn'. Momentum and high-beta damage has created an unusual positioning opportunity.", "angle": "Today's CPI and auction answered his open question badly: yields broke higher while breakevens stayed flat. The missing confirmation (bonds) moved against him. Stay tactical, don't add beta yet.", "tweetA": "Goldman's checklist had one box left unticked: bonds. Today the 10y printed 5.02% at auction. The recovery thesis needed yields to cooperate, and they just did the opposite.", "tweetB": "Inflation expectations falling while nominal yields rise means real yields are doing all the tightening. That's the scenario where high-beta stays broken even as macro 'improves'.", "charts": {"count": 0, "hot": false, "desc": "Charts inside: worth opening (momentum/high-beta drawdowns)"}, "link": "https://thedarksideoftheboom.substack.com/p/the-recovery-checklist-rich-privorotsky", "id": 32}, {"cat": "culture", "urgency": "deep", "source": "Nick Reese / The Binary Breakaway", "title": "Walls dominated war for millennia, until the air domain made them worthless overnight", "idea": "A Veterans Day essay: from the Athenian Long Walls (Athens is 6km from Piraeus) to Constantinople in 1453, fortified cities could outlast sieges for months or years. That forced centuries of offensive innovation: the Assyrian armored 'tortoise' ram (a proto-tank), Demetrius I's iron-plated Helepolis siege tower, torsion ballistae, and defensive counter-tech like the Claw of Archimedes at Syracuse. The opening of the air domain then made walls obsolete almost overnight.", "angle": "Pattern recognition for defense tech: long eras of defensive dominance end with a domain shift, not an incremental weapon. Today's analog: drones and cheap precision munitions versus hardened assets, and the space and cyber domains versus terrestrial defenses.", "tweetA": "Walls won wars for 3,000 years. Then airplanes made them irrelevant in about 30. Every defense budget that assumes today's dominant asset stays dominant is building a wall. Drones are the airplane.", "tweetB": "The Assyrians built an armored battering ram on wheels with an archer tower. That's a tank, ~2,800 years early. Military innovation is mostly old ideas waiting for a new power source.", "charts": {"count": 4, "hot": false, "desc": "4 historical images (Long Walls, Assyrian tortoise, Helepolis, ballista)"}, "link": "https://binarybreakaway.substack.com/p/the-most-frightening-military-technologies-93a", "id": 33}, {"cat": "positioning", "urgency": "deep", "source": "The Haymaker Team", "title": "Price-to-sales is the cyclical warning light, and construction machinery and heavy trucks are flashing it", "idea": "Haymaker extends its price-to-sales framework from energy to the Construction Machinery & Heavy Transportation Equipment sub-industry (CAT, DE, PCAR, CMI and peers): for highly cyclical names, P/E misleads at peak margins, so P/S is the better valuation gauge. The teaser hook: 'A deer and a caterpillar walk into a data center.'", "angle": "CAT and DE have been re-rated as AI and data-center power plays (gensets, turbines, site work). If the DC moratoria bite, the P/S premium on these cyclicals has the most air under it.", "tweetA": "Caterpillar got re-rated as an AI stock because data centers need gensets and dirt moved. Now three states are pausing data centers. Cyclicals at peak P/S don't need a recession to fall, they just need the story to change. $CAT", "tweetB": "P/E lies at the top of a cycle because margins are peaking. P/S doesn't. If your 'AI infrastructure' industrial trades at a record price-to-sales, you're paying peak multiple on peak margin.", "charts": {"count": 0, "hot": false, "desc": "Charts inside: worth opening (sub-sector P/S history)"}, "link": "https://haymaker.substack.com/p/haymaker-daily-a33", "id": 34}, {"cat": "positioning", "urgency": "red", "source": "James Bulltard / Running of the Bulltards", "title": "QQQ heading for a 4th straight close under the 200-day; momentum scans show zero tech names, all defensives", "idea": "SPY gapped down on the hot CPI then recovered the gap, but is stuck below its EMA with the 21-day sloping down. QQQ is set for its 4th consecutive close under the 200-day with 'perfect rejections' the last two sessions; the target if reclaimed is the ~720 gap. NVDA at ~8% of QQQ is the drag. His large-cap momentum scan shows no tech names and many defensive large caps.", "angle": "Momentum leadership rotating to defensives is the Deluard/healthcare thesis showing up in price. Four closes under the 200-day is a regime signal for systematic trend followers: expect CTA selling if it holds through Friday.", "tweetA": "Four closes under the 200-day, an 8% index weight in a stock whose CEO is under FBI review, and a momentum scan with zero tech names. Leadership has already left. The index just hasn't noticed. $QQQ $NVDA", "tweetB": "When the momentum screen is full of staples and healthcare, the market is telling you it's playing defense, while the headlines still talk about 'buying the AI dip'.", "charts": {"count": 2, "hot": false, "desc": "SPY and QQQ daily charts with 21-day/200-day levels"}, "link": "https://www.jamesbulltard.com/p/111026-recap", "id": 35}, {"cat": "ai/infra", "urgency": "red", "source": "AI Futures Project (Kokotajlo et al.)", "title": "AI 2027 authors now all forecast a Superhuman AI Researcher in 2027: METR implies we're 5 months AHEAD of their own scenario", "idea": "METR estimates Anthropic's progress is ~2x historical (1.3-3x range) with ~80% attributable to AI, which implies ~1.7x AI-attributable acceleration. Their own most aggressive model gave <4% odds of ≥1.7x by Nov 2026. Their AI 2027 scenario hit 1.7x around April 2027, so reality is ~5 months ahead. All authors now forecast SAR (the point where a lab would rather fire its human researchers than lose its AI) in 2027. Filtered AIFM median: Feb 2027. 35-65% chance of TED-AI (automates all white-collar work) before 2028. They call for an industry-wide pause.", "angle": "The most aggressive public forecasters were too conservative by a lot. For markets this cuts both ways: an Anthropic growth story, plus a regulatory-pause tail that nobody prices into the IPO.", "tweetA": "The people who wrote 'AI 2027', the most aggressive public forecast, gave this outcome under 4% odds three months ago. Now they say we're 5 months ahead of their scenario. When the doomers are too slow, the consensus is badly priced.", "tweetB": "Read the AI Futures update next to the Anthropic roadshow: one asks the world to pause frontier AI, the other asks the world for $64B to accelerate it. Same company, same week. Policy risk is the unpriced factor in this IPO.", "charts": {"count": 3, "hot": true, "desc": "🔥 AECI trendline break (1.9x slope after Oct 2025) and forecast-distribution charts"}, "link": "https://blog.aifutures.org/p/q35-timelines-update-looks-like-the", "id": 36}, {"cat": "ai/infra", "urgency": "deep", "source": "AI Futures Project (Kokotajlo et al.)", "title": "Researchers self-report 12x labor uplift, yet overall progress is only ~1.7x faster: compute and diminishing returns eat the difference", "idea": "An informal poll of Anthropic researchers gave ~12x self-reported labor uplift. AI Futures separates three things: labor uplift (people work faster), software R&D uplift (lower, because experiments need GPUs), and pace-of-progress acceleration (lower still, from diminishing returns plus compute). 'To make the car go twice as fast, the engine has to work more than twice as fast because the hill gets steeper.' A 1.7x pace of progress is 'a much bigger deal than making employees 1.7x more productive'.", "angle": "This is the clearest argument that compute, not talent, is now the binding constraint on frontier progress. That is bullish for GPU and HBM demand regardless of model-price deflation (Ramp's data).", "tweetA": "Researchers say AI makes them 12x faster. Progress is only 1.7x faster. The missing 7x is the GPU bottleneck. If you want to know who captures AI-accelerated AI research, follow the compute, not the people. $NVDA $MU", "tweetB": "12x labor uplift should have been a talent-market earthquake. It shows up as 1.7x because experiments still need compute. The scarce input in AI R&D isn't researchers any more, it's GPU-hours.", "charts": {"count": 0, "hot": false, "desc": "Car-uphill analogy diagram and uplift charts"}, "link": "https://blog.aifutures.org/p/q35-timelines-update-looks-like-the", "id": 37}, {"cat": "regulation", "urgency": "watch", "source": "AI Futures Project (Kokotajlo et al.)", "title": "'Anthropic redacted a majority of the evidence we found most informative': the transparency fight over the acceleration claim", "idea": "METR says Anthropic redacted most of the evidence behind the 2x and 80% figures; only the AECI benchmark slope chart was shareable. The Fable 5.2 system card says Mythos 5.2 does not double aggregate R&D progress, which is ambiguous on the internal frontier model. AI Futures is 'very skeptical' Anthropic weighed the redaction fairly and urges release. They also warn that if SAR is trained soon, China could likely steal the recipe or weights.", "angle": "A public company in registration with redacted safety-relevant evidence is new territory for SEC disclosure. Expect disclosure questions in the roadshow and from a Democratic Congress.", "tweetA": "A company on an IPO roadshow is withholding most of the evidence on whether its AI is accelerating its own development. That isn't just a safety question any more. It's a disclosure question.", "tweetB": "The most consequential chart in AI this year comes with most of its data redacted. Investors are pricing a slope they're not allowed to see.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://blog.aifutures.org/p/q35-timelines-update-looks-like-the", "id": 38}, {"cat": "ai/infra", "urgency": "watch", "source": "Matt Robinson / AI Street", "title": "Jump Trading opens a compute trading desk: GPU rentals still clear 30-40% above market via insider deals", "idea": "Itô Markets' founders joined Jump in October to run a compute trading desk. Jump also backs Silicon Data (GPU rental price index), co-leading its seed with DRW. GPU renting is 'like booking a vacation in the 1980s', with real information asymmetry: one startup paid 30-40% above the going rate via a supplier co-founded by its adviser. The core mismatch: owners want long contracts with established counterparties, renters want short flexible blocks. Itô built an agent that market-makes as principal inside Slack and WhatsApp.", "angle": "When prop shops (Jump, DRW) start making markets in a commodity, futures follow. Standardized GPU contracts let neoclouds hedge utilization and lenders mark GPU collateral, which makes GPU-backed debt more financeable.", "tweetA": "Jump Trading now has a compute desk. Prop shops showed up in crypto right before it got futures, basis trades and an ETF. GPU-hours are next. The first standardized H100 contract will change how neocloud debt gets priced.", "tweetB": "Startups are paying 30-40% over market for GPUs because the market has no screen. $10T of buildout by 2032, priced like 1980s travel agents. The arbitrage is the business. $CRWV", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.ai-street.co/p/jump-trading-on-what-it-takes-to", "id": 39}, {"cat": "ai/infra", "urgency": "watch", "source": "Matt Robinson / AI Street", "title": "Tokens as crude oil: the case for a market in AI tokens like the gasoline/kerosene crack spread", "idea": "Soumah Fernandez compares AI tokens to crude oil and its refined products (gasoline, kerosene), implying markets could form for differentiated token types. Even basic GPU contract terms (memory, storage) need common definitions before buyers can compare offers. The piece cites one projection that the AI buildout reaches $10T by 2032, the biggest bet in US history relative to GDP.", "angle": "If compute is crude and tokens are refined product, model labs are refiners, and their margin is the 'crack spread' between GPU-hour cost and token price. Ramp's flat token spend says that spread is compressing.", "tweetA": "If GPU-hours are crude and tokens are gasoline, AI labs are refiners. Refiners don't earn tech multiples. They earn the crack spread. Ramp's data says the spread is compressing.", "tweetB": "Thinking in crack spreads: the GPU-hour price (input) is set by Nvidia scarcity, the token price (output) by open-source competition. The lab margin is squeezed from both sides unless it owns the chips.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.ai-street.co/p/jump-trading-on-what-it-takes-to", "id": 40}, {"cat": "macro", "urgency": "deep", "source": "Michael Howell / Capital Wars", "title": "Global liquidity momentum keeps fading; the Shadow Monetary Base is weakening; money is rotating from the US, Japan and UK into the Eurozone", "idea": "Headline global liquidity's slide paused last week, but growth rates show continued loss of momentum. Underlying liquidity, measured by the Shadow Monetary Base, weakened, so liquidity is leaning on supportive funding conditions. Investors remain risk-on but are rotating away from Japan, the US and UK into the Eurozone, and cutting exposure to most EMs including China.", "angle": "Fading liquidity momentum plus a Fed priced to hike is the setup for risk assets losing their liquidity tailwind into year-end. The Eurozone rotation matches Bespoke's STOXX 600 highs but conflicts with Deluard's euro-crash call.", "tweetA": "Liquidity momentum fading, the Fed priced to hike, and investors still 'risk-on' but rotating. That isn't a bull market broadening. It's a bull market looking for the exit with the least traffic.", "tweetB": "Money leaving the US for the Eurozone the same week the STOXX 600 nears a record and StoneX calls the euro 'the new yen'. Someone is about to be very right about EUR/USD.", "charts": {"count": 0, "hot": false, "desc": "Charts inside: worth opening (global liquidity and Shadow Monetary Base)"}, "link": "https://capitalwars.substack.com/p/global-liquidity-watch-weekly-update-4c0", "id": 41}, {"cat": "credit", "urgency": "red", "source": "Peter Boockvar / The Boock Report (10y auction)", "title": "10y auction tails at 5.02%, dealers stuck with 10% (most since May), but breakevens barely move: a real-rate shock", "idea": "The 10-year auction stopped at 5.02%, 1bp through the when-issued. Bid-to-cover 2.46 vs 2.53 one-year average. Dealers were left with 10%, the most since May. Yet post-CPI breakevens: 2y +4bp to just 2.15%, 5y +1bp to 2.26%, 10y unchanged at 2.22%. Boockvar: breakevens are focused on falling oil, while nominals react to a Fed 'definitely going to hike next month', with another in January.", "angle": "Real 10y yields are now ~2.8%. A tight-real-rate regime is the hardest backdrop for long-duration equity, unprofitable tech and BTC. It's also a gift for TIPS buyers if oil rebounds.", "tweetA": "10y at 5.02%, 10y breakeven 2.22%. That's a ~2.8% real yield. The last time real rates were this high, the market didn't pay 30x for growth. The Fed hasn't even hiked yet. $TLT $QQQ", "tweetB": "Breakevens didn't move on a hot CPI. Nominals did. The bond market isn't scared of inflation, it's scared of the Fed. A hike into falling inflation expectations is the definition of overtightening risk.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://peterboockvar.substack.com/p/10-yr-auction-soft", "id": 42}, {"cat": "positioning", "urgency": "red", "source": "Cubic Analytics", "title": "A signal that has flashed only 14 times since 1990 triggered on Nov 9", "idea": "Cubic flagged an 'emergency report': a rare signal fired on the Nov 9 session (the post-selloff rebound day) and has occurred only 14 other times since 1990. Author leans 'probably bullish' and is publishing the forward-return study (details paywalled).", "angle": "Nov 9 was the big breadth and recovery day after the deleveraging. Rare breadth-thrust style signals usually have strong forward returns, but today's CPI and real-rate shock tests it immediately. n=15 is thin.", "tweetA": "A signal with 14 prior occurrences since 1990 fires the day before a hot CPI and a soft auction. Rare signals are great until the macro regime that produced the base rate changes.", "tweetB": "Fifteen observations in 36 years. Before you trade a rare signal, ask how many of the 14 happened with the Fed about to hike. Base rates are only as good as their regime.", "charts": {"count": 0, "hot": false, "desc": "Charts inside: worth opening (signal forward returns)"}, "link": "https://cubicanalytics.substack.com/p/emergency-report-another-signal", "id": 43}, {"cat": "ai/infra", "urgency": "red", "source": "Ben Pouladian / BEP Research chat", "title": "From the Morgan Stanley Anthropic meeting: '$1.3T is the floor', single-digit dilution, a large bond coming", "idea": "Pouladian, just out of the MS investor meeting with Anthropic: IPO valuation $1.3T 'is the floor'; they want single-digit dilution; they have plenty of cash, are 'ready for a downturn', and expect to do a large bond. Blackstone and other PE firms came to them to set up a JV to push adoption across portcos. They're putting real work into making Haiku-class models much better. No ads, so they lean on JVs and partners instead of a big in-house FDE team.", "angle": "A large bond right after a mega-IPO means AI labs become investment-grade-style issuers: a new supply wave for credit markets on top of hyperscaler issuance, landing in a soft-auction, 5% 10y backdrop. Watch IG tech spreads.", "tweetA": "Anthropic: '$1.3T is the floor' and 'we expect to do a large bond.' The AI capex cycle is moving from equity-funded to debt-funded, into a 5% 10-year. Credit is now the AI trade's swing factor.", "tweetB": "Same day: StoneX says Anthropic's talk slid to $1.2T, management says $1.3T is the floor. A floor gets tested, not declared. Watch where the book actually clears.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://open.substack.com/chat/posts/4a901a5e-218a-49b3-a1c5-e375618cfa86", "id": 44}, {"cat": "ai/infra", "urgency": "deep", "source": "Ben Pouladian / BEP Research chat", "title": "Anthropic's pitch: cost per task, not cost per token, and the gap widens once tasks run past 25 minutes", "idea": "Anthropic told investors that companies measure cost to finish a task, not cost per token, and on that basis it comes in cheaper than most models, with the gap much wider for tasks over 25 minutes (heard from every cloud provider including Microsoft, big consultancies and customers). So OpenRouter-style price comparisons mislead. Corporates care about four things: cost per token, cost per task, accountability, auditability. They think 'data sovereignty' is used by a few loud consulting shops to hide their own cost (Pouladian guesses Palantir). Retention and NRR are accelerating, even at open-source fans. Pouladian keeps adding to NVDA on weakness: longer agent tasks mean far more compute.", "angle": "This is management's direct rebuttal to Ramp's 'token spend flat' data: price per token falls, tasks get longer and more valuable. If right, compute demand scales with task duration, which is bullish for NVDA and HBM despite the governance mess.", "tweetA": "Ramp says AI token spend has gone flat. Anthropic says nobody should measure tokens, measure tasks. Both can be true: tokens get cheaper, tasks get longer. Compute demand follows task length, not token price. $NVDA", "tweetB": "'The gap gets much wider once tasks run past 25 minutes.' The AI race has quietly shifted from chat to long-running agents, where the cheapest token is not the cheapest answer. OpenRouter leaderboards measure the wrong thing.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://open.substack.com/chat/posts/4a901a5e-218a-49b3-a1c5-e375618cfa86", "id": 45}, {"cat": "ai/infra", "urgency": "deep", "source": "Arvind Narayanan & Sayash Kapoor / AI as Normal Technology", "title": "Same day as 'SAR in 2027': expert reviewers 'unambiguously rejected' papers written by frontier agents", "idea": "Narayanan and Kapoor launch STABL, a non-profit lab. Their CRUX open-ended evaluations tested whether frontier agents can conduct open-ended AI research, and expert reviewers 'unambiguously rejected' the papers produced. They argue there is a 'growing chasm' between AI performance on verifiable tasks (where RSI evaluations focus and RL works) and open-ended tasks. They want to study whether data bottlenecks stop gains on verifiable tasks from carrying over.", "angle": "This is the bear case for the AI Futures/METR acceleration story: the acceleration is real on verifiable tasks (coding, benchmarks) but may not carry over to open research. Two credible camps disagreeing within hours of each other means the forecast variance is huge, and that should be priced as optionality, not certainty.", "tweetA": "4 hours apart: one group says a superhuman AI researcher arrives in 2027. Another says expert reviewers 'unambiguously rejected' every paper frontier agents wrote. Both are serious people. The gap between them is the trade.", "tweetB": "AI is exploding on tasks you can grade automatically and stalling on tasks you can't. That isn't a contradiction, it's a map: bet on automation where verification is cheap (code, math, chip design), be sceptical everywhere else.", "charts": {"count": 1, "hot": false, "desc": "2x2 quadrant chart: transformative potential vs downstream bottlenecks"}, "link": "https://www.normaltech.ai/p/the-missing-quadrant-in-responses", "id": 46}, {"cat": "labor", "urgency": "watch", "source": "Arvind Narayanan & Sayash Kapoor / AI as Normal Technology", "title": "Resilience over alignment: STABL argues AI's economic impact will come through augmentation and personal use, not job-loss statistics", "idea": "STABL's four theses: AI is a transformative general-purpose technology; societal change is bottlenecked by human and organizational speed; institutions need reform, not replacement; and resilience (not just alignment and non-proliferation) must be central to AI safety. They note aggregate US unemployment is still largely unchanged despite wide adoption, and productivity gains haven't materialized, yet professions like software engineering are 'dramatically different'. They expect big impact from personal use (e.g. AI tax advice) that raises consumer surplus while cutting labor demand outside GDP. Advisory board: Brynjolfsson, Strain, Audrey Tang, Helen Toner, Robb Willer.", "angle": "If AI's gains show up as consumer surplus (free tax advice) rather than measured GDP, official productivity data will understate AI and the Fed will misread the disinflation, a useful lens for the 'AI deflation' rates debate.", "tweetA": "If AI does your taxes for free, H&R Block loses revenue, you gain surplus, and GDP goes down. AI's biggest economic effect may be the one statistics can't see. Productivity bears are measuring the wrong thing.", "tweetB": "Unemployment unchanged, productivity data flat, yet software engineering is 'dramatically different'. The labor impact is happening inside jobs before it shows up between jobs. Watch job postings' skill mix, not payrolls.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.normaltech.ai/p/the-missing-quadrant-in-responses", "id": 47}];
