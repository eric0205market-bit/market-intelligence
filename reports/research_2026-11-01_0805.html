<script>
const ITEMS = [{"id": 1, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom (Goldman Sachs takeaways)", "title": "Global equities took a ~20% forward P/E de-rating and earnings absorbed it — Goldman says the weak spot is credit, not stocks", "idea": "Goldman's Mueller-Glissmann: global equities have de-rated roughly 20% on forward P/E, cushioned by strong earnings growth, with the damage concentrated in semis and AI infrastructure. GS stays overweight equities on 3 and 12 months but prefers government bonds over corporate credit as the diversifier, because credit carry compensation is unusually poor. Risk appetite is below neutral on hawkish rate expectations; 2022 is the flagged exception to 'rate shocks are buy-the-dip'.", "angle": "A 20% multiple compression with index levels roughly intact means earnings did all the work, so the next leg depends on whether EPS keeps outrunning rates. Credit as the funding-currency of the AI buildout is the cleaner short than equity beta.", "tweetA": "Forward P/E down ~20%, index barely scratched. That's not a bull market holding up, that's earnings growth quietly paying the bill for a repricing of rates. The question is how many more quarters EPS can keep covering it. $SPY", "tweetB": "Goldman likes equities but would rather hold govvies than credit because the carry is too thin. Now remember who is issuing the bonds to fund the AI buildout. Either spreads are wrong or the capex story is. $HYG $LQD", "charts": {"count": 0, "hot": false, "desc": "No charts in email; the underlying GS note likely has them."}, "link": "https://thedarksideoftheboom.substack.com/p/goldilocks-or-a-bond-market-reckoning"}, {"id": 2, "cat": "credit", "urgency": "watch", "source": "Dark Side of the Boom (Goldman Sachs takeaways)", "title": "Credit carry is 'unusually poor' just as tech concentration and rate-hike risk rise", "idea": "Goldman flags corporate credit as the biggest vulnerability: spreads offer little compensation while technology concentration in indices rises and further rate increases remain possible. That inverts the usual 'bonds as equity hedge' logic - the hedge being recommended is duration in governments, not credit.", "angle": "Pair with hyperscaler debt issuance for data centres: IG indices are becoming a tech-capex proxy. Worth tracking spread behaviour versus semis drawdowns.", "tweetA": "When the bank that is overweight equities tells you credit carry is unusually poor, listen to the second half of the sentence. Spreads tight, tech weight high, hikes possible. That's a short-vol seller's portfolio wearing a bond costume.", "tweetB": "Everyone hedges equity risk with credit because it has historically been the cheaper diversifier. If Goldman is right that govvies now do that job better, the whole risk-parity plumbing needs a different weight. Who is forced to rebalance?", "charts": {"count": 0, "hot": false, "desc": "None in email."}, "link": "https://thedarksideoftheboom.substack.com/p/goldilocks-or-a-bond-market-reckoning"}, {"id": 3, "cat": "AI/infra", "urgency": "act", "source": "Dark Side of the Boom (Wall Street Week Ahead)", "title": "Intel -29% in a day, S&P -1.8%, Nasdaq nearly -3%: the market now wants 'receipts' on AI capex", "idea": "Friday saw Intel collapse nearly 29%, the S&P drop 1.8% and Nasdaq almost 3%. Alphabet and Amazon had already shown that massive data-centre spend and massive profit are not the same thing. The author's framing: investors are finally separating AI demand, AI spending and AI returns, which were allowed to travel together too long. Apple, AMD and Palantir report next week.", "angle": "A single-stock -29% in a mega-cap is a regime marker, not noise. Next week's AMD and PLTR prints become referendums on the 'return on capital' question.", "tweetA": "Intel -29% in one session. Not a small cap, not a biotech. When a $100B+ name can reprice like that, the market is telling you the bid for 'AI adjacency' is gone and only demonstrated returns get paid. $INTC $AMD $PLTR", "tweetB": "Three different things were bundled for two years: AI demand, AI spending, AI returns. Friday was the unbundling. Spending without returns is now a liability on the balance sheet, not a moat.", "charts": {"count": 0, "hot": false, "desc": "None in email."}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-keep-your"}, {"id": 4, "cat": "positioning", "urgency": "act", "source": "Dark Side of the Boom (Wall Street Week Ahead)", "title": "Earnings growth >30% and still selling off — Caterpillar punished despite data-centre demand", "idea": "S&P 500 Q3 earnings growth is tracking above 30%, yet 'good' is becoming bad news. Caterpillar's data-centre demand is strong but the stock was hit because the sales outlook was not raised enough. Under the surface, energy, financials, utilities and healthcare found buyers in October, so the tape below the index is healthier than the headline. Catch: index concentration works in reverse if the largest weights keep unwinding.", "angle": "Breadth rotation is real but the index weight math means rotation cannot offset a mega-cap drawdown. Beats are priced; the trade is the guide, not the print.", "tweetA": "S&P earnings growing 30%+ and the index still can't hold a bid. Caterpillar gets sold on data-centre strength because the guide wasn't high enough. When the bar is this high, you don't trade the beat, you trade the raise. $CAT", "tweetB": "October under the surface: energy, financials, utilities, healthcare all bought. On top: the biggest weights getting hit. Rotation is happening, but the index doesn't care because 6 stocks outweigh four sectors. Math wins.", "charts": {"count": 0, "hot": false, "desc": "None in email."}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-keep-your"}, {"id": 5, "cat": "regulation", "urgency": "act", "source": "Dark Side of the Boom (Wall Street Week Ahead)", "title": "Tuesday's midterms as an AI-infrastructure risk event: Democratic wave = scrutiny of data centres, banks and crypto", "idea": "The author expects a Democratic wave would be read negatively first (AI infrastructure, banks, crypto get more scrutiny), analysed later - but warns against jumping to 'AI regulation kills the AI trade' because scrutiny is not legislation. Local resistance over electricity costs, water and footprint is already visible and would gain a louder voice in Washington.", "angle": "Political risk premium lands on the most crowded theme the same week as AMD, PLTR, AAPL earnings and Friday payrolls. Stack of binary events.", "tweetA": "Midterms Tuesday, AMD and PLTR earnings midweek, payrolls Friday, all on the most crowded trade in the market. You don't need a view on AI regulation to see that the vol surface is too cheap for that calendar.", "tweetB": "Congress scrutinizing data centres won't stop a single one being built. Local zoning boards and utility commissions will. Watch interconnection queues and rate cases, not Washington hearings.", "charts": {"count": 0, "hot": false, "desc": "None in email."}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-keep-your"}, {"id": 6, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom (Wall Street Week Ahead)", "title": "Strong growth, missing jobs: why Friday payrolls may matter more than any earnings print", "idea": "Q3 growth strong, consumer spending robust, business investment heavy, Fed on hold after upgrading its economic assessment. Employment is the missing piece. A strong print pushes cuts out and pressures the long end plus supports USD; a soft print may no longer mean risk-on, because it would raise the question of whether AI capex is masking weakness elsewhere. Author is short gold (flat now, nibbled GLD at $3,880) and long JPY.", "angle": "Growth without hiring is the AI productivity-or-capex-illusion debate in one data point. The bad-news-is-bad-news regime changes how I read a soft NFP.", "tweetA": "GDP strong, spending strong, capex strong, hiring weak. Either that's the first visible productivity gain from AI or it's a capex boom propping up headline growth. Friday's payrolls is the first real test of which. $TLT $DXY", "tweetB": "In 2023 a soft jobs print meant buy everything. Now rates fall and risk assets fall with them, because the market is asking what the capex boom was hiding. Know which regime you're in before you position for Friday.", "charts": {"count": 0, "hot": false, "desc": "None in email."}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-keep-your"}, {"id": 7, "cat": "geopolitics", "urgency": "deep", "source": "Dark Side of the Boom (Wall Street Week Ahead)", "title": "PBOC moves its liquidity anchor to the overnight rate: 1.25% vs 1.40% seven-day, starting Nov 2", "idea": "The PBOC is shifting the center of gravity of its liquidity framework from the seven-day reverse repo to the overnight rate, with daily overnight operations beginning November 2. New overnight rate set at 1.25%, below the 1.40% seven-day rate. Author treats it as an operating-framework change, not easing, and says to trade what happens to money-market conditions, not the label. Also: Bank of Thailand held at 1%, Bank Negara at 2.75%.", "angle": "A 15bp gap between overnight and 7-day anchors is a tool for tighter control of the short end. Watch DR007 migration and whether it becomes a back door for easing.", "tweetA": "The PBOC just moved its anchor from the 7-day to the overnight rate, 1.25% vs 1.40%. Call it plumbing if you want. A central bank that wants control of the overnight curve is a central bank preparing to use it. Watch how DR007 behaves from Monday.", "tweetB": "Asia gets hit differently this week: Thailand, Philippines, Vietnam inflation firmer, Korea easing, Taiwan moderating. Same oil shock, same strong dollar, completely different policy space. Dispersion trade, not a trend trade. $THB $IDR $KRW", "charts": {"count": 0, "hot": false, "desc": "None in email."}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-keep-your"}, {"id": 8, "cat": "AI/infra", "urgency": "deep", "source": "Exponential View #608 (Azeem Azhar)", "title": "The unbounded firm: AI agents share weights and state, so Coase's boundary of the firm may break upward", "idea": "Alex Imas et al. argue AI agents share reasoning patterns and working state, so nothing leaks in handoffs, producing 'supercooperative firms' where bigger gets better at every scale. Context: the largest 1% of US firms already held 97% of corporate assets in 2018. Anthropic spans coding, bio, legal and finance, scaling horizontally past the traditional boundary. EV also flags Microsoft's voluntary exit programme as a sign of this shift.", "angle": "If internal coordination cost falls faster than market transaction cost, the equilibrium firm size rises. That is a concentration thesis plus an antitrust thesis.", "tweetA": "Coase said firms exist because coordination inside is cheaper than the market. Agents that share weights and state make internal coordination nearly free. The top 1% already hold 97% of US corporate assets. Run that forward.", "tweetB": "Everyone prices AI as a cost-cutting tool inside existing companies. The bigger effect is boundary-moving: one AI-native firm entering coding, bio, legal and finance at once. Antitrust is built for one product market at a time.", "charts": {"count": 0, "hot": false, "desc": "None in email body; article links to the paper."}, "link": "https://www.exponentialview.co/p/ev-608"}, {"id": 9, "cat": "venture", "urgency": "deep", "source": "Exponential View #608 (Azeem Azhar)", "title": "One-person biotech: 89 candidate molecules in under 18 months, 11 outside labs, Claude ran contracts, then Anthropic bought it", "idea": "Cody Tranbarger, sole employee of Mithril Medicine (rare muscular dystrophy), ran experiments with 11 outside labs and eight paid consultants, with Claude handling contracts, logistics and paperwork. Result: promising mouse data and 89 candidate molecules in under 18 months. Anthropic has since acquired the company. His 'Pipeline-in-a-Person' framing: most drug research is process and bottlenecks, not go/no-go decisions; humans keep decisions under uncertainty.", "angle": "CRO and consulting layers compress if the coordination layer is software. Also a signal on Anthropic's M&A direction ahead of the IPO.", "tweetA": "One employee. 11 outside labs. 89 candidate molecules in 18 months. The scarce input in drug discovery was never lab capacity, it was the person who could coordinate it all. When that's a model, what happens to the biotech cost curve?", "tweetB": "Anthropic buying a one-person biotech weeks after filing its S-1 is a statement: the model company wants to own the use case, not just sell the tokens. Watch for more of these. $PFE $LLY", "charts": {"count": 0, "hot": false, "desc": "None in email."}, "link": "https://www.exponentialview.co/p/ev-608"}, {"id": 10, "cat": "AI/infra", "urgency": "deep", "source": "Exponential View #608 (Azeem Azhar)", "title": "Tokenmaxxing: Spawn's token bill is $3.1M, about $40 per change and $310,000 per human, 77,000 changes last month", "idea": "Ten-person games startup Spawn runs a fleet of AI agents shipping to the live product every hour: $3.1M token bill, ~$40 per change, ~$310K per human, 77,000 substantial changes last month, ~60% triggered by crashes or bug reports. Separately, Cisco's president gave a 27-year-old engineer a sidekick and unlimited tokens to rewrite 98% of Cisco's code ($63B revenue, 41-year-old codebase).", "angle": "$310K per head in tokens exceeds a typical fully loaded engineer salary, which is a data point on the real unit economics of agentic labour and on inference demand.", "tweetA": "$310,000 per employee per year on tokens. That's more than most of them would be paid. And the company is ten people shipping 77,000 changes a month. Inference demand isn't a bubble, it's a payroll line that moved. $NVDA", "tweetB": "Cisco is giving one 27-year-old unlimited tokens to rewrite 98% of a 41-year-old codebase. If it works, every legacy vendor's moat, which was the switching cost of their own code, gets re-priced. If it fails, we learn the limit. $CSCO", "charts": {"count": 0, "hot": false, "desc": "None in email."}, "link": "https://www.exponentialview.co/p/ev-608"}, {"id": 11, "cat": "energy", "urgency": "watch", "source": "Exponential View #608 (Azeem Azhar)", "title": "Casey Handmer built US solar at $0.72/W (1.8 MW for $1.3M): 45% below a typical large American solar farm", "idea": "Terraform's 1.8 MW off-grid project in Southern California cost $1.3M, about $0.72 per watt, roughly 45% cheaper than a large-scale US solar farm, though still above utility-scale prices in China or the UAE. Context: US small-scale solar generation up almost 5x since 2016 to ~93 TWh in 2025, with growth slowing since 2022 as policy added costs.", "angle": "Off-grid, behind-the-meter build avoids interconnection - the exact bottleneck for data-centre power. Cost parity pressure on grid-tied developers.", "tweetA": "$0.72/W for off-grid solar in the US, 45% below a standard utility-scale build. Most of that gap isn't panels, it's interconnection, permitting and developer margin. Data-centre builders with no patience for the queue should be looking at this.", "tweetB": "US small solar went ~5x in nine years to 93 TWh and is slowing because of policy, not technology. Meanwhile one team undercuts the whole industry by 45%. The binding constraint is the regulatory stack, not the cost curve. $ENPH $FSLR", "charts": {"count": 1, "hot": false, "desc": "Linked chart of US small-scale solar generation (not embedded in email). Charts inside - worth opening."}, "link": "https://www.exponentialview.co/p/ev-608"}, {"id": 12, "cat": "science", "urgency": "watch", "source": "Exponential View #608 (Azeem Azhar)", "title": "Lilly GLP-1 doubles Ozempic top-dose weight loss in head-to-head phase 3; plus psychedelic nasal spray for treatment-resistant depression", "idea": "Lilly's new GLP-1 drug delivered more than double the weight loss of Ozempic's highest approved dose in a phase 3 head-to-head in adults with type 2 diabetes. Also in the morsels: a single dose of a psychedelic nasal spray appears effective for treatment-resistant depression; MIT soft robot traversed ~2 m of small intestine in animal tests; engineered RNA archives in human cells; bismuth sulfide as a promising PV material; young men and women drifting apart politically in parts of Europe.", "angle": "Head-to-head superiority at this magnitude resets pricing power in obesity and diabetes. Several of these morsels (psychedelics, RNA storage, bismuth sulfide) are early-stage watch items.", "tweetA": "More than double Ozempic's top-dose weight loss, in a head-to-head, not a placebo trial. If that holds in obesity, Novo's pricing power has a ceiling and Lilly's lead stops being a lead. $LLY $NVO", "tweetB": "A single psychedelic nasal spray dose for treatment-resistant depression, a GLP-1 that doubles Ozempic, a swallowable soft robot. Pharma's problem in 2027 won't be pipeline scarcity, it'll be reimbursement for things that actually work.", "charts": {"count": 0, "hot": false, "desc": "None in email."}, "link": "https://www.exponentialview.co/p/ev-608"}, {"id": 13, "cat": "AI/infra", "urgency": "deep", "source": "Exponential View #608 (Azeem Azhar)", "title": "39 charts dissecting Anthropic's IPO pitch — and a new library of 500+ charts for members", "idea": "The lead piece is 'Is Anthropic a real business?', a 39-chart dissection of Anthropic's IPO pitch. EV also launched 'EV Charts', a library of 500+ data-rich charts on AI, energy, geopolitics and more. The email only teases the content; the charts themselves live on the web.", "angle": "Highest chart density in the window. Open it and pick 2-3 for posts ahead of the Anthropic roadshow into Thanksgiving.", "tweetA": "Anthropic's S-1 has 94 pages of risk factors and the market is debating one number. 39 charts later, the answer to 'is it a real business?' depends entirely on whether you think inference margins improve or compress. I'm going to chart both cases before I touch the IPO.", "tweetB": "The IPO season for frontier labs is a live test of whether public markets will pay for compute-intensive growth after Friday's tech selloff. Timing matters more than the story. $NVDA $MSFT", "charts": {"count": 39, "hot": true, "desc": "39 charts on Anthropic's IPO pitch in the linked article. 🔥 CHART WORTH SAVING - open and pick the best."}, "link": "https://www.exponentialview.co/p/ev-608"}, {"id": 14, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ #1257", "title": "Altman: 'I'd rather have a trillion slightly superhuman AIs than one AI with a trillion IQ'", "idea": "On the Cheeky Pint podcast with John Collison, Altman argues for plural AI: society is robust because many people check each other; teams of agents competing and checking each other is the more promising path and one OpenAI will push. He admits sandboxing works only up to a point, monitoring internal activations works further, but eventually alignment confidence is needed. OpenAI also updated its Model Spec around five values and concedes its models do not yet fully reflect it.", "angle": "A 'trillion AIs' world is a compute-demand story that dwarfs any single-model scaling thesis. Also positions OpenAI against Anthropic's safety-led pitch as both head toward IPOs.", "tweetA": "A trillion agents instead of one superintelligence. Fine, but run the arithmetic: a trillion agents each making API calls is a different compute curve than one very large training run. That is a bullish inference story and a bearish 'one winner takes all' story.", "tweetB": "Altman: plural AIs. Anthropic: safety as a differentiator, 94 pages of risk factors. Same industry, two IPO narratives, both marketed into Thanksgiving. Whichever wins the framing wins the multiple.", "charts": {"count": 0, "hot": false, "desc": "None in email."}, "link": "https://michaelparekh.substack.com/p/ai-openais-trillion-ais-future-as"}, {"id": 15, "cat": "tech", "urgency": "watch", "source": "Michael Parekh / AI-RTZ #1257", "title": "Bots passed human traffic online in May, ~2 years ahead of Cloudflare's forecast; 1,000x human traffic in five years?", "idea": "Citing Cloudflare CEO Matthew Prince: automated traffic (bots, crawlers, agents) passed human traffic in May 2026, well ahead of Cloudflare's own 2027 forecast. Prince extrapolates to about 1,000x human traffic within five years, with the caveat that his forecasts have all been too slow so far. Parekh adds: billions of agents need identity, reputation and coordination layers that are mostly unbuilt, and 'machines don't look at ads', so who pays for the m2m web is unresolved.", "angle": "Agent-to-agent traffic favours CDN, bot management, identity and micropayment rails. The business model for the m2m web is the open question.", "tweetA": "Bots passed humans online in May, two years ahead of Cloudflare's own forecast, and the CEO says his forecasts have always been too slow. If traffic is 1,000x human in five years, the web's business model, built on eyeballs and ads, has no customer. $NET", "tweetB": "Machines don't click ads. A trillion agents talking to each other need identity, reputation and payment layers that don't exist yet. That is the real infra trade behind the AI buildout, and it isn't GPUs.", "charts": {"count": 0, "hot": false, "desc": "None in email."}, "link": "https://michaelparekh.substack.com/p/ai-openais-trillion-ais-future-as"}, {"id": 16, "cat": "regulation", "urgency": "deep", "source": "Michael Parekh / AI-RTZ #1257", "title": "The 'first AI election': Dem group spends $4M in four swing districts; Senate stripped state-AI moratorium 99-1; US is the most AI-anxious of 37 countries", "idea": "Axios: a Democratic group is spending $4M on ads in four swing districts (WI, AZ, PA, MI) targeting Republicans who voted for a 10-year moratorium on state AI regulation, which the Senate later stripped 99-1. Their polling shows voters trust Democrats by 7-10 points more on holding AI executives accountable, with majority support for making data centres cover their own utility costs and for AI liability. Global polls: ~9 in 10 in Nigeria and Vietnam expect AI to improve their lives; US, Canada and France net negative; Gallup ranks the US most concerned of 37.", "angle": "Public opinion is moving against data centres in exactly the markets where they're being built. Cost-allocation (who pays for grid upgrades) is the concrete policy lever.", "tweetA": "99-1. That's how the Senate killed the state AI moratorium. Then ask yourself why a four-district, $4M ad campaign is built around it. The one issue Congress agrees on is the one candidates think will move votes. $VST $CEG", "tweetB": "Nigeria and Vietnam: ~90% say AI will improve their lives. US: most concerned of 37 countries. The country with the most compute and the least public license. That gap gets priced as utility rate cases and data-centre moratoria, not federal bills.", "charts": {"count": 0, "hot": false, "desc": "None in email."}, "link": "https://michaelparekh.substack.com/p/ai-openais-trillion-ais-future-as"}, {"id": 17, "cat": "energy", "urgency": "act", "source": "MacroEdge Oil and Gas Research", "title": "'War rabbit out of the hat?': author expects possible pre-election TACO headline, then war resumption as soon as election night; Dec-27 CL above $80 for two weeks", "idea": "MacroEdge sees no concrete political plan, loyalists installed across the military brass, and Israel's split elections buying time for war to resume. Expect a possible final 'pre-war' TACO announcement within 48h, with conflict potentially resuming election evening. Iran is estimated to be forced to break the blockade before end of December; US waits for air-defence and supply replenishment. 'Eye for an eye' escalation could hit Saudi energy assets. The Dec-2027 CL contract has traded above $80/bbl for two weeks. Also: TTF at cycle highs while Henry Hub is beaten down, and an emerging opportunity thesis in HH. Note: the email is truncated; the detailed sections are paywalled.", "angle": "A back-end contract at $80+ for two weeks means the market is pricing a durable premium, not a spike. TTF at cycle highs versus depressed HH is the gas arbitrage to watch.", "tweetA": "Dec '27 crude above $80 for two weeks. That's not a war spike, a spike lives in the front month. The back of the curve is pricing a structural premium, and the market is treating every 'deal' headline as a gift to sell into. $XLE $USO", "tweetB": "TTF at cycle highs. Henry Hub at the lows. Same molecule, wildly different price, and the LNG export capacity to arbitrage it is the binding constraint. That spread is the trade. $LNG $EQT", "charts": {"count": 0, "hot": false, "desc": "Charts in the full report (technical update, rig count, curve) - not in email body. Charts inside - worth opening."}, "link": "https://macroedgeenergy.substack.com/p/oil-and-gas-research-weekly-macro-ec5"}];

  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function toggle(id){document.getElementById('c'+id).classList.toggle('open');}
function setC(c){fc=c;fs=null;render();}
function setU(u){fu=u;fs=null;render();}
function filterBySrc(name){fs=name;fc="all";fu="all";render();
  ITEMS.forEach(function(i){var e=document.getElementById('c'+i.id);if(e&&i.source.indexOf(name)!==-1)e.classList.add('open');});}
function bars(){
  var cats=[];ITEMS.forEach(function(i){if(cats.indexOf(i.cat)<0)cats.push(i.cat);});
  var h='<span class="pill'+(fc==="all"?' on':'')+'" style="'+(fc==="all"?'background:#333':'')+'" onclick="setC(\'all\')">All '+ITEMS.length+'</span>';
  cats.forEach(function(c){var n=ITEMS.filter(function(i){return i.cat===c;}).length;var on=fc===c;
    h+='<span class="pill'+(on?' on':'')+'" style="'+(on?'background:'+COL[c]:'')+'" onclick="setC(\''+c+'\')">'+esc(c)+' '+n+'</span>';});
  document.getElementById('catbar').innerHTML=h;
  var us=[["all","All"],["act","🔴 Act Now"],["deep","🔵 Deep"],["watch","🟡 Watch"]];h='';
  us.forEach(function(u){var n=u[0]==="all"?ITEMS.length:ITEMS.filter(function(i){return i.urgency===u[0];}).length;var on=fu===u[0];
    h+='<span class="pill'+(on?' on':'')+'" style="'+(on?'background:#333':'')+'" onclick="setU(\''+u[0]+'\')">'+u[1]+' '+n+'</span>';});
  document.getElementById('urgbar').innerHTML=h;
}
function render(){
  bars();var h='';
  ITEMS.forEach(function(item){
    if(fc!=="all"&&item.cat!==fc)return;if(fu!=="all"&&item.urgency!==fu)return;
    if(fs&&item.source.indexOf(fs)===-1)return;
    var col=COL[item.cat]||"#888";
    h+='<div class="card" id="c'+item.id+'"><div class="hd" onclick="toggle('+item.id+')">'
     +'<span class="num">'+String(item.id).padStart(2,"0")+'</span><span>'+UE[item.urgency]+'</span>'
     +'<span class="src" style="background:'+col+'">'+esc(item.source)+'</span><span class="tag">'+esc(item.cat)+'</span>'
     +(item.charts.count>0?'<span>'+(item.charts.hot?'🔥':'📊')+'</span>':'')
     +'<span class="ttl">'+esc(item.title)+'</span></div><div class="bd">'
     +'<div class="lbl">The Idea</div><div>'+esc(item.idea)+'</div>'
     +'<div class="angle" style="border-color:'+col+';background:'+col+'14"><div class="lbl" style="margin-top:0">My Angle</div>'+esc(item.angle)+'</div>'
     +'<div class="tw"><div><div class="lbl" style="color:#378add;margin-top:0">TWEET A</div>'+esc(item.tweetA)+'<br>'
     +'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>'
     +'<div><div class="lbl" style="color:#7f77dd;margin-top:0">TWEET B</div>'+esc(item.tweetB)+'<br>'
     +'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>'
     +'<div class="chart'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 ':'📊 ')+item.charts.count+' chart(s) — '+esc(item.charts.desc)+'</div>'
     +'<div style="margin-top:10px"><a href="'+esc(item.link)+'" target="_blank" rel="noopener">↗ Read full article</a></div>'
     +'</div></div>';
  });
  document.getElementById('list').innerHTML=h||'<p>No items.</p>';
}
document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';
var r='<p><b>Window:</b> '+esc(META.windowStart)+' to '+esc(META.windowEnd)+'. Emails outside this window were not processed.</p>'
 +'<p><b>Emails:</b> '+META.emailsRead+' of '+META.emailsInWindow+' read. Items extracted: '+META.itemsExtracted+'.</p><p><b>Included sources</b> (click to filter):</p><ul>';
META.includedSources.forEach(function(s){r+='<li><span class="sl" data-n="'+esc(s.name)+'" onclick="filterBySrc(this.getAttribute(\'data-n\'))">'+esc(s.name)+'</span> — '+s.items+' items</li>';});
r+='</ul><p><b>Skipped:</b> '+(META.skippedSources.length?esc(JSON.stringify(META.skippedSources)):'none')+'</p><p>'+esc(META.note)+'</p>';
document.getElementById('rb').innerHTML=r;
render();
</script></body></html>
