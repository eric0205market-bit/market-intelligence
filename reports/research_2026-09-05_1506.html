{id:1, cat:"geopolitics", urgency:"deep", source:"Noahpinion",
 title:"There's no MAD for AI cyberwar — and that's the real US-China stake",

 tweetB:"Nuclear has MAD. AI cyberwar doesn't. If China's models get good enough to drain US brokerage accounts, the US can't hack back (China's better AI defends) and can't nuke a keyboard. The AI safety debate is a national-security debate wearing a lab coat.",
 charts:{count:0, hot:false, desc:"No chart — article contains a CyberGym/ExploitBench benchmark comparison table (GLM-5.3 vs Mythos 5)."},

{id:3, cat:"culture", urgency:"deep", source:"Dark Side of the Boom",
 title:"Gen Z overtook Millennials in online betting this summer, before football season even started",
 idea:"Bank of America transaction data: ~5% of BofA customers sent money to an online betting platform in July, bettors up 40% since January, and first-time users in June-July were more than 3x the January level. Gen Z hit 48% of betting activity in July (Millennials 40%), a flip from earlier in 2026. Betting-platform users carry median deposit balances just 59% of non-bettors', and betting inflows run under 75% of outflows. In a March BofA survey, 20% of respondents called sports betting a form of investing — Gen Z twice as likely as other generations to say so.",
 angle:"This is a real-time read on Gen Z risk appetite and balance-sheet stress heading into peak football season, and the 'investing' framing means prediction markets, betting apps, crypto and retail brokerages are now substitutable in consumers' minds — a genuine category-blur regulators haven't caught up to.",

 link:"https://thedarksideoftheboom.substack.com/p/the-house-edge-goes-mobile-as-gen"},

{id:4, cat:"venture", urgency:"deep", source:"Hard Fork (newsletter)",
 title:"B-school recruiting is a better top-of-trend signal than any chart",
 idea:"The piece argues 'the money is made before something becomes consensus' and flags two tells for a trend's top: when it shows up in mainstream business media, and when Top-20 MBAs pivot their career and fund choices into it — as they did with SaaS, then crypto, then the Metaverse, then gaming, and now, per the author, AI and defense-tech. By the time a rotation is consensus enough to show up in b-school placement stats, competition has already swarmed it.",
 angle:"Defense-tech is explicitly named as the current destination trend. If MBA recruiting into defense-tech is really a reliable top-signal (as it reportedly was for crypto and the Metaverse in 2021), that trade is closer to its top than most VCs marketing defense-tech funds right now would admit.",
 tweetA:"The author's top-signal isn't a chart — it's b-school recruiting. When Top-20 MBAs pivot into a sector, that sector is already consensus. Defense-tech is named as the current destination. If that's the tell, the defense-tech trade is closer to the top than most VCs think.",
 tweetB:"Everyone quotes Thiel's 'secret' as a moat concept. Less discussed: it's also a timing tool. If you can explain your edge in one sentence a magazine could publish, the edge is already gone — a filter worth running on every hot thesis making the rounds right now, this one included.",

{id:5, cat:"energy", urgency:"deep", source:"Doomberg",
 title:"Permian crude is dragging up 3-4x its own volume in toxic water — and that's the actual bottleneck",
 idea:"Doomberg's framing: energy pessimism is a reliable leading indicator of an imminent innovation breakthrough (shale gas, Haynesville decline rates, NGLs all triggered false 'peak' calls before a fix arrived). The current fixation: with Permian crude output near 7 million bpd, every barrel lifted brings 3-4 barrels of highly contaminated, hypersaline produced water to the surface — meaning roughly 21-28 million barrels/day of wastewater needing disposal, which Doomberg frames as the real near-term constraint on Permian growth, not geology.",
 angle:"If produced-water handling is genuinely the binding constraint, the investable angle isn't the E&Ps everyone already covers — it's water midstream and treatment capacity, which gets essentially zero attention relative to the drillers.",

 tweetB:"Doomberg's pattern-match: wherever the peak-oil crowd fixates, an innovation breakthrough follows within a few years (shale gas, Haynesville, NGLs). Produced water is this cycle's fixation. If the pattern holds, someone's about to get rich solving hypersaline disposal at scale.",

{id:6, cat:"macro", urgency:"act", source:"Dark Side of the Boom",
 title:"Goldman just put 'AI capex' in the same sentence as oil and fiscal supply as a reason bonds are repricing",

{id:7, cat:"culture", urgency:"deep", source:"Global Threads (Peter Frankopan)",
 title:"A Roman god's face was buried in a Chinese desert in 200 AD — proof trade beat every modern trade regime to this",
 idea:"A 2nd-century AD woolen tapestry fragment depicting the Greco-Roman god Hermes was excavated in 1914 at Loulan, a Han-vassal Tocharian city in China's Tarim Basin. New scholarship by Oxford's Peter Stewart — combining fragments recovered in a 1979-80 Chinese re-excavation (published posthumously only in 2022) with modern access to Roman Egypt textile databases — argues it's a genuine Roman import, not a local imitation, making it physical proof of luxury goods moving thousands of miles between civilizations that had no diplomatic contact.",
 angle:"A live illustration that cross-civilizational trade long predates any modern trade regime — worth citing whenever US-China decoupling or 'friend-shoring' gets called unprecedented; luxury goods flowed across Eurasia through empires with zero formal contact, using none of today's infrastructure.",
 tweetA:"A Roman god's face, woven into wool, ended up buried in a Chinese desert 4,000+ miles from Rome in 200 AD — two empires that never had a treaty. Next time someone calls US-China decoupling unprecedented, remember trade found a way across the ancient world with none of today's infrastructure.",
 tweetB:"It took from 1914 (discovery) to 2022 (posthumous publication of a re-excavation) to 2026 (this reassessment) to confirm one tapestry fragment's origin. That's the real timescale of historical certainty — worth remembering next time a 'confirmed' geopolitical narrative is three weeks old.",
 charts:{count:1, hot:false, desc:"Image of the Hermes tapestry fragment itself — visually striking, not a data chart."},
 link:"https://peterfrankopan.substack.com/p/how-did-hermes-reach-china-a-silk"},

{id:8, cat:"positioning", urgency:"deep", source:"Young and Calculated",
 title:"Balyasny went from +16.7% in 2025 to +0.5% through August — the multi-strat model is charging full fees for cash",
 idea:"August was the weakest month in a year for multi-strat platforms: Citadel +0.1% (+12.1% YTD), Millennium flat (+8.2% YTD), Balyasny -0.7% (+0.5% YTD, down from +16.7% all of 2025), ExodusPoint the standout at +1.4% (+4.9% YTD). The S&P returned 2.6% in August and is +12% YTD — meaning nearly every platform trailed a passive index while still charging pass-through costs plus performance fees.",

 tweetA:"Balyasny made 16.7% in 2025. Through August 2026: +0.5%. Same 180 pods, same $31B, same fee structure. When dispersion across pods collapses, multi-strat becomes cash with extra steps — expensive cash.",

{id:9, cat:"positioning", urgency:"deep", source:"Young and Calculated",
 title:"Jane Street's $15B loss and UVA's 27% return came from the exact same position",
 idea:"Jane Street lost ~$15B in July (its first negative month since 2016), driven by a drawdown at Situational Awareness LP — an externally-managed AI fund founded by ex-OpenAI researcher Leopold Aschenbrenner that returned 439% net in H1 2026, peaked at $45B AUM in early July on up to 400% leverage, then got margin-called down to ~$10B by month end, forcing a sale of its book (including SK Hynix and CoreWeave) to Citadel at distressed prices for an estimated $35B loss. Jane Street's own market-making business stayed profitable throughout — the loss came entirely from the investment book calling margin on it. Separately, the University of Virginia's endowment held an early stake in the same fund and posted a 27% one-year return partly because of it.",
 angle:"Cleanest 2026 case study yet of an AI-concentration leverage unwind, and the UVA detail proves the 27% 'skill' headline is actually 100% a function of entry/exit timing on the identical position that just cost Jane Street $15B.",
 tweetA:"Situational Awareness LP: 439% net return in H1 2026, $45B AUM by July, then a margin call took it to $10B by month's end — a ~$35B loss. Citadel bought the forced-sale portfolio at a discount, and that trade alone is carrying its entire 2026 return. Same tape, opposite outcome, pure timing.",
 tweetB:"UVA's endowment held the same AI fund that just cost Jane Street $15B, and it's the reason UVA posted a 27% return this year. One position, two totally different stories — the only variable is when you got out. Anyone calling that 27% 'manager skill' hasn't read the footnote.",
 charts:{count:0, hot:false, desc:"Article has a return-trajectory table for Situational Awareness LP — worth opening."},
 link:"https://youngandcalculated.substack.com/p/the-15-billion-month-the-114-billion"},

{id:10, cat:"positioning", urgency:"watch", source:"Young and Calculated",
 title:"Three separate demand pillars for this rally roll off in the same two weeks, and nobody's hedged it",
 idea:"Citadel Securities' September note: the S&P's ~22% rally (+$12T market cap) since the March 30 low was driven almost entirely by an unusually strong earnings season (88% beat rate, median 7% beat, ~33% EPS growth) that is now behind the market as the corporate calendar thins. Retail buying is already down to the 65th percentile of the past year, and September is historically the weakest seasonal month for retail net notional. Buyback blackout periods start accelerating around September 12, removing a structural bid right after $1.1T of authorizations reopened in August.",

{id:11, cat:"aiinfra", urgency:"watch", source:"Dark Side of the Boom",
 title:"SpaceX's $100B Louisiana site isn't a vanity city — it's launch capacity for orbital data centers",
 idea:"Deutsche Bank's Edison Yu frames SpaceX's proposed $100B Starbase Louisiana (Pecan Island, 125,000 acres, potentially a dozen-plus launch towers, thousands of Starship flights/year target) as a capacity trade solving four constraints: a longer southerly launch corridor better suited to sun-synchronous orbits and SpaceX's orbital data-center ambitions; a second permitting corridor before Texas launch approvals become binding; deep-water and industrial links Boca Chica lacks; and onsite methane/LOX production, since propellant can't arrive by truck at high flight rates.",
 angle:"The phrase 'orbital data-centre ambitions' tucked into a space-industrial note is the tell — this reads less like 'another Boca Chica' and more like Musk building second-site launch capacity specifically to put AI compute in orbit, sidestepping the terrestrial power/cooling/permitting fights everyone else is fighting.",
 tweetA:"Deutsche Bank's read on Starbase Louisiana isn't 'Elon builds a city' — it's a second launch corridor bought specifically for sun-synchronous orbits and 'orbital data-centre ambitions.' If SpaceX is quietly building launch capacity to put AI compute in space, the power/cooling bottleneck everyone's fighting over on Earth just got a workaround nobody's pricing in.",
 tweetB:"$100B and 125,000 acres to solve a propellant logistics problem: at high Starship flight rates, you can't truck in methane and liquid oxygen, you have to make it onsite. The real constraint on 'thousands of flights a year' was never the rocket. It's the gas station.",
 charts:{count:0, hot:false, desc:"Likely has a Pecan Island site map and launch-corridor comparison — worth opening."},
 link:"https://thedarksideoftheboom.substack.com/p/starbase-louisiana-musks-second-space"},

{id:12, cat:"commodities", urgency:"deep", source:"Blind Squirrel Macro",
 title:"A commodity ETF launched in 2006 only just turned a profit this year — 20 years later",
 idea:"Building a '20 stocks for 20 years' portfolio, Blind Squirrel Macro notes Energy+Materials are now just 8.3% of MSCI ACWI, versus ~15% in 2006 (Energy alone hit 13% by the 2008 spike); Info Tech plus Alphabet, Amazon and Meta is now 4.4x that weight. $DJP, the commodity ETN launched in June 2006 right at the top of that cycle, saw its total return only turn positive at the start of 2026. The current resources thesis is framed as a scarcity trade (capex famine, few Tier-1 discoveries, mandatory grid buildout) rather than 2006's growth trade ('more tons, more China').",

 charts:{count:1, hot:true, desc:"🔥 CHART WORTH SAVING — 25-year CRB spot commodity index chart showing the 2002-2006 100% run-up timed exactly to the DJP ETF launch, a clean visual for calling a cycle top by product-launch timing."},

{id:14, cat:"venture", urgency:"watch", source:"Hermit Research",
 title:"A Bulgarian owner-operator is running Nestlé's playbook at 25% margins on both branded and private-label lines",

const CAT_COLORS = {
  macro:"var(--macro)", credit:"var(--credit)", positioning:"var(--positioning)", aiinfra:"var(--aiinfra)",
  crypto:"var(--crypto)", geopolitics:"var(--geopolitics)", energy:"var(--energy)", tech:"var(--tech)",
  gold:"var(--gold)", culture:"var(--culture)", labor:"var(--labor)", regulation:"var(--regulation)",
  science:"var(--science)", venture:"var(--venture)", commodities:"var(--commodities)"
};
const CAT_LABELS = {
  macro:"macro", credit:"credit", positioning:"positioning", aiinfra:"AI/infra", crypto:"crypto",
  geopolitics:"geopolitics", energy:"energy", tech:"tech", gold:"gold", culture:"culture",
  labor:"labor", regulation:"regulation", science:"science", venture:"venture", commodities:"commodities"
};
const URG_LABELS = {act:"🔴 Act Now", deep:"🔵 Deep", watch:"🟡 Watch"};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function buildFilterBars(){
  const catCounts = {};
  ITEMS.forEach(i=>{ catCounts[i.cat] = (catCounts[i.cat]||0)+1; });
  const catBar = document.getElementById('catBar');
  let html = `<button class="pill active" data-cat="all" onclick="setCat('all')">All (${ITEMS.length})</button>`;
  Object.keys(CAT_LABELS).forEach(c=>{
    if(catCounts[c]){
      html += `<button class="pill" data-cat="${c}" style="--pc:${CAT_COLORS[c]}" onclick="setCat('${c}')">${CAT_LABELS[c]} (${catCounts[c]})</button>`;
    }
  });
  catBar.innerHTML = html;

  const urgCounts = {};
  ITEMS.forEach(i=>{ urgCounts[i.urgency] = (urgCounts[i.urgency]||0)+1; });
  const urgBar = document.getElementById('urgBar');
  let uhtml = `<button class="pill active" data-urg="all" onclick="setUrg('all')">All (${ITEMS.length})</button>`;
  ["act","deep","watch"].forEach(u=>{
    if(urgCounts[u]){
      uhtml += `<button class="pill" data-urg="${u}" onclick="setUrg('${u}')">${URG_LABELS[u]} (${urgCounts[u]})</button>`;
    }
  });
  urgBar.innerHTML = uhtml;
}

function setCat(c){
  activeCat = c; activeSrc = null;
  document.querySelectorAll('#catBar .pill').forEach(p=>{
    const isActive = p.getAttribute('data-cat')===c;
    p.classList.toggle('active', isActive);
    p.style.background = isActive && c!=='all' ? CAT_COLORS[c] : (isActive ? '#1a1a1a' : 'transparent');
    p.style.borderColor = isActive ? 'transparent' : '';
  });
  collapseAll();
  render();
}
function setUrg(u){
  activeUrg = u; activeSrc = null;
  document.querySelectorAll('#urgBar .pill').forEach(p=>{
    const isActive = p.getAttribute('data-urg')===u;
    p.classList.toggle('active', isActive);
    p.style.background = isActive ? '#1a1a1a' : 'transparent';
  });
  collapseAll();
  render();
}
function filterBySrc(name){
  activeCat = 'all'; activeUrg = 'all'; activeSrc = name;
  document.querySelectorAll('#catBar .pill').forEach(p=>{
    const isActive = p.getAttribute('data-cat')==='all';
    p.classList.toggle('active', isActive);
    p.style.background = isActive ? '#1a1a1a' : 'transparent';
  });
  document.querySelectorAll('#urgBar .pill').forEach(p=>{
    const isActive = p.getAttribute('data-urg')==='all';
    p.classList.toggle('active', isActive);
    p.style.background = isActive ? '#1a1a1a' : 'transparent';
  });
  render(true);
}
function collapseAll(){
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('open'));
}
function toggleCard(id){
  const el = document.getElementById('card-'+id);
  if(el) el.classList.toggle('open');
}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function render(expandMatches){
  const cardsEl = document.getElementById('cards');
  let html = '';
  ITEMS.forEach(item=>{
    let visible = true;
    if(activeSrc){
      visible = item.source.toLowerCase().indexOf(activeSrc.toLowerCase()) !== -1;
    } else {
      if(activeCat !== 'all' && item.cat !== activeCat) visible = false;
      if(activeUrg !== 'all' && item.urgency !== activeUrg) visible = false;
    }
    const chartFlag = item.charts.hot ? '🔥' : (item.charts.count>0 ? '📊' : '');
    const openClass = (expandMatches && visible) ? ' open' : '';
    html += `<div class="card${visible ? '' : ' hidden-item'}${openClass}" id="card-${item.id}">
      <div class="card-header" onclick="toggleCard(${item.id})">
        <span class="idx">#${String(item.id).padStart(2,'0')}</span>
        <span>${URG_LABELS[item.urgency].split(' ')[0]}</span>
        <span class="badge" style="background:${CAT_COLORS[item.cat]}">${esc(item.source.split(' (')[0].split(' /')[0])}</span>
        <span class="tag">${CAT_LABELS[item.cat]}</span>
        ${chartFlag ? `<span class="chart-flag">${chartFlag}</span>` : ''}
        <span class="title-txt">${esc(item.title)}</span>
      </div>
      <div class="card-body">
        <div class="section-label">The Idea</div>
        <div class="idea-txt">${esc(item.idea)}</div>
        <div class="section-label">My Angle</div>
        <div class="angle-box">${esc(item.angle)}</div>
        <div class="tweets">
          <div class="tweet-box a">
            <div class="tweet-label">TWEET A</div>
            <div class="tweet-text">${esc(item.tweetA)}</div>
            <button class="copy-btn" onclick="copyTweet(${item.id},'a')">📋 Copy</button>
          </div>
          <div class="tweet-box b">
            <div class="tweet-label">TWEET B</div>
            <div class="tweet-text">${esc(item.tweetB)}</div>
            <button class="copy-btn" onclick="copyTweet(${item.id},'b')">📋 Copy</button>
          </div>
        </div>
        <div class="chart-note${item.charts.hot ? ' hot':''}">📊 ${esc(item.charts.desc)}</div>
        <div class="link-row"><a href="${item.link}" target="_blank">↗ Read full article</a></div>
      </div>
    </div>`;
  });
  cardsEl.innerHTML = html;
}

function buildReport(){
  document.getElementById('metaLine').textContent =
    `${META.date} · ${META.time} · ${META.itemsExtracted} items from ${META.includedSources.length} sources`;

  let body = `<div>Window: <strong>${META.windowStart}</strong> to <strong>${META.windowEnd}</strong>. Emails outside this window were not processed.</div>
  <div style="margin-top:6px;">Emails in window: ${META.emailsInWindow} · Read in full: ${META.emailsRead} · Items extracted: ${META.itemsExtracted}</div>
  <div class="mini-h">Included sources</div>`;
  META.includedSources.forEach(s=>{
    body += `<div>• <span class="src-link" onclick="filterBySrc('${esc(s.name).replace(/'/g,"\\'")}')">${esc(s.name)}</span> — ${s.count} item${s.count>1?'s':''}</div>`;
  });
  body += `<div class="mini-h">Skipped sources</div>`;
  META.skippedSources.forEach(s=>{
    body += `<div>• ${esc(s.name)} — ${esc(s.reason)}</div>`;
  });
  document.getElementById('reportBody').innerHTML = body;
}

buildFilterBars();
buildReport();
render();
</script>
