    html += '  </div>';
    html += '  <div class="card-body' + (expand?' open':'') + '" id="body-' + item.id + '">';
    html += '    <div class="label">The Idea</div>';
    html += '    <div class="idea">' + item.idea + '</div>';
    html += '    <div class="label">My Angle</div>';
    html += '    <div class="angle" style="border-left-color:var(--' + item.cat + '); background:color-mix(in srgb, var(--' + item.cat + ') 8%, transparent);">' + item.angle + '</div>';
    html += '    <div class="tweets">';
    html += '      <div class="tweet"><div class="tweet-head"><span class="tweet-label a">TWEET A</span><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div><div class="tweet-text">' + item.tweetA + '</div></div>';
    html += '      <div class="tweet"><div class="tweet-head"><span class="tweet-label b">TWEET B</span><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div><div class="tweet-text">' + item.tweetB + '</div></div>';
    html += '    </div>';
    html += '    <div class="charts-box' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '🔥 CHART WORTH SAVING — ' : (item.charts.count>0 ? '📊 ' : '')) + item.charts.desc + '</div>';
    html += '    <div class="linkrow"><a href="' + item.link + '" target="_blank" rel="noopener">↗ Read full article</a></div>';
    html += '  </div>';
    html += '</div>';
  });
  if(!html){
    html = '<div style="padding:30px; text-align:center; color:var(--sub);">No items match this filter.</div>';
  }
  container.innerHTML = html;
}

function toggleCard(id){
  const body = document.getElementById('body-' + id);
  body.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function filterBySrc(name){
  activeSrc = name;
  activeCat = 'all';
  activeUrg = 'all';
  renderFilters();
  renderCards();
  document.getElementById('cards').scrollIntoView({behavior:'smooth'});
}

function renderMeta(){
  document.getElementById('metaLine').textContent = META.date + '  ·  ' + META.time + '  ·  ' + META.itemsExtracted + ' items';
}

function renderReport(){
  let html = '<div class="label" style="margin-top:0;">Time Window</div>';
  html += '<div>' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</div>';
  html += '<div class="label">Included Sources (' + META.emailsRead + ' of ' + META.emailsInWindow + ' emails read)</div>';
  html += '<ul>';
  META.includedSources.forEach(function(s){
    html += '<li><span class="srcname" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span> — ' + s.count + ' item' + (s.count>1?'s':'') + '</li>';
  });
  html += '</ul>';
  html += '<div class="label">Skipped Sources</div>';
  html += '<ul>';
  META.skippedSources.forEach(function(s){
    html += '<li>' + s.name + ' — ' + s.reason + '</li>';
  });
  html += '</ul>';
  html += '<div class="totals">Totals: ' + META.emailsInWindow + ' emails in window, ' + META.emailsRead + ' read, ' + META.itemsExtracted + ' items extracted from ' + META.includedSources.length + ' sources.</div>';
  document.getElementById('reportBody').innerHTML = html;
}

document.getElementById('reportToggle').addEventListener('click', function(){
  document.getElementById('reportBody').classList.toggle('open');
});

renderMeta();
renderFilters();
renderCards();
renderReport();
</script>
</body>
</html>
