<script>
const REPORT_DATA = {"report_type": "INSTITUTIONAL RESEARCH", "collected_at": "2026-11-22T03:01:47Z", "period": {"lookback_days": 10, "from": "2026-11-12", "to": "2026-11-22"}, "input_stats": {"total_articles": 377, "sources_present": 47, "after_filter": 150}, "summary": "**Fed / US rates:** Everyone expects a **25bp hike on Dec 8-9** (fed funds 3.75-4.00% → 4.00-4.25%), and most houses (**Goldman, UBS, PIMCO**) see one or two more after that, so roughly **4.25-4.5%**. Sharpest split: **Goldman, UBS, Standard Chartered and PIMCO** say markets overprice tightening (about **4.63%** terminal) and back buying bonds, while **Citi** keeps the higher-US-rates trade (its 'Warsh shadow rate' is at an all-time high) and the **October FOMC minutes** raised the option of hikes larger than 25bp.\n\n**Bonds / duration:** Bonds are back as the favoured asset with the **10y near 5.1%** (UBS ranks bonds and commodities first; PIMCO calls it a 25-year-high entry point and has moved to benchmark duration with a preference for longer maturities). Split: **PIMCO** wants to lock in long duration, while **BlackRock, Vanguard and UBS** stay at short-to-intermediate maturities (2-10y). **BNP** is outright **negative on Treasuries** and sees the 10y going to **5.10%**.\n\n**US equities:** The S&P is in a correction (**6,910**, down **11.6%** from the Oct 6 high), not a bear market. **Goldman** sees **+18% total return to end-2027**, **Barclays** stays **OW equities vs bonds**, and **Yardeni** sees no recession. Sharpest split: **BCA** expects a year-end tech bounce and then a relapse in early 2027 ('boom to bust'), **Gavekal's** model says **risk-off, cut equities to ≤20%**, and **UBS** downgraded equities to **Neutral**.\n\n**AI capex / credit:** Hyperscaler capex grows to about **$1.4-1.8tn in 2027**, and the buildout is now **debt-financed**: about 25% of US IG non-financial issuance, and AA names paying **160-200bp**. **PIMCO, Amundi and UBS** favour hyperscalers and bottleneck owners and avoid neoclouds and leveraged capacity providers. The **ECB FSR** sees dotcom and subprime parallels: **$4tn+ off-balance-sheet commitments**, and assets with a 2-year life funded by long-dated debt.\n\n**Oil / Iran:** The consensus is that the market has moved from **famine to glut**: **Goldman** sees Brent at **$88 average in 2027, $78 by end-2027**, and **WoodMac** at **$84 in 2027, $55 in 2028**. The dissent comes from **RBC (Croft)** and **BCA**: the war is not over, a peace deal is elusive and inventories are depleted. WoodMac's own stand-off scenario has Brent at **$105** in 2027.\n\n**Gold / USD:** The dollar is strong (EUR **below 1.10**) and gold is at **14-month lows (~$3,575)**. Sharpest split: **UBS** upgraded gold to **Attractive with a $5,000 target (Dec-27)**, **Standard Chartered** cut its targets to **$4,000 / $4,500**, and **BCA** says **stand aside until the dollar peaks**. **SC** expects a USD pullback, while **JPM and Goldman** see the euro as a funding currency in the near term.\n\n**BoE / ECB / BoJ:** Every major central bank except Asia ex-Japan is hiking. The **BoE** has hiked to **4.00% (8-1)** with one more expected (Goldman: 4.25% in Feb), the **ECB** makes a final hike in December, and the **BoJ** goes to **2%** over three hikes. Within the BoE, **Mann and Lombardelli** want to follow through with more hikes, while **Taylor** calls policy 'more than sufficient' and expects cuts once energy fades.\n\n**Crypto:** **BTC ~$64k**, down **25% since Oct 1**, in a continuing bear market. **CoinShares** sees a **$60-90k range** through much of 2027. Offsetting that, **Galaxy** shows 13F holdings at a **record 356k BTC** in Q3 with **Wells Fargo** now the largest holder, as wirehouses and advisors buy the dip.", "sections": {"A_debates": [{"theme": "Rates & Central Banks", "category": ["rates"], "consensus": "The 2026 regime is a global tightening cycle driven by the Iran-war energy shock, not the easing cycle the street expected at the start of the year (BNP notes the year opened with two Fed cuts priced). The Fed hiked in September and holds 3.75-4.00%. Almost every house expects 25bp at the December 8-9 FOMC: Goldman, UBS, Oxford Economics, BNP, Amundi, Standard Chartered and Vanguard all say so. Oxford and the Goldman desk say markets overprice the risk of 50bp. October core CPI printed +0.3% for a third straight month and the October FOMC minutes showed 'almost all' participants favour further hikes. Outside the US, the BoE (to 4.00%, 8-1 vote), ECB, BoJ and Bank of Canada have all hiked since September, while BNP's Chi Lo argues most of Asia ex-Japan can stay on hold.", "divergence": "The fight is about the path after December. Goldman sees one more hike in March to a 4.25-4.5% peak and cuts from November/December 2027 to 3.25-3.5%, explicitly less hawkish than market pricing. UBS has the same December and March hikes and argues a prolonged cycle is unlikely, so yields can fall. Standard Chartered is the most dovish: 4.25% by end-2027 against a market terminal near 4.63%, with a cut possible in H2 2027. PIMCO (Wilding) is more hawkish than the banks, with 'two or maybe three more hikes from here' and then a prolonged pause. GW&K's Bill Sterling, on UBS's platform, has a risk scenario of 4-6 hikes and an inverted curve. Citi's Willer argues upside rate risk persists into early 2027 and trades long US rates against Europe. On the Fed itself, Waller and Goolsbee have left 50bp on the table and two FOMC participants backed a move larger than 25bp, while BlackRock's Rieder argues 'hawkish rhetoric and patient policy' should coexist because another 25bp will not cool the hot spots (shelter, insurance, healthcare). At the BoE the split runs within the MPC: Mann says the stance is 'not sufficiently tight', and Lombardelli backs a further near-term hike, while Taylor says the case for hikes is 'not compelling' and policy must later reverse.", "items": [{"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Flagship 2027 macro outlook (Hatzius). Fed hikes in December and March; one cut in December 2027, then three in 2028 to 3.25-3.5%. ECB makes a final December hike and normalises toward 2.25% in Q4 2027. BoE goes to 4.25% in February then holds; BoJ goes to 2% via December, March and June hikes. US core PCE falls to 2.4% at end-2027 from 3.2%. GS says dovish risks are greatest in the US.", "url": "https://www.goldmansachs.com/insights/articles/the-global-economy-is-forecast-to-grow-2-point-8-percent-in-2027-as-oil-prices-decline", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs (FICC desk)", "thesis": "Rates desk (Qubbaj, Nov 12). The CPI print revived talk of 50bp but 25bp is more likely. The 10y is back to 5% from a 5.3% October high and should stay below those highs. Fed hikes flatten the curve. Trade idea: 'own the factor, rent the insurance', with OTM dollar and equity puts in a carry-neutral hedge book.", "url": "https://www.goldmansachs.com/insights/the-markets/how-will-higher-than-expected-inflation-data-impact-the-feds-next-rate-decisions", "images": []}, {"source": "ubs", "name": "UBS CIO", "thesis": "Expects 25bp hikes in December 2026 and March 2027, with consecutive hikes a higher risk. Futures price more than three more hikes, and UBS does not expect a prolonged cycle. US inflation averages 2.3% in 2027 versus 3.4% in 2026. The 2y, 5y and 10y would need to rise about 255bp, 113bp and 65bp for price losses to wipe out a year of income.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-19112026.html", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "Macro Signposts (Wilding): 'two or maybe three more hikes from here, followed by a prolonged pause.' Shelter CPI is 3.3% y/y and settles around or below 3% through 2027. Shutdown base effects could lift it toward 3.5% before unwinding by April 2027.", "url": "https://www.pimco.com/us/en/insights/the-rent-catch-up-is-over-whats-next-for-shelter-inflation", "images": []}, {"source": "blackrock_investment_institute", "name": "BlackRock (Rieder)", "thesis": "Fed funds is 3.75-4.00%. Another 25bp will not cool the hot spots (energy, insurance, healthcare, education, shelter); 'hawkish rhetoric and patient policy can coexist, and we think they should.' The US 10y real rate is at its 100th percentile since 2010.", "url": "https://www.blackrock.com/us/individual/insights/cio-perspective-fixed-income-yields", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Dovish against the market: 25bp in December, two hikes by H1 2027, a possible cut in H2 2027, and fed funds at 4.25% by end-2027 against a market terminal near 4.63%. Expects the 2y at 4.00-4.25% in 12 months, with the curve steepening.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-20-11-2026/?mvog=1", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "PCE nowcast: headline 3.8% y/y in October, up from 3.6%. 'Broadening pressures lock in' a 25bp December hike, while markets overprice 50bp. Headline inflation peaks in Q4.", "url": "https://www.oxfordeconomics.com/resource/us-pce-nowcast-broadening-pressures-lock-in-december-rate-hike/", "images": []}, {"source": "citi_gps", "name": "Citi", "thesis": "Markets Edition (Willer/Pickett): a triple whammy of hot CPI, hawkish Waller and rising equities means upside rate risk into early 2027. The 'Warsh shadow rate' indicator is at an all-time high. Preferred trade: Fed-versus-ECB divergence, with higher US rates against Europe.", "url": "https://www.citigroup.com/global/insights/markets-edition-writing-on-the-waller-fed-hawks-are-back-in-town", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "thesis": "Tentori: both the Fed and ECB are 'within reach of neutral'. The market prices no more than the next 2-3 hikes. The risk is the narrative shifting from reaching neutral to a tightening cycle if inflation entrenches. Bearish on government bond supply now that QE has ended.", "url": "https://www.bnpparibas-am.com/en/front-of-mind/view-from-the-markets-the-next-chapter-for-monetary-policy-and-the-bond-market/", "images": []}, {"source": "boe", "name": "Bank of England (MPC)", "thesis": "Bank Rate rose to 4.00% (8-1). Lombardelli (Nov 10) sees 'likely a case for a further increase in the near term'. Mann (Oct 1) says the stance is 'not sufficiently tight' and the MPC must follow through. Taylor (Sep 29) puts R* at 2.75-3%, calls the stance 'more than sufficient', and expects to cut once energy risks abate. Ramsden's new QT plan: £20bn a year of gilt sales to the Government, unwinding by end-2034.", "url": "https://www.bankofengland.co.uk/speech/2026/november/clare-lombardelli-speech-at-the-bank-watchers-conference", "images": []}, {"source": "federal_reserve", "name": "Federal Reserve (staff)", "thesis": "FEDS Note: in 1990-2019 data, positive TFP-growth news lowers 10y yields through a lower term premium. So AI productivity optimism does not explain the 2022-26 rise in long yields, which casts doubt on r* models that tie r* closely to trend growth.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/when-productivity-booms-do-interest-rates-rise-20261120.html", "images": []}, {"source": "rbc", "name": "RBC Capital Markets", "thesis": "The Bank of Canada hiked in October, its first hike since July 2023, and starts a risk-based tightening cycle. USD/CAD range: buyers at 1.3800/1.3900, sellers at 1.4200/1.4300.", "url": "https://www.rbccm.com/en/insights/2026/11/the-george-davis-report-november-2026-edition", "images": []}]}, {"theme": "Fixed Income: Duration & Sovereign Supply", "category": ["rates", "credit"], "consensus": "With the US 10y around 5.06-5.14% (5.35% peak in Sep/Oct) and real yields at multi-decade highs, nearly every asset manager says bonds now offer a compelling carry cushion. UBS rates fixed income Attractive and ranks it first. PIMCO calls this a 25-year-high entry point and says it is not 2022. BlackRock shows that a year of carry absorbs a 147bp rise in the 5y. Goldman expects bond returns 'as positive as since 2020'. Standard Chartered notes that the stock-bond correlation has turned negative again, which restores bonds as a hedge.", "divergence": "The houses disagree on how far out the curve to go and which sovereigns to own. PIMCO has moved to benchmark duration and now prefers longer maturities to lock in yield, adding Australia, the UK and high-real-yield EM. BlackRock wants high-quality short-to-intermediate maturities and patience before adding risk beyond 5 years. UBS also prefers 2-10y and is cautious on the long end because of fiscal issuance. Vanguard prefers short and intermediate government bonds over corporates. BNP is the outlier on Treasuries: it is underweight, expects the 10y to rise to 5.10%, and its highest-conviction overweight is long gilts, with JGBs negative (10y above 3% in 2027). Standard Chartered would only buy the US 10y above 5.25%. Amundi stresses that US interest payments are near 20% of revenue, and Brookings and Robin Brooks show the Treasury convenience yield has eroded to roughly 10bp, which argues that the long end deserves a term premium.", "items": [{"source": "pimco", "name": "PIMCO (Ivascyn)", "thesis": "The broad US bond index yields in the mid-5% range. PIMCO has moved from underweight duration in 2021 to roughly benchmark, now preferring longer maturities. It is underweight lower-quality credit (bank loans and HY) and favours agency MBS and senior ABS. 'A lot must go right for equities, a lot must go wrong for bonds.'", "url": "https://www.pimco.com/us/en/insights/income-update-compelling-yields-drive-long-term-opportunities", "images": []}, {"source": "blackrock_investment_institute", "name": "BlackRock (Rieder)", "thesis": "Rieder anchors portfolios in high-quality short-to-intermediate duration and is patient on rate risk beyond 5 years. To erase a year of carry, yields would need to rise 147bp on the 5y, 91bp on IG or 232bp on HY. He sees opportunities in ABS, CMBS and EM local debt.", "url": "https://www.blackrock.com/us/individual/insights/cio-perspective-fixed-income-yields", "images": []}, {"source": "ubs", "name": "UBS CIO (Year Ahead 2027)", "thesis": "UBS ranks bonds and commodities first, equities next and cash last, and prefers 2-10y maturities. It sees the best opportunity in EM and HY: EM sovereigns yield about 7.1%, EM corporates about 7.0% and US HY about 8.3%. US HY is 60% BB with expected defaults around 2%.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-18112026.html", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "thesis": "2027 scorecard: US Treasuries negative (10y to 5.10%), euro core neutral (December is the ECB's last hike), Italy and Spain spreads positive, long gilts its highest-conviction positive, JGBs negative, breakevens positive.", "url": "https://www.bnpparibas-am.com/en/portfolio-perspectives/outlook-2027-investment-implications/", "images": []}, {"source": "vanguard", "name": "Vanguard", "thesis": "2027 outlook preview: Vanguard prefers high-quality short and intermediate government bonds over corporates, as both income and a hedge against an AI slowdown. It expects long rates to stay volatile on fiscal borrowing.", "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/vemo/ai-booms-critical-next-phase.html", "images": []}, {"source": "brookings", "name": "Brookings (Robin Brooks)", "thesis": "Measured against a hedged peer basket, the US 10y premium has edged down to about 10bp since 2025, with debt near 130% of GDP. US safe-haven status 'is no longer what it once was', and Switzerland's convenience yield is near record highs.", "url": "https://www.brookings.edu/articles/convenience-yields-and-us-safe-haven-status/", "images": []}, {"source": "amundi", "name": "Amundi", "thesis": "The US 10y is back at 5%. Interest payments are near 20% of federal revenue, an all-time high. Amundi expects bond volatility to persist and favours a flexible global approach.", "url": "https://research-center.amundi.com/article/high-rates-higher-interest-payments", "images": []}, {"source": "rbc", "name": "RBC Capital Markets", "thesis": "Global IG issuance is about $5tn YTD (+20%, a record), with tech above $300bn. New-issue concessions have widened, with TMT moving from about 5bp to about 20bp. Reverse Yankees are 28% of euro supply. Hyperscaler borrowing is widening European credit indices.", "url": "https://www.rbccm.com/en/insights/2026/11/the-global-bond-markets-a-new-era", "images": []}]}, {"theme": "US & Global Equities", "category": ["equities"], "consensus": "The sell-side treats the drawdown (S&P 6,910, down 11.6% from the 7,818.93 record on October 6) as a correction inside a bull market. Earnings growth is expected to roughly halve in 2027 as the AI-capex impulse fades: Goldman sees US EPS +11% from about 30%, and Barclays notes 'good numbers need to be great'. Leadership should broaden toward healthcare, industrials, equal-weight and Europe. UBS, Goldman, Barclays, KKR's McVey and BNP all point that way.", "divergence": "Bulls and bears are far apart. Goldman forecasts an 18% S&P total return through end-2027 and is overweight the US and Japan and underweight Europe. Barclays stays overweight equities versus bonds ('more nervous, but not bearish'). Yardeni cut his target from 8,400 to 7,900 but rules out a bear market without a recession. On the bearish side, BCA's Berezin expects a countertrend tech rally into year-end and a relapse in early 2027. Gavekal-IS's growth/inflation model has flipped to unequivocal risk-off and says to cut equities to 20% or less. UBS downgraded global equities from Attractive to Neutral, and Vanguard sees only 5-8% a year for US stocks over 3-5 years. On Europe, UBS (Eurozone EPS +15%), BCA (upgrade Europe) and Vanguard prefer it, while Goldman is underweight because it expects flat ex-financials margins against a consensus of more than 100bp expansion. On how deep a fall could be, Furman (PIIE) frames a 25% decline as the base case of a bubble burst; option markets put about 11% odds on the S&P being down 20% or more by December 2027.", "items": [{"source": "goldman_sachs", "name": "Goldman Sachs (Snider)", "thesis": "S&P 500 total return of +18% through end-2027. EPS +11% in 2027 (18% excluding mega-cap 'other income'). Returns come from earnings, not multiples. Downside case: EPS falls to trend and P/E to 17x, putting the S&P at about 5,600 (-25%). Themes: hyperscaler monetisation, buyback aristocrats, quality and select staples.", "url": "https://www.goldmansachs.com/insights/articles/us-stocks-predicted-to-extend-historic-rally-as-gains-moderate", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs (Oppenheimer)", "thesis": "12-month total returns: S&P 16%, STOXX 600 13% (in USD), TOPIX 24%, MSCI EM 21%. Overweight US and Japan, underweight Europe. Global tech P/E is at the 20th percentile of its 20-year range, so GS favours growth over value.", "url": "https://www.goldmansachs.com/insights/articles/global-stocks-expected-to-rally-in-2027-as-earnings-growth-slows", "images": []}, {"source": "barclays", "name": "Barclays", "thesis": "Q1 2027 Global Outlook, 'A correction, not a collapse': S&P +9-10% YTD, Q3 earnings +30% y/y, 2027 consensus EPS about +15%. Leadership is rotating into cyclicals, healthcare and defence. Barclays stays overweight equities versus fixed income.", "url": "https://www.ib.barclays/content/barclaysmicrosites/ibpublic/en/research/global-outlook/q1-2027-a-correction-not-collapse.html", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "Berezin's 2027 Key Views, 'From Boom To Bust': a countertrend tech rally into year-end, then stocks relapse in early 2027. At that point bonds become a buy, the USD weakens and gold rises. The TAA update downgrades Health Care, upgrades Consumer Discretionary and Europe, and keeps favouring hyperscalers.", "url": "https://www.bcaresearch.com/reports/chief-economists-2027-key-views-boom-bust-19-11-2026/227585", "images": []}, {"source": "gavekal", "name": "Gavekal-IS", "thesis": "Charles Gave's 40-country growth/inflation allocation model has given an 'unequivocal' risk-off signal since the Gulf conflict began: cut equity allocations to 20% or less.", "url": "https://research.gavekal.com/teaser/equity-risk-off-what-next/", "images": []}, {"source": "yardeni_research", "name": "Yardeni Research", "thesis": "Yardeni lowered his year-end S&P target from 8,400 to 7,900 on September 15. The index fell from 7,585.73 to 6,910.39, 11.6% below the October 6 record. He calls it a bull-market correction, not a tech-wreck bear market, because he sees no recession.", "url": "https://yardeni.com/research/quicktakes/2026/11/21/us-markets-call-a-bull-market-correction-or-a-tech-wreck-bear-market-also-our-new-s-p-500-targets", "images": []}, {"source": "ubs", "name": "UBS CIO", "thesis": "Global equities downgraded to Neutral. Preferences: Eurozone (2027 EPS +15%), industrials, healthcare and US equal-weight (+7pp over cap-weight since June). Within AI, strong hyperscalers rather than leveraged capacity providers.", "url": "https://www.ubs.com/us/en/wealth-management/insights/investment-research/insights-display-adp/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-20112026.html?caasID=CAAS-ActivityStream", "images": []}, {"source": "peterson_institute", "name": "PIIE (Furman)", "thesis": "Sizing the downside: a 50% fall in the AI-7 alone takes the S&P down 11%. Forward P/E reverting from 18.3 to 15 gives -18%, and CAPE reverting from 40 to 23.6 gives -41%. Today differs from 2000: Nvidia trades at 13x forward against Cisco's 102x. Options imply 11% odds of a fall of 20% or more by December 2027.", "url": "https://www.piie.com/blogs/realtime-economics/2026/how-far-could-stocks-fall", "images": []}, {"source": "vanguard", "name": "Vanguard", "thesis": "Above-consensus US growth of about 3% in 2027, but expected US equity returns of only 5-8% a year over 3-5 years. Vanguard sees the transition from buildout to diffusion as 'much more likely' to be rough, and favours value-oriented AI adopters and non-US developed markets.", "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/vemo/ai-booms-critical-next-phase.html", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "New opportunistic idea: US mega caps (S&P Top 20 Select), whose forward P/E is below -2 standard deviations of its 2-year average. Preferred US sectors are tech, healthcare, financials and materials. Also likes Euro area and Japan banks and India.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-20-11-2026/?mvog=1", "images": []}, {"source": "rbc", "name": "RBC (Imagine)", "thesis": "AI and biotech have turned inversely correlated. An AI capex slowdown means 10-15% upside for biotech; continued or accelerated capex means 5-10% downside. Biotech and pharma are about 12% of the S&P versus about 50% for AI-related names.", "url": "https://www.rbccm.com/en/insights/2026/11/ai-isnt-just-shaping-biotech-narratives-its-shifting-the-market", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs (consumer desk)", "thesis": "The consumer is 'fine': October retail sales beat. Buy dips in hotels and cruise lines and in quality discretionary names. 2027 margins are at risk as raw-material and freight contracts reset.", "url": "https://www.goldmansachs.com/insights/the-markets/the-outlook-for-retail-stocks-as-black-friday-approaches", "images": []}]}, {"theme": "AI Capex, Financing & Tech", "category": ["ai_tech", "credit"], "consensus": "The AI buildout continues into 2027. Estimates for 2027 spending range from $1.2tn (Standard Chartered) and $1.4tn (UBS) to $1.7tn (BlackRock) and $1.8tn global (Goldman). It is now funded with debt: about a quarter of 2026 USD IG non-financial issuance is AI-related (PIMCO), hyperscalers are no longer free-cash-flow positive, and AI debt is expected to exceed the US HY market by end-2027 (BlackRock). The houses broadly agree on two things. The midterms' Democratic sweep slows and stretches the buildout rather than ending it (PIMCO, Barclays, KKR). Nvidia's governance shock and tighter export controls help hyperscalers and frontier labs at the expense of neoclouds (BCA, UBS, PIMCO).", "divergence": "The houses split on whether this is a manageable phase change or a financial-stability problem. BNP, Invesco, Oxford Economics and Barclays are constructive. BNP says AI moves from promise to proof, semis are below 19x forward P/E and demand outpaces supply through 2027. Barclays places overbuild risk 3-5 years out, not in 2027. Amundi and Vanguard expect markets to 'stop paying for capacity and start asking for returns', so they own bottlenecks (power, grid, networking) and avoid spending-dependent names. BCA calls data centres in infrastructure funds 'just another AI play' with dotcom-style drawdown risk. The ECB FSR is the sharpest warning. It cites more than $4tn of off-balance-sheet commitments, circular financing, GPUs with a 1-3 year life funded by long-dated debt, and dotcom and subprime parallels. Fed Chair Warsh has also warned overinvestment could bring disappointing returns. The Fed staff paper finds productivity effects so far are small. Goldman counters that AI adds 0.6pp to US 'true' GDP in 2027.", "items": [{"source": "ecb", "name": "ECB Financial Stability Review", "thesis": "Big tech capex is forecast at about $5.5tn cumulatively by 2030, more than 3% of US GDP a year against 2.24% for the 1870s railways. Most hyperscalers turned free-cash-flow negative in 2026. Off-balance-sheet commitments exceed $4tn, and earnings are inflated by revaluations of stakes in AI labs. Hyperscaler spreads have widened relative to equally rated corporates. A US credit bust would significantly contract euro-area GDP.", "url": "https://www.ecb.europa.eu/press/financial-stability-publications/fsr/focus/2026/html/ecb.fsrbox202611_03~4fd1449eaa.en.html", "images": []}, {"source": "pimco", "name": "PIMCO (Karoui)", "thesis": "About 45% of planned US data-centre capacity sits in states where restrictions could emerge, Texas about a quarter. 'Exposed is not at risk.' A slower buildout benefits diversified hyperscalers that own scarce compute and data-centre bonds backed by hyperscaler tenants, and hurts leveraged infrastructure providers through recontracting and GPU residual-value risk.", "url": "https://www.pimco.com/us/en/insights/the-credit-market-lens-in-a-slower-ai-buildout-who-captures-the-scarcity-premium", "images": []}, {"source": "pimco", "name": "PIMCO (Seidner)", "thesis": "AA-rated AI issuers pay 160-200bp spreads, 3-4x a year ago. PIMCO took part in about 2 of 100 AI deals reviewed. Tech went from 3-4% to 25-30% of non-financial issuance.", "url": "https://www.pimco.com/us/en/insights/podcasts/accrued-interest/charting-the-year-ahead", "images": []}, {"source": "amundi", "name": "Amundi", "thesis": "IT will be 70% of MSCI ACWI net-income growth in 2027. Hyperscaler free cash flow troughs in 2027. Own the bottlenecks (power equipment, grid, networking, fabs) and avoid neoclouds, data-centre developers and colocation REITs.", "url": "https://research-center.amundi.com/article/ai-2027-greater-scrutiny-returns", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "thesis": "Tech outlook, 'AI moves from promise to proof': demand outpaces supply through 2027, semis trade below 19x forward against a 5-year average near 25x, and cloud providers look undervalued. Tech earnings-estimate dispersion is up more than 5x in two years.", "url": "https://viewpoint.bnpparibas-am.com/technology-investment-outlook-2027-ai-moves-from-promise-to-proof/", "images": []}, {"source": "blackrock_investment_institute", "name": "BlackRock", "thesis": "Hyperscaler capex about $1tn in 2026 and $1.7tn in 2027. AI capital raising about $1.1tn and $1.3tn. AI debt is set to exceed the entire US HY market by end-2027.", "url": "https://www.blackrock.com/us/individual/insights/cio-perspective-fixed-income-yields", "images": []}, {"source": "ubs", "name": "UBS CIO", "thesis": "A new BIS licensing rule covers data centres in Singapore, Malaysia, Thailand, Indonesia and Brazil, which UBS says touches 5-10% of next year's AI demand. AI capex forecast: $1.0tn, $1.4tn and $1.5tn (2026-28).", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-17112026.html", "images": []}, {"source": "gavekal", "name": "Gavekal Technologies", "thesis": "Huang's ouster shifted Washington toward export-control restrictionists, and a bipartisan majority now backs tighter controls. Chinese AI faces a sharp compute squeeze. Beijing may tolerate the cost if it speeds adoption of domestic chips.", "url": "https://research.gavekal.com/teaser/the-shape-of-export-controls-to-come/", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "Export controls are producing a parallel, efficiency-first Chinese AI ecosystem, so expect Chinese LLMs to gain traction and demand for Western chips to decline. Infrastructure funds dominated by data centres carry dotcom-style drawdown risk; transportation offers real diversification.", "url": "https://www.bcaresearch.com/reports/chip-constraints-sharpen-chinese-competition-19-11-2026/227612", "images": []}, {"source": "federal_reserve", "name": "Federal Reserve (staff)", "thesis": "Current evidence: data-centre investment and memory-chip prices have surged, but most firms do not use AI intensively, and the labour and productivity effects so far are small and mixed.", "url": "https://www.federalreserve.gov/econres/feds/artificial-intelligence-and-the-us-economy-current-evidence.htm", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "The Anthropic IPO priced at $83, above its $70-78 range, raising $81.3bn at a $1.5tn valuation, the largest ever. It opened at $111.50 but faded to about $95 (+14%). Galaxy notes only Coupang had a weaker day among 20 big US IPOs since 2008.", "url": "https://www.galaxy.com/insights/research/anthropic-record-ipo-ant-hyperliquid", "images": []}]}, {"theme": "Credit", "category": ["credit"], "consensus": "Spreads have come off historic tights but remain near them, and everyone is moving up in quality. PIMCO, BlackRock, BCA and UBS all say to be selective in lower-rated credit. The pressure is concentrated in CCCs: refinancing them would cost 15-16% (PIMCO), and the B-CCC gap is near crisis levels (BlackRock). Securitised and agency MBS are favoured over IG corporates for spread per unit of risk (PIMCO, Franklin Templeton).", "divergence": "The disagreement is about HY and the default cycle. PIMCO says 'the credit default cycle is already underway', is underweight bank loans and HY, and notes money leaving private direct lending. UBS sees HY as a best-in-class opportunity at about 8.3% with expected defaults of about 2% (60% BB, only 3% maturing next year), and BNP is adding EUR HY and selectively positive on USD HY. The ECB adds a Europe-specific warning: almost all recent euro-area spread widening is the excess bond premium unwinding from negative, and that premium can move more than 100bp in a quarter, while the US excess bond premium is still firmly negative.", "items": [{"source": "pimco", "name": "PIMCO", "thesis": "'The credit default cycle is already underway.' Refinancing all CCCs today would cost 15-16% with a 7-8 year average maturity, so a refinancing wall is coming. BDCs trade at discounts to book. PIMCO favours higher quality and agency MBS and AAA non-agency RMBS over IG corporates.", "url": "https://www.pimco.com/us/en/insights/charting-the-year-ahead-investment-ideas-for-2027", "images": []}, {"source": "ecb", "name": "ECB Financial Stability Review", "thesis": "Less than a fifth of euro-area spread compression from 2022 to 2026 was fundamentals; the rest was a negative excess bond premium, which has now risen to near zero. A 2020/2022-sized repricing implies mark-to-market losses of up to 4%. Funds hold 39% and insurers 20% of resident-held euro-area NFC bonds.", "url": "https://www.ecb.europa.eu/press/financial-stability-publications/fsr/focus/2026/html/ecb.fsrbox202611_02~abc7852b04.en.html", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "'Quality Reigns Supreme.' The hyperscaler repricing, European growth worries and stress in the lowest-rated junk each tell a different story. Be selective in corporate credit.", "url": "https://www.bcaresearch.com/reports/quality-reigns-supreme-be-selective-corporate-credit-18-11-2026/227597", "images": []}, {"source": "ubs", "name": "UBS CIO", "thesis": "HY and EM bonds offer the best return opportunity: US HY is 60% BB, expected defaults are about 2%, and only 3% matures within a year.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-18112026.html", "images": []}, {"source": "ecb", "name": "ECB Financial Stability Review", "thesis": "A 1 s.d. oil supply shock raises bank NPL ratios by 64bp cumulatively over three years and cuts NFC lending by 0.3%. Bank asset-quality effects may only show up during 2027.", "url": "https://www.ecb.europa.eu/press/financial-stability-publications/fsr/focus/2026/html/ecb.fsrbox202611_05~854c97b8a1.en.html", "images": []}]}, {"theme": "Energy & Commodities", "category": ["energy", "commodities"], "consensus": "The Hormuz closure since March has kept Brent near or above $100 for much of 2026; Wood Mackenzie calls the move from famine to glut. Most houses now expect a glut in 2027 as Gulf exports recover and bypass pipelines come online. Goldman says the market likely moved into surplus in October and sees a 2mb/d surplus in 2027. Brent is around $90-93 and crude fell nearly 20% in November on de-escalation hopes. Brent forecasts: Goldman $88 average for 2027 ($78 by end-2027), Wood Mackenzie $84 (2027) and $55 (2028), and Oxford Economics a gradual return to the pre-war path.", "divergence": "The geopolitical analysts reject the glut thesis. RBC's Helima Croft says markets assume Hormuz disruption is behind us while security experts see escalation. Interstate wars average 2.1 years, a peace deal is likely elusive, and neither a stalemate nor escalation supports high exports for 6-9 months. BCA ('Priced For Peace, Exposed To War') warns depleted inventories leave prices exposed. Wood Mackenzie's own stand-off scenario puts Brent at $105 in 2027, and Goldman's Wilson notes the oil risk premium has collapsed from about $30 to near zero, so energy upside may be underpriced. On European gas, Goldman sees TTF falling from €85 to a €45/MWh average in 2027, while the Fed's staff note shows EU storage at its lowest since 2011 (72% at end-September) and a trough of 6% of capacity in an import-scarcity scenario. On food and agriculture, the World Bank sees its food index +10% in 2026 and +7% in 2027 as El Niño tightens grains.", "items": [{"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "Brent averages $88 in 2027, sliding from $93 to $78 by December 2027. Gulf output in 2027 exceeds 2025 by 1.4mb/d, and another 3.8mb/d of Hormuz bypass capacity arrives within a year. China's oil demand likely peaked in 2025. TTF falls from €85 to a €45/MWh average in 2027, with a €150 upside case in Q1 2027.", "url": "https://www.goldmansachs.com/insights/articles/oil-is-estimated-to-ease-in-2027-as-suppliers-adapt-to-hormuz-disruption", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "thesis": "Base case: a US-Iran deal late in 2026, with Brent at $84 in 2027 and $55 in 2028, and inventories rebuilding to more than 7bn bbl by mid-2028. Stand-off scenario: $105 and $91. Marginal cost has fallen to $60-65. OPEC must cut before 2030 to avoid a crash.", "url": "https://www.woodmac.com/blogs/the-edge/how-the-oil-market-could-move-from-famine-to-glut/", "images": []}, {"source": "rbc", "name": "RBC (Helima Croft)", "thesis": "'The split screen war': markets price peace while security experts see escalation. Iran insists on full enforcement of the June MoU, and its fire is hitting Kuwait and Bahrain. A US strike on the Pickaxe Mountain site is a possible exit scenario. This implies upside risk to the glut consensus.", "url": "https://www.rbccm.com/en/insights/2026/11/the-split-screen-war", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "'Oil: Priced For Peace, Exposed To War' (Nov 13): a swift US-Iran deal is far from assured, and depleted inventories leave prices exposed to renewed disruption.", "url": "https://www.bcaresearch.com/marketing/fixed-income-currencies-commodities", "images": []}, {"source": "federal_reserve", "name": "Federal Reserve (staff)", "thesis": "EU gas storage was 71.6% full at end-September, the lowest since 2011, with Germany at 58%. Baseline trough is 30% at end-March 2027, a harsh winter gives 15%, and import scarcity 6%. The ban on Russian LNG under long-term contracts starts January 1, 2027. A record El Niño saves only about 2.5 bcm.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/europes-natural-gas-outlook-for-the-upcoming-winter-2026-2027-20261120.html", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "thesis": "Gulf NOCs: Aramco and ADNOC earned $35bn more operating cash flow than forecast thanks to bypass routes. QatarEnergy lost 17% of its liquefaction capacity. The UAE is adding 1.5mb/d to Fujairah, and Saudi bypass capacity could reach 10mb/d by 2030.", "url": "https://www.woodmac.com/blogs/the-edge/middle-east-noc-oil-and-gas-strategies-beyond-the-crisis/", "images": []}, {"source": "world_bank", "name": "World Bank", "thesis": "The food index is +15% y/y. Forecasts: +10% in 2026, +7% in 2027 and -5% in 2028. Maize stocks-to-use is 21.5%, the lowest since 2012-13. US wheat output is down 23%, its lowest since 1970-71. In the downside scenario the index is 12% above the 2027 baseline.", "url": "https://blogs.worldbank.org/en/opendata/food-prices-climb-as-conflicts-and-el-nino-tighten-grain-supplie", "images": []}, {"source": "brookings", "name": "Brookings (BPEA)", "thesis": "Because the US is now a net oil exporter of about 5mb/d, oil shocks are muted or even expansionary for US activity, though still inflationary. That lets the Fed respond more aggressively to inflation.", "url": "https://www.brookings.edu/articles/why-oil-price-spikes-no-longer-guarantee-a-recession/", "images": []}, {"source": "jpmorgan", "name": "J.P. Morgan", "thesis": "The Iran war added an estimated $2,000 in costs per US household in 2026, through fuel, shipping and borrowing costs. Relief may take time.", "url": "https://www.jpmorgan.com/insights/markets-and-economy/economy/iran-war-2026-household-costs-gas-diesel-inflation-rates", "images": []}]}, {"theme": "USD, FX & Gold", "category": ["fx", "commodities"], "consensus": "The dollar is strong on the Fed's hawkish pivot. DXY rose more than 2% in two weeks and EUR/USD fell below 1.10 for the first time since April 2025 (Gavekal). Gold is in a 'panic' (Yardeni) at 14-month lows around $3,575, down 12.2% since October 1. JPM and Goldman see the euro as a near-term funding currency, citing energy and French fiscal risk.", "divergence": "On gold, UBS has upgraded it to Attractive with a $5,000/oz target by December 2027. Standard Chartered cut its targets to $4,000 (3 months) and $4,500 (12 months) but still sees upside from oversold levels. BCA has stood aside from its structural long until the dollar peaks, calling gold's safe-haven reputation overstated. Berezin (BCA) sees the dollar weakening and gold rising only after an early-2027 equity relapse. On the dollar itself, Standard Chartered calls the USD overbought and targets EUR/USD at 1.11 within about 3 weeks. Goldman sees the dollar at the top of its range with modest softening, especially against cheap JPY and CNY. Gavekal warns the technicals point to 'violent' EUR/USD moves ahead. UBS prefers sterling as its G10 carry trade.", "items": [{"source": "ubs", "name": "UBS CIO", "thesis": "Gold upgraded to Attractive with a $5,000/oz target by December 2027. Copper is the preferred industrial metal. Sterling is the preferred G10 carry trade.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-18112026.html", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Gold targets cut to $4,000 (3 months) and $4,500 (12 months). USD overbought: EUR/USD to 1.11 within about 3 weeks, with support above 1.0950. AUD/USD could rebound from 0.6600, with resistance at 0.6830. USD/JPY to test 157.90.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-20-11-2026/?mvog=1", "images": []}, {"source": "bca_research", "name": "BCA Research", "thesis": "'Gold: Stand Aside Until The Dollar Peaks.' Gold's safe-haven role is overstated and a strong dollar leaves it exposed to further downside. BCA waits for a better entry to reinstate its structural long.", "url": "https://www.bcaresearch.com/reports/gold-stand-aside-until-dollar-peaks-20-11-2026/227624", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Charles Gave: EUR/USD has fallen below 1.10 for the first time since April 2025. The 'ugliness contest' may give way to violent exchange-rate moves. Separately, AUD and NZD have decoupled on divergent central banks and commodity mixes.", "url": "https://research.gavekal.com/teaser/the-dollar-euro-exchange-rate/", "images": []}, {"source": "jpmorgan", "name": "J.P. Morgan", "thesis": "Rising inflation and the Fed's hawkish pivot are good for the greenback and less so for the euro (teaser only).", "url": "https://www.jpmorgan.com/insights/global-research/currencies/currency-volatility-dollar-strength", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs (Wilson)", "thesis": "The dollar is at the top of its range, with modest softening in the baseline, especially against cheap JPY and CNY. The euro stays a funding currency because of energy and French election risk.", "url": "https://www.goldmansachs.com/insights/goldman-sachs-exchanges/steady-global-economic-growth-in2027-but-risks-tilted-to-downside", "images": []}]}, {"theme": "Geopolitics & US Policy", "category": ["geopolitics"], "consensus": "Three events shape the backdrop. First, the Democratic 'blue tsunami' midterms, with control of both chambers from January. Second, the first Trump-Xi-Putin trilateral at APEC Shenzhen (November 18-19), which produced only nonbinding commitments (Moody's), including a muted pledge to boost oil supply (Standard Chartered). Third, a nine-month Iran war in which Hormuz is still contested. Think tanks agree the summit yields little substance and that US leverage has eroded (Brookings).", "divergence": "The disagreement is over the market payoff. BCA's Gertken argues Trump will pursue a global 'ceasefire dividend' in 2027-28 but that it is 'too little, too late' to sustain the bull market. Galaxy flags a peace deal as the main upside catalyst. Carnegie and RBC see the Gulf conflict as durable, noting Houthi strikes on Saudi Arabia, the Mecca defence pact and Iran's insistence on its MoU terms. On tariffs, PIIE (Wolff, Manak) says Democrats lack veto-proof majorities, so broad rollback is unlikely for two years. Canada-specific relief is the most achievable step, and the courts are the real hope. Goldman instead expects some reversal of One Big Beautiful Bill Act spending cuts.", "items": [{"source": "bca_research", "name": "BCA GeoMacro", "thesis": "The trilateral summit shows how Trump will pursue a global 'ceasefire dividend' in 2027-28, but that dividend alone cannot sustain the bull market.", "url": "https://www.bcaresearch.com/reports/global-ceasefire-dividend-too-little-too-late-18-11-2026/227600", "images": []}, {"source": "brookings", "name": "Brookings (Patricia Kim)", "thesis": "The Shenzhen trilateral shows how far the US has fallen in the strategic triangle. It is a diplomatic win for Xi as host, and Putin escapes isolation without concessions. New START has expired and China is in an unprecedented nuclear buildup.", "url": "https://www.brookings.edu/articles/americas-lost-advantage-in-the-strategic-triangle/", "images": []}, {"source": "peterson_institute", "name": "PIIE (Wolff)", "thesis": "Democrats have at least 256 House and 55 Senate votes, short of the 290 and 67 needed to override a veto. Expect stalemate on most tariffs for two years; repealing the Section 338 Canada tariffs and exempting Canada from Section 232 are the low-hanging fruit.", "url": "https://www.piie.com/blogs/realtime-economics/2026/after-blue-tsunami-getting-rid-trumps-tariffs", "images": []}, {"source": "carnegie", "name": "Carnegie Endowment", "thesis": "Saudi Arabia hedges three ways: the Beijing deal with Iran survived the war, it formed the 2026 Mecca defence pact with Türkiye and Pakistan, and it keeps relying on the US. Riyadh denied the US bases for offensive operations. Houthi strikes on Saudi infrastructure followed in October.", "url": "https://carnegieendowment.org/middle-east/research/2026/11/saudi-arabias-gambit-to-enhance-its-regional-role", "images": []}, {"source": "brookings", "name": "Brookings", "thesis": "APEC preview: the US-China trade truce is extended to January 2027 and expectations are low ('all thunder, no rain'). Trump authorised purchases of Russian-origin diesel and waived the Graham Act sanctions.", "url": "https://www.brookings.edu/articles/trump-xi-and-putin-what-to-expect-from-the-apec-summit/", "images": []}, {"source": "brookings", "name": "Brookings (Liff)", "thesis": "Japan's revised security documents are due in December. Defence spending has reached 2% of GDP two years early, against a US demand of 3.5% core, and Japan's fiscal position counsels caution.", "url": "https://www.brookings.edu/articles/japans-forthcoming-national-security-and-defense-strategies-watch-this-space/", "images": []}]}, {"theme": "Crypto & Digital Assets", "category": ["crypto"], "consensus": "Bitcoin is in a continuing bear market, at about $62-64k against an October high above $83k and a July 1 low of $57,717. Whale selling, higher-rate expectations and tech weakness drive it, and the dollar-debasement trade has failed this year (Yardeni). Sentiment is at extremes: Galaxy's fear-and-greed index is near all-time lows, and CoinShares notes IBIT spreads widening to 17-19bp. Market structure keeps institutionalising, with SEC tokenised-stock relief, DTCC moving onto Solana, and MSTR and other DATs being dropped from MSCI indexes.", "divergence": "CoinShares (Butterfill) expects a $60-90k range through much of 2027, with no breakout until policy eases. It says institutional adoption 'cannot cancel out restrictive liquidity', but calls $40k forecasts 'too simplistic'. Galaxy argues the holder base is structurally stronger: 13F filers bought 49,229 BTC-equivalent in Q3 for a record 356,491, the wealth channel is 40.5% of 13F holdings, and Wells Fargo is now the largest holder, with systematic rebalancing that dampens drawdowns. CoinShares flags a 'perverse upside': if 10y yields push toward 6-7%, forced Treasury-market intervention could become a bitcoin catalyst.", "items": [{"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "Q3 13F: filers added a net 49,229 BTC-eq (about $4.1bn) to a record 356,491. Advisors hold 144,307 (40.5%). Wells Fargo is the largest holder at 30,553, up from 15,931. Wirehouse buying accelerated from 3,998 to 11,953 to 22,728. Basis and relative-value hedge funds fell from a 101,826 peak to 34,053. ETP BTC fell 38,531 between Sep 30 and Nov 16.", "url": "https://www.galaxy.com/insights/research/bitcoin-etp-13f-institutional-holdings-q3-2026-wealth-channel-wells-fargo", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "Base case is a $60-90k range. The FOMC minutes were more hawkish than Warsh's press conference. Oil fell from about $113 to about $92. CoinShares thinks markets are too pessimistic on inflation and that the Fed's reliance on backward-looking data is the bigger risk.", "url": "https://coinshares.com/insights/research-data/market-update-20-11-2026/", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "'Is this a bear market?' It is a continuation of the bear market that began with whale selling in late 2025. The S&P is +7% YTD while Coinbase is -49% and Strategy -36%.", "url": "https://coinshares.com/insights/research-data/crypto-s-bear-market-tech-s-correction-what-our-experts-see/", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "The SEC's tokenised-stock exemption (September 17, 2026-2031) is venue relief, not product approval: up to 75 large-cap names capped at 0.25% of ADV. The tokenised equity market is $4.68bn, up from $407m.", "url": "https://coinshares.com/insights/knowledge/what-did-the-sec-s-tokenised-stock-exemption-actually-approve/", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "Solana Breakpoint: Mainnet 1.0 with Alpenglow (~150ms finality), ZelleUSD, DTCC connecting in H2 2027, and about 42% of tokenised-equity volume. Galaxy cautions that being a supported network is not the same as being the primary venue.", "url": "https://www.galaxy.com/insights/research/solana-breakpoint-institutional-adoption-mainnet-1", "images": []}, {"source": "chainalysis", "name": "Chainalysis", "thesis": "The Eastern Europe crypto economy fell to $642.1bn (-7.9% against -1.6% globally). Ukraine received $12bn of stablecoin remittance-like flows. Poland still has no MiCA act after three vetoes.", "url": "https://www.chainalysis.com/blog/eastern-europe-crypto-adoption-2026/", "images": []}]}, {"theme": "Europe, UK & Inflation Shock", "category": ["growth", "rates"], "consensus": "The energy shock is broadening in Europe. Euro-area HICP is 4.0% (energy contributing 1.89pp), German PPI is +8.1% y/y (Moody's), and the ECB has hiked twice with a final December hike expected (Goldman, BNP). Euro-area growth is about 1% (Barclays), and deficits are rising on defence and interest costs. UK growth has surprised to the upside (Q3 +0.7%), helped by AI investment in business services (Bailey, Lombardelli).", "divergence": "Goldman expects the UK to beat consensus again, with 1.4% GDP in 2027 against 1.2% and Bank Rate peaking at 4.25%. The MPC is split on persistence. Greene and Lombardelli question whether labour-market slack will contain second-round effects, with wage growth at the upper end of the range consistent with target. Taylor argues the 2026 'state' (slack, restrictive policy) means much smaller propagation than in 2022. For euro equities, UBS and BCA favour Europe, while Goldman warns energy and chemicals estimates could fall 6-12 months later, as they did in 2022. French fiscal risk ahead of the April-May 2027 election is the shared tail risk (Goldman, Citi).", "items": [{"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "UK 2027 GDP of 1.4% against a 1.2% consensus, reaccelerating in H2 on ICT and utilities capex. Bank Rate makes a final hike to 4.25% in February. Unemployment rises from 4.7% to 5%.", "url": "https://www.goldmansachs.com/insights/articles/will-the-uk-economy-beat-expectations-again-in-2027", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs (Bell)", "thesis": "STOXX 600 EPS +18% in 2026 and +7% in 2027. GS expects flat margins ex-financials and commodities until 2028, against a consensus of 8.7% rising to 10.1%. The energy shock could repeat the 2022 pattern of downgrades 6-12 months later.", "url": "https://www.goldmansachs.com/insights/articles/why-european-companies-are-forecast-to-have-robust-earnings-growth", "images": []}, {"source": "moodys_analytics", "name": "Moody's Analytics", "thesis": "Euro-area HICP was 4.0% y/y in October, a three-year high, with energy contributing 1.89pp. Core is benign but the energy shock is broadening. German PPI was +8.1% y/y, squeezing margins (teasers).", "url": "https://www.economy.com/economicview/analysis/424570/Euro-Zone-Inflation-A-Benign-Core-Reading-but-a-Broadening-Energy-Shock", "images": []}, {"source": "boe", "name": "Bank of England (Greene)", "thesis": "Greene questions whether labour-market slack will mitigate second-round effects from the energy shock. Her estimate of target-consistent wage growth is closer to 3%.", "url": "https://www.bankofengland.co.uk/speech/2026/october/megan-greene-speech-at-lse-economics-society-london", "images": []}, {"source": "boe", "name": "Bank of England (Taylor)", "thesis": "Second-round effects equal 'state times shock'. In 2026 the UK state is a looser labour market and restrictive policy, so propagation looks closer to 2011 than 2022, and he argues against hikes.", "url": "https://www.bankofengland.co.uk/speech/2026/september/searching-for-signposts-speech-by-alan-taylor", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "thesis": "European strategic autonomy: 15.7% of Draghi's recommendations are fully implemented (41.3% including partial). €21.1bn is earmarked for critical raw materials. The investor question is now execution.", "url": "https://www.bnpparibas-am.com/en-us/portfolio-perspectives/european-strategic-autonomy-in-2027-where-are-we-where-are-we-going/", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Spain's debt fell from 119% to 101% of GDP despite gridlock. Greater political stability after the November 29 vote could paradoxically allow more fiscal slippage.", "url": "https://research.gavekal.com/teaser/could-political-stability-spoil-the-spanish-debt-miracle/", "images": []}]}, {"theme": "China, Asia & EM", "category": ["em", "growth"], "consensus": "China is slowing on weak domestic demand. Infrastructure fixed-asset investment is down 7.3% YTD as off-balance-sheet LGFV financing is curbed (Gavekal), while exports and a trade surplus above $1tn carry growth: GDP 4.6% in 2026 (Barclays), 4.5% in 2027 (Goldman) or 4% (Barclays). The BoJ is tightening to 2%: Goldman sees hikes in December, March and June, and Barclays in December, March and July. Japan core CPI is 2.2%. EM central banks mostly avoid tightening (Oxford Economics, BNP's Chi Lo).", "divergence": "Goldman (TOPIX +24%, MSCI EM +21%; overweight Japan) and BNP (EM equities positive, China negative) are constructive on EM ex-China. Standard Chartered prefers China financials and healthcare over tech, with HSTECH at 12.9x, 1 s.d. cheap. Gavekal warns that the record income-tax crackdown, with RMB160bn declared, pressured Hong Kong stocks. Citi is positive on LatAm, citing distance from conflict and commodities, but flags the real falling more than 10% after Lula's re-election. PIMCO likes Brazil, Mexico and South Africa EM rates, and UBS sees EM sovereigns at about 7.1% as a best opportunity.", "items": [{"source": "gavekal", "name": "Gavekal Dragonomics", "thesis": "Infrastructure FAI is -7.3% YTD through October. Beijing is choosing weaker growth over more on-budget debt. October domestic demand softened further, though 2026 GDP (4.6% YTD) lands within the 4.5-5% target.", "url": "https://research.gavekal.com/teaser/financing-infrastructure-after-lgfvs/", "images": []}, {"source": "gavekal", "name": "Gavekal Dragonomics", "thesis": "The offshore-trust tax crackdown produced more than RMB160bn of declarations, making October the biggest month of income-tax collection in China's history. It likely exacerbated Hong Kong's stock decline.", "url": "https://research.gavekal.com/teaser/the-tax-crackdown-isnt-over/", "images": []}, {"source": "citi_gps", "name": "Citi", "thesis": "LatAm has room to run on trade reconfiguration and commodities. The real fell more than 10% after Lula's surprise re-election. El Niño is a stagflation risk for the Andean economies. The 'hummingbirds' (Dominican Republic, Guatemala, Costa Rica, Panama) stand out.", "url": "https://www.citigroup.com/global/insights/e92-latin-america-room-to-run-risks-to-watch", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "EM 2027: inflation will be tolerable, so central banks avoid broad tightening. Oxford Economics is constructive on AI despite setbacks.", "url": "https://www.oxfordeconomics.com/webinar/emerging-markets-key-themes-for-2027/", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM (Chi Lo)", "thesis": "Asia ex-Japan is unlikely to follow US hikes, given current-account surpluses and core inflation near target. The exceptions are Indonesia, the Philippines and Vietnam, or a persistent oil shock combined with subsidy removal.", "url": "https://www.bnpparibas-am.com/en-us/front-of-mind/view-from-the-markets-asia-may-not-follow-us-rate-hikes/", "images": []}]}], "B_calls": [{"source": "goldman_sachs", "name": "Goldman Sachs", "call": "S&P 500 +18% total return to end-2027; 2027 EPS +11%. Downside case is about 5,600 (-25%). 12-month total returns: S&P 16%, STOXX 13% (USD), TOPIX 24%, MSCI EM 21%. Overweight US and Japan, underweight Europe.", "category": ["equities"], "url": "https://www.goldmansachs.com/insights/articles/us-stocks-predicted-to-extend-historic-rally-as-gains-moderate", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "call": "Fed: 25bp in December and March to 4.25-4.5%, then cuts from late 2027 to 3.25-3.5% (below market). Brent $88 average in 2027, $78 by end-2027. TTF €45/MWh in 2027. Desk hedge: OTM USD and equity puts.", "category": ["rates", "energy"], "url": "https://www.goldmansachs.com/insights/articles/the-global-economy-is-forecast-to-grow-2-point-8-percent-in-2027-as-oil-prices-decline", "images": []}, {"source": "ubs", "name": "UBS CIO", "call": "Year Ahead 2027: global equities downgraded to Neutral; bonds and commodities ranked first; gold upgraded to Attractive with a $5,000/oz target for December 2027. Prefers Eurozone equities (EPS +15%), industrials, healthcare and US equal-weight; 2-10y duration; EM and HY bonds; GBP carry.", "category": ["equities", "rates", "commodities", "fx"], "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-18112026.html", "images": []}, {"source": "barclays", "name": "Barclays", "call": "Stays overweight equities versus fixed income for another quarter ('more nervous, but not bearish'). Global GDP 3.2% in 2027. BoJ hikes in December, March and July to 2%. AI investment reaches about $1.7tn by 2028.", "category": ["equities"], "url": "https://www.ib.barclays/content/barclaysmicrosites/ibpublic/en/research/global-outlook/q1-2027-a-correction-not-collapse.html", "images": []}, {"source": "pimco", "name": "PIMCO", "call": "Duration moved to benchmark with a preference for longer maturities. Underweight bank loans and HY. Overweight agency MBS and AAA non-agency RMBS over IG corporates, and Australia, the UK and EM rates (Brazil, Mexico, South Africa) with currencies hedged. Munis yield 4.23% (7.14% tax-equivalent). 10% commodities sleeve.", "category": ["rates", "credit"], "url": "https://www.pimco.com/us/en/insights/charting-the-year-ahead-investment-ideas-for-2027", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "call": "2027 scorecard: US Treasuries negative (10y to 5.10%); long gilts highest-conviction positive; JGBs negative (10y above 3%); breakevens and ILBs positive; Italy and Spain spreads positive; USD, EUR and GBP IG positive; EUR HY adding; US and EM equities positive; China equities negative; energy and financials positive.", "category": ["rates", "credit", "equities"], "url": "https://www.bnpparibas-am.com/en/portfolio-perspectives/outlook-2027-investment-implications/", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "call": "New opportunistic idea: US mega caps (S&P Top 20 Select, below -2 s.d. on forward P/E). Fed at 4.25% by end-2027. Value in the US 10y only above 5.25%; prefers 3-7y BB-BBB. EUR/USD to 1.11. Gold targets cut to $4,000 and $4,500. WTI range $80-90.", "category": ["equities", "rates", "fx", "commodities"], "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-20-11-2026/?mvog=1", "images": []}, {"source": "bca_research", "name": "BCA Research", "call": "TAA: downgrade Health Care, upgrade Consumer Discretionary, upgrade Europe, keep favouring hyperscalers over neoclouds. Stand aside on gold until the dollar peaks. Expect equities to relapse in early 2027, then buy bonds.", "category": ["equities", "commodities"], "url": "https://www.bcaresearch.com/reports/taa-update-investment-implications-regime-change-congress-and-nvidia-16-11-2026/227563", "images": []}, {"source": "gavekal", "name": "Gavekal-IS", "call": "Global equity-allocation model is unequivocally risk-off: cut equity allocations to 20% or less.", "category": ["equities"], "url": "https://research.gavekal.com/teaser/equity-risk-off-what-next/", "images": []}, {"source": "yardeni_research", "name": "Yardeni Research", "call": "Year-end S&P target cut from 8,400 to 7,900 (September 15). The 11.6% drawdown is a correction, not a bear market. New S&P targets are in the full note, which is paywalled.", "category": ["equities"], "url": "https://yardeni.com/research/quicktakes/2026/11/21/us-markets-call-a-bull-market-correction-or-a-tech-wreck-bear-market-also-our-new-s-p-500-targets", "images": []}, {"source": "blackrock_investment_institute", "name": "BlackRock", "call": "Anchor in high-quality short-to-intermediate duration and wait before going beyond 5y. Selective in lower-quality credit. Add ABS, CMBS and EM local. Stay constructive on equities over 12 months but expect volatility.", "category": ["rates", "credit", "equities"], "url": "https://www.blackrock.com/us/individual/insights/cio-perspective-fixed-income-yields", "images": []}, {"source": "vanguard", "name": "Vanguard", "call": "US GDP about 3% in 2027 (above consensus). US equities 5-8% a year over 3-5 years. Favour value-oriented AI adopters and non-US developed markets. Prefer short and intermediate high-quality government bonds over corporates. Fed close to done after December; ECB to 3.0%; BoJ to 2.0%.", "category": ["equities", "rates"], "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/vemo/ai-booms-critical-next-phase.html", "images": []}, {"source": "amundi", "name": "Amundi", "call": "Own AI bottlenecks (power equipment, grid, networking, fabs). Avoid neoclouds, data-centre developers, colocation REITs and leveraged operators. Focus on dividends and quality cash flow.", "category": ["ai_tech", "equities"], "url": "https://research-center.amundi.com/article/ai-2027-greater-scrutiny-returns", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "call": "Brent $84 in 2027 and $55 in 2028 in the base case; $105 and $91 in the stand-off scenario.", "category": ["energy"], "url": "https://www.woodmac.com/blogs/the-edge/how-the-oil-market-could-move-from-famine-to-glut/", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "call": "US GDP 2.5% in 2027 against a 2.1% consensus (highest-conviction call). Core inflation sticky above consensus. World GDP 3.0% in 2027. 25bp in December, not 50bp.", "category": ["growth", "rates"], "url": "https://www.oxfordeconomics.com/resource/us-key-themes-2027/", "images": []}, {"source": "citi_gps", "name": "Citi", "call": "Position for higher US rates versus European rates; the 'Warsh shadow rate' is at an all-time high.", "category": ["rates"], "url": "https://www.citigroup.com/global/insights/markets-edition-writing-on-the-waller-fed-hawks-are-back-in-town", "images": []}, {"source": "rbc", "name": "RBC (Imagine)", "call": "Biotech scenarios: +10-15% on an AI capex slowdown, -5-10% if capex accelerates; +15-20% if compute-scaling returns diminish.", "category": ["equities", "ai_tech"], "url": "https://www.rbccm.com/en/insights/2026/11/ai-isnt-just-shaping-biotech-narratives-its-shifting-the-market", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs (consumer desk)", "call": "Buy dips in hotels and cruise lines and in discounted quality discretionary and apparel names into Black Friday. Retail has outperformed in November in 9 of the last 10 years.", "category": ["equities"], "url": "https://www.goldmansachs.com/insights/the-markets/the-outlook-for-retail-stocks-as-black-friday-approaches", "images": []}, {"source": "coinshares", "name": "CoinShares", "call": "BTC base-case range $60-90k through much of 2027. $60k is the key psychological level, and $40k calls are too simplistic.", "category": ["crypto"], "url": "https://coinshares.com/insights/research-data/market-update-20-11-2026/", "images": []}], "C_deep_reads": [{"source": "goldman_sachs", "name": "Goldman Sachs", "title": "Global Macro Outlook 2027: Steady Baseline, Downside Risks", "summary": "Hatzius forecasts global GDP of 2.8% in 2027 (2.7% in 2026), with the US, Japan and the UK above consensus and Europe weaker. Lower energy prices (Brent $78 by end-2027) and AI investment (global AI investment rises from $1.1tn to $1.8tn, front-loaded in H1 2027) outweigh tighter financial conditions and more neutral fiscal policy. Japan's fiscal package adds 0.7pp. US core PCE falls from 3.2% to 2.4% as tariff effects drop out and spring 2027 laps the start of the war. Central banks are near peak: the Fed hikes in December and March, the ECB makes a final December hike, the BoE moves to 4.25% in February and the BoJ to 2%. Cuts begin in late 2027 at the Fed and in 2028 elsewhere, all more dovish than market pricing. Risks are tilted to the downside: Iran re-escalation, fiscal-driven yield spikes (especially France ahead of the April-May election), AI capex shortfalls, and AI-driven unemployment rising about 0.5pp in 2028-29. Dominic Wilson adds that the oil risk premium has collapsed from about $30 to near zero, AI is at a 'second-derivative peak', bonds are a better hedge again, and buying index volatility makes sense.", "url": "https://www.goldmansachs.com/insights/articles/the-global-economy-is-forecast-to-grow-2-point-8-percent-in-2027-as-oil-prices-decline", "images": []}, {"source": "pimco", "name": "PIMCO", "title": "Charting the Year Ahead: Investment Ideas for 2027 (Seidner)", "summary": "PIMCO's annual idea list has five parts. (1) Audit total-portfolio AI exposure: nearly a quarter of 2026 USD IG non-financial issuance was AI-related, and data-centre restrictions may follow the midterms. Prefer secured infrastructure-layer financing, and diversify via agency MBS and AAA non-agency RMBS, which pay more than IG corporates. (2) Look beyond index leaders: the value spread was 1.09 against a median of 1, and a record share of S&P constituents are negatively correlated with the index. (3) Use quant and relative-value strategies, since dispersion is high; the Australia-UST 10y spread collapsed from about 50bp to near zero. (4) 'The credit default cycle is already underway': CCCs face refinancing at 15-16%, distressed trading is rising and BDCs trade below book, so move up in quality. (5) A 10% commodity sleeve has improved Sharpe ratios. Munis yield 4.23% (7.14% tax-equivalent), in the top decile of the past 15 years. Ivascyn's companion Q&A says yields are near 25-year highs, PIMCO is at benchmark duration with a preference for longer maturities, Fed hikes are 'already priced', and 'a lot must go right for equities, a lot must go wrong for bonds.'", "url": "https://www.pimco.com/us/en/insights/charting-the-year-ahead-investment-ideas-for-2027", "images": []}, {"source": "ecb", "name": "ECB Financial Stability Review (Nov 2026)", "title": "The debt financing of AI / Unwinding of corporate spread compression", "summary": "The ECB's November FSR boxes give the most comprehensive official warning on AI financing. US big-tech capex is projected at about $5.5tn cumulatively by 2030, more than 3% of GDP a year against 2.24% for the 1870-90 railway boom and 1.10% for the internet boom. Hyperscaler free cash flow turned negative in 2026. Off-balance-sheet lease and purchase commitments exceed $4tn, larger than on-balance-sheet liabilities. Circular financing (chipmakers funding customers, and 'other income' from revaluing stakes in AI labs) flatters earnings. GPUs last 1-3 years while server accounting lives have been stretched from 3 to 6 years, so the debt outlives the collateral. A companion box finds less than a fifth of euro-area spread compression since 2022 was fundamental. The excess bond premium has risen from deeply negative to near zero and can jump more than 100bp in a quarter, implying mark-to-market losses of up to 4%. Further boxes cover oil-shock effects on bank NPLs (+64bp over 3 years) and hedge-fund repo leverage in sovereign markets.", "url": "https://www.ecb.europa.eu/press/financial-stability-publications/fsr/focus/2026/html/ecb.fsrbox202611_03~4fd1449eaa.en.html", "images": []}, {"source": "ubs", "name": "UBS CIO", "title": "Year Ahead 2027: Sustaining resilience", "summary": "UBS's base case is near-trend growth and rising earnings, with easing inflation (US 2.3% in 2027 against 3.4% in 2026) allowing yields to drift modestly lower later in 2027. The big change is a downgrade of global equities from Attractive to Neutral, with bonds and commodities ranked first, then equities, then cash. In bonds it rebalances toward income at 2-10y duration and sees the best value in EM (about 7%) and HY (about 8.3%, 60% BB, about 2% expected defaults). Gold is upgraded with a $5,000 target for December 2027, copper is the preferred metal, oil is supported in H1, and sterling is the preferred carry trade. AI investment rises from $1.0tn to $1.5tn (2026-28), but revenues must reach at least $1.5tn by 2030, so UBS favours strong hyperscalers over leveraged capacity providers. The Fed hikes 25bp in December and March, with no prolonged cycle.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-18112026.html", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas AM", "title": "Outlook 2027: Investment implications", "summary": "BNP's 2027 outlook, 'Testing Resilience', sees the US as robust but losing its AI tailwind, Europe gaining momentum and China slowing. Its asset-class scorecard is the clearest contrarian rates call this week. It is negative on US Treasuries and sees the 10y rising to 5.10% as the Fed heads toward a 4.50-4.75% peak. It is neutral on euro core bonds (it sees December as the ECB's last hike), positive on Italy and Spain spreads, and has its highest conviction in long-dated gilts. It is negative on JGBs, with the 10y back above 3%. It is positive on inflation breakevens: US 10y breakevens are near pre-war levels, and a companion piece argues ILBs should be a structural holding. Credit (USD, EUR and GBP IG; selective HY) is positive. Equities: US positive, diversifying tech with financials; Eurozone and Japan neutral; China negative; EM positive. The equity outlook notes that semis rose 58% in H1 then fell 23% in H2, and that tech earnings-estimate dispersion is up more than 5x in two years.", "url": "https://www.bnpparibas-am.com/en/portfolio-perspectives/outlook-2027-investment-implications/", "images": []}, {"source": "peterson_institute", "name": "PIIE (Jason Furman)", "title": "How Far Could Stocks Fall? / Consumers Can Handle a Stock Crash", "summary": "Furman sizes an AI-bubble burst. Valuation reversion gives between -18% (forward P/E from 18.3 back to 15) and -41% (CAPE from 40 to 23.6). A 50% fall in the AI-7 alone costs the index 11%. He argues today is not 2000: Nvidia trades at 13x forward against Cisco's 102x, and earnings have tracked prices. He flags warning signs: AI-lab revenue growth has slowed from 80-90% to 12%, and 10y TIPS are above 2%. Options price 11% odds of a fall of 20% or more by December 2027. In the companion piece, a 25% crash cuts consumption about 0.8% (-0.6pp of GDP growth) because households have spent only about 1 cent per dollar of recent gains. US stock market value is 286% of GDP against 187% in 2000, and 88% of stock wealth sits with the top 10%. His conclusion: consumers can absorb a crash, and the 2001 analogue was an investment-led recession.", "url": "https://www.piie.com/blogs/realtime-economics/2026/how-far-could-stocks-fall", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "title": "How the oil market could move from famine to glut", "summary": "After nine months of a Hormuz closure that kept Brent above $100, WoodMac's base case assumes a late-2026 US-Iran deal. Supply is revised up by 1mb/d in 2027 and 1.8mb/d in 2028, led by the US, the UAE, Brazil and Venezuela. Inventories that fell 1bn bbl this year rebuild to more than 7bn bbl by mid-2028. Brent averages $84 in 2027 and collapses to $55 in 2028. The stand-off alternative keeps Middle East output 3mb/d lower and Brent at $105 and $91. Structurally, the marginal cost has fallen to $60-65, OPEC spare capacity stays near 8mb/d and the UAE is outside OPEC. WoodMac expects OPEC to have to cut before 2030 to prevent a crash. Industry will mostly use its $0.75tn 2026 windfall to repair balance sheets.", "url": "https://www.woodmac.com/blogs/the-edge/how-the-oil-market-could-move-from-famine-to-glut/", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "title": "Institutional Holdings of Bitcoin ETPs Reach New All-Time High (Q3 2026 13F)", "summary": "Galaxy's 13F study shows institutions bought into the bear market. Filers added a net 49,229 BTC-equivalent in Q3 for a record 356,491 ($29.8bn), roughly double March 2024. The wealth channel drives it: advisors and wealth platforms hold 40.5% of 13F holdings (24.3% a year ago) and have bought for 9 straight quarters. Wirehouse buying accelerated from about 4k to 12k to 23k BTC across Q1-Q3, and Wells Fargo (30,553 BTC-eq, 85% in advisor arms) overtook Jane Street and Millennium as the largest holder. Basis and relative-value hedge funds, once dominant, have cut from 101,826 to 34,053 and are the only holder type to be net sellers cumulatively. IBIT is 65% of holdings. Galaxy reads the Wells Fargo pattern as systematic allocation whose rebalancing should dampen drawdowns. ETP BTC still fell 38.5k between Sep 30 and Nov 16 as price dropped from $83.6k to $64.9k.", "url": "https://www.galaxy.com/insights/research/bitcoin-etp-13f-institutional-holdings-q3-2026-wealth-channel-wells-fargo", "images": []}, {"source": "boe", "name": "Bank of England (MPC speeches)", "title": "Lombardelli 'The low-gear labour market' / Mann 'Financial conditions: what's priced in?' / Taylor 'Searching for signposts' / Ramsden on QT", "summary": "Taken together, these speeches map the MPC's split. Lombardelli (Nov 10) backed the 8-1 hike to 4%. She says the conditions for persistent inflation are 'crystallising' and there is 'likely to be a case for a further increase in the near term'. UK unemployment is 4.7%, cooling through less hiring rather than more firing. Mann argues real financial conditions have loosened. The OIS curve prices more than 100bp of tightening against surveys implying holds and cuts, and the MPC must 'follow through' or lose credibility. Taylor, the dove, puts R* at 2.75-3% and calls market rates tighter than at the 2023 peak, so further hikes are 'not compelling' and policy must reverse once energy fades. Ramsden set a multi-year QT plan: £20bn a year of 2035-49 gilt sales, routed to the Government rather than the market, to unwind monetary-policy gilts by end-2034. Gilts rallied about 10bp on the plan. Lombardelli's September speech projected CPI at about 4.2% in Q1 2027.", "url": "https://www.bankofengland.co.uk/speech/2026/november/clare-lombardelli-speech-at-the-bank-watchers-conference", "images": []}], "D_charts": [], "house_views": [{"source": "goldman_sachs", "name": "Goldman Sachs", "stance": "Constructive: S&P +18% to end-2027, overweight US and Japan, underweight Europe. Fed peaks at 4.25-4.5%, below market pricing. Brent at $78 by end-2027.", "category": "bank_bulge", "url": "https://www.goldmansachs.com/insights/articles/the-global-economy-is-forecast-to-grow-2-point-8-percent-in-2027-as-oil-prices-decline"}, {"source": "barclays", "name": "Barclays", "stance": "'A correction, not a collapse': stays overweight equities versus bonds. Global GDP 3.2% in 2027.", "category": "bank_bulge", "url": "https://www.ib.barclays/content/barclaysmicrosites/ibpublic/en/research/global-outlook/q1-2027-a-correction-not-collapse.html"}, {"source": "ubs", "name": "UBS CIO", "stance": "Equities cut to Neutral. Bonds, commodities and gold ($5,000) favoured. Fed hikes in December and March, then done.", "category": "bank_bulge", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-18112026.html"}, {"source": "pimco", "name": "PIMCO", "stance": "Bond bull: benchmark duration with a preference for longer maturities, up in quality. 'The default cycle is underway.' Two to three more Fed hikes.", "category": "asset_manager", "url": "https://www.pimco.com/us/en/insights/charting-the-year-ahead-investment-ideas-for-2027"}, {"source": "blackrock_investment_institute", "name": "BlackRock", "stance": "Carry is king: short-to-intermediate high-quality bonds, selective cre
