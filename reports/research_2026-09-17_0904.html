const CATS = {
  macro: { label: "macro", color: "var(--macro)" },
  credit: { label: "credit", color: "var(--credit)" },
  positioning: { label: "positioning", color: "var(--positioning)" },
  ai: { label: "AI/infra", color: "var(--ai)" },
  crypto: { label: "crypto", color: "var(--crypto)" },
  geopolitics: { label: "geopolitics", color: "var(--geopolitics)" },
  energy: { label: "energy", color: "var(--energy)" },
  tech: { label: "tech", color: "var(--tech)" },
  gold: { label: "gold", color: "var(--gold)" },
  culture: { label: "culture", color: "var(--culture)" },
  labor: { label: "labor", color: "var(--labor)" },
  regulation: { label: "regulation", color: "var(--regulation)" },
  science: { label: "science", color: "var(--science)" },
  venture: { label: "venture", color: "var(--venture)" }
};

const URGENCY = {
  act: { label: "🔴 Act Now" },
  deep: { label: "🔵 Deep" },
  watch: { label: "🟡 Watch" }
};

const META = {
  date: "2026-09-17",
  time: "09:04 CEST",
  windowStart: "2026-09-17 03:04 CEST",
  windowEnd: "2026-09-17 09:04 CEST",
  emailsInWindow: 7,
  emailsRead: 7,
  itemsExtracted: 23,
  includedSources: [
    { name: "The Dark Side of the Boom", count: 9 },
    { name: "Bloomberg Opinion / John Authers (Points of Return)", count: 7 },
    { name: "Michael Parekh / AI-RTZ", count: 4 },
    { name: "HFIR (Wilson)", count: 3 }
  ],
  skippedSources: []
};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function esc(s) {
  return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function urgencyEmoji(u) {
  if (u === "act") return "🔴";
  if (u === "watch") return "🟡";
  return "🔵";
}

function renderHeader() {
  document.getElementById("headerMeta").textContent =
    META.date + " · " + META.time + " · " + META.itemsExtracted + " items from " +
    META.emailsRead + " emails";
}

function renderFilters() {
  const catCounts = {};
  ITEMS.forEach(i => { catCounts[i.cat] = (catCounts[i.cat] || 0) + 1; });
  const catRow = document.getElementById("catFilters");
  let html = '<button class="pill active" data-cat="all" onclick="setCat(\'all\')">All <span class="count">' + ITEMS.length + '</span></button>';
  Object.keys(catCounts).forEach(c => {
    const meta = CATS[c] || { label: c, color: "#999" };
    html += '<button class="pill" data-cat="' + c + '" onclick="setCat(\'' + c + '\')">' + esc(meta.label) + ' <span class="count">' + catCounts[c] + '</span></button>';
  });
  catRow.innerHTML = html;

  const urgCounts = {};
  ITEMS.forEach(i => { urgCounts[i.urgency] = (urgCounts[i.urgency] || 0) + 1; });
  const urgRow = document.getElementById("urgFilters");
  let uhtml = '<button class="pill active" data-urg="all" onclick="setUrg(\'all\')">All <span class="count">' + ITEMS.length + '</span></button>';
  Object.keys(URGENCY).forEach(u => {
    if (!urgCounts[u]) return;
    uhtml += '<button class="pill" data-urg="' + u + '" onclick="setUrg(\'' + u + '\')">' + URGENCY[u].label + ' <span class="count">' + urgCounts[u] + '</span></button>';
  });
  urgRow.innerHTML = uhtml;
}

function setCat(c) {
  activeCat = c;
  activeSrc = null;
  document.querySelectorAll('[data-cat]').forEach(b => b.classList.toggle('active', b.getAttribute('data-cat') === c));
  applyCatColors();
  renderCards();
}

function setUrg(u) {
  activeUrg = u;
  activeSrc = null;
  document.querySelectorAll('[data-urg]').forEach(b => b.classList.toggle('active', b.getAttribute('data-urg') === u));
  renderCards();
}

function applyCatColors() {
  document.querySelectorAll('[data-cat]').forEach(b => {
    const c = b.getAttribute('data-cat');
    if (c === 'all') return;
    const meta = CATS[c] || { color: '#999' };
    if (b.classList.contains('active')) {
      b.style.background = meta.color;
      b.style.borderColor = meta.color;
    } else {
      b.style.background = 'transparent';
      b.style.borderColor = '#cfcbc2';
      b.style.color = 'var(--text)';
    }
  });
}

function filterBySrc(name) {
  activeSrc = name;
  activeCat = "all";
  activeUrg = "all";
  document.querySelectorAll('[data-cat]').forEach(b => b.classList.toggle('active', b.getAttribute('data-cat') === 'all'));
  document.querySelectorAll('[data-urg]').forEach(b => b.classList.toggle('active', b.getAttribute('data-urg') === 'all'));
  applyCatColors();
  renderCards(true);
}

function renderCards(expandAll) {
  const cardsEl = document.getElementById("cards");
  let items = ITEMS;
  if (activeCat !== "all") items = items.filter(i => i.cat === activeCat);
  if (activeUrg !== "all") items = items.filter(i => i.urgency === activeUrg);
  if (activeSrc) items = items.filter(i => i.source.indexOf(activeSrc) !== -1);

  let html = "";
  items.forEach(item => {
    const meta = CATS[item.cat] || { label: item.cat, color: "#999" };
    const chartIcon = item.charts && item.charts.count > 0 ? (item.charts.hot ? "🔥" : "📊") : (item.charts && item.charts.desc ? "📊" : "");
    html += '<div class="card" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">' + String(item.id).padStart(2, '0') + '</span>';
    html += '<span class="urg">' + urgencyEmoji(item.urgency) + '</span>';
    html += '<span class="badge-src" style="background:' + meta.color + '">' + esc(item.source.split('/')[0].trim()) + '</span>';
    html += '<span class="badge-cat">' + esc(meta.label) + '</span>';
    if (chartIcon) html += '<span class="charticon">' + chartIcon + '</span>';
    html += '<span class="card-title">' + esc(item.title) + '</span>';
    html += '</div>';
    html += '<div class="card-body' + (expandAll ? ' open' : '') + '" id="body-' + item.id + '">';
    html += '<div class="section-label">The Idea</div>';
    html += '<div class="idea-text">' + esc(item.idea) + '</div>';
    html += '<div class="section-label">My Angle</div>';
    html += '<div class="angle-box" style="border-left:2px solid ' + meta.color + '; background:' + meta.color + '14;">' + esc(item.angle) + '</div>';
    html += '<div class="section-label">Tweets</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet-card"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + esc(item.tweetA) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet-card"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + esc(item.tweetB) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    if (item.charts && (item.charts.count > 0 || item.charts.desc)) {
      html += '<div class="chart-box' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '🔥 CHART WORTH SAVING — ' : '') + esc(item.charts.desc || ((item.charts.count || 0) + ' chart(s)')) + '</div>';
    }
    html += '<div class="link-row"><a href="' + item.link + '" target="_blank">↗ Read full article</a></div>';
    html += '</div>';
    html += '</div>';
  });
  cardsEl.innerHTML = html || '<div style="padding:30px;color:#8a867c;text-align:center;">No items match this filter.</div>';
}

function toggleCard(id) {
  const body = document.getElementById('body-' + id);
  body.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function renderReport() {
  let html = '<div><strong>Window:</strong> ' + META.windowStart + ' → ' + META.windowEnd + '</div>';
  html += '<div style="margin-top:8px;"><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp;|&nbsp; <strong>Read:</strong> ' + META.emailsRead + ' &nbsp;|&nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</div>';
  html += '<div class="section-label" style="margin-top:16px;">Included Sources</div>';
  META.includedSources.forEach(s => {
    html += '<div><span class="src-link" onclick="filterBySrc(\'' + s.name.replace(/'/g, "\\'") + '\')">' + esc(s.name) + '</span> — ' + s.count + ' item(s)</div>';
  });
  if (META.skippedSources.length) {
    html += '<div class="section-label" style="margin-top:16px;">Skipped Sources</div>';
    META.skippedSources.forEach(s => {
      html += '<div>' + esc(s.name) + ' — <em>' + esc(s.reason) + '</em></div>';
    });
  } else {
    html += '<div class="section-label" style="margin-top:16px;">Skipped Sources</div><div>None — all 7 emails in the window were fully processed.</div>';
  }
  document.getElementById('reportBody').innerHTML = html;
}

document.getElementById('reportToggle').addEventListener('click', function() {
  document.getElementById('reportBody').classList.toggle('open');
  document.getElementById('reportChevron').textContent = document.getElementById('reportBody').classList.contains('open') ? '▴' : '▾';
});

renderHeader();
renderFilters();
applyCatColors();
renderCards();
renderReport();
</script>
</body>
</html>
