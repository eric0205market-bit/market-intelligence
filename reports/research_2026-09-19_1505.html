const URG_META = {

  watch:{ label: "Watch",   emoji: "&#128993;" }
};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function catColor(cat) { return CAT_COLORS[cat] || "#6b6560"; }

function buildFilters() {
  const catCounts = {};
  const urgCounts = {};
  ITEMS.forEach(function(i) {
    catCounts[i.cat] = (catCounts[i.cat] || 0) + 1;
    urgCounts[i.urgency] = (urgCounts[i.urgency] || 0) + 1;
  });

  const catWrap = document.getElementById("catFilters");
  let html = '<button class="pill' + (activeCat === "all" ? " active" : "") + '" style="' + (activeCat === "all" ? "background:#1c1917;" : "") + '" onclick="setCat(\'all\')">All (' + ITEMS.length + ')</button>';
  Object.keys(catCounts).sort().forEach(function(cat) {
    const isActive = activeCat === cat;
    const color = catColor(cat);
    html += '<button class="pill' + (isActive ? " active" : "") + '" style="' + (isActive ? "background:" + color + ";border-color:" + color + ";" : "border-color:" + color + ";color:" + color + ";") + '" onclick="setCat(\'' + cat + '\')">' + esc(cat) + ' (' + catCounts[cat] + ')</button>';
  });
  catWrap.innerHTML = html;

  const urgWrap = document.getElementById("urgFilters");
  let uhtml = '<button class="pill' + (activeUrg === "all" ? " active" : "") + '" style="' + (activeUrg === "all" ? "background:#1c1917;" : "") + '" onclick="setUrg(\'all\')">All (' + ITEMS.length + ')</button>';
  ["act", "deep", "watch"].forEach(function(u) {
    if (!urgCounts[u]) return;
    const isActive = activeUrg === u;
    uhtml += '<button class="pill' + (isActive ? " active" : "") + '" style="' + (isActive ? "background:#1c1917;" : "") + '" onclick="setUrg(\'' + u + '\')">' + URG_META[u].emoji + ' ' + URG_META[u].label + ' (' + urgCounts[u] + ')</button>';
  });
  urgWrap.innerHTML = uhtml;
}

function setCat(cat) { activeCat = cat; activeSrc = null; render(); }
function setUrg(urg) { activeUrg = urg; activeSrc = null; render(); }
function filterBySrc(name) {
  activeCat = "all"; activeUrg = "all"; activeSrc = name;
  render();
  Array.prototype.forEach.call(document.querySelectorAll(".card"), function(c) {
    const item = ITEMS.find(function(i) { return "card-" + i.id === c.id; });
    if (item && item.source.indexOf(name) !== -1) c.classList.add("open");
  });
}

function toggleCard(id) {
  const el = document.getElementById("card-" + id);
  el.classList.toggle("open");
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function render() {
  const cardsWrap = document.getElementById("cards");
  let filtered = ITEMS.filter(function(i) {
    if (activeCat !== "all" && i.cat !== activeCat) return false;
    if (activeUrg !== "all" && i.urgency !== activeUrg) return false;
    if (activeSrc && i.source.indexOf(activeSrc) === -1) return false;
    return true;
  });

  document.getElementById("emptyState").style.display = filtered.length ? "none" : "block";

  let html = "";
  filtered.forEach(function(item) {
    const color = catColor(item.cat);
    const urg = URG_META[item.urgency] || { emoji: "", label: "" };
    const chartFlag = item.charts && (item.charts.hot ? "&#128293;" : (item.charts.count > 0 ? "&#128202;" : ""));
    html += '<div class="card" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">' + String(item.id).padStart(2, "0") + '</span>';
    html += '<span>' + urg.emoji + '</span>';
    html += '<span class="badge" style="background:' + color + '">' + esc(item.source.split(" / ")[0].split(" (")[0]) + '</span>';
    html += '<span class="cat-tag">' + esc(item.cat) + '</span>';
    if (chartFlag) html += '<span class="chart-flag">' + chartFlag + '</span>';
    html += '<span class="title-text">' + esc(item.title) + '</span>';
    html += '<span class="caret">&#9654;</span>';
    html += '</div>';

    html += '<div class="card-body">';
    html += '<div class="section-label">The Idea</div>';
    html += '<div class="idea-text">' + esc(item.idea) + '</div>';
    html += '<div class="section-label">My Angle</div>';
    html += '<div class="angle-box" style="border-left:3px solid ' + color + '; background:' + color + '14;">' + esc(item.angle) + '</div>';
    html += '<div class="section-label">Tweets</div>';
    html += '<div class="tweets-row">';
    html += '<div class="tweet-box"><div class="tweet-label" style="color:#378add;">TWEET A</div><div class="tweet-text">' + esc(item.tweetA) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet-box"><div class="tweet-label" style="color:#7f77dd;">TWEET B</div><div class="tweet-text">' + esc(item.tweetB) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    if (item.charts && (item.charts.count > 0 || item.charts.desc)) {
      html += '<div class="chart-box' + (item.charts.hot ? " hot" : "") + '">' + (item.charts.hot ? "&#128293; CHART WORTH SAVING &mdash; " : "&#128202; ") + esc(item.charts.desc || ("Charts inside: " + item.charts.count)) + '</div>';
    }
    html += '<div class="link-row"><a href="' + esc(item.link) + '" target="_blank">&#8599; Read full article</a></div>';
    html += '</div>';
    html += '</div>';
  });
  cardsWrap.innerHTML = html;
}

function buildHeader() {
  document.getElementById("headerMeta").textContent =
    META.date + " · " + META.time + " · " + META.itemsExtracted + " items";
}

function buildReport() {
  const body = document.getElementById("reportBody");
  let html = "<p><strong>Time window:</strong> " + esc(META.windowStart) + " to " + esc(META.windowEnd) + "</p>";
  html += "<p><strong>Emails in window:</strong> " + META.emailsInWindow + " &nbsp;|&nbsp; <strong>Emails read:</strong> " + META.emailsRead + " &nbsp;|&nbsp; <strong>Items extracted:</strong> " + META.itemsExtracted + "</p>";
  html += "<p><strong>Included sources:</strong></p><ul>";
  META.includedSources.forEach(function(s) {
    const name = s.split(" (")[0];
    html += "<li><span class='src-link' onclick=\"filterBySrc('" + name.replace(/'/g, "\\'") + "')\">" + esc(s) + "</span></li>";
  });
  html += "</ul>";
  if (META.skippedSources && META.skippedSources.length) {
    html += "<p><strong>Skipped sources:</strong></p><ul>";
    META.skippedSources.forEach(function(s) { html += "<li>" + esc(s) + "</li>"; });
    html += "</ul>";
  } else {
    html += "<p><strong>Skipped sources:</strong> none &mdash; every email in the window had at least one substantive item.</p>";
  }
  body.innerHTML = html;
  document.getElementById("reportToggle").onclick = function() {
    document.getElementById("reportCard").classList.toggle("open");
  };
}

buildHeader();
buildFilters();
render();
buildReport();
</script>
