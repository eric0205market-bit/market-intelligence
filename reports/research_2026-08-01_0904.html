const CAT_COLORS = {
  macro: "#e24b4a", credit: "#378add", positioning: "#ef9f27", "AI/infra": "#1d9e75",
  crypto: "#7f77dd", geopolitics: "#d85a30", energy: "#f97316", tech: "#06b6d4",
  gold: "#d4a017", culture: "#ec4899", labor: "#8b5cf6", regulation: "#64748b",
  science: "#14b8a6", venture: "#84cc16"
};
const URGENCY_META = {
  act: { emoji: "🔴", label: "Act Now" },
  deep: { emoji: "🔵", label: "Deep" },
  watch: { emoji: "🟡", label: "Watch" }
};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function catColor(cat) { return CAT_COLORS[cat] || "#64748b"; }

function buildFilters() {
  const catCounts = {};
  const urgCounts = { act: 0, deep: 0, watch: 0 };
  ITEMS.forEach(function(i) {
    catCounts[i.cat] = (catCounts[i.cat] || 0) + 1;
    urgCounts[i.urgency] = (urgCounts[i.urgency] || 0) + 1;
  });

  const catWrap = document.getElementById("catFilters");
  let catHtml = '<button class="pill active" data-cat="all" onclick="setCat(\'all\')">All (' + ITEMS.length + ')</button>';
  Object.keys(catCounts).sort().forEach(function(cat) {
    catHtml += '<button class="pill" data-cat="' + cat + '" onclick="setCat(\'' + cat + '\')">' + cat + ' (' + catCounts[cat] + ')</button>';
  });
  catWrap.innerHTML = catHtml;

  const urgWrap = document.getElementById("urgFilters");
  let urgHtml = '<button class="pill active" data-urg="all" onclick="setUrg(\'all\')">All (' + ITEMS.length + ')</button>';
  ['act', 'deep', 'watch'].forEach(function(u) {
    urgHtml += '<button class="pill" data-urg="' + u + '" onclick="setUrg(\'' + u + '\')">' + URGENCY_META[u].emoji + ' ' + URGENCY_META[u].label + ' (' + urgCounts[u] + ')</button>';
  });
  urgWrap.innerHTML = urgHtml;
}

function applyPillStyles() {
  document.querySelectorAll('#catFilters .pill').forEach(function(btn) {
    const cat = btn.getAttribute('data-cat');
    if (cat === activeCat) {
      btn.classList.add('active');
      btn.style.background = cat === 'all' ? '#1a1a1a' : catColor(cat);
      btn.style.borderColor = 'transparent';
    } else {
      btn.classList.remove('active');
      btn.style.background = 'transparent';
      btn.style.borderColor = 'var(--pill-border)';
    }
  });
  document.querySelectorAll('#urgFilters .pill').forEach(function(btn) {
    const u = btn.getAttribute('data-urg');
    if (u === activeUrg) {
      btn.classList.add('active');
      btn.style.background = '#1a1a1a';
      btn.style.borderColor = 'transparent';
    } else {
      btn.classList.remove('active');
      btn.style.background = 'transparent';
      btn.style.borderColor = 'var(--pill-border)';
    }
  });
}

function setCat(cat) {
  activeCat = cat;
  activeSrc = null;
  render();
}
function setUrg(urg) {
  activeUrg = urg;
  activeSrc = null;
  render();
}
function filterBySrc(name) {
  activeSrc = name;
  activeCat = "all";
  activeUrg = "all";
  render();
  setTimeout(function() {
    document.querySelectorAll('.card').forEach(function(c) {
      if (c.style.display !== 'none') c.classList.add('open');
    });
  }, 0);
}

function cardHtml(item) {
  const color = catColor(item.cat);
  const urg = URGENCY_META[item.urgency] || { emoji: "", label: "" };
  const chartFlag = item.charts && item.charts.count > 0 ? (item.charts.hot ? '🔥' : '📊') : '';
  let html = '<div class="card" id="card-' + item.id + '">';
  html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
  html += '<span class="idx">#' + item.id + '</span>';
  html += '<span class="urgency-emoji">' + urg.emoji + '</span>';
  html += '<span class="badge" style="background:' + color + '">' + item.source + '</span>';
  html += '<span class="cat-pill">' + item.cat + '</span>';
  if (chartFlag) html += '<span class="chart-flag">' + chartFlag + '</span>';
  html += '<span class="card-title">' + item.title + '</span>';
  html += '<span class="chevron">▶</span>';
  html += '</div>';

  html += '<div class="card-body">';
  html += '<div class="block-label">The Idea</div>';
  html += '<div class="idea-text">' + item.idea + '</div>';
  html += '<div class="block-label">My Angle</div>';
  html += '<div class="angle-box" style="border-left:3px solid ' + color + '; background:' + color + '14;">' + item.angle + '</div>';
  html += '<div class="tweets">';
  html += '<div class="tweet-box a"><div class="tweet-label a">TWEET A</div><div class="tweet-body">' + item.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  html += '<div class="tweet-box b"><div class="tweet-label b">TWEET B</div><div class="tweet-body">' + item.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
  html += '</div>';
  if (item.charts && item.charts.count > 0) {
    html += '<div class="chart-box' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '🔥 ' : '📊 ') + item.charts.desc + '</div>';
  }
  html += '<div class="link-row"><a href="' + item.link + '" target="_blank" rel="noopener">↗ Read full article</a></div>';
  html += '</div></div>';
  return html;
}

function toggleCard(id) {
  const card = document.getElementById('card-' + id);
  if (card) card.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function render() {
  applyPillStyles();
  const filtered = ITEMS.filter(function(i) {
    if (activeSrc && i.source.indexOf(activeSrc) === -1) return false;
    if (activeCat !== 'all' && i.cat !== activeCat) return false;
    if (activeUrg !== 'all' && i.urgency !== activeUrg) return false;
    return true;
  });
  const cardsWrap = document.getElementById('cards');
  const empty = document.getElementById('emptyState');
  if (filtered.length === 0) {
    cardsWrap.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    cardsWrap.innerHTML = filtered.map(cardHtml).join('');
  }
}

function buildReport() {
  const el = document.getElementById('reportBody');
  let html = '<p><strong>Window:</strong> ' + META.windowStart + ' to ' + META.windowEnd + '. Emails outside this window were not processed.</p>';
  html += '<p><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp; <strong>Emails read:</strong> ' + META.emailsRead + ' &nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</p>';
  html += '<p><strong>Included sources:</strong></p><ul>';
  META.includedSources.forEach(function(s) {
    html += '<li><span class="src-item" onclick="filterBySrc(\'' + s.name.replace(/'/g, "\\'") + '\')">' + s.name + '</span> — ' + s.count + ' item' + (s.count === 1 ? '' : 's') + '</li>';
  });
  html += '</ul>';
  html += '<p><strong>Skipped sources:</strong></p><ul>';
  META.skippedSources.forEach(function(s) {
    html += '<li>' + s.name + ' — ' + s.reason + '</li>';
  });
  html += '</ul>';
  el.innerHTML = html;
}

function init() {
  document.getElementById('headerMeta').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources';
  buildFilters();
  render();
  buildReport();
}
init();
</script>
