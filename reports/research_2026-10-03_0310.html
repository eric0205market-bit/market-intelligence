<script>
const ITEMS = [{"id": 1, "cat": "AI/infra", "urgency": "deep", "source": "Epoch AI / Gradient Updates", "title": "Compute built through 2027 runs 140–700M frontier agents — more labor-hours than all US knowledge workers", "idea": "Using projected HBM shipments 2025–27, Epoch converts GB300-equivalent GPUs into concurrent agents (one continuously running Claude Code/Codex-class session). Output: tens to hundreds of millions of agents, equal to 140M–700M full-time employees of weekly hours running nonstop. The US has ~100M knowledge workers.", "angle": "HBM is the binding constraint, so the labor-supply story is really a memory story. Maps to MU/SK Hynix/Samsung as the 'labor supply' of the AI economy.", "tweetA": "The US has ~100M knowledge workers. The HBM already scheduled to ship through 2027 can run 140-700M frontier agents around the clock. Labor supply is being set by Samsung and SK Hynix's fab schedule, not by immigration policy. $MU $NVDA", "tweetB": "Nobody models what 'nonstop' does to the comparison. An agent doesn't take weekends, so 140M agents is not 140M people, it is ~3x that in hours. The Fed is debating a breakeven payroll of zero while the compute roadmap adds a workforce larger than the country's.", "charts": {"count": 0, "hot": false, "desc": "No charts in email; full report on Epoch site likely has hardware-supply charts - worth opening"}, "link": "https://epochai.substack.com/p/hundreds-of-millions-of-ai-agents"}, {"id": 2, "cat": "AI/infra", "urgency": "deep", "source": "Epoch AI / Gradient Updates", "title": "Efficient models turn the same hardware into ~1.9B concurrent agents — 8 billion worker-equivalents", "idea": "Applying DeepSeek V4 Pro serving benchmarks to projected hardware supply gives ~1.9B concurrent agents under the central assumption, matching the working hours of 8B full-time workers. That is roughly the entire global working-age population. Epoch notes this counts hours only; agents also run faster than humans, with variable quality.", "angle": "The cheap-model branch is the deflationary one: the same silicon yields 10x the agents if the model is efficient. Open-weight Chinese models set the price floor for the whole stack.", "tweetA": "Same GPUs, two answers: 140-700M agents on frontier models, 1.9B on DeepSeek V4 Pro. A 3-13x spread from model efficiency alone. The chip bulls and the open-weights bulls are not looking at the same denominator. $NVDA", "tweetB": "8 billion worker-equivalents of labor on hardware that exists on paper today. Whatever the wage for a unit of cognitive work is in 2028, it is not today's wage. Which asset class has priced that?", "charts": {"count": 0, "hot": false, "desc": "None in email"}, "link": "https://epochai.substack.com/p/hundreds-of-millions-of-ai-agents"}, {"id": 3, "cat": "AI/infra", "urgency": "deep", "source": "Epoch AI / Gradient Updates", "title": "If only 20% of compute earns API-price revenue, the buildout implies $2.6–5.3T annual revenue vs ~$1T trajectory", "idea": "Leading labs are growing ~5x a year; extrapolated, annualized revenue hits roughly $1T by end-2027. Epoch's supply-side math, assuming only 20% of compute serves paid inference at current API prices, implies $2.6–5.3T. Their key uncertainty: demand growth vs a glut of agents.", "angle": "The supply/demand gap is the whole bear case in one line: builders are underwriting 2.5-5x the revenue the already-heroic trend delivers. A glut means falling per-token prices, which hits ROIC but helps adopters.", "tweetA": "Labs compounding 5x a year get to ~$1T by end of 2027. The hardware being built is sized for $2.6-5.3T. Either revenue growth accelerates again, or token prices fall 60-80% to clear the market. Pick one, then look at the credit spreads on the financing.", "tweetB": "Everyone asks whether AI demand is real. Epoch asks the better question: is supply sized for demand? The answer to 'both can be true' is a price collapse that makes every user happy and every lender nervous. $ORCL", "charts": {"count": 0, "hot": false, "desc": "None in email"}, "link": "https://epochai.substack.com/p/hundreds-of-millions-of-ai-agents"}, {"id": 4, "cat": "AI/infra", "urgency": "watch", "source": "This Week in AI", "title": "MiniMax M3.1 Flash: China's 'Flash' tier model is being pitched for everyday coding, five reasoning levels", "idea": "MiniMax released M3.1 Flash Preview on Sept 27, pitched as a coding model for 'everyday' dev work (bug fixes, features) with five reasoning settings from low to max. The issue's hook: a zombie shooter built by a budget model. Every major lab now ships a Flash tier offering near-frontier capability at a fraction of the cost.", "angle": "Flash tiers are the commoditization layer. The question for premium-model margins is how much of daily work migrates down a tier. Watch pricing per task, not per token.", "tweetA": "Every major lab now has a 'Flash' tier, and a Chinese lab's version is being used to build games this week. The expensive model is becoming the exception you escalate to, not the default. That is a very different TAM shape for frontier APIs.", "tweetB": "Five reasoning settings, one model. The pricing unit is quietly shifting from tokens to 'effort'. If the buyer picks effort level per task, gross margin becomes a function of how often they pick 'low'.", "charts": {"count": 0, "hot": false, "desc": "None; article has demo of generated game - worth opening"}, "link": "https://www.thisweekinai.ai/p/check-out-a-zombie-shooter-built"}, {"id": 5, "cat": "AI/infra", "urgency": "now", "source": "Bespoke Investment Group", "title": "NVDA hit an all-time intraday high after a 96-day streak without a record close — third longest since ChatGPT", "idea": "Since its last high, the S&P is up ~3% and SOX ~10%, so NVDA lagged. The 96-day streak is third-longest since Nov 2022 (others: 120 days ending April 2026, 115 ending June 2025). After the June 2025 break it ran another 34% over five months; after April 2026 it gained just 12% more in three weeks before reversing.", "angle": "The two precedents give opposite answers (+34% vs +12% then pullback), so the streak itself is not a signal. Bespoke's better point: NVDA has led SOX on the way up and down this year, so it may be an early signal for semis.", "tweetA": "96 trading days without a record close, then a new high. Last two times: +34% over five months, and +12% over three weeks before it rolled over. Same setup, opposite outcomes. The tell is whether SOX confirms, because NVDA led on the way up AND the way down this year. $NVDA $SOXX", "tweetB": "NVDA lagged SOX by 7 points over four months while being 'the AI trade'. Leadership rotated to memory and optics and the index never noticed. A new high in NVDA after a laggard stretch is a different animal than a new high at the top of a melt-up. $LITE $MU", "charts": {"count": 2, "hot": true, "desc": "Two charts: NVDA 2-year price with red dots where the 115- and 120-day streaks ended; NVDA vs SOX YTD showing NVDA leading turns. Charts inside - worth opening"}, "link": "https://bespokeinvest.substack.com/p/nvidia-gets-its-leather-jacket-back"}, {"id": 6, "cat": "macro", "urgency": "deep", "source": "McKinsey & Company", "title": "McKinsey executive survey: economic pessimism has eased since June but negatives still outnumber positives", "idea": "The September 2026 Economic Conditions Outlook says executives' pessimism has eased since June, though negative views remain more common than positive and expectations for the next six months are mixed. Email carries only the summary; the full survey is on the site.", "angle": "Soft-sentiment datapoint that fits a 'weak but not breaking' narrative while oil is above $100. Useful as a counterweight to hard-data signals.", "tweetA": "Executives are less gloomy than in June, but still net negative on the economy. CEO sentiment improving while Brent sits above $100 and the 10-year is at 5%. Either they know something, or they are anchoring on equity prices.", "tweetB": "Surveys of executives lag. They got less pessimistic as the Nasdaq made new highs. I would rather watch what they do with capex than what they tell McKinsey.", "charts": {"count": 0, "hot": false, "desc": "Charts inside the full survey - worth opening"}, "link": "https://www.mckinsey.com/capabilities/strategy-and-corporate-finance/our-insights/economic-conditions-outlook"}, {"id": 7, "cat": "energy", "urgency": "deep", "source": "Commodity Context / Oil Context Weekly (W40)", "title": "US diesel crack spiked to ~$125 and ~$228/bbl flat on expiry-day squeeze, then fell below $90 crack", "idea": "US diesel hit all-time intraday highs (~$125 crack vs Brent, ~$228/bbl flat price) in a contract-expiry squeeze, then pulled back to below a $90 crack as policy headlines (trade restrictions, SPR releases) hit. Brent flat price slipped ~$1.50 but prompt stayed over $100. Front-curve timespreads shed roughly half their backwardation from Monday's high, yet all curves still show crisis-level backwardation.", "angle": "The problem is products, not crude. A $125 crack means refiners print money while policy intervenes. A squeeze at expiry shows how thin prompt diesel is.", "tweetA": "A $125 diesel crack and $228/bbl flat price printed on an expiry squeeze, then $35 of crack vanished in days on SPR headlines. That is not a market clearing; that is a market where a policy tweet moves a crack more than a refinery does. $VLO $MPC $PSX", "tweetB": "Brent fell $1.50 and still held $100. Timespreads gave back half their backwardation and are STILL at crisis levels. Anyone calling the top in energy off a one-week pullback should look at the shape of the curve, not the flat price.", "charts": {"count": 1, "hot": true, "desc": "Free chart in the web post (flat price/spreads); paid deck is behind paywall - charts inside, worth opening"}, "link": "https://www.commoditycontext.com/p/ocw40w26"}, {"id": 8, "cat": "energy", "urgency": "deep", "source": "Commodity Context / Oil Context Weekly (W40)", "title": "Specs sold crude while price rose $4-5 — physical overpowering paper; Hormuz transit data fuels 'did Iran lose control' debate", "idea": "Speculators were net sellers through Tuesday, driven by lower gross length, while prices climbed ~$4-5/bbl, which the author reads as bullish: physical pull beats paper. Tanker-tracking data shows Hormuz transits rising notably over the past month, sparking controversy over whether Iran has 'lost control' of the Strait; the author flags a 'very probable pullback' in the Middle East flow context. Also: European nations announced a diesel-heavy SPR release and East-West pipeline flows are accelerating faster than expected.", "angle": "A price rally against de-risking positioning means less fuel for a squeeze-reversal. But the flow-recovery thesis is contested and sits at the center of the downside risk.", "tweetA": "Specs cut crude length while the price went up $4-5. That is the opposite of a crowded trade. The bear case rests entirely on Hormuz transit data that the author himself expects to roll over.", "tweetB": "One side reads rising Hormuz transits as the crisis ending. The other reads the same tracker data as unreliable. When the whole oil thesis depends on whether a tracking dataset is right, position size should reflect that.", "charts": {"count": 0, "hot": false, "desc": "Positioning deck is paid; charts inside - worth opening"}, "link": "https://www.commoditycontext.com/p/ocw40w26"}, {"id": 9, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / The Weekender", "title": "September payrolls +29k vs ~84k expected; October hike odds fell from ~75% to the mid-teens", "idea": "Unemployment edged up to 4.2%, prior two months were revised lower, wage growth cooled. A week earlier futures priced nearly three-in-four odds of another hike; by Friday that was mid-teens, after Williams and Jefferson leaned toward patience. December remains heavily priced, so the change is timing, not direction. The Nasdaq 100 hit a record and the S&P gained 0.7%.", "angle": "Bad news is good news again because the market trades the Fed first. A 60-point collapse in hike odds in a week is a big vol-surface event.", "tweetA": "Odds of an October hike went from ~75% to mid-teens in five days, and the Nasdaq 100 printed a record on a 29k payroll. When a central bank is hiking, a weak jobs print is not a pivot, it is a delay. December is still priced.", "tweetB": "29k vs 84k expected, and equities rallied. In a hiking cycle the market buys the miss; in a recession it sells it. The fact we cannot tell which regime we are in is the signal.", "charts": {"count": 0, "hot": false, "desc": "None in email; chartbook-style charts likely in web version"}, "link": "https://thedarksideoftheboom.substack.com/p/the-weekender-ai-keeps-the-index"}, {"id": 10, "cat": "labor", "urgency": "deep", "source": "Dark Side of the Boom (quoting Torsten Slok)", "title": "Breakeven payroll growth has collapsed from 200k/month to near zero — a 'weak' print may be solid", "idea": "Slok: breakeven job growth fell from 200,000 to close to zero due to a sharp drop in immigration shrinking labor force growth plus boomer retirements. So consensus of 90k was not soft but solid, consistent with a falling unemployment rate. Bottom line: rates stay higher for longer.", "angle": "Immigration policy is a monetary-policy variable. If breakeven is 0, then +29k is still positive and the unemployment rate rising 0.1 is the real weak signal.", "tweetA": "Breakeven payrolls went from 200k to ~0. The 'miss' is relative to a number nobody has a good estimate of. Immigration policy is now the biggest swing factor in the Fed's reaction function and it isn't in any dot plot.", "tweetB": "If breakeven is zero, a 3-month trend of +51k is expansionary, and unemployment ticking up to 4.2% is the signal that matters. Which of those two datapoints do you believe? Because the Fed has to pick one.", "charts": {"count": 1, "hot": false, "desc": "Related Ernie Tedeschi breakeven chart is in Daily Chartbook (see item below)"}, "link": "https://thedarksideoftheboom.substack.com/p/the-weekender-ai-keeps-the-index"}, {"id": 11, "cat": "credit", "urgency": "deep", "source": "Dark Side of the Boom / The Weekender", "title": "HY spreads +39bp to ~312bp, CCC through 1,000bp for the first time since 2023 — Oracle shows equity and credit disagreeing", "idea": "High yield widened ~39bp on the week to around 312bp; IG also loosened; CCC spreads pushed past 1,000bp for the first time since the March 2023 regional banking scare. Equities price Oracle's AI earnings stream; credit prices the leverage, project finance and capex funding bill that grows with every move in Treasury yields.", "angle": "Credit is the pressure gauge while equity makes highs. HY at 312 is not crisis, but CCC > 1,000 with tight index spreads says dispersion is the story. AI-infra financing is the transmission.", "tweetA": "CCC spreads just crossed 1,000bp for the first time since the 2023 bank scare, while the Nasdaq 100 printed a record. Equity is pricing Oracle's revenue; credit is pricing Oracle's funding cost. Same balance sheet, two prices. One is wrong. $ORCL $HYG", "tweetB": "HY +39bp in a week with equities at highs. In 2023 CCCs blew out and the S&P still rallied, so this is not a sell signal by itself. The difference now is that the stressed borrowers are building the thing the equity market is paying for.", "charts": {"count": 0, "hot": false, "desc": "None in email"}, "link": "https://thedarksideoftheboom.substack.com/p/the-weekender-ai-keeps-the-index"}, {"id": 12, "cat": "AI/infra", "urgency": "deep", "source": "Dark Side of the Boom (citing Goldman Sachs)", "title": "GS: hyperscaler debt issuance to hit $420bn in 2027 — and interest expense is a tiny share of earnings", "idea": "Goldman expects hyperscaler debt issuance to surge to $420bn in 2027, yet interest expense remains a very small part of hyperscaler earnings, so higher yields haven't derailed the capex machine. The author's take: the cycle hasn't needed lower rates, but tech multiples certainly would benefit if yields fall.", "angle": "The capex cycle is rate-insensitive for the cash-rich, rate-sensitive for the levered (Oracle, neoclouds). Splits the AI complex into two credit regimes.", "tweetA": "$420bn of hyperscaler bonds in 2027 and the interest line still rounds to nothing against earnings. The capex cycle doesn't need lower rates. The multiple does. Different assets, different duration. $MSFT $META $GOOGL", "tweetB": "At a 5% 10-year, the AI buildout is financed by companies whose interest cost is trivial relative to cash flow, and by others for whom it is the whole story. The Oracle credit spread is what the second group looks like.", "charts": {"count": 0, "hot": false, "desc": "None in email"}, "link": "https://thedarksideoftheboom.substack.com/p/the-weekender-ai-keeps-the-index"}, {"id": 13, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / The Weekender", "title": "France 10Y OAT toward 4.9%, spread >140bp over Bunds; Italy BTPs start to catch the infection; dollar up 3 straight weeks", "idea": "OAT yields pushed toward 4.9% with spreads through 140bp, and BTPs began widening, turning a French problem into European sovereign risk. The ECB faces inflation saying tighten and fiscal stress saying be careful. The euro was hammered, the dollar rose a third straight week breaking its 18-month range, USD/JPY stalled near 158.", "angle": "A 5% UST plus a rising USD is a global tightening no central bank voted for. Europe is exporting stress via FX.", "tweetA": "France at 4.9% and 140bp over Bunds, with Italy now following. When the ECB can't carry the whole tightening load, the currency gets drafted. The dollar broke an 18-month range for a reason. $EURUSD $FXE", "tweetB": "The 10-year UST at 5%, USD breaking out, Brent at $100. Three tightening forces and none of them is a central bank decision. EM and anyone short USD funding gets the bill.", "charts": {"count": 0, "hot": false, "desc": "None in email"}, "link": "https://thedarksideoftheboom.substack.com/p/the-weekender-ai-keeps-the-index"}, {"id": 14, "cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom / The Weekender", "title": "Flows: bought equities, bonds and metals, sold HY and energy, pulled >$100bn from money market funds", "idea": "Investors bought global equities, government bonds and precious metals, pulled money from high yield, sold energy funds, and withdrew more than $100bn from money markets. The author reads this as capital being repriced across several directions, not a risk-on/off decision, with the 'murky middle' of leveraged, refinancing-exposed credits being avoided.", "angle": "$100bn+ leaving money funds in a week is a big liquidity release. The sold-energy-funds line contrasts with the $100 Brent print.", "tweetA": "$100bn out of money market funds in a week, and it did not go to one place: equities, bonds, gold all got bids while HY and energy got sold. Nobody is making a macro call. They're barbelling around the middle where the leverage is. $SPY $TLT $GLD", "tweetB": "Energy funds were sold into a week where Brent held above $100 and diesel cracked $125. Positioning is leaning against the physical market, which is exactly what a bullish positioning print in the oil newsletter describes.", "charts": {"count": 0, "hot": false, "desc": "None in email"}, "link": "https://thedarksideoftheboom.substack.com/p/the-weekender-ai-keeps-the-index"}, {"id": 15, "cat": "gold", "urgency": "deep", "source": "Dark Side of the Boom / The Weekender", "title": "Gold stuck below $4,200 as real yields climb; BTC reached $87k then gave it back", "idea": "Gold briefly jumped after payrolls then slid back toward the week's lows, with $4,200 the line bulls can't reclaim; physical buyers absorb dips but rising real yields cap it. Bitcoin pushed through $85k and above $87k before surrendering much of it as real yields climbed again.", "angle": "Both are trading as real-yield duration proxies right now. The relationship matters more than levels. Gold failing at a 5% UST is consistent with that.", "tweetA": "Gold and BTC both rallied on the payroll miss and both sold back as real yields rose. Different stories, same factor. If the 10-year keeps 5% as a floor, neither catches a durable bid. $GLD $BTC", "tweetB": "Physical buyers are absorbing every dip in gold while the paper price fails at $4,200. Eventually one of those two gives. I know which one I'd bet on, but not what month.", "charts": {"count": 0, "hot": false, "desc": "None in email"}, "link": "https://thedarksideoftheboom.substack.com/p/the-weekender-ai-keeps-the-index"}, {"id": 16, "cat": "energy", "urgency": "deep", "source": "Dark Side of the Boom / The Weekender", "title": "China curbs fuel exports (ex-HK/Macau); G7 moves to emergency stock releases; diesel is the real-economy pinch point", "idea": "China restricting fuel exports outside Hong Kong and Macau tightened an already-stretched diesel market, while the G7 pushed toward emergency stock releases. The author notes SPR is a bridge, not an oilfield, and that physical flows are adapting via alternative routes and STS transfers, with the premium shifting to freight, insurance and security cost.", "angle": "China is a net exporter of diesel into the shortage; a curb removes marginal supply. The risk premium has migrated from 'does the barrel exist' to 'what does it cost to move'.", "tweetA": "China just stopped exporting fuel to everyone except HK and Macau. In a diesel shortage. That is a beggar-thy-neighbor move and the G7 answer is to burn reserves. The premium isn't on the barrel anymore, it is on getting the barrel from A to B.", "tweetB": "Strategic reserves are a bridge, not an oilfield. Every barrel released now is a barrel someone has to buy back at a time of their choosing, and governments know it. Look at the back of the curve.", "charts": {"count": 0, "hot": false, "desc": "None in email"}, "link": "https://thedarksideoftheboom.substack.com/p/the-weekender-ai-keeps-the-index"}, {"id": 17, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom / The Weekender", "title": "Fewer than half of S&P 500 stocks above their 200-day while the Nasdaq 100 hits records", "idea": "Fewer than half of S&P 500 members trade above their 200-day moving averages, equal-weighted indices lag badly, and new lows outnumber new highs beneath an index near record. Financials struggle while tech does the heavy lifting. The 5% Treasury is the new hurdle rate for stretched valuations.", "angle": "The median stock is in a different market than the cap-weighted index. Fits with the equal-weight S&P 7th straight weekly decline noted in Chartbook.", "tweetA": "Less than half the S&P is above its 200-day. The index is at a record. That is a one-factor market: AI. When one factor carries the benchmark, the risk is not a broad selloff, it's that factor's funding cost. $SPY $RSP", "tweetB": "Equal-weight S&P on track for a seventh straight weekly decline while Nvidia prints highs. Breadth divergence has been 'a warning' for three years. The 5% hurdle rate is what makes it matter this time.", "charts": {"count": 0, "hot": false, "desc": "None in email"}, "link": "https://thedarksideoftheboom.substack.com/p/the-weekender-ai-keeps-the-index"}, {"id": 18, "cat": "regulation", "urgency": "now", "source": "The Pressure Point (Fulcrum)", "title": "Jay Clayton expected as White House AI czar — an enforcer for an AI accord with no formal enforcement", "idea": "Axios/WSJ report DNI Jay Clayton is expected as AI czar, possibly keeping the DNI job. The 'morally binding' voluntary accord (Meta, Nvidia, Palantir, OpenAI, Anthropic at the lunch; Apple absent) names no sanctions, inspection authority or adjudication process; Speaker Johnson promised 'consequences' without specifics. The analyst's line: when compliance is voluntary, proximity becomes the penalty schedule. Clayton has called superintelligence a national-security issue, pulling AI safety toward closed briefings and trusted-company channels.", "angle": "Regulation by access. Apple's absence is the interesting tell. Procurement, export and access are the enforcement levers.", "tweetA": "The AI accord has no penalties, no inspectors, no appeals process. It has a guest list. Apple wasn't on it. When compliance is voluntary, access to the White House is the enforcement mechanism, and that makes membership a priced asset. $AAPL $NVDA $PLTR", "tweetB": "Putting an intelligence chief over AI policy reframes frontier models as strategic assets, not consumer products. Watch whether he can direct agencies. If yes, expect closed-door standards that favor incumbents who can afford to be in the room.", "charts": {"count": 0, "hot": false, "desc": "None"}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-compliance-has-a-guest-list/"}, {"id": 19, "cat": "credit", "urgency": "deep", "source": "The Pressure Point (Fulcrum) - Things Happen", "title": "Blue Owl flagship private-credit fund withdrawal requests slowed in Q3; redemption pressure easing industry-wide", "idea": "Withdrawal requests at Blue Owl's flagship private-credit fund slowed further in the third quarter as redemption pressure eased across the industry.", "angle": "Private-credit redemption stress easing while public CCC spreads breach 1,000bp: divergence between marked-to-model and marked-to-market credit.", "tweetA": "Blue Owl redemption requests are slowing while CCC spreads in public markets just blew through 1,000bp. Private credit looks calmer because it is marked less often, not because it is safer. $OWL", "tweetB": "Redemption queues easing is the good news. The public CCC market is the leading indicator for what private marks should be. Gap between the two is the trade.", "charts": {"count": 0, "hot": false, "desc": "None"}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-compliance-has-a-guest-list/"}, {"id": 20, "cat": "geopolitics", "urgency": "now", "source": "The Pressure Point (Fulcrum) - Things Happen", "title": "Trump says Europe agreed to release large diesel supplies after US pressure, ahead of November midterms", "idea": "Trump said Europe agreed to release large diesel supplies after U.S. pressure to ease high prices before November's midterm elections (Bloomberg). Also: a federal judge halted border-barrier construction near Big Bend National Park.", "angle": "Energy policy driven by the election calendar: SPR and stock releases are a political tool timed to the midterms. Pair with Oil Context's diesel-heavy SPR note.", "tweetA": "Diesel prices are now a midterm variable. The US asked Europe to release stocks, Europe did, and the G7 is draining reserves into an election. Great for the crack spread in November, terrible for the one in January. $VLO", "tweetB": "Stock releases lower the price in the month that matters politically and raise the replacement bid later. That is a calendar trade nobody is selling.", "charts": {"count": 0, "hot": false, "desc": "None"}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-compliance-has-a-guest-list/"}, {"id": 21, "cat": "AI/infra", "urgency": "now", "source": "BEP Research / Ben Pouladian (subscriber chat)", "title": "NVDA and Lumentum hit new ATHs; next: 3-part CPU/agent-era series and what 800V DC means for data centers", "idea": "Pouladian notes NVIDIA and Lumentum hit new intraday all-time highs Friday, sees momentum returning, and views the White House Accord on Super Intelligence as a positive. He says OpenAI's 'dot' device lets him do nearly everything by voice, with speed the standout. Upcoming: a three-part series on CPUs and the agent era, and a look at the move to 800V DC in data centers.", "angle": "CPUs for agents and 800V DC power are the two infrastructure themes to track next. Lumentum at an ATH alongside NVDA confirms optics participation.", "tweetA": "NVDA and LITE both at all-time highs on the same day. Optics is not lagging this cycle. The next bottleneck: CPUs for agent orchestration and 800V DC power distribution. $NVDA $LITE", "tweetB": "Agents are CPU-heavy, not just GPU-heavy: tool calls, sandboxes, orchestration. If that's right, the CPU share of AI capex is underappreciated. And 800V DC is a quiet rebuild of the power chain from grid to rack.", "charts": {"count": 0, "hot": false, "desc": "None"}, "link": "https://newsletter.bepresearch.com/"}, {"id": 22, "cat": "positioning", "urgency": "deep", "source": "Daily Chartbook (DC Lite #696)", "title": "Russell 2000 short interest at the 99.8th percentile (JPMorgan)", "idea": "Short interest as a percent of shares outstanding in the Russell 2000 has risen to the 99.8th percentile of history, per JPMorgan via @blakemillardcfa.", "angle": "Maximum short in small caps plus a rate-sensitive sector washout is a squeeze set-up if yields roll over. Needs a catalyst.", "tweetA": "Russell 2000 short interest at the 99.8th percentile. Rate-sensitive sectors the most oversold in five years. The 10-year at 5% already did its damage; the whole position is a bet it doesn't go to 6%. $IWM", "tweetB": "Extreme shorts don't cover on their own. They cover on a catalyst, and the only one that matters here is a weak jobs print that the Fed treats as a reason to stop. Friday gave a preview.", "charts": {"count": 1, "hot": true, "desc": "R2K short interest percentile chart 🔥 CHART WORTH SAVING"}, "link": "https://www.dailychartbook.com/p/the-energy-sector-has-never-mattered-more-for-stock-market-returns-8fe4"}, {"id": 23, "cat": "macro", "urgency": "deep", "source": "Daily Chartbook (DC Lite #696)", "title": "Rate-sensitive sectors are the most oversold in five years (Real Investment Advice)", "idea": "'Interest rate-sensitive sectors are now the most oversold they have been in five years,' from a Real Investment Advice post titled 'Can Anthropic out-earn its obligations?'.", "angle": "Combine with 10Y at 5% and equal-weight S&P down seven weeks: capitulation vs value trap.", "tweetA": "Rate-sensitive sectors: most oversold in five years. Equal-weight S&P: seven straight weekly declines. Either this is capitulation, or the market is correctly pricing a 5% hurdle rate. Where yields go next decides which. $XLU $XLRE $XHB", "tweetB": "Most oversold in five years and still no rally, because the cause hasn't reversed. Oversold only matters when the driver does.", "charts": {"count": 1, "hot": false, "desc": "Oversold rate-sensitive sectors chart"}, "link": "https://www.dailychartbook.com/p/the-energy-sector-has-never-mattered-more-for-stock-market-returns-8fe4"}, {"id": 24, "cat": "energy", "urgency": "now", "source": "Daily Chartbook (via @_rob_anderson)", "title": "S&P 500 lost 5.5% on Energy-up days and gained 21.3% on Energy-down days over the past year — both records", "idea": "Over the last 252 days the S&P 500 lost 5.5% on days when Energy was up (record low) and gained 21.3% on Energy-down days (record high). The headline: the Energy sector has never mattered more for stock market returns.", "angle": "Oil as the master macro variable for equities: the market's sign on oil is cleanly negative. The corollary: a hawkish oil shock is the equity risk.", "tweetA": "The S&P is down 5.5% on energy-up days and up 21.3% on energy-down days, both records. Equities are trading Brent's sign. So the 'Iran deal' headlines moving oil down are what is holding the index up. $XLE $SPY", "tweetB": "Energy up days = S&P down days at a record rate. That's the inflation-to-rates channel in one stat. A flare-up in Hormuz is not just an energy trade, it's the equity trade.", "charts": {"count": 1, "hot": true, "desc": "S&P returns on Energy up vs down days 🔥 CHART WORTH SAVING"}, "link": "https://www.dailychartbook.com/p/the-energy-sector-has-never-mattered-more-for-stock-market-returns-8fe4"}, {"id": 25, "cat": "macro", "urgency": "deep", "source": "Daily Chartbook (via @ernietedeschi)", "title": "Breakeven payroll growth is functionally 0 so a +51K 3-month trend is slightly expansionary", "idea": "Ernie Tedeschi: breakeven payroll growth, the growth needed to hold unemployment unchanged, is functionally 0, so a +51K three-month trend is slightly expansionary.", "angle": "Second source on the breakeven story alongside Slok. Puts a 3-month number on it.", "tweetA": "Breakeven payrolls are ~0, so a 51k three-month trend is expansionary. The jobs market isn't weakening, the labor supply is shrinking. A hawkish Fed gets to keep hiking with a straight face.", "tweetB": "If breakeven is zero, the labor market can't produce a recessionary payroll print without negative numbers. Watch the unemployment rate, not payrolls.", "charts": {"count": 1, "hot": false, "desc": "Breakeven employment chart"}, "link": "https://www.dailychartbook.com/p/the-energy-sector-has-never-mattered-more-for-stock-market-returns-8fe4"}, {"id": 26, "cat": "macro", "urgency": "deep", "source": "Daily Chartbook (Bloomberg / FAO)", "title": "FAO Food Price Index at its highest since November 2022 on geopolitical and weather disruption", "idea": "Global food prices extended gains in September, reaching the highest since November 2022 as mounting geopolitical and weather disruptions roil the farm sector (Bloomberg's Eleanor Thornber).", "angle": "Food plus diesel plus 5% yields: a stagflationary stack that hits EM importers. Fertilizer and diesel feed straight into next year's crop costs.", "tweetA": "FAO food index at the highest since late 2022 while diesel is short and the dollar is breaking out. The EM importer squeeze is three shocks deep: food, fuel, funding. $MOO $DBA", "tweetB": "November 2022 was the last time food prices were here, and that cycle ended with central banks still hiking. Food inflation lags energy by a few months. We're about to see what the lag does.", "charts": {"count": 1, "hot": false, "desc": "FAO Food Price Index chart"}, "link": "https://www.dailychartbook.com/p/the-energy-sector-has-never-mattered-more-for-stock-market-returns-8fe4"}, {"id": 27, "cat": "positioning", "urgency": "deep", "source": "Daily Chartbook ICYMI", "title": "AAII stock allocation highest since Dec 2017; equal-weight S&P 7th weekly decline; 10Y at 6% implies a 16x P/E", "idea": "Linked headlines: AAII allocation to stocks is the highest since December 2017; the equal-weight S&P 500 is on track for a 7th consecutive weekly decline; and 'if the 10-year yield rises to 6%, that suggests an equity P/E of 16x.'", "angle": "Retail max-long while the median stock bleeds and the 10Y sits at 5%. The 6%/16x framing sets a downside anchor.", "tweetA": "Retail allocation to stocks is the highest since 2017. The equal-weight index has fallen seven straight weeks. And someone just mapped 6% on the 10-year to a 16x multiple. Positioning is max long into a hurdle rate that is still rising.", "tweetB": "AAII at a 2017 high and equal-weight down seven weeks means the AI-index trade is carrying sentiment on its own back. If the 16x math is right, 5% to 6% is a roughly 20% de-rating.", "charts": {"count": 0, "hot": false, "desc": "Charts in linked posts - worth opening"}, "link": "https://www.dailychartbook.com/p/aaii-allocation-to-stocks-rose-to-the-highest-since-december-2017-2506"}];
const META = {"date": "2026-10-03", "time": "03:10 CEST", "windowStart": "2026-10-02 21:10 CEST", "windowEnd": "2026-10-03 03:10 CEST", "emailsInWindow": 10, "emailsRead": 10, "itemsExtracted": 27, "includedSources": ["Epoch AI / Gradient Updates (3)", "This Week in AI (1)", "Bespoke Investment Group (1)", "McKinsey & Company (1)", "Commodity Context / Oil Context Weekly (2)", "Dark Side of the Boom / The Weekender (9)", "The Pressure Point (Fulcrum) (3)", "BEP Research / Ben Pouladian (1)", "Daily Chartbook (6)"], "skippedSources": ["Topdown Charts (Callum Thomas) - pure subscription promotion, no analysis", "Pequity Research - Portfolio Update: body contained only a disclosure and greeting, no content"]};
var COL={macro:'#e24b4a',credit:'#378add',positioning:'#ef9f27','AI/infra':'#1d9e75',crypto:'#7f77dd',geopolitics:'#d85a30',energy:'#f97316',tech:'#06b6d4',gold:'#d4a017',culture:'#ec4899',labor:'#8b5cf6',regulation:'#64748b',science:'#14b8a6',venture:'#84cc16'};

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function card(item){
  var c=COL[item.cat]||'#888';

  var chd=item.charts.desc?'<div class="ch'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING · ':'')+(item.charts.count?item.charts.count+' chart(s): ':'')+esc(item.charts.desc)+'</div>':'';
  return '<div class="card" id="c'+item.id+'"><div class="hd" onclick="this.parentNode.classList.toggle(\'open\')"><span class="num">'+item.id+'</span><span>'+UE[item.urgency]+'</span><span class="badge" style="background:'+c+'">'+esc(item.source)+'</span><span class="tag">'+esc(item.cat)+'</span><span>'+ch+'</span><span class="ttl">'+esc(item.title)+'</span></div>'
  +'<div class="bd"><div class="lab">The Idea</div><div>'+esc(item.idea)+'</div><div class="lab">My Angle</div><div class="angle" style="border-color:'+c+';background:'+c+'14">'+esc(item.angle)+'</div>'
  +'<div class="tw"><div><div class="lab" style="color:#378add">Tweet A</div>'+esc(item.tweetA)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>'
  +'<div><div class="lab" style="color:#7f77dd">Tweet B</div>'+esc(item.tweetB)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>'
  +chd+'<div style="margin-top:10px"><a href="'+esc(item.link)+'" target="_blank">↗ Read full article</a></div></div></div>';
}
function render(){
  var h='';ITEMS.forEach(function(i){
    if(fc!=='All'&&i.cat!==fc)return;if(fu!=='All'&&i.urgency!==fu)return;if(fs&&i.source.indexOf(fs)<0)return;
    h+=card(i);});
  document.getElementById('list').innerHTML=h;

}
function bars(){
  var cats={};ITEMS.forEach(function(i){cats[i.cat]=(cats[i.cat]||0)+1;});

  document.getElementById('cats').innerHTML=h;
  var u=[['All','All'],['now','🔴 Act Now'],['deep','🔵 Deep'],['watch','🟡 Watch']];h='';
  u.forEach(function(p){var n=p[0]==='All'?ITEMS.length:ITEMS.filter(function(i){return i.urgency===p[0]}).length;var on=fu===p[0];
    h+='<span class="pill'+(on?' on':'')+'" style="'+(on?'background:#333':'')+'" onclick="setU(\''+p[0]+'\')">'+p[1]+' '+n+'</span>';});
  document.getElementById('urg').innerHTML=h;
}
function setC(k){fc=k;fs=null;bars();render();}
function setU(k){fu=k;fs=null;bars();render();}
function filterBySrc(name){fs=name;fc='All';fu='All';bars();render();}

  r+='</ul><p><b>Skipped</b></p><ul>';META.skippedSources.forEach(function(s){r+='<li>'+esc(s)+'</li>';});
  document.getElementById('repb').innerHTML=r+'</ul>';
  bars();render();
}
