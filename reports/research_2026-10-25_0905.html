t-running the recession that an energy shock causes. The Fed meanwhile is priced to hike in December. One of them is wrong, and it's usually not the curve.", "tweetB": "Everyone's arguing stagflation vs recession. The 10Y already voted. If claims and new orders turn, the December hike gets priced out in a day and the long end isn't where you want to be short.", "charts": {"count": 1, "hot": true, "desc": "10Y yield falling 40bps while Brent climbs: the divergence chart"}, "link": "https://robertsinn.substack.com/p/the-charts-of-the-week-10242026-fear", "id": 2}, {"cat": "macro", "urgency": "deep", "source": "Robert Sinn / The Charts of the Week", "title": "Stagflation and policy-error risk, not yet recession: Sinn wants claims and new orders to confirm", "idea": "Sinn lays out the chain: energy shock squeezes purchasing power, inflation keeps the Fed tightening, higher financing costs hit spending and capex. He calls it rising stagflation and policy-error risk rather than evidence that recession is inevitable, and adds the AI capex bubble as an extra risk. Needs rising unemployment claims and weaker new orders for confirmation.", "angle": "Useful checklist: claims and new orders are the two datapoints that flip the regime call.", "tweetA": "Recession checklist: energy shock, tightening Fed, AI capex bubble. Missing: claims and new orders. Two data prints away from the market deciding it already knew.", "tweetB": "'Policy error' is what we call a tightening cycle that meets an oil shock it didn't plan for. The Fed hiked into a supply shock once already this cycle. Warsh knows that, and so does the curve.", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://robertsinn.substack.com/p/the-charts-of-the-week-10242026-fear", "id": 3}, {"cat": "geopolitics", "urgency": "act", "source": "Robert Sinn / The Charts of the Week", "title": "Thursday's AI selloff was really about Middle East escalation fear, says Sinn", "idea": "Sinn argues the Thursday AI and semiconductor rout was amplified by oil and inflation worries, but the bigger catalyst is near-term fear of another Middle East escalation. His tell: crude and energy rising at the same time as stocks tumbling and yields crashing.", "angle": "Reframes the AI selloff as a risk-off day with an AI label, which changes how you buy it.", "tweetA": "Thursday wasn't an AI day, it was an Iran day that AI happened to be long. Check which assets rose: crude, energy, defensives. That's the tape telling you the real driver.", "tweetB": "When semis fall 5% and energy rises on the same session, you're not looking at valuation compression. You're looking at the market repricing the probability of a Hormuz event.", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://robertsinn.substack.com/p/the-charts-of-the-week-10242026-fear", "id": 4}, {"cat": "crypto", "urgency": "act", "source": "TMAD Crypto / Trading Mindset and Data", "title": "Bitcoin below $80k, weakest in a month, as US evacuates Middle East personnel on Iran attack intel", "idea": "TMAD reports BTC slipped under $80,000 for the first time in over a month over the weekend, dragging ETH, XRP and SOL, as the US reportedly evacuates personnel from the Middle East on fresh intelligence that Iran is preparing attacks on Americans, with renewed military threats from Trump. The Clarity Act is also stalled in the Senate. Newsletter also covers institutional buying and shorting levels on BTC/ETH.", "angle": "Weekend liquidity plus a headline-driven gap: crypto is the only market open to price the Iran news before Monday.", "tweetA": "Bitcoin is the only market open on a Sunday, so it's pricing the Iran evacuation story alone. $80k broke on weekend liquidity. The real test is where equities gap on Monday and whether BTC leads or lags.", "tweetB": "Clarity Act stalled, Middle East e ow the 10-year Treasury yield for the first time since the dot-com bust. Layer on sovereign stress in France and oil above $100 and the hurdle rate for equities looks different. The 10Y is back under 5%.", "angle": "Equity risk premium is gone while the 10Y is near 5%. Anything that pushes yields back up has no cushion.", "tweetA": "S&P earnings yield below the 10Y with the 10Y near 5%. The last time was 2000, and back then you could at least argue about the 5% being temporary.", "tweetB": "Zero equity risk premium is fine as long as nothing re-rates the discount rate. Oil at $100, a December hike at 80%, France wobbling. That's three things that can.", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-earnings-tsunami", "id": 7}, {"cat": "AI/infra", "urgency": "act", "source": "Dark Side of the Boom", "title": "Meta punished on capex, Lam Research 'owning AI trade vs exposed to it'; hyperscaler capex ~$800B this year", "idea": "Last week S&P slipped only 0.5%, but communication services fell over 6% as Meta was punished after earnings, banks and industrials weakened, defensives bid, and gold's drop dragged materials down over 8%. Hyperscaler capex is expected near $800B this year. Alphabet and Microsoft report Wednesday, Amazon Thursday: the market now asks for capex-to-cash-flow returns, not EPS beats.", "angle": "The regime switch from 'reward spend' to 'show the receipt' is the earnings-season story. Watch FCF and depreciation.", "tweetA": "$800B of hyperscaler capex is somebody else's revenue. Meta got hit for spending it. Lam got hit for supplying it. This week we find out whether the market punishes the buyer, the seller, or just the multiple.", "tweetB": "Three prints this week decide AI's cost of capital: GOOGL, MSFT, AMZN. The question isn't demand, it's whether depreciation outruns revenue. Read the cash flow statement first, the headline second.", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-earnings-tsunami", "id": 8}, {"cat": "macro", "urgency": "act", "source": "Dark Side of the Boom", "title": "Fed week: <10% for Wednesday, ~80% for a December hike, Warsh presser is the event", "idea": "Futures price under 10% odds of a hike at this meeting and roughly 80% for December, which makes Kevin Warsh's guidance the real event. The meeting is a week before the Nov. 3 midterms with oil above $100, the September tightening still feeding through, and inflation above target.", "angle": "Asymmetry: a hawkish Warsh is priced, a soft Warsh isn't. A 10Y under 5% already reflects some of that.", "tweetA": "80% December hike priced, under 10% Wednesday. All the risk is in one sentence of Warsh's press conference. Soft it by one notch and the 10Y rally extends. Harden it and expensive growth reprices.", "tweetB": "Fed pauses a week before midterms with oil above $100. If you think policy is apolitical, check the timing. If you think it's political, check the oil price.", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-earnings-tsunami", "id": 9}, {"cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom", "title": "Earnings growth >30% y/y with 83% beating, yet the market is done paying for it", "idea": "About a quarter of the S&P 500 has reported; roughly 83% beat and aggregate earnings growth runs above 30% year on year, around 26% ex-energy. S&P is still up around 11% YTD, the bull market just passed its fourth anniversary, and a third of the index reports this week.", "angle": "30% growth and a down tape is classic late-cycle multiple compression, not an earnings problem.", "tweetA": "30% EPS growth, 83% beats, S&P up 11% and everyone is nervous. When great numbers can't lift the tape, the multiple is the problem. And multiples have one enemy: yields.", "tweetB": "Strip out energy and EPS growth is still 26%. If oil keeps the Fed hawkish, that 26% gets discounted at a 5% risk-free rate. Do that math at 24x forward.", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/wall-street-week-ahead-earnings-tsunami", "id": 10}, {"cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI: Reset to Zero", "title": "CompuServe metered, AOL went all-you-can-eat and won: Google is playing AOL in AI", "idea": "Parekh frames the AI pricing fight with CompuServe vs AOL: AOL's Dec 1996 flat $19.95 plan tripled average time online (7 to 23 hours a month) and reached ~8M members by early 1997, while CompuServe was sold to WorldCom in Sept 1997. Anthropic, OpenAI sit in the CompuServe seat (a la carte, premium, high margins) while Google gives AI Overviews (2.5B monthly users) and AI Mode (1B+) away, funded by ads.", "angle": "Consumer AI goes bundled/free; enterprise and agents stay metered. Google, Meta, Apple, Microsoft are on the AOL side.", "tweetA": "Frontier labs are CompuServe: premium, metered, great margins. Google is AOL: free, good enough, funded by someone else's ad budget. 1996 says 'good enough' wins the consumer. Enterprise is where the meter survives. $GOOGL", "tweetB": "Anthropic closed flat-rate plans to heavy agent use in April. That's Steve Case in 1998 raising the price because each additional minute costs money. The difference: agents don't sleep.", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-ai-loops-101-part-4-too-numerous", "id": 11}, {"cat": "credit", "urgency": "deep", "source": "Michael Parekh / AI: Reset to Zero", "title": "Loudcloud lesson: bandwidth fell 30x in two years; H100 rent went $8 to $2; CoreWeave bonds near 15%", "idea": "Ben Horowitz on All-In: a16z has invested in zero AI neoclouds because he lived the Loudcloud arbitrage. In 1999 a megabit cost ~$1,500, by 2001 ~$50 (30x drop), killing anyone who borrowed against 1999 prices. Today H100 rentals went from $8+/hr in 2023 to ~$2, token prices for fixed capability fall 9-900x a year (Epoch AI), and some CoreWeave bonds yielded ~15% this month.", "angle": "Debt is financing capacity at yesterday's price. Newest GPUs are scarce; older ones already show the pattern.", "tweetA": "H100: $8/hr to $2. Bandwidth in 2001: $1,500 to $50 a megabit. Every infrastructure boom ends with the asset repricing and the borrower's covenants not repricing with it. Check the weighted average life of the GPU debt.", "tweetB": "a16z, with $90B AUM, hasn't touched a single neocloud. The people who financed the last one are sitting out the next one. CoreWeave at 15% yield says the credit market read the same essay.", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-ai-loops-101-part-4-too-numerous", "id": 12}, {"cat": "tech", "urgency": "watch", "source": "Michael Parekh / AI: Reset to Zero / Cloudflare founders' letter", "title": "Bots passed humans in web traffic in May; Cloudflare sees up to 1000x human traffic in 5 years", "idea": "Parekh cites Cloudflare's 2026 founders' letter: automated traffic passed human traffic in May and could be 1,000x human traffic within five years. His implication: the ad leg of the business model pays for human attention, so machine traffic needs other payers (transactions, wallets, agents paying agents).", "angle": "If web traffic is machines, the ad-funded web needs a new payer. Stablecoin rails for machine micropayments.", "tweetA": "Bots passed humans on the web in May, per Cloudflare. Bots don't click ads. Whoever builds the billing layer for machines to pay machines gets the next Visa. $NET", "tweetB": "Cloudflare says 1000x human traffic in five years. Even at 10x that, the ad-funded web is a rounding error of its own traffic. Publishers should be modelling that.", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-ai-loops-101-part-4-too-numerous", "id": 13}, {"cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI: Reset to Zero", "title": "Google: 3.2 quadrillion tokens a month, 330x in two years, on $180B+ capex funded by search", "idea": "Google processes over 3.2 quadrillion tokens a month across products, up about 330x in two years; Gemini app >900M monthly users (from 400M a year ago); AI Overviews reach 2.5B monthly. It runs much of this on its own TPUs, funded by search, allowing capex of $180B or more this year. Parekh ties it to Jevons: cheaper units, many more units.", "angle": "Token volume is the demand proof; the question is price per token. 330x volume with falling price per token.", "tweetA": "3.2 quadrillion tokens a month. If I assume even $0.10 per million blended, that's a $320M monthly bill Google pays itself to give AI away. Funded by search margin that exists nowhere else. $GOOGL", "tweetB": "330x token growth in 24 months and the cost per token still falling. Demand is not the debate. The debate is whether the supply chain gets paid the same per token on the way down.", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-ai-loops-101-part-4-too-numerous", "id": 14}, {"cat": "venture", "urgency": "watch", "source": "Michael Parekh / AI: Reset to Zero", "title": "Anthropic hard cap vs OpenAI halving token prices while widening tiers from $8 he eMudhra story is the preview: a CA signing with a private key of '4'. AI will find the next 10,000 of those in an afternoon. 'Open internet' is about to get a cost.", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://www.exponentialview.co/p/ev-607", "id": 16}, {"cat": "science", "urgency": "watch", "source": "Exponential View / Azeem Azhar", "title": "Hassabis' AGI timeline compressing: 5-10 years (Jan) to 3-5 to now 2-3 years", "idea": "Demis Hassabis estimated five to ten years at Davos in January, later three to five, and now tells the WSJ two to three. Azhar calls Hassabis one of the field's more measured voices and notes the contested AGI definition, but the capability threshold matters. His open question: can we test and apply AI's discoveries fast enough?", "angle": "The bottleneck shifts from discovery to validation: labs, trials, fabs, regulators.", "tweetA": "Hassabis: 5-10 years in January, 2-3 now. Ten months, four years off. When the most conservative voice in the room moves that fast, the forecast error is bigger than the forecast.", "tweetB": "If AGI is 2-3 years, the constraint isn't intelligence, it's the lab bench. Trials, wet labs and fabs run at human speed. Long the validation layer. $TMO $DHR", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://www.exponentialview.co/p/ev-607", "id": 17}, {"cat": "energy", "urgency": "watch", "source": "Exponential View / Azeem Azhar", "title": "EVs as energy security: electrification cuts oil-importing countries' exposure to disruptions", "idea": "Azhar's third lead looks at the security dividend from electrification: electric cars are helping oil-importing countries reduce exposure to oil disruptions. Also headlined in the issue: a Russian satellite's close encounter, turning mercury into gold, and self-destructing plastics (body not in preview).", "angle": "Brent near $100+ is the best EV ad campaign in years; same logic as China's NEV push.", "tweetA": "Every $20 of Brent is worth more to EV adoption than any subsidy. Oil importers who electrified in 2022 are the ones not rationing diesel in 2026. Italy and Spain are the counterexample.", "tweetB": "Energy security used to mean a strategic petroleum reserve. In 2026 it means kilometers of grid and charging. China figured this out ten years before everyone else.", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://www.exponentialview.co/p/ev-607", "id": 18}, {"cat": "geopolitics", "urgency": "act", "source": "MacroEdge Oil & Gas Research", "title": "First fuel-driven unrest in Europe: Italian truckers' strike forces another bailout, food and fuel shortages", "idea": "MacroEdge sees the first signs of fuel-driven civil unrest from the largest energy shock in modern market history: Italian truck drivers protested and forced through another bailout package, causing limited food and fuel shortages, while Spanish diesel costs weigh on low wages and under-35 opportunity. He expects this to be the early stage of a youth-driven cycle, like the Arab Spring and post-GFC Europe, and thinks the US is better equipped short to medium term.", "angle": "Energy-shock unrest is a policy constraint: governments will cap prices, release stocks, pressure producers.", "tweetA": "Italian truckers struck, got a bailout, and left shortages behind. That's the template: fuel price, strike, subsidy, deficit. France's spreads are already pricing the last step.", "tweetB": "Spain: PhDs behind hotel bars, diesel at multiples of their hourly wage. Energy shocks don't hit GDP first, they hit the generation with nothing to cut. That's how Arab Spring started, too.", "charts": {"count": 1, "hot": false, "desc": "Spain diesel prices (USD/liter) chart in email"}, "link": "https://macroedgeenergy.substack.com/p/oil-and-gas-research-weekly-macro", "id": 19}, {"cat": "energy", "urgency": "deep", "source": "MacroEdge Oil & Gas Research", "title": "WTI $80-82 floor, $99-108 is 'the war of the cycle'; real-dollar oil starts to agree with nominal", "idea": "MacroEdge says WTI is settling into a sustained $80-82/bbl floor and that the $99-$108 range is the most important battle of the cycle through month-end. He argues the 'TACO trade' got blasted through without scarring, unlike the March-May SPR release period, and notes operators are not that optimistic. Contends the Strait of Hormuz is not open per his data despite headlines. 1H Outlook due Tuesday.", "angle": "A floor 20% below the range makes the volatility a two-sided option, not a trend.", "tweetA": "$80 floor, $100 ceiling, and the market keeps buying the dip. Each gap into $100 that doesn't get sold is a floor raised. The 'TACO' bet needs a seller, and the sellers are running out.", "tweetB": "Everyone says Hormuz is open. His data says otherwise. When headlines and flows disagree, I take flows. Any 'Iran wants a deal' headline is a gift to someone's exit. $XLE $OIH", "charts": {"count": 2, "hot": false, "desc": "Real vs nominal oil price charts and XLE/OIH technicals in email (images not extracted)"}, "link": "https://macroedgeenergy.substack.com/p/oil-and-gas-research-weekly-macro", "id": 20}, {"cat": "geopolitics", "urgency": "act", "source": "MacroEdge Oil & Gas Research", "title": "Election-window headlines: Iran-reopening-Hormuz-for-blockade-lift, and 'does TACO survive a GOP wipeout?'", "idea": "MacroEdge expects 'unexpected (and likely false)' announcements over the next 7-10 days ahead of the Nov. 3 midterms, citing a President claim that Iran would love a deal and an Al-Arabiya headline that Iran would reopen Hormuz if the blockade is lifted. He is asked whether Trump's incentive to maintain TACO holds if the GOP loses both chambers and says it is more nuanced. Also flags strike possibilities before Israeli and US elections.", "angle": "Headline risk skews to de-escalation announcements pre-election; the risk is the real-world flow not following.", "tweetA": "Expect seven to ten days of 'Iran wants a deal' headlines before Nov 3. Each one knocks $3-5 off oil. Each one fades when tankers don't move. Trade the fade, not the headline.", "tweetB": "If TACO is a pre-election put, what happens to it on Nov 4? The market is pricing the announcement, not what comes after the vote. $USO", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://macroedgeenergy.substack.com/p/oil-and-gas-research-weekly-macro", "id": 21}, {"cat": "energy", "urgency": "watch", "source": "MacroEdge Oil & Gas Research", "title": "Low-cost US shale inventory is a 'story of the past'; EOR and frontier basins (Guyana, Venezuela, Argentina, Africa) next", "idea": "MacroEdge says low-cost inventory is disappearing in the US and capex discipline remains the rule (rig count, frac spread analysis in the full note), with CRC pursuing secondary recovery/EOR. Frontier opportunity moves to Guyana, Venezuela, Argentina and Africa, while East Asian demand is rebounding.", "angle": "Supply response from the US is capped, so oil spikes persist longer. Opportunity set shifts to non-US low-cost barrels.", "tweetA": "US shale got the low-hanging barrels first. The remaining inventory costs more to drill, which means the supply response to $100 oil is slower than 2022. Price spikes last longer when the marginal barrel is expensive.", "tweetB": "Guyana, Argentina, Venezuela, West Africa: the oil majors' next decade is in basins nobody called 'core' five years ago. $XOM $CVX $CRC", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://macroedgeenergy.substack.com/p/oil-and-gas-research-weekly-macro", "id": 22}, {"cat": "crypto", "urgency": "act", "source": "DeFi 0xJeff / The After Hour", "title": "Brent heads toward $120; equities, crypto and gold all dumped, but crypto holds up better than AI stocks", "idea": "The After Hour: US-Iran conflict escalation has Brent moving toward $120, one of the year's highest. Semis, tech and memory are dumping on AI-infra spending worries, debt/credit pressure, hot CPI/PPI and Iran. BTC, ETH and majors hold up with less volatility than stocks. Jeff speculates crypto has bottomed and AI-equity capital is rotating into crypto for asymmetry, though he admits there's no data to confirm it.", "angle": "Relative strength vs AI equities is the signal. But it's an unconfirmed rotation claim.", "tweetA": "BTC is down about 6% from Wednesday's near-$85k high while AI hardware names are being dumped. Crypto is behaving like the lower-beta asset this week and nobody had that on their bingo card.", "tweetB": "Brent at $120 and the first thing I check is where stablecoin supply and ETF flows go. Gold, equities and crypto all down together means one thing: someone's selling what they can, not what they want.", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://defi0xjeff.substack.com/p/the-after-hour-ep78-timing-is-everything", "id": 23}, {"cat": "tech", "urgency": "watch", "source": "DeFi 0xJeff / The After Hour", "title": "Gap between open and closed models is getting smaller (teaser)", "idea": "The After Hour's section 2 headline says the gap between open and closed models is narrowing, framed as a catalyst for onchain AI as a sector. The email preview truncates here, so the supporting data isn't visible; the newsletter also promises 'exciting stuff to watch' (resurfaced narratives).", "angle": "Open-model parity undermines frontier lab pricing power, which dovetails with the metering debate above.", "tweetA": "The open/closed model gap keeps shrinking. If good-enough is free and runs on a laptop, the frontier labs' margin is a bet on the last 5% of capability. That is a smaller TAM than their valuation implies.", "tweetB": "Onchain AI only works if open models are good enough. The gap closing is the best thing that happened to decentralized inference this year. Open question: who pays the GPUs?", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://defi0xjeff.substack.com/p/the-after-hour-ep78-timing-is-everything", "id": 24}, {"cat": "crypto", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "PaperTrade: $140M in pre-deposits, 1,000x leverage, house pool; token made non-transferable after launch-day oracle attack", "idea": "PaperTrade, a new perp exchange, drew $140M in pre-deposits and reportedly matched Nasdaq's daily notional for one day. It offers up to 1,000x leverage against a house pool paying winners from losers' margin, minting PAPER to losers. A trader moved ETH on Hyperliquid to sway its price feed, and the team then made PAPER non-transferable; Delphi's Pagoulatos calls it a 'bait-and-switch' for depositors. Staking revenue fell 93% in a day.", "angle": "Oracle manipulation across venues, plus a token rebate to losing traders. Reflexivity at 1,000x.", "tweetA": "1,000x leverage, a house pool, and a price feed anyone can move on another exchange. The attack was obvious. The surprise was the team's fix: change the rules after the deposits arrived.", "tweetB": "Pagoulatos' test for any token: would the business work without it? A token handed to losing traders as a rebate fails it. $HYPE is the venue that got attacked and the venue that won.", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-trump-sued-over-uae-deals-senate-probes-tether-s-hines-payments", "id": 25}, {"cat": "regulation", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "Circle shareholder sues Trump under Emoluments Clause: UAE paid $500M for 49% of World Liberty", "idea": "A former Circle engineer holding 10,000 shares filed a derivative suit alleging two UAE-linked deals with World Liberty violated the Foreign Emoluments Clause: Aryam paid $500M for 49% (about $75.5M allegedly reached Trump entities) and MGX paid for a $2B Binance stake with World Liberty's USD1 stablecoin, which the suit says costs Circle $70-82M a year in reserve income. Circle says it didn't authorise the filing. The suit names Witkoff.", "angle": "USD1 vs USDC is now a political and legal competition, not just product. Circle's reserve income is the quantified harm.", "tweetA": "USD1 got a $2B Binance placement; the suit prices the damage to Circle at $70-82M a year in reserve income. That's the first time anyone has put a dollar number on stablecoin politics. $CRCL", "tweetB": "Derivative suit, 10,000 shares, brought by a former employee, and Circle disowns it. Whoever filed it didn't need to win. They needed discovery on a $500M for 49% deal.", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://unchainedcrypto.com/ex-circle-engineer-takes-trump-to-court-over-emirati-payments-to-world-liberty-financial/", "id": 26}, {"cat": "regulation", "urgency": "watch", "source": "Unchained / Laura Shin", "title": "Senator demands Tether's records on $415k/month to Bo Hines' firm Nxum, deadline Nov. 3", "idea": "Sen. Blumenthal asked Tether and Nxum for every contract, payment and communication involving Nxum and Bo Hines by Nov. 3 (Election Day). Per WSJ, Tether agreed in May 2025 to pay Nxum $415,000 a month, over $6M total, while Hines reportedly kept a one-third stake. Hines ran the White House crypto council until August 2025 and now runs Tether's US business.", "angle": "Revolving door between crypto policy and issuer. Tether US is the entity that needs a clean licence.", "tweetA": "$415k a month to a firm one-third owned by the man who ran White House crypto policy until August 2025, and who now runs Tether US. Tether's compliance team is having a long weekend.", "tweetB": "The letter's deadline is Election Day. Whatever the outcome, Tether's US licensing path now depends on who chairs that subcommittee in January.", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-trump-sued-over-uae-deals-senate-probes-tether-s-hines-payments", "id": 27}, {"cat": "crypto", "urgency": "watch", "source": "Unchained / Laura Shin", "title": "Ethereum cancels Glamsterdam's last Hoodi testnet fork over gas repricing risks; no mainnet date", "idea": "Devs canceled Glamsterdam's Hoodi activation four days before it was due after ChainSecurity flagged EIP-8037 and EIP-8038, which reprice gas for state creation and reads, warning contracts could behave differently with unchanged code (a failed call that used to revert could complete). The fork would split block building from proposing and add block-level access lists for parallel processing. Mainnet candidates (Dec 1, 8, 9) are off.", "angle": "Parallel execution roadmap slips. Short-term ETH catalysts less certain.", "tweetA": "Glamsterdam slipped because a repricing of gas can change what a failed call does. The scary part isn't the delay. It's that audited contracts with no code changes could behave differently.", "tweetB": "ETH has no hard-fork date in 2026 now, and gas repricing was the thing that was supposed to make L1 cheaper. Solana shipped Alpenglow this week. The L1 race isn't waiting. $ETH $SOL", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://unchainedcrypto.com/ethereum-scraps-glamsterdams-hoodi-fork-after-chainsecurity-flags-gas-risks/", "id": 28}, {"cat": "crypto", "urgency": "act", "source": "Unchained / Laura Shin", "title": "BTC round-trips from ~$85k as Nasdaq has worst day since June; $431M liquidated, ETFs -$635.6M Thursday", "idea": "BTC touched nearly $85k Wednesday, then Nasdaq fell 2.6% Thursday (worst since June) after Lam Research dropped ~10% on a supply warning and oil jumped on Middle East hostilities. BTC slid to about $81k with ~$431M in leveraged liquidations; ETH fell below $2,400. ETFs flipped from Wednesday inflows to $635.6M outflows Thursday, still +$442.7M on the week. Next Fed decision Oct. 28.", "angle": "BTC trading as a high-beta nasdaq proxy again on the downside.", "tweetA": "Monday: +$526.7M ETF inflows. Thursday: -$635.6M. Same week, same buyers. ETF flow is momentum, not conviction. It's a trailing indicator wearing a leading indicator's clothes.", "tweetB": "Lam Research -10% moved BTC. A semicap supply warning moved crypto. If you wanted proof that BTC trades with the AI risk book, there it is. $BTC $LRCX", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://unchainedcrypto.beehiiv.com/p/weekly-recap-trump-sued-over-uae-deals-senate-probes-tether-s-hines-payments", "id": 29}, {"cat": "crypto", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "Strategy spent $193.1M on STRC buybacks vs $22.1M on BTC; USD cash falls to $447.3M; MSCI exit risk", "idea": "Strategy raised its preferred buyback cap to $3B and spent $193.1M repurchasing ~1.94M STRC shares in the week to Oct. 18, versus 267 BTC ($22.1M). USD Cash fell from $640.5M to $447.3M. It holds 848,517 BTC and has halted the STRC sales that funded bitcoin buys; it is defending STRC near $100 par. Shareholders vote Oct. 28 on daily STRC dividends, and MSCI's November review could drop it from indexes.", "angle": "The flywheel has run in reverse: the BTC buyer is now the preferred buyback bid.", "tweetA": "Strategy spent 9x more defending its preferred than buying bitcoin. The flywheel needed the preferred above par to buy BTC. Now it burns cash to hold it at par. Who is the marginal BTC buyer? $MSTR", "tweetB": "USD cash $640M to $447M in a week. At $190M a week that's under three weeks of runway for the STRC defense. Add the Oct 28 vote and an MSCI review. November is the stress test.", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://unchainedcrypto.com/strategy-raises-its-preferred-buyback-cap-to-3-billion-after-another-193-million-strc-week/", "id": 30}, {"cat": "crypto", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "JPM Coin goes to Ethereum; JPMAM's 10% BTC base case vs 5.5% gold, bear case -11.2%/yr", "idea": "JPMorgan is bringing its JPM Coin deposit token to Ethereum (previously on Coinbase's Base), citing liquidity and client activity. Separately JPM Asset Management's 2027 long-term outlook sets bitcoin at a 10% annual base-case return over 10-15 years vs 7.5% US large caps and 5.5% gold, with a bear case of -11.2%/yr, yet still says it 'lacks a strategic role in portfolios'.", "angle": "Deposit tokens on public chains vs stablecoins. Outlook puts BTC ahead of gold in expected returns.", "tweetA": "JPM's own capital markets assumptions have BTC at 10%, gold at 5.5%, and a -11.2% bear case. Then they conclude it has no portfolio role. Either the model or the conclusion is wrong.", "tweetB": "Bank deposit tokens on Ethereum are the stablecoin competitor nobody priced. Same settlement rail, zero reserve fight with the OCC. $ETH $CRCL", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://unchainedcrypto.com/jpmorgan-picks-ethereum-for-jpm-coin-citing-the-networks-liquidity-and-client-use/", "id": 31}, {"cat": "regulation", "urgency": "watch", "source": "Unchained / Laura Shin", "title": "Coinbase Ireland's safeguarding account ran short for 18 months, €3.25M fine", "idea": "Coinbase's Irish e-money unit admitted breaches from Nov 2020 to Aug 2025: after Silvergate and Signature collapsed in March 2023, 30 institutional clients wired dollars into accounts where the money sat mixed with parent funds for ~19 months, and calculation errors left the safeguarding account short every day for at least 18 months by as much as €5.2M in 2024. Fine: €3.25M; sister unit fined €21.5M last November.", "angle": "Custody operational risk even at the best-run exchange; second fine in a year.", "tweetA": "Safeguarding account short every single day for 18 months, by up to €5.2M. Nobody lost money. That's the whole case for proof-of-reserves, and the whole case against 'trust us'. $COIN", "tweetB": "Fine of €3.25M against a quarter in which USDC revenue alone was $292M. That's the cost of non-compliance: rounding error. Regulators aren't pricing this as a deterrent.", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://unchainedcrypto.com/coinbase-ireland-admits-breaches-takes-3-64-million-penalty-over-underfunded-customer-account/", "id": 32}, {"cat": "venture", "urgency": "watch", "source": "Unchained / Laura Shin", "title": "Polymarket: Founders Fund made Coplan repay jet and rent expenses; Trump Jr.-linked 1789 leads round at $21B", "idea": "Per Bloomberg, Founders Fund would not invest at a $1.2B valuation in 2025 until CEO Shayne Coplan repaid personal expenses charged to the company, including private jets and apartment rent; ICE and Founders Fund have urged him to hire a COO. A new round led reportedly by 1789 Capital (Trump Jr. partner) values Polymarket at $21B. The US arm sued Ohio, citing new CFTC rules shielding sports contracts from state gambling enforcement.", "angle": "17x valuation step-up in a year; governance questions open.", "tweetA": "$1.2B to $21B in about a year, and the governance story is 'the investors made the CEO pay back the jet'. Prediction markets are the best product-market fit in crypto and the worst-governed.", "tweetB": "Polymarket's US arm sued Ohio over sports contracts under new CFTC rules. If that wins, state gambling regulators lose jurisdiction over a product doing billions. $ICE", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://unchainedcrypto.com/founders-fund-made-polymarket-ceo-coplan-repay-expenses-ice-joins-push-for-coo-report/", "id": 33}, {"cat": "crypto", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "Solana Alpenglow: finality 12.8s to ~150ms; votes leave the chain (about 3/4 of traffic)", "idea": "Solana moved mainnet to Alpenglow, replacing TowerBFT. Transaction finality fell from 12.8s to ~150ms. Votes, which Galaxy said made up about three quarters of Solana's traffic, now travel as signed messages bundled into certificates, freeing blockspace; per-vote fees give way to a flat 0.8 SOL per epoch per voting validator. Headline transaction counts will drop sharply, an accounting change.", "angle": "Sub-second finality is a different product for payments and trading. Watch the TPS headline mis-reads.", "tweetA": "Three quarters of Solana's traffic was validators voting. Alpenglow takes it off-chain, so headline TPS will fall off a cliff and every 'Solana is dying' chart will be wrong. Watch fees, not counts. $SOL", "tweetB": "150 ms finality is under the blink of an eye and below card auth latency. For anyone building payments on chain, the question is no longer speed, it's liquidity.", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://unchainedcrypto.com/solana-activates-alpenglow-on-mainnet-swapping-out-towerbft-for-a-faster-consensus-engine/", "id": 34}, {"cat": "regulation", "urgency": "deep", "source": "Unchained / Laura Shin", "title": "OCC's final GENIUS rule drops the presumption against affiliate yield; Coinbase's 3.75% USDC rewards stay in a gray zone", "idea": "The OCC finalized its GENIUS Act rule (effective Jan. 18, 2027), dropping February's presumption that payouts via affiliates broke the ban on issuers paying interest, calling payment stablecoins 'a nascent market'. But it will judge arrangements case by case, won't grandfather existing programs, and offers no safe harbor. Coinbase pays 3.75% on USDC to Coinbase One members and booked $292.1M stablecoin revenue last quarter (about a quarter of net revenue).", "angle": "Quarter of Coinbase revenue sits on a rule with no safe harbor.", "tweetA": "A quarter of Coinbase's net revenue depends on a regulator's case-by-case reading of the word 'interest'. The rule got friendlier and the risk got no smaller. $COIN", "tweetB": "The OCC said stablecoins are 'nascent'. The banks lobbying against yield are the ones losing deposits. Jan 18, 2027 is when the lawyers start.", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://unchainedcrypto.com/occs-final-stablecoin-rule-backs-off-yield-test-scraps-automatic-redemption-extension/", "id": 35}, {"cat": "tech", "urgency": "watch", "source": "Unchained / Laura Shin", "title": "Indian CA eMudhra signed with private keys that were literally 4 to 237; cracked in milliseconds", "idea": "Researcher Scott Helme showed eight eMudhra intermediate keys were tiny numbers (4 to 237), recoverable from public certificates in under a second on a laptop, and in use since April 2025. Chrome, Firefox, Apple and Microsoft blocked the certificates; eMudhra said Thursday it would stop issuing website certificates.", "angle": "Trust infrastructure failure at a CA, found by a researcher, not by audit. Pairs with the AI-vulnerability thesis.", "tweetA": "A certificate authority's job is to prove who is who online. eMudhra used the number 4 as a private key for a year. Audits passed. Quantum computers can take the week off.", "tweetB": "Every browser blocked it within days. That's the internet's real security model: four gatekeepers can end a company in a week. Decentralized, it is not.", "charts": {"count": 0, "hot": false, "desc": "No chart in email body text - charts inside the article, worth opening"}, "link": "https://scotthelme.co.uk/eight-bits-of-trust-emudhras-ca-keys-cracked-in-milliseconds/", "id": 36}];

  if(state.src){ITEMS.filter(visible).forEach(function(i){document.getElementById("c"+i.id).classList.add("open");});}
  var cats={};ITEMS.forEach(function(i){cats[i.cat]=(cats[i.cat]||0)+1;});
  var cb='<span class="pill" onclick="setCat(\'all\')" style="'+(state.cat==="all"?'background:#222;color:#fff;border-color:#222':'')+'">All '+ITEMS.length+'</span>';
  Object.keys(cats).forEach(function(c){var on=state.cat===c;cb+='<span class="pill" onclick="setCat(\''+c+'\')" style="'+(on?'background:'+COLORS[c]+';color:#fff;border-color:'+COLORS[c]:'')+'">'+c+' '+cats[c]+'</span>';});
  document.getElementById("catbar").innerHTML=cb;
  var u={act:0,deep:0,watch:0};ITEMS.forEach(function(i){u[i.urgency]++;});
  var names=[["all","All "+ITEMS.length],["act","🔴 Act Now "+u.act],["deep","🔵 Deep "+u.deep],["watch","🟡 Watch "+u.watch]];
  document.getElementById("urgbar").innerHTML=names.map(function(n){var on=state.urg===n[0];return '<span class="pill" onclick="setUrg(\''+n[0]+'\')" style="'+(on?'background:#222;color:#fff;border-color:#222':'')+'">'+n[1]+'</span>';}).join("");
}
function setCat(c){state.cat=c;state.src=null;render();}
function setUrg(u){state.urg=u;state.src=null;render();}
function filterBySrc(name){state.src=name;state.cat="all";state.urg="all";render();}
function filterBySrcIdx(i){filterBySrc(META.includedSources[i].name);}
function init(){
  document.getElementById("sub").textContent=META.date+" · "+META.time+" · "+ITEMS.length+" items";
  var r='<p><b>Window:</b> '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</p>';
  r+='<p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items extracted: '+META.itemsExtracted+'</p><p><b>Included sources</b> (click to filter):</p><ul>';
  META.includedSources.forEach(function(s,i){r+='<li><span class="src" onclick="filterBySrcIdx('+i+')">'+esc(s.name)+'</span> — '+s.items+' items</li>';});
  r+='</ul><p><b>Skipped sources:</b> none. All 9 threads in the window had substantive content.</p>';
  r+='<p><span class="src" onclick="state.src=null;render()">Clear source filter</span></p>';
  document.getElementById("report").innerHTML=r;
  render();
}
init();
</script></body></html>
