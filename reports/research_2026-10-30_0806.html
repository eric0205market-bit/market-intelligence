<script>
const ITEMS = [{"id": 1, "cat": "AI/infra", "urgency": "act", "source": "Irrational Analysis / Intel Q3 2026: Dead Inside", "title": "Intel is wafer-limited, not substrate-limited, in a once-in-a-lifetime datacenter CPU shortage", "idea": "Intel blamed substrates/EMIB for supply misses. The author says it is wafer planning: pivoting wafer starts from client to datacenter takes ~6 months, Intel gave the same excuse two or three quarters ago, and datacenter ran ahead of expectations while client undershot. Because leading-edge wafers take 6 months start to finish, meeting datacenter CPU demand gets harder in 1H27 than 2H27. Argument: with a big SKU stack you could hold partially defective dice and ship only top-end SKUs if substrates were the limit.", "angle": "Datacenter CPU scarcity is a 2027 story, not a 2026 one. Who benefits (AMD, Arm server, ASPs) if Intel can't ship Granite Rapids volume?", "tweetA": "Intel has a CPU shortage, demand running ahead of plan, and still missed. When a company fails to ship into a shortage, it's a planning problem, not a demand problem. 6-month wafer cycle means 1H27 is the real crunch. $INTC $AMD", "tweetB": "Everyone prices AI as a GPU story. The author's point is that agentic workloads pull CPUs too, and the one supplier with the fabs can't pivot wafers fast enough. Who gets the orders Intel can't fill? $AMD $ARM", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://irrationalanalysis.substack.com/p/intel-q3-2026-dead-inside"}, {"id": 2, "cat": "AI/infra", "urgency": "act", "source": "Irrational Analysis / Intel Q3 2026: Dead Inside", "title": "Marvell trying to buy Lumentum; author says he'll try to kill the deal", "idea": "Buried in the Intel post: the author, who calls Lumentum 'beloved', says Marvell is trying to acquire it and he will do everything possible to oppose the deal, with details to come. He also says he is fully de-levered and listed Intel among liquidation targets. No price or terms in the email.", "angle": "Optics consolidation: a merchant-silicon player taking a laser/EML supplier. Check $LITE, $MRVL, $COHR positioning and any premium implied.", "tweetA": "Marvell reportedly wants Lumentum. The optics supply chain is the tightest part of AI networking, and the buyer is a customer-facing chip company, not a laser company. Vertical integration or a supply grab? $MRVL $LITE", "tweetB": "When the most vocal optics bull says he'll fight a takeout of his favorite name, that tells you the bid is probably not at his price. Watch the spread, not the headline. $LITE $COHR", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://irrationalanalysis.substack.com/p/intel-q3-2026-dead-inside"}, {"id": 3, "cat": "labor", "urgency": "watch", "source": "Irrational Analysis / Intel Q3 2026: Dead Inside", "title": "Intel laid off its quantum process-node group; the author knows where they went", "idea": "The author says Intel laid off a large part (potentially all) of its quantum process node team, and that he knows where those people work now, pointing to Classiq's investor list. Talent flow out of a fab into the quantum-software ecosystem.", "angle": "Talent-flow signal: where laid-off fab engineers land often marks the next capital cycle. Quantum hardware needs process people.", "tweetA": "Intel cut the team that was building quantum on its own process node. The engineers didn't retire, they moved. Follow the people, not the press release.", "tweetB": "Fab know-how is the scarcest input in quantum hardware and Intel just put it on the market. Somebody with a Series B is about to have a very good year.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://irrationalanalysis.substack.com/p/intel-q3-2026-dead-inside"}, {"id": 4, "cat": "crypto", "urgency": "act", "source": "Check On Chain / Flash Update: Halloween Headlines", "title": "Binance hack of $5.5B+ pushes BTC to $76k; onchain behavior is the tell", "idea": "Checkonchain frames the Binance exploit (>$5.5B of assets) as the latest bearish headline, with BTC sold to $76k as traders and algos abandoned ship. The author's approach: ignore headlines, read how holders respond onchain. Details (video, TL;DR) are behind the paywall.", "angle": "Watch exchange flows and long-term holder spend vs the headline: forced sellers vs coin holders reacting.", "tweetA": "BTC -> $76k on a hack of the biggest exchange. The tell isn't price, it's whether long-term holders move coins to cold storage or to exchanges. Headlines move algos, balance sheets move cycles. $BTC", "tweetB": "$5.5B stolen from the venue that sets the global BTC price. The market treated it as a Binance problem for about 12 hours. If withdrawals stay shut, it becomes everyone's problem. $BTC $BNB", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening (onchain, paywalled)"}, "link": "https://newsletter.checkonchain.com/p/flash-update-halloween-headlines"}, {"id": 5, "cat": "crypto", "urgency": "act", "source": "Stacy Muur / Binance hack: $6.3B loss", "title": "Anatomy of the Binance hack: EIP-7702 delegation turned a hot wallet into a sweeper", "idea": "Binance estimates $6.3B affected, ~$3B frozen. Attacker obtained valid signatures, used EIP-7702 to delegate Binance 14 to a malicious sweeper, landed 50 signed authorizations over different nonces, and at 20:24:23 UTC swept ~167,464 ETH and 1.615B USDT plus dozens of tokens. Delegation persisted so later deposits could be swept until revoked. TRM attributes it to North Korea's TraderTraitor with high confidence; Binance has not confirmed.", "angle": "A protocol feature (7702) became the persistence layer. Smart-account delegation is a new attack surface for every CEX and wallet that signs programmatically.", "tweetA": "The Binance exploit didn't break Ethereum. It used a feature Ethereum shipped on purpose. 50 pre-signed authorizations across nonces, then a sweeper that kept draining new deposits. EIP-7702 just got its first $6B stress test. $ETH", "tweetB": "1.6B USDT swept in one transaction window. Tether can freeze, Circle can freeze, and about $3B apparently was. Centralized stablecoin issuers just did the job the 'decentralized' exchange custody couldn't. $USDT $ETH", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://stacymuur.substack.com/p/binance-hack-63b-loss-how-is-this"}, {"id": 6, "cat": "crypto", "urgency": "deep", "source": "Stacy Muur / Binance hack: $6.3B loss", "title": "The failure is signing authority, not private keys", "idea": "Binance says an engineer's compromised laptop may have given access to a service container and unauthorized withdrawals; no evidence of key leakage, which is consistent with signing-service misuse. Other wallets on multiple chains sent ordinary, validly signed transfers (TRM: compromised signing infrastructure). CoinDesk comparing Oct 1 reserves to the wallets involved suggests some assets like ETH could be under-backed until replenished. Liquidations about $1.5B, mostly longs; BTC dipped under $77k.", "angle": "Proof-of-reserves was never proof of controls. The question for the next week: independently verified full backing and withdrawal reopening.", "tweetA": "Keys were never the weak point. The system that decides what to sign was. Every exchange running hot-wallet automation now has to prove its signer can't be talked into anything. $BNB", "tweetB": "$6.3B affected, SAFU fund plus company balance sheet to cover it. The test isn't whether Binance can pay, it's whether the reserves they publish next are audited by anyone other than Binance.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://stacymuur.substack.com/p/binance-hack-63b-loss-how-is-this"}, {"id": 7, "cat": "crypto", "urgency": "act", "source": "BowtiedBull / Short Post on Binance Hack + Tech Earnings", "title": "BowtiedBull: Binance-style headlines are usually predictable; tech earnings reiterated", "idea": "Email is a teaser only: the author says big scary headlines like this tend to be relatively predictable and that after-close earnings let him reiterate prior views plus a 'snapshot of the likely best moves'. No data in the preview; the full post is on the web.", "angle": "Thin on content, include as a pointer: worth opening for his positioning after Alphabet/Amazon/Intel.", "tweetA": "Hack headlines have a script: panic, liquidation cascade, partial recovery. The only question is how many days between step two and step three. $BTC", "tweetB": "Same morning: a $6B exchange hack and three megacap earnings misses. Two separate risk-off catalysts, one funding pool. Both land on the same leveraged longs.", "charts": {"count": 0, "hot": false, "desc": "Full post not in email - worth opening"}, "link": "https://bowtiedbull.io/p/short-post-on-binance-hack-tech-earnings"}, {"id": 8, "cat": "AI/infra", "urgency": "act", "source": "Dark Side of the Boom / Asia Open", "title": "Seoul as the overnight seismograph: suppliers vs spenders", "idea": "Alphabet, Intel and Amazon sold off; KOSPI opened sharply lower, SK Hynix and Samsung hit. The author notes nothing changed in the HBM order book; what changed is confidence in the hyperscalers writing the cheques. Frame: the market is separating suppliers from spenders, cash generators from burners. The AI loop: spending creates demand, scarcity, pricing power, which raises the buildout cost, then Wall Street asks hyperscalers why it costs so much.", "angle": "Memory is the toll collector; the question is whether the toll rises while the traffic's payer is being marked down. Positioning-first vs fundamentals-first.", "tweetA": "SK Hynix is sold out through 2029 and fell on a day Alphabet had a bad quarter. That isn't a demand signal, it's a counterparty signal. Toll roads don't reprice when the cars' owners get downgraded, until the owners cut orders. $000660.KS", "tweetB": "The AI trade has a reflexive loop: capex raises prices of the inputs, input prices raise capex, then equity holders revolt. The first place you see the revolt is Korea at 9am. $SKHYNIX $SSNLF", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/asia-open-intel-and-amazon-crater"}, {"id": 9, "cat": "gold", "urgency": "act", "source": "Dark Side of the Boom / Asia Open", "title": "'Buy the yen, sell the gold' - gold as the ATM in an equity-led unwind", "idea": "Closing line of the post: last week's tech wreck muscle memory is back, buy yen, sell gold. When stress is equity-led and liquidity tightens, JPY behaves like the cleaner funding unwind while gold becomes the nearest ATM for cash to cover losses.", "angle": "Gold's hedge role versus its liquidity role: in margin events it's sold for liquidity first.", "tweetA": "Gold is the hedge everyone holds and the asset everyone sells first when margin calls arrive. Yen strength plus gold weakness on the same morning isn't a contradiction, it's a funding unwind. $GLD $USDJPY", "tweetB": "If you hold gold as crash insurance, check what day the policy pays out. In equity-led liquidations it's usually day three, after it's been sold to meet day-one margin. $GLD", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/asia-open-intel-and-amazon-crater"}, {"id": 10, "cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom / A Bruising Month", "title": "Hedge funds moved from shorting stocks to shorting the index; gross exposure up $5T+ since 2024", "idea": "Bloomberg's Simon White (via the author): October's ~8% tech drawdown exposed crowding, but funds are hedging via QQQ rather than exiting. Equity long/short gross exposure has risen by more than $5 trillion since 2024 to over $8 trillion, net far more modestly. Low single-stock correlations kept the VIX subdued despite rising AI debt; rising correlation threatens that regime.", "angle": "Index hedging suppresses implied vol while single-name risk builds; when correlation rises the hedges and the longs move together. Positioning risk, not valuation.", "tweetA": "Gross exposure went from ~$3T to $8T+ in two years while net barely moved. That isn't hedged, it's a levered spread book sitting on a correlation assumption. When correlation goes to 1 the spread isn't the P&L. $QQQ $VIX", "tweetB": "Funds short QQQ against long single names. That keeps VIX low while idiosyncratic risk piles up. October's 8% tech drawdown might just be the first test of whether the hedge was a hedge. $QQQ", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/a-bruising-month-hedge-fund-shorting"}, {"id": 11, "cat": "AI/infra", "urgency": "act", "source": "Michael Parekh / AI Ramblings Daily ARD #196", "title": "Amazon: AWS +39% to $46B but $77B capex in one quarter and FCF of -$42B", "idea": "Q3 revenue +12% to ~$202B (slight miss). AWS +39% to $46B, fastest in nearly five years, operating income +55% to ~$18B. But capex was $77B in the quarter; TTM FCF -$42.4B; full-year capex held at $220B with 'meaningfully more' in 2027; online stores +2%, slowest in three years; stock -7% after hours. Jassy: AWS can grow >40% in 2027 and 2028 and reach $1T revenue in 5-10 years; Trainium sold outside AWS from late next year.", "angle": "The best cloud growth in 5 years is being punished. Market wants capex-to-FCF conversion, not growth.", "tweetA": "AWS: +39%, op income +55%. Stock: -7%. When the market sells record growth, it's saying the growth costs $77B a quarter. That's $308B annualized, against a $220B guide. Check the math before you check the beat. $AMZN", "tweetB": "Amazon will sell Trainium outside AWS. Google already sells TPUs. The hyperscalers are turning into merchant chip vendors to fund their own capex. Nvidia's customers are becoming Nvidia's competitors with Nvidia's own money. $AMZN $NVDA", "charts": {"count": 1, "hot": false, "desc": "Email has a table comparing Google/Microsoft/Amazon results - worth opening"}, "link": "https://michaelparekh.substack.com/p/the-gangs-all-here-in-ai-amazon-spacexsi"}, {"id": 12, "cat": "AI/infra", "urgency": "act", "source": "Michael Parekh / AI Ramblings Daily ARD #196", "title": "Alphabet's worst day ever: -13%, ~$500B wiped, AI commitments >$1T", "idea": "Per FT, Alphabet fell 13% Thursday, its worst day ever, erasing about $500B. Bloomberg: AI exposure tops $1T. Google lost about half a trillion on how it's spending through free cash flow; Microsoft was rewarded for being more tempered. Parekh still calls Google the most committed long-term builder of AI compute.", "angle": "Dominant franchise punished on monetisation lagging capex. Market now discriminates by FCF discipline.", "tweetA": "Alphabet lost ~$500B in a day. That's the entire market cap of a mid-sized hyperscaler, erased because the cheque size surprised. The market has started pricing AI capex like debt, not like R&D. $GOOGL", "tweetB": "$1T in AI commitments on a company the market thought of as a search monopoly. Microsoft 'tempered', rewarded. The lesson isn't about AI, it's about who gets to spend other people's cash flow. $GOOGL $MSFT", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/the-gangs-all-here-in-ai-amazon-spacexsi"}, {"id": 13, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily ARD #196", "title": "Anthropic is SpaceX's 'Customer B': ~$3B a month, 35% of last-quarter revenue", "idea": "Per Bloomberg/SpaceX filing: Customer B (Anthropic) was ~35% of revenue last quarter, paid to SpaceX's AI unit; the other large customer (likely US government agencies) ~17%. Anthropic agreed to spend up to ~$120B through 2029, ~$3B/month from December, cancelable by either side on 90 days' notice after initial periods ending early next year. Musk expects a brutal shakeout among 200+ neoclouds as debt markets tighten.", "angle": "A cancellable contract at 35% concentration is a covenant, not a backlog. Who's the counterparty risk, SpaceX or Anthropic?", "tweetA": "35% of SpaceX's revenue is one customer who can leave on 90 days' notice. $120B 'through 2029' is really a quarterly option. Anyone modeling that as backlog is modeling optionality as cash flow. $SPCX", "tweetB": "Musk is renting compute to the lab that competes with Grok. The neocloud shakeout he predicts starts with whoever lacks a Starlink to fund the gap. Customer concentration is the new leverage. $NVDA", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/the-gangs-all-here-in-ai-amazon-spacexsi"}, {"id": 14, "cat": "AI/infra", "urgency": "act", "source": "Michael Parekh / AI Ramblings Daily ARD #196", "title": "Nvidia backstops Nscale for a $45B Anthropic project; $170B of backstops in total", "idea": "The Information: Nvidia in talks to provide billions in credit guarantees for Nscale's data center that Anthropic plans to rent under a $45B contract, on top of ~$170B already put up for neoclouds and large customers. Big customers are ~half of Nvidia's revenue and also build their own chips.", "angle": "Vendor financing at scale: Nvidia as the bank for its customers' landlords.", "tweetA": "Nvidia guarantees the landlord, the landlord leases to Anthropic, Anthropic buys Nvidia chips. $170B of circular backstops is how you build a demand curve without needing demand. $NVDA", "tweetB": "Cisco and Lucent did vendor financing in 1999 with a fraction of this. The difference now is the lab is real and growing. The question is whether the neocloud tier is.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/the-gangs-all-here-in-ai-amazon-spacexsi"}, {"id": 15, "cat": "geopolitics", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily ARD #196", "title": "NYT: Nvidia chief seen as target of Chinese spy plot", "idea": "NYT front page: US officials concluded a Chinese businesswoman close to Jensen Huang, a top executive at a Singapore data center company suspected of steering Nvidia chips to China, was passing intelligence to Beijing. Trump was briefed about a year ago and took no action. Nvidia says the meetings were normal and the smuggling claims were investigated and debunked.", "angle": "Export-control narrative risk for $NVDA; the Singapore transshipment channel again.", "tweetA": "Briefed a year ago, no action, front-page now. Timing matters more than content: someone wants this in the news ahead of chip-export decisions. $NVDA", "tweetB": "Singapore keeps appearing in the chip-transshipment story. If export enforcement shifts from chips to people, the compliance cost isn't Nvidia's alone.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/the-gangs-all-here-in-ai-amazon-spacexsi"}, {"id": 16, "cat": "AI/infra", "urgency": "act", "source": "Michael Parekh / AI Ramblings Daily ARD #196", "title": "Intel -21% on weak guidance, yet Wildcat Lake budget chips are sold out", "idea": "CNBC: Intel fell >21% after hours on weak guidance as the PC slowdown continues. Memory shortages push PC prices up and hold back units; the CFO doesn't expect memory supply to improve next year. CEO: Wildcat Lake low-cost laptop chips are sold out. Laptops are moving from $500-600 to $800-2,000+.", "angle": "Counterpoint to the Irrational Analysis wafer thesis: Intel says memory, the author says wafers. Either way the 2026 PC cycle is supply-priced.", "tweetA": "Intel sells every budget laptop chip it can make and still drops 21%. Memory is pricing the consumer out of the PC. Unit sales down, ASPs up, and the chip company takes the guidance hit. $INTC", "tweetB": "The PC is the first consumer product where AI scarcity shows up in the sticker price. Laptops that were $600 are $1,000. Nobody put that in the inflation basket yet.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/the-gangs-all-here-in-ai-amazon-spacexsi"}, {"id": 17, "cat": "culture", "urgency": "deep", "source": "Michael Parekh / AI Ramblings Daily ARD #196", "title": "Amazon blocks Meta's Muse; Jassy says outside shopping agents are 'not great'", "idea": "Jassy says few customers buy through outside shopping agents because the experience is 'not great'. Amazon has blocked Meta's Muse and pushes its own agent: >400M customers used Alexa for Shopping in the last year. Online store sales grew just 2%.", "angle": "Walled gardens vs agents: who owns the checkout when the interface is an agent?", "tweetA": "Amazon says outside shopping agents are 'not great' and blocks Muse. Of course it does. 400M users of its own agent, and the retail business growing 2%. The moat is access, and it's being defended with a robots.txt. $AMZN $META", "tweetB": "Online stores +2%, AWS +39%. Amazon is quietly becoming a cloud company with a retail subsidy. The agent war decides whether retail gets a second act.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/the-gangs-all-here-in-ai-amazon-spacexsi"}, {"id": 18, "cat": "tech", "urgency": "deep", "source": "Michael Parekh / AI-RTZ #1255", "title": "Apple's touchscreen Mac after 16 years of 'no'; 13 launches in 57 days", "idea": "Apple launched its first touchscreen MacBook Pro (tandem OLED, M5 Pro/Max, from $2,899 and $3,399, ships Nov 6) under new CEO John Ternus, eight weeks in. Jobs dismissed touch laptops in 2010; Cook's toaster-refrigerator line was 2012; Ternus himself said in 2021 the Mac was optimized for indirect input. Parekh counts 13 launches in 57 days, with Siri running Gemini and Nvidia under the hood and Apple owning the silicon. Apple reports Nov 2.", "angle": "The new-CEO tell: willing to reverse founder-era dogma once the technology (OLED weight, thermal, hinge) removes the trade-off.", "tweetA": "Apple reversed 16 years of 'never' because OLED, thermals, and a hinge finally made it free. That's how a hardware company handles taboos: wait for the physics. 13 launches in 57 days is a new cadence. $AAPL", "tweetB": "Ternus ships hardware with Google's model inside. Apple's AI strategy is renting the model and owning the silicon. Works as long as the memory suppliers let them. Report Nov 2. $AAPL $GOOGL", "charts": {"count": 1, "hot": false, "desc": "Email references product shots/links - worth opening"}, "link": "https://michaelparekh.substack.com/p/ai-apple-ceo-ternus-design-and-supply"}, {"id": 19, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ #1255", "title": "Memory suppliers' revenge: Apple's flash bill $6B (2025) to ~$25B; flash prices ~5x in a year", "idea": "WSJ via Parekh: two years ago Apple bought nearly twice as much flash as Microsoft, Amazon, Meta and Google combined; now those four buy about double Apple's share, and flash prices roughly quintupled in a year. Apple is expected to spend ~$25B on flash this year for about what cost $6B in 2025. The extra 256GB on iPhone 17 Pro cost Apple ~$15 vs a $200 upgrade price; on iPhone 18 Pro the same flash costs ~$66. iPhone prices raised an average of 13%.", "angle": "Power inversion: the buyer that set memory prices for a decade now takes them. Apple's storage upsell margin (>80c on the dollar) is compressing.", "tweetA": "Apple's storage upgrade used to be $15 of flash sold for $200. Now it's $66. The most profitable upsell in consumer hardware just lost most of its margin to a supplier that spent a decade being squeezed. $AAPL $MU", "tweetB": "Flash 5x in a year, $6B to $25B for the same bits. The AI buildout is a tax on every other memory buyer on earth. The tax shows up in iPhone prices first. $SNDK $WDC", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-apple-ceo-ternus-design-and-supply"}, {"id": 20, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI-RTZ #1255", "title": "Mac Studio with 512GB: memory upgrade alone costs $15,500; SK Hynix says memory sold out to 2029", "idea": "Mac Studio M5 Ultra can now be configured with 512GB of memory, enough for very large local models; the memory upgrade costs $15,500, total $22,299 (MacRumors). New iMac uses M6, Apple's first 2nm chip, claimed 5x faster on-device AI than M4. SK Hynix said this week that memory is sold out through 2029. Parekh sees 3-5 years before local AI dents global inference demand.", "angle": "Price per GB of unified memory as the scarcity thermometer; local AI is a developer market at these prices.", "tweetA": "$15,500 for the RAM upgrade. That's the price of memory when it's the binding constraint, set by a company that used to dictate it. Local AI isn't a cost play, it's a luxury good. $AAPL", "tweetB": "If SK Hynix is sold out through 2029, anything priced off DRAM contract rates today is a 3-year forward curve. Who's long the part of the curve nobody can hedge? $MU $000660.KS", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-apple-ceo-ternus-design-and-supply"}, {"id": 21, "cat": "AI/infra", "urgency": "deep", "source": "McKinsey / The Weekend Read", "title": "The agentic coworker: cascading failures before anyone notices (banking)", "idea": "McKinsey's James Kaplan, Rich Isenberg, Vik Sohoni et al.: a copilot's mistake creates extra work, an agentic coworker's could trigger cascading failures before anyone notices. Prescription for banks: set boundaries, assign human owners, restrict autonomy based on performance.", "angle": "Operational risk of agents in financial plumbing: error propagation speed rather than error rate.", "tweetA": "The risk of an agent isn't that it's wrong more often. It's that it's wrong at machine speed with write access. Banks are going to need 'agent owners' the way they have trade owners. $JPM", "tweetB": "Copilot error: a human catches it. Agent error: a downstream agent acts on it. The first bank outage caused by two agents trusting each other will be a regulatory event.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.mckinsey.com/capabilities/tech-and-ai/our-insights/the-rise-of-the-agentic-coworker-a-banking-cios-guide-to-the-next-wave-of-ai"}, {"id": 22, "cat": "regulation", "urgency": "watch", "source": "McKinsey / The Weekend Read", "title": "$3 trillion of multiyear economic activity is tied to projects in federal permitting", "idea": "McKinsey estimates ~$3T in potential multiyear activity depends on projects undergoing federal permitting; delays hit some states, sectors and companies harder. Advice: manage permitting risk as carefully as construction risk.", "angle": "Permitting as the gating item for power, grid, and data-center buildout.", "tweetA": "$3T of projects waiting on federal permits. The AI buildout is constrained by electrons and signatures, and only one of them has a compounding lead time. $VST $CEG", "tweetB": "Everyone models capex. Nobody models the permit queue. McKinsey just put a $3T number on it. Companies with permitting-ready sites are the new scarce asset.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.mckinsey.com/industries/public-sector/our-insights/federal-permittings-uneven-economic-impact-and-what-companies-can-do-about-it"}, {"id": 23, "cat": "culture", "urgency": "watch", "source": "McKinsey / The Weekend Read", "title": "Food & beverage has lost nearly $1T of enterprise value; consumers save on staples, splurge on treats", "idea": "McKinsey podcast: F&B industry lost nearly $1 trillion in enterprise value; expansion opportunities shrink, consumers trade down on staples but splurge on treats, small brands gain ground.", "angle": "Barbell consumption: staples trade-down + treat splurge, share going to small brands.", "tweetA": "Nearly $1T of F&B enterprise value gone. Consumers are cutting staples and buying treats. The big-brand pricing power era ended and the market is still working out who's the new price setter. $KHC $GIS", "tweetB": "Treats up, staples down, small brands up. The consumer isn't weak, they're selective. The index is paying for the wrong half of the barbell.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.mckinsey.com/industries/consumer-packaged-goods/our-insights/focus-scale-fund-the-ai-playbook-cpg-leaders-are-missing"}, {"id": 24, "cat": "macro", "urgency": "deep", "source": "McKinsey / The Weekend Read", "title": "Global Economics Intelligence Sept 2026: central banks tighten as energy price spikes fuel inflation", "idea": "The September edition summary: central banks are moving to tighten as energy price spikes fuel inflation; growth looks sparse in some economies, but activity indicators show manufacturing and services expanding.", "angle": "Tightening into an energy-driven inflation spike while the equity market sells AI capex. Dual pressure on duration.", "tweetA": "Central banks tightening because of energy prices while equities reprice AI capex. The two shocks have different causes and the same discount rate. $TLT", "tweetB": "Activity indicators still expanding, central banks still tightening, tech selling off. Which of the three is wrong?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.mckinsey.com/capabilities/strategy-and-corporate-finance/our-insights/global-economics-intelligence"}, {"id": 25, "cat": "culture", "urgency": "watch", "source": "McKinsey / The Weekend Read", "title": "AI shopping: analysis of ~21,000 consumers shows companies aren't ready for agentic commerce", "idea": "McKinsey analysis of about 21,000 consumers finds AI-shopping behavior growing and evolving, with early evidence that companies are not yet equipped for the rising demand. Five trends listed in the article.", "angle": "Datapoint to set against Jassy's 'not great': demand is forming at the consumer end before retailers' systems are ready.", "tweetA": "21,000 consumers surveyed, AI shopping already measurable, companies unprepared. Amazon says the agents are 'not great'. Both can be true when the agent isn't yours.", "tweetB": "Retail is about to repeat the 2010 mobile moment: customers arrive via a channel you didn't build and can't see. Who controls the checkout wins.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.mckinsey.com/capabilities/growth-marketing-and-sales/our-insights/who-wins-when-ai-does-the-shopping-new-evidence-on-agentic-commerce"}, {"id": 26, "cat": "energy", "urgency": "watch", "source": "McKinsey / The Weekend Read", "title": "TenneT CEO Manon van Beek on scaling grid infrastructure amid geopolitical shocks", "idea": "Interview with the outgoing CEO of European grid operator TenneT on scaling energy infrastructure, navigating geopolitical shocks, and resilience under uncertainty. Email carries only the teaser.", "angle": "European grid capex and execution as a constraint on electrification and data centers.", "tweetA": "Europe's biggest grid operator CEO is stepping down mid-supercycle. The grid is the bottleneck behind every electrification thesis.", "tweetB": "Grid operators don't get headline treatment, but TenneT's capex plan is arguably the most important European infrastructure number in the next decade. $SU.PA", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.mckinsey.com/capabilities/people-and-organization/our-insights/hold-course-and-adapt-as-you-go-an-interview-with-manon-van-beek"}, {"id": 27, "cat": "labor", "urgency": "watch", "source": "McKinsey / The Weekend Read", "title": "Stanford's Jamil Zaki: empathy as the human edge as AI reshapes work", "idea": "McKinsey Talks Talent podcast with Stanford research psychologist Jamil Zaki and McKinsey's Brooke Weddle and Bryan Hancock: genuine empathy fosters resilience and may be key to realizing AI value. Teaser only.", "angle": "Skills premium shifting toward interpersonal skills as automation grows.", "tweetA": "If AI commoditizes analysis, the scarce skill is the one it can't fake: knowing what the person across the table needs. Wage premium to watch.", "tweetB": "Every automation wave repriced a skill. This one might price empathy. Check back when comp data catches up.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.mckinsey.com/capabilities/people-and-organization/our-insights/what-ai-cant-replace-and-why-it-matters-for-value"}];

var COL={"macro":"#e24b4a","credit":"#378add","positioning":"#ef9f27","AI/infra":"#1d9e75","crypto":"#7f77dd","geopolitics":"#d85a30","energy":"#f97316","tech":"#06b6d4","gold":"#d4a017","culture":"#ec4899","labor":"#8b5cf6","regulation":"#64748b","science":"#14b8a6","venture":"#84cc16"};
var UE={act:"🔴",deep:"🔵",watch:"🟡"};
var fc="all",fu="all",fs=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function toggle(id){var e=document.getElementById('c'+id);e.classList.toggle('open')}
function filterBySrc(name){fs=name;render(true)}
function setC(c){fc=c;fs=null;render(false)}
function setU(u){fu=u;fs=null;render(false)}
function bars(){
  var h='';var cats=[];ITEMS.forEach(function(i){if(cats.indexOf(i.cat)<0)cats.push(i.cat)});
  h+='<span class="pill" style="'+(fc==='all'?'background:#222;color:#fff;border-color:#222':'')+'" onclick="setC(\'all\')">All '+ITEMS.length+'</span>';
  cats.forEach(function(c){var n=ITEMS.filter(function(i){return i.cat===c}).length;var on=fc===c;
    h+='<span class="pill" style="'+(on?'background:'+COL[c]+';color:#fff;border-color:'+COL[c]:'')+'" onclick="setC(\''+c+'\')">'+c+' '+n+'</span>'});
  document.getElementById('catbar').innerHTML=h;
  var us=[['all','All'],['act','🔴 Act Now'],['deep','🔵 Deep'],['watch','🟡 Watch']];h='';
  us.forEach(function(u){var n=u[0]==='all'?ITEMS.length:ITEMS.filter(function(i){return i.urgency===u[0]}).length;
    h+='<span class="pill" style="'+(fu===u[0]?'background:#222;color:#fff;border-color:#222':'')+'" onclick="setU(\''+u[0]+'\')">'+u[1]+' '+n+'</span>'});
  document.getElementById('urgbar').innerHTML=h;
}
function render(expand){
  bars();var h='';
  ITEMS.forEach(function(item){
    if(fc!=='all'&&item.cat!==fc)return;if(fu!=='all'&&item.urgency!==fu)return;
    if(fs&&item.source.indexOf(fs)<0)return;
    var c=COL[item.cat]||'#999';
    h+='<div class="card'+(expand?' open':'')+'" id="c'+item.id+'" style="border-left-color:'+c+'"><div class="hd" onclick="toggle('+item.id+')">'+
    '<span class="num">'+item.id+'</span><span>'+UE[item.urgency]+'</span><span class="badge" style="background:'+c+'">'+esc(item.source.split(' / ')[0])+'</span><span class="tag">'+esc(item.cat)+'</span>'+
    (item.charts.hot?'<span>🔥</span>':(item.charts.count>0?'<span>📊</span>':''))+'<span class="ttl">'+esc(item.title)+'</span></div><div class="body">'+
    '<div class="lbl">The Idea</div><div>'+esc(item.idea)+'</div>'+
    '<div class="lbl">My Angle</div><div class="angle" style="border-left-color:'+c+';background:'+c+'14">'+esc(item.angle)+'</div>'+
    '<div class="tw"><div><div class="lbl" style="color:#378add">Tweet A</div>'+esc(item.tweetA)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>'+
    '<div><div class="lbl" style="color:#7f77dd">Tweet B</div>'+esc(item.tweetB)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>'+
    '<div class="chart'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING · ':'📊 ')+item.charts.count+' chart(s). '+esc(item.charts.desc||'Charts inside - worth opening')+'</div>'+
    '<div style="margin-top:8px"><a href="'+item.link+'" target="_blank" rel="noopener">↗ Read full article</a></div></div></div>';
  });
  document.getElementById('cards').innerHTML=h||'<p>No items.</p>';
}
function init(){
  document.getElementById('meta').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';
  var r='<p>Window: '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</p><p>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</p><p><b>Included (click to filter):</b><br>';
  META.includedSources.forEach(function(s){r+='<span class="src" onclick="filterBySrc(\''+s.name.replace(/'/g,"")+'\')">'+esc(s.name)+' ('+s.items+')</span>'});
  r+='</p><p><b>Skipped:</b><br>';META.skippedSources.forEach(function(s){r+=esc(s.name)+' - '+esc(s.reason)+'<br>'});
  document.getElementById('rb').innerHTML=r+'</p>';render(false);
}
