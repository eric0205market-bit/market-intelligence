 {"cat": "macro", "urgency": "watch", "source": "The Pressure Point (Fulcrum)", "title": "Hurricane Isaias hits near Destin, Florida as Category 2", "idea": "Isaias made landfall near Destin as a Category 2 storm before weakening; flooding still threatens the Southeast (CBS live updates).", "angle": "Gulf Coast storm in a year with a Gulf-of-Hormuz energy shock; check Gulf of Mexico production and Southeast insurance/utility exposure.", "tweetA": "Cat 2 into the Florida Panhandle with flood risk across the Southeast. Insurers and regional utilities will tell you the damage first; the equity tape will tell you second.", "tweetB": "An energy market already pricing one chokepoint doesn't need a second supply scare from the US Gulf. Check shut-in production numbers Monday before touching energy positioning.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-policy-by-advance-applause/", "id": 6}, {"cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom (Goldman notes)", "title": "Goldman's Pasquariello: bull market, but 'all one big trade'", "idea": "S&P closed a record 7,818 on Tuesday, then fell to 7,765 Thursday on an OpenAI revenue scare. Tony Pasquariello's note is more cautious: rally extremely narrow, mega-cap tech carrying an index where much of the market struggles, and equities behaving as though somebody else will pick up the bill for higher rates.", "angle": "Resilience vs complacency framing: the market ignoring rising global bond yields is either strength or the setup.", "tweetA": "7,818 to 7,765 in two sessions on one company's revenue wobble. When a single name can move the index that fast, you don't have a bull market, you have one position with a ticker for every holding.", "tweetB": "Goldman's desk chief is telling clients to stay long while writing the most cautious note of the summer. When the bull gets nervous in print, the question is who's left to buy." uybacks shrink, valuations compress. That's correlation 1 across things people think of as independent supports.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-2027-equity-supply-wave-is-coming", "id": 13}, {"cat": "culture", "urgency": "deep", "source": "McKinsey / Chart of the Week", "title": "Beauty's elusive billion: only 7 brands founded in two decades topped $1B in sales", "idea": "More capital and entrants than ever, yet only seven beauty brands founded in the past two decades hit $1B in sales last year. $70M in sales is the threshold where brands become scale-ups; of 220 that reached it, only 60 crossed $250M. Brands most likely to reach $1B anticipate when their winning formula will expire and reformulate.", "angle": "Power-law funnel numbers: 220 to 60 to 7. Applicable to consumer VC and to how rich the 'next big brand' trade is.", "tweetA": "220 beauty brands passed $70M. 60 passed $250M. 7 young brands passed $1B. Capital into the category is at a record and the hit rate is a rounding error.", "tweetB": "The McKinsey advice is 'reformulate before your winning formula expires'. That's also a good description of why most consumer multiples compress: the formula that earned the multiple is rarely the one that sustains it.", "charts": {"count": 1, "hot": true, "desc": "Chart of the Week: beauty brand scaling funnel ($70M to $250M to $1B). Charts inside, worth opening."}, "link": "https://email.mckinsey.com/industries/consumer-packaged-goods/our-insights/billion-dollar-beauty-the-odds-of-scaling-a-breakout-brand", "id": 14}, {"cat": "energy", "urgency": "watch", "source": "McKinsey / Chart of the Week", "title": "McKinsey: the 2026 Strait of Hormuz crisis 'stands apart' from past energy supply disruptions", "idea": "Last week's featured chart ('Energy's latest chokepoint', Humayun Tai and coauthors) argues the 2026 Hormuz crisis differs from other major disruptions, and that leaders who understand
