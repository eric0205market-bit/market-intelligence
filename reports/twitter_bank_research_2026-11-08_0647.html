<!DOCTYPE html>

<title>Twitter Bank Research</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DATA POINT TAGS */
.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>

<script>
const REPORT_DATA = {"report_type": "TWITTER BANK RESEARCH", "freshness_gate": "FRESHNESS GATE PASSED.", "collected_at": "2026-11-08T06:23:58Z", "window_days": 4, "input_stats": {"total_tweets": 120, "considered": 120, "kept": 42, "dropped": 78, "deduped": 1}, "summary": "Recurring themes: AI positioning and concentration (HF de-grossing, midterms as 'peak AI', CTA positioning), equity valuation/breadth, and growth/earnings-driven rate commentary.\nFlow stats: record YTD net equity buying and retail streak (Citadel), money-market vs equity flows (Goldman).\nEM: multiples and EPS downgrades (Goldman).\nPer-bank counts: Goldman 22, Morgan Stanley 5, BofA 4, Citadel 3, HSBC 3, JPM 2, Apollo/Slok 1, Nomura 1.", "by_bank_counts": {"Goldman": 22, "Morgan Stanley": 5, "BofA": 4, "Citadel": 3, "HSBC": 3, "JPM": 2, "Apollo/Slok": 1, "Nomura": 1}, "banks": [{"bank": "Goldman", "theme": "Goldman — AI positioning/HF de-grossing, valuations, breadth, EM multiples and sector Sharpe", "items": [{"author": "neilsethinew", "text": "Goldman: One thing that isn't slowing is AI adoption by firms which rose by 0.8pp to 24.6% among US establishments (with adoption expected to rise to 28.6% in the next 6 months) according to the Census Bureau’s Business Trends and Outlook Survey (BTOS). \n\nAdoption is approaching 50% in the information, professional, and finance sectors. At a detailed subsector level, computing, securities, and publishing firms continue to lead adoption.", "tweet_url": "https://x.com/neilsethinew/status/2119165494800613426", "images": ["https://pbs.twimg.com/media/HWi4JLdXUAAOwfw.png"], "created_at": "2026-11-07T20:30:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "AI concerns mounting, but the consensus still calls for 27% Nasdaq 100 EPS growth in CY 2027 GS https://t.co/bJx4RL1lY9", "tweet_url": "https://x.com/MikeZaccardi/status/2119103334866964932", "images": ["https://pbs.twimg.com/media/HWiRQOtWYAA2s5o.png"], "created_at": "2026-11-07T16:23:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman: Outside of the very short-term trading pattern around the IPO, SpaceX has had a much smaller impact on equity indices than many investors expected. \n\nAmong major US equity indices, SpaceX carries the largest weight within the Nasdaq-100. Excluding SpaceX, the P/E of the Nasdaq-100 would be less than half a turn lower than its current multiple. Furthermore, the inclusion of SpaceX has not had a major effect on the Nasdaq-100 index return, volatility, or concentration. \n\nCoincidentally, the limited fundamental impact of SpaceX index inclusion has been reminiscent of Tesla's 2020 inclusion in the S&P 500, when the stock had only a minor impact on index valuation.", "tweet_url": "https://x.com/neilsethinew/status/2119097293240435122", "images": ["https://pbs.twimg.com/media/HWfWtEFXYAAATaw.png"], "created_at": "2026-11-07T15:59:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "ooh.. equity correlation ticked up on Thursday... will that be a 2027 trend? GS https://t.co/ijCuaLFlmd", "tweet_url": "https://x.com/MikeZaccardi/status/2119090248336523719", "images": ["https://pbs.twimg.com/media/HWiFWgyW0AA5GR_.png"], "created_at": "2026-11-07T15:31:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "S&amp;P 500 breadth improved markedly... but that's not always bullish GS https://t.co/e9bH3qQofB", "tweet_url": "https://x.com/MikeZaccardi/status/2119084460121415826", "images": ["https://pbs.twimg.com/media/HWiAFlqWgAEVQlK.png"], "created_at": "2026-11-07T15:08:00.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"The KOSPI semiconductor sector's FY3 P/B has fallen to a historical low of around 0.7x, a level that has historically indicated a bottom of semi cycle and implied encouraging forward returns\"\n\n-Goldman Sachs via @MikeZaccardi https://t.co/8rM1AlfkNV", "tweet_url": "https://x.com/dailychartbook/status/2119083040110506138", "images": ["https://pbs.twimg.com/media/HWh-y2BWUAAkkYo.jpg"], "created_at": "2026-11-07T15:02:22.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "More flows into money markets in the last 12 months than stocks GS https://t.co/gWrZYKsMQ0", "tweet_url": "https://x.com/MikeZaccardi/status/2119071373641326678", "images": ["https://pbs.twimg.com/media/HWh0L3LX0AAsoGb.png"], "created_at": "2026-11-07T14:16:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "The biggest losers last week were some of the year's biggest winners GS\n\nMedian SPX stock was ~unch.. trading 18x P/E and growing EPS by 12% https://t.co/UOzndSn1SZ", "tweet_url": "https://x.com/MikeZaccardi/status/2119063824330346842", "images": ["https://pbs.twimg.com/media/HWhtUaaWoAAp1OI.jpg"], "created_at": "2026-11-07T13:46:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Even before the elections Goldman was seeing a peak in the AI buildout:\n\nQ3 results support our view that AI investment spending will continue to grow but that the growth rate of AI capex is peaking. \n\nThe hyperscalers are on track to spend roughly $800 billion in capex this year (+96% year/year) and analyst estimates suggest that spending will grow to $1.2 trillion in 2027 (+44%). Those estimates remained fairly stable this reporting season, in contrast with the pattern of upward revisions in recent quarters. \n\nReflecting the likely deceleration in AI capex growth, analyst estimates show earnings growth for S&P 500 AI infrastructure stocks peaking at 80% this quarter and slowing to roughly 40% in 2027.", "tweet_url": "https://x.com/neilsethinew/status/2119059799539171732", "images": ["https://pbs.twimg.com/media/HWfWIObWoAAyspZ.jpg"], "created_at": "2026-11-07T13:30:01.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "The sellside sees a 25% SPX return over the next 12 months... too sanguine? GS https://t.co/o1RMyy2uMH", "tweet_url": "https://x.com/MikeZaccardi/status/2119056274591474171", "images": ["https://pbs.twimg.com/media/HWhmc90WQAACZst.png"], "created_at": "2026-11-07T13:16:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "The S&amp;P 500 needs to rip in the next 8 weeks to hit Goldman's 8000 target https://t.co/uJeRcW6GRv", "tweet_url": "https://x.com/MikeZaccardi/status/2119048724248731687", "images": ["https://pbs.twimg.com/media/HWhflgKWoAAi7xl.png"], "created_at": "2026-11-07T12:46:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "Goldman’s latest update notes that through Thursday US Fundamental Long/Short (L/S) Gross leverage fell 8.7 pts – the largest weekly decline since Covid (March ’20) – to the 26th percentile one-year, while US Fundamental L/S Net leverage fell 3.7 pts – the largest weekly decline since the week of liberation day (Apr ’25) – back down to the 0th percentile five-year.\n\nAnd while last week I had noted that the beta-adjusted figures were much higher (beta-adjusted net leverage was 63.9%, only at the 41st percentile over three years and the 53rd over five, vs. the 5th for raw net), meaning there was more risk in hedge fund books than it appeared, those dropped sharply to 57.4% (−6.4 pts), the 0th percentile one-year, the 4th over three years and the 22nd over five. \n\nBeta-adjusted gross fell even more, down 15.7 pts to 213.2%, the 0th percentile one-year and the 5th over three years (from the 69th). \n\nBack of the envelope, their longs’ average beta slipped to about 1.08 from 1.11, meaning they mostly sold their highest-beta longs (AI/semis). The hidden risk finally came out of the books.", "tweet_url": "https://x.com/neilsethinew/status/2119044700913246522", "images": ["https://pbs.twimg.com/media/HWfTXlrWUAAHUl7.jpg"], "created_at": "2026-11-07T12:30:01.000Z", "relayers": []}, {"author": "dailychartbook", "text": "\"A pullback in AI stocks could hit household wealth and weigh on spending. Positive wealth effects have added 0.4 percentage point to US GDP over the past year\"\n\nGoldman Sachs via @ISABELNET_SA https://t.co/7oczEOQQcP", "tweet_url": "https://x.com/dailychartbook/status/2119037664707916178", "images": ["https://pbs.twimg.com/media/HWhVhuKW0AAXIEv.jpg"], "created_at": "2026-11-07T12:02:03.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "Anthropic IPO? Maybe this year? \n\nS&amp;P 500 returns around the largest IPOs in the past 30 years GS https://t.co/3OSUMuJNQO", "tweet_url": "https://x.com/MikeZaccardi/status/2119037399950897524", "images": ["https://pbs.twimg.com/media/HWhVSVVX0AIMCKc.png"], "created_at": "2026-11-07T12:01:00.000Z", "relayers": []}, {"author": "neilsethinew", "text": "While the election was the most recent catalyst, as @sonusvarghese notes (via @dailychartbook’s nightly email), the rotation out of AI has been going on for a while now, with the six-month return gap between Goldman’s Broad AI index and its S&P 500 ex-AI index plunging to around -35 percentage points. \n\nThat’s the worst reading of the four-year bull market by a wide margin. It’s nearly three times as bad as the roughly -10-point trough after the DeepSeek shock and the tariff selloff in early 2025, and the roughly -12-point low during the summer 2024 rotation and yen carry-trade unwind. It’s also a swing of roughly 100 points from the +67 peak in September 2025.", "tweet_url": "https://x.com/neilsethinew/status/2119037164440719801", "images": ["https://pbs.twimg.com/media/HWfMtIWWcAARBka.jpg"], "created_at": "2026-11-07T12:00:04.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "S&amp;P EW is just 2 turns cheaper than the SPX.. that gap was &gt; 5 a year ago GS $RSP $SPY https://t.co/9rv7Cwn3Km", "tweet_url": "https://x.com/MikeZaccardi/status/2118871305738920015", "images": ["https://pbs.twimg.com/media/HWe-OX3XgAEG_5_.png"], "created_at": "2026-11-07T01:01:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "US large-cap value emerging as the 2026 leader (Sharpe) GS\nComm Services $XLC sneaking up on bitcoin for the worst https://t.co/e06ziXbzOM", "tweet_url ains", "items": [{"author": "MikeZaccardi", "text": "MS: 2026 global equity gains are being driven by raw earnings power, not multiple expansion.\n\nYTD, MSCI ACWI 12-month forward EPS is up 30%, while the forward P/E has contracted 14%—signaling strong current fundamentals alongside an ongoing debate over AI earnings sustainability. https://t.co/JlU2MgmTAG", "tweet_url": "https://x.com/MikeZaccardi/status/2119088235066376447", "images": ["https://pbs.twimg.com/media/HWiDhUCWIAAuSrR.jpg"], "created_at": "2026-11-07T15:23:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "MS: Strong Productivity Supports Growth Without Reigniting Inflation https://t.co/tuXLUWU8De", "tweet_url": "https://x.com/MikeZaccardi/status/2119076916544086120", "images": ["https://pbs.twimg.com/media/HWh5OI-WMAAKCK_.jpg"], "created_at": "2026-11-07T14:38:02.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "MS: But will US nominal GDP growth indeed cool to below 5% in 2027 and beyond? Nobody knows, but we can take signal from what markets price in.\n\nFed rate seen peaking near 4.35% https://t.co/ow3cqwFnKj", "tweet_url": "https://x.com/MikeZaccardi/status/2119058036572541091", "images": ["https://pbs.twimg.com/media/HWhoDhAWUAEKF-q.jpg"], "created_at": "2026-11-07T13:23:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "MS: Global nominal GDP is/was just below 6% in 2026.. seen more than a ppt lower in the out year https://t.co/AEDIxpvzOt", "tweet_url": "https://x.com/MikeZaccardi/status/2119054009734459782", "images": ["https://pbs.twimg.com/media/HWhkZI-WwAAQE2k.jpg"], "created_at": "2026-11-07T13:07:00.000Z", "relayers": []}, {"author": "MikeZaccardi", "text": "MS: Rates are up because growth is strong.. and central banks are normalizing policy, not crushing demand.\n\nWith healthy earnings, capex, and solid credit fundamentals, the backdrop for risk assets is constructive. Stay focused on quality, broaden beyond tech, and manage duration https://t.co/aug0jh // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderRelayers(item) {
  const r = item.relayers || [];
  if (!r.length) return '';
  // gen_bank_research_report.py already puts this line into data_points.
  if ((item.data_points || []).some(p => String(p).startsWith('also carried by'))) return '';
  return `<div class="data-points"><span class="dp-tag">also carried by: ${
    r.map(a => '@' + escapeHtml(a)).join(', ')}</span></div>`;
}

function renderItem(item, preferText) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  const body = preferText ? (item.text || item.description || '')
                          : (item.description || item.text || '');
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderRelayers(item)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(it => renderItem(it, topic._fromBanks)).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">▸</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

// The bank-research routine emits `banks` [{bank, theme, items[{text,...}]}];
// older reports (and the Data template's schema) use `topics`. Render `banks`
// directly when present, else fall back to `topics`.
function reportGroups(d) {
  if (Array.isArray(d.banks) && d.banks.length) {
    return { label: 'Banks', unit: 'banks', groups: d.banks.map(b => ({
      topic: b.theme ? `${b.bank} — ${b.theme}` : (b.bank || ''),
      items: b.items || [],
      _fromBanks: true,
    })) };
  }
  return { label: 'Topics', unit: 'topics', groups: d.topics || [] };
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const g = reportGroups(d);
  const topicCount = g.groups.length;
  const itemCount = g.groups.reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`${g.unit} <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const g = reportGroups(d);
  const topicsBody = g.groups.map(renderTopic).join('')
                  || `<div class="empty">No ${g.unit}.</div>`;
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', g.label, topicsBody, g.groups.length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
