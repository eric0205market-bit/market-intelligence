<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Institutional Research</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #7c3aed;          /* purple — institutional report accent */
  --accent-soft: #f3eefc;
  --divergence: #d94052;      /* divergence red */
  --consensus: #15803d;       /* consensus green */
  --yellow: #fff5b3;

  /* category colors (institutional schema: rates, growth, fx, equities,
     credit, crypto, energy, commodities, geopolitics, ai_tech, em) */
  --cat-rates: #2563eb;
  --cat-growth: #d97706;
  --cat-fx: #0891b2;
  --cat-equities: #15803d;
  --cat-credit: #be185d;
  --cat-crypto: #8b5cf6;
  --cat-energy: #dc2626;
  --cat-commodities: #ea580c;
  --cat-geopolitics: #b91c1c;
  --cat-ai_tech: #4f46e5;
  --cat-em: #059669;
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 980px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 12px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* STATS BAR (top: period + coverage) */
.stats-top { margin-bottom: 16px; padding: 8px 12px; background: var(--surface);
             border: 1px solid var(--border); border-radius: 6px;
             font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
             color: var(--text-2); display: flex; gap: 16px; flex-wrap: wrap; }
.stats-top strong { color: var(--text); font-weight: 600; }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 10px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* THEME CARD (Section A) */
.theme { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.theme:last-child { border-bottom: none; }
.theme-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
              flex-wrap: wrap; }
.theme-title { font-weight: 600; font-size: 14.5px; }
.theme-stance { display: grid; grid-template-columns: 1fr; gap: 6px; margin-bottom: 10px; }
@media (min-width: 720px) { .theme-stance { grid-template-columns: 1fr 1fr; } }
.theme-line { font-size: 13px; padding: 8px 10px; border-radius: 4px;
              border-left: 3px solid var(--border); background: #fafafa; line-height: 1.5; }
.theme-line.consensus { border-left-color: var(--consensus); background: #f0f9f3; }
.theme-line.divergence { border-left-color: var(--divergence); background: #fdf6f7; }
.theme-line .lbl { font-family: 'IBM Plex Mono', monospace; font-size: 10px;
                   text-transform: uppercase; letter-spacing: .06em;
                   color: var(--text-3); display: block; margin-bottom: 2px; }
.theme-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
               border-left: 2px solid var(--border-light); }
.theme-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-source { font-weight: 600; color: var(--accent); }
a.item-source { text-decoration: none; }
a.item-source:hover { text-decoration: underline; }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-title { font-weight: 600; font-size: 14px; margin: 4px 0 6px; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DEEP READS (Section C) — purple left border to mark flagship long-form */
.section-deepreads .item-card { border-left: 4px solid var(--accent); background: var(--accent-soft); }

/* HOUSE VIEWS — compact one-line-per-source list */
.hv-row { display: flex; gap: 10px; align-items: baseline;
          padding: 6px 16px; border-bottom: 1px solid var(--border-light);
          font-size: 13px; }
.hv-row:last-child { border-bottom: none; }
.hv-name { font-weight: 600; color: var(--accent); min-width: 180px;
           text-decoration: none; }
.hv-name:hover { text-decoration: underline; }
.hv-stance { color: var(--text); flex: 1; }

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 110px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .hv-row { flex-direction: column; gap: 2px; }
  .hv-name { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "INSTITUTIONAL RESEARCH", "collected_at": "2026-08-23T06:42:53.000Z", "period": {"lookback_days": 10, "from": "2026-08-13", "to": "2026-08-23"}, "input_stats": {"total_articles": 341, "sources_present": 53, "after_filter": 178}, "summary": "**Rates / Fed:** Consensus across **UBS**, **BNP Paribas**, **PIMCO** and **Standard Chartered** is the Fed holds at 3.50-3.75% through year-end, helped by July's cooling CPI (3.4%, core 2.5%) and soft payrolls, even as the 30yr Treasury broke above **5.3%** (highest since 2007) on fiscal/term-premium pressure rather than inflation fear. Sharpest split: **JPMorgan**'s contrarian house call is for G4 hikes (**ECB in September, Fed in December**) against the hold consensus, while **Oxford Economics** is hawkish for a different reason — no cuts before **late 2027** — and **Standard Chartered** leans the other way, arguing inflation already **peaked in Q2** ahead of a BLS methodology revision that could open the door to 2027 cuts.\n\n**Bond selloff — what's really driving it:** **BNP Paribas**, **PIMCO** and **Vanguard** all frame the long-end selloff as a real-yield/term-premium story — driven by record AI-linked corporate bond issuance (**$1.6tn+ YTD**, hyperscalers alone $132bn YTD) and new Fed Chair **Warsh's** near-total absence of forward guidance — rather than a debt-sustainability panic. **Gavekal**'s Charles Gave pushes back hardest, arguing bond-market complacency is misplaced and that a \"great white shark\" of disequilibrium still lurks beneath the calm.\n\n**Treasury buyback & USD:** Treasury doubled long-end buybacks to $4bn/operation, but **UBS**, **Standard Chartered** and **Gavekal** all call it tactical, not structural relief. On the dollar itself there's no consensus: **BCA Research** calls for a structural regime-shift depreciation (\"Get Out Of The Dollar\"), **UBS** leans moderately bearish on fiscal concerns, while **Schroders** actually upgraded the dollar to positive against low-yielders (JPY, CHF).\n\n**US Equities:** Broad agreement the rally is **broadening beyond AI/Big Tech** (Franklin Templeton, Goldman, UBS, Citi) on strong Q2 earnings (Goldman: 64% beat rate by >1 std dev). Sharpest caution: **BCA Research** warns AI-driven multiple expansion has compressed the equity risk premium to leave \"little cushion\" if growth disappoints — against an otherwise bullish street (RBC's 8150 S&P target, Franklin's 7400-7800).\n\n**Crypto:** **Galaxy Digital** reads Bitcoin as past capitulation and entering a \"Goldilocks zone\" with room to run toward its $250k YE2027 target, while **CoinShares** is more guarded, flagging **$80,000** as the key near-term ceiling pending Fed Chair Warsh's Jackson Hole signal — both flag stress building underneath the rally (Galaxy: cracks in Strategy's preferred-equity structure; CoinShares: thin summer liquidity distorting signals).\n\n**Credit:** Consensus is HY spreads are historically tight and resilient (**BNP Paribas**, **Standard Chartered**, ~270bp, near 4th percentile of 15 years). **Schroders** is the clear outlier, downgrading US IG and HY to negative, calling the market \"priced for perfection\" given record issuance.\n\n**Energy / Gold:** Broad bullish consensus on gold (**UBS** $5,400/oz, **Standard Chartered** $4,900/oz targets) on debt-sustainability and currency concerns, while **OPEC** offers a lone contrarian pro-hydrocarbon pushback against renewables-only 2030 electricity-access targets.\n\n**AI & Tech:** Consensus is capex keeps accelerating (**Standard Chartered** raised its 2026 forecast to $750bn, $1tn by 2027) but **Oxford Economics** warns the US AI \"moat\" is eroding faster than priced, as China's lower-cost open-weight models spread at near-zero marginal cost via an \"overcapacity playbook.\"", "sections": {"A_debates": [{"theme": "Rates & Central Banks", "category": ["rates"], "consensus": "The dominant view — held by UBS, BNP Paribas, PIMCO, Standard Chartered and Franklin Templeton/Western Asset — is that the Fed holds its funds rate at 3.50%-3.75% through year-end 2026, supported by July's cooling headline/core CPI (3.4%/2.5%, the slowest core print since March 2021) and a weak payrolls report (-23k in one Standard Chartered read, negative for the first time in a while per Goldman). At the same time, essentially every house agrees the 30-year Treasury's break above 5.3% (a level unseen since 2007) is a real-yield/term-premium event rather than an inflation-expectations shock, driven by a combination of record government/corporate bond supply (BNP Paribas: $1.6tn+ corporate issuance YTD, up ~$225bn YoY; Vanguard: hyperscaler bond issuance from Amazon/Meta/Microsoft/Oracle/Alphabet jumped from a ~$35bn/yr 2020-24 average to ~$132bn YTD 2026, full AI-ecosystem issuance estimated at $300-570bn for the year) and new Fed Chair Kevin Warsh's unusually sparse forward guidance, which several houses (BNP Paribas, UBS, Gavekal, Standard Chartered) all cite by name as pushing term premia higher.", "divergence": "The sharpest split is directional: JPMorgan's house call — genuinely contrarian versus the market — is for G4 central bank hikes, with the ECB moving first in September and the Fed following in December, explicitly rejecting the 'when will the Fed cut' framing in favor of 'when will the Fed hike, and it doesn't matter because it's priced in.' Oxford Economics arrives at a hawkish stance from a different angle, expecting the Fed to stay restrictive with no meaningful cuts until inflation nears target in late 2027. Standard Chartered sits at the dovish end of the spectrum with a genuinely non-consensus call that US inflation already peaked in Q2 2026, helped by an upcoming BLS PCE methodology revision that could retroactively lower core PCE and open the door to 2027 cuts — a view echoed loosely by PIMCO's Richard Clarida, who argues unit-labor-cost inflation (running near 1.5-2%) is a better underlying-inflation gauge than core PCE and implies the Fed should look through tariff/energy noise. On the Treasury's doubled long-end buyback program, the read is split between 'modestly yield-capping but not structural' (UBS, Standard Chartered: 'a drop in the bucket' against a $30tn+ marketable stock) and outright skeptical: Gavekal's Louis-Vincent Gave calls it a signal Treasury is worried, not a fix, and frames it as bearish for the dollar since 'there is no free lunch'; CoinShares goes further, arguing the buyback is 'more troubling than supportive' because funding it pushes issuance further out the curve, raising short-rate sensitivity and risking a dollar-weakness/imported-inflation feedback loop.", "items": [{"source": "jpmorgan", "name": "JPMorgan", "thesis": "Contrarian house call: frames the live debate as 'when will the Fed hike' (not cut) — the ECB moves first in September, the Fed in December — arguing modest hikes are already priced in and markets can absorb the repricing.", "url": "https://www.jpmorgan.com/insights/markets-and-economy/top-market-takeaways/tmt-when-will-the-fed-hike-it-doesnt-matter", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "thesis": "July core PCE forecast flat at 3.3%; shelter costs and portfolio-fee inflation keep the Fed cautious; expects no significant rate cuts until late 2027 when inflation nears the 2% target — more hawkish/patient than typical market pricing.", "url": "https://www.oxfordeconomics.com/resource/us-pce-nowcast-slow-progress-in-easing-inflation-in-july/", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Non-consensus view that US inflation already peaked in Q2 2026; a coming BLS PCE methodology revision could retroactively lower core PCE, enabling a Fed hold in 2026 and cuts in 2027; prefers 3-5yr maturities, sees 10yr UST rangebound 4.50-4.75%.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-21-8-2026/?mvog=1", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas", "thesis": "Attributes the synchronized global bond selloff less to debt-sustainability fears (US deficit 6.9% of GDP in Q2, interest costs 16% of expenditures, below 1980s levels) and more to a rise in the market's long-run fed-funds forecast (highest since 2011) plus a $1.6tn surge in corporate bond issuance crowding out Treasuries; also cites Fed Chair Warsh's less-communicative style as raising term premia.", "url": "https://viewpoint.bnpparibas-am.com/view-from-the-markets-what-is-and-is-not-behind-the-bond-sell-off-and-what-it-means-for-equities/", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "30yr UST touched ~5.3%, a two-decade high, characterized as a real-yield event (breakevens stable), not an inflation shock; maintains a 10yr reference range of 3.75%-4.75% and would add to bond positions if yields keep rising.", "url": "https://www.pimco.com/us/en/insights/whats-pushing-long-term-bond-yields-higher", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Charles Gave warns investors are behaving as if in a 'normal world' despite this week's bond moves; previews a series on long-rate disequilibria across the US, Germany and France, arguing fixed-income complacency is misplaced.", "url": "https://research.gavekal.com/teaser/a-world-in-disequilibrium-the-us-germany-and-france/", "images": []}, {"source": "vanguard", "name": "Vanguard", "thesis": "Hyperscaler bond issuance jumped from a ~$35bn/yr average (2020-24) to ~$132bn YTD 2026, including a ~$53bn multi-tranche deal and a rare 100-year 'century' bond; full 2026 AI-ecosystem issuance estimated at $300-570bn, reshaping fixed income's diversifying role.", "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/vemo/ai-buildout-comes-to-bond-market.html", "images": []}, {"source": "brookings", "name": "Brookings Institution", "thesis": "Foreign ownership of the >$30tn UST market has fallen to ~40% from >50% at the GFC peak; foreign private holders (~$7tn) have overtaken foreign official holders (~$3.9tn) as reserve accumulation slows and geopolitically distant countries hold structurally smaller UST shares — a structural reason term premium is now more sensitive to price-sensitive private buyers.", "url": "https://www.brookings.edu/articles/whos-buying-u-s-treasury-debt-and-why/", "images": []}]}, {"theme": "USD & FX", "category": ["fx"], "consensus": "There is no majority position on the dollar's medium-term direction, but most houses lean at least mildly bearish near-term on fiscal/deficit concerns and the narrowing scope for further Fed hikes: UBS expects broad USD softening over time (USD/CNY toward 6.50 by mid-2027) and favors carry currencies (GBP, NOK, AUD, NZD), while Standard Chartered sees the DXY rangebound 98.5-99.2 with a mild bearish bias.", "divergence": "BCA Research takes the most structurally bearish position, arguing a genuine regime shift is underway in which the dollar becomes pro-cyclical and the euro counter-cyclical — flipping the key driver from rate differentials to the balance of payments, meaning only a modest slowdown (not reversal) of foreign equity inflows is needed to trigger depreciation; BCA explicitly argues a weaker dollar would be deflationary for the rest of the world and that EM equities would NOT rally in absolute terms despite it, a contrarian break from the standard weak-dollar-helps-EM playbook. Schroders sits at the opposite pole, having actively upgraded the US dollar to positive versus low-yielders (JPY, CHF) and 'disproportionate movers' (KRW), viewing recent JPY intervention as only temporary support — directly opposed to the consensus-bearish tilt elsewhere in the batch.", "items": [{"source": "bca_research", "name": "BCA Research", "thesis": "'Get Out Of The Dollar': structural regime-shift call as USD becomes pro-cyclical and EUR counter-cyclical; a weaker dollar is framed as deflationary (not reflationary) for the rest of the world, and EM equities are NOT expected to rally in absolute terms despite USD weakness.", "url": "https://www.bcaresearch.com/marketing/webcasts/get-out-of-the-dollar-g-o-d/222826", "images": []}, {"source": "schroders", "name": "Schroders", "thesis": "Upgraded USD to positive vs low yielders (JPY, CHF) and against currencies with 'disproportionate' recent moves (KRW); downgraded JPY and CHF to negative, viewing recent JPY intervention as only temporary support.", "url": "https://www.schroders.com/en-us/us/individual/insights/our-multi-asset-investment-views---august-2026/", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "Forecasts USD/CNY toward 6.50 by mid-2027 on China's ~$1.2tn trade surplus being recycled into CNY; favors carry in GBP, NOK, AUD, NZD; expects broader USD softening over time on fiscal concerns.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-14082026.html", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Judges CHF strength and GBP's rise above 1.36 as USD-driven, not local-fundamentals-driven (UK unemployment up to 4.9%, wage growth down to 2.8%); recommends partially locking in gains on long GBP; USD/CHF forecast 0.78.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-21-8-2026/?mvog=1", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "Views expanded Treasury buybacks as more troubling than supportive since funding must come from further out the curve, raising short-rate sensitivity, with a possible dollar-weakness/imported-inflation feedback loop.", "url": "https://coinshares.com/insights/research-data/market-update-20-08-2026/", "images": []}]}, {"theme": "Growth, Labor & Consumer", "category": ["growth"], "consensus": "Most houses read the US consumer and labor market as resilient-but-normalizing: Bank of America's card data shows spending growth easing (5.0% y/y in July, from 6.3%) mostly on fading temporary boosts (World Cup effect, promo timing) rather than genuine demand deterioration, with convergence across income cohorts (except the top 5%); small-business hiring and profit growth are at multi-year highs per BofA's separate small-business tracker. Franklin Templeton's Global Investment Management Survey and Invesco both explicitly rule out a 2026 recession.", "divergence": "Oxford Economics is the clear outlier, arguing the US breakeven pace of employment growth needed just to hold unemployment steady is falling from ~50,000/month today toward zero next year and potentially negative by 2028 — driven by restrictive immigration policy and demographics — meaning the 'resilient' payroll prints markets are reading as strength are structurally overstating true labor-market health, and the Fed is unlikely to react to payrolls alone absent a clear rise in unemployment. Capital Economics adds a geographically contrarian note: Europe has weathered the 2026 Middle East energy shock far better than 2022's Russia-Ukraine shock (UK/eurozone GDP +0.4% q/q in Q2), explicitly downplaying AI as the cause and crediting reduced fossil-fuel dependence instead — pushing back on both 'Europe is fragile' and 'AI explains everything' narratives at once.", "items": [{"source": "oxford_economics", "name": "Oxford Economics", "thesis": "US breakeven pace of monthly employment growth forecast to fall from ~50,000 today to zero next year and potentially slightly negative by 2028, driven by restrictive immigration policy and demographic shifts — meaning recent 'resilient' payroll prints overstate labor-market strength.", "url": "https://www.oxfordeconomics.com/resource/what-low-breakeven-employment-growth-means-for-the-us-labour-market/", "images": []}, {"source": "bofa", "name": "Bank of America Institute", "thesis": "Total US card spending growth eased to 5.0% y/y in July (from 6.3%), but ex-gas spending still rose 4.3%; consumer is shifting from 'K-shaped' toward convergence across income cohorts except the top 5%; no signs of accelerating savings drawdown.", "url": "https://institute.bankofamerica.com/economic-insights/consumer-checkpoint-august-2026.html", "images": []}, {"source": "capital_economics", "name": "Capital Economics", "thesis": "Europe has weathered the 2026 Middle East energy shock far better than 2022: UK/eurozone GDP +0.4% q/q Q2; euro-zone oil import volumes down ~10% and gas imports down ~15% vs 2022 on renewables/efficiency gains, not AI — explicitly contrarian to fears of a 2022-style collapse.", "url": "https://www.capitaleconomics.com/blog/time-has-been-different-how-europe-weathered-energy-shock", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "thesis": "Global Investment Management Survey: global growth to be slightly better than consensus; core PCE 3.0%-3.5%; US unemployment near 4.5% by year-end; explicitly does not expect a 2026 recession.", "url": "https://www.franklintempleton.com/articles/series/institute-global-investment-management-survey", "images": []}]}, {"theme": "Equities", "category": ["equities"], "consensus": "The dominant read — UBS, Goldman Sachs, Franklin Templeton, Citi and BNP Paribas all agree — is that the equity rally is broadening beyond mega-cap AI/tech into value, industrials, financials, consumer discretionary and non-US markets, powered by a historically strong Q2 earnings season (Goldman: ~64% of S&P beat estimates by more than 1 standard deviation, one of the highest beat rates on record; 9 of 11 sectors posted double-digit YoY earnings growth; UBS: ~35% YoY underlying S&P earnings growth). Price targets cluster bullish: RBC's Lori Calvasina sees the S&P 500 at 8150 in 12 months (+11.4%), Franklin Templeton targets 7400-7800 by year-end.", "divergence": "BCA Research is the clearest bear voice, arguing AI-driven multiple expansion has sharply compressed the US equity risk premium, leaving little cushion if AI adoption, demand or earnings disappoint — a direct warning against the broad bullish consensus. Ned Davis Research adds a more nuanced historical caution: examining five major equity bubbles over the past century, it finds rates/yields generally rose into the peak (sometimes continuing to rise even after the bubble burst), and that leadership concentration rarely ends overnight — implying today's rising-rate environment is not itself disqualifying for further gains, but that investors should watch whether fundamentals still support valuations and whether participation keeps broadening. Franklin Templeton, while fundamentally bullish, adds its own caution flag: having called the 'broadening' trade correctly since January 2025 (MSCI EM +62%, Russell 1000/2000 Value +40%/+39% vs Magnificent Seven +25%), it now argues the market is entering a 'more demanding phase' with less accommodative liquidity and more selective leadership, unlikely to reward concentration in expensive momentum names.", "items": [{"source": "bca_research", "name": "BCA Research", "thesis": "AI-driven multiple expansion has sharply compressed the US equity risk premium, leaving little cushion if AI adoption, demand, or earnings disappoint — contrarian warning against the AI-bullish consensus.", "url": "https://www.bcaresearch.com/marketing/felix-antoine-vezina-poirier", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "~92% of S&P has reported Q2, 64% beat estimates by >1 std dev (one of the highest beat rates on record); equal-weight S&P has outperformed cap-weight by ~300bp YTD; implied correlation at all-time lows, making index-level hedges cheap; trade idea in under-owned 'consumer experiences' names.", "url": "https://www.goldmansachs.com/insights/the-markets/why-us-equity-returns-are-broadening-beyond-ai-stocks", "images": []}, {"source": "rbc", "name": "RBC Capital Markets", "thesis": "Lori Calvasina: S&P 500 target of 8150 over the next 12 months (+11.4%), the average/median of five models, expecting a non-linear path that could include a 'garden-variety' sell-off.", "url": "https://www.rbccm.com/en/insights/2026/08/the-voice-who-sets-the-pace-for-aussie-traders", "images": []}, {"source": "ned_davis_research", "name": "Ned Davis Research", "thesis": "Examining five major equity bubbles over the past century, finds rates/yields generally rose into the peak and leadership concentration rarely ends overnight; investors should watch whether fundamentals and market breadth still support valuations.", "url": "https://info.ndr.com/ndr-signals/do-bubbles-end-when-rates-rise?hsLang=en", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "thesis": "18-month-old 'broadening' thesis has played out (MSCI EM +62%, Russell 1000/2000 Value +40%/+39% vs Magnificent Seven +25%); now entering a 'more demanding phase' — stay invested/diversified, buy the pullback, but don't expect concentration in momentum names to keep winning.", "url": "https://www.franklintempleton.com/articles/2026/institute/broadening-delivered-now-prepare-for-volatility", "images": []}, {"source": "goldman_sachs", "name": "Goldman Sachs", "thesis": "STOXX Europe 600 H1 2026 EPS grew an estimated 14% (strongest in 3 years) despite the Middle East energy shock; raised full-year top-down EPS growth forecast to 15% from 10%; European banks have 'considerably outperformed' the Magnificent Seven since 2022.", "url": "https://www.goldmansachs.com/insights/articles/european-stocks-defy-global-shocks-with-strong-earnings-growth", "images": []}, {"source": "citi_gps", "name": "Citi Research", "thesis": "Global equities at all-time highs with broadening beyond tech into energy, healthcare, industrials, financials; frames Europe as an emerging 'AI hedge' given domestic growth and fiscal support.", "url": "https://www.citigroup.com/global/insights/markets-edition-unpacking-europes-equity-rebound", "images": []}]}, {"theme": "Credit", "category": ["credit"], "consensus": "The majority view — BNP Paribas, Standard Chartered — is that high yield remains resilient and historically tight: BNP Paribas puts the max 2026 YTD drawdown at just -2.2% (recovered in 11 days), spreads tightened back to ~270bp by August from a ~350bp March peak; Standard Chartered frames current pricing (spreads at the 4th percentile of 15 years but yield at the 69th percentile) as opportunistically attractive, with defaults near 2% versus a 3-3.5% long-run average and the maturity wall pushed out to 2028-29.", "divergence": "Schroders is the clear dissenting voice, downgrading both US investment-grade and high-yield credit to negative — calling the IG market 'priced for perfection' amid near-record issuance and widening tech-sector spreads, and seeing little cushion in HY for refinancing pressure — directly opposed to BNP Paribas' and Standard Chartered's constructive stance on the same asset class. A second, narrower divergence concerns where the next stress point sits: BNY specifically flags business development companies (BDCs, mostly BBB-rated but already trading like HY) as the sector most likely to see the next fallen-angel downgrade wave, while PIMCO separately singles out 'generic' US tech credit issuance (funding the AI buildout) as the area it is most cautious on, preferring bespoke, well-structured deals over broad exposure — both are narrower cautionary notes within an otherwise constructive credit consensus.", "items": [{"source": "schroders", "name": "Schroders", "thesis": "Downgraded US investment-grade credit to negative amid near-record issuance and widening tech-sector spreads, calling the market 'priced for perfection'; remains negative on US high yield given little cushion for refinancing pressure.", "url": "https://www.schroders.com/en-us/us/individual/insights/our-multi-asset-investment-views---august-2026/", "images": []}, {"source": "bnp_paribas", "name": "BNP Paribas", "thesis": "US HY max YTD drawdown only -2.2%, recovered in 11 days; spreads tightened to ~270bp by August from a ~350bp March peak; ~$48bn of 'pure-play' AI/data-centre HY issuance since May 2025; favors overweight to short-duration HY anchoring a barbell into higher-risk idiosyncratic credits.", "url": "https://www.bnpparibas-am.com/en-us/portfolio-perspectives/us-high-yield-selective-opportunities-in-a-bifurcated-economy/", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Opportunistically bullish US high yield: spreads ~266bp (4th percentile of 15 years) but yield ~7.26% (69th percentile); default rate ~2% vs 3-3.5% long-run average; maturity wall pushed to 2028-29 after heavy refinancing.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-14-8-2026/?mvog=1&source=podcast", "images": []}, {"source": "bny", "name": "BNY", "thesis": "Flags business development companies (BDCs) — mostly BBB-rated but already trading like HY — as the sector most likely to see the next fallen-angel downgrade wave; expects downgrades to normalize to $40-50bn/year.", "url": "https://www.bny.com/investments/us/en/individual/articles/fixed-income/hidden-in-plain-sight-seeking-opportunities-in-fallen-angels.html", "images": []}, {"source": "pimco", "name": "PIMCO", "thesis": "BDC loan marks remain elevated relative to broadly-syndicated-loan prices with the gap widening; flags meaningful further valuation-reset risk for BDC equity even as BDC bonds have largely recovered; separately cautious on 'generic' US tech credit issuance funding the AI buildout.", "url": "https://www.pimco.com/us/en/insights/the-credit-market-lens-what-bdc-markets-are-signaling-about-private-credit-valuations", "images": []}]}, {"theme": "Crypto", "category": ["crypto"], "consensus": "Most crypto-native shops agree the leverage/credit backdrop has structurally de-risked versus 2022: Galaxy Digital's leverage reports show crypto-collateralized lending declining in an 'orderly, measured' way (-16.78% QoQ to $56.16bn in Q2 2026) rather than a cascading collapse, and its separate credit-resilience note finds no major lender/fund/exchange failure through the June-July selloff even as Bitcoin fell 20.1% in June to ~$58,700. Both Galaxy and CoinShares agree the SEC's proposed 'Regulation Crypto Assets' (Aug 18) is a constructive, if incremental, development — mainly a legal cleanup mechanism for existing tokens rather than a trigger for a new issuance wave.", "divergence": "On near-term price direction, Galaxy Digital is the more bullish voice — Bitcoin has broken above its 200-week moving average, the Pi Cycle indicator, and short-term-holder cost bases, which Galaxy reads as 'capitulation is over' with room to run toward its flagship $250k by-YE2027 target (while still flagging near-term downside risk below $100-105k). CoinShares is more guarded, framing the rally as a macro/liquidity story amplified by the largest short squeeze on record, but capped near $80,000 pending Fed Chair Warsh's Jackson Hole signal, and separately notes Bitcoin traded almost inversely to gold over a recent stretch — behaving more like a generic risk asset than the 'digital gold' narrative implies. A second divergence concerns credit-market cracks specifically inside crypto: Galaxy flags real stress in Strategy's (MSTR) preferred-equity structure (STRC fell from $100 par to the $70s, mNAV compressed to ~1.07x, dividend obligations of ~$1.73bn/yr against a treasury with no operating cash flow) even as its own headline message is that crypto credit broadly held up — a nuance that qualifies the 'resilience' consensus rather than contradicting it outright.", "items": [{"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "BTC broke above its 200-week moving average, the Pi Cycle (111-day SMA), and short-term-holder realized-price cost bases this week — reads as capitulation over, holders broadly in profit, price has room to run (though 'not necessarily the bottom').", "url": "https://www.galaxy.com/insights/research/charts-of-the-week-bitcoin-enters-the-goldilocks-zone", "images": []}, {"source": "coinshares", "name": "CoinShares", "thesis": "Bitcoin's rally is a macro story (falling short yields, largest short squeeze on record) but capped near $80,000 pending Fed Chair Warsh's Jackson Hole signal; BTC traded almost inversely to gold recently, behaving more like a risk asset than a hedge.", "url": "https://coinshares.com/insights/research-data/market-update-20-08-2026/", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "26 Predictions for 2026: BTC to reach $250k by YE2027 (2026 itself seen as too chaotic to predict); risk skewed to the downside below $100-105k near-term; stablecoins to overtake ACH volume; DEXs to capture >25% of spot volume.", "url": "https://www.galaxy.com/insights/research/predictions-2026-crypto-bitcoin-defi", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "Crypto lending markets held up through the June-July selloff with no major lender/fund/exchange failure, even as Bitcoin fell 20.1% in June to ~$58,700; but flags real stress in Strategy's (MSTR) preferred-equity structure — STRC fell to the $70s, mNAV compressed to ~1.07x.", "url": "https://www.galaxy.com/insights/perspectives/crypto-credit-remains-resilient-despite-macro-driven-market-volatility", "images": []}, {"source": "chainalysis", "name": "Chainalysis", "thesis": "Argues machine learning should not be used for core blockchain-forensics claims because it can't meet the deterministic 'structural soundness standard' needed to survive Daubert-standard court scrutiny — contrarian relative to the industry's broader ML-forensics trend.", "url": "https://www.chainalysis.com/blog/ml-role-in-blockchain-intelligence/", "images": []}]}, {"theme": "Energy & Commodities", "category": ["energy", "commodities"], "consensus": "Gold has the broadest bullish consensus in the batch: UBS targets $5,400/oz (12-month) and Standard Chartered $4,900/oz, both citing rising debt burdens, currency-financing uncertainty, and the dollar's softness as the 'pressure valve' for Treasury's efforts to contain long-end yields. On oil, most houses read Middle East disruption risk as contained rather than escalating (Gavekal, Brookings via China's posture) even as it continues to support prices and reshape capital allocation (Wood Mackenzie: Asian NOCs/IOCs reallocating capital back toward APAC).", "divergence": "OPEC provides the clearest counter-narrative in the entire dataset, arguing that 666 million people still lack electricity access and that no group that large has ever gained access in a comparable window using a restricted set of energy sources — a direct pushback on the SDG7-2030 renewables-only framing that most institutional climate-adjacent research assumes. On the EV transition specifically, Wood Mackenzie's own base case (EVs at 25% of global fleet by 2040) sits well below its own flagged 'electric shock' scenario (a faster-adoption path that could cut 2040 oil demand by an additional 5mb/d to 99mb/d and force ~40 refinery closures) — a genuine internal range rather than a house-vs-house split, but one that matters for positioning given how differently the two paths treat refining and legacy energy capex.", "items": [{"source": "opec", "name": "OPEC", "thesis": "Contrarian pro-hydrocarbon argument: 666 million people still lack electricity access (would be the world's 3rd-most-populous country); no group that large has ever gained access in a 4-year window using a restricted set of energy sources; current SDG7-2030 renewables-only guidance is unrealistic without hydrocarbons.", "url": "https://www.opec.org/pn-detail/1582274-5-february-2026.html", "images": []}, {"source": "ubs", "name": "UBS", "thesis": "Gold price target of $5,400/oz over the next 12 months, citing rising debt burdens and currency-financing uncertainty; gold up more than 4.3% on the week to $4,560/oz already.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-21082026.html", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Constructive on gold, targeting $4,900/oz (having broken above $4,400/oz), on continued USD softness as the pressure-release valve for Treasury's yield-containment efforts — though flags rapid-rally profit-taking risk near-term.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-21-8-2026/?mvog=1", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "thesis": "Base case: global EVs rise from 4% of fleet today to 25% by 2040; an 'electric shock' scenario could push adoption 50% above base case, cutting oil demand to 99mb/d by 2040 (5mb/d below base, forcing ~40 refinery closures); needs ~$45bn additional greenfield metals investment.", "url": "https://www.woodmac.com/press-releases/energy-volatility-could-fast-track-global-ev-adoption-to-50-above-base-case/", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "thesis": "With >80% of Middle East oil/gas exports normally destined for APAC, the Strait of Hormuz disruption is driving a structural reset: renewed energy-security focus, limited near-term supply growth, decoupling of price upside from value upside, and Asian NOCs/IOCs reallocating capital back toward APAC.", "url": "https://www.woodmac.com/news/opinion/5-ways-the-middle-east-crisis-has-changed-apac-upstream/", "images": []}, {"source": "invesco", "name": "Invesco (SteelPath)", "thesis": "Midstream equities (Alerian MLP Index) outperformed sharply in July (+6.85% price/+7.56% total return vs S&P 500's -0.06%), attributed to Middle East conflict lifting commodity prices and restricted Strait of Hormuz traffic boosting LPG exports.", "url": "https://www.invesco.com/us/en/insights/latest-steelpath-commentary-on-midstream-energy-infrastructure-industry.html", "images": []}]}, {"theme": "AI & Tech", "category": ["ai_tech"], "consensus": "Nearly every house agrees AI capex is still accelerating, not decelerating: Standard Chartered raised its 2026 AI capex forecast to +85% y/y to $750bn (reaching $1tn in 2027, 33% CAGR through 2030) after on-the-ground meetings with industry leaders; Schroders cites Goldman's estimate hyperscalers could deploy ~$5.3tn of capital 2025-2030; Invesco puts 2026/2027 capex above $650bn/$700bn. Franklin Templeton/Putnam agrees capex may still be underestimated but reframes the key question as monetization, not spend — pricing power, distribution and switching costs will determine who captures AI economics, not model performance alone.", "divergence": "Oxford Economics is the sharpest dissenter on durability, arguing the global AI order is splitting into a US-led 'Pax Silica' and a China-led 'WAICO' running an 'overcapacity playbook' similar to prior Chinese manufacturing cycles — but with near-zero marginal cost of cross-border model distribution making the competitive impact potentially larger than past cycles, eroding the US AI moat fastest at the model layer even as it holds up better at compute; this directly questions hyperscaler valuations that the capex-bull consensus assumes are durable. Gavekal Research adds a distinct, complementary worry: a rollover in the AI capex boom would hit corporate profits economy-wide (not just Nvidia-style direct beneficiaries), erase the equity wealth effect supporting consumption, and remove a key support for bond yields — a scenario none of the capex-bull houses model explicitly. JPMorgan flags a narrower but concrete near-term bottleneck: an AI-driven DRAM memory shortage with knock-on inflation and cybersecurity risk.", "items": [{"source": "oxford_economics", "name": "Oxford Economics", "thesis": "Frames the global AI order as splitting into a US-led 'Pax Silica' vs a China-led 'WAICO' running an 'overcapacity playbook'; argues the US AI moat is eroding fastest at the model layer even as it holds up better at compute — raising questions over hyperscaler valuations.", "url": "https://www.oxfordeconomics.com/resource/the-moat-illusion-chinas-bid-to-deflate-us-ai-valuations/", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "thesis": "Raised AI capex forecast to +85% y/y in 2026 to $750bn, reaching $1tn in 2027, 33% CAGR 2025-30 (from 32%), after on-the-ground meetings with AI industry leaders in the US, Taiwan and Korea; reiterates positive view on Big Tech and semiconductors.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-21-8-2026/?mvog=1", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Warns a rollover in the AI capex boom would hit corporate profits economy-wide, erase the equity-driven wealth effect supporting US consumption, and remove a key support for bond yields via reduced corporate borrowing — contrarian caution against consensus AI-bull positioning.", "url": "https://research.gavekal.com/teaser/how-sustainable-is-the-ai-capex-boom/", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton (Putnam)", "thesis": "AI capex may still be underestimated (demand broadening beyond GPUs into memory, networking, optical, custom silicon), but monetization is now the key test — winners determined by pricing power, distribution and switching costs, not model performance alone; a 'monetization per gigawatt' metric is key to watch.", "url": "https://www.franklintempleton.com/articles/2026/putnam/who-will-earn-the-returns-on-the-ai-buildout", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "thesis": "Frames AI inference as a trading-venue market structure — buyers, a marketplace (OpenRouter, ~5.5% take rate), and market-making sellers (Fireworks, Baseten, Together AI); no frontier model has led >100 days since GPT-4, compressing frontier-lab amortization windows to ~4 months.", "url": "https://www.galaxy.com/insights/perspectives/inference-market-and-micro-structure", "images": []}, {"source": "jpmorgan", "name": "JPMorgan", "thesis": "Flags an AI-driven DRAM memory shortage as a new self-reinforcing bottleneck in AI expansion, with knock-on effects on inflation and cybersecurity risk.", "url": "https://www.jpmorgan.com/insights/global-research/artificial-intelligence/dram-memory-shortage-from-ai", "images": []}]}, {"theme": "Geopolitics & EM/China", "category": ["geopolitics", "em"], "consensus": "On Taiwan, Brookings' on-the-ground delegation finds Washington's fixation on a 2027 invasion window overstated — Xi is mid-purge of the Central Military Commission and needs time to reconstitute it, with 2028 (Taiwan's own elections) a more likely inflection point — while flagging gray-zone coercion, not an invasion, as the daily reality. On Russia-Ukraine, Carnegie sees a real but limited 'vibe shift' toward Ukraine, with Putin showing no sign of altering his war aims — expect a protracted war rather than near-term resolution. Most houses treat Middle East disruption as being actively managed down rather than escalating, including by China itself (Brookings/Zhao Long: China's priority is containing spillover, not exploiting US distraction).", "divergence": "On China's broader threat framing, Gavekal is explicitly contrarian to the mainstream Western view: it rejects the common 'house of cards vs. most dangerous threat' dichotomy, arguing China is optimized for social stability, not growth/profit maximization — a framing that also underpins Gavekal's more constructive read (with Peterson Institute providing the counterweight) on the new Saudi-Turkey-Pakistan defense pact, which Gavekal expects to stabilize Western Asia as the US scales back its regional presence, versus the 'Middle East NATO' alarm implied elsewhere. On EM positioning specifically, Gavekal's 'EMs are the new DMs' argues EM local-currency sovereign bonds have outperformed developed-market bonds by nearly 40 percentage points since March 2020 because EM policymakers learned fiscal-discipline lessons DM counterparts have not — directly at odds with BCA Research's view (see USD & FX) that EM equities will NOT benefit from a weaker dollar this cycle, a genuine disagreement about whether the EM-outperformance regime extends to equities or is confined to local bonds.", "items": [{"source": "brookings", "name": "Brookings Institution", "thesis": "On-the-ground Taipei debrief: a full-scale Chinese invasion by 2027 is seen as unlikely given Xi's ongoing military purge; Washington is seen as overly fixated on high-end invasion risk versus the daily gray-zone coercion Taiwan actually experiences; a stalled $14bn US arms package and domestic political gridlock are flagged as the key signals to watch.", "url": "https://www.brookings.edu/articles/how-secure-is-taiwan-the-view-from-taipei/", "images": []}, {"source": "carnegie", "name": "Carnegie Endowment", "thesis": "Battlefield is a positional/attritional stalemate; the media 'vibe shift' toward Ukraine is real but limited — Putin shows no sign of altering his war aims; expects a protracted war, and argues Russian elite fracturing/economic pain is minimal.", "url": "https://carnegieendowment.org/emissary/2026/08/russia-ukraine-war-vibe-shift-summer-offensive", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "Rejects the common Western framing of China as simultaneously a 'house of cards' and 'the most dangerous threat' — argues China is optimized for social stability, not growth/profit maximization, explicitly contrarian to mainstream China-bear/China-threat narratives.", "url": "https://research.gavekal.com/teaser/profit-maxing-and-social-anti-fragility/", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "thesis": "EM local-currency sovereign bonds have outperformed developed-market bonds by nearly 40pp since March 2020, framing EM policymakers as having learned fiscal-discipline lessons DM counterparts have not yet absorbed.", "url": "https://research.gavekal.com/teaser/ems-are-the-new-dms/", "images": []}, {"source": "peterson_institute", "name": "Peterson Institute for International Economics", "thesis": "China has moved to an 'economic security growth model' where national-security logic underpins economic policy (dual circulation, self-reliant innovation, coercion-response toolkit); warns this creates implementation tensions that could deepen the US-China security dilemma.", "url": "https://www.piie.com/publications/working-papers/2026/chinas-economic-security-growth-model-and-implications-us-china", "images": []}, {"source": "brookings", "name": "Brookings Institution", "thesis": "Nearly half of US import value is exempt from newer Section 232/forced-labor tariffs globally, but for China less than 20% is exempt and only 16% is free of both new and legacy tariffs; the new US-China Board of Trade's '$30bn of non-sensitive goods' pledge remains poorly defined.", "url": "https://www.brookings.edu/articles/the-hidden-tradeoffs-of-using-trumps-tariffs-as-leverage-with-china/", "images": []}]}], "B_calls": [{"source": "rbc", "name": "RBC Capital Markets", "call": "S&P 500 target of 8150 over the next 12 months (+11.4%), average/median of five models, expecting a non-linear path.", "category": ["equities"], "url": "https://www.rbccm.com/en/insights/2026/08/the-voice-who-sets-the-pace-for-aussie-traders", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "call": "S&P 500 year-end target range of 7400-7800 on 15%+ EPS growth; 2026/2027 consensus EPS $362.25 (+23% Y/Y) / $405.16 (+13% Y/Y); 25 S&P 500 firms have quantified an average +180bps AI margin benefit.", "category": ["equities"], "url": "https://www.franklintempleton.com/articles/series/from-the-market-desk", "images": []}, {"source": "ubs", "name": "UBS", "call": "Gold price target USD 5,400/oz over the next 12 months; USD/CNY forecast toward 6.50 by mid-2027; favors carry in GBP, NOK, AUD, NZD.", "category": ["commodities", "fx"], "url": "https://www.ubs.com/global -themes", "images": []}, {"source": "wood_mackenzie", "name": "Wood Mackenzie", "call": "'Electric shock' scenario: global oil demand falls to 99mb/d by 2040 (5mb/d below base case) if EV adoption accelerates beyond the base case (25% of global fleet by 2040); ~40 refineries could close; China EV sales could reach 29.9m/yr by 2040.", "category": ["energy", "commodities"], "url": "https://www.woodmac.com/horizons-live/horizons-live-electric-shock/", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "call": "BTC to reach $250k by year-end 2027; near-term risk skewed to the downside below $100-105k; US spot crypto ETF net inflows to exceed $50bn in 2026 (vs $23bn in 2025); DEXs to capture >25% of spot volume by YE2026.", "category": ["crypto"], "url": "https://www.galaxy.com/insights/research/predictions-2026-crypto-bitcoin-defi", "images": []}, {"source": "coinshares", "name": "CoinShares", "call": "~$80,000 flagged as the key near-term upper boundary for Bitcoin, contingent on Fed Chair Warsh's Jackson Hole signal; digital-asset ETPs took in $2.2bn in one week (largest weekly inflow of the year).", "category": ["crypto"], "url": "https://coinshares.com/insights/research-data/market-update-20-08-2026/", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "call": "Prefer 3-5yr maturity US Treasuries; 10yr UST fair range 4.50-4.75% (buy above 4.75%); raised AI capex forecast to $750bn in 2026, $1tn in 2027.", "category": ["rates", "ai_tech"], "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-21-8-2026/?mvog=1", "images": []}, {"source": "franklin_templeton", "name": "Franklin Templeton", "call": "Backtest-based tilt: 70% US / 10% each South Korea, Taiwan, Japan generated ~25% 3-yr annualized return vs ~19% for all-US, as of July 31, 2026 — proposed complement to broad EM allocations.", "category": ["equities", "em"], "url": "https://www.franklintempleton.com/articles/2026/etf/a-bigger-basket-isnt-always-a-more-diversified-one", "images": []}, {"source": "lazard", "name": "Lazard", "call": "Full-year 2026 PE secondary market transaction volume forecast at $275bn, after a record $124bn H1 (+28% YoY); GP-led and LP-led deals both hit record highs.", "category": ["credit", "private_markets"], "url": "https://www.lazard.com/research-insights/lazard-interim-2026-secondary-market-report/", "images": []}, {"source": "barclays", "name": "Barclays", "call": "UK public M&A at highest level since 2018; UK corporate M&A volumes +75% vs FY2025, sponsor public-to-private volumes +97%; inbound overseas UK M&A rose from $38bn to $77bn YoY.", "category": ["equities"], "url": "https://www.ib.barclays/content/barclaysmicrosites/ibpublic/en/our-insights/3-point-perspective/uk-public-m-and-a-five-questions-clients-are-asking-in-2026.html", "images": []}, {"source": "peterson_institute", "name": "Peterson Institute for International Economics", "call": "Section 301 forced-labor tariffs (10-12.5%) are 40-50x larger than economically justified by trade in forced-labor goods, undermining their credibility as a replacement for the invalidated 'reciprocal' tariffs.", "category": ["geopolitics"], "url": "https://www.piie.com/publications/policy-briefs/2026/new-section-301-tariffs-forced-labor-are-vastly-excessive", "images": []}, {"source": "gavekal", "name": "Gavekal Research", "call": "Treasury's doubled long-dated buyback cap ($2bn to $4bn per operation) is framed as bearish for the US dollar since capping yields without QE 'has no free lunch.'", "category": ["rates", "fx"], "url": "https://research.gavekal.com/teaser/did-bessent-just-put-a-cap-on-the-us-dollar/", "images": []}], "C_deep_reads": [{"source": "pimco", "name": "PIMCO", "title": "A World of Opportunity (Accrued Interest podcast with Andrew Balls)", "summary": "PIMCO's global fixed income CIO lays out the firm's 'Rupture and Resilience' secular thesis: expect repeated volatility episodes across G10 bond markets as high debt levels leave fiscal and monetary policy little slack, with politics increasingly driving economics. Details active curve positioning — overweight the long end of the JGB curve vs 2y/10y, favoring the UK front end over 30y gilts ahead of the October budget — discusses confusing/incoherent BOJ-MOF-US currency intervention (buying yen, selling euro rather than dollar), and describes massive US tech-sector bond issuance funding the AI buildout as 'sucking' capital from global credit markets, making PIMCO cautious on generic tech exposure while seeking bespoke, well-structured deals.", "url": "https://www.pimco.com/us/en/insights/podcasts/accrued-interest/a-world-of-opportunity", "images": []}, {"source": "standard_chartered", "name": "Standard Chartered", "title": "Weekly Market View: Watching Warsh at Jackson Hole", "summary": "Flagship weekly finding US bond markets have reached a 'pain threshold' for the administration after the 30-year yield hit its highest level since 2007; Treasury's surprise doubling of the long-end buyback size is read as an attempt to curb yields but unlikely to be a major driver against a $30tn marketable Treasury stock. Fed Chair Warsh's Jackson Hole speech is flagged as the key catalyst given his unprecedented lack of forward guidance. Holds a non-consensus view that US inflation already peaked in Q2, prefers 3-5-year maturity bonds, and — after on-the-ground meetings with AI industry leaders across the US and Asia — significantly raises its AI capex estimates through 2030 while staying bullish on US tech/communications-services equities.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-21-8-2026/?mvog=1&source=podcast", "images": []}, {"source": "brookings", "name": "Brookings Institution (The Beijing Brief)", "title": "How secure is Taiwan? The view from Taipei", "summary": "A one-week Brookings delegation study tour in Taipei finds Washington's fixation on a 2027 Chinese invasion overstated — Xi is mid-purge of the Central Military Commission (as much as 53% of the high command reportedly dismissed) and needs time to reconstitute it, making 2028 (Taiwan's own elections) the more likely inflection point. Taiwan's economic decoupling from China is real (FDI into China down from ~80% a decade ago to <1%) even as growth topped 13% last quarter, driven partly by US AI-chip demand. Washington is seen as overweighting high-end invasion scenarios relative to the daily gray-zone coercion (naval/Coast Guard incursions) Taiwan actually experiences; domestic political gridlock is blocking a special defense budget, and a stalled $14bn US arms package is fueling anxiety about US commitment.", "url": "https://www.brookings.edu/articles/how-secure-is-taiwan-the-view-from-taipei/", "images": []}, {"source": "galaxy_digital", "name": "Galaxy Digital", "title": "The Agentic Flywheel / Inference Market Microstructure / 26 Predictions for 2026 (research series)", "summary": "Across a cluster of original pieces, Galaxy's research team makes the case that crypto is becoming the default financial substrate for autonomous 'Zero Human Company' AI agents (no KYC needed for wallets), documents real early revenue (Felix Craft/Masinov: >$120k revenue in 30 days; Giza's ARMA agent: 25,000 deployed, >$35m capital), and separately frames AI inference itself as a trading-venue market structure — buyers, an OpenRouter-style marketplace (~5.5% take rate, room for PFOF-style flow payments), and market-making inference-provider sellers, with no frontier model leading more than 100 days since GPT-4 and compressing frontier-lab amortization windows to ~4 months. The flagship '26 Predictions' piece targets BTC at $250k by YE2027, alongside 25 other specific calls spanning stablecoins, DeFi, TradFi integration and policy.", "url": "https://www.galaxy.com/insights/research/predictions-2026-crypto-bitcoin-defi", "images": []}, {"source": "capital_economics", "name": "Capital Economics", "title": "This time has been different: How Europe weathered this energy shock", "summary": "Group Chief Economist Neil Shearing argues the 2026 Middle East energy shock is a poor read-through from 2022's Russia-Ukraine shock because Europe has proven structurally more resilient — UK GDP +0.4% q/q Q2, eurozone +0.4% (0.3% ex-Ireland), Poland +0.9%. The piece explicitly downplays AI as the resilience driver (UK ICT strength attributed more to media/marketing, possibly World Cup-related, than AI). Instead credits a smaller terms-of-trade shock and materially reduced fossil-fuel dependence: euro-zone oil import volumes down ~10% and gas import volumes down ~15% versus 2022, aided by a rising renewables share and efficiency gains.", "url": "https://www.capitaleconomics.com/blog/time-has-been-different-how-europe-weathered-energy-shock", "images": []}, {"source": "kkr", "name": "KKR", "title": "Asia Real Estate: Leaning Into Structural Themes in a Higher-Rate World", "summary": "KKR's regional outlook argues the APAC real estate cycle has decoupled from the West (record $47.0bn Q1 2026 investment volumes, +31% YoY) and that the era of cap-rate compression is over given higher-for-longer rates region-wide; returns must now come from structural NOI growth and active operational value creation. Japan is the highest-conviction market: ~¥820tn (~$5.1tn, >10x the actively-traded universe) of corporate-held real estate is being unlocked through governance reform, supported by >5% Shunto wage growth for a third straight year feeding into ~4% prime office rent growth. Korea logistics has moved from oversupply to scarcity; Australia is more selective, favoring specialty living and cold-storage logistics.", "url": "https://www.kkr.com/insights/asia-real-estate-structural-themes", "images": []}, {"source": "vanguard", "name": "Vanguard (via T. Rowe Price)", "title": "The AI Buildout Comes to the Bond Market", "summary": "Documents how hyperscaler (Alphabet, Amazon, Meta, Microsoft, Oracle) bond issuance jumped from a ~$35bn/yr average (2020-24) to $93bn in 2025 and ~$132bn YTD 2026, including a ~$53bn multi-tranche deal — one of the largest corporate bond sales on record — and a rare 100-year 'century' bond. Full-2026 AI-related issuance across the ecosystem is estimated at $300-570bn. Tech's share of the Bloomberg US Corporate Bond Index is rising quickly, issuance skews long-dated (extending index duration), and a meaningful share of data-center financing is migrating to private credit/off-balance-sheet structures — reshaping fixed income's traditional diversifying role as hyperscaler capex heads toward $800bn this year and above $1tn annually 2027-2030.", "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/vemo/ai-buildout-comes-to-bond-market.html", "images": []}, {"source": "oxford_economics", "name": "Oxford Economics", "title": "The Moat Illusion: China's Bid to Deflate US AI Valuations", "summary": "Frames the global AI order as splitting into a US-led 'Pax Silica' (trusted chips/compute/supply chains) versus a China-led 'WAICO' (lower-cost, more open models, capacity-building), with China running an 'overcapacity playbook' on AI models analogous to prior manufacturing cycles — but with near-zero marginal cost of cross-border model distribution potentially making the competitive impact larger than past cycles. Argues the US AI moat is eroding unevenly: fastest at the model layer, more durable at compute, and increasingly constrained domestically by state-level power/permitting friction — directly questioning hyperscaler valuation assumptions that most of the sell-side capex-bull consensus takes for granted.", "url": "https://www.oxfordeconomics.com/resource/the-moat-illusion-chinas-bid-to-deflate-us-ai-valuations/", "images": []}], "D_charts": [{"source": "bnp_paribas", "name": "BNP Paribas", "chart": "Three-exhibit set showing oil prices vs government bond yields diverging since June, market-implied long-run fed funds forecasts at their highest since 2011, and value-oriented indices gaining versus tech indices declining as yields rise — underpinning the argument that the bond selloff is driven by term premium, not oil or debt panic.", "url": "https://viewpoint.bnpparibas-am.com/view-from-the-markets-what-is-and-is-not-behind-the-bond-sell-off-and-what-it-means-for-equities/", "images": ["https://viewpoint.bnpparibas-am.com/wp-content/uploads/2026/08/Exhibit-1-Oil-prices-a-key-but-not-the-only-factor-driving-bond-yields.png", "https://viewpoint.bnpparibas-am.com/wp-content/uploads/2026/08/Exhibit-2-Inflation-expectations-are-average-and-year-end-fed-funds-forecasts-dropping.png", "https://viewpoint.bnpparibas-am.com/wp-content/uploads/2026/08/Exhibit-3-Value-oriented-indices-gaining-from-higher-rates-while-tech-indices-drop.png"]}, {"source": "franklin_templeton", "name": "Franklin Templeton", "chart": "MSCI Europe global revenue exposure (58.7% overseas) plotted against the regional valuation discount versus MSCI US by sector, plus European M&A deal value by acquirer region — supporting the case that Europe's valuation gap is starting to close.", "url": "https://www.franklintempleton.com/articles/2026/equity/european-exceptionalism-on-sale", "images": ["https://franklintempletonprod.widen.net/content/aanrxaa9eg/webp/european-exceptionalism-tgi-08-26-ex1.png", "https://franklintempletonprod.widen.net/content/8dfwfcu1ny/webp/european-exceptionalism-tgi-08-26-ex2.png"]}, {"source": "pimco", "name": "PIMCO", "chart": "Figures showing BDC credit-vs-equity performance decoupling, the widening gap between broadly-syndicated-loan prices and BDC portfolio marks, and the erosion of the BDC origination yield premium from >300bps (2017-18) to <100bps (Q1 2026).", "url": "https://www.pimco.com/us/en/insights/the-credit-market-lens-what-bdc-markets-are-signaling-about-private-credit-valuations", "images": ["https://www.pimco.com/us/en/-/media/global-assets/insights/economic-and-market-commentary/the-credit-market-lens/08/the-credit-market // ---------- helpers ----------
const CAT_VARS = {
  rates: 'var(--cat-rates)',
  growth: 'var(--cat-growth)',
  fx: 'var(--cat-fx)',
  equities: 'var(--cat-equities)',
  credit: 'var(--cat-credit)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  commodities: 'var(--cat-commodities)',
  geopolitics: 'var(--cat-geopolitics)',
  ai_tech: 'var(--cat-ai_tech)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }
function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}
function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}
function pills(cats) {
  if (!cats) return '';
  if (Array.isArray(cats)) return cats.map(pill).join(' ');
  return pill(cats);
}
function externalLink(url, label) {
  if (!url) return '';
  return `<a class="item-link" href="${escapeAttr(url)}" target="_blank" rel="noopener">${label || 'link →'}</a>`;
}
function nameLink(url, name) {
  if (!name) return '';
  if (!url) return `<span class="item-source">${escapeHtml(name)}</span>`;
  return `<a class="item-source" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderThemeItem(it) {
  return `
    <div class="theme-item">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.thesis || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderTheme(theme) {
  const items = (theme.items || []).map(renderThemeItem).join('');
  return `
    <div class="theme">
      <div class="theme-head">
        ${pills(theme.category)}
        <div class="theme-title">${escapeHtml(theme.theme || '')}</div>
      </div>
      <div class="theme-stance">
        ${theme.consensus ? `<div class="theme-line consensus"><span class="lbl">Consensus</span>${renderBold(theme.consensus)}</div>` : ''}
        ${theme.divergence ? `<div class="theme-line divergence"><span class="lbl">Divergence</span>${renderBold(theme.divergence)}</div>` : ''}
      </div>
      ${items ? `<div class="theme-items">${items}</div>` : ''}
    </div>`;
}

function renderCall(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${pills(it.category)}
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.call || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderDeepRead(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url, 'read →')}
      </div>
      ${it.title ? `<div class="item-title">${escapeHtml(it.title)}</div>` : ''}
      <div class="item-text">${renderBold(it.summary || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderChart(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.chart || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderHouseView(hv) {
  const name = hv.name || hv.source || '';
  const nameHtml = hv.url
    ? `<a class="hv-name" href="${escapeAttr(hv.url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`
    : `<span class="hv-name">${escapeHtml(name)}</span>`;
  return `
    <div class="hv-row">
      ${nameHtml}
      <span class="hv-stance">${renderBold(hv.stance || '')}</span>
    </div>`;
}

function renderSection(letter, name, items, render, extraClass) {
  if (!items || !items.length) return '';
  const body = items.map(render).join('');
  const cls = 'section' + (extraClass ? (' ' + extraClass) : '');
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderTopStats(d) {
  const parts = [];
  const p = d.period || {};
  const is = d.input_stats || {};
  const cv = d.coverage || {};
  if (p.from && p.to)
    parts.push(`period <strong>${escapeHtml(p.from)} → ${escapeHtml(p.to)}</strong>`);
  else if (p.lookback_days != null)
    parts.push(`lookback <strong>${p.lookback_days}d</strong>`);
  if (is.total_articles != null) parts.push(`articles <strong>${is.total_articles}</strong>`);
  if (is.sources_present != null) parts.push(`sources <strong>${is.sources_present}</strong>`);
  if (is.after_filter != null) parts.push(`after filter <strong>${is.after_filter}</strong>`);
  if (cv.coverage_pct != null) {
    const pct = (cv.coverage_pct <= 1 ? cv.coverage_pct * 100 : cv.coverage_pct);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  } else if (cv.sources_covered != null && cv.sources_total != null) {
    parts.push(`coverage <strong>${cv.sources_covered}/${cv.sources_total}</strong>`);
  }
  return parts.join(' | ');
}

function reportDate(d) {
  if (d.period && d.period.to) return d.period.to;
  if (d.collected_at) return String(d.collected_at).slice(0, 10);
  return '';
}

// ---------- interactions ----------
function toggleSection(headEl) { headEl.parentElement.classList.toggle('open'); }
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('lightbox').classList.contains('open')) {
    closeLightbox();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = reportDate(d);
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  const s = d.sections || {};
  const out = [
    renderSummary(d.summary),
    renderSection('A.', 'Debates — Consensus vs Divergence', s.A_debates,    renderTheme),
    renderSection('B.', 'Key Calls & Positioning',           s.B_calls,      renderCall),
    renderSection('C.', 'Notable Deep Reads',                s.C_deep_reads, renderDeepRead,
                  'section-deepreads'),
    renderSection('D.', 'Charts & Data',                     s.D_charts,     renderChart),
    renderSection('E.', 'House Views',                       s.house_views,  renderHouseView),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = out || '<div class="empty">No report data.</div>';

  // Auto-open Summary's section view: first two sections open by default.
  document.querySelectorAll('.section').forEach((sec, i) => {
    if (i < 2) sec.classList.add('open');
  });
}

renderReport(REPORT_DATA);
</script>
