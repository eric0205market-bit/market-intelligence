A, Apple) to mundane update failures, plausibly accelerated by organizations rushing patches for bugs found with Anthropic's Mythos model, not cyberattacks. It also covers Anthropic's ~$1.5 trillion IPO (ticker ANT) amid midterm anti-data-center votes, Nvidia's $115.8 billion quarter after Jensen Huang's resignation, and a new US rule to stop Chinese firms renting advanced AI chips offshore ahead of Trump's meeting with Xi.", "themes": [{"theme": "Outage cluster: mundane causes", "insights": [{"claim": "In one week, Microsoft Outlook and Teams went down for about 24 hours, the FAA imposed a nationwide ground stop of more than four hours (only the second since 9/11 and the longest since), JPMorgan Chase's problem disrupted other banks as counterparties, United delayed over a hundred flights, the NSA classified network failed and an internal update knocked out iCloud and Apple Pay; all said the incidents were not cyberattacks.", "speaker": "Brian Barrett", "type": "data_point", "entities": ["Microsoft", "FAA", "JP Morgan Chase", "United Airlines", "NSA", "Apple"], "conviction": "high", "so_what": "A cluster of reliability failures across critical services raises operational-risk scrutiny and potential regulatory pressure on change management.", "quote": null, "locator": "Last Thursday, Microsoft had an outage in Outlook and Teams", "quote_verified": false}, {"claim": "Microsoft's Outlook outage traced to a fix deployed in July that propagated across the network and was only triggered by a later update, while the FAA communications failure traced to old fiber equipment maintained by L3Harris during an update pushed on a Friday afternoon.", "speaker": "Brian Barrett", "type": "causal", "entities": ["Microsoft", "FAA", "L3Harris"], "conviction": "high", "so_what": "Aging air-traffic-control infrastructure and contractor change-management practices are a liability for L3Harris and an argument for FAA modernization spending.", "quote": null, "locator": "The Microsoft Outlook issue was actually", "quote_verified": false}, {"claim": "WIRED's hosts argue the outage cluster may be an indirect AI effect: organizations given access to Anthropic's cybersecurity-focused Mythos model are finding previously undetectable bugs and pushing patches at a huge rate, and the more complex the fixes pushed simultaneously, the more likely something breaks.", "speaker": "Brian Barrett", "type": "causal", "entities": ["Anthropic", "Mythos", "AI vulnerability discovery"], "conviction": "medium", "so_what": "AI-driven bug discovery may create a near-term wave of patch-induced outages, boosting demand for safe-deployment and rollback tooling.", "quote": "Sending patches at a huge rate, and the more complicated the bug, the more patches trying to push out at the same time, the more likely something is going to break.", "locator": "This goes back to Anthropic's Mythos model", "quote_verified": true}, {"claim": "Public suspicion that the outages were attacks was amplified by distrust of the government, with Secretary of State Marco Rubio insisting there is zero evidence the incidents are related, while Trump dismissed them as 'life' for big and powerful countries.", "speaker": "Brian Barrett", "type": "thesis", "entities": ["Marco Rubio", "Donald Trump", "Markwayne Mullin"], "conviction": "medium", "so_what": "Low institutional credibility means outage events can trigger outsized consumer panic, such as reported doomsday prepping at Costco.", "quote": "We have no indication, no evidence, and no reason to believe at all that any of these incidents are related to each other.", "locator": "Marco Rubio, archival audio:", "quote_verified": true}]}, {"theme": "Anthropic IPO as AI bellwether", "insights": [{"claim": "Anthropic went public under the ticker ANT at a reported valuation of about $1.5 trillion, among the biggest IPOs ever but below the $2 trillion figure floated several months earlier.", "speaker": "Brian Barrett", "type": "data_point", "entities": ["Anthropic", "ANT"], "conviction": "high", "so_what": "The valuation step-down from $2 trillion signals cooling AI sentiment after Nvidia's turmoil and midterm data-center backlash.", "quote": null, "locator": "So Anthropic finally arrived on the stock market", "quote_verified": false}, {"claim": "Amazon will own about 15 percent and Google nearly 14 percent of newly public Anthropic, illustrating how AI financing ties the major giants together.", "speaker": "Brian Barrett", "type": "data_point", "entities": ["Amazon", "Google", "Anthropic"], "conviction": "high", "so_what": "Anthropic's market value flows directly into Amazon and Google balance sheets, so ANT price moves are a read-through for both.", "quote": null, "locator": "I mean, I think it is the bellwether, right?", "quote_verified": false}, {"claim": "Anthropic takes a rent-not-own approach to compute, with nearly a trillion dollars of data-center commitments flowing to other companies such as SpaceX and Google, making it a symbol of AI-industry interdependency.", "speaker": "Brian Barrett", "type": "framework", "entities": ["Anthropic", "SpaceX", "Google", "data centers"], "conviction": "medium", "so_what": "Circular AI financing concentrates systemic risk: a stumble at Anthropic would hit its compute suppliers' revenue backlogs.", "quote": null, "locator": "And not just that, but Anthropic, they're like a rent-not-own", "quote_verified": false}, {"claim": "The hosts call Anthropic the biggest pure-play AI IPO so far, contrasting it with SpaceX's recent IPO, described as a rocket company with an AI company stapled to it, and note OpenAI's listing remains a pending question.", "speaker": "Brian Barrett", "type": "thesis", "entities": ["Anthropic", "SpaceX", "OpenAI"], "conviction": "medium", "so_what": "ANT becomes the public-market benchmark for frontier AI lab valuation until OpenAI lists.", "quote": "SpaceX had an IPO recently, but that is a rocket company with an AI company stapled to it.", "locator": "But i , "entities": ["Xbox", "DJ Khaled", "Arizona Beverages"], "conviction": "medium", "so_what": "The launch is a cross-industry marketing moment, with console makers leveraging it to drive engagement.", "quote": null, "locator": "while Xbox is running a promotional campaign", "quote_verified": false}]}, {"theme": "Productivity-loss fears overblown", "insights": [{"claim": "One economist estimated the GTA VI release could cost the US economy $1 billion in lost productivity, but Carnegie Mellon economist Andy Garin calls such concerns overblown, comparing them to Olympics and World Cup speculation, especially when workers use allotted PTO.", "speaker": "Miles Klee", "type": "contrarian", "entities": ["Andy Garin", "Carnegie Mellon University", "US economy"], "conviction": "medium", "so_what": "Do not expect GTA VI to show up in macro data; a $1 billion hit is negligible relative to US GDP and largely absorbed by planned PTO.", "quote": "I don't think the release date of GTA VI will be that different than these sort of events that happen all the time", "locator": "Andy Garin, an associate professor of economics", "quote_verified": true}]}], "insight_total": 8, "top_entities": ["Grand Theft Auto VI", "Rockstar Games", "Take-Two", "BambooHR", "Logitech", "Riot Games", "Serhant", "Xbox", "Andy Garin", "Carnegie Mellon University"], "source_meta": {"author": "Miles Klee", "word_count": 1751, "paywalled": false}}, {"record_id": "c7e18116a2f162d7", "source_type": "technology", "source_name": "Wood Mackenzie", "source_url": "https://www.woodmac.com/news/opinion/what-defined-oil-gas-and-power-trading-in-2026/", "title": "What defined oil, gas and power trading in 2026? | Wood Mackenzie", "published_date": "2026-11-19", "language": "en", "processed_at": "2026-11-21T11:05:52Z", "processor": "claude-code-sub-opus", "tags": ["Energy", "Geopolitics"], "gist": "A Wood Mackenzie teaser for a gated year-end trading guide. It says Middle East conflict defined energy trading in 2026: disru // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
