const CAT_LABELS = { "macro":"macro","credit":"credit","positioning":"positioning","AI/infra":"AI/infra","crypto":"crypto",
  "geopolitics":"geopolitics","energy":"energy","tech":"tech","gold":"gold","culture":"culture","labor":"labor",
  "regulation":"regulation","science":"science","venture":"venture","climate":"climate" };
const CAT_VARS = { "macro":"--macro","credit":"--credit","positioning":"--positioning","AI/infra":"--aiinfra","crypto":"--crypto",
  "geopolitics":"--geopolitics","energy":"--energy","tech":"--tech","gold":"--gold","culture":"--culture","labor":"--labor",
  "regulation":"--regulation","science":"--science","venture":"--venture","climate":"--climate" };
const URG_META = { "actnow": { label: "🔴 Act Now" }, "deep": { label: "🔵 Deep" }, "watch": { label: "🟡 Watch" } };
const URG_EMOJI = { "actnow":"🔴", "deep":"🔵", "watch":"🟡" };

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function catColor(cat){
  const v = CAT_VARS[cat] || "--regulation";
  return getComputedStyle(document.documentElement).getPropertyValue(v).trim();
}

function buildFilterBars(){
  const catCounts = {};
  ITEMS.forEach(function(i){ catCounts[i.cat] = (catCounts[i.cat]||0)+1; });
  const catBar = document.getElementById("catBar");
  let html = '<button class="pill active" data-cat="all" onclick="setCat(\'all\')" style="border-color:#333;color:#333;">All (' + ITEMS.length + ')</button>';
  Object.keys(catCounts).sort().forEach(function(c){
    html += '<button class="pill" data-cat="' + c + '" onclick="setCat(\'' + c + '\')">' + c + ' (' + catCounts[c] + ')</button>';
  });
  catBar.innerHTML = html;

  const urgCounts = { actnow:0, deep:0, watch:0 };
  ITEMS.forEach(function(i){ urgCounts[i.urgency] = (urgCounts[i.urgency]||0)+1; });
  const urgBar = document.getElementById("urgBar");
  let uhtml = '<button class="pill active" data-urg="all" onclick="setUrg(\'all\')" style="border-color:#333;color:#333;">All (' + ITEMS.length + ')</button>';
  ["actnow","deep","watch"].forEach(function(u){
    uhtml += '<button class="pill" data-urg="' + u + '" onclick="setUrg(\'' + u + '\')">' + URG_META[u].label + ' (' + urgCounts[u] + ')</button>';
  });
  urgBar.innerHTML = uhtml;
  paintFilterActiveStates();
}

function paintFilterActiveStates(){
  document.querySelectorAll('#catBar .pill').forEach(function(btn){
    const c = btn.getAttribute('data-cat');
    if (c === activeCat){
      btn.classList.add('active');
      btn.style.background = c === 'all' ? '#333' : catColor(c);
      btn.style.borderColor = c === 'all' ? '#333' : catColor(c);
      btn.style.color = '#fff';
    } else {
      btn.classList.remove('active');
      btn.style.background = 'transparent';
      btn.style.borderColor = 'var(--border)';
      btn.style.color = 'var(--text)';
    }
  });
  document.querySelectorAll('#urgBar .pill').forEach(function(btn){
    const u = btn.getAttribute('data-urg');
    if (u === activeUrg){
      btn.classList.add('active');
      btn.style.background = '#333';
      btn.style.borderColor = '#333';
      btn.style.color = '#fff';
    } else {
      btn.classList.remove('active');
      btn.style.background = 'transparent';
      btn.style.borderColor = 'var(--border)';
      btn.style.color = 'var(--text)';
    }
  });
}

function setCat(c){ activeCat = c; activeSrc = null; renderCards(); paintFilterActiveStates(); }
function setUrg(u){ activeUrg = u; activeSrc = null; renderCards(); paintFilterActiveStates(); }

function filterBySrc(name){
  activeSrc = name;
  activeCat = "all"; activeUrg = "all";
  paintFilterActiveStates();
  renderCards(true);
}

function renderCards(expandMatches){
  const container = document.getElementById("cards");
  let html = "";
  ITEMS.forEach(function(item){
    const catMatch = activeCat === "all" || item.cat === activeCat;
    const urgMatch = activeUrg === "all" || item.urgency === activeUrg;
    const srcMatch = !activeSrc || item.source.indexOf(activeSrc) !== -1;
    if (!catMatch || !urgMatch || !srcMatch) return;
    const openClass = (expandMatches && activeSrc) ? " open" : "";
    const cc = catColor(item.cat);
    const chartFlag = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');
    html += '<div class="card' + openClass + '" id="card-' + item.id + '">';
    html += '<div class="card-head" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">#' + item.id + '</span>';
    html += '<span class="urg">' + URG_EMOJI[item.urgency] + '</span>';
    html += '<span class="src-badge" style="background:' + cc + ';">' + item.source + '</span>';
    html += '<span class="cat-tag">' + item.cat + '</span>';
    if (chartFlag) html += '<span class="chart-flag">' + chartFlag + '</span>';
    html += '<span class="title">' + item.title + '</span>';
    html += '</div>';
    html += '<div class="card-body">';
    html += '<div class="sec-label">The Idea</div><div class="idea">' + item.idea + '</div>';
    html += '<div class="sec-label">My Angle</div><div class="angle" style="border-left:3px solid ' + cc + ';background:' + cc + '14;">' + item.angle + '</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    html += '<div class="chartbox' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.count > 0 ? ('📊 ' + item.charts.count + ' chart(s) — ') : '') + item.charts.desc + '</div>';
    html += '<div class="linkrow"><a href="' + item.link + '" target="_blank" rel="noopener">↗ Read full article</a></div>';
    html += '</div></div>';
  });
  if (!html) html = '<p style="color:var(--muted);">No items match this filter.</p>';
  container.innerHTML = html;
}

function toggleCard(id){
  const el = document.getElementById('card-' + id);
  el.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function buildReport(){
  document.getElementById("metaLine").textContent =
    META.date + " · " + META.time + " · " + META.itemsExtracted + " items from " + META.emailsRead + " emails read (" + META.emailsInWindow + " in window)";

  let html = '<p><strong>Window:</strong> ' + META.windowStart + ' to ' + META.windowEnd + '. Emails outside this window were not processed.</p>';
  html += '<p>' + META.emailsInWindow + ' emails in window · ' + META.emailsRead + ' read in full · ' + META.itemsExtracted + ' items extracted.</p>';
  html += '<h4>Included Sources</h4><ul>';
  META.includedSources.forEach(function(s){
    html += '<li><span class="srcline" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span> — ' + s.emails + ' email(s), ' + s.items + ' item(s)</li>';
  });
  html += '</ul>';
  html += '<h4>Skipped Sources</h4><ul>';
  META.skippedSources.forEach(function(s){
    html += '<li class="skipline">' + s.name + ' — ' + s.reason + '</li>';
  });
  html += '</ul>';
  document.getElementById("reportBody").innerHTML = html;
  document.getElementById("reportToggle").addEventListener('click', function(){
    document.getElementById("reportCard").classList.toggle('open');
  });
}

buildFilterBars();
renderCards();
buildReport();
</script>
