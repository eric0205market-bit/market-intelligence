const URG_META = {
  act: { label: "🔴 Act Now", key: "act" },
  deep: { label: "🔵 Deep", key: "deep" },
  watch: { label: "🟡 Watch", key: "watch" }
};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function esc(s){
  return String(s).replace(/[&<>]/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;"})[c]; });
}

function renderMeta(){
  document.getElementById("metaLine").textContent =
    META.date + " · " + META.time + " · " + META.itemsExtracted + " items from " +
    META.includedSources.length + " sources";
}

function renderFilters(){
  const catCounts = {};
  ITEMS.forEach(function(i){ catCounts[i.cat] = (catCounts[i.cat]||0) + 1; });
  const catWrap = document.getElementById("catFilters");
  let catHtml = '<span class="pill' + (activeCat==="all"?" active":"") + '" style="' +
    (activeCat==="all" ? "background:#333;" : "") + '" onclick="setCat(\'all\')">All (' + ITEMS.length + ')</span>';
  Object.keys(catCounts).sort().forEach(function(c){
    const color = CAT_COLORS[c] || "#888";
    const isActive = activeCat === c;
    catHtml += '<span class="pill' + (isActive?" active":"") + '" style="' +
      (isActive ? ("background:"+color+";border-color:"+color+";") : "") +
      '" onclick="setCat(\'' + c + '\')">' + esc(c) + ' (' + catCounts[c] + ')</span>';
  });
  catWrap.innerHTML = catHtml;

  const urgCounts = {};
  ITEMS.forEach(function(i){ urgCounts[i.urgency] = (urgCounts[i.urgency]||0) + 1; });
  const urgWrap = document.getElementById("urgFilters");
  let urgHtml = '<span class="pill' + (activeUrg==="all"?" active":"") + '" style="' +
    (activeUrg==="all" ? "background:#333;" : "") + '" onclick="setUrg(\'all\')">All (' + ITEMS.length + ')</span>';
  Object.keys(URG_META).forEach(function(k){
    if(!urgCounts[k]) return;
    const isActive = activeUrg === k;
    urgHtml += '<span class="pill' + (isActive?" active":"") + '" style="' +
      (isActive ? "background:#333;border-color:#333;" : "") +
      '" onclick="setUrg(\'' + k + '\')">' + URG_META[k].label + ' (' + urgCounts[k] + ')</span>';
  });
  urgWrap.innerHTML = urgHtml;
}

function cardHtml(item){
  const color = CAT_COLORS[item.cat] || "#888";
  const urgEmoji = item.urgency === "act" ? "🔴" : (item.urgency === "watch" ? "🟡" : "🔵");
  const chartDot = (item.charts.count > 0 || item.charts.hot) ? '<span class="chart-dot">' + (item.charts.hot ? "🔥" : "📊") + '</span>' : "";
  let html = '<div class="card" id="card-' + item.id + '">';
  html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
  html += '<span class="idx">#' + item.id + '</span>';
  html += '<span>' + urgEmoji + '</span>';
  html += '<span class="badge" style="background:' + color + '">' + esc(item.source.split(" / ")[0]) + '</span>';
  html += '<span class="tag">' + esc(item.cat) + '</span>';
  html += chartDot;
  html += '<span class="title-text">' + esc(item.title) + '</span>';
  html += '</div>';
  html += '<div class="card-body">';
  html += '<div class="section-label">The Idea</div><div class="idea-text">' + esc(item.idea) + '</div>';
  html += '<div class="section-label">My Angle</div><div class="angle-box" style="border-left-color:' + color + ';background:' + color + '11;">' + esc(item.angle) + '</div>';
  html += '<div class="section-label">Tweets</div>';
  html += '<div class="tweets">';
  html += '<div class="tweet-box"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + esc(item.tweetA) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  html += '<div class="tweet-box"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + esc(item.tweetB) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
  html += '</div>';
  html += '<div class="charts-box' + (item.charts.hot ? " hot" : "") + '">' + (item.charts.count > 0 ? "📊 " : "") + esc(item.charts.desc) + '</div>';
  html += '<div class="link-row"><a href="' + item.link + '" target="_blank">↗ Read full article</a></div>';
  html += '</div></div>';
  return html;
}

function renderCards(){
  const wrap = document.getElementById("cardsWrap");
  let filtered = ITEMS.filter(function(i){
    if(activeCat !== "all" && i.cat !== activeCat) return false;
    if(activeUrg !== "all" && i.urgency !== activeUrg) return false;
    if(activeSrc && item_source_no_match(i)) return false;
    return true;
  });
  function item_source_no_match(i){
    return i.source.indexOf(activeSrc) === -1;
  }
  if(filtered.length === 0){
    wrap.innerHTML = '<div class="empty-note">No items match the current filters.</div>';
    return;
  }
  wrap.innerHTML = filtered.map(cardHtml).join("");
  if(activeSrc){
    filtered.forEach(function(i){
      const el = document.getElementById("card-" + i.id);
      if(el) el.classList.add("open");
    });
  }
}

function toggleCard(id){
  const el = document.getElementById("card-" + id);
  if(el) el.classList.toggle("open");
}

function setCat(c){
  activeCat = c;
  activeSrc = null;
  renderFilters();
  renderCards();
}
function setUrg(u){
  activeUrg = u;
  activeSrc = null;
  renderFilters();
  renderCards();
}
function filterBySrc(name){
  activeCat = "all";
  activeUrg = "all";
  activeSrc = name;
  renderFilters();
  renderCards();
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function renderReport(){
  let html = "";
  html += "<h4>Time Window</h4>";
  html += "<div>" + esc(META.windowStart) + " &rarr; " + esc(META.windowEnd) + ". Emails outside this window were not processed.</div>";
  html += "<h4>Totals</h4>";
  html += "<div>" + META.emailsInWindow + " emails in window · " + META.emailsRead + " read · " + META.itemsExtracted + " items extracted</div>";
  html += "<h4>Included Sources</h4>";
  html += META.includedSources.map(function(s){
    return '<div><span class="src-link" onclick="filterBySrc(\'' + esc(s.name) + '\')">' + esc(s.name) + '</span> — ' + s.count + ' item' + (s.count===1?"":"s") + '</div>';
  }).join("");
  html += "<h4>Skipped Sources</h4>";
  html += META.skippedSources.map(function(s){
    return '<div>' + esc(s.name) + ' — ' + esc(s.reason) + '</div>';
  }).join("");
  document.getElementById("reportBody").innerHTML = html;
}

document.getElementById("reportHead").addEventListener("click", function(){
  const el = document.getElementById("reportCard");
  el.classList.toggle("open");
  document.getElementById("reportChevron").textContent = el.classList.contains("open") ? "▾" : "▸";
});

renderMeta();
renderFilters();
renderCards();
renderReport();
</script>
