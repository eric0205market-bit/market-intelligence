qit signed three contracts for its Encryption Intelligence automated cryptographic discovery and inventory tool in H2 FY2026, with revenue starting late H2 or Q1 FY2027.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Arqit Quantum", "Encryption Intelligence"], "conviction": "high", "so_what": "Early PQC-migration discovery tooling demand; revenue contribution will show in FY2027.", "quote": null, "locator": "Commercial & Operational Highlights", "quote_verified": false}, {"claim": "Arqit renewed or upsized two enterprise contracts and expanded channel partnerships with Tomorrow Street, Intel and European cybersecurity integrators for PQC migration planning.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Arqit Quantum", "Tomorrow Street", "Vodafone", "Intel", "PQC"], "conviction": "high", "so_what": "Channel partnerships may be the route to scaling PQC sales.", "quote": null, "locator": "Commercial & Operational Highlights", "quote_verified": false}]}], "insight_total": 6, "top_entities": ["Arqit Quantum", "NATO", "Encryption Intelligence", "Intel", "Middle East", "Tomorrow Street"], "source_meta": {"author": "Mohamed Abdel-Kareem", "word_count": 558, "paywalled": false}}, {"record_id": "6daa2a27dd06acf9", "source_type": "technology", "source_name": "Quantum Computing Report", "source_url": "https://quantumcomputingreport.com/university-of-auckland-nist-and-umd-demonstrate-octave-spanning-chip-scale-microcomb-in-nature/", "title": "University of Auckland, NIST, and UMD Demonstrate Octave-Spanning Chip-Scale Microcomb in Nature - Quantum Computing Report", "published_date": "2026-10-09", "language": "en", "processed_at": "2026-10-11T11:03:58Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "A Nature study led by the University of Auckland, NIST, UMD and UC Santa Barbara demonstrates a self-aligned, octave-spanning microcomb on a foundry-fabricated photonic chip using two pumps an octave apart, targeting deployable optical clocks and GPS-denied navigation.", "themes": [{"theme": "Inverted dual-pump microcomb architecture", "insights": [{"claim": "Conventional combs cascade light outward from one pump, which struggles to give strong low-noise signals across an octave on integrated platforms, making carrier-envelope offset frequency detection and locking difficult.", "speaker": "Mohamed Abdel-Kareem", "type": "causal", "entities": ["microcomb", "fCEO", "integrated photonics"], "conviction": "high", "so_what": "Explains the bottleneck the new design removes.", "quote": null, "locator": "Traditional laboratory and chip-scale frequency combs", "quote_verified": false}, {"claim": "The team places two pump lasers an octave apart to drive a chi(3) microresonator, inducing a parametrically driven cavity soliton that fills the spectrum between them and yields a stable low-noise frequency ruler without complex external stabilization.", "speaker": "Mohamed Abdel-Kareem", "type": "framework", "entities": ["University of Auckland", "NIST", "University of Maryland", "UC Santa Barbara", "microresonator", "cavity soliton"], "conviction": "high", "so_what": "Simplifies stabilization, a path to field-deployable devices.", "quote": null, "locator": "The team's architectural inversion", "quote_verified": false}]}, {"theme": "Metrology benchmarks and applications", "insights": [{"claim": "On foundry-fabricated chips the platform performed optical clock readout and phase-locking, optical frequency synthesis from telecom to visible, and low-phase-noise millimeter-wave generation.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["optical atomic clocks", "optical frequency synthesis", "mmWave"], "conviction": "high", "so_what": "Passing all three core benchmarks shows the platform is broadly capable.", "quote": null, "locator": "Using the same self-aligned microcomb platform", "quote_verified": false}, {"claim": "The result is positioned as a scalable hardware foundation for deployable optical atomic clocks, GPS-denied quantum navigation and precision quantum sensing.", "speaker": "Mohamed Abdel-Kareem", "type": "thesis", "entities": ["optical atomic clocks", "quantum navigation", "quantum sensing", "GPS"], "conviction": "medium", "so_what": "Defense and navigation timing is the nearest commercial pull.", "quote": null, "locator": "paragraph 1", "quote_verified": false}]}, {"theme": "Commercialization path", "insights": [{"claim": "Authors including Miro Erkintalo, Gregory Moille and Kartik Srinivasan filed a provisional patent application to support commercialization across portable timekeeping, defense navigation and integrated quantum photonics.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Miro Erkintalo", "Gregory Moille", "Kartik Srinivasan", "NIST"], "conviction": "high", "so_what": "Signals technology-transfer intent.", "quote": null, "locator": "Using the same self-aligned microcomb platform", "quote_verified": false}]}], "insight_total": 5, "top_entities": ["University of Auckland", "NIST", "University of Maryland", "UC Santa Barbara", "microcomb", "Nature", "Miro Erkintalo"], "source_meta": {"author": "Mohamed Abdel-Kareem", "word_count": 470, "paywalled": false}}, {"record_id": "fc7adfb0296d07b1", "source_type": "technology", "source_name": "Quantum Computing Report", "source_url": "https://quantumcomputingreport.com/quantinuum-and-hqs-simulate-21-spin-nmr-spectrum-on-42-qubits-with-1400-two-qubit-gate-circuits/", "title": "Quantinuum and HQS Simulate 21-Spin NMR Spectrum on 42 Qubits With 1,400+ Two-Qubit Gate Circuits - Quantum Computing Report", "published_date": "2026-10-09", "language": "en", "processed_at": "2026-10-11T11:03:58Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "Quantinuum and HQS Quantum Simulations ran an end-to-end digital NMR simulation of a 22-spin diphosphane molecule on the H2-1 trapped-ion machine using 42 qubits and up to 1,442 two-qubit gates, resolving a double-peak structure at about 0.07 ppm. The authors concede classical solvers like Spinach remain more efficient for routine cases.", "themes": [{"theme": "Simulation setup and qubit mapping", "insights": [{"claim": "The benchmark modeled the proton NMR spectrum of 1,2-di-tert-butyl-diphosphane, a 22-spin molecule with two 31P and twenty 1H nuclei, on Quantinuum's H2-1 trapped-ion computer.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Quantinuum", "HQS Quantum Simulations", "H2-1", "diphosphane"], "conviction": "high", "so_what": "Largest-scale digital NMR simulation cited here on trapped-ion hardware.", "quote": null, "locator": "paragraph 1", "quote_verified": false}, {"claim": "Projecting the two-phosphorus subsystem into its singlet-triplet subspace cut the system from 22 spins to a 21-spin effective Hamiltonian, reducing two-qubit gates per Trotter step from 69 to 20 native ZZPhase gates.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["ZZPhase", "Trotter", "Quantinuum"], "conviction": "high", "so_what": "Problem-specific compression is key to fitting near-term hardware.", "quote": null, "locator": "To map the molecular spin network", "quote_verified": false}, {"claim": "The run used 42 qubits (21 system plus 21 ancilla for leakage detection), 70 Trotter steps of 0.42 ms covering 29.4 ms, and a maximum two-qubit gate depth of 1,442.", "speaker": "Mohamed Abdel-Kareem", "type": "data_point", "entities": ["Quantinuum", "H2-1"], "conviction": "high", "so_what": "Gives a depth and qubit-count benchmark for H2-1.", "quote": null, "locator": "Quantinuum H2-1 NMR Simulation Technical Parameters", "quote_verified": false}]}, {"theme": "Results and error mitigation", "insights": [{"claim": "The run reproduced the double-peak structure in the 3.9-4.3 ppm region at roughly 0.07 ppm resolution, which earlier 22-qubit superconducting and trapped-ion experiments had struggled to resolve, helped by all-to-all connectivity and idle-error mitigation.", "speaker": "Mohamed Abdel-Kareem", "type": "causal", "entities": ["Quantinuum", "trapped-ion", "superconducting"], "conviction": "high", "so_what": "Supports trapped-ion connectivity advantage for deep simulations.", "quote": null, "locator": "Previous 22-qubit hardware experiments", "quote_verified": false}, {"claim": "The error suppression stack combined echo compiling, full-Trotter-step Pauli twirling, server-side dynamical decoupling and ancilla-assisted leakage post-selection.", "speaker": "Mohamed Abdel-Kareem", "type": "framework", "entities": ["Pauli twirling", "dynamical decoupling", "Quantinuum"], "conviction": "high", "so_what": "Illustrates software-level error mitigation as a performance lever.", "quote": null, "locator": "Quantinuum H2-1 NMR Simulation Technical Parameters", "quote_verified": false}]}, {"theme": "Classical comparison and outlook", "insights": [{"claim": "The authors note classical solvers like Spinach remain more computationally efficient for routine high-field liquid-state spectroscopy today, so the result validates workflow viability rather than showing advantage.", "speaker": "Mohamed Abdel-Kareem", "type": "contrarian", "entities": ["Spinach", "NMR"], "conviction": "high", "so_what": "No quantum advantage claim here; value is a stepping stone.", "quote": null, "locator": "While the authors note", "quote_verified": false}, {"claim": "The result is said to validate deep digital Hamiltonian simulation workflows for zero- to ultralow-field NMR and solid-state materials characterization.", "speaker": "Mohamed Abdel-Kareem", "type": "thesis", "entities": ["ZULF NMR", "Hamiltonian simulation"], "conviction": "medium", "so_what": "ZULF NMR and materials are plausible niches where classical methods struggle.", "quote": null, "locator": "While the authors note", "quote_verified": false}]}], "insight_total": 7, "top_entities": ["Quantinuum", "HQS Quantum Simulations", "H2-1", "Spinach", "NMR", "diphosphane", "Trotter"], "source_meta": {"author": "Mohamed Abdel-Kareem", "word_count": 421, "paywalled": false}}, {"record_id": "7ccb04699446a2fe", "source_type": "technology", "source_name": "SemiWiki", "source_url": "https://semiwiki.com/forum/threads/26027", "title": "Power Intent Studio: Open-Source UPF/CPF Authoring from GUI — looking for feedback from ASIC/SoC engineers", "published_date": "2026-10-08", "language": "en", "processed_at": "2026-10-11T11:04:59Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "A SemiWiki forum post announces Power Intent Studio, an open-source GUI tool that elaborates RTL hierarchy (Verilog, SystemVerilog, VHDL) and lets engineers author or inspect power architecture on it, importing and exporting UPF/CPF. The author seeks feedback and wants to add power-intent validation such as missing isolation detection.", "themes": [{"theme": "Power intent maintenance problem", "insights": [{"claim": "Power intent is hard to understand and maintain when the RTL hierarchy, power architecture and UPF are viewed as separate things.", "speaker": "S", "type": "causal", "entities": ["UPF", "RTL"], "conviction": "medium", "so_what": "Pain point that EDA tools for low-power design try to address.", "quote": "power intent becomes difficult to understand and maintain", "locator": "Hi everyone", "quote_verified": true}]}, {"theme": "Power Intent Studio features", "insights": [{"claim": "Power Intent Studio elaborates the actual RTL hierarchy and lets users create or inspect the power architecture directly on top of it, supporting Verilog, SystemVerilog, VHDL and Liberty black-box macros.", "speaker": "S", "type": "data_point", "entities": ["Power Intent Studio", "Verilog", "SystemVerilog", "VHDL", "Liberty"], "conviction": "high", "so_what": "An open-source alternative workflow to commercial UPF authoring in EDA.", "quote": null, "locator": "Power Intent Studio elaborates the actual RTL hierarchy", "quote_verified": false}, {"claim": "The tool supports power domains, supply sets, power switches, isolation, retention, level shifters and power states, loads existing UPF onto the RTL hierarchy, and exports UPF or CPF.", "speaker": "S", "type": "data_point", "entities": ["UPF", "CPF", "power domains"], "conviction": "high", "so_what": "Feature coverage spans the core low-power design constructs.", "quote": null, "locator": "Currently it can work with", "quote_verified": false}]}, {"theme": "Planned validation features", "insights": [{"claim": "The author plans to explore power-intent validation, such as detecting missing isolation or invalid domain crossings, and invites contributions.", "speaker": "S", "type": "prediction", "entities": ["power-intent validation"], "conviction": "exploratory", "so_what": "Validation would move the tool toward verification use cases.", "quote": null, "locator": "I open-sourced Power Intent Studio so others", "quote_verified": false}]}], "insight_total": 4, "top_entities": ["Power Intent Studio", "UPF", "CPF", "RTL", "Verilog", "SystemVerilog", "VHDL", "Liberty", "EDA"], "source_meta": {"author": "S", "word_count": 194, "paywalled": false}}, {"record_id": "d560f20672e1c615", "source_type": "technology", "source_name": "SemiWiki", "source_url": "https://semiwiki.com/lithography/374764-hyper-na-euv-the-next-frontier-in-chipmaking-could-arrive-in-2036/", "title": "Hyper-NA EUV: The Next Frontier in Chipmaking Could Arrive in 2036", "published_date": "2026-10-10", "language": "en", "processed_at": "2026-10-11T11:05:11Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "Hyper-NA EUV (numerical aperture of at least 0.75) could be ready around 2036 per ASML and Zeiss engineers, but ASML has not committed to producing it and no delivery date exists. The nearer milestone is High-NA, which TSMC plans to use in high-volume manufacturing in 2030.", "themes": [{"theme": "Hyper-NA EUV timeline", "insights": [{"claim": "Hyper-NA EUV could be ready around 2036, based on a roughly ten-year outlook from ASML and Zeiss engineers, but this is a development horizon and not a confirmed delivery date.", "speaker": "Daniel Nenni", "type": "prediction", "entities": ["Hyper-NA", "ASML", "Zeiss"], "conviction": "medium", "so_what": "Not a near-term revenue driver for ASML; treat 2036 as option value.", "quote": "no firm shipment schedule has been announced", "locator": "When will Hyper-NA be delivered?", "quote_verified": true}, {"claim": "ASML has begun development of Hyper-NA but has not committed to producing the machine, and readiness, first customer delivery and widespread adoption may occur at different times.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["ASML", "Hyper-NA"], "conviction": "high", "so_what": "Production commitment depends on customer investment justification.", "quote": null, "locator": "When will Hyper-NA be delivered?", "quote_verified": false}, {"claim": "The nearer milestone is High-NA: ASML and TSMC plan for TSMC to use High-NA in high-volume manufacturing in 2030, alongside a larger-mask system readiness initiative targeting 2033.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["TSMC", "ASML", "High-NA"], "conviction": "high", "so_what": "High-NA adoption timeline is the actionable catalyst for lithography suppliers.", "quote": null, "locator": "Bottom line", "quote_verified": false}]}, {"theme": "NA scaling math", "insights": [{"claim": "ASML's 0.33-NA EUV resolves 13nm and 0.55-NA High-NA 8nm at the same 13.5nm wavelength; Hyper-NA keeps the wavelength and raises aperture to at least 0.75.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["ASML", "EUV", "High-NA", "Hyper-NA"], "conviction": "high", "so_what": "Further scaling comes from optics, not shorter wavelength.", "quote": null, "locator": "Numerical aperture, or NA", "quote_verified": false}, {"claim": "Moving from 0.55 NA to 0.75 NA implies about 27 percent smaller printable dimensions through aperture alone, though actual results depend on illumination, masks, materials and processing.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["Hyper-NA", "High-NA"], "conviction": "medium", "so_what": "Upper-bound illustration, not a guaranteed transistor size.", "quote": null, "locator": "This matters because lithography determines", "quote_verified": false}, {"claim": "0.75-NA single exposure could replace some multiple-patterning applications done on 0.55-NA tools, reducing complexity on selected layers, though overall cost depends on productivity, reliability and yield.", "speaker": "Daniel Nenni", "type": "thesis", "entities": ["ASML", "multiple patterning"], "conviction": "medium", "so_what": "Cost advantage is unproven; watch tool productivity.", "quote": null, "locator": "The economic attraction extends beyond smaller features", "quote_verified": false}]}, {"theme": "Engineering challenges", "insights": [{"claim": "Higher aperture reduces depth of focus, forcing tighter wafer flatness, focus control and thinner resist films while controlling defects and pattern variation.", "speaker": "Daniel Nenni", "type": "causal", "entities": ["depth of focus", "resist"], "conviction": "high", "so_what": "Resist and metrology suppliers face rising requirements as NA increases.", "quote": "Higher aperture reduces depth of focus", "locator": "The engineering challenge is demanding", "quote_verified": true}, {"claim": "Hyper-NA's benefits to users would appear only indirectly via future processors and memory, and also require advances in transistor architecture, interconnects and packaging.", "speaker": "Daniel Nenni", "type": "thesis", "entities": ["Hyper-NA"], "conviction": "medium", "so_what": "Lithography alone does not deliver scaling gains.", "quote": null, "locator": "For users, the potential benefits", "quote_verified": false}]}], "insight_total": 8, "top_entities": ["Hyper-NA", "High-NA", "EUV", "ASML", "Zeiss", "TSMC", "SPIE", "Reuters"], "source_meta": {"author": "Daniel Nenni", "word_count": 978, "paywalled": false}}, {"record_id": "3900528beb331c3b", "source_type": "technology", "source_name": "ServeTheHome", "source_url": "https://www.servethehome.com/gmktec-evo-x3-mini-pc-review/", "title": "GMKtec EVO-X3 Mini-PC Review Looking at a 128GB AMD Local AI Box", "published_date": "2026-10-09", "language": "en", "processed_at": "2026-10-11T11:04:06Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "ServeTheHome's external-hardware look at GMKtec's EVO-X3 mini-PC: an AMD Ryzen AI Max+ 395 box with 128GB soldered LPDDR5X-8000 aimed at local AI development, notable for a rare OCuLink port on a Ryzen AI Max system. The excerpt covers design and I/O only, with criticism of limited ports and 2.5GbE.", "themes": [{"theme": "Ryzen AI Max local AI boxes", "insights": [{"claim": "AMD's Ryzen AI Max+ chips have been very well received in mini-PCs because of CPU and iGPU performance plus high-capacity, high-bandwidth LPDDR5X, and developers wanting to run inference locally have been quick to buy them.", "speaker": "Ryan Smith", "type": "thesis", "entities": ["AMD", "Ryzen AI Max+", "LPDDR5X"], "conviction": "high", "so_what": "Local-AI demand is a real end market for AMD's APU line and its mini-PC partners.", "quote": "software developers looking to test and run inference locally have been quick to snap up the mini-PCs", "locator": "Opening paragraph", "quote_verified": true}, {"claim": "The Ryzen AI Max mini-PC market is large and high-margin enough that vendors such as GMKtec are on a second design generation (EVO-X2 last year, EVO-X3 now) within the platform's lifecycle.", "speaker": "Ryan Smith", "type": "data_point", "entities": ["GMKtec", "EVO-X2", "EVO-X3"], "conviction": "medium", "so_what": "Signals sustained OEM investment in AMD's local-AI platform.", "quote": null, "locator": "One result of this popularity", "quote_verified": false}, {"claim": "The EVO-X3 pairs a Ryzen AI Max+ 395 (16C/32T) with 128GB soldered LPDDR5X-8000 that the iGPU (Radeon 8060S, 40 CUs) can tap, and ships with AI development software preloaded.", "speaker": "Ryan Smith", "type": "data_point", "entities": ["GMKtec EVO-X3", "Ryzen AI Max+ 395", "Radeon 8060S"], "conviction": "high", "so_what": "Defines the spec point for 128GB-class local inference at mini-PC size.", "quote": null, "locator": "GMKtec EVO-X3 Key Specs", "quote_verified": false}]}, {"theme": "OCuLink and I/O trade-offs", "insights": [{"claim": "The EVO-X3's differentiator is an OCuLink port (PCIe Gen4 x4, about 64Gbps), rare on Ryzen AI Max systems, giving more external bandwidth than Thunderbolt 4 for an eGPU or accelerator.", "speaker": "Ryan Smith", "type": "data_point", "entities": ["OCuLink", "Thunderbolt 4", "eGPU"], "conviction": "high", "so_what": "Lets a local-AI box be extended with a discrete GPU, widening its use cases.", "quote": null, "locator": "GMKtec has opted to route four of the Ryzen SoC's PCIe lanes", "quote_verified": false}, {"claim": "OCuLink is limited to four lanes because Ryzen AI Max offers only 16 PCIe Gen4 lanes and the rest are needed elsewhere, and the port is not hot-pluggable.", "speaker": "Ryan Smith", "type": "causal", "entities": ["OCuLink", "Ryzen AI Max"], "conviction": "high", "so_what": "Platform lane budget caps expansion bandwidth.", "quote": null, "locator": "With the Ryzen AI Max chips offering only 16 PCIe lanes", "quote_verified": false}, {"claim": "Skipping a 10GbE controller in favour of 2.5GbE (Realtek RTL8125BG) is a missed opportunity for an AI-development PC, since newer 10GbE chips became cheap and available this year.", "speaker": "Ryan Smith", "type": "contrarian", "entities": ["Realtek", "RTL8125BG", "10GbE"], "conviction": "medium", "so_what": "Networking is a weak point for clustering or moving model data on these boxes.", "quote": "Not including 10GbE is quickly becoming a missed opportunity for AI development-focused PC.", "locator": "Finally, we have the system's dedicated Ethernet jack", "quote_verified": true}, {"claim": "The EVO-X3 has only four USB ports and a single 40Gbps USB-C, fewer than most Ryzen AI Max mini-PCs, so OCuLink and USB-C do heavy lifting for I/O.", "speaker": "Ryan Smith", "type": "data_point", "entities": ["EVO-X3", "USB4"], "conviction": "medium", "so_what": "Port scarcity is a purchase consideration against competing Ryzen AI Max systems.", "quote": null, "locator": "Moving down the line", "quote_verified": false}]}, {"theme": "Chassis and design", "insights": [{"claim": "The EVO-X3 is an upright 41mm all-metal 'monolith' (the EVO-X2 had a plastic chassis) with a required base, 230W external PSU and ventilation on nearly every side.", "speaker": "Ryan Smith", "type": "data_point", "entities": ["GMKtec", "EVO-X2", "EVO-X3"], "conviction": "medium", "so_what": "Design shift reflects the cooling needs of a high-power APU.", "quote": null, "locator": "One of the most notable design aspects", "quote_verified": false}, {"claim": "The base hides the service screws beneath adhesive rubber feet, so the system is not meant to be opened more than a couple of times.", "speaker": "Ryan Smith", "type": "data_point", "entities": ["GMKtec EVO-X3"], "conviction": "low", "so_what": "Minor serviceability negative for upgrade-minded buyers.", "quote": null, "locator": "Looking at the base itself", "quote_verified": false}, {"claim": "GMKtec markets the OCuLink port as a gaming eGPU feature, but the reviewer finds it hard to imagine the system used as anything other than a productivity desktop.", "speaker": "Ryan Smith", "type": "contrarian", "entities": ["GMKtec", "OCuLink"], "conviction": "medium", "so_what": "Positioning is AI/productivity rather than gaming.", "quote": null, "locator": "Surprisingly, GMKtec is aiming the EVO-X3", "quote_verified": false}]}], "insight_total": 10, "top_entities": ["AMD", "Ryzen AI Max+", "GMKtec", "EVO-X3", "EVO-X2", "OCuLink", "LPDDR5X", "Radeon 8060S", "Realtek", "Thunderbolt 4"], "source_meta": {"author": "Ryan Smith", "word_count": 1822, "paywalled": false}}, {"record_id": "c8d28fed7e0742ef", "source_type": "technology", "source_name": "The Next Platform", "source_url": "https://www.nextplatform.com/connect/2026/10/09/upscale-ai-partners-with-nvidia-while-competing-with-it/5302456", "title": "Upscale AI Partners With Nvidia While Competing With It", "published_date": "2026-10-09", "language": "en", "processed_at": "2026-10-11T11:04:31Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "Upscale AI (raised $500M total, $2B valuation, 300+ staff) disclosed its SkyHammer 115.2 Tb/sec Ethernet-based scale-up switch ASIC and SkyFabriX architecture while partnering with Nvidia to use Spectrum-X ASICs for scale-out. Prickett Morgan notes SkyHammer's per-port scale-up bandwidth is about one-sixth of NVSwitch 5, argues predictable latency may matter more than bandwidth for inference, and sees AMD as a natural beneficiary or acquirer.", "themes": [{"theme": "Scale-up networking standards", "insights": [{"claim": "CPU SMP/NUMA interconnect standards (CCIX, CXL) largely failed because customers rarely mix CPUs from different vendors and each vendor wanted to innovate and differentiate without waiting on a standards body.", "speaker": "Timothy Prickett Morgan", "type": "causal", "entities": ["CCIX", "CXL", "NUMA"], "conviction": "high", "so_what": "Same logic explains why a universal GPU/XPU scale-up standard may struggle against proprietary NVLink.", "quote": null, "locator": "Every CPU maker always had its own", "quote_verified": false}, {"claim": "A standard for GPU/XPU scale-up networking is expected anyway because markets love competition and Nvidia charges a hefty premium for NVSwitch and NVLink ports.", "speaker": "Timothy Prickett Morgan", "type": "thesis", "entities": ["Nvidia", "NVSwitch", "NVLink", "XPU"], "conviction": "medium", "so_what": "Premium pricing on NVLink is the economic incentive behind UALink/ESUN-type alternatives.", "quote": "Substitution is a law of economics", "locator": "So why do we think there will be a standard version", "quote_verified": true}, {"claim": "Nvidia may eventually adopt an industry-standard scale-up network with its own protocol overlays, particularly for AI inference, but has no reason to yield ground in training where it holds most of the market.", "speaker": "Timothy Prickett Morgan", "type": "prediction", "entities": ["Nvidia", "AI inference", "AI training"], "conviction": "low", "so_what": "Inference is where scale-up lock-in is most likely to erode first.", "quote": null, "locator": "That day might come, though", "quote_verified": false}, {"claim": "Nvidia's NVLink Fusion lets custom CPUs and hyperscaler XPUs carry NVLink ports into its rackscale systems, but as far as is known it does not allow customers to put NVLink on both their own CPUs and XPUs and buy only NVSwitch plus a protocol licence.", "speaker": "Timothy Prickett Morgan", "type": "data_point", "entities": ["NVLink Fusion", "NVL72", "NVSwitch"], "conviction": "medium", "so_what": "Watch for any loosening of NVLink licensing as a competitive signal.", "quote": null, "locator": "With its NVLink Fusion effort", "quote_verified": false}]}, {"theme": "Upscale AI SkyHammer", "insights": [{"claim": "Upscale AI has raised $500 million in total, its valuation has doubled to $2 billion and headcount has more than doubled to over 300 since its $200 million Series A in January.", "speaker": "Timothy Prickett Morgan", "type": "data_point", "entities": ["Upscale AI"], "conviction": "high", "so_what": "Capital is flowing to challengers to Nvidia's networking stack.", "quote": null, "locator": "This is why Upscale AI", "quote_verified": false}, {"claim": "SkyHammer has 115.2 Tb/sec aggregate bandwidth, comparable to the best scale-out ASICs from Cisco, Broadcom and Nvidia, and supports up to 576 accelerators in a single networking tier with 'thousands' possible across tiers.", "speaker": "Timothy Prickett Morgan", "type": "data_point", "entities": ["SkyHammer", "Cisco", "Broadcom", "Nvidia"], "conviction": "medium", "so_what": "Single-tier radix of 576 matches Nvidia's multi-tier NVSwitch ceiling; competitive on scale, not per-port speed.", "quote": null, "locator": "What we do know from reading that slide", "quote_verified": false}, {"claim": "At 576 devices SkyHammer gives each about 200 Gb/sec, and at 72 XPUs 1.6 Tb/sec per port (200 GB/sec), about one-sixth of NVSwitch 5/NVLink 5's 1.8 TB/sec, with NVLink 6 on Vera-Rubin NVL72 at 3.6 TB/sec.", "speaker": "Timothy Prickett Morgan", "type": "data_point", "entities": ["SkyHammer", "NVSwitch 5", "NVLink 6", "Vera-Rubin"], "conviction": "medium", "so_what": "Large per-port bandwidth gap to NVLink is the main hurdle for Ethernet-based scale-up.", "quote": null, "locator": "If you do the math on that 576 devices number", "quote_verified": false}, {"claim": "Bandwidth may not matter more than latency for AI inference, and predictable latency is always more important than low latency.", "speaker": "Timothy Prickett Morgan", "type": "thesis", "entities": ["AI inference", "Google"], "conviction": "medium", "so_what": "If true, latency-deterministic Ethernet fabrics can compete with NVLink for inference despite lower bandwidth.", "quote": "predictable latency is always more important than low latency, as Google has taught us", "locator": "It is not at all clear that bandwidth matters more than latency", "quote_verified": true}, {"claim": "Upscale AI says SkyHammer builds predictable jitter and a 100% lossless fabric into the ASIC from a clean sheet, rather than retrofitting scale-up protocols onto an Ethernet pipeline.", "speaker": "Arvind Srikumar, SVP product and marketing, Upscale AI", "type": "thesis", "entities": ["SkyFabriX", "SkyHammer", "Ethernet"], "conviction": "medium", "so_what": "Company claim; specific latency numbers are yet to be published.", "quote": "we started with a clean sheet of paper rather than taking an Ethernet fabric and retrofitting the protocols", "locator": "\"One of the most important metrics when it comes to tokens is latency\"", "quote_verified": true}, {"claim": "SkyHammer runs UALink over Ethernet (UALoE) and ESUN, showing it is an Ethernet switch ASIC underneath; the author had hoped for a higher-radix chip running UALink natively.", "speaker": "Timothy Prickett Morgan", "type": "data_point", "entities": ["SkyHammer", "UALoE", "ESUN", "UALink"], "conviction": "medium", "so_what": "Scale-up on tweaked Ethernet is about to be tested in the market.", "quote": null, "locator": "It is interesting to note that SkyHammer is running UALoE", "quote_verified": false}, {"claim": "Building a switch with 2x per-port bandwidth from six ASICs costs about 1.5x per port versus a single 2x device at street prices, so Upscale AI will likely build higher aggregate-bandwidth ASICs.", "speaker": "Timothy Prickett Morgan", "type": "data_point", "entities": ["Broadcom", "Cisco", "Upscale AI"], "conviction": "medium", "so_what": "Economics push switch vendors to faster single ASICs.", "quote": null, "locator": "Upscale AI will no doubt also create devices", "quote_verified": false}]}, {"theme": "Upscale AI and Nvidia partnership", "insights": [{"claim": "Upscale AI will buy Nvidia Spectrum-X ASICs to build its own scale-out switches (400G, 800G and 1.6T ports) running its SkyOS, a SONiC-based network OS, rather than Quantum-X InfiniBand, as its founders believe Ethernet will conquer InfiniBand.", "speaker": "Timothy Prickett Morgan", "type": "data_point", "entities": ["Upscale AI", "Spectrum-X", "SkyOS", "SONiC", "InfiniBand"], "conviction": "high", "so_what": "Nvidia monetises Ethernet scale-out even through a scale-up competitor.", "quote": null, "locator": "Here is the neat bit", "quote_verified": false}, {"claim": "SkyOS and the SkyCMD tool span scale-up and scale-out networks, and customers can mix any CPU, GPU or XPU behind a DPU or NIC.", "speaker": "Timothy Prickett Morgan", "type": "data_point", "entities": ["SkyOS", "SkyCMD", "DPU"], "conviction": "medium", "so_what": "Vendor-neutral fabric is the pitch to non-Nvidia accelerator buyers.", "quote": null, "locator": "The important thing, according to Upscale AI", "quote_verified": false}, {"claim": "Nvidia does not support SkyHammer as an alternative to NVSwitch, so there is currently no way to do scale up with Nvidia GPUs through Upscale AI.", "speaker": "Timothy Prickett Morgan", "type": "data_point", "entities": ["Nvidia", "SkyHammer", "NVSwitch"], "conviction": "high", "so_what": "Addressable market is non-Nvidia accelerators.", "quote": null, "locator": "There is no way", "quote_verified": false}, {"claim": "AMD is counting on firms like Upscale AI for UALink, UALoE or ESUN scale-up options and may lose patience and acquire Upscale AI.", "speaker": "Timothy Prickett Morgan", "type": "prediction", "entities": ["AMD", "Upscale AI"], "conviction": "low", "so_what": "Possible M&A angle; monitor AMD's scale-up networking strategy.", "quote": "it may lose patience and just acquire Upscale AI", "locator": "There is no way - as yet", "quote_verified": true}, {"claim": "Nvidia could flatten its NVSwitch network by cutting per-port bandwidth to raise radix, or port NVLink to SkyHammer and become the dominant supplier of UALoE or ESUN switches.", "speaker": "Timothy Prickett Morgan", "type": "prediction", "entities": ["Nvidia", "NVSwitch", "SkyHammer"], "conviction": "exploratory", "so_what": "Nvidia has options to neutralise Ethernet-based scale-up challengers.", "quote": null, "locator": "One last thing", "quote_verified": false}, {"claim": "InfiniBand will still beat Ethernet on port-to-port hop latency and Nvidia will keep selling it for HPC and AI, but Ultra Ethernet-compatible switches get closer and scale out further for a given topology.", "speaker": "Timothy Prickett Morgan", "type": "thesis", "entities": ["InfiniBand", "Ultra Ethernet Consortium", "Nvidia"], "conviction": "medium", "so_what": "Ethernet continues to gain share in AI back-end networking.", "quote": null, "locator": "Some would say with the first generation", "quote_verified": false}]}], "insight_total": 17, "top_entities": ["Upscale AI", "SkyHammer", "SkyFabriX", "Nvidia", "NVSwitch", "NVLink", "Spectrum-X", "UALink", "ESUN", "AMD", "SkyOS", "Broadcom"], "source_meta": {"author": "Timothy Prickett Morgan", "word_count": 2089, "paywalled": false}}, {"record_id": "260b87b2d5a7192f", "source_type": "technology", "source_name": "Wired", "source_url": "https://www.wired.com/story/elon-musks-america-pac-is-quietly-funding-novembers-most-consequential-elections/", "title": "Elon Musk’s America PAC Is Quietly Funding November’s Most Consequential Elections", "published_date": "2026-10-07", "language": "en", "processed_at": "2026-10-11T11:03:19Z", "processor": "claude-code-sub-opus", "tags": ["Positioning", "AI", "Tech"], "gist": "Elon Musk's America PAC is putting its money mostly into attack ads against Democrats in key Senate races (Texas, Ohio, Iowa), spending almost three dollars attacking for every dollar supporting Republicans. Data centers have become a liability for GOP candidates such as Jon Husted in Ohio, and a Democratic Senate could expose Musk to investigations and AI regulation.", "themes": [{"theme": "America PAC spending pattern", "insights": [{"claim": "America PAC spends almost three dollars attacking Democratic Senate candidates for every dollar it spends supporting Republican ones, an unusually negative approach.", "speaker": "Hugo Lowell", "type": "data_point", "entities": ["America PAC", "Elon Musk"], "conviction": "high", "so_what": "Shows Musk's political money is aimed at defeating Democrats rather than lifting GOP candidates; track the WIRED tracker for shifts.", "quote": "for every dollar it has spent supporting GOP Senate candidates, it has spent almost three dollars attacking Democrats", "locator": "Elon Musk’s America PAC is focusing its war chest", "quote_verified": true}, {"claim": "America PAC has not bought TV ads; it concentrates on digital media buys and mailers while groups like MAGA Inc. and the Senate Republican Conference-affiliated Texas PAC handle television.", "speaker": "Hugo Lowell", "type": "data_point", "entities": ["America PAC", "MAGA Inc.", "Texas PAC"], "conviction": "high", "so_what": "Division of labor among GOP-aligned groups tells you where each dollar type lands.", "quote": "America PAC has not put any money into television ads", "locator": "The largest single expenditures", "quote_verified": true}, {"claim": "Texas PAC has booked around $120 million in television ads and sought a further $100 million in slots before November 3, according to Punchbowl News.", "speaker": "Hugo Lowell", "type": "data_point", "entities": ["Texas PAC", "Punchbowl News"], "conviction": "medium", "so_what": "Gives scale of TV spending dwarfing America PAC's digital outlay in Texas.", "quote": "Texas PAC has booked around $120 million", "locator": "Meanwhile, the Senate Republican Conference", "quote_verified": true}]}, {"theme": "Stakes for Musk and the Senate map", "insights": [{"claim": "Democrats could take the Senate by flipping four battleground races while holding three of their current seats, which raises the stakes for Republicans this midterm cycle.", "speaker": "Hugo Lowell", "type": "thesis", "entities": ["Democrats", "Republicans", "US Senate"], "conviction": "medium", "so_what": "Senate control is the key variable for investigations and tech/AI legislation risk.", "quote": null, "locator": "The political stakes are especially high", "quote_verified": false}, {"claim": "A Democratic-controlled Senate could make Musk a target of congressional investigations and expose his companies to tech and AI regulation bills, giving him a personal motive for the spending.", "speaker": "Hugo Lowell", "type": "causal", "entities": ["Elon Musk", "US Senate", "AI regulation"], "conviction": "medium", "so_what": "Regulatory risk for Musk-linked companies rises if the Senate flips; a political-risk factor to monitor.", "quote": null, "locator": "For Musk, the implications of a Democratic-controlled Senate", "quote_verified": false}]}, {"theme": "Texas Senate race", "insights": [{"claim": "America PAC has spent over $9.4 million opposing Democrat James Talarico versus about $1.8 million backing Republican Ken Paxton in Texas, because Paxton's personal baggage makes positive ads hard.", "speaker": "Hugo Lowell", "type": "data_point", "entities": ["America PAC", "James Talarico", "Ken Paxton"], "conviction": "high", "so_what": "Illustrates GOP weakness in a normally safe state and why spending is negative.", "quote": "America PAC has poured more than $9.4 million into ads opposing Democratic candidate James Talarico", "locator": "Texas Senate RaceFor the critical", "quote_verified": true}, {"claim": "Republicans in Texas cannot realistically run positive ads pairing Trump and Paxton because both have terrible approval ratings.", "speaker": "Hugo Lowell", "type": "causal", "entities": ["Donald Trump", "Ken Paxton"], "conviction": "medium", "so_what": "Low Trump approval constrains GOP messaging; watch approval as a midterm driver.", "quote": null, "locator": "Republicans in Texas also cannot realistically", "quote_verified": false}]}, {"theme": "Data centers as an electoral liability in Ohio", "insights": [{"claim": "In Ohio, America PAC has spent $3.3 million against Sherrod Brown versus $1.6 million supporting Jon Husted.", "speaker": "Hugo Lowell", "type": "data_point", "entities": ["America PAC", "Sherrod Brown", "Jon Husted"], "conviction": "high", "so_what": "Another race where outside money is mostly negative.", "quote": null, "locator": "Ohio Senate RaceIn Ohio", "quote_verified": false}, {"claim": "Voters in Ohio are fed up with rising costs tied to data centers, and Husted is tagged 'the face of data centers' because of a planned Nvidia data center leased by OpenAI and his past support.", "speaker": "Hugo Lowell", "type": "causal", "entities": ["Jon Husted", "Nvidia", "OpenAI", "data centers"], "conviction": "high", "so_what": "Local backlash against AI infrastructure is turning into political risk for data-center buildouts and their backers.", "quote": "Husted has been tagged as \"the face of data centers\"", "locator": "Husted has been struggling to distance himself", "quote_verified": true}, {"claim": "A Senate Republican campaign arm memo in August said Brown's data-center attack was tying an anchor around Husted's polling, yet Trump told an Ohio rally 'We want them' while Husted called it a 'local decision'.", "speaker": "Hugo Lowell", "type": "anecdote", "entities": ["Donald Trump", "Jon Husted", "data centers"], "conviction": "high", "so_what": "GOP split on data centers signals siting and permitting politics could get harder.", "quote": "“We want them.”", "locator": "At a rally this week in Ohio", "quote_verified": true}]}, {"theme": "Iowa Senate race", "insights": [{"claim": "In Iowa, America PAC has spent $1.5 million attacking Democrat Josh Turek and only about $100,000 backing Republican Ashley Hinson, 14 times more against than for, the largest disparity in the tracker.", "speaker": "Hugo Lowell", "type": "data_point", "entities": ["America PAC", "Josh Turek", "Ashley Hinson"], "conviction": "high", "so_what": "A supposedly safe GOP seat is competitive; one NYT/Siena poll had Hinson ahead by one point.", "quote": "Musk's political operation has spent a staggering 14 times more attacking Turek than supporting Hinson", "locator": "Iowa Senate RaceIn Iowa", "quote_verified": true}, {"claim": "Hinson has distanced herself from Trump's agenda, calling for a ban on diesel exports and an end to the Iran war, which may explain the muted pro-Hinson spending.", "speaker": "Hugo Lowell", "type": "causal", "entities": ["Ashley Hinson", "Donald Trump", "Iran war"], "conviction": "low", "so_what": "Candidates breaking wi ker": "Julian Chokkattu", "type": "data_point", "entities": ["Alexa+", "Gemini", "Siri", "ChatGPT"], "conviction": "high", "so_what": "Amazon is matching rivals' assistant feature set; adoption of ambient AI assistants is a competitive battleground.", "quote": "Alexa+ now finally has what Amazon calls On-Screen Intelligence", "locator": "Amazon's souped-up Alexa+ assistant", "quote_verified": true}, {"claim": "Amazon's devices VP Kevin Keith said the company 'didn't really have the right product' to deliver these assistant capabilities before the Android tablets.", "speaker": "Julian Chokkattu", "type": "anecdote", "entities": ["Kevin Keith", "Amazon"], "conviction": "medium", "so_what": "Hardware platform was the bottleneck for Alexa+ rollout.", "quote": "didn't really have the right product to be able to use", "locator": "These are completely new experiences", "quote_verified": true}, {"claim": "Anyone buying the new Alexa tablet gets Alexa+ for free, whereas it is otherwise a paid service requiring a subscription or Prime.", "speaker": "Julian Chokkattu", "type": "data_point", "entities": ["Alexa+", "Amazon Prime"], "conviction": "high", "so_what": "Bundling shows Amazon is using devices to drive Alexa+ adoption and commerce.", "quote": null, "locator": "Alexa+ is right now a paid service", "quote_verified": false}]}, {"theme": "The case for an Amazon phone", "insights": [{"claim": "A Reuters report described an Amazon phone codenamed Transformer with Alexa+ as the focus, and the new tablet features would fit even better on a smartphone.", "speaker": "Julian Chokkattu", "type": "thesis", "entities": ["Amazon", "Reuters", "Alexa+"], "conviction": "medium", "so_what": "Signals Amazon may enter smartphones; Keith said only 'We have nothing to share on that.'", "quote": "We have nothing to share on that. Interesting idea.", "locator": "Is Amazon making a smartphone?", "quote_verified": true}, {"claim": "Amazon's switch to standard Android with Google Play quietly adm lling.", "quote": "The planetary region of our solar system could fit in each knot about 10 times with room to spare", "locator": "These “cosmic pearls” are, in fact, enormous.", "quote_verified": true}, {"claim": "The knots' regularity in size and alignment along filaments is unexpected since astronomers expected oddly shaped accumulations after a supernova, and could deepen understanding of stellar death.", "speaker": "Jorge Garay", "type": "causal", "entities": ["Pa 30"], "conviction": "medium", "so_what": "An unexplained feature that will drive follow-up modelling.", "quote": "What’s strange, however, is their regularity.", "locator": "How exactly the pearls formed is not yet entirely clear", "quote_verified": true}]}, {"theme": "Zombie star survivor", "insights": [{"claim": "Pa 30's central star survived a thermonuclear supernova that normally destroys a star completely, and scientists do not yet understand why; the structures may help reconstruct such detonations.", "speaker": "Jorge Garay", "type": "thesis", "entities": ["Pa 30", "zombie star"], "conviction": "medium", "so_what": "Shows rare partial-survival supernovae are a frontier question.", "quote": "zombie star", "locator": "The Pa 30 nebula is also particularly unusual", "quote_verified": true}]}, {"theme": "Historical record link", "insights": [{"claim": "Pa 30 matches records left by Chinese and Japanese astronomers in 1181 of a new star visible for several months, linking modern observation to medieval accounts.", "speaker": "Jorge Garay", "type": "anecdote", "entities": ["Pa 30", "Chinese astronomers", "Japanese astronomers"], "conviction": "high", "so_what": "Historical records anchor the object's age and identification.", "quote": null, "locator": "All of this has been discovered because scientists", "quote_verified": false}]}], "insight_total": 6, "top_entities": ["Pa 30", "Gemini North", "Ilaria Caiazzo", "The Astrophysical Journal", "zombie star", "supernova"], "source_meta": {"author": "Jorge ng wealth in tangible terms shapes public perception of inequality.", "quote": null, "locator": "“Trillionaire” is an easy enough word to say", "quote_verified": false}]}, {"theme": "The project design", "insights": [{"claim": "Spend Elon Musk's Money is a 3D sequel to Spend Bill Gates' Money, where players buy items from Big Macs to aircraft carriers and the Las Vegas Sphere and see them in physical space.", "speaker": "Brian Barrett", "type": "data_point", "entities": ["Neal Agarwal", "Neal.fun", "Las Vegas Sphere", "Bill Gates"], "conviction": "high", "so_what": "Shows how media makers are packaging wealth concentration as interactive content.", "quote": null, "locator": "WIRED has partnered with Neal Agarwal", "quote_verified": false}, {"claim": "Agarwal says the original Gates version launched with his site, showcased $100 billion, and kept finding new audiences, and that the trillion scale prompted a 3D redo.", "speaker": "Neal Agarwal", "type": "anecdote", "entities": ["Neal Agarwal", "Bill Gates"], "conviction": "high", "so_what": "Evidence of enduring audience appetite for wealth visualizations.", "quote": "The game kept finding a new audience over and over again", "locator": "It was one of the biggest things I’ve launched", "quote_verified": true}, {"claim": "Agarwal says the infinite space of the web lets you visualize huge numbers in ways physical media cannot, such as The Deep Sea, which would be a mile long if printed.", "speaker": "Neal Agarwal", "type": "thesis", "entities": ["Neal Agarwal", "The Deep Sea"], "conviction": "high", "so_what": "Argues for the web's unique advantages as a medium.", "quote": "you have infinite space", "locator": "I think that’s one thing the web is actually really good at", "quote_verified": true}, {"claim": "Rendering a million monster trucks as 3D models would freeze a laptop, so Agarwal used tricks to get the 3D effect without actual models.", "speaker": "Neal Agarwal", "type": "anecdote", "entities": ["Neal Agarwal"], an’s findings", "quote_verified": false}, {"claim": "In 2003 Soai engineered a reaction where a chance tiny imbalance amplified until one enantiomer reached up to 99.99 percent of the product, a feat the Nobel Committee said no one had achieved other than life itself.", "speaker": "Fernanda González", "type": "data_point", "entities": ["Kenso Soai", "Nobel Committee"], "conviction": "high", "so_what": "Reproduces nature's homochirality in the lab, informing origin-of-life research and chemistry.", "quote": "Other than life itself, no one had previously achieved this feat.", "locator": "Finally, in 2003, he engineered a reaction", "quote_verified": true}]}], "insight_total": 6, "top_entities": ["Henri Kagan", "Kensō Soai", "Nobel Committee", "Charles Frank", "Willy Marckwald", "Pasteur", "enantiomer", "homochirality", "autocatalysis", "5-pyrimidylalkanol"], "source_meta": {"author": "Fernanda González", "word_count": 959, "paywalled": false}}, {"record_id": "dcd17e7467b08b2a", "source_type": "technology", "source_name": "Wired", "source_url": "https://www.wired.com/story/a-scientist-working-on-the-icecube-neutrino-detector-explains-the-nobel-prize-winning-technology/", "title": "A Scientist Working on the ‘IceCube’ Neutrino Detector Explains the Nobel Prize–Winning Technology", "published_date": "2026-10-08", "language": "en", "processed_at": "2026-10-11T11:05:03Z", "processor": "claude-code-sub-opus", "tags": ["Society", "Tech"], "gist": "Juan Carlos Diaz Velez of the IceCube collaboration explains the work behind Francis Halzen's 2026 Nobel Prize in Physics: a 1 cubic kilometer array of 5,160 sensors in South Pole ice that detects high-energy cosmic neutrinos. The project, a 450-person international collaboration, traced neutrinos to a blazar and the Milky Way, and relies on about 10,000 CPU cores and 1,000 GPUs.", "themes": [{"theme": "How IceCube detects neutrinos", "insights": [{"claim": "IceCube uses 5,160 optical sensors buried across 1 cubic kilometer of very // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
