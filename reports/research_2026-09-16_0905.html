  idea:`Goldman's David Mericle added a September hike to his call after August CPI, even though the report barely moved his inflation view. Waller is expected to dissent because 3-month core PCE is already BELOW the 2.8% threshold he previously set for staying on hold. Base case: a narrow 10-to-8 majority for one 2026 hike.`,

const META = {
  date:"2026-09-16",
  time:"09:05 CEST",
  windowStart:"2026-09-16 03:05 CEST",
  windowEnd:"2026-09-16 09:05 CEST",
  emailsInWindow:13,
  emailsRead:13,
  itemsExtracted:22,
  includedSources:[
    {name:"Dark Side of the Boom", count:7},
    {name:"Bloomberg Opinion (John Authers)", count:4},
    {name:"McKinsey (Only McKinsey Perspectives)", count:3},
    {name:"Michael Parekh (AI-RTZ)", count:2},
    {name:"HFIR", count:1},
    {name:"Axel Adler Jr. & James Check (Substack Notes)", count:1},
    {name:"Tavi Costa", count:1},
    {name:"DTI Newsletter (Italian)", count:1},
    {name:"Noahpinion (Noah Smith)", count:1},
    {name:"Michael Burry (Substack Notes)", count:1}
  ],
  skippedSources:[]
};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function catCounts(){
  const c = {};
  ITEMS.forEach(i=>{ c[i.cat] = (c[i.cat]||0)+1; });
  return c;
}
function urgCounts(){
  const c = {};
  ITEMS.forEach(i=>{ c[i.urgency] = (c[i.urgency]||0)+1; });
  return c;
}

function renderFilters(){
  const cc = catCounts();
  const catWrap = document.getElementById('catFilters');
  let html = '<button class="pill' + (activeCat==='all'?' active':'') + '" style="' + (activeCat==='all' ? 'background:#333;border-color:#333;' : '') + '" onclick="setCat(\'all\')">All (' + ITEMS.length + ')</button>';
  Object.keys(CATS).forEach(key=>{
    if(!cc[key]) return;
    const on = activeCat === key;
    const style = on ? ('background:' + CATS[key].color + ';border-color:' + CATS[key].color + ';') : '';
    html += '<button class="pill' + (on?' active':'') + '" style="' + style + '" onclick="setCat(\'' + key + '\')">' + CATS[key].label + ' (' + cc[key] + ')</button>';
  });
  catWrap.innerHTML = html;

  const uc = urgCounts();
  const urgWrap = document.getElementById('urgFilters');
  let uhtml = '<button class="pill' + (activeUrg==='all'?' active':'') + '" style="' + (activeUrg==='all' ? 'background:#333;border-color:#333;' : '') + '" onclick="setUrg(\'all\')">All (' + ITEMS.length + ')</button>';
  Object.keys(URG).forEach(key=>{
    if(!uc[key]) return;
    const on = activeUrg === key;
    const style = on ? 'background:#333;border-color:#333;' : '';
    uhtml += '<button class="pill' + (on?' active':'') + '" style="' + style + '" onclick="setUrg(\'' + key + '\')">' + URG[key].label + ' (' + uc[key] + ')</button>';
  });
  urgWrap.innerHTML = uhtml;
}

function setCat(key){
  activeCat = key;
  activeSrc = null;
  renderFilters();
  renderCards();
}
function setUrg(key){
  activeUrg = key;
  activeSrc = null;
  renderFilters();
  renderCards();
}
function filterBySrc(name){
  activeSrc = name;
  activeCat = "all";
  activeUrg = "all";
  renderFilters();
  renderCards(true);
}

function renderCards(expandAll){
  const wrap = document.getElementById('cards');
  let list = ITEMS.filter(i=>{
    if(activeCat !== 'all' && i.cat !== activeCat) return false;
    if(activeUrg !== 'all' && i.urgency !== activeUrg) return false;
    if(activeSrc && i.source.indexOf(activeSrc) === -1) return false;
    return true;
  });

  if(list.length === 0){
    wrap.innerHTML = '<div class="empty-msg">No items match this filter.</div>';
    return;
  }

  let html = '';
  list.forEach(item=>{
    const cat = CATS[item.cat];
    const urg = URG[item.urgency];
    const chartFlag = item.charts.count > 0 ? (item.charts.hot ? '🔥' : '📊') : '';
    const openClass = expandAll ? ' open' : '';
    html += '<div class="card' + openClass + '" id="card-' + item.id + '">';
    html += '  <div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '    <span class="idx">#' + item.id + '</span>';
    html += '    <span class="urg">' + urg.emoji + '</span>';
    html += '    <span class="badge" style="background:' + cat.color + '">' + item.source + '</span>';
    html += '    <span class="cattag">' + cat.label + '</span>';
    if(chartFlag) html += '    <span class="chartflag">' + chartFlag + '</span>';
    html += '    <span class="card-title">' + item.title + '</span>';
    html += '  </div>';
    html += '  <div class="card-body">';
    html += '    <div class="block-label">The Idea</div>';
    html += '    <div class="idea-text">' + item.idea + '</div>';
    html += '    <div class="block-label">My Angle</div>';
    html += '    <div class="angle-box" style="border-left-color:' + cat.color + '; background:' + cat.color + '12;">' + item.angle + '</div>';
    html += '    <div class="tweets">';
    html += '      <div class="tweet"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '      <div class="tweet"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '    </div>';
    if(item.charts.count > 0 || item.charts.desc){
      html += '    <div class="charts-box' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.count > 0 ? item.charts.count + ' chart(s) — ' : '') + item.charts.desc + '</div>';
    }
    html += '    <a class="readlink" href="' + item.link + '" target="_blank">↗ Read full article</a>';
    html += '  </div>';
    html += '</div>';
  });
  wrap.innerHTML = html;
}

function toggleCard(id){
  const el = document.getElementById('card-' + id);
  el.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function renderHeader(){
  document.getElementById('headerMeta').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources';
}

function renderReport(){
  let html = '<div><b>Window:</b> ' + META.windowStart + ' to ' + META.windowEnd + '. Emails outside this window were not processed.</div>';
  html += '<div style="margin-top:8px;"><b>Emails in window:</b> ' + META.emailsInWindow + ' &nbsp; <b>Emails read:</b> ' + META.emailsRead + ' &nbsp; <b>Items extracted:</b> ' + META.itemsExtracted + '</div>';
  html += '<div style="margin-top:10px;"><b>Included sources</b></div>';
  META.includedSources.forEach(s=>{
    html += '<div><span class="srcline" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span> — ' + s.count + ' item(s)</div>';
  });
  html += '<div style="margin-top:10px;"><b>Skipped sources</b></div>';
  if(META.skippedSources.length === 0){
    html += '<div>None — every email in the window contained extractable substance.</div>';
  } else {
    META.skippedSources.forEach(s=>{
      html += '<div>' + s.name + ' — ' + s.reason + '</div>';
    });
  }
  document.getElementById('reportBody').innerHTML = html;
}

renderHeader();
renderFilters();
renderCards();
renderReport();
</script>
