{"id":14,"cat":"crypto","urgency":"deep","source":"Unchained / Lucky Trader (Morning Minute)","title":"Saylor is quietly redefining Strategy's own metrics to hide the dilution math","idea":"Strategy sold 5.4M MSTR shares ($544.5M) between July 20-26 to build cash instead of buying BTC — a 5th straight week without a BTC purchase, its longest pause in two years. Cash reserve now $3.75bn (2.1 years of preferred dividends/debt interest). Last week Strategy introduced a NEW metric, 'net Bitcoin per share,' that strips out $22.2bn of debt and preferred claims, and redefined mNAV so the stock now reads 1.02x — right at the line below which issuing shares to buy BTC would actually shrink BTC-per-share.","angle":"When a company invents a new metric the same week its old metric would show shareholder dilution, that's the tell, not the metric.","tweetA":"Strategy just invented a metric called 'net Bitcoin per share' the same week its actual mNAV crossed the line where issuing shares to buy BTC starts shrinking BTC-per-share. When management redefines the ruler right when the old one shows a problem, read the old ruler.","tweetB":"Saylor hasn't bought Bitcoin in 5 weeks. He's selling MSTR at 80% off its ATH to buy back STRC preferred at 12% off its own peg. That's not a Bitcoin strategy anymore, that's balance-sheet triage with a Bitcoin logo on it.","charts":{"count":0,"hot":false,"desc":"No chart; company disclosures cited"},"link":"https://luckytrader.substack.com/p/strategy-chooses-cash-strc-over-btc"},
{"id":15,"cat":"regulation","urgency":"deep","source":"Unchained Crypto","title":"Crypto's marquee bill just lost its best window of the year — and almost nobody's pricing it in","idea":"The Digital Asset Market Clarity Act is being bumped by Thune in favor of nominations, government funding, and a Russia sanctions bill, with recess starting Aug 8. Senate rules generally allow only one contested bill at a time, so Clarity likely won't get a floor vote before recess — pushing its realistic next shot to September and meaningfully narrowing the odds it passes this year. The sticking point: whether to bar senior officials, including Trump, from crypto ventures — Trump agreed to limits, Democrats say they don't go far enough.","angle":"Market-structure clarity was a 2026 catalyst baked into a lot of crypto-adjacent equity and token theses; a slip to September (or later) is a real timeline risk that isn't showing up in prices yet.","tweetA":"The crypto industry's #1 legislative priority just lost its floor-time slot to a Russia sanctions bill. Senate rules mean only one contested bill moves at a time — Clarity's realistic next shot is September, and 'this year' is now in doubt. Nobody's repriced that yet.","tweetB":"The actual sticking point on Clarity isn't market structure, it's whether Trump himself can hold crypto positions while regulating the industry. That's not a technical delay, that's a political one, and political delays don't have a September deadline.","charts":{"count":0,"hot":false,"desc":"No chart"},"link":"https://unchainedcrypto.beehiiv.com/p/crypto-s-biggest-bill-falls-behind-in-the-senate-queue"},
{"id":16,"cat":"macro","urgency":"watch","source":"Danny Dayan / Macro Themes","title":"A four-regime FCI framework nobody else is running","idea":"Dayan's models split financial-conditions-index work by tracking growth and inflation impulses SEPARATELY (unlike Goldman, Bloomberg, or the Fed's own FCI-G, which all assume growth-up = inflation-up). That separation lets him identify four distinct regimes: reflation (both up together), stagflation (inflation up / growth down), deflation (both down together), and goldilocks (growth up without inflation). His prior FCI call reportedly flagged the current bull-market inflection point.","angle":"A framework worth stealing regardless of this specific call — most consensus FCI reads can't distinguish stagflation from reflation because they bundle growth and inflation into one number.","tweetA":"Every major FCI model — Goldman's, Bloomberg's, the Fed's own FCI-G — makes the same assumption: growth impulse up means inflation impulse up. That assumption is why almost nobody saw stagflation coming last time. Split the two and the picture changes completely.","tweetB":"If you can't tell goldilocks from reflation in your financial-conditions read, you're not modeling two variables, you're modeling one variable twice.","charts":{"count":0,"hot":false,"desc":"Note was paywalled after the framework setup — full regime read not visible"},"link":"https://dannydayan.substack.com/p/fomc-preview-mind-your-fci"},
{"id":17,"cat":"venture","urgency":"deep","source":"Young and Calculated","title":"Jane Street makes 8x the revenue per head of Optiver and IMC — and it's not talent","idea":"2025 net trading revenue: Jane Street $39.6bn / ~3,000 people = ~$13.2m/head. Optiver €4.556bn / 2,707 people = ~€1.68m/head. IMC $3.12bn / ~1,900 people = ~$1.64m/head. Optiver and IMC land within 3% of each other; Jane Street sits 8x higher. The gap isn't talent — Jane Street holds positions for hours to weeks (outside intraday-flattening discipline) and books private-investment gains (its Anthropic stake alone contributed ~$830m in Q3 2025) inside trading revenue. Q1 2026: $16.1bn revenue, $10.3bn net income, 64% net margin — roughly double the prior year's margin.","angle":"The comp gap between the three firms — near-identical at entry, an order of magnitude apart 8 years in — is set by the revenue-per-head mechanics, not individual performance, and that mechanics is visible YEARS before it shows up in paychecks.","tweetA":"Jane Street's Anthropic stake alone contributed $830M to ONE quarter of trading revenue. That's not market making, that's a hedge fund wearing a market-maker's interview process. Compare that to Optiver and IMC converging within 3% of each other on revenue-per-head — Jane Street is playing a different game entirely.","tweetB":"Three market makers, same twenty target universities, same interview loop, same entry pay. Eight years later the gap is 8x. If you're choosing between them at 22, you're not picking a career, you're picking a balance sheet.","charts":{"count":0,"hot":false,"desc":"No chart; per-head revenue table in post"},"link":"https://youngandcalculated.substack.com/p/how-jane-street-optiver-and-imc-actually"},
{"id":18,"cat":"energy","urgency":"deep","source":"The Dark Side of the Boom","title":"Oil's risk premium didn't disappear, it just moved chokepoints","idea":"Persian Gulf exports remain at only 41% of pre-war levels; flows through Hormuz sit at just 8%. Brent fell below $90 on US-Iran de-escalation headlines, but Yanbu loadings are falling and Houthi attacks are turning the Red Sea escape route into a new chokepoint. Global visible oil inventories sit near YTD lows. Goldman's base case: if Hormuz fully reopens by Q4, Brent moderates to ~$80 by year-end — but that's the destination, not the road.","angle":"The diplomatic headline (de-escalation) and the physical data (8% of normal Hormuz flow) are telling opposite stories — sell the spike on headlines, but don't get comfortable on the downside while inventories sit at lows.","tweetA":"Hormuz flows are at 8% of normal. Brent fell below $90 anyway, on a diplomacy headline. The physical oil market and the headline oil market are pricing two different realities right now, and the gap between them is where the next spike comes from.","tweetB":"The Red Sea isn't the backup plan anymore, it's the new chokepoint. Every barrel that reroutes around Hormuz has to survive Yanbu and Bab-al-Mandeb first. The risk premium didn't go away, it just moved zip codes.","charts":{"count":0,"hot":false,"desc":"Charts inside — Hormuz/Red Sea flow data, worth opening"},"link":"https://thedarksideoftheboom.substack.com/p/the-oil-risk-premium-has-simply-changed"},
{"id":19,"cat":"macro","urgency":"act","source":"The Dark Side of the Boom (Forex Daily)","title":"FX has already voted on a Fed hike — bonds haven't","idea":"DXY holds near 101.50 with the June high (101.80) back in view, even though Treasury yields haven't moved dramatically — hike odds are ~40%, up from 16% a week ago. EUR/USD is getting almost no lift from falling oil (which should help Europe's terms of trade), because Fed-vs-ECB policy divergence dominates. A Bloomberg source report suggests the SNB could hold at 0.00% through end-2027, positioning the Swiss franc to replace the yen as the market's preferred carry-funding currency (cleaner than JPY, which now carries intervention risk).","angle":"USD/CHF becomes one of the cleanest expressions of a hawkish-Fed view if the franc takes over the funding-currency role from yen — a structural FX trade hiding inside a Fed-timing story.","tweetA":"The dollar is trading like it already knows something the bond market doesn't. DXY near 101.50 on unchanged yields, hike odds at 40% from 16% a week ago. FX doesn't pay for the best argument, it pays for being early — and it's already positioned.","tweetB":"Yen carry trades now come with intervention risk. A leaked SNB source report saying zero rates through 2027 just quietly nominated the Swiss franc as the new funding currency of choice. USD/CHF, not USD/JPY, may be the cleanest hawkish-Fed trade left on the board.","charts":{"count":0,"hot":false,"desc":"No chart"},"link":"https://thedarksideoftheboom.substack.com/p/forex-daily-the-dollar-is-voting"},
{"id":20,"cat":"geopolitics","urgency":"deep","source":"ChinaTalk (Zern Hee Chua)","title":"Fixing China's zombie-firm problem would add a fifth of its entire growth target — and nobody can do it","idea":"IMF (2017) estimated that scaling back subsidized credit to loss-making 'zombie firms' would raise China's growth rate by 0.7-1.2 percentage points — nearly a fifth of the current 4.5-5% GDP target. But local officials are evaluated on GDP growth AND employment AND deference to central mandates simultaneously, so they have every incentive to keep insolvent firms (like Dayun Automobile, propped up despite failing its EV pivot, or LDK Solar, kept alive on $327M in coerced bank loans despite nine straight quarters of losses) on life support rather than let them fail. A former Dayun salesman: 'It's impossible for Dayun to go bankrupt. The government would never allow it.'","angle":"China's productivity problem isn't a technology gap (it's already at the frontier in many industries) — it's a bureaucratic-incentive gap, and that's structurally harder to fix than a chip shortage.","tweetA":"China could add nearly a fifth of its own GDP growth target just by letting zombie firms die — the IMF said so in 2017. The reason it hasn't happened isn't ideology, it's that local officials are scored on employment AND growth AND political loyalty at the same time, and killing a firm fails two of the three.","tweetB":"'It's impossible for Dayun to go bankrupt. The government would never allow it' — a salesman said that about a truck company that had already failed at EVs and cut headcount in half. That sentence is the whole China productivity problem in one quote.","charts":{"count":0,"hot":false,"desc":"No chart; long-form structural essay"},"link":"https://www.chinatalk.media/p/chinas-dying-companies"},
{"id":21,"cat":"AI/infra","urgency":"watch","source":"AI Supremacy (Mike)","title":"The contrarian case: circular AI financing is a credit-quality problem Moody's already flagged","idea":"A skeptical, polemical essay arguing Generative AI's ROI is absent four years post-ChatGPT, but buried inside the rant are three hard data points worth extracting on their own: Moody's has warned 'unprecedented' AI spending threatens credit quality; Morgan Stanley raised 2027/2028 hyperscaler capex forecasts to $1.2T and $1.4T respectively (a 9-10% upward revision in one week); and the author catalogs a wave of circular vendor-financing deals in a single week — Nvidia/SK Hynix, AMD/Anthropic, Nvidia/OpenAI.","angle":"Strip the editorializing and the underlying data point stands on its own: three major circular-financing deals disclosed inside ONE week is a pattern, and Moody's calling it out on credit grounds (not valuation grounds) is a different kind of warning than the usual bubble talk.","tweetA":"Nvidia/SK Hynix, AMD/Anthropic, Nvidia/OpenAI — three circular vendor-financing deals disclosed in ONE week. Moody's isn't calling this a valuation bubble, they're calling it a credit-quality problem. Those are different alarms and the second one is the one that actually blows things up.","tweetB":"Morgan Stanley raised hyperscaler capex forecasts to $1.2T (2027) and $1.4T (2028) — up 9-10% in a single week's revision. The bear case on AI ROI and the bull case on AI capex are being written by the same bank in the same week.","charts":{"count":0,"hot":false,"desc":"No chart; long-form opinion essay"},"link":"https://www.ai-supremacy.com/p/the-great-ai-disappointment-2026-thesis"},
{"id":22,"cat":"positioning","urgency":"watch","source":"All Star Charts (Alfonso De Pablos)","title":"$550 is the line that decides whether the semiconductor rollover becomes a broader-market problem","idea":"SMH (VanEck Semiconductor ETF) is sitting at a technical confluence: the lower bound of a topping pattern, the 38.2% retracement of the Q2 rally, and the VWAP anchored to the March lows all converge near 550. A decisive break below increases the odds of a deeper correction across semis and creates headwinds for the major averages, since chips have been the engine of the AI/growth trade for the entire cycle.","angle":"A clean, single technical level worth setting a price alert on — it's the line where a sector rotation (already underway per Dauber's macro read) would get technical confirmation.","tweetA":"$550 on SMH is where three unrelated technical levels stack on top of each other — topping-pattern support, the 38.2% retracement, and the March-low VWAP. When chart nerds and macro guys are both watching the same number for different reasons, that's usually the number that matters.","tweetB":"Semis have carried the entire AI trade for two years. All Star Charts is basically saying: watch $550 on SMH, because if that breaks, this stops being a semiconductor story and starts being an index story.","charts":{"count":1,"hot":false,"desc":"SMH daily chart embedded showing the 550 confluence level"},"link":"https://www.allstarcharts.com/2026-07-28/semis-are-sitting-at-the-edge-of-a-cliff"},
{"id":23,"cat":"positioning","urgency":"act","source":"David Rosenberg","title":"Apple is now the Mag7's safe haven — because it doesn't build data centers","idea":"Apple passed Nvidia as the most valuable company in the market. Rosenberg's read: yesterday's Dow +262pt runup was a five-stock story, and the AI narrative is 'totally changing' — the market is rotating to the one Mag7 name with NO AI-capex exposure. What had been a two-year knock on Apple (no AI story) is now its saving grace.","angle":"A rotation-within-the-rotation: even inside the Mag7, capital is fleeing capex exposure for the one name that's structurally hedged against the AI-financing unwind.","tweetA":"Apple just passed Nvidia as the most valuable company on earth — and the reason is almost funny: it's the one Mag7 name that DOESN'T build data centers. Two years of 'Apple has no AI story' just became 'Apple has no AI balance-sheet risk.'","tweetB":"When the market starts rewarding a company for what it DIDN'T spend on, that's not a stock-picking signal, that's a capex-fear signal wearing a stock-picking costume.","charts":{"count":0,"hot":false,"desc":"No chart; teaser/paywalled note"},"link":"https://www.earlymorningwithdave.com/p/let-the-chips-fall-where-they-may"},
{"id":24,"cat":"AI/infra","urgency":"watch","source":"Salazar Slytherin / AI News","title":"Moonshot's Kimi K3: 2.8T params, 1M-token context, 2.5x intelligence-per-compute","idea":"Moonshot AI released model weights and a technical report for Kimi K3, a 2.8-trillion-parameter mixture-of-experts model with native visual understanding, a 1M-token context window, and a claimed 2.5x improvement in intelligence-per-unit-of-compute over its prior architecture.","angle":"Another open-weight Chinese release landing the same week as the DUV lithography news and the KOSPI chip crash — directly reinforces the Deutsche Bank commoditization thesis (item #10) with a concrete new data point.","tweetA":"Kimi K3: 2.8T params, 1M-token context, open weights, and a claimed 2.5x jump in intelligence-per-compute — released the same week China's DUV lithography story and the KOSPI chip crash hit. The commoditization-of-intelligence thesis isn't theoretical anymore, it's shipping on a weekly cadence.","tweetB":"Every open-weight release that claims a step-change in compute efficiency is a direct shot at the 'more chips = more moat' argument. 2.5x intelligence-per-compute, if it holds up, is 2.5x fewer chips needed for the same output.","charts":{"count":0,"hot":false,"desc":"No chart; model release, worth opening the technical report"},"link":"https://www.cryptointegrat.com/p/ai-news-july-28-2026"},
{"id":25,"cat":"venture","urgency":"watch","source":"Hardfork (Will Manidis / Jeffrey Giffon, via Substack)","title":"'The Modern Deal Guy': the last decade rewarded investors, this one rewards traders","idea":"A framework for the current financier archetype: no permanent capital, no permanent loyalty, no permanent location, playing a repeated game, 99% of chips on the table at all times, monetizes savagely when the moment comes, constrained only by talent sourcing since 'capital and opportunity sets are infinite.' Quote: 'the last decade of tech rewarded investors — as price discovery was so efficient/low dispersion in high-growth internet cos that you just had to win and hold for a long time. The deal-guy era is an era of traders, not investors.'","angle":"A useful lens for reading 2026 dealmaking behavior (SoftBank's Ohio buildout, Nvidia's vendor financing, the general pace of AI infrastructure deals) — these look less like long-hold conviction bets and more like repeated-game trading dressed up as strategic partnerships.","tweetA":"'The last decade rewarded investors. This one rewards traders.' Look at the AI infrastructure deals of the last month — Nvidia/OpenAI, SoftBank/Ohio, the vendor-financing web — and ask whether any of it looks like a hold-forever conviction bet or a repeated game where everyone's chips are always back on the table.","tweetB":"The 'Modern Deal Guy' framework explains something the AI-bubble debate keeps missing: nobody actually needs the AI thesis to be TRUE for ten years. They need it to be tradeable for the next two, with an exit before the next hand. That's a very different risk to underwrite.","charts":{"count":0,"hot":false,"desc":"No chart"},"link":"https://hardfork.substack.com/p/the-modern-deal-guy-part-deux-financier"},
{"id":26,"cat":"macro","urgency":"watch","source":"Capital Wars (Global Liquidity Watch)","title":"Global liquidity is flatlining as PBoC injections lose their punch","idea":"Global liquidity growth slowed this week, driven by dollar strength, weaker collateral values, and rising bond volatility. The Shadow Monetary Base continues to weaken, confirming liquidity momentum is fading even with recent PBoC support. Investors remain risk-on, but exposure is trending lower.","angle":"A liquidity-momentum data point that corroborates Dauber's real-rate-shock thesis (item #2) from a completely different methodology — both are describing the same tightening impulse from different angles.","tweetA":"Global liquidity is flatlining even WITH the PBoC actively injecting. When central bank support stops moving the needle on your liquidity index, that's a stronger tightening signal than any single rate decision.","tweetB":"Two totally different frameworks — a real-rate shock thesis out of one newsletter, a Shadow Monetary Base reading out of another — are independently describing the same thing this week: liquidity is draining faster than the headlines suggest.","charts":{"count":0,"hot":false,"desc":"Charts inside — paywalled after the summary, worth opening for the Shadow Monetary Base chart"},"link":"https://capitalwars.substack.com/p/global-liquidity-watch-weekly-update-31d"},
{"id":27,"cat":"macro","urgency":"watch","source":"Mando Minutes","title":"The US Strategic Petroleum Reserve just fell to its lowest level since 1983","idea":"One-line data point buried in a roundup: US SPR levels have fallen to their lowest since 1983, at the same time Brent is trading through a live Hormuz/Red Sea disruption and oil-rig-count data shows drilling activity only gradually responding to higher prices.","angle":"The SPR is the traditional shock absorber for exactly the kind of chokepoint disruption described in item #18 — and it's running on empty at the worst possible moment in the cycle.","tweetA":"The SPR is at its lowest level since 1983 — right as Hormuz flows sit at 8% of normal and the Red Sea becomes a second chokepoint. The traditional shock absorber for an oil crisis is running on empty exactly when a real one might be building.","tweetB":"1983 was the last time the SPR was this low. It's never been drawn down this far while an active shipping-lane disruption was still unresolved. That combination hasn't been stress-tested in this generation's market.","charts":{"count":0,"hot":false,"desc":"No chart; single data point in roundup"},"link":"https://mandominutes.beehiiv.com/p/mando-minutes-a7a8"},
{"id":28,"cat":"crypto","urgency":"watch","source":"Mando Minutes","title":"Stablecoins shed $7.7bn in June — the biggest outflow since Terra","idea":"One-line data point: stablecoin supply fell $7.7bn in June, the largest monthly contraction since the Terra/UST collapse.","angle":"A magnitude-of-outflow data point worth cross-checking against Circle's simultaneous defensive moves (buying ~1,000 IBM blockchain patents, item below) — the largest stablecoin issuer is playing defense the same month the sector saw its worst outflow since Terra.","tweetA":"Stablecoins just shed $7.7bn in a single month — the worst outflow since Terra collapsed. Nobody's calling it a Terra-scale event because no single issuer broke the peg, but the SIZE of the redemption wave is the same order of magnitude.","tweetB":"Circle spent the same month buying ~1,000 blockchain patents from IBM to defend USDC's moat. That's not a coincidence of timing — that's a company armoring up right as the sector sees its worst redemption month in years.","charts":{"count":0,"hot":false,"desc":"No chart; single data point in roundup"},"link":"https://mandominutes.beehiiv.com/p/mando-minutes-a7a8"},
{"id":29,"cat":"tech","urgency":"watch","source":"Mando Minutes","title":"Private Claude chats were exposed in Google and Bing search results","idea":"One-line item flagged in the roundup, sourced to Wired: private conversations with Anthropic's Claude were discoverable via standard Google/Bing search — a privacy/indexing failure on shared-link chats.","angle":"A concrete AI-privacy failure worth watching for read-through to how every AI vendor handles shareable-link chat exposure — this is the kind of incident that tends to trigger a policy change across the whole industry, not just one vendor.","tweetA":"Private Claude chats showed up in Google and Bing search results. Every AI vendor with a 'share this conversation' feature just got a preview of their own worst week — this is the incident that forces an industry-wide audit of shared-link indexing, not just one company's fix.","tweetB":"The AI privacy failure mode nobody's underwriting for: it's not the model leaking your data, it's the CONVENIENCE feature — the share button — leaking it straight into a search index.","charts":{"count":0,"hot":false,"desc":"No chart; single data point in roundup"},"link":"https://www.wired.com/story/private-claude-chats-exposed-in-google-and-bing-search-results/"},
{"id":30,"cat":"science","urgency":"watch","source":"Mando Minutes","title":"China tested its largest-ever superconducting fusion magnet","idea":"One-line item flagged in the roundup: China tested the largest superconducting fusion magnet built to date.","angle":"A quiet but real fusion-research data point landing in the same week as the DUV lithography and Kimi K3 releases — three separate signals of Chinese frontier-technology capacity all surfacing within days of each other.","tweetA":"DUV lithography breakthrough, a 2.8T open-weight model, and now the largest superconducting fusion magnet ever tested — all Chinese, all in the same week. Pick any ONE of those and it's a data point. All three in seven days is a trend.","tweetB":"Fusion timelines are notoriously unreliable, but magnet scale is one of the few genuinely hard technical gates on the path — and China just moved that gate.","charts":{"count":0,"hot":false,"desc":"No chart; single data point in roundup"},"link":"https://mandominutes.beehiiv.com/p/mando-minutes-a7a8"},
{"id":31,"cat":"AI/infra","urgency":"deep","source":"Big Moves (AI-assisted)","title":"Baker Hughes' data-center power orders more than doubled — and its backlog just hit a record","idea":"Baker Hughes' Industrial & Energy Technology (IET) orders more than doubled y/y to $7.1bn, including a Venture Global CP2 LNG order for six liquefaction blocks. Companywide orders hit a record $10.5bn, with record IET remaining performance obligations of $37.1bn. Adjusted EPS $0.64 vs $0.50 consensus; revenue $6.74bn vs $6.52bn expected. Q3 IET revenue guidance ($3.17-3.47bn) came in below Street's $3.79bn — management says that's project timing, not weakening demand.","angle":"Baker Hughes is quietly becoming a data-center power/gas-infrastructure play wrapped in an oilfield-services wrapper — the record backlog is a multi-quarter AI-capex tailwind hiding in an 'old energy' name most growth investors don't screen.","tweetA":"Baker Hughes' orders just hit a record $10.5bn, with IET backlog at $37.1bn — and the growth driver isn't oil, it's data-center power and LNG infrastructure. This is an AI-capex stock trading at an oilfield-services multiple.","tweetB":"The Street's disappointed by soft Q3 IET revenue guidance. Management says it's timing, not demand — and with a record backlog behind it, a guidance miss on TIMING while orders hit an all-time high is a very different signal than a guidance miss on DEMAND.","charts":{"count":0,"hot":false,"desc":"No chart; earnings data table"},"link":"https://bigmoves.substack.com/p/big-moves-july-27-2026"},
{"id":32,"cat":"culture","urgency":"watch","source":"Big Moves","title":"Substack's new AI-writing detector graded a human-written intro as 70% AI","idea":"Substack introduced a feature that scores where a post falls on the AI-to-human writing continuum. The Big Moves author — who says he writes his daily intros himself — got graded as ~70% AI-generated, and speculates the algorithm may be picking up on his 'Overview' and 'Skim' sections (which ARE AI-written) and bleeding that classification into sections that aren't.","angle":"A small but telling data point on how unreliable AI-content-detection tools are in practice — worth remembering the next time a platform, employer, or professor cites one as evidence.","tweetA":"A financial newsletter writer says Substack's new AI-detector scored his own hand-written intro as 70% AI. If a tool can't reliably separate a human's paragraph from a machine's inside the SAME document, it has no business being used as evidence anywhere else.","tweetB":"AI-content detectors keep shipping with confident percentages and no error bars. 70% AI on a self-reported human paragraph isn't a rounding error, it's a sign the whole category of tool doesn't work yet.","charts":{"count":0,"hot":false,"desc":"No chart; screenshot of Substack's grading UI described but not embedded"},"link":"https://bigmoves.substack.com/p/big-moves-july-27-2026"},
{"id":33,"cat":"culture","urgency":"deep","source":"Compounding Quality (Pieter)","title":"A 10-year gap in investing, nothing else changed, and the ending is 3x different","idea":"Illustrative example: Emma and Olivier both start investing $200/month at 21, retire at 67, both earn 11% annually. Emma takes a 10-year break between ages 30-40. Olivier never stops. Total contributions barely differ ($86,400 vs $110,400) but the ending balances are wildly different: Emma ends with $1.1M, Olivier with $3.3M — 3x as much, from a contribution gap of under $24,000.","angle":"A clean, shareable illustration of compounding-interruption cost that's more visceral than the usual 'time in the market' cliché because the CONTRIBUTION gap is so small relative to the ENDING gap.","tweetA":"Same monthly contribution, same 11% return, same start and end age. One investor takes a 10-year break in the middle. Contribution gap: $24,000. Ending balance gap: $2.2 million. That's the actual cost of 'I'll get back to investing later.'","tweetB":"Nobody skips a decade of investing on purpose. It happens 18 months at a time — a house, a kid, a job change — and each pause looks harmless in isolation. The math above is what those 'harmless' pauses add up to by 67.","charts":{"count":0,"hot":false,"desc":"No chart; illustrative numbers only"},"link":"https://www.compoundingquality.net/p/i-am-buying-3-stocks-e94"},
{"id":34,"cat":"positioning","urgency":"deep","source":"Compounding Quality (Pieter)","title":"LVMH is down 40% from its 52-week high, and the buyer thinks the bad news already priced in","idea":"LVMH's Q2 results were weak (Chinese luxury demand still soft, post-COVID luxury spending normalizing), and the stock is down 40% from its 52-week high. But LVMH rallied 4% on the earnings release itself — the author reads that as confirmation most of the bad news was already in the price. He's adding $20,000 (36 shares) at a €490 limit, with the stock trading at forward P/Es of 21.0x/18.9x/16.9x for 2025/26/27.","angle":"A concrete, sized entry point on a China-consumer-linked luxury name at a 40% drawdown — useful as a read-through on Chinese consumer sentiment more broadly, since LVMH's China exposure is one of the cleanest single-stock proxies for it.","tweetA":"LVMH -40% from its high, then +4% on the actual earnings print that confirmed the bad news. That's the market telling you the disappointment was already priced — the stock rallying on bad numbers is usually more informative than a stock falling on good ones.","tweetB":"If you want a single-name proxy for whether Chinese consumer confidence is bottoming or still falling, LVMH's earnings trajectory over the next two quarters is cleaner data than any PMI print.","charts":{"count":0,"hot":false,"desc":"Earnings summary table referenced in email but not included in plaintext"},"link":"https://www.compoundingquality.net/p/i-am-buying-3-stocks-e94"},

  itemsExtracted: 35,
  includedSources: [
    {name:"Phil Dauber / Morning Musings", count:6},
    {name:"The Bond Beat", count:3},
    {name:"Mando Minutes", count:4},
    {name:"Unchained Crypto", count:2},
    {name:"The Dark Side of the Boom", count:3},
    {name:"Peter Boockvar", count:2},
    {name:"Compounding Quality", count:2},
    {name:"Lucky Trader / Unchained", count:1},
    {name:"Bespoke Investment Group", count:1},
    {name:"Danny Dayan / Macro Themes", count:1},
    {name:"Young and Calculated", count:1},
    {name:"ChinaTalk", count:1},
    {name:"AI Supremacy", count:1},
    {name:"All Star Charts", count:1},
    {name:"David Rosenberg", count:1},
    {name:"Salazar Slytherin / AI News", count:1},
    {name:"Hardfork (Modern Deal Guy)", count:1},
    {name:"Capital Wars", count:1},
    {name:"Big Moves", count:2}
  ],
  skippedSources: []
};

const CAT_COLORS = {
  macro:"var(--macro)", credit:"var(--credit)", positioning:"var(--positioning)",
  "AI/infra":"var(--ai)", crypto:"var(--crypto)", geopolitics:"var(--geopolitics)",
  energy:"var(--energy)", tech:"var(--tech)", gold:"var(--gold)", culture:"var(--culture)",
  labor:"var(--labor)", regulation:"var(--regulation)", science:"var(--science)", venture:"var(--venture)"
};
const CAT_LABELS = {
  macro:"Macro", credit:"Credit", positioning:"Positioning", "AI/infra":"AI/Infra",
  crypto:"Crypto", geopolitics:"Geopolitics", energy:"Energy", tech:"Tech", gold:"Gold",
  culture:"Culture", labor:"Labor", regulation:"Regulation", science:"Science", venture:"Venture"
};
const URG_LABELS = { act:"🔴 Act Now", deep:"🔵 Deep", watch:"🟡 Watch" };
const URG_EMOJI = { act:"🔴", deep:"🔵", watch:"🟡" };

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function computeCatCounts(){
  const c = {};
  ITEMS.forEach(i => c[i.cat] = (c[i.cat]||0)+1);
  return c;
}
function computeUrgCounts(){
  const c = {act:0, deep:0, watch:0};
  ITEMS.forEach(i => c[i.urgency] = (c[i.urgency]||0)+1);
  return c;
}

function renderMeta(){
  document.getElementById('metaLine').textContent =
    META.date + "  ·  " + META.time + "  ·  " + META.itemsExtracted + " items from " +
    META.includedSources.length + " sources  ·  window " + META.windowStart + " → " + META.windowEnd;
}

function renderFilters(){
  const catCounts = computeCatCounts();
  const catWrap = document.getElementById('catFilters');
  const cats = Object.keys(CAT_LABELS).filter(c => catCounts[c]);
  let html = '<button class="pill' + (activeCat==='all'?' active':'') + '" data-cat="all" style="' + (activeCat==='all' ? 'background:#333;border-color:#333' : '') + '">All <span class="count">' + ITEMS.length + '</span></button>';
  cats.forEach(c => {
    const isActive = activeCat === c;
    const color = CAT_COLORS[c];
    html += '<button class="pill' + (isActive?' active':'') + '" data-cat="' + c + '" style="' + (isActive ? ('background:' + color + ';border-color:' + color) : '') + '">' + CAT_LABELS[c] + ' <span class="count">' + catCounts[c] + '</span></button>';
  });
  catWrap.innerHTML = html;
  catWrap.querySelectorAll('.pill').forEach(btn => {
    btn.addEventListener('click', function(){
      activeCat = this.getAttribute('data-cat');
      activeSrc = null;
      renderFilters();
      renderCards();
    });
  });

  const urgCounts = computeUrgCounts();
  const urgWrap = document.getElementById('urgFilters');
  let uhtml = '<button class="pill' + (activeUrg==='all'?' active':'') + '" data-urg="all" style="' + (activeUrg==='all' ? 'background:#333;border-color:#333' : '') + '">All <span class="count">' + ITEMS.length + '</span></button>';
  ['act','deep','watch'].forEach(u => {
    const isActive = activeUrg === u;
    uhtml += '<button class="pill' + (isActive?' active':'') + '" data-urg="' + u + '" style="' + (isActive ? 'background:#333;border-color:#333' : '') + '">' + URG_LABELS[u] + ' <span class="count">' + urgCounts[u] + '</span></button>';
  });
  urgWrap.innerHTML = uhtml;
  urgWrap.querySelectorAll('.pill').forEach(btn => {
    btn.addEventListener('click', function(){
      activeUrg = this.getAttribute('data-urg');
      activeSrc = null;
      renderFilters();
      renderCards();
    });
  });
}

function cardHtml(item, index){
  const color = CAT_COLORS[item.cat];
  const chartFlag = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');
  return (
    '<div class="card" id="card-' + item.id + '" data-id="' + item.id + '">' +
      '<div class="card-head" onclick="toggleCard(' + item.id + ')">' +
        '<span class="idx">' + String(index+1).padStart(2,'0') + '</span>' +
        '<span class="urg">' + URG_EMOJI[item.urgency] + '</span>' +
        '<span class="badge" style="background:' + color + '">' + item.source.split(' / ')[0].split(' (')[0] + '</span>' +
        '<span class="tag">' + CAT_LABELS[item.cat] + '</span>' +
        (chartFlag ? '<span class="chart-flag">' + chartFlag + '</span>' : '') +
        '<span class="title">' + escapeHtml(item.title) + '</span>' +
        '<span class="chev">▸</span>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="section-label">The Idea</div>' +
        '<div class="idea-text">' + escapeHtml(item.idea) + '</div>' +
        '<div class="section-label">My Angle</div>' +
        '<div class="angle" style="border-left-color:' + color + ';background:' + color + '14">' + escapeHtml(item.angle) + '</div>' +
        '<div class="section-label">Tweets</div>' +
        '<div class="tweets">' +
          '<div class="tweet-box"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + escapeHtml(item.tweetA) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>' +
          '<div class="tweet-box"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + escapeHtml(item.tweetB) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>' +
        '</div>' +
        (item.charts.count > 0 || item.charts.desc ? (
          '<div class="chart-box' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.hot ? '🔥 ' : '📊 ') + escapeHtml(item.charts.desc) + '</div>'
        ) : '') +
        '<div class="linkrow"><a href="' + item.link + '" target="_blank" rel="noopener">↗ Read full article</a></div>' +
      '</div>' +
    '</div>'
  );
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderCards(){
  const wrap = document.getElementById('cards');
  let filtered = ITEMS.filter(i => (activeCat === 'all' || i.cat === activeCat) && (activeUrg === 'all' || i.urgency === activeUrg));
  if(activeSrc){
    filtered = ITEMS.filter(i => i.source.indexOf(activeSrc) !== -1);
  }
  if(filtered.length === 0){
    wrap.innerHTML = '<div class="empty">No items match this filter.</div>';
    return;
  }
  wrap.innerHTML = filtered.map((item, idx) => cardHtml(item, idx)).join('');
  if(activeSrc){
    filtered.forEach(item => {
      const el = document.getElementById('card-' + item.id);
      if(el) el.classList.add('open');
    });
  }
}

function toggleCard(id){
  const el = document.getElementById('card-' + id);
  if(el) el.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function filterBySrc(name){
  activeSrc = name;
  activeCat = 'all';
  activeUrg = 'all';
  renderFilters();
  renderCards();
  document.getElementById('cards').scrollIntoView({behavior:'smooth'});
}

function renderReport(){
  const body = document.getElementById('reportBody');
  let html = '';
  html += '<h4>Time Window</h4>';
  html += '<div>' + META.windowStart + ' → ' + META.windowEnd + '. Emails outside this window were not processed.</div>';
  html += '<h4>Coverage</h4>';
  html += '<div>' + META.emailsInWindow + ' emails found in window · ' + META.emailsRead + ' read in full · ' + META.itemsExtracted + ' items extracted from ' + META.includedSources.length + ' sources.</div>';
  html += '<h4>Included Sources</h4>';
  html += META.includedSources.map(s => '<div><span class="src-link" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span> — ' + s.count + ' item' + (s.count>1?'s':'') + '</div>').join('');
  html += '<h4>Skipped (no substantive content in window)</h4>';
  html += '<div>None — every email in the 6-hour window contained at least one item of substance.</div>';
  html += '<h4>Totals</h4>';
  html += '<div>' + META.itemsExtracted + ' items · 🔴 ' + computeUrgCounts().act + ' act now · 🔵 ' + computeUrgCounts().deep + ' deep · 🟡 ' + computeUrgCounts().watch + ' watch</div>';
  body.innerHTML = html;
}

document.getElementById('reportHead').addEventListener('click', function(){
  document.getElementById('reportCard').classList.toggle('open');
});

renderMeta();
renderFilters();
renderCards();
renderReport();
</script>
