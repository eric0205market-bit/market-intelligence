:root{--bg:#ffffff;--card:#f8f7f5;--text:#1f1f1f;--muted:#6b6b6b;--border:#e6e3de}

body{margin:0;background:#ffffff;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:.5px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}

.pill.active{color:#fff;border-color:transparent}
.card{background:var(--card);border-radius:10px;margin-bottom:8px;border:1px solid var(--border);overflow:hidden}
.card.hot{border-left:3px solid #f59e0b}
.hd{padding:11px 14px;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.num{font-family:ui-monospace,Menlo,Consolas,monospace;color:#999;font-size:12px;min-width:22px}
.src{color:#fff;font-size:11px;padding:2px 8px;border-radius:5px;font-weight:600}
.tag{background:#e8e6e2;color:#555;font-size:11px;padding:2px 8px;border-radius:999px}
.ttl{font-weight:600;font-size:14.5px;flex-basis:100%;margin-top:2px}
.bd{display:none;padding:0 14px 14px}
.card.open .bd{display:block}
.lbl{font-variant:small-caps;letter-spacing:.6px;font-size:12px;color:#888;font-weight:600;margin:10px 0 3px}
.idea{color:#222;font-size:14px}
.angle{font-style:italic;font-size:14px;padding:8px 12px;border-left:2px solid;border-radius:0 6px 6px 0}
.tw{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.twb{flex:1 1 280px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px}
.twl{font-size:11px;font-weight:700;letter-spacing:.8px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.copy-btn{border:1px solid #d6d3cd;background:#faf9f7;border-radius:6px;font-size:11px;padding:2px 8px;cursor:pointer}
.chart{margin-top:10px;border:1.5px dashed #c9c6c0;border-radius:8px;padding:8px 12px;font-size:13px;color:#555}
.chart.hot{border-color:#f59e0b;background:#fffbeb;color:#92400e}
a.lnk{display:inline-block;margin-top:10px;font-size:13px;color:#378add;text-decoration:none}
.report{margin-top:24px;background:var(--card);border:1px solid var(--border);border-radius:10px}
.report .hd{font-weight:600}
.report table{width:100%;border-collapse:collapse;font-size:13px}
.report td{padding:4px 6px;border-bottom:1px solid var(--border);vertical-align:top}
.srcl{color:#378add;cursor:pointer;text-decoration:underline}
.empty{color:#888;font-size:14px;padding:20px;text-align:center}
</style>

}
function setCat(c){ state.cat=c; state.src=null; render(); }
function setUrg(u){ state.urg=u; state.src=null; render(); }
function filterBySrc(name){
  state.cat="All"; state.urg="All"; render(); state.src=name;
  ITEMS.forEach(function(i){
    var el=document.getElementById("card-"+i.id);
    var m = i.source.indexOf(name) !== -1 || name.indexOf(i.source) !== -1;
    el.style.display = m ? "" : "none";
    if(m) el.classList.add("open"); else el.classList.remove("open");
  });
  window.scrollTo(0,0);
}

function cardHTML(item){
  var c = col(item.cat);
  var ch = item.charts || {count:0,hot:false,desc:""};
  var icon = ch.hot ? " 🔥" : (ch.count>0 ? " 📊" : "");
  var h = '<div class="card'+(ch.hot?' hot':'')+'" id="card-'+item.id+'">';
  h += '<div class="hd" onclick="toggle('+item.id+')">';
  h += '<span class="num">#'+item.id+'</span><span>'+(UEMO[item.urgency]||"")+'</span>';
  h += '<span class="src" style="background:'+c+'">'+esc(item.source)+'</span>';
  h += '<span class="tag">'+esc(item.cat)+'</span><span>'+icon+'</span>';
  h += '<div class="ttl">'+esc(item.title)+'</div></div>';
  h += '<div class="bd">';
  h += '<div class="lbl">the idea</div><div class="idea">'+esc(item.idea)+'</div>';
  h += '<div class="lbl">my angle</div><div class="angle" style="border-color:'+c+';background:'+hexA(c,0.07)+'">'+esc(item.angle)+'</div>';
  h += '<div class="tw">';
  h += '<div class="twb"><div class="twl" style="color:#378add">TWEET A <button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>'+esc(item.tweetA)+'</div>';
  h += '<div class="twb"><div class="twl" style="color:#7f77dd">TWEET B <button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>'+esc(item.tweetB)+'</div>';
  h += '</div>';
  h += '<div class="chart'+(ch.hot?' hot':'')+'">'+(ch.hot?'🔥 ':'📊 ')+'Charts: '+ch.count+(ch.desc?' — '+esc(ch.desc):'')+'</div>';
  h += '<a class="lnk" href="'+esc(item.link)+'" target="_blank" rel="noopener">↗ Read full article</a>';
  h += '</div></div>';
  return h;
}

function render(){
  renderBars();
  var list = ITEMS.filter(function(i){ return (state.cat==="All"||i.cat===state.cat) && (state.urg==="All"||i.urgency===state.urg); });
  var h = list.map(cardHTML).join("");
  document.getElementById("cards").innerHTML = h || '<div class="empty">No items match this filter.</div>';
}

function renderReport(){
  var h = '<div class="hd" onclick="document.getElementById(\'report\').classList.toggle(\'open\')">📋 Session Report</div><div class="bd">';
  h += '<div class="lbl">time window</div><div class="idea">'+esc(META.windowStart)+' → '+esc(META.windowEnd)+'. '+esc(META.note||"")+'</div>';
  h += '<div class="lbl">totals</div><div class="idea">Emails in window: '+META.emailsInWindow+' · Read: '+META.emailsRead+' · Items extracted: '+META.itemsExtracted+' · Sources included: '+META.includedSources.length+'</div>';
  h += '<div class="lbl">included sources (click to filter)</div><table>';
  META.includedSources.forEach(function(s){ h += '<tr><td><span class="srcl" data-src="'+esc(s.name)+'" onclick="filterBySrc(this.getAttribute(\'data-src\'))">'+esc(s.name)+'</span></td><td>'+s.items+' items</td></tr>'; });
  h += '</table><div class="lbl">skipped</div><table>';
  META.skippedSources.forEach(function(s){ h += '<tr><td>'+esc(s.name)+'</td><td>'+esc(s.reason)+'</td></tr>'; });
  h += '</table></div>';
  document.getElementById("report").innerHTML = h;
}

function init(){
  document.getElementById("sub").textContent = META.date+" · "+META.time+" · "+ITEMS.length+" items · window "+META.windowStart+" → "+META.windowEnd;
  render(); renderReport();
}
init();
</script>
</body>
</html>
