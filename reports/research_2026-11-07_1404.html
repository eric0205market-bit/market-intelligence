<script>
const ITEMS = [{"id": 1, "cat": "energy", "urgency": "act", "source": "Stephen Innes / The Dark Side Of The Boom", "title": "Brent has dumped ~$20 of war premium on a blue-wave peace bet — but inventories, refining and Hormuz shipping haven't healed", "idea": "Brent is back below $100 after shedding roughly $20 of war premium as traders bet the Democratic midterm sweep forces a deal with Tehran. Innes argues futures are pricing the diplomacy while the physical market still has depleted global inventories, strained product markets and abnormal shipping risk; restocking could take months even with a deal.", "angle": "Futures discount a political outcome in a week; barrels take quarters to rebuild. Watch backwardation, crack spreads and tanker rates for whether physical confirms the paper move.", "tweetA": "Brent gave back $20 of war premium in a week on a midterm result. Inventories don't read election returns. If the curve flattens before stocks rebuild, that's the gap I'd want to be long. $XLE $VLO", "tweetB": "Disinflation trade got its oil leg this week and everyone's pencilling in a December Fed that blinks. But the oil move is a bet on Congress, not on supply. What's the CPI path if Brent retraces half? $TLT $USO", "charts": {"count": 0, "hot": false, "desc": "No charts in email body; article may have Brent charts — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/oil-weekly-the-next-front-in-the"}, {"id": 2, "cat": "geopolitics", "urgency": "act", "source": "Stephen Innes / The Dark Side Of The Boom", "title": "Iranian-linked vessels looping over Gulf subsea cables — a new front aimed at the Gulf's AI/cloud ambitions", "idea": "At least four Iranian-linked vessels (three sanctioned tankers plus a fishing boat) behaved oddly near subsea cables in October: Celestial Sea looped 4+ hours near 2Africa on Oct 14 then went dark, another lingered 10 days at <1 knot with 33+ hour AIS gaps. Six operational cables transit Hormuz; Iraq, Kuwait, Bahrain and Qatar lean heavily on them. Tehran has openly threatened cables and data centres.", "angle": "This links the energy war to the AI buildout: Gulf sovereign AI campuses depend on a handful of seabed fibres in a mined chokepoint. Cable repair ships in a conflict zone is a long-tail risk nobody prices.", "tweetA": "Six cables through Hormuz. Repair ships can't work in a mined strait. Every Gulf 'AI hub' pitch deck assumes the fibre stays up. Where's the risk premium on that in the data-centre capex? $MSFT $ORCL", "tweetB": "Iran doesn't need to out-gun anyone. Cut two cables and Qatar's banks and cloud go dark while Brent barely moves. The next Gulf escalation may not show up in oil at all, which is exactly why oil desks will miss it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/oil-weekly-the-next-front-in-the"}, {"id": 3, "cat": "geopolitics", "urgency": "deep", "source": "Stephen Innes / The Dark Side Of The Boom", "title": "Pickaxe Mountain and Kharg Island are still on the table while the market trades peace", "idea": "Trump's unfinished options — the deeply buried Pickaxe Mountain facility and Kharg Island, Iran's main crude export terminal — remain unresolved. Striking Kharg would hit Iran's FX earnings but bring retaliation risk and an oil spike, exactly what Washington wants to avoid after the midterms. A Democratic Congress gains leverage via funding deadlines but no automatic veto.", "angle": "Political incentives (energy inflation lost the midterm) cut against escalation; that's the bull case for the peace trade. The tail is a unilateral executive strike.", "tweetA": "The peace trade assumes the White House learned that oil at $120 loses elections. Kharg is the test: it's the one strike that helps nobody's CPI. Position for the market being right on direction and early on timing. $CL_F", "tweetB": "Pickaxe Mountain is the 'did it work?' problem: a strike you can't verify, followed by retaliation you can. Asymmetric setup for anyone short vol into this weekend.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/oil-weekly-the-next-front-in-the"}, {"id": 4, "cat": "energy", "urgency": "deep", "source": "Stephen Innes / The Dark Side Of The Boom", "title": "'Peace is a trade; normalisation is a process' — physical oil market still carries the scars", "idea": "Global inventories drawn down for months, refining operations disrupted, products markets strained. Innes says the danger is not that the peace trade is wrong but that it is too optimistic on timetable. Cheaper crude has eased inflation expectations and supported Treasuries after the recent tech liquidation.", "angle": "Time-spread and refinery margin signals matter more than flat price here. A timing mismatch is how you get a second oil leg.", "tweetA": "Everyone's long the end of the war. Nobody's long the 18 months it takes to refill SPRs, rebuild refinery runs and clear insurance on Hormuz transit. Peace is priced like a switch. It's a ramp.", "tweetB": "Cheap oil is carrying the whole disinflation narrative into the December FOMC. If stocks rebuild slower than futures fell, the Fed gets a nasty surprise in Q1 prints.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/oil-weekly-the-next-front-in-the"}, {"id": 5, "cat": "macro", "urgency": "deep", "source": "Ironsides Macroeconomics", "title": "Three biggest GOP House election losses (1932, 1922, 1890) all followed the three biggest tariff hikes", "idea": "Ironsides opens with the historical pattern: the largest Republican House losses came after the biggest tariff increases. They conclude tariffs are politically toxic and unlikely to return to pre-Liberation Day levels, but Congress's transfer of tariff authority to the executive makes a lasting reversal hard. They expect the effective tariff rate to rise from here without revisiting its peak and doubt the 120th Congress rescues tariff-impaired stocks.", "angle": "Midterm result is the third data point in that series. The tradable nuance: policy direction softens, but legal structure keeps the executive able to re-escalate.", "tweetA": "1890, 1922, 1932, now 2026. Three of the biggest tariff hikes in US history and three of the worst House losses for the party that passed them. Markets are trading the tariff peak as if it's a one-way door. It's a revolving one.", "tweetB": "Congress delegated tariff power to the executive and can't easily take it back. So 'tariffs are toxic' is a political fact, not a trade-policy fact. Be careful pricing relief on importers. $WMT $TGT $NKE", "charts": {"count": 0, "hot": false, "desc": "Article has 12 charts and tables (subscriber content) — worth opening"}, "link": "https://ironsidesmacro.substack.com/p/toxic-tariffs"}, {"id": 6, "cat": "macro", "urgency": "deep", "source": "Ironsides Macroeconomics", "title": "Fed tightening into decelerating earnings — October jobs keeps December hike on track", "idea": "Ironsides says the October employment report keeps the FOMC on track for a December hike despite their skepticism that labour demand has materially strengthened. Only tighter financial conditions are likely to stop further tightening; they note a deeper equity correction without broad credit deterioration may fail to deter a hike.", "angle": "A hiking Fed after a war-driven oil spike is the regime. Credit spreads, not equities, are the reaction function.", "tweetA": "The Fed's reaction function in this cycle isn't the S&P, it's credit. Ironsides: a 10-12% equity drawdown without spread widening might not stop a December hike. Equity bulls buying the dip are betting on the wrong series. $HYG $LQD", "tweetB": "Hike into decelerating earnings and AI capex growth, with oil falling. Either the Fed is wrong on inflation or earnings are wrong on demand. Both can't be right by Q1.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://ironsidesmacro.substack.com/p/toxic-tariffs"}, {"id": 7, "cat": "AI/infra", "urgency": "deep", "source": "Ironsides Macroeconomics", "title": "'The peak that matters for stocks is the growth rate of AI capex — and it's already behind us'", "idea": "Ironsides argues second-derivative AI capex growth has peaked while earnings momentum and revisions weaken. But they are warming to selective tech exposure as valuations compress and positioning unwinds, with some industry-level revisions better than sector aggregates. They would consider nibbling tech where holdings fell below target.", "angle": "Matches the rotation framing in the Citadel note: financiers vs suppliers of the buildout. Stocks move on delta, not level.", "tweetA": "AI capex can keep rising and stocks can still fall. Price follows the growth rate of spend, not the spend. $50-100B of annual increments get harder to repeat when the base is $600B+. $NVDA $AVGO", "tweetB": "Meta needs $15B in bonds, $70B across three raises, to fund a $135-145B capex plan. Ironsides says capex growth peaked. Credit markets are the next marginal funder of AI. Watch their spreads, not NVDA's multiple.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://ironsidesmacro.substack.com/p/toxic-tariffs"}, {"id": 8, "cat": "positioning", "urgency": "deep", "source": "Ironsides Macroeconomics", "title": "Cash plan: deploy above-benchmark cash only after a 10–12% correction; sentiment 'elevated, not extreme'", "idea": "Ironsides says sentiment and positioning are elevated but not extreme and the current pullback is short of the 10–12% correction that would justify deploying cash. They see it as 'not a fat pitch, at least not yet'.", "angle": "A clear trigger level from a macro shop: useful as a reference point for how institutionals are staging entries.", "tweetA": "Pre-committed entry levels beat vibes. Ironsides sits on above-benchmark cash until -10 to -12%. The pullback we have isn't that. Everyone calling a bottom this week is early by definition.", "tweetB": "Cash at 4-5% yield makes waiting free. That's the underrated reason dips aren't being bought as aggressively as 2020-21. Opportunity cost is a real number again.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://ironsidesmacro.substack.com/p/toxic-tariffs"}, {"id": 9, "cat": "positioning", "urgency": "deep", "source": "Helene Meisler / Helene's Substack", "title": "Transports at 19,500 and Dow above 50k: 'Charles Dow will care, even from the grave'", "idea": "Meisler flags Dow still above 50,000 (a break would make the evening news) and Transports at 19,500 as 'quite a big deal' — a Dow Theory non-confirmation risk if it fails. She also notes the h/s top she drew on QQQ last week played out, the XBI one hasn't, and there wasn't much in serious breaks despite the noise.", "angle": "Dow Theory divergence between Industrials and Transports is a classic slow-burn warning. Pair with her comment on XLI missing from the lower line.", "tweetA": "Dow Theory has one rule: the two averages must confirm. Transports sitting on 19,500 while everybody argues about AI is the chart I'd watch before any NVDA print. $IYT $DIA", "tweetB": "Dow 50k is a headline level, so a break gets a TV segment. Transports are the quiet tell: freight doesn't care about narrative. If goods demand rolls, it shows there first.", "charts": {"count": 1, "hot": true, "desc": "~30 technical charts incl. Dow, Transports, SPX, Nasdaq, IWM, SOX, sector ETFs — 🔥 Transports 19,500 and IWM 270 worth saving"}, "link": "https://helenemeisler.substack.com/p/saturday-chart-fest-32d"}, {"id": 10, "cat": "tech", "urgency": "deep", "source": "Helene Meisler / Helene's Substack", "title": "IGV 'not eating anything these days except itself'; SOX 'should I draw thicker lines?'", "idea": "Meisler's colour on software and semis: IGV is eating itself, QQQ head-and-shoulders top came to fruition, SOX trendlines are crowded. IWM 270 is key with support at 260 and 'algos watching 270'. McClellan Summation Index still lumbering upward.", "angle": "Software cannibalising itself fits the AI-eats-SaaS narrative; semis chart structure is the opposite pole.", "tweetA": "Software is eating itself while semis draw thicker lines. That is the whole AI trade in one pair of charts: the picks-and-shovels hold the pattern, the apps are the casualty. $IGV $SOXX", "tweetB": "IWM 270 with support at 260. Small caps are the funding currency for any rate-hike repricing. Break below and December hike odds stop being theory.", "charts": {"count": 2, "hot": true, "desc": "IGV and SOX charts — 🔥 IGV vs SOX divergence worth saving"}, "link": "https://helenemeisler.substack.com/p/saturday-chart-fest-32d"}, {"id": 11, "cat": "energy", "urgency": "deep", "source": "Helene Meisler / Helene's Substack", "title": "XLE 'missing the relative strength of a head-and-shoulders top'; OIH not outperforming on the upside", "idea": "Meisler says XLE looks like it's missing the RS expected of an h/s top, and OIH is 'definitely not outperforming XLE on the upside'. URA 'What dust?' — she's intrigued as a bottom-fisher. PALL, GLD, XME charts also included.", "angle": "Oil services failing to lead the rally is a classic tell the oil move isn't trusted. Pair with Brent premium collapse.", "tweetA": "Brent drops $20 and XLE still can't print the relative-strength breakdown. OIH lagging on the upside means the market doesn't believe the rally in services. Energy equities are pricing a floor, not a collapse. $XLE $OIH", "tweetB": "URA just got interesting again after the dust settled. Uranium bottom-fishing is easier when oil falling pushes fewer people into nuclear-as-hedge. Early, but the chart is setting up. $URA $CCJ", "charts": {"count": 2, "hot": false, "desc": "XLE, OIH, URA charts"}, "link": "https://helenemeisler.substack.com/p/saturday-chart-fest-32d"}, {"id": 12, "cat": "positioning", "urgency": "deep", "source": "Helene Meisler / Helene's Substack", "title": "Staples are being loved again — 'they hated staples all the way up'; XLV above 180 looks like tech a year ago", "idea": "Meisler sees sentiment warming to XLP after hating it on the way up, and likes how XLV behaves if it holds over 180 ('the sort of action we saw in tech a year or so ago'), though she's terrible at charts that have already run. ITA 'has my attention'. Also: ITB fake break? LIT, MOO, IYR charts.", "angle": "Defensive rotation plus defence ITA all fits a late-cycle, hiking-Fed regime.", "tweetA": "Staples, healthcare, defence. Three sectors that get bought when the market stops believing in the growth story. Rotation into XLP/XLV/ITA is a message even if no one says it out loud. $XLP $XLV $ITA", "tweetB": "The tell for rotation isn't price, it's who changes their mind. Hated XLP on the way up, now warming to it. That's sentiment turning at exactly the wrong time.", "charts": {"count": 3, "hot": false, "desc": "XLP, XLV, ITA, XBI charts"}, "link": "https://helenemeisler.substack.com/p/saturday-chart-fest-32d"}, {"id": 13, "cat": "geopolitics", "urgency": "watch", "source": "Helene Meisler / Helene's Substack", "title": "INDA gap up: 'Where did this come from? India was the big surprise'", "idea": "India was the week's big surprise per Meisler, who had given up on INDA; she worries the gap up could end like the previous one (black arrow). VGK 'big line there', KWEB 'always trying', Nikkei also charted. Divergence between the dollar and bonds called curious.", "angle": "India re-rating on what catalyst? Oil down is the obvious macro driver — India imports ~85% of crude.", "tweetA": "INDA gaps up the week Brent loses $20. India imports most of its oil. This might not be a story, just arithmetic. The risk is that the chart is long a commodity trade labelled as a country. $INDA $EPI", "tweetB": "Dollar and bonds diverging, India gapping, KWEB 'trying' as always. The EM rotation is showing up in odd places first.", "charts": {"count": 4, "hot": false, "desc": "INDA, VGK, KWEB, Nikkei, DXY charts"}, "link": "https://helenemeisler.substack.com/p/saturday-chart-fest-32d"}, {"id": 14, "cat": "geopolitics", "urgency": "deep", "source": "Doomberg", "title": "'Attrition Pocket': Russia is now striking Dnipro bridges — and Doomberg ties it to an imminent WW3 climax", "idea": "Doomberg notes Russia began hitting Kyiv's Southern Bridge (4,100 ft, built from 1983) and two other Dnipro bridges a month ago; almost all Western aid must cross the river to reach the east. They say hardliners long asked why Moscow spared the bridges, and offer an alternative explanation framed within a global conflict including the Iran war, foretelling an 'imminent climax' to what they model as World War III. The key thesis is paywalled after the teaser.", "angle": "A deliberate sequencing story: logistics interdiction after the Iran front stretched US munitions. Worth reading in full for the thesis.", "tweetA": "Russia waited 4 years to cut the Dnipro bridges. Doomberg's read: that's timing, not restraint. If you think Moscow sequences its moves around US bandwidth in the Gulf, the Iran peace trade and the Ukraine front are one trade. $LMT $RHM.DE", "tweetB": "Nearly every shell, missile and litre of fuel for Ukraine's eastern front crosses the Dnipro. Cut the bridges and you don't need to win a battle. You just need to wait. Attrition math, not manoeuvre.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://newsletter.doomberg.com/p/attrition-pocket"}, {"id": 15, "cat": "culture", "urgency": "watch", "source": "Marvin Liao / The Hard Fork", "title": "'Variability is the Mind Killer': Liao's 2020–26 results ran great, meh, good, very bad, brutal — and BTB's 1-in-4-year bad-year rule", "idea": "Liao recaps six years of entrepreneurial income, from lucrative exits (2020–21) to 2025–26 being very bad on receivables, real-estate cash flow and a self-made tax miscalculation. He quotes BowtiedBull: every four years one great year, one okay year, one bad year, which 'explains why most can't survive'. Also: top 1% share of US net worth keeps rising because owners 'HODL through downturns'.", "angle": "Founder-psychology angle with a real-estate cash-flow warning: private RE illiquidity hit a Silicon Valley operator in 2025–26.", "tweetA": "Everyone models returns as a smooth line. A decent operator's actual record: great, great, meh, good, good, very bad, brutal. The Sharpe of a real life is awful, and survival is the strategy. $BTC", "tweetB": "Top 1% share of net worth only dips in recessions because owners simply don't sell. That is the whole edge: not picking, not selling. Behavioural alpha dressed up as inequality.", "charts": {"count": 0, "hot": false, "desc": "Article may include top-1% net worth chart — worth opening"}, "link": "https://hardfork.substack.com/p/the-entrepreneurs-bane-variability"}, {"id": 16, "cat": "crypto", "urgency": "act", "source": "The Founders Corner", "title": "Binance hit by a $6.3B hack attributed by FBI to North Korea; customers pull $4.72B", "idea": "Binance suffered a $6.3B hack the FBI attributes to North Korea. Customers withdrew $4.72B, the exchange pledged reimbursement and said it had raised $6B.", "angle": "$6.3B is more than the Bybit hack (~$1.5B) multiple times over; Lazarus again. Withdrawals of 75% of the loss amount tells you the real run risk.", "tweetA": "$6.3B stolen, $4.72B withdrawn. The hack isn't the risk, the run is: customers pulled 75% of the stolen figure within days. Whoever 'raised $6B' just pre-funded the next redemption wave. $BNB $BTC", "tweetB": "North Korea now has a bigger crypto balance sheet than most mid-size exchanges. State actor as the largest adversary in the industry, and the custody tooling still looks like 2019. $COIN", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/kalshi-40b-meta-15b-bonds-binance-hack-weekly-recap"}, {"id": 17, "cat": "venture", "urgency": "deep", "source": "The Founders Corner", "title": "Kalshi's 2020 Series A deck projected $5.1B monthly volume; actual hit $97.8B in Oct 2026 (19x); $1B Series G at $40B", "idea": "Kalshi's Series A deck projected $5.1B monthly volume in five years. October 2026 volume reached $97.8B and it closed a $1B Series G at a $40B post on Oct 29, with annualised revenue past $1.5B by May.", "angle": "Prediction markets became a financial product class. 27x revenue multiple on annualised revenue (40/1.5) though that was May's number.", "tweetA": "Kalshi beat its own deck by 19x. Even the founders' bull case was off by an order of magnitude. $40B for a venue that, 3 years ago, couldn't list an election contract. $HOOD $CME", "tweetB": "$97.8B monthly volume is about the size of a mid-cap equity exchange. Prediction markets are running ahead of regulation. Whoever clears that volume owns the plumbing. $ICE $CME", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/kalshi-40b-meta-15b-bonds-binance-hack-weekly-recap"}, {"id": 18, "cat": "AI/infra", "urgency": "act", "source": "The Founders Corner", "title": "Meta raises $15B in a 5-part bond sale — $25B in April, $30B last year, capex $135–145B", "idea": "Meta raised $15B in a five-part US bond sale for AI infrastructure, after $25B in April and $30B last year. Its 2026 capex forecast is $135–145B.", "angle": "$70B of bond funding across 3 raises vs $140B capex: roughly half of capex is now debt-financed incrementally. Hyperscaler credit is the AI tell.", "tweetA": "$70B in bonds across three raises to fund ~$140B of capex. Hyperscalers used to fund AI from free cash flow. Now it's debt. Watch Meta spreads, they're the AI-capex credit gauge. $META $HYG", "tweetB": "Rule of thumb: when the richest companies in history need the bond market for the buildout, the cycle isn't early. Ironsides says capex growth peaked; the issuance calendar agrees.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/kalshi-40b-meta-15b-bonds-binance-hack-weekly-recap"}, {"id": 19, "cat": "AI/infra", "urgency": "deep", "source": "The Founders Corner", "title": "Anthropic: $1.7B personnel costs for 5,300 employees in Q3 — ~$322k per head, $1.1B of it stock comp", "idea": "Anthropic recorded $1.7B in personnel costs across 5,300 employees July–September 2026, with $1.1B stock-based compensation.", "angle": "65% of personnel cost is equity. Annualised that's ~$1.3M per employee. Talent is the scarce input.", "tweetA": "$1.7B personnel in a quarter, $1.1B of it stock. Two-thirds of comp is paid in the company's own paper. That's the real subsidy to model labs: employees finance the burn. $MSFT $GOOGL $AMZN", "tweetB": "$322k per employee in one quarter. Annualised $1.3M per head. Labor is the most expensive input in the most automated industry on earth. Irony hasn't been priced.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/kalshi-40b-meta-15b-bonds-binance-hack-weekly-recap"}, {"id": 20, "cat": "AI/infra", "urgency": "deep", "source": "The Founders Corner", "title": "ChatGPT 1.2B weekly users; search-like queries ~20% of Google's volume; voice 250M weekly", "idea": "ChatGPT reached 1.2B weekly active users while search-like query volume hit roughly 20% of Google's. Voice mode has 250M combined weekly users (via Big Technology).", "angle": "20% of Google's query volume in under four years. Query share precedes ad share by years.", "tweetA": "1.2B weekly users and 20% of Google's query volume. Search share erodes at the margin long before revenue shows it. The Google bear case doesn't need ChatGPT to win, only to hold 20%. $GOOGL", "tweetB": "250M weekly voice users is the underrated number. Voice moves AI from a tab you open to a layer you talk to. That's a different moat than search.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/kalshi-40b-meta-15b-bonds-binance-hack-weekly-recap"}, {"id": 21, "cat": "venture", "urgency": "watch", "source": "The Founders Corner", "title": "Fal doubles to $16B on $1.3B Series F; ARR surpassed $800M — generative media inference demand", "idea": "Fal raised $1.3B Series F at $16B, double April's $8B mark, on generative-media inference demand. ARR had already surpassed $800M earlier this year.", "angle": "Valuation doubled in ~6 months at ~20x ARR; inference demand outside text (image/video) is the growth leg.", "tweetA": "Fal went $8B to $16B in six months on inference demand for generated video and images. Text gets the headlines; media is where the GPU hours are. $NVDA $CRWV", "tweetB": "$800M ARR at a $16B mark is ~20x. That's cheap vs the 2021 SaaS cohort given growth. The question is gross margin once model providers integrate vertically.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/kalshi-40b-meta-15b-bonds-binance-hack-weekly-recap"}, {"id": 22, "cat": "tech", "urgency": "deep", "source": "The Founders Corner", "title": "Traversal $1B valuation: monthly investigations 513 → ~73,000 this year as coding agents speed the inner loop", "idea": "Traversal raised a $120M Series B at $1B (Kleiner, Redpoint, Khosla) for AI site reliability. Monthly investigations rose from 513 to ~73,000 this year; 52% of developers spend more time debugging in production.", "angle": "Coding agents shift the bottleneck from writing to operating code. Also from Tano: engineer PRs up 11x to 200+/month but with a duplicate-payment bug.", "tweetA": "Agents wrote the code faster, so the bottleneck moved to production. 513 to 73,000 investigations a month. Every productivity gain in one stage creates a queue at the next. $DDOG $DT", "tweetB": "One engineer went 11x on PRs and shipped a duplicate-payment bug. Throughput up, context lost. The cost of AI coding shows up as incidents, not velocity charts.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/kalshi-40b-meta-15b-bonds-binance-hack-weekly-recap"}, {"id": 23, "cat": "geopolitics", "urgency": "act", "source": "The Founders Corner", "title": "Oracle cancels $7B Tencent AI chip leasing deal (~100,000 advanced chips for SE Asia) after US pressure", "idea": "Oracle reportedly cancelled a five-year, $7B chip-leasing deal with Tencent covering about 100,000 advanced AI chips in Southeast Asian data centres after US government concerns.", "angle": "Export-control enforcement now reaches third-country cloud leasing — the loophole Chinese hyperscalers used. Southeast Asia DC thesis impacted.", "tweetA": "Oracle just walked from $7B because renting chips to Tencent in Southeast Asia is still China exposure in Washington's eyes. The leasing loophole is closing. SE Asia data-centre capex gets re-underwritten. $ORCL $NVDA", "tweetB": "If the US polices who rents the GPUs, Chinese AI labs lose cloud access, not just chips. That pushes more demand to Huawei Ascend, and onshore capex. $BABA $0700.HK", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/kalshi-40b-meta-15b-bonds-binance-hack-weekly-recap"}, {"id": 24, "cat": "venture", "urgency": "deep", "source": "The Founders Corner", "title": "a16z survey: 94% of enterprise LLM buyers expect spend to rise, 37% expect to at least double; AI apps keep pricing power via workflow, context, value unit", "idea": "August 2026 survey of 100 enterprise LLM buyers: 94% expect LLM spend to rise and 37% expect it to at least double next year. a16z argues apps keep pricing power by owning workflow, rentable context and a clear value unit rather than token markup. Applied Compute hit $100M ARR in <18 months, raised $350M at $3.25B; 1T tokens/day.", "angle": "Counter to the 'model cost deflation kills app margins' thesis; buyers say spend rises even as per-token cost falls.", "tweetA": "37% of enterprise buyers expect to double LLM spend next year. Unit prices fall, bills rise. Jevons in the corporate budget. Doesn't matter who wins the model layer. $MSFT $NOW", "tweetB": "Applied Compute: $100M ARR in <18 months, 1T tokens a day, 40% of customers using both training and inference. Custom open-weight models are the enterprise wedge no one prices. $NVDA", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/kalshi-40b-meta-15b-bonds-binance-hack-weekly-recap"}, {"id": 25, "cat": "venture", "urgency": "watch", "source": "The Founders Corner", "title": "micro1 plans $1B this year buying company operational data ($100K–$2M+ per deal) and paying experts $60–200/hr", "idea": "micro1 says it is spending $1B this year to buy company operational data at $100K to $2M+ per partnership and paying experts $60-$200 an hour to train AI models. (Sponsored section, but contains the figures.) Also: 30 AI decks behind $531.5M show traction on slide two; every deck that stated an ask closed 13%-50% above it. 46 startups raising, median ask $750K; 74% pre-seed.", "angle": "Proprietary data now has a price list. $100K-$2M for operational data is a new asset class for ordinary companies.", "tweetA": "There's now a price list for your company's operational data: $100K to $2M per deal. Every SaaS firm sitting on years of workflow logs has an unrecorded asset. The data market is pricing before the accounting is. $CRM $NOW", "tweetB": "Experts at $60-200/hr to train models, funded by a $1B budget. The most reliable AI job category is teaching the AI. Labour arbitrage with a short half-life.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/kalshi-40b-meta-15b-bonds-binance-hack-weekly-recap"}, {"id": 26, "cat": "venture", "urgency": "watch", "source": "The Founders Corner", "title": "New funds this week: Creandum €668M, Endeavor Catalyst $320M, Aavishkaar $263M, Ballistic $490M cyber, plus Nooks $500M customer-value financing (135% NRR)", "idea": "Creandum closed €668M Fund VIII; Endeavor Catalyst $320M; Aavishkaar $263M India cleantech/fintech; Flashpoint $116M; Ballistic seeking $490M for cybersecurity. Nooks took $500M from GC's Customer Value Fund, repaid from customer value created, with 2,000+ customers, 135% NRR, ~3x growth.", "angle": "Revenue-linked financing (GC Customer Value Fund) is a new instrument between equity and debt. Niche-vertical funds proliferating.", "tweetA": "Nooks borrowed $500M repaid out of the value its customers create. That's not venture, not debt. It's an outcome-based security. If it works, it prices AI products by results.", "tweetB": "Cyber funds raising $490M just as a $6.3B exchange hack and subsea cable threats land the same week. Funding follows incidents with a 6-12 month lag.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.the-founders-corner.com/p/kalshi-40b-meta-15b-bonds-binance-hack-weekly-recap"}, {"id": 27, "cat": "AI/infra", "urgency": "deep", "source": "Citadel Securities' Frank Flight via Stephen Innes", "title": "Citadel: midterms make AI buildout harder, but scarce operating capacity may become more valuable — rotation between financers and suppliers", "idea": "Frank Flight argues the midterms may have changed AI-race economics more than the market appreciated: a tougher regulatory environment for development, but scarce operating capacity (built, powered, permitted) becomes more valuable. For equities he sees a rotation between those financing the AI expansion and those supplying it. The note also expects shifting political incentives to accelerate an Iran settlement, easing energy and bonds.", "angle": "Permitting bottleneck as moat: owners of energised capacity gain pricing power; developers lose. Ties to Ironsides' lame-duck permitting watch.", "tweetA": "If it gets harder to build data centres, the ones already energised are worth more. Regulation turns capex into a barrier to entry for the incumbents. Long the built, short the pipeline. $EQIX $DLR $VRT", "tweetB": "Two kinds of AI stocks: the ones who pay for the buildout and the ones who sell into it. A blue-wave regulatory squeeze helps the sellers. Hyperscaler multiples are the funding side of that trade. $NVDA $META", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/citadel-frank-flight-asks-houston"}, {"id": 28, "cat": "culture", "urgency": "watch", "source": "The Hermit: Institutional Research", "title": "Portfolio tear-down: a self-taught Canadian investor shifts from junior gold/uranium to cannabis turnarounds, tracks consumer shift 'alcohol to cannabis' via headset.io", "idea": "A 65-minute teardown session: guest moved from speculative junior miners and uranium to Canadian small-cap cash-flow-positive cannabis (Auxly, Village Farms), uses real-time consumer data (headset.io) and scuttlebutt on shifting consumer habits from alcohol to cannabis. Advice: hold 15-25% cash at ~5% yield for TSX Venture volatility; core holdings in TFSA.", "angle": "Retail-level discipline: concentration at the top, 'casino' sleeve at the bottom, cut losers quickly, cash as optionality in illiquid venues.", "tweetA": "Hold 15-25% cash at 5% and you can buy the next TSX Venture flush when everyone else is forced seller. In illiquid markets, dry powder is the only liquidity you control.", "tweetB": "Alcohol-to-cannabis substitution tracked in real time with POS data. Consumer data vendors are doing the sociology that sell-side used to do with surveys. $ABEV $TLRY", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.hermitresearch.com/p/portfolio-tear-down-1-canadian-pits"}];
