    tweetA:"The bond market spent 2026 worried about inflation. Now Bloomberg's MLIV desk says it's flipped to worrying the Fed tightens too far — and it's the front end doing the damage this time, not the long end. That's the more dangerous inversion historically. Banks are already showing it in price.",
    tweetB:"Put this next to Morgan Stanley's note the same week: MS asks if growth can keep outrunning rates, Bloomberg's desk says the curve is now betting the Fed breaks that race itself via policy error. Same week, same tension, opposite ends of the curve telling the story.",
    charts:{count:0, hot:false, desc:"Charts inside — worth opening"},
    link:"https://thedarksideoftheboom.substack.com/p/bond-market-on-the-brink-of-sounding"
  }
];

const META = {
  date:"2026-09-28",
  time:"03:12 CEST",
  windowStart:"2026-09-27 21:12 CEST",
  windowEnd:"2026-09-28 03:12 CEST",
  emailsInWindow:8,
  emailsRead:8,
  itemsExtracted:14,
  includedSources:[
    {name:"The Market House / Craig Shapiro", count:1},
    {name:"Rupak Ghose's Substack", count:2},
    {name:"Cubic Analytics", count:1},
    {name:"Global Threads with Peter Frankopan", count:1},
    {name:"P Equity Research (Speedrun)", count:2},
    {name:"Dark Side of the Boom™", count:2},
    {name:"The Pressure Point (Fulcrum)", count:5}
  ],
  skippedSources:[]
};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;
let openCards = {};

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function catCounts(){
  const m = {};
  ITEMS.forEach(i => { m[i.cat] = (m[i.cat]||0) + 1; });
  return m;
}
function urgCounts(){
  const m = {act:0, deep:0, watch:0};
  ITEMS.forEach(i => { m[i.urgency] = (m[i.urgency]||0) + 1; });
  return m;
}

function renderMeta(){
  document.getElementById("meta-line").innerHTML =
    esc(META.date) + " &middot; <span class=\"mono\">" + esc(META.time) + "</span> &middot; " +
    META.itemsExtracted + " items from " + META.includedSources.length + " sources";
}

function renderCatFilters(){
  const counts = catCounts();
  const cats = Object.keys(counts).sort();
  let html = '<button class="pill' + (activeCat==="all"?" active":"") + '" style="' +
    (activeCat==="all" ? "background:#1c1a17;" : "") + '" onclick="setCat(\'all\')">All<span class="count">' + ITEMS.length + '</span></button>';
  cats.forEach(c => {
    const color = CAT_COLORS[c] || "#999";
    const isActive = activeCat === c;
    html += '<button class="pill' + (isActive?" active":"") + '" style="' +
      (isActive ? ("background:" + color + ";border-color:" + color + ";") : ("color:" + color + ";border-color:" + color + ";")) +
      '" onclick="setCat(\'' + c + '\')">' + esc(c) + '<span class="count">' + counts[c] + '</span></button>';
  });
  document.getElementById("cat-filters").innerHTML = html;
}

function renderUrgFilters(){
  const counts = urgCounts();
  let html = '<button class="pill' + (activeUrg==="all"?" active":"") + '" style="' +
    (activeUrg==="all" ? "background:#1c1a17;" : "") + '" onclick="setUrg(\'all\')">All<span class="count">' + ITEMS.length + '</span></button>';
  Object.keys(URG_META).forEach(u => {
    const isActive = activeUrg === u;
    const bg = u==="act" ? "#e24b4a" : u==="watch" ? "#c98a12" : "#378add";
    html += '<button class="pill' + (isActive?" active":"") + '" style="' +
      (isActive ? ("background:" + bg + ";border-color:" + bg + ";") : "") +
      '" onclick="setUrg(\'' + u + '\')">' + URG_META[u].emoji + ' ' + URG_META[u].label + '<span class="count">' + counts[u] + '</span></button>';
  });
  document.getElementById("urg-filters").innerHTML = html;
}

function setCat(c){ activeCat = c; activeSrc = null; renderAll(); }
function setUrg(u){ activeUrg = u; activeSrc = null; renderAll(); }

function filterBySrc(name){
  activeSrc = name;
  activeCat = "all";
  activeUrg = "all";
  renderAll();
  ITEMS.forEach(i => {
    if (i.source.indexOf(name) !== -1) openCards[i.id] = true;
  });
  renderCards();
}

function toggleCard(id){
  openCards[id] = !openCards[id];
  renderCards();
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var btn = event.target;
  function done(){
    btn.textContent = '✓ Copied';
    setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text, done); });
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, cb){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
  cb();
}

function cardHTML(item){
  const color = CAT_COLORS[item.cat] || "#999";
  const urg = URG_META[item.urgency];
  const isOpen = !!openCards[item.id];
  const chartFlag = item.charts.count > 0 ? "📊" : (item.charts.desc ? "📄" : "");
  const hotFlag = item.charts.hot ? " 🔥" : "";

  let head = '<div class="card-head" onclick="toggleCard(' + item.id + ')">' +
    '<span class="idx mono">' + String(item.id).padStart(2,"0") + '</span>' +
    '<span class="urg-emoji">' + urg.emoji + '</span>' +
    '<span class="src-badge" style="background:' + color + '">' + esc(item.source.split(" (")[0].split(" /")[0]) + '</span>' +
    '<span class="cat-tag">' + esc(item.cat) + '</span>' +
    (chartFlag ? '<span class="chart-flag">' + chartFlag + hotFlag + '</span>' : '') +
    '<span class="card-title">' + esc(item.title) + '</span>' +
    '<span class="caret">' + (isOpen ? "▲" : "▼") + '</span>' +
    '</div>';

  let chartSection = "";
  if (item.charts.desc) {
    chartSection = '<div class="chart-note' + (item.charts.hot ? " hot" : "") + '">' +
      (item.charts.hot ? "🔥" : "📊") + '<span>' + esc(item.charts.desc) + '</span></div>';
  }

  let body = '<div class="card-body' + (isOpen ? " open" : "") + '" id="body-' + item.id + '">' +
    '<div class="block-label">The Idea</div>' +
    '<div class="idea-text">' + esc(item.idea) + '</div>' +
    '<div class="block-label">My Angle</div>' +
    '<div class="angle-box" style="--angle-color:' + color + ';--angle-bg:' + color + '14;">' + esc(item.angle) + '</div>' +
    '<div class="tweets">' +
      '<div class="tweet-box a"><div class="tweet-head"><span>TWEET A</span><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div><div class="tweet-text">' + esc(item.tweetA) + '</div></div>' +
      '<div class="tweet-box b"><div class="tweet-head"><span>TWEET B</span><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div><div class="tweet-text">' + esc(item.tweetB) + '</div></div>' +
    '</div>' +
    chartSection +
    '<a class="read-link" href="' + esc(item.link) + '" target="_blank">↗ Read full article</a>' +
    '</div>';

  return '<div class="card">' + head + body + '</div>';
}

function renderCards(){
  let list = ITEMS.filter(i => {
    if (activeCat !== "all" && i.cat !== activeCat) return false;
    if (activeUrg !== "all" && i.urgency !== activeUrg) return false;
    if (activeSrc && i.source.indexOf(activeSrc) === -1) return false;
    return true;
  });
  const container = document.getElementById("cards");
  const empty = document.getElementById("empty-state");
  if (list.length === 0) {
    container.innerHTML = "";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";
  container.innerHTML = list.map(cardHTML).join("");
}

function renderReport(){
  let html = '<h4>Time Window</h4><div>' + esc(META.windowStart) + ' &rarr; ' + esc(META.windowEnd) + '</div>';
  html += '<h4>Emails</h4><div>' + META.emailsRead + ' of ' + META.emailsInWindow + ' emails in window read in full.</div>';
  html += '<h4>Included Sources</h4><div>';
  META.includedSources.forEach(s => {
    html += '<span class="src-item" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + esc(s.name) + ' (' + s.count + ')</span>';
  });
  html += '</div>';
  if (META.skippedSources.length){
    html += '<h4>Skipped Sources</h4><div>';
    META.skippedSources.forEach(s => { html += '<span class="src-item">' + esc(s) + '</span>'; });
    html += '</div>';
  } else {
    html += '<h4>Skipped Sources</h4><div>None — every email in the window had extractable content.</div>';
  }
  html += '<div class="totals"><b>' + META.itemsExtracted + '</b> items extracted from <b>' + META.includedSources.length + '</b> sources.</div>';
  document.getElementById("rep-body").innerHTML = html;
}

function renderAll(){
  renderMeta();
  renderCatFilters();
  renderUrgFilters();
  renderCards();
}

document.getElementById("rep-toggle").addEventListener("click", function(){
  const body = document.getElementById("rep-body");
  const caret = document.getElementById("rep-caret");
  const isOpen = body.classList.toggle("open");
  caret.textContent = isOpen ? "▴" : "▾";
});

renderAll();
renderReport();
</script>
