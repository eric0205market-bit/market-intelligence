const ITEMS = [{"cat": "venture", "urgency": "deep", "source": "Rupak Ghose / Prediction markets", "title": "Kalshi + Polymarket volume went $4.5bn to $53bn a month in ten months", "idea": "Combined monthly volume: $4.5bn (Sep 2025) → $25.1bn (Apr 2026) → $25.7bn (May) → $53.0bn (Jul). Kalshi valued at $22bn in May with talks at $40bn; Polymarket $15bn in April, seeking ~$21bn. Ghose compares the debate to early crypto: gambling vs. real-world use vs. financial conduit.", "angle": "Volume doubled in two months while institutions are barely in. Flow is retail-led, so the second leg is liquidity providers arriving.", "tweetA": "Kalshi's valuation nearly doubled in a few weeks, and monthly volume is up 12x in under a year. Retail is still doing nearly all of it. What does this look like once the Jane Street / Jump desks are fully switched on?", "tweetB": "$53bn a month on a venue that was a court case two years ago. Crypto took about six years to get from 'gambling' to ICE writing a $1.6bn cheque. Prediction markets did it in two. The Wild West phase is shorter this time.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://rupakghose.substack.com/p/prediction-markets", "id": 1}, {"cat": "positioning", "urgency": "deep", "source": "Rupak Ghose / Prediction markets", "title": "Prediction markets are eating DraftKings and Flutter: -42% and -68% in a year", "idea": "Sports are the bulk of prediction volume; the Super Bowl saw ~10x YoY volume and the World Cup was a tailwind. DraftKings is ~$9.5bn market cap (-42% 1Y), Flutter/FanDuel ~$13.2bn (-68%). Ghose says event contracts cannibalize betting that would have happened on regulated sportsbooks.", "angle": "Public market already priced the substitution. Question is whether the volume moves to a structurally lower-margin, exchange-style venue.", "tweetA": "Flutter -68%, DraftKings -42%, and prediction volume 10x'd around the Super Bowl. The market is pricing a substitution before the sportsbooks have printed the earnings that show it. $DKNG $FLUT", "tweetB": "A sportsbook sets the odds and keeps the vig. An exchange takes a fee and lets SIG-style market makers set the price. If sports flows migrate, the profit pool moves from the house to the pros who are now hiring 80-person teams.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://rupakghose.substack.com/p/prediction-markets", "id": 2}, {"cat": "regulation", "urgency": "act", "source": "Rupak Ghose / Prediction markets", "title": "CME sues the CFTC over Kalshi's bitcoin perp; Kalshi files for a never-expiring WTI future the same day", "idea": "CME has sued the CFTC over approval of Kalshi's BTC perpetual (argues swaps, not futures). The CFTC replied that 'incumbents fear the future'. ICE owns a stake in Polymarket ($1.64bn). Kalshi filed today for a 24x5 non-expiring WTI contract after CME pulled its 24/7 expiry-cycle plan Friday. CME shares fell on retail-loss fears.", "angle": "Oil is the next contested product. A perpetual WTI on a retail-heavy venue with Brent dated near $130 is a volatility product waiting for a user base.", "tweetA": "CME withdrew its 24/7 oil contract on Friday. Kalshi filed a 24/5 perpetual WTI today. The incumbent is in court against its own regulator while the new venue ships. Who do you think wins the retail oil trade? $CME $ICE", "tweetB": "Perpetual futures made crypto exchanges rich because they never expire and you can lever them. Now one is being proposed on WTI, in a market where dated Brent is $30 over futures. I'd want to see the margin rules before I'd call it a hedging tool.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://rupakghose.substack.com/p/prediction-markets", "id": 3}, {"cat": "positioning", "urgency": "deep", "source": "Rupak Ghose / Prediction markets", "title": "SIG's prediction desk: 80 people out of 3,500, underwriting not just market making", "idea": "SIG merged Bala Cynwyd macro and Dublin sports analytics into an 80-person "desc": ""}, "link": "https://rupakghose.substack.com/p/prediction-markets", "id": 5}, {"cat": "macro", "urgency": "deep", "source": "Daily Chartbook (DC Lite #699) / @rickpalaciosjr", "title": "Almost no households want to buy at 7.5% mortgage rates", "idea": "Quote from a survey: 'Very, very few households we just surveyed are interested in buying a home at 7.5% mortgage rates. Only time will tell if/when this housing logjam starts to break.' One chart on mortgage demand.", "angle": "A 7.5% rate lock-in plus a 10y at 5.3% means no turnover, no mobility, and a stalled residential-investment channel.", "tweetA": "With the 10-year at 5.3%, mortgages are at 7.5% and buyers have disappeared. I'd stop asking when housing 'recovers' and start asking what a market with zero turnover does to labor mobility. $XHB", "tweetB": "Housing wasn't a victim of the rate rise, it was a policy transmission mechanism. At 7.5% the Fed isn't slowing demand, it's removing it. Then the minutes say another hike has broad support.", "charts": {"count": 1, "hot": false, "desc": "Mortgage demand survey chart (@rickpalaciosjr)"}, "link": "https://www.dailychartbook.com/p/defense-sentiment-is-at-one-of-the-lowest-levels-in-the-last-ten-years-06ef", "id": 6}, {"cat": "macro", "urgency": "deep", "source": "Daily Chartbook (DC Lite #699) / NY Fed", "title": "1-year inflation expectations hit 3.9%, the highest in 3+ years", "idea": "NY Fed SCE: consumers' year-ahead inflation expectations rose to 3.9% in September, highest in over three years.", "angle": "Expectations rising into a hawkish Fed and a $130 physical Brent; the Fed will be reading it differently than 'transitory'.", "tweetA": "3.9% one-year expectations: highest in three years. The Fed spent the cycle arguing expectations were anchored. They're not anymore, and dated Brent is $130. $TLT", "tweetB": "Consumers priced in 3.9% before the oil move has fully reached the pump. If expectations lead, the Fed doesn't hike because of CPI, it hikes because of what households think CPI will be.", "charts": {"count": 1, "hot": false, "desc": "NY Fed SCE year-ahead inflation expectations"}, "link": "https://www.dailychartbook.com/p/defense-sentiment-is-at-one-of-the-lowest-levels-in-the-last-ten-years-06ef", "id": 7}, {"cat": "positioning", "urgency": "deep", "source": "Daily Chartbook (DC Lite #699) / Thrasher Analytics + Goldman", "title": "Defense sentiment at a 10-year low, while hedge funds hold record Mag7 exposure", "idea": "Thrasher: defensive-sector sentiment is among the lowest in ten years, but he says that alone isn't a mean-reversion signal. Goldman prime book: net exposure to Mag7 as % of total US exposure ~22%, highest since start of 2022.", "angle": "Offense crowded, defense hated, yields at 5%+. That's the classic setup for a violent rotation if yields stall.", "tweetA": "Nobody wants defensives and hedge funds are the most Mag7-long since 2022. Everything is positioned for one outcome. The question isn't who's right, it's what the first trade out looks like.", "tweetB": "Defensive sentiment lowest in a decade, and the 10-year just touched 5.365%. If you want a cheap hedge against the AI trade, it's the sector nobody has an opinion on. $XLP $XLU", "charts": {"count": 2, "hot": true, "desc": "Two charts: sector sentiment spread (Thrasher) and Goldman HF Mag7 net exposure at ~22% of US book"}, "link": "https://www.dailychartbook.com/p/defense-sentiment-is-at-one-of-the-lowest-levels-in-the-last-ten-years-06ef", "id": 8}, {"cat": "positioning", "urgency": "watch", "source": "Daily Chartbook (DC Lite #699) / Jeff Hirsch", "title": "New S&P all-time high in October: Q4 averages +4.74% vs +3.99%", "idea": "Since 1950, years with at least one record close in October have averaged 4.74% in Q4 versus 3.99% in all other years.", "angle": "A 75bp edge over 76 years is not a signal. It's a comfort chart in a market with bad breadth.", "tweetA": "+4.74% vs +3.99%. That's the entire edge of the 'October highs are bullish' chart. It's not a signal, it's a rounding error with a narrative.", "tweetB": "The S&P made a record while small caps lagged the Nasdaq in 17 of 20 sessions. I'd take the seasonality stat and ask who is doing the buying.", "charts": {"count": 1, "hot": false, "desc": "Almanac Trader chart of Q4 returns after October ATHs"}, "link": "https://www.dailychartbook.com/p/defense-sentiment-is-at-one-of-the-lowest-levels-in-the-last-ten-years-06ef", "id": 9}, {"cat": "energy", "urgency": "act", "source": "Dark Side of the Boom", "title": "Dated Brent near $130, almost $30 over futures", "idea": "Dated Brent ~$130, ~$30 above Brent futures. The author says the physical market is far tighter than the curve; keeps December Fed hike alive since the September minutes changed nothing and energy 'does some of the hawks' work for them'.", "angle": "The futures-physical gap is the hidden variable. Anything benchmarked to futures is mispricing what refiners and airlines are actually paying.", "tweetA": "Dated Brent $130, futures ~$100. A $30 gap isn't a spread, it's the market telling you the screen is lying. Everything priced off the futures curve has the wrong oil price. $XLE $VLO", "tweetB": "The Fed minutes didn't move anything because oil is already doing the tightening. Softer labor data pulls the front end down, oil pulls the Fed back up. Pick which one you think is faster.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/asia-open-oil-bonds-and-europe-turn", "id": 10}, {"cat": "positioning", "urgency": "act", "source": "Dark Side of the Boom", "title": "Korea: Samsung and SK Hynix buybacks may finish much earlier than expected, Kospi rolls over", "idea": "Kospi rolled over as Samsung Electronics and SK Hynix buyback programmes, which had quietly supported the market for two months, look set to end earlier than expected. The author's point: some strength treated as structural was a large corporate bid. Samsung numbers are due Thursday.", "angle": "Memory names are an AI-capex proxy. If the bid is removed, Samsung's print is the real test of the profit cycle validating the capital cycle.", "tweetA": "Two companies' buyback programs were holding up a national index. They're running out early. Before you call it an AI memory story, ask who the marginal buyer was. $005930.KS $000660.KS", "tweetB": "Thursday's Samsung numbers are a test of whether profits can keep validating capex. If buybacks are done, the stock has to rely on earnings alone, and the bar is high.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/asia-open-oil-bonds-and-europe-turn", "id": 11}, {"cat": "credit", "urgency": "act", "source": "Dark Side of the Boom", "title": "France: OAT spreads back near 140bp, the ECB won't buy bonds, and stress is reaching bank equities", "idea": "French spreads widened toward 140bp; shadow-budget relief evaporated; ECB signalled the stress doesn't justify renewed purchases. The author argues banks are the screen to watch: sovereign stress into bank equities, funding and credit conditions is the self-reinforcing loop. His view: 'more nuisance than crisis' but direction is wrong.", "angle": "The gap between 'stress builds' and 'Frankfurt acts' is where the trade lives. Banks, not OATs, are the signal.", "tweetA": "OATs at 140bp and the ECB says it's not enough to buy. Fine. Banks own the debt, so watch Societe Generale and BNP rather than the spread. Stress keeps building until Frankfurt decides it's their problem. $EWQ", "tweetB": "Dollar strength, French bonds and a record S&P in the same week. The US is the cleanest shirt in a dirty laundry basket and everyone knows it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/asia-open-oil-bonds-and-europe-turn", "id": 12}, {"cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom", "title": "Breadth: small caps lag the Nasdaq 17 of 20 sessions; Goldman quality basket surges, most-shorted drops", "idea": "Small caps lagged the Nasdaq in 17 of the past 20 sessions; equal-weight losing to cap-weight. Goldman: quality basket surged, most-shorted basket near a 2-month low, rare earths, robotics and uranium hit hard. S&P EPS growth expectations are above 24% for the earnings season. 'Higher rates are not killing the bull market. They are exposing which parts of it were built for a lower-rate world.'", "angle": "Quality over junk is a rates trade, not a risk-off. At 24% growth expected, 'good' may not be enough.", "tweetA": "Small caps trailed the Nasdaq in 17 of 20 sessions, and the most-shorted basket is falling, not squeezing. This isn't risk-off. It's the market finally charging rent on balance sheets. $IWM", "tweetB": "Consensus wants the market to 'broaden'. Breadth needs cheaper money or cheaper energy, and we have the opposite of both. 24% EPS growth expected against that is a high bar.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/asia-open-oil-bonds-and-europe-turn", "id": 13}, {"cat": "gold", "urgency": "deep", "source": "The Bubble Bubble", "title": "Gold and miners: the dollar/yield squeeze looks overbought; 10y hit 5.365% and reversed to 5.286% on a strong auction", "idea": "10y blasted through 5%, touched 5.365% intraday, then reversed to close 5.286% after a strong auction, leaving a third long upper wick. DXY is also overbought with several upper wicks. Dollar strength is partly French bonds and riots weakening the euro; also Fed Chair Warsh's hawkish stance. Author calls a cooling-off for yields/dollar, which would help metals.", "angle": "Technical call, but the auction reversal is the real event: demand showed up at 5.3%.", "tweetA": "The 10-year hit 5.365%, a strong auction pulled it back to 5.286%. That is a real buyer, not a candle pattern. For gold it matters more than any chart.", "tweetB": "Gold got hit by a dollar that rose on French bonds, riots and a hawkish Warsh. That isn't a gold story, it's a euro story. If Europe stabilizes, the dollar bid leaks out. $GLD $GDX", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening (10y yield, DXY, gold)"}, "link": "https://thebubblebubble.substack.com/p/a-precious-metals-and-miners-update-bb9", "id": 14}, {"cat": "regulation", "urgency": "deep", "source": "The Pressure Point (Fulcrum)", "title": "The FBI sold the fact it must prove: entrapment in the Mall of America case", "idea": "An 18-year-old allegedly named the Mall of America as a target and bought an AK-style rifle from an undercover FBI employee. The charge is receiving a firearm knowing it would be used in a terrorism crime, so the sale is the alleged offense. The fight is inducement vs predisposition: who first proposed the gun.", "angle": "Preventive counterterrorism pushes agents to build the act themselves.", "tweetA": "When the undercover agent sells the rifle, the sale is both the evidence and the entrapment defense. The government needs the act and then has to prove it didn't create it. Who proposed the gun will decide the case.", "tweetB": "There's an old rule in intelligence: the earlier you intervene, the less you can prove. The FBI solved it with a sale. The defense will say the solution also manufactured the crime.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-the-fbi-sold-the-fact-it-must/", "id": 15}, {"cat": "culture", "urgency": "watch", "source": "The Pressure Point (Fulcrum)", "title": "Tennessee's failed execution: Christa Pike survived two pentobarbital doses", "idea": "A judge ordered Tennessee to preserve evidence after Christa Pike survived two lethal pentobarbital doses and remained hospitalized.", "angle": "Drug supply and protocol failures keep stacking up. Courts, not legislatures, are going to set the pace.", "tweetA": "Two lethal doses and the prisoner is alive in hospital. At some point the question stops being about the death penalty and starts being about whether a state can run a procedure it can't verify.", "tweetB": "Evidence preservation order is the interesting part. It means a court expects litigation about the drug, the supplier and the protocol. That's the discovery that ends the program.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-the-fbi-sold-the-fact-it-must/", "id": 16}, {"cat": "geopolitics", "urgency": "watch", "source": "The Pressure Point (Fulcrum) / Axios", "title": "Student unrest over education costs spreads from France to Belgium; police clashes", "idea": "Police and protesters clashed in Belgium as student unrest over education costs and school conditions spread from France.", "angle": "Same week as OAT spreads at 140bp. Fiscal stress and street politics are converging in the euro core.", "tweetA": "French spreads widen, French students riot, now Belgium. Austerity politics doesn't stay in one bond market. Watch the budget calendar, not the ECB. $EWQ", "tweetB": "The bond market says France can't afford more. The street says France can't afford less. That's not a spread, that's a political constraint.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-the-fbi-sold-the-fact-it-must/", "id": 17}, {"cat": "geopolitics", "urgency": "watch", "source": "The Pressure Point (Fulcrum) / The Hill", "title": "Michigan GOP Senate candidate Mike Rogers calls for ending the US-Canada trade war", "idea": "Mike Rogers said the trade war with Canada should end as tariffs weigh on his campaign.", "angle": "Tariff politics is starting to cost votes in swing states. Midterm pressure is a policy variable.", "tweetA": "A Republican Senate candidate in Michigan wants the Canada tariffs gone. When the tariff costs votes in the Rust Belt, it becomes negotiable. Watch for others. $GM $F", "tweetB": "Canada trade war is now a Michigan campaign issue. Autos cross that border several times before they're sold. The first Republicans to break will be the ones in auto states.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pressurepoint.whatsthelatest.ai/archive/the-pressure-point-the-fbi-sold-the-fact-it-must/", "id": 18}, {"cat": "tech", "urgency": "deep", "source": "Chipstrat (Austin Lyons) / The Compute 100", "title": "Why the CUDA moat shrank when LLM inference became the biggest market", "idea": "Lyons: the CUDA moat was breadth of libraries across HPC, oil and gas, quant finance. Once LLM inference became a TAM larger than all of those, competitors only need to be competitive for inference. That is why AMD (Instinct/ROCm) and AI accelerator startups can compete. Hyperscalers who know their workloads can trade flexibility for specialization.", "angle": "The moat didn't get breached, the market got narrower. A single dominant workload is the enemy of a general-purpose platform.", "tweetA": "CUDA was a moat when the market was a hundred different workloads. One workload is bigger than the other 99 combined, so the moat only has to cover one. That is a structurally different competitive problem for $NVDA.", "tweetB": "Your moat is breadth until your customer is one thing. LLM inference made a general platform into a niche competition. AMD only has to win attention, KV cache and ROCm for that, not HPC. $AMD", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.chipstrat.com/p/the-compute-100-startups-vs-incumbents", "id": 19}, {"cat": "AI/infra", "urgency": "deep", "source": "Chipstrat (Austin Lyons) / The Compute 100", "title": "Intel Foundry's real change is cultural: becoming a service business, and EMIB as a CoWoS alternative", "idea": "Lyons: Intel fell behind by missing EUV; as an IDM the foundry only served the product team and had no customer , "desc": ""}, "link": "https://www.chipstrat.com/p/the-compute-100-startups-vs-incumbents", "id": 21}, {"cat": "AI/infra", "urgency": "watch", "source": "Chipstrat (Austin Lyons) / The Compute 100", "title": "Rivian's RAP1 and the case for custom edge compute in physical AI", "idea": "Rivian built its own Autonomy Processor (RAP1) because off-the-shelf parts lacked a real-time OS and hard latency budgets for camera and lidar data. They created their own communication protocol. Lyons also covers AI-native EDA startups vs Cadence, Synopsys and Siemens, and says thermal and electrical design can no longer be separated in 3D stacks.", "angle": "Another vertical integrating silicon. The EDA toolchain has to unify thermal and electrical.", "tweetA": "Rivian built its own chip and its own interconnect protocol because nothing existing met a hard latency budget. When an automaker designs a processor, the merchant silicon vendors have a problem. $RIVN", "tweetB": "Electrical and thermal used to be separate teams. In 3D stacks they can't be. That's the opening for AI-native EDA, and it's a bet against $CDNS and $SNPS being fast enough to adapt.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.chipstrat.com/p/the-compute-100-startups-vs-incumbents", "id": 22}, {"cat": "AI/infra", "urgency": "act", "source": "BEP Research (Ben Pouladian)", "title": "Wolfspeed: conditional $1.5bn government loan, first $600m to refinance the 15.875% first-lien", "idea": "Wolfspeed announced a conditional 30-year $1.5bn loan commitment from the US Department of War. The first $600m is meant to refinance first-lien debt at a 15.875% cash coupon. Costs: government warrants, required equity funding, possible conversion of existing debt: meaningful dilution. Pouladian's June piece, 'The Mohawk Number', centered on the refinancing.", "angle": "Government as lender of last resort for domestic SiC/GaN: a defense-industrial template.", "tweetA": "A 15.875% coupon replaced by gove rn.", "tweetA": "Most demos fail on the first login after the call. Clay flipped it: the customer drives. If your product needs training, the sales call is the training.", "tweetB": "A demo is a performance and a reverse demo is a rehearsal. One shows you can use it, the other shows they can. Guess which predicts retention.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://twistartups.substack.com/p/make-your-customer-drive-during-your", "id": 25}, {"cat": "venture", "urgency": "watch", "source": "a16z speedrun", "title": "speedrun: team weighted highest, traction can be qualitative, no AI voice in the video; SafeWorld raises $12.2M seed", "idea": "speedrun investors: ~80% of review time on team/bio; 'slope' matters more than traction; ~40-person speedrun team with ~8 investors; applications for SR008 open Oct 12; avoid AI voice generation in the application video. SafeWorld (SR006) raised a $12.2M seed 'to make robots safe'. Alpha (students/new grads, up to $250K) is in its final week.", "angle": "Robot safety is getting seed funding; the funnel favors team over traction.", "tweetA": "Investors at a16z speedrun say they spend most of their time on the team and explicitly don't want AI-generated voices. In a world where everything can be synthesized, the signal is that you sound like yourself.", "tweetB": "$12.2M seed for a company whose entire pitch is making robots safe. Safety is becoming its own category of startup, just as autonomy ships.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://speedrun.substack.com/p/what-founders-ask-us-before-applying", "id": 26}];
