const META = {
  date: "2026-09-14",
  time: "03:08 CEST",
  windowStart: "2026-09-13 21:04 CEST",
  windowEnd: "2026-09-14 03:04 CEST",
  emailsInWindow: 15,
  emailsRead: 15,
  itemsExtracted: 23,
  includedSources: [
    {name:"Dark Side of the Boom™", count:4},
    {name:"Eliant Capital", count:2},
    {name:"Topdown Charts", count:1},
    {name:"The Pressure Point", count:5},
    {name:"McKinsey & Company", count:1},
    {name:"Speedrun", count:3},
    {name:"SixSigmaCapital", count:3},
    {name:"Global Threads", count:1},
    {name:"Norseman Market Timing", count:1},
    {name:"The Bubble Bubble", count:2}
  ],
  skippedSources: [
    {name:"Eliant's Exploits subscriber chat", reason:"Duplicate chat-notification teaser — zero original content beyond a link to the same 'Week Ahead' post already processed as items 5-6."},
    {name:"seven c Newsletter #185", reason:"Table-of-contents-only email — section headers and teaser links with zero sentences of actual body content."}
  ]
};

const CATS = [
  {key:"macro", label:"Macro"}, {key:"credit", label:"Credit"}, {key:"positioning", label:"Positioning"},
  {key:"ai", label:"AI/Infra"}, {key:"crypto", label:"Crypto"}, {key:"geopolitics", label:"Geopolitics"},
  {key:"energy", label:"Energy"}, {key:"tech", label:"Tech"}, {key:"gold", label:"Gold"},
  {key:"culture", label:"Culture"}, {key:"labor", label:"Labor"}, {key:"regulation", label:"Regulation"},
  {key:"science", label:"Science"}, {key:"venture", label:"Venture"}
];
const URGENCY = [
  {key:"red", label:"🔴 Act Now"}, {key:"deep", label:"🔵 Deep"}, {key:"watch", label:"🟡 Watch"}
];

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function catColor(cat){ return getComputedStyle(document.documentElement).getPropertyValue('--'+cat).trim() || '#888'; }

function counts(list){
  const c = {}; list.forEach(i => { c[i.cat] = (c[i.cat]||0)+1; c['urg_'+i.urgency] = (c['urg_'+i.urgency]||0)+1; });
  return c;
}

function renderBars(){
  const c = counts(ITEMS);
  const catBar = document.getElementById('catBar');
  let html = '<button class="pill'+(activeCat==='all'?' active':'')+'" style="'+(activeCat==='all'?'background:#333;':'')+'" onclick="setCat(\'all\')">All ('+ITEMS.length+')</button>';
  CATS.forEach(cc => {
    if(!c[cc.key]) return;
    const on = activeCat===cc.key;
    html += '<button class="pill'+(on?' active':'')+'" style="'+(on?('background:'+catColor(cc.key)+';'):'')+'" onclick="setCat(\''+cc.key+'\')">'+cc.label+' ('+c[cc.key]+')</button>';
  });
  catBar.innerHTML = html;

  const urgBar = document.getElementById('urgBar');
  let uhtml = '<button class="pill'+(activeUrg==='all'?' active':'')+'" style="'+(activeUrg==='all'?'background:#333;':'')+'" onclick="setUrg(\'all\')">All</button>';
  URGENCY.forEach(u => {
    if(!c['urg_'+u.key]) return;
    const on = activeUrg===u.key;
    uhtml += '<button class="pill'+(on?' active':'')+'" style="'+(on?'background:#333;':'')+'" onclick="setUrg(\''+u.key+'\')">'+u.label+' ('+c['urg_'+u.key]+')</button>';
  });
  urgBar.innerHTML = uhtml;
}

function setCat(k){ activeCat=k; activeSrc=null; renderBars(); renderCards(); }
function setUrg(k){ activeUrg=k; activeSrc=null; renderBars(); renderCards(); }
function filterBySrc(name){
  activeSrc = name; activeCat='all'; activeUrg='all';
  renderBars(); renderCards(true);
}

function urgEmoji(u){ return u==='red' ? '🔴' : (u==='watch' ? '🟡' : '🔵'); }

function renderCards(expandMatches){
  const list = ITEMS.filter(i => {
    if(activeSrc && i.source.indexOf(activeSrc) === -1) return false;
    if(activeCat!=='all' && i.cat!==activeCat) return false;
    if(activeUrg!=='all' && i.urgency!==activeUrg) return false;
    return true;
  });
  const box = document.getElementById('cards');
  let html = '';
  list.forEach(item => {
    const color = catColor(item.cat);
    const catLabel = (CATS.find(c=>c.key===item.cat)||{label:item.cat}).label;
    const chartIcon = item.charts && item.charts.count>0 ? (item.charts.hot ? ' 🔥' : ' 📊') : '';
    const shouldOpen = expandMatches ? true : false;
    html += '<div class="card" data-id="'+item.id+'">';
    html += '<div class="card-header" onclick="toggleCard('+item.id+')">';
    html += '<span class="idx">#'+item.id+'</span>';
    html += '<span>'+urgEmoji(item.urgency)+'</span>';
    html += '<span class="badge" style="background:'+color+'">'+item.source+'</span>';
    html += '<span class="cattag">'+catLabel+'</span>';
    html += '<span>'+chartIcon+'</span>';
    html += '<span class="title">'+item.title+'</span>';
    html += '</div>';
    html += '<div class="card-body'+(shouldOpen?' open':'')+'" id="body-'+item.id+'">';
    html += '<div class="label">The Idea</div><div class="idea">'+item.idea+'</div>';
    html += '<div class="label">My Angle</div><div class="angle" style="border-left-color:'+color+'; background:'+color+'11;">'+item.angle+'</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet"><div class="tweet-label a">TWEET A</div><div class="tweet-text">'+item.tweetA+'</div><button class="copy-btn" onclick="copyTweet('+item.id+',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet"><div class="tweet-label b">TWEET B</div><div class="tweet-text">'+item.tweetB+'</div><button class="copy-btn" onclick="copyTweet('+item.id+',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    if(item.charts){
      html += '<div class="chartbox'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 ':'📊 ')+'Charts: '+item.charts.count+' — '+item.charts.desc+'</div>';
    }
    html += '<a class="link" href="'+item.link+'" target="_blank">↗ Read full article</a>';
    html += '</div></div>';
  });
  box.innerHTML = html || '<p style="color:#888;">No items match this filter.</p>';
}

function toggleCard(id){
  const el = document.getElementById('body-'+id);
  if(el) el.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function renderReport(){
  let html = '<div class="meta" style="margin-bottom:10px;">Window: <strong>'+META.windowStart+'</strong> → <strong>'+META.windowEnd+'</strong>. Emails outside this window were not processed.</div>';
  html += '<div class="meta" style="margin-bottom:10px;">'+META.emailsRead+' of '+META.emailsInWindow+' emails in window read in full · '+META.itemsExtracted+' items extracted</div>';
  html += '<div class="label">Included Sources</div>';
  META.includedSources.forEach(s => {
    html += '<div class="srcrow"><span class="srcname" onclick="filterBySrc(\''+s.name+'\')">'+s.name+'</span><span>'+s.count+' item'+(s.count!==1?'s':'')+'</span></div>';
  });
  html += '<div class="label" style="margin-top:14px;">Skipped Sources</div>';
  META.skippedSources.forEach(s => {
    html += '<div class="srcrow"><span>'+s.name+'</span><span style="color:#888; text-align:right; max-width:60%;">'+s.reason+'</span></div>';
  });
  document.getElementById('reportBody').innerHTML = html;
}

document.getElementById('metaLine').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources';
renderBars();
renderCards();
renderReport();
</script>
