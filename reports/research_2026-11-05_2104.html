<script>
const ITEMS = [{"id": 1, "cat": "positioning", "urgency": "deep", "source": "Stephen Innes / The Dark Side of the Boom (JPMorgan / Goldman)", "title": "Largest momentum washout in 40+ years: two 6-sigma shocks in one week", "idea": "JPM's Arun Jain counts the second six-standard-deviation momentum shock in a single week, with one-month underperformance at about 5.8 sigma, the largest in more than forty years. Bloomberg's Simon White adds that the 3m-10y curve has flattened 40bp+ since early October while semis sit in a roughly 30% drawdown. Semis fell 3.1% on a day the Dow rose 3%.", "angle": "This looks like a liquidation, not a re-rating. Crowded-factor unwinds usually end in violent countertrend rallies, so I'm watching for the first day bad news fails to push semis lower.", "tweetA": "Six-sigma momentum shock. Twice. In one week. When a factor moves like that, nobody is repricing earnings, they are selling whatever they can still sell. The tell I'm waiting for: bad AI news and semis don't go down.", "tweetB": "Everyone is arguing about whether the semi selloff is fundamental. A 5.8 sigma one-month momentum move says it is mostly about who owns what. Fundamentals are a story you tell afterward. $SOXX", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/new-york-open-the-ai-trade-changes"}, {"id": 2, "cat": "positioning", "urgency": "deep", "source": "Stephen Innes / The Dark Side of the Boom (Bloomberg vol desk)", "title": "VIX 16.6 and implied correlation under 10: the index is calm because the stocks are fighting", "idea": "VIX fell 4.2 points to 16.6, but single-stock implied vol barely moved, the Cboe dispersion index was flat, and implied correlation dropped almost 7 points to below 10. Semis -3.1%, energy -4.8%, GS AI data-centre basket -5.4%, consumer discretionary +6.1% on a day the Nasdaq 100 gained only 0.9% after giving back 2.3%.", "angle": "Dispersion is the trade, not direction. Index vol is being suppressed by offsetting single-name violence.", "tweetA": "Implied correlation below 10 is not calm. It is a market where the winners and losers cancel out inside the index. VIX at 16.6 is telling you nothing about the risk in your semis.", "tweetB": "A 6.1% consumer discretionary day funded by a 5.4% AI data-centre loss. Same index level, completely different portfolio. If you hedged with SPX puts, you hedged the wrong thing.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/new-york-open-the-ai-trade-changes"}, {"id": 3, "cat": "positioning", "urgency": "deep", "source": "Bespoke Investment Group", "title": "A +1% S&P day with more 10% losers than 10% winners", "idea": "In the S&P 1500, 50 stocks fell more than 10% and 44 rose more than 10% on a day the S&P 500 gained over 1%. The 50 best S&P 500 stocks into Election Day gained an average 5.3%, the 50 worst fell 6.9%: the market pressed bets that were already in place.", "angle": "Ninety-plus double-digit movers on an index-up day is a positioning signature. It was a factor event dressed as an election reaction.", "tweetA": "More 10% losers than 10% winners on an S&P +1% day. That does not happen on news, it happens when crowded books get marked. The election was the excuse.", "tweetB": "Winners into the vote +5.3%, losers -6.9%. The market did not process the election. It extrapolated the month before it. Momentum was the only voter that showed up.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bespokeinvest.substack.com/p/tech-still-lags-morning-market-note"}, {"id": 4, "cat": "macro", "urgency": "deep", "source": "Bespoke Investment Group", "title": "Rheinmetall -15% on a guidance cut; BoE hikes 25bp to 4.0%; Stoxx 600 above August record", "idea": "Rheinmetall fell more than 15% after lowering guidance. The BoE raised 25bp to 4.0%, as expected. The STOXX 600 is up 0.5% with Spain +1.4%, extending a post-election move to above its August closing record. Kospi -5%, Nikkei -1.8%, Hang Seng +3.7% on state ETF buying.", "angle": "European defense is the cleanest example of a consensus long breaking on a single print. The same day, Europe is a destination for semis money.", "tweetA": "Europe is at record highs while Asia sells semis and the BoE hikes to 4.0%. The one name in Europe everyone owns for the war trade, Rheinmetall, just gapped down 15% on guidance. Crowded is crowded in any language.", "tweetB": "China is propping Hang Seng with ETF purchases (+3.7%) while Korea halts trading (-5%). Same AI trade, two opposite state responses. One government is buying the dip, the other is watching it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bespokeinvest.substack.com/p/tech-still-lags-morning-market-note"}, {"id": 5, "cat": "positioning", "urgency": "deep", "source": "All Star Charts / Alfonso De Pablos", "title": "Equal-weight retail vs market is bouncing off its 2020 lows", "idea": "XRT relative to the broader market is bouncing right off its 2020 lows and several retail stocks are breaking out together. Alfonso says the last time retail traded at these relative levels the group had a historic outperformance, and All Star put on several retail names in its 10X Portfolio yesterday.", "angle": "Fits the consumer discretionary +6.1% day. Rotation destination is becoming visible in price, and it is the opposite side of the semis funding trade.", "tweetA": "XRT/SPX at the 2020 lows while consumer discretionary rips 6.1% in a day. If the money leaving semis needs a home that isn't defensive, this is where the chart says it lands. $XRT", "tweetB": "Retail relative strength at a 6-year floor. Everyone is asking what replaces AI leadership. The unloved answer might be the group nobody has owned since 2020.", "charts": {"count": 1, "hot": true, "desc": "XRT / market ratio at 2020 lows - worth saving"}, "link": "https://allstarcharts.com"}, {"id": 6, "cat": "positioning", "urgency": "watch", "source": "SixSigma Capital (subscriber chat)", "title": "'Cash is a position': disciplined-sizing warning after the move", "idea": "SixSigma tells subscribers not to overconcentrate, to avoid margin and short-dated options, and calls selling cash-secured puts a trap in this environment. Cash is described as a valuable position.", "angle": "A retail-facing research shop telling people to de-risk is a small sentiment datapoint after a 6-sigma factor move.", "tweetA": "When the research shops start posting 'cash is a position' in the chat, the forced sellers are usually already done. Not a signal. A sentiment reading.", "tweetB": "Selling CSPs 'is a trap' only because vol is bid in single names and offered in the index. The risk is in what you are short, not the VIX print.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://sixsigmaresearch.com/"}, {"id": 7, "cat": "macro", "urgency": "act", "source": "The DeFi Investor", "title": "A tweet from Rep. Yassamin Ansari calling for an ASI ban triggered a $2T equity drop: S&P -2.74%, NDX -4.89%", "idea": "As written at the time: BTC -5%, S&P 500 -2.74%, Nasdaq-100 -4.89%, over $2 trillion of US market cap lost. The author ties the trigger to a Democratic congresswoman's post calling for an AI pause and an ASI ban, but also cites leveraged-ETF inflows at a 2-year high and Axios on Iran combat prep.", "angle": "Morning notes had the Nasdaq -1%. This is escalation through the session, and the cause list is positioning plus politics plus Iran, not one tweet.", "tweetA": "A single tweet does not take $2T off the market. A one-month record of leveraged ETF inflows does. The ASI ban post was the match, not the fuel.", "tweetB": "Nasdaq -1% at 8:30 ET, -4.9% by the close. The first move was the rotation. The second was liquidation. Different regimes, same day.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.thedefinvestor.com/p/wtf-just-happened"}, {"id": 8, "cat": "positioning", "urgency": "act", "source": "Capital Flows (subscriber chat)", "title": "CoreWeave and NQ at new lows while Dow and XLF sit at highs; ZT bid, UB barely moves", "idea": "Capital Flows says hedges unwound after the midterms and the regulatory regime is being priced more. CoreWeave and NQ are making new lows as Dow and XLF hold highs. The 2-year note is bid as equities fall but the long bond is barely up, raising a stagflation risk where selling is macro-flow driven. Claims token prices are falling while GPU prices stay elevated.", "angle": "Bonds are the cross-check: front-end bid, long end sticky is the shape that makes tech cash piles irrelevant.", "tweetA": "ZT bid and UB flat while NQ makes new lows is not a flight to safety, it is a curve steepening story. The long end is telling you the term premium has a floor even when equities don't.", "tweetB": "Token prices falling, H100 prices not. That spread is CoreWeave's whole P&L. Demand for compute is not demand for margin.", "charts": {"count": 1, "hot": true, "desc": "Token price vs GPU price divergence chart (in chat) - worth opening"}, "link": "https://www.capitalflowsresearch.com/"}, {"id": 9, "cat": "ai-infra", "urgency": "deep", "source": "Capital Flows", "title": "CoreWeave -77% from highs: demand for AI does not equal bottom-line profit", "idea": "Capital Flows argues the AI sell-off is the realization of fragility that pre-dated the Democratic sweep, rooted in foreign net positions: partners push money into US assets to keep their current account relationship while China dumps cheap goods. It points to a divergence between H100 prices and token prices as the core risk and CoreWeave, down 77% from highs, as the most credit-sensitive AI name.", "angle": "The foreign-flow framing is a macro explanation for US equity valuation I haven't seen laid out this way. Combine with Cembalest's off-balance-sheet obligations.", "tweetA": "CoreWeave -77%. Not because nobody uses AI. Because the price of a token is falling faster than the price of the GPU that makes it. Utilization is not margin.", "tweetB": "Capital Flows says foreigners are pushing up US equity valuations to defend their current accounts against Chinese goods. If that is true, the AI bubble is partly a trade-balance artifact. Who funds the next leg?", "charts": {"count": 2, "hot": true, "desc": "H100 vs token price divergence + foreign net position charts - worth opening"}, "link": "https://www.capitalflowsresearch.com/p/market-status-market-bottom-or-beginning"}, {"id": 10, "cat": "macro", "urgency": "deep", "source": "Peter Boockvar / The Boock Report", "title": "Initial claims 189k, 7k below consensus; 4-week average 195k", "idea": "Jobless claims fell to 189k from an already low 195k, 7k below expectations. The 4-week average dropped to 195k from 197k. Continuing claims rose 23k to a muted 1.718mm. Boockvar defers the bottom line to Challenger.", "angle": "A very low-fire labour market while Challenger layoff data and AI headcount stories dominate. Productivity beat and ULC miss from Bespoke fit the same picture.", "tweetA": "189k claims. Productivity strong, unit labor costs low. And everyone is writing about AI layoffs. The data says no firing, no hiring: the freeze, not the cliff.", "tweetB": "Claims at 189k while Canva cuts 22% and Google offers buyouts. The layoffs are real, but they are not showing up where the Fed looks. That is the whole thing.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://peterboockvar.substack.com/p/calm-labor-market-still"}, {"id": 11, "cat": "macro", "urgency": "deep", "source": "Mando Minutes / Barchart", "title": "Net long positioning in 10-year Treasury futures at an all-time high", "idea": "Net longs in US 10-year note futures hit an ATH while Bespoke has the 10-year at 4.90%. US M2 reached $23.4T. Gold is at $4,120 (+2%) and the dollar is sliding.", "angle": "ATH net long in a 4.90% 10-year is a crowded duration trade: the same positioning that makes the long end sticky in Capital Flows' note.", "tweetA": "Record net longs in 10s at 4.90%. That is not a hedge, that is a bet. If the ASI scare reverses, who is selling duration into the squeeze?", "tweetB": "M2 at $23.4T, gold at $4,120, 10s at 4.90% and a record long. Four prices, one story: the market is long every version of the debasement trade at once.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-1-6f10"}, {"id": 12, "cat": "ai-infra", "urgency": "deep", "source": "Stephen Innes / The Dark Side of the Boom (Goldman: Privorotsky, Flood, Abbas)", "title": "The new relative-value trade: own compute that exists, short the companies building more", "idea": "Goldman's dominant relative trade is long hyperscalers, short semis. The argument: political delays make operating capacity scarcer (pricing power) and slow capex (better free cash flow), but delay orders for semi suppliers. JPM credit sees investors paying a premium for built, operating infrastructure over projects pending. Independent power producers (Vistra, Talen, Constellation) are also pressured. Texas is about 27% of MW in HY project-finance data centers.", "angle": "The contradiction is the interesting part: hyperscalers rally on lower future capex while semis fall on lower future capex. Both can't be the same trade.", "tweetA": "The market is long hyperscalers because they might spend less and short semis because they might spend less. Same forecast, opposite trades. One of them is wrong.", "tweetB": "27% of high-yield data center project-finance MW sits in Texas. A regulatory change there doesn't hit hyperscaler earnings, it hits the credit that financed the next build. $VST $CEG", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/new-york-open-the-ai-trade-changes"}, {"id": 13, "cat": "ai-infra", "urgency": "deep", "source": "Stephen Innes / The Dark Side of the Boom (Goldman: Privorotsky, Lynam)", "title": "Goldman: capex $1.2T in 2027, plus $1.7T leases and $1.9T unconditional purchase obligations", "idea": "Rich Privorotsky admits he underestimated institutional selling. Goldman sees hyperscaler capex at $1.2 trillion in 2027, Amanda Lynam adds $1.7 trillion of lease commitments and another $1.9 trillion in unconditional purchase obligations. The market is beginning to price peak capex growth, with a risk of an inventory cycle up the supply chain.", "angle": "Capex growth peaking is a second-derivative story: the level can keep rising while the stocks fall. That is what we are seeing.", "tweetA": "$1.2T capex in 2027, $1.7T of leases and $1.9T of purchase obligations behind it. Semis aren't being sold because spending stops. They're being sold because the growth rate of spending can't keep up with its own price.", "tweetB": "Goldman's top trader publicly saying 'this is what I got wrong' is itself a signal. Desk heads rarely admit the tape beat them unless the position is already cut.", "charts": {"count": 1, "hot": false, "desc": "Goldman capex / obligations charts in article"}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-trade-hits-peak-capex-anxiety"}, {"id": 14, "cat": "ai-infra", "urgency": "deep", "source": "Stephen Innes / The Dark Side of the Boom (JPMorgan AM: Michael Cembalest)", "title": "37.5 GW of planned 2028 data-center capacity could face construction pauses", "idea": "Cembalest says nearly every significant local ballot measure opposing new data centers passed or led. Of about 96 GW expected for 2028, 37.5 GW could face pauses and another 15 GW additional conditions (grid-upgrade payment, water limits, backup generation). 2027 is safer: 37 GW expected, three-quarters already under construction. He also notes upgrading existing sites with better chips may become the only path to more AI output.", "angle": "That makes the 2028 pipeline the real collision point. It also gives a bull case for Nvidia versus builders of shells.", "tweetA": "37.5 of 96 GW in 2028 could be paused. 2027 is mostly poured concrete. So the market is selling 2028 earnings today, and the delay may actually raise the value of every watt already energized.", "tweetB": "If you can't build new buildings, you swap the chips in the old ones. The data-center moratorium is a bull case for upgrade cycles and a bear case for shell and power developers. Not one trade.", "charts": {"count": 1, "hot": false, "desc": "Data-center GW pipeline charts in report"}, "link": "https://thedarksideoftheboom.substack.com/p/now-you-can-see-everything-on-the"}, {"id": 15, "cat": "credit", "urgency": "deep", "source": "Stephen Innes / The Dark Side of the Boom (JPMorgan AM: Michael Cembalest)", "title": "About $4T of AI purchase and lease obligations sit outside balance-sheet liabilities", "idea": "Across seven AI names Cembalest finds nearly $4T of future purchase commitments and leases outside conventional liabilities, only about 15% recorded: Google $1.077T, Anthropic $865B, Meta $810B, Microsoft $575B, Nvidia $422B, Amazon $419B, Oracle $322B. Oracle's CDS has widened sharply. He stresses these are not funded debt, but they are real.", "angle": "Anthropic's $865B stands out because it's a private company with no listed liabilities. Credit is where this shows up first.", "tweetA": "Anthropic has $865B of off-balance-sheet commitments, more than Meta's $810B. Meta has a market cap and a credit curve. Anthropic has a roadshow. Who prices that obligation?", "tweetB": "$4T of commitments, 15% on the balance sheet. Equity can forgive a bad quarter. Credit doesn't forgive a timeline that slips. Oracle's CDS is the canary.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/now-you-can-see-everything-on-the"}, {"id": 16, "cat": "positioning", "urgency": "deep", "source": "Stephen Innes / The Dark Side of the Boom (JPMorgan AM: Michael Cembalest)", "title": "Long/short hedge fund gross exposure -8% from peak, the biggest drawdown since 2016", "idea": "Morgan Stanley Prime data show an 8% decline in global long/short gross exposure from its recent peak, the largest since 2016. Cembalest notes good earnings are meeting poor price reactions because holders need to make positions smaller. PEG multiples for leading AI names are compressed versus earlier in the cycle.", "angle": "Gross de-risking is the mechanism behind the 6-sigma momentum move. Cheaper PEG is only attractive if estimates hold.", "tweetA": "Gross exposure -8%, biggest de-grossing since 2016. When funds shrink books, beats don't matter. That is why every good print has been sold.", "tweetB": "PEG ratios on AI leaders are compressing, but the E in PEG depends on a build-out that politics and credit are both now questioning. Cheap on the wrong denominator.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/now-you-can-see-everything-on-the"}, {"id": 17, "cat": "macro", "urgency": "deep", "source": "Stephen Innes / The Dark Side of the Boom (JPMorgan AM: Michael Cembalest)", "title": "Iran war price shock: retail diesel +67%, jet fuel +65%, WTI +44%; the median household is 50% housing, 15% equities", "idea": "Using prices through Nov 2, retail diesel and shipping fuel are about 67% above the pre-war level, jet fuel 65%, wholesale gasoline 48%, WTI 44%. The median household holds about 50% of wealth in housing and 15% in equities. Healthcare and social assistance account for most net job growth, and deficits are historically large for an expansion.", "angle": "Explains why a Democratic sweep and 'wealth effect' don't map. Households feel the cumulative price level, not the oil futures retrace.", "tweetA": "Diesel +67%, jet fuel +65%. Brent just fell $20 in a week. Voters live in the first number, traders in the second. That gap is why the election went the way it did.", "tweetB": "Median household: 50% housing, 15% stocks. Every market rally headline is a wealth effect for the top decile. The midterm was a referendum on the other 90%.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/now-you-can-see-everything-on-the"}, {"id": 18, "cat": "culture", "urgency": "deep", "source": "Stephen Innes / The Dark Side of the Boom (JPMorgan AM: Michael Cembalest)", "title": "Theranos as a template for AI-era diligence: <5% of tests on its own machines; auditors catch about a third of fraud", "idea": "Cembalest: by late 2014 fewer than 5% of Theranos tests ran on Edison devices; promised $100M revenue vs about $100K actual. Research suggests auditors catch about one-third of fraud, with a possible 7-10% historical fraud rate in large public companies. An NBER study found 1.85% of VC-backed firms raising over $10M had detected fraud, and founder-controlled boards were 88% more likely to see it than VC-controlled boards.", "angle": "Not an accusation against AI companies, but 88% on founder-controlled boards is a number to hold against every dual-class IPO on the calendar.", "tweetA": "Founder-controlled boards: 88% more likely to have detected fraud than VC-controlled ones. Keep that number next to the next dual-class mega-IPO roadshow.", "tweetB": "Auditors find roughly a third of fraud. If a company's whole story is $865B of future commitments, who is the independent check on the denominator?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/now-you-can-see-everything-on-the"}, {"id": 19, "cat": "ai-infra", "urgency": "deep", "source": "Blocmates / Mando", "title": "Memory shortage reaches consumers: Switch 2 sales plunge, Apple cuts internal AI budgets", "idea": "Mando flags Nintendo's Switch 2 sales plunging as memory costs bite and Apple cutting internal AI usage budgets. At the same time DRAM and NAND are 10-12% short of demand and prices are up 80%+ (TechInsights).", "angle": "The spillover from AI memory demand into consumer hardware is the visible second-order cost. Apple trimming internal AI usage is a rare demand-side signal.", "tweetA": "DRAM +80%, Switch 2 sales down, Apple trimming its own AI budget. The AI memory boom is a tax on every other device in your house.", "tweetB": "Apple, which can afford anything, is cutting internal AI usage budgets. Goldman cut Claude Code access for traders. The first buyers to ration AI are the biggest ones.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-1-6f10"}, {"id": 20, "cat": "ai-infra", "urgency": "deep", "source": "P Equity Research (THE ELEC Q&A, TechInsights' Jeongdong Choe)", "title": "Memory supply meets only ~85% of demand; equilibrium needs 102-103%", "idea": "More than 50% of memory demand has shifted to AI. DDR, LPDDR and HBM prices are up over 80%, DRAM supply is short 10-12%, NAND similar. New fabs add output in about 18-24 months, supply reaches 90-95% of demand by 3Q/4Q 2027, and true equilibrium requires supply at 102-103%. HBM demand is growing 4-6x vs the historical 1.2-1.4x. Capex intensity is 30-40% of revenue.", "angle": "This is the bull case for memory while Kospi gets halted down 5-6%. The sell-off is a positioning event, not a supply-demand one.", "tweetA": "Supply is 85% of demand and the fix takes two years. Kospi was halted -6% on the same day. Either the memory market is lying or the tape is.", "tweetB": "Memory capex is 30-40% of revenue. That is a mature cycle's number. The bet is that LTAs have turned a commodity into infrastructure. $MU 000660.KS", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pequityresearch.substack.com/p/memory-supplydemand-q-and-a"}, {"id": 21, "cat": "ai-infra", "urgency": "deep", "source": "P Equity Research (THE ELEC Q&A, TechInsights)", "title": "HBM3E share: SK Hynix >70%, Samsung 12-15%, Micron ~10%; Samsung could reach 25-30% in 2H27", "idea": "SK Hynix holds over 70% of HBM3E, Samsung 12-15%, Micron 10%. HBM3E remains the volume driver in 1H27; as HBM4 ramps in 2H27, Samsung could rise to 25-30%. Micron's base-die dependence on TSMC is a bottleneck. Leadership means pricing power and allocation control, and may shift around 2028. Multi-year LTAs with major AI designers and select hyperscalers stabilize pricing.", "angle": "The memory market is stratified (HBM, eSSD, CXL, GDDR, HBF), reducing the odds of a classic price war.", "tweetA": "Samsung's HBM share going from 12-15% to 25-30% is the number that moves the Hynix multiple. Not the AI capex number everyone is arguing about.", "tweetB": "TSMC allocates base-die capacity and Micron needs it. The scarcest part of HBM may be logic wafers, not DRAM. $TSM $MU", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pequityresearch.substack.com/p/memory-supplydemand-q-and-a"}, {"id": 22, "cat": "geopolitics", "urgency": "deep", "source": "P Equity Research (THE ELEC Q&A, TechInsights)", "title": "China's CXMT G5: 12-13nm DRAM with DUV multipatterning, no EUV; YMTC is a competitor, not a follower", "idea": "CXMT aims to raise share from 12-13% to 20-25%; its G5 platform reaches 12-13nm with DUV double or quadruple patterning, a jump of 1-2 generations without EUV. YMTC pioneered hybrid bonding (Xtacking), now adopted by Kioxia, Samsung and SK Hynix, and was first with 2TB QLC modules. Process gaps among Samsung, SK Hynix and Micron are under 0.1nm at 13/12/11nm.", "angle": "Export-control assumptions rely on EUV being the gate. This says DUV patterning can close much of the gap, at a cost. Important for ASML and for memory pricing in 2028.", "tweetA": "China is making 12-13nm DRAM without EUV. Whatever the export-control model assumed about the gate, it did not assume quadruple patterning at scale. $ASML", "tweetB": "YMTC invented the hybrid-bonding that Samsung and SK Hynix are now copying. The 'catch-up' framing is stale. Memory is where China is the technology source, not the customer.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://pequityresearch.substack.com/p/memory-supplydemand-q-and-a"}, {"id": 23, "cat": "ai-infra", "urgency": "deep", "source": "Haymaker Daily", "title": "Vistra hammered as the data-center build-out sells off", "idea": "Haymaker notes a brutal sell-off in sectors tied to the data-center build-out after the Democratic midterm win, citing a pummeling of its favorite, Vistra (VST), a leading independent power producer. (Only the opening is in the email; the rest is paywalled.)", "angle": "Matches Innes: IPPs (VST, TLN, CEG) are valued on rapid load growth. They are the political-risk end of the AI chain.", "tweetA": "$VST is not an AI stock, it is a political-risk trade on load growth. Local ballot measures just changed the duration of that load.", "tweetB": "IPPs got paid for scarcity of power. A data-center moratorium is a scarcity of customers. Same grid, opposite effect. $VST $CEG $TLN", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://haymaker.substack.com/p/haymaker-daily-8cf"}, {"id": 24, "cat": "ai-infra", "urgency": "deep", "source": "Understanding AI (Timothy B. Lee)", "title": "The sim-to-real gap explains why AI is a programmer but not yet a lawyer", "idea": "Coding and math have tiny sim-to-real gaps (precise rules, Lean-verifiable proofs) so RL scales. Walking can be simulated; hammering cannot ('the floor doesn't do anything'). White-collar work involves other people and the world, which are hard to simulate. GDPval went from 47.6% (Opus 4.1) to over 85%, yet the author is skeptical of 2027 mass disruption.", "angle": "A concrete, falsifiable reason for jaggedness. It's a counterweight to Raoul Pal's 2030-32 acceleration.", "tweetA": "GDPval went from 47.6% to 85% in a year and white-collar work still hasn't moved. Benchmarks are a simulator. Clients are not.", "tweetB": "Coding got eaten because code has a compiler. Lawyers don't have one. The AI jobs forecast is a question about which professions have a verifier. $MSFT $NOW", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.understandingai.org/p/this-robotics-concept-helps-explain"}, {"id": 25, "cat": "labor", "urgency": "deep", "source": "Raoul Pal / The Exponentialist", "title": "Agents don't remove the management layer: Graicunas's 1933 math says 8 reports = 1,080 relationships", "idea": "Raoul hit a wall running about eight agents at once. Graicunas (1933): four direct reports means 44 relationships, eight means 1,080. Coase says firms exist to lower coordination cost; AI collapsed execution cost, not coordination. Solow/David: electricity took 40 years because factories were laid out for steam shafts. METR's task horizon has doubled about every 7 months. His COO agent 'sprawled, costs spiralled'.", "angle": "The span-of-control bottleneck implies value accrues to the orchestration layer. Pairs with Understanding AI.", "tweetA": "Eight agents is 1,080 relationships. The binding constraint on AI is not intelligence, it's span of control. Whoever builds the manager owns the bottleneck.", "tweetB": "Electricity took 40 years because factories kept the steam-engine layout. The question for 2030 isn't the capacity, it's whether we redesign the company. Raoul thinks the lag is shorter. I'm not sure.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://theexponentialist.substack.com/p/weve-automated-the-workers-now-comes"}, {"id": 26, "cat": "macro", "urgency": "watch", "source": "Raoul Pal / Global Macro Investor", "title": "'The Everything Code': a four-year window before the old rules for jobs, markets and money stop working", "idea": "Raoul announces his first book. Thesis: debt and demographics rigged the economy against ordinary people, and AI and robotics will change how value is created and who owns it. He claims a short window, roughly four years, to position.", "angle": "Mostly a book launch, but the dated claim (4-year window to ~2030) is the same horizon as his 2030-32 framework.", "tweetA": "A four-year window before jobs, markets and money change the rules. Date-stamped macro forecasts are rare. That is the part worth checking in 2030.", "tweetB": "Pal's 2030 thesis versus Understanding AI's sim-to-real gap. One of them is going to be a very expensive mistake for the other camp.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://raoulpal.substack.com/p/the-everything-code-is-here"}, {"id": 27, "cat": "tech", "urgency": "deep", "source": "Mando Minutes (The Verge)", "title": "Uber saw only 4 rides booked by AI agents in Q3", "idea": "Mando links The Verge: Uber recorded just four rides booked by AI agents in the third quarter. The headline is about disintermediation risk showing up as basically zero volume so far.", "angle": "A hard demand number for agentic commerce. The disintermediation debate has real data now.", "tweetA": "Four. Not four million, not four thousand. Four rides booked by AI agents at Uber in Q3. The agent-commerce disruption is priced at billions and measured in single digits.", "tweetB": "Meanwhile the CFTC is drafting 'know-your-agent' and Schwab won't let agents act. The rules are arriving for a market that does not yet exist.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.theverge.com/transportation/1026306/uber-ai-agents-q3-earnings-disintermediation"}, {"id": 28, "cat": "geopolitics", "urgency": "deep", "source": "Mando Minutes", "title": "China blocks SoftBank's ABB robotics takeover", "idea": "Mando flags that China blocked SoftBank's planned acquisition of ABB's robotics business, listed with the Starlink 5G and Qualcomm items.", "angle": "Beijing's merger review is now a tool in the robotics supply war. Relevant for any robot/automation M&A plan with China revenue.", "tweetA": "China did not need a tariff to block a robotics deal. Beijing's merger review is the new chokepoint for Western robotics consolidation. $SFTBY", "tweetB": "SoftBank can build compute in the US but not consolidate robotics without Beijing's blessing. The AI stack and the China exposure are the same deal.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-1-6f10"}, {"id": 29, "cat": "crypto", "urgency": "deep", "source": "Mando Minutes / Blocmates", "title": "Riot dumps $1.5B of BTC and the shares jump on an AI deal; Trump Media moves 4,259 BTC to Crypto.com", "idea": "Mando reports Riot sold $1.5B of BTC, shares jumping on an AI deal. Trump Media wallets moved 4,259 BTC ($342-344M) to Crypto.com. JPMorgan added BTC to long-term forecasts.", "angle": "A miner selling its treasury to chase AI hosting is the clearest read on where the marginal dollar earns more.", "tweetA": "A bitcoin miner sold $1.5B of BTC and the stock went up because it's buying AI capacity. Market is paying more for megawatts than for hash.", "tweetB": "4,259 BTC from Trump Media to an exchange, and Riot dumping $1.5B. Two large holders moving coins in the same 24 hours the shorts got squeezed.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-1-6f10"}, {"id": 30, "cat": "energy", "urgency": "act", "source": "Stephen Innes / The Dark Side of the Boom (UBS: Dominic Ellis)", "title": "Brent -$20: worst week since April 2020, yet 700mb of inventories are gone", "idea": "Brent is heading for its worst weekly drop since the COVID collapse as the Iran war premium is stripped out. UBS estimates $10-15 of risk premium remains near $95. The conflict has drained nearly 700 million barrels, a 40-50mb monthly draw continues, which UBS thinks sets a floor for 18-24 months. US distillate stocks fell below 100mb for the first time since 2003.", "angle": "Distillates below 100mb with diesel at 2-month lows is the dislocation. Refiners and crack spreads are the expression.", "tweetA": "Brent -$20 in a week; US distillates below 100 million barrels for the first time since 2003. The futures curve is trading the headline, the tank gauge is trading the barrels. $VLO $MPC", "tweetB": "UBS: $10-15 of premium left at $95, but 700mb of inventory to rebuild. Both can be true: the price can fall and the floor can still hold. That is the setup for a V.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/brents-20-collapse-the-war-premium"}, {"id": 31, "cat": "geopolitics", "urgency": "act", "source": "Mando Minutes / Axios / Innes", "title": "Market prices peace while the US reportedly preps to resume 'major' Iran combat operations", "idea": "Mando headlines 'US preps to resume major Iran combat ops' (Axios) and Schumer's 'we will end Iran war'. Innes writes that markets have over seven months been too eager to price de-escalation before evidence. The DeFi Investor lists the Axios report as a driver of the sell-off.", "angle": "Brent -$20 plus Axios on resumed combat is a direct contradiction. One of the two is mispriced.", "tweetA": "Oil is down $20 pricing peace. Axios says the US is preparing to resume major combat operations. Both can't be right by next week.", "tweetB": "Vance and Trump are now acknowledging the war cost them the midterms. That makes a deal more likely, but not a deal Iran has to accept. Pyrrhic victory is still a victory.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-1-6f10"}, {"id": 32, "cat": "geopolitics", "urgency": "deep", "source": "Stephen Innes / The Dark Side of the Boom (Apollo: Torsten Slok)", "title": "Iran's economy: inflation ~90%, rial ~3M per USD, oil exports from 1.8mbpd to zero", "idea": "Slok's three charts show consumer inflation near 90% YoY (peak 50% in 2019-20, 2022), the open-market rial near 3 million per dollar, and crude exports falling from roughly 1.8 mb/d to essentially zero, steeper than 2018-19 sanctions. The feedback loop: lost dollars, weaker rial, higher import prices, higher inflation.", "angle": "The negotiating leverage runs both ways. A regime under this stress either settles or escalates. Both are vol events.", "tweetA": "Iran: 90% inflation, 3 million rial per dollar, zero exports. A government in that position makes its decisions on a different timeline than ours. Don't price a deal off Washington's calendar.", "tweetB": "1.8 mb/d of Iranian crude disappeared from the global market and Brent is $95. That is how much spare capacity and demand destruction have already filled.", "charts": {"count": 3, "hot": true, "desc": "Iran CPI, rial, crude exports charts (Apollo) - worth saving"}, "link": "https://thedarksideoftheboom.substack.com/p/severe-stress-now-more-risk-if-conflict"}, {"id": 33, "cat": "geopolitics", "urgency": "deep", "source": "Mando Minutes", "title": "US politics after the sweep: Johnson retires, Hegseth impeachment vote, Netanyahu loses majority", "idea": "Mando headlines: Speaker Johnson bows out after the House GOP defeat; Massie to force a Hegseth impeachment vote; Trump mulling Hegseth's future and telling aides Stephen Miller 'went too far'; Israel's EC certifies Netanyahu's majority loss; Israel strikes Lebanon heavily; Ukraine preps for US-Russia talks; France braces for protests.", "angle": "Defense policy and war powers are the area where divided government changes fastest.", "tweetA": "A new Congress, no Speaker Johnson, a Hegseth impeachment vote and a Hegseth war. The defense budget just got a lot less predictable. Rheinmetall already moved.", "tweetB": "Netanyahu losing his majority the same week Israel hits Lebanon hard and the US readies Iran ops. Domestic politics are doing the escalation math now.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-1-6f10"}, {"id": 34, "cat": "culture", "urgency": "deep", "source": "Mando Minutes", "title": "Young men swung sharply back to Democrats; California voters rejected the billionaire tax", "idea": "Mando headlines (via Unusual Whales and Remarks): young men swung sharply back to Democrats in the midterms, and California voters rejected a billionaire tax.", "angle": "Two consumer-voter signals: the gender-gap reversal, and a state that voted down a wealth tax.", "tweetA": "California just voted down a billionaire tax in a year Democrats swept Congress. The anti-wealth-tax constraint is bipartisan. That matters for every capital-flight model.", "tweetB": "Young men swinging back is the demographic story under the midterm: the consumer cohort driving gaming, crypto and sports betting changed sides. Look at who they follow.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-1-6f10"}, {"id": 35, "cat": "culture", "urgency": "watch", "source": "Mando Minutes", "title": "Meta exec: AI must offset 'population collapse'; Google offers buyouts; Goldman warns of data-center bans", "idea": "Mando links a Meta executive saying AI has to offset 'population collapse', Google extending voluntary buyouts in several countries, and Goldman warning of data-center building bans.", "angle": "Demographics is now the pro-AI argument inside Big Tech. Pair it with Raoul's debt and demographics framing.", "tweetA": "Meta's argument for AI is no longer productivity. It's demographics. When the pitch changes from 'we can' to 'we must', regulators should read it as a lobbying brief.", "tweetB": "Google offering buyouts while Meta says AI must fill the fertility gap. Same industry, two stories about the labor force.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://mandominutes.beehiiv.com/p/mando-minutes-1-6f10"}, {"id": 36, "cat": "gold", "urgency": "deep", "source": "Robert Sinn / Goldfinger Capital (Mining Stock Daily)", "title": "Newmont +9.9% on heavy volume: last four such days were bullish", "idea": "NEM rose 9.90% on above-average volume Wednesday; the last four times it gained 9%+ on heavy volume it proved a bullish omen. Sinn also discusses the Tuesday-night gold reversal, critical-minerals policy under divided government, and November tax-loss selling in juniors as an accumulation setup into 2027.", "angle": "Gold is at $4,120 and miners are catching up. A +9.9% day in a mega-cap miner while tech sells is the rotation showing up in gold equities.", "tweetA": "Newmont +9.9% on volume while Nasdaq falls 4.9%. Gold equities have been the funding source for years. This is the first day the flow went the other way. $NEM $GDX", "tweetB": "November tax-loss selling in junior miners is the setup Sinn likes into 2027. The flip side: you buy the dip when the pain is hardest.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://robertsinn.substack.com/p/mining-stock-daily-appearance-with"}, {"id": 37, "cat": "gold", "urgency": "deep", "source": "Mando Minutes", "title": "Central banks buying gold at the fastest pace since 2024 (World Gold Council)", "idea": "Mando links ZeroHedge on WGC data: central banks bought gold at the fastest pace since 2024. Gold is $4,120 (+2%) with silver also sharply higher while the dollar slid.", "angle": "Official-sector demand is accelerating while retail attention is on AI. Pair with the Treasury-long positioning.", "tweetA": "Central banks are buying gold at the fastest pace since 2024 while US 10s are at a record net long. One of them is wrong about what the safe asset is.", "tweetB": "Official buyers don't chase. They accumulate. $4,120 with central banks speeding up is not momentum, it's policy.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.zerohedge.com/precious-metals/central-banks-just-bought-gold-fastest-pace-2024-world-gold-council-says"}, {"id": 38, "cat": "crypto", "urgency": "deep", "source": "Unchained (Laura Shin)", "title": "BTC $75.6K to $81.1K overnight: $950M liquidated, 76% of BTC liquidations were shorts", "idea": "Bitcoin dipped to about $75,600 at 10 pm ET Tuesday and reached $81,130 Wednesday (+7.3%). CoinGlass: $950M of leveraged crypto liquidated, $560M (58.9%) shorts; BTC liquidations were $403M with 76% shorts. ETH +6.3% to about $2,437. Democrats take crypto committees in January.", "angle": "Later newsletters have BTC down 5% on the equity sell-off, so the squeeze didn't hold.", "tweetA": "$560M of shorts squeezed on a night BTC went from $75.6K to $81.1K. Then equities rolled and it gave half back. Crypto is a beta asset again, whatever the narrative.", "tweetB": "Democrats take the crypto committees in January and BTC squeezed higher on the news. The market is treating a regulatory handover as bullish. Check the Clarity Act draft before agreeing.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-bounces-back-from-midterm-night-and-the-bears-feel-it"}, {"id": 39, "cat": "crypto", "urgency": "deep", "source": "Unchained (Laura Shin)", "title": "Crypto PACs were right in 28 of 30 House races, 1 of 4 in the Senate; $64M spent in Ohio against Sherrod Brown, who won", "idea": "Unchained's FEC tally: $89.5M spent on projected races, only $21.9M (24.4%) on the winning side. Ohio's special Senate race drew $64.05M from Defend American Jobs and Digital Freedom Fund opposing Sherrod Brown, projected winner. Fairshake went 4-for-6, Digital Freedom Fund 0-for-3. Protect Progress was 9-for-9.", "angle": "The industry's strongest political tool, money, bought the wrong side in the race that mattered most.", "tweetA": "$64M against Sherrod Brown in Ohio. Brown won. 75.6% of crypto PAC money landed on losers. The most powerful crypto lobby just lost the race it spent the most on.", "tweetB": "28 of 30 in the House, 1 of 4 in the Senate. House winners are easy to pick. The Senate is where crypto legislation dies, and that is where the lobby lost.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-bounces-back-from-midterm-night-and-the-bears-feel-it"}, {"id": 40, "cat": "crypto", "urgency": "deep", "source": "Unchained (Laura Shin)", "title": "Crédit Mutuel Arkéa: attackers used the bank's own account, maybe cashed out via crypto (~EUR 118M)", "idea": "Arkéa confirmed on Nov. 4 that fraudulent operations went through, after ZachXBT named it as the victim of a suspected nine-figure theft. Attackers came through a service-provider platform and used the bank's own account to send transactions to other banks, potentially converting through specialized platforms. The reported loss is about EUR 118M ($133M).", "angle": "A bank hack with a crypto exit. Combined with Binance, fiat rails and crypto rails are now one attack surface.", "tweetA": "A French bank loses EUR 118M, and the cash-out route is crypto. The compliance conversation changes when the victim is a bank and the laundering is onchain. $COIN", "tweetB": "Binance $6.3B, Arkéa EUR 118M, French supermarkets. The attack surface in every case was a third party, not the core system.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-bounces-back-from-midterm-night-and-the-bears-feel-it"}, {"id": 41, "cat": "crypto", "urgency": "deep", "source": "Unchained (Laura Shin)", "title": "Tokenization plumbing: Morgan Stanley on DTCC's service, 62 issuers opt out of ICE/OKX venue", "idea": "Morgan Stanley says it's using DTCC's Tokenization Service six days after the Oct. 28 launch. Boeing, ServiceNow and Nebius objected to ICE/OKX's tokenized stock venue, taking the objector count to 62 (an objection keeps a stock off the venue). Schroders launched an EM-debt tokenized fund on Solana via Centrifuge. A first tokenized US stock traded under SEC relief. Blocmates cites Grayscale: tokenization to grow 1,000% by 2030.", "angle": "The settlement layer (DTCC) is being adopted by incumbents while the outsider venue gets opt-outs from issuers. Incumbent rails win first.", "tweetA": "Morgan Stanley is on DTCC's tokenization rail after six days. 62 issuers have already opted out of ICE and OKX's venue. Tokenization is coming, through the clearinghouse.", "tweetB": "The SEC's exemptive order lets any issuer veto the token venue. Boeing, ServiceNow, Nebius all did. Opt-out is the default, not opt-in.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-bounces-back-from-midterm-night-and-the-bears-feel-it"}, {"id": 42, "cat": "crypto", "urgency": "deep", "source": "Unchained (Laura Shin)", "title": "Circle cuts 5% of staff in a quarter where $182M of $865M revenue came from an ARC token presale", "idea": "Circle disclosed a roughly 5% workforce cut in a footnote, $9.1M restructuring charge. Total revenue and reserve income rose 17% to $865M, including $182M (21%) from the ARC token presale. American Bitcoin earned $126M on a $197.3M digital-asset gain, revenue $63.4M, holding about 8,427 BTC.", "angle": "Take out the presale and revenue growth is much weaker. Treasury gains are masking operating revenue at American Bitcoin: $126M profit on $63M revenue.", "tweetA": "21% of Circle's quarterly revenue is a token presale. Strip it out and the growth story is a lot smaller than the 17% print. $CRCL", "tweetB": "American Bitcoin: $126M profit, $63M revenue. The profit is a mark on its own BTC. That is a leveraged bet, not an operating business.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-bounces-back-from-midterm-night-and-the-bears-feel-it"}, {"id": 43, "cat": "regulation", "urgency": "watch", "source": "Unchained (Laura Shin)", "title": "South Korea delays crypto gains tax to 2029 (fourth delay); Second Circuit lets state actions against Kalshi and Coinbase proceed", "idea": "South Korea pushes the 22% tax on gains above 2.5 million won from Jan 1, 2027 to 2029, citing US information exchange starting in 2029. The Second Circuit declined to pause New York and Connecticut actions against Kalshi and Coinbase without ruling on federal preemption. SEC staff said Canton Coin is a digital commodity in a no-action letter. Court also denied halt of stock perps (Mando).", "angle": "Regulation is moving on a global calendar. Korea syncs to the US 2029 data-sharing date.", "tweetA": "Korea has now delayed its crypto tax four times and tied the new date to US information exchange in 2029. The tax isn't being delayed. It's being synchronized.", "tweetB": "The Second Circuit let the states keep going after Kalshi and Coinbase without deciding preemption. The federal-vs-state fight over prediction markets is still open, and Democrats now control the committees.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-bounces-back-from-midterm-night-and-the-bears-feel-it"}, {"id": 44, "cat": "crypto", "urgency": "watch", "source": "Unchained (Laura Shin) / Two Prime", "title": "Two Prime CEO: Babylon and Stacks BTC yields are 'VC-funded subsidies'", "idea": "Alexander Blume says yields from Babylon and Stacks are essentially VC-funded subsidies, and contrasts them with Two Prime's WBTC vault on Pareto funded by borrowers. Blocmates notes Stacks BTC staking adopted by institutions including 21Shares, with Bond 3 sold out.", "angle": "A crypto yield is real only if someone pays it for a reason other than token emissions. Check which BTC yield survives the subsidy ending.", "tweetA": "Bitcoin yield from a token emission is not yield, it's a marketing budget. The only BTC yield that matters is one a borrower pays.", "tweetB": "Two Prime says Babylon and Stacks are subsidized while 21Shares just bought into Stacks. Institutions and cynics are both buying the same product.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/bitcoin-bounces-back-from-midterm-night-and-the-bears-feel-it"}, {"id": 45, "cat": "crypto", "urgency": "deep", "source": "Axel Adler Jr / Bitcoin Market State Report", "title": "Short liquidations $289M, highest since late September; STH supply +600K BTC (+19%) since July", "idea": "Over eight days, two shocks: the $6.3B Binance theft and the largest short liquidations since late September ($289M). Since late July, short-term-holder supply is up 600,000 BTC, or 19%, so more coins sit with newer participants.", "angle": "More coins with newer holders means more supply with low cost basis resistance and higher sensitivity to drawdowns.", "tweetA": "STH supply +600,000 BTC since July. The marginal buyer of the last four months is under water at $75-80K or close to it. Rallies will meet sellers at their break-even.", "tweetB": "$6.3B stolen from Binance and $289M of shorts squeezed in the same week. The market absorbed both. That is either strength or depth that hasn't been tested yet.", "charts": {"count": 1, "hot": false, "desc": "On-chain support/resistance charts - worth opening"}, "link": "https://adlerinsight.substack.com/p/bitcoin-market-state-report-5ad"}, {"id": 46, "cat": "crypto", "urgency": "deep", "source": "Bits + Bips by Unchained (Jeff)", "title": "44% of Binance's stolen funds frozen or seized vs ~3% after Bybit: who holds the switch on your coins?", "idea": "Elliptic: $6.43B stolen from Binance, about 44% frozen or seized vs about 3% after Bybit. Tether froze USDT 37 minutes after it reached the hackers' wallet, Circle froze $823M of USDC. Arbitrum's 12-person Security Council, with nine signatures, moved 8,425 ETH and 74.6M ARB. None of the 18,270 stolen BTC or the ETH on mainnet was frozen.", "angle": "Freezability now varies by asset: issuer, council, nobody. That's a pricing factor for custody and collateral.", "tweetA": "44% of the haul frozen versus 3% after Bybit. The gap is not better security, it's more switches. Ask who holds the switch on each asset you own.", "tweetB": "Bitcoin was the only major asset in the Binance theft nobody could freeze. That's the sales pitch for BTC and it was proven by a $6.4B hack.", "charts": {"count": 1, "hot": true, "desc": "Binance haul by freezability chart - worth saving"}, "link": "https://bitsandbips.beehiiv.com/p/if-crypto-can-be-frozen-is-it-yours"}, {"id": 47, "cat": "crypto", "urgency": "deep", "source": "Bits + Bips by Unchained (Jeff)", "title": "79 of 83 L2s give users no exit window before upgrades; Robinhood Chain's 7-of-8 multisig can freeze", "idea": "Arbitrum's constitution lets its council upgrade with no delay in an emergency. L2BEAT: 79 of the 83 L2s it tracks give users no window to withdraw before an upgrade. Robinhood Chain (about $2.24B, launched July on Arbitrum tech) gives a similar power to a Robinhood wallet with 7 of 8 signatures and no delay.", "angle": "L2 trust assumptions are much closer to a custodian than the marketing says. Compare against ARB price reaction.", "tweetA": "79 of 83 layer-2s give you no time to exit before an upgrade. 'Decentralized' L2 is a council with a time-zero override. $ARB", "tweetB": "Robinhood Chain: $2.24B held, 7 of 8 keys, no delay. That's a custodial product with an Ethereum logo on it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bitsandbips.beehiiv.com/p/if-crypto-can-be-frozen-is-it-yours"}, {"id": 48, "cat": "crypto", "urgency": "deep", "source": "Blocmates", "title": "Binance hack kill chain: tampered Homebrew AI tool, fake job interview, internal AI tool used to hijack more laptops", "idea": "June: a Binance wallet engineer installed a tampered Homebrew download of a popular AI coding tool. September: a fake recruiter interviewed another engineer and delivered malware as a coding assignment. Oct. 20: attackers used that laptop plus an internal Binance AI tool to take over two more engineers' machines. Oct. 29: $6.34B drained. About $2.85B frozen or intercepted; Binance says it replenished 98%. The FBI attributes the attack to North Korea, reversing the usual 'fake job seeker' pattern.", "angle": "Developer tooling supply chain is the new perimeter. Ties to a16z's note about a tampered Claude Code extension in Cursor.", "tweetA": "North Korea usually pretends to be the job applicant. This time it was the recruiter. The attack on a $6B hot wallet started with a coding assignment.", "tweetB": "Binance's own internal AI tool was part of the lateral movement. Agents with access are the new privilege escalation path.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://blocmates.beehiiv.com/p/tokenization-is-expected-to-grow-1-000-by-2030"}, {"id": 49, "cat": "crypto", "urgency": "watch", "source": "Blocmates", "title": "Power perps on Hyperliquid (Paragon): ETH^2 payoff, convexity without options", "idea": "Paragon, a market-creation layer on Hyperliquid with $500M+ cumulative volume, launched power perps where the payoff is the underlying squared, cubed or fourth power. If ETH 2x, an ETH^2 perp pays 4x. CFTC also approved equity perps on US exchanges, subject to dual registration.", "angle": "Convexity packaged as a perp lowers the cost for retail to take quadratic exposure. Funding cost is the thing to watch.", "tweetA": "ETH 2x is ETH^2 4x. Power perps give retail the gamma of an option without a strike. They also give retail a quadratic path to zero.", "tweetB": "CFTC approved single-stock perps the same week power perps launched. Wall Street plus perps plus convexity. We are rebuilding the 2007 structured-product shelf onchain.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://blocmates.beehiiv.com/p/tokenization-is-expected-to-grow-1-000-by-2030"}, {"id": 50, "cat": "crypto", "urgency": "watch", "source": "Blocmates", "title": "Tron holds $10.7B more USDT than Ethereum; SpaceX trades below its $SPCX IPO price; Anthropic IPO roadshow next", "idea": "Blocmates bullets: Tron now holds $10.7B more USDT than Ethereum; SpaceX shares are below their SPCX IPO price; US stocks added $1.2T of market cap after the midterms; jobs for 'fixing AI mistakes' up over 85%; Anthropic is heading into price-range determination and roadshow next week.", "angle": "SpaceX under IPO price is the first big post-listing mega-cap lesson heading into Anthropic.", "tweetA": "SpaceX is trading below its IPO price and Anthropic's roadshow starts next week. Mega-IPO window is open and the first one is underwater.", "tweetB": "Tron holds $10.7B more USDT than Ethereum. The dollar's global distribution layer is not the chain that gets the most VC attention.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://blocmates.beehiiv.com/p/tokenization-is-expected-to-grow-1-000-by-2030"}, {"id": 51, "cat": "ai-infra", "urgency": "watch", "source": "Blocmates", "title": "Kimi K3.1 open weights at 2.8T parameters; OpenAI offers to cut data-center power in shortages; a Democrat calls to ban ASI", "idea": "Moonshot released open weights for a 2.8-trillion-parameter Kimi K3.1 Pro. OpenAI proposed cutting power to its data centers during electricity shortages. A Democratic lawmaker called for banning artificial superintelligence on day one of the new Congress. UAE signed four deals with OpenAI to be a 'fully AI-native government'. Apple will scan public iCloud photos and files for harmful content from 27.3. Canva cutting 22%.", "angle": "A 2.8T open-weight model from China while US lawmakers debate bans. OpenAI offering curtailable load is an acknowledgement of the grid political risk.", "tweetA": "China ships a 2.8T open-weight model. A US congresswoman calls for an ASI ban. OpenAI offers to cut its own power in a shortage. Three signals of one thing: compute has become a political object.", "tweetB": "OpenAI volunteering to shut off data centers in a blackout is a lobbying move. It is how you get a permit in a state that just voted against you.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://blocmates.beehiiv.com/p/tokenization-is-expected-to-grow-1-000-by-2030"}, {"id": 52, "cat": "tech", "urgency": "deep", "source": "Blocmates", "title": "EU refrigeration cyberattacks escalate to medical infrastructure; Buterin: 'treat data as toxic waste'", "idea": "Blocmates tracks Europe's refrigeration attacks, now touching medical infrastructure, and quotes Vitalik at Devcon (in a Dr. Spook costume): 'We really need to treat data as toxic waste by default', arguing for collecting, storing and exposing less and using zk proofs.", "angle": "The attack is about unpatched IoT controllers, and the response is data minimization. Two sides of the same security problem.", "tweetA": "Supermarket fridges set to 50C, now medical cold chains. The attack surface isn't the data center. It's every device that nobody patches.", "tweetB": "Vitalik says treat data as toxic waste. The a16z numbers say the opposite problem: you can't patch fast enough. Minimize the target.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://blocmates.beehiiv.com/p/tokenization-is-expected-to-grow-1-000-by-2030"}, {"id": 53, "cat": "culture", "urgency": "watch", "source": "Blocmates", "title": "Canva lays off 22% as 'green flag' layoffs; jobs 'fixing AI' mistakes surge 85%", "idea": "Canva is laying off 22% of its workforce. A Kalshi-sourced chart shows jobs focused on fixing AI mistakes up over 85%. Goldman restricted most traders and bankers from coding tools.", "angle": "A new category of labor: AI cleanup. Check job counts vs layoffs.", "tweetA": "Canva cuts 22% while jobs fixing AI errors grow 85%. The headcount isn't disappearing, it's moving from making things to checking them.", "tweetB": "Layoffs 'with a green flag' is now a PR genre. When 22% cuts get a positive framing, it signals the market rewards cuts over hiring.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://blocmates.beehiiv.com/p/tokenization-is-expected-to-grow-1-000-by-2030"}, {"id": 54, "cat": "tech", "urgency": "deep", "source": "a16z", "title": "395 organizations in 48 countries hacked by a few hundred AI agents; first break-in in under 4 hours", "idea": "On Aug 31 a single operator pointed a few hundred AI agents at a print-management server (PaperCut): built a test lab, wrote exploits for 2 bugs disclosed 4 days earlier, and hit the first victim in under 4 hours. Next morning 11 organizations fell in 26 seconds. GreyNoise counted 395 organizations in 48 countries, half schools. The model was a cheap open-weight one and ignored a 28-country avoid list.", "angle": "An actual measured campaign. Half of victims were schools: the 'too small to target' defense is gone.", "tweetA": "11 organizations in 26 seconds. 395 victims in 48 countries. Cheap open-weight model, no frontier lab. The agents even ignored the list of countries they were told to avoid.", "tweetB": "Half the victims were schools. 'Not worth attacking' was a cost argument. When the cost goes to zero, the argument goes to zero.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.a16z.news/p/the-exploit-was-the-bottleneck"}, {"id": 55, "cat": "tech", "urgency": "deep", "source": "a16z", "title": "Time from disclosure to exploit: 63 days in 2018-19 to -7 days in 2025 (attacks before the patch)", "idea": "Mandiant: average time from disclosure to attack fell from 63 days (2018-19) to 44, 32 and 5 (2023). By 2024 attacks came a day before disclosure, in 2025 seven days before. Yet Verizon DBIR 2026: median time to fix a known-exploited vuln is 43 days (up from 32), only 26% fully fixed within a year. 29% of exploited vulns were attacked on or before CVE publication in 2025.", "angle": "Attackers' timeline crossed defenders' timeline years ago. AI changes who can operate in that gap. SLA-based patching is a dead model.", "tweetA": "Time to exploit: 63 days in 2018. Seven days BEFORE disclosure in 2025. Time to patch: 43 days and rising. The two lines crossed years ago. Everyone's SLA is a lie.", "tweetB": "Defenders got slower (32 to 43 days) while attackers went negative. This isn't an AI story yet. AI just lets everyone else into the window. $CRWD $PANW", "charts": {"count": 2, "hot": true, "desc": "Disclosure-to-exploit timeline and patch median charts in article - worth opening"}, "link": "https://www.a16z.news/p/the-exploit-was-the-bottleneck"}, {"id": 56, "cat": "tech", "urgency": "deep", "source": "a16z", "title": "Anthropic: from 2 Firefox exploits for ~$4,000 to 181; privilege-escalation chains for ~$2,000 each; UK AISI cyber horizon doubling every 4.7 months", "idea": "Anthropic reported March: several hundred attempts and about $4,000 yielded two working Firefox exploits. A month later its unreleased next model produced 181 on the same task. By June, patch-to-exploit in under an hour, and 8 Windows kernel privilege-escalation chains in 18 hours at about $2,000 each. UK AISI: cyber task length doubling every 4.7 months. An unreleased model exploited a Linux multipath-TCP kernel bug in under an hour; Ubuntu and Red Hat had no fixed package three weeks later.", "angle": "A hard cost curve: $2,000 per kernel chain. State-grade capability is now priced like a software license.", "tweetA": "$2,000 for a Windows kernel privilege-escalation chain. RAND priced a zero-day exploit at a median 22 days of professional time in 2017. That price collapse is a security story and a labor story.", "tweetB": "2 Firefox exploits to 181 in one model generation. Capability doubling every 4.7 months, patching unchanged. The only number that hasn't moved is the one defenders control.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.a16z.news/p/the-exploit-was-the-bottleneck"}, {"id": 57, "cat": "tech", "urgency": "deep", "source": "a16z", "title": "Ransomware: leak-site claims up >50%, ransoms down to ~$820M; price of network access $1,427 to $439", "idea": "More attacks, less money: ransoms paid fell to about $820M while leak-site claims rose by more than half. Network access prices fell from about $1,427 in early 2023 to $439 in early 2026 (Chainalysis). Ransomware appears in 88% of SMB breaches vs 39% at large firms. Hospital attacks: Q3's 192 attacks and claims were a record; hospitals averaged 2-3 weeks of downtime.", "angle": "The economics of attacks are moving downmarket. Wipers don't demand payment, so ransom revenue understates damage.", "tweetA": "Access to a victim's network cost $1,427 in 2023 and $439 in 2026. Ransoms paid fell for a second year. More attacks, smaller targets, no payment. The loss number is going to show up somewhere else.", "tweetB": "Break-even victim is now a dentist or a county government. Cheaper attackers move down the size curve. Insurers price this wrong. $AJG", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.a16z.news/p/the-exploit-was-the-bottleneck"}, {"id": 58, "cat": "tech", "urgency": "deep", "source": "a16z", "title": "Supply chain: tampered Claude Code extension sat in Cursor's marketplace for ~11 hours, up to 5,000 developers", "idea": "On the day of the Binance theft a tampered copy of the Claude Code extension was in Cursor's extension marketplace for about eleven hours and reached up to 5,000 machines, attempting to plant an SSH backdoor. Cursor pulled it and rebuilt its marketplace. How it got there is unexplained. a16z also cites Binance's theft going through one engineer's laptop.", "angle": "Developer tools are the highest-privilege software on the highest-value machines. This ties to the Binance chain of events.", "tweetA": "A fake Claude Code extension in the Cursor marketplace for 11 hours, 5,000 developers, an SSH backdoor payload. Binance lost $6.3B through one engineer's laptop. The developer laptop is the new domain controller.", "tweetB": "The attack is on the tool that writes the code. If an agent installs the extension, who approved it? Agent permissions are the OCC's new exam question.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.a16z.news/p/the-exploit-was-the-bottleneck"}, {"id": 59, "cat": "tech", "urgency": "watch", "source": "a16z", "title": "What would change a16z's mind: exploited-vuln count 880 (2025), >2,000 by 2027 means cost collapse; 1.3% of AI-found bugs exploited", "idea": "a16z's scorecard: VulnCheck counted about 880 exploited vulns in 2025 (640 in 2023). Under 1,200 in 2027 and skeptics are right; above 2,000 and the cost collapse has arrived. Exploitation on/before CVE day above 50% by 2027, patch time under 30 days in the 2028 DBIR, AI-found bugs exploited under 5% by end 2027. Their bet: a 'long, expensive worm era' not a catastrophe.", "angle": "Dated, falsifiable indicators are the best part. Write them into the calendar.", "tweetA": "a16z put numbers on being wrong: 1,200 exploited vulns in 2027 and the skeptics win, 2,000 and the cost collapse is real. 880 today. This is the rare AI-risk forecast with a scoreboard.", "tweetB": "The worm era (1999-2004) cost over $250B in 2025 dollars. a16z thinks 2026 is the start of another one for everyone who can't patch. Cyber insurance is priced as if it isn't.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.a16z.news/p/the-exploit-was-the-bottleneck"}, {"id": 60, "cat": "regulation", "urgency": "deep", "source": "AI Street (Matt Robinson)", "title": "OCC examiners told to focus on what AI agents can access and do; CFTC floats 'know-your-agent'", "idea": "The OCC issued exam guidance treating AI as an amplifier of existing operational and compliance risk, with focus on what an AI can access, do on its own, and what could go wrong. CFTC Chair Selig asked whether agent developers must register and who is liable if an agent goes rogue, floating 'know-your-agent' (Oct. 28 forum). Schwab does not allow agents to act on account information. Wells Fargo wants customers to prove they've revoked AI agents.", "angle": "Supervision is based on permission scope, not model sophistication. A simple agent that can initiate payments is riskier than a complex drafting model.", "tweetA": "OCC: risk depends on what the agent is allowed to do, not how smart it is. A dumb agent with payment authority beats a genius one that drafts memos. That's the whole exam.", "tweetB": "CFTC is asking who registers when an agent trades: the user, the developer, the model? 'Know your agent' is KYC for non-humans. Someone is going to build that product. $COIN $SCHW", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.ai-street.co/p/occ-sets-priorities-for-ai-exams"}, {"id": 61, "cat": "labor", "urgency": "deep", "source": "AI Street (Matt Robinson)", "title": "Goldman restricts Claude Code and Copilot to engineers; Morgan Stanley advisors made ~50,000 attempts at building agents", "idea": "Goldman stopped most traders and bankers from using Claude Code and GitHub Copilot, limiting them to engineers after a trial; cost is suspected. Morgan Stanley advisors made nearly 50,000 attempts to build agents, though most don't get past early testing. Capgemini: 59% of financial firms pilot or deploy multi-agent systems, just 10% can coordinate them across the business; nine in ten use or plan model routing for cost.", "angle": "Cost is shaping deployment. Routing tasks to cheap models is the response, and it points to token-price deflation pressure.", "tweetA": "Goldman took Claude Code away from traders and bankers. Morgan Stanley's advisors tried to build agents 50,000 times. The first-year story is rationing at one firm and experimentation at another.", "tweetB": "59% piloting multi-agent systems, 10% can coordinate them. Raoul Pal hit the same wall at eight agents. The bottleneck is management, not models.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.ai-street.co/p/occ-sets-priorities-for-ai-exams"}, {"id": 62, "cat": "culture", "urgency": "watch", "source": "This Week in AI", "title": "Voice-first workflow: a post written by talking in a car, routed through MCP to Claude, Slack, Notion", "idea": "Plaud (a TWiST partner, disclosed) lets its AI voice recorder act as a hub: recordings flow via an MCP server into Claude, ChatGPT, Cursor and Gemini CLI. The author recorded a 10-12 minute commute memo and had apps assemble the post and demo. The email preview is cut off.", "angle": "MCP is becoming the default plumbing for personal capture-to-action loops.", "tweetA": "The next interface isn't a chat box. It's a 10-minute drive recorded to an MCP server. The context lives with the user, not the model.", "tweetB": "A partner post, disclosed. Still, the MCP integration into Claude, ChatGPT, Cursor and Gemini CLI at once shows the standard won.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.thisweekinai.ai/p/record-your-ideas-with-plaud-then"}, {"id": 63, "cat": "positioning", "urgency": "deep", "source": "Compounding Quality (Best Buys: Nov 2026)", "title": "Quality stocks had one of their best months ever while S&P fell 1.8%; Adyen -15% on margin guide cut to 50%", "idea": "S&P 500 fell 1.8% in October while quality compounders had a standout month: Fairfax +26.1%, Brookfield +16.1%, Qualys +142% in six months. Fair Isaac keeps falling on losing its monopoly. Adyen fell nearly 15% after lowering its 2026 EBITDA margin guide to 50% to hire 1,000-1,100 engineers and go-to-market staff; revenue growth guide 21-23%. The Fear & Greed index reads 'Fearful'.", "angle": "Quality vs momentum rotation is the equity expression of the semi washout. Adyen's margin-for-growth is a rare owner-operator move in a punished market.", "tweetA": "Adyen gave up margin to hire 1,000+ people and the stock fell 15%. In a market that just sold semis for six sigma, that's the rare company choosing growth over the print.", "tweetB": "Fairfax +26%, Brookfield +16% in a month the S&P fell 1.8%. The discrepancy between 'fearful' sentiment and quality stocks is the rotation in one sentence. $FFH $BN $ADYEN", "charts": {"count": 2, "hot": false, "desc": "S&P 500 October return and Fear & Greed charts"}, "link": "https://www.compoundingquality.net/p/best-buys-november-2026"}, {"id": 64, "cat": "tech", "urgency": "watch", "source": "The Pragmatic Engineer (Gergely Orosz) / Maude Lemaire", "title": "Slack limits custom emoji to 23 to avoid a 100,000-user fan-out; load testing 500K sockets would have cost $150K per run", "idea": "In a 100,000-member channel, each custom emoji fans out to 100,000 users: 10 emoji is 1M fan-outs, 100 is 10M, so Slack caps at 23. Load testing 500,000 WebSocket connections with headless Chrome would have cost $0.37 per 5-hour session per instance (about $150K a run); Maude built 'Koi Pond', slim Go clients, instead. GitHub's Rails monolith ran 100 SQL queries across three clusters for the home page.", "angle": "Scaling is an economics of fan-out. Product limits are often infrastructure decisions.", "tweetA": "Slack caps custom emoji at 23 because 100 would be 10 million fan-outs from one CEO message. Every product limit you hate is somebody's capacity plan.", "tweetB": "$150K per load test run with headless Chrome versus a Go client that does the same job. Most infrastructure savings are the same trick: don't simulate the part nobody looks at.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://newsletter.pragmaticengineer.com/p/scaling-slack-and-github-with-maude"}, {"id": 65, "cat": "tech", "urgency": "watch", "source": "The Pragmatic Engineer (Gergely Orosz) / Maude Lemaire", "title": "GitHub couldn't add more than 16 database shards because of scatter queries; Active Record hid the load", "idea": "GitHub could not add more than 16 shards because lots of Active Record queries (many on the home page) lacked a sharding key and had to scatter across all shards, and more shards make them slower. Maude: devs using Active Record didn't know the load they placed on the DB. She personally verifies everything an LLM does for platform work, and recommends rotating platform and product engineers.", "angle": "A clean example of an abstraction limit translating to a hard scaling cap. Relevant to AI-written code on top of ORMs.", "tweetA": "16 shards. That's the number of database shards GitHub could reach because an ORM hid scatter queries. Abstractions are a loan against your scaling ceiling.", "tweetB": "Maude verifies every LLM output on foundational work and lets it go on the rest. That split foundational vs non-foundational is the only AI-coding policy that actually scales.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://newsletter.pragmaticengineer.com/p/scaling-slack-and-github-with-maude"}];

var COL={macro:'#e24b4a',credit:'#378add',positioning:'#ef9f27','ai-infra':'#1d9e75',crypto:'#7f77dd',geopolitics:'#d85a30',energy:'#f97316',tech:'#06b6d4',gold:'#d4a017',culture:'#ec4899',labor:'#8b5cf6',regulation:'#64748b',science:'#14b8a6',venture:'#84cc16'};
var UE={act:'🔴',deep:'🔵',watch:'🟡'},UL={act:'🔴 Act Now',deep:'🔵 Deep',watch:'🟡 Watch'};
var fc='all',fu='all',fs=null;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function toggle(id){document.getElementById('c'+id).classList.toggle('open');}
function pill(label,on,color,fn){return '<span class="pill'+(on?' on':'')+'" style="'+(on?'background:'+color+';border-color:'+color:'')+'" onclick="'+fn+'">'+label+'</span>';}
function setCat(c){fc=c;fs=null;render();}
function setUrg(u){fu=u;fs=null;render();}
function filterBySrc(name){fs=name;fc='all';fu='all';render(true);}
function filterBySrcIdx(i){filterBySrc(META.includedSources[i].name);}
function render(expand){
  var cats={},urg={act:0,deep:0,watch:0};
  ITEMS.forEach(function(i){cats[i.cat]=(cats[i.cat]||0)+1;urg[i.urgency]++;});
  var h=pill('All ('+ITEMS.length+')',fc==='all','#222',"setCat('all')");
  Object.keys(cats).forEach(function(c){h+=pill(c+' ('+cats[c]+')',fc===c,COL[c]||'#888',"setCat('"+c+"')");});
  document.getElementById('cats').innerHTML=h;
  h=pill('All',fu==='all','#222',"setUrg('all')");
  ['act','deep','watch'].forEach(function(u){h+=pill(UL[u]+' ('+urg[u]+')',fu===u,'#222',"setUrg('"+u+"')");});
  document.getElementById('urg').innerHTML=h;
  var out='';
  ITEMS.forEach(function(item){
    if(fc!=='all'&&item.cat!==fc)return;
    if(fu!=='all'&&item.urgency!==fu)return;
    if(fs&&item.source.indexOf(fs)<0)return;
    var col=COL[item.cat]||'#888',ch=item.charts;
    out+='<div class="card'+(expand&&fs?' open':'')+'" id="c'+item.id+'"><div class="hd" onclick="toggle('+item.id+')">'
     +'<span class="num">'+item.id+'</span><span>'+UE[item.urgency]+'</span><span class="src" style="background:'+col+'">'+esc(item.source)+'</span><span class="tag">'+esc(item.cat)+'</span>'
     +(ch.count?'<span>'+(ch.hot?'🔥':'📊')+'</span>':'')+'<span class="ti">'+esc(item.title)+'</span></div><div class="bd">'
     +'<div class="lb">The Idea</div><div>'+esc(item.idea)+'</div>'
     +'<div class="lb">My Angle</div><div class="angle" style="border-color:'+col+';background:'+col+'14">'+esc(item.angle)+'</div>'
     +'<div class="lb">Tweets</div><div class="tw"><div><b style="color:#378add">TWEET A</b><div>'+esc(item.tweetA)+'</div>'
     +'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>'
     +'<div><b style="color:#7f77dd">TWEET B</b><div>'+esc(item.tweetB)+'</div>'
     +'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>'
     +'<div class="lb">Charts</div><div class="ch'+(ch.hot?' hot':'')+'">'+(ch.count?(ch.hot?'🔥 CHART WORTH SAVING - ':'')+ch.count+' chart(s): '+esc(ch.desc):'No charts in email body. Charts inside the article may be worth opening.')+'</div>'
     +'<p><a href="'+esc(item.link)+'" target="_blank" rel="noopener">↗ Read full article</a></p></div></div>';
  });
  document.getElementById('list').innerHTML=out||'<p>No items match.</p>';
}
function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';
  var r='<p><b>Window:</b> '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.<br>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items extracted: '+META.itemsExtracted+'</p><p><b>Included sources</b> (click to filter):<br>';
  META.includedSources.forEach(function(s,i){r+='<span class="sl" onclick="filterBySrcIdx('+i+')">'+esc(s.name)+'</span> ('+s.items+')<br>';});
  r+='</p><p><b>Skipped:</b><br>';
  META.skippedSources.forEach(function(s){r+=esc(s.name)+' - '+esc(s.reason)+'<br>';});
  document.getElementById('rb').innerHTML=r+'</p>';
  render();
}
init();
