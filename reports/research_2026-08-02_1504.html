<script>
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

}

  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

}

  if (item.charts && item.charts.count > 0 || (item.charts && item.charts.desc)) {
    chartHtml =
      '<div class="chart-box' + (item.charts.hot ? ' hot' : '') + '">' +
      (item.charts.hot ? '🔥 CHART WORTH SAVING — ' : '📊 ') +
      esc(item.charts.desc) +
      '</div>';
  }

  body.innerHTML =
    '<div class="section-label">The Idea</div>' +
    '<div class="idea-text">' + esc(item.idea) + '</div>' +
    '<div class="section-label">My Angle</div>' +
    '<div class="angle-box" style="border-left:2px solid ' + color + '; background:' + hexToRgba(color,0.07) + ';">' + esc(item.angle) + '</div>' +
    '<div class="tweets">' +
      '<div class="tweet">' +
        '<div class="tweet-label a">TWEET A</div>' +
        '<div class="tweet-text">' + esc(item.tweetA) + '</div>' +
        '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button>' +
      '</div>' +
      '<div class="tweet">' +
        '<div class="tweet-label b">TWEET B</div>' +
        '<div class="tweet-text">' + esc(item.tweetB) + '</div>' +
        '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button>' +
      '</div>' +
    '</div>' +
    chartHtml +
    '<a class="read-link" href="' + item.link + '" target="_blank" rel="noopener">↗ Read full article</a>';

  card.appendChild(head);
  card.appendChild(body);
  return card;
}

function render(){
  var container = document.getElementById('cards');
  container.innerHTML = '';
  ITEMS.forEach(function(item){
    var show = true;
    if (state.cat !== 'all' && item.cat !== state.cat) show = false;
    if (state.urg !== 'all' && item.urgency !== state.urg) show = false;
    if (state.src && item.source.indexOf(state.src) === -1) show = false;
    var card = buildCard(item);
    if (!show) card.classList.add('hidden');
    if (state.src && show) card.classList.add('open');
    container.appendChild(card);
  });
}

function buildReport(){
  var body = document.getElementById('reportBody');
  var html = '';
  html += '<h4>Time Window</h4>';
  html += '<div>' + META.windowStart + ' &rarr; ' + META.windowEnd + '. Emails outside this window were not processed.</div>';
  html += '<h4>Coverage</h4>';
  html += '<div>Emails in window: ' + META.emailsInWindow + ' &nbsp;·&nbsp; Emails read: ' + META.emailsRead + ' &nbsp;·&nbsp; Items extracted: ' + META.itemsExtracted + '</div>';
  html += '<h4>Included Sources</h4>';
  META.includedSources.forEach(function(s){
    html += '<div class="skip-item"><span class="src-link" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + esc(s.name) + '</span> — ' + s.count + ' item' + (s.count===1?'':'s') + '</div>';
  });
  html += '<h4>Skipped</h4>';
  META.skippedSources.forEach(function(s){
    html += '<div class="skip-item">' + esc(s.name) + ' — ' + esc(s.reason) + '</div>';
  });
  html += '<div class="totals">Total: ' + META.emailsInWindow + ' emails in window, ' + META.emailsRead + ' read, ' + META.itemsExtracted + ' items extracted, ' + META.skippedSources.length + ' skipped.</div>';
  body.innerHTML = html;

  document.getElementById('reportHead').onclick = function(){
    document.getElementById('reportCard').classList.toggle('open');
  };
}

buildHeader();
buildFilters();
render();
buildReport();
</script>
