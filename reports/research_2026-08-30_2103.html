function buildMeta(){
  document.getElementById('metaLine').textContent =
    META.date + " · " + META.time + " · " + ITEMS.length + " items from " + META.includedSources.length + " sources";
}

function buildFilters(){
  const catCounts = {};
  const urgCounts = { act:0, deep:0, watch:0 };
  ITEMS.forEach(function(it){
    catCounts[it.cat] = (catCounts[it.cat]||0) + 1;
    urgCounts[it.urgency] = (urgCounts[it.urgency]||0) + 1;
  });

  const catBar = document.getElementById('catFilters');
  const allCatPill = document.createElement('div');
  allCatPill.className = 'pill active';
  allCatPill.textContent = 'All (' + ITEMS.length + ')';
  allCatPill.onclick = function(){ setCatFilter(null); };
  catBar.appendChild(allCatPill);
  Object.keys(catCounts).sort().forEach(function(cat){
    const p = document.createElement('div');
    p.className = 'pill';
    p.textContent = cat + ' (' + catCounts[cat] + ')';
    p.dataset.cat = cat;
    p.onclick = function(){ setCatFilter(cat); };
    catBar.appendChild(p);
  });

  const urgBar = document.getElementById('urgFilters');
  const allUrgPill = document.createElement('div');
  allUrgPill.className = 'pill active';
  allUrgPill.textContent = 'All';
  allUrgPill.onclick = function(){ setUrgFilter(null); };
  urgBar.appendChild(allUrgPill);
  ['act','deep','watch'].forEach(function(u){
    const p = document.createElement('div');
    p.className = 'pill';
    p.textContent = URG_LABEL[u] + ' (' + urgCounts[u] + ')';
    p.dataset.urg = u;
    p.onclick = function(){ setUrgFilter(u); };
    urgBar.appendChild(p);
  });
}

let curCat = null, curUrg = null, curSrc = null;

function setCatFilter(cat){
  curCat = cat; curSrc = null;
  document.querySelectorAll('#catFilters .pill').forEach(function(p){
    const isAll = !p.dataset.cat;
    const active = cat ? p.dataset.cat === cat : isAll;
    p.classList.toggle('active', active);
    p.style.background = active && p.dataset.cat ? CAT_COLORS[p.dataset.cat] : (active ? '#333' : '');
    p.style.borderColor = active && p.dataset.cat ? CAT_COLORS[p.dataset.cat] : '';
  });
  render();
}

function setUrgFilter(urg){
  curUrg = urg; curSrc = null;
  document.querySelectorAll('#urgFilters .pill').forEach(function(p){
    const isAll = !p.dataset.urg;
    const active = urg ? p.dataset.urg === urg : isAll;
    p.classList.toggle('active', active);
    p.style.background = active ? '#333' : '';
    p.style.borderColor = active ? '#333' : '';
  });
  render();
}

function filterBySrc(name){
  curCat = null; curUrg = null; curSrc = name;
  document.querySelectorAll('#catFilters .pill, #urgFilters .pill').forEach(function(p){
    const isAllCat = p.parentElement.id === 'catFilters' && !p.dataset.cat;
    const isAllUrg = p.parentElement.id === 'urgFilters' && !p.dataset.urg;
    p.classList.toggle('active', isAllCat || isAllUrg);
    p.style.background = ''; p.style.borderColor = '';
  });
  render(true);
}

function render(expandMatches){
  const wrap = document.getElementById('cards');
  wrap.innerHTML = '';
  ITEMS.forEach(function(item, i){
    if (curCat && item.cat !== curCat) return;
    if (curUrg && item.urgency !== curUrg) return;
    if (curSrc && item.source.indexOf(curSrc) === -1) return;

    const card = document.createElement('div');
    card.className = 'card';
    if (curSrc && expandMatches) card.classList.add('open');

    const color = CAT_COLORS[item.cat] || '#888';
    const chartIcon = item.charts.count > 0 ? (item.charts.hot ? '🔥' : '📊') : '';

    const head = document.createElement('div');
    head.className = 'card-head';
    head.innerHTML =
      '<span class="idx">' + String(i+1).padStart(2,'0') + '</span>' +
      '<span class="urg">' + URG_EMOJI[item.urgency] + '</span>' +
      '<span class="badge" style="background:' + color + '">' + item.source.split(' / ')[0] + '</span>' +
      '<span class="cattag">' + item.cat + '</span>' +
      (chartIcon ? '<span class="charticon">' + chartIcon + '</span>' : '') +
      '<span class="title">' + item.title + '</span>';
    head.onclick = function(){ card.classList.toggle('open'); };
    card.appendChild(head);

    const body = document.createElement('div');
    body.className = 'card-body';
    body.innerHTML =
      '<div class="sec-label">The Idea</div>' +
      '<div class="idea">' + item.idea + '</div>' +
      '<div class="sec-label">My Angle</div>' +
      '<div class="angle" style="border-left:2px solid ' + color + '; background:' + color + '14;">' + item.angle + '</div>' +
      '<div class="tweets">' +
        '<div class="tweet a"><div class="lbl">TWEET A</div><p>' + item.tweetA + '</p>' +
          '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>' +
        '<div class="tweet b"><div class="lbl">TWEET B</div><p>' + item.tweetB + '</p>' +
          '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>' +
      '</div>' +
      '<div class="charts-box' + (item.charts.hot ? ' hot' : '') + '">' +
        (item.charts.count > 0 ? (item.charts.hot ? '🔥 CHART WORTH SAVING — ' : '📊 ') + item.charts.count + ' chart(s): ' + item.charts.desc : '🖼️ ' + item.charts.desc) +
      '</div>' +
      '<div class="link-row"><a href="' + item.link + '" target="_blank">↗ Read full article</a></div>';
    card.appendChild(body);

    wrap.appendChild(card);
  });
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

  html += '<p><strong>Time window:</strong> ' + META.windowStart + ' to ' + META.windowEnd + '. Emails outside this window were not processed.</p>';
  html += '<p><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp; <strong>Emails read:</strong> ' + META.emailsRead + ' &nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</p>';
  html += '<p><strong>Included sources:</strong></p><ul>';
  META.includedSources.forEach(function(s){
    html += '<li><span class="srcname" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span> — ' + s.count + ' item(s)</li>';
  });
  html += '</ul>';
  html += '<p><strong>Skipped sources:</strong></p><ul>';
  META.skippedSources.forEach(function(s){
    html += '<li><span class="skipname">' + s.name + '</span> — ' + s.reason + '</li>';
  });
  html += '</ul>';
  b.innerHTML = html;
}

buildMeta();
buildFilters();
render();
buildReport();
</script>
