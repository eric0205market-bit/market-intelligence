rs", "robotics", "defense"], "source_meta": {"author": "David George", "word_count": 2486, "paywalled": false}}, {"record_id": "2956083694919f2e", "source_type": "concepts", "source_name": "Bessemer Venture Partners", "source_url": "https://www.bvp.com/atlas/the-2026-healthcare-ai-roi-scorecard", "title": "The 2026 Healthcare AI ROI Scorecard", "published_date": "", "language": "en", "processed_at": "2026-10-01T11:15:24Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech", "Society"], "gist": "Bessemer and Bain's 2026 survey of 226 healthcare executives finds AI ROI arriving in ~12 months at ~3.5x, concentrated in administrative work like revenue cycle (4.0x, 67% autonomous agents) while clinical AI (2.9x, 4% autonomous) is held back by trust, liability, regulation and reimbursement. Buyers are abandoning internal builds and consolidating vendors, favoring healthcare-specific AI startups, with multi-trillion-dollar opportunities remaining in payer-provider admin friction, clinical care and drug development.", "themes": [{"theme": "Healthcare AI ROI arrives early", "insights": [{"claim": "In Bessemer and Bain's 2026 survey of 226 healthcare executives, 71% say GenAI has already transformed clinical treatment decisions, versus 84% in 2025 who expected it to within three to five years.", "speaker": "Bessemer Venture Partners", "type": "data_point", "entities": ["Bessemer Venture Partners", "Bain & Company", "GenAI"], "conviction": "high", "so_what": "Healthcare AI adoption is running ahead of multi-year forecasts, pulling forward vendor revenue timelines.", "quote": "In 2025, 84% expected GenAI to transform clinical treatment decisions within three to five years. One year later, 71% say it already has.", "locator": "Last year, 408 healthcare executives told", "quote_verified": true}, {"claim": "Healthcare AI buyers projected roughly 24 months to ROI but realized it in about 12 months, averaging a 3.5x return and exceeding expectations in about 40% of use cases, with 54% seeing material ROI inside the first year.", "speaker": "Bessemer Venture Partners", "type": "data_point", "entities": ["Healthcare AI"], "conviction": "high", "so_what": "Faster-than-underwritten payback supports budget expansion and shortens sales cycles for proven vendors.", "quote": "Buyers projected ~24 months, and realized it in ~12, averaging 3.5x, exceeding expectations in ~40% of use cases. 54% see material ROI inside the first year.", "locator": "Healthcare AI ROI arrived twice as fast", "quote_verified": true}, {"claim": "Because nearly every healthcare AI budget of the past two years assumed a two-year payback that proved wrong by half, organizations still modeling two-year paybacks are underinvesting relative to their own results.", "speaker": "Bessemer Venture Partners", "type": "contrarian", "entities": ["Healthcare AI"], "conviction": "high", "so_what": "Expect upward revisions to healthcare AI budgets as buyers recalibrate payback assumptions.", "quote": "Organizations still modeling two-year paybacks are underinvesting against their own results.", "locator": "ROI is arriving twice as fast", "quote_verified": true}, {"claim": "Realized healthcare AI ROI by function: provider revenue cycle 4.0x, payer claims and pharma preclinical discovery 3.4x, payer provider network 3.3x, member engagement 3.2x, provider front office 3.1x, provider clinical 2.9x, pharma commercial 2.6x, clinical development 2.3x.", "speaker": "Bessemer Venture Partners", "type": "data_point", "entities": ["revenue cycle", "payer claims", "pharma preclinical discovery"], "conviction": "high", "so_what": "The ranking tells where to allocate capital first: revenue cycle and claims vendors have the strongest proven economics.", "quote": null, "locator": "Provider revenue cycle: 4.0X.", "quote_verified": false}, {"claim": "Bessemer views the reported returns as a floor rather than a ceiling because they are realized on roughly two-year-old deployments, and planned headcount eturns will be under-reported in short windows; investors should use longer horizons.", "quote": "attributing value is genuinely hard when drug timelines dwarf a one-year measurement window", "locator": "The ROI Scorecard is the successor", "quote_verified": true}, {"claim": "Use cases in the top-left of the ROI Scorecard, with proven returns but low adoption, are where the next wave of healthcare AI adoption is most likely to come from.", "speaker": "Bessemer Venture Partners", "type": "framework", "entities": ["ROI Scorecard", "AI Dx Index"], "conviction": "medium", "so_what": "Look for vendors in high-ROI, low-adoption use cases for the next growth leg.", "quote": "The top-left quadrant is worth paying attention to as it’s where the next wave of adoption is most likely to come from.", "locator": "How to read the scorecard", "quote_verified": true}]}, {"theme": "Back-office autonomy vs. clinical", "insights": [{"claim": "Two-thirds of provider revenue cycle respondents run semi- or fully autonomous AI agents and 62% do so in payer member engagement, versus only 4% in provider clinical work.", "speaker": "Bessemer Venture Partners", "type": "data_point", "entities": ["revenue cycle", "AI agents"], "conviction": "high", "so_what": "Agentic AI revenue is concentrated in administrative workflows; clinical autonomy remains a distant market.", "quote": "Where organizations have handed the work over entirely, they have handed over administrative work.", "locator": "Autonomy is the tell.", "quote_verified": true}, {"claim": "Every adoption gain of consequence in 2026 was administrative: payer contracting management rose from 19% to 37%, provider credentialing and enrollment from 35% to 56%, provider contracting from 40% to 60%, and prior authorization from 32% to 46%.", "speaker": "Bessemer Venture Partners", "type": "data_point", "entities": ["prior authorization", "payer contracting management"], "conviction": "high", "so_what": "Contracting, credentialing and prior-auth tooling are the fastest-growing healthcare AI categories.", "quote": "Every adoption gain of consequence this year was administrative.", "locator": "Why the money landed in admin", "quote_verified": true}, {"claim": "Clinical AI reaches proof of concept at the same rate as administrative AI but converts to full deployment at half that rate, held back by trust, liability and reimbursement rather than model capability.", "speaker": "Bessemer Venture Partners", "type": "causal", "entities": ["Clinical AI"], "conviction": "high", "so_what": "Clinical AI bottlenecks are institutional, not technical; better models alone will not unlock the market.", "quote": "held back not by model capability but by trust, liability, and reimbursement", "locator": "In 2026, the answer split in two", "quote_verified": true}]}, {"theme": "From pilots to scaled production", "insights": [{"claim": "Between 2025 and 2026 pilots rose across segments (provider 21% to 28%, pharma 20% to 31%, payer 19% to 24%) while production barely moved (provider 8% to 12%, pharma 5% to 6%, payer flat at 6%).", "speaker": "Bessemer Venture Partners", "type": "data_point", "entities": ["Provider", "Pharma", "Payer"], "conviction": "high", "so_what": "Few organizations have crossed into production, leaving a large conversion opportunity for vendors that can deploy at scale.", "quote": null, "locator": "Use cases across the implementation curve", "quote_verified": false}, {"claim": "Over half of next year's incremental healthcare AI investment will go to deployment: 35% to scaling proven use cases and 20% to workflow integration, versus 13% for infrastructure and 11% for foundation model licensing.", "speaker": "Bessemer Venture Partners", "type": "data_point", "entities": ["foundation model licensing"], "conviction": "high", "so_what": "Spend favors deployment and integration vendors over infrastructure and model licensing.", "quote": "35% to scaling proven use cases and 20% to integrating them into existing wo odels and standing behind outputs in audits, so the internal share of development fell by 16 points.", "speaker": "Bessemer Venture Partners", "type": "causal", "entities": ["internal build"], "conviction": "high", "so_what": "Vendors that own maintenance, monitoring and auditability have a durable moat over in-house teams.", "quote": "The failure is not in building, but rather in scaling these PoCs to production scale and maintaining them.", "locator": "The failure is not in building", "quote_verified": true}, {"claim": "42% of healthcare AI buyers have completed or are running vendor consolidation, to simplify their stack (37%), reduce cost (32%) or remove vendors that fell short on security, compliance or performance (30%), while 57% feel inundated by point-solution pitches.", "speaker": "Bessemer Venture Partners", "type": "data_point", "entities": ["vendor consolidation"], "conviction": "high", "so_what": "Point-solution vendors face churn; platforms consolidating budgets win.", "quote": "Buyers have moved from evaluating capabilities to buying implementations, and most of the market is still selling the former.", "locator": "Today, healthcare AI buyers want fewer", "quote_verified": true}, {"claim": "Share of healthcare AI development shifted toward healthcare-specific AI vendors (+12 p.p.) and AI labs (+2 p.p.) and away from internal building (-16 p.p.), with large HCIT incumbents also up 7 p.p., most visibly in provider RCM.", "speaker": "Bessemer Venture Partners", "type": "data_point", "entities": ["healthcare-specific AI vendors", "AI labs", "HCIT"], "conviction": "high", "so_what": "Healthcare-native AI startups are the biggest share winners; incumbents gain via embedded features in RCM.", "quote": null, "locator": "Innovative healthcare AI vendors have taken", "quote_verified": false}, {"claim": "Winning healthcare AI companies like Abridge and SmarterDx scaled a wedge product into a platform, while Qventus won by providing co-development and deployment ion-review nurses, automating those queues can redeploy them into care management roles organizations cannot currently hire into.", "speaker": "Bessemer Venture Partners", "type": "causal", "entities": ["utilization review", "prior authorization"], "conviction": "medium", "so_what": "AI's value in healthcare includes capacity redeployment, not just FTE cuts.", "quote": null, "locator": "Healthcare, like every other industry absorbing", "quote_verified": false}]}, {"theme": "The $1T admin dispute opportunity", "insights": [{"claim": "About $1 trillion a year goes to US healthcare administration, with an estimated $260 billion considered waste, much of it the cost of payers and providers working against each other.", "speaker": "Bessemer Venture Partners", "type": "data_point", "entities": ["healthcare administration"], "conviction": "high", "so_what": "The largest admin prize sits in the payer-provider interface, not within single organizations.", "quote": "This is the cost of two organizations working against each other.", "locator": "The $1T opportunity", "quote_verified": true}, {"claim": "Denial and appeals management is providers' top pain point at 78% and prior authorization second at 61%, while appeals management is a top-three payer pain point at 42%, meaning the same dispute is staffed and paid for twice.", "speaker": "Bessemer Venture Partners", "type": "data_point", "entities": ["prior authorization", "appeals management"], "conviction": "high", "so_what": "Tools addressing denials, appeals and prior auth address the most acute pain on both sides.", "quote": "These are essentially the same dispute on both sides, staffed and paid for twice.", "locator": "The pain point data makes this clear.", "quote_verified": true}, {"claim": "Current AI in prior authorization and utilization management amounts to AI-to-AI combat on mirrored workflows; the trillion-dollar value lies in eliminating the workflow via aligned incentives and real-time payments, requiring AI co rtners", "type": "causal", "entities": ["Clinical AI"], "conviction": "high", "so_what": "Liability frameworks, not model accuracy, gate clinical AI scaling; watch for liability shifts.", "quote": "It’s the predictable behavior of professionals who carry the risk personally.", "locator": "Second, it’s liability.", "quote_verified": true}, {"claim": "36% of providers have delayed or canceled clinical AI deployments over regulatory uncertainty, and there is no established regulatory path for pan-indication clinical intelligence or settled post-market monitoring regime for autonomous clinical AI.", "speaker": "Bessemer Venture Partners", "type": "data_point", "entities": ["Clinical AI"], "conviction": "medium", "so_what": "Regulatory clarity is a key catalyst for clinical AI; until then deployments stall.", "quote": null, "locator": "Third is regulatory and compliance.", "quote_verified": false}, {"claim": "Fee-for-service has no mechanism to pay for AI-delivered care; about 48% of payers are unwilling to reimburse fully autonomous AI care versus about 5% objecting to clinician-in-the-loop AI, making human-in-the-loop the reimbursable near-term architecture.", "speaker": "Bessemer Venture Partners", "type": "thesis", "entities": ["fee-for-service", "Payer"], "conviction": "high", "so_what": "Near-term clinical AI business models should be clinician-in-the-loop to be reimbursable.", "quote": "Human-in-the-loop is the reimbursable architecture for the near term.", "locator": "Then, there’s payment.", "quote_verified": true}, {"claim": "Roughly 44% of payers are willing to establish payment pathways for AI in primary and preventive care, diagnostic support and medication management, and Bessemer expects CMS and national payers to move before the broader market follows.", "speaker": "Bessemer Venture Partners", "type": "prediction", "entities": ["CMS"], "conviction": "medium", "so_what": "CMS reimbursement decisions are a catalyst to watch for clinical AI vendors.", "quote": "We expect CMS and the national payers will need to move before the broader market follows.", "locator": "The good news is that payers", "quote_verified": true}]}, {"theme": "Pharma AI and trust infrastructure", "insights": [{"claim": "The US spends $500 billion a year on drugs and pharma spends $150 billion a year on R&D, but preclinical development, where most AI has focused, captures only 25% of R&D spend.", "speaker": "Bessemer Venture Partners", "type": "data_point", "entities": ["Pharma"], "conviction": "medium", "so_what": "The bigger pharma AI prize is downstream in clinical trial success and access, not just discovery.", "quote": "Preclinical development, which has been the focus of AI so far, captures only 25% of R&D spend.", "locator": "The $0.5T drug development", "quote_verified": true}, {"claim": "As more AI-selected drug candidates enter the clinic, value shifts toward raising clinical trial success rates and widening patient access, which are earlier in ROI capture for structural rather than technical reasons.", "speaker": "Bessemer Venture Partners", "type": "prediction", "entities": ["clinical trials"], "conviction": "medium", "so_what": "Clinical-trial optimization and access tools are the next pharma AI frontier, with longer payback.", "quote": null, "locator": "Preclinical development, which has been the focus", "quote_verified": false}, {"claim": "Agent harness infrastructure such as evals, performance monitoring, guardrails and orchestration maps almost exactly onto what clinicians need to trust AI and what regulators will require in post-market surveillance, so builders of this layer will scale past pilot more easily.", "speaker": "Bessemer Venture Partners", "type": "thesis", "entities": ["evals", "guardrails", "agent orchestration"], "conviction": "medium", "so_what": "Healthcare AI vendors investing in evals and monitoring hold an edge in clinical scaling.", "quote": "Those who build this layer deliberately will more easily scale past pilot in clinical and admin settings.", "locator": "Outside of healthcare, teams deploying AI", "quote_verified": true}, {"claim": "Trust that sufficed for administrative AI is now the binding constraint on clinical deployment, so winners are companies building fast, expanding into adjacent workflows and compounding trust with enterprise partners.", "speaker": "Bessemer Venture Partners", "type": "thesis", "entities": ["AI-first companies"], "conviction": "medium", "so_what": "Favor healthcare AI companies with deep enterprise relationships and proven trust records.", "quote": "It’s wartime, and the biggest winners are the companies building fast, eating into adjacent workflows, and compounding trust with their enterprise partners.", "locator": "What these opportunities tell builders and buyers", "quote_verified": true}]}], "insight_total": 40, "top_entities": ["Bessemer Venture Partners", "Bain & Company", "Abridge", "SmarterDx", "Qventus", "CMS", "American Medical Association", "Association of American Medical Colleges", "HCIT", "revenue cycle", "prior authorization", "Clinical AI"], "source_meta": {"author": "", "word_count": 4403, "paywalled": false}}, {"record_id": "2d7c5f1c610eb762", "source_type": "concepts", "source_name": "a16z Blog", "source_url": "https://a16z.com/who-gets-paid-when-ai-does-the-shopping/", "title": "Who Gets Paid When AI Does the Shopping? | Andreessen Horowitz", "published_date": "2026-09-30", "language": "en", "processed_at": "2026-10-01T11:14:52Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech", "Positioning"], "gist": "a16z Growth partners argue AI shopping assistants threaten marketplace profits not by replicating fulfillment but by capturing discovery, putting ad-heavy profit pools (Amazon's $69B ads vs $34B ex-AWS operating income) at risk. Platforms with ad businesses to protect (Amazon) block agents like Muse, while software/payments rails (Shopify, Toast, Square) and share-seekers (Instacart) lean in; outcomes hinge on incremental demand versus rerouted orders and on bargaining leverage.", "themes": [{"theme": "Agents capture discovery, not fulfillment", "insights": [{"claim": "AI shopping assistants do not need to replicate Amazon's warehouse network to pressure Amazon's profits; they only need to become the place where consumers decide what to buy.", "speaker": "Alex Immerman, Santiago Rodriguez", "type": "thesis", "entities": ["Amazon", "AI assistants"], "conviction": "high", "so_what": "Threat to Amazon is margin (ads/discovery), not fulfillment share; watch retail ad revenue rather than unit volume.", "quote": "AI assistants don’t need to replicate Amazon’s warehouses to put pressure on Amazon’s profits. They need to become the place where you decide what to buy.", "locator": "When the power dynamics shift around", "quote_verified": true}, {"claim": "Agents such as Muse, ChatGPT, Grok Bot and Instinct cannot rebuild fulfillment networks, but they can compare existing providers and route orders among those that meet a customer's needs.", "speaker": "Alex Immerman, Santiago Rodriguez", "type": "framework", "entities": ["Muse", "ChatGPT", "Grok Bot", "Instinct"], "conviction": "high", "so_what": "Agents act as routing layers atop incumbents' infrastructure, commoditizing the front end.", "quote": "They can compare existing providers and route orders among those that meet the customer’s needs.", "locator": "Muse, ChatGPT, Grok Bot and Instinct", "quote_verified": true}, {"claim": "In an agentic future, an assistant could pick a restaurant, place the order via Toast, pay via Toast and arrange delivery via DoorDash Drive, so the consumer never browses a marketplace or sees a sponsored listing.", "speaker": "Alex Immerman, Santiago Rodriguez", "type": "prediction", "entities": ["Toast", "DoorDash Drive", "DoorDash"], "conviction": "medium", "so_what": "Sponsored-listing ad revenue at marketplaces is at risk even when the marketplace still fulfills.", "quote": "You never browse a marketplace or see a sponsored listing.", "locator": "The future state isn’t hard to imagine", "quote_verified": true}, {"claim": "Incumbents like Amazon, DoorDash and Instacart may keep their fulfillment advantage, but that does not guarantee they preserve their profit pool.", "speaker": "Alex Immerman, Santiago Rodriguez", "type": "contrarian", "entities": ["Amazon", "DoorDash", "Instacart"], "conviction": "high", "so_what": "Operational moats may not protect earnings; valuation multiples tied to ad margins could compress.", "quote": "The incumbents may maintain their fulfillment advantage, but that does not guarantee preserving their profit pool.", "locator": "The incumbents may maintain their fulfillment", "quote_verified": true}, {"claim": "The authors expect the underlying commerce networks to remain valuable but are less sure those networks keep the same share of the economics once someone else brings the customer.", "speaker": "Alex Immerman, Santiago Rodriguez", "type": "prediction", "entities": ["Amazon", "DoorDash", "Instacart"], "conviction": "medium", "so_what": "Expect value share to shift from marketplaces toward agent/aggregation layers over time.", "quote": "I expect the underlying networks to remain valuable. I’m less sure they keep the same share of the economics once someone else brings the customer.", "locator": "I expect the underlying networks", "quote_verified": true}]}, {"theme": "Advertising is the profit pool at stake", "insights": [{"claim": "In 2025 Amazon generated $69 billion in advertising revenue versus $34 billion in operating income excluding AWS; at an assumed 70% contribution margin, advertising contributed more than reported operating income.", "speaker": "Alex Immerman, Santiago Rodriguez", "type": "data_point", "entities": ["Amazon", "AWS"], "conviction": "high", "so_what": "Amazon's non-AWS profit is essentially an ad business; agent-driven loss of discovery hits earnings disproportionately.", "quote": "In 2025, Amazon generated $69 billion in advertising revenue compared to $34 billion in operating income ex-AWS.", "locator": "The incumbents may maintain their fulfillment", "quote_verified": true}, {"claim": "The same dynamic, where advertising contributes more than reported operating income, is true for DoorDash and Instacart.", "speaker": "Alex Immerman, Santiago Rodriguez", "type": "data_point", "entities": ["DoorDash", "Instacart"], "conviction": "medium", "so_what": "DoorDash and Instacart profitability is highly sensitive to loss of in-app ad impressions.", "quote": "The same is true for DoorDash and Instacart.", "locator": "The incumbents may maintain their fulfillment", "quote_verified": true}, {"claim": "Alphabet and Meta combined for nearly $500 billion in advertising revenue in 2025 from being the center of gravity for distribution, and even a meaningful partial redistribution of such flows could fund an entirely new business model and competitive ecosystem.", "speaker": "Alex Immerman, Santiago Rodriguez", "type": "data_point", "entities": ["Alphabet", "Meta"], "conviction": "medium", "so_what": "A shift of even a slice of the ~$500B ad pool to agents is a venture-scale opportunity and a risk to Alphabet/Meta.", "quote": "In 2025, Alphabet and Meta combined for nearly $500 billion in advertising revenue from being the center of gravity for distribution.", "locator": "Advertising revenue and commissions are key", "quote_verified": true}, {"claim": "Whether a platform welcomes AI agents depends on two dimensions: how much incremental demand the agent can bring, and how much of the platform's operating income comes from commissions and advertising tied to controlling discovery and screen time.", "speaker": "Alex Immerman, Santiago Rodriguez", "type": "framework", "entities": ["AI assistants"], "conviction": "high", "so_what": "Screen for exposure: high ad/commission share of operating income plus low incremental demand = most at risk.", "quote": "what percentage of your operating income is commissions and/or ad revenue?", "locator": "Whether you like this or not", "quote_verified": true}, {"claim": "Even when a marketplace still handles fulfillment, routing customers around its storefront (e.g., via Toast plus DoorDash Drive) pressures its commissions and advertising; a16z's Seema has called the enterprise-software analogue 'going headless'.", "speaker": "Alex Immerman, Santiago Rodriguez", "type": "causal", "entities": ["DoorDash", "DoorDash Drive", "Toast", "Seema"], "conviction": "medium", "so_what": "Headless commerce shifts revenue from high-margin marketplace take to lower-margin logistics.", "quote": "That puts pressure on commissions and advertising even if DoorDash still handles the order.", "locator": "That changes the options available to agents", "quote_verified": true}]}, {"theme": "Who leans in vs. who blocks", "insights": [{"claim": "Amazon banned the Muse assistant while Shopify, which lacks a scaled ad business at risk, welcomed the integration.", "speaker": "Alex Immerman, Santiago Rodriguez", "type": "anecdote", "entities": ["Amazon", "Muse", "Shopify"], "conviction": "high", "so_what": "Corporate stances toward agents reveal where each firm's profit pool sits.", "quote": "Everyone saw the contrast last week, when Amazon said, “Muse is banned!” while Shopify", "locator": "When the power dynamics shift around", "quote_verified": true}, {"claim": "Instacart is integrating with Muse while Amazon is blocking it, and both choices can make economic sense: Amazon has breadth and habit-driven negotiating leverage, while Instacart has more room to gain orders that don't already start on its marketplace.", "speaker": "Alex Immerman, Santiago Rodriguez", "type": "thesis", "entities": ["Instacart", "Muse", "Amazon"], "conviction": "high", "so_what": "Smaller-share marketplaces are natural agent partners; dominant ones negotiate from strength.", "quote": "The early split is telling: Instacart is integrating with Muse, while Amazon i inal bonds"], "conviction": "medium", "so_what": "Barbell TIPS/energy against high-grade Treasuries to cover both bust scenarios.", "quote": "adding inflation hedges such as TIPS and energy stocks alongside high-grade nominal bonds", "locator": "For now, the US remains", "quote_verified": true}]}], "insight_total": 6, "top_entities": ["US", "AI", "energy stocks", "tech", "TIPS", "bonds", "interest rates", "Will Denyer", "Tan Kai Xian"], "source_meta": {"author": "", "word_count": 132, "paywalled": false}}, {"record_id": "4e1ba3fbd622125a", "source_type": "concepts", "source_name": "BCG Henderson Institute", "source_url": "https://www.bcg.com/publications/2026/five-quantum-hardware-types-compared", "title": "Making Business Sense of Quantum Hardware", "published_date": "2026-09-30", "language": "en", "processed_at": "2026-10-01T11:15:01Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "BCG finds enterprise quantum spending hit ~$550M in 2025, overtaking academia and government, and compares five hardware modalities (superconducting, trapped ions, neutral atoms, photonics, spin qubits) on scaling, fidelity, coherence and clock speed. Fault tolerance via error correction remains the defining unsolved challenge, with timelines of 5-20 years, so firms should build a system-aware view and distrust raw qubit-count claims rather than bet on one modality now.", "themes": [{"theme": "Enterprise quantum spending inflection", "insights": [{"claim": "Enterprise spending on quantum computing reached about $550 million in 2025, surpassing total investment by academia and government for the first time, according to BCG research.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "data_point", "entities": ["BCG", "quantum computing"], "conviction": "high", "so_what": "Signals demand shifting from public/academic to corporate budgets, supporting vendor revenue visibility.", "quote": "enterprise spending reached new heights of about g hardware vendors.", "quote": "The debate has shifted from technology feasibility to hardware viability, specifically which architecture will define the commercial era and on what timeline.", "locator": "The quantum industry’s center of gravity is shifting", "quote_verified": true}]}, {"theme": "Four-factor hardware evaluation framework", "insights": [{"claim": "There is no single quantum computer: five distinct hardware approaches (superconducting circuits, trapped ions, neutral atoms, photon-based, and spin qubits) are advancing at different stages of maturity, each with different strengths and weaknesses.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "framework", "entities": ["superconducting circuits", "trapped ions", "neutral atoms", "photonics", "spin qubits"], "conviction": "high", "so_what": "Quantum exposure is not one bet; vendor-level outcomes depend heavily on which modality prevails.", "quote": "there is no such thing as a single quantum computer", "locator": "Despite the continuing uncertainties in technology", "quote_verified": true}, {"claim": "BCG evaluates quantum hardware on four factors: scaling (qubit count), addressability and noise (gate fidelity), coherence time, and clock speed, with every approach trading strength in one for weakness in another.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "framework", "entities": ["BCG"], "conviction": "high", "so_what": "Provides a checklist for assessing quantum vendors beyond headline qubit counts.", "quote": "Each approach trades strength in one area for weakness in another.", "locator": "Four factors define how well a system", "quote_verified": true}, {"claim": "A two-qubit gate fidelity of 99.9% equates to one error per thousand operations, which is the key measure of how reliably the building blocks of quantum algorithms can be performed.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "data_point", "entities": ["gate fidelity"], "conviction": "high", "so_what": "Fidelity thresholds are a concrete metric to benchmark vendor progress toward usable systems.", "quote": "a two-qubit gate at 99.9% fidelity means one error per thousand operations", "locator": "Addressability and Noise", "quote_verified": true}, {"claim": "A highly accurate but extremely slow quantum system may be impractical or no more useful than current supercomputers for computationally intensive tasks.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "causal", "entities": ["supercomputers"], "conviction": "medium", "so_what": "High-fidelity but slow modalities face a real commercial ceiling against classical HPC.", "quote": "A highly accurate but extremely slow system may be impractical, or no more useful than current supercomputers, for computationally intensive tasks.", "locator": "Clock Speed", "quote_verified": true}, {"claim": "Since no hardware system leads on all four factors, matching tradeoffs to the intended use case is what separates a well-informed quantum strategy from a naive one.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "thesis", "entities": [], "conviction": "high", "so_what": "Expect a multi-modality market segmented by application rather than a single winner in the near term.", "quote": "This understanding separates a well-informed quantum strategy from a naive one.", "locator": "Five Contenders", "quote_verified": true}, {"claim": "BCG groups the five systems into three maturity tiers: the proven leader (superconducting circuits), capable challengers (trapped ions and neutral atoms), and high-potential unknowns (photon-based and spin qubits); topological qubits are too early to compare.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "framework", "entities": ["superconducting circuits", "trapped ions", "neutral atoms", "photonics", "spin qubits", "topological qubits"], "conviction": "high", "so_what": "Maps risk/maturity for quantum hardware vendor exposure by modality.", "quote": "the proven leader (superconducting circuits), capable challengers (trapped ions and neutral atoms), and high-potential unknowns (photon-based and spin qubits)", "locator": "In terms of maturity, the five systems", "quote_verified": true}]}, {"theme": "Modality tradeoffs and contenders", "insights": [{"claim": "Superconducting quantum systems, backed by IBM and Google for more than a decade, are the dominant hardware today with the highest digital qubit counts, fast gate speeds, and a fabrication logic borrowed from semiconductor manufacturing.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "thesis", "entities": ["IBM", "Google", "superconducting circuits"], "conviction": "high", "so_what": "Incumbents IBM and Google hold the most mature quantum platform position.", "quote": "Backed by the likes of IBM and Google for more than a decade, it is in a maturity category of its own", "locator": "Superconducting Circuits.", "quote_verified": true}, {"claim": "Superconducting qubits operate at about 15 millikelvin, requiring large dilution refrigerators and dense control wiring, and suffer from lagging fidelity, chip-geometry-limited connectivity, and hard wiring-density and thermal scaling problems.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "data_point", "entities": ["superconducting circuits", "dilution refrigerators"], "conviction": "high", "so_what": "Cryogenic and wiring supply chains are critical enablers and bottlenecks for the leading modality.", "quote": null, "locator": "Qubits are fabricated on chips using loops", "quote_verified": false}, {"claim": "BCG argues that superconducting systems' scaling challenges are known challenges, and that this predictability is itself a competitive advantage.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "contrarian", "entities": ["superconducting circuits"], "conviction": "medium", "so_what": "Known engineering risk may deserve a lower risk premium than unknown-physics risk in rival modalities.", "quote": "The engineering challenges at scale are real, but they are known challenges, which is itself a form of advantage.", "locator": "The tradeoffs are well understood.", "quote_verified": true}, {"claim": "Trapped-ion systems achieve two-qubit gate fidelities at or above 99.9%, the highest of any system, with coherence times measured in minutes, but run four to five orders of magnitude slower than superconducting systems.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "data_point", "entities": ["trapped ions", "ytterbium", "barium"], "conviction": "high", "so_what": "Trapped-ion vendors lead on quality but face a throughput handicap that may limit addressable workloads.", "quote": "Trapped ions achieve two-qubit gate fidelities at or above 99.9%, the highest of any system, and coherence times measured in minutes rather than microseconds.", "locator": "Trapped ions achieve two-qubit gate fidelities", "quote_verified": true}, {"claim": "Reaching the qubit counts needed for fault-tolerant computation remains a significant engineering challenge for trapped ions, partly because optical control systems add infrastructure complexity.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "causal", "entities": ["trapped ions"], "conviction": "medium", "so_what": "Scaling risk is the key diligence point for trapped-ion players.", "quote": null, "locator": "Trapped ions achieve two-qubit gate fidelities", "quote_verified": false}, {"claim": "Neutral-atom systems offer long coherence and strong fidelity like trapped ions but, unlike trapped ions, have demonstrated a compelling path to scale.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "thesis", "entities": ["neutral atoms", "optical tweezers"], "conviction": "medium", "so_what": "Neutral atoms may be the challenger best positioned to combine quality with scale.", "quote": "Unlike trapped ions, neutral atoms have demonstrated a compelling path to scale.", "locator": "Neutral Atoms.", "quote_verified": true}, {"claim": "Neutral-atom systems enable quantum memory by moving atoms between computation and storage zones, which in current hardware makes error correction easier than on other platforms because idle qubits are shielded from ongoing computation.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "causal", "entities": ["neutral atoms", "quantum memory", "error correction"], "conviction": "medium", "so_what": "A structural error-correction advantage could accelerate neutral atoms' path to fault tolerance.", "quote": null, "locator": "This system also enables a distinctive capability", "quote_verified": false}, {"claim": "Neutral atoms also support an analog computing mode that bypasses discrete logic gates, with researchers reporting real signs of quantum advantage in domains such as materials science, though precision is harder to control.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "data_point", "entities": ["neutral atoms", "materials science"], "conviction": "exploratory", "so_what": "Analog quantum could yield earlier niche commercial wins in materials before digital fault tolerance.", "quote": "researchers have reported real signs of quantum advantage in domains such as materials science", "locator": "Neutral atoms also support an analog mode", "quote_verified": true}, {"claim": "Photon-based systems are natural carriers for quantum networking, but photon loss forces reliance on large qubit numbers with loss-tolerant error correction, and current systems are far from the million-qubit scale that may be achievable.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "causal", "entities": ["photonics", "quantum networking"], "conviction": "medium", "so_what": "Photonics is a long-dated bet with a distinctive networking angle but significant scale and fidelity gaps.", "quote": "million-qubit photonic systems may be achievable, but current systems are far from that scale", "locator": "The scaling math for photonics differs", "quote_verified": true}, {"claim": "Spin qubits, built mostly in silicon, could eventually be manufactured on adapted existing semiconductor fabrication infrastructure, a high-volume production pathway that BCG says no other approach can credibly claim.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "thesis", "entities": ["spin qubits", "silicon", "semiconductor fabrication"], "conviction": "medium", "so_what": "Spin qubits create optionality for semiconductor fabs and foundries to become quantum manufacturers.", "quote": "a pathway to high-volume production that no other approach can credibly claim", "locator": "The reason is that most spin qubits", "quote_verified": true}, {"claim": "Spin qubit systems currently have qubit counts only in the tens, but are compact enough to fit meaningful numbers on a fingernail-sized chip, giving them significant data center integration advantages over rack-sized optical setups or dilution refrigerators.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "data_point", "entities": ["spin qubits", "data center"], "conviction": "medium", "so_what": "If scaling is proven, spin qubits could be the most data-center-friendly modality.", "quote": "Current qubit counts are in the tens for spin qubit systems.", "locator": "Current qubit counts are in the tens", "quote_verified": true}, {"claim": "Despite being the newest entrant, spin qubits are in some respects the most strategically interesting hardware approach, with sound physics but an uncertain timeline.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "contrarian", "entities": ["spin qubits"], "conviction": "exploratory", "so_what": "The least mature modality may carry the largest long-term upside.", "quote": "In addition to being the newest entrant in the hardware race, they are in some respects the most strategically interesting.", "locator": "Spin Qubits.", "quote_verified": true}]}, {"theme": "Fault tolerance and error correction race", "insights": [{"claim": "Fault tolerance is the principal unsolved challenge for all quantum hardware: today's noisy systems can run some noise-tolerant specialized algorithms but error rates are too high for most commercially valuable algorithms.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "thesis", "entities": ["fault tolerance"], "conviction": "high", "so_what": "Commercial value of quantum remains gated on fault tolerance; near-term revenue claims warrant skepticism.", "quote": "The principal challenge facing all five hardware approaches—and quantum computing generally—is fault tolerance.", "locator": "The Unsolved Challenge", "quote_verified": true}, {"claim": "Depending on the error correction code and error rate, a single logical qubit may require hundreds or even thousands of physical qubits for protection.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "data_point", "entities": ["quantum error correction", "logical qubit"], "conviction": "high", "so_what": "Headline physical qubit counts vastly overstate useful compute capacity.", "quote": "a single logical qubit may require hundreds, or even thousands, of physical qubits for protection", "locator": "The path to fault-tolerant computation", "quote_verified": true}, {"claim": "The quantum hardware race is not about who produces the most qubits but who produces qubits good enough and numerous enough to make error correction possible without an impractical number of physical qubits.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "thesis", "entities": ["error correction"], "conviction": "high", "so_what": "Evaluate vendors on qubit quality times quantity, not raw qubit roadmaps.", "quote": "The race is not simply about which system can produce the most qubits", "locator": "The developers of each hardware system", "quote_verified": true}, {"claim": "Trapped ions and neutral atoms need fewer physical qubits per logical qubit due to higher fidelity, superconducting systems compensate with speed and scale, and photonics builds error correction into its architecture from the start.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "framework", "entities": ["trapped ions", "neutral atoms", "superconducting circuits", "photonics", "spin qubits"], "conviction": "medium", "so_what": "Different modalities reach fault tolerance via different levers, so progress metrics must be modality-specific.", "quote": "Trapped ions and neutral atoms have fidelity levels that make error correction more efficient—they need fewer physical qubits per logical qubit.", "locator": "On this dimension, the systems have", "quote_verified": true}, {"claim": "The milestone of a logical qubit outperforming its best constituent physical qubit has only recently been crossed and only in controlled conditions.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "data_point", "entities": ["logical qubit"], "conviction": "high", "so_what": "Fault-tolerant commercial scale remains distant despite headline breakthroughs.", "quote": "has only recently been crossed and only in controlled conditions", "locator": "An important error correction milestone", "quote_verified": true}, {"claim": "Forecasts for commercially useful fault-tolerant quantum computers range from five to 20 years depending on the hardware system tracked and engineering assumptions.", "speaker": "htt effects on fidelity, connectivity, and error-correction efficiency are not captured in today's specifications.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "prediction", "entities": ["quantum computing"], "conviction": "medium", "so_what": "Expect benchmarking/standards to emerge that could re-rate vendors whose modular performance disappoints.", "quote": "The industry will need to develop standardized metrics that quantify the performance impact of modularity as systems scale.", "locator": "Modularity adds another unresolved dimension", "quote_verified": true}]}, {"theme": "Corporate quantum strategy implications", "insights": [{"claim": "Most organizations do not need to bet on a specific quantum hardware system now, and doing so offers little advantage, but they should build a working system-aware view of the landscape.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "contrarian", "entities": [], "conviction": "high", "so_what": "Enterprise buyers likely favor cloud, multi-vendor access over hardware lock-in near term.", "quote": "Most organizations do not need to place a bet on a specific hardware system now, and doing so offers little advantage.", "locator": "The Implications for Companies Today", "quote_verified": true}, {"claim": "Quantum infrastructure decisions are not hardware-neutral: footprint, cooling, control complexity, and classical integration differ by system and drive capex/opex choices such as on-premise hosting versus cloud access.", "speaker": "https://www.bcg.com/about/people/experts/jean-francois-bobier", "type": "causal", "entities": ["cloud"], "conviction": "medium", "so_what": "Cloud-accessible quantum platforms benefit from enterprises avoiding modality-specific capex.", "quote": "Infrastructure decisions are not hardware-neutral.", "locator": "Infrastructure decisions are not hardware-neutral", "quote_verified": true}, {"claim": "Quantum vendor qubit-count com ral Reserve", "quantitative tightening"], "conviction": "medium", "so_what": "Balance-sheet runoff eventually forces the Fed back into supplying liquidity via repo—a recurring pattern after 2019.", "quote": "in late 2025 following almost two and a half years of balance sheet reduction", "locator": "The chart below, which includes a scrollable", "quote_verified": true}, {"claim": "The September 2019 repo episode came after a substantial reduction of the Fed balance sheet amid market dislocations and upward pressure on money market rates.", "speaker": "Gara Afonso, Jun-Davinci Choi, Gonzalo Cisternas, and Will Riordan", "type": "causal", "entities": ["Federal Reserve"], "conviction": "high", "so_what": "Historical precedent: balance sheet shrinkage tends to end with repo-market stress.", "quote": "after a substantial reduction of the Fed balance sheet and amid market dislocations", "locator": "The chart below, which includes a scrollable", "quote_verified": true}, {"claim": "Fed reverse repo usage climbed from March 2021 as pandemic policies swelled liquidity, peaking around $2.5 trillion in early 2023 before declining steadily as the Fed shrank its balance sheet.", "speaker": "Gara Afonso, Jun-Davinci Choi, Gonzalo Cisternas, and Will Riordan", "type": "data_point", "entities": ["ON RRP", "Federal Reserve"], "conviction": "high", "so_what": "The drained RRP buffer means further QT came out of bank reserves, raising funding-stress risk.", "quote": "peaking at around $2.5 trillion in early 2023", "locator": "Historically, reverse repos have been used less", "quote_verified": true}, {"claim": "Reverse repos have historically been used far less than repos because the Fed has structured its asset holdings to regularly add balances rather than drain reserves.", "speaker": "Gara Afonso, Jun-Davinci Choi, Gonzalo Cisternas, and Will Riordan", "type": "thesis", "entities": ["Federal Reserve"], "conviction": "medium", "so_what": "The 2021-2023 RRP boom was a historical anomaly // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
