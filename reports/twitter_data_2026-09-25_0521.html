function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escapeAttr(s){return escapeHtml(s).replace(/`/g,'&#96;');}
function renderBold(t){return escapeHtml(t).replace(/\*\*([^*]+?)\*\*/g,'<strong>$1</strong>');}
function relativeTime(iso){if(!iso)return'';const dt=new Date(iso);if(isNaN(dt.getTime()))return'';const s=Math.max(0,(Date.now()-dt.getTime())/1000);if(s<60)return Math.floor(s)+'s ago';const m=s/60;if(m<60)return Math.floor(m)+'m ago';const h=m/60;if(h<48)return Math.floor(h)+'h ago';return Math.floor(h/24)+'d ago';}
function authorTag(name,cls='item-author'){if(!name)return'';return`<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;}
function renderCharts(imgs){if(!imgs||!imgs.length)return'';return'<div class="charts">'+imgs.map(u=>`<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`).join('')+'</div>';}
function renderDataPoints(pts){if(!pts||!pts.length)return'';return'<div class="data-points">'+pts.map(p=>`<span class="dp-tag">${escapeHtml(p)}</span>`).join('')+'</div>';}
function renderItem(item){const author=item.author||item.author_username||'';const time=relativeTime(item.created_at);const link=item.tweet_url?`<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`:'';const body=item.description||item.text||'';return`<div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}"><div class="item-head">${authorTag(author)}${time?`<span class="item-time">${time}</span>`:''}${link}</div>${body?`<div class="item-text">${escapeHtml(body)}</div>`:''}${renderDataPoints(item.data_points)}${renderCharts(item.images)}</div>`;}
function renderTopic(topic,idx){const items=(topic.items||[]).map(renderItem).join('');const name=topic.topic||topic.name||`Topic ${idx+1}`;return`<div class="topic"><div class="topic-head" onclick="toggleTopic(this)"><span class="topic-name">${escapeHtml(name)}</span><span class="topic-count">${(topic.items||[]).length}</span><span class="topic-arrow">▸</span></div><div class="topic-body">${items||'<div class="empty">No items.</div>'}</div></div>`;}
function renderLink(l){const author=l.author||l.author_username||'';const url=l.url||(l.resolved||l.tco)||'';return`<div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">${author?authorTag(author,'link-author'):'<span class="link-author">—</span>'}<a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>${l.description?`<span class="link-desc">${escapeHtml(l.description)}</span>`:''}</div>`;}
function renderSection(letter,name,body,count){return`<div class="section"><div class="section-head" onclick="toggleSection(this)"><span class="section-letter">${letter}.</span><span class="section-name">${escapeHtml(name)}</span><span class="section-count">${count}</span><span class="section-arrow">▸</span></div><div class="section-body">${body}</div></div>`;}
function renderSummary(text){if(!text)return'';const p=String(text).split(/

+/).filter(Boolean).map(p=>`<p>${renderBold(p)}</p>`).join('');return`<div class="summary">${p}</div>`;}
function renderStats(d){const parts=[];const cov=d.coverage||{};if(cov.authors_covered!=null&&cov.authors_total!=null){const pct=cov.authors_total?(100*cov.authors_covered/cov.authors_total):0;parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);}const tc=(d.topics||[]).length;const ic=(d.topics||[]).reduce((n,t)=>n+(t.items||[]).length,0);parts.push(`topics <strong>${tc}</strong>`);parts.push(`items <strong>${ic}</strong>`);if((d.links||[]).length)parts.push(`links <strong>${d.links.length}</strong>`);return parts.join(' | ');}

function closeLightbox(){document.getElementById('lightbox').classList.remove('open');document.getElementById('lightbox-img').src='';}
let activeFilter=null;
function filterAuthor(name){if(!name)return;activeFilter=String(name).toLowerCase();document.querySelectorAll('.filterable').forEach(el=>{const a=(el.dataset.author||'').toLowerCase();if(a===activeFilter){el.classList.add('match');el.classList.remove('dim');}else{el.classList.add('dim');el.classList.remove('match');}});document.getElementById('filter-name').textContent='@'+name;document.getElementById('filter-bar').classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}
function clearFilter(){activeFilter=null;document.querySelectorAll('.filterable').forEach(el=>{el.classList.remove('match');el.classList.remove('dim');});document.getElementById('filter-bar').classList.remove('active');}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('lightbox').classList.contains('open'))closeLightbox();else if(activeFilter)clearFilter();}});
function renderReport(d){if(!d||typeof d!=='object')d={};document.getElementById('report-date').textContent=d.date||'';const topicsBody=(d.topics||[]).map(renderTopic).join('')||'<div class="empty">No topics.</div>';const linksBody=(d.links||[]).map(renderLink).join('');const sections=[renderSummary(d.summary),renderSection('A','Topics',topicsBody,(d.topics||[]).length),linksBody?renderSection('B','Link Queue',linksBody,(d.links||[]).length):''].join('');document.getElementById('app').innerHTML=sections||'<div class="empty">No report data.</div>';document.querySelectorAll('.section').forEach((s,i)=>{if(i===0)s.classList.add('open');});const ft=document.querySelector('.topic');if(ft)ft.classList.add('open');document.getElementById('stats').innerHTML=renderStats(d);}
renderReport(REPORT_DATA);
</script>
