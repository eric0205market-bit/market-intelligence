const CAT_COLORS = {
  macro:"#e24b4a", credit:"#378add", positioning:"#ef9f27", "ai-infra":"#1d9e75",
  crypto:"#7f77dd", geopolitics:"#d85a30", energy:"#f97316", tech:"#06b6d4",
  gold:"#d4a017", culture:"#ec4899", labor:"#8b5cf6", regulation:"#64748b",
  science:"#14b8a6", venture:"#84cc16", mining:"#a16207"
};
const CAT_LABELS = {
  macro:"macro", credit:"credit", positioning:"positioning", "ai-infra":"AI/infra",
  crypto:"crypto", geopolitics:"geopolitics", energy:"energy", tech:"tech",
  gold:"gold", culture:"culture", labor:"labor", regulation:"regulation",
  science:"science", venture:"venture", mining:"mining"
};
const URG_LABELS = { act:"🔴 Act Now", deep:"🔵 Deep", watch:"🟡 Watch" };
const URG_EMOJI = { act:"🔴", deep:"🔵", watch:"🟡" };

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function buildFilters(){
  const catCounts = {};
  ITEMS.forEach(i=>{ catCounts[i.cat] = (catCounts[i.cat]||0)+1; });
  const catWrap = document.getElementById('catFilters');
  let html = '<button class="pill active" data-cat="all" onclick="setCat(\'all\')">All <span class="cnt">'+ITEMS.length+'</span></button>';
  Object.keys(catCounts).forEach(function(c){
    html += '<button class="pill" data-cat="'+c+'" onclick="setCat(\''+c+'\')">'+esc(CAT_LABELS[c]||c)+' <span class="cnt">'+catCounts[c]+'</span></button>';
  });
  catWrap.innerHTML = html;

  const urgCounts = {act:0,deep:0,watch:0};
  ITEMS.forEach(function(i){ urgCounts[i.urgency]++; });
  const urgWrap = document.getElementById('urgFilters');
  let uhtml = '<button class="pill active" data-urg="all" onclick="setUrg(\'all\')">All <span class="cnt">'+ITEMS.length+'</span></button>';
  ['act','deep','watch'].forEach(function(u){
    uhtml += '<button class="pill" data-urg="'+u+'" onclick="setUrg(\''+u+'\')">'+URG_LABELS[u]+' <span class="cnt">'+urgCounts[u]+'</span></button>';
  });
  urgWrap.innerHTML = uhtml;
}

function styleActivePills(){
  document.querySelectorAll('#catFilters .pill').forEach(function(p){
    const c = p.getAttribute('data-cat');
    if(c===activeCat){ p.classList.add('active'); p.style.background = c==='all' ? '#333' : CAT_COLORS[c]; p.style.borderColor='transparent'; }
    else { p.classList.remove('active'); p.style.background=''; p.style.borderColor=''; }
  });
  document.querySelectorAll('#urgFilters .pill').forEach(function(p){
    const u = p.getAttribute('data-urg');
    if(u===activeUrg){ p.classList.add('active'); p.style.background = '#333'; p.style.borderColor='transparent'; }
    else { p.classList.remove('active'); p.style.background=''; p.style.borderColor=''; }
  });
}

function setCat(c){ activeCat = c; activeSrc = null; render(); }
function setUrg(u){ activeUrg = u; activeSrc = null; render(); }
function filterBySrc(name){
  activeCat = "all"; activeUrg = "all"; activeSrc = name;
  render();
  document.querySelectorAll('.card').forEach(function(el){
    const id = parseInt(el.getAttribute('data-id'),10);
    const item = ITEMS.find(function(i){return i.id===id;});
    if(item && item.source.indexOf(name) !== -1){
      const body = el.querySelector('.card-body');
      if(body) body.classList.add('open');
    }
  });
}

function cardHtml(item){
  const color = CAT_COLORS[item.cat] || "#888";
  const chartFlag = item.charts.hot ? "🔥" : (item.charts.count>0 ? "📊" : "");
  let html = '<div class="card" data-id="'+item.id+'">';
  html += '<div class="card-head" onclick="toggleCard('+item.id+')">';
  html += '<span class="idx">'+String(item.id).padStart(2,'0')+'</span>';
  html += '<span class="urg">'+URG_EMOJI[item.urgency]+'</span>';
  html += '<span class="badge" style="background:'+color+'">'+esc(item.source.split(' (')[0])+'</span>';
  html += '<span class="cattag">'+esc(CAT_LABELS[item.cat]||item.cat)+'</span>';
  if(chartFlag) html += '<span class="chartflag">'+chartFlag+'</span>';
  html += '<span class="title">'+esc(item.title)+'</span>';
  html += '</div>';
  html += '<div class="card-body" id="body-'+item.id+'">';
  html += '<div class="section-label">The Idea</div><div class="idea-text">'+esc(item.idea)+'</div>';
  html += '<div class="section-label">My Angle</div><div class="angle-box" style="border-left-color:'+color+';background:'+color+'12">'+esc(item.angle)+'</div>';
  html += '<div class="tweets">';
  html += '<div class="tweet"><div class="lbl" style="color:#378add">TWEET A</div><div class="txt">'+esc(item.tweetA)+'</div><button class="copy-btn" onclick="copyTweet('+item.id+',\'a\')">📋 Copy</button></div>';
  html += '<div class="tweet"><div class="lbl" style="color:#7f77dd">TWEET B</div><div class="txt">'+esc(item.tweetB)+'</div><button class="copy-btn" onclick="copyTweet('+item.id+',\'b\')">📋 Copy</button></div>';
  html += '</div>';
  html += '<div class="chartbox'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 ':'📊 ')+esc(item.charts.desc)+'</div>';
  html += '<div class="link-row"><a href="'+esc(item.link)+'" target="_blank" rel="noopener">↗ Read full article</a></div>';
  html += '</div></div>';
  return html;
}

function toggleCard(id){
  const body = document.getElementById('body-'+id);
  if(body) body.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function render(){
  styleActivePills();
  let list = ITEMS;
  if(activeSrc){
    list = list.filter(function(i){ return i.source.indexOf(activeSrc) !== -1; });
  } else {
    if(activeCat !== "all") list = list.filter(function(i){ return i.cat === activeCat; });
    if(activeUrg !== "all") list = list.filter(function(i){ return i.urgency === activeUrg; });
  }
  const wrap = document.getElementById('cards');
  const empty = document.getElementById('emptyState');
  if(list.length === 0){
    wrap.innerHTML = '';
    empty.hidden = false;
  } else {
    empty.hidden = true;
    wrap.innerHTML = list.map(cardHtml).join('');
  }
}

function buildReport(){
  let html = '<div><b>Time window:</b> '+esc(META.windowStart)+' → '+esc(META.windowEnd)+'</div>';
  html += '<div style="margin-top:6px;"><b>Emails in window:</b> '+META.emailsInWindow+' &nbsp;|&nbsp; <b>Emails read:</b> '+META.emailsRead+' &nbsp;|&nbsp; <b>Items extracted:</b> '+META.itemsExtracted+'</div>';
  html += '<div style="margin-top:12px;"><b>Included sources</b> (click a name to filter):</div>';
  html += '<div style="margin-top:4px;">';
  META.includedSources.forEach(function(s,idx){
    html += '<span class="srcline" onclick="filterBySrc(\''+esc(s.name).replace(/'/g,"\\'")+'\')">'+esc(s.name)+'</span> ('+s.count+')';
    if(idx < META.includedSources.length-1) html += ' &nbsp;·&nbsp; ';
  });
  html += '</div>';
  html += '<div style="margin-top:12px;"><b>Skipped sources</b>:</div>';
  html += '<div style="margin-top:4px;">';
  META.skippedSources.forEach(function(s){
    html += '<div style="margin:2px 0;">'+esc(s.name)+' — '+esc(s.reason)+'</div>';
  });
  html += '</div>';
  document.getElementById('reportBody').innerHTML = html;
}

document.getElementById('metaLine').textContent =
  META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources (last 6 hours)';

buildFilters();
render();
buildReport();
</script>
