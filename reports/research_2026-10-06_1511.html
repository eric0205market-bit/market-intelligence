const ITEMS = [{"id": 1, "cat": "macro", "urgency": "act", "source": "Bespoke Investment Group", "title": "Futures up on 10y 5.27% and WTI $87 — while EU data missed across the board", "idea": "S&P futures +0.5%, Nasdaq +0.65% as the 10y slips to 5.27% and WTI falls 2.7% to $87. Gold +1%, BTC above $86K. Europe rallies (STOXX 600 +0.7%) despite weaker Eurozone retail sales, German factory orders down more than expected, and French IP -0.3%. China is shut for a week-long holiday; Fed speakers Williams, Bowman, Logan today.", "angle": "Bad macro data plus lower yields equals rally: bad news is good news again because it caps the term-premium story. Williams/Bowman/Logan today will test whether the Fed endorses that.", "tweetA": "Europe printed weak retail sales, weak German orders and a French IP miss, and the STOXX still closed up 0.7%. The market isn't trading growth, it's trading the 10y. Whoever gets the 10y wrong this week gets everything wrong.", "tweetB": "Oil -2.7%, gold +1%, BTC up, 10y down 3bp. That's the pattern of a day when real yields are the only factor in the model. Williams, Bowman and Logan are speaking into it.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bespokeinvest.substack.com/p/morning-market-note-not-all-trillion"}, {"id": 2, "cat": "positioning", "urgency": "deep", "source": "Bespoke Investment Group", "title": "Only 4 of 13 trillion-dollar stocks are beating the S&P YTD", "idea": "Bespoke's Trend Analyzer snapshot shows just 4 of the 13 members of the $1T club outperforming the S&P 500 YTD, and fewer than half are up double digits. TSLA is the only one negative YTD. Over the last week 8 of 13 outperformed and 7 are overbought, so 5 lagged and 6 aren't overbought.", "angle": "The 'megacaps carry the index' narrative is a last-two-weeks story, not a YTD one. It matters for any tweet about concentration risk.", "tweetA": "Everyone says megacaps are carrying the index. YTD, 9 of the 13 trillion-dollar stocks are behind the S&P. Concentration is real; leadership is narrower than the headline.", "tweetB": "The $1T club is getting crowded (13 names) and most of the members are lagging the index they sit in. The part that's really concentrated is the top 4. Nobody is asking what the other 9 are telling you.", "charts": {"count": 1, "hot": true, "desc": "Bespoke Trend Analyzer table of the 13 $1T stocks: YTD, 1-week performance and position in trading range"}, "link": "https://bespokeinvest.substack.com/p/morning-market-note-not-all-trillion"}, {"id": 3, "cat": "geopolitics", "urgency": "deep", "source": "Danny Dayan / Macro Themes", "title": "Nationalism is repricing Europe: OATs +140bp in 3 months, spread to Bunds at 2011 levels", "idea": "Dayan frames Trump-era nationalism (lower immigration, tariffs, a weaker-dollar preference, allies funding their own defense) as hitting Europe hardest. 10y OATs are up 140bp in three months and not on growth. French spreads vs Germany are back to 2011 euro-crisis peaks. The US even floated a diesel export ban before a coordinated diesel SPR release.", "angle": "Diesel export ban is the detail I'd remember: the signal to Europe was 'US first' on molecules, not just on tariffs. Pairs well with the French debt items below.", "tweetA": "France's 10y is +140bp in three months with no growth upgrade behind it, and the spread to Germany is back to 2011. The US floated a diesel export ban for a few days. Europe saw what 'allies' means when molecules get scarce.", "tweetB": "Two things hit Europe in the same quarter: higher funding costs and a US that nearly closed the diesel tap. That's a bigger story than any Eurozone PMI. $EWQ $FXE", "charts": {"count": 1, "hot": false, "desc": "Chart(s): French 10y OAT yield and OAT-Bund spread vs 2011 peak"}, "link": "https://dannydayan.substack.com/p/nationalism"}, {"id": 4, "cat": "positioning", "urgency": "deep", "source": "Dark Side of the Boom (Goldman recaps)", "title": "Goldman's Quinn: $63.7bn of non-dealer S&P futures sold in six weeks, and it's not over", "idea": "Quinn's CoT work shows about $63.7bn of non-dealer S&P futures selling over six weeks, mostly asset-manager long liquidation rather than new shorts. A 25bp rise in 10y real yields coincided with the exposure cut. A soft PCE, dovish Fed and weak payrolls lifted the cash index, but net asset-manager positioning is still historically elevated, so Goldman's read is that selling fades only when yields reverse.", "angle": "Cash index bounce on soft data, futures still bleeding: that's the divergence I'd trade around. The release valve is real yields, not payrolls.", "tweetA": "S&P at record-ish levels while asset managers have sold $63.7bn of futures in six weeks. That's not a bear market, it's a handoff: real money out, something else bidding. I'd like to know what.", "tweetB": "A 25bp move in real yields did what a soft PCE and weak payrolls couldn't undo. If the whole positioning overhang hangs on one number, that's the number to watch, not the data calendar. $SPY $TLT", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/goldmans-robert-quinn-the-s-and-p"}, {"id": 5, "cat": "macro", "urgency": "deep", "source": "The Market House / Mish Schneider", "title": "Mish: breadth is the problem, TLT 77.50 is the line, long end '5.6%' is normal", "idea": "Nasdaq at a record, but Mish flags a 'frightening' share of stocks below their 50-day averages. 10y 5.27%, 20y 5.6%, 30y 5.63%. Her TLT trigger: hold today's low, close above today's high and above Friday's close near 77.50, then take a shot, but 'you're picking a bottom in a big bear market.' Her view that 5%-plus yields are 'pretty normal'. XRT is struggling on weak consumer confidence (Nike, Lululemon). Semis and biotech carried the market.", "angle": "A defined, tradeable TLT level from a trader, not a macro tourist. Her 'not all the reasons for higher yields have gone away' is the reason to size small.", "tweetA": "Nasdaq record high, most stocks under their 50-day, 30y at 5.63%. Mish is watching TLT 77.50 for a bottom and calling it 'a bottom in a big bear market.' When the person who wants to buy says that, size the trade accordingly.", "tweetB": "Semis and biotech carried the market while retail (XRT) fell on weak confidence. That's two different economies in one index. Whatever the 30y does next, only one of them benefits. $XRT $SMH $TLT", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://themarkethouse.substack.com/p/mish-schneider-how-to-trade-the-axles"}, {"id": 6, "cat": "AI/infra", "urgency": "deep", "source": "The Market House / Mish Schneider", "title": "'Axles and chassis' of AI: nuclear, nat gas pipelines, robot actuators, rare earths", "idea": "Mish's lens: buy what holds the AI car up. Nuclear is beaten up (CEG chopping $240–$300, SMR buy near $8.25, OKLO, CCJ). Nat gas pipelines have a bottleneck (Kinder Morgan, Williams, fuel cells). Robotics: actuators via Timken (TKR broke out over $120) and Moog (MOG.A), plus rare earths (USAR possible double bottom). She is also long IBIT with an exit at $47.50.", "angle": "A useful second-derivative list: power, pipes, actuators, magnets. All of these are supply-constrained rather than demand-constrained.", "tweetA": "Everyone's buying the GPU. Mish is buying the actuator, the pipeline and the reactor. A humanoid robot is mostly joints and magnets, and Timken just broke $120. $TKR $MOG.A $USAR", "tweetB": "Nuclear names are down while AI power demand is the consensus theme. When the consensus trade is down, it's usually because the market is pricing financing and timing, not demand. $CEG $SMR $CCJ $OKLO", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://themarkethouse.substack.com/p/mish-schneider-how-to-trade-the-axles"}, {"id": 7, "cat": "crypto", "urgency": "deep", "source": "The Market House / Mish Schneider", "title": "Mish on BTC: 83–86k is 'a gift'; China ADRs gapped up; stablecoins 'still in infancy'", "idea": "BTC trading between 83k and 86k gives a clean risk/reward: a breakout targets 100k, wrong costs little. Long IBIT, out below $47.50. BABA is -30% YTD but held support at 105 and gapped up; FXI also gapped. Amazon near $250 is a buy if XRT clears $83.", "angle": "Tight range plus a clear invalidation level, plus China ADRs gapping while mainland is shut for a holiday.", "tweetA": "BTC in an 83–86k box, a breakout goes to 100k, a failure costs 3%. That asymmetry is why I'm not interested in debating macro for crypto this week. $IBIT", "tweetB": "BABA and FXI gapped up while China was on holiday. The offshore market is trading China before onshore opens. Look at what they do when Shanghai returns. $BABA $FXI", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://themarkethouse.substack.com/p/mish-schneider-how-to-trade-the-axles"}, {"id": 8, "cat": "regulation", "urgency": "act", "source": "Unchained", "title": "CFTC opens comment on Regulation CTX and CAM, its first crypto rules; spot is excluded", "idea": "The CFTC proposed Regulation CTX and CAM for retail crypto trades made on a margined, leveraged or financed basis, not plain spot BTC/ETH. 60-day comment period. Includes proof-of-reserves for exchanges that pool customer assets and listing reviews that weigh token concentration and vesting. It follows the Clarity Act stalling in the Senate on Sept. 15; chair Selig: 'we must do what we can.'", "angle": "Regulators building the framework Congress failed to pass. Leverage is the hook, which is exactly where perps live.", "tweetA": "Congress couldn't pass the Clarity Act, so the CFTC is writing the rulebook itself, and it's scoped to leveraged trades. The first crypto regulation in the US is a perps regulation. $COIN $HOOD", "tweetB": "Proof-of-reserves and listing standards that weigh token concentration and vesting. A rule that tells you which tokens an exchange is allowed to list will matter more to alts than any ETF approval.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/the-cftc-opens-crypto-rules-to-comment"}, {"id": 9, "cat": "regulation", "urgency": "act", "source": "Lucky Trader / Morning Minute", "title": "CFTC plan reads as the onshore perps door: Robinhood perps, Coinbase single-stock perps, Kraken-Hyperliquid talks", "idea": "Lucky Trader's take: a federal exchange license, with leverage determining who needs one, even a fully paid trade could count if the exchange mentions leverage and holds your crypto. Licensed entities could match, custody, settle and lend, with leverage only via AML-regulated brokers. The notice calls Biden-era cases against Kraken, Ooki and Uniswap 'regulation by enforcement.' Robinhood just announced US crypto perps, Coinbase filed for single-stock perps, Kraken's parent is negotiating with Hyperliquid.", "angle": "Different angle from Unchained: the commercial read, who needs this door and why. Three firms already queuing.", "tweetA": "Robinhood announced US crypto perps. Coinbase filed for single-stock perps. Kraken's parent is talking to Hyperliquid. All three need a federal license that didn't exist last week. The comment period is the trade. $HOOD $COIN", "tweetB": "A federal license means compliance costs, and 'some products won't survive them.' The bull case is onshore perps. The bear case is who pays for the compliance. Hint: it's not Coinbase.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/the-cftc-reveals-plan-to-regulate"}, {"id": 10, "cat": "regulation", "urgency": "deep", "source": "Unchained", "title": "FinCEN withdraws its mixer and unhosted-wallet rules", "idea": "FinCEN is withdrawing two proposed rules: the 2023 mixer reporting rule (wallet and IP addresses on mixing-linked transactions with a foreign nexus) and the Dec 2020 unhosted-wallet rule (transactions above $10,000). The mixer notice cites a White House crypto report backing the ability to 'privately transact.' Coin Center called it a 'significant victory for financial privacy.' FinCEN says it may act on criminals later.", "angle": "Same week: licensing for exchanges, surveillance rollbacks for self-custody. Regulatory split between on- and off-ramps.", "tweetA": "Same week the CFTC licenses exchanges, FinCEN drops the rules that would have tracked self-custody wallets. US policy is: regulate the venues, leave the wallets alone. $COIN, but also $ZEC at $1,360.", "tweetB": "The unhosted-wallet rule was written in December 2020 and withdrawn in October 2026. It took six years for the privacy argument to win. Self-custody is now the policy default.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/the-cftc-opens-crypto-rules-to-comment"}, {"id": 11, "cat": "crypto", "urgency": "deep", "source": "Unchained", "title": "Treasury companies: Strategy +$20.9bn Q3 gain, buys only 334 BTC; Metaplanet sells 10k, rebuys 11k to chase a credit rating", "idea": "Strategy expects a $20.91bn Q3 gain on bitcoin, flipping a $8.32bn Q2 loss; carrying value $70.82bn vs $49.67bn, a $4.12bn tax benefit from releasing the valuation allowance. It bought only 334 BTC ($28.7M), the smallest of three straight weekly buys, while repurchasing $176.3M of STRC preferred near $99.39. Holdings 848,000 BTC. Metaplanet sold 10,000 BTC and bought back 11,000 at ~9% higher to show agencies it can turn BTC into cash. Strive added 2,000 BTC with a $500M SATA buyback.", "angle": "Treasury companies are shifting from buying BTC to defending preferred stock. Buybacks of preferred outspent BTC purchases 6x.", "tweetA": "Strategy spent $176M buying back preferred and $28.7M buying bitcoin. That's 6x more on defending the capital structure than on the thesis. Metaplanet is paying 9% more to prove it can sell. $MSTR", "tweetB": "Metaplanet sold 10k BTC and bought back 11k at ~9% higher, to demonstrate liquidity to a rating agency. The cost of getting a credit rating on a bitcoin balance sheet is about 9% of the position. Worth knowing.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/the-cftc-opens-crypto-rules-to-comment"}, {"id": 12, "cat": "crypto", "urgency": "watch", "source": "Unchained", "title": "Bitmine's ETH buying slows for a second week: 15,112 vs 17,362; 4.9% of supply, 89k short of 5%", "idea": "Bitmine added 15,112 ETH in the week to Oct 4, down from 17,362, holding 6.02M ETH (about 4.9% of supply, ~$16.4B per Lucky Trader) and about 89,000 ETH short of its 5% target. ETH ETFs saw $51M of outflows Monday and BTC ETFs $90M.", "angle": "The biggest marginal ETH buyer is about to hit its goal. What replaces it?", "tweetA": "Bitmine is 89,000 ETH from its 5% target. Once it finishes, the largest marginal buyer of ETH disappears. Is there a second one? $ETH $BMNR", "tweetB": "ETH ETFs bled $51M and BTC ETFs $90M on Monday while treasury companies kept slowing. Corporate treasuries and ETFs both fading in the same week is not a coincidence.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/the-cftc-reveals-plan-to-regulate"}, {"id": 13, "cat": "crypto", "urgency": "deep", "source": "Unchained", "title": "Stablecoin rails: Stripe cards to 100+ countries, $1.2B/month (3x YoY); Visa: 46% would use, 6% understand", "idea": "Stripe plans stablecoin cards in 100+ countries by year-end; spending is about $1.2B a month, roughly triple a year ago. Visa surveyed 14,250 APAC consumers: 46% likely to use stablecoins within five years, only 6% accurately understand them. Payward (Kraken) partnered with Singapore Gulf Bank for 24/7 settlement via SGB Net.", "angle": "Distribution is arriving before understanding. Card spend is the adoption metric that actually counts.", "tweetA": "$1.2B a month on stablecoin cards, 3x in a year. Visa says 46% of APAC consumers will use them and 6% know how they work. Adoption is going to run far ahead of comprehension. $V $MA", "tweetB": "Stripe, Bridge and Privy together: the payments company bought both the issuance and the wallet layer. $1.2B/month is small next to Visa, but triple a year ago is the curve to watch.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/the-cftc-opens-crypto-rules-to-comment"}, {"id": 14, "cat": "crypto", "urgency": "watch", "source": "Unchained", "title": "Ethereum Glamsterdam: 200M gas limit test (from 60M); Polymarket V2 switches Nov 2", "idea": "Prysm shipped a last-minute fix so Sepolia validators move to a 200M gas limit, from 60M, when Glamsterdam activates on the testnet Tuesday. Polymarket Protocol V2: single token backed by pUSD, multi-chain bridging, combinatorial markets; canary markets to Oct 30, full switch Nov 2. Lucky Trader adds the first transaction spanning L1 and an L2 atomically under the Ethereum Economic Zone framework.", "angle": "3.3x gas capacity on L1 and atomic L1/L2 transactions. The 'dozens of networks feel like separate places' problem being addressed.", "tweetA": "Ethereum is testing a 200M gas limit, up from 60M. That's 3.3x block capacity on L1, in the same week the first atomic L1/L2 transaction ran. The scaling-by-fragmentation thesis is being quietly replaced. $ETH", "tweetB": "Polymarket moves to one collateral token (pUSD), UMA plus Chainlink settlement, combinatorial markets. Prediction markets are rebuilding as exchange infrastructure, not just a betting UI.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/the-cftc-opens-crypto-rules-to-comment"}, {"id": 15, "cat": "regulation", "urgency": "watch", "source": "Lucky Trader / Morning Minute", "title": "SEC clears 3x levered funds on BTC, ETH, gold, silver, oil and gas", "idea": "The SEC approved six funds tripling the daily move of Bitcoin, Ethereum, gold, silver, oil and gas, after clearing a Cboe rule change on Oct 2.", "angle": "Levered products at the retail door right as BTC is flat in a range and oil is pinned by a geopolitical premium.", "tweetA": "3x ETH, 3x gold, 3x oil, 3x gas, approved in one go. Retail gets to lever the commodities that moved most this year. Ask yourself what the issuers expect volatility to do.", "tweetB": "Six 3x funds cleared in a single rule change. The ETF wrapper keeps absorbing everything. At what point does 'daily reset 3x oil' become a flow factor in the underlying?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/the-cftc-reveals-plan-to-regulate"}, {"id": 16, "cat": "AI/infra", "urgency": "deep", "source": "Lucky Trader / Morning Minute", "title": "OKX: AI does the main work on ~95% of code changes; $10M monthly bill to model providers", "idea": "OKX says AI now does the main work on about 95% of its code changes, with engineers reviewing and approving. Founder Star Xu said the company's bill to AI model providers hit $10 million last month.", "angle": "A concrete data point on engineering leverage and model spend, from a company with real production risk.", "tweetA": "OKX: AI writes 95% of code changes, bill is $10M a month. For a custody-grade exchange, that's cheaper than the engineering headcount it replaces, and it also puts model vendors in the critical path for exchange security.", "tweetB": "$10M a month to model providers from one crypto exchange. Now multiply by every software company doing the same. Model spend is becoming a line item at every software shop.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/the-cftc-reveals-plan-to-regulate"}, {"id": 17, "cat": "crypto", "urgency": "watch", "source": "Lucky Trader / Morning Minute", "title": "OKX and NYSE's parent list 60+ tokenized stocks, backed 1:1, bought with stablecoins from a pool", "idea": "OKX and the NYSE's parent listed 60+ stocks to put onchain, including NVDA, TSLA, AAPL, MSFT, AMZN, GOOGL. Each token is backed one-for-one by a real share held at a broker; users buy with stablecoins from a pool rather than via an order book.", "angle": "Tokenized equities with the exchange operator's name on them. Pool-based pricing instead of an order book is the interesting structure choice.", "tweetA": "NYSE's parent is listing tokenized NVDA and TSLA on a crypto exchange. The 24/7 equity market just got a real incumbent behind it, and it's settled in stablecoins. $ICE", "tweetB": "Buying tokenized Nvidia from a stablecoin pool instead of an order book. Who is the counterparty when the underlying market is closed and the pool is mispriced?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/the-cftc-reveals-plan-to-regulate"}, {"id": 18, "cat": "geopolitics", "urgency": "deep", "source": "Lucky Trader / Morning Minute", "title": "ZachXBT spent $349,700 posing as a client of a Chinese crime ring laundering for Lazarus", "idea": "ZachXBT paid $349,700 of his own money to pose as a client of a Chinese organized crime ring laundering for North Korea, losing 5% on every order, sat on the story 18 months while the case was live. The intel helped freeze Bybit hack funds including $442,000 in Tether.", "angle": "The cost of laundering is a 5% haircut, and an investigator can infiltrate it. State-sponsored hack proceeds run through commercial Chinese crime networks.", "tweetA": "Laundering North Korean hack proceeds through a Chinese syndicate cost its clients 5% per order. That's the market price of washing stolen crypto. It's also the number any stablecoin issuer's compliance team should be benchmarking against.", "tweetB": "He kept the story for 18 months while the case was live. The freeze recovered $442,000 in Tether, small next to the Bybit hack. Intelligence is easy to get and hard to convert into recoveries.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/the-cftc-reveals-plan-to-regulate"}, {"id": 19, "cat": "science", "urgency": "act", "source": "Peter Frankopan / Global Threads", "title": "Russian anti-plague lab researcher dies; 197 contacts traced, 5 hospitals reportedly quarantined", "idea": "A 28-year-old researcher at the Irkutsk Anti-Plague Institute died Oct 2 of 'pneumonia of unknown aetiology'; a regional outlet reports she broke a tube of pneumonic plague agent on Sept 25 (unconfirmed). 197 contacts identified, 189 under observation or prophylaxis; reports of FSB escorts and quarantine at several hospitals, which Rospotrebnadzor denies. Frankopan: no evidence of engineering or resistance, but sequencing hasn't been published. Trump: 'things that used to work on pneumonia don't work as well anymore.'", "angle": "Low-probability, high-consequence. The tell is what Russia doesn't publish: no genome.", "tweetA": "Russia has traced 197 contacts, quarantined hospitals and hasn't named the pathogen. Frankopan's point: if it's ordinary plague, sequencing is a two-day job. Silence is the signal. $SIGA", "tweetB": "The Irkutsk lab holds both natural and 'genetically altered' strains. A lab accident wouldn't normally need 197 contacts and FSB escorts. Nothing proven, but the response is the data point.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://peterfrankopan.substack.com/p/plague-in-russia-a-warning"}, {"id": 20, "cat": "macro", "urgency": "deep", "source": "Compounding Quality", "title": "Serial acquirers: TerraVest's HVAC & containment revenue +83% on data-center fuel and water tanks", "idea": "TerraVest ($TVK) has compounded at 31.6% since its 2012 IPO as a disciplined acquirer. Its HVAC & Containment segment, which includes storage tanks, grew revenue 83% YoY last quarter, mostly from data centers needing tanks for backup-generator fuel and cooling water.", "angle": "A propane tank maker becomes an AI infrastructure supplier. The picks-and-shovels list keeps widening into boring industrials.", "tweetA": "A propane-tank maker grew a segment 83% because data centers need diesel storage for backup generators. Nobody has 'fuel tanks' in the AI capex model. $TVK", "tweetB": "Backup fuel and cooling water have to be stored somewhere, and the tanks are built by companies few cover. The AI capex number is bigger than the GPU line.", "charts": {"count": 1, "hot": false, "desc": "Charts in the article: acquirer financials; worth opening"}, "link": "https://www.compoundingquality.net/p/6-serial-acquirers-for-the-serial"}, {"id": 21, "cat": "macro", "urgency": "watch", "source": "Compounding Quality", "title": "Lindbergh: 20% of European homes have AC vs ~90% in the US; 13,000 HVAC roll-up targets", "idea": "After Europe's hottest summers, only 20% of European homes have air conditioning (The Times) vs about 90% in the US. The European HVAC market is forecast to grow 7.3% a year to 2035. Lindbergh ($LDB), an Italian HVAC serial acquirer backed by Abdiel and Will Thorndike's Sun Mountain, has 13 HVAC subsidiaries and has identified 13,000+ small targets.", "angle": "A climate-adaptation adoption curve with a roll-up business model attached.", "tweetA": "20% of European homes have AC. The US is at 90%. Add the hottest summers on record and a 13,000-company fragmented installer base. That's what a roll-up looks like in a climate-adaptation market. $LDB", "tweetB": "Europe is going to install AC whether it likes it or not, on a grid that already struggles with demand. HVAC is power demand growth that isn't in anyone's utility forecast.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.compoundingquality.net/p/6-serial-acquirers-for-the-serial"}, {"id": 22, "cat": "geopolitics", "urgency": "watch", "source": "Compounding Quality", "title": "Tasmea: Australia's remote-industrial maintenance roll-up aims to double in FY27", "idea": "Australia has 28M people, 11.5M outside the four big cities, across a landmass near US size. Tasmea buys critical maintenance service firms near mines and remote plants where downtime costs millions a day, with less competition due to remoteness (including a drone-inspection subsidiary). Guidance is to double in FY2027, with regular share issuance funding acquisitions.", "angle": "Remoteness as a moat. Per-share growth is lower than headline because of dilution.", "tweetA": "Tasmea's moat is geography: Perth to Cairns is Lisbon to Moscow, with 28M people instead of 750M. Mine outages cost millions a day, so remote maintenance is priced on uptime, not on price. $TEA", "tweetB": "Doubling in FY27 sounds extraordinary until you see how it's funded: share issuance for acquisitions. Roll-up growth and per-share growth are different numbers.", "charts": {"count": 2, "hot": false, "desc": "Financials and share count chart in article"}, "link": "https://www.compoundingquality.net/p/6-serial-acquirers-for-the-serial"}, {"id": 23, "cat": "macro", "urgency": "act", "source": "David Rosenberg / Early Morning with Dave", "title": "Bond relief: Italy -11bp to 4.52%, France -10bp to 4.76%, UK -6bp to 5.36%; WTI $89.40", "idea": "Global equities open green as WTI falls about 1% to $89.40 and bonds rally, notably Italy -11bp to 4.52%, France -10bp to 4.76%, UK -6bp to 5.36%. The piece frames it as mega-cap tech driving global gains, with short-covering offering a respite from rising yields.", "angle": "Italy at 4.52% and France at 4.76% means the French-Italian gap is only 24bp. Look at the UK at 5.36%, higher than both.", "tweetA": "UK 10y 5.36%. France 4.76%. Italy 4.52%. The UK is paying 60bp more than France, the country everyone's calling Europe's weakest link. $EWU $FXB", "tweetB": "Short-covering plus oil -1% is the entire rally. Rosenberg calls it a 'respite', not a turn. A one-day -10bp in OATs doesn't undo +140bp in three months.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.earlymorningwithdave.com/p/global-equity-markets-ignited-by"}, {"id": 24, "cat": "macro", "urgency": "deep", "source": "Peter Boockvar", "title": "'ECB, SOS!': half of OATs are foreign-owned, ~1/3 of US, UK, German, Italian debt; French debt service +59% by 2030", "idea": "Boockvar: foreigners own about half of the OAT market and about a third of tradeable US/UK/German/Italian debt, so domestic savings can't absorb supply, unlike Japan where JGBs are held by Japanese savers, institutions and the BoJ. French finance ministry estimates debt-servicing cost +59% by 2030. WSJ calls France's 'magic money' a debt bomb; Boockvar's contrarian read is a short-term top in French yields.", "angle": "Foreign ownership share is the variable. Boockvar flags the short-term top call while stating the structural problem.", "tweetA": "Half of French government bonds are foreign-owned. Japan's are domestic. When the marginal buyer is abroad, your yield is set by someone else's alternatives. That's the real France story, and it's not about the budget. $EWQ", "tweetB": "France's debt service is projected +59% by 2030. And Boockvar still thinks French yields are near a short-term top. Both can be true. Be careful with the 'short term'.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://peterboockvar.substack.com/p/ecb-sos"}, {"id": 25, "cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom (Goldman recaps)", "title": "'Higher yields don't mean what they used to': correlation discovery, and the dollar moving to AI exceptionalism", "idea": "Citing Bloomberg's Karamanis: this is correlation discovery, not just price discovery. Higher yields can signal growth, fiscal stress, supply pressure or term premium, and in FX higher local yields can weaken a currency when read as sovereign-risk compensation. French and Italian yields rising for non-growth reasons; the US may be entering the same regime, and the dollar may be shifting from growth exceptionalism to AI exceptionalism.", "angle": "Rate differentials have stopped predicting FX. Capital follows tech earnings and capex.", "tweetA": "Higher yields used to mean a stronger currency. In France, Italy and possibly the US, higher yields now mean weaker currency, because they're compensation for risk. The rate-differential model is broken for sovereigns with fiscal problems. $DXY $EURUSD", "tweetB": "If the dollar is an AI trade now, then Nvidia earnings are an FX event. I can't quite believe I'm writing that. $UUP $NVDA", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/fx-daily-higher-bond-yields-dont"}, {"id": 26, "cat": "macro", "urgency": "act", "source": "Danielle DiMartino Booth / QI Research", "title": "ISM Services Prices Paid at 74.0, third straight rise; no industry reported price declines in 9 months", "idea": "September ISM Services Prices Paid rose to 74.0, a third straight monthly gain; readings at or above 74 have occurred just 7% of the time since 1997, rivaled only by COVID, the Great Recession and Hurricane Katrina. Over 2026's first nine months no industry reported price declines, a record for any year. Even garage doors are going up.", "angle": "Services inflation, the part the Fed can't blame on oil. Pairs with the weak payroll and soft PCE narrative.", "tweetA": "ISM Services Prices Paid at 74.0. Only 7% of readings since 1997 are this high, and the others were COVID, 2008 and Katrina. Meanwhile the market is celebrating a soft PCE. $TLT", "tweetB": "No industry has reported price declines for nine months straight, a record. Core PCE can be soft because of how it's measured, but the survey says breadth of pricing is at an extreme.", "charts": {"count": 1, "hot": true, "desc": "ISM Services Prices Paid (orange) with 74.0 reading and 7% frequency vs history"}, "link": "https://dimartinobooth.substack.com/p/the-daily-feather-the-boss-bear"}, {"id": 27, "cat": "geopolitics", "urgency": "deep", "source": "Dark Side of the Boom (Goldman recaps)", "title": "Goldman's Blaze: Brent options 'pay for peace and give away escalation', after seven months of conflict", "idea": "Brent puts are expensive and calls have cheapened back toward pre-war levels, with the upside tail 'strangely underinsured' even with a geopolitical premium. Blaze: macro portfolios buy crude as a hedge against rates pain, and the oil-yields correlation hit decades-rare extremes before starting to fracture. Dealers' put demand makes vol behave like equities (rising when spot falls). Trade: call wings or spreads for upside, put spreads for peace.", "angle": "Oil is being used as a rates hedge. That changes how to read both a drop in Brent and a move in yields.", "tweetA": "Seven months into a conflict over Hormuz and the cheapest thing in the Brent options market is upside. Oil has become a rates hedge, not a supply hedge. Calls are priced like peace is guaranteed. $XLE $USO", "tweetB": "Brent vol rises when spot falls, like equities. That's not how commodity vol behaves with an unresolved supply shock. Goldman's trade is call spreads. I'd want to know who is on the other side.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/goldmans-isabel-blaze-the-options"}, {"id": 28, "cat": "macro", "urgency": "watch", "source": "Hardfork / BowtiedBull", "title": "History rhymes: 1970s vs 2020s — AI replaces workers, so no wage/price spiral", "idea": "Compares now to the 1970s. Differences: top 1% wealth is ~$14M each so gas prices don't hurt; no wage-price spiral because firms replace workers with technology rather than raise pay; oil is a much smaller share of the economy (domestic production, EVs, alternatives). Positioning: oil/utilities won't repeat as home runs; luxury real estate safest; tech should do better than in the 1970s; bonds un-investable; wages lag inflation; 'printing money is where the incentive is.'", "angle": "AI as the thing that breaks the 1970s wage-price loop: capital substitutes for labor when costs rise.", "tweetA": "The 1970s wage-price spiral needed workers to have bargaining power. In 2026 a firm facing higher costs can buy software instead of raising pay. Stagflation without the wages part is a very different regime. $TLT", "tweetB": "1970s: farmland and oil. 2020s: the argument is luxury real estate and tech. And 'bonds are un-investable again' with the 30y at 5.63%. Somebody should check whether that's already in the price.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://hardfork.substack.com/p/history-rhymes-learning-from-the"}, {"id": 29, "cat": "macro", "urgency": "deep", "source": "Trading Mindset and Data (TMAD)", "title": "Stocks bet on growth, bonds on inflation: record share of S&P stocks have Buy ratings; trend followers most short bonds ever", "idea": "TMAD: a record share of S&P 500 stocks carry analyst Buy ratings while trend-followers are the most short government bonds on record. Core inflation is about 2.4%, yet the Fed raised rates and may again; fuel prices have jumped since the Iran strikes, acting like a tax. TMAD's view: bonds likely rally; a 30y over 5.6% vs core 2.4% looks attractive if a slowdown starts. Risks: AI spending, another oil spike. Watch jobs, inflation, the late-October Fed.", "angle": "Record bullish sell-side and record short bonds in the same tape. Both can't be right, and the CTA bond short is a squeeze set-up.", "tweetA": "Record share of S&P stocks with a Buy rating. Trend followers at their record short in government bonds. One of these is the most crowded trade in the market, and the 30y at 5.6% with core at 2.4% tells you which. $TLT $SPY", "tweetB": "Fed hiked with core inflation at 2.4% and an oil shock on top. Policy tightening into a fuel tax is how oil spikes have ended cycles before. The question is whether the 30y finds a bid before equities notice.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.tmad.news/p/tmad-spotlight-top-score-trades-on"}, {"id": 30, "cat": "macro", "urgency": "deep", "source": "Capital Wars / Michael Howell (CrossBorder Capital)", "title": "Global liquidity $196.6tr, record collateral multiplier; bond vol hasn't hit haircuts yet", "idea": "Headline global liquidity rose to US$196.6tr last week, helped by a record collateral multiplier despite the jump in bond volatility. Rising vol typically forces higher haircuts and drains liquidity, but this hasn't happened yet. Risk appetite is rotating out of Emerging Asia towards commodity producers and select developed markets.", "angle": "The title says it: vol hasn't hit the multiplier 'yet'. That's the risk. Liquidity is high because collateral is being re-used at record rates.", "tweetA": "Global liquidity at $196.6tr on a record collateral multiplier. Haircuts haven't responded to higher bond volatility yet. 'Yet' is doing a lot of work in that sentence. $SPY $BTC", "tweetB": "Risk appetite moving from EM Asia to commodity producers. That matches China on holiday, oil at $87, and gold above $4,180. The flows are telling you where the inflation hedge is.", "charts": {"count": 1, "hot": false, "desc": "Charts in the article: global liquidity and collateral multiplier"}, "link": "https://capitalwars.substack.com/p/global-liquidity-watch-weekly-update-683"}, {"id": 31, "cat": "geopolitics", "urgency": "deep", "source": "ChinaTalk / Jordan Schneider", "title": "ChinaTalk: for military AI, data is the bottleneck, not models — 'AI-ready data is a myth'", "idea": "Bharat Patel (Accenture Federal; ex-Army, MITRE): data will never be AI-ready; the use case dictates the data. Ukraine's autonomy comes from three years of collecting and labeling battlefield data; the US has no active collection strategy and data often gets deleted or dumped. Synthetic data needs representative real data first. Government should own the data pipeline and governance, with industry doing ~90% of the work.", "angle": "Data pipelines, not drones, as the defense-tech moat. A tangible procurement thesis.", "tweetA": "Ukraine's drones got autonomous because someone recorded and labeled three years of flights. The Pentagon deletes exercise data because storage is expensive. The data gap is a bigger gap than the hardware one. $PLTR", "tweetB": "Patel says industry should do ~90% of the work and the government should own the pipeline. That's a spec for who wins: integrators and data-labeling infrastructure, not the model labs. $ACN", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.chinatalk.media/p/data-is-the-hard-part"}, {"id": 32, "cat": "geopolitics", "urgency": "watch", "source": "ChinaTalk / Jordan Schneider", "title": "Adversarial AI on the battlefield: graffiti on a tank defeats a CV model; 80% accuracy may be 'good enough'", "idea": "Patel: spray-painting or camouflaging a target defeats a model that has never seen it; fake EM signals from a wagon of sensors can mimic a military movement. Poisoned open-source data ('being a jerk on Waze'). T&E can't be overdone: a model at ~80% may suffice because the enemy, environment and user also get a vote. Idea: separate AI (models/data) from software so cyber accreditation applies only to model updates.", "angle": "Decoupling model updates from software accreditation is a quiet regulatory change that would speed deployment.", "tweetA": "A can of spray paint beats a computer-vision targeting model that has never seen graffiti. Meanwhile, a wagon with sensors can fake an armored column. The next arms race is in the training set. $PLTR $AVAV", "tweetB": "The Pentagon is thinking about not re-accrediting an entire software stack when only the model changes. That's a tiny process change that determines whether models update weekly or yearly.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.chinatalk.media/p/data-is-the-hard-part"}, {"id": 33, "cat": "energy", "urgency": "act", "source": "Big Price Moves Explained", "title": "Nucor raises HRC to $1,230/st; steel stocks rally; Q3 EPS guide $5.55–5.65 vs ~$6.20 consensus", "idea": "Nucor raised its hot-rolled coil spot price $10 to $1,230 per short ton on Oct 5 and plans a $60/st plate hike; NUE +4.6%, CLF and STLD up. Q3 EPS guide $5.55–$5.65 vs Q2 adjusted $4.84 and $2.63 a year ago, but ~10% below the $6.20 consensus. Q2 included $130M of refunds and $0.20 Helion valuation benefit that won't recur. Earnings Oct 26.", "angle": "Tariff-protected pricing is the earnings driver, with stable volumes. Pricing, not demand.", "tweetA": "Nucor's guide is up 2x year over year on stable volumes. All of it is price, and the price is tariff-protected. A steel rally with no demand story is a policy trade. $NUE $CLF $STLD", "tweetB": "Nucor has raised HRC for another week at $1,230 while the guidance midpoint missed consensus by 10%. The market is buying the next number, not the last one. Oct 26 is the test.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-october-5-2026"}, {"id": 34, "cat": "venture", "urgency": "act", "source": "Big Price Moves Explained", "title": "Schneider buys PTC for $22.6bn ($205/share, +33%); CH Robinson buys RXO for $5.8bn and drops 11%", "idea": "Schneider Electric will acquire PTC (CAD, PLM, ALM, SLM) for $205/share in cash, ~$22.6bn equity, expects €250M cost synergies by year three and ~€800M revenue synergies; close expected Q3 2027. PTC +33.5% to $192.26. C.H. Robinson to buy RXO for $5.8bn in cash and stock, funded by debt and a bridge; $300M synergies; buybacks paused until leverage returns to 1.75–2.25x by YE2028. CHRW -10.9%, RXO +22%.", "angle": "Industrial hardware buying industrial software at a 'discount to where it traded earlier'. Compare with the reaction to the acquirer.", "tweetA": "Schneider is paying $22.6bn for PTC's CAD and PLM stack. Industrial hardware companies are buying the software layer that sits under the digital twin. Compare the PTC pop with the CH Robinson drop on the same day. $PTC $SBGSY", "tweetB": "CH Robinson -11%, RXO +22% on the same announcement. The buyer pausing buybacks until 2028 is what the market is pricing. Leverage-funded logistics consolidation into a freight recession is a brave call. $CHRW $RXO", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-october-5-2026"}, {"id": 35, "cat": "macro", "urgency": "deep", "source": "Big Price Moves Explained", "title": "Lennar: 356 Millrose purchases in the last week of the quarter vs a 340-home cushion over guidance", "idea": "Hunterbrook alleges Millrose (Lennar's 2025 land-bank spinoff, CEO Stuart Miller holds ~43% votes) bought 700+ finished Lennar homes in ~1 month (~$200M), 356 in the last week of the fiscal quarter. Lennar's 20,840 deliveries beat the 20,500 low end by 340. Millrose BTR yields ~5% vs 6.5–6.75% borrowing cost; allegedly paid ~13% above retail. New orders -9% YoY; full-year deliveries guide cut to 80–81k. LEN -6.7% to $74.44. Allegations unproven.", "angle": "Related-party demand propping the delivery count. The arithmetic (356 vs 340) is the thing to repeat, carefully, as an allegation.", "tweetA": "Lennar beat the bottom of its delivery guide by 340 homes. A related-party buyer bought 356 homes in the last week of the quarter. Allegation, not proven, but the arithmetic is uncomfortable. $LEN $MRP", "tweetB": "Negative carry at Millrose (about 5% yield against 6.5%+ debt) plus paying 13% above retail is not a business, it's a transfer. The 'asset-light' homebuilder model depends on who holds the assets.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-october-5-2026"}, {"id": 36, "cat": "geopolitics", "urgency": "act", "source": "Big Price Moves Explained", "title": "Brazil: Flávio Bolsonaro 47% in round one, runoff Oct 25 vs Lula; Ibovespa record, Nu +13%", "idea": "Flávio Bolsonaro won 47% in Brazil's first round, beating expectations, and faces Lula in an Oct 25 runoff. Ibovespa opened at a record; Nu Holdings +13% to $15.18 on expected fiscal discipline, lower taxes and lower long-term rates.", "angle": "Brazil is a rare place where an election result is a rates trade: lower expected term premium on fiscal discipline.", "tweetA": "Nu +13%, Ibovespa at a record, and the runoff isn't until Oct 25. The market has already priced a Bolsonaro win. If Lula holds, the repricing is the trade. $NU $EWZ", "tweetB": "A fiscal-discipline candidate sparking a rally in a high-rate EM while developed-market bond yields rise on fiscal fears. Everyone is trading the same variable in a different country.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-october-5-2026"}, {"id": 37, "cat": "AI/infra", "urgency": "watch", "source": "Dark Side of the Boom (Goldman recaps)", "title": "Goldman's Sheridan: SpaceX valued as a vertically integrated platform where rockets, connectivity and AI compute feed one another", "idea": "Goldman's Eric Sheridan argues SpaceX is increasingly valued as an infrastructure platform in which launch, Starlink connectivity and AI compute reinforce each other, and that the numbers attached to the AI side are too large to treat as a side project. (Email shows the opening only.)", "angle": "Valuation narrative shifting from launch cost to AI infrastructure. Watch which comps get used.", "tweetA": "SpaceX is being pitched by Goldman as an AI infrastructure company with a launch business attached. When the comp set changes, the multiple changes before the earnings do.", "tweetB": "Rockets cut the cost of getting compute to orbit, Starlink moves the data, and the AI business consumes both. If that loop is real, the moat isn't any one piece. It's owning all three.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/spacex-is-becoming-an-ai-infrastructure"}];

  h+='<span class="src" style="background:'+c+'">'+esc(item.source)+'</span><span class="tag">'+esc(item.cat)+'</span>';
  if(item.charts.count>0)h+='<span>'+(item.charts.hot?'🔥':'📊')+'</span>';
  h+='<span class="ttl">'+esc(item.title)+'</span></div><div class="bd">';
  h+='<div class="lbl">The Idea</div><div>'+esc(item.idea)+'</div>';
  h+='<div class="lbl">My Angle</div><div class="angle" style="border-color:'+c+';background:'+tint(c)+'">'+esc(item.angle)+'</div>';
  h+='<div class="tw"><div><div class="lbl" style="color:#378add">Tweet A</div>'+esc(item.tweetA)+'<br>'+'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
  h+='<div><div class="lbl" style="color:#7f77dd">Tweet B</div>'+esc(item.tweetB)+'<br>'+'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>';
  if(item.charts.count>0)h+='<div class="ch'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING — ':'📊 ')+item.charts.count+' chart(s): '+esc(item.charts.desc)+'</div>';
  else if(item.charts.desc)h+='<div class="ch">'+esc(item.charts.desc)+'</div>';
  h+='<div class="lbl">Link</div><a href="'+esc(item.link)+'" target="_blank" rel="noopener">↗ Read full article</a></div></div>';
  return h;
}
function toggle(id){document.getElementById("c"+id).classList.toggle("open");}
function collapseAll(){var e=document.querySelectorAll(".card");for(var i=0;i<e.length;i++)e[i].classList.remove("open");}
function visible(it){return (curCat==="All"||it.cat===curCat)&&(curUrg==="All"||it.urgency===curUrg)&&(!curSrc||it.source.indexOf(curSrc)!==-1);}
function render(){
  document.getElementById("cards").innerHTML=ITEMS.filter(visible).map(cardHtml).join("");
  bars();
}
function bars(){
  var cats={};ITEMS.forEach(function(i){cats[i.cat]=(cats[i.cat]||0)+1;});
  var h='<span class="pill'+(curCat==="All"?' on':'')+'" style="'+(curCat==="All"?'background:#333':'')+'" onclick="setCat(\'All\')">All '+ITEMS.length+'</span>';
  Object.keys(cats).forEach(function(k){var on=curCat===k;h+='<span class="pill'+(on?' on':'')+'" style="'+(on?'background:'+COLORS[k]:'')+'" onclick="setCat(\''+k+'\')">'+k+' '+cats[k]+'</span>';});
  document.getElementById("catbar").innerHTML=h;
  var u={act:0,deep:0,watch:0};ITEMS.forEach(function(i){u[i.urgency]++;});
  var lab=[["All","All "+ITEMS.length],["act","🔴 Act Now "+u.act],["deep","🔵 Deep "+u.deep],["watch","🟡 Watch "+u.watch]];
  document.getElementById("urgbar").innerHTML=lab.map(function(l){var on=curUrg===l[0];return '<span class="pill'+(on?' on':'')+'" style="'+(on?'background:#333':'')+'" onclick="setUrg(\''+l[0]+'\')">'+l[1]+'</span>';}).join("");
}
function setCat(c){curCat=c;curSrc=null;render();}
function setUrg(u){curUrg=u;curSrc=null;render();}
function filterBySrc(name){curSrc=name;curCat="All";curUrg="All";render();var e=document.querySelectorAll(".card");for(var i=0;i<e.length;i++)e[i].classList.add("open");window.scrollTo(0,0);}
function init(){
  document.getElementById("sub").textContent=META.date+" · "+META.time+" · "+ITEMS.length+" items";
  var r='<p><b>Window:</b> '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</p>';
  r+='<p><b>Emails in window:</b> '+META.emailsInWindow+' · <b>Read:</b> '+META.emailsRead+' · <b>Items:</b> '+META.itemsExtracted+' from '+META.includedSources.length+' sources</p><p><b>Included sources</b> (click to filter):</p><ul>';
  META.includedSources.forEach(function(s){r+='<li><span class="sl" onclick="filterBySrc(\''+s.name.replace(/'/g,"\\'")+'\')">'+esc(s.name)+'</span> — '+s.items+'</li>';});
  r+='</ul><p><b>Skipped:</b></p><ul>';META.skippedSources.forEach(function(s){r+='<li>'+esc(s)+'</li>';});
  r+='</ul><p>'+esc(META.notes)+'</p>';
  document.getElementById("rb").innerHTML=r;
  render();
}
init();
</script></body></html>
