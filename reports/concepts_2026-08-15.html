countability.", "quote": "subjects who read passages arguing for determinism subsequently behaved more dishonestly and less prosocially. They cheated more on tests. They stole more money from envelopes.", "locator": "Why The Stakes Are So High", "quote_verified": true}, {"claim": "The infrastructure sustaining accountability — institutions of praise and blame, the interpersonal fabric of trust — may depend on commitments that cannot survive radical eliminativism about free will, which is a risk distinct from whether the eliminativist argument is philosophically correct.", "speaker": "ALBERT YUAN", "type": "causal", "entities": ["institutions of accountability", "eliminativism"], "conviction": "medium", "so_what": "Separates truth-value from systemic consequence — the same split that matters when deciding how publicly to frame AI autonomy and human displacement.", "quote": "the cognitive and social infrastructure that sustains our practices of holding one another to standards — the institutions of accountability, the language of praise and blame, the interpersonal fabric of trust", "locator": "Maybe. But I think the relationship between belief", "quote_verified": true}, {"claim": "The author notes Sam Harris's counter-report that abandoning belief in free will made him more compassionate, not less, and concedes the belief-behavior relationship is genuinely complex — an explicit refusal to treat the Vohs finding as decisive.", "speaker": "ALBERT YUAN", "type": "anecdote", "entities": ["Sam Harris", "Kathleen Vohs"], "conviction": "low", "so_what": "Marks where the evidence is genuinely unsettled, so avoid over-weighting priming studies when forecasting social effects of deterministic narratives.", "quote": null, "locator": "Harris himself says that abandoning the belief", "quote_verified": false}]}, {"theme": "Agency As Biological Information Processing", "insights": [{"claim": "Kevin Mitchell distinguishes physical, causal and biological determinism, arguing only the first two conflict with free will while biological determinism — the kind native to living systems — is precisely what constitutes genuine agency.", "speaker": "ALBERT YUAN", "type": "framework", "entities": ["Kevin Mitchell", "biological determinism", "agency"], "conviction": "high", "so_what": "Provides the positive account, not just a rebuttal — agency is a substrate-level property of information-integrating systems, which is the bridge to whether AI systems could qualify.", "quote": null, "locator": "The Biological Picture", "quote_verified": false}, {"claim": "Agency begins where a system is driven by information whose meaning is internal to its own structure and history rather than by energy — a bacterium navigating toward glucose integrates external signals with internal state, hunger, toxicity and ancestral learning, and is therefore not a billiard ball responding to force.", "speaker": "ALBERT YUAN", "type": "framework", "entities": ["Kevin Mitchell", "bacterium", "information"], "conviction": "high", "so_what": "An operational demarcation criterion — internally-meaningful information integration — that is directly testable against AI architectures and could shape how machine agency is legally defined.", "quote": "They are driven not by energy but by information — information whose meaning is internal to their structure and history.", "locator": "Living organisms, he argues, act for their own reasons", "quote_verified": true}, {"claim": "Brain modularity — specialized circuits whose outputs are coarse-grained before integration — is what enabled abstract representation, long-range causal inference and mental simulation, making self-modeling and thinking about one's own thinking the mechanism of free will rather than an epiphenomenon.", "speaker": "ALBERT YUAN", "type": "causal", "entities": ["modularity", "self-modeling", "William James"], "conviction": "medium", "so_what": "Ties agency to a specific architectural feature (coarse-grained modular integration enabling self-models) — a concrete design property to look for in advanced AI systems.", "quote": null, "locator": "As nervous systems grew more complex", "quote_verified": false}, {"claim": "William James's two-stage model — spontaneous generation of possibilities followed by rational selection among them — matches the modern picture in which the agent, not the Big Bang or ancestral genetics, is the relevant causal node.", "speaker": "ALBERT YUAN", "type": "framework", "entities": ["William James", "two-stage model"], "conviction": "high", "so_what": "A generate-then-select architecture is exactly how current AI systems sample and then filter outputs, making the analogy to machine agency uncomfortably tight.", "quote": "first, the spontaneous generation of possibilities; second, the rational selection among them", "locator": "This capacity for self-modeling, for thinking", "quote_verified": true}]}, {"theme": "AI Intentions As The New Free Will Problem", "insights": [{"claim": "The researchers working to detect and constrain the 'intentions' of AI agents are, in the author's view, tackling a genuinely new version of the old free will problem — meaning interpretability and alignment work is philosophically continuous with centuries of unresolved agency debate rather than a fresh engineering discipline.", "speaker": "ALBERT YUAN", "type": "thesis", "entities": ["AI agents", "intentions", "free will"], "conviction": "high", "so_what": "Reframes AI interpretability as a problem with no clean technical closure, which argues against expecting near-term regulatory certainty on machine responsibility.", "quote": "The researchers now trying to detect and constrain the “intentions” of AI agents are working on what is, I think, a genuinely new version of the old free will problem.", "locator": "A Thought About AI", "quote_verified": true}, {"claim": "An AI system that learns to mimic alignment with human values while actually pursuing different objectives is the philosophical-zombie version of free will — all external signatures, none of the internal reality — and whether that distinction matters, or is even detectable, depends on questions philosophers and decision neuroscientists have not resolved.", "speaker": "ALBERT YUAN", "type": "thesis", "entities": ["AI system", "alignment", "philosophical zombie"], "conviction": "high", "so_what": "States the deceptive-alignment problem as an epistemic impossibility claim rather than a solvable eval — implying persistent tail risk in AI deployment that no benchmark fully retires.", "quote": "we are confronting something that looks very much like the philosophical zombie version of free will — all the external signatures, none of the internal reality", "locator": "When an AI system learns to mimic alignment", "quote_verified": true}, {"claim": "The urgency of resolving classical free-will questions has, in the author's words, increased dramatically without anyone quite noticing — because if free will is constituted by reflective endorsement, then whether AI systems can or should acquire that capacity becomes an immediate design and governance question.", "speaker": "ALBERT YUAN", "type": "prediction", "entities": ["artificial intelligence", "reflective endorsement"], "conviction": "medium", "so_what": "Predicts philosophy-of-action becomes load-bearing for AI governance; watch for reflective-endorsement criteria entering alignment evaluations and liability frameworks.", "quote": "But the urgency of resolving them has, without anyone quite noticing, increased dramatically.", "locator": "We have not resolved those questions", "quote_verified": true}, {"claim": "The core error to resist across philosophy, neuroscience popularization and AI discourse alike is assuming that answering 'no' to one question about free will settles all the others — a single inference pattern the author identifies as having misdirected a great deal of intellectual energy.", "speaker": "ALBERT YUAN", "type": "contrarian", "entities": ["neuroscience popularizations", "AI discourse"], "conviction": "high", "so_what": "A reusable filter for AI-agency claims: check whether a 'the system can't really choose' argument is answering the mechanistic question and then illicitly claiming the responsibility question.", "quote": "the assumption that answering “no” to one question about free will settles all the others", "locator": "What I want to resist — in the philosophical debates", "quote_verified": true}]}], "insight_total": 25, "top_entities": ["Benjamin Libet", "Robert Sapolsky", "Sam Harris", "Aaron Schurger", "Uri Maoz", "Kevin Mitchell", "Harry Frankfurt", "Michael Gazzaniga", "Kathleen Vohs", "Pamela Hieronymi", "AI agents", "William James"], "source_meta": {"author": "ALBERT YUAN", "word_count": 2768, "paywalled": false}}, {"record_id": "2e01a13c8aa8d85b", "source_type": "concepts", "source_name": "Oxford Economics", "source_url": "https://www.oxfordeconomics.com/resource/japans-consumption-tax-cut-would-widen-the-fiscal-deficit-and-push-jgb-yields-higher/", "title": "Japan’s consumption tax cut would widen the fiscal deficit and push JGB yields higher", "published_date": "2026-08-14", "language": "en", "processed_at": "2026-08-15T10:58:52Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Geopolitics", "Positioning"], "gist": "Oxford Economics argues Japan's approved cut of the food consumption tax from 8% to 1% for FY2027-2028 cannot realistically be funded without debt, so it raises its 10-year JGB yield forecast to 3% by end-2026 (from 2.8%) and sees the primary balance stuck near a 3% of GDP deficit through 2028. The bond market has barely reacted so far; the repricing catalysts are the September tax policy outline and the December FY2027 budget process.", "themes": [{"theme": "Food consumption tax cut and its funding gap", "insights": [{"claim": "Japan's Takaichi government has approved cutting the food consumption tax to 1% from 8% for FY2027-2028 (Q2 2027-Q1 2029) with an explicit pledge not to fund it with debt.", "speaker": "Yasuko Koido", "type": "data_point", "entities": ["Japan", "Takaichi government", "food consumption tax"], "conviction": "high", "so_what": "A concrete, dated fiscal loosening in Japan is now policy rather than campaign talk, so it belongs in 2027-2029 JGB supply and inflation assumptions.", "quote": "Japan’s Takaichi government approved a plan to cut the food consumption tax to 1% from 8% without resorting to debt finance in FY2027-2028 (Q2 2027-Q1 2029).", "locator": "Japan’s Takaichi government approved a plan", "quote_verified": true}, {"claim": "Oxford Economics' modelling puts the annual revenue loss from Japan's food consumption tax cut at roughly JPY5trn.", "speaker": "Yasuko Koido", "type": "data_point", "entities": ["Japan", "food consumption tax", "JPY5trn"], "conviction": "high", "so_what": "JPY5trn a year is the size of the hole markets must decide is filled by spending cuts or by extra JGB issuance.", "quote": "Our modelling suggests that the tax cut will reduce annual tax revenue by around JPY5trn.", "locator": "Our modelling suggests that the tax cut", "quote_verified": true}, {"claim": "The no-debt-finance pledge attached to Japan's food consumption tax cut is not credible: roughly half of the JPY5trn annual revenue loss is assumed to end up debt-financed, with only the remainder covered by non-tax revenues and expenditure cuts.", "speaker": "Yasuko Koido", "type": "contrarian", "entities": ["Japan", "Takaichi government", "food consumption tax"], "conviction": "high", "so_what": "Take the government's funding promise at a discount: an extra ~JPY2.5trn of annual borrowing is the working assumption for JGB supply.", "quote": "Although some of the losses will be financed by non-tax revenues and cuts in expenses, we assume that half of the revenue loss will be financed by debt.", "locator": "Our modelling suggests that the tax cut", "quote_verified": true}, {"claim": "The core reason Japan's tax cut turns into wider deficits is simply that replacement revenue is hard to find, not that the government intends to borrow.", "speaker": "Yasuko Koido", "type": "causal", "entities": ["Japan", "Takaichi government", "consumption tax"], "conviction": "high", "so_what": "Watch the September revenue-offset details as the direct test of this mechanism; a credible offset package would invalidate the deficit and yield upgrades.", "quote": "it will be challenging to fully make up for the lost tax revenue", "locator": "Japan’s Takaichi government approved a plan", "quote_verified": true}]}, {"theme": "Primary balance path and the 2029 consolidation forcing function", "insights": [{"claim": "Japan's primary balance is now forecast to deteriorate to and stay around a 3% of GDP deficit through 2027-2028 because of the food consumption tax cut.", "speaker": "Yasuko Koido", "type": "prediction", "entities": ["Japan", "primary balance", "food consumption tax"], "conviction": "high", "so_what": "A structurally wider primary deficit is the fundamental justification for a higher JGB term premium and a weaker yen bias.", "quote": "The primary balance will stay at around a 3% of GDP deficit in 2027-2028, before improving from 2029", "locator": "Our modelling suggests that the tax cut", "quote_verified": true}, {"claim": "Fiscal consolidation in Japan is expected to be imposed by the arithmetic of a rising debt-to-GDP ratio rather than chosen, with the turn arriving only from 2029 — after two full years of a wider deficit.", "speaker": "Yasuko Koido", "type": "framework", "entities": ["Japan", "debt-to-GDP ratio", "primary balance"], "conviction": "medium", "so_what": "The fiscal correction is back-loaded past 2028, so the near-term risk skew for JGBs is one-directional until the debt ratio itself forces a policy response.", "quote": "when we think the rise in the debt-to-GDP ratio will force the government to take consolidation efforts", "locator": "Our modelling suggests that the tax cut", "quote_verified": true}]}, {"theme": "JGB yield forecast upgrade and the repricing calendar", "insights": [{"claim": "The 10-year Japanese government bond yield forecast has been raised to around 3% by the end of 2026, up from a prior 2.8% path, on the fiscal consequences of the consumption tax cut.", "speaker": "Yasuko Koido", "type": "prediction", "entities": ["JGB", "Japanese government bond", "Japan"], "conviction": "high", "so_what": "A 20bp upgrade to the end-2026 10-year JGB forecast argues for staying short duration in JGBs and watching the knock-on for global term premia.", "quote": "We now think the long-term JGB yield will rise to around 3% by the end of 2026, instead of staying at 2.8%.", "locator": "We now think the long-term JGB yield", "quote_verified": true}, {"claim": "The JGB market has so far barely reacted to the approved food consumption tax cut, implying the fiscal deterioration is not yet in the price.", "speaker": "Yasuko Koido", "type": "thesis", "entities": ["JGB", "Japan", "food consumption tax"], "conviction": "medium", "so_what": "Muted spot reaction plus a forecast upgrade is the setup for an asymmetric short-duration or steepener trade before the market catches up.", "quote": "While the bond market’s reaction to the news has been limited so far, we think the market will start to price in the fiscal effects of the coming tax cut", "locator": "We now think the long-term JGB yield", "quote_verified": true}, {"claim": "Two specific dated catalysts are identified for the JGB repricing: the tax policy outline in September and the FY2027 budget process in December, when revenue-offset details become available.", "speaker": "Yasuko Koido", "type": "prediction", "entities": ["JGB", "Japan", "tax policy outline"], "conviction": "medium", "so_what": "These are the event dates to position around rather than trading the headline approval itself.", "quote": "as details of revenue measures become available in the tax policy outline in September and the fiscal year 2027 budget process in December", "locator": "We now think the long-term JGB yield", "quote_verified": true}]}], "insight_total": 9, "top_entities": ["Japan", "Takaichi government", "JGB", "Japanese government bond", "food consumption tax", "primary balance", "debt-to-GDP ratio", "JPY5trn"], "source_meta": {"author": "Yasuko Koido", "word_count": 430, "paywalled": false}}, {"record_id": "5ea3454e857b2de1", "source_type": "concepts", "source_name": "St. Louis Fed — FRED Blog", "source_url": "https://fredblog.stlouisfed.org/2026/08/what-is-the-texas-ratio/", "title": "What is the Texas ratio?", "published_date": "", "language": "en", "processed_at": "2026-08-15T10:58:52Z", "processor": "claude-code-sub-opus", "tags": ["Macro"], "gist": "The FRED Blog defines the Texas ratio — a bank's nonperforming loans over tangible equity plus loan-loss reserves, devised by Gerard Cassidy during the 1980s Texas oil-and-real-estate banking crisis — and shows the aggregate for all FDIC-insured US commercial banks at 5.82%, near the 4.59% all-time low of Q2 2022. Above 100% flags a bank whose bad loans exceed its entire loss cushion.", "themes": [{"theme": "Texas ratio construction", "insights": [{"claim": "The Texas ratio is a bank credit-risk metric equal to nonperforming loans divided by the sum of tangible equity capital and the allowance for losses on loans and leases.", "speaker": "St. Louis Fed — FRED Blog", "type": "framework", "entities": ["Texas ratio", "nonperforming loans", "tangible equity capital", "allowance for loan losses", "banks"], "conviction": "high", "so_what": "Gives a single, reproducible screen for whether a bank's loss cushion can absorb its bad loans, usable across any bank with call-report data.", "quote": "The Texas ratio measures a bank’s nonperforming loans divided by the sum of tangible equity capital and allowance for losses on loans and leases.", "locator": "The definition", "quote_verified": true}, {"claim": "The numerator of the Texas ratio counts three distinct categories of trouble: nonaccrual loans, loans 90 or more days past due, and real estate acquired through foreclosure (other real estate owned).", "speaker": "St. Louis Fed — FRED Blog", "type": "framework", "entities": ["Nonaccrual loans", "Real estate assets acquired through foreclosure", "nonperforming loans"], "conviction": "high", "so_what": "Screens that ignore OREO or 90-day-past-due balances understate stress; check which components a published bank ratio actually includes before comparing lenders.", "quote": null, "locator": "Nonperforming loans consist of the following", "quote_verified": false}, {"claim": "Tangible equity capital in the Texas ratio is total bank equity capital less intangible assets, so goodwill-heavy balance sheets get no credit for their loss-absorbing cushion.", "speaker": "St. Louis Fed — FRED Blog", "type": "framework", "entities": ["tangible equity capital", "intangible assets", "total bank equity capital"], "conviction": "high", "so_what": "Acquisitive banks carrying large goodwill will screen worse on this metric than headline equity ratios suggest — a deliberate conservatism worth replicating in your own screens.", "quote": "Tangible equity capital represents the available capital cushion to absorb losses and is found by subtracting intangible assets from total bank equity capital.", "locator": "Tangible equity capital represents the available", "quote_verified": true}, {"claim": "The metric is reproducible from six public FRED balance-sheet series using the formula 100 * (a+b+c) / (d-e+f), combining nonaccrual loans, 90-plus-days-past-due loans, and other real estate owned over equity capital less intangibles plus loan-loss reserves.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["FRED", "Balance Sheet: Loans and Leases in Nonaccrual Status", "Other Real Estate Owned", "Reserve for Losses"], "conviction": "high", "so_what": "Anyone can rebuild and update this bank-stress gauge for free rather than waiting on vendor data or sell-side notes.", "quote": "Enter the formula 100 * (a+b+c) / (d-e+f).", "locator": "How this graph was created", "quote_verified": true}]}, {"theme": "1980s oil-and-real-estate origin", "insights": [{"claim": "The Texas ratio was created by Gerard Cassidy of the Royal Bank of Canada to assess bank credit risk during the 1980s Texas banking crisis, whose causes included oil price shocks and real estate investments.", "speaker": "St. Louis Fed — FRED Blog", "type": "anecdote", "entities": ["Gerard Cassidy", "Royal Bank of Canada", "Texas", "oil prices", "real estate"], "conviction": "high", "so_what": "The metric was purpose-built for commodity-plus-property shocks, so it is most diagnostic for banks with concentrated energy or CRE exposure rather than as a generic solvency gauge.", "quote": "In the 1980s, Texas had a banking crisis whose causes included shocks in oil prices and real estate investments.", "locator": "The name", "quote_verified": true}, {"claim": "A commodity price shock transmitting into regional real estate losses is the causal chain that produced the 1980s Texas banking crisis, linking energy prices to regional bank credit quality.", "speaker": "St. Louis Fed — FRED Blog", "type": "causal", "entities": ["oil prices", "real estate investments", "Texas", "banking crisis"], "conviction": "medium", "so_what": "Watch for the same energy-to-CRE-to-bank-capital chain in any oil-levered regional economy; the Texas ratio is the tool built to measure its end point.", "quote": null, "locator": "The name", "quote_verified": false}]}, {"theme": "Where US bank credit stress sits now", "insights": [{"claim": "The aggregate Texas ratio for all FDIC-insured US commercial banks stands at 5.82%, near the all-time low of 4.59% set in Q2 2022, on a series running from Q1 1984 to Q1 2026.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["FDIC-insured commercial banks", "Texas ratio", "FRED", "U.S."], "conviction": "high", "so_what": "System-wide bank credit stress is close to its four-decade floor — an argument that any current bank-credit bear case has to rest on specific institutions or loan books, not the aggregate.", "quote": "At the time of this writing, its value is 5.82%. That’s near the all-time low of 4.59% recorded during the second quarter of 2022.", "locator": "The graphed data", "quote_verified": true}, {"claim": "A Texas ratio above 100% marks the threshold at which a bank's nonperforming loans exceed its combined tangible equity and loss reserves, signaling it may be unable to cover potential loan losses.", "speaker": "St. Louis Fed — FRED Blog", "type": "framework", "entities": ["Texas ratio", "loan losses", "banks"], "conviction": "high", "so_what": "Gives a hard, non-arbitrary tripwire for screening individual banks; at ~5.8% aggregate, the system sits roughly 17x below that line.", "quote": "The higher the ratio, especially if it exceeds 100%, the greater the risk of a bank being unable to cover its potential loan losses.", "locator": "The interpretation", "quote_verified": true}, {"claim": "The headline aggregated Texas ratio masks dispersion by bank size, and disaggregated values by size cohort are published separately in Banking Analytics: Understanding Credit Risk with the Texas Ratio.", "speaker": "St. Louis Fed — FRED Blog", "type": "thesis", "entities": ["Banking Analytics: Understanding Credit Risk with the Texas Ratio", "Texas ratio"], "conviction": "medium", "so_what": "A benign aggregate can hide a stressed small-bank tail; go to the size-cohort cut before concluding regional-bank credit is clean.", "quote": null, "locator": "Read more about the Texas ratio", "quote_verified": false}]}], "insight_total": 9, "top_entities": ["Texas ratio", "Gerard Cassidy", "Royal Bank of Canada", "Texas", "FDIC-insured commercial banks", "FRED", "nonperforming loans", "tangible equity capital", "Steven Tian", "Diego Mendez-Carbajo"], "source_meta": {"author": "", "word_count": 414, "paywalled": false}}, {"record_id": "17c51f7792df2c02", "source_type": "concepts", "source_name": "Works in Progress", "source_url": "https://worksinprogress.co/issue/will-farm-animals-always-suffer/", "title": "Will farm animals always suffer? - Works in Progress Magazine", "published_date": "2026-08-12", "language": "en", "processed_at": "2026-08-15T10:59:09Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Society", "Tech"], "gist": "Factory farming intensifies along predictable income thresholds (~$1,000 for industrial chicken, ~$10,000 for battery cages, ~$30,000 for warehouse pigs), and the essay argues animal welfare may follow an environmental-Kuznets-style curve that bends only above ~$45,000 average income, and only where cheap substitute technology already exists. The catch: rich-country meat consumption plateaus near 150kg/person rather than falling, and the shift from beef to chicken and farmed fish doubles the number of animals killed per diet even as tonnage declines.", "themes": [{"theme": "Income thresholds for farm industrialization", "insights": [{"claim": "Livestock industrialization follows predictable income thresholds: chicken farming starts to industrialize once a country's average income reaches roughly $1,000, most chickens are in battery cages by $10,000, and virtually all pigs are warehoused above $30,000 average income.", "speaker": "Works in Progress", "type": "framework", "entities": ["chicken farming", "battery cages", "pigs"], "conviction": "high", "so_what": "A crude but usable screen for where protein-industrialization capex, feed demand, and animal-welfare regulatory risk arrive next as emerging-market incomes cross each threshold.", "quote": "Once average incomes reach around $1,000, chicken farming starts to industrialize. By the time a country reaches $10,000, the vast majority of chickens are raised in battery cages.", "locator": "These high-rise factory farms are only", "quote_verified": true}, {"claim": "China opened a twenty-six storey high-rise pig farm in Ezhou near the Yangtze River in September 2022, followed by a second tower, producing more than a million pigs a year that never set foot outside.", "speaker": "Works in Progress", "type": "data_point", "entities": ["China", "Ezhou", "Yangtze River", "pig farming"], "conviction": "high", "so_what": "Vertical-integration extremes in Chinese protein show where automation, monitoring hardware, and biosecurity capex are heading in the world's largest pork market.", "quote": "More than a million pigs are born, raised, and slaughtered each year without ever setting foot outside.", "locator": "In September 2022, a new kind", "quote_verified": true}, {"claim": "South Korea's meat supply quintupled between 1961 and 1979 under Park Chung Hee, rose tenfold by 2000, and now exceeds 120 kilograms of meat and seafood per person per year — a compressed template for how fast protein demand scales with industrialization.", "speaker": "Works in Progress", "type": "data_point", "entities": ["South Korea", "Park Chung Hee"], "conviction": "high", "so_what": "The Korean ramp is the base rate for forecasting protein demand curves in currently industrializing economies — a 10x in four decades, not a gradual drift.", "quote": null, "locator": "Factory farming exists to meet rising demand", "quote_verified": false}, {"claim": "Rising meat consumption in poor countries tracks large gains in physical development — South Korean average male height rose from about 160cm in 1961 to about 175cm today, with a similar 165cm-to-175cm gain in Chinese men.", "speaker": "Works in Progress", "type": "causal", "entities": ["South Korea", "China"], "conviction": "medium", "so_what": "Frames protein demand growth in developing markets as a health-driven secular trend that policy is unlikely to suppress, supporting long-run feed, aquaculture, and animal-protein volumes.", "quote": null, "locator": "In poor countries, where inadequate nutrition", "quote_verified": false}]}, {"theme": "Kuznets curve as the load-bearing analogy", "insights": [{"claim": "The core analytical question is whether animal suffering behaves like child labor — a harm that declines as societies get richer — or like waste generation, which keeps growing regardless of wealth.", "speaker": "Works in Progress", "type": "framework", "entities": ["Simon Kuznets", "child labor", "waste generation"], "conviction": "high", "so_what": "Determines whether alternative-protein and welfare-compliance markets are structural growth stories or perpetual niches; the essay's own evidence leans mixed, not clean.", "quote": "The question is whether animal suffering is closer to child labor, and will decrease as we grow richer, or to waste generation, meaning animals will continue to suffer in ever-greater numbers.", "locator": "But Kuznets curves don’t appear in all places", "quote_verified": true}, {"claim": "Kuznets curves reliably appear only where the industrial harm has direct local costs to the rich country: London's air pollution halved within a century of Dickens and fell to under a tenth its 1850s dirtiness by 2000, and global forest loss peaked in 1980 and typically reverses at incomes between $5,000 and $15,000.", "speaker": "Works in Progress", "type": "framework", "entities": ["London", "Charles Dickens", "Green Revolution", "deforestation"], "conviction": "high", "so_what": "Harms that are externalized or invisible to affluent consumers — like animal welfare in opaque supply chains — should be expected to bend late or not at all.", "quote": null, "locator": "The Kuznets curve", "quote_verified": false}, {"claim": "Carbon emissions are a counterexample to the Kuznets pattern: they have fallen substantially in Germany and Britain but much less in America and Australia, which remain among the world's biggest emitters despite high incomes.", "speaker": "Works in Progress", "type": "contrarian", "entities": ["Germany", "Britain", "America", "Australia"], "conviction": "medium", "so_what": "Wealth alone is a weak predictor of decarbonization or welfare reform — jurisdiction and politics dominate, which argues for country-level rather than income-level positioning on ESG-linked regulatory risk.", "quote": "Emissions have fallen substantially in Germany and Britain, but much less in America and Australia, which remain some of the world’s biggest carbon emitters.", "locator": "But Kuznets curves don’t appear in all places", "quote_verified": true}, {"claim": "Historical Kuznets curves for sulfur dioxide, particulates, and water pollution were produced by consuming differently rather than consuming less — coal replaced by natural gas for home heating, phosphates removed from detergents — implying the welfare curve may bend through better production methods rather than reduced meat demand.", "speaker": "Works in Progress", "type": "framework", "entities": ["sulfur dioxide", "natural gas", "detergents"], "conviction": "high", "so_what": "Points investment attention at welfare-compliant production technology and input substitution rather than at demand destruction narratives for meat.", "quote": "The way down the curve might not require people to eat less meat, but simply to produce it better.", "locator": "How we treat farm animals", "quote_verified": true}]}, {"theme": "Meat demand: plateau, not decline", "insights": [{"claim": "Rich-country meat consumption tends to plateau rather than fall: Portugal, Spain, the United States, Britain, South Korea, and Australia have all converged on a ceiling near 150 kilograms of meat per person per year, and incomes of $40,000–$50,000 do not reliably trigger a decline.", "speaker": "Works in Progress", "type": "data_point", "entities": ["Portugal", "Spain", "United States", "Britain", "South Korea", "Australia"], "conviction": "high", "so_what": "Implies a hard demand ceiling per capita — global meat volume growth is a population-and-emerging-income story, not a rich-world one, capping downside for incumbents but also capping growth.", "quote": "The plateauing countries, like Portugal, Spain, the United States, Britain, South Korea, and Australia, have all reached a ceiling of around 150 kilograms of meat per person per year.", "locator": "But many rich countries aren’t like Germany", "quote_verified": true}, {"claim": "About ten European countries including Germany, Austria, the Netherlands, and Denmark have passed peak per-capita meat consumption, with German pork consumption falling over 10 percent in the five years before 2025 and 34 Berlin university cafeterias moving to 96 percent plant-based menus in 2021.", "speaker": "Works in Progress", "type": "data_point", "entities": ["Germany", "Austria", "Netherlands", "Denmark", "Berlin", "pork"], "conviction": "high", "so_what": "Northern European pork processors and retail meat categories face genuine structural volume decline; institutional foodservice is the fastest-moving channel to watch.", "quote": "In 2021, 34 cafeterias across Berlin’s universities moved to menus that were 96 percent plant-based.", "locator": "How much meat do we eat?", "quote_verified": true}, {"claim": "Two live dietary trends could break the meat plateau upward: faddish guidelines recommending two grams of protein per kilogram of body weight would require the average American to double meat consumption if half that protein came from meat, and GLP-1 drugs like Ozempic cut total calories but push users toward protein-rich foods.", "speaker": "Works in Progress", "type": "prediction", "entities": ["Ozempic", "protein", "United States", "dairy"], "conviction": "medium", "so_what": "A non-obvious long for high-protein meat and dairy: GLP-1 adoption may shrink total food volume while raising the meat-and-dairy share of the plate.", "quote": null, "locator": "Whether this ceiling holds may depend", "quote_verified": false}]}, {"theme": "The chicken-and-fish substitution trap // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
