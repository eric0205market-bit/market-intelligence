tel Xeon head) argues the network is the last passive layer in AI/HPC infrastructure, and that congestion and latency leave expensive accelerators idle. Cornelis designs its own SuperNICs and switches and is on its third-generation platform, with 50+ OEM/ODM design wins and 500+ datacenter deployments. It just announced an Active Compute Fabric with programmable RISC-V cores at every hop, built on UALink/ESUN for scale-up and Ultra Ethernet for scale-out, and pitched as vendor-neutral.", "themes": [{"theme": "Network as the bottleneck for AI economics", "insights": [{"claim": "Cornelis CEO Lisa Spelman argues that compute, storage and memory have all become workload-aware, while the network is the last passive layer. As compute speeds up, the largest training, inference and simulation jobs spend more time waiting on data, leaving expensive compute idle.", "speaker": "Daniel Nenni", "type": "thesis", "entities": ["Cornelis", "Lisa Spelman", "AI networking", "HPC"], "conviction": "high", "so_what": "As accelerator spending grows, more of the value at the margin moves to networking that raises utilization, which supports AI networking silicon vendors.", "quote": "The network is the last passive layer.", "locator": "Over the last decade, compute, storage, and memory", "quote_verified": true}, {"claim": "Cornelis argues that AI and HPC jobs send bursts of small messages across thousands of endpoints and often cannot advance until all of them arrive. Conventional networks that drop and retransmit packets under congestion therefore force the whole job to run at the speed of its slowest exchange.", "speaker": "Daniel Nenni", "type": "causal", "entities": ["Cornelis", "AI workloads", "HPC"], "conviction": "high", "so_what": "Tail latency, not peak bandwidth, sets cluster throughput, which favors fabrics with lossless, congestion-managed designs.", "quote": "forcing the job to run at the speed of its slowest exchange", "locator": "In the network, that challenge shows up", "quote_verified": true}, {"claim": "Cornelis manages congestion proactively with credit-based flow control, telemetry-driven adaptive routing and per-packet path selection, aiming to maximize productive compute per watt and per dollar.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["Cornelis"], "conviction": "medium", "so_what": "Performance per watt is the selling metric, so power-constrained AI buildouts are where Cornelis would be most competitive.", "quote": null, "locator": "We designed our network to manage congestion", "quote_verified": false}, {"claim": "Spelman says many organizations still plan the network last, size it by bandwidth and treat it as a byte carrier. At AI factory scale, she argues, buying accelerators first and fixing the network later yields clusters that look impressive on paper but underdeliver in production.", "speaker": "Daniel Nenni", "type": "contrarian", "entities": ["Cornelis", "Lisa Spelman", "AI factory"], "conviction": "high", "so_what": "If buyers move to co-designing compute and network, network vendors capture a larger share of AI capex and gain more say in procurement.", "quote": "Buying accelerators first and solving the network later produces a cluster that looks impressive on paper and underdelivers in production.", "locator": "Many still plan the network last", "quote_verified": true}]}, {"theme": "Active Compute Fabric with RISC-V in-network compute", "insights": [{"claim": "Cornelis announced the Active Compute Fabric, which puts programmable RISC-V cores at every hop across every NIC and switch. The cores accelerate collectives, KV cache and mixture-of-experts routing while accelerators keep doing math, and customers can tune them instead of relying on fixed-function in-network processing.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["Cornelis", "Active Compute Fabric", "RISC-V", "KV cache", "mixture-of-experts"], "conviction": "high", "so_what": "Programmable in-network compute is a new way to compete with fixed-function offload from InfiniBand and Ethernet incumbents, and it gives RISC-V another foothold in datacenter infrastructure.", "quote": "adds programmable RISC-V cores at every hop, across every NIC and switch", "locator": "We start from a different assumption", "quote_verified": true}, {"claim": "Cornelis frames the competitive landscape this way: InfiniBand and Ethernet keep getting faster but were built only to move data between endpoints, and DPUs and SmartNICs added intelligence and offload at the edge. In its view the fabric in between stayed passive, and in-network processing is usually fixed-function.", "speaker": "Daniel Nenni", "type": "framework", "entities": ["Cornelis", "InfiniBand", "Ethernet", "DPUs", "SmartNICs"], "conviction": "medium", "so_what": "Cornelis is positioning against both the InfiniBand and Ethernet camps on architecture rather than raw speed, a claim that needs benchmark evidence before it can be credited.", "quote": null, "locator": "We differentiate in how we think", "quote_verified": false}]}, {"theme": "Open standards and vendor independence", "insights": [{"claim": "Cornelis builds its fabric on open standards, with UALink and ESUN for scale-up and Ultra Ethernet for scale-out. It supports mixed CPUs, GPUs and accelerators so customers are not tied to a single compute vendor's roadmap.", "speaker": "Daniel Nenni", "type": "thesis", "entities": ["Cornelis", "UALink", "ESUN", "Ultra Ethernet"], "conviction": "high", "so_what": "Cornelis benefits if open scale-up standards gain ground against proprietary single-vendor stacks, so track UALink and Ultra Ethernet adoption as its tailwind.", "quote": null, "locator": "The other difference is independence", "quote_verified": false}, {"claim": "Spelman says mixed CPUs, GPUs and workload-specialized accelerators are becoming the norm, so operators need interoperable networks that do not lock them into one vendor's architecture.", "speaker": "Daniel Nenni", "type": "thesis", "entities": ["Cornelis", "Lisa Spelman", "accelerators"], "conviction": "medium", "so_what": "Heterogeneous clusters reduce the pull of bundled compute-plus-network offerings and open the market to independent fabric vendors.", "quote": null, "locator": "And then there’s choice", "quote_verified": false}, {"claim": "Cornelis is moving into scale-up networking. Spelman argues that new compute challengers are designing at the rack level rather than the chip, and that open scale-up gives them a path to complete rack-scale systems without adopting a single vendor's stack. In her words, every scale-up domain eventually becomes a scale-out problem.", "speaker": "Daniel Nenni", "type": "prediction", "entities": ["Cornelis", "Lisa Spelman", "scale-up networking", "rack-scale systems"], "conviction": "medium", "so_what": "Rack-scale challengers to the dominant GPU vendor are a natural customer base for open scale-up fabrics, so watch for design wins with them.", "quote": "Every scale-up domain eventually becomes a scale-out problem, which is why we’re building for both.", "locator": "I’m particularly excited about our move into scale-up", "quote_verified": true}]}, {"theme": "Cornelis traction and go-to-market", "insights": [{"claim": "Cornelis is working on the third generation of its networking platform. It reports more than 50 OEM and ODM design wins and deployments in over 500 datacenters, including new large-scale installs at Lawrence Livermore National Lab and the Texas Advanced Computing Center.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["Cornelis", "Lawrence Livermore National Lab", "Texas Advanced Computing Center"], "conviction": "high", "so_what": "Its traction is anchored in national-lab HPC. The open question for investors is whether it converts to commercial AI cluster wins.", "quote": null, "locator": "We’re working on the third generation", "quote_verified": false}, {"claim": "Cornelis sees its strongest fit in communication-intensive work: large-scale AI training, disaggregated inference, mixture-of-experts models and distributed inference pipelines. On the HPC side, it lists scientific computing, engineering simulation, weather and climate modeling, and national research environments.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["Cornelis", "disaggregated inference", "mixture-of-experts", "HPC"], "conviction": "medium", "so_what": "MoE and disaggregated inference are growing workloads where network latency matters more, which widens the market for latency-optimized fabrics.", "quote": null, "locator": "On the AI side, that includes", "quote_verified": false}, {"claim": "Most Cornelis customers buy through OEM partners, and its technology is qualified across a broad range of systems from major OEMs worldwide. Customers are encouraged to benchmark their own applications on the fabric before committing.", "speaker": "Daniel Nenni", "type": "framework", "entities": ["Cornelis", "OEMs"], "conviction": "medium", "so_what": "OEM-led distribution lowers sales cost and adoption friction but makes Cornelis dependent on OEM prioritization against InfiniBand and Ethernet alternatives.", "quote": null, "locator": "Most customers engage with us through our OEM partners", "quote_verified": false}, {"claim": "Cornelis CEO Lisa Spelman previously led Intel's Xeon Products and Solutions business as Corporate Vice President in the Data Center & AI Group.", "speaker": "Daniel Nenni", "type": "data_point", "entities": ["Lisa Spelman", "Cornelis", "Intel", "Xeon"], "conviction": "high", "so_what": "Leadership with deep datacenter go-to-market experience at Intel strengthens Cornelis's OEM relationships and its credibility with buyers.", "quote": null, "locator": "Before joining Cornelis, Spelman served", "quote_verified": false}]}], "insight_total": 13, "top_entities": ["Cornelis", "Lisa Spelman", "Intel", "Active Compute Fabric", "RISC-V", "UALink", "Ultra Ethernet", "InfiniBand", "Ethernet", "Lawrence Livermore National Lab", "Texas Advanced Computing Center", "mixture-of-experts"], "source_meta": {"author": "Daniel Nenni", "word_count": 1307, "paywalled": false}}, {"record_id": "b619ccec21c2a96e", "source_type": "technology", "source_name": "ServeTheHome", "source_url": "https://www.servethehome.com/adt-r27a-bk3-u-2-to-pcie-slot-review/", "title": "ADT R27A-BK3 U.2 to PCIe Adapter Review", "published_date": "2026-10-24", "language": "en", "processed_at": "2026-10-26T11:09:34Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "ServeTheHome reviews the ADT R27A-BK3, an inexpensive adapter that puts a U.2 (SFF-8639) NVMe SSD in a PCIe Gen5 x4 slot, with a metal shell and a PWM blower fan. In 20-minute sustained tests, a Gen3 Samsung drive held 2,179 MB/s (3.2% off peak) and a Gen5 Solidigm D7-PS1010 held 7,838 MB/s (1.4% off peak). Neither throttled, unlike the EDSFF version of the adapter in earlier testing.", "themes": [{"theme": "R27A-BK3 design: Gen5 x4 slot to U.2 SFF-8639", "insights": [{"claim": "The ADT R27A-BK3 is a low-cost adapter that lets a U.2 NVMe SSD be installed in a system with only standard PCIe slots. It uses a PCIe Gen5 x4 edge connector and an SFF-8639 drive connector, and it encloses the full-length drive in a metal shell with a 4-pin PWM blower fan.", "speaker": "Eric Smith", "type": "data_point", "entities": ["ADT", "ADT R27A-BK3", "U.2", "SFF-8639", "PCIe Gen5"], "conviction": "high", "so_what": "Cheap retrofit adapters make it easier to put used or enterprise U.2 drives into workstations and homelab machines that have no U.2 backplane.", "quote": "The bottom edge carries a PCIe Gen5 x4 gold-finger connector.", "locator": "The bottom edge carries a PCIe Gen5 x4 gold-finger connector", "quote_verified": true}, {"claim": "ADT sells the adapter family in several versions: a Gen4 version, a Gen5 version, and an EDSFF variant that uses an SFF-TA-1002 connector for E1.S/E3.S drives under a different model number. The R27A-BK3 works only with U.2 SFF-8639 drives, so buyers need to match both the PCIe generation and the drive form factor.", "speaker": "Eric Smith", "type": "framework", "entities": ["ADT", "EDSFF", "SFF-TA-1002", "E1.S", "E3.S", "SFF-8639"], "conviction": "high", "so_what": "The adapter models are split by connector and generation, so buying the wrong SKU is a real risk for anyone purchasing them in bulk.", "quote": null, "locator": "Just make sure you buy the correct version", "quote_verified": false}]}, {"theme": "Sustained throughput under 20-minute write load", "insights": [{"claim": "In a 20-minute test in the R27A-BK3, a Samsung MZQLB7T6HMLA-00007 (7.68TB, PCIe Gen3 x4) peaked at 2,252 MB/s and sustained 2,179 MB/s, a drop of about 3.2%. The drive reached a peak temperature of 78 C, below its 86 C warning threshold.", "speaker": "Eric Smith", "type": "data_point", "entities": ["Samsung", "Samsung MZQLB7T6HMLA-00007", "ADT R27A-BK3"], "conviction": "high", "so_what": "Older Gen3 enterprise U.2 drives run at close to full speed in the adapter. That makes it a workable way to reuse them.", "quote": "Temperature peaked at 78 C, staying well below the drive’s warning threshold of 86 C.", "locator": "During a 20-minute run, the Samsung drive peaked", "quote_verified": true}, {"claim": "A Solidigm D7-PS1010 (7.68TB, PCIe Gen5 x4) in the R27A-BK3 peaked at 7,946 MB/s and sustained 7,838 MB/s over 20 minutes of 128K sequential writes, a drop of only 1.4%. Its temperature leveled off at 70 C, against a 77 C warning threshold.", "speaker": "Eric Smith", "type": "data_point", "entities": ["Solidigm", "Solidigm D7-PS1010", "ADT R27A-BK3", "PCIe Gen5"], "conviction": "high", "so_what": "A cheap passive adapter can carry close to full Gen5 x4 bandwidth, so native U.2 backplanes are not strictly needed for high-throughput single-drive setups.", "quote": "The performance drop from peak to sustained was minimal at just 1.4%.", "locator": "The Solidigm drive achieved a peak throughput", "quote_verified": true}]}, {"theme": "Thermals: U.2 version versus EDSFF version", "insights": [{"claim": "STH saw no sustained thermal throttling with either drive in the U.2 R27A-BK3, while the EDSFF version of the same adapter family did throttle in earlier testing. The enclosed shell and blower fan are what keep the U.2 drive cool.", "speaker": "Eric Smith", "type": "causal", "entities": ["ADT R27A-BK3", "EDSFF", "ServeTheHome"], "conviction": "medium", "so_what": "How well these cheap adapters cool the drive depends on the variant. The U.2 version looks more reliable than the EDSFF version for sustained workloads.", "quote": "In our testing, we did not see the same thermal throttling behavior we saw with the EDSFF version of this adapter.", "locator": "The fan is important here", "quote_verified": true}, {"claim": "The reviewer cautions that the cooling is adequate for the drives tested, but users with hotter drives should check thermals in their own machine rather than assume the adapter will keep the drive within limits.", "speaker": "Eric Smith", "type": "thesis", "entities": ["ADT R27A-BK3", "U.2"], "conviction": "medium", "so_what": "Anyone deploying hotter or higher-power Gen5 drives in this adapter should monitor drive temperatures. The test results do not guarantee the adapter's cooling headroom.", "quote": null, "locator": "Neither drive exhibited sustained thermal throttling", "quote_verified": false}]}], "insight_total": 6, "top_entities": ["ADT", "ADT R27A-BK3", "U.2", "SFF-8639", "EDSFF", "Solidigm D7-PS1010", "Samsung", "PCIe Gen5", "SFF-TA-1002"], "source_meta": {"author": "Eric Smith", "word_count": 733, "paywalled": false}}, {"record_id": "60bf37c86c570875", "source_type": "technology", "source_name": "Wired", "source_url": "https://www.wired.com/story/oil-spills-wreak-havoc-on-the-bottom-of-the-ocean-even-a-decade-later/", "title": "Inside the Supermassive Debate Over the James Webb Telescope’s ‘Little Red Dots’", "published_date": "2026-10-24", "language": "en", "processed_at": "2026-10-26T11:11:00Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "Webb Telescope 'little red dots' - tiny, very bright, very red objects that show up in almost every Webb image - have split astronomers. Rubies (de Graaff) and MOM (Naidu) argue that the reddest ones are 'black hole stars': hydrogen cocoons powered by hidden, relatively low-mass black hole seeds. Maiolino and Madau counter that ordinary dust- and gas-obscured supermassive black holes seen edge-on explain the data. An August 2026 census showing the dots vanish by 2-3 billion years supports a transient seed phase, but the question is not settled.", "themes": [{"theme": "What little red dots are and why they puzzled astronomers", "insights": [{"claim": "JWST's 'little red dots' are tiny objects only one pixel across that shine as brightly as a whole galaxy in long-wavelength red light. A couple of them appear in almost every image Webb takes. Researchers named them in 2023.", "speaker": "Charlie Wood", "type": "data_point", "entities": ["James Webb Space Telescope", "little red dots"], "conviction": "high", "so_what": "Ubiquitous, unexplained objects are now a main target of Webb observing time, so they shape which instruments and surveys get funded next.", "quote": null, "locator": "One batch of objects proved especially difficult", "quote_verified": false}, {"claim": "Astronomers first read little red dots as distant galaxies. Galaxies that bright would have had to grow impossibly large within a few hundred million years, so the dots were nicknamed 'universe breakers' for seeming to contradict the standard cosmic timeline.", "speaker": "Charlie Wood", "type": "causal", "entities": ["little red dots", "universe breakers"], "conviction": "medium", "so_what": "Shows how a single misread observation can look like a challenge to an established model until better data (spectra) arrives.", "quote": null, "locator": "When all you can see is a speck", "quote_verified": false}, {"claim": "Spectra from the Rubies and MOM surveys showed hydrogen emission smeared across many shades (broad lines). That signature usually means fast-moving gas orbiting a black hole, so many astronomers reclassified the dots as dust-reddened supermassive black holes.", "speaker": "Charlie Wood", "type": "causal", "entities": ["Rubies", "Mirage or Miracle (MOM)", "supermassive black holes", "James Webb Space Telescope"], "conviction": "medium", "so_what": "Spectroscopy, not imaging, is what decided the classification: long-exposure spectra are the key scientific output.", "quote": null, "locator": "The bombshell discovery in the little-red-dot spectra", "quote_verified": false}, {"claim": "Unlike typical supermassive black holes, most little red dots neither flicker nor emit strong x-rays. Any model of the dots has to explain these two anomalies.", "speaker": "Charlie Wood", "type": "data_point", "entities": ["little red dots", "x-rays"], "conviction": "high", "so_what": "These are the observational tests rival theories are judged on; watch future x-ray and variability studies.", "quote": null, "locator": "Yet they still seemed weird", "quote_verified": false}]}, {"theme": "Black hole star hypothesis", "insights": [{"claim": "In spring 2025 the de Graaff and Naidu teams reported two extremely red dots with a sharp Balmer break and a smooth hump-shaped spectrum like a stellar surface at about 5,000 K. They proposed a new object, the 'black hole star': a huge hydrogen envelope powered by a black hole at its core instead of by fusion.", "speaker": "Charlie Wood", "type": "thesis", "entities": ["Anna de Graaff", "Rohan Naidu", "Max Planck Institute for Astronomy", "University of Hawai’i", "Balmer break", "black hole star"], "conviction": "high", "so_what": "A proposed new class of astrophysical object would be a landmark result, but it is still a claim under dispute.", "quote": "there’s nothing that looks like these sources.", "locator": "Then, in the spring of 2025", "quote_verified": true}, {"claim": "A black hole star's gas cocoon would block x-rays and damp flickering. That would explain both anomalies seen in little red dots, while the hydrogen near the surface filters out blue light to produce the Balmer break.", "speaker": "Charlie Wood", "type": "causal", "entities": ["black hole star", "x-rays", "Balmer break"], "conviction": "medium", "so_what": "One mechanism accounting for several anomalies is the main argument for the theory; that is why its backers invoke Occam's razor.", "quote": null, "locator": "And as with certain stars", "quote_verified": false}, {"claim": "Vadim Rusakov's group argued that electron scattering, not fast-orbiting gas, causes much of the broad-line spread. With that effect removed, the lines look like a slowly churning hydrogen shell, consistent with a black hole star. All three teams posted their findings on March 20, 2025.", "speaker": "Charlie Wood", "type": "causal", "entities": ["Vadim Rusakov", "University of Manchester", "electron scattering"], "conviction": "medium", "so_what": "If the broad lines are partly scattering, black hole masses estimated from those lines would be overstated.", "quote": null, "locator": "That group, which included Vadim Rusakov", "quote_verified": false}, {"claim": "Naidu describes black hole stars as the seed phase of supermassive black holes. A black hole forms inside a hydrogen shell, then eats its way out and gains mass as it clears the gas.", "speaker": "Charlie Wood", "type": "prediction", "entities": ["Rohan Naidu", "supermassive black holes", "black hole star"], "conviction": "high", "so_what": "If true, it would answer how giant black holes formed so early, a central open question in cosmology.", "quote": "“We are seeing the seed,” Naidu said. “This is the birth of potentially every massive black hole in the universe.”", "locator": "Black hole stars could represent a new stage", "quote_verified": true}, {"claim": "A September 8 analysis by Naidu, de Graaff, Eilers and collaborators found that the black holes hidden inside black hole stars seem far less massive than standard exposed black holes. They propose that Webb is seeing black hole stars of up to 1 million solar masses incubating the universe's first big black holes.", "speaker": "Charlie Wood", "type": "data_point", "entities": ["Rohan Naidu", "Anna de Graaff", "Anna-Christina Eilers", "James Webb Space Telescope"], "conviction": "medium", "so_what": "Lower seed masses would ease the timeline problem of early massive black holes.", "quote": null, "locator": "Theorists are already working out", "quote_verified": false}]}, {"theme": "Standard black hole counter-case", "insights": [{"claim": "Roberto Maiolino (Cambridge) argues that ordinary supermassive black holes explain the dots. Early black holes may have fed more steadily, so they would flicker less. Thick gas-and-dust doughnuts can block x-rays. Electron scattering also broadens lines around normal black holes.", "speaker": "Charlie Wood", "type": "contrarian", "entities": ["Roberto Maiolino", "University of Cambridge", "supermassive black holes"], "conviction": "high", "so_what": "There is a credible null hypothesis: the 'new object class' claim may not survive further scrutiny.", "quote": "“The data is really compelling,” said Roberto Maiolino of the University of Cambridge. “I’m a little bit more dubious about the interpretation.”", "locator": "Many astronomers still argue", "quote_verified": true}, {"claim": "Maiolino and Piero Madau propose that viewing angle sets a dot's color. Edge-on black holes look red because their gas doughnut blocks the view, and the 'little blue dots' Webb also sees may be the same objects viewed from the top.", "speaker": "Charlie Wood", "type": "framework", "entities": ["Roberto Maiolino", "Piero Madau", "little blue dots", "University of California, Santa Cruz"], "conviction": "medium", "so_what": "A unified orientation model is a competing simple explanation, which makes the dispute a contest over which theory is more parsimonious.", "quote": null, "locator": "Maiolino and his collaborator, Piero Madau", "quote_verified": false}, {"claim": "Mauro Giavalisco (UMass Amherst) says either theory can currently match what Webb has observed. Dale Kocevski describes the field as so polarized that an April 2026 Aspen conference discussion could not get past its first bullet point.", "speaker": "Charlie Wood", "type": "anecdote", "entities": ["Mauro Giavalisco", "Dale Kocevski", "Colby College", "Anna-Christina Eilers"], "conviction": "high", "so_what": "Expect a long period of contested papers rather than a quick consensus.", "quote": "“The group erupted into argument, and we couldn’t even get past the first bullet point,” he said.", "locator": "Even years after the discovery", "quote_verified": true}]}, {"theme": "Quasi-star models and population tests", "insights": [{"claim": "Mitchell Begelman (University of Colorado, Boulder), who proposed quasi-stars in 2006 with Marta Volonteri and Martin Rees, and Jason Dexter estimated in 2025 that quasi-stars could assemble in a few million years. They would then look like little red dots for tens of millions of years, long enough for Webb to catch them.", "speaker": "Charlie Wood", "type": "framework", "entities": ["Mitchell Begelman", "Jason Dexter", "Marta Volonteri", "Martin Rees", "quasi-star"], "conviction": "medium", "so_what": "An old theory revived by new data gives the black hole star idea a physical formation pathway.", "quote": null, "locator": "Begelman had proposed the existence of quasi-stars", "quote_verified": false}, {"claim": "In 2026 Giavalisco's team developed a quasi-star model that fit the spectra of the de Graaff and Naidu objects better than the initial models had. Giavalisco still considers other explanations possible.", "speaker": "Charlie Wood", "type": "data_point", "entities": ["Mauro Giavalisco", "quasi-star", "Anna de Graaff", // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
