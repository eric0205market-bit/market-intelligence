<!DOCTYPE html>

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-08-14T05:21:00Z", "input_stats": {"total_tweets": 210, "unique_authors": 70, "tweets_with_images": 54, "after_noise_filter": 60}, "summary": "**Tether audit:** KPMG gave Tether International's first full financial audit an unqualified (clean) opinion. **nic_carter** and **alpha_pls** called it a landmark moment ending years of \"Tether truther\" FUD; **0xSammy** pushed back, noting it's just a standard financial audit, not proof of reserves.\n\n**MSTR index risk:** MSCI proposed rules that would remove **Strategy (MSTR)** from its Global Investable Market Indexes over its \"non-operating company\" structure. **Evan_ss6** estimates ~$2B of forced selling if MSCI alone acts, rising to ~$8.8B if other index providers follow.\n\n**DeFi revenue re-rating:** **Matt_Hougan** argues DeFi apps (Hyperliquid, Uniswap, Aave, Morpho, Aerodrome, Lighter, Pump) are underpricing their real TAM ($500T asset market, not $2T crypto) and their fee-generation ceiling. **0xSammy** flags \"holder revenue\"/buybacks (via DefiLlama) as the key alignment metric now that several protocols are doing real buybacks.\n\n**AI competitive dynamics:** **munster_gene** says Grok 4.6 jumped from 8th to 4th on the Artificial Analysis leaderboard and predicts #1 by January once 4.7 (Cursor data) and 5.0 (SpaceX engineering data) ship. **cryptopunk7213** ties this to Elon's Cursor acquisition and a rumored $2T Anthropic IPO re-pricing SpaceX. **dgt10011** floats a hot take that the US government could backstop an Anthropic IPO.\n\n**Rates/macro:** **elerianm** flags a 30-year Treasury auction that drew yields as high as 5.22%, the highest since 2001. **TruthGundlach** notes US national debt is on pace to cross $40T by Labor Day. **Swedish_uranium** stays bullish across uranium/silver/copper/gold on supply constraints plus AI/data-center power demand.\n\n**Notable:** **JavierBlas** relays JD Vance framing US Iran policy around cheap oil/gas plus nuclear non-proliferation, not regime change. **Geiger_Capital** flags new drone tariffs and a fifth US Navy shipyard (first in 80+ years) as signs of an accelerating robotics/defense buildout.", "sections": {"A_events": [{"cluster": "Tether's First Full KPMG Audit", "category": ["crypto", "regulation"], "items": [{"author": "alpha_pls", "summary": "Calls KPMG's clean/unqualified audit opinion on Tether International a landmark day for the industry, declaring \"Tether truthers\" (e.g. bitfinexed) definitively wrong.", "tweet_url": "https://x.com/alpha_pls/status/2087988491372101731", "images": [], "type": "tweet"}, {"author": "nic_carter", "summary": "Says 2018-era Tether skeptics \"fell to their knees in a Walmart\" now that the KPMG audit is done — a notable reversal from one of the loudest historical Tether critics.", "tweet_url": "https://x.com/nic_carter/status/2088033783043739775", "images": [], "type": "thread"}, {"author": "cointradernik", "summary": "Shares a graphic marking the audit news with \"RIP\" (to the FUD narrative).", "tweet_url": "https://x.com/cointradernik/status/2087990406508126691", "images": ["https://pbs.twimg.com/media/HPoINHyXIAAF3Xy.jpg"], "type": "tweet"}, {"author": "0xSammy", "summary": "Pushes back on the celebration: a financial audit isn't the same as a full proof-of-reserves/backing verification — asks what exactly the market thinks was proven.", "tweet_url": "https://x.com/0xSammy/status/2088005026165760123", "images": [], "type": "tweet"}]}, {"cluster": "MSCI Proposes Removing Strategy (MSTR) From Indexes", "category": ["crypto", "macro", "regulation"], "items": [{"author": "Evan_ss6", "summary": "Responding to news that MSCI's proposed \"non-operating company\" rule (per its May 2026 simulation) would drop $MSTR from its Global Investable Market Indexes, estimates roughly $2B of forced selling from MSCI alone, and up to ~$8.8B if other index providers (S&P, FTSE, etc.) follow suit.", "tweet_url": "https://x.com/Evan_ss6/status/2087972729785913600", "images": [], "type": "tweet"}]}, {"cluster": "AI Leaderboard Race — Grok's Climb and the Cursor Acquisition Angle", "category": ["AI", "tech", "positioning"], "items": [{"author": "munster_gene", "summary": "Says Grok 4.6 jumped from 8th to 4th on the Artificial Analysis leaderboard and expects Grok to reach #1 by January: version 4.7 (dropping in about a month) will incorporate Cursor's data for the first time, and 5.0 (likely December) will leverage SpaceX engineering data. Calls it \"a monster.\"", "tweet_url": "https://x.com/munster_gene/status/2088001610525929834", "images": [], "type": "tweet"}, {"author": "cryptopunk7213", "summary": "Argues Cursor was always \"a frontier AI lab disguised as a wrapper,\" that Elon's compute gave it a killer model, and that Cursor's agent harness (not the models) is the real product edge — calling the xAI/Cursor tie-up the best acquisition of 2026. Ties this to a rumored $2T Anthropic IPO valuation that he says will force a brutal re-pricing of SpaceX, framing SpaceX as one asset with exposure to AI, chips, neocloud, mobile connectivity, rockets and X.", "tweet_url": "https://x.com/cryptopunk7213/status/2088068665581150355", "images": [], "type": "thread"}, {"author": "dgt10011", "summary": "Hot take: the US government will backstop or allocate into the Anthropic IPO, if it happens at all.", "tweet_url": "https://x.com/dgt10011/status/2088024768561693059", "images": [], "type": "tweet"}]}, {"cluster": "30-Year Treasury Auction — Highest Yield Since 2001", "category": ["macro"], "items": [{"author": "elerianm", "summary": "Cites FT reporting that a $25bn 30-year Treasury auction drew yields as high as 5.22%, the highest since the 5.52% paid in August 2001 — after which 30-year auctions were suspended for nearly five years.", "tweet_url": "https://x.com/elerianm/status/2088019625388728607", "images": ["https://pbs.twimg.com/media/HPoiyCXXEAA4wKe.jpg"], "type": "tweet"}, {"author": "TruthGundlach", "summary": "Says the US national debt now looks on pace to surpass $40 trillion by Labor Day.", "tweet_url": "https://x.com/TruthGundlach/status/2087997968758751526", "images": [], "type": "tweet"}]}, {"cluster": "Trump Defense/Industrial Moves — Drone Tariffs and New Navy Shipyard", "category": ["geopolitics", "regulation"], "items": [{"author": "Geiger_Capital", "summary": "Flags Trump imposing tariffs on foreign drones and certain components, framing it as the robotics race accelerating.", "tweet_url": "https://x.com/Geiger_Capital/status/2088022613851271340", "images": ["https://pbs.twimg.com/media/HPolgDOWgAEjV9H.jpg"], "type": "tweet"}, {"author": "Geiger_Capital", "summary": "Notes Trump ordered the Secretary of War to create a fifth US Navy shipyard — the first new one in 80+ years.", "tweet_url": "https://x.com/Geiger_Capital/status/2088030783806005468", "images": ["https://pbs.twimg.com/media/HPos7lYW8AAUqxh.jpg"], "type": "tweet"}]}, {"cluster": "JD Vance on Iran Policy — Cheap Energy, Not Regime Change", "category": ["geopolitics", "energy"], "items": [{"author": "JavierBlas", "summary": "Relays JD Vance's stated priorities on the Iran conflict: goal one is keeping oil and gas cheap for Americans, goal two is preventing Iran from getting a nuclear weapon — framing the administration's calculus as primarily economic, with the nuclear issue secondary.", "tweet_url": "https://x.com/JavierBlas/status/2088036711863365871", "images": [], "type": "tweet"}]}, {"cluster": "Workday Reportedly in Private Equity Buyout Talks", "category": ["macro", "tech", "positioning"], "items": [{"author": "buccocapital", "summary": "Flags reports that all 21,000 Workday employees are bracing for a private equity buyout, pointing to continued PE appetite for large enterprise-software names trading at depressed multiples.", "tweet_url": "https://x.com/buccocapital/status/2088070478275428597", "images": ["https://pbs.twimg.com/media/HPpQijCX0AA20Wq.jpg"], "type": "tweet"}]}, {"cluster": "CME Expands Cross-Margining to End Users", "category": ["macro", "regulation"], "items": [{"author": "Fullcarry", "summary": "Notes CME Group extended expanded cross-margining benefits to end users (not just member firms) starting in August, a market-structure change that improves capital efficiency for traders holding offsetting futures/options positions.", "tweet_url": "https://x.com/Fullcarry/status/2087962779026063477", "images": ["https://pbs.twimg.com/media/HPnvDbbXgAE3fiS.png"], "type": "tweet"}]}, {"cluster": "TSLA Robotaxi/Optimus Long Thesis", "category": ["tech", "positioning"], "items": [{"author": "Bluntz_Capital", "summary": "Argues TSLA is a reasonable long entry after a ~40% pullback and 5 years of sideways trading, citing robotaxi (imminent) and Optimus (1–1.5 years out) as catalysts that expand TSLA's TAM into the \"deca-trillions.\" A separate post argues Cybercab is being stealth-rolled out (43 of 44 recently pictured units lack a steering wheel) with few people noticing, calling TSLA the most underrated AI/robotics company and a \"$15T company in the making.\"", "tweet_url": "https://x.com/Bluntz_Capital/status/2088022355318902912", "images": ["https://pbs.twimg.com/media/HPolKtBbQAAsDGT.jpg"], "type": "thread"}]}], "B_insights": [{"author": "0xSammy", "summary": "Breaks down \"holder revenue\" as the single most important short-term metric for token holders, pointing to DeFiLlama's revenue sort and highlighting Robinhood-chain protocols (Pump, Hype, Lit, Venice, Ethfi, Derive) doing real buybacks as the projects proving value isn't just accruing to equity. In a separate long thread, maps out an emerging arbitrage flywheel in the StonkBrokers NFT/Anvil AMM ecosystem: ERC-6551 wallet-bearing NFTs create a treasure-hunting dynamic where arbitrageurs can snipe underpriced Brokers, extract their contents, and round-trip principal through the AMM — profitable only if the ~15% snipe fee plus swap costs are covered by the contained assets.", "tweet_url": "https://x.com/0xSammy/status/2088020668499804551", "images": ["https://pbs.twimg.com/media/HPojug8WEAAgE3O.jpg", "https://pbs.twimg.com/media/HPojugZWEAACsO4.jpg"], "type": "thread"}, {"author": "Matt_Hougan", "summary": "Argues the market is making two compounding mistakes valuing DeFi apps: underestimating the addressable market (the real target is the $500T asset market, not the $2T crypto market) and underestimating fee-generation headroom. Names Hyperliquid, Uniswap, Aave, Morpho, Aerodrome, Lighter and Pump as having bigger TAMs and more pricing power than the market assumes, and expects L1 fees broadly to rise, not fall, over time.", "tweet_url": "https://x.com/Matt_Hougan/status/2087946338801786911", "images": [], "type": "thread"}, {"author": "nicbstme", "summary": "Lays out a full framework for building an AI agent product: memory (learning about the user from email/drive/files), context engineering (selecting the right subset for the task), skills (teaching the agent complex workflows like DCFs or board prep), tools/MCPs (world access), an agent runtime (plan/act/observe/retry loop), triggers (cron/events), trust/permissions, and evals. Argues verticalization is just adding more MCPs and skills on top of this stack.", "tweet_url": "https://x.com/nicbstme/status/2088014852954669300", "images": [], "type": "thread"}, {"author": "RaoulGMI", "summary": "Argues GDP will be obsolete as an economic measure by 2030 because the underlying \"magic formula\" (labor + output + borrowing capacity) is being overtaken by robots, AI, energy density and compute efficiency, none of which fit the old measure — dubs this the \"Economic Singularity\" and says it will unfold within five years. (Also promotes his new paid newsletter, The Exponentialist, on the topic.)", "tweet_url": "https://x.com/RaoulGMI/status/2087985812692676858", "images": [], "type": "thread"}, {"author": "Swedish_uranium", "summary": "Runs through uranium, silver, copper and gold: Urenco's order book surged 28% in H1 (+€6B) on nuclear life-extension and data-center power demand, with Russian fuel-cycle uncertainty still an overhang for Europe; silver pulled back post-rally on softer PPI reducing Fed-hike odds, seen as profit-taking not a trend change; Antofagasta cut 2026 copper guidance (650-700kt → 625-655kt) after disruption at Los Pelambres, underscoring supply fragility amid AI/electrification demand; gold pulled back from ~$4,500 despite a constructive rate backdrop. Remains bullish across all four on the combined theme of supply constraints plus massive power/infrastructure investment.", "tweet_url": "https://x.com/Swedish_uranium/status/2087997016081051995", "images": [], "type": "tweet"}, {"author": "cryptopunk7213", "summary": "Notes that fud around Nvidia's Rubin not needing much memory was false: leaked details show Rubin Ultra will use 8-high/12-high HBM4E (not HBM4), Kyber has not been cancelled, and the four-die Rubin Ultra is still on the roadmap for it — reiterates that compute, data and memory remain the three requirements for frontier intelligence and near-term price action is noise. Separately argues, contrary to the doomer AI-jobs narrative, that new ChatGPT \"Computer History\" features that watch/learn/predict user actions across apps will make humans more productive, comparing it to how calculators and factories displaced menial work.", "tweet_url": "https://x.com/cryptopunk7213/status/2087941965962727925", "images": [], "type": "tweet"}, {"author": "aleabitoreddit", "summary": "Reports glass-substrate semiconductor timelines slipping further: Samsung Electro-Mechanics delayed its glass substrate investment on customer reliability-evaluation bottlenecks, pushing operations start to 2028 (from H2 2027); SKC/Absolics reportedly pushed mass production from H2 2026 to H1 2027 with final validation targeted by year-end. Flags $LPK/Philoptics and E&R (8027) as names whose volume ramps track these production timelines // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
