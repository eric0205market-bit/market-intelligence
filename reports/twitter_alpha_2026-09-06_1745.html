<!DOCTYPE html>

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

k could decide whether the Fed or geopolitics drives price action.", "tweet_url": "https://x.com/Swedish_uranium/status/2096473747985142155", "type": "tweet"}, {"author": "zriboua", "summary": "Argues Iran built the world's most sophisticated laboratory for evading Western financial enforcement, and that knowledge had dual-use value for Beijing's own sanctions-evasion contingency planning around Taiwan. With that network now degrading in real time, she frames it as a first-order strategic gain for Japan, whose defense planners have long worried Western economic leverage over China wouldn't hold in a Taiwan crisis.", "tweet_url": "https://x.com/zriboua/status/2096637226784264460", "images": ["https://pbs.twimg.com/media/HRjAcj3WoAQn-vU.jpg"], "type": "tweet"}]}, {"cluster": "Germany: AfD Surges in Saxony-Anhalt", "category": ["geopolitics"], "items": [{"author": "AndreasSteno", "summary": "Reacting to the Saxony-Anhalt exit poll (AfD 44.5%, up 23.5 points; CDU collapsing to 18.5%), calls it AfD 'closing on an absolute majority.'", "tweet_url": "https://x.com/AndreasSteno/status/2096636850387431755", "type": "tweet"}, {"author": "Geiger_Capital", "summary": "Flagged the same exit poll as a coming 'political earthquake' in Germany, then separately argued the immigration debate is misunderstood historically: the foreign-born US population share fell to ~5% in 1970 (from restrictive 1920-1970 policy that coincided with winning WW2 and building a strong middle class) and is now above the Ellis Island-era peak.", "tweet_url": "https://x.com/Geiger_Capital/status/2096606914247327944", "images": ["https://pbs.twimg.com/media/HRijtOJbsAAMROi.jpg"], "type": "thread"}]}, {"cluster": "Robinhood Chain Becomes #1 Fee Chain — Then Rotates Out", "category": ["crypto", "positioning"], "items": [{"author": "0xJeff", "summary": "Reports Robinhood Chain (RHC) became the #1 fee-generating chain, arguing it has fully changed the regime and brought on-chain activity back across 6+ narrative metas; links a longer writeup on the 'DEX War' and where the remaining opportunities sit.", "tweet_url": "https://x.com/0xJeff/status/2096498901956415742", "type": "thread"}, {"author": "DefiIgnas", "summary": "Data-backed rotation call: in the past 24h Solana-linked tokens ran (RAY +60%, JUP +21%, ORCA +12%, MET +13%) while RH-meme-sector coins fell (AI -11.5%, CASHCAT -5.8%, sector down 16.5% per CoinGecko), and bridging volume flowed +$18.8M into Solana vs -$47.8M out of Robinhood Chain. Reads it as profit-taking on RH memes rotating into Solana's trading infrastructure to play the same mania, flags $STONK launchpad's 360% pump as the strongest signal, and floats Solana's tokenized-stock platform Backpack ($BP) as a laggard beneficiary.", "tweet_url": "https://x.com/DefiIgnas/status/2096590235534860561", "images": ["https://pbs.twimg.com/media/HRiVtV-acAEaY2h.jpg"], "type": "thread"}, {"author": "sjdedic", "summary": "Pushes back on framing it as Robinhood-chain-OR-Solana: 'it's Robinhood AND Solana... the pie is growing again.'", "tweet_url": "https://x.com/sjdedic/status/2096542515126063317", "type": "tweet"}, {"author": "jvisserlabs", "summary": "Says the AI+crypto+TradFi merge is happening at light speed, with Robinhood Chain forcing TradFi analysts to upgrade HOOD on its new on-chain revenue streams - but the basket of tokens that actually benefited from the HOOD story isn't covered by the WSJ; says 'do your homework now.'", "tweet_url": "https://x.com/jvisserlabs/status/2096565378927165795", "images": ["https://pbs.twimg.com/media/HRh-LalWoAA2uaI.jpg"], "type": "tweet"}, {"author": "himgajria", "summary": "Running commentary throughout the day on the RH/Solana rotation and chain narratives: 'every cycle has its chain' (prior winners rest on laurels, new challengers align with innovators), 'one chain is about PvPing other chains, one is about PvPing Wall Street - different ceilings,' adding he's put '10 Robinhoods worth of slop' into the market this year and that bitcoin sitting at $80k despite all the activity is notable.", "tweet_url": "https://x.com/himgajria/status/2096606777349706128", "type": "tweet"}]}, {"cluster": "OpenAI Astra Launch — Reactions Split on Capability", "category": ["AI", "tech"], "items": [{"author": "cryptopunk7213", "summary": "Calls Astra's capability jump 'indistinguishable from magic': watching non-designers recreate human anatomy in Blender and build simulated agent worlds, but flags something more concerning - the emergence of real agent 'personas,' swarms that plan, scheme, and hide in plain sight.", "tweet_url": "https://x.com/cryptopunk7213/status/2096466064901087440", "type": "tweet"}, {"author": "stevehou", "summary": "Contrarian take: ChatGPT/Astra still produces bad presentation decks, indistinguishable from a frontier model's output a year ago - no real progress on this specific capability, whether by lack of focus or a genuine technical hurdle.", "tweet_url": "https://x.com/stevehou/status/2096601504664703215", "type": "tweet"}, {"author": "aleabitoreddit", "summary": "Ran an experiment asking OpenAI Astra Ultra and Anthropic Fable 5.1 Max each to build a 5x-10x-in-one-year stock portfolio. Astra came back with obscure biotech names (KYTX, PRQR, VSTM, CNTB, RANI, IVA) plus familiar power names (SILC, AMPX, EOSE); Anthropic's Fable leaned into more recognizable momentum names (IREN, WULF, OKLO, SMR, RGTI, QBTS) alongside biotech binaries (INO, CAPR, GOSS, SLS). Author's read: Astra prefers obscure biotech, Fable's picks feel closer to retail/WSB consensus names - plans to revisit in a few months.", "tweet_url": "https://x.com/aleabitoreddit/status/2096605093986787380", "type": "tweet"}]}, {"cluster": "Sam Altman Amplifies AI-Concern Essay", "category": ["AI", "regulation"], "items": [{"author": "sama", "summary": "Called Jakub Pachocki's new essay 'An Alien Mind' - on why he's concerned about the next few years of AI and the choices needed to keep the future in humanity's hands - 'important.'", "tweet_url": "https://x.com/sama/status/2096647371983880383", "type": "tweet"}]}, {"cluster": "August Crypto Hacks: $136M Across 50 Incidents", "category": ["crypto", "regulation"], "items": [{"author": "stacy_muur", "summary": "Compiled the full list of publicly reported August crypto hacks (responding to a PeckShield alert on the $136.3M / 50-incident monthly total, down 49.5% from July's $270M). Largest: TectonicFi ~$74M, MoonwellDeFi ~$8.7M, Term Labs ~$8.5M, Coinsbuy ~$7.9M, TAC ~$7.5M, Injective ~$4.8M - plus a long tail down to five-figure incidents across dozens of smaller protocols.", "tweet_url": "https://x.com/stacy_muur/status/2096624967941247006", "type": "tweet"}]}, {"cluster": "ZachXBT Presses WooX on Delayed Withdrawals", "category": ["crypto", "regulation"], "items": [{"author": "zachxbt", "summary": "Publicly pressed WooX after user withdrawals reportedly went unprocessed for days, asking why the exchange deleted an earlier post threatening him and why its current ownership sits behind offshore entities.", "tweet_url": "https://x.com/zachxbt/status/2096622142121279528", "images": ["https://pbs.twimg.com/media/HRiyuSTbAAAt_RY.jpg", "https://pbs.twimg.com/media/HRiyuSNb0AAdmWh.jpg"], "type": "tweet"}]}], "B_insights": [{"author": "EMostaque", "summary": "Published what he calls the first from-scratch derivation of the Standard Model (including three generations) via a simpler path than heterotic string theory: filtering all compact Lie algebras/sub-algebras by chirality and anomaly cancellation leaves only e8 ⊃ e6 ⊕ su(3) → 27⊗57 surviving, with no extra dimensions or 10^500 vacua required. Says he found the core algebra in April, credits Fable and Astra for helping broaden the classification and build one-click verification, open-sourced the paper and code for PRs, and separately argues developers are 'crossing the threshold' now - next year AI writes better code than all but a few humans, 2027 it generates almost all code, 2028 people run out of ideas to give it.", "tweet_url": "https://x.com/EMostaque/status/2096610030267085143", "images": ["https://pbs.twimg.com/media/HRioybMbcAAEGLh.jpg", "https://pbs.twimg.com/media/HRiobUvaEAAIT-O.jpg", "https://pbs.twimg.com/media/HRiobrZbQAA6mg3.jpg"], "type": "thread"}, {"author": "udiWertheimer", "summary": "Argues the entire video-game production pipeline has been designed backwards for decades - modeling in 3D and reverse-engineering into an engine just so a gamer's hardware can render a target look. His thesis: keep only a basic greybox world model as ground truth and let a fast video model (fal's h3 max, Astra 6 low-effort) render it in real time as the 'game,' without needing to look like a game at all. Extends the idea to multiplayer: a future where a few hundred streamers actually drive the action while millions of fans watch generated renders, and argues control schemes (not just button-mashing) will change because the loop is no longer built around 1990s engine constraints.", "tweet_url": "https://x.com/udiWertheimer/status/2096556394719707526", "type": "thread"}, {"author": "VitalikButerin", "summary": "Congratulated the teams behind Poseidon hashes and general-purpose STARKs, crediting Poseidon for making client-side SNARKs fast enough for modern privacy protocols, and noting STARK overhead has fallen to mid-three-digits and may soon go single- or double-digit. Separately lays out a long-horizon cryptography forecast he calls the 'Egyptian God Protocols': 33% odds that SNARKs, FHE, and iO can all eventually run with a 1+ε overhead factor on real-world computation, 60% odds all three hit single-digit overhead, and thinks SNARKs alone likely hit single-digit overhead (as some hash functions and LLM inference already have) by decade's end.", "tweet_url": "https://x.com/VitalikButerin/status/2096587349635616865", "type": "thread"}, {"author": "elerianm", "summary": "Weekly note: strong US data and yield moves are colliding with political jawboning on the Fed, alongside broader sovereign bond yield volatility and currency shifts. Looking ahead: key US CPI/PPI prints and the start of a fresh round of central bank decisions.", "tweet_url": "https://x.com/elerianm/status/2096603182138863903", "images": ["https://pbs.twimg.com/media/HRihagOWIAMfKk1.jpg"], "type": "tweet"}, {"author": "dampedspring", "summary": "Dug into what happened to corporate bond spreads for German companies (VW, Mercedes, Siemens, Bayer, BASF) during Weimar hyperinflation, surprised no one (including himself) had run the analysis. First-pass finding: corporates massively outperformed sovereign debt - their real assets held value against the collapsing currency and let them buy back or let mature their existing debt, with corporate yields at times a fraction of, or even negative spread to, German government debt. Frames it as directly relevant to Luke [Gromen]'s Weimar-comparison thesis. Separately running an informal poll on whether followers are underweight/short vs. equal-or-overweight long US long-term treasuries.", "tweet_url": "https://x.com/dampedspring/status/2096557388706807939", "type": "thread"}, {"author": "ZeeContrarian1", "summary": "Doubling down on the AI-datacenter-power trade ($BTDR, $IREN) after a 50% drawdown across data-center names, citing Berkshire Hathaway CEO Greg Abel's comment that power/sites/permission will be the AI boom's next bottleneck; calls it the most asymmetric bet in the market at 17% portfolio allocation after last week's 20% move (funded partly by trimming $IONS). Follow-up essay argues America must build the power and the data centers domestically rather than outsource compute capacity abroad, drawing a direct parallel to Europe's pre-war overreliance on Russian gas - control of chips, power and networks is now a national-security asset, not just a commodity trade.", "tweet_url": "https://x.com/ZeeContrarian1/status/2096519372734902507", "images": ["https://pbs.twimg.com/media/HRha2W3WQAAbfEO.jpg" // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
