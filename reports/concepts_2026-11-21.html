or today's AI infrastructure leaders: early leaders often do not survive.", "quote": null, "locator": "Many have compared today’s investing environment", "quote_verified": false}, {"claim": "Booth expects some of today's AI market leaders to thrive, others to fail, and entirely new, currently undiscussed winners to emerge, noting Google did not go public until 2004 and Levi Strauss was a big winner of the Gold Rush.", "speaker": "David Booth", "type": "prediction", "entities": ["Google", "Levi Strauss", "AI market leaders"], "conviction": "medium", "so_what": "The eventual AI winners may be indirect or not yet public, so thematic picks in current leaders may miss them.", "quote": "Some of today’s market leaders will thrive. Others won’t.", "locator": "Some of today’s market leaders", "quote_verified": true}, {"claim": "Hyperscaler AI capital spending is expected to exceed $1.2 trillion in 2027 on data centers, chips and more (citing a Goldman estimate of a 50% rise), but Booth says the beneficiaries might be Big Tech or another sector entirely.", "speaker": "David Booth", "type": "data_point", "entities": ["Big Tech", "hyperscalers", "data centers", "chips", "Goldman Sachs"], "conviction": "medium", "so_what": "Massive AI capex is a known quantity; who captures its returns is not, arguing for broad rather than concentrated exposure.", "quote": null, "locator": "Public markets help finance thousands", "quote_verified": false}]}, {"theme": "Own the market instead", "insights": [{"claim": "Booth recommends owning public markets through a broadly diversified buy-and-hold portfolio that includes AI stocks and many others, so investors participate in whatever the future becomes rather than betting on what they think it will become.", "speaker": "David Booth", "type": "thesis", "entities": ["diversified portfolio", "public markets", "AI stocks"], "conviction": "high", "so_what": "Broad index-like exposure captures AI winners automatically without needing to identify them.", "quote": "participate in whatever the future becomes instead of betting on what you think it will become", "locator": "The good news is that you", "quote_verified": true}, {"claim": "Public markets finance thousands of competing ideas, tolerate spectacular failures, and move capital rapidly toward what works, which lets ordinary people, not just founders, VCs and insiders, share in innovation's wealth creation without overconcentration risk.", "speaker": "David Booth", "type": "framework", "entities": ["public markets", "venture capitalists"], "conviction": "medium", "so_what": "Public-market diversification is a democratized way to capture innovation upside versus concentrated private bets.", "quote": null, "locator": "Open public markets have expanded", "quote_verified": false}]}], "insight_total": 14, "top_entities": ["AI", "S&P 500", "Lucent Technologies", "Nextel Communications", "Google", "Levi Strauss", "Big Tech", "University of Chicago", "telecom", "data centers"], "source_meta": {"author": "David Booth, Founder and Chairman", "word_count": 2165, "paywalled": false}}, {"record_id": "1118df03fd084841", "source_type": "concepts", "source_name": "Dimensional Fund Advisors", "source_url": "https://www.dimensional.com/us-en/insights/after-the-ballots-markets-look-ahead", "title": "After the Ballots, Markets Look Ahead | Dimensional", "published_date": "2026-11-20", "language": "en", "processed_at": "2026-11-21T11:10:55Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Positioning", "Tech"], "gist": "Wes Crill (Dimensional) argues stocks rise over the long run regardless of party, but elections are price discovery events: after the 2026 US midterms the Russell 3000 fell ~2.8% over Nov 4-5 with sectors ranging from -8.07% (tech) to +2.84% (communication services). Historically, election-month sector winners and losers converge back to market returns afterward.", "themes": [{"theme": "Elections as price discovery", "insights": [{"claim": "Over the long term, US stocks have generally kept rising regardless of which political party held office, so election outcomes are not a reliable basis for long-run market timing.", "speaker": "Wes Crill", "type": "thesis", "entities": ["US stocks"], "conviction": "high", "so_what": "Avoid repositioning a long-term equity allocation around which party wins.", "quote": "stocks have generally continued their ascent", "locator": "The long-term view on markets", "quote_verified": true}, {"claim": "Markets do not ignore politics: elections act as a price discovery event in which stocks of companies expected to benefit from the result jump and those perceived as losers fall.", "speaker": "Wes Crill", "type": "framework", "entities": ["US stocks"], "conviction": "high", "so_what": "Expect sharp cross-sectional repricing right after elections rather than broad directional moves.", "quote": "elections are a price discovery opportunity for market participants", "locator": "That doesn’t mean markets ignore politics", "quote_verified": true}]}, {"theme": "2026 midterm sector dispersion", "insights": [{"claim": "Over November 4-5, 2026, right after the US midterm elections, the Russell 3000 Index fell about 2.8% while sector returns ranged from -8.07% for technology to +2.84% for communication services.", "speaker": "Wes Crill", "type": "data_point", "entities": ["Russell 3000", "technology sector", "communication services sector", "2026 US midterm elections"], "conviction": "high", "so_what": "Post-midterm dispersion was wide: tech was hit hardest, communication services held up.", "quote": null, "locator": "The days following the recent US midterm elections", "quote_verified": false}, {"claim": "The post-midterm sell-off in technology reversed 2026 year-to-date leadership: through Election Day, technology stocks had returned 23.1% versus 11.6% for the Russell 3000.", "speaker": "Wes Crill", "type": "data_point", "entities": ["technology sector", "Russell 3000"], "conviction": "high", "so_what": "Crowded YTD winners can be the most exposed to repricing on a surprise political outcome.", "quote": null, "locator": "This was quite a change from the 2026 results", "quote_verified": false}, {"claim": "The wide sector dispersion after the 2026 US midterms likely reflects the market resetting expectations for certain businesses after results many viewed as surprising.", "speaker": "Wes Crill", "type": "causal", "entities": ["2026 US midterm elections", "technology sector"], "conviction": "medium", "so_what": "Treat the post-election moves as expectation resets priced in quickly, not as an ongoing trend to chase.", "quote": null, "locator": "The dispersion among sectors could be evidence", "quote_verified": false}]}, {"theme": "Election-month winners fade", "insights": [{"claim": "Sectors with the largest outperformance or underperformance versus the market during election months tend to perform in line with the broader market afterward, so election-night winners do not reliably keep winning.", "speaker": "Wes Crill", "type": "contrarian", "entities": ["US equity sectors"], "conviction": "medium", "so_what": "Don't extrapolate election-month sector moves; post-election mean-convergence argues against chasing or panic-selling.", "quote": "election night winners don’t always continue to win", "locator": "Of course, it’s important for investors to remember", "quote_verified": true}]}], "insight_total": 6, "top_entities": ["Russell 3000", "technology sector", "communication services sector", "2026 US midterm elections", "US stocks"], "source_meta": {"author": "Wes Crill, PhD, Senior Client Solutions Director and Vice President", "word_count": 1313, "paywalled": false}}, {"record_id": "0f5bc4fc64e84018", "source_type": "concepts", "source_name": "Gavekal Research", "source_url": "https://research.gavekal.com/teaser/health-care-and-a-blast-from-the-past/", "title": "Health Care And A Blast From The Past", "published_date": "2026-11-20", "language": "en", "processed_at": "2026-11-21T11:10:32Z", "processor": "claude-code-sub-opus", "tags": ["Macro"], "gist": "Teaser only: Gavekal revisits the 'platform company' framework from its 2005 book Our Brave New World, in which Western firms keep design, R&D and marketing in-house and outsource capital-intensive, volatile manufacturing ('produce nowhere, sell everywhere'). The health-care application promised by the title is behind the paywall and not present in the visible text.", "themes": [{"theme": "Platform company model (2005)", "insights": [{"claim": "Gavekal's 2005 'platform company' framework holds that the vertical design/produce/sell business model (e.g. Ford designing, building in Detroit and selling an Expedition SUV via US dealers) gave way to a model of producing nowhere but selling everywhere.", "speaker": "Gavekal Research", "type": "framework", "entities": ["Gavekal Research", "Ford", "platform companies"], "conviction": "high", "so_what": "A lens for valuing firms by how much low-return production they have outsourced versus retained high-margin design and distribution.", "quote": "The new business model is to produce nowhere, but sell everywhere.", "locator": "Back in 2005, we published a book", "quote_verified": true}, {"claim": "Platform companies keep the high value-added functions of research, development, treasury and marketing in-house and farm out manufacturing to external producers, acting as organizers between client orders and producer delivery.", "speaker": "Gavekal Research", "type": "framework", "entities": ["platform companies"], "conviction": "high", "so_what": "Margin and capital efficiency accrue to whoever controls the customer and the IP, not the factory.", "quote": "Platform companies keep the high added-value parts of research, development, treasury and marketing in-house, and farm out all the rest to external producers", "locator": "Platform companies know where the clients are", "quote_verified": true}]}, {"theme": "Why manufacturing is a 'mug's game'", "insights": [{"claim": "In Gavekal's framework, Western companies shun production because it ties up capital, is labor-intensive, requires expensive inventories, is highly volatile, and is not rewarded by equity markets.", "speaker": "Gavekal Research", "type": "causal", "entities": ["Western companies", "manufacturing"], "conviction": "high", "so_what": "Explains the market premium on asset-light, non-cyclical business models and the discount on capital-heavy producers.", "quote": "out of the three things I do—designing, producing and selling—producing is a mug’s game.", "locator": "An increasing number of Western companies", "quote_verified": true}]}, {"theme": "Health-care angle (paywalled)", "insights": [{"claim": "Gavekal's Louis-Vincent Gave-bylined note revives the 2005 platform-company thesis in the context of health care, implying the outsourcing/asset-light framework is relevant to the sector, though the actual argument is not visible in the teaser.", "speaker": "Gavekal Research", "type": "thesis", "entities": ["health care", "Louis-Vincent Gave", "Gavekal Research"], "conviction": "exploratory", "so_what": "Flag for follow-up: the full piece may argue health-care firms are adopting or should adopt a platform model; unverifiable from this text.", "quote": null, "locator": "Health Care And A Blast From The Past", "quote_verified": false}]}], "insight_total": 4, "top_entities": ["Gavekal Research", "Louis-Vincent Gave", "Ford", "platform companies", "manufacturing", "health care"], "source_meta": {"author": "", "word_count": 337, "paywalled": false}}, {"record_id": "2e0f5a018c044da5", "source_type": "concepts", "source_name": "Gavekal Research", "source_url": "https://research.gavekal.com/teaser/financing-infrastructure-after-lgfvs/", "title": "Financing Infrastructure After LGFVs", "published_date": "2026-11-20", "language": "en", "processed_at": "2026-11-21T11:10:32Z", "processor": "claude-code-sub-opus", "tags": ["Macro"], "gist": "Teaser only: Gavekal argues China's infrastructure financing model is broken because Beijing, wary after repeated bailouts of LGFV hidden debts, has curtailed off-balance-sheet funding, and infrastructure projects' returns are too low to attract private capital. With infrastructure fixed-asset investment down 7.3% y/y through October and worsening, the government is choosing weaker growth over funding projects entirely with bonds and accepting rising official debt.", "themes": [{"theme": "China infrastructure funding squeeze post-LGFV", "insights": [{"claim": "China's central government, made wary by repeated bailouts of local government financing vehicles' (LGFVs) hidden debts, has been gradually curtailing the off-balance-sheet financing that local governments used to deliver high infrastructure investment without inflating official debt figures.", "speaker": "Gavekal Research", "type": "causal", "entities": ["China", "LGFVs", "China local governments", "China central government"], "conviction": "high", "so_what": "The traditional LGFV-driven infrastructure stimulus channel is being deliberately shut, so do not expect it to be reopened as a growth backstop.", "quote": "the repeated bailouts of local government financing vehicles’ (LGFVs) hidden debts have made the central government wary of this model", "locator": "For years, China’s local governments have relied", "quote_verified": true}, {"claim": "China's fixed-asset investment in infrastructure sectors fell 7.3% in the year through October 2026, with the decline deepening in recent months despite government pledges to stabilize investment.", "speaker": "Gavekal Research", "type": "data_point", "entities": ["China", "infrastructure fixed-asset investment"], "conviction": "high", "so_what": "Official stabilization pledges are not translating into spending; demand for infrastructure-linked commodities and materials (e.g. steel, cement) faces continued headwinds.", "quote": "Fixed-asset investment in infrastructure sectors is down 7.3% in the year through October", "locator": "Those curbs have built up over time", "quote_verified": true}, {"claim": "Financial returns on Chinese infrastructure projects remain too low to attract private-sector investors, so private capital cannot replace curtailed off-balance-sheet local-government funding.", "speaker": "Gavekal Research", "type": "thesis", "entities": ["China", "infrastructure projects", "private-sector investors"], "conviction": "high", "so_what": "PPP or private-capital schemes are unlikely to fill China's infrastructure funding gap; any revival must come from the government balance sheet.", "quote": "The math for financing infrastructure projects doesn’t work anymore.", "locator": "The reality is that the financial returns", "quote_verified": true}, {"claim": "Beijing faces a trade-off between funding infrastructure entirely with government bonds and accepting rising official debt, or letting infrastructure investment keep declining and accepting weaker growth, and Gavekal judges it is choosing weaker growth.", "speaker": "Gavekal Research", "type": "prediction", "entities": ["China", "China government bonds", "China central government"], "conviction": "high", "so_what": "Expect continued drag on Chinese growth from infrastructure rather than a large bond-financed stimulus; position cautiously on China-infrastructure-sensitive assets.", "quote": "either pay for infrastructure projects entirely with government bonds, and accept rising debt, or allow infrastructure investment to keep declining, and accept weaker growth. It is choosing the latter.", "locator": "That leaves the government with an unpleasant trade-off", "quote_verified": true}]}], "insight_total": 4, "top_entities": ["China", "LGFVs", "China local governments", "China central government", "infrastructure fixed-asset investment", "China government bonds"], "source_meta": {"author": "", "word_count": 190, "paywalled": false}}, {"record_id": "8eb111a818666f2b", "source_type": "concepts", "source_name": "Noema Magazine", "source_url": "https://www.noemamag.com/the-shenzhen-summit-supplants-yalta", "title": "The Shenzhen Summit Supplants Yalta | NOEMA", "published_date": "2026-11-20", "language": "en", "processed_at": "2026-11-21T11:11:19Z", "processor": "claude-code-sub-opus", "tags": ["Geopolitics", "Tech", "AI"], "gist": "Nathan Gardels argues the November 2026 Shenzhen APEC summit of Trump, Putin and Xi symbolized the replacement of the rules-based order with accommodating spheres of influence, with the US president now openly embracing Xi's and Putin's sovereignty-first views. Drawing on visits to Shenzhen since 1986, he traces China's rise from unplugged computers to a 20-million-person AI hub, its strategic tilt toward a dependent Russia, and contends technology is the issue most likely to trip the US-China Thucydides Trap — with China, absent from Yalta, now setting the agenda.", "themes": [{"theme": "Shenzhen summit as new order", "insights": [{"claim": "The November 2026 APEC summit in Shenzhen, where Trump, Putin and Xi met, mattered not for its substance but for its symbolism: it showcased a world in which the rules-based order has been supplanted by mutually accommodating spheres of influence.", "speaker": "Nathan Gardels", "type": "thesis", "entities": ["APEC", "Shenzhen", "Trump", "Vladimir Putin", "Xi Jinping"], "conviction": "high", "so_what": "Treat great-power spheres-of-influence accommodation as the operating geopolitical regime; discount assets and alliances whose value rests on a rules-based order.", "quote": "The significance of the conclave was precisely its enframing symbolism, showcasing a new world in which the rules-based order has been supplanted by spheres of influence accommodating each other.", "locator": "Pundits who dismissed the Shenzhen summit", "quote_verified": true}, {"claim": "Public language at the Shenzhen summit about zones of 'civilizational values' and the primacy of state sovereignty over international law was code for Xi's and Putin's long-held views, which the American president has now openly embraced.", "speaker": "Nathan Gardels", "type": "thesis", "entities": ["Xi Jinping", "Vladimir Putin", "Trump", "international law"], "conviction": "high", "so_what": "US endorsement of sovereignty-over-law framing lowers the expected cost of regional coercion by great powers; raise geopolitical risk premia for states on the borders of China and Russia.", "quote": "The few words spoken for public consumption at the Shenzhen summit about zones of “civilizational values” and the primacy of state sovereignty over international law were code", "locator": "The few words spoken for public consumption", "quote_verified": true}, {"claim": "China, the one key power excluded from the 1945 Yalta talks that shaped the post-WWII order, is now setting the agenda for the next international order, with Xi hosting the US and Russian leaders in its tech capital as the 'icing on the cake' of national rejuvenation.", "speaker": "Nathan Gardels", "type": "framework", "entities": ["China", "Yalta", "Xi Jinping", "Shenzhen"], "conviction": "high", "so_what": "Frames China as agenda-setter rather than rule-taker; expect Beijing-led institutional and standard-setting initiatives to gain traction.", "quote": "The one key power left out of the 1945 Yalta talks that shaped the international order in the dying days of World War II is now setting the agenda for what comes next.", "locator": "For Xi, hosting both leaders", "quote_verified": true}]}, {"theme": "Shenzhen's 40-year tech ascent", "insights": [{"claim": "In 1986 Shenzhen's so-called tech hub consisted of nearly empty warehouses of dusty, unplugged desktop computers; 40 years later it is a technopolis of 20 million people regarded as China's 'Silicon Valley'.", "speaker": "Nathan Gardels", "type": "anecdote", "entities": ["Shenzhen", "Deng Xiaoping", "Jerry Brown"], "conviction": "high", "so_what": "A reminder that early-stage Chinese industrial build-outs that look embarrassing can compound into world-class clusters; underestimating Chinese catch-up has repeatedly been a costly error.", "quote": "What then passed for “data centers” were cavernous, virtually empty warehouses with scores of desktop computers on worktables gathering dust — none were even plugged in.", "locator": "On an inspection tour of sprouting", "quote_verified": true}, {"claim": "Shenzhen, home to Huawei, Tencent, DJI and BYD, is the center of gravity of China's AI battle with the United States.", "speaker": "Nathan Gardels", "type": "data_point", "entities": ["Shenzhen", "Huawei", "Tencent", "DJI", "BYD", "AI"], "conviction": "high", "so_what": "Shenzhen-based champions are the frontline of the US-China tech contest — most exposed to both state support and US export controls/sanctions.", "quote": "It is the center of gravity of China’s AI battle with the United States.", "locator": "What seemed embarrassing at the time", "quote_verified": true}, {"claim": "Shenzhen was designated a special economic zone by Deng Xiaoping to attract foreign capital and technology; Xi Zhongxun, Xi Jinping's father and then Guangdong Party chief, visited California in 1980 seeking investment for it as a key platform of 'reform and opening up'.", "speaker": "Nathan Gardels", "type": "anecdote", "entities": ["Deng Xiaoping", "Xi Zhongxun", "Xi Jinping", "Guangdong", "California", "Silicon Valley"], "conviction": "medium", "so_what": "Highlights how Western capital and technology seeded the competitor that now challenges US tech supremacy.", "quote": null, "locator": "The invitation to visit had come", "quote_verified": false}]}, {"theme": "Infrastructure capacity reversal", "insights": [{"claim": "When Governor Jerry Brown asked visiting Vice-President Xi Jinping in 2012 whether China would help finance California's bullet train, the Chinese later offered financing terms too tough to accept — those who once came 'cup in hand' to California now held the financial upper hand.", "speaker": "Nathan Gardels", "type": "anecdote", "entities": ["Jerry Brown", "Xi Jinping", "California high-speed rail", "China"], "conviction": "medium", "so_what": "Signals a reversal in capital power: Chinese state financing comes with hard terms, and US public infrastructure cannot count on it.", "quote": "Those who had once come cup in hand to the Golden State now offered financing terms too tough to abide.", "locator": "A Chinese delegation later met", "quote_verified": true}, {"claim": "By 2026 China had built a 30,000-mile bullet-train network across the country, while California and the US still have not built a single bullet train after decades of planning.", "speaker": "Nathan Gardels", "type": "data_point", "entities": ["China", "high-speed rail", "California", "United States"], "conviction": "high", "so_what": "Concrete gauge of the state-capacity gap in infrastructure delivery; underpins Beijing's narrative of American decline and favors Chinese rail/infrastructure exporters in third markets.", "quote": "By 2026, China had built a 30,000-mile network of bullet trains spanning its vast country. California and the U.S. still have yet to build one.", "locator": "A Chinese delegation later met", "quote_verified": true}, {"claim": "The author imagines a Chinese Politburo ideology chief today asserting that America, though still formidable, is 'crumbling within', its aging systems plagued by outages and unable to build even one bullet train.", "speaker": "Nathan Gardels", "type": "thesis", "entities": ["China", "United States", "Politburo"], "conviction": "medium", "so_what": "Captures Beijing's perceived-decline lens on the US, which emboldens harder Chinese bargaining positions in trade and tech negotiations.", "quote": "It is crumbling within. Its aging systems are plagued by outages. It can’t even build one bullet train.", "locator": "If I were to have a conversation", "quote_verified": true}]}, {"theme": "Russia-China alignment history", "insights": [{"claim": "In 1986 Politburo ideology chief Hu Qili said China had cut its military by one million soldiers and was converting military plants to make refrigerators and motorcycles, while dismissing the Soviet 'polar bear' threat because Russia could not even consolidate control of Cambodia.", "speaker": "Nathan Gardels", "type": "anecdote", "entities": ["Hu Qili", "China", "Soviet Union", "People's Liberation Army"], "conviction": "medium", "so_what": "Shows how far China's posture has swung — from demobilization and hostility to Moscow toward military buildup and alignment with Russia.", "quote": null, "locator": "On that 1986 trip to China", "quote_verified": false}, {"claim": "After the Tiananmen crackdown in 1989, Deng Xiaoping drew a hard line on Party control, and Gorbachev's 'new thinking' has since been vilified in Beijing as a recipe for Party-state collapse to be avoided at all costs.", "speaker": "Nathan Gardels", "type": "causal", "entities": ["Deng Xiaoping", "Mikhail Gorbachev", "Tiananmen", "Zhao Ziyang", "Chinese Communist Party"], "conviction": "high", "so_what": "Political liberalization in China should be assumed off the table; economic opening coexists with an 'iron fist' on political reform.", "quote": "Deng’s open palm on the economy clenched into an iron fist on political reform.", "locator": "Deng had drawn the line", "quote_verified": true}, {"claim": "China's leaders came to strategically favor Putin, an autocrat obsessed with dominating his own neighborhood, over an America they see as endlessly trying to subvert China's governing system, with the 'hegemonist threat' shifting from Russia to the US even as China prospered from the US relationship.", "speaker": "Nathan Gardels", "type": "causal", "entities": ["China", "Vladimir Putin", "Russia", "United States"], "conviction": "high", "so_what": "The Sino-Russian alignment is rooted in regime-security logic, not transactional convenience — bet on its durability r and AI-hardware names carry persistent US-China policy risk.", "quote": "it is clear that of all the contested issues between the U.S. and China, technology is most likely to trip the trap. The Nvidia episode is but one skirmish in a larger battle.", "locator": "At our 2013 meeting, Xi pointedly", "quote_verified": true}, {"claim": "Xi views the 'Made in China 2025' campaign, launched by Premier Li Keqiang in 2015 to conquer technologies from EVs and batteries to AI within a decade, as rocket fuel for national rejuvenation and a guard against falling behind the West as in the late Qing era.", "speaker": "Nathan Gardels", "type": "causal", "entities": ["Made in China 2025", "Li Keqiang", "Xi Jinping", "electric vehicles", "batteries", "AI"], "conviction": "high", "so_what": "China's tech drive is an existential, ideological priority, so state support for EVs, batteries and AI will persist regardless of trade concessions.", "quote": null, "locator": "In 2015, then Premier Li Keqiang", "quote_verified": false}, {"claim": "Strategists across the US partisan spectrum see China's unrelenting push for technological goals as an existential threat to American technological supremacy and the military might and geopolitical sway it implies.", "speaker": "Nathan Gardels", "type": "thesis", "entities": ["United States", "China", "technology"], "conviction": "high", "so_what": "Bipartisan consensus means tech restrictions on China are durable across US administrations.", "quote": null, "locator": "Strategists in Washington across", "quote_verified": false}, {"claim": "The author imagines Chinese leadership claiming it has shown it can go head-to-head with America on AI, has the world's largest navy and is scaling its nuclear arsenal toward parity with the US and Russia.", "speaker": "Nathan Gardels", "type": "thesis", "entities": ["China", "AI", "navy", "nuclear arsenal", "United States", "Russia"], "conviction": "medium", "so_what": "Chinese military buildup toward nuclear parity raises long-run defense spending demand among the US and allies.", "quote": "We have the largest navy in the world and are scaling up our nuclear arsenal toward parity with the U.S. and Russia.", "locator": "If I were to have a conversation", "quote_verified": true}]}], "insight_total": 18, "top_entities": ["Xi Jinping", "Vladimir Putin", "Trump", "Shenzhen", "China", "United States", "Russia", "Huawei", "Nvidia", "Made in China 2025", "Deng Xiaoping", "Mikhail Gorbachev"], "source_meta": {"author": "NATHAN GARDELS", "word_count": 1753, "paywalled": false}}, {"record_id": "64de76bf2ff8bc68", "source_type": "concepts", "source_name": "Packy McCormick / Not Boring", "source_url": "https://www.notboring.co/p/weekly-dose-of-optimism-220", "title": "Weekly Dose of Optimism #220", "published_date": "2026-11-20", "language": "en", "processed_at": "2026-11-21T11:10:37Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI", "Energy", "Society"], "gist": "Packy McCormick's weekly optimism roundup argues that SpaceX's orbital Starship catch makes full reusability real (marginal launch cost to ~$2-10M), highlights a 41%-mortality-reduction Phase 3 AML vaccine and a pancreatic cancer pill, Palmer Luckey's 1,000-year SLAB seastead, Tesla's Powercore solid-state transformer as evidence of two US industrial bases, and Earth AI's AI-found 3km copper-gold-PGM system. Extra Doses (Anthropic IPO, Google models, big AI rounds) are paywalled.", "themes": [{"theme": "Starship full reusability economics", "insights": [{"claim": "SpaceX caught an orbital Starship upper stage (Ship 42, Flight 15) with Mechazilla's chopsticks after it reached orbit, deployed Starlink satellites, and spent 22+ hours in space, completing the last major step toward rapid full reusability.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["SpaceX", "Starship", "Mechazilla", "Starlink"], "conviction": "high", "so_what": "Removes the key technical risk to Starship's cost thesis; watch heat-shield durability and turnaround time as the next milestones.", "quote": "Catching the orbital upper stage, the part that goes into orbit carrying the payload to complete a mission, was the final boss of rapid, full reusability. The final boss is dead.", "locator": "(1) SpaceX’s Mechazilla Catches an Orbital Starship", "quote_verified": true}, {"claim": "With the Super Heavy booster (about 70% of Starship's cost) already reusable, the expendable upper stage was roughly 90% of Starship's marginal per-flight cost, imposing a $30-40M per-launch floor; reusing the upper stage cuts marginal launch cost to about $2-10M, or $20-100/kg versus Falcon 9's ~$1,000/kg internal cost.", "speaker": "Packy McCormick", "type": "causal", "entities": ["SpaceX", "Starship", "Falcon 9", "Super Heavy"], "conviction": "high", "so_what": "A 10-50x drop in $/kg to orbit reprices every space business model (satellites, orbital data centers, in-space manufacturing).", "quote": "the marginal cost of launch drops to something like $2-10M per launch, or $20-100/kg versus Falcon 9’s $1,000/kg internal cost", "locator": "While the booster is more expensive at around 70%", "quote_verified": true}, {"claim": "SpaceX aims to fly about two Starships a week by end of 2027, hundreds per year by 2029, and multiple per day beyond that, carrying satellites, data centers and drug factories.", "speaker": "Packy McCormick", "type": "prediction", "entities": ["SpaceX", "Starship", "space data centers", "in-space manufacturing"], "conviction": "medium", "so_what": "Launch cadence targets set the demand ramp for orbital data center and in-space pharma plays; track actual cadence against these dates.", "quote": null, "locator": "SpaceX still has plenty of work ahead on heat-shield", "quote_verified": false}]}, {"theme": "Cancer therapy breakthroughs", "insights": [{"claim": "SELLAS Life Sciences and Memorial Sloan Kettering reported positive Phase 3 REGAL results for galinpepimut-S (GPS), an AML immunotherapeutic vaccine: in 126 relapsed, transplant-ineligible patients in second-or-later remission, GPS alone delivered 24.0 months median overall survival versus 14.7 months for best available treatment, a 41% reduction in risk of death.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["SELLAS Life Sciences", "Memorial Sloan Kettering", "galinpepimut-S", "acute myeloid leukemia"], "conviction": "high", "so_what": "Positive pivotal data in a high-unmet-need population is a regulatory catalyst for SELLAS; AML has ~33% five-year survival and kills ~11,500 Americans a year.", "quote": null, "locator": "(2) Leukemia Vaccine Cuts Risk of Death by 41%", "quote_verified": false}, {"claim": "GPS is an off-the-shelf peptide vaccine targeting WT1 rather than a personalized tumor-derived vaccine like Merck and Moderna's mRNA melanoma vaccine, which should make it faster, cheaper and more widely available, and WT1's presence in multiple blood cancers and solid tumors suggests possible label expansion beyond AML.", "speaker": "Packy McCormick", "type": "thesis", "entities": ["galinpepimut-S", "WT1", "Merck", "Moderna", "peptide vaccines", "mRNA cancer vaccines"], "conviction": "medium", "so_what": "Off-the-shelf manufacturing plus multi-indication target potential improves commercial scalability versus bespoke cancer vaccines.", "quote": null, "locator": "This isn’t the first promising vaccine this year.", "quote_verified": false}, {"claim": "Life-extending cancer therapies that are not cures still have option value: extra months of survival buy patients time for more permanent cures under development, so incremental survival gains compound as the therapy pipeline accelerates.", "speaker": "Packy McCormick", "type": "framework", "entities": ["cancer therapeutics"], "conviction": "medium", "so_what": "Frames incremental-survival drugs as both direct value and a bridge to future treatments, supporting sustained oncology investment.", "quote": "an extra nine months both nine months and a call option on much longer", "locator": "While it’s not a total cure", "quote_verified": true}, {"claim": "A new pancreatic cancer pill reported by the BBC shrank tumors to undetectable levels in one in 12 patients and halted tumor growth in 90% of 61 patients, with experts calling it the biggest pancreatic cancer breakthrough in decades, though durability is unknown.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["pancreatic cancer", "BBC"], "conviction": "medium", "so_what": "Pancreatic cancer is among the hardest-to-drug cancers; early efficacy here signals a broader acceleration in oncology that investors should track.", "quote": null, "locator": "(2a) Pancreatic cancer pill trial saw tumours vanish", "quote_verified": false}, {"claim": "2026 has been an unusually strong year for cancer treatment readouts, and the author expects the pace of breakthroughs to continue.", "speaker": "Packy McCormick", "type": "prediction", "entities": ["oncology", "cancer vaccines"], "conviction": "medium", "so_what": "Sentiment tailwind for oncology biotech as multiple Phase 3 wins stack up.", "quote": null, "locator": "And if this year’s pace in cancer treatments", "quote_verified": false}]}, {"theme": "Palmer Luckey's SLAB seastead", "insights": [{"claim": "Palmer Luckey revealed SLAB, a privately funded offshore floating industrial seastead with a 1,000-year design life that he has been building since selling Oculus to Facebook for $2 billion in 2014, capitalized with friends at a $1 billion valuation.", "speaker": "Packy McCormick", "type": "data_point", "entities": ["Palmer Luckey", "SLAB", "Oculus", "Facebook", "Anduril"], "conviction": "high", "so_what": "A billionaire-backed bet on ocean platforms as industrial real estate; watch for capital raises and first operating tenants.", "quote": null, "locator": "(3) Palmer Luckey Reveals SLAB", "quote_verified": false}, {"claim": "SLAB is designed to be cheaper than land and to operate outside "speaker": "Packy McCormick", "type": "data_point", "entities": ["Anthropic", "Google", "Isomorphic Labs", "Science Corp", "Genesis AI", "Prime Intellect"], "conviction": "medium", "so_what": "Signals extremely large AI capital-market events; details are behind the paywall so verify independently.", "quote": null, "locator": "EXTRA DOSES: Science Breakthroughs, Anthropic $1.5T IPO", "quote_verified": false}, {"claim": "The author says almost every item in this week's Extra Doses would have made the top five as recently as three months earlier, implying the pace of breakthrough news is accelerating sharply.", "speaker": "Packy McCormick", "type": "thesis", "entities": ["technology progress"], "conviction": "medium", "so_what": "Pace-of-progress sentiment marker from a widely read tech-optimist newsletter.", "quote": "Almost everything in Extra Dose would have made the top 5 even like 3 months ago.", "locator": "What a week to be alive.", "quote_verified": true}]}], "insight_total": 19, "top_entities": ["SpaceX", "Starship", "SELLAS Life Sciences", "galinpepimut-S", "Palmer Luckey", "SLAB", "Tesla", "Powercore", "Heron Power", "Earth AI", "Alpheus", "Anthropic"], "source_meta": {"author": "Packy McCormick", "word_count": 2161, "paywalled": false}}, {"record_id": "1bd101e498ba3c99", "source_type": "concepts", "source_name": "World Economic Forum", "source_url": "https://www.weforum.org/publications/the-ai-energy-readiness-compass-aligning-ai-ambition-with-energy-system-realities", "title": "AI Energy Readiness: Aligning AI Ambition with Power Systems | World Economic Forum", "published_date": "2026-11-20", "language": "en", "processed_at": "2026-11-21T11:10:31Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Energy", "Tech"], "gist": "Landing page for a World Economic Forum / Accenture report, 'The AI Energy Readiness Compass', which argues that electricity use at AI-focused data centres is expected to triple by 2030 and that AI build-outs must be matched to local energy-system capacity. It offers a five-step coordination methodology for governments, utilities, industry and communities; the page has no detailed data beyond the 2030 projection.", "themes": [{"theme": "AI data-centre power demand", "insights": [{"claim": "Electricity consumption at AI-focused data centres is expected to triple by 2030, according to a World Economic Forum report produced with Accenture.", "speaker": "World Economic Forum", "type": "prediction", "entities": ["AI data centres", "electricity demand", "World Economic Forum", "Accenture"], "conviction": "high", "so_what": "A tripling of AI data-centre load by 2030 supports demand for generation, grid and utility capacity; track where actual buildouts land against this path.", "quote": "Electricity consumption at AI-focused data centres is expected to triple by 2030", "locator": "As AI infrastructure rapidly scales", "quote_verified": true}, {"claim": "The World Economic Forum argues that, as AI infrastructure scales, digital and energy-system decisions are increasingly interconnected, so AI siting and grid planning can no longer be decided separately.", "speaker": "World Economic Forum", "type": "causal", "entities": ["AI infrastructure", "energy systems", "utilities"], "conviction": "medium", "so_what": "Energy-system constraints are becoming a binding input into where and how fast AI capacity gets built; regions with grid headroom gain an edge.", "quote": null, "locator": "As AI infrastructure rapidly scales", "quote_verified": false}]}, {"theme": "Readiness as ecosystem fit", "insights": [{"claim": "The World Economic Forum defines AI energy readiness as matching AI ambitions to an ecosystem's capacity to support competitive, net-positive development that reinforces rather than burdens existing energy systems.", "speaker": "World Economic Forum", "type": "framework", "entities": ["AI energy readiness", "energy systems", "governments", "utilities", "communities"], "conviction": "medium", "so_what": "Projects seen as burdening local grids face more policy and community pushback; projects that bring grid benefits may move faster.", "quote": "Readiness requires matching AI ambitions to an ecosystem’s capacity to support competitive, net-positive development while reinforcing, rather than burdening, existing systems.", "locator": "As AI infrastructure rapidly scales", "quote_verified": true}]}, {"theme": "Five-step AI Energy Readiness Compass", "insights": [{"claim": "The AI Energy Readiness Compass from the World Economic Forum and Accenture sets out five steps for aligning AI and energy development: assess constraints and innovations, engage actors, evaluate strategic choices, build an action plan, and monitor and adapt as conditions change.", "speaker": "World Economic Forum", "type": "framework", "entities": ["AI Energy Readiness Compass", "World Economic Forum", "Accenture"], "conviction": "medium", "so_what": "This is a likely template for policymakers and utilities planning AI loads; watch for its adoption through the WEF's AI Energy Impact Global Community.", "quote": null, "locator": "Developed by the World Economic Forum with Accenture", "quote_verified": false}]}], "insight_total": 4, "top_entities": ["World Economic Forum", "Accenture", "AI Energy Readiness Compass", "AI data centres", "energy systems", "utilities", "AI Energy Impact Global Community"], "source_meta": {"author": "", "word_count": 222, "paywalled": false}}, {"record_id": "3403baf603ea0dfb", "source_type": "concepts", "source_name": "World Economic Forum", "source_url": "https://www.weforum.org/stories/health-and-healthcare-systems/health-investment-framework-common-language-g20", "title": "Health Investment Framework: G20 Common Language Guide | World Economic Forum", "published_date": "2026-11-20", "language": "en", "processed_at": "2026-11-21T11:10:34Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Society"], "gist": "Health has never been organized as an asset class: DFIs share only three headcount/compliance health indicators and neither the EU taxonomy nor the G20 sustainable finance work covers health, so investors cannot underwrite it. Drawing on the 2016 G20 green-finance precedent, the article proposes a voluntary four-layer Health Investment Framework and asks the G20 to adopt a common health-investment language under the UK's 2027 presidency.", "themes": [{"theme": "Health is not yet an asset class", "insights": [{"claim": "Twenty-eight development finance institutions have agreed on 30 common indicators for ICT investment but only three for health (patients served, facilities accredited, number of accreditations), none of which measure health outcomes.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["development finance institutions", "health sector", "ICT"], "conviction": "high", "so_what": "DFI health impact reporting measures headcount and compliance, not outcomes, so 'health impact' claims in DFI-backed deals are hard to verify or compare.", "quote": "For health, they have agreed on just three: patients served, facilities accredited and number of accreditations.", "locator": "There is an asymmetry at play", "quote_verified": true}, {"claim": "Health has never been organized as an asset class: development banks each apply their own health lending criteria and other investors have no common reference point.", "speaker": "World Economic Forum", "type": "thesis", "entities": ["development banks", "health sector"], "conviction": "high", "so_what": "Absence of a shared definition is the structural barrier to scaled institutional capital in health, not lack of returns.", "quote": "This asymmetry shows that health has never been organized as an asset class.", "locator": "This asymmetry shows that health", "quote_verified": true}, {"claim": "Neither the EU taxonomy for sustainable activities nor the G20 sustainable finance workstream includes health, whereas green finance has had market-built definitions since 2013 and an official EU classification since 2020.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["EU taxonomy", "G20", "green finance"], "conviction": "high", "so_what": "Health-labelled sustainable products lack regulatory classification, leaving them exposed to inconsistency and 'health-washing' risk versus green assets.", "quote": null, "locator": "This asymmetry shows that health", "quote_verified": false}, {"claim": "Health projects sit inside social and sustainability bonds where each issuer decides what counts as a health investment, so allocators cannot compare two health assets in one portfolio.", "speaker": "World Economic Forum", "type": "causal", "entities": ["social bonds", "sustainability bonds", "asset managers"], "conviction": "high", "so_what": "Watch for standardised health-use-of-proceeds criteria; until then, health allocations within social bond portfolios are not comparable.", "quote": "it is a tag with no measure of performance behind it", "locator": "Rather, health is hard to underwrite", "quote_verified": true}]}, {"theme": "Spend smarter, not more", "insights": [{"claim": "In 2022 health spending as a share of GDP fell in 33 of 38 OECD countries and in 18 G20 members, even as ageing populations and chronic disease raised demand on health systems.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["OECD", "G20", "health spending"], "conviction": "high", "so_what": "Fiscal pressure is squeezing public health budgets against rising demand, widening the gap private capital could fill.", "quote": null, "locator": "Finance ministers are used to requests", "quote_verified": false}, {"claim": "Requests for more health money are more likely to be refused when budgets are tight, and more money does not always buy better health: some G20 economies spend several times more per person than peers yet have shorter life expectancy.", "speaker": "World Economic Forum", "type": "contrarian", "entities": ["G20", "finance ministries"], "conviction": "high", "so_what": "Policy momentum favours efficiency and outcome-based spending over headline budget increases; outcome-linked models gain relevance.", "quote": "Nor does more money always buy better health.", "locator": "More money is not the answer", "quote_verified": true}, {"claim": "The OECD estimates healthier populations and less wasteful spending, supported by digital transformation, could hold health spending at 10.6% of GDP by 2040 versus 11.8% without major policy change, a 1.2 percentage-point gap.", "speaker": "World Economic Forum", "type": "prediction", "entities": ["OECD", "digital health"], "conviction": "medium", "so_what": "A 1.2pp-of-GDP saving gives finance ministries a fiscal case for prevention and digital health tools.", "quote": "For finance ministries, that 1.2 percentage points of GDP is a clear argument for spending more wisely.", "locator": "More money is not the answer", "quote_verified": true}, {"claim": "Every $1 invested in improving population health is estimated to generate $2 to $4 in economic benefit, so returns are not what keeps health marginal in sustainable finance; the problem is that health is hard to underwrite.", "speaker": "World Economic Forum", "type": "contrarian", "entities": ["asset managers", "sustainable finance"], "conviction": "medium", "so_what": "The investability gap is a measurement/definition problem, implying upside once standards arrive rather than a weak return profile.", "quote": "the answer is rarely returns", "locator": "Why capital stays away", "quote_verified": true}]}, {"theme": "Green finance 2016 playbook", "insights": [{"claim": "In 2016 under China's presidency the G20 set up a Green Finance Study Group co-chaired with the UK, which flagged unclear definitions as a barrier; the G20 gave the issue official standing and standard setters did the rest.", "speaker": "World Economic Forum", "type": "anecdote", "entities": ["G20", "China", "UK", "Green Finance Study Group"], "conviction": "high", "so_what": "Precedent suggests G20 endorsement can catalyse standard-setting and a new labelled market, as happened for green bonds.", "quote": "By convening the work, the G20 gave the issue official standing; standard setters did the rest.", "locator": "The G20 has done this before", "quote_verified": true}, {"claim": "Health finance today is where green finance was in 2016: market tools such as ICMA's health category and the SASB Health Care standards exist, but there is no shared definition of a health investment.", "speaker": "World Economic Forum", "type": "framework", "entities": ["ICMA", "SASB", "green finance"], "conviction": "high", "so_what": "If the analogy holds, a health-labelled market could follow a green-bond-like growth path once definitions standardise.", "quote": "Health today is where green finance was in 2016", "locator": "Health today is where green finance", "quote_verified": true}]}, {"theme": "The Health Investment Framework", "insights": [{"claim": "The G20 & G7 Health and Development Partnership has built a voluntary Health Investment Framework with a steering committee including the EIB, EBRD, Council of Europe Development Bank, World Economic Forum, OECD, WHO, Milken Institute, PIMCO and UNICEF.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["G20 & G7 Health and Development Partnership", "European Investment Bank", "EBRD", "Council of Europe Development Bank", "OECD", "World Health Organization", "Milken Institute", "PIMCO", "UNICEF"], "conviction": "high", "so_what": "Involvement of DFIs and a major asset manager (PIMCO) raises odds the framework becomes a market reference.", "quote": null, "locator": "A framework built from what already exists", "quote_verified": false}, {"claim": "The Health Investment Framework tests investments through four layers: qualifying questions, six principles (access, outcomes, system resilience, health workforce, environmental integrity, ps://www.weforum.org/stories/financial-and-monetary-systems/pension-fund-domestic-investment-global-economic-impact", "title": "Pension Fund Investments: Global Economic Impact & Home Bias | World Economic Forum", "published_date": "2026-11-19", "language": "en", "processed_at": "2026-11-21T11:10:35Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Geopolitics", "Positioning"], "gist": "Governments in Canada, the UK, Japan and Australia are nudging pension funds to invest more at home, reversing two decades of falling home bias that sent capital mostly to the US (73% of MSCI World). Yeung argues the benefits hinge on additionality and attractive domestic assets, while politically driven allocation risks weaker returns, concentration risk, eroded pensioner trust and further global financial fragmentation.", "themes": [{"theme": "Declining pension home bias and US concentration", "insights": [{"claim": "Pension fund home bias has been falling: the Thinking Ahead Institute finds average domestic equity exposure in surveyed economies dropped from 57.1% in 2004 to 34.1% in 2024.", "speaker": "Harry Yeung", "type": "data_point", "entities": ["Thinking Ahead Institute", "pension funds"], "conviction": "high", "so_what": "Two decades of outward pension flows are the baseline that government home-bias pushes now threaten to reverse.", "quote": null, "locator": "How pension funds usually invest", "quote_verified": false}, {"claim": "European investors allocate about €300 billion annually to assets outside the EU, primarily into the US.", "speaker": "Harry Yeung", "type": "data_point", "entities": ["European investors", "EU", "United States"], "conviction": "high", "so_what": "A reversal of even part of this flow would be a material headwind for US asset demand and a tailwind for European assets.", "quote": null, "locator": "How pension funds usually invest", "quote_verified": false}, {"claim": "The US makes up roughly 73% of the MSCI World Index as of Q3 2026, versus // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
