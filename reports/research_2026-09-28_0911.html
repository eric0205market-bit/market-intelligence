  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function render(){
  const list = document.getElementById('cardlist');
  let html = '';
  ITEMS.forEach((item, idx) => {
    const color = CAT_COLORS[item.cat] || '#888';
    const urg = URG_META[item.urgency];
    const visible = (activeCat === 'all' || activeCat === item.cat) && (activeUrg === 'all' || activeUrg === item.urgency);
    const chartMark = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');
    html += '<div class="card' + (visible ? '' : ' hidden') + '" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">' + String(idx+1).padStart(2,'0') + '</span>';
    html += '<span class="urg">' + urg.emoji + '</span>';
    html += '<span class="badge" style="background:' + color + '">' + esc(item.source.split(' / ')[0].split(' —')[0]) + '</span>';
    html += '<span class="catpill">' + item.cat + '</span>';
    if(chartMark) html += '<span class="chartmark">' + chartMark + '</span>';
    html += '<span class="card-title">' + esc(item.title) + '</span>';
    html += '</div>';
    html += '<div class="card-body">';
    html += '<div class="section-label">The Idea</div><div class="idea">' + esc(item.idea) + '</div>';
    html += '<div class="section-label">My Angle</div><div class="angle" style="border-color:' + color + ';background:' + color + '14;">' + esc(item.angle) + '</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + esc(item.tweetA) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + esc(item.tweetB) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    html += '<div class="charts-box' + (item.charts.hot ? ' hot' : '') + '">' + (item.charts.count > 0 ? item.charts.count + ' chart(s) — ' : 'No charts — ') + esc(item.charts.desc) + '</div>';
    html += '<a class="readlink" href="' + item.link + '" target="_blank">↗ Read full article</a>';
    html += '</div></div>';
  });
  list.innerHTML = html;
}

function renderReport(){
  const el = document.getElementById('reportBody');
  let html = '<div><strong>Window:</strong> ' + META.windowStart + ' → ' + META.windowEnd + ' (last 6 hours, strict boundary)</div>';
  html += '<div style="margin-top:6px;"><strong>Emails in window:</strong> ' + META.emailsInWindow + ' &nbsp;·&nbsp; <strong>Emails read:</strong> ' + META.emailsRead + ' &nbsp;·&nbsp; <strong>Items extracted:</strong> ' + META.itemsExtracted + '</div>';
  html += '<div class="section-label" style="margin-top:16px;">Included Sources</div><ul>';
  META.includedSources.forEach(s => {
    html += '<li><span class="srcname" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + esc(s.name) + '</span> — ' + s.count + ' item' + (s.count>1?'s':'') + '</li>';
  });
  html += '</ul>';
  html += '<div class="section-label">Skipped Sources</div><ul>';
  META.skippedSources.forEach(s => {
    html += '<li class="skiprow"><strong>' + esc(s.name) + '</strong> — ' + esc(s.reason) + '</li>';
  });
  html += '</ul>';
  el.innerHTML = html;
}

document.getElementById('metaLine').textContent = META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails (' + META.includedSources.length + ' sources)';
buildFilters();
render();
renderReport();
</script>
</body>
</html>
