etric they are judged on rewards a clean exit, not a durable company.", "quote": "VC success is measured based on price at entry and price at exit on an investment, rather than the quality of the business built", "locator": "The second is that VC success is measured based on price at entry", "quote_verified": true}, {"claim": "On Cambridge Associates data, the median venture capitalist has not harvested materially more alpha than the median mutual fund manager or private equity investor, undercutting the premium narrative around the asset class.", "speaker": "Aswath Damodaran", "type": "data_point", "entities": ["Cambridge Associates", "venture capital", "private equity", "mutual funds"], "conviction": "high", "so_what": "Allocators paying VC-level fees for median exposure are buying illiquidity without the excess return — manager selection is the entire proposition.", "quote": null, "locator": "the median venture capitalist has not been much better at harvesting alpha", "quote_verified": false}, {"claim": "Returns concentration in venture capital has intensified to an extreme: in the 2023-2026 period, 80% of all returns to VC investors came from the top 1% of investments, up from a historical pattern where the top 10% carried the bulk of returns.", "speaker": "Aswath Damodaran", "type": "data_point", "entities": ["venture capital", "Pitchbook", "CF Private Equity"], "conviction": "high", "so_what": "At 1%-tail dependence, a diversified VC fund without a top-decile deal is mathematically an underperformer — this is the number to cite when sizing venture allocations.", "quote": "in the 2023-2026 period, 80% of all returns to VC investors came from their top 1% of investments", "locator": "As you can see, across all the time periods", "quote_verified": true}, {"claim": "Failure is more intrinsic to venture capital than to other asset classes — more VC funds go out of existence each year, and even the most successful funds lose money on many or most of their investments, especially angel-stage deals.", "speaker": "Aswath Damodaran", "type": "data_point", "entities": ["venture capital", "angel investing"], "conviction": "high", "so_what": "Loss rates are the base case, so due diligence on the winner-selection process matters far more than average portfolio quality.", "quote": "not only are there more VC funds that go out of existence every year, but even the most successful VC funds lose on many or even most of the investments that they make", "locator": "The first is that failure, always a concern in investing", "quote_verified": true}, {"claim": "Only about a quarter of venture capitalists in any given year deliver above-average returns, yet unlike in mutual funds and hedge funds where outperformance is fleeting, VC success has been more enduring across cycles.", "speaker": "Aswath Damodaran", "type": "data_point", "entities": ["venture capital", "hedge funds", "mutual funds"], "conviction": "high", "so_what": "Persistence justifies paying up for access to established top-quartile VC franchises while treating the rest of the field as beta with worse liquidity.", "quote": null, "locator": "The first is that only about a quarter of venture capitalists", "quote_verified": false}, {"claim": "The more top-heavy VC returns become, the more pressure venture capitalists feel and pass on to portfolio companies to find the next big winner, pushing the ecosystem dangerously close to gambling.", "speaker": "Aswath Damodaran", "type": "causal", "entities": ["venture capital"], "conviction": "high", "so_what": "Rising return concentration is self-reinforcing: it mechanically increases risk-taking at portfolio companies, so concentration data is a leading indicator of ecosystem fragility.", "quote": "pushing the ecosystem dangerously close to gambling", "locator": "The power law characteristic also feeds into VC incentives", "quote_verified": true}, {"claim": "Given how venture capitalists invest, act and are judged, it is unrealistic to expect them to do the heavy lifting of long-term business building — the gap between what VCs are assumed to do and what they actually do is structural rather than a matter of character.", "speaker": "Aswath Damodaran", "type": "thesis", "entities": ["venture capital"], "conviction": "high", "so_what": "Strip the 'sherpa' premium out of any thesis that relies on VC stewardship to fix a portfolio company's economics.", "quote": null, "locator": "If you are reading this as a critique of venture capitalists", "quote_verified": false}]}, {"theme": "The gray market: public money in private deals", "insights": [{"claim": "Public-market capital has crossed into private financing — mutual funds like T. Rowe Price and Fidelity invested billions in high-profile private tech companies including Uber, joined by sovereign funds investing directly or through vehicles like Softbank's Vision fund.", "speaker": "Aswath Damodaran", "type": "data_point", "entities": ["T. Rowe Price", "Fidelity", "Uber", "Softbank Vision Fund", "sovereign wealth funds"], "conviction": "high", "so_what": "Mutual fund holders now carry pre-IPO mark-to-model risk inside supposedly liquid funds — check private allocations in growth-fund holdings.", "quote": null, "locator": "The Gray Market Effect", "quote_verified": false}, {"claim": "The merger of VC and public-equity capital pools into a single 'gray market' is what allows private businesses to stay private for far longer, dissolving the old separation between a private market for young firms and a public market for mature ones.", "speaker": "Aswath Damodaran", "type": "thesis", "entities": ["venture capital", "public equity"], "conviction": "high", "so_what": "Value creation now happens before listing, so public-market investors buying IPOs are buying a later, more expensive slice of the life cycle.", "quote": null, "locator": "In effect, rather than two mostly separated markets", "quote_verified": false}, {"claim": "Some growth businesses now bypass venture capital altogether for public equity or strategic investment from large mature companies, whose motives vary from technology access to pre-empting competitors to pure financial return.", "speaker": "Aswath Damodaran", "type": "framework", "entities": ["public equity", "corporate venture"], "conviction": "medium", "so_what": "Strategic corporate capital carries different exit incentives than VC — identify which type funded a private name before assuming a standard IPO path.", "quote": null, "locator": "Public equity: There are some growth businesses that bypass venture capital", "quote_verified": false}]}, {"theme": "Weakening mean reversion in public markets", "insights": [{"claim": "In markets that function properly, scaling feeds momentum while profitability acts as the fundamental anchor that produces reversals, but evidence from Ken French's datasets shows the reversal effect has weakened over time, leaving mean-reversion bettors stranded.", "speaker": "Aswath Damodaran", "type": "data_point", "entities": ["Ken French", "momentum", "value investing"], "conviction": "high", "so_what": "The historical counterweight to momentum is decaying, so value strategies relying on price reversal need a catalyst rather than patience.", "quote": "there is evidence that the reversal effect has weakened over time, leaving investors who bet on mean reversion and a return to fundamentals in the lurch", "locator": "Public Markets: Momentum, Fundamentals and Reversals", "quote_verified": true}, {"claim": "Passive investing now holds well above 50% of the market, and its flows disproportionately reach the largest market-cap companies while shrinking the population of active investors who scrutinize business models and profitability.", "speaker": "Aswath Damodaran", "type": "causal", "entities": ["passive investing", "ETFs", "index funds"], "conviction": "medium", "so_what": "A mechanical bid for the largest caps plus fewer fundamental scrutineers is a structural argument for momentum persistence in mega-caps.", "quote": null, "locator": "The rise of passive investing : In the battle between active investing and passive investing", "quote_verified": false}, {"claim": "The reversal effect began weakening in the 1990s, the decade when dot-com companies with unformed business models flooded public markets, because firms whose value rests entirely on potential rather than current operating metrics lack the near-term catalysts that trigger reversal.", "speaker": "Aswath Damodaran", "type": "causal", "entities": ["dot-com", "IPOs"], "conviction": "medium", "so_what": "Market composition, not just monetary policy, explains momentum dominance — expect reversion to stay weak while pre-profit listings dominate the growth cohort.", "quote": null, "locator": "Public market composition : It is noteworthy that the reversal effect started weakening", "quote_verified": false}, {"claim": "Damodaran takes issue with parts of each standard explanation for weakening reversals — the Fed's low rates, passive flows, market composition and faster uncurated information — but accepts all four carry some truth, making pushing back against momentum a more hazardous exercise.", "speaker": "Aswath Damodaran", "type": "thesis", "entities": ["Federal Reserve", "passive investing", "momentum"], "conviction": "medium", "so_what": "No single fix restores reversion, so treat contrarian positioning against momentum as a higher-risk trade than the historical record implies.", "quote": null, "locator": "While I take issue with parts of each of these arguments", "quote_verified": false}]}, {"theme": "IPO cohort deterioration (Ritter data)", "insights": [{"claim": "Companies going public in the United States are waiting materially longer, with the median age at IPO rising about 11 years over the last 15 years according to Jay Ritter's IPO data.", "speaker": "Aswath Damodaran", "type": "data_point", "entities": ["Jay Ritter", "IPOs"], "conviction": "high", "so_what": "Longer private tenure means public investors get later-stage entry points — a structural drag on IPO-cohort forward returns.", "quote": null, "locator": "1. Private businesses are waiting longer before going public", "quote_verified": false}, {"claim": "Inflation-adjusted revenues at the median US IPO have tripled or quadrupled relative to IPOs in the 1980s, so companies now list far bigger than they used to.", "speaker": "Aswath Damodaran", "type": "data_point", "entities": ["Jay Ritter", "IPOs"], "conviction": "high", "so_what": "Scale at listing has increased even as quality has fallen — revenue size is no longer a proxy for IPO maturity.", "quote": null, "locator": "2. Private businesses are scaling up (revenues) more, while waiting", "quote_verified": false}, {"claim": "Profitability at IPO has collapsed: over 80% of companies going public in the 1980s were profitable, versus less than a quarter of companies that have gone public in the last decade.", "speaker": "Aswath Damodaran", "type": "data_point", "entities": ["Jay Ritter", "IPOs"], "conviction": "high", "so_what": "The single hardest number in the piece: today's IPO buyer is underwriting a business model that mostly does not yet exist.", "quote": "less that a quarter of the companies that have gone public in the last decade have been profitable", "locator": "3. Private businesses are deferring building business models & profitability", "quote_verified": true}, {"claim": "Companies going public are issuing smaller portions of their shares in the initial offering, suggesting the capital need that historically drove listings has become less pressing because private capital access improved.", "speaker": "Aswath Damodaran", "type": "causal", "entities": ["IPOs", "float"], "conviction": "medium", "so_what": "Smaller floats mean thinner price discovery and larger lockup-expiry supply shocks — a tradeable feature of the modern IPO calendar.", "quote": null, "locator": "You will also notice that companies going public are issuing smaller portions", "quote_verified": false}, {"claim": "The median market cap of a US company going public in the last six years has exceeded a billion dollars, and the largest IPOs run from Facebook's $104 billion pricing in 2012 to SpaceX going public in June 2026 at $1.8 trillion.", "speaker": "Aswath Damodaran", "type": "data_point", "entities": ["Facebook", "SpaceX", "IPOs"], "conviction": "high", "so_what": "Listing valuations have escalated by more than an order of magnitude in 14 years, compressing the post-IPO return runway public investors used to capture.", "quote": "From Facebook, with a pricing of $104 billion, in 2012 to SpaceX, going public in June 2026 at $1.8 trillion, the trend lines are pointing upwards", "locator": "While the median market cap of a company going public in the last six years", "quote_verified": true}, {"claim": "The escalation in listing valuations is set to continue if Anthropic and OpenAI deliver on their trillion-dollar-plus pricing promise.", "speaker": "Aswath Damodaran", "type": "prediction", "entities": ["Anthropic", "OpenAI"], "conviction": "medium", "so_what": "The next two mega-listings are the test of whether public markets will absorb trillion-dollar pre-profit pricing.", "quote": null, "locator": "especially if Anthropic and OpenAI deliver on their trillion-dollar", "quote_verified": false}]}, {"theme": "Second-order consequences of scale-first", "insights": [{"claim": "Deferred listings mean governance scrutiny is deferred too, producing companies priced at a billion, hundreds of billions or even trillions run by people facing few checks, since founder worship and divide-and-conquer dynamics neutralize VCs as a disciplinary mechanism.", "speaker": "Aswath Damodaran", "type": "causal", "entities": ["Sarbanes-Oxley", "corporate governance", "venture capital"], "conviction": "high", "so_what": "Governance risk is now concentrated in the largest private names — a key-person or conduct event there has no public-market circuit breaker.", "quote": "you can have companies with market pricing of a billion, hundreds of billions or even trillions run by people who are ill-suited for the task", "locator": "Corporate governance: One of the reasons that private companies often delay going public", "quote_verified": true}, {"claim": "Scaling first and building the business model later can be irreversible, because the operating choices made to enable rapid scaling may themselves block the eventual pathway to profitability.", "speaker": "Aswath Damodaran", "type": "thesis", "entities": ["start-ups", "venture capital"], "conviction": "high", "so_what": "Path dependency means a company's cost structure may be permanently mis-set — do not assume margins can be 'switched on' once growth slows.", "quote": null, "locator": "Delayed business model building: If the first imperative for a private business", "quote_verified": false}, {"claim": "The Anthropic sales pitch consists mainly of annualized revenue run-rate growth and an unspecified but huge AI market size, with little or no mention of business models or profitability — an incomplete story focused almost entirely on scaling.", "speaker": "Aswath Damodaran", "type": "contrarian", "entities": ["Anthropic", "AI", "ARR"], "conviction": "high", "so_what": "ARR-plus-TAM is the tell of a pure scaling narrative; demand unit economics before underwriting AI-company valuations at these levels.", "quote": "in the Anthropic sales pitch it is the growth in the annualized revenue run rate (ARR) and the size of the AI market (huge, but with no specifics) that comprises the bulk of the story", "locator": "Scaling stories : If you believe, as I do, that valuation is a bridge", "quote_verified": true}, {"claim": "Supplying near-endless capital to disruptors without challenging their business models can produce disruption without replacement, where incumbents are driven out but the disruptor never builds a self-sustaining business.", "speaker": "Aswath Damodaran", "type": "thesis", "entities": ["disruption", "venture capital"], "conviction": "high", "so_what": "A destroyed incumbent industry plus an unprofitable disruptor is a net negative for the sector — watch for capacity that never gets rebuilt.", "quote": "your disruptor may not be able to build a business that can be self-sustaining in the long term", "locator": "Disruption without replacement : Disruption has been a key component", "quote_verified": true}, {"claim": "It is possible that companies both public and private carrying sky-high pricing today have been built on bad business models that are irredeemable, because changes in private and public capital markets have tilted incentives further toward scaling.", "speaker": "Aswath Damodaran", "type": "prediction", "entities": ["public equity", "private markets", "venture capital"], "conviction": "medium", "so_what": "The author's closing risk call: treat scale-driven valuations in today's largest pre-profit names as potentially unrecoverable, not merely early.", "quote": "it is possible that companies, both public and private, with sky-high pricing have been built on bad business models that are irredeemable", "locator": "Conclusion", "quote_verified": true}, {"claim": "Valuation is a bridge between stories and numbers whose balance shifts over the life cycle — stories dominate early and numbers take center stage later — which is why founders and VCs marketing young companies are primarily storytellers.", "speaker": "Aswath Damodaran", "type": "framework", "entities": ["valuation", "venture capital", "founders"], "conviction": "high", "so_what": "Judge a young company's pitch on story completeness (does it address margins and moats?), and demand numeric proof as the company ages.", "quote": null, "locator": "Scaling stories : If you believe, as I do, that valuation is a bridge", "quote_verified": false}]}], "insight_total": 46, "top_entities": ["Vinod Khosla", "venture capital", "Anthropic", "OpenAI", "SpaceX", "Uber", "Amazon", "WeWork", "Ferrari", "Google", "Jay Ritter", "Facebook"], "source_meta": {"author": "Aswath Damodaran", "word_count": 6563, "paywalled": false}}, {"record_id": "647bc429215a6319", "source_type": "concepts", "source_name": "Peterson Institute (PIIE)", "source_url": "https://www.piie.com/blogs/realtime-economics/2026/has-chinese-yuans-rise-global-usage-hit-wall", "title": "Has the Chinese yuan's rise in global usage hit a wall?", "published_date": "2026-09-03", "language": "en", "processed_at": "2026-09-04T15:15:26Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Geopolitics", "Positioning"], "gist": "The yuan's post-Ukraine internationalization surge stalled and partly reversed after mid-2024: its SWIFT payment share fell from a 4.7% July 2024 peak to 2.75% (sixth place, behind the Canadian dollar) and Hong Kong CHATS RMB volumes plunged, while only China's own CIPS rail hit all-time highs. Migration of payments off SWIFT onto CIPS explains only about one-fifth of the CHATS decline, so the retreat is largely real, and the dollar's share of global FX transactions actually rose from 87% to 89%. The conclusion drawn is that yuan internationalization now functions as a sanctions insurance policy rather than a live challenge to the dollar.", "themes": [{"theme": "Yuan payment momentum reversal", "insights": [{"claim": "The Chinese yuan's share of global payments on the SWIFT network peaked at 4.7 percent in July 2024 and has since fallen back to 2.75 percent, making it only the world's sixth most used payments currency, behind even the Canadian dollar.", "speaker": "Martin Chorzempa", "type": "data_point", "entities": ["Chinese yuan", "renminbi", "SWIFT", "Canadian dollar", "China"], "conviction": "high", "so_what": "The 'de-dollarization via RMB' trade has no confirming payments data; monitor monthly SWIFT RMB Tracker prints before pricing yuan reserve-currency optionality.", "quote": "It peaked at 4.7 percent of global payments by July 2024, passing the Japanese yen and Canadian dollar to become the fourth most used.", "locator": "Figure 1 shows the yuan's share in the SWIFT network", "quote_verified": true}, {"claim": "Headlines claiming China is 'ditching' the dollar or that the yuan is 'taking over the dollar's role' are contradicted by the data: yuan international use has decreased over the last two years both in absolute terms and as a share of global payments.", "speaker": "Martin Chorzempa", "type": "contrarian", "entities": ["Chinese yuan", "US dollar", "China"], "conviction": "high", "so_what": "A widely held consensus narrative is empirically wrong right now — fade de-dollarization headlines that cite yuan payment adoption as evidence.", "quote": "is that the yuan's momentum has faded. By some important measures its international use has even decreased, both in absolute terms and as a share of global payments over the last two years.", "locator": "It is widely known that global use of China's currency", "quote_verified": true}, {"claim": "Chained SWIFT month-on-month volume data show renminbi volumes on SWIFT declined 24 percent from the July 2024 peak as of January 2026, disproving the argument that the yuan's falling share merely reflects faster growth in other currencies.", "speaker": "Martin Chorzempa", "type": "data_point", "entities": ["Chinese yuan", "renminbi", "SWIFT"], "conviction": "high", "so_what": "The decline is in absolute volume, not just relative share — a stronger negative signal for yuan-linked settlement infrastructure and offshore RMB liquidity.", "quote": "Chaining together SWIFT data on month-on-month volume changes shows RMB volumes on SWIFT declined relative to the July 2024 peak by 24 percent as of January 2026.", "locator": "Footnote 1: Another possibility would be that financial market activity", "quote_verified": true}, {"claim": "The yuan's 2023-24 surge in global usage was driven by geopolitical tailwinds — sanctions on Russia after its invasion of Ukraine and the reordering of Russian trade — rather than by structural demand, which explains why it faded once that one-off reallocation was absorbed.", "speaker": "Martin Chorzempa", "type": "causal", "entities": ["Chinese yuan", "Russia", "Ukraine", "China"], "conviction": "high", "so_what": "Treat sanction-driven currency share gains as one-time level shifts, not trend breaks; the next leg requires a new sanctions shock, not organic adoption.", "quote": null, "locator": "It is widely known that global use of China's currency", "quote_verified": false}, {"claim": "Renminbi internationalization proceeds in waves and can reverse: the yuan share of SWIFT payments rose from under 1 percent in 2010 to 2.8 percent by late 2015, then fell back and stagnated around 2 percent for five years after a sharp depreciation and tightened capital controls.", "speaker": "Martin Chorzempa", "type": "framework", "entities": ["Chinese yuan", "SWIFT", "China", "capital controls"], "conviction": "high", "so_what": "Use the 2015-16 episode as the base-rate template: a depreciation plus capital-control tightening is the trigger that historically kills yuan usage momentum.", "quote": null, "locator": "Starting in 2010, measures to make the yuan more freely usable", "quote_verified": false}]}, {"theme": "CIPS vs CHATS vs SWIFT divergence", "insights": [{"claim": "China's Cross-Border Interbank Payment System (CIPS) is registering all-time high yuan volumes while Hong Kong's CHATS system and the yuan's SWIFT share remain far below their mid-2024 peaks — the first time these metrics have diverged.", "speaker": "Martin Chorzempa", "type": "data_point", "entities": ["CIPS", "CHATS", "SWIFT", "Hong Kong", "Chinese yuan"], "conviction": "high", "so_what": "Track CIPS volume separately from SWIFT share — the two are no longer substitutable proxies for yuan internationalization, and conflating them produces wrong conclusions in either direction.", "quote": "All have come up from late 2025 lows, but CIPS is registering all-time highs while CHATS and SWIFT remain far below the peak.", "locator": "Since the mid-2024 peak, however, the overall trend", "quote_verified": true}, {"claim": "Migration of payments from Hong Kong's CHATS onto CIPS can explain only about one-fifth of the observed decline: CHATS average daily RMB volume fell by over 1 trillion yuan between June 2024 and June 2026 while CIPS volume rose only about 200 billion yuan.", "speaker": "Martin Chorzempa", "type": "data_point", "entities": ["CHATS", "CIPS", "Hong Kong", "Chinese yuan"], "conviction": "high", "so_what": "The measurement-artifact defense of yuan adoption fails an arithmetic test — the decline in offshore yuan clearing is mostly real, which matters for Hong Kong's role as the offshore RMB hub.", "quote": "CHATS average daily RMB volume has fallen by over 1 trillion yuan from June 2024 to June 2026, while CIPS volume is only up by one-fifth of that, about 200 billion yuan.", "locator": "Some of the yuan's decline n CHATS may be due to migration", "quote_verified": true}, {"claim": "CIPS's network of direct participants — banks that can settle end-to-end without ever sending a SWIFT message — grew from 79 banks in January 2023 to 210 today, mechanically removing yuan volume from SWIFT-based statistics.", "speaker": "Martin Chorzempa", "type": "causal", "entities": ["CIPS", "SWIFT", "Chinese yuan", "banks"], "conviction": "high", "so_what": "SWIFT-derived currency shares will structurally understate the yuan over time; the direct-participant count is the cleanest leading indicator of how much data goes dark.", "quote": "This network(link is external) of direct participants has grown rapidly from 79 banks since January 2023 to 210 today.", "locator": "CIPS, however, also has its own independent messaging system", "quote_verified": true}, {"claim": "Hong Kong's CHATS handles three times as many payments as CIPS, so the plunge in CHATS yuan volume since mid-2024 is the more consequential data point for gauging real offshore yuan usage.", "speaker": "Martin Chorzempa", "type": "data_point", "entities": ["CHATS", "CIPS", "Hong Kong", "Chinese yuan"], "conviction": "high", "so_what": "Analysts anchoring on CIPS headlines are watching the smaller pipe; CHATS RMB volume is the higher-signal series for offshore RMB demand.", "quote": null, "locator": "The data paint a mixed picture", "quote_verified": false}, {"claim": "Both CIPS and CHATS yuan volumes more than doubled from mid-2022 to mid-2024 — CIPS from around 350 billion to 770 billion yuan and CHATS from 1.5 trillion to 3.3 trillion yuan — establishing how much of the subsequent move is round-trip.", "speaker": "Martin Chorzempa", "type": "data_point", "entities": ["CIPS", "CHATS", "Chinese yuan"], "conviction": "high", "so_what": "Gives concrete levels to benchmark future prints against, rather than relying on percentage-share optics.", "quote": null, "locator": "Figure 2 shows the payment volume in billions of yuan", "quote_verified": false}, {"claim": "The crisis in the Strait of Hormuz appears to have revived CIPS growth, indicating that geopolitical disruption events, not commercial adoption, are the reliable trigger for step-changes in yuan payment rails.", "speaker": "Martin Chorzempa", "type": "causal", "entities": ["CIPS", "Strait of Hormuz", "Chinese yuan"], "conviction": "medium", "so_what": "Treat CIPS volume as a geopolitical stress gauge — spikes there flag sanction-avoidance or energy-trade rerouting rather than yuan strength.", "quote": null, "locator": "China's Cross-Border Interbank Payment System (CIPS) is the main bright spot", "quote_verified": false}]}, {"theme": "Dollar dominance unbroken", "insights": [{"claim": "The US dollar remains at historic highs in global foreign exchange payments and its share of BIS-measured global FX transactions actually increased from 87 percent in 2013 to 89 percent by mid-June 2025, despite widespread sanctions concerns.", "speaker": "Martin Chorzempa", "type": "data_point", "entities": ["US dollar", "Bank for International Settlements", "foreign exchange"], "conviction": "high", "so_what": "Dollar-funding and dollar-clearing franchises face no measurable erosion; structural short-dollar theses built on reserve-status decay lack data support.", "quote": "Despite all the concerns about sanctions, the dollar's share increased from 87 to 89 percent.", "locator": "Looking globally, the Bank for International Settlements reports", "quote_verified": true}, {"claim": "The yuan's rise from 2 percent of global FX transactions in 2013 to 8.5 percent in mid-2025 came entirely at the expense of currencies other than the dollar, meaning the yuan has been displacing the euro, yen and other minors rather than the greenback.", "speaker": "Martin Chorzempa", "type": "contrarian", "entities": ["Chinese yuan", "US dollar", "euro", "Bank for International Settlements"], "conviction": "high", "so_what": "The competitive pressure from the yuan lands on second-tier reserve currencies, not on the dollar — relevant for EUR and JPY internationalization narratives rather than USD.", "quote": "the yuan has increased from being on one side of 2 percent of global foreign exchange transactions in 2013 to 8.5 percent in mid-June 2025, but its rise has come entirely at the expense of currencies other than the dollar", "locator": "Looking globally, the Bank for International Settlements reports", "quote_verified": true}, {"claim": "SAFE data show the US dollar has held a steady roughly 90 percent share of all Chinese cross-border payments not settled in yuan, proving China has not diversified into the euro or other alternatives when it moves away from yuan settlement.", "speaker": "Martin Chorzempa", "type": "data_point", "entities": ["SAFE", "State Administration of Foreign Exchange", "US dollar", "euro", "China"], "conviction": "high", "so_what": "There is no third-currency hedge inside China's own payment mix — any yuan stall translates directly into continued dollar dependence.", "quote": "The SAFE data also show the dollar has remained steady with around a 90 percent share of any payments not settled in yuan, suggesting China has not ditched dollar payments to transact in other currencies like the euro.", "locator": "Another way to look at yuan payments is through the State Administration", "quote_verified": true}, {"claim": "The yuan's failure to gain share during a period of rising global concern about the dollar is itself the surprising result, implying Beijing will need entirely new growth drivers to close the gap with the greenback.", "speaker": "Martin Chorzempa", "type": "thesis", "entities": ["Chinese yuan", "US dollar", "Beijing", "China"], "conviction": "high", "so_what": "If the yuan cannot gain when dollar sentiment is weak, the bar for future gains is higher — argues for structurally low probability of near-term reserve-currency rotation.", "quote": "The lack of gains in a period with rising global concerns about the dollar is particularly surprising, and it suggests Beijing will need to find new growth drivers if it wants to close the gap with the greenback.", "locator": "Conclusion", "quote_verified": true}]}, {"theme": "Sanctions-insurance framing of RMB policy", "insights": [{"claim": "Yuan internationalization is better understood as an insurance policy — infrastructure held ready to be activated for large-scale payments if sanctions force China off the dollar — rather than as an active campaign that is currently winning share.", "speaker": "Martin Chorzempa", "type": "framework", "entities": ["Chinese yuan", "China", "US dollar", "sanctions"], "conviction": "high", "so_what": "Reframes CIPS capacity as tail-risk hedging capacity: its value shows up only in a US-China sanctions scenario, not in baseline flow data.", "quote": "Yuan internationalization may be more of an insurance policy, ready to be activated for larger scale payments if sanctions force China off the dollar.", "locator": "Conclusion", "quote_verified": true}, {"claim": "China is deliberately accepting divergence from global payment standards in exchange for resilience against future sanctions, as evidenced by yuan payments increasingly bypassing the SWIFT network entirely.", "speaker": "Martin Chorzempa", "type": "thesis", "entities": ["China", "SWIFT", "CIPS", "sanctions"], "conviction": "high", "so_what": "Expect progressive loss of visibility into China-linked flows for Western compliance and macro analysts — a data-availability risk for anyone modeling China trade finance.", "quote": "It is a sign that China is prioritizing resilience to potential future sanctions and self-sufficiency, even at the risk of diverging from global payment standards.", "locator": "Nevertheless, CIPS's divergence from these other metrics", "quote_verified": true}, {"claim": "Chinese policymakers have failed to reconcile the capital-account openness a major global currency requires with the domestic stability they enforce through strict capital controls, which is the binding constraint on yuan internationalization.", "speaker": "Martin Chorzempa", "type": "causal", "entities": ["China", "People's Bank of China", "capital controls", "Chinese yuan"], "conviction": "high", "so_what": "Watch capital-account liberalization steps as the only real leading indicator of a durable yuan regime change; payment-rail announcements are noise without it.", "quote": "But Chinese policymakers have struggled to reconcile the openness that having a major global currency would require with domestic stability reinforced through strict capital controls.", "locator": "Fits and starts for the yuan", "quote_verified": true}, {"claim": "PBOC governor Pan Gongsheng framed the case for the yuan in defensive terms in 2025, warning that a global dominant currency 'tends to be instrumentalized or weaponized' and praising efforts to weaken excessive reliance on a single sovereign currency.", "speaker": "Martin Chorzempa", "type": "anecdote", "entities": ["Pan Gongsheng", "People's Bank of China", "Chinese yuan", "US dollar"], "conviction": "high", "so_what": "Official rhetoric confirms the motive is sanctions-proofing, not commercial competitiveness — sets expectations for policy that prioritizes control over convertibility.", "quote": "a \"global dominant currency tends to be instrumentalized or weaponized\"", "locator": "People's Bank of China governor Pan Gongsheng warned", "quote_verified": true}, {"claim": "Xi Jinping in 2023 explicitly called for China to become a 'strong financial country' with a currency having wide use in international trade, investment and FX markets and even status as a global reserve currency, making yuan internationalization a top-level political objective.", "speaker": "Martin Chorzempa", "type": "anecdote", "entities": ["Xi Jinping", "China", "Chinese yuan"], "conviction": "high", "so_what": "Political priority means policy support persists through stalled data — expect further rail-building announcements regardless of adoption metrics.", "quote": null, "locator": "In 2023, China's president Xi Jinping called", "quote_verified": false}]}, {"theme": "Trade settlement vs financial flows", "insights": [{"claim": "72 percent of China's goods trade is still settled in currencies other than the yuan, even after the yuan-settled share climbed from a 2017 low of 11 percent to 28 percent in the first half of 2025.", "speaker": "Martin Chorzempa", "type": "data_point", "entities": ["China", "Chinese yuan", "goods trade"], "conviction": "high", "so_what": "Sets a concrete ceiling on the 'trade-settlement de-dollarization' story; roughly three-quarters of the world's largest goods exporter still invoices in foreign currency.", "quote": "It is also a useful reminder that 72 percent of China's goods trade is still settled in other currencies.", "locator": "Other official Chinese data show the share of China's goods trade", "quote_verified": true}, {"claim": "China's yuan-settled share of goods trade fell from 23 percent in 2015 to 11 percent in 2017 before recovering to 28 percent, demonstrating that a decade of net progress amounted to only five percentage points and that reversals of over half the share are possible.", "speaker": "Martin Chorzempa", "type": "data_point", "entities": ["China", "Chinese yuan", "goods trade"], "conviction": "high", "so_what": "Quantifies the downside case for yuan trade settlement — a repeat of 2015-17 would halve the current share, which matters for offshore RMB deposit and hedging demand.", "quote": null, "locator": "Other official Chinese data show the share of China's goods trade", "quote_verified": false}, {"claim": "SAFE data show the yuan reached roughly half of China's overall cross-border settlements by early 2023 largely at the dollar's expense, but has stagnated at that level since and stopped gaining, with yuan payment growth only keeping pace with continued demand for dollar settlement.", "speaker": "Martin Chorzempa", "type": "data_point", "entities": ["SAFE", "China", "Chinese yuan", "US dollar"], "conviction": "high", "so_what": "Rising absolute yuan volumes are misleading — the share metric has been flat for over three years, so growth reflects trade volume, not currency substitution.", "quote": null, "locator": "Another way to look at yuan payments is through the State Administration", "quote_verified": false}, {"claim": "The composition of China's cross-border bank payments has shifted decisively toward finance: goods and services trade settlement fell from around three quarters of these payments before 2019 to roughly 47 percent today as financial transactions grew much faster.", "speaker": "Martin Chorzempa", "type": "data_point", "entities": ["SAFE", "China", "cross-border payments"], "conviction": "high", "so_what": "China's cross-border flows are now majority financial, making them more sentiment- and rate-sensitive and less anchored by trade — a higher-beta channel for capital-flow volatility.", "quote": null, "locator": "Footnote 4: Until around 2019, around three quarters of these payments", "quote_verified": false}]}, {"theme": "mBridge and CBDC reality check", "insights": [{"claim": "The mBridge multi-CBDC platform had handled only 4,047 transactions totaling 387.2 billion yuan as of November 2025, of which 95.3 percent were yuan transactions, against CIPS's roughly 33,000 transactions per day.", "speaker": "Martin Chorzempa", "type": "data_point", "entities": ["mBridge", "CBDC", "CIPS", "digital yuan", "People's Bank of China"], "conviction": "high", "so_what": "Deflates the digital-yuan-as-dollar-threat thesis with hard numbers; CBDC cross-border rails are immaterial to currency shares today.", "quote": "as of November 2025, the system had handled 4,047 transactions totaling 387.2 billion yuan, of which 95.3 percent were yuan transactions", "locator": "One other channel that may not be counted in CIPS or SWIFT", "quote_verified": true}, {"claim": "Financial Times figures imply mBridge added only about 83 billion yuan of transactions between November 2025 and June 2026 — roughly one-tenth of a single day's average CIPS volume — making it a rounding error in the yuan's international footprint.", "speaker": "Martin Chorzempa", "type": "data_point", "entities": ["mBridge", "Financial Times", "CIPS", "Chinese yuan"], "conviction": "high", "so_what": "Gives a concrete scale benchmark to dismiss mBridge headlines; any claim of CBDC-driven de-dollarization should be checked against one day of CIPS volume.", "quote": "mBridge volume over the past six to seven months would only represent one-tenth of one day's average CIPS volumes, making mBridge barely a rounding error in the yuan's international footprint.", "locator": "Newer figures reported(link is external) by the Financial Times", "quote_verified": true}, {"claim": "Cross-border CBDC payments at scale remain years away because no major economy has fully launched a CBDC that could connect to China's, leaving the digital yuan without a network of counterpart systems.", "speaker": "Martin Chorzempa", "type": "prediction", "entities": ["CBDC", "digital yuan", "mBridge", "China"], "conviction": "high", "so_what": "Network effects, not Chinese technology, are the binding constraint — watch major-economy CBDC launches, not Chinese pilots, as the real trigger.", "quote": "CBDC payments at scale remain a prospect for years in the future. No major economy has fully launched one that could be connected to China's, leaving it without a network(link is external) of other CBDCs to connect to.", "locator": "CBDC payments at scale remain a prospect", "quote_verified": true}, {"claim": "Reported mBridge growth figures conflict materially, with the Financial Times implying 21 percent growth to RMB470 billion by mid-June 2026 while the South China Morning Post reported RMB600 billion by late June, implying 50 percent growth.", "speaker": "Martin Chorzempa", "type": "data_point", "entities": ["mBridge", "Financial Times", "South China Morning Post"], "conviction": "medium", "so_what": "Data on Chinese CBDC volumes is unreliable and press-sourced — discount precise mBridge figures and rely on the order of magnitude instead.", "quote": null, "locator": "Footnote 6: The Financial Times reported that mBridge volumes have risen", "quote_verified": false}]}, {"theme": "Structural gap vs China's economic weight", "insights": [{"claim": "The yuan still punches far below China's economic weight and China remains tightly tied up in dollar-based global financial networks, which preserves US strategic leverage over Chinese payments despite a decade of internationalization effort.", "speaker": "Martin Chorzempa", "type": "thesis", "entities": ["Chinese yuan", "China", "US dollar", "United States"], "conviction": "high", "so_what": "US financial-sanctions capacity against China is intact — a key input for pricing tail risk in China-exposed assets and for assessing escalation scenarios.", "quote": "The yuan overall still punches far below China's economic weight. Far from ditching the dollar, China is still tightly tied up in dollar-based global financial networks.", "locator": "Conclusion", "quote_verified": true}, {"claim": "China's pursuit of yuan internationalization is explicitly motivated by reducing the strategic leverage that ubiquitous dollar payments give the United States, framing currency policy as national security rather than economic efficiency.", "speaker": "Martin Chorzempa", "type": "framework", "entities": ["China", "United States", "Chinese yuan", "US dollar"], "conviction": "high", "so_what": "Means Beijing will keep funding uneconomic payment infrastructure regardless of adoption returns — persistent policy tailwind for CIPS buildout irrespective of volumes.", "quote": null, "locator": "China has long aimed to make the yuan a more important global currency", "quote_verified": false}, {"claim": "Even the genuine bright spots in yuan usage — CIPS all-time highs and rising trade settlement — are insufficient for the yuan to keep gaining share of global payments or even of China's own payments.", "speaker": "Martin Chorzempa", "type": "thesis", "entities": ["Chinese yuan", "CIPS", "China", "US dollar"], "conviction": "high", "so_what": "Bullish yuan datapoints exist but do not aggregate to a trend; require share-based confirmation across SWIFT, CHATS and SAFE before treating any single print as a turn.", "quote": "However, the bright spots are not enough for the yuan to continue gaining on the dollar in its share of global payments or even overall Chinese payments.", "locator": "Conclusion", "quote_verified": true}]}], "insight_total": 31, "top_entities": ["Chinese yuan", "US dollar", "CIPS", "SWIFT", "CHATS", "China", "Hong Kong", "mBridge", "SAFE", "People's Bank of China", "Bank for International Settlements", "Xi Jinping"], "source_meta": {"author": "Martin Chorzempa", "word_count": 2050, "paywalled": false}}, {"record_id": "6d8f88d67d32cb9a", "source_type": "concepts", "source_name": "Gavekal Research", "source_url": "https://research.gavekal.com/teaser/will-indias-growth-keep-defying-global-headwinds/", "title": "Will India’s Growth Keep Defying Global Headwinds?", "published_date": "2026-09-04", "language": "en", "processed_at": "2026-09-04T15:14:29Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Energy", "Geopolitics"], "gist": "Renewed US-Iran fighting has pushed Brent to US$95/bbl and driven US and European bond yields to multi-year highs (a multi-decade high in Japan), reviving stagflation fears. Against that backdrop India printed 7.8% YoY GDP growth for the June quarter; Gavekal argues opposition accusations of statistical manipulation are exaggerated and the economy is genuinely sound, with sustained high oil the main threat.", "themes": [{"theme": "Oil-driven stagflation shock", "insights": [{"claim": "Renewed fighting between the United States and Iran has pushed Brent crude to US$95/bbl, lifting inflation expectations and threatening global consumption and growth.", "speaker": "Gavekal Research", "type": "causal", "entities": ["Brent", "Iran", "United States", "crude oil"], "conviction": "high", "so_what": "A geopolitically-driven oil spike to US$95 is the live input to the stagflation trade: watch energy longs versus consumer-discretionary and rate-sensitive shorts.", "quote": "The resumption in fighting between the United States and Iran has pushed Brent to US$95/bbl, raising inflation expectations and threatening consumption and growth.", "locator": "Once again, the specter of stagflation", "quote_verified": true}, {"claim": "Bond yields in the US and Europe are at multi-year highs and Japanese yields at a multi-decade high as markets price in monetary tightening.", "speaker": "Gavekal Research", "type": "data_point", "entities": ["US Treasuries", "Europe", "Japan", "bond markets"], "conviction": "high", "so_what": "Japan's multi-decade yield high is the outlier worth watching, since it pressures the global carry complex and repatriation flows.", "quote": "Bond yields in the US and Europe are hitting multi-year highs—and a multi-decade high in Japan—as markets price in monetary tightening", "locator": "Bond yields in the US and Europe", "quote_verified": true}, {"claim": "Rising bond yields are raising borrowing costs on debt loads described as already eye-watering, compounding the stagflation squeeze on sovereigns.", "speaker": "Gavekal Research", "type": "causal", "entities": ["sovereign debt", "bond markets", "United States", "Europe", "Japan"], "conviction": "high", "so_what": "Debt-service math, not inflation alone, is the transmission channel to watch for fiscal stress and curve steepening.", "quote": "jacking up borrowing costs on already eye-watering debt loads", "locator": "as markets price in monetary tightening", "quote_verified": true}]}, {"theme": "India as the outlier bright spot", "insights": [{"claim": "India's headline GDP grew 7.8% year-on-year in the quarter ended June 2026, faster than expected.", "speaker": "Gavekal Research", "type": "data_point", "entities": ["India", "GDP"], "conviction": "high", "so_what": "A 7.8% print with oil at US$95 makes India the clearest growth carve-out from the global stagflation narrative.", "quote": "headline GDP growth of 7.8% YoY in the quarter ended June", "locator": "Modi this week described headline GDP growth", "quote_verified": true}, {"claim": "India's faster-than-expected growth is the single bright spot within an otherwise gloomy global macro picture of oil shocks and surging yields.", "speaker": "Gavekal Research", "type": "thesis", "entities": ["India", "global economy"], "conviction": "high", "so_what": "Argues for relative-value overweight of Indian equities and growth assets against developed-market rate-sensitive exposure.", "quote": "But within the gloom there is a shaft of light: faster-than-expected growth in India.", "locator": "But within the gloom there is", "quote_verified": true}, {"claim": "India delivered its growth acceleration in the face of oil-price shocks and supply-chain disruptions, which Prime Minister Narendra Modi characterized as a Herculean feat.", "speaker": "Gavekal Research", "type": "anecdote", "entities": ["Narendra Modi", "India", "supply chains", "oil"], "conviction": "medium", "so_what": "Political framing matters for policy continuity: a government claiming credit for growth is less likely to pivot to demand-suppressing austerity.", "quote": "“Doomsayers were doomed and India bloomed… yet again!”", "locator": "Modi this week described headline GDP growth", "quote_verified": true}, {"claim": "Sustained higher oil prices are flagged as the main risk that could dampen India's growth run, despite the strong June-quarter print.", "speaker": "Gavekal Research", "type": "prediction", "entities": ["India", "Brent", "oil", "Narendra Modi"], "conviction": "medium", "so_what": "Treat Brent staying near US$95 as the key trigger for downgrading the Indian growth and current-account outlook.", "quote": "India’s economy is in good shape, even if sustained higher oil prices risk dampening Modi’s mood.", "locator": "But criticisms of data manipulation are exaggerated, if not entirely misplaced", "quote_verified": true}]}, {"theme": "Credibility of Indian GDP data", "insights": [{"claim": "A senior Indian opposition leader dismissed the GDP figures as statistical gymnastics, alleging the government used methodological revisions to mask a bleak economic reality.", "speaker": "Gavekal Research", "type": "anecdote", "entities": ["India", "GDP", "Indian opposition"], "conviction": "medium", "so_what": "Data-credibility attacks are the standing bear case on India; know the argument before it resurfaces around the next print.", "quote": "accusing the government of using methodological revisions to fix the data while “hiding India’s bleak economic reality.”", "locator": "For critics, however, India’s statistical stables", "quote_verified": true}, {"claim": "Gavekal judges accusations that India manipulates its GDP data to be exaggerated if not entirely misplaced, and holds that the underlying economy is genuinely in good shape.", "speaker": "Gavekal Research", "type": "contrarian", "entities": ["India", "GDP", "Gavekal Research"], "conviction": "high", "so_what": "Taking the 7.8% print at face value removes the main discount investors apply to Indian macro data and supports staying long the growth story.", "quote": "But criticisms of data manipulation are exaggerated, if not entirely misplaced.", "locator": "But criticisms of data manipulation are exaggerated, if not entirely misplaced", "quote_verified": true}]}], "insight_total": 9, "top_entities": ["India", "Brent", "Iran", "United States", "Narendra Modi", "Japan", "Europe", "GDP", "Gavekal Research", "Tom Miller", "Udith Sikand"], "source_meta": {"author": "", "word_count": 218, "paywalled": false}}, {"record_id": "717f0e753ea66b31", "source_type": "concepts", "source_name": "NY Fed — Liberty Street Economics", "source_url": "https://libertystreeteconomics.newyorkfed.org/2026/09/jackson-hole-exploring-the-financial-frontier/", "title": "Jackson Hole: Exploring the Financial Frontier - Liberty Street Economics", "published_date": "2026-09-03", "language": "en", "processed_at": "2026-09-04T15:15:15Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Crypto", "Tech"], "gist": "NY Fed research head Kartik B. Athreya reports that the 2026 Jackson Hole symposium's main theme was payments innovation — blockchain rails that let parties pay each other without a central hub. He frames the core risk as stablecoin runs and deposit flight hollowing out the information banks need to allocate credit, and flags Todd Keister's narrow-banking work and Pablo Azar's research on crypto-collateralized stablecoins as the NY Fed's response.", "themes": [{"theme": "Jackson Hole 2026 agenda: payments", "insights": [{"claim": "The 2026 Kansas City Fed Jackson Hole symposium made financial innovation in the payments space its main theme, shifting the marquee central-bank gathering away from rates and inflation toward payment rails and market structure.", "speaker": "Kartik B. Athreya", "type": "data_point", "entities": ["Kansas City Fed", "Jackson Hole symposium", "Federal Reserve", "payments"], "conviction": "high", "so_what": "The Fed's top policy forum is now allocating agenda time to payments plumbing — a leading indicator of where regulatory attention and rulemaking energy will go next.", "quote": "The main theme of this year’s Kansas City Fed symposium was financial innovation in the payments space—a fast-evolving topic with major implications for consumers and central bankers alike.", "locator": "Intro: 'After two days of heady discussions'", "quote_verified": true}, {"claim": "Jackson Hole discussion centered on technologies that let payments be made directly between parties without a traditional coordinating hub, the role central banks have long filled by providing the hub and the payment 'rails'.", "speaker": "Kartik B. Athreya", "type": "thesis", "entities": ["central banks", "Federal Reserve", "blockchain", "payments"], "conviction": "high", "so_what": "The incumbent being disintermediated here is the central bank itself as operator of payment rails; watch for defensive Fed initiatives on settlement infrastructure.", "quote": null, "locator": "Econ in the Tetons: 'Much of the conversation at Jackson Hole'", "quote_verified": false}, {"claim": "The New York Fed frames its interest in payment innovation around three self-interested questions: how the changes should be supported, what to expect as a payments processor itself, and what risks they pose to the payments and financial systems.", "speaker": "Kartik B. Athreya", "type": "framework", "entities": ["New York Fed", "Federal Reserve"], "conviction": "high", "so_what": "Tells you the lens supervisors will apply to any new payment venture — support, own-franchise impact, and systemic risk, in that order.", "quote": null, "locator": "Econ in the Tetons: 'So naturally, we at the Fed are interested'", "quote_verified": false}, {"claim": "Papers presented at the symposium were split, with some welcoming blockchain-enabled smart contracts and others taking a cautionary line on the implications for banks, non-bank financial institutions, and consumer well-being.", "speaker": "Kartik B. Athreya", "type": "data_point", "entities": ["blockchain", "smart contracts", "NBFIs", "banks"], "conviction": "medium", "so_what": "The official research community has not converged on a verdict, so regulatory outcomes on tokenized payments remain genuinely two-sided rather than pre-decided.", "quote": "some of the papers presented were more cautionary in assessing the implications of such innovations for both banks and other entities who do “bank-like” things", "locator": "Econ in the Tetons: 'Conference participants demonstrated'", "quote_verified": true}, {"claim": "Blockchain's clearest accepted benefit is smart contracts — richer payment arrangements made contingent on circumstances relevant to the paying parties — rather than speed or cost alone.", "speaker": "Kartik B. Athreya", "type": "thesis", "entities": ["blockchain", "smart contracts"], "conviction": "medium", "so_what": "Contingent, state-dependent payment logic is the feature policymakers concede is genuinely new; business models built on that have a better regulatory reception than pure cost-cutting pitches.", "quote": null, "locator": "Econ in the Tetons: 'Conference participants demonstrated how some aspects'", "quote_verified": false}]}, {"theme": "Intermediation-first lens on payments", "insights": [{"claim": "The stated purpose of the financial system is to let economic participants concentrate purchasing power on desired goods and services at specific times and under specific circumstances, and all borrowing, lending, and insurance contracts exist to facilitate that.", "speaker": "Kartik B. Athreya", "type": "framework", "entities": ["financial system", "credit", "insurance"], "conviction": "high", "so_what": "A first-principles test to apply to any fintech or crypto pitch: if it doesn't move purchasing power across time and states of the world, it isn't finance, it's plumbing.", "quote": null, "locator": "From Basic Banking…: 'it’s useful to recall the basic purpose'", "quote_verified": false}, {"claim": "Every desired function of the financial system — including funding innovation via loans, venture capital, and equity issuance — ultimately depends on payment systems for delivery, so a financial system with weak payments is not fully delivering for society.", "speaker": "Kartik B. Athreya", "type": "causal", "entities": ["venture capital", "payments", "credit markets"], "conviction": "high", "so_what": "Payments quality is upstream of capital formation; degradation in payment rails transmits directly into the cost and availability of risk capital.", "quote": "Vitally, every single one of these desired functions relies in the end on payment systems for their delivery.", "locator": "From Basic Banking…: 'Vitally, every single one'", "quote_verified": true}, {"claim": "Banks and, increasingly, non-bank financial institutions accumulate information on credit risk, economic conditions, and markets as a by-product of gathering deposits and lending, and that informational vantage is what lets them direct credit where it is most needed.", "speaker": "Kartik B. Athreya", "type": "causal", "entities": ["banks", "NBFIs", "credit allocation"], "conviction": "high", "so_what": "The credit-allocation value of banks is informational, not balance-sheet — so anything that separates deposits from lending degrades information, not just funding.", "quote": null, "locator": "From Basic Banking…: 'As intermediators, these institutions naturally amass'", "quote_verified": false}, {"claim": "Payments are treated as a natural adjunct to lending rather than a standalone business, because two customers of the same bank or NBFI can settle internally and networks exist to move claims between institutions.", "speaker": "Kartik B. Athreya", "type": "framework", "entities": ["banks", "NBFIs", "payment networks"], "conviction": "medium", "so_what": "Unbundling payments from intermediation is the structural break blockchain enables; the Fed's framing implies it would be treated as a departure from the norm, not an efficiency.", "quote": null, "locator": "From Basic Banking…: 'Payments are a natural adjunct'", "quote_verified": false}, {"claim": "Blockchain-based banking with distributed digital ledgers and tokenized deposits replacing traditional databases is presented as offering real-time transactions, higher security, and lower operational costs, but these are attributed to advocates rather than endorsed.", "speaker": "Kartik B. Athreya", "type": "thesis", "entities": ["blockchain", "tokenized deposits", "banks"], "conviction": "low", "so_what": "Note the hedge: the NY Fed's research head reports the benefit case as claimed, not established — expect proof-of-benefit burdens in future policy work.", "quote": "Advocates say that blockchain-based banking could offer a variety of benefits, most notably real-time transactions, higher security, and lower operational costs.", "locator": "…To the Blockchain: 'Blockchain technology has the potential'", "quote_verified": true}, {"claim": "A large volume of information is currently exchanged before payments are effected and finalized, and the open question is how far emerging payment technologies can cut the time, effort, and resources those verification steps consume.", "speaker": "Kartik B. Athreya", "type": "thesis", "entities": ["payments", "settlement", "blockchain"], "conviction": "medium", "so_what": "Frames the real prize in payment tech as pre-settlement information cost, not transaction speed — a different set of winners than consumer-facing payment apps.", "quote": null, "locator": "…To the Blockchain: 'The nature of the information needed'", "quote_verified": false}]}, {"theme": "Stablecoin run risk", "insights": [{"claim": "Digital assets are subject to runs and shocks in the same way banks can be destabilized by depositor flight, according to documented New York Fed research.", "speaker": "Kartik B. Athreya", "type": "causal", "entities": ["stablecoins", "digital assets", "New York Fed", "banks"], "conviction": "high", "so_what": "The run-equivalence framing is the analytical basis for eventually applying bank-style liquidity and reserve rules to stablecoin issuers.", "quote": "Just as banks can be destabilized by depositor flight, our researchers have documented that digital assets can also be subject to runs and shocks.", "locator": "Stablecoin Shocks?: 'Of course, the transition to blockchain-based banking'", "quote_verified": true}, {"claim": "Stablecoin adoption as a payment instrument has accelerated in recent years specifically because of the passage of the 2025 GENIUS Act.", "speaker": "Kartik B. Athreya", "type": "causal", "entities": ["stablecoins", "GENIUS Act", "U.S. dollar"], "conviction": "high", "so_what": "A named legislative catalyst dates the adoption inflection — useful for anchoring growth curves and for anticipating that the same legislature can decelerate it.", "quote": "Stablecoins—blockchain-based crypto assets whose value is pegged to that of a fiat currency, usually the U.S. dollar—have seen rapid adoption as a payment instrument in recent years, accelerated by the passage of the 2025 GENIUS Act.", "locator": "Stablecoin Shocks?: 'Stablecoins—blockchain-based crypto assets'", "quote_verified": true}, {"claim": "Despite a name implying a high degree of security, stablecoins are not fully immune from instability, and shocks to the stablecoin market have originated both from within the crypto industry and from traditional financial markets.", "speaker": "Kartik B. Athreya", "type": "contrarian", "entities": ["stablecoins", "crypto markets"], "conviction": "high", "so_what": "Two independent shock channels mean stablecoin stress is not a crypto-only tail risk; traditional market stress can propagate into the peg.", "quote": null, "locator": "Stablecoin Shocks?: 'Though their name implies'", "quote_verified": false}, {"claim": "A newer generation of stablecoins is pegged to other crypto assets rather than to a fiat currency such as the U.S. dollar, and New York Fed economist Pablo Azar and a coauthor argue this creates risks within the crypto ecosystem itself and thereby more broadly.", "speaker": "Kartik B. Athreya", "type": "thesis", "entities": ["Pablo Azar", "stablecoins", "crypto assets", "New York Fed"], "conviction": "medium", "so_what": "Crypto-collateralized stablecoins reintroduce reflexive collateral loops the fiat-backed design removed; treat them as a distinct, higher-beta risk category from USD-backed issuers.", "quote": null, "locator": "Systemic Effects: 'Instead of being linked to a traditional fiat currency'", "quote_verified": false}]}, {"theme": "Deposit flight and narrow banking", "insights": [{"claim": "The key systemic worry raised is that if households shift bank deposits into stablecoins, banks lose the capacity to gather the information and capital needed to lend to borrowers who need credit, with far-reaching reverberations.", "speaker": "Kartik B. Athreya", "type": "causal", "entities": ["stablecoins", "banks", "bank deposits", "credit"], "conviction": "high", "so_what": "This is the transmission channel to watch: stablecoin AUM growth as a direct read on deposit-funded lending capacity and regional bank credit supply.", "quote": "What if many of us simply shift our bank deposits into stablecoins, thus hampering banks’ capacity to gather the information and capital necessary to lend to those who need credit?", "locator": "Systemic Effects: 'One practical example is the effect'", "quote_verified": true}, {"claim": "The wave of payment innovations has pushed economists back to a classic question — whether the same institution must both offer easy-to-withdraw deposits and issue hard-to-liquidate loans — with the New York Fed's Todd Keister examining a 'narrow bank' that provides payment and withdrawal services while leaving lending to finance companies.", "speaker": "Kartik B. Athreya", "type": "framework", "entities": ["Todd Keister", "narrow banking", "banks", "finance companies", "New York Fed"], "conviction": "medium", "so_what": "If narrow banking gains official intellectual support, the long-run structure splits payments franchises from credit franchises — a re-rating event for both bank and specialty-finance business models.", "quote": null, "locator": "Systemic Effects: 'is it really essential for the same institution'", "quote_verified": false}]}, {"theme": "Two tests and the taxpayer backstop", "insights": [{"claim": "Two tests are proposed for any new payment protocol, platform, or instrument: whether it enables transactions that were not feasible before or makes them cheaper, and how much it changes the risks facing all parties in the financial system and the broader economy.", "speaker": "Kartik B. Athreya", "type": "framework", "entities": ["payments", "financial stability"], "conviction": "high", "so_what": "A concise screen for evaluating payment ventures the way their regulator will: novel-or-cheaper on one axis, risk transfer on the other.", "quote": null, "locator": "Street Level Observations: 'it’s important to keep things in perspective'", "quote_verified": false}, {"claim": "The same properties that make stablecoins attractive for cheap cross-border payments and make tokenization of safe assets like U.S. Treasury securities attractive for tradability might create risks for incumbent payment providers, most obviously banks.", "speaker": "Kartik B. Athreya", "type": "thesis", "entities": ["stablecoins", "tokenization", "U.S. Treasury securities", "banks"], "conviction": "medium", "so_what": "Benefit and disruption are the same mechanism here; banks' payment revenue is the identified casualty of successful tokenization.", "quote": null, "locator": "Street Level Observations: 'Stablecoins, for example, are typically promoted'", "quote_verified": false}, {"claim": "Because banking and payments are areas where taxpayer support has historically been used to stop problems from worsening, the priority for future work is avoiding the transference of risk from private innovators to the public.", "speaker": "Kartik B. Athreya", "type": "thesis", "entities": ["banks", "payments", "taxpayers", "financial stability"], "conviction": "high", "so_what": "Signals that the regulatory test applied to stablecoin and tokenization firms will be implicit-backstop creep, not consumer protection alone — the binding constraint on how large these franchises can get.", "quote": "more research and a sharp eye toward avoiding the transference of risks to the public are both going to be important", "locator": "Street Level Observations: 'Moreover, both banking and payments'", "quote_verified": true}]}], "insight_total": 20, "top_entities": ["stablecoins", "blockchain", "New York Fed", "Jackson Hole", "GENIUS Act", "Kartik B. Athreya", "Todd Keister", "Pablo Azar", "NBFIs", "tokenized deposits", "U.S. Treasury securities", "Kansas City Fed"], "source_meta": {"author": "peterstevens", "word_count": 1480, "paywalled": false}}, {"record_id": "75297fd6b4066928", "source_type": "concepts", "source_name": "St. Louis Fed — FRED Blog", "source_url": "https://fredblog.stlouisfed.org/2026/09/", "title": "September | 2026 | FRED Blog", "published_date": "2026-09-03", "language": "en", "processed_at": "2026-09-04T15:15:43Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Society", "AI"], "gist": "A FRED Blog post shows US consumer sentiment (Michigan index, 95.9 average in 2019 vs 71.7 in January 2025) collapsed post-pandemic while the SHED share of adults saying they are 'at least doing okay financially' barely moved (75% in 2019 vs 73% in 2025) — but a second SHED question, 'worse off than 12 months ago,' tracks the sentiment collapse closely. The gap is framed as levels-versus-change, rising dispersion across households, and own-finances-versus-broad-economy.", "themes": [{"theme": "Sentiment-vs-wellbeing gap", "insights": [{"claim": "The University of Michigan Index of Consumer Sentiment averaged 95.9 in 2019 and stood at 71.7 in January 2025, a roughly 24-point drop that has not reversed.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["University of Michigan", "Index of Consumer Sentiment", "UMCSENT"], "conviction": "high", "so_what": "Anchors how far sentiment-driven demand signals sit below pre-COVID norms; a mean-reversion trade in consumer-facing names needs a catalyst this gap has not yet produced.", "quote": "Its value averaged 95.9 in 2019 and was 71.7 in January 2025.", "locator": "Are you doing OK? — 'Before the COVID-19 pandemic, these two measures moved'", "quote_verified": true}, {"claim": "The share of US adults reporting they are 'at least doing okay financially' in the Federal Reserve Board's SHED survey was 75% in 2019 and 73% in 2025, essentially flat despite the collapse in headline consumer sentiment.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["Survey of Household Economics and Decisionmaking", "Federal Reserve Board", "SHED"], "conviction": "high", "so_what": "Self-reported household balance-sheet health held up even as survey mood cratered — a reason to weight spending data over sentiment surveys when sizing consumer exposure.", "quote": "It was 75% in 2019 and it was 73% in 2025.", "locator": "Are you doing OK? — 'The share of adults saying they're doing at least okay'", "quote_verified": true}, {"claim": "Measures of household financial well-being and measures of consumer sentiment moved together before COVID-19 but decoupled afterward, so the historical correlation between the two can no longer be assumed.", "speaker": "St. Louis Fed — FRED Blog", "type": "thesis", "entities": ["SHED", "University of Michigan", "COVID-19 pandemic"], "conviction": "high", "so_what": "Models that map sentiment onto household financial condition need re-estimation on post-2020 data or they will overstate consumer distress.", "quote": "Measures of household financial well-being don’t always align with consumer sentiment. You can feel relatively secure about your finances while still being pessimistic about the overall economy.", "locator": "The takeaway", "quote_verified": true}]}, {"theme": "Levels vs change framing", "insights": [{"claim": "A second SHED question — whether households are worse off financially than 12 months ago — dropped sharply after the pandemic and has stayed low, matching the trajectory of consumer sentiment rather than diverging from it.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["SHED", "WORSEOFFFINANCIALLYALLADU", "University of Michigan"], "conviction": "high", "so_what": "Choosing which SHED series to cite flips the conclusion about the consumer entirely; check which question underlies any 'households are fine' claim.", "quote": null, "locator": "Are you worse off today? — 'Here, the two measures tell a more similar story.'", "quote_verified": false}, {"claim": "The divergence between the two SHED series is explained partly as a levels-versus-change distinction: 'doing okay financially' describes a current position while 'worse off than a year ago' describes the direction of travel, and a household can report both simultaneously.", "speaker": "St. Louis Fed — FRED Blog", "type": "framework", "entities": ["SHED"], "conviction": "medium", "so_what": "A reusable lens for reading any survey: solvency questions and momentum questions are separate signals, and momentum is what tracks mood and voting behavior.", "quote": "Saying you’re doing okay financially describes your current financial position. Saying you’re worse off than a year ago describes how that position has changed.", "locator": "The difference between the two SHED measures may partly reflect", "quote_verified": true}, {"claim": "Consumer sentiment appears to track the perceived change in household finances more closely than the perceived level of them, implying sentiment recovers only when households feel better than a year prior, not when they merely feel solvent.", "speaker": "St. Louis Fed — FRED Blog", "type": "causal", "entities": ["University of Michigan", "SHED", "Index of Consumer Sentiment"], "conviction": "medium", "so_what": "Sets the bar for a sentiment rebound: needs a visible year-over-year improvement in real household finances, not just stabilization.", "quote": null, "locator": "Measured this way, households' assessments of their own finances", "quote_verified": false}]}, {"theme": "Dispersion across households", "insights": [{"claim": "The gap between the two SHED measures may reflect financial experiences becoming more uneven across US households, with some doing relatively well while others deteriorate — an inequality story hidden inside stable aggregate averages.", "speaker": "St. Louis Fed — FRED Blog", "type": "thesis", "entities": ["SHED", "US households"], "conviction": "low", "so_what": "Supports a barbell read of consumer demand — premium and value formats gaining at the expense of the middle — rather than a uniform 'consumer is fine' call.", "quote": "It’s also possible that financial experiences have become more uneven across households, with some households doing relatively well while others have seen their financial situations deteriorate", "locator": "It's also possible that financial experiences have become", "quote_verified": true}, {"claim": "A stable aggregate share of adults 'doing okay financially' is compatible with widening dispersion underneath, so the headline percentage alone cannot distinguish broad stability from offsetting improvement and deterioration.", "speaker": "St. Louis Fed — FRED Blog", "type": "framework", "entities": ["SHED"], "conviction": "medium", "so_what": "Treat flat aggregate wellbeing prints as uninformative about distribution; demand the by-income cuts before concluding the consumer is healthy.", "quote": null, "locator": "consistent with the divergence of the two SHED measures", "quote_verified": false}]}, {"theme": "Survey construction as the confound", "insights": [{"claim": "The Michigan consumer sentiment index is broader than the SHED wellbeing question because it incorporates views about personal finances, business conditions, and buying conditions, leaving room for people to feel personally secure while judging the economy harshly.", "speaker": "St. Louis Fed — FRED Blog", "type": "causal", "entities": ["University of Michigan", "Index of Consumer Sentiment", "SHED"], "conviction": "medium", "so_what": "Much of the sentiment shortfall may be about perceived macro and price conditions rather than household finances — read it as a signal on policy and pricing perception, not spending capacity.", "quote": "The Michigan index is broader, incorporating views about personal finances, business conditions, and buying conditions.", "locator": "And there's another possibility. People may feel relatively secure", "quote_verified": true}, {"claim": "The FRED Blog explicitly declines to attribute the sentiment-wellbeing divergence to any single cause, presenting three candidate explanations while stating the graphs do not identify the driver.", "speaker": "St. Louis Fed — FRED Blog", "type": "thesis", "entities": ["FRED", "SHED", "University of Michigan"], "conviction": "medium", "so_what": "Anyone citing this Fed material as proof that sentiment is 'wrong' or that households are fine is overreaching the source.", "quote": "The graphs don’t tell us exactly what’s driving the difference", "locator": "The graphs don't tell us exactly what's driving the difference", "quote_verified": true}, {"claim": "The SHED wellbeing series are annual and thinly historied — the 'at least doing okay' series runs from 2013 to 2025 and the 'worse off than 12 months ago' series from 2014 to 2025 — so both comparisons rest on roughly a dozen annual observations.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["SHED", "ATLEASTDOINGOKAYFINANCIAL", "WORSEOFFFINANCIALLYALLADU", "FRED"], "conviction": "high", "so_what": "Low sample depth caps how much statistical weight the divergence can bear; treat it as a stylized fact, not an estimated relationship.", "quote": null, "locator": "How the graphs were created", "quote_verified": false}]}, {"theme": "Fed research agenda signal", "insights": [{"claim": "The St. Louis Fed's recent published blog output clusters on AI's labor-market effects — including whether generative AI saves time at work and whether AI is reducing employment for software coders — alongside rent affordability and state and metro employment.", "speaker": "St. Louis Fed — FRED Blog", "type": "anecdote", "entities": ["St. Louis Fed", "generative AI", "software coders", "FRED"], "conviction": "low", "so_what": "A regional Fed devoting recurring research bandwidth to AI displacement is an early tell that AI labor substitution is entering the official policy-data conversation.", "quote": null, "locator": "Recent Posts", "quote_verified": false}]}], "insight_total": 12, "top_entities": ["SHED", "Survey of Household Economics and Decisionmaking", "University of Michigan", "Index of Consumer Sentiment", "UMCSENT", "ATLEASTDOINGOKAYFINANCIAL", "WORSEOFFFINANCIALLYALLADU", "Federal Reserve Board", "FRED", "St. Louis Fed", "COVID-19 pandemic"], "source_meta": {"author": "", "word_count": 1143, "paywalled": false}}, {"record_id": "9e9f7d0bdd4705b2", "source_type": "concepts", "source_name": "World Gold Council", "source_url": "https://www.gold.org/goldhub/gold-focus/2026/09/unearthed-inside-refinery-ft-dr-robin-kolvenbach-argor-heraeus", "title": "Unearthed: Inside the Refinery ft Dr Robin Kolvenbach, Argor-Heraeus", "published_date": "2026-09-04", "language": "en", "processed_at": "2026-09-04T15:16:11Z", "processor": "claude-code-sub-opus", "tags": ["Macro"], "gist": "A World Gold Council podcast episode description previewing a conversation with Argor-Heraeus CEO Dr Robin Kolvenbach on precious metals refining economics: a rising gold price is framed as a cost and risk to refiners rather than a windfall, metal lease rates as the core margin driver, and responsible-sourcing demand as a force reshaping where refiners buy metal. The published text is a teaser only, not a transcript, so substantive detail is limited to the episode summary paragraph.", "themes": [{"theme": "Refiner economics vs gold price", "insights": [{"claim": "For precious metals refiners, a rising gold price acts as a cost and a risk rather than a revenue windfall, because refiners handle metal they do not own and must finance and hedge inventory.", "speaker": "@goldcouncil", "type": "contrarian", "entities": ["Argor-Heraeus", "gold", "precious metals refining", "Robin Kolvenbach"], "conviction": "high", "so_what": "Do not assume refining and fabrication names are leveraged longs on the gold price the way miners are; a gold rally can compress refiner working capital and margins rather than expand them.", "quote": "why a rising gold price is a cost and a risk to refiners, and how metal lease rates shape the business", "locator": "Episode one dives into the economics", "quote_verified": true}, {"claim": "Metal lease rates are presented as a core determinant of refining industry economics, meaning refiner profitability is driven by the cost of borrowing physical metal rather than by outright metal price direction.", "speaker": "@goldcouncil", "type": "framework", "entities": ["Argor-Heraeus", "gold lease rates", "precious metals refining"], "conviction": "high", "so_what": "Watch gold lease rates and forw
