infrastructure stack alongside compute and LLM access, not run as a side programme, and says he put this position into joint research with the World Economic Forum.", "speaker": "World Economic Forum", "type": "thesis", "entities": ["Ravi Kumar", "Cognizant", "World Economic Forum"], "conviction": "high", "so_what": "Expect corporate training spend to be reclassified as capex-adjacent AI spend — a tailwind for enterprise learning platforms tied to AI rollouts.", "quote": "Re-skilling should be a part of the infrastructure stack. It cannot be done on the side.", "locator": "Re-skilling should be a part of the infrastructure stack", "quote_verified": true}, {"claim": "Roughly one trillion dollars was invested into AI infrastructure over the past twelve months while, in Ravi Kumar's framing, that infrastructure goes obsolete in about six months — so the return depends entirely on how fast capability is converted into enterprise production value.", "speaker": "World Economic Forum", "type": "causal", "entities": ["AI infrastructure", "Ravi Kumar", "Cognizant"], "conviction": "high", "so_what": "A six-month obsolescence clock on a $1T capex base makes adoption speed, not compute supply, the binding constraint on AI returns — watch enterprise deployment velocity as the key risk marker.", "quote": "in the last 12 months, a trillion dollars has been invested into AI infrastructure. The scaling loss for this infrastructure is only six months, which means in six months it goes obsolete.", "locator": "And we need the production very to go up because the technology", "quote_verified": true}, {"claim": "Ravi Kumar proposes temporarily taxing capital that deploys digital labour to eliminate tasks more heavily than digital labour that amplifies human potential, framing it as a short-term levelling device between human and digital effort rather than a permanent policy.", "speaker": "World Economic Forum", "type": "contrarian", "entities": ["Ravi Kumar", "Cognizant", "capital taxation", "digital labour"], "conviction": "medium", "so_what": "A sitting AI-services CEO endorsing differential capital taxation is an early signal that automation-tax proposals could gain industry cover; a policy risk to pure-substitution automation plays.", "quote": "I wrote this thesis that you should tax to a large extent digital labour which is eliminating tasks versus amplifying human potential.", "locator": "In fact, I wrote this thesis that you should tax", "quote_verified": true}, {"claim": "The core timing problem is asymmetric flow: old jobs are exiting fast while new jobs arrive slowly, which is why Ravi Kumar argues a deliberate transitional 'bridge' or landing spot is needed rather than letting the market clear.", "speaker": "World Economic Forum", "type": "causal", "entities": ["Ravi Kumar", "Cognizant", "labour market"], "conviction": "high", "so_what": "Expect a multi-year window of elevated structural unemployment risk even in a net-job-growth scenario — relevant to consumer credit and discretionary spend exposure.", "quote": "The jobs of the past are moving out very quickly and the jobs of the future are coming at a slower pace.", "locator": "the jobs of the past are moving out very quickly", "quote_verified": true}]}, {"theme": "The broadening pyramid and the entry-level fight", "insights": [{"claim": "Against the consensus that AI wipes out entry-level work, Ravi Kumar holds the self-described contrarian view that talent pyramids get broader and shorter — more early-career hires, lower entry barriers and a shorter path to expertise.", "speaker": "World Economic Forum", "type": "contrarian", "entities": ["Ravi Kumar", "Cognizant", "entry-level hiring"], "conviction": "high", "so_what": "If the broad-pyramid view is right, firms cutting graduate intake now are mispositioned; watch graduate hiring numbers as the tell on which camp is winning.", "quote": "I've been a big believer. I've written quite a bit about this extensively, it's a contrarian view. I think the pyramids are going to be broader.", "locator": "So in that scenario, what happens to the kind of traditional talent pyramid", "quote_verified": true}, {"claim": "Cognizant is putting its own hiring behind the broad-pyramid thesis: 12,000 school graduates hired two years ago, 20,000 last year and more than 20,000 planned this year.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["Cognizant", "Ravi Kumar"], "conviction": "high", "so_what": "A hard, checkable commitment — track Cognizant's actual graduate intake as a falsifiable test of the 'AI kills entry-level jobs' narrative.", "quote": "We hired 20,000 school graduates last year. We're going to hire more than 20,00 this year. The year before we hired 12,000.", "locator": "I've been a big believer of this at Cognizant", "quote_verified": true}, {"claim": "Ravi Kumar predicts middle-management roles built on coordination, orchestration and moving information up and down will transition to digital labour, replaced by 'player coach' roles, with organisations shifting from hierarchical to network structures built on small modular pods and squads.", "speaker": "World Economic Forum", "type": "prediction", "entities": ["Ravi Kumar", "Cognizant", "middle management", "digital labour"], "conviction": "high", "so_what": "Middle-layer coordination headcount is the clearest automation target — a margin lever for large services and corporate employers, and a demand risk for tools that only manage hierarchy.", "quote": "The middle layers in every company are going to be player coaches.", "locator": "The middle layers in every company", "quote_verified": true}, {"claim": "Saadia Zahidi maps three competing explanations for shrinking entry-level hiring — an early canary signalling large urban rust belts, a temporary dip before broadening pyramids and wholly new roles, or plain belt-tightening from the economic cycle with nothing to do with AI — and says which one holds will vary by industry and organisational readiness.", "speaker": "World Economic Forum", "type": "framework", "entities": ["Saadia Zahidi", "World Economic Forum", "entry-level hiring"], "conviction": "medium", "so_what": "Don't read aggregate entry-level hiring data as an AI signal without controlling for the cycle; the three-camp frame is a checklist for testing company-level claims.", "quote": null, "locator": "There is this rumbling negative narrative around job losses", "quote_verified": false}, {"claim": "The World Economic Forum's research points to overall net job growth rather than net displacement over time, supporting the broader-based pyramid rather than the mass-unemployment scenario.", "speaker": "World Economic Forum", "type": "thesis", "entities": ["Saadia Zahidi", "World Economic Forum"], "conviction": "medium", "so_what": "The institutional base case is net job creation — a counterweight to bearish labour-displacement narratives when pricing consumer and labour-exposed assets.", "quote": "We have found that it is very likely that there is, likely to be overall job growth rather than overall job displacement or reduction over time.", "locator": "There is an overall net positive", "quote_verified": true}]}, {"theme": "Where the value lands: controls, wages and the frontline", "insights": [{"claim": "Over the last 50 years technology drifted value upward, creating layers of white-collar jobs that captured wage premiums and widened the divide, and Ravi Kumar frames AI as a chance to reverse that drift toward frontline workers.", "speaker": "World Economic Forum", "type": "thesis", "entities": ["Ravi Kumar", "Cognizant", "frontline workers"], "conviction": "high", "so_what": "Whether AI value drifts down or up determines the consumption base for the next cycle — an underrated macro variable behind the AI capex story.", "quote": null, "locator": "Over the last 50 years, technology has drifted that value upwards", "quote_verified": false}, {"claim": "Ravi Kumar's sharpest causal claim is that value follows controls, not access — giving frontline workers AI capability will not raise their wages unless judgement, accountability and outcomes are also redesigned into frontline roles.", "speaker": "World Economic Forum", "type": "causal", "entities": ["Ravi Kumar", "Cognizant", "frontline workers"], "conviction": "high", "so_what": "Tool access alone does not translate into wage or productivity gains; look for organisational redesign of decision rights as the real adoption signal.", "quote": "because value actually follows controls. It doesn't follow access.", "locator": "It doesn't necessarily increase wages", "quote_verified": true}, {"claim": "Per capita wages have not risen in real inflation-adjusted terms for the last 20 years, and Ravi Kumar argues higher frontline throughput could raise wages without generating inflation because output rises alongside pay.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["Ravi Kumar", "wages", "inflation"], "conviction": "medium", "so_what": "A non-inflationary wage-growth channel via AI throughput would change the rate-path calculus — worth monitoring in productivity and unit-labour-cost prints.", "quote": "Per capita wages have not gone up for the last 20 years if you if you adjust it to real inflation.", "locator": "If you're going to create more throughput", "quote_verified": true}, {"claim": "Because the interface to AI is natural language rather than digital skills, the line between producer and consumer of software is blurring, and Ravi Kumar argues the durable asymmetry becomes interdisciplinary combinations — a biologist, historian, lawyer or chartered accountant operating agentic tools — rather than depth of expertise alone.", "speaker": "World Economic Forum", "type": "thesis", "entities": ["Ravi Kumar", "Cognizant", "agentic AI", "natural language interfaces"], "conviction": "high", "so_what": "Single-discipline expertise businesses (basic legal, accounting, research support) face commoditisation; the premium moves to domain-plus-technology combinations.", "quote": "The asymmetry will come from interdisciplinary skills.", "locator": "I think what's going to certainly happen is there's going be diffusion", "quote_verified": true}, {"claim": "Ravi Kumar frames the consumer prize of AI as a personalised tutor and a nurse for every person on the planet at throwaway price, arguing capability delivered to the frontline is the highest-leverage use case.", "speaker": "World Economic Forum", "type": "thesis", "entities": ["Ravi Kumar", "Cognizant", "education technology", "healthcare"], "conviction": "medium", "so_what": "Points to where an AI-services CEO expects volume demand — mass-market tutoring and frontline health support rather than elite knowledge work.", "quote": "we now have this unique opportunity to have a tutor and a nurse for each individual, each person on the planet at a throwaway price", "locator": "including the fact that you would also use AI to create a personalised", "quote_verified": true}]}, {"theme": "Skilling economics and the funding mismatch", "insights": [{"claim": "Joint Cognizant-World Economic Forum research found base-level competence in AI and big data takes roughly 30 hours of study, with about 137 hours needed for proficiency — far lower than the barrier most people assume.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["Saadia Zahidi", "World Economic Forum", "Cognizant"], "conviction": "high", "so_what": "A 30-to-137-hour reskilling cost makes broad workforce AI literacy cheap relative to the capex — undercuts 'skills shortage' as an excuse for slow adoption.", "quote": "roughly through 30 hours of study. But of course, to become more proficient, then you're talking about 137 hours", "locator": "it is not quite as prohibitive as people may think", "quote_verified": true}, {"claim": "World Economic Forum research finds that if the world's workforce were 100 people, 11 could not be reskilled and redeployed inside their current organisation — setting a floor of roughly 11% of the global workforce needing a managed transition to an adjacent or entirely different industry.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["Saadia Zahidi", "World Economic Forum"], "conviction": "high", "so_what": "An 11% floor on cross-industry transitions is a quantifiable public-cost and social-risk estimate; it defines the addressable market for transition and retraining services.", "quote": "There's a minimum of that 11% of the current world's workforce that will need support in a managed workforce transition", "locator": "if the world's workforce was 100 people", "quote_verified": true}, {"claim": "For roughly the last decade, 60 to 70 percent of business leaders have told the World Economic Forum that a lack of skilled entry-level workers is a major brake on transforming their organisations — meaning the education-to-work skills mismatch predates AI entirely.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["Saadia Zahidi", "World Economic Forum", "education systems"], "conviction": "high", "so_what": "The talent bottleneck is structural, not AI-caused; solutions that only address AI reskilling miss the larger constraint on corporate transformation.", "quote": "the lack of skilled entry-level workers is one of the major things holding back the transformation of their organisations", "locator": "one point that I think is probably consistently true", "quote_verified": true}, {"claim": "OECD countries spend only about 0.11% of GDP on post-university lifelong learning and retraining, even though large businesses individually spend thousands per employee — the money exists but is not connected to the universities and community colleges that could deliver it at scale.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["Saadia Zahidi", "OECD", "universities", "community colleges"], "conviction": "high", "so_what": "The gap is a distribution problem, not a funding problem — a policy-driven reallocation would be a large demand shock for workforce-education providers.", "quote": "something like 0.11% of the GDP of OECD countries is spent on the lifelong learning piece", "locator": "And there is an interesting stat", "quote_verified": true}, {"claim": "Saadia Zahidi argues AI is simultaneously lowering the cost of reskilling and enabling personalised learning, so the technology causing the disruption also supplies the cheapest remedy for it.", "speaker": "World Economic Forum", "type": "causal", "entities": ["Saadia Zahidi", "World Economic Forum", "artificial intelligence"], "conviction": "medium", "so_what": "Reskilling unit economics improve as AI improves — a reason the transition may be faster and cheaper than headline displacement estimates imply.", "quote": null, "locator": "Because of course, the costs of re-skilling and up-skilling are also going down", "quote_verified": false}]}, {"theme": "Education redesign and policy scenarios", "insights": [{"claim": "Ravi Kumar calls the standard life template — 25 years of full-time education, 50 years of work, then retirement — a linear artifact of the industrial revolution that no longer matches the clock speed of change, since the disruption now hits mid-career rather than at the start or end.", "speaker": "World Economic Forum", "type": "framework", "entities": ["Ravi Kumar", "Cognizant", "education systems"], "conviction": "high", "so_what": "Mid-career retraining, not youth education, is where the unmet demand and the policy money will have to go.", "quote": null, "locator": "the current system of going to an academic, full-time academic intervention", "quote_verified": false}, {"claim": "Ravi Kumar's practical resolution of the AI-in-education dichotomy is to build native skills in class without AI and to do homework and evaluations with AI, so students develop the judgement to be amplified rather than substituted.", "speaker": "World Economic Forum", "type": "framework", "entities": ["Ravi Kumar", "Cognizant", "K-12", "universities"], "conviction": "high", "so_what": "A concrete assessment-design template that education providers and edtech vendors will be pushed toward; watch for institutions adopting split native/amplified evaluation.", "quote": "you should build native skills, a class without AI, and you should build, you should do your homework and your evaluations with AI", "locator": "One of the policymakers asked me this question", "quote_verified": true}, {"claim": "Ravi Kumar highlights the absurdity that institutions threaten to fire students for using AI while employers threaten to fire employees for not using it — a dichotomy that current education policy has no coherent answer to.", "speaker": "World Economic Forum", "type": "anecdote", "entities": ["Ravi Kumar", "Cognizant", "education systems"], "conviction": "high", "so_what": "The unresolved contradiction is a leading indicator that academic assessment models are about to be forcibly rewritten.", "quote": "we tell students if you use AI at your work at your class we're going to fire you and we're telling employees if you don't use we'll fire you", "locator": "I mean it's funny we tell students", "quote_verified": true}, {"claim": "The World Economic Forum has launched a 'First Mile Sandbox' to build university-industry partnerships including digital apprenticeships, starting with five industries and planning to extend it across all the Forum's industry groupings.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["World Economic Forum", "Saadia Zahidi", "First Mile Sandbox", "universities"], "conviction": "medium", "so_what": "A concrete institutional vehicle to track — early corporate participants signal which sectors are moving first on AI-era talent pipelines.", "quote": null, "locator": "this is why we've set up at the Forum the First Mile Sandbox", "quote_verified": false}, {"claim": "Saadia Zahidi's scenario framework uses two vectors — speed of technology integration across an economy and speed of skilling the workforce — and concludes the only no-regret policy move is to pair technology investment with equivalent people investment, because returns on the former cannot be captured without the latter.", "speaker": "World Economic Forum", "type": "framework", "entities": ["Saadia Zahidi", "World Economic Forum"], "conviction": "high", "so_what": "Use the tech-speed versus skilling-speed grid to rank national exposure; economies investing in compute without skilling should underdeliver on productivity gains.", "quote": "There is essentially no such thing as getting the returns from the technology investment without the equivalent people investment, because these two things have to work together.", "locator": "Let me maybe just give a quick overview of a scenarios piece", "quote_verified": true}, {"claim": "Nearly 3 billion people still lack basic digital connectivity, which Saadia Zahidi frames as a fast-growing chasm between haves and have-nots that makes raising the digital floor a precondition for any AI-driven productivity story.", "speaker": "World Economic Forum", "type": "data_point", "entities": ["Saadia Zahidi", "World Economic Forum", "digital connectivity"], "conviction": "high", "so_what": "Global AI productivity forecasts that ignore 3 billion unconnected people are overstated; connectivity infrastructure remains an upstream investment theme.", "quote": "there's nearly 3 billion people across the planet that still don't have basic digital connectivity", "locator": "I think the second piece is around raising the digital floor", "quote_verified": true}, {"claim": "Saadia Zahidi notes that the time to realising productivity gains from the massive AI investment bet is slowing down, and reframes that slowdown not as disappointment but as the window in which managed workforce transitions can actually be executed.", "speaker": "World Economic Forum", "type": "contrarian", "entities": ["Saadia Zahidi", "World Economic Forum", "AI investment"], "conviction": "medium", "so_what": "A slower productivity payback is bearish for near-term AI capex returns but is the article's stated condition for an orderly labour transition — a useful two-sided read on adoption-lag data.", "quote": "Things are moving perhaps a little bit slower than we might have all thought a couple of years ago, but then on the other hand, they're still moving a lot faster than our current systems are designed to address.", "locator": "the time to productivity gains is somewhat slowing down", "quote_verified": true}]}], "insight_total": 34, "top_entities": ["Ravi Kumar", "Cognizant", "Saadia Zahidi", "World Economic Forum", "Gayle Markovitz", "Radio Davos", "Robin Pomeroy", "OECD", "First Mile Sandbox", "digital labour"], "source_meta": {"author": "", "word_count": 6307, "paywalled": false}}, {"record_id": "e43478b92e85bc2f", "source_type": "concepts", "source_name": "Gavekal Research", "source_url": "https://research.gavekal.com/teaser/ai-versus-the-labor-market/", "title": "AI Versus The Labor Market", "published_date": "2026-09-03", "language": "en", "processed_at": "2026-09-04T15:14:35Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "AI", "Tech"], "gist": "Fed Chair Kevin Warsh's thesis that the US AI capex boom will lift productivity and damp inflation is not showing up in the data: since ChatGPT launched in late 2022, solid productivity growth has come alongside rising inflation, with real GDP still near its 20-year median of 2.3%. The proposed missing piece is a labor shortage that caps supply while the compute build-out adds demand.", "themes": [{"theme": "Warsh's 1990s Productivity Analogy", "insights": [{"claim": "Federal Reserve Chair Kevin Warsh has long argued the US artificial-intelligence capital spending boom will raise labor productivity, replaying the late-1990s technology boom by supporting real GDP growth while weighing on inflation.", "speaker": "Gavekal Research", "type": "thesis", "entities": ["Kevin Warsh", "Federal Reserve", "AI", "US"], "conviction": "high", "so_what": "This is the sitting Fed Chair's growth/inflation model, so it is the implicit reaction function behind US rate policy; if it is wrong, cuts priced on 'AI is disinflationary' are mispriced.", "quote": "Federal Reserve Chair Kevin Warsh has long argued that the massive artificial-intelligence capital spending boom in the US will improve labor productivity.", "locator": "Federal Reserve Chair Kevin Warsh has long", "quote_verified": true}, {"claim": "The late-1990s tech boom is being used as the template for the current AI capex cycle, implying the same combination of faster real growth and softer inflation should recur.", "speaker": "Gavekal Research", "type": "framework", "entities": ["Kevin Warsh", "AI", "US"], "conviction": "medium", "so_what": "Watch whether the 1990s analogy holds; the analogy assumed elastic labor supply, and that assumption is the weak link to stress-test in macro forecasts.", "quote": "Like the technology boom of the late 1990s, he expects this technological transformation to support real GDP growth and weigh on inflation.", "locator": "Like the technology boom of the late 1990s", "quote_verified": true}]}, {"theme": "Productivity Without Disinflation", "insights": [{"claim": "Since the launch of ChatGPT in late 2022, solid US productivity growth has coincided with rising inflation rather than the disinflation a productivity boom is supposed to deliver.", "speaker": "Gavekal Research", "type": "contrarian", "entities": ["ChatGPT", "US", "inflation", "AI"], "conviction": "high", "so_what": "Undercuts the 'AI is disinflationary' trade; argues against being long duration on the assumption that AI productivity gains will pull CPI down.", "quote": "solid US productivity growth since the launch of ChatGPT in late 2022 has coincided with rising inflation", "locator": "So far, however, solid US productivity growth", "quote_verified": true}, {"claim": "US real GDP growth has continued at roughly its 20-year median of 2.3% despite the AI capital spending boom, showing no visible acceleration in trend growth so far.", "speaker": "Gavekal Research", "type": "data_point", "entities": ["US", "real GDP", "AI"], "conviction": "high", "so_what": "A concrete benchmark: until US real GDP prints durably above ~2.3%, claims that AI has lifted the growth trend are unsupported, and equity earnings models built on an AI growth uplift are running ahead of the data.", "quote": null, "locator": "real GDP growth continuing to chug along", "quote_verified": false}]}, {"theme": "Labor Supply As Binding Constraint", "insights": [{"claim": "A shortage of workers, not a shortage of technology, is the constraint on the US economy's ability to expand supply fast enough to meet the extra demand created by the AI compute build-out.", "speaker": "Gavekal Research", "type": "causal", "entities": ["US", "labor market", "AI", "compute build-out"], "conviction": "high", "so_what": "If labor supply is the binding constraint, AI capex is net inflationary in the near term; watch labor force participation, immigration flows and wage growth as the real swing factor for Fed policy.", "quote": "AI is helping workers produce more, but a shortage of workers is constraining the economy’s ability to increase supply fast enough to meet the additional demand generated by the compute build-out.", "locator": "AI is helping workers produce more", "quote_verified": true}, {"claim": "The labor market is identified as the missing variable that reconciles why better productivity has not translated into faster growth or lower inflation in the US.", "speaker": "Gavekal Research", "type": "framework", "entities": ["labor market", "US", "inflation", "AI"], "conviction": "medium", "so_what": "Reframes AI macro analysis from a productivity question to a labor supply question, which changes which data releases actually matter for the AI trade.", "quote": "The missing piece in the puzzle may be the labor market.", "locator": "The missing piece in the puzzle", "quote_verified": true}]}], "insight_total": 6, "top_entities": ["Kevin Warsh", "Federal Reserve", "ChatGPT", "AI", "US", "labor market", "Gavekal Research", "Tan Kai Xian"], "source_meta": {"author": "", "word_count": 154, "paywalled": false}}, {"record_id": "f7da1a7c7c0b9b4a", "source_type": "concepts", "source_name": "Dimensional Fund Advisors", "source_url": "https://www.dimensional.com/us-en/insights/factor-industry-resembles-the-market", "title": "Factor Industry Resembles the Market | Dimensional", "published_date": "2026-09-04", "language": "en", "processed_at": "2026-09-04T15:13:55Z", "processor": "claude-code-sub-opus", "tags": ["Positioning"], "gist": "Dimensional aggregates the Morningstar strategic beta category (560+ funds, ~$3 trillion) and finds the average dollar in factor-based products looks close to the market: slightly smaller and growthier than the Russell 3000 with very similar profitability. That implies factor crowding is not yet visibly compressing size and value premiums.", "themes": [{"theme": "Crowding-kills-premiums mechanism", "insights": [{"claim": "A rise in factor-based investing could mechanically lower expected size and value premiums, because more factor money bidding for small cap and value stocks raises their prices and lowers their expected returns.", "speaker": "Wes Crill, PhD, Senior Client Solutions Director and Vice President", "type": "causal", "entities": ["factor investing", "small cap", "value stocks", "size premium", "value premium"], "conviction": "medium", "so_what": "This is the core bear case on factor strategies; monitor aggregate factor-fund characteristics rather than assuming premiums persist unchanged.", "quote": "If factor-based investors increase the overall demand for small cap and value stocks, the expected premium for these stocks could become lower.", "locator": "As factor-based investing grows, how might", "quote_verified": true}, {"claim": "The heterogeneity of factor products is the main reason factor growth need not compress premiums: different factor portfolios target different slices of the market, so their tilts can offset and leave a negligible net effect on expected returns.", "speaker": "Wes Crill, PhD, Senior Client Solutions Director and Vice President", "type": "framework", "entities": ["factor investing", "strategic beta", "expected return premiums"], "conviction": "high", "so_what": "Judge crowding risk on the net aggregate tilt of factor assets, not on headline growth of factor AUM.", "quote": "However, there are many different types of factor-based portfolios that may result in targeting different areas of the market and exerting negligible net effect on expected return premiums.", "locator": "However, there are many different types", "quote_verified": true}]}, {"theme": "Average dollar in strategic beta", "insights": [{"claim": "The Morningstar strategic beta category spans more than 560 funds managing collectively about $3 trillion, all tracking indices that deliberately deviate from the market to raise return or manage risk.", "speaker": "Wes Crill, PhD, Senior Client Solutions Director and Vice President", "type": "data_point", "entities": ["Morningstar", "strategic beta"], "conviction": "high", "so_what": "Sizes the pool of money that could theoretically crowd factor premiums, giving a concrete denominator for crowding debates.", "quote": "This category includes more than 560 funds, managing collectively about $3 trillion and tracking indices that deviate from the market based on specific objectives, such as increasing return or managing risk.", "locator": "Plotting characteristics for the Morningstar strategic beta", "quote_verified": true}, {"claim": "Aggregated as of June 30, 2026, funds in the Morningstar strategic beta category skew slightly smaller and growthier than the Russell 3000 Index while showing very similar profitability.", "speaker": "Wes Crill, PhD, Senior Client Solutions Director and Vice President", "type": "data_point", "entities": ["Morningstar", "Russell 3000 Index", "strategic beta", "profitability"], "conviction": "high", "so_what": "The aggregate factor dollar is barely tilted, so buying small and value today is not obviously buying into a crowded trade.", "quote": "Compared to the Russell 3000 Index, these funds skew slightly smaller and growthier, but with very similar profitability.", "locator": "Compared to the Russell 3000 Index", "quote_verified": true}, {"claim": "The average dollar in factor-based products is tilted toward growth rather than value, which cuts against the intuition that factor investing is predominantly a value trade.", "speaker": "Wes Crill, PhD, Senior Client Solutions Director and Vice President", "type": "contrarian", "entities": ["strategic beta", "value stocks", "Russell 3000 Index"], "conviction": "medium", "so_what": "If factor money is net growthy, the value premium faces less flow-driven compression than the crowding narrative assumes.", "quote": null, "locator": "And that style is more market-like than some might expect", "quote_verified": false}, {"claim": "Profitability, defined as operating income before depreciation and amortization minus interest expense scaled by book equity, is the characteristic on which strategic beta funds most closely match the broad market.", "speaker": "Wes Crill, PhD, Senior Client Solutions Director and Vice President", "type": "data_point", "entities": ["profitability", "strategic beta", "Russell 3000 Index"], "conviction": "medium", "so_what": "The profitability premium shows the least evidence of crowding, making quality-style tilts the least contested of the common factors on this evidence.", "quote": null, "locator": "Glossary — Profitability", "quote_verified": false}]}, {"theme": "Evidence standard and its limits", "insights": [{"claim": "Aggregating the holdings characteristics of an entire fund category to describe the style of the average dollar invested is the diagnostic used to test whether factor strategies are competing away their own premiums.", "speaker": "Wes Crill, PhD, Senior Client Solutions Director and Vice President", "type": "framework", "entities": ["Morningstar", "strategic beta", "factor investing"], "conviction": "high", "so_what": "A repeatable, cheap crowding check: track category-level size, relative price, and profitability tilts versus a broad benchmark over time.", "quote": "Aggregating their characteristics tells us the style of the average dollar invested in the group.", "locator": "Aggregating their characteristics tells us", "quote_verified": true}, {"claim": "On the strategic beta sample there is little evidence that factor investors are attenuating the premiums associated with higher expected return stocks, though the conclusion is explicitly hedged to that one sample.", "speaker": "Wes Crill, PhD, Senior Client Solutions Director and Vice President", "type": "thesis", "entities": ["strategic beta", "factor investing", "expected return premiums"], "conviction": "medium", "so_what": "Supports staying invested in systematic size, value, and profitability tilts, while flagging that the test excludes non-strategic-beta factor capital such as active and hedge fund money.", "quote": "Based on this sample, at least, there’s not much evidence factor investors are attenuating premiums associated with higher expected return stocks.", "locator": "Based on this sample, at least", "quote_verified": true}]}], "insight_total": 8, "top_entities": ["Morningstar", "Russell 3000 Index", "strategic beta", "Dimensional", "Wes Crill", "small cap", "value stocks", "profitability", "size premium", "value premium"], "source_meta": {"author": "Wes Crill, PhD, Senior Client Solutions Director and Vice President", "word_count": 1385, "paywalled": false}}, {"record_id": "ff7241bf4136056b", "source_type": "concepts", "source_name": "BCG Henderson Institute", "source_url": "https://www.bcg.com/publications/2026/european-auto-aftermarket-outlook-2035", "title": "The European Aftermarket in 2035: The Winners Are Being Determined Now", "published_date": "2026-09-03", "language": "en", "processed_at": "2026-09-04T15:13:27Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Tech", "AI", "Positioning"], "gist": "BCG projects the European automotive aftermarket to grow at just 1.7% CAGR to EUR 116 billion by 2035 (versus 4.7% in 2021-2025), as an aging, slower-growing car parc, falling mileage and a rise in BEVs to 26% of the parc strip out routine maintenance volume. Value per repair visit, not vehicle throughput, becomes the growth engine, while fleets (20% of the parc by 2035), insurers (70% of collision work) and online platforms take control of demand, and AI capability separates winners from a structurally disadvantaged rest.", "themes": [{"theme": "Volume-to-Value Inflection", "insights": [{"claim": "The European automotive aftermarket is forecast to grow at a 1.7% CAGR through 2035, less than half the 4.7% CAGR recorded from 2021 to 2025.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["European automotive aftermarket", "Europe"], "conviction": "high", "so_what": "Reset top-line growth assumptions for listed European parts distributors and suppliers: the sector's recent growth rate is not the run rate.", "quote": null, "locator": "As a result of these factors, we expect", "quote_verified": false}, {"claim": "European aftermarket revenue is projected to reach EUR 116 billion by 2035 from EUR 99 billion in 2025, measured at wholesale level excluding labor and including both the independent aftermarket and original equipment suppliers.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["European automotive aftermarket"], "conviction": "high", "so_what": "A EUR 17 billion increment over ten years is the entire addressable growth pool - share shift, not market growth, is where returns come from.", "quote": null, "locator": "Volume Is No Longer the Main Growth Engine", "quote_verified": false}, {"claim": "The historic aftermarket business model in which more cars mechanically meant more repair work is described as obsolete, with value per repair shop visit replacing vehicle volume as the growth engine.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": ["European automotive aftermarket", "repair shops"], "conviction": "high", "so_what": "Screen aftermarket operators on revenue per workshop visit and attach rate, not on vehicles serviced or outlet count.", "quote": "Volume is giving way to value and integrated ecosystems are replacing one-to-one transactional relationships.", "locator": "The Time to Act Is Now", "quote_verified": true}, {"claim": "By 2035 the European aftermarket is expected to be both more digitally dependent and more concentrated than today, with customer access channeled through digital platforms and AI-enabled interfaces.", "speaker": "BCG Henderson Institute", "type": "prediction", "entities": ["European automotive aftermarket"], "conviction": "high", "so_what": "Structural consolidation implies a multi-year M&A pipeline and margin expansion for scaled, digitally integrated players; sub-scale independents are the supply.", "quote": null, "locator": "By 2035, the aftermarket will be more dependent", "quote_verified": false}]}, {"theme": "Car Parc Math and Electrification Drag", "insights": [{"claim": "The European car parc is projected to reach 343 million units by 2035, but growing at only a 0.4% CAGR versus 1% from 2021 to 2026.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["European car parc", "Europe"], "conviction": "high", "so_what": "Unit growth contributes almost nothing to aftermarket demand this decade; the bull case must rest on price and content per car.", "quote": null, "locator": "Aging Car Parc. High new-vehicle prices", "quote_verified": false}, {"claim": "By 2035 more than one-third of vehicles on European roads are projected to be older than 16 years, up from 23% in 2021, as high new-vehicle prices push consumers toward used ICE cars and longer holding periods.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["European car parc", "ICE vehicles"], "conviction": "high", "so_what": "An older parc favors independent repair chains and value/private-label parts over OEM-tied service networks - a positive offset to EV-driven volume loss.", "quote": null, "locator": "Aging Car Parc. High new-vehicle prices", "quote_verified": false}, {"claim": "Total kilometers driven across European vehicles remains below the 2019 level because of weaker passenger vehicle usage, even though light commercial van mileage has risen above 2019, and kilometers per vehicle are projected to shrink 0.6% per year through 2035.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["light commercial vehicles", "European car parc"], "conviction": "high", "so_what": "Wear-and-tear parts demand is in structural per-vehicle decline; van and commercial fleet exposure is the mileage growth pocket.", "quote": null, "locator": "Structural Decline in Vehicle Usage", "quote_verified": false}, {"claim": "Pure battery electric vehicles are projected to reach 26% of the European car parc by 2035, up from 4% in 2025, and the EV shift alone is expected to subtract roughly 0.7 percentage points from annual aftermarket growth through 2035.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["BEVs", "EVs", "European car parc"], "conviction": "high", "so_what": "That -0.7pp is the single quantified drag on the sector; it converts EV adoption forecasts directly into aftermarket revenue estimates.", "quote": null, "locator": "Electrification. This is one of the biggest forces", "quote_verified": false}, {"claim": "EVs cut routine maintenance demand because they have fewer moving parts, but make individual repairs more expensive because their components are more technologically complex - shifting aftermarket economics from frequency to ticket size.", "speaker": "BCG Henderson Institute", "type": "causal", "entities": ["EVs", "ICE vehicles", "repair shops"], "conviction": "high", "so_what": "Winners will be shops with high-voltage systems and thermal management capability; volume-based independents lose twice as visits fall and complexity rises.", "quote": null, "locator": "Electrification. This is one of the biggest forces", "quote_verified": false}, {"claim": "Advanced Driver Assistance Systems will reach roughly one-third of the European car parc by 2030 and reduce collisions, cutting crash repair demand while raising per-visit value for shops equipped to do calibration once parts standardize.", "speaker": "BCG Henderson Institute", "type": "causal", "entities": ["ADAS", "European car parc", "collision repair"], "conviction": "medium", "so_what": "Collision repair volume is a shrinking pool; calibration capability and standardized ADAS parts are where the margin migrates.", "quote": null, "locator": "ADAS. The introduction of Advanced Driver Assistance Systems", "quote_verified": false}]}, {"theme": "Pricing Power and the Inflation Split", "insights": [{"claim": "Annual price increases for OEM components are running more than 2.5 percentage points above general inflation in some countries, driven partly by the added complexity of electronic sensors and onboard computers in modern vehicles.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["OEMs", "auto components"], "conviction": "high", "so_what": "Component price inflation well above CPI is the core pricing-power argument for parts makers - and a wedge that pushes consumers toward independents and private label.", "quote": null, "locator": "Vehicle Architecture. Both EVs and modern ICE vehicles", "quote_verified": false}, {"claim": "The average cost of a repair in Germany rose 4% between 2024 and 2025, with inflation in labor and materials cited as the main driver of aftermarket revenue growth through 2035.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["Germany", "repair shops"], "conviction": "high", "so_what": "Reported aftermarket revenue growth is largely a price effect; real volume trends are weaker than headline sales suggest.", "quote": null, "locator": "Macroeconomic Conditions. Inflation", "quote_verified": false}, {"claim": "Rising repair and maintenance costs are expected to make many consumers defer repair shop visits, particularly for nonessential work, partially offsetting the revenue benefit of price inflation.", "speaker": "BCG Henderson Institute", "type": "causal", "entities": ["consumers", "repair shops"], "conviction": "medium", "so_what": "Watch deferral of discretionary maintenance as a leading indicator of aftermarket volume misses in weak consumer environments.", "quote": null, "locator": "Macroeconomic Conditions. Inflation", "quote_verified": false}, {"claim": "Inflation is bifurcating the aftermarket because stronger players can pass rising costs to consumers while weaker ones must absorb them, so the sector's aggregate markup rises far less than input inflation.", "speaker": "BCG Henderson Institute", "type": "causal", "entities": ["European automotive aftermarket", "repair shops"], "conviction": "high", "so_what": "Do not model sector-wide margin expansion from inflation; pass-through ability is the differentiator between winners and casualties.", "quote": "As a result, the overall rise in players’ markup is far lower than inflationary effects.", "locator": "Macroeconomic Conditions. Inflation", "quote_verified": true}]}, {"theme": "Regulation as Tailwind and Moat", "insights": [{"claim": "The new Euro 7 component standard, taking effect later in 2026 with tougher specification, durability, and environmental monitoring requirements, is expected to work in the aftermarket's favor by raising the quality bar and reinforcing demand for compliant high-spec replacement parts.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": ["Euro 7", "EU", "auto components"], "conviction": "high", "so_what": "A regulatory quality floor is a share-shift catalyst toward compliant premium suppliers and against the cheapest imported parts.", "quote": null, "locator": "A Changing Regulatory Landscape Offers New Opportunities", "quote_verified": false}, {"claim": "Updated EU regulations on end-of-life vehicles and batteries raise the compliance burden for parts suppliers and repair shops, making position within emerging circularity value chains a strategic decision rather than a compliance chore.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": ["EU", "end-of-life vehicles", "batteries", "repair shops"], "conviction": "medium", "so_what": "Compliance cost is a fixed-cost barrier that accelerates consolidation and rewards players who monetize remanufacturing and recycling.", "quote": null, "locator": "A Changing Regulatory Landscape Offers New Opportunities", "quote_verified": false}, {"claim": "The Motor Vehicle Block Exemption Regulation and emerging data access rules continue to protect the independent aftermarket's access to vehicle data, repair information, and spare parts markets.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["MVBER", "EU", "independent aftermarket"], "conviction": "medium", "so_what": "The independent channel's survival is a regulatory construct; any weakening of MVBER or data access rules is an existential risk worth monitoring.", "quote": null, "locator": "A Changing Regulatory Landscape Offers New Opportunities", "quote_verified": false}]}, {"theme": "Demand Gatekeepers: Fleets, Insurers, Platforms", "insights": [{"claim": "Fleet-owned vehicles are forecast to reach 20% of the European car parc by 2035, up from 8% in 2021, concentrating repair purchasing decisions in professionalized, cost-conscious buyers.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["fleet operators", "European car parc"], "conviction": "high", "so_what": "A 2.5x rise in fleet share means B2B procurement pressure on workshop pricing; independents without fleet contracts lose access to the fastest-growing demand pool.", "quote": null, "locator": "Fleets and Insurers Are Becoming More Powerful", "quote_verified": false}, {"claim": "Insurance companies handle around 70% of collision-related repairs and allocate that work through claims management platforms and preferred networks, giving them decisive control over which repairers get the job.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["insurers", "collision repair"], "conviction": "high", "so_what": "Insurer network inclusion is effectively a licence to operate in collision repair; exclusion from claims platforms is a demand cliff.", "quote": null, "locator": "Fleets and Insurers Are Becoming More Powerful", "quote_verified": false}, {"claim": "Winning fleet and insurer business requires repair shops to integrate their systems into the fleets' and insurers' own IT systems and digital ecosystems, a bar that smaller aftermarket players will struggle to clear and that risks excluding them from a growing segment.", "speaker": "BCG Henderson Institute", "type": "causal", "entities": ["fleet operators", "insurers", "repair shops"], "conviction": "high", "so_what": "IT integration capability, not workshop quality, becomes the gating factor for demand access - a hidden capex line for small operators and a consolidation driver.", "quote": null, "locator": "Both fleet operators and insurers impose new requirements", "quote_verified": false}, {"claim": "Fleet and insurer work is stable and high-volume but comes with standardization demands, little operational flexibility, and tight margins for the repairer.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": ["fleet operators", "insurers", "repair shops"], "conviction": "medium", "so_what": "Revenue quality matters: workshop chains skewing to fleet/insurer channels should be underwritten on lower structural margins than independent retail work.", "quote": null, "locator": "Both fleet operators and insurers impose new requirements", "quote_verified": false}, {"claim": "Private-label components, typically manufactured outside Europe, have grown to roughly 20% market share across EMEA over the past five years, driven by the purchasing power of emerging buyer groups.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["private label", "tier 1 suppliers", "EMEA"], "conviction": "high", "so_what": "A one-fifth private-label share is a direct margin and volume threat to established tier 1 branded parts makers - track brand mix disclosure closely.", "quote": null, "locator": "Private Labels Are Gaining Relevance", "quote_verified": false}, {"claim": "Online platforms are disintermediating wholesalers by building direct supplier and repair shop relationships and letting shops source cheaper third-party parts worldwide using databases of exact technical specifications, wiring diagrams, and benchmark diagnostic approaches.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": ["online platforms", "wholesalers", "repair shops"], "conviction": "high", "so_what": "Traditional parts distribution faces an Amazon-style intermediation risk; wholesaler multiples should embed platform share loss over the next decade.", "quote": null, "locator": "New Digital Entrants as a Market Trend", "quote_verified": false}, {"claim": "Compliance costs, margin pressure, and the capital needed for EV and digital capability investment are making the rationale for M&A across the aftermarket value chain more urgent.", "speaker": "BCG Henderson Institute", "type": "causal", "entities": ["European auto // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
