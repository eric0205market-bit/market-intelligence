insic value, determines which sites survive.", "quote": "Castle Bucholie, listed by Historic Environment Scotland, but without the same resources to protect it from its fate.", "locator": "A recent National Trust report admitted", "quote_verified": true}, {"claim": "Placing sites on preservation lists does not truly protect them; 'managed ruination' can instead be used to write an 'anticipatory history' of absence.", "speaker": "KAT HILL", "type": "contrarian", "entities": ["Caitlin DeSilvey", "managed ruination"], "conviction": "medium", "so_what": "Expect heritage policy to move from preservation toward documenting and narrating decline.", "quote": "Preservation suggests we can protect things in the future by putting them on lists, but that’s not really true.", "locator": "“Old” ruins were once homes or lives.", "quote_verified": true}, {"claim": "Archaeologists have recorded oral histories around Happisburgh and 3D-scanned its church, and Tuvalu aims to become the first 'digital nation' as its atolls sink.", "speaker": "KAT HILL", "type": "data_point", "entities": ["Happisburgh", "Tuvalu"], "conviction": "high", "so_what": "Digital preservation is emerging as the adaptation strategy of last resort for places that cannot be physically saved.", "quote": "Tuvalu, a Pacific Island nation comprising small islets and low-lying atolls, is aiming to become the first “digital nation.”", "locator": "What hope could it ring for?", "quote_verified": true}]}, {"theme": "Ecological squeeze and ontological loss", "insights": [{"claim": "Saltwater incursion from storm surges into Norfolk's Broads, mudflats and marshes kills the invertebrates nesting waders feed on and washes away habitat.", "speaker": "KAT HILL", "type": "causal", "entities": ["Norfolk", "Broads"], "conviction": "high", "so_what": "Coastal climate impacts extend inland through estuarine systems, degrading biodiversity beyond the shoreline.", "quote": "Salty waters kill invertebrates on which nesting waders feed, and wash away habitat.", "locator": "Norfolk’s water systems — the great", "quote_verified": true}, {"claim": "Climate change may not kill everyone but may destroy the things that give life meaning, a form of what Jonathan Lear called ontological vulnerability.", "speaker": "KAT HILL", "type": "thesis", "entities": ["Jonathan Lear", "climate change"], "conviction": "medium", "so_what": "The social cost of coastal loss includes community and cultural collapse that is not captured in economic justifications.", "quote": "Climate change may not kill everyone, but it may destroy the things that give life meaning.", "locator": "On the Norfolk coast, the pub, the church", "quote_verified": true}]}], "insight_total": 18, "top_entities": ["Happisburgh", "Norfolk", "Sellafield", "Sizewell C", "Sizewell B", "Shoreline Management Plans", "Fairbourne", "Braystones Beach", "National Trust", "Tuvalu", "Jonathan Lear", "Castle Sinclair Girnigoe"], "source_meta": {"author": "KAT HILL", "word_count": 3398, "paywalled": false}}, {"record_id": "369ef72186061d3b", "source_type": "concepts", "source_name": "a16z Blog", "source_url": "https://a16z.com/introducing-securing-americas-infrastructure-foundation/", "title": "Introducing Securing America’s Infrastructure Foundation | Andreessen Horowitz", "published_date": "2026-10-15", "language": "en", "processed_at": "2026-10-16T11:14:58Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI", "Society", "Geopolitics"], "gist": "a16z has incubated Securing America’s Infrastructure Foundation (SAIF), a 501(c)(3) nonprofit led by Anne Neuberger that will deliver free AI-based cybersecurity software, training and incident response to under-resourced public institutions such as small municipalities, school districts and rural hospitals. It starts with a two-city pilot and $25 million in committed funding from a16z's founding partners, aiming for 5-10 anchor cities over five years.", "themes": [{"theme": "Under-resourced public institutions ility are inversely distributed across U.S. infrastructure, creating a systemic weak link.", "quote": "the same institutions expected to protect the most sensitive data and systems in our communities — student records, patient files, water systems, emergency services — are the least resourced to do it.", "locator": "I spent the last several years", "quote_verified": true}, {"claim": "SAIF plans to focus on specific critical sectors such as the roughly 1,800 rural U.S. hospitals, which are often the only providers of critical services in their communities.", "speaker": "Anne Neuberger", "type": "data_point", "entities": ["rural hospitals", "SAIF"], "conviction": "medium", "so_what": "Single-provider institutions carry concentrated community risk, so a breach there has outsized local impact.", "quote": "the nation’s 1,800 rural hospitals for example – that provide critical services to communities where they are the only providers.", "locator": "Sectors:", "quote_verified": true}]}, {"theme": "AI divide between well-resourced and small institutions", "insights": [{"claim": "AI is improving productivity, diagnostics and cyber defense at well-resourced organizations but is largely bypassing small public institutions, not because it doesn't apply but because it may not be accessible, affordable or practical for them.", "speaker": "Anne Neuberger", "type": "thesis", "entities": ["AI"], "conviction": "high", "so_what": "AI may widen the gap in security and service quality between large and small institutions unless delivery models change.", "quote": "the AI wave that is improving productivity, diagnostics, and cyber defense in well-resourced organizations is largely passing these institutions by.", "locator": "I spent the last several years", "quote_verified": true}, {"claim": "Ben Horowitz argues that in parts of America, social infrastructure such as hospitals and municipal services lacks the resources or training to capture AI's benefits and may bear more of its risks.", s in exchange for these benefits is known as the Treasury convenience yield.", "locator": "US Treasury securities offer investors benefits", "quote_verified": true}, {"claim": "The option-adjusted spread of the ICE BofA AAA U.S. Corporate Index, which compares yields on the highest-rated corporate bonds to the Treasury curve after adjusting for embedded options, serves as one proxy for the Treasury convenience yield.", "speaker": "St. Louis Fed — FRED Blog", "type": "framework", "entities": ["ICE BofA AAA U.S. Corporate Index", "FRED", "Treasury convenience yield"], "conviction": "medium", "so_what": "Investors can track the AAA corporate-Treasury OAS as a real-time gauge of Treasury 'specialness'.", "quote": "This measure compares yields on the highest-rated corporate bonds with a Treasury yield curve, adjusting for options embedded in the corporate bonds.", "locator": "The FRED graph shows one proxy", "quote_verified": true}, {"claim": "Since April 2026, FRED has limited the ICE BofA AAA corporate spread series to only the most recent three years of observations, constraining long-run historical analysis on the platform.", "speaker": "St. Louis Fed — FRED Blog", "type": "data_point", "entities": ["FRED", "ICE BofA AAA U.S. Corporate Index"], "conviction": "high", "so_what": "Analysts needing long-history spread data must source it elsewhere or rely on earlier published analyses.", "quote": "Since April 2026, FRED has limited this series to the most recent three years of observations", "locator": "The FRED graph shows one proxy", "quote_verified": true}, {"claim": "Changes in the AAA corporate-Treasury spread cannot be attributed entirely to the Treasury convenience yield because the spread also reflects corporate credit risk and liquidity conditions.", "speaker": "St. Louis Fed — FRED Blog", "type": "causal", "entities": ["Treasury convenience yield", "ICE BofA AAA U.S. Corporate Index"], "conviction": "high", "so_what": "Wider AAA spreads may partly signal rising {"record_id": "9ec6f5efdced1a9d", "source_type": "concepts", "source_name": "Works in Progress", "source_url": "https://worksinprogress.co/issue/everything-rhymes-with-porcelain/", "title": "Everything rhymes with porcelain - Works in Progress Magazine", "published_date": "2026-10-14", "language": "en", "processed_at": "2026-10-16T11:16:07Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "Society"], "gist": "Porcelain is both one of humanity's oldest high technologies and, through engineered ceramics like Cosentino's Dekton, one of its newest. The author argues that materials science is quietly transforming the physical world as profoundly as digital tech and AI, though its incremental innovations make it nearly invisible.", "themes": [{"theme": "Materials science as the overlooked revolution", "insights": [{"claim": "Public attention on digital technology and AI obscures an equally important, ongoing transformation of the physical and built environment driven by materials science.", "speaker": "WorksInProgMag", "type": "contrarian", "entities": ["materials science", "artificial intelligence"], "conviction": "high", "so_what": "Physical-world materials innovation may be under-appreciated relative to AI and digital as a source of progress and value.", "quote": "But that attention sometimes obscures the ongoing, equally important transformation of our physical world, the built environment, by materials science.", "locator": "Paradoxically, porcelain is both one of", "quote_verified": true}, {"claim": "Porcelain is undergoing a technological resurgence analogous to iron's second flowering in the mid-nineteenth century, when Bessemer and Siemens-Martin refining made cheap, high-quality steel possible.", "speaker": "WorksInProgMag", "type": "framework", "entities": ["porcelain", "Bessemer process", "Siemens-Martin process", "steel"], "conviction": "high", "so_what": "Ancient materials can re-emerge as frontier technologies when new processing methods arrive.", "q ) saw larger subsequent operating-markup growth.", "themes": [{"theme": "Post-2019 productivity acceleration", "insights": [{"claim": "U.S. nonfarm-business output per hour grew 1.0% a year from 2010 to 2019 and accelerated to 2.2% a year from 2019 to 2025, ending more than a decade of slow productivity growth.", "speaker": "Jeremy Pearce", "type": "data_point", "entities": ["Bureau of Labor Statistics", "United States"], "conviction": "high", "so_what": "A sustained doubling of trend productivity growth supports higher potential GDP and non-inflationary growth capacity.", "quote": "Nonfarm-business output per hour grew 1.0 percent a year from 2010 to 2019 and 2.2 percent a year from 2019 to 2025.", "locator": "Firm Productivity, 2019–2025", "quote_verified": true}, {"claim": "U.S. productivity growth in the late 1990s ran at about 3% a year, versus about 1% a year in 2010-2019, with the 2010s slowdown especially pronounced in manufacturing.", "speaker": "Jeremy Pearce", "type": "data_point", "entities": ["United States", "manufacturing"], "conviction": "high", "so_what": "Even the post-2019 pickup to ~2% remains below the late-1990s tech-boom pace, framing how much room an AI-era boom could have.", "quote": "Nonfarm-business output per hour grew about 1 percent a year from 2010 to 2019, down from 3 percent in the late 1990s.", "locator": "From the Great Recession until 2019", "quote_verified": true}, {"claim": "Among U.S. public (Compustat) firms outside agriculture, utilities, finance, real estate and public administration, real revenue per worker growth accelerated from 0.7% a year in 2010-2019 to 2.2% a year in 2019-2025, mirroring the aggregate BLS productivity turn.", "speaker": "Jeremy Pearce", "type": "data_point", "entities": ["Compustat", "Bureau of Labor Statistics"], "conviction": "high", "so_what": "Firm-level micro data corroborate the macro productivity acceleration, reducing the odds it is a statistical artifact.", "quote": "Real revenue per worker—sales deflated by industry output prices, divided by employment—traces the same turn, from 0.7 percent to 2.2 percent a year over the same time periods.", "locator": "Nonfarm-business output per hour grew 1.0", "quote_verified": true}, {"claim": "The NY Fed author concludes that the post-2019 U.S. labor productivity uptick is real because it appears consistently across both aggregate BLS data and public-firm Compustat data.", "speaker": "Jeremy Pearce", "type": "thesis", "entities": ["Bureau of Labor Statistics", "Compustat"], "conviction": "high", "so_what": "Investors skeptical of the productivity revival narrative face cross-validated evidence against them.", "quote": "Across all datasets, the labor productivity uptick is real.", "locator": "The chart below illustrates this trend", "quote_verified": true}]}, {"theme": "Who captures the gains: margins vs workers", "insights": [{"claim": "Higher firm revenue per worker can be distributed either to workers via higher wages as firms compete for labor or to firms via higher profit margins, so productivity growth alone does not reveal who benefits.", "speaker": "Jeremy Pearce", "type": "framework", "entities": ["profit margins", "wages"], "conviction": "high", "so_what": "Tracking margins alongside productivity is necessary to judge whether productivity gains feed earnings or labor income.", "quote": "The additional revenue may go to workers, as firms compete for labor through higher wages, or accrue to firms in profit margins.", "locator": "Higher revenue per worker at the firm level", "quote_verified": true}, {"claim": "Through the 2010s U.S. public-firm margins were flat, with gross margins growing about 0.4% a year from 2010 to 2019 and operating margins roughly flat.", "speaker": "Jeremy Pearce", "type": "data_point", "entities": ["Compustat", "gross margin", "operating margin"], "conviction": "high", "so_what": "The 2010s low-productivity era coincided with stagnant margins, making the post-2019 margin expansion a regime change.", "quote": "Through the 2010s margins were flat: gross margins grew about 0.4 percent a year from 2010 to 2019, and operating margins were roughly flat.", "locator": "Firm Profit Margins", "quote_verified": true}, {"claim": "Sales-weighted gross margins of U.S. Compustat firms rose from about 34% of sales in 2019 to 37% in 2025 (1.3% growth per year), and operating margins rose from 16% to 18% (2.4% growth per year).", "speaker": "Jeremy Pearce", "type": "data_point", "entities": ["Compustat", "gross margin", "operating margin"], "conviction": "high", "so_what": "Corporate margins have structurally widened since COVID, supporting elevated earnings and equity valuations if sustained.", "quote": "on average, gross margins went from about 34 percent of sales in 2019 to 37 percent in 2025 (1.3 percent growth per year), and operating margins from 16 percent to 18 percent (2.4 percent growth per year).", "locator": "Firm Profit Margins", "quote_verified": true}, {"claim": "A meaningful part of the post-2019 U.S. productivity gains has gone into wider corporate profit margins rather than to workers, consistent with an ongoing decline in the labor share of output.", "speaker": "Jeremy Pearce", "type": "causal", "entities": ["labor share", "profit margins"], "conviction": "medium", "so_what": "A falling labor share implies productivity gains are boosting capital income more than wages, with distributional and political implications.", "quote": "The increase in profit margins is consistent with ongoing declines in the labor share of output.", "locator": "From the Great Recession until 2019", "quote_verified": true}, {"claim": "Because firms captured part of the productivity gains as margin, the productivity boom is less likely to translate into proportionally faster wage growth for workers.", "speaker": "Jeremy Pearce", "type": "thesis", "entities": ["labor share", "wages"], "conviction": "exploratory", "so_what": "Implied: margin capture may limit wage-driven // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
