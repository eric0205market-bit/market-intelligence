  angle: "This is the layer that turns 'a chatbot with a long context window' into 'a product with actual continuity' -- worth watching which infra vendors (vector DBs, memory-as-a-service startups) capture this layer as agent products scale past demos.",

    '<span class="chartIcon">' + (item.charts.hot ? '🔥' : '📊') + '</span>' : '';
  const chartsClass = 'charts-box' + (item.charts && item.charts.hot ? ' hot' : '');
  const chartsLine = item.charts && item.charts.desc ?
    '<div class="' + chartsClass + '">' + (item.charts.hot ? '🔥 ' : '📊 ') + esc(item.charts.desc) + '</div>' : '';
  return (
    '<div class="card" id="card-' + item.id + '">' +
      '<div class="card-header" onclick="toggleCard(' + item.id + ')">' +
        '<span class="idx">' + String(item.id).padStart(2,'0') + '</span>' +
        '<span class="urg">' + urg.emoji + '</span>' +
        '<span class="badge" style="background:' + color + '">' + esc(item.source) + '</span>' +
        '<span class="catTag">' + esc(item.cat) + '</span>' +
        chartIcon +
        '<span class="title">' + esc(item.title) + '</span>' +
      '</div>' +
      '<div class="card-body" id="body-' + item.id + '"' + (expanded ? '' : ' hidden') + '>' +
        '<div class="label">The Idea</div>' +
        '<div class="idea">' + esc(item.idea) + '</div>' +
        '<div class="label">My Angle</div>' +
        '<div class="angle" style="border-left:2px solid ' + color + '">' + esc(item.angle) + '</div>' +
        '<div class="label">Tweets</div>' +
        '<div class="tweets">' +
          '<div class="tweet-box">' +
            '<div class="tlabel" style="color:#378add">TWEET A</div>' +
            '<div class="ttext">' + esc(item.tweetA) + '</div>' +
            '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button>' +
          '</div>' +
          '<div class="tweet-box">' +
            '<div class="tlabel" style="color:#7f77dd">TWEET B</div>' +
            '<div class="ttext">' + esc(item.tweetB) + '</div>' +
            '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button>' +
          '</div>' +
        '</div>' +
        chartsLine +
        '<div class="linkline"><a href="' + item.link + '" target="_blank">↗ Read full article</a></div>' +
      '</div>' +
    '</div>'
  );
}

function toggleCard(id){
  const body = document.getElementById('body-' + id);
  if (body) body.hidden = !body.hidden;
}

function render(){
  const filtered = ITEMS.filter(function(it){
    const catOk = activeCat === 'all' || it.cat === activeCat;
    const urgOk = activeUrg === 'all' || it.urgency === activeUrg;
    const srcOk = activeSrc === null || it.source.indexOf(activeSrc) !== -1;
    return catOk && urgOk && srcOk;
  });
  const container = document.getElementById('cards');
  container.innerHTML = filtered.map(function(it){
    return buildCard(it, activeSrc !== null);
  }).join('');
}

function updatePillActiveStates(){
  document.querySelectorAll('#catFilters .pill').forEach(function(p){
    const isActive = p.dataset.cat === activeCat;
    p.classList.toggle('active', isActive);
    p.style.background = isActive ? (p.dataset.color || '#333') : 'transparent';
    p.style.color = isActive ? '#fff' : '#444';
  });
  document.querySelectorAll('#urgFilters .pill').forEach(function(p){
    const isActive = p.dataset.urg === activeUrg;
    p.classList.toggle('active', isActive);
    p.style.background = isActive ? (p.dataset.color || '#333') : 'transparent';
    p.style.color = isActive ? '#fff' : '#444';
  });
}

function filterByCat(cat){
  activeCat = cat;
  activeSrc = null;
  updatePillActiveStates();
  render();
}
function filterByUrg(urg){
  activeUrg = urg;
  activeSrc = null;
  updatePillActiveStates();
  render();
}
function filterBySrc(name){
  activeSrc = name;
  activeCat = 'all';
  activeUrg = 'all';
  updatePillActiveStates();
  render();
  const card = document.querySelector('.card');
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function buildPills(){
  const catCounts = {};
  const urgCounts = { act: 0, deep: 0, watch: 0 };
  ITEMS.forEach(function(it){
    catCounts[it.cat] = (catCounts[it.cat] || 0) + 1;
    urgCounts[it.urgency] = (urgCounts[it.urgency] || 0) + 1;
  });

  const catContainer = document.getElementById('catFilters');
  let catHtml = '<button class="pill" data-cat="all" onclick="filterByCat(\'all\')">All <span class="cnt">' + ITEMS.length + '</span></button>';
  Object.keys(CATEGORY_COLORS).forEach(function(cat){
    if (!catCounts[cat]) return;
    catHtml += '<button class="pill" data-cat="' + esc(cat) + '" data-color="' + CATEGORY_COLORS[cat] + '" onclick="filterByCat(\'' + cat.replace(/'/g,"\\'") + '\')">' +
      esc(cat) + ' <span class="cnt">' + catCounts[cat] + '</span></button>';
  });
  catContainer.innerHTML = catHtml;

  const urgContainer = document.getElementById('urgFilters');
  let urgHtml = '<button class="pill" data-urg="all" onclick="filterByUrg(\'all\')">All <span class="cnt">' + ITEMS.length + '</span></button>';
  ['act','deep','watch'].forEach(function(u){
    if (!urgCounts[u]) return;
    const colorMap = { act: '#e24b4a', deep: '#378add', watch: '#ef9f27' };
    urgHtml += '<button class="pill" data-urg="' + u + '" data-color="' + colorMap[u] + '" onclick="filterByUrg(\'' + u + '\')">' +
      URG_META[u].emoji + ' ' + URG_META[u].label + ' <span class="cnt">' + urgCounts[u] + '</span></button>';
  });
  urgContainer.innerHTML = urgHtml;
}

function buildHeader(){
  document.getElementById('headerMeta').textContent =
    META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.emailsRead + ' emails';
}

function buildReport(){
  document.getElementById('rWindow').textContent =
    'Window: ' + META.windowStart + ' to ' + META.windowEnd + '. Emails outside this window were not processed. ' +
    META.emailsInWindow + ' emails in window, ' + META.emailsRead + ' read.';

  const incUl = document.getElementById('rIncluded');
  incUl.innerHTML = META.includedSources.map(function(s){
    return '<li><span class="srcline" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + esc(s.name) + '</span> — ' + s.count + ' item' + (s.count === 1 ? '' : 's') + '</li>';
  }).join('');

  const skUl = document.getElementById('rSkipped');
  if (META.skippedSources.length === 0) {
    skUl.innerHTML = '<li>None — every email in the window with substantive content was processed.</li>';
  } else {
    skUl.innerHTML = META.skippedSources.map(function(s){
      return '<li>' + esc(s.name) + ' — ' + esc(s.reason) + '</li>';
    }).join('');
  }

  document.getElementById('rTotals').textContent =
    META.emailsInWindow + ' emails in window · ' + META.emailsRead + ' read · ' + META.itemsExtracted + ' items extracted across ' + META.includedSources.length + ' sources.';
}

buildHeader();
buildPills();
updatePillActiveStates();
render();
buildReport();
</script>
</body>
</html>
