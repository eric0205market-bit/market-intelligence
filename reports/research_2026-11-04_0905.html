<script>
const ITEMS = [{"id": 1, "cat": "macro", "urgency": "act", "source": "Stephen Innes / The Dark Side of the Boom", "title": "Election night: NDX futures -1.3%, 10y -6bp to 4.91% on blue-wave odds", "idea": "Nasdaq 100 futures fell 1.3%, S&P gave up an early +0.5% to trade -0.7%, the dollar weakened across G10 and the 10y yield fell 6bp to 4.91%. Kalshi priced ~99% Democrats take the House and 95% the Senate. Innes reads the speed of the reversal as exposure being cut, not a considered view on the final scorecard.", "angle": "A 4.91% 10y with equities falling on gridlock is a regime tell: bonds are now treating fiscal restraint as the bullish catalyst, equities as the bearish one. Watch whether duration keeps working if the AI-capex financing story weakens at the same time.", "tweetA": "Divided government, 10y at 4.91%, and stocks sold while bonds rallied. The market just told you which side of the Treasury auction it thinks is the scarce asset. Gridlock is a duration trade before it's an equity trade. $TLT $QQQ", "tweetB": "Prediction markets moved the Nasdaq before a single call was made. 99% House, 95% Senate on Kalshi, NDX -1.3%. If your risk model doesn't have a Polymarket feed in 2026, it's a lagging indicator. $NQ $SPY", "charts": {"count": 1, "hot": false, "desc": "Likely market-reaction charts inside; worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/election-night-hot-take-blue-wave"}, {"id": 2, "cat": "regulation", "urgency": "act", "source": "Stephen Innes / The Dark Side of the Boom", "title": "Texas governor odds flip: Polymarket has Hinojosa ~77%, putting the data-centre pipeline in the political crosshairs", "idea": "Polymarket snapshot had Democrat Gina Hinojosa ~77% vs Abbott ~24% (as supplied; sums over 100). Innes' point: it isn't a ban, it's longer permitting, tougher grid-connection terms and fights over who pays, which compress project returns even without outright restrictions. Texas grid is already strained by proposed data-centre interconnects.", "angle": "Texas is the biggest US AI power queue. A credible delay is enough to reprice developers, IPPs and the neoclouds financed against on-time energisation. The hyperscaler is not first in line when voters see electricity bills.", "tweetA": "Everyone priced chips, financing and power supply. Nobody priced the governor's pen. If Texas slows interconnects by 12 months, what happens to the debt stacks underwritten on a 2027 energisation date? $VST $CEG $CRWV", "tweetB": "You can accelerate a chip order with a bigger cheque. You can't accelerate a permit. Texas just became the AI trade's single biggest non-financial risk, and the market is only now noticing it has a vote. $ERCOT $NVDA", "charts": {"count": 1, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/election-night-hot-take-blue-wave"}, {"id": 3, "cat": "energy", "urgency": "deep", "source": "Stephen Innes / The Dark Side of the Boom", "title": "BofA map: Texas, Georgia, Ohio, Pennsylvania, Oregon governors matter most for utility stocks", "idea": "Bank of America's election map flags five states where gubernatorial outcomes carry the biggest utility-sector consequences: Texas (permitting/grid connection), Georgia (utility decisions), Ohio (regulatory complications), with Pennsylvania and Oregon having firmer frameworks that limit rhetoric-to-policy pass-through.", "angle": "Utilities were the AI-power proxy trade. State-level regulators now set the pace of rate base growth. This is a stock-picking map: long names where frameworks are locked in, cautious where the governor appoints the commission.", "tweetA": "The AI-power trade has a state-by-state map now: TX, GA, OH, PA, OR. Same hyperscaler demand, five different regulators deciding who pays for the wires. Dispersion inside utilities is about to widen. $XLU $SO $AEP", "tweetB": "Electricity bills are the most politically toxic number in America and data centres are the marginal buyer. Whoever controls the PUC controls the AI cost curve. Nobody is modelling that in capex guidance.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/election-night-hot-take-blue-wave"}, {"id": 4, "cat": "tech", "urgency": "act", "source": "Stephen Innes / The Dark Side of the Boom", "title": "AMD beats, guides Q4 above Street; Su signals 80%+ revenue growth next year on MI450; Goldman $700 PT", "idea": "AMD's data-centre-led quarter and Q4 guide came in comfortably above consensus. Lisa Su voiced confidence in >80% revenue growth next year, putting weight on the MI450 rollout. Goldman stays bullish with a $700 target but its own revenue forecast was more ambitious than guidance delivered, so the bank's numbers embed more growth than management has yet underwritten.", "angle": "The gap between Goldman's forecast and the guide is the trade: the stock already discounts execution that management hasn't guided to. 80% growth requires MI450 customer wins plus margin delivery; any slip hits both numerator and multiple.", "tweetA": ">80% growth next year is a statement about one product: MI450. Goldman's $700 target embeds more than management actually guided. Beat-and-raise on a single rack-scale ramp is how you get a 15% air pocket on the first delay. $AMD $NVDA", "tweetB": "Day after day the AI tape trades like a single factor, then AMD prints and the factor splits. Share gain vs Nvidia is now an earnings-model line item, not a narrative. Question is who pays for the second source. $AMD $AVGO", "charts": {"count": 0, "hot": false, "desc": "Charts inside - worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/amd-beats-the-street-but-the-real"}, {"id": 5, "cat": "AI/infra", "urgency": "deep", "source": "Stephen Innes / The Dark Side of the Boom", "title": "BofA primer: AI data centre now ~$49M per MW; ~78 cents of every dollar is IT gear", "idea": "Bank of America puts the average US new-build data centre at about $49M per megawatt, AI facilities higher. Roughly 78% of spend goes to IT equipment, servers the bulk. Server market is dominated by ODM direct, while electrical and cooling is more concentrated and increasingly strategic. Innes frames the next fight as price and whether financing can keep up with compounding unit cost.", "angle": "At $49M/MW a 1GW campus is a $49B cheque, and only ~22 cents is the building. Cost deflation was the bull case for AI economics; this is cost inflation. Concentrated electrical and cooling vendors have better pricing power than ODMs.", "tweetA": "$49M per megawatt, and 78 cents of every dollar is silicon and servers. A gigawatt is a $49B bill with 22 cents of concrete in it. Everyone is betting on the real estate; the real estate is the cheap part. $VRT $ETN $SMCI", "tweetB": "The AI buildout has a unit-cost problem and nobody calls it that. $49M/MW and rising while token prices fall. At some point the depreciation schedule meets the pricing curve. Do that math on a 5-year server life.", "charts": {"count": 1, "hot": false, "desc": "BoA cost-breakdown chart likely inside; worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-data-center-is-becoming-a"}, {"id": 6, "cat": "commodities", "urgency": "deep", "source": "Tavi Costa", "title": "Largest copper miners set for lowest annual output in ~15 years, -16% vs 2024", "idea": "The largest copper miners are expected to report their lowest annual production in almost 15 years, a 16% decline from 2024. Costa argues metals already face supply constraints relative to demand, and the forward supply outlook is worse; recent weakness in mining equities masks the opportunity. Report promises more charts and macro changes.", "angle": "Supply decline into AI/grid/defense electrification demand. Miner equities weak while output falls is the contrarian setup Costa is flagging. Pair with the data-centre cost story: copper is in every MW.", "tweetA": "The biggest copper miners are heading for their lowest output in 15 years, -16% vs 2024, while every data centre is a copper cable with a server attached. Miners are weak. The metal is the constraint. $FCX $COPX $SCCO", "tweetB": "Capex up 100%, copper output down 16%. Something has to give and it won't be the physics. If you want the AI trade without the multiple, own the bottleneck that isn't in the Nasdaq. $HG $FCX", "charts": {"count": 3, "hot": true, "desc": "Costa promises multiple charts in report - CHART WORTH SAVING likely (copper output / miner equities divergence); open it"}, "link": "https://tavicosta.substack.com/p/zig-when-others-zag"}, {"id": 7, "cat": "macro", "urgency": "act", "source": "John Authers / Bloomberg Points of Return", "title": "Blue wave: Korean chipmakers and Bitcoin sell off, gold bid; deregulation, not regulation, is the repricing", "idea": "Authers: a Democratic Congress likely doesn't mean more regulation but could hamper further deregulation. That explains startling selloffs in Samsung and SK Hynix (AI-regulation fears) and Bitcoin (Republicans had just failed to roll back regulation), while gold flourishes. Dollar-dominance column in same issue frames the gold/Bitcoin slump as reinforcing the dollar. He says this may produce buying opportunities but not yet.", "angle": "Fresh read: the trade isn't 'blue = bad'; it's 'deregulation optionality removed.' Stocks priced with a policy put (SK Hynix, BTC, crypto-adjacent) gave it back first. Gold bid while BTC sells hurts the digital-gold narrative.", "tweetA": "Samsung, SK Hynix, Bitcoin down; gold up. The common factor isn't 'blue wave', it's a deregulation put getting repriced. Gold is acting like gold and Bitcoin is acting like a regulatory-beta asset. That's a bad day for one thesis. $BTC $GLD $000660.KS", "tweetB": "Korean memory sold on US election night. That's the tell: AI-regulation risk is now a global factor, and the cleanest expression of it is the supply chain that's sold out through 2029. $SKHY $SMSN", "charts": {"count": 4, "hot": true, "desc": "Authers has ~4 charts (NDX futures, Brazil, Apple, AI gauge); NDX futures reaction - CHART WORTH SAVING"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-11-04/midterms-the-size-of-the-wave-confronts-markets"}, {"id": 8, "cat": "macro", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "Democrats +6 Senate seats was a fringe bet; California billionaire tax makes 2028 the real repricing", "idea": "Few took seriously the idea Democrats could gain six Senate seats, judging by Polymarket's contract on Republicans winning 47 seats or fewer. Authers: immediate financial effects of a sweep aren't large, but if the Californian billionaire-tax proposition passes, a radically redistributionist Democrat in 2028 looks far more plausible. Pricing 2028 risks nobody took seriously could be the big deal.", "angle": "This is a long-duration political risk premium arriving early: wealth taxes, buyback/dividend policy, carried interest, top-heavy index concentration. The Mag-7 shareholder base is the exposed one.", "tweetA": "The midterm is a 2-year story. The 2028 story is a billionaire tax that started in California and a Polymarket tail that suddenly isn't a tail. Equity risk premium models have no input for that. $SPY $META", "tweetB": "Six Senate seats was a joke contract two weeks ago. If the market was that wrong about November, what else in the 2028 tail is mispriced? Start with the wealth-tax contagion from California.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-11-04/midterms-the-size-of-the-wave-confronts-markets"}, {"id": 9, "cat": "macro", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "Brazil after Lula: inflation expectations surge while default risk stays low; Selic 80% likely hold at 15% area", "idea": "Lula's fourth term triggered a 'Black Monday' reaction; Authers argues Brazil can avoid default by printing money to local investors, hence inflation expectations surge while default risk stays low. IMF sees gross debt topping 100% of GDP by end of term. Selic hold is ~80% priced. Real fell further on reports Lula might meet economist Andre Lara Resende, whose paper 'J'Accuse' argues rates should be cut to nominal growth. Investors expect to 'turn vigilante'.", "angle": "The Erdogan comparison is the bear case: 6 of 9 central bank board seats open by end of next year. Local investors are the marginal sellers, foreigners are active in EWZ but not buying. The risk is a policy-credibility trade, not a default trade.", "tweetA": "Brazil can't default on local debt because it can print. That's why the real is the shock absorber and inflation expectations are the price. Local funds are selling equities, foreigners are trading, nobody is buying. $EWZ $BRL", "tweetB": "Six of nine central bank board seats open by end of next year, a 'Real Plan architect' arguing rates should equal nominal growth, and a debt-to-GDP heading above 100%. That's not a bargain, that's a regime-change option on the Selic. $EWZ", "charts": {"count": 4, "hot": true, "desc": "Brazil inflation expectations vs Mexico chart - CHART WORTH SAVING; also Bovespa USD and debt/GDP charts"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-11-04/midterms-the-size-of-the-wave-confronts-markets"}, {"id": 10, "cat": "geopolitics", "urgency": "watch", "source": "John Authers / Bloomberg Points of Return", "title": "Postcard from São Paulo: BYD doubles Brazil share, 'nobody has heard of Tesla'", "idea": "From São Paulo, Authers notes the hushed streets are full of Chinese electric cars and buses; BYD has doubled market share in Brazil with a new plant eyed. Tesla is essentially invisible. A throwaway scene with a hard data point: the largest LatAm market is being electrified by Chinese suppliers.", "angle": "US-China trade war is a US-only story; the rest of the world is a BYD/CATL/Huawei story. Supply chain and commodity implications: lithium, copper, ports. Brazil politics now pushes that closer to Beijing.", "tweetA": "Brazil's streets are filling up with BYDs and nobody there has heard of Tesla. While the US debates tariffs, the 200M-person market next door is being electrified by China. Second-order: Lula plus BYD plant is a Beijing alignment trade. $BYDDY $TSLA", "tweetB": "The tariff wall protects the US auto market. Everywhere else, BYD doubled share. Which is the bigger TAM, and who is positioned for it? $1211.HK", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-11-04/midterms-the-size-of-the-wave-confronts-markets"}, {"id": 11, "cat": "AI/infra", "urgency": "deep", "source": "John Authers / Bloomberg Points of Return", "title": "Apple's light capex and $145B operating cash flow vs AI-return anxiety hitting Intel and the Mag-7", "idea": "Authers: tech hit an air pocket on earnings. Apple beat everything but guided slower growth and gross margin below 47%; shares fell as much as 4% after hours. Bloomberg Intelligence notes $145B annual operating cash flow and debt falling to ~$80B, so Apple can absorb higher AI costs without external funding. Intel plunged on a revenue-forecast miss; a gauge of 55 gen-AI stocks rose 1.84% Tuesday. Falls are a valuation correction, but if capacity fails to generate cash flow it could become funding pressure.", "angle": "The market is now explicitly treating 'AI capex doesn't earn its cost' as a non-zero scenario. Apple's balance sheet is the control group.", "tweetA": "Investors have stopped giving AI capex the benefit of the doubt. Apple gets docked 4% for a margin guide and it has $145B of operating cash flow and no data centres. Imagine the reaction when a levered name misses. $AAPL $INTC", "tweetB": "A basket of 55 gen-AI names +1.84% on the day the Nasdaq futures were -1.3%. That's not a rotation, that's a bounce in a downtrend. Watch whether it holds when financing stories land. $QQQ", "charts": {"count": 2, "hot": false, "desc": "Apple reaction & AI gauge charts inside"}, "link": "https://www.bloomberg.com/opinion/newsletters/2026-11-04/midterms-the-size-of-the-wave-confronts-markets"}, {"id": 12, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI: Reset to Zero", "title": "Apple: R&D +32% to $45.8B, capex -29% to $9.0B while rivals raise equity to build", "idea": "Apple's AI bill runs through R&D not data centres: R&D +32% to $45.8B, capex -29% to $9.0B; September-quarter capex $2.24B vs $3.33B expected. Meanwhile Meta is raising up to $98B of equity, Alphabet up to $85B and Oracle $20B; Alphabet lost ~half a trillion of market value last week over AI spend eating free cash flow. Apple generated $145B operating cash flow (+30%), returned $102B, and runs Siri AI on Google Gemini with Nvidia in the cloud.", "angle": "Cleanest capex-vs-rent contrast of the cycle. Apple outsourced the capital intensity and kept the customer. The market's willingness to fund Meta/Alphabet equity raises is the thing to watch.", "tweetA": "Meta raising $98B of equity. Alphabet $85B. Oracle $20B. Apple: capex DOWN 29%, $145B operating cash flow, $102B returned. One of these companies is financing its AI strategy with shareholders. $AAPL $META $GOOGL", "tweetB": "The best AI strategy of 2026 might be renting Gemini and spending on R&D. Alphabet lost half a trillion for building what Apple licenses. Who captured the value? $AAPL $GOOGL", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-apples-record-quarter-as-the-ternus"}, {"id": 13, "cat": "AI/infra", "urgency": "act", "source": "Michael Parekh / AI: Reset to Zero", "title": "RAMageddon hits Apple: $33B new purchase obligations, inventory $5.7B to $14.5B, GM guided 45-46%", "idea": "Apple's COO said purchase obligations rose $33B from June to lock memory supply; inventories jumped to $14.5B from $5.7B. Gross margin guide 45-46% vs 47.9% and 46.3% expected. Ternus called memory pricing 'unprecedented', expects higher costs in December and beyond with less inventory cushion; SK Hynix is sold out through 2029; Apple raised prices 15-25% this summer. Stratechery: the tables have turned, Apple must now forecast demand and carry the inventory.", "angle": "Apple was the one buyer that dictated terms to suppliers. If it must commit $33B to get memory, everyone else is behind it in line. Memory makers hold pricing power for the duration of the AI buildout.", "tweetA": "Apple just committed an extra $33B to buy memory. The company that spent a decade squeezing suppliers is now signing take-or-pay to get chips. If Cupertino is in the queue, who is not getting allocated? $MU $000660.KS $AAPL", "tweetB": "Inventory $5.7B to $14.5B in a year. That's not a supply chain, that's a hedge. Memory is the new oil: you stockpile it before the price goes up and you pass the cost on to the consumer. Watch the 15-25% price rise elasticity. $AAPL $MU", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-apples-record-quarter-as-the-ternus"}, {"id": 14, "cat": "tech", "urgency": "deep", "source": "Michael Parekh / AI: Reset to Zero", "title": "Apple China +21% to $17.5B still missed by >$1B; Services slowest growth since 2022; 36x forward P/E on ~1% EPS growth", "idea": "Greater China grew 21% to $17.5B but analysts wanted ~$18.75B. Services +10% was the slowest since 2022 (FX headwind ~4 pts, App Store gaming, court ruling on link-outs). iPad -10%, wearables -8%. WSJ notes Apple trades at 36x next year's earnings expected to grow about 1% (per Oppenheimer). December guide revenue +7-10% above the 6.1% expected.", "angle": "The multiple is paying for pricing power rather than volume. The bear case: price hikes narrow the Services funnel while memory eats margin. The bull case: demand still beats Apple's own forecast.", "tweetA": "Apple grew China 21% and it counted as a miss. 36x earnings that grow 1%. At that multiple the stock isn't priced for a good quarter, it's priced for no quarters. $AAPL", "tweetB": "Revenue guide above Street, margin guide below Street. Apple is telling you it will sell more and keep less. In a memory shortage that's the best case, and the stock still fell 4%. $AAPL", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-apples-record-quarter-as-the-ternus"}, {"id": 15, "cat": "AI/infra", "urgency": "deep", "source": "Michael Parekh / AI: Reset to Zero", "title": "Siri AI inference lands in Services COGS; 2.5B Siri requests/day; Gap runs AI on Mac minis with no token costs", "idea": "Siri AI queries run on-device at almost no cost or in Private Cloud Compute, where inference lands in Services cost of sales. Apple defers part of device revenue to cover the bundled service. Siri handles 2.5B requests/day. Ternus pitched Mac mini/Studio for private local AI; Gap runs AI on Mac minis across hundreds of stores with no cloud token costs. Monetisation: hardware upgrade reason first, then iCloud+ usage tiers.", "angle": "Local inference is the structural bear case for token-metered cloud revenue. Gap's example is a customer story with a zero-token-cost line item.", "tweetA": "Gap runs AI on Mac minis in hundreds of stores. Zero token cost. If that pattern spreads, the bull case for per-token cloud revenue has an on-prem substitute from a company with 2nm silicon. $AAPL $NVDA", "tweetB": "2.5B Siri requests a day, and Apple says it doesn't yet know the cost mix. The first AI product at planetary scale with inference in COGS. Margin is the experiment. $AAPL", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-apples-record-quarter-as-the-ternus"}, {"id": 16, "cat": "venture", "urgency": "watch", "source": "Michael Parekh / AI: Reset to Zero", "title": "Anthropic commits to $895B in spending as mega-IPO nears (Bloomberg headline cited)", "idea": "Cited in the sources: Bloomberg, Nov 2: 'Anthropic Commits to $895 Billion in Spending as Mega-IPO Nears', in the context of the hyperscaler equity raises (Meta $98B, Alphabet $85B, Oracle $20B). Only the headline is in this email; details are in Bloomberg.", "angle": "If real, an $895B commitment pre-IPO changes what public-market investors are underwriting. Compute commitments are effectively off-balance-sheet leverage.", "tweetA": "$895B of commitments before the IPO. Meta, Alphabet, Oracle all raising equity. The AI complex is front-running a public-market funding window. Who's the marginal buyer? $ORCL $GOOGL", "tweetB": "If Anthropic's $895B is mostly compute contracts, those are someone else's revenue backlog. Count the circularity: who is on both sides of that cheque? $NVDA $AMZN", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://michaelparekh.substack.com/p/ai-apples-record-quarter-as-the-ternus"}, {"id": 17, "cat": "AI/infra", "urgency": "deep", "source": "McKinsey / Only McKinsey Perspectives (citing WSJ)", "title": "Only 11% of ~400 organisations forecast AI spend accurately; cheaper models cost more ~1/3 of the time", "idea": "WSJ: only 11% of nearly 400 organisations surveyed accurately forecast AI spending. In a study of 6,800+ tasks, lower-priced models cost more than pricier ones nearly a third of the time, using more steps and tokens; even the same model gave different bills on identical tasks. McKinsey: spend nearly quadruples moving from pilot to production. Advice: 'cost per task, not per token'.", "angle": "Per-token price deflation is the AI bull narrative; per-task cost variance is the enterprise reality. Token-heavy agentic workflows raise the revenue per user for model vendors.", "tweetA": "6,800 tasks. In nearly a third the 'cheap' model cost more than the expensive one. Per-token price is a marketing number. Per-task cost is the P&L. The AI cost curve is less deflationary than the headline. $MSFT $ORCL", "tweetB": "Enterprise AI spend goes 4x from pilot to production, and 89% of firms can't forecast it. That's a revenue-recognition tailwind for the vendors and a budget-surprise risk for the CFOs. Watch Q1 IT budget cuts.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.mckinsey.com/featured-insights/mckinsey-explainers/what-does-ai-really-cost"}, {"id": 18, "cat": "positioning", "urgency": "deep", "source": "Trading Mindset & Data (TMAD)", "title": "S&P higher 12 months after every midterm since 1950 (19 for 19), avg +18.8%; but R president + D Congress is the weakest combo at ~6.7%", "idea": "S&P 500 has been higher 12 months post-midterm 19 of 19 times since 1950 (avg total return +18.8%). Midterm years: average Jan 1 to Election Day drop -16.2%; from the midterm low, +36.5% a year later. Year 3 average +17.2% vs 4.6% in midterm years. Divided government: +15% vs +11.5% for single-party (1980-2024). But LPL: Republican president with Democratic Congress averaged only ~6.7%, dragged by 2001-02 and 2008 bear markets; small sample.", "angle": "Seasonality tailwind collides with a worse-than-average political mix and a stock market already in an AI-capex repricing. 19-for-19 is the stat to quote; 6.7% is the stat to hedge with.", "tweetA": "19 for 19: S&P up 12 months after every midterm since 1950, +18.8% on average. And the one combination with the worst record is exactly the one we just got. History is giving you a bullish stat and a bearish stat in the same email. $SPY", "tweetB": "Midterm low to one year later: +36.5% on average. The catch is you never know the low until after. Election night NDX -1.3% is either the low or the first leg. Size accordingly. $QQQ", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.tmad.news/p/tmad-update-a-divided-washington"}, {"id": 19, "cat": "energy", "urgency": "deep", "source": "Trading Mindset & Data (TMAD)", "title": "September CPI 3.7% y/y with gasoline over half the monthly rise; EIA sees Brent $105 in Q4, $84 in 2027", "idea": "September CPI rose 3.7% y/y, gasoline accounting for more than half of the monthly headline increase. The Iran conflict doesn't end with Congressional control. EIA's October outlook projects Brent at $105 in Q4 and $84 in 2027, contingent on supply recovery (not a spot quote). Sustained disruption keeps inflation pressure high; real improvement helps consumers, airlines and rate-sensitive sectors.", "angle": "An EIA path from $105 to $84 is a 20% fall in a year that needs supply to recover. That's an assumption, not a forecast. Inflation at 3.7% with 10y 4.91% and no Fed relief is the real macro constraint.", "tweetA": "CPI 3.7%, over half the monthly rise from gasoline, 10y at 4.91%. The EIA assumes Brent falls from $105 to $84 by 2027. If that supply doesn't come back, nothing in the divided-government story matters for rates. $CL $XLE", "tweetB": "A $20 drop in Brent forecast is an EIA hope with a 'conditional on supply recovery' footnote. Airlines and rate-sensitive sectors are the cleanest expression of whether you believe it. $JETS $USO", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.tmad.news/p/tmad-update-a-divided-washington"}, {"id": 20, "cat": "crypto", "urgency": "watch", "source": "Checkonchain (James / Alec)", "title": "October Q&A: Q4 liquidity-crash risk, 'boring' Bitcoin, how much capital BTC needs, DCA selling", "idea": "Premium Q&A video, topics only in the email: risk of a Q4 liquidity crash; why Bitcoin feels boring and why that may be good; how much capital BTC needs to move higher; identifying tops as on-chain thresholds evolve; bull-market dips vs another bear leg; DCA selling strategies; quantum, AI and Bitcoin security; recovery in Bitcoin mining. No data in the email body.", "angle": "Timely because BTC sold off with Korean chips on election night. Checkonchain's 'capital needed' framing is a useful lens for the Q4 liquidity question. Worth opening the video.", "tweetA": "Bitcoin sold off on the same night Samsung and SK Hynix did. Two 'regulation optionality' assets in one tape. The Q4 liquidity question isn't just on-chain anymore. $BTC", "tweetB": "'Boring' is the Bitcoin bull case nobody wants. Vol compression plus a macro shock plus a sweeping election: boring doesn't last. $BTC $IBIT", "charts": {"count": 0, "hot": false, "desc": "Charts inside video/post - worth opening"}, "link": "https://newsletter.checkonchain.com/p/october-q-and-a-q4-crash-risk-btc"}, {"id": 21, "cat": "culture", "urgency": "watch", "source": "McKinsey / Only McKinsey Perspectives", "title": "AI in professional cycling and cricket: talent scouting, development tracking, opposition prep", "idea": "Guardian: AI is changing how cricket teams assess talent, track development and prepare for opponents, supporting not replacing coaches. McKinsey/QuantumBlack are working with a professional cycling team using AI to flag developments and improve tactical decisions. Also: HBR on transformations failing when leaders cling to rigid plans; McKinsey's six strategy roles CEOs must not delegate.", "angle": "Sports analytics is where AI-augmented decision-making is easiest to measure; adoption curve and labour-market effects for coaches/scouts. Low-signal, but a cultural marker.", "tweetA": "Cricket and pro cycling are using AI to scout and plan. Not replacing coaches. The same pattern shows up in every field: the human gets more data, the junior analyst job is what vanishes.", "tweetB": "Sports teams have clean outcome data and rapid feedback loops. That makes them the best natural experiment for 'AI-augmented decisions'. If it doesn't beat the coach there, it won't in the boardroom.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.mckinsey.com/Capabilities/Tech-and-AI/How-We-Help-Clients/Turning-data-into-decisions-Lessons-from-professional-cycling"}];
const META = {"date": "2026-11-04", "time": "09:05 CEST", "windowStart": "2026-11-04 03:05 CEST", "windowEnd": "2026-11-04 09:05 CEST", "emailsInWindow": 10, "emailsRead": 9, "itemsExtracted": 21, "includedSources": [{"name": "Stephen Innes / The Dark Side of the Boom", "items": 5}, {"name": "John Authers / Bloomberg Points of Return", "items": 5}, {"name": "Michael Parekh / AI: Reset to Zero", "items": 5}, {"name": "Tavi Costa", "items": 1}, {"name": "McKinsey / Only McKinsey Perspectives", "items": 2}, {"name": "Trading Mindset & Data (TMAD)", "items": 2}, {"name": "Checkonchain (James / Alec)", "items": 1}], "skippedSources": [{"name": "PEquity Research", "reason": "Pure promo: 20% off discount, 3 hours left"}]};
var COL={macro:"#e24b4a",credit:"#378add",positioning:"#ef9f27","AI/infra":"#1d9e75",crypto:"#7f77dd",geopolitics:"#d85a30",energy:"#f97316",tech:"#06b6d4",gold:"#d4a017",culture:"#ec4899",labor:"#8b5cf6",regulation:"#64748b",science:"#14b8a6",venture:"#84cc16",commodities:"#a16207"};
var UE={act:"🔴",deep:"🔵",watch:"🟡"};
var fc="All",fu="All",fs=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function toggle(id){var e=document.getElementById('c'+id);e.classList.toggle('open');}
function setCat(c){fc=c;fs=null;collapse();render();}
function setUrg(u){fu=u;fs=null;collapse();render();}
function filterBySrc(n){fs=n;fc="All";fu="All";render();document.querySelectorAll('.card').forEach(function(c){if(c.style.display!=='none')c.classList.add('open');});}
function collapse(){document.querySelectorAll('.card').forEach(function(c){c.classList.remove('open');});}
function pill(label,active,color,fn){return '<span class="pill" style="'+(active?'background:'+color+';border-color:'+color+';color:#fff':'')+'" onclick="'+fn+'">'+label+'</span>';}
function render(){
  var cats=[];ITEMS.forEach(function(i){if(cats.indexOf(i.cat)<0)cats.push(i.cat);});
  var h=pill("All ("+ITEMS.length+")",fc==="All","#333","setCat('All')");
  cats.forEach(function(c){var n=ITEMS.filter(function(i){return i.cat===c;}).length;h+=pill(c+" "+n,fc===c,COL[c]||"#555","setCat('"+c+"')");});
  document.getElementById('catbar').innerHTML=h;
  var u="";[["All","All"],["act","🔴 Act Now"],["deep","🔵 Deep"],["watch","🟡 Watch"]].forEach(function(p){var n=p[0]==="All"?ITEMS.length:ITEMS.filter(function(i){return i.urgency===p[0];}).length;u+=pill(p[1]+" ("+n+")",fu===p[0],"#333","setUrg('"+p[0]+"')");});
  document.getElementById('urgbar').innerHTML=u;
  var out="";
  ITEMS.forEach(function(item){
    var show=(fc==="All"||item.cat===fc)&&(fu==="All"||item.urgency===fu)&&(!fs||item.source.indexOf(fs)>=0);
    var col=COL[item.cat]||"#555";
    var ch=item.charts.count>0?(item.charts.hot?"🔥":"📊"):"";
    out+='<div class="card" id="c'+item.id+'" style="display:'+(show?'block':'none')+'">'+
    '<div class="hd" onclick="toggle('+item.id+')"><span class="num">'+item.id+'</span><span>'+UE[item.urgency]+'</span><span class="src" style="background:'+col+'">'+esc(item.source)+'</span><span class="tag">'+esc(item.cat)+'</span><span>'+ch+'</span><span class="ttl">'+esc(item.title)+'</span></div>'+
    '<div class="bd"><div class="lbl">The Idea</div><div>'+esc(item.idea)+'</div>'+
    '<div class="lbl">My Angle</div><div class="angle" style="border-left-color:'+col+';background:'+col+'14">'+esc(item.angle)+'</div>'+
    '<div class="tw"><div><div class="lbl" style="color:#378add">Tweet A</div>'+esc(item.tweetA)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>'+
    '<div><div class="lbl" style="color:#7f77dd">Tweet B</div>'+esc(item.tweetB)+'<br><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div></div>'+
    '<div class="chart'+(item.charts.hot?' hot':'')+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING — ':'')+(item.charts.count>0?item.charts.count+' chart(s). ':'')+esc(item.charts.desc||'No charts noted')+'</div>'+
    '<div style="margin-top:8px"><a href="'+esc(item.link)+'" target="_blank">↗ Read full article</a></div></div></div>';
  });
  document.getElementById('cards').innerHTML=out;
}
function init(){
  document.getElementById('sub').textContent=META.date+" · "+META.time+" · "+ITEMS.length+" items";
  var r='<div><b>Window:</b> '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</div><div>Emails in window: '+META.emailsInWindow+' · read: '+META.emailsRead+' · items: '+META.itemsExtracted+'</div><div class="lbl">Included sources (click to filter)</div>';
  META.includedSources.forEach(function(s){r+='<div><span class="src2" data-n="'+esc(s.name)+'" onclick="filterBySrc(this.getAttribute(\'data-n\'))">'+esc(s.name)+'</span> — '+s.items+'</div>';});
  r+='<div class="lbl">Skipped</div>';
  META.skippedSources.forEach(function(s){r+='<div>'+esc(s.name)+' — '+esc(s.reason)+'</div>';});
  document.getElementById('repbody').innerHTML=r;
  render();
}
init();
</script></body></html>
