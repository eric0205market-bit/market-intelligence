<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twitter Data Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e4df;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #2563eb;
  --accent-bg: #f0f5ff;
  --accent-2: #1d4ed8;
  --tag-text: #0e7490;
  --tag-bg: #e8f4f8;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS (top-level collapsible) */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: var(--accent-bg); cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; color: var(--accent-2); }
.section-head:hover { background: #e1ecff; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* TOPIC (nested collapsible inside Topics section) */
.topic { border-bottom: 1px solid var(--border-light); }
.topic:last-child { border-bottom: none; }
.topic-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
              background: var(--accent-bg); cursor: pointer; user-select: none;
              font-size: 13px; font-weight: 600; color: var(--accent-2); }
.topic-head:hover { background: #e1ecff; }
.topic-name { flex: 1; }
.topic-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.topic-arrow { font-size: 10px; transition: transform .2s; }
.topic.open .topic-arrow { transform: rotate(90deg); }
.topic-body { display: none; padding: 4px 0 6px; }
.topic.open .topic-body { display: block; }

/* ITEM CARDS */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DATA POINT TAGS */
.data-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dp-tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          background: var(--tag-bg); color: var(--tag-text);
          padding: 2px 7px; border-radius: 4px; }

/* CHARTS (large, NOT thumbnails) */
.charts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chart { width: 100%; max-width: 420px; height: auto;
         border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in;
         background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
  .chart { max-width: 100%; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type":"TWITTER DATA INTELLIGENCE","collected_at":"2026-10-04T05:21:02Z","date":"2026-10-04 05:21 UTC","input_stats":{"total_tweets":53,"unique_authors":15,"tweets_with_images":25,"after_filter":44},"summary":"44 items across 11 topics from all 15 monitored accounts. Key numbers: NFP +29k vs 84k expected, US+China M2 at record $76.4T (+$7.9T YoY), retail TLT inflows $170M in 3 days (TLT -55% from 2020 peak), data center construction +73% YoY to $85B annualized. Major themes: labor market slowing sharply post-NFP miss, global 10Y yields surging (US/UK near 5.2%), S&P breadth extremely narrow (AI tech +5% vs equal-weight -5%), consumer running on debt (real wages negative since March), and EV sector repricing from growth to grind.","topics":[{"topic":"Economic Indicators & Labor Market","items":[{"author":"kurtsaltrichter","description":"September NFP: 29k jobs vs 84k expected. Wage growth slowed to 3.0% YoY (down from >4%). July revised into negative. Healthcare accounted for 17k of the 29k total. Labor market downshifting, not overheating — front end of yield curve moves first.","tweet_url":"https://x.com/kurtsaltrichter/status/2106553649677644063","images":["https://pbs.twimg.com/media/HTv7YYZWYAAbgdk.jpg"],"data_points":["NFP +29k (exp. +84k)","Wage growth 3.0% YoY","Healthcare +17k jobs","July revised negative"],"created_at":"2026-10-04T01:15:02.000Z"},{"author":"C_Barraud","description":"Bloomberg charting: US employment growth moderates. 4 charts covering global economic overview — US employers dialing back hiring, wage growth slowing.","tweet_url":"https://x.com/C_Barraud/status/2106419922985218185","images":["https://pbs.twimg.com/media/HTuBSkJXwAAMqXW.png","https://pbs.twimg.com/media/HTuBVhKXAAA37Sn.png","https://pbs.twimg.com/media/HTuBZ7AWMAAXz18.png","https://pbs.twimg.com/media/HTuBu1DXsAAYd4m.png"],"data_points":["US hiring deceleration (4 charts)","Wage growth slowdown global"],"created_at":"2026-10-03T16:23:39.000Z"},{"author":"WarrenPies","description":"AI visibly impacting labor market. Since mid-2025: Finance+Tech -246k jobs, all other industries +812k. White-collar private sector most at risk; physical labor and govt-adjacent are safe harbors until robotics matures.","tweet_url":"https://x.com/WarrenPies/status/2106536463760515484","images":["https://pbs.twimg.com/media/HTuCs3DWMAAbO-n.jpg"],"data_points":["Finance+Tech -246k jobs since mid-2025","All other industries +812k"],"created_at":"2026-10-03T16:33:00.000Z"},{"author":"zerohedge","description":"11 million US workers may need to switch careers by 2035, per new research on automation and AI displacement.","tweet_url":"https://x.com/zerohedge/status/2106576316367597892","images":[],"data_points":["11M workers career transition needed by 2035"],"created_at":"2026-10-04T02:45:06.000Z"},{"author":"kurtsaltrichter","description":"US consumer running on borrowed money. Real hourly earnings negative since March (prices outpacing wages). HELOC balances back to ~$440B. Record 30% of car loans now >6 years (up from 13% a decade ago). Late-cycle behavior.","tweet_url":"https://x.com/kurtsaltrichter/status/2106449460142190928","images":["https://pbs.twimg.com/media/HTucnv8WYAA5FaH.jpg","https://pbs.twimg.com/media/HTucnufWsAAaX32.jpg","https://pbs.twimg.com/media/HTucnxJXUAArNuo.jpg"],"data_points":["Real wages negative since March","HELOC ~$440B","30% car loans >6yr (vs 13% decade ago)"],"created_at":"2026-10-03T18:21:01.000Z"}]},{"topic":"Rates, Bonds & Fixed Income","items":[{"author":"KobeissiLetter","description":"Retail rushing into TLT. Wednesday: +$61M (largest daily in 12 months). 3-day total: +$170M (largest since Sep 2025). 6 consecutive sessions >$20M. Meanwhile TLT -1.9% this week, -8.0% YTD, -55.0% from 2020 peak.","tweet_url":"https://x.com/KobeissiLetter/status/2106524135547355592","images":["https://pbs.twimg.com/media/HTtYoQ5X0AAJx3L.jpg"],"data_points":["TLT retail +$61M Wednesday","$170M 3-day total","TLT -8.0% YTD","TLT -55% from 2020 peak"],"created_at":"2026-10-03T23:17:45.000Z"},{"author":"kurtsaltrichter","description":"Global bond selloff. US and UK 10Y near 5.2%, France ~5%, Japan grinding higher. SF Fed data shows term premium rising beyond what short-rate moves explain — this is a debt story, not inflation. Debt to GDP: US 122%, France 113%, Italy 149%, Japan ~200%.","tweet_url":"https://x.com/kurtsaltrichter/status/2106493259560194476","images":["https://pbs.twimg.com/media/HTvEdPrXIAAr_8C.jpg"],"data_points":["US/UK 10Y ~5.2%","France 10Y ~5%","US debt 122% GDP","France 113%","Italy 149%","Japan ~200%"],"created_at":"2026-10-03T21:15:04.000Z"},{"author":"KobeissiLetter","description":"Borrowing costs surging despite US Treasury intervention attempts. 60 consecutive months of 2%+ inflation + record deficit spending. Bond market no longer ignoring reality. Asset owners are the only winners.","tweet_url":"https://x.com/KobeissiLetter/status/2106429572686164000","images":["https://pbs.twimg.com/media/HTtxOVXWUAAueGC.jpg"],"data_points":["60 consecutive months 2%+ inflation","Treasury intervention failing"],"created_at":"2026-10-03T17:02:00.000Z"},{"author":"kurtsaltrichter","description":"Oracle and Paramount CDS spiking in near lockstep toward 2-year highs. Ellison link: Oracle ~$130B debt (AI data centers), Paramount ~$52B (Warner Bros). One fortune behind two debt binges = correlated credit risk you can't diversify.","tweet_url":"https://x.com/kurtsaltrichter/status/2106475633786146854","images":["https://pbs.twimg.com/media/HTu0bRTWcAAelrz.jpg"],"data_points":["Oracle debt ~$130B","Paramount debt ~$52B","Both CDS near 2yr highs","$ORCL $PSKY correlated"],"created_at":"2026-10-03T20:05:02.000Z"},{"author":"C_Barraud","description":"Week ahead for FX/Bonds: Fed Minutes in focus as near-term rate hike prospects dim (WSJ).","tweet_url":"https://x.com/C_Barraud/status/2106420742078513451","images":[],"data_points":["Fed Minutes upcoming","Near-term rate hike probability falling"],"created_at":"2026-10-03T16:26:54.000Z"}]},{"topic":"Equities & Market Breadth","items":[{"author":"kurtsaltrichter","description":"S&P 500 calm hiding narrow leadership. Tech +5%, equal-weight S&P -5%. CCC and lower junk spreads at ~12% over Treasuries — widest in some time. S&P is essentially AI-only; no broad market cushion underneath.","tweet_url":"https://x.com/kurtsaltrichter/status/2106421020982657206","images":["https://pbs.twimg.com/media/HTuCwZ8XMAA9gu2.jpg","https://pbs.twimg.com/media/HTuCwZbXkAEPdgA.jpg"],"data_points":["Tech sector +5%","Equal-weight S&P -5%","CCC junk spreads ~12% over Treasuries","$RSP underperforming"],"created_at":"2026-10-03T16:28:01.000Z"},{"author":"bespokeinvest","description":"Consumer sector breadth collapsed. Both Consumer Staples and Consumer Discretionary had healthy majority above 50-DMAs a month ago. Now reversed — mega-caps kept the headline index afloat while consumer stocks got gutted.","tweet_url":"https://x.com/bespokeinvest/status/2106449460142190928","images":["https://pbs.twimg.com/media/HTuwTKtWsAAEbz7.jpg"],"data_points":["Consumer sector breadth reversal","Sub-50DMA majority in consumer names"],"created_at":"2026-10-03T19:47:00.000Z"},{"author":"charliebilello","description":"Chart of the worst performing stocks in the S&P 500 year-to-date.","tweet_url":"https://x.com/charliebilello/status/2106449460142190928","images":["https://pbs.twimg.com/media/HTusJgIWIAAJuO4.png"],"data_points":["Worst S&P 500 performers YTD (chart)"],"created_at":"2026-10-03T19:28:00.000Z"},{"author":"MichaelKantro","description":"R1k Tech sector-neutral long portfolio outperformed equal-weighted Tech by ~35% YTD. Key factors: Value (P/E), fundamental momentum (EPS revisions + surprise), and profitability (ROE). 18 stocks in basket. These factors captured large share of AI outperformers — no stories, just numbers.","tweet_url":"https://x.com/MichaelKantro/status/2106506083548209409","images":["https://pbs.twimg.com/media/HTvdgjlWIAExcGc.jpg"],"data_points":["R1k Tech +35% vs EW Tech YTD","18 stocks in basket","Key factors: P/E, EPS revisions, ROE"],"created_at":"2026-10-03T23:09:00.000Z"},{"author":"RyanDetrick","description":"Firm remains bullish — has been for years. Characterizes current environment as a secular bull market with years of runway remaining.","tweet_url":"https://x.com/RyanDetrick/status/2106537452244767130","images":[],"data_points":["Secular bull market thesis intact","Multi-year runway"],"created_at":"2026-10-04T00:10:40.000Z"},{"author":"kurtsaltrichter","description":"European stocks in tug-of-war — rates winning. Analysts upgrading EU earnings at longest streak since 2022, but rising yields working against stocks. Stoxx 600 / EU 10Y correlation flipped to ~-0.7. Europe equity risk premium widening vs US.","tweet_url":"https://x.com/kurtsaltrichter/status/2106469843687915544","images":["https://pbs.twimg.com/media/HTuvKPVWkAEwVvH.jpg","https://pbs.twimg.com/media/HTuvKQmWcAA6onc.jpg","https://pbs.twimg.com/media/HTuvKP1WkAApX9D.jpg"],"data_points":["Stoxx600/EU10Y correlation ~-0.7","EU earnings upgrades longest since 2022","EU risk premium widening vs US"],"created_at":"2026-10-03T19:42:01.000Z"}]},{"topic":"Global Liquidity & Fiscal Dominance","items":[{"author":"KobeissiLetter","description":"US+China combined M2 surged to record $76.4T in August, +$7.9T YoY. China M2: $53.1T, US M2: $23.3T — both ATH. 4th consecutive full-year increase expected. 8 consecutive months of >$7T YoY growth — longest streak since 2021. Pre-pandemic: ~$3T/year.","tweet_url":"https://x.com/KobeissiLetter/status/2106495670807134499","images":["https://pbs.twimg.com/media/HTtY3GOWQAAmgFK.jpg"],"data_points":["US+China M2 $76.4T (record)","+$7.9T YoY","China M2 $53.1T","US M2 $23.3T","Pre-pandemic rate ~$3T/yr"],"created_at":"2026-10-03T21:24:39.000Z"},{"author":"LynAldenContact","description":"Fiscal dominance framework: 2018/19 thesis set investors up bullish through COVID. 2023 recognized noncyclical fiscal dominance (\"nothing stops this train\") — first inverted yield curve in modern US history not to forecast a recession. 2026 is mid-stage: AI narrative competes with fiscal/monetary. Higher Fed rates give a raise to top 10% asset owners while suppressing starter home buyers and widening the K-shaped economy.","tweet_url":"https://x.com/LynAldenContact/status/2106469024917754096","images":[],"data_points":["2026 = mid-stage fiscal dominance","Higher rates = stimulus to top 10%","First inverted curve that didn't call US recession"],"created_at":"2026-10-03T19:38:46.000Z"},{"author":"LynAldenContact","description":"Charts illustrating debasement dynamics: fiat debasement transfers real purchasing power from wage earners to asset owners. Referenced in context of the 'nothing stops this train' macro thesis.","tweet_url":"https://x.com/LynAldenContact/status/2106608319624262019","images":["https://pbs.twimg.com/media/HTwtGWeWUAAmIU7.jpg","https://pbs.twimg.com/media/HTwtGWdXwAAD1p2.jpg"],"data_points":["Debasement vs wage purchasing power (charts)","Asset owners benefit in fiscal dominance"],"created_at":"2026-10-04T04:52:16.000Z"},{"author":"LynAldenContact","description":"Brief comment: \"nothing stops this train\" — referencing ongoing fiscal dominance dynamics and US debt trajectory.","tweet_url":"https://x.com/LynAldenContact/status/2106597574199156933","images":[],"data_points":["Fiscal dominance thesis ongoing"],"created_at":"2026-10-04T04:09:35.000Z"}]},{"topic":"AI & Technology Data","items":[{"author":"KobeissiLetter","description":"US data center construction +73% YoY in August to record annualized $85B. Follows +65% YoY in June. Since 2021: +$76B total (+823%). General office construction -10% YoY to $46B (5th-lowest since Dec 2015). Gap between data center and office: record $39B.","tweet_url":"https://x.com/KobeissiLetter/status/2106454781816340774","images":["https://pbs.twimg.com/media/HTtYb1NXIAAZR0B.jpg"],"data_points":["Data center // ---------- helpers ----------
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'"'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderCharts(images) {
  if (!images || !images.length) return '';
  return `<div class="charts">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="chart" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderDataPoints(points) {
  if (!points || !points.length) return '';
  return `<div class="data-points">` + points.map(p =>
    `<span class="dp-tag">${escapeHtml(p)}</span>`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet &#8594;</a>`
    : '';
  const body = item.description || item.text || '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      ${body ? `<div class="item-text">${escapeHtml(body)}</div>` : ''}
      ${renderDataPoints(item.data_points)}
      ${renderCharts(item.images)}
    </div>`;
}

function renderTopic(topic, idx) {
  const items = (topic.items || []).map(renderItem).join('');
  const name = topic.topic || topic.name || `Topic ${idx + 1}`;
  return `
    <div class="topic">
      <div class="topic-head" onclick="toggleTopic(this)">
        <span class="topic-name">${escapeHtml(name)}</span>
        <span class="topic-count">${(topic.items || []).length}</span>
        <span class="topic-arrow">&#9658;</span>
      </div>
      <div class="topic-body">${items || '<div class="empty">No items.</div>'}</div>
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author ? authorTag(author, 'link-author') : '<span class="link-author">&#8212;</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, body, count) {
  return `
    <div class="section">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${count}</span>
        <span class="section-arrow">&#9658;</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const parts = [];
  const cov = d.coverage || {};
  if (cov.authors_covered != null && cov.authors_total != null) {
    const pct = cov.authors_total ? (100 * cov.authors_covered / cov.authors_total) : 0;
    parts.push(`coverage <strong>${cov.authors_covered}/${cov.authors_total}</strong> (${pct.toFixed(0)}%)`);
  }
  const topicCount = (d.topics || []).length;
  const itemCount = (d.topics || []).reduce((n, t) => n + (t.items || []).length, 0);
  parts.push(`topics <strong>${topicCount}</strong>`);
  parts.push(`items <strong>${itemCount}</strong>`);
  if ((d.links || []).length) parts.push(`links <strong>${d.links.length}</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(el) { el.parentElement.classList.toggle('open'); }
function toggleTopic(el)   { el.parentElement.classList.toggle('open'); }

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) { el.classList.add('match'); el.classList.remove('dim'); }
    else                    { el.classList.add('dim'); el.classList.remove('match'); }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match'); el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else if (activeFilter) clearFilter();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';

  const topicsBody = (d.topics || []).map(renderTopic).join('')
                  || '<div class="empty">No topics.</div>';
  const linksBody = (d.links || []).map(renderLink).join('');

  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Topics', topicsBody, (d.topics || []).length),
    linksBody ? renderSection('B', 'Link Queue', linksBody, (d.links || []).length) : '',
  ].join('');

  document.getElementById('app').innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open the main section and the first topic.
  document.querySelectorAll('.section').forEach((s, i) => { if (i === 0) s.classList.add('open'); });
  const firstTopic = document.querySelector('.topic');
  if (firstTopic) firstTopic.classList.add('open');

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
