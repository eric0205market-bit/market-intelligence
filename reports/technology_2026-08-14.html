r the entire AI hardware chain.", "quote": "This is almost certainly SpacexAI, with the Colossus 2 supercomputer, which is mostly being rented by Google and Anthropic, for an estimated $920 million and $1.25 billion per month, respectively.", "locator": "This is almost certainly SpacexAI", "quote_verified": true}, {"claim": "Nine customers each spent over $1 billion with Supermicro in fiscal 2026 and together made up about half of its revenue — CoreWeave plus seven others alongside the 28 percent whale.", "speaker": "Timothy Prickett Morgan", "type": "data_point", "entities": ["Supermicro", "CoreWeave"], "conviction": "high", "so_what": "Half of a $39 billion revenue base sits with nine buyers — the AI server market is a handful of counterparties, so credit and capex discipline at neoclouds is the systemic risk.", "quote": "Supermicro also said that it had nine customers who spent over $1 billion. So that is CoreWeave and seven other companies.", "locator": "Supermicro also said that it had nine customers", "quote_verified": true}]}, {"theme": "Dell parity and the Nvidia allocation chokepoint", "insights": [{"claim": "Dell will book roughly $60 billion in AI system sales in its fiscal 2027 ending January and perhaps $120 billion in total datacenter sales — meaning Dell and Supermicro will run AI systems businesses of about the same size, around $60 billion each.", "speaker": "Timothy Prickett Morgan", "type": "contrarian", "entities": ["Dell", "Supermicro", "AI systems"], "conviction": "high", "so_what": "The GenAI server trade is not a Supermicro monopoly; Dell captures equal AI dollars on a far larger, more diversified base — a relative-value argument for Dell over the pure play.", "quote": "But Dell and Supermicro will have about the same sized AI systems businesses, at around $60 billion each.", "locator": "The thing is, as fast as Supermicro expects to grow", "quote_verified": true}, {"claim": "Dell's enterprise customer base numbers in the millions of companies worldwide, versus Supermicro's few thousand direct customers plus channel — a distribution moat Supermicro cannot replicate even at matched AI revenue.", "speaker": "Timothy Prickett Morgan", "type": "thesis", "entities": ["Dell", "Supermicro", "enterprise"], "conviction": "high", "so_what": "When AI capex normalizes, Dell's enterprise long tail cushions the fall while Supermicro's concentrated hyperscaler book does not.", "quote": null, "locator": "The thing is, as fast as Supermicro expects to grow", "quote_verified": false}, {"claim": "The determinant of who wins AI system revenue is CPU and GPU allocation, which is controlled by the chip supplier rather than the system builders — making Supermicro's and Dell's growth a function of Nvidia's allocation decisions, not their own execution.", "speaker": "Timothy Prickett Morgan", "type": "thesis", "entities": ["Nvidia", "Supermicro", "Dell", "GPU allocation"], "conviction": "high", "so_what": "Value accrues to the allocator: system builders are price-takers on supply, so the durable margin sits at Nvidia, and OEM/ODM share shifts are a policy variable set upstream.", "quote": "It all comes down to CPU and GPU allocations, and we all know who controls them.", "locator": "It all comes down to CPU and GPU allocations", "quote_verified": true}]}], "insight_total": 26, "top_entities": ["Supermicro", "Nvidia", "Dell", "Vera-Rubin", "Grace-Blackwell", "SpacexAI", "Colossus 2", "Anthropic", "Google", "CoreWeave", "Charles Liang"], "source_meta": {"author": "Timothy Prickett Morgan", "word_count": 1626, "paywalled": false}}, {"record_id": "136737c914691495", "source_type": "technology", "source_name": "Wired", "source_url": "https://www.wired.com/story/cbp-workers-allegedly-used-government-databases-to-spy-on-exes-crushes-and-colleagues/", "title": "CBP Workers Allegedly Used Government Databases to Spy on Exes, Crushes, and Colleagues", "published_date": "2026-08-13", "language": "en", "processed_at": "2026-08-14T10:55:25Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "Society", "Geopolitics", "AI"], "gist": "FOIA'd internal records covering 2009-2022 document roughly 300 allegations of CBP employees misusing law-enforcement databases for personal ends, including the first known internal DHS abuse case involving commercially purchased ad-tech location data. The insider-abuse record arrives as ICE and CBP scale spending on surveillance vendors, with roughly $515 million going to Microsoft, Amazon, Google, and Palantir and Cellebrite alone taking in over $56 million in federal contracts this year.", "themes": [{"theme": "Scale of documented database abuse", "insights": [{"claim": "Of nearly 300 data-related misconduct entries WIRED identified in CBP internal records, 78 were serious enough to be assigned to Office of Professional Responsibility criminal investigators and 138 were referred to CBP management for review.", "speaker": "Yulia Almazova", "type": "data_point", "entities": ["Customs and Border Protection", "Office of Professional Responsibility", "Department of Homeland Security"], "conviction": "high", "so_what": "A quantified insider-abuse base rate gives regulators and litigators a concrete hook for restricting agency data access, a tail risk for vendors whose revenue depends on unrestricted federal deployment.", "quote": null, "locator": "Of the almost 300 data-related entries", "quote_verified": false}, {"claim": "WIRED identified 99 entries involving alleged breaches or unauthorized disclosures of data and 48 explicitly involving improper database queries inside CBP between 2009 and 2022.", "speaker": "Yulia Almazova", "type": "data_point", "entities": ["Customs and Border Protection", "WIRED"], "conviction": "high", "so_what": "Unauthorized disclosure, not just snooping, is the dominant failure mode, which points demand toward data-loss-prevention and audit tooling rather than more collection.", "quote": null, "locator": "WIRED identified 99 entries involving", "quote_verified": false}, {"claim": "CBP withheld 21 cases citing an exemption protecting active law-enforcement proceedings, and left most case-resolution fields blank, making it impossible to determine how often allegations were substantiated or whether anyone was disciplined.", "speaker": "Yulia Almazova", "type": "data_point", "entities": ["Customs and Border Protection", "Joint Intake Case Management System"], "conviction": "high", "so_what": "Accountability data is structurally missing, so external oversight has to be assumed weak when modeling regulatory risk to surveillance-data supply chains.", "quote": null, "locator": "Many cases are closed, but in most entries", "quote_verified": false}, {"claim": "A cluster of CBP data-misuse cases occurred around 2020 when the pandemic-driven shift to remote work led employees to email work files to their personal accounts.", "speaker": "Yulia Almazova", "type": "causal", "entities": ["Customs and Border Protection"], "conviction": "medium", "so_what": "Remote-work architecture measurably increased exfiltration events inside a high-security agency, a durable argument for endpoint and email DLP budgets.", "quote": null, "locator": "Many of these cases happened around 2020", "quote_verified": false}]}, {"theme": "Self-querying as a corruption leading indicator", "insights": [{"claim": "CBP treats employees querying their own names in law-enforcement databases as a leading indicator of future corruption, because self-queries surface early in corruption cases either as a test of whether searches are monitored or to check whether the employee is under investigation.", "speaker": "Yulia Almazova", "type": "framework", "entities": ["Customs and Border Protection", "Daniel Altman", "Office of Professional Responsibility"], "conviction": "high", "so_what": "A transferable insider-threat detection heuristic: monitor self-lookups as an early tripwire, which is exactly the behavioral-analytics feature security vendors can sell into government.", "quote": "Historical analysis of corruption cases showed that self-querying was common across a significant number of them, pointing to it being an indicator of corruption in the future.", "locator": "Doing retroactive analysis helped us understand", "quote_verified": true}, {"claim": "At least six entries in the CBP records explicitly describe employees querying themselves, and former OPR head Daniel Altman says escalation from that point is just a matter of degree.", "speaker": "Yulia Almazova", "type": "data_point", "entities": ["Daniel Altman", "Office of Professional Responsibility", "Customs and Border Protection"], "conviction": "medium", "so_what": "Small observed counts of a high-signal behavior imply the monitoring, not the behavior, is the scarce resource.", "quote": null, "locator": "At least six entries explicitly describe", "quote_verified": false}, {"claim": "Missing case-resolution codes in CBP's Joint Intake Case Management System are attributable to data-entry integrity problems rather than deliberate concealment, according to the agency's former OPR head.", "speaker": "Yulia Almazova", "type": "causal", "entities": ["Joint Intake Case Management System", "Daniel Altman", "Customs and Border Protection", "Immigration and Customs Enforcement"], "conviction": "medium", "so_what": "Federal case-management systems are poorly maintained even where policy requires completion, undercutting any audit-based assurance narrative from agencies or their software suppliers.", "quote": null, "locator": "According to Altman, the missing resolution fields", "quote_verified": false}]}, {"theme": "Commercial location data as the new abuse frontier", "insights": [{"claim": "A DHS employee allegedly used commercially purchased ad-tech-derived location data to track several coworkers' cell phones, which appears to be the first known internal abuse case involving DHS use of commercial location-tracking software.", "speaker": "Yulia Almazova", "type": "data_point", "entities": ["Department of Homeland Security", "Immigration and Customs Enforcement", "Office of Professional Responsibility"], "conviction": "high", "so_what": "A documented first-of-kind insider abuse of purchased telemetry is the kind of fact pattern that drives data-broker legislation and creates direct regulatory risk for location-data sellers.", "quote": "inappropriately utilized private software to track the location of several coworkers’ cell phones.", "locator": "The document describes an employee who allegedly", "quote_verified": true}, {"claim": "Buying commercial telemetry lets US agencies obtain app-generated location data without a court-approved warrant, effectively circumventing Fourth Amendment protections that would apply to obtaining the same data from phone companies.", "speaker": "Yulia Almazova", "type": "framework", "entities": ["Customs and Border Protection", "Immigration and Customs Enforcement", "Fourth Amendment"], "conviction": "high", "so_what": "The purchase loophole is the entire commercial rationale for the location-data-broker business; closing it by statute would remove the revenue line outright.", "quote": null, "locator": "Commercial telemetry data has become one of the most controversial", "quote_verified": false}, {"claim": "A 2023 DHS inspector general report found CBP, ICE, and the US Secret Service had bought and used commercial location data without fully complying with department privacy rules or developing sufficient policies for its use.", "speaker": "Yulia Almazova", "type": "data_point", "entities": ["Department of Homeland Security", "Customs and Border Protection", "Immigration and Customs Enforcement", "US Secret Service"], "conviction": "high", "so_what": "Existing IG findings of noncompliance are the predicate any future enforcement or appropriations restriction would build on.", "quote": null, "locator": "A 2023 DHS inspector general report found", "quote_verified": false}, {"claim": "Purchased location data can expose whether an individual is seeking reproductive care, their religious practice, or their sexual activity, according to Just Futures Law attorney Laura Rivera.", "speaker": "Yulia Almazova", "type": "thesis", "entities": ["Laura Rivera", "Just Futures Law"], "conviction": "high", "so_what": "Framing telemetry as a reproductive- and religious-privacy issue broadens the political coalition against data brokers well beyond immigration politics.", "quote": "This access allows officers to track people's daily movements in ways that can expose whether someone is seeking reproductive care, their religious practice, or their sexual activity,", "locator": "This access allows officers to track", "quote_verified": true}]}, {"theme": "The vendor stack and where the money goes", "insights": [{"claim": "ICE and CBP have collectively spent about $515 million on products from major tech firms including Microsoft, Amazon, Google, and Palantir in recent years, on top of smaller vendor contracts.", "speaker": "Yulia Almazova", "type": "data_point", "entities": ["Immigration and Customs Enforcement", "Customs and Border Protection", "Microsoft", "Amazon", "Google", "Palantir"], "conviction": "high", "so_what": "Sizes the addressable federal immigration-surveillance budget accruing to hyperscalers and Palantir, and identifies the same names as headline-risk exposures.", "quote": null, "locator": "a WIRED analysis found that in addition to smaller vendor contracts", "quote_verified": false}, {"claim": "Cellebrite has contracted with ICE and CBP since 2008 and has taken in more than $56 million in federal contracts this year, with ICE and CBP securing at least 13 separate mobile-extraction contracts in 2025 alone.", "speaker": "Yulia Almazova", "type": "data_point", "entities": ["Cellebrite", "Immigration and Customs Enforcement", "Customs and Border Protection"], "conviction": "high", "so_what": "Concrete federal run-rate and contract cadence for a listed forensics vendor, useful for sizing the US government revenue line and its political fragility.", "quote": null, "locator": "In 2025 alone, ICE and CBP secured at least 13 separate contracts", "quote_verified": false}, {"claim": "CBP's mobile-extraction toolkit spans Cellebrite, Grayshift, and Magnet Forensics, and a 2022 EPIC report showed CBP was upgrading that software to centralize data pulled from searches under active contracts then worth at least $1.29 million.", "speaker": "Yulia Almazova", "type": "data_point", "entities": ["Cellebrite", "Grayshift", "Magnet Forensics", "EPIC", "Customs and Border Protection"], "conviction": "medium", "so_what": "Centralizing extracted phone data raises the value of the aggregate dataset and, symmetrically, the blast radius of any single insider abuse.", "quote": null, "locator": "A 2022 report by the nonprofit civil rights group EPIC", "quote_verified": false}, {"claim": "Palantir supplies both the Investigative Case Management system for Homeland Security Investigations and the FALCON analytics tool, and DHS data-sharing lets CBP agents reach much of the same data even where direct FALCON access is nominally restricted to ICE.", "speaker": "Yulia Almazova", "type": "causal", "entities": ["Palantir", "Homeland Security Investigations", "Immigration and Customs Enforcement", "Customs and Border Protection", "FALCON"], "conviction": "high", "so_what": "Access controls scoped by agency are defeated by cross-agency sharing, meaning per-agency restrictions are weak protection and Palantir's effective installed footprint is larger than contract-by-contract accounting suggests.", "quote": null, "locator": "Then there is Palantir’s Investigative Case Management system", "quote_verified": false}, {"claim": "Thomson Reuters' Consolidated Lead Evaluation and Reporting product repackages privately collected utility records and license-plate data into a law-enforcement surveillance tool available to federal agents.", "speaker": "Yulia Almazova", "typ reversible disease early, with commercial products like Evido's LiverPRO (partnered with Roche) already outperforming the incumbent Fib-4 score.", "themes": [{"theme": "Market size and the detection gap", "insights": [{"claim": "Fatty liver disease now affects approximately 30 percent of adults worldwide, with liver fat exceeding 5 to 10 percent of organ weight in more than a billion people.", "speaker": "David Cox", "type": "data_point", "entities": ["fatty liver disease", "fibrosis"], "conviction": "high", "so_what": "A 30 percent adult prevalence defines an unusually large screening and therapeutics TAM for anyone selling diagnostics, GLP-1s, or liver-targeted drugs.", "quote": null, "locator": "While the presence of fat in a normal, healthy liver", "quote_verified": false}, {"claim": "Three-quarters of people with cirrhosis or advanced liver scarring are only diagnosed once their condition has become life-threatening, because fatty liver disease typically develops without noticeable symptoms.", "speaker": "David Cox", "type": "data_point", "entities": ["cirrhosis", "fatty liver disease"], "conviction": "high", "so_what": "The bottleneck is detection timing, not treatment availability, so value accrues to screening and triage tools rather than to new late-stage therapies.", "quote": null, "locator": "Even in cases of cirrhosis or advanced scarring", "quote_verified": false}, {"claim": "Fatty liver disease has been linked to increased risk of cardiovascular disease and various cancers in addition to liver failure, making it an upstream driver of multiple high-cost disease categories.", "speaker": "David Cox", "type": "causal", "entities": ["fatty liver disease", "cardiovascular disease", "cancer"], "conviction": "medium", "so_what": "Cross-indication linkage strengthens the health-economic case payers need to fund population-level liver screening.", "quote": null, "locator": "If left to linger, progressive fat accumulation", "quote_verified": false}]}, {"theme": "Reversibility makes early detection economically decisive", "insights": [{"claim": "In early stages fatty liver damage is highly reversible through lifestyle changes including reduced alcohol intake, weight loss, exercise, and even drinking more coffee, which have been shown to reverse scarring and inflammation.", "speaker": "David Cox", "type": "data_point", "entities": ["fatty liver disease", "fibrosis"], "conviction": "high", "so_what": "Because the disease is reversible, a cheap detection tool captures most of the clinical value, which favors software margins over drug economics in early-stage patients.", "quote": null, "locator": "If fatty liver disease can be identified early", "quote_verified": false}, {"claim": "For patients with moderate to advanced liver scarring, the GLP-1 medication semaglutide and the drug resmetirom have been shown to be highly effective therapeutics.", "speaker": "David Cox", "type": "data_point", "entities": ["semaglutide", "resmetirom", "GLP-1"], "conviction": "high", "so_what": "Effective drugs already exist for the diagnosed population, so every incremental early diagnosis converts directly into pharma revenue, aligning drugmaker incentives with funding AI screening.", "quote": null, "locator": "Even for people with moderate to advanced liver scarring", "quote_verified": false}, {"claim": "Hepatology has traditionally optimized for late-stage care and extending survival rather than early detection and prevention, despite the liver's capacity to regenerate and reverse fibrosis.", "speaker": "David Cox", "type": "contrarian", "entities": ["Jeffrey Lazarus", "CUNY Graduate School of Public Health and Health Policy"], "conviction": "high", "so_what": "A stated misallocation inside a specialty is the kind of gap that new entrants exploit; watch for screening-first startups displacing referral-driven incumbents.", "quote": "The liver is a very versatile and interesting organ because it can regenerate, fibrosis can be reversed, and you can be completely healthy again,", "locator": "The liver is a very versatile and interesting organ", "quote_verified": true}, {"claim": "Danish research found that informing people they have liver fibrosis makes them more likely to commit to dietary and exercise regimes, meaning diagnosis itself functions as a behavioral intervention.", "speaker": "David Cox", "type": "causal", "entities": ["Jeffrey Lazarus", "Denmark"], "conviction": "medium", "so_what": "Diagnosis-as-treatment improves the ROI math on screening even before any drug is prescribed.", "quote": null, "locator": "He points to research carried out in Denmark", "quote_verified": false}, {"claim": "Identifying and treating patients earlier would save health systems vast sums because liver transplants are extraordinarily expensive, particularly in the US.", "speaker": "David Cox", "type": "thesis", "entities": ["Jeffrey Lazarus", "United States"], "conviction": "high", "so_what": "Transplant-cost avoidance is the reimbursement argument that gets a screening algorithm paid for by US payers.", "quote": "Liver transplants are extraordinarily expensive in any country, but especially the US.", "locator": "For health care systems grappling with a rising burden", "quote_verified": true}]}, {"theme": "Why AI, not more tests: the workflow constraint", "insights": [{"claim": "Any new liver-screening step must run in the background or reduce to a single button press, because physicians facing growing workload and administrative burden will not sustainably absorb added testing.", "speaker": "David Cox", "type": "framework", "entities": ["Jonathan Dranoff", "Yale University"], "conviction": "high", "so_what": "Clinician time, not accuracy, is the binding constraint for health AI adoption; products requiring new physician actions should be discounted heavily.", "quote": "You have to have something that can run in the background or it’s easy to just hit a button and do it,", "locator": "You have to have something that can run in the background", "quote_verified": true}, {"claim": "Simple noninvasive liver-health assessments already exist but are rarely used even in obviously high-risk groups such as people with obesity and type 2 diabetes.", "speaker": "David Cox", "type": "causal", "entities": ["Fib-4 index", "type 2 diabetes", "obesity"], "conviction": "high", "so_what": "The failure is deployment, not technology, which favors vendors that automate existing scores over those developing novel biomarkers.", "quote": null, "locator": "One of the frustrations for Lazarus and others", "quote_verified": false}, {"claim": "AI can retrospectively mine massive numbers of hospital visits and lab reports across electronic health records to prioritize who is most at risk, without requiring new patient encounters.", "speaker": "David Cox", "type": "thesis", "entities": ["Jeffrey Lazarus", "electronic health records"], "conviction": "high", "so_what": "Retrospective EHR mining is a zero-marginal-cost patient-finding channel, valuable to both health systems and pharma launching liver drugs.", "quote": "AI can retrospectively go through massive numbers of hospital visits and lab reports,", "locator": "AI can retrospectively go through massive numbers", "quote_verified": true}, {"claim": "Combining the Fib-4 index with the second-line enhanced liver fibrosis blood test has been shown to improve diagnosis of advanced fibrosis four-fold in patients with worrying liver fat levels.", "speaker": "David Cox", "type": "data_point", "entities": ["Fib-4 index", "enhanced liver fibrosis test"], "conviction": "high", "so_what": "A quantified four-fold uplift from a two-test cascade sets the accuracy bar that AI alternatives must clear to justify replacing the standard pathway.", "quote": null, "locator": "Using both of these tests in patients", "quote_verified": false}]}, {"theme": "Competing AI approaches and commercial traction", "insights": [{"claim": "Danish health tech startup Evido's LiverPRO algorithm view/ego-1300-electric-lawn-mower/", "title": "This Ego Electric Mower Tamed My 2.5-Acre Lawn With Ease and in Less Time", "published_date": "2026-08-12", "language": "en", "processed_at": "2026-08-14T10:55:25Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "Energy"], "gist": "A 9/10 review of Ego's $1,799 30-inch cordless 1300-series mower argues battery-electric has now reached the acreage tier previously reserved for gas and riding mowers, cutting mow time roughly 30 percent versus a 21-inch deck. The reviewer's stated reason for buying is gas small-engine maintenance failure, and the explicit strategic point is that the purchase is really an entry into Ego's cross-tool battery platform.", "themes": [{"theme": "Electric displacing gas at the high end", "insights": [{"claim": "Ego's 1300-series 30-inch cordless mower handled roughly 2.5 acres of mowing, indicating residential battery-electric mowers now cover acreage that previously required gas or riding equipment.", "speaker": "Scott Gilbertson", "type": "thesis", "entities": ["Ego", "Ego 1300"], "conviction": "high", "so_what": "The addressable market for battery outdoor power equipment is expanding into large-property owners, the segment gas holdouts assumed was defensible.", "quote": null, "locator": "The largest, most powerful residential electric mower", "quote_verified": false}, {"claim": "Repeated small-engine failures and the maintenance burden of carburetor cleaning, air filters, and repairs, not emissions or noise, were the decisive trigger for switching from gas to electric.", "speaker": "Scott Gilbertson", "type": "causal", "entities": ["Toro", "Ego"], "conviction": "high", "so_what": "Reliability and total cost of ownership are the real switching drivers in outdoor power equipment, which means marketing on emissions understates the conversion rate.", "quote": null, "locator": "When my older, 21-inch gas mower died yet again", "quote_verified": false}, {"claim": "The 30-inch deck cuts about on, removing moonlight interference and making this year's shower unusually visible. The practical guidance from NASA and ESA inverts the intuitive approach: no telescopes, no binoculars, no looking at the radiant constellation, and at least an hour of dark adaptation and patience.", "themes": [{"theme": "Why 2026 is an unusually good year", "insights": [{"claim": "The 2026 Perseid peak on the night of August 12-13 coincides with the new moon phase, so no moonlight interferes and the sky is much darker than in a typical year.", "speaker": "Jorge Garay", "type": "data_point", "entities": ["Perseids", "new moon"], "conviction": "high", "so_what": "Lunar phase, not shower intensity, is the dominant year-to-year driver of meteor visibility, so viewing plans should key off the moon calendar.", "quote": null, "locator": "In 2026, the viewing conditions are particularly favorable", "quote_verified": false}, {"claim": "The Perseids reach up to 100 meteors per hour at peak under ideal conditions, making them one of the three most intense annual showers alongside the Geminids in December and the Quadrantids in January.", "speaker": "Jorge Garay", "type": "data_point", "entities": ["Perseids", "Geminids", "Quadrantids"], "conviction": "high", "so_what": "Establishes the only three annual events worth planning dark-sky travel around.", "quote": null, "locator": "Traditionally, the Perseids reach a rate of up to 100 meteors per hour", "quote_verified": false}, {"claim": "August 2026 also features a historic total solar eclipse in addition to the Perseid shower.", "speaker": "Jorge Garay", "type": "data_point", "entities": ["total solar eclipse", "Perseids"], "conviction": "medium", "so_what": "Two headline sky events in one month concentrates demand for dark-sky travel, optics, and viewing gear into a single window.", "quote": null, "locator": "In addition to a historic total solar eclipse", "quote_verified": false}, {"claim": "Meteor showers occur when Earth passes through trails of comet particles that heat by atmospheric friction until they burn up, which is why the phenomenon recurs on a fixed annual calendar.", "speaker": "Jorge Garay", "type": "framework", "entities": ["Perseids", "comets"], "conviction": "high", "so_what": "The orbital mechanism explains why these dates are predictable years ahead, unlike aurora or comet apparitions.", "quote": null, "locator": "Occasionally, Earth passes through the trails of particles", "quote_verified": false}]}, {"theme": "Counterintuitive viewing technique", "insights": [{"claim": "NASA advises against telescopes and binoculars for meteor watching because they narrow the field of view while meteors can appear anywhere in the sky, so naked-eye observation is superior.", "speaker": "Jorge Garay", "type": "contrarian", "entities": ["NASA", "Perseids"], "conviction": "high", "so_what": "The intuitive gear purchase actively degrades the experience, a useful check against equipment-first thinking.", "quote": null, "locator": "Another important tip is to avoid using telescopes", "quote_verified": false}, {"claim": "It takes human eyes 20 to 30 minutes to fully adjust to the dark, and any glance at a phone or bright screen resets that sensitivity.", "speaker": "Jorge Garay", "type": "data_point", "entities": ["NASA", "European Space Agency"], "conviction": "high", "so_what": "A concrete physiological constraint that determines whether a viewing trip succeeds or fails.", "quote": null, "locator": "Keep in mind that it takes the human eyes", "quote_verified": false}, {"claim": "Despite being named for the constellation Perseus, the Perseids do not require looking toward it, because both NASA and ESA note meteors can streak across any part of the sky.", "speaker": "Jorge Garay", "type": "contrarian", "entities": ["NASA", "European Space Agency", "Perseus"], "conviction": "high", "so_what": "Naming convention misleads casual observers into narrowing their view, reducing observed counts.", "quote": null, "locator": "Although the Perseids get their name", "quote_verified": false}, {"claim": "Viewing after midnight is better because the shower's radiant reaches a higher point above the horizon and the frequency of visible meteors increases, and staying under dark sky at least an hour gives the best chance since meteors arrive in irregular bursts rather than at a steady rate.", "speaker": "Jorge Garay", "type": "framework", "entities": ["Perseids", "NASA", "European Space Agency"], "conviction": "high", "so_what": "Timing and duration matter more than location alone; short viewing windows systematically undersample a bursty phenomenon.", "quote": null, "locator": "Ideally, lie down or use a reclining chair", "quote_verified": false}]}], "insight_total": 8, "top_entities": ["Perseids", "NASA", "European Space Agency", "Geminids", "Quadrantids", "Perseus", "new moon"], "source_meta": {"author": "Jorge Garay", "word_count": 643, "paywalled": false}}, {"record_id": "622ddde25e86c4f8", "source_type": "technology", "source_name": "Wired", "source_url": "https://www.wired.com/story/organoids-lab-grown-brains-neural-networks/#intcid=_wired-verso-hp-trending_5d1cd931-8403-4690-ba5e-e6e2ee538ab3_popular4-2", "title": "AI Is Dead. Organoids Are Alive", "published_date": "2026-08-11", "language": "en", "processed_at": "2026-08-14T10:55:25Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech", "Society"], "gist": "A field report on human brain organoids argues the near-term money is in drug screening, not computing: neuropsychiatric drugs fail in human trials about 95 percent of the time, one six-well plate yields up to 4,000 organoids versus five or six research monkeys, and the NIH stopped funding animal-only research in July 2025 while putting $87 million into a Standardized Organoid Modeling Center. Melbourne's Cortical Labs is selling neurons-as-a-service on its CL-1 hardware and aiming to be the Nvidia of neural computing, though despite the headline the text is far more hedged, presenting biological computing as a long-term goal while organoids remain, in the author's words, glorified lab rats.", "themes": [{"theme": "Drug discovery is the actual near-term business", "insights": [{"claim": "The human clinical trial failure rate for neuropsychiatric drugs is close to 95 percent, a figure nearly every organoid researcher cites as the core justification for the field.", "speaker": "Claire L. Evans", "type": "data_point", "entities": ["neuropsychiatric drugs", "brain organoids"], "conviction": "high", "so_what": "A 95 percent failure rate quantifies the value of any preclinical model that improves human predictivity, sizing the willingness-to-pay for organoid platforms in CNS pharma.", "quote": null, "locator": "Nearly every organoid researcher I met", "quote_verified": false}, {"claim": "Animal testing was never the most physiologically relevant way to validate drugs, only the most practical one, and organoids have changed that calculus by making human-derived tissue the practical option.", "speaker": "Claire L. Evans", "type": "causal", "entities": ["brain organoids", "animal testing"], "conviction": "high", "so_what": "The substitution argument is economic rather than ethical, which means adoption should track throughput and cost curves, not advocacy pressure.", "quote": null, "locator": "That’s because drugs are ordinarily tested on animals", "quote_verified": false}, {"claim": "One six-well plate can produce up to 4,000 brain organoids, versus a best case of five or six nonhuman primates with implanted electrodes, a throughput gap of roughly three orders of magnitude.", "speaker": "Claire L. Evans", "type": "data_point", "entities": ["Thomas Hartung", "Johns Hopkins", "nonhuman primates"], "conviction": "high", "so_what": "Throughput of this magnitude is what makes statistically powered CNS screening feasible for the first time, the single strongest driver of platform demand.", "quote": "We’re producing, in one six-well plate, up to 4,000 brain organoids.", "locator": "Think about nonhuman primates, which is the model closest to us", "quote_verified": true}, {"claim": "An organoid trained to play Pong is valuable primarily as a test subject for measuring how drugs affect learning and memory, converting a computing demo into a pharmacology assay.", "speaker": "Claire L. Evans", "type": "framework", "entities": ["Thomas Hartung", "organoid intelligence", "Pong"], "conviction": "high", "so_what": "Reframes biocomputing demos as instrumentation for drug discovery, which is where near-term revenue is defensible.", "quote": null, "locator": "In this context, OI isn’t an end as much as it is a means", "quote_verified": false}, {"claim": "Hartung's team is building a platformer video game with obstacles for organoids to jump over so they can measure how long organoids retain a learned task and what Alzheimer's drugs do to memory strength and duration.", "speaker": "Claire L. Evans", "type": "data_point", "entities": ["Thomas Hartung", "Alzheimer's", "Johns Hopkins"], "conviction": "high", "so_what": "Behavioral readouts on organoids would give CNS programs a memory endpoint years before human trials, a concrete de-risking tool.", "quote": null, "locator": "In his office, Hartung showed me a simple video game", "quote_verified": false}]}, {"theme": "Policy and funding tailwinds", "insights": [{"claim": "In July 2025 the National Institutes of Health announced it will no longer award grant funding to research relying exclusively on animal testing, explicitly encouraging new approach models such as organoids.", "speaker": "Claire L. Evans", "type": "data_point", "entities": ["National Institutes of Health", "brain organoids", "animal testing"], "conviction": "high", "so_what": "A funding-eligibility rule change forces every NIH-dependent lab to buy or build non-animal models, a mandated demand shock for organoid suppliers and contract research organizations.", "quote": null, "locator": "In July 2025, the National Institutes of Health announced", "quote_verified": false}, {"claim": "In September the NIH announced an $87 million investment in building a Standardized Organoid Modeling Center.", "speaker": "Claire L. Evans", "type": "data_point", "entities": ["National Institutes of Health", "Standardized Organoid Modeling Center"], "conviction": "high", "so_what": "Public money funding standardization is the precondition for a commercial organoid market, since regulators and pharma will not adopt non-comparable assays.", "quote": null, "locator": "in September, the NIH announced an $87 million investment", "quote_verified": false}, {"claim": "Because organoids are made from induced pluripotent stem cells taken from consenting adult donors, they avoid both the religious opposition that hit embryonic stem cell research in the 1990s and the animal-rights opposition that constrains lab rats and primates.", "speaker": "Claire L. Evans", "type": "thesis", "entities": ["induced pluripotent stem cells", "brain organoids", "National Institutes of Health"], "conviction": "high", "so_what": "The absence of an organized opposition coalition removes the main historical source of regulatory delay in this area of biotech.", "quote": null, "locator": "Fortunately for the NIH, since organoids are made", "quote_verified": false}, {"claim": "Brain organoids currently sit outside both human-subject and animal-welfare protections, so no permission is required to experiment on them, though that protocol would have to evolve if organoids grow from bee-brain to mouse-brain scale.", "speaker": "Claire L. Evans", "type": "framework", "entities": ["brain organoids", "John Evans", "UCSD Institute for Practical Ethics"], "conviction": "high", "so_what": "The regulatory vacuum is the field's biggest current advantage and its clearest future discontinuity risk, keyed to organoid size.", "quote": "For now, you don’t need permission to torture brain organoids either.", "locator": "From a bioethical perspective, they aren’t people", "quote_verified": true}, {"claim": "Ordinary people surveyed are not much bothered by organoids, and when they object it is because organoids are creepy and muddy the line between person and thing, not because of sentience concerns.", "speaker": "Claire L. Evans", "type": "contrarian", "entities": ["brain organoids"], "conviction": "medium", "so_what": "Public backlash risk is aesthetic and category-based rather than argument-based, so it will not be defused by technical reassurance and should be managed as branding.", "quote": null, "locator": "Recent studies suggest that ordinary people", "quote_verified": false}, {"claim": "Organoid intelligence functions above all as good PR, a savvily branded attractor for funding and talent in a wide-open field, according to the toxicologist who co-authored its founding Declaration.", "speaker": "Claire L. Evans", "type": "contrarian", "entities": ["Thomas Hartung", "organoid intelligence", "Lena Smirnova"], "conviction": "high", "so_what": "A field's own leading advocate calling the branding PR is a strong signal to discount OI computing claims and price the sector on drug-screening fundamentals.", "quote": "Organoid intelligence is, above all, good PR—a savvily branded attractor for funding and talent in a wide-open field.", "locator": "Organoid intelligence is, above all, good PR", "quote_verified": true}]}, {"theme": "Cortical Labs and neurons-as-a-service", "insights": [{"claim": "Cortical Labs' CL-1 is a biological computer the size of an elongated toaster with an onboard life-support system that keeps up to a million neurons alive for six months, sold with sub-millisecond-latency remote access as neurons as a service.", "speaker": "Claire L. Evans", "type": "data_point", "entities": ["Cortical Labs", "CL-1", "Cortical Cloud"], "conviction": "high", "so_what": "A six-month culture lifetime and remote API define the unit economics and churn profile of the first commercial biocomputing product.", "quote": null, "locator": "In Melbourne, Cortical Labs cultivates flat neural cultures", "quote_verified": false}, {"claim": "Cortical Labs is explicitly aiming to become the Nvidia of neural computing by supplying the hardware layer for the field.", "speaker": "Claire L. Evans", "type": "thesis", "entities": ["Cortical Labs", "Nvidia", "CL-1"], "conviction": "high", "so_what": "The stated strategy is picks-and-shovels rather than applications, which is the position that captured value in the GPU era and is worth tracking for private-market exposure.", "quote": "With the CL-1, Cortical Labs is aiming to become the Nvidia of neural computing, providing hardware and, let’s say, “neurons as a service” with a sub-millisecond delay.", "locator": "With the CL-1, Cortical Labs is aiming", "quote_verified": true}, {"claim": "The current customer base for neural computers is researchers who want to work with neurons without doing the wet-lab husbandry themselves, not general-purpose computing buyers.", "speaker": "Claire L. Evans", "type": "thesis", "entities": ["Cortical Labs", "CL-1"], "conviction": "high", "so_what": "Demand today is outsourced lab labor, a small research-tools market, so revenue projections premised on displacing AI compute are premature.", "quote": null, "locator": "For now, these neural computers are mostly of interest", "quote_verified": false}, {"claim": "Cortical Labs' longer-term bet is that neurons prove to be an energy-efficient, resilient substrate for general computing, including tasks currently handled by AI such as image recognition and classification.", "speaker": "Claire L. Evans", "type": "prediction", "entities": ["Cortical Labs", "artificial intelligence", "image recognition"], "conviction": "medium", "so_what": "Names the specific AI workloads biocomputing intends to attack, giving a concrete benchmark against which to test progress claims.", "quote": null, "locator": "Eventually, however, the company hopes that neurons", "quote_verified": false}, {"claim": "The investment case for biological computing is that self-repair, adaptability, longevity, and energy efficiency are properties you get for free in biology but must be engineered at great cost in silicon.", "speaker": "Claire L. Evans", "type": "framework", "entities": ["Brett Kagan", "Cortical Labs", "artificial intelligence"], "conviction": "high", "so_what": "A clean framework for evaluating whether any given AI workload is a candidate for biological substrates: those where energy and adaptability dominate raw throughput.", "quote": "When you think about what you want from AI, it’s biology,", "locator": "When you think about what you want from AI", "quote_verified": true}, {"claim": "Cortical Labs' 2022 experiment trained a neural culture on a microchip to play Atari's Pong by rewarding correct decisions with predictable electrical pulses and punishing errors with chaotic bursts.", "speaker": "Claire L. Evans", "type": "data_point", "entities": ["Cortical Labs", "Brett Kagan", "Pong"], "conviction": "high", "so_what": "Establishes a working programming interface for living matter using only signal predictability as the reward channel, the key technical primitive of the field.", "quote": null, "locator": "In 2022, using a system similar to what currently powers", "quote_verified": false}, {"claim": "The Pong result served as a minimal proof of concept for Karl Friston's theory that self-organizing biological systems tend to minimize surprise, showing neurons reorganize to avoid chaotic stimulus.", "speaker": "Claire L. Evans", "type": "framework", "entities": ["Karl Friston", "Cortical Labs", "Brett Kagan"], "conviction": "high", "so_what": "Surprise minimization gives biocomputing a general training principle rather than a task-specific hack, which is what would make the approach scalable.", "quote": null, "locator": "The technique served as a minimal proof of concept", "quote_verified": false}, {"claim": "Cortical Labs positions st a version of the world.", "speaker": "Claire L. Evans", "type": "framework", "entities": ["Alon Loeffler", "Cortical Labs"], "conviction": "high", "so_what": "Explains why game environments, not benchmarks, are the natural interface for biological compute, and why progress will be measured in embodiment rather than FLOPS.", "quote": "A game is just a version of the world,", "locator": "But as Alon Loeffler, a scientist at Cortical Labs", "quote_verified": true}, {"claim": "Programming living matter carries a failure mode absent from conventional computing: environmental settings such as temperature and oxygen-CO2 mix are user-controllable, and getting them wrong kills the neurons.", "speaker": "Claire L. Evans", "type": "thesis", "entities": ["Cortical Cloud", "Cortical Labs"], "conviction": "high", "so_what": "Irreversible hardware loss from software error is a novel operational and liability risk that has no analogue in cloud computing.", "quote": "No matter how badly you mess up your code, things on the computer don’t normally die in real life.", "locator": "I page over to the neurons’ environmental settings", "quote_verified": true}]}, {"theme": "Physical limits and the vascularization bottleneck", "insights": [{"claim": "Organoids cannot grow much beyond 5 millimeters because without a vascular system to deliver oxygen and remove metabolic waste they develop a necrotic core and suffocate.", "speaker": "Claire L. Evans", "type": "framework", "entities": ["brain organoids", "vascular system"], "conviction": "high", "so_what": "Vascularization is the single technical gate on organoid scale, so it is the specific capability to track when assessing whether the field's ceiling is about to move.", "quote": null, "locator": "Conveniently, organoids can’t grow much bigger", "quote_verified": false}, {"claim": "Johns Hopkins nanotechnologist David Gracias is developing biomimetic artificial arteries and Annie Kathuria is building rough blood vessel networks from endot esigned.", "themes": [{"theme": "The attack: cost, access, and capability", "insights": [{"claim": "A coin-sized Wi-Fi-enabled hardware implant costing less than $100 can be fitted in under a minute into a Boeing 737 port reachable through an exterior hatch that maintenance workers and airport staff routinely access between flights.", "speaker": "Andy Greenberg", "type": "data_point", "entities": ["Boeing 737", "UCSD", "Oberlin College"], "conviction": "high", "so_what": "Sub-$100 hardware cost plus 60-second installation puts a credible aviation attack within reach of many more actors than bomb-based threats, shifting the aviation security spend toward ground-access controls.", "quote": null, "locator": "To carry out that hacking, they've built", "quote_verified": false}, {"claim": "The targeted port can be reached with no special tools in about 15 seconds and is typically protected by only a hatch without a lock, with the device hidden entirely from view under the dust cap that normally covers the connector.", "speaker": "Andy Greenberg", "type": "data_point", "entities": ["Boeing 737", "Sam Crow", "Stefan Savage"], "conviction": "high", "so_what": "Physical concealment plus no-lock access means routine visual inspection would not detect an installed implant, so mitigation must be design-level, not procedural.", "quote": "Well, it turns out there’s a port that’s externally accessible. You can get to it with no special tools in about 15 seconds.", "locator": "If you could get 60 seconds with an airplane", "quote_verified": true}, {"claim": "The implant works by sending electrical signals at a higher current than legitimate ones on the bus connecting the Flight Management Computer and the Multipurpose Control Display Unit, letting it override real commands, a technique the researchers dubbed Bus Driver.", "speaker": "Andy Greenberg", "type": "causal", "entities": ["Bus Driver", "Flight Management Computer", "Multipurpose Control Display Unit", "Sam Crow"], "conviction": "high", "so_what": "The vulnerability is electrical rather than software, so it cannot be patched by a firmware update and requires hardware isolation or cryptographic authentication to fix.", "quote": null, "locator": "Soon after, Crow discovered, using the group's avionics test bed", "quote_verified": false}, {"claim": "The device carries a Wi-Fi radio that could in theory connect to the plane's in-flight Wi-Fi network and beacon out to an attacker, allowing remote control of the implant and the commands it sends.", "speaker": "Andy Greenberg", "type": "thesis", "entities": ["Boeing 737", "in-flight Wi-Fi", "Sam Crow"], "conviction": "medium", "so_what": "In-flight connectivity, sold as a passenger amenity, becomes the command-and-control channel for a physical implant, a systemic argument for isolating passenger networks from avionics.", "quote": null, "locator": "The tiny gadget included a chip capable of running", "quote_verified": false}, {"claim": "The implant can alter autopilot waypoints to redirect the flight and change variables such as the plane's weight or outside air temperature, while simultaneously tampering with the Multipurpose Control Display Unit so those changes never appear on the pilot's screen.", "speaker": "Andy Greenberg", "type": "data_point", "entities": ["Flight Management Computer", "Multipurpose Control Display Unit", "Boeing 737"], "conviction": "high", "so_what": "Combining actuation with display spoofing is what turns a nuisance into a safety-critical attack, and it is the specific capability regulators would have to certify against.", "quote": null, "locator": "Soon he had improved their device's ability", "quote_verified": false}]}, {"theme": "Consequence modeling and residual pilot defenses", "insights": [{"claim": "Falsifying outside air temperature or aircraft load can prevent a 737 from reaching the necessary speed for takeoff before running out of runway, making takeoff-calculation tampering as dangerous as navigation ta // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
