<!DOCTYPE html>
<html lang="en">
<head>

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-11-13T06:21:27Z", "input_stats": {"total_tweets": 283, "unique_authors": 79, "tweets_with_images": 58, "after_noise_filter": 183}, "summary": "**NVIDIA / Jensen Huang:** Jensen Huang resigned after Reuters reported a second (and rumored third) relationship with employees; **cryptopunk7213** tallies NVDA down ~15% on the day and ~$2T of market cap in 30 days, though **saxena_puru** and **nic_carter** note AI stocks recovered intraday losses and the stock bounced 10% off the lows. The spy narrative is collapsing: **GavinSBaker** cites AG, CIA and DNI non-confirmations on Alice Huang and says the board should have waited, with 1,600+ internal comments backing reinstatement. **hosseeb** is the lone sharp dissent, arguing Megaspeed smuggling evidence makes Jensen complicit. **DCinvestor**, **Galois_Capital** and **Fiskantes** see the real casualty as open-source AI's most senior advocate — 'Chokepoint 3.0 is coming for AI.'\n\n**Washington:** **AndrewCurran_** reports OpenAI joining Anthropic to back bipartisan chip export controls before year-end, Sen. Tim Scott requesting Jensen and Lutnick appear **December 3**, and Reuters saying the White House is weighing pushing Lutnick out. **Will DePue**'s forensics (via **AndrewCurran_**, **nicbstme**) show DeepSeek, Moonshot, MiniMax and Ant trained on banned Blackwell; **dylan522p** says the open-source code made that obvious for ages. **PalmerLuckey** says China does not want Nvidia selling into China, contradicting **hosseeb**.\n\n**Anthropic IPO:** said to be **six times oversubscribed** — **biancoresearch**: 'maybe the AI bubble is NOT popping.' **AndreasSteno** publishes a full study calling **$1.4T** undervalued and notes the S-1 shows the move away from Nvidia with memory as the common bottleneck; **Delphi_Digital**'s Jason is skeptical on index inclusion and supply. **cryptopunk7213** expects OpenAI to drop a 'monster' model around Huang was a Chinese spy; OpenAI and Anthropic push for export controls; a third affair is rumored; an ex-OpenAI researcher forensically shows six Chinese models were trained on banned NVIDIA GPUs; and a majority of NVIDIA employees internally argue to bring him back. Separately quotes a tweet calling the firing 'an obvious and transparent authoritarian act' and says 'jensen firing is an IQ test.'", "tweet_url": "https://x.com/cryptopunk7213/status/2121085757729255837", "images": [], "type": "tweet", "created_at": "2026-11-13T03:40:27.000Z"}, {"author": "cryptopunk7213", "summary": "Shares the Reuters 'second employee' exclusive screenshot as the headline that triggered the cascade.", "tweet_url": "https://x.com/cryptopunk7213/status/2120966395034841154", "images": ["https://pbs.twimg.com/media/HW8vrZpWgAIXReK.jpg"], "type": "tweet", "created_at": "2026-11-12T19:46:08.000Z"}, {"author": "0x_Kun", "summary": "Argues NVIDIA's deals and investments were only possible because it was founder-led, and that Jensen leaving puts the whole industry at a disadvantage. Has long thought hardware is too competitive to remain a monopoly, but Jensen would have held the lead as long as possible; 'hard to be bullish long term NVDA without him.' Notes if Jensen launched a rival project it would tank NVDA. Hopes the cause was an intelligence leak rather than an affair. In replies, reads the Bloomberg account as Jensen not really fighting the push.", "tweet_url": "https://x.com/0x_Kun/status/2121081630253281381", "images": [], "type": "tweet", "created_at": "2026-11-13T03:24:03.000Z"}, {"author": "dylan522p", "summary": "On succession: says the board needs to chase Charlie Kawwas or Johny Srouji as the only somewhat viable CEO replacements; Colette Kress 'wouldn't' take it in his view, and an internal candidate he is asked about is 'a good guy' who can't do the technical work Jensen does, so 'Nvidia will fall behind without technical leadership.' In a separate exchange, notes Intel empirically slowed for years after losing technical leadership but recovered because of culture.", "tweet_url": "https://x.com/dylan522p/status/2120942688702996945", "images": [], "type": "thread", "created_at": "2026-11-12T18:11:56.000Z"}, {"author": "0xfoobar", "summary": "Dismisses CFO Colette Kress as successor: 'can't even figure out how to schedule a meeting less than a week out. Already DOA.'", "tweet_url": "https://x.com/0xfoobar/status/2120996720280481832", "images": [], "type": "tweet", "created_at": "2026-11-12T21:46:38.000Z"}, {"author": "Geiger_Capital", "summary": "Surfaces a months-old account of Jensen tearing into his CFO as a 'deer in the headlights' incapable of big decisions, and quips that the upcoming NVIDIA earnings call 'should be fun.'", "tweet_url": "https://x.com/Geiger_Capital/status/2121078380888019399", "images": ["https://pbs.twimg.com/media/HW-Vi_2XQAAow8A.jpg"], "type": "tweet", "created_at": "2026-11-13T03:11:08.000Z"}, {"author": "SemiAnalysis_", "summary": "Interview quotes on NVIDIA's position: it owns no fab, and its edge is a supply chain that took one product from $1B to $250B — 'a lab is not really capable of ramping a product from a billion to 250 billion dollars.' Compares the perception problem to Apple in 2020. Still concludes share gain against NVIDIA is 'extremely possible, and probably probable now,' with AI-designed chips as the future NVIDIA will fight.", "tweet_url": "https://x.com/SemiAnalysis_/status/2121089985931592022", "images": [], "type": "tweet", "created_at": "2026-11-13T03:57:15.000Z"}, {"author": "AndreasSteno", "summary": "Points out the relative move away from Nvidia was already underway before Jensen's exit, citing Anthropic's S-1; the common requirement of all the listed compute providers is memory.", "tweet_url": "https://x.com/AndreasSteno/status/2120976585742266398", "images": ["https://pbs.twimg.com/media/HW840FvWYAAx5rA.png"], "type": "tweet", "created_at": "2026-11-12T20:26:38.000Z"}, {"author": "ErikVoorhees", "summary": "Pushes back on 'keep him on board' framing: 'he wasn't a random exec at nvidia, he WAS nvidia,' and his 30 years of actions matter more than image. Separately: 'We are becoming more like China every day — protectionism, regulation, central planning,' and the only reason to be proud of America was fidelity to liberty.", "tweet_url": "https://x.com/ErikVoorhees/status/2121032211327865267", "images": [], "type": "tweet", "created_at": "2026-11-13T00:07:40.000Z"}, {"author": "jimcramer", "summary": "After a day talking to investors, leaders and technologists, says he feels 'a lot better' about the changes at NVIDIA than in the morning while 'heartsick' about events. Endorses ('Truth!!') the view that Jensen built a 42k-person company run by brilliant leaders and was not a one-man show. Also flags Cerebras and Cisco beats: 'AI strong away from NVDA.'", "tweet_url": "https://x.com/jimcramer/status/2121025275718783390", "images": [], "type": "tweet", "created_at": "2026-11-12T23:40:07.000Z"}, {"author": "saxena_puru", "summary": "AI stocks recovered their intraday losses after the resignation: 'When stocks stop declining on bad news, worth paying attention.'", "tweet_url": "https://x.com/saxena_puru/status/2120932997788741992", "images": [], "type": "tweet", "created_at": "2026-11-12T17:33:26.000Z"}, {"author": "nic_carter", "summary": "Market color: the stock bounced 10% off the lows ('release another mistress'); jokes about the line being drawn at three mistresses rather than two.", "tweet_url": "https://x.com/nic_carter/status/2120970298107494714", "images": ["https://pbs.twimg.com/media/HW8zPFsX0AAyT48.jpg"], "type": "tweet", "created_at": "2026-11-12T20:01:39.000Z"}, {"author": "amitisinvesting", "summary": "Posts Trump's comments on Jensen: 'He's going through hell. What he feels most badly about is his wife and family… he called me as the president.' Earlier: 'still hard to believe Jensen Huang is not the ceo of Nvidia anymore.'", "tweet_url": "https://x.com/amitisinvesting/status/2121038760817369254", "images": [], "type": "tweet", "created_at": "2026-11-13T00:33:42.000Z"}, {"author": "udiWertheimer", "summary": "Quoting Bloomberg's account of a penitent Jensen calling himself a 'piece of sh--', observes Trump and Elon perfected a style of never apologizing or taking the fall, so no secret can damage their image — 'lesson in there.' Later: 'it's time for jensen to retardmaxx' and 'bro will be back.'", "tweet_url": "https://x.com/udiWertheimer/status/2121062426590519606", "images": [], "type": "thread", "created_at": "2026-11-13T02:07:44.000Z"}, {"author": "Fiskantes", "summary": "Comeback angle: 'Jensen should pull a Steve Jobs 1985–1996.' Also: 'Building trillion dollar hardware companies while maintaining a harem — Elon and Jensen are two of a kind.'", "tweet_url": "https://x.com/Fiskantes/status/2120938932141760838", "images": [], "type": "tweet", "created_at": "2026-11-12T17:57:01.000Z"}, {"author": "andrewchen", "summary": "Three words: 'he'll be back.'", "tweet_url": "https://x.com/andrewchen/status/2121005087288102950", "images": [], "type": "tweet", "created_at": "2026-11-12T22:19:53.000Z"}, {"author": "AndrewCurran_", "summary": "Debunks a circulating 'board letter': it is fake, copied from the OpenAI/Microsoft board coup when Sam Altman was fired.", "tweet_url": "https://x.com/AndrewCurran_/status/2121116358570332339", "images": ["https://pbs.twimg.com/media/HW-4FmJbUAA_Jd3.jpg", "https://pbs.twimg.com/media/HW-4RkNaEAA5rBA.jpg"], "type": "thread", "created_at": "2026-11-13T05:42:02.000Z"}, {"author": "loomdart", "summary": "'In 2021 we had Elon tweets. In 2026 we have Jensen Huang's mistresses.'", "tweet_url": "https://x.com/loomdart/status/2120962326082044254", "images": [], "type": "tweet", "created_at": "2026-11-12T19:29:58.000Z"}, {"author": "lord_fed", "summary": "On the second-employee headline: 'boy how many are gonna come out?'", "tweet_url": "https://x.com/lord_fed/status/2120968535300338089", "images": [], "type": "tweet", "created_at": "2026-11-12T19:54:39.000Z"}, {"author": "Chartfest1", "summary": "Light color: every 'SPY' in a tweet now requires a pause to decide whether it means Huang or the S&P ETF.", "tweet_url": "https://x.com/Chartfest1/status/2120982948295954860", "images": [], "type": "tweet", "created_at": "2026-11-12T20:51:55.000Z"}]}, {"cluster": "Spy Narrative Collapses — Board Haste, Employee Revolt, and 'Who Gains'", "category": ["tech", "geopolitics"], "items": [{"author": "GavinSBaker", "summary": "Quoting a report that the AG ('no conclusions reached'), CIA ('not yet convinced') and DNI ('over-torqued') all decline to confirm Alice Huang was a Chinese spy: 'Absolutely incredible. This is why the board should have waited for their own investigation to finish.' Adds that an internal post urging reinstatement drew 1,600+ comments, the majority in support; 'Shareholders, employees and partners overwhelmingly support Jensen.'", "tweet_url": "https://x.com/GavinSBaker/status/2121094612119126304", "images": [], "type": "thread", "created_at": "2026-11-13T04:15:38.000Z"}, {"author": "Geiger_Capital", "summary": "Responding to Gavin Baker: assumed there must be something to the spy angle or government/intel pressure behind the scenes — 'If it was truly just affairs, why would the board push him out so quickly? And why would Jensen resign?'", "tweet_url": "https://x.com/Geiger_Capital/status/2121099233851785438", "images": [], "type": "tweet", "created_at": "2026-11-13T04:34:00.000Z"}, {"author": "hosseeb", "summary": "The sharpest dissent against the pro-Jensen consensus (long thread). Asks how a secret affair with a customer who is a Chinese spy, plus one with a direct report, is 'completely normal'. Says there is now enormous evidence Megaspeed was smuggling chips to China, that Jensen favored them as a customer, helped quash a DOJ investigation, lied about the relationship, and backchanneled to the administration for China exports. Calls it absurd double-talk to say winning the AI race is critical while also selling China chips. Legal theory: selling to a party you 'should have known' would resell makes you liable, otherwise export laws are toothless — 'Evidence, yes. Proof, no.' Rejects the claim Beijing didn't want US chips as 'laughably false' (links SCMP). On the stock: a company dragged through hearings and investigations will struggle to crush earnings; expects a big re-evaluation of the 'Jensen school of management' which downplayed the bus factor — 'Enter bus.'", "tweet_url": "https://x.com/hosseeb/status/2120961861734769106", "images": [], "type": "thread", "created_at": "2026-11-12T19:28:08.000Z"}, {"author": "Fiskantes", "summary": "Multi-tweet thesis that the ouster is not organic: the news broke via mainstream-media hit pieces rather than firsthand accounts or official investigation; the 'Chinese spy' photos are not new yet surfaced right after midterms and before the Anthropic IPO; if there were no affairs 'they would find other skeletons or fabricate them.' Reads the third-affair leak as a pre-loaded bullet nobody cancelled. Calls it 'the AI equivalent of CZ collapsing FTX', and asks how many people were prosecuted after the Epstein files. On the simultaneous antitrust probe headline: 'Such a coincidence.'", "tweet_url": "https://x.com/Fiskantes/status/2120942167808262620", "images": [], "type": "thread", "created_at": "2026-11-12T18:09:52.000Z"}, {"author": "Fiskantes", "summary": "'Crypto people were scared of Chokepoint 3.0. But crypto is a totally uninteresting tech today. Chokepoint 3.0 is coming — for AI.' Responding to Gavin Baker, argues it is not only China hawks: GPUs for China were already rotting in Hong Kong warehouses, and 'it's a lot about Anthropic's war against OS models' — the biggest vocal proponent of open models being Jensen (links NVIDIA's open-models letter).", "tweet_url": "https://x.com/Fiskantes/status/2120942683741180174", "images": [], "type": "tweet", "created_at": "2026-11-12T18:11:55.000Z"}, {"author": "Fiskantes", "summary": "On the Reuters third-affair exclusive: 'They loaded up a third bullet in case 2 won't be enough and the board will defend Jensen, and then forgot to cancel the shot.'", "tweet_url": "https://x.com/Fiskantes/status/2120979242821562369", "images": ["https://pbs.twimg.com/media/HW87SU2XcAAqGuW.jpg"], "type": "thread", "created_at": "2026-11-12T20:37:12.000Z"}, {"author": "DCinvestor", "summary": "Many had incentives to remove Jensen, but most conspicuous is that he was leading the charge for open-source/open-weight AI at the most senior exec level in the US, likely at the AI labs' expense; not clear anyone is left to do that compellingly — 'this may quite literally go down as a turning point in consumer AI history.' Also flags the 'even worse' scenario: that he was blackmailed into favoring foreign counterparties.", "tweet_url": "https://x.com/DCinvestor/status/2121060055034290431", "images": [], "type": "tweet", "created_at": "2026-11-13T01:58:19.000Z"}, {"author": "Galois_Capital", "summary": "'If this slows the open source SI movement in America, it will be devastating in the long run.'", "tweet_url": "https://x.com/Galois_Capital/status/2121120079148712350", "images": [], "type": "tweet", "created_at": "2026-11-13T05:56:50.000Z"}, {"author": "aleabitoreddit", "summary": "Reuters: senior White House officials are discussing whether Commerce Secretary Lutnick should be pushed out too, over the NVDA controversy and his handling of export controls — 'hard to believe Washington didn't have a role.' Also relays the second-employee report and questions letting NVIDIA's future be decided by board members with Taco Bell and NFL backgrounds.", "tweet_url": "https://x.com/aleabitoreddit/status/2120949820684972421", "images": ["https://pbs.twimg.com/media/HW8gnnnbEAACbuR.jpg"], "type": "tweet", "created_at": "2026-11-12T18:40:17.000Z"}, {"author": "aleabitoreddit", "summary": "Follow-up on the second employee report with the reported images.", "tweet_url": "https://x.com/aleabitoreddit/status/2120964006328566047", "images": ["https://pbs.twimg.com/media/HW8tHEvbcAAp_hj.jpg", "https://pbs.twimg.com/media/HW89sDyasAArYmw.jpg"], "type": "thread", "created_at": "2026-11-12T19:36:39.000Z"}, {"author": "dgt10011", "summary": "Frames the only question that matters — who has the most to gain from Jensen's exit — and points to a story.", "tweet_url": "https://x.com/dgt10011/status/2120942426806522226", "images": ["https://pbs.twimg.com/media/HW8ZyP6W4AEpSs_.png"], "type": "thread", "created_at": "2026-11-12T18:10:54.000Z"}, {"author": "arthur0x", "summary": "Agrees the episode will vastly increase Asian views of America as hypocritical and unjust toward successful Asian founders.", "tweet_url": "https://x.com/arthur0x/status/2121097203389521942", "images": [], "type": "tweet", "created_at": "2026-11-13T04:25:56.000Z"}, {"author": "mrjasonchoi", "summary": "'Doesn't take a genius to figure out why Jensen was actually ousted.'", "tweet_url": "https://x.com/mrjasonchoi/status/2121091855752606199", "images": [], "type": "tweet", "created_at": "2026-11-13T04:04:41.000Z"}, {"author": "DTAPCAP", "summary": "Asks which board members wanted Jensen out and what their motivation was.", "tweet_url": "https://x.com/DTAPCAP/status/2120968856621765038", "images": [], "type": "tweet", "created_at": "2026-11-12T19:55:55.000Z"}, {"author": "zeroxkyle", "summary": "'Most people stop at money. It's never about money. Money is just a proxy for power.' The argument that 'they won't do this because the market will crash' fails because money can be remade while power is cemented.", "tweet_url": "https://x.com/zeroxkyle/status/2121124817042899400", "images": [], "type": "tweet", "created_at": "2026-11-13T06:15:39.000Z"}, {"author": "that1618guy", "summary": "Shares a video he reads as evidence the tides shifted with the midterm power shift; finds it hard to believe the North Korea Binance hack landed at the same time — 'something big is happening behind the scenes.' Also notes the DOJ seized $1.2B from North Korea tied to the $6B Binance hack ('Buyback and burn?').", "tweet_url": "https://x.com/that1618guy/status/2121013616078151969", "images": [], "type": "thread", "created_at": "2026-11-12T22:53:47.000Z"}]}, {"cluster": "Washington Moves — OpenAI–Anthropic Export-Control Alliance, Tim Scott Hearing, Lutnick", "category": ["regulation", "geopolitics"], "items": [{"author": "AndrewCurran_", "summary": "'The Houses of Altman and Amodei have forged an alliance': OpenAI joins Anthropic in backing bipartisan chip export controls to China, aiming to pass legislation before year-end (per Bloomberg, expected to ride the must-pass defense bill). Quoted context: 'The old ways are gone with Jensen.'", "tweet_url": "https://x.com/AndrewCurran_/status/2121003182931542309", "images": ["https://pbs.twimg.com/media/HW9RJ6ObcAAqBX0.jpg"], "type": "thread", "created_at": "2026-11-12T22:12:19.000Z"}, {"author": "AndrewCurran_", "summary": "Senator Tim Scott's letter requesting Jensen Huang voluntarily appear before the Senate Banking Committee for a public hearing on December 3, 2026 — and a parallel letter to Commerce Secretary Lutnick.", "tweet_url": "https://x.com/AndrewCurran_/status/2121034522334765333", "images": ["https://pbs.twimg.com/media/HW9tqC6aAAIPzB-.jpg", "https://pbs.twimg.com/media/HW9tqbwbEAALp8n.jpg", "https://pbs.twimg.com/media/HW9uCbGakAE20d2.jpg", "https://pbs.twimg.com/media/HW9uEtiaYAAi_Ms.jpg"], "type": "thread", "created_at": "2026-11-13T00:16:51.000Z"}, {"author": "cryptopunk7213", "summary": "On OpenAI backing the GPU export push: '1. cut off china. 2. kill open source. 3. win.'", "tweet_url": "https://x.com/cryptopunk7213/status/2121036436451324139", "images": [], "type": "tweet", "created_at": "2026-11-13T00:24:28.000Z"}, {"author": "Bluntz_Capital", "summary": "Quoting the 'targeted takedown' reading (Jensen out, OpenAI/Anthropic alliance 12 hours later): 'dont drink the openai and anthropic coolaid.'", "tweet_url": "https://x.com/Bluntz_Capital/status/2121043626285556171", "images": ["https://pbs.twimg.com/media/HW92BdvbsAIUxND.png"], "type": "thread", "created_at": "2026-11-13T00:53:02.000Z"}, {"author": "PalmerLuckey", "summary": "DISAGREES with hosseeb's reading: 'China doesn't want Nvidia to sell chips to China' — in fact the opposite (links). hosseeb says Beijing has constantly advocated for US chip exports; Fiskantes sides with Luckey, citing GPUs rotting in HK warehouses.", "tweet_url": "https://x.com/PalmerLuckey/status/2121067365752606767", "images": [], "type": "thread", "created_at": "2026-11-13T02:27:22.000Z"}, {"author": "PeterDiamandis", "summary": "Moonshots recap: NVIDIA under investigation for allegedly funneling $8B in GPUs to China, 'perhaps handing Congress a national security excuse to come after the entire AI industry'; Anthropic roadshow at $1.3T; a thousand AI agents proved Fermat's Last Theorem in 30 hours; Elon says 20–30M robots could outproduce every working American; Delaware drafting a law to let AIs run companies; Fable 5.2 scored 16.4% on GDPX, 30% ahead of Opus 5.5, and designed working chip circuits to Verilog; SpaceX tracking $100B revenue by December with $500B–1T possible next year; AI autonomy horizons doubling every 2 months; Emad predicts security clearances for frontier-lab researchers and a ban on Chinese models in regulated industries.", "tweet_url": "https://x.com/PeterDiamandis/status/2120978481324470746", "images": [], "type": "thread", "created_at": "2026-11-12T20:34:10.000Z"}]}, {"cluster": "Will DePue's Forensics — Chinese Labs Trained on Banned Blackwell", "category": ["AI", "geopolitics"], "items": [{"author": "AndrewCurran_", "summary": "Relays Will DePue's report: forensic evidence that DeepSeek, Moonshot, MiniMax and Ant Group built their newest models on NVIDIA Blackwell chips barred from export to China (four screenshots).", "tweet_url": "https://x.com/AndrewCurran_/status/2120993976358731906", "images": ["https://pbs.twimg.com/media/HW9IyAXagAAPdRm.jpg", "https://pbs.twimg.com/media/HW9JWuIaMAAT99L.jpg", "https://pbs.twimg.com/media/HW9JfS2aoAAociM.jpg", "https://pbs.twimg.com/media/HW9Jt8YbAAA9MCY.jpg"], "type": "thread", "created_at": "2026-11-12T21:35:44.000Z"}, {"author": "nicbstme", "summary": "Finds it fascinating that model weights can carry a trace of the GPU that initialized them — DePue reproduced entire rows of DeepSeek v4 flash on a B300. Notes DeepSeek hasn't hidden much: the FlashMLA README lists 'NVIDIA SM100 / SM103' (Blackwell) and Hopper support was deleted at end of September; searching 'SM100' across DeepSeek and Moonshot repos shows many hints. Guesses they rent GB300 on neoclouds.", "tweet_url": "https://x.com/nicbstme/status/2121012461944095170", "images": [], "type": "thread", "created_at": "2026-11-12T22:49:12.000Z"}, {"author": "dylan522p", "summary": "Complementary but dismissive of the 'discovery': one can just read the code Moonshot and DeepSeek open-sourced and see it is Blackwell-only; SemiAnalysis has been talking about GPU smuggling for years.", "tweet_url": "https://x.com/dylan522p/status/2121002286470369669", "images": [], "type": "thread", "created_at": "2026-11-12T22:08:46.000Z"}, {"author": "abcampbell", "summary": "Asks what the evidence of IP theft is — 'chips you had to already assume was happening.' Also asks who makes the best American open-source models.", "tweet_url": "https://x.com/abcampbell/status/2120961304299278769", "images": [], "type": "tweet", "created_at": "2026-11-12T19:25:55.000Z"}]}, {"cluster": "Anthropic IPO — Six Times Oversubscribed, $1.3–1.4T Roadshow", "category": ["AI", "macro"], "items": [{"author": "biancoresearch", "summary": "'Maybe the AI bubble is NOT popping' — Anthropic's IPO is said to be about six times oversubscribed.", "tweet_url": "https://x.com/biancoresearch/status/2120985585200582753", "images": [], "type": "tweet", "cr acked — 46,000 Employee Records, 3 BTC Ransom", "category": ["tech", "geopolitics"], "items": [{"author": "AndrewCurran_", "summary": "TSMC has been hacked: employee personal data (past and present) posted online; TSMC believes its cloud provider was breached and says no evidence internal operational systems were affected. The hacker claims 6.9GB containing 46,000 employee records — addresses, bank account numbers, emergency contacts — and demands 3 BTC or the data is released.", "tweet_url": "https://x.com/AndrewCurran_/status/2121053887398601075", "images": ["https://pbs.twimg.com/media/HW9_RSoaAAAd4kP.jpg", "https://pbs.twimg.com/media/HW-w32eaAAAAnJh.jpg", "https://pbs.twimg.com/media/HW-18TTbEAAqBj3.jpg"], "type": "thread", "created_at": "2026-11-13T01:33:48.000Z"}]}, {"cluster": "Crypto Capitulation — BTC Breaks $70K, Binance Hole, ETF Outflows", "category": ["crypto"], "items": [{"author": "Geiger_Capital", "summary": "'Bitcoin dropping like a rock' — just broke below $70,000 (chart). Follow-up joke: 'The CEO of bitcoin had an affair.'", "tweet_url": "https://x.com/Geiger_Capital/status/2121079865671668090", "images": ["https://pbs.twimg.com/media/HW-W5cXXAAARr70.jpg"], "type": "tweet", "created_at": "2026-11-13T03:17:02.000Z"}, {"author": "krugermacro", "summary": "'Looks like a $300M BTC long just capitulated.' Earlier: 'this is not normal price action and something is wrong, and being obsessed with bitcoin has a lot to do with it.'", "tweet_url": "https://x.com/krugermacro/status/2121122251839840593", "images": [], "type": "tweet", "created_at": "2026-11-13T06:05:28.000Z"}, {"author": "Evan_ss6", "summary": "BTC ETF flows are negative on both a trailing one-month and trailing-twelve-month basis, despite the recent change allowing spot holders to convert to ETF shares; flows peaked in October 2025 along with price. 'ETH is even worse.' Separately: people are calling for the Fed to step in while SPY is 2.5% off ATH and up 12% YTD.", "tweet_url": "https://x.c 989981577793595", "images": ["https://pbs.twimg.com/media/HW9FG5XXQAAVY6v.jpg"], "type": "tweet", "created_at": "2026-11-12T21:19:52.000Z"}]}, {"cluster": "Trump–Xi at APEC Shenzhen, Nov 18–19 — Chips on the Table", "category": ["geopolitics", "tech"], "items": [{"author": "SemiAnalysis_", "summary": "Trump says he will be in Shenzhen for APEC Nov 18–19 and is expected to meet Xi; chips and AI safety are the issues to watch. SemiAnalysis mapped the host city's chip supply chain: 67 companies from EDA/IP to fabs, tools and materials; Shenzhen's IC industry booked RMB 361B revenue in 2025, up 27%, with design 67% of it.", "tweet_url": "https://x.com/SemiAnalysis_/status/2121020384757559698", "images": ["https://pbs.twimg.com/media/HW9gzITXcAEqskB.jpg"], "type": "tweet", "created_at": "2026-11-12T23:20:41.000Z"}]}, {"cluster": "Iran MOUs and the Middle East — 'Deals Appear When Markets Need Stabilizing'", "category": ["geopolitics", "energy"], "items": [{"author": "zriboua", "summary": "Takes a 'different and lonely camp': the Iran MOUs and deals appeared every time the market needed stabilizing; deals with Iran are structurally impossible; Trump did not 'trust' Vance but deliberately pushed the deal track, as in the Trump-1 maximum-pressure campaign. Follow-up: the US is first and foremost a financial empire — anything in the Middle East raises general economic-crisis risk, which is why no president has tackled it once and for all. The MOUs 'played their part in avoiding a financial disaster despite the hysteria. They were never going to be implemented anyway.'", "tweet_url": "https://x.com/zriboua/status/2121081791113056555", "images": [], "type": "thread", "created_at": "2026-11-13T03:24:41.000Z"}, {"author": "zriboua", "summary": "More leaders across the Arab and Muslim world want to normalize ties with Israel while in Europe more talk of boycotting or even war with it — 'what a time to be alive.'", "tweet_url": "https://x.com/zriboua/status/2120976080693813499", "images": ["https://pbs.twimg.com/media/HW84gRlW4AAfFwC.jpg"], "type": "tweet", "created_at": "2026-11-12T20:24:38.000Z"}]}], "B_insights": [{"author": "RaoulGMI", "summary": "GDP grows only three ways: more people, more debt, or more productivity. Demographics were set 30 years ago and the workforce is shrinking; for 15 years the gap was filled with borrowing until 'we're now borrowing to pay the interest on the borrowing' — the debasement everyone feels but can't name — and that lever is spent too. That leaves productivity, which has always meant people producing more, so with fewer workers the only step change is machines. AI and robotics are therefore not a nice-to-have but the one lever left to outgrow the debt rather than inflate it away. What changes is who value flows to — whoever owns the networks: 'if the robots are coming for our jobs, then we had bloody well better own the robots.' Follow-up: introducing the greatest intelligence ever into the economy makes inflation, GDP and money stop meaning what they used to — the 'Economic Singularity', transition starting ~2030, so about four years to position; AI, biotech and energy all going exponential at once.", "tweet_url": "https://x.com/RaoulGMI/status/2121001357918249193", "images": ["https://pbs.twimg.com/media/HW9PXpgXQAEKeUw.jpg"], "type": "thread", "created_at": "2026-11-12T22:05:04.000Z", "category": "macro"}, {"author": "Bluntz_Capital", "summary": "'Intelligence will 100x, inference will 100x, compute will 100x, robots will 100x.' The intelligence sphere is like getting into BTC in 2017: you missed the first innings and it's having its first real pullback, but there is a solid decade ahead.", "tweet_url": "https://x.com/Bluntz_Capital/status/2121105400380764240", "images": [], "type": "tweet", "created_at": "2026-11-13T04:58:30.000Z", "category": "AI"}, {"author": "saxena_puru", "summary": "Given uncertainty from the Dem sweep, tightening credit and rising yields, profitable, high-margin, FCF-positive companies with strong balance sheets should outperform during a multi-month AI rally — 'the era of everything flying together is likely over.' Notes they do not own NVDA.", "tweet_url": "https://x.com/saxena_puru/status/2121087705274835011", "images": [], "type": "thread", "created_at": "2026-11-13T03:48:11.000Z", "category": "positioning"}, {"author": "0x_Kun", "summary": "On personal positioning for the AI era: the only arb left for the average person is separating income from the local economy (earn dollars, live elsewhere); beyond that one can only cut costs. On jobs, the last to be replaced are dexterity-heavy trades (plumbing) and regulatory moats (teachers). Side hustles: flipping on FB marketplace beats Uber, which automation replaces first. Investing has clear asset classes; people are more complex given family and skills.", "tweet_url": "https://x.com/0x_Kun/status/2121099141149511753", "images": [], "type": "tweet", "created_at": "2026-11-13T04:33:38.000Z", "category": "society"}, {"author": "citrini", "summary": "Pushing back on the AI-productivity bull case for the economy: the bear case is that most displaced jobs have been outsourced and an entire economy cannot pivot on a dime; open to flipping but wants evidence.", "tweet_url": "https://x.com/citrini/status/2120944663007731751", "images": [], "type": "tweet", "created_at": "2026-11-12T18:19:47.000Z", "category": "macro"}, {"author": "cryptopunk7213", "summary": "'Anthropic is eating every software company': Claude Meetings joins video calls and builds documents, spreadsheets, decks, prototypes and designs in real time; alone it kills Wispr Flow, Fireflies and dictation players, and combined with last week's Claude Office release 'they've replicated 80% of the average white-collar worker role.' Separately, Self-hosted Claude Managed Agents (private beta) lets enterprises run the agent harness in their own cloud/on-prem with their proprietary data and switch models via API — 'anthropic coming for open source.'", "tweet_url": "https://x.com/cryptopunk7213/status/2120976838142926985", "images": [], "type": "thread", "created_at": "2026-11-12T20:27:38.000Z", "category": "AI"}, {"author": "PeterDiamandis", "summary": "When a human expert dies, decades of experience die with them; AI agents now keep every lesson and spend downtime auditing and fixing their own memories — 'expertise just became immortal', per Anthropic research. Most companies have no idea what that does to them.", "tweet_url": "https://x.com/PeterDiamandis/status/2121000850608844926", "images": [], "type": "tweet", "created_at": "2026-11-12T22:03:03.000Z", "category": "AI"}, {"author": "SemiAnalysis_", "summary": "Inference benchmarks: Inferact and vLLM optimized DeepSeek-V4.1-Flash on Vera Rubin NVL72, reaching 58x the throughput of GB300 NVL72 at 1.7M tokens/s/GPU and 387 tokens/s/user on AgentX (2.52M tokens/s/GPU at peak). Separately, SGLang-Neuron v0.1.0 is open source: SGLang's serving stack now runs on AWS Trainium2, co-developed with Annapurna Labs.", "tweet_url": "https://x.com/SemiAnalysis_/status/2121014081075159335", "images": [], "type": "tweet", "created_at": "2026-11-12T22:55:38.000Z", "category": "tech"}, {"author": "VitalikButerin", "summary": "If we take seriously a 'cybersecurity apocalypse' in 2027, coin thefts will rise and prudence should exceed plans from six months ago. Privacy-pools tech is a good keyhole solution that makes thieves' lives much harder (possibly with a 24h deposit delay and small rejection fee) without backdoors — 'No backdoors is the line that is defensible as an absolute.' Long term, everyone needs much safer coin storage formats.", "tweet_url": "https://x.com/VitalikButerin/status/2121112206389735643", "images": [], "type": "tweet", "created_at": "2026-11-13T05:25:33.000Z", "category": "crypto"}, {"author": "brian_armstrong", "summary": "Onchain equities momentum: $5B DEX volume for tokenized stocks 'and counting'; stock carry trades growing on Base. WazzCrypto adds: $60M of NVIDIA traded onchain on Solana in 24h, more than the next four chains combined.", "tweet_url": "https://x.com/brian_armstrong/status/2121024322018087158", "images": [], "type": "tweet", "created_at": "2026-11-12T23:36:19.000Z", "category": "crypto"}, {"author": "WazzCrypto", "summary": "Relays SolanaFloor: $60M of NVIDIA traded onchain on Solana in 24h, more than the next four chains combined — 'big if true.'", "tweet_url": "https://x.com/WazzCrypto/status/2120965470958629179", "images": [], "type": "tweet", "created_at": "2026-11-12T19:42:28.000Z", "category": "crypto"}, {"author": "AndrewCurran_", "summary": "Google has added 'Hydrogen' and 'Carbon' to Search AI Mode. Also notes xAI launched a 'Daybreak Red Team'.", "tweet_url": "https://x.com/AndrewCurran_/status/2121118053937373217", "images": ["https://pbs.twimg.com/media/HW-5oTSacAAFbZ2.jpg"], "type": "tweet", "created_at": "2026-11-13T05:48:47.000Z", "category": "AI"}, {"author": "Geiger_Capital", "summary": "Microsoft Outlook has been down all afternoon (screenshot).", "tweet_url": "https://x.com/Geiger_Capital/status/2120985794647396355", "images": ["https://pbs.twimg.com/media/HW9BVtnWIAA7Gzx.jpg"], "type": "tweet", "created_at": "2026-11-12T21:03:14.000Z", "category": "tech"}, {"author": "RayDalio", "summary": "Principle of the day: someone other than you should objectively measure and report your progress; many creative people who are poor at execution succeed by forging symbiotic relationships with highly reliable task-doers.", "tweet_url": "https://x.com/RayDalio/status/2120940389074911420", "images": ["https://pbs.twimg.com/media/HW8YCs1XYAEiY9N.png"], "type": "tweet", "created_at": "2026-11-12T18:02:48.000Z", "category": "society"}, {"author": "marcvanderchijs", "summary": "Congratulates Mondrio on a $3.75M round led by Heartcore Capital to build agentic pricing management.", "tweet_url": "https://x.com/marcvanderchijs/status/2121086151494869426", "images": [], "type": "tweet", "created_at": "2026-11-13T03:42:01.000Z", "category": "AI"}, {"author": "Melt_Dem", "summary": "Says she has been investing in AI 'control layer' companies, endorsing a thesis on that layer.", "tweet_url": "https://x.com/Melt_Dem/status/2121003808071233715", "images": [], "type": "tweet", "created_at": "2026-11-12T22:14:48.000Z", "category": "AI"}, {"author": "0xQuit", "summary": "NFT corner: the Chikins mint on Abstract is explicitly a game of chicken around Abstract's scheduled closure on December 15 — minters get an egg and can 'flee the coop' from December 8. Also mourns Squeakchain ('RIP… hope Pillhead launches the project').", "tweet_url": "https://x.com/0xQuit/status/2120968474222805084", "images": [], "type": "thread", "created_at": "2026-11-12T19:54:24.000Z", "category": "crypto"}, {"author": "mfigge", "summary": "Reworked the BAYC website around three pillars — IRL, style, story — with a world map so members can find or organize local meetups starting with the holidays.", "tweet_url": "https://x.com/mfigge/status/2120997536429375674", "images": [], "type": "thread", "created_at": "2026-11-12T21:49:53.000Z", "category": "crypto"}, {"author": "hooeem", "summary": "Creator-economy playbook: a 17-image '90-day plan' thread on how he made $200k from X, posted now that X allows 20-image uploads. Self-promotional; included for completeness.", "tweet_url": "https://x.com/hooeem/status/2121022369644847559", "images": ["https://pbs.twimg.com/media/HW9imVKWQAA6JCp.jpg", "https://pbs.twimg.com/media/HW9imVMXUAAApvn.jpg", "https://pbs.twimg.com/media/HW9imU8XIAAnEQP.jpg", "https://pbs.twimg.com/media/HW9imVCW4AAvWsi.jpg", "https://pbs.twimg.com/media/HW9imVIWIAAQRSu.jpg", "https://pbs.twimg.com/media/HW9imVDXUAAZT_P.jpg", "https://pbs.twimg.com/media/HW9imW6WEAAUWI9.jpg", "https://pbs.twimg.com/media/HW9imVDWAAAJAUi.jpg", "https://pbs.twimg.com/media/HW9imVPWMAAnmED.jpg", "https://pbs.twimg.com/media/HW9imVIWAAAjolb.jpg", "https://pbs.twimg.com/media/HW9imVLWQAAXTYA.jpg", "https://pbs.twimg.com/media/HW9imVJWIAAiWA0.jpg", "https://pbs.twimg.com/media/HW9imVJWoAAqRV2.jpg", "https://pbs.twimg.com/media/HW9imVHXwAApAI2.jpg", "https://pbs.twimg.com/media/HW9imVKWsAAc1vW.jpg", "https://pbs.twimg.com/media/HW9imVLXgAA5wuO.jpg", "https://pbs.twimg.com/media/HW9imVGWIAAbQHv.jpg"], "type": "tweet", "created_at": "2026-11-12T23:28:34.000Z", "category": "society"}], "C_contrarian": [{"author": "ZeeContrarian1", "summary": "CONTRARIAN (crypto): 'You will never see another Bitcoin all-time high in your lifetime.' The reported $6.3B Binance hack marked the end of an era; BTC below $70K; fiat at least doesn't risk losing all savings overnight to a hack; Bitcoin has no meaningful use case and self-custody is cash under the mattress, while SpaceX, AI and other technologies offer far better opportunities. Not calling zero — 'I'm saying it will never make a new high.' On the 20-year pattern objection: patterns are unreliable in technology; Bitcoin failed to evolve into a payment system and 'what doesn't evolve, devolves.'", "tweet_url": "https://x.com/ZeeContrarian1/status/2121092362889723970", "images": ["https://pbs.twimg.com/media/HW-iQvLXsAAiajR.jpg"], "type": "thread", "created_at": "2026-11-13T04:06:41.000Z", "category": "crypto"}, {"author": "sjdedic", "summary": "CONTRARIAN (bullish into the wash-out): lists everything already priced into BTC and crypto — hawkish Fed, hot inflation, rising yields, stronger dollar, shrinking stablecoin supply; post-midterm regulatory risk with Democrats controlling Congress; cyber/quantum risk with the biggest hack in history at Binance; the bloated AI trade starting to unwind. 'Hard to imagine it getting much worse, but things are rarely as bad as they seem.' Impressed by how much strength crypto shows: 'The window of max opportunity is right now. Take it or leave it.'", "tweet_url": "https://x.com/sjdedic/status/2120965182528561262", "images": [], "type": "tweet", "created_at": "2026-11-12T19:41:19.000Z", "category": "crypto"}, {"author": "hosseeb", "summary": "CONTRARIAN (vs the pro-Jensen consensus): the only prominent voice in this set arguing the ouster is justified — Megaspeed smuggling evidence, favoritism, quashed DOJ probe, and 'absurd double-talk' on winning the AI race while selling China chips. See full summary in Section A.", "tweet_url": "https://x.com/hosseeb/status/2120961861734769106", "images": [], "type": "thread", "created_at": "2026-11-12T19:28:08.000Z", "category": "tech"}, {"author": "PalmerLuckey", "summary": "CONTRARIAN (vs 'China wants our chips'): China does not want Nvidia selling chips into China — the opposite. Directly contradicts hosseeb's claim that Beijing constantly lobbied for exports.", "tweet_url": "https://x.com/PalmerLuckey/status/2121067365752606767", "images": [], "type": "thread", "created_at": "2026-11-13T02:27:22.000Z", "category": "geopolitics"}, {"author": "zriboua", "summary": "CONTRARIAN (self-described 'lonely camp' on Iran): the MOUs were market-stabilization devices never meant to be implemented; deals with Iran are structurally impossible; Vance was deliberately pushed forward rather than trusted.", "tweet_url": "https://x.com/zriboua/status/2121081791113056555", "images": [], "type": "thread", "created_at": "2026-11-13T03:24:41.000Z", "category": "geopolitics"}, {"author": "Evan_ss6", "summary": "CONTRARIAN (vs Fed-rescue calls): people are calling for the Fed to step in while SPY is only 2.5% off all-time highs and up 12% YTD; a call for a meltdown, not a rescue, would be the bottom signal.", "tweet_url": "https://x.com/Evan_ss6/status/2121029511806624061", "images": [], "type": "tweet", "created_at": "2026-11-12T23:56:57.000Z", "category": "macro"}, {"author": "biancoresearch", "summary": "CONTRARIAN (vs 'AI bubble popping'): a six-times-oversubscribed Anthropic IPO suggests the bubble is not popping.", "tweet_url": "https://x.com/biancoresearch/status/2120985585200582753", "images": [], "type": "tweet", "created_ // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
