drawdown hurts more than the run-up helped.", "items": [{"source_id": "ubs", "source_name": "UBS", "thesis": "UBS: with Brent ~$105.5/bbl and the 10-year just shy of 5%, global equities are only 1.9% below their August all-time high and the S&P 500 less than 3% off its record. UBS forecasts S&P 500 earnings +25% in 2026 and +14% in 2027, and Eurozone earnings +15% in both years; valuations have de-rated on higher earnings, making stocks less vulnerable to a yield-driven correction. Supporting data points: Oracle cloud sales +121%, TSMC August revenue +53% y/y and a record; US factory activity in expansion for 8 straight months; Eurozone August manufacturing PMI the strongest in over four years.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-11092026.html", "images": []}, {"source_id": "goldman_sachs", "source_name": "Goldman Sachs", "thesis": "Goldman (Shugar): the S&P trades on a 19x P/E - the 10-year average - after ~30% Q2 earnings growth, so 'if you and I are sitting here at year-end or we're sitting here next year, we're talking about an S&P that's probably well over 8,000.' Near-term, momentum has been very weak for two months and CTA/systematic flows are against you. He likes experiential consumer names (cruise, events, high-end) where most consumer stocks trade 30%+ below 52-week highs, is cautious on companies exposed to consumer AI agents (e.g. easy plan-switching), and sees AI 'picks and shovels' and semis trading well below market multiples as a temporary air pocket.", "url": "https://www.goldmansachs.com/insights/the-markets/what-a-fed-rate-hike-could-mean-for-us-stocks", "images": []}, {"source_id": "ubs", "source_name": "UBS", "thesis": "UBS: the rally is broadening - the equal-weighted S&P 500 is +13.9% YTD versus the tech-heavy Nasdaq Composite +12.8%, the median S&P 500 company beat Q2 estimates by ~5.5% (vs a ~3.6% average since 2015), and European Q2 earnings growth accelerated to 22%. Because nearly 40% of its self-managed equity investors hold over half their equity portfolio in 10 stocks or fewer, UBS pitches capital-preservation structures - relatively low implied vol cheapens the options and higher short-end yields cheapen zero-coupon floors - to stay invested while capping drawdowns.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-03092026.html", "images": []}, {"source_id": "bnp_paribas", "source_name": "BNP Paribas", "thesis": "BNP Paribas AM (Iggo) on the equity/bond gap: since end-2023 MSCI World has returned ~62% total return versus about 4% for the global aggregate bond index, and convertibles are up ~14% in 2026. His conclusion: with AI-world earnings growing 20%+ a year, above-target inflation does not matter much to equity holders - 'the noise around bonds will remain negative while the dream of a world made better by AI will keep equities outperforming.'", "url": "https://viewpoint.bnpparibas-am.com/view-from-the-markets-tightening-again/", "images": []}, {"source_id": "t_rowe_price", "source_name": "T. Rowe Price", "thesis": "Asset Allocation Committee maintains a modest overweight to equities with a buy-the-dip approach. Likes small/mid caps and US growth, prefers EM over ex-US developed, holds overweight international value as AI-selloff diversification. Bear case: unresolved Middle East and Ukraine wars, a meaningful share of global refining capacity offline creating a diesel/refined-products squeeze (watch crack spreads), and a potential combined inflation and rate shock. Bull case: de-escalation could take oil into the $50/bbl range next year. Forward 12m P/E for the S&P 500 Semiconductor & Semiconductor Equipment group fell from 31 to 19 over the year to 31 July 2026 as growth decelerated — a healthy reset.", "url": "https://www.troweprice.com/en/us/insights/Why-the-bull-case-is-still-in-play-for-equity-markets", "images": []}, {"source_id": "blackrock_investment_institute", "source_name": "BlackRock Investment Institute", "thesis": "Russ Koesterich: momentum still works because price momentum currently reflects earnings momentum. 3-month changes in earnings expectations strongest in technology, energy and communications; SOX expected to deliver over 100% earnings growth in 2026. The June/early-July momentum crash (long/short baskets -20%+) was overcrowding and levered tech ETFs, not fundamentals, and those drivers have largely corrected. Risks: a melt-up in rates or a broad equity downturn, since the basket is geared to expansion and is more volatile than the market.", "url": "https://www.blackrock.com/us/individual/insights/momentum-can-still-work", "images": []}, {"source_id": "amundi", "source_name": "Amundi", "thesis": "Amundi equities: earnings revisions have risen to levels usually seen in recovery phases with wide single-stock dispersion. Strategically cautious on the US (valuations, concentration); long-term positive Europe (earnings, strategic autonomy, attractive valuations, light positioning, banks and cyclicals well placed); more constructive Japan including small/mid caps exposed to onshoring, supply-chain resilience, defence, AI and infrastructure; neutral China (overcapacity, gradual consumption support, anti-involution drive will take time); Brazil downside limited if Lula wins in October but notable upside if he loses.", "url": "https://research-center.amundi.com/article/global-investment-views-september-2026", "images": []}, {"source_id": "invesco", "source_name": "Invesco", "thesis": "Invesco's de-concentration pitch with hard numbers: the smallest 50 companies in the S&P 500 are about 1% of the index but from 2004-2025 outperformed the largest 50 by 4%; mid caps are 19% of US equity market cap but only 8% of US equity investor assets. Products offered: S&P 500 Equal Weight ETF (RSP) and a mid-cap value fund (VVOIX).", "url": "https://www.invesco.com/us/en/Individual-investor/compelling-wealth-management-conversations.html", "images": []}, {"source_id": "pimco", "source_name": "PIMCO", "thesis": "PIMCO's equity caution is the mirror of its bond case: common equity valuation measures are near multi-decade highs, the relationship between equity valuations and future returns is weak, and unusually high US index concentration in a small group of tech-exposed companies means investors accept full equity downside and concentration risk for limited incremental expected return over high quality bonds.", "url": "https://www.pimco.com/us/en/insights/welcome-back-balanced-portfolio", "images": []}, {"source_id": "rbc", "source_name": "RBC Capital Markets", "thesis": "Consumer staples' premium to the S&P 500 has eroded for 20+ years and the sector now trades at a discount to the market - not seen since the late-1990s internet bubble - implying the market prices lower earnings power than company guidance. Drivers: the K-shaped economy (top 10% of earners ~half of US spending, a record), GLP-1s reshaping categories, AI disrupting labour and sentiment, and the 'Eighth Continent' of YouTube (2.7bn monthly users) and TikTok (1.7bn) dictating physical-world brand outcomes. Prescription: barbell portfolios, SKU reduction and occasion-based shelf sets, creator revenue-sharing, abandon long-term financial algorithms - 70-80% of market cap is terminal value.", "url": "https://www.rbccm.com/en/insights/2026/08/the-great-recalibration-what-comes-next-for-consumer-staples", "images": []}, {"source_id": "standard_chartered", "source_name": "Standard Chartered", "thesis": "Use volatility to add equities, favouring the US and Asia ex-Japan on a robust earnings outlook; week's softness attributed to higher oil and yields rather than earnings. S&P 500 next interim resistance at 7,746 (as of 10 September close), with proprietary market-diversity indicators normalised across asset classes.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-11-9-2026/?mvog=1", "images": []}, {"source_id": "oxford_economics", "source_name": "Oxford Economics", "thesis": "2027 outlook (9 Sep): global GDP growth moves back into a 2.8-3.0% range, with Oxford 'relatively upbeat' on the US versus consensus but not on other majors. It has marked 2027 forecasts down because risks that oil market stress or a disorderly end to the AI boom could end the cycle are growing — though it is 'too soon' to say the world is near recession, and a major downturn would need a trigger.", "url": "https://www.oxfordeconomics.com/resource/2027-economic-outlook-resilience-to-continue-but-the-risks-are-building/", "images": []}, {"source_id": "oxford_economics", "source_name": "Oxford Economics", "thesis": "US wealth effects (9 Sep): a dollar of extra stock wealth boosts spending by 4 cents and a dollar of housing wealth by 2 cents, with discretionary and big-ticket spending far more sensitive than essentials. Positive wealth effects have added an average of 0.4pp to consumer spending growth in this expansion; as stock-wealth gains slow, that contribution wanes — and the effect is asymmetric, with declines biting harder than gains helped. AI is the biggest wildcard for household wealth.", "url": "https://www.oxfordeconomics.com/resource/us-wealth-effects-are-a-major-swing-factor-for-the-consumer-outlook/", "images": []}, {"source_id": "jpmorgan", "source_name": "JPMorgan", "thesis": "J.P. Morgan (Eddie Byun, Global Head of Tech ECM; Jack Atherton, ECM Market Intelligence): global ECM YTD ~$800bn, +75% y/y, with the US over half and +100%+; US equity issuance $430bn YTD across IPOs, follow-ons and equity-linked versus ~$200bn at the same point last year, already on track to exceed 2021's $458bn record. US IPO proceeds are $162bn versus $152bn for all of 2021. Because US market cap has grown from ~$60trn to ~$80trn, the same 26bp relative issuance rate implies the market should support well over $200bn. Mega-deals: SpaceX (largest IPO ever), SK Hynix (largest foreign issuer IPO ever), Intel (largest follow-on ever) and Alphabet's cumulative $90bn raise. Nearly 60% of 2026 equity issuance has been AI or AI-adjacent; the top 10 S&P 500 companies are now nearly 40% of the index.", "url": "https://www.jpmorgan.com/insights/podcast-hub/making-sense/tech-equity-capital-markets", "images": []}, {"source_id": "barclays", "source_name": "Barclays", "thesis": "Barclays Investment Bank: UK public M&A is at levels not seen since 2018, with the UK now ~35% of European public M&A activity. UK corporate public M&A volumes are up 75% versus full-year 2025 and sponsor public-to-private volumes up 97%; inbound UK public M&A more than doubled y/y from $38bn to $77bn. Barclays has advised on 10 UK public M&A transactions over GBP1bn this year and reports 'greater conviction, more competitive situations and increasingly assertive tactics' - notably large unsolicited 'bear hug' approaches with public pressure campaigns. Most active sectors: financial services, industrials and business services; the proportion of UK-listed companies subject to takeover offers is higher than in most other major European markets.", "url": "https://www.ib.barclays/content/barclaysmicrosites/ibpublic/en/our-insights/3-point-perspective/uk-public-m-and-a-five-questions-clients-are-asking-in-2026.html", "images": []}]}, {"theme": "Growth, the US Consumer and Recession Risk", "category_tags": ["growth", "equities"], "consensus": "The consumer is holding up and nobody in the report forecasts a recession. UBS cites resilient activity, unemployment at ~4.1% in a 4.1-4.3% range and nominal growth of 6.5-7%; Bank of America Institute finds consumer financial health 'solid', with the share of households paying credit card bills in full each month rising, little sign of accelerated savings drawdown, small business hiring +21% y/y in July and small business profits at their highest level this year. Ned Davis Research has the US expansion intact through Q2 2026, with headline GDP dragged by trade and inventories while underlying private demand strengthened on strong corporate profits and AI-driven capex. BCA's Bank Credit Analyst team recommends maintaining benchmark allocations to equities and other risk assets because 'the post-pandemic expansion remains intact amid balanced growth', with hiring reviving to roughly 80k a month. Oxford Economics has global GDP back into a 2.8-3.0% range in 2027 and says it is 'too soon to conclude that there's a significant risk that the world economy is on the edge of tipping into a recession.' All name the same headwinds: elevated mortgage rates and housing affordability, high energy prices, and geopolitical instability weighing on sentiment and some capex decisions.", "divergence": "The sharpest counterweight to the strong official payroll print that drove the Fed repricing comes from Bank of America's own deposit data, which estimates payroll growth cooled to 1.5% y/y in August from 1.8% in July — the opposite signal to the +162,000 headline. BofA also reports the long-standing 'K' shape has reversed, with lower-income after-tax wage growth of 4.7% y/y against 3.5% for higher-income and spending growth converging across income groups except at the top 5%, where asset prices support outsized spending; the marginal spending strength is now at the lower-income and Gen Z end, led by independent and regional restaurant operators rather than national chains. That cuts directly against RBC's Nik Modi, who reads Federal Reserve data showing the top 10% of earners account for almost half of total US spending — the highest on record — and against Goldman's tactical preference for high-end experiential consumer names. Moody's Analytics is the most hedged house, with Q3 GDP tracking a 'Subdued' 2% annualised and its recession tracker 'Heating Up'. On Canada the two-handed positioning is explicit and simultaneous: Macquarie's David Doyle underwrites a decade-long structural bull case (US export share down from ~75% in 2024 to 69% while non-US exports rose ~34%, an IMF-estimated +7% real GDP per worker from removing interprovincial barriers, 22+ GW of planned data-centre capacity against 1.6 GW active with Alberta over 90%, defence above 2% of GDP for the first time in nearly four decades en route to NATO's 5% by 2035), while Moody's Analytics cut the Canadian baseline the same week on 'a marked deterioration in US-Canada trade relations' and BCA logged August employment falling 41.7k against +15k expected. Regionally, Oxford has eurozone growth of 1.4% in 2027 on stronger German investment but with limited fiscal and monetary headroom and gas prices the key threat, and has Asia easing 0.4pp to 4.2% with China's housing correction now extended through 2030 — while arguing contrarily that Asia's investment cycles 'will prove more resilient than consensus expects.'", "items": [{"source_id": "bofa", "source_name": "Bank of America", "thesis": "Bank of America Institute (David Tinsley, Taylor Bowley): BofA deposit account data suggests labour market momentum cooled in August, with estimated payroll growth of 1.5% y/y, down from 1.8% in July - a softer read than the official +162,000 print. The 'K' shape has reversed: lower-income households' after-tax wage growth was 4.7% y/y in August versus 3.5% for higher-income households. Job switching has increased and the pay change from a job change hit a three-year high in July, most notably among weekly-paid employees.", "url": "https://institute.bankofamerica.com/economic-insights/monthly-employment-report-august-2026.html", "images": []}, {"source_id": "bofa", "source_name": "Bank of America", "thesis": "Bank of America Institute Consumer Checkpoint: total card spending growth eased to 5.0% y/y in July from 6.3% in June, but mostly on fading one-offs (online promotion timing, World Cup spending) - spending ex-gas still rose 4.3% y/y. The K-shaped consumer is converging across income groups, with the top 5% of earners the exception on strong balance sheets and rising asset prices. Financial health is solid: the share of households paying credit cards in full each month has risen and there is little sign of accelerated savings drawdown.", "url": "https://institute.bankofamerica.com/economic-insights/consumer-checkpoint-august-2026.html", "images": []}, {"source_id": "bofa", "source_name": "Bank of America", "thesis": "Bank of America Institute Small Business Checkpoint: BofA's alternative small business hiring indicator was +21% y/y in July, and NFIB hiring plans reached their highest level since 2022. Small business profits rose in July to their highest level this year, strongest in transportation and manufacturing. Travel spending rose substantially on higher prices and longer trips even as transaction counts rose only modestly.", "url": "https://institute.bankofamerica.com/economic-insights/small-business-checkpoint-august-2026.html", "images": []}, {"source_id": "bofa", "source_name": "Bank of America", "thesis": "Bank of America Institute: restaurant spending and transaction growth both improved meaningfully in 2026, with some food spend shifting from groceries to restaurants on easing restaurant inflation and faster after-tax wage growth. The recovery is led by lower-income households (fastest growth among income groups) and Gen Z (leading all generations by a wide margin), and by independent and regional operators rather than national chains - a direct read-through for restaurant equity dispersion.", "url": "https://institute.bankofamerica.com/economic-insights/restaurants-and-discretionary-spending.html", "images": []}, {"source_id": "ubs", "source_name": "UBS", "thesis": "UBS (Falconio): +161,000 August payrolls with a rising participation rate and unemployment at ~4.1% (in a 4.1-4.3% range for a long period), nominal growth at 6.5-7%, and a resilient consumer - evidence that even after this year's rate rise growth is strong and the labour market is at minimum stable, which is why the Fed's price-stability mandate now dominates.", "url": "https://www.ubs.com/us/en/wealth-management/insights/ubs-studios/2026/bond-market-is-talking.html", "images": []}, {"source_id": "ned_davis_research", "source_name": "Ned Davis Research", "thesis": "NDR Business Cycle analysis (8 Sep): the US economy continued to expand through Q2 2026 though the pace slowed. Headline GDP was weighed down by trade and inventories while underlying private-sector demand strengthened; strong corporate profits and AI-driven capex are the key growth supports, and consumer spending is underpinned by a stable labour market and stock-market wealth. Headwinds: elevated mortgage rates and affordability pressure on housing, and high energy prices plus geopolitical instability weighing on sentiment and some business investment decisions. Technology investment is the key driver in 'a more selective economic environment.'", "url": "https://info.ndr.com/ndr-signals/us-economy-remains-in-expansion?hsLang=en", "images": []}, {"source_id": "bca_research", "source_name": "BCA Research", "thesis": "'Don't Worry About The Savings Rate (Yet)' (9 Sep): BCA's Bank Credit Analyst team recommends maintaining benchmark allocations to equities and other risk assets — the post-pandemic expansion remains intact amid balanced growth, with hiring reviving after a weak 2025 to an average of roughly 80k jobs added.", "url": "https://www.bcaresearch.com/marketing/felix-antoine-vezina-poirier", "images": []}, {"source_id": "oxford_economics", "source_name": "Oxford Economics", "thesis": "Europe: eurozone growth of 1.4% in 2027, accelerating on stronger German investment, intra-European exports and improving consumption. But fiscal and monetary support is limited, the sharp rise in natural gas prices is the key near-term threat (mitigated by reduced gas reliance), and 2027 elections in major economies are likely to shift policy right — with implications for climate policy, migration and defence that raise fiscal pressure and create bond-market volatility.", "url": "https://www.oxfordeconomics.com/resource/the-european-outlook-2026-2027-domestic-strength-to-be-tested-by-energy-prices/", "images": []}, {"source_id": "oxford_economics", "source_name": "Oxford Economics", "thesis": "Asia: growth eases 0.4pp to 4.2% in 2027 after an unusually strong 2026, as tech hardware demand and strategic investment stay robust but add less impetus and this year's government support is withdrawn, exposing weak household sentiment. China is a key drag — fading stimulus and renewed property weakness have led Oxford to extend the housing correction through 2030. Contrarian kicker: Oxford thinks Asia's investment cycles 'will prove more resilient than consensus expects,' with strategic spending on technology, power, defence and supply chains settling at a high plateau; deeper local-currency markets and larger domestic savings make a broad sudden stop unlikely even with higher global yields, so the strain falls on weaker sovereign and corporate borrowers.", "url": "https://www.oxfordeconomics.com/resource/the-asterisks-on-asias-resilience/", "images": []}, {"source_id": "macquarie", "source_name": "Macquarie", "thesis": "Seven structural drivers for Canada: exports to the US -6% since late 2024 vs +34% to the rest of the world (US share 75% -> 69%); services now ~24% of exports with commercial services compounding at 8% since 2017; IMF puts full internal-trade liberalisation at ~+7% real GDP per worker (interprovincial exports 25% of GDP in the early 1980s vs 17% today); business investment per worker flat since 2010 against a near-doubling in the US, now targeted by accelerated depreciation/immediate expensing and the Major Projects Office; oil output ~6.2 mb/d in 2025 with >1 mb/d of proposed west coast pipeline capacity and an LNG build-out; critical minerals ~C$30bn (~1% of GDP, potash the largest contributor); data centres 1.6 GW active vs >22 GW planned, Alberta >90%, AI adoption tripled since 2024; defence above 2% of GDP in 2025 for the first time in ~40 years en route to NATO's 5% by 2035.", "url": "https://www.macquarie.com/au/en/insights/canadas-new-growth-agenda-seven-structural-drivers-of-the-next-decade.html", "images": []}, {"source_id": "moodys_analytics", "source_name": "Moody's Analytics", "thesis": "Canada Weekly: the September baseline update weakens the Canadian forecast, reflecting a marked deterioration in US-Canada trade relations as talks to roll back tariffs stall.", "url": "https://www.economy.com/economicview/analysis/423857/Canada-Weekly-Forecast-in-Flux", "images": []}, {"source_id": "moodys_analytics", "source_name": "Moody's Analytics", "thesis": "Brazil election preview: likely runoff between incumbent Lula and challenger Flavio, with a fiscal adjustment required under either outcome but different economic implications per candidate - two distinct scenarios rather than one baseline.", "url": "https://www.economy.com/economicview/analysis/423848/Brazils-Election-Preview-Two-Economic-Scenarios", "images": []}]}, {"theme": "Fixed Income, Credit and Private Markets: Where to Take Risk", "category_tags": ["rates", "credit", "equities"], "consensus": "Starting yields are the shared anchor. PIMCO makes the most forceful version: after a 16-year equity-dominated regime, high-quality bond yields are roughly on par with equity earnings yields for the first time in over two decades, with the Bloomberg US Aggregate at a 5.03% yield-to-worst as of 3 September 2026 and the 10-year real yield around 2.4% versus roughly -1% when the Fed started hiking in 2022, while US household equity allocations sit at a record share of financial assets. Amundi agrees the global rise in yields is opening an income opportunity and that interest rate levels are 'increasingly attractive'. Spreads have been remarkably stable and every desk attributes it to technical demand plus solid fundamentals: UBS's Falconio notes financial conditions are loose, capital markets open, and heavy hyperscaler-driven IG supply is being absorbed by yield buyers. Everyone agrees starting yields provide a large cushion — BNP has euro IG short duration around 3.3% and euro HY around 5% at sub-two-year duration, with US and European HY total returns just either side of +2.0% for 2026 against -0.6% for the ICE Global Aggregate.", "divergence": "Whether duration still hedges is the live fight, and it is a direct, named disagreement. PIMCO argues yes, and says the critics make a 'category error' by testing the hedge with broad bond benchmarks that embed IG credit spread risk; the clean test is government duration, which has had little correlation with positive equity quarters but a strong negative one when the S&P 500 falls 5%+ — and PIMCO explicitly rebuts the fiscal objection by pointing to 1970-1983, when the US deficit widened to 5.9% of GDP yet 10-year Treasuries still delivered good risk-adjusted returns through the 1980 and 1981-82 recessions. BlackRock Investment Institute states the opposite flatly in its Middle East bulletin: the stagflationary supply risk 'reinforces why long-term government bonds are not reliable portfolio ballast.' T. Rowe Price lands closer to BlackRock, warning a combined inflation and rate shock is the main near-term portfolio risk. Amundi splits the difference operationally, running close-to-neutral US duration with a steepening bias and a preference for the 5-year point, EMU peripherals over core with a steepener, a cautious UK steepener and a Japan flattener — carry and the belly, not long-end ballast. Within UBS the disagreement is internal and unusually explicit: UBS CIO has withdrawn its recommendation to lock in short-to-medium duration yields as a cash alternative now the Fed is hiking and steers clients to the medium-to-long part of the curve as the better diversifier, while UBS's own fixed income CIO Leslie Falconio says she has 'been a little bit hesitant about extending further out', prefers compounding income in the 2-5 year belly, caps portfolio duration at 5.5-6 years, will only add duration on dips toward ~4.85% on 10s, and overweights agency MBS at roughly 5.70% yield where spreads have decoupled from the 10-year and there is no IG-style supply overhang. Standard Chartered advises extending only into the 3-7 year bucket, preferring corporates, on the view that record CTA short positioning and the official supply/liquidity toolkit cap medium-to-long yields. BNP's Iggo prefers floating rate, high yield and short-maturity linkers over long duration but stresses that newly issued bonds with 5%+ coupons are far better than legacy low-coupon paper. Deutsche Bank is the directional outlier, telling clients it sees price potential in high-quality bonds 'in a declining yield environment.' In private markets the disagreement is about disclosure rather than direction: PIMCO warns that private credit, direct lending, high yield and leveraged loans all embed default and liquidity compensation and that infrequently-marked private valuations 'suppress measured volatility without removing the exposure' — while PIMCO's own asset-based finance franchise markets aviation leasing as stable contractual collateral-backed income against a $4trn opportunity set with an order backlog exceeding 17,000 aircraft (~60% of the active fleet). Vanguard refuses to endorse either private equity access structure, making the drawdown-versus-semiliquid choice contingent on liquidity needs, horizon, all-in cost, manager access and operational complexity. Permira's Dipan Patel identifies the binding constraint everyone else avoids: the PE model needs 20-25% DPI per annum and the industry has been running nearer 10% for several years, which 'can't continue'. T. Rowe Price is the dissenting voice on cash itself, noting money market returns 'have not even kept pace with inflation' and that investors who shifted out of stock funds should consider gradually reinvesting.", "items": [{"source_id": "pimco", "source_name": "PIMCO", "thesis": "Bonds have regained their dual role: attractive income in a good state, protection in a bad one. Bloomberg US Agg yield-to-worst 5.03% as of 3 Sep 2026 — and starting yield historically predicts ~5yr forward returns, giving visibility equities lack. 10y real yield ~2.4% vs ~-1% in early 2022; 2022's US Agg -13% was a low-starting-yield artifact, not a structural breakdown (Treasuries fell 3.78% in Q2 2022 vs a 16.45% equity drawdown). From 2010-Aug 2026 the S&P 500 grew 8x nominal / ~5x real while the Agg returned just over 2% annualized — the behavioral reason positioning hasn't adjusted. Verdict: raise bond weights; the case is income plus downside mitigation, not outperformance.", "url": "https://www.pimco.com/us/en/insights/welcome-back-balanced-portfolio", "images": []}, {"source_id": "amundi", "source_name": "Amundi", "thesis": "Amundi keeps a close-to-neutral stance on US duration with a steepening bias and a preference for the 5-year segment; favours EMU peripherals over core with a steepener; cautious on UK duration (steepener) and on JGBs (flattener). Constructive on credit on an all-in yield basis, favouring Global IG while slightly trimming EUR IG, and preferring subordinated debt over high yield with short-dated bias. Expects the Fed on hold through year-end and only one further ECB hike.", "url": "https://research-center.amundi.com/article/global-investment-views-september-2026", "images": []}, {"source_id": "blackrock_investment_institute", "source_name": "BlackRock Investment Institute", "thesis": "BlackRock Bulletin on the Middle East: views the conflict primarily as a volatility shock and would lean against indiscriminate de-risking — but explicitly concludes that stagflationary supply risk 'reinforces why long-term government bonds are not reliable portfolio ballast.'", "url": "https://www.blackrock.com/corporate/insights/blackrock-investment-institute/publications/middle-east-conflict-2026", "images": []}, {"source_id": "t_rowe_price", "source_name": "T. Rowe Price", "thesis": "T. Rowe Price's Asset Allocation Committee co-chair Charles Shriver: 'Fundamentals: solid. Macro: mixed. Valuations: on the high side.' Bond yields seen range-bound near term with an upward trend over time if stronger nominal growth and productivity gains come through — i.e. the bullish equity scenario is the bearish fixed income scenario.", "url": "https://www.troweprice.com/en/us/insights/Why-the-bull-case-is-still-in-play-for-equity-markets", "images": []}, {"source_id": "pimco", "source_name": "PIMCO", "thesis": "PIMCO separates secular from cyclical: structural forces (deficits, debt, AI-infrastructure borrowing) may raise term premia and prevent a return to post-GFC lows, but they do not prevent yields from falling when growth weakens. Global opportunity set has improved because policy paths are desynchronized — unlike 2022's common inflation shock — creating scope for country selection, curve positioning and relative value.", "url": "https://www.pimco.com/us/en/insights/welcome-back-balanced-portfolio", "images": []}, {"source_id": "invesco", "source_name": "Invesco", "thesis": "Invesco's market commentary stream leans persistently against the bearish macro narrative: 'Why investors may want to ignore some market headlines' (8 Sep), 'No rate-hiking map from the Federal Reserve' (31 Aug), 'Don't let debt fears derail market perspective' (24 Aug) and 'New Treasury buyback eases debt reckoning worries' (19 Aug) — the house line being that earnings strength, AI demand and broadening breadth matter more than oil, rates and debt headlines.", "url": "https://www.invesco.com/us/en/insights/topic/market-and-economic-insights.html", "images": []}, {"source_id": "ubs", "source_name": "UBS", "thesis": "UBS (Leslie Falconio): credit spreads have been 'remarkably stable' on loose financial conditions, open capital markets and heavy yield-buyer demand absorbing hyperscaler-driven IG supply; hyperscalers running 15% IRRs are not very cost-of-capital sensitive. Recent modest IG widening reflects the inflation component coming to the fore rather than growth, and she does not expect it to persist. Preference: agency MBS at roughly 5.70% yield - high quality, liquid, no IG-style supply concern, and spreads decoupling from rising 10-year yields (effective mortgage rate ~4.2% vs 3.3% in 2022, still ~200bp below current ~6.8% mortgage rates, so the lock-in effect holds). Structure: high-quality rates duration capped at 5.5-6 years plus compounding income from short-duration high yield.", "url": "https://www.ubs.com/us/en/wealth-management/insights/ubs-studios/2026/bond-market-is-talking.html", "images": []}, {"source_id": "ubs", "source_name": "UBS", "thesis": "UBS CIO: now that the Fed is on a hiking path, it no longer recommends locking in short-to-medium duration yields as a cash alternative - capital-gain potential is limited and further upward repricing could weigh on returns. Instead it sees diversification value opening in medium-to-long high-quality bonds, which could benefit if tightening reinforces the inflation commitment or slows growth, while cautioning on entry points given term-premium, financing and inflation uncertainty - and noting higher-for-longer short rates worsen US debt affordability because the Treasury has aggressively shortened its funding profile. EM bonds and HY depend on the backdrop: compressed spreads if growth is strong, widening if the Fed hikes into a bad growth/inflation mix.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-07092026.html", "images": []}, {"source_id": "bnp_paribas", "source_name": "BNP Paribas", "thesis": "BNP Paribas AM (Iggo): September month-to-date total return on the ICE Global Aggregate is -0.9% (10 September), Q3 -1.3%, 2026 YTD -0.6%, while US and European high yield are just either side of +2.0% for 2026 and a global convertibles index is up ~14%. He prefers floating rate debt, high yield and shorter-maturity inflation-linked bonds to long-dated debt near term, but says newly issued bonds with coupons well above 5% should not be overlooked - far better prospective price volatility than legacy low-coupon paper.", "url": "https://viewpoint.bnpparibas-am.com/view-from-the-markets-tightening-again/", "images": []}, {"source_id": "bnp_paribas", "source_name": "BNP Paribas", "thesis": "BNP Paribas AM (Boutaina Deixonne, Head of Euro IG and HY Credit): euro short-duration credit - sub-three-year maturities, portfolio duration between 1.5 and 2 years, no long bonds hedged with futures - currently yields about 3.3% in investment grade and around 5% in high yield. About one-third of the euro IG market has duration below two years, roughly EUR1trn, supporting liquidity; her IG strategy runs EUR3.5bn across 150+ tickers and 250+ bonds with up to 10% in high yield, while the short-duration HY strategy runs over EUR1.7bn. Pitched explicitly as drawdown control for a market facing higher inflation, geopolitical tension and AI funding supply.", "url": "https://viewpoint.bnpparibas-am.com/talking-heads-euro-short-duration-bonds-potential-for-stability-and-steady-income/", "images": []}, {"source_id": "pimco", "source_name": "PIMCO", "thesis": "PIMCO aviation finance (Benjamin Ensminger-Law, ABF PM, with Greg Conlon, CEO of High Ridge Aviation): a $4 trillion opportunity. Aviation supports over $4tn of global economic activity and moved nearly 10bn passengers last year; operating leases finance over half the global fleet vs a fraction in 1990; the order backlog exceeds 17,000 aircraft, about 60% of the active fleet, keeping capacity tight and values firm. PIMCO partnered with GE Capital Aviation's former senior management to create High Ridge Aviation — 300+ airline relationships, 20+ years experience, 30+ specialists across 8 locations. Pitch: contractual collateral-backed cash flows, diversification from corporate credit cycles, inflation-mitigating real asset exposure, underwriting aircraft, airline and jurisdiction on every deal and concentrating on the most liquid aircraft types.", "url": "https://www.pimco.com/us/en/resources/video-library/media/aviation-finance-a-4-trillion-opportunity-takes-flight", "images": []}, {"source_id": "vanguard", "source_name": "Vanguard", "thesis": "Vanguard research (Michael Rabinovich, Ariana Abousaeedi et al.), 'Investing in Private Equity: A Decision Framework for Drawdown Versus Semiliquid Funds.' Drawdown funds call and distribute capital opportunistically, avoiding the cash-drag of holding liquid assets to meet redemptions — best for very long horizons and high liquidity-risk tolerance. Semiliquid funds offer flexible access, simpler administration and periodic redemptions (which can be limited or suspended in certain circumstances). Vanguard's contribution is quantitative: most prior work described the differences qualitatively; this framework lets investors quantify what those differences mean for their own outcomes.", "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/choosing-your-private-equity-point-of-entry.html", "images": []}, {"source_id": "pimco", "source_name": "PIMCO", "thesis": "PIMCO's counterweight on privates: high yield, leveraged loans, direct lending and other private credit may differ in structure and volatility but still embed compensation for default and liquidity risk — and while private assets look more stable because valuations are updated less frequently and are not continuously tested by market-clearing transactions, smoother marks suppress measured volatility without removing the exposure.", "url": "https://www.pimco.com/us/en/insights/welcome-back-balanced-portfolio", "images": []}, {"source_id": "goldman_sachs", "source_name": "Goldman Sachs", "thesis": "Goldman Sachs Exchanges: Permira co-CEO Dipan Patel on the private equity liquidity problem - the model only works with ~20-25% DPI per annum and the industry has been delivering nearer 10% for several years, which 'can't continue.' Permira realised 22% of NAV over the last 12 months via multiple exit routes. Permira runs ~$100bn AUM, ~500 people, 250 investors, 16 offices, PE across consumer, healthcare, services and technology, mostly in the $200m-$2bn EV mid-market, with an explicitly 'artisanal' rather than 'factory' model: portfolios that are under-levered, under-margined and over-growthed, growing low-teens organically.", "url": "https://www.goldmansachs.com/insights/goldman-sachs-exchanges/dipan-patel-on-permiras-artisanal-approach-to-private-equity", "images": []}, {"source_id": "t_rowe_price", "source_name": "T. Rowe Price", "thesis": "T. Rowe Price on cash: money market fund yields remain attractive relative to their risk 'though they have eased from recent highs,' and money funds suit goals inside three to five years plus a three-to-six month emergency reserve — but over 20 years to 31 December 2025 a 60/40 allocation materially outperformed all-bond, money market and cash, and money market returns have not kept pace with inflation. Investors who shifted from stock funds to money funds should consider gradually reinvesting.", "url": "https://www.troweprice.com/en/us/insights/four-reasons-to-save-in-a-money-market-fund", "images": []}]}, {"theme": "Dollar Dominance, Reserve Assets and Gold", "category_tags": ["fx", "commodities", "geopolitics"], "consensus": "Official-sector gold accumulation is real and has run at an elevated pace since 2022, plausibly reflecting geopolitical and sanctions considerations — Federal Reserve staff, the ECB, Goldman and UBS all agree on that much. Goldman's metals desk has central banks buying roughly 1,000-1,100 tonnes a year against ~3,500 tonnes of annual mine supply, versus 400-500 tonnes before the Russia-Ukraine war; UBS expects 750-1,000 tonnes of annual official demand and notes the PBoC bought 650,000 ounces (~20 tonnes) in August, its largest monthly addition since October 2023 and a 22nd consecutive month, with nearly 90% of central banks surveyed by the World Gold Council expecting global official reserves to rise. Amundi separately reports that the joint US Treasury-BoJ yen intervention plus the Treasury's double buyback programme have 'reinvigorated the debasement trade', pushing the dollar lower and highlighting gold as a store of value, and has increased its gold overweight.", "divergence": "On the reserve-currency question two sources deliver direct, named rebuttals of the de-dollarisation narrative and reinforce each other. Federal Reserve staff economist Colin Weiss takes on the ECB's own June 2026 International Role of the Euro report (and the resulting 'Gold Replaces U.S. Treasuries as World's Top Reserve Asset' headline), conceding that end-2025 world gold reserves were $5.1trn ($4.0trn ex-US) against $3.9trn of foreign official Treasuries, but arguing the crossover was driven by price rather than official buying — the gold-price surge came from private ETF inflows from late 2024 while central bank purchases merely held their elevated 2022 pace — and that world gold includes the US itself, which holds 22% of the total and cannot hold Treasuries as reserves. Excluding the US, Germany, France, Italy and the IMF (the five largest holders, 52% of world gold, none of whom have accumulated meaningfully since the 1970s), foreign official Treasury holdings exceeded gold by about $1trn in June 2026, and foreign official investors bought nearly $200bn of Treasuries on net from 2022 through April 2026. PIIE's Martin Chorzempa reaches the same conclusion from the payments side: the yuan's SWIFT payment share peaked at 4.7% in July 2024 and has fallen back to 2.75%, making it the sixth most used payments currency behind even the Canadian dollar, while the dollar's share of global FX transactions rose from 87% to 89% between 2013 and mid-2025 even as the yuan went from 2% to 8.5% — entirely at the expense of non-dollar currencies. He tests and rejects the CIPS-migration rebuttal using Hong Kong CHATS data, and concludes yuan internationalisation now looks like 'an insurance policy, ready to be activated if sanctions force China off the dollar' rather than an active challenge, with 72% of China's goods trade still settled in other currencies. On gold as a trade the two largest houses disagree on method rather than direction: Goldman's Tony Kim is outright tactical and bullish — 'we're still bullish gold', the move is 'an elongated pause' with gold ~20% off its January record, $4,000/oz is 'a pretty solid floor' with sovereign and institutional sponsorship, scale into longs closer to $4K ahead of the FOMC — and argues fiscal-sustainability concerns could break the classic rates/gold correlation so higher back-end yields actually drive allocations into gold, while preferring gold to silver because 'central banks so far, to my knowledge, aren't actively accumulating silver.' UBS refuses to trade it at all, insisting gold is 'a portfolio hedge and diversifier, rather than a tactical expression of the next Fed decision', expects higher real yields and a stronger dollar to be a near-term headwind after gold fell 5.5% following a 15% August gain, and tells underallocated investors to use weakness to build strategic exposure. PIIE's Cullen Hendrix supplies the structural wildcard neither prices: on V-Dem's State Ownership of Economy index the US fell from consistently 2nd-4th least state-controlled of 179 countries to 16th in 2025 — a year-on-year move larger than 98.8% of all such moves since 2005 — on a portfolio of equity or equity-like stakes in over 30 firms including a 10% stake in Intel and a Nippon Steel 'golden share', with the ad-hoc, privately negotiated terms the real risk rather than the ownership itself.", "items": [{"source_id": "federal_reserve", "source_name": "Federal Reserve", "thesis": "Weiss: at end-2025 world gold reserves were $5.1trn ($4.0trn ex-U.S.) versus $3.9trn of foreign official Treasury holdings — but by June 2026 foreign official Treasuries again surpassed ex-U.S. gold reserves in dollar terms despite further increases in gold measured in fine troy ounces. Gold now exceeds 80% of international reserves in the U.S., Germany, France and Italy purely on legacy Bretton Woods holdings. Most world gold was acquired pre-1971; most foreign official Treasury holdings post-2000. Foreign official investors bought nearly $200bn of Treasuries on net from 2022 through April 2026, even as several large FX-reserve holders sold hundreds of billions to defend currencies after 2021.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/why-gold-didnt-actually-overtake-treasury-securities-as-the-worlds-favorite-reserve-asset-20260903.html", "images": []}, {"source_id": "ecb", "source_name": "European Central Bank", "thesis": "Eurosystem gold and gold receivables stood at EUR1,232.8bn at 4 September 2026 (+EUR1mn on the week), against total assets of EUR5,912.2bn and revaluation accounts of EUR1,208.2bn — a balance sheet where accumulated valuation gains now nearly match the reported gold stock.", "url": "https://www.ecb.europa.eu/press/annual-reports-financial-statements/wfs/2026/html/ecb.fs260908.en.html", "images": []}, {"source_id": "peterson_institute", "source_name": "Peterson Institute for International Economics", "thesis": "Martin Chorzempa (3 Sep): the yuan's SWIFT payment share peaked at 4.7% in July 2024 and has fallen to 2.75%, sixth globally behind the Canadian dollar. Hong Kong CHATS average daily RMB volume has fallen by over 1trn yuan from June 2024 to June 2026, while CIPS volume is up only about 200bn — so migration to CIPS cannot explain the decline. CIPS direct participants have grown from 79 banks (Jan 2023) to 210, and CIPS is at all-time highs, with the Hormuz crisis reviving its growth. The dollar's share of global FX transactions rose from 87% to 89% (2013 to mid-2025) even as the yuan rose 2% to 8.5%; 72% of China's goods trade is still settled in other currencies; yuan settlement of China's goods trade reached 28% in H1 2025 (from 11% in 2017, 23% in 2015). mBridge had handled just 387.2bn yuan cumulatively as of November 2025 — roughly one-tenth of a single day's CIPS volume for its recent six-to-seven-month increment.", "url": "https://www.piie.com/blogs/realtime-economics/2026/has-chinese-yuans-rise-global-usage-hit-wall", "images": []}, {"source_id": "peterson_institute", "source_name": "Peterson Institute for International Economics", "thesis": "Cullen Hendrix (10 Sep): on V-Dem's State Ownership of Economy measure the US moved from never ranking worse than 4th of 179 countries over two decades — often 2nd — to 16th in 2025, a year-on-year shift larger than about 98.8% of all such moves since 2005. The driver is not the DSA but the administration's portfolio of equity or equity-like stakes in over 30 firms across semiconductors, critical minerals and quantum computing, headlined by a 10% Intel stake converting prior federal grants into equity, plus a Nippon Steel 'golden share' granting a board seat and veto over plant closures, idling, job transfers and HQ relocation with no equity and no dividends. Unlike 2008 or the 1930s these are proactive, open-ended acquisitions made during growth and market stability; calls are now coming for stakes in pre-IPO AI hyperscalers. Hendrix's sharpest point for investors: the ad-hoc, privately negotiated, executive-discretion terms are the real risk, not the ownership itself.", "url": "https://www.piie.com/blogs/realtime-economics/2026/youre-already-getting-socialism-and-democratic-socialists-have", "images": []}, {"source_id": "carnegie", "source_name": "Carnegie Endowment for International Peace", "thesis": "Daniel Drezner, 'Network and Structural Power': the networks underlying US power — from international payments platforms to key economic sectors — are being degraded by an extractive approach to foreign policy, with four identified trend lines weakening US leverage. Published alongside 'American Power: A View from China,' giving the counterparty's assessment.", "url": "https://carnegieendowment.org/research/2026/09/american-power-a-view-from-china", "images": []}, {"source_id": "goldman_sachs", "source_name": "Goldman Sachs", "thesis": "Goldman Sachs Metals Trading head Tony Kim: still bullish gold, calls the current move 'an elongated pause' not the end of the bull market (gold is ~20% off its January record high), identifies $4,000/oz as a solid floor with sovereign and institutional sponsorship, and recommends scaling into longs closer to $4K on volatility between now and the FOMC. Central banks buy ~1,000-1,100 tonnes/year vs 400-500 pre-2022 against ~3,500 tonnes of annual mine supply, shrinking the funnel for jewellery, ETFs and bars. He argues fiscal-sustainability concerns in the West and Japan could break the classic rates/gold correlation so that higher back-end yields drive allocations into gold, and notes official policy intervention (USD/JPY, Treasury long-end buybacks) tends to prompt gold buying. Asian demand has been disrupted - India is restricting domestic demand to defend its currency for energy security, and energy-market disruption has curtailed reserve accumulation.", "url": "https://www.goldmansachs.com/insights/the-markets/why-gold-is-expected-to-rise-to-record-highs", "images": []}, {"source_id": "ubs", "source_name": "UBS", "thesis": "UBS: gold fell 5.5% over two weeks after a 15% gain in the first three weeks of August, hit by rising Treasury yields, Warsh's hawkishness and strong payrolls. With 50bp of Fed hikes now expected this year, higher real yields and a stronger dollar are a near-term headwind - but UBS keeps gold as a strategic diversifier on central-bank demand of 750-1,000 tonnes/year (PBoC bought 650,000oz/~20t in August, largest since October 2023, 22nd straight month; ~90% of surveyed central banks expect official reserves to rise, 45% expect their own to). Underallocated investors should use weakness to build exposure.", "url": "https://www.ubs.com/us/en/wealth-management/insights/investment-research/insights-display-adp/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-08092026.html?caasID=CAAS-ActivityStream", "images": []}, {"source_id": "ubs", "source_name": "UBS", "thesis": "UBS: higher real rates and a stronger dollar could pressure gold near term, but the effect may be offset if the Fed is responding to persistent inflation, geopolitical uncertainty or fiscal/monetary credibility concerns - hence gold stays a hedge, not a tactical Fed expression. More broadly UBS sees commodities as both a structural return source and diversification against energy disruption and renewed inflation.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-04092026.html", "images": []}, {"source_id": "amundi", "source_name": "Amundi", "thesis": "Amundi's central theme is 'credibility under scrutiny.' Ahead of US midterms, the interaction between the Treasury buyback programme and the Fed's inflation mandate is the key market theme; the buyback would need to be substantial to ease long-end real rates though it may keep rate vol subdued. At Jackson Hole, Warsh struck a hawkish tone — a higher hurdle for cuts, higher-for-longer bias, tightening still possible if inflation reaccelerates, limited room for forward guidance. BoJ to squeeze in four hikes before mid-2027 to a neutral 2%.", "url": "https://research-center.amundi.com/article/global-investment-views-september-2026", "images": []}]}, {"theme": "Crypto: Bitcoin at $80k, Alt Season, and Digital-Asset Treasury Balance Sheets", "category_tags": ["crypto", "rates", "credit"], "consensus": "Everyone covering price agrees the September rally was a macro/fiscal trade rather than a crypto-native one. CoinShares and Delphi both date the move from Treasury Secretary Bessent's long-end bond liquidity support announcement (buybacks starting 9 September), which carried BTC from the low US$60ks to US$80.1k, and both frame $80k as the pivot level; CoinShares, Delphi and Galaxy all describe Bitcoin trading like gold — a hard-asset hedge against US fiscal deterioration with the 10-year around 4.7-4.96% and debt/GDP ~122%. CoinShares and Galaxy agree BTC is now consolidating rather than trending. On the credit side, Galaxy Research and Galaxy Lending agree the 2025-26 drawdown was a credit-market non-event relative to 2022 — no major lender, fund or exchange failed, Coinbase reported no crypto collateral sold or rehypothecated, and DeFi lending stayed orderly — with crypto-collateralised lending down 9.81% QoQ to $69.55bn entirely because of onchain deleveraging while CeFi books grew for an eighth straight quarter. On the $320m Liquid sidechain exploit, Chainalysis and Galaxy independently reconstruct the same event and reach the same structural conclusion: Bitcoin's base layer stayed secure while the financial layers built on top of it did not.", "divergence": "The rate path is where the biggest disagreement sits. CoinShares argues monetary policy is the ceiling — the 11 September CPI raised the odds of a September hike and flipped digital-asset product flows from +US$1.3bn last week to -US$243m week-to-date, capping BTC below $80k until either Iran resolves or confidence in Treasuries deteriorates further — though James Butterfill also says the market's pricing of a September hike 'still looks too aggressive', and he makes the contrarian second-order point that the failure of the Treasury buyback to suppress long yields is medium-term bullish because it raises the odds of a far larger 'bazooka' intervention that supercharges the debasement narrative. Delphi is more willing to be long: its unified macro regime is back to 'neutral' but its outlook is explicitly bullish risk assets, and its Hivemind team argues 'alt season is already here' and can keep running even if Bitcoin does not break out, led by HYPE at all-time highs around $80, Zcash and Lighter near $4. Galaxy's Alex Thorn is the most cautious near-term — risk stays to the downside until BTC firmly re-establishes above $100-105k — while being structurally the most bullish long-term at $250k by year-end 2027. On froth the split repeats: Delphi's own episode warns that taking profits may be the most important survival skill, Galaxy's Grid hosts ask directly whether the onchain rally is overheating and cite Hunter Biden's $LAPTOP (opened above $200, crashed below $1 within hours on Base) as a possible local top with $TRUMP/$MELANIA the precedent, and CoinShares argues the durable expression is infrastructure and tokenisation equities 'that get paid whether or not the price of Bitcoin moves this quarter' — the BLOCK Index +5.2% on the week versus Bitcoin +2.7%. The cleanest head-to-head is on digital asset treasuries. CoinShares reports the DAT model reviving with diversified access to capital: Strategy resumed buying after a ~10-week pause with 4,603 BTC for US$369.7m (845,050 BTC total), Hyperliquid Strategies expanded its Chardan committed equity facility from US$1bn to US$2.5bn, Strive added 1,800 BTC, Capital B raised EUR7.6m with Adam Back and Smarter Web added 35 BTC to 2,747. Galaxy Lending argues the opposite about the same structure: Strategy's 'digital credit' suite is perpetual preferred equity, not debt, the accretion engine broke when mNAV compressed to ~1.07x after touching 0.99x, and with ~$1.73bn/yr of preferred obligations against a treasury producing no operating cash flow the company sold 3,588 BTC for ~$216m between 29 June and 5 July to fund dividends — the product decumulates the treasury it claims to monetise — with Galaxy's 2026 outlook predicting five or more DATs are forced to sell assets, be acquired or shut down. Finally, on the Liquid exploit Chainalysis reports the outcome neutrally and leaves open that the residual ~600 BTC (~$47m) amounts to a de facto bounty, while Galaxy's Thorn is explicitly normative: holding 15% of stolen funds while negotiating 'is extortion, not white-hat behaviour', and he publishes the hackers' 9 September plaintext demand that Blockstream pay a 10% bounty (340 BTC, ~$26m) from its own funds.", "items": [{"source_id": "coinshares", "source_name": "CoinShares", "thesis": "Fiscal concern carried BTC from the low US$60ks to US$80.1k; Warsh's hawkish Jackson Hole comments pushed markets to price ~two-thirds odds of a September rate HIKE before Waller pushed back. Flows track the rate path exactly: ~US$100M left digital-asset products right after Warsh spoke, then US$1B week-to-date vs US$2B the prior week and US$2.9B the week before (strongest weekly inflow of the year). 10y Treasury ~4.7%, debt/GDP ~122%. To break above $80k convincingly you need either an Iran resolution or a further loss of confidence in US sovereign debt; otherwise range-trading. Blockchain equities took ~US$27M this week and >US$100M over the month — rotation within the sector, not exit.", "url": "https://coinshares.com/insights/research-data/market-update-04-09-2026/", "images": []}, {"source_id": "coinshares", "source_name": "CoinShares", "thesis": "Sticky CPI limits Bitcoin upside: headline in line, core marginally firmer, increasing the likelihood of a September hike. Flows flipped from ~US$1.3bn of inflows last week to US$243m of outflows week-to-date. The Treasury's expanded bond buyback programme has failed to suppress long-end yields despite larger long-dated purchases — which paradoxically becomes BULLISH for Bitcoin medium-term because it raises the odds of a far larger 'bazooka' programme, reinforcing fiscal-dominance and debasement concerns that support both BTC and gold.", "url": "https://coinshares.com/insights/research-data/market-update-11-09-2026/", "images": []}, {"source_id": "delphi_digital", "source_name": "Delphi Digital", "thesis": "Delphi's unified macro regime moved back to 'neutral' but remains cautiously constructive and bullish risk assets. Attributes the about-face in crypto to Bessent's long-end bond liquidity support starting Sept 9 plus positive regulatory headlines: BTC low-60Ks to low-80Ks, Hyperliquid at all-time highs around $80, Lighter closing in on $4, and an alt season underway on Robinhood Chain.", "url": "https://members.delphidigital.io/media/delphis-market-matters-september-2026", "images": []}, {"source_id": "galaxy_digital", "source_name": "Galaxy Digital", "thesis": "Galaxy Grid hosts assess whether the onchain rally is overheating amid Bitcoin's $80,000 consolidation and Zcash's 40% surge on renewed privacy narratives; they flag Hunter Biden's $LAPTOP launch as a possible local-top signal.", "url": "https://www.galaxy.com/insights/podcasts/galaxy-grid/is-the-onchain-rally-overheating-amc-vs-meme-stocks-and-hunter-biden-s-laptop", "images": []}, {"source_id": "galaxy_digital", "source_name": "Galaxy Digital", "thesis": "Vintage context (July 29, 2026 lending report) for how violent this year has been: BTC fell 20.1% in June to close ~$58,700, its lowest since 2024 and ~53% below the October 2025 peak of ~$126,200 — the worst first half since 2022. Driven by macro not contagion: inflation hit a three-year high of 4.2% in May on the Iran energy shock, the Fed held at 3.50-3.75% on June 17 with the median 2026 policy-rate projection rising to 3.8% from 3.4%, and US spot Bitcoin ETFs recorded their largest monthly outflow on record at ~$4.5bn. Large holders absorbed >270,000 BTC (~$16.7bn) in the back half of June.", "url": "https://www.galaxy.com/insights/perspectives/crypto-credit-remains-resilient-despite-macro-driven-market-volatility", "images": []}, {"source_id": "delphi_digital", "source_name": "Delphi Digital", "thesis": "Alt season is already here: growing altcoin rally, risk appetite returning onchain, and the market can keep running without Bitcoin moving materially higher. Continued strength in HYPE, Zcash and Lighter makes this an alt-picker's market; tokenized stocks are creating a new speculative playground across Robinhood Chain and Solana. Also warns on FOMO, crypto-native social trading and increasingly speculative onchain trades — taking profits is the key survival skill.", "url": "https://members.delphidigital.io/media/the-hivemind-alt-season-is-already-here", "images": []}, {"source_id": "galaxy_digital", "source_name": "Galaxy Digital", "thesis": "$LAPTOP postmortem: Hunter Biden launched on Base two days after the WSJ broke the story, with 30% of supply tied to Polymarket/Kalshi event outcomes (burned if predictions come true, donated if not). The token shot above $200 and crashed below $1; the team blamed sniper bots and thin liquidity. Kraken and Pump.fun deleted promotional posts after backlash; Coinbase's Base publicly distanced itself. Galaxy's read: celebrity launches long ago ran their course, and the market has matured past buying a token just because a big name is attached.", "url": "https://www.galaxy.com/insights/research/laptop-memecoin-hunter-biden-base-celebrity-token-flop-crypto-market", "images": []}, {"source_id": "coinshares", "source_name": "CoinShares", "thesis": "Blockchain equities outperformed in Week 36: BLOCK Index +5.2% vs Bitcoin +2.7%. Top performers Robinhood +13.6%, Circle +9.5%, Bullish +7.9%; worst PayPal -7.6%, Metaplanet -5.9%, Keel Infrastructure -4.6%. Hyperliquid gained another regulated distribution channel as Hashdex added HYPE to its US-listed NCIQ multi-asset crypto ETF (8 to 9 assets). Coinbase filed with the SEC to offer US equity perpetuals (needs CFTC approval); Polymarket launched perps with up to 20x leverage across 67 markets including 36 equity-linked contracts; LSEG partnered with Kraken parent Payward on tokenised UK equities via LSE 24 from 2027.", "url": "https://coinshares.com/insights/research-data/equities-update-08-09-2026/", "images": []}, {"source_id": "galaxy_digital", "source_name": "Galaxy Digital", "thesis": "State of Crypto Leverage, Q4 2025 (published March 6, 2026): crypto-collateralized lending fell $7.55bn (-9.81%) QoQ to $69.55bn, entirely due to onchain. DeFi borrows fell $10.66bn (-24.15%) to $33.5bn and have since collapsed 40.2% from the Sept 19, 2025 record of $47.12bn to $28.17bn (Feb 16, 2026). CeFi borrows grew 11.66% to $27.56bn, an eighth straight quarter of growth, +282% off the Q4 2023 trough of $7.21bn; Tether holds 61.84% CeFi share, top three (Tether/Maple/Galaxy) 74.98%. Futures open interest fell 39.09% QoQ from $197.18bn to $120.11bn after the Oct 10 liquidation, the largest in perps history, and has since gone below $100bn for the first time since April 2025. Looping died because sUSDe yield fell from 5-7% to 3.5% against USDC/USDT borrow costs of 3.75-4.15%. >$14bn of debt outstanding is tied to DAT treasury strategies.", "url": "https://www.galaxy.com/insights/research/state-of-crypto-leverage-q4-2025", "images": []}, {"source_id": "galaxy_digital", "source_name": "Galaxy Digital", "thesis": "Strategy's five perpetual preferreds (STRF, STRC, STRK, STRD, STRE) are equity, not debt. mNAV compressed to ~1.07x after touching 0.99x; STRC, engineered to hold $100, fell to ~$89 in mid-June and into the $70s by month-end, with the dividend raised to 12% on June 29. ~$1.73bn/yr of preferred obligations against a zero-cash-flow treasury forced 3,588 BTC of sales for ~$216m (June 29-July 5) to fund dividends, with USD reserves rebuilt to ~$2.55bn under a new $1.25bn Monetization Program. Separately, institutional capital is deepening in onchain credit: DeFi lending TVL ~$39.9bn with Aave+Morpho at 53.1% combined share ($13.9bn/$7.3bn), Standard Chartered initiating coverage on both, Morpho raising $175m, Kraken in talks for 15% of Aave at a $385m valuation, Ethena's USDe integrating into BlackRock's Aladdin with BUIDL as reserve. Tokenized RWAs hit a record $30.1bn (incl. $17.0bn tokenized Treasuries) and tokenized equities jumped 145% to $3.86bn. Caveat: three stablecoins depegged in June — apxUSD to $0.90-0.93, MIM to $0.50, msUSD -71% to $0.29.", "url": "https://www.galaxy.com/insights/perspectives/crypto-credit-remains-resilient-despite-macro-driven-market-volatility", "images": []}, {"source_id": "coinshares", "source_name": "CoinShares", "thesis": "DAT accumulation revived with diversified access to capital: Strategy bought 4,603 BTC for US$369.7m (845,050 BTC total) after a ~10-week pause, Hyperliquid Strategies raised its Chardan equity facility from US$1bn to US$2.5bn for HYPE accumulation, Strive added 1,800 BTC, Capital B raised EUR7.6m with Adam Back, Smarter Web added 35 BTC to 2,747.", "url": "https://coinshares.com/insights/research-data/equities-update-08-09-2026/", "images": []}, {"source_id": "chainalysis", "source_name": "Chainalysis", "thesis": "Purported white-hat hackers withdrew $320m in BTC from Liquid's reserve — roughly 4,000 of ~4,200 BTC — by exploiting a flaw in how Liquid cached range-proof verification results, letting invalid transaction data point to a previously approved cached result and mint unbacked L-BTC. 3,400 BTC (85%) returned; ~600 BTC (~$47m) still with the actors. Blockstream patched and deployed updated software. The incident separates blockchain security from infrastructure security: sidechains, bridges, wallets, custodians and settlement providers are a distinct layer institutions must assess.", "url": "https://www.chainalysis.com/blog/320m-exploit-liquid-network/", "images": []}, {"source_id": "galaxy_digital", "source_name": "Galaxy Digital", "thesis": "Galaxy's reconstruction: hackers consolidated the 4,000 BTC and used Bitcoin's OP_RETURN field for 28 messages over four days with Blockstream, encrypting to each other's keys. Their Sept 9 plaintext ultimatum demanded Blockstream pay a 10% bug bounty (340 BTC, ~$26m) from its own money or the 15% (600 BTC) stays gone. Galaxy's verdict: this is extortion, not white-hat conduct — the vulnerability was remotely patchable and should have been disclosed. Third high-profile BTC theft after Coldcard and BTCPay Server; Bitcoin's limited programmability has historically capped its attack surface versus Ethereum and Solana, but the pressure to harden codebases is rising as AI-assisted exploitation becomes plausible.", "url": "https://www.galaxy.com/insights/research/liquid-network-exploit-4000-btc-bitcoin-sidechain-blockstream-white-hat", "images": []}]}, {"theme": "Digital Money: Stablecoins, Tokenisation and Market Plumbing", "category_tags": ["crypto", "rates", "credit", "equities"], "consensus": "The most striking cross-institution convergence in the report is that the Bank of England (Bailey, Breeden, Benjamin, Cleland) and Federal Reserve staff now both treat regulated stablecoins and tokenised bank deposits as mainstream money rather than crypto curiosities. The BoE has issued proposed rules for systemic sterling stablecoins requiring high-quality backing including central bank deposits and prompt par redemption, approved its first Digital Securities Sandbox participant for live activity, and is working toward a UK digital gilt (DIGIT) eligible as collateral in Bank market operations; the organising principles everywhere are singleness of money ('a pound is a pound, whoever issues it') and finality of settlement, with central bank money as the anchor. The commercial and regulatory rails are being built at the same time: Galaxy details the SEC's first substantive transfer-agent rule overhaul since the late 1970s/80s expressly recognising blockchain and DLT as permitted recordkeeping media, a 17 September roundtable on 24-hour trading, consolidated data feeds running 9pm Sunday to 8pm Friday, NSCC 24x5 clearing live since 29 June and FINRA TRF hours extending 6 December. Deutsche Bank frames digital assets as 'out of the sandbox', with tokenised assets a ~$60bn market today against BCG's strong-growth scenario of ~$88trn (about 16% of global investable assets) by 2035 and 73% of institutional investors planning to increase allocations in 2026.", "divergence": "The Fed and BoE differ on where this lands institutionally. BoE officials are building a deliberate 'multi-money' retail system in which cash, bank deposits, tokenised deposits, regulated stablecoins and potentially a retail CBDC coexist and compete, with Sarah Breeden pressing industry to 'put some runs on the board' and warning that a regulated system failing to deliver at the technological frontier risks activity migrating offshore and reaching systemic scale fast. Federal Reserve staff are one step earlier and more cautious: they cannot yet classify payment stablecoins at all, noting that if GENIUS Act coins are mainly used as a crypto-trading store of value they belong in non-M1 M2 and only if they become everyday payment instruments do they qualify for M1, and flagging that GENIUS coins are barred from paying interest directly, redemption timeframes are undefined (an OCC proposal suggests two business days) and blockchains give no geographic data to separate US from global circulation. Deutsche Bank's own analysis cuts hard against the stablecoin hype: less than 1% of 2025 stablecoin transaction volume corresponded to real-economy payments, and because stablecoins are generally not yield-bearing, financial institutions and corporate treasurers have limited incentive to hold balances — pushing interest toward tokenised deposits and tokenised money-market funds instead — while TRM Labs counted a record 207 hacking incidents in H1 2026 and Elliptic estimates $21.8bn laundered cross-chain. On how far tokenised ownership can travel, Galaxy's Thad Pinakiewicz highlights Commissioner Hester Peirce's question of whether transfer agents should be allowed to record wallet addresses instead of names and physical addresses, arguing a public wallet address is strictly more information than a true bearer instrument provides — while conceding that even Galaxy's own onchain GLXY shares on Solana remain restricted to allowlisted wallets and the aggregation problem for 13D/13G and Section 16 thresholds is unresolved. CoinShares' Brazil case study cuts the other way entirely: after privacy tests failed and Microsoft and EY pulled back, the Banco Central do Brasil stripped blockchain out of Drex altogether, leaving 'crypto without the chain', and banned electronic FX providers from settling overseas remittances in stablecoins from 1 October — in a market that ranks fifth in Chainalysis's 2025 adoption index and processes $6-8bn a month with stablecoins up to 90% of reported volume. Chainalysis supplies the enforcement backdrop showing why regulators keep attacking the stablecoin layer: OFAC's 9 September sanctioning of Xinbi Guarantee, which has processed over $24bn since ~2022, with 52 designated addresses receiving over $8.4bn in stablecoins and DPRK-linked actors laundering Bybit and WazirX proceeds through 'Black U' substitution vendors.", "items": [{"source_id": "boe", "source_name": "Bank of England", "thesis": "Bailey: RTGS renewal delivered; Synchronisation Lab live with the private sector; first Digital Securities Sandbox participant approved for live activity, supporting a UK digital gilt (DIGIT) that the Bank will work with HMT to make eligible as collateral in its market operations; proposed rules issued for systemic sterling stablecoins 'beyond the crypto world'; work underway with banks on tokenised deposits and programmable payments. Retail Payments Infrastructure Board consultation issued 25 June, feedback by 11 September, then a Blueprint handed to an industry-owned delivery company.", "url": "https://www.bankofengland.co.uk/speech/2026/july/andrew-bailey-speech-at-manison-house", "images": []}, {"source_id": "boe", "source_name": "Bank of England", "thesis": "Breeden (City Week): vision of a multi-money retail system and a multi-asset, multi-currency tokenised wholesale market for the world's fifth-largest economy and largest net exporter of financial services. Shared ledgers, smart contracts and atomic swaps extend DvP/PvP to a wider set of assets intraday. Warns that a regulated system that fails to deliver at the technological frontier is vulnerable to activity migrating outside the perimeter or offshore and reaching systemic scale fast. Chris Woolard appointed government Wholesale Digital Markets Champion.", "url": "https://www.bankofengland.co.uk/speech/2026/may/sarah-breeden-speech-at-city-week-the-future-of-money-in-a-digital-world", "images": []}, {"source_id": "boe", "source_name": "Bank of England", "thesis": "Benjamin (OMFIF): frames everything the Bank does through money's three functions. On the unit-of-account leg, singleness requires all forms — bank accounts, notes, digital coins — exchangeable at par; the Bank's proposed systemic stablecoin regime requires high-quality backing assets including central bank deposits so coins redeem promptly at par, plus operational resilience requirements and supervisory oversight. Vision: cash, bank deposits, tokenised deposits and stablecoins coexisting with central bank money as the anchor of trust.", "url": "https://www.bankofengland.co.uk/speech/2026/july/nathanael-benjamin-speech-at-omfif", "images": []}, {"source_id": "federal_reserve", "source_name": "Federal Reserve", "thesis": "Fed staff assessment: tokenised deposits are legally still bank deposits, remain on bank balance sheets, are deposit-insurance eligible and used by institutions for 24/7/365 interbank settlement, treasury, cross-border payments and collateral — consistent with M1 (small tokenised time deposits would be non-M1 M2). Tokenised MMFs sit in non-M1 M2 today under Rule 2a-7 with 1–2 business day redemption, but could migrate to M1 if medium-of-exchange use dominates. GENIUS Act payment stablecoins must be 1:1 collateralised by T-bills and bank deposits, cannot pay interest directly, and could be classified either way; issuer monthly reserve reports give a data foundation, but standardised reporting, double-counting adjustments and geographic attribution are unresolved.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/new-forms-of-money-and-the-u-s-monetary-aggregates-20260904.html", "images": []}, {"source_id": "boe", "source_name": "Bank of England", "thesis": "Cleland: argues for preserving choice across the full payments spectrum — physical cash through commercial bank money to new digital forms — on financial inclusion, system resilience and competition grounds, as payments become more digital, more cross-border and more interconnected.", "url": "https://www.bankofengland.co.uk/speech/2026/may/victoria-cleland-fireside-chat-at-the-currency-research-banknote-conference", "images": []}, {"source_id": "deutsche_bank", "source_name": "Deutsche Bank", "thesis": "Deutsche Bank flow (Paul Maley, Global Head of Trust and Securities Services; Sabih Behzad, Head of Digital Assets and Currencies Transformation): tokenised assets are a ~$60bn market today, but BCG's strong-growth scenario has tokenisation at ~16% of global investable assets by 2035, worth ~$88trn. EY-Parthenon/Coinbase find 73% of institutional investors plan to increase digital asset allocations in 2026 and 81% prefer regulated vehicles. Infrastructure milestones: DTCC's tokenisation service for the Russell 1000, index ETFs and US Treasuries is expected live October 2026; Clearstream's CSDR-compliant tokenised securities platform launched November 2025; almost 200 European crypto-asset service providers are MiCA-authorised for custody. Payments reality check: under 1% of 2025 stablecoin volume was real-economy payments, and non-yield-bearing stablecoins are pushing FIs toward tokenised deposits and money-market funds - PayPal's 2025 intercompany settlement pilot moved over $1bn across three continents, cutting a Singapore-to-US dividend repatriation from days to hours. GFMA estimates a global bank with $100bn daily repo volumes could save $150-300m via DLT settlement. Security: TRM Labs recorded a record 207 crypto hacking incidents in H1 2026 and Elliptic estimates $21.8bn laundered cross-chain.", "url": "https://flow.db.com/Topics/trust-and-securities-services/custody-the-bridge-between-digital-assets-and-mainstream-finance", "images": []}, {"source_id": "galaxy_digital", "source_name": "Galaxy Digital", "thesis": "SEC proposes the first substantive transfer-agent rule overhaul since the late 1970s/80s, expressly recognising blockchain and DLT as permitted recordkeeping media, alongside a Sept 17 roundtable on 24-hour trading. The 24/7 rails are already going in: consolidated data feeds 9pm Sunday-8pm Friday (approved June 26), NSCC 24x5 clearing live June 29, overnight price bands approved Aug 5 (no automatic trading pause), FINRA TRF hours extending Dec 6. JPMorgan's Kinexys processes ~$7bn/day and >$4tn since inception. Galaxy and transfer agent Superstate already record legal ownership of GLXY shares onchain on Solana, though restricted to allowlisted wallets. Peirce's question of whether wallet addresses can replace names and physical addresses opens the bearer-instrument debate and the unresolved problem of aggregating wallets for 13D/13G and Section 16 thresholds.", "url": "https://www.galaxy.com/insights/research/sec-transfer-agent-rules-blockchain-24-7-stock-trading-bearer-tokens-ownership", "images": []}, {"source_id": "coinshares", "source_name": "CoinShares", "thesis": "Brazil case study on the limits of state-led tokenization: after privacy tests failed and pilot participants Microsoft and EY pulled back, the BCB stripped blockchain out of Drex entirely in November, leaving 'crypto without the chain.' It pivoted to regulating private markets — three November 2025 resolutions operationalising the 2022 Virtual Assets Law, plus an April resolution effective Oct 1 banning electronic FX providers from settling overseas remittances in stablecoins (hitting Nomad, Braza Bank). Context: Brazil ranks 5th in Chainalysis's 2025 adoption index (up from 10th), processes $6-8bn/month with stablecoins up to 90% of reported volume in some months, and ~25m Brazilians (~12%) hold or transact crypto. Pix has moved ~$16tn since November 2020, >7x Brazil's $2.2tn 2024 GDP, and is used by ~93% of adults. B3 is launching a BRL stablecoin and tokenisation platform to fill the Drex gap.", "url": "https://coinshares.com/insights/the-node/por-how-brazil-is-embracing-crypto-without-the-chain/", "images": []}, {"source_id": "coinshares", "source_name": "CoinShares", "thesis": "Institutional distribution widened: Standard Chartered became the first G-SIB to offer institutional spot BTC/ETH trading in the UAE; Hargreaves Lansdown, the UK's largest investment platform, began offering nine BTC and ETH ETNs (CoinShares, BlackRock, Invesco, WisdomTree, 21Shares, Bitwise) after UK retail restrictions relaxed; Revolut won conditional OCC approval for a US national bank charter targeting 2027; Coincheck/Monex partnered with DFNS on Japanese institutional custody; SBI is moving trade finance onchain via SBI XDC Network APAC.", "url": "https://coinshares.com/insights/research-data/equities-update-08-09-2026/", "images": []}, {"source_id": "chainalysis", "source_name": "Chainalysis", "thesis": "OFAC sanctioned Xinbi Guarantee on Sept 9, 2026, plus SafeW Technology and Anwen Technology. Xinbi has processed >$24bn in digital assets and fiat since ~2022; the 52 OFAC-designated addresses received over $8.4bn in stablecoins. DOJ's Scam Center Strike Force seized two wallets holding ~$12m and restrained 47 more, >$52m restrained in total; a federal court authorised seizure of Xinbi's Telegram channels on Sept 7. DPRK-linked actors laundered tens of millions from the $1.5bn Bybit and $235m WazirX hacks through 'Black U' vendors that substitute traceable stolen funds for less-tainted stablecoins drawn from scam proceeds. Chinese-language laundering services process ~20% of i
