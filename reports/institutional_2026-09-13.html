<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Institutional Research</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #7c3aed;          /* purple — institutional report accent */
  --accent-soft: #f3eefc;
  --divergence: #d94052;      /* divergence red */
  --consensus: #15803d;       /* consensus green */
  --yellow: #fff5b3;

  /* category colors (institutional schema: rates, growth, fx, equities,
     credit, crypto, energy, commodities, geopolitics, ai_tech, em) */
  --cat-rates: #2563eb;
  --cat-growth: #d97706;
  --cat-fx: #0891b2;
  --cat-equities: #15803d;
  --cat-credit: #be185d;
  --cat-crypto: #8b5cf6;
  --cat-energy: #dc2626;
  --cat-commodities: #ea580c;
  --cat-geopolitics: #b91c1c;
  --cat-ai_tech: #4f46e5;
  --cat-em: #059669;
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 980px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 12px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* STATS BAR (top: period + coverage) */
.stats-top { margin-bottom: 16px; padding: 8px 12px; background: var(--surface);
             border: 1px solid var(--border); border-radius: 6px;
             font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
             color: var(--text-2); display: flex; gap: 16px; flex-wrap: wrap; }
.stats-top strong { color: var(--text); font-weight: 600; }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--accent); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 10px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* THEME CARD (Section A) */
.theme { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.theme:last-child { border-bottom: none; }
.theme-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
              flex-wrap: wrap; }
.theme-title { font-weight: 600; font-size: 14.5px; }
.theme-stance { display: grid; grid-template-columns: 1fr; gap: 6px; margin-bottom: 10px; }
@media (min-width: 720px) { .theme-stance { grid-template-columns: 1fr 1fr; } }
.theme-line { font-size: 13px; padding: 8px 10px; border-radius: 4px;
              border-left: 3px solid var(--border); background: #fafafa; line-height: 1.5; }
.theme-line.consensus { border-left-color: var(--consensus); background: #f0f9f3; }
.theme-line.divergence { border-left-color: var(--divergence); background: #fdf6f7; }
.theme-line .lbl { font-family: 'IBM Plex Mono', monospace; font-size: 10px;
                   text-transform: uppercase; letter-spacing: .06em;
                   color: var(--text-3); display: block; margin-bottom: 2px; }
.theme-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
               border-left: 2px solid var(--border-light); }
.theme-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-source { font-weight: 600; color: var(--accent); }
a.item-source { text-decoration: none; }
a.item-source:hover { text-decoration: underline; }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-title { font-weight: 600; font-size: 14px; margin: 4px 0 6px; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }

/* DEEP READS (Section C) — purple left border to mark flagship long-form */
.section-deepreads .item-card { border-left: 4px solid var(--accent); background: var(--accent-soft); }

/* HOUSE VIEWS — compact one-line-per-source list */
.hv-row { display: flex; gap: 10px; align-items: baseline;
          padding: 6px 16px; border-bottom: 1px solid var(--border-light);
          font-size: 13px; }
.hv-row:last-child { border-bottom: none; }
.hv-name { font-weight: 600; color: var(--accent); min-width: 180px;
           text-decoration: none; }
.hv-name:hover { text-decoration: underline; }
.hv-stance { color: var(--text); flex: 1; }

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 110px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .hv-row { flex-direction: column; gap: 2px; }
  .hv-name { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

<script>
const REPORT_DATA = {"report_type": "INSTITUTIONAL RESEARCH", "collected_at": "2026-09-13T02:01:45.000Z", "period": {"lookback_days": 10, "from": "2026-09-03", "to": "2026-09-12"}, "input_stats": {"total_articles": 362, "sources_present": 52, "after_filter": 333}, "summary": "**Rates and central banks:** every desk now has a Fed hike as the base case rather than a tail risk — **UBS** abandoned its 'on hold through 2026' call for **25bp in September and December** (fed funds **3.50-3.75% → 4.00-4.25%**, with 2s to **4.25%** and 10s to **4.5%** by June 2027), **Standard Chartered** calls a 25bp 'credibility' hike most likely, **Goldman's** desk cites ~**84%** priced odds, and the **ECB** has already moved **25bp to a 2.50% deposit rate**. The split is over what it means: Goldman's **Jonathan Shugar** argues it is now 'more dangerous not to hike because you might lose control of the back end', **Citi's** Adam Pickett and Giammarco Miani say the yield move is economic strength and real yields — 'not fiscal stress' — and they are not worried at all, while **BCA Research** reads the same **0.4% m/m August CPI** as guaranteeing one hike with 'no evidence of broadening inflation pressures or second-round effects' and stays at benchmark equity weight. The UK is the same argument in miniature: **BoE**'s **Huw Pill** has voted for **4%** against a **3.75%** hold, **Alan Taylor** puts neutral at **3%** and wants cuts resumed, and **Catherine Mann** sits in between on an 'activist hold'.\n\n**Middle East energy shock:** the single dominant macro driver of the report. **Wood Mackenzie** has **Brent above $108** (first time since May), **US retail diesel at a record ~$5.98/gal** and **Saudi August output at 6.238 mb/d, the lowest since 1990**; **OPEC+**'s seven voluntary-adjustment countries held October production flat on 6 September; **RBC's Helima Croft** has ~**9 mb/d** of Middle Eastern supply effectively offline with diplomacy 'fundamentally deadlocked' and expects to write another war-anniversary note in February 2027. The sharpest divergence is on whether any of it matters: **Standard Chartered** forecasts **WTI $90/bbl in three months** — below spot — on the view the administration is incentivised to broker normalisation before the November midterms, **Gavekal's Louis-Vincent Gave** argues that above **$5/gallon** diesel 'few good things happen' and that energy equities have replaced government bonds as the antifragile hedge, and **Oxford Economics** takes the opposite side entirely, saying it has 'long argued that the impact of geopolitical shocks on economic activity is overstated' and that prolonged Hormuz disruption 'needn't result in oil prices ratcheting higher'.\n\n**AI capex and the long end:** the houses agree on the scale — **UBS** at ~**$900bn** of global AI capex in 2026 and ~**$1.2trn** in 2027, **Goldman** at ~**$800bn** of hyperscaler capex this year rising to ~**$1.2trn**, worth roughly **1% of global GDP** of new borrowing competing for global savings, with 30-year USTs at ~**5.2%** and the 10-year printing **4.85-4.97%**. They disagree on the mechanism and the payoff: **Gavekal's Will Denyer** makes the contrarian case that AI infrastructure fundraising — not deficits, QT or Fed hikes — 'may be the biggest driver' of the 2026 yield rise, so the bond call hinges on the duration of the capex boom; **BNP Paribas AM** publishes the sharpest dissent on returns, with AI capex at a record high while US productivity growth sits at just **2.2%**, unlike 1996-2000, and Chris Iggo arguing 10-year yields 'should be looking at 5%'. The most actionable expression is **Man Group's**: buy **AA-rated data-centre ABS at 155-175bp** against **AA unsecured paper from the same hyperscalers at 45-70bp** — roughly **100bp** paid for the instrument that also has the collateral.\n\n**US equities:** the constructive case rests on earnings, not multiples — **UBS** forecasts **S&P 500 EPS +25% in 2026 and +14% in 2027** with global equities only **1.9%** below their August high, **Goldman** notes **~30% Q2 earnings growth** on a **19x** multiple (the 10-year average), and **T. Rowe Price** points to US capacity utilisation of **76.29** as evidence the cycle is early-to-middle innings. The spread of conviction is wide: Goldman's desk tells clients the S&P is 'probably well over **8,000**' by year-end or next year, **Oxford Economics** stays 'relatively upbeat on the US versus the consensus', **T. Rowe Price** runs only a modest overweight as buy-the-dip with **international value as explicit AI-selloff insurance**, and **BCA** holds at benchmark — while **PIMCO** argues the whole trade is mispriced, since equity earnings yields are now level with a **5.03%** Agg yield and investors are accepting full downside plus record index concentration for thin incremental return.\n\n**Crypto:** **Bitcoin is consolidating around $80k** after a fiscal-driven run from the low **$60ks**, and everyone agrees it is trading like gold on the debasement trade rather than as a crypto-native move. **CoinShares** makes the Fed the ceiling — sticky core CPI raised September hike odds and flipped digital-asset product flows from **+$1.3bn** to **-$243m** week-to-date — while arguing the paradox that the Treasury buyback's failure to suppress long yields is medium-term bullish because it invites a 'bazooka' intervention. **Delphi Digital** counters that 'alt season is already here' and can run without a Bitcoin breakout (**HYPE** at all-time highs ~$80, Zcash, Lighter ~$4); **Galaxy** is structurally the most bullish (**$250k by year-end 2027**) but near-term cautious below **$100-105k** and is the sceptic on exactly the **DAT** revival CoinShares reports, arguing **Strategy's** perpetual preferreds decumulate the treasury they claim to monetise (mNAV at ~**1.07x**, **3,588 BTC** sold for ~**$216m** to fund dividends). On the **$320m Liquid** exploit, **Chainalysis** reports the outcome neutrally while **Galaxy's Alex Thorn** calls holding 15% of stolen funds 'extortion, not white-hat'.\n\n**China and EM:** **Capital Economics** and **Brookings** are both building a 'China Shock 2.0' thesis — Neil Shearing calls Chinese manufacturing dominance a defining decade-long force with a persistent external surplus widening the imbalances 'that have a habit of foreshadowing crises', and Brookings' panel works to the EU's **October** deadline with the EU-China trade surplus above **$1bn a day**. **Gavekal's Thomas Gatley** pushes back directly and by name on the premise: listed Chinese capex has been falling since 2024 and now only offsets depreciation, so 'China's excess capacity problems should no longer be worsening'. On the trade itself, **BNP Paribas AM's Zhikai Chen** makes the strongest bull case — **EM +22% YTD in USD vs +13% for MSCI World**, driven by a migration of free cash flow from ~**$860bn** of hyperscaler capex to **>$300bn** of FCF at three Asian memory and foundry titans — while his own colleague **Daniel Morris** is the in-house sceptic, decomposing the outperformance into two narrow waves and noting 'the rest of emerging market stocks have performed largely in line with their developed market peers'.\n\n**Dollar and reserve assets:** two independent sources land on the same conclusion against the de-dollarisation narrative. **Federal Reserve** staff (Colin Weiss) rebut the **ECB's** own June 2026 claim that gold has overtaken Treasuries, showing the 2025 crossover was price-driven by private **ETF** inflows rather than official buying and that, excluding the five legacy holders, foreign official Treasury holdings exceeded gold by about **$1trn** in June 2026; **PIIE's Martin Chorzempa** shows the yuan's SWIFT payment share **peaked at 4.7% in July 2024 and has fallen to 2.75%** — sixth globally, behind the Canadian dollar — while the dollar's share of global FX turnover **rose from 87% to 89%**. Gold itself is still bid on official demand: **Goldman's** Tony Kim calls the pullback 'an elongated pause' with **$4,000/oz** a solid floor against central-bank buying of **1,000-1,100 tonnes/year**, while **UBS** refuses to trade it at all, insisting gold is 'a portfolio hedge and diversifier, rather than a tactical expression of the next Fed decision'.", "sections": {"A_debates": [{"theme": "Rates & Central Banks (US): The September Fed Hike, Warsh's Reaction Function and the Credibility Question", "category_tags": ["rates", "growth"], "consensus": "Across bulge-bracket desks, regional banks and the independents, a September hike is now the base case rather than a tail risk. UBS formally abandoned its 'unchanged through 2026' call after August payrolls printed +162,000 (private +127,000) against a consensus of 55,000, with 55,000 of upward revisions lifting the three-month private average to 75,000 versus a 0-60,000 breakeven, unemployment steady at 4.1% and July PCE at 3.7% y/y; it now expects 25bp hikes in September and December, taking fed funds from 3.50-3.75% to 4.00-4.25%. Goldman's cross-asset desk cites roughly 84% market-implied odds for the September meeting and 50bp before year-end. Standard Chartered calls a 25bp 'credibility' hike 'most likely', noting Chair Kevin Warsh has described the current 3.75% policy rate as not restrictive and that accelerating PPI (headline 5.4% y/y, core 4.6%) plus average hourly earnings at a five-year-low 3.1% y/y met its own preconditions. BCA Research agrees the 0.4% m/m August CPI 'locks in September'. Warsh's Jackson Hole demand that inflation move to 2% 'clearly and at sufficient speed' is the common anchor, and BNP Paribas notes market pricing now implies at least one Fed hike, another ECB hike and close to two from the Bank of England.", "divergence": "The houses split hard on how far this runs and what it signals. UBS's fixed income CIO Leslie Falconio frames the destination as two, maybe three hikes partially reversing the 2025 easing rather than an 'exponential' 100-125bp cycle, and argues that nd rates volatility 'that serves no good economic purpose'; Stephen Miran argues forward guidance simply shifted volatility from the short run to the long run and wants the policy dot abolished but the economic dots kept; Don Kohn takes the middle view that dropping specific guidance is fine away from the zero bound but Warsh's refusal to describe how the committee sees the economy 'is not helpful' and is unsustainable. BNP's Group Chief Economist Isabelle Mateos Y Lago widens it to fiscal dominance, and CoinShares supplies the cross-asset read-through — the same CPI print flipped digital-asset product flows from +US$1.3bn to -US$243m week-to-date.", "items": [{"source_id": "ubs", "source_name": "UBS", "thesis": "UBS CIO changed its Fed call after August payrolls: +162,000 nonfarm (private +127,000) vs consensus 55,000, plus 55,000 of upward revisions lifting the 3-month private average to 75,000 against a 0-60,000 breakeven; unemployment steady at 4.1%; July PCE inflation at 3.7% y/y. UBS now expects 25bp hikes in September and December, taking fed funds from 3.50-3.75% to 4.00-4.25%, and raised its Treasury forecasts to 4.25% on 2s by June 2027 (+100bp vs prior) and 4.5% on 10s (+40bp). Monthly core prints near 0.3% would support a third hike; six-month annualised inflation below 2.5% could postpone the second.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-07092026.html", "images": []}, {"source_id": "ubs", "source_name": "UBS", "thesis": "UBS framed the September decision as 'finely balanced' and published two scenarios: 'AI liftoff' (US growth 2.5-3.0% in 2026 and 2027, inflation above target, Fed hikes up to three times as the FOMC revises productivity higher - a constructive form of tightening) versus a 'policy test' (two hikes into sticky inflation and muted growth - a less favourable form). Guideposts: private jobs above 50,000 with unemployment at/below 4.1% points to the upside case; jobs under 20,000 with unemployment at 4.2%+ alongside hot CPI points to the adverse one.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-04092026.html", "images": []}, {"source_id": "goldman_sachs", "source_name": "Goldman Sachs", "thesis": "Goldman's Jonathan Shugar (head of cross-asset sales) reads the post-CPI reaction as the market telling the Fed to hike - roughly 84% odds priced for next week and 50bp before year-end - and argues the bigger danger is not hiking, because the Fed would risk 'losing control of the back end.' He notes the hot print was driven by communication services rather than shelter or goods.", "url": "https://www.goldmansachs.com/insights/the-markets/what-a-fed-rate-hike-could-mean-for-us-stocks", "images": []}, {"source_id": "citi_gps", "source_name": "Citi GPS", "thesis": "Citi Research (Adam Pickett, Giammarco Miani) argue markets should not be scared of US Treasury yields: the rise is driven by economic strength with real yields doing most of the heavy lifting, not inflation fears or Treasury market stress. They flag more risk of a September hike than markets are pricing, and see Fed uncertainty - divergent policymaker views under the new communication regime - as the key source of near-term volatility and possible policy surprise.", "url": "https://www.citigroup.com/global/insights/should-markets-be-scared-of-us-treasury-yields", "images": []}, {"source_id": "bnp_paribas", "source_name": "BNP Paribas", "thesis": "BNP Paribas AM's Chris Iggo: the ECB raised 25bp to a 2.5% deposit rate this week and pricing implies at least one more Fed hike, another from the ECB and close to two from the BoE. With Brent back above $100 and inflation swaps rising since August, he doubts inflation returns to target soon, and argues nominal GDP trend growth justifies US 10-year yields around 5% (already reached in the UK). He does not expect the cycle to exceed the 2023 peak in rates - which, he points out, did not cause a global recession.", "url": "https://viewpoint.bnpparibas-am.com/view-from-the-markets-tightening-again/", "images": []}, {"source_id": "jpmorgan", "source_name": "JPMorgan", "thesis": "J.P. Morgan flags the 15-16 September FOMC as a hike-or-hold coin flip after Warsh said there is still 'work to do' on inflation, with the decision hinging on the inflation and labour-market data (brief house-view note; limited detail beyond the framing).", "url": "https://www.jpmorgan.com/insights/markets-and-economy/economy/kevin-warsh-work-to-do-fighting-inflation-what-to-expect-september-2026-federal-reserve-meeting", "images": []}, {"source_id": "goldman_sachs", "source_name": "Goldman Sachs", "thesis": "Goldman Sachs Top of Mind / Exchanges: Warsh has moved the Fed to shorter statements, less forward guidance and a reduced role for projections. Hatzius defends reaction-function transparency (faster transmission, better pricing) while conceding the dot plot is weak Delphic guidance at most. Miran argues forward guidance shifted volatility from the short run to the long run and produced concrete policy errors (MBS purchases with home prices +20%, SVB's duration extension), wants the policy dot removed but the economic dots kept. Kohn wants a narrative without a path and thinks Warsh's silence is unsustainable - and Hatzius warns the 'cacophony could get worse' if regional Fed presidents keep speaking while central communication shrinks.", "url": "https://www.goldmansachs.com/insights/goldman-sachs-exchanges/how-will-less-fed-transparency-affect-markets-and-the-economy", "images": []}, {"source_id": "bnp_paribas", "source_name": "BNP Paribas", "thesis": "BNP Paribas Group Chief Economist Isabelle Mateos Y Lago: central bank independence faces its biggest stress test in over 30 years, caught between high G7 debt (post-war highs, still rising on current policy), supply-shock-driven inflation that rate hikes cannot fix (they can only prevent a wage-price spiral), and political attack. The fiscal-dominance channel is concrete: average government debt maturity is falling across most G7 countries, especially the US, and the US Treasury plans to accelerate this via much larger buybacks of long-dated debt financed by short-term issuance - which makes the sovereign more sensitive to central bank rate setting. She flags Trump's pressure on the Fed, Japanese political pressure on the BoJ to keep yields low, and a leading French presidential candidate advocating that the eurosystem 'cancel' the ~18% of French public debt it holds. With sovereign debt now traded predominantly by hedge funds rather than patient reserve managers and pension funds, market reactions are 'brutal and could be unforgiving.'", "url": "https://viewpoint.bnpparibas-am.com/central-bank-independence-faces-its-biggest-stress-test-so-far-this-century/", "images": []}, {"source_id": "standard_chartered", "source_name": "Standard Chartered", "thesis": "Base case is a 25bp Fed hike at the September FOMC - a 'credibility' hike. Requirements SC set a week earlier were met: August payrolls +162k (almost 3x consensus, ~60% of gains in leisure/hospitality and government), unemployment 4.1% with participation up, average hourly earnings down to a five-year low 3.1% y/y, and accelerating headline/core PPI. Residual risk is that the Fed balks under Trump-administration pressure, which SC says would trigger a short-term equity and bond sell-off on Fed-independence doubts - to be bought.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-11-9-2026/?mvog=1", "images": []}, {"source_id": "moodys_analytics", "source_name": "Moody's Analytics", "thesis": "August CPI rose 0.4% m/m, above Moody's own 0.3% forecast and faster than July's 0.1%, with the year-ago headline rate holding; Moody's frames this as 'raising the odds of a rate hike next week'.", "url": "https://www.economy.com/economicview/analysis/423858/Economic-Roundup-Inflation-Runs-Hot-and-All-Eyes-Shift-to-the-Fed", "images": []}, {"source_id": "moodys_analytics", "source_name": "Moody's Analytics", "thesis": "Road to Recession tracker: both employment and inflation came in hotter than expected in August; the August employment report offers 'some optimism for stabilization in the labor market after a disastrous July report'.", "url": "https://www.economy.com/economicview/analysis/423855/US-Road-to-Recession-Heating-Up", "images": []}, {"source_id": "moodys_analytics", "source_name": "Moody's Analytics", "thesis": "High-frequency GDP model puts Q3 2026 US growth at 2% annualized - characterised as 'Subdued' - as the economy entered H2 2026.", "url": "https://www.economy.com/economicview/analysis/423849/US-HighFrequency-GDP-Update-Subdued", "images": []}, {"source_id": "bca_research", "source_name": "BCA Research", "thesis": "Felix-Antoine Vezina-Poirier, 11 Sep: August headline CPI in line at 0.4% m/m but slightly hot overall — 'CPI Locks In September,' guaranteeing a Fed hike on Wednesday — yet with no evidence of broadening inflation or second-round effects. Paired with 10 Sep PPI (+0.4% m/m final demand, up from an upwardly revised 0.1%), BCA calls it a 'fragile inflation setup': a renewed cost-push impulse without a wage-price spiral.", "url": "https://www.bcaresearch.com/marketing/felix-antoine-vezina-poirier", "images": []}, {"source_id": "bca_research", "source_name": "BCA Research", "thesis": "Labour data (4 and 8 Sep): August nonfarm payrolls rose 162k versus estimates of 55k with two-month revisions adding 55k, but BCA discounts the magnitude because the labour market is still not contributing much to inflation. The August NFIB Small Business Optimism Index fell more than expected to 98.7 on weaker expectations, reversing much of the hawkish signal. Canada broke the other way: employment fell 41.7k versus +15k expected after July's +75.1k, with wage growth slowing sharply.", "url": "https://www.bcaresearch.com/marketing/felix-antoine-vezina-poirier", "images": []}, {"source_id": "coinshares", "source_name": "CoinShares", "thesis": "Sticky CPI limits Bitcoin upside: headline in line, core marginally firmer, increasing the likelihood of a September hike. Flows flipped from ~US$1.3bn of inflows last week to US$243m of outflows week-to-date. The Treasury's expanded bond buyback programme has failed to suppress long-end yields despite larger long-dated purchases — which paradoxically becomes BULLISH for Bitcoin medium-term because it raises the odds of a far larger 'bazooka' programme, reinforcing fiscal-dominance and debasement concerns that support both BTC and gold.", "url": "https://coinshares.com/insights/research-data/market-update-11-09-2026/", "images": []}]}, {"theme": "Bank of England, ECB, BoJ and RBA: Tightening Into the Same Supply Shock", "category_tags": ["rates", "fx", "growth"], "consensus": "Outside the US the tightening chain is already running. Standard Chartered documents the ECB raising the deposit rate 25bp to 2.50% with Lagarde calling it a 'no brainer' and staff projections revised up (2027 growth 1.4% from 1.2%, 2027 headline inflation 2.5% from 2.3%, core 2.6% from 2.5%, 2028 inflation still above target at 2.1%), against euro-area August inflation of 3.3% — the highest in nearly three years on Middle East energy pass-through; it now forecasts a further 25bp to 2.75% by December. BCA confirms this was the ECB's second hike since the Iran war began in February. BoJ board member Kazuyuki Masu says rates must rise further with Japanese PPI at 7.6% y/y, and SC expects a hike next week, another in Q4 and possibly one each in Q1 and Q2 2027; the RBA has already hiked three times in 2026. In the UK, every MPC voice agrees Bank Rate has been on hold at 3.75% since March, that the February 2026 path back to target was derailed purely by the Gulf energy shock (April CPI 2.8% against a 2.0% February forecast), and that the decisive question is now second-round effects rather than the size of the shock — with Governor Bailey's 'we will ensure inflation returns to target... but it will take longer' the common baseline. Eurosystem QT meanwhile grinds on passively with no purchases in any portfolio and monetary policy securities at EUR3,360.7bn.", "divergence": "The MPC is openly three-way split. Huw Pill has voted for a higher Bank Rate of 4% and rejects wait-and-see outright — 'if you wait and then do not see, all you have done is waited' — arguing UK price-setting has structurally changed post-Brexit so that the Bank's new 'sticky-central' underlying CPI measure stays meaningfully above 2% through 2027 on an unchanged 3.75% path. Alan Taylor is the clear dove: he puts UK nominal neutral at 3%, calls 3.75% '75bps above neutral' and restrictive, cut his 2026 CPI peak to ~3.25% from the April MPR's 3.75%, notes wage growth has converged to 3-3.5% (target-consistent on 1% productivity) and that the DMP now shows firms expecting higher CPI but not higher wages, and concludes rates 'can and should resume their downward path to neutral' — possibly below it if slack widens. Catherine Mann sits between them: she was close to voting for a cut in early 2026 but now favours a longer hold with an explicit hike option, calling her June vote an 'activist hold' because nominal financial conditions had already tightened, and leaning on evidence that household attention turns non-linear above roughly 3-3.5% CPI and that firms only revise price expectations on Bank Rate moves of 50bp or more. In the euro area the disagreement is about how much is priced. Gavekal's Cedric Gemehl notes 2.50% already sits at the top of the ECB's own 1.75-2.50% neutral estimate, so the question is no longer whether it hikes again but how much braking further hikes imply, and he sees several factors pointing to more. BCA takes the opposite side, arguing the supply-driven nature of euro-area inflation 'should limit how far tightening extends into restrictive territory' — dovish against market pricing. Deutsche Bank's EMEA CIO Dirk Steffen is the outright contrarian, telling clients the market may be pricing more ECB rate rises over the coming 12 months than are likely to be delivered. Standard Chartered's own resolution is to trade the currencies in ranges rather than trends precisely because it thinks the hawkish shifts are already discounted.", "items": [{"source_id": "boe", "source_name": "Bank of England", "thesis": "Pill: has supported raising Bank Rate to 4% at recent meetings; Bank Rate held at 3.75% since March. Rejects 'wait-and-see' ('if you wait and then do not see, all you have done is waited'). Gulf uncertainty is 'bounded Knightian' and unlearnable; second-round effects are learnable but he sees higher risk than models estimated on the early-2000s 'halcyon days' imply, citing reduced UK market contestability post-Brexit and greater household attentiveness to energy/food prices. New Bank staff 'sticky-central' underlying CPI measure (July 2026 MPR Box C) has stepped down recently, but the BVAR projection on an unchanged 3.75% Bank Rate leaves underlying inflation stuck meaningfully above 2% in 2027 with upside risks, even as headline falls back.", "url": "https://www.bankofengland.co.uk/speech/2026/september/remarks-at-the-edinburgh-chamber-of-commerce", "images": []}, {"source_id": "boe", "source_name": "Bank of England", "thesis": "Taylor (external MPC, dovish): nominal neutral estimate 3% (matching COMPASS), so 3.75% is 75bp restrictive. Post-MoU, better energy curves plus an inflation print 0.4pp below expectations cut his expected 2026 CPI peak to ~3.25% from 3.75% in the April MPR. Wage growth has converged to 3–3.5%, which Bank staff see as target-consistent on 1% productivity; DMP firms now expect higher CPI but NOT higher wages — the price/wage expectation correlation has broken down in the last six months. Argues an extended hold is right for now, but rates 'can and should resume their downward path to neutral' under benign Scenario T, and could go below neutral if slack widens as in Scenario A.", "url": "https://www.bankofengland.co.uk/speech/2026/june/alan-taylor-speech-at-the-barclays-and-centre-for-economic-policy-research", "images": []}, {"source_id": "boe", "source_name": "Bank of England", "thesis": "Mann: entered 2026 close to voting for a cut; the Iran war revived the inflation/activity trade-off and shifted her to a longer hold with a hike option. Pre-war disinflation relied on fiscal one-offs: administered prices and employer NICs added 0.7pp to the 2025 inflation hump and the Autumn Budget energy package cut CPI by nearly 0.25pp. Cites thresholds of ~3–3.5% CPI above which household attention and expectations turn non-linear, with Citi/YouGov household expectations back inside that region. Bunn et al. (2026) show a rising share of state-dependent price-setters (upside inflation bias). Di Pace et al.: firms only revise price expectations on Bank Rate moves of 50bp or more. Says 2027 wage negotiations and H2 2026 expectations data are decisive for her next vote.", "url": "https://www.bankofengland.co.uk/speech/2026/july/catherine-l-mann-fireside-chat-at-the-natixis-cib-conference-on-private-debt", "images": []}, {"source_id": "boe", "source_name": "Bank of England", "thesis": "Bailey (Reykjavík): the Middle East conflict is 'a big negative supply shock'; pre-war UK inflation was on track to hit 2% from April, instead April printed 2.8% with 0.8pp of upside news from household energy. Defends 'constrained discretion' — the MPC's unspecified 'lambda' (weight on output) should be high for direct energy effects and low when anchoring is at risk. Confirms the open-letter trigger at 1pp deviation from the 2% target.", "url": "https://www.bankofengland.co.uk/speech/2026/may/andrew-bailey-speech-at-the-reykjavik-2026-economic-conference", "images": []}, {"source_id": "boe", "source_name": "Bank of England", "thesis": "Bailey (Mansion House, July): 'I was expecting inflation to return to its 2.0% target in around April or May... Well, that jinxed it.' Energy prices have returned to a bit above pre-conflict levels but with renewed volatility; inflation will return to target but 'it will take longer', in a 'fairly soft economic setting activity-wise.'", "url": "https://www.bankofengland.co.uk/speech/2026/july/andrew-bailey-speech-at-manison-house", "images": []}, {"source_id": "ecb", "source_name": "European Central Bank", "thesis": "Eurosystem consolidated financial statement, week ending 4 September 2026: total assets EUR5,912.2bn (-EUR3.2bn). Base money +EUR9.3bn to EUR3,967.8bn. Net open market operations/standing facilities -EUR3.6bn to -EUR1,977.0bn, driven by the deposit facility (EUR2,005.2bn, -EUR0.7bn). Monetary policy securities EUR3,360.7bn (-EUR2.6bn): PSPP EUR1,667.7bn (-EUR1.5bn redemptions), PEPP EUR1,284.6bn (-EUR0.3bn), CSPP EUR216.7bn (-EUR0.5bn), CBPP3 EUR189.7bn (-EUR0.3bn), ABSPP EUR2.0bn, SMP zero. No purchases in any portfolio. Gold and gold receivables EUR1,232.8bn; net FX position +EUR0.3bn to EUR350.1bn; banknotes in circulation EUR1,634.4bn; MRO EUR13.9bn (-EUR4.1bn), LTRO EUR14.3bn unchanged; revaluation accounts EUR1,208.2bn.", "url": "https://www.ecb.europa.eu/press/annual-reports-financial-statements/wfs/2026/html/ecb.fs260908.en.html", "images": []}, {"source_id": "standard_chartered", "source_name": "Standard Chartered", "thesis": "ECB hiked 25bp to 2.50% and SC now adds another 25bp to 2.75% by year-end on upgraded staff projections and Lagarde's hawkish tone (inflation above 2% for an 'extended period', 2028 forecast 2.1%). FX: EUR/USD gradual upside with resistance at 1.18 but capped by a Fed hike; USD/JPY downside risk to 150-152 on BoJ normalisation (hikes expected next week, Q4/December, possibly Q1 and Q2 2027); GBP/USD rangebound with bearish bias near 1.34; DXY capped near 99.8; some upside in EUR/GBP. Japan equity implication: prefers domestically geared financials (~60% domestic revenue, NIM beneficiaries) over healthcare (~80% overseas revenue) and autos.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-11-9-2026/?mvog=1", "images": []}, {"source_id": "standard_chartered", "source_name": "Standard Chartered", "thesis": "RBA: three hikes already in 2026, and a stronger-than-expected July CPI plus strong business investment and a tight labour market make a September hike more likely than previously expected - though back-to-back hikes in November are not the base case. AUD/USD at 0.72 and the Australian 10-year yield (+70bp over six months) should stay rangebound as the hawkish shift is priced.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-11-9-2026/?mvog=1", "images": []}, {"source_id": "moodys_analytics", "source_name": "Moody's Analytics", "thesis": "Europe Daily Briefing: UK GDP rose 0.4% m/m in July, showing surprising resilience against high energy prices and global uncertainty - but Moody's warns the coming months will test that durability.", "url": "https://www.economy.com/economicview/analysis/423856/Europe-Daily-Briefing-UK-Growth-Surprisingly-Strong-in-July", "images": []}, {"source_id": "bca_research", "source_name": "BCA Research", "thesis": "'The ECB's Energy-Driven Tightening' (10 Sep): the ECB hiked 25bp to a 2.50% deposit rate, its second hike since the Iran war began in February, but the supply-driven nature of the inflation should limit how far tightening extends into restrictive territory — a dovish counterpoint to market pricing.", "url": "https://www.bcaresearch.com/marketing/felix-antoine-vezina-poirier", "images": []}, {"source_id": "gavekal", "source_name": "Gavekal Research", "thesis": "Cedric Gemehl, 'Higher Rates; Uneven Pain' (11 Sep): the ECB's well-telegraphed 25bp hike puts the policy rate at 2.50%, the top of the ECB's own 1.75-2.50% neutral range, so the question is no longer whether it hikes again but how much further hikes brake eurozone activity. Lagarde ducked forward guidance with 'meeting-by-meeting, data-dependent,' but several factors point to more hikes near term.", "url": "https://research.gavekal.com/teaser/higher-rates-uneven-pain/", "images": []}, {"source_id": "deutsche_bank", "source_name": "Deutsche Bank", "thesis": "Deutsche Bank Private Bank's September 7 CIO Day readout (EMEA CIO Dr. Dirk Steffen): constructive longer term on equities because the driver is earnings, paired with heavy emphasis on risk management since 'this won't be a straight line up.' Contrarian rates note - he thinks the market may be pricing in more ECB rate rises over the coming 12 months than are likely to be delivered.", "url": "https://wealth.db.com/en/insights/investing-insights/cio-weekly-investment-outlook-podcast.html", "images": []}]}, {"theme": "Middle East Energy Shock, Oil, Diesel and LNG", "category_tags": ["energy", "geopolitics", "commodities", "rates"], "consensus": "This is the dominant macro variable across all six batches. Wood Mackenzie has Brent above US$108/bbl on 10 September, the first time since May, after Iranian and US strikes on tankers and Houthi gains on Yemen's Red Sea coast; ULSD in New York harbour traded above the equivalent of US$200/bbl, US retail diesel hit an all-time high of ~US$5.98/gallon and gasoline ~US$4.28 (+34% y/y). Supply data corroborate: Saudi August production fell to 6.238 mb/d, the lowest since 1990 and down ~1.9 mb/d m/m, with 7.122 mb/d supplied only by drawing storage, and the seven OPEC+ voluntary-adjustment countries met on 6 September and held October required production flat at September levels. RBC's Helima Croft puts roughly 9 mb/d of Middle Eastern supply effectively offline, Saudi Red Sea exports below 2 mb/d, ~3 mb/d of Russian refining capacity down from Ukrainian strikes and ~2.2 mb/d of Middle Eastern refining offline. Gavekal's Tom Holland logged Brent at US$99.68/bbl intraday on 9 September and Louis-Vincent Gave notes crack spreads have pushed diesel to nominal all-time highs worldwide. The Bank of England calls the Gulf shock 'a big negative supply shock' and abandoned a central forecast in April for scenarios A/B/C; the Federal Reserve calls it 'the largest global oil supply shock in history'. Everyone agrees the transmission runs through supply chains rather than demand, and that the rates channel is live — Wood Mackenzie logged the 10-year above 4.96% and the 30-year at ~5.37% on oil-driven inflation fears.", "divergence": "Duration and consequence are where the houses split, and the split is directly tradeable. Standard Chartered's Anthony Naab forecasts WTI at US$90/bbl in three months — below spot — with risks skewed higher, and argues explicitly that the administration has a clear incentive to facilitate Middle East normalisation before the November midterms with gasoline near US$5/gal; it prefers to hedge the tail with US TIPS at the portfolio level rather than own oil beta. RBC's Croft is the direct counterweight: diplomacy is 'fundamentally deadlocked' over Iran's June MoU terms (frozen funds, full sanctions removal, a $300bn reconstruction facility and formal Hormuz operational control rights), verbal intervention has passed peak effectiveness, Trump 'appeared today to accept the reality of higher energy prices' into the election, and she expects to be writing another war-anniversary note in February 2027 — while noting that with barrels stranded the old lever of 'previous White House calls to OPEC' is now futile because China, not Riyadh, is the swing player. Goldman's desk reads the market as already pricing transience: spot Brent around 104 but the one-year forward has 'a seven handle on it'. J.P. Morgan's Private Bank is the most relaxed of all — '$100 oil isn't as scary as it used to be'. Barclays takes the diametrically opposite structural view, arguing markets underestimate an 'energy addition era' requiring ~$3.6trn of annual investment (about three times planned AI infrastructure spend) with demand growing 1.9% annually through 2050, and Jon Hill and Pooja Sriram concluding the supply/demand mismatch raises inflation expectations, inflation volatility and inflation risk premia with the skew to the upside. Oxford Economics is the flat contradiction of Gavekal: its central case is simmering US-Iran tension and below-normal Hormuz traffic until at least end-2027, but it has 'long argued that the impact of geopolitical shocks on economic activity is overstated' and says prolonged disruption 'needn't result in oil prices ratcheting higher.' Wood Mackenzie's Ed Crooks draws the most consequential second-order conclusion — that the lasting legacy may be structural demand destruction through accelerated EV adoption, with a 2040 global EV fleet ~50% larger than base case — which is squarely at odds with OPEC's institutional argument that oil's role in power generation should expand from ~3% of global generation as electricity demand rises 85% by 2050. On gas, Wood Mackenzie warns this is a multi-year supply loss and not a spike: the Hormuz closure removed ~80 mmtpa at peak (about a fifth of global LNG supply, 90% of it east-bound), and Iranian strikes on Ras Laffan have removed significant Qatari export capacity for up to five years, so reopening the Strait does not restore normal. BlackRock quantifies the chokepoint at roughly 20% of global oil consumption and 20-25% of gas trade with a 10-to-14-day market buffer, and T. Rowe Price identifies crack spreads as the binding indicator, with its bull case requiring de-escalation that takes oil toward $50/bbl next year.", "items": [{"source_id": "gavekal", "source_name": "Gavekal Research", "thesis": "Tom Holland (9 Sep): with the US and Iran exchanging fire and Saudi/Houthi hostilities under way, Brent hit US$99.68/bbl intraday in Asian hours. Investors are tempted to shrug off another Gulf flare-up after equities set new highs over the summer, but inflation and inflation expectations march in lockstep with benchmark energy prices ('the economy is just energy transformed'), implying a US CPI uptick into September — against a consensus looking for no change in the August print due Friday.", "url": "https://research.gavekal.com/teaser/no-good-outcomes-for-energy-inflation/", "images": []}, {"source_id": "gavekal", "source_name": "Gavekal Research", "thesis": "Louis-Vincent Gave (7 Sep): soaring crack spreads have pushed diesel to nominal all-time highs worldwide. US diesel is now above US$5/gallon in real terms and higher across most of the OECD — still below the 2008, 2011-12 and 2022 real peaks, but above the level where trucking, farming, shipping, mining and construction margins deteriorate.", "url": "https://research.gavekal.com/teaser/the-record-high-diesel-prices/", "images": []}, {"source_id": "bca_research", "source_name": "BCA Research", "thesis": "GeoMacro: the latest Middle East escalation fits Iran's existing strategy of keeping oil prices elevated ahead of the US midterms, but attacks on energy infrastructure and tankers now threaten the recovery in regional crude exports — i.e. the tail risk has shifted from price-only to volume.", "url": "https://www.bcaresearch.com/marketing/felix-antoine-vezina-poirier", "images": []}, {"source_id": "oxford_economics", "source_name": "Oxford Economics", "thesis": "2027 outlook: the most likely scenario is simmering US-Iran tension and lower-than-normal Strait of Hormuz traffic until at least end-2027, but this 'needn't result in oil prices ratcheting higher.' Oxford has long argued the impact of geopolitical shocks on activity is overstated and a major downturn would need a separate trigger.", "url": "https://www.oxfordeconomics.com/resource/2027-economic-outlook-resilience-to-continue-but-the-risks-are-building/", "images": []}, {"source_id": "rbc", "source_name": "RBC Capital Markets", "thesis": "Brent back above $100 with US retail gasoline ~$4.20/gal and diesel ~$6.00/gal, 55 days before the midterms. ~9 mb/d of Middle Eastern supply effectively offline; in 24 hours the US sank five Iranian tankers near Kharg Island and Jask while Iran fired on two US Navy ships, eight tankers and US bases in Jordan. Saudi Red Sea exports below 2 mb/d. Refining is the acute problem: ~3 mb/d of Russian capacity offline from Ukrainian strikes, refiners lobbying for an RFS rollback the White House won't grant. China is the swing player - runs above 90% of pre-war levels, +18% from early-July lows; August crude imports +19% from June lows - ahead of a Xi-Trump summit.", "url": "https://www.rbccm.com/en/insights/2026/09/midterm-malaise", "images": []}, {"source_id": "rbc", "source_name": "RBC Capital Markets", "thesis": "Six months into the Iran war, a diplomatic offramp remains elusive. US naval escorts and ship-to-ship transfers lifted last week's inside-Hormuz exports ~1 mb/d above the four-week average, but ~8 mb/d of Middle Eastern exports remain disrupted and Yanbu losses offset the gain. ~2.2 mb/d Middle Eastern and ~3 mb/d Russian refining capacity offline; above-ground missile damage to refineries needs extended repair. China emerges as the war's clearest winner - just-in-case reserves absorbed the shock while crude imports were cut by 5+ mb/d at peak - and the Indo-Pacific redeployment of US assets may open Beijing a more assertive Taiwan window.", "url": "https://www.rbccm.com/en/insights/2026/09/inauspicious-anniversary-the-iran-war-at-six-months", "images": []}, {"source_id": "standard_chartered", "source_name": "Standard Chartered", "thesis": "WTI forecast at USD 90/bbl in three months with risks skewed to the upside; three triggers for an upgrade are prolonged Gulf export disruption (US crude stocks already below their five-year range), lasting damage to production/export infrastructure, and stronger-than-expected demand with China resuming buying. Largest downside risk is a credible Middle East normalisation, which the administration is incentivised to pursue before the November midterms with gasoline near USD 5/gal. Preferred hedge is US TIPS at the portfolio level rather than oil-sensitive exposure.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-11-9-2026/?mvog=1", "images": []}, {"source_id": "wood_mackenzie", "source_name": "Wood Mackenzie", "thesis": "Brent above US$108/bbl Thursday, first time since May, after Iranian and US strikes on tankers and Houthi gains on Yemen's Red Sea coast. ULSD in New York harbour >US$200/bbl equivalent; US retail diesel at a record ~US$5.98/gal, gasoline ~US$4.28/gal (+34% y/y). Saudi August production 6.238 mb/d, lowest since 1990, down ~1.9 mb/d m/m, with 7.122 mb/d supplied from storage. 10y UST >4.96% (highest since 2023), 30y ~5.37% (highest since 2007). Wood Mackenzie's July forecast had US GDP growing ~1.9% in 2026, upgraded from 1.7%. The 'Electric Shock' Horizons scenario maps a global 2040 EV fleet ~50% larger than base case; base case has EV passenger share at ~80% in China, ~70% in Europe and ~30% in the US by 2035, and world oil demand plateauing in the early 2030s. Jan-Jul 2026 BEV sales: France +69%, Germany +51%, UK +29% y/y; BEVs ~40% of China sales, ~30% in Thailand, ~25% in South Korea, but only ~6% in the US.", "url": "https://www.woodmac.com/blogs/energy-pulse/high-oil-prices-raise-prospect-accelerated-ev-sales/", "images": []}, {"source_id": "opec", "source_name": "OPEC", "thesis": "The seven OPEC+ countries with April/November 2023 additional voluntary adjustments — Saudi Arabia, Russia, Iraq, Kuwait, Kazakhstan, Algeria and Oman — met virtually on 6 September 2026 and decided to maintain September 2026 required production for October 2026, i.e. no further unwind. They reiterated commitment to full conformity with the Declaration of Cooperation; next monthly meeting 4 October 2026.", "url": "https://www.opec.org/pr-detail/1835613-6-september-2026.html", "images": []}, {"source_id": "opec", "source_name": "OPEC", "thesis": "OPEC advocacy piece (Feb 2026, outside the collection window but indicative of house framing): argues oil should not be excluded from closing the electricity access gap for 666 million people without power, 84% of them rural. Oil is ~3% of global generation today versus ~10% in the 1990s; with electricity demand expected to rise 85% by 2050, OPEC argues an expanded role for oil in generation should be considered, citing diesel gensets as the 'default workhorse' backup for critical infrastructure (~85% of US commercial backup generators, >60% worldwide).", "url": "https://www.opec.org/pn-detail/1582274-5-february-2026.html", "images": []}, {"source_id": "wood_mackenzie", "source_name": "Wood Mackenzie", "thesis": "Hormuz closure removed ~80 mmtpa at its peak, about a fifth of global LNG supply, with 90% of Hormuz LNG flowing east so APAC bears the brunt. Iranian strikes on Ras Laffan have removed significant Qatari export capacity for up to five years: reopening the Strait will not restore normal. Risk is backloaded into H2 2026 as regional grids hit record cooling loads with minimal flexibility. Country exposure depends on gas's share of the generation mix and supply diversity; one country scores highly on both and faces Gulf LNG at roughly seven times its domestic gas cost. Winners will be markets that add flexibility rather than import more Gulf gas; route and counterparty diversification is now a security requirement, and the hit to gas economics should accelerate renewables-and-storage pipelines.", "url": "https://www.woodmac.com/news/opinion/3-things-to-know-about-how-apac-power-systems-should-adapt-to-lng-disruptions/", "images": []}, {"source_id": "barclays", "source_name": "Barclays", "thesis": "Barclays Research Impact Series (Harry Mateer, Ajay Rajadhyaksha): the world is in an 'energy addition era', not substitution - every major energy source hit record demand last year including oil, gas, coal and renewables, with nuclear in renaissance. Barclays' proprietary model projects ~800 quad BTU of global energy demand by 2040 and ~$3.6trn of annual investment needed across resources, power, grids, storage and infrastructure. Grid investment is only about 40% of generation spending, a gap Barclays expects to close toward parity. Rajadhyaksha: 'The world is not substituting one energy system for another. It is running both simultaneously, and it does not have enough capital deployed in either.'", "url": "https://www.ib.barclays/content/barclaysmicrosites/ibpublic/en/our-insights/series/impact-series/the-global-energy-race.html", "images": []}, {"source_id": "goldman_sachs", "source_name": "Goldman Sachs", "thesis": "Goldman (Shugar) on geopolitics: spot Brent around 104 but the one-year forward has 'a seven handle', so the market treats the Iran disruption as a near-term problem; local product-side dislocations (gasoline, diesel, heating oil) look incrementally worse for Europe than the US. He also notes the duration of tariff-style dislocations has shortened since Covid and upside corrections are more violent - and flags Brazil, where investors are buying upside into the October election.", "url": "https://www.goldmansachs.com/insights/the-markets/what-a-fed-rate-hike-could-mean-for-us-stocks", "images": []}, {"source_id": "jpmorgan", "source_name": "JPMorgan", "thesis": "J.P. Morgan Private Bank: '$100 oil isn't as scary as it used to be' - higher oil prices are back in focus but consumers and investors appear better positioned to absorb the shock (brief house-view framing).", "url": "https://www.jpmorgan.com/insights/markets-and-economy/top-market-takeaways/tmt-100-dollar-oil-isnt-as-scary-as-it-used-to-be", "images": []}, {"source_id": "blackrock_investment_institute", "source_name": "BlackRock Investment Institute", "thesis": "BlackRock: US and Israeli strikes on Iran and its senior leadership triggered retaliation across Israel and Gulf states; US crude +8%, US stock futures -1%, European shares -2% on the day. Three variables govern the outcome — duration of hostilities, degree of disruption to energy transit, and political end-state. Firepower constraints and political blowback may mean weeks, not longer. Oil is globally fungible but gas markets are regionally segmented, implying sharper LNG dislocations under severe disruption. Bottom line: no change to investment views; lean against over-reactions.", "url": "https://www.blackrock.com/corporate/insights/blackrock-investment-institute/publications/middle-east-conflict-2026", "images": []}, {"source_id": "t_rowe_price", "source_name": "T. Rowe Price", "thesis": "T. Rowe Price: a meaningful share of global refining capacity is offline, creating a diesel and refined products squeeze — crack spreads are the key indicator because refining capacity is the immediate constraint, and the mix is stagflationary (adds to inflation while weakening growth). The bull case requires Middle East and possibly Russia-Ukraine de-escalation taking oil toward $50/bbl next year.", "url": "https://www.troweprice.com/en/us/insights/Why-the-bull-case-is-still-in-play-for-equity-markets", "images": []}, {"source_id": "boe", "source_name": "Bank of England", "thesis": "Dhingra: energy price spikes coincided with eight of the ten UK episodes with inflation near/above 5%; energy and energy-intensive components were more than three-quarters of peak 2022–23 inflation. Energy is ~8% of CPI basket costs in 2023 including inter-industry linkages (6.4% in 2019). US LNG has gone from marginal to the largest single source of seaborne LNG into the EU. Climate channel: Kotz et al. put 2022 extreme heat at +0.43–0.93pp on euro-area food inflation, and by 2035 higher temperatures could add 0.32–1.18pp to global headline and 0.92–3.23pp to global food inflation under high emissions. Chocolate alone added ~1pp to UK food inflation in 2025 (cocoa, West African heat, ~6% of the UK food basket); Greek olive oil +64% was ~half of Greek headline food inflation in April 2024. NOAA: 63% probability the current El Niño becomes a very strong event in late 2026–early 2027. Carbon taxes add only ~0.1–0.15pp/yr.", "url": "https://www.bankofengland.co.uk/speech/2026/june/swati-dhingra-panel-at-the-world-resources-institute-workshop", "images": []}]}, {"theme": "AI Capex, the Long End of the Curve and Credit Risk", "category_tags": ["ai_tech", "rates", "credit"], "consensus": "Nobody disputes the scale or that the financing has become a macro variable. UBS puts global AI-related capex at ~$900bn in 2026 and ~$1.2trn in 2027; Goldman's analysts have hyperscalers at ~$800bn this year and ~$1.2trn next; BNP Paribas puts top-five US hyperscaler capex at ~$860bn in 2026, exceeding $1trn by 2027; Man Group cites a Morgan Stanley estimate that total outstanding debt for AI-related borrowers is growing at roughly four times last year's pace. Goldman sizes the incremental AI borrowing at roughly 1% of global GDP competing for the same pool of global savings. The long end has repriced accordingly: Goldman Sachs Research has 30-year USTs around 5.2% on 8 September, the highest in more than two decades, with JGB and gilt yields at century highs and Bunds the highest since 2009; UBS has the 10-year at 4.85% and the 10-year Bund at a post-2011 high of 3.44%; Standard Chartered has the 10-year at a three-year high of 4.97%, the 30-year at 5.37% (highest since 2007) and the 2-year at 4.59%. Everyone agrees the Treasury's response has underwhelmed — buybacks of only up to $6bn of longer-dated debt against a $7-8bn market expectation.", "divergence": "The genuine fights are over causation and over whether any of this is showing up as productivity. Gavekal's Will Denyer runs through the usual suspects — QT, deficits swollen by tariff refunds and the Iran war, expected Fed hikes, rising JGB yields pulling capital home — and then argues 'the biggest driver may be something else entirely': the extraordinary sums being raised to fund AI infrastructure, which makes the duration of the AI capex boom the key variable for long-bond investors rather than the fiscal path. That is contrarian against Goldman's fiscal-first framing, where George Cole stresses how orderly the move has been ('the absence of a vol spike makes it hard to claim that we're fundamentally mispriced') and sees 'little evidence that these issuance responses can meaningfully impact the broader level of yields — even at the long end', with energy-inflation worries possibly fading over six months while 'what won't go away is the fiscal concerns.' Goldman CEO David Solomon shrugs at the level outright: a 5% 30-year term premium 'is not a calamity' and the 30-year around 5.25% 'reflects underlying market fundamentals.' On the productivity payoff, BNP Paribas AM publishes the sharpest dissent in the whole report — AI capex at a record high while US national productivity growth runs at just 2.2% and, unlike 1996-2000, is not rising with capex: 'technological breakthroughs can arrive quickly, but their benefits can take longer to show up, if at all.' Oxford Economics quantifies the same scepticism, putting baseline US productivity gains at only 3.5% over the next decade and 4.5% long run, deliberately 'towards the cautious end' of a published range from ~1% to more than 12%, with an AI Disappointment scenario cutting 2030s world growth to ~2.2% from a 2.4% baseline. Gavekal's Tan Kai Xian attacks the Fed's own framework, noting that solid US productivity growth since late 2022 has coincided with rising rather than falling inflation because a worker shortage, not AI, is the binding supply constraint. The credit expressions diverge most of all. Man Group turns the concern into a long: since early 2025 AA-rated data-centre ABS have paid 155-175bp versus 45-70bp for identically rated unsecured corporate paper from the very firms building the assets — roughly 100bp for the instrument that also carries subordination, overcollateralisation, covenants and a direct claim on the buildings and rent — which Man reads as a liquidity and complexity premium, not fundamental credit risk, with the real danger being technical LTV-triggered downgrades forcing ratings-constrained insurers to sell into a thin market. Amundi treats the same leverage as a reason to be selective and avoid 'capital misallocation risk', noting Q2 earnings showed the build-out accelerating 'increasingly through debt financing and off-balance sheet positions' and creating a tech-valuation/debt-market feedback loop 'that did not exist two years ago.' Standard Chartered's Cedric Lam splits the difference, pushing back on hyperscaler-downgrade panic (agencies expect leverage to peak around 2027 before deleveraging) while keeping a broadly negative DM IG bias on supply indigestion and index concentration, and expecting sector dispersion rather than uniform widening. J.P. Morgan's ECM desk adds the sustainability conditions: AI lab ARR must keep compounding, GPU rental costs must stay elevated, and capital must keep flowing — and Galaxy's Vikram Singh supplies the microstructure evidence that the middle of the stack is where economics break, with inference breakeven utilisation at 85%, open-source models at 75% of OpenRouter volume (from 27%) and DeepSeek's flagship output price down ~8x since January 2025 while the H100 index rose 17%.", "items": [{"source_id": "goldman_sachs", "source_name": "Goldman Sachs", "thesis": "Goldman Sachs Research: 30-year USTs yield ~5.2% (8 September), the highest in more than two decades, with Japanese and UK equivalents at century highs and Bunds at post-2009 highs. George Cole stresses how orderly the move has been - the absence of a vol spike 'makes it hard to claim that we're fundamentally mispriced', and 'if a view of fundamentals has carried us higher, you need a shift in fundamentals to bring us lower.' Drivers: post-Covid deficits plus AI borrowing worth ~1% of global GDP competing for global savings. Energy-inflation fears and AI-return uncertainty could fade over six months; fiscal concerns will not. Expect a persistently steep global curve and elevated term premium.", "url": "https://www.goldmansachs.com/insights/articles/why-global-bond-yields-are-expected-to-stay-elevated", "images": []}, {"source_id": "ubs", "source_name": "UBS", "thesis": "UBS fixed income CIO Leslie Falconio: the 10-year is testing 4.8% and the 30-year is above 5.3% with mortgage rates around 6.8%. She attributes the move to 6.5-7% nominal growth, the sentiment swing from ~60bp of cuts priced in February to 50bp of hikes in 2026, elevated oil and fiscal/supply uncertainty. She has stayed in the 2-5 year belly rather than extending, is a buyer of duration on dips around the 4.85% level, expects 30-year yields to fall if the Fed actually hikes (inflation vigilantes appeased), and keeps portfolio duration at no more than 5.5-6 years.", "url": "https://www.ubs.com/us/en/wealth-management/insights/ubs-studios/2026/bond-market-is-talking.html", "images": []}, {"source_id": "goldman_sachs", "source_name": "Goldman Sachs", "thesis": "Goldman CEO David Solomon: the rise in the Treasury term premium is a long-term trend driven by fiscal policy, embedded inflation and higher underlying growth. A 5% term premium 'is not a calamity' - historically they have been higher without structural problems - and the 30-year around 5.25% 'reflects underlying market fundamentals.' Treasury and FX interventions send signals but do not alter the trajectory; markets will price to fundamentals. He sees no systemic credit risk from AI-related issuance today because much of it comes from very large, strongly cash-generative corporates, while conceding some areas will overextend.", "url": "https://www.goldmansachs.com/insights/videos/cnbc-david-solomon-on-us-economy-outlook", "images": []}, {"source_id": "bnp_paribas", "source_name": "BNP Paribas", "thesis": "BNP Paribas AM: long-term government bond yields in the US, UK and Japan hit multi-year and in some cases multi-decade highs in the first week of September on Middle East escalation and central bank tightening fears. Eurozone headline inflation rose to 3.3% in August from 2.9% (energy +14.3% y/y vs +10.3%), though core eased to 2.4% from 2.5%. MSCI World and the S&P 500 were flat on the week; Stoxx 600 -1%.", "url": "https://viewpoint.bnpparibas-am.com/take-two-bond-sell-off-endures-eurozone-inflation-rises/", "images": []}, {"source_id": "bnp_paribas", "source_name": "BNP Paribas", "thesis": "BNP Paribas AM chart of the week: AI capex is at a record high, yet US national productivity growth is running at 2.2% and has not risen alongside capex the way it did in the 1996-2000 dot-com era. Some firms see function-level efficiency gains, but they have not translated into economy-wide productivity - the benefits 'can take longer to show up, if at all.'", "url": "https://viewpoint.bnpparibas-am.com/take-two-bond-sell-off-endures-eurozone-inflation-rises/", "images": []}, {"source_id": "ubs", "source_name": "UBS", "thesis": "UBS: Broadcom raised its FY-Oct-2027 AI-chip revenue forecast to about $115bn from more than $100bn previously, and expects it to roughly double to $230bn in fiscal 2028, with Q3 AI-chip revenue more than tripling to $16.7bn; NVIDIA shares rose 8.7% post-results, the best post-print move since 2024. UBS puts global AI capex at ~$900bn in 2026 and ~$1.2trn in 2027 and extends the opportunity set beyond mega-cap tech into semis/hardware, software, power infrastructure, utilities and industrials, plus copper (preferred) and aluminium through 2027.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-03092026.html", "images": []}, {"source_id": "jpmorgan", "source_name": "JPMorgan", "thesis": "J.P. Morgan ECM (Jack Atherton, Eddie Byun) set out the three conditions for AI capex sustainability: AI lab annual recurring revenue must keep compounding (driven by token consumption and pricing, now a live debate), GPU rental costs must stay elevated (a hyperscaler/NeoCloud tailwind), and capital must keep flowing. They note AI infrastructure investment has been the number one driver of estimate upgrades this year, which has produced a de-rating - equities have actually got cheaper in 2026 despite indices near all-time highs.", "url": "https://www.jpmorgan.com/insights/podcast-hub/making-sense/tech-equity-capital-markets", "images": []}, {"source_id": "man_group", "source_name": "Man Group", "thesis": "Data centre ABS is the mispriced leg of the AI trade. AI-related borrower debt growing ~4x last year's pace (Morgan Stanley, June); hyperscalers to spend up to $800bn on AI infrastructure in 2026. AA data centre ABS have paid 155-175bp since early 2025 vs 45-70bp for AA unsecured corporates — ~100bp for the instrument with the collateral claim; A-rated ABS routinely out-yield lower-quality BBB- unsecured. Risks are technical: LTV-triggered automatic downgrades from lower appraised values even with no missed payment, tenant concentration across a small pool of big-tech lessees, and hardware depreciating faster than the 15-20 year real estate cash flow assumptions embedded in deals.", "url": "https://www.man.com/insights/views-from-the-floor-2026-9-Sept", "images": []}, {"source_id": "amundi", "source_name": "Amundi", "thesis": "Amundi: the AI theme is becoming more selective. Q2 earnings showed build-out accelerating but increasingly via debt and off-balance-sheet structures, adding to long-end supply and creating a tech-valuation/debt-market feedback loop absent two years ago. Positioning: focus on 'AI-resistant' stocks in consumer staples, healthcare, industrials and materials; stay selectively exposed to AI enablers while avoiding capital-misallocation risk; capital goods should benefit from data-centre demand and construction from infrastructure spend. Taiwanese and Korean suppliers benefit from the AI boom but Amundi doubts those profits last.", "url": "https://research-center.amundi.com/article/global-investment-views-september-2026", "images": []}, {"source_id": "standard_chartered", "source_name": "Standard Chartered", "thesis": "US 10-year yield +19bp on the week to a three-year high of 4.97%, 30-year 5.37%, 2-year 4.59%; major resistance the 2023 high of 5.02%. CTA short positions at record levels should limit further upside. Recommends raising bond maturities to 3-7 years, preferring corporate bonds; long maturities remain vulnerable to oil-driven inflation expectations and fiscal risk. Treasury's first expanded buyback (up to USD 6bn of long-dated debt) seen as insufficient and bill-funded, i.e. a flattening impulse, not a structural pivot.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-11-9-2026/?mvog=1", "images": []}, {"source_id": "standard_chartered", "source_name": "Standard Chartered", "thesis": "Hyperscaler AI capex and credit: rating agencies expect hyperscaler leverage to peak around 2027 followed by deleveraging as capex subsides and earnings grow; downgrade risk rises only if deleveraging is delayed, demand weakens, or off-balance-sheet/circular financing structures obscure true leverage. For DM IG corporates the bias is broadly negative - supply indigestion from AI-related issuance, downgrade risk, index concentration - but SC expects spread dispersion by sector rather than a uniform sell-off, with AI-capex-heavy sectors staying structurally wide.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-11-9-2026/?mvog=1", "images": []}, {"source_id": "gavekal", "source_name": "Gavekal Research", "thesis": "Will Denyer, 'Are US Long Bonds A Buy? (Part III)' (7 Sep): after cataloguing QT (to be offset by a coming Treasury twist), deficits swollen by tariff refunds and the new Iran war, Fed hikes lifting real yields while anchoring inflation expectations, and higher JGB yields plus a cheap yen pulling capital back to Japan, Denyer argues the biggest driver of 2026's yield rise may be the extraordinary amount of money being raised to fund AI infrastructure — so the bond call hinges on how long the AI capex and fundraising boom persists.", "url": "https://research.gavekal.com/teaser/are-us-long-bonds-a-buy-part-iii/", "images": []}, {"source_id": "oxford_economics", "source_name": "Oxford Economics", "thesis": "Marco Santaniello and Paul Moroz (9 Sep): Oxford's Global Economic Model now carries explicit AI 'levers' — exposure, adoption, and labour-augmenting vs labour-replacing. Baseline: US productivity +3.5% over the next decade and +4.5% long run, at the cautious end of a 1%-to-12%+ published range; adoption follows an S-curve reaching 80% of possible applications by 2040 across most advanced economies, with the US leading and Japan lagging on an ageing, rigid workforce. Scenarios for 2030s world GDP growth: AI Breakthrough ~3.0%, AI Disruption 2.8% (same productivity, higher structural unemployment, weaker consumption), baseline 2.4%, AI Disappointment ~2.2% with weaker capex appetite and a hit to equities, household wealth and spending. Clerical, admin and IT tasks are most exposed; mining, construction and fishing least, so EMs are less exposed than advanced economies.", "url": "https://www.oxfordeconomics.com/resource/ai-macroeconomic-impact-modelling/", "images": []}, {"source_id": "gavekal", "source_name": "Gavekal Research", "thesis": "Tan Kai Xian: against Fed Chair Warsh's productivity/disinflation thesis, solid US productivity growth since late 2022 has coincided with rising inflation while real GDP growth has tracked its 20-year median of ~2.3%. AI is helping workers produce more, but a worker shortage constrains supply from meeting the demand generated by the compute build-out.", "url": "https://research.gavekal.com/teaser/ai-versus-the-labor-market/", "images": []}, {"source_id": "coinshares", "source_name": "CoinShares", "thesis": "Power and powered-shell availability are the key bottleneck to AI deployment, which is a positive for Bitcoin miners and former miners holding large power portfolios. Broadcom's Hock Tan identified 'land, power and shell' as the determinants of deployment speed with six largest AI customers supporting up to 30GW of potential capacity. Cipher Digital is building natural-gas pipelines for up to 2.5GW of on-site generation; Bitdeer bought 200 acres next to Rockdale for US$100m (563MW interconnected, expandable to 742MW) and its 9.5MW Malaysia AI Cloud facility is fully contracted with >US$800m of expected revenue; Anthropic's US$35bn Lambda agreement uses ~350MW at a Hut 8-developed Texas campus.", "url": "https://coinshares.com/insights/research-data/equities-update-08-09-2026/", "images": []}, {"source_id": "galaxy_digital", "source_name": "Galaxy Digital", "thesis": "Open-source models are near parity with the frontier and usage is up 350x since January 2025; OpenRouter routed 125x more tokens last week than in January 2025, with open-source at 75% of volume versus 27% earlier. No frontier model has held the lead more than 100 days since GPT-4 and new models ship every 41 days, leaving labs ~4 months to amortize training capex. GPU-hour realized vol averages 130% annualized with current realized vol at 312%; the Ornn H100 index ran from a $1.63 February trough to $3.28 in May (+101% off the trough). Inference providers run a crack spread: at $2.74/hr H100 rent, 1,000 tok/s and $0.90/M tokens, full utilisation earns $3.24/hr for a +$0.50 spread, but 50% utilisation turns it to -$1.12/hr; breakeven utilisation is 85%. OpenRouter takes 5.5% ($55m on $1bn GPV) and routes by 1/price-squared, so halving a quote roughly quadruples flow.", "url": "https://www.galaxy.com/insights/perspectives/inference-market-and-micro-structure", "images": []}]}, {"theme": "US Equities: Absorbing Higher Yields, Concentration Risk and Where to De-Concentrate", "category_tags": ["equities", "ai_tech"], "consensus": "Sell-side desks and multi-asset committees are broadly constructive and all rest the case on earnings rather than multiples. UBS notes global equities sat just 1.9% below their August all-time high with the S&P 500 less than 3% off its record, forecasts S&P 500 EPS growth of 25% in 2026 and 14% in 2027 (Eurozone 15% in both years), and argues the Fed's own models imply 50bp of hikes costs only a few tenths of a point of growth. Goldman points to Q2 S&P earnings growth around 30% against a 19x multiple — the 10-year average — so 'all of the heavy lifting has actually been done on the earnings side.' T. Rowe Price adds that earnings revisions have broadened beyond energy to 8 of 16 sectors, developed-market business activity is at its highest since early 2022 and US capacity utilisation was 76.29 in July 2026, well below historical averages, implying the industrial economy has room to expand. Ned Davis Research confirms the expansion remained intact through Q2 2026. The other point of agreement is that US index concentration is now the dominant portfolio risk: the top 10 S&P 500 companies are nearly 40% of the index, PIMCO warns headline equity exposure 'may be less diversified than it appears', and UBS flags that nearly 40% of its self-managed equity clients hold more than half their equity book in 10 stocks or fewer.", "divergence": "The numbers put on it, and the prescriptions, diverge sharply. Goldman's cross-asset desk is the most aggressive, telling clients that by year-end or next year 'we're talking about an S&P that's probably well over 8,000', while acknowledging CTA and systematic flows are a near-term headwind and momentum has had an extraordinarily tough two months. Oxford Economics is explicitly above consensus on the US though not on other majors. T. Rowe Price runs only a modest overweight as an explicit buy-the-dip posture, likes small- and mid-caps and US growth, prefers EM over ex-US developed, and holds an overweight to international value specifically as insurance against an AI-driven selloff — with its own committee warning 'we could get an inflation shock and a rate shock.' BCA Research sits at benchmark. BlackRock's Russ Koesterich goes the opposite way from the de-concentrators, staying long the momentum factor precisely because it is overweight technology, semiconductors and energy where three-month earnings revisions are strongest (the SOX expected to deliver over 100% earnings growth in 2026), arguing the June/early-July 20%+ momentum drawdown was crowding and levered tech ETFs rather than fundamentals. Amundi contradicts him on the fundamentals, being strategically cautious on the US on valuation and concentration grounds, long-term positive on Europe and more constructive on Japan, and explicitly doubting that Taiwanese and Korean AI-supplier profits last. Invesco de-concentrates by size with hard numbers — the smallest 50 S&P 500 companies are about 1% of the index but outperformed the largest 50 by 4% from 2004-2025, and mid caps are 19% of US equity market cap but only 8% of investor assets. UBS de-concentrates by structure instead, pitching capital-preservation wrappers to concentrated holders because low implied vol cheapens the options and higher short-end yields cheapen the zero-coupon floors. PIMCO is the outright bear on the asset class relative to bonds: equity valuations are near multi-decade highs, the relationship between valuation and future returns is weak, and investors are accepting full equity downside plus concentration risk for limited incremental expected return over high-quality bonds. At sector level, Standard Chartered would use Fed- and oil-driven volatility to add equities in the US and Asia ex-Japan, while RBC's Nik Modi makes a structural bear case on the classic defensive sleeve — consumer staples now trade at a discount to the S&P 500 for the first time since the late-1990s internet bubble, which he reads as the market refusing to underwrite management guidance. Oxford adds the fading tailwind nobody else prices: wealth effects have contributed an average of 0.4pp to consumer spending growth this expansion and are asymmetric, so the
