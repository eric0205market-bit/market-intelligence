llicit crypto flows over five years, $16bn in 2025. Tether assisted law enforcement; the UK FCDO had already designated Xinbi in March 2026 under its Global Human Rights regime.", "url": "https://www.chainalysis.com/blog/ofac-sanctions-xinbi-cybercriminal-crypto-marketplace/", "images": []}]}, {"theme": "China and EM: Shock 2.0, the Capex Correction, and the AI Picks-and-Shovels Trade", "category_tags": ["em", "equities", "geopolitics", "growth"], "consensus": "Capital Economics and Brookings are launching parallel bodies of work on the same premise: a second China trade shock is the defining force in the global economy, and unlike the first it is concentrated in industries advanced economies consider strategic. Capital Economics' Neil Shearing frames three challenges — China's dominance threatens manufacturing-dependent economies, supply-chain dependence raises strategic vulnerability, and China's huge persistent external surplus widens the global imbalances 'that have a habit of foreshadowing economic and financial crises.' Brookings' seven-expert symposium works to the operative deadline set by EU trade chief Maroš Šefčovič of October for 'tangible results', with Daniel Hamilton putting the EU-China trade surplus at over $1bn a day. On the domestic economy, Gavekal Dragonomics and Oxford Economics agree China is disinflating out of deflation only in a few pockets while the authorities deliberately refuse to reflate — Thomas Gatley reports corporate profits surging and PPI rising after roughly three years of deflation, but with the majority of industries still loss-making and nearly all top-line gains concentrated in coal, non-ferrous metals and chips, and Oxford has extended China's housing correction through 2030.", "divergence": "Gavekal is the explicit dissent against the China Shock 2.0 premise, and does it twice. Thomas Gatley draws a genuinely contrarian conclusion from weak capex: because current investment is only enough to offset depreciation and is not adding capacity, 'China's excess capacity problems should no longer be worsening' — an optimistic inflection that cuts directly against the consensus that Chinese overcapacity is an ever-deepening global deflationary force and sits awkwardly beside the intensifying-export-wave framing of Capital Economics and Brookings. Arthur Kroeber, AJ Cortese and Tom Hancock reinforce it from the technology side, arguing that outside new energy and electricity China is still a fast follower rather than a pace-setter, that its manufacturing dominance is concentrated in medium- and low-complexity products, and that despite self-sufficiency rhetoric its tech ecosystem relies heavily on foreign components, equipment and IP — which Gavekal frames as a strength, not a weakness. Within Brookings the argument is about whether Europe will act at all: Ryan Hass is the most pessimistic ('China is betting Europe won't push back'), judging that on the current trajectory the export wave decimates EU autos, chemicals, green energy, machinery and industrial tools; Hamilton is the most constructive on leverage, arguing 'China is twice as dependent on the EU for strategic imports as the EU is on China' while still concluding 'don't expect the EU to take decisive action anytime soon'; Constanze Stelzenmüller reframes it as 'a peculiarly German drama' in which Merz has sharpened his tone but his own economics minister Katherina Reiche is 'sabotaging it with a kind of shadow diplomacy.' Inside China, Ernan Cui delivers the parallel surprise that the expected EV consolidation is going into reverse — domestic EV sales fell 13% YoY in the year to July, yet among the top 16 makers BYD and Tesla are ceding ground to upstarts and legacy automakers, none of whom will exit given exports at a third of unit sales and secure state and private backing — while Louis-Vincent Gave notes that despite the world's cheapest capital, cheapest productivity-adjusted labour and cheapest electricity, almost every recent data point has underwhelmed, and asks why Beijing still declines to stimulate. On the tradeable EM side, BNP Paribas AM's Zhikai Chen makes the strongest bull case: EM equities +22% YTD in USD against +13% for MSCI World, IT plus communication services at 44% of MSCI EM with Taiwan and Korea nearly half the index, and a 'massive migration of free cash flow' from ~$860bn of 2026 hyperscaler capex to over $300bn of aggregate free cash flow at just three Asian memory and foundry titans — concentration in tech 'is not a bug, this is actually a feature.' His own colleague Daniel Morris is the in-house sceptic, decomposing the outperformance into two narrow waves (2025's Chinese broadline retail and interactive media, now lagging, then 2026's tech hardware and semis, still +45% YTD) and concluding 'the rest of emerging market stocks have performed largely in line with their developed market peers', so sustainability requires either a China internet rebound or continued semi gains. Amundi is on Morris's side of the argument, doubting Taiwanese and Korean AI-supplier profits last, while remaining constructive on EM debt with LatAm and Sub-Saharan Africa favoured in hard currency. J.P. Morgan's angle is structural rather than directional: EM local debt demand is rising on higher yields, attractive currency valuations and de-dollarisation, with electronification extending to larger risk sizes.", "items": [{"source_id": "capital_economics", "source_name": "Capital Economics", "thesis": "Neil Shearing launches a multi-week 'China Shock 2.0' series (8 Sep). Unlike the early-2000s shock that underpinned a Goldilocks period of strong growth and low inflation while gutting advanced-economy manufacturing jobs and fuelling populism, this one has China competing in industries advanced economies deem critical to growth and national security, and as a strategic rival and economic peer of the US. Three challenges: threat to manufacturing-dependent economies, supply-chain dependence and strategic vulnerability, and a huge persistent external surplus widening global imbalances that historically foreshadow crises. Coverage will span the sustainability of China's investment-heavy model, deployment of its overseas asset stock, which economies are exposed or benefit, the green transition, exchange rates and whether coordinated policy action is possible. Briefings in London, Hong Kong and Singapore in October.", "url": "https://www.capitaleconomics.com/blog/china-shock-20-introducing-our-new-series-global-economy", "images": []}, {"source_id": "brookings", "source_name": "Brookings Institution", "thesis": "Seven-expert symposium on the EU's October deadline for China (9 Sep). Hass: China is betting Europe won't push back and will offer no concessions; on the current trajectory China's export wave decimates EU autos, chemicals, green energy, machinery and industrial tools. Hamilton: the EU-China trade surplus now exceeds $1bn a day; Brussels is readying cybersecurity rules and an Industrial Accelerator Act to cut strategic dependencies, block Chinese products from public contracts and limit takeovers — but won't decouple, and its real leverage is that 'China is twice as dependent on the EU for strategic imports as the EU is on China.' Stelzenmüller: the outcome hinges on Germany, where Merz has hardened (a July Franco-German paper urged 'swift and systematic' trade defence) while economics minister Katherina Reiche runs shadow diplomacy against it. Heerman: stronger defences can accomplish only so much.", "url": "https://www.brookings.edu/articles/europes-china-shock-2-0-where-does-it-go-from-here/", "images": []}, {"source_id": "gavekal", "source_name": "Gavekal Research", "thesis": "Arthur Kroeber, AJ Cortese and Tom Hancock's China tech report card (9 Sep) is a deliberate check on China-panic narratives: outside a handful of areas — mainly new energy and electricity — China is still a fast follower rather than a global pace-setter; its manufacturing dominance is concentrated in medium- and low-complexity products and it is catching up only slowly in highly complex ones; and despite self-sufficiency rhetoric its tech ecosystem relies heavily on foreign components, equipment and IP. Gavekal frames that dependence as a strength, not a weakness — tight integration with global value chains is what lets China keep innovating.", "url": "https://research.gavekal.com/teaser/a-china-tech-report-card/", "images": []}, {"source_id": "brookings", "source_name": "Brookings Institution", "thesis": "Companion piece 'Why Beijing isn't taking the bait with Trump' — Beijing is declining to escalate in response to US provocation, consistent with Gavekal's separate observation that after the May Trump-Xi 'constructive strategic stability' framing, China answered new FCC-driven US tech import restrictions in early August with a calibrated set of its own restrictions designed to respond without escalating.", "url": "https://www.brookings.edu/articles/why-beijing-isnt-taking-the-bait-with-trump/", "images": []}, {"source_id": "gavekal", "source_name": "Gavekal Research", "thesis": "Thomas Gatley, 'The Narrowing Profit Boom' (4 Sep): Chinese corporate profits are surging and PPI is rising after ~3 years of deflation, but the majority of industries are still loss-making and deflating, and coal, non-ferrous metals and chips account for nearly all the top-line gains. Unless those winners substantially expand capacity — unlikely — the profit boom stays concentrated in a few industrial pockets.", "url": "https://research.gavekal.com/teaser/the-narrowing-profit-boom/", "images": []}, {"source_id": "gavekal", "source_name": "Gavekal Research", "thesis": "Thomas Gatley, 'The Capex Correction Continues' (9 Sep): listed Chinese companies began dialling back capex around 2024 and restraint continues in 2026 on weak domestic demand, slim margins, tighter equity financing and less industrial-policy support. Because current investment only offsets depreciation and adds no net capacity, China's excess-capacity problem should no longer be worsening — a contrarian call against the consensus of deepening overcapacity.", "url": "https://research.gavekal.com/teaser/the-capex-correction-continues/", "images": []}, {"source_id": "gavekal", "source_name": "Gavekal Research", "thesis": "Ernan Cui, 'Still Waiting For EV Consolidation' (11 Sep): China's EV market is in its first major correction with domestic sales down 13% YoY in the year to July and no near-term rebound. Yet among the top 16 makers that account for nearly all sales, consolidation is going into reverse as BYD and Tesla cede ground to upstarts and legacy automakers. Booming exports (a third of unit sales) and secure state/private backing mean none will exit; only a decline in global demand for Chinese EVs would force a shakeout.", "url": "https://research.gavekal.com/teaser/still-waiting-for-ev-consolidation/", "images": []}, {"source_id": "gavekal", "source_name": "Gavekal Research", "thesis": "Louis-Vincent Gave, 'Why Won't Beijing Step On The Gas?' (9 Sep): China has the world's cheapest capital, cheapest productivity-adjusted labour and cheapest electricity, plus the most complete rail network, extensive highways, efficient subways and six of the world's ten largest ports. On paper it should be booming; instead almost every recent data point — auto sales, retail sales, PMIs, housing starts — has underwhelmed. The question is why Beijing declines to stimulate.", "url": "https://research.gavekal.com/teaser/why-wont-beijing-step-on-the-gas/", "images": []}, {"source_id": "gavekal", "source_name": "Gavekal Research", "thesis": "Tilly Zhang (7 Sep): Beijing is acknowledging diminishing returns on physical investment, with official rhetoric conceding past investment produced duplication and waste and urging emphasis on 'investment quality and overall returns.' 'Investing in people' alongside 'investing in things' is now written into the new Five-Year Plan, with the Ministry of Finance raising healthcare and social-security spending faster — framed partly as a way to lift household consumption by cutting precautionary savings.", "url": "https://research.gavekal.com/teaser/investing-in-people-is-also-industrial-policy/", "images": []}, {"source_id": "bnp_paribas", "source_name": "BNP Paribas", "thesis": "BNP Paribas AM (Zhikai Chen) core thesis: a 'massive migration of free cash flow' from spenders to enablers. Consensus top-five US hyperscaler capex is ~$860bn in 2026 while just three Asian memory and foundry titans are forecast to generate over $300bn of aggregate free cash flow - more than the top US hyperscalers' aggregate FCF in 2025, before it turns negative this year. IT plus comm services are 44% of MSCI EM; Taiwan and Korea are nearly half the index. One Asian leader returns over 50% of FCF to shareholders. The July drawdown was technical not fundamental: South Korean leveraged single-stock ETF AUM halved from a $53bn June peak to $26bn by end-July after regulators raised margin and collateral requirements, while earnings estimates were revised up even during the correction.", "url": "https://viewpoint.bnpparibas-am.com/picks-shovels-and-deep-value-a-re-examination-of-emerging-market-equities/", "images": []}, {"source_id": "bnp_paribas", "source_name": "BNP Paribas", "thesis": "BNP Paribas AM (Daniel Morris) is the in-house sceptic: EM returns since the start of 2025 are about twice MSCI World's in USD, but the outperformance decomposes into two narrow waves - 2025's Chinese broadline retail and interactive media names, which have lagged sharply this year, and 2026's tech hardware/semis, still up ~45% YTD despite the late-June sell-off. 'The rest of emerging market stocks have performed largely in line with their developed market peers.' Sustainability therefore requires either a China internet rebound (Chinese software multiples are roughly half US counterparts, but have long traded at a discount) or continued semi gains, where he thinks the earnings-driven case is stronger.", "url": "https://viewpoint.bnpparibas-am.com/view-from-the-markets-is-emerging-market-equity-outperformance-sustainable/", "images": []}, {"source_id": "jpmorgan", "source_name": "JPMorgan", "thesis": "J.P. Morgan (Carlos Gomez-Gascón, head of EM rates e-trading): EM local debt demand is rising on higher yields, attractive EM currency valuations and de-dollarisation, alongside growing domestic institutional buyers. Electronification and automation are extending to larger risk sizes in EM IRS (favoured by hedge funds for lower capital cost and tenor standardisation); functional repo markets in EMEA and LatAm keep two-way pricing tight while patchy APAC repo access distorts bid/ask; liquid rate futures markets in Brazil and Korea improve price discovery and hedging.", "url": "https://www.jpmorgan.com/insights/podcast-hub/making-sense/how-is-automation-shaping-emerging-markets", "images": []}, {"source_id": "amundi", "source_name": "Amundi", "thesis": "Amundi: emerging markets remain resilient and could continue benefiting from demand for diversification in bonds and equities, with selectivity key. Constructive EM debt on a weaker dollar, attractive real yields and improving fundamentals — positive Corporate and Sovereign Hard Currency favouring Latin America and Sub-Saharan Africa, selective in local currency (Brazil, Hungary, South Africa), cautious on EM FX but favouring LatAm and CEE over Asian currencies, with BRL and TRY offering attractive carry.", "url": "https://research-center.amundi.com/article/global-investment-views-september-2026", "images": []}]}, {"theme": "Geopolitics Beyond Energy: The Tariff Regime, Elections and Institutional Risk", "category_tags": ["geopolitics", "growth", "fx", "equities"], "consensus": "Both Peterson and Carnegie treat the September US-Canada escalation as a genuine break rather than another negotiating gambit, and both think the legal foundation is unusually weak. Carnegie's Barbara Weisel sets out the sequence: the US declined in July to extend USMCA, talks collapsed in August, the US imposed a 50% tariff on $20bn of Canadian goods, Canada retaliated dollar-for-dollar effective 8 September, and Washington counter-retaliated the same day by banning imports of Canadian motorcycles, certain dairy and alcoholic beverages and stripping Canadian products from federal procurement programmes worth more than $50bn a year. Peterson's Alan Wolff notes this is the fourth legal theory in a row: the IEEPA emergency tariffs were held by the Supreme Court in February not to be a tariff authority at all, the balance-of-payments rationale was rejected by the Court of International Trade, the forced-labour tariffs on 60 countries are being litigated by 25 state attorneys general, and the Canada tariffs now invoke Section 338 of the 1930 Smoot-Hawley Act, last used according to the ITC's 1943 Annual Report. Separately, political risk is now being priced as an economic variable: Brookings documents the AfD polling around 41% in Saxony-Anhalt ahead of the 6 September vote against the CDU at 23%, and Oxford Economics forecasts that 2027 elections in major European economies will shift policy right on climate, migration and defence, 'potentially increasing fiscal pressures and creating volatility in bond markets.'", "divergence": "Wolff is the more forceful on legality, calling Section 338 a 'zombie authority' designed against imperial-preference-scale discrimination that no longer exists and arguably repealed by Section 301, and saying courts 'should reject these tariffs as patently illegal' — while conceding the practical reality that 'the US tariff is whatever the president wishes it to be, which leaves the courts playing whack-a-mole.' Weisel is less interested in legality than in strategic cost, arguing the bigger damage is to the North American production platform and to US credibility in Asia, where governments now assume even close allies are not immune unless they yield, and stressing that the tariffs look like a larger immediate political liability in the US than in Canada — Trump's approval at its lowest with voters citing cost of living, against Carney's Liberals sweeping all three federal special elections. Both agree the damage outlasts the administration, with Canada targeting $300bn of additional non-US trade over the next decade plus a $7.5bn relief programme on top of nearly $25bn already provided; BCA supplies the macro read-through, with August Canadian employment falling 41.7k against +15k expected. On incidence, Federal Reserve staff cut against the standard regressivity framing entirely: state-level import shares of consumption range from 13.8% in California and 12.7% in New Jersey down to 2.6% in Nebraska and Missouri, with a population-weighted average of 7.1% below the ~10% usually cited, and no statistically significant relationship between state median household income and import spending; a companion paper shows that when foreign-market activity shifts from exports to affiliate production, 'depreciation therefore need not generate a large expansion in domestic production', undercutting the textbook expectation that a weak currency reflates the home manufacturing economy. On elections, Brookings is the only source that quantifies the fiscal cost of the populist programme — the Halle Institute estimates implementing the AfD's 258-page Saxony-Anhalt platform would cost EUR2.2bn (~$2.5bn) a year beyond the state budget, with legal scholars arguing parts would be unconstitutional and insiders doubting the party could fill the 150-200 leadership posts needed to govern — a 'radical but unimplementable' read that sits against Oxford's more mechanical treatment of a rightward shift as simply more deficit and more bond volatility, and against Stelzenmüller's warning that AfD strength is already constraining Merz on trade. The investment-relevant framings differ too: Bridgewater's Karen Karniol-Tambour argues modern mercantilism is 'a structural, not cyclical, force' and 'every country spending to close its vulnerabilities is inherently inflationary', with geographic fragmentation creating distinct investable ecosystems; BlackRock is more conditional, insisting Europe's higher public spending only creates an investment case if it builds capacity that lifts productivity and returns, and narrowing the near-term opportunity to defence technology, cyber, grids and electrical equipment, power and infrastructure financing. Carnegie adds the proliferation dimension in the US-Saudi 123 agreement now before Congress, which departs from the nonproliferation 'gold standard' and carries an 'unprecedented commercial provision' committing Riyadh to US suppliers that would box out China and Russia.", "items": [{"source_id": "peterson_institute", "source_name": "Peterson Institute for International Economics", "thesis": "Alan Wm. Wolff (3 Sep): the new Canada tariffs 'set a new record for lack of credibility,' invoking Section 338 of the 1930 Smoot-Hawley Act — an antidiscrimination provision written against British imperial preference, last acted on per the ITC's 1943 Annual Report, and arguably repealed by Section 301 of the 1974 Trade Act. No ITC investigation was sought. This follows three failed theories: the IEEPA emergency tariffs the Supreme Court held were not a tariff authority, the balance-of-payments claim the CIT found did not exist, and the forced-labour tariffs on 60 countries now in court. Wolff's practical point for traders: Americans are the importers of record paying the tariff, and Canadian input disruption can idle US production lines.", "url": "https://www.piie.com/blogs/realtime-economics/2026/trump-invoked-zombie-statute-justify-tariffs-canada", "images": []}, {"source_id": "carnegie", "source_name": "Carnegie Endowment for International Peace", "thesis": "Barbara Weisel (10 Sep): the escalation — 50% tariff on $20bn of Canadian goods in August, Canadian dollar-for-dollar retaliation on 8 September, same-day US import bans on Canadian motorcycles, dairy and alcohol plus removal of Canadian products from $50bn/yr of federal procurement — is 'unnecessary, avoidable, short-sighted.' Canada sends nearly 75% of exports to the US, but Canadians back Carney's walkaway (Liberals won all three federal special elections last month) and Ottawa is targeting $300bn of new non-US trade over the next decade plus a $7.5bn relief package on top of ~$25bn already spent. Asian governments are reading the episode as proof that even close allies are not immune, and are watching Section 301 excess-capacity and Section 232 investigations for what comes next.", "url": "https://carnegieendowment.org/emissary/2026/09/us-canada-trade-war-fallout-asia", "images": []}, {"source_id": "peterson_institute", "source_name": "Peterson Institute for International Economics", "thesis": "Wolff, 'An Agentic WTO' (3 Sep): the WTO is being kept deliberately weak — openly by India and 'an apostate United States,' and by inadvertence through EU underinvestment and resort to contingent protective measures. Reviving it requires 'nothing short of a revolution from within,' and China sits at a crossroads on whether it saves or undermines the system. 'Drift is not a good option as the sound of the falls grows louder.'", "url": "https://www.piie.com/commentary/speeches-papers/2026/agentic-wto-thoughts-wto-reform-face-divided-wto-membership-and", "images": []}, {"source_id": "bca_research", "source_name": "BCA Research", "thesis": "The macro read-through is already visible in Canadian data: August employment fell 41.7k versus +15k expected after July's +75.1k, with most losses concentrated and wage growth slowing sharply — BCA calls it evidence of how fragile the Canadian growth outlook remains.", "url": "https://www.bcaresearch.com/marketing/felix-antoine-vezina-poirier", "images": []}, {"source_id": "brookings", "source_name": "Brookings Institution", "thesis": "Mathilda Silbiger and Constanze Stelzenmüller (4 Sep): the AfD polled ~41% in Saxony-Anhalt ahead of the 6 September vote versus CDU 23% and the Left 11.5%, with an absolute majority and the minister-presidency for Ulrich Siegmund within reach; Projekt Zweitstimme put an AfD-only government at 33% probability. The state chapter is classified as confirmed right-wing extremist. Its 258-page programme would cost €2.2bn (~$2.5bn) a year beyond the state budget per the Halle Institute for Economic Research, with constitutional-law scholars arguing parts are unlawful. Further votes on 20 September in Mecklenburg-Western Pomerania (AfD 37%) and Berlin (18%); the AfD leads national polls at 29%. Erosion across all three could put SPD co-chairs Klingbeil and Bas — and even Merz's chancellorship — in play.", "url": "https://www.brookings.edu/articles/could-the-right-wing-extremist-afd-govern-a-german-state-for-the-first-time/", "images": []}, {"source_id": "oxford_economics", "source_name": "Oxford Economics", "thesis": "2027 European political dynamics are 'pivotal': elections in major economies likely shift policy right on climate, migration and defence, raising fiscal pressure and creating bond-market volatility — layered onto a eurozone with limited fiscal and monetary headroom and a sharp rise in natural gas prices as the key near-term threat.", "url": "https://www.oxfordeconomics.com/resource/the-european-outlook-2026-2027-domestic-strength-to-be-tested-by-energy-prices/", "images": []}, {"source_id": "carnegie", "source_name": "Carnegie Endowment for International Peace", "thesis": "Weisel on the midterm overhang: upcoming US and Canadian elections made trade compromise harder because negotiating in public encourages both sides to dig in; Trump's approval has fallen to its lowest with voters citing cost of living and most rejecting his trade policy; some Republicans have raised private concerns about the Canada tariffs; and a Democratic win in one or both houses in November would add constraints on trade policy. Asian governments may conclude they have more room to manoeuvre ahead of the midterms.", "url": "https://carnegieendowment.org/emissary/2026/09/us-canada-trade-war-fallout-asia", "images": []}, {"source_id": "federal_reserve", "source_name": "Federal Reserve", "thesis": "State-level tariff exposure via the consumption channel using 2023 CES and Census state-of-destination import data concorded with an LLM-based HS-to-CES mapping across 31 states covering 86% of the U.S. population. Highest imported-consumption shares: California 13.8%, New Jersey 12.7%; lowest Nebraska and Missouri at 2.6%. Simple average 5.6%, population-weighted 7.1%. Import spending correlates 0.65 with both state real GDP and population; the coefficient on median household income is economically small and statistically indistinguishable from zero. 'Other durable goods' (e.g. cellphones) explains ~24% of cross-state variance.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/which-states-are-most-exposed-to-tariff-increases-a-new-measure-based-on-the-consumption-channel-20260903.html", "images": []}, {"source_id": "federal_reserve", "source_name": "Federal Reserve", "thesis": "Kim, Ni, Oh & Yang (IFDP 1446): matched Japanese multinational parent/affiliate data over the sharp 2021–22 yen depreciation. More FX-exposed affiliates expanded activity and profits and paid more to parents; more exposed parents raised average wages and shifted employment toward sales/purchasing branches with offsetting declines elsewhere. In a two-country GE model, shifting foreign-market activity from exports to affiliate production dampens the domestic real GDP response to depreciation and moves external adjustment from trade toward income earned abroad.", "url": "https://www.federalreserve.gov/econres/ifdp/exchange-rate-transmission-through-multinational-firms-evidence-from-japan.htm", "images": []}, {"source_id": "bridgewater", "source_name": "Bridgewater Associates", "thesis": "Bridgewater Co-CIO Karen Karniol-Tambour at Milken 2026: modern mercantilism is structural, not cyclical, and every country spending to close its vulnerabilities is inherently inflationary. Portfolio concentration leaves most investors overweight US equities and underweight real assets. Geographic fragmentation is creating distinct investable ecosystems as industrial policy supports national champions, warranting exposure across regions.", "url": "https://www.bridgewater.com/research-and-insights/karen-karniol-tambour-on-investing-in-a-more-fragmented-world", "images": []}, {"source_id": "blackrock_investment_institute", "source_name": "BlackRock Investment Institute", "thesis": "BlackRock Investment Institute Europe focus, 'Europe's strategic buildout: the Netherlands in focus' (September 2026). The Netherlands sits at the intersection of security, energy and technology — ASML and the wider Dutch high-tech ecosystem are globally important capabilities — but grid congestion and the Groningen gas field closure make physical constraints visible. Policy response firming via the government-commissioned Wennink agenda, pension reform and a planned National Investment Institution. Europe has large savings pools but too little is channelled into equity and growth financing. Near-term opportunities: defense technology, cyber, grids and electrical equipment, power and infrastructure financing.", "url": "https://www.blackrock.com/corporate/insights/blackrock-investment-institute/publications/europe-buildout-netherlands-in-focus", "images": []}, {"source_id": "carnegie", "source_name": "Carnegie Endowment for International Peace", "thesis": "Jane Darby Menton: the US-Saudi 123 civil nuclear agreement is now before Congress and departs from the nonproliferation 'gold standard' — no forgoing of enrichment/reprocessing and no Additional Protocol (only 2 of 26 existing US 123 agreements meet the gold standard). The text 'establishes a potential future pathway to cooperation on uranium enrichment,' gated by a two-year Joint Enrichment and Conversion Study, plus a bilateral safeguards agreement in place of the AP and an 'unprecedented commercial provision' committing Riyadh to US suppliers (likely Westinghouse AP1000) that would box out China and Russia. The UAE's gold-standard agreement permits revision if a neighbour gets better terms.", "url": "https://carnegieendowment.org/emissary/2026/09/saudi-nuclear-deal-us-gold-standard-congress", "images": []}]}], "B_calls": [{"source_id": "boe", "source_name": "Bank of England", "call": "Huw Pill: has voted for Bank Rate at 4% versus the 3.75% majority hold in place since March 2026, arguing the MPC must make an 'active choice' at every meeting rather than wait-and-see; on an unchanged 3.75% path the Bank's new 'sticky-central' underlying inflation measure stays meaningfully above 2% through 2027 with upside risks.", "category_tags": ["rates", "fx"], "url": "https://www.bankofengland.co.uk/speech/2026/september/remarks-at-the-edinburgh-chamber-of-commerce", "images": []}, {"source_id": "boe", "source_name": "Bank of England", "call": "Alan Taylor: UK nominal neutral is 3%, so 3.75% is 75bp restrictive; expects CPI to peak at ~3.25% later in 2026 (vs 3.75% in the April MPR) after an inflation print 0.4pp below expectations and better energy curves; rates 'can and should resume their downward path to neutral' under a benign resolution, and could go below neutral if slack widens. Wage growth already at 3–3.5%, consistent with target on 1% productivity.", "category_tags": ["rates", "growth", "fx"], "url": "https://www.bankofengland.co.uk/speech/2026/june/alan-taylor-speech-at-the-barclays-and-centre-for-economic-policy-research", "images": []}, {"source_id": "ubs", "source_name": "UBS", "call": "UBS changed its Fed call from 'unchanged through 2026' to two 25bp hikes in September and December, taking fed funds from 3.50-3.75% to 4.00-4.25%, and raised its US Treasury forecasts to 4.25% on 2-year (June 2027, +100bp vs prior) and 4.5% on 10-year (+40bp vs prior).", "category_tags": ["rates", "growth"], "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-07092026.html", "images": []}, {"source_id": "goldman_sachs", "source_name": "Goldman Sachs", "call": "Goldman Sachs cross-asset sales (Jonathan Shugar): the S&P 500 should be 'well over 8,000' by year-end or into next year, on a 19x P/E (the 10-year average) after ~30% Q2 earnings growth - despite near-term CTA/systematic flow headwinds.", "category_tags": ["equities"], "url": "https://www.goldmansachs.com/insights/the-markets/what-a-fed-rate-hike-could-mean-for-us-stocks", "images": []}, {"source_id": "goldman_sachs", "source_name": "Goldman Sachs", "call": "Goldman Sachs Metals Trading (Tony Kim): still bullish gold - the current move is 'an elongated pause' (gold ~20% off its January record), $4,000/oz is a solid floor with sovereign and institutional sponsorship, scale into longs closer to $4K on data volatility ahead of the FOMC; prefers gold to silver, which can clear anywhere between $50 and $100/oz on retail flow alone.", "category_tags": ["commodities"], "url": "https://www.goldmansachs.com/insights/the-markets/why-gold-is-expected-to-rise-to-record-highs", "images": []}, {"source_id": "ubs", "source_name": "UBS", "call": "UBS fixed income CIO Leslie Falconio: stay in the 2-5 year belly rather than extending duration, cap portfolio rate duration at 5.5-6 years, take credit risk through short-duration high yield, and overweight agency MBS at ~5.70% yield where spreads have decoupled from rising 10-year yields; start adding duration on dips around 4.85% on the 10-year.", "category_tags": ["rates", "credit"], "url": "https://www.ubs.com/us/en/wealth-management/insights/ubs-studios/2026/bond-market-is-talking.html", "images": []}, {"source_id": "bnp_paribas", "source_name": "BNP Paribas", "call": "BNP Paribas AM (Chris Iggo): prefers floating rate debt, high yield and shorter-maturity inflation-linked bonds over long-dated debt near term; argues US 10-year yields 'should be looking at 5%' on nominal GDP trend growth, and that newly issued bonds with coupons well above 5% are a better bet than legacy low-coupon paper. Does not expect the tightening cycle to exceed the 2023 peak in rates.", "category_tags": ["rates", "credit"], "url": "https://viewpoint.bnpparibas-am.com/view-from-the-markets-tightening-again/", "images": []}, {"source_id": "citi_gps", "source_name": "Citi GPS", "call": "Citi Research (Adam Pickett, Giammarco Miani): not worried about US Treasury yields - the move is driven by economic strength and real yields rather than fiscal concerns or Treasury market stress - but flags more risk of a September Fed hike than markets are pricing.", "category_tags": ["rates", "growth"], "url": "https://www.citigroup.com/global/insights/should-markets-be-scared-of-us-treasury-yields", "images": []}, {"source_id": "pimco", "source_name": "PIMCO", "call": "Raise bond allocations and restore balance to equity-heavy portfolios. Anchor: Bloomberg US Aggregate yield-to-worst 5.03% as of 3 Sep 2026, which historically translates roughly into a similar annualized return over the medium term; 10y Treasury real yield ~2.4% vs ~-1% in early 2022. Test the hedge with high-quality government duration, not broad bond benchmarks that embed IG credit. Extend the duration expression globally given desynchronized policy paths (country selection, curve positioning, relative value) rather than US-only.", "category_tags": ["rates", "equities", "credit"], "url": "https://www.pimco.com/us/en/insights/welcome-back-balanced-portfolio", "images": []}, {"source_id": "amundi", "source_name": "Amundi", "call": "Amundi September positioning: mildly pro-risk with carry and diversification over directional bets. Fixed income — close-to-neutral US duration with steepening bias and a 5y preference; EMU peripherals over core with steepener; cautious UK (steepener); cautious Japan (flattener). Credit — positive Global IG, slightly reduced EUR IG, subordinated over HY with short-dated bias, prefer financials plus telecom, tech and pharma. Equities — strategically cautious US, balanced via S&P 500 Equal Weight alongside an even S&P 500 allocation; positive Europe; more constructive Japan; LatAm in EM. Commodities — increased gold overweight. FX — favour higher-carry EM (BRL, TRY). Macro calls: Fed on hold through year-end, one more ECB hike, BoJ four hikes to a 2% neutral before mid-2027.", "category_tags": ["rates", "equities", "fx", "credit", "commodities", "em"], "url": "https://research-center.amundi.com/article/global-investment-views-september-2026", "images": []}, {"source_id": "t_rowe_price", "source_name": "T. Rowe Price", "call": "T. Rowe Price Asset Allocation Committee: maintain a modest overweight to equities and buy the dip rather than press risk here. Overweight small/mid caps and US growth; prefer EM over ex-US developed; hold overweight international value as an AI-selloff hedge. Watch crack spreads as the binding constraint on the stagflation scenario; bull case assumes Middle East (and possibly Russia-Ukraine) de-escalation taking oil to the $50/bbl range next year.", "category_tags": ["equities", "energy", "em"], "url": "https://www.troweprice.com/en/us/insights/Why-the-bull-case-is-still-in-play-for-equity-markets", "images": []}, {"source_id": "man_group", "source_name": "Man Group", "call": "Man Group: buy AA-rated data centre ABS against AA unsecured hyperscaler corporates. Since early 2025 AA data centre ABS have paid 155-175bp versus 45-70bp on identically rated unsecured paper from the same builders — roughly 100bp for the instrument that also has subordination, overcollateralisation, covenants and a direct claim on the real estate and rent; A-rated ABS routinely out-yield lower-quality BBB- unsecured. Man argues the gap is a liquidity and complexity premium, not fundamental credit risk, and that supplying liquidity into technical LTV-triggered downgrade selling is itself a return driver.", "category_tags": ["credit", "ai_tech"], "url": "https://www.man.com/insights/views-from-the-floor-2026-9-Sept", "images": []}, {"source_id": "blackrock_investment_institute", "source_name": "BlackRock Investment Institute", "call": "BlackRock Investment Institute: do not de-risk indiscriminately on the Middle East escalation — treat it as a volatility shock and stand ready to lean against market over-reactions. But do not use long-dated government bonds as ballast: stagflationary supply risk makes them unreliable in this specific shock. Trigger to reassess: sustained Hormuz impairment beyond the estimated 10-to-14-day energy market buffer (~20% of global oil consumption and 20-25% of gas trade transits the Strait); expect sharper dislocations in regionally segmented LNG than in fungible oil.", "category_tags": ["geopolitics", "energy", "rates"], "url": "https://www.blackrock.com/corporate/insights/blackrock-investment-institute/publications/middle-east-conflict-2026", "images": []}, {"source_id": "standard_chartered", "source_name": "Standard Chartered", "call": "Base case: 25bp Fed hike at the September 2026 FOMC (policy rate 3.75% described by Chair Warsh as not restrictive) - a 'credibility' hike, not the start of a hiking cycle; inflation seen easing in 2027 as tariff and oil effects fade. If the Fed holds, expect a near-term equity/bond sell-off and the 10-year briefly above 5.02%.", "category_tags": ["rates", "equities"], "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-11-9-2026/?mvog=1", "images": []}, {"source_id": "standard_chartered", "source_name": "Standard Chartered", "call": "Extend bond maturities into the 3-7 year bucket, preferring corporates; stay defensive on long duration. 10y 4.97%, 30y 5.37%, 2y 4.59%; 10y resistance 5.02%. Record CTA shorts and official supply/liquidity tools should cap further yield upside.", "category_tags": ["rates", "credit"], "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-11-9-2026/?mvog=1", "images": []}, {"source_id": "standard_chartered", "source_name": "Standard Chartered", "call": "Adds one more ECB 25bp hike to 2.75% by December (after the 25bp move to 2.50%); expects a BoJ hike next week plus another in Q4 (likely December) and potentially one each in Q1 and Q2 2027; raises probability of a September RBA hike but not a back-to-back November move.", "category_tags": ["rates", "fx"], "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-11-9-2026/?mvog=1", "images": []}, {"source_id": "standard_chartered", "source_name": "Standard Chartered", "call": "WTI forecast USD 90/bbl in three months with risks skewed to the upside; hedge oil upside with US TIPS at portfolio level rather than oil-sensitive equity. Largest downside risk is a pre-midterm Middle East normalisation.", "category_tags": ["energy", "commodities", "rates"], "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-11-9-2026/?mvog=1", "images": []}, {"source_id": "rbc", "source_name": "RBC Capital Markets", "call": "Helima Croft (9 September): no diplomatic offramp in the Iran war; ~9 mb/d of Middle Eastern supply effectively offline, Saudi Red Sea exports below 2 mb/d, ~3 mb/d of Russian refining down. Expects to be writing another war-anniversary note in February 2027; White House calls to OPEC are now futile with barrels stranded.", "category_tags": ["energy", "geopolitics", "commodities"], "url": "https://www.rbccm.com/en/insights/2026/09/midterm-malaise", "images": []}, {"source_id": "coinshares", "source_name": "CoinShares", "call": "BTC upside is capped near-term: sticky core CPI raises the odds of a September rate HIKE and flows have flipped to -US$243m week-to-date from +US$1.3bn last week. A convincing break above US$80,000 requires softer data, a dovish Fed shift, or a policy catalyst. Medium-term bullish trigger: the Treasury's failed buyback programme forces a much larger 'bazooka-style' intervention that reinforces the debasement trade in BTC and gold.", "category_tags": ["crypto", "rates", "fx"], "url": "https://coinshares.com/insights/research-data/market-update-11-09-2026/", "images": []}, {"source_id": "galaxy_digital", "source_name": "Galaxy Digital", "call": "Galaxy (Alex Thorn): BTC will hit $250k by year-end 2027; 2026 is too chaotic to call, and risk remains to the downside until BTC firmly re-establishes above $100-105k. Options were pricing equal odds of $70k or $130k for end-June 2026 and equal odds of $50k or $250k by end-2026. Other 2026 calls: US spot crypto ETF net inflows exceed $50bn (vs $23bn in 2025); more than 50 spot altcoin ETFs plus 50 other crypto ETFs launch; total crypto-backed loans outstanding clear $90bn; DEXs capture more than 25% of combined spot volume (from 15-17%); privacy-token combined market cap exceeds $100bn (from $63bn); Polymarket weekly volume consistently above $1.5bn; stablecoins overtake ACH in transaction volume; 15+ crypto companies IPO or uplist in the US; and five or more DATs are forced to sell assets, be acquired, or shut down.", "category_tags": ["crypto", "equities", "credit"], "url": "https://www.galaxy.com/insights/research/predictions-2026-crypto-bitcoin-defi", "images": []}, {"source_id": "wood_mackenzie", "source_name": "Wood Mackenzie", "call": "Wood Mackenzie: sustained high oil prices from the Iran war could deliver a global 2040 EV fleet ~50% larger than base case, requiring only ~800,000 extra tons of copper in 2040 (about 2% of projected supply) but ~14% more lithium. Base case still has EV passenger share at ~80% China / ~70% Europe / ~30% US by 2035 and world oil demand plateauing in the early 2030s — accelerated EV uptake and structurally lower long-term oil demand could be the lasting consequence of the war. Near-term: Brent above US$108, US retail diesel at a record ~US$5.98/gal, 10y UST above 4.96% and 30y at ~5.37%.", "category_tags": ["energy", "commodities", "equities", "rates"], "url": "https://www.woodmac.com/blogs/energy-pulse/high-oil-prices-raise-prospect-accelerated-ev-sales/", "images": []}, {"source_id": "opec", "source_name": "OPEC", "call": "OPEC+ eight (Saudi Arabia, Russia, Iraq, Kuwait, Kazakhstan, Algeria, Oman) hold October 2026 required production at September levels — no further unwind of the April/November 2023 voluntary adjustments. Next decision point 4 October 2026.", "category_tags": ["energy", "commodities", "geopolitics"], "url": "https://www.opec.org/pr-detail/1835613-6-september-2026.html", "images": []}, {"source_id": "bca_research", "source_name": "BCA Research", "call": "August CPI (headline 0.4% m/m, in line, slightly hot overall) 'guarantees a Fed hike on Wednesday' — but with no evidence of broadening inflation pressures or second-round effects, so BCA does not extrapolate a sustained hiking campaign.", "category_tags": ["rates", "growth"], "url": "https://www.bcaresearch.com/marketing/felix-antoine-vezina-poirier", "images": []}, {"source_id": "bca_research", "source_name": "BCA Research", "call": "Bank Credit Analyst: maintain benchmark allocations to equities and other risk assets — the post-pandemic expansion remains intact amid balanced growth, with hiring reviving after a weak 2025 to roughly 80k jobs a month.", "category_tags": ["equities", "credit", "growth"], "url": "https://www.bcaresearch.com/marketing/felix-antoine-vezina-poirier", "images": []}, {"source_id": "gavekal", "source_name": "Gavekal Research", "call": "Louis-Vincent Gave: energy stocks are now a better 'antifragile' portfolio buffer than OECD government bonds. Energy has been the best-performing sector in the S&P 500 and MSCI World over five years, is (with financials) the only sector at new all-time highs, and outperformed precisely when everything else struggled — early 2022 on Russia-Ukraine and this March when the US and Israel began bombing Iran — while OECD government bonds fell in those same windows.", "category_tags": ["equities", "energy", "rates", "commodities"], "url": "https://research.gavekal.com/teaser/on-energy-stocks-as-a-portfolio-diversifier/", "images": []}, {"source_id": "gavekal", "source_name": "Gavekal Research", "call": "Will Denyer: the biggest driver of the 2026 rise in US long yields may be AI infrastructure fundraising rather than QT, deficits, Fed hikes or JGB competition — so whether long bonds are a buy hinges on how long the AI capex and fundraising boom persists.", "category_tags": ["rates", "ai_tech", "credit"], "url": "https://research.gavekal.com/teaser/are-us-long-bonds-a-buy-part-iii/", "images": []}, {"source_id": "gavekal", "source_name": "Gavekal Research", "call": "Thomas Gatley: China's excess-capacity problem should no longer be worsening, because current investment rates only offset depreciation and add no net capacity — a contrarian inflection against the consensus 'endless Chinese overcapacity' deflation narrative.", "category_tags": ["em", "commodities", "equities"], "url": "https://research.gavekal.com/teaser/the-capex-correction-continues/", "images": []}, {"source_id": "peterson_institute", "source_name": "Peterson Institute for International Economics", "call": "Martin Chorzempa, against the de-dollarisation consensus: the yuan's rise has stalled — SWIFT share down from a 4.7% July 2024 peak to 2.75% (6th globally, behind CAD) while the dollar's FX share rose from 87% to 89%. Yuan internationalisation is now better read as a sanctions insurance policy than an active challenge to the dollar.", "category_tags": ["fx", "em", "geopolitics"], "url": "https://www.piie.com/blogs/realtime-economics/2026/has-chinese-yuans-rise-global-usage-hit-wall", "images": []}], "C_deep_reads": [{"source_id": "boe", "source_name": "Bank of England", "title": "Homophones – Remarks by Huw Pill (Edinburgh Chamber of Commerce, 3 September 2026)", "summary": "The most policy-dense BoE piece in the batch and the hawkish case for UK rates. Pill splits MPC uncertainty into two dimensions: sizing the Gulf energy shock, and its propagation into UK CPI. The first he calls 'bounded Knightian' — unknowable rather than merely risky, and therefore not learnable, which argues against conditioning policy on high-frequency energy moves or pretending understanding will improve meeting to meeting. The second is learnable, and it is where the MPC genuinely disagrees. Pill accepts modelling showing second-round effects are more modest with labour market slack than in the tight market of 2022–23, but rejects the inference that slack means no second-round effects, citing permanent shifts in price-setting (reduced UK market contestability post-Brexit), greater attentiveness to nominal dynamics after 2022–23, and the salience of energy and food for household expectations. His central worry is not expectational de-anchoring — he explicitly says long-dated index swaps and long-run surveys show none, and that the MPC would act promptly if they did — but slower, more insidious 'catch-up' nominal dynamics as firms, households and government respond to a large relative price shock, which he thinks was under-estimated in 2022–23 and is still not fully in the Bank's models. He therefore rejects a 'wait-and-see' framing: 'if you follow a wait-and-see approach and then do not see, all you have done is waited', and warns that an unchanged Bank Rate read as status-quo bias feeds back through the 'hall of mirrors' between policymakers and markets, delaying pre-emptive action. Bank Rate has been 3.75% since March; his own votes have been for a modestly higher level (4%), though he stresses the point is the active choice, not 25bp. He then introduces the analytical tool behind his position: a new Bank staff 'sticky-central' CPI re-weighting that overweights stickier-price components (where inflation is welfare-costly because firms cannot adjust) and network-central components (energy and other broad inputs). That measure shows genuine disinflation since 2022–23 with a stall from mid-2024 and a recent healthy step down — supporting look-through of most of the Gulf-driven headline rise — but the BVAR projection on an unchanged 3.75% Bank Rate leaves underlying inflation stuck meaningfully above 2% into 2027 with risks to the upside, even as headline falls back. His warning: as in H1 2024, falling headline can coincide with stalling or rising underlying inflation, so the MPC 'should not be seduced by falling headline inflation rates'. He also flags El Niño food/energy risk, fiscal-monetary interaction and AI's investment/productivity effects as risks that may ultimately matter more than the Gulf.", "url": "https://www.bankofengland.co.uk/speech/2026/september/remarks-at-the-edinburgh-chamber-of-commerce", "images": []}, {"source_id": "boe", "source_name": "Bank of England", "title": "Central reservations − speech by Alan Taylor (Barclays-CEPR Monetary Policy Forum)", "summary": "The dovish counterweight, and simultaneously the most substantive institutional critique of the BoE's forecasting machinery published this window. Taylor uses the April 2026 MPR's unprecedented decision to publish only scenarios A/B/C with no central forecast (the only precedent being May 2020) as the hook for an argument that the baseline cannot actually be removed: every scenario is a perturbation in data-space or model-space of something, so 'even if one takes out the central forecast, it is still there', and a mis-specified baseline contaminates every scenario, risk assessment and policy narrative. His core technical complaint is the conditioning path. The OIS curve has been a poor predictor of both Bank Rate and Fed Funds for 20 years, and the Bank's own new term structure model plus the Market Participants Survey show a large risk premium wedge between the curve and actual rate expectations. Because the forecast internalises curve moves regardless of whether they are expectations or premia, the implied stance has been 'consistently and, in my view excessively, restrictive', forcing COMPASS to manufacture positive demand shocks to land inflation at 2% at the 2–3 year horizon — shocks (an assumed consumption and investment rebound) that never materialised as savings rates stayed high. The result was persistently one-sided forecast errors from February 2025 to February 2026. He recommends a Riksbank-style staff model-based policy rate path or a Fed-style dot plot, a continuously reviewed ECB-style scenario library, more flexible scenario counts, and pruning of policy rules. The final third is the outlook. He adds 'Scenario T' (traditional conditioning, central second-round judgement) and Greene's 'Scenario M' (Scenario B energy plus Scenario-C-calibrated persistence) to fill out a 3x3 matrix, concluding that the energy shock size dominates year one and that off-diagonal wage/price dynamics only show up in years two and three. Crucially, the UK enters this shock weak: the vacancies-to-unemployment ratio, inflation and household expectations all start from a far softer place than 1973, 1979, 1990, 2010 or 2022, unemployment is rising, and wage growth has converged to 3–3.5%, which staff see as target-consistent on 1% productivity. The DMP now shows firms expecting higher CPI but not higher wages — the correlation broken for six months. With the MoU and improved energy curves plus an inflation print 0.4pp below expectations, he sees the 2026 CPI peak at ~3.25% rather than 3.75%. Policy conclusion: an extended hold is correct today at 3.75% — 75bp above his 3% neutral estimate — but rates should resume their path down to neutral under a benign outcome and could go below neutral if inflation looks set to undershoot.", "url": "https://www.bankofengland.co.uk/speech/2026/june/alan-taylor-speech-at-the-barclays-and-centre-for-economic-policy-research", "images": []}, {"source_id": "federal_reserve", "source_name": "Federal Reserve", "title": "Why Gold Didn't Actually Overtake Treasury Securities as the World's 'Favorite' Reserve Asset (FEDS Notes, 3 September 2026)", "summary": "A direct Fed staff rebuttal of the de-dollarisation headline that followed the ECB's June 2026 International Role of the Euro report. Colin Weiss concedes the raw fact: in 2025 world gold reserves surpassed foreign official holdings of U.S. Treasury securities, with end-2025 world gold at $5.1trn ($4.0trn excluding the U.S.) against $3.9trn of foreign official Treasuries. He then dismantles the inference on two grounds. First, valuation: the surge in the market value of gold reserves since 2024 was driven by a jump in private sector demand — physical gold ETF inflows from late 2024 — not by central bank buying, which increased substantially in 2022 and has merely maintained that elevated pace since. Official demand alone would not have caused the price surge. Second, composition: world gold reserves include the U.S. government, which holds 22% of the world total and by definition cannot hold Treasuries as international reserves. Excluding the U.S., Germany, France, Italy and the IMF — the five largest gold holders, about 52% of world gold, none of whom have accumulated meaningfully since the 1970s and for whom gold is now more than 80% of international reserves purely on legacy Bretton Woods positions — foreign official Treasury holdings exceeded gold by roughly $1trn in June 2026, or about $0.6trn even crediting the World Gold Council's estimate of unreported post-2021 official purchases. Most world gold was acquired before 1971; most foreign official Treasury holdings after 2000, and the two country sets barely overlap. By June 2026 foreign official Treasury holdings had again surpassed ex-U.S. world gold reserves in dollar terms despite further gold accumulation in fine troy ounces. Weiss does not dismiss the diversification story — official sector gold buying has been net positive since 2008, accelerated from 2022, and may partly reflect ideological proximity to the U.S. and sanctions risk — but the net flow data cut the other way too: foreign official investors bought nearly $200bn of Treasuries on net from 2022 through April 2026, even while several major reserve holders sold hundreds of billions to defend their currencies.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/why-gold-didnt-actually-overtake-treasury-securities-as-the-worlds-favorite-reserve-asset-20260903.html", "images": []}, {"source_id": "ubs", "source_name": "UBS", "title": "Strong US jobs data likely to tip the balance for the Fed", "summary": "UBS CIO's formal capitulation on its Fed call, and the most complete statement of the bull case for risk assets under a hiking Fed in this batch. The data trigger: August nonfarm payrolls +162,000 (private +127,000) against consensus of 55,000, with 55,000 of upward revisions lifting the three-month private average to 75,000, comfortably above the 0-60,000 breakeven needed to hold unemployment stable; hiring was broad-based and unemployment stayed at 4.1% as participation rose. That followed July PCE inflation beating at 3.7% y/y and Warsh's hawkish Jackson Hole message. Market-implied September hike odds moved from ~50% to ~60%, two-year yields rose and the dollar strengthened, while the S&P 500 fell only 0.4%. UBS lists four reasons its prior 'unchanged through 2026' call is dead: Warsh's demand that underlying inflation move to 2% 'clearly and at sufficient speed' using six- and twelve-month measures, with core trends likely to stay above 3%; worsening supplier-delivery times in ISM and PMI surveys raising supply-driven inflation risk, with emerging signs that AI-related demand pressures are broadening; firm employment demand and GDP tracking suggesting policy is simply not restrictive; and reporting that Warsh would be 'prepared to hike' if markets ratcheted up expectations. The new base case is 25bp hikes in September and December, taking the target range from 3.50-3.75% to 4.00-4.25%, with monthly core prints near 0.3% in H2 2026 supporting a third hike and six-month annualised inflation below 2.5% potentially postponing the second. Forecast changes: 2-year yields at 4.25% by June 2027 (100bp above the prior forecast) and 10-year at 4.5% (only 40bp higher, on the assumption hikes stabilise the back end). The investment framework is the piece worth keeping: what matters is not whether the Fed hikes but the backdrop - tightening into strong growth, AI capex, employment and profits is a very different asset-allocation regime from tightening into sticky inflation with muted growth, and August's labour report points to the former. Concrete portfolio actions: buy equity dips while earnings prospects hold; take advantage of elevated medium-to-long duration quality bond yields; reduce excess dollar holdings on strength; use dips in gold to build a longer-term hedge. UBS explicitly withdraws its recommendation to lock in short-to-medium duration yields as a cash alternative, warns that higher-for-longer short rates worsen US debt affordability given the Treasury's shortened funding profile, and notes EM bond and high yield spread outcomes depend entirely on which backdrop prevails. Its bottom line: 'Investors should not mistake a potential change in Fed rates for a change in the investment outlook.'", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-07092026.html", "images": []}, {"source_id": "goldman_sachs", "source_name": "Goldman Sachs", "title": "How Will Less Fed Transparency Affect Markets and the Economy?", "summary": "Goldman Sachs' Top of Mind, hosted by Allison Nathan, convenes GS Chief Economist Jan Hatzius with former Fed governors Donald Kohn and Stephen Miran on what Chairman Warsh's shift to shorter statements, less forward guidance and a reduced role for projections means for markets. Hatzius defends the transparency revolution on transmission grounds: if markets understand the reaction function, surprising data gets incorporated into financial conditions immediately and the Fed can choose whether to ratify it, so unwinding reaction-function transparency 'would be bad.' He distinguishes Odyssean forward guidance (committing to a path regardless of data - defensible only at the effective lower bound) from Delphic guidance (conditional on data), and defends the dot plot as information about the reaction function rather than strong guidance, since sophisticated observers understand its conditionality. Crucially, he rejects Warsh's claim that less transparency lets markets give the Fed more 'direct and unfiltered' information: markets price what they think the Fed will do, not what it should do, so obscuring the reaction function just produces worse guesses, more rates and financial-conditions volatility 'that serves no good economic purpose', and slower policy transmission. Miran takes the opposing side: forward guidance dampened short-run volatility at the cost of long-run volatility by making the Fed too slow to adapt - his examples are the Fed still buying mortgages when home prices were up 20% because it had given calendar-based guidance, and Silicon Valley Bank extending duration partly because the Fed said rates would be near zero indefinitely. He accepts the conceptual distinction between path guidance and reaction-function transparency but says it gets muddy in practice because inflation data requires interpretation (the general price level is constructed through thousands of methodological choices), so over-specifying the reaction function invites accusations of moving the goalposts when the data throws a curveball. His concrete reform: kill the policy dot, keep the economic dots. He frames GFC-era tools - forward guidance, QE, the formal inflation target - as antibiotics that should have been repealed by 2014-15 and says we are 'very, very far' from the volatility threshold that would justify reinstating them. Kohn occupies a 'golden mean': the SEP median is a weak signal that one participant can shift, and away from the zero lower bound he would be a reluctant user of forward guidance - but Warsh's refusal to describe how the committee sees the economy 'is not helpful', because the narrative is both an accountability mechanism and the thing that lets markets process incoming data intelligently. He cites Greenspan as always having a story, and calls the current quietness unsustainable, noting the July press conference sent short rates down and long rates up - building inflation, uncertainty and term premia - which he assumes was not the outcome Warsh wanted. Hatzius adds a durability caveat: the Chair controls his own press conference, but regional Reserve Bank presidents will keep talking, so 'the cacophony could get worse' with less centralised communication.", "url": "https://www.goldmansachs.com/insights/goldman-sachs-exchanges/how-will-less-fed-transparency-affect-markets-and-the-economy", "images": []}, {"source_id": "bnp_paribas", "source_name": "BNP Paribas", "title": "Central bank independence faces its biggest stress test so far this century", "summary": "Isabelle Mateos Y Lago, Group Chief Economist for BNP Paribas, argues that central bank independence - which anyone born since the 1970s experiences as permanent architecture - is a recent and reversible institutional compromise now caught between an economic anvil and a political hammer. The economic anvil has two components. First, G7 government debt-to-GDP ratios have surged to heights unseen outside wartime and are still rising on current policy, while sovereign borrowing costs have skyrocketed as public and private sectors compete for capital across defence, AI, supply-chain de-risking, the energy transition and ageing; with growth rates not keeping pace, the fiscal effort needed to stabilise debt/GDP keeps growing. This is the setup for fiscal dominance, and she highlights a specific transmission channel other houses have not: the more a government funds at the short end, the more sensitive it is to central bank rate setting, and average government debt maturity has been falling across most G7 countries, especially the US - with the US Treasury now planning to accelerate that trend via much larger buybacks of longer-dated debt financed by short-term issuance. Second, today's inflation is supply-shock driven rather than demand driven, and raising rates 'does not replace the missing goods'; the best it can do is prevent a wage-price spiral, while the pain falls directly on households, governments and businesses, making central bankers easy targets. The political hammer is already swinging: Trump attacking the Fed for not cutting; Japanese political leaders publicly urging the BoJ to keep yields low; opposition leaders in the UK and Canada framing central bankers as unaccountable technocrats; and a leading French presidential candidate advocating that the eurosystem 'cancel' the roughly 18% of French public debt it holds - legally impossible under Articles 123, 125 and 130 TFEU, but she warns any eurozone government pushing it would undermine trust in its sovereign debt and the euro itself, producing the same market reaction seen recently in US and Japanese bonds and currencies but on a far larger scale. So far markets have acted as the guardrail, pushing currencies down and term premia up in both the US and Japan, and Warsh's Jackson Hole speech 'assuaged doubts about his commitment to price stability, for now.' Her warning on market structure is the sharpest investment-relevant point: with sovereign debt now traded predominantly by impatient investors such as hedge funds rather than patient reserve managers and pension funds, the reaction to any perceived loss of independence would be 'brutal and could be unforgiving' - and once credibility is lost, restoring price stability costs materially more in economic terms.", "url": "https://viewpoint.bnpparibas-am.com/central-bank-independence-faces-its-biggest-stress-test-so-far-this-century/", "images": []}, {"source_id": "barclays", "source_name": "Barclays", "title": "The global energy race: A multi-trillion-dollar opportunity", "summary": "Barclays Research's flagship Impact Series (lead contributors Harry Mateer, Head of Americas FICC Research, and Ajay Rajadhyaksha, Global Chairman of Research) argues markets are underestimating both the scale and the duration of what it calls the 'energy addition era.' The starting observation is that every major primary energy source hit record demand last year - oil, gas, coal, solar, wind - with nuclear in renaissance; the neat substitution story of renewables replacing fossil fuels has not happened, and a decade of subdued traditional-energy investment has left the system supply-constrained. Barclays' proprietary model projects global energy demand around 800 quad BTU by 2040, with 1.9% annual demand growth through 2050, data centres alone potentially consuming energy comparable to Russia's entire current consumption by 2040, and roughly 60% of the global vehicle fleet electric by 2050. Meeting that requires approximately $3.6trn of annual investment across resources, power systems, grids, storage and transmission - about three times currently planned AI infrastructure spending. The most acute capital shortfall is in transmission, storage and grid: global grid investment is only ~40% of generation spending, and Barclays sees that ratio moving toward parity. The framework shift is from efficiency to resilience: governments used to optimise for lowest cost and now optimise for reliability, so the marginal barrel, the marginal mcf and the marginal refinery now carry option value - meaning more LNG terminals, more storage, more pipelines, more domestic production. Christian Keller (Global Head of Economics Research) frames this as a geopolitical competition where access to critical minerals, refining capacity and clean-energy technology becomes as strategic as fuel supply, with policymakers facing three problems at once: securing 'molecules', expanding 'electrons' and funding 'science' such as fusion. Regionally, Barclays likes the US (resource base, deep capital markets, AI leadership, scaled infrastructure) and China (renewables manufacturing, critical minerals refining, and demonstrated ability to moderate demand - it has relied less on international oil this year), views Europe as capital-rich but resource-poor with a major infrastructure challenge, and flags Latin America, Africa and Australia as under-appreciated. The inflation conclusion is a direct challenge to the consensus 'AI is medium-term disinflationary' view: Jon Hill and Pooja Sriram argue demand growing faster than supply raises baseline inflation, a tighter energy system absorbs shocks less easily, and geopolitical disruption skews the impulse to the upside, so structural energy demand could keep inflation expectations higher than markets anticipate. Amarpreet Singh adds that current oil prices may not fully reflect underlying tightness, with strategic reserve releases and refining constraints masking it while US production is expected to peak in coming years. For investors, Mateer's conclusion is that energy should be reframed from a value sector to a growth sector: own producers, infrastructure (LNG, grids, utilities and IPPs), energy services and storage, and prioritise strategic assets, strong balance sheets, capital access and the ability to execute long-duration projects over picking specific commodity winners.", "url": "https://www.ib.barclays/content/barclaysmicrosites/ibpublic/en/our-insights/series/impact-series/the-global-energy-race.html", "images": []}, {"source_id": "pimco", "source_name": "PIMCO", "title": "Welcome Back, Balanced Portfolio (PIMCO, Lotfi Karoui & Michael Puempel, 8 Sep 2026)", "summary": "PIMCO's flagship asset-allocation piece of the quarter, structured as answers to the seven objections investors raise against adding bonds. The core claim: the starting point has changed and most portfolios are still positioned for the 2010-2022 regime. (1) Why now — bond yields have been on par with equity earnings yields since late 2023 after more than two decades of trailing them (Fig 1). Starting yield remains the best predictor of medium-term bond returns (Fig 2), so the 5.03% yield-to-worst on the Bloomberg US Aggregate as of 3 September 2026 could translate roughly into a similar annualized return; equity valuations, near multi-decade highs, offer no comparable anchor (Fig 3). PIMCO is explicit that the claim is not that bonds will outperform equities, but that expected returns are now comparable while the risk distribution and the visibility of those returns differ — and that US index concentration means investors are accepting full equity downside plus concentration risk for thin incremental expected return. (2) Haven't bonds stopped protecting portfolios — no, and the critics make a category error by testing the hedge with broad benchmarks containing investment grade credit. IG returns decompose into a government yield component that helps when growth slows and a spread component that widens in bad states; the same applies to high yield, leveraged loans, direct lending and private credit, and PIMCO adds pointedly that private assets only look more stable because valuations are updated infrequently and never market-tested — 'smoother price marks suppress measured volatility but do not remove the exposure.' IG can still deliver resilient total returns today, but that resilience comes from duration and income, not spread. (3) Does duration still hedge drawdowns — yes, nonlinearly. Treasury returns have had little correlation with positive equity quarters, but when the S&P 500 falls at least 5% in a quarter the relationship is much stronger (Fig 4, 1990-Q2 2026 quarterly, excluding 2008-09). Judge a hedge by its behaviour when the risk it insures actually manifests, not by average correlation. (4) Why 2022 broke — exceptionally low starting yields plus the rebuilding of inflation and term premia as policy left near-zero; even then Treasuries' 3.78% Q2 2022 decline was far milder than the 16.45% equity drawdown, and the 10y real yield was around -1% versus roughly +2.4% today, near the high end of its two-decade range. Higher-yield eras like the 1990s and early 2000s are the right comparison (Fig 5). (5) Can secular fiscal pressure stop duration working — PIMCO's most interesting rebuttal: from the 1970s through 1983 the US federal deficit widened steadily to 5.9% of GDP, yet 10-year Treasuries still delivered good risk-adjusted returns through the 1980 and 1981-82 downturns as recession, disinflation and falling policy-rate expectations drove yields lower (Fig 6). Structural forces may raise term premia and keep yields higher in expansions without preventing cyclical rallies in recessions; both the secular and cyclical arguments can be true. (6) Is the opportunity only US — no; 2022's synchronized global inflation shock (Fig 7) has given way to dispersion in growth, inflation, fiscal policy and central bank reaction functions (Fig 8), widening the scope for active duration management. (7) Why hasn't positioning adjusted — behavioral scar tissue: from 2010 through August 2026 the S&P 500 grew more than eightfold nominal and almost fivefold real while the US Aggregate returned just over 2% annually, and 2022's ~13% Agg loss taught investors a 1.5%-yielding 10-year could still lose double digits (Fig 9). US households now hold a record share of financial assets in equities and pensions remain heavily equity-tilted (Figs 10, 11). Bottom line: a more balanced allocation is warranted at this stage of the cycle — not because bonds will beat stocks, but because they can again deliver meaningful income and real downside mitigation, the two functions low yields stripped away for over a decade.", "url": "https://www.pimco.com/us/en/insights/welcome-back-balanced-portfolio", "images": []}, {"source_id": "man_group", "source_name": "Man Group", "title": "The Mispriced Debt Powering the AI Boom (Man Group, Views from the Floor, 9 Sep 2026)", "summary": "The most actionable single credit idea in this batch, and the piece that most directly connects the AI trade to the bond market. Man Group's argument: technology giants are flooding the bond market to pay for the physical footprint of the AI boom, with total outstanding debt for AI-related borrowers (hyperscalers and cloud providers) growing at roughly four times last year's pace per a June Morgan Stanley report, and hyperscalers estimated to spend up to $800 billion on AI infrastructure this year alone. That has propelled data centre securitisation — ABS that pool data centre tenant lease payments to service tradable bonds, collateralised by the underlying real estate and equipment — into one of the fastest-growing segments of structured credit. The anomaly: investors are being paid a spread premium to hold debt secured by hard assets and contractual cash flows versus the unsecured bonds of the very same firms building them. Comparing the three routes into the build — IG-rated hyperscaler unsecured corporates (tight yields, no structural claim, no protection beyond the balance sheet), neocloud high yield (materially greater credit risk, still unsecured, no collateral backstop), and data centre ABS (same fundamentals plus subordination where junior tranches absorb losses first, overcollateralisation, cash-flow covenants and a direct claim on the buildings and equipment) — the pricing is inverted. Within a single rating band since early 2025, AA data centre ABS have offered 155-175bp while AA unsecured corporate debt traded at just 45-70bp: a ~100bp gap where the higher yield belongs to the instrument with the claim on the buildings and the rent. The pattern repeats down the stack, with A-rated ABS routinely yielding more than lower-quality BBB- unsecured paper. Man's diagnosis is that a meaningful portion of the gap is a liquidity and complexity premium rather than fundamental credit risk — the market is struggling to absorb new supply, ABS trade less frequently given a smaller market and fewer participants, and investors are effectively demanding a premium for structural safety the market hasn't yet learned to underwrite. The risks Man does flag are technical rather than solvency-driven: if a tenant slows infrastructure spending or renegotiates lower rent at renewal, the appraised value mechanically drops, which can breach LTV thresholds and trigger an automatic downgrade even if the tenant never misses a payment, forcing ratings-constrained insurers to sell into a thin market. Additional vulnerabilities: concentration, since many deals reference a small pool of big-tech tenants so one tenant's leasing-strategy or capex change can hit multiple transactions at once without any default; and technology obsolescence, since computer hardware depreciates faster than the 15-to-20-year real estate cash flow assumptions embedded in many deals. Man also notes a live precedent — when geopolitical volatility spiked earlier in 2026 a new high-quality data centre deal stalled purely because the market turned risk-off, with tenant creditworthiness untouched, and spreads compressed once demand returned — concluding that managers able to act as a source of liquidity when others cannot can harvest these dislocations, and that the mispricing is structural rather than one-off. Note for readers: Man's two supporting exhibits (data centre ABS issuance 2022-YTD 2026, and corporate bond vs ABS spreads at issuance since 2025, both Bloomberg as of 7 September 2026) are embedded infographics not captured as images.", "url": "https://www.man.com/insights/views-from-the-floor-2026-9-Sept", "images": []}, {"source_id": "t_rowe_price", "source_name": "T. Rowe Price", "title": "Why the bull case is still in play for equity markets (T. Rowe Price, Sébastien Page, 3 Sep 2026)", "summary": "The September Asset Allocation Committee note, written as an explicit bull-bear debate and the clearest statement of a major multi-asset house's tactical stance this window. Co-chair Charles Shriver's nine-word summary: 'Fundamentals: solid. Macro: mixed. Valuations: on the high side.' The committee lands on a modest equity overweight run as a buy-the-dip posture, still liking small- and mid-caps and US growth stocks, preferring emerging markets over ex-US developed, and holding an overweight to international value explicitly as diversification against an AI-driven selloff. The bear case: the Middle East and Ukraine wars show few signs of near-term resolution; a meaningful share of global refining capacity is offline, squeezing diesel and other refined products, with crack spreads the key indicator because refining capacity is the immediate binding constraint — a stagflationary mix that adds to inflation while weakening growth. One member on complacency: 'Markets have absorbed body blow after body blow, but there's a cumulative effect that we may be underestimating. I don't see how the war in the Middle East gets resolved anytime soon.' That cumulative effect reaches markets through inflation and higher bond yields — 'we could get an inflation shock and a rate shock' — and an interest-rate-driven equity correction is the committee's live near-term risk. The bull case starts with de-escalation taking oil into the $50/bbl range next year, easing inflation and supporting consumers. Several members think AI accelerates growth outright: bulls and bears agree the capital deployment is unprecedented as a share of GDP, bears see a bubble and bulls an industrial revolution, and the note concedes history suggests both can be right — 'the last 20 years may be a poor anchor for the next decade.' The AI trade is becoming more nuanced, with rising company-level dispersion creating stock-selection opportunity; the forward 12
