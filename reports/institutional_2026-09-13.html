-month P/E for the S&P 500 Semiconductor & Semiconductor Equipment group fell from 31 to 19 over the year to 31 July 2026 as growth decelerated, and the committee reads the AI-related selloffs as a healthy reset of positioning rather than a break. Crucially, the bullish equity scenario is the bearish fixed income scenario: yields range-bound near term, trending up over time as stronger nominal growth and productivity work through. The 'early-to-middle innings' argument is the most actionable part: agentic systems adoption is bullish for AI infrastructure including memory and storage, networking and CPUs; analysts see a potential flywheel from GPU-backed financing improving chip-making capacity and driving standardization that attracts institutional capital; upward earnings revisions have broadened beyond energy (8 of 16 sectors); business activity in the US, eurozone, Japan and UK just reached its highest level since early 2022; and US capacity utilization was 76.29 in July 2026, meaningfully below recent and historical averages, implying industrial areas have ample room to expand. The committee's own AI agent summarised the room as 'structurally constructive on equities, but with a clear preference for a patient approach and better entry points rather than pressing risk here.'", "url": "https://www.troweprice.com/en/us/insights/Why-the-bull-case-is-still-in-play-for-equity-markets", "images": []}, {"source_id": "rbc", "source_name": "RBC Capital Markets", "title": "Midterm malaise - Helima Croft on oil, Iran and the November elections", "summary": "RBC's commodity strategy head lays out why the White House has run out of levers 55 days before the midterms. Brent has breached $100 with retail gasoline around $4.20/gal and diesel around $6.00/gal, while roughly 9 mb/d of Middle Eastern supply sits effectively offline. Diplomacy is deadlocked: Iran insists on full implementation of the June MoU (access to frozen funds, full sanctions removal, a $300bn reconstruction facility and formal Hormuz operational control rights), terms Croft judges unacceptable to Washington's 'finish-the-job' camp and to regional allies. Verbal intervention has passed peak effectiveness - Bessent's July claim that the war would end within days may have been the high-water mark - and Trump now appears to accept higher prices into the election. Escalation is live: in 24 hours the US sank five Iranian tankers near Kharg Island and Jask, Iran fired on two US Navy ships, eight tankers and US bases in Jordan, and the Houthis hit Jizan again as Saudi Red Sea exports fell below 2 mb/d. The refined-product problem is the sharpest policy bind, with spare refining capacity minimal, ~3 mb/d of Russian capacity offline from Ukrainian strikes, refiners lobbying for a renewable fuel standard rollback the administration will not grant for farm-state reasons, and analysts privately floating pressure on Kyiv to stop refinery strikes. Croft's key structural point for investors: China is now the swing player - strategic reserves absorbed the shock, refinery runs are back above 90% of pre-war levels (+18% from early-July lows) and August crude imports were +19% from June lows - so the old channel of calling Riyadh for OPEC barrels is closed, and Beijing arrives at the Xi-Trump summit holding leverage. Finally, the 'forever war' scenario has a second-order cost: sustaining Hormuz escort operations has drawn US forces from the Indo-Pacific, with implications for Taiwan-contingency credibility.", "url": "https://www.rbccm.com/en/insights/2026/09/midterm-malaise", "images": []}, {"source_id": "galaxy_digital", "source_name": "Galaxy Digital", "title": "Inference Market (and Micro) Structure", "summary": "Galaxy's flagship AI-economics piece argues that as intelligence commoditizes, compute becomes the trade. Open-source models are near frontier parity and usage is up 350x since January 2025; OpenRouter routed 125x more tokens last week than in January 2025 with open-source at 75% of volume (up from 27%). Since GPT-4 no frontier model has held the lead longer than 100 days and new models ship every 41 days, compressing the window to amortize training capex to roughly four months. Singh maps the inference stack onto a trading venue: buyers of tokens (Cursor, Lovable, enterprises), a marketplace (OpenRouter, 5.5% take, $55m net revenue per $1bn GPV, default routing weighted by 1/price-squared so halving a quote roughly quadruples flow), and sellers (Fireworks, Baseten, Together) quoting a one-sided book. Demand elasticity splits 15% highly elastic / 25% medium / 40% low / 5% inelastic, and because over 70% of routed tokens already come from CLIs and agents, the marginal token is very elastic even though the average token is not. Price discovery is broken: quotes cluster at administered anchors (five providers quoting exactly $1.74/$3.48 on DeepSeek V4 Pro, seven at $0.95/$4.00 on Kimi K2.6), spans reach 4x across 17 providers, quantization disclosure is self-reported, and there is no bid side or arbitrage venue. Providers run an oil-style crack spread: long GPU-hours forward, short tokens spot. With m = p*R*u - c, at $2.74/hr H100 rent, 1,000 tok/s and $0.90/M tokens, full utilisation earns $3.24/hr for a +$0.50 spread while 50% utilisation gives -$1.12/hr; breakeven utilisation is 85%. Reported 45-50% margins come from term GPU commitments, dynamic fleet rebalancing (LoRA adapter swaps push effective utilisation from 50% to 120%, 'airline overbooking' style), and serving-stack optimisations — quantization (FP4 gives 1.8x over FP8; B200 FP4 up to 3.65x perf/$ of H200 FP8), prefix/KV caching (coding agents reuse 85-97% of prompts; 90% reuse takes ~10x off the GPU bill), speculative decoding, prefill/decode disaggregation (10-30%, up to 4.4x for large MoE), and expert parallelism (1.5-2.5x). But that alpha decays fast and is decaying faster: 11-16 months for prefill/decode disaggregation, 3-8 for MLA, 1-2 for EAGLE-3. Roughly $50 of every $100 of tokens is burnt in GPU-hours, DeepSeek's flagship output price fell ~8x since January 2025 ($2.19/M to $0.28/M) while the H100 index rose 17% ($2.34 to $2.74), and GPU-hour vol averages 130% annualized (312% currently, with spot running $1.63 in February to $3.28 in May). Conclusion: once software and hardware optimisation asymptotes, an inference provider's business becomes a trading book, and compute futures are the instrument that makes it hedgeable. Basis risk remains because contracts settle on index-spec H100 hours while real fleets mix vintages, regions and interconnects.", "url": "https://www.galaxy.com/insights/perspectives/inference-market-and-micro-structure", "images": []}, {"source_id": "peterson_institute", "source_name": "Peterson Institute for International Economics", "title": "Has the Chinese yuan's rise in global usage hit a wall?", "summary": "Martin Chorzempa's data-forensic piece is the most directly contrarian thing in this batch for anyone positioned for de-dollarisation. The yuan's SWIFT payment share rose from under 1% in 2010 to 2.8% by late 2015, stagnated around 2% for five years after a sharp depreciation and tightened capital controls, then spiked after 2023 sanctions on Russia to peak at 4.7% of global payments in July 2024 — passing the yen and Canadian dollar to become the fourth most used. It has since fallen back to 2.75%, making it the sixth most used, behind even the Canadian dollar. Chorzempa tests the standard Chinese rebuttal — that yuan payments have migrated off SWIFT onto CIPS's own independent messaging network for direct participants, which has grown from 79 banks in January 2023 to 210 today — by bringing Hong Kong's CHATS system into the comparison. CHATS handles three times as many payments as CIPS; its average daily RMB volume has fallen by over 1trn yuan from June 2024 to June 2026, while CIPS volume is up only about 200bn, one-fifth of that. So migration cannot explain the decline and the SWIFT signal is directionally correct — though CIPS is now at all-time highs and its divergence from SWIFT and CHATS for the first time does show China prioritising sanctions resilience and self-sufficiency at the cost of diverging from global payment standards, with the Strait of Hormuz crisis reviving CIPS growth. Corroborating series: SAFE data show yuan settlement of China's cross-border payments stuck near half since early 2023 with the dollar holding a steady ~90% share of the non-yuan remainder, so China has not swapped dollars for euros; yuan settlement of China's goods trade rose to 28% in H1 2025 from an 11% low in 2017 and 23% in 2015, but the series ends before the SWIFT drop and shows internationalisation can proceed in waves and reverse; and BIS data show the yuan on one side of 8.5% of global FX transactions by mid-June 2025, up from 2% in 2013, but entirely at the expense of non-dollar currencies, with the dollar's share rising from 87% to 89%. The digital yuan is immaterial: mBridge had handled 4,047 transactions totalling 387.2bn yuan as of November 2025, and FT-reported figures imply only 83bn yuan of new transactions from November 2025 to June 2026 — about one-tenth of a single day's CIPS volume, against CIPS's roughly 33,000 transactions per day. Chorzempa's conclusion: 72% of China's goods trade is still settled in others' currencies, the yuan punches far below China's economic weight, and its failure to gain during a period of heightened global concern about the dollar is 'particularly surprising' — yuan internationalisation now looks like an insurance policy to be activated if sanctions force China off the dollar, not an active challenge.", "url": "https://www.piie.com/blogs/realtime-economics/2026/has-chinese-yuans-rise-global-usage-hit-wall", "images": []}, {"source_id": "brookings", "source_name": "Brookings Institution", "title": "Europe's China Shock 2.0: Where does it go from here?", "summary": "A seven-expert Brookings symposium built around one prompt: China's surging exports are causing large-scale job losses and deindustrialisation across the EU — how should Europe respond, and what happens next? The operative deadline is October, set by EU trade chief Maroš Šefčovič, who warns 'China's exports to the EU keep rising, while our market share in China keeps shrinking. This trend is not sustainable, and the status quo is not an option.' Ryan Hass argues China is betting Europe won't push back, for three reasons: Beijing judges EU leaders politically weak, divided on China, and without a mandate for a trade war amid the Ukraine war and a widening transatlantic rift; it believes it can sell its market as indispensable future demand to European industrial giants; and it holds punitive tools it is willing to use. On the current trajectory the export wave decimates EU autos, chemicals, green energy, machinery and industrial tools, altering Europe's political centre of gravity — the only question is whether the pushback comes now or later. Daniel Hamilton catalogues what Brussels has already done (new anti-subsidy and anti-dumping duties, steel import cuts, sanctions on Chinese entities supporting Russia, clean-tech and overcapacity investigations) and what is being readied (updated cybersecurity rules, an Industrial Accelerator Act to cut strategic import dependencies, block Chinese products from public contracts and limit takeovers), notes the trade surplus now exceeds $1bn a day, but concludes decisive action is unlikely soon because Beijing exploits intra-EU differences and many member states fear losing Chinese critical minerals for their defence, clean-tech, pharma and chemical sectors. His key asymmetry: China is twice as dependent on the EU for strategic imports as the EU is on China, and Europe's chokepoints are leading-edge semiconductor equipment, advanced automotive chips and specialised machinery — plus the untapped self-help of a true Single Market and an integrated Capital Markets Union. Constanze Stelzenmüller insists this is 'a peculiarly German drama,' much as Russian energy dependence was: when Germany blocks, smaller economies hesitate; Merz has sharpened his tone and a July Franco-German paper urged 'swift and systematic' use of EU trade defence, but economics minister Katherina Reiche is running shadow diplomacy against Berlin's shift, and the AfD's September state-election sweep will dent Merz further. Kari Heerman's contribution is the sober coda: China has responded to European countervailing duties on EVs and new anti-coercion tools with countermeasures rather than acceptance of disciplines, so stronger defences can accomplish only so much.", "url": "https://www.brookings.edu/articles/europes-china-shock-2-0-where-does-it-go-from-here/", "images": []}], "D_charts": [{"source_id": "federal_reserve", "source_name": "Federal Reserve", "chart": "Three figures on gold versus Treasuries as reserve assets: world gold reserves and foreign official Treasury holdings through June 2026 (with and without U.S. gold); cumulative gold purchases splitting central bank buying from physical gold ETF inflows through 2026:Q2 (showing the 2025 price surge was ETF-driven, not official); and modified world gold reserves versus foreign Treasury holdings excluding the U.S., Germany, France, Italy and the IMF, where Treasuries lead gold by about $1trn. The key chart for anyone trading the de-dollarisation narrative.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/why-gold-didnt-actually-overtake-treasury-securities-as-the-worlds-favorite-reserve-asset-20260903.html", "images": ["https://www.federalreserve.gov/econres/notes/feds-notes/fig1-4147.png", "https://www.federalreserve.gov/econres/notes/feds-notes/fig2-4147.png", "https://www.federalreserve.gov/econres/notes/feds-notes/fig3-4147.png"]}, {"source_id": "federal_reserve", "source_name": "Federal Reserve", "chart": "Brent oil 12-month forecast performance: the ratio of 12-month futures to spot on the y-axis, with each month coloured by whether futures subsequently beat random walk, momentum and mean-reversion forecasts. Futures win at the extremes — deep backwardation and steep contango — and lose in the middle, which is exactly the regime the Hormuz-driven backwardated curve is in now.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/revisiting-the-forecasting-potential-of-futures-prices-20260903.html", "images": ["https://www.federalreserve.gov/econres/notes/feds-notes/figure1-4171.png"]}, {"source_id": "bnp_paribas", "source_name": "BNP Paribas", "chart": "BNP Paribas AM's chart of the week plots record US AI capital expenditure against national productivity growth of 2.2%, showing that unlike the 1996-2000 dot-com period - when productivity rose alongside capex - today's AI spending has not yet translated into economy-wide productivity gains. This is the single most direct visual challenge in the batch to the bull case that AI capex justifies itself through productivity.", "url": "https://viewpoint.bnpparibas-am.com/take-two-bond-sell-off-endures-eurozone-inflation-rises/", "images": ["https://viewpoint.bnpparibas-am.com/wp-content/uploads/2026/09/Exhibit-1-AI-investments-impact-on-productivity-has-yet-to-show.png"]}, {"source_id": "bnp_paribas", "source_name": "BNP Paribas", "chart": "Five exhibits underpinning BNP Paribas AM's EM equity thesis: Exhibit 1 charts the 'massive migration of free cash flow' from US hyperscalers (~$860bn of 2026 capex, aggregate FCF turning negative this year) to three Asian memory and foundry titans (>$300bn of forecast FCF); Exhibit 2 shows earnings and profitability improving markedly across North Asian listed firms; Exhibit 3 shows South Korean market volatility normalising after July's positioning squeeze; Exhibit 4 shows earnings estimates revised upward even during the July correction (technical, not fundamental); Exhibit 5 shows the EM valuation discount versus developed markets widening further.", "url": "https://viewpoint.bnpparibas-am.com/picks-shovels-and-deep-value-a-re-examination-of-emerging-market-equities/", "images": ["https://viewpoint.bnpparibas-am.com/wp-content/uploads/2026/09/Exhibit-1-The-massive-migration-of-free-cash-flow.png", "https://viewpoint.bnpparibas-am.com/wp-content/uploads/2026/09/Exhibit-2-Earnings-and-profitability-have-improved-markedly-across-North-Asian-listed-firms.png", "https://viewpoint.bnpparibas-am.com/wp-content/uploads/2026/09/Exhibit-3-South-Korean-market-volatility-normalising-after-Julys-positioning-squeeze.png", "https://viewpoint.bnpparibas-am.com/wp-content/uploads/2026/09/Exhibit-4-Earnings-estimates-were-revised-upward-even-during-July-correction.png", "https://viewpoint.bnpparibas-am.com/wp-content/uploads/2026/09/Exhibit-5-EM-equities-valuation-discount-versus-developed-markets-has-widened-further.png"]}, {"source_id": "bnp_paribas", "source_name": "BNP Paribas", "chart": "Four exhibits on fiscal dominance: G7 public debt at post-war highs and still rising on current policy; long-term interest rates at multi-decade highs; the growing fiscal effort required to reduce debt/GDP ratios as borrowing costs outrun growth; and the share of government debt funded at short maturities, which is rising across the G7 and especially in the US - the mechanism by which fiscal pressure converts into pressure on the central bank's policy rate.", "url": "https://viewpoint.bnpparibas-am.com/central-bank-independence-faces-its-biggest-stress-test-so-far-this-century/", "images": ["https://viewpoint.bnpparibas-am.com/wp-content/uploads/2026/09/Exhibit-1-Public-debts-are-at-post-war-highs-across-the-G7.png", "https://viewpoint.bnpparibas-am.com/wp-content/uploads/2026/09/Exhibit-2-Long-term-interest-rates-are-at-multi-decade-highs.png", "https://viewpoint.bnpparibas-am.com/wp-content/uploads/2026/09/Exhibit-3-Growing-fiscal-efforts-are-required-to-reduce-debt-to-GDP-ratios.png", "https://viewpoint.bnpparibas-am.com/wp-content/uploads/2026/09/Exhibit-4-Share-of-government-debt-with-short-term.png"]}, {"source_id": "pimco", "source_name": "PIMCO", "chart": "Eleven-figure sequence underpinning PIMCO's balanced-portfolio case. Fig 1: bond yields vs equity earnings yields, comparable since late 2023 after two decades of bonds trailing. Fig 2: starting fixed income yield vs subsequent 5-year annualized return, Feb 1990-Jul 2026 — a tight trendline, the basis for reading 5.03% as a forward return estimate. Fig 3: the same scatter for equity forward earnings yield, visibly weaker. Fig 4: Treasury returns vs S&P 500 quarterly returns, showing little relationship in up quarters but a strong hedge when equities fall 5%+ (1990-Q2 2026, ex-2008/09). Fig 5: risk-adjusted performance of balanced portfolios by starting yield. Fig 6: US federal deficit vs 10y Treasury performance through the 1980 and 1981-82 recessions, the fiscal-doesn't-break-duration exhibit. Figs 7-8: 2022's synchronized global sovereign selloff vs today's dispersion in 10-year sovereign returns. Fig 9: real cumulative fixed income gains wiped out in 2022. Figs 10-11: US household equity allocations at a record high and US pension portfolios still heavily equity-tilted (Fed Flow of Funds, as of 31 July 2026) — the positioning evidence for the whole thesis.", "url": "https://www.pimco.com/us/en/insights/welcome-back-balanced-portfolio", "images": ["https://megaphone.imgix.net/podcasts/2ced0ac2-abd4-11f1-b33d-0fe8a437d695/image/3d67e378c1fbca270c3bfd847391e49c.png?ixlib=rails-4.3.1&w=240&h=240", "https://www.pimco.com/us/en/-/media/global-assets/insights/economic-and-market-commentary/general/2026/09/welcome-back-balanced-portfolio/fig-1_2026-09-06t19_55_34.webp?rev=f52ae796437846d69d4631258c2669b8&la=en-US&h=720&w=1280&hash=5BE1134440CF824C33116CA7B4374968", "https://www.pimco.com/us/en/-/media/global-assets/insights/economic-and-market-commentary/general/2026/09/welcome-back-balanced-portfolio/fig-2_2026-09-06t19_55_36.webp?rev=8e8b17cf5a914e65a51ca2ffb8b5e -assets/insights/economic-and-market-commentary/general/2026/09/welcome-back-balanced-portfolio/fig-10_2026-09-06t19_55_33.webp?rev=32263adcbf664a028dc39ed083b265af&la=en-US&h=1920&w=3413&hash=347C2E93859C382B9D3918FDE0F94C30", "https://www.pimco.com/us/en/-/media/global-assets/insights/economic-and-market-commentary/general/2026/09/welcome-back-balanced-portfolio/fig-11_2026-09-06t19_55_33.webp?rev=e6d3b2eb6d8545948a024a96f9891cd2&la=en-US&h=1920&w=3413&hash=DCDA00B13621A3311A33446A91FFA00B"]}, {"source_id": "amundi", "source_name": "Amundi", "chart": "Amundi's Global Investment Views figure set (Figs 1-7, September 2026) accompanying the 'credibility under scrutiny' view — the cross-asset views grid by asset class, plus exhibits on the global long-end yield move, gold, and regional equity earnings. Matters because it is the visual record of a major European allocator simultaneously running steepeners in the US, EMU and UK, a flattener in Japan, and an increased gold overweight.", "url": "https://research-center.amundi.com/article/global-investment-views-september-2026", "images": ["https://static.amundi.com/web-assets/awf-assets/research-center/styles/article_jumbotron_desktop/s3/2024-07/RC-2024.07-Global-Investment-Views-Slider_0.png.webp?h=4ff5b213&itok=8K5Yk4KP", "https://static.amundi.com/web-assets/awf-assets/research-center/styles/max_1300x1300/s3/2026-09/2026.09---Global-Investment-Views--Fig1---EN.jpg.webp?itok=vdj59fIk", "https://static.amundi.com/web-assets/awf-assets/research-center/styles/medium/s3/2023-02/DEFEND%20Monica.png.webp?itok=yrtP_e5t", "https://static.amundi.com/web-assets/awf-assets/research-center/styles/max_1300x1300/s3/2026-09/RC-2026.09-Global-Investment-Views-Fig2.png.webp?itok=rt7KjwpO", "https://static.amundi.com/web-assets/awf-assets/research-center/styles/max_1300x1300/s3/2026-09/RC-2026.09-Global-Investment-Views-Fig3.png.webp?itok=oIgUhq--", "https://static.amundi.com/web-assets/awf-assets/research-center/styles/max_1300x1300/s3/ onstructive-on-equities.png"]}, {"source_id": "standard_chartered", "source_name": "Standard Chartered", "chart": "Weekly Market View chart pack: managed futures positioning in US, German, Japanese and UK bonds shows CTA short positioning at record levels (SC's 'charts of the week', used to argue the yield spike is self-limiting); US AI adoption rates (US Census Bureau) heading to 25.1% in Q4; US government bond yield curve at multi-year highs; global semiconductor 12-month forward P/E at ~16x versus a ~20x five-year average; hyperscaler bond issuance as a rising share of US IG supply; total US crude stocks below their five-year range; ECB staff macroeconomic projections; Australia CPI vs AUD/USD vs 10-year yield; MSCI Japan sector domestic/overseas revenue split; DXY and USD/JPY technicals. Matters because it is the quantitative backing for the batch's two biggest trades - fade the yield spike into 3-7yr paper, and buy semis on de-rated multiples.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-11-9-2026/?mvog=1", "images": ["https://av.sc.com/market-outlook/content/images/WMV005-1789110991.png", "https://av.sc.com/market-outlook/content/images/WMV006-1789110994.png", "https://av.sc.com/market-outlook/content/images/WMV001-1789110853.png", "https://av.sc.com/market-outlook/content/images/WMV002-1789110934.png", "https://av.sc.com/market-outlook/content/images/WMV003-1789110944.png", "https://av.sc.com/market-outlook/content/images/WMV004-1789110956.png", "https://av.sc.com/market-outlook/content/images/WMV007-1789111129.png", "https://av.sc.com/market-outlook/content/images/WMV008-1789111203.png", "https://av.sc.com/market-outlook/content/images/WMV009-1789111275.png", "https://av.sc.com/market-outlook/content/images/WMV010-1789111335.png", "https://av.sc.com/market-outlook/content/images/WMV011-1789111418.png", "https://av.sc.com/market-outlook/content/images/WMV012-1789111479.png", "https://av.sc.com/market-outlook/content/images/WMV013-17891116 r Week 36 — blockchain equities +5.2% versus Bitcoin +2.7%, with movers Robinhood +13.6%, Circle +9.5%, Bullish +7.9% against PayPal -7.6%, Metaplanet -5.9%, Keel Infrastructure -4.6%. Matters because it quantifies the rotation CoinShares argues is happening: money moving within crypto toward infrastructure and tokenisation equities that earn regardless of spot BTC.", "url": "https://coinshares.com/insights/research-data/equities-update-08-09-2026/", "images": ["https://a.storyblok.com/f/176807/3296x1600/432920dbaa/equity-update-1.png"]}, {"source_id": "coinshares", "source_name": "CoinShares", "chart": "CoinShares market update visual accompanying the digital-asset fund flow reversal — from ~US$1.3bn of inflows last week to US$243m of outflows week-to-date after the CPI print. The single cleanest read on how tightly crypto flows are now tracking the Fed's September decision.", "url": "https://coinshares.com/insights/research-data/market-update-11-09-2026/", "images": ["https://a.storyblok.com/f/176807/3296x1600/bdaeac9ad2/cover-market-update.png"]}, {"source_id": "galaxy_digital", "source_name": "Galaxy Digital", "chart": "Eighteen charts covering the crypto leverage stack: CeFi versus DeFi outstanding borrows, the DeFi dominance collapse from 64.24% to 54.86%, the $47.12bn onchain borrow peak and 40.2% drawdown to $28.17bn, CeFi market share (Tether 61.84%), futures/perps open interest falling 39.09% QoQ from $197.18bn to $120.11bn, and stablecoin borrow rates versus CDP mint rates with Fed Funds as a floor for 18+ months. The core evidence that onchain leverage has already deleveraged while CeFi books kept growing.", "url": "https://www.galaxy.com/insights/research/state-of-crypto-leverage-q4-2025", "images": ["https://images.ctfassets.net/h62aj7eo1csj/2di51gbM4KfuCg7nltG1Qs/133d6c2ef0a5ede54b29b4e57ecd340a/Hero-5.png?w=1500&q=60&fm=avif", "https://images.ctfassets.net/h62aj7eo1csj/5AyQkzFmn9AVw7T2SAtxYg/88ac5afd695dc4dd0d6e40109b9d190f/AK-240905-GALAXY-ZACH-POKO cUPu/146c5d0f83c2522144a9efada651efef/MSTR_Preferred_June-July_Charts.png?w=1500&q=60&fm=avif", "https://images.ctfassets.net/h62aj7eo1csj/10UACLCdPZGROytfiszhN7/58799ddc28cb218d4f27fab7ea09a88b/Risk_Managing_Prediction_Markets.png?w=480&q=60&fm=jpg", "https://images.ctfassets.net/h62aj7eo1csj/5ArKVZKUpzBXPH724qUMur/bd43e728d1f7fa32f831a05e8c656095/Bitcoin-13.png?w=480&q=60&fm=jpg"]}, {"source_id": "opec", "source_name": "OPEC", "chart": "OPEC's required-production table for the seven voluntary-adjustment countries, showing October 2026 required production held at September 2026 levels — the visual confirmation that the unwind of the April/November 2023 voluntary cuts is on pause.", "url": "https://www.opec.org/pr-detail/1835613-6-september-2026.html", "images": ["https://www.opec.org/assets/imagedb/pic/1788692107.png"]}, {"source_id": "bca_research", "source_name": "BCA Research", "chart": "BCA's Daily Insights chart run for 4-11 September — the single densest chart set in this batch. Covers the August CPI that locked in the September Fed hike, the ECB's energy-driven 25bp move to 2.50%, the August PPI cost-push impulse, the savings-rate/consumer piece behind the 'stay at benchmark equity weight' recommendation, the Middle East oil escalation, the term-premium implication of Bessent's Treasury toolkit with the 10-year at 4.85%, the NFIB pushback at 98.7, the +162k payroll print, Canada's -41.7k employment break, and Arthur Budaghyan's EM report-card Chart of the Week.", "url": "https://www.bcaresearch.com/marketing/felix-antoine-vezina-poirier", "images": ["https://www.bcaresearch.com/sites/default/files/styles/research_list_report/public/chart/files/DIN260911TN_0.png.webp?itok=n3Oj3dKM", "https://www.bcaresearch.com/sites/default/files/styles/research_list_report/public/chart/files/DIN260910CBF_0.png.webp?itok=UCnZaN2j", "https://www.bcaresearch.com/sites/default/files/styles/research_list_report/public/chart/files/DIN260909TP_0.png.webp?itok=1Pa4QP-c", "https://www.bcaresearch.com/sites/default/files/styles/research_list_report/public/chart/files/DIN260904COTW.png.webp?itok=ppMwTWGo"]}, {"source_id": "gavekal", "source_name": "Gavekal Research", "chart": "Macrobond chart behind Gave's 'energy stocks as the new antifragile buffer' call: energy as the best-performing sector in both the S&P 500 and MSCI World over five years and, with financials, the only sector at new all-time highs — with its outperformance clustered in exactly the windows when equities broadly fell and OECD government bonds also fell (early 2022 Russia-Ukraine; March 2026 US/Israel bombing of Iran). The core evidence for replacing duration with energy equity as the portfolio hedge.", "url": "https://research.gavekal.com/teaser/on-energy-stocks-as-a-portfolio-diversifier/", "images": ["https://research.gavekal.com/macrobond/display_chart/3d03dc20-c8a6-4a07-90bc-f66e32c4a2c4/"]}, {"source_id": "gavekal", "source_name": "Gavekal Research", "chart": "Tan Kai Xian's chart of US productivity growth, inflation and real GDP growth since the late-2022 ChatGPT launch — showing productivity gains coinciding with rising inflation and real GDP still near its 20-year median of 2.3%, i.e. the AI-disinflation thesis failing its first real test. Directly relevant to whether the Warsh Fed's framework survives contact with the data.", "url": "https://research.gavekal.com/teaser/ai-versus-the-labor-market/", "images": ["https://research.gavekal.com/macrobond/display_chart/19a40cfa-0600-48c6-baee-f669bdfdf34e/"]}, {"source_id": "gavekal", "source_name": "Gavekal Research", "chart": "Listed Chinese companies' capital expenditure since the 2024 inflection — the evidence base for Gatley's contrarian claim that investment now only offsets depreciation, so Chinese excess capacity should stop worsening. A direct visual counterweight to the China Shock 2.0 overcapacity narrative.", "url": "https://research.gavekal.com/teaser/the-capex-correction-continues/", "images": ["https://research.gavekal.com/macrobond/display_chart/ee0a300c-b18b-4773-a4e6-b4eed48b5a58/"]}], "house_views": [{"source_id": "boe", "source_name": "Bank of England", "stance": "Bank Rate held at 3.75% since March 2026 with a genuinely split MPC — Pill voting 4%, Mann on an 'activist hold' with a hike option, Taylor pressing for a resumption of cuts toward a 3% neutral — as the Gulf energy shock pushed April CPI to 2.8% and is expected to peak around 3.25% this year; the Bank insists inflation returns to 2% but 'it will take longer', and is simultaneously building out a multi-money system of tokenised deposits, systemic sterling stablecoins and a digital gilt.", "url": "https://www.bankofengland.co.uk/speech/2026/september/remarks-at-the-edinburgh-chamber-of-commerce"}, {"source_id": "ecb", "source_name": "European Central Bank", "stance": "Passive quantitative tightening continues with no purchases in any portfolio — APP and PEPP running off by redemption only, monetary policy securities EUR3,360.7bn, deposit facility EUR2,005.2bn and base money EUR3,967.8bn as at 4 September 2026; the ECB's June 2026 claim that gold has displaced Treasuries as the top reserve asset is being publicly contested by Fed staff.", "url": "https://www.ecb.europa.eu/press/annual-reports-financial-statements/wfs/2026/html/ecb.fs260908.en.html"}, {"source_id": "federal_reserve", "source_name": "Federal Reserve", "stance": "No FOMC policy communication in this batch; the Board's published output is staff research pushing back on the de-dollarisation narrative (Treasuries still lead gold ex-legacy holders by ~$1trn), defending commodity futures as forecast inputs when curves deviate >5% from spot, mapping highly uneven state-level tariff incidence, and preparing the monetary aggregates for tokenised deposits, tokenised MMFs and GENIUS Act stablecoins — alongside its standing four-vulnerability financial stability framework.", "url": "https://www.federalreserve.gov/econres/notes/feds-notes/why-gold-didnt-actually-overtake-treasury-securities-as-the-worlds-favorite-reserve-asset-20260903.html"}, {"source_id": "world_bank", "source_name": "World Bank", "stance": "Development-side view centred on human capital as the binding constraint on EM growth: PISA 2025 shows Latin America four to five years of learning behind the OECD and still sliding, roughly half of skills are built at work rather than school, 43% of the world cannot reach a health facility within an hour's walk, and government AI adoption across 60 economies is broad but shallow (44% ad hoc individual use) ahead of WDR 2026 and the 12–18 October Annual Meetings in Bangkok.", "url": "https://blogs.worldbank.org/en/developmenttalk/half-your-skills-came-from-work--policy-hasn-t-caught-up"}, {"source_id": "ubs", "source_name": "UBS", "stance": "Constructive on equities through a hiking Fed: now expects 25bp hikes in September and December (fed funds to 4.00-4.25%), S&P 500 EPS +25% in 2026 and +14% in 2027, favours AI / Power and resources / Longevity with broader sector and geographic participation; no longer recommends locking in short-to-medium duration yields as a cash alternative and instead points to medium-to-long high-quality bonds; gold is a strategic hedge, not a Fed trade; copper then aluminium preferred in commodities.", "url": "https://www.ubs.com/global/en/wealthmanagement/insights/chief-investment-office/house-view/daily/2026/latest-07092026.html"}, {"source_id": "goldman_sachs", "source_name": "Goldman Sachs", "stance": "Bullish equities into 2027 ('well over 8,000' on the S&P from the cross-asset desk on a 19x multiple and ~30% Q2 earnings growth) while naming the back end of the rate curve as the largest risk on the board; Research expects a persistently steep global curve, ~5.2% 30-year yields and enduring fiscal-driven term premium that issuance changes cannot fix; still bullish gold with $4,000/oz as the floor; sees AI's labour-market drag as real but narrow.", "url": "https://www.goldmansachs.com/insights/the-markets/what-a-fed-rate-hike-could-mean-for-us-stocks"}, {"source_id": "bnp_paribas", "source_name": "BNP Paribas", "stance": "Cautious on duration, constructive on equities and overweight the EM 'picks and shovels' trade: prefers floating rate, high yield and short-maturity linkers, sees US 10-year yields heading to 5%, argues AI capex has not yet produced a productivity payoff, and makes the strongest EM equity case in the batch on the free-cash-flow migration from hyperscalers to Asian memory and foundry suppliers - while its chief economist warns central bank independence faces its biggest stress test in 30 years.", "url": "https://viewpoint.bnpparibas-am.com/view-from-the-markets-tightening-again/"}, {"source_id": "deutsche_bank", "source_name": "Deutsche Bank", "stance": "Constructive on equities over the next 12 months because earnings are the driver, but with unusually heavy risk-management framing; raised 2026 inflation forecasts on the Iran energy shock and expects central banks to turn tighter, yet still sees price potential in high-quality bonds and thinks the market may be pricing more ECB hikes than are likely; gold a diversifier, constructive on private markets and hedge funds; separately the most substantive digital-asset/tokenisation research in this batch.", "url": "https://wealth.db.com/en/insights/investing-insights/economic-and-market-outlook/perspectives-economic-and-asset-class-outlook-june-2026.html"}, {"source_id": "jpmorgan", "source_name": "JPMorgan", "stance": "Sees a record capital markets year extending - global ECM ~$800bn YTD (+75%), US IPO proceeds already above 2021's full-year total, over $200bn of US IPO volume expected into year-end, nearly 60% of issuance AI-related - while arguing the long end is unlikely to come down meaningfully into the midterms; frames the yield rise as energy and term premium rather than the Fed, and says $100 oil is less damaging than in prior cycles.", "url": "https://www.jpmorgan.com/insights/podcast-hub/making-sense/tech-equity-capital-markets"}, {"source_id": "barclays", "source_name": "Barclays", "stance": "Energy is the defining macro theme after AI: the world is in an 'energy addition era' requiring ~$3.6trn of annual investment (3x planned AI infrastructure spend), which makes energy a growth sector rather than a value sector and is more inflationary than markets assume; separately sees UK public M&A at 2018-era highs with inbound volumes doubling to $77bn and bear-hug tactics in vogue.", "url": "https://www.ib.barclays/content/barclaysmicrosites/ibpublic/en/our-insights/series/impact-series/the-global-energy-race.html"}, {"source_id": "citi_gps", "source_name": "Citi GPS", "stance": "The contrarian calm on rates: higher US Treasury yields reflect economic strength and real yields rather than fiscal stress or market dysfunction, so investors should not be scared of them - but there is more risk of a September Fed hike than markets are pricing, and divergent policymaker views under the less-guided Fed raise the odds of a policy surprise.", "url": "https://www.citigroup.com/global/insights/should-markets-be-scared-of-us-treasury-yields"}, {"source_id": "bofa", "source_name": "Bank of America", "stance": "Proprietary card and deposit data show a US consumer that is solid but converging rather than K-shaped: card spending +5.0% y/y in July (ex-gas +4.3%), lower-income after-tax wage growth (4.7%) now above higher-income (3.5%), rising full credit card payoff rates, and small business hiring +21% y/y with profits at 2026 highs - but BofA's own payroll proxy shows labour momentum cooling to 1.5% y/y in August, softer than the official print that drove the Fed repricing.", "url": "https://institute.bankofamerica.com/economic-insights/consumer-checkpoint-august-2026.html"}, {"source_id": "pimco", "source_name": "PIMCO", "stance": "Bonds are back: with the US Agg at a 5.03% yield and 10y real yields ~2.4%, add high-quality duration and rebuild balanced portfolios — the case is income plus genuine downside mitigation, not outperformance; equity valuations and index concentration offer thin incremental compensation.", "url": "https://www.pimco.com/us/en/insights/welcome-back-balanced-portfolio"}, {"source_id": "amundi", "source_name": "Amundi", "stance": "Mildly pro-risk but paid for carry, selectivity and regional diversification rather than direction: steepeners in the US/EMU/UK, flattener in Japan, Global IG over EUR IG, subordinated over HY, cautious US equities balanced via S&P 500 Equal Weight, positive Europe and Japan, LatAm in EM, increased gold, long high-carry EM FX.", "url": "https://research-center.amundi.com/article/global-investment-views-september-2026"}, {"source_id": "t_rowe_price", "source_name": "T. Rowe Price", "stance": "Constructive but patient: modest equity overweight run as buy-the-dip, favouring small/mid caps, US growth and EM over ex-US developed, with overweight international value as AI-selloff insurance. Fundamentals solid, macro mixed, valuations high; the live risk is a combined inflation and rate shock out of the energy squeeze.", "url": "https://www.troweprice.com/en/us/insights/Why-the-bull-case-is-still-in-play-for-equity-markets"}, {"source_id": "blackrock_investment_institute", "source_name": "BlackRock Investment Institute", "stance": "Stay long momentum and the AI complex into year-end because price momentum currently reflects earnings momentum — semis, tech and energy carry a disproportionate share of earnings growth, and the summer momentum crash was crowding and leverage, not fundamentals. Also: do not de-risk indiscriminately on Middle East escalation, and do not rely on long-dated government bonds as ballast.", "url": "https://www.blackrock.com/us/individual/insights/momentum-can-still-work"}, {"source_id": "man_group", "source_name": "Man Group", "stance": "The AI buildout's debt is the trade: buy the secured, collateralised leg (AA data centre ABS at 155-175bp) against the unsecured corporate leg (45-70bp), treat the ~100bp gap as a liquidity and complexity premium, and be the liquidity provider when technical LTV-driven downgrades force insurers to sell.", "url": "https://www.man.com/insights/views-from-the-floor-2026-9-Sept"}, {"source_id": "bridgewater", "source_name": "Bridgewater Associates", "stance": "The new paradigm is AI plus modern mercantilism — structurally inflationary, with every country spending to close vulnerabilities. Markets are still living on the AI buildout phase rather than adoption; most investors are overweight US equities, underweight real assets, and need exposure across fragmenting regional ecosystems.", "url": "https://www.bridgewater.com/research-and-insights/karen-karniol-tambour-on-investing-in-a-more-fragmented-world"}, {"source_id": "invesco", "source_name": "Invesco", "stance": "Look past the macro headlines: oil, rates, debt and Fed inaction are noise relative to earnings strength, AI demand and broadening market breadth — the bull market is intact, the Treasury buyback defuses the debt-reckoning narrative, and investors should de-concentrate via equal weight and mid caps rather than de-risk. Also long midstream energy infrastructure.", "url": "https://www.invesco.com/us/en/insights/topic/market-and-economic-insights.html"}, {"source_id": "vanguard", "source_name": "Vanguard", "stance": "Rigorously structure-agnostic on private markets: neither drawdown nor semiliquid private equity is inherently superior, and the right choice depends on liquidity needs, horizon, all-in cost, manager access and tolerance for operational complexity. Separately expanding into wealth distribution via the Altruist acquisition.", "url": "https://corporate.vanguard.com/content/corporatesite/us/en/corp/articles/choosing-your-private-equity-point-of-entry.html"}, {"source_id": "bny", "source_name": "BNY", "stance": "Liquidity and collateral agility are now a competitive advantage, not back-office plumbing: distinguish always-on operations from always-available liquidity, pre-position financeable assets, broaden eligible collateral, and pair AI adoption with governance — against a backdrop of SEC Treasury central clearing and compressing settlement cycles.", "url": "https://www.bny.com/corporate/global/en/institute/modern-cfo-strategy-vision.html"}, {"source_id": "norges_bank_im", "source_name": "Norges Bank Investment Management", "stance": "As a EUR 75bn owner in Germany (EUR 38bn in listed equities), NBIM pushes for shorter reporting deadlines retained in code rather than index methodology, annual board elections and shorter maximum terms, CEO pay settled substantially in shares locked five to ten years and beyond retirement in place of complex performance conditions, and hybrid AGMs where remote participation complements physical attendance.", "url": "https://www.nbim.no/en/news-and-insights/consultations/2026/proposed-amendments-to-the-german-corporate-governance-code/"}, {"source_id": "standard_chartered", "source_name": "Standard Chartered", "stance": "Hawkish and pro-risk at once: expects a 25bp 'credibility' Fed hike plus further ECB, BoJ and RBA tightening, but treats the resulting equity/bond volatility as a buying opportunity - add US and Asia ex-Japan equities and semiconductors, extend bonds to 3-7 years in corporates, hedge oil with TIPS, and trade FX in ranges.", "url": "https://www.sc.com/sg/market-outlook/weekly-market-view-11-9-2026/?mvog=1"}, {"source_id": "moodys_analytics", "source_name": "Moody's Analytics", "stance": "Data-led and two-sided: August inflation ran hot (CPI +0.4% vs their 0.3% forecast) while Q3 GDP tracks a subdued 2% annualized and the recession tracker is 'Heating Up'; cutting the Canadian baseline on US-Canada trade deterioration and flagging Middle East escalation. Note: this is the economics arm - no Moody's Investors Service rating or outlook actions appeared in this batch, and all items are paywall teasers (headline, deck and lede only).", "url": "https://www.economy.com/economicview/analysis/423859/US-Weekly-Highlights-and-Preview-September-11-2026"}, {"source_id": "rbc", "source_name": "RBC Capital Markets", "stance": "Structurally bearish on a quick oil resolution (Croft: ~9 mb/d offline, deadlocked diplomacy, China as the new swing player) and structurally bearish on legacy consumer staples (Modi: sector at a discount to the S&P 500 for the first time since the late 1990s); constructive on repurposed UK power assets as AI infrastructure.", "url": "https://www.rbccm.com/en/insights/2026/09/midterm-malaise"}, {"source_id": "macquarie", "source_name": "Macquarie", "stance": "Real-asset bull: a supply-chain and infrastructure supercycle driven by digitalisation, decarbonisation and sovereign resilience, with Canada and Australia the preferred expressions and 'core plus' widening the investable universe.", "url": "https://www.macquarie.com/au/en/insights/canadas-new-growth-agenda-seven-structural-drivers-of-the-next-decade.html"}, {"source_id": "lazard", "source_name": "Lazard", "stance": "'Speed-to-power era' - renewables remain the cheapest unsubsidised new build despite cost inflation across every technology, storage costs have risen this year reversing recent declines, and load growth is shifting value toward higher utilisation of existing assets.", "url": "https://www.lazard.com/research-insights/levelized-cost-of-energyplus-lcoeplus/"}, {"source_id": "socgen", "source_name": "Societe Generale", "stance": "No published market view this window; public output is sustainable-finance franchise material, though it carries concrete deal data (USD 600m for Zelestra's 440 MW Texas solar tied to Meta, ~USD 510m for Longroad's 1000 Mile solar, Ivanhoe's Santa Cruz copper) evidencing the AI-power financing pipeline.", "url": "https://wholesale.banking.societegenerale.com/en/positive-impact/great-ideas-should-see-the-light/"}, {"source_id": "coinshares", "source_name": "CoinShares", "stance": "Bitcoin is trading like gold on the debasement trade but the Fed sets the ceiling: range-bound below US$80k until Iran resolves or US sovereign-debt confidence cracks, with sticky core CPI raising September hike odds and flows flipping to outflows; medium-term bullish because a failed Treasury buyback invites a far bigger intervention. Prefers blockchain equities and AI-power-adjacent miners as the rotation vehicle.", "url": "https://coinshares.com/insights/research-data/market-update-11-09-2026/"}, {"source_id": "galaxy_digital", "source_name": "Galaxy Digital", "stance": "Structurally very bullish long-term ($250k BTC by year-end 2027) but near-term cautious until BTC clears $100-105k; sees the real 2026 story as market plumbing — 24/7 trading, transfer-agent modernisation, tokenized collateral and onchain credit — while warning that celebrity memecoins, DAT capital structures like Strategy's preferreds, and the onchain rally itself are showing late-cycle froth. Separately argues compute, not tokens, is the tradable AI commodity.", "url": "https://www.galaxy.com/insights/research/laptop-memecoin-flop-liquid-network-hack-openai-navier-stokes-math"}, {"source_id": "delphi_digital", "source_name": "Delphi Digital", "stance": "Cautiously constructive macro regime (back to neutral) but explicitly bullish risk assets: alt season is already here and can run without a Bitcoin breakout, led by HYPE, Zcash, Lighter and tokenized stocks on Robinhood Chain and Solana — with an equally explicit warning that this is an alt-picker's market where taking profits is the key skill.", "url": "https://members.delphidigital.io/media/the-hivemind-alt-season-is-already-here"}, {"source_id": "chainalysis", "source_name": "Chainalysis", "stance": "On-chain traceability is now the enforcement backbone: sanctions and seizures are concentrating on the stablecoin laundering layer (Xinbi, $24bn processed, $52m restrained, DPRK 'Black U' substitution) while the Liquid exploit shows Bitcoin's base layer remains secure and the financial layers built on it are the real institutional risk.", "url": "https://www.chainalysis.com/blog/ofac-sanctions-xinbi-cybercriminal-crypto-marketplace/"}, {"source_id": "wood_mackenzie", "source_name": "Wood Mackenzie", "stance": "The Iran war is a multi-year supply shock, not a spike — Brent above $108, record US diesel, Ras Laffan LNG capacity out for up to five years — and its lasting legacy may be structurally lower oil demand via accelerated EV adoption; meanwhile AI data centres are the dominant new force in power and commodity markets, with power infrastructure (and even coal) the biggest opportunity and permitting, not panels, the binding constraint on US solar at ~44 GWdc a year.", "url": "https://www.woodmac.com/blogs/energy-pulse/high-oil-prices-raise-prospect-accelerated-ev-sales/"}, {"source_id": "opec", "source_name": "OPEC", "stance": "Hold and defend market stability: the eight voluntary-adjustment countries kept October 2026 production flat at September levels and reiterated full conformity with the Declaration of Cooperation, while the Secretariat argues publicly that oil's role in power generation should expand rather than be phased out as electricity demand rises 85% by 2050.", "url": "https://www.opec.org/pr-detail/1835613-6-september-2026.html"}, {"source_id": "bca_research", "source_name": "BCA Research", "stance": "Constructive and contrarian-dovish: stay at benchmark equity and risk-asset weights because the expansion is intact, and treat the Fed's and ECB's energy-driven hikes as supply-shock responses with no second-round effects — while flagging that Treasury's abandonment of regular-and-predictable issuance adds term premium and that Iran is deliberately keeping oil elevated into the US midterms.", "url": "https://www.bcaresearch.com/marketing/felix-antoine-vezina-poirier"}, {"source_id": "gavekal", "source_name": "Gavekal Research", "stance": "Inflationary-world house: energy is the binding constraint and energy equities have replaced government bonds as the antifragile portfolio buffer; AI capex fundraising — not deficits — may be the main force lifting long yields; labour scarcity, not AI, sets the US supply ceiling; and on China, a narrow profit boom and a genuine capex correction mean overcapacity stops worsening even as Beijing declines to stimulate.", "url": "https://research.gavekal.com/teaser/on-energy-stocks-as-a-portfolio-diversifier/"}, {"source_id": "oxford_economics", "source_name": "Oxford Economics", "stance": "Resilience with building risks: global GDP back to 2.8-3.0% in 2027 (marked down), above-consensus on the US but not other majors, oil and a disorderly end to the AI boom as the two identified cycle-enders, and a long-held view that the macro impact of geopolitical shocks is overstated — paired with a deliberately cautious 3.5%/4.5% US AI productivity baseline.", "url": "https://www.oxfordeconomics.com/resource/2027-economic-outlook-resilience-to-continue-but-the-risks-are-building/"}, {"source_id": "ned_davis_research", "source_name": "Ned Davis Research", "stance": "US expansion intact through Q2 2026 on strengthening private demand, strong profits and AI capex, with a 'more selective' environment — housing affordability, high energy prices and geopolitical instability the named headwinds.", "url": "https://info.ndr.com/ndr-signals/us-economy-remains-in-expansion?hsLang=en"}, {"source_id": "capital_economics", "source_name": "Capital Economics", "stance": "China Shock 2.0 is the defining decade-long force in the world economy — still disinflationary, but now in strategic industries, with a persistent Chinese external surplus widening the kind of global imbalances that historically precede crises.", "url": "https://www.capitaleconomics.com/blog/china-shock-20-introducing-our-new-series-global-economy"}, {"source_id": "peterson_institute", "source_name": "Peterson Institute for International Economics", "stance": "The US tariff regime rests on serially failing legal authorities (now a zombie 1930 Smoot-Hawley provision aimed at Canada) while the WTO drifts toward the falls; meanwhile de-dollarisation is not happening — the yuan's rise has stalled and the dollar's FX share has risen — and the real structural change is a Republican-led drift toward ad-hoc US state ownership of strategic firms.", "url": "https://www.piie.com/blogs/realtime-economics/2026/trump-invoked-zombie-statute-justify-tariffs-canada"}, {"source_id": "carnegie", "source_name": "Carnegie Endowment for International Peace", "stance": "US foreign policy has repositioned from democracy promotion to near-term extraction, and the consequences are compounding: an avoidable US-Canada trade war whose damage to trust outlasts this administration and is being read closely in Asia, a Saudi nuclear deal that trades the nonproliferation gold standard for commercial exclusivity, and eroding network-based US leverage.", "url": "https://carnegieendowment.org/research/2026/09/america-walks-away-from-global-democracy"}, {"source_id": "brookings", "source_name": "Brookings Institution", "stance": "Europe faces a China export shock it has the leverage but not yet the political will to answer by its own October deadline — and the answer runs through a Germany whose chancellor is being squeezed simultaneously by an AfD polling ~41% in Saxony-Anhalt and by dissent inside his own cabinet; separately, US homeowner insurance costs are being driven far more by reinsurance capital pricing than by climate risk itself.", "url": "https://www.brookings.edu/articles/europes-china-shock-2-0-where-does-it-go-from-here/"}]}, "coverage": {"sources_covered": 42, "sources_total": 52, "coverage_pct": 81}};

// ---------- helpers ----------
const CAT_VARS = {
  rates: 'var(--cat-rates)',
  growth: 'var(--cat-growth)',
  fx: 'var(--cat-fx)',
  equities: 'var(--cat-equities)',
  credit: 'var(--cat-credit)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  commodities: 'var(--cat-commodities)',
  geopolitics: 'var(--cat-geopolitics)',
  ai_tech: 'var(--cat-ai_tech)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }
function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}
function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}
function pills(cats) {
  if (!cats) return '';
  if (Array.isArray(cats)) return cats.map(pill).join(' ');
  return pill(cats);
}
function externalLink(url, label) {
  if (!url) return '';
  return `<a class="item-link" href="${escapeAttr(url)}" target="_blank" rel="noopener">${label || 'link →'}</a>`;
}
function nameLink(url, name) {
  if (!name) return '';
  if (!url) return `<span class="item-source">${escapeHtml(name)}</span>`;
  return `<a class="item-source" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderThemeItem(it) {
  return `
    <div class="theme-item">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.thesis || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderTheme(theme) {
  const items = (theme.items || []).map(renderThemeItem).join('');
  return `
    <div class="theme">
      <div class="theme-head">
        ${pills(theme.category)}
        <div class="theme-title">${escapeHtml(theme.theme || '')}</div>
      </div>
      <div class="theme-stance">
        ${theme.consensus ? `<div class="theme-line consensus"><span class="lbl">Consensus</span>${renderBold(theme.consensus)}</div>` : ''}
        ${theme.divergence ? `<div class="theme-line divergence"><span class="lbl">Divergence</span>${renderBold(theme.divergence)}</div>` : ''}
      </div>
      ${items ? `<div class="theme-items">${items}</div>` : ''}
    </div>`;
}

function renderCall(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${pills(it.category)}
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.call || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderDeepRead(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url, 'read →')}
      </div>
      ${it.title ? `<div class="item-title">${escapeHtml(it.title)}</div>` : ''}
      <div class="item-text">${renderBold(it.summary || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderChart(it) {
  return `
    <div class="item-card">
      <div class="item-head">
        ${nameLink(it.url, it.name || it.source)}
        ${externalLink(it.url)}
      </div>
      <div class="item-text">${renderBold(it.chart || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderHouseView(hv) {
  const name = hv.name || hv.source || '';
  const nameHtml = hv.url
    ? `<a class="hv-name" href="${escapeAttr(hv.url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a>`
    : `<span class="hv-name">${escapeHtml(name)}</span>`;
  return `
    <div class="hv-row">
      ${nameHtml}
      <span class="hv-stance">${renderBold(hv.stance || '')}</span>
    </div>`;
}

function renderSection(letter, name, items, render, extraClass) {
  if (!items || !items.length) return '';
  const body = items.map(render).join('');
  const cls = 'section' + (extraClass ? (' ' + extraClass) : '');
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderTopStats(d) {
  const parts = [];
  const p = d.period || {};
  const is = d.input_stats || {};
  const cv = d.coverage || {};
  if (p.from && p.to)
    parts.push(`period <strong>${escapeHtml(p.from)} → ${escapeHtml(p.to)}</strong>`);
  else if (p.lookback_days != null)
    parts.push(`lookback <strong>${p.lookback_days}d</strong>`);
  if (is.total_articles != null) parts.push(`articles <strong>${is.total_articles}</strong>`);
  if (is.sources_present != null) parts.push(`sources <strong>${is.sources_present}</strong>`);
  if (is.after_filter != null) parts.push(`after filter <strong>${is.after_filter}</strong>`);
  if (cv.coverage_pct != null) {
    const pct = (cv.coverage_pct <= 1 ? cv.coverage_pct * 100 : cv.coverage_pct);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  } else if (cv.sources_covered != null && cv.sources_total != null) {
    parts.push(`coverage <strong>${cv.sources_covered}/${cv.sources_total}</strong>`);
  }
  return parts.join(' | ');
}

function reportDate(d) {
  if (d.period && d.period.to) return d.period.to;
  if (d.collected_at) return String(d.collected_at).slice(0, 10);
  return '';
}

// ---------- interactions ----------
function toggleSection(headEl) { headEl.parentElement.classList.toggle('open'); }
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('lightbox').classList.contains('open')) {
    closeLightbox();
  }
});

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = reportDate(d);
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  const s = d.sections || {};
  const out = [
    renderSummary(d.summary),
    renderSection('A.', 'Debates — Consensus vs Divergence', s.A_debates,    renderTheme),
    renderSection('B.', 'Key Calls & Positioning',           s.B_calls,      renderCall),
    renderSection('C.', 'Notable Deep Reads',                s.C_deep_reads, renderDeepRead,
                  'section-deepreads'),
    renderSection('D.', 'Charts & Data',                     s.D_charts,     renderChart),
    renderSection('E.', 'House Views',                       s.house_views,  renderHouseView),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = out || '<div class="empty">No report data.</div>';

  // Auto-open Summary's section view: first two sections open by default.
  document.querySelectorAll('.section').forEach((sec, i) => {
    if (i < 2) sec.classList.add('open');
  });
}

renderReport(REPORT_DATA);
</script>
