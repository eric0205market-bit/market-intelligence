<script>
const ITEMS = [{"cat": "geopolitics", "urgency": "act", "source": "Bubble Bubble Report / Bubble Bubble", "title": "Iran war enters month 9 — carrier build-up says the next strike comes AFTER the midterms", "idea": "Pentagon moved the USS Theodore Roosevelt strike group and 13th MEU to the Middle East; two other carriers (Bush since April, George Washington since August) are already there. Author reads the timing as a post-Nov 3 strike because Trump won't destabilize oil into the vote. WTI +$16 (+18%) to $104 and Brent +$22 (+23%) to $117 in October alone.", "angle": "Brent-WTI spread went from ~$7 to ~$13 in a month: the market is pricing a seaborne/Hormuz-type premium, not a US supply story. Event risk is dated: Nov 3 is the fuse.", "tweetA": "Brent +$22 in October, WTI +$16. Do the subtraction: the Brent-WTI spread went from ~$7 to ~$13. That's not US shale tightness, that's the seaborne premium for a strike everyone now dates to the week after Nov 3. $XLE $BNO", "tweetB": "Three carriers plus a Marine expeditionary unit sit in the region and the political calendar is the only thing holding the trigger. If you're short vol into the midterms because 'nothing happens before an election,' you're selling the one hedge that has a date on it.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening (energy futures, metals)"}, "link": "https://thebubblebubble.substack.com/p/a-precious-metals-and-miners-update-ff4", "id": 1}, {"cat": "macro", "urgency": "act", "source": "Bubble Bubble Report / Bubble Bubble", "title": "Fed Oct 28: 90% hold, but 68.9% odds of a December HIKE — under Chair Warsh", "idea": "Fed hiked 25bp on Sep 16 to 3.75-4.00%. FedWatch: 90% hold Oct 28, 68.9% for another 25bp on Dec 9 (to 4.00-4.25%). Warsh's press conference is the swing: any language on December sets the tape for metals and duration.", "angle": "Hiking cycle restarting into an oil shock and a possible AI-capex wobble is the stagflation-lite regime. The curve question is which wins: oil inflation or AI growth scare (see Goldman item).", "tweetA": "The Fed hiked in September. Markets give a December hike 68.9%. Nobody's positioned like we're in a tightening cycle with Brent at $117 and the S&P under its 50-day. Wednesday's Warsh presser is the first real test of whether 'higher for longer' still has a floor under it.", "tweetB": "Funny asymmetry: if Warsh holds and sounds neutral, December odds fall and gold gets its bid back. If he leans hawkish, the 10y has to choose between oil inflation and AI fear. Either way the presser matters more than the decision.", "charts": {"count": 0, "hot": false, "desc": "CME FedWatch probabilities referenced; no chart in email body"}, "link": "https://thebubblebubble.substack.com/p/a-precious-metals-and-miners-update-ff4", "id": 2}, {"cat": "gold", "urgency": "deep", "source": "Bubble Bubble Report / Bubble Bubble", "title": "Metals' war pattern: energy up → hike odds up → gold and miners down (since March)", "idea": "Author argues the sign of the energy-gold relationship flipped in this war: rising oil raises rate-hike odds, which crushes precious metals and other non-energy commodities. The September oil lull was the metals' relief window; October's re-spike reversed it.", "angle": "Gold as 'war hedge' failed because the reaction function is hawkish. Relative value: long energy / short metals has been the clean expression of the same factor.", "tweetA": "Gold is down YTD in a year with a shooting war, $117 Brent and a Fed that hiked. That's not a broken hedge, it's a reaction function: every oil spike raises hike odds, and hikes are what gold hates. Wrong hedge for this war.", "tweetB": "The September oil lull was gold's entire bull case this quarter. Ask what happens if the post-midterm strike goes ahead and oil prints $130: the metals market already shows you the answer.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening (gold, silver, miners)"}, "link": "https://thebubblebubble.substack.com/p/a-precious-metals-and-miners-update-ff4", "id": 3}, {"cat": "gold", "urgency": "deep", "source": "Six Sigma Capital / Six Sigma Research", "title": "Gold $3,994.60: through $4,100-4,150, now sitting on the June/July lows", "idea": "Gold is 7.13% below its 50-day and 11.48% below its 200-day (RSI 33), -7.59% YTD. The $3,950-4,000 zone marks the June and July lows and has acted as support since late 2025. Author is long physical.", "angle": "Implied 50dma ~$4,300 and 200dma ~$4,510 means the overhead supply is far away; the only question is whether the base holds. A break resets the whole 2025-26 range.", "tweetA": "Gold is 11.5% under its 200-day and sitting on the exact June/July lows. Everyone with a view on 'war = gold' should note this base has been tested three times. A fourth is rarely a charm.", "tweetB": "S&P +11% YTD, gold -7.6%. In a regime where real rates are rising, the metal that pays nothing is the funding leg for everything else. I'd rather watch the miners than the metal for the tell.", "charts": {"count": 1, "hot": false, "desc": "Gold daily with $3,950-4,000 support arrows; charts inside — worth opening"}, "link": "https://sixsigmaresearch.com/p/preview-of-the-week-ahead-wc-october-1bb", "id": 4}, {"cat": "gold", "urgency": "watch", "source": "Tavi Costa / Crescat (Top 70 Macro Charts)", "title": "Only 10% of miners above their 200-day — history says bottom territory", "idea": "Costa flags that just 10% of miners remain above their 200-day moving averages, a reading that has historically coincided with important industry bottoms. He calls this an 'absolutely critical juncture' and packages 70 mostly self-made charts (plus a note on Brazil's elections).", "angle": "Breadth washouts in a sector are contrarian signals, but only if the macro driver (hike odds) stops worsening. Pairs with the Bubble Bubble thesis: miners are the levered expression of the Fed path.", "tweetA": "90% of miners are below their 200-day. Sector breadth that low has marked lows before. The catch: you're buying a washout while the Fed is pricing a hike. I want to see December odds fall before I call it.", "tweetB": "Miners at a breadth extreme, gold on the June lows, SOX on its 200-day, EEM broken. Four different 'critical levels' in one week. Either it's a coordinated bounce setup or the cleanest cross-asset deleveraging of the year.", "charts": {"count": 70, "hot": true, "desc": "70 macro charts, mostly self-made. 🔥 CHART WORTH SAVING: miners breadth vs 200-day"}, "link": "https://tavicosta.substack.com/p/top-70-macro-charts", "id": 5}, {"cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom (Goldman Sachs, William Marshall)", "title": "Goldman: AI fear is beating oil inflation in the bond market — duration is defensive again", "idea": "Goldman's global rates trader sees deteriorating AI sentiment overpowering the inflationary effect of elevated energy prices; Treasuries are again behaving like something investors want when equities fall. European sovereign stress limits how hard the ECB can respond to energy, with knock-ons to JGBs, Canada and Australasia.", "angle": "If duration hedges equities because of an AI-financing scare, then the AI trade is now a rates-sensitive asset. That ties to Chipstrat's 15% neocloud debt and 10y over 5%.", "tweetA": "For most of this year every problem led to higher yields. Goldman now says AI fear beats oil inflation, and that Treasuries hedge equity drawdowns again. Which is a quiet admission that the AI buildout is the marginal driver of the whole rates complex.", "tweetB": "Euro sovereign stress means the ECB can't hit energy inflation as hard as the Fed can. Watch the ECB-Fed policy gap widen into year-end. The cleaner EUR short is the one where the central bank is constrained by its own bonds.", "charts": {"count": 0, "hot": false, "desc": "Goldman note summary; charts inside original — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/when-ai-fear-beats-oil-inflation", "id": 6}, {"cat": "macro", "urgency": "deep", "source": "Dark Side of the Boom (Deutsche Bank Research)", "title": "Deutsche midterm primer: the volatility starts after the votes are counted", "idea": "DB sees an unusually strong consensus outcome (House clearer than Senate). History favors equities once uncertainty clears, but fiscal negotiations, defense spending and divided-government constraints are the real catalysts. AI infrastructure, electricity costs, healthcare and housing affordability are moving into the political crosshairs.", "angle": "Electricity costs as a campaign issue directly touches the AI-power trade ($VST $CEG, grid names) and hyperscaler siting. Politicizing data center power bills is a regulatory risk the street prices at zero.", "tweetA": "Everyone is trading the midterms as the event. Deutsche's point is the event is the aftermath: a divided government negotiating defense and fiscal into a hiking Fed. The relief rally is the easy part of the calendar.", "tweetB": "Electricity costs are now a campaign issue. Data centers are the marginal buyer of grid power. Put those together and the next AI headwind isn't chips, it's a state utility commission.", "charts": {"count": 0, "hot": false, "desc": "Charts inside DB primer — worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/swing-state-navigating-midterm-volatility", "id": 7}, {"cat": "positioning", "urgency": "deep", "source": "Six Sigma Capital / Six Sigma Research", "title": "S&P under its 21EMA and 50DMA; IWM +1.96% while Nasdaq -0.71% — rotation under the surface", "idea": "SPX 7,623.68 (-0.99% vs 50DMA, 4.56% above the 200DMA at 7,291, RSI 42). Nasdaq 25,955 (-2.42% vs 50DMA, 200DMA 24,992, RSI 38). Dow +0.41%, SPX -0.47%, COMPQ -0.71%, IWM +1.96%. Breadth improved: 58.8% above the 50DMA vs 45.4% a week ago.", "angle": "Small caps outperforming a falling index with breadth improving is rotation, not liquidation. The index is being held down by the AI complex.", "tweetA": "IWM +1.96%, Nasdaq -0.71%, and the share of S&P stocks above their 50-day jumped from 45% to 59% in a week. The index fell because of what's in the top 10, not because of what's underneath. This is a rotation tape wearing a pullback costume.", "tweetB": "SPX needs ~1% to retake its 50-day and sits 4.6% above the 200-day. The pullback has done about half the damage a real correction does. FOMC, GDP, PCE, MSFT and GOOGL earnings in five sessions will decide which half we're in.", "charts": {"count": 4, "hot": false, "desc": "Index charts with MAs; charts inside — worth opening"}, "link": "https://sixsigmaresearch.com/p/preview-of-the-week-ahead-wc-october-1bb", "id": 8}, {"cat": "AI/infra", "urgency": "deep", "source": "Six Sigma Capital / Six Sigma Research", "title": "SOXX +52.7% YTD but 10% under its 50DMA — testing the 200-day at $471.62", "idea": "SOXX $478.20 is 10.19% below its 50DMA and 1.39% above the 200DMA (RSI 31.97) after a leg lower Thursday on above-average volume. Friday's bounce held the 200-day. Author: 'not much support below.'", "angle": "A +52.7% YTD winner that's an RSI-32 name is a late-cycle shakeout or a regime change. Compare the Chipstrat financing worries: this is where they show up in price.", "tweetA": "SOXX is still +53% YTD and sits 1.4% above its 200-day. That's one bad session from turning an 'AI financing worry' into a 'regime change' chart. Rasgon says stocks are 'way down from the peaks' because the market has found financing as a constraint. The chart agrees.", "tweetB": "Two ways to read RSI 32 on semis in a year they're up 50%: the best entry of the year, or the start of the first leg-down in the AI trade. Price will tell you at $471.", "charts": {"count": 1, "hot": false, "desc": "SOXX with 200DMA; charts inside — worth opening"}, "link": "https://sixsigmaresearch.com/p/preview-of-the-week-ahead-wc-october-1bb", "id": 9}, {"cat": "positioning", "urgency": "deep", "source": "Six Sigma Capital / Six Sigma Research", "title": "META lost $710-715 post-earnings; GOOGL lost its 200-day; MSFT earnings this week", "idea": "META $642.62 now 1.74% above its 200DMA ($631.66) after a sharp Thursday drop. GOOGL $320.21 is 6.09% below its 200DMA ($340.99), +1.8% YTD. MSFT $524.51 rejected $550, support at $516, 50DMA $508. Author holds all three and cites a 'three-day rule' for post-earnings entries.", "angle": "Hyperscalers are falling on spend, not on demand. Their earnings this week are the capex-justification test the Chipstrat panel says the market now demands.", "tweetA": "META is down, GOOGL is under its 200-day and MSFT reports this week. Three of the biggest AI capex spenders are being repriced on cash burn at the same time. The panel's line, 'the most cash-generative businesses in history are burning cash,' is the whole chart.", "tweetB": "GOOGL +1.8% YTD vs SOXX +53%. The buyers of the chips are flat while the sellers of chips are up half. That divergence resolves one of two ways, and neither is comfortable for the supply chain.", "charts": {"count": 3, "hot": false, "desc": "META/GOOGL/MSFT daily charts; charts inside — worth opening"}, "link": "https://sixsigmaresearch.com/p/preview-of-the-week-ahead-wc-october-1bb", "id": 10}, {"cat": "crypto", "urgency": "deep", "source": "Six Sigma Capital / Six Sigma Research", "title": "BTC $80,707: lost the 82k MA confluence, -9% YTD while Nasdaq is +11.7%", "idea": "BTC is 1.35% below its 50DMA, 10.7% above the 200DMA (~$72.9K), RSI 44. $80K is the key level; bulls need $83K and the 50DMA back. Author is long.", "angle": "BTC is -9% YTD against equity indices at +11%: the 'digital gold' and the 'liquidity beta' narratives both failed this year. It is trading like gold, not like Nasdaq.", "tweetA": "BTC -9% YTD, Nasdaq +11.7%, gold -7.6%. The asset class that was supposed to be the high-beta version of everything is behaving like the metal. Both are trading the real-rate leg of a hiking Fed, not the 'debasement' one.", "tweetB": "$80K is the line and $72.9K the 200-day. A Warsh hawkish surprise on Wednesday gives you a 10% air pocket. The only reason I'm not more bearish is the level of capitulation already in the miners.", "charts": {"count": 1, "hot": false, "desc": "BTC with 82k MA confluence arrow; charts inside — worth opening"}, "link": "https://sixsigmaresearch.com/p/preview-of-the-week-ahead-wc-october-1bb", "id": 11}, {"cat": "geopolitics", "urgency": "act", "source": "Six Sigma Capital / Six Sigma Research / Tavi Costa", "title": "Brazil votes today: EWZ +33.5% YTD and holding April highs, while EEM broke every MA", "idea": "EWZ ($42.59) is 15% above its 200DMA, +33.5% YTD, bounced off the April highs on above-average volume; bulls want $44. EEM ($62.01) closed the week below all key MAs with a bearish 21EMA/50SMA cross, -6.78% vs the 50DMA. Costa's note flags 'important updates' on tomorrow's Brazilian elections.", "angle": "Brazil is the single big EM outperformer into the vote. Binary event risk on a +33% name with EM broadly broken is a gap trade either way.", "tweetA": "EEM broke below every moving average this week. EWZ is +33% YTD and 15% over its 200-day. One of these is wrong, and Brazil's vote on Sunday decides which. Highest-beta idiosyncratic EM event of the quarter.", "tweetB": "When a market is +33% into an election and the asset class around it is falling apart, the vote isn't the risk, the positioning is. Everyone who wanted Brazil already owns it.", "charts": {"count": 2, "hot": false, "desc": "EWZ and EEM charts with MAs; charts inside — worth opening"}, "link": "https://sixsigmaresearch.com/p/preview-of-the-week-ahead-wc-october-1bb", "id": 12}, {"cat": "macro", "urgency": "act", "source": "Six Sigma Capital / Six Sigma Research", "title": "Week ahead stacked: FOMC Wed, Q3 GDP + PCE Thu, ECI Fri, plus MSFT/GOOGL earnings", "idea": "Oct 27 FOMC begins, durable goods, new home sales, Conf Board confidence. Oct 28 FOMC decision and presser, mortgage apps. Oct 29 advance Q3 GDP, September PCE, jobless claims, H.4.1. Oct 30 Q3 Employment Cost Index and Chicago PMI.", "angle": "The week has both the policy decision and the two inflation prints (PCE, ECI) that decide December. Compressed event density usually means a vol event somewhere.", "tweetA": "Fed decision, Q3 GDP, September PCE and the Employment Cost Index all land in 72 hours with a December hike 69% priced. Wages (ECI) is the number I'd watch. It's the one that tells you whether the oil shock is feeding into the 2nd-round effects Warsh worries about.", "tweetB": "Last time a week had policy, growth and both inflation prints stacked, the move came on the print nobody had circled. My bet: Thursday PCE, because it lands the day after the presser and nobody can trade it ahead.", "charts": {"count": 0, "hot": false, "desc": "Earnings Whispers infographic inside — worth opening"}, "link": "https://sixsigmaresearch.com/p/preview-of-the-week-ahead-wc-october-1bb", "id": 13}, {"cat": "credit", "urgency": "deep", "source": "Chipstrat / Austin Lyons (Rasgon & Patel panel)", "title": "Neocloud debt at ~15%: Volta's 12% coupon sold at 95, CoreWeave unsecured in the same zone", "idea": "Patel: Volta (cluster for Anthropic) issued 12% coupon bonds at 95 — an effective ~15%. Without hyperscaler/lab offtake, nobody can finance a cluster. Hyperscalers can't spend north of $2T-2.5T capex next year; Meta has $1.4T of commitments. 10y Treasury is above 5%.", "angle": "Financing is the 'holy trinity' third leg (land-power-shell, chips, financing). 15% debt on a 3-5 year GPU asset means the break-even rental price needs to stay high.", "tweetA": "15% effective yield on a bond backed by an Anthropic contract. That is the price of AI infrastructure credit with the best possible counterparty. Imagine what the clouds with no offtake pay, or rather can't get at any price.", "tweetB": "Patel: even Nvidia is guaranteeing rental prices ($3.50) and taking revenue shares to get clusters financed. When the chip vendor becomes the lender of last resort, it isn't demand that's constraining you anymore.", "charts": {"count": 0, "hot": false, "desc": "Transcript; no charts"}, "link": "https://newsletter.chipstrat.com/p/my-conversation-with-dylan-patel", "id": 14}, {"cat": "AI/infra", "urgency": "deep", "source": "Chipstrat / Austin Lyons (Rasgon & Patel panel)", "title": "Patel: substrates are the #1 bottleneck — not power. 50GW of data centers under construction", "idea": "Ranking: substrates > memory > optics (CPO lasers and fiber attach can't ramp for 2028) > power. ~50GW being built globally (≈35 US, 7-8 China), and power is solved with on-site turbines, recip engines, fuel cells. Rasgon adds: WFE guided >$200B for next year versus ~155 this year and ~120 at the start of 2026, and clean rooms are full until 2027-28.", "angle": "The bottleneck shifts from the sexy (power) to the unglamorous (Japanese substrate and PCB materials, lasers). That's where pricing power accrues.", "tweetA": "Everyone argues over power. Patel says substrates, then memory, then optics rank higher, and 50GW is already under construction. The scarce thing is a Japanese resin supplier that refused to expand capacity, not a gas turbine.", "tweetB": "WFE started the year at ~$120B, ends near $155B and next year is guided north of $200B. That's +65% in two years from a base of fabs that don't have clean rooms. Something has to give, and it is usually the lead time.", "charts": {"count": 0, "hot": false, "desc": "Transcript; no charts"}, "link": "https://newsletter.chipstrat.com/p/my-conversation-with-dylan-patel", "id": 15}, {"cat": "AI/infra", "urgency": "deep", "source": "Chipstrat / Austin Lyons (Rasgon & Patel panel)", "title": "Semis at $1.5T (+100%): 70-80% of the growth is memory ASPs, units are up ~10%", "idea": "Rasgon: industry revenue ~ $1.5T this year, up ~100%; 70-80% of the growth is memory pricing, units only ~+10%. Memory gross margins 88-90% after the worst memory cycle since the tech bubble 24 months ago; memory names trade at 2-4x forward P/E; SanDisk guided a quarterly EPS higher than its stock price 24 months ago. HBM takes 3-4x the wafers per GB vs DDR5, and memory is 70-80% of silicon area in an AI rack.", "angle": "'Peak-cycle multiple' vs 'structural shortage': single-digit PEs say the market assumes 2028 supply normalizes. Rasgon asks the question: what if it doesn't?", "tweetA": "$1.5T semis industry, +100%. About $525-600B of that growth is memory price, not volume. Units are up 10%. We're calling this an AI unit boom, and it is a pricing-power boom.", "tweetB": "Memory margins at 88-90%, forward P/E at 2-4x. When a market assigns single digits to 90% margins, it is pricing the end of the cycle for you. The only open question is who's right about 2028 supply.", "charts": {"count": 0, "hot": false, "desc": "Transcript; no charts"}, "link": "https://newsletter.chipstrat.com/p/my-conversation-with-dylan-patel", "id": 16}, {"cat": "AI/infra", "urgency": "deep", "source": "Chipstrat / Austin Lyons (Rasgon & Patel panel)", "title": "Elon's neocloud arbitrage: $50B/GW on short contracts vs $15B/GW for contracted clouds", "idea": "Patel: contracted neoclouds earn ~$15B per gigawatt; xAI/SpaceX builds first and rents on short-term contracts at ~$50B/GW. Anthropic makes $70-80B of revenue per GW of inference, so at $15B/GW compute their margin is 75-80%; at $50B/GW it collapses. Cost to build a GW: ~$40B in 2024 to $60B+ now; ~$20B if you strip the design-house margins.", "angle": "Spot-market compute scarcity is moving margin from labs to whoever has uncommitted capacity. Watch who eats the cost: labs, Nvidia, or end customers.", "tweetA": "If a lab earns $75B per GW of inference and pays $50B for the compute, its margin is ~33%, not 80%. That's why uncommitted capacity is the most valuable asset in AI right now and why xAI waits for a customer to be desperate before it signs.", "tweetB": "Cost to build a GW went from $40B to $60B in two years while nobody was building one in 2024. The 'AI is deflationary' story needs a footnote: the capital input is up 50%.", "charts": {"count": 0, "hot": false, "desc": "Transcript; no charts"}, "link": "https://newsletter.chipstrat.com/p/my-conversation-with-dylan-patel", "id": 17}, {"cat": "tech", "urgency": "deep", "source": "Chipstrat / Austin Lyons (Rasgon & Patel panel)", "title": "OpenAI's first-gen chip beat Blackwell on InferenceX; Anthropic wants to do it in half the time", "idea": "Patel: OpenAI's first-gen accelerator, designed with heavy AI assistance, outperformed Blackwell on his open-source InferenceX benchmark running Chinese open models. Porting time for a new chip dropped from 6-9 months (Nvidia/AMD) to 1.5 months (OpenAI). Nvidia has lost share of CoWoS and HBM wafers in 2026 and will lose more in 2027, even though its earnings keep doubling. NVDA and AVGO trade at the lowest multiples ever; Rasgon: relative to SOX NVDA was cheaper on only 13 days in 10 years.", "angle": "If models solve software, the CUDA moat narrows and chip design starts to look like verifiable software. The question: who in the supply chain survives a design-commoditization.", "tweetA": "First-gen chip beating Blackwell. Chip bring-up time down from 6-9 months to 6 weeks. 'Models solved software' means CUDA is a smaller moat than the multiple assumed and a smaller moat than the multiple discounts. $NVDA $AVGO", "tweetB": "Nvidia is growing earnings 2x and losing wafer share at the same time. Both facts are true because the pie is expanding faster than anyone can take from it. The risk case needs growth to slow, not share to move.", "charts": {"count": 0, "hot": false, "desc": "Transcript; no charts"}, "link": "https://newsletter.chipstrat.com/p/my-conversation-with-dylan-patel", "id": 18}, {"cat": "AI/infra", "urgency": "deep", "source": "Chipstrat / Austin Lyons (Rasgon & Patel panel)", "title": "Nvidia's pricing test: Hopper→Blackwell ASP +50%, perf 3-30x; Rubin rack cost per GW $25B → $40B", "idea": "Rasgon's framework: customers accept price rises as long as performance per dollar rises faster. Ampere→Hopper ASP ~2x for ~10x performance; Hopper→Blackwell ASP ~+50% for 3-30x; Blackwell→Rubin ~$25B→$40B per GW for ~10x. If Feynman only delivered +20%, he'd worry about margins. Bill Dally: 1000x in 10 years, target 1,000,000x in the next 10.", "angle": "NVDA's margin defense is a rate-of-innovation bet. The test is not Rubin, it's the first generation where perf/$ gain looks ordinary.", "tweetA": "Nvidia's whole margin defense is one inequality: performance has to rise faster than price. Rubin is $40B per GW versus $25B for Blackwell, +60%, against a claimed 10x. The first generation where that inequality isn't obvious is the one that matters.", "tweetB": "Dally's target is a million-x in 10 years. Even if it's off by 1000x, you've compounded ~2x a year. That is the number Broadcom, Google and OpenAI are chasing with a $50M mask set.", "charts": {"count": 0, "hot": false, "desc": "Transcript; no charts"}, "link": "https://newsletter.chipstrat.com/p/my-conversation-with-dylan-patel", "id": 19}, {"cat": "AI/infra", "urgency": "watch", "source": "Chipstrat / Austin Lyons (Rasgon & Patel panel)", "title": "Semis used to destroy value: 1996-2004 economic profit ex-Intel was −$50B — then COVID taught pricing power", "idea": "Rasgon (ex-McKinsey) recalls his study of ~150 semi companies: industry failed to cover its cost of capital, value flowed to customers. Post-2008 consolidation and COVID gave pricing power: in 2023-24 units were flat vs 2019 while blended ASPs were ~50% higher, even excluding memory. 'Inflation saved the industry.'", "angle": "Regime change in industry structure: a historically bad capital allocator is now a price setter. Great-for-owners until the first supply-demand mismatch.", "tweetA": "Semis spent a decade destroying economic profit. Then COVID showed them they could raise prices without losing ost growth beating GDP growth in Germany, Japan and the UK, while China, India and Mexico are the reverse. That's the AI data center siting map in one sentence, and it doesn't favor the countries writing the AI regulation.", "tweetB": "Pair this with the midterm primer: US electricity costs are now a campaign issue. The question for the next decade isn't who has the chips. It's who has electrons that cost less than their growth rate.", "charts": {"count": 1, "hot": true, "desc": "🔥 CHART WORTH SAVING: G20 electricity system costs vs GDP growth through 2050 (open article)"}, "link": "https://www.mckinsey.com/industries/energy-and-materials/our-insights/global-energy-perspective", "id": 23}, {"cat": "labor", "urgency": "watch", "source": "McKinsey / Chart of the Week (previous issue: AI and workforce reinvention)", "title": "McKinsey: AI and automation are accelerating the reallocation of work in the US economy", "idea": "Last week's featured chart (linked in the issue): Kweilin Ellingrud and coauthors look at which skills may increase in value and how workers can navigate pathways to new jobs as AI, automation and structural trends reallocate work across the US economy. Only a teaser in this email.", "angle": "Pairs with Rasgon's anecdote: the analytics skill premium is being repriced in real time.", "tweetA": "The McKinsey framing is 'pathways to new jobs.' The Bernstein framing is 'a 3-month model in 80 minutes.' Both can be true, and the gap between them is where wage inflation for the survivors comes from.", "tweetB": "If AI shifts demand to a smaller set of higher-value skills, you get inequality in wages before you get unemployment. Watch Thursday's ECI for the first read on that split.", "charts": {"count": 1, "hot": false, "desc": "Chart inside linked article — worth opening"}, "link": "https://email.mckinsey.com/featured-insights/charts/ai-and-the-workforce-reinvention", "id": 24}, {"cat": "positioning", "urgency": "watch", "source": "James Bulltard / Discover Tool Update #1", "title": "Options-flow 'Discover' tool: setups that hit +30% within 30 days at least 60% of the time over 90 days (some '24 of 24')", "idea": "New feature scores every print by setup, days to expiry, premium size and strike distance and flags setups with ≥60% hit rate of +30% inside 30 days over the last 90 days. Author cites a CART trade logged 15 minutes before the close Friday; Instacart then announced it was seeking a buyout and popped over 10%.", "angle": "Flow-as-signal getting systematized with base rates is the retail version of the leak-detection desk. Small samples ('a handful of trades per ticker') are the risk.", "tweetA": "'24 of 24' is a base rate on one setup over 90 days, which is a regime, not an edge. But a flow print 15 minutes before an Instacart buyout headline is the kind of tape people will be backtesting this weekend.", "tweetB": "Options flow used to be a black box people screenshotted. Now it's being turned into hit-rate tables per setup. The more people trade the same table, the faster the edge decays. Early adopters get paid for being early, not for being right.", "charts": {"count": 1, "hot": false, "desc": "Screenshot of scanner markers; open article"}, "link": "https://www.jamesbulltard.com/p/discover-tool-update-1", "id": 25}];
