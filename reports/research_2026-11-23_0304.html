<script>
const ITEMS = [{"id": 1, "cat": "macro", "urgency": "deep", "source": "Trading Mindset & Data / Alessio Urban", "title": "Philly Fed Prices Paid posts its biggest jump since April, and core import prices are rising at the fastest pace since 2021", "idea": "Philly Fed Prices Paid had its largest one-month jump since April. Core import prices excluding energy (tech materials, non-energy goods) are rising at the fastest pace since 2021. TMAD blames AI, semiconductor and data-center spending for overheating the economy. Their view: if Wednesday's PCE prints hot, a 50bp hike is on the table.", "angle": "This is the cost-push side of the AI capex story, a different channel from demand-pull. It matters for Wednesday's PCE and for whether a December hike becomes 50bp.", "tweetA": "Core import prices ex-energy are rising at the fastest pace since 2021, and the driver is servers, chips and grid gear, not oil. That inflation doesn't go away because $NVDA fell 23%. Contracts already signed still have to be delivered.", "tweetB": "The market reads the AI selloff as disinflationary. Look at the pipeline instead: Philly Fed prices paid had its biggest jump since April, with oil down 20% in the same month. Strip out energy and the Fed still has a problem.", "charts": {"count": 4, "hot": false, "desc": "Core Import Price ex-Energy (Bloomberg) — sharpest rise since 2021; plus gold/GLD gamma charts"}, "link": "https://open.substack.com/pub/tradingmindsetanddata/p/tmad-commodities-inflationary-headwinds"}, {"id": 2, "cat": "positioning", "urgency": "deep", "source": "Trading Mindset & Data / Alessio Urban", "title": "The GLD $330 put gamma wall hit and gave way almost immediately in negative gamma", "idea": "The $330 GLD put gamma wall TMAD had been tracking for weeks was hit and broke quickly. Dealers were short gamma, so their hedging added to the move instead of absorbing it. TMAD's October 8 short has now reached its target. The full outlook for gold, silver, oil, copper and uranium is behind the paywall.", "angle": "Options structure helps explain why gold fell 9% in a week that should have been risk-off-positive. A gamma wall that fails in negative gamma speeds up the move rather than stopping it.", "tweetA": "Gold fell 9% in a week when equities crashed. That isn't a haven failing. Dealers were short gamma under GLD $330, and once the wall broke, their hedging became forced selling.", "tweetB": "When the gold trade gets crowded, the options book shows it first. $GLD $330 was the put wall and it didn't hold for a day. The next question is where the dealer gamma flips back to positive.", "charts": {"count": 2, "hot": false, "desc": "GLD gamma levels + Oct 8 short trade screenshot"}, "link": "https://open.substack.com/pub/tradingmindsetanddata/p/tmad-commodities-inflationary-headwinds"}, {"id": 3, "cat": "positioning", "urgency": "deep", "source": "Seven c Newsletter #195", "title": "$6T lost in seven days: the S&P 500 is the most oversold since 2015 and Fear & Greed reads 9.7", "idea": "A seven-day losing streak erased about $6T from the S&P 500, leaving it the most oversold since 2015. The Nasdaq 100 fell 10.4%, tech's worst week since 2020. The Fear & Greed Index hit 9.7. The newsletter says the 'Trump Put' looks to be fading.", "angle": "Oversold readings like 2015's produced violent bounces, but that was with a Fed on hold. Here the Fed is hiking.", "tweetA": "The last time the S&P was this oversold was 2015, and the Fed was at zero then. This time it's talking about hikes at the next three meetings. Oversold readings work better when policy is easing, not tightening.", "tweetB": "Fear & Greed at 9.7. $6T gone in seven sessions. The hard part isn't calling the bounce. It's deciding whether to hold it through Wednesday's PCE.", "charts": {"count": 14, "hot": false, "desc": "Roundup images: weekly index moves, sentiment, technical roundup"}, "link": "https://open.substack.com/pub/sevenc/p/seven-c-newsletter-195"}, {"id": 4, "cat": "macro", "urgency": "deep", "source": "Seven c Newsletter #195", "title": "AI investment accounted for about 65% of US GDP growth this year, and the Fed now says AI may be overheating demand", "idea": "AI investment made up about 65% of US GDP growth this year. Fed officials Cook and Goolsbee warned that inflation is still too high and that AI may be overheating demand. The minutes point to a December hike, with a couple of officials floating more than 25bp. JPMorgan expects hikes at the next three meetings, though traders no longer fully price December.", "angle": "If AI capex is two-thirds of growth, then an AI equity drawdown is also a GDP risk. A Fed hiking into that is a policy-error setup.", "tweetA": "AI capex was about 65% of US GDP growth this year. Now the Fed wants to hike because AI is overheating demand. If tighter money makes the capex the target, the growth goes with it.", "tweetB": "JPM has hikes penciled in at the next three meetings. Traders don't even fully price December. That's a big gap to carry into a week with PCE and GDP on the same day.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://open.substack.com/pub/sevenc/p/seven-c-newsletter-195"}, {"id": 5, "cat": "crypto", "urgency": "deep", "source": "Seven c Newsletter #195", "title": "BTC below $56K erases every gain since the 2024 election; crypto is about $2.3T off its peak with $2.7B liquidated in 24h", "idea": "Bitcoin broke below $56K, wiping out all of its post-2024-election gains. The total crypto market is about $2.3T off its peak, and $2.7B was liquidated in 24 hours. Leaders in the alpha section are already calling a 'generational BTC buy' and 'capitulation meets support'.", "angle": "This is a full round trip of the policy-optimism trade. The interesting tell is that the 'generational buy' calls are arriving in the same newsletter as the liquidation numbers.", "tweetA": "$BTC is back below where it was on election night 2024. Every pro-crypto policy win since then is now priced at zero, while the policy itself is still in place. That's either a mispricing or a verdict.", "tweetB": "$2.7B liquidated in 24h, and the same newsletter already carries a 'generational buy' link. Capitulation usually takes longer than one weekend.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://open.substack.com/pub/sevenc/p/seven-c-newsletter-195"}, {"id": 6, "cat": "venture", "urgency": "watch", "source": "Seven c Newsletter #195", "title": "Anthropic priced its IPO at $83 and opened at $111.50, a 34% pop during the worst tech week since 2020", "idea": "Anthropic's IPO priced at $83 and opened at $111.50, roughly a 34% first-trade pop. It came in the same week $NVDA fell 23% and the Nasdaq 100 fell 10.4%. Public investors kept their appetite for model companies even while the compute layer was being sold off.", "angle": "This points to rotation inside AI, from picks-and-shovels toward the model and app layer, rather than a blanket AI exit.", "tweetA": "$NVDA had its worst week since 2008. The same week, Anthropic opened 34% above its IPO price. The market isn't leaving AI. It's moving from the people selling the shovels to the people with the revenue.", "tweetB": "A 34% IPO pop in extreme-fear conditions (F&G at 9.7) is a strong demand signal. Watch the lockup and the first earnings print. That's where the tension between that pop and the chip selloff gets resolved.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://open.substack.com/pub/sevenc/p/seven-c-newsletter-195"}, {"id": 7, "cat": "energy", "urgency": "deep", "source": "Seven c Newsletter #195", "title": "US SPR at its lowest since 1982 just as the US strikes Iran, while oil falls about 20% in November and gasoline has its biggest one-day drop in 18 years", "idea": "The US strategic petroleum reserve is at its lowest level since 1982. US crude fell below $82 and is down about 20% in November. Gasoline had its biggest one-day drop in 18 years. All of this happened in the same week the US struck Iran.", "angle": "A falling price alongside a near-empty SPR leaves the US with no buffer if the Gulf actually breaks. That is a convex tail.", "tweetA": "The US struck Iran, and oil fell. The SPR is at its lowest since 1982. If Gulf flows ever stop, there's nothing left to release. Cheap oil insurance comes from a low price, a thin buffer and a hot war all at once.", "tweetB": "Gasoline had its biggest one-day drop in 18 years during a US-Iran strike week. Either the physical surplus is far larger than the headlines suggest, or the market is badly underpricing the tail.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://open.substack.com/pub/sevenc/p/seven-c-newsletter-195"}, {"id": 8, "cat": "regulation", "urgency": "watch", "source": "Seven c Newsletter #195", "title": "Trump wants to cap credit card interest rates at 10%", "idea": "Trump wants a 10% cap on credit card interest rates. Average card APRs are above 20%, so a cap at that level would compress card-issuer net interest margins sharply and likely tighten credit to subprime borrowers. It lands in a week when Capital One fell 30% (per Sinn).", "angle": "A policy headline that hits card-heavy lenders ($COF, $SYF, $AXP) while banks are already down 20–30%.", "tweetA": "A 10% card APR cap, with average APRs above 20%. At 10%, subprime lending stops being profitable. The likely result is less credit for subprime borrowers, not cheaper credit. $COF already fell 30% last week.", "tweetB": "The populist trade is turning on the banks. A 10% card cap, investigations into $NVDA, and a Fed that's hiking. Financials had six of the ten largest US banks fall more than 20%, and a margin cap could be what's next for them.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://open.substack.com/pub/sevenc/p/seven-c-newsletter-195"}, {"id": 9, "cat": "geopolitics", "urgency": "deep", "source": "Seven c Newsletter #195", "title": "China October data: retail sales +0.4% and investment −16.9%", "idea": "China's October retail sales grew only 0.4%, and investment fell 16.9%. That is a hard slowdown on both the consumer and capex side, and it comes alongside the roughly $1.7T loss in Chinese tech index value since June (Innes).", "angle": "China weakness is bearish for industrial metals, which ties into copper's 14% November drop.", "tweetA": "Chinese investment fell 16.9% in October. Copper fell 14% in November. That's not a coincidence. The 'AI demand will absorb all the copper' story never had a plan for a Chinese capex collapse.", "tweetB": "China retail sales +0.4%, investment −16.9%. Meanwhile Beijing is easing margin requirements to support stocks. It's propping up the market while the real economy weakens, which looks a lot like 2015.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://open.substack.com/pub/sevenc/p/seven-c-newsletter-195"}, {"id": 10, "cat": "crypto", "urgency": "watch", "source": "Seven c Newsletter #195", "title": "Russia now allows crypto trading on exchanges", "idea": "Russia has legalized crypto trading on exchanges. That moves crypto from sanctions-workaround settlement into a regulated domestic venue. It also lands the same week the Russian diesel deal stalled because buyers were wary of Russian cargo (Fulcrum).", "angle": "A sanctioned state formalizing crypto rails is a de-dollarization data point, and a compliance headache for offshore venues.", "tweetA": "Russia legalized exchange crypto trading the same week buyers refused Russian diesel cargoes. When counterparties won't take your oil, you build rails that don't need their banks.", "tweetB": "Watch the on-chain flows, not the press release. If Russian exchange volume spikes in USDT rather than BTC, this was about dollar access, not crypto adoption.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://open.substack.com/pub/sevenc/p/seven-c-newsletter-195"}, {"id": 11, "cat": "macro", "urgency": "deep", "source": "Seven c Newsletter #195", "title": "Japan's core inflation rose to 2.1%, its highest since December 2025, driven by the Iran war", "idea": "Japan's core CPI rose to 2.1%, the highest since December 2025. The newsletter attributes it to Iran-war energy effects. Japan was closed Monday for a holiday, so the Asian session opened without cash JGB or Treasury trading.", "angle": "This adds pressure on the BoJ to hike at the same time as the Fed and BoK. A synchronized tightening wave is landing on a tech crash.", "tweetA": "Fed, BoK and now BoJ all have an inflation reason to tighten into a global equity selloff. A one-off policy error is survivable. A synchronized one is what produces a regime shift.", "tweetB": "Japanese core CPI at 2.1% with Brent down 20% this month. If the energy shock is rolling over and Japan's CPI is still rising, the inflation isn't coming from oil.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://open.substack.com/pub/sevenc/p/seven-c-newsletter-195"}, {"id": 12, "cat": "tech", "urgency": "watch", "source": "Seven c Newsletter #195", "title": "CNN reports that the FBI's national crime database was hacked", "idea": "CNN reports that the FBI's national crime database was breached. A compromise of federal law-enforcement data at that level puts cybersecurity spending and federal identity infrastructure back on the agenda, during a market sell-everything week.", "angle": "Cyber budgets don't care about rate cycles. In past breaches, federal security names have held up better during broad selloffs.", "tweetA": "Even the FBI's crime database was breached. Somewhere in a budget meeting, cyber spending just became non-discretionary again. $CRWD $PANW $ZS have that in their favor going into 2027 budgets.", "tweetB": "The FBI breach got buried under a $6T selloff. When the market reopens to headlines, this is the kind of story that drives a Congressional appropriations push.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://open.substack.com/pub/sevenc/p/seven-c-newsletter-195"}, {"id": 13, "cat": "gold", "urgency": "deep", "source": "Seven c Newsletter #195", "title": "November commodities: oil −20%, copper −14%, silver −13%, gold −7.6%", "idea": "Commodities fell hard in November. Oil is down about 20%, copper 14%, silver 13% and gold 7.6%. That's a broad hit to real assets during a month that was supposed to be inflationary.", "angle": "When real assets and equities fall together, that's a dash for cash, not a rotation.", "tweetA": "Oil −20%, copper −14%, silver −13%, gold −7.6%, while the Fed warns about inflation. Either commodities are right and the Fed is about to overtighten, or the Fed is right and this is the best entry in real assets in two years.", "tweetB": "Every hedge failed in November: gold, silver, crypto, long bonds. When everything correlates to one, the only thing that worked was cash. That tells you who's selling: levered players meeting margin calls.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://open.substack.com/pub/sevenc/p/seven-c-newsletter-195"}, {"id": 14, "cat": "AI/infra", "urgency": "deep", "source": "P Equity Research / Speedrun", "title": "NVDA down 41% in a month, with an SEC accounting probe among several investigations; Dell reports Tuesday", "idea": "Nvidia has lost 41% of its value in one month. It is facing multiple investigations, including an SEC accounting probe. Dell, a leading server maker, reports after the close Tuesday, and Wednesday brings core PCE, GDP (second estimate) and personal spending all at once.", "angle": "Dell's AI server backlog is the first hard read on whether NVDA's problems are about governance or about demand.", "tweetA": "$NVDA −41% in a month on an SEC accounting probe. On Tuesday, $DELL tells us whether the AI server backlog is real. If Dell's backlog holds, this is a governance discount, not a demand collapse.", "tweetB": "This holiday week packs Dell earnings on Tuesday and PCE + GDP + spending on Wednesday into 36 hours. A Thanksgiving-thin market facing that much data is how a 3% bounce turns into 3% down.", "charts": {"count": 6, "hot": false, "desc": "Event calendar images; earnings + economic calendar"}, "link": "https://open.substack.com/pub/pequityresearch/p/speedrun-upcoming-events-this-week-eab"}, {"id": 15, "cat": "gold", "urgency": "deep", "source": "Robert Sinn / Charts of the Week", "title": "Capitulation in metals: in one week gold −9.2%, GDX −16.2% and GDXJ −17.9%", "idea": "One-week performance: gold −9.20%, GDX −16.22%, GDXJ −17.94%, SPY −8.56%, QQQ −10.51%, NVDA −22.92%, MSTR −30.30%. Sinn calls it a once-in-a-century liquidation in tech. Gold miners fell nearly twice as much as gold itself.", "angle": "Miners at about 2x gold's beta on the downside is typical of forced liquidation. Historically that has been followed by sharp miner mean-reversion once the margin selling clears.", "tweetA": "GDXJ −17.9% versus gold −9.2%. Miners lost 2x the metal in a week. That's liquidation, not a change in fundamentals. Gold at $3,570 still means miners are printing cash at these prices.", "tweetB": "Gold fell more than SPY last week (−9.2% vs −8.6%). The 'safe haven' sold off harder than the S&P. When the haven is the liquidity source, you're in the margin-call phase, not the fear phase.", "charts": {"count": 4, "hot": true, "desc": "NVDA daily + MSTR daily charts showing waterfall declines; 🔥 one-week perf table across gold/miners/indices"}, "link": "https://open.substack.com/pub/robertsinn/p/the-charts-of-the-week-11222026-nvda"}, {"id": 16, "cat": "credit", "urgency": "deep", "source": "Robert Sinn / Charts of the Week", "title": "Six of the ten largest US banks fell more than 20%: GS −30.7%, COF −30.2%, MS −28%, BAC −27%", "idea": "The selling reached financials. Bank of America −27%, Wells Fargo −20.1%, Goldman Sachs −30.7%, Morgan Stanley −28%, Capital One −30.2%, Citigroup −24.7%. Sinn calls the cause an 'especially pernicious confluence of events', and the rest is paywalled.", "angle": "When big banks fall 20–30%, the market is pricing credit and funding risk, not just tech multiples. Watch HY spreads and repo.", "tweetA": "$GS −30.7%, $MS −28%. The two banks most tied to capital markets got hit hardest. The market is pricing an end to the IPO and M&A pipeline, even though Anthropic just popped 34%.", "tweetB": "A tech selloff doesn't take $BAC down 27%. That's the market asking who financed the AI capex and the leverage behind it. Check the HY and private credit marks before buying the bank bounce.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — worth opening"}, "link": "https://open.substack.com/pub/robertsinn/p/the-charts-of-the-week-11222026-nvda"}, {"id": 17, "cat": "crypto", "urgency": "deep", "source": "Robert Sinn / Charts of the Week", "title": "MSTR −30.3% in a week, more than BTC itself", "idea": "MicroStrategy fell 30.30% in one week, against Nvidia's 22.92% and QQQ's 10.51%. With BTC below $56K, MSTR's leveraged-BTC structure is behaving like what it is: a levered bet whose premium to its BTC holdings compresses when risk appetite disappears.", "angle": "The MSTR premium to NAV is a sentiment gauge. If it's near or below 1x, the treasury-company playbook stops working.", "tweetA": "$MSTR −30% in a week while $BTC fell less. The premium-to-NAV engine is running in reverse. When the premium goes, the flywheel of issuing stock to buy BTC turns into a question of who sells first.", "tweetB": "$MSTR fell more than $NVDA in the worst week for NVDA since 2008. Leverage on leverage behaves the same way in both directions.", "charts": {"count": 1, "hot": false, "desc": "MSTR daily chart"}, "link": "https://open.substack.com/pub/robertsinn/p/the-charts-of-the-week-11222026-nvda"}, {"id": 18, "cat": "regulation", "urgency": "deep", "source": "The Pressure Point / Michael McDonough (Fulcrum)", "title": "Trump's threatened tax on offshore data centers vs. Bush's 2002 steel tariff, which kept hurting jobs years after it was lifted", "idea": "Trump threatened to tax US companies that build data centers abroad. The precedent: Bush's 2002 steel safeguard (8–30% duties, versus normal 0–1%) was lifted after less than two years following a WTO ruling and more than $2B in authorized sanctions. A 2025 study found no gain in local steel jobs and persistent losses in steel-consuming industries well after repeal. As Fulcrum puts it: 'A tariff can expire on a date; a lost order has no repeal clause.'", "angle": "The damage from a policy threat lasts longer than the threat itself. This applies to the data-center capex pipeline right now.", "tweetA": "Bush's steel tariff lasted 21 months. The job losses in steel-using industries lasted years beyond that. Now there's a threatened tax on offshore data centers. The threat alone can freeze a project, and frozen projects lose their power queue spots.", "tweetB": "The best line I read this weekend: 'A tariff can expire on a date; a lost order has no repeal clause.' Apply it to every AI capex decision being held up by a threatened data-center tax.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://whatsthelatest.ai"}, {"id": 19, "cat": "AI/infra", "urgency": "watch", "source": "The Pressure Point / Michael McDonough (Fulcrum)", "title": "Interconnection queues are the irreversible part: a delayed data center that gives up its utility queue slot can't get it back", "idea": "Fulcrum separates a project that waits from one that loses the conditions that made it viable. If a delayed data center surrenders its place in a utility queue, dropping the tax threat later leaves the developer with whatever queue exists then. What to watch: developer filings or utility dockets showing a deferred award with its power reservation intact (a pause) versus a surrendered reservation or canceled equipment order (lasting damage).", "angle": "Utility docket monitoring is a leading indicator for AI capex. Grid-queue scarcity also makes the existing interconnects held by $VST, $CEG, $TLN and others more valuable.", "tweetA": "The scarcest asset in AI isn't GPUs. It's a spot in a utility interconnection queue. Every data center paused by policy risk that gives up its spot hands that power to whoever is next in line.", "tweetB": "Here's a leading indicator nobody watches: surrendered power reservations in utility dockets. A paused project keeps its megawatts. A canceled one gives them back. That's the difference between a dip in AI capex and a real break.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://whatsthelatest.ai"}, {"id": 20, "cat": "energy", "urgency": "watch", "source": "The Pressure Point / Michael McDonough (Fulcrum)", "title": "No tankers have reached the US under Trump's Russian diesel deal", "idea": "The Washington Post reports that no tankers have reached the US under Trump's Russian diesel deal. Analysts point to buyers being uneasy about accepting Russian cargo. Fulcrum's point: the date Washington changes course and the date anyone is willing to trade are two different dates.", "angle": "Official sanction relief doesn't move physical flows by itself. Compliance desks, insurers and banks set the actual timeline.", "tweetA": "Washington cleared Russian diesel imports, and zero tankers have shown up. Compliance officers, P&I insurers and bank KYC still run on the old rules. Policy moves at the speed of a tweet. Trade moves at the speed of a compliance desk.", "tweetB": "The Russian diesel deal stalled at the dock, and Russia legalized crypto exchange trading the same week. When Western counterparties won't touch your barrels, you build rails that don't need them.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://whatsthelatest.ai"}, {"id": 21, "cat": "geopolitics", "urgency": "act", "source": "The Pressure Point / Michael McDonough (Fulcrum)", "title": "Bessent says Treasury is asking Nvidia about its chip sales to China and who oversaw compliance", "idea": "Treasury Secretary Scott Bessent said the US is asking Nvidia about its chip sales to China and seeking to identify who oversaw compliance (via SCMP). That is a named-individual compliance probe on top of the SEC accounting probe, after NVDA fell 41% in a month.", "angle": "Asking who oversaw compliance means the government is looking for an individual to hold responsible, which turns this from a corporate penalty into a personnel story. That raises the leadership-chaos risk Seven c flagged.", "tweetA": "'Seeking to identify who oversaw compliance.' When Treasury uses that phrase, it's looking for a person, not a fine. $NVDA has an SEC accounting probe, a China export-control probe and leadership turmoil all running together.", "tweetB": "$NVDA's China export probe matters for AMD and the whole China AI supply chain too. If Nvidia's compliance failed, every chip sale to China gets re-audited. $AMD $AVGO $SMCI", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://whatsthelatest.ai"}, {"id": 22, "cat": "politics", "urgency": "watch", "source": "The Pressure Point / Michael McDonough (Fulcrum)", "title": "Hubbard beats Foxx in North Carolina, giving Democrats the largest House majority either party has held since 1992", "idea": "Democrat Chuck Hubbard defeated Republican Rep. Virginia Foxx in North Carolina. That secures for Democrats the largest House majority either party has held since 1992. Trump's agenda (tariffs, the data-center tax, the credit card cap) now faces a Democratic House.", "angle": "A divided government with a large opposition House reduces the odds of new fiscal stimulus. Some populist items, like the card-rate cap, could get bipartisan support.", "tweetA": "Democrats now have the biggest House majority since 1992. The policy most likely to pass is the one both parties like: a credit card rate cap. Card lenders should worry more about that than about tariffs.", "tweetB": "The 'Trump Put' fades just as the House flips by the widest margin since 1992. Fiscal backstop odds fall, monetary backstop odds fall because the Fed is hiking. For the first time in years, nobody is clearly on the hook for a rescue.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://whatsthelatest.ai"}, {"id": 23, "cat": "energy", "urgency": "watch", "source": "The Pressure Point / Michael McDonough (Fulcrum)", "title": "COP31 ends without a deal after delegates reject a draft that didn't mention fossil fuels", "idea": "COP31 ended without a deal. Delegates rejected a draft text that did not mention fossil fuels at all, and the fossil-fuel commitments weren't restored. The multilateral climate process is stalling just as oil prices fall.", "angle": "No COP deal plus cheap oil means less policy pressure on upstream capex, which matters for long-dated energy positioning.", "tweetA": "COP31 couldn't agree on a text that even mentions fossil fuels. With Brent down 20% this month, the transition is stalling on both price and policy. For long-cycle upstream projects, that's an unexpected tailwind.", "tweetB": "The climate process now fails over wording, not targets. Capital follows policy, so with no policy the default stays hydrocarbons plus grid buildout for AI.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://whatsthelatest.ai"}, {"id": 24, "cat": "geopolitics", "urgency": "watch", "source": "The Pressure Point / Michael McDonough (Fulcrum)", "title": "A suspected drone strike causes an explosion aboard a Russian ship at a Benghazi naval base", "idea": "Libya's eastern-based government said a suspected drone strike caused an explosion aboard a Russian ship docked at a naval base in Benghazi. No one immediately claimed responsibility. Benghazi is a key part of Russia's Mediterranean and Africa logistics network.", "angle": "This adds Libya oil supply risk and Russian Med-basing risk to a Middle East that is already hot.", "tweetA": "Someone drone-struck a Russian ship in Benghazi, and nobody has claimed it. Russia's Libya foothold is its gateway to the Sahel. If Libyan output wobbles, the 2mb/d surplus case gets a little thinner.", "tweetB": "Mediterranean risk was not on most oil desks' radar last week. A Russian vessel exploding at a Haftar-controlled base changes that.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://whatsthelatest.ai"}, {"id": 25, "cat": "AI/infra", "urgency": "act", "source": "The Dark Side of the Boom / Stephen Innes", "title": "Kospi opens −3% with Samsung and Hynix −3% even as Nasdaq futures rally 3%; Samsung PT cut to ₩350K on NAND", "idea": "The Kospi opened almost 3% lower, with Samsung Electronics and SK Hynix down about 3% even as Nasdaq 100 futures rose as much as 3%. Samsung's price target was cut to ₩350,000 from ₩430,000, with earnings trimmed through 2028. Reasons: softer NAND prices, weaker consumer demand and slowing Chinese enterprise SSD demand, outweighing a better 2027 DRAM outlook.", "angle": "Korean memory names not joining the US bounce is a real-time tell that the selling is about earnings, not just multiples.", "tweetA": "Nasdaq futures +3%. Samsung and Hynix −3%. When the AI supply chain won't join the US bounce, the bounce has a credibility problem. The memory names are where real earnings cuts are showing up first.", "tweetB": "Samsung estimates were cut through 2028 on NAND, not DRAM. HBM is still fine, but the commodity memory layer is already rolling over. That's where the AI cycle reaches consumer and China demand.", "charts": {"count": 2, "hot": false, "desc": "Asia open charts — Kospi/Nasdaq futures divergence"}, "link": "https://open.substack.com/pub/thedarksideoftheboom/p/asia-open-wall-street-passes-the"}, {"id": 26, "cat": "positioning", "urgency": "act", "source": "The Dark Side of the Boom / Stephen Innes", "title": "Asian authorities reach for emergency tools: China eases margin rules, Taiwan restricts short sales after its worst week in 35 years, Korea plans a stabilization fund", "idea": "China is easing minimum margin requirements for leveraged buying. Taiwan tightened short-selling restrictions and disclosed state equity purchases after its worst weekly decline in 35 years. South Korea is relaxing corporate buyback limits and preparing a possible market-stabilization fund. MSCI Asia-Pacific is down about 18% from its June peak. Innes: 'You can make it easier to buy the market, but you cannot force investors to want what they're still trying to sell.'", "angle": "Coordinated state intervention can put a floor under the market temporarily. Historically (China 2015, Taiwan 2008), short-sale bans have slowed the decline rather than ended it.", "tweetA": "Taiwan just had its worst week in 35 years and responded with a short-selling ban plus state buying. That's the China 2015 playbook. Short bans don't stop selling. They remove the buyers who would cover later.", "tweetB": "Four Asian governments rolled out market-support measures in one weekend. When policymakers tell you this loudly that they're worried, foreigners hear 'sell before the floor gets tested.'", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://open.substack.com/pub/thedarksideoftheboom/p/asia-open-wall-street-passes-the"}, {"id": 27, "cat": "macro", "urgency": "act", "source": "The Dark Side of the Boom / Stephen Innes", "title": "The Bank of Korea meets Thursday with a hike still live despite the equity crash", "idea": "The BoK meets Thursday after holding at 3% last month, following hikes in July and August. Inflation remains above target, supported by the chip-driven boom, so another 25bp is possible. Innes compares tightening into an equity drawdown to sending a boxer back in after twelve rounds.", "angle": "The BoK's decision is a test case for whether central banks put markets or inflation first, ahead of the Fed's December meeting.", "tweetA": "Thursday's Bank of Korea decision is the dress rehearsal for the Fed. If they hike into a 3%-down Kospi and a chip selloff, central banks are telling you there's no put. Price it accordingly.", "tweetB": "Korea's inflation is chip-boom inflation. If the chip boom is cracking, the BoK can skip the hike and let the market do the tightening. That gives a central bank a way to stand pat without looking soft.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://open.substack.com/pub/thedarksideoftheboom/p/asia-open-wall-street-passes-the"}, {"id": 28, "cat": "AI/infra", "urgency": "watch", "source": "The Dark Side of the Boom / Stephen Innes", "title": "China's tech indexes have lost about $1.7T since June, and SK Hynix will convert bonds into an indirect 14.1% stake in Kioxia", "idea": "Three Chinese tech-heavy indexes have lost about $1.7T in combined market value since the end of June. That pressures Beijing's push for a self-sufficient semiconductor and AI ecosystem. Separately, SK Hynix plans to convert bonds into an indirect 14.1% stake in Japan's Kioxia, consolidating the NAND industry during the downturn.", "angle": "Hynix taking a Kioxia stake in a NAND downturn is a counter-cyclical move to consolidate the industry. It's worth noting even as Samsung's NAND estimates get cut.", "tweetA": "While Samsung gets its NAND estimates cut, SK Hynix is converting bonds into 14.1% of Kioxia. The best operators consolidate at the bottom. This looks like the start of a NAND oligopoly.", "tweetB": "China's tech stocks have lost $1.7T since June. 'Cheaper AI models' didn't protect them. DeepSeek-style efficiency is deflationary for valuations everywhere, Beijing's included.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://open.substack.com/pub/thedarksideoftheboom/p/asia-open-wall-street-passes-the"}, {"id": 29, "cat": "energy", "urgency": "deep", "source": "The Dark Side of the Boom / Stephen Innes", "title": "Brent −20% below $92 with a 2mb/d surplus, yet a $25–30 geopolitical premium still sits in the price", "idea": "Brent fell about 20% this month to below $92. Estimates point to a surplus of roughly 2 mb/d this quarter, with Gulf shipments still flowing despite tanker attacks. A geopolitical premium of as much as $25–30/bbl may still be embedded in the price. Innes argues cheap energy can 'do some of the Fed's inflation-fighting heavy lifting' going into the holiday season, but only if supply, not demand, is driving the decline.", "angle": "If $25–30 of premium is still in the price and the surplus is real, the downside could still be large. The near-empty SPR (Seven c) keeps the upside tail open too.", "tweetA": "Brent at $92 with a 2mb/d surplus and still carrying $25–30 of war premium. Take the premium out and fair value is in the $60s. Lower oil may be the only thing that lets the Fed skip December. $XLE vs $XRT", "tweetB": "The bull case for equities this week is oil, not AI. Cheaper gasoline before the holiday season acts like a tax cut that doesn't need Congress, and Congress just flipped hard against the White House.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://open.substack.com/pub/thedarksideoftheboom/p/asia-open-wall-street-passes-the"}, {"id": 30, "cat": "gold", "urgency": "act", "source": "The Dark Side of the Boom / Stephen Innes", "title": "Gold rebounds about 1% toward $3,570, and Innes says this week's bullion ETF flows are the tell", "idea": "Gold climbed roughly 1% toward $3,570, with silver and copper also recovering. Innes frames last week's metals selling as liquidity-raising ('when the margin clerk comes knocking, nobody asks whether the gold position is a long-term inflation hedge'). ETF holdings saw modest outflows last week. Accelerating outflows would mean liquidation is still alive. Stabilizing flows alongside equities would signal footing.", "angle": "Gold ETF flows are the cleanest real-time gauge of whether forced selling is finished.", "tweetA": "Gold is back to $3,570, but don't trust the bounce until GLD holdings stop falling. Last week gold was a source of cash, not a haven. Watch the ETF flow print before the price.", "tweetB": "'They sell what they can, not what they want.' The assets that fell hardest in a liquidation are often the ones that recover first. GDXJ −18% in a week falls in that category.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://open.substack.com/pub/thedarksideoftheboom/p/asia-open-wall-street-passes-the"}, {"id": 31, "cat": "positioning", "urgency": "act", "source": "The Dark Side of the Boom / Stephen Innes", "title": "Nasdaq 100 briefly crossed the 20% bear threshold, VIX hit its highest since April 2025, and Innes caps the S&P bounce at 7,250–7,350", "idea": "On Friday the S&P 500 entered correction territory, the Nasdaq 100 briefly crossed the 20% bear-market threshold from its October peak, and VIX reached its highest since April 2025. More than $4T left Nasdaq-listed companies in a week, with NVDA down 14% on Friday alone. Innes sees room for the S&P to bounce toward 7,250–7,350 before selling returns, but notes there hasn't been enough breadth exhaustion to call a bottom.", "angle": "A rally into 7,250–7,350 could be an opportunity to sell rather than to chase, depending on Tuesday and Wednesday's data.", "tweetA": "Nasdaq futures +3% Monday morning. The real question is who sells into it. After $4T was lost in a week, lots of PMs need a green screen just to cut risk. 7,250–7,350 on the S&P is where I'd expect that supply.", "tweetB": "VIX at its highest since April 2025. April 2025 bottomed in a few days because a policy reversal ended it. This time the Fed is hiking and the House just flipped. Who reverses policy this time?", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://open.substack.com/pub/thedarksideoftheboom/p/asia-open-wall-street-passes-the"}];

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function cardHTML(item){
  var c = col(item.cat), ch = item.charts || {count:0};
  var icon = ch.hot ? " 🔥" : (ch.count > 0 ? " 📊" : "");
  var h = '<div class="card' + (ch.hot ? ' hot' : '') + '" id="card' + item.id + '" data-id="' + item.id + '">';
  h += '<div class="hd" onclick="toggleCard(' + item.id + ')"><span class="num">#' + item.id + '</span><span>' + UEMO[item.urgency] + '</span>';
  h += '<span class="src" style="background:' + c + '">' + esc(item.source) + '</span><span class="tag">' + esc(item.cat) + '</span><span>' + icon + '</span>';
  h += '<div class="ttl">' + esc(item.title) + '</div></div><div class="bd">';
  h += '<div class="lbl">the idea</div><div>' + esc(item.idea) + '</div>';
  h += '<div class="lbl">my angle</div><div class="angle" style="border-color:' + c + ';background:' + hexA(c, 0.08) + '">' + esc(item.angle) + '</div>';
  h += '<div class="tw"><div class="tbox"><div class="h"><span style="color:#378add">TWEET A</span>' + '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button>' + '</div>' + esc(item.tweetA) + '</div>';
  h += '<div class="tbox"><div class="h"><span style="color:#7f77dd">TWEET B</span>' + '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button>' + '</div>' + esc(item.tweetB) + '</div></div>';
  if (ch.count > 0 || ch.desc) {
    h += '<div class="chart' + (ch.hot ? ' hotc' : '') + '">' + (ch.hot ? '🔥 CHART WORTH SAVING — ' : '📊 ') + (ch.count ? ch.count + ' chart(s) in email. ' : '') + esc(ch.desc || '') + '</div>';
  }
  if (item.link) h += '<a class="lnk" href="' + esc(item.link) + '" target="_blank" rel="noopener">↗ Read full article</a>';
  h += '</div></div>';
  return h;
}

    b += '<span class="pill' + (on ? ' on' : '') + '" style="' + (on ? 'background:' + col(k) : '') + '" onclick="setCat(\'' + k + '\')">' + esc(k) + ' ' + cats[k] + '</span>';

  ["act","deep","watch"].forEach(function(k){

    ub += '<span class="pill' + (on ? ' on' : '') + '" style="' + (on ? 'background:#555' : '') + '" onclick="setUrg(\'' + k + '\')">' + UNAME[k] + ' ' + u[k] + '</span>';
  });
  document.getElementById('urgbar').innerHTML = ub;
}

}
