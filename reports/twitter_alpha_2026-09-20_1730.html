<!DOCTYPE html>
<html lang="en">
<head>

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-09-20T17:20:57Z", "input_stats": {"total_tweets": 149, "unique_authors": 61, "tweets_with_images": 26, "after_noise_filter": 75}, "summary": "**Geopolitics:** Saudi Arabia formally withdrew from China's mBridge cross-border payment system and passed on a BRICS invite. **zriboua** calls it the end of Beijing's dual game of arming Iran's proxies while courting Gulf contracts; **DCinvestor** wryly notes \"petrodollar secured.\"\n\n**Macro:** **El-Erian**'s weekly note flags a calm Fed meeting colliding with rebounding sovereign yields, rising energy pressure and the Trump-Xi summit at UNGA. **Andy Constan** (dampedspring) is hammering Treasury/FHFA over Fannie/Freddie ramping MBS purchases again, calling Bessent a hypocrite on \"ATI\" and warning that GSEs \"riding the curve on the taxpayer dime\" just relocates the risk.\n\n**AI:** **Laura Shin** relays a Delphi Ventures view that DeepSeek's R1 paper shows real innovation, not just distillation - and that this is exactly why OpenAI and Anthropic want a regulatory moat. **Nicolas Bustamante** and **Jordi Visser** both argue AI's diffusion is accelerating faster than people process (Waymo drivers now saying what SWEs said in 2024); Visser ties this directly to a crypto breakout thesis built on AI agents becoming the real on-chain users.\n\n**Crypto:** **Simon Dedic** makes the case that tokenized equities are exactly where stablecoins were in 2019 - earlier, faster-moving, with SEC tailwinds instead of headwinds. Two independent voices (**DefiIgnas**, **alpha_pls**) are both long $BP (Backpack) on the tokenized-stocks-on-Solana thesis. **Stacy Muur** defends the new Arc chain's TVL ramp against timeline bashing with hard comparison data.\n\n**Notable:** A speculative \"crime coin\" ($AKE) is up 800x from its bottom per **thedefivillain**, a live froth signal. Separately, **Brian Armstrong** thanked Senate allies for getting CLARITY done while **Matt Hougan** pushed back on a WSJ narrative blaming Armstrong's negotiating style, arguing ethics optics and the banking lobby were the real obstacle - a live dispute over who gets credit/blame on crypto's biggest 2026 legislative story.", "sections": {"A_events": [{"cluster": "Saudi Arabia Exits China's mBridge — De-Dollarization Reversal", "category": ["geopolitics", "macro"], "items": [{"author": "zriboua", "summary": "Calls Saudi Arabia's withdrawal from the Chinese-led mBridge blockchain payment system a big deal: Beijing had been playing both sides, arming Iran's proxies while chasing Riyadh/Dubai contracts, and says \"that era is over.\"", "tweet_url": "https://x.com/zriboua/status/2101541774233583920", "images": [], "type": "tweet"}, {"author": "zriboua", "summary": "Follow-up post underscoring the same point with a supporting image.", "tweet_url": "https://x.com/zriboua/status/2101544277289361850", "images": ["https://pbs.twimg.com/media/HSovYiWXkAAdHvz.jpg"], "type": "tweet"}, {"author": "DCinvestor", "summary": "Reacts to the same Saudi mBridge withdrawal (plus a declined BRICS invite) with \"petrodollar secured\" - then notes dryly that the arrangement only works if Saudi actually has oil left to sell.", "tweet_url": "https://x.com/DCinvestor/status/2101557576291025356", "images": [], "type": "thread"}]}, {"cluster": "CLARITY Act — Who Gets Credit, Who Gets Blamed", "category": ["regulation", "crypto"], "items": [{"author": "brian_armstrong", "summary": "Thanks Senators Tim Scott, John Boozman, Cynthia Lummis and Bernie Moreno for \"countless hours\" of work getting the CLARITY Act done, calling it great leadership.", "tweet_url": "https://x.com/brian_armstrong/status/2101718658968113197", "images": [], "type": "tweet"}, {"author": "Matt_Hougan", "summary": "Pushes back on a WSJ frame (quoted) that pins CLARITY's troubles on Armstrong negotiating too aggressively plus \"the usual\" Trump-ethics talking points. His one-line verdict - \"ethics was always the end boss\" - sides with the quoted take that the banking industry, not crypto, blew the moment.", "tweet_url": "https://x.com/Matt_Hougan/status/2101698314685014466", "images": [], "type": "tweet"}]}, {"cluster": "AI Infra Debate — Memory Prices & Neocloud Credit Risk", "category": ["ai", "positioning"], "items": [{"author": "Evan_ss6", "summary": "Flags skepticism toward Acer's chairman, who dismissed the memory Big 3's guidance that DRAM/NAND prices will keep rising, arguing (per the quoted tweet) that this claim just isn't true - framed as a buyer talking his own book.", "tweet_url": "https://x.com/Evan_ss6/status/2101531126674137562", "images": ["https://pbs.twimg.com/media/HSojasoX0AAgBP8.jpg"], "type": "tweet"}, {"author": "nic_carter", "summary": "Notes the irony that neoclouds were recently written off over \"GPUs depreciate in under 3 years, accounting assumptions are wrong\" concerns, replying to a chart suggesting that thesis is aging badly.", "tweet_url": "https://x.com/nic_carter/status/2101665677652210012", "images": [], "type": "tweet"}, {"author": "Melt_Dem", "summary": "Adds nuance in reply to goodalexander: CoreWeave is fine given investment-grade credit and a large contracted-revenue pipeline; the real risk sits with smaller neoclouds, lower-credit-quality players, and the long tail of compute buyers.", "tweet_url": "https://x.com/Melt_Dem/status/2101720527047909461", "images": [], "type": "tweet"}]}, {"cluster": "$AKE 'Crime Coin' Blowoff — Late-Cycle Froth Signal", "category": ["crypto", "positioning"], "items": [{"author": "thedefivillain", "summary": "Tracks $AKE from a \"negative funding scheme\" red flag toward $20bn FDV, then 400x and finally 800x off its bottom, framing it as one of ~50 similar scam-coin candidates worth mechanically buying and waiting on.", "tweet_url": "https://x.com/thedefivillain/status/2101599739401642226", "images": ["https://pbs.twimg.com/media/HSphym7XUAAO39u.jpg", "https://pbs.twimg.com/media/HSp8s05WsAAuBL6.jpg"], "type": "thread"}, {"author": "thedefivillain", "summary": "Notes that when a crime coin liquidates this hard, other tickers get dragged down too since the liquidated traders typically held shorts across multiple contracts.", "tweet_url": "https://x.com/thedefivillain/status/2101628198173733212", "images": ["https://pbs.twimg.com/media/HSp7sVZWoAEB3iQ.jpg"], "type": "tweet"}, {"author": "fejau_inc", "summary": "Says he'd be terrified if still holding AI-bottleneck trades, having sold heavily back in June/July; thedefivillain agrees in reply that the time to be scared of that trade was months ago, not now.", "tweet_url": "https://x.com/fejau_inc/status/2101696369807544577", "images": [], "type": "thread"}]}, {"cluster": "Fed/GSE Policy — MBS Purchases Reignite Debate", "category": ["macro", "regulation"], "items": [{"author": "dampedspring", "summary": "Calls out Treasury Secretary Bessent as hypocritical over Bill Pulte's plan to ramp Fannie/Freddie MBS purchases after holdings fell three straight months, then argues that \"fixing\" duration risk by having GSEs ride the curve on the taxpayer's dime is its own bad outcome.", "tweet_url": "https://x.com/dampedspring/status/2101632578998485041", "images": [], "type": "thread"}]}, {"cluster": "Fed Meeting Aftermath — Weekly Macro Roundups", "category": ["macro"], "items": [{"author": "elerianm", "summary": "A \"calming\" Fed meeting last week is now colliding with a rebound in sovereign yields, rising energy pressure, the Trump-Xi summit on the UNGA sidelines, an extensive data calendar and returning Fedspeak - full breakdown linked on Substack/LinkedIn.", "tweet_url": "https://x.com/elerianm/status/2101660995596746902", "images": ["https://pbs.twimg.com/media/HSqZgasXAAASxH0.jpg"], "type": "tweet"}, {"author": "BobEUnlimited", "summary": "BoJ and BoE both stayed cautious this week, continuing developed-market central banks' pattern of restraint despite the ongoing global inflation shock.", "tweet_url": "https://x.com/BobEUnlimited/status/2101616113918345624", "images": [], "type": "tweet"}, {"author": "qthomp", "summary": "\"Scouting the Tape #33\" covers the FOMC reaction, the bond market, and charts currently drawing his attention (link-only, full read in Link Queue).", "tweet_url": "https://x.com/qthomp/status/2101653098922160596", "images": [], "type": "tweet"}]}, {"cluster": "AI/Geopolitical Doom-Fatigue Pushback", "category": ["society", "geopolitics"], "items": [{"author": "mert", "summary": "Warns against getting \"psyop'd\" into thinking the world is ending over WWIII, AI or oil - argues the algorithm plus \"desperate click-addicts\" make everything look worse than it is, and urges optimism.", "tweet_url": "https://x.com/mert/status/2101691031867609407", "images": [], "type": "thread"}, {"author": "_tolks", "summary": "Complementary view: last Saturday was \"AI doom,\" this Saturday is \"imminent WWIII doom\" - begs followers to watch football and have a drink instead of doom-scrolling a personal-bubble panic.", "tweet_url": "https://x.com/_tolks/status/2101657613112836261", "images": ["https://pbs.twimg.com/tweet_video_thumb/HSq71WyWEAA74wA.jpg"], "type": "thread"}, {"author": "Fiskantes", "summary": "Reacting to a viral \"Professor Jiang\" clip dismissing AI as fake/human-operated from India, floats a 50% chance the professor is a CCP-linked psyop targeting Western AI confidence and a 50% chance he's just a clout-chasing crank.", "tweet_url": "https://x.com/Fiskantes/status/2101717675843956847", "images": [], "type": "tweet"}]}], "B_insights": [{"author": "sjdedic", "summary": "Argues tokenized equities today are exactly where stablecoins were in 2019: PMF is here, growth is still in its first few billion, and an easy 100x remains ahead. Unlike stablecoins, which fought years of regulatory hostility before the GENIUS Act finally landed years after PMF, tokenized equities already have institutional interest plus a tailwind - the SEC's just-issued Innovation Exemption explicitly allowing tokenized stocks to trade on-chain. Conclusion: same asymmetric setup as stablecoins in 2019, moving much faster this time.", "tweet_url": "https://x.com/sjdedic/status/2101719465268261174", "images": ["https://pbs.twimg.com/media/HSrOqnzXoAAnWMv.jpg", "https://pbs.twimg.com/media/HSrOqnhXEAALa21.jpg"], "type": "thread"}, {"author": "sjdedic", "summary": "Says crypto investing has never been easier: with actual on-chain businesses now generating real revenue, it's no longer an insider's narrative-trading game (like memecoins still are) but a numbers-on-a-screen exercise across maybe 2-3 dozen projects worth watching - paired with institutional inflows and pro-crypto regulation for a secular decade-long setup.", "tweet_url": "https://x.com/sjdedic/status/2101677426187145656", "images": [], "type": "tweet"}, {"author": "jvisserlabs", "summary": "Argues the market gave every excuse to panic this week (AI extinction headlines, surging oil, 10-year yields near 2007 levels, a hawkish Fed) yet the S&P barely moved while his 46-name crypto ecosystem index hit new highs. His thesis: crypto spent 16 years building rails before its real users - AI agents, not humans - arrived, and \"the ghost city is starting to fill.\" Teases a three-part research/video series launching this week (M2 money-to-wealth shift, \"Ghost Rails\" on AI agents, and a \"Why Now\" video) making the case for the AI-crypto-macro nexus.", "tweet_url": "https://x.com/jvisserlabs/status/2101650080906555414", "images": ["https://pbs.twimg.com/media/HSkcVgQXEAAwRVS.jpg"], "type": "tweet"}, {"author": "nicbstme", "summary": "Draws a parallel between software engineers' 2024 five-stages-of-grief reaction to AI coding (denial through acceptance) and San Francisco Uber drivers now saying Waymo shouldn't be scaling this fast - arguing humans are structurally bad at processing exponentials and every field will hit this same terrifying realization in turn. Separately quotes Schumpe // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
</body>
</html>
