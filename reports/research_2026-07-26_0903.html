{ id:23, cat:"labor", urgency:"deep", source:"The Dark Side of the Boom / Apollo (Torsten Slok) — The Mess Is Your Moat",
  title:"The 'autonomy threshold': AI eats clean jobs, not messy ones",
  idea:"A framework from Luis Gariçano's team (surfaced via Apollo's Torsten Slok) argues AI capability and job displacement don't move together linearly — they're separated by an 'autonomy threshold' that rises sharply with task 'messiness.' Single-task, verifiable jobs (coding, translation, contract drafting) sit well below the threshold and are already being automated; jobs requiring management of a 'nexus of human relationships' — negotiating permits, coordinating teams, managing organizational conflict — resist automation as a permanent structural feature, not a temporary capability gap.",
  angle:"Reframes the entire 'which jobs are safe from AI' debate around relational complexity rather than intelligence or credentials — a genuinely new lens most market commentary hasn't caught up to.",
  tweetA:"The framework nobody's using yet: AI doesn't eat jobs by how smart they are, it eats them by how MESSY they are. Freelance writing/coding job posts fell 21% within 8 months of ChatGPT. Jobs requiring 'someone to hold the coalition together' haven't moved at all — and won't, no matter how good the models get.",
  tweetB:"Boris Cherny, who built Claude Code, said the quiet part in February: 'someone has to prompt the Claudes, coordinate with teams, decide what to build next.' Not a hedge on his own product — that's the actual moat. Coordination is the scarce resource now, not code.",
  charts:{count:0, hot:true, desc:"Article contains a figure plotting AI capability vs. task messiness with the autonomy-threshold curve — genuinely worth opening."},
  link:"https://thedarksideoftheboom.substack.com/p/the-mess-is-your-moat" },

{ id:24, cat:"labor", urgency:"deep", source:"The Dark Side of the Boom / Apollo (Torsten Slok) — The Mess Is Your Moat",
  title:"Two AI precedents point opposite directions on wages",
  idea:"The Industrial Revolution (power loom, 1784) eventually raised real wages for all workers, doubling them by 1900 — after 60 years of stagnation — because machines complemented every worker and capital was reproducible while labor was scarce. The IT revolution (PCs, 1980s) instead nearly doubled the college wage premium by 2020, because computers complemented only workers with the cognitive skills to use them, producing labor-market polarization instead of broad gains.",
  angle:"Which precedent AI follows determines whether the next decade looks like shared prosperity or accelerated polarization — the honest answer is 'it depends which tasks stay below the autonomy threshold,' not yet knowable in aggregate.",
  tweetA:"Two machines, two completely different labor outcomes. The power loom eventually doubled real wages for everyone by 1900. The PC nearly doubled the college wage premium by 2020 and left everyone else behind. AI could be either — it depends entirely on which jobs stay 'messy' enough to resist automation.",
  tweetB:"60 years. That's how long it took the Industrial Revolution to go from 'weavers facing ruin' to 'wages doubled for everyone.' If AI is even remotely on that timeline, anyone extrapolating from the next two years of displacement data is reading a signal that won't resolve in their own career.",
  charts:{count:0, hot:false, desc:""},
  link:"https://thedarksideoftheboom.substack.com/p/the-mess-is-your-moat" },

{ id:26, cat:"labor", urgency:"watch", source:"The Dark Side of the Boom / Apollo (Torsten Slok) — The Mess Is Your Moat",
  title:"Satiation vs. Jevons: will cheap AI cognition create more jobs or fewer?",
  idea:"The framework offers two historical analogues for what happens to employment when a cognitive input gets radically cheaper. Lighting costs fell 40,000x over 150 years, but humans didn't demand 40,000x more light — they redirected spending elsewhere, and the illumination industry became economically irrelevant ('satiation'). Spreadsheets automated the arithmetic of financial analysis in the 1980s, and instead of destroying analyst jobs, demand for financial modeling exploded because firms could ask questions they'd never bothered to consider before ('Jevons effect').",
  angle:"Whether AI-driven cognitive labor collapses (satiation, like lighting/farming) or explodes (Jevons, like spreadsheets) is the single biggest open variable in the AI-jobs debate, and it's sector-specific, not universal.",
  tweetA:"Cheap light didn't create 40,000x more lighting jobs — it made the whole category economically irrelevant. Cheap spreadsheet math did the opposite: it exploded demand for financial analysts. AI cognition is about to run this exact experiment across every white-collar sector simultaneously, and nobody knows in advance which side any given job falls on.",
  tweetB:"Farming went from 40% of US employment to 1.2% — fewer people than pet care — even as output soared, because demand for food is finite. Nobody's asked yet: is legal work more like farming (satiable) or financial analysis (insatiable, Jevons)? That question is worth more than any AI earnings call this quarter.",
  charts:{count:0, hot:false, desc:""},
  link:"https://thedarksideoftheboom.substack.com/p/the-mess-is-your-moat" },

const CAT_META = {
  macro:{label:"MACRO", color:"#e24b4a"},
  credit:{label:"CREDIT", color:"#378add"},
  positioning:{label:"POSITIONING", color:"#ef9f27"},
  ai:{label:"AI/INFRA", color:"#1d9e75"},
  crypto:{label:"CRYPTO", color:"#7f77dd"},
  geopolitics:{label:"GEOPOLITICS", color:"#d85a30"},
  energy:{label:"ENERGY", color:"#f97316"},
  tech:{label:"TECH", color:"#06b6d4"},
  gold:{label:"GOLD", color:"#d4a017"},
  culture:{label:"CULTURE", color:"#ec4899"},
  labor:{label:"LABOR", color:"#8b5cf6"},
  regulation:{label:"REGULATION", color:"#64748b"},
  science:{label:"SCIENCE", color:"#14b8a6"},
  venture:{label:"VENTURE", color:"#84cc16"}
};

const URG_META = {
  act:{label:"🔴 Act Now", emoji:"🔴"},
  deep:{label:"🔵 Deep", emoji:"🔵"},
  watch:{label:"🟡 Watch", emoji:"🟡"}
};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;
const openCards = new Set();

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function toggleCard(id){
  if(openCards.has(id)) openCards.delete(id); else openCards.add(id);
  renderCards();
}

function filterCat(cat){
  activeCat = cat;
  activeSrc = null;
  renderAll();
}
function filterUrgency(urg){
  activeUrg = urg;
  activeSrc = null;
  renderAll();
}
function filterBySrc(name){
  activeSrc = name;
  activeCat = "all";
  activeUrg = "all";
  openCards.clear();
  ITEMS.forEach(function(it){
    if(it.source.indexOf(name) !== -1) openCards.add(it.id);
  });
  renderAll();
}

function visibleItems(){
  return ITEMS.filter(function(it){
    if(activeCat !== "all" && it.cat !== activeCat) return false;
    if(activeUrg !== "all" && it.urgency !== activeUrg) return false;
    if(activeSrc && it.source.indexOf(activeSrc) === -1) return false;
    return true;
  });
}

function renderFilterBars(){
  const catCounts = {};
  const urgCounts = {};
  ITEMS.forEach(function(it){
    catCounts[it.cat] = (catCounts[it.cat]||0)+1;
    urgCounts[it.urgency] = (urgCounts[it.urgency]||0)+1;
  });

  const catBar = document.getElementById("catBar");
  let catHtml = '<span class="pill' + (activeCat==="all"?" active":"") + '" style="' + (activeCat==="all"?"background:#333;":"") + '" onclick="filterCat(\'all\')">All <span class="cnt">' + ITEMS.length + '</span></span>';
  Object.keys(CAT_META).forEach(function(key){
    if(!catCounts[key]) return;
    const m = CAT_META[key];
    const isActive = activeCat === key;
    catHtml += '<span class="pill' + (isActive?" active":"") + '" style="' + (isActive?("background:"+m.color+";"):"") + '" onclick="filterCat(\'' + key + '\')">' + m.label + ' <span class="cnt">' + catCounts[key] + '</span></span>';
  });
  catBar.innerHTML = catHtml;

  const urgBar = document.getElementById("urgBar");
  let urgHtml = '<span class="pill' + (activeUrg==="all"?" active":"") + '" style="' + (activeUrg==="all"?"background:#333;":"") + '" onclick="filterUrgency(\'all\')">All <span class="cnt">' + ITEMS.length + '</span></span>';
  Object.keys(URG_META).forEach(function(key){
    if(!urgCounts[key]) return;
    const m = URG_META[key];
    const isActive = activeUrg === key;
    urgHtml += '<span class="pill' + (isActive?" active":"") + '" style="' + (isActive?"background:#555;":"") + '" onclick="filterUrgency(\'' + key + '\')">' + m.label + ' <span class="cnt">' + urgCounts[key] + '</span></span>';
  });
  urgBar.innerHTML = urgHtml;
}

function renderCards(){
  const container = document.getElementById("cards");
  const items = visibleItems();
  let html = "";
  items.forEach(function(it, idx){
    const cm = CAT_META[it.cat] || {label:it.cat.toUpperCase(), color:"#888"};
    const um = URG_META[it.urgency] || {emoji:""};
    const isOpen = openCards.has(it.id);
    const chartFlag = it.charts.hot ? '🔥' : (it.charts.count > 0 ? '📊' : '');
    html += '<div class="card">';
    html += '<div class="card-head" onclick="toggleCard(' + it.id + ')">';
    html += '<span class="idx">' + String(idx+1).padStart(2,'0') + '</span>';
    html += '<span class="urg-emoji">' + um.emoji + '</span>';
    html += '<span class="badge" style="background:' + cm.color + '">' + esc(it.source) + '</span>';
    html += '<span class="tag">' + cm.label + '</span>';
    if(chartFlag) html += '<span class="chart-flag">' + chartFlag + '</span>';
    html += '<span class="card-title">' + esc(it.title) + '</span>';
    html += '</div>';
    html += '<div class="card-body' + (isOpen?' open':'') + '">';
    html += '<div class="block-label">The Idea</div><div class="idea-text">' + esc(it.idea) + '</div>';
    html += '<div class="block-label">My Angle</div><div class="angle-box" style="--catcolor:' + cm.color + '">' + esc(it.angle) + '</div>';
    html += '<div class="block-label">Tweets</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet-box"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + esc(it.tweetA) + '</div><button class="copy-btn" onclick="copyTweet(' + it.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet-box"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + esc(it.tweetB) + '</div><button class="copy-btn" onclick="copyTweet(' + it.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';
    if(it.charts.desc){
      html += '<div class="charts-row' + (it.charts.hot?' hot':'') + '">' + (it.charts.hot?'🔥 CHART WORTH SAVING — ':'📊 ') + esc(it.charts.desc) + '</div>';
    }
    html += '<div class="link-row"><a href="' + esc(it.link) + '" target="_blank">↗ Read full article</a></div>';
    html += '</div>';
    html += '</div>';
  });
  if(items.length === 0){
    html = '<p style="color:#999; text-align:center; padding:30px 0;">No items match this filter.</p>';
  }
  container.innerHTML = html;
}

function renderHeader(){
  document.getElementById("headerMeta").textContent =
    META.date + " · " + META.time + " · " + META.itemsExtracted + " items from " + META.includedSources.length + " sources";
}

function renderReport(){
  let html = "";
  html += '<h4>Time Window</h4><div>' + esc(META.windowStart) + ' → ' + esc(META.windowEnd) + ' (strict 6-hour cutoff; emails outside this window were not processed)</div>';
  html += '<h4>Coverage</h4><div>' + META.emailsInWindow + ' emails in window · ' + META.emailsRead + ' read in full · ' + META.itemsExtracted + ' items extracted</div>';
  html += '<h4>Included Sources (click to filter)</h4><ul class="src-list">';
  META.includedSources.forEach(function(s){
    html += '<li><a class="src-item" onclick="filterBySrc(\'' + s.name.replace(/'/g, "\\'") + '\')">' + esc(s.name) + '</a> — ' + s.count + ' item' + (s.count===1?'':'s') + '</li>';
  });
  html += '</ul>';
  html += '<h4>Skipped Sources</h4><ul class="src-list">';
  META.skippedSources.forEach(function(s){
    html += '<li>' + esc(s.name) + '</li>';
  });
  html += '</ul>';
  document.getElementById("reportBody").innerHTML = html;
}

function renderAll(){
  renderFilterBars();
  renderCards();
}

document.getElementById("reportToggle").addEventListener("click", function(){
  const body = document.getElementById("reportBody");
  const chev = document.getElementById("reportChevron");
  body.classList.toggle("open");
  chev.textContent = body.classList.contains("open") ? "▴" : "▾";
});

renderHeader();
renderAll();
renderReport();
</script>
