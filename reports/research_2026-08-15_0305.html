function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function nl2br(s){return esc(s).replace(/\n/g,"<br>");}

const CAT_COLORS = {macro:"#e24b4a",credit:"#378add",positioning:"#ef9f27","AI/infra":"#1d9e75",crypto:"#7f77dd",geopolitics:"#d85a30",energy:"#f97316",tech:"#06b6d4",gold:"#d4a017",culture:"#ec4899",labor:"#8b5cf6",regulation:"#64748b",science:"#14b8a6",venture:"#84cc16"};
const URG_META = {act:{emoji:"🔴",label:"Act Now"},deep:{emoji:"🔵",label:"Deep"},watch:{emoji:"🟡",label:"Watch"}};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function catCounts(){
  const m = {};
  ITEMS.forEach(i=>{m[i.cat]=(m[i.cat]||0)+1;});
  return m;
}
function urgCounts(){
  const m = {};
  ITEMS.forEach(i=>{m[i.urgency]=(m[i.urgency]||0)+1;});
  return m;
}

function renderFilters(){
  const cc = catCounts();
  const cats = Object.keys(CAT_COLORS).filter(c=>cc[c]);
  let html = '<button class="pill'+(activeCat==="all"?" active":"")+'" style="'+(activeCat==="all"?"background:#333;":"")+'" data-cat="all">All <span class="count">'+ITEMS.length+'</span></button>';
  cats.forEach(c=>{
    const active = activeCat===c;
    html += '<button class="pill'+(active?" active":"")+'" style="'+(active?("background:"+CAT_COLORS[c]+";border-color:"+CAT_COLORS[c]+";"):("color:"+CAT_COLORS[c]+";border-color:"+CAT_COLORS[c]+";"))+'" data-cat="'+c+'">'+c+' <span class="count">'+cc[c]+'</span></button>';
  });
  document.getElementById('catFilters').innerHTML = html;

  const uc = urgCounts();
  const order = ["act","deep","watch"];
  let uhtml = '<button class="pill'+(activeUrg==="all"?" active":"")+'" style="'+(activeUrg==="all"?"background:#333;":"")+'" data-urg="all">All <span class="count">'+ITEMS.length+'</span></button>';
  order.forEach(u=>{
    if(!uc[u]) return;
    const active = activeUrg===u;
    uhtml += '<button class="pill'+(active?" active":"")+'" style="'+(active?"background:#333;border-color:#333;":"")+'" data-urg="'+u+'">'+URG_META[u].emoji+' '+URG_META[u].label+' <span class="count">'+uc[u]+'</span></button>';
  });
  document.getElementById('urgFilters').innerHTML = uhtml;

  document.querySelectorAll('#catFilters .pill').forEach(b=>b.addEventListener('click',function(){
    activeCat = this.getAttribute('data-cat');
    activeSrc = null;
    renderFilters();
    renderCards();
  }));
  document.querySelectorAll('#urgFilters .pill').forEach(b=>b.addEventListener('click',function(){
    activeUrg = this.getAttribute('data-urg');
    activeSrc = null;
    renderFilters();
    renderCards();
  }));
}

function renderCards(expandIds){
  expandIds = expandIds || [];
  const container = document.getElementById('cards');
  let html = '';
  ITEMS.forEach((item, idx) => {
    if(activeCat !== "all" && item.cat !== activeCat) return;
    if(activeUrg !== "all" && item.urgency !== activeUrg) return;
    if(activeSrc && item.source.indexOf(activeSrc) === -1) return;
    const color = CAT_COLORS[item.cat] || "#999";
    const urg = URG_META[item.urgency];
    const openClass = expandIds.indexOf(item.id) !== -1 ? " open" : "";
    const chartFlag = item.charts.hot ? '🔥' : (item.charts.count>0 ? '📊' : '');
    html += '<div class="card'+openClass+'" id="card-'+item.id+'" style="--accent:'+color+'">';
    html += '<div class="card-header" onclick="toggleCard('+item.id+')">';
    html += '<span class="idx">#'+item.id+'</span>';
    html += '<span class="urg">'+urg.emoji+'</span>';
    html += '<span class="badge" style="background:'+color+'">'+esc(item.source.split(" / ")[0].split(" (")[0])+'</span>';
    html += '<span class="cattag">'+esc(item.cat)+'</span>';
    if(chartFlag) html += '<span class="chartflag">'+chartFlag+'</span>';
    html += '<span class="title">'+esc(item.title)+'</span>';
    html += '</div>';
    html += '<div class="card-body">';
    html += '<div class="section-label">The Idea</div><div class="idea">'+nl2br(item.idea)+'</div>';
    html += '<div class="section-label">My Angle</div><div class="angle" style="border-left-color:'+color+';background:'+color+'14;">'+nl2br(item.angle)+'</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet a"><div class="lbl"><span>TWEET A</span><button class="copy-btn" onclick="copyTweet('+item.id+',\'a\')">📋 Copy</button></div><p>'+nl2br(item.tweetA)+'</p></div>';
    html += '<div class="tweet b"><div class="lbl"><span>TWEET B</span><button class="copy-btn" onclick="copyTweet('+item.id+',\'b\')">📋 Copy</button></div><p>'+nl2br(item.tweetB)+'</p></div>';
    html += '</div>';
    if(item.charts.count>0 || item.charts.hot || item.charts.desc){
      html += '<div class="charts-box'+(item.charts.hot?" hot":"")+'">'+(item.charts.hot?'🔥 CHART WORTH SAVING — ':'')+esc(item.charts.desc || (item.charts.count+' chart(s) in original post'))+'</div>';
    }
    html += '<div class="linkrow"><a href="'+esc(item.link)+'" target="_blank" rel="noopener">↗ Read full article</a></div>';
    html += '</div></div>';
  });
  if(!html) html = '<p style="color:var(--text-dim);padding:20px 0;">No items match this filter combination.</p>';
  container.innerHTML = html;
}

function toggleCard(id){
  const el = document.getElementById('card-'+id);
  if(el) el.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function filterBySrc(name){
  activeSrc = name;
  activeCat = "all";
  activeUrg = "all";
  renderFilters();
  const matchIds = ITEMS.filter(i=>i.source.indexOf(name)!==-1).map(i=>i.id);
  renderCards(matchIds);
  document.getElementById('cards').scrollIntoView({behavior:'smooth'});
}

function init(){
  document.getElementById('metaline').textContent = META.date + '  •  ' + META.time + '  •  ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources';
  document.getElementById('windowLine').textContent = META.windowStart + '  →  ' + META.windowEnd + '  (last 6 hours, hard boundary — ' + META.emailsRead + ' of ' + META.emailsInWindow + ' emails in window read in full)';

  let incHtml = '';
  META.includedSources.forEach(s=>{
    incHtml += '<div class="srcline" onclick="filterBySrc(\''+esc(s.name).replace(/'/g,"\\'")+'\')">'+esc(s.name)+' — '+s.count+' item'+(s.count===1?'':'s')+'</div>';
  });
  document.getElementById('includedSources').innerHTML = incHtml;

  let skipHtml = '';
  META.skippedSources.forEach(s=>{
    skipHtml += '<div class="skipline"><strong>'+esc(s.name)+'</strong> — '+esc(s.reason)+'</div>';
  });
  document.getElementById('skippedSources').innerHTML = skipHtml;

  document.getElementById('totalsLine').textContent = META.emailsInWindow + ' emails in window, ' + META.emailsRead + ' read in full, ' + META.itemsExtracted + ' items extracted across ' + META.includedSources.length + ' sources (' + META.skippedSources.length + ' sources skipped as empty/no-content).';

  renderFilters();
  renderCards();
}
init();
</script>
</body>
</html>
