 "Sequoia", "SK Hynix", "Jane Street", "Andreessen Horowitz", "Mamba", "inference", "Taiwan", "San Jose", "Diffusion"], "source_meta": {"author": "", "word_count": 745, "paywalled": false}, "insight_total": 13}, {"record_id": "aabba411ab89ebc4", "source_type": "concepts", "source_name": "Sequoia Arc", "source_url": "https://sequoiacap.com/article/americas-open-model-paradox/", "title": "America’s Open-Model Paradox", "published_date": "2026-07-24", "language": "en", "processed_at": "2026-08-10T18:12:48Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech", "Geopolitics", "Positioning"], "gist": "Chinese open-weight models (Qwen, Kimi, GLM, DeepSeek) have become the default base layer for Western AI builders — Qwen alone went from 1% to 69% of new open-model fine-tunes between January 2024 and February 2026 — because Western labs may lawfully distill from Chinese open weights but are contractually barred from distilling GPT or Claude. Sequoia argues the fix is a legal, metered, audited American 'controlled teacher access' market that sells structured training rights from US frontier labs to verified Western and allied companies, or the West leads the closed frontier while renting the open layer from Beijing.", "themes": [{"theme": "Chinese open weights as default substrate", "insights": [{"claim": "Qwen's share of new open-model fine-tunes and adaptations rose from 1% in January 2024 to 69% by February 2026, according to ATOM's Report.", "speaker": "Sequoia Arc", "type": "data_point", "entities": ["Qwen", "Alibaba", "ATOM"], "conviction": "high", "so_what": "The open-model derivative stack has effectively standardized on Chinese weights in two years; any US 'open model' policy or product bet must be underwritten against that installed base, not against a level playing field.", "quote": "Qwen’s share of new open-model fine-tunes and adaptations rose from 1% in January 2024 to 69% by February 2026 according to ATOM’s Report", "locator": "China increasingly supplies the models", "quote_verified": true}, {"claim": "The majority of American AI startups appear to be using Chinese open weights somewhere in their stack, and the dependence now extends upstream from applications to Western labs themselves.", "speaker": "Sequoia Arc", "type": "thesis", "entities": ["China", "US AI startups", "open-weight models"], "conviction": "high", "so_what": "Diligence question for any AI portfolio company: where in the stack are Chinese weights, and what breaks commercially or in procurement if that becomes restricted or disallowed for defense/regulated buyers.", "quote": "The majority of American AI startups seem to be using Chinese open weights somewhere in their stack.", "locator": "The majority of American AI startups", "quote_verified": true}, {"claim": "Thinking Machines pre-trained its Inkling model independently but used synthetic data generated by Moonshot's Kimi K2.5 to bootstrap supervised fine-tuning — a Western frontier lab lawfully learning from a Chinese open model.", "speaker": "Sequoia Arc", "type": "anecdote", "entities": ["Thinking Machines", "Inkling", "Moonshot", "Kimi K2.5"], "conviction": "high", "so_what": "Concrete proof that Chinese-model dependence has reached the frontier-lab tier, not just the application tier — the strongest single datapoint for the essay's policy ask.", "quote": "Thinking Machines pre-trained Inkling independently, but used synthetic data generated by Moonshot’s Kimi K2.5 to bootstrap its supervised fine-tuning.", "locator": "For example, Thinking Machines pre-trained", "quote_verified": true}, {"claim": "The competitive prize in open models is not model revenue but becoming the substrate on which global enterprises build products, synthetic data, post-training systems, evals, agents and applied AI.", "speaker": "Sequoia Arc", "type": "framework", "entities": ["open-model layer", "enterprise AI", "synthetic data", "agents"], "conviction": "high", "so_what": "Reframes 'open models don't make money' as a category error — value accrues to whoever owns the default base layer, so measure share of derivative fine-tunes, not licensing revenue.", "quote": "The prize is to become the substrate on which global enterprises build and improve digital intelligence.", "locator": "The stakes extend far beyond model revenue", "quote_verified": true}]}, {"theme": "The asymmetric distillation loop", "insights": [{"claim": "Capability today flows from Western frontier models through alleged unauthorized foreign extraction into Chinese open weights and only then into lawful Western post-training, while the direct route from American frontier models to lawful Western post-training is missing.", "speaker": "Sequoia Arc", "type": "framework", "entities": ["frontier labs", "China", "post-training", "distillation"], "conviction": "high", "so_what": "The core mental model of the piece: American IP protection on frontier outputs is currently a subsidy to Chinese open models, because it blocks Americans and not the covert extractor.", "quote": "Western frontier models → alleged unauthorized foreign extraction → Chinese open weights → lawful Western post-training", "locator": "The flow today looks something like this", "quote_verified": true}, {"claim": "A Western lab has a legal path to learn from a Chinese open model while equivalent use of GPT or Claude outputs is prohibited, making the legal asymmetry — not raw capability — the binding constraint.", "speaker": "Sequoia Arc", "type": "contrarian", "entities": ["GPT", "Claude", "OpenAI", "Anthropic", "Chinese open models"], "conviction": "high", "so_what": "Implies terms-of-service enforcement by US labs is strategically self-defeating at the national level; watch for labs or Washington relaxing distillation restrictions for vetted domestic buyers.", "quote": "a Western lab had a legal path to learn from a Chinese open model, while equivalent use of GPT or Claude outputs is prohibited", "locator": "The point is that a Western lab", "quote_verified": true}, {"claim": "Pre-training creates a capable base model while post-training turns it into a useful coding, reasoning, tool-using and agentic system, and a stronger teacher converts part of that expensive discovery process into a cheaper learning problem.", "speaker": "Sequoia Arc", "type": "framework", "entities": ["pre-training", "post-training", "distillation", "agentic systems"], "conviction": "high", "so_what": "Explains why teacher access is worth paying for: it converts capex-heavy R&D discovery into cheap supervised learning, which is where marginal cost curves for open models actually bend.", "quote": "A stronger teacher converts part of that expensive discovery process into a cheaper learning problem.", "locator": "Pre-training creates a capable base model", "quote_verified": true}, {"claim": "Distillation does not explain China's overall open-model lead — Chinese labs have world-class researchers, substantial compute, strong pre-trained models and software-hardware codesign — but it does account for a meaningful share of their advantage specifically over American open models.", "speaker": "Sequoia Arc", "type": "causal", "entities": ["Chinese AI labs", "distillation", "American open models"], "conviction": "medium", "so_what": "A careful hedge: banning distillation alone will not close the gap, so trades premised on export controls or enforcement 'fixing' Chinese open models are likely to disappoint.", "quote": "Even if distillation represents a smaller share of&nbsp; a Chinese model’s total capability, it represents a meaningful share of its advantage over American open models.", "locator": "Distillation does not explain China’s entire", "quote_verified": true}, {"claim": "New enforcement mechanisms will make large-scale distillation harder, slower and more expensive for Chinese companies but will not eliminate distillation backed by state actors, so every Western frontier advance keeps creating another teacher for Chinese labs.", "speaker": "Sequoia Arc", "type": "prediction", "entities": ["enforcement", "state actors", "Chinese labs", "frontier labs"], "conviction": "high", "so_what": "Treat each US frontier release as a forward-dated capability transfer to Chinese open models — the lag between a US frontier launch and a comparable Chinese open release is the metric to track.", "quote": "Every Western frontier advance therefore creates another teacher for Chinese labs.", "locator": "New enforcement mechanisms will make", "quote_verified": true}]}, {"theme": "Open weights are not independence", "insights": [{"claim": "Downloading a Chinese model gives a Western company permanent control over that particular version, but because AI capability is an upgrade cycle, if China stops releasing its strongest models existing Western products will not break — they will fall behind.", "speaker": "Sequoia Arc", "type": "framework", "entities": ["Qwen", "Kimi", "GLM", "DeepSeek", "open weights"], "conviction": "high", "so_what": "Reprices the perceived safety of open weights: the risk is not a service cutoff but silent competitive decay, which is far harder to hedge and shows up in product roadmaps a cycle later.", "quote": "If China stops releasing its strongest models, existing products will not break. They will fall behind.", "locator": "But AI capability is an upgrade cycle", "quote_verified": true}, {"claim": "Reuters reported that Chinese authorities have discussed restricting overseas access to advanced models, including models not yet released, with no final policy announced.", "speaker": "Sequoia Arc", "type": "data_point", "entities": ["Reuters", "China", "export restrictions", "open models"], "conviction": "medium", "so_what": "A live tail risk with an identifiable catalyst: formal Chinese restrictions on open-weight releases would strand Western builders mid-upgrade-cycle and instantly reprice Western open-model efforts.", "quote": "Chinese authorities have discussed restricting overseas access to advanced models, including models that have not yet been released", "locator": "Reuters recently reported that Chinese authorities", "quote_verified": true}, {"claim": "An open-weight model is not an auditable model: weights are the compressed result of training and do not reveal the pre-training corpus, which data was filtered or poisoned, what training interventions were made, or whether rare trigger-dependent behavior was embedded.", "speaker": "Sequoia Arc", "type": "thesis", "entities": ["open weights", "model auditing", "supply-chain risk"], "conviction": "high", "so_what": "Kills the assumption that 'open' equals 'verifiable' — creates a real market for provenance, model-audit and trusted-supply-chain tooling in regulated AI deployments.", "quote": "An open-weight model is not necessarily an auditable model.", "locator": "There is also a more technical security problem", "quote_verified": true}, {"claim": "Possessing model weights cannot prove the absence of a backdoor, and research shows deliberately implanted behavior can survive supervised fine-tuning, reinforcement learning and adversarial training — an acceptable supply-chain risk for many consumer apps but not for defense, intelligence or critical infrastructure.", "speaker": "Sequoia Arc", "type": "causal", "entities": ["Qwen", "Kimi", "defense", "intelligence", "critical infrastructure"], "conviction": "high", "so_what": "Draws the commercial line where a domestic open-model vendor can win: government, defense and critical-infrastructure buyers cannot use Chinese weights at any price, creating a protected addressable market.", "quote": "The point is that possessing the weights cannot prove the absence of one.", "locator": "We are not alleging that Qwen", "quote_verified": true}]}, {"theme": "Proposed American path: priced teacher access", "insights": [{"claim": "Without a domestic legal route to convert American frontier capability into cheaper ownable models, the West may lead at the closed frontier while falling into dependence on China for the open layer.", "speaker": "Sequoia Arc", "type": "thesis", "entities": ["United States", "China", "closed frontier", "open layer"], "conviction": "high", "so_what": "The central bear case: closed-frontier leadership and open-layer dependence can coexist, so US frontier-lab dominance is not evidence the open-model battle is being won.", "quote": "Without a domestic route, the West may lead at the closed frontier while falling into dependence on China for the open layer.", "locator": "American companies need a legal way", "quote_verified": true}, {"claim": "Western base-model efforts including Reflection (building open super-intelligence for enterprises and sovereigns), TML and Nemotron are making strong progress, but stronger pre-training alone does not solve the teacher problem.", "speaker": "Sequoia Arc", "type": "thesis", "entities": ["Reflection", "TML", "Nemotron", "NVIDIA"], "conviction": "medium", "so_what": "Names the specific Western open-model contenders to watch, while warning that funding pre-training alone is an incomplete bet without legal access to frontier teachers.", "quote": "Keep building Western base models: Reflection (building open super-intelligence for enterprises &amp; sovereigns), TML, and Nemotron are making incredible progress.", "locator": "Keep building Western base models", "quote_verified": true}, {"claim": "Frontier labs could sell structured training rights to qualifying Western and allied companies, with access trailing the frontier, covering defined capabilities, limited to verified companies, and metered and audited, while the most sensitive biological and cyber capabilities remain restricted.", "speaker": "Sequoia Arc", "type": "framework", "entities": ["frontier labs", "training rights", "allied companies", "bio and cyber capabilities"], "conviction": "high", "so_what": "A new revenue line for closed frontier labs — licensed distillation rights — and a potential unlock for the entire Western open-model ecosystem; watch for the first lab to offer it commercially.", "quote": "It would create a legal, priced route for capability transfer that sophisticated foreign actors are already pursuing covertly.", "locator": "Create controlled teacher access", "quote_verified": true}, {"claim": "If a voluntary market for teacher access does not develop, such access could eventually be made a condition attached to major federal AI contracts.", "speaker": "Sequoia Arc", "type": "prediction", "entities": ["federal AI contracts", "frontier labs", "US government"], "conviction": "medium", "so_what": "Signals a coercive policy backstop — federal procurement leverage over frontier labs is the escalation path to watch if licensing does not emerge on its own.", "quote": "If a voluntary market does not develop, access could eventually become a condition attached to major federal AI contracts, for example.", "locator": "Keep raising the cost of foreign distillation", "quote_verified": true}, {"claim": "The precedent for permissive capability transfer is training on the open web: had that not been allowed, there would be no leading AI at all, since all the leading labs benefited from copious openly available data.", "speaker": "Sequoia Arc", "type": "contrarian", "entities": ["open web", "training data", "AI labs", "copyright policy"], "conviction": "high", "so_what": "Uses the web-scraping precedent to argue against tightening IP around model outputs — a policy analogy that cuts against the litigation-driven consensus on training data rights.", "quote": "Imagine if we had not allowed for training on the open web. We would have no leading AI at all.", "locator": "Imagine if we had not allowed", "quote_verified": true}]}], "top_entities": ["Qwen", "Kimi", "DeepSeek", "GLM", "Thinking Machines", "Moonshot", "Nemotron", "Reflection", "TML", "Claude", "GPT", "ATOM"], "source_meta": {"author": "", "word_count": 1102, "paywalled": false}, "insight_total": 18}, {"record_id": "b55136279d1260fc", "source_type": "concepts", "source_name": "Sequoia Arc", "source_url": "https://sequoiacap.com/article/partnering-with-bunkerhill-health-ai-agents-that-improve-patient-outcomes/", "title": "Partnering with Bunkerhill Health: AI Agents that Improve Patient Outcomes", "published_date": "2026-07-16", "language": "en", "processed_at": "2026-08-10T12:00:00Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech", "Society"], "gist": "Sequoia's follow-on into Bunkerhill Health argues the binding constraint in healthcare AI is not model quality but the deployment stack around it — data access, validation, FDA clearance and hospital installation — and that the winning product form is a horizontal agent platform (Carebricks) that replaces multiple point-solution vendors, evidenced by UTMB Health scaling from one agent to more than twenty.", "themes": [{"theme": "Healthcare AI's real bottleneck", "insights": [{"claim": "The binding constraint on healthcare AI is not model capability but the surrounding infrastructure — data sourcing, validation, regulatory clearance and hospital installation — which leaves clinically proven algorithms stranded in academic papers.", "speaker": "Sequoia Arc", "type": "thesis", "entities": ["Bunkerhill Health", "healthcare AI", "FDA"], "conviction": "high", "so_what": "Underwrite healthcare-AI startups on distribution and regulatory execution rather than model benchmarks; model quality is not the differentiator that gets paid.", "quote": "the bottleneck in healthcare AI is not the technology, it is everything around it", "locator": "That experience taught Nish something non-obvious", "quote_verified": true}, {"claim": "A Stanford algorithm that estimated a patient's coronary artery calcium score from a routine chest scan — replacing a dedicated, more invasive cardiovascular-risk test — was published in Nature Digital Medicine and then saw no clinical deployment, illustrating the gap between peer-reviewed validation and bedside use.", "speaker": "Sequoia Arc", "type": "anecdote", "entities": ["Stanford", "Nature Digital Medicine", "Nish Khandwala", "coronary artery calcium score"], "conviction": "high", "so_what": "Publication and clinical efficacy are not proxies for commercial traction in medtech AI; the translation layer is where value accrues.", "quote": "The algorithm was good enough to be published in Nature Digital Medicine. And then it went nowhere.", "locator": "Nish did not read about this problem", "quote_verified": true}, {"claim": "Hospitals and health systems that attempt to build their own AI tools or buy narrow vendor point solutions typically stall in experimentation and never reach patient care.", "speaker": "Sequoia Arc", "type": "causal", "entities": ["hospitals", "health systems", "AI vendors"], "conviction": "high", "so_what": "Pilot-to-production conversion — not pilot count — is the metric that separates real healthcare-AI revenue from vaporware in vendor disclosures.", "quote": "they too often stall in experimentation and never reach patient care", "locator": "Hospitals and health systems try to create their own tools", "quote_verified": true}, {"claim": "Healthcare is characterized as a structurally slow and late technology adopter, with researchers blocked by difficulty accessing external data, collaborating across research institutions, and navigating complex regulation.", "speaker": "Sequoia Arc", "type": "framework", "entities": ["healthcare", "researchers", "regulation"], "conviction": "medium", "so_what": "Sales cycles and revenue ramps in health-system software should be modeled as slower than horizontal SaaS, tempering near-term AI adoption forecasts for the sector.", "quote": "Healthcare hasn’t historically been known as a fast or early technology adopter.", "locator": "Healthcare hasn’t historically been known", "quote_verified": true}]}, {"theme": "Platform beats point solution", "insights": [{"claim": "Bunkerhill Health pivoted from shepherding individual algorithms through data sourcing, validation, FDA clearance and hospital installation to a horizontal platform called Carebricks, after finding that health systems lack the time and resources to deploy one-off AI solutions.", "speaker": "Sequoia Arc", "type": "thesis", "entities": ["Bunkerhill Health", "Carebricks", "FDA", "health systems"], "conviction": "high", "so_what": "The per-algorithm regulatory-services model does not scale in hospitals; capital is rotating toward platforms that amortize deployment cost across many use cases.", "quote": "health systems do not have the time or resources to deploy one-off AI solutions", "locator": "But they ran into another problem", "quote_verified": true}, {"claim": "Carebricks lets a health system build and deploy AI agents across clinical, operational and administrative functions from one central platform, with the hospital supplying the ideas and clinical judgment while Bunkerhill converts them into agents.", "speaker": "Sequoia Arc", "type": "framework", "entities": ["Carebricks", "Bunkerhill Health", "AI agents"], "conviction": "high", "so_what": "A division-of-labor model where the customer supplies domain judgment lowers the vendor's per-use-case cost, the key unit economic to test in agent platforms.", "quote": "Health systems bring the ideas and the clinical judgment, and Bunkerhill turns them into agents.", "locator": "So Bunkerhill built Carebricks", "quote_verified": true}, {"claim": "At UTMB Health, Bunkerhill scaled from one agent in production to more than twenty, spreading specialty by specialty as clinicians observed results.", "speaker": "Sequoia Arc", "type": "data_point", "entities": ["UTMB Health", "Bunkerhill Health", "Carebricks"], "conviction": "high", "so_what": "Land-and-expand within a single hospital account is the observable proof of net revenue retention for healthcare agent platforms; watch agents-per-account as the KPI.", "quote": "Bunkerhill rapidly went from one agent in produ // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#059669', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#16a34a', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}

renderReport(REPORT_DATA);
</script>
