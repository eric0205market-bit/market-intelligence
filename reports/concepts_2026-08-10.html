ble allocations and market design demonstrated empirically how markets function in practice, not just in theory, through lab experiments and real-world market design.", "speaker": "a16z crypto editorial", "type": "data_point", "entities": ["Alvin Roth"], "conviction": "low", "so_what": "Market-design theory (stable matching, empirical validation) is directly relevant to designing functioning on-chain marketplaces and matching systems.", "quote": null, "locator": "Al Roth (Stanford University)", "quote_verified": false}]}, {"theme": "Cryptographic primitives that power crypto today", "insights": [{"claim": "RSA public-key cryptography, co-invented by Ron Rivest, Adi Shamir, and Len Adleman, relies on the fact that no efficient algorithm exists yet for factoring very large integers, and remains critical to secure data transmission systems used broadly today.", "speaker": "a16z crypto editorial", "type": "data_point", "entities": ["Ron Rivest", "RSA"], "conviction": "medium", "so_what": "The security assumption behind RSA (factoring hardness) is a specific, falsifiable computational bet — worth tracking against advances in factoring algorithms or quantum computing that could break it.", "quote": "nobody has yet developed an efficient algorithm for factoring very large integers", "locator": "The RSA method, which relies on the fact that", "quote_verified": true}, {"claim": "Shafi Goldwasser's Turing Award-winning work laid the complexity-theoretic foundations for cryptography and pioneered interactive proof systems, which underpin zero-knowledge systems and SNARKs used across blockchains and other industries today.", "speaker": "a16z crypto editorial", "type": "data_point", "entities": ["Shafi Goldwasser", "zero knowledge", "SNARKs"], "conviction": "high", "so_what": "Zero-knowledge/SNARK-based scaling and privacy infrastructure (rollups, private transactions) traces directly to Goldwasser's interactive proof theory — a strong signal of the field's academic depth and durability.", "quote": null, "locator": "Shafi Goldwasser (MIT) won the Turing Award in 2012", "quote_verified": false}, {"claim": "Noam Nisan, with Amir Ronen, coined the term 'algorithmic mechanism design,' combining economics and game theory with computer science techniques to analyze how selfish behavior by users and service providers affects complex computational systems like the internet.", "speaker": "a16z crypto editorial", "type": "framework", "entities": ["Noam Nisan", "mechanism design"], "conviction": "medium", "so_what": "Algorithmic mechanism design is the direct academic lineage of token-incentive and protocol-game-theory design work in crypto — a useful framework for evaluating whether a protocol's incentive structure is adversarially robust.", "quote": null, "locator": "Noam Nisan (Hebrew University of Jerusalem, also Starkware)", "quote_verified": false}]}, {"theme": "Roughgarden's own applied frameworks for crypto economics", "insights": [{"claim": "Tim Roughgarden authored a framework called LVR (loss-versus-rebalancing) to help liquidity providers decide whether and when to provide liquidity to an automated market maker, addressing a core open question in decentralized finance.", "speaker": "a16z crypto editorial", "type": "framework", "entities": ["Tim Roughgarden", "LVR", "automated market maker", "DeFi"], "conviction": "high", "so_what": "LVR is a directly actionable analytical tool for LPs and AMM designers to quantify the cost of providing liquidity versus simply holding/rebalancing — relevant to evaluating AMM protocol economics and LP yield claims.", "quote": null, "locator": "his paper introducing LVR", "quote_verified": false}, {"claim": "Roughgarden has separately published an analysis of Ethereum's transaction fee mechanism design, applying his game-theory and mechanism-design expertise directly to a live blockchain protocol.", "speaker": "a16z crypto editorial", "type": "data_point", "entities": ["Tim Roughgarden", "Ethereum", "mechanism design"], "conviction": "medium", "so_what": "Signals that academic mechanism-design analysis of Ethereum's fee market (e.g., EIP-1559-style design) exists and is treated as serious reference material by a16z crypto's own research lab.", "quote": null, "locator": "his paper analyzing Ethereum's transaction fee mechanism design", "quote_verified": false}]}], "insight_total": 12, "top_entities": ["Tim Roughgarden", "Bitcoin", "Ethereum", "Leslie Lamport", "Barbara Liskov", "Paul Milgrom", "Ron Rivest", "Shafi Goldwasser", "Noam Nisan", "RSA", "LVR", "a16z crypto"], "source_meta": {"author": "a16z crypto editorial", "word_count": 2000, "paywalled": false}}, {"record_id": "757945e2edf2c409", "source_type": "concepts", "source_name": "BCG Henderson Institute", "source_url": "https://www.bcg.com/publications/2026/ai-risk-self-assessments-banking", "title": "How AI Can Transform Risk Self-Assessments in Banking", "published_date": "2026-08-10", "language": "en", "processed_at": "2026-08-10T18:11:13Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Positioning", "Society"], "gist": "BCG argues the 'observability divide' between financial and non-financial risk management is closing, so banks can rebuild the risk and control self-assessment (RCSA) from a backward-looking, judgment-heavy compliance ritual into a scenario-based, AI-driven loss-distribution engine whose outputs map to P&L ownership. The claimed path is a sequenced transformation—minimum viable observability layer around four or five critical processes, pilot in a flagship entity—delivering benefits in roughly 24 months.", "themes": [{"theme": "Observability divide closing", "insights": [{"claim": "Non-financial risks in banks (conduct, compliance, operational, cyber, financial crime, fraud) have historically been managed less rigorously than financial risks because they rely on unstructured data that is not systematically captured, organized, or actively managed.", "speaker": "BCG Henderson Institute", "type": "causal", "entities": ["banks", "non-financial risks", "financial institutions"], "conviction": "high", "so_what": "The bottleneck to better bank op-risk management is data plumbing, not risk theory — favors vendors selling observability and data-capture layers over consulting-only fixes.", "quote": "NFRs tend to rely on unstructured data that is not always systematically captured, organized, or actively managed.", "locator": "Financial institutions often struggle to manage", "quote_verified": true}, {"claim": "The 'observability divide' between financial and non-financial risk management is narrowing, which BCG frames as the enabling condition that makes financial-risk techniques (frequent, data-rich metrics, quantified exposure) transferable to operational and conduct risk.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["data observability", "non-financial risks", "financial risk management"], "conviction": "high", "so_what": "A reusable lens: wherever observability rises, judgment-based processes get replaced by quantified ones — watch for the same displacement in audit, compliance and internal control software budgets.", "quote": "the “observability divide” between the two types of risk management is narrowing", "locator": "Today, however, the “observability divide”", "quote_verified": true}, {"claim": "Banks are already deploying AI-enabled code scanners to identify redundant and near-duplicate controls so those controls can be modified or decommissioned, and using AI on web behavior, mobile app usage, and call-center interactions to model fraud risk in real time.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["AI", "code scanners", "fraud", "banks", "call-center interactions"], "conviction": "high", "so_what": "Concrete live AI use cases in bank risk functions — control-rationalization and real-time fraud modeling are the near-term revenue pools for risk-tech vendors.", "quote": "banks are increasingly using AI-enabled code scanners to identify redundant controls, along with near-duplicates, enabling them to modify or decommission these controls.", "locator": "For example, banks are increasingly using", "quote_verified": true}]}, {"theme": "Why RCSA fails today", "insights": [{"claim": "The risk and control self-assessment, the primary tool banks use to measure non-financial risk, is widely treated as a box-checking compliance exercise with limited effectiveness despite a conceptually sound framework of inherent risk, controls, and residual risk.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": ["RCSA", "banks", "non-financial risks"], "conviction": "high", "so_what": "Implies large embedded spend in bank risk functions is currently producing little decision value — a cost pool exposed to automation.", "quote": "is often considered a box-checking compliance exercise with limited effectiveness", "locator": "Given the lack of a consistent data foundation", "quote_verified": true}, {"claim": "RCSA has three structural flaws: it is backward-looking by design as a point-in-time exercise anchored in limited historical data, it is high-friction and low-value because of manual data collection and spreadsheets, and its outcomes are subjective and inconsistent with responses skewing over-positive and poor comparability across assessment units.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["RCSA", "spreadsheets"], "conviction": "high", "so_what": "A diagnostic checklist for judging any bank's op-risk maturity claims — ask whether assessments are continuous, automated, and comparable across units.", "quote": "responses tend to skew toward the over-positive based on uneven rationale", "locator": "Subjective and Inconsistent Outcomes", "quote_verified": true}]}, {"theme": "Scenario-based top-down redesign", "insights": [{"claim": "Leading institutions are adapting threat-based scenario methodologies long used in cyber risk and operational resilience to turn RCSA into a top-down scenario-based risk prioritization framework supported by a continuous flow of bottom-up control evidence.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["RCSA", "cyber risk", "operational resilience", "scenario analysis"], "conviction": "high", "so_what": "Method transfer from cyber to enterprise op-risk is the design pattern to watch; vendors already selling cyber scenario tooling have an adjacent market.", "quote": "adapting threat-based scenario methodologies—long used in cyber risk and operational resilience—to design a forward-looking RCSA", "locator": "Rethink RCSA from Top to Bottom", "quote_verified": true}, {"claim": "Rather than producing single-point risk scores, the scenario approach combines internal and external loss databases with forward-looking indicators to estimate full loss distributions from event frequency and severity assumptions, yielding interpretable metrics such as percentile losses and zero-loss frequency.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["scenario analysis", "loss distributions", "percentile losses", "zero-loss frequency"], "conviction": "high", "so_what": "This is VaR-style quantification migrating into operational risk — expect op-risk capital debates and disclosure quality to shift toward distributional language.", "quote": "rather than producing single-point scores, the approach estimates loss distributions by simulating outcomes based on event frequency and severity assumptions", "locator": "Scenario analysis combines internal loss databases", "quote_verified": true}, {"claim": "In the redesigned model the bottom-up RCSA is narrowed exclusively to control monitoring by the first line of defense and control testing mostly by the second line, with control design testing shifted from calendar-driven to trigger-based on significant changes.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["first line of defense", "second line of defense", "control testing", "control monitoring"], "conviction": "high", "so_what": "Trigger-based rather than calendar-based testing is the operational tell that a bank has genuinely modernized rather than relabeled its assurance cycle.", "quote": "a mix of trigger-based control design—based on significant changes, as opposed to calendar-driven", "locator": "Control testing entails a mix", "quote_verified": true}, {"claim": "Regulators are signaling openness to more risk-based, efficient RCSA approaches and are actively pushing for a step-up in risk quantification through scenario analysis, giving the redesign regulatory tailwind rather than resistance.", "speaker": "BCG Henderson Institute", "type": "prediction", "entities": ["regulators", "scenario analysis", "RCSA"], "conviction": "medium", "so_what": "Regulatory permission is the gating variable for adoption; if supervisors formalize this, bank spend on risk quantification tooling accelerates.", "quote": "increasingly resonates with regulators, who are signaling their openness to more risk-based, efficient RCSA approaches", "locator": "The scenario-based approach is gaining momentum", "quote_verified": true}]}, {"theme": "AI roles across the risk process", "insights": [{"claim": "AI can mine a bank's archive of past risk self-assessments to uncover hidden connections and patterns, map process boundaries, and generate consistent taxonomies for risks and controls so all parties use the same terms for the same risks.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": ["AI", "RCSA", "risk taxonomies"], "conviction": "high", "so_what": "Legacy assessment archives become a proprietary training asset — a differentiator large incumbents have and challengers do not.", "quote": "AI can analyze past RCSAs to uncover previously hidden connections and patterns, map process boundaries, and diagram consistent taxonomies for risks and process controls.", "locator": "Risk Prioritization", "quote_verified": true}, {"claim": "AI can propose risk and control ratings from observable data such as control performance, incidents, losses and risk events rather than relying on self-assessment alone, and AI-assisted calibration lets risk owners anchor judgments to benchmarks, reducing bias and overconfidence.", "speaker": "BCG Henderson Institute", "type": "causal", "entities": ["AI", "risk ratings", "risk owners"], "conviction": "high", "so_what": "Debiasing self-reported risk ratings is the mechanism that converts RCSA from advocacy into evidence — the single highest-leverage change in the whole redesign.", "quote": null, "locator": "In risk and control assessment, AI can propose", "quote_verified": false}, {"claim": "AI is proposed as an independent 'guardian' or risk challenger that compares current assessments against internal patterns, historical events, peer benchmarks and external data to flag outlier assumptions and unusually optimistic ratings before outputs are finalized.", "speaker": "BCG Henderson Institute", "type": "thesis", "entities": ["AI", "peer benchmarks", "RCSA"], "conviction": "medium", "so_what": "Positions AI in an assurance/challenge role rather than pure automation — a governance precedent that regulators will have to bless before it scales.", "quote": "AI flags outlier assumptions, inconsistencies, and unusually optimistic ratings before outputs are finalized", "locator": "Independent Risk Challenger", "quote_verified": true}, {"claim": "Agentic RCSA models are envisaged both as dialogue-based assistants helping first-line risk owners refine inputs and prepare for challenge sessions, and as a workflow orchestrator that triggers each assessment step as needed.", "speaker": "BCG Henderson Institute", "type": "prediction", "entities": ["agentic AI", "RCSA", "first-line risk owners"], "conviction": "medium", "so_what": "Concrete enterprise agentic use case in a regulated function — orchestration plus copilot, a template for agent deployment in compliance workflows.", "quote": null, "locator": "RCSA Agentic Support", "quote_verified": false}]}, {"theme": "Outputs tied to P&L", "insights": [{"claim": "Redesigned RCSA outputs should be expressed as outcome-oriented metrics such as 'expected loss' instead of abstract risk scores, and mapped to P&L ownership and the organizational hierarchy so each P&L owner sees the expected loss attributable to their risks.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["expected loss", "P&L", "RCSA"], "conviction": "high", "so_what": "Attaching op-risk to P&L ownership changes incentives — it is the structural fix that makes business leaders care about control quality.", "quote": "RCSA outputs can now be expressed in clear, outcome-oriented terms such as “expected loss,” as opposed to abstract risk scores.", "locator": "Clear, Relevant Outputs", "quote_verified": true}, {"claim": "The process should be applied proportionately rather than one-size-fits-all: large flagship legal entities run the full RCSA while smaller units leverage group results and run the full process only for risks deemed severe or expected to deviate from group results, where regulation permits.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["legal entities", "RCSA", "regulation"], "conviction": "medium", "so_what": "Proportionality is where the cost savings actually land — but it is explicitly conditional on local regulatory permission, a real adoption constraint.", "quote": "where allowed by regulation", "locator": "A Proportionate RCSA Process", "quote_verified": true}, {"claim": "BCG reports from client work that the redesign delivers a significant reduction in risk management execution costs through automation and risk-based prioritization, more effective deployment of control investments, and better strategic decisions from quantified forward-looking risk insights linked to P&L impact.", "speaker": "BCG Henderson Institute", "type": "data_point", "entities": ["BCG", "P&L", "risk management execution costs"], "conviction": "medium", "so_what": "Benefits are stated qualitatively with no quantified cost-saving percentage — treat the ROI case as unproven until banks disclose numbers.", "quote": "A significant reduction in risk management execution costs through automation and risk-based prioritization", "locator": "In our work with clients, we have seen", "quote_verified": true}]}, {"theme": "Implementation sequencing and timeline", "insights": [{"claim": "The recommended rollout is explicitly not a Big Bang redesign: build a minimum viable observability layer of system logs, transactions, control testing results, incident data and audit findings around just four or five critical business processes, starting with a small number of non-financial risks that could meaningfully move the P&L, and pilot in a flagship or complex entity before scaling with explicit adoption thresholds.", "speaker": "BCG Henderson Institute", "type": "framework", "entities": ["observability layer", "system logs", "audit findings", "P&L"], "conviction": "high", "so_what": "A specific, testable scoping rule — four or five processes — that lets an investor or board judge whether a bank's risk-transformation program is credibly scoped.", "quote": "banks should build a minimum viable observability layer (system logs, transactions, control testing results, incident data, audit findings) around four or five critical business processes", "locator": "The New RCSA: Making It Happen", "quote_verified": true}, {"claim": "BCG predicts financial institutions following this stepwise approach can access the benefits of a revitalized risk self-assessment process within roughly 24 months, turning it from a periodic standalone certification exercise into a living platform embedded in day-to-day management.", "speaker": "BCG Henderson Institute", "type": "prediction", "entities": ["BCG", "financial institutions", "RCSA"], "conviction": "medium", "so_what": "A concrete 24-month payback horizon to hold bank risk-transformation programs against; slippage beyond it signals data-foundation problems rather than method problems.", "quote": "financial institutions can access the benefits of a revitalized RCSA within roughly 24 months", "locator": "With this stepwise, measured approach", "quote_verified": true}]}], "insight_total": 18, "top_entities": ["RCSA", "AI", "NFR", "scenario analysis", "regulators", "banks", "financial institutions", "P&L", "expected loss", "cyber risk", "fraud", "control testing"], "source_meta": {"author": "https://www.bcg.com/about/people/experts/matteo-coppola", "word_count": 1929, "paywalled": false}}, {"record_id": "284ffae5f9a6653e", "source_type": "concepts", "source_name": "Gavekal Research", "source_url": "https://research.gavekal.com/teaser/the-offshore-tax-grab/", "title": "The Offshore Tax Grab", "published_date": "2026-08-10", "language": "en", "processed_at": "2026-08-10T12:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Geopolitics", "Society"], "gist": "Chinese local tax bureaus are mass-texting residents 'friendly reminders' to declare offshore investment income, signalling that decades of lax enforcement of the long-standing 20% tax on interest, dividends and asset-sale gains is ending. Gavekal argues the campaign is revenue-driven and goes beyond enforcing existing rules to overturn long-accepted tax practices used by high-income households.", "themes": [{"theme": "Enforcement regime shift", "insights": [{"claim": "Local tax bureaus across China have in recent months sent text messages telling residents they must declare and pay tax on all income from offshore assets, a mass-notification tactic documented in numerous social-media posts.", "speaker": "Gavekal Research", "type": "data_point", "entities": ["China", "local tax bureaus", "offshore assets"], "conviction": "high", "so_what": "A broad retail-level notification campaign, not nside China or abroad, but the tax has rarely been enforced on offshore investment income.", "speaker": "Gavekal Research", "type": "data_point", "entities": ["China", "income-tax law"], "conviction": "high", "so_what": "The 20% statutory rate is the ceiling investors should now model for Chinese residents' offshore portfolio income; no new legislation is needed for the hit to land.", "quote": "to pay a 20% tax on interest, dividends and gains from asset sales, regardless of whether the income is inside China or abroad", "locator": "China’s income-tax law has for decades", "quote_verified": true}, {"claim": "Several exemptions mean Chinese individuals also pay little tax on domestic investment income, so the gap between statutory rates and actual collections extends beyond offshore assets.", "speaker": "Gavekal Research", "type": "framework", "entities": ["China", "domestic investment income"], "conviction": "medium", "so_what": "Watch for exemptions on onshore investment income to be narrowed next; that would be a direct headwind for domestic A-share and wealth-management demand.", "quote": null, "locator": "several exemptions mean that individuals pay little tax", "quote_verified": false}]}, {"theme": "Fiscal motive and targeting of the wealthy", "insights": [{"claim": "The tightening of tax enforcement is driven by authorities' need to boost revenue and to squeeze the common tax dodges used by high-income households.", "speaker": "Gavekal Research", "type": "causal", "entities": ["China", "tax authorities", "high-income households"], "conviction": "high", "so_what": "Fiscal stress, not ideology alone, is the driver, so the campaign is likely to persist and broaden while local government revenues stay weak.", "quote": "enforcement is tightening up as the tax authorities work to boost revenue and squeeze the common tax dodges used by high-income households", "locator": "Now, it’s clear that enforcement is tightening up", "quote_verified": true}, {"claim": "The shif of the Russia-Ukraine war ended OECD government bonds' status as the default store-of-value reserve asset for non-Western countries and accelerated the gold bull market.", "speaker": "Gavekal Research", "type": "causal", "entities": ["Russia", "Ukraine", "OECD", "gold", "central banks"], "conviction": "high", "so_what": "The bid for gold is a structural sanctions-risk hedge by non-Western reserve managers, not a cyclical trade — it persists as long as the confiscation precedent stands.", "quote": "Suddenly, OECD government bonds stopped being the default “store of value” reserve asset for non-Western countries.", "locator": "The start of the Russia-Ukraine war", "quote_verified": true}, {"claim": "Central banks as a group flipped from being marginal sellers of gold to massive buyers, purchasing more than a thousand tonnes each year between 2023 and 2025.", "speaker": "Gavekal Research", "type": "data_point", "entities": ["central banks", "gold"], "conviction": "high", "so_what": "Track quarterly official-sector gold purchase data — a slowdown below the ~1,000 tonne run-rate removes the largest source of marginal demand underpinning the price.", "quote": "Between 2023 and 2025, central banks as a group purchased more than a thousand tonnes of gold each year.", "locator": "As an aggregate, central banks switched", "quote_verified": true}, {"claim": "Annual global gold production hovers around 3,500-3,700 tonnes, meaning official-sector buying of over a thousand tonnes a year absorbed close to a third of new supply in a price-insensitive way.", "speaker": "Gavekal Research", "type": "framework", "entities": ["gold", "central banks"], "conviction": "high", "so_what": "Sizing marginal demand against fixed mine supply is the cleanest way to judge how much of the gold move is structural versus speculative, and how much downside there is if the buyer steps back.", "quote": "Given that annual global production hovers around 3,500-3,700 tonnes, this price-insensitive, very large, increase in marginal demand had a considerable impact", "locator": "Given that annual global production", "quote_verified": true}]}, {"theme": "The war-equals-gold reflex breaks down", "insights": [{"claim": "Investors reflexively assumed the Iran-US/Israel war would push more money into gold, but gold prices instead promptly fell by US$1,200 an ounce.", "speaker": "Gavekal Research", "type": "contrarian", "entities": ["Iran", "United States", "Israel", "gold"], "conviction": "high", "so_what": "Geopolitical escalation is no longer a reliable long-gold catalyst; buying conflict headlines in bullion has become a losing reflex worth fading.", "quote": "the initial gut reaction of many investors was to assume that another war would equate to even more money flowing into gold. Instead, gold prices promptly lost US$1,200 an ounce", "locator": "So when the Iran-US/Israel war rolled around", "quote_verified": true}, {"claim": "Silver and platinum prices have roughly halved since their January 2026 peaks, a more brutal decline than gold's.", "speaker": "Gavekal Research", "type": "data_point", "entities": ["silver", "platinum", "gold"], "conviction": "high", "so_what": "The higher-beta precious metals took the larger drawdown, so any re-entry into the complex should be sized for that leverage — and miners levered to silver/platinum carry the same asymmetry.", "quote": "The declines in silver and platinum (the prices in both metals have roughly halved since their January 2026 peaks) have been even more brutal", "locator": "The declines in silver and platinum", "quote_verified": true}, {"claim": "The precious metals complex now presents a quandary in which the structural, sanctions-driven central bank bid coexists with a sharp price collapse across gold, silver and platinum, implying the drivers of the bull market and the drivers of the recent drawdown are different forces.", "speaker": "Gavekal Research", "type": "thesis", "entities": ["gold", "silver", "platinum", "cen growth and positive rates; a slide back toward deflation or zero rates would remove the engine behind the outperformance.", "quote": "an acceleration in earnings and returns on equity compared with the US bank sector as Europe emerged from the deflationary overhang of the 2010s, with nominal growth and interest rates both rising", "locator": "The relative performance of European bank stocks began", "quote_verified": true}]}, {"theme": "Sentiment lag and the value-trap discount", "insights": [{"claim": "Even as European bank earnings accelerated, investor expectations that the sector would remain a value trap caused it to derate over 2022-23 both against its own history and relative to US banks.", "speaker": "Gavekal Research", "type": "causal", "entities": ["European banks", "US banks"], "conviction": "high", "so_what": "Improving fundamentals were absorbed by falling multiples, so the unwind of that sentiment discount is the specific source of future returns to monitor.", "quote": "Expectations that European banks would remain a value trap meant that over 2022-23 the sector continued to derate both against its own historical record and relative to US banks", "locator": "But the wilderness years cast a long shadow", "quote_verified": true}, {"claim": "Gavekal frames the European bank story as one where a long period of poor performance leaves a sentiment overhang that suppresses multiples well after the underlying earnings have inflected, creating a lag investors can exploit.", "speaker": "Gavekal Research", "type": "framework", "entities": ["European banks"], "conviction": "medium", "so_what": "Applies beyond banks: screen for sectors where returns on equity have already turned but the multiple still reflects the previous regime.", "quote": "But the wilderness years cast a long shadow.", "locator": "But the wilderness years cast a long shadow", "quote_verified": true}]}], "top_entities": ["European banks", "US banks", "Europe", "US bank sector", "returns on equity", "Gavekal Research"], "source_meta": {"author": "", "word_count": 213, "paywalled": false}, "insight_total": 6}, {"record_id": "8632e4431fdd42ee", "source_type": "concepts", "source_name": "NY Fed — Liberty Street Economics", "source_url": "https://libertystreeteconomics.newyorkfed.org/2026/08/stripping-strips-trading-activity/", "title": "Stripping STRIPs Trading Activity - Liberty Street Economics", "published_date": "2026-08-10", "language": "en", "processed_at": "2026-08-10T18:13:46Z", "processor": "claude-code-sub-opus", "tags": ["Macro", "Positioning"], "gist": "NY Fed researchers Fleming and Shachar publish the first detailed breakdown of Treasury STRIPS trading from FINRA TRACE: $560 billion outstanding (2.5 percent of marketable coupon debt), $5.6 billion of daily volume against $739 billion for coupon Treasuries, with 98.1 percent of stripped stock in long bonds and 68 percent of volume in principal STRIPS. Activity is overwhelmingly dealer-to-client (88 percent for principal STRIPS) in large clips that grow with maturity, evidencing liability-driven pension and insurer demand for long duration, while trade counts peak in the 0-5 year bucket.", "themes": [{"theme": "STRIPS market size and composition", "insights": [{"claim": "As of end-June 2025, $560 billion of U.S. Treasury securities were held in stripped (zero-coupon) form, just 2.5 percent of the $22.2 trillion in marketable notes, bonds, and TIPS outstanding.", "speaker": "Michael J. Fleming and Or Shachar", "type": "data_point", "entities": ["U.S. Treasury", "STRIPS", "TIPS", "Treasury Department"], "conviction": "high", "so_what": "Sets the scale of the zero-coupon Treasury complex: small relative to the overall market, so STRIPS flows are a niche but concentrated source of long-duration demand rather than a driver of aggregate Treasury supply.", "quote": "As of the end of June 2025, $560 billion in U.S. Treasury securities were held in stripped form, accounting for 2.5 percent of the $22.2 trillion in marketable notes, bonds", "locator": "Which Securities are Stripped?", "quote_verified": true}, {"claim": "Stripping is overwhelmingly a long-bond phenomenon: bonds account for 98.1 percent of Treasuries held in stripped form, notes 1.9 percent, and TIPS just 0.002 percent, while bills and floating rate notes are ineligible for stripping.", "speaker": "Michael J. Fleming and Or Shachar", "type": "data_point", "entities": ["U.S. Treasury", "TIPS", "STRIPS"], "conviction": "high", "so_what": "Zero-coupon demand is almost entirely a bid for 20-30 year duration; watch the long end, not the belly, for STRIPS-driven flow effects.", "quote": "bonds account for 98.1 percent of Treasuries held in stripped form, notes 1.9 percent, and (TIPS) 0.002 percent", "locator": "Which Securities are Stripped?", "quote_verified": true}, {"claim": "Stripping intensity varies enormously across individual Treasury bonds: the bond maturing on May 15, 2053 was 36 percent stripped, the most of any Treasury security, while the most recently issued bond in the 25-30 year sector was only 7 percent stripped.", "speaker": "Michael J. Fleming and Or Shachar", "type": "data_point", "entities": ["U.S. Treasury", "STRIPS"], "conviction": "high", "so_what": "Security-level stripping percentages flag where liability-driven demand has locked up float; heavily stripped CUSIPs have less freely circulating collateral, a candidate explanation for individual-issue richness and repo specialness.", "quote": "the bond maturing on May 15, 2053 was 36 percent stripped, the most of any Treasury security", "locator": "The prevalence of stripped securities by sector", "quote_verified": true}, {"claim": "Original 20-year Treasury bonds show markedly weaker stripping demand than 30-year bonds, with six issues in the 15-20 year maturity sector carrying no stripped amount at all.", "speaker": "Michael J. Fleming and Or Shachar", "type": "data_point", "entities": ["U.S. Treasury", "STRIPS"], "conviction": "medium", "so_what": "Adds a structural-demand explanation for the persistent cheapness of the 20-year point: liability-driven buyers are not stripping it, so it lacks the zero-coupon bid that supports 30-year issues.", "quote": "In the 15-20 year sector, six bonds were not stripped at all, all of which were originally issued as 20-year bonds.", "locator": "In the 15-20 year sector, six bonds", "quote_verified": true}]}, {"theme": "Stripping vs reconstitution flow", "insights": [{"claim": "Between July 2024 and June 2025, an average of $1,827 million of Treasuries were stripped each day while $1,567 million were reconstituted, leaving net stripping of roughly $260 million per day.", "speaker": "Michael J. Fleming and Or Shachar", "type": "data_point", "entities": ["U.S. Treasury", "STRIPS"], "conviction": "high", "so_what": "Gross two-way flow dwarfs the net change, meaning stripping is an active arbitrage channel rather than one-way accumulation; the gross numbers are the ones to watch for dislocation.", "quote": "on average, $1,827 million in Treasuries were stripped each day from July 2024 to June 2025 and $1,567 million reconstituted", "locator": "The flow of securities stripped by sector", "quote_verified": true}, {"claim": "Reconstitution of a stripped Treasury occurs when demand pushes the whole security's price above the summed price of its individual stripped components, making stripping and reconstitution a price-driven arbitrage loop between coupon bonds and zeros.", "speaker": "Michael J. Fleming and Or Shachar", "type": "framework", "entities": ["U.S. Treasury", "STRIPS"], "conviction": "high", "so_what": "A clean mental model for long-end relative value: the strip/reconstitute boundary caps how far zero-coupon curve pricing can diverge from coupon-bond pricing.", "quote": "Reconstitution may occur because demand for a reconstituted security increases its price above that of its stripped components.", "locator": "Note that components of a stripped Treasury", "quote_verified": true}, {"claim": "The daily flow of Treasuries being stripped by maturity sector is highly correlated with the existing stock of stripped securities, with both stripping and reconstitution concentrated in the long end of the curve.", "speaker": "Michael J. Fleming and Or Shachar", "type": "causal", "entities": ["U.S. Treasury", "STRIPS"], "conviction": "medium", "so_what": "Flow follows stock, so the long-end concentration of zero-coupon demand is structurally persistent rather than a transient positioning artifact.", "quote": null, "locator": "The flow of securities stripped by sector", "quote_verified": false}]}, {"theme": "STRIPS trading volumes", "insights": [{"claim": "Zero-coupon Treasury STRIPS traded an average of $5.6 billion per day from July 2024 to June 2025, versus $739 billion per day for Treasury notes, bonds, and TIPS — under 1 percent of coupon Treasury turnover.", "speaker": "Michael J. Fleming and Or Shachar", "type": "data_point", "entities": ["STRIPS", "U.S. Treasury", "TIPS", "FINRA", "TRACE"], "conviction": "high", "so_what": "Quantifies how thin the zero-coupon market is relative to coupon Treasuries: liquidity, not availability, is the binding size constraint for anyone expressing duration views through STRIPS.", "quote": "Treasury notes, bonds, and TIPS traded $739 billion per day on average from July 2024 to June 2025", "locator": "How Much Do STRIPS Trade?", "quote_verified": true}, {"claim": "Principal STRIPS account for 68 percent ($3,856 million per day) of STRIPS trading volume versus 32 percent ($1,784 million) for coupon STRIPS, even though stripping a 10-year note creates twenty coupon STRIPS for every single principal STRIPS.", "speaker": "Michael J. Fleming and Or Shachar", "type": "data_point", "entities": ["STRIPS", "U.S. Treasury"], "conviction": "high", "so_what": "Turnover per outstanding security is dramatically higher in principal STRIPS — that is where tradable liquidity sits, and a likely source of the documented principal-versus-coupon STRIPS price premium.", "quote": "Daily trading volume of STRIPS averaged $5.6 billion from July 2024 to June 2025, with coupon STRIPS accounting for 32 percent ($1,784 million) and principal STRIPS 68 percent ($3,856 million).", "locator": "How Much Do STRIPS Trade?", "quote_verified": true}, {"claim": "Coupon STRIPS trading volume is spread relatively evenly across maturity buckets while principal STRIPS volume concentrates in long maturities, because stripping generates semi-annual coupon STRIPS across the whole horizon but only one principal STRIPS at final maturity.", "speaker": "Michael J. Fleming and Or Shachar", "type": "causal", "entities": ["STRIPS", "U.S. Treasury"], "conviction": "high", "so_what": "The maturity distribution of STRIPS supply is mechanically set by the stripping process, so the even spread of coupon STRIPS activity is partly a supply artifact and should not be read as investor preference.", "quote": "the stripping process creates semi-annual coupon STRIPS from the present to the stripped security’s final maturity, but principal STRIPS with only the stripped security’s final maturity", "locator": "Consistent with stripping activity", "quote_verified": true}]}, {"theme": "Venue structure: dealer-to-client dominance", "insights": [{"claim": "About 73 percent of coupon STRIPS daily volume trades dealer-to-client ($1,309 million), 19 percent dealer-to-dealer ($338 million), and only 8 percent through interdealer brokers ($137 million).", "speaker": "Michael J. Fleming and Or Shachar", "type": "data_point", "entities": ["STRIPS", "dealer-to-client", "interdealer broker", "FINRA", "TRACE"], "conviction": "high", "so_what": "Interdealer STRIPS liquidity is tiny, so dealers warehousing client zero-coupon risk have little ability to lay it off quickly — a latent capacity constraint in long-duration risk transfer.", "quote": null, "locator": "Breaking down trading activity by venue", "quote_verified": false}, {"claim": "Principal STRIPS are even more client-driven than coupon STRIPS, with 88 percent of daily volume ($3,396 million) transacted in the dealer-to-client segment.", "speaker": "Michael J. Fleming and Or Shachar", "type": "data_point", "entities": ["STRIPS", "dealer-to-client"], "conviction": "high", "so_what": "Nearly all long-duration zero-coupon activity is end-user flow crossing dealer balance sheets rather than dealer risk recycling, making dealer capacity the chokepoint if pension or insurer demand surges.", "quote": "The volumes of principal STRIPS are even more concentrated in the DTC segment with 88 percent of daily volume (averaging $3,396 million).", "locator": "Breaking down trading activity by venue", "quote_verified": true}, {"claim": "The heavy dealer-to-client share of zero-coupon Treasury trading likely reflects the value that end-users such as pension funds and insurance companies place on single-payment securities they can match directly against dated liabilities.", "speaker": "Michael J. Fleming and Or Shachar", "type": "causal", "entities": ["pension funds", "insurance companies", "STRIPS", "dealer-to-client"], "conviction": "medium", "so_what": "STRIPS volume is a proxy for liability-driven investor duration demand; sustained pickups in dealer-to-client principal STRIPS volume would signal pension and insurer hedging at the long end.", "quote": "The high share of DTC activity likely reflects the value that end-users such as pension funds and insurance companies ascribe to these single-payment securities.", "locator": "Breaking down trading activity by venue", "quote_verified": true}]}, {"theme": "Trade size and frequency microstructure", "insights": [{"claim": "Principal STRIPS trade in average sizes of about $7 million versus roughly $850 thousand for coupon STRIPS, with dealer-to-client principal STRIPS trades averaging $10.47 million against $1.09 million through interdealer brokers.", "speaker": "Michael J. Fleming and Or Shachar", "type": "data_point", "entities": ["STRIPS", "dealer-to-client", "interdealer broker"], "conviction": "high", "so_what": "Block-size zero-coupon trades are executed bilaterally with dealers, confirming institutional-size long-duration risk cannot be moved on interdealer venues.", "quote": "Coupon STRIPS trade with an average size of about $850 thousand, whereas principal STRIPS trade with an average trade size of about $7 million.", "locator": "The coupon vs. principal STRIPS activity gap", "quote_verified": true}, {"claim": "Average principal STRIPS trade size in the 25-30 year sector is about $12.3 million, roughly 4 times the $2.8 million average in the 10-15 year sector, while coupon STRIPS trade sizes scale only about 2.5 times ($2.5 million vs. $1.0 million) across the same range.", "speaker": "Michael J. Fleming and Or Shachar", "type": "data_point", "entities": ["STRIPS"], "conviction": "high", "so_what": "Ticket size rises with duration, so the longest-dated principal STRIPS are where the largest single-clip institutional duration transfers occur — the cleanest place to observe real-money long-end demand.", "quote": "Trade sizes in the 25-30 year sector are thus about 4 times larger than those in the 10-15 year sector for principal STRIPS ($12.3 million vs. $2.8 million)", "locator": "Longer maturity STRIPS also trade", "quote_verified": true}, {"claim": "The 0-5 year maturity bucket is the most frequently traded STRIPS sector by number of trades, with roughly equal numbers of dealer-to-client and dealer-to-dealer trades each day, despite holding little of the stripped stock.", "speaker": "Michael J. Fleming and Or Shachar", "type": "contrarian", "entities": ["STRIPS", "dealer-to-client"], "conviction": "medium", "so_what": "Trade count and notional volume point in opposite directions across the curve — short-dated zeros trade in many small tickets, so headline volume alone misreads who uses which part of the curve.", "quote": "Interestingly, the 0-5 year maturity bucket is most frequently traded, with roughly the same number of DTC and DTD trades each trading day.", "locator": "Lastly, we explore trading frequency", "quote_verified": true}, {"claim": "Trade frequency for principal STRIPS is U-shaped across the curve — declining out to the 10-15 year bucket then rising again for longer maturities — whereas coupon STRIPS trade frequency declines monotonically as maturity extends.", "speaker": "Michael J. Fleming and Or Shachar", "type": "data_point", "entities": ["STRIPS"], "conviction": "medium", "so_what": "Two distinct clienteles are visible: short-dated tactical users and long-dated liability hedgers, leaving the 10-15 year zero-coupon sector the least active and likely least liquid.", "quote": "for principal STRIPS the average daily number of trades first decreases but then increases as securities’ maturities extend beyond 10-15 years", "locator": "Lastly, we explore trading frequency", "quote_verified": true}]}, {"theme": "Transparency gap and open pricing question", "insights": [{"claim": "FINRA has published aggregate Treasury trading volume since March 2020 but its public data exclude STRIPS entirely, making this TRACE-based study the first detailed analysis of zero-coupon Treasury trading activity.", "speaker": "Michael J. Fleming and Or Shachar", "type": "data_point", "entities": ["FINRA", "TRACE", "U.S. Treasury", "STRIPS"], "conviction": "high", "so_what": "A genuine transparency blind spot in a $560 billion segment; any move to publish STRIPS volumes would give the market a currently unavailable read on liability-driven duration demand.", "quote": "The public data do not, however, include information about the trading activity of Separate Trading of Registered Interest and Principal of Securities (STRIPS).", "locator": "In March 2020, the Financial Industry Regulatory Authority", "quote_verified": true}, {"claim": "Principal STRIPS consistently trade at higher prices than coupon STRIPS of the same maturity, and the authors flag as unresolved whether their higher trading volume translates into higher liquidity that explains the pricing gap.", "speaker": "Michael J. Fleming and Or Shachar", "type": "thesis", "entities": ["STRIPS"], "conviction": "exploratory", "so_what": "A concrete relative-value hypothesis: if the principal-STRIPS premium is a liquidity premium rather than structural, matched-maturity coupon STRIPS are the cheaper way to buy identical government cash flows for buy-and-hold liability matching.", "quote": "the extent to which the higher trading volume of principal STRIPS is associated with higher liquidity and whether liquidity differences in the STRIPS market can help explain the pricing differences", "locator": "Summing Up", "quote_verified": true}, {"claim": "Each stripped Treasury cash flow gets its own CUSIP while remaining a direct obligation of the U.S. government, giving investors known cash values at specific future dates for exact liability matching, and the high duration of long-maturity zeros also makes them a favored speculative vehicle.", "speaker": "Michael J. Fleming and Or Shachar", "type": "framework", "entities": ["STRIPS", "CUSIP", "U.S. Treasury", "pension funds", "insurance companies"], "conviction": "high", "so_what": "Explains why long zero-coupon Treasuries are the highest-duration, highest-convexity expression of a rates view available in government paper — leveraged duration with no credit risk.", "quote": "The flexibility to customize investments, and the high duration of long maturity STRIPS, also make them popular with speculators.", "locator": "As STRIPS have known cash values", "quote_verified": true}]}], "insight_total": 20, "top_entities": ["STRIPS", "U.S. Treasury", "FINRA", "TRACE", "TIPS", "pension funds", "insurance companies", "Michael J. Fleming", "Or Shachar", "Treasury Department", "dealer-to-client", "interdealer broker"], "source_meta": {"author": "trevordelaney", "word_count": 1820, "paywalled": false}}, {"record_id": e": null, "locator": "Watching this gap widen, it’s clear", "quote_verified": false}, {"claim": "The idealized fix for the adoption gap is putting a company's best product expert into every single sales conversation — demonstrating rather than describing the product and adapting to each buyer's experience level — for every prospect rather than only the largest accounts.", "speaker": "Sequoia Arc", "type": "framework", "entities": ["Sable"], "conviction": "high", "so_what": "A clean way to size the market: the addressable spend is the long tail of prospects that human field experts were never economic enough to serve.", "quote": "stay until the customer understood not just what your product is, but what it could do for them", "locator": "Imagine your business wanted every buyer", "quote_verified": true}]}, {"theme": "The AI employee product category", "insights": [{"claim": "Sable's product 'Aidan' is positioned as the first AI employee that leads its own customer calls using vision, voice, video and real-time browser interaction, rather than acting as a text chatbot or copilot.", "speaker": "Sequoia Arc", "type": "data_point", "entities": ["Sable", "Aidan"], "conviction": "high", "so_what": "Marks a shift from assistive AI to agent-as-headcount, moving the buyer's budget line from software spend toward labor spend.", "quote": "It created “Aidan,” the first AI employee, who leads its own customer calls with vision, voice, video and real-time browser interaction.", "locator": "Sable makes this possible.", "quote_verified": true}, {"claim": "The technical requirements for enterprise multimodal AI employees are specified as low-latency browser use, real-time vision and simultaneous human-agent interaction — frontier capabilities rather than commodity API wrapping.", "speaker": "Sequoia Arc", "type": "framework", "entities": ["Sable", "multimodal AI employees"], "conviction": "medium", "so_what": "Gives a concrete checklist for separating durable agent startups from thin e category.", "quote": "building foundational infrastructure for companies to manage their AI employees", "locator": "The combination of an all-star team", "quote_verified": true}]}, {"theme": "Talent density as the underwriting variable", "insights": [{"claim": "Sable's four founders are Harvard friends who studied post-training, reinforcement learning and multimodality and worked at SpaceX, Google, Meta and Together AI, and early hires include ten Harvard alums, former quantitative traders and International Math Olympiad winners.", "speaker": "Sequoia Arc", "type": "data_point", "entities": ["Sable", "Harvard", "SpaceX", "Google", "Meta", "Together AI"], "conviction": "high", "so_what": "AI startups now recruit against quant-trading and olympiad talent pools, raising the compensation floor and talent cost for incumbent enterprise software vendors.", "quote": "ten Harvard alums, former quantitative traders and International Math Olympiad winners", "locator": "Among their first hires", "quote_verified": true}, {"claim": "Sequoia both led Sable's seed round and co-led its Series A while the company was still under a year old, compressing the normal interval between financing stages.", "speaker": "Sequoia Arc", "type": "data_point", "entities": ["Sequoia", "Sable"], "conviction": "high", "so_what": "Back-to-back rounds inside twelve months shows how fast capital is repricing agent startups — relevant to entry valuations across the category.", "quote": "we were thrilled to lead Sable’s seed round and co-lead its Series A", "locator": "The combination of an all-star team", "quote_verified": true}]}], "top_entities": ["Sable", "Aidan", "Notion", "Decagon", "Sequoia", "Harvard", "SpaceX", "Google", "Meta", "Together AI", "Fortune 500"], "source_meta": {"author": "", "word_count": 602, "paywalled": false}, "insight_total": 10}, {"record_id": "79ff7a810a3bc64b", "source_type": "concepts", "source_name": "Sequoia Arc", "source_url": "https://sequoiacap.com/article/cyera-and-oasis-stronger-together/", "title": "Cyera and Oasis: Stronger Together", "published_date": "2026-07-28", "language": "en", "processed_at": "2026-08-10T18:11:56Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "AI"], "gist": "Sequoia explains its portfolio merger of Oasis Security into Cyera as the bet that AI-era enterprise security consolidates into one layer spanning data, identity and agents: every AI agent spawns non-human identities (API keys, service accounts, OAuth tokens, agent-to-agent credentials) that legacy human-centric IAM cannot govern, and Cyera's already-built enterprise GTM engine is the distribution weapon meant to win the standardization race before rivals assemble the same stack.", "themes": [{"theme": "Non-human identity as the new attack surface", "insights": [{"claim": "A 2021 thesis that enterprises would soon hold far more machine identities than human ones, with almost no tooling to manage or secure them, is described as having gone from true to far more true by 2026 — this was the founding premise of Oasis Security.", "speaker": "Sequoia Arc", "type": "thesis", "entities": ["Oasis Security", "Danny Brickman", "machine identities", "IAM"], "conviction": "high", "so_what": "Non-human identity management is a validated, expanding budget line — screen identity-security vendors and legacy IAM incumbents for exposure to the machine-identity shift.", "quote": "enterprises were about to have far more machine identities than human ones, and almost nobody had a real way to manage or secure them", "locator": "Three years ago, the pitch for Oasis", "quote_verified": true}, {"claim": "Every AI agent creates or uses non-human identities — API keys, service accounts, OAuth tokens and agent-to-agent credentials — that carry real permissions and real blast radius and behave nothing like the human identities the previous generation of identity tooling was designed around.", "speaker": "Sequoia Arc", "type": "causal", "entities": ["AI agents", "API keys", "OAuth", "service accounts", "identity security"], "conviction": "high", "so_what": "Agent deployment mechanically multiplies credentials, so identity-security spend should scale with agent rollout rather than headcount — a structural tailwind independent of seat-based pricing.", "quote": "Every AI agent creates or uses non-human identities — API keys, service accounts, OAuth tokens, agent-to-agent credentials — that act with real permissions and real blast radius", "locator": "Every AI agent creates or uses", "quote_verified": true}, {"claim": "AI has pushed non-human identity out of being a niche IAM subcategory and into a board-level CISO conversation.", "speaker": "Sequoia Arc", "type": "causal", "entities": ["CISO", "IAM", "non-human identity", "AI"], "conviction": "high", "so_what": "Budget authority moving up to the board typically shortens enterprise sales cycles and raises deal size — watch for accelerating ARR growth at identity-security vendors.", "quote": "AI drove non-human identity from a niche IAM subcategory to a board-level CISO conversation.", "locator": "AI drove non-human identity", "quote_verified": true}]}, {"theme": "Data plus identity as the AI security stack", "insights": [{"claim": "The stated framework for AI security is that it requires securing three layers at once: the data, the identities acting on it (both human and non-human), and the agents themselves.", "speaker": "Sequoia Arc", "type": "framework", "entities": ["Cyera", "AI agents", "data security", "identity security"], "conviction": "high", "so_what": "Use the data-identity-agent triad as a checklist to judge which security vendors are point solutions versus platform candidates in AI security.", "quote": null, "locator": "As AI agents started reading, writing", "quote_verified": false}, {"claim": "Data security and identity security are framed as two halves of a bank vault problem — data security tells you what is actually at stake, identity security tells you whether the thing touching the data is legitimate — and only together do they cover the full path an AI agent takes through a company's environment.", "speaker": "Sequoia Arc", "type": "framework", "entities": ["Cyera", "Oasis Security", "data security", "identity security"], "conviction": "high", "so_what": "Implies standalone DSPM and standalone NHI vendors are both structurally incomplete, making both categories acquisition targets rather than durable independents.", "quote": null, "locator": "Data security tells you what", "quote_verified": false}, {"claim": "Cyera's core product answers where an organization's sensitive data lives, who can reach it and what is really at risk, while Oasis maps every service account, API key and agent credential able to touch that data and whether it is behaving as it should.", "speaker": "Sequoia Arc", "type": "thesis", "entities": ["Cyera", "Oasis Security", "Yotam Segev", "Tamar Bar-Ilan", "Yonatan Itai"], "conviction": "high", "so_what": "Defines the combined product surface to benchmark competing AI-security platforms against when assessing displacement risk.", "quote": null, "locator": "Cyera knows where the sensitive data is", "quote_verified": false}]}, {"theme": "Consolidation logic and the standardization land grab", "insights": [{"claim": "Whoever first builds a genuinely complete AI security platform spanning data, identity and agents is argued to have a real shot at becoming the default layer enterprises standardize on as agentic AI rolls out.", "speaker": "Sequoia Arc", "type": "prediction", "entities": ["AI security", "agentic AI", "Cyera", "Oasis Security"], "conviction": "high", "so_what": "A winner-take-most framing implies further rapid M&A in security as vendors race to complete the stack before the standardization window closes.", "quote": "Whoever builds the first genuinely complete AI security platform, spanning data, identity and agents, has a real shot at becoming the default layer enterprises standardize on as agentic AI rolls out.", "locator": "And the market is not waiting", "quote_verified": true}, {"claim": "The practical rationale given for the merger is distribution rather than technology: Cyera has assembled an enterprise go-to-market team at a scale that usually takes a startup a decade to reach, and Oasis's product can now run through that engine into accounts it would otherwise have spent years earning.", "speaker": "Sequoia Arc", "type": "thesis", "entities": ["Cyera", "Oasis Security", "enterprise GTM"], "conviction": "high", "so_what": "Signals that in AI-era security, enterprise distribution is the scarce asset and the main driver of acquisition premiums — value product startups on what a buyer's GTM can do with them.", "quote": "Cyera has built one of the most powerful enterprise GTM teams, with the kind of scale that usually takes a startup a decade to reach.", "locator": "There is a practical case here too", "quote_verified": true}, {"claim": "Oasis is said to have built the category-defining company in non-human identity in under three years, going from a standing start to a product enterprises trust with agentic access at scale.", "speaker": "Sequoia Arc", "type": "data_point", "entities": ["Oasis Security", "Danny Brickman", "Amit Zimerman", "non-human identity"], "conviction": "high", "so_what": "Category formation and exit timelines in AI-adjacent security are compressing to roughly three years, shortening the venture holding period assumption for the sector.", "quote": "built the category-defining company in non-human identity in under three years, from a standing start to a product enterprises trust with agentic access at scale", "locator": "Danny, Amit and the Oasis team", "quote_verified": true}]}, {"theme": "Israeli military talent pipeline", "insights": [{"claim": "Talpiot and Unit 8200 alumni are credited with producing a disproportionate share of the last decade's large cybersecurity companies, with Wiz, Cyera and Oasis all founded by people who e per watt", "locator": "The intelligence race is fundamentally compute", "quote_verified": true}]}, {"theme": "Architecture: the cluster is the unit of compute", "insights": [{"claim": "The unit of compute is described as having moved from the chip to the rack to the cluster, so Etched designs cluster-scale inference systems rather than standalone chips.", "speaker": "Sequoia Arc", "type": "framework", "entities": ["Etched", "cluster-scale inference systems", "data centers"], "conviction": "high", "so_what": "A reusable lens for evaluating AI hardware: vendors selling only a chip are competing at the wrong altitude; system-level integration (networking, memory, power delivery) is where margin sits.", "quote": "As the unit of compute has moved from the chip to the rack to the cluster, Etched has designed for that reality, building not just chips, but cluster-scale inference systems.", "locator": "As the unit of compute has moved", "quote_verified": true}, {"claim": "Etched claims two specific research breakthroughs — low voltage inference and cluster-scale memory — each presented as an architectural choice producing step-change gains in throughput and latency.", "speaker": "Sequoia Arc", "type": "data_point", "entities": ["Etched", "low voltage inference", "cluster-scale memory"], "conviction": "high", "so_what": "Low-voltage operation and pooled cluster memory are the two levers that most directly attack inference cost per token; watch whether incumbents respond with similar voltage/memory-pooling designs.", "quote": "Etched has pioneered several research breakthroughs – low voltage inference and cluster-scale memory", "locator": "Over the past years, Etched has pioneered", "quote_verified": true}, {"claim": "Etched's system is claimed to excel in throughput and interactivity across the full span of frontier model families — large sparse mixture-of-experts, dense transformers, and alternative architectures such as Mamba.", "speaker": "Sequoia Arc", "type": "data_po
