id-Scale Batteries", "quote_verified": true}, {"claim": "Benchmark's cathode market update at Benchmark Week 2026 covered cathode and precursor capacity growth across Korea, Morocco, Indonesia and Europe, and regional pricing arbitrage between them.", "speaker": "William Rowe, CEO, Swaptopus (An Octopus Energy and CATL joint venture); Iola Hughes, Head of Research, Benchmark Minera", "type": "thesis", "entities": ["cathode", "precursor", "Korea", "Morocco", "Indonesia", "Europe"], "conviction": "low", "so_what": "Cathode capacity is spreading beyond China to Korea, Morocco, Indonesia and Europe, and regional price gaps create arbitrage that affects producer margins.", "quote": "Cathode and precursor capacity growth across Korea, Morocco, Indonesia and Europe, regional pricing arbitrage, and which producers are leading global expansion.", "locator": "Benchmark Cathode Market Update", "quote_verified": true}]}], "insight_total": 4, "top_entities": ["Swaptopus", "CATL", "Octopus Energy", "William Rowe", "Iola Hughes", "Europe", "Benchmark Mineral Intelligence", "HGVs"], "source_meta": {"author": "William Rowe, CEO, Swaptopus (An Octopus Energy and CATL joint venture); Iola Hughes, Head of Research, Benchmark Minera", "word_count": 260, "paywalled": false}}, {"record_id": "bc9e424becdbff07", "source_type": "technology", "source_name": "Ars Technica", "source_url": "https://arstechnica.com/security/2026/11/windows-0-day-dropped-by-disgruntled-researcher-hands-hackers-system-rights/", "title": "Windows 0-day dropped by disgruntled researcher hands hackers System rights", "published_date": "2026-11-13", "language": "en", "processed_at": "2026-11-14T11:07:06Z", "processor": "claude-code-sub-opus", "tags": ["Tech"], "gist": "Pseudonymous researcher Nightmare Eclipse dropped SignDrop, an unpatched Windows zero-day in the Common Log File System that abuses Windows Defender to give local users System rights and could disable any antivirus/EDR; it stems from an October 2025 Microsoft CLFS mitigation, but Will Dormann found it only works on certain aged Windows 11 26H2 systems.", "themes": [{"theme": "SignDrop exploit mechanics", "insights": [{"claim": "SignDrop is a Windows zero-day in the Common Log File System (CLFS) that lets a user with ordinary rights escalate to full System privileges by forcing a privileged process such as Windows Defender to open a crafted CLFS container.", "speaker": "Dan Goodin", "type": "data_point", "entities": ["SignDrop", "Microsoft", "Windows Defender", "CLFS"], "conviction": "high", "so_what": "Another unpatched local privilege escalation in Windows raises enterprise endpoint risk.", "quote": null, "locator": "On Tuesday, Nightmare Eclipse disclosed SignDrop", "quote_verified": false}, {"claim": "The SignDrop exploit calls Defender's legitimate ServerMpUpdateEngineSignature function and manipulates Object Manager symbolic links so CLFS creates a missing authentication file with Defender's System privileges while assigning it the original file's access control list.", "speaker": "Dan Goodin", "type": "causal", "entities": ["Windows Defender", "CLFS", "ServerMpUpdateEngineSignature"], "conviction": "high", "so_what": "Shows how chaining legitimate OS components creates exploitable logic flaws that are hard to patch.", "quote": null, "locator": "By manipulating Windows Object Manager symbolic links", "quote_verified": false}, {"claim": "The SignDrop vulnerability stems from a security mitigation Microsoft introduced in October 2025 to stop attackers exploiting other CLFS vulnerabilities.", "speaker": "Dan Goodin", "type": "contrarian", "entities": ["Microsoft", "CLFS"], "conviction": "high", "so_what": "Security hardening can itself introduce new attack surface, complicating patch-quality assumptions.", "quote": "Ironically, the vulnerability stems from a security measure Microsoft introduced in October 2025", "locator": "Ironically, the vulnerability stems", "quote_verified": true}, {"claim": "Nightmare Eclipse claims SignDrop can be used against any antimalware engine to bypass tamper protection, since file creation appears to come from the security product's own legitimate process, making it able to turn off any antivirus/EDR.", "speaker": "Dan Goodin", "type": "thesis", "entities": ["Nightmare Eclipse", "antivirus", "EDR"], "conviction": "medium", "so_what": "A generic EDR-disable technique would threaten the value proposition of endpoint security vendors until mitigated.", "quote": "this makes this vulnerability unique as it can be used to turn off any antivirus/EDR", "locator": "What makes it funnier is the fact", "quote_verified": true}]}, {"theme": "Real-world exposure is limited", "insights": [{"claim": "Nightmare Eclipse says SignDrop works on Windows 11 26H2, Windows 11 26H2 Experimental and Windows Server 2025 Experimental, and systems whose CLFS authentication mode is in learning or enforcement mode are vulnerable.", "speaker": "Dan Goodin", "type": "data_point", "entities": ["Windows 11 26H2", "Windows Server 2025", "Nightmare Eclipse"], "conviction": "high", "so_what": "Exposure is concentrated in newest Windows builds, limiting near-term blast radius.", "quote": null, "locator": "Nightmare Eclipse said the exploit worked", "quote_verified": false}, {"claim": "Researcher Will Dormann reproduced SignDrop but found it appears to require a Windows 11 26H2 system that has existed for more than 90 days, and only one of his many machines met the requirement.", "speaker": "Dan Goodin", "type": "contrarian", "entities": ["Will Dormann", "Windows 11 26H2"], "conviction": "high", "so_what": "Practical exploitability is narrower than the headline suggests.", "quote": "you can’t just take a new 26H2 system and install updates and have it work", "locator": "Researcher Will Dormann said in an interview", "quote_verified": true}, {"claim": "Because Microsoft does staged rollouts of Windows updates like 26H2, it is unclear how many systems are exposed to SignDrop, and Microsoft did not respond to a request for comment.", "speaker": "Dan Goodin", "type": "data_point", "entities": ["Microsoft", "Windows 11 26H2"], "conviction": "medium", "so_what": "Uncertain exposure plus no vendor response leaves enterprises to self-assess.", "quote": null, "locator": "Microsoft does staged rollouts of Windows updates", "quote_verified": false}]}, {"theme": "Adversarial researcher disclosures", "insights": [{"claim": "Nightmare Eclipse, a pseudonymous researcher with an ongoing public feud with Microsoft, has published numerous Windows zero-days in recent months without coordinated disclosure.", "speaker": "Dan Goodin", "type": "anecdote", "entities": ["Nightmare Eclipse", "Microsoft"], "conviction": "medium", "so_what": "A steady stream of unpatched public Windows exploits is a recurring reputational and operational risk for Microsoft.", "quote": "Nightmare Eclipse, the pseudonym of a researcher with an ongoing, very public beef with Microsoft", "locator": "Nightmare Eclipse, the pseudonym of a researcher", "quote_verified": true}]}], "insight_total": 8, "top_entities": ["Microsoft", "SignDrop", "Nightmare Eclipse", "Windows Defender", "Common Log File System", "CLFS", "Will Dormann", "Windows 11 26H2", "Windows Server 2025"], "source_meta": {"author": "Dan Goodin", "word_count": 673, "paywalled": false}}, {"record_id": "bd6f30a01ed6c14f", "source_type": "technology", "source_name": "MIT Technology Review", "source_url": "https://www.technologyreview.com/2026/11/13/1148474/more-autonomy-fewer-ndas-volunteers-have-new-requests-for-brain-implant-trials/", "title": "More autonomy, fewer NDAs: Volunteers have new requests for brain implant trials", "published_date": "2026-11-13", "language": "en", "processed_at": "2026-11-14T11:06:22Z", "processor": "claude-code-sub-opus", "tags": ["Tech", "Society"], "gist": "BCI Pioneers Coalition, cofounded by early implant recipient Ian Burkhart, published a version-one set of ethics guidelines in 13 categories for ons, and were drawn from a small group because very few people live with BCIs.", "speaker": "Jessica Hamzelou", "type": "framework", "entities": ["BCI Pioneers Coalition", "Jennifer Chandler"], "conviction": "medium", "so_what": "Expect the standard to evolve; near-term enforcement power is limited but direction of travel is set.", "quote": "This is a living document, and this is version one", "locator": "Some of the guidelines are vague", "quote_verified": true}]}, {"theme": "Recognition and compensation of volunteers", "insights": [{"claim": "Ian Burkhart says his BCI trial participation meant lab visits two or three days a week for four hours at a time, equivalent to a part-time job.", "speaker": "Jessica Hamzelou", "type": "data_point", "entities": ["Ian Burkhart"], "conviction": "high", "so_what": "Participant labor burden is substantial, implying compensation demands could raise BCI trial costs.", "quote": "That’s [easily] a part-time job if you just count the hours you’re putting in.", "locator": "During the trials that Burkhart participated", "quote_verified": true}, {"claim": "The guidelines recommend recognizing and compensating BCI trial participants, including potentially listing them as coauthors on scientific publications or naming them publicly as research collaborators, while acknowledging not everyone will want this.", "speaker": "Jessica Hamzelou", "type": "thesis", "entities": ["BCI Pioneers Coalition", "Ian Burkhart"], "conviction": "medium", "so_what": "Shifts the participant role from subject to collaborator, which could affect IP, publication and recruitment practices.", "quote": null, "locator": "Others who find themselves in a similar position", "quote_verified": false}]}, {"theme": "Brain data ownership, privacy and NDAs", "insights": [{"claim": "The guidelines state brain data should be treated as the participant's personal information, and push for participants to access their own brain data at any time, something not always possible historically.", "speaker": "Jessica Hamzelou", "type": "thesis", "entities": ["BCI Pioneers Coalition", "brain data"], "conviction": "high", "so_what": "Data-access rights could constrain how BCI companies hoard neural datasets that underpin their algorithmic edge.", "quote": "should be understood as the participant’s personal information.", "locator": "The guidelines state that brain data", "quote_verified": true}, {"claim": "Participants want to ensure embargoes or NDAs designed to keep findings from competitors do not stop them from sharing their brain data with their own doctors; Burkhart says firm NDAs are not super common in trials but should be prevented.", "speaker": "Jessica Hamzelou", "type": "thesis", "entities": ["Ian Burkhart", "NDAs"], "conviction": "medium", "so_what": "Competitive secrecy practices of BCI firms may come under pressure from participant advocacy.", "quote": "It’s not super common for there to be firm NDAs within a lot of the trials", "locator": "They are pushing for participants", "quote_verified": true}, {"claim": "Privacy sensitivity varies by implant type: motor-control neural data bothered Burkhart little, but participants with speech-decoding implants that turn thoughts into words may feel very differently about storage and analysis of their data.", "speaker": "Jessica Hamzelou", "type": "causal", "entities": ["brain-computer interfaces", "speech decoding"], "conviction": "medium", "so_what": "Thought-to-text BCIs carry higher privacy and reputational risk than motor BCIs.", "quote": null, "locator": "Things get even more complicated", "quote_verified": false}, {"claim": "The guidelines say researchers have a duty to prepare participants for media attention because full anonymity of BCI trial participants may be difficult to maintain given public interest in such technologies.", "speaker": "Jessica Hamzelou", "type": "framework", "entities": ["BCI Pioneers Coalition"], "conviction": "medium", "so_what": "High public visibility of BCI trials raises reputational stakes for sponsors.", "quote": null, "locator": "The guidelines also address the thorny", "quote_verified": false}]}, {"theme": "Post-trial device continuity risk", "insights": [{"claim": "About five years into Burkhart's implant, funding problems led his research team to tell him the implant would have to be removed and could be reimplanted once funding was secured; it was ultimately removed in 2021 after an infection at the scalp cable site.", "speaker": "Jessica Hamzelou", "type": "anecdote", "entities": ["Ian Burkhart"], "conviction": "high", "so_what": "Funding fragility directly translates into patient harm and ethical exposure for BCI programs.", "quote": null, "locator": "The guidelines also address what comes", "quote_verified": false}, {"claim": "Rita Leggett, an Australian woman with an epilepsy brain implant, had the device removed against her will after the company that made it went bust two years later, an act ethicists have described as a potential breach of human rights.", "speaker": "Jessica Hamzelou", "type": "anecdote", "entities": ["Rita Leggett", "epilepsy implant"], "conviction": "high", "so_what": "Company failure in neurotech creates human-rights and liability risk, making sponsor solvency a material issue.", "quote": "became one", "locator": "Rita Leggett, an Australian woman", "quote_verified": true}, {"claim": "The guidelines say researchers should commit to maintaining brain devices for a reasonable period after a trial ends, give participants ample time to prepare for removal surgery, and set aside extra funds to support them.", "speaker": "Jessica Hamzelou", "type": "thesis", "entities": ["BCI Pioneers Coalition", "brain-computer interfaces"], "conviction": "medium", "so_what": "If adopted, post-trial maintenance reserves would add to BCI developers' capital requirements.", "quote": null, "locator": "Researchers should instead commit", "quote_verified": false}]}, {"theme": "Early BCI capability milestones", " hey'll probably continue to get more expensive well into 2027, maybe even 2028", "locator": "“Things are getting more expensive", "quote_verified": true}, {"claim": "Black Friday deals will likely be weakest on memory-intensive products, while gadgets less reliant on RAM, such as robot vacuums and headphones, may see better prices.", "speaker": "Boone Ashworth", "type": "framework", "entities": ["RAM", "robot vacuums", "headphones"], "conviction": "medium", "so_what": "Memory content per device is a useful lens for which consumer hardware categories face margin or demand pressure.", "quote": null, "locator": "While many sales have already begun", "quote_verified": false}, {"claim": "Amazon has raised prices on its latest Kindles, tablets, and Echo speakers, making its upcoming sales on those devices likely less impressive than in prior years.", "speaker": "Boone Ashworth", "type": "data_point", "entities": ["Amazon", "Kindle", "Echo"], "conviction": "high", "so_what": "Even the largest retailer is passing through component cost inflation on its own hardware.", "quote": null, "locator": "Case in point: Amazon", "quote_verified": false}, {"claim": "Consumer advocate Edgar Dworsky predicts laptops, desktops, and SSDs will still be discounted on Black Friday but not nearly as low as previous years because of high memory prices.", "speaker": "Boone Ashworth", "type": "prediction", "entities": ["Edgar Dworsky", "laptops", "SSDs"], "conviction": "medium", "so_what": "Shallower discounts imply weaker holiday unit volumes for PC and storage vendors.", "quote": "Because of high memory prices, laptops, desktops, and SSDs will still be on sale", "locator": "Because of high memory prices", "quote_verified": true}]}, {"theme": "Pricing power and who benefits", "insights": [{"claim": "Amid economic turmoil, companies have been adept at passing additional costs to consumers, making Black Friday good mainly for the sellers who set the prices.", "speaker": "Boone Ashworth", "type": " ied": true}, {"claim": "Paul Cristiano said that if AI develops on the most rapid trajectory, humanity faces roughly a coin flip of AI takeover, including a meaningful risk within the next six to 12 months, while conceding no quantitative model can put a number on it.", "speaker": "Kyle Orland", "type": "prediction", "entities": ["Paul Cristiano", "AI takeover"], "conviction": "high", "so_what": "Near-term catastrophic-risk framing from an insider could fuel calls for development pauses.", "quote": "looking at something like a coin flip of an AI takeover", "locator": "Despite his grim assessment", "quote_verified": true}, {"claim": "Paul Cristiano said that even with realistic policy responses slowing AI development, the risk of AI takeover remains exceptionally high.", "speaker": "Kyle Orland", "type": "thesis", "entities": ["Paul Cristiano"], "conviction": "high", "so_what": "Suggests he views incremental regulation as insufficient, implying support for stronger interventions.", "quote": null, "locator": "Despite his grim assessment", "quote_verified": false}, {"claim": "Paul Cristiano said that by 2028 there is a reasonable chance that a failure similar to the Hugging Face incident leads to an AI takeover and irreversible loss of human control.", "speaker": "Kyle Orland", "type": "prediction", "entities": ["Paul Cristiano", "Hugging Face"], "conviction": "high", "so_what": "Specific dated prediction from an OpenAI board member on catastrophic AI failure.", "quote": "there is a reasonable chance that a similar failure [to the Hugging Face incident] leads to an AI takeover and an irreversible loss of human control.", "locator": "The risk of more capable AI models", "quote_verified": true}, {"claim": "Paul Cristiano defines AI takeover as goal-pursuing AI systems calling the shots on Earth the way humans do today, such that humans trying to stop them would be as ineffective as an individual trying to stop the US military.", "speaker": "Kyle Orland", "type": "framewo  "entities": ["App Intents", "Siri AI"], "conviction": "high", "so_what": "Reusing an existing framework lowers developer adoption friction, speeding ecosystem breadth.", "quote": null, "locator": "Today", "quote_verified": false}, {"claim": "A new Skills feature lets developers teach Siri AI how to combine several actions into a single experience, supporting complex multi-step requests.", "speaker": "Sergio De Simone", "type": "framework", "entities": ["Skills", "Siri AI"], "conviction": "medium", "so_what": "Multi-action orchestration turns Siri into an agent layer above apps, shifting where user intent is captured.", "quote": "teach Siri AI how to combine several actions into a single experience", "locator": "These new capabilities let users make", "quote_verified": true}]}, {"theme": "Request routing and cross-app actions", "insights": [{"claim": "Siri AI requests that do not name an app are routed to the foreground app, the app with an active Live Activity, or the app previously mentioned in the conversation, while background apps only receive requests that explicitly mention their name.", "speaker": "Sergio De Simone", "type": "framework", "entities": ["Siri AI", "Live Activity"], "conviction": "high", "so_what": "Routing rules favor foreground/recently used apps, influencing which apps capture assistant-driven engagement.", "quote": null, "locator": "If a request does not specify an app name", "quote_verified": false}, {"claim": "Siri AI requests can span multiple apps, such as finding content in one app, sending it to another, and performing an action there.", "speaker": "Sergio De Simone", "type": "framework", "entities": ["Siri AI"], "conviction": "medium", "so_what": "Cross-app agentic flows could disintermediate individual app UIs, a second-order risk for app-centric business models.", "quote": null, "locator": "Requests can also include actions across apps", "quote_verified": false}]}, {"theme": "Early developer reception", "insights": [{"claim": "An early Reddit tester reported that Siri AI works as advertised when intents and parameters have good descriptions, saying this is what Siri should have been since 26.0.", "speaker": "Sergio De Simone", "type": "anecdote", "entities": ["Siri AI", "Reddit"], "conviction": "low", "so_what": "Early positive developer sentiment, though anecdotal, suggests the rebuild may address Siri's long-standing capability gap.", "quote": "If you include a good description on your intent and parameters, Siri can figure it out.", "locator": "Commenting on Apple's announcement, Reddit user", "quote_verified": true}, {"claim": "A Reddit commenter argued Apple's choice to build on App Intents was better than Google's approach of a separate agent skills SDK instead of reusing Android intents.", "speaker": "Sergio De Simone", "type": "contrarian", "entities": ["Apple", "Google", "App Intents", "AppFunctions", "Android"], "conviction": "low", "so_what": "Developer-friction differences could shape which mobile platform builds a richer agent ecosystem first.", "quote": "Doing it via app intents was the right move.", "locator": "User Medical_Lengthiness6 compared Apple", "quote_verified": true}]}, {"theme": "Access limits and EU restriction", "insights": [{"claim": "All Apple Intelligence features, including Siri AI, may be subject to usage limits, with extended premium access planned for the future.", "speaker": "Sergio De Simone", "type": "prediction", "entities": ["Apple Intelligence", "Siri AI", "Apple"], "conviction": "medium", "so_what": "Hints at a potential paid/premium AI tier, a new monetization lever for Apple services revenue.", "quote": null, "locator": "All Apple Intelligence features, including Siri AI", "quote_verified": false}, {"claim": "Siri AI is currently unavailable in the EU on iOS, iPadOS, and watchOS, which affects EU-based developers.", "speaker": "Sergio De Simone", "type": "data_point", "entities": ["Siri AI", "EU", "iOS", "iPadOS", "watchOS"], "conviction": "high", "so_what": "Regulatory friction keeps Apple's flagship AI features out of a major market, limiting near-term reach.", "quote": null, "locator": "All Apple Intelligence features, including Siri AI", "quote_verified": false}]}], "insight_total": 10, "top_entities": ["Apple", "Siri AI", "App Intents", "Skills", "Apple Intelligence", "TestFlight", "Google", "AppFunctions", "Live Activity", "EU"], "source_meta": {"author": "Sergio De Simone", "word_count": 945, "paywalled": false}}, {"record_id": "ec5b2efcbbe57404", "source_type": "technology", "source_name": "Hugging Face Blog", "source_url": "https://huggingface.co/blog/FINAL-Bench/which-weather-model-is-most-accurate-we-score-them", "title": "Which Weather Model Is Most Accurate? We Score Them Every Day, in the Open", "published_date": "2026-11-13", "language": "en", "processed_at": "2026-11-14T12:00:00Z", "processor": "claude-code-sub-opus", "tags": ["AI", "Tech"], "gist": "VIDRAFT launched an open, daily-updated Global Weather Model Leaderboard on Hugging Face scoring physics and AI forecast models against ERA5 across 24 cities, plus its own fusion system Darwin-Prediction-Weather. The 2026 record shows AI models (ECMWF AIFS, NOAA AIGFS) beating their physics counterparts at every lead time, and VIDRAFT claims its skill-weighted fusion model leads all four elements at 1-7 days and all 15 WeatherBench 2 cells (self-reported).", "themes": [{"theme": "Economic stakes of forecast accuracy", "insights": [{"claim": "VIDRAFT argues that small forecast improvements (one degree closer or one day earlier) change real decisions for farmers, grid operators buying power, airlines holding flights, and cities opening shelters, making weather a field where accuracy and economic value meet in one number.", "speaker": "VIDRAFT_LAB", "type": "thesis", "entities": ["VIDRAFT", "grid operator", "airline"], "conviction": "medium", "so_what": "Forecast accuracy directly feeds energy procurement, agriculture, and aviation operations, so better models have monetizable value.", "quote": "Weather prediction is one of the few fields where accuracy, science and economic value meet in the same number.", "locator": "A forecast that is one degree closer", "quote_verified": true}]}, {"theme": "AI versus physics weather models", "insights": [{"claim": "In the last three years a new generation of AI weather models trained on historical weather has arrived and now runs side by side with supercomputer physics models at the world's weather centres.", "speaker": "VIDRAFT_LAB", "type": "thesis", "entities": ["AI weather models", "physics models"], "conviction": "medium", "so_what": "Signals a structural shift in how national weather services produce forecasts, with implications for supercomputer demand versus AI compute.", "quote": null, "locator": "For decades, weather forecasts have come from physics", "quote_verified": false}, {"claim": "In the 2026 year-to-date record across 24 cities, ECMWF's AI model AIFS has lower error than ECMWF's physics model IFS at every lead time, and NOAA's AIGFS beats NOAA's GFS at every lead time.", "speaker": "VIDRAFT_LAB", "type": "data_point", "entities": ["ECMWF", "AIFS", "IFS", "NOAA", "AIGFS", "GFS"], "conviction": "high", "so_what": "Independent operational evidence that AI forecasters now outperform the flagship physics models of the two largest weather centres.", "quote": "First, AI models now lead.", "locator": "What the 2026 record shows", "quote_verified": true}]}, {"theme": "Leaderboard methodology", "insights": [{"claim": "The Global Weather Model Leaderboard records daily what each model predicted for 24 cities on six continents up to 10 days ahead, scores daily max/min temperature, max wind and precipitation by RMSE against ERA5 reanalysis, and only compares models on days and cities where all issued forecasts.", "speaker": "VIDRAFT_LAB", "type": "framework", "entities": ["Global Weather Model Leaderboard", "ERA5", "ECMWF", "NOAA", "DWD ICON", "JMA GSM", "ECCC GEM", "MET Norway"], "conviction": "medium", "so_what": "An open, continuously updated benchmark lets users judge model vendors on current-year operational skill rather than past papers.", "quote": null, "locator": "How the leaderboard works", "quote_verified": false}, {"claim": "The leaderboard's record begins 1 January 2026, and forecasts 8 to 10 days ahead will enter the ranking only as their target days are verified; planned additions include station-observation scoring, more cities and elements, and a public forecasting game.", "speaker": "VIDRAFT_LAB", "type": "prediction", "entities": ["Global Weather Model Leaderboard", "ERA5"], "conviction": "low", "so_what": "Current rankings are limited to 1-7 day leads and 24 cities, so conclusions on longer ranges are still pending.", "quote": null, "locator": "What comes next", "quote_verified": false}]}, {"theme": "Darwin-Prediction-Weather fusion model claims", "insights": [{"claim": "VIDRAFT's Darwin-Prediction-Weather produces a single forecast by skill-weighted fusion of global forecasts with local correction for temperature and wind, learning only from days whose observed value was known before the scored forecast.", "speaker": "VIDRAFT_LAB", "type": "framework", "entities": ["Darwin-Prediction-Weather", "VIDRAFT"], "conviction": "medium", "so_what": "Ensemble/fusion over public model output is a low-cost path to state-of-the-art skill, which could commoditize single-model forecast vendors.", "quote": "Nothing from the future enters.", "locator": "How Darwin-Prediction-Weather works", "quote_verified": true}, {"claim": "On VIDRAFT's own leaderboard, Darwin-Prediction-Weather has the lowest RMSE in all four elements at every lead time from 1 to 7 days, with ECMWF AIFS second in every cell; for daily max temperature it scores 0.84 C at 1 day versus AIFS 1.35 C, and 2.09 C at 7 days versus 2.41 C.", "speaker": "VIDRAFT_LAB", "type": "data_point", "entities": ["Darwin-Prediction-Weather", "ECMWF AIFS"], "conviction": "medium", "so_what": "Self-reported results on a board run by the same team; the margin over AIFS is large for temperature and wind but thin for precipitation.", "quote": "Second, fusion goes further.", "locator": "What the 2026 record shows", "quote_verified": true}, {"claim": "Darwin-Prediction-Weather's precipitation advantage is marginal, with RMSE of 4.15 mm versus AIFS 4.33 mm at 1 day and 7.11 mm versus 7.30 mm at 7 days, compared with much larger gaps for wind (2.25 vs 3.60 km/h at 1 day).", "speaker": "VIDRAFT_LAB", "type": "data_point", "entities": ["Darwin-Prediction-Weather", "ECMWF AIFS"], "conviction": "medium", "so_what": "Precipitation remains the hardest element; fusion gains concentrate in temperature and wind, relevant for energy demand and wind-power forecasting.", "quote": null, "locator": "Daily precipitation total [mm]", "quote_verified": false}, {"claim": "VIDRAFT says the same engine records the lowest error in all 15 evaluated cells of Google Research's WeatherBench 2 2020 deterministic protocol (2 m temperature, Z500 and T850 at 1-10 days), e.g. 0.468 K vs 0.488 K best official at 1-day 2 m temperature, and has submitted the entry to the WeatherBench 2 team.", "speaker": "VIDRAFT_LAB", "type": "data_point", "entities": ["WeatherBench 2", "Google Research", "Darwin-Prediction-Weather"], "conviction": "medium", "so_what": "Claim awaits official WeatherBench 2 verification; margins are small (a few percent), so treat as provisional.", "quote": null, "locator": "The same engine was also evaluated on WeatherBench 2", "quote_verified": false}, {"claim": "A Darwin-27B model with a calibrated readout serves as a decision core that turns forecast fields into decisions such as go/no-go, threshold exceedance and category probabilities.", "speaker": "VIDRAFT_LAB", "type": "framework", "entities": ["Darwin-27B", "VIDRAFT"], "conviction": "low", "so_what": "Points to a productization path selling decision support, not raw forecasts, to weather-sensitive businesses.", "quote": null, "locator": "Decision core", "quote_verified": false}, {"claim": "The leaderboard app is Apache 2.0 licensed, but the compiled daily record and the Darwin-Prediction-Weather model are CC BY-NC 4.0, non-commercial only, with commercial use requiring contact with VIDRAFT.", "speaker": "VIDRAFT_LAB", "type": "data_point", "entities": ["VIDRAFT", "Darwin-Prediction-Weather", "Open-Meteo"], "conviction": "high", "so_what": "The open-data framing masks a commercial licensing model; enterprises cannot use the model or data without a deal.", "quote": null, "locator": "License and contact", "quote_verified": false}]}], "insight_total": 11, "top_entities": ["Darwin-Prediction-Weather", "VIDRAFT", "ECMWF", "NOAA", "Global Weather Model Leaderboard", "ERA5", "ECMWF AIFS", "grid operator", "airline", "AI weather models"], "source_meta": {"author": "VIDRAFT_LAB", "word_count": 1225, "paywalled": false}}, {"record_id": "ee984769af20e600", "source_type": "technology", "source_name": "Benchmark Minerals", "source_url": "https://source.benchmarkminerals.com/video/watch/panel-cross-border-capital-global-financial-coalitions-in-critical-minerals", "title": "Panel: Cross Border Capital in Critical Minerals", "published_date": "2026-11-10", "language": "en", "processed_at": "2026-11-14T12:00:00Z", "processor": "claude-code-sub-opus", "tags": ["Energy", "Geopolitics", "Positioning"], "gist": "Member-only video page for a 34-minute Benchmark Week 2026 panel on cross-border capital in critical minerals, with Jefferies, Standard Chartered, NEO Capital and Benchmark's Adam Panayi. It covered cross-border capital, multilateral offtake agreements and international ESG standards for critical mineral supply chains. No transcript or conclusions are given.", "themes": [{"theme": "Financing critical mineral supply chains across borders", "insights": [{"claim": "A Benchmark Week 2026 panel had investors, miners, processors and banks discuss cross-border capital, multilateral offta // ---------- helpers ----------
// YouTube-aligned hex colors for tinted insight chips (bg = color+"1a", text = color, border = color+"55").
const TYPE_HEX = {
  thesis: '#6366f1', prediction: '#0ea5e9', framework: '#8b5cf6',
  data_point: '#7c3aed', causal: '#d97706', contrarian: '#dc2626',
  anecdote: '#64748b',
};
const CONV_HEX = { high: '#7c3aed', medium: '#ca8a04', low: '#94a3b8', exploratory: '#94a3b8' };
function typeHex(t) { return TYPE_HEX[String(t || '').toLowerCase()] || '#475569'; }
function convHex(c) { return CONV_HEX[String(c || '').toLowerCase()] || '#64748b'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

// Tinted chip (YouTube style): faint bg, colored text + border.
function tintChip(text, color) {
  return `<span class="chip" style="background:${color}1a;color:${color};border-color:${color}55">${escapeHtml(text)}</span>`;
}
function tagPills(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => `<span class="pill tag">${escapeHtml(t)}</span>`).join(' ');
}

// ---------- rendering ----------
// Insight presentation ported from the YouTube digest: type/conviction tinted
// chips, speaker as a 🗣 chip, and entities as indigo chips — all in the meta row
// directly under the claim. Quote treatment is INTENTIONALLY kept as Concepts'
// verbatim + "✓ verified" (stronger than YouTube's ≈ paraphrase wording).
function renderInsight(ins) {
  if (!ins) return '';
  const cls = 'insight' + (ins.type ? (' ' + String(ins.type).toLowerCase()) : '');
  const meta = [];
  if (ins.type) meta.push(tintChip(ins.type, typeHex(ins.type)));
  if (ins.speaker) meta.push(`<span class="chip chip-spk">🗣 ${escapeHtml(ins.speaker)}</span>`);
  if (ins.conviction) meta.push(tintChip('conviction: ' + ins.conviction, convHex(ins.conviction)));
  (ins.entities || []).slice(0, 12).forEach(e => {
    if (e) meta.push(`<span class="chip chip-ent">${escapeHtml(e)}</span>`);
  });
  let quote = '';
  if (ins.quote) {
    const v = ins.quote_verified
      ? `<span class="vmark">✓ verified</span>`
      : `<span class="vmark no">unverified</span>`;
    quote = `<div class="quote">“${escapeHtml(ins.quote)}”${v}</div>`;
  }
  const so = ins.so_what
    ? `<div class="insight-so"><span class="lbl">so what</span>${escapeHtml(ins.so_what)}</div>` : '';
  return `
    <div class="${cls}">
      <div class="insight-claim">${escapeHtml(ins.claim || '')}</div>
      <div class="insight-meta">${meta.join('')}</div>
      ${so}
      ${quote}
    </div>`;
}

function renderTheme(theme) {
  const insights = (theme.insights || []).map(renderInsight).join('');
  return `
    <div class="theme">
      <div class="theme-title">${escapeHtml(theme.theme || 'Theme')}</div>
      ${insights}
    </div>`;
}

function renderCard(card) {
  if (!card) return '';
  const meta = card.source_meta || {};
  const nameHtml = card.source_url
    ? `<a class="source-name" href="${escapeAttr(card.source_url)}" target="_blank" rel="noopener">${escapeHtml(card.source_name || '')}</a>`
    : `<span class="source-name">${escapeHtml(card.source_name || '')}</span>`;
  const subBits = [];
  if (card.published_date) subBits.push(escapeHtml(card.published_date));
  if (meta.author) subBits.push(escapeHtml(meta.author));
  if (meta.word_count) subBits.push(`${meta.word_count} words`);
  if (meta.paywalled) subBits.push('paywalled');
  const themes = (card.themes || []).map(renderTheme).join('');
  const n = card.insight_total != null ? card.insight_total
            : (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
  return `
    <div class="source">
      <div class="source-head" onclick="toggleSource(this)">
        <div class="source-meta-left">
          <div class="source-name-row">${nameHtml}</div>
          <div class="source-title">${escapeHtml(card.title || '')}</div>
          <div class="source-sub">${subBits.join('  ·  ')}</div>
        </div>
        <span class="source-count">${n} insight${n === 1 ? '' : 's'}</span>
        <span class="source-arrow">▸</span>
      </div>
      <div class="source-body">
        ${card.gist ? `<div class="gist">${escapeHtml(card.gist)}</div>` : ''}
        ${card.tags && card.tags.length ? `<div class="tags">${tagPills(card.tags)}</div>` : ''}
        ${themes || '<div class="empty">No insights.</div>'}
      </div>
    </div>`;
}

function renderTopStats(d) {
  const s = d.stats || {};
  const parts = [];
  if (d.date) parts.push(`date <strong>${escapeHtml(d.date)}</strong>`);
  if (s.lookback_days != null) parts.push(`lookback <strong>${s.lookback_days}d</strong>`);
  if (s.sources != null) parts.push(`sources <strong>${s.sources}</strong>`);
  if (s.cards != null) parts.push(`cards <strong>${s.cards}</strong>`);
  if (s.insights != null) parts.push(`insights <strong>${s.insights}</strong>`);
  if (s.quote_verified_pct != null) parts.push(`quotes verified <strong>${s.quote_verified_pct}%</strong>`);
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSource(headEl) { headEl.parentElement.classList.toggle('open'); }

function insightCount(card) {
  return (card.themes || []).reduce((a, t) => a + ((t.insights || []).length), 0);
}

// Build the sort/filter control bar (display only — re-groups REPORT_DATA in place).
function buildControls(d) {
  const cards = d.cards || [];
  const names = [...new Set(cards.map(c => c.source_name || '—'))].sort((a, b) => a.localeCompare(b));
  const opts = names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('');
  document.getElementById('controls').innerHTML =
    `<label>Sort
       <select id="sortSel">
         <option value="source">Source A–Z</option>
         <option value="insights">Insight count ▼</option>
       </select></label>
     <label>Source
       <select id="srcSel">
         <option value="__all">All sources (${names.length})</option>
         ${opts}
       </select></label>
     <span class="ctl-btns">
       <button type="button" id="expandAll">Expand all</button>
       <button type="button" id="collapseAll">Collapse all</button>
     </span>`;
  document.getElementById('sortSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('srcSel').addEventListener('change', () => renderGroups(d));
  document.getElementById('expandAll').addEventListener('click', () => setAllGroups(false));
  document.getElementById('collapseAll').addEventListener('click', () => setAllGroups(true));
}

// Group-level collapse: header click toggles one group; the control-bar buttons toggle all.
function toggleGroup(headEl) { headEl.parentElement.classList.toggle('collapsed'); }
function setAllGroups(collapsed) {
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('collapsed', collapsed));
}

// Group cards by source, sort groups (and cards within), optionally filter to one source.
function renderGroups(d) {
  const sortMode = (document.getElementById('sortSel') || {}).value || 'source';
  const srcFilter = (document.getElementById('srcSel') || {}).value || '__all';
  let cards = (d.cards || []).slice();
  if (srcFilter !== '__all') cards = cards.filter(c => (c.source_name || '—') === srcFilter);

  const groups = new Map();
  cards.forEach(c => {
    const k = c.source_name || '—';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  });
  let entries = [...groups.entries()].map(([name, cs]) => ({
    name, cards: cs, insights: cs.reduce((a, c) => a + insightCount(c), 0),
  }));
  if (sortMode === 'insights') entries.sort((a, b) => b.insights - a.insights || a.name.localeCompare(b.name));
  else entries.sort((a, b) => a.name.localeCompare(b.name));
  // Within each source group, heaviest cards first.
  entries.forEach(e => e.cards.sort((a, b) => insightCount(b) - insightCount(a)));

  const html = entries.map(e => {
    const head = `<div class="group-head" onclick="toggleGroup(this)">`
      + `<span class="group-name">${escapeHtml(e.name)}</span>`
      + `<span class="group-meta">${e.cards.length} card${e.cards.length === 1 ? '' : 's'} · ${e.insights} insights</span>`
      + `<span class="group-arrow">▾</span></div>`;
    return `<div class="group">${head}<div class="group-body">${e.cards.map(renderCard).join('')}</div></div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = html || '<div class="empty">No cards for this source.</div>';
  // Open the first two source cards by default.
  document.querySelectorAll('.source').forEach((sec, i) => { if (i < 2) sec.classList.add('open'); });
}

// ---------- main ----------
function renderReport(d) {
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  document.getElementById('stats-top').innerHTML = renderTopStats(d);
  buildControls(d);
  renderGroups(d);   // default: grouped, sorted by source A–Z
}
