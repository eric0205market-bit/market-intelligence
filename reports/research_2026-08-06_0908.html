  {id:1, cat:"gold", urgency:"act", source:"Bloomberg Points of Return (John Authers)",

  {id:3, cat:"geopolitics", urgency:"act", source:"Dark Side of the Boom",

   idea:"An Iran-Oman arrangement to reopen the Strait of Hormuz would lower oil and ease inflation pressure, and markets want it. But any deal that looks like it preserves Iranian leverage over Hormuz risks domestic political backlash, since Washington entered the conflict with far broader demands (nuclear program, missiles, proxy network) before narrowing to just reopening the strait. That sets up a repeating cycle risk: tentative deal → oil falls → political pressure builds → US pulls back toward escalation → oil rebounds → inflation expectations reverse.",

  {id:5, cat:"AI/infra", urgency:"deep", source:"Dark Side of the Boom",
   title:"White House just exempted open-weight AI models from safety review — Morgan Stanley says that changes where the AI infrastructure spend lands",
   idea:"Morgan Stanley's \"Weighing In\" maps three AI outcomes: closed models stay dominant, a hybrid architecture emerges (frontier models for hard reasoning, open models absorb repetitive/domain workloads), or open-weight models converge with the frontier and commoditize model intelligence. Nvidia wins in all three scenarios, but the open-weight path shifts capex from giant training clusters toward inference, private cloud, on-prem, edge and orchestration/cybersecurity. Timing: the Trump administration just excluded open-weight models from its voluntary prerelease safety-testing framework, and Moonshot AI's Kimi K3 shipped downloadable weights claiming near-frontier performance.",
   angle:"A regulatory carve-out plus a credible open-weight frontier model (Kimi K3) is a live catalyst for the 'model intelligence becomes commodity' scenario — bearish for API-margin bulls (OpenAI/Anthropic pricing power), bullish for the picks-and-shovels layer (inference chips, orchestration, edge, cyber) regardless of which scenario wins.",
   tweetA:"The White House just told AI labs: open-weight models don't need our safety review. Combine that with Kimi K3 shipping near-frontier weights for free, and you have a live regulatory tailwind for the exact scenario that kills API pricing power. $NVDA wins either way — the fight is over who captures the margin above it.",
   tweetB:"Morgan Stanley's three AI scenarios all agree on one thing: Nvidia is fine. The real dispersion is in who gets left holding expensive training clusters if intelligence commoditizes. If open-weight wins, the money moves to inference and orchestration — a very different set of tickers than today's AI trade.",
   charts:{count:0, hot:false, desc:"Charts inside — worth opening (Morgan Stanley scenario diagrams)."},
   link:"https://thedarksideoftheboom.substack.com/p/what-if-open-weight-models-win-the"},

  {id:6, cat:"gold", urgency:"deep", source:"Dark Side of the Boom",

   idea:"Gold historically tracked Japanese long-end yields closely, until a speculative overshoot pushed gold well above that relationship; the excess unwound, but JGB long yields kept climbing, leaving gold well below where the old relationship would imply. When JGB yields and gold rise together — instead of the normal inverse relationship where higher yields hurt non-yielding gold — it can signal anxiety about sovereign debt sustainability, central-bank credibility, and the unwind of ultra-cheap yen funding structures, not just a rates story.",
   angle:"A distinct, less-crowded read on gold than the dollar/real-yield framing dominating the rest of this morning's newsletters — a Japan-specific fiscal-credibility signal worth tracking against JGB auctions and BOJ policy separately from the Fed narrative.",
   tweetA:"Gold and Japanese long bond yields are supposed to move opposite each other. They're rising together right now. That combination has historically meant one thing: markets losing faith in sovereign debt itself, not just repricing a rate path. Watch JGB auctions, not just the Fed, for gold's next leg.",
   tweetB:"Everyone's explaining gold through the Fed. The more interesting tell is in Tokyo: JGB yields climbing alongside gold instead of against it usually shows up right before a funding-structure unwind. The yen-carry unwind story didn't end in July — it might just be starting.",

  {id:9, cat:"macro", urgency:"deep", source:"Bloomberg Points of Return (John Authers)",
   title:"Warsh is quietly trying to redefine what 'inflation' even means at the Fed",
   idea:"New Fed Chair Kevin Warsh appointed five task forces, including ones reviewing data and inflation-framework methodology, and has hinted at looking at \"a broader set of data\" than core PCE. TS Lombard's Dario Perkins argues the real bottleneck is structural: the Fed has two mandates (inflation and employment) but one instrument (rates), forcing it to implicitly target the output gap regardless of which inflation gauge it uses. Oxford Economics' Bernard Yaros warns changing the target now would look like \"moving the goalposts\" and cost credibility.",
   angle:"If the Fed changes how it measures the thing it's targeting before actually hitting 2%, that's a credibility risk priced nowhere right now — worth watching Fed messaging around the task-force outputs as a potential vol catalyst independent of the data itself.",

   tweetB:"The Fed has one tool (rates) and two jobs (inflation, employment). Every 'let's rethink our inflation framework' conversation is really a proxy fight over which mandate wins when they conflict. That's the real subtext of Warsh's task forces.",
   charts:{count:1, hot:false, desc:"Chart of Fed credibility vs. core PCE overshoot referenced in the piece."},

   angle:"This is Europe's version of the UK/US auto-enrollment default effect — a structural, multi-decade flow into equities via life-cycle funds, funneling a chunk of Italy's roughly two-thirds unenrolled workforce into markets starting mid-2026, similar to what UK NEST and US 401(k) auto-enrollment did to flows.",

const META = {
  date: "2026-08-06",
  time: "09:08 CEST",
  windowStart: "2026-08-06 03:08 CEST",
  windowEnd: "2026-08-06 09:08 CEST",
  emailsInWindow: 10,
  emailsRead: 10,
  itemsExtracted: 16,
  includedSources: [
    {name:"Dark Side of the Boom", count:6},
    {name:"Bloomberg Points of Return (John Authers)", count:5},
    {name:"TMAD (Trading Mindset and Data)", count:2},
    {name:"DTI Newsletter", count:1},
    {name:"Michael Parekh (AI-RTZ)", count:1},
    {name:"BowTiedBull", count:1}
  ],
  skippedSources: [
    {name:"MacroEdge", reason:"Pure promotional announcement of new paid subscription tiers (Oil & Gas Research, Portfolio Strategy) with pricing and launch dates — no market analysis, data, or thesis."}
  ]
};

let activeCat = "all";
let activeUrg = "all";
let activeSrc = null;

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function urgLabel(u){
  if(u==="act") return "🔴";
  if(u==="deep") return "🔵";
  return "🟡";
}
function urgFull(u){
  if(u==="act") return "🔴 Act Now";
  if(u==="deep") return "🔵 Deep";
  return "🟡 Watch";
}

function buildFilterBars(){
  const catCounts = {};
  ITEMS.forEach(function(i){ catCounts[i.cat] = (catCounts[i.cat]||0)+1; });
  const catBar = document.getElementById('catBar');
  let html = '<button class="pill" data-cat="all" onclick="setCat(\'all\')">All <span class="cnt">' + ITEMS.length + '</span></button>';
  Object.keys(catCounts).sort().forEach(function(c){
    const color = CATEGORY_COLORS[c] || "#888";
    html += '<button class="pill" data-cat="' + esc(c) + '" style="--pillcolor:' + color + '" onclick="setCat(\'' + c.replace(/'/g,"\\'") + '\')">' + esc(c) + ' <span class="cnt">' + catCounts[c] + '</span></button>';
  });
  catBar.innerHTML = html;

  const urgCounts = {act:0, deep:0, watch:0};
  ITEMS.forEach(function(i){ urgCounts[i.urgency] = (urgCounts[i.urgency]||0)+1; });
  const urgBar = document.getElementById('urgBar');
  let uhtml = '<button class="pill" data-urg="all" onclick="setUrg(\'all\')">All <span class="cnt">' + ITEMS.length + '</span></button>';
  uhtml += '<button class="pill" data-urg="act" onclick="setUrg(\'act\')">🔴 Act Now <span class="cnt">' + urgCounts.act + '</span></button>';
  uhtml += '<button class="pill" data-urg="deep" onclick="setUrg(\'deep\')">🔵 Deep <span class="cnt">' + urgCounts.deep + '</span></button>';
  uhtml += '<button class="pill" data-urg="watch" onclick="setUrg(\'watch\')">🟡 Watch <span class="cnt">' + urgCounts.watch + '</span></button>';
  urgBar.innerHTML = uhtml;
}

function setCat(c){
  activeCat = c;
  activeSrc = null;
  refreshPills();
  renderCards(true);
}
function setUrg(u){
  activeUrg = u;
  activeSrc = null;
  refreshPills();
  renderCards(true);
}
function filterBySrc(name){
  activeCat = "all";
  activeUrg = "all";
  activeSrc = name;
  refreshPills();
  renderCards(false, true);
}

function refreshPills(){
  document.querySelectorAll('#catBar .pill').forEach(function(p){
    const c = p.getAttribute('data-cat');
    if(c === activeCat && !activeSrc){
      p.classList.add('active');
      p.style.background = c === 'all' ? '#333' : (CATEGORY_COLORS[c] || '#888');
    } else {
      p.classList.remove('active');
      p.style.background = 'transparent';
    }
  });
  document.querySelectorAll('#urgBar .pill').forEach(function(p){
    const u = p.getAttribute('data-urg');
    if(u === activeUrg && !activeSrc){
      p.classList.add('active');
      p.style.background = '#333';
    } else {
      p.classList.remove('active');
      p.style.background = 'transparent';
    }
  });
}

function renderCards(collapseAll, expandMatches){
  const container = document.getElementById('cards');
  let list = ITEMS;
  if(activeSrc){
    list = ITEMS.filter(function(i){ return i.source.indexOf(activeSrc) !== -1; });
  } else {
    if(activeCat !== "all") list = list.filter(function(i){ return i.cat === activeCat; });
    if(activeUrg !== "all") list = list.filter(function(i){ return i.urgency === activeUrg; });
  }

  let html = '';
  list.forEach(function(item){
    const color = CATEGORY_COLORS[item.cat] || "#888";
    const chartFlag = item.charts && (item.charts.count > 0 || item.charts.hot) ? (item.charts.hot ? '🔥' : '📊') : '';
    const openClass = expandMatches ? ' open' : '';
    html += '<div class="card' + openClass + '" id="card-' + item.id + '">';
    html += '<div class="card-header" onclick="toggleCard(' + item.id + ')">';
    html += '<span class="idx">' + String(item.id).padStart(2,'0') + '</span>';
    html += '<span class="urg">' + urgLabel(item.urgency) + '</span>';
    html += '<span class="badge" style="background:' + color + '">' + esc(item.source) + '</span>';
    html += '<span class="cattag">' + esc(item.cat) + '</span>';
    if(chartFlag) html += '<span class="flag">' + chartFlag + '</span>';
    html += '<span class="title">' + esc(item.title) + '</span>';
    html += '</div>';

    html += '<div class="card-body">';
    html += '<div class="sec-label">The Idea</div>';
    html += '<div class="idea-text">' + esc(item.idea) + '</div>';
    html += '<div class="sec-label">My Angle</div>';
    html += '<div class="angle-box" style="border-left-color:' + color + ';">' + esc(item.angle) + '</div>';
    html += '<div class="tweets">';
    html += '<div class="tweet"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + esc(item.tweetA) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>';
    html += '<div class="tweet"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + esc(item.tweetB) + '</div><button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>';
    html += '</div>';

    if(item.charts && (item.charts.count > 0 || item.charts.desc)){
      html += '<div class="charts-row">Charts: ' + item.charts.count + (item.charts.hot ? ' — 🔥 CHART WORTH SAVING' : '');
      html += '<div class="chart-box' + (item.charts.hot ? ' hot' : '') + '">' + esc(item.charts.desc || '') + '</div></div>';
    }

    html += '<div class="link-row"><a href="' + esc(item.link) + '" target="_blank" rel="noopener">↗ Read full article</a></div>';
    html += '</div>'; // card-body
    html += '</div>'; // card
  });

  if(list.length === 0){
    html = '<p style="color:#888;font-size:14px;">No items match this filter.</p>';
  }

  container.innerHTML = html;
}

function toggleCard(id){
  const el = document.getElementById('card-' + id);
  if(el) el.classList.toggle('open');
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function buildReport(){
  document.getElementById('metaLine').textContent =
    META.date + ' · ' + META.time + ' · ' + META.itemsExtracted + ' items from ' + META.includedSources.length + ' sources';

  let html = '<h4>Time Window</h4>';
  html += '<div>' + esc(META.windowStart) + ' → ' + esc(META.windowEnd) + '. Emails outside this window were not processed.</div>';

  html += '<h4>Emails</h4>';
  html += '<div>' + META.emailsInWindow + ' emails in window · ' + META.emailsRead + ' read · ' + META.itemsExtracted + ' items extracted.</div>';

  html += '<h4>Included Sources</h4>';
  META.includedSources.forEach(function(s){
    html += '<div><span class="src-link" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + esc(s.name) + '</span> — ' + s.count + ' item' + (s.count===1?'':'s') + '</div>';
  });

  html += '<h4>Skipped Sources</h4>';
  META.skippedSources.forEach(function(s){
    html += '<div>' + esc(s.name) + ' — ' + esc(s.reason) + '</div>';
  });

  document.getElementById('reportBody').innerHTML = html;
}

buildFilterBars();
refreshPills();
renderCards();
buildReport();
</script>
</body>
</html>
