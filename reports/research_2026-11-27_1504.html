<script>
const ITEMS = [{"cat": "geopolitics", "urgency": "act", "source": "The Dark Side of the Boom / Stephen Innes — China's Plunge-Protection Team", "title": "Lunch-break intervention: CSI 300 +4% (best day since Oct 2024), Star 50 +14%, HS Tech +6%", "idea": "Beijing's State Council issued a market-support message during Friday's midday break instead of waiting for the close. It pledged a stronger national-team role, more long-term institutional money, and support for dividends and buybacks. The CSI 300 rose as much as 4%, its biggest gain since October 2024. The chip-heavy Star 50 jumped 14% and the Hang Seng Tech Index more than 6%, all from bear-market levels.", "angle": "A 14% one-day move in Star 50 points to short covering in crowded Chinese AI names, not new money. Fade strength if the November PMIs come in contractionary as expected.", "tweetA": "Star 50 +14% in one session on a statement with no money attached. That isn't a re-rating. It's the shorts discovering the national team has a lunch break too. $KWEB $FXI", "tweetB": "Korea propped up its chip giants on Monday. Taiwan tightened short-selling rules. Beijing jawboned at midday on Friday. When three Asian governments defend AI-linked equities in one week, the AI drawdown has become a policy problem. That's a floor, not a bull case.", "charts": {"count": 2, "hot": false, "desc": "Header image plus one inline market chart (likely CSI 300 / Star 50 intraday). Charts inside, worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/chinas-plunge-protection-team-gets", "id": 1}, {"cat": "geopolitics", "urgency": "deep", "source": "The Dark Side of the Boom / Stephen Innes — China's Plunge-Protection Team", "title": "Nothing new was announced: no funding, no purchase targets, no timetable", "idea": "Innes notes that 'very little of this was actually new'. There were no new funding commitments, no specific purchase targets and no implementation timetable. Beijing restated its willingness to support the market, with enough authority that selling into the afternoon looked unwise. Earlier liquidity facilities and state-fund buying had 'done little more than interrupt the decline'.", "angle": "Rallies driven by tone and not money have a short half-life in China (Oct 2024 is the template). Use them to rotate, not to add.", "tweetA": "Count what Beijing committed today: zero yuan, zero targets, zero dates. Count what the market added: about 4% on the CSI 300. That ratio is what a market that wanted an excuse to cover looks like.", "tweetB": "October 2024 was the last time the CSI 300 had a day like this. Within weeks it gave most of it back. Same playbook, same lack of fiscal follow-through. I'd want to see a funded vehicle before I believed a second time.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/chinas-plunge-protection-team-gets", "id": 2}, {"cat": "AI/infra", "urgency": "act", "source": "The Dark Side of the Boom / Stephen Innes — China's Plunge-Protection Team", "title": "Cambricon and Zhongji Innolight +17% each as China's AI complex snaps back", "idea": "Tech led the rebound. Cambricon Technologies and Zhongji Innolight each rose more than 17%. Investors had cut exposure to China's AI stocks hard as Washington tightened access to advanced semiconductors. The bounce shows how crowded the short side had become.", "angle": "Innolight is a global 800G/1.6T optics supplier, so its move partly reflects global AI capex sentiment, not only Beijing. Check for read-across to $COHR, $LITE and $FN on Monday.", "tweetA": "Innolight +17% is the tell. It doesn't depend on Chinese GPUs. It ships optics to US hyperscalers. When a global supplier rips on a Beijing headline, you're watching positioning unwind, not fundamentals. Watch $COHR $LITE on Monday.", "tweetB": "Cambricon is the Chinese stand-in for Nvidia, and its rally came on the same day Washington made B300 remote access harder. The market is pricing 'China must build its own'. That makes US export controls bullish for Cambricon's order book.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/chinas-plunge-protection-team-gets", "id": 3}, {"cat": "positioning", "urgency": "watch", "source": "The Dark Side of the Boom / Stephen Innes — China's Plunge-Protection Team", "title": "State-backed ETF purchases hit a daily record last week and still only limited intraday losses", "idea": "State-backed ETF purchases reportedly set a daily record last week, but that intervention 'initially did little more than limit intraday losses'. The open question is whether the national team's more visible presence draws in private buyers or simply provides liquidity whenever the market threatens to break.", "angle": "Record state buying that can't lift prices means private sellers were still in control. The test is whether southbound and northbound flows follow next week.", "tweetA": "Record national-team ETF buying last week, and the market still couldn't hold. Then a statement with no money behind it does the job. China's market reacts to signals more than to flows, and that makes rallies hard to underwrite.", "tweetB": "When the state is the marginal buyer of index ETFs, you can't easily see private demand. Watch dispersion. If only the ETF constituents rally, the national team is the only buyer.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/chinas-plunge-protection-team-gets", "id": 4}, {"cat": "macro", "urgency": "deep", "source": "The Dark Side of the Boom / Stephen Innes — FX Daily: Deutsche Bank's Chip Dollar", "title": "Deutsche Bank: global semiconductor trade now exceeds oil and gas trade, so 'petrodollar' becomes 'chip dollar'", "idea": "Deutsche Bank's FX team (Saravelos, Gopal, Sachdeva, Baker) says global chip trade has overtaken oil and gas trade. Northeast Asian surpluses (Korea, Taiwan, Japan, SE Asia) built on AI capex demand are being recycled into US equities, especially AI tech. Under the petrodollar system the money went into Treasuries. The flows go round a loop: US AI spending, Asian chip surpluses, then purchases of US tech stocks.", "angle": "This is a reflexive loop. If AI capex slows, Asian surpluses shrink, which cuts the marginal buyer of US tech, which hurts AI equities, which slows capex. The dollar sits in the middle of that loop.", "tweetA": "Petrodollars bought Treasuries and funded the deficit. Chip dollars buy $NVDA and fund the capex that buys more chips. One loop was stabilising. The other is reflexive. Same dollar, very different tail risk.", "tweetB": "Taiwan's and Korea's trade surpluses are now basically a derivative of hyperscaler capex guidance. Watch the $TWD and KRW on Microsoft and Meta earnings days. That's where the chip dollar will show up first.", "charts": {"count": 1, "hot": false, "desc": "Header image (Deutsche Bank Rate Check). Charts inside, worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/fx-daily-deutsche-banks-ai-dollar", "id": 5}, {"cat": "positioning", "urgency": "deep", "source": "The Dark Side of the Boom / Stephen Innes — FX Daily: Deutsche Bank's Chip Dollar", "title": "Foreigners bought ~$1.5T of US equities in 18 months and didn't rebalance", "idea": "DB estimates foreign investors bought about $1.5T of US equities over the past 18 months, an unprecedented amount. They kept buying actively even as rising prices increased their existing exposure, which is the opposite of normal rebalancing. Data through September showed no slowdown. The risk is not liquidation. It is foreigners deciding they own enough, which would remove the dollar's marginal buyer.", "angle": "$1.5T over 18 months is about $83B a month. You don't need selling for this flow to hurt. A flat month would be a large negative change for $SPY and for the dollar.", "tweetA": "$1.5T in 18 months is ~$83B a month of foreign buying into US stocks, against trend, with no rebalancing. The bear case isn't that they sell. It's that they stop. Going from $83B to zero is a bigger shock to the flows than most sell-offs.", "tweetB": "Everyone asks whether the Fed will save the AI trade. The better question is whether Tokyo, Taipei and Seoul keep wiring $80B a month into it. The marginal buyer of US megacaps isn't domestic anymore.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/fx-daily-deutsche-banks-ai-dollar", "id": 6}, {"cat": "macro", "urgency": "watch", "source": "The Dark Side of the Boom / Stephen Innes — FX Daily: Deutsche Bank's Chip Dollar", "title": "S&P vol is ~3x Treasuries and SOX ~10x, so a dollar backed by equity flows inherits equity vol", "idea": "DB estimates realised S&P 500 volatility is about 3x that of Treasuries, and the Philadelphia Semiconductor Index about 10x. If dollar demand comes more from foreign purchases of tech shares, the dollar may take on that instability. DB thinks FX options markets have not yet priced this change in implied vol, risk reversals and correlations.", "angle": "If DB is right, long-dated USD vol (e.g. EUR/USD and USD/JPY 1y risk reversals) is cheap relative to the new regime. You could hold that as a hedge for an AI drawdown.", "tweetA": "Here's a trade nobody's pitching: if the marginal dollar buyer is a foreign $SOXX holder, USD vol should trade with semis vol. It doesn't yet. Long-dated FX vol looks like the cheapest AI-crash hedge on the screen.", "tweetB": "The dollar used to be backed by Treasuries, with 1x vol. Now it's partly backed by semis, with 10x. The reserve currency's marginal source of demand is ten times more volatile than it was a decade ago, and FX options still price it like 2015.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/fx-daily-deutsche-banks-ai-dollar", "id": 7}, {"cat": "macro", "urgency": "deep", "source": "The Dark Side of the Boom / Stephen Innes — FX Daily: Deutsche Bank's Chip Dollar", "title": "November: S&P -8% in a week, SOX -17%, and the dollar still rallied", "idea": "In November's correction the S&P 500 fell more than 8% in a week and the SOX about 17%. The dollar strengthened, as the familiar reflex predicts. AUD and EM FX were hit hardest. DB says the dollar has risen more than rate differentials alone justify, and asks whether the safe-haven reflex holds if foreigners treat a US equity crash as a reason to cut US exposure.", "angle": "A slow AI deflation is dollar-bearish, while a fast crash is dollar-bullish because of the scramble for liquidity. How fast the adjustment happens decides the sign of the dollar's move.", "tweetA": "The dollar rallied into a 17% semis crash. Good. Now ask what happens in a slow 17% grind over six months. No liquidity scramble, just foreigners quietly not topping up. The fast crash is dollar-bullish. The slow bleed is the real dollar-bear scenario.", "tweetB": "$AUD got smashed in the AI drawdown, not because of China or iron ore but because it's the G10's risk-beta proxy. If the Star 50 +14% day sticks, AUD is the cleanest rebound trade in FX.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/fx-daily-deutsche-banks-ai-dollar", "id": 8}, {"cat": "macro", "urgency": "deep", "source": "The Dark Side of the Boom / Stephen Innes — FX Daily: Deutsche Bank's Chip Dollar", "title": "DB expects three straight Fed hikes, with EUR/USD at 1.08 by mid-2027 before 1.15 at year-end", "idea": "With core PCE drifting above 3% (tariff pass-through, energy, demand), DB's economists expect three consecutive Fed rate hikes. That would put the dollar back near the top of the G10 by yield. DB thinks the dollar is stretched against rate differentials in the short term, but forecasts EUR/USD at 1.08 by mid-2027 before it recovers to 1.15 by year-end. Its S&P 500 target is 9,000 for end-2027, and the German composite PMI is at a four-year high.", "angle": "DB is calling for three hikes and S&P 9,000 at the same time. Either the AI earnings engine survives a 4.5%+ funds rate, or one of those forecasts breaks. That's the 2027 base case to stress-test.", "tweetA": "Deutsche wants three Fed hikes AND S&P 9,000 in the same 2027 deck. Pick one. Equities have never re-rated up into a hiking cycle that takes real rates this positive with capex funded by debt.", "tweetB": "The German composite PMI is at a four-year high, and EUR/USD is still forecast at 1.08. A US hiking cycle can beat a European cyclical recovery, but only until the ECB starts talking hikes too. Watch Bund–UST 2y spreads.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/fx-daily-deutsche-banks-ai-dollar", "id": 9}, {"cat": "macro", "urgency": "watch", "source": "The Dark Side of the Boom / Stephen Innes — FX Daily: Deutsche Bank's Chip Dollar", "title": "Japan's $5T offshore portfolio: JGBs near 3% and BoJ at 1.25%; DB sees USD/JPY at 145 by end-2027", "idea": "Japanese investors hold about $5T of overseas portfolio assets. JGB yields are near 3%, the BoJ policy rate is 1.25%, and domestic needs (defence, energy, tech) are growing, so DB argues more capital stays home or returns. The yen has been more defensive on the crosses than USD/JPY in the high 150s suggests. Its best regime (UST yields and US equities falling together) had been occurring at about half its usual frequency but has come back over the past five weeks. DB targets USD/JPY 145 for end-2027.", "angle": "A 1% shift in Japan's offshore book is about $50B, about two-thirds of a month of the foreign US-equity buying DB describes. Japan repatriation and the end of the chip dollar are the same trade from two sides.", "tweetA": "Japan owns $5T abroad. Repatriating just 1% is $50B, more than half a month of the foreign buying that's been propping up US megacaps. Yen strength and US tech weakness aren't two trades. They're one. $FXY", "tweetB": "The best yen setup is bonds and stocks falling together. It had become half as common, and it has come back over the past five weeks. That isn't noise. Either the stock-bond correlation is turning positive again, or the market is starting to price stagflation.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/fx-daily-deutsche-banks-ai-dollar", "id": 10}, {"cat": "AI/infra", "urgency": "deep", "source": "AI Supremacy / Michael Spencer + Michael Fritzell — Claude Equity Research", "title": "Claude's equity-research plugin: 9 slash commands from /screen to /morning-note produce 28-page initiations", "idea": "Michael Fritzell (Asian Century Stocks) tested Anthropic's equity-research plugin on InBody (041830 KS, US$388M). There are nine commands: /screen, /initiate, /sector, /model-update, /earnings, /earnings-preview, /catalysts, /thesis and /morning-note. /initiate produced a 28-page report (6–8k words). /earnings produced 3–5k words with IRR estimates. /model-update built an Excel model. The plugin runs on the $20/month plan. His verdict: the grunt work 'can now be replaced'. He expects fewer analysts to be hired rather than mass layoffs.", "angle": "This compresses the cost of sell-side coverage toward zero for small and mid caps. Expect coverage of under-followed names (Asia small caps, European micro caps) to grow, and the information edge from them to shrink.", "tweetA": "A 28-page initiation on a $388M Korean small cap for $20 a month. The 'underfollowed' premium in Asian small caps rested on the cost of coverage. That cost just fell by about 99%. The alpha goes with it.", "tweetB": "Fritzell's line: 'fewer analysts will be hired' rather than mass layoffs. That's exactly how automation hits a profession: the junior pipeline dries up first. In five years, who trains the PMs?", "charts": {"count": 19, "hot": true, "desc": "19 images: slash-command menus, screenshots of the GLP-1 screen output (7 Asian names), InBody initiation pages, Excel model and catalyst calendar. The screenshot of the generated screen is worth saving"}, "link": "https://www.ai-supremacy.com/p/claude-empowering-retail-investors", "id": 11}, {"cat": "AI/infra", "urgency": "deep", "source": "AI Supremacy / Michael Spencer + Michael Fritzell — Claude Equity Research", "title": "Claude's estimates were 'almost identical' to the sell side, so it gives no variant view", "idea": "In the model test, Claude assumed a 76% gross margin (Fritzell thinks that's aggressive given Chinese competition) and implied 7.5x 2029e P/E. The key critique: 'its estimates are almost identical to those generated by the sell-side analysts... if you want a variant view, Claude is unlikely to deliver.' It also missed Naver's new 8.5% stake in InBody, and data comes from web search unless you connect FactSet, LSEG or Capital IQ.", "angle": "If thousands of retail investors run the same plugin on the same names, consensus becomes even more crowded. The edge shifts to the inputs the model can't see: ownership changes, governance and channel checks.", "tweetA": "An LLM trained on the sell side produces sell-side estimates. Shocking. When 10,000 people run the same /initiate on the same ticker, the consensus gets more crowded, and the edge is whatever the model missed. Here that was Naver buying 8.5%.", "tweetB": "Here's the irony. AI makes everyone an analyst, so every analyst converges on the same numbers, so a contrarian view gets more valuable, not less. The plugin just raised the price of independent thinking.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.ai-supremacy.com/p/claude-empowering-retail-investors", "id": 12}, {"cat": "regulation", "urgency": "watch", "source": "AI Supremacy / Michael Spencer + Michael Fritzell — Claude Equity Research", "title": "Citibank's new terms: if you use third-party AI tools for personal finance, losses are your problem, even if you're hacked", "idea": "Citibank, the third-largest US commercial bank, changed its terms of service this week. Customers who give third-party AI tools access to their accounts are responsible for anything that goes wrong, including hacks. Many banks have blocked AI personal assistants (e.g. Meta's Muse). Anthropic's personal-finance hub connects read-only to up to 16 accounts via Plaid and 'can't move, manage, or invest your money'. Robinhood launched agentic trading and an official MCP server in mid-to-late 2026.", "angle": "This is the first big bank to shift liability for agentic AI onto users. It's a fight over who sits at the top of the customer relationship: banks see AI agents as competitive disintermediation, not just a security risk.", "tweetA": "Citi just wrote the first liability rule for agentic finance: your agent, your loss, even if you're hacked. That isn't really security policy. It's a moat. The bank that controls liability controls who gets to be the customer interface. $C", "tweetB": "Same week: Robinhood ships an MCP server for agentic trading, and Citi tells customers that AI-agent losses are on them. The brokers are opening the door and the banks are locking it. Watch which way deposits move.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.ai-supremacy.com/p/claude-empowering-retail-investors", "id": 13}, {"cat": "science", "urgency": "watch", "source": "AI Supremacy / Michael Spencer + Michael Fritzell — Claude Equity Research", "title": "GLP-1 picks and shovels: body-composition analyzers (InBody) as the muscle-loss trade", "idea": "Claude's /screen for 'Asian GLP-1 beneficiaries' returned seven names. Five were new to Fritzell, including InBody (#2) and China's United Labs (large insider buy in July). The thesis is that GLP-1 patients need to monitor muscle loss, which drives demand for body-composition analyzers. InBody's US hospital channel is growing about 25% a year, the sector grows about 6–10% a year, and Chinese low-cost competitors are a commoditisation risk. Pricing pressure is already visible in India.", "angle": "The second-order GLP-1 trades (muscle preservation, body-comp monitoring, protein) are still under-owned compared with the drugmakers themselves.", "tweetA": "GLP-1 second-order trade nobody owns: if you lose 15% of body weight, roughly a third of it can be muscle. Someone has to measure that. InBody's US hospital channel is growing 25% a year. The picks-and-shovels play here is a scale, not a syringe.", "tweetB": "Novo and Lilly priced the obesity drug boom. The market hasn't priced the monitoring layer: body-comp scans, muscle-preservation protocols, protein. Every new GLP-1 patient creates a measurement need.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.ai-supremacy.com/p/claude-empowering-retail-investors", "id": 14}, {"cat": "credit", "urgency": "deep", "source": "Paper Alfa — Friday Thoughts (incl. Macro D)", "title": "HY spreads off ~120bp lows, while CoreWeave CDS hits new highs", "idea": "Paper Alfa says the repricing of US high-yield spreads from unusually tight levels near 120bp 'seems reasonable' given rate volatility. Underneath, dispersion is large, and CoreWeave's CDS has 'skyrocketed to new highs'. About 10% of US equity market cap has been wiped out. The 40-day change is similar to March this year, during the war, while the AI basket is back below its late-March breakout levels.", "angle": "Index HY is orderly, but AI-specific credit (CoreWeave, neoclouds, data-centre ABS) is where stress is concentrated. Watch CRWV CDS relative to HY OAS as the cleanest gauge of AI credit stress.", "tweetA": "High yield at 120bp was never pricing risk. It was pricing a lack of supply. CoreWeave's CDS at new highs while the HY index barely moves tells you the market has already split AI credit from ordinary credit. $CRWV $HYG", "tweetB": "I keep coming back to this. AI equity is back to its March breakout, but CoreWeave CDS is at new highs. Credit is pricing a different outcome than equity. When the two disagree in a capex cycle, credit has usually been right first.", "charts": {"count": 9, "hot": true, "desc": "9 charts: US HY spreads, CoreWeave CDS (new highs), US market cap 40-day change vs March, AI basket vs breakout, 2s5s10s fly, 2y real rates, US nominal GDP tracker. The CoreWeave CDS chart is worth saving"}, "link": "https://www.paperalfa.com/p/friday-thoughts-aec", "id": 15}, {"cat": "positioning", "urgency": "deep", "source": "Paper Alfa — Friday Thoughts (incl. Macro D)", "title": "CIO call with family offices, SWFs and hedge funds: mood 'rock bottom', so 'I just cannot be short stocks here'", "idea": "Paper Alfa joined a call with CIOs from family offices, sovereign wealth funds and hedge funds. The mood was 'rock bottom', compared with a similar call earlier in the year that 'couldn't have been more positive'. Forward returns after similar drawdowns are positive except when the negative wealth effect caused a recession. That's why bonds caught a bid as a hedge.", "angle": "Sentiment capitulation among allocators (not just retail) is a contrarian buy signal, unless a recession is coming. The deciding variable is the labour market, not AI.", "tweetA": "Sovereign wealth funds, family offices and hedge funds all at 'rock bottom' on the same call. When the smartest money in the room has no more fear left to sell, the asymmetry flips. Forward returns stay positive unless the wealth effect breaks the consumer.", "tweetB": "Paper Alfa can't be short with sentiment this bad. Deutsche says foreigners haven't stopped buying. Two different sources say the same thing: this was a positioning flush, not a regime change. Yet.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.paperalfa.com/p/friday-thoughts-aec", "id": 16}, {"cat": "macro", "urgency": "deep", "source": "Paper Alfa — Friday Thoughts (incl. Macro D)", "title": "5-year outperformed 2s and 10s by 16bp on the fly since September as terminal rates reprice", "idea": "In the bond rally, the 5-year outperformed both 2s and 10s on the butterfly, moving 16bp since the end of September. That reflects a repricing of the terminal rate. Breakevens collapsed (US 2y inflation breakevens back near 2%), so 2-year real rates are about 60bp higher on the month, which has supported the dollar.", "angle": "2y real rates +60bp in a month during an equity drawdown is a sharp, unintended tightening. That's the cleanest argument for the Fed to stand down. Long the 5y in a 2s5s10s fly is the expression.", "tweetA": "Nominal yields fell. Breakevens fell more. So 2-year real rates went up 60bp in a month, in the middle of a 10% equity drawdown. The bond rally did the Fed's tightening for it. Another hike on top of that is overkill.", "tweetB": "The belly is the market's opinion of the Fed: 5s beat 2s and 10s by 16bp, which says 'peak terminal is close'. December's hike is priced at ~90%. The fly says it may be the last.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.paperalfa.com/p/friday-thoughts-aec", "id": 17}, {"cat": "macro", "urgency": "deep", "source": "Paper Alfa — Friday Thoughts (incl. Macro D)", "title": "'What if the fastest route back to 2% runs through lower rates?' AI capex is ~3.6% of GDP, bigger than the railroads", "idea": "Paper Alfa's provocative thesis: the AI buildout (~3.6% of US GDP, bigger than the railroads) is the only credible source of productivity gains that would durably lower prices. But hyperscaler capex now exceeds operating cash flow for the first time, so the marginal data centre is funded by project debt and private credit. AI-related debt issuance fell about 80% between June and September, against a funding need of about $1.5T over four years. Power, construction and memory price pressures are capacity limits that rate hikes can't fix. 'The Fed is attacking the symptom and starving the cure.' The precedent is Greenspan refusing to hike into the late-1990s productivity boom.", "angle": "If the Fed adopts this view, the front end rallies and 5s outperform. If it hikes, you get a better bond entry after another credit scare. Either way the trade points the same way: long duration in the belly.", "tweetA": "AI debt issuance down 80% from June to September. Funding need: $1.5T over four years. Hyperscaler capex above operating cash flow for the first time. The Fed isn't fighting inflation here. It's raising the hurdle rate on the only disinflationary supply shock available.", "tweetB": "The Greenspan 1990s analogy cuts both ways. He held off on hikes into a productivity boom and was proven right, then got 2000. Cutting to rescue a levered capex boom is how you get 1999 moral hazard. The right answer is 'pause', not 'cut'.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.paperalfa.com/p/friday-thoughts-aec", "id": 18}, {"cat": "macro", "urgency": "deep", "source": "Paper Alfa — Friday Thoughts (incl. Macro D)", "title": "October PCE 3.8% headline, 3.3% core; nominal spending +0.3% but real spending flat", "idea": "Macro D: October headline PCE rose to 3.8% YoY (from 3.6%) and core to 3.3% (from 3.1%), with both up 0.3% month-on-month. Nominal spending grew 0.3% but real spending was flat, meaning more money for the same volume. The Fed is at 3.75–4.00%. A 25bp hike on Dec 8–9 is priced at about 90%, and January is in play. Consumer confidence jumped from 91.9 to 103.3, a near two-year high, yet the dollar fell. Macro D suspects the December hike could mark the dollar's peak.", "angle": "Flat real spending with 3.8% inflation is a mild stagflation signal. If real demand rolls over, inflation cools without more hikes. The market may be over-pricing January.", "tweetA": "Nominal spending +0.3%, real spending 0.0%. Americans paid more for exactly the same amount of stuff. That isn't demand inflation the Fed can cool with hikes. It's price-level inflation that's already squeezing volume.", "tweetB": "Consumer confidence up 11 points to a two-year high, and the dollar FELL. When good news can't lift the currency into a hike that's 90% priced, the hike is fully in the price. That's often what a dollar top looks like.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.paperalfa.com/p/friday-thoughts-aec", "id": 19}, {"cat": "geopolitics", "urgency": "act", "source": "Paper Alfa — Friday Thoughts (incl. Macro D)", "title": "New Section 301 actions on 14 partners: up to 15% on EU/Japan/Switzerland, China 20% rising to 40% if the truce lapses", "idea": "Washington announced new Section 301 measures on 'industrial overcapacity' against 14 trading partners. They are not yet in effect, and hearings start on January 25, 2027. The EU, Japan and Switzerland could face up to 15% on top of existing duties. China faces up to 20% under a truce that expires on January 10, rising to 40% if it collapses. USTR also accused Switzerland of hindering the franc's appreciation. Macro D on the Shenzhen summit: 'Nothing, just a lot of hot air.'", "angle": "The China truce expires on Jan 10, two weeks before the hearings start. That gap is the window for escalation. It also cuts against Beijing's equity-support message.", "tweetA": "The China truce expires on Jan 10. The Section 301 hearings start on Jan 25. For 15 days the threatened tariff is 40% with no process attached. Beijing propped up stocks at lunch today, and the January calendar is what it's really bracing for.", "tweetB": "USTR is accusing Switzerland of suppressing the franc while the SNB vice chair worries out loud about inflation. The SNB now has two reasons to let CHF appreciate: Washington and its own inflation data. That's a lot of tailwind for the best hedge in G10.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.paperalfa.com/p/friday-thoughts-aec", "id": 20}, {"cat": "macro", "urgency": "deep", "source": "Paper Alfa — Friday Thoughts (incl. Macro D)", "title": "EM FX notes: BRL +2% on a fiscal package; Banxico cut to 6.25% on a split vote; CAD pre-emptive hike risk", "idea": "Macro D: the Brazilian real gained about 2% against the dollar after the lower house approved an initial fiscal package. Banxico cut from 6.50% to 6.25% on a non-unanimous vote, while first-half November headline inflation accelerated and core slowed. MXN is in the 19.6–19.7 range as the rate gap with the US narrows. In Canada, Macklem refocused on headline inflation and supply-shock contamination, and Macro D leans toward a 'pre-emptive' BoC hike. BoJ's Tamura floated faster hikes. KRW and TWD face a double shock from semis and trade.", "angle": "Mexico is cutting while the US is hiking. That compression in carry leaves MXN exposed in an AI-risk-off move. BRL is a fiscal-reprieve trade, not a carry trade.", "tweetA": "Banxico cuts as the Fed hikes. The MXN carry cushion just lost 50bp in one direction and 25bp in the other. The peso's best feature was the rate gap, and it's narrowing from both sides. $MXN", "tweetB": "Korea and Taiwan are the G-20's semis beta. Add a Section 301 tariff on top and KRW/TWD face both a tech shock and a trade shock. Their central banks defended equities this week. Defending the currency is next.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.paperalfa.com/p/friday-thoughts-aec", "id": 21}, {"cat": "AI/infra", "urgency": "deep", "source": "Big Moves / Big Price Moves Explained — Nov 25", "title": "HP: memory and storage went from 15–18% of PC bill of materials to nearly 40% in one fiscal year", "idea": "HP's CFO says memory and storage rose from 15–18% of the PC bill of materials at the start of fiscal 2026 to nearly 40% by Q4. HPQ still rose 11.5% after revenue grew 9.3% to $16.0B and non-GAAP EPS was $0.83 (consensus $0.75). That beat included a $0.15 tariff-refund benefit, so EPS was $0.68 without it, below consensus. AI PCs reached about 60% of shipments (target 50%). Personal Systems margin was 3%. Emma Walmsley is the new CEO.", "angle": "Memory at 40% of the PC BOM is the clearest proof that AI-driven DRAM/NAND demand is squeezing consumer electronics. It's good for $MU and SK Hynix pricing and bad for every OEM's gross margin.", "tweetA": "Memory went from ~16% of a PC's cost to ~40% in twelve months. HBM demand for AI is pushing up the price of consumer DRAM. Your laptop is paying for someone's GPU cluster. $MU $HPQ", "tweetB": "HP beat by $0.08, and $0.15 of that came from tariff refunds. Strip it out and they missed. The stock rallied 11.5% on a non-recurring government cheque. That's what a market looks like when it's this desperate for good news.", "charts": {"count": 5, "hot": false, "desc": "5 images: ticker cards and HPQ/DE move charts"}, "link": "https://bigmoves.substack.com/p/big-moves-november-25-2026", "id": 22}, {"cat": "tech", "urgency": "deep", "source": "Big Moves / Big Price Moves Explained — Nov 25", "title": "HP expects PC units to fall high-single to low-double digits in 2027 with market revenue flat, so ASPs carry the industry", "idea": "HP's fiscal 2027 guide: non-GAAP EPS $3.15–3.45 and free cash flow $2.9–3.1B, with no further tariff refunds assumed. Management expects calendar-2027 PC units to contract by high-single to low-double digits while market revenue stays flat. Commercial revenue rose 23% even as units fell. The Windows 11 refresh is 'mostly behind us'. Morgan Stanley stays Underweight ($21), and of 21 analysts, 11 rate it Hold and 8 Sell. It trades at 9–10x EPS with a ~4% yield.", "angle": "Flat revenue on ~10% fewer units means ~10% higher ASPs, driven by memory costs and the AI PC mix. It's inflationary for consumer hardware and a test of demand elasticity.", "tweetA": "PC units down ~10% in 2027, revenue flat. Do the math: that's a ~10% price increase on every PC sold. Hardware inflation, driven by memory, in a year when core PCE is already 3.3%. Goods disinflation is over.", "tweetB": "60% of HP shipments are now 'AI PCs', and the market is shrinking. The AI PC was supposed to drive a refresh. Instead it's a mix-shift story that only holds up because memory costs force premium pricing anyway.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-november-25-2026", "id": 23}, {"cat": "positioning", "urgency": "deep", "source": "Big Moves / Big Price Moves Explained — Nov 25", "title": "Deere calls 2026 the trough, but consensus 2027 EPS +26% vs roughly flat net income guidance", "idea": "Deere's Q4 revenue was $12.12B against $10.4B expected, but EPS was $3.89 against $4.03, ending a six-quarter beat streak. Fiscal 2027 net income guidance is $4.5–5.25B against $4.86B in 2026, roughly flat at the midpoint. Consensus 2027 EPS is $22.68, about 26% above 2026. Headwinds: a $250–400M pension settlement charge, about $300M net from the loss of $383M in tariff recoveries, and Small Ag margin falling to 12.5–13.5% from 15.1%. Management flagged a possible slowdown in AI data-centre capex as a downside risk for Construction.", "angle": "The ~26% gap between consensus and guidance makes downward revisions likely into the Feb 18 print. It's also notable that a farm-equipment maker now lists AI data-centre capex as a demand risk.", "tweetA": "Consensus has Deere earning 26% more in 2027. Deere itself guides flat. Someone is wrong by about a quarter, and it's usually not the company that has seen the order book. $DE into Feb 18 is a revisions short.", "tweetB": "Buried in Deere's guidance: an AI data-centre capex slowdown is now a stated downside risk to its Construction segment. When John Deere is in the AI capex supply chain, the buildout really is the US economy.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-november-25-2026", "id": 24}, {"cat": "macro", "urgency": "act", "source": "Big Moves / Big Price Moves Explained — Nov 25", "title": "Rocket +7.4% on easing long yields; Hershey +3.4% on nine upward EPS revisions, none cut", "idea": "Wednesday's moves: Rocket Companies rose 7.4% as long-dated Treasury yields eased and mortgage-rate expectations fell. Hershey rose 3.4% after nine upward revisions to current-year estimates in two months, with none lowered. Jacobs fell 4.3% despite beating and guiding above estimates, with no catalyst. West Pharma fell 4.1% as the tech sell-off spread into medtech (ISRG, BDX).", "angle": "Rate-sensitive housing names react sharply to the long end. If Paper Alfa's 'Fed stands down' view plays out, RKT-type names lead. Jacobs falling on good news is a sign of indiscriminate de-risking.", "tweetA": "Rocket +7% on a small move lower in long yields, while the Fed is 90% priced to HIKE. The housing trade has stopped listening to the Fed and is trading the 10-year. That's where the 'Fed is behind on growth' view shows up. $RKT", "tweetB": "Jacobs beats, guides up, and falls 4%. West Pharma falls with no news. When good companies sell off for no reason, the selling is about funding margin calls, not fundamentals. That's where the bargains come from. $J", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://bigmoves.substack.com/p/big-moves-november-25-2026", "id": 25}, {"cat": "tech", "urgency": "watch", "source": "The Dark Side of the Boom / Stephen Innes — China's Robot Revolution (GS)", "title": "Goldman's China AI Robotics primer: humanoids move from showpieces to a $138B industry", "idea": "Goldman Sachs' China AI Robotics Primer maps the move from humanoid demos (backflips, dancing) to commercial deployment, in what it calls a $138B industry opportunity. It expects a large rise in global robot shipments, with China remaining the biggest market. About 20 Chinese manufacturers are competing. Goldman says the winners will be decided by intelligence, hardware, proprietary data, manufacturing capability and the financial staying power to survive. Innes: impressing investors differs from 'convincing a factory manager to order five thousand machines'.", "angle": "The investable layer is probably components (actuators, reducers, sensors) and China's auto/EV supply chain rather than the 20 humanoid OEMs, most of which won't survive.", "tweetA": "20 Chinese humanoid makers, and Goldman's own criteria include 'financial staying power'. That's sell-side for 'most of these die'. Own the actuator and reducer suppliers that all 20 need. The gold-rush logic hasn't changed.", "tweetB": "The real gap in robotics isn't US vs China. It's factory floor vs the real world. Structured precision tasks work today. Unstructured environments don't. Every humanoid valuation is a bet on which side of that line the revenue comes from.", "charts": {"count": 1, "hot": false, "desc": "Header image only in teaser. GS primer charts inside, worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/chinas-robot-revolution-from-ai-showpieces", "id": 26}, {"cat": "science", "urgency": "watch", "source": "The Dark Side of the Boom / Stephen Innes — China's Robot Revolution (GS)", "title": "The divide that matters is precise factory tasks vs the unpredictable world outside the factory", "idea": "Innes and Goldman argue the biggest technological divide may not be between Chinese and US manufacturers. It is between robots that can do precise industrial tasks and robots that can handle unpredictable environments. Commercial adoption depends on reliability, predictable operating costs, maintenance support and measurable ROI, 'considerably less glamorous' than demo videos.", "angle": "Physical AI is the next leg once the LLM capex debate settles, and it moves the bottleneck from GPUs to data collection (teleoperation, simulation) and to service networks.", "tweetA": "A robot that does backflips at a trade show and a robot that works three shifts without a technician are different industries. The second needs a service network. That's why China's auto supply chain, not its AI labs, will decide who wins humanoids.", "tweetB": "The LLM boom ran on internet text. Physical AI has no internet of motion data. The company that builds the data flywheel (teleop fleets, factory telemetry) wins, and that's a manufacturing-scale game China is set up for.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/chinas-robot-revolution-from-ai-showpieces", "id": 27}, {"cat": "macro", "urgency": "deep", "source": "The Daily Feather / Danielle DiMartino Booth", "title": "Core PCE by time frame: 1m 3.57%, 3m 3.63% (7-month high), 6m 2.99%, YoY 3.26% (highest since Nov 2023)", "idea": "DiMartino Booth breaks down October core PCE by time frame: 3.57% on a one-month annualised basis and 3.63% on a three-month basis, a seven-month high. The six-month rate was 2.99% and the year-over-year pace 3.26%, the highest since November 2023. She frames Fed Governor Waller's 'about-face' as he turns hawkish going into the FOMC blackout that starts today.", "angle": "3m core annualised at 3.63% against a 3.75–4.00% funds rate leaves the real policy rate on short-run inflation only ~0.1–0.4%. That's barely restrictive, which strengthens the case for the December hike regardless of the AI drawdown.", "tweetA": "Three-month core PCE annualised: 3.63%. Fed funds: 3.75–4.00%. On the inflation the Fed is actually seeing now, the real policy rate is about 25bp. That's not tight. Anyone pricing a Fed pivot to rescue AI stocks is ignoring this arithmetic.", "tweetB": "Waller was the Fed's most reliable dove for two years, and he's turning hawkish into the blackout. When the dove turns, the hike is locked in. The question for markets isn't December. It's whether January is also live. $TLT $SHY", "charts": {"count": 1, "hot": false, "desc": "Header image only. Charts inside, worth opening"}, "link": "https://dimartinobooth.substack.com/p/the-daily-feather-durable-inflation", "id": 28}, {"cat": "geopolitics", "urgency": "act", "source": "Rosenberg Research / David Rosenberg", "title": "Rosenberg: a classic post-Thanksgiving tech-led rally, and the thanks go to Beijing's State Council", "idea": "Rosenberg credits Beijing's State Council, which announced its intent to intervene on behalf of the stock market and shift fund flows toward equities, with sparking a 'classic post-Thanksgiving rally' led by a huge bounce in tech. His aside: 'Sounds like something the White House would do...'", "angle": "Rosenberg is usually a bear, and he frames this as policy-driven, not organic. Black Friday's half-day session on thin liquidity amplifies the move, so don't read it as a signal.", "tweetA": "A post-Thanksgiving rally in US tech, sparked by a Chinese State Council statement, on a half-day session. That tells you how fragile global AI sentiment has become: it now needs a foreign government's help on a holiday.", "tweetB": "Rosenberg's aside, 'sounds like something the White House would do', is the real point. Markets now assume governments everywhere will defend equity prices. That assumption is itself a risk factor, because it means nobody hedges.", "charts": {"count": 1, "hot": false, "desc": "Header banner image. Paywalled preview"}, "link": "https://www.earlymorningwithdave.com/p/markets-rally-on-chinas-equity-support", "id": 29}, {"cat": "tech", "urgency": "deep", "source": "Blind Squirrel Macro — The Chip-Dollar Standard", "title": "'20-for-20' portfolio tech sleeve: neither Anthropic nor Nvidia makes the cut", "idea": "Blind Squirrel Macro is picking a 20-stock global portfolio meant to work across 10 macro states of the world through 2046. The tech sleeve is capped at five slots. Screening 63 global tech leaders across 10 sub-sectors, 'neither Anthropic nor NVIDIA make the cut'. The screens now weight capex and ROIC more heavily and adjust FCF yields for stock-based compensation. The sleeve has to hedge two debates: 'Intelligence Abundance' vs 'AI Economics Don't Math', and 'Fukuyama was Right' vs 'Multi-Polar World'.", "angle": "Leaving out NVDA and Anthropic from a 20-year portfolio is a real bet that AI value accrues to users and owners of distribution, not to compute vendors or model makers. Worth comparing with your own long-horizon book.", "tweetA": "A 20-year portfolio that skips both $NVDA and Anthropic. That's a bet that in 2046 the AI winners look like electricity's winners: not the generator makers, but the businesses that used cheap power to do something new.", "tweetB": "Adjust FCF yields for stock-based comp and a lot of 'cheap' tech stops being cheap. SBC is a real cost that sell-side models treat as optional. Run that screen on the Mag 7 and see who's still standing.", "charts": {"count": 5, "hot": false, "desc": "5 images incl. the '10 states of the world 2046' mosaic and the screening funnel. Charts inside, worth opening"}, "link": "https://www.blindsquirrelmacro.com/p/the-chip-dollar-standard", "id": 30}, {"cat": "AI/infra", "urgency": "deep", "source": "Blind Squirrel Macro — The Chip-Dollar Standard", "title": "The death of the asset-lite model: AI inference has a physical marginal cost that 'adding seats' never had", "idea": "For 20 years the 'cheat code' was buying the US big-tech platforms on every dip, because they scaled at near-zero marginal cost and buybacks fed passive flows. AI reverses that: 'Increasing scale no longer means increasing margins.' Inference has a physical marginal cost. GPU clusters are a 'replacement treadmill', not a one-off moat like rail track. And a prisoner's dilemma means no hyperscaler can stop spending on its own.", "angle": "This is the core argument for a de-rating of the hyperscalers: they are moving from software multiples toward utility or telco multiples. Compare capex/revenue trajectories with telcos in 1999–2001.", "tweetA": "Google's search margin came from zero marginal cost. An AI answer costs real electricity and real silicon. The hyperscalers are turning from software companies into utilities with a software brand, and utilities don't trade at 30x.", "tweetB": "Railroads lasted 100 years. A GPU cluster is obsolete in about four. The AI capex comparison with infrastructure breaks on depreciation. This isn't building a moat. It's leasing one on a treadmill. $MSFT $GOOGL $META", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.blindsquirrelmacro.com/p/the-chip-dollar-standard", "id": 31}, {"cat": "AI/infra", "urgency": "act", "source": "Exponential View / Azeem Azhar — Blackwell Friday", "title": "Shenzhen black market: $3M for an 8x B300 server vs $500–600k in the US, a 5–6x premium", "idea": "Azhar reports that Shenzhen traders are asking at least $3M for a server with eight B300s. Kyle Chan estimates the equivalent server costs $500,000–600,000 in the US. Washington has also made it harder for Chinese firms to access Nvidia's top chips remotely, including thousands of B300s. Some Asian operators are now looking for American customers for capacity they had set aside for Chinese companies.", "angle": "The 5–6x premium shows export controls are binding and Chinese demand is price-insensitive. That supports smuggling enforcement risk for SE Asian intermediaries and the domestic-substitute bid (Cambricon) seen today.", "tweetA": "$3M per 8x B300 server in Shenzhen = $375k per GPU. US price is about $70k. A 5x premium means export controls are working, and that smuggling now pays better than most legal businesses in Asia.", "tweetB": "Same day: Beijing props up Cambricon, and Shenzhen pays 5x for Nvidia. China's market is betting on homegrown chips, but its buyers are still paying black-market prices for the real thing. That tells you how big the performance gap still is.", "charts": {"count": 1, "hot": true, "desc": "1 chart: Blackwell pricing comparison (Shenzhen black market vs US server price and SpaceX chip-hour rates). Worth saving"}, "link": "https://www.exponentialview.co/p/blackwell-friday", "id": 32}, {"cat": "AI/infra", "urgency": "act", "source": "Exponential View / Azeem Azhar — Blackwell Friday", "title": "SpaceX cuts small-cluster Blackwell rental to $10–12 per chip-hour from $15–15.50, a ~28% drop", "idea": "SpaceX reportedly cut its asking price for small Blackwell clusters to $10–12 per chip-hour, down from about $15–15.50. That brings smaller customers closer to the rate it had offered Google and Anthropic for large clusters. Meanwhile Asian operators are trying to redirect B300 capacity that was meant for Chinese firms to American customers.", "angle": "GPU rental prices falling ~28% while capacity built for China seeks US buyers points to a growing glut in rented Blackwell compute. That's negative for neocloud economics (CRWV, NBIS) and consistent with CoreWeave CDS at new highs.", "tweetA": "Blackwell rental: $15.25 to $11 per chip-hour, about −28%. At $11 a fully used chip earns ~$96k a year. Cut utilisation to 60% and it's $58k, on a chip that costs ~$70k and is obsolete in 3–4 years. Now look at CoreWeave CDS. $CRWV $NBIS", "tweetB": "Connect the dots: China-bound B300 capacity is looking for US tenants, SpaceX is cutting rental prices 28%, and CoreWeave CDS is at new highs. The compute shortage of 2025 is becoming the compute glut of 2027, one rental quote at a time.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.exponentialview.co/p/blackwell-friday", "id": 33}];

var COLORS={"macro":"#e24b4a","credit":"#378add","positioning":"#ef9f27","AI/infra":"#1d9e75","crypto":"#7f77dd","geopolitics":"#d85a30","energy":"#f97316","tech":"#06b6d4","gold":"#d4a017","culture":"#ec4899","labor":"#8b5cf6","regulation":"#64748b","science":"#14b8a6","venture":"#84cc16"};
var UE={"act":"🔴","deep":"🔵","watch":"🟡"};
var fCat="All",fUrg="All",fSrc=null;
function col(c){return COLORS[c]||"#888";}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function bars(){
  var cc={},uc={act:0,deep:0,watch:0};
  ITEMS.forEach(function(i){cc[i.cat]=(cc[i.cat]||0)+1;uc[i.urgency]++;});
  var h='<span class="pill'+(fCat==="All"?' on':'')+'" style="'+(fCat==="All"?'background:#333':'')+'" onclick="setCat(\'All\')">All '+ITEMS.length+'</span>';
  Object.keys(cc).forEach(function(c){var on=fCat===c;h+='<span class="pill'+(on?' on':'')+'" style="'+(on?'background:'+col(c):'border-color:'+col(c)+';color:'+col(c))+'" onclick="setCat(\''+c+'\')">'+esc(c)+' '+cc[c]+'</span>';});
  document.getElementById('cbar').innerHTML=h;
  var lab={act:"🔴 Act Now",deep:"🔵 Deep",watch:"🟡 Watch"};
  var u='<span class="pill'+(fUrg==="All"?' on':'')+'" style="'+(fUrg==="All"?'background:#333':'')+'" onclick="setUrg(\'All\')">All</span>';
  ["act","deep","watch"].forEach(function(k){var on=fUrg===k;u+='<span class="pill'+(on?' on':'')+'" style="'+(on?'background:#555':'')+'" onclick="setUrg(\''+k+'\')">'+lab[k]+' '+uc[k]+'</span>';});
  document.getElementById('ubar').innerHTML=u;
}
function setCat(c){fCat=c;fSrc=null;render();}
function setUrg(u){fUrg=u;fSrc=null;render();}
function filterBySrc(name){fSrc=name;fCat="All";fUrg="All";render();window.scrollTo(0,0);}
function render(){
  bars();
  var n=document.getElementById('srcnote');
  if(fSrc){n.style.display='block';n.innerHTML='Source filter: <b>'+esc(fSrc)+'</b> — <span class="sl" onclick="fSrc=null;render()">clear</span>';}else n.style.display='none';
  var h='';
  ITEMS.forEach(function(item){
    if(fCat!=="All"&&item.cat!==fCat)return;
    if(fUrg!=="All"&&item.urgency!==fUrg)return;
    if(fSrc&&item.source.indexOf(fSrc)<0&&fSrc.indexOf(item.source)<0)return;
    var c=col(item.cat);
    var ch=item.charts.count>0?(item.charts.hot?' 🔥':' 📊'):'';
    h+='<div class="card'+(fSrc?' open':'')+'" id="c'+item.id+'"><div class="hd" onclick="this.parentNode.classList.toggle(\'open\')">';
    h+='<span class="num">#'+item.id+'</span><span>'+UE[item.urgency]+'</span><span class="src" style="background:'+c+'">'+esc(item.source)+'</span><span class="cat">'+esc(item.cat)+'</span>'+ch;
    h+='<span class="ttl">'+esc(item.title)+'</span></div><div class="bd">';
    h+='<div class="lbl">the idea</div><div class="idea">'+esc(item.idea)+'</div>';
    h+='<div class="lbl">my angle</div><div class="angle" style="border-color:'+c+';background:'+c+'14">'+esc(item.angle)+'</div>';
    h+='<div class="tw"><div class="twb"><div class="twl" style="color:#378add">TWEET A <button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>'+esc(item.tweetA)+'</div>';
    h+='<div class="twb"><div class="twl" style="color:#7f77dd">TWEET B <button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>'+esc(item.tweetB)+'</div></div>';
    if(item.charts.count>0||item.charts.desc){h+='<div class="chart'+(item.charts.hot?' hot':'')+'">'+(item.charts.count>0?'📊 '+item.charts.count+' chart(s) — ':'')+esc(item.charts.desc)+'</div>';}
    h+='<a class="lnk" href="'+esc(item.link)+'" target="_blank" rel="noopener">↗ Read full article</a></div></div>';
  });
  document.getElementById('cards').innerHTML=h||'<p style="color:#888">No items match.</p>';
}
function init(){
  document.getElementById('sub').textContent=META.date+' · '+META.time+' · '+ITEMS.length+' items';

  r+='<div class="lbl">included sources (click to filter)</div><table>';

  r+='</table><div class="lbl">skipped</div><table>';
  META.skippedSources.forEach(function(s){r+='<tr><td>'+esc(s.name)+'</td><td>'+esc(s.reason)+'</td></tr>';});
  r+='</table><p style="color:#888;font-size:12.5px">'+esc(META.notes)+'</p>';
  document.getElementById('repbd').innerHTML=r;
  render();
}
