    const card = document.createElement('div');
    card.className = 'card' + (activeSrc ? ' open' : '');
    card.id = 'card-' + item.id;

    const urgEmoji = item.urgency === 'act' ? '🔴' : (item.urgency === 'deep' ? '🔵' : '🟡');
    const chartFlag = item.charts.hot ? '🔥' : (item.charts.count > 0 ? '📊' : '');

    const head = document.createElement('div');
    head.className = 'card-head';
    head.innerHTML =
      '<span class="idx">#' + item.id + '</span>' +
      '<span class="urg">' + urgEmoji + '</span>' +
      '<span class="src-badge" style="background:' + CAT_COLORS[item.cat] + '">' + item.source.split(' / ')[0].split(',')[0].split(' (')[0] + '</span>' +
      '<span class="cat-tag">' + CAT_LABELS[item.cat] + '</span>' +
      (chartFlag ? '<span class="chart-flag">' + chartFlag + '</span>' : '') +
      '<span class="card-title">' + item.title + '</span>';
    head.onclick = function(){ card.classList.toggle('open'); };
    card.appendChild(head);

    const body = document.createElement('div');
    body.className = 'card-body';

    const chartClass = item.charts.hot ? 'chart-box hot' : 'chart-box';
    const chartHtml = '<div class="' + chartClass + '">' + (item.charts.hot ? '🔥 ' : (item.charts.count>0 ? '📊 ' : '')) + item.charts.desc + '</div>';

    body.innerHTML =
      '<div class="section-label">The Idea</div>' +
      '<div class="idea-text">' + item.idea + '</div>' +
      '<div class="section-label">My Angle</div>' +
      '<div class="angle-box" style="border-left-color:' + CAT_COLORS[item.cat] + '; background:' + CAT_COLORS[item.cat] + '14;">' + item.angle + '</div>' +
      '<div class="section-label">Tweets</div>' +
      '<div class="tweets">' +
        '<div class="tweet-box"><div class="tweet-label a">TWEET A</div><div class="tweet-text">' + item.tweetA + '</div>' +
          '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>' +
        '<div class="tweet-box"><div class="tweet-label b">TWEET B</div><div class="tweet-text">' + item.tweetB + '</div>' +
          '<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>' +
      '</div>' +
      chartHtml +
      '<div class="link-row"><a href="' + item.link + '" target="_blank">↗ Read full article</a></div>';

    card.appendChild(body);
    wrap.appendChild(card);
  });
}

function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}

function renderReport(){
  const el = document.getElementById('reportBody');
  let html = '';
  html += '<p><strong>Window:</strong> ' + META.windowStart + ' to ' + META.windowEnd + '. Emails outside this window were not processed.</p>';
  html += '<p>' + META.emailsInWindow + ' emails found in window, ' + META.emailsRead + ' read in full, ' + META.itemsExtracted + ' items extracted.</p>';
  html += '<h4>Included Sources</h4><ul>';
  META.includedSources.forEach(function(s){
    html += '<li><span class="src-link" onclick="filterBySrc(\'' + s.name.replace(/'/g,"\\'") + '\')">' + s.name + '</span> — ' + s.count + ' item' + (s.count>1?'s':'') + '</li>';
  });
  html += '</ul>';
  html += '<h4>Skipped Sources</h4><ul>';
  META.skippedSources.forEach(function(s){
    html += '<li><strong>' + s.name + '</strong> — ' + s.reason + '</li>';
  });
  html += '</ul>';
  el.innerHTML = html;
}

document.getElementById('metaLine').textContent = META.date + ' · ' + META.time + ' · ' + ITEMS.length + ' items from ' + META.emailsRead + ' emails';
renderFilters();
renderCards();
renderReport();
</script>
