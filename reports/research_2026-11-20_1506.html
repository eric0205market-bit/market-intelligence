<script>
const ITEMS = [{"id": 1, "cat": "macro", "urgency": "deep", "source": "Stephen Innes / The Dark Side of the Boom (Citadel's Frank Flight)", "title": "Citadel: cyclicals are pricing a growth scare the data hasn't shown yet", "idea": "Citadel Securities' Frank Flight reads the relative performance of cyclical assets as pointing to downside growth risk, while the consensus still expects ~16% EPS growth in 2027. Because inflation keeps the Fed hawkish, he expects the first sign of weaker growth to be a flatter yield curve and tighter US financial conditions, not rate cuts. He also flags an unusually wide gap between Treasury yields and growth-sensitive assets.", "angle": "The 16% 2027 EPS consensus is the number to attack. If cyclicals are right, earnings revisions come next, and the hawkish Fed takes away the usual cushion. 2s10s flattening is the trade to watch.", "tweetA": "Street has 2027 EPS growing ~16%. Cyclicals are trading like it's closer to zero. One of those two numbers is wrong, and a Fed hiking into it means it probably isn't the cyclicals.", "tweetB": "In a normal growth scare the curve steepens because the Fed cuts. This time the Fed is hiking, so the scare shows up as bull flattening and tighter conditions. Look at the curve before you look at GDP.", "charts": {"count": 1, "hot": false, "desc": "Charts inside — Citadel cross-asset cyclical vs defensive mosaic; worth opening"}, "link": "https://thedarksideoftheboom.substack.com/p/citadels-frank-flight-market-internals"}, {"id": 2, "cat": "positioning", "urgency": "deep", "source": "Stephen Innes / The Dark Side of the Boom", "title": "$94.5B for one ticker: the IPO liquidity drain", "idea": "Anthropic's IPO plus the concurrent private placement raised a combined $94.5B, oversubscribed nearly 7x, more than the SpaceX deal five months earlier. Innes's point is that fund managers don't find another $100B behind the sofa. They sell yesterday's winners to make room, so a mega-IPO can drain liquidity from the rest of the market before anyone questions the technology.", "angle": "Supply is the bear case nobody models. Every mega-IPO this year (SpaceX, now ANT) has pulled money out of the existing AI complex. Watch the lockup and index-inclusion calendar for the next wave of forced selling.", "tweetA": "A 7x-oversubscribed IPO isn't free money. It's $94.5B of other positions getting sold, and the sellers trimmed their AI winners first. That's how the biggest AI listing ever ends up on the worst day for AI infra.", "tweetB": "2026 issuance tally: SpaceX in June, Anthropic in November. Each one set a record and each one marked a local top for its sector. When the 'buyer of last resort' is the IPO itself, issuance tells you where you are in the cycle.", "charts": {"count": 1, "hot": false, "desc": "Charts inside"}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-circus-is-losing-its-shine"}, {"id": 3, "cat": "macro", "urgency": "act", "source": "Stephen Innes / The Dark Side of the Boom", "title": "EM carry unwind: COP, BRL, ZAR, HUF and TRY are all cracking at once", "idea": "With Waller pushing faster Fed tightening, leveraged EM carry positions are being liquidated. The Colombian peso has been hit hardest, Brazil has already spent ~$1B on intervention, the rand is suffering from the metals drop, the forint from a dovish central bank, and Turkish implied yields are rising again. Innes's near-term DXY target is 105.", "angle": "This is the transmission channel from the AI selloff to global liquidity. EM FX is where margin calls get paid first. DXY 105 would tighten conditions for everyone holding dollar debt.", "tweetA": "Brazil spent $1B defending the real and barely moved it. When five carry currencies break in the same week, the problem isn't any one of those economies. It's the dollar funding behind all of them.", "tweetB": "Carry rarely dies because the rate differential closes. It dies when one week of vol erases a year of carry. COP, ZAR, HUF and TRY are all at that point now. DXY 105 is the line where it starts to hurt.", "charts": {"count": 1, "hot": false, "desc": "Charts inside — FX carry and DXY"}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-circus-is-losing-its-shine"}, {"id": 4, "cat": "positioning", "urgency": "deep", "source": "Stephen Innes / The Dark Side of the Boom", "title": "Short AUD/JPY: the dollar wins on yield, the yen wins on positioning", "idea": "Innes's preferred trade is short AUD/JPY. The yen isn't rallying on any Japan story. It's rallying because short-yen funding positions get bought back as carry unwinds. Meanwhile markets are starting to price RBA cuts on fears the central bank overtightened.", "angle": "AUD/JPY captures both sides at once: a commodity currency hit by metals, an RBA that may have to cut, and yen short-covering. It's the cleanest expression of de-grossing.", "tweetA": "The yen isn't rallying because Japan got better. It's rallying because everyone who borrowed it to buy something else now has to pay it back. Positioning beats fundamentals in an unwind, and short AUD/JPY captures it.", "tweetB": "Australia went from 'RBA will keep hiking' to 'RBA overtightened' in a matter of weeks. Add falling metals and yen short-covering and AUD/JPY has three separate reasons to go lower.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-circus-is-losing-its-shine"}, {"id": 5, "cat": "macro", "urgency": "deep", "source": "Stephen Innes / The Dark Side of the Boom", "title": "EUR/USD stuck in an options corridor, 1.0850–1.0950", "idea": "EUR/USD keeps consolidating below 1.10, held there by large options barriers between 1.0850 and 1.0950 that suppress realized vol. Innes's warning is that a quiet market isn't a comfortable one, and he puts the immediate downside reference at 1.0875 if the carry unwind gathers pace.", "angle": "Barrier-pinned spot plus low implied vol is cheap convexity. If the barriers break, realized vol can jump quickly, so EUR puts are inexpensive here.", "tweetA": "EUR/USD looks calm, but the calm comes from option barriers, not conviction. Once 1.0850 breaks, the dealer hedging that held spot in place starts pushing it lower.", "tweetB": "Odd setup: European funding costs are rising (Euribor–ESTR basis widening) while EUR/USD sits pinned. Usually that's the euro's tailwind, so if it can't rally even with that, the dollar squeeze is the stronger force.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-circus-is-losing-its-shine"}, {"id": 6, "cat": "macro", "urgency": "watch", "source": "Stephen Innes / The Dark Side of the Boom", "title": "Core PCE expected at 3.2% next Wednesday, and Cook voted to hike in October", "idea": "Next Wednesday's October core PCE is expected to climb to 3.2% y/y, with risks to the upside. Lisa Cook, normally a dove, surprised by supporting a hike at the October FOMC, and she and Waller both speak today. The S&P is 8.5% off its high, compared with the 9.5% March drawdown and the 21% Liberation Day rout in 2025.", "angle": "The next catalyst is next week's PCE print. A 3.3% would lock in a December hike, possibly 50bp. Cook turning hawkish is the tell that the dovish wing has gone quiet.", "tweetA": "When Lisa Cook votes to hike, the dovish wing of the FOMC is effectively gone. A core PCE at 3.2% next week makes 50bp in December a real option.", "tweetB": "S&P down 8.5%, still short of March's 9.5% and nowhere near 2025's 21%. If it's a demand-shock hike cycle, earnings hold up and this is a correction. If PCE runs hot, you get both. Next Wednesday decides which.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-ai-circus-is-losing-its-shine"}, {"id": 7, "cat": "AI/infra", "urgency": "act", "source": "Michael Spencer / AI Supremacy", "title": "ANT at ~50x sales: from 7th most valuable company to 12th in one session", "idea": "Anthropic sold 980M shares at $83, debuted around a $1.8T market cap and closed day one at $97.17, up 17%. That's a price-to-sales ratio of nearly 50. It briefly topped $2T, making it roughly the 7th most valuable company in the world intraday, then ended about 12th.", "angle": "50x sales on a five-year-old company sets the ceiling for every AI multiple. If ANT de-rates, private marks across the AI venture stack follow.", "tweetA": "A five-year-old company went from 7th to 12th most valuable in the world within one session. At ~50x sales, every 10% move in ANT is about $180B, roughly the size of a mid-cap index.", "tweetB": "Price/sales near 50 at IPO is dot-com range. The difference is that revenue is actually compounding. The question for the bulls isn't growth, it's whether growth can outrun the cost of capital the Fed is raising.", "charts": {"count": 41, "hot": true, "desc": "41 images — visual history of the IPO day; 🔥 CHART WORTH SAVING: the market-cap leaderboard image"}, "link": "https://www.ai-supremacy.com/p/anthropics-ipo-in-pictures-visual-history-birthdate-of-future-ai"}, {"id": 8, "cat": "venture", "urgency": "deep", "source": "Michael Spencer / AI Supremacy", "title": "AI wealth is flowing into rockets: Schmidt's $13.6–17.5B ANT stake", "idea": "Eric Schmidt's Anthropic stake is estimated at $13.6–17.5B. He is CEO and chair of Relativity Space, so like Bezos and Musk he now has a war chest for a launch company. The post also quotes the S-1's unusual risk language: expanding use cases 'could further increase the risk that our models cause harm.'", "angle": "The second-order effect of the IPO is liquidity for founders and early backers, and they will recycle it into space, defense and energy. Expect more private money in launch and fusion over 2027.", "tweetA": "First derivative of the ANT IPO is AI wealth. Second derivative is that wealth funding rockets. Schmidt's stake alone could pay for years of a launch company's development.", "tweetB": "Most IPO prospectuses bury risk factors in boilerplate. This one says, in effect, that the product could cause harm as it scales. That's a new kind of disclosure, and plaintiff lawyers will read it closely.", "charts": {"count": 41, "hot": false, "desc": "Image essay — founders, investors, valuation charts"}, "link": "https://www.ai-supremacy.com/p/anthropics-ipo-in-pictures-visual-history-birthdate-of-future-ai"}, {"id": 9, "cat": "AI/infra", "urgency": "deep", "source": "Noah Smith / Noahpinion", "title": "Noah Smith: 'pacing the frontier' only buys 2–5 years, so the RSI debate is the wrong one", "idea": "Noah Smith's argument: if an intelligence-explosion threshold exists, slowing progress by half only moves it from 2032 to 2037 (or 2028 to 2030). A complete halt is impossible for Vinge's 1993 reason: whoever stops loses the competitive advantage to whoever doesn't. And the steady trend already produces near-godlike AI, so explosion versus no explosion barely changes the economic outcome.", "angle": "If safety policy shifts from 'slow it down' to 'regulate what exists', the focus moves to competition policy, which matters for anyone concentrated in one AI lab. Antitrust risk is the sleeper.", "tweetA": "Noah's closing ask is competition policy so the benefits of AI don't all go to one company. A day after a $1.8T IPO, that's an antitrust question, not a philosophy one.", "tweetB": "If slowing AI by half only delays the outcome by five years, the case for pausing becomes a timing argument. Policy will move from 'stop it' to 'share it', and that means taxes, antitrust and distribution fights.", "charts": {"count": 4, "hot": false, "desc": "4 charts — Epoch ECI trend, Garicano/Imas diminishing returns, METR acceleration"}, "link": "https://www.noahpinion.blog/p/does-it-really-matter-if-theres-an"}, {"id": 10, "cat": "AI/infra", "urgency": "watch", "source": "Noah Smith / Noahpinion", "title": "METR: about 80% of the late-2025 acceleration in AI progress came from AI itself", "idea": "METR's report on Anthropic's internal AI-research automation, which uses the internal AECI metric and non-public data, concludes that the late-2025 acceleration was not due to faster growth in training compute. It estimates that roughly 80% of the acceleration comes from AI speeding up its own research.", "angle": "If true, the compute-to-capability link is weakening, which is bearish for the 'more chips forever' story at the margin and bullish for labs with strong internal tooling. Watch whether outside groups replicate it.", "tweetA": "If 80% of the recent speedup in AI progress came from AI rather than more compute, the capex thesis changes. Labs could reach the same capability with fewer GPUs, and a market pricing GPU demand on scaling laws hasn't accounted for that.", "tweetB": "Caveat: this rests on a lab's internal metric and private data. But if even half of it holds, recursive self-improvement isn't hypothetical anymore, it's already in the measurements.", "charts": {"count": 1, "hot": false, "desc": "METR acceleration chart"}, "link": "https://www.noahpinion.blog/p/does-it-really-matter-if-theres-an"}, {"id": 11, "cat": "science", "urgency": "watch", "source": "Noah Smith / Noahpinion", "title": "From 'can't add 4-digit numbers' (2023) to a Millennium Prize problem in 88 hours", "idea": "Noah quotes Dwarkesh Patel: AI went from failing four-digit addition in 2023 to solving a Millennium Prize problem in 88 hours about a month ago. Patel argues AI research has the same verifiable structure as math. Agents already work at ~10x human speed and around the clock, which works out to ~50x a human researcher's weekly output.", "angle": "The verifiability framing tells you where the next disruptions land: any field with checkable answers, such as chip design, materials and drug-binding assays. That's where to look for 2027 productivity surprises.", "tweetA": "Rule of thumb from the math result: wherever answers can be checked automatically, AI goes from worse than most humans to better than the best in about three years. Chip verification, protein binding and compiler optimization all fit. Map your portfolio against that list.", "tweetB": "50x a human researcher's weekly output per agent. A lab running 10,000 agents gets the equivalent of half a million researchers. The whole global AI research workforce is maybe 100k people.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.noahpinion.blog/p/does-it-really-matter-if-theres-an"}, {"id": 12, "cat": "tech", "urgency": "deep", "source": "Noah Smith / Noahpinion", "title": "Technology arrives as many local 'singularities', not one smooth wave", "idea": "Citing Fiszbein et al. (2024) on electrification and Bartel (2005) on IT-enabled machines, Noah argues that each technology crosses a usefulness threshold sector by sector. Productivity jumps fast and then plateaus within each sector, and only the aggregate looks like a smooth wave. Without an intelligence explosion, AI's takeover of tasks will be staggered and uneven, but after a few years the economic outcome is about the same.", "angle": "Uneven adoption creates sector-level earnings shocks. The trade is finding which industry crosses the threshold next, not betting on aggregate GDP.", "tweetA": "Electrification didn't lift GDP smoothly. It upended one factory type at a time. AI will do the same, so the alpha is in calling the next sector to cross the threshold, not in arguing about GDP.", "tweetB": "Economists model AI as a smooth productivity curve. History says it arrives as a series of sharp sector-level breaks that add up to something smooth only in aggregate. Your P&L feels the breaks.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.noahpinion.blog/p/does-it-really-matter-if-theres-an"}, {"id": 13, "cat": "AI/infra", "urgency": "deep", "source": "Noah Smith / Noahpinion", "title": "Garicano & Imas: AI progress is speeding up, but each unit costs more", "idea": "Luis Garicano and Alex Imas show that AI progress has accelerated while returns per dollar of research spending have diminished. Each unit of capability costs more. Their economic model of recursive self-improvement suggests AI research ideas are getting harder to find. Ramez Naam adds that AI still automates only short pieces of the research process.", "angle": "Rising cost per unit of capability is the capex treadmill: the bill grows faster than the output. That's why ANT committed ~$901B to compute through 2045. Bullish for suppliers, a margin question for labs.", "tweetA": "Diminishing returns on research spending explains the $901B compute commitment. The labs aren't spending more because they want to. Each step forward costs more than the last.", "tweetB": "Two camps, one variable: do ideas get harder to find faster than AI gets better at finding them? Garicano/Imas say yes, METR says no. Whichever is right determines whether AI capex is a treadmill or a flywheel.", "charts": {"count": 1, "hot": false, "desc": "Garicano/Imas progress vs spending chart"}, "link": "https://www.noahpinion.blog/p/does-it-really-matter-if-theres-an"}, {"id": 14, "cat": "credit", "urgency": "deep", "source": "Stephen Innes / The Dark Side of the Boom", "title": "JPM and GS both now see coupon auction sizes rising from August 2027", "idea": "JPMorgan (Jay Barry) and Goldman (William Marshall), working independently, both now expect Treasury to start increasing 2–10y coupon auction sizes in August 2027 (GS moved its call from May). A $1.6T funding gap is exposing the limits of bill-heavy financing, and traditional bill buyers are getting choosier. The two banks use the same supply numbers but assume very different Fed paths.", "angle": "Duration supply arrives in August 2027, and the market will start pricing it in early 2027. That argues for steepeners and against the 'bonds rally on recession' trade at the long end.", "tweetA": "Treasury's bill-heavy strategy now has an end date: August 2027, according to both JPM and GS. Term premium will start pricing it at least two quarters early.", "tweetB": "Boockvar says short rates fall and long rates face a supply problem. JPM and GS have just put a date on that supply problem. The steepener is the trade that connects the two.", "charts": {"count": 1, "hot": false, "desc": "Charts inside — auction size forecasts"}, "link": "https://thedarksideoftheboom.substack.com/p/the-320-billion-divide-who-funds"}, {"id": 15, "cat": "credit", "urgency": "watch", "source": "Stephen Innes / The Dark Side of the Boom", "title": "Treasury may keep selling short-duration exposure without calling it bills", "idea": "Buried in the auction forecasts: Treasury might keep supplying short-duration exposure without technically issuing more bills. The obvious candidates are buybacks paired with front-end coupons, or more 2y/3y. Innes asks what happens before August 2027 arrives, as the $1.6T gap tests the appetite of money funds and other bill buyers.", "angle": "Financial plumbing: if bill buyers like money funds get choosy, repo and SOFR spreads widen first. Watch SOFR–IORB together with the Euribor–ESTR widening PA flagged.", "tweetA": "Treasury isn't running out of borrowing capacity, it's running out of cheap ways to borrow. A $1.6T gap and choosier bill buyers mean the funding risk shows up in repo first.", "tweetB": "Watch this alongside today's 9-day bill, the first since the GFC. When Treasury starts issuing odd short tenors, it's managing cash on a day-to-day basis.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://thedarksideoftheboom.substack.com/p/the-320-billion-divide-who-funds"}, {"id": 16, "cat": "positioning", "urgency": "act", "source": "Macro Charts", "title": "Worst day of 2026: only 7% of stocks closed higher, and even defensives broke", "idea": "Macro Charts: yesterday was the worst day of 2026 for stocks. Just 7% of stocks closed up and 93% fell, and the selling was intense enough that even the most defensive sectors broke. Washout breadth like this usually comes near tactical lows, not at the start of declines.", "angle": "A 93% down day with defensives breaking reads as forced deleveraging, not rotation. Historically these cluster near tactical lows, so start building a shopping list.", "tweetA": "93% of stocks down, defensives included. When utilities and staples go with tech, someone is meeting margin calls, not rotating. Margin-call days tend to come near the end of a selloff.", "tweetB": "The 2000 analogy says defensives rally while tech falls. Yesterday defensives broke too. Either the analogy is failing, or it's moving to its later stage, where everything falls together.", "charts": {"count": 3, "hot": true, "desc": "3 charts — 🔥 CHART WORTH SAVING: % of stocks up/down on the day; defensive sector breakdown"}, "link": "https://www.macrocharts.com/p/market-update-and-signals-112026"}, {"id": 17, "cat": "positioning", "urgency": "deep", "source": "Macro Charts", "title": "Macro Charts went from ~25% utilities/healthcare to zero defensives and holding cash", "idea": "Since May, Macro Charts has tracked a 2000-style rotation. He had nearly a quarter of the portfolio in utilities and healthcare with semis at zero. With defensives now at extremes on both price models and valuations, he cut them to zero in early November and is in cash. His view: if tech bottoms, it leads a weeks-to-months bear market rally.", "angle": "If defensives are the crowded trade now, the pain trade is a tech squeeze. Watch XLU/XLV versus SMH relative performance for the turn.", "tweetA": "The trader who rode the 2000 rotation into utilities has just sold all of them. When the people who called the defensive trade start exiting, the crowded trade is defensives.", "tweetB": "Late 2000 had defensives up 50% while tech crashed. If that rotation is already at valuation extremes, the next leg isn't defensives up again, it's a violent tech bear market rally. Position for the squeeze, not the trend.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.macrocharts.com/p/market-update-and-signals-112026"}, {"id": 18, "cat": "positioning", "urgency": "watch", "source": "Macro Charts", "title": "High beta and momentum drawdowns are already worse than in 2000", "idea": "Macro Charts notes the drawdown in high beta and momentum is already worse than in 2000, and that 2000's top took a full year. He says positioning and sentiment are washed out enough for a tactical bottom even inside a bear market. 'Maybe we're in 2026... not 2000.'", "angle": "Faster cycles mean the 2000 timeline compresses. Something that took 12 months then could take 3 now. Sizing for a sharp rally is cheaper than missing it.", "tweetA": "Everyone's fighting over whether this is 2000, 2007, 2018 or 2022. Momentum's drawdown is already worse than 2000's, so whatever this is, it's moving faster than every analogue.", "tweetB": "The 2000 top took 12 months. Momentum just did 2000-scale damage in weeks. If cycles compress like that, the bear market rally he's expecting could also come within weeks.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — 2026 vs 2000/2007/2018/2022 comparison"}, "link": "https://www.macrocharts.com/p/market-update-and-signals-112026"}, {"id": 19, "cat": "macro", "urgency": "deep", "source": "Danielle DiMartino Booth / The Daily Feather", "title": "Philly Fed prices paid at 58.2, and 24 straight months above average hasn't happened since 1989", "idea": "The Philly Fed's current prices paid index rose to a seven-month high of 58.2 in November, nearly double its 29.6 long-run average. It has posted a positive z-score for 24 straight months (latest +1.33). Above-average streaks that long have occurred only 6% of the time since 1968. Excluding the pandemic, the last one ended August 1989.", "angle": "Prices paid stuck at 1989 levels while the headline index collapses (6.3 vs 20.6 est) is stagflation in a single survey. That's why the Fed can't pivot even as growth rolls over.", "tweetA": "Philly Fed headline: 6.3 vs 20.6 expected. Prices paid: 58.2, double the long-run average, 24 months running. Activity falling while prices stay hot is stagflation in one survey.", "tweetB": "The last time manufacturing price pressure stayed this persistent was 1989, and the Fed hiked into it. The 1990 recession followed. The pattern matches more closely than people would like.", "charts": {"count": 1, "hot": true, "desc": "🔥 CHART WORTH SAVING: Philly Fed prices paid vs 29.6 long-run average (paywalled — open link)"}, "link": "https://dimartinobooth.substack.com/p/the-daily-feather-learn-to-fly"}, {"id": 20, "cat": "macro", "urgency": "act", "source": "David Rosenberg / Rosenberg Research", "title": "Rosenberg: seven-day global equity losing streak, with transports and copper flashing recession", "idea": "Global equities are riding a seven-day losing streak, and several regions and sectors are already in bear markets. Rosenberg highlights the sharp drop in transports and copper as negative economic signals now showing up in November US business surveys. His subtitle: the Fed won't 'play with fire' on inflation and will end up setting the economy ablaze.", "angle": "Transports plus copper plus trucking bankruptcies at a 20-year high (per Mando) is a real-economy confirmation, not just an AI multiple story. Cyclicals versus defensives is the tell.", "tweetA": "Copper down, transports down, trucking bankruptcies at a 20-year high, and the Fed is still talking hikes. Dow Theory has a name for that combination.", "tweetB": "Rosenberg's headline asks whether Anthropic is already in a bear market. The better question: if the most-hyped IPO in history can't lift the tape, what's left to lift it?", "charts": {"count": 1, "hot": false, "desc": "Charts inside — global equity streak, transports, copper"}, "link": "https://www.earlymorningwithdave.com/p/anthropic-already-in-a-bear-market"}, {"id": 21, "cat": "crypto", "urgency": "act", "source": "Unchained Daily", "title": "Sky's USDS supply fell 40% ($2.07B) in a day after an illicit-finance exposé", "idea": "USDS supply fell about $2.07B (~40%) in a day, to ~$3.16B, and is down ~53% over the month. It came the same day as a CoinDesk/Inca Digital investigation tracing $518M of Peg Stability Module swaps to illicit wallets, $101.9M of it linked to North Korea. Sky says that's ~0.03% of the $968B the module has processed. PSM USDC fell from $2.5B to ~$1B.", "angle": "Stablecoin runs now start with compliance headlines, not depegs. A one-to-one USDC swap module is effectively a sanctions-laundering surface, which is exactly what the GENIUS-style rules are meant to police.", "tweetA": "$518M in illicit flows was 0.03% of PSM volume, and it still triggered a 40% run in a day. Holders aren't worried about the peg, they're worried about being frozen. Compliance risk is now the main run risk for stablecoins.", "tweetB": "USDS has lost 53% of supply in a month. Meanwhile HSBC is letting clients buy tokenized money market funds with its own HKD stablecoin. Regulated bank tokens are taking share from DeFi stablecoins.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — USDS supply"}, "link": "https://unchainedcrypto.beehiiv.com/p/sky-s-stablecoin-shrinks-fast-after-an-illicit-finance-report"}, {"id": 22, "cat": "regulation", "urgency": "deep", "source": "Unchained Daily", "title": "SEC nominee wants notice-and-comment on the 5-year tokenized-stock exemption", "idea": "Kristin Johnson, Trump's Democratic SEC nominee and a former CFTC commissioner, told senators the tokenized stock 'innovation exemption' (issued Sept 17, five years, lets venues trade tokenized US stocks onchain without registering as exchanges) should go through notice and comment. At least 67 companies object to their shares trading on OKXICE, the OKX–ICE joint venture. Republican nominee Levine compared it to ETFs, which began as exemptive orders.", "angle": "67 issuers objecting is the real fight: companies don't want their stock traded on venues they never approved. That's a lever for unwinding the exemption once Congress turns Democratic.", "tweetA": "67 public companies have objected to their own stock trading onchain on OKXICE. The pushback on tokenized equities is coming from issuers, not regulators, and issuers can lobby.", "tweetB": "Tokenized stocks currently rest on an exemption with no public comment. Add a Democratic Congress and a nominee who wants process, and five years becomes the maximum, not the expected life.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/sky-s-stablecoin-shrinks-fast-after-an-illicit-finance-report"}, {"id": 23, "cat": "crypto", "urgency": "watch", "source": "Unchained Daily", "title": "Ethereum's Glamsterdam slides toward mid-January as EIP-8037 splits client teams", "idea": "Core devs are leaning toward shipping Glamsterdam without changing EIP-8037, the contested proposal that reprices the gas cost of creating new state. At least 50 affected companies were contacted. Mid-January is the earliest mainnet date, with a Hoodi testnet fork around Dec 16–17. Besu wants spec changes, Erigon opposes shipping as is, and the consensus layer warns of a possible veto. More analysis would push it to late February.", "angle": "Making state creation more expensive is a quiet tax on new accounts and contracts. That's bearish for state-heavy L1 apps and favors L2s. The go/no-go decision is next week.", "tweetA": "EIP-8037 makes creating new state on Ethereum more expensive. In plain terms, L1 is pricing out new users to protect node operators. Good for L2 economics, awkward for the 'L1 is back' story.", "tweetB": "Two client teams dissent and the consensus layer warns of a veto: Ethereum governance is working as designed, just slowly. ETH is down 28% in 30 days and the upgrade timeline is sliding.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/sky-s-stablecoin-shrinks-fast-after-an-illicit-finance-report"}, {"id": 24, "cat": "crypto", "urgency": "watch", "source": "Unchained Daily", "title": "Ledger CTO leaves to fix the 'security mess': AI is making attacks cheaper", "idea": "Charles Guillemet, Ledger CTO for nine years and founder of its Donjon attack lab, leaves at the end of 2026 to start a security venture. He says AI is making attacks cheaper, faster and easier to scale, and that securing assets on possibly compromised devices is now a problem for governments and AI agents, not just crypto. Ledger has sold 8M+ wallets securing ~20% of crypto assets. Morning Minute adds that his exit came a day after Ledger's tampered-device probe widened to Europe and the Middle East.", "angle": "Timing matters: the CTO leaves the day after the tampered-device probe widens. Self-custody hardware risk is under-discussed, and it sits next to the hacker flows Mando flags (Binance hacker moving $594M of ETH).", "tweetA": "The person who built Ledger's attack lab says AI has made attacks cheaper and is leaving to build defenses for AI agents, not crypto. Security spending is moving from protecting coins to protecting agents.", "tweetB": "A wallet maker securing ~20% of crypto assets is losing its CTO the day after a tampered-device probe spreads to two more regions. That's a tail risk the market isn't pricing.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/sky-s-stablecoin-shrinks-fast-after-an-illicit-finance-report"}, {"id": 25, "cat": "positioning", "urgency": "deep", "source": "Unchained Daily", "title": "13F filers hold a record 356,491 BTC, and Wells Fargo is now the largest holder", "idea": "Per Alex Thorn, 13F filers held a record 356,491 BTC in US spot ETPs as of Sept 30, after adding 49,229 BTC in Q3. Wells Fargo became the largest 13F holder for the first time, with 30,553 BTC.", "angle": "This data is stale (Q3). The live data is $1B+ of ETF outflows this week. Institutions bought the top, and the Q4 13Fs in February will show who capitulated.", "tweetA": "Q3: institutions added 49,229 BTC through ETFs, a record. Q4 so far: $1B+ of outflows this week and BTC at $61.5k. The February 13Fs will be more telling than this one.", "tweetB": "Wells Fargo is now the biggest disclosed holder of bitcoin ETFs. It's an advisor-channel bank, not a hedge fund, which means BTC has become a wealth-management product. Those clients tend to hold through drawdowns.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/sky-s-stablecoin-shrinks-fast-after-an-illicit-finance-report"}, {"id": 26, "cat": "regulation", "urgency": "watch", "source": "Unchained Daily", "title": "IOSCO tells firms to prepare for a sudden quantum attack, now", "idea": "IOSCO told financial firms to prepare for a sudden quantum attack on current encryption, and said authorities should not wait for a cryptographically relevant quantum computer to emerge. Separately, Blockstream published a security analysis of SHRINCS, a hash-based post-quantum signature scheme that looks like the frontrunner to replace Bitcoin's signatures (per Morning Minute).", "angle": "A global securities regulator saying 'don't wait' turns PQC migration into a compliance budget line. Vendors of post-quantum crypto and HSM upgrades get a multi-year spending cycle.", "tweetA": "IOSCO's message is to prepare for quantum before it exists. When a regulator says that, budgets follow, and post-quantum migration becomes the next Y2K-style spending cycle.", "tweetB": "Bitcoin is picking SHRINCS for post-quantum signatures, and IOSCO is telling banks to move now. Both systems face the same deadline, and they're migrating at very different speeds.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/sky-s-stablecoin-shrinks-fast-after-an-illicit-finance-report"}, {"id": 27, "cat": "crypto", "urgency": "deep", "source": "Unchained Daily", "title": "HSBC lets wealth clients buy tokenized MMFs with its HKD stablecoin, from HK$100", "idea": "HSBC is expanding RedCoin into wealth management: clients can subscribe to tokenized money market funds with the bank's HKD stablecoin from HK$100. Separately, the Homeland Security Task Force launched a Threat Disruption Center linking federal investigators with crypto, payment and social media firms that can pause victim payments, with TRM Labs as primary partner.", "angle": "Bank stablecoin plus tokenized MMF is the bank-native version of USDC-to-T-bills. A HK$100 minimum is retail scale. Hong Kong is running the plumbing experiment the US keeps debating.", "tweetA": "HSBC now offers tokenized money market funds for HK$100, bought with its own stablecoin. On the same day, a DeFi stablecoin lost 40% of its supply. That's what bank-issued tokens beating DeFi looks like.", "tweetB": "The US built a government hub where payment and crypto firms can pause victim payments in real time. Expect a fight over censorship resistance as that capability spreads.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/sky-s-stablecoin-shrinks-fast-after-an-illicit-finance-report"}, {"id": 28, "cat": "crypto", "urgency": "deep", "source": "Unchained Daily", "title": "ETH staking yields are down to ~2.2%, and VanEck is dropping Gemini as custodian", "idea": "Staking yields have fallen to about 2.2%, which puts pressure on the ETH treasury-company model (Kairos/Golem report). Separately, VanEck is dropping Gemini as custodian of its HODL, ETHV and VSOL funds around Feb 16, 2027, keeping Coinbase Custody, and the 8-Ks give no reason.", "angle": "2.2% staking yield versus a Fed heading to hikes: the ETH carry is negative against cash. ETH treasury companies need a new story, or their mNAV premiums compress further.", "tweetA": "ETH staking pays ~2.2%. T-bills pay more and the Fed is hiking. When the crypto 'risk-free rate' is below the real risk-free rate, ETH treasury companies lose their reason to exist.", "tweetB": "VanEck dropping Gemini leaves Coinbase as custodian for even more of the ETF complex. Custody concentration is a systemic risk nobody puts on a slide.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/sky-s-stablecoin-shrinks-fast-after-an-illicit-finance-report"}, {"id": 29, "cat": "crypto", "urgency": "deep", "source": "Unchained Daily", "title": "Crypto perps priced ANT's open within 50 cents before Nasdaq did", "idea": "OKX's ANT perpetual traded at $111.31 a minute before Anthropic's $111.50 Nasdaq open. Crypto venues effectively did price discovery for the largest IPO in history. Mando adds that ANT perp volume on Hyperliquid hit 2x ETH's.", "angle": "Pre-IPO perps are now a real price-discovery venue, which is exactly what the CFTC's Hyperliquid comments target. It's a new product category, and a regulatory flashpoint.", "tweetA": "Before ANT opened on Nasdaq, OKX perps had already priced it to within 19 cents. On Hyperliquid, ANT perp volume ran at 2x ETH's. Offshore crypto venues are doing price discovery for US IPOs, and the CFTC has noticed.", "tweetB": "Crypto exchanges' fastest-growing product isn't a crypto asset, it's US stocks before they list. That's why the CFTC chair wants Hyperliquid to register.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://unchainedcrypto.beehiiv.com/p/sky-s-stablecoin-shrinks-fast-after-an-illicit-finance-report"}, {"id": 30, "cat": "macro", "urgency": "deep", "source": "Stephen Innes / The Dark Side of the Boom", "title": "Foreigners fund ~$1T of US AI investment, through the flightiest kind of capital", "idea": "Innes: AI investment is so large that foreigners are financing about a trillion dollars of it that domestic savings can't cover, and US dependence on equity financing is at a record high. Equity is the flightiest capital, so today's inflows into deals like the ANT IPO become tomorrow's outflows when prices fall and liquidity tightens. He describes it as a 'wormhole to a recession'.", "angle": "A current-account deficit funded by equity rather than debt or FDI means a stock selloff becomes a funding shock. That's how an AI correction turns into dollar and real-economy stress.", "tweetA": "The US is funding its AI boom with foreign money that can sell with one click. FDI stays put, Treasuries roll, equity leaves. Record equity-financing dependence makes a Nasdaq drawdown a balance-of-payments problem too.", "tweetB": "Odd combination: the dollar is rallying while the foreign equity money funding US AI is at risk of leaving. If those flows reverse, the dollar strength flips. Watch TIC data.", "charts": {"count": 0, "hot": false, "desc": "Charts inside — US equity financing share"}, "link": "https://thedarksideoftheboom.substack.com/p/us-dependence-on-equity-financing"}, {"id": 31, "cat": "macro", "urgency": "deep", "source": "Peter Boockvar / The Boock Report", "title": "Boockvar: data centers are ~half of GDP growth and ~75% of earnings growth, so the Fed can't hike past December", "idea": "Boockvar argues the Fed won't hike after December, if it hikes even then, because the data center build accounts for about half of GDP growth, AI names make up about half the S&P 500's market cap, they deliver about 75% of current earnings growth, and the upper-income consumer depends on the AI-driven wealth effect. Now industrial metals and crude are falling too.", "angle": "If he's right: the dollar tops, front-end yields fall, and the long end has a deficit-supply problem. That's a steepener plus gold, against JPM's call for hikes in Dec/Jan/Mar.", "tweetA": "AI is ~50% of GDP growth, ~50% of S&P market cap and ~75% of earnings growth. Hiking into an AI selloff means hiking into most of what's driving the economy. JPM is calling for three hikes, and Boockvar is calling for none after December.", "tweetB": "Hawks are looking at 3.2% core PCE. Boockvar is looking at an economy where one sector accounts for three quarters of earnings growth. Both are right, which is why the curve has to steepen.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://peterboockvar.substack.com/p/ill-make-the-case-againintel-on-the"}, {"id": 32, "cat": "gold", "urgency": "deep", "source": "Peter Boockvar / The Boock Report", "title": "Gold's 14-day RSI is at its lowest since October 2023, and the Daily Sentiment Index is below 10", "idea": "Gold's 14-day RSI is the lowest since October 2023, and the Daily Sentiment Index is below 10 on a 0–100 scale. Boockvar expects gold to resume its rally once the dollar tops and short rates fall. Other sources today: gold at a 14-month low (~$3,550–3,580), junior miners capitulating with GDXJ below its summer lows.", "angle": "Sentiment below 10 plus juniors capitulating is a classic contrarian setup, and the catalyst would be a Fed pivot. Size it as a dollar-top trade.", "tweetA": "Gold's Daily Sentiment Index is under 10 out of 100, and GDXJ just broke its summer lows. The last time gold sentiment was this washed out, in October 2023, a rally to all-time highs followed.", "tweetB": "Gold is falling alongside BTC and equities. When everything drops together it's a dollar and liquidity squeeze, not a verdict on gold. Gold is usually the first asset to recover once the squeeze ends.", "charts": {"count": 1, "hot": false, "desc": "Gold chart with RSI"}, "link": "https://peterboockvar.substack.com/p/ill-make-the-case-againintel-on-the"}, {"id": 33, "cat": "AI/infra", "urgency": "act", "source": "Morning Minute / Lucky Trader", "title": "$107B committed to one stock in one day, and ANT is already 15% below its open", "idea": "ANT priced at $83, opened at $111.50 and briefly topped a $2T fully diluted valuation. It closed at $97.17 (+17% versus the offer, -13% from the open) and is ~$88 premarket. Add the $81.34B IPO to a separate $26B private placement from Nvidia, Google, AMD and four other suppliers, and ~$107B was committed to a single name in one day. FxPro suggests the listing absorbed the riskiest money in the system.", "angle": "The $26B supplier placement is circular. Nvidia/Google/AMD fund the customer that buys their chips. Watch for vendor-financing scrutiny the way Lucent got scrutinized in 2000.", "tweetA": "$26B of ANT's raise came from its own suppliers: Nvidia, Google, AMD and four others. Vendors financing their customer so it can buy more of their product is how 2000's telecom bubble worked.", "tweetB": "IPO at $83, open at $111.50, premarket at $88. Anyone who bought the open is down 21% in under 24 hours. That's the retail allocation lesson from every hot listing since Facebook.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/anthropic-ipo-sinks-markets"}, {"id": 34, "cat": "positioning", "urgency": "deep", "source": "Morning Minute / Lucky Trader", "title": "The SpaceX post-IPO template: +67% in 4 days, below the IPO price by mid-July", "idea": "SpaceX priced at $135 in June, opened at $150 and closed day one +19%. It hit $225.64 four days later (+67% versus the offer), fell 16% in a single day on June 22, was below its IPO price by mid-July and ~50% off its peak by late July. Morning Minute projects a similar path to a market low around Christmas, which is how the 2018 midterm cycle played out.", "angle": "If ANT follows the SpaceX path, there's a 4–8 week window of pain for anything correlated to AI sentiment. Consider December puts on AI infra beta as a hedge.", "tweetA": "SpaceX went from IPO to +67% to below the IPO price in about six weeks. ANT's version was faster: the open was the peak. If the compression holds, the low comes before Christmas, not in late January.", "tweetB": "Two mega-IPOs in 2026, and both marked tops for their sectors within days. The 2018 midterm-cycle low was Christmas Eve. History doesn't have to repeat, but these dates line up.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/anthropic-ipo-sinks-markets"}, {"id": 35, "cat": "crypto", "urgency": "act", "source": "Morning Minute / Lucky Trader", "title": "BTC: seven straight weekly losses, and more than 7% below the 200-week MA", "idea": "BTC hit $61.5k, its lowest since early July and a seventh straight weekly loss, the longest streak since the nine-week run in 2022. It's now >7% below its 200-week moving average, the deepest in three years, after a death cross (50-day EMA below the 200-day) with RSI at 21. ETH is at ~$1,740, down 28% in 30 days. Gold fell to a 14-month low and silver dropped 3%. BTC ETFs saw $582M of outflows Thursday and ETH ETFs $131M.", "angle": "BTC, equities and gold all down on the same day: the common factor is the discount rate, so a Fed pivot or a hot PCE decides the next move. Below the 200-week MA has historically been a cycle-bottom zone.", "tweetA": "BTC is more than 7% below its 200-week moving average. In every prior cycle that zone has been where long-term buyers accumulate. The difference this time is that the Fed is hiking, not cutting.", "tweetB": "Seven straight red weeks, an RSI of 21, ETF puts at a 17% premium. Sentiment is at extremes, but the trigger isn't crypto-specific. It's Waller. Crypto bottoms when the Fed's hiking path stops getting steeper.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/anthropic-ipo-sinks-markets"}, {"id": 36, "cat": "regulation", "urgency": "deep", "source": "Morning Minute / Lucky Trader", "title": "CFTC chair: Hyperliquid must register or partner to serve US retail", "idea": "CFTC Chair Michael Selig said onchain venues like Hyperliquid must register, or partner with a licensed exchange, to offer leveraged derivatives to US retail. He pointed to Backpack's DCM/DCO/FCM stack as the template. Per Mando, the CFTC also moved Binance US's perps bid to full review. Hyperliquid led onchain protocols in revenue with $3.13M per day.", "angle": "Hyperliquid's US growth now depends on licensing. A partnership with a licensed venue is the likeliest outcome, which would mean onboarding a KYC layer, a big change for the protocol.", "tweetA": "Hyperliquid makes $3.13M a day, more than any other onchain protocol. A lot of that comes from US users the CFTC now says need a licensed intermediary. The fastest-growing exchange in crypto just got handed a compliance cost.", "tweetB": "Backpack's licensed DCM/DCO/FCM stack is now the official template. The winning strategy for crypto derivatives went from 'stay offshore' to 'buy a license'. Watch for M&A in licensed futures firms.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/anthropic-ipo-sinks-markets"}, {"id": 37, "cat": "regulation", "urgency": "watch", "source": "Morning Minute / Lucky Trader", "title": "Gallego on crypto's odds under the incoming Democratic Congress: 'They're fucked'", "idea": "Sen. Ruben Gallego, the Democrat who negotiated the market structure bill that collapsed in September, summed up crypto's political prospects under the incoming Democratic Congress in two words: 'They're fucked.' Separately, VP Vance said crypto and BTC are 'here to stay' (per Mando).", "angle": "Crypto's regulatory window is closing. Whatever doesn't get done via exemption before January stays stuck for two years, so expect agencies to rush exemptive relief through.", "tweetA": "The Democrat who negotiated the crypto market structure bill now says the industry is finished under the next Congress. Exemptions issued without notice-and-comment, like the tokenized-stock one, are the most exposed.", "tweetB": "Crypto policy has a two-year window: agencies can still act before the new Congress, and Congress can block them after. The rush to issue exemptions starts now.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/anthropic-ipo-sinks-markets"}, {"id": 38, "cat": "AI/infra", "urgency": "act", "source": "Morning Minute / Lucky Trader", "title": "The biggest AI listing in history, and AI infrastructure was the worst place to be", "idea": "On IPO day the Nasdaq fell 2.06%, the S&P 1.9%, and the Dow lost 2.17% to close below 50,000 for the first time since June. AMD fell 7.73%, Nebius 7.8%, CoreWeave 5% and Nvidia 3.4% despite beating earnings last week. Oracle, Micron, Broadcom and Microsoft also closed lower. Capital Economics: the IPO 'failed to rekindle enthusiasm for tech stocks.'", "angle": "Neoclouds (NBIS, CRWV) fell hardest. They are the most levered to AI financing conditions. If rates keep rising, they're the weakest link in the AI capex chain.", "tweetA": "The biggest AI customer in history went public, and its suppliers fell 5–8%. The market is saying ANT's growth doesn't have to mean growth for everyone downstream. That's a concentration problem for $NBIS $CRWV $AMD.", "tweetB": "Dow below 50,000 for the first time since June, the same day as the biggest IPO ever. In every market top I've studied, the biggest issuance came near the peak, not the trough.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/anthropic-ipo-sinks-markets"}, {"id": 39, "cat": "tech", "urgency": "watch", "source": "Morning Minute / Lucky Trader", "title": "Apple and Google both move into autonomous agents that control your computer", "idea": "Apple is building its own autonomous AI agent that would write code, browse the web and control apps on a user's behalf, to rival OpenAI and ANT. Per Mando, Google Gemini can now control Macs for users. Singapore's MAS warned that AI agents could spark bank runs.", "angle": "The OS owners are moving into the agent layer. That squeezes standalone agent startups, and the MAS warning points to the next regulatory front: agents moving money at machine speed.", "tweetA": "Gemini can already control a Mac. Apple is building its own agent so that Google doesn't run its users' computers. The platform fight has moved from search to who controls the computer.", "tweetB": "MAS: AI agents could cause bank runs. Picture a million agents optimizing yield and all moving deposits within the same minute. Depositor behavior is being automated faster than regulators can adapt.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/anthropic-ipo-sinks-markets"}, {"id": 40, "cat": "crypto", "urgency": "deep", "source": "Morning Minute / Lucky Trader", "title": "Coinbase will launch its own US prediction markets in H1 2027, moving off its Kalshi partnership", "idea": "Coinbase is targeting H1 2027 for its own prediction-market contracts for US retail and institutional clients, moving on from its Kalshi partnership. It also backed a CFTC proposal to bring event contracts under the federal swap definition. Polymarket did $509k in daily revenue. Per Mando, the Senate passed a DEATH BETS Act.", "angle": "Prediction markets are going in-house at exchanges, and Kalshi's distribution moat shrinks. Regulatory definitions (swap versus gaming) will decide who wins.", "tweetA": "Coinbase is replacing Kalshi with its own prediction markets. Every exchange wants event contracts in-house. The distribution moat Kalshi rented from Coinbase is gone.", "tweetB": "Coinbase wants event contracts defined as swaps, meaning federal CFTC rules and no state gaming laws. That definition matters more than any product launch in prediction markets.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://luckytrader.substack.com/p/anthropic-ipo-sinks-markets"}, {"id": 41, "cat": "positioning", "urgency": "deep", "source": "Mando Minutes", "title": "S&P tech P/E at 16.4x, the lowest since March 2020 (Kobeissi)", "idea": "Mando's chart of the day: the S&P tech sector P/E is 16.4x, the lowest since March 2020, per The Kobeissi Letter. In the same digest: the S&P is 3.3 SDs below its 50-DMA, as it was in April 2025 and March 2026 (Ryan Detrick), and Nvidia closed at $145 with its 200-week MA at $124.", "angle": "16.4x tech P/E is a March 2020 valuation in a hiking cycle rather than an emergency-cut cycle. Cheap and still falling, until the Fed blinks.", "tweetA": "Tech at 16.4x earnings is the cheapest since March 2020. In 2020 the Fed cut to zero in two weeks. Now it's discussing 50bp of hikes. Same multiple, opposite policy.", "tweetB": "Detrick: S&P 3.3 SDs below its 50-DMA, matching April 2025 and March 2026. Both of those turned out to be buying opportunities within weeks. Third time?", "charts": {"count": 1, "hot": true, "desc": "🔥 CHART WORTH SAVING: S&P tech forward P/E at 16.4x, lowest since Mar 2020"}, "link": "https://x.com/KobeissiLetter/status/2123506602015887795"}, {"id": 42, "cat": "macro", "urgency": "deep", "source": "Mando Minutes", "title": "NDX down 15% has cut 10-year yields by just 23bp (Luke Gromen)", "idea": "Luke Gromen's observation: a ~15% drawdown in the Nasdaq-100 has lowered 10-year yields by only 23bp. Bonds aren't hedging equity risk. PA Global Macro says the same: fixed income 'is not playing ball' even as commodities fall.", "angle": "The stock-bond correlation is positive again, so 60/40 isn't diversifying. Cash and USD are the only hedges working, which matches PA's 'only cash' conclusion.", "tweetA": "Nasdaq -15%, 10-year yield -23bp. In any previous selloff that would have been 75–100bp. Bonds have stopped hedging your stock portfolio, and the dollar and cash are the only hedges left.", "tweetB": "Bonds not rallying in an equity crash tells you inflation and supply worries (August 2027 coupon increases, 3.2% core PCE) outweigh recession fear. It's a 1970s-style setup.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://x.com/LukeGromen/status/2123482955418870052"}, {"id": 43, "cat": "credit", "urgency": "watch", "source": "Mando Minutes", "title": "US Treasury sells a 9-day bill, its first since the GFC", "idea": "Treasury sold a 9-day cash management bill for the first time since the global financial crisis (via Barchart). Ultra-short CMBs usually bridge cash shortfalls around tax dates or debt-ceiling pinches.", "angle": "Combined with JPM/GS's August 2027 coupon call, it shows Treasury cash management getting tighter. Watch the TGA, repo spreads and the Fed's standing repo facility usage.", "tweetA": "Treasury just issued its first 9-day bill since 2008. When the world's largest borrower starts funding nine days at a time, look at the plumbing: TGA, repo, SRF.", "tweetB": "9-day bills, a $1.6T funding gap, coupon increases pencilled in for August 2027. Treasury's financing problem is being handled one CMB at a time, and markets haven't paid much attention.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://x.com/Barchart/status/2123518663462408250"}, {"id": 44, "cat": "macro", "urgency": "deep", "source": "Mando Minutes", "title": "JPMorgan now projects Fed hikes in December, January and March", "idea": "JPMorgan projects Fed hikes in December, January and March. Fed Governor Jefferson says the AI boom is fuelling inflation. And the VIX closed at its highest since March.", "angle": "JPM's three hikes against Boockvar's 'none after December' is the macro debate. The swing factor is whether the AI selloff tightens conditions enough to do the Fed's job.", "tweetA": "Fed's Jefferson says the AI boom is fuelling inflation. So the Fed is hiking against AI capex while markets are already cutting AI capex for it. Someone is going to overshoot.", "tweetB": "JPM: hikes in December, January and March. VIX at its highest since March. Markets don't usually let the Fed reach the third hike in a schedule like that without something breaking first.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://x.com/DeItaone/status/2123379900245529008"}, {"id": 45, "cat": "geopolitics", "urgency": "act", "source": "Mando Minutes", "title": "US, China and Russia sign a joint peace declaration and agree to increase refined oil supply", "idea": "Per Mando: the US, China and Russia signed a joint peace declaration and agreed to increase refined oil supply. Separately, the Senate rejected curbs on Trump's Iran war powers. Oil is at ~$83 (-1%) per Morning Minute.", "angle": "A three-way supply pledge on refined products targets cracks, which is bearish for refining margins ($VLO $MPC) more than for crude. Watch diesel cracks.", "tweetA": "The US, China and Russia jointly pledged to increase refined oil supply. That aims at diesel and gasoline cracks, not crude. Refiners have to price in a political cap on margins.", "tweetB": "A US–China–Russia peace declaration on the same day as a Russian missile in Poland and Putin ending ceasefire talk. The document says one thing and events on the ground say another. Trade the ground.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://x.com/visegrad24/status/2123378143167648167"}, {"id": 46, "cat": "geopolitics", "urgency": "act", "source": "Mando Minutes", "title": "Russian missile hits eastern Poland, and Putin says the Crimean Bridge strike ended ceasefire talk", "idea": "Per Mando: a Russian missile hit eastern Poland, a NATO member. Putin said the Crimean Bridge strike ended ceasefire talk. Zelensky says Ukraine needs another $115B in 2027.", "angle": "A missile on NATO territory plus a collapse of ceasefire talks means a European defense bid and an energy risk premium. $115B for Ukraine in 2027 is a fiscal cost for the EU.", "tweetA": "A missile landed in Poland the same week the 'peace declaration' was signed. European defense names have been sold along with everything else, and this is the reminder of why they were bought.", "tweetB": "Ukraine needs $115B in 2027. With the US stepping back, that lands on EU budgets already stretched by energy and defense. More Bund and OAT supply, while Euribor fixings are already creeping up.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://x.com/visegrad24/status/2123685872964911532"}, {"id": 47, "cat": "geopolitics", "urgency": "deep", "source": "Mando Minutes", "title": "Denmark ratifies Trump's Greenland deal 109–0", "idea": "Per Mando: Denmark's parliament ratified Trump's Greenland deal 109–0. A unanimous vote suggests Copenhagen got its key terms.", "angle": "Greenland means rare earths, Arctic shipping lanes and missile-defense geography. Watch for US critical-minerals offtake deals and Arctic infrastructure contracts next.", "tweetA": "A unanimous 109–0 ratification means Denmark got what it wanted. The real story is the rare earths and Arctic sea lanes now under a US security umbrella.", "tweetB": "A year ago people treated Greenland as a joke. Now it's ratified with no dissent. It's the clearest example in 2026 of critical minerals driving geopolitics.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://x.com/MarioNawfal/status/2123445826286477777"}, {"id": 48, "cat": "cyber", "urgency": "act", "source": "Mando Minutes", "title": "Visa/Mastercard/JPM data leaked, NSA classified network down three days, and the White House cyber director is leaving", "idea": "Per Mando: hackers leaked Visa, Mastercard and JPMorgan customer data. The NSA's classified network has been down for a third straight day. White House cyber director Cairncross is leaving. And a Binance hacker moved $594M of ETH in two days.", "angle": "A cluster of cyber events alongside Guillemet's 'AI makes attacks cheaper' warning suggests a regime shift in attack costs. Cyber budgets are among the few defensive tech spends that hold up in a downturn.", "tweetA": "Payment-network data leaked, the NSA's classified network down three days, and the White House cyber chief leaving, all in the same week. If AI really is making attacks cheaper, this is what that looks like.", "tweetB": "The Ledger CTO says AI makes attacks cheaper and faster to scale. The same day, Visa/MC/JPM data leaks and the NSA network stays down. Security spending is about to become non-discretionary, even in a downturn.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://x.com/DeItaone/status/2123444639747240248"}, {"id": 49, "cat": "credit", "urgency": "act", "source": "Mando Minutes", "title": "US trucking bankruptcy rate hits a 20-year high as bank stocks fall into a death cross", "idea": "Per Mando: the US trucking-firm bankruptcy rate hit a 20-year high (Unusual Whales) and US bank stocks slid into a death cross (Bloomberg). Peter Brandt flags a textbook weekly head-and-shoulders top in the S&P 400.", "angle": "Freight recession plus weak banks plus a mid-cap topping pattern are real-economy and credit signals that line up with Rosenberg's transports and copper warning. Regional bank CRE and C&I books are exposed.", "tweetA": "Trucking bankruptcies at a 20-year high is the economy below the AI headlines. Freight moves physical goods, and right now freight companies are failing. Banks are already in a death cross.", "tweetB": "Mid-caps (S&P 400) completing a textbook head-and-shoulders top while trucking firms fail at a 20-year-high rate. The real economy is rolling over beneath the AI story.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://x.com/unusual_whales/status/2123415245611847731"}, {"id": 50, "cat": "AI/infra", "urgency": "deep", "source": "Mando Minutes", "title": "ANT has committed ~$901B to compute through 2045, and banks earned a record $550M in fees", "idea": "Per Mando: Anthropic has committed ~$901B for compute through 2045. Banks earned a record $550M in fees on the IPO. The average Anthropic employee is now worth $44M (Kobeissi). Claude had a partial outage on IPO day.", "angle": "A $901B multi-decade compute commitment is a backlog for $NVDA, $GOOGL (TPU), $AMZN and power providers. It's also a fixed cost that turns ANT into a levered bet on its own revenue growth.", "tweetA": "$901B in compute commitments through 2045. That's a 19-year take-or-pay contract with the physics of AI. Suppliers get a backlog, and ANT shareholders get operating leverage in both directions.", "tweetB": "Average ANT employee: $44M. That's the biggest single wealth event for engineers in history, concentrated in San Francisco. Watch Bay Area housing, angel investing and a wave of new startups in 2027.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://x.com/Cointelegraph/status/2123471467807388148"}, {"id": 51, "cat": "geopolitics", "urgency": "act", "source": "Mando Minutes", "title": "US cleared 880K Nvidia/AMD AI chips for China while California probes Nvidia over China risk", "idea": "Per Mando: the US cleared 880K Nvidia and AMD AI chips for export to China. California is probing whether Nvidia misled investors on China risk. AMD sank on Hunterbrook's China chip claims. Nvidia is in advanced talks to buy Inception.", "angle": "Export licenses are rising while disclosure scrutiny rises too. China revenue is now a legal risk as well as a policy risk. Watch the Hunterbrook-style short reports on China exposure.", "tweetA": "Washington approved 880K AI chips for China. At the same time California is investigating whether Nvidia misled investors about China risk. Federal policy opens the door and state enforcement makes using it risky.", "tweetB": "AMD -7.7% on a short-seller report about China chips, and that's with 880K export licenses approved. The market isn't pricing China volume, it's pricing the chance it gets clawed back.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://x.com/zerohedge/status/2123572140469260593"}, {"id": 52, "cat": "AI/infra", "urgency": "deep", "source": "Mando Minutes", "title": "SpaceX prices $32B of AI chip debt, and Microsoft taps Intel for Azure chips", "idea": "Per Mando: SpaceX priced $32B of AI chip debt in three tranches. Microsoft is tapping Intel for Azure chips (via Beth Kindig).", "angle": "AI capex is moving from equity-funded to debt-funded just as rates rise. A rocket company issuing $32B of chip debt is a late-cycle financing signal. Intel foundry gets a hyperscaler anchor customer.", "tweetA": "SpaceX, a rocket company, just borrowed $32B to buy AI chips. When AI capex financing shifts from equity to debt during a Fed hiking cycle, credit spreads become the thing to watch.", "tweetB": "Microsoft choosing Intel for Azure chips is the foundry win $INTC has been waiting for. In a week when every AI name is down, the second-sourcing trade is the contrarian long.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://x.com/zerohedge/status/2123542875480936730"}, {"id": 53, "cat": "energy", "urgency": "deep", "source": "Mando Minutes", "title": "Senate passes the US energy permitting overhaul bill", "idea": "Per Mando: the Senate passed a US energy permitting overhaul bill. Permitting has been the binding constraint on transmission, pipelines and the generation needed for data centers.", "angle": "Permitting reform is the unlock for grid and transmission capex. $PWR, $ETN, $GEV and transmission EPCs benefit, which is a rare AI-adjacent beneficiary that doesn't depend on AI multiples.", "tweetA": "Data centers' binding constraint was never chips, it was permits. The Senate just passed permitting reform during an AI selloff, and grid builders are the AI trade that doesn't depend on ANT's multiple.", "tweetB": "Energy permitting reform passed with markets in freefall and almost nobody noticed. Transmission lines take 7–10 years to permit, and cutting that matters more than any single earnings report.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://x.com/zerohedge/status/2123614385356595547"}, {"id": 54, "cat": "crypto", "urgency": "deep", "source": "Mando Minutes", "title": "BTC ETF puts at a 17% premium, IBIT -$541M, and Brandt says the bottom could drag into 2028", "idea": "Per Mando: BTC ETF puts trade at a 17% premium, back to extreme fear, and IBIT saw $541M leave. Views are split: KillaXBT says BTC has bottomed against gold, blknoiz06 says it's unwise to bid majors in size, Peter Brandt says the bottoming process could drag into early 2028. Also: MoonPay applied for a US national bank charter, and Chainlink and UBS are targeting the $2T+ structured notes market.", "angle": "A 17% put premium is extreme hedging demand, and those spikes are often followed by short-term relief rallies. The structural signal is plumbing: MoonPay bank charter, Chainlink/UBS structured notes.", "tweetA": "Bitcoin ETF puts are trading at a 17% premium. Everyone has bought protection, and when everyone is hedged, the next surprise tends to be a squeeze higher.", "tweetB": "Prices are crashing while the plumbing gets built: MoonPay applying for a national bank charter, Chainlink and UBS targeting $2T of structured notes. Infrastructure keeps getting built through bear markets.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://x.com/BitcoinArchive/status/2123459158343324066"}, {"id": 55, "cat": "macro", "urgency": "deep", "source": "PA Global Macro / Paper Alfa", "title": "PA: correlations flip daily, forced deleveraging is underway, and cash is the only hiding place", "idea": "PA Global Macro: cross-market correlations are flipping daily, liquidity is thinning and forced deleveraging is happening in size. With inflation high and central banks hawkish, cash is the only viable hiding place. All assets falling together drives durable FX moves (a strong dollar), which tightens global conditions through EM carry unwinds. Commodities are dropping, and real rates have barely moved as inflation expectations collapse.", "angle": "Real rates flat while breakevens collapse means nominal yields are falling only through inflation expectations. That's not supportive for duration. The dollar is the clean expression.", "tweetA": "When every asset is correlated to the downside, the only trade that works is the funding currency. PA says it plainly: cash. The dollar rally isn't optimism about the US, it's the world deleveraging.", "tweetB": "Commodities are collapsing, inflation expectations are collapsing, and real rates haven't moved. That means the market thinks the Fed will keep real policy tight no matter what, which is the definition of a policy error in progress.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.paperalfa.com/p/friday-thoughts-fe4"}, {"id": 56, "cat": "credit", "urgency": "deep", "source": "PA Global Macro / Paper Alfa", "title": "Euribor–ESTR basis widening while German 2-year yields refuse to fall", "idea": "PA flags the European front end: the ECB will likely hike in December even though energy prices collapsed this month. German 2-year yields have been sticky and roughly flat since October. Euribor fixings are creeping up, widening the 3-month basis to ESTR, which raises funding costs and drains liquidity. European stocks took the brunt of it this week after recent highs.", "angle": "A widening Euribor–ESTR basis is a bank-funding stress gauge. Combined with US bank stocks in a death cross, check European bank CDS. The ECB hiking into an energy collapse looks like a 2008/2011-style error.", "tweetA": "Euribor is drifting above ESTR while the ECB prepares to hike into an energy price collapse. Bessent warned this week of a 2008-style ECB policy error, and the funding basis is already moving.", "tweetB": "German 2-year yields haven't moved since October despite energy collapsing. The ECB is guiding to a hike that the energy data doesn't support. Receiving the Schatz is the asymmetric trade if they back off.", "charts": {"count": 1, "hot": true, "desc": "🔥 CHART WORTH SAVING: 3M Euribor–ESTR basis widening"}, "link": "https://www.paperalfa.com/p/friday-thoughts-fe4"}, {"id": 57, "cat": "macro", "urgency": "deep", "source": "PA Global Macro / Paper Alfa", "title": "Australia's front end is now pricing cuts after weak housing and labor data", "idea": "PA notes that Australia is the one bond market rallying: front-end yields now anticipate cuts after weaker housing data and a softening labor market. Innes separately flags fears the RBA has overtightened.", "angle": "Australia is the first developed market to flip from hikes to cuts, so it's the template for others. Receive AU front end and short AUD/JPY: two sources, one trade.", "tweetA": "Australia went from hiking to pricing cuts in weeks, on housing and jobs. If the first developed market to pivot is the most housing-sensitive one, Canada is next.", "tweetB": "Two newsletters, same conclusion: the RBA overtightened. Whichever central bank tightened hardest into a housing-sensitive economy is the first to reverse. That's the developed-market pivot sequence for 2027.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.paperalfa.com/p/friday-thoughts-fe4"}, {"id": 58, "cat": "positioning", "urgency": "deep", "source": "PA Global Macro / Paper Alfa", "title": "2018 'far from neutral' versus Waller's 50bp: PA studies 13 episodes since the 1970s", "idea": "PA compares now to Q4 2018, when Powell's 'far from neutral' comment triggered a Fed-induced equity selloff, with Waller now floating a 50bp hike and inflation worse than in 2018. He also looks at dot-com deleveraging and plans an analysis of 13 episodes since the 1970s. He's defensive, owns some bonds, and is closing his equity downside today. His buy-and-hold 2026 portfolio is +6% YTD, slightly ahead of the S&P.", "angle": "An experienced macro trader closing equity hedges on the day breadth hit 7% is a tell. The 2018 analogue bottomed on Christmas Eve, the same date Morning Minute's SpaceX projection points to.", "tweetA": "Powell's 2018 'far from neutral' produced a 20% drawdown and a Christmas Eve low. Waller's 2026 50bp talk is the same playbook with worse inflation. Two sources independently point to a Christmas bottom.", "tweetB": "A macro PM with decades of crisis experience is closing his equity downside hedges today, the day after 93% of stocks fell. Professionals take profits on hedges when panic peaks.", "charts": {"count": 0, "hot": false, "desc": ""}, "link": "https://www.paperalfa.com/p/friday-thoughts-fe4"}];

  h+='<span class="ttl">'+esc(item.title)+'</span></div>';
  h+='<div class="cb"><div class="lbl">the idea</div><div class="idea">'+esc(item.idea)+'</div>';
  h+='<div class="lbl">my angle</div><div class="angle" style="border-color:'+c+';background:'+tint(c)+'">'+esc(item.angle)+'</div>';
  h+='<div class="tw"><div class="tbox"><div class="tl" style="color:#378add">TWEET A '+'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button>'+'</div>'+esc(item.tweetA)+'</div>';
  h+='<div class="tbox"><div class="tl" style="color:#7f77dd">TWEET B '+'<button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button>'+'</div>'+esc(item.tweetB)+'</div></div>';
  h+='<div class="chart'+(ch.hot?' hotc':'')+'">📊 Charts: '+ch.count+(ch.desc?' — '+esc(ch.desc):' — no charts in email')+'</div>';
  h+='<div class="lbl" style="margin-top:8px">source</div><div style="font-size:13px;color:#555">'+esc(item.source)+'</div>';
  h+='<a class="lnk" href="'+esc(item.link)+'" target="_blank" rel="noopener">↗ Read full article</a></div></div>';
  return h;
}
function toggle(id){document.getElementById("card"+id).classList.toggle("open");}
function apply(){
  ITEMS.forEach(function(it){
    var el=document.getElementById("card"+it.id);
    var ok=(curCat==="All"||it.cat===curCat)&&(curUrg==="All"||it.urgency===curUrg)&&(!curSrc||it.source.indexOf(curSrc)>=0);
    el.style.display=ok?"":"none";
    if(curSrc&&ok){el.classList.add("open");}else{el.classList.remove("open");}
  });
  document.getElementById("flt").textContent=curSrc?("Source filter: "+curSrc+" (click any filter to reset)"):"";
  renderBars();
}
function setCat(c){curCat=c;curSrc=null;apply();}
function setUrg(u){curUrg=u;curSrc=null;apply();}
function filterBySrc(name){curSrc=name;curCat="All";curUrg="All";apply();window.scrollTo(0,0);}
function renderBars(){
  var cc={};ITEMS.forEach(function(i){cc[i.cat]=(cc[i.cat]||0)+1;});
  var h='<button class="pill'+(curCat==="All"?' active':'')+'" style="'+(curCat==="All"?'background:#333':'')+'" onclick="setCat(\'All\')">All '+ITEMS.length+'</button>';
  Object.keys(cc).sort(function(a,b){return cc[b]-cc[a];}).forEach(function(c){
    var a=curCat===c;
    h+='<button class="pill'+(a?' active':'')+'" style="'+(a?'background:'+col(c):'border-color:#ccc')+'" onclick="setCat(\''+c+'\')">'+esc(c)+' '+cc[c]+'</button>';
  });
  document.getElementById("catbar").innerHTML=h;
  var uc={act:0,deep:0,watch:0};ITEMS.forEach(function(i){uc[i.urgency]++;});
  var u='<button class="pill'+(curUrg==="All"?' active':'')+'" style="'+(curUrg==="All"?'background:#333':'')+'" onclick="setUrg(\'All\')">All</button>';
  ["act","deep","watch"].forEach(function(k){
    var a=curUrg===k;
    u+='<button class="pill'+(a?' active':'')+'" style="'+(a?'background:#555':'')+'" onclick="setUrg(\''+k+'\')">'+URGN[k]+' '+uc[k]+'</button>';
  });
  document.getElementById("urgbar").innerHTML=u;
}
function init(){
  document.getElementById("sub").textContent=META.date+" · "+META.time+" · "+ITEMS.length+" items · "+META.sourcesCount+" sources";
  var html="";ITEMS.forEach(function(it){html+=card(it);});
  document.getElementById("cards").innerHTML=html;
  var r='<p><b>Window:</b> '+META.windowStart+' to '+META.windowEnd+'. Emails outside this window were not processed.</p>';
  r+='<p><b>Emails in window:</b> '+META.emailsInWindow+' · <b>Read:</b> '+META.emailsRead+' · <b>Items:</b> '+META.itemsExtracted+'</p>';
  r+='<div class="lbl">included sources (click to filter)</div><table>';
  META.includedSources.forEach(function(s){r+='<tr><td><span class="srcl" onclick="filterBySrc(\''+s.name.replace(/'/g,"\\'")+'\')">'+esc(s.name)+'</span></td><td style="text-align:right">'+s.items+'</td></tr>';});
  r+='</table><div class="lbl">skipped sources</div>';
  r+=META.skippedSources.length?('<table>'+META.skippedSources.map(function(s){return '<tr><td>'+esc(s.name)+'</td><td>'+esc(s.reason)+'</td></tr>';}).join('')+'</table>'):'<p>None — every email in window had extractable content.</p>';
  r+='<p style="font-size:12px;color:#777">'+esc(META.notes)+'</p>';
  document.getElementById("repbody").innerHTML=r;
  renderBars();
}
init();
</script></body></html>
