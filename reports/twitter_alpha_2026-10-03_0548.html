<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twitter Alpha Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --border: #e8e3da;
  --border-light: #f0ede4;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #8a8a8a;
  --accent: #1a8cd8;
  --red: #d94052;
  --yellow: #fff5b3;
  --yellow-border: #f0d966;

  /* category colors (per spec) */
  --cat-macro: #2563eb;        /* blue */
  --cat-crypto: #8b5cf6;       /* purple */
  --cat-energy: #dc2626;       /* red */
  --cat-tech: #0d9488;         /* teal */
  --cat-ai: #4f46e5;           /* indigo */
  --cat-geopolitics: #dc2626;  /* red */
  --cat-positioning: #15803d;  /* green */
  --cat-regulation: #7c3aed;   /* purple */
  --cat-society: #d97706;      /* amber */
  --cat-em: #059669;           /* green */
  --cat-default: #6b7280;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.55;
       background: var(--bg); color: var(--text); }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 20px; }
.title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-3); }

/* FILTER BAR */
.filter-bar { display: none; background: var(--yellow); border: 1px solid var(--yellow-border);
              border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
              align-items: center; gap: 10px; font-size: 13px; }
.filter-bar.active { display: flex; }
.filter-bar button { font-family: inherit; font-size: 12px; background: transparent;
                     border: 1px solid var(--text); padding: 3px 10px; border-radius: 4px;
                     cursor: pointer; }
.filter-bar button:hover { background: rgba(0,0,0,0.05); }

/* SUMMARY */
.summary { background: var(--surface); border: 1px solid var(--border);
           border-left: 4px solid var(--red); border-radius: 6px;
           padding: 16px 18px; margin-bottom: 20px; }
.summary p { margin-bottom: 8px; }
.summary p:last-child { margin-bottom: 0; }
.summary strong { font-weight: 600; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border);
           border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                background: #f3efe6; cursor: pointer; user-select: none;
                font-weight: 600; font-size: 13px; }
.section-head:hover { background: #ebe6dc; }
.section-letter { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
                  color: var(--text-3); min-width: 18px; }
.section-name { flex: 1; }
.section-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
                 color: var(--text-3); }
.section-arrow { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.section.open .section-arrow { transform: rotate(90deg); }
.section-body { display: none; padding: 6px 0; }
.section.open .section-body { display: block; }

/* CLUSTER (Section A) */
.cluster { padding: 14px 16px; border-bottom: 1px solid var(--border-light); }
.cluster:last-child { border-bottom: none; }
.cluster-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
                flex-wrap: wrap; }
.cluster-title { font-weight: 600; font-size: 14px; }
.cluster-desc { color: var(--text-2); font-size: 13px; margin: 0 0 10px 0; }
.cluster-items { display: flex; flex-direction: column; gap: 8px; padding-left: 10px;
                 border-left: 2px solid var(--border-light); }
.cluster-item { font-size: 13px; padding: 6px 8px; border-radius: 4px; }
.cluster-item .item-text { font-size: 13px; margin-top: 4px; }
.cluster-item .item-head { font-size: 12px; }

/* ITEM CARDS (Sections B/C/D) */
.item-card { background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; padding: 12px 14px; margin: 10px 16px; }
.item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
             flex-wrap: wrap; }
.item-author { font-weight: 600; color: var(--accent); cursor: pointer; }
.item-author:hover { text-decoration: underline; }
.item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--text-3); }
.item-link { font-family: 'IBM Plex Mono', monospace; font-size: 11px;
             color: var(--accent); text-decoration: none; }
.item-link:hover { text-decoration: underline; }
.item-text { font-size: 13.5px; line-height: 1.6; color: var(--text);
             white-space: pre-wrap; word-wrap: break-word; }
.item-thread { display: inline-block; font-size: 10px; font-weight: 600;
               background: var(--border); color: var(--text-2); padding: 1px 6px;
               border-radius: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* CONTRARIAN (Section C) — red left border + soft red bg */
.section-contrarian .item-card {
  border-left: 4px solid var(--red);
  background: #fdf6f7;
}

/* CATEGORY PILLS */
.pill { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px;
        font-weight: 500; padding: 2px 7px; border-radius: 3px; color: #fff;
        text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }

/* IMAGES */
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumb { height: 100px; border: 1px solid var(--border); border-radius: 4px;
         cursor: zoom-in; background: #f0ede4; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
            align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 92vh;
                box-shadow: 0 8px 40px rgba(0,0,0,.6); }

/* LINKS (Section E) */
.link-row { padding: 8px 16px; border-bottom: 1px solid var(--border-light);
            font-size: 13px; display: flex; gap: 12px; align-items: baseline; }
.link-row:last-child { border-bottom: none; }
.link-author { color: var(--text-3); min-width: 110px; cursor: pointer; }
.link-author:hover { color: var(--accent); }
.link-url { font-family: 'IBM Plex Mono', monospace; font-size: 12px;
            color: var(--accent); text-decoration: none; word-break: break-all; flex: 1; }
.link-url:hover { text-decoration: underline; }
.link-desc { color: var(--text-2); font-size: 12px; }

/* AUTHOR FILTER STATES */
.filterable.match { background: var(--yellow); border-color: var(--yellow-border); }
.section-contrarian .item-card.filterable.match { background: var(--yellow); }
.filterable.dim { opacity: 0.25; }

/* STATS BAR */
.stats { margin-top: 24px; padding: 10px 14px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px;
         font-family: 'IBM Plex Mono', monospace; font-size: 11.5px;
         color: var(--text-2); display: flex; gap: 18px; flex-wrap: wrap; }
.stats strong { color: var(--text); font-weight: 600; }

/* EMPTY */
.empty { color: var(--text-3); font-size: 13px; padding: 14px 18px; font-style: italic; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .container { padding: 16px 12px 60px; }
  .item-card { margin: 8px 10px; }
  .link-row { flex-direction: column; gap: 4px; }
  .link-author { min-width: 0; }
  .header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>
</head>

<script>
const REPORT_DATA = {"report_type": "TWITTER ALPHA INTELLIGENCE", "collected_at": "2026-10-03T05:21:06Z", "input_stats": {"total_tweets": 207, "unique_authors": 73, "tweets_with_images": 40, "after_noise_filter": 105}, "summary": "**Fed/Rates:** October hike odds collapsed from **70% to 23%** in three days (elerianm), December still **86%**. @biancoresearch argues bond traders actually want a hike and the 2yr/10yr aren't following the odds down; @Fullcarry calls post-NFP UST action a headscratcher (FV down 24 ticks).\n\n**Oil:** @qthomp calls **$125–130 Brent** by late October after the US SPR and European reserve releases; @JavierBlas flags Trump's walk-back on a diesel export ban (\"never going to do it\") and **CME dropping 24/7 oil trading**. @zriboua reads Saudi prep for a Houthi offensive as a signal of Houthi weakness.\n\n**Crypto:** Market cap touched **$3T** but the tape is ugly: @_tolks sees $21 or lower and trapped ETH longs, @fejau_inc and @qthomp flag credit spreads cracking. September hacks totalled **~$768M** (Bitget $387.5M, Liquid $318.7M), the NEAR Intents hacker returned **$3.8M**, Microsoft's X account was hijacked for a Clippy scam, and **Blast is shutting down**.\n\n**Tokenized stocks/regulation:** Robinhood Chain activity, **BNB over $1B** in onchain stocks, Coinbase's September shipping streak; Hester Peirce exits the SEC and the SEC proposes ETF performance fees of up to 20%.\n\n**AI:** NYT report that Anthropic's Chris Olah clashed with the Pope on machine consciousness set off a debate (@DCinvestor, @buccocapital, @nic_carter, @paulg); Meta open-sourced **Muse Gadgets**; Meta and OpenAI reportedly shed 5+ safety researchers; @Rewkang says robot demand outruns supply.\n\n**Notable:** Trump says higher inflation will \"pay off\" **$40T** of debt; @MelMattison1 forecasts war endings, 10yr below 5% and SPX above 8K.", "sections": {"A_events": [{"cluster": "Fed October Hike Odds Collapse — Bond Market Not Buying It", "category": ["macro"], "items": [{"author": "elerianm", "summary": "Market-implied probability of an October Fed hike at the FOMC three weeks out plunged from 70% to 23% in three days; the December 9 hike probability slipped from 95% to 86%. Chart from CNBC attached.", "tweet_url": "https://x.com/elerianm/status/2106101958243176453", "images": ["https://pbs.twimg.com/media/HTpgkYrXwAAskJX.jpg"], "type": "tweet"}, {"author": "biancoresearch", "summary": "Thread: Fedspeak (Williams, then Jefferson) cut the Oct 28 hike probability from 70% Monday to ~25% Friday and the payrolls miss reinforced it, yet yields did not follow. The 2yr normally tracks hike odds but has fallen less than the probability implies since Williams said there is 'no urgency'; the 10yr is up almost 40bp over three weeks while crude is down $2, so it is not just oil. His read: the 2yr shows what bond traders WANT (a hike) and the probability shows what they expect to GET, so the market wants a hike and thinks it won't get one. 2024–26 was the first cutting cycle in 50+ years with higher yields, which he reads as the market saying short rates needed to be higher. If the Fed refrains again, he asks whether yields rise further.", "tweet_url": "https://x.com/biancoresearch/status/2106149100592980279", "images": ["https://pbs.twimg.com/media/HTqF3WNXUAEQine.png", "https://pbs.twimg.com/media/HTqGzY5XwAEvnIX.png", "https://pbs.twimg.com/media/HTqGEe5WEAAYKcw.png", "https://pbs.twimg.com/media/HTqIC3xXEAA0uJL.png"], "type": "thread"}, {"author": "Fullcarry", "summary": "Treasury price action after NFP is a 'headscratcher': front-end FV fell 24 ticks high-to-low despite a favorable number and October being effectively dead as a hike. He guesses the 5s30s curve hit major resistance in the high 60s; the long end moved far less than the front end. Charts attached.", "tweet_url": "https://x.com/Fullcarry/status/2106079704218247494", "images": ["https://pbs.twimg.com/media/HTpMRAuW4AEs40H.png", "https://pbs.twimg.com/media/HTpStF-W8AA3swn.png"], "type": "thread"}, {"author": "jimcramer", "summary": "Cramer: hard to sustain a rally when rates turn higher off oil reversing and rising; 'tough tape even as we are very oversold'.", "tweet_url": "https://x.com/jimcramer/status/2106063263138267524", "images": [], "type": "tweet"}]}, {"cluster": "Oil: Reserve Releases, Diesel Export Ban Walk-back, CME Retreat", "category": ["energy", "geopolitics"], "items": [{"author": "qthomp", "summary": "Recaps the week in oil: Monday a 'fake news headline onslaught', Tuesday the US empties the SPR, Friday Europe empties its strategic reserves — and asks which way the chart is headed (chart attached). His separate call: $125–130 front-month Brent by mid-to-late October.", "tweet_url": "https://x.com/qthomp/status/2106063586506231875", "images": ["https://pbs.twimg.com/media/HTo9bTUWQAAnSr9.jpg", "https://pbs.twimg.com/tweet_video_thumb/HTo9qwvX0AEGUgI.jpg"], "type": "tweet"}, {"author": "qthomp", "summary": "Calls for $125–$130 front-month Brent by mid-to-late October.", "tweet_url": "https://x.com/qthomp/status/2106078257577935138", "images": [], "type": "tweet"}, {"author": "JavierBlas", "summary": "Reports Trump, asked whether a diesel export ban was off the table, said 'We were never going to do it' — though he had said several times in the past two weeks it was under consideration and that he supported it. Trump also praised Europe for releasing diesel from reserves.", "tweet_url": "https://x.com/JavierBlas/status/2106129837606006960", "images": [], "type": "tweet"}, {"author": "JavierBlas", "summary": "CME Group abandons plans for 24/7 oil trading, citing industry concern that round-the-clock energy trading without more diligence could have unintended consequences.", "tweet_url": "https://x.com/JavierBlas/status/2106122957579841968", "images": [], "type": "tweet"}, {"author": "zriboua", "summary": "Reading Reuters' report that Saudi Arabia is preparing an offensive against the Houthis in Yemen within weeks (Yemeni ld be 'screaming about credit right now. Spreads are starting to go.'", "tweet_url": "https://x.com/qthomp/status/2106073646317863356", "images": [], "type": "tweet"}, {"author": "citrini", "summary": "Replying to @P_Remarks on a 678bp figure (likely a credit spread), citrini says 'basically distressed'.", "tweet_url": "https://x.com/citrini/status/2106242638080803142", "images": [], "type": "tweet"}, {"author": "ColdBloodShill", "summary": "Friday was 'not a fuck-you-bears' day but a more aggressive return to ultra-chop price action (chart attached).", "tweet_url": "https://x.com/ColdBloodShill/status/2106096746720051459", "images": ["https://pbs.twimg.com/media/HTpavegXEAAIX_j.jpg"], "type": "tweet"}, {"author": "rektmando", "summary": "After big liquidation wicks in alts, says one name is 'the only one I keep buying', quoting a call that it is 'mispriced by 20x' (token not named in text; video attached).", "tweet_url": "https://x.com/rektmando/status/2106131538312110246", "images": ["https://pbs.twimg.com/tweet_video_thumb/HTqLxIXW0AALhCK.jpg"], "type": "tweet"}, {"author": "Evan_ss6", "summary": "Crypto market cap hit $3T — 'but have we earned it?'", "tweet_url": "https://x.com/Evan_ss6/status/2106094342272364594", "images": [], "type": "tweet"}]}, {"cluster": "September Hacks: $768M Lost; NEAR Intents Funds Returned; Microsoft X Account Hijacked", "category": ["crypto", "regulation"], "items": [{"author": "stacy_muur", "summary": "Tally of September hacks totals ~$768M: Bitget $387.5M, Liquid $318.7M, DCENT wallets $16.1M, Duelbits ~$7M, Neutron ~$4.4M (governance attack hit Drop and Astroport), Nostra $3.5M, Limit Break ~$2.8M, plus a long tail down to ether.fi ~$43K.", "tweet_url": "https://x.com/stacy_muur/status/2106083795833364884", "images": [], "type": "tweet"}, {"author": "arthur0x", "summary": "The $3.8M NEAR Intents hacker returned the funds in full; NEAR is stopping the investigation and urges bug bounties over disrupting services.", "tweet_url": "https://x.com/arthur0x/status/2106242822919864580", "images": [], "type": "tweet"}, {"author": "stacy_muur", "summary": "Microsoft's 13M-follower X account was hijacked to boost a fake Clippy account tied to a crypto scam; Microsoft posted an apology threatening legal action and then deleted it. Stacy Muur's take: account security depends on the people and tools with access.", "tweet_url": "https://x.com/stacy_muur/status/2106236973304463510", "images": [], "type": "tweet"}, {"author": "0xQuit", "summary": "Warns about phishing sites piggybacking on the recent exploit; use a revoke tool for approvals and treat anything sent to you as a scam — otherwise the drain recurs each time you wrap ETH.", "tweet_url": "https://x.com/0xQuit/status/2106121192470122614", "images": ["https://pbs.twimg.com/media/HTpxxWwWoAA55BR.jpg"], "type": "thread"}, {"author": "laurashin", "summary": "Interview (YouTube): scammers built a fake investment firm with fake team members days after the Bitget hack to approach Bitget; a check through another channel exposed them.", "tweet_url": "https://x.com/laurashin/status/2106173133929714039", "images": [], "type": "tweet"}]}, {"cluster": "Blast Shutting Down — Post-Mortems on the L2 Airdrop Era", "category": ["crypto"], "items": [{"author": "CirrusNFT", "summary": "Reacts to the announcement that Blast is shutting down (operating costs exceed L2 revenue): recalls championing the project after a 7-figure Blur win, getting a $700k airdrop on day one, holding it all, and a year later accidentally sending the entire airdrop to the Blast liquidity pool.", "tweet_url": "https://x.com/CirrusNFT/status/2106076270438371621", "images": [], "type": "thread"}, {"author": "zeroxkyle", "summary": "Notes DegenSpartan once demanded $1M for any shill and then shilled Blast, in response to a post calling Pacman one of the greatest extractors (Blast and Blur).", "tweet_url": "https://x.com/zeroxkyle/status/2106173113591545958", "images": [], "type": "tweet"}, {"author": "0xQuit", "summary": "Quips '@blast do blur next'.", "tweet_url": "https://x.com/0xQuit/status/2106100414387192089", "images": [], "type": "tweet"}]}, {"cluster": "Tokenized Stocks Momentum: Robinhood Chain, BNB, Coinbase, Backpack", "category": ["crypto", "tech"], "items": [{"author": "0xSammy", "summary": "Back from time off: Robinhood tokenized-stock activity is being discussed in Bloomberg, BNB has surpassed $1B in stocks onchain, and BlackRock is tokenizing on Solana — 'we are only getting started'.", "tweet_url": "https://x.com/0xSammy/status/2106075222512423065", "images": ["https://pbs.twimg.com/media/HTpIPyLW4AA6pZl.jpg"], "type": "thread"}, {"author": "0xSammy", "summary": "Thread asking who is building the most innovative hook mechanisms: Uniswap v4 hooks, activity on HOOKR, standard_rsv (hooks as part of the protocol), MeebitCompany/Stonkbrokers experiments, and time-restricted coin trading. Quotes Robinhood Chain noting hooks are among its most active areas.", "tweet_url": "https://x.com/0xSammy/status/2106162663638327438", "images": [], "type": "thread"}, {"author": "brian_armstrong", "summary": "Coinbase's September: IPO access, a Citi stablecoin partnership, enablement for 1,000+ community banks and AI agents trading stocks — 'We're shipping.'", "tweet_url": "https://x.com/brian_armstrong/status/2106074177409306753", "images": [], "type": "tweet"}, {"author": "Evan_ss6", "summary": "Thread pitching/diligencing 'tokenized stocks' exposure: skeptical of the 'Backpack is the Tether of onchain stocks' thesis (Tether earns on float, Backpack a sliver on volume; ~$97K trading cost on SPCX's first-month volume at 0.9bp). Says Aave/Morpho are strong lending contenders for RWA collateral and sees most plays as downstream beneficiaries rather than wrapper or lending-book owners.", "tweet_url": "https://x.com/Evan_ss6/status/2106112617127477421", "images": ["https://pbs.twimg.com/tweet_video_thumb/HTpuUUuX0AADLyC.jpg"], "type": "thread"}, {"author": "brian_ ild the harness: (1) private knowledge base with one cross-model rulebook and sourced facts, (2) life tracker plus six reusable skills with traceable corrections, (3) test suite checking files, scenarios, refusal-over-fabrication, secret scans and Git backup.", "tweet_url": "https://x.com/hooeem/status/2106173397918966025", "images": ["https://pbs.twimg.com/media/HTqhidYWwAAzQPQ.jpg", "https://pbs.twimg.com/media/HTqhidmXUAA8IwC.jpg", "https://pbs.twimg.com/media/HTqhidaXYAArfRt.jpg", "https://pbs.twimg.com/media/HTqhidaWoAIHOBz.jpg", "https://pbs.twimg.com/media/HTqc_jLXoAEZLQY.jpg", "https://pbs.twimg.com/media/HTqc_iFWQAABQPB.jpg", "https://pbs.twimg.com/media/HTqc_iIWQAAP44x.jpg", "https://pbs.twimg.com/media/HTqc_iEXMAAujMV.jpg", "https://pbs.twimg.com/media/HTqjSPrXoAAxpUA.jpg", "https://pbs.twimg.com/media/HTqjSPwWUAAG57B.jpg", "https://pbs.twimg.com/media/HTqjSPwWwAA0cTm.jpg", "https://pbs.twimg.com/media/HTqjSPyWIAAiedv.jpg"], "type": "tweet", "more_urls": ["https://x.com/hooeem/status/2106168398849716226", "https://x.com/hooeem/status/2106205344934531581"]}, {"author": "udiWertheimer", "summary": "Thinks AI will mainly change places where economics never worked: VR is seeing a renaissance as people mod existing PC games with Claude in a weekend, 'killing' a VR game industry that was already dead. For major games he's unconvinced anything changes — live-service slop was already rejected, and Half-Life 3 would still sell because brand and story win.", "tweet_url": "https://x.com/udiWertheimer/status/2106067776099983449", "images": [], "type": "tweet"}, {"author": "udiWertheimer", "summary": "Defends Nvidia's 64GB DGX Spark: it pushes open-source releases to target smaller sizes, memory prices likely rise 1–2 more years, so the answer to local AI is smarter small models; suspects it's also supply-chain prep for RTX Spark next week.", "tweet_url": "https://x.com/udiWertheimer/status/2106079267591500127", "images": [], "type": "thread"}, {"author": "cryptopunk7 // ---------- helpers ----------
const CAT_VARS = {
  macro: 'var(--cat-macro)',
  crypto: 'var(--cat-crypto)',
  energy: 'var(--cat-energy)',
  tech: 'var(--cat-tech)',
  ai: 'var(--cat-ai)',
  'ai/infra': 'var(--cat-ai)',
  geopolitics: 'var(--cat-geopolitics)',
  positioning: 'var(--cat-positioning)',
  regulation: 'var(--cat-regulation)',
  society: 'var(--cat-society)',
  em: 'var(--cat-em)',
};
function catColor(cat) {
  if (!cat) return 'var(--cat-default)';
  return CAT_VARS[String(cat).toLowerCase()] || 'var(--cat-default)';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function renderBold(text) {
  return escapeHtml(text).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function relativeTime(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const secs = Math.max(0, (Date.now() - dt.getTime()) / 1000);
  if (secs < 60)   return Math.floor(secs) + 's ago';
  const mins = secs / 60;
  if (mins < 60)   return Math.floor(mins) + 'm ago';
  const hrs  = mins / 60;
  if (hrs < 48)    return Math.floor(hrs) + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function pill(cat) {
  if (!cat) return '';
  return `<span class="pill" style="background:${catColor(cat)}">${escapeHtml(cat)}</span>`;
}

function authorTag(name, cls = 'item-author') {
  if (!name) return '';
  return `<span class="${cls}" onclick="filterAuthor('${escapeAttr(name)}')">@${escapeHtml(name)}</span>`;
}

// ---------- rendering ----------
function renderThumbs(images) {
  if (!images || !images.length) return '';
  return `<div class="thumbs">` + images.map(u =>
    `<img src="${escapeAttr(u)}" class="thumb" loading="lazy" alt="" onclick="openLightbox('${escapeAttr(u)}')">`
  ).join('') + `</div>`;
}

function renderItem(item) {
  const author = item.author || item.author_username || '';
  const time = relativeTime(item.created_at);
  const thread = item.is_thread ? '<span class="item-thread">thread</span>' : '';
  const link = item.tweet_url
    ? `<a class="item-link" href="${escapeAttr(item.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="item-card filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${pill(item.category)}
        ${authorTag(author)}
        ${thread}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(item.text || '')}</div>
      ${renderThumbs(item.images)}
    </div>`;
}

function renderClusterItem(it) {
  const author = it.author || it.author_username || '';
  const time = relativeTime(it.created_at);
  const link = it.tweet_url
    ? `<a class="item-link" href="${escapeAttr(it.tweet_url)}" target="_blank" rel="noopener">tweet →</a>`
    : '';
  return `
    <div class="cluster-item filterable" data-author="${escapeAttr(author).toLowerCase()}">
      <div class="item-head">
        ${authorTag(author)}
        ${time ? `<span class="item-time">${time}</span>` : ''}
        ${link}
      </div>
      <div class="item-text">${escapeHtml(it.text || '')}</div>
      ${renderThumbs(it.images)}
    </div>`;
}

function renderCluster(cluster) {
  const itemsHtml = (cluster.items || []).map(renderClusterItem).join('');
  return `
    <div class="cluster">
      <div class="cluster-head">
        ${pill(cluster.category)}
        <div class="cluster-title">${escapeHtml(cluster.title || '')}</div>
      </div>
      ${cluster.description ? `<div class="cluster-desc">${escapeHtml(cluster.description)}</div>` : ''}
      ${itemsHtml ? `<div class="cluster-items">${itemsHtml}</div>` : ''}
    </div>`;
}

function renderLink(l) {
  const author = l.author || l.author_username || '';
  const url = l.url || (l.resolved || l.tco) || '';
  return `
    <div class="link-row filterable" data-author="${escapeAttr(author).toLowerCase()}">
      ${author
        ? authorTag(author, 'link-author')
        : '<span class="link-author">—</span>'}
      <a class="link-url" href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      ${l.description ? `<span class="link-desc">${escapeHtml(l.description)}</span>` : ''}
    </div>`;
}

function renderSection(letter, name, items, type) {
  if (!items || !items.length) return '';
  let body;
  if (type === 'events') {
    body = items.map(renderCluster).join('');
  } else if (type === 'links') {
    body = items.map(renderLink).join('');
  } else {
    body = items.map(renderItem).join('');
  }
  const cls = type === 'contrarian' ? 'section section-contrarian' : 'section';
  return `
    <div class="${cls}">
      <div class="section-head" onclick="toggleSection(this)">
        <span class="section-letter">${letter}.</span>
        <span class="section-name">${escapeHtml(name)}</span>
        <span class="section-count">${items.length}</span>
        <span class="section-arrow">▸</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function renderSummary(text) {
  if (!text) return '';
  const paragraphs = String(text).split(/\n\n+/).filter(Boolean)
    .map(p => `<p>${renderBold(p)}</p>`).join('');
  return `<div class="summary">${paragraphs}</div>`;
}

function renderStats(d) {
  const s = (d && d.stats) || d || {};
  const parts = [];
  if (s.received    != null) parts.push(`received <strong>${s.received}</strong>`);
  if (s.after_filter!= null) parts.push(`after filter <strong>${s.after_filter}</strong>`);
  if (s.authors     != null) parts.push(`authors <strong>${s.authors}</strong>`);
  if (s.coverage    != null) {
    const pct = (s.coverage <= 1 ? s.coverage * 100 : s.coverage);
    parts.push(`coverage <strong>${pct.toFixed(0)}%</strong>`);
  }
  return parts.join(' | ');
}

// ---------- interactions ----------
function toggleSection(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function openLightbox(src) {
  const img = document.getElementById('lightbox-img');
  img.src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

let activeFilter = null;
function filterAuthor(name) {
  if (!name) return;
  activeFilter = String(name).toLowerCase();
  document.querySelectorAll('.filterable').forEach(el => {
    const a = (el.dataset.author || '').toLowerCase();
    if (a === activeFilter) {
      el.classList.add('match');
      el.classList.remove('dim');
    } else {
      el.classList.add('dim');
      el.classList.remove('match');
    }
  });
  document.getElementById('filter-name').textContent = '@' + name;
  document.getElementById('filter-bar').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearFilter() {
  activeFilter = null;
  document.querySelectorAll('.filterable').forEach(el => {
    el.classList.remove('match');
    el.classList.remove('dim');
  });
  document.getElementById('filter-bar').classList.remove('active');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    } else if (activeFilter) {
      clearFilter();
    }
  }
});

// ---------- schema normalization ----------
// Some producer runs emit the "sections" schema documented in the routine
// spec (report_type/input_stats/sections.A_events.../coverage) instead of
// the flat schema this renderer reads (date/events/insights/contrarian/
// positioning/links/stats). Normalize so either shape renders correctly.
function firstOf(v) {
  return Array.isArray(v) ? v[0] : v;
}

function normalizeItem(it) {
  if (!it || typeof it !== 'object') return it;
  return {
    author: it.author || it.author_username,
    text: it.text != null ? it.text : it.summary,
    category: firstOf(it.category),
    tweet_url: firstOf(it.tweet_url),
    images: it.images,
    created_at: it.created_at,
    is_thread: it.is_thread != null ? it.is_thread : (it.type === 'thread'),
  };
}

function normalizeData(d) {
  if (!d || typeof d !== 'object') return {};
  const hasFlat = d.events || d.insights || d.contrarian || d.positioning || d.links || d.stats;
  if (hasFlat) return d;

  const s = d.sections;
  if (!s) return d;

  const out = Object.assign({}, d);
  out.date = d.date || (d.collected_at ? String(d.collected_at).replace('T', ' ').replace('Z', ' UTC') : '');
  if (s.A_events) {
    out.events = s.A_events.map(cl => ({
      title: cl.cluster || cl.title,
      category: firstOf(cl.category),
      description: cl.description,
      items: (cl.items || []).map(normalizeItem),
    }));
  }
  if (s.B_insights) out.insights = s.B_insights.map(normalizeItem);
  if (s.C_contrarian) out.contrarian = s.C_contrarian.map(normalizeItem);
  if (s.D_positioning) out.positioning = s.D_positioning.map(normalizeItem);
  if (s.E_links) {
    out.links = s.E_links.map(l => ({
      author: l.author,
      url: l.url,
      tweet_url: firstOf(l.tweet_url),
      description: l.note || l.description,
    }));
  }
  const stats = d.stats || {};
  out.stats = {
    received: stats.received != null ? stats.received : (d.input_stats && d.input_stats.total_tweets),
    after_filter: stats.after_filter != null ? stats.after_filter : (d.input_stats && d.input_stats.after_noise_filter),
    authors: stats.authors != null ? stats.authors : (d.coverage && d.coverage.authors_total),
    coverage: stats.coverage != null ? stats.coverage : (d.coverage && d.coverage.coverage_pct),
  };
  return out;
}

// ---------- main ----------
function renderReport(d) {
  d = normalizeData(d);
  if (!d || typeof d !== 'object') d = {};
  document.getElementById('report-date').textContent = d.date || '';
  const sections = [
    renderSummary(d.summary),
    renderSection('A', 'Events & Reactions',      d.events,                                'events'),
    renderSection('B', 'Alpha & Insights',        d.insights || d.alpha,                   'items'),
    renderSection('C', 'Contrarian Views',        d.contrarian,                            'contrarian'),
    renderSection('D', 'Positioning & Trade Ideas', d.positioning,                         'items'),
    renderSection('E', 'Link Queue',              d.links,                                 'links'),
  ].join('');
  const app = document.getElementById('app');
  app.innerHTML = sections || '<div class="empty">No report data.</div>';

  // Auto-open first two sections.
  document.querySelectorAll('.section').forEach((s, i) => {
    if (i < 2) s.classList.add('open');
  });

  document.getElementById('stats').innerHTML = renderStats(d);
}

renderReport(REPORT_DATA);
</script>
