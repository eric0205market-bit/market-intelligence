var COLORS={"macro":"#e24b4a","credit":"#378add","positioning":"#ef9f27","AI/infra":"#1d9e75","crypto":"#7f77dd","geopolitics":"#d85a30","energy":"#f97316","tech":"#06b6d4","gold":"#d4a017","culture":"#ec4899","labor":"#8b5cf6","regulation":"#64748b","science":"#14b8a6","venture":"#84cc16"};
var UEMO={"act":"🔴","deep":"🔵","watch":"🟡"};
var state={cat:"all",urg:"all",src:null};
function col(c){return COLORS[c]||"#6b7280";}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function copyTweet(itemId, which) {
  var item = ITEMS.find(function(i) { return i.id === itemId; });
  var text = which === 'a' ? item.tweetA : item.tweetB;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  var btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
}
function hexA(h,a){var r=parseInt(h.substr(1,2),16),g=parseInt(h.substr(3,2),16),b=parseInt(h.substr(5,2),16);return "rgba("+r+","+g+","+b+","+a+")";}
function cardHTML(item){
  var c=col(item.cat);var ch=item.charts||{count:0};
  var icon=ch.hot?" 🔥":(ch.count>0?" 📊":"");
  var h='<div class="card'+(ch.hot?' hot':'')+'" id="card'+item.id+'" data-id="'+item.id+'">';
  h+='<div class="hd" onclick="toggleCard('+item.id+')"><span class="num">#'+item.id+'</span><span>'+UEMO[item.urgency]+'</span>';
  h+='<span class="src" style="background:'+c+'">'+esc(item.source)+'</span><span class="cat">'+esc(item.cat)+'</span><span>'+icon+'</span>';
  h+='<span class="ttl">'+esc(item.title)+'</span></div><div class="bd">';
  h+='<div class="lbl">the idea</div><div class="idea">'+esc(item.idea)+'</div>';
  h+='<div class="lbl">my angle</div><div class="angle" style="border-color:'+c+';background:'+hexA(c,0.08)+'">'+esc(item.angle)+'</div>';
  h+='<div class="tw"><div class="twb"><div class="twl" style="color:#378add">TWEET A <button class="copy-btn" onclick="copyTweet(' + item.id + ',\'a\')">📋 Copy</button></div>'+esc(item.tweetA)+'</div>';
  h+='<div class="twb"><div class="twl" style="color:#7f77dd">TWEET B <button class="copy-btn" onclick="copyTweet(' + item.id + ',\'b\')">📋 Copy</button></div>'+esc(item.tweetB)+'</div></div>';
  if(ch.count>0||ch.desc){h+='<div class="chart'+(ch.hot?' hotc':'')+'">'+(ch.hot?'🔥 CHART WORTH SAVING — ':'📊 ')+ch.count+' chart(s): '+esc(ch.desc||'')+'</div>';}
  h+='<a class="lnk" href="'+esc(item.link)+'" target="_blank" rel="noopener">↗ Read full article</a></div></div>';
  return h;
}
function toggleCard(id){document.getElementById('card'+id).classList.toggle('open');}
function visible(i){if(state.src)return i.source.indexOf(state.src)>=0;return (state.cat==="all"||i.cat===state.cat)&&(state.urg==="all"||i.urgency===state.urg);}
function render(){
  var html="";var n=0;
  ITEMS.forEach(function(i){if(visible(i)){html+=cardHTML(i);n++;}});
  document.getElementById('cards').innerHTML=n?html:'<div class="empty">No items match.</div>';
  if(state.src){ITEMS.forEach(function(i){if(visible(i))document.getElementById('card'+i.id).classList.add('open');});}
  renderBars();
}
function renderBars(){
  var cats={};ITEMS.forEach(function(i){cats[i.cat]=(cats[i.cat]||0)+1;});
  var b='<span class="pill'+(state.cat==="all"&&!state.src?' active':'')+'" style="'+(state.cat==="all"&&!state.src?'background:#1f2328':'')+'" onclick="setCat(\'all\')">All '+ITEMS.length+'</span>';
  Object.keys(cats).forEach(function(c){var a=state.cat===c&&!state.src;b+='<span class="pill'+(a?' active':'')+'" style="'+(a?'background:'+col(c):'')+'" onclick="setCat(\''+c+'\')">'+esc(c)+' '+cats[c]+'</span>';});
  document.getElementById('catbar').innerHTML=b;
  var u={act:0,deep:0,watch:0};ITEMS.forEach(function(i){u[i.urgency]++;});
  var lab={all:"All",act:"🔴 Act Now",deep:"🔵 Deep",watch:"🟡 Watch"};
  var ub="";["all","act","deep","watch"].forEach(function(k){var a=state.urg===k&&!state.src;ub+='<span class="pill'+(a?' active':'')+'" style="'+(a?'background:#1f2328':'')+'" onclick="setUrg(\''+k+'\')">'+lab[k]+' '+(k==="all"?ITEMS.length:u[k])+'</span>';});
  document.getElementById('urgbar').innerHTML=ub;
}
function setCat(c){state.cat=c;state.src=null;render();}
function setUrg(u){state.urg=u;state.src=null;render();}
function filterBySrc(name){state.src=name;render();window.scrollTo(0,0);}
function init(){
  document.getElementById('sub').textContent=META.date+" · "+META.time+" · "+ITEMS.length+" items";
  var r='<div class="lbl">time window</div><div style="font-size:13px">Window: '+esc(META.windowStart)+' to '+esc(META.windowEnd)+'. Emails outside this window were not processed.</div>';
  r+='<div class="lbl">included sources</div><ul>';
  META.includedSources.forEach(function(s){r+='<li><span class="srcl" data-src="'+esc(s.name)+'" onclick="filterBySrc(this.getAttribute(\'data-src\'))">'+esc(s.name)+'</span> — '+s.items+' item(s)</li>';});
  r+='</ul><div class="lbl">skipped sources</div><ul>';
  META.skippedSources.forEach(function(s){r+='<li>'+esc(s.name)+' — '+esc(s.reason)+'</li>';});
  r+='</ul><div class="lbl">totals</div><div style="font-size:13px">Emails in window: '+META.emailsInWindow+' · Emails read: '+META.emailsRead+' · Items extracted: '+META.itemsExtracted+'</div>';
  if(META.notes)r+='<div style="font-size:12px;color:#6b7280;margin-top:6px">'+esc(META.notes)+'</div>';
  document.getElementById('repbody').innerHTML=r;
  render();
}
init();
